      <p>Nick: '[...] I think that’s suitable outreach to the masochists [...]'</p>
      <p>Thanks. At an early stage of the development of FM we discussed the necessity of the support for (Python) scripting. I had my doubts and basically the statement of the programmers was, that most of the batch functions we could think of could be implemented directly and controlled by simple (command) files. So, we decided not to implement scripting-support.</p>
      <p>Command files as shown above will be generated automatically by DataMaster when the selections have been made and fonts are generated. The results can be listed and saved. If one uses a fixed system, copying and renaming the command files is enough for further use, of course.</p>
      <p>Another example how simple things can be controlled in FM, is generating (unlimited numbers of) composites. The following file shows respectively target position in the glyph database, base character and accent. </p>
      <p>-------------------------------------------------<br>
      // For generating composite characters<br>
      // Version 1.0<br>
      // Last change: 29 April 2004 by FEB<br>
      // URWNum;URWComp;URWComp<br>
      201;101;701<br>
      202;101;704<br>
      203;101;705<br>
      204;101;706<br>
      205;101;707<br>
      206;101;708<br>
      207;101;709<br>
      208;101;703<br>
      209;101;713<br>
      210;103;et cetera<br>
      -------------------------------------------------</p>
      <p>The dialog can be used for further positioning. One can use different files for different positioning, of course.<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Comp_scrndmp_5488.gif"></div><br>
      &nbsp;<br>
      Touring the Hermitage was a good alternative, I reckon. Personally I liked especially the small paintings by Jan Brueghel the Elder ('Velvet Brueghel') there.<br>
      &nbsp;<br>
      So far I had no plans for TypeCon, to be honest.<p></p>
