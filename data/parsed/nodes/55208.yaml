      <p><cite>Although there always will be room for discussing how much is actually art or plain craftsmanship, at the end type design and font production are industrial design by definition. Perhaps some sorts or lettering can be seen as pure forms of art, but the clear purpose of type, i.e. casting written information in the best possible mould, defines clear requirements and subsequently makes restrictions inevitable.</cite></p>
      <p>Sorry to go a little OT, but this sounds very unlikely to me, considered the term "industrial design" has been coined in the 20th century, while simple mechanization of various aspects of writing has existed almost since the alphabet has been invented (even the simple idea of models for calligraphic styles or abecedaries is halfway to "mechanization").</p>
      <p>So, I just wish to say that, if not for the Macintosh, I would probably not even be using a computer.<br>
      What created a feeling of "friendliness" around the computer as a tool has largely been the intuition of Steve Jobs and Apple in using a graphic interface like they did.<br>
      That, of course, is for good and for the bad, since as a result we have illiterate people creating weblogs, but the same as happened as the book stopped being costly and became economic…</p>
      <p>Digital masochism, it appears to me, is everywhere, and we would not even have silly terms like "masochism" or "sadism" if the industrial production of the book was not already there when Krafft-Ebing lost himself in the "technicalities" of his own medical thought.</p>
