      <p>Frank, </p>
      <p>I did not realize that it was an attempt to lure me into a FM vs. FLS debate :) I'm not going to have one. </p>
      <p>We do have FontLab Studio 6 in the works that will support AFDKO 2.5 and will have automatic generation of OpenType Layout features. Like in any market situation, the innovation comes from various angles. </p>
      <p>For example, in 1996, FontLab 3 was the first commercially available application that could convert hinted PostScript outlines into high-quality TrueType delta hinting and at the same time provided a visual interface for manual hinting (other publicly available applications either permitted completely automatic hinting conversion with no possibility of manual intervention, or they provided a GUI for manual hinting but required the user to always start from scratch). 12 years have passed and not much has changed: FontLab Studio 5 is still pretty much the only application that has this ability while delivering very high screen quality with either no or very minimal user intervention. </p>
      <p>Conversely, URW Kernus, and later DTL KernMaster, have been a very able autokerning solution that I believe does not have a match among other applications. </p>
      <p>Another example: in 2001, FontLab 4 was the first application that could decompile binary OpenType Layout table code in the Adobe FDK syntax. 3-4 years ago, FontForge added this ability, and now we have DTL OTMaster that also has this feature -- which I think is wonderful (of course OTMaster is a different kind of product, unique in its kind). </p>
      <p>Conversely, DTL FontMaster has been able to automatically create OpenType Layout features for some time, and soon FontLab Studio will be able to do that as well. </p>
      <p>So, some features are pioneered by one vendor and are later implemented by others. Other features remain distinctive for a long time — there is hardly a chance that there ever will be a one-vendor solution "to rule them all". </p>
      <p>I'm very glad that we have several products on the market and that they are in competition. Although I'm particularly refreshed by your notion "Although a couple of hundred or even thousand bucks may perhaps look like a lot of money for the end user, a software company that fully relies on the sales has to sell a lot for even providing sufficient support, let alone continuing the development." </p>
      <p>I believe that the problem "between FL and FM" is not that they're direct competitors — but rather that switching between them indeed involves a change of the entire workflow. As I have stated on numerous occasion, I would be more than happy if FontLab and DTL could collaborate more than we compete. I believe that there are enough type designers and font developers in the world who would be willing to purchase tools from both our companies *if* those tools worked together in a reasonable manner. </p>
      <p>At the ATypI conference in St Petersburg, I proposed a first step in this direction: a file format that would allow interchange of font sources between various font development applications (FontLab, DTL, FontForge, Robofab etc.). We hope to continue this discussion. </p>
      <p>&gt; I can’t speak for FontLab Studio 7, but I am pretty<br>
      &gt; sure that DTL FontMaster 4.0 will generate the same<br>
      &gt; metrics (the underlying system is in use for more<br>
      &gt; than thirty years now and has proven to be very<br>
      &gt; reliable and consistent).</p>
      <p>Including the "hdmx" (horizontal device metrics) table in TrueType-flavored OpenType fonts? Which was what I was primarily referring to, of course. I would be actually surprised to hear that your screen-rendering-related settings haven't changed at all despite developments such as ClearType. The stability issue is often in the fiddly bits, and it is, by its nature, in conflict with progress. So sometimes, people (users or software developers) have to make choices. </p>
      <p>In fact, I have found that balancing out the two directions: "preserve" vs. "fix/improve", with regard to pretty much everything in fonts, has been the biggest challenge when developing FontLab Studio. How to make things better for some users without breaking stuff for others? This is one of the reasons why FontLab Studio has so many bloody options :) But people will see some good changes in this regard soon. </p>
      <p>&gt; Kerning is a different issue, of course, because<br>
      &gt; normally the kerning is fixed data and a revision<br>
      &gt; would imply a changed font.</p>
      <p>"Normally", perhaps, but as you probably know, in OpenType fonts, kerning can exist in two forms ("kern" table and "GPOS" table), and there are fonts which make use of both at the same time, there are others that only use one. Also, there is contextual kerning, GPOS extension format and all those new things that change and evolve. There are some designers who are conservative and others who like to delve into the novelty realm. </p>
      <p>&gt; ’[...] Now I only wish that VOLT, VTT, Microsoft Font Validator<br>
      &gt; and of course DTL FontMaster supported Python as well [...]’<br>
      &gt; I am afraid that you completely missed my point; please<br>
      &gt; re-read my other contributions to this topic ;-).</p>
      <p>I may very well have. Or perhaps, I simply have a different view on this. I have always considered FontLab Studio in two ways: as a standalone product, good as it is, as well as a catalyzer for new developments. As a company, we have contributed (only a tiny bit) to the development of Robofab, and I have helped developers of packages such as FontTools/TTX (Just van Rossum) or Remix Tools (Tim Ahrens) — but the direction in which those applications developed into, the talent they have gathered around them, the new ideas they generated simply left me speechless. I always realized that one centralized entity cannot generate the energy and ideas comparable to a diverse ecosystem. This is why I had my hopes that such ecosystem would develop — and so it happened. FontLab Studio is part of it, and Python is the "aether". It's not just about automation, it's about taking it to a fully new level, being able to tackle design problems from completely different angles, developing alternative user interfaces. </p>
      <p>(I wish I could have attended the Robothon conference that is taking place in The Hague, and which is a gathering place of some of the people who are developing bits and pieces of that ecosystem I mentioned. I was struck down by a viral infection, so I had to stay home. But there will be podcasts of the recorded sessions available, so I've heard.)</p>
      <p>Best,<br>
      Adam</p>
