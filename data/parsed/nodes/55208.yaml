      <p><cite> Considering that everything only exists because of our awareness, for instance for those who lived before the moment that Newton became aware of the attraction between mass, which he coined gravitation, this force and subsequently term simply didn’t exist. But we know gravitation existed long before the end of the 17th century though. </cite></p>
      <p>With the due difference gravitation is a intrinsic natural force, while you couldn't have an "industrial" product, like typefaces, as there was no "industry", as the term is conceived now.<br>
      I just don't like terms which presume to address "in a better way" an intrinsic reality. It would be like calling "gravitation" "illusion of weight" and then go on this way…</p>
      <p>As you see, it becomes a sort of existential question, or better it becomes a question of a "paradigm shift", and if I have to reply Randy, the only reason for which I don't like so much studying (some) more tecnical aspects of digital type creation, it's because of the bad use of time I see made around me by ignorant designers (not ordinary people) which often do not care at all about the effective quality of a digital product. Ironically enough, as long as you specialize excessively in a discipline, you lose sight of the overall picture, and so I think it's always good to learn, but with a critical perspective on how delving in specialized territory could become tricky.</p>
      <p><cite> In addition, sometimes Visual Joe’s get in over their heads and need to hire a Ninja to beat up their problem. </cite></p>
      <p>Or bug him for help (as participants to this thread know too well… :=( )</p>
