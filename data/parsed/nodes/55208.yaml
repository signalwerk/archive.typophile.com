      <p>Nick: '[...] there are a lot of Mac-centric type designers from an arts background who are uncomfortable having their work increasingly directed to the left side of the brain, all numbers and code.'</p>
      <p>Although there always will be room for discussing how much is actually art or plain craftsmanship, at the end type design and font production are industrial design by definition. Perhaps some sorts or lettering can be seen as pure forms of art, but the clear purpose of type, i.e. casting written information in the best possible mould, defines clear requirements and subsequently makes restrictions inevitable.<br>
      So, a type designer and/or font producer can't completely circumvent the numbers and code part, but, as I have tried to explain in this topic, many complex tasks can be simplified (basically hidden) by the font production software.</p>
      <p>Karsten: '[...] So having a closer look at different tools may reveal the implicit understanding of what we consider as the essence of what we create [...]'<br>
      '[...] I don’t expect everybody nor even anybody to fit into this scheme, yet it is the basis for my judgement. [...]'</p>
      <p>I highly value Karsten's opinion and I like his theoretical and sometimes even philosophical approaches, especially knowing that he is also a very practical guy. The latter is explicitly proven by Karsten in his <a href="http://www.fontmaster.nl/pdf/OTM_manual.zip" rel="nofollow">OTM Manual</a>, especially in the part where he compactly describes the OpenType Font Tables.<br>
      Also I learned to know him as being completely impartial and an independent thinker. And although the first priority is to get one's job done, for future developments it is necessary to constantly re-think matters.</p>
      <p>James: '[...] But most designers don’t have your clientele. [...]'</p>
      <p>That does not by definition imply that taking at least a closer look at the applications and the layout capabilities John described, could not also be useful for producing fonts for other sorts of clientele than John's. It might perhaps even help to enhance one's business, I guess.</p>
      <p>John: '[...] I’d like a switch [...]'</p>
      <p>Yes, a switch for either ignoring or reporting lookups for (deliberately) omitted characters makes sense for controlling the consistency of fonts –and has been added to the wish list accordingly.</p>
