      <p>Adam: <em>...in OpenType fonts, kerning can exist in two forms (“kern” table and “GPOS” table), and there are fonts which make use of both at the same time, there are others that only use one.</em></p>
      <p>Although I have made such fonts with both kern table and GPOS kerning, at the request of clients, I think it is a really bad idea. As Frank says, if kerning changes that implies that a different font is in use. Since there are built-in incompatibilities between the kern table and GPOS kerning models -- such that only in a very simple font, with no GPOS kerning for unencoded glyph variants and no contextual kerning, could the two sets of kerning data be completely compatible -- what one in effect does is to disguise two fonts as a single font while surrendering control over which font is used to the mercy of the application. It is a pretty much guaranteed recipe for document reflow.</p>
