      <p>Nick: '[...] how are you going to convince someone like me, who has an aversion to code [...]'</p>
      <p>The rules for the command files language-structure and other supporting files in FM are fairly simple. The following command file generates OpenType Pro fonts with an Adobe Standard Encoding ('PostScript-Number') from all BE files (and related files like UFM and AFM) that are residing in a certain directory. </p>
      <p>--------------------------------------------------------------------------------------<br>
      # DTL DataMaster 2.5.2 Command File<br>
      # DTL Prokyon CFF TPRO<br>
      # Last update: 4 December 2006</p>
      <p># Select Character Layout File and Code Page.<br>
      CharacterLayoutFile FontProduction:FontMaster:Support_Files:Character Layout files:OpenType:Pro:pro_otf.cha<br>
      CharacterLayoutCodePage PostScript-Number</p>
      <p># Set Basic Em-Square.<br>
      BasicEmSquare 1000</p>
      <p># Select Basic Format.<br>
      BasicFormat BE Format</p>
      <p># Select Basic Font Directory.<br>
      BasicFontDirectory FontProduction:FontMaster:Aanmaak:Prokyon:Mac OS:OpenType:Pro</p>
      <p># Select Basic Font(s).<br>
      SelectBasicFont all</p>
      <p># Set up Target Directories for all Export Formats.<br>
      ExportFontFormat OpenType (CFF)<br>
      ExportTargetDirectory FontProduction:FontMaster:Aanmaak:Prokyon:Mac OS:Result:OTF</p>
      <p># Select Export Format.<br>
      # NOTE : This will also select the related target directory.<br>
      ExportFontFormat OpenType (CFF)</p>
      <p># Avoid Export Font Dialog.<br>
      ExportSkipDialog true</p>
      <p># Avoid existing file overwrite confirmation dialog.<br>
      OverwriteExistingFiles true</p>
      <p># Start Font Export.<br>
      StartFontExport<br>
      --------------------------------------------------------------------------------------</p>
      <p>This command file generates all Western European PostScript Type1 fonts for DTL Prokyon Condensed:</p>
      <p>--------------------------------------------------------------------------------------<br>
      # DTL DataMaster 2.6.1 Command File<br>
      # DTL ProkyonCon PS Type1 West all<br>
      # 19 July 2007</p>
      <p># Activates following command files:<br>
      CommandOpen FontProduction:FontMaster:Support_Files:Batch files:Production files:ProkyonCon:PS1 Mac OS:West:ProkyonCon_PS1_All.cmd</p>
      <p>CommandOpen FontProduction:FontMaster:Support_Files:Batch files:Production files:ProkyonCon:PS1 Windows:West:ProkyonCon_PS1_All.cmd</p>
      <p># End listing<br>
      --------------------------------------------------------------------------------------</p>
      <p>by calling other batch command files, such as:</p>
      <p>--------------------------------------------------------------------------------------<br>
      # DTL DataMaster 2.6.1 Command File<br>
      # DTL ProkyonCon PS Type1 West all Mac OS<br>
      # Last update: 19 July 2007</p>
      <p># Activates following command files:<br>
      CommandOpen FontProduction:FontMaster:Support_Files:Batch files:Production files:ProkyonCon:PS1 Mac OS:West:ProkyonCon_PS1_Standard.cmd</p>
      <p>CommandOpen FontProduction:FontMaster:Support_Files:Batch files:Production files:ProkyonCon:PS1 Mac OS:West:ProkyonCon_PS1_Special.cmd</p>
      <p>CommandOpen FontProduction:FontMaster:Support_Files:Batch files:Production files:ProkyonCon:PS1 Mac OS:West:ProkyonCon_PS1_SmallCaps.cmd</p>
      <p># End listing<br>
      --------------------------------------------------------------------------------------</p>
      <p>et cetera.</p>
      <p>--------------------------------------------------------------------------------------</p>
      <p>Over time I built a hierarchic (and fixed) system to control the DTL library. In <a href="http://www.fontmaster.nl/pdf/FM_docs/FM_Easy%20automation.pdf" rel="nofollow">FM: Automation at your fingertips</a> I tried to explain the structure somewhat more.</p>
