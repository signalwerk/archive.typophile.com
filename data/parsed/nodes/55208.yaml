      <p>When it comes to naming, keep in mind that plenty of us are just sending the fonts to someone else who deals with that mess so that we don’t have to. </p>
      <p>That said, I think that many type designers don’t know the first thing about DTL products because as we come into the field we learn Fontlab, Fontlab, and Fontlab. Any time I’ve talked to people about DTL software the answer is the same—it’s specialized stuff used by big foundries and too expensive for individual designers. Fontlab hasn’t just taken over the industry by luck; Adam and Ted are out there pushing the software and training users at conferences and online in a way that DTL is not. Maybe if DTL evangelized its software better more people would start using it. Send someone to Typecon to teach a class.</p>
      <p>Price is another issue. Fontlab is far less expensive than DTL software. I think that many type designers aren’t selling enough fonts to break even if they spring for the DTL software. The designers who are probably have the knowledge/skill to work around software issues, or they use an ADFKO/VOLT workflow and don’t need to bring more software into the picture. I would much rather spend some time find answers online or by trial-and-error than by dropping €2,000 on Fontmaster or even just €255 on OTM. </p>
      <p>Edit: I’m not claiming that the DTL software is not worth buying, simply pointing out that one must be selling a lot of fonts to afford it.</p>
