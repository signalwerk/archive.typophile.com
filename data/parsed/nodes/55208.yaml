      <em>— The UFO applications.</em> AFAIK, the philosophy behind UFO-based applications is to have one tool per each well defined step in the font production workflow. Which is exactly FM's philosophy of offering separate modules.<br>
      <em>— The price.</em> I do not regard this as a valid argument since whatever helps saving time is worth its price, but since it pops up frequently: If I license FLS, ScanFont, Metrics Machine, Pre- and Superpolator and various other UFO applications shown at RoboThon, I easily pay as much or more than for the FM suite.</p>
      <p>To make one thing clear: I like the UFO format and the applications too because they provide great interfaces for dealing with tendious tasks, like Metrics Machine for manual kerning or Prepolator for making masters compatible with each other. Because their interfaces make it easier to understand rather abstract ideas, like Superpolator visualizes interpolation in a multi-dimensional design space. Because UFOstretch combines interpolation and scaling in a single UI -- which combination, by the way, is what Tim Ahrens' RMX tools did before albeit behind the curtains. What I dislike, however, is adhering to some myths -- this app for Visual Joe, that one for the Font Ninja -- when a quick look at different formats and tools would easily prove them to be wrong. Remember that when FOG was still around it was actually FLS that was considered <em>the</em> camp 2 application?&nbsp;&nbsp;:D</p>
      <p>I also want to add that this <a href="/node/55673/" target="_blank" rel="nofollow">RoboThon</a> was, of all conferences I have attended, the best and most stimulating one. I have never before seen more new tools and ideas in only two days. It is not hard to predict that the next few years are going to be terribly exciting.</p>
