      <p>Haha! I meant no offense to Nick and was teasing Chris (whom I will now offend by demoting to Visual Joe 2nd Class). Note to self: should have called everyone a ninja... and used the belt system. </p>
      <p><em>Frank: This topic is not only about the non-technical versus the ’Ninjas’, but above all about the willingness to discuss one’s workflow and to look for improvements.</em></p>
      <p>Good point! The reason I brought up different types of users is that as a mere Orange Belt Ninja (with two stripes!) my process will be much different than John's because our client demands are different. I see how your module system attempts to meet the needs of both, but after exploring your site for 1/2 hour, I confess it is not evident what products I would need from your offering. I perceive some overlap between them (am I imagining this?) and I also spent some time looking for the main FontMaster program that all these modules plug into (but I think I'm imagining that too). </p>
      <p>While it may not be the best idea to frame your products with my ninja foolishness, it may be helpful to clearly state what combination of products would suit a class of user, or what products are required to produce what kind of font. Packages, targeted at segments of the market (or something) to make your offering more straightforward. In a sense, this is what Fontlab has done.. TypeTool, Fontlab, Asia Font Studio and it makes sense to me.</p>
      <p>*Hang on* Where is my copy of "Learn FontMasterUtilites Fast!" by Leslie Cabarga?</p>
