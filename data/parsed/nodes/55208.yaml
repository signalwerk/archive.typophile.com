      <p>Frank, </p>
      <p>to address your initial question: there is a number of type design applications: FontLab Studio/TypeTool, FontLab Fontographer, DTL FontMaster, FontForge, FontCreator -- just to name a few. Some cover only a partial task such as AFDKO, VOLT, VTT or ftxenhancer. And there are new coming, such as FontShop's FontStruct, Kalliculator etc. And there is a number of tools we don't even know about (for example custom tools for CJK font development). </p>
      <p>But they all meet at one low level: the final font file. If we put Type 1 aside and concentrate just on OpenType/TrueType. Each of those tools has some quirks, also both those tools and the applications in which people use fonts evolve. </p>
      <p>For example, right now, the OS/2.TypoLineGap value isn't used by any application that I know of. But at some point, it will start being used -- and then font developers may discover that they originally put wrong values there. The values were wrong but they went undiscovered for years. How do I fix such a problem? Rebuilding the entire font that possibly went through a multiple-application workflow is risky: are you sure that DTL FontMaster 4.0 or FontLab Studio 7 will generate exactly the same metrics and kerning that the versions "–2"? But what if you really want to maintain those, and you only want to fix that one particular problem? </p>
      <p>Then, of course, a GUI tool such as DTL OTMaster, or a commandline tool such as TTX, that operate on the final fonts, can be of great assistance. </p>
      <p>Also, none of the tools on the market for "high level" type design will ever give you the ability to do "everything perfectly". Some tools may let you do everything adequately, and some tools may let you do a few things perfectly, so you need to combine tools somehow. And then — well, the final font format is the only common denominator we've got. </p>
      <p>You write "the statement of the programmers was, that most of the batch functions <em>we could think of</em> could be implemented directly" (my emphasis). </p>
      <p>Now, Python is useful for automating tasks, of course, but the really nice thing about this powerful yet simple programming language is that it is what it is: a powerful yet simple <em>programming language</em>. So my experience with Python is: thanks to its support in FontLab Studio, people have implemented functions that <em>we never have thought of</em>. And that is the real joy and power. </p>
      <p>FontLab Studio, TransType, FontForge, Adobe FDK for OpenType, FontTools/TTX, Metrics Machine, Superpolator, Remix Tools, FeatureProof — they all use Python, and therefore can all "talk to each other". Now I only wish that VOLT, VTT, Microsoft Font Validator and of course DTL FontMaster supported Python as well :) </p>
      <p>A.</p>
