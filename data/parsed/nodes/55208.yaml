      <p>James:<br>
      '[...] plenty of us are just sending the fonts to someone else who deals with that mess [...]'</p>
      <p>Sometimes I get the feeling that people in the font business have to act for a living like the two male musicians in the brilliant Pixar animation <em>One Man Band</em>. I reckon that also much profit vaporizes in case hired 'command line wizzards' have to deal with font naming and other technical issues that should not be to difficult to handle in the first place.</p>
      <p>'[...] Fontlab hasn’t just taken over the industry by luck [...]'</p>
      <p>Mostly that is true, I reckon, although we were at some stage somewhat unluckily hampered by a compiler, which was not updated to support OS X. Nevertheless Adam and Ted and the others did a good job, that's for sure.<br>
      The DTL FontMaster tools are more specialized niche products anyway and ask for a different approach from the user and I don't think that we are actually capable of giving extensive basic support like FontLab Ltd offers.</p>
      <p>'[...] Price is another issue. [...]</p>
      <p>Although a couple of hundred or even thousand bucks may perhaps look like a lot of money for the end user, a software company that fully relies on the sales has to sell a lot for even providing sufficient support, let alone continuing the development. The market for font editors is not that big and even if a company controls this market, I would not be surprised if it is difficult to have a constant stream of revenues.<br>
      Furthermore prices are relative. If for instance Euro 255 is too much for a program that makes editing tables as easy as possible and makes generating 'GPOS' and 'GSUB' tables a piece of cake, I wonder what hiring experts for these jobs costs.<br>
      The standard batch support in FM can save a lot of time, i.e. money, of course. For some people the price for the full set perhaps looks expensive, but for this one gets a solid product and basically unlimited support and supply when it comes to command files, features files, kern files, et cetera.</p>
      <p>By the way, the DTL Bezier- and IkarusMaster modules are fully functional on their own, have built-in single glyph/single font improvers, batch functionality (metrics, composites, et cetera), can be used to generate 'automatically featured' OpenType fonts (although not in batch) and cost only Euro 382,50.</p>
      <p>Anyway, even for those who don't use FM, it is good that there is at least the option of an alternative font editor, i.e. competition.</p>
      <p>'[...] Edit: I’m not claiming that the DTL software is not worth buying, simply pointing out that one must be selling a lot of fonts to afford it. [...]'</p>
      <p>Even without this edit, I appreciate your comments –as I enjoy any discussion.<br>
      Thanks.</p>
