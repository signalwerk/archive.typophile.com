    <p>I am designing a book for my mom who wrote a short biography on my grandpa and still can’t decide on the typeface I should use for the content. </p>
    <p>*Information<br>
    He was a Polish immigrant who got captured in the second World War by the Germans for five years. He came to Canada afterwards where he started a family. He loved to fish and read history books.</p>
    <p>I was thinking of using a script typeface for headings and a serif for the body. Any suggestions of typefaces that may relate to Polish roots or can tell a similar story to the information provided would be greatly appreciated. </p>
    <p>For more ideas, I attached his family coat of arms.</p>
