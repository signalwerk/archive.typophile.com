    date_raw: 22.Dec.2007 6.09am
    votes: null
    html: <p>Monotype Spectrum is too delicate and wimpy for snappy use below 11pt, and, crucially, it lacks default-loaded oldstyle figures; the roman ones are segregated in expert fonts, in the tedious old way. OpenType Janson much, much better. What about Linotype Sabon with oldstyle figures? And be sure to look at Joshua Darden’s Corundum, his re-think of Fournier.</p>
