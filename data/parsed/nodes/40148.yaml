      <p>I really do appreciate all of the suggestions. </p>
      <p>I have done a little more research and narrowed down my choices for the body copy either to be Janson Text or Spectrum MT. I am leaning more towards Spectrum but have a hard time trying to find a complementary typeface in a script face. Clairvaux was a possibility for chapter headings and the title page but it doesn’t seem to look appropriate. I may just end up choosing a sans serif to be safe. </p>
      <p>Any more help would be great… either way I am sure I will be okay choosing. </p>
      <p>Thanks again</p>
