    html: <p>For body copy, I can second Atlantica and add Storm Foundry’s Regent II, which has a marvelous Old World feel without hitting you over the head...plus Janson Text from Adobe (OpenType version with oldstyle figures)...and Linotype Sabon with oldstyle figures is always elegant and suitable for books. And ITC Bodoni Twelve if you want a more mid-19th-century look.</p>
