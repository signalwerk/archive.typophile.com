    html: <p>Kyle,  <br> <br>I believe you that this isn't a scam, but anyone in the world can read the posts on this forum. So, in principle, any ID's to try to help counterfeit anything should be avoided. I have refused to attempt to locate similar typefaces for type from what seemed to be official documents, whether it was stamps, serial numbers or the type itself. <br> <br>I don't know if this Board has a policy about that, but in my opinion it should.  <br> <br>As far as Federal only working with Mac, anyone with Fontographer,  Fontlab's TransType, or the like, can convert from Mac to PC. That should be no problem. (If you have the font, I'll make the conversion for you.)</p>
    html_clean: <p>Kyle,  <br> <br>I believe you that this isn't a scam, but anyone in the world can read the posts on this forum. So, in principle, any ID's to try to help counterfeit anything should be avoided. I have refused to attempt to locate similar typefaces for type from what seemed to be official documents, whether it was stamps, serial numbers or the type itself. <br> <br>I don't know if this Board has a policy about that, but in my opinion it should.  <br> <br>As far as Federal only working with Mac, anyone with Fontographer,  Fontlab's TransType, or the like, can convert from Mac to PC. That should be no problem. (If you have the font, I'll make the conversion for you.)</p>
