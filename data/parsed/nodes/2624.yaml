    html: <p>Mike, you are propably right about this. It wouldn't be very wise to tell people what fonts could be used to forge a passport on a public forum.  <br> <br>We don't want to read in newspaper how someone did something stupid using a fake passport and how he/she found the correct typefaces on an Internet message board... <br> <br>Everyone here (Kyle included) are propably just interested in typography, but you never know... <br> <br>If someone knows the passport-types, he/she might e-mail them to Kyle.</p>
