  html: "<p>Ok a few things: <br> <br>(1) Can you name the different type faces (yes -- all of them) used in the United State Passport. <br> <br>(2) Is there a type face that matches the 'federal' face? I know that letterror has 'Federal' -- BUT, it only works with Mac. Any other suggestions. <br> <br>P.S. This isn't some sort of False ID making scam <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> Hopefully my rep on this board preceeds me. <br> <br>Thanks!!</p>"
