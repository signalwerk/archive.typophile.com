    html: <p>Wow. This has a really nice feel -- sort of a mix of a humanist sans and an expressionist form like Pressig, Manuscript or Journal. <br> <br>The lc "v", "w" and "x" seem a bit heavy. I'd try maybe making them a bit more modulated, with a bit more contrast between thick and thin strokes rather than the more monolinear approach that you have going now. Perhaps this should apply to the lc "k", "y" and "z" as well. <br> <br>I like the ever-so-slightly wide lc "z", too. I'd leave it as is. <br> <br>The slight flaring at the terminals is a really nice touch, too. <br> <br>David</p>
