    html: <p>Ok, here are my thoughts on spacing sans serifs. They come only from experience of looking, not designing.  <br> <br>Spacing between letters, according to Walter Tracy and others should relate to the space in the counters of the letters, as well as varying with external letter shape. I think the thickness of the stems is also a factor.  <br> <br>The challenge with san serifs is that absent serifs the spacing looks wide, tending to break up the words. So sans often more closely spaced than serif faces. But this close spacing can hurt readability, IMHO. Here Helvetical/Arial is a prime offender. When you have very circular letters, as opposed to narrower ovals then balancing the spacing with the counters can get ridiculously wide. But putting them very close hurts readibility, as the shapes of the letters become lost in the crush. If you look at a text setting of Meta, which is narrower and has more space in relation to the counters, it is much more readable than Helvetica.  <br> <br>I tend to think that Hrant is just mistaken about the greater importance of the external outline of the word, the 'Bouma' as he calls it, compared to the discernment of the shapes of the individual letters. I think that both are important. Thus wider spacing, to a point, helps, not hurts readibility. <br> <br>Another factor here is x-height. Another reason Futura is more readable than Helvetica, in spite of its circular letters, is that the smaller x height allows the space between letters to be looser and hence both more balanced and legible in relation to the spaces in the counters. And, yes, taller extenders also help on differentiating more the external outline of the words. <br> <br>With all these ruminations in mind, my reaction your spacing is that in the more black text setting the spacing is OK, but it is too loose in the case of the lightest weight.  <br> <br>In the lighter weights you might consider also narrowing the letter forms. If I am not mistaken (I don't have the font) I believe that is what Gerard Unger does with his Vesta. That way when you narrow the spacing - which the narrow stems also seem to call for - you still have balance between the inter-letter space and the internal counters. <br> <br>As I said earlier in this thread, I am really struck by how readable Vesta is as a sans. Unger has written a book about is views, and I am looking forward to the English edition, which I believe his site says he is working on.  <br> <br>As Randy said, and as I noted earlier when you posted a smaller text setting, it is striking how readable Ardbeg is in smaller text settings. I think you have going for you not only the narrower shapes and the open counters that the angularity gives you (a la Dwiggens), but also a more generous x-height than Vesta.  <br> <br>All of this promises to have you end up with an exceptionally readable sans, which I think is great. I think playing with the letter widths as well as spacing with the different weights, as Vesta seems to do, may help you get to this goal. <br> <br>On the differences in the weights, Unger likes the relatively small differences between different weights, I guess based on the idea that what pairing of weights a designer would want would depend on the design and the paper. James Montalbano also gave a very interesting rationale <a href="http://www.typophile.com/forums/messages/4100/14103.html?1060892227#POST25607" target="_blank">here</a>. <br> <br>  <br> <br> <br> <br> <br>   <br> <br>   </p>
