    html: <p>Tiffany put it well - the tactile quality is great.  <br> <br>You said you want to work on the 'g'. <br> <br>One idea. The lc 'g' and 'a' are, as one of the old masters pointed out, the letters where the evidence of the pen is most evident and hard to eliminate in the alphabet.  <br> <br>I am thinking that you might look to your Ardbeg a, particularly the tail of it for a better way to connect the loop of your 'g' to the top. You would then have a shot at consistency with the rest of the font, while coming up with alternative solutions.  <br> <br>To my eyes, the 7 doesn't work.   </p>
