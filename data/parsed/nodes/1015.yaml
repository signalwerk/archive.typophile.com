      <p>So, it's been a while since I've posted anything about this face. Because it's been a while since I've done anything to it. But I recently got off my fat arse, and started working on a range of weights.  <br> <br>The PDF is the "first pass" I guess you could call it. The lightest, heaviest, and middle weight are all drawn - the intermediate weights are generated from Multiple Master instances. Obviously they need to be tweaked a great deal.  <br> <br>But for now I was wondering if anyone had any comments on the weights themselves. E.g., are the jumps between the heavier weights too big, the hevaiest weight just too heavy, etc.  <br> <br>I'm not sure about the amount of contrast that shows up in the heavier weights, but I don't know a way to get aorund that. I also hate the big stupid dot on the heaviest 'i'.  <br> <br>Thanks again. <br> <br></p>
      <!--attachment: WeightComparison03-27173.pdf*mime_pdf.gif*application/pdf*115.2**WeightComparison03%2epdf --><!--attachment: WeightComparison03-27173.pdf*mime_pdf.gif*application/pdf*115.2**WeightComparison03%2epdf --><p></p><center><br>
