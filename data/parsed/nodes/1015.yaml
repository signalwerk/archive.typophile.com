    html: <p>&gt;Futura has wider spacing than Helvetica because it's designed better. <br> <br>Ok, I can buy that Futura is better designed.  <br>However, I think there is more going on here. When I track Helvetica progressively wider, and the same with Futura, the words of Helvetica seem to fall apart and the whole look too loose long before Futura falls apart.  <br> <br>I think the longer extenders hold together the 'Boumas' (ack! did I say that?) better, so the smaller x-height sans can take looser spacing. In other words, I think the Helvetical designer did the spacing he did for a good reason, even though it messes up the readability at small sizes.   <br>  <br>&gt;a larger looking face compared to others of the same point size, requiring more spacing at the same optical size. <br> <br>Well, Tracy says that the spacing should match the counters, which don't change with varying the extenders. But he didn't discuss sans serifs. If you look at digital Gill sans, and type iio, the space between the ii is much smaller than the counter of the o, whereas in say Times it is very similar. Now I think I read that Gill in metal was spaced much wider, but again I think the digital adjustments were in response to a problem that the spacing looked too loose in the metal.  <br> <br>Ok, the following is just a pet theory of mine, but there may be something in it. My theory is that without serifs you not only have problems visually finding the line of text, but also the spacing problems become substantial. Space a sans like a serif, and the words fall apart. Space it closely, and the legibility and hence readibility decreases in small (text) sizes. Hence sans are usually harder to read in text sizes. Large, the tight spacing is not a problem, as the absolute space between letters is big enough that legibility is not hurt.  <br> <br>I think the x-height and weight of the stem also affect how spacing works, especially with a sans. Also with narrower designs, the problems aren't so severe. I don't know what Unger has figured out about all this, but from the PDF of his Vesta, which mixes sans and serifs impressively, he has some new insights.  <br> <br>So even two Hrants (shudder <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">) don't convince me.  <br> <br>&gt;Monarchy fovea bouma notan <br>Democracy, iris, letter, notan (ok, I like notan). <br> <br>The relevance to Nathan's spacing challenges in different weights is this the following. I don't have a clear theory of how to space a sans. But my point is that there is more in spacing a sans than is usually realized, and that therefore it is worth experimenting with both letter width and spacing, rather than just one or the other, if you have a goal of readability in text for your sans. <br> <br> <br> <br> <br> <br></p>
