    html: "<p>&gt; [large x height allows wider letter spacing] <br> <br>Randy's [second-hand] logic probably comes to the same thing, but it's really much simpler: a smaller x-height [generally] means smaller counters. Look at it \"absolutely\": simply when you set a given font smaller (= smaller x-height) the space between the letters gets smaller too. (But more than \"allows\" it's \"needs\".) <br> <br>Futura has wider spacing than Helvetica because it's designed better. <br> <br>Leading/x-height: <br>Randy and Nathan are both right! A larger x-height normalized to the same apparent size needs less absolute leading, but at the same point size it needs more relative leading. <br> <br>&gt; It's really pretty amazing. <br> <br>BTW, I've measured it. Its behavior is \"bilinear\": a line from 4 point to 12; a more shallow line from 12 to 72; and flat below 4 and above 72. I think they would have done a higher-order curve but performance was an issue. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; [large x height allows wider letter spacing] <br> <br>Randy's [second-hand] logic probably comes to the same thing, but it's really much simpler: a smaller x-height [generally] means smaller counters. Look at it \"absolutely\": simply when you set a given font smaller (= smaller x-height) the space between the letters gets smaller too. (But more than \"allows\" it's \"needs\".) <br> <br>Futura has wider spacing than Helvetica because it's designed better. <br> <br>Leading/x-height: <br>Randy and Nathan are both right! A larger x-height normalized to the same apparent size needs less absolute leading, but at the same point size it needs more relative leading. <br> <br>&gt; It's really pretty amazing. <br> <br>BTW, I've measured it. Its behavior is \"bilinear\": a line from 4 point to 12; a more shallow line from 12 to 72; and flat below 4 and above 72. I think they would have done a higher-order curve but performance was an issue. <br> <br>hhp <br></p>"
