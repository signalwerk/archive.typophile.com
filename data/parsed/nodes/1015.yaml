    html: <p>&gt; the words of Helvetica seem to fall apart and the <br>&gt; whole look too loose long before Futura falls apart. <br> <br>What weights are you comparing? <br> <br>My impression is that in general Helvetica needs a slight bit of tracking to become less unreadable, while Futura is at its least unreadable by default. <br> <br>&gt;  I think the longer extenders hold together the 'Boumas' (ack! did I say that?) <br>&gt; better, so the smaller x-height sans can take looser spacing. <br> <br>That seems to make sense. But why think of what a font "can take"? A text font (at a given size) works best for a given amount of interletter spacing, and since this is all tied together with weight, proportions, etc. a good type designer will use the right amount of spacing, and a good typographer will adjust the tracking (as best he can) depending on any deviation from the "intended" point size. <br> <br>&gt; Tracy says that the spacing should match the counters, which don't change with varying the extenders. <br> <br>1) Tracy is not god. <br>2) A font with longer extenders will generally be used at a smaller size, very much affecting the  optimal spacing. <br> <br>&gt; I don't have a clear theory of how to space a sans. <br> <br>? <br>It's much easier to space a sans. <br> <br>hhp <br></p>
    html_clean: <p>&gt; the words of Helvetica seem to fall apart and the <br>&gt; whole look too loose long before Futura falls apart. <br> <br>What weights are you comparing? <br> <br>My impression is that in general Helvetica needs a slight bit of tracking to become less unreadable, while Futura is at its least unreadable by default. <br> <br>&gt;  I think the longer extenders hold together the 'Boumas' (ack! did I say that?) <br>&gt; better, so the smaller x-height sans can take looser spacing. <br> <br>That seems to make sense. But why think of what a font "can take"? A text font (at a given size) works best for a given amount of interletter spacing, and since this is all tied together with weight, proportions, etc. a good type designer will use the right amount of spacing, and a good typographer will adjust the tracking (as best he can) depending on any deviation from the "intended" point size. <br> <br>&gt; Tracy says that the spacing should match the counters, which don't change with varying the extenders. <br> <br>1) Tracy is not god. <br>2) A font with longer extenders will generally be used at a smaller size, very much affecting the  optimal spacing. <br> <br>&gt; I don't have a clear theory of how to space a sans. <br> <br>? <br>It's much easier to space a sans. <br> <br>hhp <br></p>
