      <p>Well, obviously I have to ponder exactly how I plan on dealing with the spacing - it appears as a pretty major revision of letter widths might be in order in the future. <br> <br>In the meantime, I've done some changes. This one has an added heavy weight which I'm hoping will make the regular/bold, medium/black combinations work better. As well as diminshing the difference between regular and medium. Unfortunately I don't have the heavy cpitals drawn, so I didn't include any tests for small caps like Hrant mentioned. <br> <br>The heavier l/c g's are awful. They are in need of more weight it seems.  <br> <br>The contrast in heavier weights has been much reduced (perhaps too much in some places).  <br> <br>The f is lowered (thank you, Randy). <br> <br>I spent a little time last night starting to space the thin weights, but it's still nowhere near complete. I suppose that's next. <br> <br>Thanks. <br> <br></p>
