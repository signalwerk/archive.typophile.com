    html: "<p>&gt;&gt;It's the other way around [large x height allows wider letter spacing].  <br>&gt;Hrant, why do you say this? <br> <br>Here's a game: guess the hrant. :-) <br>Not a jab, but he is nothing if consistent on this score. Here goes: A larger x-height means a smaller ascender/descender height, means a larger looking face compared to others of the same point size, requiring more spacing at the same optical size... Meanwhile, the shorter ascenders/ascenders gain you vertical space by decreasing the needed leading, which in shorter lines of copy controls the space economy much more than the width of a typeface or looseness of spacing. So you can easily afford a bit more width. As for examples I will leave that up to him! *breath* Monarchy fovea bouma notan. (ok, that was a little boxing wizard jab :-) <br>How'd I do? <br> <br>Randy</p>"
    html_clean: "<p>&gt;&gt;It's the other way around [large x height allows wider letter spacing].  <br>&gt;Hrant, why do you say this? <br> <br>Here's a game: guess the hrant. :-) <br>Not a jab, but he is nothing if consistent on this score. Here goes: A larger x-height means a smaller ascender/descender height, means a larger looking face compared to others of the same point size, requiring more spacing at the same optical size... Meanwhile, the shorter ascenders/ascenders gain you vertical space by decreasing the needed leading, which in shorter lines of copy controls the space economy much more than the width of a typeface or looseness of spacing. So you can easily afford a bit more width. As for examples I will leave that up to him! *breath* Monarchy fovea bouma notan. (ok, that was a little boxing wizard jab :-) <br>How'd I do? <br> <br>Randy</p>"
