    html: "<p>&gt; wider spacing, to a point, helps, not hurts readibility. <br> <br>Of course. This is because: <br>1) About 1/3-rd of reading is done in the fovea, where internal details are available as information. (But about 2/3-rds is still done in the parafovea, where internal details are simply unavailable.*) <br>2) A huge determinant of a bouma is its width. The tighter the spacing the less the absolute difference in width between boumas that are potentially confusable, and the greater the reading errors. <br> <br>* <a href=\"http://www.themicrofoundry.com/ss_read1.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_read1.html</a> <br> <br>On the other hand, too-loose spacing: <br>1) Prevents the formation of good boumas. <br>2) Uses up the acuity of the retina faster. <br> <br>&gt; the smaller x height allows the space between letters to be looser <br> <br>It's the other way around. <br> <br>&gt; Unger likes the relatively small differences between different weights <br> <br>Me too. For one thing, it allows you to make great quasi-fake smallcaps. <br> <br>&gt; you have more generous *extenders* going for you <br>&gt; compared to Vesta. This might increase the readability <br> <br>It depends on the point size. The optimal balance of apparent size versus ideal boumas depends very much on scale. <br> <br>hhp <br></p>"
