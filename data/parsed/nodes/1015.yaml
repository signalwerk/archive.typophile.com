    html: <p>Love this... <br>The counter of the n and subsequently the h, m and u is too generous.  <br>Pulling them in a bit will help the rhythym greatly. I also wonder  <br>if the top exit stems of the n and m couldn't be treated to the pen  <br>like slices many of the other strokes share. <br> <br>Also, the uppercase hasn't been treated as much as the <br>lowercase. The B and R are ripe for some of this. <br> <br>Lastly, the traditional treatment given to the zero doesn't <br>fit (geometric circle). This face is way too forward thinking <br>for that.  </p>
