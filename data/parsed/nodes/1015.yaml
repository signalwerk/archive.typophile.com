  html: <p>This is the latest thing I've been playing with - off and on in whatever spare time I can find. It's the first Latin sans I've attempted that's not a heavily geometric construction, so any input would be great. I was trying to throw some slight corners into certain characters (o, e, c, etc.) to open up the counters a bit. And have been playing with small flares and tapers on various letters. Not sure if either one is working to anyone's great satisfcation. "vent" is just a detail - and Ardbeg is just a whisky - the face is nameless as of yet. No upper case or figures yet either... <br><img src="http://www.typophile.com/forums/messages/29/14608.gif" alt=""></p>
