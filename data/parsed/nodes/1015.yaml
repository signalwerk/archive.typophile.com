  - id: 7665
    user: 1551
    date: 2003-12-01T08:48:00
    date_raw: 1 Dec 2003 — 8:48am
    votes: null
    html: <p>Seeing your text setting, I am excited that this promises to be a very readable sans even in text. It is narrow but very open because of the angular counters. You might compare Vesta, the new face of Gerard Unger at <a href="http://www.gerardunger.com" target="_blank">www.gerardunger.com</a>. It is one of the most readable sans I have seen, and your face promises to accomplish the same thing in a different way. He has rounded counters, and a narrow, humanist structure. He gets the openness partly by very narrow joins between round and straight strokes - a general feature of his designs.  <br> <br>You are approaching this in a different way, which gives a wonderful liveliness as well as good 'color'. <br> <br>I like your new 7 and y. I don't know whether the f is an improvement; I would like to see more text setting.  <br> <br>The g I think still doesn't work; it looks odd and sticks out, to my eyes. Is the problem that the link between the loop and the top of the g sticks out too far to the left? That the link should narrow more in the joining to the top? Or maybe that the bottom of the loop should be lightened, following the stress in serif fonts? Unger does all of these in Vesta. You have a very different look, but maybe there is a way to make the g more harmonious adapting these patterns to your deisgn.   </p>
