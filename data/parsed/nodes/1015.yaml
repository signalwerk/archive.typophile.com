    html: <p>Thanks for the suggestions fellas. I wouldn't've thought to add some contrast to "v" et al, but I think it's working well. I still need to shave some weight from the "x", but otherwise they're fitting in much better as far as color goes.  <br> <br>And I shortened the descenders a bit (thanks for pointing that out, Eduardo) - I hadn't even noticed how incredibly long they were. The "g" still needs a lot of work. When I shortened the descenders, I redrew it with the Beziers to bring it in line, but I think I really need to rework it on paper. It seems too light and perhaps too narrow all the sudden.  <br> <br>Oh yeah, I also fiddled some more with the terminal flares and notches at som eof the joints. I moved the top notch on "p" because the top joint is already tapered - it seemed more logical to trim the bottom joint. And I took a nibble out of the shoulders of "m". <br> <br>Incidentally, the cyan is the first version, the black is the revision. I guess that's obvious. If you're interested, I posted some of my sketches <a href="http://eightyproof.com/nhsketch.htm" target="_top"> here</a> - unfortunately my brother's architectural drafting skills didn't run my way in the family... <br> <br><img src="http://www.typophile.com/forums/messages/29/14818.gif" alt=""></p>
