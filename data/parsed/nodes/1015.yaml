    html: <p>Thanks again for all the feedback. I'm implementing the suggestions, and I should have a new sample in the next day or so. The contrast is being dropped substantially out of the heavy master, and I'll re-interpolate the other heavy weights based on that. <br> <br>&gt;James Montalbano also gave a very interesting rationale  <br> <br>I had forgotten about that post. Thanks for the reminder, William. Based on that, I'm wondering if there should be 3 steps between the regular (fourth row in the PDF above) and the heaviest weight. As opposed to 2. That would allow a Medium weight to function per James analysis. As the weights stand, I can't see them working as a regular + bold and medium + bold. <br> <br>&gt;according to Walter Tracy and others  <br> <br>I actually just picked up a copy of L.O.C. when I was at the Newberry Library last week. I had forgotten that it was in print again. I have yet to apply his scheme (is it the same as Briem's?) to Ardbeg however. That's this weekend's labor. <br> <br>As far as the spacing goes right now, I've set the spacing for the regular weight - obviously it is in want of some tweaking. The lighter weights are optical spaced (a la InDesign) and tracked tighter - though not tightly enough. I haven't even begun to touch them for real. And the heavy weights have just some rudimentary side bearings set. Clumsy and horribly un-craftsman-like I know. <br> <br>That said, I shall attempt to tweak the letterfit of all the weights this weekend, concentrating on tightening the fit of the light weights. <br> <br>&gt;it allows you to make great quasi-fake smallcaps.  <br> <br>Perhaps I'll use this as my next test for weight distribution... <br> <br>&gt;In the lighter weights you might consider also narrowing the letter forms.  <br> <br>I may yet give this a try. In my head I was thinking that it would be best to err on the side of wider characters. To keep the counters open and such. Perhaps I have been on the wrong track.  <br> <br>I'm afraid this post is mostly me talking to myself and organizing my game-plan. I apologize for the useless prolixity.</p>
