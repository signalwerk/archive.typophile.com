    html: "<p>Try bringing the dot progressively lower as you get darker. In the uberheavy you'll wan't just a white wedge and 3 hairs more between it and the top of the stem. Also, there is no way to turn out a black lowercase without adding contrast. It's a hazard of the territory. That said, you can probably get by with quite a bit less contrast than you have because of your forms. <br> <br>One final note: check the ascender height on your f. It looks like it lines with the very top of the l. Make it visually line with the lower part of the angled stem. You could probably use a little more length on the top of the f too. <br> <br>Very suprised at the results at small sizes. Nice! <br> <br>Randy</p>"
