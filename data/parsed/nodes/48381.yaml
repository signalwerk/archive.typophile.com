    <p>I’m doing a logo re-design for a client, and they’ve specifically requested the company name in a circle.</p>
    <p>Has anyone found a way to decently arc text? I’ve used the “Type on a path” tool in Illustrator, but the text always looks off to me - either the letterforms start blending together, or the kerning is a nightmare.</p>
    <p>Here’s another company’s example of what I’m trying to do (not mine): <a href="http://www.yellowcabchicago.com/images/logo.gif" target="_blank">http://www.yellowcabchicago.com/images/logo.gif</a></p>
