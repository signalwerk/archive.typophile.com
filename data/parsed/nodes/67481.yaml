  html: <p>Hello everybody, I’ve just played <a class="freelinking external" href="http://www.pentagram.com/what-type-are-you/" rel="nofollow">Pentagrams "What Type are you?"</a> game, and hey I’m Plastica! But I’ve never heared of this typeface before ... The look is very close to <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/umbra/regular/characters.html" rel="nofollow">Umbra</a>, but it’s not the same (see especially M and J). I couldn’t find a digital Plastica nor much information about the Designer Herbert Post. I just wonder if anyone has some deeper information about it ... Where does the Pentagram people find it?</p><div class="imageWrap"><img src="http://typophile.com/files/plastica_5144.jpg"></div> Best, Viktor<p></p>
  html_clean: <p>Hello everybody, I’ve just played <a class="freelinking external link-external" href="http://www.pentagram.com/what-type-are-you/" rel="nofollow">Pentagrams "What Type are you?"</a> game, and hey I’m Plastica! But I’ve never heared of this typeface before ... The look is very close to <a class="freelinking external link-external" href="http://new.myfonts.com/fonts/adobe/umbra/regular/characters.html" rel="nofollow">Umbra</a>, but it’s not the same (see especially M and J). I couldn’t find a digital Plastica nor much information about the Designer Herbert Post. I just wonder if anyone has some deeper information about it ... Where does the Pentagram people find it?</p><div class="imageWrap"><img src="/files/plastica_5144.jpg"></div> Best, Viktor<p></p>
