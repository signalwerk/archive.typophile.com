      <p>The »Hamburge« I posted is the metal version of Berthold’s Umbra from 1932 (see <a class="freelinking external" href="http://www.global-type.org/Das-Handbu.726.0.html" rel="nofollow">here</a>).<br>
      I haven't found anything, not one picture of Plastica – no idea how it looks like.<br>
      And actually I also doubt that Post designed Plastica or Umbra. Those two are not attribute to a special designer in Berthold’s records.</p>
      <p>((Hei Henning, can you have a look in your Berthold Hauptproben?))</p>
