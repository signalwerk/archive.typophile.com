    html: |-
      <p>While Gill Sans Light Shadowed is indeed very similar, it’s not identical – see especially J, R, Z.<br>
      Maybe Pentagram has made this typeface up? To me, it looks like they modified Umbra (Futura Shadowed) and/or Gill, made it look like a kind of Neuzeit Grotesk Shadowed and gave it the name of the stylistically related – and forgotten – Berthold face that Indra has shown. While it is not out of the question that Herbert Post has designed such a typeface, it would surprise me – in consideration of his work as far as I know it.</p>
