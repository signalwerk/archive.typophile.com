      <p>Plastica is listed at Berthold as a »Hausschnitt«, 1929/1936.<br>
      <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Berthold/BertholdAG.pdf" title="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Berthold/BertholdAG.pdf">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Ber...</a></p>
      <p>Umbra as well, though the hot-metal version looks quite different.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/umbra_5248.jpg"></div><p></p>
      <p>I can't find Plastica in any stuff I have about Post.</p>
