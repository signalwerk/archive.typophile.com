    html: |-
      <p>Highly interesting. I am not too keen on display fonts usually but this one has quite some potential. </p>
      <p>There are quite a few weights problems though. O and Q are much darker than anything else. B is too dark compared with the rest of the line. Try for example to use the top element of the R as the top element of the B (but adapt it).</p>
      <p>There are problems of homogeneity. In terms of width, for example. I disappears, J is too large (and darker than L): I mean it is larger than the U. In terms of style, this is not homogeneous yet too: by making W diagonal on one side only, you have actually given it a very diagonal feel, if that makes sense. P and R are too close too. I J L U seem to belong to a different font.</p>
      <p>There are issues regarding readibility/legibility: H is difficult to read because the inner gap is too large (or you need to space the glyphs differently). W will create a gaping hole in the line. It is too close to the M in terms of shape too.</p>
      <p>R is not wide enough if compared with 'similar' letters : B and P. </p>
      <p>Why don't you have a look at successful decorative fonts to see how they solve these problems. Say, have a look at Bifur - it is far enough from your font: you won't be tempted to copy. </p>
      <p>Keep up the good work!</p>
