      <p>Thanks for all the helpful replies!</p>
      <p>I've started trying to refine my sketches more. I attempted to create an entire alphabet using the blockish style seen in the letters A, B, D, P and R in the first set, but I'm afraid it just doesn't work with a lot of glyphs.</p>
      <p>In order to get more consistency, I've simplified a lot of the shapes and applied a new set of rules. I think these can be called an improvement, but there are certainly issues. The ones I immediately pick up on are the counter of the 'B' being to far to the right, legibility issues with the 'D' and the leg of the 'K' looking somewhat out of place.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typo - Font Sketches 2-1_5163.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typo - Font Sketches 2-2_3849.jpg"></div><p></p>
      <p>By the way, yes, I did use 'First Nations' as a blanket term - I wasn't sure how familiar everyone would be with the terminology (I'm certainly not). I'm specifically looking at the Haida culture, which I've done some research in to, but not a great deal. I'll probably look in to it a bit more later, but for now my entire life is taken up by either typography or work.</p>
      <p>Oh well, off to do more sketching.</p>
