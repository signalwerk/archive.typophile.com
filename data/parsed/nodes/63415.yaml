    html: |-
      <p>Ah! I commented on an old version. Here are updated comments (I am not repeating what is still valid).<br>
      1 general comment: as pointed above by miss tiffany, you need to be careful with the cuts through the letters as they may disappear in a smaller setting. You may have Stencil installed on your computer. Try printing it small, see what issues you have and from what size, then check what the size of the cut is and adapt your own font accordingly. </p>
      <p>The B looks far far better! So does the R.</p>
      <p>Check a few random fonts for PBR - preferably non-geometrical and by a good designer (check who won the Prix Charles Peignot, open their fonts). Often the upper loop of the P is closer in size to the lower loop of the B than to the upper loop of the B. Is this a solution you want to use? Similarly, the upper loop of the P is almost always bigger than the upper loop of the R. </p>
      <p>You may struggle adjusting the weights of O and Q. Check Anisette in its extra bold version for inspiration. You may want to get them a bit narrower and increase the counter, or add another horizontal split or widen the existing one, but let's face it, it will be tough to retain their current elegant shapes. Also, check that you have made enough optical corrections and that they don't look like they are dancing above the baseline. I have difficulties asking you to change those glyphs which are my absolute favourites! </p>
      <p>EF: open a few random non-geometrical fonts from great designers. Check EF - what do you notice? Is the bar of the F often as high perched as that of the E? In your font, there is too much space at the bottom of the F. This creates a gap at the bottom. Check B v. E too, and see what you notice: isn't the bar of the E a bit lower usually, in order not to create the darkness that can be seen in your font? </p>
      <p>Another few things can help you:</p>
      <p>- think thoroughly 'what do I want to do?' again (you need to do that a number of times when you do a font, so don't worry if you have done it already); think 'what are the characteristics of this font' and think 'visual characteristics' as opposed to 'intellectual purpose' - some questions that may pop up in your mind are : 'why did I create a vertical cut out in the H, whereas it is vertical or diagonal in most/all others' - 'why is the J so low and wide?', 'what interested me in the "First Nations" designs?' but think 'what interested me visually', as opposed to 'what interested me intellectually'? </p>
      <p>- decide which are your favourite glyphs and why, then see what you can do to get all the other glyphs to be as good!</p>
      <p>- use O and H (once improved) to benchmark other glyphs, this way:<br>
      HHAHHOOAOO HHBHHOOBOO etc. and see what looks wrong to you in terms of how dark and how wide the characters are. I say O and H because I would often consider them to be the lead characters in something I create and because one is round and one is vertical, but feel free to choose others. It is more difficult to benchmark with more than one glyph/character BUT better (with only two characters, you may end up getting all your glyphs too similar in terms of width). Thus you can try IIAIIOOAOONNANNEEAEE. Once you are more confident, you need only compare with one I instead of two etc. Thus IAIOAONANEAE etc. IBIOBONBNEBE.</p>
      <p>- some characters are impossible to read: GSY spring to mind. X looks like two different characters.<br>
