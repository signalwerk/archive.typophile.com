    <p>Hello everyone! I'm an Australian, first year visual communications student who, amongst other things, is studying typography. Unfortunately, while everything else seems fairly straight-forwards, typography is completely alien to me!</p>
    <p>Anyway, to the present. I'm currently working on my first typeface, for a university assignment. The brief states that we're to 'design and name a new and original DISPLAY font / typeface... [which] can be produced in either lowercase or uppercase (or both) and should also include the design of punctuation and numerals.' The emphasis is on hand generating sketches and process, and typographic detailing.</p>
    <p>The inspiration I'm drawing upon is the art of the First Nations people (native to Canada). Some good examples can be found in <a class="freelinking external" href="http://www.flickr.com/photos/blackbird_hollow/sets/72157618011825873/" rel="nofollow">this flickr set</a>.</p>
    <p>I was hoping to get some advice on developing and refining my typeface. Below are some images of my current sketchings (apologies for the high resolution, but they should be clearer this way). Clearly these aren't refined; I'm trying to establish a set of letterforms I like before going on to detail them. Many of these are simply experiments.</p>
    <p>Thanks. :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typo - Font Sketches 1-1_6692.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typo - Font Sketches 1-2_4780.jpg"></div><p></p>
