      <p>@Flay</p>
      <p>I liked the redundancy of elements like using two ways to represent the same thing in a character and/or using 2 different ways to do the same thing the line and the dot  for the holes in the early capital B.</p>
      <p>Scanning what everyone has said so far, I saw the phrase First Nations' as soon as I saw this the eyes in the A and R jumped out at me. Loosing the dots seem a shame in your later drawings where you are trying to normalise your design. This is not the aim of this font. Otherwise it might end up looking like a generic bold display font. This has something else to offer.</p>
      <p>If each of your letters could tell a story this would be super excellent. i.e. the sun rising or setting in O and Q. Better if O and Q could depict different things like O = rising and Q setting. The design could then evolve out of this story of depictions - petraglyhs. Letters with encoded meaning....</p>
      <p>cool.</p>
      <p>_________________________________<br>
      Michael Hernan</p>
