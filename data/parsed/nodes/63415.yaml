      <p>This looks like a really interesting project.  If I could pick some nits about terminology, which I hope will help you if this assignment has a written component:</p>
      <p>"First Nations" is a blanket term that refers to most of the aboriginal peoples of Canada; the group of people covered by this term is very culturally diverse, which means (among other things) that there is no single First Nations art style.  Your work seems to be inspired specifically by the Northwest Coast art style, which extends from the Alaska Panhandle (and areas immediately to the east) through much of coastal British Columbia, including most of Vancouver Island.  The Coast Salish art style shows many influences from the Northwest Coast style as well.</p>
      <p>I don't know a whole lot about this art style, but reading up on it might help you refine your work.  A book which I haven't read but which looks particularly promising is <em>Northwest Coast Indian Art: An Analysis of Form</em> by Bill Holm, published by the University of Washington Press.</p>
      <p>Anyhow, best of luck with your project.</p>
