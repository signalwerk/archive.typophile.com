      <p>Really interesting. I love the unusual way the forms are broken with the stripes.</p>
      <p>I think you should look at the overall harmony. For example, most letters have vertical and/or horizontal breaks, whilst a few have slanted ones. To me the first way is stronger. There's also a bit of reconciling to do with the curved terminals vs square ones, and you'll find some kind of 'rule' proably a good idea, though it doesn't need to be set in stone. Think about the weight of each glyph too, the thickness of the strokes and amount of counterspace associated with each form, since in the 'First Nation' example, the R looks quite a different weight to the S. Widths too need to gel more, I think.</p>
