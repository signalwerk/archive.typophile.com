    html: <p>Some of the shapes seem to be on the right track, while others not so much. I really enjoy how it reminds me of stacked stones and pebbles. What you need to do is decide what you really want it to do. Some of your shapes are not as finessed as the others. I'd get rid of those. For instance, the 4th P. Why do you need a huge counter? And the 4th B. It just looks squooshed. It is fun to have alternates. I'm not saying get rid of the alternates. While all of the D look like fish, the 1st seems to be the least successful. And do you want this to have some Japanese flavor? Some of the shapes are more successful at this too.</p>
