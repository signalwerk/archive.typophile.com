    html: |-
      <p>I guess it depends on who you ask check <a href="http://stockholm.usembassy.gov/usflag/colors.html"> here </a> and scroll to the bottom. </p>
      <p>Pantone Colors for the U.S. Flag</p>
      <p>The U.S. Government Printing Office specifies Pantone 186 and 288 for the red and blue colors of the United States flag, but Pantone specifies Pantone 193 and 281. Other sources specify Pantone 282 for blue. This may be because inks look different on different paper stocks.</p>
