      <p>Hi Eddie,</p>
      <p>Thanks very much for sharing your thoughts. If I can correct one of your assumptions, Gotham's actually the only family we've ever released that's been followed up by later expansion: everything else has been published all at once. You mentioned Archer above, though we published all 40 of its styles together on January 2008, and haven't added anything since.</p>
      <p>It's not our style to hold anything back, so I wouldn't know whether it's better business or not. It's always been our goal to create type families that are both complete and manageable, which means as many styles as necessary, but as few styles as possible. When we designed Gotham, we imagined four weights with matching italics, so the product "Gotham" debuted with these eight styles. Little did we know how persistent people would be in asking for a heavier version, a hairline, a condensed, and finally a narrow version for text, and a less-condensed-than-Condensed version for headlines. We added these over the intervening years, and released them as additional products in 2009.</p>
      <p>We also took that occasion to "upgrade" the existing Gothams, by giving them tabular figures, fractions, and extended monetary symbols. William's post above is correct: these additions are offered as a low-cost "upgrade" to all of our existing customers, and free to our most recent licensees.</p>
      <p>I don't know what the future holds for Tungsten: in part it depends on what people like you ask for, so feel free to let us know if you have any suggestions. (One person asked me on Twitter for old-style figures, which I never really imagined. Also, we tried a hairline, and didn't like it. And finally, I can assure you that "Tungsten Swash Caps" are not under discussion at this time...) For now we've turned our attention to other projects, so I hope you'll find today's Tungsten useful, and worth its price of $99.</p>
      <p>Kindest Regards,</p>
      <p>Jonathan Hoefler</p>
