    <p>So, I tend to hold out with purchasing HF&amp;J products until more styles are introduced. Economically, it's probably a better model for type founding because it's a more efficient use of development time in terms of reducing long periods of time without profit. I still get kinda bummed when I buy a "family" only to later find out that a few more kids are on the way. (Ahem, Archer, Gotham, and well every HFJ). </p>
    <p>So, based on this speculation....who wants to predict what's next for TUNGSTEN? Right now, 4 styles.</p>
    <p>If Tungsten follows suit...<br>
    Round 1: 4 italics and possibly a rounded or hairline. (Not sure if rounded would work with structure.)<br>
    Round 2: Hopefully an EXPANDED and italic expanded.<br>
    Round 3: Drop caps and numerals.</p>
    <p>Thoughts? Hopes?</p>
