      <p>This is fantastic. I bought Tungsten a couple of years ago and was really excited to get the e-mail about the new lighter (and much needed) weights. I'll be upgrading as soon as I figure out how.</p>
      <p>And to Farquart (two years later), although there are certainly some typefaces that look like Tungsten (just like there are some typefaces that look like, well, pretty any other typeface to some degree or another), they don't necessarily work like Tungsten. Nothing against the design of other similar fonts, but Tungsten, to me, is really crafted at a higher level than most anything else I own. I noticed that the first time I used it. I'm really not interested in fonts that don't look like anything else (because they'd probably look so unusual that they'd be pretty unusable for general use), but I'm definitely interested in typefaces that take existing genres to a new place.</p>
