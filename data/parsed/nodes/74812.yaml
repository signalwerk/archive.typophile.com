    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gain Image1_6250.jpg"></div><p></p>
    <p>Thu, Oct 14 - Sat, Oct 16<br>
    Sheraton New York Hotel &amp; Towers, 811 7th Ave @ 53rd St<br>
    Registration/Program Info: <a class="freelinking external" href="http://www.gainconference.aiga.org" rel="nofollow">http://www.gainconference.aiga.org</a></p>
    <p>At the 9th biennial “GAIN: AIGA DESIGN AND BUSINESS CONFERENCE,” creative and corporate visionaries share how they have deployed design solutions to meet business challenges. This year’s event, themed “Design (Re) Invents,” addresses how businesses operating in highly competitive yet slow-growing markets can use design to create new value and a higher profile. Among the many renowned designers and design strategists who will speak at the conference are NAIF AL-MUTAWA (The 99), J ALLARD (formerly of Microsoft), GADI AMIT (NewDealDesign), PAOLA ANTONELLI (MoMA), SCOTT DADICH (WIRED, Condé Nast), SOROYA DARABI (Foodspotting), DAVID DROGA (Droga5), ERICA EDEN (Smart Design, Femme Den), KARIN FONG (Imaginary Forces), ROBERT HAMMOND (High Line), JONATHAN HARRIS (number27), BJARKE INGELS (Bjarke Ingels Group), LARRY KEELEY (Doblin, Monitor), JOHN MAEDA (RISD), CURT SCHREIBER (VSA Partners), and MARIJE VOGELZANG (Studio Marije Vogelzang, Proef). Joining their creative partners will be top marketing executives from JetBlue, Walmart, IBM, Microsoft, Adobe, Conde Nast and other companies. For more information on the speakers and the programs in which they will participate, visit <a class="freelinking external" href="http://www.gainconference.aiga.org" rel="nofollow">http://www.gainconference.aiga.org</a>. </p>
    <p>AIGA, the professional association for design, stimulates thinking about design, demonstrates the value of design and empowers the success of designers at each stage of their careers. AIGA’s mission is to advance designing as a professional craft, strategic tool and vital cultural force. AIGA’s 21,000-person membership comprises graphic designers, brand consultants, design firm principals, web designers and corporate in-house creatives from across the United States. Founded in 1914, AIGA remains the oldest and largest professional membership organization for design, and is a nonprofit, 501(c)(3) educational institution. For more information, visit <a class="freelinking external" href="http://www.aiga.org" rel="nofollow">http://www.aiga.org</a>.</p>
