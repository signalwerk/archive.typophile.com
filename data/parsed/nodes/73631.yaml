    <p>These logos are from the Tales From The Darkside tv show from the 1980s, do either of these look like any existing fonts? </p>
    <p><img src="/sites/default/files/old-images/tftds_3837.jpg"></p>
    <p>I know there is a good chance that these were custom made just for the logos, but even if so I wonder if anyone has created a a font based on these since then? </p>
    <p>Thanks for any help!</p>
