      <p>Okay, I've looked at a whole bunch of solutions from different print media and it varies substantially. </p>
      <p>In signpainting (as in handwriting) the double acute is quite often just two vertical lines:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/dac0_5263.jpg"></div><p></p>
      <p>Whereas in printing it can do very different things. Here's a book from the turn of the last century where the diacritic behaves pretty much as I describe it above:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/dac1_5075.jpg"></div><p></p>
      <p>Here's a recent engraved inscription where again it is more to the right and spaced wider apart than what's common in Western European fonts:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/dac1b_6542.jpg"></div><p></p>
      <p>Then there's plenty of printed material that uses the diacritic more optically centered and tighter, of course. What's correct?</p>
      <p>Also, to complicate things there are two more factors I hadn't considered, because I thought they were obvious but clearly are not! Firstly, relative size. In this example the double acute is bigger than both the acute and the diaresis:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/dac2_4617.jpg"></div><p></p>
      <p>And then there's relative angle (!). Look at the recent logo for this women's magazine:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/dac3_5972.png"></div><p></p>
      <p>The two acute accents are at different angles. This is not the only place I've seen that, either.</p>
      <p>In general, a quick internet browse-through at the very least suggests that the diacritic should not be optically centered but lean a fair bit right. Right?</p>
