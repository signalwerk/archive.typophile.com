      <p>I am a native Hungarian and here are a few thoughts about this topic, however old it may be:<br>
      - I like the ö/ő comparison in the first post, however, I have found it useful to move the accent of ő a bit to the left to balance its leaning (on the other hand, I think that they have gone too far in the case of Gyömrő's website)<br>
      - The example which reads "szöveggyűjtemény" is the most comfortable for my eye; I might make the accent a bit smaller, but it is good as it is<br>
      - I think it is a good idea to make the double acute lines shorter and more upright than the simple acute; but this might be just my taste. However, it is clear that this accent is not just two acutes next to each other!<br>
      - Schoolchildren learn writing ő and ű with two parallel slanted lines. I would stick to this, I don't like the relative angle, it looks as if it was messed up.<br>
      - Upright lines look really bad to the native eye. Avoid them.</p>
