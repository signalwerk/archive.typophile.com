    <p>Hi everyone, I'm very new on these forums, and I'm already hooked on the type identification end of things, it's extremely good for learning about how typefaces are constructed.</p>
    <p>Being half-Hungarian, one such construction I'm especially interested in is the double acute accent, the "hungarumlaut", that occurs in the letters /ő/ and /ű/. I've searched for threads discussing it and I can't find any, so I thought I'd check if anyone has posted on it before - and if not I'd love to hear some discussion on it from the esteemed type degniners here.</p>
    <p>Thing is, looking through the typefaces on my hard drive, if they have it at all, a lot of them seem to get it simply <em>wrong</em> from what I understand Hungarian is supposed to read like. :) </p>
    <p>The double acute accent is a long version of the umlaut; as I understand it, it is supposed to relate as directly to that umlaut as typographically possible. That means the spacing between the acute accents should <em>ideally</em> be the same as the space between the umlaut tittles, and the accents should <em>ideally</em> grow out upwards of the place the umlaut would have been. Below I've modified Arial (I know, I know!) to show sort of what I mean:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/umlauted_5267.png"></div><p></p>
    <p>Or look at the /ő/ in the modified Charlemagne in the header of <a class="freelinking external" href="http://www.gyomro.hu/" rel="nofollow">the website of this municipality</a>.</p>
    <p>Now, this is not always typographically possible - it can create an unbalanced and too-high glyph, I guess. But so many typefaces have double acutes that are very close to each other, much closer than the umlaut tittles, and in many the accents are very far to the left, centering the whole diacritic or even extending to the left when it's supposed to lean substantially to the right.</p>
    <p>Am I right here? Or have I misunderstood the problems of constructing this diacritic, or how it's "supposed" to be?</p>
