      <p>I had thought that the ring in the Scandinavian å is supposed to be a geometrical circle - not a raised letter o, with the sides thickened. If that is indeed its origin, I don't think I've <em>seen</em> a typeface in which it retained that vestige of it.</p>
      <p>In another thread, I noted that while confusing the ogonek with the cedilla or a reversed cedilla produces very bad results visually, it resembles the Greek iota subscript accent. I didn't mean to suggest that was necessarily where it was derived from, but I think I was not clear enough on that point.</p>
      <p>The versions of the double acute accent with the change in curvature are reminiscent of the Greek "smooth acute" polytonic accent. So, this could be a wrong form being used simply because it was familiar from another language, and the fact that it appeared in older books doesn't necessarily mean that it is what Hungarians would consider the "right" way to represent the accent in a text face. I wish there were someone from Hungary here who could provide some insight into why an apostrophe-prime form might, or might not, be more appropriate than a double-prime form for this accent.</p>
      <p>And, of course, what is appropriate for Hungarian might not be appropriate for Faeroese...</p>
