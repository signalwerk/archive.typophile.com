      <p>All I knew before of the Hungarian double acute was one Selectric element I had for Hungarian, on which the accent was small and light.</p>
      <p>To try and find out what this accent "should" look like, I looked in Google Books for some old Hungarian books, and in my first two results, I found that the "relative angle" type was what was used:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hacc_3898.jpg"></div><p></p>
      <p>And it's also smaller that both a single acute and an umlaut.</p>
      <p>Here's an image from my other search result, in a significantly different typeface, but with the same thing true of the accents:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hacc2_6700.jpg"></div><p></p>
      <p>So that seems to be what used to be the standard for books.</p>
