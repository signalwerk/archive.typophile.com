      <p>Apparently, there's a facsimile edition of the type specimen of the (Jesuit) Academy Press of Tyrnavia, as published in 1733, available for only 2,710 forints. I can't say whether it would actually be helpful...</p>
      <p>I tried Googling information about Hungarian handwriting, but while I found the Wikipedia article on the double acute accent, I didn't find any information on what that accent meant to Hungarians through that either.</p>
      <p>Here's an example in an oldstyle typeface:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hacc3_4963.jpg"></div><p></p>
      <p>This book contains text in Latin, German, Polish, and Czech as well as Hungarian. Apparently, it's a list of very old books, and so it tries to reproduce the forms of letters which they use on their title pages exactly. Thus, a very unusual accent appears at one point in the book, looking like a small lowercase e above the letter, and apparently used as a replacement for the umlaut.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/hacc4_6121.jpg"></div><p></p>
      <p>Here, it's used in a Hungarian name, elsewhere it is even used in German words.</p>
