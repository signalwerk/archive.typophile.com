    html: <p>That is, the change in curvature form reminds me of Greek ἄ, whereas, if the accent is meant to indicate a vowel that is both one which takes an umlaut, and one that is long, I would be inclined to imagine that it was decided that an acute accent coming out of the middle of a diaresis was rejected (I thought there was a Polytonic Greek accent like that, but I can't find it in the Unicode Greek Extended block)... and, if the idea of having "two accents" is rejected, I suspect that the current conventional practice - two small acute accents, close together and neatly centered, is what is preferred. The fact that there is two of them is all the reference to the umlaut that is required.</p>
