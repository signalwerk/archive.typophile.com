    <p>Here is another town logo I am doing, this time for Rosetown. Again, looking for any comments &amp; critique, also if you have any ideas as to more of a “rose” like symbol, ideas would be great.</p>
    <p>Requirements:</p>
    <ul>
    <li>Discover Rosetown text used in that order</li>
    <li>The color red that is seen in the logo</li>
    <li>A symbol representing a rose</li>
    </ul>
    <p>Again, looking forward to your input.</p>
    <p><a href="http://freshnewthing.com/rosetown_logo.jpg" title="http://freshnewthing.com/rosetown_logo.jpg">http://freshnewthing.com/rosetown_logo.jpg</a></p>
