      <p>I like this one. It’s nice and subtle and balanced. Funnily, in this one the “.com” doesn’t bother me as much. I think it might be because everything else doesn’t lend itself to an online company that it doesn’t take it over the top. </p>
      <p>I like the subtle shade changes in the rose mark, however, I would suggest changing the perspective. Right now it doesn’t look much like a rose. I think a head-on perspective (looking into the center of the rose as opposed to the side) might work better. For some reason, a Charles Rennie Macintosh rose came into my mind when I read the name. Here’s an example: <a href="http://ecx.images-amazon.com/images/I/5158M2VM5GL._SL500_AA280_.jpg" title="http://ecx.images-amazon.com/images/I/5158M2VM5GL._SL500_AA280_.jpg">http://ecx.images-amazon.com/images/I/5158M2VM5GL._SL500_AA280_.jpg</a></p>
      <p>It’s a nice simple shape and I think would work well with the overlapping, transparent petal feel you have right now.</p>
      <p>penn</p>
