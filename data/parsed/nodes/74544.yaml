    <p>Guys, </p>
    <p>I just ran into a problem in InDesign and Illustrator. In short: at the end of the line InDesign and Illustrator <strong>imply</strong> a space glyph. That's pretty annoying. </p>
    <p>So I had this portion of code: </p>
    <p><code>@WORDSEPA = [space period comma];<br>
    @ALLTEXT = [...all glyphs <strong>including</strong> space...];</code></p>
    <p><code>feature calt {<br>
    	lookup calt.linefina {<br>
    		ignore sub @linefina0' @ALLTEXT;<br>
    		sub @linefina0' by @linefina1;<br>
    	} calt.linefina;</code></p>
    <p><code>	lookup calt.wordfina {<br>
    		sub @wordfina0' @WORDSEPA by @wordfina1;<br>
    	} calt.wordfina;<br>
    } calt;</code></p>
    <p>which worked fine in TextEdit or Word 2010. At the end of a <strong>word</strong>, the <code>@wordfina0</code> class was substituted by the <code>@wordfina1</code> class, while at the end of a <strong>line</strong>, the <code>@linefina0</code> class was substituted by the <code>@linefina1</code> class. But in InDesign, the second lookup (<code>calt.wordfina</code>) kicked in, not the first. </p>
    <p>So I discovered that InDesign and Illustrator (CS4 and CS5) imply a <code>space</code> glyph at the end of every line (including the last line in a text frame).  </p>
    <p>I developed a workaround that looks like the following: </p>
    <p><code>@WORDSEPA = [space period comma];<br>
    @ALLTEXT = [...all glyphs <strong>not including</strong> space...];</code></p>
    <p><code>feature calt {<br>
    	lookup calt.linefina {<br>
    		ignore sub @linefina0' @ALLTEXT;<br>
    		ignore sub @linefina0' space @ALLTEXT;<br>
    		sub @linefina0' by @linefina1;<br>
    	} calt.linefina;</code></p>
    <p><code>	lookup calt.wordfina {<br>
    		sub @wordfina0' @WORDSEPA by @wordfina1;<br>
    	} calt.wordfina;<br>
    } calt;</code></p>
    <p>This now works in TextEdit and Word 2010 (where the first <code>ignore sub</code> rule kicks in), as well as in InDesign and Illustrator (where the second <code>ignore sub</code> rule is used). Of course, a side-effect of this is that typing two spaces will make the <code>calt.linefina</code> lookup kick in instead of the <code>calt.wordfina</code> lookup, but I think it's an acceptable price to pay. </p>
    <p>However, I believe this is a bug in InDesign and Illustrator (I've informed Adobe about this). </p>
    <p>Best,<br>
    Adam</p>
