  html: |-
    <p>Hi folks,</p>
    <p>I was hoping to get some advice on choosing a font for a tag line. The original logo is a combination of stone and stone sans. The client envisages the new strap line being created in a script type font below the current logo. My concern is should i be adding a new font to the logo or would it be more appropriate to use an italic stone script. Any advice or direction would be greatly appreciated.</p>
    <p>thanks,</p>
    <p>paul</p>
