      <p>Blayne,</p>
      <p>I think you need to get farther away from Helvetica to really make your small pages readable. Helvetica has the disadvantages of very closed letters, very static, similar forms, and very tight spacing. Overall it works better at sizes above 12. For a hymnal I suggest something more humane, open spaced, and comfortable. Good candidates:</p>
      <p>Eva, Fresco or Versa from <a class="freelinking external" href="http://www.ourtype.be/" rel="nofollow">Ourtype,</a></p>
      <p><a class="freelinking external" href="http://www.fontshop.com/fonts/singles/fontfont/ff_clifford_six_roman/" rel="nofollow">Clifford Six,</a></p>
      <p><a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?pid=243230&amp;grab_id=0&amp;page_id=15470&amp;query=Calisto&amp;SCOPE=Fonts" rel="nofollow">Calisto,</a></p>
      <p><a class="freelinking external" href="http://www.beorcana.com/specs3.html" rel="nofollow">Beorcana,</a></p>
      <p><a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?pid=431853&amp;" rel="nofollow">Albertina,</a></p>
      <p><a class="freelinking external" href="http://www.fonts.com/findfonts/detail.htm?pid=431843&amp;" rel="nofollow">Columbus,</a></p>
      <p><a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/linotype/swift_2_virtual/" rel="nofollow">Swift</a></p>
      <p><a class="freelinking external" href="http://www.itcfonts.com/fonts/font/pid/427696/ITC+Stone+Serif+Volume/detail&amp;grab_id=0&amp;page_id=86399&amp;query=stone&amp;SCOPE=ITCFonts" rel="nofollow">Stone Serif</a></p>
      <p>or, if you have a lavish budget, <a class="freelinking external" href="http://www.teff.nl/fonts/lexicon/index.html" rel="nofollow">Lexicon,</a> with short or long descenders. </p>
      <p>Each of these suggestions has several qualities that can help you. They are all economical because they are low-contrast, have large x-heights, are slightly condensed, are very clear and crisp, or possibly all these. Since point size is completely relative in type (10 looks like 7 in another face), you have to adjust the size of your type until it hits the sweet spot where it's clearly readable, yet still conserving space. This is something only your eyes can tell you. So you might be able to set Stone Serif or Albertina at 8 point, but you might have to set Lexicon or Columbus at 10 for the same clarity and comfort. </p>
      <p>Notice also that I have suggested both serif and sans faces. There are several sans faces that present ideal clarity at small sizes, and several serif faces that also perform at these small sizes (5, 6, 7 point). Not all serif faces, nor all sans faces can do this job. Generally, the typeface has to be designed specifically for that purpose in order to perform well. </p>
      <p>In any case, getting away from the unfortunate qualities of Helvetica will be an advantage.</p>
