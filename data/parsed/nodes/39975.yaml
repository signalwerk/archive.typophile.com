    html: <p>The Episcopal Church Hymnal 1982 used a very light Baskerville, and I can scarcely make it out, especially in typically murky church lighting. For me (and perhaps many other users), the labor of reading words and music at the same time makes legibility a paramount concern -- please, please run some tests in unfavorable conditions with bleary-eyed older users, to make sure your project (however handsome it may be in bright light, to youthful eyes) doesn't end up unusable to a large proportion of the congregation.</p>
