      <p>Funny enough... I did a survey of the fonts I had on my computer and I came across Chaparral Pro.  I really like the look of it, a bit casual for a serif which I like.  When I compare it to other hymnbooks it does look slightly thinner which could be just the laser printer I'm using... Would it be tacky to use the semibold variant?  The semibold is then a bit thicker than the hymnbooks I'm referencing but then again it might perform well on old eyes???  of course it all depends I know and without you all seeing the finished product it's hard to say...</p>
      <p>Perhaps the question should be... Would Semibold be ok as main lyric text or do folks mostly use semibold for items that you would otherwise bold such as perhaps a title but didn't want the heavy full bold... </p>
      <p>This has kinda turned into a nice thread!  Perhaps it'll help the next person researching fonts for musical engraving.</p>
      <p>Best,</p>
      <p>B</p>
