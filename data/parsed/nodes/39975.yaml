    <p>Hey kids... New here in these parts...</p>
    <p>Working on a hymnbook project where the pages are small... 5.5 x 8.5 (inches that is...)</p>
    <p>Have been using Helvetica (about 9px) but need something in the same vein... clean, sans serif, easy on the eyes...  but less spread out.</p>
    <p>A few fonts i'm looking at:</p>
    <p>Univers Standard Condensed</p>
    <p>Brown Gothic</p>
    <p>Helvetica Standard Condensed</p>
    <p>ITC Franklin Gothic Standard Condensed</p>
    <p>EF TV Nord 1</p>
    <p>So... can those of you patient with a typonewb help a brutha out?</p>
    <p>Best,</p>
