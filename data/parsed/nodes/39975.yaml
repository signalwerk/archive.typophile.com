      <p>A response from a friend of mine who's a musical engraver:</p>
      <p>"I think I have to agree with some of the responses to your post on the typophile forum. A low contrast serif font will read much easier at small point sizes. I am a huge fan of sans serif fonts but after working with a guy who studied typography religiously, I came to really appreciate the font designers (of legitimate fonts) and the care they put into making a particular font work for specific uses.</p>
      <p>I have always liked Stone ITC as someone mentioned. The serifs have a smaller softer profile which makes it seem more like a sans font. Myriad Condensed is also a nice font--as someone else mentioned. I think I would go for the serif font though for a more professional printed look. Just my two cents though."</p>
      <p>Thought I'd include it here for the sake of this thread.  Thanks for all your help... I'm going through and testing most of the fonts mentioned.</p>
