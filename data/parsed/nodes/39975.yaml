      <p>Many of the foundries have a type tester or preview tool. Everyone calls it something different, from "try me!" to "letter setter", or sometimes it's just part of the sample pages like on fontshop.com ("generate sample"). </p>
      <p>Unfortunately not as many foundries offer PDFs with small text, which would help you more in deciding. It's nearly impossible to get a sense of a font's performance in small sizes from a 42-point screen image. </p>
      <p>Two I forgot: <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/garagefonts/freight_text_medium/" rel="nofollow">Freight Text,</a> and <a class="freelinking external" href="http://www.fonts.com/FindFonts/RecentReleases/2007/CharterPro.htm" rel="nofollow">Legacy Sans/Serif.</a> Some recent releases from ITC and Monotype have PDFs you can print for a better idea. </p>
      <p>Generally you can find PDFs and other testing tools if you snoop around. I understand if you need to set aside time for that. </p>
      <p>I will send you a printed Beorcana specimen if you contact me thru the typophile contact link.</p>
