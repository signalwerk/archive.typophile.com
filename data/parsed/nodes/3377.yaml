  html: <p>I'm currently working on a student project where I'm supposed to do a movie poster. Now I'm struggeling with the hard work in finding two different fonts. The first one, and the most significant, is the font often used to present the director aso. in the "footer" of the poster (see army of darkness). The second one is a font similar to the one used for the movie Casablanca (see Casablanca). <br> <br>Look at the two images attached. <br> <br>I have found one font simmilar to "casablanca" but , unfortunatelly for me, it cost some money. My student budget doesn't have any space for this kind of investments :-( <br> <br><img src="http://www.typophile.com/forums/messages/83/27541.jpg" alt=""><img src="http://www.typophile.com/forums/messages/83/27542.jpg" alt=""></p>
