    <p>Hi,</p>
    <p>I was looking at both, they both seem pretty much the same design-wise (note that I haven't verified closely). I was wondering if any of you knew which one was best (not only design wise)? I'm not sure but it seems Bitstream's is a TTF in a OTF, whereas ITC's is a PS in OTF.</p>
    <p>Also I was wondering what sans-serif you'd use with it, I was thinking maybe FF Scala Sans Pro since it has support for many languages, and a good range of features like Charter, and a design that would fit well I think. Only problem is that I cannot try it for real because the only font I have from both is Charis SIL (Charter clone) that lacks many of the features I want, but I thought some of you would know.</p>
    <p>Thanks</p>
