      <p>Pierre-Luc Auclair&gt; I have wanted to know this very same information. Unfortunately, I do not have the answer. But generally speaking I have noticed ITC/Monotype to be more expensive than other distributors for a similar, if not the same product.</p>
      <p>In this particular instance, I would go with Bitsteam on the basis of price. Charter BT PRO is $199 and ITC Charter Pro is $239. But I and you might too, be worried about proper kerning table programing and other technical considerations... I just don't know about that :-(</p>
      <p>{Compare Rotis from Linotype and Monotype} Letraset is another distributor that is about $20 more expensive for the same type.</p>
      <p>Sorry I'm not very much help,</p>
      <p>Mikey</p>
