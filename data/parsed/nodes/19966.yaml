      <p>Charter started out as a Bitstream face and then was picked up by ITC.</p>
      <p>I did a detailed analysis of Charter years ago for a client and found that with the exception of the lowercase o, Charter shared a lot of the proportions of Joanna, or was well close.</p>
      <p>Perhaps Gill Sans will go well with Charter.</p>
      <p>James</p>
