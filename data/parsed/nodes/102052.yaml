    html: <p>SandVo, that extra spacing between the characters would be handled by kerning them. You need to establish a kern table for your font.</p>
    html_clean: <p>SandVo, that extra spacing between the characters would be handled by kerning them. You need to establish a kern table for your font.</p>
  - id: 549833
    user: 1262
    date: 2013-04-05T13:24:00
    date_raw: 5 Apr 2013 — 1:24pm
    votes: null
    html: <p>Yes, this is a kerning issue. The combinations Ca and Cá have kerning values in the font, but your new diacritic characters do not. You need to add kerning for these new characters.</p>
    html_clean: <p>Yes, this is a kerning issue. The combinations Ca and Cá have kerning values in the font, but your new diacritic characters do not. You need to add kerning for these new characters.</p>
