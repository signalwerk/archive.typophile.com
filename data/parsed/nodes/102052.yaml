    html: "<p>The FontLab manual is rather daunting (I would imagine even more so if English is not your first language) and just figuring out where to look can often be a challenge. You'll find the needed information in Chapter 7: Editing Metrics, which contains the section \"Editing Kerning\" (page 579 in the Mac manual, page 567 in the Windows version).</p>"
