      <p>There are a number of tiny serif/almost sans fonts like this, but the one that resembles this most closely to my eye is <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/agenda/?refby=bowfin" rel="nofollow">URW Agenda</a>, but there seem to be more serifs on some letters in the poster. Perhaps a few serifs were added to make the lettering look more uniform?</p>
      <p>- Mike Yanega</p>
