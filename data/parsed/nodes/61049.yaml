    <p>Hello everyone...  Im working o n a typeface and i need to take desitions about numerals. This typeface is made for text.I would like to know if there are  special consideratons i should have when designing numerals for a neoclasical face.</p>
    <p>And concerning the number 4, is the open 4 more suited for sans serif typefaces? or, what is the origin of this "open" 4? Do you know if there are classic typefaces with this kind of four.</p>
    <p>Books, links, examples... all will be wellcome.</p>
    <p>thankyou</p>
    <p>L.</p>
    <p>(Attached the small caps numerals, and the Lining numerals)</p>
