      <p>To be honest I think the comparison with Neo Sans is fair but that doesn't make Exo Sans irrelevant. I think there is plenty of room for a typeface like this. However, if you're going to be cocky about its release and funding I would really make sure there are no imperfections. For example, the 'm' is the width of 2 n's which is too wide and the W/w look stylistically out of place (a 'W' as in Neo Sans would fit the style of your typeface better).</p>
      <p>But why would you want to offer this typeface for free anyway? I think the style is so specific that the general designer won't have any use for this. I would leave it up to demand and ask a price for it. Anyway, I see the funding target has been accomplished so my point is contextually superseded.</p>
