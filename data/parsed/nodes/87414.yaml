      <p>Hi Minerva,<br>
      The fonts that you've mentioned are not close to what Exo will offer (not talking about quality or beauty). Only Novocento is a big font family, but if you see carefully, only some weights are free, others you have to pay. The designer of Diavlo for instance have a lot of paid fonts, like Museo, Calluna and others. </p>
      <p>I would love to live in a world where everything was just pure altruism, but my internet, energy, water provider is not altruistic at all! =D</p>
      <p>Exo is a font family of 18 files, each one with a lot of opentype features. What I am asking is some generosity in return, only the people who want and can should contribute. Because some people want to help but they don't have that much money, but some persons do an they contribute for others that don't have money, so everybody will use the font. That is very altruistic. </p>
      <p>Lately, the ammount I'm asking for funding this project is low (not huge at all), it is not a payment, it is just a help for me to keep working on type, and eventually have some money after a lot of months working hard without any. And its all that I am asking, after that Exo will be free forever, for every person. </p>
      <p>I hope you understand</p>
