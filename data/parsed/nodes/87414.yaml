      <p>The same reasoning applied to Exo and Neo: Exo looks like it copied the signature shapes of Neo, nudged a few things here and there (tapers on horisontals, amputated y) and used these as the basis for a new font. I'm not saying that is the case, but there sure is no added value here.</p>
      <p>The hnmur shapes are devoid of optical compensations and r is much too wide, tails of t/l are sloppy, the inner space of letters like L, c and v are off by a mile and others again (w) totally off balance. The weight of diagonals are very problematic, and so are the horisontal parts in rounds. Not to mention the M which doesn't belong here at all. I could go on and on.</p>
