    html: |-
      <p><em>I must agree that Neo Sans might look better ...</em></p>
      <p>Compare the internal counterspaces. Neo Sans is better balanced. </p>
      <p><em>... what do you think of theses typefaces Univers, Frutiger, Helvetica, Akzidenz Grotesk, Din, Arial, and sooo on.</em></p>
      <p>I think Frutiger is a humanist, and far from all the others mentioned.</p>
      <p>Akzidenz Grotesk, Helvetica and Arial have more in common, but where Helvetica is cold and calculated AG is quirky and lively and spaced entirely different. Arial is closer related to Monotype Grotesque than any of these, but it has been shoe-horned into Helvetica's metrics for marketing reasons.</p>
      <p>DIN is pure geometry plus straight sides.</p>
