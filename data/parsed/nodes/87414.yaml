    <p>Hi, I'm working on very complete font family that will be released for free. It has 9 weights, all with true italics, a lot of opentype features and over 700 glyphs.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/5_4010.gif"></div><br>
    Now I'm looking for funding through kickstarter. If you can help me on this project by being a backer or sharing this project with your friends I would be very grateful.<br>
    <a href="http://www.kickstarter.com/projects/1010856090/the-exo-typeface-family" title="http://www.kickstarter.com/projects/1010856090/the-exo-typeface-family">http://www.kickstarter.com/projects/1010856090/the-exo-typeface-family</a><br>
    Thank you very much!<p></p>
