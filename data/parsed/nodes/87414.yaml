      <p>Hey, thanks for the replies. </p>
      <p>First, If you cannot give, I totally understand, you can however share the project through facebook, twitter, blog, if you want to help the project. </p>
      <p>Secondly, If the font is not funded (I hope it will be funded), All the money pledged is returned to the backers. So you never lose. </p>
