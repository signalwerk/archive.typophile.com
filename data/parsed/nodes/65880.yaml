    <p>Designing information before designers<br>
    --------------------------------------<br>
    Monday 11 to Friday 29 January 2010<br>
    Exhibition of information design from the nineteenth century. Presented by Paul Stiff, Paul Dobraszczyk and Mike Esbester; talk on 14 January</p>
    <p>Typeface<br>
    --------<br>
    Thursday 21 January 2010<br>
    UK movie premiere</p>
    <p>Design 4 music/Music + design<br>
    -----------------------------<br>
    Friday 29 January 2010<br>
    Conference exploring this complex, passionate, sometimes obsessive relationship. Curated by Catherine Dixon and John L. Walters</p>
    <p>Zainer's imperfect impressions<br>
    ------------------------------<br>
    Tuesday 23 February 2010<br>
    Fifth annual Justin Howes memorial lecture, given by Claire Bolton</p>
    <p>Book design in St. Gallen<br>
    -------------------------<br>
    Thursday 4 to Friday 19 March 2010<br>
    Talks and exhibition of past and present work. Curated by Jost Hochuli; talks on 4 March and 17 March</p>
    <p>Our admission prices remain excellent value for money (the Justin Howes memorial lecture is free). Why not make 2010 the year you join the Friends of St Bride Library and help to keep the Library alive: <a href="http://www.stbride.org/friends" title="http://www.stbride.org/friends">http://www.stbride.org/friends</a></p>
    <p>We look forward to seeing you soon.</p>
    <p>Friends of St Bride Library Events Team<br>
    . . . . . . . .</p>
