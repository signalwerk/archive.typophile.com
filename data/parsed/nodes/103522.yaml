    <p>Hi guys! I'm new here and need some answers. i'm in the final semestre of my design course, and I'm doing the final graphic project. For my project, I must develop a new fashion brand and for this brand I need make a visual identity. Well, to do this visual identity I'm thinking use the font Swiss 721 family. That's my question...would be Swiss 721 family a good font for impression and graphics stuffs?? And if someone can tell me something about Swiss 721 history, designer, criation.... Thanks for now...</p>
    <p>Kamille</p>
