    html: <p>Swiss 721 is a very clear face that will be excellent for an identity system that calls for something as clean and legible as possible while having more font variations than Helvetica. As far as history goes, to the best of my knowledge it is a basic variation of Helvetica (very similar to Helvetica Neue) created by Bitstream sometime in the last 30 years.</p>
