    date: null
    date_raw: null
    votes: null
    html: '<p>Grisel,  <br> <br>it is fully OK to use a 1330 UPM. However, it is indeed the case that ideally, you need to consider all major screen ppi settings to be sure that your font works well on all systems. Use the formula:  <br>(ppem size) = (dpi density) / 72 * (point size) <br>And use at least following dpi densities:  <br>72 (MacOS) <br>96 (Windows "small fonts") <br>120 (Windows "large fonts") <br> <br>This means, that, for example, for bitmaps to appear at 10 points, you should include bitmaps for 10, 13 and 17 ppem.  <br> <br>Adam</p>'
