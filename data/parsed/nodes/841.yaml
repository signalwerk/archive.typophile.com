    votes: null
    html: <p>Thanks for the answers. I was trying and see that if I use 1330 UPM in Fontlab (to compensate the 96 dpi in PC screens) I can get my font to work well at 10 points in PC. <br>It's than OK? What happens if someone use a screen resolution of 72? Sorry, but I'm a Mac user. Thanks a lot.</p>
    html_clean: <p>Thanks for the answers. I was trying and see that if I use 1330 UPM in Fontlab (to compensate the 96 dpi in PC screens) I can get my font to work well at 10 points in PC. <br>It's than OK? What happens if someone use a screen resolution of 72? Sorry, but I'm a Mac user. Thanks a lot.</p>
  - id: 6171
