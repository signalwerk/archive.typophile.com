  html: <p>Hi, I'm using Fontlab in a Mac. I want to know how must export a font in TT format for PC. I mean, the "regular" o normal settings for a regular font. I'm making a pixel font, and have no problem with mac with default settings. But in PC i'ts not working. Can't get the exact size. In my case 8 points. Hope you understand my poor english. Thanx in advance.</p>
