    html: "<p>Grisel: Fonts are displayed differently on a Mac vs. a PC. Since it sounds like you are dealing with screen resolution problem, try setting the PC version of the font at a smaller size. Not sure if this will help or not.</p>"
    html_clean: "<p>Grisel: Fonts are displayed differently on a Mac vs. a PC. Since it sounds like you are dealing with screen resolution problem, try setting the PC version of the font at a smaller size. Not sure if this will help or not.</p>"
