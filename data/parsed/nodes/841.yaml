    votes: null
    html: <p>IIRC, Microsoft has an article about bitmap fonts on <a href="http://www.microsoft.com/typography" target="_blank"> their site</a>. PC fonts need to be 11ppem to appear as 8 points. 13ppem if they're displaying on SVGA (120dpi).</p>
    html_clean: <p>IIRC, Microsoft has an article about bitmap fonts on <a href="http://www.microsoft.com/typography" target="_blank" class="link-external"> their site</a>. PC fonts need to be 11ppem to appear as 8 points. 13ppem if they're displaying on SVGA (120dpi).</p>
