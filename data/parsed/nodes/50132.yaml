      <p>Nancy: “my point is that non-type folk, but visually literate individuals, notice this stuff. So we in the type industry should pay attention.”</p>
      <p>We in the type industry pay attention, thanks. Starting in the late winter and early spring of ’07, (when MS finally released a system with antialiased type on by default), you will find somewhere between 40,000 and 100,000 words on this topic right here at Typophile. The differences between Adobe, Apple and MS antialiasing were studied, quantified and discussed at great length. When the dust had cleared and the broken bottles of Yukon Jack and Mountain Dew were swept up:<br>
      Adobe settled on, “We are all just carbon/water balls tripping ’round the sun. Reading screens is inferior to print, why waste time?”<br>
      Apple decided, “People like it!” (which means Jobs, which makes it plural, I guess).<br>
      And Microsoft proclaimed proudly that, “Readability is a software engineering problem, not a type design problem.”<br>
      I said and repeat, “They all make modestly nice fonts for previewing print.”<br>
      Then, there were another 10,000 to 1,000,000,000 words discussing Microsoft’s thinly veiled attempts at ’scientific studies’ of reading and Cleartype. When the dust cleared from that, the U. of Michigan Business School, the iDocs Union and former students of MS’s Behavioral Psychology Guru had to be swept up and tossed in the “Oh Really!?” bin. Then, most of the people with real skills and open eyes in this area of the field went off to help readers of systems used by a minority of users, which is working out quite nicely for all involved, whilst we wait...</p>
      <p>Cheers.</p>
