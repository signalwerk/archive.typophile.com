    <p>This article was brought to my attention:</p>
    <p><a href="http://www.reidreviews.com/reidreviews/" title="http://www.reidreviews.com/reidreviews/">http://www.reidreviews.com/reidreviews/</a>  </p>
    <p>(SEE ARTICLES AT BOTTOM OF PAGE, “A Side Note on Macintosh Computers and Text Readability” and “Zooming Reid Reviews With Macintosh OSX”) </p>
    <p>So I turned to my favorite type guru for his expert opinion, Steve Matteson, Ascender, Corp.  He was gracious enough to answer and allow me to post his response:</p>
    <p>“Hi Nancy,</p>
    <p>Boy you’ve really stepped in it with this one! :-) The skinny on this<br>
    link is that type on screen is truly a big fat mess. There’s a lot of<br>
    bad speculation on this blog but a grain of truth. The variation of<br>
    rasterizers is much deeper than the author initially suggests.... he<br>
    doesn’t even mention Adobe applications which override Apple and<br>
    Microsoft rasterizers to display type in their own preferred way<br>
    (their rasterizer is called ’CoolType’... don’t ask why).</p>
    <p>It’s a terribly subjective topic - some prefer black and white and<br>
    others prefer anti-aliased fuzz. Some just need new prescriptions for<br>
    their glasses. The arguments against black and white are that it is<br>
    too stark. Also that spacing suffers*. The arguments against anti-<br>
    aliased (gray scale) is the lack of edge definition. Microsoft Windows<br>
    uses ClearType and some people bitterly hate it because they are<br>
    sensitive to the color fringing. Microsoft has had independent<br>
    research done which quantifies the legibility of ClearType of anti-<br>
    aliasing. I think their claims were a 5% improvement in reading<br>
    performance with ClearType.</p>
    <p>Apple thinks they have the ultimate solution which needs no further<br>
    improvement. They are putting no investment that I’m aware of in<br>
    refining type quality. Google and Microsoft kill Apple in side by side<br>
    comparisons. Being a hardcore Apple fan this is terribly frustrating.</p>
    <p>For Microsoft’s part - the ClearType tuner gives you ability to fine<br>
    tune your system for the way type renders in non-Adobe apps.</p>
    <p></p><div class="imageWrap"><img src="/files/pastedGraphic_3527.gif"></div><p></p>
    <p>The attachment with the 6 text blocks shows the range in settings. At<br>
    least they realize that people see differently. Apple seems to rely<br>
    only on Steve Jobs’ personal reading glasses prescription.</p>
    <p>The second attachment illustrates the same *exact* font data rendered<br>
    with different rasterizers.... </p>
    <p></p><div class="imageWrap"><img src="/files/screenfonts_6043.gif"></div><p></p>
    <p>just a ’for example’ to prove that different rasterizers draw type<br>
    very differently.</p>
    <p>*spacing suffers because most applications choose to round high<br>
    resolution letter widths to pixels. The effect is sort of randomized<br>
    spacing - good at one size but not another. The alternative is to have<br>
    perfect spacing on screen which then is potentially/likely different<br>
    than print (causing line breaks to occur in different places than on<br>
    screen).</p>
    <p>Well I hope this helps.... someday I should write this stuff down....</p>
    <p>Steve”</p>
