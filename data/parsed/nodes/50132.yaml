      <p>hi,</p>
      <p>i know what leading is but obviously the blogger does not.  what was interesting to me is that this showed up on a PHOTOGRAPY blog.</p>
      <p>i think steve matteson is correct, however, that perception is everything and there are many conflicting opinions on type readability on the web.  lord knows, the PRINT readability question is far from clear.  ellen lupton argues that readability is habitual (or conditioned,) that if i grow up reading black letter i would find it perfectly readable.  others do not share her view.  there are questions about the repetitive structure of the alphabet we use; so many characters repeat forms (b d, c o, h l p q, and etc.,).  but most researchers who actually spend time on readability issues are not typographers and typographers understand the LANGUAGE of type.</p>
      <p>what i think is that all of these issues are important.  think about type foundries mediating letterforms in metal, each one rendered according to their ability and pocket.   there were beautifully rendered cuts of type, and really lousy ones.  same with the shift to hot metal then cold.  what’s going on right now is that there are (1) people who draw the type then people who write the software to manage it then (3) people who receive the type on zillions of devices that render it differently.  #3 is new.  so, now we need (4) someone to figure out what it how it should function with #3, and there is no “canon” to do this.</p>
      <p>yah, splitting hairs to some.</p>
