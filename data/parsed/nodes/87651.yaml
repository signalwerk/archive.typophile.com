    <p>I totally need help!</p>
    <p>Updating to Lion – I know it was a bad idea – only brought trouble to my FontLab workflow.<br>
    Since the last build FontLab luckily works (maybe even better than on Snow Leopard), BUT I just can’t get my macros to work!</p>
    <p>Here is the latest Error message I get:</p>
    <p>Traceback (most recent call last):<br>
      File "", line 20, in<br>
    ImportError: No module named robofab.interface.all.dialogs</p>
    <p>Robofab is installed. Python too. (I guess)</p>
    <p>I am so thankful for tips, it’s driving me crazy,<br>
    plus I am obviously not able to wrap my mind around this myself.</p>
