      <p>Wow, Claus is passing on the knowledge … :) </p>
      <p>Lion and FL 5.1 are using a newer version of Python, so you just have to move over your Robofab folders to the newer Python (2.6 I believe?), or do a re-install.</p>
      <p>Find the old stuff in /Library/Python/2.3/, reproduce in 2.6</p>
      <p>Or do as Claus said and get the SVN.</p>
