    html: |-
      <p>Try pulling the latest packages from SVN. SVN is pretty awesome, it keeps you up to date with code whenever you want.<br>
      It is installed on your Mac already. So all you have to do is: set up a folder where you want the distros to be </p>
      <p>(I have ~/svn/)</p>
      <p>Open a Terminal in that folder and type </p>
      <p>svn co <a href="http://svn.robofab.com/svn" title="http://svn.robofab.com/svn">http://svn.robofab.com/svn</a> update <a href="http://svn.typesupply.com/packages/dialogKit" title="http://svn.typesupply.com/packages/dialogKit">http://svn.typesupply.com/packages/dialogKit</a> (press enter)</p>
      <p>svn co <a href="https://fonttools.svn.sourceforge.net/svnroot/fonttools" title="https://fonttools.svn.sourceforge.net/svnroot/fonttools">https://fonttools.svn.sourceforge.net/svnroot/fonttools</a> (press enter)<br>
      svn co <a href="http://svn.typesupply.com/packages/vanilla" title="http://svn.typesupply.com/packages/vanilla">http://svn.typesupply.com/packages/vanilla</a> (press enter)<br>
      svn co <a href="http://svn.typesupply.com/packages/ufo2fdk" title="http://svn.typesupply.com/packages/ufo2fdk">http://svn.typesupply.com/packages/ufo2fdk</a> (press enter)</p>
      <p>SVN will download all the code from the specified sources.</p>
      <p>Now all you have to do is tell Python where your code is:<br>
      Go to your Python directory(/ies):</p>
      <p>Macintosh HD/Library/Python/2.6/site-packages/<br>
      (FL now uses 2.6, and I believe everything else as well, but you can do that for all the Python versions if you want.)</p>
      <p>Locate the file robofab.pth, open it and change the contents (to the path you have dumped robofab to):<br>
      /Users/YOUR-USER-NAME/svn/svn.robofab.com/trunk/Lib</p>
      <p>Locate the file dialogKit.pth, open it and change the contents (to the path you have dumped robofab to):<br>
      /Users/YOUR-USER-NAME/svn/dialogKit/trunk/Lib</p>
      <p>Locate the file vanilla.pth, open it and change the contents (to the path you have dumped robofab to):<br>
      /Users/YOUR-USER-NAME/svn/vanilla/trunk/Lib</p>
      <p>Locate the file robofab.pth, open it and change the contents (to the path you have dumped robofab to):<br>
      /Users/YOUR-USER-NAME/svn/fonttools/trunk/Lib</p>
      <p>Now copy your .PTH files into all the different Python 'site-packages' folders like in my screenshot.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen-Shot-2011-11-22-at-17_3476.22.gif"></div><p></p>
      <p>Now copy the Fontlab scripts from the Robofab SVN folder into your Fontlab script folder.</p>
      <p>Restart Fontlab.</p>
      <p>Awesome sauce.</p>
