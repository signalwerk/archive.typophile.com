    html: <p>I would think the majority of font purchasers have access to OpenType savvy apps (and that majority will only increase in the future), so I would include them in the font. Then I would estimate whether the additional sales to non-OT purchasers would be worth the hassle of adding an additional separate font of smallcaps, and if so, I'd make it and throw it into the same package.</p>
