    html: <p>The New York magazine masthead has been specifically designed for the merged newspaper of the New York Herald-Tribune, World-Telegram &amp; Sun and Journal-American’s Sunday magazine. It's based on <a href="http://www.myfonts.com/fonts/itc/bookman/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Bookman</a> (Light Italic with Swash). Mark Simonson has recently released a beautiful revival of Bookman Old Style called <a href="http://www.myfonts.com/fonts/marksimonson/bookmania/light-italic/glyphs.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Bookmania</a> with tons of alternates and swashes characters. I believe you could get pretty close using his version.</p>
