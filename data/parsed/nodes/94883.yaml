    <p>Hi,</p>
    <p>I'm trying to figure out what font the New York magazine logo is based off of...  I know the magazine uses variations of Miller through out, but I've been matching it up and there's no forms that match up to this, unless it was heavily customized...  I swear i've seen these Swashes before,  and insight?</p>
    <p>Thanks</p>
