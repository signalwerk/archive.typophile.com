    html: |-
      <p>What I do in FontLab is to "clean up" the outlines (i.e. make them compatible) <cite>before</cite> joining the two masters, then you do not need to tweak anything afterwards.</p>
      <p>Not quite sure how Superpolator deals with incompatible contours, maybe the results are better than with FontLab.</p>
      <p>[edit/update]:</p>
      <p>Just saw on the Superpolator website:</p>
      <p><cite>The app does not make the glyphs interpolatable, the masters need to have the right number of contours in the right order, each contour the right number of on-curve points. You know the drill.</cite></p>
      <p>In this sense, you may want to try MM in Fontlab first and move on to Superpolator once you have reached the limits of one-dimensional inter/extrapolation.</p>
