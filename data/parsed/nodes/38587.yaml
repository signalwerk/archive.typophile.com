  html: "<p>How good are the Fontlab interpolation tools? <em>Learn Fontlab Fast</em> really discourages using them, but I am interested in using interpolation for a student project and I am wondering what would be a better use of my time: cleaning up and tweaking outlines created by Fontlab, or learning to use superlator and generating outlines with it.</p>"
