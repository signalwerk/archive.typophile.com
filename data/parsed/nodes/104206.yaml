    <div class="node-spam-content"><p>Tiponautas is an independent type foundry run by Luis Alonso (Spain) and Ricardo Santos (Portugal) founded in 2011.</p>
    <p>Its members collaborate to carry out different typographic projects. Tiponautas designs their own typefaces in the broadest and most specific sense, ranging from custom-designed characters, or lettering, to custom type design, as well as its proper use in different graphic design fields, such as editorial design, corporate identity or web design. </p>
    <p>URL: <a class="freelinking external" href="http://www.tiponautas.com" rel="nofollow">www.tiponautas.com</a></p>
    </div>
