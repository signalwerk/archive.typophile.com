    <p>I would love to hear opinions from all, especially from the senior members, about this type palette. </p>
    <p>It is comprised of Gotham Condensed, Klavika, and Unit Slab.</p>
    <p>Does it work? Are their potential traps with this combo? If it doesn't work, why?</p>
    <p>(this was just a thrown-together example, so please ignore little details) </p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/GothamKlavikaUnit_3613.jpg"></div><p></p>
