    html: <p>That certainly feels right for the content. The Klavika/Unit Slab is an interesting combination and it works ok. If you intend to use them both in the same line, keep in mind that FF Unit (sans) was made specifically for this purpose (same proportions, x-height). But of course it can be more interesting to do something unexpected. BTW, I wouldn't space the text that tight if you go any smaller.</p>
