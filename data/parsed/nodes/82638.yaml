    html: |-
      <p>Thanks Stephen. Can you elaborate a little on your Klavika/Unit comments? I had considered Unit Sans, but it lacked the techy-ness I wanted. Klavika had a bit more "edge" but still shared some of Unit's character, in my eyes (especially the 'K'and 'M').</p>
      <p>I used auto-kerning for this example and I think I squeezed it a little tight. I would definitely let it relax at smaller sizes. </p>
      <p>Also, any tips for using these two in the same line?</p>
