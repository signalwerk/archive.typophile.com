    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Miguel Sousa</strong></p>
    <p>Received a <a href="http://www.typedesign.rdg.ac.uk/" rel="nofollow">MA in Typeface Design</a> with Distinction, from The <a href="/wiki/University%20of%20Reading" class="freelinking" rel="nofollow">University of Reading</a> in 2005.</p>
    <p>Creator of <a href="/wiki/adhesiontext" class="freelinking" rel="nofollow">adhesiontext</a>.</p>
    <p><a href="/wiki/TDC" class="freelinking" rel="nofollow">TDC</a> Winner for his typeface, <a href="http://www.tdc.org/news/2006Results/Calouste.html" rel="nofollow">Calouste</a>.</p>
    <p>Works at <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a> as part of their type design group.</p>
