    html: "<p>I love the Fish Factory sign. It’s typographic folk art, and it’s a great example of what someone can do who has no training and few tools (a lettering template in three sizes: large, colossal, and humongous), but who has imagination and knows exactly what message he/she wants to communicate. When I see a that sign, I think, “I want to eat here.”</p>"
