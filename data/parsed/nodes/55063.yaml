  html: |-
    <p>Fish Factory sign<br>
    <a class="freelinking-external" href="http://farm2.static.flickr.com/1230/1249477538_118c4ed0e6.jpg?v=0">http://farm2.static.flickr.com/1230/1249477538_118c4ed0e6.jpg?v=0</a><br>
    This sign is just all over the place. There’s kerning issues in almost every word, extra bold capital letters paired with bold cap letters, and the words do not have a proper baseline. The more you look at it the more problems you find. It’s kind of annoying to look at after a few minutes.</p>
    <p>Megaflicks sign<br>
    <a class="freelinking-external" href="http://i37.photobucket.com/albums/e57/davemathew76/megaflicks.jpg">http://i37.photobucket.com/albums/e57/davemathew76/megaflicks.jpg</a><br>
    This is a video store sign. The picture is pixelated, but I just thought this example of bad type was funny. There’s terrible kerning that makes the letters too close together to spell something else. Check it out.</p>
