    html: |-
      <p><cite>If you have duplicates you could always consider donating to TypeCon for the auction.</cite></p>
      <p>Being a great fan of typographic auctions, and being someone who has bid aggressively on items in the past, I have always been disappointed by the Typophile auctions and the true lack of zeal of those doing the bidding. Maybe it the lack of understanding as to the value of what is being offered, or perhaps it is an economic thing.</p>
      <p>I remember in San Francisco, Dave Farey found a beautiful copy of "Big Red" in one of the bookstores, and put it up for auction for what he paid for it, and it never even got an opening bid. I wound up paying him what he paid so he wouldn't have to lug it back home to the UK. Now I have two copies of "Big Red"!</p>
      <p>So I guess the short answer to your suggestion would be, probably not.</p>
    html_clean: |-
