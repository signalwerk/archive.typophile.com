      <p>You know, ITC would do well to offer a complete set of U&amp;lc. on DVD, like has been done with some other magazines. It's an invaluable resource for anyone interested in the history of type, and what was going on in the world of type from 1970 to 1999 (last printed issue was Fall 1999, as far I know).</p>
      <p>The older issues are tabloid size, so it would be awkward and time-consuming to copy an entire issue, at least with the means I have at my disposal.</p>
