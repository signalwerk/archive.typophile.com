      <p>It's interesting to see where you are going with this. You might consider bending or breaking some of the forms to get some more shapes. This could be used to make the letter forms more stadardized in width. The cross bar on the H as an example. If it bent in half downward the width of the character could be adjusted to be more in keeping with the rest of the characters. Right now it looks a little awkward. Good luck and have fun.</p>
