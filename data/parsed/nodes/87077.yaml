  html: |-
    <p>A text font in the Janson / Ehrhardt mode, but with many contemporary details and conveniences. </p>
    <p><a href="http://equityfont.com" title="http://equityfont.com">http://equityfont.com</a></p>
    <p>A snazzy PDF specimen is here:</p>
    <p><a href="http://typo.la/eqts" title="http://typo.la/eqts">http://typo.la/eqts</a></p>
    <p>The basic family includes 6 styles: regular, italic, bold, bold italic, regular small caps, and bold small caps. All 6 styles are provided in two weight grades (the default grade + a lighter grade for office printers that add weight)</p>
    <p>The standard license allows PDF embedding, @font-face embedding, and editable embedding (e.g., in word-processing documents).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/equity_3871.gif"></div><p></p>
