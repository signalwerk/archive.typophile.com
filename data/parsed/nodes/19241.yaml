    html: <p>You’re whining. I got into this business 8 years ago as an Assistant Art Director at a magazine. I worked 60+ hours/week for $50/day. After 7 years of not whining, I became a Creative Director who works 60+ hours/week. I also receive about 150-200 emails every day. Bust a** until you’re good enough to get a better job where you will still work long hours on insane deadlines, but the work will be more exploratory and you’ll make a little more money. You’ll find that in time, you’ll develop a much greater stress threshold. Maybe I’m a sadist, but if you’re passionate about design, paying your dues should be a source of pleasure. Good luck.</p>
