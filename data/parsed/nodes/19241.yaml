    <p>I was wondering how much work should be expected of a graphic artist in a day.. Is it unreasonable to have approx 20 files to prepare for email... i.e. outline fonts and size images and to recreate (Match Font.. completely redraw logo/design) approximatly 3 logos and do 3 to 5 complete layouts in a day.. Layouts = Typesetting with logos revisions.. </p>
    <p>This week so far = 100 ai files... Created.. everything from logo sizing to logo recreation...<br>
    83 outgoing emails<br>
    72 incoming emails<br>
    39 photoshop files.. remove backgrounds .. change shirt colors add logos and generally cleanup..<br>
    Take pictures of items for webpages etc...</p>
    <p>Created 72 pdf proof files...</p>
    <p>This is so far this week...</p>
    <p>Is this too much for too little.. under $14 an hour?  Is this unreasonable at any pay? or am I whining?????</p>
