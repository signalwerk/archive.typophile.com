      <p>Glad these bits &amp; pieces are useful; a few more...</p>
      <ol>
      <li>Sounds good.</li>
      <li>To take a step backwards, 6″×9″ is a gangly page, too wide for its height, but it's also one of the two most standard formats in North American printing, so in terms of economics it's what most publishers would push for. However, as you're your own client, I'd knock the width down to 5.75″. From there, use the Van de Graaf formula to establish your text block, then move it towards the outer edge to allow for creep, then nudge your outer and bottom margins to find a balance between classical proportions and contemporary norms. I use no set formula for this, but, depending on type-size/leading/etc., paper, and, of course, the subject matter of the book itself, I try a variety of measurements until the page is right. Hanging matter (such as if you were to hang the Chinese characters) will also play a role in determining your margins, but generally it's just about finding the right contrast of text-block to white-space, and at the moment, although based on classical proportions, your page looks out of whack.</li>
      <li>I'm backtracking, sort of, but I'd either drop the first paragraph more, or less; at the moment the chapter headings are feeling a bit uncertain.</li>
      <li>More than just "using" the margin, I found the earlier setting awkward in the way the body copy wrapped around the Chinese characters. Try dropping the Chinese string down so that it begins at the same x-height as the first line of body text.</li>
      <li>It's better now with the first font; the second font still needs a bit more tracking.</li>
      <li>You're right, the color is a bit off, but the sizing looks much better. Maybe nudge the second font up just slightly in size to draw out the color, or, scrap the second font and find another with a better x-height match.</li>
      </ol>
