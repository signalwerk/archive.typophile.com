      <p>[For some strange reason this post got re-ordered in the thread when I edited it...]</p>
      <ol>
      <li>As above, turn on hyphenation, or at the very least fine-tune your justification settings; the word-gaps (especially in the third section of page 2) are awful.</li>
      <li>While I find far too many books slaughter their margins and ignore proper proportions, I'd be surprised if your client doesn't kill you for all that wasted space (and paper) at the outer edge and bottom; this is, after all, not a 15th century codex -- also, as above, open up your spine margin a bit or it will get swallowed.</li>
      <li>I'd give more bottom air to your chapter heading and chapter title (that is, put some space between the chapter title and the small-cap intro-line).</li>
      <li>If the Chinese characters only appear on chapter openings (recto pages), I'd hang them outside the text block in that very generous margin.</li>
      <li>Letterspace your small-cap strings (the intro lines, but also everywhere you use small caps).</li>
      <li>The x-height is too drastically different from the first to the second fonts on page 1.</li>
      <li>(This is editorial, but) first lines of new sections should NOT be indented.</li>
      </ol>
