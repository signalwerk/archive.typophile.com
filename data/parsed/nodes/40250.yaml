    <p> I've been spending some of my spare time writing a <a class="freelinking external" href="http://en.wikipedia.org/wiki/Firefly_(TV_series)" rel="nofollow"><em>Firefly</em></a>-related book, and I'd like some critique on the page layout. Primarily, I want to be sure I've not done anything typographically s<em>t</em>oopid.<br>
    • Is 6″×9″ a convenient size for a book, or would folks recommend a different trim?<br>
    • To split sections: an <a class="freelinking external" href="http://en.wikipedia.org/wiki/Asterism_(typography)" rel="nofollow">asterism (⁂)</a>, something custom (<em>e.g.</em>, ~‡~), a blank line, or what?<br>
    • I'm using Gentium Book (at 10/12) for the main body text, but in one chapter I need to make a distinction between "present", "recent past" (where most of the action takes place), and flashbacks. I'm including two paragraphs in Fontin (9.5/12). The color seems to match; too well, perhaps—is the distinction easily visible? How else to differentiate the "voices"?<br>
    • The Chinese headings are there because of the large role the Chinese language and culture have in the <em>Firefly</em> universe (the "'verse"). Is my current placement effective there? Would people recommend a different font than the MS MingLiU I've used—a more calligraphic style, perhaps?<br>
     Thanks,<br>
    —Joel</p>
