    date_raw: 17 Sep 2004 — 11:06am
    votes: null
    html: <p>Thanks for the comments.  Yes, I want to get all of the kinks ironed out in the swashes - good point.  What I'm really concerned with is trying to figure out the "logic" of the letters and how they relate to each other.  I want to make sure all of the letters follow the same rules and look like they came from the same typeface - that is, of course, except for the capital "B" and "S". <br> <br>The client is a design agency and they want the logo to look like a cigar box logo - not for kids!</p>
