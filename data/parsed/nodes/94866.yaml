  html: |-
    <p>I'm working on an identity and brand development for a hair salon in St. Petersburg, Russia. We are at the point where we are starting to develop a color palette &amp; research appropriate typeface. (The logotype and monogram are hand-lettered.) Now, this is a high-end salon that (depending on the success of the first location) will spread across the country (and maybe internationally?) like wildfire! ;) </p>
    <p>I am looking for two typefaces: a serif and sans serif to complement each other. The catch...they both need to have at least 3-4 weights and be available in both Roman AND Cyrillic versions. The full glyph set, numerals, punctuation, mathematical symbols, etc.</p>
    <p>Any thoughts?</p>
