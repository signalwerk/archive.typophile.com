    <p>Hello All,</p>
    <p>As the new editor of my student newspaper - The Oxford Student - I am keen to scrap the old masthead, headline and bodytext fonts. I hope to intoduce much greater typographic elegance and impact to the paper, but the problem is that I have no real experience in typography.</p>
    <p>I have a couple of months before the first edition goes to press. If you could give a few suggestions or point me in the right direction I would be tremendously grateful.</p>
    <p>The most recent front page: <a href="http://www.oxfordstudent.com/pdf/165/frontpage.pdf" title="http://www.oxfordstudent.com/pdf/165/frontpage.pdf">http://www.oxfordstudent.com/pdf/165/frontpage.pdf</a><br>
    Archive of front pages from past issues here: <a href="http://www.oxfordstudent.com/archive/2005" title="http://www.oxfordstudent.com/archive/2005">http://www.oxfordstudent.com/archive/2005</a></p>
    <p>Audience: the students of Oxford University (about 17,000)</p>
    <p>The paper is 44 pages long. The page dimensions are approximately 12 X 15 inches - i.e. tabloid size.</p>
    <p>The content of the paper varies dramatically, from fairly purient news stories to more intellectual pieces. I dont know if it’s possible but my aim is for the paper’s masthead and fonts to convey gravitas, while also showing that we have a sense of humour, are just students, and dont take ourselves too seriously.</p>
    <p>Sophisticated but brash, if that’s not too contradictory. </p>
    <p>The masthead provides a huge challenge because “The Oxford Student” is such a clunky name. Creative typographic solutions are very welcome.</p>
    <p>Many thanks in advance,</p>
    <p>Best,</p>
    <p>Rob</p>
