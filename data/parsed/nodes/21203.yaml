    html: <p>nice links seventy7! Airwaves... why not show you are a good leader by finding someone else to redesign it for you. Go out into your community and find good designers/ typographers who can help give you ideas and such and you can give them credit for it in your paper (good PR/ Advertising to compensate for the help). You still get the credit for supervising the redesign, and it will turn out better than if you try it on your own.</p>
