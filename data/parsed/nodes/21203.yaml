      <p>One thing to do is learn what a masthead is. I think you are using the tag to describe the nameplate of the newspaper, which is something else entirely. The masthead is the place where the officers of the newspaper are listed, generally on the editorial page. It seldom appears at the top of the front page.</p>
      <p>(historical trivia: the first mastheads were on ships, brass plates nailed to the main mast, listing the owners of the ship.)</p>
