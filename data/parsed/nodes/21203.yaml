      <p>Well, first things first. You probably searched on Myfonts for Mercury, which brought up Mercury by T-26. Wrong Mercury. I’m referring to this Mercury: <a href="http://www.typography.com/catalog/mercurytext/index.html" title="http://www.typography.com/catalog/mercurytext/index.html">http://www.typography.com/catalog/mercurytext/index.html</a> . Much more appropriate. Actually, if you poke around the site, you’ll see that Mercury was made to be ultra-legible. If you search for Yves Peters’ review of it, you’ll see that he concurs with it’s readibility in long passages. Even more, the typeface you see on Typophile’s main page is Mercury. That’s a pretty good endorsement, I would think.</p>
      <p>What I was suggesting was that you choose a typeface for your body text (your “main typeface,” as I wrote it) before looking at making the nameplate.</p>
      <p>In that vein, I’d recommend the typefaces I did in my previous post: Mercury, Farnham, Miller, Veritas, Atlantica, John Baskerville, and Electra. Especially Farnham, Atlantica, and Electra, I think, fit with your desire to be “sophisticated, but brash.” I happen to like them both small and at display sizes. Swift could work, but I’ve always found typefaces that are especially calligraphic and angular (like Palatino and the similar text face, Aldus) to be a bit distracting as body copy. I much prefer more rounded, contrasty faces.</p>
      <p>I agree that Trajan doesn’t work for your new idea of an image. If you’re intent on designing the nameplate first, I can make a few suggestions. Maybe, to drive the point about the “new” paper home, you could use a non-geometric slab serif like Chaparral Pro (which should be bundled with InDesign and thus on your computer). Search on Myfonts for “slab serif” for some other possibilities.</p>
      <p>In this “out there” vein, a sans serif could be a good choice, too. Font Bureau has a ton of great, character-filled faces. I like their Amplitude, Titling Gothic, and Nobel. </p>
      <p>One interesting one that I re-discovered as I looked at their website is Prensa. If you want to say, “This is new,” it could definitely work.</p>
      <p>Veer.com collects a number of quirky, interesting typefaces for the discriminating typographer. You might want to give their fonts a look.</p>
      <p>I happen to love art-deco-style typefaces for when you want to make a statement, so I’m listing a number that I found to be interesting here, even though they might be too American for you: Toasted Vein, Avenida, EF Mahlau. </p>
      <p>Ultimately, though, I think you’ll find that the most modern, boldest feeling will come less from your typeface and more from your design. The craziest typeface will feel dull if you make a nameplate with it in all caps, as will something like Times in an avant garde design. The key is to find a typeface that has a little something that suggests your newspaper and couple it with a design that defies convention to some extent.</p>
      <p>These are my suggestions. I’m gleaning these from only about six months of really delving into type, unlike a number of people on this forum, so you may want to see if anyone else can give you a supremely tailored recommendation.</p>
