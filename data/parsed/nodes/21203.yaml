      <p>To me, the most typical thing about Oxford is that so many buildings are gothic. It is the “most gothic” town I have seen. It seems when the rest of the world followed fashions like renaissance, baroque or modernism they kept on building in the gothic style. Which is confusing today because you can hardly tell whether a building is 150, 300 or 800 years old.</p>
      <p>I wonder why so many newspapers keep their broken script mastheads but if there is any town that needs a gothic one it is Oxford!</p>
      <p>I assume a “proper” gothic font is too dusty for you so you might try something that relates to this style more loosely, like <a href="http://kltf.de/kltf_litteratra.htm">Litteratra</a>. I think it fits the OU’s mix of northern European gothic-ness and sophistication and latin-ness very well. It is a bit cocky and does not take itself too seriously. Apart from that, it is an excellent design.</p>
