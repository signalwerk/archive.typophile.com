      <p>Wow. If you’ve no typographic experience, i’d be hesitant to tell you to attempt a redesign. How old is the current design? Just wondering if you’re just itching to leave your mark.  </p>
      <p>If you insist:</p>
      <p><strong>Great starter books</strong><br>
      <a>Pure Design</a> (Mario Garcia has headed a gazillion redesigns including The Wall Street Journal)<br>
      <a>The Newspaper Designer’s Handbook</a> </p>
      <p><strong>Good Web sites</strong><br>
      <a>NewsDesigner.com</a> Search the archives for extensive blogs and postings about redesigns.<br>
      <a>VisualEditors.com</a><br>
      <a>NewsPageDesigner.com</a></p>
