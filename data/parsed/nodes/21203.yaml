      <p>auricfuzz thanks for your post. I’ve ordered a couple of those books and look forward to wading through them. It’s probably worth saying that I’m not completely ignorant of newspaper design and typography; I’ve been writing and laying out pages for The Oxford Student for over a year now, and have a good working knowledge of In Design and Photoshop.</p>
      <p>I completely agree with you that the aim of a redesign shouldn’t be just to “shake things up”, but should be a content-driven and precise movement towards a well-defined endpoint. </p>
      <p>As I see it, in the past the paper was designed without much thought. Now I’d like distil everything that we do well and combine this with some fresh ideas.</p>
      <p>My aim is for the paper to look bolder and clearer, and to forge a more cohesive identity. I feel that this thread is in danger of becoming too broad, so to narrow the focus again, let’s take things back to typography.</p>
      <p>I’m interested that you recommend Mercury as the main body text typeface as I’m not sure that sans serif works as newspaper body text. Personally I’m planning to go for as readable a serif font as possible, possibly Swift.</p>
      <p>Our current body text font is Palatino, Headlines and standfirsts are Adobe Caslon, photo captions are Helvetica Neue, and the nameplate is Trajan Pro.</p>
      <p>I do not think that Trajan Pro works for the image I’m trying to send out. Any suggestions for a more exciting nameplate typeface?</p>
      <p>current front page design: <a href="http://www.oxfordstudent.com/pdf/161/frontpage.pdf" title="http://www.oxfordstudent.com/pdf/161/frontpage.pdf">http://www.oxfordstudent.com/pdf/161/frontpage.pdf</a></p>
