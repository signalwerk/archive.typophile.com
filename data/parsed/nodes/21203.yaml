      <p>seventy7 you’re absolutely right in urging caution about a redesign given that I’m not a professional typographer, but the point is that my predecessors were equally inexperienced. That’s why I’ve come here - to get advice from people who do know what they’re talking about.</p>
      <p>The paper gets redesigned to different degrees every term with the changeover of the team. I am of course itching to leave my mark but I am very conscious that rushed redesigns usually fail, which is why I am here.</p>
      <p>Thanks for the recommendations. I’d browsed newsdesigner.com extensively but didn’t find it particularly helpful. I’ll check the books out.</p>
      <p>What would be really helpful though would be some more specific advice on potential fonts for the masthead and how to solve the problem of the extremely clunky “The Oxford Student” title.</p>
