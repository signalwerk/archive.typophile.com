      <p>Oxford has its very own type family, the Fell Types, which are indeed both sophisticated and brash; but DTL Fell is rather bland, and Hoefler’s and Marini’s versions (the latter free) are too irregular for news. I recommend you look at Storm Regent Pro, in roughly the same style, which would work nicely for text.</p>
      <p>I used to read the Cherwell myself.</p>
