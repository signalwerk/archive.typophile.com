      <p>I thought I’d chime in with my suggestions, since I’m in a similar position. I’m the Editor-in-Chief of a high school newspaper, The Riverdale Review (Bronx, NY), and I am redesigning the paper this summer. I’ll get to more specific suggestons at the end of my post, but I thought that my general experiences could help you. I apologize in advance for the long post; I guess I have a lot to say about redesigning.</p>
      <p>I’ve found that a useful thing to do is to think long and hard about what idea you want to promote with your redesign, especially if you want it to be considered more than just “shaking things up” for no reason. For me, I decided that I wanted the design to be purposeful, i.e. not to be whatever just happened to work, and to make the paper feel modern, yet keep the general flavor of it around.</p>
      <p>If you’re committed to doing it mostly on your own, I recommend a lot of reading. I recommend Bringhurst’s <em> Elements of Typographic Style </em> (an amazing text for teaching you what to look for in a typeface and how to sense a face’s character), the already mentioned <em> Newspaper Designer’s Handbook </em>, which really opens your mind to how to layout a good-looking paper, and <em> Contemporary Newspaper Design </em> edited by John Berry, which has a lot of really great designs and why they work. In the last book, the final chapter discusses nameplates (after reading <em> Handbook </em>, you’ll know that the newspaper’s name at the top is actually called a nameplate) in great depth. I’d also recommend a book on Photoshop (there are lots, but <em> Photoshop Masking &amp; Compositing </em> by Eismann is great for making silhouettes in newspapers) and one on either InDesign or Quark.</p>
      <p>After you’ve read these, I think that you’re ready to begin. I began by spending two weeks looking for the right typeface. Since my paper used Times and I wanted to preserve its general feeling, I confined my search to transitional typefaces. I searched on Myfonts.com mainly, using keywords like “transitional” and “Times-like” to find possibilities. I kept track of the ones I liked (using a tabbed browser like Firefox or Maxthon is really useful here, especially if it can save groups of links) and looked at them for a really long time. Ultimately, most felt too much like Times, or had too much contrast between the thick and thin strokes, or felt too lively for a somewhat conservative newspaper. I ultimately decided on Mercury by Hoefler &amp; Frere-Jones, as it is transitional, a face tailor-made for newspapers, and felt different, new, and well-made without seeming too crazy. A big factor in my decision was seeing it used in the old layout, so I’d recommend that once you are down to three or four typefaces, you e-mail the foundries that make them to ask if they can make a PDF substituting their typeface into your layout file. You might be lucky, as I have been, and get the typefaces you want sent to you for you to demo on your own for one or three months.</p>
      <p>You probably won’t have to spend as much time picking out a sans serif to complement it. Make sure that it doesn’t conflict strongly with your main font and you should be fine. You may want to consider choosing your sans serif and other fonts from your current font library, since you’ll probably have settled on a main typeface that you don’t own, requiring your newspaper to purchase it for a good amount of money.</p>
      <p>As to redesigning the layout, after reading Bringhurst and Harrower, you should be able to see when your old layout worked and when it didn’t. Change all the didn’ts to dids and change some of the things that worked that you think could work better.</p>
      <p>Finally, the most important thing to do is consult with other people. Ask the other members of the staff, your friends, your faculty advisor (if you have one), your family, people who read the paper now, and people who never read it what they think about every bit of the design. After all, you’re designing for everyone else first, then yourself. If most people hate something that you love, change it. A tough concept and one that I struggle with all the time, but a very essential one.</p>
      <p>Now, the specific comments. It’s hard to actually suggest anything about the nameplate before you’ve chosen a main typeface, since it should either be made from the same typeface or a completely different one. For your main typeface, I’d suggest something like Mercury, in that it feels traditional but different, throwing a wrench of uniqueness into the works as it were. The ones that I liked for my paper were Mercury, Farnham, Miller, Veritas, Atlantica, John Baskerville, and Electra.</p>
      <p>I ended up using Mercury for both my main typeface and the nameplate. I solved my similar typographic problem by using small caps for the name, capitalizing the two R’s but not the “T” in “the,” and creating a pseudo-bevel effect using a transparent copy of the text with a black outline. I like the idea of somehow minimizing the importance of the “the.” Take a look at the student newspapers at this link (<a href="http://www.studentpress.org/bohsp/2005/A-01.html" title="http://www.studentpress.org/bohsp/2005/A-01.html">http://www.studentpress.org/bohsp/2005/A-01.html</a>) for a lot of interesting nameplates, some of which deal with this problem. One that I like rotates the “The” counter-clockwise and makes it the caps height.</p>
      <p>The one thing I wouldn’t recommend is going blackletter; to do this, no typeface is really so great, so hand lettering is required. The one thing I would wholeheartedly recommend is just trying things yourself: try sketching the nameplate really roughly at small sizes. If you work on making these “thumbnails” for a good hour or two, you should have a number of ideas that you can try out with a font on your computer.</p>
      <p>Good luck with your redesign. It’s a really time consuming process, but at least for me, it seems like it will be well worth it from the responses I’ve gotten. Feel free to e-mail me (click on my name to the left) if you have any questions or are annoyed that I wrote so much. </p>
      <p>I’ve uploaded JPEGs of my four-page prototype to the links below. It’s not quite finalized, as I’m still waiting on some comments, but it’s close. If anyone wants to give me their opinion they’re welcome to, although please don’t hijack this thread.</p>
      <p><a href="http://i48.photobucket.com/albums/f202/auricfuzz/RR5CFrontMercuryInlineMay.jpg" title="http://i48.photobucket.com/albums/f202/auricfuzz/RR5CFrontMercuryInlineMay.jpg">http://i48.photobucket.com/albums/f202/auricfuzz/RR5CFrontMercuryInlineM...</a><br>
      <a href="http://i48.photobucket.com/albums/f202/auricfuzz/RR5CFrontMercuryInlineMay2.jpg" title="http://i48.photobucket.com/albums/f202/auricfuzz/RR5CFrontMercuryInlineMay2.jpg">http://i48.photobucket.com/albums/f202/auricfuzz/RR5CFrontMercuryInlineM...</a><br>
      <a href="http://i48.photobucket.com/albums/f202/auricfuzz/RR5CFrontMercuryInlineMay3.jpg" title="http://i48.photobucket.com/albums/f202/auricfuzz/RR5CFrontMercuryInlineMay3.jpg">http://i48.photobucket.com/albums/f202/auricfuzz/RR5CFrontMercuryInlineM...</a><br>
