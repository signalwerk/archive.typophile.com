      <p>Have you considered changing the name. The Oxford Student seem a bit formal to me. Perhaps shortening it to “The Oxford” might help generate interest. Listen to how people refer to the paper. Do they refer to it by it’s name or a nickname. This could succeed in “personallizing” the paper. Also, maybe you can go with a Sans Serif font for the nameplate or a more modern serif.<br>
      You’re off to a good star twith the clean design but I think it lacks a bit of direction. For example the pic of the model might be mistaken as part of the student vote story on the left. I would suggest you place a hairline rule of perhaps just increase the gutter width (perhaps two or three times the original width) to help seperate. I like the magazine flavor you’re trying to add to the paper, go with it.</p>
