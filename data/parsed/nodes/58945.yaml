      <p><a class="freelinking external" href="https://web.archive.org/web/20140909110238/http://www.youtube.com/watch?v=qefD5YHPeEM" rel="nofollow">Here</a> Vincent Connare says he drew Comic Sans from the letters in D.C. Comics' Watchmen. Which, like you said, was lettered by Dave Gibbons in the 80's. Obviously too late to appear on this flyer.</p>
      <p>Though it looks exactly like Comic Sans, is it outside the realm of possibilities that the word "land" was snipped from from something Dave Gibbons lettered in the 70's? If another post-1978 typeface could be identified from the flyer, it'd be easier to call shenanigans.</p>
