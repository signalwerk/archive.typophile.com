    html: |-
      <p><cite>to say it was actually “based on” or “drawn from” the lettering in Watchmen is just silly.</cite></p>
      <p>It may have been a rush job, but Connare (i.e. the creator of Comic Sans) says, "I pretty much referenced the Watchman. And I was trying to copy the letter forms. And these are all hand drawn, so all the letters are different. I just drew them out very quickly." To me, that says "Comic Sans is based on the lettering in Watchmen." It's a valid statement, regardless of whether or not he did a good job at making a digital version of Gibbons' handwriting.</p>
      <p>And maybe I'm just not a sufficiently discriminatory comic-book-lettering aficionado, but I looked at samples from Watchmen. I looked at Comic Sans. I believe the designer's story that he based Comic Sans on the lettering in Watchmen.</p>
      <p><em>Edit:</em> I think I may have misunderstood. It is absurd to say that the "LAND" in the flyer could be Dave Gibbons' lettering. It's a point-perfect specimen of Comic Sans. But I don't think it's absurd to say that Comic Sans is based on Dave Gibbons' lettering.</p>
