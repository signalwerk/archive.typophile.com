      <p>For the record, Tom Orzechowski is my all time favorite comic book lettering artist. </p>
      <p>I first saw his work back in 1977 - in the official Star Wars comic book - incredible use of nibs, caught my eye even back then. And I saw his work few years back, updating and drawing text/sound FX for English translations of manga comics (strangely enough, it was a Manga version of Star Wars where he made these incredible SCREAMS for the Tie Fighters). </p>
