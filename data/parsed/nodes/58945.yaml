    <p>This originally popped up on The Heads of State's <a class="freelinking external" href="https://web.archive.org/web/20140909110238/http://twitter.com/theheadsofstate" rel="nofollow">Twitter feed</a> yesterday.</p>
    <p>Christies is currently auctioning <a class="freelinking external" href="https://web.archive.org/web/20140909110238/http://www.christies.com/LotFinder/lot_details.aspx?pos=2&amp;intObjectID=5215215&amp;sid=" rel="nofollow">this "1978" Sex Pistols flyer</a>. But a closer look reveals what looks an awful lot like Comic Sans, released in 1994.</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20140909110238im_/http://typophile.com/files/screenshot_01_5604.jpg"></div><p></p>
    <p>So, is the flyer a fake? Or was Comic Sans drawn from an older face? And not to get all "Type I.D. Board" or anything, but do any other letters here seem out of place for 1978?</p>
  html_clean: |-
    <p>This originally popped up on The Heads of State's <a class="freelinking external" href="https://web.archive.org/web/20140909110238/http://twitter.com/theheadsofstate" rel="nofollow">Twitter feed</a> yesterday.</p>
    <p>Christies is currently auctioning <a class="freelinking external" href="https://web.archive.org/web/20140909110238/http://www.christies.com/LotFinder/lot_details.aspx?pos=2&amp;intObjectID=5215215&amp;sid=" rel="nofollow">this "1978" Sex Pistols flyer</a>. But a closer look reveals what looks an awful lot like Comic Sans, released in 1994.</p>
    <p></p><div class="imageWrap"><img src="/files/screenshot_01_5604.jpg"></div><p></p>
    <p>So, is the flyer a fake? Or was Comic Sans drawn from an older face? And not to get all "Type I.D. Board" or anything, but do any other letters here seem out of place for 1978?</p>
