    <p><strong>Typophile Type Battles to be Exhibited at TypeCon2006 in August<br>
    Deadline for Submission: July 5, 2006</strong></p>
    <p>At TypeCon 2006, the TypeGallery will showcase a selection of submissions from the weekly Type Battles that have raged in the Typophile forums this year.&nbsp;</p>
    <p>On behalf of SOTA and Typophile, we'd like to invite you to submit a high-resolution version of your entry (or entries) to be printed and displayed in the TypeGallery this August in Boston. In addition to appearing on Typophile and live in Boston, some pieces may travel internationally after the conference, and/or may be selected for print publication and display on the TypeGallery website.</p>
    <p>You may submit any selection of your entries from one or all of the battles you participated in. We are also interested in showing extensions of what was displayed in the Type Battles on Typophile. If you have continued working on your entries, please show us what you've done! Due to space constraints, this is a juried showcase, and we will use our discretion as to which pieces will be chosen for the exhibit.</p>
    <p>- Each piece will be printed on a tabloid (11in x 17in, 280mm x 432mm) sheet, black ink. Please scale appropriately. Pieces can be in landscape or portrait mode.</p>
    <p>- Please submit a <strong>hi-res, scaled version in either EPS, TIFF or PDF</strong> formats. Native Illustrator documents will also be accepted, though not preferred.</p>
    <p>- Submissions in JPG, GIF, PNG, .fog, or .vfb formats will <strong>not</strong> be accepted.</p>
    <p>- Label each file as such: <strong>Battle#_lastname_#.eps</strong> (example: Battle1_evens_1.eps) Please see the list of battles below, and name them accordingly.</p>
    <p>Battle 1 -- Blackletter / Slab<br>
    Battle 2 -- Franklin Gothic Swashes<br>
    Battle 3 -- Triline Pixel<br>
    Battle 4 -- Cooper Black ligatures<br>
    Battle 5 -- MICR letters<br>
    Battle 6 -- Found Type<br>
    Battle 7 -- Script Hobo<br>
    Battle 8 -- 3D by Hand<br>
    Battle 9 -- 'ch' 'th' 'sh' sounds<br>
    Battle 10 -- S S S S<br>
    Battle 11 -- More S S S S<br>
    Battle 12 -- Lowercase for text<br>
    Battle 13 -- Pointing hand dingbat<br>
    Battle 14 -- Alternate ampersands</p>
    <p>The <strong>deadline for submission is July 5, 2006.</strong> Please zip your files (not over 10mb please), include your full name and send submissions to: <a href="mailto:evens@punchcut.com">evens@punchcut.com</a>. If you have files larger than 10mb, please send us a link where we can download the images.</p>
    <p>If you wish to contribute sketches on paper or other non-digital material, please send photos or scans of the material so that we may review them for inclusion in the show.</p>
    <p><strong>We look forward to hearing from you and hope you'll consider being a part of the SOTA TypeGallery this year!</strong></p>
    <p>If you have any questions, please let us know.</p>
