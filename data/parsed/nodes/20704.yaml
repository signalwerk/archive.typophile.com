      <p>I honestly can't say I've done much path exporting myself, I tend to draw with vector tools while in photoshop. I use a little trick that might work for you. Assuming your Photoshop doc is a bitmap, you can save as a PDF and then open this in Illustrator. You won't be able to edit the image, but it can be scaled as large as you want.</p>
