      <p>For matching a sans with Tisa:<br>
      First, look at the horizontal scaling—it musn’t appear that one is condensed or extended relative to the other.<br>
      Next, focus on a typical setting, to get the x-height right.<br>
      Usually, Bold sans subhead with same size Regular serif body text.<br>
      (So the sans x-height might be quite large.)<br>
      Once you get those proportions matched, you can be sure the layout will be functional, so trust your judgement and taste the rest of the way.</p>
