    <p>Hello folks,</p>
    <p>I’m attempting to figure out what typeface this 1962 Steelmark logo is set in... Incidentally, this would be the same typeface that my beloved Steelers’ logo is set in as well. Sometime in the early 60’s, the Steelers petitioned the American Iron and Steel Institute to change the word ’Steel’ to ’Steelers’. So they added a lowercase ’r’ at that time. It’s a distinctive lowercase ’r’. I thought I’d check here to see if anyone had any guesses. Thanks!</p>
