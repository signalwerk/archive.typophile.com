    html: <p>Excellent. Thanks for the suggestions. I’m in touch with the American Iron and Steel Institute, and I’m assuming what they will tell me is that it is custom. On my Steelers t-shirt, I just noticed that the crossbar of the ’t’ is shorter on the left than it is on the right. I thought maybe it was to accomodate for the ’S’, a sign of it being hand drawn, but maybe this is normal feature of this type of lowercase ’t’...</p>
