      <p>I think it was a custom design. The most unusual feature is the ’e’, which is somewhat like that in <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=EF.8219.0.1&amp;attributes.sampleSize=48&amp;sampleText=Steelers&amp;sampleSize=48">Aachen.</a> With the Steelmark colors and these letters, it might not be obvious at first that this isn’t the exact original typeface. A little editing to remove the serifs would make the resemblance even closer.</p>
      <p>- Mike Yanega</p>
