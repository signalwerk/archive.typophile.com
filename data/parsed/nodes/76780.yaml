    <p>Hello,</p>
    <p>I'm a bit late in getting the news out, but my font Solveig is <a class="freelinking external" href="http://marketplace.veer.com/fonts/CTT0000496" rel="nofollow">now available from Veer</a>. It's a classically-inspired stressed sans, with a calligraphic feel. It was a really fun font to make, and I hope you all like it as well. </p><div class="imageWrap"><img src="http://typophile.com/files/allpurposetemp_4952.PNG"></div><p></p>
