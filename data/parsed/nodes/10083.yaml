  html: "<p>I found one of the fonts sought for this image after the thread expired: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/68616.jpg\" alt=\"\"> <br> <br>Bus Mall was set in the old typeface Phidian, which appears like so in the Solotype Catalog: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/68617.gif\" alt=\"\"> <br> <br>The only digital version I'm aware of is by Dan Solo and, according to <a href=\"http://jeff.cs.mcgill.ca/~luc/western.html\" target=\"_blank\"> Luc DeVroye</a> (see the <br>Solotype entry), Phidian is included on the <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0486999564/qid=1112484352/sr=8-1/ref=sr_8_xs_ap_i1_xgl14/104-6249154-7928729?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\"> 24 Victorian Display Fonts CD-ROM</a>. <br><br></p>"
  html_clean: "<p>I found one of the fonts sought for this image after the thread expired: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/68616.jpg\" alt=\"\"> <br> <br>Bus Mall was set in the old typeface Phidian, which appears like so in the Solotype Catalog: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/68617.gif\" alt=\"\"> <br> <br>The only digital version I'm aware of is by Dan Solo and, according to <a href=\"http://jeff.cs.mcgill.ca/~luc/western.html\" target=\"_blank\"> Luc DeVroye</a> (see the <br>Solotype entry), Phidian is included on the <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0486999564/qid=1112484352/sr=8-1/ref=sr_8_xs_ap_i1_xgl14/104-6249154-7928729?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\"> 24 Victorian Display Fonts CD-ROM</a>. <br><br></p>"
