    html: |-
      <p>Hello. Glyphs are identified by their glyphname in feature code. If your ligature is called f_l (bottom of your image), this is the name to be put after the “by”, so: “sub f l by f_l;”</p>
      <p>But I am surprised about aborting because of errors. Normally FL would just say: glyphs don’t exist, shall I create them ... Do you have other features already defined in the leftside column but without content yet?</p>
      <p>Karsten</p>
