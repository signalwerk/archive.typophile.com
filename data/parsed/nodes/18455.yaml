      <p>Update: I renamed the Unicode-supported ligatures, as well as some of the “spare parts” glyphs in the VFB. I cleared the Unicode, and then generated Unicode with PUA for the non-Unicode glyphs. I rewrote the liga feature to reflect these changes, and the feature compiled successfully.</p>
      <p>Case closed!</p>
