      <p>Good catch Ryuk.<br>
      The record is post 2011 so it's almost certainly digital Brothers, which according to Identifont was designed by John Downer for Emigre in 1999. I note from his Identifont biography that he published essays on type history and hand lettering have in Emigré magazine and House magazine. Unfortunately, I have none of these at hand.<br>
      Does anyone have any idea as to the source of the original design?<br>
      The Myfonts tags included _cigar_ so I looked for matching lettering. I found an online image of a Tampa Life cigar box label from 1927 which looks somewhat similar toe Brothers:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/TampaLifeCigar1927_4427.jpg"></div><br>
      source: <a href="http://www.magazine.usf.edu/2011-fall/slideshow/history-preserved/tampa-life-cigar.jpg" title="http://www.magazine.usf.edu/2011-fall/slideshow/history-preserved/tampa-life-cigar.jpg">http://www.magazine.usf.edu/2011-fall/slideshow/history-preserved/tampa-...</a><br>
      Larger image at: <a href="http://russellsshirts.blogspot.ca/2012/11/cigar-label-tampa-life.html" title="http://russellsshirts.blogspot.ca/2012/11/cigar-label-tampa-life.html">http://russellsshirts.blogspot.ca/2012/11/cigar-label-tampa-life.html</a><br>
      Anything else?<br>
      Perhaps there is a 19th century woodtype? I note Brothers has catchwords, which were available as special cuts from 19th century foundries.<br>
      I note Brothers is similar to Gin <a href="http://www.myfonts.com/fonts/hold-fast-foundry/gin/" title="http://www.myfonts.com/fonts/hold-fast-foundry/gin/">http://www.myfonts.com/fonts/hold-fast-foundry/gin/</a> a design at least partly inspired by gin and whiskey bottles.<br>
      Finally, I see that what comes around goes around. The logo for a new cigar box -- Caja del Campion <a href="http://www.cajadelcampeon.com/blogs/news" title="http://www.cajadelcampeon.com/blogs/news">http://www.cajadelcampeon.com/blogs/news</a> -- is a match for Brothers. The blog refers to the movie O Brother Where Are Thou, which which seems to use Brothers for the title -- with the alternate R, but not to the Brothers font.<br>
      Don<p></p>
