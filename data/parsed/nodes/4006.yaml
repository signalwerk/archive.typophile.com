    html_clean: <p> To me ITC Slimbach seems to have a certain free spirit that Slimbach's contemporary work lacks (according to more people than me). Don't get me wrong, in most ways his stuff is much better now. <br> <br>hhp </p>
  - id: 29942
    user: 110
    date: 2002-12-09T17:23:00
    date_raw: 9.Dec.2002 5.23pm
    votes: null
    html: <p>I must confess I'm not particularly a fan of Slimbach's, and I don't know what he's been up to these past few years. Last thing I know of is his exquisite interpretation of <a href="http://www.adobe.com/type/browser/P/P_1715.jhtml?id=type-010" target="_blank"> Jenson</a> from 1996. <br> <br>I just checked Adobe's site. So he did <a href="http://www.adobe.com/type/browser/P/P_1709.jhtml?id=type-010" target="_blank"> Warnock</a> and that <a href="http://www.myfonts.com/fonts/ef/today-sans/" target="_blank"> Today Sans</a> <a href="http://www.adobe.com/type/browser/P/P_1733.jhtml?id=type-010" target="_blank"> rip-off</a>, some scripts... What else have I been missing out? Most of his work is a bit too slick for my taste though. That's always been my main problem with Zapf too. <br> <br>Remember Picasso, who even in his early realistic paintings added a jarring element because "perfection is boring".</p>
    html_clean: <p>I must confess I'm not particularly a fan of Slimbach's, and I don't know what he's been up to these past few years. Last thing I know of is his exquisite interpretation of <a href="http://www.adobe.com/type/browser/P/P_1715.jhtml?id=type-010" target="_blank" class="link-external"> Jenson</a> from 1996. <br> <br>I just checked Adobe's site. So he did <a href="http://www.adobe.com/type/browser/P/P_1709.jhtml?id=type-010" target="_blank" class="link-external"> Warnock</a> and that <a href="http://www.myfonts.com/fonts/ef/today-sans/" target="_blank" class="link-external"> Today Sans</a> <a href="http://www.adobe.com/type/browser/P/P_1733.jhtml?id=type-010" target="_blank" class="link-external"> rip-off</a>, some scripts... What else have I been missing out? Most of his work is a bit too slick for my taste though. That's always been my main problem with Zapf too. <br> <br>Remember Picasso, who even in his early realistic paintings added a jarring element because "perfection is boring".</p>
