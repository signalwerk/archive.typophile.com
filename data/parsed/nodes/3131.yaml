    date: null
    date_raw: null
    votes: null
    html: <p>Just FYI, I found the typeface "Century S True Condensed" in my old Andresen (Typographics, in L.A.) catalog. It has fatter thins and square-ended serifs and is a good match to the logo. Unfortunately it is listed as an Andresen exclusive and the showing is printed in a coarse halftone to deter reproduction.</p>
