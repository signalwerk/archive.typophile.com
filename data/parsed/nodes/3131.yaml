    html: "<p>The sample you have on your post #26 looks like ITC Century Bold (possibly a knock-off). Century Schoolbook is a bit thicker in the thins. I also think the title has been condensed somewhat and some of the boldness is simply the result of video distortion (blooming) from being reversed.</p>"
