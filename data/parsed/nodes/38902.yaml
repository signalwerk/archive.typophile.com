    votes: null
    html: |-
      <p>As Ken mentions, laminating can kill a varnish. Obviously, the varnish needs to run after the lam. </p>
      <p>When I’ve mixed gloss and matte on a cover before, I’ve found that it often works better to do a gloss lam and then hit it with a matte varnish to kill the sheen except in the areas where you want the sparkle. Not just picking out a matte spot; even when matte is most of the cover.</p>
      <p>I’ve also had bad experiences with certain matte laminations that really shift color — bad red shift, more than can be adequately compensated on press beforehand. Sometimes, gloss lam plus flood matte varnish worked better for color fidelity. </p>
      <p>I’ve done a few matte lams with a spot gloss varnish. Doesn’t really give you full gloss, obviously. Depends upon whether you’re picking out type or images. </p>
      <p>And this may also be completely in my imagination: but it seems to me that matte lams are more susceptible to curl. But it can really depend upon the lamination — not all plastics are created equal. Which printer/manufacturer can make a difference.</p>
      <p>I always consult with my production manager (and I let her work out the budget ;-)</p>
      <p>— K.</p>
