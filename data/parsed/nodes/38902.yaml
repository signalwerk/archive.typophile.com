    <p>G’day folks,</p>
    <p>Fashion aside, what do you think is the best finish for getting the best brightness and contrast between colours? I’m working on a kid’s book with a mostly black cover with lines picked out in red and white; I want the black to be as black as death and the red to be as bright as oxgenated blood (currently I’m using PMS 032). I’ve only ever used matt laminates up to now and would appreciate a ’ruling’ from the court.</p>
    <p>For your general info: the file is in 3 colour with a 30% cyan screen laid down first then the pantone red bits and then process black to overprint the Cyan.</p>
    <p>I’ll try and post an image of a detail of the cover ... Wow, that never seems to work, OK so here’s a <a href="http://home.iprimus.com.au/nkgross/SBcover_test.png"> link </a> to it</p>
    <p>cheers</p>
