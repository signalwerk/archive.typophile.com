      <p><em>the file is in 3 colour with a 30% cyan screen laid down first then the pantone red bits and then process black to overprint the Cyan.</em></p>
      <p>Nicholas, that’s the way I would produce the artwork as well (though I like 20% cyan; never tried 30%). Without going to 2 hits of a Pantone, your technique yields nice blacks. </p>
      <p>Laminating offers the best protection to inks but will obscure any varnish effects, so even if you had the budget for extra varnish, the lamination would kill it.</p>
      <p>I’ve used both gloss and matte laminates. I prefer matte myself, but I think gloss would give you more satisfaction on this job.</p>
      <p>Good luck. Let us know how it turns out.</p>
