    <p>Hi Typophiles,</p>
    <p>We need to create an editable version of Neo Sans to use with our workplace ERP finance software (running on Windows). We've been advised to use Fontlab's Font Lab Studio - does anyone know if this will work and the legalities around it?</p>
    <p>Thanks!</p>
