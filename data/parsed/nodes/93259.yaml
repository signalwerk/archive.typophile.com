    html: |-
      <p>Usually, editing Commercial fonts by yourself is not allowed.</p>
      <p>On the other hand, your are free (as in freedom), allowed, and encouraged to edit Open Source fonts.<br>
      Also, many open source fonts include the "un-merged" source files, making edits much more easy.</p>
      <p>You can get almost all the source files for the Open Source fonts featured in Google Webfonts from here: <a href="http://code.google.com/p/googlefontdirectory/" title="http://code.google.com/p/googlefontdirectory/">http://code.google.com/p/googlefontdirectory/</a></p>
      <p>And a few more from the Open font Library:<br>
      <a href="http://openfontlibrary.org/" title="http://openfontlibrary.org/">http://openfontlibrary.org/</a></p>
