      <p>When you say "editable version", do you simply mean a one-off customized version? Because "editable" makes it sound more involved, like giving your employees the ability to freely modify the font as needed over time - which is a whole different kettle of fish, and something few font houses would agree to (which means you'd need to commission your own custom font instead of modifying Neo Sans).</p>
      <p>hhp</p>
