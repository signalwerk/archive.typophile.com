    html: |-
      <p><cite>Is there a way to save the file as a .fea now though? I opened it in Textedit on my Mac. I cant figure out a way to save the changes I did to the .fea file outside of Fontlab and I cant find the error string in Fontlab, so I'm a bit confused on what to do now.</cite></p>
      <p>Yes. Just save the TextEdit file with a .fea extension, then read it in via the FL &gt; OenType panel.</p>
      <p>I have a separate features file for every font, and it (eventually) includes kerning. Edit it as you need, and save it. On the same flyout panel, there is also something like "Import Features," or "Open Features." That will let you read in the external features file you've created with the text editor. Then compile.</p>
      <p>I do have a "basic" features file I start with, created with a text editor. But different fonts have different details, so I don't put it in the library, or use a link to an external file -- I read it in through that OT panel flyout.</p>
