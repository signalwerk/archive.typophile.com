    <p>[FATAL]  invalid token (text was "ƒ") [/Users/myname/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 36]</p>
    <p>... comes up. For the past couple of hours I have tried to fix it but to no avail. And of course, if I cant compile my opentype features, but font is pretty much useless. I might not be able to figure it out just be because I'm a beginner at opentype font coding and scripting but any help would be great! </p>
    <p>Thanks.</p>
