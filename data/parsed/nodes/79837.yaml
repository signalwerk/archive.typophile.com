    html: |-
      <p>In the OpenType panel, you can "Open features" and "Save features" .fea files using the little flyout menu in the corner of the OpenType panel of FontLab Studio. Also, if you place a .fea file such as <code>MyFont.fea</code> in <code>/Users/myname/Library/Application Support/FontLab/Studio 5/Features/</code> , then in the lower-part of the OpenType panel you can write just one line: </p>
      <p><code>include(MyFont.fea);</code></p>
      <p>(with the rest of the OpenType panel, and perhaps also the Classes panel empty). </p>
      <p>This will link the OpenType panel to the external .fea file. This way, you do not need to edit the feature definitions in the OpenType panel, but instead, you can use the external file. This may have the advantage that you can use one and the same .fea file for multiple fonts. </p>
      <p>Note that in this case, it's best not to include the "kern" feature in this external file. Instead, you should have the kerning defined in the Metrics Window, and have the Preference option "Generate OpenType &amp; TrueType / Kerning / Generate OpenType 'kern' feature if it is undefined or outdated" enabled. </p>
      <p>Best,<br>
      Adam</p>
