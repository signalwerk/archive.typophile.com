    html: |-
      <p><strong>Summary</strong></p>
      <p>1. The Kensington Pub was very crowded and we were unable to get a table immediately. So there was some standing around and discussion of how crowded the K-Pub was. Linda brought treasures from the Wayzgoose in Vancouver, which were greatly admired from a standing perspective. And then a group of non-type-speaking people left, freeing their table for us. Yeah.</p>
      <p>2. Listen up: we're gonna change venues for the December meeting. We don't want to fight the Christmas-shopping crowd getting liqueured up at the K-Pub next month, so we're going to meet at Julio's Barrio, a scant half-block away from K-Pub. Linda has booked the entire second floor for the Calgary Typos. So we can have a Christmas-type type meeting. Bring friends. Bring baggage. Spread out. (If Veer/Corbis wants to have a Christmas party, we'll donate a corner for you. You can even set up a barrier so our type discussion won't interfere with your type discussion.)</p>
      <p>3. Lex reported that his laptop's battery ran out and then died in the middle of Geophysics class. We were all sad. For a moment.</p>
      <p>4. Derek brought along a copy of <em>Uncommon Vision</em> by Peter Ciccariello. (Not sure if it was for Show &amp; Tell or "Bring your favourite type book", they sort of got intermingled.) In Derek's words, the artist "folded type into each abstract landscape". I haven't googled it yet, but it's a lovely book and well worth a search.</p>
      <p>5. From Linda, thanks to Jim Rimmer for his hospitality. And she isn't even sorry for stretching the half-hour appointment into an hour-and-a-half.</p>
