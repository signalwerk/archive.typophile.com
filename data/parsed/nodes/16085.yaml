    date: 2005-11-08T05:50:00
    votes: null
    html: <p>I'm surprised you don't want an altogether different supporting font family to give ultimate strandout to the <em>Christíne Fuchs</em> 'label' which is exquisite (especially the 'f') and should not be competed against, but rather complemented to the full. There's a real danger of trying to give the same look all over which may not help with the recognition of a logotype.</p>
