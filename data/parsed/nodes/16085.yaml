    html: |-
      <p>And here is an example of what I`m looking for: <a href="http://www.kahlkopf.com/files/example.gif" title="http://www.kahlkopf.com/files/example.gif">http://www.kahlkopf.com/files/example.gif</a>  Temporary www: <a href="http://www.christinefuchs.com" title="http://www.christinefuchs.com">http://www.christinefuchs.com</a> </p>
      <p>The point is LL Akkurat by Linetto for example is fine draw, clean typeface. You can see that AG Wide unclean face even at bigger sizes. And for fashion purposes it needs to be ultralight to affect as "normal" at big sizes on banner, poster or website. Light cut isn`t enough. I`m surprised that nobody tryed "contemporary clean up" of this typeface till this day.</p>
