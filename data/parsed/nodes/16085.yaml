    <p>Hello,</p>
    <p>i´m looking for an alternative of old Akzidenz Grotesk. I`ve desigend an fashion identity with it and i miss thin and ultralight cuts now. After that the capitals are bigger than rest letters, that isn`t beautiful. Of course, i can use Helvetica, but "s,c,e" of extended Akzidenz Grotesk give main charakter to my creation and Helvetica Extended isn`t so wide than extended AG. Question: does it exist "New Akzizend Grotesk" or somethink similar, even with my specifications? (thin, ultralight, wide extended, clean). Thanks a lot.</p>
