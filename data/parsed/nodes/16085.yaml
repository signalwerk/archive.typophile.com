    html: <p>hmm many typefaces were inspired by Akzidenz Grotesk most notably Morris Fuller Benton's 1903 Alternate Gothic is a condensed design directly inspired by Akzidenz. Lightline Gothic, News Gothic and Franklin Gothic were also ATF's grotesk typefaces inspired by Akz. (ITC Franklin Gothic is the bastard child of this ATF family).</p>
