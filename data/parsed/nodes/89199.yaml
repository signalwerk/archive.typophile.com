    html: |-
      <p>Hmmmm …</p>
      <p>Not bad. Really, not bad. But:</p>
      <p>First of all, what are you trying to say about you? Do Electra and Trade Gothic say it? Does your layout say it?</p>
      <p>I would want to see, right under your name, a description of what you do: John Smith, graphic designer.</p>
      <p>Too much internal white space. Try moving the date column closer to the text column, maybe flush right.</p>
      <p>Trade Gothic with crazy Caslon ital style ampersand works for Barnes and Noble; not working here</p>
      <p>Where's your focal point? Not sure what path my eye is supposed to follow.</p>
      <p>Why the wavy underlines? Don't match anything else.</p>
      <p>Nitpicking: "@" in e-mail is too high (the a part sits on the baseline); ditch parens and add hyphen in phone number — area code isn't optional anymore; what's wrong with the letterspacing in paragraph under "design intern"?; York comma PA no comma 18104; what's "Word/ Office"?</p>
      <p>Make the important things stand out. The headings are not important; your experience is.</p>
      <p>Bullet points aren't sentences. Don't design them like they are.</p>
      <p>Overall, it's just a bit bland. But keep working on it!</p>
