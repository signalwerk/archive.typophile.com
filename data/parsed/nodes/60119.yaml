    <p>I have compiled this list which I intend to include as an *informative* footnote or add as an appendix (after deleting a full section dedicated to small "Small type in use" from my thesis about Compact Typography).</p>
    <p>I am wondering if I have omitted any obvious examples or made any errors?  Any filling in of gaps and dates might be fun? LOL</p>
    <p>Early on (c.1500 - 1800), it is ambiguous as to what was used for newspaper printing. Terms like 'Oldface' and 'Modern' are more frequent. At the moment my only specific early reference comes from Matthew Cater confirming that Fleischman’s Bourgeois Roman of 1750 (assumed by me after looking at the Enschidé specimens) was a type used for newspapers. 'particularly a 8pt newspaper type of 1745, one of the first for that purpose.' (p.28 Middendorp, J. Dutch Type, 2004)</p>
    <p>My original idea was to represent something significant every 50 years or so and discover what the early example actually were that Carter alludes to (but doesn't reveal!)...</p>
    <p>I know I have not done it here but please include sources of info where possible, thanks.</p>
    <p>For context:<br>
    Significant typefaces used in newspaper and periodical publishing include;</p>
    <p>===========</p>
    <p>Plantin Moretus’ Granjon of c.1500s (compact design/sizes?/ robust)</p>
    <p>Robert Granjon’s Fell Type of c.1500??? (Oxford University, 1686)</p>
    <p>Caslon’s Caslon’s of DATE,</p>
    <p>Fleischman’s Bourgeois Roman of 1750,</p>
    <p>xxxx Didot’s Didot? of 1775,</p>
    <p>Bruce Foundry’s Old Style No.20, of Date c.1820?,</p>
    <p>Garalde Ronaldson’s ??? (Miller &amp; Richard’s Foundry) Old Style of 1884,</p>
    <p>Wilson’s (Glasgow). Double Pica Roman?-(anything Smaller? Minion? or ‘Scotch Roman’ of 1760,</p>
    <p>British Letter Foundry’s (Austin and Bell) Modern of c.1787,</p>
    <p>Bertram Grosvenor Goodhue’s Cheltenham of 1896,</p>
    <p>Linn Boyd Benton and De Vinne’s Century Expanded of 19xx,</p>
    <p>Monotype’s Plantin of 1913,</p>
    <p>Chancery H Griffiths’ Ionic of 1922,</p>
    <p>Lardent and Morison’s Times Roman of 1932,</p>
    <p>Robin Nicholas’ Nimrod of 1980,</p>
    <p>Shelley Winter’s Telegraph Newface Roman of 1990, (Bold designed with Walter Tracy, 1989,)</p>
    <p>Matthew Carter, Tobias Frere-Jones and Cyrus Highsmith’s (Font Bureau) Miller Text of 1997,</p>
    <p>Gerard Unger’s Gulliver of 1993,</p>
    <p>Jean François Porchez’s Le Monde of 1994,</p>
    <p>Christian Schwartz and Paul Barnes’s Guardian Egyptian of 2005.</p>
    <p>/michael hernan</p>
