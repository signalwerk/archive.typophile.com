      <p>It sure is DrDoc. Thanks.</p>
      <p>@ Mike: Because some characters look like they have little horns and the overall look is quite sharp I wanted some devilish name for it. My first working title was Diavolo but a font by that name already existed ... hence the name Diavlo.</p>
