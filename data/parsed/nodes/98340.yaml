  html: |-
    <p><img src="/sites/default/files/old-images/small-caps_6104.png"></p>
    <p>Referring to the image, which do you feel is the best treatment (most balanced) for small caps?</p>
    <p>Top —&nbsp;Caps and small caps using their default settings for weight and size.<br>
    Middle —&nbsp;Caps have their weight  dropped from bold to medium. Small caps are unchanged.<br>
    Bottom - Caps have their weight dropped from bold to medium, and size dropped from 16 to 15. Small caps are unchanged.</p>
