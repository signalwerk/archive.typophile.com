      <p>I wouldn't use all caps for the whole document, it could become overwhelming to read. I also don't know how much type is on these certificates, if not so much, then you could use all caps, you just might need to have contrast in sizes.</p>
      <p>I like DIN a lot, its clean, precise, ledgible, not too mechanical, not too humanist, good for corporate identity or as a text font.</p>
      <p>Jeo.</p>
