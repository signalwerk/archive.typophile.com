    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1 copy_6661.jpg"></div><br>
    hey ppl.<br>
    i'm designing some graduate certificates, merits and excellence certificates for an arts college here in israel.<br>
    they asked me to design matching certificates in english,<br>
    so i'm looking for a good, clean, very light sans serif latin font match for the letters attached i have designed.<br>
    something which is respectable and sharp, not too machine-like. something which reminds the general style of helvetica, but is not helvetica.<p></p>
    <p>thanks!<br>
    Yaronimus.</p>
