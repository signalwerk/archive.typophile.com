    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hopyl-textura_5416.jpg"></div><p></p>
    <p><strong>Partial ID</strong><br>
    It is certainly in the categories of: blackletter, gothic, textura. Used by both Robert Barker (London, early 1600s) and Wolfgang Hopyl (Paris, early 1500s). Hopyl moved to France to do printing, but also did printing for England. So northwestern Europe is the geographic region where I have found samples of this type. 16th century or so.</p>
    <p><strong>Example 1</strong><br>
    It was common in early printing, but I'm having difficulty finding a modern, digital revival of this beautiful type. Perhaps the best example is of the first printing of the <a class="freelinking external" href="http://digitalcollections.lib.umanitoba.ca/islandora/object/uofm%3A7107/pages?page=9" rel="nofollow">King James Bible 1611</a>. It was printed in London by Robert Barker, the son of Christopher Barker. The father (Christopher) started printing around 1569, so I'm assuming that the type pieces used were probably mid-1500s era equipment.</p>
    <p><strong>Example 2</strong><br>
    The second example is type from the printer Wolfgang Hopyl. <a class="freelinking external" href="http://www.kb.nl/bladerboek/hopyl/browse/page_122v.html" rel="nofollow">This example</a> is taken from 1500. There is a very common typeface called "Manuskript Gotisch" (or "Manuskript Gothisch") that was inspired by type used by Hopyl in 1514, but <strong>this type is not Manuskript Gothisch</strong> and have included it in my sample (see attachment) for comparison purposes.</p>
