  html: |-
    <p>I'm looking for a good condensed semi slab-serif for a project, and although I've found a few that are close (Boton, Glypha, Serifa), nothing is quite there yet.</p>
    <p>I've sketched out something closer to what I think will fit the project, and was wondering if anyone knew of a typeface that would match it better?</p>
    <p>I guess I'm after some subtle curves into the slabs, a flat (or flatter) bottom to the a, subtler serifs in general, and the serifs on the s to be more filled out.</p>
    <p>Cheers</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/slabsample_5394.jpg"></div><p></p>
