    html: |-
      <p>&gt; subtle curves into the slabs</p>
      <p>These are called "brackets". All the typefaces you list are unbracketed slabs. The flat bottomed 'a' is pretty unusual so I don't think you'll find a match for that. Best to start with something close and modify it. The closest thing I can summon is <a href="http://www.fontshop.com/fonts/singles/monotype/amasis_std_bold/?sample_text=Langes&amp;sample_size=96" rel="nofollow">Amasis</a>.</p>
