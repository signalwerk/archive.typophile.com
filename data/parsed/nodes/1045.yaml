    date_raw: 12 September 2003 - 9:04pm
    votes: 0
    html: <p>The R and B are from our <span class="caps">TF</span> Burko, either <span class="caps">TF</span> Burko Bold or <span class="caps">TF</span> Burko Super Duper. Probably the Bold. <br><br>The stencilled cutout on the B was raised from the bottom of the B as it is in <span class="caps">TF</span> Burko, to the center stroke.  <br><br>The balance of the letters appear to be directly from Futura.  <br><br>-&nbsp;Joe</p>
