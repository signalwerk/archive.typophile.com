    html: <p>Then what is it? :-) <br> <br>If you are looking for the typeface that says "Red Bull" in red, yes, it is Futura. <br>R and B were slightly customized, apparently. <br> <br><img src="http://www.typophile.com/forums/messages/30/14796.jpg" alt="bullbull"></p>
