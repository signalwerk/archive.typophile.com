    date: 2003-09-12T19:04:00
    date_raw: 12 Sep 2003 — 7:04pm
    votes: null
    html: <p>The R and B are from our TF Burko, either TF Burko Bold or TF Burko Super Duper. Probably the Bold. <br> <br>The stencilled cutout on the B was raised from the bottom of the B as it is in TF Burko, to the center stroke.  <br> <br>The balance of the letters appear to be directly from Futura.  <br> <br>- Joe</p>
