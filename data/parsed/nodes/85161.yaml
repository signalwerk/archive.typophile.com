    <p>Hello everyone,<br>
    hope I am getting this right as it's my first post on the site (read the guidelines already :)).<br>
    Anyhow, I found this National Geographic Map from 1983 and I quite liked the fonts used in it, however I haven't been able to identify any of the fonts and already went through my 3000+ font collection one by one, if someone knows what are these fonts, I would be sincerely thankful.</p>
    <p>Font used for ocean titles:</p>
    <p> <img src="/sites/default/files/old-images/Untitled-1_5327.jpg"><br><img src="/sites/default/files/old-images/Untitled-2_4443.jpg"></p>
    <p>Font used in the country names:</p>
    <p><img src="/sites/default/files/old-images/Untitled-3_5951.jpg"><br><img src="/sites/default/files/old-images/Untitled-4_6422.jpg"></p>
    <p>Font used for the cities names:</p>
    <p><img src="/sites/default/files/old-images/Untitled-6_4518.jpg"><br><img src="/sites/default/files/old-images/Untitled-7_4700.jpg"><br><img src="/sites/default/files/old-images/Untitled-8_5806.jpg"></p>
    <p>Thanks!</p>
