    <p>Hello everyone,<br>
    hope I am getting this right as it's my first post on the site (read the guidelines already :)).<br>
    Anyhow, I found this National Geographic Map from 1983 and I quite liked the fonts used in it, however I haven't been able to identify any of the fonts and already went through my 3000+ font collection one by one, if someone knows what are these fonts, I would be sincerely thankful.</p>
    <p>Font used for ocean titles:</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_5327.jpg"></div><br>
     <div class="imageWrap"><img src="http://typophile.com/files/Untitled-2_4443.jpg"></div><p></p>
    <p>Font used in the country names:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-3_5951.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Untitled-4_6422.jpg"></div><p></p>
    <p>Font used for the cities names:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-6_4518.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Untitled-7_4700.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Untitled-8_5806.jpg"></div><p></p>
    <p>Thanks!</p>
