    <p>Using some specs I’ve found on this site I’ve setup an Illustrator file to create my characters and then cut/paste them into FontLab.  Works, however...</p>
    <p>For instance, on the letter ’l’ (like a script l), the widths of my bowl (terminology?) at the left and right are not equal.  They are in Illustrator (checked and double checked).  It’s a modern script so we’re not talking any form of curves here.</p>
    <p>I don’t know if this is some quirk with cut/paste, FontLab or what?</p>
    <p>Any thoughts?</p>
    <p>Thanks...</p>
