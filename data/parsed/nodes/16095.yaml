      <p>Have you read this?<br>
      <a href="http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2675">Using Illustrator to draw typefaces</a></p>
      <p>Maybe it has something to do with this:<br>
      <em>If you observe some distortions in the shape of the imported object, make sure that it is not related to the integer coordinates. Generally, digital fonts (PostScript, TrueType or OpenType) can only include integer coordinates. On the other hand, your Illustrator artwork can have nodes with non-integer coordinates such as 161.352 pt or 354.78 mm. When FontLab imports a drawing, it has to round them to integer values — because it cannot generate fonts with non-integer coordinates.</em> <a href="/wiki/Adam%252BTwardoch" class="wiki">Adam Twardoch</a></p>
