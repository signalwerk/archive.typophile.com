    html: |-
      <p>Bert's right. Sometimes they make some of their fonts available in card-making kits, but I don't think they use their new fonts for those kits. My <a href="http://bowfinprintworks.com/ScriptIDGuide.html" rel="nofollow">Script Font ID Guide</a> shows samples of most of the available Hallmark fonts. Most are included in Parts 7, 8 and 9 of the Guide, in the later pages of those sections (most samples are courtesy of typophiles Mike F. and Paul Hunt).</p>
      <p>- Mike Yanega</p>
