  html: |-
    <p>Steven Skaggs studied calligraphy and typography under <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>. His calligraphic artworks are in the collections of the <a href="/wiki/Klingspor%20Museum" class="freelinking" rel="nofollow">Klingspor Museum</a>, <a href="/wiki/Offenbach" class="freelinking" rel="nofollow">Offenbach</a> Germany, the <a href="/wiki/Sackner%20Archive" class="freelinking" rel="nofollow">Sackner Archive</a> of Visual and Concrete Poetry in Miami, and the <a href="/wiki/Akademie%20der%20K%C3%BCnst" class="freelinking" rel="nofollow">Akademie der Künst</a>, Berlin. He has been active giving workshops and teaching throughout the United States as well as Canada, Italy, Switzerland and Germany. Steven Skaggs lives in <a href="/wiki/Louisville" class="freelinking" rel="nofollow">Louisville</a>, <a href="/wiki/Kentucky" class="freelinking" rel="nofollow">Kentucky</a> where he is Professor of Design at the <a href="/wiki/Hite%20Art%20Institute" class="freelinking" rel="nofollow">Hite Art Institute</a>, University of Louisville.</p>
    <p>Skaggs designed <a href="/wiki/Rieven%20Uncial" class="freelinking" rel="nofollow">Rieven Uncial</a> in 2009, which was awarded a Certificate of Excellence in Typographic Design in the <a href="/wiki/TDC2" class="freelinking" rel="nofollow">TDC2</a> 2010.</p>
