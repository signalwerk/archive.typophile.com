    html: |-
      <p>You can reduce characters per line by: a. using a font that sets wider, ie has a longer lower case alphabet at a given size; b. increasing the size of type. c. shortening the line. That's about it. </p>
      <p>Many reports and wide formats, eg instruction books, have a wide left column in which they put headings and information. Or, as I said you can go multi-column. Another way that looks good is to have two book style pages on a landscape oriented page. But as Nick said, if your audience is your teacher only, then you'd better do something that looks good to him or her--and that likely means 'normal'.   </p>
      <p>You can't really have control of layout in MS Word, just forget it. You can do better even with that, by controlling the face, length of line, spacing and margins in a single column, as well as nice headings, etc. But when it comes to putting stuff in the margins, multicolumn etc., Word is just torture. Even MS Publisher is better, though a proper layout program is the only way to go in the long run.</p>
    html_clean: |-
