      <p>Consider my Top 15:</p>
      <p>1.)  Sabon Next (Linotype)<br>
      2.)  Garamond Premier Pro (Adobe)<br>
      3.)  Dolly (Underware)<br>
      4.)  Musee (DStype)<br>
      5.)  Tribute (Emigre)<br>
      6.)  TheAntiqua Sun, TheAntiqua B, TheAntiqua E (Lucasfonts)<br>
      7.)  Tarocco (Mac Rhino)<br>
      8.)  John Baskerville, or Baskerville Ten (StormType)<br>
      9.)  Luminance (Mac Rhino)<br>
      10.) Bembo Book (Monotype)<br>
      11.) Scala (Martin Majoor)<br>
      12.) Freight Family (Josh Darden, Garage Fonts)<br>
      13.) Paperback (House Industries)<br>
      14.) Grad (Mark Simonson)<br>
      15.) Dante (Monotype) </p>
      <p>Honourable mention: Palatino, or the supposedly original one, called Paltino Nova (Linotype)</p>
