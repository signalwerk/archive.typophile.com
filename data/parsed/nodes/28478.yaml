      <p>Yes, of course, academics love their austere, sharp Garamonds, or heaven forfend, Times New Roman. There's actually a much more varied and nicer version of TNR, but I doubt your academic friends would be aware of it. </p>
      <p>Dolly exudes a warmth and charm that is very inviting. Its sturdy construction also gives a nod to the rich, dark type of yesteryear. As far as I'm concerned, Dolly is worth every penny. I'm just waiting for a fully opentype version with perhaps a few more ligatures.</p>
      <p>Three others that deserve to be on my list but were left out:</p>
      <p>Dorian (DTL) ---- The lowercase y and small caps are just brilliant.<br>
      Renard (Enschede) ----- Wow.<br>
      Elzevir (DTL) ---- Lots of variety here. Beautiful, dark type.</p>
