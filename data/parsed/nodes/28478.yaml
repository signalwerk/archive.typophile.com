    html: |-
      <p>&gt;14 word line</p>
      <p>With 5 letter words and spaces that is 84 characters. This way too long according to traditional typesetting wisdom, as explained by Bringhurst. The traditional agreed ideal for single column pages is about two a half lc alphabets, or 66 characters. "More than 75 or 80 characters is likely to be too long for continuous reading." </p>
      <p>Setting type on letter sized paper, if that is what you are doing, is a typographic challenge, and to meet it you need to use wide type, such as Century Schoolbook, and wide margins (or wide left margin) with titles or notes in the margin, or use a multi-column setting. </p>
      <p>The typeface is probably a lesser issue than the layout for a good result. </p>
      <p>As far as mood, I do indeed think this is appropriate to consider even in a text face. For example, Garamond gives a more traditional and Whitman a more modern impression. I think this character can enhance your message.</p>
    html_clean: |-
