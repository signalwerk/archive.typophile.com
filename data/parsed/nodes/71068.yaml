      <p>Arno, the second question wasn't anything to do with ‘use of unlicensed fonts’, it was about checking whether a font has been modified. Plenty of licenses permit modifying fonts so long as the derivative versions are not distributed.</p>
      <p>There's no easy way to check whether a font has been modified without having the original against which to do a diff.<br>
      ____</p>
      <p>Re. the kerning question: there are two kinds of kerning that a font may have: kern table pair kerning, and GPOS table kerning (which may involve classes or, indeed, even funky things like contextual kerning, or kerning implemented as single glyph adjustments instead of pairs). When you examine a font using the MS Font Properties Extension, the 'Features' tab will indicate how many ‘standard kern pairs’ a font contains; this is the number of kern pairs in the kern table. If a font is not reported as having any standard kern pairs, this does not mean that it has no kerning: it may have GPOS kerning (check the OpenType Layout feature tree in the same tab).</p>
      <p>Font editing or examining tools do different things when looking at fonts with GPOS kerning. Some will parse the GPOS kern feature and report the information back in terms of pairs, but there are various ways in which this can be misleading. For instance, a tool may or may not expand class kerning, and since GPOS kerning, like all OTL features, may be script and language specific what data is actually being looked at?</p>
      <p>As noted in the Calibri kerning thread, tools also do different things when looking at kern table kerning. The MS font properties extension and DTL OTMaster will give you accurate pair counts (as will Ascender's FontChef tool). Other tools, including TTX, may not, depending on the size of the table.</p>
      <p>Note, however, that the number of pairs in the kern table and even a list of those pairs won't necessarily reflect the actual kerning that you're going to get in different applications. Some applications can't handle very large numbers of kern pairs, and some have weird bugs based on things like 8-bit codepage contents (e.g. MS Word kerning only monotonic Greek diacritics, not polytonic).</p>
    html_clean: |-
