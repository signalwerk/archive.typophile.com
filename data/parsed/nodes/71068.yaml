    <p>Hi,</p>
    <p>I'm a long time reader of this great forum but it's my first post. I'm an IT guy with a recent growing interest in good typography so please excuse my newbie questions.</p>
    <p>So,</p>
    <p>- Is there a reliable tool (on Windows) to check the number of kerning pairs in fonts? I installed 'Font properties extension 2.30' from Microsoft but for lots of .otf fonts it says 'no kerning pairs' available and when I look in the fonts with Typograf 4.8f I see xxx numbers of kerning pair! For some fonts, the MS tool and Typograf have different kerning pairs numbers... Who's right on this?</p>
    <p>-  Is there a way to check for fonts 'originality'? The other day, I had a question from a new employee replacing one of our designer. She had a problem working in InDesign with a particular font (don't remember which one) saying that the default kerning was not what she expected (she said she knows that font really well...). I have checked the .otf file and it seems original to me but she said that maybe the previous designer made modifications on it or converted it from a PS font. How can I verify this?</p>
    <p>Thanks,<br>
    F</p>
