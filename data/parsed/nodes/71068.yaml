      <p>1. If the font contains class kerning, you probably need an application like FontLab, if you want to see, how many kerning pairs the font includes. But the number of kerning pairs does not say anything about the quality of the spacing, because the pairs may be wrong or they correct wrong plain metrics or they are simply (almost) never used (kerning between small capitals and regular small letters for example).</p>
      <p>2. For me the use of unlicensed fonts is okay, if you don’t earn money with them in any way, neither with selling them nor with using them in a project, for which you get money. If you license a font, you will get the original and there is no need to check a font for authenticity. It is a bit boldfaced to ask your question on Typophile. I mean, what you want to have, is support for piracy from the developers of fonts.</p>
