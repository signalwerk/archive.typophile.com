      <p>Charles — If your designer swears that the fitting is different than she’s used to and you’re able to confirm that the font files are “original” and unmodified, then check to see whether InDesign’s Optical Metrics feature has been applied.</p>
      <p>This feature very subtly, but very definitely, mucks up the spacing of a font — ignoring and overriding the font’s metrics and kerning.</p>
      <p>I just had a conversation with a colleague about a circumstance where the first proofs of a magazine redesign using a custom typeface design, which had been meticulously spaced and kerned, came back looking unbelievably atrocious, and my friend thought he was going crazy and began to question everything he thought he knew about spacing and H&amp;Js. </p>
      <p>It turns out someone had ignorantly applied Optical Metrics. Upon turning this off and reproofing, everyone agreed that the composition and design suddenly looked infinitely better and miraculously fixed.</p>
      <p>I’ve ranted at length about this “feature” before on this forum, so I won’t repeat myself here. But just have your designer check for this.</p>
