      <p>Fontology,</p>
      <p>A first thing to check to see if a font has been modified or not, is to check its version number against an original. On Mac OSX, this is as simple as Get Info -- for Windows, you need Microsoft's own Font Properties extension.</p>
      <p>If the version number is different, that is almost certainly the reason. If the version number is the same but the modification date/time and file size is different, the font <em>might</em> have been edited -- most foundries are careful to maintain accurate version numbering, precisely for this reason.</p>
    html_clean: |-
