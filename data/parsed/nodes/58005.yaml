    <p>I will let Geometro rest for around a week, so now I made something new.<br>
    I always wanted to make a nice sans-serif font of text purposes, so I started my first project on that.<br>
    The name is Sweet Sans for now (or is it right?/do you know a better name?). After making some glyphs, I realised I started a little bit thin, so this will be the Light/Thin version. I did not take a lot of time for spacing- and kerning details, etc.</p>
    <p>Here's a preview:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/PreviewCrop_5535.PNG"></div><p></p>
    <p>See the attachment for a PDF file of the glyphs I've made today.<br>
    I thought, let's place it here now, before I screw up the rest. :P<br>
    This is my second big typeface project, first time completely in FontLab. :D</p>
    <p>I hope this will be a nice font. :)</p>
    <p>Kind regards,<br>
    Martijn van Berkel</p>
