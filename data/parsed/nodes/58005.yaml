      <p>This is strong work. Considering your age, you are obviously cut out for type design. I like the contrast is weight, and the overall feel. I am not a type designer like most of the other readers of this site, but I could make a few suggestions:<br>
      1) The rounded shapes of the bowls need optical compensation along the baseline etc. This will become more important as you design heavier weights. See below.</p>
      <p>2) Some of the letters, like the e, m, and n, are a little left leaning, which is nice. But some of the other letters, like the f and c, feel very upright. There's a little tension there. But that's kind of nit-picky.</p>
      <p>You are off to a great start...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Optical_5617.jpg"></div><p></p>
