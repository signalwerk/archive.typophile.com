    html: |-
      <p>Hi Martijn, please remember I'm a learner too and take my observations more as questions than facts ;)<br>
      This is coming along very nicely indeed. I'm looking forward to seeing how you might approach a heavier weight.<br>
      The join of K is quite a dark spot. I think perhaps a solution might be to make the arm and leg one stroke, just touching the vertical, rather than have the top arm branching from the stem and the leg branching from the arm. Does that make sense?<br>
      M and N have maybe dark blobs at the junctures. I'd trap the counters slightly or thin them some more.<br>
      The crossbar on Q is unusual and slightly looks broken. I like the idea of tapering it inwards but there is a discontinuity between the inner and outer contours that is a bit arresting.<br>
      R's bowl is a bit wide in comparison to the supporting leg. Not sure whether the leg could be pushed out or the bowl brought in.<br>
      S I think looks a bit too wide next to T. Middle vertex of W needs lightening??<br>
      X could do with some optical correction; the crossover looks discontinuous — check Mark Jamra's article about this.<br>
      I'd add more rigour to the curves of e. To me it needs more superelliptical shoulders. It might do with being slightly wider too? Compare with o.<br>
      I think your l is causing problems in text. The foot is pretty long and creates wide spaces as Nina observed with the t.<br>
      Lowercase m is quite narrow compared to n. w and x maybe need similar treatment to W and X.<br>
      I think ring should have no observable stroke contrast. Not sure where I read that, sorry. It looks rather large to me. But I am not too familiar with its design.<br>
      Th ligature has an unbalanced crossbar — the stem of T is not centred?<br>
      I'll refrain from judging your numerals since I find them totally impossible to get looking anything like I hope. ;)<br>
      Hope that might be useful. Keep it up! :)</p>
    html_clean: |-
      <p>Hi Martijn, please remember I'm a learner too and take my observations more as questions than facts ;)<br>
      This is coming along very nicely indeed. I'm looking forward to seeing how you might approach a heavier weight.<br>
      The join of K is quite a dark spot. I think perhaps a solution might be to make the arm and leg one stroke, just touching the vertical, rather than have the top arm branching from the stem and the leg branching from the arm. Does that make sense?<br>
      M and N have maybe dark blobs at the junctures. I'd trap the counters slightly or thin them some more.<br>
      The crossbar on Q is unusual and slightly looks broken. I like the idea of tapering it inwards but there is a discontinuity between the inner and outer contours that is a bit arresting.<br>
      R's bowl is a bit wide in comparison to the supporting leg. Not sure whether the leg could be pushed out or the bowl brought in.<br>
      S I think looks a bit too wide next to T. Middle vertex of W needs lightening??<br>
      X could do with some optical correction; the crossover looks discontinuous — check Mark Jamra's article about this.<br>
      I'd add more rigour to the curves of e. To me it needs more superelliptical shoulders. It might do with being slightly wider too? Compare with o.<br>
      I think your l is causing problems in text. The foot is pretty long and creates wide spaces as Nina observed with the t.<br>
      Lowercase m is quite narrow compared to n. w and x maybe need similar treatment to W and X.<br>
      I think ring should have no observable stroke contrast. Not sure where I read that, sorry. It looks rather large to me. But I am not too familiar with its design.<br>
      Th ligature has an unbalanced crossbar — the stem of T is not centred?<br>
      I'll refrain from judging your numerals since I find them totally impossible to get looking anything like I hope. ;)<br>
      Hope that might be useful. Keep it up! :)</p>
