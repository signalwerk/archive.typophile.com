    html: |-
      <p>Hi Martijn :)<br>
      This looks good. Here are some observations (I'm no expert though!):<br>
      @ looks very large.<br>
      B needs a larger bottom bowl, smaller on top.<br>
      C, G and J look perhaps a little narrow.<br>
      I might consider giving K a different knee: a lower join with the bottom leg connected to the arm rather than the stem. Or take the arm and leg apart from the stem to give a bit more width?<br>
      M looks narrow.<br>
      OPQR are very pleasant.<br>
      The curves on S looks a bit like the curves go too far round into the spine. Perhaps you could make the spine a bit steeper with the BCPs nearer the extrema? See the S in <a class="freelinking external" href="http://typophile.com/node/45498" rel="nofollow">Modena Light</a> to see what I mean.<br>
      The lc is looking really nice.<br>
      I think the crossbar on e could afford to be a smidge lower.<br>
      h could be slightly too wide?<br>
      Tail on j looks a bit long to me.<br>
      The bottom of the bowl of q should be more shaped like the bottom of the bowl of d (more upwards in the SE corner)<br>
      The arm on r looks a bit thin.<br>
      Try making the crossbar on t a similar length to the foot.<br>
      u looks wide.<br>
      I usually prefer a straight y, but that's just my taste. </p>
      <p>Good luck and keep going :)</p>
