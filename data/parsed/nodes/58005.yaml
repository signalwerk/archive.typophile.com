      <p>Hi Martijn,<br>
      This is coming together impressively well! Congrats. I'm especially fond of the "a" and "e", they're truly beautiful. And the slight taper on top of the "t" is delicious!<br>
      But overall I'm most impressed with how well the "system" is expressed in all lettershapes. It looks quite mature. </p>
      <p>Here are some questions/observations (but I'm not an expert either):</p>
      <ul>
      <li>Maybe my biggest critique is that those letters that only have straight lines, especially diagonals, look a bit heavier and not as elegant as the "curvy" glyphs. Also, in some of these glyphs the joins are too dark (like in the "M" or "w") – try some [more] inktraps for optical correction maybe, or widen the joins. (You might enjoy this article by Mark Jamra: <a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_6.pdf" rel="nofollow">link to PDF</a>, which explains some things about optical correction with useful before/after pictures.)
      </li><li>I wonder if you've tried to make the caps close together in width? The "L" seems rather wide, and the "M" (and maybe the "K") pretty narrow. Is that intentional?
      </li><li>Have you tried a "t" with a shorter foot, or a longer crossbar? This one looks nice, but it might be difficult to get the spacing right with that foot "in the way".
      </li><li>I'd suggest you give the stem-to-curve join of the "r" a closer look. It seems like the curve tapers less than in other comparable joins like the "n" etc.
      </li></ul>
      <p>Great work overall! Absolutely keep it up. :)</p>
