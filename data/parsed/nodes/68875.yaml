    <p>Hey people. I've been working on this book face and am finally ready for some feedback. Any and all, really.</p>
    <p>Things I'm mostly pondering right now and could use a little ideas on: stylistic diversity is a bit messy; stylistic "oddities" are lacking a bit too much perhaps; italic is on the drawing board, but still rather formative — know of things that make sense here? Thanks!</p>
    <p>(The name is a working title. I prefer having utterly irrelevant working titles, for some reason.)</p>
