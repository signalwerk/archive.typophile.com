    html: |-
      <p>A very good overall design, but I don't like the combination between some very traditional, rounded terminals (/a/f/r/s/) with the unusual, contemporary cut of other elements (for example, upper right serif of /k/v/w/x/y). As you used a sharp cut in other parts (/b/d/u/) and uneven serifs (/m/n/) it may be more harmonic to use not-so-rounded terminals.</p>
      <p>Diacritics (acute/grave/circumflex) are misplaced. You can take a look on Slimbach's serif fonts to verify an optimal placement of these diacritics. Observe that this taller style of acute/grave will demand a different shape in uppercases.</p>
      <p>I like your /k/p/m/n/h/K/R, but /g/ seems distorted and /e/ is falling to the right.</p>
      <p>Comma seems identical to Greta's.</p>
    html_clean: |-
