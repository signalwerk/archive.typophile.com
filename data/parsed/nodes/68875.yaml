      <p>Ah, yes. Yes, positions are terrible. You're right. They're not high-priority at the moment as I'm mainly trying to get the shapes and metrics right. Thanks for the pointers.</p>
      <p>Re: language support. That's the part that's vexing me. I want to use this face for my own print things (10pt text and the works), but supporting many different languages is more than logical as a selling point. I don't know where I got the idea for the highly slanted acute (well, it's in my handwriting), but I was happy to discover it in Trinité and Lexicon. Dutch typefaces. Go figure.</p>
      <p>Here are some updates. A pointy, pointed-pen-inspired terminal that has some of the sharpness other shapes have as well (/&amp;/g/k/) and some more.</p>
