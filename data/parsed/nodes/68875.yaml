    html: <p>It's a very nice design. What I noticed is that there is very little spacing between words, in the "What is entropy?" and "Abstract objects and mathematics" sample texts. Maybe that is due to the fact that the typeface hasn't been kerned? The single words doens't look "isolated" enough in the line of text. I guess you should work on that issue - the relationship of space between glyphs pairs and between words. Besides that, it looks like a nice typeface.</p>
