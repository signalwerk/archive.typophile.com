    html: |-
      <p>I'm myself developing a serif family and /g/ is by far the most difficult character to me. It took me dozens of revisions until I got a decent design.</p>
      <p>The comma got my attention because I like very much the shape you used.</p>
      <p>About diacritics, the main problem is not with angle but with position. Acute and grave are not centered or aligned to character limits. They must be slight dislocated from the center to te direction the accent points to. You can use a rule like this: acute have one third of its length to the left of middle and two thirds to the right. The opposite with grave.</p>
      <p>Of course this is a very general rule. You can adopt different positions and, except for extremes, it would not be incorrect. But some positions works better than others. Take Minion, Times and Meta Serif: each one has a different criteria, but I think Minion works much better (as I'm a native Portuguese speaking, I use acute, grave, tilde, circumflex, cedilla and dieresis regularly).</p>
      <p>You may also consider acute and grave to be shorter if you plan an extensive language support. Letters with two diacritics above will need very much room over uppercase limit.</p>
