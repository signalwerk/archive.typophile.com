    html: "<p> Hrant, is this specifically for type that you are creating or is this an altruistic endeavor? In other words, what's in it for you? If nothing is in it for you in terms of $, and it's more to fix something that needs fixed, then... <br> <br>Remember the lament of hhp: you're trying to justify the time spent on type. To get honorware implemented will require hundreds of hours of your time. So to answer your question of, What's to lose?: just your time.  <br> <br>So it's a risk-reward question, and perhaps an exercise in the principles of utility and charity.  <br> <br>Why not get some feedback from some of the 'leaders' of the type industry? Without key support from the powers-that-be, your job will be that much more difficult. <br> <br>bj <br> <br> <br>also: <br> <br>   &gt;&gt; Why? Practically any expensive product can be bought through multiple small payments.&gt;&gt; <br> <br>But type is considered by most everyone NOT to be in the category of 'any expensive product' <br> <br>bj </p>"
