    html: <p> You could call it subtle - but it's still significant. The bottom line is that Honorware can bring in more money than Shareware (for the reasons above). <br> <br>But you could also say that Shareware is mostly "pay-if-you-use-it", while Honorware is "pay-if-you're-ethical" with the elaboration that ethics is relative; for example, asking a Tanzanian to pay $100 for a font is a lot less reasonable than asking a Belgian, and they know it. Also, Honorware does not make it illegal to not pay, while Shareware often does. And "often" is a key word, because *some* Shareware schemes are indeed effectively Honorware, but like I said the model is so divergent that nobody -least of all the user- has a clear and consistent idea of what to do. <br> <br>So you could call it a "rebirth" of the original model, which is needed because Shareware is in tatters. <br> <br>hhp </p>
