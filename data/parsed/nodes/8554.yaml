ends on the foundry, and <br>   might vary depending on partial or full payment. <br>7. Embedding restrictions are up to the foundry, <br>   but again, it's better to be nice, especially <br>   since anybody can download the thing anyway. <br>   You can't steal a gift. <br> <br>Bottom line: <br>Being ethical is much more compelling than being legal, <br>and we can use this to increase sales (and make people <br>happier as a side benefit). <br> <br>What now? Basically, to make this really work, enough of us <br>have to think it's a good idea, and certain people  have to <br>hear us thinking it's a good idea, good enough to recruit <br>us to it, on the ground. <br> <br>This is a great place to express support for honorware, <br>or even simply discuss -and maybe refine- it. Fire at will. <br> <br>hhp </p>"
