  - id: 147402
    user: 1203
    date: 2001-12-30T10:17:00
    date_raw: 30 Dec 2001 — 10:17am
    votes: null
    html: "<p> Joe: <br> <br>&gt;In general, this problem stems from viewing  <br>&gt;font licensing the same way we view  <br>&gt;application software licensing. Indeed, it's only  <br>&gt;the US that is unwilling to provide protection  <br>&gt;for fonts UNLESS they're considered software. <br> <br>Actually this isn't quite true. The US does have protection for typefaces as \"design\", but not via copyright. The US Patent and Trademark Office will register typefaces as design patents, and these can form the basis of legal action. Now, you may be doubtful as to the number and type of fonts that could qualify for such protection, but Adobe has a patent on Adobe Garamond - this was part of the Adobe/Emigre v SSI case, in which the Judge stated that design patent of this type was a valid form intellectual property protection (although made no judgement in the matter as the case was settled on other issues). <br> <br>There are a number of articles at Fontzone that reference the SSI case and patent. <br> <br>&gt;I believe a much better model would be to  <br>&gt;view fonts as a creative asset like photography  <br>&gt;or illustration, where rights are based on  <br>&gt;usage and the rules for payment seem more  <br>&gt;clear. <br> <br>I tend to think that for fonts this model doesn't quite work. <br> <br>&gt;Clive's thoughts about different license  <br>&gt;schemes for different needs is perhaps what  <br>&gt;the industry needs. (And could indeed follow  <br>&gt;the more familiar stock photo/illustration  <br>&gt;model.) But I think the ones he  <br>&gt;states are way too 'user' centric (in the  <br>&gt;'software' sense) where it ought to be more  <br>&gt;'project' centric. <br> <br>I don't think project centric is very practical. What's a project, a single page layout, someone's entire ad campaign globally, someone's corporate ID work for the next ten years? Users and time are fairly simple things to measure. <br> <br>&gt;(\"The client just ordered  <br>&gt;another round of changes and the font expired  <br>&gt;two days ago.\" <br> <br>Then just go online and get an update. First thing to realise is that you don't have to buy an expiring licence, and some foundries may not even want to go there. The second thing to realise is that the whole model is based around network-centric solutions. You should be able to update your licence, get a copy of a corrupted or lost font, get a list of the fonts, status and licensing of all the fonts you own 24 hours a day, 365 days of the year. <br> <br>The weak points being your own network connectivity (your problem) and the robustness of the servers/connection of the foundry conecerned. <br> <br>&gt;Or, \"My machine just  <br>&gt;fatally crashed, and it's the only one with the  <br>&gt;font license!\") <br> <br>Well that applies with fonts right now. If you don't have a back-up you're screwed, and you're going to have a real hard time trying to get free replacements from any foundry. I would imagine that systems would be in place to allow you access if you can securely identify yourself. <br> <br>&gt;Does anyone every need a single user  <br>&gt;license? <br> <br>Yes, I do. <br> <br>&gt;Make it a single \"project\" license and  <br>&gt;you're on to something. <br> <br>Then buy a multi-user licence. I can't quote on specifics but an expiring multi-user licence would probably end up cheaper than a permanent single user licence. <br> <br>If this could be set up and run really efficiently, and was pretty much leak-proof (ie people *had* to pay for font licences), then I don't see why fonts shouldn't be priced in some cases in the sub $2.00 bracket. <br> <br>One of the main reasons fonts are priced as they are today is the costs associated with sales, ie people filling in bits of paper and answering the phone. I think the \"Making a living\" thread touched on this, big foundry sells hundreds of fonts, but designer gets $50.00. It's not because the big foundry stole all the money, but that the money disappeared through the distribution system. You can see the practical effect of this when foundries sell complete libraries, the cost per font plumets to well under a dollar in some cases, because the \"people\" and distribution costs for selling 3,000 fonts in one hit are pretty much the same as selling one font, thus the bulk of the cost is licencing fees that go back to the designers (in small amounts still). <br> <br>&gt;When was the last  <br>&gt;time, in a studio or agency situation, where a  <br>&gt;single designer was the ONLY person to  <br>&gt;touch a project. Very rarely would a designer  <br>&gt;ever buy fonts for perosnal use (even  <br>&gt;freelancers work on projects with other  <br>&gt;designers.)  <br> <br>All the time :-) <br> <br>But of course there are many different usage scenarios, which is why tailored licences are appropriate. <br> <br>&gt;I don't keep Frutiger on my hard drive merely  <br>&gt;because I think it's a fine typeface. I keep  <br>&gt;Frutiger on my machine because I need it  <br>&gt;tomorrow for a client project. (And the font  <br>&gt;better not expire because you can count on  <br>&gt;me archiving the font right alongside my Quark  <br>&gt;files for future assurance that whoever needs  <br>&gt;the Quark doc will have the fonts too.) <br> <br>There's a trade-off here. Do you buy an expiring licence on the basis that you don't need it past the end of the week, or you might but you'll deal with that later? Or, do you buy a non-expiring licence because you want to make certain that the font is there and ready to run in three years time if you need it? <br> <br>Your decision will be based on the discount you're getting for an expiring licence and whether you have the confidence in the licencing/distribution system to believe that you'll be able to get a replacement for the expiring font at some point in the future. <br> <br>My take on it is that if I can buy a font for $5.00 rather than $30.00, and it expires in a acceptable time frame, then I'm going to buy the $5.00 font. The same way I would have bought one sheet of Letraset or one line of typesetting rather than multiple copies \"just in case\". <br> <br>If I were going to buy a set of fonts for ongoing use then I'd clearly see the value in a non-expiring licence. But where the future usage is undetermined I think it's appropriate to pay for the use I'm going to make. I may end up paying more for that font over the longer term by buying several expiring licences, but I think again that's probably an acceptable thing to do (you can buy anything in bulk cheaper than one-offs, but that doesn't mean you buy three tonnes of coffee to get a bargain price over the year). <br> <br>&gt;Jim is setting a comp using Filosofia Unicase  <br>&gt;for a design review with his client. He has no  <br>&gt;idea if the client will approve Filosofia; he can  <br>&gt;only hope. He only has Filosofia because  <br>&gt;he (illegally) burned it on a CD back in  <br>&gt;his college days. (Raise your hand if you've  <br>&gt;ever met a college design student without a  <br>&gt;CD full of pirated fonts). Now the comp is  <br>&gt;ready to print and Doug needs Jim to email  <br>&gt;him a copy of Filosofia so he can output it on  <br>&gt;the color printer. <br> <br>I think the issue is that in many cases the pirated versions never get translated into legitimate licences. Often designers don't have a clue about font licencing at all, and many of their managers aren't in a position to deal with the issue either. <br> <br>&gt;So, now the comp is approved and the studio  <br>&gt;buys the font. Then the client's in-house  <br>&gt;design group buys it. ... What  <br>&gt;graphic designer do you know says, \"Here's  <br>&gt;the comp, but imagine it set in this cool  <br>&gt;typeface from this specimen book.\" <br> <br>Well, realistically, this used to happen all the time. It's only fairly recently that design concepts would be shown to clients as more or less finished artwork. A bit of hand rendered headline and some squiggly lines for body type were what clients approved - in some enlightened cases they still do. <br> <br>However, I understand your point. My counter would be that in a \"smart\" licencing system foundries could offer limited res or limited functionality versions of fonts as demo versions. That's essentially what you're asking for isn't it? <br> <br>Bitstream actually had a library like this years ago, supplied to designers fairly cheaply, but would only print at 300dpi. When it was sent to a bureau they had the high-res versions and it would rip to film ok. <br> <br>&gt;(...These libraries are maintained by  <br>&gt;IT folks who know the legal ramifications of  <br>&gt;being caught with pirated software on their  <br>&gt;servers.) <br> <br>These servers are run by IT people who may know what a font is or where it came from, but their boss says \"$7,000 for fonts, do we need to?\". In the UK the onus is on the management to deal with these issues where they have been informed of the situation by their staff. <br> <br>Besides which, only very large agencies will have dedicated IT people, most 5-20 person businesses will just muck in together to sort problems out as they occur, or contract out maintenance to a third party who won't care about licencing either way. <br> <br>&gt;I'll finish my rant by mentioning a recent  <br>&gt;conversation with an influencer at a large font  <br>&gt;house (no, it's not the one you're thinking).  <br>&gt;This person suggested the idea of distributing  <br>&gt;their vast font library for FREE on CD to  <br>&gt;reputable and trustworthy agencies. The idea  <br>&gt;is exactly as I've outlined above except it would  <br>&gt;make the above scenario legal. When the  <br>&gt;client approves the face, you (or they) buy the  <br>&gt;font. This makes that obscure font, that you  <br>&gt;would otherwise never buy, available to test on  <br>&gt;that client job.  <br> <br>The thing is that *large* agencies will just buy the CD anyway. Designers will just use the fonts they find on the servers or on their colleague's hard disks, there's no way they're going to go through some reporting system recording every time they use a font so that the agency gets a chance to licence it. <br> <br>I've even known designers to \"cheat\" on the photo stock agencies. <br> <br>Here's another \"huge\" foundry story. A recent discussion lead an employee of said foundry to explain that they had pretty much no way of tracking the legitimacy of a font licence if they were to examine someone's HD. Because their fonts were distributed in so many different ways by many different agents, bought individually, in bundles and licenced en masse. Such was the problem that there was additionally no realistic way of offering upgraded licences either. <br> <br>That's the kind of mess I want to put a stop to. I want designers to know what fonts are licenced to them, explicitly, and for the foundries to be able to verify that, both for their own benefit and as a client service. <br> <br>Being able to get upgrades and replacements in the middle of the night are real benefits to font users. </p>"
    html_clean: "<p> Joe: <br> <br>&gt;In general, this problem stems from viewing  <br>&gt;font licensing the same way we view  <br>&gt;application software licensing. Indeed, it's only  <br>&gt;the US that is unwilling to provide protection  <br>&gt;for fonts UNLESS they're considered software. <br> <br>Actually this isn't quite true. The US does have protection for typefaces as \"design\", but not via copyright. The US Patent and Trademark Office will register typefaces as design patents, and these can form the basis of legal action. Now, you may be doubtful as to the number and type of fonts that could qualify for such protection, but Adobe has a patent on Adobe Garamond - this was part of the Adobe/Emigre v SSI case, in which the Judge stated that design patent of this type was a valid form intellectual property protection (although made no judgement in the matter as the case was settled on other issues). <br> <br>There are a number of articles at Fontzone that reference the SSI case and patent. <br> <br>&gt;I believe a much better model would be to  <br>&gt;view fonts as a creative asset like photography  <br>&gt;or illustration, where rights are based on  <br>&gt;usage and the rules for payment seem more  <br>&gt;clear. <br> <br>I tend to think that for fonts this model doesn't quite work. <br> <br>&gt;Clive's thoughts about different license  <br>&gt;schemes for different needs is perhaps what  <br>&gt;the industry needs. (And could indeed follow  <br>&gt;the more familiar stock photo/illustration  <br>&gt;model.) But I think the ones he  <br>&gt;states are way too 'user' centric (in the  <br>&gt;'software' sense) where it ought to be more  <br>&gt;'project' centric. <br> <br>I don't think project centric is very practical. What's a project, a single page layout, someone's entire ad campaign globally, someone's corporate ID work for the next ten years? Users and time are fairly simple things to measure. <br> <br>&gt;(\"The client just ordered  <br>&gt;another round of changes and the font expired  <br>&gt;two days ago.\" <br> <br>Then just go online and get an update. First thing to realise is that you don't have to buy an expiring licence, and some foundries may not even want to go there. The second thing to realise is that the whole model is based around network-centric solutions. You should be able to update your licence, get a copy of a corrupted or lost font, get a list of the fonts, status and licensing of all the fonts you own 24 hours a day, 365 days of the year. <br> <br>The weak points being your own network connectivity (your problem) and the robustness of the servers/connection of the foundry conecerned. <br> <br>&gt;Or, \"My machine just  <br>&gt;fatally crashed, and it's the only one with the  <br>&gt;font license!\") <br> <br>Well that applies with fonts right now. If you don't have a back-up you're screwed, and you're going to have a real hard time trying to get free replacements from any foundry. I would imagine that systems would be in place to allow you access if you can securely identify yourself. <br> <br>&gt;Does anyone every need a single user  <br>&gt;license? <br> <br>Yes, I do. <br> <br>&gt;Make it a single \"project\" license and  <br>&gt;you're on to something. <br> <br>Then buy a multi-user licence. I can't quote on specifics but an expiring multi-user licence would probably end up cheaper than a permanent single user licence. <br> <br>If this could be set up and run really efficiently, and was pretty much leak-proof (ie people *had* to pay for font licences), then I don't see why fonts shouldn't be priced in some cases in the sub $2.00 bracket. <br> <br>One of the main reasons fonts are priced as they are today is the costs associated with sales, ie people filling in bits of paper and answering the phone. I think the \"Making a living\" thread touched on this, big foundry sells hundreds of fonts, but designer gets $50.00. It's not because the big foundry stole all the money, but that the money disappeared through the distribution system. You can see the practical effect of this when foundries sell complete libraries, the cost per font plumets to well under a dollar in some cases, because the \"people\" and distribution costs for selling 3,000 fonts in one hit are pretty much the same as selling one font, thus the bulk of the cost is licencing fees that go back to the designers (in small amounts still). <br> <br>&gt;When was the last  <br>&gt;time, in a studio or agency situation, where a  <br>&gt;single designer was the ONLY person to  <br>&gt;touch a project. Very rarely would a designer  <br>&gt;ever buy fonts for perosnal use (even  <br>&gt;freelancers work on projects with other  <br>&gt;designers.)  <br> <br>All the time :-) <br> <br>But of course there are many different usage scenarios, which is why tailored licences are appropriate. <br> <br>&gt;I don't keep Frutiger on my hard drive merely  <br>&gt;because I think it's a fine typeface. I keep  <br>&gt;Frutiger on my machine because I need it  <br>&gt;tomorrow for a client project. (And the font  <br>&gt;better not expire because you can count on  <br>&gt;me archiving the font right alongside my Quark  <br>&gt;files for future assurance that whoever needs  <br>&gt;the Quark doc will have the fonts too.) <br> <br>There's a trade-off here. Do you buy an expiring licence on the basis that you don't need it past the end of the week, or you might but you'll deal with that later? Or, do you buy a non-expiring licence because you want to make certain that the font is there and ready to run in three years time if you need it? <br> <br>Your decision will be based on the discount you're getting for an expiring licence and whether you have the confidence in the licencing/distribution system to believe that you'll be able to get a replacement for the expiring font at some point in the future. <br> <br>My take on it is that if I can buy a font for $5.00 rather than $30.00, and it expires in a acceptable time frame, then I'm going to buy the $5.00 font. The same way I would have bought one sheet of Letraset or one line of typesetting rather than multiple copies \"just in case\". <br> <br>If I were going to buy a set of fonts for ongoing use then I'd clearly see the value in a non-expiring licence. But where the future usage is undetermined I think it's appropriate to pay for the use I'm going to make. I may end up paying more for that font over the longer term by buying several expiring licences, but I think again that's probably an acceptable thing to do (you can buy anything in bulk cheaper than one-offs, but that doesn't mean you buy three tonnes of coffee to get a bargain price over the year). <br> <br>&gt;Jim is setting a comp using Filosofia Unicase  <br>&gt;for a design review with his client. He has no  <br>&gt;idea if the client will approve Filosofia; he can  <br>&gt;only hope. He only has Filosofia because  <br>&gt;he (illegally) burned it on a CD back in  <br>&gt;his college days. (Raise your hand if you've  <br>&gt;ever met a college design student without a  <br>&gt;CD full of pirated fonts). Now the comp is  <br>&gt;ready to print and Doug needs Jim to email  <br>&gt;him a copy of Filosofia so he can output it on  <br>&gt;the color printer. <br> <br>I think the issue is that in many cases the pirated versions never get translated into legitimate licences. Often designers don't have a clue about font licencing at all, and many of their managers aren't in a position to deal with the issue either. <br> <br>&gt;So, now the comp is approved and the studio  <br>&gt;buys the font. Then the client's in-house  <br>&gt;design group buys it. ... What  <br>&gt;graphic designer do you know says, \"Here's  <br>&gt;the comp, but imagine it set in this cool  <br>&gt;typeface from this specimen book.\" <br> <br>Well, realistically, this used to happen all the time. It's only fairly recently that design concepts would be shown to clients as more or less finished artwork. A bit of hand rendered headline and some squiggly lines for body type were what clients approved - in some enlightened cases they still do. <br> <br>However, I understand your point. My counter would be that in a \"smart\" licencing system foundries could offer limited res or limited functionality versions of fonts as demo versions. That's essentially what you're asking for isn't it? <br> <br>Bitstream actually had a library like this years ago, supplied to designers fairly cheaply, but would only print at 300dpi. When it was sent to a bureau they had the high-res versions and it would rip to film ok. <br> <br>&gt;(...These libraries are maintained by  <br>&gt;IT folks who know the legal ramifications of  <br>&gt;being caught with pirated software on their  <br>&gt;servers.) <br> <br>These servers are run by IT people who may know what a font is or where it came from, but their boss says \"$7,000 for fonts, do we need to?\". In the UK the onus is on the management to deal with these issues where they have been informed of the situation by their staff. <br> <br>Besides which, only very large agencies will have dedicated IT people, most 5-20 person businesses will just muck in together to sort problems out as they occur, or contract out maintenance to a third party who won't care about licencing either way. <br> <br>&gt;I'll finish my rant by mentioning a recent  <br>&gt;conversation with an influencer at a large font  <br>&gt;house (no, it's not the one you're thinking).  <br>&gt;This person suggested the idea of distributing  <br>&gt;their vast font library for FREE on CD to  <br>&gt;reputable and trustworthy agencies. The idea  <br>&gt;is exactly as I've outlined above except it would  <br>&gt;make the above scenario legal. When the  <br>&gt;client approves the face, you (or they) buy the  <br>&gt;font. This makes that obscure font, that you  <br>&gt;would otherwise never buy, available to test on  <br>&gt;that client job.  <br> <br>The thing is that *large* agencies will just buy the CD anyway. Designers will just use the fonts they find on the servers or on their colleague's hard disks, there's no way they're going to go through some reporting system recording every time they use a font so that the agency gets a chance to licence it. <br> <br>I've even known designers to \"cheat\" on the photo stock agencies. <br> <br>Here's another \"huge\" foundry story. A recent discussion lead an employee of said foundry to explain that they had pretty much no way of tracking the legitimacy of a font licence if they were to examine someone's HD. Because their fonts were distributed in so many different ways by many different agents, bought individually, in bundles and licenced en masse. Such was the problem that there was additionally no realistic way of offering upgraded licences either. <br> <br>That's the kind of mess I want to put a stop to. I want designers to know what fonts are licenced to them, explicitly, and for the foundries to be able to verify that, both for their own benefit and as a client service. <br> <br>Being able to get upgrades and replacements in the middle of the night are real benefits to font users. </p>"
