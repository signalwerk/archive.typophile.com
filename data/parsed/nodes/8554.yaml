    html: "<p> &gt; Well, given the right licencing model and enforcement scheme, those that won't pay won't play.  <br> <br>But considering the mechanism does not exist (and will not exist for a while, if ever), honorware has validity. <br> <br>More to the point: I'm a practical person, and  to me selling things is also a practical -as opposed to a spiritual- thing. So since I personally have no way to enforce usage (and I don't know very many who do, and those who do don't seem interested in such a scheme), I try to simply improve the situation, hence honorware. <br> <br>&gt; What you propsoe is being done today, it's called shareware and no one pays for it.  <br> <br>I think re-branding it, re-focusing it would get more people to pay, and it might surpass the commercialware model (which however isn't saying much). I think you either don't have enough faith in users, or piracy bothers you too much for your own good. <br> <br>&gt; I'm not on either of those lists. <br> <br>When I brought up my encryption idea on OT you were there. <br> <br>&gt; tell MS/Adobe/Apple what they want <br> <br>I think that's naive: <br>Big corporations have no problem giving away fonts - it's *our* problem. <br> <br>&gt; How to sell it to customers? <br> <br>No, that's a front. <br>The real question is: \"How do I convince the stockholders?\" <br> <br>A big, unseen, part of this problem is that -in the end- fonts are essentially owned/distributed by people who care nothing about type, they just want more money. <br> <br>&gt; I don't care what pirates like them do either way. <br> <br>That's not very objective; you have to put aside your emotions. We're talking about marketing, about technology - not morals. <br> <br>&gt; Give them free online tools to try a font before they even buy an expiring licence and you're genuinely offering an improved service.  <br> <br>I can't. Who is willing and able? Nobody. <br>So what are we left with: accomodating the behavior of users: honorware. <br> <br>Being a dreamer is good - unless it ends up driving you crazy. For the moment you can't beat piracy, you have to side-step it. <br> <br>hhp </p>"
