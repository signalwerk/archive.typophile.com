    html: "<p> &gt; if not then wave goodbye to entire industries and content providers. <br> <br>(I wish I had some ASCII-art of somebody waving...) <br> <br>&gt; I'm pretty sure Agfa/MT/ITC and Linotype do. <br> <br>I think there's only one company with the potential to really help type designers: Adobe. But the fact that it's a public company greatly reduces any hope. <br> <br>&gt; Or at least they give every impression of such.  <br> <br>Exactly. <br>Honesty in a corporation is like kindness in a stormtrooper. <br> <br>&gt; one has to convince the marketing dweebs <br> <br>Clive, the marketing dweebs know *exactly* what they're doing. They're not stupid - they're just not paid to care about the craft of type design. <br> <br>&gt; on the one hand it's \"not about corporations - it's grass roots people\", then you're going on about \"convincing the stockholders\". <br> <br>No, my point is that we simply can't convince the stockholders [to implement your \"enforcement\"], and that's why we have to fend for ourselves, even if that means scrounging for scraps. Having faith in users is our only realistic recourse, as precarious as that might seem. <br> <br>&gt; things are changing. <br> <br>If you mean that there are increasingly more small independent foundries, that's moot: implementing the technology to support your \"enforcement\" requires the participation of the big fat corporations. <br> <br>And in any case, what you're proposing -if it ever happens- is years away. I never claimed honorware is some panacea for all of time - it's just something that would help many designers make more money, *today*. <br> <br>&gt; People are offering such tools now <br> <br>You mean those half-baked online preview mechanisms, like I have on my own site? That's no substitute for real access to the actual font. There's a reason some of the biggest players (like FontBureau and FontFont) don't bother with preview mechanisms. <br> <br>Ideally, we need an ATM with encryption and dynamic online \"reporting\", but that's not even on anybody's horizon. So realistically what we need *today* is a good alternative to traditional commercialware (which is too anti-user) and shareware (which is somewhat anti-designer, and a general mess). <br> <br>(I think I'm getting some ideas of refinements to the honorware model - let me think offline a bit...) <br> <br>hhp </p>"
