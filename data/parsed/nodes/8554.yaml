    html: <p> Clive, <br> <br>I've been mulling over your points about "project"  <br>vs. "user" centric licensing. I have to concede  <br>that a project centered licensing agreement would  <br>require much more negotiation between the buyer  <br>and the foundry--over issues like the print run,  <br>scope of usage, shelf-life of the piece, et  <br>cetera--which is prohibitive. <br> <br>I can't imagine a foundry doing that much  <br>haggling over a $49 or even $99 USD font. It  <br>wouldn't be cost effective. (Rights protected  <br>stock imagery is typically in the $400 to $1000  <br>USD range and warrant some negotiation over  <br>price.) <br> <br>//joe </p>
