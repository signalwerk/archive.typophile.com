    html: "<p> Almost all other software is available in demo mode for a trial period, so why not fonts?  <br> <br>Rant begins here: Quite frankly, I resent the whole idea of having to pay, say $40 for a font that I might use for a total of six characters - and never ever use again, when for the same price I can buy, say a years supply of paper for my printer, or the latest 3D realistic shoot-em-up computer game, or a big spindle of CD-R's, or even a superb set of Rotring pens or any number of other $40 items. You might say that I'm comparing apples and oranges here, but \"it's the price, stupid\". Not only that, \"it's the lack of copy protection, stupid\". Ever since digital type began there was never - to my knowledge - any built-in copy protection. The \"democratization\" of graphic design brought about by desktop publishing hard-and-software did not seem to alert type vendors to the possibilty of selling to the average computer user. Prices remain high to this day and it is no wonder that there are so many cheap knock-off fonts and font collections available, not to mention the rampant piracy going on. $1000 or more for a complete font library? Give me a break!  <br>It's a badly broken system, in my opinion. The honorware suggestion: A nice name, but if you actually want to increase sales then you don't complicate the purchasing process. Paying over a few weeks or months is pretty ludicrous if you are talking about many fonts and various vendors.  <br>End of rant. <br> <br>Sorry I don't have anything positive to say on the subject. I do think the major type vendors should be taking the initiative on pricing and marketing plans though. The system they all seem to have is not worth emulating down at the scale of the individual font designer/vendor. </p>"
    html_clean: "<p> Almost all other software is available in demo mode for a trial period, so why not fonts?  <br> <br>Rant begins here: Quite frankly, I resent the whole idea of having to pay, say $40 for a font that I might use for a total of six characters - and never ever use again, when for the same price I can buy, say a years supply of paper for my printer, or the latest 3D realistic shoot-em-up computer game, or a big spindle of CD-R's, or even a superb set of Rotring pens or any number of other $40 items. You might say that I'm comparing apples and oranges here, but \"it's the price, stupid\". Not only that, \"it's the lack of copy protection, stupid\". Ever since digital type began there was never - to my knowledge - any built-in copy protection. The \"democratization\" of graphic design brought about by desktop publishing hard-and-software did not seem to alert type vendors to the possibilty of selling to the average computer user. Prices remain high to this day and it is no wonder that there are so many cheap knock-off fonts and font collections available, not to mention the rampant piracy going on. $1000 or more for a complete font library? Give me a break!  <br>It's a badly broken system, in my opinion. The honorware suggestion: A nice name, but if you actually want to increase sales then you don't complicate the purchasing process. Paying over a few weeks or months is pretty ludicrous if you are talking about many fonts and various vendors.  <br>End of rant. <br> <br>Sorry I don't have anything positive to say on the subject. I do think the major type vendors should be taking the initiative on pricing and marketing plans though. The system they all seem to have is not worth emulating down at the scale of the individual font designer/vendor. </p>"
