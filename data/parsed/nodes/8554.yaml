    date: 2001-12-30T02:36:00
    date_raw: 30 Dec 2001 — 2:36am
    votes: null
    html: "<p>The current font licensing model sucks. (For  <br>both foundries and studios). Perhaps the  <br>current model only works for the huge  <br>foundries (Adobe, Bitstream)  who's whole  <br>libraries are bought by large agencies,  <br>studios and schools. But there's got to be <br>a better model for the big foundries as well. <br> <br>Hrant's idea, while a twist on an existing idea  <br>is still interesting but I'd hesitate to offer my  <br>fonts free to just anybody in hopes that a  <br>fraction of them would pay for it. (Just as I'd  <br>hesitate to offer them as shareware or  <br>freeware). Clive's points are equally  <br>interesting but somehow just as difficult to  <br>imagine in practice for reasons I'll get to.  <br> <br>In general, this problem stems from viewing  <br>font licensing the same way we view  <br>application software licensing. Indeed, it's only  <br>the US that is unwilling to provide protection  <br>for fonts UNLESS they're considered software.  <br>I believe a much better model would be to  <br>view fonts as a creative asset like photography  <br>or illustration, where rights are based on  <br>usage and the rules for payment seem more  <br>clear. (With stock photography and illustration  <br>low res comps are free in exchange for your  <br>name and email address. High res comping  <br>samples are provided for a tenth of the final  <br>price. Sure you could print your job with the <br>high res comp, but the stock house knows <br>exactly who you are and what your project is.) <br> <br>Clive's thoughts about different license  <br>schemes for different needs is perhaps what  <br>the industry needs. (And could indeed follow  <br>the more familiar stock photo/illustration  <br>model.) But I think the ones he  <br>states are way too 'user' centric (in the  <br>'software' sense) where it ought to be more  <br>'project' centric. (\"The client just ordered  <br>another round of changes and the font expired  <br>two days ago.\" Or, \"My machine just  <br>fatally crashed, and it's the only one with the  <br>font license!\") <br> <br>Consider the project, not the number of users.  <br>Does anyone every need a single user  <br>license? Make it a single \"project\" license and  <br>you're on to something. When was the last  <br>time, in a studio or agency situation, where a  <br>single designer was the ONLY person to  <br>touch a project. Very rarely would a designer  <br>ever buy fonts for perosnal use (even  <br>freelancers work on projects with other  <br>designers.) <br> <br>I don't keep Frutiger on my hard drive merely  <br>because I think it's a fine typeface. I keep  <br>Frutiger on my machine because I need it  <br>tomorrow for a client project. (And the font  <br>better not expire because you can count on  <br>me archiving the font right alongside my Quark  <br>files for future assurance that whoever needs  <br>the Quark doc will have the fonts too.) <br> <br>Now consider the following fictitous--but more  <br>common than we dare admit--example. (This  <br>example concludes in a sort of twist on the  <br>'honor' model: <br> <br>Jim is setting a comp using Filosofia Unicase  <br>for a design review with his client. He has no  <br>idea if the client will approve Filosofia; he can  <br>only hope. He only has Filosofia because  <br>he (illegally) burned it on a CD back in  <br>his college days. (Raise your hand if you've  <br>ever met a college design student without a  <br>CD full of pirated fonts). Now the comp is  <br>ready to print and Doug needs Jim to email  <br>him a copy of Filosofia so he can output it on  <br>the color printer. <br> <br>So, now the comp is approved and the studio  <br>buys the font. Then the client's in-house  <br>design group buys it. Without illegally copying <br>Filosofia Unicase, would Jim ever have used it  <br>in his comp? My hypothesis is that the  <br>fonts getting 'sold' to clients are the ones that  <br>designers have on hand--whether legally or  <br>not. The end-clients are the drivers of retail  <br>font purchases. (Like stock photography or  <br>illustration.) If I can't get a free or cheap comp  <br>of your photo into my design, my client will  <br>never see it and of course they will never buy  <br>it. (I'm talking stock here, not custom.) What  <br>graphic designer do you know says, \"Here's  <br>the comp, but imagine it set in this cool  <br>typeface from this specimen book.\" <br> <br>(This works for the BIG foundries because  <br>most large design houses and ad agencies  <br>own their libraries, Bitstream and Adobe  <br>especially. These libraries are maintained by  <br>IT folks who know the legal ramifications of  <br>being caught with pirated software on their  <br>servers.) <br> <br>I'll finish my rant by mentioning a recent  <br>conversation with an influencer at a large font  <br>house (no, it's not the one you're thinking).  <br>This person suggested the idea of distributing  <br>their vast font library for FREE on CD to  <br>reputable and trustworthy agencies. The idea  <br>is exactly as I've outlined above except it would  <br>make the above scenario legal. When the  <br>client approves the face, you (or they) buy the  <br>font. This makes that obscure font, that you  <br>would otherwise never buy, available to test on  <br>that client job. <br> <br>I was going to say this was \"my two cents,\" but   <br>I wrote an entire essay. Perhaps that's what <br>happens when I go away for a week. <br> <br>I realize I'm a bit all over the place, trying to  <br>answer both Hrant and Clive and trying to  <br>introduce another sort of  'honor' model to the  <br>thread. I've just had this kicking around in me  <br>since the \"making a living\" and the \"knockoffs  <br>hurt\" threads. Plus it's late. <br> <br>//joe</p>"
