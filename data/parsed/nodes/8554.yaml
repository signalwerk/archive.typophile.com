    html: "<p> Remember the lament of 3IP's Brian Wilson and others: There's not a lot of honor in the world today. <br> <br>A few thoughts:  <br> <br>** The cynical view of 'this will never work' is probably also the pramatic view, based on what we know about the type industry and the 'value' (or lack of value) people ascribe to type. It is not impossible, but...what's so bad about the current system? (just kidding) <br> <br>** A payment plan -- if you proceed with this idea, you might want to rework that phrase or perhaps lose this element entirely. A payment plan or 'installment plan' makes people think of an investment. Type shouldn't be an investment. I want to pay for something once, not three times. Who has time to keep up with installments? <br> <br>** I don't know much about software, but isn't it possible to write a patch of encrypted code that will allow a font to only be installed on one computer and not be transferred? There's got to be an engineer holed up at Adobe or someplace that could come up with a method or process to restrict multiple copying of a font. Is there any research in this area? <br> <br>** I buy a couple fonts per month and $40 is reasonable, to me. It's a tax deduction so that cuts the price dramatically, too. <br> <br>** You have to consider: why do people buy type? Most people buy type to make money. If $40 is too much, then perhaps you aren't charging enough for your services. Or, like Joe said in a previous discussion, bill your clients.  <br> <br>** Paying for use, like stock photography...even more difficult to implement and enforce. <br> <br>bj </p>"
