    html_clean: "<p> One of them is easy Clive. You wrote: <br> <br>&gt;Martin indicates he'd just like six glyphs.  <br>&gt;That unfortunately won't work very well because  <br>&gt;it's very difficult to handle fonts with  <br>&gt;differing numbers of glyphs without giving each  <br>&gt;such font a unique name - a real nightmare  <br>&gt;support-wise. <br> <br>If I want 6 glyphs, give them to me in an EPS,  <br>not a font. Keep it simple--it's the outlines I  <br>need. <br> <br>//joe </p>"
  - id: 147400
