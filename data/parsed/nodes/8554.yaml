  html: "<p> {The following is the bulk of a post I just made to the TypeDesign <br>discussion list. I thought Typophile would be another good place to <br>bring this up.} <br> <br>Over time, and proportionate to the so-called \"democratization\" <br>of type design, many of us have come to the sad conclusion that <br>the conventional model of \"pay-then-get\" is not in harmony with <br>reality in the case of fonts: they're too easy to pirate, highly <br>undervalued, and most of all there's no real way of trying the <br>product before you buy it. <br> <br>As a result, some of us have turned to Shareware, <br>which in theory should accomodate us very well, but <br>in practice has come to suffer from two major flaws: <br>1. It's too divergent, covering all kinds of schemes. <br>2. It has a stigma of cheapness. <br> <br>So I propose to re-focus the \"get-then-pay\" model, in order to <br>re-align the Shareware gambit. I call it a gambit because it's <br>essentially a trade-off between losing some sales to people who <br>would just buy the font outright (an increasingly rare breed) <br>versus gaining sales from the added access and the gifting of <br>trust to potential customers. This \"gifting\" is really a very <br>important advantage of Shareware, and can only help increase <br>sales and reduce piracy, because it puts a much higher price <br>on ethics, and removes the threat associated with the conven- <br>tional model, thus reducing animosity. People are much more <br>likely to be nice to you if you're nice to them. <br> <br>First, we need a new name: <br>I came up with \"honorware\". It sounds nice, and expensive, <br>but not exclusionary. And the \"honor system\" is well-known. <br> <br>Second, we need to define honorware very tightly in terms of <br>the customer, but very loosely in terms of the seller. This, <br>because we want the customer to know the ethical commitment <br>clearly, but we don't want to turn away designers: we need <br>critical mass to bestow respect upon the name and concept <br>of honorware. <br> <br>Third, we need to make it seem justifiably more pricey than <br>Shareware. This might seem tricky, but I think if we spin <br>it right it's really not. <br> <br>Now, when you try to think through the implementation of honorware, <br>it's actually pretty difficult to make it work; I was having a lot <br>of trouble getting the three requirements (priciness, convenience, <br>trust) to harmonize. But through some brainstorming, a \"director\" of <br>a major font house came up with the breakthrough concept: payment in <br>installments, with the option to cancel. This is a supremely elegant <br>way of allowing two key honorware concepts: accomodating the finan- <br>cial reality of users; allowing users who can't afford $100 but can <br>afford $20 to give us the $20, an not even feel very guilty. <br> <br>So here's what I have so far: <br>1. The main concept is that the user gets to download a complete <br>   working copy of the font, with no requirement whatsoever of <br>   paying for simply having it. I think even *hinting* that the <br>   font must be de-installed does more harm than good. <br>2. If the user likes it or uses it, he pays in one of 3 ways: <br>   all at once; over a few weeks; over a few months. If the <br>   user chooses an installment plan, he is reminded to pay <br>   (or cancel - see below) at each period. <br>3. If the customer stops liking/using it, or for any <br>   other reason, he can cancel, and stop paying. Period. <br>4. Although we shouldn't explicitly disallow people <br>   from giving the font to somebody else, we should <br>   try to encourage them to simply refer to the <br>   original download site instead. <br>5. The EULA is up to the foundry, but gentleness is very <br>   important: ideally, there shouldn't be any explicit <br>   legal threats, just implicit ethical ones. There's <br>   no use smiling if you're brandishing a baseball bat. <br>6. The post-sales support depends on the foundry, and <br>   might vary depending on partial or full payment. <br>7. Embedding restrictions are up to the foundry, <br>   but again, it's better to be nice, especially <br>   since anybody can download the thing anyway. <br>   You can't steal a gift. <br> <br>Bottom line: <br>Being ethical is much more compelling than being legal, <br>and we can use this to increase sales (and make people <br>happier as a side benefit). <br> <br>What now? Basically, to make this really work, enough of us <br>have to think it's a good idea, and certain people  have to <br>hear us thinking it's a good idea, good enough to recruit <br>us to it, on the ground. <br> <br>This is a great place to express support for honorware, <br>or even simply discuss -and maybe refine- it. Fire at will. <br> <br>hhp </p>"
