    html: "<p> Hrant: <br> <br>&gt;The problem of course is that these are the people you simply <br>&gt;can't make pay, no matter how angry that makes you. You have <br>&gt;to adapt to a reduced amount that a few *will* pay, necessarily <br>&gt;giving up some of your pride in the process. Honorware is about <br>&gt;pragmatism. <br> <br>Well, given the right licencing model and enforcement scheme, those that won't pay won't play. <br> <br>Clive: <br>&gt;&gt; are people interested in having the kind of \"smart\" fonts that <br>&gt;I outlined?  <br> <br>Hrant: <br>&gt;The answer to that is obvious: yes.  <br>&gt;The problem is the implementation and getting people used to <br>&gt;the idea. <br> <br>That's the problem, yes, but it's not the question. Implementation isn't as big a problem as people think. Getting people used to the idea is more about selling them the benefits, and I think there are many to font buyers. <br> <br>&gt;BTW, I think I'm being a lot less imaginary than you, because <br>&gt;I'm proposing something that can be done today, to increase <br>&gt;sales. And I'm totally comfortable with more people having my <br>&gt;fonts without paying for them - those people wouldn't pay <br>&gt;anyway, and at least I get access/exposure. <br> <br>What you propsoe is being done today, it's called shareware and no one pays for it. <br> <br>&gt;&gt; What we need is a long-term solution  <br> <br>&gt;Agreed. But that's not the point of this thread.  <br>&gt;I of all people would never want to limit discussion, but I do <br>&gt;think focus is important. It's very easy to start your own <br>&gt;separate thread about any long-term solutions (one of which I <br>&gt;outlined on the OpenType list a long time ago, if you <br>&gt;remember, and I've also brought it up recently on the <br>&gt;TypeDesign list as well - nobody seems to be interested <br>&gt;enough, you should note), and you can even point to it from <br>&gt;here. <br> <br>I'm not on either of those lists. <br> <br>&gt;&gt; The cost of implementation isn't an issue yet  <br> <br>&gt;If it weren't, we'd already have it. <br> <br>No. We'd already have it if people could accept the concept, or even imagine the concept and tell MS/Adobe/Apple what they want rather than being told what they're going to get. <br> <br>The reason it hasn't happened is that there are many things to put in place and no one has yet drawn up a blueprint. I've spoken to many people in \"high places\" about these ideas and the general reaction is: <br> <br></p>"
    html_clean: "<p> Hrant: <br> <br>&gt;The problem of course is that these are the people you simply <br>&gt;can't make pay, no matter how angry that makes you. You have <br>&gt;to adapt to a reduced amount that a few *will* pay, necessarily <br>&gt;giving up some of your pride in the process. Honorware is about <br>&gt;pragmatism. <br> <br>Well, given the right licencing model and enforcement scheme, those that won't pay won't play. <br> <br>Clive: <br>&gt;&gt; are people interested in having the kind of \"smart\" fonts that <br>&gt;I outlined?  <br> <br>Hrant: <br>&gt;The answer to that is obvious: yes.  <br>&gt;The problem is the implementation and getting people used to <br>&gt;the idea. <br> <br>That's the problem, yes, but it's not the question. Implementation isn't as big a problem as people think. Getting people used to the idea is more about selling them the benefits, and I think there are many to font buyers. <br> <br>&gt;BTW, I think I'm being a lot less imaginary than you, because <br>&gt;I'm proposing something that can be done today, to increase <br>&gt;sales. And I'm totally comfortable with more people having my <br>&gt;fonts without paying for them - those people wouldn't pay <br>&gt;anyway, and at least I get access/exposure. <br> <br>What you propsoe is being done today, it's called shareware and no one pays for it. <br> <br>&gt;&gt; What we need is a long-term solution  <br> <br>&gt;Agreed. But that's not the point of this thread.  <br>&gt;I of all people would never want to limit discussion, but I do <br>&gt;think focus is important. It's very easy to start your own <br>&gt;separate thread about any long-term solutions (one of which I <br>&gt;outlined on the OpenType list a long time ago, if you <br>&gt;remember, and I've also brought it up recently on the <br>&gt;TypeDesign list as well - nobody seems to be interested <br>&gt;enough, you should note), and you can even point to it from <br>&gt;here. <br> <br>I'm not on either of those lists. <br> <br>&gt;&gt; The cost of implementation isn't an issue yet  <br> <br>&gt;If it weren't, we'd already have it. <br> <br>No. We'd already have it if people could accept the concept, or even imagine the concept and tell MS/Adobe/Apple what they want rather than being told what they're going to get. <br> <br>The reason it hasn't happened is that there are many things to put in place and no one has yet drawn up a blueprint. I've spoken to many people in \"high places\" about these ideas and the general reaction is: <br> <br></p>"
