    html: "<p> &gt; I resent the whole idea of having to pay, say $40 <br>&gt; for a font that I might use for a total of six characters <br> <br>Totally. <br>The pay-in-installments method allows you to pay <br>*something*, while remaining legal, and even ethical. <br> <br>&gt; if you actually want to increase sales then you don't complicate <br>&gt; the purchasing process. Paying over a few weeks or months is pretty <br>&gt; ludicrous if you are talking about many fonts and various vendors. <br> <br>My original idea was pay-what-you-want, and I thought that was more straightforward. But then I realized the value of freedom-*from*-choice, and more significantly I realized the power of paying by installments not really as a way to spread out the payments, but much more as a way to effectively pay what you want/can, with some guidance and nudging. Nobody should expect everybody to pay the whole amount -or even most of it- all of the time. Adaptability to the wishes and circumstances of the user is arguably the most significant thing in sales, and it's something not at all accomodated by the traditional model. <br> <br>Also: Concerning the possible confusion from having a bunch of concurrent \"payment plans\", note that the more fonts somebody buys, the more he's likely to go for the \"pay all at once\" option. <br> <br>hhp </p>"
    html_clean: "<p> &gt; I resent the whole idea of having to pay, say $40 <br>&gt; for a font that I might use for a total of six characters <br> <br>Totally. <br>The pay-in-installments method allows you to pay <br>*something*, while remaining legal, and even ethical. <br> <br>&gt; if you actually want to increase sales then you don't complicate <br>&gt; the purchasing process. Paying over a few weeks or months is pretty <br>&gt; ludicrous if you are talking about many fonts and various vendors. <br> <br>My original idea was pay-what-you-want, and I thought that was more straightforward. But then I realized the value of freedom-*from*-choice, and more significantly I realized the power of paying by installments not really as a way to spread out the payments, but much more as a way to effectively pay what you want/can, with some guidance and nudging. Nobody should expect everybody to pay the whole amount -or even most of it- all of the time. Adaptability to the wishes and circumstances of the user is arguably the most significant thing in sales, and it's something not at all accomodated by the traditional model. <br> <br>Also: Concerning the possible confusion from having a bunch of concurrent \"payment plans\", note that the more fonts somebody buys, the more he's likely to go for the \"pay all at once\" option. <br> <br>hhp </p>"
