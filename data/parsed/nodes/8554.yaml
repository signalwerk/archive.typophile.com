    html: "<p> Hrant: <br>&gt;And the \"installment\" model allows an  <br>&gt;ethical but not-filthy-rich <br>&gt;designer to try the font for a nominal  <br>&gt;amount, and then decide <br>&gt;to buy it for real or not. <br> <br>Forget installment, think about cheap fonts and how to get people to use them. Give someone a font for a couple of dollars and they'll use it. If it expires over time they can upgrade to a non-expiring verion or buy another cheap expiring one. <br> <br>Give them free online tools to try a font before they even buy an expiring licence and you're genuinely offering an improved service. </p>"
    html_clean: "<p> Hrant: <br>&gt;And the \"installment\" model allows an  <br>&gt;ethical but not-filthy-rich <br>&gt;designer to try the font for a nominal  <br>&gt;amount, and then decide <br>&gt;to buy it for real or not. <br> <br>Forget installment, think about cheap fonts and how to get people to use them. Give someone a font for a couple of dollars and they'll use it. If it expires over time they can upgrade to a non-expiring verion or buy another cheap expiring one. <br> <br>Give them free online tools to try a font before they even buy an expiring licence and you're genuinely offering an improved service. </p>"
