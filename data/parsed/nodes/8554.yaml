    html: "<p> Clive: <br>&gt; My opinion is that many people will only pay if you \"make\" them pay. <br> <br>The problem of course is that these are the people you simply can't make pay, no matter how angry that makes you. You have to adapt to a reduced amount that a few *will* pay, necessarily giving up some of your pride in the process. Honorware is about pragmatism. <br> <br>&gt; are people interested in having the kind of \"smart\" fonts that I outlined?  <br> <br>The answer to that is obvious: yes. <br>The problem is the implementation and getting people used to the idea. <br> <br>BTW, I think I'm being a lot less imaginary than you, because I'm proposing something that can be done today, to increase sales. And I'm totally comfortable with more people having my fonts without paying for them - those people wouldn't pay anyway, and at least I get access/exposure. <br> <br>&gt; What we need is a long-term solution <br> <br>Agreed. But that's not the point of this thread. <br>I of all people would never want to limit discussion, but I do think focus is important. It's very easy to start your own separate thread about any long-term solutions (one of which I outlined on the OpenType list a long time ago, if you remember, and I've also brought it up recently on the TypeDesign list as well - nobody seems to be interested enough, you should note), and you can even point to it from here. <br> <br>&gt; The cost of implementation isn't an issue yet <br> <br>If it weren't, we'd already have it. <br> <br>Joe: <br>&gt; it's only the US that is unwilling to provide protection for fonts UNLESS they're considered software. <br> <br>But legal protection is largely ineffective anyway. <br> <br>&gt; My hypothesis is that the fonts getting 'sold' to clients are the ones that designers have on hand <br> <br>Bingo. <br> <br>Clive: <br>&gt; I know people have discussed this very idea for five years or more (without coming to a solution) <br> <br>Did you read my post about URW? <br> <br>&gt; But as you wrote, that's not a font, so I kind of think it's separate from this discussion. <br> <br>Right. <br> <br>hhp </p>"
