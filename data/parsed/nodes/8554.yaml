    html: "<p> Joe: <br>&gt;If I want 6 glyphs, give them to me in an  <br>&gt;EPS, not a font. Keep it simple--it's the  <br>&gt;outlines I need. <br> <br>You know, I say that's fair enough, and I know people have discussed this very idea for five years or more (without coming to a solution). I also know that someone is working on this in a realistic way that will come to fuition. <br> <br>But as you wrote, that's not a font, so I kind of think it's separate from this discussion. </p>"
