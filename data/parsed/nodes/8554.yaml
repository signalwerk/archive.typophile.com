    html: "<p> Ok, I think that \"honourware\" is in fact no different to \"shareware\", just a different name. Most shareware fonts say \"pay if you use it commercially\" and most people don't. <br> <br>My opinion is that many people will only pay if you \"make\" them pay. <br> <br>One thing has come out of this thread, that is interesting, and has been discussed at a couple of events recently is the concept of licencing to users on a limited basis. <br> <br>Martin indicates he'd just like six glyphs. That unfortunately won't work very well because it's very difficult to handle fonts with differing numbers of glyphs without giving each such font a unique name - a real nighmare support-wise. <br> <br>However, lots of us think that licences should be tailored to an individual's needs: <br> <br>You want a licence \"just for you\". <br> <br>You want a licence for your work group. <br> <br>You want a licence that gives you embedding and distribution rights within a large organisation. <br> <br>You want a licence for a document you want to make up right now, but it's a one-off and you won't need to font again (so how about if the font expires in a month, or six months, or whatever?). <br> <br>You need an update for to a font because there are new glyphs and/or hinting/kerning changes. <br> <br>All the above scenarios are a headache, there's no easy way to get updates to people, there's no easy way to have intelligent fonts that \"know\" who they belong to and there's no easy way for fonts to expire over time. <br> <br>But, let's imagine there were answers to all of these: <br> <br>You can buy a font for $5.00, that expires in three months and can only be used by you (hey, like a sheet of Letraset). <br> <br>You can buy a non-expiring version of the same font, \"just for you\", for $25.00 - it won't work on anyone else's machine (actually tied to the user, so you buy a new machine, transfer your licence \"tags\" and it'll still work). <br> <br>If you want a five user licence, that only works for five users, that'll be $40.00. <br> <br>How about a large company, that has a corporate font, the licence makes it so that it only works on the company's own LAN/WAN? <br> <br>Or, because the font is \"smart\" and knows who owns it, they can go to the foundry site any time and get a replacement or update? <br> <br>And just maybe, demo fonts that don't print, but that you can try out on screen? <br> <br>Would this be a model that would appeal to those who buy type? </p>"
