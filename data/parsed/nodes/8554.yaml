    html: "<p> &gt;&gt; Well, given the right licencing model and enforcement scheme, those <br>&gt;that won't pay won't play.  <br>&gt; <br>&gt;But considering the mechanism does not exist (and will not exist for a <br>&gt;while, if ever), <br> <br>Oh, for sure it will exist, if not then wave goodbye to entire industries and content providers. <br> <br>&gt;honorware has validity. <br> <br>As much as shareware does. I'm not saying it's not valid, I'm just saying it's no improvement on what's already there. <br> <br>&gt;More to the point: I'm a practical person, and to me selling things is also <br>&gt;a practical -as opposed to a spiritual- thing. So since I personally have <br>&gt;no way to enforce usage (and I don't know very many who do, and those <br>&gt;who do don't seem interested in such a scheme), I try to simply improve <br>&gt;the situation, hence honorware. <br> <br>I don't think it's going anywhere. particularly from a practical point of view. This is a \"spiritual\" concept - I trust in my brother man - and you're going on about practical considerations? <br> <br>&gt; <br>&gt;&gt; What you propsoe is being done today, it's called shareware and no <br>&gt;one pays for it.  <br>&gt; <br>&gt;I think re-branding it, re-focusing it would get more people to pay, and it <br>&gt;might surpass the commercialware model (which however isn't saying <br>&gt;much). I think you either don't have enough faith in users, or piracy <br>&gt;bothers you too much for your own good. <br> <br>The former. I don't have faith. <br> <br>&gt;&gt; I'm not on either of those lists.  <br>&gt; <br>&gt;When I brought up my encryption idea on OT you were there. <br> <br>And I'm expected to remember one of your posts from 2-3 years ago? <br> <br>Remember this: <br> <br>R <br>G <br>B <br> <br>:-) <br> <br>&gt;&gt; tell MS/Adobe/Apple what they want  <br>&gt; <br>&gt;I think that's naive:  <br>&gt;Big corporations have no problem giving away fonts - it's *our* problem. <br> <br>Apple/MS/Adobe may not, but I'm pretty sure Agfa/MT/ITC and Linotype do. Or at least they give every impression of such. <br> <br>&gt;&gt; How to sell it to customers?  <br>&gt; <br>&gt;No, that's a front.  <br>&gt;The real question is: \"How do I convince the stockholders?\" <br> <br>No, it's not a front, it must have customer benefits to be a practical proposition. The only front to it is that one has to convince the marketing dweebs that this is a benefit for them too. <br> <br>There's a lack of logic to the things you're throwing up here, on the one hand it's \"not about corporations - it's grass roots people\", then you're going on about \"convincing the stockholders\". <br> <br>&gt;A big, unseen, part of this problem is that -in the end- fonts are <br>&gt;essentially owned/distributed by people who care nothing about type, <br>&gt;they just want more money. <br> <br>I think that you should take a look around, things are changing. <br> <br>&gt;&gt; I don't care what pirates like them do either way.  <br>&gt; <br>&gt;That's not very objective; you have to put aside your emotions. We're <br>&gt;talking about marketing, about technology - not morals. <br> <br>Like I wrote, I don't care what they do, we're not playing the same game. <br> <br>&gt;&gt; Give them free online tools to try a font before they even buy an <br>&gt;expiring licence and you're genuinely offering an improved service.  <br>&gt; <br>&gt;I can't. Who is willing and able? Nobody.  <br>&gt;So what are we left with: accomodating the behavior of users: honorware. <br> <br>You can't what? <br> <br>People are offering such tools now, some of them have been around for... since 1994 or so (and at that time it was the best thing on the net). <br> <br>&gt;Being a dreamer is good - unless it ends up driving you crazy. For the <br>&gt;moment you can't beat piracy, you have to side-step it. <br> <br>I think the only dreamer going crazy is someone who might imagine that \"honorware\" is any different to \"shareware\". </p>"
