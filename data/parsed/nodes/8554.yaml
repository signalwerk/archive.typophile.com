    html: "<p> &gt;Would this be a model which can be implemented <br>&gt;cost-effectively, soon enough for us to care? No. <br> <br>That wasn't the question I asked, and you'll note that I prefaced the whole thing with: <br> <br>&gt;But, let's imagine there were answers to all of these: <br> <br>ie I disallowed your question before you asked it. <br> <br>So, in our imagined perfect world (where incidently people are still imperfect and won't pay for fonts unless you make them), are people interested in having the kind of \"smart\" fonts that I outlined? <br> <br>The cost of implementation isn't an issue yet, and it isn't an issue for font purchasers anyway - as long as they get a better service and at least some users, who want limited access/functionality, can get it at a price that suits them (ie cheaper than $40 to use six chars). <br> <br>As for \"soon enough for us to care\" - if you want it next week, or even next year, then no. Take OpenType as an example, the original OT Jam at MS was in 1997, nearly five years later and OT still isn't \"mainstream\". What we need is a long-term solution, to a long-term problem, not a quick fix. If it doesn't start now we're just delaying it. </p>"
