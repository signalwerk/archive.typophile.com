    html: "<p> &gt; what's in it for you? <br> <br>I guess two things: money (I'm finishing my first Latin text face; I've been selling non-Latin fonts for many years, but that's different) and a desire to make the craft healthier. <br> <br>&gt; To get honorware implemented will require hundreds of hours of your time. <br> <br>How so? Do you mean like the implementation of e-commerce and stuff? I'd never do that myself; I'm hoping some font houses will integrate honorware into their existing systems. Certain font houses have considered shareware, but like I was explaining, that model's a mess. <br> <br>&gt; Without key support from the powers-that-be, your job will be that much more difficult.  <br> <br>Totally. This thing has a much better chance in the hands of marketing pros than in mine. The thing is, they're listening - one of the biggest ones I know for a fact. I approached this \"big one\" last month, and it said \"let's see if you can muster up good public support for it\". <br> <br>And that's why I'm hoping people who think honoware is a good idea will say so in public. <br> <br>&gt; But type is considered by most everyone NOT to be in the category of 'any expensive product' <br> <br>You have a point. <br>But *some* people pay a lot of money for good fonts, and it would be a shame to lose that money - and this is one way the installment plan makes sense. <br> <br>hhp </p>"
