    html: <p> &gt; The point would be to offer cheaper licencing all-round, for at least some groups, some may end up paying more. <br> <br>The problem is that the biggest factor in how much a given person will/can pay is that person's circumstances (like his salary in Bangalore). So the ideal sales model would be nimble enough to adequately accomodate the user no matter who/where he is - we don't live in Kansas no more. The traditional commercialware model fails miserably in the Internet Age, and implementing "enforcement" (forgetting for a moment that it's vaporware anyway) is not necessarily the complete answer, or even most of the answer. <br> <br>hhp </p>
