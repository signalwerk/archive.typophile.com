    <p>Hello first topic here,</p>
    <p>I'm looking for a serif or sansserif font for a English/Russian book, I'm going to design. Any ideas of high quality independant foundries providing these.<br>
    I thought about the Fedra Pro from Peter Biľak of the Fedra Serif A?<br>
    Any other ideas?</p>
    <p>Many thanks for your help, </p>
    <p>Nicolas</p>
