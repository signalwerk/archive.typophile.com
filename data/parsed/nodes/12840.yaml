    html: <p>well, just off the top of my head, i think <a href="http://houseindustries.com/index.php?page=showfont&amp;id=3" rel="nofollow">Chalet</a> by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a> would foot the bill. I personally wouldn't choose it for long texts(I wouldn't choose any sans for long texts but that's just me), but if this is a catalog, i'm assuming the texts are short and this might just fit the bill.</p>
  - id: 74095
    user_id: 7151
    user_name: Maxim Zhukov
    user_path: null
    user_image: /files/pictures/picture-7151.gif
    date_raw: 3 Jun 2005 — 9:02am
    date: 2005-06-03T09:02:00
    votes: null
    html: "<p>I admire House Industries for a lot of things: their fantastic sense of style; their great taste; their innovative approach to type design (e.g., in Ed Interlock); the great usability and beauty of their latest release, Paperback; but <em>not</em> for their Cyrillics. Chalet Cyrillic does not feel authentic (and yes, you can read it). You can compare the feeling to those Latin glyphs that are routinely included in the Japanese fonts: they look <em>foreign</em>. If you want real quality and authenticity, ParaType Cyrillics are your best bet.</p>"
