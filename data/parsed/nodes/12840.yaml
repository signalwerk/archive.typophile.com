      <p>ok, </p>
      <p>Sorry for being not precise enough.<br>
      Independant means like: LucasFont, Processtype, PsyOps or others.<br>
      I want to invest money directly to the designer who made the font not to big corporation like Adobe, Agfa…<br>
      Good quality means: wide character sets (thin, light, italic, medium, bold), fine tuning in the characters approaches already made, linear and non linear numbers…<br>
      I'm not sure yet what to use; serif or sansserif.<br>
      The book is a world fair art catalogue. It's not highly contemporary but if I'm buying a complete font for this work, I'm planning to use the font for other upcoming works too.<br>
