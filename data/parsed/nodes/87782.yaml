    html: |-
      <p>Neo Grotesques will usually be drawn cleaner, with more coherence between characters and will be conceived as families from the begginig thus showing greater stylistic integration between weights.</p>
      <p>Groteque typefaces were initially intended as display faces for newspaper advertisements thus never made good paragraphs. Many Neo Grotesque typefaces have more open shapes and better spacing to improve this.</p>
      <p>Also many Neo Groteque typefaces incorporate geometric or humanistic characteristics to soften the beefy appearance of Grotesques.</p>
      <p>But none of these are rules, some Neo Grotesque types are conceived to dramatize the clunky appearance of early Grotesques as they were derived from early Slab Serifs.</p>
