      <p>Even though they have already given you answers I will add some information that might be helpfull to someone visiting this post in the future.</p>
      <p>According to Karen Cheng's Designing Type book, the basic difference between Grotesques and Neo Grotesques typefaces is that Grotesques were basically Serif faces with the serifs cut off and Neo Grotesques have a more systematic construction.</p>
