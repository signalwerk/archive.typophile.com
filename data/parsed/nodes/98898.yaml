  html: |-
    <p>So I found a setting to "show nodes on mask layer" in the preferences&gt;glyph window&gt;appearances panel, but I was wondering, is there any way to show the control vectors/points of the mask layer while still on the main layer?<br>
    It would be really helpful for matching up certain parts of a character in the mask layer without switching back and forth from looking at the mask to the main glyph.</p>
    <p>Thanks!</p>
