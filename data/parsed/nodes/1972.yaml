  html: <p>I'm designing a CD-cover and need your critique on the simple logotype I'm planning to put as a part of the cover. Here's a rough sketch. The blue background is the sky of the cover photo. Does the logo work OK? What should I change? Any specific problems? <br> <br>(and yes, the "hurriganes" is spelled correctly and "the" is missing in the sentence... Finnish band Hurriganes was notorious about their bad english<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">) <br> <br><img src="http://www.typophile.com/forums/messages/29/19944.jpg" alt=""></p>
