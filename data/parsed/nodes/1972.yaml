    html: <p>i like the tight letterspacing on the tagline. but it's true that the word spacing is too large.  bring the words closer, i say.  you might want to bring that tagline down too, farther away from ADAM. <br> <br>also, i think the A in ADAM should be the same distance to the D as the other A is to the M. (what i mean is the vertical blue lines there aren't the same width, but they should be identical.</p>
