    html: <p>"Rough sketch" sure looks different than what I call a "rough sketch". I really like the type design, however, music is very emotional making it hard for me to critique its appropriateness without knowing much about Adam. I guess the only thing I would say (and many might disagree with me) is that the sliver of the "M" strokes seems to be crossing the baseline too far. It probably wouldn't bother me so much if the "A" below it wasn't so close. <br> <br>Aloha! <br>Scott</p>
