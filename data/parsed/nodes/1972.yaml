    html: <p>It seems appropriate that the cresent shaped space between the "D" and "A" should "appear" even from top to bottom. In order to achieve this visual equal spacing (I say "visual" because the "literal" spacing is probably even, as is) the open space probably needs to flare out just a tad at the top and bottom. <br> <br>Also, Loren is on the money regarding the vertical space between the A's and their adjacent consonants. <br> <br>Aloha! <br>Scott</p>
