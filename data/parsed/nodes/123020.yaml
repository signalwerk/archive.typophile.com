    html: |-
      <p>I've done some Google searching, and I haven't found a technical term for the type of capital W usually found in Garamond and also present in Kabel. One encyclopedia referred to the capital W in Kabel as being "splayed", but I don't think that is the usual term, if any exists.</p>
      <p>Basically, the issue is that W is, in this unusual form, topologically equivalent to X instead of I.</p>
