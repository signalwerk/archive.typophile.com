    html: <p>In French, the letter |W| is referred to as double V (doo-bluh-vay)—when it is drawn as two overlapping Vs, I think it is a very apt description....</p>
    html_clean: <p>In French, the letter |W| is referred to as double V (doo-bluh-vay)—when it is drawn as two overlapping Vs, I think it is a very apt description....</p>
