      <p>I prefer numerals, simply because it is more widely understood and has close parallels in so many different languages. Figures seems to have been a specialised Anglo-American typographers term, and awkwardly has other meanings, e.g. diagrams or illustrations in a book.</p>
      <p>I prefer uppercase and lowercase to capital and small, similarly, because they are more precise. What’s a ’small letter’? 5pt?</p>
      <p>The best technical terms are majuscule and miniscule, which of course predate typesetting, but they are not familiar to many people.</p>
      <p>Yes, the terminology of upper and lower derives from typesetters’ cases, but it is widely used outside of the type business and has been for a very long time. It also figures (oh, look, there’s that imprecise word again) in the user interfaces of many applications that non-specialist users employ on a daily basis without difficulty. For instance, my text editor has a ’To Uppercase’ text conversion function.</p>
      <p>Also, while upper and lower clearly refer to typesetters’ cases, we call alphabets that have a functional majuscule/miniscule distinction ’bicameral’. So there is another sense in which our alphabet is ’cased’, that is now independent of the origins of the term; there is for instance some evidence that the Crimean ’palochka’ letter has recently ’assumed case’, i.e. a monocameral letter has become bicameral.</p>
