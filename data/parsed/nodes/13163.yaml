      <p>Vince the terms uppercase and lower aren’t “incorrect.” Earlier scribal terms were majuscule and minuscule and these are still common in calligraphy. Uppercase and lowercase are printers terms in the sense that the terms are not used before the introduction of printing and do refer to storage and distribution placement. But the words are common usage and definitional. The word type, also a printer’s term, itself was not used to describe “letters” until as late as 1701. </p>
      <p>“Capitals” and “small letters” seem less useful in that they are less precise and can refer to other things. University of Reading huh?</p>
    html_clean: |-
