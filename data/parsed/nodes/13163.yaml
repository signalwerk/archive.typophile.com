    <p>At the University of Reading in 2000 we never referred to Capital as Uppercase and small letters to lowercase. </p>
    <p>The terms are incorrect and referred to typecases and the placements of the metal slugs.</p>
    <p>Capitals is the correct term referring to there Roman roots. And small letters is the only real term for those little versions of the original Capitals. </p>
    <p>Now we need to know are they Figures (figgers: UK English) or Numerals?</p>
    <p>It would be interesting to know what the non-english terms are for Capital letters and small letters?</p>
