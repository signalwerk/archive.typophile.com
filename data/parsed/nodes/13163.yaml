    html: |-
      <p>After body text was always normally set in Linotype or Monotype, hand<br>
      setting was only done for display, and so a case didn’t need to hold so<br>
      much type. So one combined case was used, called in the US the<br>
      “California job case”. That is what you worked on. But in the days when<br>
      all type was hand set, the lower case, most convenient to the hand of<br>
      the compositor, held the more common miniscule letters, and the upper<br>
      case, where he had to reach, the majescule.</p>
