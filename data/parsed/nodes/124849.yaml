      <p>Looks like Erich Meyer's Tannenberg of 1935 <img src="/sites/default/files/old-images/TannenbergFetteasCursed_4373.jpg"><br>
      There is a digital Tannenberg Fett widely available as a Dieter Steffmann font, but I suspect it is a rip of a digital font created by another fontmaker. There are original digitizations of all Tannenberg weights by Gerhard Helzel <a href="http://www.fraktur.biz/">http://www.fraktur.biz/</a> Complicated website. Fonts by direct sale only.<br>
      Don</p>
