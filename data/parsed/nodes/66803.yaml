  html: |-
    <p>A beautiful collection of Warner Brothers final scene type treatments, the majority hand drawn.</p>
    <p>Mouse over for the film's title card: <a href="http://tinyurl.com/yjj2y6a" title="http://tinyurl.com/yjj2y6a">http://tinyurl.com/yjj2y6a</a> </p>
    <p>Part of a massive collection of Film Title stills assembled by Dutch web designer Christian Annyas. Not the usual homage to film title sequences themselves, but of the moment when the film's title and hence it's type treatment is first revealed in the sequence.</p>
    <p>Brilliant sleuthing, kudos to Christian.</p>
