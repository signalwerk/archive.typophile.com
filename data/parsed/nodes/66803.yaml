      <p>Thanks for posting. That's some seriously lovely lettering and so much in glorious monochrome. And also some great movie titles such as "Young Man with a Horn", "Dark Passage" and "The Amazing Dr Clitterhouse".</p>
      <p>It would be good to see the same done for <a class="freelinking external" href="http://en.wikipedia.org/wiki/Ealing_Studios" rel="nofollow">Ealing Studios</a>.</p>
