    html: <p>Trying to do this “without much knowledge of calligraphy” is like trying to write a song without much knowledge of melody. I am a fan of enthusiasm and do not condemn you for trying, but I think it is imperative, if you wish for this to look very good, to spend more time gaining more knowledge of calligraphy and working with nibs. Why not? You’re bound to enjoy it, and it is the most fundamental step you could take to gain a better understanding of how to do what you’re trying to do.</p>
