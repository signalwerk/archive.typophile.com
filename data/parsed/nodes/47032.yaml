    I need critiqs. As you can see i’m not happy with “oho” i tried to make a ligature with it but didn’t liked it. I’m drawing this without much knowledge of calligraphy. I’m using the 45º degree scratch technique to draw and get the relation of the thin strokes with the strong ones.</p>
