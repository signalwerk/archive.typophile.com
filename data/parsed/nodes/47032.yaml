      <p>Joel,<br>
      You are well on your way.<br>
      The idea (presumably your belief) that you’ll somehow get it right once you’re working with beziers instead of ink and paper will disolve within an hour of working with beziers. You must understand what’s happening right in front of you (on paper) <em>and</em> you must understand bezier curves, which takes time, before the two will come together and work for you.<br>
      On critiquing: You’ve put up a rough for critique. I suggest you self critique until you feel like you’ve arrived at a finished product, and then turn it in for review. Learning to self critique forces you to be more honest with yourself as a designer. Waiting until you’ve concluded the design before seeking the review of your peers ups the risk of damage to your ego considerably, is more rewarding to us, and ultimately is more rewarding to you.</p>
