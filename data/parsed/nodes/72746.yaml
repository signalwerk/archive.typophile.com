    html: |-
      <p>A question for those who do Greek typesetting these days – I hope you find this thread:</p>
      <p>What's more popular, the "classical" or the "contemporary" ductus?<br>
      (Here are two examples by two of my favourite designers, Slimbach and Stötzner):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/greek_ductus_5030.png"></div><p></p>
      <p>I always hear that the Greek shouldn't "accomodate" the Latin, for it's a script in its own right – but I feel that the trend goes towards adapting the stroke axis commonly used for the Latin lowercase. So far I went with the "classical" style, but I'm wondering whether there are any opinions on that choice before I go on.</p>
      <p>Thanks!</p>
      <p>Sebastian</p>
    html_clean: |-
