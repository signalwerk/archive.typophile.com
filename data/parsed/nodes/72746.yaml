    html: |-
      <p>Thank you, Claus, for your help so far!</p>
      <p>I've been looking at whatever Greek prints I could find on Google Images (papers, magazines, books), and it seems to me that nowadays most text is set in sans-serifs, slabs and low-contrast fonts. Toss in a didone-ish headline here and there – but you don't see too much "traditional" Greek. Is that true or just my bad luck? I've read <a class="freelinking external" href="http://typophile.com/node/33869" rel="nofollow">this thread</a>, but I'm still not sure.</p>
      <p>I'm asking mainly because <a class="freelinking external" href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Haralambous/HHaralambous.pdf" rel="nofollow">Hector Haralambous</a> has offered to help out with Polytonic Greek and Cyrillic, and he suggested looking into more "contemporary" and "less calligraphic" Greek design. He has yet to send me an example of what he means by that, but my point is:</p>
      <p>- I don't know what Greek typographers want<br>
      - I don't know what Greek readers want<br>
      - I don't know what mathematicians want (a separate glyph set altogether?)<br>
      - I don't know what matches best with the Roman (is similarity desirable?)</p>
      <p>I've done some proofing – I don't have InDesign and its optical spacing unfortunately, but I will upload some improved PDFs soon. Right now, the letters look pretty much like in the last sample. </p>
      <p>Any thoughts?</p>
