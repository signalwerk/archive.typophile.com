    html: <p>By the way Sebastian, I think it would be a help if you set some sample text, then it's much easier to see what pokes out at your eye. You can use the optical spacing in InDesign in lieu of kerning. The thing is that you can easily kill a design by over-harmonizing it, it can become generic, and it's much easier to evaluate in a test simulation its intended usage. But I like where it's going.</p>
