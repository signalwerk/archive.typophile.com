    html: |-
      <p>Oh, I know, I know ... it sounds like I'm looking for <em>The Answer</em>. Really though, I was just hoping for some guidance. Anyone can look at serifed Latin letters and make their own ones. But it seems Greek typography is a hopeless mishmash of foreign creativity.</p>
      <p>Crimson is intended to be a traditional text typeface, and therefore the Greek should follow the "standard" of Greek book printing. If someone told me, <em>"80% of books you buy in Greece today look like Andron, and that's what people are used to"</em>, then I'll consider going with that pen angle. Similarly, if someone wrote <em>"stick with Slimbach's style, it looks best to Greek eyes. Screw Latinization!"</em>, then that helps too :)</p>
      <p>Or maybe the Greeks are used to seeing ten different letter styles and don't really give a damn as long as the page looks nice and even ...?</p>
