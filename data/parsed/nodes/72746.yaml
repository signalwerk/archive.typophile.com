  - id: 428495
    user: 16321
    date: 2010-09-06T14:50:00
    date_raw: 6 Sep 2010 — 2:50pm
    votes: null
    html: <p>If by 'contemporary' you mean using a stress-axis similar to antiqua for the greek, I say nay. It just looks wrong, just as the greek stress-axis applied to latin would look weird. Andron, I'm afraid, is an example of how <em>not</em> to do it. If you want to design a contemporary greek then think along other paths, other ideas that stays sympathetic to greek scribal tradition.</p>
