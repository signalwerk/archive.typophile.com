    html: <p>Well, you need to find out how greek penmanship is performed with your chosen ductus. The axis is not the same as in the latin script. Once you figured that out you start sketching. As it is now the axis of the lower-case letters are all over the place, they should be more uniform, as you would not write with such deviating axis from letter to letter. Well, and then there is a lot of other stuff, but first start over with the lower-case.</p>
