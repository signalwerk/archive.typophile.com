      <p>I'm noticing this trend that's been going on where the general public has started to discover that there's more to fonts than just finding them on the menu. That's ... good or bad, depending.</p>
      <p>What concerns me is the concept that Verdana could easily become labeled as a BAD FONT in all of this.</p>
      <p>Verdana is NOT a bad font. It is a font that is overexposed (which culturally tends to cause problems. Reference: Phil Collins, circa 1985) - but Verdana does have some wonderful Matthew Carter-esque details that makes it a beautiful type family.</p>
      <p>The font isn't bad. </p>
      <p>IKEA thinking it's a suitable replacement for their custom version of Futura.</p>
      <p>That's bad.</p>
