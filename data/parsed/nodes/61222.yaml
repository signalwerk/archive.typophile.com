      <p>Verdana and Georgia would be my sans-serif and serif fonts of choice if I was told I could only have one of each. So I'm delighted that Ascender is extending the family. However the semantics of "availability" are important based on distribution. If the extended family is a commercial release for a fee, which seems certain, it won't be fully available on the client/receiver side. Without EOT, @font-face, or some universal solution to distribution it won't have the impact that it should.</p>
