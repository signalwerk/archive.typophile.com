      <p>Ikea has reacted to the unexpected coverage of this in Time magazine and throughout social media:</p>
      <p><cite>We're surprised. But I think it's mainly experts who have expressed their views, people who are interested in fonts. I don't think the broad public is that interested. Verdana is a simple, cost-effective font which works well in all media and languages.—Camilla Meiby, Ikea spokesman (quoted by Associated Press)</cite></p>
      <p><cite>It’s sad that some people react negative. Still, we are very glad that people care so much. But what’s important is the message, not good looking fonts.—Ivana Hrdlickova, Ikea (quoted by Swedish Wire)</cite></p>
      <p>I really appreciate Ikea's intervention and their response. It shows an open mind and I really want to thank them for joining a conversation started by people who appreciate both their role in promoting design to masses, and design itself.</p>
      <p>However, there are certain aspects that I would argue about:</p>
      <ul>
      <li>Indeed, the broad public is not interested. Although this change in identity rather makes Ikea look unremarkable (in visual communication), similar to tens of thousands of businessed in the world who only use Arial, Times New Roman or Verdana. This will impact on the long run on the perception.</li>
      <li>Verdana does not work well in print. Ask any graphic designer that has basic typography knowledge. And it does not work well in all languages (it only has Latin, Cyrillic and Greek letterforms)</li>
      <li>It's not about good looking fonts. It's about design, which is more about functionality and solving a problem, than just pure aesthetics. Would you argue similarly about any of your products—that it has to work, no matter how it looks? I think this undermines the whole philosophy Ikea is built around.</li>
      </ul>
      <p>Ikea, you say you are glad that design/typography experts care about you. I think that's something few brands can brag about. This whole fuss is about nothing else than caring about your design strategy—a strategy that I (and other 3000+ fellow designers who signed the above mentioned petition) hope you will revise!</p>
      <p>Thank you!</p>
      <p>Marius Ursache<br>
      Chief Creative Officer<br>
      Grapefruit<br>
      <a href="http://www.grapefruit.ro" title="www.grapefruit.ro">www.grapefruit.ro</a></p>
