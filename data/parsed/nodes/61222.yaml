      <p>Excellent points Nick. Maybe all of the uproar will prompt IKEA to commission a project to expand the font, or create a custom solution. I would say maybe it will prompt Microsoft to do so, but then there's that reality vs. fantasy thing.</p>
      <p>As it is implemented, this seems to me to be a classic example of letting the form follow the function. Using Verdana is a highly functional and instant solution to their situation. Other than Helvetica I don't think there is another choice. </p>
      <p>As to the thought that of course IKEA has the money to commission a custom face, I'm sure they do but the people that make those decisions within the company don't sit around sipping coffee talking about what font they are going to use for promotional material and ads. In fact that begs the question, how much revenue will they potentially lose by using the low/no cost solution versus the added costs of an expensive custom font or the continued use of different fonts for multiple regions? Other than typophiles does anyone else notice or care?</p>
