      <p>It's quite true, IKEA Intersystems owns the IKEA Sans, Script and Serif fonts used throughout the company. The switch to Verdana was to save money - stores paid to use the IKEA fonts. This makes little sense to those of us who work in the design departments at IKEA. That we pay for our own font useage on a font we already own seems suspect. But IKEA does not always make sense when it comes to decision making in their retail outlets. Recently they changed uniform standards to the yellow shirt for every worker in the store except the cafeteria staff. This was to showcase a larger sales presence at a time when sales were slumping and they're cutting back the sales staff to less than 20 hours a week and eliminating middle management positions. Now we have designer co-workers who once wore inconspicuous white t-shirts as well as logistics and maintenance co-workers (who wore blue) in the iconic yellow polos. Mind you, not a single one of us is actually trained in sales, and these departments work on a regular schedule. So, for appearance sake, now during regular operating hours stores look full of sales workers, most of whom have to refer customers to "a person wearing yellow who works in sales."</p>
      <p>Add to that, the switch to Verdana has to cost the company millions of dollars - money better spent elsewhere (we're not getting bonuses this year). We have to re-print every single price tag, banner and rack label in each store. There are new letterheads and business cards for every manager to pay for. We aim to go green on a corporate level yet reams and reams of paper is required for the simplest of switches within a store. We have hundreds of stores!</p>
      <p>Then again, in my years at IKEA I have found it to be a very confusing company. On one hand, our store rakes in a quarter million dollars on weekdays. Double that on weekends. Yet there are more times than not that policies we hear about make it seem like the company is operating on a whim. Not to mention, every time we get a new country president we are mandated to make the aesthetic changes he or she deems are important - on a personal level, not based in sales. We make change and hope the sales follow.</p>
      <p>It's exhausting.</p>
