      <p>An international company catering to just Europe alone has to deal with over twenty different languages, many of which have their own specific character sets. If you take into account that you also have to support Russian and Greek, that alone rules out a lot of fonts you can choose from. </p>
      <p>The alternative is having to deal with different typefaces for different languages, but that is a pain and doesn't solve the real problem at hand. The fact is, there is a huge lack of fonts that support a large set of international character sets.</p>
      <p>So faced with similar problem I imagined Ikea had, I did some research into this not so long ago and came to the conclusion that Microsoft is the only one that consistantly supports all the different character sets in their fonts. Another plus is that they are also adapted to screen viewing. The only downside is that per typeface, they only provide four fonts: regular, italic, bold and bold italic.</p>
      <p>The most usuable typeface I found for Europe was Myriad Pro which does offer a wider range of weights. But if you have to deal with Arabic or Asian languages, you can also rule this one out.</p>
      <p>So if you want to go global and remain consistant everywhere, the Microsoft typefaces are the only viable choice at the moment. I can understand it is a mammoth undertaking, but I just wish they would affor a larger set of weights and that also the other foundries would follow suit.</p>
