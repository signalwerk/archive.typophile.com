      <p>Why is anyone upset about this quote:<br>
      <em>"But what’s important is the message, not good looking fonts."</em></p>
      <p>Isn't <em>message</em> the most important thing? Everything else is secondary. Concerning style, consistency is one of the most important things. This is especially true, as has been mentioned, when dealing with a global company that has to try to keep some kind of consistency across web and print in multiple languages.</p>
      <p>Sometime in 2008, all Ikea websites moved from various fonts (mostly Arial) to Verdana, probably in preparation for this print move. From that alone, the sites looks better, but I don't remember any TIME articles about that. So lighten up about this!</p>
      <p>I'm not in love with Verdana's numerals (especially the 1 and 9), but it's not as if it's so bad that it's distracting to me, and I think that's what it comes down to. Even if Verdana looks marginally worse than Futura in print, it's not so bad that I--much less the general public--will be distracted by it, or even notice it. Regardless of the font, the Ikea catalogs are well designed anyway. Even if <a class="freelinking external" href="http://www.flickr.com/photos/six_7_8/3854126727/in/set-72157622017139377/" rel="nofollow">this</a> doesn't say Ikea to us yet, that'll change with time.</p>
      <p>If Verdana really looks so bad at display sizes that it matters, then Ikea can simply commission a display cut for the different languages. I don't think it'll be necessary, but judging from what mstade said, this would make a lot more sense than the alternatives.</p>
      <p>Anyway, for anyone who has not seen a catalog, here is another side-by-side comparison, just make sure you have your seatbelt on and your soapbox nearby:<br>
      <a href="http://www.idsgn.org/posts/ikea-says-goodbye-to-futura/" title="http://www.idsgn.org/posts/ikea-says-goodbye-to-futura/">http://www.idsgn.org/posts/ikea-says-goodbye-to-futura/</a></p>
      <p>Here's a quote by macmcraeart on digg that pretty much sums it up for me:<br>
      <em>oh snap! they switched from plain to more plain... rage.</em></p>
      <p>When you go too far with form over function, I think you lose sight of some other important things: like how typophile forum looks great (my first post btw), but I hate that there's no "quote this/+quote" buttons, comment numbers to reference, or highlight-and-click html-tagging buttons. Also, seeing as how so many people here are on a first name basis, wouldn't it make sense to have our real names displayed just under our aliases? All things neglected so that the site can look cleaner?</p>
      <p>ryan</p>
      <p>OT tangent: why is "seatbelt" not a word in my spellchecker yet? It's not even listed as "seat-belt" yet in the MW dictionary. Keeping apart a pair of words that naturally belong together is such a shame. Damn those segregationist!</p>
