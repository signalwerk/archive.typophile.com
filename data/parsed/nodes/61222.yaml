      <p>It's worth pointing out, in the context of this wide-ranging discussion, that Matthew Carter and David Berlow <em>are</em> working on extending the Verdana (and Georgia) type family, under the auspices of Ascender Corp. Though not, so far, in the direction of specifically "display" versions. The new weights &amp; widths should, at least, give a little more flexibility to designers using these type families, whether at Ikea or anywhere else.</p>
      <p>By the way, I confess that I don't see any particular resemblance between Verdana and Frutiger. Or at least no more resemblance than you'd find between various old-style serif romans, or certain chancery italics.</p>
