      <p>Where did I say their chairs aren't designed? Anyway, I've seen giant spools being recycled/resold as tables, so what's to stop Ikea from selling boxes/crates/whatever as chairs/stools/benches/footrests? What makes something a chair? </p>
      <p>Back on topic: Jan, I think you're going way overboard on this slippery slope stuff. The spokesperson clearly didn't mean that aesthetics are not important at all, only that they're subordinate to the message. It's a balancing act of time/money vs quality/effectiveness. </p>
      <p>Aesthetics are always important to some degree when you're trying to sell a product--not just in the product, but in the message itself. But, Ikea clearly has priorities where other things matter before or along with aesthetics: price, flat-pack-ability, etc. But, nothing matters more than that you can get the message / sit on it.</p>
      <p>They've traded one flavor of bland for another flavor of bland so that they can cut costs and be consistent across different languages. Tell them to make a display cut, not cry foul and sign petitions like it's some crime against humanity after one catalog.</p>
      <p>-You're saying it's stupid to think Ikea can have a message without a pretty font since aesthetics is part of the overall message.<br>
