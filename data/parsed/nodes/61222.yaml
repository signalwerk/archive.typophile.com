      <p><cite>No so much as a display face.</cite></p>
      <p>That’s what made me think it had to be custom work. I just couldn’t imagine a serious catalog design employing a screen text face for printed display work. I really think that this is a nasty case of a business being cheap. Ikea is one of the world’s largest and most successful corporations; the only reason the founder’s family are not among the world’s wealthiest billionaires is that Sweden’s progressive taxation encouraged them to transfer ownership to a charity. For Ikea commissioning a complete international Futura family with optical styles would still be a drop in the bucket. For a company that constantly touts it’s own staff designers to go this route is pretty pathetic.</p>
