      <p>Incredible thread, so many good insights.</p>
      <p>I myself fall on the side that is more intrigued by the move. Undoubtedly, choosing Verdana is a "sign of the times," as it seems that it was very much dictated and necessitated by web technology. Where Futura had it's place in history to express geometric and streamlined modernity for the printing press, Verdana speaks to a whole different kind of "digital modernity."</p>
      <p>Instead of discounting the move as purely functional, I think it's time to reconsider Verdana as something that might work for Ikea because it's just what they need, regardless of not being designed for print, etc. I wonder: would people think it's as terrible if they didn't know where it came from?</p>
      <p>A little more in depth here: <a class="freelinking external" href="http://stuckinthebubble.blogspot.com/2009/08/ikea-maybe-its-time-to-rethink-verdana.html" rel="nofollow">Maybe it's time to rethink Verdana</a></p>
