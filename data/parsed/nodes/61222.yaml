      <p><em>It’s stupid (in general and apart from the Verdanagate discussion) because when you set text in a typeface the look of that typeface becomes part of the overall message.</em></p>
      <p>Yes of course a typeface is PART of the overall message, but what is important is the message. I think some people here think those things are on equal terms, or worse, instead of one thing contributing to the other. Also, I'm reading "message" as meaning more than just words on a page.</p>
      <p><em>For IKEA’s products the above statement would translate to:<br>
      What’s important is that you can sit on it, not what the chair looks like.</em></p>
      <p>Isn't that absolutely, positively, 100% perfect then? Clearly Ikea doesn't design purely superficial stuff you might find in a stuffy boutique or art dealer. They're not going to PURPOSEFULLY make ugly chairs, but the IMPORTANT thing is that you can sit on the chair, not what it looks like (honestly, a few of their chairs ARE damn ugly, and I think we're now into the endless form vs function debate). Ikea's products are designed to be semi-modular, practical, and affordable. They're rarely on the cutting edge. They've made a fortune selling bargain furniture that does its job and is "good enough", why would anyone be surprised that they're going with what the spokesperson described as a "more efficient and cost-effective" font?</p>
      <p>She did say they "are very glad that [us angry typographer] people care so much", so the only thing wrong with the quote that I see is that maybe she slipped and said "important" instead of "most important".</p>
      <p>ryan</p>
