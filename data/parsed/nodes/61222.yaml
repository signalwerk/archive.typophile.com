      <p>"down with fonts with little integrity"</p>
      <p>Verdana does an excellent job of working perfectly in the environment for which it was designed. It solves the design problem of readable text on screen quite well. In so doing, there had to be compromises made in the areas of print text and display. To me, therefore, it has great integrity. It does EXACTLY what it was asked to do. Think of it like Braille.  It works for those who are unsighted and know how to read it but is pretty lousy as a print text for the sighted non-Braille reader.</p>
      <p>ChrisL</p>
