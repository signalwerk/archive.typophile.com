      <p>&gt;Are you saying that @font-face is what will make the new Verdana and Georgia fully available?</p>
      <p>Well, those faces up to now have been available where MS wants them available, which seems to be the Mac and Windows. Ascender's license with MS makes them available to anyone willing to license them for 'normal' desktop distribution, and the latest efforts are intended to make them much more available for web serving. </p>
      <p>To clarify John Berry's statement slightly, the Verdana "Pro" versions e.g., (the current name of the new series), are not specifically made in the direction of “display” versions. However, the blacker and weightier condensed styles are being prepared somewhat independent of their appearance as text faces, which is different from the originals as far as I know. </p>
      <p>Cheers!</p>
