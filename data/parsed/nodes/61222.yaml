      <p>I use to work for a global online company. Any design and marketing materials we produce ended up using Arial/Verdana because of the same reasons. We had to produce in 12 languages under one universal template. </p>
      <p>I would guess that it's a very high up upper management decision to cut costs/time for the process and an easier way to follow up outsourced projects to other designers or local offices.</p>
      <p>I don't really care what font they use really... not sure why all the fuss and emotional attachment to this brand. To me IKEA is a huge commercial (less on the creative) practical entity.</p>
      <p>Verdana is widely seen and in our culture more than we like it to, overused and is in everyone's homes (internet browsers/OS system). So in spirit, Verdana is much like Ikea.</p>
