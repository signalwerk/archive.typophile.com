      <p>I took these pictures before I realized it was Verdana. And that Futura catalogue in the pictures was really one of the reasons I wanted to become a graphic designer.<br>
      <a class="freelinking external" href="http://www.flickr.com/photos/six_7_8/sets/72157622017139377/" rel="nofollow">Flickr Set</a></p>
      <p>I was a bit shocked a couple of weeks ago when I was looking at their catalogue but I just thought the local designer screwed up here in Toronto. It didn't even cross my mind that someone would advise the company to make a change like this.</p>
      <p>The "web" reason given for the change doesn't even hold. Go to their <a class="freelinking external" href="http://www.ikea.ca/" rel="nofollow">website</a> and look at how many times Verdana is used as an anti-alias image (doesn't it kill the whole purpose of using a web font?). But I don't blame the web designers because who in the world wants a dull html website that looks like 1995?</p>
      <p>The "consistency" reason given isn't working any better. I think we all agree the IKEA brand was pretty consistent at least up until the "change". But it is now during that transition that the inconsistency will occur. Graphic devices and headlines designed using IKEA Sans are still in use in print and on the web. Wasn't it the job of the design firm that suggested the "change" to redesign all these little logos?</p>
      <p>I feel this is almost unethical on the part of the design firm. I don't think they added any value with the changes they made. It wasn't even a rebranding; they obviously wanted to maintain the image of the company (I don't know how to describe it but it's basically the IKEA image). The layout of the catalogue is maintained (white backdrop for the most part, big black headlines, bold vs regular in the item descriptions and body text. So the only thing the design firm has done here is take one successful element out.</p>
      <p>Maybe an added value was the cost of design on the long term? And Nick you said "Price and Convenience have trumped Quality" but I was under the impression that they can distribute their proprietary font to their service providers at no cost. Or am I wrong? How is Verdana cheaper?</p>
