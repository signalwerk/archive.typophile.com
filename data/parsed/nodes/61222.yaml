      <p><em>Where is the outrage when someone uses Futura or Univers on the web or use any of the other fonts developed before screen displays?</em></p>
      <p>I've been "outraged" for years that Georgia doesn't have a display size for the web, and that Verdana doesn't have Light weights for the web. The readability of display size was something that was overlooked in the design of web technology, and yet that technology readily permits display size, with the type looking extremely horsey. Times is the best "web" face for display size, because the serifs have some sharpness.</p>
