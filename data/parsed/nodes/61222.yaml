      <p><em>...Microsoft is the only one that consistantly supports all the different character sets in their fonts.</em></p>
      <p>However, a number of foundries (not Adobe, Microsoft and Apple, which aren't foundries) have recently released "Euro" fonts that support Latin, Greek and Cyrillic encoding. My effort: The Modern Suite. Admittedly, foundry fonts are unlikely to be hinted for PC screens, but this is an aesthetic issue that may be compared against the print shortcomings of the "web" fonts.</p>
      <p>I don't think this is the real issue for Ikea, which seems to be that in the holy trinity of product criteria, Price and Convenience have trumped Quality. That's a legitimate decision for Ikea; I'm suggesting it may weaken the brand--not for reasons of typographic aesthetics per se; in that sense, "Quality" means the quality of being distinctive.</p>
