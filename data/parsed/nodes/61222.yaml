      <p><strong>DISCLAIMER: The following is my personal point of view on the situation and does not reflect the views of my employer or the views of any branch of IKEA, past, present or future. None of the following is to be considered factual.</strong></p>
      <p>Now that the cat's outta the bag so to speak. I've been working with IKEA for a while and learned about the switch to Verdana about a year ago. The reasons I heard internally were pretty much verbatim to those heard in the CAP&amp;Design article. Now, I'm not a designer, although I would like to think that I keep a keen eye on things beautiful.</p>
      <p>I am however, a software developer.</p>
      <p>I've worked on most of the dynamic content available on the IKEA website and am very well entrenched in the technical issues of localization. While the issue of type is readily apparent at first visual glance, there is more to it than meets the eye. First, you've got to realize that IKEA publishes content all over the world. In multiple alphabets. Producing said content with a consistent visual style is a daunting task, not only for the content producers but for us writing the tools they use as well. Now, disregarding the daunting nature of this task, even disregarding any of the visual aspects of the production such as tracking and kerning etc, there's one technical issue that always lingering about as a dark cloud on an otherwise pretty fair sky — file size.</p>
      <p>Fonts are expensive in terms of file size. Sure, your average font with the letters and numerals and some subset of special characters isn't all that bad. But slap on the chinese alphabet or the japanese alphabet and you're looking at pushing several hundred kb if not several mb down the tube. One can use a subset of the alphabet, it's after all highly unlikely that all glyphs are used at the same time, but you rack up the file size pretty quickly anyway. And if you do send specific glyphs down the tube, there's no intelligent caching to take care of already downloaded fonts so you'll be resending the same data over and over.</p>
      <p>It may not be that expensive for IKEA to license the rights to Futura (or IKEA Sans as their version was called), but bandwidth sure is. And it's a running cost. In the ubiquitous nature of the internet it is easily forgotten that serious bandwidth costs serious money. I don't have up-to-date figures, but I know the daily unique visitor count on IKEAs website globally is well into the millions. Daily. Yes, they have pretty advanced co-location caching solutions, but it's all very expensive stuff to keep running efficiently.</p>
      <p>You may ask:<br>
      - Ok, it's expensive to keep this running, but what about the user experience? Doesn't that count for something?</p>
      <p>Sure it does. In fact, it's even more important than the costs of running it all. In fact, that's why their pushing that serious amount of energy and money into running it. But when asking that question, you have to ask if the user experience on the web is purely visual? Well, it's not. Looking in a printed catalogue I understand you all, I even agree with most of you. But on the web we've had to come up with quite technically challenging solutions. Reconnecting with what I said previously, fonts costs in terms of file size. They are NOT cheap. And @font-face won't help much, you still have to push the font as any other digital resource. It's also notoriously difficult to cache fonts properly. This is a file type issue I'd presume. You simply can't stream selected glyphs and still have a usable font file, you need to dynamically create one. Anything dynamically created is impossible to cache because of it's dynamic nature. At one time, it's one set of glyphs, at another it's a different set. Coming back to the issue of user experience, file size and bandwidth determines load times. It's really that simple. We can't display what we need to display before we have all the resources to do so. We display as soon as possible and load as lazily as possible (when it's needed), but in order to keep the user interested we need to do serious optimizations to keep the loading times as small as possible. Even in low-bandwidth situations.</p>
      <p>So what to do?</p>
      <p>Well, we implemented a way of pushing IKEA Sans onto the client in countries where the alphabet was cheap. This includes most western countries. For other alphabets, such as cyrillic, greek, chinese or japanese, we defaulted back to verdana and only produced headings and other selected parts in IKEA Sans, pushing only those glyphs that were necessary to keep the filesize down. It worked well, we managed to keep the loading times as small as possible while still being able to at least come to some sort of decent compromise in visual quality on the web. But the difficulty of caching and the fact that the visual style was anything but consistent is what I think finally pushed IKEA to the switch. You or I may not agree with the decision, but looking at the sheer volume of visitors IKEA get — both in the stores and online — you realize that even a 1% drop due to load times or other look'n'feel issues is a huge loss of potential sales.</p>
      <p>Now, wether or not changing up the type face will cause those drops in visitors, I don't know. After all, I'm just a software developer.</p>
      <p>PS. While Bert Vanderveen is correct in that Swedish companies did trade with the Nazi regime, it does not mean that Sweden, swedes or even the companies that traded with the regime sympathized with the Nazis. In fact, Sweden always maintained a status of neutrality which means that Sweden neither supported nor abolished the regime. In hindsight, this may sometimes seem as a kind of support while in fact it's a condition of neutrality. The government couldn't disallow trade with the Nazis since it would effectively cancel the status of neutrality and place us as participants in the conflict. As you may or may not know, Sweden did not enter the conflict between Finland and Russia during that time for the very same reasons. Note that I'm not taking a stand here, just trying to convey a more fair image than portraying Swedes as nazis.</p>
      <p>For more information on Sweden during the second world war:<br>
      <a href="http://en.wikipedia.org/wiki/Sweden_during_World_War_II" title="http://en.wikipedia.org/wiki/Sweden_during_World_War_II">http://en.wikipedia.org/wiki/Sweden_during_World_War_II</a></p>
