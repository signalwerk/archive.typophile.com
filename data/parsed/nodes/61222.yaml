      <p>This whole debacle has been a fairly strange one. As the story went mainstream, it went from designers and techies largely agreeing with my points to non-designers hearing about the story and looking at it as a bottle of nerd rage in about three days. Currently waiting for the backlash against the backlash against the backlash to begin.</p>
      <p>--<br>
      Ernie Smith, Owner/Proprietor/Intern<br>
