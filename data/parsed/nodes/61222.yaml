    <p>It's true. </p>
    <p>IKEA abandons ~50 years of Futura and Century Schoolbook for … Verdana.<br>
    In an interview with swedish design magazine CAP&amp;DESIGN the reason for the change is to be able to use the same font i all countries, including asian countries. Also they want to be able to give the same visual impression both in print and the web. </p>
    <p>For me it's a sad day.<br>
    What are your thoughts on this matter?</p>
  html_clean: |-
