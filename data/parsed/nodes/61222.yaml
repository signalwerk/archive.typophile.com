      <p>Re: mehallo</p>
      <p>Thanks for noticing the post. However, I guess I should clarify, as it seems that some of the arguments may have been taken literally.</p>
      <p>My thinking on the headline (which admittedly was a bit hyperbolic to make a point) is sort of rooted in this line from the article: "It looks like the font blew out when the catalogs were being printed." I guess that's where I started from with that.</p>
      <p>My point was that the font is so overused, that it's a given – it's almost as if it's not even there. I wasn't literally trying to say that it wasn't a font. I thought that should have been clear from the props I gave Matthew Carter in the post. Alas.</p>
      <p>And regarding the CSS: Someone posted the question to me at Hacker News, and my response was (jokingly) that it's for computers that only have one font.</p>
      <p>This whole debacle has been a fairly strange one. As the story went mainstream, it went from designers and techies largely agreeing with my points to non-designers hearing about the story and looking at it as a bottle of nerd rage in about three days. Currently waiting for the backlash against the backlash against the backlash to begin.</p>
      <p>--<br>
      Ernie Smith, Owner/Proprietor/Intern<br>
      <a class="freelinking external" href="http://shortformblog.com/" rel="nofollow">http://shortformblog.com/</a></p>
