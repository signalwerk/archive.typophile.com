    html: |-
      <p><cite>But can we be critical of a company wanting to save money, and pass on those savings to their customers?</cite></p>
      <p>There’s a difference between financial pragmatism and just being cheap. The value of the Ikea brand has got to be tremendous, and they’ve spent decades and billions of dollars getting there. Changing to Verdana has given Ikea’s catalogs a very different feel—Verdana at large sizes simply does not have the warmth and cheer of Futura, a reaction that seems important in selling furniture to young people with tight budgets. I would argue that making such a dramatic change to the visual identity of such a valuable brand has potential costs that are much higher than the cost of extending Futura to cover more languages. If Ikea has to do one big ad campaign in the US and Europe to reinforce the new identity they might spend more than they would have to extend Futura.</p>
