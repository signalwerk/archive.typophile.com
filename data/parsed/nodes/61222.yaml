      <p>There was an enjoyable radio programme called Aristoteleen kantapää on the Finnish YLE Radio 1 yesterday, where typography in general and its importance for reading was discussed and the local typography guru, designer, teacher and writer Markus Itkonen interviewed. It was part of a long running series that concentrates on Finnish language and its uses, phrases etc. Since the subject was introduced with the IKEA case, my guess is that typography got this rare mention because of the fuss. The presenter talked about Verdana and Futura, their history and designers, why Verdana is called Verdana etc before moving to more general approach, including a brief history of type and the difference between serif and sans.</p>
