      <p>Reducing costs is a returning argument in the choice for Verdana. But it should be obvious to anyone who has a basic grasp on how typography works that this is a blatant misunderstanding.</p>
      <p>A simple test shows that Verdana is not only inadequate for print, has questionable readbility off-line, but it also runs very uneconomically. It takes at least 10-20% extra space compared to its predecessor Futura.</p>
