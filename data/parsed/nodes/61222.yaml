      <p>Ravel asked, <em>“Why do you think this is subversive? It is subversive for people who understand typography, and who will discuss it; end-user, customer will hardly even notice. For most of end-users it is just letters.”</em></p>
      <p>Customers not noticing or caring while designers are all in a twitter is exactly why I think it’s subversive. It’s just like when a client demands the use of Times New Roman and you use Palatino and they never notice, but love your work.</p>
      <p>I’m very amused by this uproar. I’m speculating that most of the people in a twittfit would have never noticed it was Verdana being used if it weren’t pointed out to them. Yet they are voicing strong opinions. (I’m excluding the well versed old-schoolers like Nick and Chris who I firmly believe have a good grasp of their reasoning beyond it merely being a screen font, and probably don’t twitter either.)</p>
      <p>For me there is great irony here. Simon has this one pegged. When the print font is used on the web no one bats an eye. Where is the outrage when someone uses Futura or Univers on the web or use any of the other fonts developed before screen displays? They weren’t intended for use on a screen. And then how many other text fonts have been used as a display face in recent history with no one caring?</p>
      <p>Yes IKEA could’ve and should’ve used another face. But I’m glad they made this move to provide me hours of entertainment.</p>
