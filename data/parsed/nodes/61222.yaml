      <p>&gt; If the extended family is a commercial release for a fee, [...], it won’t be fully available on the client/receiver side. </p>
      <p>I think I hear what you're saying, but on the other 'extreme', if a font has a fee, it does not prevent the font from being 'fully available on the client/receiver side' for web use. </p>
      <p>&gt;Without EOT, @font-face, or some universal solution to distribution it won’t have the impact that it should.</p>
      <p>@font-face is the current most advanced universal solution to provide font fidelity for web design and web use, but I think it is intended for the opposite of distribution unless you mean distribution of processing. </p>
      <p>&gt;I don’t want to pre-empt what the parties have in mind</p>
      <p>Me neither.</p>
      <p>&gt;if you look at the Web fonts, or more recently the ClearType collection fonts...[it takes] a very long time to get to the installed base you’d need to be “Web/IKEA safe...” </p>
      <p>The model of putting the fonts on every personal computer, if not dying, is leaving either horizontally or vertically. </p>
      <p>Those CT fonts wouldn't work for IKEA or most other mega media companies, though I encourage you to try. They are not agates, they look very particular at large sizes and are not easy matches, size-independantly, with the limited number of Asian fonts that are also "web safe".</p>
      <p>And, I would call choosing Verdana for all corporate communications IKEAcheap/Web safe, an important difference, just to be word safe. ;) The only thing IKEA could be missing is serving, but they are not able to count entirely on installed fonts either, Are they?</p>
      <p>&gt; ...even if you give stuff away for free.</p>
      <p>...that's a dying model, isn't it? The new model is to 'serve' fonts 'for free.' </p>
      <p>Cheers!</p>
