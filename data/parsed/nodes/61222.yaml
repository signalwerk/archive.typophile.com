      <p>Well, I am just not moved by this at all! Futura out of the CD? Oh no! Really, it is going to be OK, isn't it? IKEA had been using Futura since the 1940s. As far as I'm concerned, that is actually a good reason to switch to a different typeface. Maybe the big, globally-successful IKEA wanted to differentiate themselves from other ginormous entities that use Futura. Honestly, what does the company have in common with e.g., Volkswagon, other than the same typeface? Maybe a different typeface than Verdana would have been a better choice, but they can fix that later if they want. They've made a huge first step by breaking with their past. Somehow, I doubt that they'll stick with Verdana for 60 years.</p>
      <p>Also, Matthew Carter is just a better designer than Paul Renner was ;-)<br>
      I know which team that I'd rather root for.</p>
