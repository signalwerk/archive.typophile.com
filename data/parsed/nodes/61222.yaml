      <p>James: <cite>… the only reason the founder’s family are not among the world’s wealthiest billionaires is that Sweden’s progressive taxation encouraged them to transfer ownership to a charity.</cite></p>
      <p>The founder has moved to Switserland years ago, to one of these cantons where taxation is based on the value of your house and not on your income. Plus the brand has been put into a separate company that is also based in the land of chocolate and friendly bankers. The individual branches of IKEA have to pay for the use of the brand, which is just an inventive way to skim profits.</p>
      <p>Mr IK has some other quirks: he was quite enamored by Hitler and Nazism, but that is not unique amongst Swedes. As a country Sweden profited immensely from trafficking in WW2 and trading natural resources and industrial products with the Nazi-regime.</p>
      <p>And then there is the policy of this company that chokes suppliers for the lowest possible prices and everything that results from that: pseudo-slavery, exploitation of natural resources in ecologically weak environments, etcetera.</p>
      <p>NOT a nice company. Too bad that they are giving Verdana a bad rep.<br>
      . . .<br>
      Bert Vanderveen BNO</p>
