      <p>&gt;Really ’cause I see it as a competitive design with Lucida.</p>
      <p>I think you're one generation off. Although Lucida existed (and was bundled with various Microsoft products) well before Verdana was created, I don't think anyone was using it as a UI font. Verdana was conceived as a UI font, and with bitmaps created first (before having the outlines wrapper around them and then hinted to produce the desired bitmap patterns) it owes more to say Chicago, than Lucida. In fact at ATypI I showed some of the preliminary Verdana bitmaps which were very Chicago-like.  </p>
      <p>For those getting hung up on the “it’s a web font” complaint, I really think you should get out more. There’s a whole world beyond the computer screen! Do you complain when you see Frutiger used in print “That’s an airport signage font!” or Gotham used on a sign, “that’s a magazine font!”? ;-)</p>
