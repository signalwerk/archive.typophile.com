    html: "<p>&gt; the intemperate tone of my post <br> <br>William you say your friend's information confirms Williams' view that \"when writing follows [the storytelling] model, it is most direct and easily understandable. When it departs further and further it becomes harder and harder to understand,\" <br>And in the preamble to the material in your first link Kenneth Mahrer quotes Williams as saying: \"Do not take what we offer here as draconian rules of composition, but rather as diagnostic principles of interpretation\" <br>I can more easily acknowledge the accuracy--and appreciate the relativity--of 'diagnostic' statements like your \"when writing follows\" statement than I can absolute judgments with good and bad as their terms of reference.  <br> <br>If a story-telling model of human understanding is 'the best', what does this mean for thetic-critical discourse? Does it mean thetic-critical discourse must be avoided or recast according to a storytelling (character+actions) model? And is this always possible? <br> <br>Yes, Raph's questions are good questions. I suspect each of the three of us--Kevin, Hrant and I--have a different take on questions of spacing. I'll try to articulate my take in a future post. The seeds of a reply appear near the end of my essay. <br> <br>And William, time (and further exploration or discussion) will tell if my contribution uses language or articulates a point of view that is needlessly complex.</p>"
