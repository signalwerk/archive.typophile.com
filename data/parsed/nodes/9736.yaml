    html: <p>Before Forrest started this particular Typophile Forum, Kevin, Hrant and I discussed the possibility of a Typophile Forum on Typo 13. I was eager to see this happen, and one of the reasons was that I was eager to hear how William might respond to my contentions. I had come to understand that William had a philosophy of science background, was familiar with Hrant's contributions to the subject and had read Kevin's paper. I felt my contribution could move the discussion forward. I hoped that William could help sort through some of the misfiring in communication that the subject matter of the issue seems to attract and that he could help keep attention focused on what needs to happen to resolve the differences in interpretation. <br> <br>In my Typo text I tried to articulate my perceptions as clearly as I could, given the Hrant (bouma), Kevin (parallel letter recognition model of word recognition), varied empirical studies context and I resorted to continental-philosophy-style rhetorical devices to do this. I don't fault Parmenides, Martin Heidegger and others like them for bending the resources of the language to convey what they believed needed to be brought across. They did what they thought needed doing. Reading them with the expectation of learning from them, or gauging the merit of what they have to contribute, implies a willingness to give them the benefit of the doubt, also in matters of expository style.  <br>	To the extent that the writer of a text has a responsibility toward the reader, the reader, who wishes to make sense of a particular text, has a responsibility toward the text. And that responsibility is to take the text on its own terms and become equal to the challenges it places before the him or her. Not everyone will want to make this effort. Many will rely on the judgment of others. If the reader thinks the same thing can be said in more expositorially 'correct' ways, without loss of information and reach, than he or she should make the effort.  <br>	I am not averse to pursuing such a challenge, or at least exploring, with others, the possibilities of restatement. But I do hope William will feel inclined to address specific claims.</p>
