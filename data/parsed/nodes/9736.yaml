      <p>While I think a lot of this is quite in line with my own stance. :-)  Things like “discard at least 75% of visual information” is exactly the type of thing I put forth. That said, it’s important to try to separate the issue of readability into chunks which are manageable and of course pertinent to the people at hand... like type designers. For example, “non-visual information” is great, but it’s peripheral to type design.</p>
      <p>And to yet again correct John’s stance at the beginning of this new year :-) I would remind everybody that no matter how minor an improvement is, it can be relevant to some people some of the time. Type design as a whole is (almost) never of critical importance anyway, so saying “it doesn’t matter” is self-defeating. The amount of effort that John for example -rightly- puts into the details of his designs is not of greater relevance than things like lateral masking, the positive role of serifs, etc.</p>
