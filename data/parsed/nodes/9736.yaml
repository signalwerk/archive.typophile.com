    html: "<p>Nice post Raph! To rich for me to respond to directly now. <br> <br>William, I did not say 'defensible in advance,' but as you quote, 'defensible in cognitive scientific terms.' This is roughly equivalent with: making it 'consistent with known facts'. 'Making' might be the wrong word. We need to articulate a testable position in dialogue with oestensibly sustainable friendly, and oestensibly sustainable hostile, interpretations of qualified evidence. (Facts are, basically, sustainable interpretations of qualified evidence.) But sometimes resolving a conflict in interpretations is beyond the reach of testing, and other evaluative protocols must be recruited. And this other has to be included in a concept of 'defensible in cognitive-scientific terms'.</p>"
