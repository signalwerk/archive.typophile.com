    html: <p>&gt;Is it the boundaries of the chunk of text we're perceiving right now? <br> <br>Yes, but as map not territory. <br>I agree with Peter that the PL model is too reprsentational.  <br> <br>That's why I'm suggesting that a bouma is a flexible, heuristic concept created by the reader (not a word or letter shape; it might even be used to read alliteration or capitalization of proper names). <br> <br>I've also noticed that people's ideas are evolving towards a more flexible "primitive", with Kevin and Peter considering sub-character significance, and Hrant likewise moving down in scale. So why not call our "primitive" a bouma? <br> <br>But I suggest that the primitive is not the basic building block, but a variable construct. After all, there are such things as single-letter words.</p>
