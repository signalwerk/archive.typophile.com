      <p>Readability depends a lot on many factors other than the typeface, it’s even more difficult to get someone to do a good typesetting than to usea good typeface.</p>
      <p>From what I have learned now on the topic I can tell that legibility is a thing that depends more on the reader (interest, habilities and previous knowledge), the syntactic structure of the text and the page layout than on the typeface itself.</p>
      <p>Of course that the typeface would have a role to do in helping legibility by setting a good text rythm and color, and giving good character form definitions but being these factors covered I would think that a typeface would help legibility more by augmenting the reader empathy and interest for the text by the stilistic contextualization of it.</p>
      <p>There is still a room for improvement in the performance of a typeface to aid legibility but also I think that it is not that much in normal printing conditions... </p>
