    html: "<p>Nick sees Kevin, Hrant and I 'evolving towards a more flexible primitive' and suggests we think of the primitive as a variable construct. <br>\tMeanwhile, in response to my \"the primitive used is different for different tasks,\" Hrant, wants to say 'it can be different *within* a task too.'  <br>\tA variable construct: definitely. Perhaps we could say the relevant primitive is different for different sub-routines within the different tasks. But the primitive that matters most for the acquired skill of reading an alphabetic separated script, once familiarity with letters is in place, is the visual wordform / multi-letter bounded map.  <br> <br> <br>William, your post appeared as I was formulating the above. You have done a splendid job of presenting my chief claims in a nutshell, and I thank you for putting out the effort. The trouble comes in making such a view defensible in cognitive-scientific terms. And the pressure I felt to begin doing that in the face of a 'hostile' consensus resulted in a thick text. (I hope no one objects to my use of the word 'hostile' here. The prevailing consensus is unfriendly to a position like mine and probably Hrant's, but many of the individuals that hold versions of the prevailing view, like Kevin for instance, are perfectly open to entertaining mine or Hrant's, provided it can be made to seem compelling in cognitive-scientifc terms. I gladly grant them that!) <br>\tYour comments about method echo and amplify matters of testing Kevin and I (and perhaps Hrant and Kevin also) discussed when we met in Thessaloniki. Our hope was to pursue this further, and I hope it will come to that.  <br>\tAs to your contribution to this, I for one embrace the notion of a methodological monitor and a grammatical coach, but I promise you, I will not let go of some of my terms easily.</p>"
