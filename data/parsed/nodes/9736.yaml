    votes: null
    html: "<p>A good place to start in thinking about the 'jumbled word effect' is here: <a href=\"http://www.cs.umd.edu/~shankar/cwhitney/Papers/TICS.pdf\" target=\"_blank\">http://www.cs.umd.edu/~shankar/cwhitney/Papers/TICS.pdf</a> <br>You might also want to check this out (it's more recent and I haven't done more than skim it): <a href=\"http://www.up.univ-mrs.fr/wlpc/pagesperso/grainger/pubpdf/Carreiras&amp;Grainger04.pdf\" target=\"_blank\">http://www.up.univ-mrs.fr/wlpc/pagesperso/grainger/pubpdf/Carreiras&amp;Grainger04.pdf</a> <br>A long version of  Whitney, et. al.'s coding scheme is here: <a href=\"http://www.cs.umd.edu/~shankar/cwhitney/Papers/PBR.pdf\" target=\"_blank\">http://www.cs.umd.edu/~shankar/cwhitney/Papers/PBR.pdf</a> <br> <br>Before going too far in providing an explanation I'd want to see how scrambling inner letters affects reading speed, and I'd want to see a saccade / fixation / retrograde saccade plot. <br> <br>William is right: The visual wordform resolution part of my story is not the whole story. It applies to orthographically regular versions of words for which visual wordform pathways have been consolidated. <br>In the case of jumbled words, I'd explore the possibility that, when a jumbled word is first encountered, a letterwise (or familiar bi-gram / tri-gram wise) assembly operation kicks into gear. That is, a perceptual processing routine analogous to those we use when learning to read or encounter an unfamiliar word kicks into gear. Perhaps once the reader's 'readingware' is on to the conceit, the assembly operation becomes more automatic.</p>"
    html_clean: "<p>A good place to start in thinking about the 'jumbled word effect' is here: <a href=\"http://www.cs.umd.edu/~shankar/cwhitney/Papers/TICS.pdf\" target=\"_blank\" class=\"link-external\">http://www.cs.umd.edu/~shankar/cwhitney/Papers/TICS.pdf</a> <br>You might also want to check this out (it's more recent and I haven't done more than skim it): <a href=\"http://www.up.univ-mrs.fr/wlpc/pagesperso/grainger/pubpdf/Carreiras&amp;Grainger04.pdf\" target=\"_blank\" class=\"link-external\">http://www.up.univ-mrs.fr/wlpc/pagesperso/grainger/pubpdf/Carreiras&amp;Grainger04.pdf</a> <br>A long version of  Whitney, et. al.'s coding scheme is here: <a href=\"http://www.cs.umd.edu/~shankar/cwhitney/Papers/PBR.pdf\" target=\"_blank\" class=\"link-external\">http://www.cs.umd.edu/~shankar/cwhitney/Papers/PBR.pdf</a> <br> <br>Before going too far in providing an explanation I'd want to see how scrambling inner letters affects reading speed, and I'd want to see a saccade / fixation / retrograde saccade plot. <br> <br>William is right: The visual wordform resolution part of my story is not the whole story. It applies to orthographically regular versions of words for which visual wordform pathways have been consolidated. <br>In the case of jumbled words, I'd explore the possibility that, when a jumbled word is first encountered, a letterwise (or familiar bi-gram / tri-gram wise) assembly operation kicks into gear. That is, a perceptual processing routine analogous to those we use when learning to read or encounter an unfamiliar word kicks into gear. Perhaps once the reader's 'readingware' is on to the conceit, the assembly operation becomes more automatic.</p>"
