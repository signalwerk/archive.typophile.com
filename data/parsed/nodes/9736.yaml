    html: <p>&gt;poor ignorants that are enough dumb to have other opinions than your masters  <br> <br>Guillaume, I get the feeling that whenever I contadict the views of your masters you cry 'arrogance'!  <br> <br>I have never met Williams, and he is only my master in that I have read his book and try to follow it. I do know that there is a long effort of research, writing and teaching on clear writing. I think that the arrogance is not on my part in recognizing their contribution and making an effort to learn from it.  <br> <br>I am extremely critical of those who ignore what seems to me well estabilished knowledge, confirmed by contemporary research, on what makes for good writing. Not least because it disrespects the reader and smacks of trying to do a 'snow job' on him or her. To me that is an arrogant style.   <br> <br>The examples that I quoted from Williams and Fowler are simple in order to communicate the principles clearly. If you stack up 'useless nominalizations,' unclear technical terms, useless qualifiers, double negatives, passive voice, run-on sentences, then you get needlessly difficult writing, such as in Peter's essay. Kevin and Hrant were writing about the same complex matters, but with clearer writing. (The quality of their arguments is another question.)  <br> <br>In my view, the obscurity of Parmenides and Heidigger are signs of problems in their ideas, not because what they have to say has to be said that way. But this is another story. Here we are in my opinion dealing not with philosophy, but with testable scientific research. State the theory clearly enough to test it, and then do the tests. That will make for progress.</p>
