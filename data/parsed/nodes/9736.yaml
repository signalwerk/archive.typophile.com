    html: "<p>&gt; useful and useless <br> <br>The fatal flaw in this -which I see paralleled in the blind lust for totally pinning down reading among some people- is that different people find different things \"useful\". Peter's writing is not useless simply because it's difficult. Not everything that needs to be said can be said succinctly. Look at the most compelling examples of world literature - much of it would be gobbledygook by this standard. But it's not - humans love it, cherish it, <i>benefit</i> from it. You might say this is a technical subject that can't have a useful \"existentialim\". I would counter that this stance is cozy escapism, that everything a human can and does talk about has all the dimensions in it to some extent. There is a place in this dialog for all kinds of methods of expression, far beyond what can supposedly be \"expositioned\" in labs, <i>especially</i> since we're currently unable -and I feel will be unable for the forseeable future- to fully understand reading. You don't marry somebody you fully know. <br> <br>BTW, I think you misunderstood Yves (unless I have). But of him I would ask: Et que doit on faire au sujet des choses qui ne se con</p>"
