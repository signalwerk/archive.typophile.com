    html: "<p>It might be next Monday or even Tuesday by the time I catch up with everything in this thread, but the following I'd like to quickly address: <br> <br>&gt; readers use information up to 15 letters from the point of fixation <br> <br>Well of course. But not <i>individual letter</i> information. And if we can use word boundary information, and partial letter information, maybe we can use more -really, as much as possible- information too, such a letter clusters (that are sufficiently frequent and distinctive, and relative to how clear/blurry they are)? Can't you slowly start seeing the missing piece of the puzzle? It makes <i>everything</i> we think we know and we know we believe fall into place. <br> <br>&gt; The further away a letter is from the center <br>&gt; of fixation the less information is gathered.  <br> <br>And the larger boumas get! <br> <br>-- <br> <br>BTW, the other day I corrected and expanded the \"bouma\" Wikipedia entry a bit. <br> <br>hhp</p>"
