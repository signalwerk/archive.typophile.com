    html: <p>Kevin, is the time data that motivates your 'funny claim' from lexical decision tests or fixation-time readings (in sustained reading of continuous texts by competent readers)? If they are from the former I suspect they are less relevant than you might think, to issues of perceptual processing in sustained reading of continuous text using competent readers. If they are the latter, I will need to see if my model as it stands can accommodate them. <br> <br>I do not doubt that what you say is relevant to real or laboratory-simulated lexical decision tasks; and I also hold that lexical decision is relevant in continuous reading when the automatic processing that normally subtends it is interrupted, but I do not hold that each visual wordform resolutional event involves a lexical decisional act. I propose that a saccade is executed when visual wordform resolution happens, not when a lexical decision is made. A sense of the unfolding of sense while reading (and a sense of connectedness with what is being said) happens--and this is the real mystery--without the aid of multiple discrete lexical-decisional mental acts, or so I think. <br> <br>I hold visual wordform resolutional events are the crux of learning to read, and the engine underlying continuous reading of larger texts.</p>
