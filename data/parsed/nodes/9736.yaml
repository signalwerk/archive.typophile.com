      <p>I’m not sure if I’m doing right in contributing to this trhead with my post but I think that altough I’m no expert on the topic, I can provide a view that may help to elucidate the problem. This is the view of Frank Smith’s “A Psycholinguistic Analisys of Reading and Learning to Read” (I acutally read the Spanish translation).</p>
      <p>I read the three articles this afternoon as part of the research I’m doing for my own thesis and so I decided to jump in.  </p>
      <p>Frank starts stating that the reading hability is not different from mundane perceptual activities such as discerning tables from chairs and that there is nothing in reading (speaking of language) out of the competence of anyone who has the hability to understang spoken language.</p>
      <p>His main statement is that reading is not about deciphering or extracting sounds or words out of the text but about giving it a sense (reading is a perceptual activity and a function of perception is to give sense to the information our senses report to the brain and to guide them in the sake of such).</p>
      <p>He distinguishes two kinds of information used during the reading process: </p>
      <p>* Visual Information, which is the images the brain recieves from the printed matter. Visual information is indispensable but not enough to read a text.</p>
      <p>* Non Visual Information, which is the information the reader already knows. Non visual information can be of many kinds but some very important kinds of non visual information for reading are the knowledge of the language(ortographic -such as factible letter combinations-, syntactic and semantic as well), the knowledge of the topic, the knowledge of how to read, the knowledge of the graphic organization of a given kind of text, etc. But even the knowledge of a certaing literary style will help.</p>
      <p>He proposes that for reading non visual information is more important than visual information and that the more non visual information we have the least visual information we need to read a text.</p>
      <p>He explains that there is a severe bottle neck on the amount of visual information that the brain can recieve and process so what we really do when reading a text is to discard at least 75% of visual information and use our perceptive skills to predict and confirm the meaning of the text trough the reduction of uncertainty by the redundancy of the information contained in our brains (non visual).</p>
      <p>So the main hability behind reading is to reduce the dependency on visual information by the elimination of choices trough redundancy of the non visual information.</p>
      <p>Perception, memory and sense are the key concepts in Frank’s view of reading because they determine the low capacity of the brain to process visual information and the high capacity of the brain to deal with meaningful information.</p>
      <p>Reading must be oriented to the discovery of meaning and not the decyphering of sounds or words because only meaningful information stays in memory to feed perception and to relate with our cognoscitive structure (already owned knowledge).</p>
      <p>So this brings us to the medular topic of this thread:</p>
      <p>¿Are we reading letter by letter, word by word or phrase by phrase?</p>
      <p>The answer would be that we are reading the meaning of the text and to achieve so we would read at the nevel we need on any given moment to reduce our uncertainty of such meaning: words, letters, phrases, punctuation... even a single letter stroke, or a couple of letters, a white space between letters or the blurry shape of a word could help us to define our understanding of the meaning of a text.</p>
      <p>The method proposed by Frank Smith to do such a thing is “feature identification” (hope I translated it right -análisis de rasgos-) which would only look for a given feature or a set of given features on an item to identify it (as a way to reduce the uncertainty along with the non visual information and the prediction of what could this item be).</p>
      <p>Reading in other ways (on a pure letter, word or phonic level) would slow down our reading hability by saturating our short term memory with meaningless (unrelated) information. This is why meaningless or random text can’t be read fast, there is no way to predict or understand it.</p>
      <p>So this is in a gross and unsophisticated review of the of Frank Smith’s theories on the reading process. I’m willing to clarify the topic with details of the author’s text and arguments if requested. Hope this doesn’t come out of place and that can be useful to the discussion.</p>
