    html: "<p><i>I think the effect of lateral interference in a parafoveal presentation of a word is such that Kevin's partial letter information can't be meaningfully resolved and fed forward.</i> <br> <br>I suspect this is right. I've spent time trying to maintain fixation and develop a conscious impression of what the parafovea <i>looks like</i> (this is harder than it sounds: when presented with text, the brain keeps wanting the eye to jump!) One thing I've noticed is that the loss of focus in the parafovea does not appear to be linearly progressive as in Hrant's blurred illustrations, but then it struck me that this may be due to lateral masking making some letter sequences more difficult to see than others, giving the impression of areas of greater or lesser loss of focus within the parafovea. I also don't discount the possibility that this experience of the parafovea is not primarily optical at all, but that what register as greater or lesser areas of focus are actually the result of my brain being more or less sure of the identity of individual letters in the parafovea. Now I have a headache and my eyes hurt <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
