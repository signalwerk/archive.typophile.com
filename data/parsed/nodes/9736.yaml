    html: "<p>I've read all three articles, or rather did my first run- through.  <br> <br>Forrest wrote: \"His language is occasionally arcane\" in regards to Peter Enneson's article. I found it rather dense, and strewn with vocabulary that will deter many.  I much prefer Kevin Larson's clear, expository style among the three. I was hoping to refer working, less-academically inclined, designers to the issue, but now I've got serious reservations. I'm not looking for a predigested or dumbed-down version, but in all fairness, a less erudite and more straightforward discussion by Enneson would help draw attention to the substantive issues here.</p>"
