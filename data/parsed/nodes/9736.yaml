  - id: 62104
    user: 6083
    date: 2005-03-28T12:14:00
    date_raw: 28.Mar.2005 12.14pm
    votes: null
    html: "<p>Here is what I think we could work toward in this forum: <br>1) resolution of the key issues / a convergence of perspectives; <br>2) a broadly accessible articulation of the resulting perspective; <br>3) exploration of impacts for font generation / typography <br>Are there opportunities for a convergence of perspectives? <br> <br>Building on elements from the discussion so far and bringing in some new terms, can a scenario such as this be of use: <br>Let us say 'n' is a fixated word, and 'n+1' is a subsequent word in a line of text accessible to parafoveal view.  <br>1) Using 'ensemble statistics'* drawn from parafoveal pre-processing of n+1 material, magnocellular processing mechanisms** within the visual cortex narrow the visual wordform candidate field. The narrowing process sets up an activation candidacy set.  <br>2) A saccade to a criterial area inside the bouma, or word, narrows the field to one and sparks a visual wordform resolutional event. Or to say the same thing differently, a representative sampling of local statistics will close the visual wordform resolutional loop.  <br>3) We connect to the distal (space-delimited) stimulus complex--the word. It appears to us as object-like, familiar, sense-invested, and sharply defined or fully articulated inside and out (even beyond the normal 'range of high acuity' span). <br> <br>The interesting testing question might be, how narrow or broad is the typical fuzzy equivalence class parafoveal previewing brings forward.  <br> <br>* see: \"Seeing the forest but not the trees\"  <br><a href=\"http://visionlab.harvard.edu/Members/Patrick/PDF.files/2001pdfs/seeing.pdf\" target=\"_blank\">http://visionlab.harvard.edu/Members/Patrick/PDF.files/2001pdfs/seeing.pdf</a> <br> <br>** see: \"Microgenesis, immediate experience and visual processes in reading\" by Victor Rosenthal <br><a href=\"http://cogprints.org/2489/01/MicroRead.pdf\" target=\"_blank\">http://cogprints.org/2489/01/MicroRead.pdf</a> <br>[page 10 &amp;11] <br> <br>ad 1): A) We don't know precisely what the ensemble statistics are. Presumably the members of a fuzzy equivalency set have identical or comparable ensemble statistics. Changing one iota--changing any role-architectural particular--alters, we must assume, the ensemble statistics, reconfiguring, however slightly, the fuzzy equivalency set. This could account for the boundary study results. B) Magnocellular processes narrow the field by by alerting neural pathways joining members of a fuzzy equivalency class. C) In the fuzzy equivalency set are objects whose phonological, orthographic and sense*** profiles differ. Call them P O &amp; S profiles for short. These factor into saccade planning. But in continuous reading of familiar words they do so by proxy and without representation. Part of learning to read is learning where to land--where, given a particular set of ensemble statistics / fuzzy equivalence set / candidacy set + their attendant P O &amp; S profiles, to touch down. Saccade-target learning is an intelligent heuristically-driven enterprise. Because P O &amp; S profiles play a role in learning the optimal viewing positions for each fuzzy equivalence class,leading to expectations of what local processing might find phonological priming tests show a facilitory or inhibiting effect. <br> <br>*** has to do with locations in personal construct space (near points / far points in personal construct space) <br> <br>ad 2): Because only a representative sampling is required to close the visual wordform resolutional loop it is attractive (but mistaken) to posit, as Hrant thinks we must, that the bouma is perhaps only a character or two long in the fovea. Mistaken, because the relevant primitive to which the perceptual system's response bias is skewed remains the visual wordform as a whole (as indexed in parafoveal preview). <br> <br>ad 3): Visual wordform resolution is an individuating event. It mediates directly the unfolding of sense, because, encapsulated with the visual wordform's neural signature is a location in personal construct space. (This is a topography and not a database) The unfolding of sense does not involve multiple discrete lexical-identity assignment events. <br> <br>In short: parafoveal processing: responsible for 'index assignment,' 'ensemble statistics assembly,' and 'fuzzy equivalency class selection', or 'candidacy set narrowing'****; foveal processing: responsible for 'individuation' and triggering the 'visual wordform resolutional' event.  <br> <br> **** for objects for which neural pathways exist. (for: 'index assignment' see \"Indexing and the object concept: developing 'what' and 'where' systems.\" Alan M. Leslie, Fei Xu, Patrice D. Tremoulet and Brian J. Scholl: <a href=\"http://ruccs.rutgers.edu/~aleslie/Leslie_%20Xu_Tremoulet_&amp;_Scholl_1998w.pdf\" target=\"_blank\">http://ruccs.rutgers.edu/~aleslie/Leslie_%20Xu_Tremoulet_&amp;_Scholl_1998w.pdf</a>)</p>"
