    html: "<p>&gt; people still gayly choose to favor the style of one and the implications of another <br> <br>Hrant, I don't know why you assume my choices to read or not read were based on style. I stopped reading Kevin's when he gayly dismissed the dominance of upper and lower case over all-caps as an accident. That's like telling a chef that tasty meals have nothing to do with nutrition. If I were a scientist, I would be inclined to create tests that explain the prevalence of U&amp;lc, rather than gloss over it. <br> <br>&gt; What letter-spacing optimizes readability? <br> <br>Ralph, your question hits to the core of the issue. Quite plainly, there can be no scientific answer to this, because it is a design problem. Let me explain. <br> <br>However reading is conceptualized and measured, whether by words, letters, strokes, or other more abstract, less representational visible features such as those mentioned by Peter, the job of the type designer (and typographer) is to create typesetting which is a harmonious image field against which the individual components may be optimally differentiated. <br> <br>The reason for the harmony is two-fold. Firstly, harmony provides a consistency of \"colour\" against which meaningful forms stand out clearly; uneven colour creates artefacts which may be misinterpreted as significant. Secondly, when the discrete nature of letters is compromised, the harmony of \"all separate letters\" is broken: this disharmony occurs when, through type design flaws, accidental ligatures occur, such as \"r_n\" confusing modern with modem. Similarly, the letter-components of words may configure themselves ambiguously, for instance \"seklan\" might be read as \"seldan\". <br> <br>No amount of theoretical knowledge will help designers solve the problem of \"even colour\", because the design parameters are too multi-dimensional. Let's face it, even two parameters require a human value-judgement, as in \"do you want that (design product) lighter or stronger?\" <br> <br>Here is a demonstration of the value-judgements that have to be applied to spacing. The test-case is the spacing (and possible kerning) of the sequence \"OTC\" in a sans serif italic. I have chosen Italic, because it's trickier, and highlights the difficulties. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/67897.jpg\" alt=\"OTC\"> <br> <br>1. Roman. <br> <br>2. The problem arises because the O and C should not be straightforward skews. That doesn't look right -- among other things it distorts the thickness of the supposedly monoline stroke, and such inconsistencies (including optical illusions) are compensated for in glyph construction. For the same reason, vertical strokes are thicker than horizontal ones; why? well, that's a whole nother ball of wax, as Peter might say. <br> <br>3. Because of the compensation, the distance between the glyph near points becomes uneven. But everything must be evenly spaced for optimum differentiation. So how does the type designer resolve the problem? It's a subjective value judgement as to what is most important, which is, in effect, a decision as to what relative priority the reader will attach, in his/her \"sense\" of even colour, to the different formal relationships involved in this glyph sequence. <br> <br>Here, in 3, Neue Helvetica 46 ships with no compensation, the presumption being that the distance between the major vertical strokes should be consistent. <br> <br>In 4, optical kerning (InDesign) attaches more importance to near-point distance, with the result that the larger-scale value of white-spacing becomes uneven. <br> <br>5. Here, in a spacing strategy more often seen in display setting, the near-point values are equalized, with larger scale gross unevenness; but who is to say that this is not more legible in immersive reading, until it is tested empirically? <br> <br>So, there are different spacing strategies available, the relative import of which may vary with the size, tracking, weight, and style (eg degree of slant) of the typeface. These strategies have a bearing on glyph design: for instance, the top and bottom extrema points of the O in Helvetica 46 are \"skewed\" less than the straight \"vertical\" strokes. By how much may be decided by issues such as this spacing problem. <br> <br>Furthermore, resolving this spacing problem may upset spacing relationships in other character combinations. <br> <br>This particular example, concerning a difficulty of print typography, may not seem significant to the matter of letter-recognition, but remember, even colour optimizes readability, and glyph design is predicated on even colour. This example may not seem significant for reading roman text on screen, but it is typical of the complex design considerations involved in type, and not something that can be reduced to simple science.  <br> <br>As Peter says, in boldface, the \"micro-aesthetics\" of typography are actually functional. <br> <br>Now, on to the biology. It is my understanding that there are different receptors, or processors, in different areas of the visual cortex, for things such as \"closeness\", \"verticality\", \"evenness\", etc. These are used in parallel.  <br> <br>Prompted by an initial stimulus, the viewer creates a \"bouma\" which he/she throws into the rapidly cycling feedback loop of reading. This bouma is a flexible, predictive model of what forms the reader expects to see on further inspection of the text. The reader is searching for a match between linguistic meaning and textual form, both of which resolve in unison. As John Hudson has mentioned in a previous thread, the reader uses whatever is necessary to decode the text. So, at one level, massive tracts can be \"quantum read\" at speed with paragrpah-size boumas, and at the other end of the scale, the bouma may shrink to sub-glyph size to resolve an ambiguity.  <br> <br>The same text may be re-read: different, additional boumas, deeper meanings. <br> <br>Boumas of all sizes can be processed by the neural equipment, because it is a bag of instruments not limited by simple representational forms such as letters. <br> <br>Personal and cultural differences come into play, based on which combination of the visual processors are used to read the text. For instance, one person may read \"o\" as a line which connects upon itself (ouroboros), while another reads it as a shape symmetrical about two axes.  <br> <br>In conclusion, that's it for now.</p>"
