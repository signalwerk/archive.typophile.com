      <p><em>Only if laymen cared a lot about “style” in fonts… at 10 point.<br>
      They don’t.</em></p>
      <p>Do you think all those millions of Word users who decide they like Monotype Garamond more than Times New Roman, or vice versa, don’t care about style in text faces? Style is exactly what they do care about, often to the detriment of readability. They like the look a certain typeface gives to the page, even if they can’t articulate why and don’t know anything about the history of the particular type or its place in the typographic scheme of things: they respond intuitively and personally to style. And style is exactly what motivates the legions of font ’collectors’ and ’swappers’: if they didn’t care about style, they wouldn’t want all those different fonts. And it is precisely because laymen do care about style, however ignorantly, that software companies have realised that bundling diverse font collections adds both perceived and effective value to their products.</p>
