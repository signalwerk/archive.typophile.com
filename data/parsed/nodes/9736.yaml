    html: "<p>I've been pondering whether to make any contribution to the discussion of the style of Peter's essay. On the one hand, I consider this discussion a distraction, and wonder if Peter, Kevin and Hrant's initial notion to begin a separate Typophile discussion on reading might have been a better idea than beginning it within the context of this thread about Typo 13. On the other hand, it is something that I have thought about from time to time since I first read Peter's essay in Thessaloniki last summer, and it touches on my response to philosophical texts I have read in recent years. So please consider this message an aside from what I consider the main discussion, and I'm only sending it because I think some of the exchange between William and others has become unnecessarily hostile. I think there are ways of thinking about Peter's rhetorical techniques that may encourage charity. <br> <br>Generally, I agree with William that writing should seek to be lucid, and to convey the writer's ideas as clearly as possible. I don't think this always means that the writing must seek to be 'as simple as possible but no simpler': not all discourse is analogous to a scientific theory or, in philosophic terms, a formal proposition. One can, of course, meditate on any text, but some texts are what I would class as deliberately meditative, i.e. intended to oblige or force the reader to approach the meaning through a process of active engagement with the (often dense) verbal structures of the text. I consider Peter's essay to be in this class of texts that invite or demand meditative reading. William criticises Peter's text as requiring the reader to re-read sentences several times to get at their meaning, but this seems to me to be exactly Peter's aim: he wants the reader to wrestle with the text. To read such a text is not simply to take in its information as expressed, but to work at 'translating' it to arrive at a 'version' of the text that is clear to the individual reader. There are few exercises that demand closer engagement with a text than translation, and it seems to me that Peter wants to force something akin to such engagement. Whether we are willing to play along, is a question for each reader. <br> <br>Where I agree with William is that I don't think Peter's text <i>needs</i> to be written the way it is written, that the ideas in the essay could have been expressed in a more direct and lucid language. But Peter made a decision and employed a deliberate 'rhetorical strategy' to create a text that demands a particular kind of reading, and I'm willing to enage with his ideas on those terms (and it is a strategic decision, which is why I disagree with Raph's translation 'writing style', which seems to miss something of the intent). <br> <br>At their best, meditative -- or consciously 'difficult' -- texts can be Sokratic in effect. That is, they force the reader to consider assumptions, to return to the ideas discussed again and again looking for a more precise understanding, and they can inspire unexpected ideas in the reader's own thinking on the subject as a product of a meditative process that differs greatly from the kind of immediate response we typically make to what might be broadly called 'information'. <br> <br>At their (frequent) worst, such texts are simply unnecessarily complex and deliberately obscurantist: they require a meditative reading, but do not reward meditation. In this respect, they are the antithesis of Sokratic: they are sophist, employing rhetoric to mask falsehood, ignorance or philosophical bankruptcy. <br> <br>The meta-problem of all such texts is that one needs to engage with them quite deeply, and with a degree of philosophical charity -- there might be something of value in them --, in order to determine whether one is dealing with a thoughtful meditative text or with a piece of sophistic showmanship. I suspect that William would ask 'Why should I bother to go to such trouble? By what right does this author make this demand of me? What good will has he shown to the reader?', and I'm often inclined to ask this question myself when faced with such texts. <br> <br>I've come to the conclusion that one's willingness to deal with such texts is greatly dependent on one's sympathy for the ideas behind them, and that general interest in the presumed subject matter is not always sufficient (although, clearly, negative reaction to the rhetorical techniques employed may overcome such sympathy, as it seems to do for William). I have very little sympathy, for instance, with the ideas of Jacques Derrida, so have only occasionally bothered to think my way through one of his texts (and have generally emerged less sympathetic than when I started). On the other hand, I have much more willingness to engage with a very similar set of rhetorical techniques, even use of Derridean jargon, in Catherine Pickstock's deconstruction of Derrida's ideas on language and writing, because I'm much more sympathetic to her underlying ideas. [That said, the most striking parts of Pickstock's <i>Beyond Writing</i> are those in which she is most lucid, drops the jargon and writes in plain English. But perhaps that too is a rhetorical strategy.] I'm willing to engage with Peter's ideas in the way in which he has chosen to express them, precisely because I have some sympathy for his critique of both Kevin and Hrant, and I appreciate the subversive nature of his questioning of them. <br> <br>Like William, when I see a text full of unclear nominalisation, I am usually suspicious of the intent of the author. Often, such rhetorical techniques do seem to signal problems in the underlying ideas, which the writer has attempted to disguise through dense and obscure verbal trickery. I share William's skepticism when it comes to Heidegger, and have never found much of value behind Derrida's verbal cleverness. And I should add that I think the frequent (mis)characterisation of such reactions in terms of an Anglo-American analytical tradition vs. a Continental tradition of philosophy is inadequate, as the oft-remarked-on lucidity of Hans Georg Gadamer's <i>Truth and Method</i> demonstrates. [Derrida's refusal to engage in debate with Gadamer still seems to me a signal admission of philosophical cowardice.] <br> <br>But I've learned to be charitable, having recognised what I consider an authentic or at least honest strand of such writing, which is subversive of its own technique. Peter's essay, and his comments here, make it clear that the is seeking something through his ideas, and through his approach to 'precision' in their discussion. I'm not suspicious of his motives. I don't think he is trying to sell me philosophical snake oil. I don't think his ideas need to be expressed in the way they are in the essay, but perhaps in the discussion here we can, together, refine and re-express them while maintaining his salutory insistence on precision. As I wrote in the apparently notorious 'graphic communication' thread, I consider conversation to be the very best method for the development of ideas and their understanding. <br> <br>I also think that there is a delightful irony that an essay that considers 'immersive reading' should be anything but immersive. Knowing Peter, this irony may well be intentional.</p>"
