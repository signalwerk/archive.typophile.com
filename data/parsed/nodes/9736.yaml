    <p>As heralded by Hrant, <a href="http://www.magtypo.cz/">TYPO</a> 13 is now available for download or purchase (does anyone know if it's on a newsstand anywhere in San Francisco? Right now I only have the PDF), and the subject of this issue is Hrant's beloved subject of legibility, readability, and the bouma. <br> <br>The issue leads off with Kevin Larson's epochal paper, <a href="http://www.microsoft.com/typography/ctfonts/WordRecognition.aspx">The Science of Word Recognition</a>, which the TYPO crewe might have mentioned was taken straight from Microsoft's typography site. This paper was extremely important to me in my initial efforts to decipher what the hell Hrant was going on about with all of his mentions of the fovea and the parafovea, and as such it's a near-essential primer for people who are striving to think logically about legibility. I myself was just a little bummed that so much of the magazine was devoted to something I'd already read. <br> <br>The next article comes from a charming fellow by the name of Hrant Papazian, and reads like one of those early-19th century arguments for the existence of God. "Well, I can't show you any empirical evidence for or against the existence of God, but all right-thinking people already know God exists, and anyway, empirical evidence is reductive and unimaginative! This is GOD we're talking about here!" I don't mean to be dismissive, because Hrant's central argument</p>
