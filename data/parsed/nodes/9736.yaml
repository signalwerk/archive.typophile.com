    html: "<p>What follows is the result of my attempt to translate the formal, precise style of Peter's 8:26 post into the sort of informal, more conversational language more typical of an online forum posting. I apologize in advance to any changes in meaning. Anyway: <br> <br>I don't want to talk about my writing style so much that gets in the <br>way of what I'm trying to say, but I think sometimes there's a need <br>for formal, precise writing. When I wrote my article I knew it <br>wouldn't be easy reading for most typographers (and even cognitive <br>scientists), and that a lot of people would be turned off by the fancy <br>style. Happily, several people did manage to slog through it. I think <br>the technical jargon was a bigger problem than the way I put sentences <br>together. I hoped that people would be able to understand the jargon <br>from context, but even so Pavel and I did think about doing a glossary <br>explaining the unfamiliar terms. I took a chance in writing so <br>formally, and we'll see whether that was a good idea. In any case, one <br>reason I write so formally is that it's easier to be precise in <br>talking about fuzzy stuff. Not just for the sound of it, Hrant. <br> <br>William asked for clear, plain writing, and that's a good goal, and if <br>I were trying to communicate to more people I would hunker down and <br>make my writing simpler. Believe me, I know how to write clearly, but <br>I find it difficult. The article I wrote was the best I could do at <br>the time. <br> <br>(By the way, I have a hunch that the \"nominalization\" of the Williams <br>book is a different animal than the usual linguistics meaning: making <br>other kinds of words into nouns) <br> <br>I don't agree, Hrant, that you and I are closer together than we are <br>to Kevin. We share some themes, and I really appreciate the <br>conversations we've had, but there's also a lot that Kevin and I agree <br>on. I hope we can keep testing and exploring the ideas, ideally so <br>that all three of us wind up on the same page.</p>"
