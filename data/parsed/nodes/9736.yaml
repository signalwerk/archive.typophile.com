      <p>”...they respond intuitively and personally to style.” “...even if they can’t articulate why and don’t know anything about the history of the particular type...”</p>
      <p>Some may respond to style, others just see all those fonts in their list and try them just to be different than the last thing they typed. Some people may just choose a font based on where it is on the menu (proximity to default faces for instance). Computer users are used to their menu driven world. They make their choices based on what is on the menu, not what “style” they may truly like best if they shopped around. Readability is adjusted by them in the “Point Size” menu and their judgment is, more than likely, based on the screen image, not the printed page. They never use 10pt in their own word processing except maybe for footnotes. If 12pt were not the default size, they probably would use something bigger. When they see 10pt in a printed book (which as you know is quite common) they rarely respond to the style. Instead, they just read the text. Perhaps this is what Hrant means?<br>
      The major players in the bundling arena put in mostly readable fonts but add a few decorative and display faces too. I have seen plenty of lay users pick one of these non-text fonts for body text “just to be different.” There is nothing Microsoft, Adobe, or Apple can do to ensure that lay people use proper type for the job outside of not including any that don’t work for text in their bundle. That would be a marketing mistake given your “perceived and effective value.” (I get really tired of seeing all certificates done in “Chancery” and “Olde English”.)<br>
      There is nothing type designers can do to ensure good typography either. We can only do our best with the design and hope we don’t have to see uses that make us cringe too often.<br>
      ChrisL</p>
