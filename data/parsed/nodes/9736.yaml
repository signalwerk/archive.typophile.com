    html: "<p>William, now, i'm not astonished anymore, but i admire your confidence. That way you have to carry the truth and expose it to the poor ignorants that are enough dumb to have other opinions than your masters, is brilliant. <br> <br>I mean, the fact a scientist you like, and others, claim something doesn't make it blessed truth. It makes it an opinion, informed and intelligent, argumented and build, but still an opinion. Let's say a thesis of you want. But i'm more than sure i can bring the same amount of scientists to say the contrary with admirable deepness.  <br>More: the exemples you give are irrelevant, because in each case they use a easy sentence, while what Peter speak about are complicated things. I don't even want to argue about that precise topic, but there are tons of arguments to defend a difficult writting, if it's used to carry a complicated meaning. <br>Anyway, what disturb me isn't the thing itself, it's the arrogant way you don't even think it's worth talking about it.</p>"
