    html: "<p>&gt;the intolerance in which you express your opinion which is only an opinion <br> <br>Guillaume, my comment was not intolerant, but critical. The tone of it is dismissive of Peter's defense of his writing style. The tone should have been more gentle, but the rejection is thoroughly merited.  <br> <br>Writers, in my view, just as typographers, have a responsibility to their readers. The manner in which Peter wrote is just a model of the kind of turgid, prolix writing that Williams sets out to correct. Further, I find it ironic that in an essay on readibility Peter writes in a manner that needlessly requires the reader to re-read sentences many times just to puzzle out their meaning.  <br> <br>When I write on difficult topics I try to write as clearly as I can. Peter's defense that this style in this essay is more \"precise\" is unsound. Turgid prose is just harder to read, not more precise. <br> <br>Where Williams writes of useless nominalization, Fowler, in his \"Modern English Usage\" writes of \"abstractitis\" --which is perhaps the best term for what Peter's essay has a terminal case of. Here is an example from Fowler: \"'Participation by the men in the control of the industry is non-existent' instead of 'The men have no part in the control of industry.'\" <br> <br>The first edition of Fowler was in 1926, and Williams continues in this tradition with a deeper analysis of the same issues, and more help for those writers who want to correct such errors and make their writing more readable. My harsh rejection of Peter's writing style in the essay is not simply 'my opinion,' but the reflection of a widespread campaign for clear writing that has gone on for over seventy-five years, and has involved the life work of numerous researchers, writers and teachers.  <br> <br>I know very well that some Continental philosophers write with full blown 'abstractitis', and  that it impresses many people as deep. Even Nick, a writer of admirably lucid prose, was impressed.  <br> <br>But in reality 'abstractitis' has no defense, except that the writer, regretably, had no time to make it better. The defense that this style, or should I say blunder, is more precise or deep is unsound, and is shown to be unsound in detail and in depth by such people as Fowler and Williams.</p>"
