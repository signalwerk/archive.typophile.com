    html: <p>The brightness contrast of some of the text on color backgrounds surprises me for an issue on readability. The first page of Hrant's article's black on dark ochre is tough enough but the green-on-green of Enneson's article was really disruptive even for such a well written piece.  The Dyson article used a raster pattern about half way down the page making that portion of text all but unreadable to me. <br>All-in-all it is a great issue for content and I commend TYPO for such a wonderful editorial interplay of ideas. <br>It makes me wonder if they were pushing the boundaries of readability with color and pattern on purpose just to see how far they could go before someone said "ouch." <br> <br>ChrisL</p>
