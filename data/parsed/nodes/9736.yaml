    html: "<p>&gt; I do believe we use the parafovea to recognize letters as far as 15 letters out <br> <br>Is this something new? <br> <br>And how can this be, when every single test (at least among the ones I've seen, which are however many) indicates that we can't make out individual letters in the parafovea (especially when the letter has immediate neighbors - think of lateral masking for one thing), even when given many seconds to do so, much less during immersion? I've never seen anything over 5 or so - certainly not <i>fifteen!</i> <br> <br>&gt; I find his ideas about creating harmony between the black and white of text compelling. <br> <br>But you do realize of course that he's talking about a harmony among the black and white of a bouma, not [just] letters. Most significantly, he applies this to foveal processing too; he places even less faith in the PL model than I do. As we say in Armenian, let's sit crooked but talk straight. And I'm not trying to start a fight between you two, so please don't accentuate your agreements as a way to build fortifications against me - work with me here, let's spill all the beans. <br> <br>BTW, I agree with the centrality of this harmony too, of course; notan is what we read - this is not news. One difference though between Peter and me is that he wants to see the insides and outsides of boumas weighted equally no matter where they're seen (fovea or parafovea); this is one big place I think he's being too Modernist. To me, the weighting depends on the distance from fixation (for obvious reasons of blur). I think this appeals to me and not him because it's a messy ideological wrench-in-the-machine. It's filthy human effluvium. <br> <br>-- <br> <br>The mechanics of bouma decipherment is one thing, the belief that boumas exist is another. The former is where notan is the issue (and it's no small matter for sure), the latter is where cohesion (think serifs) are the issue. To me we're discussing the latter - not least because I think serifs, tight letterspacing, etc. do more to bind than bad notan does to hinder reading; we can get used to new shapes, but we can't learn to bind with no glue. Slap serifs on a \"funky\" skeleton (as long as the degree of divergence is correct), and space it well, and you'll outperform the most notanically-optimal sans in the world (Legato). Well, I think so at least. <br> <br>Reeling in a bit: <br>The PL model says you can set a long book in sans and not affect reading fatigue. There is no empirical evidence to counter this view, so the empiricists are happy. There is however the little matter of five centuries of vehement anecdotal opposition to this idea. How do we explain this disparity? But throwing the entire corpus of anecdotal evidence out the window, or by accepting the limits of the PL model? &lt;woolly&gt;Come on.&lt;/woolly&gt; <br> <br>&gt; I will of course share my findings. <br> <br>Which is very generous. I've said this before, and I'll say it again: we're very lucky to have you, and I think and hope that your role will be pivotal in the evolution of the understanding of readability among practitioners. But you will have to be patient with us. <br> <br>-- <br> <br>Raph, [my] answers soon. <br>But read the stuff, dude. <br> <br>hhp</p>"
    html_clean: "<p>&gt; I do believe we use the parafovea to recognize letters as far as 15 letters out <br> <br>Is this something new? <br> <br>And how can this be, when every single test (at least among the ones I've seen, which are however many) indicates that we can't make out individual letters in the parafovea (especially when the letter has immediate neighbors - think of lateral masking for one thing), even when given many seconds to do so, much less during immersion? I've never seen anything over 5 or so - certainly not <i>fifteen!</i> <br> <br>&gt; I find his ideas about creating harmony between the black and white of text compelling. <br> <br>But you do realize of course that he's talking about a harmony among the black and white of a bouma, not [just] letters. Most significantly, he applies this to foveal processing too; he places even less faith in the PL model than I do. As we say in Armenian, let's sit crooked but talk straight. And I'm not trying to start a fight between you two, so please don't accentuate your agreements as a way to build fortifications against me - work with me here, let's spill all the beans. <br> <br>BTW, I agree with the centrality of this harmony too, of course; notan is what we read - this is not news. One difference though between Peter and me is that he wants to see the insides and outsides of boumas weighted equally no matter where they're seen (fovea or parafovea); this is one big place I think he's being too Modernist. To me, the weighting depends on the distance from fixation (for obvious reasons of blur). I think this appeals to me and not him because it's a messy ideological wrench-in-the-machine. It's filthy human effluvium. <br> <br>-- <br> <br>The mechanics of bouma decipherment is one thing, the belief that boumas exist is another. The former is where notan is the issue (and it's no small matter for sure), the latter is where cohesion (think serifs) are the issue. To me we're discussing the latter - not least because I think serifs, tight letterspacing, etc. do more to bind than bad notan does to hinder reading; we can get used to new shapes, but we can't learn to bind with no glue. Slap serifs on a \"funky\" skeleton (as long as the degree of divergence is correct), and space it well, and you'll outperform the most notanically-optimal sans in the world (Legato). Well, I think so at least. <br> <br>Reeling in a bit: <br>The PL model says you can set a long book in sans and not affect reading fatigue. There is no empirical evidence to counter this view, so the empiricists are happy. There is however the little matter of five centuries of vehement anecdotal opposition to this idea. How do we explain this disparity? But throwing the entire corpus of anecdotal evidence out the window, or by accepting the limits of the PL model? &lt;woolly&gt;Come on.&lt;/woolly&gt; <br> <br>&gt; I will of course share my findings. <br> <br>Which is very generous. I've said this before, and I'll say it again: we're very lucky to have you, and I think and hope that your role will be pivotal in the evolution of the understanding of readability among practitioners. But you will have to be patient with us. <br> <br>-- <br> <br>Raph, [my] answers soon. <br>But read the stuff, dude. <br> <br>hhp</p>"
