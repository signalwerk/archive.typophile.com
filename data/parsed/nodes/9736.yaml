    html: <p>&gt; but Peter would not restrict the primitive used in perception to a single letter. <br> <br>That's right Kevin, but I would also argue that the primitive used is different for different tasks. For example, the perceptual processing primitive might be a single letter in letter recognition tasks, or in the 'letterwise decipherment' underlying learning to read, or in the acquisition of unfamiliar words, or even perhaps in the checking up on an initially misread word. <br> <br>I append 'perceptual processing' to 'primitive' in this contact, because what constitutes a primitive to the perceptual processing involved in reading or the perceptual processing involved in the recognition of letters, globally considered, might not be a primitive relative to neurons in the initial layers of the visual cortex. In fact I think it isn't.</p>
