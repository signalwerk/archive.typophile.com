    html: "<p>I'm not eager to draw out discussion of my rhetorical strategies (or those of others) to the point where discussion of the issues, and their meaning for practice is indefinitely postponed. But let me add, William, that I'm not entirely convinced that texts like the one I prepared for publication don't have a value and a place. In preparing the text I was well aware of the demands it would place upon the reader. Not only the typographically trained reader, but also the cognitive-scientifically schooled researcher. I was also well aware that not every reader would be willing to expend the amount of effort that might be required to make sense of it, and I was thrilled to note several did. I felt that what would make the text difficult going had more to do with the fairly large amount of unfamiliar expressions, rather than the oddities of construction and syntax. I hoped that the unfamiliar expressions might be transparent enough to allow a level of understanding and not require too much explanation. At one point Pavel and I suggested the possibility of a glossary of terms. So in writing the text I was taking a calculated risk and consciously engaging in a kind of experiment. I thought that what I lost in accessibility, I could gain in precision. Precision, Hrant, about the fuzzy stuff. Precision, not heady euphony. <br> <br>The type of expository prose you argue for, William, has its benefits, and were I or anyone else to attempt a full, widely accessible presentation of my understanding of perceptual processing in reading, I (or that person) would need to subject myself to the disciplines Williams, and others like him, outline. I hope you will believe me that I am not unaware of these disciplines. But at the time of their preparation, the text in place, and the presentation on which it was based, was what I could manage. The kind of writing it embodies had its own demands. <br> <br>(Meanwhile, I wonder if Williams means something different with his term 'nominalization' than my dictionary suggests: converting (another part of speech) into a noun.) <br> <br>I feel it is misleading to suggest, Hrant, that you and I are much closer than either of us to Kevin. There are common themes in your and mine approaches, and I owe a lot to conversations with you in consolidating my own point of view, but as Kevin has stated in off-forum conversations there is much that he and I can agree on. I hope we can get to testing and exploring those areas of agreement and difference eventually with the goal of a convergence of perspectives between the three of us.</p>"
