    html: <p>My monitor is a CRT and it is adjusted fairly dim. I guess white doesn't really hurt my eyes, but it is more difficult to look at.  <br>  <br>I just feel like the pure white background (made by additive light) are much more taxing to read upon than a black background. I've had a number of conversations about it now and I think it's weird that I can't find anyone sympathetic. For a while I thought it might be because my first 5 years on a computer were spent entirely in DOS with a black background.  <br> <br>I'm completely comfortable with being wrong on the subject, but I think there is more to it than that. Oh well. I hope the issue will go away as soon as I can afford a flat panel.</p>
