    html: "<p>I've now done a first reading of all three papers, and some more digging in the literature. For more on the physiology of vision, I recommend the paper <a href=\"http://www.bradford.ac.uk/acad/lifesci/optometry/research/projects/PeriVis.htm\">Compound grating discrimination in extrafoveal and amblyopic vision</a>. Also, it's too bad Hrant's <a href=\"http://www.themicrofoundry.com/ss_read1.html\">blurred fixation images</a> weren't used; they were very helpful for my understanding. I'd really love to see carefully prepared versions of these images based on an accurate model of grating sensitivity and real saccade data. <br> <br>I can see why people would be turned off by the hranting and hraving in Hrant's article, but I am very sympathetic to his central point, which I will now distort hopelessly by saying in my own words. We can take almost as an article of faith the principle that the visual system integrates <i>all</i> useful information presented to it. Both the word shape and parallel letter recognition models are deeply flawed because they both call for useful information to be discarded. <br> <br>In particular, I'm talking about the blurred image in the parafovea, and most especially cases where the fixation points of the saccade sequence skip over words (this would correspond to the third of the three zones in Kevin's description, comprising about 8 to 15 letters out from the fixation point). The resolved retinal image does not have enough detail to reliably resolve the letters in these areas, but at the same time it is clear that readers use the image for <i>something</i>. The word shape model would discard all information other than the outline of the word shape, while the parallel letter recognition model would discard almost all information other than the \"length of upcoming words and [...] best location for the next fixation point.\" <br> <br>I also think Hrant is on to something with his insistence that the reading process is based on heuristics. To continue the \"Roadside joggers\" example, in the blurred retinal image there is not enough information to reliably distinguish the word \"and\" from, say, \"aml\" or \"srd\". There is, of course, plenty enough information to distinguish it from \"from\". I'm sure that somewhere inside the visual system there's a representation that looks like \"sweat, pain ### angry drivers\", where ### represents a fuzzy equivalence class admitting \"and\" with very high fitness, \"aml\" and \"srd\" with high fitness, and \"from with very low fitness. The higher linguistic levels no doubt look at this representation and are happy with the fuzzy equivalence class. If they weren't, they'd send word down and there would be a regressive saccade to see what the word <i>really</i> says. I would guess that another function of the regressive saccades is to provide higher-quality training data for the (fuzzy) letter and multiletter recognition discriminators that see only blurry input. <br> <br>These fuzzy equivalence classes should be familiar to anyone who's tried to do speech recognition. Getting a computer to reliably distinguish spoken \"how to recognize speech\" from \"how to wreck a nice beach\" is notoriously difficult. In this example, though, the primary difficulty is distinguishing word boundaries, which is thankfully much easier for printed text thanks to adequate wordspacing. <br> <br>If my understanding is correct, then the job for typographers is to make images that resolve to as narrow an equivalence class as possible when blurred, so that the linguistic levels can get the same confidence in words with longer saccade jumps. Oddly enough, it would seem that this job is quite similar to that of the Clearview designers, except that in their case the image degredation is caused by fog and night driving conditions rather than the reading process pushing the lower-level visual process to the edge of its envelope to optimize reading speed. So maybe there isn't as much of a rift between legibility and readability as commonly thought.</p>"
