  - id: 62032
    user: 1551
    date: 2005-03-21T13:04:00
    date_raw: 21.Mar.2005 1.04pm
    votes: null
    html: "<p>&gt;against Hrant I argue that the importance of internal features discrimination to the wordform (or in Hrant's terms: bouma) resolution mechanisms underlying immersive reading does not warrant a parafoveally skewed understanding of reading of the kind Hrant puts forward, and hence motivates a somewhat different understanding than his of what counts in typographic practice.  <br> <br>Mr. Enneson, in my opinion this, and much in your essay, is bad writing--correction, terrible writing. There is no call for it in your subject matter. All you want to say, you can say with direct, clear language. <br> <br>Joseph M. Williams, in his admirable book <a href=\"http://www.amazon.com/gp/product/0226899152/102-7091979-3133744?%5Fencoding=UTF8&amp;n=507846&amp;s=books&amp;v=glance\" target=\"_blank\">Style: Toward Clarity and Grace</a> characterizes the way you are writing here as 'useless nominalization.' <br> <br>Here is a comparative example from Williams: <br> <br>\"1a.  Because we knew nothing about local conditions, we could not determine how effectively the committee had allocated funds to areas that most needed assistance. <br> <br>\"1b. Our lack of knowledge about local conditions precluded determination of committee action effectiveness in fund allocation to those areas in greatest need of assistance.\"  <br> <br>These say exactly the same thing. The first is readable, if a bit complex. The second is a puzzle that you have to unscramble. Your essay follows the second style, to the extreme.  <br> <br>I hope that when you write further on these subjects, you follow Williams' good counsel.</p>"
