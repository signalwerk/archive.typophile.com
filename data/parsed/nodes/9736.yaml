    html: "<p>Peter, I am primarily a writer, and recently a typogrographer. I write on difficult subjects, and labor very long and hard to make myself understood. I hope you understand that it is because I think you have something to say that I was so brutally blunt. And I appreciate your gracious reply.   <br> <br>You show by your re-write that you are perfectly capable of putting in the labor on clear writing and getting a far better result.  <br> <br>You say that you are bothered by your difficulty in making yourself understood to typographers. Writing experts, in particular Mr. Williams, have  spent their careers trying to identify precisely what makes writing more and less readable. I would suggest that their study and expertise should be taken as seriously as studies on what make type physically readable.  <br> <br>If you are concerned to communicate effectively, I would invite you to study Mr. Williams' book and judge for yourself whether his standards are good, and whether your nominalizations are useless or not. Mr. Williams discusses the difference between useful and useless nominalizations at length.  <br> <br>My own prediction is that if you try to follow his recommendations you will find yourself phenomenally better understood. I find that they do require a lot of work, but always get a better result.  <br> <br>Finally, on Yves' aphorism. I think it also works the other way around. When you try to make yourself clear by standards of good rhetoric, it helps you to clarify your own ideas. So the benefits is double: to you and to the reader. <br> <br>To start with, you will find that the goal of putting everything into one sentence is a prescription for writing disaster.         <br> <br>Best of luck on this other, critical dimension of readability!</p>"
