    html: <p>I'd like to see a moratorium on the use of the word "bouma" as a term of art until we have some kind of consensus on what it actually means. It feels like a neologism that hides more than it shows right now. Is it the boundaries of the chunk of text we're perceiving right now? (This is what I think Nick is describing it as.) Is it the shape of the word currently under your eye? (This is what I've understood Hrant to construe it as.) I don't think our understanding of word shape and textual recognition is far enough along for us to subsume such a tricky and contentious bundle of concepts beneath jargon.</p>
