    html: <p>What's woolly? It seems to me that you're dismissing what you can't put in a box. The old "what can't be counted doesn't count". Is the entire corpus of anecdotal evidence woolly? Is my pointing out that the PL model can't properly explain very long saccades, regressions and typos woolly? Your own admission that we don't really know what's going on should make you more open to delve deeper, to wonder, to doubt - to avoid the succubus of the Easy Answer. <br> <br>And you can think about and discuss <i>style</i>, or what kind of tea you like (I like Lapsang Souchong, and I'm OK with the fact that it makes most people nauseous), but don't let that cloud the evaluation of the content. None of the stuff in Typo13 is bullshit. It's all what each of us is thinking, inescapably to some extent <i>feeling</i>. Humans do this. <br> <br>hhp</p>
