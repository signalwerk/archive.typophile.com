  - id: 62033
    user: 6083
    date: 2005-03-21T15:26:00
    date_raw: 21.Mar.2005 3.26pm
    votes: null
    html: "<p>William, I could have said (had I taken more time and had I had less of a concern with putting the whole of my concerns into one comprehensive sentence):  <br>In Hrant's understanding of reading parafoveal processing does the bulk of the work. Converging lines of evidence suggest that an understanding of reading such as this is not sustainable. The lines of evidence I have in mind relate to: 1) the role actually played in recognition by internal features of boumas; 2) the parafovea's inability to discriminate internal features effectively in bouma-sized contexts; and 3) recent denominations of the parafoveal preview benefit. This motivates a somewhat different understanding than his of what counts in typographic practice. <br> <br>Or simply: studies show Hrant's understanding of reading is not sustainable. <br> <br>I am not convinced I am guilty of 'useless nominalization'. 'Nominalization,' perhaps; 'useless,' I want to think, not. But, having said that, I am bothered by my lack of ability to communicate effectively to a sizable portion of the typographical community (of which I am a part) things I think need to be addressed; or to put it differently, I am disturbed by my ability to obscure what I think needs saying by provoking negative reactions to how I say it, or how I think it is best formulated. I hope readers will bear with me.</p>"
