    html: "<p>Raph, that's cool. But could you make me sound like Peter?  :-) <br> <br>Forrest, I now feel much more comfortable with you - thanks for writing all that up. And I for one don't think  your background is a problem here; I'm a CompSci guy too, after all. I think it brings more to the table than takes away. <br> <br>&gt; we have to unbundle the overloaded word \"reading\" <br> <br>Yes, we have to see its dimensions (although I think context still allows us to simply use the word \"readability\" for the different aspects). In this context of Typophile, the word/concept refers to the micro typeface level. Sure, not world-altering, and yes, less important than the layout, and certainly the language, but that's what we've chosen to be here for (as individuals), so that's the focus*. This is a healthy sort of separation - which however doesn't mean it should become an end to itself. <br> <br>* William, if we're really concerned about people (like those whose houses are bulldozed), we would worry about much bigger things than sentence structure... But these are our circumstances, and choices. <br> <br>Readability versus legibility: It's not that I think the former is a superset of the latter, or that research effort must always address both, it's that readability is more complex, more misunderstood, harder to optimize, and most of all more <i>useful</i> to optimize. Letters have to be extremely strange for a person to give up reading a poster, but even a slight -consciously undetectable- readability defect in a text font can impede completion of a book, or even an article (especially if it's something you <i>have</i> to read, as opposed to enjoy). That said, and as Peter focuses nicely on, the essential decipherment that goes on (at the letter and bouma level) is very important to understand, and that applies to both. It's just that I'm personally in the dark on that - as is virtually everybody else though, it seems. <br> <br>&gt; you say that undergraduate students may have <br>&gt; less reading \"ability\" than post-graduate <br>&gt; students, but I don't see this is relevant <br>&gt; to the discussion of *how* people read. <br> <br>This refers to a classical issue: the different types and degree of reading - which can get quite confusing. The relevance here is this: every [adult] reader uses boumas; but the degree to which <i>multi-letter</i> boumas (and the parafovea) are relied upon depends on experience (among other things); and the key here is that empiricism has [had] trouble detecting this. This is where the difference between what might be -awkwardly- called light versus deep immersion comes in: when a test subject relies very lightly on multi-letter* boumas, the people analyzing the data will simply not see what's happening. When they see something like that \"and\" being skipped for example, they sort of improvise a tentative explanation, and say more research (ie money :-) is needed; their \"scientific integrity\" (at least the contemporary fashion of such, not the old Greek style) prevents them from doing what I've done. <br> <br>* BTW, is there a nice tight term for \"more than one\"? <br> <br>&gt; we need more data <br> <br>Agreed. And we need <i>better</i> data, and better interpretation of it all, by relying on \"practitioner review\" more than peer review, by not staying aloof towards anecdotalism. <br> <br>&gt; \"I'm sure the way I'm doing things is an improvement <br> <br>I'm never sure. That would be too Modernist. :-)  I only <i>think</i>, and try to act on it. I don't believe in the sagacity of the PL model, so I put serifs on my text fonts for example. I could be putting serifs because that's what the status quo wants, but we already know what I think of the status quo... I do it because it makes [functional] sense. And in your case, if you're really convinced of the PL model (your other choice is to be closer to my view - I can't think of an alternative - although there might be one, or even many) then you should only use serifs fonts for aesthetic effect. <br> <br>&gt; It's easy to say, for example, that serifs work <br>&gt; by creating rails of horizontal stress in a text <br> <br>And if you did you'd be joining in a naive delusion. Leading is what keeps lines together (assuming \"normal\" word and letter spacing). There are no rails. And we don't need arrowheads on the right sides of serifs either. Serifs bind. They reduce letter individuality in favor of bouma integrity. This btw is where legibility and readability are <i>opposed</i>, although of course not fully opposed. Think of them as two vectors at 90 degrees. <br> <br>&gt; The reason for the hostility towards anecdotal <br>&gt; evidence in science is because, in effect, it <br>&gt; requires us think theologically <br> <br>I think it's because it requires us to think, period! <br> <br>-- <br> <br>&gt; a widespread campaign for clear writing that <br>&gt; has gone on for over seventy-five years <br> <br>Is it a coincidence that this same time period has seen the darkest hours of humanity? <br> <br>&gt; The usual problem with journalism is <br>&gt; not bad writing, but lack of depth. <br> <br>And you think this and their alleged \"good writing\" is another coincidence? <br> <br>&gt; well estabilished knowledge <br> <br>YOUR chosen knowledge, not everybody else's. <br> <br>-- <br> <br>&gt; I was eager to hear how William <br>&gt; might respond to my contentions. <br> <br>I can think of only two people who have the required depth, breadth, objectivity and intellect to serve as a \"moderator\" if you will concerning the contents and intentions of Typo13: Herbert Spencer (dead), and Richard Southall (retired?). <br> <br>hhp</p>"
    html_clean: "<p>Raph, that's cool. But could you make me sound like Peter?  :-) <br> <br>Forrest, I now feel much more comfortable with you - thanks for writing all that up. And I for one don't think  your background is a problem here; I'm a CompSci guy too, after all. I think it brings more to the table than takes away. <br> <br>&gt; we have to unbundle the overloaded word \"reading\" <br> <br>Yes, we have to see its dimensions (although I think context still allows us to simply use the word \"readability\" for the different aspects). In this context of Typophile, the word/concept refers to the micro typeface level. Sure, not world-altering, and yes, less important than the layout, and certainly the language, but that's what we've chosen to be here for (as individuals), so that's the focus*. This is a healthy sort of separation - which however doesn't mean it should become an end to itself. <br> <br>* William, if we're really concerned about people (like those whose houses are bulldozed), we would worry about much bigger things than sentence structure... But these are our circumstances, and choices. <br> <br>Readability versus legibility: It's not that I think the former is a superset of the latter, or that research effort must always address both, it's that readability is more complex, more misunderstood, harder to optimize, and most of all more <i>useful</i> to optimize. Letters have to be extremely strange for a person to give up reading a poster, but even a slight -consciously undetectable- readability defect in a text font can impede completion of a book, or even an article (especially if it's something you <i>have</i> to read, as opposed to enjoy). That said, and as Peter focuses nicely on, the essential decipherment that goes on (at the letter and bouma level) is very important to understand, and that applies to both. It's just that I'm personally in the dark on that - as is virtually everybody else though, it seems. <br> <br>&gt; you say that undergraduate students may have <br>&gt; less reading \"ability\" than post-graduate <br>&gt; students, but I don't see this is relevant <br>&gt; to the discussion of *how* people read. <br> <br>This refers to a classical issue: the different types and degree of reading - which can get quite confusing. The relevance here is this: every [adult] reader uses boumas; but the degree to which <i>multi-letter</i> boumas (and the parafovea) are relied upon depends on experience (among other things); and the key here is that empiricism has [had] trouble detecting this. This is where the difference between what might be -awkwardly- called light versus deep immersion comes in: when a test subject relies very lightly on multi-letter* boumas, the people analyzing the data will simply not see what's happening. When they see something like that \"and\" being skipped for example, they sort of improvise a tentative explanation, and say more research (ie money :-) is needed; their \"scientific integrity\" (at least the contemporary fashion of such, not the old Greek style) prevents them from doing what I've done. <br> <br>* BTW, is there a nice tight term for \"more than one\"? <br> <br>&gt; we need more data <br> <br>Agreed. And we need <i>better</i> data, and better interpretation of it all, by relying on \"practitioner review\" more than peer review, by not staying aloof towards anecdotalism. <br> <br>&gt; \"I'm sure the way I'm doing things is an improvement <br> <br>I'm never sure. That would be too Modernist. :-)  I only <i>think</i>, and try to act on it. I don't believe in the sagacity of the PL model, so I put serifs on my text fonts for example. I could be putting serifs because that's what the status quo wants, but we already know what I think of the status quo... I do it because it makes [functional] sense. And in your case, if you're really convinced of the PL model (your other choice is to be closer to my view - I can't think of an alternative - although there might be one, or even many) then you should only use serifs fonts for aesthetic effect. <br> <br>&gt; It's easy to say, for example, that serifs work <br>&gt; by creating rails of horizontal stress in a text <br> <br>And if you did you'd be joining in a naive delusion. Leading is what keeps lines together (assuming \"normal\" word and letter spacing). There are no rails. And we don't need arrowheads on the right sides of serifs either. Serifs bind. They reduce letter individuality in favor of bouma integrity. This btw is where legibility and readability are <i>opposed</i>, although of course not fully opposed. Think of them as two vectors at 90 degrees. <br> <br>&gt; The reason for the hostility towards anecdotal <br>&gt; evidence in science is because, in effect, it <br>&gt; requires us think theologically <br> <br>I think it's because it requires us to think, period! <br> <br>-- <br> <br>&gt; a widespread campaign for clear writing that <br>&gt; has gone on for over seventy-five years <br> <br>Is it a coincidence that this same time period has seen the darkest hours of humanity? <br> <br>&gt; The usual problem with journalism is <br>&gt; not bad writing, but lack of depth. <br> <br>And you think this and their alleged \"good writing\" is another coincidence? <br> <br>&gt; well estabilished knowledge <br> <br>YOUR chosen knowledge, not everybody else's. <br> <br>-- <br> <br>&gt; I was eager to hear how William <br>&gt; might respond to my contentions. <br> <br>I can think of only two people who have the required depth, breadth, objectivity and intellect to serve as a \"moderator\" if you will concerning the contents and intentions of Typo13: Herbert Spencer (dead), and Richard Southall (retired?). <br> <br>hhp</p>"
