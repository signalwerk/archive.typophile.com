    html: <p>William, <br> <br>Sometimes, complex subjects require complex statements. As far as I'm concerned, my first responsibility when I write for publication is to myself - to write precisely what I mean. If I can then make what I have to say accessible to a non-specialist audience, then I will, but its not a big priority. I have this luxury because hardly anyone but a specialist in quite a narrow field would ever read what I've written. Peter is also writing for a specialist field. This article is only likely to be read by people who want to understand technical issues surrounding readability &amp; legibility. If people want to understand those issues, then they are going to have to put some effort in and concentrate. I realise that you're saying that clearer writing will allow readers to concentrate more on the arguments, but I really think that you're too dogmatic in berating Peter for his writing style. <br> <br>I haven't read the book by Williams that you refer to, but I do use Fowler sometimes. Lets not get carried away with it, though, as Fowler was a pedantic stuffed-shirt and an appalling snob.</p>
