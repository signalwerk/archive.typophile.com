    html: "<p>Peter, when Williams says he rejects 'Draconian' rules, it is because he recognizes that different situations call for different approaches. But he is quite definite, as Mahrer immediately explains, that the story telling model is the clearest way to write. The point is that in different situations this goal is accomplished by different means. Also clarity is not the only goal; coherence, for example, is also very important for the reader to follow the writer's train of thought. Hence different situations call for different solutions and compromises, as he explains at length.  <br> <br>He does, however clearly identify what he regards as turgid or prolix prose that he proposes to remedy. If you compare the 'good' and 'bad' examples that Mahrer quotes from Williams, I'm afraid that many of your sentences in your essay follow the 'bad' example for precisely the reasons he explains. And these sentences can be made much clearer, in exactly the manner explained, without any loss of meaning. In fact, you yourself did this above, in rewriting the sentence I pointed out as turgid and correctable.  <br> <br>&gt;Does it mean thetic-critical discourse must be avoided or recast according to a storytelling (character+actions) model?  <br> <br>Please define 'thetic-critical discourse' for me and I can address your question. I do not know what you mean by this phrase.  <br> <br>Williams does not say that all writing must follow the story model, but only that when we depart from it we will be less clear and immediately understood. We may gain something by departing from it, but we will lose clarity.   <br>   <br>My friend mentioned the 'story' model in the context of creating and learning concepts in science. If I understood her correctly, the most basic way memories are stored is as scenarios: I open the door door to my house see the stairs on the left, etc. So in understanding the creative process of building new concepts or in explaining a concept to someone who doesn't know it, it is helpful to identify and use such scenarios. If indeed scenarios are fundamental in human thinking--as my friend reports current research seems to support--it does give further credence to Williams' approach to writing.   <br> <br>I do feel awkward using so many words in this thread on the subject of readable composition, when it is about readable typography. However, I will be happy to follow up on your 'thetic-critical' question, as soon as I understand it.</p>"
