    html: <p>&gt; Precision, not heady euphony. <br> <br>1) I think it's a precision borne of depth, not accuracy. I might not use the term "precision" here. <br>2) As I've expressed before (although maybe not in public, at least not explicitly) I think your essay is what it needs to be, especially in the "tonal spectrum" of the whole of Typo13. A topic like this can leverage much spirit from what I've been calling this "existential" style. My complaint above stemmed from Nick's apparent preference of style over content, the admiration of the waves on the surface of the ocean instead of the ecosystem within it. <br> <br>&gt; there is much that he and I can agree on. <br> <br>Sure. But these are things I would most probably agree with as well! Things like the limits of familiarity, the importance of empiricism, etc. In the triangle formed by our three views, my vertex is quite close to the line between you and Kevin, and closer to your vertex than his. Exactly what do you and Kevin agree on that I don't? The only thing I can think of is perhaps a belief that we can one day have a total grasp of reading (which I have a philosophical problem with) and by extension that it's possible to design type -optimally readable type- in a sound, formal, complete state of mind. This is in fact the crux of the monotheistic/Roman/Western belief system that I was complaining about above; something I myself used to subscribe to in my teens, but no longer. <br> <br>BTW, I'm not trying to pit you two against each other; I'm all for the covergence -or at least mutual illumination- that you describe; but I can't pretend the triangle is equilateral. <br> <br>-- <br> <br>&gt; If you knew and understood Williams .... <br> <br>There's a huge difference between understanding and accepting; it's often hard to do the former, but the latter is a matter of integrity, not ability. I think you're being entirely too dogmatic, even theological. <br> <br>hhp</p>
