    html: "<p>John, I think you are quite right about my text and texts like it. But the irony you pointed out at the end had not occurred to me. (I was perhaps too immersed in the rigours of writing.)  <br>Perhaps most of the things that needed saying, pro and con about rhetorical strategy choices have now been said and we can move on. <br> <br>Forrest, I think a moratorium on 'bouma' might be a good thing. The term is at best a slippery fish. A moratorium might force Hrant to say what he means in other ways. <br>The use of a technical term in a discussion is a social contract. In the case of 'bouma' I'm not sure every participant in this discussion has agreed to it. Certainly the content Kevin specifies for it in his essay (word shape in the sense of outline or raw pattern of neutral, ascending and descending characters) differs from Hrant's sense of what it involves, or so it seems to me. <br>In addition, Hrant, the issue as I see it is not 'the belief that boumas exist', but whether the term can be made to embody a construct that is useful for clarifying or elaborating how perceptual processing in reading works. I still believe that might be possible. <br>Hrant, you say: \"...a bouma is (virtually always) a single letter in the fovea...\" I think you are wrong about the 'virtually always,' but aside from that, when you say it is a single letter in the fovea I begin to wonder if you aren't playing too fast and loose with the term. Here I begin to think you might be using 'bouma' as a synonym for 'perceptual processing primitive', or 'unit of perceptual processing'.  <br> <br>Hrant's 'bouma' comes from 'Bouma shape' and in that form is first used by Taylor and Taylor in their \"The Psychology of Reading.\" In T&amp;T's text the authors' intent is to factor into a notion of word shape more than 'outline' or 'raw pattern of neutral, ascending and descending characters'. However, in their use of it, a word's 'bouma shape' refers to a coefficient--a string of numbers coding (essentially) perceptual distances between component letter forms. Not 'shape' in the conventional sense. And the point they want to make comes down to this: when this new level of information is added to the notion of word shape, the word shapes of (I think it was) 97 percent of words in a typical text are seen to be unique. So bouma ambiguity in a typical expository text accounts for a relatively small part of the retrograde saccade rate encountered in a competent reader's reading of a typical (Williams approved?) expository text. <br>\tHrant picked the term up from his reading of Paul Saegner's \"Space between Words\", who adapt it from Taylor and Taylor. In Saegner's glossary its meaning is specified as \"the shape of the word when written in upper- or lower-case letters and delimited by space.\"  <br>\tIn the first Hrant use of it that I encountered there were references to the internal and external outlines in a word. At the time I was reading Gerrit Noordzij's (soon to appear in English) \"The stroke,\" and the reference to the inner and outer form of the word resonated with me. Later Hrant's 'bouma' became the word as seen in blurry parafoveal vision. Bringing boumas into the fovea means that it has to mean something different again than the 'blurry paravoveal vision' iteration. <br>\tMy own (playful) derivation almost half-a-dozen years ago looked like this: We see a bounded, separated and rhythmically cohering configuration of grouped alphabetic or numerical forms. We see a bounded map = boundedmap = bou[nded]ma[p] = bouma. I might state the first sentence differently now. But the second might still be a place to start. It would allow us to say: the perceptual processing primitive for vision in normal immersive reading of familiar words (where legibility is not an issue) is a bounded map of role-architectural and role-architecturally evoked particulars.  <br>\tWhat might be the use to type-involved individuals of saying this, or something like it? Perhaps the following: anything that might hinder the optical integrity of the bounded map should be attended to, whether its source be problems of spacing, glyph shape or stroke conformity. This is why good typographers are fanatical about kerning, ligatures, etc. To my mind we need not think of concerns with spacing etc, first and foremost, as aesthetic concerns, though they can and should be that too. First and foremost such concerns must be concerns to meet an 'ease of perceptual processing' requirement. <br>\t <br>This gets us into the 'space craft' thread in this forum. And I will have more to say about that in time. (The Bigelow / spatial frequency grating contribution in the comp.fonts discussion will help!) But also in the picture is the matter of lateral interference. <br> <br>By the way: how do I get back for reference the top messages on the forum? They have disappeared (because of the 7-day setting).</p>"
