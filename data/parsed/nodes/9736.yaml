    html: "<p>Perhaps Hrant's suggestions about single-letter or bi-graph boumas in the fovea and his suggestions about the roles and proportionate contributions of the fovea and parafovea could be tested by turning the boundry study on its head so to speak.  <br>\tIf the parafoveal viewing of word-sized boumas has the capabilities Hrant claims it does, and if the chief role of a foveal viewing of text-matter is to help narrow the equivalence class (using Raph's term) down to one, than a test like the following might prove useful. 1) Create text which uses a word with numerous close equivalence-class or orthographic neighbours. 2) Leave the material eccentric to fixation in place when a saccade is executed, but substitute the letters just around the likely disambiguating fixation candidate of the relevant word with close 'similars'* (or x's )during the saccade (one could play with bouma size here: single letter; bi-graph; tri-graph.) 3) See what happens to comprehension and reading speed compared to a) no substitutions; b) substitutions with near-similars c) substitutions with x's; d) substitutions of all but the disambiguating letter (when the single letter is the most likely bouma candidate under Hrant's scheme) or bi-graph. <br>\tThe test strikes me as a bit ludicrous. And that is part of the reason I think aspects of Hrant's conception are out of whack.  <br>I predict subjects will find a correct sense of the sense of the sentence might 'lurk', but the experience of reading what is being said will be somehow disturbed. <br> <br>* see Hrant's \"Improving the Tool\" <br> <br>__________________________________ <br> <br>Kevin, you say: \"[t]he boundary study described in the paper demonstrates that during normal reading we combine the incomplete parafoveal letter recognition with additional time completing letter recognition in the foveal region.  <br> <br>I think 'demonstrates' is too strong a word here.  <br>Maybe you will grant this readily. <br>But let me state my reasons for saying it. <br>Your view of what the boundry study allows you to take as fact might be the most ready-to-hand for you, given 1) the fact that the distal stimulus material is made of letters, 2) your 'parallel letter recognition' bias and 3) your assumptions about mental processes. But it might not be the most probable, elegant, compelling, or fertile, when a wider range of factors and assumptions, or a different bias, or a 'deconstruction' of your terms of reference (sorry about the Derridaian slip John) are taken into account.  <br>Perhaps I need to demonstrate the above, but the most you can say, I think, is: \"[t]he boundary study described in the paper is consistent with the view that during normal reading we combine the incomplete parafoveal letter recognition with additional time completing letter recognition in the foveal region.\" Meanwhile, the most I would grant is: \"[t]he boundary study described in the paper is not, on the face of it, inconsistent with the view that during normal reading we combine the incomplete parafoveal letter recognition with additional time completing letter recognition in the foveal region.\" That is, the boundry study doesn't falsify your view. <br> <br>The big unknown here is precisely how the parafoveal preview benefit works. Beyond providing length and word-boundary cues, how it works is a dark area. We can be confident of the following: misleading visual cues 1) up into the role-architectural and role architecturally evoked level (bowls / stems / counters and their positional relations), and 2) to a distance of minimally 15 characters from the point of fixation, detrimentally affect the operative neuronal representation of parafoveally previewable material. <br>I think the effect of lateral interference in a parafoveal presentation of a word is such that Kevin's partial letter information can't be meaningfully resolved and fed forward. Some studies try to work with the notion that a crude but useful neuronally compiled textural map accounts for the parafoveal preview benefit.</p>"
