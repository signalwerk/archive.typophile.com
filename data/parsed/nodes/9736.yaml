    html: <p>Guillaume, you misunderstand me. I am not speaking of or objecting to using clear technical terms to a readership that knows them. Neither I nor Williams and Fowler have any objection to this.  <br> <br>If you look at either of these authors you will see the kind of problems they diagnose and correct.  <br> <br>If you are going to be a journalist, I think you will find Williams helpful, though it depends on the sort of journalism. Williams is concerned with helping those who have to write as part of their work, doing reports, etc, on difficult matters. So the more complex the matters you have to write about, the more helpful Williams will be. (I think his stuff is almost all equally applicable to French language.) <br> <br>Generally speaking I find that journalists write better than everyone else, perhaps because they have a lot of practice. The usual problem with journalism is not bad writing, but lack of depth.</p>
