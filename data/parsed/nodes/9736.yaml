    html: <p>Saying that images are blurred in the parafovea may be a bit of a shortcut. Probably a more precise statement is that sharp and blurred images on the parafovea are perceived more or less the same. This <a href="http://psy.ucsd.edu/~sanstis/PDFs/Blurry.pdf">paper</a> gives a fairly striking demonstration of this effect. <br> <br>What <i>really</i> happens in the parafovea still seems pretty mysterious to me. The compound grating paper I linked above strongly suggests that you lose the ability to perceive phase information more quickly than you lose the ability to perceive contrast information as you go from the center of the fovea. That's a fascinating nugget of information, and one that I'm pretty sure is relevant to typography, but on the other hand, it also shows that you can't just do a Photoshop radial blur and expect it to accurately simulate the perception of images in the parafovea.</p>
    html_clean: <p>Saying that images are blurred in the parafovea may be a bit of a shortcut. Probably a more precise statement is that sharp and blurred images on the parafovea are perceived more or less the same. This <a href="http://psy.ucsd.edu/~sanstis/PDFs/Blurry.pdf" class="link-external">paper</a> gives a fairly striking demonstration of this effect. <br> <br>What <i>really</i> happens in the parafovea still seems pretty mysterious to me. The compound grating paper I linked above strongly suggests that you lose the ability to perceive phase information more quickly than you lose the ability to perceive contrast information as you go from the center of the fovea. That's a fascinating nugget of information, and one that I'm pretty sure is relevant to typography, but on the other hand, it also shows that you can't just do a Photoshop radial blur and expect it to accurately simulate the perception of images in the parafovea.</p>
  - id: 62099
