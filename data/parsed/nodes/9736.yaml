  - id: 62031
    user: 6083
    date: 2005-03-21T11:30:00
    date_raw: 21.Mar.2005 11.30am
    votes: null
    html: "<p>I'm not quite certain how to 'solve' the compact and perhaps somewhat distended expository style of my Typo 13 contribution except to say that, in the context of Hrant's somewhat cavalier or opportunistic approach to questions of evidence, and Kevin's failure to address matters of construct validity, I thought it necessary to develop the kind of text I did. I've asked Pavel if it might be possible to provide and English-language translation of the Czech-language summary supplied by David Barton. Some of my more arcane usages have to do with my sense that the typographical craft-evolved terminological repertoire might not be adequate to the task of articulating a typographically relevant evidence-based understanding of reading. <br> <br>Another solution might be to turn my contribution into a much larger text, but at the moment my construction of reading is still too exploratory and my command of the relevant literature still too fragmentary to make that possible. My text as it stands represents a, for me, foundational document on which, I hope, I and others can build. But a larger text might be even less approachable for the graphic design student who wants an overview of the issues more than a detailed elaboration and justification of points of view. <br> <br>In terms of substantive issues, let me offer the following: contra Kevin, I argue that the parallel letter recognition model of word recognition is neither sustainable in broadly cognitive-scientific terms nor convenient for gauging and channeling typographic practice; against Hrant I argue that the importance of internal features discrimination to the wordform (or in Hrant's terms: bouma) resolution mechanisms underlying immersive reading does not warrant a parafoveally skewed understanding of reading of the kind Hrant puts forward, and hence motivates a somewhat different understanding than his of what counts in typographic practice.  <br> <br>I also wanted to convey that the key relevant issues for typographic practice are 'perceptual processing' issues and that the benefit of addressing such issues at a fairly sophisticated level lies not in telling us in specifics what to do, but in identifying and orienting us toward what's important in typographic formgiving and typeform construction. (For example, one consequence of my outlook is to suggest that when using or designing a sans-serif font, inter- and intra-letter spacing--managing the white of the word--are more critical than they perhaps might be in old-style seriffed fonts.)</p>"
