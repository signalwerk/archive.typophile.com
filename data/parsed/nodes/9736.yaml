    html: <p>&gt; I do hope William will feel inclined to address specific claims. <br> <br>I was completely put off by your writing to the point that I did not want to read it although I am quite interested in the subject matter and read (but didn't study) Kevin and Hrant's contributions. But I am now working through your essay, and will post when I have finished - which may take a while.  <br> <br>Peter, I am sorry for the intemperate tone of my post last evening, which as Guillaume pointed out detracts from my argument. The fact is, though, that Williams' work is rooted in linguistics, and is supported, I believe, by contemporary research in cognitive science.  <br> <br>For what it's worth, my view is that clarity or lack of clarity in writing is normally a much bigger factor in readability than is typeface and layout. Jenson and Griffo I think figured out how to make type more readable than the scribe's pen, and type ever since has been generally excellent in readability, with a few unfortunate detours.</p>
