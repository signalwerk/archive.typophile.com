    html: <p>Just to follow up on testing issues. I see from your post, Kevin, that testing is being done on Chinese. I don't whether they are asking questions about spacing (within characters), though.  <br> <br>Incidentally, I am aware that there is a phonetic element in Chinese characters. There are several hundred 'radicals' if I remember right that are used to construct other characters. Typically, they will combine a character for sound with one for meaning, giving a clue to the reader who knows the system. I am told that after the first few thousand characters it gets easier. I never got that far.  <br> <br>On the Hebrew vowels, I think there is something to be learned here, as they are pretty disfunctional, I suspect. Hebrew is normally written without the vowel points (nikud), both traditionally and today. The vowel points were introduced I believe to preserve the pronunciation for a populace that was losing Hebrew. I suspect that even native speakers cannot read Hebrew with nikkud 'immersively'. In other words, they will just ignore the vowel points. -Some Hebrew speaker can confirm this for  us. And I don't think those who learn to just pronounce Hebrew phonetically (for prayers, without understanding) ever get to the stage of words 'gelling' so they just see words. If this is the case, it might tell you, negatively, about what interferes with immersive reading, and hence some clues about what is good.</p>
