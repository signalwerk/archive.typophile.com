    date: 2005-03-15T19:22:00
    date_raw: 15.Mar.2005 7.22pm
    votes: null
    html: <p>Black on off-white seems to be best. Not sure if this would be true for ClearType rendering on an LCD. <br> <br><a href="http://psychology.wichita.edu/optimalweb/text.htm" target="_blank">http://psychology.wichita.edu/optimalweb/text.htm</a> <br>  <br>&gt;&gt; As for color, as long as there is sufficient contrast between the text and the background, many color combinations are possible. However, most studies have shown that dark characters on a light background are superior to light characters on a dark background (when the refresh rate is fairly high). For example, Bauer and Cavonius (1980) found that participants were 26% more accurate in reading text when they read it with dark characters on a light background. Moreover, a survey by Scharff, et al. (1996) revealed that the color combination perceived as being most readable is the traditional black text on white background. However, it is common for websites (such as this one) to have an off-white background in order to reduce the flicker and glare associated with white backgrounds. &lt;&lt;</p>
