    html: "<p>From what i've read, William, your thesis isn't so \"well estabilished knowledge, [and] confirmed by contemporary research\". Many scientists write in a complicated way, for a simple reason : their audience know the words they use, and then there are no reasons not to use them (words, or specific expressions). Would you expect a doctor not to use the terms he learned when he speaks to peers but explain in detail and with everyone-understandable language sentences ? That's nonsense. <br>Then, there's indeed a fancy to speak complicated, that i've used myself, and that i've learned to reject as i'm going to be a journalist. But i know in some situation, and precisely experts ones, it's more useful than critiquable. <br> <br>And William, i respect your (the other William) view on that. It's just the absolute way you express it that disturb me.</p>"
