    html: "<p>I have not yet read the TYPO 13 articles, so I'm not going pontificate as I usually do. But I am intrigued by the possibility that empirical research might answer some of the most difficult questions facing typographers, in particular how to best space type. I really admire the <a href=\"http://clearviewhwy.com/ResearchAndDesign/index.php\">work</a> that the Clearview people did in <i>testing</i> different letterspacings to determine the optimum legibility. Perhaps analogous research can be done for readability. <br> <br>The questions I would most like to see answered are: <br> <br>1. What letterspacing optimizes readability? In Jenson's 1470 Eusebius, the space between nn is almost the same width as the inner space of the n. By the mid-16th Century <i>Comensis Episcopi Nucerni</i> (I'm working from a scan from Updike's &lt;i&gt;Printing Types&lt;/i&gt;), that width had become about 3:4. And of course 1960's and 70's phototype took the trend to an extreme. Who's right? To my eyes, the Comensis is a striking example of beautifully spaced old metal type. <br> <br>2. Should the goal be a completely even page color, where all spaces between letters appear to have exactly the same width, or do subtle variations in spacing help with word recognition? <br> <br>3. Assuming that subtle variations are desirable, should they be based on metal type standards, or some other principle? To my eyes, pe and oo are two common round-round pairs that usually appear tight, while ob and oy are usually loose. These variations arise naturally from metal type technology, and have survived into the digital age. <br> <br>4. Should letter spaces be absolutely consistent, so that all images of the same letter-pair look identical? One thing I see frequently in older printed samples but very rarely in modern works is a hairline space slipped into a word. I have not discovered the logic behind the placement of such spaces (Burnhill touches on this point in his book <i>Type Spaces</i>), but am very curious to find what effect they had on readability. <br> <br>5. How does size affect optimal letterspacing? It is nearly universal for smaller sizes of metal type to be spaced more loosely than larger sizes, but this component of optical scaling is usually missing from digital typography. <br> <br>Of course, the interaction between letter shapes and spacing opens many cans of worms, because of the huge diversity of letter shapes. I'd be interested in answers to the above questions even assuming the letter shapes are from a traditional roman text font.</p>"
