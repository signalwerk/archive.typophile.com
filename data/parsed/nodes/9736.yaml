    html: <p>Great questions, Raph.  <br> <br>Steve, whatever his personal shortcomings - and I have no idea - Fowler did have a great eye for some things - like 'abstractitis' - that make writing worse and better. The fact that it is still in print 75 years later is a tribute to the fact that it was a breakthrough book in its field. <br> <br>Williams is better as his advice is more flexible and nuanced. For example, he is not simply for or against nominalization, for or against passive voice. He tells you when each helps and hurts. I suspect that his advantage is that he applies linguistic insights developed since Fowler's day. He also thinks issues of correct word usage - the usual obsession, including Fowler - are of secondary importance.</p>
