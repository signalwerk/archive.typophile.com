    html: "<p>Nick: your example is illuminating, but in my opinion speaks more to the difficulty of deciding what constitutes even letterspacing than the  <br> <br>BTW, does anyone have more info on InD's optical kerning feature than what's in <a href=\"http://www.typophile.com/forums/messages/4101/28888.html?1082153197\">this thread</a>? See also this fascinating <a href=\"http://www.ics.uci.edu/~eppstein/gina/kern.html\">comp.fonts discussion</a>. I'd be especially interested to know if anyone else has followed up on Chuck Bigelow's ideas of using low spatial frequencies. That idea would seem to resonate rather strongly with more recent theories about the role of the parafovea. <br> <br>I also found a link to <a href=\"http://www.iginomarini.com/ikern.html\">ikern</a>, which claims to be better than InDesign's optical kerning. <br> <br>John: I see your point about the problem in translating \"rhetorical strategies\" to \"writing style\". But what can I say? At the time of their preparation, the text in place, and the presentation on which it was based, was what I could manage.</p>"
