    html: <p>Speaking as a working designer, not academically inclined (and not inclined to the computer lab either), I think Peter Enneson's article is bang on. Yes, it's difficult, and some of his paragraphs have to be read several times, but this is a complex subject, and the humanist, intellectual approach does it more justice than the grandiose, simplistic notion of "The Science of Word Recognition" (Lorne Greene voice). <br> <br>Wouldn't it be nice if there were some easy science that we could learn about reading, so that we could be better type designers and typographers? No, because once it's reduced to easy science, the job will be automated.</p>
