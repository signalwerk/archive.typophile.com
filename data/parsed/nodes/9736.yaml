      <p>Where type design matters most, in terms of readability, is almost always linked to specific reproduction or rendering conditions, and the better those conditions are the less type design matters <em>to readability</em> and, conversely, the more it matters in terms of aesthetic, cultural and stylistic concerns, in which mere variety is not the least of benefits. We have such a rich typographic heritage precisely because over 550 years we have developed methods of reproduction that render most distinctions in terms of readability between different text faces moot. If something is going to be well printed at typical text sizes, no designer wrings his hands and says ’Oh dear, I wonder whether Caslon is more minutely readable than Garamond or the other way around’. Typographic design decisions on the plateau provided by readerability, non-visual information and good reproduction conditions are almost never concerned with readability, and almost entirely concerned with aesthetic, stylistic, etc. considerations. It is only as the reproducion conditions are reduced in quality — e.g. sub-normal text sizes, poor paper stock, low resolution,  etc. — that readability <em>as an aspect of type design</em> increases in importance. And in order to design readable text types for such conditions <em>you need to know precisely what the conditions are.</em> This is why a typeface that has been carefully designed to be readable on screen using a particular rendering system is not going to be a model of readability if used to print a telephone directory. Readability is totally dependent on output conditions. So where I disagree with Hrant is that he seems to want to make readability the primary focus of the type designer’s general work, whereas I see it as a specialised aspect of that work that is of relative importance depending on output conditions.</p>
      <p>By the way, the specialisation of type design for reduced reproduction quality can lead to some interesting imbalances. Poor conditions tend to get lumped together, e.g. telephone books are printed very quickly on poor quality paper <em>and</em> at small sizes, so type designers making fonts for use at very small sizes tend to assume other conditions will also be sub-optimal. Mark Barratt gave a very interesting presentation at ATypI in Helsinki about selecting fonts for use in mass-mailed response forms, which are set at very small sizes indeed but incredibly well printed on coated stock. He found very few types that were appropriate to this task in part, I think, because most types designed for use at very small sizes presume poor printing conditions. If the printing is so good that ink traps and other readability enhancing features designed for less good reproduction conditions are distorting the letterforms even at 5pt, the font is not appropriate. Through this project, Mark ended up identifying a poorly supplied niche in the type market.</p>
