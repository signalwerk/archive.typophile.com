    html: <p>I confess, I come from a scientific, empirical background. My mother is a research scientist (although before that, she was an artist. I picked up much of my early fascination with lettering and ornament from her) and my father is a lawyer. One of my best friends is a postgraduate researcher in molecular biology, and another is completing a PhD in (wait for it) artificial intelligence and visual recognition. I myself studied computer science in school, and have spent the last ten years working as a software engineer (which is something very different). It's possible I have a prejudice towards falsifiability and materialistic analysis of data rooted in quantifiable phenomena (although I'm not sure where "monotheism" is supposed to enter the picture). <br> <br>At the same time, I'm a reader first and foremost. Thanks to an early exposure to critical theory, I'm comfortable with "difficult discourse", and I've come to see the value of inductive, intuitive reasoning as used by postmodern philosophers like Jacques Derrida and Julia Kristeva. Any philosophy that restricts itself to the world of empirical data is not going to be a very useful philosophy, and there are few experiences more rewarding than the "aha" that comes with reasoning my way through a knotty bit of metaphysics and finally grasping it for myself. <br> <br>Reading is both a physical process and an act of cognition. One is the domain of research, and the other of cognitive psychology and philosophy. I think that if we're going to talk about the readability of the *form* of a text (that is, its layout, typeface, and other formatting choices, independent of the words composing the text itself), we have to unbundle the overloaded word "reading". There is type, there is layout, and there is text. We recognize letter- and / or word-forms, we follow their flow across the page, and we process the text itself. These are all independent acts, some more mechanical than others. <br> <br>Hrant, you clearly imply in your article that you value the notion of "readability" over "legibility". You seem to believe that research into legibility that fails to account for readability is compromised or even useless, but I'm unable to determine why you believe that readability subsumes legibility in such an overwhelming way. It seems to me that the research Kevin Larson summarizes (not synthesizes; his paper is clearly an effort to help typographers understand the state of play in cognitive research, rather than to advance any thesis of his own) is concerned with the mechanical aspects of reading and how they relate to legibility, and I don't really see where or how you undercut that research, except to dismiss legibility as unimportant next to readability. When you do try to attack things head-on, that's exactly where things start to get woolly. <br> <br>For example, you say that undergraduate students may have less reading "ability" than post-graduate students, but I don't see this is relevant to the discussion of *how* people read. I have no doubt that I have the capacity to read much faster than I did ten years ago, but I doubt (although am unsure) that the mechanisms I use to pick words off the page have changed. The process by which I analyze those words has changed tremendously, but the mechanical act of reading is essentially the same for me now as it was 20 years ago, when I was starting high school. <br> <br>You also claim to demonstrate that the PL model of word recognition is inadequate, but only by going far beyond the remit of the studies on which the model is based. What this suggests to me is that we need more data, so we can see if your intuitively-devised theories and the data we can gather will match. I don't think it's enough to say, "I'm sure the way I'm doing things is an improvement, because that's what my theory tells me." At least, that doesn't convince me that you're not selling me snake-oil or just plain deluded. <br> <br>I keep chiming in on this thread because I want to know how type works. It's easy to say, for example, that serifs work by creating rails of horizontal stress in a text, but I feel uneasy taking that notion on faith. Typography is one of the last great guild professions; there are clearly masters, and yeomen, and apprentices, and there's a huge body of accumulated wisdom secreted away here and there in books. At least some of the conventional wisdom in any profession as old as typography and bookmaking is guaranteed to be false</p>
    html_clean: <p>I confess, I come from a scientific, empirical background. My mother is a research scientist (although before that, she was an artist. I picked up much of my early fascination with lettering and ornament from her) and my father is a lawyer. One of my best friends is a postgraduate researcher in molecular biology, and another is completing a PhD in (wait for it) artificial intelligence and visual recognition. I myself studied computer science in school, and have spent the last ten years working as a software engineer (which is something very different). It's possible I have a prejudice towards falsifiability and materialistic analysis of data rooted in quantifiable phenomena (although I'm not sure where "monotheism" is supposed to enter the picture). <br> <br>At the same time, I'm a reader first and foremost. Thanks to an early exposure to critical theory, I'm comfortable with "difficult discourse", and I've come to see the value of inductive, intuitive reasoning as used by postmodern philosophers like Jacques Derrida and Julia Kristeva. Any philosophy that restricts itself to the world of empirical data is not going to be a very useful philosophy, and there are few experiences more rewarding than the "aha" that comes with reasoning my way through a knotty bit of metaphysics and finally grasping it for myself. <br> <br>Reading is both a physical process and an act of cognition. One is the domain of research, and the other of cognitive psychology and philosophy. I think that if we're going to talk about the readability of the *form* of a text (that is, its layout, typeface, and other formatting choices, independent of the words composing the text itself), we have to unbundle the overloaded word "reading". There is type, there is layout, and there is text. We recognize letter- and / or word-forms, we follow their flow across the page, and we process the text itself. These are all independent acts, some more mechanical than others. <br> <br>Hrant, you clearly imply in your article that you value the notion of "readability" over "legibility". You seem to believe that research into legibility that fails to account for readability is compromised or even useless, but I'm unable to determine why you believe that readability subsumes legibility in such an overwhelming way. It seems to me that the research Kevin Larson summarizes (not synthesizes; his paper is clearly an effort to help typographers understand the state of play in cognitive research, rather than to advance any thesis of his own) is concerned with the mechanical aspects of reading and how they relate to legibility, and I don't really see where or how you undercut that research, except to dismiss legibility as unimportant next to readability. When you do try to attack things head-on, that's exactly where things start to get woolly. <br> <br>For example, you say that undergraduate students may have less reading "ability" than post-graduate students, but I don't see this is relevant to the discussion of *how* people read. I have no doubt that I have the capacity to read much faster than I did ten years ago, but I doubt (although am unsure) that the mechanisms I use to pick words off the page have changed. The process by which I analyze those words has changed tremendously, but the mechanical act of reading is essentially the same for me now as it was 20 years ago, when I was starting high school. <br> <br>You also claim to demonstrate that the PL model of word recognition is inadequate, but only by going far beyond the remit of the studies on which the model is based. What this suggests to me is that we need more data, so we can see if your intuitively-devised theories and the data we can gather will match. I don't think it's enough to say, "I'm sure the way I'm doing things is an improvement, because that's what my theory tells me." At least, that doesn't convince me that you're not selling me snake-oil or just plain deluded. <br> <br>I keep chiming in on this thread because I want to know how type works. It's easy to say, for example, that serifs work by creating rails of horizontal stress in a text, but I feel uneasy taking that notion on faith. Typography is one of the last great guild professions; there are clearly masters, and yeomen, and apprentices, and there's a huge body of accumulated wisdom secreted away here and there in books. At least some of the conventional wisdom in any profession as old as typography and bookmaking is guaranteed to be false</p>
