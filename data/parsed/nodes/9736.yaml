    html: <p>For those who are interested, <a href="http://tle.geoscienceworld.org/cgi/content/full/20/5/547%20" target="_blank">here</a> and <a href="http://tle.geoscienceworld.org/cgi/content/full/20/6/662" target="_blank">here</a> are brief summaries of Williams' book on good writing.  <br> <br>My friend who is director of the cognitive science program at Georgia Tech tells me that the 'storytelling' model of human understanding is now scientifically recognized as one of the best.  This confirms Williams' view that when writing follows that model, it is most direct and easily understandable. When it departs further and further it becomes harder and harder to understand.   <br> <br>Williams has also drawn upon much research in linguistics, as he acknowledges in his book. Of course Williams' book is much better than the summary, but this will give you a taste of what I think is an outstanding work.</p>
    html_clean: <p>For those who are interested, <a href="http://tle.geoscienceworld.org/cgi/content/full/20/5/547%20" target="_blank" class="link-external">here</a> and <a href="http://tle.geoscienceworld.org/cgi/content/full/20/6/662" target="_blank" class="link-external">here</a> are brief summaries of Williams' book on good writing.  <br> <br>My friend who is director of the cognitive science program at Georgia Tech tells me that the 'storytelling' model of human understanding is now scientifically recognized as one of the best.  This confirms Williams' view that when writing follows that model, it is most direct and easily understandable. When it departs further and further it becomes harder and harder to understand.   <br> <br>Williams has also drawn upon much research in linguistics, as he acknowledges in his book. Of course Williams' book is much better than the summary, but this will give you a taste of what I think is an outstanding work.</p>
