    html: <p>I think those are terrific questions Ralph. <br> <br>One critique on my TYPO 13 contribution is that it does not provide enough detail to address any such questions. This is a valid critique. Unfortunately the state of the art in the psychology of reading is not to the point where understand reading nearly well enough. Of course progress is being made, and there are many terrific people currently working on the problem. <br> <br>In my opinion the biggest omission in my paper is any discussion of letter recognition. The crux of the paper is that letters are the primary perceptual unit in reading. The paper presents evidence that we are using letters to recognize words both in the fovea and in the parafovea (contrary to earlier statements I do believe we use the parafovea to recognize letters as far as 15 letters out from the point of fixation). The next obvious question is how do we recognize letters. I need to answer that question satisfactorily in order to have a practical impact on type design. <br> <br>Peter</p>
    html_clean: <p>I think those are terrific questions Ralph. <br> <br>One critique on my TYPO 13 contribution is that it does not provide enough detail to address any such questions. This is a valid critique. Unfortunately the state of the art in the psychology of reading is not to the point where understand reading nearly well enough. Of course progress is being made, and there are many terrific people currently working on the problem. <br> <br>In my opinion the biggest omission in my paper is any discussion of letter recognition. The crux of the paper is that letters are the primary perceptual unit in reading. The paper presents evidence that we are using letters to recognize words both in the fovea and in the parafovea (contrary to earlier statements I do believe we use the parafovea to recognize letters as far as 15 letters out from the point of fixation). The next obvious question is how do we recognize letters. I need to answer that question satisfactorily in order to have a practical impact on type design. <br> <br>Peter</p>
