    votes: null
    html: "<p>&gt;Word recognition is mediated by phonology, or the sound that a word makes. <br> <br>This proposition is common sensical, like the idea that we read by spelling words. <br> <br>Are there any relevant reading tests of deaf/dumb people? <br> <br>One way that the visual differs from the spoken is in the amount of words available for conscious perception; consciousness has a 4-second \"moving window\" duration (sorry, I can't remember the research details), and in that span the field of vision can contain many times more raw text than spoken words (discounting polyphony).   <br> <br>What of saccades that jump from paragraph to paragraph? Written text is frequently created with this expectation. Perhaps it is a principle of information structure that certain bureaucratic and legal documents are arranged by hierarchical, number-tagged paragraphs, but they are also read that way at first encounter, in light scan mode. Same thing with the PowerPoint  bulleted presentation style. And lists like timetables.  <br> <br>Imagine you are skimming the boldface names in a gossip column: how do you read those? I would assume that you blow right by celebrities you don't know or rate, and fixate on your faves. You wouldn't read the whole name (like those people in Russian novels always named in full with long unpronouncable names, whom the reader mentally refers to as Count V______ or A_____ A_____). So you'd be primed to recognize names like Brad or Gwynneth. Why would anyone read the whole word or mentally sound it? Surely the input \"four letter word, begins with B\" requires no further recognition -- until you're halfway through the sentence and discover you're reading about some playwright called Bard. <br> <br>But this is not immersive reading, it will be said. To which I reply, define immersion. And what's so immersive about lab tests that measure Word Recognition of separate- character type in terms of speed? <br> <br>Is reading active or passive? Certainly when you measure it in a lab, it is passive. As Kevin says, when forced, people can read all caps as fast as U&amp;lc. Research funded by Microsoft. <br> <br>Alternatively, when reading is active, the reader defines the terms of immersion, the kind of information he/she wants to get out of the text. <br> <br>The assumption is that word recognition tests can establish some basic, universal principles of reading, which, some believe, will help typographers and type designers. But these will not be universal, because they are based on passive reading of roman type (not handwriting), and the results will be crude and nasty. <br> <br>Well, those with power get to define reality. I would expect that in the future, generative typographic technologies will be developed from the understanding of reading acquired in the world of corporate research. These will be based on reductive models, driving the human interest into more complex, organic forms -- handwriting in particular -- and into more advanced theroretical areas, such as quantum mechanics. <br> <br>The reductive, first generation artefacts will be refined, as in the way \"we\" have moved from Arial to Calibri. But in the meantime, progress means an awful lot of Arial.</p>"
