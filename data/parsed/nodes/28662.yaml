  html: |-
    <p>And now for the second part of my current Type ID problem :-)</p>
    <p>This handwritten script was for "The Kings: Unstoppable" album/CD. I'm trying to determine if a font was used for this. I have searched hundreds of handwriting fonts, tried Identifont, What The Font?, and again looked through quite a few font sites- again, not much luck.</p>
    <p>The CD was released in 1993. The member of the band I spoke with wasn't sure if fonts were used or not. Unfortunately it's the highest res version I have at this point.</p>
    <p>Thanks for reading,<br>
    -Mike</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/unstoppable_6602.jpg"></div><p></p>
