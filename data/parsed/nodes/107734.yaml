      <div class="comment-spam-body"><p>The "Oberg" line is Bookman Black (vendor unknown). If only a roman exists, then it needs to be condensed to 80% and slanted 15°. The second line I cannot identify; it is too fuzzy.</p>
      <p>[edit]<br>
      In addition, the /G in "Oberg" has been modified.</p>
