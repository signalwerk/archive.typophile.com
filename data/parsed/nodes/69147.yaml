    <p>from Fournier's <em>Manuel Typographique</em> (1760s)</p>
    <p><em>The punchcutter should neglect no means of imparting to his work the greatest perfection. Before entering upon it he should consider deeply of everything that may help to give it the greatest possible beauty. Unlike many trades, in which indifferent productions find a use proportionate to their worth, printing must have the best: not even the second best will serve; for it costs as much to cast and print ill-cut letters as to cast and print the very best; therefore if the punchcutter lack the necessary skill, the founder and the printer who reproduce his work, the one on metal and the other on paper, neither being in the least able to alter it, will only be giving permanent proof of his ignorance and dishonouring printing.</em></p>
