    html: |-
      <p>Another great quote in that vein, from Linotype's 1923 <em><strong>The Manual of Linotype Typography</strong></em>:<br>
      <em><br>
        The staffs of many printing offices lack any one with sufficient technical knowledge and creative feeling to originate pages beyond the commonplace. As a result, the output suffers from uninspired monotony, and there is nothing to attract new business, or to develop old customers into larger users of print.<br>
      <em><br>
        In other printing offices, no attempt is made to create even commonplace pages. Instead of this, books and catalogues already issued are used as models and copied boldly. Unfortunately, the type pages so imitated are frequently inferior, or, at best, the imitation is only an imitation, because the imitator has not grasped the principles which make the original design good.</em></em></p>
