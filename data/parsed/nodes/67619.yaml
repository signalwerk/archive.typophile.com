      <p>@ Theunis: thanks! If I understood correctly, a son of Jan Timman would be also Janszoon if he/she was born during the Baroque. AFAIK, this kind of middle name also exists in Russian.</p>
      <p>@ Florian: nice found. The Dutchmen tried to implement a print service here but unfortunately it did not succeed. Just in middle 1700s, after a century, a printer began to produce books in Rio – and soon was prohibited by Portugal and the Inquisition.</p>
      <p>Nice thread.</p>
