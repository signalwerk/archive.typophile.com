      <p>Olá Buggy. Pesquisei rapidamente e a dificuldade é porque o nome pelo qual ficou mais conhecido é Pieter Saenredam. O Janszoon às vezes é omitido e outras fica abreviado (Jaensz.). Pelo que descobri, ele era pintor, sendo o primeiro a retratar com realismo e perspectiva correta o interior de várias igrejas na Holanda.</p>
      <p>A Wikipédia em holandês tem algumas informações sobre ele, mas não faz qualquer referëncia sobre seu trabalho no Brasil ou como tipógrafo:<br>
      <a href="http://nl.wikipedia.org/wiki/Pieter_Jansz._Saenredam" title="http://nl.wikipedia.org/wiki/Pieter_Jansz._Saenredam">http://nl.wikipedia.org/wiki/Pieter_Jansz._Saenredam</a></p>
      <p><strong>English:</strong><br>
      Through a quick search, it seems Pieter has better known as Saenredam. Janszoon appears sometimes in abbreviated form (Jaensz.) in web searches. He was mainly a painter, the first to adopt correct perspective and realism to picture the inner of churches in Nederlands.</p>
      <p>Dutch version of Wikipedia brings some other information, although does not mention any work made in Brazil or as typographer:<br>
      <a href="http://nl.wikipedia.org/wiki/Pieter_Jansz._Saenredam" title="http://nl.wikipedia.org/wiki/Pieter_Jansz._Saenredam">http://nl.wikipedia.org/wiki/Pieter_Jansz._Saenredam</a></p>
