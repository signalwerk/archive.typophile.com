      <p>Janszoon is the Dutch equivalent of Johnson, Jackson, Robertson, and Williamson. It's generally used as a sort of middle name, but it survives to this day as the common surname Jansen (also sp. "Janssen").</p>
      <p>I imagine the abbreviation was to save a second in writing :-) It was quite common. The female equivalent is "dr.", as in "Kenau Simonsdr. Hasselaar" (who, by the way, was a woman so fearsome that "kenau" is used to this day to describe particularly self-assertive women ;-))</p>
