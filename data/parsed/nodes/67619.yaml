    <p>hi guys,</p>
    <p>this is my first post and i hope someone can help me.</p>
    <p>i'm a brazilian type design teacher interested in my country's history.</p>
    <p>reading more about this i've found one particular name: Pieter Janszoon, a dutch typographer who was invited to work in Brazil by Johan Maurits van Nassau-Siegen on 1642.</p>
    <p>i was looking for him at Duth Type's pages and i found nothing.</p>
    <p>well, can you give any clues about this subject?</p>
