    <p>Hello,</p>
    <p>Does anyone know what this typeface is? Or if it exists as a typeface at all?</p>
    <p>It's from Muller-Brockmann's A History of Viual Communication book (page 167 for those who have it).</p>
    <p>Thanks in advance for your answers.</p>
