      <p>Your image, shows a German advertisement  from from about 1900. The heading is in Lapidar, an original typeface by Genzsch &amp; Heyse dating from before 1895.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Lapidar@GenzschHeyse1902_16pt_4477.jpg"></div><br>
      AFAIK Lapidar has not been digitized under this name, which is in owned as the trade name for other designs.<br>
      Don<p></p>
