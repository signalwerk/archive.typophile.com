  html: |-
    <p>I picked up one of my daughter's independent reader novel and thumbed through the pages (Dark Hills Divide, Scholastic Press). After trudging by way through a couple of dense books, my eyes rejoiced! It was so airy and easy to read (not sure what the typeface is). </p>
    <p>To my question, I am wondering which typefaces in novels you find the most readable.</p>
