    html: <p>Gary, you are probably right. I really don't know much about typography--though I do find it fascinating. Calluna, Amalia, Delicato, Calisto and Hoefler really look good to me. I also like Gentium. I know it is a relative newcomer and free, but really I think its a easy to read typeface.</p>
