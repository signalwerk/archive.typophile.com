    html: '<p>There are scores of text faces that, properly set, make a novel or any other book easy to read. I would not be surprised that if in the books you found "dense", the problem was not the choice of typeface, but typesetting and layout problems: text too small, not enough leading, lines too long, margins too narrow, etc. Maybe the quality of printing  was bad as well.</p>'
