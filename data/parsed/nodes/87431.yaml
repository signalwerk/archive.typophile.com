    <p>This is what I am interested in:</p>
    <p><a href="http://www.cambridge.org/servlet/file/store6/item6611030/version1/9780521152532_excerpt.pdf" title="http://www.cambridge.org/servlet/file/store6/item6611030/version1/9780521152532_excerpt.pdf">http://www.cambridge.org/servlet/file/store6/item6611030/version1/978052...</a></p>
    <p>Note the entry for "a" for example (all typefaces used) and "Pronouncing the letter A" box. Are the headwords in Lucida Sans Unicode? :confused: (The IPA typeface is Charis SIL, I believe.) I've checked the document properties, but the typeface names are written 'non-explicitly'.</p>
    <p>Which typefaces does this dictionary use?</p>
