    <p>Born: 1967 in LIllehammer, Norway<br>
    still alive.</p>
    <p>Designer of <a href="http://www.vllg.com/Thirstype/Pilot/mudTyper+Weights/" rel="nofollow">Pilot</a> (1995), Envy (currently <a href="http://www.melkeveien.no/portfolio/index.php?pid=112&amp;cat=typografi&amp;offset=15&amp;sstrn=&amp;scat=15" rel="nofollow">exclusive to Revolution Magazine</a>), <a href="http://www.vllg.com/Thirstype/Radio/mudTyper+Weights/" rel="nofollow">Radio</a> (1998), <a href="http://www.vllg.com/Thirstype/SuperDuper/mudTyper+Weights/" rel="nofollow">SuperDuper</a> (1999), Telenor (<a href="http://www.melkeveien.no/portfolio/index.php?pid=135&amp;cat=typografi&amp;offset=0&amp;sstrn=&amp;scat=15" rel="nofollow">corporate face</a> for Telenor phone company), <a href="http://www.melkeveien.no/portfolio/index.php?pid=146&amp;cat=typografi&amp;offset=0&amp;sstrn=&amp;scat=15" rel="nofollow">Schytte Berg</a> a Jugend font based on the architecture and of the norwegian Jugend architect H. Schytte Berg. In 2001 Magnus designed the logo for <a href="http://www.melkeveien.no/portfolio/index.php?pid=150&amp;cat=typografi&amp;offset=0&amp;sstrn=&amp;scat=15" rel="nofollow">Eye Magazine</a>. Magnus' fonts are distributed by <a href="http://www.vllg.com/Thirstype/" rel="nofollow">Thirstype</a> through <a href="http://www.vllg.com/" rel="nofollow">Village</a>.</p>
    <p>Magnus Rakeng's <a href="http://www.melkeveien.no/portfolio/index.php?pid=450&amp;cat=typografi&amp;offset=0&amp;sstrn=&amp;scat=15" rel="nofollow">home page</a>.</p>
