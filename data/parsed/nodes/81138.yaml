    <p><a href="/wiki/Link%3A%20http%3A/%252Fir.monotypeimaging.com/releasedetail.cfm%3FReleaseID%3D568403%20" class="freelinking" rel="nofollow"> FontExplorer X Pro 3.0</a></p>
    <p>Monotype Imaging Holdings Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, and its subsidiary, Linotype GmbH, have introduced version 3.0 of FontExplorer® X Pro for Macintosh® platforms. The latest version is now available from <a href="http://www.fontexplorerx.com" title="www.fontexplorerx.com">www.fontexplorerx.com</a>. </p>
    <p>New capabilities include a transparent font slideshow feature, which allows users to place text over an existing document in a preview window and change the desired fonts automatically. A new "character toolbox" capability displays information on the languages supported by a particular font, in addition to specific characters available. Other new features include the ability to compare fonts relating to their ink and paper consumption during printouts. An "ad-hoc groups" function facilitates a simpler approach to organizing fonts. Users can also choose a selection of fonts that can be easily organized into a group or intelligent set. In addition, support for French has been included in FontExplorer X Pro 3.0. </p>
    <p>Independent plug-ins and additional improvements<br>
    Updates of new plug-ins that support programs such as the Adobe® Creative Suite® applications are now independent of FontExplorer X Pro release updates. Fonts hosted on a server are now downloaded automatically by the plug-ins on demand. Character sets may be imported directly from Suitcase Fusion™ 2 or 3 software, as well as the FontAgent Pro™ application. Plug-in support for the QuarkXPress™ 9 application is also built in to FontExplorer X Pro 3.0. </p>
    <p>Logos and images can now be included when printing a choice of fonts. In addition, the feature, "search document for fonts" has been updated to provide more detailed search results. </p>
    <p>Free upgrade for licenses after Jan. 1, 2011<br>
    FontExplorer X Pro is available at <a href="http://www.fontexplorerx.com" title="www.fontexplorerx.com">www.fontexplorerx.com</a>, where users can also upgrade to the latest edition from earlier versions. Customers who have licensed FontExplorer X Pro after Jan. 1, 2011, may receive a free upgrade to version 3.0. Customers of 2.x releases may purchase an upgrade for $29 U.S. or €29 (including VAT) or ₤22 (excluding VAT). A valid FontExplorer X Pro serial number is required when downloading the version 3.0 upgrade. FontExplorer Pro 3.0 is available at $79 for a single user license or €79 (including VAT) or ₤59 (excluding VAT). </p>
    <p>About Linotype<br>
    Linotype GmbH, based in Bad Homburg, Germany and a wholly owned subsidiary of Monotype Imaging Holdings Inc., looks back onto a history of more than 120 years. Building on its strong heritage, Linotype develops state-of-the-art font technology and offers more than 10,000 typefaces, covering the whole typographic spectrum from antique to modern, from east to west, and from classical to experimental. All typefaces (in PostScript® and TrueType® format as well as more than 7,000 fonts in the OpenType® format) are now also available for instant download at <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>. In addition to supplying digital fonts, Linotype also offers comprehensive and individual consultation and support services for font applications in worldwide (corporate) communication. </p>
    <p>About Monotype Imaging<br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
