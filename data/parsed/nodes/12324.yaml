      <p>Once upon a time.. Just kiddin</p>
      <p>I made a Kids magazine time ago. I can give you these tips.<br>
      1.- use a one-column layout. kids gets losed in multiple columns…<br>
      2.- use a geometric font (i like Futura, have a lot of weights). why geometric?, becouse the ‘a’ and ‘g’ glyps. Some kids can’t recognize or get confused with the shapes of different fonts.<br>
      3.- Use font in large size: 12 and up…<br>
      4.- Most important: BE CAREFULL, even more than other designs. Kids believe everything you publish, so take a time to check everything.<br>
      5.- EVEN most important: HAVE FUN. (i miss a lot that magazine)</p>
      <p>Hope it helps</p>
