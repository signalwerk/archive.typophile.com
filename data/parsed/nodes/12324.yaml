      <p>I don’t agree about the advice to use geometric fonts. Elsewhere on typophile people have said that there is no evidence that children have more trouble with a two storied a and g. I think this is just a persistent myth. </p>
      <p>The ‘have fun’ advice sounds great though!</p>
