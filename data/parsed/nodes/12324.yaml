    <p>Hi everybody,</p>
    <p>I’m going to design some storybooks for kids and teenagers, does anybody knows good references? I would like to know font suggestions too. I’ve noticed, at least here in my country, that many books of this kind uses fonts like Garamond set in 12pt or more, and I would like to avoid this.</p>
    <p>Thanks,</p>
