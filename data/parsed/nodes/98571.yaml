      <p>Today's outpouring may not have been from accounts at all (new or otherwise). There were hundreds of posts by the same poster into multiple topics at exactly the same time. This led me to the conclusion that the site has been hacked; someone is going directly into the website, accessing the server files directly and loading up new content without having to go to each topic separately. I've expressed this view to Chris.</p>
      <p> - Herb</p>
