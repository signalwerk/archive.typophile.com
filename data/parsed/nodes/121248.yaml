      <p>A well-designed card. </p>
      <p>Just one suggestion: I’d like to see more contrast between “software” and “nerd.” </p>
      <p>Try to find a typeface with a light weight (for software) or a heavy/black weight (for nerd) as opposed to just roman and bold, and I think you’ll be golden (the red you use for nerd on your website helps, but even there you could benefit with some weight contrast between the two words).</p>
