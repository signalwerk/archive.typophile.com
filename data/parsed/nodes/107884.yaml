      <p>Hi damn1990,<br>
      Definitely not Clarice Black and Don's probably right about it being a custom logotype (registered ®), but pretty simple though - all straight lines and circles.<br>
      There is some info and a video about the WWF logo and it's development here:<br><a href="http://www.logodesignlove.com/world-wildlife-fund">http://www.logodesignlove.com/world-wildlife-fund</a></p>
      <p>I also noticed your other request regarding other "WWF lungs typo" info, so I feel I should refer you to the info available from their website in respect of using site content. This is the legal bit, I guess!<br><a href="http://wwf.panda.org/using_site_content/">http://wwf.panda.org/using_site_content/</a></p>
      <p>Hope this helps<br>
      Doghouse</p>
