      <p>Larger image:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/WWF_6078.jpg"></div><br>
      Not Clarice Black and probably a custom design.<br>
      The base letters may have been derived from a font like Radiant Black<br>
      <a href="http://www.myfonts.com/search/radiant/fonts/" title="http://www.myfonts.com/search/radiant/fonts/">http://www.myfonts.com/search/radiant/fonts/</a><br>
      or Castle Ultra<br>
      <a href="http://www.identifont.com/show?2MG" title="http://www.identifont.com/show?2MG">http://www.identifont.com/show?2MG</a><br>
      using overlapping Vs to make a W  with the center strokes meeting in a "T" to the left, and rounding the corners of the Ws and F to make  soft and "friendly" letters.<br>
      Don<p></p>
