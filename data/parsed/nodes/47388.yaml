      <p>I think it is a case-by-case issue. What looks good for a prticular font is good but not necessarily law for all fonts.<br>
      I like #2 best in the above tlde case. For ogoneks, I make different ones for i than for wider letters and for curved bottom letters like u, I make a joining adjustment.</p>
      <p>ChrisL</p>
