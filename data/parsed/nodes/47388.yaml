  html: |-
    <p></p><div class="imageWrap"><img src="/files/accents_5940.png"></div><br>
    Top: accents all the same size.<br>
    Middle: lower case and small cap accents are the same size, cap accent slightly bigger.<br>
    Bottom: accents progressively sized.<p></p>
    <p>In many faces (but not all), I vary the angle of the acute, grave and circumflex/caron accents between cap, small cap and lower case.<br>
    However, I always make the tilde, ring, dieresis etc. the same size—through laziness as much as anything else, I guess.<br>
    However it ocurred to me while making the “N small cap with tilde” accent here that perhaps these accents should be sized according to case. (Actually, I have had this thought before, concerning the “attached accents”, ogonek and cedilla.)<br>
    I wonder if there are any types where this has been done?<br>
    Is it a good idea?</p>
