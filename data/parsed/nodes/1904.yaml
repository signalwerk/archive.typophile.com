    html: "<p>Jean: here are the new numerals. I am not sure what  <br>you mean by the \"georgia\" reference. Care to explain? <br> <br>Peter: A regular 'E' looks peculiar, with or without a  <br>curved foot. That was one of the first things I tried, it  <br>just doesn't seem to work with the rest of the letters <br>in the word \"elizabeth\", which is my test word because  <br>of my mum's shop - the reason I am making this face. <br>The upswing on the Z looks a little odd as well.  <br> <br>William: here is a shorter 'J'. I also made the foot on the <br>'L' a little shorter as well. Daidala - thanks for the link! <br>I didn't know about this site, there are some wonderful, <br>well written articles there. <br> <br>I will make some more ligatures at some stage, but now <br>I have to concentrate on getting things printed for the <br>exhibition. Thanks all for the comments and  <br>encouragement! <br> <br> <br> <img src=\"http://www.typophile.com/forums/messages/29/19710.jpg\" alt=\"\"></p>"
