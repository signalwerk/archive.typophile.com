    html: <p>In the 'Old Georgia' model that Rodolfo supplied, it seems that the lower numbers extend higher than in your showing, and the high numbers - 6,8 - are only cap height, whereas yours are higher.  <br> <br>Note, though, that this 'unicase' numeral experiment was dropped for Georgia. I think that your lining figures go well with your all-cap alphabet, and the hanging numerals should be reserved for a small cap or lower case font.  <br></p>
