  - id: 15076
    user: 1250
    date: 2003-11-05T09:44:00
    date_raw: 5 Nov 2003 — 9:44am
    votes: null
    html: <p>&gt; this 'unicase' numeral experiment was dropped for Georgia. <br> <br>Arguably against the wishes of Carter, and certainly against those of many sensitive users. <br> <br>As far as I'm concerned, hybrid numerals (as they're generally called) are superior to both lining and "traditional" old-style for running text, except for fonts with very large x-heights, which are unusable for long text anyway. Lining numerals are horsey, while traditional old-styles are pedantic and less legible. <br> <br>BTW, it's not so "experimental" - hybrid numerals are actually becoming more common, although still pretty rare. As for their age, some people say Richard Austin (a really dead guy) pioneered them. <br> <br>hhp <br></p>
