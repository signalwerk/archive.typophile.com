    html: '<p>&gt;more alternates and ligatures. <br> <br>I agree with Chris. These are so strong, that given the probable use of this font more would enhance it.  <br> <br>You might consider making a shorter J - more on the order of the tail of the Q the standard, and the long descender an alternate. Also should the foot of the L be a little shorter for spacing purposes? <br> <br>In this installment of daidala: <br><a href="http://daidala.com/07feb2003.html" target="_blank">http://daidala.com/07feb2003.html</a> <br>Jon Coltz interviews Jonathan Hoefler, and if I remember rightly, here Hoefler he says some interesting things about an all upper case font vs one with lower case. This might interest you as you consider where to take this.   <br> <br></p>'
