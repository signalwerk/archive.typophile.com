    date_raw: 3 Nov 2003 — 9:15am
    votes: null
    html: <p>Kris, I guess what J-F means is, if you are going to create the oldstyle figures, you should have the lowercase characters. Or, you should have an "idea" of the x-height, at least.  <br> <br>The way it is, your typeface looks like an <i>"all-lowercase"</i> alphabet, not an all-caps one. <br> <br>For example. In most type families, both oldstyle and lining versions of "6" and "8" will have the same height. Which is usually something very close to the caps-height. In your sample, the oldstyle "8" is taller/bigger than the lining "8". That's why "they don't seem to be on same size." <br> <br>Hope this can help you. :-)</p>
