      <p>Thank you Matthieu.</p>
      <p>Hello Thomas,<br>
      Yes, U8 is a "revival"… quotes because, as far as we know, it was not a typeface in a formal medium.<br>
      It was Anton Koovit's goal to recreate a design that existed only on signs and keep the very particular and graphic feel of the face. All the elements you mentionned have obviously been considered and consciously kept in the final design. Having seen the typeface used (including for text!) by graphic designers we admire, we stand by the choices that have been made. Your value judgements about quality, usefulness or slavishness are duly noted, but quite frankly, we don't share them.</p>
