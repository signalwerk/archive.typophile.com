      <p>Hmmm. This seems to be lacking a number of optical compensations I think of as pretty well necessary, unless... is the intent to do a slavish revival of naive/vernacular lettering, even when that is less than useful for quality work?</p>
      <p>I am looking at these things:</p>
      <p>1) Where a straight transitions to a round looks glued on rather than gradual (hmnu).</p>
      <p>2) Where two strokes join, as in a curve to a straight, things get clotted because of lack of thinning at the join in the heavier weights (abdghmnpru).</p>
      <p>3) Some letters are getting just too dark overall in the heaviest weight and might benefit from selective stroke thinning (ag, maybe es).</p>
