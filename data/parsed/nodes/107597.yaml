    <p>In January we released U8. After a pretty busy year, we are happy to finally release the italics, making U8 our biggest family to date, with its 14 styles. As usual, you can obtain the U8 Trial fonts from our website: <a href="http://www.fatype.com" title="http://www.fatype.com">http://www.fatype.com</a></p>
    <p>Webfonts are also available, contact us for licensing.</p>
    <p><img src="http://www.fatype.com/img/fonts/U8/U8_1.jpg"><br>
    <img src="http://www.fatype.com/img/fonts/U8/U8_2.jpg"><br>
