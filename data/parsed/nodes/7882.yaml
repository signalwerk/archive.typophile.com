www.typophile.com/cgibin/show.pl?30/51340\" target=\"_blank\" class=\"link-lost\">http://www.typophile.com/cgibin/show.pl?30/51340</a> <br> <br>Best, <br>AS <br> <br> <br>PS/ <br>\"Good visionaries are rare. Good managers are rare. <br>Good managers who are also visionaries are extremely <br>rare. Worse, unlike pro football quarterbacks, <br>there are no public statistics we can examine for <br>how well our own managers performed on past projects <br>(Though it�s fun to imagine what statistics we would <br>want to keep). Many visionaries believe they are good <br>managers, and vice versa, but the shortage of these <br>skills suggests that most of them are wrong (Sorry, <br>but this probably includes you). The irreverent rule <br>breaker, big thinker, and authority challenger is <br>rarely the best person to track schedules, write <br>specifications, or ensure that paychecks arrive on <br>time. The kinds of personalities that lead to <br>achievement in these things differ significantly. <br>There are a handful of people in every organization <br>that have enough personality traits and skills to <br>cover both well, but most people don�t. And even <br>those rare souls that are good at both still have <br>gaps : everyone has some things they are better at <br>than at others (or more cynically, everyone sucks <br>at something, if not many things).\" <br><a href=\"http://www.uiweb.com/issues/issue36.htm\" target=\"_blank\" class=\"link-external\">http://www.uiweb.com/issues/issue36.htm</a></p>"
