  html: "<p>As from the thread [1] : <br><a href=\"http://www.typophile.com/cgibin/show.pl?30/51378\" target=\"_blank\">http://www.typophile.com/cgibin/show.pl?30/51378</a> <br>In Italian that was called 'Proto'-&lt;tipografo&gt;. <br>  Proto. <br> <br>I like this definition by Mr. Dmitry Kirsanov <br>very much : 'No other design discipline requires <br>so much learning and training as fontography, <br>and by no other aspect can amateurs be so easily <br>distinguished from professionals.� To be font <br>literate, a designer has to study the history <br>and the principles of font design.' <br> <br>I also consider what Jean-Baptiste Piggin said : <br>'The distinction between micro- &amp; macro-typography <br>was popularized by the book designer Jost Hochuli <br>and is now a commonplace in the German-speaking <br>countries. Whereas micro-typography involves <br>lettering� designing, choosing and mixing fonts, <br>spacing letters and punctuating words� macro- <br>typography is the business of laying out bodies <br>of text in logical and pleasing patterns : <br>distributing blank space, choosing colours <br>and conveying meaning by proper arrangement.' <br> <br>Since : <br> <br>Non c'� due senza tre <br>There is not two without three <br>No hay dos sin tres <br>Es gibt nicht zwei ohne drei <br>Il n'y a pas deux sans trois <br>Er is niet twee zonder drie <br>N�o h� duas sem tr�s <br>Det er ikke to uten tre <br>Gde dva tam i tri; Bez dvuh net treoh <br>Ei ole kahte ilma kolmeta <br>Nie ma dwoch bez trzech <br>Sann ga nakereba ni ha soko ni nai  <br>Ei kahta ilman kolmatta <br>D�r �r ikke tv� ingen tredje <br>Ma fisc thnin duna thlata <br> <br>Mr. Frank Lloyd Wright, on 1908 wrote : 'The <br>architect should strive continually to simplify ; <br>the ensemble of the rooms should then be carefully <br>considered that comfort and utility may go hand <br>in hand with beauty.' <br> <br>This post can be cross-referenced to this one : <br><a href=\"http://www.typophile.com/cgibin/show.pl?30/51340\" target=\"_blank\">http://www.typophile.com/cgibin/show.pl?30/51340</a> <br> <br>Best, <br>AS <br> <br> <br>PS/ <br>\"Good visionaries are rare. Good managers are rare. <br>Good managers who are also visionaries are extremely <br>rare. Worse, unlike pro football quarterbacks, <br>there are no public statistics we can examine for <br>how well our own managers performed on past projects <br>(Though it�s fun to imagine what statistics we would <br>want to keep). Many visionaries believe they are good <br>managers, and vice versa, but the shortage of these <br>skills suggests that most of them are wrong (Sorry, <br>but this probably includes you). The irreverent rule <br>breaker, big thinker, and authority challenger is <br>rarely the best person to track schedules, write <br>specifications, or ensure that paychecks arrive on <br>time. The kinds of personalities that lead to <br>achievement in these things differ significantly. <br>There are a handful of people in every organization <br>that have enough personality traits and skills to <br>cover both well, but most people don�t. And even <br>those rare souls that are good at both still have <br>gaps : everyone has some things they are better at <br>than at others (or more cynically, everyone sucks <br>at something, if not many things).\" <br><a href=\"http://www.uiweb.com/issues/issue36.htm\" target=\"_blank\">http://www.uiweb.com/issues/issue36.htm</a></p>"
