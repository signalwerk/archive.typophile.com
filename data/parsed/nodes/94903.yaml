    html: |-
      <p>Ryan,</p>
      <p>Thank you for those kind words. My core mission is to share the love…and make a few bucks doing it…because you gotta eat…and pay the rent…and all of the other stuff which, unfortunately, you need money to buy.</p>
      <p>Speaking of sharing the love, I gave a lot of free fonts away for awhile—as did a great many other folks—to share the love (and let me perfect my craft without charging people to buy my mistakes), until the good folks at ITC taught me that there was a buck to be made…because you know why. And a wonderful lady named Ilene Strizver taught me how the pros did it. More love shared, more opportunities to spread the love.</p>
      <p>Unfortunately, there are people ought there who thought that THEY ought to make a buck off all this love-sharing. For a time, I offered all of my free fonts on my website. The crooks, rather than simply downloading the fonts and posting them on their ad-supported sites, instead hot-linked to my site—which, at the time was metered. When it ended up costing me $800 in one year to share the love because these assholes were hijacking my bandwidth, I called off the lovefest. I know it sucks, but I get the message: "No good deed goes unpunished."</p>
      <p>So, live and learn. But, I am thinking, it would be really nice if some—if not all—of the folks I shared the love with showed a little of THEIR love by sending me one lousy dollar as a token of their appreciation.</p>
      <p>How many people is that? Hard to tell but, best I can figure, it's about three million people—maybe more, but certainly not a whole lot less. Since that number will be multiplied by one, it is not hard to do the math. If everyone who benefited from my love-sharing ponied up a lousy buck to show their appreciation, I could give ALL of my good stuff away for free…every last bit of it, and STILL have more money than I could possibly spend sensibly.</p>
      <p>If it comes to that, however, I will be sure to program it http referrer, and keep the jerks from making me pay AGAIN for simply sharing the love.</p>
      <p>So, as you can see, MY experiences with Orange Sunshine have left me a little loopy…</p>
      <p>P.S. If I ever do initiate this cockamamie scheme, I have GOT to get PayPal to turn off email notification below a certain threshold, because I DO NOT want to end up being pissed off because THERE IS WAY TOO MUCH GOOD NEWS in my inbox. If you catch my drift…</p>
      <p>Which you will, Ryan, because you have been there and done that…</p>
