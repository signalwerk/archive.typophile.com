    html: |-
      <p>Eben, the issue here is hardcoded in GDI ClearType: it doesn't know how to do symmetric smoothing.</p>
      <p>If you look at the latest <a href="http://www.microsoft.com/typography/otspec/gasp.htm" rel="nofollow">gasp table spec,</a> you'll see that the same flags have different meanings when applied to 'Font Smoothing' (non-CT aliasing/antialiasing) and 'ClearType with Symmetric Smoothing' (as in DWrite ClearType). GDI ClearType effectively ignores the gasp table: it is a fixed state for all sizes: x-direction subpixel smoothing and y-direction aliasing. As far as I'm aware, this can't be changed at the font level because when GDI ClearType was shipped Beat hadn't yet implemented symmetrical smoothing.</p>
    html_clean: |-
