    <p>I didn't find any similar threads on my question here so here goes:</p>
    <p>I want to try out webfonts for a website I'm currently designing. But when i was about to order the font + webfont license i came across the gallery on myfonts.com which show renditions in different browsers. The Mac rendition looks fine. But the ie7 looks horrible. Is that still the ase for ie8 and ie9?<br>
    Will I have big problems with webfonts across platforms? Because that jagged looking version is really not appealing.</p>
    <p>The example is not the font in question but the jaggedness is still the same.</p>
