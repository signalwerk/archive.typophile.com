      <p>Two things to consider about "actual-computer" systems:<br>
      1) A computer screen is viewed at a greater distance than a portable device, so the ppi doesn't need to be as high.<br>
      2) The more the pixels, the lower the performance. A 23" screen at a "Retina-like" resolution would be a major drag on some combination of: performance, portability, battery life and the wallet!</p>
