      <p>David: <em>For crystal clear search instructions on google pair the phrase "effectively triples" with the word Cleartype...</em></p>
      <p>Okay, I've done this, and it is sort of useful as an insight into lazy journalism and sloppy thinking, but at least provides a basis for me to clarify my own views. These are the top five links from that search:</p>
      <p><a href="http://www.ipowerweb.com/iboost/profit/other_revenue_streams/ebooks/tutorial/30020c.htm" rel="nofollow">‘Cleartype technology effectively triples the horizontal resolution of your screen to smoothen on-screen typography making it far easier to read.’</a></p>
      <p>Note that this, correctly in my view, explicitly associates the triple resolution claim with font smoothing, while incorrectly expressing this in terms of an effect on screen resolution. The secondary statement -- ‘making it far easier to read’ -- is uncritical journo bullshit. Far easier than what?</p>
      <p><a>‘ClearType effectively triples the horizontal resolution of the monitor. Certainly, this works better in some cases (resolutions, type faces, etc.) than in others. However, in my experience the opposite is true - I've never seen a situation that was made worse with ClearType enabled, but I've seen multiple situations where clarity is dramatically improved with it enabled.’</a></p>
      <p>This is a user comment on a forum, and as such represents a reader's taste and experience. It also represents some really poor logic, since if results depend on particular resolutions, typefaces, etc., then clearly ClearType is not ‘effectively tripling the resolution of the monitor’.</p>
      <p><a href="http://scien.stanford.edu/jfsite/Papers/ImageRendering/Displays/Farrell_et_al_SID2009.pdf" rel="nofollow">‘ClearType technology effectively triples the spatial resolution in the horizontal axis; but at the same time subpixel rendering<br>
      introduces color artifacts.’</a></p>
      <p>This is from the academic paper on the ‘Visual Preference for ClearType Technology’, which is all about ‘perceived image quality of text’. I'd want to ask Kevin Larson what the authors meant by ‘spatial resolution’, and to justify the claim based on that context. Note, however, that this paper is concerned with perceived image quality of the text, not reading (cf. my belief that all antialiasing, including CT, is primarily about the look of type on screen not readability).</p>
      <p><a href="http://forums.anandtech.com/archive/index.php/t-732902.html" rel="nofollow">‘While some will disagree, ClearType is primarily beneficial for LCDs. It effectively triples the effective resolution along one axis; can't recall if that's vert or horizontal. If so-called ClearType makes it to Linux (and preliminary support is there), my next display will definitely be an LCD.’</a></p>
      <p>Another user comment in a forum. What's to say other than that he hasn't understood what he has presumably heard from elsewhere? I do enjoy the idea of effectively tripling effective resolution, though, which is surely better than effectively tripling ineffective resolution, or ineffectively tripling effective resolution. :)</p>
      <p>And then we arrive at the Wikipedia article on CT, and its worth quoting the complete context of the triple resolution statement here, since the sentence in which it occurs, taken by itself, seems both confused and confusing:</p>
      <p><a href="http://en.wikipedia.org/wiki/ClearType" rel="nofollow">‘If the computer controlling the display knows the exact position and color of all the subpixels on the screen, it can take advantage of this to improve the apparent resolution of the images on the screen in certain situations. If each pixel on the display actually contains three rectangular subpixels of red, green, and blue, in that fixed order, then things on the screen that are smaller than one full pixel in size can be rendered by lighting only one or two of the subpixels. For example, if a diagonal line with a width smaller than a full pixel must be rendered, then this can be done by lighting only the subpixels that the line actually touches. If the line passes through the leftmost portion of the pixel, only the red subpixel is lit; if it passes through the rightmost portion of the pixel, only the blue subpixel is lit. This effectively triples the horizontal resolution of the image at normal viewing distances; but the drawback is that the line thus drawn will show color fringes (at some points it might look green, at other points it might look red or blue). ClearType uses this method to improve the smoothness of text. When the elements of a type character are smaller than a full pixel, ClearType lights only the appropriate subpixels of each full pixel in order to more closely follow the outlines of the character. Text rendered with ClearType looks “smoother” than text rendered without it, provided that the pixel layout of the display screen exactly matches what ClearType expects.’</a></p>
      <p>I find the reference to ‘normal viewing distances’ odd and irrelevant, because what is clearly being discussed, from the rest of the text and from the accompanying illustrations, is what is happening in the rasterising, i.e. exactly what I said above: the resolution is effectively tripled for sampling purposes, which enables finer display of type characteristics such as the thin diagonal line illustrated in the article. Once again, note how CT is explicitly associated with ‘smoothness’, with text ‘looking “smoother”’, about the resolution of the ‘image’.</p>
