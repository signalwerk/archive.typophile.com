      <p>Eben, the issue Edvino is pointing to isn't something that can be readily addressed at the font level. It is due to the fact that GDI versions of ClearType, as used in IE prior to version 9, apply subpixel smoothing in the x-direction but no smoothing at all in the y-direction. This is fine at small sizes -- better, I would say, than applying y-direction smoothing at those sizes as it maintains stroke density -- but at larger sizes the type will look jagged. No amount of font engineering will resolve this, because it is a renderer issue.</p>
      <p>IE9 uses the newer, DWrite version of ClearType, which smooths in the y-direction and so looks better at larger sizes.</p>
    html_clean: |-
