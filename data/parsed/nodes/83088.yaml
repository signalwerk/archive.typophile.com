    html: |-
      <p>David: <em>Y aliasing was an admitted and costly mistake.</em></p>
      <p>As implemented, yes. Providing the possibility of aliasing in the y-direction at text sizes, via the gasp table, is a good thing, but enforcing aliasing at all sizes was a bad mistake.</p>
      <p>Personally, I think the gasp table should be extended to allow a whole range of different, size-specific rendering possibilities, including control of both bitmap rendering and spacing. This would enable one not only to determine at what sizes and in which directions what form of smoothing would be applied or not applied, it would also allow us to snap to full pixel grids for spacing at specific sizes and allow intermediate sizes to float in subpixel positioning environments.</p>
      <p>However, the growing prevalence of pinch-zooming in mobile devices makes mechanisms that introduce non-linear text scaling unpopular among UA developers.</p>
