      <p><em>+ different explanations are possible</em></p>
      <p>No, no. Only David's explanations are possible.</p>
      <p>David: <em>Regardless of GDI vs DW, and only on Windows below 100 dpi for readers at a normal distance for those screen sizes present, CT Does Not "effectively triple the resolution".</em></p>
      <p>Did anyone claim that CT effectively triples the resolution of the device for the reader? There is no sense in which that statement can be understood as true. What CT does (and other subpixel rendering technologies) is to effectively triple the resolution available to the sampler and hence to representing the characteristics of the typeface design. Simply put, you triple the number of discreet addressable device elements, which means that aspects of glyphs which formerly would have to either distorted through rounding to a full pixel (aliased) or degraded through reduction in stroke density (greyscale antialiasing) can be rendered with less distortion and less degradation. This is most obviously seen in CT rendering of diagonal strokes, which were typically subject to most distortion or degradation in non-subpixel rendering.</p>
      <p>But then I'm the one who has always said that antialiasing in general, and CT no exception, is primarily about making typefaces look like typefaces -- What You See Is What Looks More Like Times New Roman Than Lego -- and not about reading.</p>
