      <p>David: <em>web sites showing up on windows with a variety of renderings on the page is wrong ain't it?</em></p>
      <p>I'm not convinced that it is wrong. Who was complaining in the pre-ClearType days when the same font was an aliased bitmap at text sizes and smoothed at larger sizes? Who, even was complaining when the same size of type was aliased in the roman but antialiased in the bold? GDI ClearType, by contrast, tried to apply the same rendering method to every size of every font, and isn't that what we're saying is wrong?</p>
      <p>As for legacy problems, the only way to resolve them is to leave them further and further behind until the last person using IE6 on Windows XP is carried out in a box.</p>
      <p>I'm more concerned with the new problems coming down the pipe to a user's computer near you, but which there may be time to address before they become entrenched legacy problems. You and I have both spent time recently creating fonts that are tailored to full pixel grids at specific sizes (sorry, mine not released yet and I can't talk about them), but that careful work is wrecked in subpixel spacing environments if those fonts are preceded in the line of text by fonts that are not designed to the grid: our full font grid gets shifted off the full pixel boundaries. That isn't a problem affecting thousands of fonts in circulation and in legacy environments: it is a problem affecting your latest attempts to deal with those older problems.</p>
