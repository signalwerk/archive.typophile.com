    html: |-
      <p>Unless the font has been specially engineered to solve for this ( most types are not ) you will get a fairly high contrast and even jaggy presentation in most windows browsers. All the font vendors are working to improve this but it will take time and the font you want is not guaranteed to ever be fixed. The thing to do is start assembling a list of the fonts you feel render well enough to use.</p>
      <p>Also, the result you get from my fonts may not match that of another source.</p>
      <p>It is also worth asking yourself how large you need to make the font before it works nicely. This will vary by font quite a lot. You will probably want to use it larger than that because people scale text up &amp; down in size a great deal these days.</p>
      <p>RE: IE9 - until IE9 has a genuinely dominant market share ( and even then!) this will still be an issue. Old browsers seem to take a long time to disappear.</p>
