      <p>What arguments, David?</p>
      <p>The single point I made is that there is only one sense in which it can be reasonably said that 'ClearType effectively triples (x-direction) resolution', and that is in terms of the sampler and hence the accuracy-to-outline of the rendering of glyph details, and hence the rendering of characteristics of the typeface on screen. That is the only sense it which it is true that resolution is effectively tripled, so that is the sense in which I've always understood the statement. A 96ppi screen obviously doesn't become a 288ppi screen from the reader's perspective, so that obviously isn't the sense in which the statement should be understood.</p>
      <p>Ergo, when you say ‘Regardless of GDI vs DW, and only on Windows below 100 dpi for readers at a normal distance for those screen sizes present, CT Does Not "effectively triple the resolution"’, I'm left wondering where the insight is, because for the reader at whatever distance the resolution is what the resolution is, and no text rendering method changes that resolution. What changes is the relationship of rasterised outline to that resolution, which is based on an effectively tripled x-direction grid due to supersampling.</p>
      <p>Now, I'm only responsible for my own opinions and my own precision, so if you've found evidence of anyone else interpreting that triple resolution statement differently, on Wikipedia (!) or anywhere else, that's between you and them.</p>
