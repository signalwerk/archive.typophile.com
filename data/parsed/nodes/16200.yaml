      <p>I'm glad you brought back the initial look. I think they're more interesting than the red&amp;black, which seems to have less personality (though I don't know you, so who's to say the other isn't more 'you'?).</p>
      <p>The number of 'legs' is disorienting. My eye has a hard time resolving them into anything, and as a result I read them as ornamentation of a sort, like a visual foil for the 'i' so I read it as 'ilo:labs' now.</p>
      <p>I prefer the second one because you have more forms to work with. I'd suggest making each 'm' distinct and using that first leg with the sharp corner twice, once for each 'm'. Also, the light grey might be a bit too light, depending on how much control you have over its use.</p>
