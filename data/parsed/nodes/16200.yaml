      <p>Interesting, I'm not sure it works, on first read I saw MWILO. Leaving that aside, the L seems too narrow; the O looks out of place, maybe you could try using a break like the A or B; the S needs some work, it appears to be tilting to the left. Does the M need that upright, because I think that is contributing to the MW reading problem. I think you can make it work but it will take a creative solution.<br>
      Tim</p>
