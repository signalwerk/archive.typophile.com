    html: |-
      <p>Good Point. MMILO is an abbreviation of my full name. As for the kind of work I intend to put up on the site, it's pretty varied. I'm mainly interested in web design and vector based illustration, but I dabble in Flash programming, typography, conceptual illustration and digital painting. That's why there is a "labs" suffixed on to the name because the site is mainly about me experimenting with different ideas.</p>
      <p>The website has three goals:<br>
      1. Outlet for general experimentation<br>
      2. Showcasing some work<br>
      3. Putting up a portfolio so I can hopefully find some sort of employment after my degree is completed.</p>
      <p>I'm sorry I was vague about what I was trying to accomplish, but I hope I have given enough of a back story now for people to get a better idea of what the concept behind the logo is.</p>
      <p>-mmilo</p>
