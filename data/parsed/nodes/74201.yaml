    <p>Monotype Imaging Announces the Commercial Launch of Fonts.com Web Fonts<br>
    New Offering Provides Best Font Selection, Language Support and Workflow Solution for Web Designers</p>
    <p>WOBURN, Mass., Sept. 14, 2010 – Monotype Imaging Holdings Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, today announced the general availability of Fonts.com Web Fonts, the company’s cloud-based solution that enables thousands of high-quality fonts to be used in Web page design. Subscription plans are now available at <a href="http://www.webfonts.fonts.com" title="www.webfonts.fonts.com">www.webfonts.fonts.com</a> for anyone who creates for the Web, from brand managers, publishers and advertising agencies to non-profit organizations, institutions and bloggers across the globe.</p>
    <p>Highlights of Monotype Imaging’s Fonts.com Web Fonts solution:<br>
    •More than 7,500 fonts available, including over 2,200 available in the free subscription tier<br>
    •Premier typefaces used widely in branding and advertising, including the Helvetica®, Frutiger® and Univers® designs, now available exclusively from Monotype Imaging<br>
    •More than 40 languages are supported using patent-pending Web technology<br>
    •Free and paid subscription levels feature no restrictions on the number of websites or quantity of fonts that can be used per domain or subdomain<br>
    •Fonts may be downloaded for desktop use by professional tier subscribers to aid workflow through the ability to create Web page mockups</p>
    <p>“Fonts.com Web Fonts provides what we believe is the greatest level of selection, convenience and performance for anyone looking for a high-quality Web font service,” said Doug Shaw, president and chief executive officer of Monotype Imaging. “We designed our solution so that every user can experience value that goes generously beyond alternative services. As font experts and home to the renowned Monotype®, Linotype® and ITC® collections, Monotype Imaging is firmly committed to providing the best solutions to meet every typeface publishing need.”</p>
    <p>“Our Web font service includes a host of unique features in addition to some of the most in-demand typefaces of all time,” said Chris Roberts, vice president of marketing at Monotype Imaging. “For example, Web pages display virtually instantly, even when using Chinese, Japanese or Korean fonts, thanks to new patent-pending technology we’ve developed that addresses language fonts with large character sets. In addition, users benefit with the freedom to use any number of fonts per subscription level on any number of websites without restriction – including our free tier. Further, a new font download capability is available for professional subscribers for creating Web page mockups using desktop applications, an often necessary step in the early stages of Web page design.”</p>
    <p>Free, standard and professional subscription plans<br>
    Monotype Imaging’s commercial launch immediately follows the company’s public beta program, which allowed thousands of participants to use any of more than 2,200 fonts on an unlimited number of websites. Beta participants may continue to use these same fonts along with the same unlimited website allowance, which now make up the solution’s no-fee level of service for websites that have up to 25,000 page views per month. </p>
    <p>In addition to the free tier of service, two paid subscription tiers are now available: standard and professional. Both provide access to more than 7,500 fonts and feature several flexible page view allowance options, starting at $10 and $100 per month, respectively. The professional tier also provides access to the desktop font download feature.</p>
    <p>Desktop download feature for professional level subscribers<br>
    Users at the professional level may download up to 50 fonts per month, allowing design to occur both on the Web and in traditional desktop application environments, without having to pay for additional font licenses. By using the same typeface designs that are specified for a particular Web design job, mockups can be created in applications such as Adobe® InDesign® and Dreamweaver® software. “Professionals who thrive on creative freedom can’t be limited to fonts that are available only for online use. The ability to download fonts is particularly useful when prototyping design – before it gets to the Web,” said Allan Haley, director of words and letters at Monotype Imaging.</p>
    <p>Supported browsers, availability and purchasing options<br>
    Hosted on a global distribution network of servers, Monotype Imaging’s Web font solution downloads fonts dynamically to Internet browsers. The service complies with W3C (World Wide Web Consortium) specifications for deploying server-based fonts and supports all major Internet browsers, including Microsoft® Internet Explorer®, Mozilla® Firefox®, Apple® Safari®, Google Chrome™ and Opera® platforms. Mobile Safari is supported for the iPad®, iPhone® and iPod® mobile digital devices.</p>
    <p>Fonts.com Web Font subscriptions are available at webfonts.fonts.com, where further information is available, including language support, pricing and page view thresholds for all subscription levels. Users may also follow the link to Fonts.com Web Fonts from the homepage of Fonts.com.</p>
    <p>About Monotype Imaging<br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, digital televisions, set-top boxes, navigation devices, digital cameras, e-book readers and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 13,000 typefaces from the Monotype, Linotype and ITC typeface libraries – home to some of the world's most widely used designs, including the Times New Roman®, Helvetica and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U. S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica, Frutiger and Univers are trademarks of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Adobe, InDesign and Dreamweaver are trademarks or registered trademarks of Adobe Systems Inc. in the U.S. and/or other countries. Microsoft and Internet Explorer are either registered trademarks or trademarks of Microsoft Corp. in the U.S. and/or other countries. Mozilla and Firefox are registered trademarks of the Mozilla Foundation. Apple, Safari, iPad, iPhone and iPod are trademarks of Apple Inc. registered in the U.S. and other countries. Google Chrome is a trademark of Google Inc. Opera is a registered trademark of Opera Software ASA. All other trademarks are the property of their respective owners. © 2010 Monotype Imaging Holdings Inc. All rights reserved.</p>
