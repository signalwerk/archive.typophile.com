    html: "<p>Here you go, I believe you're looking for this: <br> <br><a href=\"http://www.bitstream.com/categories/products/fonts/tiresias/screenfont.html\" target=\"_blank\">http://www.bitstream.com/categories/products/fonts/tiresias/screenfont.html</a> <br> <br>Apparently, its actually illegal to use any other font in the UK for subtitling on digital television (no, really), and BBC use it for text services on DVB too. So that covers digital terrestrial broadcasts (Freeview), but I am not sure about digital satellite (Sky) or digital on demand (Homechoice). <br></p>"
