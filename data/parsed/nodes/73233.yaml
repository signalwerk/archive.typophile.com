    html: |-
      <p>I do not like DIN as a body typeface. This font is like a perfect marriage between technicality of DIN and humanistic feel. Another advantage of this typeface is it's narrow. Not condensed but narrow enough to work great in long documents. But as I see I am too picky:)</p>
      <p>Ahs, why not Fago? Because fago is insanely expensive.</p>
