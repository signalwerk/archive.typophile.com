      <p>There are a bunch of FFs that could be right up your alley. John mentioned FF Unit above, maybe also look at <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_sanuk_2_ot/" rel="nofollow">FF Sanuk</a> or <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_clan_ot/" rel="nofollow">FF Clan</a>.<br>
      You might also like <a href="http://typetrust.com/fonts/font.php?id=NDY1" rel="nofollow">Breuer Text</a>.<br>
      I'd also second National – I wouldn't necessarily call it «technical», but it does work for text and is a very nice font.</p>
