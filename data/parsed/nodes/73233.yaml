  html: |-
    <p>Hi,<br>
    This is font made by Dalton Maag for ThyssenKrupp. It looks great in long texts. Can someone recommend similar font? I thought about obvious choices like Fago or Stroudley. But they do not have this „DINish feel”. Stroudley is almost perfect but its regular weight is a way too thick for my taste. Do you have any suggestions?</p>
