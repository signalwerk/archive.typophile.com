    <p><a href="http://elbrecht.de/Conze/SW.jpg" title="http://elbrecht.de/Conze/SW.jpg">http://elbrecht.de/Conze/SW.jpg</a></p>
    <p>I guess the graphic shape just beneath the main title is actually a type embellishment piece, of the *federzüge* kind (“pen strokes”) which in those days often acompagnied typefaces; obviously turned about 90 degrees (see the serifs).<br>
    Other interpretations?<br>
    (it has been suggested that this is some mathematical character but I doubt that.)<br>
    Someone identifying the typeface, b.t.w.?</p>
    <p>Happy christmas to all of you * * * * *</p>
