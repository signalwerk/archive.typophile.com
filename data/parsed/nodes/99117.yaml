      <p>The very special character - if a character at all - is NOT decorative to me. I asked the Unicode pandits as well - and well 1932/33 is out of time for them - only U+2129 TURNED GREEK SMALL LETTER IOTA came up somehow. But this would fit quite well: a LETTERLIKE SYMBOL from the past, only encoded for backward compatibility. [The logical / mathematical symbols of today got their own encoding block.]<br>
