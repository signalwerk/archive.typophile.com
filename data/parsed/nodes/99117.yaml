      <p>@Michel Boyer<br>
      not knowing about "modern logic" &amp; "1930's printing" myself, I seem to have to help myself with "the beast."<br>
      I know the early Conze &amp; I know the late Conze quite well - and I am sure there is nothing decorative with "the beast." The 1930's printer had to help himself, too - with no Unicode available then. I just found a very interesting article on the history of printing Classical Greek - even with a note on Principia Mathematica:  <a class="freelinking external" href="http://conze.elbrecht.com/PDFs/Yot.pdf" rel="nofollow">http://conze.elbrecht.com/PDFs/Yot.pdf</a><br>
      The book "is to limit the PoC's logical validity to certain subjects and object ranges." There is a 1934 review of the book by Herbert Marcuse - translated by Holger R. Heine, who is about to publish the whole book in English: <a class="freelinking external" href="http://conze.elbrecht.com/PDFs/Rev.pdf" rel="nofollow">http://conze.elbrecht.com/PDFs/Rev.pdf</a><br>
      The book is full of Greek notes &amp; Conze knew his Greek for sure - &amp; he wrote just the time the "Yot.pdf" is about - &amp; he had done his dissertation under Heinrich Scholz before!<br>
      …still dreaming the butterflies dream!<br>
      PS: still wondering which glyph it actually is!</p>
