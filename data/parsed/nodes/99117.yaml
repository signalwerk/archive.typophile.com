      <p>@Elbrecht</p>
      <p>The inverted iota ℩ is used for descriptions, and behaves like a term constructor from a one variable predicate (cf ✸<strong>14</strong> of the wiki on <a href="http://en.wikipedia.org/wiki/Principia_Mathematica" rel="nofollow">Principia Mathematica</a>). </p>
      <p>On the other hand, the <a href="http://de.wikipedia.org/wiki/Satz_vom_Widerspruch" rel="nofollow"><em>Satz vom Widerspruch</em></a> corresponds to<br>
      <a href="http://en.wikipedia.org/wiki/Law_of_noncontradiction" rel="nofollow"><img src="/files/lawofnoncontradiction_6461.png"></a><br>
      which simply states that a statement cannot be both true and false. </p>
      <p>Why then choosing the inverted iota, whose relation with the subject of the book a priori appears rather remote?</p>
