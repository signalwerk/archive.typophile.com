      <p>@Ryan Maelhorn:<br>
      <cite>Are we sure that big thing in the middle is intended to be anything other than decorative?</cite></p>
      <p>For myself, at least, I am very unsure that it was intended to be anything but. However, it still might have been something that served another purpose, such as an Armenian lower-case letter, before being used as a decoration, so asking what character that shape might have been is legitimate even when the immediate intention was purely decorative.</p>
      <p>That it could have been an old mathematical symbol, intentionally used to convey some authority to the contents of the book (about the evil crackpot theory known as <em>dialectical materialism</em>, which gave rise to such things as Lysenkoism) is not entirely impossible.</p>
