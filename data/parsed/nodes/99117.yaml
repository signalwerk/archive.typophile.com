      <p>&gt; Were there printer sets with logical "turned iota" available in the 1920/30s …?</p>
      <p>If they were, they would most certainly not have been of that size. And the bookbinder’s lettercase is something different as the printer’s. No bookbinding workshop maintained lettercases with most special mathematical characters of extremely rare use.<br>
      If there is no hint at all inside the treatise pointing at the this “character”, that makes it even more unlikely to be something mathematical of the sort you tend to suggest.<br>
      It is definitely not a “turned small greek jota.” It is something else, whatsoever.</p>
      <p>I recognize your wish to see something symbolic into it, but you may consider to take the conditions and customs of the trade of that time into account, too.</p>
