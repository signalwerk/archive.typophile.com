    html: |-
      <p>It is odd, the terminals are unachievable... wait for it Hrant!... using the right hand; even a leftie would be hard pressed to do this without stress. The ductus, direction of stroke, would be counter to line writing, as in writing text, so I would venture this is drawn, and is very much, and developed (in this variation) as a "typographic form" as opposed to a calligraphic one.</p>
      <p>With Conze's propensity for languages there is no telling where this "form" came from but I am sure I am about to find out and be made fun of :-) It literally looks to me as though it is a flopped l/c L because of the terminals. It was not uncommon for designers to combine calligraphic elements (the top of the stem) with more "typographic forms " (the bottom of the stem). </p>
      <p>@Ryan... if "that big thing" is intended solely for decoration it falls way short, which would lead me to believe it serves more than a decorative purpose. It is integral, to my thinking, in the statement.</p>
