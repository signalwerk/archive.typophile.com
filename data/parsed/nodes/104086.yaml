      <p><em>…the first true critically and commercially successful rapper…</em></p>
      <p>Melle Mel.</p>
      <p>Copperplate Gothic: what has this to do with Eminem and hip hop?<br>
      It’s an old face that was used for small text on biz cards 100 years ago, and more recently at display size because it was bundled with a lot of apps, and people didn’t know any better.<br>
      The problem is that the teats on it are too big at display size, giving such typography a clumsy appearance.<br>
      So the experts will always consider its use in display as inappropriate.<br>
      But if your client likes the way it looks, feel free to ignore them!</p>
