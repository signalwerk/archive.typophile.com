    So basically I made this Eminem fan-art about him being the first true critically and commercially successful rapper(Yeah I know about Beastie Boys and Vanilla Ice). And when it came to putting some text in the image I got stuck on the typeface choice. I have used Copperplate Gothic here but I wanted to ask is it appropriate? This confusion was mostly due to someone saying in a thread " Copperplate is a great font but its used in a lot of wrong places". What do you guys think? Is this appropriate? It looks fine to me but I want your advice.<br>
    Thanks<p></p>
