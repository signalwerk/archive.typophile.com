  html: |-
    <p>the text below is part of a feature profiling young british designers in yesterday's <a href="http://observer.guardian.co.uk/magazine/story/0%2C11913%2C1061039%2C00.html" target="_blank">observer</a>. <br> <br><br>
    </p><blockquote><hr size="0"><!---quote-!--><b>quote:</b><p>Natascha Frensch, 27 <br>Can a new typeface help people with dyslexia read and write more effectively? Britain has 2m severe dyslexics, including 375,000 schoolchildren. Frensch has designed Read, a sans serif typeface she hopes will help people to read and write more clearly. It works because each letter is drawn individually. She has produced a limited edition book that explains how she did it and why and hopes to sell the typeface via a website, <a href="http://www.readregular.com" target="_blank">www.readregular.com</a> (which has yet to be set up). For individuals, it will be 'the price of a CD', while bigger corporations will have to pay accordingly. There is also a version for children. Email contact: <a href="mailto:natascha.frensch@readregular.com">natascha.frensch@readregular.com</a><!---/quote-!--></p><hr size="0"></blockquote>
     <br> <br><a href="http://www.readregular.com/english/intro.html" target="_blank">http://www.readregular.com/english/intro.html</a>  <br> <br><a href="http://www.hhrc.rca.ac.uk/programmes/ra/2003/natascha" target="_blank">http://www.hhrc.rca.ac.uk/programmes/ra/2003/natascha</a>. <br> <br>[i originally posted the above links in 'news &amp; events' but, as its been pointed out to me, the story seems ripe for typophile comment. take it away...] <p></p>
