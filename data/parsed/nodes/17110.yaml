      <p>===<br>
    <strong>Extended Deadline — TDC52 and TDC2 2006 competitions</strong><br>
    ===<br>
    Call for Entries<br>
    TDC52 &amp; TDC2 2006<br>
    The annual typography and type design exhibition competitions of the Type Directors Club</p>
    <p><a href="http://www.tdc.org/calls/tdc522006/index.html">TDC52 typography</a></p>
    <p>Jury: Andy Altman, Why Not Associates; Mike Joyce, Stereotype Design; Alexa Nosal, Leap; Emily Oberman, Number Seventeen; Woody Pirtle, Pentagram Design;<br>
    Steve Sandstrom, Sandstrom Design; Brady Vest, Hammerpress; Diego Vainesman, Chairman</p>
    <p><a href="http://www.tdc.org/calls/tdc522006/index.html">TDC2 2006 type design</a></p>
    <p>Jury: Frank Blokland, Dutch Type Library; Yvonne Diedrich, ydt_fonts; Mark Jamra, TypeCulture; Teri Kahan, Teri Kahan Design; Ilene Strizver, Chair</p>
    <p>Extended Deadline is Friday 13 January 2006<br>
    Entries from 1 January 2005 to 31 December 2005<br>
    (Full guidelines &amp; PDFs at the URLs above)</p>
    <p>Entries selected by the juries will be on display at the exhibition opening in New York in the summer of 2006, exhibited in the TDC travelling exhibitions, and published in _Typography 27_, the Annual of the Type Directors Club.</p>
