    html: "<p> Ahh! sorry Hrant, <br> <br>Here is the deal: <br>The logotype is for a company called Spartan. I am trying to find an oldstyle Greek font that has an appearance of the engraved, worn look. <br>I know that im not going to get away with a totally Greek face so im going to have to \"dress a Roman like a Greek\" as you said on one of these posts. ;) <br>But its the feel of the face im after. 'Weathered by time' sort of look. I was going to do some research and draw the logotype myself, but was wondering if there were any faces like this already. <br> <br>Sorry for the confusion. <br> <br>Bren </p>"
