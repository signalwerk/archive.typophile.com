    html: "<p>&gt; merge the Latin &amp; Greek to 'create' the feel of antiquity. <br> <br>Sounds like a plan. Fortunately it's a logotype - a font would be a whole different story. <br> <br>S: What about an h-flipped \"Z\"? That would look like a Greek Sigma. <br>P, R: Keep them open? <br>A: Try a chevron bar. <br>T: Tough one. Making it a cross is an obvious answer, except the Ancient Greeks were pagan. <br>N: Do something funky.  <br> <br>BTW, you could look at Barnbrook's Mason and Exocet for inspiration. And maybe Trajic notRoman: <br><a href=\"http://www.themicrofoundry.com/ss_trajic.html\" target=\"_top\">http://www.themicrofoundry.com/ss_trajic.html</a> <br>But please don't ask for a copy. <br> <br>Overall: make things not very aligned; maybe flare the stroke endings. <br> <br>hhp</p>"
    html_clean: "<p>&gt; merge the Latin &amp; Greek to 'create' the feel of antiquity. <br> <br>Sounds like a plan. Fortunately it's a logotype - a font would be a whole different story. <br> <br>S: What about an h-flipped \"Z\"? That would look like a Greek Sigma. <br>P, R: Keep them open? <br>A: Try a chevron bar. <br>T: Tough one. Making it a cross is an obvious answer, except the Ancient Greeks were pagan. <br>N: Do something funky.  <br> <br>BTW, you could look at Barnbrook's Mason and Exocet for inspiration. And maybe Trajic notRoman: <br><a href=\"http://www.themicrofoundry.com/ss_trajic.html\" target=\"_top\" class=\"link-external\">http://www.themicrofoundry.com/ss_trajic.html</a> <br>But please don't ask for a copy. <br> <br>Overall: make things not very aligned; maybe flare the stroke endings. <br> <br>hhp</p>"
