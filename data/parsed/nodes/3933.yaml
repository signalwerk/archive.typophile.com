    html: <p>Hi George, <br> <br>Thanks for the info.  <br>I dont know how this is going to work, but im going to try and merge the Latin &amp; Greek to 'create' the feel of antiquity. <br> <br>I only have to get a combo of S, P, A, R, T &amp; N. Maybe hint at a bridge (is that the right term?) on the "A"? The Greek "R" is a Latin "P" thats going to be tricky because I use both. "S" will <b>have</b> to be Latin, same with the "T". <br> <br>Any suggestions? <br> <br>Bren</p>
    html_clean: <p>Hi George, <br> <br>Thanks for the info.  <br>I dont know how this is going to work, but im going to try and merge the Latin &amp; Greek to 'create' the feel of antiquity. <br> <br>I only have to get a combo of S, P, A, R, T &amp; N. Maybe hint at a bridge (is that the right term?) on the "A"? The Greek "R" is a Latin "P" thats going to be tricky because I use both. "S" will <b>have</b> to be Latin, same with the "T". <br> <br>Any suggestions? <br> <br>Bren</p>
