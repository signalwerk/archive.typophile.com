    html: <p> If you want to be culturally authentic, you might have a tough time, since "Hellenicized" Latin fonts are pretty rare, so a specifically weathered one might not exist. One reason not to worry too much about authenticity in this case is that people might -understandably- not even have the sensitivity to realize what it is! Collective memory (in the West) doesn't seem to extend to anything before the Roman Empire, I mean in terms of noticing if it's authentic or not. Just use Democratica...  ;-) <br> <br>You could go Bizantine and use Sophia. Or you could use a less-familiar Roman style (like Herculanum) and pretend. Or you could take something like Skia and weather it yourself. Or you could wait for Gerry to give a much more qualified answer.  :-) <br> <br>hhp </p>
