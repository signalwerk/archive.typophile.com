      <p>I prefer the indented paragraph as well (not the first in a chapter/section). I would suggest that an em is too narrow an indent for your measure. I understand your abhorrence of justified text but an indented first line which falls short could look weak or centred, I believe that in order for your text to be a familiar experience* to the audience you might need to look at justified. Pilcrows in flowing text are an alternative but probably too great a distraction to an audience outside the typographic realm.<br>
      * after all most books are justified.<br>
      Tim</p>
