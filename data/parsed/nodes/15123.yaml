      <p>There is no rule on indenting vs space between paragraphs. One way of dealing with the excessive measure is to have a wide left margin and put subheads in it. Another is to have two columns. Whatever you do will affect your decision on indents. </p>
      <p>The most important first question is who is the audience, and what do you want to accomplish. If this is school reports, then the main thing will be to relate to teacher’s expectations or requirments. If it is published, it depends on the material and the readership. The goal of the work takes the lead in determining typography.</p>
      <p>If you haven’t read Bringhurst, do get a copy. It will give you an immense amount of useful information.</p>
