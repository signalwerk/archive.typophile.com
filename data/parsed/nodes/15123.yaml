      <p>&gt; Indented paragraphs are very old, long before the typewriter.</p>
      <p>But you’re glossing over the fact their genesis was in fact a “mistake”! They were empty spaces reserved for rubrication/illuimination, but often left unused (sometimes because of deadlines, sometimes because of different[ly priced] editions). That said, I do agree they’re less bad than flush paragraphs; you’d have to have a particularly nasty strain of the Modernism virus to prefer <cite>that</cite>.</p>
      <p>—</p>
      <p>“More beautiful option”? Well, yes, although nothing to do with digital: the portly but practical Pilcrow! And what’s really nice about it is that you can use it right in the middle of a “physical” paragraph block to mark a separate “conceptual” paragraph (like on my site), often saving space and gaining elegance.</p>
      <p>hhp</p>
