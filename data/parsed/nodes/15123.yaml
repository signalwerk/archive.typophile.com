      <p>Yes, I’ve seen that indent rule: indent matches the leading.</p>
      <p>Jan Tschichold, Bringhurst, and I think even Eric Gill are all in favour of it.</p>
      <p>It’s intersting that an indent of that length doesn’t really stand out on the page. Sure, you know it’s there, but it doesn’t draw the eye to it. In fact, if the last line of the paragraph runs to nearly the full measure, you might miss the indent at first glance, until of course your eyes get there during the course of reading. It’s a very unobtrusive way to signal a new paragraph.</p>
      <p>Perhaps some people simply prefer the clarity and crispness of block paragraphs. Eah paragraph is a separate, logical unit. I find that block paragraphs that are separated by half the leading and no more are more pleasing.</p>
      <p>Still, I’m beginning to feel that indenting is a warmer and more inviting method. This time, the margins and comfortable leading provide the breathing room, and not the white space between paragraphs. Although one usually ends up with some white space anyway,  since the last line of a paragraph doesn’t usually run the full measure.</p>
