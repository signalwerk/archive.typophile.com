      <p>If your measure is too long you can also step up your typesize a bit or use a wider font.</p>
      <p>If your measure is long you need to increase your leading to assist the reader in locating the beginning of the next line.</p>
      <p>For continuous formal text in a traditional vein, I think paragraph indents are better. Block paragraphs slow down the flow a bit because each one is more of a new beginning.</p>
