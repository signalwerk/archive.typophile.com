    html: |-
      <p>According to Bringhurst, Elements of Typographic Style, the ideal line length (measure) is 66 lower case characters—2 1/2 lower case alphabets. The big problem with letter sized paper is that usually the measure is too long, as it sounds like it is in your case. A line over 75 or 80 characters is not good for continuous reading, even with additional leading, as you have done. </p>
      <p>I think this is an extremely important feature of readable typography. Check on this and fix it if need be.</p>
