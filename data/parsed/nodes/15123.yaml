      <p>&gt;were only really necessary on manual typewriters.</p>
      <p>No. Indented paragraphs are very old, long before the typewriter. They are an excellent way to mark paragraphs, and in my opinion you should only depart from this standard when you have a good reason to. The standard indents are, according to Bringhurst, one en, one em and one ’lead’ meaning that if the text is 10/12 the indent is 12 points. </p>
      <p>Bringhurst notes that spaces between paragraphs are standard in business letters, and can be OK in short business materials because they suggest “precision crispness and speed. ...In longer sequences, they may seem soulless and uninviting.”</p>
