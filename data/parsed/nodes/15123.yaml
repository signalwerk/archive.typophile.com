    <p>Greetings, everyone.</p>
    <p>I have been lurking around Typophile for quite some time. </p>
    <p>A number of you seem enlightened when it comes to typography, not just font design. I’ve read some interesting (often quite heated) discussions.</p>
    <p>My question has to do with paragraphs that occur in essays and reports on an 8.5x11 page. My right and left margins are 1.55 inches, top and bottom are an inch. Font is 11 pt. Palatino (Adobe’s Palatino LTstd.) Leading is fixed at 16 points. Indent is 18 points (should be 16, but I prefer a little more emphasis.) Line length is 12-13 words (less than 6 inches.) Text is ranged left, ragged right (I find justified text abhorrent.) Gentle hyphenation where necessary. There’s nothing like a soft, soothing rag!</p>
    <p>So, would it be better to indent paragraphs, or simply leave a white space between paragraphs, calculated at half the leading (8 points or so)? I’ve always gone for the “block paragraph” look, but recently I’ve gotten the impression that it is poor form. I’m willing to change in the name of correct typography.</p>
    <p>I’d appreciate any advice.</p>
