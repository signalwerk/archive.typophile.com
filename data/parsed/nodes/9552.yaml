  html: <p>I'm a Mac user thinking about buying Virtual PC to test fonts under the Windows environment. <br> <br>At the moment, I am thinking about buying the Win98 version instead of the XP version of Virtual PC, mainly down to speed concerns. Apparently Win98 runs a lot faster. <br> <br>Are there any major differences in the way that Win98, Win2000 and WinXP handle fonts that I should be aware of? Things such as OpenType support, and what not?</p>
comments:
  - id: 61142
    user: 655
    date: 2003-02-17T04:12:00
    date_raw: 17 Feb 2003 — 4:12am
    votes: null
    html: <p>Yes! David, <br> <br>Win98 is a MSDos based Windows using a mixture of 32 and 16 bit programms. Windows2000 and XP are based on the NT concept - true 32 bit software.  <br> <br>You should test your fonts on win2k/XP. But a older real pc system including a windos bulk license should be cheaper.</p>
