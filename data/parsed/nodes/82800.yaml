    <p>Probably, most of you saw this already:<br>
    <a class="freelinking external" href="http://forum.mininova.org/index.php?showforum=40" rel="nofollow">http://forum.mininova.org/index.php?showforum=40</a></p>
    <p>As you can see, many foundries have "their own" thread there.</p>
    <p>The reason why I ended there is cause in statistic of our page, I saw a reference link to thread where someone is asking for one our font. After that, I tried to register twice, but it says the moderators have to confirm the registration and that still didn't happened. So I tried to email <a href="mailto:webmaster@mininova.org">webmaster@mininova.org</a> with polite and reasonable request to delete that thread cause what they are doing is illegal and it's not fair cause some guys invested their time and money to make those fonts.</p>
    <p>Still got no answer from them...</p>
    <p>I guess many of you would be interested to find a way how and where to react against cases like this, so I'm wondering if anyone had any success and would be so kind to share with us the way how he/she/they managed to make Mininova remove thread/files... if any of you succeed that.</p>
    <p>I've read that some Dutch NGO 1-2 years ago succeeded to won the fight against them, probably there are some other (less known) cases where license owners won somehow, pressuring Mininova to remove illegal content.</p>
    <p>- Dusan</p>
