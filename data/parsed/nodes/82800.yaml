    html: <p>The piracy process starts with one of your paying customers. They 'lend' it to someone, who 'lends' it to someone else. I don't see why it would be so hard to embed the order number into the font, so at least you could trace the source of the leak. Sure it could easily be hacked by anyone with fontlab but I think most piracy is not so thought out. It starts with one person not really knowing that lending the font is piracy. In reality, what kind of person would pay for your font then share it with everyone else for free? Some weird philanthropist?! But yeah, mininova is a bad site for bad people. Console yourself with the fact that anyone who values their time so low that they'd rather spend hours searching to get a font free than cough up for it is never likely to pay for it anyway and even less likely to do much commercially profitable with it.</p>
