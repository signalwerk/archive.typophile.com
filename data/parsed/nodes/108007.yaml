  html: |-
    <p>I quite like the crisp rationality of the text typeface used in this book, but I can't identify it. I suspect it's a Linotype machine face, judging by the buttonhook 'f' and the overly wide italic.  </p>
    <p><a href="http://www.iampeth.com/books/palmer_method_1935/palmerMethod_1935_page2.html" title="http://www.iampeth.com/books/palmer_method_1935/palmerMethod_1935_page2.html">http://www.iampeth.com/books/palmer_method_1935/palmerMethod_1935_page2....</a></p>
    <p>I particularly like the 'g', which strikes me as rather distinctive.</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
