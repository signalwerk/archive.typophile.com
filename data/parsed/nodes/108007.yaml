      <p>Yes, it looks very close and I can't spot a similar /g on any other font I looked.<br>
      You can find a more "round" (less compressed) version of Century Old Style on the latin subset of (Chinese) Mac OS font <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Mac-OS-Fonts&amp;ffam=BiauKai%20-%20Regular&amp;fid=9ff1c78eed95d3ffed256f524b2a7b78&amp;fsize=48&amp;text=EXPLANATION%20good%2C%20practical%20business%20writers&amp;wrap=2" rel="nofollow">Biau Kai</a></strong> (1995) but I doubt the book is set on Biau Kai<br>
      See also:<br>
      <a href="http://typophile.com/node/76885" title="http://typophile.com/node/76885">http://typophile.com/node/76885</a></p>
