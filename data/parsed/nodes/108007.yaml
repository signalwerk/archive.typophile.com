      <p>@fvilanakis Thanks.  It does look like it, doesn't it? </p>
      <p>The book type seems rather less condensed than the digital Century Old Style fonts I see. (Letters like 'o' look noticeably rounder, and the tracking in general is much looser.) But I supposed that could be accounted for by a different size being used for the digital masters.</p>
