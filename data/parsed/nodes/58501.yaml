    html: |-
      <p>Normal typewriters in the English-speaking world indeed typed 6 lines to the inch (12 point) whether using pica (10 characters to the inch) or elite (12 characters to the inch) characters.</p>
      <p>Since single-spaced elite typewriting included, effectively, leading, though, one <em>can</em>, if one wishes, consider elite type to be 10 point type - but if one does so, one should be careful about asserting that as an intrinsic property of the type instead of simply a choice one has personally made, because otherwise it would confuse people (no typewriter advanced 10/72 of an inch after printing a line of elite type).</p>
      <p>At least one Swiss company, Hermes, made typewriters that put characters on the page with metric dimensions - 2.5 mm wide characters instead of pica, 2.0 mm wide instead of elite, and 1.5 mm was available for a typestyle called "Economic".</p>
      <p>I've seen an office manual typewriter made especially for government work, I believe, that typed 16 characters per inch and 8 lines per inch. And daisywheel typewriters often allowed the use of small 15 character per inch typefaces, since that fit in with the 1/60 inch unit that supported both pica and elite (and which was also often used for proportional spacing).</p>
