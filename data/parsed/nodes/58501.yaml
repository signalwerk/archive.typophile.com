      <p>If I remember correctly (it's been a long time; but I did do a ton of research 'cause I was really curious about all this) - for my Chandler 42 fonts, I measured everything directly from the typewriter and used that for my 10 point master (I was actually trying to do an exact copy of that machine) and the measurements were not consistent with typographic standards.</p>
      <p>Buried in the back of my head there's a note that says, 'typewriters have different measurements, don't trust them.' </p>
      <p>So measuring them directly would be your best approach, that is a good suggestion.</p>
      <p>What I am positive about is each manufacturer had their own standards for developing their 'fonts' - and this was entirely based on their machinery, even the design of the letters themselves were drawn (large, at a drafting table) as one thin stroke, whereas the weight of the metal - when cast - would provide the weight.</p>
      <p>Courier's release changed all that. Kinda. It was the first time a typewriter manufacturer decided that there should be a standard.</p>
      <p>If memory serves.</p>
      <p>steve mehallo<br>
      tinyurl.com/mehallofonts<br>
      mehallo.com</p>
