    html: |-
      <p>Mechanically, if single-spaced Pica is 12 points on a 12-point body, then 1 1/2 spaced is 12 points on an 18-point body, and double-spaced is 12 points on a 24-point body... and Elite is then 10 points, also on 12-point, 18-point, and 24-point bodies in those cases.</p>
      <p>It is certainly true, on the other hand, that digital monospaced fonts come in only one version - and thus they can be in any point size, and their horizontal spacing will decrease proportionately as the point size is adjusted. So if you have a Pica typeface, then the 10-point version will have 12 characters per inch horizontal spacing - but things won't necessarily match up so well.</p>
      <p>Incidentally, the Pica version of Courier had basically the same character height as most Elite typefaces on the Selectric. If a digital version of Courier did not include the extra space, the 10 pitch version could therefore have a point size of 10 points instead of 12. But, as you've noted, with digital faces, spacing is often arbitrary. As well, digital faces seem to, at least by default, include considerable built-in leading.</p>
