      <p>&gt; And wasn’t the leading the same for both Pica and Elite, at least if we’re discussing post-Selectric typewriters?</p>
      <p>And pre. The leading was called platen advance, and it was fixed, usually to six lines per inch. A few systems had the ability to advance a half line, but less than that meant the platen was not on a gear tooth, and was dangerous. </p>
      <p>I can't believe that something as common as the typewriter (my key tool when I was a journalist) is now an antique that people have to recall into memory as to its operation.</p>
