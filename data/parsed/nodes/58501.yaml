    <p>My question is on the old typewriters, before the electric typewriter, when typewriters had fixed type sizes.  Those sizes, if I correctly recall, were "pica" and "elite."  One was 10 pts, and the the other was 12 pts. (I can't remember which was which).</p>
    <p>If a form was printed, in those days, that was to be filled out using a typewriter, was the leading when using single spacing on the typewriter equivalent to the values used in modern software (12 pts. for 10 pt type and 14.4 pts. for 12 pt. type)?</p>
    <p>If not, does anyone remember the old typewriter single space leading values for those two type sizes?</p>
    <p>I tried several searches on this forum, without success.  Perhaps I did not use the correct search criteria.</p>
    <p>Thank you.</p>
  html_clean: |-
