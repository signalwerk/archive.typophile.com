      <p>FontShop has a list of <a href="http://www.fontshop.com/fontlist/super_families/" rel="nofollow">super-families</a> that include serif and sans fonts. </p>
      <p>Some classic fonts, possibly not in the FontShop list, like Palatino and Frutiger have recently added new families to give both a serif and sans.</p>
      <p>You'd have to investigate to see if they have all your criteria, but often if they are OpenType font families they would have most of the things you wanted.</p>
      <p>- Mike Yanega</p>
