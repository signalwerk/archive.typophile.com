    <p>Good day everyone.</p>
    <p>I am not looking for a specific typeface but rather a list of professional typefaces that would abide by the criteria listed below. </p>
    <p><strong>Essentials</strong></p>
    <ul>
    <li>Proportional spacing for the latin characters with <a href="http://fontfeed.com/archives/figuring-it-out-osf-lf-and-tf-explained/" rel="nofollow">tabular lining figures</a>. (Thanks for clarifying Renko!)</li>
    <li>French accented latin charaters (é, à, ê…).</li>
    <li>At least a plain and a bold weight option.</li>
    <li>Typographers' Quotes (Single and Double)</li>
    </ul>
    <p><strong>Desirable attributes but no deal breakers</strong></p>
    <ul>
    <li>A thin weight option</li>
    <li>An italic style</li>
    <li>A condensed style</li>
    <li>Fractions</li>
    <li>Stylistic ligatures</li></ul>
    <p><strong>Bonuses</strong></p>
    <ul>
    <li>Both a Sans Seriff and a Seriff cut.</li>
    <li>Small caps</li>
    </ul>
    <p>I'm eagerly awaiting your suggestions.</p>
