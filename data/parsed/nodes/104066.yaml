    html: |-
      <p>Vega is the Scangraphic clone of VAG Rundschrift / VAG Rounded. If we may believe <a class="freelinking external" href="http://en.wikipedia.org/wiki/Sedley_Place" rel="nofollow">the english Wikipedia</a> on this, VAG Rundschrift / Rounded was designed by Gerry Barney at the agency Sedley Place in 1979. The <a class="freelinking external" href="http://de.wikipedia.org/wiki/VAG_Rundschrift" rel="nofollow">german Wikipedia</a> tells a different story though. They date the design 1978 and attribute the design to Wolf Rogosky and Gerd Hiepler with later adaptations by Bertel Schmitt and Manfred Schwarzer. </p>
      <p>The apostrophe in the Bitstream version used by Michel Boyer and in the MacGregor’s Market logotype differs from the version available from URW, E+F, Adobe and Linotype. In my eyes and because older Bitstream data usually has origins at Linotype, the design of the Bitstream apostrophe is probably what the Germans call a ‘Verschlimmbesserung’, which roughly might translate into something like ‘inappropriavement’.</p>
