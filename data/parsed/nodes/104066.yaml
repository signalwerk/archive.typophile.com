    <p>Hi</p>
    <p>new here, sorry for jumping straight onto the 'help me' board without any prior participation. I hope to be able to join in the fun from here onwards though, however for now I'm trying to find a font used in a friends website, I'm making an attempt at neatening up the design as as a surprise, and I'd like to keep a font they used, but @include it in a website. </p>
    <p>Don't mind if it's commercial, although if it's super premium a Typekit hosted analog might be useful. I know from reading that you folks  care about your lively hoods : )</p>
    <p>It's in an image, so hopefully that;s where you folks come in.</p>
    <p>Not quite sure what it's classed as, possibly a sans serif, would probably be filed under the 'display' section of a foundry. Open to learning along the way.  </p>
    <p>Thanks</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/unknownfont_4186.png"></div><p></p>
