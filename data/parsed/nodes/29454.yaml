    <p>I have put down the first few lowercase letters of a new sans serif. Note the high x-height, the slanted ascenders (which are in vogue right now-overly trendy perhaps?). I welcome any comments to help improve the design and its usefulness.</p>
    <p>Thank you,</p>
    <p>JDooley</p>
