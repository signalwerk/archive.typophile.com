      <p><cite>Yea, it’s really easy to download the font: visit page in firefox</cite></p>
      <p>True. But it's an easy fix to prevent this in a future version. The point of this script is to have a system where a licensed website would get access to the font on the foundry's server, but access from other sites and direct downloads would be prevented. This can be done. I just don't have all the neccessary features and levels of protections in it yet.</p>
      <p>But 4thfebruary is also right. Once you access a licensed site the font will end up in your browser cache where it can extracted. And this will always be the case.<br>
      But still: Should we stop the iTunes music store because people know how to rip an DRM-protected song?</p>
