      <p><br>
      Thanks for this Ralf.</p>
      <p>I also was wondering if you could somehow secure a css file that contains information about a font to be safe on an EULA's side (e.g. <cite>"Embedding of the XXX Font-Software into electronic documents or internet pages is only permitted in a secured read-only mode. The Licensee must ensure that recipients of electronic documents or internet pages cannot extract the XXX Font-Software from such documents or use the embedded XXX Font-Software for editing purposes or for the creation of new documents."</cite>).</p>
      <p>Can anyone actually ensure that no one will eventually extract anything from even a super-protected file? I don't think so. Why such a statement then?</p>
      <p>Back to the topic, your solution seems enough "protection" for most users who browse websites. As stated many times before, one shouldn't really count in pirates who would steal/wouldn't buy anyway. The question is if font vendors see it as an enough secure embedding on the internet?</p>
