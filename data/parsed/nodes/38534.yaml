    html: |-
      <p>I don't see how Ralf's technique would add frustration to any "honest customers" or even honest web page viewers. </p>
      <p>The "customer," it seems to me, would be the party putting the font on the server. The people viewing the page on the web which utilizes the font, who are not the people who licensed the font, are not prevented from seeing the font at all. If the technique required site visitors to have an account or type in a password or some other nonsense, I could see your point. </p>
      <p>In any case, what legitimate reason would anyone have to extract fonts from a cache (other than to demonstrate that there's a security hole)?</p>
