  html: |-
    <p>I am a forensic scientist who specializes in cases involving printing,  Is there a source where I can look for precursors to digital type fonts, i.e. designed for Microsoft or Apple?  Specifically, I am looking for typeset that was similar to the digital versions of Sylfaen, Old Bookman and Constantia, but that was available to offset lithography typesetters in the early 1990's.  Can you help?</p>
    <p>An image is attached.  It is the main lettering in the company names that I am interested in.  </p>
    <p>Thank you very much.</p>
