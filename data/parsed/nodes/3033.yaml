    html: <p>Paul, <br><a href="http://cgm.cs.mcgill.ca/~luc/fonts.html" target="_blank"> Luc Devroye's font pages</a> are an incredible resource. Several of the specialty <br>font link pages contain the listing you seek. <br> <br>Scroll down to the Dover Press entry on <a href="http://cgm.cs.mcgill.ca/~luc/fraktur.html" target="_blank"> this page</a>, for example. The listing is <br>for the books with CDs of 24 fonts only. Unfortunately, you won't find Nymphic <br>listed. I would think that Nymphic ('tis a beauty, eh?) would appear in one of <br>those 100 Fonts books of theirs, especially the <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0486233022/qid=1076344340/sr=1-1/ref=sr_1_1/103-1448097-5990211?v=glance&amp;s=books" target="_blank"> Victorian</a> one. <br> <br>BTW, I'm the one who exchanged posts with you on MyFonts and via e-mail <br>about Nymphic awhile ago. I'm waiting patiently for your digitization! Perhaps <br>Solotype will beat you to it, though, now that Mr Solo is <a href="http://www.myfonts.com/browse/foundry/solotype/?itemsperpage=29&amp;resultcount=29&amp;page=1&amp;mode=alpha" target="_blank"> releasing fonts</a> on <br>MyFonts. <br><br></p>
