      <p><em>Looks like mutations of Trade Gothic.</em></p>
      <p>Spot-on, Jan. I imagine that for the headlines they zapped the counters into oblivion.</p>
      <p><em>JANUARY-FEBRUARY 07 is Futura Bold</em></p>
      <p>I was going to mention that in my first comment, but left it out because I thought it would be evident! Oh, well.</p>
      <p><em>what specifications on those letters did you find... revealing?</em></p>
      <p>Joel, in the word “PRO-PAGANDA” I looked at the tail of the R (i.e., where does it join the bowl?), the way the stems of the A join at the top, and the vertical stroke and horizontal terminal of the G... Hope this helps.</p>
