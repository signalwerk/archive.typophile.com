    <p>I'm a typeface amateur and looking for some helpful advice.  I'm looking for suggestions for Depression era typefaces (late 1920s to mid 1930s) that I can use for a website. I've read that Futura and Gotham were commonly used during the Depression. But I'm probably missing out on some other great original or revival typefaces from that era.  Thanks so much for your help!</p>
    <p>Nick</p>
