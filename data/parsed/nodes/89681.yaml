      <p>There was a distinction between display lettering often used for headlines and type used for body text.<br>
      To capture the quality of display lettering will evoke the era best.<br>
      That is what Neville Brody did in his custom type for Public Enemies: <a href="http://www.imdb.com/title/tt1152836/" title="http://www.imdb.com/title/tt1152836/">http://www.imdb.com/title/tt1152836/</a></p>
