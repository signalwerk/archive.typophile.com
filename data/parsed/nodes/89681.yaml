    html: |-
      <blockquote><p>It was created in 2000, although the designer said it was inspired by lettering on old buildings in New York City, so Futura may have been one of the inspirations.</p></blockquote>
      <p>Not geometrics like Futura, but rather vernacular gothics in American signage. These (including the Port Authority Bus Terminal signs that were the most direct inspiration) were often all in caps. To my eyes the lowercase letters added to make Gotham look quite contemporary. So I'd say it's legit to use Gotham if trying to evoke the Depression, but it would be more persuasively done in all-cap settings.</p>
      <p>It's like saying Bembo was used in the Renaissance: completely wrong, but not completely unhelpful.</p>
