  html: |-
    <p>I think the subject is self-explanatory. I have been attempting that style for some time in calligraphy, and would really enjoy seeing one in Hebrew. I looked for some time and did not quite find what I was looking for. Even the typeface on "The Hobbit" poster in Hebrew wasn't quite what I was looking for. </p>
    <p>So far, (<a href="http://www.cjstones.com/prod_images/lettering/HebrewScript.jpg" title="http://www.cjstones.com/prod_images/lettering/HebrewScript.jpg">http://www.cjstones.com/prod_images/lettering/HebrewScript.jpg</a>) is the closest thing I have found. Of course, I would add some dots for embellishment to make it more like what most of us are familiar with.</p>
    <p>תודה רבה!  </p>
    <p><img src="http://www.cjstones.com/prod_images/lettering/HebrewScript.jpg"></p>
