    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 7.Jun.2007 7.38am </div>
      <p>The Font Bros are pleased to announce the addition of over 60 great new display fonts from Harold’s Fonts!</p>
    <p>With a font library as large as it is diverse, you’re gonna love this amazing collection! From Retro and Art Deco to amazing Scripts and the largest collection of typable Monogram fonts on the planet, Harold has it!</p>
    <p>And now you can get it only at Font Bros!</p>
    <p>Check it out at: <a href="http://www.fontbros.com/haroldsfonts.php" title="http://www.fontbros.com/haroldsfonts.php">http://www.fontbros.com/haroldsfonts.php</a></p>
    <p>Warmly,<br>
    Mike &amp; Stuart<br>
    (The Font Bros)</p>
