    html: |-
      <p>Adding to the outside of the letter throws up problems because of maintaining consistent vertical dimensions (x-height, Cap height, ascender height etc) between weight variants in the same point size. For example you wouldn't want a bold word emphasised in a line of roman to jump in x-height. </p>
      <p>Having said that, weight can be added to the outside of the letter but mainly in a horizontal direction e.g. stem thickness, which is why bold type (generally) sets a longer line than the roman.</p>
      <p>That's the simplistic answer, I'm sure someone can expand on this in a more eloquent fashion.</p>
