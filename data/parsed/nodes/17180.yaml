    html: |-
      <p>Mostly because that way you can get bolder faster. And since darker fonts need (in fact require) less interletter space, less internal space is better too. Another reason is to avoid making the bold too wide.</p>
      <p>BTW, I have encountered one quantification of how much wider a bold should be compared to the roman: ~8%. This from that old Letraset font editing program - what was it called? I can't believe how shaky my memory has been getting lately...</p>
      <p>hhp</p>
