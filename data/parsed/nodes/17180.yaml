  html: <p>I was reading something and it said when converting a typeface to bold from roman. You add the weight to the inside of the letter. Why is this? Why wouldn't you add it to the inside and out to keep from filling your counters?</p>
  html_clean: <p>I was reading something and it said when converting a typeface to bold from roman. You add the weight to the inside of the letter. Why is this? Why wouldn't you add it to the inside and out to keep from filling your counters?</p>
