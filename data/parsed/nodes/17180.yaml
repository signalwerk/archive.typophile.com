    html: |-
      <p>There is no definitive answer in creating bold weights. When I do it, I add weight to both inside and out but it is not that simple.  The bolder the weight becomes, the more vital the shape of the counter becomes. Counters in bold weights are surrounded by enough black area that they become more prominent as shape,  The figure-ground relationship is a delicate balance and of profound importance in type design. Simply adding weight is easy. Making the form and counterforms balance and serve each other, is the hard part.<br>
      Letterspacing and glyph-to-glyph fit are also of prime concern. The negative shapes between letters must work with the counters and the forms. It is like juggling, you have to keep several balls in the air while you catch one of them then throw another.</p>
      <p>ChrisL</p>
