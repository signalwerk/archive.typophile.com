  html: <p>Vermont native Ron Arnholm developed a love for type being around so many monuments in the Granite State. He studied under <a href="/node/add/wiki?edit%5Btitle%5D=Paul%20Rand" title="Create node &quot;Paul Rand&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Paul Rand</a> at <a href="/node/add/wiki?edit%5Btitle%5D=Yale" title="Create node &quot;Yale&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Yale</a> and has taught at the University of Georgia for several decades. A consummate craftsman, Arnholm will sometimes take 10 years or more to develop a typeface to the point that he is happy with it. He has several typefaces to his credit, but his most successful font families are Legacy and Legacy&nbsp;Sans.</p>
  html_clean: <p>Vermont native Ron Arnholm developed a love for type being around so many monuments in the Granite State. He studied under <a href="/node/add/wiki?edit%5Btitle%5D=Paul%20Rand" title="Create node &quot;Paul Rand&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Paul Rand</a> at <a href="/node/add/wiki?edit%5Btitle%5D=Yale" title="Create node &quot;Yale&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Yale</a> and has taught at the University of Georgia for several decades. A consummate craftsman, Arnholm will sometimes take 10 years or more to develop a typeface to the point that he is happy with it. He has several typefaces to his credit, but his most successful font families are Legacy and Legacy&nbsp;Sans.</p>
