      <p>Don’t get me wrong. I’m not necessarily unhappy that type design is receiving additional recognition as a creative venture. </p>
      <p>But I’m trying to wrap my head around these new definitions of “acquisition” and just what a museum is these days.</p>
      <p>From the <a href="http://www.printmag.com/Article/-At-MoMA" rel="nofollow">Heller article</a> linked above, quoting curator Paola Antonelli: <cite>“.&nbsp;.&nbsp;. it sets curators free to tag the world and acknowledge things that 'cannot be had,' because they are too big (buildings, Boeing 747’s, satellites), or because they are in the air and belong to everybody and to no one, .&nbsp;.&nbsp;. as art objects befitting MoMA’s collection. There is no need to physically possess. After this, the world is ours to tag and collect.”</cite></p>
      <p>I suppose perhaps next MOMA’s Department of Architecture and Design might decide to “acquire” Frank Gehry’s <a href="http://en.wikipedia.org/wiki/File:Guggenheim-bilbao-jan05.jpg" rel="nofollow">Guggenheim Museum in Bilbao</a>?</p>
