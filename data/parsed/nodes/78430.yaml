      <p>It is typical that a museum would wait at least 20 years before determining that something has made a significant enough impact to be worthy of inclusion.  The 90s were the "Burst" time for digital type, why not start there?</p>
  - id: 449318
    user: 14722
    date: 2011-01-27T08:52:00
    date_raw: 27 Jan 2011 — 8:52am
    votes: null
    html: <p>What really stands out to me is the failure on the part of MoMA to research attributions. MoMA attributes Gotham to “Jonathan Hoefler (American, born 1970) and Tobias Frere-Jones (American, born 1970)”. But if one goes back to the Gotham specimen in the 2002 book “Language, Culture, Type” the design was attributed to “Tobias Frere-Jones, Jesse M. Ragan”. Jesse is no longer at H&amp;FJ and is no longer credited for the Gotham design by H&amp;FJ, but if MoMA is going to show Gotham in their collection they should explain why their attribution does not match the earlier attribution. Hopefully MoMA is not just letting type vendors write their own attributions and accepting that as gospel.</p>
