    <p>Hello dear Typophiles,</p>
    <p>I just received this via email from  my much admired professor Dr. Klimis Mastoridis and would like to share it with you as well.</p>
    <p>"MoMA has just acquired 23 digital typefaces for its Architecture and Design Collection. Some are of everyday use, like Verdana; others are familiar characters in our world, like Gotham, which was used in President Obama’s election campaign, or OCR-A, which we can find at the bottom of any product’s bar code; and others are still less common, but exquisitely resonant, like Walker or Template Gothic."</p>
    <p>You may read the full article <a href="http://moma.org/explore/inside_out/2011/01/24/digital-fonts-23-new-faces-in-moma-s-collection" rel="nofollow">here</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_6263.jpg"></div><p></p>
    <p>Regards,<br>
    SB</p>
