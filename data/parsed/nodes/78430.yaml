      <p>Kent, I did not read your comment that way. The designers deserve it, no question.</p>
      <p>At the same time the selection and reasons provided for each typeface's inclusion suggest that it is less the typefaces themselves which have been added to the collection, but that they rather serve to represent technological and/or esthetical milestones. Unfortunately the choice exhibits a pretty narrow view on type, but is quite telling about what type is to "graphic design critics, designers, and historians" (mentioned as advisors in the <a href="http://moma.org/explore/inside_out/2011/01/24/digital-fonts-23-new-faces-in-moma-s-collection" target="_blank" rel="nofollow">article</a>): design critics remembered FUSE, designers know <em>the</em> NY type foundry, and Mr Carter thanks to previous recognition, etc. Plus something along the line, oh, wait, I know yet another Carter and/or Hoefler we could include too. :)</p>
      <p>Jörg Gustafs, yes.</p>
