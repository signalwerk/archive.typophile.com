      <p>How can a museum "acquire" something with no capital value?<br>
      This is listism, and not much different from the commentary of anyone who has written an opinionated type history, from Updike to Blackwell.</p>
      <p>The return on investment—the value added—from which the museum profits in admission fees and collateral revenue (catalog sales &amp;c.), is produced by the curators.</p>
      <p>I am in two minds of how good this is for type designers. On the one hand, being propped by MoMA enhances our status, but on the other it devalues our work. Let's face it, "acquiring" typefaces is a cheap way to put on a show. I don't see any House Industries fonts on the list — their licence (for, say, the brilliantly Postmodern Chalet, a suitably modern arty type) may have been a bit prohibitive, perhaps gearing fees to gallery admissions!</p>
      <p>It also undermines the position of the museum, because it opens the door for virtual curation. Now anyone can be a curator.</p>
      <p>Fontshop's Best of 2009 was "hand picked" -- will its Best of 2010 be "curated"? I hope so!</p>
