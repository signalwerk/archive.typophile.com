      <p>This selection is, as any kind of our statements as human beings, a purely subjective definition of truth. And as any definition of truth, it is a means of power. As in similar selective typeface listings, the people behind it have their own POV and interests. Meh.</p>
      <p>Of course one could question if their definition couldn’t be more representative (i. e. borne by more people who deal with type / type history).<br>
      But who’s to define whether someone is capable of defining a more representative selection or not?<br>
      ;)</p>
      <p>JoergGustafs:<br>
      I share your sentiments towards said two 90s typefaces. For similar reasons, I wouldn’t expect a Jugendstil typeface in such a selection, from a present-day perspective (the different socio-cultural background being another one of the many parameters to define our perspective, of course!!).<br>
      /side note:<br>
      Your mention of Salden is interesting since it probably shows the power of the authority to define, the power of sovereignty of definition.<br>
      Then again, on a personal note, it was Meta and its popularity that made me take notice of GST Polo.<br>
      And I know that this is true for most of the younger designers who heard about Salden / Polo.<br>
      Wouldn’t this make Meta some kind of predecessor of Polo?</p>
