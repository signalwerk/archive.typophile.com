      <p>No selection of typefaces could ever claim to be universally valid.<br>
      And I’m probably expecting too much of a type-historical component in such a listing.</p>
      <p>But this is darn 1990s-heavy. To me, typefaces like Blur or Template Gothic represent rather the exploration of new technical possibilities and very temporary shapes without adding to, let alone creating something of ‘revisionary’ value (is that even a word?).<br>
      I haven’t seen these two particular designs for a while and every time I see them, it’s either a design from the 90s or something that unfortunately looks like from the 90s.</p>
      <p>So many type-historically important typefaces are missing, wouldn’t even know where to start.<br>
      And what about Georg Salden’s GST Polo?<br>
      <a href="http://www.typemanufactur.com/eng/fonts/polo/styles.html" title="http://www.typemanufactur.com/eng/fonts/polo/styles.html">http://www.typemanufactur.com/eng/fonts/polo/styles.html</a><br>
      <a href="http://www.typemanufactur.com/eng/fonts/polo/designinfo.html" title="http://www.typemanufactur.com/eng/fonts/polo/designinfo.html">http://www.typemanufactur.com/eng/fonts/polo/designinfo.html</a><br>
      Designed from 1972-1976, it anticipated Meta and everything that has seemingly been anticipated by Meta.</p>
      <p>@ Nick Shinn:<br>
      You might consider donating one of your typefaces, apparently that’s how some typefaces got into this ‘selection’.<br>
      [I’d never doubt that Retina is a great design – but isn’t it still far from being new or outstanding, even (or even more) in 1999?]</p>
