      <p><cite>you bring up an interesting point about these letters not constituting a font, but if they’re not of a “font” or of a “type”, then what are they?</cite></p>
      <p>Lettering. Carefully drawn, built-up letters, as opposed to calligraphy in which the strokes of the letter are usually a single width of the pen or brush being held at a particular angle.</p>
      <p>I think your final sentence is fine, but maybe mention that it was the look almost universal to newspapers then rather than something particularly unique to this one.</p>
