    html: |-
      <p>This strikes me as odd and potentially misleading phrasing. Will your reader understand that your example blackletter types postdate the nameplate, and thus could not themselves have "informed" the design of it? </p>
      <p>And, using the word "customized font" implies that a whole alphabet of individual type sorts was made for the newspaper, when (as I understand it) if it was indeed a custom nameplate, it would have been a single piece and thus not properly called a "font" (and probably not properly called "type").</p>
    html_clean: |-
