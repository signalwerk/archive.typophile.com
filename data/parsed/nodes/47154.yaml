    html: <p>According to the <a href="http://www.typografie.info/typowiki/index.php?title=Schriftklassifikation_nach_DIN#Gruppe_X:_Gebrochene_Schriften" rel="nofollow">DIN scheme</a>, blackletter typefaces can be classified into 5 categories. This would be a ‘<a href="http://www.typografie.info/typowiki/index.php?title=Gotische_Schrift_oder_Textura" rel="nofollow">Gotisch</a>’. One can add that it is ‘<a href="http://www.google.com/search?q=site:typophile.com%20handtooled" rel="nofollow">handtooled</a>’.</p>
