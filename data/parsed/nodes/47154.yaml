    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fwGazette_masthead_3756.jpg"></div><p></p>
    <p>This is the masthead for a paper in Fort Worth, TX in 1882.</p>
    <p>Not having much experience identifying types, I looked around on the web, &amp; the closest I could find was Cloister Black (though looking at Cloister Black in detail now, it seems there's way too many differences between it and this masthead type for the latter to be a mere modification of the former).  </p>
    <p>Any help would be much appreciated.</p>
    <p>Thanks!</p>
