    html: |-
      <p>The question to ask is this: which features do you want to be aligned at small sizes and low resolutions, and which features are you happy to let pop up and down a pixel at some sizes? Features that you want to be aligned need to be within the same blue zone.</p>
      <p>Note that if you do end up making large blue zones in order to accomodate the widely ranging height, you may need to adjust the size of the BlueScale value. <a href="http://typophile.com/node/42173?" rel="nofollow">See here for more information on correct calculation of BlueScale.</a></p>
