  html: |-
    <p>Hi there,</p>
    <p>I am designing a 'casual brush' font and because of it informal nature every character doesn't 100% respect overshoot limits.</p>
    <p>My question is: how the alignment values should be? Should they fit the overshoot despite the characters sometimes surpass them here and there OR should the alignment values have as limit the characters with the more extreme nodes? </p>
    <p>Thanks in advance.</p>
    <p>Ramiro.</p>
