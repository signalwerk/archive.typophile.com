    <p>Hi there,</p>
    <p>I'm doing a final project for a class, and I have to manipulate an image via Photoshop, and I chose to manipulate this image: <a href="http://lissawriting.files.wordpress.com/2011/10/culture5.jpg" title="http://lissawriting.files.wordpress.com/2011/10/culture5.jpg">http://lissawriting.files.wordpress.com/2011/10/culture5.jpg</a></p>
    <p>I want to change out the words that they use with words of my own, but I want to use the same font and I cannot for the life of me figure out what font it is.</p>
    <p>The project is due early this week, and I'm really nervous that I won't find the font in time...wondering if someone can help?</p>
    <p>Thanks so much!</p>
    <p>Laura</p>
