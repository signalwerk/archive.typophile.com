    html: |-
      <p>&gt;work in harmony<br>
      Both (btw. which of those Garamonds?) differ in x-height, construction principles of the glyphs, dynamic vs. static appearance, etc. To prove that try to put them together in one line of text and look at the result – it doesn't feel right in my opinion. But if there is enough space between them, difference in size and weight, etc. then the combination could work.</p>
