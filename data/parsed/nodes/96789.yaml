      <p>I wish <em>Letters of Credit</em> were longer...<br>
      The 1973 edition of <em>A Tally of Types</em> isn't perfect as an account of Monotype's hot-metal text faces, but it does have extra value as an example of how much better Centaur, Arrighi, Bell, 9-point Times and Van Dijck looked in the old days than the digital versions do now. (Except for Romulus, I don't think the other faces are presented so well, mainly because of the generous inking.)</p>
