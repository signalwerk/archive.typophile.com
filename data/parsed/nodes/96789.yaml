      <p>Yeah, I have Studley's "Left-handed Calligraphy" myself. Read it so you don't try. :-/  From that other thread*:<br>
      "<br>
      BTW, I managed to dig up that "Left-Handed Calligraphy" book (Vance Studley, a 1991 Dover facsimile of the 1979 edition) and the inconsistencies I see here are reflected there as well. By turns you read things like "With a little effort, you can learn to letter with the broad-edged pen as well as the right-hander", followed not far afterwards by things like "the left-handed person is kept at a disadvantage" and "It is an altogether different way of tackling the problem and must be seen from this other point of view". Every passage contains a "sure, no problem" followed by a "it's really different". Very unnerving, and it leaves the impression that the nasty truth is being obscured.<br>
      "</p>
      <p>* <a href="http://typophile.com/node/48843?page=1" title="http://typophile.com/node/48843?page=1">http://typophile.com/node/48843?page=1</a></p>
      <p>Buying: Unless it's a must-own I first check the UCLA libraries to see if I can save the money; then I check bookfinder.com .</p>
      <p>hhp</p>
