      <p>Just one caution -- Before settling on Miller for a project -- now or later -- and if time is an issue &amp; you want old-style figures, you need to get up with Font Bureau &amp; make sure they are readily available. </p>
      <p>I believe Carter &amp; Cone is now using FB for all distribution. For years, I dealt with C&amp;C and sometimes had access to characters Matthew was willing to release, but hadn't.  (A lot of times these would be pieces of character sets that just didn't fit the standard, hard-wired Mac/Windows encodings of the PostScript era.)</p>
      <p>FB probably has everything, but it may not have been all packaged up &amp; be ready to go.</p>
