      <p>I second Elena, Lyon, Iowan Old Style, Documenta, Dante, and Sina Nova.</p>
      <p>Additional suggestions: Girando Pro, Tundra, Novel, Yoga, Andron, Sirba, Comenia, Expo, Milo Serif and Stuart.</p>
      <p>In your decision, consider the features you need and verify if they are included. Recently I was almost purchasing a license for Tundra when I realised it has small caps just in straight styles (and I need true small caps also in italics). Similarly, a purchase of Elena was aborted due to superscript absence.</p>
