      <p>I interpreted his wish as something that is not quirky or that calls attention to itself ("timeless"), not overly used (so not Minion, ITC New Baskerville, Adobe Garamond, etc.) and leaning toward modern (possibly meaning recent trends for lack of constraints towards linotype/monotype proportions, and often slightly darker look with more defined serifs, or just a modern interpretation of traditional type). So a replacement for Adobe Garamond might be Sabon New or Verdigris. Many modern typefaces have nicer italics.</p>
      <p>I realize Galliard is popular, but I don't find it very readable in its digital forms. One of the major scientific magazines adopted it and changed again in less than a year (to Quadraat). There are more elegant typefaces, if that is what is desired.</p>
