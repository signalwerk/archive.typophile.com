      <p>The texture of Galliard did change (as does its texture even when "simply" printed on different stock for example) but I wouldn't call that change a <em>novelty</em>. What I'm really talking about is things like Legato and Fenland.</p>
      <p>"Counterpunch" (sp.) is a great book, and helps those detached from previous eras a great deal (which describes me back when I read it). But it really just explains a precedent. For myself, the most valuable part of "Counterpunch" was the discussion of how the "j" could be reformed; this led me to my Alphabet Reform work, and to my rejection of chirographic type. BTW it's certainly a paradox that I'm pretty sure Smeijers doesn't agree with me on that in the least.  :-)</p>
      <blockquote><p>Something the guys in the metal era did automatically when they inked a punch &amp; pressed it into paper.</p></blockquote>
      <p>Note however that the metal guys used <em>smoke proofs</em> when cutting the punches, so they didn't actually see the accurate end-result very early - they needed a lot of experience to be able to reduce costly iteration. In digital we iterate much faster, and certainly much cheaper.</p>
      <p>hhp</p>
