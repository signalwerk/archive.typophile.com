      <p>To me, a large part of "texture" suggests the balance between the fine lines and the thick, and the overall weight, as the type is spaced.</p>
      <p>Quick: did the "texture" of Galliard change when we went from repro-negative-plate to DTP? Galliard was a brilliant, beautiful face. And why do so many people say "was"? Because the relationship of its fine lines to thick was critical, as with the Didones, Bodonis, etc., and that relationship got messed up as the way of putting ink on paper changed. So, yes, the texture of Galliard changed, even though the letterforms didn't.</p>
      <p>To me, all you're really saying is the good modern designers have finally read Smeijer's <cite>Counterpoint</cite>, and have learned that the drawing of the letterforms is is only a first step. The next is how a particular technology puts ink on paper or pixels on a screen.  At the desired size. Something the guys in the metal era did automatically when they inked a punch &amp; pressed it into paper.</p>
