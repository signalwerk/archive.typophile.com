      <blockquote><p>I interpreted his wish as something that is not quirky or that calls attention to itself ("timeless"), not overly used (so not Minion, ITC New Baskerville, Adobe Garamond, etc.) and leaning toward modern</p></blockquote>
      <p>This is what I was after, yes. To be clear, I am not obsessed with letterforms. I am more concerned with how the text flows, the overall texture of the page, and especially what kind of "feeling" is produced. For example, I understand why Garamond is used so much since it produces a good looking page that is easy to read. However, when I show specimens of candidate fonts to our people, Garamond always gets the comment, "old fashioned".  That isn't something I want people to associate with our work.</p>
      <p>Minion passes the look and feel requirements, and I may use it if nothing else can be found. Part of our branding strategy is to differentiate ourselves from other publishers. Setting books in Minion doesn't further that goal. I realize that readers aren't going to notice that we are using a popular font or something more obscure, but readers are not the only target audience. Potential authors, artists, designers, and editors will also see our work, and some of them may actually be paying attention to the details of how the books are put together and making judgments about us based on those observations.</p>
