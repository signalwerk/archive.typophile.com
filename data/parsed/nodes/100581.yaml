    <p>First I have to confess that I am a complete neophyte in the field of typography. Our small (micro...nano?) press has been publishing eBooks for 2 years now and we are finally diving in to the world of print books. I know very little about choosing type faces, but I am not blind to the aesthetics of the printed word. </p>
    <p>We are a publisher of both contemporary and historical fiction. I want a font that is easy reading, has a timeless character (leaning toward the modern), is distinctive, and is suitable for digital printing. My two top candidates at the moment are Hoftype Cala, and Okay Type Harriet.</p>
    <p>I want to stay away from the usual suspects for book design (Minion, Bembo, Garamond, ...) but not get too crazy either. Any help, or suggestions for further learning are welcome.</p>
