      <p><cite>What is it about the Harriet that makes it bad for offset printing?</cite></p>
      <p>If your eye doesn't tell you, you'll probably have to learn the hard way, by doing. With all fonts, learn to look at the letterforms and what the final, printed result looks like. Eventually, you should learn what happens to a font* with all kinds of presses, and all kinds of paper. </p>
      <p>Type on the screen isn't my forte, but likely something similar happens there, too.</p>
      <p>BTW, for those commenting on Galliard: it was pretty much always a "digital" font, if you count the Linotype 202 and 505 as "digital." Some do, some don't. Some like to have it both ways, depending on what they're pontificating about.</p>
      <p>The Bitstream versions were always digital. Finally, there was no change in the letterforms of Carter &amp; Cone Galliard after it was released in the 1990s, again as PostScript. The only subsequent changes were in the platemaking technologies used for offset printing.</p>
      <p>*The "font" being different than the "design."</p>
