      <p>Sina Nova, designed by the same person as Cala, might be a bit better book font, as it is very slightly narrower and has a slightly large x-height (if that is desirable...).</p>
      <p>Edit: My mistake: Comparing Cala and Sina Nova side by side in Illustrator, if one controls for the difference in point size, the x-height is the same. Cala, however, uses more bulb terminals and slight curves in the top of brackets, while Sina Nova is more caligraphic on terminals but uses more straight lines. The italics are different: Sina has no serifs on some of the desenders. Sina Nova is slightly narrower, which I think would work a bit better.</p>
    html_clean: |-
