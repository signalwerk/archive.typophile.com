      <p>Let's see, you want something timeless and classic, but don't want to use a timeless &amp; classic font.</p>
      <p>???</p>
      <p>Best thing to do with a first job is to steal like crazy. Go into a bookstore &amp; find something you like. Not like to look at, but to read. Rip off the design. The more you try to put your fingerprints on it, the greater the odds you'll make a mistake.</p>
      <p>You mentioned two fonts, Hoftype Cala, and Okay Type Harriet. Well, the letterforms of Cala look like they will print on an offset press, using an uncoated stock. That's not true of the Harriet.</p>
      <p>I don't know these fonts, aside from seeing the letterforms as they pop up on Google. Space is a more important factor in reading than letterforms. How's the fit of the characters? If you set a page or two, using the trim, margins, and type size you want, how many leadings (linefeeds) work well with the chosen type size? If it's zero, it is a bad typeface. If it's one, there are many better.</p>
      <p><cite>but I am not blind to the aesthetics of the printed word. </cite> </p>
      <p>Well, if we're talking about the printed word as it occurs in an object, the book, then you should already know the spacial relationships are most important.</p>
      <p>Your posting here, and your emphasis on "something new" suggests to me you're primarily interested in leterforms. I could be wrong; let's assume not. Readers don't much care about letterforms. They read words -- really, clumps of words.  If you want to say letterforms have a subtle influence, I agree. But if a typeface has a major problem, appealing letterforms don't even start to make up for it.</p>
      <p>There are a couple good presses in Texas -- award wining designers, with production values that go beyond "graphic design." They might well be willing to talk, to give you a hand. Try Mary Ann Jacobs at Texas A&amp;M, and/or Ellen McKie at UT-Austin.</p>
      <p>If they would see you, a visit would be very educational, I'd think, and Texas A&amp;M should be within driving distance from Houston. Kevin Grossman would be another contact at Texas A&amp;M.</p>
