      <p>As you have correctly surmised, type design for ideographs (aka, Chinese characters) is complex. While there have been several methods for semi-automagically composing entire glyphs using a library of primitive stroke-like elements, Adobe creating one of them, the vast majority of Chinese and Japanese typefaces are designed one glyph at a time using a team of designers. The master designer first creates a smaller number of prototypical glyphs that serve as examples for the team of designers. These prototypical glyphs are important, because they contain almost all of the elements that make up the thousands (or tens of thousands) of glyphs that need to be made to complete the font. The time needed to complete the design of a single Chinese or Japanese font is measured in man-years.</p>
      <p>Korean fonts include hangul, which represent an alphabetic writing system composed into square syllables. There has been greater success in automating the design of hangul using the primitive elements, called jamo.</p>
      <p>Obviously, there is more to Chinese typeface design than I have summarized above. The best way to appreciate the work and effort that is involved is to visit one of the type foundries, to see first hand how it is done.</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
