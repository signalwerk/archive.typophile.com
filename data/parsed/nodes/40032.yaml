      <p>Most characters can be described in terms of their radicals, of which there is a total of about 300. Individual stroke-types are generally only useful for learning how to move the calligraphy brush.</p>
      <p>Because of the difficulties in maintaing 10s of thousands of characters, with many variants and obscure characters, in the history of Chinese printing, printers have generally found it more efficient to directly carve a plate for each page.  </p>
      <p>As Dr. Lunde states, each character is designed individually. This is due to the need for an aesthetic balance for each character. So far the best device for the "automagic" recombinations for each character has proved to be a writing utensil attached to the brain of an experienced calligrapher or designer.</p>
      <p>The designs of most fonts are based on brush calligraphy (which has many different styles), and secondarily on a long tradition of wood plate printing (which of course is based on brush calligraphy). </p>
      <p>..</p>
