    <p>I read a article a while back on pingmag that talked about the emergence of Iranian typography and it really got to start thinking about typography in other scripts. Naturally, being Chinese and also because of the increasing number of people who are learning Chinese, I became very curious on both how Chinese typefaces works and how much focus there is on its design.</p>
    <p>It seems that the way in which it is designed would have to be fundamentally different from how English typography works since it is a character based system instead of an alphabet based. I would assume that simply the basic strokes are designed and then it is somehow compiled into characters through some sort of program. But I'm not really sure at all. </p>
    <p>However, a search on google hasn't come up with much and I was wondering if anybody has any leads on this obscure yet fascinating topic. I think it's something that has the potential to become very big and also give us all a new perspective on how we look at typography.</p>
