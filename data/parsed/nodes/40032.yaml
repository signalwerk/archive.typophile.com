    html: <p>If you can google in Chinese, I think you will get some results! For the recent new Japanese font for Vista, the Microsoft booklet "Now Read This" explains that a team designed many thousands of Chinese characters (called Kanji in Japanese) and then programmed the rest to scale the radicals to build new characters.</p>
