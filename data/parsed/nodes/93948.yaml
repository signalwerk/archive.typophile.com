    <p>Hello Typophiles.</p>
    <p>Besides of being a type lover, I am also a big football fan.<br>
    I know that big events like <strong>UEFA Euro 2012</strong> brings new typographic custom made football kit  numbers to the football kit of every national team.</p>
    <p>Like Commercial Type foundry did for <a href="http://commercialtype.com/uploads/200002/1330453840231/Bent-483-xxx.jpg" rel="nofollow">England national team</a>, every national team have his typeface that show up in games and in commercial ads.</p>
    <p>I think it is a really interesting topic to post here what you know about every football kit number / typeface (e.g: like who made that typeface, and some links of interest); in that way, making here a little collection about numbers, and about typefaces in football kits.</p>
    <p>So, if you know something, brig that knowledge to here </p>
    <p>BTW: Czech Republic kit numbers are quite interesting!</p>
    <p>Best Regards<br>
    Fábio Santos</p>
