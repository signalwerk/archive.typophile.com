    html: "<p>Hype, in my understanding, involves elevating excitement about something that isn't in itself exciting, typically through media manipulation, public relations, advertising etc. So whatever else a bunch of physicists in a lecture hall using Powerpoint to explain their discoveries to other physicists is, it doesn't seem to me hype. As to whether the thing itself is exciting, that seems to me to depend entirely on individual interest. Higgs and his colleagues theorised that in order for the standard model to remain viable there must be a field that gives mass to the particles that go through it, and on the basis of that theory predicted that a boson particle with specific properties would be found if one looked in a particular place. That's really good science: theory leading to prediction leading to experiment. And the announcement this summer is that yes, a boson was found exactly where predicted by Higgs and his colleagues, and now physicists need to determine its properties. Now, I happen to think this is exciting, and would have found an announcement of failure to find the boson exciting too, because either result has major implications for what remains our 'least incomplete' understanding of the physical universe. The fact that, after the experiment, the standard model is still looking pretty good, despite known problems with some aspects of it, is exciting to me because I find it exciting that human beings, through intelligence and ingenuity and mutual effort, have come to understand so much of the nature of physical reality. If that doesn't excite you, that's fine too: I don't think anyone is obligated to be excited by things that don't interest them. If you think its a waste of money, that's a legitimate concern, and there definitely is a debate to be had about the funding of the increasingly costly experiments at the fore edge of particle physics. I don't think one needs to denigrate the results of those experiments or characterise their publication as 'hype' in order to have that debate. I am interested in and excited by the latest CERN results <em>and</em> think the cost might be more than we should pay. On the other hand, as with footballer salaries, there is no guarantee that the money saved by not funding CERN would go to better or more worthy endeavours if not spent in that way.</p>"
