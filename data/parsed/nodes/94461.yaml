      <p>@Nick Shinn:<br>
      <cite>The relationship between physics and understanding the universe is such that we’ll never get there—always some new horizon.</cite></p>
      <p>That may be. But, even if it is true that we will never <em>totally</em> understand the Universe, how does it follow from that premise that it is not worthwhile to work so that we understand more rather than less?</p>
      <p>It is a good thing to have computers instead of doing calculations by hand, it is a good thing to have comfortable homes with central heating, it is a good thing to have modern dentistry and other aspects of modern medicine, it is a good thing to be able to read and write.</p>
      <p>Of course, new physics doesn't seem to be required for new <em>technology</em>, which is more of an engineering matter. But our current feats of engineering do rest on scientific discoveries, even if they are relatively old ones like electromagnetism for the most part.</p>
      <p>It's true that science has made wars deadlier, and while the "green revolution" may have saved a billion lives, science can't make it possible to follow our instincts and increase the size of our population exponentially forever.</p>
      <p>But science should be valued because of what it <em>can</em> do: it gives us the power of having more and better choices. It can't make sure that we will make the right choices, or that <em>other people</em> will make the right choices, but that is no reason to throw it away.</p>
