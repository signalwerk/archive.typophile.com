      <p>I can't get too exercised about the use of Chalkboard / oops Comic Sans in the Fabiola Gianetti part of the presentation, just like I can't get too exercised about the use of PowerPoint, which Edward Tufte trashed. It might be that Comic Sans has become kind of a physics vernacular. It would be fun to have Fabiola say why it was used. I kind of like the ironies. Especially in comparison with the way new iProducts are rolled out. I'm reminded of a ppt by Sarah Rosen, one of Denis Pelli's students which takes a “graphic novel” approach!</p>
      <p>Would I like to take the presentation and work it over from a information graphic and fine-typographic point of view? I don't know. I kind of like it as an artifact.</p>
      <p>What does excite me is the narrative exemplification about how science works. You can hear about it at the end of the video [link posted by Ryan] at about 2:02:25, when Peter Higgs himself speaks. A longer version of the story is here: <a href="http://www.youtube.com/watch?v=apto_-b1oOo&amp;feature=related" title="http://www.youtube.com/watch?v=apto_-b1oOo&amp;feature=related">http://www.youtube.com/watch?v=apto_-b1oOo&amp;feature=related</a> starting at about minute 5.</p>
      <p>Role-unit neurons with a triplex sensitivity in one of the higher levels of the visual cortex would be my Higgs boson. But the lack of them may be my Waterloo.</p>
      <p>Also listen to Gerald Garulnik, from about 2:06:50, especially what he says after 2:08:15.</p>
