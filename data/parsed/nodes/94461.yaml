      <p>@hrant:<br>
      <cite>I was just making a joke</cite></p>
      <p>I see no reason to take my post as a criticism of yourself; I could have understood if <em>dumpling</em> did that. Although it wasn't really intended as a criticism of him either, as I am not fond of political correctness, even though I believe in equality: what political correctness ends up doing is giving the legitimate concern for equal rights a bad rep.</p>
      <p>This created some confusion in another recent thread, where my noting that Papyrus was popular, and simulation faces unpopular, due to the present climate was interpreted by one poster as a denunciation of simulation fonts <strong>on my part</strong>... in which I manfully strove to resist rising to the bait.</p>
      <p>Accents can be an impediment to communication, even where it would be unproductive to complain about them. And, for that matter, it isn't bigotry for employers to insist that employees have the ability to use correct spelling and grammar when writing, where external communications are part of the job, even if this is a barrier to people for whom English (or whatever other language is local) is a second language. As long as reasonable allowances are made, and qualifications of this nature are not sought when not required, as an artificial means of exclusion, there should not be a problem with employers seeking what they require.</p>
      <p>One could, legitimately, criticize English spelling, like Chinese characters, as an artificial barrier to social mobility - but a project of language reform is something one has to expect to be difficult to either initiate or bring to fruition.</p>
