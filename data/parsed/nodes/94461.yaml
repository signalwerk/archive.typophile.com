      <p>So, what's the problem?</p>
      <p>If you read the news articles carefully, the eggheads know that they've found something that <em>might</em> be the Higgs boson—or, at least, one of the five or six different variants that people said to be on the lookout for over the past forty-eight years—but, frankly, they are not sure. It may take months—or even years—to figure that out.</p>
      <p>But, hey: they found something novel, so why not keep it light? After all, they could be wrong and the joke would be on them for making such a big fuss about it in the first place.</p>
      <p>So, what says "only kidding" better than Comic Sans? Sometimes, the way out is the way in.</p>
