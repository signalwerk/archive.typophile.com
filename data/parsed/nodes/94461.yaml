      <p>@Nick Shinn:<br>
      <cite>Surely they would rather have had more conclusive, more substantial results to announce.</cite><br>
      <cite>The announcement was rushed out before the purse-wielding powers-that-be took off for their summer vacation.<br>
      CERN is desparate to save face and preserve funding during the ongoing international economic slowdown.</cite></p>
      <p>That may be part of it, but the significance of the discovery was a major factor. Because of the great interest in the existence of the Higgs boson, sitting on the results for a greater length of time would have created the possibility of leaks, and hence a need for security precautions that would have been awkward and time-consuming.</p>
      <p>And to the extent that funding is an issue, a rushed preliminary announcement creates an impression of a significant discovery, and could thus be viewed as part of the hype, if one wants to be cynical. But the Higgs boson has received enough notice over the last decade that I don't think one needs to go to great lengths to make it seem important.</p>
      <p>I've just read <a class="freelinking external" href="http://www.theregister.co.uk/2012/07/24/what_next_for_higgs/" rel="nofollow">recent news reports</a>, though, noting that while the particle detected is definitely a boson - having the right spin - and has the right mass, there are further measurements that are needed to determine if it really is the Higgs instead of just some random ordinary boson in that mass region.</p>
