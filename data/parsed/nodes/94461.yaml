      <p>I had thought you were joking, but a Google search found</p>
      <p><a class="freelinking external" href="http://www.rickey.org/god-particle-found-higgs-boson-live-video-stream-announcement/" rel="nofollow">http://www.rickey.org/god-particle-found-higgs-boson-live-video-stream-announcement/</a></p>
      <p>I <strong>can</strong> think of a reason why this was done. Of the fonts likely to be handy - and, naturally, scientific and technical types will consider the choice of the ideal typeface to be a secondary consideration - Comic Sans has an appearance which might suggest <em>handprinting in chalk on a blackboard</em>, thus setting the right emotional tone for what is a relatively informal presentation.</p>
      <p>Obviously, a more appropriate font will need to be made available to forestall a repetition of this <em>faux pas</em>. There are science and math types who dig type - think of Donald Knuth's <em>Computer Modern</em> - so I think we'll see something appropriate added to the selection of TrueType fonts included in Linux distributions in the next little while without a need for action by the typographic community.</p>
      <p>Of course, there may have <strong>already</strong> been the ideal font for this purpose available as a free font, but "handy" trumps "free" for busy people.</p>
      <p>EDIT:</p>
      <p>A brief search on Dafont suggests that the œuvre of <a class="freelinking external" href="http://www.kimberlygeswein.com/" rel="nofollow">Kimberly Geswein</a> might be likely to include something helpful in this regard. "Set Fire to the Rain", for example, might have worked. Or "Architect's Daughter". Or "Shadow of the Day".</p>
