      <p>Mathematicians, physicists, and engineers used to rely on a handful of workhorse faces (Times Roman, Computer Modern, etc.), not because they liked them, but because the more decorative fonts didn't include a comprehensive enough set of Greek characters and mathematical symbols for the content they were writing about. </p>
      <p>And of course, they carefully avoided sans serifs, since they make it difficult to tell the numeral <strong>1</strong> from the lowercase <strong>l</strong> and the capital <strong>I</strong>.</p>
      <p>So the choice of Comic Sans for this presentation seems less of a lapse of taste than a tool poorly suited to the job.</p>
