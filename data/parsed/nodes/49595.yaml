    <p>Hi everybody,</p>
    <p>I was wondering if you could help me narrow down some choices.</p>
    <p><strong>Requirements:</strong></p>
    <p>* Company profile: educational/publishing/media company in the religion/spirituality genre - helping people use the wisdom of the world's religions to enhance the quality of their daily lives</p>
    <p>* Need a strong forward-looking workhorse sans family for my company, something to use alongside the logo for letterheads, business cards, internal reports, study guides, correspondence, etc. May also need it for the sans on the back cover of books.</p>
    <p>* Since I'm going to be publishing various media (books, guides, etc), I also wanted to start building up my own typeface library, so I wanted it to have some longevity, though I am not against making future purchases of new typefaces that make me smile to set some text in them :)</p>
    <p>* Keep costs per typeface family under $300, at least until my business gets off the ground.</p>
    <p><strong>Candidates</strong></p>
    <p>* National</p>
    <p>* Proxima Nova</p>
    <p>* Neutraface No. 2</p>
    <p>I'm leaning toward Proxima Nova as the overall workhorse, and National when I need something warmer and for longer text.</p>
    <p><strong>Already Ruled Out (mostly due to price for now; a few of them I'm just not thrilled about the look)</strong></p>
    <p>* Priva Pro, Prelo, Sophisto, Stalemate, Whitney, Vista Sans, Ronnia, Gotham, FF Strada, Flama, Verlag, Lisboa, FF Kievit, FF Legato, Fresco Sans, Mundo Sans, Bliss, Fedra Sans, FF Meta, FF Quadraat Sans, FF Scala Sans, Versa Sans</p>
    <p>Any others I should consider that would fit my requirements?</p>
    <p>Thank you in advance.</p>
    <p>Rahim</p>
