  html: |-
    <p>While doing some research, I came across this little tid bit about the original Garamond, by Garamond himself, was missing the serif at the top right hand corner of the cap "M". Does anyone know about this? I was wondering if anyone had ever seen this, I'm very curious to see it, or to know more about it.</p>
    <p>“particular such letter is the capital M , which in the early models lacked the serif at the top of the right stem.”</p>
    <p>Alexander Lawson, “Garamond.” in Anatomy of a Typeface (Boston: David R. Godine, 1990), pg 133.</p>
