      <p>The right ear of Garamond’s M – almost as famous and mysterious as Van Gogh’s left ear.</p>
      <p>The short version is that Jenson’s M had bracketed top serifs extending outward and inward.<br>
      See (a) in the illustration below.</p>
      <p>The M of Aldus Manutius’ typeface had only one ear on the left and no right-hand top serif<br>
      See (b) in the illustration below.</p>
      <p>Early Garamond typefaces followed this 'one-eared' approach, and it was only later that these typefaces got two top serifs extending outward.<br>
      See (c) in the illustration below.</p>
      <p>Fot this reason it was assumed that Garamond copied Aldus’ typeface.<br>
      This theory is quite convincing. </p>
      <p>The only problem that there were four or five punchcutters around at the same time (including Augereau, Gryphius, de Colines, Garamond and some others) who were designing typefaces of a similar, new style (what is nowadays called ‘Garamond’), and it is very likely that some of the typefaces which were formerly attributed to Garamond were actually designed by someone else. </p>
      <p>This article has more information:<br>
      Hendrik D. L.Vervliet: ‘The young Garamont: roman types made from 1530 to 1540’, in: Typography Papers no 7 (2007), pp 5–60</p>
      <p>[The illustration is from Vervliet’s article: ‘The young Garamond’. It shows the principle of the top serifs, not the real, original typefaces]</p>
      <p>For more info about Garamond see also: Typowiki  –&gt;  typefaces  –&gt; Garamond<br>
      <a href="http://typophile.com/node/12481" title="http://typophile.com/node/12481">http://typophile.com/node/12481</a>?</p>
