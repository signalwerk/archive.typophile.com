    <p>This is not exactly type related, but since there are so many graphic designers on here I am hoping that someone can help me out.</p>
    <p>Lately, I am experiencing a lot of difficulty with color management and I would like to know if any of you have tried-and-true processes, setups, etc. that you wouldn’t mind passing along to a felow designer that is about to loose his mind.</p>
    <p>This is my current setup:</p>
    <p>1 - Mac 1GHz PowerPC G4<br>
    1 - NEC MultiSync FE991SB Monitor<br>
    1 - Dell E193FP Monitor<br>
    Adobe CS 1<br>
    Savin CLP28 printer</p>
    <p>I can get color to print properly, but it doesn’t look right on my monitor and more importantly the colors do not print properly when they are sent off to press or to print in a magazine. When I calibrate my monitors and get it right on screen it does not print properly. </p>
    <p>Thank you for any help you can provide,</p>
    <p>Duncan</p>
