      <p>I was recently working in CS1 and had a good system.</p>
      <p>I ran ColorSync and every App on a Colormatch  1.8 Gamma profile, and used the US Coated CMYK for typical workflow.</p>
      <p>I would start by making a profile of my monitor with the Spyder, and use that profile for the auto screen adjustment in Quark, Indy etc.</p>
      <p>In addition I had an IT8 callibrated software for my printer, and a third party software for my proofer/RIP.</p>
      <p>I was letting the third party RIP handle the seps and color, and making my RGB color correction in Photoshop in the native 1.8 Gamma.</p>
      <p>I was having good consistent color using a Mitsu Diamond Pro 2070.</p>
      <p>Now I’m CS3 and I’m having to work through it all again. Hope that helps a little.</p>
