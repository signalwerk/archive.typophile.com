      <p><a href="/wiki/www.adobe.com%25252Fproducts%25252Fcreativesuite%25252F%252Bpdfs%25252Fcs2_color_workflows.pdf" class="wiki-create">This PDF</a> explains how to set-up a workflow in CS 2. It might be usable in general for you CS 1 also.</p>
      <p>In general the monitors can be calibrated using a colorimeter for the screen. These are not too expensive, and easy to use. The big problem is the environment your are working in. It should be in total darkness, or illuminated exclusively by <a class="freelinking-external" href="http://www.justnormlicht.com/">Normlicht</a> that matches the chosen colour temperature of the monitor calibration.</p>
      <p>Scanners can also be calibrated using a special scan-target and special scanner software that reads the target values, knows what they should be, and generates a ICC-profile for that scanner.</p>
      <p>The most complicated situation is the printing situation. Some printers have a build in colorimeter that can scan a print of test swatches and create an ICC-profile for the combination of print-heads, ink-cartridges, paper/substrate, temperature, and humidity. I have one of those, and you can match your output very very close to eg. EuroScale CMYK and also a lot of PMS colours outside the CMYK gamut, <em>but</em> it only works when viewed in normlicht, in other lighting conditions the characteristics of the ink and substrate doesn’t longer compare to, say, EuroScale if that was the case.</p>
      <p>Some RIP-software to control this nightmare is of course required. Same goes for the very expensive Xerox laserprinters who often use an external Fiery RIP to do the colour control.</p>
      <p>In CS (any) you have the luxury of being able to do a mixed RGB and CMYK workflow. What I do is keep all colour scans and photos in RGB mode. All logos and elements that need EuroScale CMYK matching are in EuroScale CMYK. When the elements are combined in an InD</p>
