      <p>Screen appearance could be the result of any number of things, for print colours you should be able to trust what you put in, if a PMS or cmyk is not printing properly that is probably because it is incorrectly specified or an element is not correctly profiled. Can you be more specific about your press problem? Which software are you using to create your artwork, InDesign, Illustrator, Photoshop? Is it in the creation of pdfs?</p>
      <p>Tim</p>
