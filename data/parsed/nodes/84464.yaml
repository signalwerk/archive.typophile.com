    <p>Everything was going fine with my font until today when I generated my font and I got this error message:</p>
    <p>[FATAL]  GPOS feature 'kern' causes overflow of offset to a subtable (0x11420)<br>
    ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors<br>
    [FATAL]  GPOS feature 'kern' causes overflow of offset to a subtable (0x11420)<br>
    ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors</p>
    <p>I have over 6,000 kerning pairs in the font so far. I'm wondering if I reached the limit and that's why it's doing this?</p>
    <p>Thanks in advance to anyone that can help.</p>
  html_clean: |-
    <p>Everything was going fine with my font until today when I generated my font and I got this error message:</p>
    <p>[FATAL]  GPOS feature 'kern' causes overflow of offset to a subtable (0x11420)<br>
    ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors<br>
    [FATAL]  GPOS feature 'kern' causes overflow of offset to a subtable (0x11420)<br>
    ERROR: There was a problem while compiling OpenType font. Final .otf font is not saved. Please, check OpenType features definition for errors</p>
    <p>I have over 6,000 kerning pairs in the font so far. I'm wondering if I reached the limit and that's why it's doing this?</p>
    <p>Thanks in advance to anyone that can help.</p>
comments:
  - id: 473622
    user: 84836
    date: 2011-08-10T14:19:00
    date_raw: 10 Aug 2011 — 2:19pm
    votes: null
    html: |-
      <p>Nevermind, I figured out how to fix it.</p>
      <p>I compressed the kerning and apparently it converted about 1500 pairs into classed-based kerning, so the number of pairs I had went from over 6000 to 4800. This got rid of the FATAL error. I also noticed through experimentation that the error didn't appear until I had over 6000 pairs, because I started working on a previous one with about 5900 that was fine. When it went to about 6,005 I tried generating the font, and boom, there was the error.</p>
      <p>6000 is the limit aparently.</p>
