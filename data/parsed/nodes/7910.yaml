  html: <p>I'm making a logo for a company thats into designing pipes, wires etc. for shipping and offshore industry. I have got the typo down, but I'm having difficulties getting the colors right. They dont want to communicate typical blue navy colors, but they want to stand out as a serious, modern and creative company. The problem is that this is a conservative business group, and their customers likewise. I have tried to explain this to them, but they wont listen, so I'm stuck trying to get a decent result out of it.  <br>Anyone got any got suggestions for colorschemes?</p>
