    html: <p>Tom have you looked into Metalics as an accent color? An orange gold or red gold would say wires, pipes to me. Also for the main color a warm or cool gray might work. If you want a stronger main color try one of the blacks with a hint of color like PMS Black 6, conservative but rich.</p>
