    html: |-
      <p><cite>I like the outlined better. I just wonder if there’s any logic to the breaking of the letters?</cite></p>
      <p>First I wanted to make some sort of autogram. I decided to take the whole name instead, and hook the letters onto each other. But then some characteristics would disappear: let say, the 't' for example, didn't function as a 't', could be an 'l' as well.</p>
      <p>By deleting some pieces, that problem was resolved.</p>
      <p>Anyway, I wanted to keep the autogram idea, it must be a fluent integration of letters,  open and friendly.</p>
      <p><cite>And how are you going to print it?</cite></p>
      <p>Well, yeah, I still have to find out. ;-)</p>
    html_clean: |-
