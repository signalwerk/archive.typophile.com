    <p>Bryant <a href="/wiki/Compressed" class="freelinking" rel="nofollow">Compressed</a><br>
    Designed by <a href="/wiki/Eric%20Olson" class="freelinking" rel="nofollow">Eric Olson</a> 2002–2005</p>
    <p>Designed for situations where large point sizes and maximum letter count need to coexist, Bryant <a href="/wiki/Compressed" class="freelinking" rel="nofollow">Compressed</a> is the narrowest of the Bryant families. Sharp stem joins and increased contrast — stylistic departures from the other weights and widths — allow this face to keep the Bryant style while maintaining a narrow width.</p>
