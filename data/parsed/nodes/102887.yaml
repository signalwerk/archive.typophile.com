      <p>I too am interested in Chinese font options for use on a website. </p>
      <p>I'm currently leaning towards the Simplified Chinese fonts STHeiti (bundled with Adobe CS6) as a body copy and FZYaSong for headings (this was recommended by a Chinese work colleague). It certainly is a challenge to get a design I am happy with without being able to to read to text I'm laying out!</p>
