    <p>This may seem like an easy one but it has me pipped.<br>
    I'm trying to identify the font here - I thought it might be FUTURA LT BOLD OBLIQUE but it has a straight M's and a different lowercase 'a'. Then tried MUNDO but same deal, not the right lowercase 'a'. </p>
    <p><a href="http://www.hollerforamarshall.com.au/StyleSheets/img/marshall-batteries-logo.jpg" title="http://www.hollerforamarshall.com.au/StyleSheets/img/marshall-batteries-logo.jpg">http://www.hollerforamarshall.com.au/StyleSheets/img/marshall-batteries-...</a></p>
    <p>Any suggestions?</p>
    <p>Thanks<br>
    Glenn</p>
