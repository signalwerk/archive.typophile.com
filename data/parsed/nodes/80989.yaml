      <p>As I read the rule, "Century family" means "a font with Century in the name," since that's the pattern of the fonts in the "e.g." list.  But I wouldn't consider the e.g. list exhaustive —&nbsp;certainly if the Supreme Court only wanted to accept those three Century variants, it would say so.</p>
      <p>That said, only a numbnut lawyer would pick a Century that's outside the realm of the traditional Century look. However, there are still dozens of competing cuts of traditional Century designs. I haven't spent enough time with them to form an opinion about their relative merits.</p>
      <p>I haven't been contracted to figure this out. But I was talking to an attorney yesterday who was part of a team that was filing a petition in the Supreme Court. They had set everything in Times New Roman and at the last minute someone noticed the Century requirement. A scramble to find a Century font ensued. (Lesson: read the rules first.)</p>
      <p>This isn't a mainstream issue in legal typography because relative to the profession as a whole, very few lawyers will ever file a document in the Supreme Court. But it's not trivial, either — about 8000 petitions are filed each year with the Supreme Court, all of which have to conform to the court's typographic requirements, which are the most detailed in the nation.</p>
      <p>Traditionalists will be glad to hear that the Supreme Court still endorses "hot metal" typesetting.</p>
      <p><a href="http://www.law.cornell.edu/rules/supct/33.html" title="http://www.law.cornell.edu/rules/supct/33.html">http://www.law.cornell.edu/rules/supct/33.html</a></p>
