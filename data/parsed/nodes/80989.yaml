    <p>The US Supreme Court requires briefs to be set in "Century family (e.g., Century Expanded, New Cen­tury Schoolbook, or Century Schoolbook)". (Times New Roman is not acceptable.)</p>
    <p>What are the preferred Century fonts out there? I like Font Bureau's Benton Modern, which is derived from Century Expanded, but it's not called "Century" and thus wouldn't meet Supreme Court requirements.</p>
