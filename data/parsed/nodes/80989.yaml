      <p>There's a bit more to the story.</p>
      <p>Before 2007, the Supreme Court required that documents be set in "Roman 11-point or larger type with 2-point or more leading between lines. The typeface should be similar to that used in current volumes of the United States Reports." (<a class="freelinking external" href="http://brescias.com/us_supremec_rules.pdf" rel="nofollow">PDF here.</a>) </p>
      <p>In 2007, the court proposed various amendments to the larger set of rules governing practice before the court, including one that would change the font requirement to “New Century Schoolbook 12-point type." Various lawyers <a class="freelinking external" href="http://www.scotusblog.com/2007/05/practitioners-reactions-to-proposed-revisions-to-supreme-court-rules" rel="nofollow">conferred and agreed</a> that because New Century Schoolbook did not come installed on either Windows or Macintosh computers, the requirement might unnecessarily add confusion and expense to the process of filing briefs. </p>
      <p>Presumably for this reason, in the final amended rules, which went into effect on <a class="freelinking external" href="http://www.scotusblog.com/2007/07/more-on-the-revised-rules" rel="nofollow">October 1, 2007,</a> fonts from the larger category of the "Century family" were permitted.</p>
