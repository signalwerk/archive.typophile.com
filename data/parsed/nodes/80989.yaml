    html: <p>I should have added that Century was chosen simply because GPO already had a large investment in mats and machines in that face so it was a case of what they had instead of what might be best.  GPO had a book of their own types and that was what was used as an "example".  Today, this is all meaningless with digital type and offset printing.  The Congressional Register and Congressional Record were printed in-house by GPO daily set in hot metal and printed letterpress--and yes, it was the 1970s. Today, everything is contracted out and nobody prints letterpress except the lovers of chic and the antiquated handiwork of our forefathers. I am sure Massimo would have preferred Helvetica or Bodoni but he was smart enough to know a battle that could not be won.</p>
