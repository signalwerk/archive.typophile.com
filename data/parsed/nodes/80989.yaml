      <p><cite>Who's empowered? The judges. They make the rules. Qualified? Well, in the realm of typography and technology...umm...no one.</cite></p>
      <p>Having looked at typographic rules from courts around the country, I can assure you that as a blanket proposition, this is wrong. It ranks with other popular misconceptions like "judges prefer documents written in stodgy legalese."</p>
      <p>Yes, there are courts that seem to be happy with the typewriter-based rules of 50 years ago. There are plenty of others that take it quite seriously. For example, Chief Judge Frank Easterbrook of the 7th Circuit Court of Appeals is a very well-respected jurist and also a fan of good typography:</p>
      <p><a href="http://typo.la/7th" title="http://typo.la/7th">http://typo.la/7th</a></p>
      <p>As I posted in another thread recently, the Utah Supreme Court recently redesigned its opinions with better typography:</p>
      <p><a href="http://typo.la/ub" title="http://typo.la/ub">http://typo.la/ub</a><br>
      <a href="http://typo.la/ua" title="http://typo.la/ua">http://typo.la/ua</a></p>
      <p>I've found that people outside the legal profession are more likely to be skeptical about the possibilities of legal typography than those inside it.</p>
