  html: |-
    <p>Need some help Identifying  this font:</p>
    <p><a href="http://pages.uoregon.edu/ppederso/woodsanssmaller.jpg" title="http://pages.uoregon.edu/ppederso/woodsanssmaller.jpg">http://pages.uoregon.edu/ppederso/woodsanssmaller.jpg</a></p>
    <p>It's from the letterpress lab at the university of oregon. It is 15 pica sans serif.  It is not labeled, and it bares no foundry stamp or company insignia.  It is most likely older than 1965, and could be as old as 1900.  </p>
    <p>It only exists in caps, although there are a few varying figures. (two types of A's, etc.) I tried to pick the figures with a similar grain pattern, the thought being that they would be of the safe shipment of type. </p>
    <p>It is possible that this font has not been digitized, but any help you guys can offer would be amazing!</p>
