      <p>You could always specify a monospaced font. That way, character width is fixed and character count becomes very easy to calculate. That’s one of the primary advantages of a monospaced font.</p>
      <p>You’ll still have variance based on the length of any word in proximity to the end, especially if you don’t implement any hyphenation. But it will be considerably less.</p>
