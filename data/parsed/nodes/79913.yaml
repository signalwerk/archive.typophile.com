    <p>Hi, </p>
    <p>I'm hoping for some help from the experts (that's you).</p>
    <p>I'm trying to create copy guidelines (specifically max character counts) for fixed width text boxes in a Flash application.</p>
    <p>Things I know:</p>
    <p>• I am using one font, size, weight in a single text box<br>
    • Each text box is different, but a fixed pixel width<br>
    • Each text box is populated with dynamic text</p>
    <p>I've been recommended TypeBook Creator to get a character count per pica (1.25), then I've read that 1 pica = 12 pixels. From that I used a couple of examples of text box widths (120px and 240px) to work out a character count (12.5 and 25). But when I mock this up in Photoshop, the total characters can be a 15% variance from that calculation.</p>
    <p>Can anyone shed some light on this? Is there a known method to calculate the character count (max/average/range) for each text box?</p>
    <p>Hoping someone can help.</p>
    <p>Thanks,<br>
    Matt.</p>
