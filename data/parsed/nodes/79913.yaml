      <p>Not sure I’m following what you’re trying to accomplish, but character count is always going to be an estimate of some average (whatever that happens to mean).</p>
      <p>If you get a line of content with a lot of capitals or ‘m’s and ‘w’s, then your character count is going to go way down. If you have a line with lots of ‘i’s ‘l’s ‘t’s and a bunch of punctuation, then your count can go way up. A 15% variance sounds pretty likely to me, if not more.</p>
