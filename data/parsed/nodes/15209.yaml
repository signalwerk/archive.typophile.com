    html: |-
      <p>I think this is an old Casady &amp; Greene font from their “Fluent Fonts” collection, one of the earliest sets of third party PostScript fonts. I don’t know the name of it, though.</p>
      <p>Since they closed their doors a couple of years ago (after selling their SoundJam MP3 player to Apple as a basis for iTunes), I don’t know what’s become of their fonts. Their former web address (<a href="http://www.casadyg.com/" title="http://www.casadyg.com/">http://www.casadyg.com/</a>) is now one of those horrible generic web portals and has nothing to do with the original organization (not unlike <a href="http://www.typographi.ca" title="http://www.typographi.ca">http://www.typographi.ca</a>).</p>
      <p>Edit: Actually, the collection was called “Fluent Laser Fonts” and the font in question was called Calligraphy. More about them <a href="http://moorstation.org/typoasis/designers/casady_greene/index.htm">here</a>, including the actual fonts which are apparently in the public domain now.</p>
