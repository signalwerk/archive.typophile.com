    html: <p>Incidentally, C&amp;G’s Calligraphy is, in fact, a poorly drawn copy of El Greco, a face designed for H. Berthold in 1964 by Gunter Gerhard Lange. If you want the real thing (which is about a hundred times higher quality) you can get it from <a href="http://www.philsfonts.com/detail.html?sku=AB80395003P1">Phil’s Fonts</a>.</p>
