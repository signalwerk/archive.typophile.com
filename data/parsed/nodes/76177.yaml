    html: <p>In that case, clearly the designer of Hadassa Elegant <em>did</em> succeed in preserving that aspect of the atmosphere of Hadassa. Although I wouldn't have guessed that of the versions of the original Hadassa that I've seen, so I cannot be all that perceptive; the heavier weight, and the outward sloping of the sides, presumably among other and subtler characteristics, had led me to that conclusion in respect of this new face.</p>
