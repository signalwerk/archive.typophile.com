      <p>One criterion I ask myself on whether a logo has presence is "will it fax?" That is to say, when reduced to the size it will be used on a stationery letterhead, will it remain recognizable when scanned crookedly and then printed at 100 to 200 dpi monochrome? I don't think this design would survive that test. </p>
      <p>But that point aside, the letter b is reversed, as it should be as the logo represents a type slug, but it reads as d. The flipped form of t and g do not become other letters in the Latin alphabet, so those aren't problems. But the type is a light face, the shadows are shallow, and the block makes use of implied edges which might require too much thought for some to interpret.</p>
