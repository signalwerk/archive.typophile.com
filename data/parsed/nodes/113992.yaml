    html: |-
      <p>In a way the talk about faxes and other such printing methods or applications is not completely valid when it comes to a logo. In many cases an alternate version of the logo is designed to use in smaller applications or certain printing techniques. So that's an aspect which could always be fixed. However, you have some other issues with this logo which the others already alluded to and I have nothing more to add in that regard. I will say however that it's smart to think about what this alternate variant of the logo would look like. In this case you would probably remove the shadows from the type and make the type solid black, but this goes at the expense of the concept of the logo. So in this case an alternate version for specific applications is no solution. You first need to find solutions to the other issues mentioned here.</p>
      <p>Rather clever concept though. I wish this would be better possible in execution, but I'm afraid this concept will always go at the expense of legibility and application. I have to admit it's possibly narrow-minded to think this way, so I'm really eager to see solutions to the issues you're having.</p>
