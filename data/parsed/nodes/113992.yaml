    html: <p>I agree with cuttlefish's thoughts about legibility (although faxing has mostly been replaced by email, PDFs, etc. by most businesses; I would worry more about things like small web ads and other situations where it is reproduced very small). Also your logo lacks presence as you mentioned. You need to find ways to make it heavier and stronger.</p>
