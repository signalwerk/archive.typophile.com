      <p>Years ago when faxing was used more frequently, a designer friend of mine made a letterhead  for a business with the logo blind embossed (no ink). And when they faxed it, the logo totally disappeared. The client was furious and they ended up redesigning it.</p>
      <p>But some businesses still use fax. I have a relative who's a doctor and they use it all the time. And one of my corporate clients still faxes me purchase orders.</p>
