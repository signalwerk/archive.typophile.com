    html: '<p>A vocation it is indeed, Christos. <img src="http://www.typophile.com/forums/clipart/wink.gif" border="0"><br><br>*Christos I’m certainly not making fun of <span class="caps">YOU</span>, but  <br>this must be one of the best typos ever. <br><br><b>Vocation</b> (Vo*ca”tion), n. [L. <i>vocatio</i> a bidding, invitation,  <br>fr. vocare to call, fr. vox, vocis, voice: cf. F. vocation. <br>See <i>Vocal</i>.] <br><br><b>1.</b> A call; a summons; a citation; especially, a designation <br>or appointment to a particular state, business, or profession. <br><br><i>What can be urged for them who not having the <br>vocation of poverty to scribble, out of mere <br>wantonness make themselves ridiculous?</i> <br>—Dryden. <br><br><b>2.</b> Destined or appropriate employment; calling; occupation; <br>trade; business; profession. <br><br><i>He would think his service greatly rewarded, if he <br>might obtain by that means to live in the sight of <br>his prince, and yet practice his own chosen vocation.</i> <br>—Sir. P. Sidney. <br><br><b>3.</b> (Theol.) A calling by the will of God. Speciﬁcally: <br>(a) The bestowment of God’s distinguishing grace upon  <br>a person or nation, by which that person or nation is <br>put in the way of salvation; as, the vocation of the <br>Jews under the old dispensation, and of the Gentiles <br>under the gospel. <i>The golden chain of vocation, <br>election, and justiﬁcation.”</i> <br>—Jer. Taylor. <br>(b) A call to special religious work, as to the ministry. <br><br><i>Every member of the same [the Church], in his vocation  <br>and ministry.</i> <br>—Bk. of Com.&nbsp;Prayer.</p>'
