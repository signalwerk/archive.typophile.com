      <p>Hi Ruth</p>
      <p>Where I come from, Carson is a dirty word. Here's why. The seventh form school program in NZ asks students to research a famous designer as an 'artist model' – and design their work according to the aesthetic of that designer. Many of them pick David Carson. The school leavers then apply for places on the graphics undergraduate programs that I teach on. Every year I am confronted with hundreds of pieces of 'rip-off' Carson-esque work produced by impressionable young people who think it's great without ever questioning why it exists in the first place...</p>
      <p>To answer your questions</p>
      <p><em>Question 1.<br>
      Have you been influenced by Carson? Are there any elements of his work that you have been inspired by?</em></p>
      <p>In terms of style and understanding, Carson's influence on me has been as polarising and negative as his own Swiss School experience was on him. Like James above, I completed my formal training before the advent of 'The End of Print'. The caption that the book contains under two identical pictures run side by side <em>"...this picture was so great we had to run it twice"</em> is inspiring in it's idiocy; I use it to illustrate to my students what not finishing your studies in visual literacy will do to you. </p>
      <p>By the same token, Jessica Helfand's foreword is the only thing worth taking seriously about 'The End of Print'.</p>
      <p><em>Question 2.<br>
      What did you think of Raygun at the time? (if applicable)</em></p>
      <p>Unreadable and ugly-looking hyperbole. Which makes me sound just like Massimo Vignelli talking about Emigre. The difference was, Emigre had a point – so it's possible to see their editorial design as a function of their agenda. With Carson's agenda of 'how can I make this a frustrating (or, with the Bryan Ferry spread, an <em>irrelevant</em>) experience for the viewer?' that output is not so much design as fine art posturing pretending to be something else. </p>
      <p>There is a back story, detailed by Rudy VanderLans in Emigre No. 69 'The End', about the critical difference between Carson's earlier Beach Culture and Emigre, which might be worth reading.</p>
      <p>It's worth noting that the review pages and the adverts in the back section of RG (i.e. those parts that the publication derived <em>revenue</em> from) were as conventionally-designed as any other magazine of the time.</p>
      <p><em>Question 3.<br>
      What do you think of the many amateur designers that try to copy his work?</em></p>
      <p>See above. In that Carson never matriculated, what's the actual distinction between him and the amateurs? If you look at the big-ticket work post RG, such as the Pepsi campaign, you'll see how amateurish he could be.</p>
      <p><em>Question 4.<br>
      How do you think publishing in general has changed/been influenced since Raygun?</em></p>
      <p>If this is really a question about 'publishing in general' don't talk to the (hired) hand – ask the publishers. If you mean it as a question about changes in magazine editorial design since Raygun, then arguably the design (like the English language in general), has gotten a lot more self-conscious, but actually less precise in its ability to communicate, and it's correspondingly perceived as being more disposable by its consumers.</p>
      <p>Good luck with your dissertation.</p>
