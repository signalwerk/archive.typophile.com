      <p>Magazines like Raygun have a very different audience than the more well known ones. The surferzine types probably didn't really buy the mag for reading text. It was a cool in-thing to have on your surfboard tabletop. David Carson was actually a collage artist (and good at it) not a publication designer. He made tone-poems with type and photo fragments.  The level of communication was all about visual tactile senses, not about conveying any specific information. His work was outrageous enough to get noticed for both good and bad reasons.  He was good at making typographic paintings but nowhere near as good at it as April Greiman and she also could communicate intended messages clearly.<br>
      Has he been an influence on me in my design work? No, not really--to me he is an artist, not a graphic designer.</p>
      <p>Raygun is a collection of Carson's printmaking art and served to make the Basel school Weingart emulators look mainstream instead of avante garde.</p>
      <p>Wanabbes have always been and always will be. Eventually the talented kids grow up and become themselves. The untalented kids just find someone else to emulate fearing their own ability. </p>
      <p>Publishing has not changed because of Carson. It has changed because of the technology.</p>
      <p>ChrisL</p>
      <p>PS: I am an old fart so I was too old to be impressed by Raygun.  When I was young, I was impressed by Gerbauchgrafik (sp?).</p>
