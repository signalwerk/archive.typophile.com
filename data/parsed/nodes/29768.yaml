      <p><em>Question 1. Have you been influenced by Carson? Are there any elements of his work that you have been inspired by?</em></p>
      <p>When I was a student I was influenced by him. However, just like oil and water, his aesthetic and mine never mixed. </p>
      <p><em>Question 2. What did you think of Raygun at the time? (if applicable)</em></p>
      <p>I thought it fit the mood of the music and scene it was covering. Rolling Stone at the time was really struggling, IMHO, with design and content. I think Raygun filled a needed niche. I bought Raygun for quite a while. I actually wish I still had the first year or at least the first issue. </p>
      <p><em>Question 3. What do you think of the many amateur designers that try to copy his work?</em></p>
      <p>It is just like anyone else trying to emulate someone they admire. Sometimes it is successful and sometimes it is just appropriated.</p>
      <p><em>Question 4. How do you think publishing in general has changed/been influenced since Raygun?</em></p>
      <p>Design for the music world absorbed the style and occasionally resuscitates it when needed. I wouldn't say it had a long-felt influence though.</p>
