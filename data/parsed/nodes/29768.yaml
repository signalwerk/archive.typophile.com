      <p>Q1: I think Carson's influence on design has been huge and I credit him for that. He busted it wide open. However, I am NOT a fan either of his work or of the direction he has moved design in. Call me an old fogy but I like to actually read type and don't consider it just another design element. I design in a way that is pretty diametrically opposite to his aesthetic. I'm much more of a minimalist - I believe good design says more with less.</p>
      <p>Q2: As for Raygun specifically I really didn't do much more than glance through it. I truly hated his book Cyclops, both for the photography (the awful Albert Watson) and the egregious type design. </p>
      <p>Q3&amp;4: I have much railed and lamented at the way all of a sudden book designers thought it was cool to have the type all squashed together and bleeding off the page and impossible to decipher. Or the above-mentioned TOC in the middle of the book. I think it's calming down now.</p>
      <p>So to me he's the design equivalent of rap music - generally kinda hate it, do my best to ignore it, but occasionally there's something that makes me go WOW and I have to grudgingly acknowledge his spot in the pantheon. He is certainly a valid subject for a dissertation.</p>
