      <p>Question 1.<br>
      Have you been influenced by Carson?<br>
      No, I'm not influenced by other designers.</p>
      <p>Are there any elements of his work that you have been inspired by?<br>
      It's nice to know that there are designers pushing the limits, doing their own thing.<br>
      What impressed me most about Raygun and Emigre was that they used experimental indie-foundry fonts. That was an influence I suppose, to make experimental fonts, although my experiments weren't the kind that DC would be likely to use.</p>
      <p>Question 2.<br>
      What did you think of Raygun at the time? (if applicable)<br>
      Brilliant!</p>
      <p>Question 3.<br>
      What do you think of the many amateur designers that try to copy his work?<br>
      I think you'd have to look at a piece individually, and give it a thorough analysis, to know just what the designer is trying to do -- unless they're doing a complete rip-off of something in particular. But working in the manner or style associated with DC, the work must be judged on its own merits. Also, bear in mind that there were many other folk in the early 90s doing similar stuff. </p>
      <p>Question 4.<br>
      How do you think publishing in general has changed/been influenced since Raygun?<br>
      There are a lot of "post-literate" publications now, and experiments with what kind of form a periodical can take. But again, you can't pin it all on DC.</p>
