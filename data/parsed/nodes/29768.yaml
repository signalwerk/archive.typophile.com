      <p>---…‘The End of Print’. The caption that the book contains under two identical pictures run side by side “…this picture was so great we had to run it twice” is inspiring in it’s idiocy; I use it to illustrate to my students what not finishing your studies in visual literacy will do to you.---</p>
      <p>I can see that, but aren't many design-books-for-designers full of that kind of thing? It's really no different from other offerings in principle, such as Attik's 'Noise' series, or Tomato's 'Bareback'. It's experimentation, playing about and self-indulgent - but it's certainly not limited to a single designer.</p>
      <p>No one has mentioned that David Carson's work was (and to an extent) still is, exciting. I think graphic design would have been poorer if he hadn't appeared on the design scene and done what he did. It got me (and I'm sure countless others) into design and injected some excitement and enthusiasm into design at the same time.</p>
      <p>I actually think that he opened the door to a lot of people in what can be a very pretentious industry, by the very fact that he didn't get into design through the perceived 'proper' route.</p>
      <p>Although it might sound otherwise, I'm not particularly into his way of doing things (especially the questionable legibility issue, I could never swallow the 'if you have to dechipher it, it'll sink in better' line); ultimately the fact that this question was raised shows that he's left an indelible mark on graphic design (especially mid 90s design). Things have moved on, the backlash happened (and continues), but above all I remember being blown away by the designs at the time.</p>
