      <p>Raygun followed any formal education I had. Carson's freedom in breaking rules reflected trends that had been part of fine art for a whle. I had seen these trends and remember being happy in a way to see print explode the way it did.</p>
      <p>Being a bit older now, I see the key being that we focus on the craft and the information. If the writer takes a deconstructed approach the design might follow. But, if the writer is formally trying to communicate I feel the design should respect and enhance the effort.</p>
