      <p>Q1&gt; I have - Carson's work 'got me into' graphic design... I got addicted to the End of Print, it was THE book when I started college. I was definately inspired by his work, but in a different way to a lot of people, I think - I liked the little quirky touches he applied to things. The one example that immediately comes to mind is the design he did for Speak magazine. Interesting concepts such as having the contents page on the centre spread and having plus and minus page numbering, pages preceding the centre were negative numbers; also, having an article which stopped abruptly in the magzine - the rest of it appeared online. It's easy to dismiss things like that as gimmicky, but it kept really well with the tone of the magazine and I still like the lateral thought behind them!</p>
      <p>Q2&gt; I got into RG just after Carson left : ( but in the UK we had BlahBlahBlah magazine which kind of took off where he left off.</p>
      <p>Q3&gt; It's inevitable that his deconstructivist approach would be emulated because I remember it stood out so much at the time - people pick up on that.</p>
      <p>Q4&gt; I mentioned BlahBlahBlah above, I remember that had a direct link with RG. I think there was a real backlash against the deconstructive style around '98 onwards.</p>
      <p>Sorry it's difficult to write too much at the moment because I haven't got much time, but I hope this helps you a little bit.</p>
      <p>It's worth checking out TypeRadio, there's a recent interview with DC.</p>
