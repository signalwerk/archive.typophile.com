    html: <p>Yes, and for that I give him credit. But the original post asked for comments both on his influence on design and publishing in general and also on our personal opinions and reactions to this influence. In the right context Carson has done some amazing groundbreaking work (whether or not I like it) however his approach has unfortunately been applied somewhat indiscriminately to poor effect. There were some really hideous Type Directors Club Annuals back in the day. But that's the problem with trends in general, they can't avoid getting diluted and kitschy after awhile. When your client starts asking for a "David Carson" kind of look you know it's probably time to try something new.</p>
