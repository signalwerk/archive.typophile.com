    <p>Hi,<br>
    I am currently researching for my dissertation which is about how David Carson has influenced publishing since the 1990’s with Raygun.<br>
    I just wondered if anyone would be kind enough to answer a few questions for me...</p>
    <p>Question 1.<br>
    Have you been influenced by Carson? Are there any elements of his work that you have been inspired by?</p>
    <p>Question 2.<br>
    What did you think of Raygun at the time? (if applicable)</p>
    <p>Question 3.<br>
    What do you think of the many amateur designers that try to copy his work? </p>
    <p>Question 4.<br>
    How do you think publishing in general has changed/been influenced since Raygun?</p>
    <p>Thank you</p>
