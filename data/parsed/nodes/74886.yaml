    <p>Hi all,<br>
    I'm working on a new web page for an academic association whose name is 39 letters long (divided into seven words). While they internally tend to shorten the name, using a four-letter acronym, I would like to instead -- for clarity -- use the full name of the association at the top of the web page. Design-wise, I struggle working with such a long name, though. Does anybody have examples of companies/associations/etc with long names, where the logotype has been solved with elegance? All types of examples are of interest, print or digital ...</p>
    <p>In advance: Thanks for any suggestions!</p>
