      <p>Will this logotype be used in only one place -- across the top of a web page -- or might it eventually be used other places where the available space might be more limited (like a small web ad, or a business card, or a postage-stamp-size link graphic)?</p>
      <p>A very long, one-line logotype can be a real problem in situations like that, as you may need to reduce the type to a tiny size.</p>
      <p>So my advice is to stack it on two or more lines, unless you're absolutely sure you'll never need to reduce it to a small size.</p>
      <p>You also might try using the acronym as the logo, and then spell out the full name in smaller type below or beside it. Then if you're faced with situations with very limited space, you could just use the acronym alone.</p>
