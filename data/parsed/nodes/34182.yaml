      <p>I  have to disagree about not reading the book. I've been working exclusively as a book designer (covers, interior design and typesetting) for nearly 10 years, and in most cases I do read the manuscript. The reason? I'm a trained designer, and have a vast understanding of visual literacy. I've had publishers send me treatments, suggestions for the cover etc. that are far too literal, and too weak visually. I read the manuscript, pick out what I call "Lit 101" (colour themes, time periods, look of protagonists, any other repetitive or significant visual clues) and use that as the basis for the cover idea. For non-fiction, I will go with the treatment, but with fiction, I find it necessary to read. The few times where I haven't had anything but the word of the editor/publisher, the book cover design has been weaker than when I contributed my expertise, ideas and thoughts into the interpretation.</p>
      <p>I don't know of many book designers that work exclusively in this field that don't dip into the manuscript, even to just read the first third. While I know of one designer (who doesn't work exclusively with books) rely on what the editor and publisher dictate with good results, I've picked up far too many books where the cover was a misrepresentation of the goods inside. Its a balance: making a catchy, saleable cover design that also can enhance the enjoyment and understanding of the book itself.</p>
