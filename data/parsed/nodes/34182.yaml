      <p>I love this topic, since in the 80s and 90s I did typography for quite a few publishing houses in NY. </p>
      <p><em>Once I bought a book just because it had a fabulous cover</em></p>
      <p>This is an old publishing argument. What really sold you the book. The art department would be beaming because of lore's reply. Yet, the editorial department would respond with, the artwork, type -- the front cover in general, made you pick the book up to look at when you were in the bookstore - BUT, you then flipped it over and read what the book was about and that made your final purchase decision.</p>
      <p>In the mid-1980s Jove Books (then part of the Putnam/Berkley Pubishing Group, and now part of Penguin USA (along with New American Library and Dutton) put out a "generic cover." It was all white with black type, and looked like the generic foods that were being sold for lower prices in the supermarkets. That book did great. So...they put out a whole line of generic books (saving on artwork, type designers, 3/colors in the process, etc.) and it was a failure. </p>
      <p>I think what many of us do look for is originality. When one idea seems to work, it is a flattery that others follow. I remember handletterers preparing fancy types for romance novels -- and all of a sudden, every romance cover had a script.</p>
      <p>I have a dislike for "grunge" type covers. I really want to be able to read and pick up a "mood." For grunge, I just have to look at my disheveled office.</p>
      <p>Chip Kidd of Random House gave new design  ideas with his split covers and choice of type. Mike Stromberg gave us a strong male type with a "mistral" script with it. Tony Greco was the master of the small space. Jimmy Harris taught us that clean lines worked. I could go on and on -- but I cannot pick a "favorite." Maybe because I knew so many of the designers, and so many of the different styles -- that there was an appreciation of the work they did.</p>
      <p>Now if I were a little girl and letting you know which I loved - it was <em>Madeleine</em> - hands down!!! Both interior and exterior. :-)</p>
