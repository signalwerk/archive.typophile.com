    html: "<p>I agree with Nick-- Not that I've done a lot of book covers, but I have designed several. But the dimensions are pretty predetermined (in my experience) by a lot of factors: does the book work in a series? should it have a particular 'shelf presence'? are there market norms? All of these are also factored by common signature sheets.  If something is going to break the mold, it's goiing to cost a good deal to do it... which is not to say it doesn't happen (Chronicle Books, in SF,CA is a good example).</p>"
