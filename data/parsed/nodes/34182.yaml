    html: <p>Lore, I was designing book covers for a while. I had two main clients, a mass-market romance publisher, and a niche publisher, mainly political. The budgets, creative and working relationship couldn't have been more different, but for both I always made many, many comps using low-res stock images or whatever, just to try out different concepts (and type treatments) and see if anything struck a spark with the client. I never read the book as research -- the publisher should give a creative/marketing brief, they're better informed and the designer shouldn't be left to figure out what the book is about, and who it's supposed to appeal to, and where it's going to be sold. For size and proportions, if you're just doing the cover not the guts, I think it's unusual that the cover designer would have any input.</p>
