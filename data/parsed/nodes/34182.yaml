      <p><cite>I find the design of a book cover a huge responsibility and I wonder how you guys deal with this task. Do you receive a brief from the publisher (or from the author) or do you just need to read the book yourself and try to capture its essence?</cite></p>
      <p>I have designed a few covers. I always receive a brief, and they usually have a feeling or mood they'd like to convey. I try to read as much of the book as possible, but sometimes time is very prohibitive! I've only bought one book for the cover: the Penguin edition of Ulysses with the modified Spectrum. Only read a few pages, too hard going for me. One day I'll be intelligent enough to read it.</p>
      <p>Here are a few I've done, for those who are interested.</p>
      <p><img src="/sites/default/files/old-images/awa-01_4216.jpg"></p>
      <p>These are the first two of a planned series. 2 colour covers to save a them a bit of dough, spot colours are easier to control &amp; more vibrant than cmyk mixes. Type: Maple &amp; Mercury, they play really well together.</p>
      <p><img src="/sites/default/files/old-images/JOC-01_5340.jpg"></p>
      <p>this is the full cover, magenta lines indicate the spine. Printed black for budget, put the contents/artists on the cover to avoid arguments. I was also a bit drunk when doing the  contents &amp; thought it was too nice to but on the inside, and has the bonus of saving a few inner pages. Type: Farao &amp; Exotique (unreleased)</p>
      <p><img src="/sites/default/files/old-images/migrant-sex-01_5366.jpg"></p>
      <p>Left is dual language, Arabic &amp; English. Both run the correct way for the language and meet in the middle. Type: Poppl Pontifex, publisher really wanted big body copy, and Pontifex has a large x-height.  Sexuality is a bit of a mishmash, I was told to make it "less gay &amp; less Maori" and this this is how it ended up! </p>
      <p><img src="/sites/default/files/old-images/luminous-01_5287.jpg"></p>
      <p>Alice writes really dark short stories, they are truly excellent! The one on the left is one of the first concepts, the one on the right is how it developed. I really wanted the left one to be gold foiled, but the cost was apparently prohibitive. Type in final: Karbon, in progress.</p>
      <p>Virtually all my initial concepts are rejected, which takes some getting used to.</p>
      <p>—K</p>
