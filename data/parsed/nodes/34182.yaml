      <p>Erewhon was actually a small catalog I did for a show at a gallery. The artists (Jane &amp; Louise Wilson) do installations and take large photographs; that was one of them. Sometimes artists are not cool with their images bleeding, being cropped (altho this was not cropped) or having type over them which is why a lot of art books have kind of static covers. But these gals were cool with type over their image.</p>
      <p>There are so many covers I love - check out Paul Rand, Elaine Lustig, Chip Kidd, also a book called "By Its Cover"</p>
