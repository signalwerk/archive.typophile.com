      <p>I love Cosac Naify too. IMO, it's by far the brazilian editing house with the best looking books. Almost everything they do is elegant. By elegant I mean being able to attract attention and interest trough simplicity and a sort of quietness. It's sofistication: no need for myriads of flashy colors and superimposed elements.</p>
      <p>Elaine is my brazilian book design idol. I hope to meet her someday.</p>
      <p>Here is another Cosac Cover which I love:<br><img src="/sites/default/files/old-images/50_poemas_gde_4764.gif"></p>
      <p>The wonderful thing about this cover is that the paper has thin horizontal lines in relief that complement the horizontal design. Again, tactile. (is there anything duller than touching glossy, coated paper?) Also, the white dots you can see are numbers from one to fifty - the title is "fifty poems selected by the author". The sky and stars reference one of the author's most famous poems, translated "Morning Star".</p>
