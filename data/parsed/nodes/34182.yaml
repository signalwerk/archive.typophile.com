      <p>Lore:<br><em>(it IS pretty cool...)<br></em><br>
      but i don't know if i can say what it is that draws me to a book cover. type? image? format? it's all so subjective at the point of contact/experience. what i can say is that i would rather hold a book in my hand than look at a photo of it, i'd rather turn a page than scroll a screen, and when i'm looking to retrieve a particular book, i can remember its cover (and spine) and pick it out of the (too) many on the shelves visually much more quickly than by reading the title. the design IMPACTS me.</p>
