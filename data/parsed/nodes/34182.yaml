    <p>Hello children</p>
    <p>Once I bought a book just because it had a fabulous cover (by David Foldvari). I find the design of a book cover a huge responsibility and I wonder how you guys deal with this task. Do you receive a brief from the publisher (or from the author) or do you just need to read the book yourself and try to capture its essence? Is it true that as far as book covers are concerned "anything goes" or are there specific rules that need to be observed (proportions etc.)? </p>
    <p>And if you have one, can you tell me about your favourite book cover and why?<br>
    Thanks and hope you enjoy the thread.</p>
  html_clean: |-
