      <p>Okay - I finally remembered which was my all-time favorite book cover. However, I must admit, it was never a book at all. Many times I refer to my dear departed friend James R. Harris. When he was the art director of trade books at Ballantine (when it was all under the Random House umbrella) he directed many photo shoots. At one of them he asked the photographer (it might have been Don Banks) if he wouldn't mind afterward taking a few shots of him. So he dressed up for the occasion. Please remember, this was done before computers. It is a photograph with rub on (transfer) type - and a great sense of humor. So please enjoy - I have it poster size placed in my office (another friend saw it lying around and surprised me by having it framed recently so it wouldn't deteriorate.</p>
      <p>Please enjoy</p>
      <p><img src="/sites/default/files/old-images/JimmyCover_5692.jpg"></p>
