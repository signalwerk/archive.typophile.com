      <p>Thanks Chuck!</p>
      <p>I love this one - On Beauty (bad jpeg!). Also the type is embossed.</p>
      <p><a href="http://www.amazon.com/Beauty-Zadie-Smith/dp/0143037749/ref=sr_1_4/102-3713412-0612115?ie=UTF8&amp;s=books&amp;qid=1180728748&amp;sr=1-4">http://www.amazon.com/Beauty-Zadie-Smith/dp/0143037749/ref=sr_1_4/102-37...</a></p>
      <p>but there are so many.</p>
      <p>I do a lot of book covers but not for fiction or trade nonfiction. Mine are for illustrated books so they have to be of a piece with the design of the book's interior. Often the editor will suggest an image, equally often I can choose myself. I usually present anywhere from 3 to 10 sample designs, depending on the choices.</p>
      <p>It is the hardest part of the book to nail down because it needs to be vetted by the sales/marketing team who are not usually that visually sophisticated. So it can be frustrating.</p>
      <p>For fiction and trade nonfiction the cover is its own entity, separate from the interior.</p>
