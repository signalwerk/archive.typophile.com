      <p>I have been a writer and reader of books, and only recently a type designer. So I am reacting mainly as a consumer. The main books that I retain an affection for their covers in a lifetime of reading are the Penguin covers in England in the 60s that I read then. These were done by Hans Schmoller, influenced by the examples set by Jan Tschichold.</p>
      <p>A lot of covers today of mass market books seem to me to lack a literary feeling, and lack charm. The reading a good book is a quiet but deep pleasure. And the covers of most fiction and non-fiction should give an alluring glance at the reader, not dance the hoochie-coochie. </p>
      <p>Of course books with a lot of visual content should reflect that on the cover, and they can be just wonderful if the visuals in the book are great. </p>
      <p>The thing about a book is that you live with it, spend days or weeks reading it, leave it on the shelf, and keep it in your library to refer to it. So it needs to wear well. The need to draw attention in the book store is in tension with this, and a great cover will resolve that tension by being sufficiently eye-catching, but wear well. </p>
      <p>The Penguin Classic series seem to take up the old Tschichold and Schmoller styles. I don't see them close up in Patty's link, but I have to say that the 'Marcus Aurelius' one posted by Lore to me is an eyesore. It mixes in the taller caps and ligatures without rhyme or reason, like a parody of classic inscriptions, or as if you just barfed up a lot of caps and ligatures--the spacing is lousy and the color uneven. It uses the classic material of caps, but completely lacks that combination of calmness and elation that is the classical taste, and goes well with many books.</p>
