      <p>Don, you don't have the option of throwing the dust jacket when it is a paperback. </p>
      <p>Also dust jackets can be eye catching and still sit happily on the shelf. Here are a couple of examples.</p>
      <p>The Chicago Manual of Style uses great typography with a great typeface--Scala--and bright colors. The brightness not only attracts in the book store, but also gives a lightness to what could be an incredibly stodgy looking book. The inside is set in Scala also. It says the design is by Jill Shimabukuro, who I assume did both the inside and cover. The glory of it is a lot in the sharp beauty of Scala, so the fuzz of the screen doesn't do it justice:</p>
      <p><img src="/sites/default/files/old-images/Chicago-cover_4645.gif"><br>
      .<br>
      Here is another very different cover, for the Book of Legends. Here the frame is taken from an illuminated manuscript (a marriage contract, Ketubbah), and the inside designed to complement it. The cover is by Megan Wilson. I also know that the editor found the beautiful illuminated manuscript in a library.</p>
