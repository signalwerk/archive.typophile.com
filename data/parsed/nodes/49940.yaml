      <p><cite>I definitely think its the designers job to educate their clients on ethical practices…</cite></p>
      <p>I believe there’s an old saying about glass houses and stones. And that clients who have to listen to me lecture them on ethics won’t be working with me next time—and rightly so.</p>
      <p><cite>But at the same time I’m sick of seeing weak ethical guidelines full of shoulds.</cite></p>
      <p>I’m sick of callow pedants who see the world in black and white can can’t stop telling everyone else how to live their lives. This includes preachy designers, James Dobson, and the Taliban.</p>
      <p><em>If people can read about someone else who has sucessfully challenged the conventional practise of design, it becomes a whole lot more feasable.</em></p>
      <p>I believe that we would be much better off if people took an introductory course in ethics and developed critical thinking skills that can be applied to ethical behavior rather than just listening to other designers preach about how we should all behave ourselves.</p>
