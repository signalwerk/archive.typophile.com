      <p>Don’t know if this relates to ethics, but I see part of our responsibility as designers, in providing a level of craftsmanship that is not necessarily related to the demands of a particular client, but are for the betterment of the overall field.<br>
      It used to be, that watchmakers would put intricate, elaborate designs on the inside surface of the case that no one but the occasional watch repairer would be likely to see, for the sole benefit of getting a satisfaction of creating a well-crafted thing. This sort of satisfaction in your work, and respect for the people who’d come in contact with it could be quite useful in the design field.<br>
      The possible ethical implication might be, that we should make sure not to subject the public at large to more poorly-make and tasteless solutions.<br>
      _____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br>
      <a href="http://www.ivangdesign.com" title="www.ivangdesign.com">www.ivangdesign.com</a></p>
