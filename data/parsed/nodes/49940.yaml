      <p>I definitely think its the designers job to educate their clients on ethical practices, to research around the area of a particular project and to be responsible for the practices involved. Ultimately if you refuse to take a job based on your ethical values, surely someone else is just going to pick it up?</p>
      <p>But at the same time I’m sick of seeing weak ethical guidelines full of shoulds. Ultimately at the end of the day, under stress and and hardship, ethics are the first thing to fly out the window.</p>
      <p>This leads me back to the basis of my first post.<br>
      I want to try and promote a set of ethical values (Not Guidlines), in which my peers dont think of ethics as limitations or boundaries, but as something that they positively incorporate into every project.</p>
      <p>Thiis is where my request for your stories comes in,<br>
      I believe narrative is an excellent way of installing values. If people can read about someone else who has sucessfully challenged the conventional practise of design, it becomes a whole lot more feasable.<br>
      Perhaps you stood up in the face of ethical uncertainty, successfully influenced a clients unethical practice, or where in hindsight realised that what your were doing was wrong.</p>
      <p>I think there is power in these stories for influencing my generation (The next generation) of designers.</p>
