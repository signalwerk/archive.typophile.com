      <p>“I definitely think its the designers job to educate their clients on ethical practices”</p>
      <p>In what context? Are we talking professional ethics? If so, then it’d be your job as the designer to adhere to your set of professional ethics and the client, theirs. </p>
      <p>“I’m sick of seeing weak ethical guidelines full of shoulds.”</p>
      <p>Well, the graphic design industry isn’t really that complex. Not sure how strong of ethical guidelines we need. And aren’t all ethical guidelines mostly ’shoulds’? At least in the non-life-threatening professions? ;o)</p>
      <p>In terms of educating clients, being a web developer, I’ve often had to do some basic 101 explanations of IP laws, Spam laws, and such.</p>
