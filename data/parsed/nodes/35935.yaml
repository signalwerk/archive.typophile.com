    <p>Do any Typophiles out there know anything about the font HalAgenda? </p>
    <p>It’s a variation on Agenda and a few letterforms have little differences from Agenda. I’ve had it for years and used it for a client project recently, now the client needs to purchase a licence but I can’t find any information online about it.</p>
    <p>I’ve attached an upper and lower alphabet so you can see what I’m looking for.</p>
    <p>Any help would be greatly appreciated.</p>
