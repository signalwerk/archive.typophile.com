      <p>&gt; different s<br>
      You mean and old-style s (DFR, looks like f without crossbar) instead of the usual s, which is an end-s in old german?<br>
      There is an end-s in Tannenberg, which looks more like in the sample then Brokenscript.</p>
      <p>&gt; and I don’t completely agree with your saying/questioning:<br>
      &gt; Similar to any blackletter?<br>
      That was sarcasm and a reply to that Cabazon-suggestion.</p>
      <p>I still think Tannenberg is closer and it’s the original.<br>
      Brokenscript is a modern interpretation (designed 1990).</p>
