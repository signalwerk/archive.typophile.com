      <p>Kay, are you aware of <a href="http://www.houseind.com/index.php?page=showfont&amp;id=581">Blaktur</a> by House Industries or <a href="http://www.underware.nl/site2/index.php3?id1=fonts_in_use&amp;&amp;findme=fakir">Fakir</a> by Underware?<br>
      Of course they’re not Tannenbergs but rather much more contemporary approaches to (fat, unembellished) blackletter.</p>
      <p>Then, they come with technical advantages you might appreciate when using it for an art exhibition design, like extensive character maps, well-mapped alternatives and ligatures and all the other OpenType bells and whistles. Just an idea.</p>
