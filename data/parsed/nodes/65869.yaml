    date: 2010-01-03T21:30:00
    date_raw: 3 Jan 2010 — 9:30pm
    votes: null
    html: <p>Indeed -- unfortunately not -- Tempo is a compressed face. This is more in the geometric sans family - notice the round Gs. The A and the N have "clipped" tips, so that narrows things down quite a bit. In terms of overall shape and weight, Century Gothic Bold seems quite close, minus the clipped tips.</p>
