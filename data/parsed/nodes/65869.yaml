    <p>This image is of a record that my Dad's band made in the 60s. It's the only image I have -- sorry about the resolution. I'm recreating the album, and would like to know (mainly) what the main body font is for the title of the music. Any other fonts on the record would be helpful as well. The second image is a reference that's clearer, using the same font.</p>
