      <p><em>On average, how much time on the market does it take for a font to bring back six hundred dollars?</em></p>
      <p>There are so many variables (IE a single sloppy font that took a day to make or a complex family that took years) The time spent often shows in the design. Also the end price, if the font is $600, then one sale does it)</p>
      <p>Bottom line is, some fonts sell and some do not. There is only so much market research and weighing investment on return that can go into it. Most people make fonts to fill a perceived void (in the type world in general or personal achievement). Going into it for financial gain is a very risky proposition but not unattainable.</p>
      <p>I am curious how the seemingly arbitrary figure of $600 came up?</p>
