    html: <p>I'm going to state something very obvious here, although I'm not a type designer, but a type user, and enthusiast... the amount of money you make is dependent upon the typefaces you offer. The independent foundries and designers that do well, are doing well because they are producing something that people want. You can make money doing almost anything if you do it well. Look at LucasFonts. How much do you think he has banked off his Thesis family? I remember getting a specimen back in '95 and thinking it was an awesome achievement, and it is. It is still going strong. Look at H&amp;FJ, their typefaces are solid designs that are seen everywhere.</p>
