      <p>Hi Uli. Thanks for this informative post. (Perhaps you can check out an old thread to answer a couple of questions I posed: <a href="http://typophile.com/node/36478?page=1" title="http://typophile.com/node/36478?page=1">http://typophile.com/node/36478?page=1</a> )</p>
      <p>As for James Montalbano's statement: From what I can tell, most of the people making fonts are "garagistes" - passionate amateurs - and the likelihood that they will ever produce anything of great value is small. Just look at the flood of dross which is MyFonts and I think you'll agree that while there is money to be made in typography, that's not the place to do it. Unless you are the director of MyFonts, in which case you probably do very well on the basis of economies of scale.</p>
      <p>Doesn't mean that people shouldn't keep doing it. It's like being in a bar band; you can make pocket money doing it and have a lot of fun, but most bar bands are simply not interesting enough for "the big time".</p>
      <p>JN</p>
