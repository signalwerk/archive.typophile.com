    html: |-
      <p><em>and don’t give it all away to a foundry or reseller.</em></p>
      <p>I agree with the foundry part, although it might not be a bad way for some to start out in the business.</p>
      <p>However, I don't see what's wrong with having distributors. Typically they take 50%, but they provide access to markets a foundry will not find otherwise.<br>
      Also consider the increasing (and long overdue) sophistication of online retailers, driving traffic to their sites. It takes a heck of a lot of effort to generate traffic to one's own site for direct sales, and to provide constantly refreshing content.</p>
      <p>I'd say that in future things will go well for foundries that are able to co-ordinate font development, direct retail sales, and integrate marketing across the board with a variety of distributors -- which is a pretty straightforward business model going way back in time.</p>
      <p>I have a number of distributors. I do find it difficult to produce a campaign they all can use. Everyone has their own standards for things like the size of banner ads, and most do not even use co-op (supplier-generated) marketing material, which seems to me a missed oportunity, because everyone benefits from synergy.</p>
