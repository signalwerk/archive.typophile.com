    <p>Hi all,</p>
    <p>Just wondering if anyone can recommend me any top end design principles, color theory and aesthetics books.</p>
    <p>I know Paul Rand was always on about making sure you study aesthetics.</p>
    <p>Any books relating back to the graphic design field on these topics would be great.</p>
    <p>I've been doing design work for about 10 years but never had any formal education.</p>
