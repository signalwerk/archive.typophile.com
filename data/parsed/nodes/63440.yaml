      <p>For basic understanding of aesthetics, I'd really recommend:<br>
      - "Grid Systems in Graphic Design" by <a class="freelinking external" href="http://en.wikipedia.org/wiki/Josef_M%C3%BCller-Brockmann">Josef Müller-Brockmann</a>.<br>
      - "The New Typography" by <a class="freelinking external" href="http://en.wikipedia.org/wiki/Jan_Tschichold">Jan Tschichold</a>.</p>
      <p>Not merely about aesthetic, but I think this <a class="freelinking external" href="http://www.underconsideration.com/speakup/archives/002514.html">list</a> might interest you too.</p>
