      <p>@Cameron WIlliams, Unfortunately, hanging quotes in html is kinda a pain, especially when on someone else's site (like this).</p>
      <p>I totally agree though. When I attended school (not that long ago even!), the design school I went to was focused primarily on motion graphics and flash development with branding as a close third and communication design &amp; print &amp; typography being left to short and ultimately inadequate amounts of time. I understand that the digital age is one about the dynamic — websites, flash, video etc. That's what attracts "normal" people nowadays and gets them excited. Even I am rather impressed by a well designed and executed piece. But the problem is that the split between print design and web design that occurred when the web came to be is starting to resolve itself and the two streams of thought are starting to remerge. Of course, not everything from print will carry over, but important aspects like grids, typography and visual presentation will. We're just at the growing pains stage right now. </p>
      <p>Ultimately, the problem is that people don't have or are unwilling to spend the time to make good typography. I have been guilty of that myself in an attempt to build a webpage as fast as possible, but I'm making an effort now to make sure everything is done as good as possible (I'm even fixing our copywriter's double space after sentences —&nbsp;I need to talk to him about that). Anyone I work with I will essentially force to do the same until they do it and they'll teach the next person and so forth (my evil plot). Truly, the best thing we can do right now is to show that there are people that care about good layout and typography and make it important. The more effort put into it, the more schools are willing to listen and realize that it is actually something of important. Maybe then, they'll start to change their ways.</p>
