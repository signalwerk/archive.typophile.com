      <p><em>What’s so bad about paying a human to go through a document using Find/Change to fix what the computer missed?</em></p>
      <p>It's better to not make a mistake than try and fix it afterwards.</p>
      <p>Speaking specifically about the "flipped" apostrophe: it's better to encode the apostrophe correctly in the first place (in the manuscript document, or right into the layout application if that's where it's being keyed), as an apostrophe/right single quote, rather than as a generic hash-mark which will be mis-set by "smart" layout applications--and then have to rely on a proof-reading of the finished art, which is not part of most work-flows.</p>
      <p>The flipped apostrophe is a mistake that many businesses that are otherwise fastidious in their production will nonetheless make. For instance, Veer published a flyer a couple of years ago with a headline that said «‘70s» or some such thing, with the backwards apostrophe.</p>
      <p>So that's why I argue for a hardware fix: put curly quotes on the keyboard, so that when text is first encoded, the writer has easier access to the correct characters--and this would also establish the idea that curly quotes are serious default punctuation, not just a fancy option.</p>
