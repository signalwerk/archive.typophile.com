      <p><em>...single open quotation marks (‘) used as substitutes for an apostrophe...</em></p>
      <p>This is a negative side-effect of smart software that fixes a problem which began when the ur-encoding, ISO Latin 1, was configured without curly quotes. Perhaps if it had included them, there would be corresponding keys in the standard computer keyboard layout, which would have encouraged correct typographic practice.</p>
      <p>Nonetheless, there is no reason why the standard keyboard layout should not now be improved upon.</p>
      <p>I would suggest that instead of one key for quote marks/apostrophe, which sets single and double "hash mark" characters, there be two keys for quote marks: a left one which would set opening quote marks, and a right one which would set closing quote marks (the single of which could be used for the apostrophe).</p>
      <p>There is no way that software can ever be smart enough to distinguish between a single opening quote and an apostrophe, so a hardware solution is called for.</p>
      <p>Another solution would be to teach typography along with touch typing/keyboarding, at an early age.<br>
      Writing is taught with an aesthetic dimension, "penmanship", so if people aren't going to be making documents by hand in the future, that aesthetic quality may still be taught, as typography.</p>
