      <p>One option could be to judge whether we actually need all these different marks that look the same in most typefaces and, more importantly when written. I mean, if you're going to use the inch abbreviation instead of typing it out on a printed document of professional sign, it's a little late to be worried about which mark you use. Given that we've already gotten rid of the plural of "you" and the letter theta, this isn't exactly unprecedented.</p>
