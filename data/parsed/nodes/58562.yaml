      <p>@CameronWilliams: I'm sorry to hear about your friend. I hope she was able to find a place where her talents would be valued. Stories like these scare me a bit. Being a young designer and freelancer, I struggle all the time with living up to my own ever-evolving standards while providing my clients with the value that they have come to expect. But what will happen when people start to expect more for less? I can feel it happening all around me, and can't help but think that there will come a time when I have to either compromise quality or lose a client to someone who will do it cheaper.</p>
      <p>@James Puckett: <cite>People need to be taught to value work that’s done well.</cite></p>
      <p>That's it in a nutshell. This extends beyond graphic design and typography to all aspects of life. It is truly sad to see the arts so undervalued in the American public school systems. People don't realize that it's not just about playing an instrument, or painting a picture, or writing a poem; it's about the universal concepts of balance, proportion, communication, problem-solving, attention to detail, and appreciation of craft.</p>
