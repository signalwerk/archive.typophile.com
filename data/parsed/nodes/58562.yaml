      <p>People need to be taught to value work that’s done well. That seems hard to do in a world where vinyl signs in artificially condensed Arial abound on the fronts of stores selling albums by guys who can’t finish a record without autotuning every second of the vocals, but it isn’t impossible.</p>
      <p>I think that to tip the scales in favor of beautiful typography we must ally ourselves with other proponents of beauty and effort and expertise. There’s no shortage of such people in the world. Marian Bantjes seems to have inspired many graphic designers to care about work that’s done slowly, intelligently, and with great care. Karim Raschid is doing something similar in the world of industrial design, notably with his adorable little dustbuster. Alice Waters is pushing chefs (and people who cook at home) to take it slow and use the best ingredients. Alejandro Paul zips from convention to convention spreading a love for carefully crafted fonts and lettering. Jeff Koonz keeps pushing pop art to even more wonderful places than Oldenburg and Van Bruggen did. Sade still takes the time to slowly tease out a perfect album every decade. </p>
      <p>What we need to do better is evangelize in favor of those who do it well. There are plenty of wonderful William Morrises out there who work with masters of their crafts, with with slow, artful dedication, and they need to be held up as examples of people doing it right.</p>
    html_clean: |-
      <p>People need to be taught to value work that’s done well. That seems hard to do in a world where vinyl signs in artificially condensed Arial abound on the fronts of stores selling albums by guys who can’t finish a record without autotuning every second of the vocals, but it isn’t impossible.</p>
      <p>I think that to tip the scales in favor of beautiful typography we must ally ourselves with other proponents of beauty and effort and expertise. There’s no shortage of such people in the world. Marian Bantjes seems to have inspired many graphic designers to care about work that’s done slowly, intelligently, and with great care. Karim Raschid is doing something similar in the world of industrial design, notably with his adorable little dustbuster. Alice Waters is pushing chefs (and people who cook at home) to take it slow and use the best ingredients. Alejandro Paul zips from convention to convention spreading a love for carefully crafted fonts and lettering. Jeff Koonz keeps pushing pop art to even more wonderful places than Oldenburg and Van Bruggen did. Sade still takes the time to slowly tease out a perfect album every decade. </p>
      <p>What we need to do better is evangelize in favor of those who do it well. There are plenty of wonderful William Morrises out there who work with masters of their crafts, with with slow, artful dedication, and they need to be held up as examples of people doing it right.</p>
