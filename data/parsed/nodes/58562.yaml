      <p>@Nick Shin:</p>
      <p><em>“The flipped apostrophe is a mistake that many businesses that are otherwise fastidious in their production will nonetheless make. For instance, Veer published a flyer a couple of years ago with a headline that said «‘70s» or some such thing, with the backwards apostrophe.</em></p>
      <p>“So that’s why I argue for a hardware fix: put curly quotes on the keyboard, so that when text is first encoded, the writer has easier access to the correct characters—and this would also establish the idea that curly quotes are serious default punctuation, not just a fancy option.”</p>
      <p>That’s just it, Nick. I saw the flipped apostrophe/date problem two weeks ago in <em>The New York Times</em>, a paper that once hired Ed Benguiat to design its masthead; the same paper that employed Roger Black as designer of <em>The New York Times Magazine</em>, the paper that publishes Williams Safire’s often witty and always informative <em>On Language</em> column; it’s only a slight exaggeration (if at all) to refer to the paper as “the pinnacle of newspaper publishing”. And they would not print a retraction. </p>
      <p>And in the recent past, I’ve tried to fix these and other typographic mistakes in printed pieces for national advertisers and even for renowned publishing houses and ivy-league universities; only to be told: “stet”; “we cannot afford to risk offending the client”.</p>
      <p>As for the hardware solution, <em>I</em> like it, but how do we convince anyone to use it? These characters are already accessible via combination keystrokes, yet the publishers of Mavis Beacon haven’t incorporated typography into <em>Typing Tutor</em>, nor can I foresee their doing so; their widely-praised method still advocates double-spacing after punctuation, and double returns at paragraph ends. How do we change the perception that typographic first principles are mere “niceties”, rather than necessities? Because if we can’t change that quickly-growing perception, your improved keyboard will never be manufactured; and awareness of mankind’s typographic heritage, a heritage inextricably linked to the rise of literacy (and its concomitant, self-determination) will surely fall by the wayside; that’s why I thought it no exaggeration to state that we may be entering a new dark age.</p>
      <p>Can we mount a major museum exhibition, and will that have any effect? We could try a legislative approach; try to convince our local governments to issue fines for misspelled signs, and further fines for not correcting the errors, but I have little hope for that method. Should we take guerrilla action (I liked the Chevwrong advertisement posted elsewhere on this site, but that was politically rather than typographically motivated)? How can we convince educators that this is a matter of importance? Drastic steps, rather than incremental improvements, would seem to be appropriate at this point. Am I wrong? I’d like to see more comments and ideas.</p>
