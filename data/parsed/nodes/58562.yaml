      <p>1.) Shame incorrect usage, with artful tact if possible. Not letting it ride involves calling attention to yourself, which is a risk that probably should be taken.</p>
      <p>2.) Disengage from organizations that actively promote low standards. So the local museum needs money and is on the rocks, but they can’t seem to use real quotes in their wall texts, hire book designers that don’t know what a ligature is for, or push the design and production of the quarterly newsletter off on a self-trained computer network manager. Tough love with an explanation may be in order.</p>
      <p>3.)Reinforce good examples with praise and use this positive approach to influence when you can. A nice book gifted to a powerful person along with a kind hint about how nice ligatures look and what trouble type designers go to might just stick—enough that the next time they look at pages they notice the thing you have brought to their attention.</p>
      <p>4.) Build consensus. Organizations often have internal disagreements, or differing levels of awareness about these issues. If you are on the inside find your friends, get them together on the issues, and if possible, start documenting. If it is on paper that things should be done a certain way, and a majority of the group becomes involved in policing you are no longer the cop.</p>
