      <p>@CameronWilliams: <cite>"where does it all end?"</cite></p>
      <p>I think it ends with the continued cultivation of a strong, unified professional design community that can work together to maintain the standards of the trade. In my experience, there is a lack of emphasis put on the importance of typography within the greater design community. This needs to be changed starting at the educational level. I have always found that outstanding typography can salvage lack-luster imagery, but no amount of breathtaking imagery can make up for poor use of typography. In the end, if the <strong>words</strong> look unprofessional, the <strong>whole piece</strong> looks unprofessional.</p>
      <p>I think that more and more designers come out of school (especially the technical schools) underestimating the importance of typography, and consequently end up treating it as a supplement to the design, rather than as a crucial element of the design – an art form in itself. In advertising especially, some designers completely miss the boat on how important it is for a brand to have a consistent voice – an implied character whose use of language (tone, formality, etc.) reflects the values of the brand and it's target audience. This is a key part of the puzzle in creating a successful brand culture, and has only, in my opinion, been successfully accomplished by a handful of brands. These brands also just happen to be the ones that stick around for the long haul. </p>
      <p>Since language and all of its denotations/connotations are at the heart of building a successful brand culture, we as designers need to respect the impact our treatment of typography has on the delivery of our language, and ultimately our brand's personality and values. In short, the language needs to set the stage for the imagery, not the other way around. I could go more in-depth about why writers are underpaid, but I digress.</p>
      <p>So, coming full circle, it seems to me that education in design needs to hold itself to higher standards. I see too many technical schools with lousy design programs selling to-good-to-be-true degrees to students who are looking for an alternative to fixing air conditioners (no offense to air conditioner repairmen – I just think that people should strive to do things they are passionate about, whether they are fixing things, designing things, or crunching numbers). These programs are not exactly attracting those who are passionate about art and aesthetics, but those who see design as better than their other options.</p>
      <p>[Edit]<br>
      By the way, my biggest pet peeve at the moment is when people don't hang their quotation marks for a pull quote.</p>
