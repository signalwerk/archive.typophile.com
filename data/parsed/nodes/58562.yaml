      <p>Not much.</p>
      <p>Each audience will find its own level of "good" typography.</p>
      <p>I've often quipped that when doing a fine-print edition, you are finished when you are so exhausted you don't want to work on it anymore -- or you run out of money. There are always things that can be made typographically better.</p>
      <p>And while not typography per se, you can spend an inordinate amount of time preparing halftones. It is rare today to find a book without a fair number of images.</p>
      <p>To do an acceptable job usually takes 20 minutes with Photoshop, and that's assuming your monitor is calibrated, you've profiled your "proofing" printer, and you have accurate TVI data for all 256 levels of gray from the eventual printer, on the sheet that will be used for printing. To get the most out of an image, or to prepare an "art" image, takes far longer. But no one's willing to pay for that kind of work.</p>
      <p>More often than not, you also start with a supplied image rather than being able to make a scan from an original, and that supplied image will be 8-bit, with an untagged color space, &amp; somebody will already have (poorly) done some manipulation.</p>
      <p>* * *</p>
      <p>When I read something I'm interested in -- the best test -- I find that I can ignore a lot of poor typography, design, etc. It is sort of surprising to me, but I seem to reject buying a book, or quit reading one, more because of bad printing than any other single manufacturing issue.</p>
