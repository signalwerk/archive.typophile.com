      <p>Thank you Charles. All good points.</p>
      <p>I often come to the conclusion that high standards have to be held at the institutions. Here I am speaking about the US specifically. From what I see all but the top institutions struggle with these simple standards. Graphic design programs at universities and museums are often behind the curve or simply not up to the standards that other countries set. When a museum or educational program teaching graphic design does not demand the best design and typography where do we look for standards?</p>
      <p>Also, I see a general trend toward disrespect and non-recognition of expertise. The culture seems to have fallen prey to the idea that anyone can do any job, and that if I do not understand the particulars of what differentiates a good job from a poor job no one else does either.</p>
      <p>Much of this has to do with ethical standards associated with business, and business culture inevitably encroaching on standards within institutions. Corporations know that by eliminating skilled positions and filling them with underqualified people within ranks or outside the organization money can be saved.</p>
