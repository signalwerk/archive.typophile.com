    html: |-
      <p>I appreciate the concerns raised in this thread. My sense is that some sorting out of ideas and concerns would be valuable.</p>
      <p>Personally I think it is wonderful that people are taking an interest in letterforms, quite aside from whether they have a passion for their proper usage in the sense addressed above.</p>
      <p>Who will deny that letterforms are interesting in and of themselves?</p>
      <p>I imagine that some of these letterform-only people have produced innovations which have been taken up and further developed by some of those with more rigorously conventional standards.</p>
      <p>Isn't it well to have both sorts of people in the mix?</p>
      <p>I expect that many in the old scriptoria viewed movable type as the harbinger and in fact the bringer of a Dark Age which digital technology only deepens today.</p>
      <p>I wonder, for each of you, to what extent is this a discussion about aesthetics, <em>per se</em> (valid in my view) and to what extent a discussion about a fairly circumscribed subset of aesthetic concerns having to do with "craft" for lack of a better term (just as valid, in my view.)</p>
      <p>Some research into the evolution of aesthetic notions generally might serve well to inform this discussion, for those who care to take the time.</p>
      <p>I wonder whether a look at the history of the rise and fall of the Guilds might be valuable for those disposed to grant the artist a free hand in the use of type but who wish to maintain arbitrary standards for typographers as craftspeople?</p>
      <p>Indeed exploration of the putative distinctions between art and craft, between artist and craftsperson, might be good vectors along which to advance understanding of some of the issues underlying this thread.</p>
