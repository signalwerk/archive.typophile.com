    <p>We’ve all seen the increasing proliferation of single open quotation marks (‘) used as substitutes for an apostrophe, - - used in place of an em-dash, end-quotes used in place of inch-marks, misspellings on shop signs (Quarts watches, Newstand, News Stand, <em>stationary</em> used to mean <em>stationery</em>), and the like. </p>
    <p>While some may argue that there is now more public interest in typography, it seems to me that that interest is mainly in letterforms, and not in their proper use. What are the causes, and what can we do to halt this devolution?</p>
