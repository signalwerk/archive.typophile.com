    html: |-
      <p>@ Adam</p>
      <p>Hey, you have a new avatar. It’s the same twardoch as in the midday.</p>
      <p>When I command "Merge Fonts", the fonts will be completely merged, but I want to append a few glyphs only. And I don’t want to loose control there. If I command "Merge Fonts" I had more things to check.</p>
      <p>My problem with the command "Append Glyphs" is not, that it produces a different result than the other commands, but it copies the "left half" of the kerning and I think, I have too much trusted in it in the past, that it copies both. Do you know, what I mean? You see that the kerning has grown after appending, that the pairs were correctly copied, but you don’t ask the question, whether all pairs were copied.</p>
      <p>@ Chris and Adam</p>
      <p>Yes, the command "Paste Special" is an alternative, if all checkboxes in the white field are activated and additionally the checkbox "Ignore Destination selection, map glyphs by names" (Otherwise you have to rename the glyphs after the command "Paste Special").</p>
      <p>And in this context I found another bug:</p>
      <p>If I copy the glyph from Beta and paste it via "Paste Special" into Alpha, the pasted glyphs are not visible! The character counter has grown, but I first have to switch to the index mode and back, before they are visible. But at least both parts of the kerning will be copied, the right and the left one. So, thank you, Chris.</p>
      <p>Adam, after each step I do in FontLab I check, if everything is correct. My problem is, I don’t know exactly, what everything is. Because it has happened so often, that anything does not work as expected, I don’t trust in the application. It even begins, when I drag and drop a vfb file to FontLab. Do you know, how I do that?: I position the cursor almost at the top of the Window, because I am afraid, that I accidentally select and move characters, when the cursor is on top of the glyph window after dropping the vfb file. I handle the app like porcelain, because I am always afraid to damage anything, that I recognize five steps later. And then it can be hard to undo it.</p>
      <p>I mean, I was a very good Photoshopper five or six years ago. Now I am out of practice. But I remember, that I could work in it in a way, that my subconsciousness said my hands, what is to do, and I did not have to activate my consciousness so often. This breaks inspiration. Well, the two applications are not comparable, but I wish, I had not always this fear to damage anything.</p>
