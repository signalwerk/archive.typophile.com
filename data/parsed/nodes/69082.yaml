      <p>Arno, </p>
      <p>there are three ways to append some glyphs from one font to another:<br>
      1. Tools / Merge Fonts<br>
      2. Fonts panel / Append Glyphs<br>
      3. Font Window / Index mode / Paste</p>
      <p>Unfortunately, the three ways produce different results. "Append Glyphs" is an older feature, so I believe it may produce less satisfying results. "Merge Fonts" is a better way (also has more options that control what should happen).</p>
