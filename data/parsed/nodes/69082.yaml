    html: |-
      <p>Yeah, cool. "Paste Special" is cool. It kills the hinting of the copied glyphs.</p>
      <p>The command "Paste Special" cannot replace the command "Paste". Genius!</p>
      <p>Workaround:<br>
      1. Copy<br>
      2. Append Glyphs<br>
      3. Select appended glyphs and command "Paste Special" for right and left kerning</p>
      <p>And don’t forget to activate the two check boxes for left and right kerning in the white field after each start of FontLab.</p>
      <p>One more time I lost time. Now I have to hint my glyphs again.</p>
      <p>Oh, and if you assume, that the option "Font Window / Kerning information is copied with the glyph" does not work as it should, you are damn right, because it is the same as with the appending command: Only those pairs are copied, in which the copied glyph is the left partner.</p>
      <p>------</p>
      <p>FLS 5.0.4 under Windows XP</p>
