      <p>Arno, </p>
      <p>this is unfortunate, but kerning is stored in FontLab Studio that way: kerning is stored with that glyph which is the 1st glyph in a kerning pair. I agree however that the copying should behave differently and not rely on FontLab's internal object representation -- which should not be the user's concern. </p>
      <p>Adam</p>
