    <p>Hi there.</p>
    <p>I have this opentype font I made and almost everything is working fine except just this one thing.</p>
    <p>Indesign crashes when I try to insert a glyph from the Glyphs palette. Actually there are only problems when I try to insert certain ligatures. These ligatures are fi fl ffi ffl and st. There are no problems with other characters or other ligatures(sp ct ch).</p>
    <p>It is really irritating because I have absolutely no idea why this is happening. :(</p>
    <p>Hope somebody can help.</p>
    <p>Magnus</p>
