    html: <p>I'm just focusing on getting an uppercase alphabet done for now, maybe with a bit of punctuation and some accents. I feel like distressing an alphabet is best done in photoshop in the final product, so that you don't have to deal with the same letter having faults in the same place on every letter.</p>
