    html: <p>What kind of opentype code? Just adding automatic 'ligatures' for different pairs of letters containing different variants, or is there something more refined that I can make use of?</p>
  - id: 513295
    user_id: 17101
    user_name: Frode Bo Helland
    user_path: null
    date_raw: 19 Jun 2012 — 2:46am
    date: 2012-06-19T02:46:00
    votes: null
    html: "<p>I am talking about a contextual alternate (CALT) feature. There are methods for psuedo randomization, but if you want something that feels real I think it’s better to think “contextually”: i.e. what circumstances makes the ink bleed and what would the next letter look like in that same circumstance?</p>"
