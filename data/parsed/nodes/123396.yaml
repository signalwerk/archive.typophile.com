      <p>I finally looked at Vanessa (at Dafont) and realized that is probably what was used to make the lettering of your sample. Some sort of type styling software was used, possibly Photoshop, or Illustrator, and probably with some editing of features that didn't make good 3D shapes. I think Vanessa is the answer you were looking for.</p>
      <p>- Mike Yanega</p>
