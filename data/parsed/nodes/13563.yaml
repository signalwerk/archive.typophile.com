      <p>FontLab offers significant educational discounts, because obviously educational institutions are worth supporting.</p>
      <p>FontLab is also developed in Russia. FontLab, Ltd. is a small, international company. It is not a big greedy corporation. I have no problem supporting it with what little money I manage to earn as a student.</p>
      <p>With FontLab, one can use <a href="/web/20150123120424/http://typophile.com/wiki/RoboFab" class="freelinking" rel="nofollow">RoboFab</a> and <a href="/web/20150123120424/http://typophile.com/wiki/Python" class="freelinking" rel="nofollow">Python</a> scripts. While FontLab is not OpenSource, both of these are. And they are the cutting edge of font-making technology. I think that students would really get a service if they were exposed to those…</p>
      <p>__<br>
      <a href="https://web.archive.org/web/20150123120424/http://www.typeoff.de/" title="www.typeoff.de">www.typeoff.de</a></p>
