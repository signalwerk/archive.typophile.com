      <p>Well... Let me try to explain this by numbers.</p>
      <p><strong>1.</strong><br>
      One of the main directives of this project is to <strong>ALWAYS keep it on an Open [Source] Basis</strong> so we don't depend on third party, commercial solutions.</p>
      <p><strong>2.</strong><br>
      I really believe on the future of Open Source Software.</p>
      <p>Bear with me for a moment - I work as a Design Tecnhician in a Fine-Arts Faculty in Portugal. As you might know, our public education system doesn't have that much money. The one's who do are <em>usefull</em> courses/faculties like engineering... So this situation leaves us with obsolete growing, underdeveloped, non-market responsive solutions. All this because people who are running the system are spending money in vaious stupid ways. <em>If you are familiar with Manuel Castells'opinions</em><strong>You might agree that one way to promote  a better future is through the use of Open Source solutions.</strong> In a very practical way, save some money to invest on more important things - enter Linux &amp; Open Source Software, <strong>hence the use of Fontforge.</strong></p>
      <p>Take the case of our neighbours, the spanish region of Estremadura. The public education system developed their own personalized, scaled to needs Linux Distro - Linex - that they implemented on the whole school system. It worked and the savings were huge!</p>
      <p>Brasil and some regions in Africa and India are also taking on similar initiatives...</p>
      <p>I know these are difficult to implement solutions, and calculating the costs aren't this simple. But this takes to me next point.</p>
      <p><strong>3.</strong><br>
      Imlementing this cost saving solutions means taking on a higher maitenance cost and further system administration - hey! I work on an University... aren't Universities supposed to promote knowlegde? How about using these systems, develop them, teach students howto, and then comming full circle when students start to use them in their professional lives and saving money to companies etc...</p>
      <p>Nevertheless students should be also trained on the tools that the market needs - so teaching commercial tools and practices is also necessary. So the perfect solution would be to train students how to do it independently of the tools.</p>
      <p>So as a member of a Faculty I feel it's my obligation to start using this systems, and start promoting them (along with commercial and established solutions). <strong>The LiveType Project is exactly this - I want to show people that is possible to use the free, open source solutions to learn how to do it with professional quality.</strong> And talking about learning...</p>
      <p><strong>4.</strong><br>
      <strong>The fact that they learn how to "do it" on a Linux platform, or on a Mac platform or on a Win platform doesn't affect "what" they learn.</strong> This is really it. I don't consider myself a type designer... I'm just an amateur typographer and type designer whanabe, so I also want to learn how to type design better, who knows if I grow to be good at it? I also want to learn no matter the platform. <strong>I also want to learn and knowlege should be acquired in a Free, Open Source Collaborative way!</strong> Things work out better if we collaborate with each other.</p>
      <p><strong>5.</strong><br>
      Finally... I'm open to suggestions... Don't feel like learning how to use Fontforge? (even though it runs on Mac, Win &amp; Linux machines)<br>
      Then use the binary files, modify them, play with them.</p>
      <p>Use different software, and maybe even openning different areas on the site to different tools/software?<br>
      Who knows? Suggest something, <a href="https://web.archive.org/web/20150123120424/http://livetype.sourceforge.net/getinvolved.htm" rel="nofollow">Get involved!</a></p>
      <p>(this is the first time I try to write down these ideas... so it might read a bit strange. I'll be more assertive next time! Oh... and thanks, writing this down is really helping me to organse my thoughts about this!)</p>
      <p>Cheers!</p>
