    <p><strong>LiveType Project</strong><br>
    Open Source Collaborative Type Design<br>
    <a href="https://web.archive.org/web/20150123120424/http://livetype.sourceforge.net/" rel="nofollow">http://livetype.sourceforge.net</a></p>
    <p>The LiveType Project focuses on the development of complete Fonts using <strong>Fontforge</strong>.<br>
    This project aims that everyone involved can and will learn more about typography and type <strong>developing in a collaborative method</strong>. It will provide the fonts and the font files regularly to users, developers and anyone with an interest in type.</p>
    <p>What are you waiting for? <strong><a href="https://web.archive.org/web/20150123120424/http://livetype.sourceforge.net/getinvolved.htm" rel="nofollow">Get involved!</a></strong></p>
