      <p>I first though of <a class="freelinking external" href="http://beta.okaytype.com/Typefaces/Alright_Sans/Overview/index.php" rel="nofollow">Alright Sans</a>.</p>
      <p>But you should probably clarify if you're talking about how the sans would be used (body text, menus, headings?) and how you're going to deploy the font (as graphics, as one or another form of web type?).</p>
