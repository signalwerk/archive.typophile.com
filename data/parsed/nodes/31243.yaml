      <p>If you really need to bring the oceans across, get away from all the hard lines. Try combining wavy forms with a supple contemporary serif as opposed to all those hard edges and old style type. </p>
      <p>If you really want some ideas, try flipping through some National Geographic underwater stuff. Today I went to their annual photography contest exhibition, and some of those photos just blew my mind—I'll be pulling material from it all semester, and if they did a book for it I'd be doing so for a good decade.</p>
