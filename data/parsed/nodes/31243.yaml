    <p>I'm currently working on a small project for 2 Navy programs... WRAPS (Waste Reduction Afloat Protects the Sea) and PRIME (Plastic Removal in the Marine Environment). They're both preventative programs to lessen the impact of harmful pollutants that are leached into the oceans from naval ships. </p>
    <p>WRAPS has created recycling programs that limit the levels of caustic waste while a ship is deployed. Usually the final waste is mostly biological (food remnants) that get processed into small pucks. </p>
    <p>PRIME is another recycling program that focuses directly on any and all plastic products that are used on deployed naval ships. </p>
    <p>They're hoping to expand the impact of their programs on a more broad sector, and possibly even breach into the commercial shipping companies.</p>
    <p>I've been asked to create some marketing material. We're starting small. I've created some simplified logos and have been asked to come up with tag lines and other collateral. I'm kinda stuck on ideas and was wondering if anyone might have a thought or two they'd like to share. </p>
    <p>I'll post what I currently have as far as the proposed logos, that will probably be used on the marketing swag they'll hand out at trade shows and stuff. At the very bottom of the PDF are the original logos (circular ones.) and approved colors I can use. </p>
    <p>I'm also in charge of making a pocket folder and handouts. An idea I had was to create an ocean scene, either from scratch or use a photograph, and then place silhouetted images of fish and underwater wildlife, to signify the lose of these creature if pollution prevention measures aren't taken further. </p>
    <p>My creativity bone is broken and I could use some fresh ideas.</p>
