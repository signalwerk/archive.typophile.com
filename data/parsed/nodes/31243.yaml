      <p>This is for the Navy? If so, you're WAY off base. Didn't you read US Logo Specifications section 28 paragraph 3 clauses 1 - 4?</p>
      <p>1) All logos must be round. Like a seal. It looks important.<br>
      2) All logos must incorporate at least 7 unique literal objects into the mark.<br>
      3) Issues of reproduction should be ignored. We know we can't realistically put these behemoths on a banner on a web site, but we don't care. We're the government.<br>
      4) Make sure it uses at least 9 colors. We like color.</p>
      <p>I'm afraid I have no other advice than to start over. These are simply way too nice for government logos.</p>
      <p>(Can you tell I have a .gov job?)</p>
