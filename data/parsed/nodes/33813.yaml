    html: <p>I understand your point of view and I really hope you will continue to experiment this way. My critic was only based on my personnal tastes which is based on my so called strict, minimalist swiss visual culture. So I'm not really impartial and the fact I don't appreciate something don't means it's bad. Plus, even if I'm not a fanatic of this style, it's evident that your illustrations are really well done and that you work quiet a lot on them. So, goodnight and good luck!</p>
