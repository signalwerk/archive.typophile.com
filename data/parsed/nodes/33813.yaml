      <p>Thanks for the input kuroneko and alepaul.</p>
      <p>I'm mainly curious about peoples perception of the illustrations,<br>
      which is why I posted the link. I guess you either love or hate<br>
      this aesthetic. Much of it can certainly be seen as 'bad, cheesy'<br>
      but also I think 'good, kitsch'.</p>
      <p>I'm trying to avoid vectors and 3D seems a good starting point,<br>
      although it carries a lot of baggage and it's not a particularly<br>
      'cool' style at the moment.</p>
      <p>&gt;the illustrations you’ve made don’t emphasize your caracters...</p>
      <p>I guess what I'm trying to do, in some ways, is create images<br>
      that make lettering interesting and evocative to a wider audience,<br>
      rather than just designers. I love stark, simple, black and white<br>
      images but I also like the other extreme. Vivid, complex and colourful.</p>
