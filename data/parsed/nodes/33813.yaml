    <p>Hello All,</p>
    <p>Just to say I've put up a web site to showcase personal<br>
    illustration and animation projects. The site also has a<br>
    'Found Type' photo section and links to my retail typefaces.</p>
    <p><a href="http://www.seblester.co.uk" title="www.seblester.co.uk">www.seblester.co.uk</a></p>
    <p>Any constructive feedback, positive or negative,<br>
    would be much appreciated.</p>
    <p>Thanks,</p>
    <p>Seb</p>
