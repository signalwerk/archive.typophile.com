  html: |-
    <p>OK, I make my accents for the caps with a "dot.case" name(e.g., acute.case), which I thought was the proper name for automatic accented character building. But when I make a "caron.case", bloody FL just goes ahead &amp; uses the regular (lowercase) caron. "breve.case" seems to work . . .</p>
    <p>Anybody solved this for the caron?</p>
    <p>TIA</p>
    <p>Charles</p>
