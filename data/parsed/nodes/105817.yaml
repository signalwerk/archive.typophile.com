    html: |-
      <p>&gt; Or a CEO who's really into micromanaging.</p>
      <p>Yep. There are examples of employees doing things behind the micromanaging boss' back because they couldn't win an argument with him. At Apple the engineers would occasionally change technical details without Steve Job's knowledge because they knew he was wrong. And when Frank Lloyd Wright designed his masterpiece house Fallingwater, they couldn't convince him it needed more reinforcements so they added them secretly. But of course you can't make secret changes with logos; what you see is what you get.</p>
      <p>Trying to design with the client (or CEO) looking over your shoulder is usually a recipe for disaster. They end up designing it themselves ("make it bigger, now change it to blue..."), instead of letting the designers go through the normal design process (which can seem slow and boring to a non-designer).</p>
