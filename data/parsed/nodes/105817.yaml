      <p>I expected that I would think the logo was just fine, despite all the doubting. However, instead, I have to admit I don't like it either.</p>
      <p>I have nothing against Optima; it's a good text face, even if the light weight used isn't bold enough for a logo. But whatever it is, I had to examine the logo carefully to determine that the first and last letters were larger, with the three middle ones the same size. At first I thought the first letter was large, and then the remaining letters gradually increased in size.</p>
      <p>When a point like this is ambiguous, something is wrong.</p>
