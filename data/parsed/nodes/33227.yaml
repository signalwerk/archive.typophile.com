    html: |-
      <p>Yots, </p>
      <p>you can obviously do pair kerning in TypeTool 3. Also, you can draw your pair and triplet ligature glyphs in TypeTool 3, and use Microsoft VOLT or Adobe FDK for OpenType (both free) to add OpenType Layout feature definition code that takes care of ligature substitution in OpenType-savvy applications. </p>
      <p>Adam</p>
  - id: 198664
    user: 18154
    date: 2007-04-23T11:28:00
    date_raw: 23 Apr 2007 — 11:28am
    votes: null
    html: |-
      <p>I know that you can do kerning pairs in TT but what I'm asking is if I can create a font that is smart enough to know when to use certain characters. </p>
      <p>For example, the typeface I'm creating has two different versions of "A" and three versions of Y. I've attached a JPG of the typeface so you can reference it.</p>
      <p>Now, lets say I'm type the word WAYS, I want it to be able to recognize that combo of characters and use the correct A and Y so that they seem to "fit" together. I also want it to use different versions of the letters depending on which character procedes it or follows it.</p>
      <p>Is this possible?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/typeface_4069.jpg"></div><p></p>
  - id: 198701
    user: 17567
    date: 2007-04-23T14:03:00
    date_raw: 23 Apr 2007 — 2:03pm
    votes: null
    html: |-
      <p>Very cool!<br>
      Yes. It's possible using conditional substitutions. You are going to have to work out the tables very well to anticipate all the possible combinations. You can download VOLT from Microsoft's site. The FDK has a higher learning curve. Look around on Microsoft's typography site. You'll find a lot of information.</p>
