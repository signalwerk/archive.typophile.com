  html: <p>I'm new to the font making world and do it as a hobby. I'm looking to purchase a font editor and TypeTool seems to be a good option but I'm wondering if I will be able to create a font using TypeTool that uses pairs and triples. The typeface Im creating contains certain a few versions of certain characters so they can combined with other characters. For instance AV. I want to know if it can do this before I purchase.</p>
comments:
  - id: 198554
    user: 1133
    date: 2007-04-23T03:42:00
    date_raw: 23 Apr 2007 — 3:42am
