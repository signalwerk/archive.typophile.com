  html: |-
    <p>Is it a typographic crime to track out a condensed font for headlines? </p>
    <p>For example, all cap headlines with Tungsten Compressed by Hoefler.</p>
    <p>If I want to track should I stick with the non-compressed version of the font? </p>
    <p>Just trying to avoid a typographic crime, any suggestions? I've heard never to track out condensed type.</p>
