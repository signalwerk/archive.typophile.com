      <p>I have definitely seen it used on every line before, but I believe it was used even within the same paragraph, e.g.</p>
      <blockquote><p>Someone cried out «what is it<br>
      »that is going on over there in<br>
      »the forest?» </p></blockquote>
      <p>Here's a <a class="freelinking external" href="http://www.uamenlinea.uam.mx/materiales/lengua/puntuacion/html/comi.htm" rel="nofollow">reference</a> from UAMexico's site.  Can't think what work I had read a few months ago that used it as such.</p>
      <p>In modern Spanish, the standard is as noted by hrant for French (DPD comillas 2):</p>
      <blockquote><p>Al citar algo muy largo, «se<br>
      usan las comillas de apertura<br>
      para iniciarlo.<br>
      » Y en el siguiente párrafo, se<br>
      sigue con una comilla de cierre,<br>
      con otra de cierra parar acabar<br>
      la cita»</p></blockquote>
      <p>Edit: found an official source to the every line rule.  The 1884 DRAE has as its entry for comilla:</p>
      <blockquote><p>Signo ortográfico ( «&nbsp;»&nbsp;) que se pone al principio y fin de las frases incluídas como citas ó ejemplos en impresos ó manuscritos, y también, á veces, <em>al principio de todos los renglones que estas frases ocupan</em>.…</p></blockquote>
      <p>That is,</p>
      <blockquote><p>Orthographic symbol ( «&nbsp;»&nbsp;) placed at the beginning and end of phrases included as quotations or examples in print or manuscript, and also, sometimes,  <em>at the beginning of all the lines that these phrases occupy</em>.…</p></blockquote>
