      <p>I was simply thinking of</p>
      <p>«Français»<br>
      »Deutsch«</p>
      <p>which is also what the first reply spoke of, but it seems like you are referring to something entirely different of which I was not aware, that the convention for continuing a quote between paragraphs in French is different;</p>
      <p>(quote)</p>
      <p>becomes</p>
      <p>(quote p1<br>
      (quote p2)</p>
      <p>in English, but</p>
      <p>(quote p1<br>
      )quote p2)</p>
      <p>in French - which does have the virtue of greater unambiguity, since the closing quote occurring at the beginning of a paragraph can only mean one thing.</p>
