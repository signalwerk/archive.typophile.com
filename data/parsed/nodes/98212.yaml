    html: |-
      <p>Just to be clear: I'm not talking about the use of guillemets in French - I'm well aware that's what's used instead of floating "66/99" quotes (in fact we use guillemets in Armenian too). What I'm talking about is using a closing guillemet where an opening one seems normal.</p>
      <p>But the wiki above does actually contain a pertinent passage:<br>
      "<br>
      In many printed books, when quotations are spanning multiple lines of text (including multiple paragraphs), an additional closing quotation sign is traditionally used at the <em>beginning</em> of each line continuing a quotation ; any right-pointing guillemet at the beginning of a line does <strong>not</strong> close the current quotation; this convention has been consistently used since the beginning of the 19th century by most book printers (and is still in use today). Note that such insertion of continuation quotation marks will also occur if there's a word hyphenation break. Unfortunately, there is still no support for automatic insertion of these continuation guillemets in HTML/CSS and in many word-processors, so these have to be inserted by manual typesetting:</p>
      <p>    « C’est une belle journée pour les Montréalais, soutient<br>
          » le ministre. Ces investissements stimuleront la crois-<br>
          » sance économique. »<br>
      "</p>
      <p>In that example on Flickr, I can't see the left edge of the text but it's possible the closing-for-opening guillemets are only placed at the beginnings of on-going paragraphs, which would not be exactly what the example in the wiki shows.</p>
      <blockquote><p>a symbol combining ....</p></blockquote>
      <p>Sounds fascinating, but you've lost me completely. Explain?</p>
      <p>Concerning dashes at linebreaks:<br>
      - I remember a while back a French typophile (I even met him at the Rome ATypI, but I can't remember his name at the moment) suggesting the use of the Logical Not sign to hyphenate long URLs that would need to go over a linebreak. I liked the idea but not many others did.<br>
      - In Armenian we have different symbols for a compound-word dash versus a linebreak dash, but sadly the latter has been folded into the former in practice (although it <em>is</em> in Unicode).</p>
      <p>hhp</p>
