  html: |-
    <p>What strategies do you use to choose a typeface that complements and stylistically matches an illustration? </p>
    <p>There are times when an illustration is making an obvious historical reference and it is easier to choose a font from the same time period or movement. Contemporary illustration is harder for me. What do you look for?</p>
