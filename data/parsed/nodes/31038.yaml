    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Wikis" class="freelinking" rel="nofollow">Wikis</a> : Diacritics Project</strong></p>
    <p>On-line resource intended to educate type designers on how to create properly-formed diacritical characters for international fonts. This project has been developed by <a href="/wiki/Filip%20Blazek" class="freelinking" rel="nofollow">Filip Blažek</a> and is intended to be a collaborative effort in wiki format.<br>
    Blažek writes:<br>
    <cite>The aim of this project is to build a free on-line database of knowledge and experience — how to design correct diacritics: what size, shape and position an accent should have. Text concerning the history, use, languages and also some technical information is related to each diacritical mark. The project web site is based on wiki: after a simple registration, anyone can append or correct any published text or upload pictures. There is no need for special knowledge of HTML code, the editing is also similar to Wikipedia.</cite></p>
    <p><strong>Discussion</strong><br>
    <a href="http://typophile.com/node/12094" rel="nofollow">Project Diacritics</a><br>
