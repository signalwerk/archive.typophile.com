    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/28138" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Wikis</a>&nbsp;: Diacritics&nbsp;Project</strong></p>
    <p>On-line resource intended to educate type designers on how to create properly-formed diacritical characters for international fonts. This project has been developed by <a href="/node/12524" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Filip Blažek</a> and is intended to be a collaborative effort in wiki format.<br>
    Blažek writes:<br><cite>The aim of this project is to build a free on-line database of knowledge and experience — how to design correct diacritics: what size, shape and position an accent should have. Text concerning the history, use, languages and also some technical information is related to each diacritical mark. The project web site is based on wiki: after a simple registration, anyone can append or correct any published text or upload pictures. There is no need for special knowledge of <span class="caps">HTML</span> code, the editing is also similar to Wikipedia.</cite></p>
    <p><strong>Discussion</strong><br><a href="http://typophile.com/node/12094">Project Diacritics</a><br><a href="http://typophile.com/node/12880">Diacritics Wiki Project Posted by Filip Blazek</a><br><a href="http://typophile.com/node/15808">Diacritics Project&nbsp;Updated</a></p>
    <p><span class="caps">URL</span>: <a href="http://diacritics.typo.cz">http://diacritics.typo.cz</a></p>
