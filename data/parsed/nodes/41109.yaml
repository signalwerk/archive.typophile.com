    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Eric Olson</strong></p>
    <p>Named by <em>PRINT</em> magazine as one of the New Visual Artists for 2004, Eric is the principal and lead designer of the <a href="/wiki/Process%20Type%20Foundry" class="freelinking" rel="nofollow">Process Type Foundry</a>.</p>
    <p>Established in 2002, the Process Type Foundry is a type design studio housing the retail and custom typefaces of Eric Olson. The aim of the studio is to provide a range of retail and custom typefaces for contemporary designers with a particular focus on rigorous full featured OpenType fonts. Custom clients include General Motors, Metropolis magazine, the Walker Art Center and the Design Institute at the University of Minnesota.</p>
    <p>In the past, Eric taught typography at the Minneapolis College of Art and Design (MCAD), held an assistant design fellowship at the University of Minnesota Design Institute and served as a designer at the Walker Art Center. </p>
    <p>Originally from Minneapolis, Eric lived in Reading (England) from 2006–2007 while <a href="/wiki/Nicole%20Dotin" class="freelinking" rel="nofollow">Nicole Dotin</a> was studying at the <a href="/wiki/University%20of%20Reading" class="freelinking" rel="nofollow">University of Reading</a>'s <a href="/wiki/MA%20Typeface%20Design" class="freelinking" rel="nofollow">MA Typeface Design</a> program. They have since both returned to the United States.</p>
