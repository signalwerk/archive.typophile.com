  html: |-
    <p>I'm close to buying <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/lanston_type_co/ltc_kennerley_bold_small_caps/" rel="nofollow">LTC Kennerley bold</a> (a face Nick recently mentioned in <a class="freelinking external" href="http://typophile.com/node/51171" rel="nofollow">another thread</a>, coincidentally, though his comment went wooshing over my head) for the covers of a series of books, but I'm not totally sold yet. Can anyone suggest faces with a similar look to the samples below?</p>
    <p>I like the wedge serifs, the width, and the touch of roundedness and informality, but maybe the latter goes too far (or maybe the real issue is it wasn't designed for display sizes?).</p>
    <p>LTC Garamont has the same kind of feel, though I like it a bit less – attached too.</p>
