    html: <p>I had the same Problem with PDF embedding and I solved it with a little tool on the MS Website. You can edit all "font info" with it and also change the level of embedding. <br> <br>Here's the link <br> <br><a href="http://www.microsoft.com/typography/property/property.htm?fname=%20&amp;fsize=" target="_blank">http://www.microsoft.com/typography/property/property.htm?fname=%20&amp;fsize=</a> <br> <br>There is also a tech doc on the macromedia website, but it tells you merely to use the tool from MS. <br> <br>Servus  <br> <br>Dominik</p>
