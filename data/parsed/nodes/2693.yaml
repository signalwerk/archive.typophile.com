  html: "<p>Whenever I save a document in Illustrator using my own fonts I get an error. It doesn't seem to affect anything, nor on screen or print, so I'm not sure what it means, but nonetheless it's a bit annoying: <br> <br>Could not embed font (FONT NAME). Protected fonts can not be embeded.  <br> <br>I'm using Fontographer 4.14, and Illustrator 9 for PC.</p>"
  html_clean: "<p>Whenever I save a document in Illustrator using my own fonts I get an error. It doesn't seem to affect anything, nor on screen or print, so I'm not sure what it means, but nonetheless it's a bit annoying: <br> <br>Could not embed font (FONT NAME). Protected fonts can not be embeded.  <br> <br>I'm using Fontographer 4.14, and Illustrator 9 for PC.</p>"
