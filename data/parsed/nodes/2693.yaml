    html: <p>The problem is that your fonts have a font embedding setting that is either nonsense/garbage or says they can't be embedded. <br> <br>My first recommendation would be to get a real font editor, like FontLab, TypeTool or FontMaster. Fontographer hasn't been updated in about 7 years, so there's not much hope they'll fix this. <br> <br>Failing that, do a search on Macromedia's web site for a tech doc on font embedding settings. On the Mac version of Fontographer there is some sort of hack to fix this, and presumably there is on Windows as well. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>The problem is that your fonts have a font embedding setting that is either nonsense/garbage or says they can't be embedded. <br> <br>My first recommendation would be to get a real font editor, like FontLab, TypeTool or FontMaster. Fontographer hasn't been updated in about 7 years, so there's not much hope they'll fix this. <br> <br>Failing that, do a search on Macromedia's web site for a tech doc on font embedding settings. On the Mac version of Fontographer there is some sort of hack to fix this, and presumably there is on Windows as well. <br> <br>Regards, <br> <br>T</p>
