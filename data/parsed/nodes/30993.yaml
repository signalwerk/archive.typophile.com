    <p>Didone-style letterforms encompass the “Modern,” or neoclassical style of typefaces, which originated in France, Germany, and Italy around 1800. The predominate players in the movement were <a href="/node/30994" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Giambattista Bodoni</a> and the member of the <a href="/node/add/wiki?edit%5Btitle%5D=Didot" title="Create node &quot;Didot&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Didot</a> family.</p>
    <p><strong>Style name explanation</strong><br>
    Didot + Bodoni =&nbsp;Didone</p>
