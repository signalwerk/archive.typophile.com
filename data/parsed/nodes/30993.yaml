    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Didone</strong></p>
    <p>Didone-style letterforms encompass the "Modern," or neoclassical style of typefaces, which originated in France, Germany, and Italy around 1800. The predominate players in the movement were <a href="/wiki/Giambattista%20Bodoni" class="freelinking" rel="nofollow">Giambattista Bodoni</a> and the member of the <a href="/wiki/Didot" class="freelinking" rel="nofollow">Didot</a> family.</p>
    <p><strong>Style name explanation</strong><br>
    Didot + Bodoni = Didone</p>
