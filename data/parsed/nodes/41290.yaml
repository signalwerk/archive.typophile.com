  html: |-
    <p>Hi everyone,</p>
    <p>This subject has been discussed several times here and my self already had problems with this and posted the problem. I think is time to look at the problem and figure out what to do to solve it.<br>
    I try to edit a forum post in order to attach a pdf file.<br>
    I do the “Edit” and open the “File attachments”.<br>
    “Attach new file” and “Attach”. The file is show in the list and selected in “List”.<br>
    Do the “Submit” and the file disapear and dont show on the post!<br>
    This problem is in both Firefox and IE...<br>
    I have just installed the "last" flash player in case someone tries the "download the last version of....and try again!"</p>
    <p>Why is the upload of a simple file directly connected with flash? Is this really necessary? Wich software is used for this forum?Opensource or developed especially for this purpose (typophile I mean...)?</p>
    <p>António Fonseca</p>
