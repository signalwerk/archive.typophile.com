      <p>I've looked at it in Safari 5.1.2 in Mac OS X 10.6.8 and it looks fine (i.e. the hyphens do appear). The very first edition of the Lato fonts published about a year ago had the omission of the hyphen glyph. So this problem did indeed occur if the oldest version was used. Perhaps, by some chance, you've once visited a web page that used Lato some months ago, and that version is still in your Safari cache? I don't know. I'd be happy to know, however, if the same problem occurs once you've cleaned the Safari cache and then, perhaps, restarted the computer? Also, do you have Lato installed locally on your machine by any chance? </p>
