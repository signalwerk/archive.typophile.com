    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2010-12-16-Lato-1-Release-588x1100_4740.png"></div><p></p>
    <p>tyPoland presents its first public typeface release</p>
    <p><strong>Lato</strong></p>
    <p><strong>Lato</strong> is a sanserif typeface family designed in the Summer 2010 by Warsaw-based designer <strong>Łukasz Dziedzic</strong> <em>(“Lato” means “Summer” in Polish).</em> In December 2010 the Lato family was published under the open-source Open Font License by his foundry <strong>tyPoland</strong>, with support from Google.</p>
    <p>In the last ten or so years, during which Łukasz has been designing type, most of his projects were rooted in a particular design task that he needed to solve. With Lato, it was no different. Originally, the family was conceived as a set of corporate fonts for a large client — who in the end decided to go in different stylistic direction, so the family became available for a public release.</p>
    <p>When working on Lato, Łukasz tried to carefully balance some potentially conflicting priorities. He wanted to create a typeface that would seem quite “transparent” when used in body text but would display some original traits when used in larger sizes. He used classical proportions (particularly visible in the uppercase) to give the letterforms familiar harmony and elegance. At the same time, he created a sleek sanserif look, which makes evident the fact that Lato was designed in 2010 — even though it does not follow any current trend.</p>
    <p>The semi-rounded details of the letters give Lato a feeling of warmth, while the strong structure provides stability and seriousness. “Male and female, serious but friendly. With the feeling of the Summer,” says Łukasz.</p>
    <p>Lato consists of <strong>five weights (plus corresponding italics)</strong>, including a beautiful hairline style. The first release only includes the <strong>Western character set</strong>. Improved screen quality (better hinting), pan-European Latin, Cyrillic and Greek extensions, as well as small caps and other typographic niceties are expected in <strong>2011</strong>.</p>
    <p>The entire family is <strong>completely free for any desktop and webfont use</strong>, and is available from the Google Font Directory at:<br>
    <strong><a href="http://bit.ly/latofonts" rel="nofollow">http://bit.ly/latofonts</a></strong></p>
    <p>I’ll appreciate any remarks, comments etc. </p>
    <p>Enjoy!<br>
    Adam</p>
