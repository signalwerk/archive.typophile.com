      <p>Couple of things -- I believe some further characters were hinted at? Old-style numbers, small caps? Any notion when they'll be ready?</p>
      <p>And secondly, we just took in a book that uses (reworked) Charis for text, with Lato for display. The designer, Cherie Westmoreland, has gotten at least two books in the AAUP Book Show that use Charis for the text. (Of course, she has a fair number of her books chosen for the show over the years. Still...) This will be the first time we've done a book that used only open source fonts -- and I think Lato more than good enough for show books.</p>
      <p>Thanks for it,</p>
      <p>Charles</p>
