    <p>Hello -</p>
    <p>I’m a MFA student at Parsons the New School Of Design at NY, USA. For my Master’s thesis I am pursuing a typeface design project -</p>
    <p>ABSTRACT:<br>
    English + Hindi = Hinglish<br>
    “Hinglish” is emerging as a commonly spoken language in India and amongst Indians living in USA and UK. It is used vocally, while chatting and it is often seen in popular culture such as TV shows, Movies, Books, Magazines, Chat rooms, Song lyrics etc.</p>
    <p>I want to design TWO display fonts that reflect this notion of being Hinglish. - A Latin (English) font that is influenced by Indian Culture and a Devnaagri (Hindi) font that is influenced by Western Culture. I hope to create a scenario for compare and contrast with my two fonts that can both reflect the notion of being cross-cultural.</p>
    <p>Examples of influences from Indian culture are:<br>
    henna, Rangoli, folk art, Warli, batik paintings, paisley designs, peacock symbolism, Indian Jewellery, miniature paintings, architecture, temples, religion, Bollywood etc</p>
    <p>Examples of Western Influences are:<br>
    art deco, neon signs, grunge look, pop art, mordernism etc</p>
    <p>MOTIVATIONS:<br>
    1) I am of Indian origin studying in the US and would like my work to reflect that duality.</p>
    <p>2) There are very few Display fonts available in Hindi and this has limited their use in<br>
    graphic design in India. Also amongst the ones available they are not influenced by such western motifs-</p>
    <p>3) There are very few display fonts in English of Indian influence - Barring a few exampls like -</p>
    <p>kalakari - by beth Shirrell<br>
    Samaro and samaran</p>
    <p>India has a rich aesthetic tradition and I want to bring that into my display fonts.</p>
    <p>4) I hope these fonts can comment and reflect upon today’s era of globalization and high information exchange.</p>
    <p>5) I chose to design Display fonts over a body copy as it allows me to be more expressive and pay more attention to aesthetics over legibility.</p>
    <p>INITIAL SKETCHES:<br>
    1) Inspired by Indian Jewellery:<br>
    <a href="http://rohiniblog.blogspot.com/2009/09/prototypes.html" title="http://rohiniblog.blogspot.com/2009/09/prototypes.html">http://rohiniblog.blogspot.com/2009/09/prototypes.html</a></p>
    <p>2) Inspired by Warli Folk art:<br>
    <a href="http://rohiniblog.blogspot.com/2009/09/prototype-2.html" title="http://rohiniblog.blogspot.com/2009/09/prototype-2.html">http://rohiniblog.blogspot.com/2009/09/prototype-2.html</a></p>
    <p>3) Inspired by Indian Instruments:<br>
    <a href="http://rohiniblog.blogspot.com/2009/09/prototype-3.html" title="http://rohiniblog.blogspot.com/2009/09/prototype-3.html">http://rohiniblog.blogspot.com/2009/09/prototype-3.html</a></p>
    <p>Please feel free to comment on - my concepts, motivations, preliminary sketches and more -<br>
    Any feedback, thoughts and suggestions would be most appreciated.</p>
    <p>Thank you,<br>
    Rohini</p>
