    html: "<p> in general i stick with hrant on this topic. but being a blabber mouth i'd like to add a point: <br> <br>there is no real danger in leaving the doors open and letting the meaning of 'art' run around our houses, living its stench on everything. Because being easy on this definition will only mean we'll accept evrything around as a possible oppurtunity for inspiration (or - 'Art'). It does not mean we have to be apathic about everything and let dull and mind-modular objects be excused as art. Each of us has his and hers own free will to see what is insipiring and beautiful, and what is not, so that however we define an object, we could see if its qualities. By opening the meaning of art to the public, instead of closing it in the metal zoo of the critics, we are obligated to see more in everything. Since everything might have artish qualities in it. <br> <br>The discussion if something is art or not seems alltogether meaningless to me. 'art' is just stuff with concetrated inspiration. if you want, you can discuss those painting as objects and share with people the feelings they evoke in you. </p>"
