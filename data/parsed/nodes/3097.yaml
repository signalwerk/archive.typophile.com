    html: <p> I have to agree with Hrant. Or maybe when I'm finished I'll have agreed with Tanya. :$ <br> <br>Art in general, and in my opinion (key phrase), is only the artists until it leaves their studio. Once it is on display the work (whether Cot or Kitsch) becomes that of the viewer. Those who view the work, everyone, will "see" the work through their own life's experiences. And because of this will like it or not like it based on this. <br> <br>Sure there are so-called and so-entitled critics of art who have a following of people that have happened to agree with their (critic) opinions on what is and what is not good art. And that is also not to say that some art isn't--more or less--obviously "better" art. Some artists do have (and have had) a better understanding of the human figure or how to mix their paints or how to use composition. But those are all technical issues.  <br> <br>But again it is all a matter of opinion. One person's kitsch is another persons prized possession. </p>
