      <p>Fallon's humor is brilliant, but to bad the typography for his run with The Tonight Show ain't fun at all. It's rather lame, limp and stale ...failing flat. </p>
      <p>Is Fallon the show? </p>
      <p>Or, does The Tonight Show have any brand strength of its own?</p>
      <p>Pentagram's version of The Tonight Show is nothing more than what they did for NYC's street signage ...in fact the street signage may just have a little more life to it ... <a href="http://new.pentagram.com/2013/01/new-work-new-york-city-parking-signs/" title="http://new.pentagram.com/2013/01/new-work-new-york-city-parking-signs/">http://new.pentagram.com/2013/01/new-work-new-york-city-parking-signs/</a></p>
