      <p>&gt; Is Fallon the show?<br>
      &gt; Or, does The Tonight Show have any brand strength of its own?</p>
      <p>The brand strength is mainly with older viewers who've watched the show for years with various hosts.</p>
      <p>Jay Leno consistently had good ratings, but the median age of his viewers was 56.  (Letterman's median viewer age is 54.) That's why NBC pushed Leno out; they're hoping that a younger host will bring younger viewers that are more desirable to advertisers.</p>
