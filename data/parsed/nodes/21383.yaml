  html: |-
    <p>I'm working in Illustrator CS, trying to update the text in a huge pile of forms that were  provided as EPS exports from Quark or from PDF files. The text of the forms is split up into many, many text objects instead of full lines or paragraphs that can be edited easily. It seems like any instances of custom kerning or spacing values are converted as the start of a new text object, so that the result is a series of aligning words or characters instead of a single, flowing line of text.</p>
    <p>Do you know of any utilities or Illustrator scripts that can combine multiple text objects into one? I've tracked down one so far (The "Concat Text" script at <a href="http://rj-graffix.com/software/scripts.html" title="http://rj-graffix.com/software/scripts.html">http://rj-graffix.com/software/scripts.html</a>), but the results are a little unpredictable. I'd like to investigate some others for a comparison.</p>
    <p>If you have any recommendations, that would be awfully helpful.</p>
