    <p>Do you know of any utilities or Illustrator scripts that can combine multiple text objects into one? I've tracked down one so far (The "Concat Text" script at <a href="http://rj-graffix.com/software/scripts.html" title="http://rj-graffix.com/software/scripts.html" class="link-external">http://rj-graffix.com/software/scripts.html</a>), but the results are a little unpredictable. I'd like to investigate some others for a comparison.</p>
