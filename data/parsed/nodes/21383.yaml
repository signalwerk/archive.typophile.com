      <p>If/when you find the magic program, please let us all know. Even selecting all the text and pasting it into a simple text editor can have unpredictable results, because the "stacking order" of the various pieces of the text don't necessary follow a linear progression from start to finish.</p>
      <p>One thing you might try for paragraph text is to save the EPS as a PDF file, open the PDF in Acrobat, use the "Select Text" to copy the paragraph, then paste the type into a new paragraph/area text box in Illustrator. You'll probably stand a better chance of keeping the word order this way.</p>
