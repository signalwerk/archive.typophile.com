    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/WPShinn.jpg"></div><br>
      That's nice Chris, I like the angled lettering on top and the fully connected condensed script.<br>
      W.P. was my great grandfather, an upholsterer (as was his father etc.), and the store also sold used furniture etc. This picture dates from the 1900s. He later had a van (which was run by my grandad, who loved motors) to pick up and deliver, but come WW2 there was a huge demand for moving furniture out of London and storing it. Hence the "Removals" on the van picture, which dates from the 1940s. People were more interested in moving furniture out of harm's way than getting it reupholstered. I like the way the telephone exchanges had names, not numbers, as in Chris' photo. Sorry for getting off topic, but given half an excuse to show some nice old lettering...<p></p>
