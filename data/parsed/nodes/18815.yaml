    <p>Hello Everyone,</p>
    <p>I've been asked to design some truck lettering for a bakery truck.  The trucks have 18 foot, 26 foot, 53 foot bodies.  The bakery's logo is Script and I'm trying to decide on some serif fonts that are going to pop out and be easily read.  Does anyone have any suggestions  about what fonts might be suitable for a truck this large and that will still maintain a bakery feel.</p>
    <p>Thanks,</p>
    <p>Ray Macari</p><div class="imageWrap"><img src="http://typophile.com/files/dblogo.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/bwdblogo.jpg"></div><p></p>
