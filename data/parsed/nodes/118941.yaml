      <p>To come a decision, the answers to some questions might help:</p>
      <p>1) What is the reason for changing the BE texts rather than the AE texts? Is the majority of the texts written in AE, is it a North American publisher, is the book aimed at the North American market?</p>
      <p>2) Is this only about spelling? As you probably know, BE and AE differ on a number of aspects other than spelling. A text that uses AE spelling, but is riddled with BE expressions (or the other way around) is likely to confuse readers. How British or American do your texts ‘sound’, spelling aside? If their tone distinctly places them on one side of the Atlantic, only changing the spelling might be less advisable and really translating them feels overly intrusive to me.</p>
      <p>3) Could you get in touch with the authors of the texts? I would be displeased if anybody made any changes to a text of mine without notifying me prior to publication. Spelling is not a big deal and I would probably agree to minor changes, but I would want to be consulted. If you cannot reach the authors, I would base my decision on how important the linguistic form is for the texts in question. Before smoothing out the differences, you should be fairly certain that the authors did not feel strongly about using one particular variety of English.</p>
      <p>4) How important is consistent language use anyway? If you read a text for content, you’re likely not to even notice (or at least not be distracted by) minor spelling differences. Also, juxtaposing texts in slightly different varieties of one language is common in publications of all kinds. Consistent typographic formatting does feel important to me, consistent spelling: less so. Even authors writing in the same variety usually sound different and readers can easily deal with that.</p>
      <p>What would I do? Ask the authors. If that’s impossible, I would leave the spelling unchanged, but format all texts according to CMOS.</p>
