      <p>I think much would depend on the nature of the publication.</p>
      <p>For example, in a literary publication where the writers words are sacrosanct or where a sense of place is important to maintain, the spelling, idioms and regional idiosyncrasies would be important to keep.</p>
      <p>On the other hand, if the publication is, say, a collection of technical articles where clarity, brevity and uniformity are important, more editing for stylistic consistency would be warranted.</p>
      <p>Another thing to consider would be whether or not it's a one-off publication or a periodical. In the case of the latter, matching the style of other editions of the periodical might be important, whereas  that wouldn't be a concern in a stand-alone publication.</p>
      <p>The target audience also needs to be considered. Will they be primarily British, American or an international crowd more inclined to prefer one over the other?</p>
      <p>In any of these cases, I'd be consistent with punctuation. Swapping the position of the quote marks and periods depending on whether or not the writer is British, American, Norwegian, Kwakiutl, or whatever would simply look like a mistake, whereas maintaining the spelling of, say, color vs. colour would add to the regional flavor of the article.</p>
