    html: |-
      <p>You've noted several alternatives.</p>
      <p>The articles written in British English might be:</p>
      <p>1) Not modified at all;<br>
      2) Changed only in formatting to correspond to the Chicago Manual of Style;<br>
      3) Changed in spelling to be in American English spelling.<br>
      4) Translated completely into American English.</p>
      <p>Alternative (3) is not a good alternative, simply because if you don't do (4), a reader, seeing American English spelling, will expect American English idioms, and thus possibly fail to recognize British idioms found in the text.</p>
      <p>Alternative (2) may be acceptable; if it's a question of things like not including a space between a word and a colon following it (done in some British books) then avoiding such variations in formatting avoids a distraction, and won't confuse readers. (In fact, keeping variations in formatting risks confusing your <em>typesetter</em>. Of course, since these days your typesetter is likely to be, at worst, a secretary in your office, and not a Linotype operator at some remote location, this is less of a concern than it once was.)</p>
      <p>However, I'm not absolutely sure what you mean by "formatting".</p>
      <p>Alternative (4) probably should be out of the question. However, with one paper being in British English by a non-native English speaker, that the paper may require editing to be in correct English is a possibility I can't dismiss out-of-hand. And if you don't have a native speaker of fluent British English handy in Norway, translation to American English might be an incidental result of that process.</p>
      <p>As you can guess, I'm somewhat inclined to alternative (1). If the alterations involved in alternative (2) are all trivial, it is the best option, <em>not</em> alternative (1), but I can't be certain of that.</p>
