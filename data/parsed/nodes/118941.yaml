      <p>I was wondering if the CMOS didn’t have anything to say about this issue, so I looked it up in the most recent version. Here’s what it says (7.3):</p>
      <blockquote><p><strong>Non-US spelling.</strong> In English-language works by non-US authors that are edited and produced in the United States, editors at Chicago generally change spelling used in other English-speaking countries to American spelling (e.g., <cite>colour</cite> to <cite>color,</cite> <cite>analyse</cite> to <cite>analyze</cite>). Since consistency is more easily maintained by this practice, few authors object. In quoted material, however, spelling is left unchanged (see 13.7 [about permissible changes to quotations; R.]).</p></blockquote>
      <p>I think that spelling consistency is nice to have, but too unimportant to impose it (or it should be made clear from the outset that AE is expected and everything else will be changed to AE). In your case, I would ask the authors of the BE texts for their permission to change the spelling to AE. If there’s only one text that sounds British, I would try to live with the mismatch of idiom and spelling. Asking the author to ‘internationalise’ his English seems a bit too much to ask for. If you can’t obtain permission from all authors, I think you should <a href="http://www.youtube.com/watch?v=LOILZ_D3aRg" rel="nofollow">call the whole thing off</a>, typeset everything according to CMOS and know that you’ve done your best.</p>
