    <p>I’m working on a book that is made up of articles written by different authors. Some use British English, and some use American English. I’m following Chicago Manual of Style (with some exceptions: en dashes, and disregarding the period/comma-quotation convention). I wonder if it would be advisable to keep the British English spelling, but format it according to CMS, or to format the BE articles differently.</p>
    <p>I also have the option to translate BE articles. I think that may be the best solution, but I’m running into issue with some names. For example, one of the subjects discussed is something called the Green Education Programme. Would it be ok to change “Programme” to “Program” in this case? And what about quotes using the word “programme”?</p>
