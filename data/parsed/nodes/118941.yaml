      <p>Thank you for all input. In this particular case, the editor (or more specifically, the copy editor) hadn’t done a great job. Me and the editor discussed this issue. We consulted professionals and considered your advice. In the end, we decided to keep all proper nouns and quotes as they were written in the original sources, but changed BE to AE spelling for all other instances (again, with the help of a professional), with everything formatted according to CMoS.</p>
      <p>We would probably consider a different approach, if not for the fact that a few terms occured <strong>a lot</strong> of times in the text. “Programme”, for example, was used up to thirty times in one single page.</p>
