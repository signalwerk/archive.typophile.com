      <p>va bien compadre!<br>
      es verdad que noe s Comunismo Furioso, pero no todo el comunismo es furioso.<br>
      Recordemos las peñas, los niños jugando alrededor de victor jara, o las vacaciones populares de la "villa feliz". Yo creo que hay cierto positivismo incluso en los muralistas. Y lo más importante, que sea inspirada no quiere dcir que tiene qu ser textual.</p>
      <p>Ahora coincido en que hay desajustes importantes en el interlineado, cierta falta de equilibrio. El ojito de la "a" es un poco chico y los hombros de las "n" es poco pronunciado en tamaños pequeños. Eso veo asi a simple vista.</p>
      <p>se añade a mi firma:<br>
      “only when politicians will be dead, people will be happy”<br>
      • jko •</p>
