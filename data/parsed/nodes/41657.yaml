    <p>Hello everybody,</p>
    <p>This is my typography "muralist," inspired by the work of posters and murals for 70 years in Chile. It is a font dysplay to short texts. I worked from sketches by hand, illustrator and then fontlab(I am learning to use ,XD).</p>
    <p>He worked in relation to how the glyphs together and distances reading, but trying to keep the manual aspect of the muralists, it should work in large sizes larger than 18 pts. I hope you enjoy!</p>
    <p>I can give your opinion</p>
    <p>Jorge Cisterna from PuertoFonts<br>
    <a href="http://www.flickr.com/photos/jorgecisterna/" title="http://www.flickr.com/photos/jorgecisterna/">http://www.flickr.com/photos/jorgecisterna/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/prueba5_4833.jpg"></div><p></p>
