      <p>Thanks for all the comments<br>
      <strong>Eeblet</strong><br>
      If you agree, that the Caps are more developed because they nature of this typography into the caps, I am working on lower case <strong>c</strong> and <strong>e</strong> to differentiate better. Spacing I have not even worked.</p>
      <p> <strong>degregorio</strong> (en español :)<br>
      Excelente comentario, creo que hay hartas tipografias por que que existen varios referentes y distintas interpretaciones. Coincido a que nadie rescatado la furia de estos carteles,  ese es un concepto complejo al parecer que se tiende aminorar.<br>
      Con respecto a muralista no es un letra furiosa, para nada, de hecho es un letra que alza la voz en un tono mas de concenso que de grito furioso. Por supuesto no es como para escribir una tarjeta de felicitaciones, sino para titulares o logotipos con caracter idealista.</p>
      <p><strong>Ricardo Cordoba:</strong><br>
      Thanks, more progress soon.</p>
