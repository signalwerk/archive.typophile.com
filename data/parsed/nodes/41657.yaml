      <p>Designs like this make me want to brush up on my Spanish and move very, very South of here. It gives me a warm feeling that makes me want to be at a beach party with a daiquiri in one hand and a piña coloda in the other.</p>
      <p>But there is an imbalance created by uneven horizontal weight distribution, particularly in the majuscules, that makes many of these letters appear to lean left. There is also an illusion in some letters, such as <strong>d</strong> that makes the right vertical edge appear too steep, some optical correction is needed</p>
