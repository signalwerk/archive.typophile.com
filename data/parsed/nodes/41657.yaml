      <p>hmmm</p>
      <p>This is the fifth font I see that rescues the communist spirit of Chile in the 70's.<br>
      These fonts are all very good and beautiful, but none of them have the power to say "only when politicians will be dead, people will be happy" (with a gun and a flower).</p>
      <p>To understand this lettering style you have to place yourself inside the mind of the person who made these signs (mono gonzález), and draw this letter forms hating fascism, social injustice and racism.<br>
      If you can write "happy valentine's day" with this typeface, then something's going wrong with it.</p>
      <p>Perhaps you should ask yourself 3 questions:</p>
      <p>-why my font doesn't have the spirit of the political fury of communist 70's?<br>
      -does "muralisa" have what it takes to give answer to the forms of the signs painted by "brigada ramona parra"?<br>
      -and most importantly: where I can use this font?</p>
