      <p>It says that the first edition was 1950. I was thinking that the covers might have changed, but it looks like not. In any case it must have been Hans Schmoller who did the design--St. Bride had an exibit on him last spring at Typotechnica. But a similar kind of thing, not exactly the same, was done by Tschichold, as I see in the Rauri McLean bio on him. </p>
      <p>Wonderful stuff, the whole run of years of those Penguins. </p>
      <p>I guess what always attracted me particularly were the good looking covers that were purely typographic--no photos. These had a certain calm, literary quality that was lovely. </p>
      <p>They weren't afraid of white space, or of type.</p>
