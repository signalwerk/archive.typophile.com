      <p>He must have been my favourite designer when I was growing up, but I didn't know it till I read about him in Eye a few years ago.</p>
      <p>First, he designed "Man Must Measure - the Wonderful World of Mathematics" in 1955, which was a book that had a big influence on me at an early age. It didn't seem like maths at all, it was more like a colorful history of the world that was all pictures and diagrams, which I still remember, like the sun shinging down a well at the equator at midday, or how an abacus worked. I also recently discovered that Lancelot Hogben, who wrote it, was a Marxist, propagandist for progress -- those guys must have gotten inside my head. And then I was really into poetry when I was a teenager, and had all "The Penguin Modern Poets" with Facetti's covers. Funny, the covers were very mod, but the guts of the text was set in Monotype Bembo, a legacy from Tschicold's day.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Roget.jpg"></div><br>
      1964. Conceptual art.<p></p>
