    html: <p>Alan Powers, in his wonderful <em><a href="http://www.amazon.com/gp/product/1840004215/qid=1145016501/sr=2-1/ref=pd_bbs_b_2_1/102-5315597-7931364?s=books&amp;v=glance&amp;n=283155" rel="nofollow">Front Cover</a></em>, has a spread that features some Penguin poetry books from the same period, also using pattern papers on the covers... Apparently they are from the Hans Schmoller era (post-1949). Powers also mentions that a German designer, Elisabeth Friedlander, created the pattern for one of the poetry covers he shows in his book, and adds that she began working for Penguin in 1948.</p>
