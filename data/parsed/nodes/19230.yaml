  html: <p>The <em>Guardian Unlimited</em> has <a href="http://books.guardian.co.uk/departments/artsandentertainment/story/0,,1752233,00.html" rel="nofollow">Rick Poynor's article</a> on the man who was art director for Penguin Books between 1961-1972, along with <a href="http://books.guardian.co.uk/gallery/0,,1752252,00.html" target="_blank" rel="nofollow">a gallery of some of his covers</a>.</p>
