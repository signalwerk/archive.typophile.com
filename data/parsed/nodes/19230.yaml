      <p>Hi, Sara, and thanks for the info. I started the thread, so I guess I should correct it. :-)</p>
      <p>(And from the evidence of the first few comments in this thread, I started out using the date of 1926, then had it changed to 1928 because of what I read in the British newspapers! Now I'm going to change it back.)</p>
      <p>The Guardian's obituary still says 1928, if you look it up. The <a href="" rel="nofollow">Times obituary</a> also uses the 1928 date.</p>
      <p>I've just done a search on Google and found some articles that give 1926 as Facetti's date of birth:</p>
      <p><a href="http://findarticles.com/p/articles/mi_qn4159/is_20060416/ai_n16166320" title="http://findarticles.com/p/articles/mi_qn4159/is_20060416/ai_n16166320">http://findarticles.com/p/articles/mi_qn4159/is_20060416/ai_n16166320</a></p>
      <p><a href="http://en.wikipedia.org/wiki/Germano_Facetti" title="http://en.wikipedia.org/wiki/Germano_Facetti">http://en.wikipedia.org/wiki/Germano_Facetti</a></p>
      <p>The Wikipedia article helpfully lists "sources citing 1926 as Facetti's year of birth, not 1928"! This led me to the <a href="http://www.designmuseum.org/design/penguin-books" rel="nofollow">Design Museum's page on Penguin Books</a>:</p>
      <p>"The rigorous application of colour, grid and typography in those early paperbacks instilled Penguin with a commitment to design from the start. The company then strengthened its design ethos under the direction of the German typographer Jan Tschichold (1902-1974) during the 1940s and the Italian art director Germano Facetti (1926-) in the 1960s."</p>
