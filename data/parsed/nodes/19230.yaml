      <p>Hello folks, I’m new here (first post!) but I couldn’t resist commenting on the passing of Germano Facetti. Like Nick Shinn, it was his cover designs for Penguin, along with Penguin’s wonderful taste in typography, that awoke me to a love of books when I was a teenager. His cover designs for the Modern Classics series also introduced me to a lot of painters that, at that time, I hadn’t come across. Under his art direction Penguin seemed to be a repository for the best of European culture in the 20-th Century. I had — and still have — most of the Modern European Poets series and his Modern Classics series.  </p>
      <p>I think it was under him that Penguin achieved true greatness, emerging from the austerity of the war years to present books as a passport to enlightened values. After 1980, or thereabouts, British book publishing lost its way and has never quite recovered, imho. So much that is produced there looks shoddily conceived and executed. But Germano Facetti was a light that shone in my teenage years and I owe him a debt of thanks for that.</p>
      <p>Cheers to you all — this is a wonderful forum for the lover of type and print.</p>
      <p>Eluard</p>
