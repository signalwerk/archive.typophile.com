      <p>I think languages are harder to revive than scripts, and I'm sure some people also thought the Hebrew langauge (which was dormant* for a very long time**) was "impossible to revive"... although I admit that the tenacity of the Hebrew <em>script</em> probably helped there. Really though, if Kokborok is still alive reviving Koloma would be that much easier. Build it, and they will come - make the font, and use it - remember Mesrop Mashtots!</p>
      <p>* In fact an <em>idea</em> (which is what a script is) can never die.</p>
      <p>** <a href="http://en.wikipedia.org/wiki/Revival_of_the_Hebrew_language" title="http://en.wikipedia.org/wiki/Revival_of_the_Hebrew_language">http://en.wikipedia.org/wiki/Revival_of_the_Hebrew_language</a></p>
      <p>hhp</p>
