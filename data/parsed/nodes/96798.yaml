    html: |-
      <p>@hrant:<br>
      <cite>In fact an <strong>idea</strong> (which is what a script is) can never die.</cite></p>
      <p>A script is a specific human invention, not a basic discovery of a law of nature.</p>
      <p>The value of pi, the three laws of thermodynamics (although not their specific expression), Maxwell's Equations, and so on, could all be rediscovered were they to be forgotten.</p>
      <p>The text of the plays of Shakespeare, the score to Beethoven's Fifth Symphony - if, somehow, all record of these things were to be erased, they would be lost for ever.</p>
      <p>The same <em>can</em> happen to an alphabet.</p>
      <p>Fortunately, though, the Borok language, Kokborok, is still very much alive. The language may previously have been known as Bara, or by other names, and so the Koloma script may indeed have been recorded as well, even though the record may be awkward to find.</p>
      <p>EDIT: Further searches have indicated that indeed the script is believed to be lost, and to have only been used in the Chronicle of the Borok Kings, lost in its original language.</p>
      <p>However, <a class="freelinking external" href="http://www.indianetzone.com/10/tippera_tribe.htm" rel="nofollow">this site</a> claims that a group called the Tippera uses the Koloma script in the present day.</p>
