    html: <p>But how can you revive a script without knowing what it looked like? I gathered that no examples of the script may have survived (the chronicles of the Borok kings were supposedly written in Kokborok in the Koloma script, but we only know about the later Sanskrit translation). In that case, the Koloma script would be irretrievably forgotten.</p>
