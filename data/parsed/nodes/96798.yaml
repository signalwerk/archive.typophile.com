      <p>Of course you're right about that. How old do you think the most recent Koloma inscription would be? In the case of Armenian we don't know exactly how Mesrop Mashtots designed our alphabet, but we do have inscriptions from about a century afterwards (beginning of the 7th century) and lucky for us it was never interrupted.</p>
