      <p>Who: "Remember, for economic reason, not everyone can count and sue every person using knock-off fonts in their personal fan works."</p>
      <p>But the relevant parties are saying that this particular case of knock-off is NOT illegal and they have no basis to sue.</p>
      <p>This is often true. Knock-offs can be unethical, or just poorly done, without being illegal. In these cases, absent a violated contract or the like, there is usually no basis to sue the offending party.</p>
