      <p>Sorry for late response, but I was busy with school works and other factors.</p>
      <p>Apparently, there are <a class="freelinking external" href="https://web.archive.org/web/20150124120725/http://www.bbc.co.uk/news/technology-20629245" rel="nofollow">ongoing criticisms about this game regarding its economy system</a>. But that's another problem.</p>
      <p>I saw someone intervened in this thread with debate on originality, inspiration and plagiarism. At first, I couldn't decide which side I should take. Now, at least one thing is clear: We can tell whether it is a rip-off, knock-off, plagiarism, copyright infringement, parody or homage by looking closely at it and finding its background and context.</p>
