      <p>Given the description of the situation in the initial post, I'm surprised to learn in a later post that Gameloft did not do anything actionable.</p>
      <p>That implies, at the very least, that the font they are using is <em>not</em> a mod of the font from Harold's fonts in question; that it's freshly drawn, even if it closely resembles the other font. Font software is well protected by copyright law, even if font designs are only weakly protected in the U.S. (as opposed to not protected at all: there were changes in the law recently).</p>
      <p>However, on re-reading the thread, it appears that Gameloft <strong>ought</strong> to be in deep trouble with <em>Hasbro</em>, because they've licensed the My Little Pony product, and they're not appropriately protecting its brand identity; by not using the official font specified, they're making a licensed product that is not, in this one respect, however minor, differentiated from what a knock-off counterfeiter could do.</p>
      <p>And that would remain true even if Celestia Medium Redux is an entirely legitimate typeface in the same genre as Generation B, and not a rip-off or plagiarism.</p>
      <p>Now, there's also the question of violating the trademark of the original Celestia Medium, as it may not have been withdrawn long enough ago for it to be inactive...</p>
