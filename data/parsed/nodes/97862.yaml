      <p>A quick Google search finds that Gameloft has been criticized for copying other games, and that some employees have complained of 100-hour work weeks. </p>
      <p>Many game companies are under a lot of economic stress because the rise of small game apps for smart phones and tablets. Used be that computer games routinely sold for fairly high prices; now people go app stores and buy games for a few bucks each. So companies may feel the need to cut corners to keep prices down.</p>
