  html: |-
    <p>That's right. Gameloft is using Celestia Medium Redux, a fan modification of copyrighted Generation B. Someone needs to stop them.</p>
    <p><a class="freelinking external" href="https://web.archive.org/web/20150124120725/http://www.haroldsfonts.com/genB.html" rel="nofollow">Generation B</a>, made by <a href="/web/20150124120725/http://typophile.com/wiki/Harold%27s%20Fonts" class="freelinking" rel="nofollow">Harold's Fonts</a>, is inspired by film logos and posters between 1950s and 1960s. It is one of the official fonts of Hasbro's current <em>My Little Pony</em> line up of toys, media franchise and official merchandises. It's also in the subtitle part of the logo of the current generation's well-known cartoon show, <em><a class="freelinking external" href="https://web.archive.org/web/20150124120725/http://www.hasbrostudios.com/Our-Shows-Folder/My-Little-Pony" rel="nofollow">My Little Pony: Friendship is Magic</a></em>.</p>
    <p>With the rise of the cartoon's fandom, some fans tried to create their version of Generation B. One user created a thing called <a class="freelinking external" href="https://web.archive.org/web/20150124120725/http://fav.me/d3dqa8d" rel="nofollow">Celestia Medium</a>, but soon gave up after some concerns. Then, another user came up with small letters and Greek/Cyrillic letters, and named it <a class="freelinking external" href="https://web.archive.org/web/20150124120725/http://www.mattyhex.net/CMR/" rel="nofollow">Celestia Medium Redux</a>, the font in question.</p>
    <p>Apparently, Gameloft is using Celestia Medium Redux in their upcoming official <em>My Little Pony</em> mobile game, instead of Generation B. </p>
    <p><iframe width="480" height="360" src="https://web.archive.org/web/20150124120725if_/https://www.youtube-nocookie.com/embed/AlBInHiJ-74?rel=0" frameborder="0" allowfullscreen=""></iframe><br>
    <img src="https://web.archive.org/web/20150124120725im_/http://3.bp.blogspot.com/-U6RNeDxSFpA/UImE1HdPf5I/AAAAAAAA-OY/M4hbqqJ6OU8/s1600/1.JPG" width="480"><br>
    <img src="https://web.archive.org/web/20150124120725im_/http://blog.gameloft.com/wp-content/uploads/2012/10/MagicWings_v3_SMALL.jpg" width="480"><br>
    <img src="https://web.archive.org/web/20150124120725im_/http://sphotos-f.ak.fbcdn.net/hphotos-ak-snc6/201110_536522689698506_1939807679_o.jpg" width="480"></p>
    <p>We can't blame some individuals using knock off fonts on their unofficial, personal fan works because counting all of every single person who used it is impossible and suing them is technically a waste of time and money (unless you are from Disney). But this is a different matter. It's the official merchandise. Gameloft is using a fan-made font that (technically) infringed copyrighted font design (or, in the U.S. terms, a digital font file that might have altered from the original file) in an official game, instead of the original and official one! It's more like the developers involved didn't know anything about the font (If it's not, this is more serious problem!). </p>
    <p>Now, someone needs to stop Gameloft from using Celestia Medium Redux before they officially release the game on 8 November, and put them on the pressure to change the font. But honestly, I don't know what should I start with as a third person.</p>
    <p>Before you go, here is opinion from a professional-skilled artist who likes <em>Friendship is Magic</em>:</p>
    <ul>
    <li><a class="freelinking external" href="https://web.archive.org/web/20150124120725/http://fav.me/d3lqxoo" rel="nofollow">"Why You Shouldn't Use The Celestia Medium Font"</a></li>
    <li><a class="freelinking external" href="https://web.archive.org/web/20150124120725/http://fav.me/d41ylps" rel="nofollow">"Why You (Still) Shouldn't Use Celestia Medium"</a></li>
    </ul>
