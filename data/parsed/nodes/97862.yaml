      <p>Charles, maybe start by actually reading the posts I made just to this thread. And then resist to urge to prop up a straw man to hurl things at.</p>
      <p>Art is selfish, and to me only interesting to the artist. Craft exists to serve others, which is exactly my cup of tea. But seeing Craft as some sort of soulless drudgery is exactly what the flaming artistes want.</p>
      <p>HOWEVER: There is no pure Art or pure Craft; one might imagine an axis with those extremes, with any creative act sitting somewhere on that axis. So any creative act draws <em>inspiration</em> -in a traditional artistic way- from its environment; this does not equate to <em>plagiarism</em>, by any level-headed definition of those terms. Khaled's view comes off as conveniently absolutist. Typical so-called "open-source" agenda-driven obfuscation. He wants me to quote a percentage?! That's what I call shallow. And really, "if she thought it was wrong she wouldn’t have done it in the first place"?! What planet are we on again?</p>
      <p>I myself revel in shades of gray, and to me things that are a much darker shade of gray deserve more corrective effort. Duh.</p>
      <p>BTW: <a href="http://typophile.com/node/99015" title="http://typophile.com/node/99015">http://typophile.com/node/99015</a></p>
      <p>hhp</p>
