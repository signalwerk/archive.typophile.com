      <p>Hi!</p>
      <p>As the guy who "started a crusade of FUD," (an interesting way of putting it) some more information about the history of Celestia Medium might be helpful.</p>
      <p>Back in the early days of the fandom, the only people who knew of / used Generation B in their work were me and a few others who actually took the time to figure out what font was being used. There was no knockoff version available at the start.</p>
      <p>"if she thought it was wrong she wouldn’t have done it in the first place."</p>
      <p>She didn't know it was wrong because she didn't know about Generation B or that she was ripping someone off in the first place. Sometime in spring 2011, PurpleTinker developed the Celestia Medium font based on a screenshot of Generation B (that was not labeled as such). She traced a PNG file of the Generation B character set that was posted on Equestria Daily . The first version of Celestia Medium was a literal trace of Generation B, but all of the metrics and proportions were screwed up. It was also missing the uppercase and special characters. The actual glyphs were fairly close to Gen B (it took a smart eye to notice specific glyph differences), but the glyph sizes were all normalized and the baselines too. This reduced Celestia Medium to a very block-like face, resulting in long strips of letters that had none of the whimsy or motion of Generation B. They were more difficult to read as well. A clear tell of Celestia Medium was the letter Os: they were the same size as all the other glyphs. Compared to the toy boxes, promotional materials, etc with used Generation B, it looked quite ugly. It sticks out like a sore thumb compared to the real deal.</p>
      <p>I wrote the first "Why you shouldn't use Celestia Medium" in June 2011 based on the font that existed, and PurpleTinker agreed with me that people should use the genuine article. She was unaware of Generation B itself, having traced that PNG of the rip. There's no animosity between us on that, and she handled it about as classily as someone could.</p>
      <p>When she took the font down, MattyHex started making Celestia Redux based on the original font file for Celestia Medium and started tweaking the glyphs to make it slightly different (and worse) than Generation B. I wrote the second "Why you still shouldn't..." bit in September 2011 right around the time that the Redux version came out. Since then, MattyHex has expanded the feature set of Celestia Redux considerably. He's added many special characters that didn't exist in GenB, and he also added a new set of lowercase glyphs (relegating the copies of Generation B's lower case to CR's upper case). The lower case makes it into something completely unrelated, and it's not a very readable face either. So Celestia Redux at this time has morphed into something quite different than Generation B, but people still try to use it as a substitute. Its uppecase still fares poorly compared to Generation B, especially now that he's specifically changed the uppercase glyphs to look kind of like Generation B but not exactly. MattyHex doesn't have the excuse that PT did; he made the Redux version specifically knowing about Generation B to create a knockoff version.</p>
      <p>It's one thing for random fanartists to use Celestia Redux once or twice, but it's very tacky and a bit low for Gameloft who has an official license of the game to use a fan knockoff font. It's a pure case of cheapness and greed, which is not unsurprising given their other games and business practices. Other Hasbro licensees continue to use Generation B. This is not the first time Gameloft has appropriated fanworks; they've used several pieces of fanart (likely acquired from google image search) without contacting the artists as assets for the My Little Pony game and their advertising. As far as I know, this is the only case of Celestia Medium slipping into a licensed product. Not even the fan created licensed shirts on WeLoveFine use it.</p>
      <p>On the usage of Celestia Redux in the game itself, they shouldn't have used it (or Generation B, for that matter) for all of that body text. Something more readable should have been used instead. I believe there is a body copy font that Hasbro uses on the toy boxes, but its specific name is escaping me at the moment. Generation B would have been fine for titling, but Celestia Redux is used for almost everything in the game, and it's very difficult to read because of it. It's true that Font Bros. basically has no recourse, because of the way the laws work here in the states (Which I'm sure many are aware of) and their response here details it pretty well. It's unfortunate that nothing can be done, but that's the way it is.</p>
      <p>At the end of the day, my primary objection to Celestia Redux these days is 1. that it's ugly and 2. I think it's a shame that Harold is not getting his fair share from the unexpected popularity of ponies. Tons of people out there (that are not Hasbro) are making a lot of money off the pony fandom these days for things that are less work than fonts, and there's a lot of Celestia Redux being used in fanart or projects that are used/sold for profit. I just think people should do the right thing and pay the man his due.</p>
