      <p>Thanks for your post on this and Harold and the Font Bros are well aware of this situation . . .</p>
      <p>At the end of the day, legally there's really nothing we can do . . . A close comparison would be that a client specified Futura for their App and rather than buy Linotypes, they bought URW++s or Paratype's . . .</p>
      <p>We know the folks from Hasbro have properly licensed the font and specify it in all the styles guides for the MLP product line but do not provide it to vendors.</p>
      <p>Oddly, Gameloft DID contact us and we negotiated a license for them for this use, but then radio silence until we received word about their new game using a knock-off version of Harold's original font.</p>
      <p>Again, legally they haven't done anything wrong but of course we're disappointed they chose the course of action they did.</p>
