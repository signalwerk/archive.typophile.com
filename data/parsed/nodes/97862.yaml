      <blockquote><p>But the relevant parties are saying that this particular case of knock-off is NOT illegal and they have no basis to sue.</p>
      <p>This is often true. Knock-offs can be unethical, or just poorly done, without being illegal. In these cases, absent a violated contract or the like, there is usually no basis to sue the offending party.</p></blockquote>
      <p>Hmm... This is becoming a bit more complex problem than I thought. What should be the attitude to the knock-off/fake/unlicensed fonts, especially when major company making an officially licensed product?</p>
      <p>Simply getting a license will cause no problem, and it will bring original and quality fonts. But it costs so much if it's too expensive, and in major cases, using the font for different purposes may require to buy another licenses.</p>
      <p>On the other hand, knock-offs are technically not illegal, only a little different from the original, and it will help reducing costs if it is free. But someone will notice it anyway, and even if there is no basis to sue, some will still tackle and complain. Besides, some of them has inferior quality than original.</p>
      <p>This is getting more puzzled...</p>
      <p>Anyway, despite not being illegal, it still shows how terrible Gameloft is at choosing fonts. And still, the people at Font Bros. are disappointed with what Gameloft have done.</p>
      <p>I think that, normally, big major companies with such scale as Gameloft would just end up buying a proper license. Why did they act like... Um...  'Hey, I have no money for this.'? (Just my shallow idea, though.)</p>
      <blockquote><p>On the other hand, “Celestia,” used in the context of typefaces and fonts, is a registered trademark of Mark von[sic] Bronkhurst.[sic] So, he might have a legitimate case to pursue against the maker of Celestia Medium Redux, if he cared to — at least to change the name, if not to cease distribution.</p></blockquote>
      <p>This is kinda interesting. In the universe of the current line up, Princess Celestia is the co-ruler of the "magical land of Equestria" who raises the sun, along with Princess Luna who raises the moon. That is where the name of the original Celestia Medium knock-off font came from, and I guess the maker of that font may have not know anything about it. (And yes, it has absolutely nothing to do with Mark van Bronkhorst's <a class="freelinking external" href="https://web.archive.org/web/20150124120725/http://www.mvbfonts.com/mvb_celestia_antiqua/" rel="nofollow">Celestia Antiqua</a>)</p>
