      <p>A thread in which I recently participated concerned a typeface that someone expressed shock was still being offered for sale, despite being claimed to be an imitation of another typeface. In that case, it seemed clear to me that the "imitation" was merely a typeface belonging to the same genre; similar, but in no way a rip-off.</p>
      <p>Looking into this case further, I see that here nothing of the sort applies. The two faces in question were clearly based only on the source typeface, not its sources - and they are, despite that, poor quality copies.</p>
      <p>So, while I might still question whether there is any illegality involved, I definitely do agree that Gameloft ought not to be using a typeface of that sort instead of the real thing. In fact, if they <em>can't</em> negotiate reasonable terms for the use of the real thing (as they would be using it to create artwork, not to let users type words in the game, I presume, they wouldn't need to embed the font and enter into the stratospheric realms of that sort of licensing... but maybe they would need to embed it, say for scores and the like - I can't <em>believe</em> they're doing this to save $20) they would be better off buying a copy of Fontographer, and designing their own similar face.</p>
      <p>Which could consist of one thing that Generation B, the real thing, seems to be conspicuously lacking for a face of this type... alternate characters.</p>
      <p>(EDIT: Visiting the Harold's Fonts page, I see I was unfair; they do have "big" and "small" alternates for all the letters, at least.)</p>
      <p>A face could have the same "feel" as that one but with different letters large, small, wedged left, wedged right, displaced upwards, displaced downwards, and so on and so forth.</p>
      <p>Incidentally, I thought I'd look around to see other faces that were similar, but I couldn't get closer than faces like Crazy Loot BTN, Mother Hen AOE, Mister Rii PB, MVB Hotsy Totsy, Perfect Magic Bold, and Harry Plotter, which were still all quite different.</p>
      <p>EDIT: Although I didn't see any real match, when I saw the full actual face on the Harold's Fonts page, instead of making me think of My Little Pony, it made me think of Big Daddy Ed Roth - whose name I keep having trouble remembering.</p>
