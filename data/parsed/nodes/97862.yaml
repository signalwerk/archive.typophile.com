      <p>Thanks for your answer. Seriously, why Gameloft choose that way? Nevertheless, we should keep spreading this news everywhere and put Gameloft folks on the pressure until they entirely change that font to a proper one. Remember, for economic reason, not everyone can count and sue every person using knock-off fonts in their personal fan works. But big and well-established company like Gameloft using it in that officially licensed game? This is more than a serious problem.</p>
      <p>Remember the <a class="freelinking external" href="https://web.archive.org/web/20150124120725/http://www.underconsideration.com/brandnew/archives/with_copyright_protectors_like_these_who_needs_enemies.php" rel="nofollow">Hadopi logo incident</a>? Although that would be a slightly different case from this because it was about logo designers using a legal font intended for exclusive corporate use in a logo of another, unrelated French government agency for copyright protection, people have noticed the infringement and soon, after lots of complaints and pushing, the agency had to change the font to a properly licensed one, before making another change in years later.</p>
