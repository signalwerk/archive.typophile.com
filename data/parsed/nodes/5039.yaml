  html: "<p>Calling all Typophiles, I need your help. <br> <br>The company I work for is currently examining its style guide (or lack thereof), which is opening up possibilities for changes. <br> <br>Currently we use ::shudder:: Condensed Helveticas for titling/ display and Times/ TNR for text. The Helveticas aren't up for debate, but the text face is. <br> <br>We're a Dutch company, so I'm thinking that along with all of the obvious arguments against Times, I'd use the origin of the type/ designer as secondary leverage and a way to narrow the field a bit. <br> <br>So, I know some of the foundries, such as DTL and TEFF, and some designers such as Majoor and Smeihjers, but I don't have a voluminous knowledge of Dutch Foundries, designers, and serif faces. What I need is a list to start examining examples from so I can hit them with a list of options that I've culled from a greater one. Any help is very, very much appreciated! <br> <br>Thanks for any suggestions. <br> <br>PS: Wim Crouwel might be a bit too avante garde for our needs.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
  html_clean: "<p>Calling all Typophiles, I need your help. <br> <br>The company I work for is currently examining its style guide (or lack thereof), which is opening up possibilities for changes. <br> <br>Currently we use ::shudder:: Condensed Helveticas for titling/ display and Times/ TNR for text. The Helveticas aren't up for debate, but the text face is. <br> <br>We're a Dutch company, so I'm thinking that along with all of the obvious arguments against Times, I'd use the origin of the type/ designer as secondary leverage and a way to narrow the field a bit. <br> <br>So, I know some of the foundries, such as DTL and TEFF, and some designers such as Majoor and Smeihjers, but I don't have a voluminous knowledge of Dutch Foundries, designers, and serif faces. What I need is a list to start examining examples from so I can hit them with a list of options that I've culled from a greater one. Any help is very, very much appreciated! <br> <br>Thanks for any suggestions. <br> <br>PS: Wim Crouwel might be a bit too avante garde for our needs.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
