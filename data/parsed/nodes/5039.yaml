    html: <p>This satisfied consumer thinks that the Dutch Type book is fantastic! I just picked it up last week in New York and I've been singing its praises to all my designer friends ever since. It's got the rare combination of a substantial amount of text (that is actually interesting to read) and a ton of great images. It's so good, it made me consider going to a grad program in the Netherlands. Or that might just be the current economy. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
