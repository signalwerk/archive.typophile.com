      <p>I find it pretty accurate to measure from the top of the tallest ascender to the bottom of the lowest descender.. For most typefaces using the "f" and the "g" is pretty accurate.</p>
      <p>A quick way you can measure these within an application is to type an "fg" convert to paths and read the vertical measurement of the pair.</p>
      <p>Of course built in leading is often part of the measurement (thus 12 pt times new roman is actually only 11.8pt measuring the "fg"</p>
