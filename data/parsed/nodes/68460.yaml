      <p>There is a certain amount of space built into most fonts. That is, if you take the "em" as the height from one line to the next, with no leading, then the distance from the highest ascender to the lowest descender will be less than the em. Because of this bit of built-in vertical spacing, there is no way from an example to be totally sure about the point size from a printed sample. </p>
      <p>The actual distance from one baseline to the next will be the point size of the type + the leading, but how it is distributed between those two you can't be precise about without having the type in an application.  </p>
      <p>And yes, x-height is a very important design variable, though there are lots of others.</p>
