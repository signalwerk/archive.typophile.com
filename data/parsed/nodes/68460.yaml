      <p>When comparing types for a similar function I settled on equalising the x heights of the fonts I was looking at. The size of the type is in itself arbitrary - it is how the forms make use of the space is what counts. </p>
      <p>Q. Why the x-height?<br>
      A. because this is where the type is most complex. Capitals are much less complex, are allot more geometric and have an easy-life compared with the lowercase in  the same font because they have more vertical space in which to accomplish their task.</p>
      <p>With the x-heights equalised you can go about making direct comparisons.</p>
