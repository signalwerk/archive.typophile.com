      <p>Nope, it isn't that easy. Type is a measurement of height, but you can't just measure characters. The actual dimension is the height of the piece of metal that the type sat on, back in the days when it sat on a piece of metal. </p>
      <p>In a newspaper, the best way is to measure from the bottom of one letter to the bottom of the letter in the line below (assuming no descenders). But even that can fail, because sometimes additional leading (or space between lines) is added. Very few newspapers used leading, however.</p>
