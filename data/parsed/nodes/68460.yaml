    <p>Hello, </p>
    <p>I'm investigating the state of modern newspaper design and the overwhelming effect screen based devices are inflicting on the newspaper industry In the developed world. I'm analysing a few papers from around the globe, and i'm looking rather intensely at the content on each page and how many words in each column etc. But I am also trying to get a rough idea of what point sizes certain papers or pages are set in. I wasn't sure if the point size of a face was the width and the height of a typeface ?? e.g Exchange for The Wall Street Journal, Measured the height @ 6 pt and found on average 4 letters per Pica, and just added them together and divided like a ratio, to get 8 pt?? Is this how it is done or am I over complicating things?? lol</p>
    <p>I would be very grateful for any feedback?</p>
    <p>Many thanks</p>
    <p>James Dalgarno</p>
