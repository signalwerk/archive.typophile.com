      <p>If you identify the font being used (and have the same font) you can print your best guess and see if they match. Adjust accordingly.<br>
      This would be easiest to do in Adobe Illustrator- measure any one letter, make a box in illustrator the same height, type the letter then drag till it matches the height exactly- look at the point size.</p>
      <p>I mean, this is messy, but it should be pretty accurate.</p>
