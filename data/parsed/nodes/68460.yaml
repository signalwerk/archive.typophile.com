      <p>While there are different specs. for vertical metrics for Windows and Mac in the font, what makes the final determination of the line gap is the software, reading those specs. For example, I believe that in MS Word they normally add 20% in leading beyond the point size. I think this is true whether Word is operating on a Mac or Windows. And in InDesign, it will set exactly the leading you specify, whether on Windows or Mac. </p>
      <p>The specification of vertical metrics and their relations to different apps is very messy, but I believe it comes down to that for these most widely used programs.</p>
