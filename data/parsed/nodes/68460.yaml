      <p>James,<br>
      There are a few things you can empirically measure, and I suggest you start with these: <a href="http://typophile.com/node/12028" rel="nofollow">x-height</a>, <a href="http://typophile.com/node/20273" rel="nofollow">cap height</a>, <a href="http://typophile.com/node/12484" rel="nofollow">leading</a> by which I mean the distance from one baseline to the next, and line length in characters or words (on average). Keep in mind though that <a href="http://typophile.com/node/43658" rel="nofollow">type size</a> is set by a number of factors, and at output is commonly not in whole point units. It would not be uncommon to see a newspaper's body copy set at 8.9 pt with 11.36 pt leading. (Units pertaining to the baseline grid are {more often than type size} easily divisible whole point units, such as 4, 6, or 8 pt, though you can't count on this predictably to be the case.)</p>
