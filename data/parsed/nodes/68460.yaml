      <p>Your initial concept of "characters per area" is a good benchmark, far better than anything to do with type size, which is meaningless from a statistical point of view.</p>
      <p>Having said that, whether the character count is for body text or decks/infographics/callouts &amp;c. is relevant.</p>
      <p>So perhaps a statistic on the percentage (area) of type that is text, headlines, or "other" in a particular paper is necessary.</p>
      <p>But then you would need to factor in a White Space coefficient....</p>
