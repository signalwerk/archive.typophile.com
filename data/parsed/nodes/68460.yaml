      <p>@BeauW:<br>
      <cite>If you identify the font being used (and have the same font) you can print your best guess and see if they match. Adjust accordingly.</cite><br>
      I have found, though, that at least on Windows systems, with some exceptions, almost all fonts have a considerable amount of built-in leading, much more than was the case with metal type.<br>
      Basically, this is so that results, without specifying leading, for single-spaced text in a printers' typeface will, instead of looking like type set without any leading, look like single-spaced typewriting.<br>
      Maybe this isn't a property of the font itself, but of word processors, however I am aware of some fonts that provide a true unleaded appearance in the same word processors that do this with most fonts.<br>
      So playing with a Times Roman font on your computer to match the point size of Times Roman text printed with metal type is going to give erroneous results.</p>
