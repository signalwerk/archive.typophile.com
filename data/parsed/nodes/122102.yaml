    <p>Red Rooster has a font that it calls Pickworth Old Style<br><img src="/sites/default/files/old-images/PickworthOSRRsm_6077.jpg"> Larger scale character set attached. More info<br><a href="http://www.identifont.com/show?2DOO">http://www.identifont.com/show?2DOO</a><br>
    When we look at the glyphs we see the multitude of nodes that is characteristic of auto-traced letters.<br><img src="/sites/default/files/old-images/PickworthOSRR_R_4974.jpg"><br>
    I appreciate that the original might have been a "rugged" design, that today we would call antique, grunge or distressed.<br>
    I don't recognize the font by its original name from about a century ago. My searches for the term "Pickworth" online and in  my few reference books turns up nothing identical except the Red Rooster digital font. I know of a fair number of similar fonts, such as Post -- digitized in a slick version by Nick Curtis as Saturday Morning Toast  <a href="https://www.myfonts.com/fonts/nicksfonts/saturday-morning-toast/">https://www.myfonts.com/fonts/nicksfonts/saturday-morning-toast/</a>   but I am trying track down this particular design.<br>
    I would welcome any suggestions as to the old time font name and its source.</p>
    <p>Thanks.<br>
    Don</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/PickworthOSRR.jpg" width="1186" height="706" alt="">
