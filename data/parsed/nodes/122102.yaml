      <p>Dieter Steffmann has a version called Antique No. 14:<br><a href="http://moorstation.org/typoasis/designers/steffmann/samples/a/antique14.htm">http://moorstation.org/typoasis/designers/steffmann/samples/a/antique14.htm</a></p>
      <p>Nick Curtis has a cleaner version called Snappy Patter:<br><a href="http://www.myfonts.com/fonts/nicksfonts/snappy-patter-nf/">http://www.myfonts.com/fonts/nicksfonts/snappy-patter-nf/</a></p>
      <p>Pete Dako also created a version in 1991 called Speedball (available as shareware from numerous sources).</p>
      <p>All are evidently based on a typeface called Antique No. 14 featured in Dan X. Solo’s “Rustic and Rough-Hewn Alphabets” book.</p>
