      <p>Many thanks Kevin for the "Antique No 14" reference. Dan X. Solo often used names for the fonts he purchased that differed from the original name, but I suspect that this one could perhaps be unchanged from the original. It gives me something I can use while going through old source names. Sounds like the type of font name that would have been used by a foundry like Central, Bruce or Conner<br>
      Also thanks for the reference to the polished version by Nick Curtis. Some differences in the letter-forms due to editing but obviously based on the same font.<br>
      The Peter Dako digital font of 1991 identifies it as "Hunt SpeedBall." This seems to suggest a source in one of the Hunt lettering books.<br>
      Speculating: Hunt lettering based on an old foundry font called "Antique No 14" ??? Or no old foundry, just the Hunt lettering??? Should find a Hunt book and see if it is there and if so whether he calls it "Speedball" or "Antique No 14" ....<br>
      The Steffmann digital font of 2000 is a clone ripped from the Dako font. I standardized the sizing and found the pattern of points in the outlines are the same, allowing for errors resulting from conversions back and forth; including the sequence of lines and curves in the digital outlines.<br>
      The quest continues<br>
      Don</p>
