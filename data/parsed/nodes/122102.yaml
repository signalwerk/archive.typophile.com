      <p>Many thanks Bob.<br>
      Looking closely at the Hunt Brothers "60 Alphabets"<br><img src="/sites/default/files/old-images/Hunt44ModernGermanBold_R80pct_5065.jpg"><br>
       and comparing it to the digital outline of Red Rooster's Pickford Old Style suggests that this could peraps be the source they used for the digital font. I see similarities in where the bumps occur, but I also see differences.<br>
      This is another lead to follow to the source of this design, perhaps in Germany. Bauer, S&amp;G etc. In any case, this confirms that the design is pre-1931.<br>
      Don</p>
