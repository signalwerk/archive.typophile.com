    But now, this small arrow is only shown for some glyphs (for example c, d, e, h, ...), as for others they are not (like a, g, dotlessi, k, ...). I have checked if the composites i want to apply the metrics to are really composites of that glyps - they are, so I just don't know what I am doing wrong.</p>
