      <p>My initial thought was Bayer Universal, but it doesn't really have that much in common. More just the 'feel.'</p>
      <p>There are definitely some nice things going on. The 'e' is cursive, which might work better in the italic than a roman.</p>
      <p>The second half of your 'm' is too small.</p>
      <p>The r, t, f may be too narrow when used in text.</p>
      <p>I really like the 'c,' more so than the circular a, b, d, g, p. q. And the o has a little more charm than the circular ones as well.</p>
      <p>They seem to be in conflict with the c, but the c works nicely with the h, m, n.</p>
      <p>The undulations in the k and x are nice, but might be too subtle. You notice them at this size, but they would disappear at anything smaller.</p>
      <p>I have found it interesting that type designs have to be a caricature of themselves. You look at them the size of your screen in order for them to function at 7 pt.</p>
      <p>Good start!</p>
