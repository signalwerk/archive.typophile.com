      <p>First off, I like it quite a bit and think the little flexes and the e and c work really well together. </p>
      <p>I think it's a step too far from the first version. The undulations that were nice and gentle in the first are overstated in this version (though the v and w are a definite improvement). Some of the characters are looking a bit top-heavy (a g h m n p q), though I think this has to do with changing the design of these characters pretty drastically. I'm not sure which direction I prefer. Can't say the y works for me...</p>
      <p>Have you given any thought to ligatures?</p>
