      <p>Thanks for all the comments so far. And thanks hrant.</p>
      <p>This is the 4th revision of the font.<br>
      Link here &gt; <a href="http://typophile.com/files/Inovares%20Font%204.pdf" rel="nofollow">Fourth revision</a></p>
      <p>There are quite many detail changes:<br>
      - ink traps propagated to main places on letters that may need them<br>
      - the terminal on "a" was distracting because it was too subtle and it looked like an error<br>
      - small change on "c" balance and width<br>
      - reshaped and synchronized "e" and "s". "e" also has smaller eye/counter<br>
      - "f" and "t" have a bit wider crossbars extending abit more to the left<br>
      - "f", "j" and "t" have back curl that is now at least visible but enough subtle to not distract the eye<br>
      - a bit narrower "u"<br>
      - changes on "v" and "w" and added "y" (after 6 different styles this is the one I'm most comfort with)<br>
      - hyphen a bit narrower<br>
      - You can also see accented "c", "s" and "z" (also generated ecaron and rcaron)<br>
      - two major CAPITALS: "H" and "O"</p>
      <p>No kerning yet.</p>
      <p>I'm also thinking to make letterspacing a bit more loose. What do you think? Should I?</p>
      <p>Opinions/ideas/critiques/etc. welcome...</p>
    html_clean: |-
