      <p>I was just thinking you should set some of the characters with vertical strokes next to each other. Sans-faces tend to be difficult to read for words containing a lot of these ("minimal" would be an example). Especially when set in smaller sizes. Some very subtle movement within characters helps this. You have to decide this, because to some extend this affects the artistic side of your design.</p>
