    html: |-
      <p>I like "y" #4. Yes, it can be confused with the "v" more than the other ones, but this isn't exactly a text face... Plus you can say it's inspired by the Greek script - people will like that. :-)  If you decide not to go with #4, go with #3. If anybody complains that it's too strange, tell them Fleischmann was doing it in the 18th century, and you hope people aren't more closed-minded now.  :-&gt;</p>
      <p>The descender area of the "g" is cramped, and a common trick in fonts with such an issue is to make the head shorter - to lift the bottom of the head above the baseline a bit.</p>
      <p>Maybe not a "mess", but the "w" to me is clearly too elaborate. Here's an idea: if you end up using the fourth "y", try making the middle part a vertical line.</p>
      <p>The "x" and "z" seem just a bit too curvy compared to the whole.</p>
      <p>And something new, which I should have mentioned<br>
      first: I think the ascenders should be slightly taller.</p>
      <p>hhp</p>
