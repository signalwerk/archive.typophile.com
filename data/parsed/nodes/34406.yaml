      <p>From my point of view the a can have a slight tail. A lot of sans-faces do have one, which on the other hand doesn't say that yours needs one, too. And a signature character might not be too bad either. Consistency is good, but a good variation on a theme is even better (this was sooo subjective). For text-sizes it could be pretty helpful though, since the stem of the a is another vertical force. Try typing words with a lot of m,n,h,a in it and you'll see what I mean.</p>
      <p>The slight movement in there now is a good approach.</p>
