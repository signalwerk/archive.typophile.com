  html: <p>For those who would know the intimate details, I opened a PS Type 1 font in DTL Datamster Light, converted it to Ikarus format and did an outline cleanup with ContourMaster Light. I then attempted to open the same .ik file in FontLab 5, and it was da bomb…literally.</p>
