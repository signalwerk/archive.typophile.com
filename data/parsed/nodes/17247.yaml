    html: |-
      <p>I believe that FontLab Studio 5 can open native VFB format files, as well as “compiled” fonts in TrueType and PostScript Type 1 format. (And possibly also PostScript Type 3.) Also, it will open variants of those formats, such as dfont and OpenType.</p>
      <p>Other software’s native format files are not supported: Fontographer’s fog format cannot be parsed by FontLab Studio 5, but FontLab’s “FogLamp” utility can convert fogs.</p>
      <p>Perhaps Yuri or Adam is around and can post a better-informed answer.</p>
