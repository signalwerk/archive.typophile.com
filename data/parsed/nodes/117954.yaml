      <p>Jens, my level of expertise in designing novels is similar to yours, but I'll comment anyway.</p>
      <p>I'm assuming you are designing for print. That blue text in the front and back matter should be changed to standard black. (In the back of the book, the blue ink is just a name.)</p>
      <p>Poetry: To my eye the poetry in the text has too much room above and below. But I don't really know what the rule here is.</p>
      <p>Margin: I would increase your gutter margin a little and decrease the outer margin by the same amount, maybe one tenth to one-eighth of an inch. I think that keeping your text away from the gutter will make each page look more elegant. I am not a fan of designers who say you should consider the whole open page as the art object. I think you need white space on each side of each page.</p>
      <p>Cover: I realize you were given this. But if this book is marketed and sold on the internet, most people will be seeing the cover at postage stamp size, on Amazon for instance. Make sure everybody is cool with how the cover looks at this size. No surprises.</p>
      <p>Copyright: In the U.S. I see the year after the copyright symbol, not after the name. You are probably covered either way. But you do need a year for Kathryn's copyright, so just put 2014 in there somewhere.</p>
      <p>Credits: I would move the copyright info to the top of the page and give everyone complete credit. This would also clarify everything. Something like this:<br>
      	COVER CREDITS<br>
      	Cover Design by Aileen Shih, website.com<br>
      	Cover Art "Magic Lady" by Kathrynxxxx, website.com<br>
      	Cover Font1 Name by Font Designer, website.com<br>
      	Cover Font2 Name by Font Designer, website.com<br>
      	INTERIOR CREDIT<br>
      	Book Design by Jens Trӧger, website.com<br>
      	Art by Kathrynxxx, website.com<br>
      	Text Font Name by Font Designer, website<br>
      		set at 10.5/13<br>
      	Chapter Font Name by Font Designer, website</p>
      <p>Small Caps: Maybe "TIN SHED" should be in small caps. I guess it depends on how big the sign is.</p>
      <p>Stuff I don't know about: Check with the printer. Do pages with full art need to have a bleed submitted in the PDF?</p>
