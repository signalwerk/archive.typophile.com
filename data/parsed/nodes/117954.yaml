    <p>Hi,</p>
    <p>Disclaimer: I have no formal education in arts or typography, or anything related :-) I'm noodling on the design for a novel. The paper is 6in by 9in and the cover art was given. There are also illustrations for each chapter (which always open on the recto page), which I've used to open a chapter; the illustration covers the whole page to give it enough room.</p>
    <p>I'm looking for all sorts of feedbacks, please. Things you like, you don't like, I shouldn't do, I should do better, I did well. Anything that'll make the book better and help me understand book design and typography better.</p>
    <p>The PDF is <a class="freelinking external" href="http://savage.light-speed.de/cry-ma-ma.pdf" rel="nofollow">here</a>. It contains the cover and front matter, the complete first chapter, and some of the back matter. I hope that's enough to give you a feel for the book...</p>
    <p>Thank you :) Any comment is appreciated!</p>
