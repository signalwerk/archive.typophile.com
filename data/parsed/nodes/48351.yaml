    <p>I have not posted to this blog in a **** coons age. I think I had felt that it was too critical and was taking most critiques as insults instead of inspiration. I hope to start using it more as a progress in my design.</p>
    <p>I’ve really been thinking hard about a lot of things and I don’t truly want to be a designer anymore. I would love to market peoples design such as <a class="freelinking-external" href="http://www.tylorjreimer.com">http://www.tylorjreimer.com</a> who is my partner and close friend. I just can’t stomach being a designer for the rest of my life, I just don’t think I have what it takes.</p>
    <p>Whats the next step?</p>
    <p>Do you have inspiration for me, should I keep going as a designer? Feel free to talk me out of it or **** rip me apart. All will be taken as it is.</p>
    <p>Sincerely<br>
    Chris</p>
