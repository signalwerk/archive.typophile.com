  html: <p>If it's from Urban Outfitters it's probably Jeremy Dean's hand lettering (some of them seem to have been converted to fonts). House Industries is also doing a Jeremy Dean Vs. House Industries set that is going to include a bunch of fonts in this style. There used to be an preview of the set on Jeremy's website (<a href="http://www.comfortablelead.com/" target="_blank">http://www.comfortablelead.com/</a>) but it's gone now.</p>
  html_clean: <p>If it's from Urban Outfitters it's probably Jeremy Dean's hand lettering (some of them seem to have been converted to fonts). House Industries is also doing a Jeremy Dean Vs. House Industries set that is going to include a bunch of fonts in this style. There used to be an preview of the set on Jeremy's website (<a href="http://www.comfortablelead.com/" target="_blank" class="link-external">http://www.comfortablelead.com/</a>) but it's gone now.</p>
