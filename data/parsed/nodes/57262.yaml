    <p>I recently finished re-designing our web museum of wood types.<br>
    Web Museum is established for the purpose of educating the general public, and the next generation, on the beauties of wood types and engraved blocks. Our mission is to gather, save, preserve, and interpret wood types and information about them.</p>
    <p><a href="http://www.unicorngraphics.com/wood%20type%20museum.asp" title="http://www.unicorngraphics.com/wood%20type%20museum.asp">http://www.unicorngraphics.com/wood%20type%20museum.asp</a></p>
