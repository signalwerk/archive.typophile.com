    html: |-
      <p>Thanks for the positive feedback everyone.</p>
      <p>I’m actually using thickbox for the portfolio bit, I liked lightbox but thickbox is a bit quicker and the next/prev buttons are always there (as opposed to lightbox which has hidden buttons that appear on mouseover). I’ll see if I can get them into a fixed position (moving it to the top is a good suggestion). </p>
      <p>My name is set in AG Old Face - Shaded. I thought it worked well with the site but maybe I should reconsider if it’s considered too plain. Though I don’t necessarily want to use a real attention getting/loud font.   </p>
      <p>Patty, when I get enough work I plan to categorize it into small galleries… but for the time being one page is better. Another way is keep the same format but when there’s more have a link to a next page. </p>
      <p>Also, I have not tried any other fonts for the navigation— what do you mean by more interesting? Given the limited choices that is… would you say something like Verdana is more interesting? I’m not sure.</p>
