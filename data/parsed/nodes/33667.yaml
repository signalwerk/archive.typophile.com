        &lt;td&gt;✔,✓,or blank&lt;em&gt;<em>licensing notes</em>&lt;/em&gt;&lt;/td&gt;&lt;!-- Derivative Work --&gt;<br>
        &lt;td&gt;✔,✓,or blank&lt;em&gt;<em>licensing notes</em>&lt;/em&gt;&lt;/td&gt;&lt;!-- w/o Credit --&gt;<br>
