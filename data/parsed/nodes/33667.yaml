    <p>✔ Allowed<br>
    ✓ Allowed with additional licensing or consent (as noted)<br>
    <br>
    <em>a</em> Font can be used on unlimited output devices, but installed to the RAM of only one.<br>
    <em>b</em> Unlimited printers at the licensed locations.<br>
    <em>c</em> More CPUs licensed for larger font packages.<br>
    <em>d</em> License specifies total devices, not CPUs.<br>
    <em>e</em> Technical restrictions, such as "Print and Preview" only.<br>
    <em>f</em> Non-commercial or in-house only.<br>
    <em>g</em> Prior and/or written consent required.<br>
    <em>h</em> Additional licensing required.<br>
    <em>i</em> Additional license available for documents that are editable.<br>
    <em>j</em> Additional license available for documents that are for commercial work.<br>
    <em>k</em> Limited use allowed for service bureau work without an extra license.<br>
    <em>m</em> Format conversion only.<br>
    <em>n</em> Art derived from font software is subject to the same license.<br>
    <em>o</em> Not for use as "principal art".<br>
    <em>p</em> Allowed for achieving interoperability with other software.<br>
    <em>q</em> Only in PFR format.</p>
    <p>If you would like to contribute to this project, please copy the following code, modify it for the foundry in question, and email to pauldhunt(at)yahoo(dot)com:</p>
