        &lt;td&gt;✔,✓,or blank&lt;em&gt;<em>licensing notes</em>&lt;/em&gt;&lt;/td&gt;&lt;!-- Document Distribution --&gt;<br>
        &lt;td&gt;✔,✓,or blank&lt;em&gt;<em>licensing notes</em>&lt;/em&gt;&lt;/td&gt;&lt;!-- Bureau Distribution --&gt;<br>
