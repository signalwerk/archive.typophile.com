    <p>This chart was part of the article <a href="http://fontlab.wikidev.net/The_Case_for_a_User-Friendly_EULA">“The Case for a User-Friendly <span class="caps">EULA</span>”</a> written for Interrobang 2, but also available for reading on the FontLab Wiki. <a href="http://fontlab.wikidev.net/Image:Interrobang2-EULA-chart.gif">A large image of the <span class="caps">EULA</span>&nbsp;chart.</a></p>
    <p><em>Please scroll down to view&nbsp;chart.</em></p>
