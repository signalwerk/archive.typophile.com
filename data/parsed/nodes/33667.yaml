    <p><strong><a href="/wiki/Indices" class="wiki">Indices</a> : EULA Chart</strong></p>
    <p>This table is based on the chart from <em><a href="/wiki/Interrobang" class="wiki">Interrobang 2</a></em> by <a href="/wiki/nathan_matteson" class="wiki">Nathan Matteson</a> and <a href="/wiki/tiffany_wardle" class="wiki">Tiffany Wardle</a>. The information is here in HTML to make an extensible version of the same information set. If you have suggestions or additions to this chart, please see the contact information at the end of this article.</p>
    <p>This chart was part of the article <a href="http://fontlab.wikidev.net/The_Case_for_a_User-Friendly_EULA">"The Case for a User-Friendly EULA"</a> written for Interrobang 2, but also available for reading on the FontLab Wiki. <a href="http://fontlab.wikidev.net/Image:Interrobang2-EULA-chart.gif">A large image of the EULA chart.</a></p>
    <p><em>Please scroll down to view chart.</em></p>
