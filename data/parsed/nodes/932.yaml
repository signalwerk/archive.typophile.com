    html: <p>You folks don't let any moss grow on you. I have had a few interetsed parties contact me regarding the free type engraving workshop. <br> <br>Firstly I have extended an invitation to anyone attending ATypI 2003 to break away in the evening or in the days following the Conference if possible I realize that everyone will be busy schmoozing and what not, but if you can get away, I'd love to give you a tour, with casters running. <br> <br>I think the soonest I can manage a workshop would be about mid November (with a little flexibility in establishing a date, based upon you being able to get here) and another in the Spring of 2004. This would be about late April or early May. Again this will need to be worked out with potential attendees. Probably the best thing would be for me to give you each other's Email address, and you could duke it out regarding the dates. <br> <br>Keep in touch, and we'll get something going. <br> <br>While you are here, I have an Ikarus setup for digital type, that you might get a kick out of. It's really a very refined and easy program to use. Very friendly to pencil outlines. <br> <br>More later . . .  <br> <br>Jim Rimmer <br> <br></p>
