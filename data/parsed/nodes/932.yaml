      <p>Hrant:</p>
      <p><a href="/wiki/Theo%2520Rehak" class="freelinking">Theo Rehak</a> of the Dale Guild is the man to speak to about the disposition of the ATF equipment. The sad news is that the junkmen were standing by at the auction a few years ago, and the largest part of the battery of fifty or so Barth casters and the hand and steam pivotal (Bruce-like machines) were trucked off for scrap. A part of the holding of matrices met the same fate. The scope of the machinery (weight) was just too overwhelming for the average person to cart away. Barth casters went for about twenty-five dollars. Benton pantographs for a few hundred dollars. Most of the six Bentons were saved and trucked off by people who are, fortunately, using them.</p>
      <p>The good news is that about twenty or so Barth casters were saved and are being used by enthusiasts. A large part of the matrices were also saved by several individuals.</p>
      <p><a href="/wiki/Rich%2520Hopkins" class="freelinking">Rich Hopkins</a> of the Hill and Dale Letter Foundry in Terra Alta WV has rescued a lot of them. Some he has cast in recent years.</p>
      <p><a href="/wiki/Greg%2520Walters" class="freelinking">Greg Walters</a> of Piqua, Ohio has a few of the Barth Casters from the sale, and I believe a small selection of the Matrices.</p>
      <p><a href="/wiki/Dan%2520Carr" class="freelinking">Dan Carr</a>, who operates the Golgonooza (this is a real name) Letter Foundery in Ashuelot, NH has a Large point size Kustermann caster that had been used by Theo for a few years. He passed it on the Dan, who by the way, is a hand punchcutter, and has done a lovely 16 point roman book face.</p>
      <p>Another man who can give you lots of information is <a href="/wiki/Stan%2520Nelson" class="freelinking">Stan Nelson</a>, who is a printing historian/technician at the Smithsonian Museum of Modern History, and is also a punchcutter. He has been archiving a few tons of the ATF matrices which were given to the Smithsonian in, I think, the mid-seventies. These mats are from the ATF "housecleaning" of afew decades ago. Apparently they were presented to the Smithsonian as a dumped pile, which was loaded with snow shovels to take away. The story is that they suffered little damage by this treatment.</p>
      <p><a href="/wiki/Paul%2520Duensing" class="freelinking">Paul Duensing</a> in Watkinsville GA is truly the dean of avocational typefounding in the world. He has so much knowledge of the status of the matrix holdings of the great foundries of Europe. About 15 years ago he cut a 30 pt Civilite for Hermann Zapf. Harold Berliner, Nevada City, CA made me a gift of a font for lending them one of my home-made matrix holders so that they could cast a subscription of 30 fonts. Paul is also a close friend of Schumaker Gebler (forgive my spelling of his name) who has a boggling matrix collection from Stempel, Enschede and other foundries, along with a large functioning battery of foundry casters. Last month I received a gorgeous little brochure from Germany and since I speak no German, I could only sort of guess that it was announcing the final opening of the big Foundry Museum in Germany. I will dig it up . . . in the foundry somewhere.</p>
      <p>One parting item: <a href="/wiki/Chris%2520Stern" class="freelinking">Chris Stern</a> of Grey Spider Press in Sedro Wooley, WA came up to visit me yersterday for the purpose of cutting hanging figs to go with Futura. We got all the patterns cut, and the two rough cuts on all of the matrices. Next week we will do the final finish cut. Chris, incidentally, has five or six Monotype caster, about half of them recondiitoned and operating. He casts type for the School of Visual Concepts in Seattle. They have a very lively program.</p>
      <p>If you are interested in contacting any of these people, give me your Email address, and I will get you contact info on these folks. You have your work cut out for you in tracking the ATF material. The good part is that any of it that exists is in the hand of some known person, you just have to pull it all together.</p>
      <p>This got a little wordy, but there is a lot going on in metal foundry these days.</p>
      <p>Jim Rimmer</p>
