    html: <p>Another person who was at the ATF auction and may have information is David Pankow at the Carey Collection at RIT. He gave an interesting and at times moving lecture about the rise and fall of ATF at the 1994 ATypI conference in San Francisco, culminating in his description of the auction. The scrap dealers were indeed standing by, and seem to have carried of the bulk of the stuff, including many matrices. Pankow himself was able to save a few designs for the Carey Collection, I believe.</p>
