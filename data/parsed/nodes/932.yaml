    html: "<p>Wow Jim, that post is a keeper! Thanks. <br>My address is <a href=\"mailto:hrant@inverselogic.com\">hrant@inverselogic.com</a> <br>I've actually been gearing up to contact Rehak, Pankow, and maybe Jennifer Lee and Mark Lester as well. <br> <br>BTW, I've met Dan Carr a couple of times - a true craftsman. I've never met Stan Nelson, but I have watched his punchcutting video (thanks to Gerald Lange for the loan). I think Nelson might be a golden lead too, especially in my hunt for the ATF Garamond matrices. I recently finished a printing of 11 sizes (6 to 48 point) of ATF Garamond, and am preparing graphs to show the variance of 10 different design attributes according to size, but the source material would be even better! <br> <br>BTW, here's a couple of links for Schumacher-Gebler's amazing museum: <br><a href=\"http://www.atypi.org/40_conferences/30_past_conferences/60_leipzig/gen_info/museum.html\" target=\"_blank\">http://www.atypi.org/40_conferences/30_past_conferences/60_leipzig/gen_info/museum.html</a> <br><a href=\"http://www.druckkunst-museum.de/\" target=\"_blank\">http://www.druckkunst-museum.de/</a> <br> <br>hhp <br></p>"
