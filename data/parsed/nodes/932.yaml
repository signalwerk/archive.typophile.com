    html: "<p>I can't quite recall whether Rich Hopkins got the ATF matrices for Garamond or Baskerville, but I seem to remember that he has one series of the other. You might want to check it out. <br> <br>Other happenings: I have recently completed the cutting of Matrices for Carl Dair's Cartier Roman. I have had the patterns which I made for both the Roman and Italic just sitting around the foundry for a few years. Just didn't have the time to get to cutting punches, which was my original intent. <br> <br>In May of this year I was slated to make a presentation to the Type Club of Toronto, and shamed myself into getting back on the Cartier. Not enough time to cut punches, so I made another (intaglio) set of patterns at a 12-1 scale and cut direct mats. I'll get around to cutting the French accents after October. Since the mats were angraved directly, it is necessary to hand dress all the letters as they come off the caster. Poo! <br> <br>If you are into  little type news: I took a graduating Graphic Design student from Emily Carr Inst. on for a semester of Mondays. He wanted to further his type knowledge. I dropped him in at the deep end of the pool, and suggested that he engrave a small type project. <br> <br>He selected Victor Hammer's American Uncial. We came to the conclusion that if he did only the lowercase and a cap I, along with the punctuation and figs, that he could complete the project. <br> <br>I taught him the bare-bones basics of Fontographer, and he made his outlines with it. Using FWG's method, he cut bristol board patterns, which were then engraved at 2-1 into lead plate. These were used to cut the 14 point mats. <br> <br>In the end, he took away his patterns, the mats and a case of type. The last two days were used up in his setting and printing a limited edition broadsheet with the type. This bright young man's name is Dale Davies. Following his project, another student came for five weeks to do the same thing. I felt the time was too tight, so we settled on her cutting a glyph of her name Kan. In this case she freehanded the drawing from an existing Chinese glyph, and following the same steps cut a mat in 18 point. I steered her into recutting another pattern flopped so that she could print it on her broadseet as a faint grey image, along with the 18 point type. <br> <br>Both students were very tweeked about carrying on at a later date on their own. This is very possible since the machines for cutting type are dirt cheap. <br> <br>The purpose of my writing this here is to mention that I would like to have, at least one year,  two or three interetsed people come and spend two days with me to learn the basics of the process. I think the most logical thing would be to have them design and cut a dingbat/leaf, or the like, in 18 point. This could easily be done over two days. <br> <br>There would be no charge, and there is affordable B&amp;B spots in the neighborhood. <br> <br>Somebody ought to take me up on this, becasue I am not getting younger, and I would dearly like to see the craft carry on. In the final analysis, the knowledge that one picks up is not geared solely to letterpress; at least that's the way I see it. <br> <br>Sorry for the crazy digression. <br> <br>Jim Rimmer <br> <br>    <br> <br></p>"
