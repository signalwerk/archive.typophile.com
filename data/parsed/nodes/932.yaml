    html: <p>Erik <br> <br>If you can read this, I have succeeded in posting. Damn, I get frustrated by computers! <br> <br>I know you have heard about M&amp;H Type (Arion Press). They are very good, and have a large selection of both US and UK Monotype faces. They cast from 6 point to 72 point, using Monotype composition casters, Orphan Annies, Thompsons and Giant Casters. <br> <br>Some of the type, including all 6 to 12 points and in some cases, 14 to 24 pt, are cast in a softer Monotype metal.   <br> <br>To be sure, this is not true foundry type, but will serve well if not overimpressed on a soft packing. <br> <br>All of the Thompson Caster and Giant Caster type is done in hard metal, and is very good indeed. Their catalogue is coded to let you know what is "foundry cast" and what is softer composition-cast type. <br> <br>You could look up Michael and Winnifred Bixler in the Eastern US. They are casting many UK Monotype faces, including those of Gill, Van Krimpen, and Mardersteig etc. <br>They will tell you what their metal alloy is made up of. <br> <br>The Rehak of the Dale Guild is casting in hard metal, using Barth Casters which he aquired from American Type Founders at their liquidation. In addition he has some of their legendary Benton pantographs, and has recut a handful of Goudy's Textura faces; Mediaeval, Franciscan, and Deepdene Text. His work is superb, and the castings are the best in the world. <br> <br>My selection of faces s a very small one, geared to what I need at my press for the books I print. I have cut a handful of my own private faces, in single sizes, and have made them available in the past. At present I am in the midst of setting a very large text, and have no time to cast, so I think your best bet is the names I have given you. <br> <br>Be cautious about buying used type. Some of it is can be short of certain characters, and in some cases it can be worn and beaten up. Buying new is the wisest step. <br> <br>You will find M&amp;H and Dale Guild on the internet. <br> <br>Good luck, <br> <br>Jim Rimmer</p>
