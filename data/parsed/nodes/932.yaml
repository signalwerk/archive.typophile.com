  html: "<p>Folks... <br> <br>Does anyone here know of sources for purchasing real lead type?  A good friend of mine has a printing press which he is very skilled in using, and I was hoping to buy him a set of new (i.e. used) type to add to his collection.  Can't find anything on the internet, but I may just be looking in the wrong places... <br> <br>Please cc: any replies to me at <a href=\"mailto:eriknorvelle@hotmail.com\">eriknorvelle@hotmail.com</a>, since I can't check this forum every day.   <br> <br>TKA, <br>Erik Norvelle</p>"
