    html: <p>John Hudson <br> <br>It will be possible to cut a steel punch also, although it is easier to cut a matrix directly. I have not cut more than a dozen punches, preferring to take the coward's way out and cut typemetal patrixes (I don't know how to pluralize patrix) for elctrolapting, and then the few suites of directly engraved brass matices. <br> <br>I have the process for punch cutting pretty well standardized, and can do a good punch in a few hours. Of course "i" is earier than "g". <br> <br>It looks like the workshop might happen in Nov, but possibly in the spring, or both. <br> <br>Jim</p>
