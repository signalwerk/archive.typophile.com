      <p>History does tend to look for precedent and subsequent professional acclaim, rather than record the overall picture of an era.</p>
      <p>Hence the dominance of Jenson.</p>
      <p>When I see the work of other printers of the Incunabula, I am struck by the variety of their work, extending to alphabetic form—in particular widespread adoption of the lower case "h" with a curved right leg, which Jenson demonstrated was Not the way ahead; he defined the roman alphabet, with the exception of the "e"s crossbar, which was later flattened, and the inside serifs on the top of the capital "M", which were subsequently removed.</p>
