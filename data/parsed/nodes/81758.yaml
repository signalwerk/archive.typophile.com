      <p>I also found the following book which is of some interest to the theme 'Venetian type designers' that we are pursuing:</p>
      <p>Reader in the History of Books and Printing By Paul A. Winckler</p>
      <p><a href="http://books.google.gr/books?id=_-KkIai2YO0C&amp;pg=PA204&amp;dq=Venetian+type+designers&amp;hl=en&amp;ei=mx3BTcTLFZHG8QOki_nABQ&amp;sa=X&amp;oi=book_result&amp;ct=result&amp;resnum=3&amp;ved=0CDkQ6AEwAjgK#v=onepage&amp;q&amp;f=false" title="http://books.google.gr/books?id=_-KkIai2YO0C&amp;pg=PA204&amp;dq=Venetian+type+designers&amp;hl=en&amp;ei=mx3BTcTLFZHG8QOki_nABQ&amp;sa=X&amp;oi=book_result&amp;ct=result&amp;resnum=3&amp;ved=0CDkQ6AEwAjgK#v=onepage&amp;q&amp;f=false">http://books.google.gr/books?id=_-KkIai2YO0C&amp;pg=PA204&amp;dq=Venetian+type+d...</a></p>
      <p>It reads like a historic novel by the way.</p>
      <p>Also these two books:</p>
      <p>The magic of the book: more reminiscences and adventures of a bookman, By William Dana Orcutt</p>
      <p>Reader in the History of Books and Printing, By Paul A. Winckler</p>
