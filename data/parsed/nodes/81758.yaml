      <p>Actually there is a lot of information about all these early printers in the following books: </p>
      <p>Harry Carter, A View of Early Typography up to 1600</p>
      <p>Lowry, Martin. Nicolas Jenson and the Rise of Venetian Publishing in Renaissance Europe. (Oxford: Blackwell, 1991)</p>
      <p>Nesbitt, Alexander The History and Technique of Lettering (c) 1957, Dover Publications, Inc. </p>
      <p>Art of The Printed Book 1455-1955</p>
      <p>Nesbitt, Alexander The History and Technique of Lettering (c) 1957, Dover Publications, Inc. </p>
      <p>BA Thesis - Transparent Book Design 1350-1950.pdf (Blowing the Crystal Goblet:<br>
      Transparent Book Design 1350-1950) by Jon Bath</p>
      <p>There are a few more books but I have to look for them if you wish.</p>
      <p>Through the above books a 10.000 words ++ thesis about 'Early Venetian Type Designers' is possible.</p>
      <p>I have OCR-ed most of the relative texts from the above books and I could send them to you if you would like me to.</p>
