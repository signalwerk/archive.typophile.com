    <p>Hello there, I'm new here. I'm doing a research for my final work in college (I don't know how you call this is english, it's a big final work we have to do in order to graduate - btw I'm brazilian). </p>
    <p>I need to edit a book. And in my particular case I will have to write it too, and it will be about typography history. At first I thought about writing on Nicolas Jenson's work, but there is so little material on him, I would have to travel to Venice to do a decent job and that is out of the question right now. So I broadened my subject to venetian type designers in the early renaissance. I've been trying to collect enough material on this, but I still have little, and I'm tired to get books that dedicate only a small chapter (most of them not even a chapter) on the subject. I know there is a book about Aldus Manutius, but what about others like Nicolas Jenson? Do you have some good recs for me? I already have things like Megg's History of Graphic Design, the book on Aldus Manutius written by Enric Santué, and some others. I'm at a point where I'm almost changing my subject to old english type designers… there is a lot more material on them, but I really wanted to write about those venetians, I felt in love with the examples I saw.</p>
    <p>I will also need as many images as I can find to illustrate my work. </p>
    <p>This is not a book that will be actually published, but I have to print 2 or 3 copies of it and I understand I need to get permissions to use images. </p>
    <p>Thank you for any tips,</p>
    <p>Shendel</p>
