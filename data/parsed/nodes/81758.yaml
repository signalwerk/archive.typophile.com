      <p>There really isn't much information about those early printers, especially Jenson. They were just skilled tradesmen who did not live especially extraordinary lives (unlike the French type designers, who did stuff like get burned at the stake). The best reference I can think of would be the relevant chapters of the first volume of D. B. Updike's <em>Printing Types</em>, which covers a few more of them, but in no great detail.</p>
      <p>Honestly, I think you probably need to reconsider your topic. The best you can do with this topic is regurgitate the same factoids about the Venetian printers that everyone else has been regurgitating for the last century. Your time would be much better spent finding a way to examine their work as it is relevant to contemporary design that has not already been covered ad infinitum.</p>
