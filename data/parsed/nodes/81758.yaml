      <p>Here are a few potentially useful sources that haven't been mentioned yet. Many are particularly relevant to Aldus, since he was the subject of my recent paper. Barker and Fletcher were my two best sources for Aldine information, and Wardrop is excellent for understanding letter-making in the period.</p>
      <p>Barker, Nicholas. <em>Aldus Manutius and The Development of Greek Script and Type in the Fifteenth Century.</em> 2nd ed. New York: Fordham University Press, 1992.</p>
      <p>Burnhill, Peter. <em>Type Spaces: In-House Norms in the Typography of Aldus Manutius.</em> London: Hyphen Press, 2003.</p>
      <p>Fletcher III, Harry George. <em>New Aldine Studies: Documentary Essays on The Life and Work of Aldus Manutius.</em> San Francisco: Bernard M. Rosenthal, 1988.</p>
      <p>Johnson, A.F. <em>Type Designs: Their History and Development.</em> London: Grafton &amp; Co., 1934.</p>
      <p>Osley, A.S. “The Riddle of the Aldine Italic.” From The Society for Italic Handwriting. Available at <a href="http://www.italic-handwriting.org/magazine/articles/history/riddle-aldine-italic" title="http://www.italic-handwriting.org/magazine/articles/history/riddle-aldine-italic">http://www.italic-handwriting.org/magazine/articles/history/riddle-aldin...</a>.</p>
      <p>Smeijers, Fred. <em>Counterpunch: Making Type in the Sixteenth Century, Designing Typefaces Now.</em> London: Hyphen Press, 1996.</p>
      <p>Wardrop, James. <em>The Script of Humanism: Some Aspects of Humanistic Script, 1460–1560.</em> Oxford: Clarendon Press, 1963.</p>
      <p>There's also Mardersteig if you read Italian: <em>Scritti di Giovanni Mardersteig sulla storia dei caratteri e della tipografia</em> has an essay on Griffo's fonts, I believe.</p>
