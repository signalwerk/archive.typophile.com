    <p>Hi! </p>
    <p>I wonder what subway of word use Helvetica in its visual identity.<br>
    I know that cities like Madrid, Barcelona or New York use it.<br>
    I read that Washington and Helsinki, as well. Someone can confirm this?<br>
    You know most subway that use Helvetica?</p>
    <p>Thank you very much and sorry for my English!</p>
