      <p>Jason Santa Maria should not be on the list. His website is famous for having differing designs (and typefaces) for each page. </p>
      <p>The rationale for using just a few typefaces is that one has to learn about them and through familiarity comes excellence. A hypothesis I find very appealing… It is in line with for instance Yves Klein’s usage of blue, or Donald Judd’s fascination with a restricted scale of shapes and materials.</p>
      <p>But to be fair — in the past designers were restricted by the limits of what print shops had available etcetera. Nowadays a designer has 120.000 typefaces to consider… (and in practice there are those twenty he knows that work and that will be used.)</p>
