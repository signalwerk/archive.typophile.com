      <p>Most freelance graphic designers I know charge enough of a fee to be able to buy most any font/typeface their clients approve. And when potential clients ask for some graphic thumbnail to be done up asap it is best to be able to understand the clients business characteristics and their market place as part of the 'letter shape' design decision(s). For instance, way finding signage for a veterinarian hospital as opposed to promotional/sale packages of a saddlery (both entities by-the-way in business of animals). </p>
      <p>Using just one typeface for the brief example above not only limits/restricts/blurs the client's brands, but will also dummy down graphic design as a whole into nothing more than a grunt.</p>
      <p>In my humble opinion of course.</p>
      <p>Happy New Year to you also :)</p>
