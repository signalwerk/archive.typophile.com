      <p>The question i'm trying to answer is why certain designers only use one or few typefaces.</p>
      <p>Do they use only one because of the price of typefaces? </p>
      <p>When they choose only one typeface, it's because they understand it better (instead of others) and in that way, they can make a full use of it?</p>
      <p>When doing identity design do they still use one typeface? What other "tools" do they use to achieve something unique?</p>
      <p>So far i've got the following names:</p>
      <p>Massimo Vignelli<br>
      Malte Maltin<br>
      Experimental Jetset<br>
      Pablo Martín<br>
      Michael C. Place</p>
      <p>Richard Eckersley<br>
      Rich Hendel<br>
      Jason Santa Maria<br>
      Barbara Kruger<br>
      Wim Crouwel</p>
      <p>Do you agree that Wim Crouwel only worked with a really small selection? </p>
      <p>Do you know any other graphic designer?</p>
