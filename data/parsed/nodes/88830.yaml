    html: |-
      <p>Kinda depends on what sort of graphic design you're doing. Pitching a product that will have a new style every year? Like after 1957 to the early '60s, every car had to have tail-fins. The bigger the better, until it suddenly stopped. So "graphic design" in those ads was a matter of "style," too. If you know the product is going to change regularly, and/or there will be a new ad campaign every few months, I suppose you gotta be with it.</p>
      <p>Now if you look at a well-done book from the 1920s, you know it's dated, but that feeling soon disappears if you start reading it (no, not just look at it, read it).</p>
      <p>What's the point? In the small, underpaid world of book designers, most of the best use only a very few fonts. In the advertising business, you have to be timely. I don't know that business, but I'd assume using new fonts is considered important. IMSLTHO, book design is only a little bit about letterforms. Learning to *use* a font takes time. Here are a couple of names if that was your question -- Richard Eckersley, Rich Hendel . . .</p>
      <p>* * *</p>
      <p>Here's an interesting notion -- do designers pushing products that appeal to "old money" use Gotham?</p>
