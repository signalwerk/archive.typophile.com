      <p>As a graphic designer I have most times selected from a limited but hand-picked range of typefaces. I still have preferences for some of the classics but try to avoid those faces used by everyone at a time. For instance, if I may dare to say so, I have used Myriad and Lucida Sans frequently early in the Nineties when they were not yet that popular.<br>
      However, by time I repeatedly find myself using my home-made fonts.</p>
