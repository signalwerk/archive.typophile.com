    html: <p>yeh thats basically the way i work too kris. although most of the typefaces i've worked on recently have been geometric display faces so the translation from paper to computer has been quite easy. although i'd imagine if you were designing a serif typeface for body copy it would be worth drawing all the letters on paper, scanning them in and tracing them on the computer. <br> <br>thanks hrant i'll have a look around.</p>
