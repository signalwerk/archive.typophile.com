  html: <p>Just interested in what methods people employ when creating their typefaces. <br> <br>ie. whether you draw the characters up on paper then scan them in and trace them in illustrator/freehand, or draw them straight on the computer, or a combination of these 2 methods. <br> <br>i'm just interested because sometimes you draw a typeface up on paper and it looks good, then you try and recreate it digitally using your sketches for reference and it doesn't seem to look quite right. <br> <br>thanks <br>iota.</p>
