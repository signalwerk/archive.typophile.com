    <p>I’m working on a project in Adobe Jenson, and I need to use the section sign in some citations. I’m not happy with the one in Adobe Jenson, though, and I was thinking of using the one from Centaur instead. I’m concerned it looks a bit too thin next to the Jenson numerals. (Then again, the picture below is obviously blown up quite a bit.) What do others think? (The example on top uses the Centaur section sign; the one on the bottom uses the Adobe Jenson section sign.)<br>
    </p><div class="imageWrap"><img src="/files/Sections_4915.jpg"></div><p></p>
    <p>Also, while we’re on the subject, should I use a full word space between the section sign and the numerals? It looks a bit too open to me, and I was thinking of using a thin space instead. Any thoughts?</p>
    <p>I’m just an amateur doing some work for a friend, which is why I’m looking for input from experts and professionals!</p>
    <p>Thanks in advance.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/34842" class="topic-previous" title="Go to previous forum topic">‹ International folklore festival - Varna, Bulgaria</a> <a href="/node/34958" class="topic-next" title="Go to next forum topic">Please critique my resume ›</a></div>
