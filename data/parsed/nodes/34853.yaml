      <p>Centaur’s § proportions won’t simultaneously work with the parentheses and numerals of Jenson even with horizontal scaling and increased weight, I can’t give an alternative but I imagine a further search is in order.<br>
      As to the spacing I would keep the current space, I would also, primarily to assist the reader and for consistency, use ‘pp’ for pages, however is the comma between parentheses and § really necessary? That space might need to be a wide space if the comma wasn’t there.</p>
      <p>Tim</p>
