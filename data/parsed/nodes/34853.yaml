    html: |-
      <p>Tim, I think I’ve already been convinced to stick with the Adobe Jenson section sign, inelegant though it seems. (In other words, that’s the direction in which I’m currently leaving.) I checked the Arno Pro section symbol, and it’s even clunkier.</p>
      <p>As for ’pp.’, it is—at least in academic publishing—common to leave it out. (See, for instance, the Chicago Manual of Style.) There is no worry about consistency, since readers know that in the absence of some indication to contrary (§§, chap., vol.), the numbers refer to pages.</p>
      <p>And yes, in a full footnote citation (what I included was only the end of the citation), the comma between the facts of publication and the page number(s) is necessary (or at least standard).</p>
