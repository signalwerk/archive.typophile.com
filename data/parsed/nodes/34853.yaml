    html: "<p>I’m not quite sure why you want to swap in the Centaur glyph: the Jenson is better balanced with the font (note its closer proportions to the ascender height of the “6” and the descender depth of the “9”, “3”, “5”). The Centaur may line up better with the parens, but its relationship is to the figures, not the parens. The Jenson glyph is also more balanced in terms of its curves, and, of course, its weight. Add all of this together and, as above, I don’t quite understand the desire to do the swap...</p>"
