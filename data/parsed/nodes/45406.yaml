    date_raw: 15 May 2008 — 3:58pm
    votes: null
    html: "<p>As I said in my mail, I’ve been encouraged by Gerry to also detail my personal typographic research and interests as part of my application for Reading. He told me one of the most important criteria the MATD steering committee is looking for in people applying to enter the MATD is intellectual curiosity. I tried to fit as much of my past few years of work into my portfolio: apparently it worked!</p>"
