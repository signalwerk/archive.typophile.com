  - id: 278806
    user: 24608
    date: 2008-05-15T17:08:00
    date_raw: 15 May 2008 — 5:08pm
    votes: null
    html: <p>They also like to see that you have experience typesetting projects with a lot of text. People tend to leave these projects out of their portfolios because they're not the glamourous jobs, but at Reading you will be expected to design a typeface that works in text, so the ability to handle text typography is a plus. Good luck Eben.</p>
