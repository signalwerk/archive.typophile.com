  html: <p>I am in the middle of making a rapid Application/Portfolio for entry to Reading University's Type Design Program. If anybody has any advice they want to give me I am all ears. Feel free to comment here or to contact me offline. I am typing typing typing.</p>
  html_clean: <p>I am in the middle of making a rapid Application/Portfolio for entry to Reading University's Type Design Program. If anybody has any advice they want to give me I am all ears. Feel free to comment here or to contact me offline. I am typing typing typing.</p>
