  html: |-
    <p>I’m looking to analyze type specimens for inspiration on a poster project I’m working on. I’ve looked through the Flickr group here: <a href="https://web.archive.org/web/20080829234410/http://www.flickr.com/groups/type_specimen/" title="http://www.flickr.com/groups/type_specimen/">http://www.flickr.com/groups/type_specimen/</a> but I’m really interested in more contemporary designs, not just showing the character set or Lorem ipsum. Typefaces don’t matter I’m just looking for the variety and different techniques (phrases vs. single words per line vs. story telling).</p>
