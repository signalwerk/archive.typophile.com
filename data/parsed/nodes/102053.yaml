      <p>&gt; It is boring technical manuals...<br>
      &gt; I don't know much about fonts...</p>
      <p>If you don't mind a suggestion, you might consider getting a graphic designer to help out; someone who has experience working on technical manuals and has good examples of them in their portfolio (not all designers like those kinds of technical projects). </p>
      <p>They could help present the information clearly and in a more visually interesting manner. Well designed manuals would be appreciated by your customers and would reflect well on your company.</p>
