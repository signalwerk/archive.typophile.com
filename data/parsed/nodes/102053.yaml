      <p>For a technically-oriented manual I'd be inclined to go for something conservatively plain and unobtrusive, with well-disambiguated characters (e.g. no O/0 or 1/l/I confusion) that nonetheless reads fairly comfortably.</p>
      <p>If, as Hrant suggests, you don't want to spend money, there are some good free (open source) options.  To name three: <a href="http://www.linuxlibertine.org/index.php?id=1&amp;L=1">Linux Libertine</a>, <a href="http://www.gust.org.pl/projects/e-foundry/tex-gyre/schola/index_html">TeX Gyre Schola</a> (a version of Century Schoolbook), or <a href="http://www.ctan.org/tex-archive/fonts/charter/">Bitstream Charter</a>.  I imagine any one of those would do well.</p>
      <p>Georgia might work well too, although if your manual makes heavy use of tabular numbers you might find the old-style figures awkward.  (Though there are ways around that, of course.)</p>
