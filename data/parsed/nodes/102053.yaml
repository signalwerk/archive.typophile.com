      <p>I think Hrant is on the right track with using a good windows font.</p>
      <p>You can do very nice work, with a surprising tonal range, using the following:</p>
      <p>Calibri<br>
      Consolas</p>
      <p>That's for the body copy (Calibri) and the technical data (Consolas).</p>
      <p>For making nicer headlines, you can go to Lucasfont and license a single weight of The Sans.</p>
      <p>It's one big Lucas de Groot family!</p>
