      <p>I think the basic version should contain all the characters you want to have, and the pro version contains only additional ligatures/alternates/swashes. I tend to refer to math/science terms fairly often, so having Greek available standard is important to me—I don't see it as an advanced feature. </p>
      <p>Personally, I feel every digital typeface ought to have at least heart and smiley even if there are no other dingbats. (Gotta ♥ the ☺s.) But I happen to really enjoy creating dingbats so maybe it's just me.</p>
      <p><em>CT</em></p>
