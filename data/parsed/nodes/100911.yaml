      <p>Just a historical quibble: "Expert" came from the PostScript Type 1 days, where encoding was by PostScript name, not Unicode. And given the hard-wired encoding of Mac &amp; Windows, the so-called "expert sets" of the time had most characters mis-encoded (i.e., mis-named).</p>
      <p>To this day, when I see a font advertised as having "expert" characters, I just assume it's screwed up. You might not want to have "expert" and "encoding" in the same blurb/sentence.</p>
