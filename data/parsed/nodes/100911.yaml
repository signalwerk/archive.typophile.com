      <p>@Hrant:<em> To me writing system support should not be related to Basic/Pro/etc.</em></p>
      <p>I would like to agree, but if one is publishing Latin, Greek, and Cyrillic versions of a typeface, the standard practice is to not label the Latin as such, eg:</p>
      <p>Pentimento<br>
      Pentimento Greek<br>
      Pentimento Cyrillic<br>
      Pentimento PE (Pan-European)</p>
      <p>If I named a font “Pentimento Latin”, those in my primary (99%) market (Latin) would be perplexed and put off licensing it, because most people think “Latin” refers to the ancient language, not the present day writing system.</p>
      <p>So I presently favor the above system, with “Pro” describing fonts with OpenType features.</p>
      <p>BTW, check how foundries such as TypeTogether, Rosetta, Parachute do this -- as well as companies such as Adobe, Microsoft, Apple and Linotype -- and of course FontFont, who really upset the apple cart.</p>
