    html: |-
      <p><cite>I wouldn't call them screwed up except from a usage standpoint<cite></cite></cite></p>
      <p>You know, actually, they were. Standard PostScript was set up by Adobe, and Adobe had a glyph list of proper names for all characters. Not as useful as Unicode's numbers, perhaps, but at least a Standard.</p>
      <p>But if you remember, the OS systems for Windows and Mac had a hard-wired encoding, so to get a character that wasn't in *their* (different) list,  you had to give it the wrong name. Those of us who set type out of a DOS box weren't so limited, but we were few.</p>
      <p>When you start lying about encodings, everything becomes font-dependent. Sad thing is about half the presses we work for today still think that way, and some still stick to their old Type 1 fonts with mal-named  characters. Just how many ways can you lie about what Greek character goes where, about which font had an omacron character in the odieresis slot (so the damn *characters* would change if you changed fonts...)</p>
      <p>I call it screwed up, and if we're talking about *fonts* rather than *typefaces* I think relevant.</p>
      <p>Edit:</p>
      <p>To address the original question (malformed or no), I think Nick is about right. These days, languages covered is the big question, the goodies are just assumed, and can be shown as cute little OT icons where the font is sold.</p>
