    <p><strong>Hi Typophiles</strong></p>
    <p>I want to set a standard of encoding for my typefaces. I know there are loads of encodings, I've been studing some of them. The question is... <strong>What do you think a Basic font should have? and what about Pro and Expert?</strong> Should they also include Greek and Cyrillic, or they should be apart? (allways talking about text fonts, serif/sans) Any info about this would be highly apreciated. </p>
    <p>Right now What I thought was:</p>
    <p><strong>Basic </strong> (already made the encoding if you want to look at it/use it is <a href="http://ferfolio.com/files/tipografia/Ferfolio-latinExt.enc" rel="nofollow"><strong>"Here"</strong></a>)<br>
    - Latin Basic adobe level 3 (+-429 signs). Language support: Danish, Dutch, English, Finnish, French, Gaelic, German, Icelandic, Indonesian, Irish, Italian, Norwegian, Portuguese, Sami, Spanish, Swahili, Swedish, Croatian (Latin), Czech, Estonian, Hungarian, Latvian, Lithuanian, Polish, Romanian, Serbian (Latin), Slovak, Slovenian and Turkish.<br>
    - Standard Ligatures<br>
    - 4 Number set</p>
    <p><strong>Pro</strong><br>
    - All of the Basic features and lenguages<br>
    - Cyrillic?<br>
    - Greek?<br>
    - SmallCaps</p>
    <p><strong>Expert</strong><br>
    - All of the Basic and Pro features and lenguages<br>
    - More lenguages (not sure which yet)<br>
    - Alternates<br>
    - More Standard Ligatures<br>
    - Discrecionary Ligatures<br>
    - Sub/Superscript<br>
    - All currency signs (all 45)<br>
    - Swashes (if it's pertinent for the font)<br>
    - Dingbats and Simbol (if it's pertinent for the font)</p>
    <p>One thing that is not fair... is that the Pro version would be more expensive... and people who want to use Cyrillicor Greek would have to pay more... maybe it would be prudent to create a Basic Greek/Cyrillic...</p>
