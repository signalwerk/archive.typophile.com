      <p>I concur with the mal-use of "Expert". This used to be an indicator that the font contained Small Caps, Oldstyle Numerals, and a smattering of ligatures. In those days only "fi" and "fl" appeared in 'normal' fonts; the rest had to be replaced manually. A tedious and error prone process (so the term "Expert" may not have designated the <em>font</em>, but rather the level of experience needed to use it correctly).</p>
      <p>These days, I expect these extras in what has become known as "Pro" fonts. Adobe makes a clear distinction: its Type 1 fonts that were converted to the OTF format, but did not magically gain (lots of) ligatures or other OT features, are called "Std". Those that do -- irrespective of the number of scripts --, are called "Pro".</p>
