    html: |-
      <p>I understand how you feel - I also couldn't find a good source info for the calt function.  I might as well try to write one:</p>
      <p><strong>The Substitude Function</strong><br>
      Now, the simplest task you can achieve with the calt feature is to change one character to its alternate, but only it is preceded by another character.<br>
      <code>sub e'b by e.alt2;</code><br>
      <em>Means: If you find an "e" character, followed by an "b character,  substitude "e" for "e.alt2".</em><br>
      (characters are referred to by name)<br>
      This is the only  command that you need.<br>
      For where and how to write it, see the screenshot at the bottom (but better read on, there is some other important stuff).</p>
      <p><strong>Making Groups AKA Classes</strong><br>
      The second task is to put some characters in a group. Doing this job without groups is gonna be a major pain in the ass. Even more than with them.</p>
      <p>Groups are defined in the following way (you have to have the @ before the group name):<br>
      <code>@highaccender = [b k h];</code><br>
      <em>Means: b k and h are now a group, and that group is called "@highaccender".</em><br>
      Follow this syntax strictly. Dont miss the ";".<br>
      <strong>Using Groups as context </strong><br>
      Once you define the group you can easily use it instead of the context glyph (the one that triggers the substitution). Lets revise my first example, and use the group that we already created:</p>
      <p>sub e'@highaccender by e.alt2;<br>
      <em>Means: If you find an "e" character, followed by any character from the @highaccender  group,  substitude "e" for "e.alt2".</em></p>
      <p>You can already see why groups are useful. There are a lot of similar glyps, as b k h which should trigger a similar substitution from the glyph that preceedes them and instead of writting three lines:<br>
      <code>sub e' b by e.alt2;<br>
      sub e' k by e.alt2;<br>
      sub e' h by e.alt2;</code><br>
      You write one:<br>
      <code>sub e'@highaccender by e.alt2;</code></p>
      <p>And you can use the group more than one time.</p>
      <p><strong>Using groups for substitution</strong><br>
      So far we used a group as a context. But the alternative glyphs can also be put in a group.<br>
      For example, lets say that you have an alternate of "o" called "o.alt", an alternate of  "b" called "b.alt" and an alternate of "p", called "p.alt" and you want each of these glyphs to change to its alternate when it is followed by, let's say,  the "h" character.</p>
      <p>First you put the alternates in a group:<br>
      <code>@roundcharactersalt = [o.alt b.alt  p.alt];</code></p>
      <p>Second, you make a group that contains the original characters<br>
      <code>@roundcharacters = [o b p];</code><br>
       It is crucial that they are in the same order.</p>
      <p>Now the substitution is done in the following way.<br>
      <code>sub @roundcharacters' h by @roundcharactersalt;</code><br>
      <em>Means: If you find a character from the @roundcharacters  group, followed by the "h" character, substitude it with its corresponding character from the @roundcharactersalt group.</em></p>
      <p><strong>Using groups for both</strong><br>
      So far groups werent of much use. they only saved a couple of additional lines of code. But consider this:</p>
      <p><code>sub @roundcharacters' @highaccender by @roundcharactersalt;</code><br>
      <em>Means: If you find a character from the @roundcharacters  group, followed by a character from the @highaccender group, substitude it with its corresponding character from the @roundcharactersalt group.</em></p>
      <p>You can also have several alternative groups. For example now we  have<br>
      <code>@roundcharactersalt = [o.alt b.alt  p.alt];</code><br>
      but we can also have:<br>
      <code>@roundcharactersalt2 = [o.alt2 b.alt2  p.alt2];</code><br>
      Which is a pack of different alternatives to the characters from the group @roundcharacters, that can be used in another rule. Try to do that, without using groups.</p>
      <p><strong>A little reminder</strong><br>
      If you have more that one substitution the relatinoship between the different rules can be a problem. For example if you have two rules:</p>
      <p><code>sub e'h by e.alt2;<br>
      sub b'e by b.alt2;<br>
      </code></p>
      <p>and you have a text on which both rules should be applied as:<br>
      "beh"<br>
      But afte you apply the first rule, the text becomes:<br>
      "b e.alt2 h"<br>
      so the second one is not to be applied, because the character after "b" is not "e" anymore, but it is "e.alt2".</p>
      <p>The solution is simple. Instead of<br>
      <code>sub b'e by b.alt2;<br>
      </code><br>
      Write<br>
      <code>@ee = [e, e.alt2]<br>
      sub b'@ee by b.alt2;<br>
      </code></p>
      <p><strong>Groups inside groups</strong><br>
      Finally you can have group, one of the characters of which is another group. The concept is the same. Inserting a group in a group is the equivalent of inserting all of its characters. For example:<br>
      <code>@mastergroup= [a, b, @roundcharacters];</code><br>
      <em>Means: The group @mastergroup consists of  the characters a and b, and of all the characters from the @roundcharacters group.</em><br>
      You can even have a group with alternates of @mastergroup:<br>
      <code>@mastergroupalt= [a.alt, b.alt, @roundcharactersalt ];<code></code></code></p>
      <p>In this case the rule:<br>
      <code>sub @mastergroup' @highaccender by @mastergroupalt;</code><br>
      <em>Means: If you find the characters a and b </em> or any character from the @roundcharacters  group,<em> followed by a character from the @highaccender group, substitude it with a.alt, b.alt, or its corresponding character from the @roundcharactersalt group.</em></p>
      <p>Some advice, before you start:<br>
      First determine exactly what you are trying to achieve.<br>
      Move from simple to complex.<br>
      Keep things as organized as you can with groups and subgroups (even if you have only two characters with a similar substitution, it is better to put them in a group).<br>
      Name your glyphs and groups in a way that makes sense to you. </p>
      <p>For illustration of all of the above, see the code which makes my typeface "Alecko" work:<br>
       <a href="http://dl.dropbox.com/u/46459223/alecko_code.png" title="http://dl.dropbox.com/u/46459223/alecko_code.png">http://dl.dropbox.com/u/46459223/alecko_code.png</a><br>
      The typeface itself is <a href="http://www.myfonts.com/fonts/boris-marinov/alecko/" title="http://www.myfonts.com/fonts/boris-marinov/alecko/">http://www.myfonts.com/fonts/boris-marinov/alecko/</a></p>
