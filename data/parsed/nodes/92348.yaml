    html: |-
      <p>One more thing:<br>
      <strong>(Not) Using Left and Right Direction alternations<a></a></strong><br>
      You already  know that:<br>
      <code>sub e'b by e.alt2;</code><br>
      <em>means: If you find an "e" character, </em>followed by <em>an "b character, substitude "e" for "e.alt2".</em></p>
      <p>And you might also know that if you can change the place of the apostrophe, the function also changes:<br>
      <code>sub g e' by e.alt2;</code><br>
      <em> means: If you find an "e" character, </em>preceded by <em>a "g" character, substitude "e" for "e.alt".</em></p>
      <p>My advice is: do not use these two functions in the same font.<br>
      If you do, everything becomes a mess. At least that what happened with me. </p>
      <p>Even if you defined only these two rules, there already is a conflict in your code (Should the "e" in  "geb" be "e.alt" or "e.alt2"?)  So choose only one of the two (left or right) and stick to it.</p>
