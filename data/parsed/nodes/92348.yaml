    <p>Kind greetings to all,</p>
    <p>My name is Hai Anh Le and I'm a young designer from Hungary, trying to complete my first font release named IONY:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IONYDISPLAYONLY_4894.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/HaiAnhLe--Iony-2011b_4052.png"></div><p></p>
    <p>I didn't have any education in type design, but my love for letters came early on when I was a teenager fascinated by the local graffiti culture. I think this fact gave me more free vision about type design, but my technical skills are still very poor. I know how to draw the vectors and I managed to get the FL file with the kerning nicely but as you can see this particular font needs heavy OpenType coding (i think contextual alternates would be the weapon of choice) which skill I still lack. </p>
    <p>FL glyphs:<br>
    <a class="freelinking external" href="http://dl.dropbox.com/u/19376693/ionyFL.JPG" rel="nofollow">http://dl.dropbox.com/u/19376693/ionyFL.JPG</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IONY-A_6316.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/IONY-B_4064.png"></div><p></p>
    <p>I was reading Leslie Cabarga's 'Learn FontLab Fast' and ransacked google for additional help, but I just can't get the code working.<br>
    So now I've registered here for a chance of getting useful help/suggestions/recommendations from professionals in the topic of coding as well as some criticism about this experimental typeface I loved drawing.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IONY-Dogma_3452.png"></div><p></p>
    <p>If any of you would happen to have the free time and will to give me some hints, then I would be grateful!</p>
    <p>Thank You,<br>
    Hai Anh</p>
