  html: <p><a href="http://www.typesociety.org" target="_top">The Society of Typographic Aficionados</a> (SOTA) has announced that sales of the <a href="http://www.myfonts.com/FontFamily21194.html" target="_top">September Eleven font</a> will end on the last day of this month. The font, a collaborative effort by 90 type designers from more than 20 countries, consists of nearly 100 question mark (?) glyphs expressing the designers' individual reactions to the tragic events of September 11, 2001. <br> <br>Inspired by <a href="http://www.fuelfonts.com" target="_top">Claes Källarsson's</a> Font Aid project benefiting <a href="http://www.unicef.org" target="_top">UNICEF</a>, <a href="http://www.fontdiner.com" target="_top">Stuart Sandler</a> initiated Font Aid II, with SOTA acting as the organizing body for the effort. The resulting font was made available to the public as "charity-ware" through donations accepted at <a href="http://www.myfonts.com" target="_top">MyFonts.com</a>. The September Eleven font has raised over $5,000 to date, with all proceeds going to the <a href="http://www.americanredcross.com" target="_top">American Red Cross</a> and its victim relief efforts.  <br> <br>The September Eleven font is available through September 30, 2002, for the donation of your choice at <a href="http://www.myfonts.com" target="_top">MyFonts.com</a>. Although the font will no longer be available for download after that date, the September Eleven character showings and information will remain online in remembrance of the victims of terrorism throughout the world. <br> <br>For more information, please visit the <a href="http://www.typesociety.org" target="_top">SOTA website</a>.</p>
