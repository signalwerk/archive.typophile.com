    <p>Hi to everybody!<br>
    many times, Fontlab changes (or distorts) bezier curves of a letter imported (through copy/paste) from Illustrator. Is there anything wrong with this procedure? Any better way to import from Illustrator?<br>
    Kostas Siskakis<br>
    Anagrafi</p>
