      <div class="comment-spam-body"><p>_G_, _Q_, _R_, _K_, _W_, _M_, _J_ , _Y_ and _S_[which you already provided] work for me in telling one sans from another. For the lower case: _g_, _k_, _r_, _a_, _f_, _s_, _e_, _j_, and _y_. Don't need them all, but the more the better.<br>
      Don</p>
