    html: <p>Popular commercial fonts like Helvetica are often licensed as basic packages with computer operating systems, so assuming you own the license to the software, you can use the font commercially and legally. And if you don't have Helvetica on your computer, you almost certainly have Arial, which would be extremely close for the letters in your sample.</p>
