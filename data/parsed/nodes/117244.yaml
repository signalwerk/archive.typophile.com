      <p>I am a bit confused as I found this.</p>
      <p>"The Helvetica® typeface is one of the most famous and popular in the world. It’s been used for every typographic project imaginable, not just because it is on virtually every computer. Helvetica is ubiquitous because it works so well."</p>
      <p>Its saying its on virtually every computer BUT its a commercial font so its not likely to be on almost every computer surely??</p>
      <p>Is there a free alternative?</p>
      <p>Thanks in advance.</p>
