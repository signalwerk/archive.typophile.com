  html: |-
    <p>Hi all,</p>
    <p>I once had this crazy plan of assembling an international, all-star typejam band that would perform on TypeCon. As it turns out this could very well happen in Buffalo. That’s why I’d need as soon as possible a complete list of people attending this year’s TypeCon who play (a) musical instrument(s).</p>
    <p>Could you please send me an e-maill with:</p>
    <p>(a) your name<br>
    (b) which instrument(s) you master<br>
    (c) which is your preferred style of music (for playing, might be different from what music you like to listen to!)<br>
    (d) your proficiency for each instrument, ranging from promising amateur over semi-professional to seasoned pro (I’m really sorry, but beginners can’t apply)<br>
    (e) if you have experience with playing in bands (very important!)</p>
    <p>We will try to cook up a set list, which every musician will have to rehearse autonomously. Please keep in mind this will be an experiment, so I really don’t know where this will end.</p>
    <p>Thanks everyone for your co-operation.</p>
