    date: 2010-08-27T13:01:00
    date_raw: 27.Aug.2010 1.01pm
    votes: null
    html: <p>What really annoys me is how so many web pages specify fonts unnecessarily. Lots of simple web-creation apps just automatically insert generic font stacks (usually beginning with Arial). CSS offers nice options for people to style their content, but I sure wish there were more authors and authoring tools that would just leave the choice to the user. I really like the primitive notion of the web providing pure information and leaving it to the user to select the environment that works best for them.</p>
