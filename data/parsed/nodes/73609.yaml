      <p>In Firefox: Preferences &gt; Content &gt; Fonts &amp; Colors — Advanced . . .</p>
      <p>Disable the “Allow pages to choose their own fonts” option.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Firefox-content_4574.png"></div><p></p>
      <p>&nbsp;<br>
      Note: “Other Languages” controls Typophile, for some bizarre reason (as discussed on another thread a while back); but for most pages, one would probably just need to set Western.</p>
