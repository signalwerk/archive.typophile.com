  html: <p>Are there simple tools to turn them off, or have them revert to fonts I'd like to read? Ideally, browsers should have a toggle switch that lets you substitute the served fonts with installed fonts via a personalized CSS, no? In many cases, I'd rather just see Georgia for text. Thanks for wanting to have me read something more interesting, but no thanks. :^D</p>
