      <p>Fonts are implemented in web design, generally, if not always with CSS. Because CSS is client-side, all modern browsers are equipped to display the font you prefer (to an extent). </p>
      <p>To automate the process you could use greasemonkey or chickenfoot, but you may have to write your own script. If you don't want to bother... You could do it manually with some sort of dev tool like firebug etc... </p>
      <p>If you use chrome you could install this extension... <a href="https://chrome.google.com/extensions/detail/aabledekpjmoghdjnpnhfkfpmjifklpb?hl=en" title="https://chrome.google.com/extensions/detail/aabledekpjmoghdjnpnhfkfpmjifklpb?hl=en">https://chrome.google.com/extensions/detail/aabledekpjmoghdjnpnhfkfpmjif...</a></p>
      <p>I'm sure there is something similar for firefox.</p>
