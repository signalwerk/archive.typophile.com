      <p>Don't know if it's actually a font, more probably a custom job as almost all woodmarks in the fashion industry. For the rest, it looks like some sort of <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/bauhaus" rel="nofollow">Bauhaus</a> stencil.</p>
