    <p>I’ve made two attempts in the past to gain a degree in typo/graphic design at LCC but only managed two weeks first time round and then two of the three years the second time of trying. I have a hot/cold relationship with type in terms of personal endeavours but consistent admiration for the discipline.</p>
    <p>So hats of to those of you who are seasoned veterans, and looking at the forums there are many. Mainly i am asking for a little insite into individual and personal working strategies, motivational aids or any little things that go on inside your head which help keep things consistent.</p>
    <p>The creative mind I find works when it wants to, often flashes of inspiration keep me occupied into the small hours when there is little to act as a distraction. When this subsides, I reach the end of a specific idea or things don’t work out, finding the track again is a difficulty. There is no formula of course and i know to a large extent dedication is inherant but any elaboration would be interesting.</p>
    <p>tier.</p>
