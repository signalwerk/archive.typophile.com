      <p>My biggest problem is thinking of a new design possibility for a face before the one I am working on is finished. This year alone, I am working on 8 different faces in various stages of completion.  It isn’t that I am stuck and don’t know what to do. I just can’t stop myself from starting a new project when the new idea strikes.  I find I just have to get at least some basic characters down in the new font or I just can’t sleep. I have one face that could be done in 2 days but have been putting it off to work on the italic for a face I did 4 months ago. </p>
      <p>“Somebody stop me now”</p>
      <p>ChrisL</p>
