    <p>Heya,</p>
    <p>This is a monthly corporate newsletter that i've been asked to design for Heinz Australia (manufacturers predominantly of canned foods).</p>
    <p><a href="http://users.tpg.com.au/wheaney/templateProof_001.pdf" title="http://users.tpg.com.au/wheaney/templateProof_001.pdf">http://users.tpg.com.au/wheaney/templateProof_001.pdf</a><br>
    (3-page PDF)</p>
    <p>So, it is published mostly for screen viewing, with a short run of digital print, so must be readable on screen, hence the sans serif choice for normal copy.</p>
    <p>It's meant to be "a little bit of fun".</p>
    <p>PDF shows the general typographic treatment so far.  I've gone with two page layouts that should be enough variation for different types of content:</p>
    <p>1. Full page, double column text<br>
    2. Full page, single column with sidebar.</p>
    <p>Setting details:<br>
    Single Column - MS Trebuchet 12/17 x 21<br>
    Double Column (full page) - MS Trebuchet 12/17 x 27<br>
    Sidebar - Arial 9.5/13 x 14.6</p>
    <p>I've spent a bit of time copyfitting, and i'm relatively happy that the measures are holding copy sufficently although full justification isnt working as well as i would like.  Seems to be a lot of hyphenation and the wordspacing looks a bit gappy.</p>
    <p>Also, i'm not entirely pleased with Bookman/Trebuchet mix.  It seems a bit wrong, but i don't want to go to serif face, and Trebuchet is the sans with the shortest x-height (which i think is helping balance the colour of the page).  Arial, verdana or other readily available faces are too black. </p>
    <p>Anyway, i dont have a lot to compare too, so ide love anyone's opinion.  This is my first 'real' stab at page compostion.</p>
    <p>Cheers!  JonnySchneider</p>
