    html: |-
      <p>I think you need something more original to pair with that logomark. A hat with a star is just not memorable (sorry, but it's true) so the type needs to stand out. If your target market is affluent women, look for something more "upscale boutique." Right now, you've chosen fonts that are used by some of the biggest, broadest brands in America - Cellular One and Starbucks. Their target market is strongly gender neutral. Yours is not....but so far, your logo is very neutral. </p>
      <p>If it were me? I'd spend some time on <a class="freelinking external" href="http://sudtipos.com/home" rel="nofollow">Sudipos Foundry</a> at more organic typefaces. Primavera or Lombriz might work, or even something like Romy or Semilla. I'd also go window shopping at some little exclusive, over-priced women's boutiques and look at labels and jewelry for inspiration. (Oh, and <strong>not</strong> at the mall --  independent little shops, like on Newbury Street in Boston. The kind of places fools pay $50. for cashmere socks.)</p>
