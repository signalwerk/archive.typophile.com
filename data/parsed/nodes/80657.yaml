    <p>This mark is for a photography business operating in a party oriented environment. The primary audience is upperclass mothers with young kids. I am torn between several different typographic voices to pair with the mark and would love to get some feedback. On one hand I am looking at Rosewood Fill with its unrelenting quirkiness. It seems to pair nicely with the mark in terms of height, contrast and intent. But my fear with Rosewood is that it will get old really fast and will severely limit the growth of this brand. On the other hand I am looking at a clean sans; Neutra to be exact. I feel like it is a nice reflection of the star graphic—which is going to be another element of this identity system. But I am still not 100% convinced with either of these choices. Appreciate any and all feedback.</p>
