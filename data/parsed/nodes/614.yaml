  - id: 4414
    user: 1215
    date: 2002-05-08T10:57:00
    date_raw: 8 May 2002 — 10:57am
    votes: null
    html: <p>Well, Emigre is the one example which doesn't address transfer in a separate paragraph. But paragraph 4 of their <a href="http://www.emigre.com/EUL.html">on-line EULA</a> says, <br> <br>"The Emigre Font Software or documentation may not be sublicensed, sold, leased, rented, lent, or given away to another person or entity." <br> <br>This seems pretty explicit in not allowing transfer. <br> <br>I'm not a contract lawyer, but I'm pretty sure there is no way for the states to prohibit an agreement from being nontransferable. It's a pretty common element of contractual agreements, which a EULA is, in effect. <br> <br>-- K.</p>
