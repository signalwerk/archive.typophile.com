    date_raw: 8 May 2002 — 4:24am
    votes: null
    html: "<p> Hrant, I'm not sure it's a good idea to generalize like that.  <br> <br>The right to transfer font software is governed by the foundry's End User License Agreement -- that's the legal thing you \"sign\"/agree to when you license (i.e. \"buy\") a font. Some foundries allow it, others do not. <br> <br>The paragraph addressing this is usually not hard to find. It often has a heading like \"Transfer,\" \"Transfer of Rights,\" \"Assignment of Rights,\" something like that. <br> <br>Of just the few EULAs I checked quickly: Adobe, Monotype, Carter &amp; Cone allow for a transfer of rights; Font Bureau, Emigre, and Hoefler Type Foundry do not. <br> <br>When transfer is allowed, the specific terms of transfer are spelled out in the EULA and are usually along the lines Hrant mentioned. When in doubt, check your EULA. <br> <br>-- Kent. </p>"
    html_clean: "<p> Hrant, I'm not sure it's a good idea to generalize like that.  <br> <br>The right to transfer font software is governed by the foundry's End User License Agreement -- that's the legal thing you \"sign\"/agree to when you license (i.e. \"buy\") a font. Some foundries allow it, others do not. <br> <br>The paragraph addressing this is usually not hard to find. It often has a heading like \"Transfer,\" \"Transfer of Rights,\" \"Assignment of Rights,\" something like that. <br> <br>Of just the few EULAs I checked quickly: Adobe, Monotype, Carter &amp; Cone allow for a transfer of rights; Font Bureau, Emigre, and Hoefler Type Foundry do not. <br> <br>When transfer is allowed, the specific terms of transfer are spelled out in the EULA and are usually along the lines Hrant mentioned. When in doubt, check your EULA. <br> <br>-- Kent. </p>"
