    date_raw: 25.Jan.2005 8.56pm
    votes: null
    html: <p>FontLab Studio 5 for Windows is in beta and will be released in the first quarter of 2005. We also plan to release some other new applications very soon, so stay tuned! As for ScanFont 4 for Windows -- well, as I've stated elsewhere, we're not a huge company with unlimited resources. This   is why we rarely have the capacity to release the same application on both platforms paralelly. ScanFont 4 for Windows had to give way FontLab Studio 5. All I can say is that we do have a new version of ScanFont for Windows in the works, but we don't have a release date yet.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>
    html_clean: <p>FontLab Studio 5 for Windows is in beta and will be released in the first quarter of 2005. We also plan to release some other new applications very soon, so stay tuned! As for ScanFont 4 for Windows -- well, as I've stated elsewhere, we're not a huge company with unlimited resources. This   is why we rarely have the capacity to release the same application on both platforms paralelly. ScanFont 4 for Windows had to give way FontLab Studio 5. All I can say is that we do have a new version of ScanFont for Windows in the works, but we don't have a release date yet.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>
