    html: <p>We (at work) set the type normally, and then use a .tiff distress file, made in Photoshop, over it. You can change the colour of the .tiff in Illustrator, you can create exactly the amount of distress you need, vary it across the letters, and most importantly, this is a case where a good distress will be much smaller in raster than in vector. A vector distress that gives good texture can be overwhelming to a printing rip.</p>
