    html: |-
      <p>BeauW's suggestion is the best. One can even do this in InDesign; place a structure (psd or tif) over a piece of text and go wild with the Effects-settings. The structure can be scaled to make more subtle or rougher effects. </p>
      <p>A small library of structures will go far. Nice starting point: print a solid black on a laserprinter. Crunch the paper multiple times, copy on laser copier, repeat as many times as wanted. Scan in high resolution.</p>
