    <p>Would anyone like to share your helpful hints or tips on achieving this look (see image attached). Notice how the letter N has a nice subtle texture or rough treatment to it? –I have used different (amateurish) ways of achieving this look but I've never really been confident with the outcome. I either make the letters look too overly rough or not rough enough. I find myself to be a bit tenacious when adding texture of this sort to type. </p>
    <p>Any of your suggestions or advice would be most welcomed and appreciated.</p>
    <p>-kat</p>
