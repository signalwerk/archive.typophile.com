      <p>Well, so many kinds of serifs to choose from . . .</p>
      <p>You won't go wrong with StormType. Check out their Open Library collection. John Baskerville and Andulka Pro are very well done. Their Open Library seems reasonably priced and contains everything you'll ever need.</p>
      <p>Scala (and Scala Sans) from FontFont (designed by Martin majoor) is one of the most versatile font families out there. The serif is warm, inviting, and eminently readable.</p>
      <p>FF Quadraat and Quadraat Sans were desgined by Fred Smeijers, a designer for Enschede (I think), and it is available from FontFont. Another Dutch masterpiece that seems affordable.</p>
      <p>To be honest, I'm more impressed with StormType and FontFont wares than those offered by Enschede or DTL. </p>
      <p>In fact, here's a list of my top 12 favourite serifs (in no particular order.) You're bound to find something you like here:</p>
      <p>Scala (FontFont)<br>
      Joanna MT std. (Adobe)<br>
      Andulka (StormType)<br>
      Palatino LT std. (Adobe)<br>
      Nexus (FontFont)<br>
      Parango (FontFont)<br>
      Dante MT std. (Adobe)<br>
      John Baskerville (StormType)<br>
      Jannon (StormType)<br>
      Quadraat (FontFont)<br>
      Warnock Pro (Adobe)<br>
      Regent II (StormType)</p>
      <p>Honourable mention (exceedingly beautiful and well-crafted, but a bit overwhelming for long tracts of text):</p>
      <p>Requiem (Hoefler &amp; Frere-Jones)<br>
      Rialto (DF Type)</p>
