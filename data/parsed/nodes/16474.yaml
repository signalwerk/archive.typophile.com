      <p>The fonts I listed are all of superb quality, make no mistake, and are generally aknowledged as such by the typeface community. Although they are not cheap, they are quite comparable to TEFF faces both in breadth of application and letterform quality. The real difference is, is that they are more affordable.  </p>
      <p>The work that went into StormType's John Baskerville, for instance, easily rivals the most extensive (and expensive) TEFF font family. Scala (along with its sans partner) is another example: you'd be hard=pressed to find a more legible, versatile typeface that is still interesting without being distracting.</p>
      <p>I'm not saying you shouldn't own Trinite or Renard (the latter of which is probably their only face, aside from Lexicon, that is comfortable to read in long tracts of text), but rather that TEFF prices their fonts with a particular market in mind, and not necessarily according to how much work/effort went into producing it. It is neither right or wrong, just a way of doing business.</p>
