    html: "<p>Update: I have discovered that Monotype and DTL collaborated on the digital revivals of both Albertina and Haarlemmer. Frank Blokland oversaw both projects. Both were originally developed by Monotype, and DTL did the production, so that would explain their release by both companies. Both are considered definitive, as Blokland was able to return to the designers' original drawings, which were considerably altered to fit Monotype's unit system when produced originally.</p>"
