    <p>Hi.  First-time poster here.</p>
    <p>I'm not a designer or typographer, just someone who would like his personal correspondence to have a some style. I'm looking for a high-quality serif and am an admirer of Enschedé Font Foundry fonts like Collis and Trinité and DTL fonts like Albertina. The problem with these, as many of you know, is that they are priced in the stratosphere, way out of the price range of the casual user like me.</p>
    <p>I'm looking for something with a similar no-nonsense, high-quality look but priced no higher than around $300.00 for the family.  So far, I've seen a few things I like such as <a href="http://www.underware.nl/site2/index.php3?id1=dolly&amp;id2=overview" rel="nofollow">Dolly</a> [Underware], <a href="http://www.suitcasetype.com/page.php?lmut=en&amp;section=font&amp;font=dederon%20Serif%20Std%20OT" rel="nofollow">Dederon Serif</a> [Suitcase Type Foundry], and especially <a href="http://www.stormtype.com/andulka.html" rel="nofollow">Andulka Pro</a> [StormType Foundry] but I'd like to make sure I'm not overlooking anything before I part with my pennies.</p>
    <p>Any others that should be on my radar?</p>
    <p>DRR</p>
