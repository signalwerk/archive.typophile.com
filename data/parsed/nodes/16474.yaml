    html: "<p>Following this thread, I would just like to add a general recommendation for Undeware's Dolly, an excellent text font, and one which is not overly expensive. If one is looking for a very inexpensive text font, why not try <a href=\"http://www.stormtype.com/free.html\" title=\"http://www.stormtype.com/free.html\">http://www.stormtype.com/free.html</a>, and test their Lido. I echo the general feeling that TEFF fonts are incredibly expensive, however it really is a case of market strategy. I believe for example that Cambridge University Press bought licenses for Trinty: in the right hands, this will surely enhance the quality of their typesetting. However for small and/or independent design studios, it is almost impossible to offer one's self such luxuries.  Might anyone know whether MT Haarlemmer will be available from philsfonts or similar vendors ?</p>"
