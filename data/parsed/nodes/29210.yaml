    <p><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: <span class="caps">FF</span> Screen&nbsp;Matrix</p>
    <p>Designed by <a href="/node/add/wiki?edit%5Btitle%5D=Cornel%20Windlin" title="Create node &quot;Cornel Windlin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cornel Windlin</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Stephan%20M%C3%BCller" title="Create node &quot;Stephan Müller&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Stephan Müller</a>, 1994-95<br>
    Released by <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a></p>
    <p><span class="caps">FF</span> Screen Matrix was originally designed for the Visualize The Future exhibition at the Parco Gallery in Tokyo. A set of posters imitating displays of cash dispenser machines prompted the viewer with a set of statements and questions about his/her lifestyle. The font was initially designed to imitate an existing <span class="caps">LCD</span> display and has now been redesigned and extended by Stephan&nbsp;Müller.</p>
    <p><strong>External Links</strong><br><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=screen%20matrix"><span class="caps">FF</span> Screen Matrix at&nbsp;FontShop</a></p>
