    <p><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : FF Screen Matrix</p>
    <p>Designed by <a href="/wiki/Cornel%20Windlin" class="freelinking" rel="nofollow">Cornel Windlin</a> and <a href="/wiki/Stephan%20M%C3%BCller" class="freelinking" rel="nofollow">Stephan Müller</a>, 1994-95<br>
    Released by <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a></p>
    <p>FF Screen Matrix was originally designed for the Visualize The Future exhibition at the Parco Gallery in Tokyo. A set of posters imitating displays of cash dispenser machines prompted the viewer with a set of statements and questions about his/her lifestyle. The font was initially designed to imitate an existing LCD display and has now been redesigned and extended by Stephan Müller.</p>
    <p><strong>External Links</strong><br>
    <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=screen%20matrix" rel="nofollow">FF Screen Matrix at FontShop</a></p>
