    html: |-
      <p>This is a very unusual slab, it seems to me. The 'a' is most odd, because usually the tail curls up on Clarendon-like styles. The squared-off tail of this 'a' looks a bit like <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/donnerstag/" rel="nofollow">Donnerstag</a>, but the overall feel is closer to <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/clarendon-text/" rel="nofollow">Clarendon Text</a> from Canada Type.</p>
      <p>Maybe FindMyFont or WhatFontis tools would have better luck?</p>
      <p>- Mike Yanega</p>
