      <p>Yes, there are thousands of light bulb logos, but I think your symbol has enough potential to outshine  – no pun intended – most of them. The brush stroke feels natural and pulls it away from <a href="https://www.google.no/search?q=lightbulb+logo&amp;source=lnms&amp;tbm=isch&amp;sa=X&amp;ei=-KjwVNHkDcGEPNSJgNAO&amp;ved=0CAcQ_AUoAQ&amp;biw=1408&amp;bih=762" rel="nofollow">other competitors</a>. If anything, have another look at the weight distribution in the bulb. </p>
      <p>Sometimes an excellent execution is all it takes.</p>
