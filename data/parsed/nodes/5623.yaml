    html: <p>It might have been based off of a different Bank Gothic than the one you have, Javi... the various digital versions of Bank Gothic differ in width. The <a href="http://www.myfonts.com/fonts/bitstream/bank-gothic/">Bitstream version</a> seems slightly wider than the <a href="http://www.myfonts.com/fonts/ef/bank-gothic-ef/">E&amp;F version</a> -- maybe this is based off of E&amp;F's. Another possibility is <a href="http://www.myfonts.com/fonts/redrooster/banque-gothique-rr/">Banque Gothique RR</a>, but this one seems wider also.</p>
    html_clean: <p>It might have been based off of a different Bank Gothic than the one you have, Javi... the various digital versions of Bank Gothic differ in width. The <a href="http://www.myfonts.com/fonts/bitstream/bank-gothic/" class="link-external">Bitstream version</a> seems slightly wider than the <a href="http://www.myfonts.com/fonts/ef/bank-gothic-ef/" class="link-external">E&amp;F version</a> -- maybe this is based off of E&amp;F's. Another possibility is <a href="http://www.myfonts.com/fonts/redrooster/banque-gothique-rr/" class="link-external">Banque Gothique RR</a>, but this one seems wider also.</p>
