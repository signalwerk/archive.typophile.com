    html: <p>Javi-Chan, the "OBSCURE" looks like it's probably unadulterated Bank Gothic. Note that the S is different from the one in "Square." The one in "OBSCURE" is the real Bank Gothic S. They must have simply customized it for that one logo and used it as is for the rest of the magazine.</p>
