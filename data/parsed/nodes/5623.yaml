    html: <p>Here is your sample followed by one I created from Bank Gothic BT. I only had the Medium weight, so I added stroke thickness. I used four white rectangles to modify the S (2 places) and the two E's, by hiding parts of them. I used 2 red rectangles to make the bars for the E's, and I used a black rectangle to add a tail to an O to make the Q. <br><img src="http://www.typophile.com/forums/messages/83/40744.gif" alt="SquareEnixSimulation"></p>
