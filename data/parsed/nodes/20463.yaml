  html: |-
    <p>Hello,</p>
    <p>I'm looking for an elegant stencil font for a logo. I want a stencil font because I like the industrial/handmade feeling it conveys, but at the same time, I don't want it to be too cold. It should be somewhat *a bit* warm and elegant. Yeah, I know that's pretty much opposites. I know I could design it myself, but I've never designed fonts and I'm afraid it would look cheap compared to professional type designers' fonts. If a font like that exists somewhere, I am willing to try it !</p>
    <p>Thank you very much for your suggestions.</p>
