      <p>It's late - the dogs don't want me to sleep - so I started once again exploring the internet. In tonight's travel's I found</p>
      <p><a href="http://hans.presto.tripod.com/fonts/stencil2.html" title="http://hans.presto.tripod.com/fonts/stencil2.html">http://hans.presto.tripod.com/fonts/stencil2.html</a></p>
      <p>and thought of this thread - so I decided to revive it. Though this is not my choice for "elegant" stencil fonts -- I had to share because it was a nice assortment and you can't beat "free."</p>
      <p>Personal choice for an "elegant stencil" would be Glaser Stencil - however, seeing that this thread originated in June of 2006, I think it would be safe to assume that eclectic's search is over...</p>
      <p>BTW - does elegant and stencil actual go together?</p>
      <p>P.S. Patty, I see you are also a fan of Glaser. My all time favorite stencil - and I try to sneak it in on jobs is House Industries Flyerfont-Reject... it's just, well, adorable!</p>
