      <p>I don't really want to try hard to defend the idea that the Latin script is inherently superior to the Arabic script.</p>
      <p>It may <em>seem</em> that way to those of us who are used to the Latin script. That's because it is hard for us to learn, as the shapes of the different letters don't appear to us to be very distinct, at least in the initial and medial forms.</p>
      <p>Obviously, though, a change in script means that people have to learn to read over again, at least in part, and it would seem that any small gains from a change would be negated by the massive cost of the changeover.</p>
      <p>Incidentally, though, Indonesia, of course, has many non-Muslim citizens, such as on Bali, for whom the Arabic script has no special cultural significance. Are they expected to be conversant with the Malay language?</p>
