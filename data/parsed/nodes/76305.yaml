      <p>@ That's because it is hard for us to learn, as the shapes of the different letters don't appear to us to be very distinct, at least in the initial and medial forms.</p>
      <p>1. Basically, Arabic has only 17 letter forms + dots.<br>
      Medial forms = initial forms + short tails to the their right.<br>
      Final Forms = initial or  Medial forms + longer tails to their left.<br>
      -<br>
      Out of any Latin font, you can easily make ALL the Arabic letterforms as follows:<br>
      pick @ (as is) for ha,<br>
      pick iïî (as is) for N + t + Th respectively and v-flip them for B + Y + P,<br>
      pick o (as is) for Meem and centre one dot above for F,<br>
      pick ö (as is) for Qaf.<br>
      pick q (as is) for waw.<br>
      pick S for Kaf.<br>
      pick j (as is) for Z and remove the dot for R.<br>
      pick c (as is) for Ain and center one dot above for Gheen.<br>
      pick c + h-flip it for Dal and center one dot above for Zal.<br>
      pick b (as is) for T and center one dot above the round part for Zah.<br>
      pick V + rotate it 75 CCW for H and center 1 dot above for Kh. Or 1 dot below for geem.<br>
      pick D + rotate it 90 CCW for Sad and center one dot above for Zad.<br>
      pick E + rotate it 90 CCW for Seen and center 3 dots above for Sheen.<br>
      -<br>
      2. Man reads words not letterforms?!</p>
