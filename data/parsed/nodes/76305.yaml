      <p>Microsoft does not claim there are 22 Arabic scripts. However, countries that share the same script may have different options for representing the date and time; the internationalization settings in Windows control other things beside the script used.</p>
      <p>It is true that practiced readers read single words by eye, but to get started, one needs to read the individual letters and sound out the word. Otherwise, alphabetic scripts would have no advantage over the Chinese writing system.</p>
