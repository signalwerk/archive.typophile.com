  html: |-
    <p>In headlines, do prepositions go at the end or at the beginning of the line? What about articles?</p>
    <p>I’ve seen arguments for both. Some say phrases with prepositions can’t be broken because that would be against the unnatural flow. Others say a headline is better readable if each line makes sense on its own, or at least its beginning does.</p>
    <p>Example (nevermind balancing lines, this is not the point here):</p>
    <p>An Act to approve<br>
    the Constitution<br>
    of the United Nations<br>
    Educational, Scientific<br>
    and Cultural Organization</p>
    <p>or</p>
    <p>An Act to approve the<br>
    Constitution of the<br>
    United Nations Educational,<br>
    Scientific and Cultural Organization</p>
