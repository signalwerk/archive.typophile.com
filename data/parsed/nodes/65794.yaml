    <p><a class="freelinking external" href="http://lifehacker.com/5437156/run-effective-googlestyle-meetings-by-focusing-on-data-not-politics" rel="nofollow">An article on how Google runs effective design meetings</a>. I particularly like the quote:</p>
    <p>"<em><a class="freelinking external" href="http://www.google.com/corporate/execs.html#marissa" rel="nofollow">Mayer</a> discourages using the phrase "I like" in design meetings, such as "I like the way the screen looks." Instead, she encourages such comments as "The experimentation on the site shows that his design performed 10% better</em>."</p>
    <p>Art versus science. Here we go!</p>
