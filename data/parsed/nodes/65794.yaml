      <p>I don't see ‘science’ as involved in this situation at all. It is a matter of art and utility, which may be either complimentary or in conflict in any given situation. Art and utility are often complimentary because humans value art -- by which I mean the extra-utile component of things -- and respond positively to it, enhancing the utility of a thing by making more people want to engage with it. Art and utility will be in conflict, however, if a design that people find more attractive aesthetically actually functions less well than another, less attractive design.</p>
      <p>There is also the matter of branding to consider, because while a company may generally favour utility over art when they are in conflict, this may be moderated if the better functioning design is inconsistent with or undermines an established visual identity in which the company has invested.</p>
