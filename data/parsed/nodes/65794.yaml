      <p>The question is not between "I like ..." and "The user will like ..." but for a person to provide reasons and rationale _why_ they find a feature preferable. So "I like ... because ..." is the better way to make the statement. </p>
      <p>This will be a bit difficult for a senior designer, who has developed good taste. But in most cases tracing the reason why the design works (or works better) can be found and explained to the layperson.</p>
