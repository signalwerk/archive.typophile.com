      <p>I suppose it depends on the kind of meeting as well—is it internal within a design department, or is it an external presentation to a group who's natural habitat is money, metrics and quantifiability? </p>
      <p>Sounds a bit like a naive desire from unsteady leadership to impose a mathematical level of order and clarity on a discipline that requires a strong coherent aesthetic vision, even in the most user-driven testing environments. </p>
      <p>Of course, I've never really thought of Google as a thought-leader or haven of design excellence or process-driven innovator when it comes to design—at least not at the level of groups like Tim Brown's IDEO. </p>
      <p>In generating excellent, ambitious ideas, Google is a fish in water—but at the level of design execution (or even really user-interface development) I've always thought of google as still having a bit of a vestigial "engineer's aesthetic."</p>
