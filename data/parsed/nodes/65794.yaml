      <p>Art and science are not in conflict. They are complimentary.</p>
      <p>Websites like Google and Amazon are in unique position to quickly measure their own success. Google wants people to select the website that will likely have what the user is looking for and Amazon wants people to buy things. Both can try different designs for very short periods of time to see if people click on a link at a higher rate or buy more things respectively.</p>
      <p>In order to try different designs, someone had to design the new design. Design didn’t go away. The experimentation on the site measures whether the new design has a higher click rate or buy rate than the previous design. And the story doesn’t end there, because new design ideas are still needed to keep improving the click rate and buy rate.</p>
    html_clean: |-
