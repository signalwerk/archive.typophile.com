      <p>It might make sense to say something more informative than "I like the way the screen looks".</p>
      <p>Saying that "this new design let users find what they wanted 10% faster" is certainly useful, and if the point is to make the screens work better, while leaving the aesthetics to one designer recognized as competent - because aesthetics are subjective, there's no point debating <em>those</em> in committee - this approach may not be all that bad.</p>
      <p>But it's an approach to keep things tightly focused for an organization that is busy and has chiefly utilitarian goals. This would not be the way to effectively decide on a new look for Avatar II - because here the meeting would be one of creative designers... not of computer programmers providing amateur creative input.</p>
    html_clean: |-
