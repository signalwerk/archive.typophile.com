      <p>I'm all for collecting data whenever possible and using it to inform design wherever possible. But statements such as "The experimentation on the site shows that his design performed 10% better" sound like hog-wash. No doubt it's taken out of context, but as it stands in the article, it begs the question "10% better than what on what metric!?". </p>
      <p>In this particular situation (without the proper context of course), a statement like "I like the way the screen looks" is actually more informative. At least I know that someone likes what's there. I suppose I'm just disgruntled with the amount of jargon and meaningless word salad I hear on a daily basis.</p>
      <p>It's much like people saying something is "value added" without explaining where the value has been added. As though uttering the phrase actually adds value in some mysterious way. Similarly, the uttering of a vague statistic doesn't imbue that statistic with meaning or utility.</p>
