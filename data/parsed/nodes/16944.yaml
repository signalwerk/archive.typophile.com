    <p>BOURGEOIS FONT<br>
    +_+_+_+_+_+_+_+_+_+_+_+_+ </p>
    <p>FONT RELEASE: BOURGEOIS<br>
    This clean looking sans was originally drawn in three weights for the Mori Art Museum in Japan. (<a href="http://www.mori.art.museum" title="www.mori.art.museum">www.mori.art.museum</a>), Bourgeois has been now been released as a major 32 weight family. It is not the most experimental font we have designed (it has a very light virusfonts touch to it) but it is certainly one of the most usable, well crafted and mature.  We hope you will find that suitable for a number of uses, both text and display, please check the virusfonts website at <a href="http://www.virusfonts.com" title="www.virusfonts.com">www.virusfonts.com</a> for specimen sheets and pricing details.</p>
    <p>+_+_+_+_+_+_+_+_+_+_+_+_+</p>
