    <p><strong><a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Neue Helvetica</strong></p>
    <p>In 1983, Neue Helvetica was released as an updated version of <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>'s <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a>. It includes more weights and styles, making the classic type family more consistant.</p>
    <p>Helvetica is still one of the most widley used typefaces of all time; although it is loved by many, it is hated by some. There is no shortage of commentary on the typeface, and there has even been a book published by <a href="/wiki/Lars%20Muller%20Publishers" class="freelinking" rel="nofollow">Lars Muller Publishers</a> entitled "Helvetica: Homage to a Typeface" dedicated to the famous type family.</p>
    <p><a href="http://www.linotype.com" rel="nofollow">Linotype's website</a> includes an overview of all of the <a href="http://www.linotype.com/526/helvetica-family.html" rel="nofollow">original Helvetica font</a> weights, and all of the <a href="http://www.linotype.com/1266/neuehelvetica-family.html" rel="nofollow">Neue Helvetica font</a> weights as well.</p>
