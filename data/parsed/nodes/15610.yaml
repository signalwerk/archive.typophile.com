    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Neue&nbsp;Helvetica</strong></p>
    <p>In 1983, Neue Helvetica was released as an updated version of <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>’s <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a>. It includes more weights and styles, making the classic type family more&nbsp;consistant.</p>
    <p>Helvetica is still one of the most widley used typefaces of all time; although it is loved by many, it is hated by some. There is no shortage of commentary on the typeface, and there has even been a book published by <a href="/node/add/wiki?edit%5Btitle%5D=Lars%20Muller%20Publishers" title="Create node &quot;Lars Muller Publishers&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Lars Muller Publishers</a> entitled “Helvetica: Homage to a Typeface” dedicated to the famous type&nbsp;family.</p>
    <p><a href="http://www.linotype.com">Linotype’s website</a> includes an overview of all of the <a href="http://www.linotype.com/526/helvetica-family.html">original Helvetica font</a> weights, and all of the <a href="http://www.linotype.com/1266/neuehelvetica-family.html">Neue Helvetica font</a> weights as&nbsp;well.</p>
