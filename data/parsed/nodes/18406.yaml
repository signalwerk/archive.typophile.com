      <p><em>But now I face a new problem. The kerning (space between letters) is getting a bit messed up =( (at least in Photoshop)<br>
      =========================================================</em></p>
      <p>Try and set these options at the Character panel:</p>
      <p>Photoshop CS / CS2<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/PSCS2.gif"></div><p></p>
      <p>Use the font only at 8px (if it is designed at this size*) or multiples of 8 (16,24,etc) with the Anti-aliasing set to "None", and the "Kerning" feature set to "Metrics".</p>
      <p>=================<br>
      <em>By the way. I just tested the grid function and even if it’s a bitmap font I imported it don’t follow the grid?</em><br>
      =================</p>
      <p>*Well if your font is designed to work at 8px size then the grid at 125 will work fine, if you have the UPM size at 1000.</p>
      <p>Read the valuable posts of Mark Simonson here:</p>
      <p><a href="http://typophile.com/node/706" title="http://typophile.com/node/706">http://typophile.com/node/706</a></p>
