      <p>Mats, when I open the file "04b-08", it is in Names view mode, which might be the issue. Here's what I would do:</p>
      <p>_ Switch to Codepages view mode<br>
      _ Choose the codepage you need: Mac OS Roman or MS Windows 1252 Western (ANSI)<br>
      _ Perform these commands:<br>
      _ _ Select All<br>
      _ _ Glyph / Glyph Names / Clear Unicode<br>
      _ _ Select All<br>
      _ _ Glyph / Glyph Names / Generate Unicode<br>
      _ _ Select All<br>
      _ _ Glyph / Sort Glyphs / By Encoding</p>
      <p>Also...<br>
      In the Font Info / Encoding and Unicode window make sure that Greek is checked.<br>
      Switch the "FOND ID" to a number less than 10000.<br>
      Switch the "Microsoft Character Set" to "Western (Latin 1) CP1252 / ANSI"</p>
      <p>See if that works.</p>
      <p>c</p>
