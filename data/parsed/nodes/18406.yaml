      <p>Hello Matsaki... I saw your font and i want to make a note on that. I assume that you wanna add some more characters at that pixel font (04b_2), but your stress is not in the right placement...</p>
      <p>When you make pixel fonts, and your font's UPM value is 1000 then your pixel is 125x125 in the Glyph window... so you can go at the options (FL5) and give the settings to the grid:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/options_grid.gif"></div><br>
      <em>*notice the value of "snap to distance" - helps you a lot*</em><p></p>
      <p>so you can then add / draw pixels with the Rectangle tool more easily...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/grid.gif"></div><p></p>
      <p>notice the left char of yours with the wrong position of the stress. On the right is the right position...</p>
      <p>Cheers ;o)</p>
      <p>ps.</p>
      <p>So did you guys managed it to work?</p>
