    <p><a href="https://www.fontfont.com/fonts/more" title="FF More" rel="nofollow"></a></p><div class="imageWrap"><a href="https://www.fontfont.com/fonts/more" title="FF More" rel="nofollow"><img src="http://typophile.com/files/ff_more_1_590_4340.png"></a></div><p></p>
    <p>It’s easy to find sans serif typefaces with multiple widths and weights, but large serif families are much less common. The 30-font <a href="https://www.fontfont.com/fonts/more" rel="nofollow">FF More</a> fills this void. Five weights in each of Condensed, Regular, and Wide widths answer every need of publication design, from strong headlines to readable text and space-efficient information graphics. FF More’s sturdy serifs and gentle contrast withstand the rigors of magazine and newspaper design — retaining clarity despite size, background, or substrate.</p>
    <p><a href="https://www.fontfont.com/designers/lukasz-dziedzic" rel="nofollow">Łukasz Dziedzic</a> built <a href="https://www.fontfont.com/fonts/more" rel="nofollow">FF More</a> to work alongside <a href="https://www.fontfont.com/fonts/good" rel="nofollow">FF Good</a>, resulting in a powerhouse superfamily, versatile in both its function and aesthetic.</p>
    <p><a href="https://www.fontfont.com/fonts/more" title="FF More" rel="nofollow"></a></p><div class="imageWrap"><a href="https://www.fontfont.com/fonts/more" title="FF More" rel="nofollow"><img src="http://typophile.com/files/ff_more_2_590_4295.png"></a></div><p></p>
    <p><em>Feel free to download the FF More specimen on <a>FontFont.com</a>.</em></p>
