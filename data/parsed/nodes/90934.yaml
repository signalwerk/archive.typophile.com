    <p>(first off I want to say some here will probably say this should be in the release section. however, it seems that section has really turned into a self promotion psuedo-spam type of place. I looked through several pages there and couldn't find many actual questions like this, so I decided to post here)</p>
    <p>So, is it possible to earn a living being a typographer in 2012?</p>
    <p>I'm trying to find some information about this, and cant seem to find anything via google.</p>
    <p>How much does a major company like Linotype pay for a font?  I realize of course this will vary. Just a range of prices would be nice to know. Do they buy them outright, or do the designers get royalties?</p>
    <p>Or maybe I'd be better off setting up my own small font co and releasing them myself on the web?</p>
    <p>I'm currently working as a graphic designer, but am very curious about the process and possibility of going exclusively to typography.</p>
    <p>Thanks for all insight.</p>
