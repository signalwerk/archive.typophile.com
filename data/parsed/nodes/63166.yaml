    <p>Hi all,</p>
    <p>I am looking for some experienced logo designers to share their experiences of how they actually go about selecting the typefaces and comparing the typefaces in the process of creating their logo designs.</p>
    <p>I'm doing quite a few logos designs at the moment and I guess it's a habit I have developed, but after identifying the general requirements for the logo (what sort of style and feel I am trying to go for based on the client and their audience), I generally like typing out the characters that will appear in the logo in plain black and then make lists containing 5-10 copies (about 100pixel high each) of the characters and then go through and change the typeface for each, then compare and critique and get a feel for what I think will make a good choice and then experiment with the chosen typefaces with other design elements within the logo itself and eventually eliminate the type choices I have.</p>
    <p>Just interested in how others go about setting up the process of comparing and choosing the typeface they use while in the process of creating the logo.</p>
    <p>Is it the first thing you do, is it the last thing you do? Do you make lists of fonts to compare or only select a few, if so what size do you set them up at? How many versions of the logo do you setup on your screen at any one time?</p>
    <p>Those are the sorts of insites and thoughts I'm after, always trying to learn and always try to improve, any help would be great.</p>
