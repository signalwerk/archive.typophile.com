      <p>I am certainly not the most experienced designer, but I definitely have a strong philosophy when it comes to type. I really believe in identity design as solving a problem and not simply aesthetic -- I always approach logo design thinking there is a "right" typeface, and not just one that I like or prefer.</p>
      <p>Over the years I've started to pick up on what different typefaces are communicate and how. For example, serif typefaces tend to come off as more serious and traditional than sans-serif. Italicized text tends to have a feeling of movement or progress. Rounded type feels casual. Condensed-width text has always seemed to portray growth or power to me -- it carries a lot of energy.</p>
      <p>That kind of understanding is really helpful in cutting through the clutter. Instead of scrolling through the fonts I have available, I now tend to decide in advance what I'm looking for. A project might need a humanist sans-serif in a condensed width, and that narrows down my options considerably.</p>
      <p>If you're not already to that point with your convictions, spend your time analyzing the typographic choices good designers make. Why did they choose that face and how does it communicate their message? Also, critique poor design and consider what choices you would make instead.</p>
      <p>Hope something I said helped!<br>
      Matt</p>
