      <p>I'm still starting off myself, but the best thing I've done is limit my font selection. I grabbed the list of <a class="freelinking external" href="http://www.blog.spoongraphics.co.uk/articles/25-classic-fonts-that-will-last-a-whole-design-career">25 classic fonts</a> from Chris Spooner's site and haven't looked back. I try to stick close to those, as I feel they are some of the most timeless ones out there, but every once in a while I have a client that steers me away from them.</p>
      <p>There's always consideration for some of the new fonts on the scene, like Gotham- it seems to be a pretty popular choice right now that I think could have some serious staying power as the years go on :)</p>
