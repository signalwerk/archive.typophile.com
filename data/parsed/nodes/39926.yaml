  html: |-
    <p>I’m looking for a strong masthead typeface for an outdoor activities magazine with an eco slant. It should be something that isn’t overly masculine - no heavy sans faces - and distressed faces are out too.</p>
    <p>It’s not a newstand title as such so there isn’t that need to punch out from the shelf and perhaps this allows me leeway to pick something with a little  more personality.</p>
    <p>Have looked at what seems like a million typefaces and so far I’m stumped so any suggestions would be gladly received!</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/39913" class="topic-previous" title="Go to previous forum topic">‹ Why is it so common for typefaces to include small caps in only one weight, such as regular/medium?</a> <a href="/node/39855" class="topic-next" title="Go to next forum topic">help needed- which typeface would pair well with Clarendon? ›</a></div>
