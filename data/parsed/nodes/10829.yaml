    html: "<p>Dana Dahlquist, having displayed remarkable, cryptic-crossword-solving lateral thinking, has now failed to post a question within the required 12 hour period. So I hereby invoke rule No.15 and pose the new question myself. <br> <br>NEW QUESTION: <br> <br>The Psalter was one of the most frequently printed books in the early centuries of printing, with numerous editions being published in Hebrew, Greek and Latin. In what script and in what language was the first non-Hebrew/Greek/Latin edition printed, and in what year?</p>"
