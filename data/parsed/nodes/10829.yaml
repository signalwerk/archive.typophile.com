    html: "<p>(ALMOST) A WINNER: <br> <br>Nathan has half of it. The first non-Hebrew/Greek/Latin Psalter was indeed the <i>Psalterium David et Cantica aliqua</i>, printed by Marcellus Silber from Regensburg for Johannes Potken in 1513. <br> <br>I also asked in what <i>language</i> the edition was printed: the script is generally known as Ethiopic, but this term is not really accurate for the language. I hereby declare Nathan the winner for his correct identification of the edition and script, but he's not allowed to post a question until someone (anyone) correctly identifies the language (I'll accept any of three possible spellings). <br> <br>Here, is an image of the <a href=\"http://www.ibiblio.org/expo/vatican.exhibit/exhibit/h-orient_to_rome/images/orient06.jpg\"><i>Psalterium David et Cantica aliqua</i></a>.</p>"
    html_clean: "<p>(ALMOST) A WINNER: <br> <br>Nathan has half of it. The first non-Hebrew/Greek/Latin Psalter was indeed the <i>Psalterium David et Cantica aliqua</i>, printed by Marcellus Silber from Regensburg for Johannes Potken in 1513. <br> <br>I also asked in what <i>language</i> the edition was printed: the script is generally known as Ethiopic, but this term is not really accurate for the language. I hereby declare Nathan the winner for his correct identification of the edition and script, but he's not allowed to post a question until someone (anyone) correctly identifies the language (I'll accept any of three possible spellings). <br> <br>Here, is an image of the <a href=\"http://www.ibiblio.org/expo/vatican.exhibit/exhibit/h-orient_to_rome/images/orient06.jpg\" class=\"link-external\"><i>Psalterium David et Cantica aliqua</i></a>.</p>"
