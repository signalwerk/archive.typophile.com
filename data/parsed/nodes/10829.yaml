    html: <p>The Genoa Psalter was printed in 1516 by Pier Paolo Porro. It was a polyglot edition and covered (as well as Hebrew, Latin, Greek) Arabic and Aramaic (or Syriac). <br> <br>There's also an Ethiopic version from the fifteenth century, but I guess that doesn't count since it's not printed.</p>
