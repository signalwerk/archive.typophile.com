    date_raw: 25 Mar 2003 — 2:20pm
    date: 2003-03-25T14:20:00
    votes: null
    html: <p>Ge'ez is correct. Note that the ' is properly a reversed (mirrored) apostrophe or left half ring signifying a voiced pharyngeal fricative. <br> <br>Ge'ez is the ancient language in which the scriptures of the Ethiopic Orthodox Church are written. Amharic is the majority language spoken in modern Ethiopia, it is descended from Ge'ez but quite different from it. <br> <br>Take it away Nathan...</p>
