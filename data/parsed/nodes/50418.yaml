    html: <p>I like the lettering. I also like the image however it doesn’t suggest a big meal to me. Depending on the colour it is one solitary carrot, beetroot or turnip. It is showing a single, raw, cooking ingredient. If the logo really needs a pictorial element you need something that looks more appetising. It doesn’t have to be food itself. It could be some kind of dish food is cooked in or served from.</p>
