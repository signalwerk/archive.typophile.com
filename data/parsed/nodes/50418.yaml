      <ul>“it doesn’t say ’fast food’”</ul>
      <ul>Should it? At least here in the US, fast food is *not* synonymous with healthy food.</ul>
      <p>Not necessarily ... but if it’s “fast food” it’s gonna have to communicate with people in a different way (to the way it does) - in my opinion.</p>
