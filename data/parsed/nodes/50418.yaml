    <p>Hi everyone!</p>
    <p>I’m desperately curious to know your opinion about this logo made by local designers for the fast food chain- russian fast food- we paid them good money and they try to convince us it’s a master peice...but i doubt for some reason...</p>
    <p>sorry for Cyrillic font...but general look is what matters i think...<br>
    the name of the venue is BOLSHOY KUSH which can be put into english as KING’S RANSOM or SCOOP or BIG ROLL...smth like that</p>
    <p>well so every opinion will be of great value to me</p>
    <p>thanx in advance</p>
    <p>Anastasia</p>
