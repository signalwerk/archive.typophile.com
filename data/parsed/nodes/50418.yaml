      <p>“it doesn’t say ’fast food’”</p>
      <p>Should it? At least here in the US, fast food is *not* synonymous with healthy food.</p>
      <p>This logo ’feels’ more like an artisan bread shop/cafe, so maybe it’s in the right direction.</p>
      <p>All that said, it’s nearly impossible for us to give you anything but gut reactions on the aesthetics without a lot more details. </p>
      <p>My pure gut reaction: these are hardly the worst logos I’ve ever seen, though perhaps not the best either. But not knowing the budget/process, I can’t really say if they were a good solution for your needs or not.</p>
