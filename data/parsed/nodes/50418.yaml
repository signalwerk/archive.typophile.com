      <p>Well, yeah maybe it doesn’t appear very appealing to fast food, but the turnips (beet) itself echos back to Russian fairy tale, therefore here we can talk about a folklore symbolics..which is familiar to every russian...and besides the USP (unique saling proposition) of the cafe, (canteen) implies that it’s not just classic fast food , which is known  worldwide as a non-healthy one, but a FAST but which is vitally important healthy food! It’s not like a typical fast food with hamburgers and fries...</p>
      <p>Anyway , I’m so grateful to u guys for sharing your ideas and opinions with me, so I can learn more about international perception of the logo.</p>
      <p>Thanx all</p>
