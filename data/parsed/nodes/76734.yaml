    <p>For those of you who've missed being able to subscribe to individual topics, we've re-enabled it. Look for the icon in your browser's URL bar, or modify any URL by inserting "crss/" in this manner:</p>
    <p>typophile.com/node/######</p>
    <p>to</p>
    <p>typophile.com/crss/node/######</p>
