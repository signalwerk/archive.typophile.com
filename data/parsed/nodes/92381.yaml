    <p>Browsing through the ‘What’s New’ section at MyFonts, I happened upon a typeface family called <a href="http://www.myfonts.com/fonts/libertypefoundry/liber-serif/" rel="nofollow">Liber</a>. It reminded me strongly of Luc(as) de Groot’s <a href="http://www.lucasfonts.com/fonts/floris/" rel="nofollow">Floris</a>, which is mentioned as having “inspired” Liber.</p>
    <p>I started to compare glyph forms and found some to be strikingly similar (white is Floris Text, as shown in the type tester on lucasfonts.com, black is Liber, as shown in a PDF from the <a href="http://www.libertypefoundry.com" rel="nofollow">foundry website</a><a>):</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/regular_4473.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/italic_4583.png"></div><p></p>
    <p>Is this what you typically would get when one typeface inspires another? The serifs and ascender/descender length obviously differentiate the two from one another, but I was wondering whether it is advisable to stay that close to the source. Or am I underestimating the importance of these variances? And: Is it allowed to create ‘version 2.0’ of an existing typeface? </p>
    <p>I would like to hear some thoughts on that. Thanks!</p>
