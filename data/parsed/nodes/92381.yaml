      <p>In addition to what Héctor said, it looks like the outlines we re-used, which is always a no-no without permission. Since Wastian directly mentions Floris* he's clearly not trying to hide it; so either he got De Groot's permission (unlikely), he doesn't grasp that it's not OK (so an honest mistake) or he doesn't care that people think it's not OK (which is not OK).</p>
      <p>* Which I will point out is itself strongly reminiscent of De Groot's own Folha, a typeface for a newspaper in Wastian's home country... So maybe check Liber against Folha too. BTW, some Brazilian designers apparently call Floris "Le Folha".  :-)<br>
      <a href="http://typophile.com/node/6256#comment-44171" title="http://typophile.com/node/6256#comment-44171">http://typophile.com/node/6256#comment-44171</a></p>
      <p>Unless Wastian did get permission, MyFonts should pull the font aysap, and both MyFonts and Wastian should forward any proceeds to De Groot.</p>
      <p>Recent and strongly related:<br>
      <a href="http://typophile.com/node/49909#comment-497798" title="http://typophile.com/node/49909#comment-497798">http://typophile.com/node/49909#comment-497798</a></p>
      <p>hhp</p>
