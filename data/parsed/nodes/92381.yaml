    html: '<p>It seems to be the other way around, as you can see on their <a href="http://www.lucasfonts.com/fonts/floris" rel="nofollow">website</a>: <a href="http://www.lucasfonts.com/fonts/floris/floris-sp" rel="nofollow">Floris SP</a> (SP for ‘São Paulo’?) is—like Folha, which it is based on, but not identical with—a headline face with long extenders that comes in a broad range of weights (from Extra Light to Black). <a href="http://www.lucasfonts.com/fonts/floris/floris-text" rel="nofollow">Floris Text</a> has shorter extenders and only two weights (regular + bold), but small caps that Floris SP lacks.</p>'
