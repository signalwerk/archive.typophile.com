    <p>I started to compare glyph forms and found some to be strikingly similar (white is Floris Text, as shown in the type tester on lucasfonts.com, black is Liber, as shown in a PDF from the <a href="http://www.libertypefoundry.com" rel="nofollow" class="link-external">foundry website</a><a>):</a></p>
