      <p>Thanks for your replies so far—very insightful!</p>
      <p>Re Folha vs. Floris:</p>
      <blockquote><p>[De Groot’s] most original achievement (…) was the spirited headline face designed for the Brazilian newspaper <cite>Folha de São Paulo. Folha</cite> differs from his other original typefaces in that it has strong vertical stress. (…) In 2001 De Groot designed a new headline face for <cite>Le Monde,</cite> which was named <cite>Floris Newspaper</cite> after his son. Floris is a continuation of Folha: it has vertical stress, narrow forms and a somewhat rectangular oval as a basic shape. The family is now much larger. It comes in seven weights, from Extra Light to Black. Its regular works well as a condensed text face. (<a href="http://books.google.de/books?id=sR9g5xPPJVQC&amp;lpg=PP1&amp;hl=de&amp;pg=PA225#v=onepage&amp;q&amp;f=false" rel="nofollow">Jan Middendorp: Dutch Type.</a>)</p></blockquote>
      <p>And:</p>
      <blockquote><p>In 2007, Floris was redrawn as part of a drastic redesign of the German weekly <cite>Jungle World. Floris JW</cite> is a headline family in weights, from ExtraLight to Black. The <cite>Jungle World</cite> project also resulted in <cite>Floris Text,</cite> a new typeface for publications, which is still under development. (LF Floris on <a href="http://www.lucasfonts.com/fonts/floris/about/" rel="nofollow">lucasfonts.com</a>)</p></blockquote>
