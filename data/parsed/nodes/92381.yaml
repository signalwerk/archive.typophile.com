      <p>It’s not acceptable for a ﬁrst release.</p>
      <p>Once you’ve established a reputation with some genuinely “non-inspired” typeface designs, then it’s OK to publish stuff that’s quite similar to someone else’s work. Myriad/Frutiger and Gotham/Proxima are well-known examples of this double standard.</p>
      <p>(The above is not my position, just an observation of the status quo.)</p>
      <p>And of course, plagiarizing oneself—no problem!</p>
