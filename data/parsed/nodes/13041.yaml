    <p>I have been playing around with the trial version of Pages that I received when I purchased OSX 10.4. </p>
    <p>I have been running into a font problem, only with fonts from Emigre — mainly Mrs Eaves and Filosofia.</p>
    <p>The problem is that when typing, the word-space does not appear visible making it very hard to spell check. I turned invisibles on and there is record of a space but it does not appear. </p>
    <p>Anyone having this problem?</p>
    <p>— Jer</p>
