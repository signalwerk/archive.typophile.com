    html: |-
      <p>The one solution I’ve found to this issue is to convert the font to individual .pfb files with <a href="http://fondu.sourceforge.net/#Fondu">Fondu</a> and then convert these files to a more useful format. I have used FontForge for this. Based on the <a href="http://www.emigre.com/FAQ.php">Emigre FAQ</a>, I think this kind of conversion is allowed:</p>
      <p><cite>The Emigre Fonts license does allow the user to convert the fonts to other formats as long as the user has purchased the appropriate user license and the converted fonts continue to be used in accordance with this license. In addition, the converted fonts must retain the original Emigre copyright notice.</cite></p>
      <p>After conversion, the spaces appear as expected.</p>
