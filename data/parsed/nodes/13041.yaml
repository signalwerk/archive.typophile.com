      <p>Yes, indeed. emigre fonts in applications other than adobe CS2 such as textEdit, microsoft word and macromedia flash 8 are all displaying this problem on my g4 laptop with 10.4.7.<br>
      Strangely, the same fonts work fine in adobe cs2 products such as Illustrator or inDesign</p>
      <p>Have tried everything I can think of to fix the problem.</p>
      <p>No solution found. Still working on it.</p>
