    html: |-
      <p>Robert,  Ive read both your posts, and speaking purely for myself and Greater Albion I’d respond as follows.   Please bear that in mind as the text of the EULA you quote is actually Myfonts standard one, and other foundries may use the same text but interpret it differently to the comments that follow.</p>
      <p>Firstly,  I’m more than happy with your approach of never passing the font file to the client, and encouraging them to purchase it if they wish to make more use of the typeface.  In that context I (and Greater Albion) interpret “You may use the licensed fonts to create EPS files or other scalable drawings provided that such files are only used by the household or company licensing the font” as refering to your use of the .eps you create by selling it.  Of course, it is then reasonable to assume that those who purchase the .eps will make further use of it and I/we have no problem with that whatsoever.</p>
      <p>My view on the above would not vary whether you have modified the letterforms or not.  In short, Greater Albion is fine with your present operating procedure of licensing the fonts for your design house, and selling your creative efforts, which may happen to have employed our fonts, to your clients for use under terms set by you.  We’re also more than thankful for any referals you pass on to your clients interested in using our fonts directly.</p>
      <p>Thanks for your interest.</p>
