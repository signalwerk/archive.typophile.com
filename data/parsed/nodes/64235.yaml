      <p>Handsome font, Paul!</p>
      <p>Please help me be clear on your EULA:</p>
      <p><strong>You may use the licensed fonts to create EPS files or other scalable drawings provided that such files are only used by the household or company licensing the font.</strong></p>
      <p>Does this prevent me from creating logos or other materials for my design clients? The phrase “provided that such files are only used by the ... company licensing the font” has me stuck, since my client’s would be the ones using the final vector logo, not me.</p>
      <p><strong>You may provide the font to a graphic designer, printer or other service bureau that is working on your behalf only if they agree to use the font exclusively for your work, agree to the terms of this license, and retain no copies of the font on completion of the work. </strong></p>
      <p>As with above, since I am the graphic designer do I license the font or do I point a client at the font, have them license it and give it to me to work on their project only. That seems to be compliant, but does not allow me to keep the font to show to future clients.</p>
      <p><strong>You may import characters from the font as graphical objects into a drawing program and modify such graphical objects. </strong></p>
      <p>Please see <a href="http://typophile.com/node/64265">this post</a> and let me know if the examples there would generally be allowed under your EULA.</p>
      <p>Thanks for your consideration!<br>
      Robert</p>
