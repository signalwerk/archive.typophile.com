    <p>Greater Albion’s Vectis family has now been released on <a class="freelinking-external" href="http://new.myfonts.com/fonts/gatf/vectis/ "> Myfonts.com</a>.</p>
    <p>Vectis, named in honor of the Roman settlement of Britain’s south coast on the Isle of Wight, brings a fresh approach to the classic simple elegance of ancient Roman faces.</p>
    <p>Vectis is offered as a small caps face designed to add a fresh hint of character to this style of classical design.</p>
    <p>Vectis can lend a note of formal dignity to any design project or poster and is ideal for clear headings and titles with a traditional feel. Two weights are offered, regular and bold, as well as a range of alternate letterforms and ligatures.</p>
    <p></p><div class="imageWrap"><img src="/files/Vectis_Gallery1 copy_5998.jpg"></div><p></p>
