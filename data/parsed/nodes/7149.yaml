  html: <p>Dear Mac OS-X folks, I don't know if this is an Adobe issue or an Apple issue.  I seem to have lost many of my keyboard commands--command/spacebar/ for zoom, shift for constrain, and others.  This goes for all Adobe apps.  I may have accidently hit some keyboard command that zapped them but can't get them back.  Please help? <br> <br>ChrisL</p>
