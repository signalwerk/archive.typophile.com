    html: |-
      <p>Great list, Miguel! I want to add that all German examples for ‘fk’ and ‘ffk’ (except for Kafka) would be ligatures across word boundaries of compound words. Traditionally, these are to be avoided.</p>
      <p>See also this thread: <a href="http://www.typophile.com/node/42815">oodles of poodles</a>.</p>
      <p>And: I assume your list is automatically compiled, from the interwebs? There are a few words that are <em>very</em> rare, and others that don’t really exist in standard language, imho:<br>
      begrifft, besofft, vergafftes, verknifft, versofft. If you google for them, you won’t find more than a few dozens hits, most of them from word lists like this one. Of course, that is of negligible, for kerning and drawing ligatures.</p>
      <p>F</p>
