      <p>&gt;but not executed well enough</p>
      <p>I like that.</p>
      <p>I will digress for a moment:</p>
      <p>A long while back I posted a montage of signage in my neighborhood - there is absolutely no coherent look and quite frankly a lot of them are really poor designs…</p>
      <p>but</p>
      <p>When many people started chiming in how signage needs to be so much better executed and typographically sophisticated, I tried to imagine what that would look like and I didn't like what I saw. I just don't want to live in a world where everything is kerned and spaced and immaculately executed. That notion really bores me.</p>
      <p>Now may I have a little cheese with my whine? :)</p>
      <p>peace</p>
