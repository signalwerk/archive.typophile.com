  html: <p>I think You might get a laugh out of this. I have decided to rearrange the fonts at <a href="http://www.typophile.com/forums/messages/29/42914.html?1092687773">my new place of employment</a>. At present there is a load of free "fonts", conflicts, broken families and to make matters worse, most of them are catagorised alphabetically! Urrgh. So I have devised a new method of catagorisation for the mess. Bear in mind that the others using the fonts aren't really typographically aware and "real" classifications would probably make it worse. <br> <br>sans�humanist <br>sans�geometric <br>sans�rubbish <br>serif�slab <br>serif�traditional <br>serif�rubbish <br>display <br>display�hand/brush <br>display�dingbats <br>display�pen <br>display�rubbish <br>rubbish. <br> <br>Whaddya think?</p>
