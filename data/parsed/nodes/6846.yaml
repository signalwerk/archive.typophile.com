    html: "<p>I certainly like all of your <b>rubish</b> categories� rubish is such a funny word. <br> <br>Whay about blackletter, uncial, scripts, etc.? <br> <br>Ans isn't <b>serif traditional</b> too vague? How about something like: <br>Serif Renaissance <br>Serif Garamond (gerald?) <br>Serif Transitional <br>Serif Modern (Didone) <br>Serif 20th Century [bad] revivals <br>Serif 20th Century [good] revivals (that don't fit in any of the above categories) <br>Serif 20th Century original (Perpetua, Times New Roman, Goergia, etc.) <br>Serif ca. 21st Century (new serifs that are not revivals of anything and that don't fit in any of the above categories)</p>"
