    html: '<p>I classified my fonts some time ago like this: <br> <br>-Calligraphic (Bickham Script) <br>-Display  (Impact) <br>-Gothic  (Cloister Black) <br>-Ornamental  (Chiller) <br>-Paragraph   <br>   --Serif   <br>       ---Humanist  (Centaur) <br>       ---Garalde  (Janson) <br>       ---Royale  (Baskerville) <br>       ---Didone  (Walbaum) <br>       ---Mechanical  (Egyptian) <br>       ---Incised  (Optima) <br>       ---Contemporary  (Charter) <br>   --Sans <br>       ---Geometrical  (Futura) <br>       ---Humanist  (Syntax) <br>       ---Grotesques  (Akzidens Grotesk) <br>       ---"Gothics" (Franklin Gothic) <br>   --Monospaced  (Courier)  <br>-Pixel  (Unibody) <br>-Symbols  (Windings) <br>-My beloved ones <br>-Anything Else   <br> <br>Of course that this classification is historically prejudiced but by classifying first by a "use" criteria I could filter everything that wasn�t useful and then by the historical classification (only in the paragraph section) I could distinguish fonts by their form qualities. <br> <br>But as this broke up families and gave me trouble with some types being contemporary sans serif didones I still have some scrambled font folders.&lt;/font&gt;</p>'
    html_clean: '<p>I classified my fonts some time ago like this: <br> <br>-Calligraphic (Bickham Script) <br>-Display  (Impact) <br>-Gothic  (Cloister Black) <br>-Ornamental  (Chiller) <br>-Paragraph   <br>   --Serif   <br>       ---Humanist  (Centaur) <br>       ---Garalde  (Janson) <br>       ---Royale  (Baskerville) <br>       ---Didone  (Walbaum) <br>       ---Mechanical  (Egyptian) <br>       ---Incised  (Optima) <br>       ---Contemporary  (Charter) <br>   --Sans <br>       ---Geometrical  (Futura) <br>       ---Humanist  (Syntax) <br>       ---Grotesques  (Akzidens Grotesk) <br>       ---"Gothics" (Franklin Gothic) <br>   --Monospaced  (Courier)  <br>-Pixel  (Unibody) <br>-Symbols  (Windings) <br>-My beloved ones <br>-Anything Else   <br> <br>Of course that this classification is historically prejudiced but by classifying first by a "use" criteria I could filter everything that wasn�t useful and then by the historical classification (only in the paragraph section) I could distinguish fonts by their form qualities. <br> <br>But as this broke up families and gave me trouble with some types being contemporary sans serif didones I still have some scrambled font folders.&lt;/font&gt;</p>'
