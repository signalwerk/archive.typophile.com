    html: |-
      <p>em,</p>
      <p>in general, it is a question of how much we "educate" the users by adhering to traditional, typographic terminology (here, the term "oblique" _might_ be all-right, although your particular typeface is not obviously oblique, just as it is not obviously italic), vs. how much we make it easy for the users to just stick to what they commonly know. I guess for an average graphic designer, the difference between "oblique" and "italic" is not obvious, and in some languages it simply does not exist. For example in German or in Polish, the inclined counterpart to an upright typeface is simply called kursiv/kursywa, and most users have a 1:1 translation in mind (kursiv/kursywa = italic). "Oblique" may seem to them as an overcomplication. </p>
      <p>In addition to that, the former argument I made about cross-application "compatibility" of menu names applies. This argument does not, however, mean, that we are bound to make 4-styles families. You can make larger typographic families, with appropriate naming that groups any number of styles under one family name, for Mac and OpenType-aware/Adobe applications, and on top of that, produce styling groups with up to 4 styles. An updated description of the process is available on <a href="http://forum.fontlab.com/fontlab-studio-tips-and-tricks/font-family-naming-in-fontlab-studio-5-t313.0.html" rel="nofollow">the FontLab forum</a>. But still, *within* those two naming systems, I think it is advantageous to use the same terms as much as possible, i.e. "Bold" should be "Bold" and "Italic" should be "Italic". In other words, I think it is best when the four "basic" styles of the large family have the same typographic and styling names (while for the other styles, the naming must differ, naturally). </p>
      <p>But that's just my opinion. I think every designer or foundry needs to make that decision themselves. </p>
      <p>Cheers,<br>
      Adam</p>
