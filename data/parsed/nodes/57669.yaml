    html: |-
      <p>I tend to think that an oblique is a sloped Roman. A sloped Roman is always thought of as Roman letterform first, then a slanted variant second (I remember Stanley Morison writing something along this line?)</p>
      <p>An italic, on the other hand, is Roman’s cursive complement. You may start from the roman as a model, but you don’t have to as long as the two blends well together.</p>
      <p>If you change forms (double-storey ‘a’ to single-storey), thus hinting a more calligraphic approach, then calling it an <em>italic</em> would be more apt. If ‘f’ descends below the baseline (can you provide a sample of the letter), then that would befit the name <em>italic</em>, as well.</p>
