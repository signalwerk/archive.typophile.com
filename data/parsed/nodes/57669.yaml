    html: |-
      <p>Well, the problem with "Oblique" is that in the styling group aka Windows family naming, you should only use terms "Regular", "Italic", "Bold", "Bold Italic". So in OpenType fonts, you won't get around the "Italic" term anyway. If it's called Italic in Word for Windows, I guess it is simpler if it would be also called on the other platforms. Similarly, I recommend not to defer from the other standard style names ("Regular", "Bold", "Bold Italic") for those styles, if possible. Of course for the more extensive families, other styles need to carry other names which then won't be compatible with the styling group names, but I think for the basic four fonts, it is best if the typographic names (i.e. OpenType family and style name) and the styling group names (i.e. Windows family and style name) are the same. </p>
      <p>Cheers,<br>
      Adam</p>
