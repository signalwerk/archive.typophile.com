    <p>I'm very close to finish the '<a href="/wiki/italic" class="freelinking" rel="nofollow">italic</a>' version of <a class="freelinking external" href="http://www.emtype.net/geogrotesque_01.php" rel="nofollow">Geogrotesque</a>, it took me about 3 months for correct optically the distortion of slanted and now I have serious doubts about the naming. Although it have changes in some glyphs (for example 'a' and 'f') is more an '<a href="/wiki/oblique" class="freelinking" rel="nofollow">oblique</a>' version than an italic. </p>
    <p>What do you think about the naming?<br>
    Oblique have a 'negative' connotation in the customers?</p>
    <p>In conclusion, I need your help:<br>
    <strong>Geogrotesque Italic</strong> or <strong>Geogrotesque Oblique?</strong></p>
    <p>Thank you, em.</p>
