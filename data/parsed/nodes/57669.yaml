      <p>&gt;I myself would prefer if “cursive” and “oblique” became additional qualifiers that are used _in conjuction_ with the term “Italic”. So &gt;one could have an “oblique italic” and a “cursive italic”. Functionally, both are italics, but structurally, one is oblique and the other &gt;cursive. In other words, “cursive” and “oblique” are two extrema on one axis that is called italicness. That’s how I see it.</p>
      <p>I'm all for simplification and I think this breaks it down well. Whether it's Oblique or Cursive, functionally it's the same effect your looking for in a non-upright version. Besides, everyone is familiar with 'Italic' and I think the confusion lies more so with the term 'Oblique', so between that and the platform issue I'd say Italic has a much stronger case (pun intended : P) to be used for naming non-upright versions… even if the type in question is truly an Oblique, or any of the shades of grey between that and a true Italic, right?</p>
