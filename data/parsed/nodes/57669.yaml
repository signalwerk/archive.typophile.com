    html: |-
      <p>I believe that for most font users, the English term "italic" just like the German term "kursiv" or Polish "kursywa" no longer describes a certain structural phenomenon, but rather a functional. I'd say that the most common definition given by an average user for "italic" would be that it's an inclined/slanted counterpart of the upright font in a font family. If you click on the "I" button in an application, it is labeled "Italic", no matter whether the actual font that it turns on is "italic" or "cursive" or "oblique". So Italic ends up being the most generic term. </p>
      <p>I myself would prefer if "cursive" and "oblique" became additional qualifiers that are used _in conjuction_ with the term "Italic". So one could have an "oblique italic" and a "cursive italic". Functionally, both are italics, but structurally, one is oblique and the other cursive. In other words, "cursive" and "oblique" are two extrema on one axis that is called italicness. That's how I see it. </p>
      <p>Cheers,<br>
      Adam</p>
