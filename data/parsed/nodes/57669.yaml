    html: |-
      <p>Italic and Oblique refer to different things. The former is structurally different than the upright, the latter is structurally identical with the upright but slanted (in which respect the type in question would rather qualify as Oblique than italic, regardless of the one-storey 'a'). Italic Oblique does not make sense because Oblique is not Italic nor a subset of it.</p>
      <p>Technically, Italic is better 'supported' so it is the preferred choice. Yet WPF does distinguish both, and on the level of WWS-compatible names would allow a family to have both Italic and Oblique style. Which however gets one into an odd situation when it comes to the four-style 'styling group' level. Obliques would need to become a separate family ... So for practical reasons, stick to Italic.</p>
