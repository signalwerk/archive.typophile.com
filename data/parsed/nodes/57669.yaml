      <p>This is more of fitting the name to conventions of font naming than using the proper terminology. In most instances, this should be called an "Oblique" (I tend to think of "real" Italics as having more of a handwritten quality - hence the changes to 'a', 'g', etc. - not just the Roman type set at an angle).</p>
      <p>However, if it's font compatibility with finicky operating systems you strive for, than just go with "Italic".</p>
      <p>Also, and I mean this with all due respect, the shear angle of that typeface does not look very flattering in the raster sample you've provided. The vertical edges look a little lumpy and malformed. This might perchance lead to less of its use in bitmap computer graphics, which might mean you may not necessarily bound to using "Italic" for the style name.</p>
