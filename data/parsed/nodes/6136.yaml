    html: <p>It seems the slab serif font is called "Archer" and the serif font is "Surveyor" both created by Tobias Frere-Jones (<a href="http://www.typography.com/" target="_blank">http://www.typography.com/</a>) for Barbara de Wilde, the former art director of Martha Stewart Living. Surveyor (which must be the italics on this cover) is based on old map fonts. See <a href="http://www.commarts.com/CA/featype/hoefler/" target="_blank">this</a> article. <br> <br>I couldn't find font showings for either, though. Maybe now that Martha's a bit hard up she'll sell these fonts to us peons to raise some cash.</p>
