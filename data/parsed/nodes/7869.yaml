    html: '<p><i>&gt;to say anyone who reads or posts on this site is "too poor at the moment" to do a bit of good and at the same time feed your insatiable "typophilia" ...is a rather lame.</i> <br> <br>Well, excuse me for being a little lame, but since I am the one one who wrote that I was "too poor at the moment," I feel a need to defend myself� <br> <br>I only have about 20 Euros in my bank account, no overdraft protection, and no real credit card.* Sadly, my current balance is less than the 36 Euros that <i>Building Letters #2</i> costs. Although I am a student, I am entirely self-supporting. My ability to support myself financially is limited by visa regulations, and current student visa only allows me to work 10 hours/week�at the moment�and this covers my monthly rent, health insurance, and nothing else. In two weeks, my newly-renewed visa will kick in, allowing me to work half-time again, and to earn more money. So please excuse my cheap-skatedness. <br> <br>*I actually do have a credit card, at home in the US. I try never, ever to use its number, because to pay off its balance if I use it, I have to make an international bank transfer, which costs between 30�40 Euro in fees.</p>'
