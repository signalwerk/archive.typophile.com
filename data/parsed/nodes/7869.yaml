    html: "<p>I finally got around to purchasing building letters #2 myself. I was happy to be part of #1. I think the price is very reasonable for what you get, but you should consider that your small sacrifice will go a long way toward improving the quality of life of people who can't post regularly on typophile. Not to get too \"We are the world\" on you, but to say anyone who reads or posts on this site is \"too poor at the moment\" to do a bit of good and at the same time feed your insatiable \"typophilia\" ...is a rather lame. <br>There are 4738 registered users on Typophile and probably a \"few\" lurkers. <br>Do I have to kick some ••• here? Jim has done a lot of work...go support this project now! <br> <br><a href=\"http://www.buildingletters.org/\" target=\"_blank\">http://www.buildingletters.org/</a> <br> <br> <br>RK</p>"
