  date_raw: Fri, 2004-11-26 08:54
  votes: null
  html: "<p>Hi <br> <br>I am looking for some feedback and opinions, so this seemed like the place to come. <br> <br>Some of you will have heard of the Building Letters magazine which I am involved in, for those of you not aware of it, it is an annual publication, which includes a magazine, a CD of typefaces and a couple of posters, it is sold to raise money for charity projects. <br> <br>You can find out more info here : <a href=\"http://www.buildingletters.org\" target=\"_blank\">http://www.buildingletters.org</a> <br> <br>Anyway, the India issue has been out for about a month, and the response has been terrible. We have sold only about 80 copies, which doesn't give us much to donate to the charities we want to support, so I wondered if I could get some feedback on where I might be going wrong, the content, the price, the fonts or the way that the pack is sold? <br> <br>I really want to make this project work, so your feedback would be most useful. <br> <br>Thanks <br> <br>Jim <br>===</p>"
  html_clean: "<p>Hi <br> <br>I am looking for some feedback and opinions, so this seemed like the place to come. <br> <br>Some of you will have heard of the Building Letters magazine which I am involved in, for those of you not aware of it, it is an annual publication, which includes a magazine, a CD of typefaces and a couple of posters, it is sold to raise money for charity projects. <br> <br>You can find out more info here : <a href=\"http://www.buildingletters.org\" target=\"_blank\" class=\"link-external\">http://www.buildingletters.org</a> <br> <br>Anyway, the India issue has been out for about a month, and the response has been terrible. We have sold only about 80 copies, which doesn't give us much to donate to the charities we want to support, so I wondered if I could get some feedback on where I might be going wrong, the content, the price, the fonts or the way that the pack is sold? <br> <br>I really want to make this project work, so your feedback would be most useful. <br> <br>Thanks <br> <br>Jim <br>===</p>"
