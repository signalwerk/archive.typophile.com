    <p>Adobe and Microsoft just posted a notice on the OpenType mailing list about a draft of version 1.5 of the OpenType spec, and requesting suggestions/proposals for version 1.6.</p>
    <p>If you're interested in the mailing list:<br>
    subscribe: <a href="mailto:opentype-migration-sub@indx.co.uk">opentype-migration-sub@indx.co.uk</a></p>
    <p>More details on my blog here: <a href="http://blogs.adobe.com/typblography/2008/01/opentype_15_draft.html" title="http://blogs.adobe.com/typblography/2008/01/opentype_15_draft.html">http://blogs.adobe.com/typblography/2008/01/opentype_15_draft.html</a></p>
    <p>Cheers,</p>
    <p>T</p>
