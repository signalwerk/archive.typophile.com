    <p>I’m about to have a large amount of text laser cut from plastic. Problem is when i create an outline from any font i have in illustrator the outline is too detailed for the cutter size (0.5mm). The solution would be a single stroke typeface that when i convert to outline would be just 1 line so the laser would only have to cut a single line. Does a font like this exist or how can i convert my type into a single stroke graphic.<br>
    Cheers.</p>
