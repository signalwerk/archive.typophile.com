      <p>Profile books designer did it and I met him at the launch. Yes his name is Peter Dyer.</p>
      <p><a href="http://www.designweek.co.uk/home/blog/just-my-type/3016787.article" title="http://www.designweek.co.uk/home/blog/just-my-type/3016787.article">http://www.designweek.co.uk/home/blog/just-my-type/3016787.article</a></p>
      <p>There are 4 versions the original Blue/Orange and the newer ones are Black and one Silver versions, and the US black and red one. They probably legally have to change it in the US. </p>
      <p>Peter Saville designed the latest Professor Brian Cox book cover for 'Quantum Universe' but it looks like they 'redesigned' it for the US market based on the E-mc2 book cover. Muppets. </p>
      <p><a href="http://www.amazon.co.uk/mn/search/?ref_=nb_sb_ss_i_0_10&amp;url=search-alias%3Dstripbooks&amp;field-keywords=brian%20cox%20quantum%20universe&amp;sprefix=Brian%20Cox%20&amp;rd=1" title="http://www.amazon.co.uk/mn/search/?ref_=nb_sb_ss_i_0_10&amp;url=search-alias%3Dstripbooks&amp;field-keywords=brian%20cox%20quantum%20universe&amp;sprefix=Brian%20Cox%20&amp;rd=1">http://www.amazon.co.uk/mn/search/?ref_=nb_sb_ss_i_0_10&amp;url=search-alias...</a></p>
      <p>The original Orange and Blue book say's 'Design, layout and font wrangling by James Alexander of Jade Design (<a href="http://www.jadedesign.co.uk/" title="http://www.jadedesign.co.uk/">http://www.jadedesign.co.uk/</a>).</p>
