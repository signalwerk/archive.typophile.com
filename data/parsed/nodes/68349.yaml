    <p>So yeah I am pretty new to design and I was wondering if anyone knew of some good tips/rules/articles/tutorials on typography and what makes it look good etc. Because I seem to be having problems in my web design with the text looking like it belongs/being easy on the eyes/looking fantastic. So I was just wondering if anyone would like to help out :D</p>
    <p>Cheers,<br>
        Nub</p>
