  html: |-
    <p>In 2009, the most popular Larabie Fonts font families underwent reconstruction: more languages, OpenType features and better quality. New pay styles have been added but the original styles are still free for commercial use. Sales of the new styles help pay for more font families to be rebuilt. Everybody wins. <a href="http://new.myfonts.com/users/q3asodvi0b/albums/400811/" rel="nofollow">Check out the collection</a>.</p>
