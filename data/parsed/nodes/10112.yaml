    html: "<p>My guess is you're thinking of \"My Type Design Philosophy,\" by Martin Majoor, in which he discusses the relationship of Scala and Scala Sans. <br> <br>Here is a partial quote from his article: \"Had Eric Gill planned Joanna and Gill Sans as one family he would have been the first in history to design a family of serif and sans, but he made them as separate designs with separate names.\" <br> <br><a href=\"http://www.typotheque.com/articles/my_type_design_philosophy.html\" target=\"_blank\">http://www.typotheque.com/articles/my_type_design_philosophy.html</a></p>"
