  date_raw: 4 Apr 2005 — 3:18pm
  votes: null
  html: "<p>I read somewhere recently that if Eric Gill had called Joanna \"Gill Serif\" instead he would have been the first to make a serif/sans family. I can't find it in Elements of Typographic Style, Anatomy of a Typeface, Letters of Credit, Counterpunch, or Paul Renner: The Art of Typography. I don't think I've read any other type related books I've read recently, (other than R.R. Kelly's American Wood Type, but it's not in there. Is it?) so where is it? I know this is a stretch, thinking that someone would kow the source right off the bat, but I also know that typophiles are a strange and mysterious bunch.  <br> <br> <br>So, anyone... ?</p>"
  html_clean: "<p>I read somewhere recently that if Eric Gill had called Joanna \"Gill Serif\" instead he would have been the first to make a serif/sans family. I can't find it in Elements of Typographic Style, Anatomy of a Typeface, Letters of Credit, Counterpunch, or Paul Renner: The Art of Typography. I don't think I've read any other type related books I've read recently, (other than R.R. Kelly's American Wood Type, but it's not in there. Is it?) so where is it? I know this is a stretch, thinking that someone would kow the source right off the bat, but I also know that typophiles are a strange and mysterious bunch.  <br> <br> <br>So, anyone... ?</p>"
