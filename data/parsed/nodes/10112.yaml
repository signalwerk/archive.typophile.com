    html: <p>Gill Sans works well with Perpetua -- I used them for many years in a marketing newsletter. The range of the Gill Sans was very useful, especially the bold condensed, and even Ultra. Perpetua Titling was good for initials and, er, titles. I had to make a beefed-up "small" version of Perpetua for footnotes, though.</p>
