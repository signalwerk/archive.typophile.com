  html: |-
    <p>I work for a donations-based organisation which has a logotype set in Optima.</p>
    <p>I need to find a font suitable for all written communication - from letters to policy documents, business cards etc. We need 20 licences or so, but don't have a huge purse to play with.</p>
    <p>Gotham was used on a business card design which looks nice but getting lots of licences is too costly.</p>
    <p>Museo Sans was looked at due to its similarity (and free versions) but it's too quirky, and probably too wide for body copy. But I noticed it has good discounts when buying lots of licences.</p>
    <p>I then looked at Calluna Sans, also from exljbris since I knew there'd be the good deals on multiple licences.</p>
    <p>Is Calluna Sans a reasonable choice for this? If not, any suggestions?</p>
    <p>Thanks a lot for reading.</p>
