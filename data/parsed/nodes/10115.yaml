    <p>greetings everyone. i just started designing a display font for my typography class. it's based on my handwriting (thought it might be nice to have for a personal identification package) and it is comprised of just capital letters.  <br> <br>i don't have a name for it yet nor have i designed all the letters. but, i just wanted to see if anyone had some feedback for me. thanks a lot! <br> <br>-k <br></p>
