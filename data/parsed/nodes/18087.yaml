      <p>Welcome, Gareth.</p>
      <p>This is common. You'll find that the same face is released by two or more companies, sometimes under different names. Bitstream has done this, Elsner &amp; Flake, Carter &amp; Cone, Enschede vs. Monotype, etc. Often, one of the releases will be of higher quality (or will have more osf goodies, for instance) than the other. </p>
      <p>Compare ITC Galliard to the Galliard offered by Carter &amp; Cone. Compare Adobe's Palatino to the countless others on the market. The list goes on. If you really want a quality face, a "real deal" to add to your collection, then Elsner &amp; Flake is among your top choices. Of course, it all depends on your needs. Do some comparison shopping.</p>
      <p>Cheers.</p>
