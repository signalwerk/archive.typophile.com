      <p>Thank you Adam.<br>
      I had hoped that there might be someone who did some text setting with this face whose experience I could benefit from, but I guess it's just not that much used. I think I have only one book set in it, <em>ABC-XYZapf</em>. I've never seen any use of it in everyday publishing, I wondered whether there was any reason for this as it seems a very handsome design, the caps in particular are, to my eye, one of the most beautiful interpretations of the classical forms in the entire tradition -- I well remember the first time I came across them on the cover of <em>Hermann Zapf  &amp; his Design Philosophy.</em></p>
