    <p>This is my first time posting here, after a long look on the web it seems by far the best place for this enquiry.<br>
    There are two versions of Zapf's "Renaissance Antiqua" available: one from the company which produced it originally, Scangraphic; and the other from Elsner &amp; Flake. Both are available in Opentype but the former is about half the price. Basic descriptions for the text (as opposed to display) version from MyFonts are given below.</p>
    <p><strong>Foundry/Vendor Elsner+Flake</strong></p>
    <p><em>Format</em> OpenType<br>
    <em>Name</em> ZapfRenaissaBEFOP-Book<br>
    <em>Version</em> OTF 2.001;PS 002.000;Core 1.0.29<br>
    <em>Family</em> ZapfRenaissaBEFOP-Book<br>
    <em>Sub Family</em> Regular<br>
    <em>PS Name</em> ZapfRenaissaBEFOP-Book<br>
    <em>Filename</em> ZapfRenaissaBEFOP-Book.otf<br>
    <em>File Size</em> 29800 </p>
    <p>Copyright (c) 2003 Veronika Elsner, Guenther Flake GbR; Hamburg. All Rights Reserved. </p>
    <p><strong>Glyph Count</strong> 246<br>
    <em>Character Set</em>  Standard </p>
    <p><a href="http://www.myfonts.com/fonts/ef/zapf-renaissance/b-ef-book/opentype-ps/196877/" rel="nofollow">Myfonts Elsner &amp; Flake link</a>  </p>
    <p><strong>Foundry/Vendor Scangraphic Digital Type Collection</strong><br>
    <em>Format</em> OpenType<br>
    <em>Name</em> ZapfRenaisSBOP-Book<br>
    <em>Version</em> 1.000;PS 001.000;hotconv 1.0.38<br>
    <em>Family</em> ZapfRenaisSBOP-Book<br>
    <em>Sub Family</em> Regular<br>
    <em>PS Name</em> ZapfRenaisSBOP-Book<br>
    <em>Filename</em> ZapfRenaisSBOP-Book.otf<br>
    <em>File Size</em> 31596 </p>
    <p>Copyright (c) Scangraphic Prepress Technology GmbH, 1987 - 2003. Veronika Elsner, Guenther Flake GbR, Hamburg 2004 </p>
    <p><strong>Glyph Count</strong> 230 </p>
    <p><em>Character Set</em>  Standard</p>
    <p><a href="http://www.myfonts.com/fonts/efscangraphic/zapf-renaissance-antiqua-sb/book/opentype-ps/254031/" rel="nofollow">Myfonts Scangraphic link</a> </p>
    <p>The only discussion I can find here about this type concerned the difference between the H (headline) version and the B (bodytext) version, which was settled quickly enough.</p>
    <p>The full character map provided at MyFonts is the same in both cases although there is a difference in the glyph count.</p>
    <p>If anyone is familiar with using these versions I would be grateful for their advice, particularly as to whether there is any compelling reason <em>not</em> to opt for the cheaper one! I should perhaps say that I am a small-craftsman and not at all informed about the computing technology side of things.</p>
