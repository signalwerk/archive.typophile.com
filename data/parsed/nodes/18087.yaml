      <p>I've just compared both versions. The outlines in both versions are not identical but clearly they come from the same data (probably originally URW Ikarus files). The Elsner+Flake-branded versions typically have twice as many kerning pairs and overall better spacing. </p>
      <p>The ScanGraphic version of Zapf Renaissance Book SC:<br>
      <a href="http://www.twardoch.com/tmp/zapfren_sc_sg.gif" title="http://www.twardoch.com/tmp/zapfren_sc_sg.gif">http://www.twardoch.com/tmp/zapfren_sc_sg.gif</a></p>
      <p>The Elsner+Flake version of Zapf Renaissance Book SC:<br>
      <a href="http://www.twardoch.com/tmp/zapfren_sc_ef.gif" title="http://www.twardoch.com/tmp/zapfren_sc_ef.gif">http://www.twardoch.com/tmp/zapfren_sc_ef.gif</a></p>
      <p>Regards,<br>
      Adam Twardoch<br>
      MyFonts, typographic consultant</p>
      <p>Ps. The "Insert image" does not seem to work, neither in Firefox nor in Safari.</p>
