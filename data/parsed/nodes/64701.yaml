      <p>Suggestions.</p>
      <p>1. Find at least one font that stands out and has some personality. And then use it. Your fonts are very plain.</p>
      <p>2. Work on you grids. Tighten the positive spaces and open up some of the negative spaces. And be more "geometrical".</p>
      <p>3. Think about content. Many of your designs are not bad, but nothing reaches out and grabs. There is a plain-ness to most of your work.</p>
      <p>That said, I would guess thatyou could greatly improve your work by looking to other designers for inspiration.</p>
      <p>Who inspires you?</p>
