    <p>Hello!</p>
    <p>I'm a graphic design student; I've worked on numerous projects, but I'm still very far from good enough. Therefore, I'd really like you to take the time and look through my portfolio - <a href="http://geminianum.carbonmade.com/" title="http://geminianum.carbonmade.com/">http://geminianum.carbonmade.com/</a> - making a few comments, choosing best/worst from it, etc. It'll help me a lot. :)</p>
    <p>Thanks in advance,<br>
    Cheers!</p>
    <p>Neven</p>
