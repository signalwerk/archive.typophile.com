      <p>Definitely some big improvements in style. </p>
      <p>I would explore ways of creating a bit more tension with some energetic grids. Right now, things seem to be floating a bit too loosely in most of your compositions. Sometimes that is appropriate. But whenever you've got type, it's usually good to be tight with it and establish clear hierarchies and spatial relationships. Or at least suggest a reasoning behind why things are placed where they are.</p>
