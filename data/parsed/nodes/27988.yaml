    html: |-
      <p><em>The white spots also occur with overlays when the curve directions are correct.</em></p>
      <p>Yes, but this is a renderering error. We accomodate it in the case of something like the c with cedilla, always being sure to merge the outlines, because there are other problems associated with leaving them unmerged (e.g. when a user applies an outline stroke to the glyph). But in the case of connecting scripts, the bug must be fixed on the rendering side.</p>
      <p><em>Connecting scripts can be designed without any overlap, if you think of Mistral hot metal.</em></p>
      <p>In digital type, though, there must be an overlap for connecting scripts, because greyscale rounding can cause loss of stroke weight or even drop out where there should be connections. At a upm of 2048, Microsoft recommend an overlap of 70 units for Arabic glyphs to prevent this problem.</p>
    html_clean: |-
