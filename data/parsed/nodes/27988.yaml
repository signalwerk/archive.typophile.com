    html: |-
      <p><em>Would that not be a rendering error that must be fixed on the rendering side? Interesting to learn about that issue, however.</em></p>
      <p>Not really, because unlike something like how to handle overlapping outlines, which is something that can affect print as well as screen rendering, the rounding issue is simply an aspect of 'the raster tragedy at low resolutions' (to use Beat Stamm's memorable phrase), i.e. it is part-and-parcel of how we make type for screen. The renderer doesn't know that two glyph shapes are adjacent and are supposed to look continuous; it just knows that here are some outlines and tries to rasterise them as well as it can using algorithms and instruction sets. Since a font is going to encounter multiple kinds of rasterisers (b/w, greyscale, subpixel) from multiple software developers (MS, Apple, Adobe, FreeType...) outlines and/or hints need to be able to ensure correct handling of connections.</p>
    html_clean: |-
      <p><em>Would that not be a rendering error that must be fixed on the rendering side? Interesting to learn about that issue, however.</em></p>
