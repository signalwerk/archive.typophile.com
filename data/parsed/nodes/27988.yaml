    html: <p>PDF rendering (especially prior to Acrobat v.7.0.5) can cause problems like this. I used to have trouble with Arabic in Acrobat for this reason. Have you tried printing the PDF to a PS printer? This might reveal whether the issue is rendering or outline direction. If it is outline direction, I would expect to see it in print also.</p>
