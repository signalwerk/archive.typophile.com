    html: |-
      <p>"‘the raster tra[ged]y at low resolutions’" :) Memorable indeed. </p>
      <p>And an interesting fault dump, too. Because type designers are still alive around here somewhere, the Tragedy, I assure you, is in the Rasterizer: Adobe thinking that two blacks make a white is just plain stupid, and the tragedy that MS thinks "native mode" only ever means sub-pixel positioning making the path to quality longer, but still possible.</p>
      <p>"The renderer doesn’t know that two glyph shapes are adjacent and are supposed to look continuous;"</p>
      <p>The renderer doesn’t know that two glyph shapes are adjacent and, if they are the same, are supposed to look the same, either...</p>
