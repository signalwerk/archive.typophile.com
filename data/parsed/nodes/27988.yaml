    html: |-
      <p>The white spots also occur with overlays when the curve directions are correct. For example, if you forget to "remove overlap" your ccedilla it can have a white spot even if the curve directions are correct. I assume that most DTP applications and printers are developed under the assumption that there are no overlapping contours, not keeping in mind non-latin scripts.</p>
      <p>However, ignoring the fact that overlaps are forbidden could still be called a technical flaw of the font. Connecting scripts can be designed without any overlap, if you think of Mistral hot metal.</p>
    html_clean: |-
