  html: |-
    <p>Hello typo aficionados<br>
    I am at the moment looking for a sans serif typeface to be companion of <a href="http://www.dstype.com/type_families/maga" rel="nofollow">Maga typeface</a> (a serif typeface released by DSType foundry).</p>
    <p>I'll be using this typeface on Light and Bold weights (light for running text and big quotes and bold for main titles ) in a website I am creating at the moment .<br>
    I will use the sans serif companion for the captions, figure caption, and sub-heads, buttons … basically all secondary text.</p>
    <p>I looking for something that is beautiful, readable, modern, and web friendly.<br>
    Something with the size, color and beuty of Rijks Museum <a href="http://www.boldmonday.com/en/rijksmuseum" rel="nofollow">custom typeface</a>. I know that they develop the typeface based on Penno, but Penno doesn't have the same qualities as in this one.</p>
    <p>Give me some hits guys<br>
    Thank you all<br>
    Fábio Santos</p>
