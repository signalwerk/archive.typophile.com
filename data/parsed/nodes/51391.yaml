  html: |-
    <p>My desire to alphabetize and color-code everything extends into my font organization. The problem is, I don't know what to do with those font sets I purchase that have several fonts (e.g. Font Diner's "Casino Buffet", House Industries "House-a-Rama"). I also have many of my fonts in three places: in an A-Z folder, in a folder organized by foundry, and organized by client. When I'm working on a particular client's job I want to drag all their fonts into my manager of choice (FontExplorer X), but it activates all TT and PS fonts (not one or the other) and it becomes quite a jumbled mess.</p>
    <p>Clearly, this isn't working for me!</p>
    <p>I'm wondering if any of you have found a way to organize your fonts on your hard drive that keeps things nice and tidy. Or please feel free to advise me if you think I'm wasting my time with such pursuits. I'm pretty old school; this has been my thought process since 1991. I'm willing to let it go if there's a more modern way of doing this.</p>
    <p>TIA-<br>
    K.</p>
