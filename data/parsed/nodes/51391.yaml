      <p>And I will expand on innovati's iTunes comparison and suggest "playlists". Unlike most of the typophiles here I don't organize by foundry (except rare exceptions like Emigre and House Industries) because that's not how I think of fonts. I don't sit down and say... hmm for this project I'd like to use something by Matthew Carter. So I have sets based more on the attributes than who designed or sold the font. My sets are<br>
      antique/distressed<br>
      calligraphic/uncial<br>
      check these out (new fonts I want to use)<br>
      condensed<br>
      deco<br>
      dingbats<br>
      display/ornate<br>
      emigre<br>
      expert collections (for text fonts)<br>
      funny/silly<br>
      groovy<br>
      grunge<br>
      handwriting<br>
      house<br>
      nouveau<br>
      open type<br>
      retro<br>
      sans<br>
      script<br>
      serif-display<br>
      serif-text<br>
      slab<br>
      techno/futuristic</p>
