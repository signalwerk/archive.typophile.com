    html: |-
      <p>By foundries in the libraries. I say libraries because I keep a master library on my Data drive and a smaller library (duped from the master) on my System drive that is where I import into FontExplorer from. The reason for that is the most common thing that corrupts fonts is when a program crashes while the font is activated.</p>
      <p>By having two libraries I never activate the master font (and I don't like FontExplorer to built it's own little library). Freak, I know…</p>
      <p>In FontExplorer I organize by style.</p>
      <p>pbc</p>
