      <p>I've been dealing with the issue lately also. Here are a couple thoughts. </p>
      <p>I keep only one copy of the fonts organized by foundry—that way, I don't end up with conflicts or accidentally deleting my only copy because I thought I had a duplicate somewhere else. (plus it helps me remember who designed what). In FontExplorer each font can have comments assigned to it. In the comments I'll use adjectives that describe the history, the style, the mood, etc. or add one pertaining to a client. I then create smart sets that use those key words. So if I'm looking for a bold, feminine, sans serif. I can quickly create a set that gets me where I need without endlessly sorting through folders and lists.</p>
