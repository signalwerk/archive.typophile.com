    html: |-
      <p>I'd love to expand on Jeremiah's idea a little.</p>
      <p>I imagine you have a nice music collection, and you may have thousands of songs, from hundreds of albums, from dozens of bands, but there's a clear and easy way to organize them.</p>
      <p>Instead of trying to sort your music by style or tempo or key signature, sort them by who makes them, much like iTunes does.</p>
      <p>Think of your fonts as songs, your font families as albums and the foundry as the artist.  I think it's a really simple idea and I find it works well!</p>
      <p>Just as in iTunes, instead of letting single entries clutter it up, I have a catch-all generic artist that I put all of the loose ends in.</p>
      <p>Also, if you're on a mac and don't already have professional font-management software, there's a free tool (sorry mac-only at the moment, windows port is in the works) offered by Linotype called <a hre="http://www.linotype.com/fontexplorerX" rel="nofollow">FontExplorer X</a>.  It has an interface similar to iTunes and I've found it very useful.</p>
      <p>Another cool feature of this, is that it allows you to enable or disable selections of fonts, so you could easily create a 'playlist' of all the fonts used for specific projects and also manage them that way too!</p>
