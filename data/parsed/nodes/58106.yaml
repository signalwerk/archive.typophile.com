      <p>barkeep said:<br>
      &gt;   the vast majority of people don’t know what they want.</p>
      <p>that’s an overstatement, but there’s a lot of truth to it, yes.</p>
      <p>&gt;   if people don’t know what they want<br>
      &gt;   why don’t we give them something<br>
      &gt;   as good as it can be as standard.</p>
      <p>that’s a very good approach.  intelligent defaults are<br>
      probably the best thing you can do to help people out,<br>
      followed by an interface that seems “intuitive” to them<br>
      if they _do_ decide that they want to change something.</p>
      <p>it’s not always easy to decide what “as good as it can be”<br>
      actually _means_ when it comes to book-design, however.</p>
      <p>even some of the “staples” break down amazingly quickly<br>
      when you start asking people what they actually prefer...</p>
      <p>what percentage of the people prefer sans-serif fonts?<br>
      what leading multiple do most people choose if they can?<br>
      what typesize will be used by people if they can control it?</p>
      <p>none of these questions are ones with “simple” answers...</p>
      <p>and whether or not typographers “agree” on the answers,<br>
      there exists in the population a large degree of variability.</p>
      <p>&gt;   What the current batch of users want my not be<br>
      &gt;   indicative of what a wider audience may want. </p>
      <p>i agree entirely.</p>
      <p>which is why it’s important to give people the ability to<br>
      customize the tool to their own desires and preferences.</p>
      <p>&gt;   Most people just want an easy life,<br>
      &gt;   they don’t necessarily want to fiddle around with</p>
      <p>i agree entirely.</p>
      <p>which is why it’s not enough to give people the ability to<br>
      customize the tool to their own desires and preferences,<br>
      you’ve gotta make sure that the defaults are well-chosen.</p>
      <p>&gt;   So as designers it is our job to design products<br>
      &gt;   as easy to use and as visually appealing<br>
      &gt;   for the majority of people as possible.</p>
      <p>and that’s why i — as an e-book designer — am here.</p>
      <p>&gt;   Maybe when E-book technology is more mature<br>
      &gt;   and the emphasis on E-book construction has<br>
      &gt;   move from being developer-lead to designer-lead<br>
      &gt;   things may change</p>
      <p>um, well, yeah, i don’t think it’s gonna come to _that_...</p>
      <p>not unless you designers decide to learn programming.</p>
      <p>in the absence of that, you’re going to have to settle for<br>
      being advisors to us programmers who have decided<br>
      that we want to learn some design from typographers...</p>
      <p>-bowerbird</p>
