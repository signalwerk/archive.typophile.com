    date: 2009-05-21T18:30:00
    date_raw: 21.May.2009 6.30pm
    votes: null
    html: "<p>URW’s hz program, which included paragraph level justification and linebreaking on which Adobe’s InDesign composers are based, was developed for use in static publishing (in which the text becomes a fixed state prior to delivery to the reader), but in many respects it is particularly appropriate to dynamic publishing (in which live text is delivered to the reader, who may e.g. change the size, change the typeface, etc.). This is what is missing from the software driving eBooks: a justification and linebreaking model that is smart enough to provide, on-the-fly, something close to the standards of a well-typeset print edition for dynamic text.</p>"
    html_clean: "<p>URW’s hz program, which included paragraph level justification and linebreaking on which Adobe’s InDesign composers are based, was developed for use in static publishing (in which the text becomes a fixed state prior to delivery to the reader), but in many respects it is particularly appropriate to dynamic publishing (in which live text is delivered to the reader, who may e.g. change the size, change the typeface, etc.). This is what is missing from the software driving eBooks: a justification and linebreaking model that is smart enough to provide, on-the-fly, something close to the standards of a well-typeset print edition for dynamic text.</p>"
