      <p>sii said:<br>
      &gt;   no one in the eBook world cares about type.</p>
      <p>not entirely true.</p>
      <p>i’m here specifically as an e-book programmer who<br>
      is soliciting feedback on a wide variety of issues...</p>
      <p>i can’t say you guys are using the opportunity wisely,<br>
      not so far anyway, but i am nothing if not persistent.</p>
      <p>as to the particular matter of type — that is _fonts_ —<br>
      the wired article misses the point in a substantial way...</p>
      <p>one of the primary tenants of e-book philosophy is that<br>
      the end-user should have control over the fonts used...<br>
      so the investment of a lot of design considerations over<br>
      that particular aspect of the typography would be wasted.<br>
      the very same situation applies, of course, to web-pages.</p>
      <p>this applies to some other typographical aspects as well...<br>
      should the text be justified or ragged-right?  user decides.<br>
      how tight should the leading be?  however the user likes it.<br>
      how big are the margins? as big as the user wants ’em to be.</p>
      <p>the challenge to an e-book programmer, thus, becomes how<br>
      to offer the end-user the options in an easy-to-use interface,<br>
      and how to best present a display based on the user’s choices.</p>
      <p>this requires a _sensitivity_ to the practices of the typographer,<br>
      an awareness that i am continuously attempting to cultivate...</p>
      <p>-bowerbird</p>
