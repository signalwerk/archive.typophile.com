      <p>This focus on user control seems to lose sight of the fact that design choices are neither arbitrary nor insignificant. If there’s something that the author wants to do that requires a certain artistic control to best express it, then I, as a reader, want to be able to see what they want to show me. I certainly don’t want them to think, “Oh well, it would have been a neat idea, but I’d better leave it out because it wouldn’t work in the e-book.” Things ranging from the Mouse’s Tail in <em>Alice in Wonderland</em> to the nice little black boxes indicating the game clues in <em>Prisoner of Trebekistan</em> would simply start disappearing from the art of literature.</p>
      <p>E-books will never be an adequate substitute for print until they can do everything print can do. My ideal e-reader would be able to display any PDF as it is, and optionally interpret it as plaintext so that <strong>if</strong> I feel the need to change it all to 26pt Georgia ragged right, I can... but if I <strong>don’t</strong> feel like choosing what formatting to impose on a book I haven’t even read yet, I don’t have to.</p>
