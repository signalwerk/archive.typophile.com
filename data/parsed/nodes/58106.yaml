      <p>I’ve had graphic design friends beg for an app that would do that. Alas, CSS can’t be built *well* that way.</p>
      <p>It certainly can be done, though. There are frameworks designed specifically or that, such as BluePrintCSS.</p>
      <p>Alas, those methods tend to work purely on a layout metaphors and don’t always mesh with the semantic content. </p>
      <p>Good CSS design requires a reverse angle of attack compared to the QuarkXPress days. </p>
      <p>All that said, we’ve had discussions of using CSS for print-based formatting of things like books. I know there was that software product out of Australia that did that (Ring a bell anyone? I Can’t recall the name of the product.)</p>
