      <p>Eben is bang on if he says that “John has said about lack of a sophisticated linebreaking and justification algorithm is absolutely bang on”. The same is true not only for e-books but also for web-browsers. (Essentially being the same.) With html/xml and css one may already define flexible layout that can adopt to the circumstances like resolution, display size, window size, desired type size, etc. The sole issue is the above-mentioned lack. Browsers/readers need to do exactly the same as the layout application of your choice does: proper text layout, hyphenation/linebreaking and justification. This would not even require alternative environments like WPF or plug-ins like Flash/AIR, at least not as long as we are talking about mere text ...<br>
