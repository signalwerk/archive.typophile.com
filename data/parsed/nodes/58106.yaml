      <p>“i’m sorry if it hurts your feelings. but users want the control.<br>
      when the choice becomes your design versus their preferences,<br>
      their preferences win out. and it’s not even much of a contest...”</p>
      <p>I don’t  agree with this, the vast majority of people don’t know what they want.<br>
      As a much more experienced and successful man said<br>
      ” A lot of times, people don’t know what they want until you show it to them.” Steve Jobs,<br>
      so if people don’t know what they want why don’t we give them something as good as it can be as standard.</p>
      <p>E-books are pretty much a niche product at the moment. What the current  batch of users want my not be indicative of what a wider audience may want. Most people just want an easy life, they don’t necessarily want to fiddle around with, or can be bothered to change default, settings. As designers it is our job to design products as easy to use and as visually appealing for the majority of people as possible. </p>
      <p>The setting of a book is vitally important to how the text flows and thus how easy it is to read. Maybe when E-book technology is more mature and the emphasis on E-book construction has move from being developer-lead to designer-lead things may change and we may get E-books that look as good as they are as written.</p>
      <p>Martin</p>
