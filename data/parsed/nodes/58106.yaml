      <p>“Sorry Aluminium, I don’t see it as either or, as a designer you make the choice or you do complete designs”</p>
      <p>That sentence is confusing. You say it’s not either/or then make an this or that statement.</p>
      <p>As a visual designer, you do what you can to accommodate everyone. But often your demographic can be quite broad. The nice thing about digital design is that the end user can modify your suggested design to best accommodate their particular individual needs. If one person prefers 9pt type and the other, 14pt, I suppose 12pt would be a nice compromise on paper. Even better online as they can both tweak it a tad further to their preferences. </p>
      <p>Happy Birthday!</p>
