      <p>“As designers it is our job to design products as easy to use and as visually appealing for the majority of people as possible.”</p>
      <p>The error in logic is thinking that it’s either/or. Either we dictate the design as designers, or we give people full control. The nice thing about the digital world, and, specifically, HTML and CSS is that it’s not either/or. We can (and do) have both.</p>
      <p>I admit, I rarely change settings on a particular web page to accommodate my particular tastes, but I’ve done it.</p>
      <p>I can think of more than one printed book that drove me nuts to crazy line lengths, crappy paper or weird justification, though. ;o)</p>
      <p>The best definition of UX/web design I’ve heard is that we’re suggesters. We suggest our best solution, but don’t prohibit the individual from not agreeing. </p>
      <p>Also, I have to love Bowerbird arguing for end-user control while at the same time blocking it with inane hard-returns. ;o)</p>
