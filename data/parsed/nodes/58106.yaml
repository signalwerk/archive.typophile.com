      <p>barkeep — <cite>Personally I can’t wait until designers have the tools to set this stuff correctly as the possibilities of digital books are endless.</cite></p>
      <p>It were be funny to have a layout application that allowed one to visually design with variables, rather than visually placing this exactly here and that exactly there.<br>
      The real issue, in my opinion, is not tools but designers. They have been trained to work within the constraints of layout applications (PageMaker, XPress, InDesign) which follow the “this here and that there” paradigm, and seem unable to approach design from the structure side (as the old fellows did, see Tschichold’s or Caflisch’s book design sketches). Design as illustration. There is almost a fear of “mere” structure. It would take a whole new generation not infected by the “this here and that there” virus. Here and now, maybe web designers are better prepared than print designers.</p>
