      <p>I’m not so concerned about the choice of types as I am by the lack of sensible H&amp;J schemes in e-books. Maybe it has been solved since I last read a book on Kindle in November. But that was for me the most jolting part of the experience. Perhaps for any text there will be an optimum size that allows for good H&amp;J for that text. But when the type size is adjusted for individual eyes or reading conditions, any optimum goes away.</p>
      <p>Displaying Kindle texts as FL/RR won’t help this. There will still be far too many instances in which the machine cannot handle hyphenation, and will throw unsightly white space where it ain’t supposed to be.</p>
      <p>Figure this out and I’ll be more likely to buy an e-book device. Well, figure out the economy so I can afford one, too. Right now the library wins out, hands-down.</p>
      <p>powers</p>
