    html: <p>Hopefully this will change in the near future. I know that at least one book publisher is working on a subsidized ebook reader because printing costs are so high and so many books lose money. Now that Amazon is planning to use cheap ebooks as a loss leader and bring in money with subscriptions to other content I expect to see more publishers jump on board. If we suddenly have competing cabals of companies that actually understand typography all trying to best Amazon and each other we’ll hopefully see better ebook typography, and maybe some really great typefaces commissioned for ebook screens.</p>
