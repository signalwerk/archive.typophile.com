    <p>Just visited the <a class="freelinking-external" href="http://www.typography.com">Hoefler and Frere-Jones</a> website to see if Chronicle was up for sale, and it is, along with a revamped website. Noticed the have a new print catalog for free. Also noticed they are now offering OpenType versions of several of their fonts—Gotham, Whitney, Didot,etc.</p>
