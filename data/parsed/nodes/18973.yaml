      <p>I have a specimen titled "Erbar Mediaeval Schriften", it's from Ludwig &amp; Mayer, beautifully letterpressed. It contains text faces, titling/display faces, ornaments, borders and examples of use, it's printed in black, red and yellow. I bought it and another specimen (that one's from 1936, I couldn't date this one) at our local market here in Hungary, for about 20$.</p>
      <p>The text you have posted is definitely set in Erbar Mediaeval. There is another version of the capital "T" in my specimen, with the terminals angled outwards, not parallel.</p>
