    html: |-
      <p>The design looks like been made between 1910 - 1925. Since the body text is the same design, it could be available on a type setting machine. The bold seems to have the same wide like the roman, so my guess, its a linotype matrice. In this time range, the First Hungarian Type Foundry has produced lots of typefaces and matices for this region. Berthold AG, <a href="/wiki/D.%2520Stempel%2520AG" class="freelinking" rel="nofollow">D. Stempel AG</a>and Bauersche owned this foundry. Hope this helps.</p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
