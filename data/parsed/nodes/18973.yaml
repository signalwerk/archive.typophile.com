    html: |-
      <p>The matrices almost certainly do not exist. I've been told that L&amp;M matrices could theoretically still be stored as reference at Neufville in Barcelona, but if they don't have any, you are sadly out of luck :(</p>
      <p>Frankfurt and its greater area (including Offenbach) were a hot-bed of typefounding before the second World War. This was an industrial area, and was virtually destroyed during the war. There is very little in terms of remaining materials, sadly.</p>
      <p>Various museums or collectors would have printed samples of L&amp;M faces. I think that these serve as better models for digitizing anyway. Matrices are a little thin, because they took into account that ink would spread on paper, creating the final letter image.</p>
