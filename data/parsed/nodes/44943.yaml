      <p>&gt;Phi is not harmonious </p>
      <p>Yes, 'phi' came later. The first recognition of 'irrational numbers, such as phi, also came later. </p>
      <p>When it was discovered that the diagonal of the square was incommensurable with the side it was a refutation of the original Pythagorean program, which was based on the idea that everything was based on integers. "Incommensurable" means that there is no unit such that it divides both the side and the diagonal of the square evenly, with no remainder. This surprising discovery, also known as the discovery of 'irrational' numbers, was one of the greatest discoveries in mathematics. The Pythagoreans allegedly thanked person who first proved the incommensurability of the diagonal of the square by drowning him in the Aegean sea, and subsequently keeping the incommensurability as a 'great secret' of the brotherhood. I guess the secret subsequently got out. </p>
      <p>The Greeks later learned--maybe for the first time in history--how to disagree without drowning each other. That was also a great advance in the history of humanity. </p>
      <p>Popper tells the story in his book "Conjectures and Refutations".</p>
