      <p>I sometimes think we who design things can be hyper-sensitive to design. I hope I never don't read a book because it has a lousy jacket design or lousy text typography. I read books because I want to know what is in them or to be entertained by them, not in order to appreciate or condemn their design. I am not a typographer 24/7/365. If I want author X's take on event Y, this is the only way I'm going to get it (in printed form).</p>
      <p>But Nick's questions are good ones, and colleagues in the book racket have addressed most of the causes of this design dis-connect above; so I need not belabor them. But, as a staff design &amp; production manager, I have to admit some complicity in this. At times I have to get a book jacket designed for publicity use before the author is even finished writing. I may end up sending the jacket design to a designer who is not suited to design the text, but I don't know that on that date. &amp; then design for the jacket may not have many "adaptable" elements a text designer can pick up on.</p>
      <p>This is not an ideal situation, I agree. But I also agree that the incidence of damage from bad book design is much lower than from, say, bad can opener design. I hope that until I go blind I shall never give up reading, regardless of the lousy design work I may have to plow through.</p>
      <p>Now bad printing, that really irks me. Bad printing can sabotage a good design. But I doubt I'd not read a book that was badly printed, either. Right now I'm reading the Penguin paper edition of Coetzee's "Waiting for the Barbarians." Mediocre design, terrible printing, but I'm still reading.</p>
      <p>As to Nick's other comment about "ordinary books": evidence is that designers of "ordinary books" do not read Bringhurst, nor Rich Hendel's "On Book Design." Missing ligatures, false smalls, lining figs, bad margins: they all attest to this.</p>
      <p>Do not look to any publication's list of best books for any hope of finding well-designed books. Only rarely do reviewers have any awareness of book design. Even for those who may feel we are living in an era when more attention is paid to design, I think it is too much to expect book reviewers to chat about design.</p>
      <p>That's the view from here, today. From a guy who has spent 40 years trying to make books look good—and at times succeeding, I think.</p>
      <p>powers</p>
