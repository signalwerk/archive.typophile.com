      <p>I agree that this book is terrible in every aspect but its awfulness is completely standard. It doesn't matter whether it is Britain, the U.S. or Australia, book design is at a terrible low: a combination of economics, trash imitates trash, and a disconnect between design and function. With many paperbacks produced by simply photo-reducing the hardcover design and printing it on rougher paper, the result is often actually unreadable. At least in Nick's example the book can be read; certainly that is not always the case. People complain that the young don't read enough: we should try to make books that <em>can</em> be read. (Thank God for Knopf — the exception to the rule!)</p>
      <p>The very same complaints could be made about the music industry. The trash-imitates-trash aesthetic rules there as well.</p>
      <p>In the end it's stupid: you sell less, and because you destroy the consumer's confidence, <em>everyone</em> sells less in a downward spiral.</p>
