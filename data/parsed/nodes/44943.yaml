      <p>As a mathematics major, I am wary of many claims surrounding the golden ratio and the Fibonacci sequence that pop up all the time in popular mathematical writing and indeed in popular culture, as there are too many exaggerated and fantastic claims. I've heard mathematicians ridicule the handling of the Fibonacci sequence in <em>The Da Vinci Code</em> (I can't comment on it as I haven't read the book, but it does strike me how specialists in almost every field from art history to astronomy seem to have gripes about how the book got it completely wrong).</p>
      <p>The Fibonacci sequence and the golden ratio are indeed very important and common in nature, but they only appear where they have a reason to appear. Too many people have tried to find examples of the golden ratio in nature and art without a sense of why they arise. And if you're looking for something as simple as an approximately 1.618:1 ratio, you're going to find it somehow. Oh look, the length of the leaves and the stem sections between the leaves have something close to the golden ratio! And if you take the height and width of the lowercase k glyph in that typeface, it's around 1.6!</p>
