      <p>The New York Times Bestseller List is a horrible litmus test for literary merit.  Simply because a lot of people buy a particular book bears little indication of it's quality.  Once in a while, truly good literature ends up on the list, but usually it's Dan Brown or James Patterson.  That being said, it's little wonder why the typography is lackluster, if not terrible.</p>
      <p>The books on the NY Times list are always from major corporate publishers—Harper-Collins, Houghton-Mifflin, etc.  Conversely from Britain, i.e., where for a long while, publishers were regarded the standard-bearers of a literary tradition steeped in timeless mastery of the written language, US publishers seem to consider themselves not unlike any other manufacturer of consumer products.  The care and artistry once put into producing books (ironically enough, at a time when the process was far more labour-intensive, and required far greater skill) are now but vestiges, on occasion loosely mimicked in contemporary design, ultimately mocking the technological advances which, by all accounts, should in turn have advanced the craft.</p>
      <p>This has become the norm because the people in decision-making capacities at these publishing houses are MBAs, not literati (to say nothing of designers or typographers).  Of concern to these people are movie-rights and marketing—the literary value (much less the design quality) of the books is almost negligible.  i'm certain i'm not the only one here who's had the awkward experience of trying to convince a client to spend an extra hundred bucks or so on a typeface, or a few more hours to lay out a book correctly.  i'm convinced that desktop-publishing has caused people to consider speed an ample substitute for quality (or that the two are equally interchangeable).  Furthermore, nobody in design school ever seemed to care about traditional typography...everyone was attracted to the edgy, David Carson stuff.  Don't get me wrong...i delight in breaking the rules as much as anyone—particularly when the project is gagging for it—but anymore, i notice that when people pick up a book that doesn't look like it was printed straight from Microsoft Word, they definitely take notice—usually, they say, "It looks old!"  The problem with corporate, MBA types is that—in my experience—they can't tell the difference, even if it was in fact printed directly from Word.  Though i'm tempted to digress—into what large-scale failures in education, or the modern propensity to study only the discipline in which one intends to make a living, willfully neglecting all other aspects of culture and knowledge, and how these relate to the current hideousness of printed —i'll spare you my further waxing philosophical.</p>
