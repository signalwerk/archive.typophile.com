      <p><cite>So how does this square with the falling standards of book typography?</cite></p>
      <p>It doesn’t and that’s the part that seems to piss so many people off. I think the poor design of mass-market books is particularly glaring because at a time when so much effort and money are poured into designing really complicated stuff—often just to make it seem simple!—something as simple as books is often ignored. Why aren’t the interiors of mass market books treated with the same simple, elegant design systems that publishers manage to put into every cheap collection of classics, or series of crap video game tie-in sci-fi stories? Wouldn’t it cost less?</p>
