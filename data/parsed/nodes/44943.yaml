      <p>When I was creative director at a small publisher, it was not unusual to need the cover as much as six months before the interior was set to go to design. Hell, sometimes the title wasn't even finalized before we needed tight comps for sales conference. (Catalog date was the deadline for finalizing titles, and it was not uncommon to have to rework a cover or two the night before.) Manuscript wasn't often available, so any brief came from an outline or a marketing blurb. I usually had the luxury of sitting down with the editorial director and the acquiring editor for an in-depth conversation about the book -- much better than talking to marketing alone.</p>
      <p>Covers are always caught in a tug-of-war between Editorial and Marketing. It has to be accurate enough to adequately reflect the editorial tone and content; it has to be sexy enough to satisfy marketing. These are often two competing concerns. Left entirely to Editorial, a book cover would reflect and describe the content completely accurately, and be totally boring. Left entirely to Marketing, a book cover would be flashy, look like the best-selling competition (only different), consist primarily of the current colour-du-jour, be full of buzz words, and have very little to do with the topic.</p>
      <p>For most of our titles, it was neither practical nor always the best course to have the same designer do both the interior and cover. Different skills and strengths are needed. Navigating the ins and outs of feedback from marketing and understanding the marketplace and trends for covers is a different skill set from managing complex hierarchies of textual structure, illustrations, charts, tables, etc., and responding to editorial needs and input. Not a lot of designers can do both equally well. </p>
      <p>I felt it was my job to try to keep the outside and inside harmonious through my direction, to the extent that I could under the other inevitable constraints and challenges. The title page was one place I often stepped in directly to design a transition from outside to inside. Also, back cover and flaps were another area where a little coordination could help bridge the gap.</p>
      <p>-- K.</p>
