      <p>I was reminded of this earlier post to this discussion when I started reading a new book this weekend:</p>
      <p>&gt;&gt;  Everyman’s Library (produced by a division of Random House, I believe). I think that the books are beautifully made and designed (and each one includes a blurb at the back about the typeface used). &lt;&lt;</p>
      <p>In many ways Everyman's Library does make good books. The slightly flexible boards are nice, as is the ribbon bookmark. Nice, smooth, natural paper, albeit with some show-through. Nice page size (5" x 8.125"). The spine is stamped in two colors, but the type is breaing up. Overall, at 824 pages, it is very nice in the hand. </p>
      <p>But it has typographic oddities. The text is set in Bembo (with that damned long-tail R). But the frontmatter is set in Baskerville, except for the two-color title page and the copyright page, which are set in Monotype Garamond. </p>
      <p>That's a lot of type mixing for a collection of 5 novels. I'm sure it gets in no reader's way. It is not something I'd do in such a book, and I'm curious about why the mixing. I seem to recall that the Everyman's edition of John Updike's Rabbit novels gets the same type treatment. </p>
      <p>For what it is worth: This venerable series, over 100 years old, is now published in the USA by Knopf.</p>
      <p>powers</p>
