      <p>&gt;No, but I have read (or at least picked up in the store) books that have really nice jacket designs.</p>
      <p>As a writer, let me put in a word for the value of good interior design. Once the title and jacket design or the name of the author get you to pick up the book, then you look inside. If this is visually inviting and easily readable, you are more likely to sample it extensively. And then, if you like the content, buy the book. </p>
      <p>I think it is something like wearing flattering, suitable clothes. It isn't going to make an ugly person beautiful, but it will help soften the blow, and will make the beautiful person glorious. </p>
      <p>Here analogy to 'beauty' is what the writer wrote. Good interior design won't make a bad book good, but it will make a good book more inviting to read. </p>
      <p>If the book is a non-fiction one where structuring information is important to usability of the book, like a cook book or text book, or--for different reasons--art book, then visual presentation actually becomes part of content quality.</p>
