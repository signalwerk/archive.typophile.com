  html: |-
    <p>There was recent mention of the Bringhurst "bible" and its focus on book typography.<br>
    I looked at the book I'm presently reading. A somewhat anecdotal approach for generalization, but a pretty typical example of what's out there.<br>
    The book is a finalist for the Los Angeles Times Book Prizes, and made the New York Times Bestseller list, so there is absolutely no excuse for the cheap and shoddy typographic design, which, according to Mr Bringhurst, dishonors the text.</p>
    <p>It severely pains me to read the damn godless thing, which is frustrating, as it's quite interesting, and I would like to finish it.</p>
    <p>Here are a few of the issues.<br>
    .</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cover_5986.jpg"></div><br>
    1. The cover. A bit dreary, but nothing terribly wrong, apart from a bit of sheep shagging. The question that must be asked though, is why this bears absolutely no relationship to the design of either the title page or the main text. Isn't there something horribly wrong with this institutionalized norm?<br>
    .<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/first_6031.jpg"></div><br>
    2. The very first page. Right off the bat, faux small caps!<br>
    .<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/title_5830.jpg"></div><br>
    3. The title page.<br>
    .<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/spread_4293.jpg"></div><br>
    4. Main text. Where are the margins? There's nowhere to put my thumbs! It's incredibly dysfunctional to be holding the book at the top as one reads the bottom of the page, causing shadows, and making one's arms ache.<br>
    .<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/closeup2_6203.jpg"></div><br>
    5. Tabular lining figures. This is a book with a lot of numbers in the text, so wouldn't that be a tip-off to the publisher that it might end up looking like a technical manual? Didn't they notice? There's nothing inherently wrong with the Century style of face for text--except that surely, in this day and age of InDesign and all the marvellously-featured fonts that Adobe bundles with it, a book publisher would use a typeface that has old-style figures, or at the very least, proportional figures? Finally, a small thing; it would have been better to not break lines between the numbers and "Hz". And wouldn't ff ligatures be nice?!<p></p>
