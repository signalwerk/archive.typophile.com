      <p>It would be nice to think that there is very tidy logic in nature or mathematics that binds all things together in a predictable way so that we are guaranteed both functional and aesthetic perfection if we as designers simply use the golden section or Fibonacci series. Scientists have never even worked out the Unified Fields theory so why would we assume that all things we do will just be perfect if we follow a certain pattern of ratios? That is not to say that there is something wrong with pursuing that path as a way of working, it just means that there is no guarantee that it is correct and no way to test it accurately. It certainly does not mean that that is the only way or even the best way to solve a visual problem. We love the romantic notion that the Chambered Nautilus contains the secret formula for aesthetic perfection but we can arrive at any sensible visual logic if we apply a different ratio consistently. There may well be an Uncertainty Principle for visual structure in typography as there was for Hiesenburg in Quantum physics. </p>
      <p>ChrisL</p>
