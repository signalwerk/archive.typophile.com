      <p>Just finished reading Kate DiCamillo's <em>Miraculous Journey of Edward Tulane</em> (2006) with my daughter. Great story (as always from that author) but really irksome typography. Some unbearable lack of kerning, esp. in the all-caps lines that lead into each chapter.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/p53_4671.jpg"></div><p></p>
      <p>CER T AINL Y?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/p133_5764.jpg"></div><p></p>
      <p>Look at that "BRYCE"!</p>
      <p>This is otherwise a very nicely produced paperback - lovely illustrations, nice paper, etc. </p>
      <p>The colophon says the type is "CentaurMT." Is this some strange, misguided attempt to evoke the unkernable days of Monotype machines, or did the book designer tragically have a switch off? In a book about a rabbit named "Edward Tulane," you're going to have a good number of "WA"s and "Tu"s - why would you neglect kerning?</p>
      <p>And the question behind these questions is, I suppose: should I be worried that I've reached the point at which I get worked up over kerning in a children's book?</p>
