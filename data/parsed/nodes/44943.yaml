      <p>I recently picked up the new Umberto Eco book after seeing him speak in Toronto. He was wonderfully witty and made reference to history and contemporary events in his own unique stream of consciousness. </p>
      <p>I wanted this book and was pleased to find a copy locally. The person in the bookstore knew exactly where to find it and as she handed it to me I was already smiling at the use of Bodoni on the cover. One hopes for that perfect unison of author and design, which is so rare. I opened it tentatively, already aware of my slight disappointment at the imperfect use of too many sizes on the cover, and then a very unusual thing happened. The quality of the interior blew me away. 10 pt Bodoni Book (a very difficult and tiring font to read on extended text) has rarely looked better (with so few refinements). Perfect scale and leading (10 on 15 pt) and adequate margins (plenty on the outside and more on the inside) create true legibility here, and the timelessness and modernity which Bodoni lends perfectly reflect Eco's vision. </p>
      <p>For me this piece of book design (while also imperfect and probably produced under typical commercial limitations) is the exact opposite of "This is your Brain on Music" which I also bought for its content, and which I must agree is a design failure of immense proportions.</p><div class="imageWrap"><img src="http://typophile.com/files/cover_5333.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/spread_5414.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/detail_4313.jpg"></div><p></p>
    html_clean: |-
