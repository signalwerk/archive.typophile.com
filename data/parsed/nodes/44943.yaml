      <p>I think Patty gives good insight into the failed process. The business model of publishing is a bit of a wreck and the books themselves are not even a tertiary priority in many cases.</p>
      <p>So many editors and designers now have no office, and the imprints are bought and sold multiple times during the development of any given book. It is often the case that managers don't keep up with who is on the payroll and what they are doing. People are taken on and off projects to manipulate the quarterly stock results in anticipation of another buy out. It is considered that simply having "product" in the ”pipeline" is enough on paper to make the company appear legit.</p>
      <p>Maybe it is like cars in the '70s—quality will hit a low point and then slowly return to some smarter, faster more efficient model that doesn't match what was but is better than what is. I would be happy if there was some sense that a cover should relate to the interior, and that communication between the crafts people making a book was worth fostering.</p>
