      <p>I find it hard to study for exams when what I have are handouts photocopied from books with great content and terrible typography. It makes me want to type the whole thing and fix it.</p>
      <p>It's saddening that the academe, in a way, does not care about typography at all. As long as it gets published, like most you guys said. They don't realize that to be able to present one's self clearly in writing, one must use language and typography at the same time. Unfortunately, it seems language is the only important factor in clarity, for them at least.</p>
      <p>I'm actually planning on writing an article about falling typographic standards in the school, such as papers (I've seen people who used Comic Sans all the way). My professors even recommend long line lengths (small margins) and double-spacing. Eugh.</p>
      <p>Right now, I'm reading Terry Pratchett's The Last Hero. The illustrations are good, but the type is set in Bodoni (or a relative). It is a pain.</p>
