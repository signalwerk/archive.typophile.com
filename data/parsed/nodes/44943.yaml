    html: |-
      <p>Most trade publishers have completely separate departments to design the cover and the interior of the book. It's one reason I like to design illustrated books - I control every aspect of the book's design from typography to head and tail bands.</p>
      <p>Here's an illuminating story - I was hired to design the interior only of a trade cookbook. I asked to see the cover so I could try to match the type. They told me it wasn't necessary for them to match, so I did a sample design on my own. Then they came back to me and said yes, why not try to match the cover. They sent me the cover design. It was hideous, but I was able to patch together something passable using the fonts they'd used (fonts I would never have chosen on my own). When I got the final book, they had changed the cover completely. The new cover was equally awful and I had done an interior I didn't like to match an ugly cover that never got used.</p>
      <p>As Claas said, the cover is considered (in trade publishing) a marketing tool, and subject to much more scrutiny than the interior of the book. It is often done way in advance and can change a lot. Trade book interiors are basically churned out. That said, there is no excuse for bad typography. I just read a book set entirely in Rotis. It was pretty painful.</p>
      <p>I prefer the UK version as well - at least it's trying to say something.</p>
    html_clean: |-
