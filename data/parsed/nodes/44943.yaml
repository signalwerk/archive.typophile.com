      <p>William — I seem to be the sceptic here to your believer. Much of what is said about the Pythagorean brotherhood is historical nonsense, and the stories told about the discovery of squareroot 2 are later fabrications (some 800 years later in many cases) that have no claim to historical veracity. For the scholarly accurate story on this have a look at The Mathematics of Plato's Academy, by David Fowler. I think it will shock you how little is really known. The earliest attested books on Incommensurable magnitudes are by Democritus (all now lost) and he lived not long after the probable date of Pythagoras's death. So if the Pythagoreans tried to keep it a secret they did a miserable job.</p>
      <p>I perfectly agree with you however that the discovery of irrational magnitudes was a watershed moment in the intellectual life of Greece. I think it was the defining discovery of Plato's mathematical philosophy. The discovery is too little appreciated today.</p>
      <p>Books designed on the trim size of the Golden ration are, I think, badly designed books: it is the triumph of theory over aesthetic judgement.</p>
