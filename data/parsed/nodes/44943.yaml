      <p>Perhaps it's easy to be so entranced by the role of the golden ratio in the proportions of a chambered nautilus shell or sunflower patterns that you elevate the golden ratio into an all-around aesthetic ideal. The Pythagorean brotherhood made some great discoveries about numbers in nature, but fell into this trap of mysticism that rational number proportions contained the key to everything. What irony that phi itself is irrational. The Pythagoreans knew about phi as well as the diagonal of the square, but had trouble with the notion that they couldn't be expressed as proportions of integers because they had built themselves a mental prison of picturing the universe to be built up of only integers and proportions of integers.</p>
      <p>Returning to the golden ratio in book typography, I think it's neat and symbolic, but I doubt that it's necessarily an objectively superior ratio to all other ratios in terms of aesthetics. It's difficult to make universal, cross-cultural, objective statements about aesthetical standards anyway.</p>
      <p>As long as we're talking about the golden ratio, <a href="http://www.stormtype.com/typefaces-fonts-shop/families-35-pentagramme-pentagraf">Pentagramme</a> by František Štorm is an interesting experiment in faithfully following the proportions of a pentagram in typeface design. The golden ratio plays an important role in the construction of the pentagram, as each intersection of the edge results in a golden ratio.</p>
