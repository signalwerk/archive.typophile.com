      <p>Patty:</p>
      <p>Thanks for that comment. It spurred me to go to a big box bookstore &amp; look at all the Everyman’s Library books I could find: maybe a dozen books; the results were interesting. I own only two volumes of the EL current series. Both are set in the Bembo/Baskerville/Monotype Garamond combo. When I wrote that post above I made the assumption that all other series volumes were so set. Wrong.</p>
      <p>I found most texts set in Bembo. I also found Janson, Baskerville, Erhardt, and one face I could not ID (hangs head in shame). All frontmatter texts were set in Baskerville. There were two different title-page arrangements: one the 2-color I mentioned, the other using Mono Garamond in black and screens.</p>
      <p>Whether or not these type switches were done “carelessly,” as you ask is a good question. All volumes credit “typography” to Peter B. Willberg, a designer of good repute whose name I’ve seen for a long time. The “book design,” which I think must refer to case, jacket and overall format, are credited to Knopf stalwarts Barbara de Wilde and Carol Devine Carson. In the new volume I just bought, typesetting is credited also.</p>
      <p>With top-flight designers such as these, I’m thinking the type changes had not been done carelessly. Just why they were done is an interesting question. I did not have pencil &amp; paper, so I did not track publication dates and type use. I’ll leave that to a design graduate student.</p>
      <p>When Bembo is used, it is subject to size variations to get the volume to a desired page count. The volume of Camus’ collected novels is reasonably set. The thin volume of “The Plague” is set in Bembo way too large for decent reading: gotta push out that page count.</p>
      <p>powers</p>
