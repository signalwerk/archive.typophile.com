      <p>Yes, some conjuncts can be created from sequences of so-called half forms, and the OpenType Layout model for Devanagari enables this. [Unicode also provides a control character mechanism to force half forms if supported by the font; this can be used to override vertical conjuncts with horizontal layout.] If the sequences of half form(s) and full form are carefully kerned in the font, the result can be really quite acceptable. Quite a lot of rare conjuncts are displayed in this way with the Adobe Devanagari fonts, and one can't easily tell from the resulting typeform that one is looking at a half form sequence instead of a ligature (until, that is, one enters an ikar after them, because the variant width ikar selection currently only works with ligatures).</p>
      <p>Now, all that said, in some conjuncts, especially wide ones, a subtle reduction in the width of the component letters is desirable, and then in some cases modification of stroke weights to maintain an even colour on the page. Or some form of optical  correction of overlapping segments might be desirable. So half form sequences are not always the way to go.</p>
      <p>[As noted in this <a href="http://typophile.com/node/95785#comment-520041" rel="nofollow">other thread</a>, the Linotype hot metal composing method formed many individual letters from combinations of half form and long a vowel sign.]</p>
