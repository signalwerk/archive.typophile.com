      <p>Mr. Hudson:</p>
      <p><strong>"ब्न | dBNa | Coulson"</strong></p>
      <p>The Agenbroad collection is "old hat" to me.</p>
      <p>In my comprehensive book <strong>"Conjuncts Consonants in Sanskrit"</strong>, which is an unpublished work according to German Copyright Law and according to the Revised Berne Convention and which I cannot yet make available to others prior to publication, I wrote this on the invented ligature "bn":</p>
      <p><cite>"Charles Wilkins (1808), Alix Desgranges (1845), M.R. Kale (1894), Richard Fick (1922), A.A. MacDonell (1926), H.M. Lambert (1953), Michael Coulson (1973) and Madhav M. Deshpande (1997) invented the conjunct consonant "bn". If "bn" were no invention, then a Sanskrit word would exist containing "bn". But there does not exist any such Sanskrit word. Therefore "bn" has been invented. Yet "bn" could occur in a foreign-language word, e.g. in "abnormal", inserted into Neo-Sanskrit texts. But serious scientific research on Sanskrit conjunct consonants must dismiss such "abnormalities"."</cite></p>
      <p>If you search for "bn" in the huge Sanskrit dictionary file</p>
      <p><a href="http://www.sanskritweb.net/sansdocs/reverse1.pdf" title="http://www.sanskritweb.net/sansdocs/reverse1.pdf">http://www.sanskritweb.net/sansdocs/reverse1.pdf</a></p>
      <p>you will not find any Sanskrit words containing "bn"</p>
      <p>Since Sanskrit words with "bn" are non-existant, it does not make much sense to design the ligature "bn" for a Sanskrit font, because this ligature will never be used on account of the fact that Sanskrit words with "bn" do not exist.</p>
      <p>More than 300 of the approx. 1000 conjunct consonants, i.e. roughly 30% of the collection by Agenbroad, are entirely fictitious, <strong>as far as Sanskrit is concerned</strong>. </p>
      <p>Some of these 300 ligatures compiled by Mr. Agenbroad may occur in foreign-language loan words in Hindi and Marathi texts, but they definitely do not occur in ancient Sanskrit texts. That is for sure.</p>
      <p>In the funny book "Spoken Sanskrit" edited by S. S. Janaki and published by the Kuppuswami Sastri Research Institute in 1990, you will find a fictitious Sanskrit report on a tennis match at Wimbledon between Björn Borg and John McEnroe.</p>
      <p>For typesetting the name "Wimbledon" in Devanagari, you could invent the ligature "mbl", and in fact, this invented ligature is contained in the Agenbroad collection and also contained in the book by Mariano Rampolla del Tindaro, Lingua Sanscrita, Romae 1936. But this does not mean that this entirely fictitious ligature "mbl" will ever be required for typesetting an ancient Sanskrit text, since there never existed a Sanskrit word containing "mbl". This is a fact which you can check yourself here:</p>
      <p><a href="http://www.sanskritweb.net/sansdocs/reverse1.pdf" title="www.sanskritweb.net/sansdocs/reverse1.pdf">www.sanskritweb.net/sansdocs/reverse1.pdf</a></p>
      <p>or here:</p>
      <p><a href="http://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/tamil/index.html" title="www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/tamil/index.html">www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/tamil/index.html</a></p>
      <p>Do <strong>substring</strong> search for "bn" and "mbl" on Cologne Digital Sanskrit Lexicon (166,434 entries). You will get no hits at all for these entirely fictitious ligatures.</p>
      <p>So, why should you care to design fictitious ligatures for fictitious Sanskrit words?</p>
      <p><strong>Note:</strong></p>
      <p>The "Samyoga table" mentioned by Mr. Hudson is downloadable here</p>
      <p><a href="http://www.ctan.org/tex-archive/language/sanskrit" title="http://www.ctan.org/tex-archive/language/sanskrit">http://www.ctan.org/tex-archive/language/sanskrit</a> as file sktdoc.ps</p>
      <p>If you convert this ps file to a pdf file, it will be searchable.</p>
