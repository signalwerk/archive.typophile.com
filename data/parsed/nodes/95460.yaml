      <p>&gt; If you mean क्स्प्र then you are right.</p>
      <p>That is what I mean. The Adobe Devanagari font contains conjuncts which cannot occur in Hindi for linguistic reasons. In Sanskrit, theoretically, "kspr" could occur by combining a word ending in "k" with a word beginning with "spr", just like combining in English "ink" with "spray" to "inkspray" which would/could contain the "kspr-conjunct" (in-kspr-ay).  But these are "wordplays" which do not have a linguistic basis. Therefore, I think, several conjuncts contained in the Adobe Devanagari font were invented just for fun.</p>
