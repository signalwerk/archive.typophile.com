      <p>Mr. Hudson:</p>
      <p>Having stated above on 4 Sep 2012:</p>
      <p><cite>"Charles Wilkins (1808), Alix Desgranges (1845), M.R. Kale (1894), Richard Fick (1922), A.A. MacDonell (1926), H.M. Lambert (1953), Michael Coulson (1973) and Madhav M. Deshpande (1997) invented the conjunct consonant "bn". If "bn" were no invention, then a Sanskrit word would exist containing "bn". But there does not exist any such Sanskrit word. Therefore "bn" has been invented. Yet "bn" could occur in a foreign-language word, e.g. in "abnormal", inserted into Neo-Sanskrit texts. But serious scientific research on Sanskrit conjunct consonants must dismiss such "abnormalities"."</cite></p>
      <p>it seems to me that you and Mrs. Fiona are trying to find an attestation for the ligature "bn" in Sanskrit in order to prove that I am wrong.</p>
      <p>I should like to mention that you are not the first ones who tried to do that.</p>
      <p>However, it seems to me that Mrs. Fiona did not learn Sanskrit, otherwise she would not have said that</p>
      <p>अब्नाभः ="abnābhaḥ"</p>
      <p>was given in the Monier-Williams dictionary. The usage of this dictionary is tricky and error-prone for non-Sanskritists. On page 60, middle column, the main entry starts with "ab-ja" which is a compound in itself composed of "ab" (from "ap") + "ja". A few lines below, you see "-nābha" (and also "-netra").</p>
      <p>The compound here must be build as "abja-nābha", and not as "ab-nābha", as was thought by Mrs. Fiona. But the correct compound "abja-nābha" does not contain the ligature "bn".</p>
      <p>Theoretically or "exempli gratia" or "just for fun", it would be possible to construct a Sanskrit compound word  containing the ligature "bn", for example the compound</p>
      <p>अब्निर्वाण (= abnirvāṇa = "the nirvana in the water")</p>
      <p>invented by me here exempli gratia. But you will never find any attestation for this compound.</p>
      <p>I do not deny that it is theoretically possible to find the combination "bn" in any old Sanskrit text, but none was found so far.</p>
      <p>The statistics mathematician and font lover Luc  Devroye would say that from the probability point of view, the mathematical likelihood that a Sanskritist will ever need the ligature "bn" in a font for typesetting a real Sanskrit word is converging to "zero", "nil" or "nought".</p>
      <p>For example, by analyzing Panini's grammar, I found exactly 114 additional artificial ligatures pertaining to Panini's acronym-like grammatical elements. But I included none of these artificial acronym ligatures into my official ligature list here</p>
      <p><a href="http://www.sanskritweb.net/itrans/itmanual2003.pdf" title="http://www.sanskritweb.net/itrans/itmanual2003.pdf">http://www.sanskritweb.net/itrans/itmanual2003.pdf</a> (page 29 seq.)</p>
      <p>because none of these artificial acronym-like ligatures could be found in any ordinary Sanskrit text.</p>
      <p>Additional note for scholars: "abja-nābha" occurs in the Bhagavata-Purana repeatedly. Hence it is an attested compound word.</p>
