      It does not matter that "OCR software is oriented around the Latin alphabet". The Cologne project had Indians working (not Frenchmen) on the proofreading but there are thousands of errors left. I've been submitting my five cents every few months, but it would take around 50 years to fix all of them at such a rate. And there are several editions of the OCR texts from Cologne - not always newer is better, new errors arive as well (because of converting to the new markup as well). Anyway - nobody else has done even 1/10 of they've done so you can't say a single bad word about them. One heels only gratitude and can't say enough "thank you"<br>
      After all those OCRs where done <a href="http://www.indsenz.com/int/index.php" title="http://www.indsenz.com/int/index.php" class="link-external">http://www.indsenz.com/int/index.php</a> was released. It was unreliable in the beginning. But as of 2013 it has a very small error rate and is the best OCR software for devanagari. ABBYY Fine Reader (a trained one) does not comes even close. No other (inlcuding Indian coders) comes close. I've explored the OCR market, I know what I speak about.</p>
