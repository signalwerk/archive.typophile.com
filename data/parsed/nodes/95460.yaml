      <p>Uli: <em>From the scholarly point of view, I think that it is ridiculous to invent unique ligatures for proper names.</em></p>
      <p>From a scholarly point of view, I agree, but these conjunct ligatures were made at the request of <em>newspaper publishers,</em> who are perennially concerned with column width and word length, and for whom being able to reduce the width of commonly occurring words through ligation was a practical benefit (especially if you bear in mind that newsprint was rationed in India for long periods of the 20th Century). Linotype were not 'cashing in on selling unique ligatures': you are entirely misunderstanding the nature of the commercial relationship between newspapers and typesetting machine manufacturers at that time. Newspapers invested in <em>machines,</em> and the makers of those machines provided fonts according to the specifications of the newspaper publishers. It is not as if Linotype invented these conjunct ligatures and offered them for sale to the newspapers; rather, the newspaper publishers and editors who had purchased the Linotype typesetting machinery requested the addition of these ligatures to their fonts.</p>
      <p>I think we're at a point in the development of Indic fonts now where we should reasonably consider whether these legacy transliteration ligatures, which were developed at a particular point in time for a particular technology and particular customer base, should be ignored. As I reported earlier, we included them in Adobe Devanagari because of concerns that users in India familiar with the Linotype sets might consider the Adobe set deficient if it did not include them. This sort of thing happens in situations in which the only reference that many people have for judging the quality of a new font is comparison with previous fonts. We encounter this regularly. I think, Uli, that you and Michel are on entirely the right track with frequency analysis: this is a much better basis on which to plan glyph sets, and in line with what we're doing these days (bear in mind that although Adobe Devanagari was only recently released we actually made it more than four years ago).</p>
