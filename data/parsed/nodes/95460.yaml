      <p>Searching in the Cologne lexicon seems odd in that the dictionary uses the Harvard-Kyoto romanisation system, which relies on case sensitivity and digraphs, but the search results are case-insensitive and can't distinguish digraph occurrences from individual letters. Hence, if I do a substring search for 'ksT' I get the same results as for 'kst' and for 'kSt' and 'kST', and these include instances of 'th' as well as 't'.<br>
      _____</p>
      <p>1 	digvidikstha 	mfn. situated towards the cardinal and intermediate points , encompassing MW.<br>
      2 	pratyaksthalI 	f. N. of a Vedi1 R.<br>
      3 	pRthaksthita 	mfn. existing separately , separate MW.<br>
      4 	pRthaksthiti 	f. separate existence , separation Vikr.<br>
      5 	RksthA 	mfn. consisting of R2ic verses Ta1n2d2yaBr. xvi , 8 , 4.<br>
      6 	samyaksthiti 	f. remaining together BhP. Sch.<br>
      7 	uttaradikstha 	mfn. situated in the north , northern.<br>
      8 	vAkstambha 	m. paralysis of speech Va1gbh.<br>
      _____</p>
      <p>I presume from context that 'th' = थ and not त्ह, although the H-K system seems to have no way to distinguish them! Does the system rely on features of the language to avoid ambiguity, or is ambiguity simply accepted (in which case it seems a really bad system to use for a digital lexicon)?</p>
