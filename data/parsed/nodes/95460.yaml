    <p>It seems that the Adobe Devanagari font was not yet discussed at Typophile.</p>
    <p>I had a closer technical look at AdobeDevanagari-Regular.otf, version 1.105 (2011), and here are my findings:</p>
    <p>1. The Latin diacritics required for transliterating Indic (Hindi, Sanskrit, etc.) texts is incomplete. The diacritic for "sh" (both lowercase and uppercase), very frequently used in Indic words, e.g. in Shiva etc., is missing.</p>
    <p>2. Many frequently used ligatures are missing, even ligatures which have a frequency of much more than 0.01 %, e.g. "ddhv" (frequency 0.215 %).</p>
    <p>For details see <a href="http://www.sanskritweb.net/itrans/adobe-ligatures.pdf" title="http://www.sanskritweb.net/itrans/adobe-ligatures.pdf">http://www.sanskritweb.net/itrans/adobe-ligatures.pdf</a></p>
    <p>For comparison see <a href="http://www.sanskritweb.net/itrans/itmanual2003.pdf" title="http://www.sanskritweb.net/itrans/itmanual2003.pdf">http://www.sanskritweb.net/itrans/itmanual2003.pdf</a> (page 29 seq.)</p>
    <p>3. The Adobe Devanagari font does not work with older Windows and older Word.</p>
    <p>For example, Adobe Devanagari does not work with old Microsoft Word, version 10, in conjunction with Windows XP.</p>
    <p>For comparison, Mangal and all the other Devanagari Unicode fonts known to me work with older Word and older Windows, provided the Uniscribe system library for foreign language support was installed with Windows.</p>
