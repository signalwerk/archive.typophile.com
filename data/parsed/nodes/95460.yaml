      <p>Uli: <em>Such a two-halves font requires extremely meticulous planning, though.</em></p>
      <p>Yes, and usually require careful kerning too. We've made use of contextual variant half and post (conjunct-final) forms in some fonts.</p>
      <p>I'm in the process of rationalising the glyph set for a new Hindi font, and am removing a good number of the transliteration ligatures that we included in Adobe Devanagari (most of which can be shaped with half forms anyway) and adding some more vertical ligatures to cover Sanskrit quoted words without explicit halant.</p>
