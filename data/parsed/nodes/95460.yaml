      <p>I don't have the Adobe Devanagari font and can't comment on it. Uli's analysis contains 821 compound glyphs. For the aspell dictionary, I made my analysis by first replacing all letters followed by a nukta by the corresponding precomposed character. On 475108 bigrams, there were only two "u092F nukta" and that many for others (number of occurrences between parentheses)</p>
      <p>u0915 (316), u0916 (411), u0917 (157), u091C (673), u0921 (1789), u0922 (395), u092B (391)</p>
      <p>I then just searched for the longest sequences of the form </p>
      <p>    letter virama letter virama … virama letter </p>
      <p>and found 627 glyphs to be precompounded  to eliminate occurrences of virama that are not at the end of a word. From the analysis, one sees that 211 compounds would be required by only one occurrence in the dictionary and only 356 compounds occur in more than two entries. You can find my results in the files on my blog:</p>
      <p><a href="/files/compounds_20120812b.pdf">/files/compounds_20120812b.pdf</a></p>
      <p>I think I see bugs with vowels (bottom of page 10). I would need the right "regular expression" that characterizes possible conjuncts (or is it a problem with the input dictionary file (<a href="/files/hindi.txt">txt</a>, 1.67M) ?).</p>
      <p>Michel</p>
      <p>New version on my blog.</p>
