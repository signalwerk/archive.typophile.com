    html: |-
      <p><strong>A) &gt; Adobe Devanagari was designed specifically for modern Hindi use, and not for Sanskrit</strong></p>
      <p>That's okay, but a circumspect designer, adding only a few additional ligatures could make the font also suitable for Marathi and Sanskrit. For example, for Classical Sanskrit, only 11 additional ligatures would be required to make the Adobe Devanagari font suitable for Classical Sanskrit (as opposed to Vedic Sanskrit).</p>
      <p>see file adobe-ligatures.pdf (see the missing ligatures marked with "!!!")</p>
      <p><strong>B) &gt; That could be an oversight</strong></p>
      <p>The oversight was due to the fact that most Indic diacritics are in the Unicode range 1E0C through 1E96, with the exception of</p>
      <p>015A Sacute<br>
      015B sacute</p>
      <p>which are used in Polish texts, but which happen to be used also as Indic diacritics.</p>
      <p><strong>C) &gt; The design brief was specifically to target use of Hindi</strong></p>
      <p>If this should be the case, then there must have been made design errors.</p>
      <p>(Cave: I am not a Hindi expert, so that a scholar should examine the following)</p>
      <p>(a) On the one hand, it seems to me (see cave above) that the Adobe Devanagari font INCLUDES ligatures, which are (to my knowledge) NOT used in Hindi (and also NOT used in Sanskrit etc.), for example "kspr":</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/kspr-kspl.jpg" title="http://www.sanskritweb.net/temporary/kspr-kspl.jpg">http://www.sanskritweb.net/temporary/kspr-kspl.jpg</a></p>
      <p>Did the Adobe designers invent the ligature "kspr" just for fun?</p>
      <p>(b) On the other hand, it seems to me (see cave above) that the Adobe Devanagari font LACKS ligatures, which are (to my knowledge) USED in Hindi, for example "dg" in the Hindi word "khadga" (= "sword" in English):</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/khadga.jpg" title="http://www.sanskritweb.net/temporary/khadga.jpg">http://www.sanskritweb.net/temporary/khadga.jpg</a></p>
      <p>In the Oxford Hindi-English dictionary by McGregor published in 1993, the word "khadga" was typeset with virama, i.e. without ligature, due to the fact that professional Devanagari fonts, such as Siddhanta.ttf and Sanskrit2003.ttf, were not available at that time. But today in the Unicode era, it is possible to design professional Devanagari fonts suited for Hindi.</p>
      <p>I wonder whether a Hindi scholar ever checked the Adobe Devanagari font for ligatures<br>
      (a) required for Hindi and<br>
      (b) not used in Hindi</p>
      <p>Instead of including ligatures required for Hindi, the Adobe Devanagari fonts includes a plethora of fancy ikara variants which would only make sense in a font containing the required ligatures.</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/ikara.jpg" title="http://www.sanskritweb.net/temporary/ikara.jpg">http://www.sanskritweb.net/temporary/ikara.jpg</a></p>
