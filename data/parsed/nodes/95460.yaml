      <p>@John Hudson:<br>
      <cite>The number of scanning errors in the Cologne lexicon is alarming.</cite></p>
      <p>But hardly unexpected. Most OCR software is oriented around the Latin alphabet, as it lends itself better to that process, and the humans available to check the results would presumably have been native speakers of German (or possibly French, Köln not being too far from the border, as its English name attests) rather than Hindi, let alone Sanskrit.</p>
      <p>We have to count ourselves lucky that a thing like the Cologne lexicon even <em>exists</em>, even though its imperfections certainly do need to be remedied.</p>
