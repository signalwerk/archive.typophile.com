      <p>Uli, as noted, Sanskrit was not a target language for the Adobe Devanagari font. It is entirely possible that Adobe will want to extend its glyph set coverage for other languages, but I suspect that modern languages such as Marathi, Konkani and Nepali would be their priorities. I'm a little surprised that you reckon only eleven more conjunct ligatures would be needed for classical Sanskrit; I would think more.</p>
      <p>Fiona confirms that some of the conjuncts inherited from the Linotype set were for transliteration of foreign words; we included them in Adobe Devanagari because the Linotype fonts are a recognised standard among some Indian customers, and to deviate from the set would be to invite criticism and require explanation. Instead, we get criticism from a German Sanskritist and have to explain to him. :)</p>
      <p>The core sets on which the Adobe Devanagari set are based were the Linotype Devanagari (for compatibility with a perceived 'standard') and that provided by <a href="http://hindiurduflagship.org/">Rupert Snell</a> in his Hindi grammar, which is the most up-to-date source for the modern language. Recently, we had occasion to add some extra variants for one of Adobe's customers who wanted different forms for certain conjuncts.</p>
      <p>Greaves' comment about 'High Hindi' is worth bearing in mind. You cite खड्ग as an example of the 'dg' conjunct in Hindi, but the common modern Hindi word for sword is तलवार.</p>
      <p>Clearly Michel is not going to find 'innumerable' conjuncts in Adobe Devanagari that do not occur in Hindi words: he is going to find a precise number, and these will all be conjuncts that also appeared in the Linotype set. Far from being 'invented just for fun', they were included in a set whose size was limited by technical restraints at the request of Linotype's Indian customers, in order to cleanly (without explicit halant) render transliterations of common foreign words in Hindi newspapers. In the context of those newspapers, it is entirely likely that some foreign words would be more common than those Hindi words that contain low frequency conjuncts. [Transliteration of foreign words, especially proper names, was a major factor for newspaper typesetting in the Subcontinent. Full-word ligatures needed to be added to Urdu fonts whenever the Soviet Union had a change of leaders.]</p>
