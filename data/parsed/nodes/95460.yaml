      <p>Mr. Hudson:</p>
      <p><cite>"Uli, you suggested early in this thread that the Adobe Devanagari set would need only about a dozen more ligatures in order to adequately support classical Sanskrit. This surprised me. The first document to which you linked in this discussion seems to be a subset of Sanskrit conjuncts, certainly much shorter than the complete list in your manual. Can you explain the basis of this subset? Is it based on frequency, or on a particular set of texts?"</cite></p>
      <p>The first document, namely this document:</p>
      <p><a href="http://www.sanskritweb.net/itrans/adobe-ligatures.pdf" title="http://www.sanskritweb.net/itrans/adobe-ligatures.pdf" class="link-external">http://www.sanskritweb.net/itrans/adobe-ligatures.pdf</a></p>
      <p>lists attested Sanskrit conjuncts in descending frequency order.</p>
      <p>I cut off this partial list at the frequency of 0.010 %, namely here:</p>
      <p>ङ्घ्र्य	ṅghry (!!!)  0.010%</p>
      <p>If the Adobe Devanagari font contained all attested Sanskrit ligatures down to a frequency of 0.010 %, it would be a very good Sanskrit font, although it would not include the rarest ligatures with a frequency below 0.010%.</p>
      <p>These rarest ligatures are only covered by our own highly specialized Itranslator fonts "Sanskrit2003.tt", "Chandas.ttf" and "Siddhanda.ttf" downloadable here</p>
      <p><a href="http://www.sanskritweb.net/itrans/" title="http://www.sanskritweb.net/itrans/" class="link-external">http://www.sanskritweb.net/itrans/</a></p>
      <p>However, the Adobe Devanagari font, primarily designed for Hindi, could be also a satisfactory Sanskrit font, if it contained a subset of Sanskrit ligatures, provided that at least the most frequent Sanskrit ligatures were covered by the subset.</p>
      <p>It is up to you where you cut off the frequency list adobe-ligatures.pdf.</p>
      <p>For example, given the present version of the Adobe Devanagari font, it contains all Sanskrit ligatures down to a frequency of 0.215%, because the first ligature not covered by this font is the ligature द्ध्व, namely</p>
      <p>द्ध्व	ddhv  (!!!)  0.215%</p>
      <p>If you were to include also ड्ग, the Adobe Devanagari font would cover all Sanskrit ligatures down to a frequency of 0.167 %, namely</p>
      <p>ड्ग	ḍg     (!!!)  0.167%</p>
      <p>and so on and so on. You could proceed and cut off here</p>
      <p>द्द्व	ddv  (!!!) 	0.119%, or here:</p>
      <p>ङ्घ्र	ṅghr	(!!!) 0.109%, or here:</p>
      <p>द्द्र	ddr  (!!!)  0.109%, or here:</p>
      <p>ड्य	ḍy	(!!!)  0.097%, or here:</p>
      <p>...</p>
      <p>ङ्घ्र्य	ṅghry (!!!)	0.010%</p>
