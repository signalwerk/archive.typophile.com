      <p>Mr. Hudson:</p>
      <p><cite>"Thanks, Uli. I'll take a look at your documents and let you know if I have any questions. It would be great to have versions of these tables that could be used as test documents, e.g. plain text files."</cite></p>
      <p>As a companion to adobe-ligatures-analysis.pdf (see above), I uploaded the file</p>
      <p><a href="http://www.sanskritweb.net/itrans/adobe-ligatures-analysis.txt" title="http://www.sanskritweb.net/itrans/adobe-ligatures-analysis.txt">http://www.sanskritweb.net/itrans/adobe-ligatures-analysis.txt</a></p>
      <p>containing nothing but the Devanagari ligatures in plain 16 bit Unicode encoding.</p>
      <p>This 16-bit Unicode file has the following internal structure:</p>
      <p>FF FE - (16 bit Unicode file identification signature)</p>
      <p>2A 09 - प (Devanagari p)<br>
      4D 09 - ्  (Devanagari virama)<br>
      30 09 - र (Devanagari r)<br>
      0D 00 - CR (carriage return)<br>
      0A 00 - LF (line feed)</p>
      <p>etc. etc.</p>
      <p>So, the first line of this file is the Devanagari ligature प्र.</p>
      <p>MS Word recognises adobe-ligatures-analysis.txt as 16-bit Unicode file.</p>
