      <p>1) Mr. Boyer:</p>
      <p>I discovered that by Edwin Greaves in his 1921 Hindi Grammar</p>
      <p>see <a href="http://archive.org/details/hindigrammar00greauoft">http://archive.org/details/hindigrammar00greauoft</a></p>
      <p>the ligature "dg" is reckoned as a "principal compound".</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/dga.jpg">http://www.sanskritweb.net/temporary/dga.jpg</a></p>
      <p>This book by Greaves has also an interesting introduction describing "High Hindi" as a language "for those who delight to cram their pages with high-sounding Sanskrit words" (see page 4 of the scanned book). But this was 90 years ago.</p>
      <p>2) Mr. Hudson:</p>
      <p>I did not say that I have "the expectation that any given conjunct, however rare, should be presented in its ligature form".  On the contrary, I said that "only 11 additional ligatures would be required to make the Adobe Devanagari font suitable for Classical Sanskrit".</p>
      <p>What I criticize is that the Adobe Devanagari font contains many extremely infrequent and perhaps entirely unattestable ligatures, whereas this font lacks very frequent ligatures, at least as far as Sanskrit is concerned.</p>
      <p>3) Mr. Boyer and Mr. Hudson:</p>
      <p>I made a <strong>complete</strong> compound analysis of the Adobe Devanagari font, which will be of interest to Mr. Boyer and to Mr. Hudson:</p>
      <p><a href="http://www.sanskritweb.net/itrans/adobe-ligatures-analysis.pdf">http://www.sanskritweb.net/itrans/adobe-ligatures-analysis.pdf</a></p>
      <p>The frequency counts are based on Sanskrit texts developed for Sanskrit fonts, but these statistics may be also of help for Hindi-only fonts.</p>
      <p>The most infrequent or rarest, though attestable, Sanskrit compounds have a frequency of 0.001 %.  This means that in 100000 (one hundred thousand) lines of Sanskrit texts, this compound occurs only ONCE on an average.</p>
      <p>Now, if Mr. Boyer applies his Gnu Hindi dictionary word count utility to the compounds listed on pages 27 through 37 of the above file (adobe-ligatures-analysis.pdf) containing the rarest or most infrequent Sanskrit ligatures (0.001%), I predict that Mr. Boyer is sure to discover that innumerable ligatures (compounds), which are indeed contained in the Adobe Devanagari font cannot be attested (i.e. located or found) in his Hindi dictionary. If this be true (let's see), this would mean that the Adobe Devanagari font contains innumerable unattested compounds (ligatures) with a frequency of 0.000 % (nil, nothing).</p>
