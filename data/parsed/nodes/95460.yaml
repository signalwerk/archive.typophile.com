    html: |-
      <p>Mr. Hudson:</p>
      <p><cite>"Uli, you suggested early in this thread that the Adobe Devanagari set would need only about a dozen more ligatures in order to adequately support classical Sanskrit. This surprised me. The first document to which you linked in this discussion seems to be a subset of Sanskrit conjuncts, certainly much shorter than the complete list in your manual. Can you explain the basis of this subset? Is it based on frequency, or on a particular set of texts?"</cite></p>
      <p>The first document, namely this document:</p>
      <p><a href="http://www.sanskritweb.net/itrans/adobe-ligatures.pdf" title="http://www.sanskritweb.net/itrans/adobe-ligatures.pdf">http://www.sanskritweb.net/itrans/adobe-ligatures.pdf</a></p>
      <p>lists attested Sanskrit conjuncts in descending frequency order.</p>
      <p>I cut off this partial list at the frequency of 0.010 %, namely here:</p>
      <p>ङ्घ्र्य	ṅghry (!!!)  0.010%</p>
      <p>If the Adobe Devanagari font contained all attested Sanskrit ligatures down to a frequency of 0.010 %, it would be a very good Sanskrit font, although it would not include the rarest ligatures with a frequency below 0.010%.</p>
      <p>These rarest ligatures are only covered by our own highly specialized Itranslator fonts "Sanskrit2003.tt", "Chandas.ttf" and "Siddhanda.ttf" downloadable here</p>
      <p><a href="http://www.sanskritweb.net/itrans/" title="http://www.sanskritweb.net/itrans/">http://www.sanskritweb.net/itrans/</a></p>
      <p>However, the Adobe Devanagari font, primarily designed for Hindi, could be also a satisfactory Sanskrit font, if it contained a subset of Sanskrit ligatures, provided that at least the most frequent Sanskrit ligatures were covered by the subset.</p>
      <p>It is up to you where you cut off the frequency list adobe-ligatures.pdf.</p>
      <p>For example, given the present version of the Adobe Devanagari font, it contains all Sanskrit ligatures down to a frequency of 0.215%, because the first ligature not covered by this font is the ligature द्ध्व, namely</p>
      <p>द्ध्व	ddhv  (!!!)  0.215%</p>
      <p>If you were to include also ड्ग, the Adobe Devanagari font would cover all Sanskrit ligatures down to a frequency of 0.167 %, namely</p>
      <p>ड्ग	ḍg     (!!!)  0.167%</p>
      <p>and so on and so on. You could proceed and cut off here</p>
      <p>द्द्व	ddv  (!!!) 	0.119%, or here:</p>
      <p>ङ्घ्र	ṅghr	(!!!) 0.109%, or here:</p>
      <p>द्द्र	ddr  (!!!)  0.109%, or here:</p>
      <p>ड्य	ḍy	(!!!)  0.097%, or here:</p>
      <p>...</p>
      <p>ङ्घ्र्य	ṅghry (!!!)	0.010%</p>
      <p>If the Adobe Devanagari font included all ligatures down to ङ्घ्र्य, id est down to a frequency of 0.010%, it would be a very good Sanskrit font. But I repeat, you may cut off the list much earlier.</p>
      <p>As regards the attestations, I made frequency analyses of original electronic Sanskrit files.</p>
      <p>The German University of Göttingen hosts this huge collection of electronic Sanskrit files:</p>
      <p><a href="http://gretil.sub.uni-goettingen.de/gretil.htm" title="http://gretil.sub.uni-goettingen.de/gretil.htm">http://gretil.sub.uni-goettingen.de/gretil.htm</a></p>
      <p>Ten years ago, I started with the proofread entire Mahabharata:</p>
      <p><a href="http://bombay.indology.info/mahabharata/statement.html" title="http://bombay.indology.info/mahabharata/statement.html">http://bombay.indology.info/mahabharata/statement.html</a></p>
      <p>However, it only makes sense to analyze proofread electronic texts:</p>
      <p><a href="http://bombay.indology.info/mahabharata/history.html" title="http://bombay.indology.info/mahabharata/history.html">http://bombay.indology.info/mahabharata/history.html</a></p>
      <p>because text files crammed with typos  result in erroneous frequency counts.</p>
      <p>For making a good Hindi font, someone would have to analyze proofread electronic Hindi files and would have to make frequency counts. Thereafter it would become clear, which ligatures should be included into a good Hindi font and which should be omitted.</p>
      <p>I should like to mention that the German University of Cologne here</p>
      <p><a href="http://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/tamil/index.html" title="http://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/tamil/index.html">http://www.sanskrit-lexicon.uni-koeln.de/scans/MWScan/tamil/index.html</a></p>
      <p>hosts a huge electronic Sanskrit dictionary with more than 150,000 entries, which I also completely analysed for my own ligature frequency counts ten years ago.</p>
