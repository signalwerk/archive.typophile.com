      <p>The 8 lines of Python in the previous post can be replaced by the following 6 lines (that first read the full dictionary as a list of words, which may cause trouble on very large dictionaries but works fine for me on aspell.txt). For closing the input file, additional lines of code would be required. </p>
      <p>---<br>
      import re, sys, codecs<br>
      compound = ur'(?:[\u0915-\u0939\u0958-\u095F]\u094D)+[\u0915-\u0939\u0958-\u095F]'</p>
      <p>listwords=codecs.open(sys.argv[1],"r","utf-8").read().split()<br>
      for word in listwords:<br>
        for comb in re.findall(compound, word):<br>
          print comb.encode('utf-8')<br>
      ---</p>
      <p>The advantage is that the processing loop is extremely simple.</p>
