    date: 2013-07-21T10:29:00
    date_raw: 21 Jul 2013 — 10:29am
    votes: null
    html: |-
      <p>Since I've missed a lot of fun, here I <a class="freelinking external" href="http://is.gd/tPCybT" rel="nofollow">go</a>.</p>
      <p>@Michel Boyer<br>
      For a Hindi corpora <a href="http://dsal.uchicago.edu/dictionaries/platts/" title="http://dsal.uchicago.edu/dictionaries/platts/">http://dsal.uchicago.edu/dictionaries/platts/</a> might do, but that's not pure Hindi. But for a pre-modern font as per John Hudson it might do. Great you're "familiar" with the LaTeX font package, because nobody else seem to be in the discussion deep enough.<br>
      I must say I'm impressed with your .pdfs.<br>
      A small specimen I put together:<br>
      <a class="freelinking external" href="http://samskrtam.ru/adobe-devanagari-font/" rel="nofollow">Adobe Devanagari for a Sanskrit Dhatupatha</a>.<br>
      I compiled a list of Sanskrit 1379 ligatures based on 15 Sanskrit grammars after reading <a href="http://typophile.com/node/95460" title="http://typophile.com/node/95460">http://typophile.com/node/95460</a>. Graphical variants which are introduced by the authors quoted are treated as separate ligatures, up to 79. As many as 991 are unique to only 1 source (a minimum). 8 are met in 14 out of 15 sources (a maximum). The list is even bigger than Mr. Boyer's Samyoga Table. But it's not about size. Because errors and ligatures go together a long way.<br>
      1	991<br>
      2	92<br>
      3	41<br>
      4	23<br>
      5	16<br>
      6	17<br>
      7	25<br>
      8	21<br>
      9	27<br>
      10	38<br>
      11	35<br>
      12	31<br>
      13	14<br>
      14	8</p>
      <p>@Uli<br>
      We owe much to Ulrich. His work is known and used wider even than Ernst Tremel's. I would love to see a version of his "entirely fictitious ligature" list for Sanskrit. Nothing remained the same<br>
      <cite>Rigveda edition by Prof. R. L. Kashyap and Prof. S. Sadagopan published in printed book form in 1998</cite><br>
      after he started his research on devanagari typography, of which a culmination was his replica of Bombay's Nirnayasagar's bold type called <a class="freelinking external" href="http://www.omniglot.com/blog/?p=621" rel="nofollow">Sanskrit 2003</a>. One would love to see a "Sanskrit 2013" (ten years after) with OpenType variants included for ligatures and vowels.</p>
      <p>Even though I have personal reasons for not loving Ulrich Stiehl, I must admit that he knows more about the technical part of a Sanskrit font than any German knows. I could say that more than any European, but there is Mihas Bayaryn, so you can't be #1 until Mihas is alive. And seems he is here to stay. A pitty all <a href="http://www.sanskritweb.net/temporary/" title="http://www.sanskritweb.net/temporary/">http://www.sanskritweb.net/temporary/</a> URLs have died.</p>
      <p><cite>These rarest ligatures are only covered by our own highly specialized Itranslator fonts "Sanskrit2003.tt", "Chandas.ttf" and "Siddhanda.ttf" downloadable here<br>
      http://www.sanskritweb.net/itrans/</cite> </p>
      <p>Siddhanda.ttf is and I hope never will downloadable at Ulrich's website. Chandas.ttf indeed is,<br>
      but as per Mihas (author of the font), he treats Chandas as a draft for Siddhanta.</p>
      <p><cite>by analyzing Panini's grammar, I found exactly 114 additional artificial ligatures pertaining to Panini's acronym-like grammatical elements</cite><br>
      As said it would be interesting to see the context and the ligatures, so one could check how they where printed in the 1887 edition printed at Drugulin. I have a list of Drugulin's devanagari from an archive with 425 elements, including ligatures (one would have to add - only). Still no better Sanskrit typography was ever printed that the one of Drugulin.</p>
      <p>Same as Ulrich I deal with Sanskrit on a daily basis. And as Indians do not make Sanskrit fonts, Germans and Russians have to do so. It might sound strange, but even the original Nirnaya is based on a Berlin-made font from Uengern brothers. Schlegel was a German if I'm not wrong. Frutiger was an Indian only a bit - so there is not much of Indian in the history of Indian fonts. <a href="/wiki/https%3A/%252Fgroups.google.com/forum/%2523%21topic/bvparishat/uyvF2nK92J0" class="freelinking" rel="nofollow">Indians are above fonts</a>. They care about the text, to preserve the manuscripts. Errors? Typoes? Who cares. Virama-ligatures in a Sanskrit conference thesis? So be it. "We" are above it. Oh, really?!</p>
      <p>After we had years to fight with "Mangal", which was a makeshift font including only the "commonest conjuncts" (using Ulrich's expression), I understand why Ulrich does not feels comfortable with the Adobe Devanagari (John Hudson's) policy. I understand that Adobe's policy is above Mr. Hudson's. But not having Marathi or Nepali in the next edition would not have any excuses, I guess. Sanskrit is Huge. Marathi is just a feature compared to the complexity of Sanskrit ligatures.</p>
      <p>@John Hudson<br>
      Would it ever be possible to make at least a few screencasts of your work with VOLT showing the font process working with devanagari? There is next to nothing documented and a video would be something appreciated indeed.<br>
      <cite> Can you explain the basis of this subset? Is it based on frequency, or on a particular set of texts?</cite><br>
      When Ulrich asked you, he meant, that nothing of it is used. It's strange indeed. If you take something for granted (a list not of your own), you have to have samples in what words do they occur. For example, one can not  make a universal Sanskrit font, every font will work only with a limited (small or huge) amount of texts. At GRETIL, with which most of the Sanskritists are working nowadays, there are around 600 texts.<br>
      But Ulrich's list is not a list of ligatures in all GRETIL's 600 texts (as he states in different wording himself). He has dropped out the grammatical literature with it's anubandhas. So you can not print an Indian grammar or might experience issues - because grammar is not a text he would want to include. Mihas' font Siddhanta is the first one to include the grammarians only ligatures as well, because Mihas himself is rooted deep in the Paninian system. I'm working on a Dhatupatha Concordance and must say, that from the technological point of view no devanagari font comes even close. I'm not a fan of it's thin as hair stylistics, I'm used to the bold types.</p>
      <p><cite> Coulson, Michael. Teach yourself Sanskrit.<br>
      Monier-Williams. A practical grammar of the Sanskrit Language.<br>
      Vasu, S.C. Aṣṭādhyāyī of Pāṇini.<br>
      Agenbroad, J.E. 'Difficult characters: a collection of Devanagari conjunct consonants' (in Bulletin 38 of the International Association of Orientalist Librarians).</cite><br>
      Coulson's list a very small one. It has 1 variant for every ligature, which means it is a poorly made list. Why on earth one would want to take it in consideration at all? Monier-Williams has around 170 000 Sanskrit words (even if put together with other Sanskrit dictionaries it would be around 200 000 so a relatively small number). Vasu's Aṣṭādhyāyī is the most authoritative edition of Pāṇini. But are the anubandhas from Dhatupatha included? Never seen Agenbroad's list, so can't comment on it. Is there a scan of it available somewhere, gentlemen? Mr. Hudson, when you wrote "get a copy of the journal with his original collection" - did you have any luck with it?</p>
      <p>@quadibloc<br>
      It does not matter that "OCR software is oriented around the Latin alphabet". The Cologne project had Indians working (not Frenchmen) on the proofreading but there are thousands of errors left. I've been submitting my five cents every few months, but it would take around 50 years to fix all of them at such a rate. And there are several editions of the OCR texts from Cologne - not always newer is better, new errors arive as well (because of converting to the new markup as well). Anyway - nobody else has done even 1/10 of they've done so you can't say a single bad word about them. One heels only gratitude and can't say enough "thank you"<br>
      After all those OCRs where done <a href="http://www.indsenz.com/int/index.php" title="http://www.indsenz.com/int/index.php">http://www.indsenz.com/int/index.php</a> was released. It was unreliable in the beginning. But as of 2013 it has a very small error rate and is the best OCR software for devanagari. ABBYY Fine Reader (a trained one) does not comes even close. No other (inlcuding Indian coders) comes close. I've explored the OCR market, I know what I speak about.</p>
      <p>@Rainer<br>
      (1) agreed.<br>
      (2) Samavedic accents from Adobe - you made my day. They can't make a feature for a single text if they have no features for hundreds of other (more popular) texts. That would not make much logic. Rome wasn’t built in one day - but the building of a devanagari at Adobe is only in the plans, as regarding Sanskrit. I must say I'm impressed by the look and feel of the font except the details as screenshoted <a href="http://samskrtam.ru/adobe-devanagari-font/" title="http://samskrtam.ru/adobe-devanagari-font/">http://samskrtam.ru/adobe-devanagari-font/</a><br>
      (3)  "language tag for Hindi, but not for Sanskrit" - indeed.<br>
      (4) "font claims to be primarily made for modern Hindi, the ligatures you get by default (letter + halant + letter) are quite often the traditional rather than the modern forms" - so if it's Hindi, be it Hindi by default. Kill every Sanskritism and we'll accept that we should not even try to print a Sanskrit text. If it's in between - that's worse.<br>
      (5) As per short i-matra that "extends by default over the complete consonant combination it precedes" - I fully agree. There must be a way to turn it off. Sometimes it can become too long. Adobe's Devanagari is not the first one to have it, but when it's too long is looks ugly in every print, be it old or new.<br>
      (6) As per "modern half forms are really ‘modern’ (in Hindi!), not just a compromise with dated technology" - that's an interesting and new insight.</p>
      <p>If one only could add screenshots and include attachments I could show the Ligature Concordance here.</p>
