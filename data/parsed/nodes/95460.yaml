    html: |-
      <p>Some of the conjuncts in the Adobe Devanagari font were inherited from the Linotype Devanagari font, which was used a lot in newspapers and whose glyph set was in part developed in response to requests from newspaper editors in India. It is entirely possible that some conjuncts were intended for commonly transliterated words from other languages.</p>
      <p>I do think a more systematic, analytical approach should be taken to defining the conjunct set for Hindi fonts, as Uli has done for Sanskrit. In the case of the Adobe Devanagari, we compiled a set from a variety of sources. We had intended to cover Marathi too, but the development schedule wasn't very long because it needed to be bundled with Acrobat, so we had to prioritise for Adobe's principal targets. We did do testing of extended Hindi texts -- including an entire novel -- and found the font to perform well.</p>
      <p>Uli, it is worth bearing in mind that modern Hindi typography has broken quite significantly with the Sanskrit tradition. I understand your comment re. fonts that support only the more common conjunct ligatures, but that seems to me very much the perspective of a Sanskritist: Hindi readers have been used to extensive use of half forms and, for some letters, even explicit halants ever since the hot metal typesetting days. Indeed, when Fiona first reintroduced some of the conjunct ligature forms in the digital LT Devanagari (for the Linotron 202) there was resistance from some Indian customers to what were perceived as 'Sanskrit' forms. A lot of the custom encoding solutions for Hindi fonts, e.g. the Modular Infotech system, remain based around extensive half form use. None of this is to say that we couldn't, with more time and research, have come up with a better Hindi conjunct set for Adobe Devanagari, but that the expectation that any given conjunct, however rare, should be presented in its ligature form is not one that Hindi readers share with you.</p>
      <p>Thank you, by the way, for the very helpful review documents, which I'll certainly examine carefully and I hope will help us to do better in future.</p>
