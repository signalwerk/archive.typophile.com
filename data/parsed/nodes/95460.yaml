      <p>Hrant: <em>Doesn't Fiona have an advanced degree in Sanskrit?</em></p>
      <p>A postgraduate diploma in Sanskrit and a PhD in Indian palaeography, both from SOAS.</p>
      <p>One of the things I have noticed is that grammars of the <em>writing</em> of Sanskrit, from Panini onwards, have a tendency to fill out, to variable degrees, the possibilities of the writing system independent of its application to the actual language. Hence, as Uli notes, one can find many listings of conjuncts that are not attested in actual texts. Some of these 'systematic inclusions' may end up being used in foreign loanwords, or in the orthographies of other languages adopting the script, but will never occur in Sanskrit. This is why Uli's work analysing frequency in proofread Sanskrit texts is so useful.</p>
