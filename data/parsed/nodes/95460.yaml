      <p>Mr. Hudson:</p>
      <p>I wish you good look in finishing your Adobe Devanagari font.</p>
      <p>Ligatures are a never-ending story. Look at you own name "Hudson". </p>
      <p>Sanskrit and Hindi do not have "ds" as a sound combination. This is because the soft dental "d" would be assimilated to the hard dental "t" before "s", resulting in "ts", which would be available as a Hindi ligature. But you would not want your name transliterated in Devanagari as "Hutson", would you?</p>
      <p>Therefore, transliterating your name in Devanagari would required a new ligature, namely for "ds".</p>
      <p>Namaste</p>
