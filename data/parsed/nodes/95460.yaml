      <p>I am no expert of Hindi either, and I don't know where I could find a good corpus of Hindi texts for reliable statistics. The best I could do is to download the aspell Hindi dictionary from <a href="ftp://ftp.gnu.org/gnu/aspell/dict/0index.html" title="ftp://ftp.gnu.org/gnu/aspell/dict/0index.html">ftp://ftp.gnu.org/gnu/aspell/dict/0index.html</a>, untar it with</p>
      <pre>   tar -jxpvf aspell6-hi-0.02-0.tar.bz2</pre><p>
      and, in the directory <code>aspell6-hi-0.02-0</code>, execute </p>
      <pre>   preunzip hi.cwl</pre><p> to get the utf-8 encoded dictionary <code>hi.wl</code>. It contains 83514 entries, which compares favorably to my en_US dictionary  (62115 entries) or my French dictionary (61305 entries). Here is now a trace of execution (on OS X 10.6)</p>
      <blockquote><p>
      512 % grep ड्ग hi.wl<br>
      खड्ग<br>
      खड्गकोश<br>
      खड्गधारी<br>
      खड्गधेनु<br>
      खड्गमुष्टि<br>
      खड्गी<br>
      षड्ग<br>
      षड्गुण<br>
      513 %
      </p></blockquote>
      <p>Those are all the entries containing the  ड्ग  combination. I guess there are contexts where those entries can be used more frequently than others but I doubt a representative corpus would give the combination  ड्ग a very high frequency.</p>
