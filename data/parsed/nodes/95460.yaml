      <p>I have stepped over this discussion on Adobe Devanagari only recently and would like to add a few comments. But first let me say, while I admit that there is place for improvement, Adobe Devanagari was exactly what I needed and came right in time for a bilingual edition of Hindi short stories accompanied by German translations I am working at.</p>
      <p>(1) Most of the joint letters (ligatures) Uli took offense at are in actual use in Hindi, Marathi and Nepali. Both in novels and newspapers it is quite common to transliterate words and even complete sentences from English into Devanagari. It took me only a few seconds to think for possible candidates:<br>
      क्स्प्र kspr: express (extremely common, there are hundreds of trains with that name, no "ink-spray" necessary)<br>
      क्स्प्ल kspl: explain<br>
      also things like न्फ़्र nfr: conference (which happily have been included)<br>
      Please, Adobe, don’t remove these ligatures whatever Sanskritists may think about them, there is much practical publishing experience behind most of the list.<br>
      ब्न is common in Nepali (e.g. डुब्नु drown)</p>
      <p>(2) Adobe Devanagari goes a long way even in Sanskrit and Vedic. Modern editions don’t have all the traditional ligatures used in manuscripts as they tend to turn out clumsy in print.<br>
      It would be fine some time to have Samavedic accents too (so far only Rigvedic accents are available).<br>
      Accent combinations for transliteration of Vedic (ā́ ā̀ etc) are also missing.<br>
      But then, even Rome wasn’t built in one day.</p>
      <p>(3) Language codes and stylistic sets should be enabled for much more alternatives than they are now. InDesign CS6 has a language tag for Hindi, but not for Sanskrit (on the internet, you can find a clumsy way to get it, but I did not try).</p>
      <p>(4) For the time being, while the font claims to be primarily made for modern Hindi, the ligatures you get by default (letter + halant + letter) are quite often the traditional rather than the modern forms, the latter preferring half letters. To get theses, you have to type an additional non width joinder. Compare:<br>
      क + क : क्क (old style)     क्‍क (modern)   visible only in Adobe Devanagari<br>
      न + न : न्न  (old style)     न्‍न (modern)    visible only in Adobe Devanagari<br>
      श + व : श्व  (old style)     श्‍व (modern)<br>
      It would be a good idea to handle this issue by different stylistic sets and/or language tags.<br>
      I would appreciate to have Sanskrit, Hindi (traditional ligatures), Hindi (modern ligatures), Marathi &amp; Nepali (for the latter two languages, automatical creation of e.g. र्‍य ry and the like where needed would be very helpful)</p>
      <p>I don’t think that John’s commentary on this point is correct. The modern half forms are really ‘modern’ (in Hindi!), not just a compromise with dated technology: they are used in contemporary print because they are more legible than the traditional manuscript ligatures and therefore even recommended for e.g. text books. The comparison with the old Linotype-f is misleading; rather one should consider the whole paraphernalia of Greek ligatures used in Byzantine manuscripts which hardly any font for classical Greek does include as they are no longer used in print, again for the simple reason of legibility (Claude Garamond did use them, and there are two or three fonts around that have a lot of them – but in a stylistic set you have to turn on if you want to have them!)</p>
      <p>(5) The short i-matra extends by default over the complete consonant combination it precedes:<br>
      कि but क्ष्मि  (only visible in Adobe Devanagari). This seems sometimes a bit to much, so it would be fine if there were an option to turn the feature off or reduce the it to a more moderate size – say by an option like swash letters or titling caps (But then, Adobe can be adamant, as with the Th-ligature in all of Slimbach’s fonts).</p>
      <p>ps.: I hope the Devanagari samples are readable, as I don’t have the time to prepare and include graphics. If not, copy the text and paste it into a Unicode-savvy Word processor and formate the whole section with Adobe Devanagari, Devanagari MT, Kokila or any other new Devanagari font.</p>
