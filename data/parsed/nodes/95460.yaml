      <p>Thanks, Uli. I did searches in the Cologne lexicon and visually reviewed the results, and also used the <a href="http://www.sanskrita.org/wiki/index.php/Converter" rel="nofollow">Sanskrita converter</a> to check results in Devangari.</p>
      <p>Specifically, I did substring searches for conjuncts that are in my current draft glyph set and also in the Samyoga list but <em>not</em> in your frequency list. Most of these, as you would predict, do not occur in the Cologne lexicon. A few do, though, although most are very rare:</p>
      <p>1 च्न cn in हस्तिकच्नि hastikacni (a kind of bulbous plant L.)<br>
      1 ज्द	jd in भुज्दृश् bhujdRz (or mfn. accompanied by distortion of the eyes (as a fever) Bhpr.)<br>
      4 ज्न jn as in अरसज्न arasajna (mfn. having no taste for , not taking interest in MBh. xii , 6719)<br>
      2 झ्य jhy as in झ्यु jhyu (cl. 1. A1. v.l. for %{jyu}.)<br>
      9 द्ब्र dbr as in सद्ब्रह्मन् sadbrahman (n. the true Brahman ib.)<br>
      1 न्त्स nts in अनश्नन्त्साङ्गमन anaznantsAGgamana (m. the sacrificial fire in the Sabha1 ... S3Br.)<br>
      4 ल्ज lj as in पश्चाल्जन pazcAljana (m. Pa1n2. the people in the west Var)<br>
      1 ल्स ls in अतिपेशल्स् atipezals (mfn. very dexterous.)<br>
      12 ष्ट्व STv as in हविष्ट्व haviSTva (n. the being an oblation Nya1yam. Sch.)<br>
      35 स्त्व stv as in अनागास्त्व anAgAstva (n. sinlessness RV.)</p>
