      <p>The first thing that should be noted is that Adobe Devanagari was designed specifically for modern Hindi use, and not for Sanskrit; it may be of limited use even for other modern languages such as Marathi and Nepali. The design brief was specifically to target use of Hindi in a modern business environment (the font was originally made to bundle with Acrobat), and not scholarly use.</p>
      <p>1. That could be an oversight. Thanks for bringing it to our attention.</p>
      <p>2. See note above re. target language support. The ligature set was based on a mixed approach: referencing the set employed in Linotype Devanagari (on which Fiona also worked) and also frequency analysis of modern Hindi text.</p>
      <p>3. Correct. The font uses only the newer 'dev2' script tag and layout behaviour, not the older, deprecated  shaping. This is what Adobe spec'd. Hence the font will not work in pre-Vista versions of Windows or other environments that only support 'deva'.</p>
    html_clean: |-
