      <p>Herrn Ulrich Stiehl,</p>
      <p>I know very well that those two are different. I was pointing out that one is listed in the commonest conjuncts (nga), and thus was available in the font, and the one you point out (dga) is not listed. I see no reason a font used in the seventies with nga would not have dga and dga was not listed by McGregor. I conclude that it was intentional on McGregor's part (and not due to a missing glyph).</p>
