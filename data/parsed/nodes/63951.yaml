  html: |-
    <p>My latest type design and first MyFonts release is called Raniscript. The name was inspired by some images of vintage matchbook designs advertising the Flying Rani. Raniscript is based on a ronde style script, but with some contemporary touches. It comes fully loaded with contextual alternates, swashes, case sensitive punctuation, and a set of caps that are designed for caps only settings.</p>
    <p><a href="http://new.myfonts.com/fonts/stephen-rapp/raniscript/" title="http://new.myfonts.com/fonts/stephen-rapp/raniscript/">http://new.myfonts.com/fonts/stephen-rapp/raniscript/</a></p>
    <p>Stephen</p><div class="imageWrap"><img src="http://typophile.com/files/Raniscript_1_4312.png"></div><p></p>
