    <p>Since something like one or two months ago i started to do my first approach on hinting, but i'm only using software-libre on typeface designing (like Fontforge instead on Fontlab, Inkscape instead of Illustrator, etc.)</p>
    <p>The problem is Fontforge has no direct hinting support, and it needs an external help from a tool named xgridfit.</p>
    <p>Do someone know how this work, and how can we efficiently work on it and Fontforge together? If it is, are there some useful and simple to follow documentation?</p>
    <p>Thanks in advance! :)</p>
