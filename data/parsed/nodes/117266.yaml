    <p>Survival Guide/Magazine<br>
    about graphic design.</p>
    <p>The first exam on Westerdals Graphic Design was to make an inspiring and teaching magazine about graphic design. The target group was future students on Westerdals graphic Design.</p>
    <p>The survival guide portrays the first year of Westerdals Graphic Design as a year of hell. If you aren’t following the guide, then you wont be able to survive the first year.  The magazine is based on a step-by-step guide with assets like dictionary and notes. With a focus on blending military influenced typography and Swiss black and white illustrations. It tries to create the feeling of survival, just like the old military guides in the US. Army. The format is a pocket size so the students will able to carry it all the time when survival will be needed.</p>
    <p>- 140mm x 250mm<br>
    - 200g Paper - Cover<br>
    - 95g  Paper - Inside<br>
    - PVA Glued</p>
    <p><a href="/wiki/https%3A/%252Fwww.behance.net/gallery/17637305/Survival-Magazine-for-graphic-designer" class="freelinking" rel="nofollow">https://www.behance.net/gallery/17637305/Survival-Magazine-for-graphic-designer</a></p>
