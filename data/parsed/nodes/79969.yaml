    <p>Hi,</p>
    <p>I am transferring my Fonts from my Mac to my PC and there are some formats that can't be read on the PC. I am using a program called TransType (version 3) to change the font for use with Windows. I wanted to know what is the best format to change the font files to? The options I have are:</p>
    <p>-Win Truetype/Opentype TT<br>
    -Win Type 1<br>
    -OpenType PS</p>
    <p>I am not sure what to change the font to at the moment I'm using the Opentype PS setting, As I know Opentype is multi Platform. I would be primarily using these fonts with Adobe CS5 programs.</p>
    <p>I use type a lot in my work but am quite naive to the formats and there pro and cons any help would be great.</p>
    <p>I have just started using Suitcase Fusion 3 (trial on Windows) as my Font Manager.[I am open to suggestion on a better font manager for Windows 7]</p>
