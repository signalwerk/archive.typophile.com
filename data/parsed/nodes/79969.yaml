    html: <p>The only kinds of fonts you might need to convert would be the old-school Mac suitcase format (which may contain either TrueType or PostScript outlines) or (less likely) the dfont TrueType format. In TransType, Mac TrueType format fonts have an icon with a blue capital 'A,' while Postscript format fonts have a red lowercase 'a.' To preserve the integrity of the outlines, you'd want to convert Mac TrueType to Win TrueType. With PostScript, might as well go with OpenType PS, since it preserves the outlines and Type 1 fonts aren't supported by the newer WPF rendering system.</p>
