      <p>Spyros,<br>
      There are millions od prices ;), but we divide a design and production fee from and a licensing fee, so when you say "Is the pricing of the licensing of a font different if it’s for a global use over the internet (than buying it from fontshop for instance)?" It's apples, and apples sauce. I.E. one can lic. from fontshop and pay for a single workstation, (or 2), or one can license for de world and pay another price. In design and production, every project has a different specification, schedule and price. Without having that info, pricing is best done at the dart board of intuition.</p>
