    html: "<p>There is usually a std set of Questions that must be answered before I start. 1. Do you want to: a. work by the hour and figure it out as you go along, or b. make a specification, get a price and schedule, sign a contract/letter-o-agreement, and then begin. (There are other ways, most usefully notably a combination of \"a\" for a little while, and then \"b\", but, there are lots of combinations that don't work so well). 2. if b is ever selected, the font development process should be specified, alpha through omega: font format(s) and tech details, glyph set(s), description of intended typographic use, appearance(s), licensing(s), exclusivity and schedule — figure out how many hours that means, multiply by \"your\" number of chits-per-hour, and see if it's worth it for both you(s) and the client(s).</p>"
