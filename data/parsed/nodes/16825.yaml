      <p>Thank you very much for your responses. </p>
      <p>I also considered similar issues and quoted the client. However, due to the amount of work involved the pricing seems to be a bit spicy. I estimated 45 days of work according to my rough plan, just for the creation of a single normal font (original). I have not got a clue about the timing an established professional studio. I 'd be really interested in having a rough idea of the work timings for such a projects (original font creation for a corporate client, licenced worldwide). Is the pricing of the licensing of a font different if it's for a global use over the internet (than buying it from fontshop for instance)?</p>
