  html: <p>I was wondering if anyone is familiar with pricing a commercial type design project in the UK that will go global through screens and possibly web (-big time hinting!-). What is even more important is timing. I roughly estimated 8 months of part time work (I can only work for it part time) and I 'm a bit afraid to say that to the client. And the fee is getting too spicy as well. Any opinions? I would be grateful.</p>
