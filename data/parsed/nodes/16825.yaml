    html: <p>For custom work, the other things to consider are a) how badly do you want to do the job (not necessarily because you really need the money, although that is one reason to quote competetively, but maybe it is an interesting project that will be personally rewarding), and b) who is the client. Two of my three biggest clients are major international software corportations, and the third is an academic association devoted to Biblical scholarship. The latter gets a discounted rate.</p>
