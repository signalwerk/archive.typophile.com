      <p>I would hope that you will get more expert opinions than my own, but, I like the Stencil much better than the Regular. It may be the white on blue on my laptop monitor, but the Regular is not nearly as crisp... many features are lost, particularly in the numerals ('2', f'rinstance, has no counter to speak of).</p>
      <p>I LOVE the Stencil W. what a nice solution to a cumbersome char.</p>
      <p>geo.</p>
