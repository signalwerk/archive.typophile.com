    html: |-
      <p>I actually started off with the stencil, but halfway through the alphabet decided to make a regular version as well. It's not a "good" stencil (the @ &amp; the % still have gaps that would get lost if stencilled), but I was just aiming for the stencil effect. The W was really bad at first (much too wide compared to the rest), but I'm quite pleased with the second version.<br>
      I might try to make some alternate letters to mix it up a bit more.</p>
