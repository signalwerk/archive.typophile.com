    html: <p>Now that I think about this, would the post office have trouble reading such an ornamental script? If this is the case, can anyone reccomend a complementary serif?</p>
    html_clean: <p>Now that I think about this, would the post office have trouble reading such an ornamental script? If this is the case, can anyone reccomend a complementary serif?</p>
  - id: 32828
    user: 2088
    date: 2004-04-25T09:08:00
    date_raw: 25.Apr.2004 9.08am
    votes: null
    html: <p>The font used  for the script looks like <a href="http://www.fonts.com/findfonts/detail.asp?pid=203230" target="_blank">Citadel Script</a>. However, I agree that this would not be appropriate for addressing the envelopes.  My suggestion would be to use a legible Italic face from a serif font, or else a formal serif font (preferably not Times ;-))</p>
    html_clean: <p>The font used  for the script looks like <a href="http://www.fonts.com/findfonts/detail.asp?pid=203230" target="_blank">Citadel Script</a>. However, I agree that this would not be appropriate for addressing the envelopes.  My suggestion would be to use a legible Italic face from a serif font, or else a formal serif font (preferably not Times ;-))</p>
