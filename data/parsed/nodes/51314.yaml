    <p>Sardines, an original fat monospaced and square typeface. After being used for private and exclusive purposes only, Sardines has now a full characterset (ASE) and will soon be made available on <strong><a href="http://www.vetteletters.nl" rel="nofollow">Vette Letters</a></strong></p>
    <p><cite>'… an amusing parade of heavyweight characters crammed into squares.'</cite><br>
    (Jan Middendorp, Dutch Type, 2004) </p>
    <p>Used as title face in the first restyled issue (2004) of the dutch design magazine <cite>Items.</cite></p>
    <p>// Jacques</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sardines_6539.png"></div><p></p>
