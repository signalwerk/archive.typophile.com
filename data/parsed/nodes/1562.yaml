    html: <p>I'm just beginning the process of designing my very own card. Coming from the UI design, I know little about the technical/logistical side of print. I wondered if we could expand this thread to discuss terminology, papers/stock, recommended printers, and costs as specifically related to business cards. <br>Maybe we could build a definition list explaining some of the terms, i.e., "one over one", spot varnish" etc.? I'd also be interested in people's recommendations for printers and what price range one can expect for some of the snazzier options. <br> <br>Cheers, <br> <br> -tim <br> <br>ps - please post more of your beautiful business cards!</p>
