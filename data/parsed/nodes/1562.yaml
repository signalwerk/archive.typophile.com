    html: <p>Well, since I'm getting some props from Jared I feel compelled to brag, er, I mean share. <br> <br>Here is the Speak Up card. Letterpressed on 130 lb French Paper with two PMS colors. It was ganged on a client project, luckily their logo colors matched Speak Up's. <br> <br><img src="http://www.typophile.com/forums/messages/30/18295.jpg" alt=""> <br> <br>Then, I have the lovely cards I designed for our firm. Letterpressed as well, and we have four alternating colors for the backs. <br> <br><img src="http://www.typophile.com/forums/messages/30/18296.jpg" alt=""> <br> <br><img src="http://www.typophile.com/forums/messages/30/18297.jpg" alt=""> <br> <br>Last but not least, my mock-business card. Yes, I have a strange sens of humor. Printed gratis thanks to Vistaprint who provided the cheesy handshake shot. That url is bogus don't try it. <br> <br><img src="http://www.typophile.com/forums/messages/30/18298.jpg" alt=""> <br> <br>And lastly, you can view a bunch of designer's business cards here -&gt; <a href="http://www.underconsideration.com/speakup_v2/archives/001559.html#001559" target="_blank">http://www.underconsideration.com/speakup_v2/archives/001559.html#001559</a></p>
