    html: <p>Tim, the nuts &amp; bolts of print-production could fill many books -- and what do you know, it does! Off the top of my head, there's one called "Print Production for Graphic Designers" that I think gets updated every few years or so. I'm sure there are many more. <br> <br>If you find a good print rep, they'll be happy to spend some time with you going over the basics -- paper types, ink options, finishing techniques, etc. Most good printers are more than willing to educate their customers.</p>
