    html: <p>This is hand lettered as most film titling of the era was. In this style you might like <a href="http://www.fontshop.com/fonts/downloads/mvb_fonts/mvb_aunt_mildred_family_ot/" rel="nofollow">Aunt Mildred</a> or (less handmade, but similarly based on a broad-nib pen) <a href="http://www.fontshop.com/fonts/downloads/suitcase/dederon_serif_family/" rel="nofollow">Dederon Serif</a>.</p>
