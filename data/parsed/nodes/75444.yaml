    html: |-
      <p>Look for a face with short descenders.<br>
      It's also important to have tabular figures that are the same width in different weights.<br>
      Some would say a foot serif on the figure one is necessary.</p>
      <p><a href="http://www.fontbureau.com/fonts/Amplitude/" rel="nofollow">Amplitude</a> is a good agate face.<br>
      Not only does it have the right proportions, but its ink traps keep the image sharp.</p>
      <p>I would be remiss not to mention my own <a href="http://new.myfonts.com/fonts/shinn/sense/" rel="nofollow">Sense</a>, which is presently used for the stock tables in <em>The Globe and Mail</em>.</p>
