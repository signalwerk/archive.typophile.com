  html: <p>Born in Minneapolis, MN, 1977. Matt got interested in designing fonts in 1996 when he studied visual communication at the Minneapolis Technical College. Matt became one of the founders of <a href="/wiki/Test%20Pilot%20Collective" class="freelinking" rel="nofollow">Test Pilot Collective</a> after meeting <a href="/wiki/Joe%20Kral" class="freelinking" rel="nofollow">Joe Kral</a> and <a href="/wiki/Mike%20Cina" class="freelinking" rel="nofollow">Mike Cina</a> through the <a href="/wiki/Chank" class="freelinking" rel="nofollow">Chank</a> Army. He also distributes his fonts through his one man foundry, <a href="/wiki/MADtype" class="freelinking" rel="nofollow">MADtype</a>.</p>
  html_clean: <p>Born in Minneapolis, MN, 1977. Matt got interested in designing fonts in 1996 when he studied visual communication at the Minneapolis Technical College. Matt became one of the founders of <a href="/wiki/Test%20Pilot%20Collective" class="freelinking link-lost" rel="nofollow">Test Pilot Collective</a> after meeting <a href="/wiki/Joe%20Kral" class="freelinking link-lost" rel="nofollow">Joe Kral</a> and <a href="/wiki/Mike%20Cina" class="freelinking link-lost" rel="nofollow">Mike Cina</a> through the <a href="/wiki/Chank" class="freelinking link-lost" rel="nofollow">Chank</a> Army. He also distributes his fonts through his one man foundry, <a href="/wiki/MADtype" class="freelinking link-lost" rel="nofollow">MADtype</a>.</p>
