    html: <p>I have occasionally set the numbers in a smaller point size this sort of instance. You need to experiment a little, because 8 or 9 point numbers set in otherwise 10 pt text will look too light. <br> <br>This is easily solved with a superfamily like Helvetica. If you are using Helvetica Regular for the text, try setting the numbers in a slightly darker weight (medium or semibold). This can even everything out, if I remember correctly.</p>
