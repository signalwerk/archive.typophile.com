  html: <p>Hi, <br>When setting some text all in lowercase with a sans serif font like Helvetica neue should I use the regular size numbers (that lines up with capital letters) or make them a smaller point size ( 80 or 90% smaller)?  <br>I don't know if smaller numbers are available or even appropriate for that font. <br>I read in "Rules of typography" that one shouldn't use lining numbers with lower case and I don't know that applies to all fonts and if there are exceptions to that rule. <br>Many thanks, <br>Barbara</p>
  html_clean: <p>Hi, <br>When setting some text all in lowercase with a sans serif font like Helvetica neue should I use the regular size numbers (that lines up with capital letters) or make them a smaller point size ( 80 or 90% smaller)?  <br>I don't know if smaller numbers are available or even appropriate for that font. <br>I read in "Rules of typography" that one shouldn't use lining numbers with lower case and I don't know that applies to all fonts and if there are exceptions to that rule. <br>Many thanks, <br>Barbara</p>
