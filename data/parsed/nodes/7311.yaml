    html: <p>The numerals in FF Unit are what's generally called "hybrid" (although they're a bit on the mild side for me in terms of extension), and I heartily agree that they're the ideal overall scheme. Sometimes though other styles (like 3/4 lining) can be better, if rarely. <br> <br>hhp</p>
