    html: <p>There are quite a few resources on the <a class="freelinking external" href="http://www.microsoft.com/typography/default.mspx" rel="nofollow">Microsoft Typography site</a>, specifically associated with <a class="freelinking external" href="http://www.microsoft.com/typography/tools/vttusers.aspx" rel="nofollow">Visual TrueType (VTT)</a>.</p>
