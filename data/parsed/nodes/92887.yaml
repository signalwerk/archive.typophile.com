    date: 2012-05-10T03:47:00
    votes: null
    html: <p>See the <a class="freelinking external" href="http://luc.devroye.org/tt_hinting_tutorial.pdf" rel="nofollow">Practical TrueType Hinting</a> PDF for some FontLab-specific examples.</p>
  - id: 509275
    user_id: 19774
    user_name: gaultney
    user_path: null
    date_raw: 10 May 2012 — 8:48am
    date: 2012-05-10T08:48:00
    votes: null
    html: "<p>There are a lot of things you can do to maximise FontLab's autohinting without getting into manual tweaking of hints. See <a class=\"freelinking external\" href=\"http://scripts.sil.org/NotesOnHintingWithFL\" rel=\"nofollow\">Notes on Hinting with FontLab</a>. Adam Twardoch wrote up a much more detailed follow-on: <a class=\"freelinking external\" href=\"http://www.fontsurgery.com/fonts/font-dev/hinting/autohinting-with-fontlab-studio-5/\" rel=\"nofollow\">Autohinting with FontLab Studio 5</a>. You may also want to try avoiding FL's hinting altogether with <a class=\"freelinking external\" href=\"http://www.freetype.org/ttfautohint/\" rel=\"nofollow\">ttfautohint</a>.</p>"
