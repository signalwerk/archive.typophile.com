    <p>Here you can find some images of the fonts i have made...</p>
    <p>i don’t consider myself as typographer, i just simply made fonts just for the fun of it and for my own amusement...some of them have been shown at the two past Letras Latinas (latin american type biennial) and the Tipos Latinos (latin american type biennial in 2008) in several cities of Latin America such as Buenos Aires, Santiago, Sao Paulo, Lima and Mexico City and also have been shown at the TypeCon in Seattle in 2007.</p>
    <p>Confundida and Hellvetica are postmodern style type experiments and are the result of mixing type styles (script and sans bold, old english gothic and helvetica).</p>
    <p>Demasiado Corazón (too much heart) is a dingbat font inspired in Frida Kahlo’s and old religious paintings.</p>
    <p>Tzompantli (aztec word describing a wall made of skulls) is both a type and a dingbat font made for an art installation about Las muertas de Juarez (the dead women of Juarez).</p>
    <p>Kelvin is a retro font based in 40s and 50s car names plates.</p>
    <p>Petróleo Crudo an Petróleo Negro are stencil grungy fonts, and last (but not least) La Mancha is a font based in the proportions of Garamond and was made for the title of Cervante’s Don Quixiote book</p>
    <p>Hope you find them interesting</p>
