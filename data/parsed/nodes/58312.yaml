      <p>It says "LakersGround" to me.</p>
      <p>The spaces after "L" and "G" are quite distracting. In fact, the large version almost looks like "L Akers G Round". Try kerning them closer, but I suspect that you'll have to connect them as you did with the rest of the letters.</p>
      <p>The descender on the "G" may be aggravating the disturbance by breaking up the line.</p>
