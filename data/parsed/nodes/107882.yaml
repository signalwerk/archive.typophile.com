  html: |-
    <p>Using a font with some nice glyphs but how do i insert glyph variants into photoshop? It seems there is no glyph palette, i can view all the available glyphs in the Mac 'character viewer' but when i go to select a glyph to insert such as an underline it just says - "The application you are currently using doesn't support glyph variants."</p>
    <p>Any work arounds?</p>
