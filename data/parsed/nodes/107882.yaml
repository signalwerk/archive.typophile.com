    html: <p>The PopChar that Charles mentioned above will work only if the font in question has had encoding assigned to non unicode glyphs. In most cases you wouldn't know that unless you ask the font designer before purchasing it. That's why a lot of people find it easier to set type in Illustrator and paste it into Photoshop.</p>
