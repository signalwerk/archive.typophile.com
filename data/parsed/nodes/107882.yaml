      <p>AFAIK, the ONLY way is to use Illustrator, get the right thing, and then copy and paste into Photoshop.</p>
      <p>I don't think either PopChar or InDesign puts glyph variants on the clipboard in a way that Photoshop will understand them. At least, they didn't the last time I looked at the problem.</p>
