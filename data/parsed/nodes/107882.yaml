      <p>&gt;&gt; I don't think ... InDesign puts glyph variants on<br>
      &gt;&gt; the clipboard in a way that Photoshop will understand them</p>
      <p>&gt; I can't say if it always works, but it's worked for me. I used the Glyphs palette to insert<br>
      &gt; the characters into an InDesign document and then copied/pasted.</p>
      <p>The thread topic, and my reply, is about <strong>glyphs</strong>, not characters. You can get the characters (Unicode) from InDesign to Photoshop, but at least in CS6 glyph variant information is still NOT preserved from InDesign to Photoshop (I just tried it again), but IS preserved from Illustrator to Photoshop.</p>
      <p>What does this mean? If you have an ornament that is encoded as an alternate of the bullet, but has no unique Unicode of its own, you can copy-paste it from Illustrator to Photoshop and get the desired ornament, but going from InDesign to Photoshop will revert it to a plain bullet. Similarly other OpenType-specific formatting.</p>
