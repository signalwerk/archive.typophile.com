    html: <p>What you want to worry about is the horizontal continuity...ie. don't lose the horizontal flow that should naturally lead the reader from left to right then down a line etc etc. This can happen if you have rivers/puddles, incorrect leading or kerning/tracking. Your example which creates a 'block' reads fine.</p>
