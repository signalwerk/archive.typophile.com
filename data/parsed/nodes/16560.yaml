      <p>Oh I see, so as long as the text feels like a block (without the rivers) I’m fine. But what about consistency, I think that’s what Si is talking about; i.e. spacing of phone and the apartment number ? Is this just a personal taste ? For the last few days I’ve been looking at a lot stationery from a various studios and some designer would kern in a similar way, but others would not even touch it (and I’m not taking about excessive kerning here). I know it’s a case by case thing, but clearly it seems to me there are different schools of doing it ?</p>
      <p>PS<br>
      Si, I’m not sure what do you mean about the post code. Is there a correct way of spacing a post code ?</p>
