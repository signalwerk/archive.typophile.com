    <p>Hi,</p>
    <p>I have a question regarding good kerning practices in stationery design.<br>
    I’m working on a stationery project and in the business card I have 3 stacked lines (address and phone) and I’m wondering if it’s o.k to kern the 3rd line quite loose in order to match the length of the other two lines. Also, my 2nd line is slightly looser than the 1st line. Is this practice acceptable or a big “no-no” in typography ? Thanks very much !</p>
    <p>Jen </p>
    <p>Typeface: Cronos-small caps 7.5/10</p>
