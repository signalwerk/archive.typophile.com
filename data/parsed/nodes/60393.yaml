    html: <p>There are stylistic alternates (which have different shapes for aesthetic reasons) and there are localized forms (which have different shapes to adapt to specific languages). If you're interested in localized forms you can check out House Industries' Studio Lettering which takes it to an extreme <a href="http://www.houseind.com/fonts/studiolettering/fontfeatures" title="http://www.houseind.com/fonts/studiolettering/fontfeatures">http://www.houseind.com/fonts/studiolettering/fontfeatures</a>.</p>
