      <p>Perhaps not in text fonts but in display fonts, there seems to be a lot of tolerance for screwing around with accents. Take a risk. If anyone's confused, they can contact you and you can change the accents in the next version. What would be useful is a Flickr pool of wacky accents so font designers can get a feel for how far they can be pushed.</p>
      <p>There are no languages in which a macron and a tilde need to be differentiated, so go nuts.</p>
