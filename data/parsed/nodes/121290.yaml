  html: |-
    <p>Two free SIL fonts have been updated.</p>
    <p>Charis:<br>
    Overview at <a href="https://web.archive.org/web/20170806220202/http://scripts.sil.org/cms/scripts/page.php?item_id=CharisSI">http://scripts.sil.org/cms/scripts/page.php?item_id=CharisSI</a><br>
    Download and List of Changes at <a href="https://web.archive.org/web/20170806220202/http://scripts.sil.org/cms/scripts/page.php?item_id=CharisSIL_download">http://scripts.sil.org/cms/scripts/page.php?item_id=CharisSIL_download</a><br>
    Note the Charis SIL Compact; the "Compact" refers to the leading.</p>
    <p>Gentium:<br>
    News: <a href="https://web.archive.org/web/20170806220202/http://scripts.sil.org/cms/scripts/page.php?item_id=Gentium_news">http://scripts.sil.org/cms/scripts/page.php?item_id=Gentium_news</a><br>
    Download and List of Changes: <a href="https://web.archive.org/web/20170806220202/http://scripts.sil.org/cms/scripts/page.php?item_id=Gentium_download">http://scripts.sil.org/cms/scripts/page.php?item_id=Gentium_download</a><br>
    This release just has the regular and italic versions.</p>
    <p>The Gentium Basic version has the Bold fonts as well as a slightly darker Book Basic and Book Basic Bold. These Basic fonts are not updated yet. Info on the Gentium Basic fonts:<br><a href="https://web.archive.org/web/20170806220202/http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=Gentium_basic#d5f686dc">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=Gentium_basi...</a></p>
