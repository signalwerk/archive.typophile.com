    html: "<p>darrel says: <i>The web offers the unique feature of allowing for a highly distinct separation of presentation and content. For some...typically long-time print designers, this is seen as a horrific loss of control. For others, it's seen a big benefit for a variety of reasons.</i> <br> <br>I overstated my case, maybe. I'm all for accessible sites, assistive technologies, and my elderly relations being able to decipher my rambling screeds about Satanic heavy metal by using their own fonts and colors. Also, every time I have to wade through some schlocky overdone Flash site to get at someone's photography, type, or writing, it makes me tetchy and unpleasant to be around. <br> <br>At the same time, \"separation of presentation and content\" is a canard that's been a canard since Marc Andreessen hacked the IMG tag into HTML, and it continues to be a canard even today in the days of XHTML 1.1 and CSS 3 (maybe, someday). Not only have the two always been hopelessly tangled on the real Web (not the theoretical, W3C Web), but I'm not sure that we, as typographers, would really want it to be otherwise. The only real justification we can provide for having hundreds of text faces and thousands of display faces is that typefaces become part of the texts they spell out. Even digital type rendered on lo-res screens has personality and character, and that character informs the text. <br> <br>That's the reason I would like to see embedding. If I want absolute control over positioning and appearance, there's always PDF. What I actually want is a way to make my blog look nice for everyone by default. They can tweak it on their end all they want, but having no control at all</p>"
