    html: <p>I'm surprised that sIFR hasn't made a bigger splash, actually. It's a little hinky here and there, but it basically works. Its biggest drawback is that it can't reliably draw with a transparent background. Also, at least with Safari, sIFR'd text, though it can be selected, can't be copied to the clipboard, which breaks one of its benefits. I'm cool with existing screen fonts for text. It's not great, but I can live with it for the moment. But I'm glad to have the option of any font I choose for headings without resorting to images.</p>
