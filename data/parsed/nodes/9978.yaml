    html: "<p>Actually, the problem goes the exact other direction: Debian is the most exactingly anal free software distribution on the planet. They had a three-month flamewar recently on whether it was permissible to distribute software what would load binary-only firmware blobs into peripheral devices, if the license for the firmware was insufficiently free. <br> <br>Anyway, this is all sort of off the point, because most users of desktop Linux are incapable of installing that package anyway (Debian's installer for it, which does some mildly bizarre things to avoid violating the MS EULA, is more straightforward than most). Surfing the web on Linux has been a pretty lame experience until pretty recently, and even now, it's kind of a pain. Free X servers only started offering decent antialising in the last few years, and until two years ago it was really difficult to configure. <br> <br>My point, such as it was, is that it would be really nice to have a method for ensuring consistent type display on the web that was independent of the underlying operating system. For the reasons we've been discussing, CSS isn't up to the job (even leaving aside browser implementation issues). I understand the technological, political, and social reasons why we don't</p>"
