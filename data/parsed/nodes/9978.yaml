    html: <p>The web is a medium that is very much about accessibility. It is as much about end-user preferences and whims is it is about back end designer's preferences and whims. <br> <br>Font embedding didn't take off because it's not really needed for the medium to work.  <br> <br>Flash methods like sIFR are actually quite useful for a bit of specific font spec'ing here and there, but I'd never dream of setting an entire page using the technique. And, honestly, I'm quite happy with the current selection of typeface for most web work I do. In the end, it doesn't matter how much I like Univers, if the end user prefers verdana, so be it.</p>
