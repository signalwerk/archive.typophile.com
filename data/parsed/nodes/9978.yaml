    html: "<p><i>Font embedding sounds great, but it's actually a technology that has come and gone with little fanfare.</i> Pffrroopht... hmm ok. gone <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>No really, if that 'embedding' needs to work it cannot be 'embedding'. Would you embed the images of an interface of a website? Obviously not. Only content images and even there, it's just linking to files. <br> <br><i>Having 100% control of the typeface isn't necessarily a prerequisite for creating a great user experience. Many would argue giving the end-user some control is actually what gives them a great user experience.</i> <br> <br>Well actually it is. Think about it from this POV: Either designers render their headlines and subtext into images (even CSS replacements like the Fahrner / Inman replacement, which is a lot of work if done manually) or they assign a font file to their headline ID or CLASS and all content is content. <br> <br>This way you have the choice of 'breaking the intended design' and using your own font to display the document or doing nothing and use it as designed. Just image Nick Shinn or HHP could disable Helvetica for websites and assign one of their fonts instead <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> *ducks*</p>"
    html_clean: "<p><i>Font embedding sounds great, but it's actually a technology that has come and gone with little fanfare.</i> Pffrroopht... hmm ok. gone <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>No really, if that 'embedding' needs to work it cannot be 'embedding'. Would you embed the images of an interface of a website? Obviously not. Only content images and even there, it's just linking to files. <br> <br><i>Having 100% control of the typeface isn't necessarily a prerequisite for creating a great user experience. Many would argue giving the end-user some control is actually what gives them a great user experience.</i> <br> <br>Well actually it is. Think about it from this POV: Either designers render their headlines and subtext into images (even CSS replacements like the Fahrner / Inman replacement, which is a lot of work if done manually) or they assign a font file to their headline ID or CLASS and all content is content. <br> <br>This way you have the choice of 'breaking the intended design' and using your own font to display the document or doing nothing and use it as designed. Just image Nick Shinn or HHP could disable Helvetica for websites and assign one of their fonts instead <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> *ducks*</p>"
