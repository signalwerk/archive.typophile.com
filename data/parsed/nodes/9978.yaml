    html: <p>The real issue is that it's not safe to assume that everyone browsing your site has any given fonts at all installed. While Microsoft was distributing their core fonts for the web, it was safe-ish, and we can assume that most clued-up web users will have the usual suspects (Verdana, Georgia, Courier, etc.) installed, there's no real way to present a consistent typographical feel to everyone. <br> <br>sIFR is an elegant hack for dealing with display type (and I appreciate the lengths its creators pursued to avoid interfering with assistive technologies), but it sucks for body type. I've read enough working group messages to think this may be infeasibly complicated in the near to medium term, especially because browser developers don't seem to see much percentage in tangling with it anymore.</p>
    html_clean: <p>The real issue is that it's not safe to assume that everyone browsing your site has any given fonts at all installed. While Microsoft was distributing their core fonts for the web, it was safe-ish, and we can assume that most clued-up web users will have the usual suspects (Verdana, Georgia, Courier, etc.) installed, there's no real way to present a consistent typographical feel to everyone. <br> <br>sIFR is an elegant hack for dealing with display type (and I appreciate the lengths its creators pursued to avoid interfering with assistive technologies), but it sucks for body type. I've read enough working group messages to think this may be infeasibly complicated in the near to medium term, especially because browser developers don't seem to see much percentage in tangling with it anymore.</p>
