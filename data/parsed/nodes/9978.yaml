  html: "<p>there have been some efforts in making font embeding in html-based sites possible: <a href=\"http://www.microsoft.com/typography/WEFT.mspx\">weft</a>, <a href=\"http://www.glyphgate.com/\">glyphgate</a>, <a href=\"http://www.mikeindustries.com/blog/archive/2004/08/sifr\">sifr</a>. (are there others?) <br> <br>the problem with weft is that it works just for ie on pc. <br> <br>the problem with glyphgate is that it is expensive, and that it does not really work well - the demo pages don't work on safari, firefox crashes when i try to enter the gg site (on osx). <br> <br>sifr uses flash to deliver the fonts - it seems to work well... but just for titles. <br> <br>ah, there is <a href=\"http://www.photofont.com/\">photofont</a> too, which is not an embedding tool but a xml-based font format for the web. but it also doesn't work on my safari or firefox either... and it seems like nobody is working on the technology anymore. <br> <br>how far are we from a solution that works? <br>what are the technical, legal, commercial etc. obstacles? <br>are we doomed to use flash for delivering anything that is not verdana, arial, times or georgia...?</p>"
  html_clean: "<p>there have been some efforts in making font embeding in html-based sites possible: <a href=\"http://www.microsoft.com/typography/WEFT.mspx\">weft</a>, <a href=\"http://www.glyphgate.com/\">glyphgate</a>, <a href=\"http://www.mikeindustries.com/blog/archive/2004/08/sifr\">sifr</a>. (are there others?) <br> <br>the problem with weft is that it works just for ie on pc. <br> <br>the problem with glyphgate is that it is expensive, and that it does not really work well - the demo pages don't work on safari, firefox crashes when i try to enter the gg site (on osx). <br> <br>sifr uses flash to deliver the fonts - it seems to work well... but just for titles. <br> <br>ah, there is <a href=\"http://www.photofont.com/\">photofont</a> too, which is not an embedding tool but a xml-based font format for the web. but it also doesn't work on my safari or firefox either... and it seems like nobody is working on the technology anymore. <br> <br>how far are we from a solution that works? <br>what are the technical, legal, commercial etc. obstacles? <br>are we doomed to use flash for delivering anything that is not verdana, arial, times or georgia...?</p>"
