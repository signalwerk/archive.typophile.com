    html: <p><i>"At the same time, "separation of presentation and content" is a canard " <br> <br>This is where the debate forks. I can appreciate and understand both paths here. There's plenty to argue that it is, indeed, just a canard, while there's plenty to argue the practical beneifts of it as well.</i> <br> <br>Well, I meant in practice. People have been preaching the separation of the two since the inception in SGML, and my point was that even in the beginning, HTML confused the two, and people using HTML have been tangling the two every day. <br> <br><i>"or they assign a font file to their headline ID or CLASS and all content is content." <br> <br>Well, that's what we have now, Frank. You can do this with user-style sheets.</i> <br> <br>You can spec a font in a style sheet, but you can't include an actual font file. This was even briefly a part of CSS 2.somethingorother, but it died with embedding.</p>
