    html: <p>"At the same time, "separation of presentation and content" is a canard " <br> <br>This is where the debate forks. I can appreciate and understand both paths here. There's plenty to argue that it is, indeed, just a canard, while there's plenty to argue the practical beneifts of it as well. <br> <br>I, myself sit on the fence on that one. ;o) <br> <br>And I see your point about simply wanting the ability to suggest more options. I can't really disagree with that...it would be nice! I guess it's just not a priority for the web right now.  <br> <br>"This has less to do with the merits of the technology and more to do with money politics and browser wars, like much else on the Web." <br> <br>Well, that's true about the software industry, and perhaps most product-consumer industries in general. ;o) <br> <br>"or they assign a font file to their headline ID or CLASS and all content is content." <br> <br>Well, that's what we have now, Frank. You can do this with user-style sheets.</p>
