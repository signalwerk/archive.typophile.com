    html: <p>Why is it necessary to have a new font format? <br>Surely browsers should be able to work with any font, and why not the OpenType format? <br> <br>I just don't understand what the difficulty is. <br>1. Load fonts on site server with other web info. <br>2. Download fonts used on a web page when it is opened. <br>3. Delete font when page is closed. <br> <br>If engineers can figure out streaming video, surely streaming fonts shouldn't be a problem.</p>
