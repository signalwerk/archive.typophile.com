    html: <p>"We've all seen where this leads" <br> <br>Well, it leads to having fairly accessible content and functionality for folks.  <br> <br>Everyone has a 'clue' about design. It's just more refined for those of us with formal training. And if grandma likes her 18pt Times New Roman, who am I to argue with her? <br> <br>The web offers the unique feature of allowing for a highly distinct separation of presentation and content. For some...typically long-time print designers, this is seen as a horrific loss of control. For others, it's seen a big benefit for a variety of reasons. <br> <br>It's been said for years, but the web isn't print. Font embedding sounds great, but it's actually a technology that has come and gone with little fanfare. We do have alternatives now (as mentioned) and there are certainly times when wanting a specific typeface is called for and images or Flash take over quite nicely. SVG may come along soone or later (though I'm not holding my breath). For now, the web seems to work just fine without too much of a public outcry over a lack of font embedding. ;o) <br> <br>"what they need to create a great user experience" <br> <br>Having 100% control of the typeface isn't necessarily a prerequisite for creating a great user experience. Many would argue giving the end-user some control is actually what gives them a great user experience.</p>
