    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Palatino</strong></p>
    <p><a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a> designed Palatino for <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a> 1948–1950. The design proved successful, and the type grew into a family. Palatino, which was originally designed for hand setting, was quickly adapted for mechanical composition on the <a href="/node/12232" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype Machine</a>.</p>
    <p>The following relatives were all designed by Zapf in the 1950s for Stempel:<br><a href="/node/16865" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Aldus</a> is a version of Palatino optimized for the smaller sizes of text used in book&nbsp;settings.</p>
    <p><a href="/node/16868" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Michelangelo</a> is an all-caps titling face, lighter and more graceful than the original Palatino’s&nbsp;alphabet.</p>
    <p><a href="/node/16869" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Phidias Greek</a> is an all-cap Greek alphabet that corresponds with&nbsp;Michelangelo.</p>
    <p><a href="/node/16870" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Sistina</a> is a second all-caps titling face, much more heavy and sturdy than Michelangelo. More like the caps in Palatino&nbsp;Bold.</p>
    <p>During the 1960s, the members of the Palatino family were all adapted for Photo-typesetting machines. The world-wide popularity of Palatino’s design led to fragrant piracy; many foundries made their own Palatinos, most of which were drawn without the permission of Hermann Zapf, Stempel, or <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>.</p>
    <p>During the 1980s, a family of <a href="/node/add/wiki?edit%5Btitle%5D=PostScript%20Type%201" title="Create node &quot;PostScript Type 1&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">PostScript Type 1</a> fonts for Palatino were produced. These were distributed by Linotype, <a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a>, and their partners, and were included with many <a href="/node/14482" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">PostScript</a> printers. Thus Palatino probably reached the height of its&nbsp;distribution.</p>
    <p>In 1999, Zapf revised Palatino for Linotype and <a href="/node/20191" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Microsoft</a>, creating <a href="/node/16871" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Palatino Linotype</a>. The four OpenType fonts in the Palatino Linotype family each include 1325 glyphs, supporting the following code&nbsp;pages:</p>
    <p>1252 Latin 1<br>
    1250 Latin 2 Eastern<br>
    1251 Cyrillic<br>
    1253 Greek with polytonic Greek<br>
    1254 Turkish<br>
    1257 Windows Baltic<br>
    1258 Windows&nbsp;Vietnamese</p>
    <p>The fonts also include many different sets of figures, ligatures, and historical&nbsp;ligatures.</p>
    <p>Palatino Linotype was a grand foray into the possibilities of OpenType, but it did not include the entire scope and possibilities of the original metal Palatino family. Around 2003, Hermann Zapf began working with <a href="/node/12234" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akira Kobayashi</a>, artistic director at Linotype, on <a href="/node/16863" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Palatino nova</a>. This OpenType family would go on to include the following&nbsp;elements:</p>
    <p>Palatino nova Light<br>
    Palatino nova Light Italic<br>
    Palatino nova Roman<br>
    Palatino nova Italic<br>
    Palatino nova Medium<br>
    Palatino nova Medium Italic<br>
    Palatino nova Bold<br>
    Palatino nova Bold Italic<br>
    Palatino nova Titling (i.e., Michelangelo and Phidias Greek)<br>
    Palatino nova Imperial (i.e., Sistina)<br>
    Aldus nova Book<br>
    Aldus nova Book Italic<br>
    Aldus nova Bold<br>
    Aldus nova Bold&nbsp;Italic</p>
    <p>All fonts (except the two titling variants) contain complete Western and <span class="caps">CE</span> character sets. Palatino nova Roman, Palatino nova Italic, Palatino nova Bold, and Palatino nova Bold Italic also contain Greek and Cyrillic character&nbsp;sets.</p>
    <p>In January 2007, Linotype released <a href="/node/add/wiki?edit%5Btitle%5D=Palatino%20Sans" title="Create node &quot;Palatino Sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Palatino Sans</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Palatino%20Sans%20Informal" title="Create node &quot;Palatino Sans Informal&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Palatino Sans Informal</a>, two new sans serif typeface familes designed by Zapf and&nbsp;Kobayashi.</p>
