    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Palatino</strong></p>
    <p><a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> designed Palatino for <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> 1948–1950. The design proved successful, and the type grew into a family. Palatino, which was originally designed for hand setting, was quickly adapted for mechanical composition on the <a href="/wiki/Linotype%20Machine" class="freelinking" rel="nofollow">Linotype Machine</a>.</p>
    <p>The following relatives were all designed by Zapf in the 1950s for Stempel:<br>
    <a href="/wiki/Aldus" class="freelinking" rel="nofollow">Aldus</a> is a version of Palatino optimized for the smaller sizes of text used in book settings.</p>
    <p><a href="/wiki/Michelangelo" class="freelinking" rel="nofollow">Michelangelo</a> is an all-caps titling face, lighter and more graceful than the original Palatino's alphabet.</p>
    <p><a href="/wiki/Phidias%20Greek" class="freelinking" rel="nofollow">Phidias Greek</a> is an all-cap Greek alphabet that corresponds with Michelangelo.</p>
    <p><a href="/wiki/Sistina" class="freelinking" rel="nofollow">Sistina</a> is a second all-caps titling face, much more heavy and sturdy than Michelangelo. More like the caps in Palatino Bold.</p>
    <p>During the 1960s, the members of the Palatino family were all adapted for Photo-typesetting machines. The world-wide popularity of Palatino's design led to fragrant piracy; many foundries made their own Palatinos, most of which were drawn without the permission of Hermann Zapf, Stempel, or <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>.</p>
    <p>During the 1980s, a family of <a href="/wiki/PostScript%20Type%201" class="freelinking" rel="nofollow">PostScript Type 1</a> fonts for Palatino were produced. These were distributed by Linotype, <a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>, and their partners, and were included with many <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a> printers. Thus Palatino probably reached the height of its distribution.</p>
    <p>In 1999, Zapf revised Palatino for Linotype and <a href="/wiki/Microsoft" class="freelinking" rel="nofollow">Microsoft</a>, creating <a href="/wiki/Palatino%20Linotype" class="freelinking" rel="nofollow">Palatino Linotype</a>. The four OpenType fonts in the Palatino Linotype family each include 1325 glyphs, supporting the following code pages:</p>
    <p>1252 Latin 1<br>
    1250 Latin 2 Eastern<br>
    1251 Cyrillic<br>
    1253 Greek with polytonic Greek<br>
    1254 Turkish<br>
    1257 Windows Baltic<br>
    1258 Windows Vietnamese</p>
    <p>The fonts also include many different sets of figures, ligatures, and historical ligatures.</p>
    <p>Palatino Linotype was a grand foray into the possibilities of OpenType, but it did not include the entire scope and possibilities of the original metal Palatino family. Around 2003, Hermann Zapf began working with <a href="/wiki/Akira%20Kobayashi" class="freelinking" rel="nofollow">Akira Kobayashi</a>, artistic director at Linotype, on <a href="/wiki/Palatino%20nova" class="freelinking" rel="nofollow">Palatino nova</a>. This OpenType family would go on to include the following elements:</p>
    <p>Palatino nova Light<br>
    Palatino nova Light Italic<br>
    Palatino nova Roman<br>
    Palatino nova Italic<br>
    Palatino nova Medium<br>
    Palatino nova Medium Italic<br>
    Palatino nova Bold<br>
    Palatino nova Bold Italic<br>
    Palatino nova Titling (i.e., Michelangelo and Phidias Greek)<br>
    Palatino nova Imperial (i.e., Sistina)<br>
    Aldus nova Book<br>
    Aldus nova Book Italic<br>
    Aldus nova Bold<br>
    Aldus nova Bold Italic</p>
    <p>All fonts (except the two titling variants) contain complete Western and CE character sets. Palatino nova Roman, Palatino nova Italic, Palatino nova Bold, and Palatino nova Bold Italic also contain Greek and Cyrillic character sets.</p>
    <p>In January 2007, Linotype released <a href="/wiki/Palatino%20Sans" class="freelinking" rel="nofollow">Palatino Sans</a> and <a href="/wiki/Palatino%20Sans%20Informal" class="freelinking" rel="nofollow">Palatino Sans Informal</a>, two new sans serif typeface familes designed by Zapf and Kobayashi.</p>
