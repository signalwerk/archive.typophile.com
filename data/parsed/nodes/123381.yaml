  html: |-
    <p>Hi folks,</p>
    <p>Just wondering if there have been any revivals closely or loosely based on Caslon or Baskerville that include text, deck and display weights suitable for modern editorial design (print and digital)? </p>
    <p>I can think of Mrs. Eaves and Big Caslon but they are not robust enough in terms of weights.</p>
    <p>I think the answer is no but just want to make sure I am not missing something...</p>
    <p>Thanks!</p>
