    html: <p>Just a clarification — I think all of these artists (except for Mónika) would more likely call themselves hand-letterers than calligraphers. Hand-lettering and type design have a lot in common, whereas calligraphy is a whole different skill. Of course, each of these three often imitates the others.</p>
