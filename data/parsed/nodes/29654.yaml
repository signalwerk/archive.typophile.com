    <p>Perhaps this is an obvious one, but forgive me, I'm a newbie. Can anyone help me ID the typeface used for the Consumer Reports masthead? I will be redesigning the basic layout of a mag for a design class, but one of the requirements of the assignment is to incorporate the current masthead. </p>
    <p>Thanks in advance.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/CRmasthead.gif" width="134" height="285" alt="">
