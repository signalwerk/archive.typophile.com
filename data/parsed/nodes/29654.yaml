      <p>Possibly based on <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;startrow=1&amp;records=20&amp;currpage=1&amp;totalrecords=17&amp;searchby=&amp;searchID=&amp;searchletter=&amp;searchstr=folio&amp;font_categories_checkbox=font_name_search&amp;fontRendererText=Consumer+Reports" target="_blank">Folio</a>. Maybe a stretched Bold Condensed would be a good starting point.</p>
      <p> - Lex</p>
      <p>P.S. The masthead is usually the box on the inside of the magazine that tells who the editorial staff is. The logo on the front cover is usually called the nameplate or the banner.</p>
