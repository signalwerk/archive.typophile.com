    html: <p>What would be of even greater help is looking into the sources of inspiration for these posters. Check out <a class="freelinking-external" href="http://en.wikipedia.org/wiki/Josef_M%C3%BCller-Brockmann">Josef Müller-Brockmann</a> and <a class="freelinking-external" href="http://en.wikipedia.org/wiki/David_Carson">David Carson</a>. In my opinion, there’s far too many people simply emulating styles from ffffound without even knowing who they are referencing.</p>
