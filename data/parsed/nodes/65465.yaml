    <p>Hello,</p>
    <p>I'm a type fan-if-still-newbie and first-time poster compelled to submit a request for a coworker. She's been asked to recreate a very simple type design--for a quick-turnaround offset print job that needs a speedy diagnosis. She tried many variations of classic serif faces, but couldn't get the "C" or the "T" quite right. I didn't have any further suggestions off the top of my head. Also, is this semibold in weight?</p>
    <p>Thanks in advance for any help!</p>
    <p>(.pdf file attached)</p>
