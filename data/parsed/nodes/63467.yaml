    <p>Dear forum members,</p>
    <p>I am interested in historical aspect of various fonts.</p>
    <p>I read that Avant Garde Gothic was inspired by Bauhaus design ( <a href="http://www.adobe.com/type/browser/html/readmes/ITCAvantGardeStdReadMe.html" title="http://www.adobe.com/type/browser/html/readmes/ITCAvantGardeStdReadMe.html">http://www.adobe.com/type/browser/html/readmes/ITCAvantGardeStdReadMe.html</a> ).</p>
    <p>I would appreciate it if someone can provide images to show similar font design from 1920's-1940's.</p>
    <p>Thanks in advance,</p>
    <p>Akira Takiguchi  akira.takiguchi at gmail.com</p>
