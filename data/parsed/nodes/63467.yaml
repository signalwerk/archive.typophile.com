    html: |-
      <p>The Bauhaus-guys were really into using ‘building blocks’, which accounts for the geometric look of a lot of their products. Historically the use of geometric forms goes back to the days of Albrecht Dürer, but in the case of sans serif more specifically to the golden age of lithography (the latter half of the 19th century). </p>
      <p>Lithographic artists used books with samples of lettering where the more modern forms of lettering (sans) were often based upon geometric forms. A later pendant for this are the guides for painters (meant are house painters who often doubled as sign painters) who were also trained in painting letterforms starting out with geometric forms. I have seen samples in the historic village of Enkhuizen in the NL. And there are also sample books in the same lieu for stone masons, architects and so on. </p>
      <p>. . . .<br>
      Bert Vanderveen BNO</p>
