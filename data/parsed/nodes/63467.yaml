      <p>Jackson: I think it is actually a book cover.</p>
      <p>Nick: Are you sure about that? To quote Mac McGrew (referring to the metal version): "Twentieth Century is Monotype's copy of Futura, and in display sizes is essentially an exact copy, while composition sized are only slightly modified." If you showed both faces side by side with no labels, I doubt if anyone could tell which was which. The only obvious difference I can see are the quote marks. I could accept Vogue, which is more geometric and monoline than either Futura or Twentieth Century, as a more likely influence on Avant Garde.</p>
