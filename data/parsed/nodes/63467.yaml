      <p><em>@William Berkson:</em></p>
      <p>Twentieth Century is a precursor to Avant Garde because, unlike Futura, it is a monoline face. Avant Garde, likewise, is monoline, but renders all of the letters in pure geometric shapes. The larger x-height and shorter descenders was an ITC trend in many of their revivals.</p>
