      <p>To me, I first look for due diligence on the part of the student.  Have they made a sincere effort to solve their problem on their own?  Saying, "I looked everywhere" is not a good sign. If I feel the student is really making an effort, I might post back some leading questions in a sort of attempt at a socratic dialogue.  I hope that my questions will give them a new way to LOOK at the problem instead of just giving them a solution. I respond back again only if the student has put forth some thought and made a real attempt.  I am trying to make them "Design an Enquiring System" for themselves as opposed to handing them a canned answer--teach them to fish.</p>
      <p>Sometimes they become fisherman--sometime they just keep trolling for a free can of Tuna (Sorry Charlie).</p>
      <p>ChrisL</p>
