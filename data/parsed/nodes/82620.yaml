      <p>Perhaps all that Christopher is doing by posting his operational definitions of teacher and student is trying to limit the scope of the discussion to just that narrower view for the sake of simplicity.  It seems he is just clarifying that the problem he sees and wants to address in this thread is with "students" [as he has defined them] seeking help with formal school assignments as opposed to general information seeking on the web. It seems he is trying to place a boundary on what would be considered proper "help" by us here on Typophile, without "aiding and abetting" a perhaps lazy student who wants an easy way out of doing his own work. I don't know if I understand him correctly or not.</p>
      <p>If that is correct, there is still not a way to absolve either student or teacher from their real responsibilities in the formal education arena.  There will always be both lazy teachers and students to be found.  I doubt if we here can find an easy way to separate the wheat from the chaff. As others here have said. The poster and responder in every case ultimately will get whatever value he gets from the discussion.  The "Good" student will benefit much more than the lazy one but we have no real assurance that what we have said will be what he is searching for.  I prefer that we make no attempt to systematically evaluate or censor a request as a group and just let individuals post whatever they deem appropriate.  It may be Russian Roulette but at least not harmful or a means of censorship.</p>
