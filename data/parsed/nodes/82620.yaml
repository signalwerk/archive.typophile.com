      <p>I haven't posted here in a while, so I'm not really sure I qualify as a contributing member of this community, but as a student I feel the need to offer my opinion.</p>
      <p>I joined Typophile in January 2008, when I was a sophomore in college with a minor interest in type and design. I was at a point in my college career where I didn't have any clear career aspirations; I had started college wanting to be a journalist, but I had quit the school newspaper after one semester and decided that it wasn't for me. I figured that I would get through college majoring in something I enjoy (English and political science) and that something would be waiting for me when I got out. The only thing I knew was that I really enjoyed the act of creation involved in newspaper layout, and I had started reading type blogs in 2007.</p>
      <p>Now I'm a third-quarter design student at the Creative Circus, well on my way toward entering the industry as a kick-ass designer with killer type skills. And I have Typophile to thank for that. I have learned so much about type from these forums over the past three years that even in design school I'm known as a type guru.</p>
      <p>And the way I learned so much was not by asking questions and having them answered, but by listening to the conversations between the experts who inhabit these forums. And when I did have a question, it would be answered.</p>
      <p>The thing is, there's really no way that we can "do students' homework" for them. If they're using this forum as a primary source for research, then it will show through in their presentation. I agree with William that it should be up to the individual members —&nbsp;if you want to help students, then help them; if you don't, then don't.</p>
      <p>Because what this forum ultimately provides, more than anything else, is a community. The really amazing thing about this forum is that it is inhabited by everyone from overexuberant students like myself all the way up to type demigods like Erik Spiekermann. And to impose some sort of rules to curb "do my homework" syndrome would be to necessarily exclude students from this community. While I imagine that some of this forum's veterans like to regard themselves as the "true typophiles" and would like to preserve the purity of the community, we have to remember that part of Typophile's purpose is to spread knowledge and enthusiasm about type, and "otherizing" people who genuinely want to be a part of this community runs counter to that purpose.</p>
