      <p>Christopher : Since it's the 2nd time tonight that I run into a comment of yours that bashes my thread (i.e. on Twitter and your previous comment on this thread), I will give you some context on my situation.</p>
      <p>I teach classes every week night and freelance in the daytime. Out of my 5 classes, 4 of them are different. I give an introductory graphic design class, an InDesign and page layout class (x2), a pre-press class and the last type conception class of the program. </p>
      <p>In my type class last week, when I announced to my students the next project that we are about to do and which is already planned in the curriculum. They then let me know that they already did a similar project last semester, which was not supposed to happen. I don't think giving the same exercise twice would benefit their portfolio or their education so I whip up a new project last minute. I feel the need for a second opinion because I don't really have time to let it simmer as much as I would like to before giving them the actual deal so I turn to Typophile to explain my project and get some global opinions in case someone would spot a blatant mistake in my assignment that I didn't think of or would think of a better way to do things. </p>
      <p>I don't expect anyone to do my coursework for me and I would gladly share the results of the project I've given my students in the Typographic Education section which I think could benefit other teachers out there. Even if it's not perfect, they could still benefit from my mistakes.</p>
      <p>I think the way you've implied in the other thread that my students would come on the Typophile forum to get their homework done and now and on Twitter that I posted on the forum to get my coursework done by others is way disrespectful and completely undeserved. I realize that you don't speak for the whole but I find this kind of attitude very disappointing coming from a regular member of Typophile and I will definitely think twice before posting on Typophile again if it is to be treated in this manner.</p>
    html_clean: |-
