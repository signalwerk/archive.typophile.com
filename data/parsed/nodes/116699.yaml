    html: |-
      <p>Although Karl is correct about there being some issues with Word 2011, the symptoms you report do not seem to match the known font naming issues we see with Word for Mac.</p>
      <p>The RangeCheck error is a fairly generic PostScript error, indicating that some value generated somewhere in the output file was too large or small for the printer to handle. Although glyph complexity is one potential problem, and perhaps the most common, there are many other possibilities, including outline or hint coordinates being out of bounds.</p>
      <p>Kimmy, feel free to contact FontLab support for help as well.<br>
      <a href="http://www.fontlab.com/contact-and-support/product-support/problem-report/" title="http://www.fontlab.com/contact-and-support/product-support/problem-report/">http://www.fontlab.com/contact-and-support/product-support/problem-report/</a></p>
