    html: <p>With regard to Microsoft Word 2011, the issue is likely to stem from a lack of support for <a class="freelinking external" href="http://support.microsoft.com/kb/295062" rel="nofollow">third party fonts that do not conform to very specific naming standards</a>. <a class="freelinking external" href="http://forum.fontlab.com/index.php?topic=313.0" rel="nofollow">Adam Twardoch has created guidelines for font creation</a> that should help you to avoid this issue.</p>
