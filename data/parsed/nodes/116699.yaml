    <p>I've received an issue from a customer who purchased my font and is having trouble with it in InDesign 5.5 and Word. I've never come across this issue before with any other user and I have successfully used it in but programs so I'm not quite sure how to fix the problem on my end.  Here is the message I received from them:</p>
    <p>I received the attached error message when trying to use the font in Microsoft Word. When I validate the font in Font Book, it says the font is safe to use. When I tried printing an InDesign document with the font, it would not print. PDF's of the document will not print either. I did not receive an error message, but my colleague received the error message in Indesign 5.5:</p>
    <p>ERROR: rangecheck<br>
    OFFENDING COMMAND: definefont</p>
    <p>---</p>
    <p>As an fyi, the customer originally reported they are working on Mac OS X 10_6_8 in Microsoft Word for Mac 2011.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Lunchbox Slab Ornaments Error_4416.png"></div><p></p>
