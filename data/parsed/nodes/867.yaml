  html: <p>Trying to learn the original typeface for this Brendel Informatik font called Gotthard (quite possibly a ripoff clone). <br> <br>This one is driving me crazy, 'cause  it keeps belittling me with "Come on now. You've seen my unique <b>e</b> and my sexy <b>k</b> <i>lots</i> of times. Can't you remember <i>anything!?</i>". <br> <br>I hate that when type mocks me. <br><img src="http://www.typophile.com/forums/messages/83/13940.gif" alt=""></p>
