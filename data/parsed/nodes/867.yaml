    html: <p>It looks that way, eh? Well, I just found an old copy in very good condition and it's on it's way (superseded the ordering of the Solotype Catalog for now). <br> <br>Until it arrives ... I've nailed a couple more IDs on my own (Corvinus &amp; Sackers L Roman) and I'm down to seven remaining puzzlers. Thanks yet again Mike. <br> <br>Incidentally, Robert Wakeman, who made that Web page you bookmarked that included a sampling of Favrile, pointed me to <a href="http://www.castcraft-software.com/homepage.html" target="_top">Castcraft/OptiFont</a> as the source of his copies. They don't show Favrile online, but an e-mailed response states that they have the tyepface in "lots of weights". For your records ... if you care.  &lt;g&gt; <br><br></p>
