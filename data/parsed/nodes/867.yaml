    html: <p>The font is WTC Thaddeus, designed in 1982 by Thaddeus Szumilas. It was the WTC design just before Favrile that I ID'd for you recently, and it shows up in that same book by Lawrence Wallis, "Modern Encyclopedia of Typefaces 1960-90". Maybe you need a copy of that book to help you with those Brendel fonts.</p>
