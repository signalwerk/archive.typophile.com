    html: <p>ok so maybe there is just one of us! <br> <br>anyway, so i wondering then if a swash is an extension of handwriting (which i believe it is, correct me if i'm wrong) then would the loop that falls below the baseline of a lowercase f be considered a swash in a script typeface? or would a swash only refer the the ornimental gestures generally found in caps? </p>
    html_clean: <p>ok so maybe there is just one of us! <br> <br>anyway, so i wondering then if a swash is an extension of handwriting (which i believe it is, correct me if i'm wrong) then would the loop that falls below the baseline of a lowercase f be considered a swash in a script typeface? or would a swash only refer the the ornimental gestures generally found in caps? </p>
