    <p>Dear Typophilers,</p>
    <p>CakeType is proud to announce the launch of our farm-fresh website and the release of new typefaces!</p>
    <p>~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</p>
    <p><strong>NEW OPENTYPE LIBRARY</strong> &nbsp;&nbsp;<br>
    With this launch we stop selling typefaces in Postscript Type 1 and TrueType formats as a standard. From now on CakeType typefaces will be available exclusively in the OpenType format. By request it is of course possible to receive our typefaces in a different format.<br>
    Most of the fonts have a characterset which covers full CE support and some of them have Greek and Cyrillic charactersets.</p>
    <p>Customers who bought typefaces from the old collection which are still in the new collection can upgrade the fonts to OpenType for free. Please fill in the online form to contact us.<br>
    <a href="http://www.caketype.com/support/contact" title="http://www.caketype.com/support/contact">http://www.caketype.com/support/contact</a></p>
    <p>~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</p>
    <p><strong>NEW TYPEFACES</strong><br>
    Almost all typefaces in the collection are new or updated. We like to highlight a few new designs: </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Nitti_4059.gif"></div><p></p>
    <p>NITTI<br>
    Nitti is an 11-pitch (which means 11 characters equals one inch when set at 11 pt) monospaced grotesque typeface, inspired by the irregular grotesques of the 19th and early 20th century. The family includes five weights from Light to Black with an extended (Latin) character set. OpenType features include slashed zero, alternative shapes for double slash and dashes and a pictogram of a pair of scissors. The typeface also contains a set of arrows.<br>
    <a href="http://www.caketype.com/type/nitti" title="http://www.caketype.com/type/nitti">http://www.caketype.com/type/nitti</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Pinup_6181.gif"></div><p></p>
    <p>PINUP<br>
    Pinup is a soft, voluptuous and sexy single weight display typeface with an extended (Latin) character set and OpenType features which include ligatures, alternative shapes for some characters and a pinup. The typeface also contains a set of arrows.<br>
    <a href="http://www.caketype.com/type/pinup" title="http://www.caketype.com/type/pinup">http://www.caketype.com/type/pinup</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Panno_5137.gif"></div><p></p>
    <p>PANNO / PANNO ROUNDED<br>
    Panno is the retail version of Hangil E-Type, the signing typeface we designed for the English names on the road signs in South Korea. The typeface is available in one weight with two versions (positive and negative) with an extended (Latin) character set. OpenType features include an alternative shape for the figure four and ligatures. The typeface also contains a set of arrows.<br>
    Panno / Panno Rounded:<br>
    <a href="http://www.caketype.com/type/panno" title="http://www.caketype.com/type/panno">http://www.caketype.com/type/panno</a><br>
    <a href="http://www.caketype.com/type/panno_rounded" title="http://www.caketype.com/type/panno_rounded">http://www.caketype.com/type/panno_rounded</a><br>
    Hangil E-Type:<br>
    <a href="http://www.caketype.com/custom/signing" title="http://www.caketype.com/custom/signing">http://www.caketype.com/custom/signing</a></p>
    <p>~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</p>
    <p><strong>NEW BOOKLET</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Enorm_klein_4222.jpg"></div><p></p>
    <p>"Enorm klein" (Enormously small) is a collection of the biggest amongst the smallest and the smallest amongst the biggest. The booklet is typeset in Capibara Classic (part of the Pixel Package) and richly illustrated and decorated.<br>
    <a href="http://www.caketype.com/books/enorm_klein" title="http://www.caketype.com/books/enorm_klein">http://www.caketype.com/books/enorm_klein</a></p>
    <p>~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</p>
    <p><strong>DISCOUNT</strong><br>
    To celebrate the launch of our new website and new typefaces, we give a 25% discount on any typeface or package from our collection. Books are exclude from discount.<br>
    This offer is valid until June 30th, 2009.</p>
    <p>Coupon code: CPN3608988576 </p>
    <p>~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</p>
    <p>Best wishes,<br>
    Pieter van Rosmalen<br>
    <a href="http://www.caketype.com" title="http://www.caketype.com">http://www.caketype.com</a></p>
