      <p><em>You could go for Linotype’s Font Explorer, see the righthand side for download for PC.</em></p>
      <p>Tim, that PC-Download is <a href="/wiki/FontExplorer" class="wiki">FontExplorer</a> not <a href="/wiki/FontExplorer%252BX" class="wiki">FontExplorer X</a>. FontExplorer is just a tool to view and search for Linotype fonts.</p>
      <p>“FontExplorer X” is the a font management tool from Linotype, which will additionally let customers easily purchase and install fonts from Linotype and other foundries on their computers. Currently, it is only available as a beta-program for Mac OS X. But the full version for Mac, and a public beta version for Windows, will be available soon.</p>
      <p>So, unfortunately, PC users aren’t able to manage their fonts with FontExplorer X just yet. Sorry for the confusion.</p>
