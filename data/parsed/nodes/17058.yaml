      <p>As long as you copy the fonts to a safe location before deleting them from the fonts folder you will likely be okay - the absolutely essential system fonts like Tahoma and Microsoft Sans Serif are “system file protected” so “come back” if you manage to delete them.</p>
      <p>You could also invest in suitcase or another font management utility. </p>
      <p>Cheers, Si</p>
