      <p>For a Windows font manager, can I suggest Corel’s BitStream Font Navigator.</p>
      <p>It comes as part of CorelDRAW Graphics Suite 12.</p>
      <p>However, a fully-functional version is included in the trial download of CorelDRAW Grahics Suite 12.</p>
      <p>Simply download the trial version (you will need to sign up to Corel’s website, if you have not already).  When installing, use a custom installation - choosing only to install BitStream Font Navigator (it is in the Utilities section).</p>
      <p>It is free, easy to use, quick, and has pretty much all the necessary features.</p>
