  html: |-
    <p>Whenever I do an install or reinstall of Windows on my or my colleague’s machines (we’re a small company, so I am an IT girl too among other many things :D), I get a whole bunch of useless/ugly/just weird fonts installed too. Even worse things get, if someone new is smart enough to download some of the “10 000 free fonts” collections available on filesharing servers (most of which are illegal and useless anyway) and install them to proudly demonstrate their abilities. I believe in the ’less is more’ philosophy and for many reasons try to remove as many of them as I dare. </p>
    <p>So can anyone provide me a list with the essential fonts that Windows and web pages commonly use, so I would be sure as to what I can throw out without much harm done :)?</p>
