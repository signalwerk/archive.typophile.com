  html: '<p>Using mainly PHP-mySQL scripts, with a little Javascript thrown in, I have created an online script to render input text into images, using ligatures where appropriate. <br> <br>Currently only a single typeface is available, named Burgerserve, it is created by my brother Christopher Washer. Its narrow form is available, only in lowercase. No numbers, uppercase or punctuation are available, the typeface itself is still being developed. <br> <br>You can find out more about it and the script itself here: <a href="http://nefariousf.freeserverhost.com/typerender/index.php">TypeRender 1.0</a>. I will also add a page describing how it functions for those who have some knowledge of php.</p>'
  html_clean: '<p>Using mainly PHP-mySQL scripts, with a little Javascript thrown in, I have created an online script to render input text into images, using ligatures where appropriate. <br> <br>Currently only a single typeface is available, named Burgerserve, it is created by my brother Christopher Washer. Its narrow form is available, only in lowercase. No numbers, uppercase or punctuation are available, the typeface itself is still being developed. <br> <br>You can find out more about it and the script itself here: <a href="http://nefariousf.freeserverhost.com/typerender/index.php" class="link-external">TypeRender 1.0</a>. I will also add a page describing how it functions for those who have some knowledge of php.</p>'
