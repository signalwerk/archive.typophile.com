  html: |-
    <p>Which translates to one, two, three, four! from Maori. <a href="http://theletterheads.co.nz/images/other/tahirua.gif" rel="nofollow">It is a poster</a> designed by Gus and I to promote our spanking new graphic design business, (here is the <a href="http://typophile.com/node/15252" rel="nofollow">website critique</a>.) The letterforms were made by tearing pieces of paper and scanning directly into photoshop with minimal adjustments. <a href="http://theletterheads.co.nz/images/other/tahirua-r.gif" rel="nofollow">Here is a closeup of the 'R'.</a> </p>
    <p>Vital stats about the poster: A1 (840mm x 594mm) folded to A5 (210mm x 148mm). Printed on Munken Lynx 100gsm. Colours are black and Pantone 485.</p>
