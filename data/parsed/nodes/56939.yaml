    html: <p>I wonder what the legal side of that is if you design something and this happens. If your contract states what happens that is one thing, but if you have no clause regarding the question... Certainly it seem like the designer should be given back the rights but that doesn't mean that that is how the legal system works. Also if the company has debts that IP might be seen as an asset. The easy thing might be to buy it even if it is for a low or nominal cost.</p>
