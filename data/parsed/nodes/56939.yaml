    <p>In the Adobe Myriad CAD font discussion, John Hudson brought up the following point about some custom commissioned fonts: "I’ve no idea what happened to the fonts, but presumably IBM owns them, whether they realise it or not."</p>
    <p>With all of these financial institutions, tech companies, etc., going under, I assume that quite a few custom typefaces are going to hit the wastebin.</p>
    <p>I think it would be interesting to try to make a list of all of the commissioned typefaces that have been abandoned and/or forgotten, and perhaps find a way to revert them back to their designers or even open source them. (GASP!)</p>
    <p> Any thoughts?</p>
