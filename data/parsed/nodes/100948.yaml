    <p>Hi everybody, </p>
    <p>I draw a logo with a Google font because my client want the same typo on his website and on his logo.<br>
    So I use "Coustard" : <a href="http://www.google.com/webfonts/specimen/Coustard">http://www.google.com/webfonts/specimen/Coustard</a></p>
    <p>But when I vectorize it with illustrator, it's completly deformed... as you can see in attached file.<br>
    I never saw it.</p>
    <p>Do you know a copy of coustard or an other solution to vectorize a typo ?<br>
    Do you understand what's the problem ?</p>
    <p>Thank for your support</p>
    <p>Fanneau<br>
    {link removed by moderator}</p>
