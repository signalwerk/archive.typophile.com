    html: |-
      <p>Blimey! Caught leaving a url signature on typofight.</p>
      <p>Like all fonts auto-instructed by an early version of ttfautohint, the outlines get hosed when being turned into outlines in certain OSX Adobe apps. Same would happen to output with the instructed TTF's via certain postscript printer drivers. Wasn't a feature to restrict non-web use (nice idea tho!), but a bug. Got fixed, but there's still a few fonts that have slipped the net. Coustard was 're-hinted' some time ago, but maybe not yet updated on certain font servers. Updated version available from vernnobile on github. Won't leave a url, just in case :)</p>
    html_clean: |-
