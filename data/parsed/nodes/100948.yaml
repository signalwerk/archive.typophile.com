    html: |-
      <p>He mentions his employer in his signature; that is not intended as spam.</p>
      <p>It is a serious problem if fonts don't outline correctly, but in the case of Coustard, it is much less of a problem, since that is a free font. Hence, one's service bureau can be given a copy. In the case of commercial fonts, to obey the license and have it printed, one has to turn the document into outlines so that the font need not be embedded or given to the service bureau doing the printer - and so a metrics bug like that in a commercial font turns the licensing into a fatal obstacle to printing documents.</p>
    html_clean: |-
