    html: "<p>I had to lift the images from the page to compare them side by side. Even though Besonio is very close, the S and R are not exactly the same shapes. I think Ed Gothic is still the answer, and here's how to make them closer (I think): <br> <br>If a black outline stroke is added it would make the letters thinner looking against a black background, and then change the proportions by either squeezing, or vertically stretching the letters. <br> <br>If I had this font I would demonstrate, but perhaps Tiffany could try it (please)? Use the original R with Alt S and C.</p>"
