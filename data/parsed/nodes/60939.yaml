    <p>The null/.notdef glyph incorrectly occupies less spaces than other glyphs.</p>
    <p>Latin letters a, e (97, 101) have wrong contours. The bug doesn’t exist in Chrysanthi Unicode.</p>
    <p>Vulgar fractions ¼, ½, ¾ (188-190) are nut fractions instead of vulgar fractions. The bug doesn’t exist in Chrysanthi Unicode. They are needed to be inserted with Glyph Transformer when The Font Creator Program 5.6 or The Font Creator Program 6.0 is installed.</p>
    <p>The small λ with stroke (411) is same as U+03BB GREEK SMALL LETTER LAMDA, but has an line at the end of the font. The bug doesn’t exist in Chrysanthi Unicode.</p>
    <p>Capital inverted Omega has no lines in Haansoft Dotum. The bug doesn’t exist in Chrysanthi Unicode.</p>
    <p>Latin 2 with bar doesn’t match the design. The bug doesn’t exist in Chrysanthi Unicode.</p>
    <p>Latin letters æ, æ with acute, æ with macron (230, 483, 509) have wrong design.  The bug exists in Chrysanthi Unicode.</p>
    <p>Capital Latin letters with accents are incorrectly spaced.</p>
    <p>Latin t with retroflex hook (648) is a stretched t rather than a t with retroflex hook in Haansoft Batang and Haansoft Dotum. The bug doesn’t exist in other fonts.</p>
    <p>The fonts are not available in Wazu Fonts, incorrectly sending it.</p>
    <p>The glyphs taken in MS Mincho (Japanese: ＭＳ 明朝) are proportionally spaced in Chrysanthi Unicode.</p>
    <p>The fonts doesn’t have any kerning pairs in Haansoft Batang and Haansoft Dotum.</p>
    <p>The words only wrap with Latin but not Cyrillic and Greek. This bug doesn’t exist in the English versions of 3.1 to Vista.</p>
    <p>Greek and Cyrillic doesn’t match the design in Haansoft Dotum. The Greek and Cyrillic characters match the design in Chrysanthi Unicode.</p>
