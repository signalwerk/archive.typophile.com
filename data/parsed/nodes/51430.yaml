    <p>Hi all,</p>
    <p>I'm a music artist/DJ (electronic dance music) and I'm trying to create a unique type-based logo to be used on flyers/website/album covers etc. I only started learning Illustrator a few weeks ago so I'm pretty much a rookie. This is one idea I managed to come up with:</p>
    <p><a href="http://typophile.com/files/phynnlogo.gif" title="http://typophile.com/files/phynnlogo.gif">http://typophile.com/files/phynnlogo.gif</a></p>
    <p>As you can see it's quite plain, and doesn't really stand out in terms of originality from other logos in the dance music business. </p>
    <p>Any tips or ideas from more advanced designers would be a great help!</p>
