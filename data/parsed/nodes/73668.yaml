      <p>Many type designers these days are one-person shops.  Some of them would rather farm out the technical part of the process, like truetype hinting, opentype coding, or even just kerning.  You could possibly market services in that way.  The bigger foundries have staff to handle the technical side and occasionally are hiring. There are a few inbetweeners like Dalton Maag, who have small staffs or hire on a contract basis.</p>
      <p>If your person has 15 years experience, why wouldn't she already know the business?</p>
