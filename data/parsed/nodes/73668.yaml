      <p>&gt;&gt;Anyone have any idea hoe large the Cyrillic font market is?</p>
      <p>Nick, I don't really know the size of the Russian market (as measured in money), but ParaType is practically the only local foundry. I have a feeling that since all major foundries developed Cyrillic type, there must be a larger market "offshore", meaning outside of Russia. But my friend is certainly not limited to working on Cyrillic type, she worked on Latin and Arabic scripts as well. (and quite a bit of Cyrillic type for big league foundries was developed by Paratype anyway).</p>
      <p>&gt;&gt;I have purchased several of their faces, myself. </p>
      <p>Chris, then chances are you have seen some her work already! We just finished tallying up the fonts from ParaType library that she was involved with, and it came to over 40 typefaces.</p>
      <p>Right now we are checking with employers to find out which work was under NDA and will be all set.</p>
      <p>Will this forum be a right place to post a resume for a review/critique?</p>
