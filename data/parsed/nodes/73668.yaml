    <p>Would you have any advice on job search strategy for a professional font developer (15+ yrs of experience)?</p>
    <p>Font design community is relatively small and personally I don't know much about it. Is freelancing common? Is technical font support done inhouse or outsourced? Does it make sense to look at large foundries or smaller independent shops? </p>
    <p>The person in question does not design original fonts, she is font technical expert, knows all about font technologies of the last 15 years. (PS Type1, TrueType, OpenType, manual font hinting, kerning, bespoke fonts production, ClearType optimizations)</p>
    <p>How do I to makret her services to the world?</p>
