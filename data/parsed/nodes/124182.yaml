    <p>Hi everyone,</p>
    <p>This is a project I'm planning to do, a latin/javanese typeface family. I don't really know how to label this really, it has thick/thin stroke but without spurs (which is how serif in Javanese script would look like). I guess it's a humanist sans? Anyway, it's my first latin font, I usually only do the Javanese, and any comment/feedback is greatly appreciated :)</p>
    <p><img src="/sites/default/files/old-images/Aturra pro2_4635.jpg"><br>
    (ignore the word pro)</p>
    <p>This is my first time in typophile, so apologies for any mistakes<img src="/sites/default/files/old-images/aturra sample2_4711.jpg"></p>
