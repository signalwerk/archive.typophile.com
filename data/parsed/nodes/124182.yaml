      <p>You're doing well so far.</p>
      <p>t: It would be helpful for the crossbar to be at the x-height and extend right a little longer.</p>
      <p>f: It is not too unusual for the crossbar to be lower than the x-height, nor too unusual for the ascender to be shorter than the others, but both at the same time gives the impression that the whole f has been scaled down to a smaller type size.</p>
      <p>Italic h/k: The first leg is bent inward and the second leg straight. I see that you may intend to relate it to the Javanese this way, but this is strange and distracting for Latin reading. Normal italics have the first leg straight (because in handwriting it is where the pen sharply returns upward), and if there is a bend it is on the last leg. (But l is good and its difference from i is smart.)</p>
      <p>Italic v/w/x: Not enough slant. Consider adding something interesting to the ends of the downstroke of italic x.<br>
      Italic z: Maybe too much slant. Consider a reversed stress similar to 2/5/7.</p>
      <p>All s/S curves are going to need some fine-tuning. I can tell from your finished g that you'll get there on your own.</p>
