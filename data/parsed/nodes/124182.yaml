    html: |-
      <p>In a contrasted of “stressed” sans, to balance |S| and |s|, one can’t simply use the shape of a serif |S| and remove the serifs (a textbook example of this mistake is Bodoni Sans <a href="http://www.myfonts.com/fonts/greyscale-type/bodoni-sans/">http://www.myfonts.com/fonts/greyscale-type/bodoni-sans/</a> in which an otherwise perfectly good typeface is ruined by a backward leaning |S|).<br>
      As for terminals, they usually have the same shape of the ones on |C|c|, either thickened (example: <a href="http://www.myfonts.com/fonts/urw/britannic/">http://www.myfonts.com/fonts/urw/britannic/</a>) or tapered (example: <a href="http://www.myfonts.com/fonts/castletype/carisma/">http://www.myfonts.com/fonts/castletype/carisma/</a>). However, the thickening can be very subtle (examples: <a href="http://www.myfonts.com/fonts/linotype/peignot/">http://www.myfonts.com/fonts/linotype/peignot/</a> <a href="http://www.myfonts.com/fonts/reserves/vanitas/">http://www.myfonts.com/fonts/reserves/vanitas/</a>).<br>
      In your case, though, I think the problem isn’t much with terminals, but more on the bottom counter, which looks somewhat “weak” compared to the upper one.</p>
    html_clean: |-
