  html: |-
    <p>Hi, </p>
    <p>I had a question about licensing fonts, </p>
    <p>I am putting together a banner for a countertop installer, the banner is promoting a product they sell (Silestone).</p>
    <p>The Silestone logo standards pamphlet specifies Scala Sans to be used on all promotional material. </p>
    <p>Do I have to purchase a license for the company? Or does Silestone's font license extend to this use?</p>
    <p>Cheers,</p>
    <p>Byron</p>
