    <p>'Oded Ezer' is an <a href="/wiki/Israel" class="freelinking" rel="nofollow">Israeli</a> typographer and type designer, who specializes in typography for branding and publications. His work includes experimental projects that push the boundaries of typography towards the realm of installation art.</p>
    <p>URL: <a href="http://www.odedezer.com/" title="http://www.odedezer.com/">http://www.odedezer.com/</a></p>
