  html: <p>May sound like i'm contradicting myself when I say I want to find 5 typefaces that are very different but go well as a set. I have been tasked to create a set of rules for a group of shop owners who will be given the choice of a typeface to display their shop name. The collection of shops will be under one roof and will form a market. The market also has a slightly more modern twist. I want to create some cohesion but retain individual uniqueness. Any thoughts?</p>
