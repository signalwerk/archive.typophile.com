    html: |-
      <p>I'm sure it would be possible to pick five faces, but I first thought of the way in which the FontShop logo may be used with different typefaces, and yet still maintain a consistent brand. You wouldn't want to have such a dominant overall theme, but that kind of idea might be useful.</p>
      <p>For instance, standardize a format around x-height.</p>
      <p>Another principle I've used in harmonizing "super families" is to give them the same degree of horizontal scaling.<br>
      Further, a similar kind of "distress" (Brown and Worldwide).<br>
      Also, a cultural axis (Sense and Sensibility - modernist and humanist variants of the same face).<br>
      And of course a common basic alphabetic architecture (Panoptica, as mentioned above).</p>
      <p>Picking different genres within a single type family: Roman, Italic, Alternate script italic (e.g. Missinformed), All Caps, All Lower Case, Mixed case, Caps with Small Caps, Contrasting Weights.</p>
      <p>Interesting idea, BTW.</p>
