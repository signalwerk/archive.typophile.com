      <p>Your situation reminds me of something I read once about Disneyland &amp; Disney World.  They each have a Main Street USA -- a turn-of-the-century street with shops, fire station, etc. -- and Disney executives are often contacted by officials of real towns who are so impressed by Main Street's design that they want to know how they can create a similar look in their own home towns.</p>
      <p>Disney execs tell them that all the shops on Main Street were created with coordinating fonts, colors, architecture, etc., to a degree that would never be possible in a real town.</p>
      <p>But since your situation is several shops under 1 roof, you have an interesting opportunity.</p>
