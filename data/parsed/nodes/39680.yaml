      <p>Hi Sam, </p>
      <p>I’ve been away from the Board for a few days, and just saw your post. There are roughly thirty of us looking at these posts at any given time, and if no one came up with other ideas this suggests more strongly that this is custom work.</p>
      <p>I think you might see why I suggested <a href="http://www.myfonts.com/search?search%5Btext%5D=Leuschke">Rob Leuschke’s</a> work if you go to this link and type in ’Grant a Wish’ as the test drive phrase. While the details of each font are not consistent with the Sears lettering, to me the lettering style seems to fit Rob’s work. I know it’s just a hunch, but I think it’s a reasonable one. Sears certainly has the means to hire someone to letter three words for all their holiday marketing, I would think. This way no one duplicates your look exactly, but Leuschke’s work is where I’d start to find something that you would perhaps mistake for it, if you didn’t have them side-by-side.</p>
      <p>- Mike Yanega</p>
