      <p>Hi Mike,<br>
      I appreciate very much your research and effort to help out a fella typophile, contacting Rob Leuschke goes far beyond your duty and I’m thankful for that.</p>
      <p>I must disagree with Rob’s observation that it might be hand lettering, the two a’s on the sample are not really different in my view (it’s just different sizes), besides, seeing the typeface in the store I recall it being applied on various formats and on different messages (e.g. Merry Christmas, Happy Holidays, etc.) and they were all consistent and uniform.</p>
      <p>If it is indeed a custom type like you suggested, I was hoping that the creator might be a typophile who could share more info about it (aren’t all custom font designers typophiles? I guess I need to get out of my bubble...)</p>
      <p>My next move will be - since I’m so love stricken by this script - to go back to the Sears store with a digital camera and attempt to capture some nice shots of the signage without being caught by security... will let you know.</p>
