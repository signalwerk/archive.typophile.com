    <p>This year, Sears brought back its old “Wish” catalog that was absent for 14 years, visiting a Sears store over the weekend I came across heavy promotion of their entire “wish” theme, there must have been close to a hundred red in-store signage boards with the word “wish” prominently in the center, inspiring the holiday spirit and nicely decorating everything throughout the store.</p>
    <p>“wish” :) I could’ve made a picture of these posters for you to ID the font, so here is a banner I found online using the same script font.</p>
