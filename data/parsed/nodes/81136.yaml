    html: |-
      <p><cite>Anyone know the titles of the books so I could start looking for them on ebay etc?<cite></cite></cite></p>
      <p>The Speedball manuals or the many volumes of Dover alphabets are a good place to start. I've found a lot of good books on eBay simply searching under "lettering book". Some mid-20th Century gems that are fairly common in the US include "Modern Brush Lettering" by Harold Holland Day and "ABC of Lettering" by Carl Holmes. Type specimens would be used as reference just as much as books of hand-lettered alphabets.</p>
      <p>However, an experienced lettering artist would probably draw a roman serif like this without the need for any reference material. To make a digital font from this logo it would be better to learn how to build the missing letters from the information in the ones you've got, which Leslie Carbarga explains in his "Logo, Font and Lettering Bible" and Bruce Willen &amp; Nolen Strals cover in "Lettering &amp; Type", rather than expect to find a complete alphabet to scan and trace.</p>
