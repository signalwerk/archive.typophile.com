    html: |-
      <p>Thanks for the suggestions.  None are very close though - strange.  It has a lot more character than something like Trajan but fills much the same role.  No surprise then that it showed up on an old Hollywood poster. Maybe I could recreate this face, provided of course I could ID it and then find something to scan.  </p>
      <p>Forgive my naivete, but does anyone on the board here know how the designers in the pre-digital age went about selecting faces for film titles on posters like this?  I know they pulled from books, but have never seen one myself.  Anyone know the titles of the books so I could start looking for them on ebay etc?</p>
