    <p><img src="/sites/default/files/old-images/dimg3_4485.php.png"></p>
    <p>Here's a good look at the theatrical one-sheet art for this 80s Eddie Murphy comedy:</p>
    <p><a href="http://img.mspot.com/icache/dimg3.php?df=blankimage&amp;ft=jpg&amp;f=images/vod/1535/box.jpg">http://img.mspot.com/icache/dimg3.php?df=blankimage&amp;ft=jpg&amp;f=images/vod/...</a></p>
    <p>Whatever they used for the title treatment has me thoroughly stumped.  Can't get anything close to it.  Anyone recognize it?</p>
    <p>I think perhaps it's a composite of more than one face.   The D is clearly different (just look at the serifs) from the other letters, and the C and G feel a little too different from each other.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/golden-title.jpg" width="631" height="600" alt="">
