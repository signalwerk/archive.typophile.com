    <p>On a few GraphicRiver items, particularly <a href="http://graphicriver.net/item/image-flow-photoshop-action/84847" title="http://graphicriver.net/item/image-flow-photoshop-action/84847">http://graphicriver.net/item/image-flow-photoshop-action/84847</a> , the sample or details image uses a particular sans-serif font I've seen so many times, but for the life of me can't figure out what it is. I originally thought it was a FontFont font, but I scrolled earlier today through their entire online catalog w/a text sample "work like" and found no match.</p>
    <p>Lowercase 'f' and 't' have only half a cross-bar, and the lowercase 'k' is "curly." Neither WhatTheFont nor Identifont were any help.</p>
    <p>This font is like that song stuck in your head that you don't know the right words to, you know?</p>
    <p><em>(solved - "Sansation" by Bernd Montag)</em></p>
