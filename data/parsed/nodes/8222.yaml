    html: <p>You can buy all of these fonts directly from Bitstream, or from MyFonts.com. If you just want these weights, you'll probably have to buy each one individually. <br> <br>LT usually means Linotype, but here it definitely means Lights. IT is Italic (the International Typeface Corporation's abreviation is ITC and not IT). BD is bold, and I haven't a devil what ITE is. But check on MyFonts, you'll probably find it there.</p>
    html_clean: <p>You can buy all of these fonts directly from Bitstream, or from MyFonts.com. If you just want these weights, you'll probably have to buy each one individually. <br> <br>LT usually means Linotype, but here it definitely means Lights. IT is Italic (the International Typeface Corporation's abreviation is ITC and not IT). BD is bold, and I haven't a devil what ITE is. But check on MyFonts, you'll probably find it there.</p>
