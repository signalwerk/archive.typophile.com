    html: <p>Yes Steve, how true! I suspect that most of the fonts can be had from Monotype and FontShop as well. Normally, I do recommend people to the Linotype website. In this case, I didn't because Bitstream (BT) digitalizations seemed to be needed. I think that our fonts look better than Bitstream's, and have no idea if Bitstream has added Euros to all of their fonts, but if he needed Bitstream fonts to work in an all Bitstream environment, I wouldn't wanto to mess with his documents word flow or compatability issues. For the record though, if these aren't required issues, you should try shopping over at <a href="http://www.linotype.com" target="_blank">http://www.linotype.com</a></p>
