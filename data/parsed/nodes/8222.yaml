  html: "<p>Hi all, <br> <br>I'm about to start work on a magazine, and the editor needs to purchase fonts that were used by the previous publisher. <br>(And I'm not sure if just buying the family would include everything I need?) <br> <br>The list he needs is: <br> <br>Fenice BT <br>Fenice BD BT <br>Fenice LT BT <br>Fenice LT IT BT <br>Fenice Regular <br> <br>Futura Condensed Extra Bold <br>Futura Extra Bold <br>Futura <br>Fututa Light <br> <br>News Gothic BT <br>News Gothic BD BT <br> <br>For starters, what do: <br> <br>BT <br>BD BT <br>LT BT <br>LT IT BT <br> <br>abbreviations stand for? I'm guessing LT = Light and BD = Bold, but am lost on BT. <br> <br>The three font families have other references I'm not familiar with. For example, there is ITE Fenice and Fenice CE. <br> <br>Where would be the best place to buy these fonts from? <br>A lot of the sites seem to be geared to consumers rather than commercial users. <br> <br>Thanks everyone!</p>"
  html_clean: "<p>Hi all, <br> <br>I'm about to start work on a magazine, and the editor needs to purchase fonts that were used by the previous publisher. <br>(And I'm not sure if just buying the family would include everything I need?) <br> <br>The list he needs is: <br> <br>Fenice BT <br>Fenice BD BT <br>Fenice LT BT <br>Fenice LT IT BT <br>Fenice Regular <br> <br>Futura Condensed Extra Bold <br>Futura Extra Bold <br>Futura <br>Fututa Light <br> <br>News Gothic BT <br>News Gothic BD BT <br> <br>For starters, what do: <br> <br>BT <br>BD BT <br>LT BT <br>LT IT BT <br> <br>abbreviations stand for? I'm guessing LT = Light and BD = Bold, but am lost on BT. <br> <br>The three font families have other references I'm not familiar with. For example, there is ITE Fenice and Fenice CE. <br> <br>Where would be the best place to buy these fonts from? <br>A lot of the sites seem to be geared to consumers rather than commercial users. <br> <br>Thanks everyone!</p>"
