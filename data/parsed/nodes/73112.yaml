      <p>You have got <a class="freelinking external" href="http://code.google.com/webfonts" rel="nofollow">Google font directory</a>, <a class="freelinking external" href="http://www.theleagueofmoveabletype.com/" rel="nofollow">the league of moveable type</a> and <a class="freelinking external" href="http://openfontlibrary.org/" rel="nofollow">open font library</a>.</p>
      <p>Also you can check the fonts on <a class="freelinking external" href="http://www.ctan.org/tex-archive/fonts/" rel="nofollow">CTAN</a>, mostly free fonts but few might have some restrictions like no commercial use (no fancy font listing like the others, though).</p>
      <p><a class="freelinking external" href="http://scripts.sil.org/OFL_fonts" rel="nofollow">SIL</a> has a list of some OFL licensed fonts, you may want to check that too.</p>
