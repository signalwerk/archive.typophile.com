    <p>Please understand, I've read a lot of people getting flamed for asking for free commercial fonts. That is not my purpose in this post. I feel like the best of fonts are less tools and more works of art (and thus, I feel like those who work on them should absolutely be compensated).</p>
    <p>My purpose in posting is to ask if there is any good site for free and open-source fonts (and possibly WebFont supported). I've done quite a bit of web design, and having access to good WebFonts would be wonderful. Plus, there are several Open-source typefaces that I prefer over their proprietary counterparts (i.e. Deja Vu Serif and Liberation Serif are infinitely better than Times New Roman).</p>
    <p>Again, I'm not asking for any Commercial typefaces, I'm asking for a good place to find fonts that were designed with the intent of being free to use for everyone and anyone that wants.</p>
    <p>Any help and all suggestions are greatly appreciated!</p>
    <p>-Sam</p>
