      <p>@Florian, I didn't mean to say that craftsmen shouldn't be compensated. I just meant to say that typefaces are one of the few digital creations that I feel can legitimately be proprietary (though I am one of those idealists who wishes for all digital work to one day be open-source).</p>
      <p>As for the "works of art" argument. One of the most fascinating types of art I've ever come across is that of functional art. A true work of art still mean to be used. This is how I see typefaces.</p>
      <p>Thanks for all the discussion and all the suggestions, this has all been very helpful!</p>
      <p>-Sam</p>
