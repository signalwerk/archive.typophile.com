      <p>Thanks ilovecolours!</p>
      <p>I agree with you wen you say I'm probably using too much elements... it´s a very modular design, and probably I should start adding some details that improve the letter  legibility and simplify their shapes!</p>
      <p>It's curious that you mention Metalista because that is the font that got me inspired!<br>
      On a first stage I tried to abstract myself from that font, In order to try and create my own solutions, but I'll take a second look at it now and try to clean some of the shapes!</p>
      <p>Regards.</p>
