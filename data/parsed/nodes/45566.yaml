    date: 2008-05-23T22:04:00
    votes: null
    html: |-
      <p>I like your work so far, however, sometimes you're using too many elements in order to achieve the shape. About the Z, IMHO the best Z is the first one and then the second one. This last Z doesn't resemble the overall look of the glyphs. I did this Z just for fun, using the idea of the 'x' glyph in your alphabet, you kept it clean, upside and down. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/z_4572.gif"></div><p></p>
      <p>It's just and idea, nothing else, but my point is that in the same way you worked with x, y, r, you should clean a bit some other glyphs. However, it's a great kickstart. Take a look at the free font <a class="freelinking external" href="http://www.suitcasetype.com/index.php?lmut=en&amp;part=fonts&amp;font=24" rel="nofollow">Metalista</a> to see how they solved some other glyphs.<br>
      Regards.</p>
