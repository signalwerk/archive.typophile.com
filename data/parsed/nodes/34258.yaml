      <p>oh my, can i tell you something COOL? I don't know why this didn't occur to me.</p>
      <p>My husband is my business partner. His name is Jason. Check out that r. Flip it, and you've got a j. I've tried, for a LONG time, to find a mark that could somehow represent us both. He disliked what I would do, and I dislike the ones he created.</p>
      <p>Yet..now we have a J and and R. I could keep it just that simple r, or I could try to play around to represent the J, too...though really it accomplishes both. Astute clients may realize this, but it doesn't require them to realize it to be a strong mark. </p>
      <p>I got that font for its "s", actually. But now...the r may very well have saved me. Thank you again. truly.</p>
