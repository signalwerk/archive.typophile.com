      <p>Hello,<br>
      I am impressed with your willingness to embrace suggestions made by other readers so I hope I'm not out of line offering my thoughts on your latest logotype ideas.</p>
      <p>I think the dot under the r/j makes it look like an up-turned j, it no longer reads as an r.</p>
      <p>The third idea works best for me because the lowercase thing seems a bit played out; I like the shapes of the lowercase letters but there is a risk of it looking too Web 2.0 (something you're trying to avoid). </p>
      <p>The combination of the lowercase, the rounded type, the rounded corner (the 'r'), and the colours are all Web 2.0 staples, so it might be worth dropping <em>one</em> of those elements if you want to keep away from that style.<br>
      <a href="http://www.fontshop.com/fontfeed/archives/the-logos-of-web-20/" rel="nofollow">A list of Web 2.0 logos</a></p>
      <p>Are there small caps in the font you're using? this might make nicer shapes and a more classic, timeless logotype (just an idea).</p>
      <p>The simple r shape would be very flexible across a range of media and would work without any accompanying text.</p>
      <p>Good luck</p>
