    <p>Hi there,</p>
    <p>I've been working off and on for months on a new identity for my company. I'm a web designer/developer, and I also do branding and usability work. Not much print work. Maybe 10% of my clients request logo work.</p>
    <p>The work below was inspired a bit by some logos from the fashion industry. I want something more 'iconic'--that's based on my name--that isn't just a standard font treatment. </p>
    <p>I want to up the sophistication level of my image and not go the standard "web 2.0 route" that seems so popular these days amongst my web design colleagues. In other words, I want a long lasting mark that can carry over to other companies I might start that also will have my name on them.</p>
    <p>I took the font named Dinamo Regular and used it to create the icon you see below.  I've also included what the standard letters from Dinamo look like that I used. It's However, my sense is that my finesse and execution is off. I'm unsure at this point as to how to make it better. Here's what I'm looking for help with:</p>
    <p>1. insight or opinions on how I might make the icon itself better<br>
    2. Thoughts about using Granby Light (the display font you see) along with it.<br>
    3. Thoughts about the layout of the logo OVER the company name, as opposed to another position, etc. </p>
    <p>I greatly appreciate any help in advance. I'm definitely more big picture designer than I am strong in typography and icons, but I'm trying to improve.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dbr-logo-1_5543.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/dbr-component-1_3735.gif"></div><p></p>
