      <p>I would not recommend setting PhD all in capitals, even if only because Ph should be thought of as one letter (the Greek Phi) and not as two (this is why the initial for Philippe is Ph. and not P. for say). Perhaps a good ligature would do, though? I thought that when I get my PhD I might write ΦD or Φd or something like that - I need to have a look at fonts which have a good set of Greek letters which mix well with the Roman ones etc. I wish I had done my Doctorate of Philosophy in Oxford where it is still abbreviated DPhil, which looks and sounds SO much better.</p>
      <p>The rule on abbreviations in French is that if the abbreviation includes both the start and the end of a word, it is not followed by a point, otherwise it is. Hence 'M.' for Monsieur (in very ancient use it is Mr, though) but 'Mme' for Madame or 'Mlle' for Mademoiselle. Hence 'Prof.' or 'Pr' for professor. etc.</p>
    html_clean: |-
