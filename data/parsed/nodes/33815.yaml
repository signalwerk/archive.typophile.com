      <p>There's another interesting use I saw in "The Economist" today. When using the acronym for African Development Bank, they use a combination of smalls and lowercase:</p>
      <p>AfDB. </p>
      <p>In your mind's eye, imagine A, D, &amp; B in smalls; leave the f lowercase.</p>
      <p>They seem to have edited assiduously to avoid starting a sentence with a small cap.  I have had numerous editors tell me they object to starting a sentence with a small cap. Seems silly to me as long as the abbrev or acronym has been explicated earlier.</p>
      <p>The other problem with using smalls in these kinds of instances comes when you need to make it plural: say, when you have lots of MPs. In most cases the small cap "s" is hardly distinguishable from the lowercase "s".</p>
      <p>Takes a bit of jiggering around to make it clear.</p>
      <p>powers</p>
