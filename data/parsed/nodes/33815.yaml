      <p>Krania, I have 4 projects a year that list about 50 names, all with multiple degrees. The editor, and she is a good one - insists on the spacebands after each comma, no exceptions.</p>
      <p>I've set type for more years then I care to remember, and I have never been asked to drop the spacebands between degrees. Is this something new? We may have been asked to give 1-N spaces to save room, but without space looks like a typesetter didn't know what he/she was doing...</p>
      <p>BTW - for PhD why even bother consulting Chicago Manual of Style? It was explained to me that the person spent their time and earned their degree - they are entitled to it as is. Even if it is to be set in Small Caps - the h would remain in lower case -- just the nature of the beast.</p>
      <p>Oh, and Linda, in your argument of periods or no periods - this is just typesetter opinion - either way should be okay - but just be consistent. If one degree is given it's punctuation, then it is said without giving - all degrees on that layout - should have periods. Same holds true without - than none shall receive... :-)</p>
