    html: <p>Chicago suggests droping the periods in "Ph.D." (Doctor of Philosophy), preserving the case distinction between the "P" and the "h", but doesn't suggest going any further (15.21). In Elements, Bringhurst suggests eschewing all superfluous punctuation (5.4.4), such as with the British take on "Mr", but also recommends using small caps for anything besides two-letter geographical acronyms and proper names (3.2.2)—the logic being that in some faces, full caps will be intrusive and mar the color of the page. If this seems to be the case with a given face for the word phrase "PhD", then it would only be consistent to treat similar, mixed-case abbreviations (such as Mr, Dr, Jr) in like fashion.</p>
    html_clean: <p>Chicago suggests droping the periods in "Ph.D." (Doctor of Philosophy), preserving the case distinction between the "P" and the "h", but doesn't suggest going any further (15.21). In Elements, Bringhurst suggests eschewing all superfluous punctuation (5.4.4), such as with the British take on "Mr", but also recommends using small caps for anything besides two-letter geographical acronyms and proper names (3.2.2)—the logic being that in some faces, full caps will be intrusive and mar the color of the page. If this seems to be the case with a given face for the word phrase "PhD", then it would only be consistent to treat similar, mixed-case abbreviations (such as Mr, Dr, Jr) in like fashion.</p>
