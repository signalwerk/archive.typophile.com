      <p>Linda, </p>
      <p>Perhaps you would know if such a thing exists: At work, we have a very old and badly photocopied document which lists the correct abbreviation or acronym for universities. We use this list, which is by no means complete (and is also faded and illegible at the edges of the pages), for listing all the professors names and degrees, and where they earned them. I've been Googling to try and find a similar online resource, but to no avail. This mysterious compendium also serves as our style guide for that section -- which, I believe is where the strange no spaces rule originated. </p>
      <p>Unfortunately, listing only the highest degree earned is not likely to be an option since we also include the conferring University. I presume some students want to know where there professors were educated and what kind of education they have, but like many things, we continue because "we've always done it like that" without knowing exactly why. It certainly would be a whole lot simpler if we could do away with it all, believe me. </p>
      <p>Do you know of any resources like that?... or some official organization that determines how university names can be abbreviated? (lol)</p>
      <p>Just thought, as a sidetrack and thread hijacking, that you might have some insight.</p>
      <p>Thx!<br>
      K.</p>
