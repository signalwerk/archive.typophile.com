      <p><em>works when the small caps are a bit taller than x-height</em></p>
      <p>Most fonts have small caps that are too close to x-height.<br>
      When I was working as an art director, I almost always had to make small caps bigger, by half a point usually. A compromise, as weight was affected.</p>
      <p>Typical usage:<br>
      1. Acronymns in text, e.g. the problematic "U.S.", with the same letterforms as lower case<br>
      2. A line of all small caps used as a subhead<br>
      3. Titles (as in this thread).</p>
      <p>With small caps that are barely larger than x-height, all these usages suffer.</p>
      <p>Now admittedly the problem of too-small small caps was traditionally ameliorated by letterspacing (tracking) them out, but that's a bit of a work-around.</p>
      <p>IMO, small caps should be around 120% of the x-height. Most are under 110%.<br>
      Another reason for larger small caps (from the type designer's perspective) is that they are very necessary in Cyrillic, with many more common shapes between cases than in Latin.</p>
      <p>Why do type designers make small caps so close to x-height? I suspect it is because we visually balance the effect of equal amounts of small cap text with U&amp;lc text, one-to-one (symmetry), and that does not correspond to typical typographic usage, which is asymmetric, requiring a small amount of small cap to hold its own against a much larger quantity of U&amp;lc.</p>
