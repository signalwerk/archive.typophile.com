      <p>Recently it was my task to ‘calm down’ a text churned up by all-caps names, acronyms &amp; abbrevations. I intentionally wanted to break with conventions, as it just felt wrong to emphasize the formally necessary but negligible entourage of supplements instead of the actual message, by optical means.<br>
      Mixing caps w/ small caps even increased the ‘noise’. All small caps seemed to be only the second-best option: distinction would be leveled, information lost.<br>
      So I ended up trying a mix of small caps w/ lower case—a rather unusual &amp; delicate approach, I guess. And, besides the text sort, the particular font in use being the linchpin of success, of course.<br>
      What do you think, is that a reasonable alternative?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GmbH_5911.png"></div><br>
      (<em>GmbH &amp; Co. KG</em> is—with this notation—the conventional abbrevation of the business organisation that would be something like a LLC in the US.)<p></p>
