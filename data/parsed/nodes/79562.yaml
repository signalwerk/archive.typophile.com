      <p>&gt;&gt;&gt;You might want to thicken the curves at their widest point, as the l is looking heavier than the curved letters...</p>
      <p>That, or make the letter very slightly more super-ellipsoidal. I think the thickness may be thick enough but it doesn't stay thick for long enough through the curved strokes.</p>
      <p>The latest terminal is fine in the E grade but I think it's going to cause trouble at the A grade end. And of course, it's your call to make. I think it could go more toward no.1 and as you already know I'm not averse to no.2.</p>
      <p>No.1 is lush. Plus, do anything Nick C. says! (Or have a look at his lovely fonts, and then do anything he says.) When he says 'definitely', he's not playing games. </p>
      <p>Lastly, it's nowhere near Optima, nor does it need to be. We'll tell you if it goes that way.</p>
      <p>N</p>
