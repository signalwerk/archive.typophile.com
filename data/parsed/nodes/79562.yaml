  - id: 454610
    user_id: 8008
    user_name: Nick Job
    user_path: null
    date_raw: 6 Mar 2011 — 8:00am
    date: 2011-03-06T08:00:00
    votes: null
    html: |-
      <p>Hi Jasper. That's looking nice. </p>
      <p>I think you have some consistency conflict to resolve around the upper counters of the /B/ and /R/. If you like what the /B/ does, make the /R/ do a similar thing. On the /B/ and /R/ topic, you will not need as much overshoot to the tops (and bottom of the /B/) as in, for example, the /O/.</p>
      <p>The terminals are better but I would love to see them come to a point rather than be clipped. I know you said you tried it, but I wouldn't mind if they were slightly deeper and the curve into them was less parabolic (squarer?) from the upper internal extremum towards the terminal itself. In this regard, I think the /r/ and /y/ terminals are strong and confident, the terminals in /a/, /c/, /s/ etc. still don't appear resolved or harmonious with the rest of the design.</p>
      <p>Second stroke of the /M/ (top left to bottom middle) looks thinner at top than at the bottom. Because it's a central stroke you can get away with parallel contours here, roughly speaking.</p>
      <p>Compare the top left of the /M/ to the top left of the /N/. I'd suggest the /N/ is too thick on the uppermost horizontal contour. You may want to slant the second stroke less making the top look more like the /N/. Bottom middle of /M/ could also be less wide at the cut (on the baseline).</p>
      <p>N</p>
