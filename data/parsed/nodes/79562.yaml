      <p>I really should have been working on the italics of Sensato A, but I just couldn't help myself. As far as I'm concerned all my previous versions of Sensato E were crap, but this latest version is going in the right direction. It seems I just need some time off, everytime I'm stuck. It's now much more organic, unlike the stiff contrast-lacking previous versions of Sensato E, and the colour is much better. Perhaps I should take the 'organicness' even further, but the overall system of the typeface seems to be working now :-)</p>
