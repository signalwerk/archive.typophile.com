      <p>Thanks Frode! I don't know if this is the result of talent, or just a never ending determination to create perfection. </p>
      <p>It's not as much work as it may seem. Where I would normally design 6 styles (regular, light, black +italics) I will now have to do that twice (12 styles total) and interpolation does all the rest. The complete Sensato family (Sensato Serif not included) will have 5 grades, with ±18 styles (6 weights, + italics + smallcaps). That means I get a typefamily of 90 styles, while I have only designed 12. Now that's the power of multiple master! </p>
      <p>I'm not giving myself a deadline, but I feel like this could be done within one or two (probably two) years from now. In the past I've proven to be able to work that long on one type-family. It's worth it.</p>
