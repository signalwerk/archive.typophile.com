      <p>Gorgeous stuff!</p>
      <p>I'm wondering a little bit about the /f/. There may be a danger with this type style of it looking horizontally stretched, which of course you're largely avoiding admirably, but my gut instinct (I'm a sometime newspaper designer and see fairly much badly stretched type) was that when I first glanced at the /f/ it felt just that, horizontally stretched. Unbalanced, that is, in horizontal to vertical proportion. I realise with the large x-height it may be difficult to get the f feeling less squatted, but would it break the style completely to have the ascender curve further away?</p>
  - id: 454177
    user_id: 8008
    user_name: Nick Job
    user_path: null
    date_raw: 2 Mar 2011 — 12:41pm
    date: 2011-03-02T12:41:00
    votes: null
    html: |-
      <p>Hi Jasper, Looking pretty good. I would pay particular attention to the internal spaces (white) and ask yourself whether you would use curves like these if they were external curves? Some of them are very parabolic.</p>
      <p>The bowl on the /a/ could be marginally deeper.</p>
      <p>/d/ and /u/ foot/stem not consistent with the rest. Any reason why they are different from the same parts of /m/, /n/, /r/?</p>
      <p>Tail of the /e/ rather long. Does it need to reach 'all the way'?</p>
      <p>Terminals still bothering me. They are clunky, and the higher the grade, the more clunky they look. Can they be more consistent with the /r/?</p>
      <p>The bend on the tail of the /y/ still looks to sharp, especially in this grade.</p>
      <p>The period looks a little large.</p>
      <p>Not sure about the thin ends of the /k/ and /x/ being horizontal. If you are giving the ends of the /v/, /w/ and /y/ an angle then surely the /k/ and the /x/ should have more of an angle logically (or at least the same)? Isn't the point that you're trying to get rid of sharp angles?</p>
      <p>Agree with Johan, /f/ is a bit weak at the moment. Agree it could have a larger sweep to the right.</p>
      <p>Good stuff.</p>
