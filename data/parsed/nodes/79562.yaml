      <p>Oops. My latest comment was directed at Birdseeding.</p>
      <p>@Nick: I'm not sure what you mean with parabloc curves. I think you mean the inside curves in a d b c etc. look too 'steep', right? If you look at other high-contrast typefaces (eg. Didot) you'll notice they have a similar curve on the inside. I will try to make the curves a little smoother though, but this means I'll probably also have to make them a bit more square (extreme).</p>
      <p>You're right about a, I'll work on that.</p>
      <p>d and u foots are different from the rest because they point down, while 'the rest' points up. I tried to make them the way I made 'the rest', but it just doesn't look good. Hence the small inconsistencie. Nota, by Typonine, has a similar construction.</p>
      <p>The tail of e is based on the tail of e in Sensato A. I'll have another look at the e in both Sensato A and E.</p>
      <p>I'm afraid I can't do much about the terminals. The terminal of r has a much easier angle and more horizontal space.</p>
      <p>I'll try to improve on the y</p>
      <p>I noticed the period is slightly large, but decided to leave that untill I'm satisfied with the lowercase.</p>
      <p>I'll change k and x.</p>
      <p>Perhaps I didn't understand Johan correctly. It seemd to me as if he suggested to compress the very top (not the terminal, but the part before that) towards the right. I will try your suggestion Nick, though I'm quite fond of this f.</p>
      <p>Great feedback! Working on it.</p>
      <p>I can also announce that Expletus Sans is finally released, for free! Check the release section for more.</p>
      <p>Cheers, Jasper</p>
