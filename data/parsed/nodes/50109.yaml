      <p>I think Garage club needs to be more prominent over Granite bay, because the former is the head and the latter is the sub. Granite bay, for example, could be set in all caps and much smaller directly underneath Garage club.  You seem to be going for a upmarket, slightly old-world feel, so perhaps some real script, fine rules, centre alignment might lift it. </p>
      <p>The whole thing also feels a bit slight, like it lacks contrast, maybe something in darker tones would feel a bit more confident. I would also lose the pshop/illustrator 3d effect.</p>
