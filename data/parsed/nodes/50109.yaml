      <p>I don't think the glow around Garage Clubs is helping your design. In fact, to me it weakens it. KOing the name of the company from a light tint makes it difficult to read and downplays it's importance. Having the word "The" in a dark tone against a light tint places the emphasis on the word "The".</p>
      <p>Go back and tweak the composition in black and white - no gradiations, no glows, no drop shadows. Set your heirarchies, finalize the type and composition, then determine what might need embellishing. </p>
      <p>Also why the dull brown. Brown and garage don't say luxury at least not in their current state.</p>
