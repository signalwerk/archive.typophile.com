    html: |-
      <p>People are more than a little straightforward here; it's some sort of TP curse...or a bid for design-crowd popularity by being picky.</p>
      <p>Your design shows that you have a grasp of the general direction you want to take things. The overall color and feel are probably very close to appropriate for the circumstances.</p>
      <p>One thing to watch out for is the level of decoration that's going on. You don't want different elements of the design to represent their own continents, with their own styles and customs. The gradients used are probably not subtle enough, and that may be hurting the unity here. Gradients are informed by real-life lighting, so be conscious of what sort of lighting your gradients represent. The most often encountered gradients in real-life lighting are barely perceptible from start to finish.</p>
      <p>Overall contrast is another thing to watch out for. Blacks and whites may be pulling your message apart.</p>
      <p>You're on your way though.</p>
    html_clean: |-
