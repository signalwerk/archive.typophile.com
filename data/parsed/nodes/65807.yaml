    html: |-
      <p>I once considered to buy FontFolio, because there is certainly a lot of good stuff in there, but it's quite an upront investment, and probably you will use a couple of these fonts most of the time, cause they suit your style and clients, some display fonts will be used sporadically, and the rest probably never. So I decided against it, have bought CorelDraw for the fonts (which is quite a lot cheaper and gives you a broad selection of classics) and for the rest bought fonts seperately, via MyFonts or directly from some foundry. And I always check the deals out at myfonts, as sometimes they have some nice families at deep discounts or introduction pricing, so you might land a good deal there. As for the argument that a client might come and ask for Univers or something because of brand guidelines, I guess it all depends on the kind of work you do, but would not buy FF just in case.</p>
      <p>You might consider buying one of the packages from <a class="freelinking external" href="http://www.stormtype.com/packages.html" rel="nofollow">Storm</a>, which have quite good pricing, and certainly original fonts, so that might be an option as well.</p>
