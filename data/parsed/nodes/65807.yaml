    <p>Hey everyone,</p>
    <p>I just got a new Macbook Pro and (finally) upgraded to Adobe CS4. I'm happy I got some better fonts for my collection, but was looking at the Adobe Font Folio 11 collection. </p>
    <p>Just a couple of questions: </p>
    <p>Do you think it is a wise purchase or are there better collections for the money out there?<br>
    If it isn't worth the money, can you suggest another bulk font package to purchase?<br>
    What are your thoughts about the collection in general?</p>
    <p>I've had 3 jobs in my career and all have had font collections on the servers to pull from. Doing more freelance work these days requires more fonts and I absolutely hate stealing so I would like to purchase some of my own. Many thanks for everyone's thoughts!</p>
    <p>Happy new year!</p>
