      <p>Just to give a different view: Font folio costs $2600 in the US. The average price for a four-font family from Adobe is $120 or so. So you will have to decide if there are 25 or so families in the folio that are ones you would want/need. If there are, then the folio is a good choice, since you will get all those other fonts as well. </p>
      <p>I agree that many of the fonts in the collection are weird, but every once in a while you come across a need for weird fonts, and having the collection makes for a nice set.</p>
      <p>The beauty of having the folio is that you probably won't be continually buying basic fonts through the year, and you can use your font budget to buy some non-Adobe faces, including the ones from designers in this forum.</p>
