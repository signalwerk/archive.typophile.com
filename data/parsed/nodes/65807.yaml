    html: |-
      <p>I think the benefit of purchasing the folio is that you get a collection of very complete, classic typefaces. There are a pile of strange, seemingly useless typefaces in the collection, but as Don said, sometimes they come in handy. More importantly, and maybe this is just me, but I like having some very complete typefaces, like Minion or Arno, at my fingertips. If I have a deeply typographic project to set, I can use one or two typefaces and create consistent, elegant, well composed pages while easily differentiating types of information. From this perspective, a half-dozen complete typefaces would easily justify the expense of the entire package. If you wanted complete (or even almost complete) versions of typefaces like Minion, Arno, Warnock, Kepler, Garamond, Caslon, Helvetica, and Univers, (just for example) you might as well purchase the whole package.</p>
      <p>Also, it's good to have some "classics" because inevitably a client will ask you to create a piece consistent with their other materials. You may not fancy Helvetica, but you're probably going to end up needing it at some point. My perspective is that there are enough complete classics in Fontfolio to justify this as an investment in your career. One or two projects will justify the cost and you can use them forever, or until open type is replaced by something else.</p>
