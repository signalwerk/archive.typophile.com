    <p>Dear fellow typophiles.<br>
    Does anyone know a way of seeing the proper grid when you're in artwork view in Illustrator CS4, rather than just the dots? The grid looks fine in preview mode, but when I'm working with lines that have a stroke applied, or I want to join points precisely etc, I go to artwork mode and get the useless dots!</p>
