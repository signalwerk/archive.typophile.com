    <p>I have read a lot of interesting posts here about the ability to replace individual glyphs in a pseudo-random fashion to create a more realistic handwritten font using OpenType, but very few examples. </p>
    <p>I would love to purchase a handful of these, but I'm surprised at the seeming lack of availability. Can someone point me in the right direction?</p>
    <p>Thanks!<br>
    Scott</p>
