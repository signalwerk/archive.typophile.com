    html: |-
      <p>Hi Scott,<br>
      You may find lots of handwriting fonts on Dafont, but none of them have the Opent Type magic.<br>
      As Nick and Cristobal suggested: Olicana, Rollercsript and Suomi Hand are the closer you will get to real handwriting. If those are not enough, then you need a custom-made font for your client.</p>
      <p>I recently did a custom handwriting font for a huge corporate client, with 5 variations of each letter, pseudo-random lowercase, pseudo-random uppercase, automatic small-caps, all 105 Latin languages including Vietnamese, etc, etc.<br>
      But this kind of custom jobs are expensive, around 30.000 USD. I don't know if your client can afford it, or if they want to spend that much.</p>
      <p>In summary, the options are:<br>
      - Search dafont for handwriting fonts, but all the letters will be the repeated (not natural effect)<br>
      - Use one of the best already-available fonts (Olicana, Rollercsript or Suomi Hand)<br>
      - Hire someone to make a custom font for your client (Best solution, but expensive)</p>
