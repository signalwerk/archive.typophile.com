  html: |-
    <p>The apotheosis of the proof press, Vandercooks (specifically the <span class="caps">SP</span>-15 and Universal models) provide consistent inking and <a href="/node/add/wiki?edit%5Btitle%5D=impression" title="Create node &quot;impression&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">impression</a> and a large bed and are notoriously easy to clean, adjust and operate. They are also tremendously difficult to damage or move (bend at the knees, bring 4 strong friends). They are excellent for making prints from lino and <a href="/node/13665" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">woodcuts</a> as well as metal and wood type, <a href="/node/13649" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">photopolymer</a>, <a href="/node/add/wiki?edit%5Btitle%5D=engravings" title="Create node &quot;engravings&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">engravings</a> and anything else <a href="/node/13664" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">type high</a>.</p>
    <p><a href="/node/12116" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Joshua Lurie-Terrell</a> has an <a href="http://www.ryerson.ca/~ibaitz/gal_proofpr.htm"><span class="caps">SP</span>-15</a> in his garage and really needs to use it more&nbsp;often.</p>
