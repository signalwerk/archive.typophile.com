  - id: 29774
    user: 2605
    date: 2004-04-01T13:03:00
    date_raw: 1 Apr 2004 — 1:03pm
    votes: null
    html: <p>You're right, this is very close to Didot. I'd been looking at a version of Bodoni for guidance, but there were some differences between it and the character of my grandpa's letters that I had to work around. Didot is a much closer fit. <br> <br>And thanks for your comments. This is my first typographic effort, and it's more difficult than I expected. I feel encouraged. Ultimately I'd like to do the italic, and also an outline version of the capitals.</p>
