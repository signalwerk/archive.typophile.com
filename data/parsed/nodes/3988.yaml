  html: |-
    <p>Hello, I am about to begin work on my first typeface. This will be a digitization of the letters that my grandfather drew on Christmas cards and the like. It's sort of a Bodoni-esque style filtered threw my grandpa's congenital hand tremor. <br> <br>The reason I am posting is this: I have enough experience in other things to know that there are usually important questions to ask one's self at the outset of a project like this. Having zero experience in making a typeface, I don't know that I'm asking myself enough questions, or the right ones, or all of them.   <br> <br>My question for you is this: from your experience, what are the major and minor considerations for creating a typeface based on the sample posted below? <br> <br>Thank you very much, <br> <br>Alex G. <br> <br><img src="http://www.typophile.com/forums/messages/29/32183.jpg" alt="The year he got me a subscription to the Nation..."></p>
