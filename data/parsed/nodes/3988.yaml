    html: <p>I agree with John ... I do like the N is NATION more than the one in NASAL. I agree with Nicolai's comment about the O as well. The R in HONOR seems a little too droopy. The B might be a little narrow, or maybe the E is too wide? <br> <br>This is fun, reminds me of Didot. You might reference Didot on a few of these characters. I really d like the warmth of it, reminds me of old movie titles.</p>
