    date: 2004-04-17T10:47:00
    date_raw: 17 Apr 2004 — 10:47am
    votes: null
    html: "<p>Well, I haven't given up yet. I do need some critical guidance though: I've been trying to reconstruct the lower case using a combination of g'pop style and didot. I'm particularly concerned with the letters: a, e, and especially g.   <br> <br>The 'g' is driving me nuts: sticking to the principle that this font is a version of didot as imagined by an 80-something retired architect with a hand tremor, I've decided that a binocular 'g' is not something he would have done. I've also decided that using an uppercase 'g' in the lowercase isn't something that I want to do. I think the best approach is to didonicize a cursive g, which is what I've been trying to do with very little success.  Any suggestions would be very welcome. <br> <br>Another concern:  I read somewhere that having many anchor points in a font outline creates problems with computer printers, etc. Is this style a problem? Or is this a concern that belongs to several years back when things weren't quite as robust? <br> <br>Current samples: <br> <br>&lt;img&gt; <br> <br>&lt;img&gt; <br></p>"
