  html: <p>We found a wonderful font to use on a book cover we're working on but had a hard time finding a place that sold it. I finally contacted the font's creator and he said that the font wasn't available for sale anymore. The book's designer suggested that the illustrator hand-draw the title based on the font with some changes. Does anyone know the legal issues surrounding this?</p>
  html_clean: <p>We found a wonderful font to use on a book cover we're working on but had a hard time finding a place that sold it. I finally contacted the font's creator and he said that the font wasn't available for sale anymore. The book's designer suggested that the illustrator hand-draw the title based on the font with some changes. Does anyone know the legal issues surrounding this?</p>
