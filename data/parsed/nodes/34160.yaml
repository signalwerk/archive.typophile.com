    html: |-
      <p>The shapes of letterforms cannot be copyrighted. However, the delivery of letterforms CAN be. You can copyright a font's name, for example, like "Helvetica" or "Univers." You can also copyright (legally protect) the digital data (the "program") that creates or delivers the font, so the digital "font" files you buy/use on a PC _ARE_ copyrighted (they are considered a computer program like any other, so they enjoy the same protection under the law a, say, Microsoft Office does).</p>
      <p>As long as you are not "copying" the digital outlines of the letters (by using something like Fontographer), you are fine. Also, because fonts/type on computers are inherently accessable, there is generally no restriction on access/re-using the outlines in a drawing program or as part of a logo... not being able to use a font to create words would severely limit its usefullness.</p>
      <p>Restrictions on fonts are similar to the restrictions placed on most stock/clip art (the royalty-free art, that is): use it, modify it, print it, but DON'T re-sell it or re-distribute it in a form that other people can use in font form. For example, I can send you a PDF with an embedded Helvetica Neue, but there's no way for you to sue that face on some other document... it's part of what I created, and I paid for the font, but you don't have to (cuz you're just reading with it). I could even create a poster in Illustrator where I display every character in the font and convert it to outlines... you could open the file up and access the outlines all you want, but you are legally restricted from copying those outlines into a font-creation application and re-selling it as your own.</p>
      <p>In any case, you're using an existing letter design as an "inspiration" or source for a new illustration... assuming you're ot copying vector outlines from the original font, and are, in facat, re-drawing letters in Illustrator, then you're fine.</p>
