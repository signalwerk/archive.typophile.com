      <p>While I appreciate the second set of drawings I have always felt shadows should reflect the direction of design. Upper left to lower right. So as the sun shines from from the upper left the shadows would fall low and right.</p>
      <p>But there again I am "old and in the way" (let's see which upstarts get that one) and the kids are doing whatever the hell they want to : ) And the second set would serve its own purpose as a variation.</p>
      <p>You ain't no spring chicken either Chank, so go for broke.  Double :: ))</p>
      <p>Michael</p>
