  html: |-
    <p>okay, here's what I'm working on... It's a new Italic version of my popular <a href="http://www.myfonts.com/fonts/chank/brubecks-cube/ " title="Click to visit an external URL." class="freelink freelink-external freelink-external">Brubecks Cube</a> font. </p>
    <p>I want it to be sensible, so I slanted it to the right, to be safe. That's the easy part.</p>
    <p>Now I can't decide where the shadow sides should fall.</p>
    <p>When the shadow-sides are on the bottom and right it makes all the letter look like they were cut out of sheetcake. Like a bunch of typographic cake laid out on the table in front of me. Mmmm. Tasty. But maybe it's a bit too safe. Not interesting enough.<br><img src="/sites/default/files/old-images/15456_brubeck_ital1_5677.gif"><br>
    So I did a second drawing, letting the shadows fall on the top and left instead. Now the letters don't look like cake anymore. They look a bit like buildings, like I'm flying in on a helicopter. Except the italicization makes it look like all the buildings are falling over. Oh no!<br><img src="/sites/default/files/old-images/15458_brubeck_ital2_3780.gif"></p>
    <p>Should it be shadows on top, or shadows on bottom?</p>
    <p>-chank</p>
