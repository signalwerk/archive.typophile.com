  html: "<p>This looks like it's a freeware font called Potrzebie, from Rotodesign.com: <br> <br>\"Potrzebie is a jumpy headline font based on an old phototypesetting font called Animated Latin,\" says the site. <br> <br><a href=\"http://www.rotodesign.com/fonts/potrzebie/index.html\" target=\"_blank\">http://www.rotodesign.com/fonts/potrzebie/index.html</a> <br> <br>I suppose, since this is book is from a major publisher, they might have actually found an old phototype machine to produce the cover type, or digitized it themselves. But I doubt it... <br> <br>(I used this last week in a quick &amp; dirty flyer for my company's holiday party, too. What are the odds?)</p>"
