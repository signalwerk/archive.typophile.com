  - id: 325151
    user: 1250
    date: 2009-01-27T08:24:00
    date_raw: 27 Jan 2009 — 8:24am
    votes: null
    html: |-
      <p>&gt; is it better to break the line for readability</p>
      <p>The idea of readability tends to apply to long, immersive text only. For such short text looks surely trumps readability every time. Frankly any problem people will have reading that smoothly will be momentary and immediately forgotten.</p>
      <p>BTW, if you center the text you can (and in fact often should) have great variance in line length.</p>
      <p>hhp</p>
