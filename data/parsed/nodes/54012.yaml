      <p>Excellent! Thanks, gentlemen.</p>
      <p>Hrant, I've got the curse of the Grammar Nazi, and I can't conscionably use an ampersand if it's not in a title or the like.</p>
      <p>These are fantastic solutions to the specific problem I used as an example. But what about the theory behind it? What if I did have to keep it to four lines? When it comes to design, is it better to break the line for readability and have an inappropriately ragged edge, or is it best to keep them looking balanced and break up words that should probably be kept together?</p>
