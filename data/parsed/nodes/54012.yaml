  html: |-
    <p>If a line break creates a hiccup in readability, does it make for bad typography?</p>
    <p>On a client's business card:</p>
    <p><em>special gifts<br>
    adorned with<br>
    puppy and teddy<br>
    bear illustrations</em></p>
    <p>The measure is short to showcase a portion of the client's illustration.</p>
    <p>In visual context, the line breaks are exactly where they need to be, but the interruption of "teddy bear" is unnerving to me. </p>
    <p>Only, not as unnerving as the alternative...</p>
    <p><em>special gifts<br>
    adorned with<br>
    puppy and teddy bear<br>
    illustrations</em></p>
    <p>Thoughts?</p>
