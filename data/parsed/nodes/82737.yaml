      <p>Just to be confusing ;) visual tension can be described as something to be avoided:<br>
      <a href="http://illustrationclass.com/2007/04/13/avoiding-visual-tension/" title="http://illustrationclass.com/2007/04/13/avoiding-visual-tension/">http://illustrationclass.com/2007/04/13/avoiding-visual-tension/</a></p>
      <p>I think the general underlying principle is a bit related, but obviously not the same thing.  For example, it might maximize this kind of visual tension to set a block of text so that it is printed right up to the edge of the page, but probably that would not be what Muller-Brockmann has in mind.</p>
