      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tschichold_poster_1937_4189.jpg"></div><p></p>
      <p>Tonal contrast arranged asymmetrically in the modernist layout (Tschichoild, c.1930), large areas of light value balanced against smaller darker areas.<br>
      This balance creates tension, because it subtle and precarious, and because the centre of gravity is not marked by any graphic element, but is sensed by the viewer.</p>
