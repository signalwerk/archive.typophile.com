    html: |-
      <p>Some layouts have more visual tension than others. A layout where everything is centered and symmetrical creates a looks that's very balanced and somewhat formal, but also can be dull.</p>
      <p>On the other hand, a layout that has some non-symmetrical elements — rag right type, a large graphic that's not centered on the page, and so forth —&nbsp;has more visual tension and therefore looks less formal and more energetic. </p>
      <p>Another way to think about it might be to compare a layout to a garden. Have you ever seen pictures of a very formal garden at some estate where everything is laid out in a big symmetrical grid, with rows of neatly trimmed hedges, everything very formal and symmetrical? Compare that to a beautiful garden that's designed in a very different way, with a big fountain on one side, flowers on the other side, trees placed in seemingly random spots, etc. It almost seem chaotic by comparison, and yet the designer gave it an overall balance that makes it work.</p>
      <p>Either type of layout can be appropriate; just depends on the circumstances and what the designer is trying to achieve.</p>
