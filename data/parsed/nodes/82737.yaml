    <p>I keep hearing the word 'tension' from great typographers, I have no idea what they mean by it. </p>
    <p>Josef Muller-Brockmann says "a sensitive designer will always do his best to create the maximum tension in the proportion he chooses for his margins." (Grid systems in graphic design).</p>
    <p>Can someone please explain what tension is, how to create it or get rid of it and why it is needed?</p>
    <p>thanks</p>
