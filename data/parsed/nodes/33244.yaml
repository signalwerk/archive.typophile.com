      <p>I do think that full-time, "professional" employment is probably hard to come by. You might have better luck setting your sights on freelance or contract employment. When I was getting into type (in the early '90s), there were a lot of small freelance jobs around. If you can make some friends and find those jobs, it's not a bad way to go.</p>
      <p>These days Reading seems to be the most straightforward path, but if you have the time and energy, you can work your way up. Get the software and make your own typeface; that will get you some skills to use the tools efficiently. Then you might find a job to design something customized or ephemeral. Or perhaps someone needs help with kerning. Most of all, you need to develop a tolerance for horrifyingly long, monotonous projects -- which is a big part of real type work. If you cannot deal with that, I think your success will be limited.</p>
      <p>Try to work with and understand all the technical aspects of font production (OpenType layout and tables, hinting, Python scripting, etc.). It's important to carefully read a lot of type books, and, of course, look at a lot of type.</p>
      <p>If you can get some small projects under your belt, you might find one day that you are qualified to help a "real" foundry with some contract assistance, which will give you more experience with how a font company needs to have their font data prepared. (It's often a level higher in precision and quality.)</p>
      <p>In the end, like others here have said, foundries (like most employers) want a person with an ability to perform skillfully, intelligently and reliably. Such qualities usually come with experience and simply logging a lot of hours doing the same thing over and over again. All of this takes time, patience and commitment -- but there are lots of ways to get there.</p>
      <p>One more thing worth mentioning: Once you have the skills, you will need to convince people of that without the benefit of a university's stamp of approval. The value of networking and schmoozing should not be underestimated.</p>
      <p>I agree that having original design vision is optional. It's a goal that drives many people into the field, but like lots of other creative fields (e.g. music, theater) there are always lots of opportunities for skilled craftspeople who are not destined for stardom.</p>
