      <p>On the other hand some font houses have what are affectionately called "bezier monkeys" :-) who don't/can't come up with strong original designs but are highly valued for their "finishing" skills, which some "official" type designers actually lack enough of. Eric Gill for example never did any of his spacing - that was left to the "boys" at Monotype. Now, this sort of thing isn't glamorous, but if you happen to enjoy it, and the money it brings, then hey. Also, it can lead to becoming an "official" type designer, like it did with Ole Schäfer at FontFont. A number of people [formerly] at FontBureau also seem to have started off that way.</p>
      <p>&gt; not long ago H&amp;FJ was looking for a font developer:</p>
      <p>How strange that they didn't announce it on Typophile.</p>
      <p>hhp</p>
