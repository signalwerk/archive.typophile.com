      <p>This is not a rich field, so there are very few "jobs" in the conventional sense of the word. This is why so many type designers are their own foundries! But whether you're trying to succeed solo or by being an employee, first you need to have at least a couple of really promising designs out there, either to sell or to impress.</p>
      <p>So make something, maybe post it here for a critique, and see where you get.<br>
      Just know that it's both creatively and technically a high challenge.</p>
      <p>hhp</p>
