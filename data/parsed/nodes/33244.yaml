    <p>Hi,</p>
    <p>Since some of you are professional type designers and type founders, I was wondering how one<br>
    could enter this craft seriously, and which are the functions one could have in a type foundry developing or designing fonts.<br>
    Are there many varieties of jobs within a type design in a big foundry? How is the working structure of a big type foundry like, for instance, LinoType?<br>
    And the boldest question: Does anyone one about jobs in type foundries for those of us who want to work in type design and actually make a living of it?</p>
    <p>Thanks in advance.</p>
