      <p>Have things really changed that much from pre-digital days?<br>
      If you want a type-specific education, there is not much choice, and the same holds true if you want a job.<br>
      The big difference is that it is now feasible to start your own foundry.</p>
      <p>The good news is that some small foundries, although they may not have job openings, will take on interns. I presently have one -- it's a requirement of his design degree course that he works six weeks as an intern in a design firm.</p>
