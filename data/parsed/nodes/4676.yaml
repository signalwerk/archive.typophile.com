    html: '<p>Well, in German, Typography can actually be writen one of many diffent ways. In his 1998 book, <i>Kurtstexte</i>, Kurt Weidemann writes the following about Typo and spelling (please forgive me, this is both a translation and a mental summary): <br> <br><i>Tipografie</i> would refer to any kind of typography that involves someone typing, i.e., a compositor at his keyboard, or a DTPer, but not an author with Microsoft Word (necessarially). <br> <br><i>Typographie</i> refers to the New Typography of the 1920s. Mostly because this is how Jan Tschichold spelled the word then. <br> <br><i>Typografie</i> is the "in" spelling of the word a the moment. It is also the correct spelling, according to <i>die neue deutsche Rechtschreibung</i>, I think. It implies the contemporary streamlinization of Typography, and is spelled just as it sounds (at least, that is what a German would tell you!). <br> <br>On an other note, I recently made a poster for an architecture company in Frankfurt, in which I wrote out Architecture in 11 different languages, including Turkish, Arabic, and Simplified Chinese. Unfortunately, in all of the European languages, the word <i>Architecture</i> looks about the same.  <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"></p>'
