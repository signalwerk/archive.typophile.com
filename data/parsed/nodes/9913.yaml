    html: "<p><i>Is there any reason it should still be included in a font?</i> <br> <br>Two good reasons: <br> <br>1. It is a character in many standard 8-bit codepages, so if you are making a font that claims support for e.g. the Mac Roman or Windows 1252 codepages you had better include it. <br> <br>2. Some users, particularly on the Mac, have begun using the florin symbol as an abbreviation for 'folder'. <br> <br>Note that the Unicode codepoint for the florin unifies this currency symbol with a hooked f, which is a letter in the alphabet of many African languages. This can cause design issues in fonts for African languages, since the hooked f is not always sloped in the way the florin usually is, but is harmonised to the style of the other letters in the typeface.</p>"
    html_clean: "<p><i>Is there any reason it should still be included in a font?</i> <br> <br>Two good reasons: <br> <br>1. It is a character in many standard 8-bit codepages, so if you are making a font that claims support for e.g. the Mac Roman or Windows 1252 codepages you had better include it. <br> <br>2. Some users, particularly on the Mac, have begun using the florin symbol as an abbreviation for 'folder'. <br> <br>Note that the Unicode codepoint for the florin unifies this currency symbol with a hooked f, which is a letter in the alphabet of many African languages. This can cause design issues in fonts for African languages, since the hooked f is not always sloped in the way the florin usually is, but is harmonised to the style of the other letters in the typeface.</p>"
  - id: 63107
