    date_raw: 23 Mar 2005 — 3:16pm
    votes: null
    html: <p>It's a standard character, so it's gotta be there, no matter how people use it or not. <br> <br>The only non-intuitive but crucial thing about the Florin seems to be that it should really be slanted; an upright one is sort of a stand-alone unorthodox design statement; not suitable for a text font. <br> <br>BTW, the Florin-as-folder usage is quite old, at least 10 years or something. <br> <br>&gt; the Unicode codepoint for the florin unifies this currency symbol with a hooked f <br> <br>That's kind of dumb. <br>Will it be fixed? <br> <br>hhp</p>
    html_clean: <p>It's a standard character, so it's gotta be there, no matter how people use it or not. <br> <br>The only non-intuitive but crucial thing about the Florin seems to be that it should really be slanted; an upright one is sort of a stand-alone unorthodox design statement; not suitable for a text font. <br> <br>BTW, the Florin-as-folder usage is quite old, at least 10 years or something. <br> <br>&gt; the Unicode codepoint for the florin unifies this currency symbol with a hooked f <br> <br>That's kind of dumb. <br>Will it be fixed? <br> <br>hhp</p>
