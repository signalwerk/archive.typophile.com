    <p>so i've read that the design of the <a href="/wiki/florin" class="freelinking" rel="nofollow">florin</a> symbol is based on the italic f. can anyone point me toward or give me any other tips on what makes a good florin? also... with the EU and all, is this character even relevant today???</p>
    <p>hmmm... just found it on a site for <a href="http://www.guardian.co.uk/gall/0,,617513,00.html" rel="nofollow">defunct european currencies</a>.<br>
    Is there any reason it should still be included in a font?</p>
