      <p>I found it.</p>
      <p>It’s called an “<a href="/wiki/overshoot" class="wiki-create">overshoot</a>”</p>
      <p>Typically 3%x on a curve(o), 5%x on a point(A).</p>
      <p>I came across it a few days ago, but forgot where.</p>
