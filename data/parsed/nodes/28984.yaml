    votes: null
    html: <p>The quantity of overshoot has more to do with the type of curve or type of point than a standard x-height %.</p>
    html_clean: <p>The quantity of overshoot has more to do with the type of curve or type of point than a standard x-height %.</p>
  - id: 164036
    user: 4763
    date: 2006-10-23T01:37:00
    date_raw: 23.Oct.2006 1.37am
    votes: null
    html: |-
      <p>The overshoot needs to be a bit more for very “round”, narrow curves and less for flatter ones, like the O in Eurostile or the C in Thesis. </p>
      <p>It helps me not to think in terms of the depth/height but the width of the extending portion: If you make the overshoot so big that is has about one third of the width of the O you are probably right.</p>
