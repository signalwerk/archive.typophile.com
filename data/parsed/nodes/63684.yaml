    html: |-
      <p>Hej Peter,</p>
      <p>Your font is coming nicely along.  Nice to see the notch in the letter U.  For what it's worth, the J strikes me as much too skinny; L is a bit small, too.  I'd also encourage you to consider balancing the R a little more (smaller bowl, bigger leg) and adding notches or something to the F.  The word "FATMAN" in your graphics above is more or less illegible at that size.  Other than that, nice work.</p>
      <p>In case it hasn't already come to your attention, there are already several fonts named Fatman out there:</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/atype/fatman/" rel="nofollow">http://new.myfonts.com/fonts/atype/fatman/</a><br>
      <a class="freelinking external" href="http://www.fonts.com/findfonts/SearchPage.htm?kid=Los%20Alamos%20Pro%20Fat%20Man" rel="nofollow">http://www.fonts.com/findfonts/SearchPage.htm?kid=Los%20Alamos%20Pro%20Fat%20Man</a><br>
      <a class="freelinking external" href="http://www.searchfreefonts.com/free/fatman.htm" rel="nofollow">http://www.searchfreefonts.com/free/fatman.htm</a></p>
      <p>You could add yours to the list, but on the other hand you might consider a name that hasn't already been used...  "Ginormity"? "Humongous"? "Larger Than Life"?</p>
      <p>In any case, best of luck.</p>
