      <p>Hi, </p>
      <p>  I'm a student too and I'll try to give you my honest and humble opinion.</p>
      <p>  The first thing that came into my mind (and I know it's really odd) was the Mettallica lettering, specially K, N, R, Z, Y, Z... Don't ask me why but it reminds me, with a bold modern look.<br>
        I think it's still inconsistent. You should work it better specially on details, and structure, like, why does the B doesn't have counterform? Why the Q's and O's counterform is smaller than C's and G's? And there's more, but I'm afraid to sound annoying and too boring.</p>
      <p>  I'm working on a font too, that it's kinda "similar" to this of yours.<br>
        If you want to share opinions more properly give-me your e-mail and I'll send you mine, as I don't want to show it off "typophile forum scale" if you know what I mean :).</p>
      <p>  Plus you should make some test prints with various sizes and with real phrases or words, to get a notion of how it works on real, specific applications, that you should decide to. I assume it's meant to be a poster application?..</p>
      <p>  Regards, and good work!<br>
        João</p>
