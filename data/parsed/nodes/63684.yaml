      <p>Thanks,</p>
      <p>This is gonna be for a poster, business card, letterhead, website and for my own logo.</p>
      <p>Already did some print tests, works fine as a logo on a business card, the counter on the /O/ was almost gone so it makes sense making it bigger.</p>
      <p>Gonna keep the counters out of the numbers for now, I kinda like it like that and it helps to seperate the zero and /O/. The counters look fine on /4/, /6/, /9/ and /0/ but not on the /8/, to me it makes more sense to leave them all out.</p>
      <p>I noticed the overbite issue on /F/ but I think it's a cool /F/, tried some variations but nothing decent came out of it.</p>
      <p>Made some changes trying to make it more consistent.</p>
      <p>Made changes to /C/, /B/, /E/, /G/, /J/, /M/, /O/, /Q/, /W/, /3/ and /8/.</p>
      <p>Right now when I'm looking at the letter the /B/ looks odd to me.</p>
      <p>Let me know what you think,<br>
      Peter</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophile2_3415.jpg"></div><p></p>
