    html: '<p>If your looking for train fonts this is the spot:  <br><a href="http://www.railfonts.com" target="_blank">www.railfonts.com</a>. <br><br>I’ve looked through all of them, and I think the  <br>closest to yours is the Egyptian lettering from  <br>Southern Paciﬁc. The 1 is the only character  <br>that is radically diﬀerent. Also notice the 4 is  <br>very dark like your sample. <br><br><a href="http://www.railfonts.com/cgi/font-store/fontshop.cgi?ACTION=thispage&amp;thispage=page12.html&amp;ORDER_ID=124557260" target="_blank">http://www.railfonts.com/cgi/font-store/fontshop.cgi?<span class="caps">ACTION</span>=thispage&amp;thispage=page12.html&amp;<span class="caps">ORDER</span>_ID=124557260</a> <br><br>Randy</p>'
