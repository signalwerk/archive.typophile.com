      <p>Hi Claes.<br>
      I think it looks good - it does have reference to Ed Interlock and others, but these days what doesn't have a link to others? I think the S is a little harsh and needs a bit of fun injected - maybe you don't need the down strokes - might look better to have them running horizontal. The other letters seem to have a kind of "wacky" feel to them which is great, but the S kind of lacks that and looks a bit like the Apple system font Chicago.<br>
      Just my 2 cents. Otherwise she's a beauty.</p>
    html_clean: |-
