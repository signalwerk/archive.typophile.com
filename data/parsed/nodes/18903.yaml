    html: "<p>the challenge (which i'm currently facing) is just that: keeping it spontaneous and imperfect. and to achieve that, find what ligatures to make/use and what to stay away from (even if they'd make great usable ligatures). as i've noticed, a font like this could have a near-infinite number of ligatures, but i highly doubt more would make it look better.. the more definitely won't be the merrier. i certainly have a massive task ahead of me.</p>"
