  html: |-
    <p>Hello, im using Fontlab 4.6 and i have just built my own font.</p>
    <p>Im thinking about making a bold version of the type and transforming the glyphs one by one seems like a very ineffective way to do it. I think I have read somewhere that there should be some kind of "auto-transform-glyphs command"?</p>
    <p>Thank you, Fredrik</p>
