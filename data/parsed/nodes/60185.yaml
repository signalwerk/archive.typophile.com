      <p>Yeah I can see some similarities. Maybe someone has something closer. I think Neutraface was based on some older building signage (kind made out of metal) and that's where I got this from and then cleaned it up. Perhaps it is from Richard Neutra's work though I don't know if it was widely available back then or just on the houses he designed.<br>
