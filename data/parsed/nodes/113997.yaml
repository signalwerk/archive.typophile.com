      <p>Thanks Fivos. I knew this was familiar! Overload at the memory bank! One of the more famous fonts by Hermann Ihlenburg, patented November 29, 1892.<br>
       Notes from Solopedia<br>
      ----start quote----<br>
      (Sam Wang, Brendel/B&amp;PGraphics), Wedgewood (Brendel), Deneane (FontBank), Cowan (Opti), C790 Deco (Softmaker), Tringle (WSI), Jazzy 50 (Fantazia), Beaumarchais (Scriptorium)<br>
      Tom Phinney is developing a high-quality version named Cristoforo.<br>
      ----end quote---<br>
      Tom Phinny's update:<br>
      <a href="http://www.thomasphinney.com/2014/01/kerning-and-spacing-fonts/" title="http://www.thomasphinney.com/2014/01/kerning-and-spacing-fonts/">http://www.thomasphinney.com/2014/01/kerning-and-spacing-fonts/</a><br>
      Don</p>
