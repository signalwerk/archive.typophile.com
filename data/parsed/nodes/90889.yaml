  html: |-
    <p>I recently applied for a job and sent a .pdf.</p>
    <p>The good news is that they want me to come in for an interview.<br>
    The bad news is that my normal printed portfolio is the same as that .pdf.</p>
    <p>How different do they have to be? My portfolio is full of smaller projects and illustrations. Nothing's really been printed, and I don't have any books.</p>
