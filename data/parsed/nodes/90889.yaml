    html: |-
      <p>I call it pragmatic design even though it's really me just being lazy, but my portfolio has always been a PDF file. When I go into an actual interview, I'll print the PDF out on a color laser printer and add a cover.</p>
      <p>I'll typically load it up on the iPad or laptop as well.</p>
      <p>So, they're rarely different. At times, depending on the gig, I may edit the portfolio a bit pulling out certain projects or adding others, but I don't explicitly put different content on the PDF I send vs. what I bring in for the face-to-face.</p>
