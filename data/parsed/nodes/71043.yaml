  html: |-
    <p>I have been working on a project at work and threw it on my Dropbox to work on at home a bit... while the InDesign file is fine, all of the typeface files are zero bytes and don't work! Hmm...  figured it was just a weird thing, so I tried it again, and also emailed the typeface to me (both zipped up, and by attaching each file singularly). And again... zero bytes.</p>
    <p>I am at a loss - very strange problems. Any ideas?</p>
