    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 8.Oct.2007 11.43am </div>
      <p>===</p>
    <p>Friday 19 October, 1pm - 2pm, free</p>
    <p>The early Royal Society was much concerned with engraving and<br>
    printing - both as a technical discipline and a practical tool for<br>
    illustration and publication - yet we seem to know little about the<br>
    artists involved, not least with the most enduring images of the<br>
    Society’s early work, the plates from Hooke’s ’Micrographia’.</p>
    <p>Speaker: Dr Jim Bennett, Museum of the History of Science, University of Oxford<br>
    Venue: The Royal Society Library, 7 Carlton House Terrace, London, SW1Y 5AG<br>
    To register for this event and guarantee a seat, please email library [at] royalsoc.ac.uk</p>
    <p><a href="http://www.royalsoc.ac.uk/page.asp?tip=1&amp;id=6945" title="http://www.royalsoc.ac.uk/page.asp?tip=1&amp;id=6945">http://www.royalsoc.ac.uk/page.asp?tip=1&amp;id=6945</a></p>
    <p>===</p>
