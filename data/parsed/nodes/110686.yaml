  html: |-
    <p>Dear all, does anyone know about nice script typeface, alternative to Lavanderia <a class="freelinking external" href="http://www.losttype.com/lavanderia/" rel="nofollow">http://www.losttype.com/lavanderia/</a> that would work in Polish? Good or at least acceptable diacritics required, and readable version of digraphs used in Polish (rz, cz, sz), like those in Liza. </p>
    <p>Most of the scripts, I have found, use "z" with the bottom loop and the script version of the "r" (like in Feel Script), which is not always readable in Polish.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lavanderia_one_5782.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Liza_3506.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Feel_6185.png"></div><p></p>
