    html: |-
      <p>Maybe it is time to show my progress:</p>
      <p><img src="http://dl.dropbox.com/u/46459223/weekend2.JPG" width="500px"></p>
      <p>Changes:<br>
      Capital letters (which have more serifs than the lowercase).<br>
      Most letters have nearly the same width.<br>
      The basic shape of b d p q g etc. looks more like it is hand drawn (a little dilemma here, because I actually liked the previous shape too.)<br>
      I added some more "inktraps" (not sure if this term is correct)<br>
      New "k".</p>
      <p>Still a lot of work.</p>
      <p>I am thinking that I should use less straight lines.</p>
