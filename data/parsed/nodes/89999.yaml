    html: |-
      <p>I will go, point by point.</p>
      <p>/e/... looks better like that.</p>
      <p>/k/... I think it needs to be more like handwritten. I will work on it. This one was just demo.</p>
      <p>/e/ and /n/... I agree on the /e/, the middle stroke should be thinner, like in the /a/. /n/ though is directly copied from /d/, so the difference must come from some optical illusion, with which I am not familiar with.</p>
      <p>Where do you see blackletter in this design?</p>
