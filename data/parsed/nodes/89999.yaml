    votes: null
    html: |-
      <p>Nice looking 'z' with the ink traps. Pretty cool typeface as well. It has a bit of the appearance of a blackletter yet it's much more soft and friendly.</p>
      <p>- /w/ is a bit too wide.<br>
      - /s/ is too light.<br>
      - The bottom side of /e/ (does this part have a name?) should be a bit more extended to the right I think.<br>
      - I'm not sure what the /k/ needs but the current design indeed looks weird due to the serif on the leg which extends the length.<br>
      - /d/ has a bit too much contrast compared to letters like /n/ and /e/. Actually, I see the same with /p/, /q/ and /a/ so you might want to increase the contrast in /e/ and /n/ instead of decrease the contrast in the other letters.</p>
      <p>By the way, as far as I'm concerned you can post as much as you like. I was actually disappointed to see there hasn't been much activity on Typophile in the last few days and also not a lot of new typeface entries.</p>
