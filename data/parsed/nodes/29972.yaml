      <p>For anyone who considers them a serious bibliophile and typophile I'd gift them with <a href="http://www.p22.com/rtf/pietree.html" rel="nofollow"><em>Leaves from the Pie Tree</em></a> recently completed by fellow Typophile Jim Rimmer. Here I quote from P22:</p>
      <ol>Jim Rimmer has completed: "Leaves from the Pie Tree". This magnum opus is an autobiographical account of his life with type and the book arts along with "how-to" knowledge of the craft that a rare few possess. This extremely limited edition of 50 copies will include a co-edition of 10 copies made for P22 and offered at a discount to the first 6 purchasers of the full Rimmer Type Foundry Collection. The size of the book is approx. 10-1/2" x 14-3/4". Printed in the monotype cast Quill type on 120 GSM Arches Cream text paper on a Colts Armory press. The book will be hand bound with a leather and linen quarter binding with linocut illustrations, tipped in images and even a hand cut letter pattern used in the creation process of his metal type. The book retails for $700(CND) and can be ordered directly from Jim Rimmer at the Pie Tree Press ( rimmertype {at} shaw {dot} ca ). The p22 co-edition will be available for $400 with the purchase of the RTF collection at $999.95. Only a few copies of the P22 co-edition can be accommodated.
      <p>$1399.95 with full Rimmer type collection or $650 (US)</p></ol>
      <p>There are sample images if you follow the link above. It looks to be a tactile and educational experience. Long live the printed word!</p>
    html_clean: |-
