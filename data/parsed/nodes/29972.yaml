      <p>&gt;why would one need that</p>
      <p>Sorry, I guess that was a little too esoteric. Orthodox Jews interpret the Biblical prohibition on starting fire on the Sabbath as forbidding switching on or off electric lights, as that might involve a spark. However it is permitted to leave an electric light on. </p>
      <p>Hence one night a week you have the problem of reading in bed before sleeping. If you leave a light on, then you can't turn it off. But this moveable shade hides the visible light without switching the lamp off, and without covering it so it might overheat and catch fire.  </p>
      <p>Not being Orthodox, I find it kind of hilarious and sweet at the same time. Love that animated gif also. Definitely a 'unique gift item'!</p>
    html_clean: |-
