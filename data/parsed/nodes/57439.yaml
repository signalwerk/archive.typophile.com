      <p>Thanks</p>
      <p>It was done with a “Ruling Writer”</p>
      <p>Basically it is a large bladed ruling pen. It was done on cold press watercolor paper, hence the splatter and rough edges on the letters. When raking the pen across the paper the blades become much like a tuning fork... they vibrate causing the ink to “fly.”</p>
      <p>Michael</p>
