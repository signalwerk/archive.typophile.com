    <p>...in my commercial work. </p>
    <p>In the “card industry” facet of my work they want calligraphy. In this instance I used P22 Peanut and they will never know the difference.</p>
    <p>What I think is cool in this piece is that this scripture can be broken into three threads, in different colors, and it still maintains its flow, and the three threads are cohesive. And who says that scripture is not divinely inspired. </p>
    <p></p><div class="imageWrap"><img src="/files/blue_5477.png"></div><p></p>
    <p>Michael</p>
