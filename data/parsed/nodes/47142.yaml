      <p>dezcom - I agree, brand confusion is not something that I want to deal with.</p>
      <p>pica pusher - I think moving in a direction that makes the logo more easily distinguishable as an ’X’ would be a good idea. It would at least allow me to continue using the same style.</p>
      <p>vintagesignman - Thanks for the mock-up! I’ll see if I can play with the design a bit and move it more towards a recognizable ’X.’</p>
      <p>Tiffany - I hadn’t considered the logo being faction-like, though I definitely agree with you. Maybe it was a sub-conscious thing...</p>
      <p>Trick - I too started to notice that while I was looking over the different variations. I think slicing the icon in half helps to reduce the mask imagery, but maybe a little more treatment wouldn’t hurt either.</p>
      <p>Thanks to all of you that have posted your comments regarding this design. I really appreciate it.</p>
      <p>I’ll start working on some revisions and see if I can’t make this logo be more unique and recognizable.</p>
