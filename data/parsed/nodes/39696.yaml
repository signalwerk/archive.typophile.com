    html: |-
      <p>I actually did contact a stencil maker. Bridge is what they call it. Connector is a logical second option. I don't think it's necessary to invent a new, separate term for the same thing in a digital stencil font. One thing maybe worth differentiating: real, functional bridges versus fake, digital ones. </p>
      <p>Note: Silkscreening is essentially a stencil technique; anything including thin threads or hair can act as bridges, so it's possible to make stencils that don't look like stencils. I've used long hairs as bridges on stencils for house numbers where the letters would be too ambiguous and unreadable with fat paper bridges. "Invisible bridge"..... Add it to the wiki.  ;)</p>
    html_clean: |-
