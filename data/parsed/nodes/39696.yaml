      <p>"Like it matters."</p>
      <p>The extreme triviality of this whole "pylon" definition makes it an amusing discussion. It reminds me of Rich Hall back in the '80s when he created the term <a class="freelinking external" href="http://en.wikipedia.org/wiki/Sniglet" rel="nofollow">"sniglet"—creating silly words to describe unlabeled things.</a> There was even a sniglet to describe the crust that builds on the rim of ketchup bottles. (Although true sniglets are newly created words and pylon, connector, bridge, gap are not.)</p>
      <p>Let's see though, in twenty plus years of working with type I've needed a label for this thing how many times? None! Never! But then again this is a discussion that someone has plastered all over the internet about nothing—literally nothing. Seinfeld got famous with a TV comedy show about nothing. Maybe nothing is just funny by nature.</p>
      <p>Everyone say CHEESE!</p>
