    html: |-
      <p>Outside of typographic context, in architecture and airplane construction for example, a "pylon" is a kind of projecting strut or stick-shaped structure used for mounting components like engines, equipment nacelles, pods, bridge sections, girders.</p>
      <p>The only sense I can think of in which that applies to a lettering stencil is *projection* into letter and glyph forms. Other than that these so-called "pylons" don't have anything mounted on their ends.</p>
      <p><em>Since it’s an artifact of stencil limitations, isn’t it called a connector or bridge?</em></p>
      <p>On the stencil itself, I would call those parts "connectors" or "bridges", since they connect the surrounding material together and act as a kind of land bridge.</p>
      <p>For the artwork---the lettering produced by a stencil---I call the blank areas "gaps". Just common sense really. Going on a "gapping spree" is the easiest way to turn an ordinary font into a textured font ;^)</p>
      <p>j a m e s</p>
