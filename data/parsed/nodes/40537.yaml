    <p>Hello,<br>
    I'm a student in Switzerland and I do a theorical work about law and typefaces.<br>
    I'm looking for precises exemples of illegal use of Typeface. If you know something about Linotype coming in some Company with a bill for 200 unpaid licences for Helvetica. If you have any pictures, or you know Graphic Designer or Company who don't pay any licences...</p>
    <p>Everything is welcome</p>
    <p>Don't feel shy about denunciation!<br>
    ______________________________________________________</p>
    <p>Thanks/<br>
    David K</p>
