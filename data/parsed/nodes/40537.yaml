      <p>@David - I daresay there are tons of violations out there :-)) Lots of obvious ones, like companies having a standard license and using it on 1000 computers, or embedding it into some hardware or software. But they will be difficult to find, as these companies naturally would never admit such a thing :-)</p>
      <p>A real tough one is using old CAD software - it needs a proprietary font format, and automatically transforms standard fonts into this  format. Not allowed, according to most of the font licenses I know, although most foundries tolerate it, AFAIK :-)</p>
      <p>And then there was Windows NT 3.5, which automatically transformed PostScript fonts into TrueType fonts - it was not there anymore in Windows NT 4.0, and I do believe I know why - license violation! :-)</p>
      <p>Let's see, there are also lots of people who change/manipulate/customize free fonts because they believe the software, being "free", is also OpenSource, thereby of course violating the copyright of the designer/creator. I usually get raised eyebrows and horrified faces when I point this out to friends who show me the "new version" they just did, hihi....</p>
      <p>Then there are the not so obvious violations - like copying a typeface and renaming it. This sometimes is not strictly illegal, but I usually find it ethically unacceptable (there are exceptions). Arial from Monotype is a nice example, or Humanist from Bitstream. Not funny.</p>
      <p>Oh, and Uli is our self-appointed knight in shining armor, protecting us all from shady people :-) He does sometimes hit the nail on the head(!), some things on his website are just half-truths, and some things are just plain wrong - although I daresay not on purpose, but simply because of lack of understanding. It is always funny to read his stuff, though, if you understand German! He unfortunately sometimes takes his opinion as proof, and tends to insult people without having said proof. He will then tell you stuff in Latin, and will finally get the wall of silence on him. :-)</p>
      <p>*gives Uli a nudge* Hey, pal, it is not polite to accuse someone, then delivering the accusation in a language not officially spoken in this forum. Thomas does not speak German, and David might also not speak German. So you might want to translate it, otherwise I think it is highly rotten to post something ABOUT what you think to be the motivation of Thomas without even giving him the chance to respond. Stop that. I read it, and I daresay that some of the things are true (I am equally quite sure that some of them are not!), but since this is an English speaking forum, it is just not fair towards the others!!</p>
