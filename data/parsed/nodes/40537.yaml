      <p>Jordy, if you are talking about type, I think you are way off base. </p>
      <p>When Adobe was keeping its PostScript format secret, in the 80's, you'd have had an argument. But now Adobe seems to be following a strategy of encouraging type design outside its company, particularly in the Open Type formats that its graphics programs are good at using. Ok, it's self interest, but it looks like pretty enlightened self-interest to me--and not monopolistic as far as fonts go. </p>
      <p>And Thomas Phinney in particular has been very generous with his time both on Typophile and at conferences, explaining the technical side of type to anyone who is interested. And they publish a lot of technical type information, available for free download. All this information helps other designers compete with Adobe's type faces.</p>
