    html: |-
      <p>Jordy,</p>
      <p>Luc and I do simply disagree on many things which are more matters of opinion. This doesn't bother me so much. I'm perfectly capable of having a spirited disagreement with somebody and still respecting and liking them, as long as they are honest and not malicious.</p>
      <p>&gt; If you do a bit of research you will find that Luc Devroye’s comments, while very pointed, are accurate.</p>
      <p>I guess we've researched different issues, or in different ways. But I've said my piece on this before.</p>
      <p>My biggest issue with him is that Luc has a history of posting links to pirated fonts, including pirated fonts from the company I work for, and not willingly removing them when politely asked. That's made me pretty grumpy with him.</p>
      <p>But on the bigger picture....</p>
      <p>You're free to "dislike large corporations controlling and attempting to dominate the market as Adobe has done." But you must be talking about a market other than type. Which company acquired ITC and then Linotype? What's the biggest font retailer? (Hint: answers to both are "not Adobe.") If you're talking type, Adobe has neither attempted nor succeeded at controlling/dominating the market.</p>
      <p>Now, it's true that despite reduced market share over the years, Adobe remains highly *influential* in the type market. How? By having software that uses fonts in sophisticated ways, providing font development source code and tools at no charge, inventing or co-inventing key standards, giving font development training and info to our nominal "competitors" (both privately and via conferences and seminars), and helping educate the next generation of type designers and font developers at Reading (and this year at KABK as well).</p>
      <p>I've lost track of the number of times I've publicly posted font feature source code and presentations about font development practices, or updated my essay on font formats....</p>
      <p>Frankly, I find it hard to imagine a private company being more open and collegial in how it influenced the font marketplace.</p>
      <p>Perhaps you just don't like Adobe's market position for other software besides fonts?</p>
      <p>Cheers,</p>
      <p>T</p>
