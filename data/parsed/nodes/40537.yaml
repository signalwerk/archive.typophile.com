    html: <p>David K, Five years ago I was commissioned to work on an advertising campaign by a very well known European Advertising agency. After the meeting the art director mentioned they'd been using my fonts on various campaigns - one of which was for a well known international Charity. He then proceeded to give me a copy of the printed corporate identity manual for the campaign. In the back of the manual was a factory produced CD which contained copies of my fonts and also fonts owned by a corporate type foundry. Of course I was gob-smacked - the agency had neither permission or had paid for the rights to distribute my data in such a way - as far as i was aware they had paid for just a standard 5 user license. As the commission they had just agreed to give me was paid very generously and the Charity I mention was a worthwhile cause I decided to let it go. It just shows the lack of awareness there is in the industry regarding licensing.</p>
