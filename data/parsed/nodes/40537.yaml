      <p>If I could inject a bit of ignorance here and hopefully get some feedback, that would be wonderful.  This is the closest post I have found to my topic, and I hope it might add an interesting perspective for David K.</p>
      <p>I'm a small-scale graphic designer (T-shirts, note cards, greeting cards) and I've been searching everywhere for the legality of my using different fonts in my designs.  I want to do the right thing and respect other designers' intellectual property, but I can't seem to find much info out there.  Everyone mostly seems to discuss the issues surrounding copying/altering/reselling font files, none of which (I think) I'm doing.</p>
      <p>I "purchased" and downloaded a "4200 FREE FONTS" package a couple of months ago.  There were no text/licensing files with the TTF files (as I've seen before with other fonts I've looked at), but the header info in many of the files reads "(c)...All rights reserved...".  I'm assuming I need to search for the creator of the fonts to obtain their permission to use the fonts in my work.  If this is indeed the case, would I expect to pay them a one-time fee?  Or royalties on any sales I make of products displaying their font?  Is there any standard practice?</p>
      <p>I've asked many professionals (including lawyers and designers) these questions and, interestingly enough, MOST have said, "Don't worry about it - you should be fine".  I'm not comfortable with that answer...</p>
      <p>Any feedback / information would be greatly appreciated.</p>
      <p>Regards,<br>
      Tod<br>
      ____________________________________________________________________________<br>
      "In all things of nature, there is something of the marvelous." Aristotle</p>
