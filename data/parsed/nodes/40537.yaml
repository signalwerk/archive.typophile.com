      <p>&gt;And then there was Windows NT 3.5, which automatically transformed PostScript fonts into TrueType fonts - it was not there anymore in Windows NT 4.0, and I do believe I know why - license violation! :-)</p>
      <p>Pike, I didn't picture you as part of the conspiracy theory crowd - oh well ;-). The convertor was actually dropped when MS licensed the ATM rasterizer from Adobe. The converter was implemented in NT with support of the font community - that's why it wouldn't convert an Emigre font, and set all converted fonts to "no embedding".</p>
