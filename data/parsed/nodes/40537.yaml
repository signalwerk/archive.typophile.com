      <p>Todly said<br>
      I “purchased” and downloaded a “4200 FREE FONTS” package a couple of months ago. There were no text/licensing files with the TTF files (as I’ve seen before with other fonts I’ve looked at), but the header info in many of the files reads “(c)...All rights reserved...”.</p>
      <p>--------------------------------------</p>
      <p>Todly, I've had clients years ago who asked for a specific font and I sometimes would steer them to a different font on one of those cheap and nasty font compilation CD's because of the ease of use. One day I noticed a standard License required Commercial font on one of those cheap font CD's. The Font's name had been changed, and a friend of mine had Fontographer and checked, and yes, all copyright legals and the creator's details had been removed. In the early days I thought cheap Font CD's were heaven sent. In fact, most are stolen and only cheap and nasty copies.</p>
      <p>If you keep abreast of the most commonly used Commercial Fonts, you'll soon see a rip-off on those Compilation Font CD's.</p>
      <p>And in the old days, when they offered you x amount of Fonts on a CD, then they would give you only the Font Files. Then some of these nasty Font companies would supply these disks embedded with a type program 'browsers'. Some were even early developed Adware/Spyware.</p>
