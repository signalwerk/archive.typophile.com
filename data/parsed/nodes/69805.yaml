  html: |-
    <p>hey everybody,</p>
    <p>I'm writing my bachelor thesis: It's topic is experimental typedesign.<br>
    By extremly pointig out formal basic elements (like form of serifs, stroke contrast, white space, proportion etc.) and combining them with emotional parameters (elegant, reliable, light, heavily etc.) I will create type-experiments, which are at the sidelines (but within the scope) of legibility.</p>
    <p>Execution will be performed in the following way:<br>
    <strong>experiment</strong> #1 =<br>
    <strong>parameters</strong>; formal and emotional (fragmented shapes (1-D) + serifs  (5-C) + hairline (3-A) + fashionable)<br>
    + <strong>hypothesis</strong> (»even less tha 60% of necessary elements would be readable«)<br>
    =&gt; <strong>a new typeface</strong> or <strong>a proved impossibility</strong></p>
    <p>Through uncommon or hard realizable combination, interesting type-drafts and/or scribbled rudiments should be created. Nevertheless these fonts should follow typographical conventions and not become »Free-Fonts à la dafont. com«.</p>
    <p>During the next weeks, I'll post my first drafts.</p>
    <p>I'm rally happy for every single comment, every advise, every link, even for an abstruse combination of the parameters …</p>
    <p>Thank you in advance.</p>
