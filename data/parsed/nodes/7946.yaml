  - id: 53573
    user: 3480
    date: 2004-12-03T02:21:00
    date_raw: 3 Dec 2004 — 2:21am
    votes: null
    html: "<p>Wow, thanks for all this guys. I thought the thread had been 'dingied' as we say in Glasgow (rough translation: 'ignored') but obviously you were deliberating <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Stephen: I think the contempory feel is more important than that the face be specifically 18th C. I guess it's misleading to mention such a specific period in the context of typography. As I'm sure you've realised, the treatment of the subject matter isn't drily historical. <br> <br>To nobody in particular: I guess I'm also not keen on using distressed faces in general, and particularly not for this job -- it could all get a bit Captain Birdseye. <br> <br>To Tiff, re readability: I'm not against people having to do a little bit of work to read certain things; in this case, as I wrote, I think the face will be used only for the four-word title. It's for a very visually-intelligent niche audience, who will go to the show whether they can read the title or not, so to me it's more important to offer something novel, pertinent to the subject matter but taking a new angle on it. A bit of mystery is fine. <br> <br>Having said all that, David H: Zanzibar is wild. I looked at Fountain for this project but somehow managed to miss that face. I just downloaded the PDF and had a look at the full character set, and I think it could really work. It makes the right kind of visual reference, but feels like it couldn't have been designed anytime but now. Very nice indeed. The slight off-the-wallness is a bonus, too. <br> <br>Maybe I'll get up the courage to post the results in Critique ... <br> <br>Thanks all of you, <br> <br>R</p>"
    html_clean: "<p>Wow, thanks for all this guys. I thought the thread had been 'dingied' as we say in Glasgow (rough translation: 'ignored') but obviously you were deliberating <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Stephen: I think the contempory feel is more important than that the face be specifically 18th C. I guess it's misleading to mention such a specific period in the context of typography. As I'm sure you've realised, the treatment of the subject matter isn't drily historical. <br> <br>To nobody in particular: I guess I'm also not keen on using distressed faces in general, and particularly not for this job -- it could all get a bit Captain Birdseye. <br> <br>To Tiff, re readability: I'm not against people having to do a little bit of work to read certain things; in this case, as I wrote, I think the face will be used only for the four-word title. It's for a very visually-intelligent niche audience, who will go to the show whether they can read the title or not, so to me it's more important to offer something novel, pertinent to the subject matter but taking a new angle on it. A bit of mystery is fine. <br> <br>Having said all that, David H: Zanzibar is wild. I looked at Fountain for this project but somehow managed to miss that face. I just downloaded the PDF and had a look at the full character set, and I think it could really work. It makes the right kind of visual reference, but feels like it couldn't have been designed anytime but now. Very nice indeed. The slight off-the-wallness is a bonus, too. <br> <br>Maybe I'll get up the courage to post the results in Critique ... <br> <br>Thanks all of you, <br> <br>R</p>"
