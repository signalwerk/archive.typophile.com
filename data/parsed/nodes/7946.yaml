    html: "<p>&gt; slightly nautical- or 18th C.-looking which avoids pastiche or cliche. <br> <br>Not sure if these fit the bill and I sure as hell don't know if they look 18th Century enough. But looking at Ronsard, I've come up with these: <br> <br>T26's <a href=\"http://www.myfonts.com/fonts/t26/opsmarckt/\" target=\"_blank\"> Opsmarckt</a> <br><a href=\"http://www.letraslatinas.com/html_tex/lagarto.shtml\" target=\"_blank\"> Lagarto</a> from Letras Latinas. If you manage to buy this one, please lemme know how much it costs. <br><a href=\"http://www.myfonts.com/fonts/pixymbols/penman/\" target=\"_blank\"> Penman</a>, <a href=\"http://www.myfonts.com/fonts/pixymbols/penman-b/\" target=\"_blank\">Penman B</a> and <a href=\"http://www.myfonts.com/fonts/urw/polonaise/\" target=\"_blank\">Polonaise</a> <br> <br>Will you also consider something kinda distressed like <a href=\"http://www.myfonts.com/fonts/scriptorium/allegheny/\" target=\"_blank\">Allegheny</a> or would that be too hackneyed for the slave theme? <br> <br><a href=\"http://www.myfonts.com/fonts/scriptorium/platthand/\" target=\"_blank\">Platthand</a> is nice too, no?</p>"
