  html: <p>I'm just about to embark on some work in relation to an art exhibition. The exhibition is themed around the Robert Burns song 'A Slave's Lament' (for anybody who's interested, the artist, Graham Fagen, has recorded a dub version of the song with Adrian Sherwood at On-U Sound studios; the work takes the form of a music video which will be 'watched' by a group of scupltures). The work explores Scotland's rather little-known history of involvement in the slave trade. <br> <br>So, typographically I'm looking for something slightly nautical- or 18th C.-looking which avoids pastiche or cliche. I'm envisioning a slightly hard-edged script face with a modern feel. First thing that took my eye was Psy/Ops' <a href="http://www.psyops.com/html/spec_ronsard.html" target="_blank">Ronsard</a>. <br> <br>The face will probably be used only for the title of the show, which is 'Clean Hands Pure Heart'. <br> <br>Anybody feel like suggesting some alternatives? <br> <br>R</p>
  html_clean: <p>I'm just about to embark on some work in relation to an art exhibition. The exhibition is themed around the Robert Burns song 'A Slave's Lament' (for anybody who's interested, the artist, Graham Fagen, has recorded a dub version of the song with Adrian Sherwood at On-U Sound studios; the work takes the form of a music video which will be 'watched' by a group of scupltures). The work explores Scotland's rather little-known history of involvement in the slave trade. <br> <br>So, typographically I'm looking for something slightly nautical- or 18th C.-looking which avoids pastiche or cliche. I'm envisioning a slightly hard-edged script face with a modern feel. First thing that took my eye was Psy/Ops' <a href="http://www.psyops.com/html/spec_ronsard.html" target="_blank" class="link-external">Ronsard</a>. <br> <br>The face will probably be used only for the title of the show, which is 'Clean Hands Pure Heart'. <br> <br>Anybody feel like suggesting some alternatives? <br> <br>R</p>
