    html: <p>Even though this sounds like -- is -- an historical show, the display itself sounds very modern. Is it?  <br> <br>If it is, I would tend toward the less decorative and elegant (?) typefaces. Sloop seems far too elegant and decorative. Zanzibar is interesting, but too much of it could leave the viewer not reading what is important. Pirouette would still work if the alternates were used strategically and sparingly.</p>
