    html: |-
      <p>Hi Lisa,</p>
      <p><cite>I like that one small but when large it’s too heavy.</cite></p>
      <p>What you’re experiencing is the problem/the absent of <a href="/wiki/Optical%20Scaling" class="freelinking" rel="nofollow">Optical Scaling</a>.</p>
      <p>Over the last years, several foundries have published good text font families with optical sizes.<br>
      Check out <a href="http://www.adobe.com/type/topics/opticalsize.html" rel="nofollow">Adobe’s line-up</a>. Or <a href="/wiki/Sumner%20Stone" class="freelinking" rel="nofollow">Sumner Stone</a>’s <a href="http://www.stonetypefoundry.com/itcbodoni.html" rel="nofollow">ITC Bodoni</a> and <a href="http://www.stonetypefoundry.com/cyclesoverview.html" rel="nofollow">Cycles</a>. Or <a href="http://www.typography.com/collections/index.php?collectionID=700001" rel="nofollow">Hoefler &amp; Frere-Jones’ faces</a>. Or …</p>
      <p>For Caslon: <a href="http://www.myfonts.com/fonts/itc/founders-caslon/" rel="nofollow">ITC Founder’s Caslon</a> has optical sizes. You can also simply combine matching fonts and, for example, utilize <a href="http://www.fontshop.com/fonts/downloads/carter_cone/big_caslon/" rel="nofollow">Big Caslon</a> by Carter &amp; Cone for large sizes.</p>
      <p>F</p>
