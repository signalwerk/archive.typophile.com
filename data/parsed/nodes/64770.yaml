      <p>The Merrymount (not Merrymond) was Daniel Berkeley Updike’s —of Printing Types undying fame— company, founded in Boston in 1896 and apparently the most important enterprise aligned with the Arts &amp; Crafts movement in the USA.</p>
      <p>This beautiful and dark Venetian style type design was commissioned from Goodhue when Updike decided to move away from historical printing in the William Morris vein.</p>
      <p>I’m unaware if there is a digital version.</p>
