      <p>What an interesting suggestion, even though Monotype’s Italian Old Style seems to be overall much lighter in colour.</p>
      <p>A low resolution image doesn’t allow much leeway, but I’m guessing that not only is Merrymount’s colour notably darker but that machine printing pressure has made it even more so.</p>
