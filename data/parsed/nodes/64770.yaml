      <p>Shinntype’s <a href="http://www.shinntype.com/paradigm.html">Paradigm</a> is a low-contrast Venetian face.</p>
      <p>A technique to mimic the serious press gain: apply a small amount of Stroke in InDesign.<br>
      You might try this with a variety of Venetian faces, to see if any come close to this look.</p>
