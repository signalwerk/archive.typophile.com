      <p>The result might have been manipulated - here's a comparison with no compression or manipulation, just two different font sizes for upper case and lower case:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ZackMiri_6202.jpg"></div><br>
      The tittle maintains its original shape (which is very slightly oval), but the tops of the i's and r do look flatter. The r-i ligature is cleaner in the logo, with the tittle appearing to be eliminated and the letterspacing changed. So I agree that the final image was graphically edited or manipulated, but I'm not sure how.<p></p>
