    votes: null
    html: <p>It’s difficult to tell from your photo whether or not the legs of the R and completely straight or slightly curvy, which would be helpful in determining the precise face used—although it’s also quite possible that the entire display was either silkscreened or hand-painted, in which case the lettering may simply be a stencil-cutter’s/letterer’s fantasy.</p>
  - id: 512158
    user: 13298
    date: 2012-06-05T13:38:00
    date_raw: 5 Jun 2012 — 1:38pm
    votes: null
    html: <p>Thanks for responding. Indeed, I'm not certain that this particular sample corresponds exactly with any particular production typeface. Nevertheless, I'd be very grateful for any leads on similar production faces—with either curvy or straight-legged Rs.</p>
  - id: 512160
    user: 6470
    date: 2012-06-05T13:57:00
    date_raw: 5 Jun 2012 — 1:57pm
    votes: null
    html: "<p>Close, but no cigar: Gill Sans, Granby and Ludlow Tempo...</p>"
  - id: 512161
    user: 13298
    date: 2012-06-05T14:05:00
    date_raw: 5 Jun 2012 — 2:05pm
    votes: null
    html: <p>Thanks! Ludlow Tempo seems pretty close, especially because the center of the M reaches all the way to the baseline. The only electronic versions that I've found so far are condensed, however.</p>
