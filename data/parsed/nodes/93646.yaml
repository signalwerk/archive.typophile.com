    <p>I've seen this typeface or something very similar in old textbooks that probably date from the thirties or forties. I like it a lot but never knew the name of it. Then, when I saw it again on a poster at a historic mill, it occurred to me that you capable folks could probably identify it in an instant. Can anyone help me out? My apologies for the poor image quality. I didn't have my camera with me, but I was able to track down a photo of the same poster online.</p>
    <p>Many thanks in advance.</p><div class="imageWrap"><img src="http://typophile.com/files/Mill_3615.jpg"></div><p></p>
