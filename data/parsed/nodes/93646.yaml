    html: |-
      <p>Thanks, that's another good option. I'll check my copy of American Metal Typefaces of the Twentieth Century tonight, but I think Ludlow Tempo is going to end up being the closest match. I searched the forums here and it sounds like uncondensed versions of Tempo have yet to make the digital transition. Which is a real pity, in my opinion.</p>
      <p>Edit: Here's a shot of Tempo Bold:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/TempoBold_3900.jpg"></div><p></p>
      <p>It doesn't seem to be an exact match (the S looks a little different, for one thing), but it is awfully close.</p>
