      <p>This excerpt: </p>
      <p>The typographers who created the Schwabacher font in 1481 picked up this style and included a small “e” above their vowels in the type case. This simplified into a little open “o” in some font designs. The double dot likely originated from a long script “e” that looked like two loops in handwriting and eventually became the standard symbol for the umlaut.</p>
      <p>from:</p>
      <p><a href="http://clicknation.com/snoof/stuff/umlaut.pdf" title="http://clicknation.com/snoof/stuff/umlaut.pdf">http://clicknation.com/snoof/stuff/umlaut.pdf</a></p>
