      <p>Paul Antonio<br>
      <a href="http://www.PaulAntonioScribe.com" title="www.PaulAntonioScribe.com">www.PaulAntonioScribe.com</a></p>
      <p>There might be another reason for the little 'e' shaped umlautt! In Seutterlinschrift the shape over the 'u' to distinguish it from the 'n' and 'm' (lower case) is a harken and it is like a slightly exaggerated comma.</p>
      <p>In looking at the little 'e' shape it seems to me that it might have originated in the handwritten form as most of these things are.</p>
      <p>A little comma is interesting in that a daub with the nib of the quill would create a dolop of ink from which to pull the tail of the comma but if the nib was cut for square pen scripts then the ink might not readily flow and so would need a lead-in stroke/serif to initiate the flow of ink. If you start with the internal cross bar of the 'e' this then up and over, around and down would quite happily create an 'e-like' shape.</p>
      <p>The existence of 2 'horns' on this like of 'e' could then lead to some interchange with 2 dots as the horns would look like 2 dots! But this mainly in the formal Fraktur and not the more rounded Schwabacher!</p>
      <p>What do you think?</p>
      <p>Paul</p>
