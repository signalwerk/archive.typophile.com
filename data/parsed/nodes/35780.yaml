      <p>Another excerpt from the link above:</p>
      <p>English is promiscuous in its pronunciations: the classic “tough, cough, bough, though, through” with its variations of silent letters and dipthongs. Germanic languages are much more regular. The umlaut properly speaking is a sound, as well as the symbol for the sound. The umlaut (literally “around sound”) is a vowel that is pronounced differently because once upon a time it was followed by another vowel. The old vowel no longer appears in the word, but it still affects the remaining vowel. This process is also called vowel mutation. So the sound caused by ai, oi and ui mutated into umlaut ä, ö, and ü, alternatively written as ae, oe, and ue. A German example is the word mann (man in English), pronounced like “mahn,” becoming the plural männer (men), pronounced much closer to “mainer.” English has some Teutonic roots through Anglo-Saxon and the umlaut mutation explains how the plural of mouse is mice, tooth is teeth and goose is geese.</p>
