      <p>Yes, that makes sense. ä and æ have something in common, both show some kind of combination of a and e. But this does not necessarily have anything to do with them denoting similar sounds (although they are indeed similar in German 'ä' and Danish 'æ'.<br>
      Also, there are different ways of describing sounds (most commonly, the IPA is used, see <a class="freelinking external" href="http://en.wikipedia.org/wiki/Double-sized_IPA_vowel_chart" rel="nofollow">Wikipedia: IPA vowel chart</a>.<br>
      Moreover, on the German keyboard layout on the Mac, ä and æ are positioned on the same key, only æ can be accessed with the alt modifier key, so they must have something in common ;-)</p>
