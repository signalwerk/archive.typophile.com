      <p>Paul,<br>
      while it seems possible from a graphic/chirographic point of view, I don’t think that your idea is of any relevance due to the <em>linguistic</em> necessities of the German language.<br>
      In Suetterlin (and of course, also in earlier instances of "German" Kurrent handwriting systems – your argument would also be historically out of place as Suetterlin was a creation of the 20th century whereas the first printed Fraktur types with this kind of e-shaped umlaut may date from as early as the 15th century) any u is written with this small mark, and any umlaut is written with two small dots or strokes. There is no connection between the two strokes, and if there were one because of casual writing, any reader would easily discern whether ü or u were denoted depending on vocabulary and therefore context of the letter. The same would apply if one wrote a Suetterlin u with a e-shaped u-mark as you suggest.<br>
      To sum up: My main concern with your idea is that an u is not an ü.</p>
