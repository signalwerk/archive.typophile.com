      <p>Arjen,<br>
      the German Wikipedia has an <a href="http://de.wikipedia.org/wiki/Umlaut" rel="nofollow">article on Umlauts</a> that describes the possible evolution of ae &gt; æ &gt; a with superscript e written in some kind of German script [see <a href="http://en.wikipedia.org/wiki/S%C3%BCtterlin" rel="nofollow">Sütterlin</a>] &gt; ä.<br>
      Of course, there may be other explanations to the same phenomenon, e.g. the e getting smaller and smaller in medieval script or the like.<br>
      These Umlauts were quite common in Fraktur types of all origins, also up to the 1930s (though not necessarily in all blackletter types).<br>
      My example is from J.J. David, Gesammelte Werke, München und Leipzig R. Piper u. Co., 1908:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/umlauts_5486.jpg"></div><br>
      Probably you'll find out the printer of the "Dieterichs Buchhandlung" in Göttingen around the time of publication, or you start looking for other books published in the 1820s. Maybe you can get closer to your "what's the typeface" answer that way…<br>
      Good luck, Stephan<p></p>
