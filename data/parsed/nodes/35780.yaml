      <p>Paul, I presume you refer to this part:<br>
      <cite>Originally, phonological umlaut was denoted in written German by adding an e to the affected vowel, either after the vowel or, in small form, above it. (In medieval German manuscripts, other digraphs could also be written using superscripts: in bluome ("flower"), for example, the &lt;o&gt; was frequently placed above the &lt;u&gt;.) In blackletter handwriting as used in German manuscripts of the later Middle Ages, and also in many printed texts of the early modern period, the superscript 	&lt;e&gt; still had a form which would be recognisable to us as an &lt;e&gt;. However, in the forms of handwriting which emerged in the early modern period (of which Sütterlin is the latest and best known example), the letter &lt;e&gt; had two strong vertical lines, and the superscript &lt;e&gt; looked like two tiny strokes. Gradually these strokes were reduced to dots, and as early as the 16th century we find this handwritten convention being transferred sporadically to printed texts too. </cite></p>
      <p>To me it makes absolutely sense that a "superscript-e" was used to express a change in pronunciation. Especially because a similair "sound" is written as æ in Danish. Could there be any relation between those two glyphs?</p>
