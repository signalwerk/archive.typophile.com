      <p>Just for the record, the primary/initial/original form of the umlaut was the superscript e. In the inital years of German print, both in fraktur and antiqua you'll find it solely. In print however it was replaced by double dots pretty soon. The latest you could find O WITH SUPERSCRIPT E for umlaut in Antiqua would be (cca.) early to mid 18th century.</p>
      <p>The argument of Sütterlin is really highly anachronistic, though similar mechanisms might have influenced the coice of diacritic when replacing superscript e.</p>
