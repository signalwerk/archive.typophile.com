comments:
  - id: 42509
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>I think the problem here is that the writer is misusing bullet points. These should highlight *short* lists. It is absurd have a page full of bullets, as they no longer highlight anything. I think they will look bad wherever you put them.  <br> <br>I think the bullets need to go. Then you can try a variety of solutions, such as having the titles bigger or bolder and the list as is, indented without the bullets, with items separated by extra leading. Or have the lists with hanging indents, no bullet, etc.    </p>
    html_clean: <p>I think the problem here is that the writer is misusing bullet points. These should highlight *short* lists. It is absurd have a page full of bullets, as they no longer highlight anything. I think they will look bad wherever you put them.  <br> <br>I think the bullets need to go. Then you can try a variety of solutions, such as having the titles bigger or bolder and the list as is, indented without the bullets, with items separated by extra leading. Or have the lists with hanging indents, no bullet, etc.    </p>
  - id: 42510
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>I would try hanging the bullets outside and making them a stipple maybe 40 or 50% black? This way they are there � and I'm assuming the client wants them � but they will not distract as much from the page or ruin the strong lines of the text blocks.</p>
