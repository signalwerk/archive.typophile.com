  html: '<p>hello all <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I am setting a brochure where both of the two text columns of an A4 page are almost filled with bullet points. My dilemma is this: do I hang the bullets outside the margin or not? Opinions on this matter are appreciated! <br> <br><a href="http://www.stereotypography.com/bullets.jpg" target="_blank">http://www.stereotypography.com/bullets.jpg</a></p>'
