    html: <p>I'd suggest no bullets and more spacing between each paragraph instead. Bullets used like this typically distract from the content. <br> <br>All that said, when I use bullets, they don't hang outside of the main body margins. I consider them 'sub-points' to the main text, and, like in an outline, need to be indented to show hierarchy.</p>
