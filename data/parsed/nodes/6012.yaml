    html: <p>BTW I agree with William. It is absurd to have this many bullets on the page. It can show a lack of ability to write short concise copy using proper English. <br> <br>You could mockup a page with bullet points turned into paragraphs to show that you will have a greater economy of space � possibly saving $ on printing!</p>
