      <p>typequake and timd, I think the confusion is that on the eastern side of the pond, there's not a categorical difference betwixt thesis and dissertation.  On the western side, thesis is for Masters, and dissertation is for Doctorate, and generally for Bachelors whilst occasionally called a thesis as well (much to the chagrin of Masters candidates, as BA "theses" are rarely more than about 20-25, the average term paper for MA students), it's often called an honours research paper or something to that effect.  In HS it's often that or an "extended essay" as I believe the IBO's terminology is.</p>
      <p>One thing that has always interested me that you might be able to work in to, especially if you're a fan of RRT or Stylistics/Narratology is perhaps looking at the effect of typeface on readers in books or advertising.  Take a genre (thriller novels, beauty product adverts) and examine the fount choices.  Back during the <em>vanguardia</em> of Latin America, one of the primary theoretical break-throughs was breaking the quality of the text into three distinct qualities:</p>
      <ul>
      <li>Semantic</li>
      <li>Phonetic</li>
      <li><strong>Graphic</strong></li>
      </ul>
      <p>That is to say, while traditionally only the semantic quality had been looked at and/or used for the creation of poetry (phonetic was only used inasmuch as the poetic required, e.g., creating rhyme or rhythm), but by focusing in on the phonetic, for instance, they were able to create poems that superficially had little to no semantic meaning (aka "gibberish") but had a phonetic quality that was beyond anything formerly written.  The graphic quality gave birth to the concrete poetry that Latin America is so well known for, but it extends beyond the simple arrangement of the words.  (An author that mastered and used all three together is Vicente Huidobro.) For example, in a paper I was writing on electronic poetry, a genre which many established critics are still unsure of, I used Ibarra as my fount, because it was based on old Iberian printing presses.  Subconsciously, the readers of my paper, most of whom would be specialising in far older poetry, say, Garcilasso de la Vega, or Góngora, would instantly relate the older "true" poetry with the electronic poetry on which I was writing.  </p>
      <p>Applying it to modern day advertising or book/pamphlet design could really give you a lot to talk about, and you'd be able to easily fill up 6k words in analyses. </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos.» (La Luz Oscura, por Javier Guerrero)</em></p>
