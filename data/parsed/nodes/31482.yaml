    <p>I am in my 2nd yr of a BA Hons Graphic Design course and was wondering if anyone could give me tips on how to handle the disseratation and what topic taht would be interesting to focus on. It can be based on advertising, branding etc. Anything taht we want. i was thinking of doing advertising and how advertisers target different products at male and female without any regards to gender stereotyping that was an issue in the 1960's and beyond i.e. washing up liquids aimed at women but now, the recent one shown in the UK for Fairy (name of washing up liquid) is the famous chef Ainsley Harriet so therefore, women are not the sole target audience. I have one issue though an taht is for an advertising essay we had to do, i have done it on a product with similar ideas but thsi woulod be in more depth. Do you think that i should leave the idea and choose another because having similar ideas in my portfolio won't do me any good. What do you think? Can you think of anything else? </p>
    <p>Option 2) Should i focus on a a particular brand and its branding including all the advertising campaigns etc and compare and contrast how they targeted their audience before and how they do it now? There HAS to be a reference to the present times so what do you think. I need help.</p>
