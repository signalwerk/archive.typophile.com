      <p>Apologies in advance. This will not be a very constructive post. It boggles my mind that as a second year student, you feel the need to ask typophilers to help with a focus for your dissertation. </p>
      <p>In my area of studies (creative writing) you are expected, by 2nd year, to be able to come up with a thesis and direction for your papers on your own. If nothing else, your studies are supposed to teach you to think critically for yourself, not simply execute a paper based on other people's ideas. The hard part is *always* struggling with the direction and focus and logic of what you want to say. You may get through your degree by asking others to feed you the ideas, your teacher might even not have a problem with you doing so, but this practice will not serve you well in the long run.  </p>
      <p>Sit down, work out a connection or concept or argument you want to make, draw up an outline for your paper, write a thesis statement, and post *that*. You'll get better feedback and you'll be able to say you did the thinking on your own.</p>
      <p>K.</p>
