    html: <p>i'm particularly interested in the relationship between lettering and its immediate context � the building onto which it is fixed/painted/carved. <br> <br>signs and lettering inspired by signs, are beautiful things in themselves, and i think more people are valuing and documenting the diversity and character of vernacular signs, and the vanishing crafts behind them. plus planners, architects and conservation professionals are realising that historic signs are an important part of the urban fabric. <br> <br>but, in this case, i'm not interested in the *intrinsic* value of architectural lettering, but its relationship with the architecture, or in the information it can confer on the associated building.  <br> <br>so stuart,you're bang on when you suggest i 'take a perspective on how the lettering was integrated into the building vs. just slapped on the front'. <br> <br> <br>  <br> <br>  <br> <br> <br></p>
