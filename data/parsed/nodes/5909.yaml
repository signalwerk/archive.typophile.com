    html: <p>The Hoefler Type Foundry (now Hoefler and Frere-Jones Typography) has created custom typefaces based on historical sources for use in New York's Lever House, and Radio City Music Hall. Plus, Gotham was inspired by New York City building signage in general, specifically a sign in the Port Authority Bus Terminal. They gave an interesting lecture on these projects at Typo Berlin in May. You could probably contact them for more information. They know everything.</p>
