  html: "<p>so, i'm writing a short article (1000 word) on typography &amp; architecture to be read by a bunch of building archaeologists.  <br> <br>any ideas? or essential reading? <br> <br>still thinking about it, but it will probably summarise/categorise types of lettering found on buildings (mainly but not exclusively on exterior elevations). some categories that spring to mind are: inscriptions, grafitti, directional signage, advertisements etc. have i left any out? <br> <br>it'll be from an archaeological perspective, so, for example, an inscription could be used to date the building in question, either by content (eg a 'datestone') or even style of the lettering <br> <br>has this has been done before, in a previous article, or is there any point in doing a little piece along these lines? <br> <br>cheers, geraint <br>  <br></p>"
