    html: <p>You might consider artefacts left or trapped in a building. <br> <br>Books, of course. In a kitchen or storehouse, packaging. Many larger buildings had stables, workshops, laundries and bakeries, and kitchens that contained chemicals used for making medicine and cleaning. So look for lettering printed on containers like flour sacks, canisters and bottles. An old wine cellar with a few bottles of 18th century Chateau Rothschild would be a nice find for an archaeologist. I wonder what the label would look like. <br> <br>I have discovered old cardboard boxes (printed) used as insulation. <br> <br>Also, various artefacts (some left by construction workers) in walls and under floors, such as newspapers, cigarette tins, cans, and bottles. Tins for commercial products (especially tobacco) are often reused for storage of small items in workshops. Usually in the basement/cellar. <br> <br>Electrical, gas, heating, plumbing and sanitary equipment may have the maker's ID on it. </p>
