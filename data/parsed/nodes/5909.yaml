    html: "<p>A lot of the Las Vegas signage has a pretty well documented history via a company called Ad Arts in California as well as the YESCO archives may have some insight to the designers of such signs. <br> <br>There is a sign graveyard in Las Vegas I went to a few years ago and they are planning on building a complete sign museum to house these restored signs. A few Google searches will find you there . . . <br> <br>Beyond that, almost ALL of the Googie signage designs in LA came from the architectual firm of Armet and Davis. A lot of the sign designs came from the orthographic drawings presented to clients by the firm. <br> <br>Beyond that, check out any books from Alan Hess who is an architectual historian as well as getting in touch with the LA ModCom who focus on architectual preservation for more deep scoop and limitless information. <br> <br>Beyond that, check out the Letterheads, Sign Muesum in Cincinnatti, and old copies of sign magazines on eBay. <br> <br>You may be surprised to learn how much influence 'pre-fab' plastic injection molded lettering had as materials became cheaper and easier to mass produce and were marketed heavily to the sign making trade. <br> <br>Hope this offers some direction . . . <br> <br>Best, <br>Stuart :D <br> <br>PS: I just re-read your initial post and would also suggest you take a perspective on how the lettering was integrated into the building vs. just slapped on the front. Armet and Davis used different shaped pylons to compliment the lettering.</p>"
    html_clean: "<p>A lot of the Las Vegas signage has a pretty well documented history via a company called Ad Arts in California as well as the YESCO archives may have some insight to the designers of such signs. <br> <br>There is a sign graveyard in Las Vegas I went to a few years ago and they are planning on building a complete sign museum to house these restored signs. A few Google searches will find you there . . . <br> <br>Beyond that, almost ALL of the Googie signage designs in LA came from the architectual firm of Armet and Davis. A lot of the sign designs came from the orthographic drawings presented to clients by the firm. <br> <br>Beyond that, check out any books from Alan Hess who is an architectual historian as well as getting in touch with the LA ModCom who focus on architectual preservation for more deep scoop and limitless information. <br> <br>Beyond that, check out the Letterheads, Sign Muesum in Cincinnatti, and old copies of sign magazines on eBay. <br> <br>You may be surprised to learn how much influence 'pre-fab' plastic injection molded lettering had as materials became cheaper and easier to mass produce and were marketed heavily to the sign making trade. <br> <br>Hope this offers some direction . . . <br> <br>Best, <br>Stuart :D <br> <br>PS: I just re-read your initial post and would also suggest you take a perspective on how the lettering was integrated into the building vs. just slapped on the front. Armet and Davis used different shaped pylons to compliment the lettering.</p>"
