    html: "<p>here is a great example. <br> <br>At the base of the Anglo Saxon tower of St Mary le Wigford Church in Lincoln is a reused Roman tombstone. <br> <br><img src=\"http://www.typophile.com/forums/messages/30/42124.jpg\" alt=\"ertig\"> <br> <br>The orignal, Roman, incription is in the lower part of the tablet. It has been broken down, presumably to fit its new location. I don't have a transcription to hand, but the inscription marked the graves of Sacer, a Roman from Gaul, his wife Cassouna and their son Quintus.  <br> <br>It was reused in this C11 building, with an added inscription to Ertig, who donated money for the building of the church. The translation reads 'Eirtig had me built and endowed to the glory of Christ and St Mary'. <br> <br>Significantly, rather than obliterate the Roman inscription, or use the back of the tombstone, the Anglo-Saxon one has been carved in the apex of the tombstone. <br> <br>more images can be seen here: <br><a href=\"http://rubens.anu.edu.au/raid1cdroms/england/lincoln/churches/s_mary_le_wigford/\" target=\"_blank\">http://rubens.anu.edu.au/raid1cdroms/england/lincoln/churches/s_mary_le_wigford/</a></p>"
