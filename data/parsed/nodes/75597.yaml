  html: |-
    <p>does anyone know if there are conventions for how a font should be credited at the back of a book? (ie, This book is typeset in xxxxxxx).</p>
    <p>I'm wondering if it's common to list the digital foundry of the version used (if there are multiple similar versions out there) and also, if the original foundry should be included (ie, should Akzidenz Grotesk be credited as "Berthold Akzidenz Grotesk"...)</p>
