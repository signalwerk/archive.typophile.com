    html: |-
      <p>A lot of times, the fonts will be listed on the CIP page, along with the book designer, the typesetter, and the printer (or just the line "Manufactured in the United States of America," for example). When fonts are listed here, usually nothing much is said about type -- occasionally, it will include the foundry, e.g.,</p>
      <p>Set in Carter &amp; Cone Galliard</p>
      <p>When more detailed information is given, as Nick says, it would be in a colophon at the back of the book. Sadly, that's a disposable page if required to make even forms. The CIP page is always printed.</p>
