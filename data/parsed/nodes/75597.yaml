    html: |-
      <p>I think that the foundry name should be included when it's a key part of identifying the typeface. For example, one should never write in such a place simply "Garamond" or "Caslon" but include the foundry to identify which version one used, because they are often quite different.</p>
      <p>When it's not critical in distinguishing the typeface, I think it's still a pleasant courtesy, as is identifying the typeface designer.</p>
      <p>Also, any book that identifies the book designer should also identify the type designer(s), however, just as a matter of fairness. Also the jacket designer and/or artist....</p>
      <p>Cheers,</p>
      <p>T</p>
