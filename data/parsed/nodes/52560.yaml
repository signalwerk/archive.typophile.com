    html: <p>This is sad news! From about 1995 to 2000, David Lemon was Adobe's universally admired online type community voice, and since then Thomas has filled his shoes so well. I have been a well-known thorn in his side for most of these years, but as Thomas's technical and institutional wisdom grew with every year, it has become harder and harder to find fault. I do think it's a shame for Adobe to part with someone who has done so much for the company in so many ways, and whose loyalty is so admirable. It is impossible to think of the contemporary online type community without Thomas's unflagging generosity. Very best wishes, Thomas!</p>
