    <p>On German <a href="https://web.archive.org/web/20150123043842/http://www.fontblog.de/entlassung-bei-adobe-type#comments" rel="nofollow">Fontblog</a>, Jürgen Siebert just announced that <a href="/web/20150123043842/http://typophile.com/wiki/Thomas%20Phinney" class="freelinking" rel="nofollow">Thomas Phinney</a> is to leave Adobe.<br>
    If it is true that Adobe cut his job, then – well, I don’t know what to say. That would be sad news for the typographic world.<br>
    F</p>
  html_clean: |-
    <p>On German <a href="https://web.archive.org/web/20150123043842/http://www.fontblog.de/entlassung-bei-adobe-type#comments" rel="nofollow" class="link-external">Fontblog</a>, Jürgen Siebert just announced that <a href="/web/20150123043842/http://typophile.com/wiki/Thomas%20Phinney" class="freelinking link-lost" rel="nofollow">Thomas Phinney</a> is to leave Adobe.<br>
