      <p><em>This makes me worry a lot about the management of one of America’s great companies.</em></p>
      <p>That's capitalism.</p>
      <p>A company with billions in annual revenue and dominant in its field, that has enjoyed a lengthy period of growth and profits, cooly lays off thousands of workers ("everyone's doing it, we're matching average industry rates" according to the boss) when there's a downturn in the economy. Somewhat callous, but sensible business practice apparently, although there are always apologists lamenting that those companies are losing their best and brightest.</p>
      <p>From the employee perspective, loyalty is not reciprocated, but on the up side, it's during recessions that discarded workers form the start-ups that become the kernels of the next wave. I was laid off during downturns a couple of times, long ago before I started working for myself, and it was always a great opportunity.</p>
