      <p>In Thomas’s words (as posted on the OpenType List):</p>
      <p><cite>Hi all,</cite></p>
      <p>Well, I never knew if or when this day would come, but I am leaving Adobe after 11 1/2 years. Adobe HR made me an offer I can't refuse, so away I go. On the plus side, I needed to spend some more time with my family due to my younger daughter's medical needs anyway. I will be looking at consulting, writing and teaching gigs, and perhaps going back to a full time job at some time next year. Let me know if you have any good prospects for somebody with lots of type background/skills and an MBA from UC Berkeley.  :)</p>
      <p>It has been both a great pleasure and an honor to work with so many smart, knowledgeable and decent people in my time at Adobe, and to help make some great typefaces and applications.</p>
      <p>[deleted]</p>
      <p>Regards,</p>
      <p>T</p>
      <p>(End of citation)<br>
      Still, I hope to still see around you in future, T. Maybe at the next TypoBerlin? (Cite tags not working, sorry)</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
