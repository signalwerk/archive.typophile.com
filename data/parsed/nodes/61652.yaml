      <p>I ran your fonts through a test tool, FontQA, and these are the errors that were found:</p>
      <p><em>Some contours have less than three nodes.</em></p>
      <p>CourierPCfB: zero: (x=388, y=392)<br>
      CourierPCfB Bold Oblique: mhook: (x=1163, y=16), rhookturnedsuperior: (x=688, y=529)<br>
      CourierPCfB Bold:	mhook: (x=1149, y=16), rhookturnedsuperior: (x=565, y=529)</p>
      <p>Some composite glyphs have empty components.<br>
      CourierPCfB: zerowidthspace-&gt;(uni0000), zerowidthnonjoiner-&gt;(uni0000), zerowidthjoiner-&gt;(uni0000)</p>
      <p>I believe the last error, the empty components, are responsible for the wrong linespacing calculation. When you delete the empty components from these three glyphs, it should probably work okay.</p>
