      <p>FontLab Studio doesn't seem to like your files, it hangs when trying to import them :(</p>
      <p>Why did you choose .dfont as file format? .dfont is only supported on Mac OS, do all biologists use a Mac? ;) I'd generate the fonts as TTF, these are more widely supported.</p>
      <p>Re. your line spacing problem, have you set the vertical metrics to identical values in all four fonts?</p>
