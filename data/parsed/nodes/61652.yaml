    <p>I'm not a typographer, so bear with me. I posted in general discussion about a variation that I made on a the characters zero, one, and tilde in a typeface. I tried to leave everything else alone. The characters themselves appear fine, but there seems to be a glitch (stray point? reversed curve?) in one of the fonts because the line spacing gets expanded, even during a FontBook preview. </p>
    <p>I am using FontForge, and it doesn't seem to indicate any particular problem.</p>
    <p>Could someone take a look at these and see if the error jumps out at them? Even narrowing it down to which variant is the troublemaker would be helpful. </p>
    <p><em>[Link removed by me]</em></p>
    <p>Thanks!</p>
