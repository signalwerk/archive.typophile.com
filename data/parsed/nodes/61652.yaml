      <p>Thanks Jens --</p>
      <p>I chose .dfont out of ignorance -- was the only option I saw in FontForge that would bundle them together like that.</p>
      <p>I uploaded a TTF set here:<br>
      <a href="http://www.computingforbiologists.org/files/CourierPCfB.ttf.zip" title="http://www.computingforbiologists.org/files/CourierPCfB.ttf.zip">http://www.computingforbiologists.org/files/CourierPCfB.ttf.zip</a></p>
      <p>I didn't set the vertical metrics myself because I started with the full set and just made a few edits. (I only see horizontal in the menu?) That could have been automatically set somehow? At one point I tried connecting an open path with an arc during edits, and it created a big loop out into the netherworld. I think I successfully undid that change, but maybe it altered that vertical setting in the process.</p>
      <p>I also did save them once with a stray point, and maybe that altered things? </p>
      <p>Really appreciate it!</p>
      <p>-Steve</p>
