      <p>Arguably so, but considering that 99% of my intended use would be for either Latin or English, and that the ordinary size capitals (which are provided in virtually all accented flavours) look almost as good with the extra high ascenders as the extra large initial capitals, an [A - Z] limit on the latter is not really any problem.<br>
      I am thinking, though, that the extra large initial capitals might better be coded as a separate feature from the extra high ascenders.<br>
