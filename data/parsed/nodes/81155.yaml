      <p>From <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#2.g.i" rel="nofollow">the spec</a>:</p>
      <blockquote><p>For non-CID fonts, the ordering is independent of the ordering of glyphs in the font. &lt;firstGlyph&gt; and &lt;lastGlyph&gt; must be the same length and can differ...</p></blockquote>
      <p>I took this to mean that that the order of the glyphs was not an issue, that ranges were expanded by simple incrementation of either the alphabetic name or a numeric suffix. Does this differ in FontLab 5, or am I misinterpreting the spec?</p>
