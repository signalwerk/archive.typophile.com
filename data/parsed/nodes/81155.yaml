    html: |-
      <p>Scriptor, </p>
      <p>the accented letters in European languages are no different from the unaccented ones. A German phrase can start with the word "Änderungen" as much as it can with "Angriff". A Polish phrase can start with "Ławnicy" as often as it can with "Lamperia". </p>
      <p>Only including a subset of letters as initial capitals makes as much sense as if you'd include initial capitals for A-K but not for L-Z. </p>
      <p>Best,<br>
      Adam</p>
