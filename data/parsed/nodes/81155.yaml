  html: <p>Does anyone know of a way to enable special initial capitals only when 'salt' is selected? This is for a font that uses the 'salt' feature to produce extra high ascenders as for the first line of text. I know that I can simply include the substitutions for the extra high initial capitals in the 'salt' block, and then use a downstream 'calt' block to supress them whenever any of them might follow another upper case glyph, but that would require an enormous 'calt' block which I really want to avoid. If the OpenType formatt permitted an 'init' block to be subsumed inside a 'salt' block, this would be very easy, but unfortunately that is not permitted.</p>
  html_clean: <p>Does anyone know of a way to enable special initial capitals only when 'salt' is selected? This is for a font that uses the 'salt' feature to produce extra high ascenders as for the first line of text. I know that I can simply include the substitutions for the extra high initial capitals in the 'salt' block, and then use a downstream 'calt' block to supress them whenever any of them might follow another upper case glyph, but that would require an enormous 'calt' block which I really want to avoid. If the OpenType formatt permitted an 'init' block to be subsumed inside a 'salt' block, this would be very easy, but unfortunately that is not permitted.</p>
