      <p>Gargoyle, </p>
      <p>The "ranges" functionality is useful, but not quite so useful. Sure, you can do [A-Z] and [A.init-Z.init], but in the real world, you'd naturally want to make "initial" versions of the glyphs for all uppercase glyphs (both basic English letters and the accented letters with diacritics). In that case, in order for the "ranges" to work, you need to make sure that the glyph order of the "normal" uppercase glyphs and the variants is identical in the font. Defining a normal class that just enumerates all the glyphs by their names is much safer, because you don't need to have the same glyph order in the font.</p>
    html_clean: |-
