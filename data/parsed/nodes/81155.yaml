      <p>To suppress neighboring initial caps in the 'calt' feature, would the following sort of code work in your situation?<br>
      <code><br>
      sub @initialcaps' @initialcaps by @capitials;<br>
      sub @capitals @initialcaps' by @capitals;<br>
      </code></p>
