    html: <p>Those names seem appropriate. The initial cap glyphs would just need to be grouped into a class, and the regular capitals in another class, in the same order. They can be defined like you showed using <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#2.g.i" rel="nofollow">ranges</a>, presuming every capital has an initial form. If you have any additional initial forms such as accented capitals, they can be added individually inside the brackets after the range.</p>
