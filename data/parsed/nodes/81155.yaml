    html: <p>The regular capitals in the font include all the accented variants for most European languages, but the initial capitals are really only for the first glyph on the first line of a page, and coded as part of salt feature, so they only include the unaccented [A - Z] forms. They are the same height as the extra high ascenders which are also only for first line use, so I do not want to increase the height any more, nor do I see any real need to observe accents in decorative forms that function in a way similar to drop caps.</p>
