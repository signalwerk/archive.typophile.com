    html: |-
      <p>Scriptor, </p>
      <p>I don't quite follow what you mean by "salt" block or "calt" block. </p>
      <p>OpenType Layout works in the way that you define some lookups, and assign it to some features. Then, the OpenType Layout engine either applies some features automatically, or only upon user's discretion, to the entire text run, or (for some specific features) only in a particular context determined by the engine. </p>
      <p>For example, "init" is only applied to the first glyph in a word. "calt" is applied to the entire text run, and is typically on by default. "salt" is applied to the entire text run as well, but is off by default. </p>
      <p>You can assign the same lookup to multiple features, and the OpenType spec doesn't restrict you from performing any types of lookups within any features. You can use contextual substitutions in "salt", or non-contextual substitutions in "calt". You can use contextual or non-contextual substitutions in "liga" or "smcp" or whatever. Sure, it's not a good idea to confuse the font user by making features do something that the user doesn't expect. So a "smcp" feature that would substitute lowercase glyphs with variants that have long ascenders would be confusing — but there is nothing in the world to stop you from doing that. </p>
      <p>But you're most certainly are not restricted from using contextual lookups in the "salt" or "ss01" features —&nbsp;if that's what works well with your font. </p>
      <p>Best,<br>
      Adam</p>
