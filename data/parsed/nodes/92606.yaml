    <p>We are pleased to announce that the expected sans serif counterpart to the award-winning <a class="freelinking external" href="http://www.type-together.com/Adelle" rel="nofollow">Adelle</a> is here.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/adellesans_3_3990.gif"></div><p></p>
    <p>This sans serif proposes a cleaner and more spirited take on the traditional grotesque sans. As typical with TypeTogether fonts, the most demanding editorial design pieces were taken into consideration when engineering <a class="freelinking external" href="http://www.type-together.com/Adelle%20Sans" rel="nofollow">Adelle Sans</a>.  The combination of its lively character and unobstrusive appearance that is inherent to grotesque sans serifs make it an utterly versatile tool for any imaginable graphic application, whether it is branding, signage or advertising. Without any doubt, the key word behind Adelle Sans’ design is flexibility.</p>
    <p><a class="freelinking external" href="http://www.type-together.com/Adelle%20Sans" rel="nofollow">Adelle Sans</a> is available in seven weights with their matching italics. Each one of these 14 styles is a perfect match in terms of weight and vertical proportions to its slab serif equivalent. This ensures a graceful fit between both font families in the same block of text, and a subtle, but noticeable, change of texture when used at similar point.</p>
    <p>The 900 character set includes typographic niceties, small caps, several sets of figures, and support for over 90 languages. It also includes a set of 35 icons specially designed for electronic publications.</p>
    <p><strong>more information:</strong> <a href="http://www.type-together.com/Adelle%20Sans" title="http://www.type-together.com/Adelle%20Sans">http://www.type-together.com/Adelle%20Sans</a></p>
