  html: |-
    <p>Wondering what are some fonts that are often used for movie posters or title cards.<br>
    I seem to keep seeing the same ones used again and again and interested what they are.</p>
    <p>If you can name the font and a movie that it was used in that would be ideal - or even more amazing - attach an image of the poster with the font(s) used.</p>
    <p>For example: The font used in 'Prince of Persia' (both 'defy the future' at the top of the poster and the title font) seems like they're used all the time in movies. (I think they're just helvetica.)</p>
