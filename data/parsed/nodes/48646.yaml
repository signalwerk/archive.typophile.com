    html: |-
      <p>In theory, "in theory" motives work. In practice...</p>
      <p>I'd make the ordinals based on majuscules, just because they'd fit in. Don't just scale existing glyphs, though. Gotta look good. Imagine a headline title (in all caps) about "La 1ª Mujer que ha hecho..." (I'm assuming you're also doing numerals). </p>
      <p>That brings up another thing...would you want oldstyle numerals with an all caps font? Hrm...I could see them working if they're as tall as the capitals, with the descenders/ascenders going below/above the letters...sorta. I'd have to see it in practice to know whether or not I'm crazy here.</p>
      <p>Peace,<br>
      JT</p>
