    html: |-
      <p>I've seen it done both all caps like:</p>
      <p>The all caps variations I would see for JT's example, "La 1ª mujer" would be:</p>
      <p>LA PRIMERA MUJER<br>
      LA 1A MUJER<br>
      LA 1ª MUJER</p>
      <p>In order I prefer the top, bottom, and middle.  A raised capital A is interesting, though I've never seen it used, the lowercase version is perfectly acceptable.  If it looks good though no reason not to include it tho :)</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
