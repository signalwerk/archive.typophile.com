    html: <p><a href="http://www.telegraph.co.uk/arts/main.jhtml?xml=/arts/2002/09/29/bojon29.xml">David Jones</a> was an anglo-welsh poet, painter, engraver, also known for his painted inscriptions. He fought in the First World War, about which he wrote <i>In Parentheses</i>, and was one of the many British converts to Catholicism in the 1920s. He spent time at a couple of Eric Gill's guild communes, and was for a time engaged to Gill's daughter Petra, but found the solitary life better suited to his temperment. I love his stuff, especially his woodcuts. I'm afraid I can't remember the exact source of the quote about working within the limits of one's love; it is probably from one of his essays or from his letters.</p>
