    html: <p>I'm late to this post but... <br>The phrase "no money" needs to be put within context. <br>My hunch (purely speculation of course) is that the phrase is most often uttered by those with a traditional view of money and the act of accumulating it. The "no money" in this case may be just be shorthand for, "not a fortune". Many people (understably so) start businesses for the sole purpose of accumulating the most amount of money into a single location (traditional view).  <br>Type design, as you might guess, doesn't fit nicely into this category. A product that may potentially take years to produce with no guaranteed profit??? Yes!!! Sign me up!  <br>There is money in type design. Just not a fortune. <br>Getting started is another issue...</p>
