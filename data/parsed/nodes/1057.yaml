  html: "<p>I was listening to the radio the other night. A musician  <br>was talking about making music. He sounded a little out <br> of it, he was rambling a little, but had a good point to <br> make. He mentioned the state of pop music, the rigidly <br> enforced planned obsolesence of it and how his music  <br>was trying to be as honest as possible. Authentic. He  <br>then said (bear with me) something like this: \"I mean, it  <br>shouldn't be about the money, the profile, the cd  <br>packaging marketing and cool music videos. It is about  <br>the art, because at the end of it all, it is all we leave  <br>behind. Honest art.\" <br> <br>I thought immediately of type, specifically of type  <br>design. What is the attraction of a largely thankless  <br>task appreciated by few yet exposed to many? I think I  <br>am hooked because it can be honest. Other people  <br>can use your type, and something very real and  <br>useable is 'left behind'. It is inherently narcissistic. It  <br>would be nice to know for everyone else: why? <br> <br></p>"
