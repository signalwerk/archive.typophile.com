    html: <p>Hi, to be honest, I am an addict, when it comes to type. I could lock myself up in the mountains, with my computer and make type all the time. And to the tempo I want. But I don't.... (I have a kid and a partner). <br> <br>I would be a liar, if I said, I wouldn't want to make money with it. But I am realistic enough to know, that if I wanted to make bucket full of it, I'd have to change a lot. Not only in the way my type should look like, but also structural. I mean, at the end, wether you sell type or graphic, you'll need to find a way to get to your potential customer. You can sit and wait till everyone notices how supperb your designs are, but this might take a while. But you can also try to get anyones attention by any means like advertisement, lobby, connections, internet, whatever. (Having peoples attention doesn't mean your good in making faces, but it might mean you're good in getting attention, which is a gift) You'll need a lot of energy to do this as well. And time. <br> <br>Because mostly, you won't make big money with type when you start, you probably will do something else for a living. So you will do your type thing during in those late nightly hours and weekends. <br> <br>I think, the biggest issue is time. To make a decent typeface, you need time. To make more, you more time. To sell it, too.. So it comes down to how you manage your time (and your working methods) and what your priorities are. <br> <br>--jacques</p>
