    html: "<p>There's no magic formula, but I'd say you either have to: <br>1) Find an under-served niche market. <br>2) Toil away for many many years (and not too much money) and build a great rep. <br>3) Be extremely talented. <br>4) Be extremely lucky. <br> <br>I think the hope many of us from the \"horde outside\" have is that we can do type design part-time for some years (and little money), elaborate our moderate talent and skills, and eventually have a decent-enough rep to at least pay for our time. And maybe get a lucky break now and again. <br> <br>In my case: I did #1 until it dried up, I have no patience for #2, and although I think I'm luckier than average my talent is certainly not huge. So I'm not expecting to make a lot of money in type any time soon. If I manage to persist -but only while I continue enjoying it- maybe one day I can make a living at it. Life is too short. <br> <br>hhp <br></p>"
