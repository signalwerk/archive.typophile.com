    html: "<p>I'm in this business for exactly one reason: I love type. <br> <br>Now, the question of how feasible it is, in general, to make a living at type design is a good one. I originally got into type wanting to be a full-time type designer. I contacted a couple of eminent folks to ask where one could go to learn about type. Both Chuck Bigelow and Robert Brunghurst were kind enough to carry on a bit of correspondence. Both of them suggested that there was little likelihood of making a living at type design. Now, I ignored that part of their advice, but I took it to heart as well, and it made me work that much harder. <br> <br>I should add that today I agree with them. I know quite a few type designers, and except for the very biggest names, and some employed by the large type foundries, most don't make a living at type design. They teach, or do graphic design, or other stuff to make money, and do type design because they love it. <br> <br>I'm lucky enough to work for Adobe, and get to do fun type stuff and get paid quite well. Once in a very rare while I've even gotten to do some type design. But there are few jobs like this, and even fewer that involve actual type design, that like Bigelow and Bringhurst I find it hard to encourage people. <br> <br>My actual advice is this: <br> <br>- Decide if you could be happy doing stuff other than original type design per se. If so, there are about 5x as many opportunities. I didn't go in with this intent, but it worked out pretty well for me. <br> <br>- Make your own luck. This means three things: working hard as heck at your craft; going out of your way to pick up related specialized skills; spotting and exploring potential opportunities. This was a big part of how I ended up with a real paying job in type. <br> <br>- Learn programming. Somebody with a BSc in computer science who is also heavily into type is probably more likely to find a decent-paying type job than somebody with an MFA in design. (At least, that's my perspective.) It will also give you skills that will be incredibly useful in type production. <br> <br>Anyway, that's my two cents. <br> <br>Regards, <br> <br>T</p>"
