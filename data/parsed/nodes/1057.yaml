    html: <p>I am not sure of typography in its' present state. I have recently discovered a version of a Latin Alphabet in transition among stone cutting in Finland. It clearly is evidence of a culture, independent of the others, finding its' own place in its' own world in a country with its' very special tongue. <br> <br>Now that is gone, and probably my discovery is just one of many to be discovered all of them now dead. Why would it not be? All of them, just like in Finland, gone, gone, gone.  <br> <br>Typography has become a model of conformity to the false goodness of globalization which is clearly debasing cultures not merely of the tongue. <br> <br>Typography should slow down. Look backwards. <br> <br>I am not convinced that language, of which typography is part, should abrogate its <br>responsibilities to become merely servants of commerce and fashion. To further the insatiable appetites of corporatism. My life long participation in typography was motivated by art and literature. I would prefer to leave the selling hambugers to others. <br> <br> <br>Gerald Giampa</p>
