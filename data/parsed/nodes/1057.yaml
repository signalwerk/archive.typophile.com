    html: <p>Money, groupies <i>and</i> hamburgers! Count me it!! <img src="http://www.typophile.com/forums/clipart/wink.gif" border="0"> <br> <br>My wife claims I am a compulsive perfectionist. She may be right. Rarely in my occupation (graphic design) do I create anything that is completely satisfying. The clients gets overly involved, the supplied photos are bad, the printer screws up, the paper is too thin, etc.  <br> <br>I believe font design is something you do for yourself first and foremost. You have the opportunity to create something simple and pure...and perfect! If your goal out of the gate was to generate income, I don't believe your font design would be very inspired. </p>
