    html: <p>Kris <br> <br>Hrant is right about this. <br>1) Find an under-served niche market. <br> <br>Niche Market, quality type = quality buyers. <br> <br>There is also money is consumer fonts. There are examples in the industry where studios have so much money you would think you died and went to heaven. <br> <br>Go visit David Burlow. That man and his brother Sam are rolling in "green backs". The key to success in the font business is to have a "good business model" without that you are wasting your time. <br> <br>I would use myself as an example, but I had a different model, but keep in mind, I retired when I was 44 years old. Came out of retirement within the last nine months only because of an uninsurable act of god. Wonder why you have not heard of me. That's right, think early retirement.  <br> <br>Gerald Giampa <br> <br></p>
