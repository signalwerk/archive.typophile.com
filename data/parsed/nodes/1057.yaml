    html: <p>The original crack about money was a bit of a joke, but a steady income helps keep the love alive. And I'm often suspicious of people who push the 'You should do it for the art' line, because this often leads to 'Can you do this job for free?' <br> <br>One of my heros, David Jones, wrote that we should try to work within the limits of our love. This is probably what separates the craftsman from the wage labourer. Yes, I work to make money, but I'm privileged to be able to do it at something that I love. I wish everyone on the planet could say the same thing.</p>
