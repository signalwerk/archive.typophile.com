    html: <p>I would really like to know how money can be made in  <br>this profession. It may sound terribly na�ve, but I gather  <br>the only way is to start a foundry and sell typefaces,  <br>slog away and hope for a commission. My na�vety is  <br>tempered by age and the numerous comments by  <br>advertisers and garphic designers in the industry that  <br>assure me that there is, indeed, "no money in type". I  <br>have never been worried about the accumulation of  <br>wealth and transient consumer rubbish, but I am,  <br>naturally, worried about food in mouth.  <br> <br> <br>I have only just realised that I can quite happily devote  <br>many more of my years to type, so these questions are  <br>quite releveant. Thanks for the responses - they are  <br>very insightful, especially "working within the limits of  <br>our love".  <br></p>
