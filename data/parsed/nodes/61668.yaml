    <p>I am looking for some info on arabic keyboard layout. Is there any standard that it follow or why certain chars are put in certain places. </p>
    <p>I am currently involves in designing a keyboard for "jawi", a script for malay language that use arabic with 6 additional characters. there are many design for jawi keyboards, but we are looking at a way  to standardize the layout for general users.</p>
