      <p>I guess it all depends on what user you have in mind, in the short term, mid term and long term.<br>
      If you have a long term user in mind, go for the most logical, fast and complete layout for the language. It will not become popular anytime soon but it is the right thing to do.<br>
      For the short and mid term, particularly if the user familiar with English keyboard layout is in mind, and someone who does not use the layout full time, a phonetic mapping on QWERTY English is more practical.<br>
      We made a QWERTY Persian keyboard layout for Mac which was an instant hit among Iranian Mac users, almost all of them residing abroad. But for the use of a nation, efficiency and completeness should take the priority.<br>
      Persian has a government standard based on keyboard layout used on MS platform which itself is a derivative of MS Arabic layout. So I don't have to be worried about the Persian standard.<br>
      btw thanks hrant for the info. Now I know who to blame for this awful awful Persian standard :-)</p>
