      <p>In the dark ages (when the only way to know what other "exotic" type designers were doing was call people, get some names, then call those, ad continuum - something I never did) I designed my own keyboard layouts for Armenian, Arabic, Hebrew, Cyrillic, Vietnamese, and who knows what else. Assuming there really is no standard* you can go about this in one of two ways: either shoot for making novices comfortable, or making professionals efficient. The former involves mapping the letters to the closest equivalents on the Qwerty keyboard. This is not as hopeless as it seems, even for something like Arabic (or Jawi). The advantage of a phonetic mapping is quick and pleasant pickup by all users. This is what I did for Armenian in the 80s** since back then people -especially Armenians- were still afraid of computers to begin with; even today it helps gentle souls get in on the game. In contrast the latter approach involves making typing efficient*** by arranging the letters very thoughtfully according to frequency and frequency of <em>sequence</em> (like putting "t" and "h" so that you can type them quickly, not putting much where the left pinkie is, etc.). This is of course a lot more work, and because it requires much more memorization from the get-go it causes a lot of people to complain, and some people to give up. The good news is that these days you can do <em>both</em>, and give each user a choice.</p>
      <p>* And if there is, assuming it's not a disaster.</p>
      <p>** This layout I made ended up in Windows XP, although I'm still trying to get at least a credit for that... I'll be making some determined moves towards that end at this year's ATypI conference.</p>
      <p>*** Although we know what happened to the Dvorak keyboard...  :-/</p>
      <p>hhp</p>
