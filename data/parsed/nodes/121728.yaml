    html: |-
      <div class="comment-spam-body"><p>Jeff, if you don't mind me questioning your reasoning just a bit, I'm not so sure that an obscure historical tie-in between medicine and a typeface would be noticed or appreciated by anyone viewing the website. You might, on occasion, have the opportunity to tell someone that you were using the same typeface as, say, JAMA used in the 1890s. That person would then nod his or her head in appreciation, but really, no one else will ever notice.</p>
      <p>Much more important is using a typeface that reads well on a computer, smartphone or tablet display and that looks professional in a way that seems appropriate for the scientific lab in question. To me, a nice, clean sans-serif would make a more professional, scientific and forward-thinking impression than a typeface that might have been commonly used in the 1800s. I definitely wouldn't compromise readability for the sake of style — for headlines, maybe, but definitely not for text.</p>
      </div>
