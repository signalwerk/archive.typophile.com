      <p>Scotch Modern in a nice font, but I'm not sure Jeff why you want a font with historical links to medicine. I could understand if you were making an old-fashioned-looking medicine label, but a modern lab website? </p>
      <p>I could see using them in the logo — maybe, if that projects the image your lab wants to convey (which I doubt) —&nbsp;but for text fonts I'd think you'd want fonts that were more associated with a modern scientific lab.</p>
