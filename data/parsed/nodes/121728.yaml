    <p>Hello,</p>
    <p>I'm working on a website for a scientific lab within an academic medical center, and I'd like to choose a typeface that has some historical link to hospitals or medicine. I'll need typefaces for paragraphs of text as well as headings, and any references would be much appreciated!</p>
    <p>Regards,<br>
    Jeff</p>
