    <p>Hello all,</p>
    <p>Sorry if this is a little vague, but I am looking for examples of lettering created from a continuous line. For example, sometimes you will find a word written with "rope" or "string." Or I think Paul Rand created a couple logos in this fashion. If you could direct me to any examples it would be much appreciated.</p>
    <p>Here is an example, but note that it does not have to be rope, or any recognizable material. I think the main thing I'm looking for is a continuous strand with the suggestion of three dimensionality.</p>
    <p><a class="freelinking external" href="http://www.usps.org/localusps/captree/images/Captree-Rope-Type.gif" rel="nofollow">http://www.usps.org/localusps/captree/images/Captree-Rope-Type.gif</a></p>
