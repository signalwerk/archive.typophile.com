    html: |-
      <p>Adobe donated the basic styles of Utopia, Bitstream donated the basic styles of Charter and Courier, and URW donated the basic styles of Nimbus Sans, Nimbus Roman and Courier to various open-source projects under pretty flexible terms. Quite a few derivative designs have legitimately emerged from these donations. </p>
      <p>I should note though that if you want a serious Cyrillic Charter, you should get the one designed by Vladimir Yefimov and published by ParaType rather than the one that comes with Charis, which is rather hideous. </p>
      <p>A.</p>
