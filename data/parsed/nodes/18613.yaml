      <p>It seems to be.<br>
      This accompanies the Bitstream Charter fonts:<br>
      <em><br>
      (c) Copyright 1989-1992, Bitstream Inc., Cambridge, MA.</em></p>
      <p>You are hereby granted permission under all Bitstream propriety rights to use, copy, modify, sublicense, sell, and redistribute the 4 Bitstream Charter (r) Type 1 outline fonts and the 4 Courier Type 1 outline fonts for any purpose and without restriction; provided, that this notice is left intact on all copies of such fonts and that Bitstream's trademark is acknowledged as shown below on all unmodified copies of the 4 Charter Type 1 fonts.</p>
      <p>BITSTREAM CHARTER is a registered trademark of Bitstream Inc.<br>
      </p>
      <p>People at SIL have added a lot of characters needed by many minority languages. These fonts allow missionaries under the auspice of organisation affiliated with SIL to translate and publish in the those languages, but most importantly it gives the people themselves better access to orthographies of their languages.</p>
