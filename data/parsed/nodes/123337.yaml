    html: |-
      <div class="comment-spam-body"><p>The font was designed by F. H. Ehmcke for the Flinsch foundry in 1908. Bauer sold it as Ehmcke. Stephenson Blake also sold it, or a very similar version, as Carlton.<br>
      FWIIW I prefer the digital version produced by Hoefler.<br>
      Don</p>
      </div>
