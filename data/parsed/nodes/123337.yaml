    html: |-
      <div class="comment-spam-body"><p>AFAIK this was originally a font made by Hoefler for the Mac and its appearance in the PC world was the result of people using Transtype rather than a publication by Hoefler.<br>
      As for legitimate use on a PC this would seem to depend on obtaining permission from Hoefler .<br>
      Don</p>
      </div>
