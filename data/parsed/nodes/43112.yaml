      <p>I’m with the general opinion, the other texts are too tiny in proportion. Even the “skin care” looks too small. Try previewing in really small sizes, it will give you a better sense of proportion.</p>
      <p>If you’re looking for something that goes nicely with Baskerville, try an Italic from a Serif type, I’d suggest Adobe Garamond Pro Italic, I find it really nice.<br>
      A sober, soft sans may also work great, and add a spicy contrast, I’d suggest Myriad Pro, if you don’t mind it’s popularity.</p>
      <p>I would say the line spacing between “olivia” and “trevino” is too small, as well as the spacing between the leaves and type. Just a little bit.<br>
      How it would work with no dots in the “i”s at all, or lowering them a little?<br>
      Can the “T” in “Trevino” use a similar treatment as the “O”, I mean, be shorter?</p>
      <p>Regards,</p>
      <p>__________________________________________________<br>
      <a href="http://www.gabssnake.4t.com" title="www.gabssnake.4t.com">www.gabssnake.4t.com</a></p>
