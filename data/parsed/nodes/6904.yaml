  html: <p>Hi Folks, <br> <br>I'm looking for instances of where lower case " i " is earmarked by "diamonds." It can be serif / sans/ decorative, etc. <br> <br>I am aware of Granby, Cable, Kable, and some cuts of Goudy. <br> <br>ANY help would be (and is ) GREATLY appreciated.  Blessings, geo.</p>
