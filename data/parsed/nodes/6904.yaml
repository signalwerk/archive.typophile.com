    html: "<p>A number of Venetian revivals, including <a href=\"http://www.myfonts.com/fonts/linotype/jenson-classico/?PREFS_SET%5BRenderSize%5D=72&amp;PREFS_SET%5BRenderString%5D=i\">Jenson Classico</a>, <a href=\"http://www.myfonts.com/fonts/bitstream/iowan-old-style/\">Iowan Old Style</a>. <br> <br>Some of the Old English fonts, like <a href=\"http://www.myfonts.com/fonts/scriptorium/collins-old-english/\">Collins</a>. <a href=\"http://www.myfonts.com/fonts/thometz/hefeweizen/\">Hefeweizen</a>. <a href=\"http://www.myfonts.com/fonts/abctypes/generation-uncial/\">Generation Uncial</a>. <a href=\"http://www.myfonts.com/fonts/abctypes/generation-uncial/\">ITC Korigan</a> (ok, so it's a kinda squashy diamond). <a href=\"http://www.myfonts.com/fonts/drewfonts/jester/\">Jester</a>. <br> <br><a href=\"http://www.myfonts.com/fonts/linotype/itc-zapf-chancery/\">ITC Zapf Chancery</a>. <a href=\"http://www.myfonts.com/fonts/linotype/clairvaux/\">Clairvaux</a>. Our very own Hrant's <a href=\"http://www.themicrofoundry.com/f_cristaal.html\">Cristaal</a>. <br> <br>A few more lineales, probably inspired by Kabel: <a href=\"http://www.myfonts.com/fonts/typotheque/fedra-sans/\">Fedra Sans</a> (and <a href=\"http://www.myfonts.com/fonts/typotheque/fedra-mono/\">Fedra Mono</a> and <a href=\"http://www.myfonts.com/fonts/typotheque/fedra-serif-a/\">Serif</a>). <a href=\"http://www.myfonts.com/fonts/bergsland/albe-sans/\">Albe Sans</a>. <br> <br>Hope this helps.</p>"
