      <p>Well, the musical is set in 1905 in Tsarist Russia. A period typeface would be good, or something evocative of the period....</p>
      <p>Perhaps Jenson Oldstyle (the ATF/LTC typeface)? <a href="http://www.myfonts.com/fonts/lanston/ltc-jenson/" title="http://www.myfonts.com/fonts/lanston/ltc-jenson/">http://www.myfonts.com/fonts/lanston/ltc-jenson/</a></p>
