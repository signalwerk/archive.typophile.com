  html: <p>Hi all, i am doing a dvd cover called The Mistress starting Julianne Moore. I have used an image that is rather feminine yet empowered along with 30's feel, i would like to have suggestions on appropriate fonts for the movie title. Thus far, i've tried paring Futura Medium  w/ 1)Galliard, 2)Castellar MT, 3)Bellevue. I am trying to capture the feeling of feminity and power. <br>Suggestions and comments please. Thanks a bunch! =)</p>
