    html: |-
      <p>That certainly does sound weird, as using Monotype fonts in books hasn't put their authors' and publishers' rights in danger.</p>
      <p>However, Microsoft Windows is sold to people for home and office use, not as an instrument of publishing, and the possibility of some weird stuff in the licence agreement can't be totally eliminated.</p>
      <p>It is just recently in the news that some of the services competing with Flickr (but not Flickr itself!) are now arrogating to themselves rights to the images they host.</p>
