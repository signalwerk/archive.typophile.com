    <p>Please check out my first font release, Grey Sans!</p>
    <p>Grey Sans is a contemporary sans with an angular design. Routed in both modern geometry and historical handwriting, Grey Sans bridges the gaps of neutrality and warmth, precision and humanism, and serious and fun. Grey Sans covers the grey areas of typeface design.</p>
    <p>Available at:<br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/greyscale-type/grey-sans/" rel="nofollow">MyFonts</a> | <a class="freelinking external" href="http://www.fontspring.com/fonts/greyscale-type/grey-sans" rel="nofollow">Fontspring</a> | <a class="freelinking external" href="http://www.youworkforthem.com/font/T4209/grey-sans" rel="nofollow">YouWorkForThem</a> | <a class="freelinking external" href="http://www.hypefortype.com/grey-sans.html" rel="nofollow">HypeForType</a> | <a class="freelinking external" href="http://www.fonts.com/font/greyscale-type/grey-sans" rel="nofollow">Fonts.com</a></p>
    <p>Thank you.</p>
