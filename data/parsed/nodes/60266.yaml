    <div class="info">Submitted by <a href="/user/3834" title="View user profile.">Nick Cooke</a> : 24.Jul.2009 3.49am </div>
      <p>G-Type designer Nick Cooke is delighted to announce the release of two new OpenType families: Organon Sans and Organon Serif in six weights from Light to UltraBlack. These new characterful typefaces have been thoughtfully designed for excellent legibility when used in text sizes. Tapered stems give a distinctive robust quality which is also suitable for display. Using Organon Sans in conjunction with the accompanying serif family makes it ideal for any project requiring elegantly sophisticated typography over a range of applications.<br>
    An extensive character set has Language coverage for Western, CE, Turkish and Baltic.</p>
    <p>Serif OpenType features include:<br>
    Proportional and Tabular numbers, Lining and Old-style numbers, Small Caps, Ligatures and Discretionary Ligatures, Swash small caps and Caps: Q and R, q and r</p>
    <p>Sans OpenType features include:<br>
    Proportional and Tabular numbers, Lining and Old-style numbers, Small Caps, Ligatures and Discretionary Ligatures,<br>
    3 style sets:<br>
    1-alternate infant ‘a’.<br>
    2-alternate double-decker ‘g’<br>
    3-alternate ‘y’</p>
    <p>Initially available through Fontworks UK.</p>
