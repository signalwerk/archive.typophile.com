    <p>Hi everyone, this is my first try at the glyphs for Ferric Tide, the first of a family of serif fonts I'm doing using a bunch of old (1700-1720) maps I've found. Since my first love is antique/fantasy cartography, I've been wanting fonts along these lines and haven't been able to find any, so I'm making them. :)</p>
    <p>I haven't yet started the kerning; I want to get the glyphs settled first.</p>
    <p>Also, I haven't included numerals, because I'm honestly at a loss as to how to make them, and I can't imagine wanting to use this font for anything numeric. Does it even *need* numbers, do you think?</p><div class="imageWrap"><img src="http://typophile.com/files/Sample_5323.png"></div><p></p>
  html_clean: |-
    <p>Hi everyone, this is my first try at the glyphs for Ferric Tide, the first of a family of serif fonts I'm doing using a bunch of old (1700-1720) maps I've found. Since my first love is antique/fantasy cartography, I've been wanting fonts along these lines and haven't been able to find any, so I'm making them. :)</p>
    <p>I haven't yet started the kerning; I want to get the glyphs settled first.</p>
    <p>Also, I haven't included numerals, because I'm honestly at a loss as to how to make them, and I can't imagine wanting to use this font for anything numeric. Does it even *need* numbers, do you think?</p><div class="imageWrap"><img src="/files/sample_5323.png"></div><p></p>
