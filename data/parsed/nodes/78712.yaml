      <p>Oh! thanks for the advice on slashes, Bendy, you can tell I'm new at this :) Regarding the S and T, I don't really like the S either, although it's exact as far as the reference map is concerned; I'll be trying to rework that one. I think the T's major problem might be the fact that it's next to the wonky S, but I'll take a second look at that one as well.</p>
