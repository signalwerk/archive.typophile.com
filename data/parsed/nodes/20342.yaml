    html: "<p>Well, according to a PDF I downloaded from their site, there are several GEO-fonts used: Geo, Geo-Bold, Geo-BoldItalic, GeoHeadline. But I haven't found a reference for it. As a substitute I'd recommend Neo Tech, Neo Sans, Digital Sans or the Hans Reichel-fonts like barmeno/Sari or even Dax.</p>"
