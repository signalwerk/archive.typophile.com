    html: |-
      <p>Here's my code for long s.<br>
      For words like "scissors", "satisfaction" and "offside".<br>
      <code><br>
      sub s by longs;<br>
      sub longs' f by s;<br>
      sub longs longs' by s;<br>
      sub f longs' by s;<br>
      ignore sub longs' @letter;<br>
      sub longs' by s;</code></p>
