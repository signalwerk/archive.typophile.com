    <p>Does anyone know how can I create class that will contain ALL glyphs exept a particular one? (lowercase s in my case)</p>
    <p>I have googled for hours and studied the FontLab manual a lot, but I can't find an answer.</p>
    <p>I could perhaps do it with character ranges, but which ones should I use? Based on which encoding?</p>
    <p>Sorry if its a stupid question, I'm quite a beginner in all this...</p>
    <p>Thanks in advance!</p>
