    html: |-
      <p>Okay, lets simplify the problem a bit.<br>
      Lets suppose I only have s.alt1 which I want to place instead of s before every lowercase s and s.alt3 which I want to place instead of s when s is between two other s (sss). The problem is that in the second case, the middle s would be substituted by s.alt1 because it also precedes an s.</p>
      <p>This does not work:<br>
      <code><br>
      lookup calt_s1 {<br>
        	ignore substitute s s' s;<br>
        	sub s' s by s.alt1;<br>
        } calt_s1;<br>
      </code><code><br>
        lookup calt_s3 {<br>
        	sub s s' s by s.alt3;<br>
        } calt_s3;<br>
      </code></p>
      <p>This neither:<br>
      <code><br>
      lookup calt_s1 {<br>
        	ignore substitute s s' s;<br>
        	sub s' s by s.alt1;<br>
        } calt_s1;<br>
      </code><code><br>
        lookup calt_s3 {<br>
        	sub s.alt1 s' s by s.alt3;<br>
        } calt_s3;<br>
      </code></p>
      <p>but this does:<br>
      <code><br>
      lookup calt_s1 {<br>
        	ignore substitute s s' s;<br>
        	sub [a-z space] s' s by s.alt1;<br>
        } calt_s1;<br>
      </code><code><br>
        lookup calt_s3 {<br>
        	sub s.alt1 s' s by s.alt3;<br>
        } calt_s3;<br>
      </code></p>
      <p>The reason I don't want the latter solution is that I have to create a class with every glyph, and it would still be incomplete, because I would also have to match somehow the start and end of the text.<br>
      What seems to be the problem, is that ignore sub does not work if the pattern given to it is not an exact subcase of the substitution below. In the first case, since ignore sub had s s' s and the pattern was s' s, it didn't work. When we converted the substitution pattern to [a-z space] s' s it worked, as s s' s is a subcase of that.<br>
      However this behavior conflicts with the Adobe <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#5.f.ii" rel="nofollow">specification</a> (see example 1, even though the pattern is [a e n] d' and the exceptions f [a e] d' and a d' d, they are supposed to work.</p>
      <p>So, the possibilities are two:<br>
      1. I'm not grasping something correctly<br>
      2. Its a FontLab bug (?!)</p>
      <p>My bet would be on 1. So what am I missing? :(</p>
