    html: <p>You can make classes in FontLab by first creating a new class in the Classes panel and then simply selecting the glyphs you want to include from the Font Window and dragging them into the top right portion of the Classes panel. So, create a new class, then use Ctrl+A (or Mac equivalent) to select all the glyphs in the Font Window, then use Ctrl click to unselect the one that you do not want in the class, then drag and drop all the selected glyphs into the Classes panel.</p>
