    html: |-
      <p>I tried the ignore sub with many ways, but it doesn't seem to work for what I want it to do.</p>
      <p>What I want to do is:<br>
      I have 2 alternate s, that change based to the preceding or next character.<br>
      I also have two different s that are used when the next or preceding character (respectively) is also an s, and another s to be used when both the preceding and next character is an s.<br>
      This totals to 1 normal s and 7 contextual alternates. </p>
      <p>The code from the calt feature that has to do with any of them is the below (irrelevant subs removed):<br>
      <code><br>
        @not_s = [a-r t-z e.alt s.alt2 space period .notdef CR ];<br>
        @is_s = [s s.alt s.alt1 s.alt11 s.alt2 s.alt21 s.alt22 s.alt3];<br>
        sub @not_s s' [a f t z w u y b] by s.alt;<br>
        sub @is_s s' [a f t z w u y b] by s.alt22;<br>
        sub @not_s s' s by s.alt1;<br>
        sub @not_s s.alt2' s by s.alt11;<br>
        sub [s.alt1 s.alt11 s.alt3] s' s by s.alt3;<br>
        sub @is_s s' @not_s by s.alt21;<br>
        sub s.alt3 s.alt' by s.alt22;<br>
        # fresset!<br>
        sub f.alt r.alt e.alt s.alt11 s.alt21 e' t' by s_t.logo;<br>
      </code></p>
      <p>Of course the @not_s class is completely temporary and doesn't contain lots of glyphs. What I want it to contain is every glyph that is not a lowercase s (including start and end of lines, even though they aren't glyphs, although I doubt its possible :( ).<br>
      If that isn't possible, can anyone think of a way to do it with ignore sub? I have a strong feeling that ignore sub is the way to go, but everything I tried with it doesn't work :(<br>
      This is troubling me for several hours but I can't figure out a more complete solution... :(</p>
