      <p>Thanks very much for your insight, guys. In response to Nick, I would first like to pardon myself because I don't want to sound like I'm arrogantly sitting here ordering Blokland or De Does to go start working on Spectrum or whatever. I certainly agree that I won't be "swaying anyone into action" ;) I'm merely curious as to why these faces have been in large part left behind, considering the care and mastery that is evident in their craftsmanship.</p>
      <p>I would feel so lucky to be able to do some of these faces justice; it would, however, be the peak of arrogance for me to attempt to revive any of them. Monotype's lame cut of Spectrum is evidence of what happens when the job isn't done right. I have never designed a typeface. I work with type, I admire type, but quality type demands more than I could hope to give. That's why I would leave it up to TEFF or DTL, two shops turning out consistently impeccable digitizations. It would be so bitter to work with a digitization of any of these faces that doesn't do them proper tribute. Far worse than not working with one at all. That's precisely why I wouldn't touch cut by a guy <a class="freelinking external" href="http://new.myfonts.com/person/Hans_van_Maanen/" rel="nofollow">whose other work looks like this</a>, and why I find Monotype's digitization of Spectrum upsetting.</p>
      <p>Of course you're right, people often have very little interest in looking back. Examining some of the samples of De Roos Romein, which demonstrate such gorgeous notan, I just can't understand why there has been such collective apathy regarding this type, and Romanée, and Cancelleresca Basterda, et cetera, et cetera.</p>
      <p>The Romulus situation, William, is simply bizarre. Maybe DTL is waiting for the proper companion italic? But really. This is what I mean. It's just weird.</p>
      <p>The commercial point, James, is clearly valid, but unsatisfying, of course. You mention that US designers needn't respect EU copyright concerning typefaces? How's that? I'd be curious to learn more about that. Arthus, Monotype is a British company, I believe, but I would expect its presence to reach the states, as well, as you imply. How does this work? I still think rights are the most likely explanation.</p>
      <p>Still, foundries make typefaces, some more beautiful than others, and it seems to me odd that foundries would ignore some of the best type that's sitting right in their laps, choosing rather to "build for the present," which doesn't mean very much to me because many of these designs strike me as quite timeless. I'm certainly not waiting for another slab serif or OTF bonanza. (OpenType is fun, and awesome, and completely necessary for digital, but it's become a bit of a fad. I'd prefer that the time go into the letterforms, not into 130493041 alternates.)</p>
      <p>I would think that it would be less work for, say, DTL to do a JvK revival than do an original design. William, your question as to whether the current reality is a product of "failings in the type" or "failings in the world" seems to me quite pertinent. If you look at TEFF, though, a foundry that I have so much respect for, you'll find a small shop churning out consistently top-notch faces, some of them revivals. The recent "Geronimo" (a fun font, tastefully hinting at the Rococo style in its ornamentation, it seems) is a wonderful revival by the great Mário Feliciano. Here's one face, one revival, squeezed out. I think that the JvK/De Roos issue might just be a matter of time as well. If they are ever liberated from metal, they should come out right.</p>
      <p>I hope.</p>
