      <p>I'm quite sure the reason that not all of van Krimpen's typefaces have been digitized have to do with rights. I once read that Monotype still holds the rights to many of van Krimpen's work, like you said, the Lutetia for instance, and only a few fonts have been up for grabs. Which is a pity of course since the typefaces are of the finest quality around.</p>
      <p>The same can be said for the work of de Roos, although Gerard Unger explains that some of his typefaces, like the in holland widely used Dutch Medieaval won't get a revival at least from any dutch designers because of it's place in our history. It was over-used, and through that will always end up looking out of date, being a child of it's time.</p>
