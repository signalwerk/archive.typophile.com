      <p>If someone misses the boat, historically speaking, it's very difficult to get them aboard, especially if they're dead.<br>
      The Zipf curves swings into action, and the canon gets set with a few examples from an era coming to represent it.</p>
      <p>Often, the best bet is a son or daughter to campaign for inclusion.</p>
      <p>Otherwise, people are more interested in retrieving not forgotten classics (a genre already represented in the canon), but works which are peculiar to their time. </p>
      <p>It's not enough for a connoiseur to express an interest, that's unlikely to sway others to jump into action.<br>
      Why not publish a revival of the font(s) yourself Owen, if you feel so strongly about it?</p>
