      <p>I did have a serious point to make, which is that there can be no question of "awaiting" a proper italic for Romulus, for the simple reason that such a thing does not exist.</p>
      <p>As we know, Romulus was designed and cut at Enschedé in the early 1930s as a lone face. What prompted Stanley Morison to advise Van Krimpen to draw a sloped roman, I for one cannot fathom, but at that point its fate was sealed.</p>
      <p>Fortunately, in 1938 Monotype gave Van Krimpen the opportunity to revise his design. He drew a fresh italic and christened the pair Haarlemmer, now available as a faithful digital revival from DTL. So there you have Romulus, right under your nose. Similarly, Romulus Sans was never completed, but Frank Blokland's Haarlemmer Sans is a most worthy successor.</p>
      <p>The unique designs whose absence should pain us are Cancelleresca Bastarda and the Romanée italic.</p>
