      <p>&gt;So there you have Romulus, right under your nose</p>
      <p>That's not accurate. While both Haarlemmer and Romulus are closely related designs, they are different. Haarlemmer is more robust, has old style stress and serifs, and has shorter descenders. Romulus has more vertical stress and transitional serifs, is more fine and elegant, and has longer descenders. </p>
      <p>Yes, if you ask me DTL would make Romulus usable by adjusting the weight and proportions of the Haarlemer italic so that it is a suitable mate to Romulus. I agree—and I think even JvK did, if I remember rightly—that the sloped roman is a flop. </p>
      <p>Romulus is one of the most beautiful romans ever, so it is a pity not to have a usable version available.</p>
