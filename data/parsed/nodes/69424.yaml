      <p>It is very difficult to make a "proper" revival.<br>
      So much depends on reinterpretation, going from letterpress to offset (or pixels).<br>
      I would say that there are many classics which have still not had a proper digital era reinterpretation, such as Bembo, Baskerville, and Perpetua. Even the mighty Bodoni is still wide open for reinterpretation.</p>
      <p>Added to which is the danger that if one does an authentic revival, capable of reproducing a facsimile page, it will add nothing to the pot, and just look like some boring old antique. If one adds a twist, creating a dialectic, then it is not quite so proper, and may well be considered a travesty by the cognoscenti.</p>
