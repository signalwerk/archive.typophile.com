      <p>Happy to hear of "Remus," which as I said I agree is needed to make Romulus usable. Personally, I don't think that a revival of the sloped roman is needed, as it is a poor companion to the roman, being too wide among other things. Perhaps progress has slowed because the sloped roman is inherently a bad idea, and there is no way to rescue it? Just a thought. But I don't see why if you have created a good companion italic it should hold back a release of the roman and italic. </p>
      <p>On the issue of revivals generally, developing great design ideas from the past into a contemporary face, with appropriate changes for modern technology of printing or screen is I think a very worthy undertaking. But I am of the opinion that pursuit of authenticity is a trap that can cripple the usability of a design. And the point of the desirability of revivals, and trap of authenticity I think does apply to Van Krimpen's faces. </p>
      <p>As Tracy argues, in spite of their beauty, there were problems with practically every one of Van Krimpen's typefaces that got in the way of their usage. Even with Spectrum, the beautiful italic is too narrow as a companion for the Roman, though it is usable. I really wonder whether if Van Krimpen had been able to design as we do now, being able to instantly see how all the glyphs work together, whether he could have avoided these problems. At the time, did his reputed cranky personality get in the way of effective collaboration? </p>
      <p>Anyway best of luck on this difficult and worthy project.</p>
