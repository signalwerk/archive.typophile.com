    <p>I admire deeply the work of Hendrik de Roos and Jan van Krimpen, but have been dismayed in my search to find revivals of both men's work. The two dominant Dutch foundries committed to JvK, TEFF and DTL, haven't touched Spectrum, though Monotype did a half-baked and impractical digitization. Also, though De Does' Trinité supposedly takes cues from JvK's Romanée, and TEFF is slowly working on a revival, I would like to know if those plans are still in motion. And what, then, about Cancelleresca Basterda, a face that might finally give JvK's ill-fated Romulus super-family more legitimacy, and which is quite beautiful in its own right?</p>
    <p>Then, I would just like to remark that the collective amnesia regarding the work of De Roos is quite upsetting. A revival of his eponymous Romein would do his legacy some justice. The italic, as Hrant has pointed out, is a masterwork, and I find it deeply troubling to think that we might forget about this gorgeous face and de Roos in general.</p>
    <p>I suspect that most of the problems surrounding these projects might have to do with rights. Does Monotype, as I have heard, hold the licenses for Lutetia, Cancelleresca Basterda, and some other JvK faces? This is a problem because Monotype clearly has no interest in providing a fitting tribute to Van Krimpen. Of course, the foundries that could do it right, TEFF and DTL, take time to do their excellent work and if it's simply a matter of backlog and time then that's understandable. I just hope that we will see more of the best of Dutch type in the future.</p>
