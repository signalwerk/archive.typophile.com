      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Letter_HvK_1a_3456.jpg"></div><br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Letter_HvK_2_4211.jpg"></div><br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Letter_HvK_3_5164.jpg"></div><br>
      &nbsp;<br>
      Although under the American law it is possible to circumvent some rights, like on the design itself, in my opinion the type community should acknowledge and protect <strong>all</strong> rights, irrespective the meshes of the law. For a decade DTL owned the rights on the Tetterode / Lettergieterij Amsterdam font collection before these rights were transfered to Linotype. So, Linotype is the party now to contact for the designs by Sjoerd de Roos.<br>
      &nbsp;<br>
      Roughly fifteen years ago I wrote the following text on the backgrounds of (DTL) Haarlemmer.<br>
      &nbsp;<br>
      &nbsp;<br>
      <strong>(DTL) Haarlemmer</strong><br>
      &nbsp;<br>
      In his <em>Memorandum to Monotype</em> Jan van Krimpen makes no bones about his disapproval of revivals: ‘It hardly needs saying that I am no supporter of copying or even adapting his­torical type faces. Not, it should be understood, because I see them, indeed fear them as competitors of today’s designs; but for no other reason than that they are neither flesh nor fish’.<br>
      	The most striking aspect of this comment is that Van Krimpen did not consider revivals to represent competition for contemporary designs. Here he meant the design, the form. But revivals may have presented competition for Van Krimpen and other designers in a different way: investment in the production of revivals by type-setting machine-firms, brings little benefit to living designers.<br>
      	While the quotation from the <em>Memorandum to Monotype</em> leaves hardly any room for doubt, Van Krimpen had been rather less opposed to revivals some twenty years earlier. In the years 1937–1938 he advised on the production of Monotype Van Dijck. This was a revival based on a type design attributed to Christoffel van Dijck, which had been used in a work by Joost van den Vondel in 1671. Only when the project had been completed did Van Krimpen disassociate himself from it. In the appendix to <em>A Tally of Types</em> (Cambridge, 1953/1973) Netty Hoeflake wrote: ‘Whatever he did for this series he did “with love and application”, yet in the end he was “more opposed to it” than ever before, and he called the roman “a doctored adaptation of a seventeenth-century Dutch face”’.<br>
      	Ten years before the production of Monotype Van Dijck, Van Krimpen had made direct use of historical material for another typeface. The basis for the production of Romanée in 1928 was also a typeface attributed to Van Dijck. The italic had been preserved as a foundry type, the roman, however, was only available in an Enschedé type specimen. Van Krimpen designed a roman based on Van Dijck’s letter. Elements of the seventeenth-century model were employed in the new typeface. In <em>The Work of Jan van Krimpen, A record in honour of his sixtieth birthday</em> (Haarlem/Utrecht, 1952) John Dreyfus wrote: ‘A comparison between Romanée and the reproduction of the original “Kleine Text Romein No. 2” will show that many characteristics of the latter have in fact been retained’.<br>
      &nbsp;<br>
      Revivals always formed a substantial part of the typeface assortment of the Monotype Corporation. In fact, before Stanley Morison (1899–1967) started his font production program for Monotype, the supply of this typesetting machine firm consisted entirely of revivals such as Monotype Plantin (1913), Caslon (1915) and Bodoni (1921–1928). These typefaces had been produced in response to market demand. At first Morison’s program also supplied revivals. But what made these typefaces different was that they were designed to anticipate demand. Producing new, twentieth-century type designs was the next phase. Introducing <em>A Tally of Types</em> Morison wrote: ‘The original twentieth-century book type might come in due course. But certain lessons had first to be learnt and much essential knowledge discovered and recovered. The way to learn to go forward was to take a step backward’.<br>
      	Once his type library of revivals became a financial success, Morison was able to try something new. He appointed a contemporary designer to develop a new book face. This was Eric Gill (1882–1940) and the result was Perpetua (1929). In addition to new typefaces, such as Romulus and Spectrum by Jan van Krimpen, Monotype continued to produce revivals such as Erhard (1938) and the aforementioned Van Dijck. Clearly there was still a demand for historic designs, despite the new typefaces.<br>
      	And today, in the late twentieth century, the demand for historic designs continues. Following a period of nearly five centuries of relative stability, the technology of typesetting and printing has changed significantly. Yet many of the typefaces now available in digital format are as old as the hills. Popular letters with names like Bembo or Garamond originally date from the fifteenth and sixteenth century respectively. Perhaps it is inevitable that the past continues to influence events in a trade that is governed by convention. Even the most famous twentieth-century typeface, Times (New Roman), has its origin in sixteenth-century punches.<br>
      &nbsp;<br>
      <strong>The design of Haarlemmer</strong><br>
      &nbsp;<br>
      Given Van Krimpen’s distaste for revivals, the re-drawing of Haarlemmer for digital use was a risky enterprise. Especially since the designer had been dissatisfied with the original, unfinished, pre-war production of the typeface. Not that the type lacked quality, which would have been inconceivable for a Van Krimpen design. But there were considerable technical handicaps at the time. Furthermore the outbreak of war prevented him from perfecting the design.<br>
       	The Vereeniging voor Druk- en Boekkunst (Society for the Art of Printing &amp; Books) invited Van Krimpen to design a new typeface for an edition of the Dutch Authorized Version of the Bible (<em>Staten Bijbel</em>) in 1938. In the design, however, Van Krimpen’s freedom was severely limited. In The Work of Jan van Krimpen John Dreyfus noted: ‘The type was designed to work on an existing Monotype keybar layout in order to keep down costs of production’.<br>
      	Normally, when producing a type design for Monotype, a layout was chosen so that the letter could undergo a minimum number of adaptations. For other type designs by Jan van Krimpen, such as Lutetia and Romulus, the Monotype drawing room went to considerable lengths to adjust the typefaces, originally designed for foundry type, to fit in their unit arrangement. But this always involved compromise. In his memorandum to Monotype, Van Krimpen described the problems that accompanied this kind of production. He declared himself in favour of a typeface within a unit arrangement. But with the following proviso: ‘As I have said, no designer should try to make it on an existing unit arrangement that does not correspond with his own particular rhythm’.<br>
      	In all probability, the design for Haarlemmer was not only based on an existing keyboard layout but also on a fixed unit arrangement. Van Krimpen was forced to work with an arrangement that clashed with his own personal rhythm. From his notes to the translation of Jan van Krimpen’s <em>On Designing and Devising Type</em> (New York, 1957) Huib van Krimpen already suspected this in 1990: ‘Has the Monotype Corporation tried to find the best fitting unit arrangement on the basis of a sketch or has the design been made on a previously given grid? Looking at the h, n and u that are too narrow, the latter is most likely’. His supposition was confirmed when he brought the original Haarlemmer drawings, once thought lost, from England in 1992. The widths of the drawn letters have all been neatly divided into units and inked in.<br>
      	The production of Monotype Haarlemmer was never finished. ‘The first trial sheets of Haarlemmer were pulled in June 1938. Further work on the design was done at the Monotype works in England during the early months of the war, but all plans for the <em>Staten Bijbel</em> were abandoned after the invasion of Holland’, John Dreyfus wrote in <em>The Work of Jan van Krimpen</em>. Dreyfus was not convinced of the qualities of Haarlemmer. ‘As soon as the first trial sheets were pulled, the faults of the type became disconcertingly clear. The roman was far too dazzling, and the italic a good deal too wide. There was an uncomfortable difference in colour between the roman and the italic, and even within the two alphabets the round letters tended to show up lighter than the perpendicular letters. The stiffness of the design is partly due to restrictions imposed by drawing a type to fit an existing keybar layout. Other type designers have also found that a preoccupation with mechanical limitations frequently leads to an æsthetic failure. It is better for the designer to draw the letters as he wishes them to be, and to make modifications only when the engineers show that they are essential for the machinery involved’. Unfortunately, Dreyfus fails to take account of the fact that Van Krimpen had no option than to design Haarlemmer within an existing unit arrangement.<br>
      	Distancing himself from Dreyfus’s ideas, Walter Tracey (1914–1995) deals with these limitations when discussing his solution for this problem in <em>Letters of Credit. A View of Type Design</em> (London, 1986): ‘I think the design had more promise than John Dreyfus’s account of it suggests. Apart from an awkward W, due to an existing machine layout, there were no disturbing letter shapes. Certainly the narrow h, n, u and rather wide o and c were out of proportion and needed revision; and if the italic lowercase could have been a little narrower it would have seemed to gain weight and would have harmonised better with the roman. The design would then have become an effective book type’.<br>
      	Huib van Krimpen, in his remarks on <em>On Designing and Devising Type</em>, came to the following conclusion: ‘Probably, the truth lies somewhere in between. Dreyfus’s (JvK?) objections and remarks are well-founded in every respect, but Tracey’s views are no less just. Only, his suggestions are impracticable within the limits of the existing unit arrangement’. Bearing in mind the shortcomings of Monotype Haarlemmer and the criticism of the design, there appears to be little justification for a digital revival of this typeface. Nevertheless, there were good reasons to breathe new life into it. Firstly, the design, the concept, is good. As Walter Tracey has already remarked, the fact that the Monotype version had its faults does not mean that the typeface had no good qualities. Secondly, the restrictions of the Monotype unit-arrangement system no longer apply. The widths and therefore the shapes of the characters can be adapted at will. Thirdly, the italic of Haarlemmer is an expanded type, all other Van Krimpen italics being condensed ones. In <em>Letters of Credit</em> Walter Tracey suggests the following concerning Spectrum italic: ‘The italic is a distinguished design in itself, but it does not quite harmonize with the roman. A foreign phrase or a longish book title in a page of Spectrum becomes over-emphatic and the texture of the page becomes patchy’.<br>
      	In essence, Haarlemmer is the prototype of Spectrum. The differences between the two designs are quite significant, showing most obviously in the capitals and figures. As far as the widths of the characters are concerned, the italics are antipoles. Haarlemmer’s unique wide italic was probably the result of the unit arrangement Van Krimpen had to employ. So, while this restriction ensured that the project failed it also produced a unique design.<br>
      &nbsp;<br>
      <strong>The production of a digital Haarlemmer</strong><br>
      &nbsp;<br>
      The basis for the digital Haarlemmer was the set of Jan van Krimpen’s original drawings of 1938. However, the quality of the original Haarlemmer was too poor for the purpose. Moreover, there was no reason to take the restrictions of the unit arrangement system on board. The original drawings were not directly digitized. First, they were interpreted, so that a typeface emerged that corresponded as much as possible with Jan van Krimpen’s original concept. In fact, this procedure is comparable to the way in which Van Krimpen’s foundry types were produced.<br>
      	Jan van Krimpen worked as a typographer and advisor with the Joh. Enschedé en Zonen at Haarlem from 1925 until his death in 1958. Most of his types were cut in steel by the Enschedé punch cutter P.H. Rädisch (1891–1976). Under the auspices of Van Krimpen, Rädisch interpreted his drawings and made the required modifications for the different point sizes. Van Krimpen’s ink design obtained its definitive shape in Rädisch’s punches. Later, these punches served as the basis for Monotype. The original Haarlemmer drawings were similarly interpreted to ‘cut’ digital ‘punches’. Alas, Van Krimpen’s hand was no longer on the tiller, although a thorough study of his work made up for his absence.<br>
      &nbsp;<br>
      The first step in the production process was to photograph the originals. These photos were digitized on a flatbed scanner. The scanned letters were separated, and lightly retouch­ed. The Haarlemmer typefaces which had been provided with outlines through Linus M were placed on the exact widths as in the original drawings. Then PostScript Type1 fonts were generated from the Ikarus formats. This made it possible to typeset on the computer with the authentic Haarlemmer typeface designs.<br>
      	The Haarlemmer contours were given a face-lift. The roman was revised especially thoroughly. Apart from weight and contrast, form and adjustment were considerably improved. The unique, expanded italic required fewer corrections. At the end Medium and Bold weights were added.<br>
      &nbsp;<br>
      FEB<p></p>
