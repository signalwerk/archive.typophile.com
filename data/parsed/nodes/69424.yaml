      <p>Owen, late to the discussion, but just stumbled on this thread. I share your sentiments regarding JvK's types, but at the same time I'm somewhat glad the good ones haven't been widely available. Romanée (which hasn't been discussed much in this thread) and Romulus/CB are two of the finest types of the 20th century, and I'd hate to see either of them used for menus or paperback novels.</p>
      <p>I've redrawn and developed a revival of Romanée, which is now complete, including the roman, italic, small caps and swash caps, but I have no desire whatsoever to release these fonts. I attempted to touch base with TIFF on this front, but never heard back from them. I did make contact with Fred Smeijers, who worked on the TIFF version of Romanée, but he had no information on if/when the TIFF version would be released. My plans for my version are to print a specimen letterpress from polymer for the time being. I've also recently purchased a good amount of foundry Romanée from a retiring printer in Holland, but it is only the roman. Thus, I may, eventually, cut new matrices of my italic/small caps/swash drawings from which to cast new metal type to accompany the roman. That's a long term plan, and the type would only be used for projects from Greenboathouse Press, but it is my goal.</p>
