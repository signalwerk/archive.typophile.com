      <p>The development of DTL Romulus takes almost 14 years now, but a delicate type like this one has to ripe like a good wine. There are actually more weights/styles of the different versions (<em>Poster</em>, <em>Display</em> and <em>Text</em>) made than are shown on the DTL web site and the current state of DTL Romulus is fine but not perfect yet. So, it is like a Grand Cru at the moment, but it is not a Grand Cru Classé yet. It misses the crispness and sparkling that characterizes DTL Haarlemmer, especially in the sloped roman still. So, some work to do here before it will be released and as always we take our time at DTL.<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Romulus_Haarlemmer_5358.jpg"></div><br>
      &nbsp;<br>
