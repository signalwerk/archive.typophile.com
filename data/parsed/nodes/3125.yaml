  html: <p>I posted at Adobe in their forums but I thought I'd roll the dice and see if any of my fellow typophiles have experienced the same thing. <br> <br>* * * <br> <br>I've created some files in Illustrator CS. I'd like to give them to my client to use in Illustrator 8 ... they are basically templates. When I export them as legacy files all the type breaks into separate letters. I did try to create a text box thinking that perhaps that would work but it didn't. I'm neither all-knowing nor all-seeing so I'm hoping you might have an idea or suggestion for me. <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Thank you.</p>
