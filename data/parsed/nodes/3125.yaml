    html: <p>There's a whole long thread about this on the Adobe forums, entitled "the new text engine" or something like that. It explains this stuff in some detail. <br> <br>I believe the short answer is that backwards compatibility is limited in this way, and it's one of the sacrifices they had to make to get to the new text engine. <br> <br>T</p>
