    html: <p>Thanks Thomas! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I love the new text engine so I wouldn't trade that for anything. I'll just have to give my client all the fiddly numbers and a file with guides of where to start their text boxes.</p>
