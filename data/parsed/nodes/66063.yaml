    <p>This is a font family I mad for a Finnish directory company. In the end this turned out a lot like my Suomi Sans family, even though I drew this one without any copying and pasting from Suomi Sans.</p>
    <p>I'm not too thrilled with the work of the ad agency of the logo (they connected the F and t with the contour of the nex letter), but in all I'm pretty happy with the overall result.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Fonecta_6374.png"></div><p></p>
    <p>This is an add for the iPhone app I found from iTunes:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Fone_6484.png"></div><p></p>
    <p>Here's a more comprehensive pdf:</p>
