    html: <p>Vogue had alternate characters that enabled it to imitate the look of Futura or Kabel. Your first sample shows Vogue with some of the Kabel-like alternates (the bolder sample has the “Kabel” lowercase t as well). The original poster’s sample shows the standard characters.</p>
