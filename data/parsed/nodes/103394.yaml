      <p>Must have been some variation in sets of the old Vogue. Your specimen resembles Intertype Vogue Bold but has the Q tail in the vertical position of the Extra Bold. Your e and g look like the ones from Kabel. Here is the character set of both weights.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/IntertypeVogueBoldAndXtrBold@33_5339.jpg"></div><br>
      As Mark says, nothing digital.<br>
      Don<p></p>
