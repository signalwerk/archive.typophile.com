      <p>mk2: That's the beauty of custom type, creating a few letterforms that relate to each other in a special way and only in that way/order. I'd rather do 20 (most probably more) different pieces of custom type in the time it would take to make one complete typeface. :o)</p>
      <p>Here's the drawing in case anyone's interested in seeing the process. It's not perfect, as I'm still learning, but my skills are getting there!<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/patrice_final_6581.jpg"></div><p></p>
