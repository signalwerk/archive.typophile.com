    <p>I just wanted to share my latest piece of custom type, drawn by hand and then traced in Illustrator. It's probably one of my best pieces of custom type drawn to this date, I've established a partnership with John Langdon and am going to start drawing a lot more type. I'll be sure to post up what I'm working on, it's amazing how fast my sketch pads are filling up now. Preview below and PDF attached for further inspection!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/patrice_6641.png"></div><p></p>
