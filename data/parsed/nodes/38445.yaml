      <p><a class="freelinking-external" href="https://web.archive.org/web/20080906232138/http://www.unece.org/trans/roadsafe/wp1publication.html#road_traffic_conv">The Vienna Convention on Road Signs and Signals</a>; a PDF version is <a href="/web/20080906232138/http://www.typophile.com/wiki/www.unece.org%25252Ftrans%25252Fconventn%25252Fsignalse.pdf" class="wiki-create">here</a>, but may be out of date; a <a class="freelinking-external" href="https://web.archive.org/web/20080906232138/http://en.wikipedia.org/wiki/Vienna_Convention_on_Road_Signs_and_Signals">Wikipedia article</a>.</p>
