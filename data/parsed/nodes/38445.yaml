      <p>Have you looked at the MUTCD? (Manual of Uniform Traffic Control Devices) its a mega tomb and not very modern but it does describe what is currently in place on the Federal Roadscape. Don Meeker, my partner in the Clearview project has developed a proportional grid design system he is currently trying to get the Feds to adopt. I know the system is very modular and basically sends a good portion of the MUTCD to the waste bin.</p>
      <p>There may be some useful information on our Clearview web site:</p>
      <p><a href="https://web.archive.org/web/20080906232138/http://www.clearviewhwy.com/" title="http://www.clearviewhwy.com">http://www.clearviewhwy.com</a></p>
