      <p><a href="https://web.archive.org/web/20080906232138/http://en.wikipedia.org/wiki/Traffic_sign" title="http://en.wikipedia.org/wiki/Traffic_sign">http://en.wikipedia.org/wiki/Traffic_sign</a></p>
      <p>Ireland has a Traffic Signs Manual, but I can’t find the complete manual online in a quick search. A new Chapter 8 is <a class="freelinking-external" href="https://web.archive.org/web/20080906232138/http://www.transport.ie/viewitem.asp?id=9095&amp;lang=ENG&amp;loc=397">here</a>.</p>
      <p>The UK:<br>
        <a href="https://web.archive.org/web/20080906232138/http://www.dft.gov.uk/pgr/roads/tss/tsmanual/publicationoftrafficsignsmanual" title="http://www.dft.gov.uk/pgr/roads/tss/tsmanual/publicationoftrafficsignsmanual">http://www.dft.gov.uk/pgr/roads/tss/tsmanual/publicationoftrafficsignsma...</a>.<br>
        <a href="https://web.archive.org/web/20080906232138/http://www.dft.gov.uk/pgr/roads/tss/trafficsigns.pdf" title="http://www.dft.gov.uk/pgr/roads/tss/trafficsigns.pdf">http://www.dft.gov.uk/pgr/roads/tss/trafficsigns.pdf</a><br>
