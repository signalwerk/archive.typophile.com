    html: |-
      <p>"afii" is the old convention. The newest standard.nam (part of Fontographer 5) no longer uses it. We recommend using "uni", and so does Adobe. </p>
      <p>Microsoft uses "afii" in their old fonts. New fonts (Cambria, Constantia etc.) use no glyph names at all.</p>
