      <p>&gt; <cite>"afii" is the old convention.</cite></p>
      <p>Old indeed! According to the <a href="http://www.adobe.com/type/browser/html/readmes/MinionProReadMe.html" rel="nofollow">Minion Pro ReadMe</a> file, version 2.030 created 2007/08/16 already had names beginning with uni; and I cite: <cite>Cyrillic glyphs which had names beginning with "afii" now have names beginning with "uni", conveying their Unicode value.</cite></p>
