    votes: null
    html: |-
      <p>Acrobat, the only application that still has a significant need to parse glyph names under some circumstances recognises both the uni and afii names for Cyrillic. afii is obsolete though, and uni makes more sense.</p>
      <p>Adam, Microsoft's policy on glyph naming varies: some fonts have format 3 post tables with no glyph names, some have uni format and/or AGL glyph names, and some have non-parseable glyph names. I always try to provide them with uni format names unless they've already told me that they intend to use a format 3 post table for the font or the layout behaviour is such that a direct route from glyph name to character code isn't possible, e.g. an Indic font with a glyph that represents non-contiguous character codes.</p>
