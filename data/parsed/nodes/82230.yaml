    html: |-
      <p>BTW, currently the best way to get the most current standard.nam and encoding files is to download and install the Fontographer 5 demo version (unless of course you buy the full license for Fontographer). Fontographer 5 and FontLab Studio 5 use the same files in a shared location, and Fontographer 5 brings the most current versions. </p>
      <p>I realize this is not optimal, but for the time being, that's the way it is. It should change in a few months, though :)</p>
