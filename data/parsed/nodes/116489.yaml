      <p>I didn't spot this exact font -- it may be custom lettering -- but here are a couple of fonts with the same thick &amp; thin inline effect<br>
      Narcissus Open is a heavy typeface designed by Walter Tiemann in 1921 for the Klingspor Foundry in Germany based on ornamental inline capitals first cut Simon Pierre Fournier about 1745. <a href="http://www.myfonts.com/fonts/spiecegraphics/narcissus-sg/" title="http://www.myfonts.com/fonts/spiecegraphics/narcissus-sg/">http://www.myfonts.com/fonts/spiecegraphics/narcissus-sg/</a> and <a href="http://www.myfonts.com/fonts/fontbureau/narcissus/" title="http://www.myfonts.com/fonts/fontbureau/narcissus/">http://www.myfonts.com/fonts/fontbureau/narcissus/</a><br>
      Also Dominus <a href="http://www.myfonts.com/fonts/redrooster/dominus-rr/" title="http://www.myfonts.com/fonts/redrooster/dominus-rr/">http://www.myfonts.com/fonts/redrooster/dominus-rr/</a><br>
      Don</p>
