    <p>Soon i'm going to travel to Berlin (for the frist time) and as we all know that there are many great fonts come from Germany.<br>
    So, i know that there must be some great museums/gallery's that i need to visit about typography.<br>
    Also great graphic design museums/gallery's are welcome.<br>
    Plus if you know a great street where many gallery's are that needs to be visit, let me know!</p>
    <p>Kind regards,</p>
    <p>Brown</p>
