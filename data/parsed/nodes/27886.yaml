    <p>FontLab is giving me a name for Ux03D6 as “omega1”, but this is a variant of pi, correct? So my question is how do i rename this? do i call it by its uni-name or call it pi.salt. Is one version better than another? this said, should i go back and change other characters that are called things like sigma1, phi1, &amp;c.?</p>
