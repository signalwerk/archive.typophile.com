    html: <p>One does see the ’swoosh’ form for pi in some Greek handwriting, sometimes with a returning stroke, creating a loop across the top of the omega-like shape. This occurs in quickly written text, not a carefully written scribal book hand. I don’t think it is an ideal form for a typeface.</p>
