      <p>Yes, this is the scribal pi. ’omega1’ is a misleading name that occurs in the Adobe Glyph List.</p>
      <p>Whether you call it /uni03D6/ or /pi.salt/ depends on whether you want Acrobat to map it back to the regular pi character or to U+03D6. Of course, you could include a redundant glyph in your font and use both names, which would be very Adobe-like.</p>
