      <p>Currently we’re using <strong>pi.alt</strong> as the friendly work name, and <strong>uni03D6</strong> as the final name.</p>
      <p>The reason why this glyph got named <em>omega1</em> at some point, is most likely because it resembles omega (U+03C9).<br>
      </p><div class="imageWrap"><img src="/files/pi_alt_4196.png"></div><br>
      <em>From left to right:</em> omega, pi.alt and pi (from Garamond Premier Pro).<p></p>
