    html: |-
      <p><em>The reason why this glyph got named omega1 at some point, is most likely because it resembles omega (U+03C9).</em><br>
      <em>From left to right: omega, pi.alt and pi (from Garamond Premier Pro).</em></p>
      <p>I suspect that in case of Garamond Premier Pro and many other fonts, the inverse is also true: U+03D6 is drawn as omega with a swoosh to the left instead of the scribal pi-like form with horizontal bar because of the wrong postscript name and other misleading associations with omega. This omega with a swoosh might have even became a modern tradition in itself, even though it has no greek scribal roots.</p>
