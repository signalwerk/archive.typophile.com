    <p>Hej,<br>
    can any one help me with this problem:<br>
    I am just starting to work with fontlab and try to make a font that has an alternative for each glyph that changes between those two (seemingly) random. I tried to test it with the following code trying to change the letter A of andale mono to an alternate version of the A ( A.salt):</p>
    <p>feature calt {<br>
    	sub @class1 @class1' by @class2;<br>
    } calt;</p>
    <p>I have made to classes , class1: A and Class2: A.alt ( both are listed as opentype classes<br>
    somehow this does not work, i cant even export my file as a font<br>
    what am i doing wrong and how can i solve this problem?</p>
    <p>I really really need help!</p>
    <p>All the best<br>
    Timmy</p>
