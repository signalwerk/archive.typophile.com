    html: "<p>In fact the glyphs are inside (I can see them in FontLab), but there is the usual matter of Unicode ranges and supported codepages. The bad news: all glyphs are PUA, so they need either renaming, or cheating with Unicode values to get them working. Or this can be done via opentype, replacing for example the bullet symbol from all aperture glyphs (which should display a glyph selection palette). But believe me, this can become quite messy... So, Luc, any ideas?</p>"
