    html: |-
      <p>Well, they work for me. I give my dingbat glyphs special names for several<br>
      reasons. I don't want to start calling symbols "a" that do not represent<br>
      the glyph "a" just because it is technically convenient.<br>
      I always design type 1 versions first (so try the pfb/afm combination).<br>
      Most software should handle the type 1 (PostScript) files correctly.<br>
      When I generate ttf fonts from type 1 fonts, programs such as FontForge<br>
      put the specially named symbols in an area outside the regular glyph area,<br>
      and so, renaming may be necessary for some applications, as you pointed out.<br>
      In summary: try the type 1 version, and let me know.</p>
