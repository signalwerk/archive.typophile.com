    <p>Welcome everybody,</p>
    <p>I have been wondering for a while what is the Latin name for the pilcrow... I am looking for a good name for my book design company that I am about to establish; I’ve had lots of ideas, unfortunately, as it is common with ideas - many people have them, and the choice is not so satisfactory.</p>
    <p>Eh, anyway, could anyone help me with this? I am getting a bit desperate.</p>
    <p>Thanks in advance,</p>
    <p>przemek debowski</p>
