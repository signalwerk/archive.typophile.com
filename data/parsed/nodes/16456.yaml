      <p>I didn’t know that “calderon” is the Spanish one, in Italian if we say “calderone” it means “a group of messed up things”, “putting together ideas in a confused way”; if we say “to put everything in the same ’calderone’” then it means “to consider/mistake different discordant things in the same way”.  What about “Dostaa” ?  I loved Chimera restaurant in Krakow.</p>
      <p>Szczescie,<br>
      AS</p>
