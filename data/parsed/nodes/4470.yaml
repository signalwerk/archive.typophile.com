    html: <p>I have been using InDesign ME for a little more than a year, and enthusiastically recommend it. The bidirectional text controls are very good, and -- on Windows at least -- a variety of input methods are well supported including system keyboards, import from Office docs and other text formats, and copy-paste (the latter may not always work, but seems more reliable for non-Western text than regular InDesign. The WinSoft developers have also gone to great lengths to ensure that a wide varuety of legacy 8-bit encodings for Arabic are supported, as well as the preferred Unicode encoding. <br> <br>OpenType GPOS mark positioning is supported -- in addition to a couple of other, cruder methods --, and you can also manually adjust the position of marks. The program has the best control I've seen for Arabic and Hebrew vowel marking. <br> <br>My only real complaint is that the current releases do not support contextual mark positioning, which means that I can't use it for Biblical Hebrew without a lot of manual positioning adjustment.</p>
