    html: <p>If you open an ID ME file with bidi text in regular InDesign, you get a warning message that the file contains material associated with the ME text layout plugin. If I remember correctly, you have the option to remove the association and open the file anyway, in which case I presume the text order is messed up. <br> <br>Yes, I think ID ME is still at version 2.0. The CS version was being beta tested very recently -- I was unable to take part because I didn't have time -- so it is presumably fairly close to release.</p>
