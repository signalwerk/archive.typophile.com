  html: <p>Hello - I'm new to this forum having discovered it while searching for information on InDesign ME. <br> <br>I do a large amount of non-English setting work including a fair amount oof Arabic and Hebrew. Until now I have used Quark and the Phonyx XTension, as well as a similar self-built system for Hebrew, using mirrored fonts and a lot of faffing around dealing with reveresed character sequences for Left-Right reading text. <br> <br>InDesign has gradually been building up on my worklist and I've been half dreading the first Hebrew job and half looking forward to it. I've considered using similar mirrored fonts and mirrored text boxes for a forthcoming job, but I have a little lead time and would really like to start doing it properly, so I'm considering purchasing InDesign ME. <br> <br>I'd like to know what other users have experienced with this program, especially with regards to its directional behaviour and what methods of input can be used (both typing and pulling in external files). <br> <br>Are there any gotchas which I may not have considered? <br>All opinions gratefully received.</p>
  html_clean: <p>Hello - I'm new to this forum having discovered it while searching for information on InDesign ME. <br> <br>I do a large amount of non-English setting work including a fair amount oof Arabic and Hebrew. Until now I have used Quark and the Phonyx XTension, as well as a similar self-built system for Hebrew, using mirrored fonts and a lot of faffing around dealing with reveresed character sequences for Left-Right reading text. <br> <br>InDesign has gradually been building up on my worklist and I've been half dreading the first Hebrew job and half looking forward to it. I've considered using similar mirrored fonts and mirrored text boxes for a forthcoming job, but I have a little lead time and would really like to start doing it properly, so I'm considering purchasing InDesign ME. <br> <br>I'd like to know what other users have experienced with this program, especially with regards to its directional behaviour and what methods of input can be used (both typing and pulling in external files). <br> <br>Are there any gotchas which I may not have considered? <br>All opinions gratefully received.</p>
