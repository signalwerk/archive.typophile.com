    <p>I have been attempting to test out Fontforge's MM feature. I have tried various things.</p>
    <p>Here I have created a 3-axis Adobe-style MM font, with 8 masters, using only an uppercase E. I can't get Fontforge to make an interpolation (instance) with these no matter how hard I try.<br>
    This is the font file: <a href="http://21326.info/work/LomoMM.sfd" title="http://21326.info/work/LomoMM.sfd">http://21326.info/work/LomoMM.sfd</a></p>
    <p>I have Googled various things relating to this, and looked through all the documentation, and still got nothing. What am I doing wrong?</p>
