    <p>I thought I’d make a new thread for this to separate it a bit.<br>
    My brief was to create an identity for a homemade cookie company with emphasis on the homemade and traditional elements of the brand.<br>
    I’ve taken the logo in a different direction from my original ideas.</p>
    <p>This logo was my original idea that I wanted to use.<br>
    </p><div class="imageWrap"><img src="/web/20081007180101im_/http://www.typophile.com/files/logo_1_4204.png"></div><p></p>
    <p>This is the different direction that I took it. This logo would be applied by rubber stamp to all the stationary and packaging.<br>
    Because this is quite a small-time company this is commercially viable. I hand drew the lettering and then traced them. Advice on the type would be really appreciated as I have never really done it before.</p>
    <p></p><div class="imageWrap"><img src="/web/20081007180101im_/http://www.typophile.com/files/logo_2_4658.png"></div><p></p>
    <p>Thanks for the feedback in advance.</p>
