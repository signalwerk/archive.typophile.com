  html: |-
    <p>Hello guys, I'm writing to present my new font family called Bommer Slab.</p>
    <p>About the Project:<br>
    Bommer project started in January of 2014 and I am happy to announce the first family - Bommer Slab - is now ready for release. This family includes 14 weights - been seven uprights and seven italics.</p>
    <p>This font has a strong personality, that makes it perfect for use in headline sizes but means it also works gracefully within text blocks.</p>
    <p>Bommer Slab is just the beginning: a rounded version will be launched next month (May 2014) and condensed and sans versions are estimated for the second semester of 2014.</p>
    <p>Website: <a href="http://dootype.com/bommer" title="http://dootype.com/bommer">http://dootype.com/bommer</a></p>
    <p>Myfonts: <a href="http://www.myfonts.com/fonts/dootype/bommer-slab/" title="http://www.myfonts.com/fonts/dootype/bommer-slab/">http://www.myfonts.com/fonts/dootype/bommer-slab/</a></p>
    <p>Thanks!<br>
    Eduilson Coan</p>
