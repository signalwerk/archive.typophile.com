      <p>Couldn't find that "A" at Mike Yanega's Script ID guide. Neither in the six pages of formal flowing scripts nor the nine pages of elegant scripts. But you might look there for something closer to what you're looking for  than the overused Shelley Allegro.</p>
      <p><a class="freelinking external" href="http://bowfinprintworks.com/ScriptIDGuide.html" rel="nofollow">http://bowfinprintworks.com/ScriptIDGuide.html</a></p>
      <p>Incidentally, I couldn't find T-341 on the William Arthur website. Lots of others, though.</p>
      <p> - Herb</p>
