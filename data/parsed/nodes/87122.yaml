      <p>I’m sorry to hear that Whitman is not suiting your needs. If you don’t mind me asking, can you say more about what exactly is disappointing you about its performance at 10.5 pts? (Feel free to contact me offline via the Typophile contact form, if you prefer.) </p>
      <p>I’ve seen a few examples where it was used at that size, and I thought it worked well — although, my personal preference is usually 11pts for a typical 6x9 page layout. </p>
      <p>That aside, from your criteria, I wonder if Adobe’s Chaparral (designed by Carol Twombley) might suit your project. The character is a little more informal. I’ve seen it used to good effect in similar circumstances.</p>
