    <p>Hello, Forum:</p>
    <p>I'm having trouble finding the right font for a certain project. The project is a book release, an edited compilation of the author's notebooks.</p>
    <p>Because the text comes from handwritten notebooks, and is also written in a conversational American vernacular, I've looked for something that suggests "journal" without being a handwriting font; I've also avoided some of the more customary high-quality text fonts I might otherwise use (e.g. Sabon, Trump Mediaeval) holding out for something that looks more "American", something that might even suggest American transcendentalism of the 19th century a la Emerson, Thoreau, etc.</p>
    <p>The best I've come across for these criteria is Whitman. But I'm unhappy with the way Whitman looks at 10.5 pt.</p>
    <p>So I'm after something American, journal-like, with probably a relatively higher x-height -- but a good text font.</p>
    <p>Any suggestions will earn the tender thanks for this poster!</p>
