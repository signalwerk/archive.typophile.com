    <p>Hi.</p>
    <p>I am curios to know your opinion and recommendations about the different offers in advanced/post graduate education for Type Design. I am aware of the programs at Reading University in England and the one at Royal Academie in Holland. Are there other of such quality? If so, which ones? ... Apart from listing other schools, what are the main differences in between those two programs?</p>
    <p>Thanks for any feedback,<br>
    Regards,</p>
    <p>Giovanni</p>
