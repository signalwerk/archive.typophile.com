    html: <p>Alessandro and Hrant, <br> <br>To get an exact pixel count in Photoshop got to Image&gt;Historgram. The 'Pixels' information is the total and the 'Count' is the number of pixels of that level/colour*. It's probably best to have a greyscale or duotone image so you don't have to deal with the colour channels. (I've got PS7) <br> <br>Have fun, <br> <br>Ed <br> <br>*(Edit) Hold the pointer over the graph, click and hold to select a range of levels.</p>
