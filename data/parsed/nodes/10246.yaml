    html: "<p>Raph, <br>that's very nice of you :-) <br>At the moment my brain is locked, due to my duty at work. <br>But I will describe tonight or tomorrow morning what exactly I'd like to be quantified. <br> <br>first hints: <br>1) It would be fine if it could be quantified which quality justified columns have (that's one of the easy things, that also could be done by measuring the gaps, but Fournier may have broader based results). <br>2) The quality of the used fonts (outline, spacing and so on) and micro-typography regarding evenness of the page.  <br>3) There are different editions in which verse numbers are set in bold or to big, thus making the text page very uneven and so distracting concentration from the text itself.  <br>4) I think of course the space outside the column will have its influence on the perception of evenness too, but for a comparison should be omitted. <br>5) Not at least: The opacity of the paper and evenness of baselines between front and back also  takes influence on legibility/readability or quality of typesetting.  <br> <br>I have scans (not all yet) of about 40 to 50 different german editions of the bible (find a list of used fonts in the above mentioned thread \"Paul Saenger\").  <br>And would, if possible, try, if there could be a measured objective confirmation (as an addition) of typographical observations. Also I would find it interesting if there could be something like a quality scale in which those quantification could be enclosed - and from which you could compare different editions. <br> <br>Because I also want to try to bring awareness of skilled sophisticated typography to people, who don't know anything about typography, than \"take Arial for your letters, it looks modern\" - and those people often look at typographical questions as \"that's a matter of taste \" - a quantifiable look on evenness could help. <br> <br>So it would be very interesting if you could cook something up. <br> <br>ms</p>"
