    html: "<p>You mean like with Photoshop? Hmmm. Try this: <br>1) Make the canvas much bigger, with your original image centered and on a white background. <br>2) Apply a ridiculous amount of Gaussian Blur. <br>3) Measure the gray level = GL. <br>4) Calculate:  (GL / 256) x X x Y , where X and Y are the original dimensions of your image block. The result will be the number of white pixels in the original, within ~4% accuracy. <br> <br>hhp</p>"
    html_clean: "<p>You mean like with Photoshop? Hmmm. Try this: <br>1) Make the canvas much bigger, with your original image centered and on a white background. <br>2) Apply a ridiculous amount of Gaussian Blur. <br>3) Measure the gray level = GL. <br>4) Calculate:  (GL / 256) x X x Y , where X and Y are the original dimensions of your image block. The result will be the number of white pixels in the original, within ~4% accuracy. <br> <br>hhp</p>"
