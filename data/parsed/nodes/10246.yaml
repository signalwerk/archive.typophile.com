    html: <p>&gt;Can anyone point me towards some reading on the topic of typographic color and how to design for optimal color when creating a text face? <br> <br>Maths and theory are not the answer, Paul. <br>If you want to understand text color, I would suggest finding a sample of letterpress printing which you think is immaculate, and attempting to mimic it by recreating the typeface digitally, by eye, from scratch. That means looking at the printed type through a magnifying glass, rather than scanning it and tracing it.</p>
