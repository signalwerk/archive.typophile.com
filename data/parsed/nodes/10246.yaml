    html: "<p>Raph, sorry, <br> <br>I have a lot of work at the moment, so it took a while to get back to my paper/thesis. <br> <br>If Fourier analysis is capable of giving a numerical judgement on evenness of spacing it should as well be possible to measure the evenness of a whole column. <br>Of course then you have a mix of all: good spacing could be overrun by poor justification, as well as good justification by bad type spacing. And both by the use of bold verse-numbering within the text.  <br>And of course fonts themselves have different values of evenness (it would be a very interesting  thing to me to measure if Rotis is objectively mor uneven than other fonts - and how much). <br>But at least there should be a result for the complete perception of evenness. <br>Maybe in another step you could take out one factor by the other (maybe by filling white spaces with sample text or neutral color from the page itself and so measuring the evenness of type only). <br>I really don't know if results will be significant, and if Fournier analysis would lead to usable results, but I would like to try. <br> <br>So maybe you can show me how to make Fourier analysis of a text column or cook something that can help. <br> <br>Sprechen Sie auch deutsch?</p>"
    html_clean: "<p>Raph, sorry, <br> <br>I have a lot of work at the moment, so it took a while to get back to my paper/thesis. <br> <br>If Fourier analysis is capable of giving a numerical judgement on evenness of spacing it should as well be possible to measure the evenness of a whole column. <br>Of course then you have a mix of all: good spacing could be overrun by poor justification, as well as good justification by bad type spacing. And both by the use of bold verse-numbering within the text.  <br>And of course fonts themselves have different values of evenness (it would be a very interesting  thing to me to measure if Rotis is objectively mor uneven than other fonts - and how much). <br>But at least there should be a result for the complete perception of evenness. <br>Maybe in another step you could take out one factor by the other (maybe by filling white spaces with sample text or neutral color from the page itself and so measuring the evenness of type only). <br>I really don't know if results will be significant, and if Fournier analysis would lead to usable results, but I would like to try. <br> <br>So maybe you can show me how to make Fourier analysis of a text column or cook something that can help. <br> <br>Sprechen Sie auch deutsch?</p>"
  - id: 65002
    user: 3528
    date: 2005-04-22T12:51:00
    date_raw: 22.Apr.2005 12.51pm
    votes: null
    html: "<p>Michael:  <br> <br>I think that Fourier analysis can give some numbers <i>related</i> to perception of 'evenness', but I doubt that any such mechanically derived number can replace or even come close to a panel of human experts. What Fourier analysis can do is to give you some spatial characteristics you can compare with your own evenness ranking; you'll be the judge of correlation.  <br> <br>Also, Fourier works best on stems, lines, and spacing; it is less usable for analysis of closed areas and round features - if you want numbers, you will need some other basis for those.</p>"
    html_clean: "<p>Michael:  <br> <br>I think that Fourier analysis can give some numbers <i>related</i> to perception of 'evenness', but I doubt that any such mechanically derived number can replace or even come close to a panel of human experts. What Fourier analysis can do is to give you some spatial characteristics you can compare with your own evenness ranking; you'll be the judge of correlation.  <br> <br>Also, Fourier works best on stems, lines, and spacing; it is less usable for analysis of closed areas and round features - if you want numbers, you will need some other basis for those.</p>"
  - id: 65003
    user: 1291
    date: 2005-04-22T14:09:00
    date_raw: 22.Apr.2005 2.09pm
    votes: null
    html: "<p>Sergei, <br> <br>of course, I never thought mathematical analysis could replace human experts. I also much more rely on skilled human experts.  <br>And I think a judgement of significance has to be done - and maybe at the end of testing the result will be that Fourier analysis or any other mathematical approach won't show anything. <br> <br>I'm not keen for numbers - I only followed some trace that may lead to another confirmation of old human skills - and maybe my German scientific brain (-half) demanded food ;-) <br> <br>There is/maybe one point I am setting some expectations on: <br> <br>Human experts in typography are not regarded highly in our time. Especially by the millions of people who think with a computer they now can do the same things as learned typographers before. <br> <br>I'm working with half of my time in the church. And though church has been a custodian of the word and long time also of the written form of the word, nowadays there is almost nothing left of skill and care. <br>Asking experts when setting printed matter is a rare exception. Often their judgement is taken as personal taste. If I tell sometimes \"this or that layout is uneven\" people don't believe because the edges of the column are mathematical straight. They look for things that can be measured. They don't see inner unevenness. It takes some time to open eyes (of course that's a job I like very much: open eyes for aesthetical decisions, care and skill for words and script). <br>And it would help, if there were a mathematical way to show: \"Here you can see in an objective number, what experts already have said about that layout.\"  <br>Maybe it would help to raise typographical awareness.</p>"
    html_clean: "<p>Sergei, <br> <br>of course, I never thought mathematical analysis could replace human experts. I also much more rely on skilled human experts.  <br>And I think a judgement of significance has to be done - and maybe at the end of testing the result will be that Fourier analysis or any other mathematical approach won't show anything. <br> <br>I'm not keen for numbers - I only followed some trace that may lead to another confirmation of old human skills - and maybe my German scientific brain (-half) demanded food ;-) <br> <br>There is/maybe one point I am setting some expectations on: <br> <br>Human experts in typography are not regarded highly in our time. Especially by the millions of people who think with a computer they now can do the same things as learned typographers before. <br> <br>I'm working with half of my time in the church. And though church has been a custodian of the word and long time also of the written form of the word, nowadays there is almost nothing left of skill and care. <br>Asking experts when setting printed matter is a rare exception. Often their judgement is taken as personal taste. If I tell sometimes \"this or that layout is uneven\" people don't believe because the edges of the column are mathematical straight. They look for things that can be measured. They don't see inner unevenness. It takes some time to open eyes (of course that's a job I like very much: open eyes for aesthetical decisions, care and skill for words and script). <br>And it would help, if there were a mathematical way to show: \"Here you can see in an objective number, what experts already have said about that layout.\"  <br>Maybe it would help to raise typographical awareness.</p>"
