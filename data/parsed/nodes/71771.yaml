    <p>This is a request for a font, either existing (best—saves effort) or new (great project for a typophile). It’s non-commercial, so payment can only be in the form of acknowledgement. </p>
    <p>I’m part of a group that hosts port tastings — for ourselves, not as a business. Port bottles used to be labelled with a physical stencil (you can see where this is going) through which white paint was sprayed or painted. Examples of such bottles: <a class="freelinking external" href="http://www.jdawiseman.com/port/20100629_20071029_k85.jpg" rel="nofollow">1</a> <a class="freelinking external" href="http://www.jdawiseman.com/port/20100629_20080103_colheita1.jpg" rel="nofollow">2</a> <a class="freelinking external" href="http://www.jdawiseman.com/port/20100629_20080103_colheita2.jpg" rel="nofollow">3</a> (with apologies for the focus problem in the second and third pictures).</p>
    <p>At a tasting it is important that people don’t get confused. There must always be a clear answer to the question <strong>What is in this glass?</strong>. For which purposes there is PostScript program (author: yours truly) that makes all the paperwork required to organise a large tasting.</p>
    <ul>
    <li><a class="freelinking external" href="http://www.jdawiseman.com/papers/placemat/placemat.html" rel="nofollow">Manual for PostScript program</a>, leading to
    </li><li><a class="freelinking external" href="http://www.jdawiseman.com/papers/placemat/placemat.ps" rel="nofollow">PostScript code itself</a>.</li></ul>
    <p>Within the manual page is a <a class="freelinking external" href="http://www.jdawiseman.com/papers/placemat/placemat.html#examples" rel="nofollow">paragraph of links to examples of the output</a>, or readers might prefer to start with <a class="freelinking external" href="http://www.jdawiseman.com/papers/placemat/placemat.png" rel="nofollow">a simple PNG example</a>. </p>
    <p>The titles in the centre of the circles should be a font which really should be called <code>VintagePortStencil</code>. Characters needed are:
    </p><ul>
    <li><strong>ABCDEFGHIJKLMNOPQRSTUVWXYZ</strong>;</li>
    <li><strong>abcdefghijklmnopqrstuvwxyz</strong>;</li>
    <li><strong>0123456789</strong> (upper case only);</li>
    <li><strong>áñçé</strong> (as in Cá (Cálem), Mñ (Quinta do Mañuela), Pç (Poças), Cç (Morgadio da Calçada), Ré (Réccua));</li>
    <li><strong>+</strong> (as in Pt+);</li>
    <li><strong>&amp;</strong> (as in Silva &amp; Cosens, Marks &amp; Spencer);</li>
    <li><strong>?</strong> (as in unknown).</li>
    </ul>
    <p></p><p>Is there such a typeface already? Does anybody have the time energy enthusiasm to make one? Am I asking in the right place? Does this forum have a rule banning such requests?</p>
    <p>FYI, I have started (a currently content-free) discussion on the same subject at <a class="freelinking external" href="http://www.ThePortForum.com/viewtopic.php?t=4105" rel="nofollow">www.ThePortForum.com/viewtopic.php?t=4105</a>.</p>
    <p>Thank you very much.</p>
