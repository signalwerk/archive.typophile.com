      <p>Mystery stencil is way too light, and nothing like the lettering seen on bottles of vintage port. But thank you for looking for me.</p>
      <p>A non-obvious observation on minuscules. Minuscules don’t usually appear on stencilled bottles. But the <a class="freelinking external" href="http://www.jdawiseman.com/papers/placemat/placemat.html" rel="nofollow">placemats</a> need them. In the centre of each circle ports are generally identified with an abbreviation. These abbreviations are becoming quite standardised. E.g.:
      </p><ul>
      <li>G70 = Graham’s 1970;</li>
      <li>S70 = Sandeman 1970;</li>
      <li>C85 = Cockburn 1985;</li>
      <li>Cr85 = Croft 1985;</li>
      <li>CR83 = Croft Quinta da Roeda 1983;</li>
      <li>Pç77 = Poças 1977;</li>
      <li>RO85 = Royal Oporto 1985;</li>
      <li>Ro85 = Rocha 1985;</li>
      <li>Cá85 = Cálem 1985.</li>
      </ul>
      <p></p><p></p><div class="imageWrap"><img src="http://typophile.com/files/placemat_5681.png"></div><p></p>
