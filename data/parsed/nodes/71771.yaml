      <p>The next tasting for which placemats are being prepared, Utrecht 9th July (<a class="freelinking external" href="http://www.theportforum.com/viewtopic.php?t=3621&amp;view=unread#unread" rel="nofollow">thread</a>), has <a class="freelinking external" href="http://www.jdawiseman.com/port/20100709_fonseca.pdf" rel="nofollow">placemats</a> that are a mere 2¼k per page. (Cue the audience being impressed.) I’d like to keep things tight.</p>
