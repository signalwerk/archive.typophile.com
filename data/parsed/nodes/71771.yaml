      <p><cite> &gt; A man of good taste—albeit impractical transport arrangements.</cite></p>
      <p>Yes, I realized that after checking your profile. And obviously, I was being a bit facetious.</p>
      <p><cite> &gt; How about I throw in a large and very useful piece of software for organising tastings?</cite></p>
      <p>Well, my neighbor (and the source of most of my vintage port collection) is the publisher of <em>Wine &amp; Spirits</em> magazine and he keeps me straightened out, so I’m afraid I have little use for tasting software. Sorry. ;-)</p>
      <p>Julian, I think the challenge here is that you have very specific aesthetic requirements which any currently available face is unlikely to meet. There have been several reasonable approximations suggested, none of which is close enough for you. </p>
      <p>I do understand why these don’t satisfy your sensibilities (I was just looking at some Kopke bottles the other day); but as you acknowledge, any font that does will not likely have any other commercial potential. So this project would essentially be a labor of love. And unless you can find someone with the skills and time *and* who shares your specific interest in this pet project, it’s not likely to materialize.</p>
      <p>You may have to decide whether to compromise with one of the given suggestions, in order to get something at least a bit more suggestive of stenciled port bottles, or just stick with what you have. Finding a perfect match is looking unlikely.</p>
      <p>Best of luck to you.</p>
