    html: |-
      <p><cite>It’s non-commercial, so payment can only be in the form of acknowledgement.</cite></p>
      <p>This is indeed naive or bold, because it wouldn’t be a conjoint project. You ask, whether somebody can do something for <em>you</em>. You don’t ask, whether somebody is interested in a conjoint project with task sharing. The absolute minimum payment would be an enhancement of the designer’s reputation, but in case of a non-commercial winetasting I assume, that the designer couldn’t increase his reputation. So his only motivation could be the interest in your project. But he could not really participate, if it remains <em>only</em> your project. I doubt, that you find someone, who is willing to invest months of work just for your acknowledgement. Renovating my rooms would be also a non-commercial project. But in those cases I am asking my friends, which requires a counterperformance sooner or later, or I am paying a craftsman. But I would not ask strangers, whether they are willing to help me just for fun.</p>
