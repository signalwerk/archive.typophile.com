      <p>Mmh, I don’t know, where the word material is missing, because a material acknowledgement would be more than only an acknowledgement.</p>
      <p><cite>if somebody is willing to add such a typeface to their library of fonts for sale at ‘usual’ cost, I’d buy one.</cite></p>
      <p>This would be naturally okay. But I doubt, that the designer can simply make a stencil font from one of his existing fonts, because the outlines cannot become arbitrary broken. And most fonts could probably not changed in that way, at least not, if they shall not be pure deco stencils. It probably would be less work than creating a stencil font from the scratch and not necessarily worse. But if the designer was not already interested in creating such a font, he probably is asking, how big the market for such a font is.</p>
