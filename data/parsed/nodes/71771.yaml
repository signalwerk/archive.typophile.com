      <p>Thank you. </p>
      <p>A typical port house might declare a vintage of a few thousand cases: call it twenty thousand bottles. Some houses many more. So the physical stencils had to be very robust.</p>
      <p>Plantain Stencil has several delicate cuts, not needed for the purpose of holding together a metal stencil, and delicate in appearance. E.g., compare with <a class="freelinking external" href="http://www.jdawiseman.com/port/20100629_20071029_k85.jpg" rel="nofollow">example 1</a> the ‘K’ (top-right cut) and ‘N’ (both cuts redundant).</p>
      <p>From the other list the obvious choice is Stencil Antiqua, which has the same problem in the ‘5’ and the ‘N’, though the ‘K’ is excellent.</p>
      <p>I’m after a robust stencil, in style late-Victorian or early-20C English. These modern stencils could withstand hundreds of thousands of digital uses, but not twenty thousand physical bottles.</p>
      <p>Edit: happy to cough up for the right font. But not to pay thousands.</p>
