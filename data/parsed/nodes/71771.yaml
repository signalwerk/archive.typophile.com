      <p>Everything you say seems reasonable. But there’s no harm in asking: it is on this website that somebody who had the same problem might have posted the answer; or somebody who wants a problem with which to inspire such a labour of love. Rejection was always possible.</p>
      <p>Several times I have linked to <a class="freelinking external" href="http://www.jdawiseman.com/papers/placemat/placemat.html" rel="nofollow">www.jdawiseman.com/papers/placemat/placemat.html</a>, and I have found it a little surprising that typographers have taken so little interest a program, 9k lines of hand-coded open-source PostScript, that does precise page layout. Please take a look. It is a labour of love, used by fewer than a score of people, that deserves to be more widely used. Your <cite>Wine &amp; Spirits</cite> neighbour might love it too.</p>
