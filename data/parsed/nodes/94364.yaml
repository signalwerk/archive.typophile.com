    html: <p>I think it is a good move also. This was not a hostile takeover or a 'coup-de-font'. It is a very well considered mutual arrangement that is intended to be a benefit for all parties concerned. I trust Patrick to take the collection to a level that that we cannot commit to at this point in time. The scholarship program is a fitting and great extension of what Jim Rimmer was about. We look forward to future releases from RTF.</p>
