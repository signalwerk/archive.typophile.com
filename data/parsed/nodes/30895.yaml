    html: "<p>I can't give advice from personal experience (my excuse is that I've been too swamped to do my own portfolio and/or website) but I think you will need a website and a physical \"portfolio.\" Whether it is an actual portfolio, or a brochure, or single pages in a folder. Keep it easy to update and cost-effective. I have taken photos of work against a white background, and also just used the actual digital files. Personally I don't think people will want to bother with a dvd or cd portfolio. That was big 10 years ago. I have also done a .pdf brochure that I can easily e-mail. That seems to work well too. I would also recommend this book: <a href=\"http://www.amazon.com/Building-Design-Portfolios-Innovative-Presenting/dp/1592532233/sr=8-1/qid=1169824457/ref=pd_bbs_sr_1/002-9561818-4234445?ie=UTF8&amp;s=books\" rel=\"nofollow\">Design Portfolios</a></p>"
