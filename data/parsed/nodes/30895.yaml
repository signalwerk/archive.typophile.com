      <p>I dunno how it works elsewhere, but I don't have a printed portfolio, rather a folder of actual printed matter I take with me when going to a first meeting with a prospective client. The contents of the folder is adjusted according to the clients needs (i.e. magazines for magazine publishers, logos for people looking for a new logo etc + a few extras). I only leave a calling card (with a newish website mentioned in it) behind. It seems to work just fine here in the nothern parts of Europe.  Nobody ever wants to see my CV. I might get asked about agencies and clients I've worked for, but no written recommendations or referencies are needed as such. Mind you, I often get a call from somebody who had me recommended by a former colleague or a client.</p>
      <p>If I understand correctly, in the USA one has to build a potfolio to be left behind? How is it in other countries?</p>
  - id: 180497
