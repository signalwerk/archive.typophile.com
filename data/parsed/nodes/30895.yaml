      <p>"So, i’ve been toying with the idea of making a cd or dvd" </p>
      <p>IMHO, that's a waste of time. If you're going to make a CD or DVD, just put the stuff up on your web site in the first place.</p>
      <p>Sending a CD or DVD requires that the person looking at the mail (Art Director/Senior Designer/HR/etc) will want to go back to their computer, insert the CD, and know what to do. It sounds silly, but for a lot of people, that's just too much to bother with and they'll just go on to the next candidate.</p>
      <p>"anyone have any creative alternatives to the online portfolio they’d like to"</p>
      <p>More practical than creative: paper. ;o)</p>
      <p>Granted, I'm not one to talk, as I haven't updated my portfolio (online or on paper) in years...though I am in the process of doing just that.</p>
      <p>In the end, I'm going to have my portfolio online, and then an 8.5 x 11 paper portfolio bound using medical binder clips. Easy to customize and cheap to produce on a color laser printer. Easy to leave behind. Yet still substantial enough that someone might pick it up when they see it on their desk.</p>
