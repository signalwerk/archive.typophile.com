    <p>So, after years of personal/volunteer design work for all sorts of different projects, i've decided to become a full-time designer. I've spent the past 2 months juggling different ideas for portfolios, but can't seem to find my preferred medium. Website, is the obvious first idea, currently that version of the portfolio is almost complete. But I can't help but feel like online portfolios are "selling" people short. There are so many limitations: no one wants to scroll through pages of .pdfs, no matter how crisp or elegant. alternatively, a few snapshots won't do most print projects justice, especially to the prospective client.  I also don't want to bother someone with a bulky physical porftolio, especially because I'd only have a certain amount of them (maybe only one for awhile!) and i'd have to keep track of who had it and who gets it next and ugh, what a headache.</p>
    <p>So, i've been toying with the idea of making a cd or dvd of my work with two folders: a complete works folder and a summarized works folder both covering the same projects, but the summarized one would be highlight material of course. photo's of the final product, some pdf excerpts, and so on. </p>
    <p>anyone have any creative alternatives to the online portfolio they'd like to share? the business aspect of design work hasn't been present in any of my experience, and as i'm slowly signing up on projects i'm trying to use my intial resources wisely.</p>
    <p>also: what kind of experience do people have with computer-illiteracy? I live in a very small town, and most active projects are managed by people who don't know the first thing about how to use a computer, let alone design something using it—for these people, i need to make special considerations when planning my portfolio schematic.</p>
