      <p>What's worked for me in Canada is pretty similar as yours, Mili: depending on the prospective client, I pull things out of the Box of Fame to show my track record doing (what they're looking for), plus some of the things I've won awards or are most recent, or have a nice colour palette. </p>
      <p>It appears that "portfolio" is often used to refer to the whole set of items one has to choose from, but I've always thought that one's portfolio would only fit inside a nice case to take to clients.  For students, it probably would, I guess, but anyone who has worked seriously for more than a year or two will have way more than that, assuming they've been successful.</p>
