      <p>"What exactly is a medical binder clip? I did a quick search and came up empty. The reason I ask, I, too am getting my portfolio together and always on the look out for easy, yet clean ways to fasten a portfolio together."</p>
      <p>You're not the first person to ask me this. ;O)</p>
      <p>I've always used that term because they are the same thing used in old medical folders.</p>
      <p>Anwyays, I found them at officemax. I guess they're called 'saftey prong fasteners':</p>
      <p><a href="http://www.officemax.com/max/solutions/product/prodBlock.jsp?BV_UseBVCookie=yes&amp;expansionOID=-536879754&amp;prodBlockOID=1611532334" title="http://www.officemax.com/max/solutions/product/prodBlock.jsp?BV_UseBVCookie=yes&amp;expansionOID=-536879754&amp;prodBlockOID=1611532334">http://www.officemax.com/max/solutions/product/prodBlock.jsp?BV_UseBVCoo...</a></p>
      <p>They are cheap and give it a nice industrial feel. Plus, they're easy to undo during an interview if pieces need to be passed around.</p>
      <p>"If I understand correctly, in the USA one has to build a potfolio to be left behind?"</p>
      <p>Oops! Mili corrected me. Sorry, circehouse...I was describing a 'get a job at an employer' type portfolio. You were after what Mili was referring too. In the small firms I've worked at, we did a combo of what Mili does (just bring samples) and 'case study' portfolios in the 8.5x11 format. The main reason for the latter is a lot of our stuff was web based. Plus, it's nice to leave something behind...you usually don't want to leave actual printed samples behind as you end up running out of those. ;o)</p>
      <p>My favorite portfolio was when Chank stopped by our offic. He just ran to Target and bought all the candy that was using one of his fonts. It was impressive to see his work plastered all over the products, plus, it made for a really nice leave behind (mmmm...candy...)</p>
