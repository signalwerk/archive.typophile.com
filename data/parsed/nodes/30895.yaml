      <p>Don't over egg your pudding, nobody wants to look at extensive images of somebody else's project, 3 or 4 case studies is fine, just sell the services you are providing. A small simple brochure will be looked at by most people, DVD's take time and if they don't appeal to prospective clients in the first 30 seconds they're in the bin. </p>
      <p>Those hicks that can't use a computer are hopefully going to be providing your livelihood, so make sure you speak their language, you need them, they don't need you.</p>
      <p>Bon chance mon ami!</p>
