    html: |-
      <blockquote><p>I have to go with free ones.</p></blockquote>
      <p>May I ask why that's the case?</p>
      <p>By "coarse" I meant that the outlines are very wobbly, noticeably more so than in the Latin.</p>
      <blockquote><p>I hate varying x-heights...</p></blockquote>
      <p>People do like to line things up! But when it comes to reading-size text (as opposed to display typography) I believe there are more important factors, and people don't notice misalignment. When it comes to the way Latin and Greek each use the "Cartesian space" there seems to be a need to make Greek's "x-height" bigger (and at the expense of the ascenders, not the descenders). Admittedly few people actually do this when designing such a multi-script typeface, but I think it's just a matter of people getting over their desire to line things up and seeing the benefits of breaking the alignment. Note for example how in Latin the ascenders are usually better when they're slightly taller than the caps, not lined up.</p>
      <p>BTW there's a very long -if valuable- recent thread about Greek typography:<br>
      <a href="http://typophile.com/node/101331" title="http://typophile.com/node/101331">http://typophile.com/node/101331</a><br>
      Yulia in that thread has actually made the Greek "x-height" bigger in her work.</p>
      <p>hhp</p>
