      <p>Lukáš,</p>
      <p>On Junicode: perhaps I have a personal idiosyncrasy with (digital) Caslon, or this fonts looks somehow unresolved to me. But it's hard to judge a typeface only onscreen, and if you're happy with it, go with it.</p>
      <p>On headings sub-level and indent alignment: now (I think) I got what you mean, and it's not that disturbing for me.</p>
      <p>On old style figures: if you use them in the roman weights, I think you should also use them in the bold (and also in small caps: "2. Loux’s arguments...")</p>
      <p>On running headers: I wouldn't separate them from the body text with a rule (also consider that in some pages you already have a line above the footnotes). Simply set them in one single line with the right (visual) distance from the first line of text.</p>
