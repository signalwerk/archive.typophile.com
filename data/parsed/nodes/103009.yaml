      <p>Nicolacaleffi: Thanks for your thoughts, let me comment:<br>
      - I must say that I like the Junicode face the more the more I am using it; what is your problem with it?<br>
      - My problem with the headings is that there seems to be no way in the second-level heading to align the text (i.e. what comes after the number) with the paragraph indent of the following paragraph. Or is it just my problem and noone else is bothered by the slight difference? (In third-level headings the problem is not so painful, since the three numbers and two dots push the text so much to the right that the alignment with paragraph indent is not visually expected (at least not by myself).<br>
      - There are old-style figures for all weights and styles, but they seemed to me out of place in headings.  I know the relationship between old-style and lining figures is not precisely equivalent to that of lowercase to uppercase letters, but to a certain point there is an analogy. Do you think this notion is wrong?<br>
      - I will consider your other suggestions, especially the running headers. Concerning these - do you think a rule separating the header from the body text might be a good alternative idea?<br>
      Thanks a lot!</p>
