      <p>Lukáš,</p>
      <p>the editorial content of the journal looks complex, so I think that, in general, you have made a good work, althought I don't totally go along with the Junicode typepace.</p>
      <p>On running heads (on top): try to keep author and article title on one single line, set everything in small caps (without initial caps)</p>
      <p>On level headings (102-103): your choice seems correct, having set the first level (Loux’s arguments) in small caps and the second one (The argument from change) in upper and lower case. I don't know if the bolds are the best choice, I usually set paragraphs' title in italics. Anyway, I wonder if in the main text typeface the bold old style figures aren't available.</p>
      <p>Besides that, a couple of suggestions:</p>
      <p>The ornamental break is elegant but looks too large; I would choose a less invading element.</p>
      <p>On the articles' title pages (for example, p. 28), I would align the title on top margin.</p>
      <p>The colophon page looks too dense; try a smaller size for texts.</p>
      <p>Maybe, I would extract the "Articles" indication on page 13 and put it in a single page (11); or, if you keep it on the same page, set it smaller (same for Notes and discussions on page 89, and Review Articles on 99).</p>
      <p>Hope it helps.</p>
