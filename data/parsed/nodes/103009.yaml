      <p>Hrant,</p>
      <p>well, beimg a poor academic institution we are doing a low-cost journal, I am an editor and typesetter in one, unpaid for that work, all around us the standard is "just use Times New Roman and don't make such a fuss about it" - so I do not feel like asking the publisher to buy a professional font for a few Greek words in an issue. Besides, I started typesetting 10 years ago as a complete amateur, and only taught myslef things "by doing". I have some confidence now, but not enough to trust myself so much as to dare to convince someone that we really need to buy just this one very expensive font and no free one will do.</p>
