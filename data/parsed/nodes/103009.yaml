    <p>Dear experts,</p>
    <p>would anyone  care to comment on the composition as sampled in <a class="freelinking external" href="http://neoaristotelica.eu/download/sample.pdf" rel="nofollow">this file</a>?</p>
    <p>More specifically, I would like to hear your opinions on the following points:<br>
    1) How do you find the pairing of the greek  and latin fonts (p. 15)?<br>
    2) Running headers look a bit weird above secondary titles and headings (p.26). Can anything be done about that?<br>
    3) P. 102-103 illustrates a problem with second-  (or more-) level headings. The first-level heading can be tabbed so that the text of the heading alingns with left indent of the paragraph below. But it is not possible with lower headings, since there is to little space. Increasing the paragraph indent would not work because the number in the first-level heading would be too far from the text of the heading. Surely I am not the first person to be solving this problem?</p>
    <p>Thank you for any input.</p>
    <p>Nolmendil</p>
