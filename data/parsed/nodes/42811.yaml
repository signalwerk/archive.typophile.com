    <p>I am looking for a sans serif typeface that suggests science, technology, and mathematics without seeming clichéd or trite. I am looking for something with enough character to be distinctive, but still appropriate for an academic publication.</p>
    <p>This is for a redesign of a magazine for a college of physical and mathematical sciences. The institution and the magazine are fairly traditional and academic. Articles mostly deal with research conducted by students and faculty. The audience is primarily students and alumni in the college.</p>
    <p>The typeface will be used for things like cover lines, pull quotes, headlines, subheads, etc. It will range in size from about 10 to 18 points, and will be paired with something like minion or caslon for body copy. It would be nice to have a decent range of weights.</p>
    <p>My first choice now is DIN, but it seems a bit overused and obvious. Any suggestions will be very appreciated. Thanks.</p>
