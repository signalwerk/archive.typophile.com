    html: |-
      <p>I don't think CT makes use of the 'hdmx' table as it is contrary to the mechanism of ClearType. Even if you were able to apply hints to such a glyph, I think you might run into some problems under ClearType.</p>
      <p>As I mentioned, I think it is technically *possible* to have hints on a glyph with zero contours; the 'glyf' table definition would appear to allow it:<br>
      <code><br>
      Type	Name	Description<br>
      SHORT	numberOfContours	If the number of contours is greater than or equal to zero, this is a single glyph; if negative, this is a composite glyph.<br>
      SHORT	xMin	Minimum x for coordinate data.<br>
      SHORT	yMin	Minimum y for coordinate data.<br>
      SHORT	xMax	Maximum x for coordinate data.<br>
      SHORT	yMax	Maximum y for coordinate data.</code></p>
      <p>USHORT	endPtsOfContours[n]	Array of last points of each contour; n is the number of contours.<br>
      USHORT	instructionLength	Total number of bytes for instructions.<br>
      BYTE	instructions[n]	Array of instructions for each glyph; n is the number of instructions.<br>
      BYTE	flags[n]	Array of flags for each coordinate in outline; n is the number of flags.<br>
      BYTE or SHORT	xCoordinates[ ]	First coordinates relative to (0,0); others are relative to previous point.<br>
      BYTE or SHORT	yCoordinates[ ]	First coordinates relative to (0,0); others are relative to previous point.</p>
      <p>Such a glyph would/should look something like this:<br>
      <code><br>
      0000 - numberOfContours, 0<br>
      0000 - xMin<br>
      0000 - yMin<br>
      0000 - xMax<br>
      0000 - yMax<br>
      ---- - no entry for endPtsOfContours since 'numberOfContours' = 0<br>
      0004 - instructionLength, 4 bytes<br>
      ii - instruction byte 0<br>
      ii - instruction byte 1<br>
      ii - instruction byte 2<br>
      ii - instruction byte 3<br>
      ---- - no flag or x/yCoordinates since there are no contours, no points</code></p>
      <p>I think the trouble begins further upstream than this, though, because it seems most font tools implement a rule that when there are no contours, a blank 'loca' table entry will be made; thus no space is allocated in the 'glyf' table for any instructions.</p>
      <p>I have been meaning to experiment and try editing a 'loca' and 'glyf' table to insert instructions on a zero-contour glyph, to see if it would be interpreted correctly.</p>
      <p>Did you try adding a single point to the glyph, then adding hints? Not sure whether FontLab allows this and haven't had time to play with that yet...</p>
