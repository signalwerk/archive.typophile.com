      <p>I know the pure TT hinting tools generally available do not allow hinting from origin to set width and I cannot tell you why.<br>
      I don't know what the hints from FL will look like. If you can write the hints by hand, they'd say:<br>
      SRP0[], (Place number of origin point here)<br>
      RUTG[flags], (Don't forget to set flag to round)<br>
      MDRP[], (Place number of set width point here)</p>
      <p>You might also look into editing the horizontal device metrics table (hdmx), if you are targeting an application that uses it. </p>
      <p>Cheers!</p>
