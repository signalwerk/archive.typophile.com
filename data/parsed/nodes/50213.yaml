      <p><em>“The idea in hinting the space glyph was to make sure the text is never wider on screen than in print with a certain application.”<br>
      If the application is using fractional metrics to approximate the appearance of print, this should not be a problem, should it?</em></p>
      <p>Sorry, I got confused ... I meant "to make sure the text is never <strong>wider in print</strong> than on screen".</p>
      <p>It looks like this application is using the system renderer on Windows, but the width of text on screen changes even with different zoom levels. So, fractional metrics in theory when ClearType is turned on, but the application seems to do some strange things.</p>
      <p><em>Did you try adding a single point to the glyph, then adding hints? Not sure whether FontLab allows this and haven’t had time to play with that yet...</em></p>
      <p>FontLab seems to leave out open contours when generating the font, even though it asks whether it should export them. So the space glyph with one point and some instructions has neither a point nor any instructions in the generated font ... just an empty glyph.</p>
      <p>Jens</p>
