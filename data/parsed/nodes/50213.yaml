      <p>"The idea in hinting the space glyph was to make sure the text is never wider on screen than in print with a certain application."<br>
      If the application is using fractional metrics to approximate the appearance of print, this should not be a problem, should it?</p>
      <p>"Even if you were able to apply hints to such a glyph, I think you might run into some problems under ClearType."<br>
      I'm not sure what you mean, unless it is that CT will ignore x hints that modify character widths, which is only a problem if you don't want it to, i.e. you are interested in the quality only on the screen. </p>
      <p>Cheers!</p>
