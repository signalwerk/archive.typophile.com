    <p>Hi,</p>
    <p>I'm trying to hint the space glyph in a TrueType font and I'm not sure if the result I get is a bug in FontLab, or if there's some other reason for this ...</p>
    <p>I'd like to round up the width to the full pixel. This works using the same instruction on all glyphs which contain outlines, but in the space character the width always rounds to the closest pixel edge, as indicated by the light blue line in the image - and not the right edge as I would expect it to.</p>
    <p>Any ideas?</p>
    <p>Thanks,<br>
    Jens</p>
