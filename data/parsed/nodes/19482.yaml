      <p>Or printing trade publications/advertisement. Sadly, my little library is not that well equipped ...</p>
      <p>But then: There is the "Handbuch der Schriftarten" (1926-) which shows typefaces of different foundries -- by similarity. With this in mind, I wonder if *only* searching magazines would suffice to decide whether a typeface appearing in a magazine is grotesk a from foundry A or grotesk b from foundry B, because they were almost identical.<br>
      That discussion today is centered around Akzidenz Grotesk so much, with some Schelter &amp; Giesecke Breite Grotesk here and there (but only because of the revival which serves as a reminder), is a bit funny if we take into account that at its time, AG was but one among many, all of them very similar to each other. Even to experts' eyes. Similarly, almost every German foundry hat a Breite Grotesk, some better, some worse.</p>
