      <p>More on early Grotesks and their use for text setting:</p>
      <p>"In 1830 this firm [Schelter und Giesecke] held a bold upper and lower case roman [grotesque] in fifteen sizes, and by 1850 had added a condensed in no less than nineteen sizes, of which three included a choice of body size. Steinschrift, as the design was named, was obviously intended for text setting rather than for eye-catching display."</p>
      <p>P.M. Handover: “Grotesque Letters”, Monotype News Letter 69, March 1963 (provided by Karsten Luecke). [The source can be doubtful (as discussed above).]</p>
