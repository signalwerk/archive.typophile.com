      <p>&gt; It can be found in part one of the Muster-Sammlung, of 1886.<br>
      &gt; But it should be hard to trace this back earlier for type specimens<br>
      &gt; werent dated back then. </p>
      <p>Not that hard. The 'Schlanke Grotesk' dates from 1882.</p>
      <p>In the 1870s and 18880s, Schelter &amp; Giesecke published their own journal 'Typographische Mitteilungen' (typographic reports), in which they presented their new typefaces. This journal was published approximately every few months. </p>
      <p>In 'Typographische Mitteilungen', 2. Band, 3. Heft, published in May 1882, on page 2 the 'Schlanke Grotesk' is presented as a new design:</p>
      <p>'In our last issue, we presented the Enge Antiqua, and we said that this typeface allowed extreme tight setting. Today we are able to present an in-house cut Schlanke Grotesk , which enables the type setter to set even more compressed without losing legibility. This typeface will prove its usefullness not only for job printing but also for the setting of advertisments.'</p>
      <p>(This is my translation from German.)</p>
      <p>(St Bride Printing Library in London has a copy of Typographische<br>
      Mitteilungen', 2. Band, 3. Heft, May 1882)</p>
