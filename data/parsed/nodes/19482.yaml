    <p>I am interested in the origins of <a href="/wiki/grotesque" class="freelinking" rel="nofollow">grotesque</a> typefaces in nineteenth-century <a href="/wiki/Germany" class="freelinking" rel="nofollow">Germany</a>.</p>
    <p>In my opinion, the relevance of the Grotesk typology in the context of the birth and early development of the <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sanserif</a> has perhaps been underestimated by a historiographic tradition focused on Anglo-American achievements. Some indications:</p>
    <p>– Most sources agree that <a href="/wiki/William%20Thorowgood" class="freelinking" rel="nofollow">William Thorowgood</a> released the first sanserif lowercase in 1834. Nevertheless, it seems that the <a href="/wiki/Scheltzer%20and%20Giesecke" class="freelinking" rel="nofollow">Schelter &amp; Giesecke</a> foundry (Leipzig) had produced a light sans serif with both capitals and lower case letters by 1825. (Source: Lawson, Anatomy of a Typeface, p. 297). I find this doubtful, but if proven, this face would be not only prior to Thorowgood´s (and even <a href="/wiki/Figgins" class="freelinking" rel="nofollow">Figgins</a>') but far more sophisticated. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/thorow.gif"></div><br>
    Thorowgood 1834<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schlanke.gif"></div><br>
    Schelter&amp;Giesecke 1825<p></p>
    <p>– The Grotesk typefaces were used in the nineteenth century for setting <a href="/wiki/body%20text" class="freelinking" rel="nofollow">body text</a> (namely in scientific and technical publications), long before the american <a href="/wiki/gothic" class="freelinking" rel="nofollow">gothics</a> left display and jobbing as their exclusive tasks. (Source: <a href="http://www.typolexikon.de/g/grotesk.html" title="http://www.typolexikon.de/g/grotesk.html">http://www.typolexikon.de/g/grotesk.html</a>)</p>
    <p>– Looking at specimens from late nineteenth century, one finds a very remarkable level (for the time) of  formal development, and perhaps even a tendency towards systematization and coordination of <a href="/wiki/weight" class="freelinking" rel="nofollow">weights</a> and sizes. (Source: Schelter&amp;Giesecke specimen, c.1898)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/schelter05.gif"></div><p></p>
    <p>Any argument or contribution is more than welcome. I´d like also to pose these questions to the forum:</p>
    <p>1. When did the first Grotesk appear in Germany?</p>
    <p>2. Which typeface would be the first in including a lowercase in that country (if the Lawson statement is erroneous)?</p>
    <p>3. When did the sanserif started to be used as a text face there?</p>
    <p>Thank you very  much,</p>
    <p>Xurxo</p>
