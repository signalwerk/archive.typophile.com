      <p>And when did lowercase first appear on a Grotesk?</p>
      <p>The crudeness you point out seems to be a clear feature of all early sanserifs, first originated –as said– in Britain and then the US. The genre got refined afterwards through the century. I got the impression (not proven) that by the last third of the century, the Grotesks had achieved a substantially greater level of development than their Anglo-American counterparts. I wonder how the Grotesks were in the beginning (if just as primitive or if they presented early clues to that future refinement), and what was the pace of their formal growth.</p>
      <p>Another gap in the history of Grotesks seems to be right in the birth date. What is the oldest specimen of a German sanserif anyone at the forum knows of?</p>
