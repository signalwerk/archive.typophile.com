      <p><em>they were almost identical.</em></p>
      <p>But that doesn't really matter.<br>
      The purpose is to date a genre of type.<br>
      Here is an ad from the London <em>Punch</em> magazine, 1843 (incidentally, also the best-selling humour magazine in Canada and the United States at the time).<br>
      I have not seen these sans faces in the Figgins, or Caslon &amp; Livermore specimens of the day.<br>
      Perhaps they are in some specimen books I am not aware of.<br>
      Or perhaps they are types that never appeared in specimen books.<br>
      Or perhaps they are types from specimen books of which no copies now exist.<br>
      Or perhaps they are types from foundries that have vanished without trace.<br>
      Type history is a little too dependent on foundry specimens -- from the usual suspects.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Doudney.jpg"></div><p></p>
