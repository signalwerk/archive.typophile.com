      <p><cite>Does the article you cite “Grotesque Letters” deal with German Grotesks significantly?</cite></p>
      <p>More with the British. If you send me your email (I think my Typophile contact link allows this), I can make you a copy of the article at the weekend. It is nice to read.</p>
      <p><cite>The purpose is to date a genre of type.</cite></p>
      <p>Ah, genre not particular typeface. This is a different story. Maybe easier to deal with for the start.  ;-)</p>
      <p><cite>Type history is a little too dependent on foundry specimens — from the usual suspects.</cite></p>
      <p>You mean, they write their own great history?</p>
      <p><cite>I have found so far a lack of first-hand, proven information (or any at all) on the birth and development of early German grotesques. Is there any source (German-language included) where this topic is extensively discussed?</cite></p>
      <p>I fear there are no *serious* publications about it. For some time I tried to find something, but most of the articles present second-hand stuff themselves. Repeating myths.<br>
      Sad because the issue is most fascinating: Like, before the Johnson and Gill sanserifs, British sanserifs (the groteques) had many features in common with the German ones. I always wondered if German sanserifs had their origin in Britain.<br>
      But this is speculation. Unfortunately. Glad about any correction.</p>
