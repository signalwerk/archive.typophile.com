      <p>We're generally agreeing, but the point I'm making is that the evolution has not been from ugly to beautiful, that's only the way it appears to some of us now. </p>
      <p>"Optical polish" is even tone, but there is nothing inherently beautiful about this quality. Many would consider the polishing excessive, resulting in a smooth but dull finish.<br>
      The condensed Grotesks were just as systematized as the condensed neoGrotesques -- only with an evenness of stroke thickness, not overall tone.</p>
      <p>I certainly agree that the Neogrotesques are direct revivals of 19th century faces -- compare the type in the ad I showed earlier with Helvetica:</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/lombardNS_5348.jpg"></div><p></p>
      <p>What I really want to see (and discover when) is the first Regular weight lower case sans faces.</p>
