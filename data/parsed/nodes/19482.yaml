      <p>&gt; In which German library can I find them?<br>
      Sorry, I don't know - but if you find them, probably you could tell us in which library ...</p>
      <p>&gt; Have you got any information concerning the use of sanserif as body text face<br>
      &gt; in nineteenth-century German scientific publications?<br>
      No.<br>
      I have heard these rumours that sans serif was used in nineteenth-century German scientific publications - does anyone know from which source this information comes from? - but bearing in mind that back then a substantial part of the newspapers and books was printed in Fraktur (blackletter) I find it hard to believe that sans serif was used for longer texts. If it was actually used, then I would rather assume that it might have been used for some special purposes. But this is only speculation.</p>
      <p>It just came to my mind, that some ten years before Caslon's Egyptian, the first sans serif tyeface (with upper case only), there was already a Greek unseriffed typeface (uppercase only):<br>
      Edward Daniel Clarke's Greek type (1805). You can find Justin Howes's article about this typeface in the Proceedings of the 1st International Conference on Typography and Visual Communication in June 2002 in Thessaloniki, Greece. John Bowman (in his book 'Greek printing types in Britain') also mentions this typeface, and he calls it 'Cambridge Small Pica Sarcophagus'. (Nice name for a typeface!)</p>
      <p>If anyone has information about sans serif in nineteenth-century German scientific publications - now is the time to tell us more about it...</p>
