      Edward Daniel Clarke's Greek type (1805). You can find Justin Howes's article about this typeface in the Proceedings of the 1st International Conference on Typography and Visual Communication in June 2002 in Thessaloniki, Greece. John Bowman (in his book 'Greek printing types in Britain') also mentions this typeface, and he calls it 'Cambridge Small Pica Sarcophagus'. (Nice name for a typeface!)</p>
      <p>If anyone has information about sans serif in nineteenth-century German scientific publications - now is the time to tell us more about it...</p>
