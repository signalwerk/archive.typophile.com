  html: |-
    <p>Even though this is a typeface I'm working on for a logotype, I decided to post it here because my problem is with the type design and not the logo/logotype/trademark composition.</p>
    <p>This is the third font I work on, but I still consider myself extremely green in type design. This font is custom made for a client, and I'm having some troubles with the overall look of it. I feel that the shapes and letters fit together, but I'm having difficulty getting the width (or should I say thickness?) of strikes, specially on the letters " i ", "w", "d", "l" and "p", to look good. As it is, they stand out too much, look rather bold.</p>
    <p>Even though it bothers me, that's one of the characteristics the client asked for, a bold but smooth font. Any recommendations on how to fix this, and, what do you think of the font so far?</p>
