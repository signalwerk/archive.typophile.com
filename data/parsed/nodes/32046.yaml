      <p>Personally if you want the stem widths the same, set up guides to sort it out. </p>
      <p>The middle vertical stem bothers me, I think it needs a flat edge like the rest of the type. Also the bar in the middle of the s needs tidying up, keep it straight like the e. Tidy the p up and there's a starting point for you to work from.</p>
