      <p>I think in this case it would be a matter of judging the thickness by eye, so that everything looks equal optically. So narrowing those verticals, untill they appear of even thickness.</p>
      <p>Also it looks like you either forgot to overshoot round characters, or that this overshoot is a bit too small. The baseline seems to bounce.</p>
