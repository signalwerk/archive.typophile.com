    html: <p>H&amp;FJ advertise in many major design magazines, including ID, Print, STEP, etc. Not sure what UK mags they would advertise in. Their advertisements tend to show the featured design in a lot of different settings (mostly low-contrast, soft colors), and fill a whole magazine page. Recently ads have appeared featuring Archer exclusively. This might be enough information for your client.</p>
