    <p>Hello everyone. I am currently looking into the possibility of supplying a client with H&amp;FJ’s lovely new Archer. However, before committing her cash, she (and I for that matter) would like to see a printed sample. Do any of you know where in London I might be able to pick up a copy of “Martha Stewart Living”, which uses Archer extensively? I will also see if H&amp;FJ can do a brief mock-up PDF.</p>
    <p>Thanks for any help,</p>
    <p>Dominic</p>
