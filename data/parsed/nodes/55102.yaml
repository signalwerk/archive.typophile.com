      <p>You can give yourself some protection with a "hold harmless" clause for your design services, (pretty standard in normal contracts anyway) which basically means that you dealt with content provided by your client in good faith that the client had obtained all required clearances and kept appropriate records, and therefore you can't be sued if the client failed to do so, but that is strictly a civil point. </p>
      <p>Certain specific content is illegal (child porn always, possibly others depending on community standards) but that is a criminal matter, and no contract can insulate you from criminal prosecution.</p>
      <p>I am not a lawyer, and this information is for informational purposes only as grounds for further research, and should not be construed as legal advice.</p>
