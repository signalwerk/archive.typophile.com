    <p>What is a web designer's criminal liability (in the US) if he or she is involved in the production of a website the legality of whose content may be called into question?</p>
    <p>Specifically, I'm thinking about the web designer's relationship to the terms and conditions statement of a website containing borderline pornographic images. What happens if the terms and conditions statement isn't airtight? Is only the owner of the copyright of the website liable? Or the owner of the business advertised, or which contracted the production of the website? </p>
    <p>The only reading into constitutional law and first amendment protection of borderline obscenity predates the advent of the internet, so I really have no idea what the current state of things is. Any ideas? (Ideas besides to avoid working on anything legally questionable)</p>
