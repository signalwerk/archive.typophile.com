      <p>No, I didn't honestly expect that the designer would retain much liability, but the line of reasoning I was employing went something like this:</p>
      <p>Terms of service agreements exist, seemingly, to fulfill the function of a contract between the user of a website and the organization to which the website belongs. I know too little about contract law, but it would seem, again, that were the user's exposure or interaction with the TOS page somehow not set up properly (maybe due to the web designer simply not knowing where, or how, or how many times to implement it) it might void the "contract". Would that be the web designer's fault (criminally), even a little bit? </p>
      <p>Usually the worst that can happen when a designer makes a mistake on a print or web project is the client being angry, perhaps choosing to go with someone else for the next gig. I don't think this is even a borderline case, but was curious (read: cautious) about if it were. The US is a strange country.</p>
      <p>Also, it's not porn. Also, definitely not a lawyer. : )</p>
