      <p>Pornography in and of itself isn't illegal in the US.  Certain types (child pornography of course) are.  But if as the designer you only work with material that is legal and only give the client material that is legal, I can't imagine you having any problems. Now, if they send you kiddie porn and you put logos on top of it, you can probably expect a visit from the police.</p>
      <p>But asking about the "Terms and Conditions" statement is broad.  Are you worried about being responsible for what that actually stays?  Isn't that like asking if you're responsable for the content of a contract people sign at a store since you were the printer?  I don't think the printer would ever have any problem unless the actually printed material itself constituted a crime (reproduction of copyrighted material or illegal images (child porn, etc).</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
