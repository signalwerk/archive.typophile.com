    date_raw: 13 Nov 2004 — 12:26pm
    votes: null
    html: "<p>Nathan, you also need the suitcase file (the ones with \"FFIL\" on the icon). These contain the bitmap fonts, metrics (spacing, kerning, etc.) and other important information. OSX doesn't have much use for the bitmap info, but the font is incomplete without the rest. The LWFN file contains only the PostScript outline and hinting data (mainly). <br> <br>In pre-OSX lingo: The FFIL file is the screen font file and the LWFN is the printer font file. You need both parts to install a PostScript font on a Mac, even on OSX.</p>"
