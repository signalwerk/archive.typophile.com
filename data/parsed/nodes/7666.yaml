  html: <p>I can't get LWFN fonts to work on my Mac (10.3). I can drop them  into the fonts folder in the library (no, not the system folder) but they don't show up in FontBook or Illustrator when I open the document. I can't drag them into FontBook either. <br> <br>Please help.</p>
