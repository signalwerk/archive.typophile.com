    html: <p>Looks like you can make the A by stealing the left arm of a T. The E's Could be made by starting from a C (<a href="http://www.myfonts.com/fonts/linotype/friz-quadrata/friz-quadrata/testdrive.html?s=MONTCRCY+BAY+AQUARIUM&amp;p=36" target="_blank">like this</a>) and using the right arm of a T (lengthened, of course). It sort of looks like their E's are too light, like maybe the did come from another face. I think the C's from Friz would probably work fine, though.</p>
