    html: |-
      <p>The font has a much broader scope but <a class="freelinking external" href="http://www.tiro.com/articles.html" rel="nofollow">Sylfaen</a> by John Hudson and Geraldine Wade was named as such because:</p>
      <blockquote><p>The name Sylfaen, which provides the pun in my title, is a Welsh word meaning foundation. Since Geraldine and I were both raised in Wales, it seemed appropriate to pick a Welsh name for our joint typeface: to insist on the continued importance of the heritage of a particular place, even as we set out to make a font for many places.</p></blockquote>
