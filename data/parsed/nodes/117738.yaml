  - id: 582063
    user: 205259
    date: 2014-07-05T11:17:00
    date_raw: 5 Jul 2014 — 11:17am
    votes: null
    html: |-
      <div class="comment-spam-body"><p>Forgot to mention in my previous post that Manuscript Capitals are in the Letraset catalog [at least in the 1985 edition].<br>
      I don't know when Koeiekat will finish his version. If I wanted to make it I would do a high res scan of the letters in the Letraset catalog, delete the outlines and refine the letters. I would then recreate the outlines using a parallel lines feature.<br>
      I suppose that the letters could be classified as neo-Lombardic or neo-Uncial.<br>
      Don</p>
      </div>
