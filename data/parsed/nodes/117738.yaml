    html: |-
      <p>Good find Mike. Looks like the source of the Letraset design might have been "Daisy Rimmed Fancy" as shown on page 21 of Dan X. Solo's big catalog.<br>
      A really crappy digital Manuscript Capitals <a href="http://www.dafont.com/font-comment.php?file=manuscript_caps" title="http://www.dafont.com/font-comment.php?file=manuscript_caps">http://www.dafont.com/font-comment.php?file=manuscript_caps</a><br>
      Koeiekat has been working on a good quality digitization but says that it is still on the drawing board <a href="http://koeiekat.com/" title="http://koeiekat.com/">http://koeiekat.com/</a><br>
      Don</p>
