    votes: null
    html: <p>The Dafont version was done from a really bad scan (low res) of a not very good source. Many letters have gaps in the outline and forms are very crude and choppy. We should point out that the outline has been removed from the examples submitted to identify. And I join Don in saying good find since the outline removal makes it all the more tricky.</p>
