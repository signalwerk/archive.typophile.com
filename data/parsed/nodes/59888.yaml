    <p>Hey Everyone,</p>
    <p>Just finished my first concept for this company and wanted to get some feedback while I work on some other ideas.</p>
    <p>This first concept came about as the client wants to work with the letter "A"—playing off of "Alsip" and also the layout of their lot is "a-shaped".</p>
    <p>After a little doodling I noticed that a rotated box, inside an non-rotated box create A's. So you have a box within a box to show the storage aspect, and it also makes four A's that can be seen when the logo is rotated 0, 90, 180, and 360 degrees.</p>
    <p>I didn't bother putting time into kerning yet, so let me slide on that for now.</p>
    <p>Let me know what you think so far.</p>
    <p>Thanks,<br>
    Mike</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/alsip_self_storage_logo_1_5085.gif"></div><p></p>
