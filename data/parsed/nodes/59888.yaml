      <p>The wiki article about Aslip shows a photo of a water tower with the caption: <em>"This is one of the two water towers which are notable landmarks with their dark red color and fluted shaft. Both are visible to travelers on I-294."</em></p>
      <p>Mike, have you considered changing the rectangle shapes (red &amp; blue) from your latest post (20.Jul.2009 6.27pm) and changing them to mimic the "famous" water tower? A dome on top with the skewed rectangle below? Just a thought. </p>
      <p>I agree that the middle one in the second image is well balanced and looks good ... but wow, is it boring! Totally unmemorable. Sorry, but that's my impression. I love simplicity, but this feels like it needs something to punch it up; a subtle pattern, a fine paper texture, letterpress printing, anything to make it look thought-out. I like the top (red/blue) one much better.</p>
    html_clean: |-
      <p>The wiki article about Aslip shows a photo of a water tower with the caption: <em>"This is one of the two water towers which are notable landmarks with their dark red color and fluted shaft. Both are visible to travelers on I-294."</em></p>
      <p>Mike, have you considered changing the rectangle shapes (red &amp; blue) from your latest post (20.Jul.2009 6.27pm) and changing them to mimic the "famous" water tower? A dome on top with the skewed rectangle below? Just a thought. </p>
      <p>I agree that the middle one in the second image is well balanced and looks good ... but wow, is it boring! Totally unmemorable. Sorry, but that's my impression. I love simplicity, but this feels like it needs something to punch it up; a subtle pattern, a fine paper texture, letterpress printing, anything to make it look thought-out. I like the top (red/blue) one much better.</p>
