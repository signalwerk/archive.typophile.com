      <p>I would use Nofret, unfortunately it is not a web font. I was hoping to find some similar typefaces and then figure out if they offered a web font. </p>
      <p>Actually, I couldn't find any useful information on google. I even used fonts.com and indentifyfont.com identify tools, but didn't come up with anything helpful. Hence, here I am. </p>
      <p>Here is what I found on google below. Don't worry, I am actually trying to find the answer myself and not just coming straight here. My main goal was to find some individuals who are more knowledgeable regarding type then myself. I love it, but still have a lot to learn.</p>
      <p><a href="https://www.google.com/#q=Typefaces+similar+to+Nofret+" rel="nofollow">Google search</a></p>
      <p>Again I tested other key words to find stuff, but surprisingly I didn't not find much help.</p>
