    <p>Does anyone have any suggestions to type similar to Nofret Light?  You can see it being used here <a href="http://www.graf-von-faber-castell.com" rel="nofollow">Graf Von Faber Castell</a>, although I can not find a similar web font for the life of me. The web font is listed as 'GVFC light' so I couldn't find it that way either. </p>
    <p>Thanks!</p>
