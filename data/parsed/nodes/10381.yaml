    html: <p> Uhm.. Nice work. <br> <br>Just out of curiousity..how many hours (approx.) have you used on this face so far? <br> <br>Uhm.. The tail on the uppercase 'Q' are not right.. I would have tried to make it less angular and softer... The lowercase 'e' also bugs me...the horisontal bar should be lowered to balance the negative space above and under it.  <br> <br>Its obviously a lot of stuff that can be discussed about a typeface that is so close to being finished (relatively speaking) ..but I am allways a bit reluctant as to suggest alterations that may take some personality away from it at this stage. <br> <br>I am not sure of what youve been thinking with your "experimental" ligatures in the copy you set. Its not working at the moment but its definately something to look into..But the question is if it is the right typeface to do it with. <br> <br>It sure looks promising!! Go on! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>Sbo </p>
