    <p>Jonathan Ive is the Senior Vice President of Industrial Design at Apple Inc. He is internationally renowned as the principal designer of the iMac, aluminum and titanium PowerBook G4, MacBook, unibody MacBook Pro, iPod and iPhone. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ive_008_work_5306.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/544px-IMac_Bondi_Blue_6674.jpg"></div><p></p>
    <p>Ive's design motifs are translucency, color, minimalism, and dark aluminum. His work is special because it is amazingly eye-catching and contemporary. His designs are so sleek and advanced.</p>
    <p><a href="http://www.jonathanive.com/" title="http://www.jonathanive.com/">http://www.jonathanive.com/</a></p>
