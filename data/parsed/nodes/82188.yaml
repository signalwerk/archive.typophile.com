    html: |-
      <p>I'm not being funny but have you considered times? I know it isn't modern, but it was created for poor ink and paper. You have the advantage of better paper and ink so it will look good. You will be hard pressed to get a font that looks sharp with and inkjet on 80gsm, as by its nature the ink bleeds. Do you have access to a laser printer?<br>
      you may want to try a better grade paper, this should combat the bleeding and give the fonts a sharper appearance.<br>
      A nice modern serifed font? Bodoni<br>
      <a href="http://new.myfonts.com/fonts/bitstream/atf-bodoni/" title="http://new.myfonts.com/fonts/bitstream/atf-bodoni/">http://new.myfonts.com/fonts/bitstream/atf-bodoni/</a></p>
      <p>Hope that helps.</p>
