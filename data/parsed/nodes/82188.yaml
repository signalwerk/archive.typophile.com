      <p>I think Frode's suggestion is a clever one, and it allows me to toot my own horn: some years ago Patria was used to set an issue of a provincial newspaper, and the results -especially at smaller sizes- were encouraging. It comes in four weights with italics and a "bonus" slanted-Roman cut. And Armenian, but you probably don't need that.  :-)</p>
      <p>Here's a PDF of a spread from the Creative Review awards of 2006:<br>
      <a href="http://themicrofoundry.com/ad/CR.pdf" title="http://themicrofoundry.com/ad/CR.pdf">http://themicrofoundry.com/ad/CR.pdf</a><br>
      You can also see photos of it in action:<br>
      <a href="http://www.flickr.com/photos/48413419@N00/4177918056/" title="http://www.flickr.com/photos/48413419@N00/4177918056/">http://www.flickr.com/photos/48413419@N00/4177918056/</a><br>
      Let me know if you'd like fuller specimens.</p>
      <p>hhp</p>
