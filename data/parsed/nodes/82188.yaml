  html: <p>hello. i'm interested in a modern font preferably serif for long text setting that will look good and sharp when printed with inkjet printer on A4 80 gram paper. any recommendations. thank you much.</p>
  html_clean: <p>hello. i'm interested in a modern font preferably serif for long text setting that will look good and sharp when printed with inkjet printer on A4 80 gram paper. any recommendations. thank you much.</p>
