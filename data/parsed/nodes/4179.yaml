    html: "<p>Just to wrap up this thread, some words by the creator himself (he didn't make it in time before shutdown): <br> <br>Yves <br> <br>I have been forwarded your email messages from Karl. Thank you very much for the kind remarks about the dezap typeface, which I simply call 'dezap'. <br> <br>There are currently just 3 different weights (light, regular, bold). The one used for the logotype is the 'regular' weight and the rest of the website uses the 'light' weight. <br> <br>I created the 5 original d-e-z-a-p characters as a standalone logotype to enable the logo to be reversible through 180 degrees, and then it eventually evolved into a full family which is now used across the company branding. <br> <br>Certainly, the simplicity of Hans Reichel's 'Dax' typeface was something I had in mind when designing this font, but I hope 'dezap' can be evaluated on its own merits. <br> <br>On a small side note, the photograph that has been posted on the Typophile forum is from our website. It is of a sign that hangs on the studio wall. I would usually insist that the logotype reads from top to bottom (or bottom to top), rather that left to right. The viewer then has to tilt their head and physically 'interact' with the logo in order to read it <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Thanks again! <br> <br> <br>NEIL ROBINSON  <br>dezap</p>"
    html_clean: "<p>Just to wrap up this thread, some words by the creator himself (he didn't make it in time before shutdown): <br> <br>Yves <br> <br>I have been forwarded your email messages from Karl. Thank you very much for the kind remarks about the dezap typeface, which I simply call 'dezap'. <br> <br>There are currently just 3 different weights (light, regular, bold). The one used for the logotype is the 'regular' weight and the rest of the website uses the 'light' weight. <br> <br>I created the 5 original d-e-z-a-p characters as a standalone logotype to enable the logo to be reversible through 180 degrees, and then it eventually evolved into a full family which is now used across the company branding. <br> <br>Certainly, the simplicity of Hans Reichel's 'Dax' typeface was something I had in mind when designing this font, but I hope 'dezap' can be evaluated on its own merits. <br> <br>On a small side note, the photograph that has been posted on the Typophile forum is from our website. It is of a sign that hangs on the studio wall. I would usually insist that the logotype reads from top to bottom (or bottom to top), rather that left to right. The viewer then has to tilt their head and physically 'interact' with the logo in order to read it <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Thanks again! <br> <br> <br>NEIL ROBINSON  <br>dezap</p>"
