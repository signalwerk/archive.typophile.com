    date: 2008-10-27T16:17:00
    votes: null
    html: <p>By contrast, in Fog, if you have two elements and simply cut and paste one of them, it is automatically no. 2 of the two elements. It would be nice to have a more explicit way of controlling these things in Fontlab, and of course, we need the ability to edit individual masters with more control than we have now. Something like a switch that would just turn all the forced conformity off. Tant pis, if it results in incompatible masters for some users. Nobody will be using it who doesn't know what he or she is going.</p>
