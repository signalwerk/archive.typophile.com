      <p>Manually? That'd be "Contour -&gt; Paths -&gt; Set Startpoints" (or Ctrl+Alt+T on Win) if memory serves. Otherwise you could run the AFDKO "Fix Start Points" macro in FLab, no?</p>
      <p>Regards,<br>
      Ernie</p>
