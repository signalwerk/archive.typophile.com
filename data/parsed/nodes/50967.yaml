    <p>I am sure this has been asked and answered before - - but - - - HOW ? ? ? </p>
    <p>I have the simplest of characters - - a broken bar - - it is the only glyph in the font that is causing me trouble. In one of the masters, the start point is different. How do I correct it? 'Make node first' doesn't seem to work. In the one troublesome master, the starting node is at 5/8 [2] instead of 1/8 [1]. The bar is two elements of four points each - - simple as possible.</p>
