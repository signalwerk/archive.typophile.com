    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chacon_4992.jpg"></div><p></p>
    <p>This typeface it's designed based upon the work of the "brigade Chacón", the graphic team of the Chilean Communist Party.<br>
    I make it in a grungie style, because it's used in painted paper over walls.<br>
    I had to do the "no grunge" style for the work in Chacon, but i prefer the texture and the style of Chacon.<br>
    Please critique.</p>
