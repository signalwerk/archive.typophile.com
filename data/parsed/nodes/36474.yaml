    html: |-
      <p>A bit late to the party, but the easiest thing to do for non-technical users who want to try FontForge is the following guide. The process is really easy to undo (just check the bottom of this post).</p>
      <p>The following process uses open source/free software only and is cross-platform, so both MacOS and Windows users can use this guide (things might be a bit different in MacOS, but it should be easy to find out yourself).</p>
      <p><em>Notes:</em></p>
      <ul>
      <li>This guide is written with "absolute beginners" in mind, power-users can deviate if they know what they're doing.</li>
      <li>The reason I recommend the Mint-DVD at step 1 is that it provides a similar experience to Windows and MacOS out of the box, without having to worry about additional libraries later on.</li>
      <li>Both VirtualBox and Mint have 64-bits flavours.</li>
      </ul>
      <p>The steps to take:</p>
      <ol>
      <li>Download the <strong>DVD</strong> of Linux Mint at <a href="http://www.linuxmint.com/download.php" title="http://www.linuxmint.com/download.php">http://www.linuxmint.com/download.php</a> (warning: 1 gigabyte!)
      </li>
      <li>Download VirtualBox at <a href="https://www.virtualbox.org/wiki/Downloads" title="https://www.virtualbox.org/wiki/Downloads">https://www.virtualbox.org/wiki/Downloads</a>
      </li>
      <li>Install VirtualBox and run it
      </li>
      <li>Create a new Virtual Machine in the "Oracle VM VirtualBox Manager"
      <ul>
      <li>Hit the "New" button</li>
      <li>Hit "Next" in the wizard</li>
      <li>The name is up to you, the OS should be "Linux", the version "Ubuntu"</li>
      <li>Since the defaults on the next pages are okay: keep hitting "Next" until you reach the "Create" button, which you hit as well to close the wizard.
      </li>
      </ul>
      </li>
      <li>If it hasn't finished yet: wait for the DVD-download to finish. (No need to burn it!)
      </li>
      <li>Select the virtual machine you just created at the left and hit start. A new wizard should appear.
      </li>
      <li>Hit "Next" and click the folder-image next to the dropdown menu. Browse to the downloaded DVD-image and select it. If you did it right, the dropdown should display "linuxmint-*something*.iso". Hit "Next", then "Start" on the following page.
      </li>
      <li>Wait until things stop moving/counting down/polka-dancing and you see a desktop with the icons "Computer", "Home" &amp; "Install Linux Mint"
      </li>
      <li>Install Linux. Tutorials on that have to be googled, even though it's a fairly straight-forward process, quite possibly in your own language as well.
      </li>
      <li>Once it's installed and running: in the top left corner you see a menu named "Applications". Click it and go to "Other" -&gt; "Software Manager"
      </li>
      <li>Once the manager is usable (might take a bit, due to syncing with multiple archives on the net), type "FontForge" in the searchbox (upper right corner).
      </li>
      <li>Click "FontForge" once it shows up at the results, hit "Install" on it's information page and accept/confirm your action. It will probably give you a message that additional programs/libraries are needed, but by default they will be downloaded and installed as well.</li>
      <li>Once it's been installed (progress bar at the bottom, next to "X ongoing actions"), close the "Software Manager" and you should be able to find/launch FontForge at Applications -&gt; Graphics</li>
      </ol>
      <p>If you want to check out other open source graphic programs, search in the Software Manager for:<br>
      Inkscape (vector-creation/editing)<br>
      gimp (bitmap-creation/editing)</p>
      <p>I hope this brings some of you to check it out.</p>
      <p>Getting rid of it all is easy:</p>
      <ol>
      <li>If the virtual machine (the window with Linux Mint in it) is still running: shut it down (preferably by hitting your username in the top-right corner -&gt; shut down -&gt; shut down, otherwise close window -&gt; power off the machine).
      </li>
      <li>Right click on your virtual machine in the "Oracle VM VirtualBox Manager" -&gt; Remove -&gt; Delete all files
      </li>
      <li>Uninstall VirtualBox</li>
      </ol>
