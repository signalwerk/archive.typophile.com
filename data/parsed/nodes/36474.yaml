      <p>Urm, almost all of what Erik van Blokland ascribes to being the limitations of multiple master fonts are in fact limitations of the existing *font editing tools* implementation of multiple master fonts. Adobe actually shipped multiple master fonts with intermediate masters (Adobe Jenson), warped design spaces (Kepler MM) and transitional masters for specific glyphs (ITC Garamond MM). I've even seen an experimental 15-axis MM font with one master plus one master per axis - having masters at corners is not a requirement of the format.</p>
      <p>I have no idea how obvious all this was in the published MM specs, but that's kind of a moot point, as the MM format is all but dead for end users. Apps can more easily implement whatever the heck they want as far as how they support design axes, if they don't worry about exporting the result in an MM font. I dearly wish FontLab would sprout more Superpolator-like features in version 6.</p>
      <p>Cheers,</p>
      <p>T</p>
