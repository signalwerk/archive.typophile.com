      <p>Disclaimer: I'm not a programmer. But I am product manager for a bunch of stuff that includes a number of applications, tools and libraries of code.</p>
      <p>That being said, I gather there are many things to love about Python, but at least some kinds of operations are realtively slow in Python, in ways that become apparent when one attempts very complex operations.</p>
      <p>I'm watching a large Python library get rewritten in C++ because of the ~100x performance improvement in certain key areas involving I/O. So, "scales well" is not something that I'd immediately ascribe to Python. I strongly suspect there are significant performance-related reasons why an application like FontLab is unlikely to be done in Python.</p>
