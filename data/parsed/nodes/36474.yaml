      <p>The sole problem with Open Source, has always been that the only software that is truly embraced -- is the software that has the most thriving and active community.</p>
      <p>In regards to commercial font creation tools -- there are really only two company options available that are worth considering.:</p>
      <p>- FontLab<br>
      - Font Editor</p>
      <p>FontLab has a more robust mindset in the professional paradigm, and taking over FOG was a good move. BUT - being a Windows user, I am still a little miffed that there hasn't been a priority placed on getting the memory architecture upgraded and patched for Windows.</p>
      <p>Font Editor reminds me more of Macromedia when they started-out years ago. Macromedia were always the kid on the block that understood community support and the value in providing useful and educative resources to their users. Unfortunately, when Adobe took them over, some of that approach was washed in with the mix and degraded a little bit.</p>
      <p>Look. The main issue here regarding any platform are two things, really.</p>
      <p>1) Cost<br>
      2) Trainability</p>
      <p>If you can't afford it -- chances are, you'll look at something else. If you can't train on it, or train someone within your organization -- chances are, you'll look at something else.</p>
      <p>Those are the only two entities that I see having both those factors in mind -- though, FontLab is the higher priced option.</p>
      <p>Personally, I think if Open Type were finally treated as the default standard for once, instead of tiering the approach and restricting between apps (TypeTool and ScanFont vs. FontLab, etc) -- then FontLab would have no problem creating more buyers. But, that's just my opinion.</p>
      <p>PS:<br>
      I'm still not willing to get out of my beloved FOG just yet. I would just like to see them update it to standards, and include Open Type support.</p>
