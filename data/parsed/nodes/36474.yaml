      <p>Tim, Dan &amp; Dan-</p>
      <p>I wish we had been able to use Superpolator for the Guardian project, but I've only been working with it since December 2006, long after that project was delivered. I'm already at the point where I can't live without it, though. I use it for two main things: the first is rapid prototyping, i.e. taking Headline Regular, Headline Bold, and Text Regular, then extrapolating Text Bold. Not so glamorous, but this was the only way we could have met the almost-impossible deadline for the family we drew for <cite>Público</cite> in Portugal. The extrapolated Text Bold wasn't perfect, but it was certainly good enough for our clients to use in prototype pages and even a press test to determine if it worked for emphasis in running text. I will often set up separate axes for different aspects of a family - weight, ascender length, ball terminal size, whatever - and adjust the whole family as needed. If I have a Regular weight with long and short extenders, I can apply the axis to lighter and heavier weights as well. It's very handy. Besides Publico, I've used these tools for prototyping styles for the serif face that Paul Barnes started and we finished together for <cite>Condé Nast Portfolio</cite> magazine, plus the sans I drew for the same publication, the optical sizes of Giorgio, an additional style of Bosch Serif, and various other projects. It took some time to get used to drawing in a way that yields more usable extrapolations without making the poles bland or unattractive, but I'm slowly getting there.</p>
      <p>The other thing I use Superpolator for is keeping track of intermediates as I work on a family. I never worked in MM because I tend to work from the middle out, as you've discussed a little bit here, so I would have to keep separate notes on all of the interpolation values and then reinterpolate each style by hand each time I made a round of corrections to one or more of the poles. This was fine for a small family, but a nightmare for a family like Amplitude, with 3 masters per width, all drawn in Robofog, where interpolating all of the intermediates could easily eat an entire afternoon. With Superpolator, any time I change a master, the change is seamlessly propagated through all intermediate styles. This was a huge help with Publico, Meta Serif, and some projects that I'm working on right now. I can also add intermediate masters late in the process, based on the interpolations, so I can fix specific characters (often sans 'a' 'e' 'g' and 's'), and these changes instantly affect the styles around them. This was a huge help with both of the families we drew for <cite>Portfolio</cite>, because they covered a lot of ground from light to heavy.</p>
      <p>Superpolator's precision makes it a great tool for a production environment, but I also find it really fun to use - especially dragging sliders to make morbidly obese extrapolations.</p>
    html_clean: |-
