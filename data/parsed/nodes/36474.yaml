      <p>I'd like to say few words about some other font tools that weren't mentoined in this discussion.</p>
      <p>- RoboFab. It is a set of Python libraries and tools and you have to know how to use it, but it can actually create a very powerful and flexible font production environment (used with FLS or without it).<br>
      - Superpolator. A tool that nobody should miss if ever working on the font family.<br>
      - MetricsMachine. Simply the best tool to edit font metrics.<br>
      - ScanFont. Not just a "tracing" tool but a very good in converting fonts made as EPS files into real stuff. So draw anywhere, get your font build as a collection of outlines (in a single picture) of any size and convert it into font in few clicks.</p>
      <p>Not all of these tools are already released (for both platforms) but it could be a good idea to find a way to try them.</p>
