      <p>Hello William -- <cite>FontMaster Utilities are considerably more expensive than the full FontLab. And from the description on your site—and here—they have seemed to be targeted more to foundries than individual type designers.</cite><br>
      <cite>I don’t think many people have seen your tools demonstrated, so I would think for most they are a question mark.</cite></p>
      <p>Since the original question was about an inexpensive tool for the first steps into type design, the answer may be TypeTool or FontForge. (I never used FontForge because it requires X11.) For the beginning, I think, the simpler the font editor is, the better. This allows to focus on the essence of what, referring to the technical side, a font is: (a) a collection of glyphs (b) that have space to the left and right side and (c) possibly may be kerned.</p>
      <p>As regards FontMaster: Today one doesn't need the entire FM suite to generate font but can do this e.g. with the BezierMaster module, which is about the same price as, or less than, FLS.<br>
      Yet the interesting thing about FM of course is batch font generation and the way it deals with OT features. This may not be required for single style fonts, not even for four-style families, but as soon as just a few more weights are involved, it can save time and trouble since one doesn't have to care for every technical setting in every single font. (See the other thread about the horror story cause of a missing hyphen in one style's font name.) I touch a few similarities/differences between FLS and FM <a href="http://www.kltf.de/kltf_notes_concept1.htm" rel="nofollow">here</a>.</p>
      <p>As regards other aspects touched in this thread:</p>
      <p>As said earlier, FLS's popularity has the effect that people can easily exchange data or tools, and people can help each other. However: All font editors allow to import/export PST1 (or even OT) fonts. So no font editor is an island. </p>
      <p>I see two important factors:<br>
      (1) The designer must feel comfortable with the drawing tools since she/he spends a lot of time with them.<br>
      (2) What matters in the long run are the OTF/TTF files which are finally produced.</p>
      <p>When drawing, use whatever tool you like, can afford, etc.<br>
      Production is another issue. You can use any of the mentioned font editors to produce fonts. Some examples: FLS only. FLS + AFDKO2, in case you plan to do things that the older AFDKO-version does not support. TypeTool/FontForge + AFDKO, as the least expensive combination. And why not draw in FLS, TypeTool, FontForge and produce with FM, or draw in FM and produce with FLS? Whatever gives the desired results.<br>
      When producing fonts, you'll sooner or later change the point of view anyway. You will not ask any more whether it's better to check this or that box in the FLS or FM interface but make up you mind about how the font file and its tables shall look like and wonder, how can I achieve this with the tools at hand? And then it ceases to be an either-or and will turn into a both-and as regards choice of tools. For example, currently my fonts consist of some tables generated by FLS, others generated by AFDKO2, plus additional table tweaks done with FontTools/TTX.</p>
      <p>As an aside, even unconventional combinations are possible. InDesign is a good kerning interface, and FontLab Studio and KernMaster work together nicely.</p>
      <p>Karsten</p>
