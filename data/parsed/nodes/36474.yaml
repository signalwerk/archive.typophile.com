      <p>Also, the idea that what software application you use is just a 'flavor' and 'moot' as a general proposition does not seem to me defensible. Publisher and InDesign are both page layout programs, but I don't think even MicroSoft would say that Publisher is just as good for full-on professional work.  </p>
