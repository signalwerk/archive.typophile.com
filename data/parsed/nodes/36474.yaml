      <p>Thomas: I <em>am</em> a programmer, and if I were doing a font editor as a traditional desktop app, Python is very likely the language I would use.</p>
      <p>Yes, it's slow for some things, but for this application there are a number of factors to mitigate that. First, font editing doesn't require a tremendous amount of actual computation, nor the movement of huge amounts of data. Heck, if Fontographer could work on the 8 MHz Macintosh Plus of 1986 (the year of its first release), even a 100x slowdown would still be reasonable on modern hardware.</p>
      <p>Fortunately, the situation is better than that. If you can get the heavy lifting to happen in libraries, it's full speed. The antialiased vector graphic rendering should be done in a cross-platform library such as Cairo, or in the native graphics engine of the OS, such as Quartz. (One frustration for me is that the comparable bindings to the native graphics library aren't as mature on the Windows side as on Linux and Mac, but with luck that situation will improve). Some numeric computation, especially when dealing with vectors and matrices, can also be shuffled into NumPy or SciPy, which are every bit the match for handrolled C++ code.</p>
      <p>It's even possible, though still somewhat cutting edge, to run Python code in the browser. Within the Microsoft world, there's IronPython, which should run inside Silverlight. On the free software side, it's possible that integrating Mono with a browser should provide similar functionality. But none of that stuff is quite ready for prime time yet, so I'm doing my Spiro stuff in straight JavaScript (which actually isn't all that different from Python, as a language).</p>
      <p>I think it's fair to say that Python scales well compared with other scripting languages, but if you're writing hardcore systems-level apps, none of the scripting langauges scale anywhere nearly as well as C or C++. Java is somewhere in the middle of that, and has carved out a good niche for server-side stuff, partly because it supports threading natively. But none of its strengths apply very well to the specific task of font editing. In fact, I don't see anybody in their right mind doing real client side or browser-centric development in Java these days.</p>
