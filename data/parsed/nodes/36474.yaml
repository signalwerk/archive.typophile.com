      <p>also, if you use Windows, you may install the free Microsoft VOLT or the free Adobe FDK for OpenType (AFDKO) to add your OpenType features. A combination of TypeTool 3 + VOLT or TypeTool 3 + AFDKO will actually let you build professional-quality OpenType fonts. Since TypeTool 3 is based on the FontLab Studio 5 core, the technical quality of the fonts made in TypeTool 3 will not be any less from those made in FontLab Studio 5 (esp. if one only uses autohinting in FLS5 rather than manual hinting, which most people do these days -- FLS5 lets you do both auto and manual, and TT3 only does auto, but uses the same algorithms as FLS5). </p>
