      <p>This answer is a bit outdated, as FontForge now supports a concept of layers and the spline order is considered a per-layer property (thus it is now possible to store sources for TTF and T1/OTF versions of the same font in the same database). So in order to change to quadratic Béziers in most recent FontForge versions one should do the following:</p>
      <p>- go to Element-&gt;Font Info-&gt;Layers;<br>
      - either select "All Layers Quadratic", or select "Mixed" and then adjust curve type individually for each layer.</p>
    html_clean: |-
      <p>This answer is a bit outdated, as FontForge now supports a concept of layers and the spline order is considered a per-layer property (thus it is now possible to store sources for TTF and T1/OTF versions of the same font in the same database). So in order to change to quadratic Béziers in most recent FontForge versions one should do the following:</p>
