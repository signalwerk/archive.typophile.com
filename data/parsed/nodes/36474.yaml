    html: |-
      <p>Steve,</p>
      <p>First of all, I don't think learning FontForge can be considered a waste of time even if you decide not to use it for your actual work. In general, I am sure that having some experience with "alternate" applications is always extremely useful, because it allows you to understand the difference between the peculiarities of your application of choice (e. g. Word or FontLab) and your general task (e. g. word processing or font design) and thus to use your favorite application more effectively.</p>
      <p>Regarding FontForge itself: I used it for several years, and now I am also participating in its development by submitting patches. I have also some experience with FontLab, and I am sure that FontForge is better at many aspects. In particular, I heard many font designers (especially those who had previously got familiar with Fontographer) to complain that FontLab is very inconvenient as a spline editor. But drawing glyphs with FontForge is a real joy, so that no external tools are required. Just one example: FontForge has an option to mark extrema points and points of inflection on the spline. Thus if I see that handles of some of my points expected to be positioned at extrema are not exactly horizontal/vertical I can easily correct this, while in FontLab I would have to run FontAudit to notice this  problem. BTW, I often see slightly distorted extrema even in costy commercial fonts, and I am sure this would be not possible if their designers had used FontForge.</p>
      <p>Furthermore, FontForge is much more powerful than FL in designing OpenType layouts. In particular it allows to define anchor points for combining marks ('mark' and 'mkmk' features) which neither FontLab nor AFDKO support. Well, most designers currently do that with VOLT, but VOLT is only for TrueType fonts, while FontForge supports the OpenType-CFF format as well. FontForge also has a nice intuitive GUI for adding OT features, which is much clearer for me than feature files with their obscure syntax.</p>
      <p>I should mention also the main (to my mind) FontForge's disadvantage, which still makes using it for production quality TrueType fonts a bit difficult. FontForge's TTF autoinstructing code is really bad, and the developer was not interested in fixing this problem for years. However, things are changing now, as there are volunteers working to improve this functionality. On the other hand, FontForge already may be very useful even for creating/modifying TTF instructions: first, it allows to modify them directly (unlike FontLab), and second, it has an excellent TTF debugger which is extremely useful for anyone who would like to understand how exactly his/her instructions work.</p>
