      <p>&gt; So now I am faced with two options</p>
      <p>For me, the most obvious option would be just to install the missing library...</p>
      <p>&gt; It’s only free if my time is worth nothing.</p>
      <p>You should understand your problem has nothing to do with free software. Many open source applications have been successfully ported to Windows (or MacOS) and can be installed and used just like any other native programs. But FontForge is a Unix application, which means you need some Unix knowledge even if you are running it in your Windows environment under Cygwin (I suppose the same would be true for most X11 applications under MacOS). Nobody never promised that installing a Cygwin application would be as easy as a native Windows application, but having a Cygwin port is just better than nothing.</p>
      <p>So if you are not prepared to some small difficulties, which, unfortunately, are unavoidable when you are running an application written for another platform, then, indeed, it is better for you to stick with your favorite software. Otherwise I am sure your problem can easily be resolved. But please don't blame something you haven't even tried.</p>
