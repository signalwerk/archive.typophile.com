      <p>Steve Tiano: in answer to your original question, yes, FontForge is a perfectly viable tool. I use it along with my own Spiro tools for the fonts I create. But I'm very strange: to me, reading the code and understanding the way the geometry happens under the hood is very important. I'm also quite capable of fixing things myself when they're broken, and indeed have sent patches back to George.</p>
      <p>It's also more than a bit frustrating and maddening. The UI is by no means up to the standards of modern apps, even other free software ones. Do not generalize from FontForge to the rest of the free software world. For some things, such as production operating system kernels and compilers, the open source products leave their proprietary competitors in the dust. In other categories (databases, for example), open source has staked out the low end (MySQL, Postgres), while leaving only the very high-dollar end (Oracle) to the proprietary players. The font software business is totally different because the market is so small. There just isn't a large population of people who both care about the quality of the tool and are able to make big improvements to it. Unlike, as I've mentioned, the situation with compilers.</p>
      <p>But I find myself agreeing strongly with the main point I see articulated on the thread. What's really valuable to the type community is diversity. A few years ago, it wasn't clear there would be <em>any</em> viable font editing programs. Now even the venerable Fontographer is back, and people who do prefer free software for whatever reason also have a usable tool. People on the high end can use the IkarusMaster and family. This is all good. If I were setting out to make a living being a professional font designer and nothing else, I would no doubt just go with FontLab and be happy with it.</p>
      <p>It will be interesting to see which, if any, of the major font platforms have the flexibility to adopt the Spiro technology, which is another good test of responsiveness. I have no time right now due to personal stuff (I got to spend three hours today with a lawyer, yay), but when I do get time again, I'm going to try to get it out there as a Web app, which may turn out to be an important ecological niche. (also, whether a new program succeeds in that niche probably depends more on how important web collaboration turns out to be, and whether the program is well done, much more so than whether it's based on fresh or stale technology, but in any case it ought to be fun to do.)</p>
