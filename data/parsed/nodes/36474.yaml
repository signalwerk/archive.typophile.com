      <p>&gt;I will say the ’learning fontforge is a waste of time’ argument is silly. Using software isn’t rocket science. What’s important it to learn what the software DOES, at which point the particular flavor of software you are using is rather moot.</p>
      <p>As I made the argument that learning Font Forge is a *risk* of wasting time, of course I don't think it is a silly argument. If your main interest is in making fonts, not learning software, then you are going to want to minimize your time away from design time. Designing fonts is extremely time consuming, and for me at least learning FontLab and getting to use it with some fluency has also taken time, and I'm still learning. </p>
      <p>FontLab is not the most complex application--from what I hear Pro Tools for sound engineering is way more complex--but it does take some serious time to get on top of. Given the complexity of font technology now, I can't imagine that other options are a lot simpler, when you include interpolation tools, including multiple masters, as well as spacing, kerning, hinting, and open type programming. </p>
      <p>Also, the idea that what software application you use is just a 'flavor' and 'moot' as a general proposition does not seem to me defensible. Publisher and InDesign are both page layout programs, but I don't think even MicroSoft would say that Publisher is just as good for full-on professional work.  </p>
      <p>I haven't learned other font design applications, so I can't compare their merits. But I can report that at TypeCon earlier this month there were lots of workshops on FontLab, some using the revived Fontographer, and none on Font Forge. I never even heard Font Forge mentioned. I wouldn't be surprised if there are zero professional type designers who use it, judging by conferences and Typophile discussions. In any case there are certainly very few among those doing latin scripts.</p>
      <p>If Font Forge is actually distinctly better, and you can do the same stuff with it, or with it plus other usable programs, then it would absolutely be worth learning and using. Otherwise, I don't see how it's a good investment of time. </p>
      <p>As font design is very time consuming, if Type Tool and the full Font Lab are actually better than Font Forge, then worrying about the $99 seems to me like really false economy. I realize that in poor countries this might be a lot of money, and the money might be a significant factor. But in rich countries it's not. </p>
      <p>To me the main question is really how good Font Forge is, not the cost of Type Tool.</p>
