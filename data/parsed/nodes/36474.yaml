      <p>William:</p>
      <p>Superpolator vs Multiple Master - in short, Superpolator can take any number of masters on an axis, have any number of axes and place masters at off-axis places. While it won't magically reduce the number of drawings, it allows you to construct different "design spaces". For instance 6 masters total, Light, Medium, Black, and then condensed versions each. Any construction -- 9 masters on 3 axes, 4 masters on 1 axis, whatever your design needs. It can recreate any MM design space and then some. Glyph specific masters - you can insert a master for a single glyph if you have to. Superpolator uses the same math as GX variations. Previews, animations, export to pdf.</p>
      <p>Multiple master is fixed on 2 master/1 axis, 4 master/2 axes, 8 master/3 axes and I believe even a 16 master/4 axes setup. If your design happens to match that, great. Usually things aren't so neat and need intermediates, fixes for specific glyphs, lots of previewing. In Multiple Master, to get the "middle" right, the weights that stand to be used most often (most often anyway) you have to work through the extremes. You can't edit the "regular", you have to tweak the light and the black to change the middle - this forces the extremes to be a lot less extreme. With Superpolator you could set up light/regular/black on a weight axis. While this means one more master to draw, it's right down to business. The extremes can be more extreme.</p>
      <p>Superpolator runs on OSX, is written in Python, and is plenty fast ;) But a lot of people do great work with MM as well. Whatever makes your designs tick.</p>
      <p>If you need more info, I have some keynote slides I can send.</p>
