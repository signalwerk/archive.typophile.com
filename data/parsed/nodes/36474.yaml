      <p>'[…]But I can report that at TypeCon earlier this month there were lots of workshops on FontLab, some using the revived Fontographer, and none on Font Forge […]'</p>
      <p>The fact that an application is the choice of the majority does not per definition proof that it is the best tool for every purpose. For instance Windows is also the choice of the majority, but the operating system does not seem to be very popular in general on this forum (which as such is interesting, if only because of the fact, that the Windows platform represents the largest market for font producers and besides that, Microsoft has done a lot for both font technology development and the font community in general [like sponsoring events]).</p>
      <p>I don't know if DTL FontMaster was mentioned at TypeCon, but presumably not. That does not mean that it is not a good, or perhaps for certain tasks even better and more powerful font production tool than any other available on the market. FM was simply not developed for the 'mass market' (nor is our organization very much suited for extensive [low level] customer support).<br>
      I don't expect our customers to attend workshops either; the most work on a large scale and are very capable of solving or circumventing inevitable font production related problems themselves. But sometimes even FM users come to us with unexpected problems, like for instance recently with a request for support for glyphs with higher Unicodes, i.e. not in the BMP, which was added subsequently to the program then.</p>
      <p>If one wants to judge a font production tool, in my opinion at least two parts of the production have to be separated: first, the conversion from design into outlines and second, the conversion from the outlines into font formats (for a more detailed separation see: <a href="http://www.fontmaster.nl/pdf/FM_docs/Automating%20using%20FM.pdf" title="http://www.fontmaster.nl/pdf/FM_docs/Automating%20using%20FM.pdf">http://www.fontmaster.nl/pdf/FM_docs/Automating%20using%20FM.pdf</a><br>
      Concerning the first part generally a couple of Bezier editors are comparable when it comes to functionality (although not in detail, of course), but when it comes for instance to manually digitizing this functionality is only supported by DTL IkarusMaster.<br>
      The generated font formats must be reliable, according to the specs and the results reproducible. Concerning the latter, because OpenType layout features files can be used in batch in FM, all GSUB features supported by the AFDKO will be added automatically to every font that has applicable characters. This way it is not only unnecessary to do the same work for all the 'common' GSUB stuff, but it also assures consistency throughout a library (which is important for the success of the OpenType format itself). It actually does not make much sense to me to do this per font.</p>
      <p>By the way, I don't think that the platform on which an application is running, should be an issue; if only for the customer support for the generated fonts one must have knowledge of and control over at least the mainstream operating systems and applications anyway.</p>
      <p>The Ikarus based file structure of FM was developed for batching (I will show this in detail at the ATypI TypeTech Forum at Brighton). For the most needed functionality, like merging glyph data, generating composites, checking glyph data, generating fonts, et cetera, extensive batch functionality is built-in and mostly controlled by simple command files.<br>
      If one wants to make full use of this batch power, for instance for generating all current font formats for all typefaces in a library in all applicable code pages at once with the call of just a single command file, some reading and good organizing is necessary. But not everybody wants to draw letters on paper and subsequently manually digitize these, or needs the batch power, or want to spent more money on a font production tool, or likes a modular structure, or is willing to use a tool that is not the choice of many colleagues (which means less direct assistance from others in the field, or perhaps even no workshops at for instance TypeCon [although this can be organized on request, I reckon]).<br>
      Others only want to work with apps for Mac OS X, or want to add more or less comparable batch functionality themselves through Python scripting, because it fits their purposes better or perhaps because they just simply like to do it. Maybe some will wait for certain already available technology to appear in some way in their favourite application(s). And there will be probably plenty of other rational and irrational reasons and explanations for the use of certain tools.</p>
      <p>In short, it is a relatively small but complex, diverse and interesting market for font production tools. Objective judgement of the offered technology looks even more complex.</p>
