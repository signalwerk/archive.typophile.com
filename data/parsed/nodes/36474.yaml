    html: <p>Have you who have posted so far really given FontForge a fair shake?  I'm transitioning from my decade old copy of Fontographer to FontForge, and while it hasn't exactly been smooth, the tools in FontForge offer a lot of significant improvements. As far as technical support, if you sign up for both the users and developers (for bug reporting) mailing lists, you have direct access to the program's author who takes very quick action to address any problems, and if it takes altering the program to effect the fix, he'll do so without hesitation (first with a patch, and at least once a month with a full build).</p>
