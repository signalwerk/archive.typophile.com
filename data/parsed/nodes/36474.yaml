      <p>William,</p>
      <p>I appreciate this approach very much. What I really don't like is arguments like "nobody uses it" or "it's an esoteric open source software". You should try it before criticizing it. Or just browse the online documentation at <a class="freelinking external" href="http://fontforge.sourceforge.net/overview.html" rel="nofollow">http://fontforge.sourceforge.net/overview.html</a> and see how powerful FontForge is.</p>
      <p>And yes, I can easily believe no professional designers are using FontForge, but this proves nothing for me. There are several known reasons (I would not like to discuss them here) for which most folks concerned with graphics and design are not familiar with Unix and Unix software. I also think the problem with TTF instructions I have mentioned previously could affect FontForge's popularity too: of course it would be not a real problem for those who have access to VTT, but... there are so many "professional" designers who prefer just to export an autohinted font and then claim their production is perfectly hinted. Unfortunately, this is impossible with FontForge (but probably will be possible soon).</p>
      <p>And, finally, there are very few real professionals in font design anyway (I believe most of them can be found at this forum). I know enough  font foundries which promote themselves as "professional" but actually sell so poorly designed amateurish fonts, that the fact they use FontLab really doesn't matter. On the other hand, I can list several open source font projects implemented at a high professional level (my favorite is the <a class="freelinking external" href="http://junicode.sourceforge.net" rel="nofollow">Junicode</a> font) which use FontForge. I think their designers can be considered real professionals, even if font design is not their main business.</p>
      <p>You can have a look also at my own <a class="freelinking external" href="http://www.thessalonica.org.ru/en/fonts.html" rel="nofollow">Old Standard</a> font. If it has any flaws (and of course it does), FontForge is surely not responsible for them.</p>
