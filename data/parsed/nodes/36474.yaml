      <p>I tried using Typetool, and while it is a great program, I was really just using it to compile fonts that I was building in Illustrator due to some of the Typetool drawing limitations. But I find that drawing letters in Fontlab is often easier, and keeps me from running into the performance and file management issues that come along with keeping the letters in Illustrator. This week I decided to just move on and upgraded to Fontlab, which wasn’t to hard on my wallet now that Fontlab offers academic discounts.</p>
      <p>Something to keep in mind about Fontforge is that, being an esoteric open source program, the amount of quality help and support that you’re likely to get for it is something like nil. If you have trouble with Fontlab, you can just post here and eventually one of the Fontlab programmers will probably answer your question.</p>
