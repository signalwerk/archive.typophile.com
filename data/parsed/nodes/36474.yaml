    <p>I've been having a running conversation on the Design forum about my burgeoning interest in typeface design--I am a book designer and page layout artist. Initially, of course, FontLab Studio comes up as the software package of choice for professional typeface design. Some have said, Type Tool is also something to start with and then, as necessary, make the switch later to FontLab.</p>
    <p>Some mention was made of the open source package FontForge. I'm on a dual processor G5 PowerMac running OS 10.4.10. After understanding what was necessary to get the X11 server package installed, it was an eay matter of installing and running FontForge, even though it is UNIX-based and I am not a techie.</p>
    <p>But I was also told "given that there is a learning curve for any of the programs," I "risk wasting time by going with [FontForge]. ... some software people use it, but not the design community."</p>
    <p>How do folks here feel about that? Is it accurate? Should I just stay away from FontForge, start with TypeTool if the investment is presently too much to get FontLab (but assume that professional typeface design will eventually mean moving to FontLab Studio)? Does anyone do viable, professional creative work in FontForge?</p>
    <p>Thank you.</p>
