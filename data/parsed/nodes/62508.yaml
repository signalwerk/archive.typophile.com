    votes: null
    html: |-
      <p>The glyph palette displays those glyphs which a glyph is mapped <em> to </em>, not those which it is mapped <em> from </em>.</p>
      <p>Assuming your glyphs are named A, A.1, A.2, and A.3, try adding the following to your 'aalt' feature:</p>
      <p><code> sub A.3 by A; </code></p>
      <p>André</p>
