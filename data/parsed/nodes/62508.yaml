    votes: null
    html: |-
      <p>You wouldn't have to write it 383 times. You could just include (with the appropriate class definitions):</p>
      <p><code> sub @Variant4 by @Base; </code></p>
      <p>The 'aalt' feature is the one feature which can include other features, in which case all of the substitutions performed by that feature are included in 'aalt'.</p>
      <p>The results you are getting would seem to indicate that the way in which your features are set up involves multiple different pathways by which some of the glyphs can be mapped to the others. If you can't get the desired results by listing your features, you might want to instead not include those features and just include individual substitution statements like the one above.</p>
      <p>Admittedly, though, I haven't experimented with this technique so I can't give any guarantees. I usually just let FontLab create the 'aalt' feature for me.</p>
