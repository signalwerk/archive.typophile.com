      <p>OK, so I went through Jens link and the aalt feature works for the most part. The font I am working on has four variations for every glyph. When I try to access them through an application the first three "A" glyphs show me all four variations, but the fourth only shows me three (one of them being itself). It is always the default glyph that is not shown, and this happens throughout the entire font not just the "A" glyph.</p>
      <p>Any ideas?</p>
      <p>mw</p>
