    html: <p>You shouldn’t use anything but letters, numbers, periods, hyphens and underscores in a file name under any circumstances, not just when uploading them. I’ve never really understood why the OS programmers even make such file names possible—after all, they’ve been involved in crafting some of the standards that make spaces a problem!</p>
