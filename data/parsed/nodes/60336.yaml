      <p>&gt; if software imposes restrictions on filenames</p>
      <p>HTTP imposes the rules. Most of the web lives on UNIX servers, and a space in Unix means the end of the file name. A period and other punctuation have other meanings.</p>
      <p>Don't blame the software for not adopting every Windows/Mac convention.</p>
