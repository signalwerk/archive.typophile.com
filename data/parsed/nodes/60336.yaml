    html: |-
      <p><cite>HTTP imposes the rules. Most of the web lives on UNIX servers, and a space in Unix means the end of the file name. A period and other punctuation have other meanings.</cite>AFAIK, there's no restriction in HTTP on the format of filenames when uploading from a form (see <a class="freelinking external" href="http://tools.ietf.org/html/rfc1867#section-3.3" rel="nofollow">RFC1867</a>). In UNIX, the only characters that aren't allowed in filenames are "/" and the null character. All other characters are allowed -- although some characters might cause problems for certain software or require escaping.</p>
      <p>Anyway, it's usually best not to use the filename supplied by the browser but instead generate a unique filename on the server when storing the file.</p>
    html_clean: |-
      <p><cite>HTTP imposes the rules. Most of the web lives on UNIX servers, and a space in Unix means the end of the file name. A period and other punctuation have other meanings.</cite>AFAIK, there's no restriction in HTTP on the format of filenames when uploading from a form (see <a class="freelinking external link-external" href="http://tools.ietf.org/html/rfc1867#section-3.3" rel="nofollow">RFC1867</a>). In UNIX, the only characters that aren't allowed in filenames are "/" and the null character. All other characters are allowed -- although some characters might cause problems for certain software or require escaping.</p>
      <p>Anyway, it's usually best not to use the filename supplied by the browser but instead generate a unique filename on the server when storing the file.</p>
