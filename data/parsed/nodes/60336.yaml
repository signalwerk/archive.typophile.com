      <p>"You shouldn’t use anything but letters, numbers, periods, hyphens and underscores in a file name under any circumstances"</p>
      <p>There's very good reasons to use dashes in HTML files for SEO purposes (not to mention making them human-readable). The rest have been adopted by nearly every OS out there, so it's somewhat par-for-the-course. Hence the suggestion to have a disclaimer when that's NOT the norm. ;)</p>
