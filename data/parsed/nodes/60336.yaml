    <p>I spent about 15 minutes trying to upload an image before I realized it was probably the file name. I stripped out punctuation and spaces and then it uploaded.</p>
    <p>I assume there are some restrictions with the filenames for image uploading. I'd suggest putting a disclaimer/note next to the UPLOAD IMAGE link.</p>
