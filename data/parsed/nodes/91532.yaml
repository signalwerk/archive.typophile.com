    html: <p>Futura is such a classy sans-serif face, another sans-serif face would diminish it, not complement it, unless the two faces are radically different in some other way.  Try using a serif face to complement, such as Garamond or Bodoni. Bodoni text with Futura Light headings is a great combination. <a href="http://www.smashingmagazine.com/2010/11/04/best-practices-of-combining-typefaces/" title="http://www.smashingmagazine.com/2010/11/04/best-practices-of-combining-typefaces/">http://www.smashingmagazine.com/2010/11/04/best-practices-of-combining-t...</a></p>
