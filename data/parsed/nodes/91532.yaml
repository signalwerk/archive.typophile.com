    html: |-
      <p>I think Calibre is a nice alternative to Futura, but not as a complement to it.<br><br></p>
      <p>Since it's the logo in Futura, there's no way to know until you try it.<br><br></p>
      <p>I once had success talking a client out of Futura for web copy (Futura at 12 - 14 point on screen is horrible) and we went with Avenir. Avenir at that size, on screen, felt Futura like, but didn't have the problems Futura gets at that size.<br><br></p>
      <p><a href="https://www.google.com/search?q=calibre+kris+sowersby&amp;hl=en&amp;safe=active&amp;prmd=imvnso&amp;source=lnms&amp;tbm=isch&amp;ei=qk9zT4qkGMatiAL20NjRCw&amp;sa=X&amp;oi=mode_link&amp;ct=mode&amp;cd=2&amp;ved=0CAkQ_AUoAQ&amp;biw=1904&amp;bih=1074"><img src="http://cdn.ilovetypography.com/img/2011/05/Calibre.gif"></a></p>
