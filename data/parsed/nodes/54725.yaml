    html: |-
      <p>This is an odd creature. Many of the letterforms seem like Garamond to me, particularly the 'a', but that 'y'seems to be only in Fleischmann. There are four other fonts that Yves once wrote were based on Fleischmann: Mercury by Schwartz, Farnham by Highsmith, Fenway by Carter, and Eudald by Feliciano. From what I could see of them, at least the first three do not have that italic 'y' (I did not have an italic sample for both Eudald versions).</p>
      <p>This seems like a new font to me, so I will be curious to hear what you learn from the publisher.</p>
      <p>- Mike Yanega</p>
