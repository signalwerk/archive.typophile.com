    html: |-
      <p>Genath is my free, simple rendering of a baroque type from the Genath Foundry in Basle, Switzerland. It's based on a 1720 specimen likely showing Johann Wilhelm Haas first design in Basle. Haas, Basle, the foundry produced two centuries later a better known typeface.</p>
      <p>Like JM Fleischmann, JW Haas (1698-1764) was trained in Nürnberg, probably by Johann and Pankraz Lobinger. Both Fleischmann and Haas epitomize a consistent typographic style, specific to Northern Europe. Spreading from Prague to, some extend, London. Truely ‘baroque’, slightly condensed, highly contrasted, with playful, fancy details. </p>
      <p>(All my informations about Genath and Haas come from: Albert Bruckner ‘Schweizer Stempelschneider und Schiftgiesser’ Benno Schwabe, Basle, 1943.)</p>
      <p>Genath is still a private font, but following the interest of Gilles Gavillet and David Rust (Optimo, Geneva) the designers of the JRP Ringier book collection, I will probably release it in a near future.</p>
      <p>-François Rappo</p>
