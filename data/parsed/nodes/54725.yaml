      <p>I tried to post on this a few days ago, and I see it never made it (my internet connection has been flaky recently). In an odd (probably not) coincidence, François Rappo has designed fonts for Optimo, and Optimo has a serif family called Stockmar that is based on a design of Johann Rodolf Genath, done by Matthieu Cortat. One of the italic versions of Stockmar has a y quite like the odd one we have been commenting about. I have samples in my <a class="freelinking external" href="http://www.bowfinprintworks.com/SerifGuide/serifsearch.php" rel="nofollow">Serif Font ID Guide</a>. You can search by designer, as well as font name.</p>
      <p>- Mike Yanega</p>
