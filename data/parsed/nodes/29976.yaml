    html: |-
      <p>Quite similar to "Element", one of the Neugotische Schriften came up in the (end of) 1920s/1930s in Germany. Some people connect them strongly with the 3rd Reich, the nationalsocialist Germany, anyway.<br>
      "Element" you could buy here:<br>
      <a href="http://www.romana-hamburg.de/fraktur6.htm" title="http://www.romana-hamburg.de/fraktur6.htm">http://www.romana-hamburg.de/fraktur6.htm</a> (search the list)</p>
      <p>Something more -<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/neugothisch_4811.png"></div><br>
      Here you see 2 others that were popular – Tannenberg and Potsdam. Other fonts from this categorie were, for example, Lichte National, Standarte, Deutschland.<br>
      And…<br>
      The red A is still used nowadays as a sign for pharmacies all over germany.<p></p>
      <p>T.</p>
