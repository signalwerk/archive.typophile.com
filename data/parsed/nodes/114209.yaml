      <p>Closer to "strength and color" the original poster is asking about would probably be Poliphilus and Blado. I remember these with photocomp, in yet another attempt to recover the look of letterpress. Never caught on, and yet they were closer to that look with the repro-negative-plate systems (photocomp and early digital) than with current digital systems.</p>
      <p><a href="http://www.myfonts.com/fonts/mti/poliphilus/" title="http://www.myfonts.com/fonts/mti/poliphilus/">http://www.myfonts.com/fonts/mti/poliphilus/</a></p>
      <p>As far as the mechanical requirements of linecasters, teach your great grandmother to suck eggs. I started with them. And always felt that any effort to revive fonts the linecasters themselves were reviving should also restore the f, j, etc., and if duplexed mats were involved (as with Linotype), the italic letters also cut off -- j again, and y.</p>
      <p>In fact, I think it a disservice to those who designed fonts specifically for the linecasters -- essentially, commissions from the first half of the 20th century -- to assume they preferred the letterforms they had to create, given the requirements of the machines. I would be tempted, in any digital revival of those fonts, to make versions with extenders implicit in the design, without the consideration of mechanical requirements. YMMV.</p>
      <p>But none of this speaks to the differences between the ink-on-paper differences between 16th century letterpress &amp; 16th century inks and papers, versus contemporary laser or offset practices.</p>
