      <p>There may be a gap in the range of Jensons, but the market for Jenson revivals is practically non-existent at the moment. </p>
      <p>Revivals of the classics occupied an early phase of the switch to digital. Now the interest is more in original designs, especially sans.</p>
      <p>The bundling of the classics by Adobe etc., and now Google’s free fonts, have severely diminished what market there was for old style (antiqua) revivals.</p>
      <p>Nonetheless, there is some interest in faces such as Williams Caslon—but bear in mind that it is published by Font Bureau, and has been well publicized by Mr Berkson, here at Typophile, at type conferences, online at I Love Typography, and elsewhere.</p>
