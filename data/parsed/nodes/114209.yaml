      <blockquote><p>A while ago I reproduced some old letterpressed pages using digital fonts. In some cases I tweaked some of the display letters to get more of that original charm back, but as you can see here, in general it's still a lot more sterile and frankly doesn't look as impressive.</p></blockquote>
      <p>Well. I'm impressed.</p>
      <p>Beyond that, letterpress has it's downside, too. A good friend of mine, the designer Rich Hendel, spent the first half of his career where books he designed were always set hot metal. He  thinks modern type/printing is much better. I'd point out some of the old treasures like <cite>Hypnerotomachia Poliphili,</cite> and his rejoinder is something akin to "yes, and for every good one, there were literally thousands of bad ones." </p>
      <p>And there are. I have a 12th printing (first printing 1903, 12th 1906) of Jack London's <cite>The Call of the Wild</cite> that is so bad you want to cry -- or take it to the outhouse for spare wiping material. Everything is bad -- except, probably the technical quality of the stereo plates (meaning the original was bad, too). Not an unimportant book, at least in the States. Many, many similar examples...</p>
