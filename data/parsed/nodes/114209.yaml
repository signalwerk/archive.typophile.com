      <p>Oliver,</p>
      <p>The typefaces I chose depended on the source. I obviously couldn't find exact matches but I managed to get pretty close by using mostly Adobe Caslon Pro. I also used an alternate cut of a different Caslon font, I used Garamond Premier Pro and I believe I used some Elzevir cut somewhere as well. Generally I just stayed close to what I know to be historically commonly used typefaces of the time, so Caslon would be the first choice.</p>
      <p>For these reproductions my goal was to reproduce the pages using modern fonts. I did a lot of bad typographical practices like irregular spacing to get the charming effect of the original into the work, but it wasn't my goal to make the reproduction as accurate as possible. Another step towards such a goal would be the use of textures and filters to get the ink texture and irregularities of the lead letters and a final step would be to fake lighting and shadows.</p>
