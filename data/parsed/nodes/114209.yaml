      <p>As I've noted, apparently correctly, as an eminent typographer (Bruce Rogers) agreed, Ludlow's Eusebius was the closest revival of Jenson's type. This has been revived digitally as Nicolas Jenson SG.</p>
      <p>A close resemblance in the shape of the individual letters, of course, may still not yield a match for the overall texture that you are seeking. But I think that would be the typeface to try before giving up on finding it already out there.</p>
