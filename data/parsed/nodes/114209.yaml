      <blockquote><p>... I did mean ‘distressed’ by ‘weathered’, and Poliphilus isn’t distressed, just, as I understand it, somewhat irregular because it’s based on the typeface as it appeared on the page, allowing for inkspread, rather than trying to get back to the shape of the metal.</p></blockquote>
      <p>Actually, allowing for ink spread is a part of designing the typeface in the first place, a necessary step. However, I think I know what you mean -- Poliphilus shows the variations of a particular *instance* of the piece of type a pressed into the paper, with attending warts, rather than the general effect.</p>
      <p>Looking at the piece of metal &amp; reconstructing its outlines without taking into account the spread of ink is why first photocomp, now digital revivals look so pale &amp; spindly. The ink spread needs to be accounted for, but regularized. Nor was this a surprise to the designers of type in those days. They would test a letter's design, then adjust it, based on the actual inkspread.</p>
      <p>You might enjoy Fred Smeijer's book <cite>Counterpunch</cite>. More people should read it, including, IMSLTHO, contemporary type designers.</p>
      <p><a href="https://hyphenpress.co.uk/authors/fred_smeijers" title="https://hyphenpress.co.uk/authors/fred_smeijers">https://hyphenpress.co.uk/authors/fred_smeijers</a></p>
      <p><cite>Edit</cite></p>
      <p>Until you've enough interest to spring for Trinité, Golden Cockerel might interest you. While I don't particularly care for it, it does have some of the characteristics you're looking for.  </p>
      <p><a href="http://www.fonts.com/font/itc/itc-golden-cockerel#product_top" title="http://www.fonts.com/font/itc/itc-golden-cockerel#product_top">http://www.fonts.com/font/itc/itc-golden-cockerel#product_top</a></p>
      <p>BTW, Trinité has no ligatures, and no kerning. Whether or not it's worth the price is, as always, an individual's decision.</p>
