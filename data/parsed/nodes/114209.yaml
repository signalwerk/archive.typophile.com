    html: |-
      <p>I find each sample you provided to be charming and contextually beautiful. That is to say, I recognize the bad typography but it doesn't quite register. I mean, I have plenty of 19th century and 20th century books which I bought not because of the content but because of the age and printing, and particularly the books from around 1920 I have are set in these Scotch typefaces. I guess in a way it's a natural progression from Baskerville. What I do notice is the wide spacing and plentiful gaps in the texts because of the justified text. Can't this be attributed to the lead letters though rather than the typographer? With modern software it's easy to make justified text look good and make it practical to read, but I can imagine with old printing techniques there just wasn't much control over the typography if the typeface is bad. I have to say though, most of these Scotch typefaces simply appear too light in print.</p>
      <p>Also, when you refer to a typeface as bad in this context, I assume you're not necessarily referring to the design, right? If you are, I don't think I could judge the quality of a Scotch in use that well. The before-last link (Uncle Tom's cabin) looks alright to me. The last one (Integral Calculus) doesn't, but I like that. It would probably annoy me if I were to read a whole book set like that though (although I'm quite certain I did read the Bible set in a Scotch face, which wasn't the best read).</p>
