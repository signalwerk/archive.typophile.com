      <p>I love the effect on the page. What I observe at a causal glance is a low contrast typeface, with wide letter-forms and generous spacing. Note that the letterforms have considerable variation in shape and details for an almost hand written effect that I find quite pleasing to the eye. I'll leave it to the experts to opine further.<br>
      As for digital typefaces, I am not totally satisfied with anything I have seen.  IMHO most digital fonts are too compressed and mechanical in design to give this effect. But I expect that you will get some suggestions that will come at least part way in meeting your request.<br>
      Don</p>
