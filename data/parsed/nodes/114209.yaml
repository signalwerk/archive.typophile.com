      <p>This edition of The Call of the Wild comes from about the right time, but it has decent typography:</p>
      <p><a href="/wiki/https%3A/%252Farchive.org/details/callofthewild00londrich" class="freelinking" rel="nofollow">https://archive.org/details/callofthewild00londrich</a></p>
      <p>and similarly this one</p>
      <p><a href="/wiki/https%3A/%252Farchive.org/details/cu31924021763549" class="freelinking" rel="nofollow">https://archive.org/details/cu31924021763549</a></p>
      <p>or this one</p>
      <p><a href="/wiki/https%3A/%252Farchive.org/details/callofwild00lond" class="freelinking" rel="nofollow">https://archive.org/details/callofwild00lond</a></p>
      <p>Not good typography in some ways; too much space, so there was laziness involved, in some of these editions, but decent-looking typefaces and readable. I was expecting something execrable, on the order of</p>
      <p><a href="/wiki/https%3A/%252Farchive.org/details/adventurebeautif00whitrich" class="freelinking" rel="nofollow">https://archive.org/details/adventurebeautif00whitrich</a></p>
      <p>actually, this isn't that bad, although it goes in the direction of the kind of Scotch Roman that is not to my taste; but despite horrendous typography coming up so often when one doesn't want it, it's hard to find it when one is looking for it.</p>
      <p><a href="/wiki/https%3A/%252Farchive.org/details/champesadventure00leeh" class="freelinking" rel="nofollow">https://archive.org/details/champesadventure00leeh</a></p>
      <p>illustrates a somewhat unattractive typeface but too large to be unreadable.</p>
      <p>Ah, this is not an attractive typeface,</p>
      <p><a href="/wiki/https%3A/%252Farchive.org/details/cu31924098819562" class="freelinking" rel="nofollow">https://archive.org/details/cu31924098819562</a></p>
      <p>being quite narrow, but not also too light, as were the worst of the old Scotch Romans...</p>
      <p><a href="/wiki/https%3A/%252Farchive.org/details/uncletomscabin00stowuoft" class="freelinking" rel="nofollow">https://archive.org/details/uncletomscabin00stowuoft</a></p>
      <p>finally at least <em>approaches</em> what I seek to put forwards as an example of a bad Scotch Roman.</p>
      <p>And, this, conversely - from a Ginn and Company textbook, so I presume it's Linotype and not Monotype - is an example of a good Scotch Roman. (Linotype did advertising figures too, so while they could never do four-line mathematics, very basic mathematical setting was not beyond their system.)</p>
      <p><a href="/wiki/https%3A/%252Farchive.org/details/IntegralCalculus" class="freelinking" rel="nofollow">https://archive.org/details/IntegralCalculus</a></p>
      <p>Here is an image; on top, a "bad" Scotch Roman, and on the bottom a "good" Scotch Roman.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/SCOTCH_5920.jpg"></div><p></p>
      <p>The bad one doesn't look so much worse than the good in the image, though, since it's shown in a larger size so that the column widths match, and that makes the bad one look better.</p>
