      <p>Charles: I didn’t know Trinité at all. What an extraordinary font! To my eyes, it comes closest to capturing the effect of the 1475 sample. Sadly (but perhaps justifiably) the price is extraordinary too. The Dutch Type Library typefaces look exceptionally well made, but nothing quite so close to what I have in mind. Were money no object, I think it’s Trinité I’d buy; as it is, for the moment, I shall wait.</p>
      <p>John: You’re quite right, I did mean ‘distressed’ by ‘weathered’, and Poliphilus isn’t distressed, just, as I understand it, somewhat irregular because it’s based on the typeface as it appeared on the page, allowing for inkspread, rather than trying to get back to the shape of the metal.</p>
      <p>Nick: What a pity the market for revivals is so flat. Someone might think they’d seen all the Garamonds they could possibly want to and wonder what the point of another would be. But then they come across MVB Verdigris.</p>
      <p>Oliver</p>
