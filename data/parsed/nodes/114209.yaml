      <p>all kinds of factors, starting with ink &amp; how the ink is put on the paper -- i.e., the ink itself, how it sits of the type, how the type is pressed into the paper, how it is thus distributed (also depends on the paper, soft, wetted, etc.). If you can see the letterforms of the metal type versus the eventual printing, you'll also notice that the transfer of the ink was not linear -- percentagewise, the fine lines put down a wider path than the heavy. Then too, the letter pressed into paper puts more ink along the edge, with offset printing, the center of black is usually the center of the line put down, not the outside.</p>
      <p>Just get a good glass and some good samples of type &amp; print, and look. </p>
      <p>As to </p>
      <p><cite>(2) Is there any digital typeface which might achieve the same strength and colour?</cite></p>
      <p>If you look at what I've just said, is isn't just about the "digital typeface." For example, you'll never get the slight randomness of individually cast letters with digital type. </p>
      <p>If you're after the look of metal Jensen, it could be done, but for a number of reasons, the physical object you hold (the book) wouldn't be the same, &amp; likely, not many would be interested. An experiment, not a product.</p>
      <p>If it really is just "strength and color," see</p>
      <p><a href="http://www.designfreebies.org/wp-content/uploads/2010/08/free-body-text-font-charis.jpg" title="http://www.designfreebies.org/wp-content/uploads/2010/08/free-body-text-font-charis.jpg">http://www.designfreebies.org/wp-content/uploads/2010/08/free-body-text-...</a></p>
      <p>has a a similar quality of "strength and color," but vastly different letterforms.</p>
