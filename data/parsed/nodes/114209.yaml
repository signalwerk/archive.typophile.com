      <p>I'm going off on what might seem to be a tangent here, bear with me.</p>
      <p>Y0-Yo Ma has an electronic cello he can make sound virtually identical to his Guarneri. That it can also be made to sound different isn't relevant to this point. That when he chooses to make the electric sound like the Guarneri is.</p>
      <p>But Ma, or a human of similar skill, has to play it. Click/flash/change. We can make a rhythm track to replace the drums. But it's metronomical precision soon lets everyone know it's a computer, useless beyond punching up the evening news. A human drummer is not a metronome, and musically, that's a vitally important difference.</p>
      <p>It is the same with printing, with the "warmth" of letterpress. Font outlines can be drawn to have the contrast of a (mythical) typical letter, as found printed letterpress. But the use of the computer in printing today makes every letter (a, l, e, etc.) look the same, and perhaps worse, the spacing too is identical in all planes. There is a feeling of precision, and an attendant lack of warmth.</p>
      <p>Now in type, anyway, the variations found in letterpress seem to me to be due to pure randomness, rather than the performance skill of the typesetter and printer. (OK, there are a few "performance skills," but unlike music, most of them can be quantified &amp; programmed.)</p>
      <p>So I think any attempt to get the "warmth" of letterpress will fail, until a slight amount of randomness is introduced at all points -- the letterforms themselves, and their horizontal and vertical spacing, etc. Unlike music, I do think this can be programmed, as it's occurrence in metal/letterpress is also random, without any conscious or attentive thought. AFAIK though, not much work has been done along these lines.</p>
      <p>On my analogy, the digital font would be the electronic cello. Not that hard to create. Playing it is a different matter.</p>
