      <p>Well, if you don't mind spending a lot of money, take a look at Trinité, and some of the offerings from the Dutch Type Library. Trinité, which I have licensed, costs around €1400 for a "bundle." Luckily for me, I got it when the Euro was only $0.85; it still was U.S. $1,000 at the time.</p>
      <p><a href="http://www.teff.nl/fonts/trinite/" title="http://www.teff.nl/fonts/trinite/">http://www.teff.nl/fonts/trinite/</a></p>
      <p>(Use the narrow.) I bought this to use for one customer, a noted designer at a university press who paid for it out of his own pocket so the press could use it. Due to licensing issues, we both had to have a copy. None of the other publishers I work for think they can afford it.</p>
      <p>The DTL fonts are  little cheaper, though when you put together enough for a "bundle," they're up there.</p>
      <p><a href="http://www.dutchtypelibrary.nl/" title="http://www.dutchtypelibrary.nl/">http://www.dutchtypelibrary.nl/</a></p>
      <p>Extremely good fonts; perhaps what you're looking for -- a sensitive reinterpretation given modern materials and techniques. None of my customers can afford them, though.</p>
      <p>(Note: this "We can't afford it" comes from people who just can't use the same fonts over and over -- another new phenomena, but one that has primed the proliferation of fonts. Winning font design these days has to keep the price down, at least in the book world.)</p>
