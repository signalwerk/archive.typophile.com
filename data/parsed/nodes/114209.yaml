      <p>Thank you to everyone for their help and the introductions to Charis, Nicholas / Goodchild, Eusebius / Nicholas Jenson SG and Poliphilus / Blado.</p>
      <p>Ironically, of these typefaces, the closest in letterform to the original (Eusebius, ignoring the ‘f’) looks least likely to my (unprofessional) eyes to create the same sort of effect on the page, whereas Charis (which couldn’t be more different) does have something of the same colour. Poliphilus does seem to be similarly low contrast, but the weathered effect is a little eccentric for everyday use.</p>
      <p>I take Charles’ point that paper, ink and process matter as well as typeface, but I do wonder if there isn’t a gap in the market for a Jenson revival that’s:</p>
      <p>more-or-less faithful (but not self-consciously archaic),</p>
      <p>somewhat calligraphic (but not excessively so) and</p>
      <p>(above all) low contrast, so as to try to get the look of the 1475 sample, rather than the shapes of the lost metal used to create it (but not uneven in the way Poliphilus is).</p>
      <p>Oliver</p>
