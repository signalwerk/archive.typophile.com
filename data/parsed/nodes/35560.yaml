    html: <p>I don't believe it's possible to do that in any of those programs.  Fireworks is the most capable of the bunch, and unless they just added the feature, it doesn't let you do type around a curve like that. Just doing the circles and arrows would be a lot of work, although you could probably stack a bunch of circles of different sizes, using some the same color as the background to make it appear that there are curved lines, and then draw in the arrowheads manually. It's easy in Adobe Illustrator, but none of the programs you have are made to do things like that.</p>
