    html: |-
      <p>1) Make a circle.<br>
      2) Cut the path of the circle into as many sections as you need arrows.<br>
      3) Set the appropriate stroke size<br>
      4) On each path section, use the "Filter-&gt; Stylize-&gt; Add Arrowheads" to add your arrow shapes<br>
      5) Optional: Use "Expand Appearance" to turn each section into it's own object.</p>
      <p>Hope this helps.</p>
