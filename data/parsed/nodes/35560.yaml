    html: <p>Visio has a circular arrow shape. Go to File &gt; New &gt; Charts and Graphs &gt; Marketing Charts and Diagrams. If you just click on the shape to add text, Visio puts the text in the middle of the circle. To put text on each individual arrow, you have to ungroup the shape; the text then sorta-kinda curves inside the arrow.</p>
