    <p>I won a few hundred in a tombola yesterday and I decided to treat myself to... a couple of typefaces! (pathetic)</p>
    <p>I'm a university student and I'm looking for a pair to work well with plain, black-and-white double spaced research papers written in Microsoft Word (I do apologize). I'm searching after:</p>
    <p>Sans:</p>
    <ul>
    <li>Boldyish face for headings</li>
    <li>it's italic for book titles</li>
    <li>possibly it's caps if not expensive</li>
    </ul>
    <p>Serif:</p>
    <ul>
    <li>Good text at 12pt double spaced Word</li>
    <li>it's italic</li>
    <li>it's caps</li>
    </ul>
    <p>I'm looking for something slightly away from the standard Helvitica Bold and Times; something that still would look natural in such a setting, but yet also establish a personal, unique style and make an impression on the graders of the paper. Hopefully I can find this <strong>under a couple hundred</strong> (the more I can get for that amount the better however), but most preferably with typefaces that I could expand with other weights when I strike it rich. Perhaps you could make a few suggestions.</p>
    <p>many thanks</p>
    <p>sean</p>
