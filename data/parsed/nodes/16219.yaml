    <p>Inventor of the Benton Pantograph, owner of the <a href="/node/add/wiki?edit%5Btitle%5D=Benton%20Waldo%20Type%20Foundry" title="Create node &quot;Benton Waldo Type Foundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Benton Waldo Type Foundry</a> of Milwaukee, and father of <a href="/node/13617/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Morris Fuller Benton</a>.</p>
    <p><span class="caps">L. B.</span> Benton was born in Milwaukee, Wisconsin, the son of a newspaper editor and publisher. At a very early age he learned to set type and studied jewelry repair. In 1873 he bought the Northwestern Type Foundry after it went bankrupt and began to learn the type founding business. He was an extremely meticulous and precise person who even lamented the fact that steel would slightly change size if one breathed on it. Reportedly he had an office boy whose sole task was to keep the pencils on Benton’s desk&nbsp;sharp.</p>
    <p>He invented several pieces of equipment; one, the delineating machine, had to be demonstrated to the <span class="caps">U. S.</span> Patent Office as it was thought to be a mechanical impossibility. He is best known for developing the <a href="/node/add/wiki?edit%5Btitle%5D=Benton%20Pantograph" title="Create node &quot;Benton Pantograph&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Benton Pantograph</a>, a pantographic cutting machine or engraver originally designed to cut punches for type, and later adapted to cut type matrices. The machine was licensed by the <a href="/node/add/wiki?edit%5Btitle%5D=Linotype%20Co." title="Create node &quot;Linotype Co.&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Linotype Co.</a> to cut matrices for their casting&nbsp;machines.</p>
