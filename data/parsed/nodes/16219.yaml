    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Linn Boyd Benton</strong></p>
    <p>Inventor of the Benton Pantograph, owner of the <a href="/wiki/Benton%20Waldo%20Type%20Foundry" class="freelinking" rel="nofollow">Benton Waldo Type Foundry</a> of Milwaukee, and father of <a href="/wiki/Morris%20Fuller%20Benton" class="freelinking" rel="nofollow">Morris Fuller Benton</a>.</p>
    <p>L. B. Benton was born in Milwaukee, Wisconsin, the son of a newspaper editor and publisher. At a very early age he learned to set type and studied jewelry repair. In 1873 he bought the Northwestern Type Foundry after it went bankrupt and began to learn the type founding business. He was an extremely meticulous and precise person who even lamented the fact that steel would slightly change size if one breathed on it. Reportedly he had an office boy whose sole task was to keep the pencils on Benton's desk sharp.</p>
    <p>He invented several pieces of equipment; one, the delineating machine, had to be demonstrated to the U. S. Patent Office as it was thought to be a mechanical impossibility. He is best known for developing the <a href="/wiki/Benton%20Pantograph" class="freelinking" rel="nofollow">Benton Pantograph</a>, a pantographic cutting machine or engraver originally designed to cut punches for type, and later adapted to cut type matrices. The machine was licensed by the <a href="/wiki/Linotype%20Co." class="freelinking" rel="nofollow">Linotype Co.</a> to cut matrices for their casting machines.</p>
