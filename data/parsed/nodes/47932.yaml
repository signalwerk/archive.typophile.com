  html: |-
    <p>ReType announce the release of Yomar Augusto's 'Lasagna' typeface. </p>
    <p><a href="http://www.re-type.com" title="http://www.re-type.com">http://www.re-type.com</a></p>
    <p>'Lasagna' began as an experimental font used by Yomar Augusto in CDs and posters. It is an ironically geometric typeface suitable for contemporary design work. </p>
    <p>Yomar Augusto is a brasilian graphic designer, graduated in the Type &amp; Media's Royal Academy of Art, The Hague.<br>
    He has been involved in two Rojo ArtStorm projects and been published by Taschen in 'Contemporary Graphic Design'.<br>
    Recently, he took part in the Letter Forest art show, which featured experiments in calligraphy, painting, drawing and printmaking, and was held at Nanzuka Underground Gallery in Tokyo, Japan.<br>
    Yomar lives in Rotterdam and is currently working at 180Amsterdam in Amsterdam, The Netherlands.</p>
