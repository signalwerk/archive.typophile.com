      <p>No, I didn't mean any harm. It's not for a client, its for an independent art project. Stealing is not really my thing - the typeface is only a small part of the project and I wasn't planning to name the new typeface or distribute it. But if I ever choose to circulate the whole project (which will contain the typeface) I don't want to experience any legal problems. </p>
      <p>I would also like to know why it is illegal... Don't type designers ever redraw or trace type in order to make adaptations of it? Didn't Robert Slimbach redraw the work of Garamond? All type can be copied by eye or by tracing, even the spacing between it, right? This issue feels like a question of individual ethics. It seems to be part of an older problem - the difference between 'being influenced' and 'appropriation'. </p>
      <p>If you make something completely different out of something old, does it really matter how you got there?</p>
      <p>Or is it about the ease with which the software makes the borrowing possible? So it's not what you steal, it's how quickly you do it that makes it wrong?</p>
