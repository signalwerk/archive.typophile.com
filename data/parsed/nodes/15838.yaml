    html: |-
      <p>Hi Novice.<br>
      When Mr Slimbach made Adobe Garamond, I can pretty much guarantee that he didn't open ITC Garamond, Garamond 3, and Stempel Garamond, do some copy'n'pasting and make a few tweaks, and voila! Adobe Garamond! He drew all of the letters from scratch referencing historical models. </p>
      <p>Which is legally okay, since the models in question are no longer protected by copyright. And there are a lot of really talented type "historical re-enacters" who make wonderful new forms based on historical models. Mr Carter, Mr Porchez, Mr Hoefler, Mr Feliciano, Ms Licko, and Mr Storm are among the great talents who have made type based on old models.</p>
      <p>That being said... I fully endorse the exploration of existing fonts for new type designers. You can learn a great deal about making type by seeing how the greats make theirs. This is akin to listening to Miles Davis's or Charlie Parker's solos; you can learn a great deal from attentive listening about structure and phrasing. But don't go out and play Miles Davis CD and call it your musicianship, and don't learn those solos by rote and perform them and call them original.</p>
      <p>So. As Nick and Tiffany noted, you should read the EULA to see what the publisher of the font you are wanting to fiddle with says about such fiddling. For many publishers, this kind of fiddling is forbidden, and for some others it is permitted within certain constraints. Please do stick to the terms of the EULA; adherence to the EULA is the only thing we type publishers ask of our clients, and most of us are reasonable small business people, just trying to make a living in a risky profession.</p>
      <p>Thanks.</p>
