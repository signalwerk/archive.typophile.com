    date_raw: 27 Oct 2005 — 1:00pm
    votes: null
    html: <p>Tara, redrawing/retracing is different from reusing the font data itself. Consider the imperfect analogy of taking your own photograph of El Capitan vs making a photocopy of Ansel Adams'. Mere "mechanical" copying typically does not differentiate between the copyrightable and noncopyrightable portions of a work. If there's any copyrightable data in your finished font that owes its origin to the source font, you've constructed a "derivative work". Whether constructing a particular derivative work is legal depends on the EULA and whether fair use is applicable (often tricky to determine).</p>
    html_clean: <p>Tara, redrawing/retracing is different from reusing the font data itself. Consider the imperfect analogy of taking your own photograph of El Capitan vs making a photocopy of Ansel Adams'. Mere "mechanical" copying typically does not differentiate between the copyrightable and noncopyrightable portions of a work. If there's any copyrightable data in your finished font that owes its origin to the source font, you've constructed a "derivative work". Whether constructing a particular derivative work is legal depends on the EULA and whether fair use is applicable (often tricky to determine).</p>
