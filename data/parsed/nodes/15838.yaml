      <p>Check the EULA.<br>
      Many foundries allow modification.<br>
      Here's the relevant part of my EULA:</p>
      <p>2.6 Modifications. You may modify typesetting produced by the<br>
      Fonts in any way you see fit. You may also modify the Fonts for your<br>
      own personal or internal business use, but you may not distribute,<br>
      or transfer your adaptations without written permission from the<br>
      Shinn Type Foundry; this means (a) you may not make customized<br>
      versions of the Fonts for use by your clients, and (b) you may not<br>
      adapt, or merge the Fonts to create hybrid Fonts for resale. Each<br>
      workstation where a modified Font is installed shall be counted as<br>
      one of your permitted number of users.</p>
      <p>I guess I didn't stipulate whether you may "call it your own"!</p>
