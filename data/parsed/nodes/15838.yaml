  html: <p>I was wondering about the legal implications of editing a pre-existing font... If i want to make an adaptation of an existing typeface, is it legal to open it in Fontlab and edit it and re-save it as my own? I am trying to create something for a design concept I have and don't intend to sell the typeface I create - does that make a difference?</p>
