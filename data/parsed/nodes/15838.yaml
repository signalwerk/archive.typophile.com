    html: |-
      <p>Open Source fonts, released under the SIL Open Font license, allows you to open the font, make edits, and save it as a new font under a new name.</p>
      <p>But you can't say it's your font.<br>
      You must keep the credits of all the people involved in the original version, and add your name to the list.<br>
      Also, you must specify what you have modified in the FONLOG.txt file that must be distributed together with your new font.</p>
      <p>What's your main motivation to edit and existing font?<br>
      Maybe you want to fix an error, or tweak the spacing or kerning.<br>
      Maybe you want to change a glyph that you don't like.<br>
      Maybe you want to add diacritics to support new languages.<br>
      Maybe adding ligatures.<br>
      Maybe you want to make it a little lighter (or bolder, or condensed or wider) to better suit your printing needs.</p>
      <p>I see those kind of modifications with good intentions to be perfectly valid, as long as you keep the credits of the original designers. Keep in mind that this only applies to Open Source fonts, not commercial ones.</p>
      <p>If you want to modify a commercial font, the right thing to do is to contact the original foundry/designer first. Some designers allows modifications to create custom branding fonts, some charge a little extra money to allowing the modifications, some others don't.<br>
      Always ask the original designers first.</p>
