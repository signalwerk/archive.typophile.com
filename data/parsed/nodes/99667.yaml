      <p>This is at least the second time this particular typeface has shown up. It could be classified as late Jugendstil or Secession (first two decades of the twentieth century). It share many characteristics with Miller and Richard’s Bohemian…</p>
      <p><a href="http://www.myfonts.com/fonts/nicksfonts/millrich-moravian-nf/" title="http://www.myfonts.com/fonts/nicksfonts/millrich-moravian-nf/">http://www.myfonts.com/fonts/nicksfonts/millrich-moravian-nf/</a></p>
      <p>but it’s obviously not the same typeface. IIRC, one of the other samples came from an Italian foundry, which is not an area I know a great deal about…yet…</p>
