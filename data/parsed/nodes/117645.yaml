      <p>Welcome to Typophile, Stephanie.</p>
      <p>A few thoughts.... If you're going to use a football shape, I'd try to keep the logo that shape, rather than putting it in a box. "Geelong" looks almost like an afterthought in that small, handwritten font; I'd make it big and bold, probably centered over Umpires. I'm not sure what that thick black line is supposed to represent (hand signal? map?); I'd avoid mixing too many different elements in a logo. Keep it simple.</p>
      <p>I'd suggest putting Geelong and Umpires in the same font, bigger, delete the box and the odd black line, make the ball orange and the type white, and see how that looks. (Is this mostly for men? If so I might pick a font that look a bit more bold and angular.)</p>
      <p>Designing a logo is hard, keep working on it!</p>
    html_clean: |-
