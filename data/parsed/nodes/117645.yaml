    <p>Design Brief – Logo<br>
    The Geelong Football Umpires' League provides umpires to officiate community level Australian Rules Football matches across several competitions in the Geelong and greater Barwon region of south west Victoria in Australia. We are a Not-For-Profit organization of just over 300 members who officiate at senior and junior level competitions. There are two primary target audiences apart from our active membership:<br>
    (1)	The prospective recruiting group from ages 13 to 30 and<br>
    (2)	The other stakeholders of Aussie Rules competitions in our region including over 5,000 player participants, club and league officials and their supporters.<br>
    Umpiring local Aussie Rules football is our sport; we do it to be involved in the game we enjoy; it is our recreation and hobby; we aim to have fun but we also take our officiating as serious business to support the game properly without fear or favour.<br>
    Your task is to develop a new logo. This logo, along with the words Geelong Umpires will be used to represent the Geelong Football Umpires' League.  Your design needs to incorporate both graphic and text elements. </p>
    <p>GFUL Logo design: From my research I found that they're uniforms are organge and black so I wanted to incorporate that into my design somehow. I also wanted the word "umpires" to stand out most and look strong as the umpires are who control and officiate the game. Personally when I think of AFL umpires I think of their hand signals when a team scores points so that was the the main image I wanted to use. I also used the shape of a football to border the type and graphics used.</p>
    <p>Any feedback would be greatly appreciated.</p>
