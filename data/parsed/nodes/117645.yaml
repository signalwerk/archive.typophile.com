      <p>Thank you so much for your feedback. My close family and friends don't want to hurt my feelings so I'm continually getting "that looks great", which isn't helping me in the long run. </p>
      <p>I didn't mean to box it as such I was more so putting it on an orange background as that is the colour of their t-shirt. So I would have been better off actually putting the logo on an orange T-shirt to show where I was coming from? </p>
      <p>I really wanted to steer away from using a football as that seems to be everyone's idea. With the thick black line it is supposed to be the hand signal for when they award points but it's not obvious enough I've come to realise. Originally I just had that line but it didn't 'scream' aussie rules football so that's why i gave it the football shape.</p>
      <p>I'll take on board what you've said and make a few adjustments, thank you :-)</p>
      <p>I did just have another play around with and rearranged the two images. Family and friends like it better because the hand signal is more obvious but I'm thinking it's possibly, again, too many elements?</p><div class="imageWrap"><img src="http://typophile.com/files/Geelong-umpires-logo-idea-2_4057.jpg"></div><p></p>
