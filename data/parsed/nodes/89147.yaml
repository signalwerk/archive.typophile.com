    html: |-
      <p>Works for me on the iPad, live zooming and all. </p>
      <p>Mind you, SVG is not nearly as good supported as, say, PNG. Maybe you can remember the good old days when the latest Internet Explorer could not display most transparent PNGs (what was it, the version before the current one?). My iPad runs Safari, or something quite close to it, and has no problems with an SVG. Other browsers may need a plugin for this.</p>
      <p>[Edit].Ooh I just Googled for "typography filetype:svg" to find an appropriate image. Lots of interesting stuff, all in gorgeous scaling vector format.<br>
      You'd have to try if they work with uploading to Typophile's Upload Image function -- it seems it's a bit buggy lately.</p>
