    html: |-
      <p>How-to for other dummies like me:</p>
      <p>1. Save your SVG somewhere in the internet (e.g. <a href="http://www.w3.org/Icons/SVG/svg-logo-h.svg" title="http://www.w3.org/Icons/SVG/svg-logo-h.svg">http://www.w3.org/Icons/SVG/svg-logo-h.svg</a>)<br>
      2. Use the url in the following html tag:<br>
      <code><br>
      &lt;img src="http://www.w3.org/Icons/SVG/svg-logo-h.svg" /&gt;<br>
      </code><br>
      3. You can put this code snippet anywhere in your comment. You will get<br>
      <img src="http://www.w3.org/Icons/SVG/svg-logo-h.svg"></p>
      <p>Thank you very much Theunis!</p>
      <p>I would find it cool, if svg pictures were also allowed under the "Insert image" button.</p>
