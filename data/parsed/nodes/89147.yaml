    html: |-
      <p>Same with IE8 on Windows 7 -- it shows the "missing graphic" graphic. That's without any additional plugins.</p>
      <p><a href="http://en.wikipedia.org/wiki/Scalable_Vector_Graphics" rel="nofollow">Wikipedia on SVG</a>:<br>
      "Native support became partially available in Internet Explorer 9 (the current version of IE, as of March 2011)."<br>
      [...]<br>
      "Internet Explorer, up to and including IE8, was the only major browser not to provide native SVG support."</p>
      <p>According to that same page, lost of other browsers are reported to 'partially' and 'incompletely' support SVG.</p>
      <p>I guess that's your answer.</p>
