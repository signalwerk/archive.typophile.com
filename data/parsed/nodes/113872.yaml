    <p>Can anyone figure out the logic behind the page construction?<br>
    Page size is A4 (210 × 297 mm) and the grid is 468 × 657 pt (Didot points – 0.376 mm; 175.968 × 247.032 mm).<br>
    I've been trying to reconstruct it in Illustrator from the actual book measurements and the only thing that I got so far is that you’ll get the golden section where the line going through the lower right corners of paper and text block intersects the upper edge of the paper.</p>
