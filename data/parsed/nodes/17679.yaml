      <p>I find Burke’s book on Renner very good. There’s quite a bit on Futura, naturally. But I wouldn’t call it “coffe-tableish”.</p>
      <p>For a very coofee-tableish book on typography, maybe you want to take a look at <a href="http://www.amazon.com/gp/product/1579120237/qid=1138896146/sr=2-1/ref=pd_bbs_b_2_1/102-4219255-5238543?s=books&amp;v=glance&amp;n=283155">Typography</a>, by Friedrich Friedl, a big enclyclopedia. The information is sometimes incomplete or short, but it has a lot of images...</p>
