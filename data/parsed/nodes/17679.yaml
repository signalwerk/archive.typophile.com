      <p>Something antique might be a good idea.</p>
      <p>Perhaps an issue of “The Colophon - a Book Collector’s Quarterly” from the 1930s.<br>
      The whole set, on sale at Oak Knoll for $1500.</p>
      <p>They were beautifully printed (and hardcover bound), and each issue used a variety of classic letterpress fonts, on a variety of interesting stocks. fabulous design and illustration. And the articles are fascinating, still.</p>
