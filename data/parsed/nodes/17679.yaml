    <p>Hi all,<br>
    A birthday is coming up for a close friend.  He is very into fonts and I would like to explore the possibility of getting a font book of some sort.  I’m thinking more coffee-table like (history of fonts) rather than a book about how to use fonts and such.</p>
    <p>Are there any such books?  A book on Futura would be especially great.</p>
    <p>Thanks.<br>
    -Will</p>
