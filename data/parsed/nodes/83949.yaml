      <p>If you're considering a Jenson, there's Cloister Lightface - but I suspect it's not the best choice. While it was a historic typeface in its day, in some subtle ways it is dated - not to Jenson's day, but to Goudy's day.</p>
      <p>Day Roman, which is free, doesn't have a matching italic. It somewhat resembles Bembo, although it's based on the work of a different punchcutter.</p>
      <p>One might want to look at Centaur, as well, if one is interested in a typeface like Jenson. But I suspect that now that they know what you want, the professional typographers here can suggest some excellent recent alternatives for your consideration. I don't know offhand about Adobe Jenson, but while I thought Adobe Caslon was a good typeface, I had to admit that it was about at the very limit of how far one might get away with straying from authenticity.</p>
