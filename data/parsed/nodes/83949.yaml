      <p>Mr. Dunning - Interesting. I have a copy of the Nova Vulgata, the current official Bible of the Catholic Church - it is actually a nice edition, printed in what looks like ITC's New Baskerville. It is a hefty volume because the print is rather large. It contains minimal footnotes, mostly translation notes. </p>
      <p>If I were to make an edition of the Vulgate (Châteillon's version is not a vulgate), I would make an edition of the Nova Vulgata, as it is not widely available and is the current official standard of the Church. That being said, for the Honors College at my university, I am making a translation of the Gospel of John from the Nova Vulgata, and have in my sights a complete translation of the text for devotional use and for use as an aid in other translations. </p>
      <p>Of course, since the Nova Vulgata is copyrighted by the Vatican Publishing House, permissions would have to be gained from them for any such project, as well, most probably, from the local bishop. </p>
      <p>I am no fan of the Stuttgart version. Adding punctuation would, I think, ruin the entire point of that edition - as its focus was to imitate a medieval manuscript.</p>
