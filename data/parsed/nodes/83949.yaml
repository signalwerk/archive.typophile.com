      <p>I still think Beorcana works in text. Although it seems logical to believe that the serifs themselves are the main cause for better readability in serif faces, I believe a lot also depends on the diagonal stress, which is rarely (or to a smaller extend) found in sans serif type. Beorcana breaks that rule. It has everything a serif has, without serifs. I would even argue that the more open lettershapes of Beorcana might create even better readability than, let's say Adobe Garamond. This is based on loose ground, but it would be awesome to see some sort of a readability test of Beorcana.</p>
      <p>If that doesn't exist, I suppose you could contact the designer about it or ask for a free version, so that you can test it yourselve, before buying the license.</p>
      <p>This Dutch/Swiss foundry you were talking about, was probably TEFF. Though all of the fonts in their library are expensive.</p>
      <p>I would suggest one of the more modern (refering to time, not style) serif typefaces for Display use. Say, Calluna, Trinité, Centro Serif, etc.</p>
      <p>Good luck!</p>
