      <p>Latinus, thanks a lot for pointing at the print reproductions.<br>
      I looked at them with much great interest, not only because I happen to sit in the very city the book was printed in. ;-) I am struck by viewing this print.</p>
      <p>I’m no expert in the detailed type history of that time. Nor do I know if any scholar might have published about that particular typeface so far anywhere. Maybe the face is well-known, maybe there are even digitized versions around already. Does anybody know?</p>
      <p>Only from what I see at a first glance, just a few random thoughts:<br>
      – overall appearance of the typeface on the printed page: perfect. matured and extremely well balanced.<br>
      – a type of the Caslon era, but obviously influenced rather by the Garalde and even (!) the Bembonian traditions, probably influences from dutch typefaces. The c looks like Rotis, incredible.<br>
      – the Italic looks like actual Garamond to me.<br>
      – the mood and several details, though hinting back onto Garamond (Le Bé?) and even Francesco Griffo, seems to anticipate some features of Fleischmann and perhaps even Walbaum – 1729 ! “Transitional” in the true sense of the word.</p>
      <p>Whatever it is, a typographical reproduction of that print seems to be a most worthy case. Even more so if the edition is of some notable historical value. But then, please: I’d love to see it revived faithfully down to the very glyphs: long ſ’s, ligatures, and that remarkable quad space between sentences.</p>
      <p>Just my two pence.</p>
