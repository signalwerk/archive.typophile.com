      <p>I remember reading that article when I was looking for a good Caslon remake (I still have my eyes on Williams Caslon, as I have since I discovered it, but do not think it is necessarily the best option for this Bible). </p>
      <p>I do not wish to produce a facsimile edition - which is why I was looking originally for a good font to reproduce the contents rather than the appearance of the original. There is at least one facsimile print of the Bible available on the market. I think that is good for its historical merit - but I want a production that will make the contents themselves the focus - and for that, it needs to be done in such a way as to make it available to the modern reader. I want as few barriers as possible between the contents and the reader - and I want a face that aids in the tone of the work, and a binding and paper as well that adds to the work and will ensure its survival. </p>
      <p>My previous post was about the typeface itself - its essential flavor I think is what I want for the edition I hope to produce, though I am uncertain as to how to achieve that typeface's flavor with another. </p>
      <p>I apologize for conflicting posts, as I think more and reflect upon those with more experience than I, I begin to see things more clearly in regard to the direction of the project. Thank you.</p>
