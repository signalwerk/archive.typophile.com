      <p>This does look like a rather interesting project; best of luck with it.</p>
      <p>Checking our library catalogue, you might be interested to know that we have a slightly newer printing of this particular book on our shelves; it's been <a class="freelinking external" href="http://www.archive.org/details/bibliasacraexseb01cast" rel="nofollow">digitized on Archive.org</a>. Something to consider, though: if you really want to take on editing the Vulgate, what the Latin world really needs right now is a more reliable electronic version of the Stuttgart text, and with actual punctuation (probably approximating what is found in the Clementine edition). Also, I don't believe that there's a single version of the Vulgate on the market at the moment that is nicely typeset, uses a standard text, and that you can actually pick up and read without the mess of an extensive apparatus at the bottom. Harvard is working on one, but they've made an absolute mess of the text, and the physical volumes are very cumbersome due to their size. It would be a bit of work, but it would be hugely useful, and would probably have a much wider audience than Châteillon's translation.</p>
      <p>Personally, I would avoid printing macrons; you'll go crazy enough trying to proofread the Latin text even without them. (For which, I hope you know about the Correcteur orthographique du Latin?) Macrons, as you note, are terribly ugly, and really only necessary for beginners' exercises. If you're really concerned about correct pronunciation, I find that stress accents are more useful, and actually appear in some medieval manuscripts and early printed books; they're also not as difficult to mess up.</p>
