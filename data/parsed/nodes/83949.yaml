      <p>On Beorcana, I think it is a very strong version of the Carolingian minuscule—most are more delicate than what you'd want, I think—and so would give a kind of scribal feeling. I feel that the old style of types, starting with Jenson and Griffo are more readable than this more scribal style. But Beorcana is readable, and since it is for people reading the Bible in Latin (!) I don't think they are going to be reading very quickly, so maximum readability it seems to me is less of a premium than getting the aesthetic you want. </p>
      <p>Since you don't want to do a facsimile, I think it's really a question of what you think gives the feeling you want. And if that's Beorcana, go for it.</p>
      <p>By the way, if you are going for a more calligraphic or scribal look, don't overlook Brioso Pro. I've seen it used small, and was astonished how readable it is small. And it is really elegant large. And it has a panoply of weights and optical sizes. So it might be what you're looking for.</p>
