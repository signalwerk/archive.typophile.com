      <p>While typically I dislike sans serif fonts, Beorcana impressed me.</p>
      <p>I typically prefer serifs.</p>
      <p>The favored style for this project is, beyond what I have already stated (sturdy, masculine, handsome): typically Roman or Renaissance. I mean something that evokes the Classical world. </p>
      <p>I need only Latin coverage for this Bible. I would add macrons (most fonts have them, although the most common missing macron is for the u), so to aid in the pronunciation, but it makes the text look unappealing. The macrons are not in the original edition from which I am working, but the Classical style of Latin (in which this Bible was produced) was developed to be pleasing when read. So macrons will probably be needed. If the font does not have macrons, but fits every other criterion best, I will forego macrons.</p>
      <p>Also, I am partial to old style numerals, but that is not necessarily needed in this project.  </p>
      <p>I want the font -ideally - to be something that would work for a Bible, a Latin edition of Vergil, of Caesar, of Cicero - to evoke the kind of beauty, authority, and majesty of their language.</p>
      <p>Thank you.</p>
