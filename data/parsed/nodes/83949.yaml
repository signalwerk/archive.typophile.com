      <p>I'll guess he was thinking of something from <a class="freelinking external" href="http://www.teff.nl/fonts/trinite/index.html" rel="nofollow">TEFF</a>, which was one of the things I first remembered when he said price was not necessarily an issue. Geronimo, Lexicon, Trinité and Renard would all be fine choices.<br>
      I'd also consider looking at the stuff from <a class="freelinking external" href="http://www.dutchtypelibrary.nl/" rel="nofollow">Dutch Type Library</a>, like the above mentioned Fleischmann, of course. Or <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/farnham/" rel="nofollow">Farnham</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/dante/" rel="nofollow">Dante</a> or <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/spectrum/" rel="nofollow">Spectrum</a>.</p>
      <p>There are plenty of great typefaces around fit for this job, with flavours to please anyone. <a class="freelinking external" href="http://new.myfonts.com/fonts/garagefonts/freight-text-pro/" rel="nofollow">Freight</a>, <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100020" rel="nofollow">Requiem</a>, <a class="freelinking external" href="http://ourtype.com/#/all-fonts/" rel="nofollow">Custodia or Arnhem</a> (; maybe <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/arno/" rel="nofollow">Arno</a> or something like <a class="freelinking external" href="http://new.myfonts.com/fonts/estudio-ch/espinosa-nova/" rel="nofollow">Espinosa Nova</a>; or the classics, like <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/garamond-premier/" rel="nofollow">Garamond Premier</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/jenson/" rel="nofollow">Jenson</a> or <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/fournier-mt/" rel="nofollow">Fournier</a>.</p>
      <p>For something “different” (and with the help of Bringhurt's type specimen from his “The Elements of Style”), I'd throw in <a class="freelinking external" href="http://new.myfonts.com/fonts/fontfont/ff-quadraat/" rel="nofollow">Quadraat</a> (or <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_quadraat_sans_ot/" rel="nofollow">Quadraat Sans</a>, for that matter), <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/columbus-mt/" rel="nofollow">Columbus</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/kinesis-mm/" rel="nofollow">Kinesis</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_seria_ot/" rel="nofollow">Seria</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/itc-mendoza-roman/" rel="nofollow">Mendoza</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/trajanus/" rel="nofollow">Trajanus</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/storm/antique-ancienne/" rel="nofollow">Antique</a> and <a class="freelinking external" href="http://justanotherfoundry.com/lapture" rel="nofollow">Lapture</a>, for instance. Maybe <a class="freelinking external" href="http://new.myfonts.com/fonts/letraset/figural/" rel="nofollow">Figural</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/aldus/" rel="nofollow">Aldus</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/cartier-book/" rel="nofollow">Cartier</a> or <a class="freelinking external" href="http://new.myfonts.com/fonts/rimmer/amethyst/" rel="nofollow">Amethyst</a>.</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/rimmer/stern/" rel="nofollow">Stern</a> came to mind, but you'll probably think it's too light.</p>
      <p>And I'll stop, now.</p>
