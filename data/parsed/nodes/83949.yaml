    <p>Hello. I've posted a few times here asking for advice and critiques of various fonts. Each time, I've been rather impressed with the suggestions and advice. Well, I've come back for another round, asking for your help in this:</p>
    <p>I have found a copy of the Biblia Sacra ex Sebastiani Castellionis I would like to get republished. Other than the rare scanned reprint of the few remaining original copies, this Latin-language Bible is nearly impossible to find. It was published shortly before the old Clementine Vulgate, and was the only translation of its kind: instead of using the simpler Ecclesiastical style, Châteillon's edition was in the far more complex Classical style, and was censored by both the Protestants and Catholics of the time because of it. Châteillon himself was raised a Catholic and eventually joined up with Calvin. Later, he broke with Calvin over a censorship issue (Calvin was for censoring opposing viewpoints, Châteillon was against). He was widely known in his day as a skilled translator, and was fluent in French and Italian, and was known to be a master of Latin, Greek, and Hebrew. He was also proficient in German. </p>
    <p>I am not wanting to reprint the extant copies of Châteillon's translation (which is non-partisan compared to most translations on the market then and now. It contains the entire Deuterocannon, unlike most translations done by Protestants and has numerous references to Roman mythology - such as, in Genesis, instead of using the more traditionally Christian "LORD God", Châteillon used "Iova Deus" - the first part of which phonetically sounds like the Hebrew Tetragrammaton, and also happens to be one of the traditional titles of Jupiter (Jove); as well as referring to Hell as "orcus" rather than the more Ecclesiastical "infernus".). I however, wish to reformat it - the verse numbers in the extant copies are unclear and there is neither a system of paragraphs nor the verses listed out clearly, as in a list. </p>
    <p>So, here is my request:</p>
    <p>I am looking for a font for the above kind of Bible. If it costs money, I will save up the sufficient funds.</p>
    <p>I'd like a typeface that is sturdy, masculine, and handsome. Something that is readable and legible. Something that is kind to the eyes in large quantities and appropriately small size (Although I have seen an edition of the Clementine Vulgate printed in 1914 with a rather large size, what looked about the size of a 14 pt Times). I need to research paper - some suggestions for that would also be nice. I'd like a sturdy paper that will last, but not be thick. I may try to put out this text in multiple volumes. I would like the font to look good in Italian calfskin and at the same time convey a sense of the sound of Classical Latin (I'm a language major, so I think in sounds, I apologize). If you google search "Classical Latin Pronunciation," the Wheelock's site and the ancienthistory.about.com have some decent recordings, as well as the Latinum podcast. </p>
    <p>I apologize if this is a hefty order, but thank you all for the help.</p>
