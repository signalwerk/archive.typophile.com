      <p>"Surely it’s up to the typographer to decide which cut of a typeface is right for a particular setting,..."</p>
      <p>Not nessesarily. What if "the typographer" is at lunch, or asleep, or there isn't one, or never was, at the very moment of scaling to the output. Fairly common, I think, 'specially on the web, ya know... the end user is quite often the typographer.</p>
      <p>This has been obvious for near twenty years. The standards have failed and any foundry needing to operate their fonts without shipping, or offering the services of a live typograpler... has the font name.</p>
      <p>And don't call me Surely.</p>
