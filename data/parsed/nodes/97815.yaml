    html: |-
      <p><em>&gt; Which ones?</em></p>
      <p>LuaTeX; XeTeX; FontForge (as I just found out); probably Adobe's products (haven't used them in a while). Lua and Xe, to be precise, aren't doing anything entirely new in the TeX world (as TeX has been selecting the correct optical size automatically for about 30 years now), but they now do the same with OpenType fonts out of the box -- provided the ›size‹ feature is present. Otherwise fonts have to be assigned to sizes manually. So for, say, Minion Pro Opticals, something like this...<br>
      <code><br>
      \documentclass{scrartcl}<br>
      \usepackage{fontspec}<br>
      \setmainfont{Minion Pro}<br>
      \begin{document}<br>
      \tiny hat einer und gemacht<br>
      \normalsize zu werden um<br>
      \huge von Buch wollen<br>
      \end{document}<br>
      </code></p>
      <p>...would result in Minion's different size variants to be selected automatically for different sizes.</p>
      <p>As for FontForge, I just learned it has a dedicated ›size‹ tab asking for the relevant information, and apparently stores it correctly, too -- which solved my problem for now.</p>
      <p><img src="http://i.imgur.com/l7dSs.png"></p>
      <p><em>&gt; How do you check that?</em></p>
      <p>using <em>otfinfo,</em> which reported »no valid 'size' feature data in the 'size' feature«. After the FontForge treatment, things seem to be okay, though.</p>
