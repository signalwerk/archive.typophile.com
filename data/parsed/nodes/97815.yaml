    html: |-
      <p>Nick, except when the fonts get "rounded down" to the current standards, I'm not in favor of standards outside of FB's until/unless we ever have to "round up", in which case FB'd move formats again to higher ground. I'm not at all hopeful of dramatic change in either the standards or compliance to them. Don't forget, a lot of work was needed to get to the lowest common denominator of font functionality we have today, and thems serious efforts you just can't undo. </p>
      <p>As for benchmarks, the type designer making such fundamental decisions about the appearance of typography is tricky. When I class size for the Font Bureau library going to the web, I decide based on the unhinted appearance of the fonts on windows. Determining what we call 7 pt, or "bold", or the default figures, that was all fine while the world was stuck with books and print, but now that the world is struck with screens and CSS...</p>
