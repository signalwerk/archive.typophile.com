      <p>The size feature doesn’t seem to be a good idea.</p>
      <p>Surely it’s up to the typographer to decide which cut of a typeface is right for a particular setting, rather than have that decision made by the font.</p>
      <p>For instance, if a typeface is being printed on coarse paper, reversed, or with low contrast between foreground and background colours, then a smaller “optical” size would be called for. But how is a font to know what stock it is being printed on, and in what colour?</p>
