    html: |-
      <p>Adobe apps don't support the 'size' feature, although AFDKO does and Adobe implement the feature in their fonts.</p>
      <p>I've long argued -- with some traction at both Microsoft and Adobe, I believe -- that as a mechanism the OTL 'size' feature is a bad idea: it's really a hack of the GPOS data structure to affect font selection. A number of better ideas are kicking around, and I'm hopeful that one of them will be selected for the standards process.</p>
