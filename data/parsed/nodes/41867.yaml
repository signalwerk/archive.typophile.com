    html: <p>Occasionally the <a href="http://www.fontshop.com/features/newsletters/" rel="nofollow">FontShop</a> newsletter will have a free font for download. Additionally some foundries and vendors also offer the occasional free font for download. You might also take a look through Typophile's <a href="http://typophile.com/node/14652?" rel="nofollow">Typowiki Free Fonts FAQ</a>. Beyond that I know of no email newsletter that does this sort of thing.</p>
