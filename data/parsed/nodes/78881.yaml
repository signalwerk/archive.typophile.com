  html: |-
    <p>I’m giving <a href="http://visualthesis.com/igniteto/ignite-toronto-5-during-global-ignite-week/" title="Ignite 5" rel="nofollow">an Ignite presentation</a> this Thursday (2011.02.10) in Toronto on the topic of vertical and RTL text.  It’s actually about how the assumptions of the inventors of the original personal computers – Americans in Northern California – have made it difficult to typeset real-world writing. And just forget about having computers run OCR on text that flows in any direction other than left to right and top to bottom.</p>
    <p>The presentation’s title – “Why Can’t Computers Read the Goof Sign?” –&nbsp;will be explained on site.</p>
    <p>Ignite presentations, incidentally, use 20 slides that auto-advance every 15 seconds without human intervention. You’ve <em>really</em> got to be organized.</p>
    <p>It’s at the Drake Hotel, Toronto. Doors open at 1900; show starts at 2000. <a href="http://visualthesis.com/igniteto/ignite-toronto-5-during-global-ignite-week/" title="Ignite 5" rel="nofollow">Info</a> · <a href="http://guestlistapp.com/events/43914" title="Tix" rel="nofollow">Tickets</a></p>
