      <p></p><div class="imageWrap"><img src="/files/4CalTypos4_6723.gif"></div><p></p>
      <p>I’ve been away from Calgary, so I’m late posting the announcement. Thanks, Linda, for starting the thread.</p>
      <p>Anybody with an interest in type or typography is welcome. Our meetings aren’t very structured. Mostly just like-minded folk enjoying a beverage, some food, and type-geek conversation (wherever that leads).</p>
      <p>There is a potential to make the meetings more structured and promote the type community in Calgary, but I don’t think we’re at that point yet. We only started these things this summer so we’ve got some growing to do.</p>
      <p>Cheers, Ken</p>
    html_clean: |-
