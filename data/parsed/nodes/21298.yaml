      <p>I think it somewhat depends on the rendering. From what I recall, Verdana was designed to be a screen-friendly font, back before anti-aliasing became more prevalent. However, now that most operating systems support some form of anti-aliasing technology, many more fonts can be "screen-friendly" without necessarily being designed for the screen. With anti-aliasing in play, Verdana still looks good--but not a whole lot better than [insert font here].</p>
      <p>For me, the best sans-serif is a tie between Verdana and Lucida; the best serif is Georgia.</p>
      <p>IMO, when printed on paper, Georgia still looks nice... but Verdana looks awful, especially at larger sizes.</p>
