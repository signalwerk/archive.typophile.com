      <p>Not sure what the purpose of your posting is, but since I am a new member and this is my first posting, I will make something out of it:<br>
      As a screenfont I prefer Verdana / Tahoma / Arial, in that order. The only problem with Verdana is, that it is rather wide.<br>
      On websites that need a serif (maybe for a classy, old, luxureous look n feel) I prefer Georgia.</p>
