      <p>Hi guys:</p>
      <p>Lucida is the only (interface) sans good for print and screen. Verdana and Tahoma are very ugly in print but highly readable on screen (the best). Helvetica is nice for print and o-kay screen but for interfaces???? Georgia is lovely on screen and print- if they made a PRO version with small caps I would snatch it up!!!</p>
      <p>With Vista just on the horizon... there is going to be even more choices than ever... I'm loving these new fonts- I hope us mac folks can get these preinstalled with leopard too.</p>
      <p><a href="http://www.ascendercorp.com/WPF_fonts.html" title="http://www.ascendercorp.com/WPF_fonts.html">http://www.ascendercorp.com/WPF_fonts.html</a></p>
      <p>BTW... comic sans looks excellent on screen at smaller sizes- apatures are nice and open- very readable!</p>
      <p>twardoch&gt; Where did you find the information officina sans being hand-hinted?</p>
      <p>Mikey</p>
