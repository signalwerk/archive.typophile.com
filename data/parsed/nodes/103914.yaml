      <p>Hi again</p>
      <p>More changes to 'desperation' to share</p>
      <p>I've tried not to be too cute with the angles of the crossbars. I've pretty much copied and pasted elements together to make them work and luckily I feel it has unified the uppercase together.</p>
      <p>I've slightly changed the thickness of the strokes to make it feel lighter. This also made the angles more noticeable.</p>
      <p>The 'M' and the 'W' are probably the biggest changes I've made.</p>
      <p>I'm now in the process of creating a lowercase and numbers.</p>
