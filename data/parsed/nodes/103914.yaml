      <p>I like the concept and it's carried through pretty well.<br>
      Top terminal of /C/ comes down too far.<br>
      I wonder if there's a different structure of /S/ that might fit the concept better - maybe something with a spine that straightens out for a stretch, diagonally.<br>
      The breaks from straights to curves are always a tough thing for me: if they adhere too much to simple geometry (e.g. a semicircle arc attached directly to a straight stem) the transition can look not smooth enough, as I think is the case here. So you get, for example, four little "corners" in the joining parts of the counter of /O/.<br>
      On /M/W/ (and /N/?) it might be worth trying the traditional thin-upstrokes/thick-downstrokes alternating pattern instead of keeping the verticals thickest as you have.</p>
