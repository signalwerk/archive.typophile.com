      <p>Thanks to the both of you for your quick replies, it is very much appreciated.</p>
      <p>@eliason the point about the curves and simple geometry shapes is something that definitely needs to be worked on, something I think is going to take a lot of playing around with. At the same time though it is something I'm going to have to do at some point as the lowercase font will no doubt contain a lot more curves.</p>
      <p>Also, the M, N, W were the 3 letters that caused me the most hassle so yeah, I 100% they need working on.</p>
      <p>@hrant The reason the small protrusions are still in this type face is due to the fact they were the first elements introduced to the designs and have just been carried through to the later designs. I think I was afraid the original designs would get lost if they were removed but I have realised the font can carry itself with other angular elements. They do look a bit awkward now and I may need to take a closer look to what the font will look like without them. </p>
      <p>I'll update you with the changes when done.</p>
