      <p>Again thanks for the advice, from your comments I have made the following changes.</p>
      <p>Curves blend in more with the stems. This has been achieved by opening up the width of letters with rounded bodies. It gives the whole font a more natural feel and less geometric IMO.</p>
      <p>The angles of the cross bars  have been reduced to give them a more subtle feel.</p>
      <p>The 'M' 'N' 'W' have been balanced out.</p>
      <p>The 'Z' have become more pointed to blend in better with the rest of the font.</p>
      <p>The crossbar of the 'S' has more of an angle.</p>
      <p>Lastly, the protrusions have been removed as they weren't really needed anymore due to the fact the other angular elements help to carry this font forward. </p>
      <p>Does everyone feel I'm moving in the right direction with this from the first designs?</p>
      <p><a href="https://www.dropbox.com/s/6dipb6939kp1zma/desperation.jpg" rel="nofollow">desperation.jpg</a></p>
