      <p>@aluminium, if you think it is stiff now you should of seen my first drafts on graph paper, I was using a ruler and compass to create the letter forms. In general the kind of work I create it is thought out and planned with measurements and everything, I'm finding it hard to be a bit loose at the minute but I think once I get to a stage, with a few of the letters, I feel comfortable with I think it should all click into place. Hopefully :-/</p>
      <p>I'll keep you all updated once I've made changes. </p>
      <p>Many thanks</p>
      <p>Darren</p>
