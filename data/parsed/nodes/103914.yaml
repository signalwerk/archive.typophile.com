    <p>Hi Everyone</p>
    <p>This is both my first comment and first real effort at creating a usable display font.</p>
    <p>There wasn't any real inspiration or plan to start this project, it just kind of happened then took momentum once I created a few letters. If I had to describe it I would say it is angular but also subtle at the same time if that makes sense :). Any advice would be welcome and I know all the terms used involving type. The angular 'crossbars' seem to be working but I've been looking at these letters for so long I can't decide what works and what doesn't anymore. </p>
    <p>I've decided to create only the upper case to see if it is well received then if I feel it has room to grow I will create the lower case, numbers and maybe other versions of the 'Desperation' type face.</p>
    <p>Be as hard as you want as I've worked on this too long for it to contain any glitches.</p>
    <p>Many thanks and love this forum, it has provided many hours of reading.</p><div class="imageWrap"><img src="http://typophile.com/files/desperation_4274.jpg"></div><p></p>
