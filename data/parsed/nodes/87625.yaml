    <p>Hi, guys and girls!<br>
    Okay, so I've come across this typeface in two separate (but related) publications and am extremely curious to know its name/s and origin.</p>
    <p>This image is from an Anne Rice short story published in the January 1979 issue of Playboy magazine.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Interlude_4798.jpg"></div><p></p>
    <p>And these images are from the dust jacket of "The Tale of the Body Thief", a novel by Anne Rice published in 1992.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Anne_5584.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Tale_3880.jpg"></div><p></p>
    <p>Now, I have come across two fonts that are almost identical to this typeface: Octavian (by Brendel Informatik, 1994) and Implicit SSi (by Southern Software, 1992).<br>
    So, can anybody here PLEASE help me out with more information about this typeface?</p>
