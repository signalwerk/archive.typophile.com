    html: |-
      <p>There is also <strong>Esther</strong> by Brendel Informatik, 1994<br>
      which looks like a perfect match to your samples (better than Octavian and Implicit)<br>
      but I don't know if this is really an original design by Brendel Informatik.</p>
      <p>The reason is that Both Brendel Informatik and Southern Software are known for a lot of font forgeries, and Esther font is included in a list in the following forgery report:<br>
      <a href="http://www.sanskritweb.net/forgers/greenstreet.pdf" title="http://www.sanskritweb.net/forgers/greenstreet.pdf">http://www.sanskritweb.net/forgers/greenstreet.pdf</a></p>
