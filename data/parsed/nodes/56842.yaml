    html: <p>It’s hard to give feedback without seeing an image but it sounds like the ii confusion is going to be unavoidable in the format you have in mind. The problem is that Anavi is an unfamiliar name so readers are going to have a hard time separating AVANINK the two words. You could try using a color build on the I to demonstrate the combination eg. AVAN in cyan, NK in magenta, and I in an overprinted cyan/magenta. Otherwise, I think it’s time to start sketching two word solutions.</p>
