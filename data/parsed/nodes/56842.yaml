    <p>Okay so I am starting my stationary/wedding invite company that specializes in letterpress and silkscreen as well as pen and ink illustration.</p>
    <p>The name is Anavi Ink. I have a logo that I like which combines the i from Anavi and the i from ink so there is just one i with an ink splotch for the dot on the i.</p>
    <p>However people have been reading it as Anav Ink which I don’t want since that is NOT my last name.</p>
    <p>I need suggestions for how I can do the same basic idea, but with people somehow reading the name with two (ii)s.</p>
    <p>thanks!</p>
