    html: "<p>News of a possible new edition of <i>Fontographer: Type by Design</i> and how the rights to the book reverted to its author can be found here: <br> <br><a href=\"http://typographi.ca/000600.php#000600\" target=\"_blank\">http://typographi.ca/000600.php#000600</a> <br> <br>Thomas, Dan, John: it wasn't my intention to promote book piracy. But I, too, searched for this book and ended up finding a copy in the library, and resorted to photocopying the first three chapters. As far as I know, the website where the PDF version is posted isn't charging any money for viewing the PDFs -- how different from the library is that? And it's not even a good PDF, as parts of the book seem to have been scanned with OCR software, so that there are typos -- and those sections don't use the same font as the book, so the text doesn't justify properly, etc. If the book was available somewhere, at a reasonable price (not the 200+ dollars they are asking for on some websites, which I can't afford!), I'd buy it in a second.</p>"
