    html: "<p> Big news for a lot of anxious people. <br> <br>Is this legal? Anyway, if the publisher of the print version didn't think they could make money on a reprint, then they probably don't care. On the other hand, they could have gained some positive exposure by releasing the PDFs themselves, maybe even selling the book in PDF form - FontLab does that with their manuals. So a small lesson for MIS Press. <br> <br>BTW, it's interesting that the text is text, not image. That might mean OCR was done, which would make it more work. Or maybe somebody provided the original digital files? One clue would be the body font: from what I remember Moye had modified Goudy's Italian Old-Style (giving the \"y\" a longer tail), and an OCR scheme wouldn't have that (unless the person had that special font)... And the PDFs seem to be using the non-Moye short tailed version. <br> <br>hhp </p>"
