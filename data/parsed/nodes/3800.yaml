    html: <p>There is an entire saga surrounding Mr. Moyes book of which I believe the story goes something like this, anybody who has first hand information, please contribute . . . <br> <br>I believe all of the publishing rights to the book are still owned by MIS Press. Since the time of its publication MIS Press was absorbed by Hungry Minds and now Wiley Publishing and Wiley has no intention of selling them back or reprinting the book. <br> <br>This puts Mr. Moye in a bad situation since he doesn't legally own the content and cannot buy the rights to the book back. <br> <br>I had tried many times to contact Mr. Moye and he blacklisted me from his e-mail list apparently not interested in discussing the matter at all. <br> <br>I would genuinely like to see a follow up to this book and even a re-release since the information the book contains is as useful now as it was when it was originally published. <br> <br>Stuart :D</p>
