    html: "<p>A couple of points: <br> <br>Copyright law varies from country to country, and in many jurisdictions, notably in most of Europe, it is considered fair use to make a copy of a work for your own personal use. This means that it would be legal in some jurisdictions for you to go to a library and photocopy the entirety of <i>Fontographer: type by design</i>. <br> <br>However, I'm not aware of any jurisdiction in which it is legal to <i>publish</i>, i.e. to make public, a work without obtaining rights from the copyright holder. Making a PDF version of a book available on the Internet for other people to view and download is not the same thing as making a copy of the book for your own personal use: it is publishing. The fact that a book is out of print does not mean that it is out of copyright, and it is neither legal nor ethical to <i>publish</i> someone else's work without permission. <br> <br>Yes, Moye's book is out of print, but that doesn't mean it is not available. Copies show up in second hand bookshops, on Ebay, etc.</p>"
    html_clean: "<p>A couple of points: <br> <br>Copyright law varies from country to country, and in many jurisdictions, notably in most of Europe, it is considered fair use to make a copy of a work for your own personal use. This means that it would be legal in some jurisdictions for you to go to a library and photocopy the entirety of <i>Fontographer: type by design</i>. <br> <br>However, I'm not aware of any jurisdiction in which it is legal to <i>publish</i>, i.e. to make public, a work without obtaining rights from the copyright holder. Making a PDF version of a book available on the Internet for other people to view and download is not the same thing as making a copy of the book for your own personal use: it is publishing. The fact that a book is out of print does not mean that it is out of copyright, and it is neither legal nor ethical to <i>publish</i> someone else's work without permission. <br> <br>Yes, Moye's book is out of print, but that doesn't mean it is not available. Copies show up in second hand bookshops, on Ebay, etc.</p>"
