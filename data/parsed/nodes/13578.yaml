      <p>My advice is to buy an inexpensive small but very efficient tablet like Wacom Volito 2. This way you can try it out without spending to much money and figure out what are specifically your needs on a tablet. Later on you can buy a professional tablet. Maybe this works for you. It works for me (right now I need a scroll on my tablet pen lol)</p>
