      <p>I have a 9 x 12 at work and I have to restrict the area that is active because of the size. Here at home I have a 6 x 8. That seems to be just fine. If you can afford it definitely get the Intuos line. The pressure sensitivity is worth the extra money. I agree with Mr. Shinn. I originally got one because I was getting carpel tunnel syndrome from the mouse. The Wacom solved that…<br>
      peace</p>
