    <p>I’m looking into buying a graphics tablet to help with work for my graphic design degree. I don’t want be spending loads on it in case i don’t take to it. I was just wondered if anyone had any good opinions on wether they’r worth buying and any brands that are particularly good. I’d be using it with programs like quark xpress, adobe illustrator and photoshop.</p>
    <p>any comments would be a great help</p>
    <p>thanks alison</p>
