      <p>I’ve got a 6 x 8 Intuos from Wacom and I love it. And I actually prefer the new fat stylus to the older, thinner versions, but I guess that just comes down to personal preference.</p>
      <p>One other thing, RSI-wise: the only problem I have with the size of the tablet is that it means mousing or tableting way over to the side of the keyboard, which is harmful in its own right. I ended up getting myself a special split keyboard that doesn’t have a 10-key area, so that the tablet could be more directly in front of me.</p>
