    html: '<p>Quick guess is that it was a custom typeface done by a design firm, not a type designer. Lots of beginner mistakes in there. Recommended alternatives: <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_netto_ot/">FF Netto</a>, <a href="http://www.fontshop.com/fonts/downloads/gtype/chevin/">Chevin</a>, <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Condensed/">Gravur Condensed</a>.</p>'
