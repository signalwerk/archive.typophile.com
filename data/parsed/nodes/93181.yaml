      <p>Another great example of how 'structural' London 2012 has become is this report of what is being policed and banned. For instance, the use of these words:</p>
      <p>C) The Banned Words.</p>
      <p>The Olympics legislation bans the use by unauthorised businesses (non-sponsors) of 'controlled representations', depending on the context. This is the list of 'controlled representations':</p>
      <p>The Olympic Symbol (the five interlocking rings)<br>
      The Olympic Motto (Citius Altius Fortius' / 'Faster Higher Stronger'<br>
      Olympic (s)<br>
      Olympiad (s)<br>
      Olympian (s)<br>
      The Paralympic Symbol (the three 'agitos')<br>
      The Paralympic Motto ('Spirit in Motion')<br>
      Paralympic (s)<br>
      Paralympiad (s)<br>
      Paralympian (s)<br>
      London<br>
      Games<br>
      Summer<br>
      Two thousand and twelve<br>
      2012<br>
      Twenty Twelve<br>
      Medals<br>
      Gold<br>
      Silver<br>
      Bronze<br>
      Sponsors</p>
