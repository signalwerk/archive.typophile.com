      <p>Put that way I would have to say I don't know. Maybe it's perfect. Maybe it's a huge mistake. I don't have enough context/information to judge. </p>
      <p>My impression is that this design is being made as an abstraction with no relationship to the goals especially the marketing goals of the company. Maybe that's not true but it is how it will seem without more context. </p>
      <p>If that is the case; if there is no clearly identified goal; then you are just throwing your design dart randomly. You might succeed in the design but the chances are very low!</p>
      <p>Design is an applied art - as in with a purpose. It's not effective if it just copying the popular design tropes or is made as self-expression like fine arts.</p>
