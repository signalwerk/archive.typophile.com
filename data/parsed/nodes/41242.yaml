    html: <p>Can you tell us more about it? The spacing on the word computer doesn't quite feel right to me in versions 124&amp;5. The R feels cramped. This design feels hasty to me. I think you may want to keep going but before you do come up a clear idea of what the logo should mean or perhaps feel like to customers. Before you choose something you need to know why you are choosing it. I hope this is helpful.</p>
