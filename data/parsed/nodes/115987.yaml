      <p>Hi Don,</p>
      <p>As far as I know, this is a US font, used for many, many movie songs in the 1930s-40s, and then used for most Broadway song titles published by the Edwin H. Morris Company. </p>
      <p>I have samples of almost the entire alphabet. I'm missing upper case Q X and Z, and lower case j q and z. </p>
      <p>Thanks so much for your help!</p>
      <p>- Bob</p>
