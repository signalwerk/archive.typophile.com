    html: |-
      <p>I'm not aware of anything digital.<br>
      The distinctive bowed strokes on some letters and the unusual tilde serifs on them remind me of the ATF font Invitation, dating from 1917 or earlier. Invitation has bowed strokes on the same letters and usual serifs on them, but these are in the form of a reverse wedge rather than a tilde.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/InvitationCharmapSM_6291.jpg"></div><br>
      One influenced the design of the other, but I don't know the direction of the causation.<br>
      Don<p></p>
