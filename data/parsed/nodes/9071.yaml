    html: <p>&gt;This is good....(I guess). But since I cannot remember what they all look like... <br> <br>...then perhaps it's not so good after all. <br> <br>And perhaps Apple, Adobe, and Microsoft should stop cluttering up people's font menus with gobs of fonts they don't need and didn't ask for. "Font Spam", as Gerald so aptly termed it. <br> <br>One thing I've done is simply to empty out the file Library&gt;Application Support&gt;Adobe&gt;Fonts (or XP equivalent). That helps quite a lot.</p>
