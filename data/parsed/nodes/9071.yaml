    html: <p>If you used a font management to activate and deactivate your fonts this wouldn't be a problem. I actually keep my fonts organized by foundry. I also find that after you load the fonts and quickly dig through them it is easy enough to remove the ones which really probably won't ever serve any sort of purpose. I also use FontBook to make PDFs of the various folders which I know I won't use that often.</p>
