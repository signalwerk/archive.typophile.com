  html: <p>Over the years my font collection have seamed to grow quite large. This is good....(I guess). But since I cannot remember what they all look like, it is becomming a problem for me to choose the appropiate one for a given job (since there are so many). <br>All my fonts (not the ones the came with windows XP) recides in "/program files/common files/adobe/fonts". This means whenever I open a design program, eg. Illustrator, the font list is very large and there are no subdirectories for each font. <br>I am simply loosing track of my fonts.... <br>A solution would be to catogorize the fonts, I think. <br>What do you guys do to prevent this problem? <br>Is there an international type classification that all the pros use?  <br> <br>/Thomas</p>
