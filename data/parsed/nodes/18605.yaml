    html: |-
      <p>Renard is undoubtedly beautiful.</p>
      <p>As a lawyer, I’m sure I don’t have to tell you to check TEFF’s EULA. Their fonts are expensive, and their EULA has some unusual restrictions:</p>
      <p>“The Licensee shall be entitled to install the fonts mentioned in Article 2 of this Agreement and to use these fonts to layout documents and/or for word processing purposes on no more than one computer and one output device belonging to the Licensee.”<br>
      —Many EULAs allow 5 devices.</p>
      <p>“Without prior written permission from TEFF licensee shall refrain from putting documents, files or data in which the fonts/data mentioned in Article 2 of this Agreement are embedded, such as .pdf files, at third-party’s disposal and refrain from making documents, files or data in which the fonts/data mentioned in Article 2 of this Agreement are embedded available to any third-party.”<br>
      —Many EULAs allow PDFs for print and preview.</p>
      <p>Personally, these conditions would make me think twice.</p>
