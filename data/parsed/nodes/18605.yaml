    <p>I am establishing a legal practice and am thinking of using Renard exclusively for correspondence. Anyone have any thoughts on the suitability of this face? I want something strong, conservative, and elegant. If this isn’t the best choice, are there any suggestions?<br>
    Thanks.</p>
