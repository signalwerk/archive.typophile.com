    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Joseph Churchward</strong></p>
    <p>Born: Apia, Samoa, 1933.</p>
    <p>Joseph Churchward was born and raised in <a href="/wiki/Samoa" class="freelinking" rel="nofollow">Samoa</a>. He moved to <a href="/wiki/New%20Zealand" class="freelinking" rel="nofollow">New Zealand</a> at age 13 and attended <a href="/wiki/Wellington%20Technical%20College" class="freelinking" rel="nofollow">Wellington Technical College</a>. There he concentrated on art and especially lettering. He then went on to work as a commercial artist at <a href="/wiki/Charles%20Haines%20Advertising" class="freelinking" rel="nofollow">Charles Haines Advertising</a> for 12 years before setting up <a href="/wiki/Churchward%20International%20Typefaces" class="freelinking" rel="nofollow">Churchward International Typefaces</a> in 1969.</p>
    <p>His first breakthrough was not long in coming. <a href="/wiki/Berthold%20Fototype" class="freelinking" rel="nofollow">Berthold Fototype</a> accepted several of his first typefaces for distribution and continued to add Churchward’s new designs to their catalogue for many years. He later went on to sign distribution agreements with <a href="/wiki/D.Stempel%20AG" class="freelinking" rel="nofollow">D.Stempel AG</a>, <a href="/wiki/Dr%20B%C3%B6ger%20Photosatz%20GmbH" class="freelinking" rel="nofollow">Dr Böger Photosatz GmbH</a>/<a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>, <a href="/wiki/Mecanorma-Polyvroom%20B.V" class="freelinking" rel="nofollow">Mecanorma-Polyvroom B.V</a> and <a href="/wiki/Zipatone" class="freelinking" rel="nofollow">Zipatone</a>. Churchward International Typefaces published a handful of original fonts in 1978 being the first and only company in New Zealand to publish original photo-lettering.</p>
    <p>Now officially retired, he continues to create unique alphabets and has over 300 original faces to his name.</p>
