    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Joseph&nbsp;Churchward</strong></p>
    <p>Born: Apia, Samoa,&nbsp;1933.</p>
    <p>Joseph Churchward was born and raised in <a href="/node/add/wiki?edit%5Btitle%5D=Samoa" title="Create node &quot;Samoa&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Samoa</a>. He moved to <a href="/node/19704" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">New Zealand</a> at age 13 and attended <a href="/node/add/wiki?edit%5Btitle%5D=Wellington%20Technical%20College" title="Create node &quot;Wellington Technical College&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Wellington Technical College</a>. There he concentrated on art and especially lettering. He then went on to work as a commercial artist at <a href="/node/add/wiki?edit%5Btitle%5D=Charles%20Haines%20Advertising" title="Create node &quot;Charles Haines Advertising&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Charles Haines Advertising</a> for 12 years before setting up <a href="/node/add/wiki?edit%5Btitle%5D=Churchward%20International%20Typefaces" title="Create node &quot;Churchward International Typefaces&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Churchward International Typefaces</a> in&nbsp;1969.</p>
    <p>His first breakthrough was not long in coming. <a href="/node/add/wiki?edit%5Btitle%5D=Berthold%20Fototype" title="Create node &quot;Berthold Fototype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Berthold Fototype</a> accepted several of his first typefaces for distribution and continued to add Churchward’s new designs to their catalogue for many years. He later went on to sign distribution agreements with <a href="/node/add/wiki?edit%5Btitle%5D=D.Stempel%20AG" title="Create node &quot;D.Stempel AG&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">D.Stempel <span class="caps">AG</span></a>, <a href="/node/add/wiki?edit%5Btitle%5D=Dr%20B%C3%B6ger%20Photosatz%20GmbH" title="Create node &quot;Dr Böger Photosatz GmbH&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Dr Böger Photosatz GmbH</a>/<a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Mecanorma-Polyvroom%20B.V" title="Create node &quot;Mecanorma-Polyvroom B.V&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Mecanorma-Polyvroom B.V</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Zipatone" title="Create node &quot;Zipatone&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Zipatone</a>. Churchward International Typefaces published a handful of original fonts in 1978 being the first and only company in New Zealand to publish original&nbsp;photo-lettering.</p>
    <p>Now officially retired, he continues to create unique alphabets and has over 300 original faces to his&nbsp;name.</p>
