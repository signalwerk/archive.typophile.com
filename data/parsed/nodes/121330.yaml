      <p>There was a font called <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Font-Bureau%20%2F%20%28Commercial%29&amp;ffam=Harrington%20Bold%20-%20Bold&amp;fid=c1e0c0b95d144c5570946b7af1223fa9&amp;fsize=60&amp;text=TO%20HERB%20WITH%20LOVE&amp;wrap=2" rel="nofollow">Harrington</a></strong> by Font Bureau [1992] which is very close to your sample (and it also sounds close to Harrison) but I can't find a legitimate source of it anymore.</p>
      <p>Close similar: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Scriptorium-Fonts%20%2F%20%28Commercial%29&amp;ffam=Rossetti%20-%20Regular&amp;fid=6686f8850a1efa84fb582af418750a04&amp;fsize=60&amp;text=TO%20HERB%20WITH%20LOVE&amp;wrap=2" rel="nofollow">Rossetti</a></strong> by David F. Nalle [1992, Scriptorium Fonts]</p>
      <p>*EDIT*: There is also a <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=DanXSolo%20%2F%20%28Commercial%29&amp;ffam=Harrington%20-%20Normal&amp;fid=89dbafb96829f45b9cd171e5408f5130&amp;fsize=60&amp;text=TO%20HERB%20WITH%20LOVE&amp;wrap=2" rel="nofollow">Harrington</a></strong> digitized by Dan X. Solo but I'm afraid is available only in the Dover Publication CD accompanying the associated book.</p>
