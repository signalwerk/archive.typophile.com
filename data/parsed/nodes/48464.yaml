    <p>We've got a new shirt up on TypographyShop at last. <a class="freelinking external" href="http://typographyshop.com/univers_w_t-shirt.html" rel="nofollow">http://typographyshop.com/univers_w_t-shirt.html</a>  "Across the Univers" is a companion design to our first offering "Helvetica Neue Descending a T-shirt" <a class="freelinking external" href="http://typographyshop.com/helvetica_t-shirt.html" rel="nofollow">http://typographyshop.com/helvetica_t-shirt.html</a></p>
    <p>Classic typeface meets classic tune in our latest offering. A stylistic companion to our first offering, Helvetica Neue Descending a t-shirt.  Adrian Frutiger's 1954 masterpiece is illustrated in descending weights in two colors.  On sale at the special pre-order price of just $19.99 until August 31st.</p>
    <p>Many of our first customers told me that they found us on Typophile.  Thanks so much for your support.  The design blogosphere embraced the shirt with amazing speed.  It was a blast watching the viral spread. I've met some famous designers through it all and the editors of a couple of top design magazines are wearing our first shirt.  We're going to have some well known designers and industry blogs offering product soon on the site as well.  We'll keep you posted as that develops.</p><div class="imageWrap"><img src="http://typophile.com/files/acrosstheunivers446_4279.jpg"></div><p></p>
