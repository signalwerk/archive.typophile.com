      <p>The first thing to recognize is that you have two different typefaces in your samples. Sample 1 is a Bold Condensed Slab serif like an Egyptian, and Sample 2 looks like a normal bracketed serif, possibly Cooper or Goudy Catalogue, which have angled stress on the C like this.</p>
      <p>- Mike Yanega</p>
