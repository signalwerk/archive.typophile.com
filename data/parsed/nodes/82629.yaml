      <p>&gt;&gt;James: Well, using hinting the various edges of the circles can be<br>
      placed exactly at pixel boundaries to eliminate errant gray pixels.&lt;&lt;</p>
      <p>This is true. I was assuming that we were worried about the gray pixels along the curves, not at the extremes. </p>
      <p>And when I mentioned eliminating circles, I only meant at very small sizes, where there's physically not enough pixels to make the right number of black circles separated by white pixels. If you don't eliminate one of the black rings at those small sizes, the rings will crash into each other and fill in. </p>
      <p>Jason C</p>
