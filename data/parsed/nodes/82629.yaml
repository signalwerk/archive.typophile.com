      <p>Hi; Hinting the mark will not smooth out the "pixellation". That's an artifact of rendering that hinting won't affect. What hinting could do would be to ensure that the rings are always an equal distance apart, or even remove one of the rings within each group when the mark get used small enough so things start to bunch up. </p>
      <p>Jason C</p>
    html_clean: |-
