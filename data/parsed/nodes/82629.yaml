    <p>Hi, </p>
    <p>Wondered if anybody can help me:</p>
    <p>I have developed a mark for a logo. (See attached)</p>
    <p>Given the thickness and the size and frequency of the rings,<br>
    they seem to pixellate when reduced to a smaller size on screen.</p>
    <p>I wondered if anybody may have any advice with regard to hinting the rings to<br>
    smooth them?</p>
    <p>Outside of this, obviously enlarging/thinning them v.slightly may be the only solution.</p>
    <p>Many thanks<br>
    P</p>
