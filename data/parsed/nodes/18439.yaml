      <p>The thinnest of the thin is Luc[as] de Groot's Taz, but it might be a little condensed for your needs:<br>
      <a href="http://www.lucasfonts.com/cgi-bin/loadframe/lucasfnt/taz3/taz3.html" rel="nofollow">http://www.lucasfonts.com/cgi-bin/loadframe/lucasfnt/taz3/taz3.html</a></p>
      <p>Joshua Darden has just released an expanded version of his "Omnes" family, with a very thin thin:<br>
      <a href="http://www.joshuadarden.com/shop/omnes_hairline.php" rel="nofollow">http://www.joshuadarden.com/shop/omnes_hairline.php</a></p>
      <p>My own Galaxie Polaris Light or Apex New Thin are probably not light enough and too condensed, respectively, for your needs. And besides, what kind of person sells their own fonts on Typophile? A salesman, I guess...</p>
