    html: '<p> &gt; How much of each character can be removed .... <br> <br>A central issue, where even the questions (much less the answers) have yet to be properly formulated. <br> <br>Seriatim Gestalt: Some of your "solutions", like the lc "a", are really nice! <br> <br>Next step: Get yourself an audience, and do some real-world (although fundamentally informal) tests. <br> <br>hhp </p>'
  - id: 5942
    user: 872
    date: 2002-05-20T14:53:00
    date_raw: 20 May 2002 — 2:53pm
    votes: null
    html: <p>I love this concept -- I'm a big fan of J Hoefler's variant. you're goal, to include the lc is a truely valient one. you've done a wonderfully modest job on the ligatures! also, the uc M is really standing out to my eye here, the diagonals assist in completing the shape quite well.  <br> <br>my overall impression is that you still have some research ahead of you. I'm not certain the components you are emphasizing are the essential ones (I'm thinking of the lc k &amp; a at the moment). some of the characters seem less reductivist than decoratively geometric (the lc p &amp; d, perhaps)</p>
  - id: 5943
    user: 1250
    date: 2002-05-20T15:07:00
    date_raw: 20 May 2002 — 3:07pm
    votes: null
    html: "<p> &gt; some of the characters seem less reductivist than decoratively geometric <br> <br>Which leads directly to a central conundrum: <br>A font consisting of \"gestalt-minimal\" shapes isn't necessarily something anybody would actually want to use... Which doesn't make it a bad effort, not at all. But a *usable* font (as opposed to a truly experimental one, in the scientific/analytical sense) has to strike a compromise between theory and aesthetics. <br> <br>I can't read David's mind (for which I should probably be thankful ;-) but I wonder if he's worried about where this treacherous road leads, or if he's just enjoying the strange scenery (and there's nothing wrong with that, quite the contrary). <br> <br>hhp </p>"
  - id: 5944
    user: 533
    date: 2002-05-21T14:48:00
    date_raw: 21 May 2002 — 2:48pm
    votes: null
    html: "<p> Sometimes even *I* don't want to read my own mind... :D <br> <br>Actually, you've hit on something, though, Hrant -- this has been one of the more strange (yet fun) typographic forays I've taken. <br> <br>The lower-case \"a\" was a startling accident, as I played with forming an \"a\" out of a reversed \"s\". What you see above is what resulted. The upper-case \"M\" had a similar genesis, as I tinkered with the angles and strokes of the glyph. <br> <br>PlainClothes: <br>I agree that this experiemnt is far from complete. I'll probably go ahead and release this typeface soon, after a few adjustments, but I'll continue the experimentation toward perhaps creating an even more reductivist version sometime in the future. <br> <br>David </p>"
  - id: 5945
    user: 1250
    date: 2002-05-21T15:13:00
    date_raw: 21 May 2002 — 3:13pm
    votes: null
    html: "<p> &gt; I played with forming an \"a\" out of a reversed \"s\" <br> <br>Which reminds me of an experiment I've been considering: making a font (probably out of Times) that substitutes other letters for the real ones, with some minimal manipulation. Like taking an \"e\", rotating it 180, and adding a small curling stroke to the bottom-right: one messed-up \"a\"! <br> <br>The main point would be to illustrate first-hand the difference between legibility (which would be totally devastated) versus readability (which would be affected much less, as long as the silhouette of each character is mostly maintained). <br> <br>hhp </p>"
