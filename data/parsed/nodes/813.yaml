    html: <p> Nice David. The human mind is pretty  <br>amazing. (Um, not that your font isn't.) <br> <br>Hrant, the guys at Eyesaw had a face for a  <br>while that was similar to what you describe...  <br>(The site has now moved on, so I won't try to  <br>find it.) If I were forced to guess I'd say it was  <br>based on Andale Mono or the like. The E was  <br>a flopped 3, the S a 5, the cap A an upside  <br>down V, and so on. It was quite nice. <br> <br>T Y P O P H I L E <br> <br>7 4 P 0 P H 1 L 3 </p>
