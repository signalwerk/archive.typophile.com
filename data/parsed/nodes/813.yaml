  html: "<p><img src=\"http://www.typophile.com/forums/messages/29/1372.jpg\" alt=\"SeriatimGestalt.jpg\"> <br><img src=\"http://www.typophile.com/forums/messages/29/1373.jpg\" alt=\"SeriatimGestaltKernSample.jpg\"> <br> <br>This is Seriatim Gestalt, an experimental typeface inspired by and similar to Jonathan Hoefler's HTF Gestalt. I wanted to see if I could add a workable lower case, and try my hand at my own version of the upper case and symbols in a style that would make for a reductivist addition to my Seriatim family (now showing in the Sans Serif Critique Forum). <br> <br>The question behind the experiment is this: How much of each character can be removed while still allowing the human mind's phenomenon of \"gestalt recognition\" (recognizing the whole) to still resolve each individual character? <br> <br>The result seems to be very similar to a stencil font, but then it occurred to me that stencil fonts are another extension of this same question. In order to allow counters, etc., to remain in place in a stencil font, what parts of each character can be safely removed without compromising character recognition? Seriatim Gestalt simply takes it beyond the counters. <br> <br>As always, comments are appreciated and encouraged. <br> <br>David</p>"
