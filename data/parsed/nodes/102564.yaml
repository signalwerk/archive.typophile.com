    html: |-
      <p>From my view, for a text font, first order of business: fix the vertical proportions. Because of how Latin-using languages use the vertical space, the ascenders should normally be longer than the descenders. Design is about balancing compromises, and to me the best benchmark is the "g": it has to look slightly vertically cramped (and slightly too small overall) for other more important things not to go wrong. And your "g" is too happy.  :-)</p>
      <blockquote><p>that's the only way I can dedicate the necessary time</p></blockquote>
      <p>I wish all open-source/free font advocates could so clearly admit the inevitable connection between time/effort/money and quality.</p>
      <p>hhp</p>
