    <p>This is the current version available in <a class="freelinking external" href="http://www.google.com/fonts/specimen/Fenix" rel="nofollow">Google Web Fonts</a>, and <a class="freelinking external" href="http://www.myfonts.com/fonts/tipotype/fenix/" rel="nofollow">Myfonts</a>. You can also see it in my <a class="freelinking external" href="http://www.behance.net/gallery/Fnix-(FREE-Typeface)/6901203" rel="nofollow">Behance</a></p>
    <p>The idea is that you can provide feedback so I can make it better. This year (after I finish another typeface) I'll continue to develop it... creating ext. Latin-1, more OTF,  other weights and an interesting black-letter variant that matches.</p>
