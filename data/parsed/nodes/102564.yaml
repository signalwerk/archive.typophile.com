    html: |-
      <p>I should have said this in the same breath:<br>
      Whether you decide to shorten and descenders versus lengthen the ascenders depends mostly on what point size range you're shooting for. Practically speaking (I mean in terms of saving effort) unless you have a size range firmly in mind, the way the spacing and color are already playing along* will determine which way to go: the bigger the x-height, the looser the spacing and the darker the color, because you're shooting for a smaller size (and vice versa). And before you get into specifics you need to decide if this is intended more for screen or print; check out Merriweather** for a nice design that's really screen-centric however.</p>
      <p>* With your (existing) cap height also playing a role.</p>
      <p>** <a href="http://typophile.com/node/102523" title="http://typophile.com/node/102523">http://typophile.com/node/102523</a></p>
      <p>hhp</p>
