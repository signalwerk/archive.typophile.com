      <p>hey, that worked like a charm! thanks!</p>
      <p>and i did have it as a TTF font before, so that must've been it.</p>
      <p>oh, and i tried it in a non-Adobe application (Flash) before i deleted the lst files and it worked there, so it was definitely the Adobe thing that messed it up.</p>
