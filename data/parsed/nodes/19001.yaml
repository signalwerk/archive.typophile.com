      <p>Have you generated/installed your font once as OpenType-TrueType and once as OpenType-PostScript (or the other way round)? Then you should try this:<br>
      Search your system partition for "fnt" -- if you use Windows, make sure your search includes hidden files!<br>
      You will find files named after a pattern like "AdobeFnt06.lst" or "AdobeFnt10.lst". Can be quite many files.<br>
      Delete them. (Just to be sure, restart.)</p>
      <p>But I am not sure *if this* is your problem because you say that upon moving, glyphs do become visible ...</p>
      <p>Have you tested your font in other applications than Adobe's?</p>
