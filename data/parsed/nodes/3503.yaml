    date: null
    date_raw: null
    votes: null
    html: <p>I think I agree with Chesh that the swirly script is handwritten, but for another place to see a lot of swirly designs, look in Part 5 <a href="http://bowfinprintworks.com/Script05Pg1.html" target="_blank"> (Designed Scripts)</a>, Part 7 <a href="http://bowfinprintworks.com/Script07Pg1.html" target="_blank">(Casual Flowing Scripts)</a> and Part 8 <a href="http://bowfinprintworks.com/Script08Pg1.html" target="_blank">(Casual Non-flowing scripts)</a> of the Script Font ID Guide. I counted about a dozen curly fonts in the first 8 pages of Part 5, including Scriptease, Gigi, Dollhouse, Clover, Giddyup, Yellow, Riva, Marguerita and Curlz. (Be warned, if you look through them all it will be nearly 50 web pages.)</p>
    html_clean: <p>I think I agree with Chesh that the swirly script is handwritten, but for another place to see a lot of swirly designs, look in Part 5 <a href="http://bowfinprintworks.com/Script05Pg1.html" target="_blank" class="link-external"> (Designed Scripts)</a>, Part 7 <a href="http://bowfinprintworks.com/Script07Pg1.html" target="_blank" class="link-external">(Casual Flowing Scripts)</a> and Part 8 <a href="http://bowfinprintworks.com/Script08Pg1.html" target="_blank" class="link-external">(Casual Non-flowing scripts)</a> of the Script Font ID Guide. I counted about a dozen curly fonts in the first 8 pages of Part 5, including Scriptease, Gigi, Dollhouse, Clover, Giddyup, Yellow, Riva, Marguerita and Curlz. (Be warned, if you look through them all it will be nearly 50 web pages.)</p>
