  html: |-
    <p>Got the Typophile crew together today and made a few quick updates:</p>
    <p>1. Browse recent users via <a href="http://typophile.com/avatars" title="http://typophile.com/avatars">http://typophile.com/avatars</a><br>
    2. Dig into content via <a href="http://typophile.com/tags" title="http://typophile.com/tags">http://typophile.com/tags</a><br>
    3. Fixed a bug keeping <a href="http://typophile.com/news" title="http://typophile.com/news">http://typophile.com/news</a> or <a href="http://typophile.com/aggregator" title="http://typophile.com/aggregator">http://typophile.com/aggregator</a> from running properly. (Let us know what type blogs you'd like to see in this space!)<br>
    4. Other behind-the-scenes fixes.</p>
    <p>Watch this space for more updates as they unfold. And keep tagging those posts! </p>
    <p>//jared</p>
