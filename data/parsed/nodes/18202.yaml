  html: |-
    <p>I am about to get an ambigram tattoo which consists of my two daughters names, Kendall and Kylie. The names themselves are ambigrams and are stacked. So when you read it one way it says Kendall, Kylie. When you read it the other it says Kylie, Kendall. Before I committed to getting inked up, I figured I would see what my fellow typophiles think! Hope you like it!<br>
    Thanks</p><div class="imageWrap"><img src="files/KENDALL_KYLIE_TATTOO1.gif"></div><p></p>
