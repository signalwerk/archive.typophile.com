    <p>I am designing a layout for a textbook about typography and type designers. Here is one spread, a proposed layout with my own text. I'd like a little feedback on:</p>
    <p>a) form</p>
    <p>b) content</p>
    <p>The typefaces are Scala and Scala Sans. Body is set 9/12 x 14 on the verso page and 9/12 x 21.6 on the recto page. Oh, and the center vertical represents the spine.</p>
    <p><a href="http://www.evanmade.com/storage/Zapf_Layout.pdf" rel="nofollow">CLICK TO DOWNLOAD PDF</a></p>
    <p>Thanks!</p>
    <p>Evan</p>
