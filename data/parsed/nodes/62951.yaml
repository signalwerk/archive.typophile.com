    html: "<p>The spread looks very good to me. But I'd check the text horizontal alignment bewteen the colums (eg: first and second column on the right page in the Zapf_Layout2.pdf: the text in the \"In the twilight of his life\" paragraph doesn't align with the text in the first column). This is the only real problem I see; moreover, I'd also increase the spacing bewtween the last paragraph and the footnotes (why letters instead of numbers?, anyway), with a thinner or gray line. In the end, I would also try to not hyphen the text. But as I said, it really looks like a good typograhycal piece.</p>"
