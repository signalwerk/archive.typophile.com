    <p>So I’ve been scanning some sketches and drawing over them in Fontlab/Illustrator…when i got to this one it boiled up a question: is the bottom serif of the letterform ‘d’ in this example considered an ‘ok’ practice?</p>
    <p>i went browsing through my small collection of fonts and looked at a few examples online and all i seemed to find were bottom serifs that were nearly the same as the ascender serifs except flipped a little.</p>
    <p>so is the hook serif considered ok? it might be a stupid question, but i’m pretty new to this and it’s my only pencil sketch that was really like this (mostly because i don’t draw d’s very well and obsessively draw a’s) also, if this is a method of serif others have used, what is the benefit of ending a letter in this manner in regards to text faces and in contrast to the sharper angled ending serif?</p>
    <p>please note, these sketches are very rough and really unrefined. only for question purposes completely. </p>
    <p>thanks<br>
    w|m</p>
