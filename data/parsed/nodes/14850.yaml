      <p>Not OK to my eyes. On the d, the bottom serif balances the top one, which is prominent in old syle or transition fonts—which yours seems to be. In the ‘a’ you don’t have a serif above it on the same stem, so the design problem is different. Putting the a tail on the d looks weak to me. </p>
      <p>All depends on how the whole face is done, so it might end up looking good in context, but not right now side by side.</p>
