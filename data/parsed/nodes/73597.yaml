      <p>Taking “k” away? No f-in’ way! It’s an essential ingredient in comedy. </p>
      <p>From the Neil Simon play <em>The Sunshine Boys,</em> the character Willy explains it to his nephew: “Fifty-seven years in this business, you learn a few things. You know what words are funny and which words are not funny. Alka Seltzer is funny. You say "Alka Seltzer," you get a laugh... Words with "k" in them are funny. Casey Stengel, that's a funny name. Robert Taylor is not funny.”</p>
