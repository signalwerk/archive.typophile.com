    html: <p>I managed to wade through most of the content on the Kalphabet website. So far as I can gather, the argument is that the shape of the letter K is psychically disturbing on account of its relationship to a particular pattern of three rivers in India and their association with ritual suicide, and that this shape plants suicidal ideas in the mind. Leaving side the fact that if one were unaware of the association between this shape and the confluence of the Indian rivers and, in turn, their association with suicide, one would have no basis for forming such ideas -- and leaving aside the fact that this ritual suicide is framed in positive terms by texts cited on the Kalphabet website --, it seems to me that the claim that the K shape prompts suicidal thoughts is empirically testable.</p>
