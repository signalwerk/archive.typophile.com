      <p>John &amp; Dave: well said!</p>
      <p>It implies this is not a typographical problem but a mere psychological one, and therefore discussing it has no place on a typophile's hangout. There may be online support groups where you can find a sympathetic ear (<a href="http://wiki.answers.com/Q/What_phobia_is_the_fear_of_letters">WikiAnswers</a>, on 'What phobia is the fear of letters?', categorizes this question under "Mental Health, Medical Terminology").</p>
      <p>Perhaps it would be different if the as yet anonymous o.p. could point out specific typefaces that trigger his suicidal tendencies. ITC Kabel and Futura, for instance, have pointy K's. Arnold Boecklin, on the other hand, is much more easier on the eye, no sharp edge anywhere. It's kind of overgeneralizing to state "I don't like <em>any</em> of them."</p>
