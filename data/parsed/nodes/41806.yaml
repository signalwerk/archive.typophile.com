      <p><cite> ...her lame signage?</cite></p>
      <p>Har dee har. I struggle with children calling adults by first names, and even at age 39 I don't like to refer to my superiors by first name. Let alone a presidential candidate. To me, running as "Hillary" seems too much of a touchy-feely emotional plea. Let's face it, we're still at war and we still need an ass kicker in the White House. So, to move into philosophy for the sake of a "general discussion," is it the design of the sign, or is it just the "Hillary?"</p>
      <p>As for the flag...I'm not so sure I ever thought it was that great of a flag. It's too 1770's. The U.S.S.R. flag was cooler.</p>
