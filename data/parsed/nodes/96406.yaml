    <p>Wondering if anyone can place this type used on a ceramic or possibly metal tile from Italy? The text says Italian Fratelli Andreoni Azienda Agricola Roma  which translates as Andreoni Brothers Agricultural Company Rome.  The way the x-height bars cross the verticals on the A and E is very distinctive, but I can't figure it out myself so any help is very much appreciated.</p>
