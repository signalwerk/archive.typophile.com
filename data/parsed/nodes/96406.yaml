    html: |-
      <p>Yugyug, that font you used 100 years ago would seem to be Insignia<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/INSIG_6257.png"></div><br>
      <a href="http://www.myfonts.com/search/insignia/fonts/" title="http://www.myfonts.com/search/insignia/fonts/">http://www.myfonts.com/search/insignia/fonts/</a><p></p>
      <p>As for the Italian metalwork: it's easy to find Art-Deco-inspired fonts that have SOME of those characteristics, but I don't know about finding a single font that has them all.</p>
      <p>Casablanca has the through lines and the round O, but not the distinctive R<br>
      <a href="http://www.myfonts.com/fonts/redrooster/casablanca-rr/" title="http://www.myfonts.com/fonts/redrooster/casablanca-rr/">http://www.myfonts.com/fonts/redrooster/casablanca-rr/</a></p>
      <p>Mark Simonson's beautiful Mostra Nuova would be good for setting the word "ROMA" at the bottom of your photo. Mostra even has the triangular crossbar.<br>
      <a href="http://www.myfonts.com/fonts/marksimonson/mostra-nuova/" title="http://www.myfonts.com/fonts/marksimonson/mostra-nuova/">http://www.myfonts.com/fonts/marksimonson/mostra-nuova/</a></p>
      <p>An example of a font with some Art Deco characteristics:<br>
      Copasetic<br>
      <a href="http://www.myfonts.com/fonts/cheapprofonts/copasetic-nf-pro/" title="http://www.myfonts.com/fonts/cheapprofonts/copasetic-nf-pro/">http://www.myfonts.com/fonts/cheapprofonts/copasetic-nf-pro/</a></p>
      <p>And if you want to spend a few hours poring over a thousand other fonts like that, a search on myfonts.com for "Deco," "moderne" and "geometric" turns up a TON of possibilities (though I wouldn't expect any exact matches)...<br>
      <a href="http://www.myfonts.com/search/deco+moderne+geometric/fonts/" title="http://www.myfonts.com/search/deco+moderne+geometric/fonts/">http://www.myfonts.com/search/deco+moderne+geometric/fonts/</a></p>
