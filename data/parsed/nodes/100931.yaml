    html: |-
      <p>Hello and thank you for your interest!</p>
      <p>As far as i know both files are Postscript, sfnt2woff exports Postscript as well as fontsquirrel.com. The renderer is Firefox 19.0.</p>
      <p>I am rethinking my approach to shading with other methods, it was an interesting test but all round inefficient approach. I have found a new way by using CSS in the mix!</p>
      <p>AK</p>
