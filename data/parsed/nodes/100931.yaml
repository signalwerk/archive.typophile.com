    date_raw: 1 Mar 2013 — 12:13am
    votes: null
    html: <p>Yes, sfnt2woff can export Postscript, but Fontsquirrel does not. If you do intend to make icons this small, you’ll benefit from much more simplied shapes, TrueType outlines and hinting instructions. And yes, shading is better done with CSS.</p>
