    html: <p>Back to the subject. I looked at the Zapfino family and tried to find any other close looks (skimming through the Yellow Book). Then I threw in two well-known elegant style scripts just for comparison. Admittedly, e is not the most distinctive letter in a script font, but at this size it's hard to argue with Yves.  If this is NOT the answer I'd like to see whether someone found a Zapfino rip-off. <br><img src="http://www.typophile.com/forums/messages/83/40532.gif" alt="Various Script e's"></p>
