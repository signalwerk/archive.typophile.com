  - id: 40013
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>I have seen a number of these font identification games, because I was asked for help many times, and this wouldn't be the first time that someone used a renamed rip-off version of a font and thought it was something original. Most casual font fans are more familiar with the 'free' versions of things than the originals they are based on, and they don't even know that an original exists.  <br> <br>I suspect that's what's happened here. <br> <br>(This is the reason I always try to show the true font names and designers in my Script Guide.)</p>
