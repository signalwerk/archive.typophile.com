    <p>We are in the final part of testing our new Windows version of Fontbase and are looking for 2 or 3 more testers.</p>
    <p>There is a brief description at:<br>
    <a href="http://www.dtptypes.com/Fontbase/FontbaseDescription.pdf" title="http://www.dtptypes.com/Fontbase/FontbaseDescription.pdf">http://www.dtptypes.com/Fontbase/FontbaseDescription.pdf</a></p>
    <p>or a more comprehensive description at: (2.5mb)<br>
    <a href="http://www.dtptypes.com/Fontbase/Fontbase.pdf" title="http://www.dtptypes.com/Fontbase/Fontbase.pdf">http://www.dtptypes.com/Fontbase/Fontbase.pdf</a></p>
    <p>if you are interested in doing some testing please email:<br>
    <a href="mailto:fontbase@dtptypes.com">fontbase@dtptypes.com</a></p>
    <p>many thanks</p>
