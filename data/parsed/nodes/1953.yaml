    html: <p>point taken scott. <br> <br>I used the symbols" labeled "A" and "C".  <br>just to differentiate the different ideas that I am working on.  <br>please inform me and euducate me on phonetic symbols.  My intentions are as you stated crossing international boundaries, with the identity marks.  The logo is for a friend that just started a translating business. English a Spanish, I want to achieve a minimal approach, however I don't thing that I am accomplishing my mission.  <br> <br>Please give me more feed back. <br> <br>sincerely; <br>IN<img src="http://www.typophile.com/forums/messages/29/19929.gif" alt="logo"></p>
  - id: 15536
    user_id: 618
    user_name: aquatoad
    user_path: null
    user_image: null
    date_raw: 6 Nov 2003 — 2:01pm
    date: 2003-11-06T14:01:00
    votes: null
    html: <p>This could be a shipping company. A geological company. A computer company. <br> <br>I would focus on a mark that says <i>translation</i>, rather than one that says <i>international</i>. Harder maybe, but your result will be smarter if you can pull it off. <br> <br>Don't know if you can do this, but consider suggesting CONSULTING change to TRANSLATION or LINGUISTICS or LANGUAGE SERVICES or nothing at all. Nothing would be just as informative as consulting. <br> <br>Best case scenario is a logo that shows the concept translation, and the word Ragir. That's it! <br> <br>Good luck. <br>Randy</p>
  - id: 15537
    user_id: 2236
    user_name: squeeze
    user_path: null
    user_image: /files/pictures/picture-2236.jpg
    date_raw: 6 Nov 2003 — 3:47pm
    date: 2003-11-06T15:47:00
    votes: null
    html: <p>I'd definitely agree with Randy about the shift from "CONSULTING" to "TRANSLATION". The only thing I can think of that might salvage using "CONSULTING" is to make the word somehow represent translation...maybe show the word in both English and Spanish. <br> <br>I think my suggestion of using phonetics with "RAGIR" is even more appropriate for a translation company (Although there is some fun irony in a translation company having a name that is difficult to pronounce). This may allow you to use the word independent of "CONSULTING" or "TRANSLATION". Phonetics has to do with sound and saying words correctly...things that a translator should master. To view phonetic symbols pick up any dictionary. These are the symbols used in the pronunciation keys of every word in the dictionary. If you're on OSX, then look at the dictionary in Sherlock. <br> <br>Good luck! <br> <br>Aloha! <br>Scott</p>
