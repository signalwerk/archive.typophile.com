    html: <p>I would start by throwing out the "symbols" labeled "A" and "C". <br> <br>"RAGIR" is a complex name, in that there's no obvious linguistic assumption to make for pronunciation...that's coming from an English speaking perspective. Since "CONSULTING" is English, I assume that comment is applicable here. You may want to consider using some form of phonetic symbols. In fact, many of these symbols cross international boundaries...This may allow you to ditch the map altogether to create a purely typographical (not topographical...he he) brand mark. <br> <br>Aloha! <br>Scott</p>
