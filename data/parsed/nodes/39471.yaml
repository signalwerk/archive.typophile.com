    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 27.Nov.2007 1.45am </div>
      <p>Hi Friends!</p>
    <p>We’re thrilled to announce the addition of over 20 amazing new display fonts! Check ’em out!</p>
    <p>Blue Vinyl Fonts - Parsley Script is the perfect semi-formal brush script face for nearly all your design projects! Check it out at: <a href="http://www.fontbros.com/bluevinyl.php" title="http://www.fontbros.com/bluevinyl.php">http://www.fontbros.com/bluevinyl.php</a></p>
    <p>CBDO - Our friend Charles Borges de Oliveira has blown us away with a hearty informal brush script called Avalanche! Check it out at: <a href="http://www.fontbros.com/cbdo.php" title="http://www.fontbros.com/cbdo.php">http://www.fontbros.com/cbdo.php</a></p>
    <p>Fontalicious - In addition to reuniting the fontalicious.com URL with its former owner, we’re pleased to announce we’ve added the popular and highly requested Alba family! Check ’em out at: <a href="http://www.fontbros.com/fontalicious.php" title="http://www.fontbros.com/fontalicious.php">http://www.fontbros.com/fontalicious.php</a></p>
    <p>Font Head - Introducing two great new dingbat fonts, Diaper Money and the very lovable and fun Quirkies! Inspired by the birth of his TRIPLETS, Ethan Dunham created Diaper Money for just that purpose! Check it out at: <a href="http://www.fontbros.com/fonthead.php" title="http://www.fontbros.com/fonthead.php">http://www.fontbros.com/fonthead.php</a></p>
    <p>Sideshow - We’re thrilled to announce two new exclusive releases from Sideshow, Blackcat and Blackcat Fever, both 1950s inspired condensed retro brush scripts were created by Sam Gambino, the famous artist and illustrator! Check ’em out at: <a href="http://www.fontbros.com/sideshow.php" title="http://www.fontbros.com/sideshow.php">http://www.fontbros.com/sideshow.php</a></p>
    <p>Wilton - Sporting the largest addition to this months update, Robbie de Villiers has been hard at work on tons of amazing new formal scripts and playful releases. Check ’em out at: <a href="http://www.fontbros.com/wilton.php" title="http://www.fontbros.com/wilton.php">http://www.fontbros.com/wilton.php</a></p>
    <p>We hope everybody is enjoying a fantastic holiday season and can’t wait to share more great new fonts with you in the coming months!</p>
    <p>Warmly,<br>
    Mike &amp; Stuart<br>
    The Font Bros<br>
    <a href="http://www.fontbros.com" title="http://www.fontbros.com">http://www.fontbros.com</a></p>
