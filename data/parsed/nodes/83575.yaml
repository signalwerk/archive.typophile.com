    <p>Thank you in advance for taking the time to read this and for any help you can offer. I realize that some sports teams use custom fonts, and therefore they aren't able to be IDed, but since this is used somewhat casually about their web site, I'm hoping it's an exception to that "rule".</p>
    <p>The font I'm interested in ID-ing is the slab serif font used for the USNA Midshipman's logo as seen on NavySports.com </p>
    <p>it can be seen on these graphics and the one attached:<br><a href="http://grfx.cstv.com/schools/navy/graphics/allaccess-main.jpg">http://grfx.cstv.com/schools/navy/graphics/allaccess-main.jpg</a></p>
    <p>the 'AVYSPORTS' part:<br><a href="http://grfx.cstv.com/schools/navy/graphics/navy-11-mast-left.gif">http://grfx.cstv.com/schools/navy/graphics/navy-11-mast-left.gif</a></p>
    <p>there are more examples on NavySports.com in flash and in some of the graphics (they do not use this one exclusively though).</p>
    <p>The 'N' used for their logo may have been in use since the 1940's, however, I'm not sure if it's the same font still, as it looks like the N in Rockwell, while the A used on the website does not.</p>
    <p>Any ideas?</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/navysports2.png" width="214" height="67" alt="">
