    <p>I'm trying to figure out if this is a typeface, or hand-lettered, or modified from a typeface. It's a book cover issued in 1990.</p>
    <p><a href="http://2.bp.blogspot.com/-w4KyqKJbmOU/UFWkZDaufmI/AAAAAAAAFVs/net3DsmaDhw/s1600/eszterhazy%2Badventures%2Bdavidson.jpg" title="http://2.bp.blogspot.com/-w4KyqKJbmOU/UFWkZDaufmI/AAAAAAAAFVs/net3DsmaDhw/s1600/eszterhazy%2Badventures%2Bdavidson.jpg">http://2.bp.blogspot.com/-w4KyqKJbmOU/UFWkZDaufmI/AAAAAAAAFVs/net3DsmaDh...</a></p>
    <p>It looks a fair bit like ITC Usherwood Bold to me.http://www.myfonts.com/fonts/itc/usherwood/std-bold/ but of course it has ligatures and alternates not available in the current digital version of that typeface. Did Usherwood ever have swash alternates? Is this a hand-lettered derivative, inspired by ITC Usherwood? Some other font with fancy swash alternates?</p>
    <p>Cheers,</p>
    <p>T</p>
