  - id: 157955
    user: 14571
    date: 2006-09-14T16:16:00
    date_raw: 14 Sep 2006 — 4:16pm
    votes: null
    html: <p>It is my practice to set acronyms with small caps, unless they are spelled with full stops between them, as e.g. the initials of a name, as in Alexander A.M. Stols. Small caps would be confusing, but caps would be obtrusive. In that case I use caps, but slightly vertically scaled, at e.g. 95%. This however is not an entirely satisfying solution because of the distorted weight (i.e. no true optical scaling). The ideal were typefaces that offered caps, small caps and something in-between, but properly designed to fit the overall weight of the face.</p>
