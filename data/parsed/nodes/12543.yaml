    <p>After seeing the popularity of my previous post on the proper use of the ampersand, I thought I would get some feedback on the proper use of small caps.</p>
    <p><strong>So, when is it, and when is not, appropriate to use small caps? Should they always be used with acronyms in body copy? And should "small caps" be written with or without the dash?</strong></p>
