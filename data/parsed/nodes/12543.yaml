      <p>Hrant has a good point.<br>
      I should add that if the type has a small x-height, this allows a largish small cap, quite distinct in size from both lc and caps -- and that is often the kind of face that has alternate small caps.<br>
      So it can be problematic for many publications that require large x-height faces for copy-cramming purposes.<br>
      You also have a situation where the capitals are themselves quite small, much shorter than ascender height. For instance, types like H&amp;FJ's Mercury offer a solution -- where an all-cap setting is not particularly obtrusive.<br>
      However, I have come to the opinion that I should produce amply sized small caps in all my faces, even those with smallish capitals to begin with.</p>
      <p>Another factor is tracking. Traditionally, small caps had very spacious sidebearings, for a reason. But that doesn't seem to be the case for most digital fonts.</p>
