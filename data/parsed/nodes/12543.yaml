      <p>I think it depends on both the context and content. The context contains the particular typeface and style and the "company culture". The content may dictate as well.  If one book is just riddled with acronyms, you might want to tone them down with mall caps.  If another book or article wants to place greater emphasis then keep them all caps.  I don't think the number of letters should dictate small caps though.  Consistant usage is important. What if I had a string of acronyms, would I only small cap the longer ones? Think of a sporting event where colleges played eachother and the local paper said, "UCLA beat UC by 20 points but UNLV was trounced by OU 100 to 10." </p>
      <p>ChrisL</p>
    html_clean: |-
