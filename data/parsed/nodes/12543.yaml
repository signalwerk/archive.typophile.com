      <p>We recently grappled with this in our publications. They are, in some sections more than others, rife with acronyms like JMSB, CA, CMA, CIAC etc... as well as with degrees (BA, BComm). I would have liked to make them all small caps, but so far the university's style in all other publications is BA, PhD, BComm and so on, so it wouldn't fly. </p>
      <p>We ended up doing small caps for all non-degree acronyms except "IT" which would have been confusing in certain sentences. It's consistent in an inconsistent way ;) But certainly (in my opinion) better than JMSB appearing 10 times all caps in one column. Only one occasion did the acronym begin a sentence. I believe I all capped it because no other acronyms followed and I (unfortunately) have no lee-way for those kind of edits.</p>
      <p>K.</p>
