  html: |-
    <p>I am trying to understand the tracking and leading relationship in typographic specimen sheets.</p>
    <p>I see popular ratios of:<br>
    6/10<br>
    7/11<br>
    9/13<br>
    10/14<br>
    11/15<br>
    12/16</p>
    <p>Is this sort of the standard or is it subject to the font and the cap height, etc?</p>
    <p>Thanks!</p>
