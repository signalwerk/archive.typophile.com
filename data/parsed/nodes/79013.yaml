    <p>I'm looking for font used in Cavaillon Rugby Union Club, It's kind of "block" font that I often find on jerseys but still unable to identify it.<br>
    I'm also still looking for the font used in Finnish Rugby Union, that kind of Castellar with different shape of serifs.<br>
    All images are attached naturally ;-)</p>
    <p>Best Regards,<br>
    12HAL9000</p>
