    html: |-
      <p>As mentioned, the name is hand lettered.<br>
      The the initial T is similar to the T in a font released by Barnhart Bros. and Spindler as Faust Text in 1898, and later sold as Missal Text.<br><a href="http://www.myfonts.com/fonts/solotype/faust-text/">http://www.myfonts.com/fonts/solotype/faust-text/</a><br>
      The rest of the word is derived from a font produced in 1760 as Caslon Black and now usually known as Old English. Too complex for most hand lettering, but there are simplified versions such as this house letters<br>
      design:<br><img src="/sites/default/files/old-images/OldEnglishHouseLettersSM_3428.jpg"><br>
      Don</p>
