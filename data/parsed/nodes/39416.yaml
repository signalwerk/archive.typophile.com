  html: |-
    <p>Hi, hope this is the right forum for this kind of question.</p>
    <p>Can anyone tell me, is there a version of Eras for the Mac that coverts to outlines correctly, i.e. with the correct slant and thick/thin? </p>
    <p>With the version I have, ITC Eras is how it shows in the font list (from Adobe?), it prints correctly but when converted in Illustrator the paths are like a cheap knockoff - right basic letter forms but upright and worst of all uniform in weight, which is of course not what Eras is all about. </p>
    <p>I've always wondered if there's a technical reason this font can't be made to outline properly although it seems like it should be possible given the characteristics of fonts that do convert OK.</p>
