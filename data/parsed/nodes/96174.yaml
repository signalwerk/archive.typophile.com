      <p>Hace mas o menos doce años que tenemos un gran nombre de diseñadores latinos de fuentes, con un gran proporción que tienen talento de verdad - y ademas son generalmente muy amables (no es sorpresa en su cultura :-). Si puedes relacionar con ellos (al mismo desde email) aprendaras mucho en poco tiempo. Unos nombres: Gabriel Martínez Meave, Alejandro Lo Celso, Rubén Fontana.</p>
      <p>Libros: Mi amigo Jorge de Buen ha escrito probablemente lo mejor libro acerca de la tipografía latina, el "Manual de diseño editorial".</p>
      <p>Lugares de estudio: Las calles de Los Angeles, hombre. :-)  Hay verdaderamente tan cosas que ver aqui. Yo creo que Nueva York ya ha perdido su gran importancia cultural de antes, al menos si hablamos del juventud, del futuro.</p>
      <p>hhp</p>
