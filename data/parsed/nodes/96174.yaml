      <p>Este año se va a imprimir este libro "Tipografía Latinoamericana", lo bueno es que tiene textos de 42 tipógrafos hablando sobre distintos aspectos de la tipografía en nuestra región.</p>
      <p><a href="http://lamonaca.org/tipografia-latinoamericana" title="http://lamonaca.org/tipografia-latinoamericana">http://lamonaca.org/tipografia-latinoamericana</a></p>
