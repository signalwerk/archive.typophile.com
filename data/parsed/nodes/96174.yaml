    <p>Hola a todos, </p>
    <p>Mi nombre es Juan, soy Peruano y estoy cruzando el último año de Bachillerato en Diseño Grafico y Animación en una Universidad de Nueva Jersey en los Estados Unidos. Aparte de mis estudios universitarios, tambien estoy desarrollando mis abilidades en el diseño de fuentes por mi propia cuenta. Trabajo en Nueva York y trato de atender la mayoría de conferencias que se llevan a cabo en el AIGA, TDC, y Type@Cooper, la cual tengo planeado applicar para este siguiente verano después de graduarme. Mi interés en la historia del Arte, en especial la del Diseño Gráfico, me ha llevado ha redescubrir la historia de la Typografía y  su influencia en América Latina.  Sin embargo, no he podido encontrar muchos recursos donde pueda aprender la historia del desarrollo typográfico, la escritura, y el Diseño Gráfico en América Latina. Les pido que por favor si alguno de udstedes me pudiera recomendar algun libro de texto, lugares de estudio, obras y autores o enviar un enlace de web donde pueda aprender mas de este interesante tema, se los agradecería mucho.</p>
    <p>Gracias.</p>
