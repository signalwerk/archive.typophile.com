      <p>As I think I've stressed above, the book is very well produced: the content is comprehensive, the writing clear and practical, the pages well illustrated &amp; nicely composed, the book finely designed &amp; beautifully printed. Perhaps it's notable that I ordered my copy only after seeing a copy first-hand, perhaps not. I certainly don't think this is simply a matter of being lazy or cheap. It's just that as folks invested &amp; in love with typography &amp; book design I assume that many of us have read extensively on the topic, have gathered a handsome collection of books on the topic along side a stack of others hoarded from the library. The result of this, at least on my part, is a certain disappointment when I shell out a good sum of money for the latest publication only to find that there isn't much in it I wasn't already familiar with. This isn't a complaint about the book, or any book, but about the fact that inevitably books on any given topic become repetitive and, at least to some extent, redundant.</p>
      <p>There is also the position which places a certain emphasis on "buying locally." This is a somewhat pointless argument in the age of Amazon, and in fact the opposite argument is likely more appropriate: that buying directly from Libanus (as I did) is the only way to get the money to the individual publisher. However, if the information found in a book produced in England can also be found in a book produced in Vancouver...</p>
