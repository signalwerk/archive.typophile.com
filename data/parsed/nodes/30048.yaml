  html: <p>I've just gotten a prospectus for this book from Oak Knoll (who are distributors of the book). The authors' own press (Libanus Press) is the imprint. It appears to be a phenomenally complete manual on book typography. 448 pages, 1000 illustrations of concepts and principles, thorough coverage of all topics related to book design including image/text layout, type selection, variables in type specification, and much more. I admit I am very intrigued by this brochure. Has anyone seen the book firsthand?</p>
  html_clean: <p>I've just gotten a prospectus for this book from Oak Knoll (who are distributors of the book). The authors' own press (Libanus Press) is the imprint. It appears to be a phenomenally complete manual on book typography. 448 pages, 1000 illustrations of concepts and principles, thorough coverage of all topics related to book design including image/text layout, type selection, variables in type specification, and much more. I admit I am very intrigued by this brochure. Has anyone seen the book firsthand?</p>
