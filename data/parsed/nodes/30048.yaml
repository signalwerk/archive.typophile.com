      <p>From the TOC, it looks like what Mitchell and Wightman bring to the table is an integration into the discussion of book design of the nuts and bolts of bookmaking, like getting files and images ready for press, different kinds of bindings and covers, the economics of printing and how that affects book design, etc. (parts 11, 12, 14, 15, and 16).</p>
      <p>I don't remember seeing those things discussed in Felici, Bringhurst, Hochuli, or Tschichold, and a look at Hendel and Dowding's TOCs tells me they don't address those things in any systematic way, either. Am I missing something? Speaking as an autodidact in the world of book design, this seems like a superb book to have on the shelf.</p>
