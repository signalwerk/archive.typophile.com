      <p>I picked up a copy directly from the publisher about 9 months ago and must admit it's a bit of an indulgence; there was something about the girth of the thing and the high production values that appealed to my vanity. The book really is nicely put together, and what it does it does very well; that is, it is ultimately pragmatic in its approach.</p>
      <p>The "problem" is that if one has studied one's Bringhurst, with additional readings from, say, Dowdings' <em>Finer Points...</em> and Tschichold's <em>The Art of the Book,</em> with, say, a few dashes of Felici's <em>Complete Manual of Typography,</em> (and every self-respecting book typographer should be reading these texts) then, really, <em>Book Typography</em> won't be as full of useful info as it might be to someone coming in blank.</p>
      <p>That said, the book has dedicated chapters on topics not touched by any of the above-mentioned books: basic halftone &amp; 4-colour pre-press, technical details on setting up &amp; designing soft-bound covers &amp; dust jackets, etc. (see below for the TOC). The book also focuses more on the fine details of HOW to accomplish certain typographic principles. Thus, where Bringhurst is perhaps heavier on the theory side, this text is very focused on the practical application; not exactly an application-specific manual, but a fairly clear book typographer's handbook.</p>
      <p>One small bug for North American readers is that the (format) dimensions tend to be in metric, rather than imperial (and this coming from a Canadian!); typographic dimensions are, for the most part, in points and picas, but dimensions relating to book/page/sheet size are all metric and/or European (that is, A2, A3, A4 rather than tabloid, legal, letter, etc.).</p>
      <p>As I started, the book really is an indulgence, as much (I'm guessing) for the authors in producing the book as it is to own. It's lush, beautiful and well built, and it looks good on the shelf. However, when I'm looking to confirm a principle, it's still Bringhurst that I reach for.</p>
