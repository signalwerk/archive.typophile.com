  html: <p>While there seems to be many fine books written on the practive of metal typesetting and how these types were made, are there any handy references regarding photo type settting and new type practices of the late 60's, 70's through mid 80's? in a nutshell, everything that wasn't metal type setting and before the digital days of the late 80's</p>
