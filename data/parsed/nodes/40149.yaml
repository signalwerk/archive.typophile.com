      <p>It may not be that interesting.</p>
      <p>I worked in three different compugraphics groups. Unix command line input, no on-screen representation, constantly changing film widths to keep costs down, and then you kerned headlines on the board.</p>
      <p>Oh the thrill of finding a waxed letter stuck to your butt and trying to figure out where in the paper it had come from.</p>
