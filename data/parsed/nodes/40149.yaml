      <p>A great text about the transition of Metal to Photo was written by Ed Rondthaler which also happens to be his autobigraphy and the story of PLINC. It's called Life With Letters (as they turned photogenic)</p>
      <p>Additionally, since the Filmotype acquisition I've been working on the complete story of the history of the company, device and library which I hope to have published before the coming Typecon.</p>
      <p>Best,<br>
      Stuart :D</p>
