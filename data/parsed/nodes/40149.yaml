      <p>I get the impression that researching photo type is a bugger in part because nobody loved the process very much. So when desktop publishing arrived, most designers unceremoniously swept their photo-type stuff into the trash, and few libraries held on to the old technical manuals.</p>
      <p>Stuart, your history of Filmotype sounds like a fun read, I’ll be looking forward to it.</p>
