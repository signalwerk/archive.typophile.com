  html: '<p>Last night I attended the opening of an exhibit of the typographic work of 2nd year design students at Seattle Central Community College. Take note: this is not what you would expect! Jennifer Kennard and her partners in crime teaching animation, photography,printing processes and book arts have nurtured an astonishing level of skill and thought in their students. The show is dazzling. If you want to wonder if you should go back to school, or maybe just lie down and take a long nap and consider becoming a barista instead, take a look: xType Culture Show previewed at <a href="http://letterology.blogspot.com/" title="http://letterology.blogspot.com/">http://letterology.blogspot.com/</a> I think you will especially enjoy the animated "sand serif" alphabet created in sand on a lightbox (most of the animations can be seen online at the letterology link.)</p>'
  html_clean: '<p>Last night I attended the opening of an exhibit of the typographic work of 2nd year design students at Seattle Central Community College. Take note: this is not what you would expect! Jennifer Kennard and her partners in crime teaching animation, photography,printing processes and book arts have nurtured an astonishing level of skill and thought in their students. The show is dazzling. If you want to wonder if you should go back to school, or maybe just lie down and take a long nap and consider becoming a barista instead, take a look: xType Culture Show previewed at <a href="http://letterology.blogspot.com/" title="http://letterology.blogspot.com/">http://letterology.blogspot.com/</a> I think you will especially enjoy the animated "sand serif" alphabet created in sand on a lightbox (most of the animations can be seen online at the letterology link.)</p>'
