      <p>&gt; <em>If Adobe would provide some info re their XML-encoding, writing a utility that could process the various flavours of ID-files would be doable.</em></p>
      <p>Starting in CS4, InDesign documents can be saved in InDesign Markup Language (IDML). InDesign Markup Language is an XML- based file format that allows developers to assemble and disassemble InDesign documents using standard XML tools and without having to open INDD files. <em>From <a class="freelinking-external" href="http://help.adobe.com/en_US/InDesign/6.0/WSFE4C4DDD-967A-4cf0-845F-AB2B86FCC809a.html">ID CS4 What’s new</a></em></p>
