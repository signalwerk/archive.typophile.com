    html: <p>File-&gt; Export InDesign Interchange format. No need to take it into CS2, you should be able to open the .inx file within InDesign CS. Not all features may work or be imported correctly though.</p>
    html_clean: <p>File-&gt; Export InDesign Interchange format. No need to take it into CS2, you should be able to open the .inx file within InDesign CS. Not all features may work or be imported correctly though.</p>
