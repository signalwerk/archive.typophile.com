    <p>hi!<br>
    i need to change some documents from indesign cs3 to cs.<br>
    can someone tell me exactly how to do it??</p>
    <p>i’ve already exported the documents as indesign interchange<br>
    then, i opened them in cs2, saved the document and exported it again<br>
    to be ready to open in cs, and it isn’t working..</p>
    <p>am i doing something wrong?? is there a simpler way to do it?</p>
    <p>can someone help me?<br>
    thanks in advance!</p>
    <p>carolina garza</p>
