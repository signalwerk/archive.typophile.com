    html: |-
      <p>Hi Carolina,</p>
      <p>have a look at these articles:<br>
      <a href="http://livedocs.adobe.com/en_US/InDesign/5.0/help.html?content=WSa285fff53dea4f8617383751001ea8cb3f-6d4d.html">Save backwards to previous InDesign versions</a><br>
      <a href="http://kb.adobe.com/selfservice/viewContent.do?externalId=329660">Can’t save InDesign documents to an earlier version</a></p>
      <p>bemerx25 said <cite>No need to take it into CS2</cite><br>
      I’m afraid this is not correct.</p>
      <p>1. Export from CS3 as INX<br>
      2. Open in CS2 (and make sure CS2 is updated to the newest version = 4.0.5)<br>
      3. Export from CS2 as INX<br>
      3. Open in CS (and make sure CS is updated to the newest version = <a href="http://www.adobe.com/support/downloads/detail.jsp?ftpID=2448">3.0.1</a>)</p>
    html_clean: |-
