    date_raw: 2 Aug 2002 — 2:44pm
    votes: null
    html: <p> Well, it does need some spacing work. Like "UY" is too loose, "IM" is too tight, and some others. Latin caps generally benefit from looseness, although that's of course problematic in a logotype. In contrast, the second line I think is too loose, especially considering its "informality". BTW, would the rule look better shorter? Lastly, the comma's too big. What if you replace the comma with a tilde-thingie, to echo that dome ligature? <br> <br>BTW, that UC "K" I think "opens" the logo very nicely. <br> <br>hhp </p>
