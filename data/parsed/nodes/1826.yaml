  html: <p>This is a logotype I've been working on for a law firm in Sacramento, California.  <br> <br>They are both attorneys in business, healthcare, and labor. The client would like a subtle reference to the 'capitol city' , hence the dome-like union of the 'L' and 'S'. <br> <br>The type is set in Bembo SC and Bembo Italic Osf.  <br> <br>Please critique me! Thanks!!! <br><img src="http://www.typophile.com/forums/messages/29/1934.gif" alt="ks.gif"></p>
  html_clean: <p>This is a logotype I've been working on for a law firm in Sacramento, California.  <br> <br>They are both attorneys in business, healthcare, and labor. The client would like a subtle reference to the 'capitol city' , hence the dome-like union of the 'L' and 'S'. <br> <br>The type is set in Bembo SC and Bembo Italic Osf.  <br> <br>Please critique me! Thanks!!! <br><img src="http://www.typophile.com/forums/messages/29/1934.gif" alt="ks.gif"></p>
