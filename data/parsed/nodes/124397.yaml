      <p>I think the final dot is only confusing. It suggests that you're supposed to read "Hi." That's one more meaning than you need.</p>
      <p>The left letters are narrower and pushed aside, making the whole group unbalanced and off-center. Maybe you haven't realized that you have a chair as well as a lamp. Give both equal space and importance.</p>
      <p>Consider a low crossbar on the "A" making a stripe trim on the lamp. Then see if it helps to copy the letter shapes into the logotype below.</p>
