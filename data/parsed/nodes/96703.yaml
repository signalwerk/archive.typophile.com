    html: <p>The sans on the left looks like <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/avenir/" rel="nofollow">Avenir</a> to me. I have to agree with previous comments for the "courier-like" font you're after. A bigger sample would be welcome to positively identify this font. If, for instance, they're using the same typewriter as on the website, could be <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/courier-new/" rel="nofollow">Courier New</a> and the sans <a class="freelinking external" href="http://www.colophon-foundry.org/fonts/apercu/about" rel="nofollow">Aperçu</a> (even if I really it could be it for the cover, really more like Avenir to me).</p>
