      <p><cite>There are only about nine languages that read right to left.</cite></p>
      <p>Directionality is a property of script not language, e.g. Azerbaijani used to be written in Arabic script, switched to Cyrillic in the Soviet era and then Latin post Soviet.</p>
      <p>Similarly, many African language used to be (and still to some extent) written in Arabic script (Ajami) and now written in Latin script.</p>
      <p>There are more right to left scripts; Syriac, Thaana, N'Ko. Old Italic can be written write to left. Egyptian hieroglyph is written in any direction, its derived scripts are always right to left.</p>
      <p>And there boustrophedon where each line is flipped in the other direction.</p>
