      <p>There are only about nine languages that read right to left.</p>
      <p>Hebrew, Arabic (and Farsi and Urdu) - and Chinese, Japanese, Korean, and Mongolian.</p>
      <p>The latter four read left to right most of the time nowadays. But when they are read <em>vertically</em>, the vertical lines then proceed right to left, and thus books laid out in the traditional way for Chinese will have the front cover located on what appears to be the "back", just as books in Hebrew would.</p>
      <p>So, east of Jerusalem, we have Hindi, Thai, Malayalam and Tibetan, for example, that read left to right.</p>
