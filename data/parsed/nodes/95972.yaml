      <p>"UPCOMING" looks like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=Bebas%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=3ef73ff48d36ad769ecdd8ad805dda61&amp;wrap=2&amp;text=UPCOMING" rel="nofollow">Bebas</a></strong> free font by Ryoichi Tsunekawa</p>
      <p>while "Events" (including the texture) must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-2&amp;ffam=Marcelle%20Script%20-%20Regular&amp;fid=d802e6c8729e9f84c1db08fd1976bbe8&amp;fsize=60&amp;text=Events&amp;fit=1" rel="nofollow">Marcelle Script</a></strong> by Zone Erogene (Stereo Type / free for personal use) and is probably based on <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Monotype&amp;ffam=Script%20MT%20-%20Bold&amp;fid=398cb536a6334c604c40095d6cc44510&amp;fsize=60&amp;text=Events&amp;fit=1" rel="nofollow">Script MT (Bold)</a></strong> by Monotype</p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
