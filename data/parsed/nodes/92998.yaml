      <p>Aren't we trained from early reading to pay more attention to big bold words? Isn't that what bold type is for? Or all caps? STOP</p>
      <p>I would really like to see this brain data used for a different purpose. Our brains must put out a different signal when we read hard-to-read type versus easy-to-read type. Once we identify those signals, we can (relatively) easily see what typefaces are actually good text fonts.  And we could experiment to see what would be the best tracking for the good text fonts.  A lot of a speculative, judgmental area would be cleared up.</p>
      <p>So when will we see the retail, off-the-shelf typographers version of this rig?</p>
