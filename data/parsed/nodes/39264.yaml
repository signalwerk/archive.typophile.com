    <p>November issue of the <a href="http://www.planet-typography.com/news/" rel="nofollow"><strong>Typographic Times</strong></a>:</p>
    <p><a href="http://www.planet-typography.com/news/designer/kegler.html" rel="nofollow">Interview of Richard Kegler</a><br>
    “I would like to think our fonts open up Design history to a wider audience.”</p>
    <p><a href="http://www.planet-typography.com/news/typeface/czech-modernist-preissig.html" rel="nofollow">Portrait of the Czech inspired Preissig typeface</a><br>
    “Preissig’s typographic work focused on the desire to find a true Czech typographic identity by addressing the predominance of diactrics in the Czech language.”</p>
    <p><a href="http://www.planet-typography.com/news/typo/ellen-lupton.html" rel="nofollow">Interview of Ellen Lupton</a>, author of <em>Thinking with type</em><br>
    “I emphasize design as living practice—not theoretical debates, but doing work in the studio. I emphasize the public, communications value of design not inward personal expression.”</p>
    <p><a href="http://www.planet-typography.com/news/typo/diacritics.html" rel="nofollow">Presentation of the Diacritic project</a> of Filip Blažek<br>
    “Web pages of the Diacritics project contain an overview of accents used in European languages which use the Latin script.”</p>
