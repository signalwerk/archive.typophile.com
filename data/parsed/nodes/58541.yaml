      <p>(Kirsten: “fancy dress” is England English for “costume party”.)</p>
      <p>Assuming you’re going to keep working with what you have, I’d make the main letterspacing much tighter, and replace the secondary type with a typeface that matches or harmonizes in some way with the main type. The image is probably a bit too cluttered with stuff, and I realize it’s very hard to see “simplicity” and “wackiness” going hand in hand, but it’s something to try to keep in mind as you explore ideas.</p>
