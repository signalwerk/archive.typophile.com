      <p>I’m not convinced about this. The colours are fun but I think it should work in one colour too, so perhaps it’d be best to start with a solid concept in black and white before adding the sparkle.<br>
      A couple of ideas: have the letters of the text somehow suggesting fancy dress. You could put different kinds of costume on different letters...I’m thinking horns, antenna, flares, wigs and ra-ra skirts. That would be pretty hard to draw onto a font successfully but could look totally unique. Or use letters from different fonts, in different colours e.g. a horror font dripping red blood for one letter, a fuzzy bee in yellow and black for another letter, put them all together and you don’t need a separate icon.<br>
      Or, since it’s a place for party outfits, I’m thinking a set of people in silhouette having fun in different costumes, kids and adults, monsters and vampires, dancing or jumping. Then have the text below.<br>
      To me, the one person in the logo looks a bit lonely...balloons and a smile don’t quite make a party.<br>
      Sorry, I don’t like the type at all, I’d find something much more dynamic and properly spaced. I think you’re on the right track with the round terminals but there are plenty of better alternatives out there.<br>
      Hope that’s helpful :)</p>
