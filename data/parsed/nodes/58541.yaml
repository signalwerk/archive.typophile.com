    html: |-
      <p>I’m guessing this is a store with kid’s stuff. But if it’s a “fancy dress” store I don’t understand the use of a kid with a baseball hat and wings. And what does the exclamation mark on the shirt stand for? </p>
      <p>There’s a number of technical concerns, you have a lot of gradients, which may not reproduce well depending upon usage. </p>
      <p>I think you need to outline the project more. Does “fancy dress” mean elegant party/wedding/christening clothes for children? or is it more of a party supply store that sells balloons and party favors? How will the logo be used? on signs? on the web? on business cards? Will it ever need to be in one color?</p>
      <p>There’s concerns regarding your type selection and kerning, but until the real nature of the store is better understood it’s not even something to delve into yet.</p>
      <p>I think you should go back to square one. Determine what is the image the store wants to convey. Then start by doing sketches on paper. Work on the concept and composition before diving in with the gradient tool. I hope I don’t sound harsh but it seems like you put the cart before the horse and need iron out the concept first.</p>
