    <p>The June edition of the Metal Type newsletter is now out.</p>
    <p>This month’s video was filmed in the grounds of Metal Type HQ (OK, my back garden!) and there’s a chance to see some letterpress equipment and type that I’ve recently saved from the scrap-heap - it’s all looking for good homes. Some of the larger items are only available for collection from York here in the UK.</p>
    <p>If there’s anything you fancy please get in touch.</p>
    <p>Click the link below to take a look:<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=17" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=17">http://www.metaltype.co.uk/rail/clicks/click.php?id=17</a></p>
    <p>=============================</p>
    <p>METAL TYPE CLASSIFIEDS</p>
    <p>Don’t forget you can always place a free ad on Metal Type.</p>
    <p><a href="http://www.metaltype.co.uk/cgi-bin/suite/classifieds/classifieds.cgi" title="http://www.metaltype.co.uk/cgi-bin/suite/classifieds/classifieds.cgi">http://www.metaltype.co.uk/cgi-bin/suite/classifieds/classifieds.cgi</a></p>
    <p>==============================</p>
    <p>All the Best<br>
    Dave Hughes</p>
