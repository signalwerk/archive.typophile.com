      <p>Ooh, Brighton...me too!</p>
      <p>I'd agree with the previous post — and I think the teardrop terminals are much more interesting. I can see why you had the ball terminal in the logotype but the key in type design is harmony. </p>
      <p>Re overshoot, you'll need to make sure the arched letters and in fact any curves overshoot the x-line and baseline until those shapes appear the same size. Oh yeah, that was already mentioned.</p>
      <p>Counterspaces of /e/ are not happy. Crossbar of /t/ should not come to a point — square-ended would look stronger.</p>
      <p>It's a bit difficult to judge when the letters appear in different posts. Could you set an alphabet and post a pdf?</p>
