    html: |-
      <p><em>would you suggest using a similar tear-drop terminal to the v, r and w?</em></p>
      <p>No. While it needs to flow in similarly, I'd recommend starting by smoothing that ball terminal into a teardrop shape. If that needs work still, you can put the other teardrop terminal glyphs on another layer and compare them to see what's up. Minion and Garamond probably have something similar to a teardrop terminal by the way. :)</p>
      <p><em>would you match the top of the 't' more to the solid width of the l and h rather than coming to a point?</em></p>
      <p>You could try adding another control point and sort of softening the pointy top area.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/t_bold_4546.png"></div> <div class="imageWrap"><img src="http://typophile.com/files/t_reg_4097.png"></div><p></p>
      <p>Note the top on both glyphs has softened apexes.</p>
      <p><em>The round glyphs</em></p>
      <p>Play around with them. :) The problem is most especially with, say, the r - it's arm looks much lower than the stem. Step back a few feet. Squint. Do the tops and bottoms of letters look equal?</p>
      <p><em>The extrema of the 'e' - do you mean pulling out the bottom left area? its already pretty weighty?</em></p>
      <p>It looks "lumpy" in a way, you can pull the bottom point a bit to the left and open open the inside some if you think that's a problem.</p>
