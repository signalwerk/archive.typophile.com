      <p>Looks good, a few comments, take them with a grain of salt:</p>
      <p>* You have both ball terminals (as with f) and teardrop terminals (r, v, y, w) - maybe try using just one kind. :)<br>
      * The top of the t is very pointy.<br>
      * The round glyphs need to overshoot upwards and downwards mathematically from the non-rounded ones to look right optically. Try moving those up or down until they look "equal".<br>
      * Maybe try pulling the point at the extrema at the bottom of the e leftwards a bit?</p>
