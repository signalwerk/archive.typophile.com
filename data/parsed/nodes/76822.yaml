      <p>Great progress!<br>
      Here are my observations; I'm not a professional so be wary of taking my comments too meaningfully.</p>
      <p>Widths: /s/ is rather wide especially next to /h/ as /h/ and /u/ are quite narrow. I'd recommend previewing more words with those letters and bring the widths into harmony a bit. Look at the relative counter sizes. /r/ may be a bit wide, but it's a great design.</p>
      <p>/f/ and /t/ I think I'd make the crossbars wider and define the foot of /t/ more. It looks a bit shy. Could you add more weight to the teardrop of /f/?</p>
      <p>Love the curved downstroke of /v/ and /w/. I think you should draw /y/ the same way. Also that downstroke starts below the x-line, making it look low. Try putting the vertical centre of that entry stroke on the x-line. Love those big blobby terminals. Perhaps pull in the final upstrokes, it's pulling the counter to the right somewhat. Put some overshoot at the baseline of all these (perhaps not /y/).</p>
      <p>Your hyphen seems large enough to be an emdash.</p>
      <p>Perhaps a hair more overshoot on the rounds?</p>
      <p>Some swash alternates would look very groovy.</p>
