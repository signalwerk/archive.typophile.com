    html: |-
      <p>I'd second everything Bendy said.<br>
      On weight, thicks of the rounds need to be thicker to optically match the thickness of the straight stems (e.g., /o/ looks much lighter to me than, say, /h/). Diagonal letters are also relatively light compared to the vertically dominated glyphs. (Or, of course, you could narrow the vertical stems instead of widening the curved and diagonal strokes.)</p>
