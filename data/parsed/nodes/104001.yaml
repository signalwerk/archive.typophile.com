      <p>Thanks for the bigger sample, Ryuk. It shows that what we are looking for is a fatface that is highlighted,  spotlighted, or handtooled. The effect is shown in two Bodoni's:  <a href="//www.myfonts.com/fonts/imageclub/bodoni-highlight/" rel="nofollow">Bodoni Highlight</a> and <a href="http://www.myfonts.com/fonts/letraset/spotlight-2/" rel="nofollow">Spotlight</a> but neither has the highlights in locations that match GELATO.<br>
      Alternatively, the logo designer could have started with Annlie Extra Bold, Sahara Bodoni or another version and edited to produce a  highlighted  GELATO.</p>
      <p>Don</p>
