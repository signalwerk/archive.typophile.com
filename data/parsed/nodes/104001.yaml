      <p>We seem to have a match for the letters GELATO -- the letters are fuzzy so I can't say 100%-- in <a href="http://www.myfonts.com/fonts/linotype/annlie/" rel="nofollow">Annlie Extra Bold</a> designed by Fred Lambert in 1966. This is a recreation of the 19th century fat faces which pushed the Didone style to the max for impact in advertising purposes. The style included extreme contrast between thick and thin strokes and a large scale lower case. Lambert is an outstanding designer and I prefer his version to most other recreations of the style.</p>
      <p>Don</p>
