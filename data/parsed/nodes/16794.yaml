    html: |-
      <p>I have to admit to using Google to research a spelling as it’s sometimes a faster starting place than the dictionary (especially when digital dictionaries return <em>nothing</em>). For example, search for “ven diagram” and you get 18,000 results. Then if you search the correct spelling, “Venn diagram” you get 558,000 results. I’m sure it’s not 100% reliable, but it’s good when you don’t have a clue.</p>
      <p>It’s like polling the audience in Who Wants to be a Millionaire. =P</p>
      <p>“thou shalt not” yields 1.2 million results<br>
      “thall shalt not” yields 558 results</p>
      <p>___________</p>
      <p>Lest anyone think I’m an AIGA basher (nay, I’m a paying member, else why would I receive their mailings) I should say that the AIGA deserves a lot of credit. Who else could be a non-profit and maintain the image they’ve created with the budgets they have. Seriously.</p>
