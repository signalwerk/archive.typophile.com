      <p>&gt; <cite>Lest anyone think I’m an AIGA basher </cite></p>
      <p>Actually, I didn’t really think of this post as anti-AIGA-ism. Seriously, who doesn’t enjoy pointing out someone else’s mistakes? :)</p>
      <p>To put my own shameful moment into the ring:<br>
      On a big marketing kit project, I once misspelled part of the client’s name on the kit label. Fortunately, a co-worker caught the mistake (AFTER they were printed, but BEFORE they were applied) and we were able to fix it.</p>
      <p>But believe me, it took a LONG time to live down the ‘Infastucture’ incident.</p>
