    html: |-
      <p>Satya, </p>
      <p>Nice batch of sketches.  </p>
      <p>I agree with Pascal; I saw an S and V at first as well.  I think it has to do with that bottom left piece.  It might need a horizontal line (instead of a curve) on the bottom, to serve as the beginning of the N.  You could try minimizing the S more.  Make it thinner possibly.  You've got to play with the form of that bottom piece so it conveys the N more instantly.</p>
      <p>Otherwise, it's a pretty good integration.  A few tweaks and you should have it.</p>
    html_clean: |-
