    <p>I’m not a designer but have been asked to come up with a logotype for a friend’s blog.</p>
    <p>Her blog is called ’fartings’. Apart from insisting on lowercase, all ideas have been left to myself, including font and colour choice. Point size is 52 (Blue Highway) and 20 for the script (Dali), and is for Web only. I have not done any alternatives (yet!)</p>
    <p>The blog is personal, with a fairly direct slant, without, hopefully, being offensive.</p>
    <p>I haven’t shown her the results yet and  would be very grateful if I could have the benefit of some critique. </p><div class="imageWrap"><img src="/files/fartings_6158.gif"></div><p></p>
