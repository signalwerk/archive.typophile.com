      <p>I chose Dali script for the ’just read it’ subtitle because, to me, it suggests a quick, almost knee-jerk outpouring of thoughts and ideas, and supports the self deprecating blog-site title.  I felt it important to use a script which most closely mimics handwriting, rather than a script with separate characters and that the thin strokes in the text support the desired effect. It’s quite possible I may be completely wrong. The size of the graphic will be the same size as is shown here.</p>
      <p>I have tried other, more legible script fonts such as Ginette or Georges, but they don’t appear to match the ’take it or leave it’ attitude the owner wishes to impart on the site, while, of course, ensuring the whole is constructed with the greatest care and belies the thoughtful, carefully-constructed writing in posts.</p>
