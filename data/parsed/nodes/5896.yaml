    html: "<p><i>&gt;Nothing is ever \"clearly\" in public domain.</i> <br> <br>Gerald, surely you didn't mean this statement literally. There are plenty of creations which are indisputably in the public domain. The melody which many of us know as \"Twinkle Twinkle Little Star\" (or the alphabet song) is in the public domain; I need no one's permission to write a song based on it. Shakespeare's plays are in the public domain; I don't need anyone's permission to publish my own copy of his text.  Da Vinci's Mona Lisa is in the public domain; I don't need any one's permission to paint my own copy of it. The creative merits of such an act may be debatable, but the legality is not. (Unless I try to pass my copy off as the original, in which case it's fraud; but that's another legal matter.)  <br> <br>Intellectual property right protections do not last forever. <br> <br>(It should be noted, however, that any given photograph of the Mona Lisa may not be in the public domain, so I can't just go around indiscriminately reproducing someone else's *photo* of the painting.) <br> <br><i>&gt;The remote possibility of existing trademarks and <br>&gt;registration legalities are more of a concern here. These would pass <br>&gt;on to those parties who acquired the assests of the firm. </i> <br> <br>Yes, you make a good point. Aside from copyright and patent, there are trademark considerations. But, as with patents, U.S. trademark registration is also a very restricted protection. A period of three years of non-use may be enough for a mark to be considered abandoned, unless acceptable reasons are given and the proper papers are filed with the Patent and Trademark Office. I don't know if Kingsley-ATF did this or not.  <br> <br>But I believe that this protection would extend only to the ATF name and logo, and probably some of the actual names of typefaces, presuming they were properly registered. I don't think there is any aspect of the specimen that could qualify for protection as \"trade dress.\" And merely reproducing the logo is not necessarily sufficient to constitute infringement, especially if the reproduction is in the context of the company's own publication.  <br> <br>&gt;It wouldn't really matter in the eyes of the law that Graham has <br>&gt;provided an \"admirable service\" if someone who had the legal right to <br>&gt;challenge his efforts chose to do so. <br> <br>Granted. My comment wasn't meant as a legal defense.  <br> <br>But let's review: I think we've established and agreed that the book itself is no longer protected by copyright. There is a slim chance that some of the typefaces shown may have been granted a U.S. patent, but (as I think John noted) that protection has probably expired; and, regardless, merely reproducing the showings would not violate patent protection. Finally, trademark protection, if any still applies, would only cover the names and the logo; and I maintain that publishing the images of the specimen on the web would not constitute trademark infringement. <br> <br>But -- correct me if I'm wrong -- I get the impression that your initial concern was not so much with Graham's right to reproduce the specimen pages, as with what others might do with the images. If so, I contend that we can not reasonably hold Graham responsible for these possibilities, any more than we hold libraries responsible because they make their collections accessible and provide public photocopiers. If there is any subsequent infringement on the rights of ATF's successors by someone swiping a typeface design, then I think that lies squarely on the \"swiper\". <br> <br>[Standard Disclaimer: I'm not a licensed IP attorney, etc., etc.] <br> <br>-- K. <br> <br>P.S. Way to go on the ATF and BB&amp;S books. Great story!</p>"
