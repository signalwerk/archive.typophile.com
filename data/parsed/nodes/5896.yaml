    html: <p>Congratulations, Tanya. Two bits? What a steal. <br>Jared's right, though, the 1923 specimen is the holy grail. The others are pre-Morris Fuller Benton. <br> <br>As interesting as it would be, I can't imagine there would be any way to justify the expense of a reprint. Real collectors probably wouldn't be interested in a facsimile. The potential market would actually be very small. And drum-scanning 1000+ page? I suppose your boss could be an eccentric, wealthy bibliophile. <br> <br>Jared, the maximum protection offered by U.S. copyright is 75 years. Any copyright on the 1923 book would have expired in 1998 (and that's assuming they filed the proper extension after the first 26 years). So, if you've got the time and the server space, go ahead. <br> <br>-- K. <br> <br></p>
