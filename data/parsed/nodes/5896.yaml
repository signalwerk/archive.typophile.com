    html: <p>I cannot beleive they sell at 100bucks on ebay. That's ridiculous for any specimen book... but y'no what I mean? 100 bucks is a night on the town...who is it that placed this value? idiots. <br> <br> <br>Think I'll have to discount the value of any further posts from Tanya here. This book is easily worth $100, and in very good to excellent condition, much more. Most of the specimen books from the major metal foundries are worth this at minimum. The ATF were quite plentiful and are still relatively easy to obtain. <br> <br>Who places this value? people who value them and are willing to pay the the going rate to get them. The last specimen book I bought cost $250, an Enschede, and it was quite a bargain at that. <br> <br>I'd be a bit more careful about copying this and then distributing the results in public. Several parties still have legal interests in ATF, including some of the major digital foundries. And we all despise theft don't we? <br> <br>Gerald</p>
