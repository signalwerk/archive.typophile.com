    html: "<p>Hrant writes:<i>But the part of me that thinks it's a distraction from proper protection (copyright) protests too loudly.</i> <br> <br>I think, for people like Adobe who regularly seek patent protection for their new typefaces, it is a case of taking whatever protection is on offer. I agree that the existence of design patent protection makes it possible for the US Copyright Office to shrug off demands for copyright protection: 'Take your typeface across the road to the Patent and Trademark Office. They'll look after you'. But not availing oneself of the available protection isn't going to stir the Copyright Office's heart either. <br> <br>In response to Gerald: the USA offers design patent protection for typeface design. It does not offer copyright protection; this was confirmed in the Esselte vs. Ringer case (note, however, that I'm aware of at least two analyses of the case, written by lawyers, that suggest the case was poorly argued and the decision in error). Unlike copyright protection, a design patent must be actively sought (it is not automatic), the review process is more rigorous (for example, you have to provide exhaustive examples of prior art that may have influenced the design), and is for a much more limited period of time (I can't remember what it is in the US; the Canadian equivalent is Industrial Design Protection, which is for 14 years). <br> <br>Some other countries provide copyright protection for typeface design, and the sky hasn't fallen yet.</p>"
