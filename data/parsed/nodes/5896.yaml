    html: <p>&gt;I'd be a bit more careful about copying this and then distributing the <br>&gt;results in public. Several parties still have legal interests in ATF, <br>&gt;including some of the major digital foundries. And we all despise <br>&gt;theft don't we? <br> <br>Gerald, I don't think Graham can reasonably be expected to take responsibility for any potential "theft" of these designs. The specimen book itself is clearly in the public domain, since anything published before 1978 has a maximum protection of 75 years from date of publication.  <br> <br>There may indeed be parties still with legal interests in the assets of ATF, such as they are. I don't know what the standing might be on any of the patents ATF may  have held for any of its type designs. But the published book is no longer protected by copyright, and I think Graham has done an admirable service in giving those unfortunates who have not had the opportunity a glimpse into this fabled beast. <br> <br>-- K. <br> <br></p>
