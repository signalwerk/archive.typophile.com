    html: '<p>In my mail on Saturday I received the recent issue of _Printing History_. Having just opened the package, image my surprise when I see that the entire issue is dedicated to ATF and includes a showing of the exhibition "Type to Print: The Book &amp; The Type Specimen Book." Based on the significant holdings of the ATF library, which is now housed at Columbia University. <br> <br>Revealed here is the cost of the 1923 specimen book. 60,000 copies were issued at a production cost of $300,000. <br> <br>Gerald</p>'
