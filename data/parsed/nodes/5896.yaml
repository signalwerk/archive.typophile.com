    html: <p>Kent <br> <br>The copyright on the ATF specimen book would only have been valid for 28 years, with the possibility of extending it for another 28 if ATF chose to do so. They did issue a much slimmer specimen book in the fifties, their last. <br> <br>Copyright is not the concern. And I'm not sure if patents were ever successfully extended to metal type designs. I know copyright could not be. <br> <br>The copyright law does not cover reproduction rights in entirety though, does it. Copyright law more specifically protects intellectual and creative rights, not design elements. Nothing is ever "clearly" in public domain. The remote possibility of existing trademarks and registration legalities are more of a concern here. These would pass on to those parties who acquired the assests of the firm. Much as your logo there (nice by the way) if trademarked and/or registered, would legally pass on to your heirs, with full rights and protection under the law. <br> <br>It wouldn't really matter in the eyes of the law that Graham has provided an "admirable service" if someone who had the legal right to challenge his efforts chose to do so.  <br> <br>Gerald</p>
