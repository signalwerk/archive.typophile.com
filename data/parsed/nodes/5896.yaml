    html: <p>Kent <br> <br>Very thoroughly reasoned. I guess my initial reaction was to the idea that you can just reproduce whatever you want simply because it is no longer copyrighted and I was trying to point out there may be other factors to consider.  <br> <br>In a book I did a while back we had to enter hyphens in the names of characters used by Kipling in his Just So Stories because we discovered a famous movie producer had trademarked the names for toy marketing. Our legal advice was to copyright the hyphens as "additional material." Kipling's work was certainly in public domain but there was also a Kipling Museum trust which still owned certain properties.  <br> <br>What am I saying is you can't be too careful, and you can be at considerable risk. If you run a small business, a cease and decease or any other kind of legal threat could quickly drain your financial resources and put you out of business, whether or not the threatening action had legal merit. You would have to prove otherwise and that is costly. If you are doing anything of a "publishing" nature you do need to run this all through legal search (trademark, copyright, etc). <br> <br>Thanks for the information.</p>
    html_clean: <p>Kent <br> <br>Very thoroughly reasoned. I guess my initial reaction was to the idea that you can just reproduce whatever you want simply because it is no longer copyrighted and I was trying to point out there may be other factors to consider.  <br> <br>In a book I did a while back we had to enter hyphens in the names of characters used by Kipling in his Just So Stories because we discovered a famous movie producer had trademarked the names for toy marketing. Our legal advice was to copyright the hyphens as "additional material." Kipling's work was certainly in public domain but there was also a Kipling Museum trust which still owned certain properties.  <br> <br>What am I saying is you can't be too careful, and you can be at considerable risk. If you run a small business, a cease and decease or any other kind of legal threat could quickly drain your financial resources and put you out of business, whether or not the threatening action had legal merit. You would have to prove otherwise and that is costly. If you are doing anything of a "publishing" nature you do need to run this all through legal search (trademark, copyright, etc). <br> <br>Thanks for the information.</p>
