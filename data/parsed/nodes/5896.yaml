  html: "<p>I've been giggling all throughout the holidays waiting until I could post this. GUESS what fell into my lap <br> <br>Clue 1) the only date I could find was 1912, pre-ISBN's here. <br>Clue 2) This company closed in the 1930s <br>Clue 3) 1096pgs of cast-type average sets priced at $3.50 <br> <br>A friend found it at a library garage sale picked it up for 25 cents and brought it over thinking I'd be interested. His boss is googling over it too and has entertained the idea of re-printing it not as a working catalogue but for collectors. I suggested that that was blasphemy, not to mention the impossibilities of re-printing it to any collectors stardards. Still whats your take guys? <br> <br>I've scaned a few select pages for ya'll: <br><a href=\"http://www.phivedesign.com/ATF/ooo.html\" target=\"_blank\">www.phivedesign.com/ATF/ooo.html</a> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/4198.jpg\" alt=\"book\"></p>"
