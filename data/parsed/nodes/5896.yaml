    html: <p>Paul <br> <br>I'd say yes, copyright is for intellectual property, the sequencing of letterforms, not their visual representation. <br> <br>But trademark can actually be both. If I use the term Adobe Systems in a book I am required to either indicate trademark or print a disclaimer regarding trademark. One would not have to follow this in most cases, in discourse intended for a public audience, such as reviews or criticism, as Adobe is a recognized public name and has, in fact, sought that out.  <br> <br>But I can also not copy the visual representation of the Adobe logo without their permission, whether or not I intend to use this for commercial purposes, and I believe this is where your post may be in error. <br> <br>Registration of name is more tricky because it can be legislated by state.</p>
