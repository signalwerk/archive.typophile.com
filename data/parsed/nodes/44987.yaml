      <p>to be fair, the image was created by myself using a fan-made font (NOT made by myself) that only had the letters contained in "Squaresoft" for lowercase and a mangled runic mt condensed for the uppers. that being said, yes, the O and Q are supposed to be circular, but the fan font was apparently made more poorly than i had anticipated. the actual logo that appears on their graphical materials is so much cleaner than this.</p>
      <p>unfortunately, none of the fonts you suggested quite match up to the 'R,' 'E,' and 'F' that to me is probably the visual trademark of the font. my very first research long ago turned up one of the "futura" family as a possible base, but that was a dead end as well.</p>
