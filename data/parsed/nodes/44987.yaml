      <p>First off this is a hideous logo. </p>
      <p>That aside, it's obviously a mangled font, a bold geometric sans probably. I suspect along the lines of Trade Gothic, Franklin Gothic, News Gothic or Basic Commercial. It's hard to say exactly since every letter was altered, then skewed and smooshed. It's also possible that the Q and O are just circles and the A a triangle, all of which were not part of the base font.</p>
      <p>Aside from the atrocities this poor font was put through, I'm impressed a game developing powerhouse would have kept and continued to use this logo for any amount of time. Then again, it was probably made by the president's daughter.</p>
