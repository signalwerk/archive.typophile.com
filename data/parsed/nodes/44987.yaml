    <p></p><div class="imageWrap"><img src="http://typophile.com/files/squaresoft_2_3578.png"></div><p></p>
    <p>hi there. square-enix (japan-based videogame company) used to be known as square co, producing games primary under the label "squaresoft" (most of the time logo's on one line).</p>
    <p>what is the font used for this logo? the logo for "square" is the same minus the "soft;" both had the triangle area under the 'A' filled with red. if this is a completely custom font, who designed it and where can i buy it? if this is a modification of an existing font, what was the base font? if it was simply some vector/postscript logo made in illustrator, coreldraw, or some other vector art app, i'd be disappointed but at least i'll be glad to find out from where this logo came. i personally think it started out NOT italicized, but that's just my opinion...</p>
    <p>(the intended usage is for one of my logos)</p>
