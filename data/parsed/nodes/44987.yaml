      <p>thanks lex for finding the actual logo. hopefully ppl will be able to get a better idea of what square originally intended (i guess).</p>
      <p>an update on my latest research into it: i contacted square-enix usa's marketing dept to see if they could point me to the original designer. the woman i spoke to said the japanese office might know. given that i neither speak nor understand even close to enough japanese to carry on a convo w/SE japan, i asked her to forward my request and contact info to them. i have yet to hear back from either office.</p>
      <p>as for the current square-enix logo, after WhatTheFont-ing it, i found out it's basically a mod of either bank gothic bt or banque gothique rr (either way, it's a mod; the Q and the E are the proof). i'm not really in the mood to use bank gothic for anything special, but still, one down, one to go...</p>
      <p>alex.rosario<br>
      apollolux.digital.designs</p>
