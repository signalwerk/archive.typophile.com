      <p><em>Ascender Corporation announced a new licensing program for font software implementations with server-based applications. This new program addresses the limitations with standard end user font licenses. The Ascender Server Font License program grants organizations the right to install fonts on a server for use with an application that can be accessed by an unlimited number of users. The server license is available for either internal use (i.e. an Intranet within an entity), or external use (for Internet-based applications).</em></p>
    <p>Elk Grove Village, IL — June 28, 2007 — Ascender Corporation, a leading provider of fonts for hardware &amp; software developers, today announced a new licensing program for font software implementations with server-based applications. Currently the standard end user font license restricts usage to personal computers and prevents fonts from being used on servers. Companies that are implementing server-based applications, whether on Intranets or on the Internet, now have an extensive collection of fonts to choose from to enhance their applications.</p>
    <p>The Ascender Server Font License program grants organizations the right to install fonts on a server for use with an application that can be accessed by an unlimited number of users. The server license is available for either internal use (i.e. an Intranet within an entity), or external use (for Internet-based applications).</p>
    <p>“We have established a reputation as the font problem solvers, and this includes not only designing and developing fonts, but also addressing the licensing challenges that our customers experience” said Steve Kuhlman, Vice President of Ascender Corporation. “Many of our customers need to deploy fonts on multiple operating systems, and on servers with applications that are used on intranets and extranets. Our new server-based licenses makes it easy for everyone from enterprises to software developers to access a vast selection of high quality, multilingual fonts for their applications” he added.</p>
    <p>Ascender has licensed fonts to a wide variety of companies around the world for use on different platforms. The following are examples of a few of the server-based applications that use fonts licensed from Ascender:<br>
    - PDF generation applications<br>
    - Web-based printing services<br>
    - Airline reservation system<br>
    - Online greeting card application<br>
    - Financial reporting system</p>
    <p>Ascender offers an extensive collection of original type designs as well as popular fonts licensed from Microsoft Corporation and others. This includes a broad set of multilingual and Unicode-encoded fonts that enterprises demand for deployment of mission-critical applications. Ascender can provide fonts in TrueType and OpenType font formats, as well as customized font formats and encodings.</p>
    <p>For more information please contact Steve Kuhlman, or visit the Ascender website: <a href="http://www.ascendercorp.com/fontlicensing.html" title="http://www.ascendercorp.com/fontlicensing.html">http://www.ascendercorp.com/fontlicensing.html</a> </p>
    <p>About Ascender<br>
    Ascender® Corporation is a leading provider of advanced font products specializing in type design, font development and licensing. Ascender’s founders are font industry experts and have been involved in developing some of the most important and influential fonts used in computers and mobile devices. Ascender provides multilingual, custom font development for a wide range of customers including creative professionals, enterprises and hardware &amp; software developers. Ascender also provides fonts for download to graphic designers and consumers through the Ascender Font Store website.</p>
