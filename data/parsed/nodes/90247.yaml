      <p>Since the OP has an answer...</p>
      <p><cite>I don't think any vendor will allow you to modify their fonts</cite></p>
      <p>Why wouldn't they? They've been paid for their work. I've found that most of the useful publishers will allow it, if you ask permission. Not for redistribution, of course, unless it is work published under one of the open source licenses.</p>
      <p>I'm aware I've just called several publishers useless... YMMV.</p>
