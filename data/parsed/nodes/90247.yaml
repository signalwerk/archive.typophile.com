  html: |-
    <p>A client requested that some changes to be made to several glyph in an arabic font. I used Fontographer 5 to make the changes. The font i generated works satisfactorily in InDesign ME but wouldn't work in MS Word.</p>
    <p>For the time being, this is fine. But i'd like the font to work in both Adobe and MS Word. Now, i did some reading on this forum to know that i need to have OpenType Layout Table working with the font. Since the changes i made to the original glyphs are minimal, is there any way i can extract the table from the original font and compile it with the new one?</p>
    <p>If i'm doing this wrong, could anyone point me to the right way to do this?</p>
