    html: <p>I use illustrator all of the time for 2-sided simple things. Before Indy (why I now use), Illustrator became my goto app. I realized that while I had preached to my students that they should reserve illustrator for illustrative things and then put it all together in Quark .... well I realized a few years ago that I hated doing type in Quark. I mean it is possible but I found that type is much easier to do in Illy. When Indy came along I started using it when the items I designed required more than 2 paragraphs of type. But, I still find myself using Illy for Book Jackets and single page ads.</p>
