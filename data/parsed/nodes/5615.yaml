  date_raw: 14 Jul 2004 — 3:27am
  votes: null
  html: <p>Just a quick note to say I'm currently designing stuff with  <br><a href="http://store.adobe.com/type/browser/P/P_1715.jhtml;storesessionid=LWLTXTYWH1WTXQFI0IKBT44AVDJBKIV2" target="_blank"> Adobe Jenson Pro OpenType</a> (alongside Heine's <a href="http://www.emigre.com/EF.php?fid=87" target="_blank"> Dalliance</a>,  <br>sadly no OT version available) in <a href="http://store.adobe.com/products/indesign/main.html" target="_blank"> InDesign CS</a> and it feels <br>GOOD! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>At last we've come to a point where desktop graphic design  <br>and typography veers away from glorified typewriter stuff to  <br><i>true</i> typesetting, and best of all it's effortless and intuitive. <br> <br>All right, back to work, move on, there's nothing to be seen here. <img src="http://www.typophile.com/forums/clipart/bigsmile.gif" border="0"></p>
  html_clean: <p>Just a quick note to say I'm currently designing stuff with  <br><a href="http://store.adobe.com/type/browser/P/P_1715.jhtml;storesessionid=LWLTXTYWH1WTXQFI0IKBT44AVDJBKIV2" target="_blank"> Adobe Jenson Pro OpenType</a> (alongside Heine's <a href="http://www.emigre.com/EF.php?fid=87" target="_blank"> Dalliance</a>,  <br>sadly no OT version available) in <a href="http://store.adobe.com/products/indesign/main.html" target="_blank"> InDesign CS</a> and it feels <br>GOOD! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>At last we've come to a point where desktop graphic design  <br>and typography veers away from glorified typewriter stuff to  <br><i>true</i> typesetting, and best of all it's effortless and intuitive. <br> <br>All right, back to work, move on, there's nothing to be seen here. <img src="http://www.typophile.com/forums/clipart/bigsmile.gif" border="0"></p>
