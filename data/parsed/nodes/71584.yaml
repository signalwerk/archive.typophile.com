    html: '<p>I had a quick look at Brinhgurst this morning and he wrote that Gill Sans old style figures were produced "privately" and not by Monotype. Martin Majoor, in his site (<a href="http://www.martinmajoor.com/6_my_philosophy.html">http://www.martinmajoor.com/6_my_philosophy.html</a>), states that "Eric Gill never made them for his Gill Sans (although in the 1990s they were added by Monotype)". So: if neither Gill nor Monotype designed them, who made them?</p>'
    html_clean: '<p>I had a quick look at Brinhgurst this morning and he wrote that Gill Sans old style figures were produced "privately" and not by Monotype. Martin Majoor, in his site (<a href="http://www.martinmajoor.com/6_my_philosophy.html" class="link-external">http://www.martinmajoor.com/6_my_philosophy.html</a>), states that "Eric Gill never made them for his Gill Sans (although in the 1990s they were added by Monotype)". So: if neither Gill nor Monotype designed them, who made them?</p>'
