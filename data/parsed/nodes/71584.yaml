    html: "<p>Interesting - didn't know that a \"Pro\" version (with old style numerals and small caps) of the good old Gill Sans was available. But a question comes to mind: was the original metal typeface designed by Eric Gill and released by Monotype in late 1920s available with old style numerals? I don't think I have seen them anywhere before.</p>"
