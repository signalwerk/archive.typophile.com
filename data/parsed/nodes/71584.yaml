      <p>I have a <em>Scotsman</em> calendar from the 1930s set in Gill with the oldstyle figures.<br>
      I don't have it in front of me, but I suspect that the digital oldstyle figures aren't exactly the same: the one and zero may have been "improved". But I do like the 3 and 5!</p>
