    html: |-
      <p>I checked the book (Josef Müller-Brockmann, Ein Pionier der Schweizer Grafik) and Florian's reading of the small text is correct. (Except they spelled «lithographie» with «ph» back then, and I'm not sure if there's a period or comma in the middle, in case that matters.)</p>
      <p>And, yes, this is one of the many many examples from the heyday of the Swiss style that use Akzidenz Grotesk. I'm sure the weights differ at least slightly from the digital versions, but Linotype AG Bold doesn't seem very far away from this, no?</p>
