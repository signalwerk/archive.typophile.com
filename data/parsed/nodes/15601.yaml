      <p>I did the Information Design MA at Reading in 2003–04, which was great.<br>
      It's very rigorous and challenging. I saw this year's work and it was also really good. I think Reading generally is a great place to study. </p>
      <p>I suppose it depends what you want from a graphic design education. There is definitely a Reading way of understanding and doing design – well reasoned, logical – which I have found very useful.</p>
