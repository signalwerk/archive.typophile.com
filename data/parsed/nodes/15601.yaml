    html: "<p>I am currently enrolled in LCC on the MA graphic design course which is one year. I think the strength of the course comes from the department itself. The tutors are very knowledgable and the course is well structured and quiet flexible in the sense that you do what interest you. The disadvantage though is that it's a one year course which means you really don't find the time to digest the information. very intense... and there is not really an emphasis on typography but you can always choose the direction of your projects. Check out the tutors: Paul Mc Neil (type designer), Russel Bestley (wrote few design books with Ian noble), Tony credland (designer/activist and founder of cactus network) and Wayne dayley (designer). i applied to many courses before choosing this one; check out reading university <a href=\"http://www.rdg.ac.uk/AcaDepts/lt/\" title=\"http://www.rdg.ac.uk/AcaDepts/lt/\">http://www.rdg.ac.uk/AcaDepts/lt/</a> if you are interested in typography it is the best, although it's a 2 year course, another interesting course: <a href=\"http://www.designacademy.nl/\" title=\"http://www.designacademy.nl/\">http://www.designacademy.nl/</a> bordering design if you are fed up...</p>"
    html_clean: "<p>I am currently enrolled in LCC on the MA graphic design course which is one year. I think the strength of the course comes from the department itself. The tutors are very knowledgable and the course is well structured and quiet flexible in the sense that you do what interest you. The disadvantage though is that it's a one year course which means you really don't find the time to digest the information. very intense... and there is not really an emphasis on typography but you can always choose the direction of your projects. Check out the tutors: Paul Mc Neil (type designer), Russel Bestley (wrote few design books with Ian noble), Tony credland (designer/activist and founder of cactus network) and Wayne dayley (designer). i applied to many courses before choosing this one; check out reading university <a href=\"http://www.rdg.ac.uk/AcaDepts/lt/\" title=\"http://www.rdg.ac.uk/AcaDepts/lt/\">http://www.rdg.ac.uk/AcaDepts/lt/</a> if you are interested in typography it is the best, although it's a 2 year course, another interesting course: <a href=\"http://www.designacademy.nl/\" title=\"http://www.designacademy.nl/\">http://www.designacademy.nl/</a> bordering design if you are fed up...</p>"
