    html: |-
      <p>Any number of fonts have vowels with macrons above. I don't believe I've ever seen one with precomposed vowels with macrons below -- not even sure they are encoded in Unicode. R &amp; L with macrons below, yes, for transliterated Devanagari (Latin Extended Additional), but not, I think, macrons below.</p>
      <p>So your best bet is to pick an Adobe OpenType font, or one from a foundry that allows end-user modification, make up the combining macron below, then make up the vowel with the macron below. If I'm right &amp; it isn't encoded in Unicode, don't give it a Unicode value, just write a ccmp feature so the vowel + combining macron below calls your character.</p>
      <p>This only works with OpenType savvy applications programs like InDesign. If you are going to use a Type 1 font &amp; typesetting program, make up the characters needed, &amp; lie about their names -- for instance, put one set in the spot where vowels with umlauts (aka dieresis) normally go, and pick another accented vowel for the other -- the grave, maybe? To set them, you will have to type (e.g., set) the umlauted vowel etc. but using your special font. Further use (aside from printing) of the typeset file will not be possible without editing, because you've called the "wrong" character.</p>
      <p>Otherwise, you will typeset very slowly, using the plain vowels and the regular macron character hand kerned (&amp; lowered for the macron below).</p>
