  html: |-
    <p>Hello everyone,</p>
    <p>I am working on a Japanese show for a museum and I was hoping that a few of you might be able to offer up a few suggestions. I am getting ready to typeset the brochure and I need a beautiful, legible, serif typeface that includes the macron (A macron, is a diacritic ¯ placed over or under a vowel.) I need the o and the u to have this option. </p>
    <p>Surprisingly, most do not include them. Thank you in advance for your suggestions.</p>
