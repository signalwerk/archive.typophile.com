  - id: 276032
    user: 18406
    date: 2008-04-30T18:52:00
    date_raw: 30 Apr 2008 — 6:52pm
    votes: null
    html: <p>To be consistent with the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Hepburn_romanization" rel="nofollow">Hepburn romanization standard</a>, I would resist any suggestions to put the macron under the vowel. Sometimes it's done by adding an underline to those letters as a way of avoiding actual diacritical marks, but that is a typographical hack. Most fonts from the last 10 years have ā, ō, &amp; ū. I imagine one would have to know what the show was before font recommendations could be made.</p>
