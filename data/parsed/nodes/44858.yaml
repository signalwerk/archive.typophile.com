      <p>A quick go-through gives me additional possibilities like Arno Pro, Bodoni/Didot (interestingly, my version of Bodoni includes ȳ, while Didot does not), Brioso Pro (not really a serif), Cambria, Adobe Caslon Pro, Century, Chaparral Pro, Constantia, Adobe Garamond Pro, Hoefler Text (albeit with an odd, semi-rounded macron that looks strange), Adobe Jenson Pro, Palatino, Trajan, etc.</p>
      <p>As Theunis said, any Adobe Pro face should have at least the five basic vowels with macron above.</p>
