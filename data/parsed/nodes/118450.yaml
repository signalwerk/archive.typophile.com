    html: |-
      <p>Thanks very much for the lead to Boutique.<br>
      I've poked around the web and see the Boutique font on the Milieu Grotesque website:</p>
      <p><a href="http://www.milieugrotesque.com/typeface-boutique" title="http://www.milieugrotesque.com/typeface-boutique">http://www.milieugrotesque.com/typeface-boutique</a><br>
      <a href="http://www.milieugrotesque.com/assets/specimen/Boutique-MG-Specimen.pdf" title="http://www.milieugrotesque.com/assets/specimen/Boutique-MG-Specimen.pdf">http://www.milieugrotesque.com/assets/specimen/Boutique-MG-Specimen.pdf</a><br>
      Designed by Timo Gaessner, released in 2012.<br>
      This site also sells products:<br>
      <a href="http://www.milieugrotesque.com/products" title="http://www.milieugrotesque.com/products">http://www.milieugrotesque.com/products</a></p>
      <p>Also on Fontdeck:<br>
      <a href="http://fontdeck.com/about/foundries" title="http://fontdeck.com/about/foundries">http://fontdeck.com/about/foundries</a><br>
      Fontdeck is a web font service which enables font foundries and type designers to license their fonts for use on websites the world over. We take away all the technical hassle for foundries and make the service really easy for web designers to use.</p>
      <p>In effect designers rent fonts from Fontdeck. We host the font files on our own servers and web designers link to those files in order to display the fonts on their website.</p>
      <p>Fontdeck is a curated marketplace, bringing high quality fonts to the widest possible audience. We’ve created a level playing field, where independent typeface designers could compete easily with large foundries, and set prices themselves.</p>
