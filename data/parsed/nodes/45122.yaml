    <p><a href="http://www.flickr.com/photos/ebensorkin/sets/72157604955393401/" title="http://www.flickr.com/photos/ebensorkin/sets/72157604955393401/">http://www.flickr.com/photos/ebensorkin/sets/72157604955393401/</a></p>
    <p>Images of the Original 15th C Subiaco type as distinguished from the revival (UK) Ashendene version. These image come from Cicero &amp; St. Augustine (pre 1465 &amp; 1467) in reproduction ( hence the dots ) taken of the Book "The Ashendene Press" by Colin Franklin. This is a marvelous book in many many ways. Highly recommended.</p>
    <p>What is interesting about these images is that they show plenty of contextual alternates being used, and they are very very obvious. Just to get started have a look at the "ra" and "ta" and then look at an "a" in another context.</p>
    <p>These special sorts stopped being used eventually and the standard a became the one used in the "ra" combination with the top pulled way back - a decidedly less good looking if more practical arrangement.</p>
    <p></p><div class="imageWrap"><img src="/files/Subiaco_5002.jpg"></div><p></p>
