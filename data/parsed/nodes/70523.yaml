    <p>Hi, hi, thrice hi.</p>
    <p>New member here, and my first post so here goes. I can find any number of articles about generic typography subjects such as terminology, basics about serifs v sans serifs and the like, and then again I can find lots of detailed tutorials about using software like InDesign, but I can't find any good resources about the combination of typography as applied in document design.</p>
    <p>Put another way, I'd be very interested in seeing some examples, guidelines, rules of thumb etc. specifically relating to the design of business documents that are readable and functional but a step away from the dreaded Micro$oft Word template sort of documents.</p>
    <p>Between the basics on typography and the complexity of a magazine layout there has to be something about excellent design of documents such as letters, reports (annual reports as well as topic focused reports), questionnaires and manuals (policy documents, procedures, etc.). Any ideas out there people?</p>
    <p>If not, then is anyone interested in making this thread something of a reference of the good, bad and indifferent in designing superior business documents?</p>
    <p>Love the forum and look forward to hearing some comments back!</p>
