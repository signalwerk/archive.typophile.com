      <p>Extracting the fonts might or might not be illegal and/or unethical. But <em>redistributing</em> the fonts might very well be both. For one thing, I think Linotype (so now Monotype) still owns the rights. So I think you <em>could</em> get in trouble, especially in Europe. And not getting in trouble doesn't necessarily make it OK...</p>
