      <p>i'd hate to assume, but in this case since the page linked seems to indicate that there's no license for it and that it was made into digital format for preservation, you can use the link also provided to download the files &amp; use them. no?</p>
      <p>"In 1992, a year before the bankruptcy in 1993, had the H. Berthold AG, the original 1950s metal type or hand-set version of the Palatino, which was sold in the 1960s as Diatype font disc and Diatronic font support yet quickly converted into PostScript Type 1 fonts. This Berthold Palatino 1992 (= Palatino 1950) in the PDF file Pala92.pdf (7 pages, 280 KB) is documented, which can also be downloaded as zipped PostScript printer file Pala92ps.zip (1.5 MB)"</p>
      <p>edit: provided of course, that you have the software and ability to use the .ps file that is there</p>
