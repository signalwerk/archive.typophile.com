      <p>Wow -- you all are truly incredible -- thank you defiantone, Josef, gargoyle, and Uli so much for your help -- </p>
      <p>I am a total novice, and I have a couple of follow up questions --</p>
      <p>1) Uli, when you say that the pdf has the font files, does that mean that I can extract the font from the pdf and use it? I imagine so, but I didn't know that was possible, so I just wanted to check.</p>
      <p>2) Would there be legal issues with me extracting the font and using it for a commercial product? I imagine so.</p>
      <p>3) Is there any way for someone like myself to buy the license for a font such as this one that isn't currently put being sold through regular channels?</p>
      <p>Thanks again all for your help.</p>
