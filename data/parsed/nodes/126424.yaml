    <p>Hi,</p>
    <p>I am at a loss to determine the font which was used for this logo. I am looking for the ‘Canada’ and ‘at the market’ font. I have tried the font matcher on this site, the ‘Match Font’ tool in photoshop, and extracting the font name in the ‘properties’ when I open a pdf of the file in Adobe Acrobat. All versions of the file I have, the font has been converted to outlines.</p>
    <p>Any other tips or tricks? This logo would have been designed around 2009. Trying to find out who designed it, but corporate memory is a bit lacking.</p>
