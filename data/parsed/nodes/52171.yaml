    <p>Hi all, first post — thanks in advance for your critique. </p>
    <p>Hoping for some final feedback for my company’s identity before I lock it down for stationary, website, etc... I’ll hold off on divulging the intended concept so I don’t bias anyone’s feedback. To give some context — I am an aspiring industrial designer and currently work as an interaction designer/photographer. </p>
    <p>Also, any suggestions for additional fonts to include in my short list for collateral would be great. </p>
    <p>Thanks,</p>
    <p>-C</p>
