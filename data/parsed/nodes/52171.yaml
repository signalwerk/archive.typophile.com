      <p>thanks for the replies. </p>
      <p>@ Ratbaggy - good point I will try to harmonize the geometry. Thanks I’m happy to start to hear at least somebody likes the logotype LOL. </p>
      <p>@ jpolo - the only letter to which i added slabs from the original typeface is the “w”. That “k” is stock, although I agree that it’s just not right. like it almost was stuck on. Any ideas?</p>
      <p>@maxticket - creating the “k” has been terrible — the original EF Dynamo “k” as well as the original “ftw” relationship are way off very weird negative space going on. To Bert’s point about leaving the typeface alone, the relationship between those letters is a dealbreaker for the stock typeface so something has to be done about them. The “k” from my original concept was my best attempt at a harmonious serif k — but I think it creates too much of a jagged look and weird direction. I’ll see if I can harmonize with the new concept. And also I like your point about the “C” although do you think the descender of the “t” will harmonize if it loses that relationship?</p>
