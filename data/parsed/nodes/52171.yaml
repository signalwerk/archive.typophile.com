      <p>The eye is totally interrupted by the f t ligature. Basically this is Rockwell on speed – ditch the  non slab-serif stuff. Coming late to this conversation and seeing where you started I have this to say: originally there was a forward ( left to right) movement of the slab serif. While overboard it’s now gone; the “C” and the “w” contain it, and to some extent the “o”. It now comes to a dead halt in the “r” and “k”. </p>
      <p>The reader must still move forward at the end of the word– it  should be sold to the client as “forward thinking” yet “traditional” - as indicated by the meaning implicit in the word. </p>
      <p>Go back somewhat to your original ideas. Best of Luck.</p>
