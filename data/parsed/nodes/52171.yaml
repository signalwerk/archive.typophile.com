      <p>Ok here’s a revision. </p>
      <p><a href="http://farm4.static.flickr.com/3032/3069105547_59e82f43c5_o.jpg" title="http://farm4.static.flickr.com/3032/3069105547_59e82f43c5_o.jpg">http://farm4.static.flickr.com/3032/3069105547_59e82f43c5_o.jpg</a></p>
      <p>In this revision I returned the “C” to the original (which adds harmony to the “t”), changed the ascender of the “f” a bit, used the original “w” (Avante Garde), and toned down the serifs which helped overall. I still don’t like the k. Honestly this combination of letters looks horrible in just about any typeface. Here’s a snapshot of the logo with the Avante Garde “k” to give an idea of what the letterform would look like untouched. Any advice? </p>
