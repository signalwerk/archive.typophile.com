    html: <p>John <br>Years ago Chank posted this on his site at  <br><a href="http://www.chank.com/howto/index.php" target="_blank">http://www.chank.com/howto/index.php</a> <br>these are instructions on how to make a font and makes use of Fontographer, Photoshop and Illustrator. You could do the same with Type Tool 2 and Scan Font, but you will get the idea of how to do things from Chank. A bit wacky, but he started a lot of stuff which people still look at.</p>
