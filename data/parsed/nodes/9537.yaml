  html: <p>Hi, <br> <br>Was wondering if anyone knew of a process i could go thru that will allow me to change a vector file of a full alphabet that i have created in Adobe Illustrator 10 into a true type font. Any feedback would be greatly appreciated. <br> <br>J</p>
  html_clean: <p>Hi, <br> <br>Was wondering if anyone knew of a process i could go thru that will allow me to change a vector file of a full alphabet that i have created in Adobe Illustrator 10 into a true type font. Any feedback would be greatly appreciated. <br> <br>J</p>
