    html: "<p>John,  <br> <br>TypeTool 2 and ScanFont 4 for Mac from Fontlab Ltd. (<a href=\"http://www.fontlab.net\">http://www.fontlab.com</a> ) should do the trick for you. ScanFont 4 will open an EPS/AI file and automatically separate the letters into separate glyphs, and export it to TypeTool 2, which you can use to build the TrueType font. There's a ScanFont+TypeTool pack for Mac for $199:  <br><a href=\"http://www.fontlab.net/?/Font-utilities/FontLab-Quickshop/\">http://www.fontlab.com/Font-utilities/FontLab-Quickshop/</a> <br>Of course, you can choose to get FontLab 4.6 instead of TypeTool 2, but that would be much more expensive <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>"
    html_clean: "<p>John,  <br> <br>TypeTool 2 and ScanFont 4 for Mac from Fontlab Ltd. (<a href=\"http://www.fontlab.net\" class=\"link-external\">http://www.fontlab.com</a> ) should do the trick for you. ScanFont 4 will open an EPS/AI file and automatically separate the letters into separate glyphs, and export it to TypeTool 2, which you can use to build the TrueType font. There's a ScanFont+TypeTool pack for Mac for $199:  <br><a href=\"http://www.fontlab.net/?/Font-utilities/FontLab-Quickshop/\" class=\"link-external\">http://www.fontlab.com/Font-utilities/FontLab-Quickshop/</a> <br>Of course, you can choose to get FontLab 4.6 instead of TypeTool 2, but that would be much more expensive <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>"
