      <p>It's called the reference point. There's a whole page about it in the manual. You can change the coordinates by dragging it. You can also command-click (control-click for Windows) on it and a little window pops up that you can type coordinated into.</p>
      <p>There is probably a way to reset the reference points of all glyphs to 0,0 but it's a bit beyond me how exactly to do it.</p>
