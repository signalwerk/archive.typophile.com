    html: |-
      <p>I may be wrong, but I believe that the reference point is not part of an exported font, but is only used (optionally) within FontLab as a reference for operations like rotation. </p>
      <p>If you export the font and then re-open it, you will see that FontLab puts all the reference points in at 0.0 . </p>
      <p>In other words, unless you are using it as a reference point in an operation--such as an instruction to rotate around the reference point--you can forget about it.</p>
