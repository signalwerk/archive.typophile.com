    html: |-
      <p>&gt;note to self</p>
      <p>I kept moving it back to 0.0 for months until one day I asked myself, why the heck am I doing this? </p>
      <p>This illustrates a pet gripe about the FontLab manual. It tells you that the reference point is useful for a symmetrical letter--though I'm not sure why as you have the option of rotating etc relative to the center of the selection--but doesn't tell you that it's only of any use in restricted situations. Basically, you have to figure out how its functionality or lack of functionality fits into the job of developing a typeface. A manual ought to give the user more guidance on this. </p>
      <p>Also because you never need to use it at 0.0 it makes more sense for it not to be always on the glyph window, but rather to be inserted optionally when you want it, at a desired rotation center, etc.</p>
