      <p>This is the macro I use in order to reset the reference point:</p>
      <p><code>#FLM: reset rpoint<br>
      <code>from FL import *<br>
      <code>f = fl.font<br>
      <code>for i in range(len(f)):<br>
      <code>&nbsp;&nbsp;f[i].rpoint = Point(0,0)<br>
      <code>fl.UpdateFont()<br>
      </code></code></code></code></code></code></p>
    html_clean: |-
