  html: "<p>I am working on a logo that has two words in it, both starting with the letter \"S\". While I can't disclose the name, it is in the entertainment industry (film, interactive, gaming, etc.). I need to make it look \"cutting edge, modern, smooth, efficient.\" Fonts that come to mind include: Bank Gothic, Neo Sans, Klavika, Square 721. So far no luck using these. Could you please give me input on fonts that fit the above criteria? Thanks!</p>"
  html_clean: "<p>I am working on a logo that has two words in it, both starting with the letter \"S\". While I can't disclose the name, it is in the entertainment industry (film, interactive, gaming, etc.). I need to make it look \"cutting edge, modern, smooth, efficient.\" Fonts that come to mind include: Bank Gothic, Neo Sans, Klavika, Square 721. So far no luck using these. Could you please give me input on fonts that fit the above criteria? Thanks!</p>"
