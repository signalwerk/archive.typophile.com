      <p>If you are prepared to consider the ancient Bank Gothic and Square 721 (Microgramma) as modern, how about <a href="http://new.myfonts.com/fonts/agfa/itc-eras/" rel="nofollow">Eras</a>?</p>
      <p>Do you think the experimental <a href="http://www.shinntype.com/morphica.html" rel="nofollow">Morphica</a> (which has an interesting "S") is cutting edge, or passé deconstruction?</p>
