    date: 2010-10-27T01:42:00
    date_raw: 27 Oct 2010 — 1:42am
    votes: null
    html: "<p>Thanks for answering. Eras, to me, is too friendly to be considered modern. I looked at Morphica and, IMHO, it tries too hard to be modern and thus becomes self defeating. A few others I've considered: Convection, Soho Gothic and Oblik Bold. Others I looked at but didn't use were Proxima Nova, Conduit, Din Next, Etelka, Euphoric, Pill Gothic, Fago, Fedra, Gotham, Interstate, Politica and Unit. I've run the gamut of modern sans serifs. If there are others worth a look, please feel free to mention them.</p>"
