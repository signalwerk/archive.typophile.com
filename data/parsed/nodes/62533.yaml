    <p>I realize that the typefaces for this are custom made, but anything similar would be appreciated as this is the style that we are looking for.</p>
    <p>As the logo images are white over transparent PNG files (which may be difficult or impossible to see) I am linking to the actual location.</p>
    <p><a class="freelinking external" href="http://www.shangri-la.com/" rel="nofollow">http://www.shangri-la.com/</a></p>
    <p><a class="freelinking external" href="http://www.shangri-la.com/en/property/vancouver/shangrila" rel="nofollow">http://www.shangri-la.com/en/property/vancouver/shangrila</a></p>
    <p>In my own research, the closest font that I have come across is Connach and Connach Historic.</p>
    <p>Any help, tips would be appreciated. Thank you!</p>
