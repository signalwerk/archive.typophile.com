    <p>I realize that the typefaces for this are custom made, but anything similar would be appreciated as this is the style that we are looking for.</p>
    <p>As the logo images are white over transparent PNG files (which may be difficult or impossible to see) I am linking to the actual location.</p>
    <p><a href="http://www.shangri-la.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.shangri-la.com/</a></p>
