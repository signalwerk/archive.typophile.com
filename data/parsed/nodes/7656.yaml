  html: |-
    <p>My friend Harold Lohner has been looking into some typefaces used by Hitchcock in his films, as possible candidates for being digitized. (He has already done gaumont and gainsborogh, from the 39 steps and the lady vanishes respectively). He asked if I could tell him if this type has already been digitized, and as far as I could find the answer seems to be no. <br> <br>Do any of you recognize this type, and do you know if it exists as a font? <br> <br>Notice the stemmed U, the curved T crossbar (not so obvious in this sample), the pointed M, and the Optima-like unevenness of the strokes. It is not Optima or Stellar, which were the closest things I could see. I have more samples from him, if you need them. This one shows the best sample of letters. <br><img src="http://www.typophile.com/forums/messages/83/53408.jpg" alt="Titling from The Birds"></p>
