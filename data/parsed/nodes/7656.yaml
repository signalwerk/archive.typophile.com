    html: <p>Thanks Ignacio. That's actually closer than most Sans faces I found, but it's still not the same typeface. I also noticed, while looking at Arnholm Sans in Phil's book that <a href="http://www.myfonts.com/fonts/bitstream/lydian/" target="_blank">'Lydian'</a> is rather close, in such letters as U, G and M, but the R is wrong and the strokes are simpler (to state the most obvious features). <br> <br>Anyone else? Yves? Going twice...</p>
