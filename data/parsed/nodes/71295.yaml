      <p>I never understood the reason why shirt fonts always have to look like that…<br>
      Although I have to admit that the alternative lc a of the adidas font looks neat (see the pic Northbay posted)!<br>
      And why puma seems to prefer all lower case on their jerseys. It looks feeble and meek next to an all caps shirt.</p>
      <p>Plus the adidas font lacks a capital eszett, no? Since name setting is one of the best reasons for its existence in the first place. Remebering the terrible HÄßLER shirts…</p>
      <p>I agree that the overall look of the jerseys is much better this year but as far as type is concerned they’re still third division!</p>
