      <p>I'm not a fan of the Adidas font, but I must say, to my surprise, that their numbers are the most legible of the bunch: it's light enough, and tracked loosely enough to work from a distance. Those extra hooks on 'E' and 'e' and so on I'm not a fan of. </p>
      <p>But as numbers go, others have made too narrow, heavy and tight versions.</p>
