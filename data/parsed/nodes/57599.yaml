    <p>hi,</p>
    <p>i have been asked to give a short presentation about william caslon. since it is gonna be just ~10mins, i was thinking about showing mostly pictures of his works.</p>
    <p>i already had a look at all the online material but was wondering if any of you guys might have offline material like articles, posters or even pages out of a book?<br>
    it just looks better than the internet stuff :)</p>
    <p>cheers and thanks for taking the time,</p>
    <p>dmd.</p>
