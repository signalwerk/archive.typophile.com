  html: "<p>Among Doves Type distinguishing features are: severely curtailed question mark (no top loop); dropped left quote marks (which are a characteristic of some European languages other than English); markedly right-offset dot to the i. Are there any other notable book fonts (i.e. not speciality fonts) that include one or other of these features. Many thanks, Anthony</p>"
