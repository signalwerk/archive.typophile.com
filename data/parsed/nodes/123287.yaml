    html: |-
      <p>Montaigne and even Eusebius offset the dot on the i as well - but only to a small extent compared with the Doves type. This is because Jenson's own original roman face offset the dot on the i; and many modern Jensons don't include this feature, as it is (and I think correctly) perceived as limiting the potential usefulness of a typeface.</p>
      <p>Thus, even Centaur and Cloister Lightface don't do this. So, except for a Jenson aiming at maximum authenticity, the offset tittle is likely something you will hardly find anywhere. As to the question mark, the specimens I saw in a brief search didn't include it, but I think I've seen such question marks before, so there may be possibilities there.</p>
