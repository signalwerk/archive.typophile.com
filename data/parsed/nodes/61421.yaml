      <p>I agree with Michael that the hand in motion will have a continuing impact on how type will look in the future. </p>
      <p>This is for two reasons. First, new symbols will need to have some compatibility with existing scripts. For example the Euro was immediately adapted to faces with serifs. It’s design also related to older alphabetic characters. </p>
      <p>The second is that people want to see humanity on the page, in letter design as well as the words themselves. We already have the kind of modular square alphabets like on a digital clock, made from two boxes with an X in them. They are clear, but people don’t want to read them. </p>
      <p>Admittedly this is partly for reasons of the way the eye works, not the hand. But I’m not willing to concede that what the hand does and the eye likes are totally unrelated. </p>
      <p>I’m a humanist. I want humanity in type. And the hand in motion can help give it. </p>
      <p>There’s another thing here, and that’s a false idea of simplicity. The Bauhaus had the idea that simple geometric shapes are the simplist. But now with the ideas about fractals, we see that a very simple rule can result in very complex designs, with an underlying unity. </p>
      <p>The best “simple” designs, like Futura and Frutiger, are in fact very complex and subtle. </p>
      <p>I not saying that the hand will dictate future designs, but it won’t go away either.</p>
