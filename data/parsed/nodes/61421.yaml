      <p>@k.l.: I think we might be talking about different things, or at least from a different angle, because I’m thinking more along the lines of the fundamental forms of letters, and if they’re going to change more rapidly or more slowly in the future, like how Phoenician characters are drawn differently than Latin characters or Greek characters. No doubt new advances in layout tables like Opentype have a major bearing on what’s possible in type design, but I don’t know how much influence that will have on the fundamental shapes of the Latin alphabet. These advances just take away limitations, such as type where the bitmap/pixel quality is extremely evident in older technology. </p>
      <p>So (attempting) to avoid rambling, I’d say the winning forms for the Latin alphabet are the Italic and Roman construction. Writing/typefaces with a different underlying logic like blackletter are novelty or display type now, almost never used for extended reading. Forms like cursive, that I and most Americans learned in elementary school, are on their way out in education, replaced by simple Italics. And when you look at type across the world, from Japanese to Korean to Indic scripts to Latin, the trend in the latter half of the 20th century was towards low-contrast, unadorned letterforms — what you might call the “Helvetica-ization” of the world. I think a large part of this is not just the homogenization that globalization and efficient corporate communication (like the Ikea catalog, for example) brings, but the trend of the developing world to emulate the aesthetics of the western world. So I think in the next 25-50 years, we’ll see the Latin-character-using world change very little — the diversity of stylization will change, and probably expand even more, but the underlying architecture will stay the same. I think non-Latin scripts will try to fit into the Helvetica/clean-corporate mold more and more, possibly changing their fundamental construction in the process.</p>
      <p>Also, type will probably become useless once we all have brain implants that allow us to communicate words, images, or any idea psychically.</p>
