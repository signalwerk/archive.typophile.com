      <p>I think there’s something very offensive about emoticons to people who love type, because to care about type is to see language as a serious business, a world where the preciseness of meaning is, well, meaningful. For those who think the flavor of the typeface used has a major bearing on the text, to reduce language to a series of winks, smileys, and frownies is agonizing.</p>
      <p>That said, there’s something very sweet about seeing emails from my 89 year old grandmother that use smiley face emoticons, and in the Facebook updates from my 13 year old cousin (who you might call a core user and perpetuator of emoticons), something would be lost in the spirit of her excitement if there were any less OMGZ or :D going on. I personally never use emoticons, but my silent protest has no bearing on a ship that has sailed and landed at every port across the planet. In my experience, vendors in Asia use emoticons profusely, and in official business emails that open up with stuff like “Dear sirs...” and end with “Cordially Yours.” It seems slightly funny to Western eyes, having extreme formality mixed with what we consider tween’s pictograms, but they usually get their point across. You could consult the Chicago Manual of Style to write your emails and not get your point across at all.</p>
