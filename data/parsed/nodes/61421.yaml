      <p>Nina and Dan. I’m a nominalist when it comes to writing systems: an alphabet is a set of signs, and the definition of that set and the forms that those signs take are all the signs and the ways they are made by people who use that alphabet, in whatever form. Indeed, such diversity is a precondition of evolution, which is why handwritten script evolves more easily and more steadily than typography: it is by its nature more diverse and more adaptable. I’m not saying that we shouldn’t be pondering what the next evolution of typographic writing might be, and I’m not saying that this evolution will necessarily be influenced by handwritten forms (although I wouldn’t deny that possibility, because a lot of people designing type are also interested in writing). What I am saying is that there is an ongoing evolution that has been happening and is happening just outside of the consciousness of a lot of people who are interested in design and typography, and will continue to happen because this is one of the things that scribes do: they invent new ways of writing.</p>
      <p>***</p>
      <p>By the way, for the sake of clarity, we should say that the Latin alphabet isn’t going to evolve at all, because almost no one writes in Latin any more, and the two main conventions of writing Latin, classical and liturgical, are not evolving. That is what the Latin alphabet is: the set of signs used to write the Latin language. What we’re talking about in this thread is either something like the English alphabet or the Latin script, the former being a subset of the latter, which is a superset of all the signs, conventions and forms used to write all the languages, with their independent alphabets, that are derived from and have signs in common with the Latin alphabet.</p>
    html_clean: |-
