      <p>I agree that the human gesture of “the pen” is on the one hand, becoming less and less significant. I’m of a generation that saw a the change from 100% non-digital type to 100% digital type. My kids have little or limited knowledge of a non digital age, except as a historical era that happened before they became literate. Their connection with how letters were formed by hand is close to being an interesting historical factoid. </p>
      <p>On the other hand, it has been becoming more and more significant, if less subtle at another end of a spectrum of type design. People want to say, yeah, I use a computer - My hand-writing has gone to the dogs, I may have no idea about a connection between typography and human gestures, but by gawd, I am a human being and not a machine and I’d like some type that looks man-made.</p>
