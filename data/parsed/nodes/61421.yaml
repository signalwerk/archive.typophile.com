      <p>John, thanks for your interesting elaboration. I’m not sure about evolution on the level of the alphabet; when you say “the development of writing systems is not an evolutionary process”, how does, say, the “invention” of the Latin lowercase factor in that? That seems very much like an “evolutive” process to me, in terms of actual structural changes that were probably first spontaneously made for different reasons (like economy), but then caught on and slowly became a new standard of sorts. Frankly I originally thought this sort of process was what we were talking about, in which case it is interesting to think about if/how our new medial environment could bring about similar changes (and maybe the emoticon debate isn’t really very far off topic in that regard).</p>
      <p><cite>“We are only now at 578,931 variations of Helvetica. There is at least a quarter million more tedious minor variations left to go before the trend is over and we get back to beautiful, innovative and less sterile letter forms :&gt;)”</cite><br>
      Michael, funny how perceptions diverge. :-) To my eyes we’re caught in the middle of 578,931 variants of soft, humanist designs mostly looking like they’re from a certain North-West European country, and quite strongly tied to the movement of the hand.<br>
      On this level, I guess what I’m looking forward to mostly is more experimentation (that doesn’t have to result in “experimental” fonts though), more curiosity in how the new media can be used except for mimicking the old, and still be useful, and even still be beautiful – but maybe a new kind of beautiful.</p>
