      <p>I don’t know if the tools used to create typefaces or the methods of reproduction will have much influence on type in the foreseeable future. With something like digital type, resolution on handheld devices is becoming much less coarse rapidly, and there’s been all the webfont proposals lately. If you look back at the early Emigre days compared to where we are now, it seems that technology is steering the type-ship less and less.</p>
      <p>The evolution of the Latin alphabet is probably going to slow down, rather than speed up. I say this mainly because the Latin alphabet has spread across the planet over the last few hundred years, now representing languages from Indonesia to Africa. More importantly, in the last few decades we’ve become so interconnected, not just amongst Latin-character-using societies but in just about every last corner of the planet, that the trend seems like it has to be towards standardization, rather than diversity that grows out of regional isolation. We’ve seen this in the type world, with the proliferation of extended Latin fonts and families like Fedra, with its recent Devanagari addition. The need for type that works globally is at the heart of Ikea’s switch to Verdana, as John Berry pointed out on his blog — <a href="http://www.johndberry.com/blog/" title="http://www.johndberry.com/blog/">http://www.johndberry.com/blog/</a> . Of course, we still see a huge output of type that tries to push the boundaries of legibility, but this seems to be born more from the personal expression of designers than a need born out of the market.</p>
