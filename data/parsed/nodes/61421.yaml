      <p>I think it’s interesting that some in the Latin world are keen to keep to more simple, more geometric designs as somehow morally superior—a la Bauhaus—while some (outsiders?) see this same direction for other scripts as evil colonialism.  </p>
      <p>Me, I’m agnostic on this: try what you want, and see how well it works—to native readers. Personally, I prefer to have a touch of humanity in the type I read, whether it’s more or less simple.</p>
