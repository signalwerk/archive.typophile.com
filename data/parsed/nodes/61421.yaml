      <p>Nina, yes, scribes are currently inventing new ways of writing. I suppose I shouldn’t be surprised that this is news to a lot of designers, because I guess it was news to me or, at least, something I hadn’t consciously considered until a couple of years ago. I first became conscious of it when looking at contemporary Arabic writing, but then realised, the same phenomenon can be observed within all scribal culture. It happens that the scribal culture in the west is now small and marginalised, but it still functions as a scribal culture, doing the things that scribal cultures do. One of these things is invention of new ways of writing.</p>
      <p><em>Because if you say there is an “ongoing evolution”, I’d say for it to qualify as an “evolution” it must be somewhat all-encompassing, i.e. actually transform common/general usage of the script, no?</em></p>
      <p>I think the phrase ‘ongoing evolution’ was poorly chosen. The key thing that happens in scribal cultures is ongoing invention and resulting diversity. In evolutionary terms, scribal cultures continuously produce a lot of mutations, whereas typographic cultures only sporadically produce mutations. But it is also part of the nature of scribal cultures that a mutation may have localised fitness, i.e. a new style of writing might be appropriate for very particular jobs that a scribe is doing, whereas the same style might fail utterly as a font because its uses are too localised and limited. But how useful and how true is this evolutionary model?</p>
      <p>Dan’s original question is problematic because it mixes categories, switching from modes of creating letters (scribal) to styles of letters (humanist, modern, etc.) I don’t think it is describing an evolutionary process so much as changing fashions in letterforms. The development of ‘modern’, i.e. romantic, lettering is not an evolutionary change in the alphabet, it isn’t a mutation of humanist lettering. It is a new form based on new tools and new skills, invented by scribes and adapted by type makers.</p>
      <p>So I’m going to conclude by suggesting that the Latin alphabet has never evolved, and that the development of writing systems is not an evolutionary process. It is, for want of a better phrase, a process of intelligent design.</p>
