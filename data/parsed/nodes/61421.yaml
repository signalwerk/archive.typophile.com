      <p>Nina:<br>
      “actually transform common/general usage of the script, no?”</p>
      <p>Not necessarily. Experimentation by contemporary calligraphers/lettering artists do, in fact, influence new designs. P22 Peanut* was a total departure from the norm for me as a calligrapher/type designer. It opened my eyes up WIDE to the possibilities of the ruling pen as a type design tool... instead of a gestural tool.  No, calligraphers are not changing the alphabet; but they do give different perspectives on the letterforms. Experimentation both in the U.S. and abroad is amazing. I just finished a piece of original work and it gave me insight into a “readable” ligature that I had never thought of and/or seen. It was a great “AHA” moment. I am definitely going to incorporate it into my forthcoming font.</p>
      <p>Like I said, calligraphy is not the end all, but do not count it out as a force in the ongoing cycle of type design.</p>
      <p>*Peanut may look simple, but if you study it you will notice it is abuzz with “tradition braking” and thought provoking ideas. May not be anybody’s cup of tea for an Annual Report but so be it. It’s niche, but different.</p>
      <p>Michael</p>
