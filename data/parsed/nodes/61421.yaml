      <p>Nina, as I suggested, I think the evolutionary metaphor only works if one takes scribal invention of new forms to be something like genetic mutation. In that case, something like your analysis of the invention of lowercase looks kinda evolutionary, especially if one has some sense of the mutations that ‘didn’t make it’ (which most people do not). The metaphor is tenuous, though, because I’m not convinced that the deciding factor in which mutations/styles survive and which don’t is anything like a Darwinian ‘fitness’.</p>
      <p>I wrote an article for <em>Communication Arts</em> a couple of years ago that discussed the way in which technological and media changes function as filters, limiting both the content and form of what gets reproduced in new media. I was prompted by research that Colette Sirat had done regarding the transition from scribal to print media, recorded in <em>Hebrew Manuscripts of the Middle Ages,</em> noting that only some books that had been popular in the Middle Ages were reproduced in print editions. I realised that something similar happened with forms of writing, that typography ‘selected’ certain forms—to use another evolutionary metaphor—and ignored others (e.g. the Beneventan script). It is tempting to look at this kind of selection as something like fitness to environment or purpose, but I think this is fundamentally mistaken, because, as your own example suggests, the ‘mutations’ are themselves intentional developments, not occurring by chance but through human ingenuity and creativity, and their selection or non-selection at critical technological junctures is determined by things like fashion, locale, political influence and personal ambition. Unless one is the sort of person who believes an evolutionary model can be applied to explain everything from how we crawled out of the oceans to what I had for breakfast this morning, I think at best evolution provides a partially apt but potentially misleading metaphor for the development of writing systems and styles.</p>
