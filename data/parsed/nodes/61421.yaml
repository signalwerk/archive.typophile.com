      <p>Dan: <em>First we had scribal and monumental, the scribal evolved and combined with monumental into humanist which evolved into modern which evolved into industrial that in turn spurred on the development of geometric, then we had Geometric-Humanist-Industrial and Geometric-Humanist-Industrial-Post-Modern.</em></p>
      <p>What you’ve described is the development of Latin script typography, not the development of the Latin alphabet.</p>
      <p>Something that most people overlook is that scribes never stop inventing new writing styles; this is obvious in cultures with strong scribal traditions, but remains true even when ‘calligraphy’ becomes a marginal artistic activity. Typography evolves slowly between periods of radical change; scribes are continually inventive, experimenting with new tools, new ways of using them, new forms, both formal and expressive. If you want to know what the next evolution of the Latin alphabet is, subscribe to <em>Letter Arts Review.</em></p>
