      <p>In my opinion, there are two concurrent thoughts going on that will inevitably effect the development of the Roman alphabet:</p>
      <p>1) The futurist “new is better” approach that brought us the Industrial Revolution is alive and well in the computer age. I agree with Sii that touch screen technology can/will play a role, but I fail to see the exact influence of that as of yet. I just hope we never evolve to “Star Trek: The Next Generation”</p>
      <p>I disagree with James on the diacritics though. The massive prevalence of txt-type messaging has removed a lot of diacritics from colloquial usage. For instance, my friend Jené just uses Jene for everything now, since diacritics are a pain in the bottom to use efficiently. </p>
      <p>2) Anti-futurist, eco tendencies also are highly prevalent. Walk into a Cost Plus World Market, or Trader Joe’s and you’ll see what I’m talking about. Ironically, this will only get better/more used as Opentype technology allows for greater “naturalness” of a typeset word.</p>
