      <p>Kevin: <em>I see a huge increase in the amount of writing that conveys very little beyond basic emotional state.</em></p>
      <p>Yes, and words are totally sufficient to convey those basic emotional states. And people who learn to use words effectively are able to express more complex emotional states, which means that they’re also better equipped to understand those states and to engage with them in healthy ways. People who rely on pictographic symbols to express their emotions risk becoming emotionally stunted, if they are not already. This saddens me, because it seems futile to try to counter so prevalent a social phenomenon, but then in turn I am angered because I recognise that there are companies and individuals who are profiting financially from this phenomenon, in whose interest it is to convince me and other dissidents that it is futile to oppose such social developments, which are not in fact social in origin but carefully manipulated. And this particular sadness, and this sense of futility, and this anger, are also emotions that cannot be expressed in the Newspeak of emoticons, which discourage people from exercising their minds to describe their feelings and, in so doing, also rob them of the ability to register criticism and protest.</p>
