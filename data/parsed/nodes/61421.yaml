      <p>I think that Palm already nailed the gestural shorthand alphabet. Do their devices still use it, or did they just go to touchscreen keypads?</p>
      <p>I really doubt that there will be much more evolution of the Latin alphabet; there’s too much inertia to overcome. It’s more likely that the way the alphabet is used will change in response to the way technology alters our methods of absorbing and processing information. I do expect to see diacriticals jumping from one language to another as people find themselves needing to display foreign words more often than in pre-internet days. </p>
      <p>I think it’s that we’ll see an alphabetic revolution in China or Japan similar to what happened with the invention of Hangul in Korea.</p>
