      <p>My own take on the future of Latin type is that (following the mysterious disappearance of Nick Cooke and his army of trademark lawyers) OpenType will be supplanted by Google’s new format, gType. As miscellaneous internet abbreviations and 1eet expressions are incorporated into everyday usage, designing good keming will become increasingly difficult, so gType will encourage the adoption of the new gAlphabet in which individual glyphs are presented the reader sequentially through our brain implants using bad flash animation so that they never need appear side by side.</p>
      <p>Once this happens, there will be peace on earth and Fred Phelps will host gay-pride parades in downtown Riyadh.</p>
