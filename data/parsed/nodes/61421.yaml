    <p>Someone said they were bored, so here’s a discussion that I want to participate in:</p>
    <p>What will be the next step in the evolution of the Latin alphabet?</p>
    <p>First we had scribal and monumental, the scribal evolved and combined with monumental into humanist which evolved into modern which evolved into industrial that in turn spurred on the development of geometric, then we had Geometric-Humanist-Industrial and Geometric-Humanist-Industrial-Post-Modern.</p>
    <p>Will digital be the deciding factor? Will graffiti or urban type direct our steps? Will the degradation of handwriting be the influence that determines where the Latin character will go?</p>
  html_clean: |-
