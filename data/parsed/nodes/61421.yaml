      <p>FeeltheKern — <cite>I don’t know if the tools used to create typefaces or the methods of reproduction will have much influence on type in the foreseeable future. [...] it seems that technology is steering the type-ship less and less.</cite></p>
      <p>The term “technology” not only refers to tools but first of all to font formats and layout methods. Tools are designed around font formats which they are supposed to create. And font formats in turn embody what “type” is conceived to be.<br>
      And type designers design type within the boundaries of technology, for the simple reason that they design with help of given tools (which they have not made) for given font formats (which they have not defined). Tools in turn determine type designers’ conception of what “type” is ...<br>
      So of course technology does and will continue to steer the type-ship, if type-ship refers to type designers like you and me.<br>
      The real “limitation” is in what we conceive “type” to be.</p>
      <p>The standardization which you are speaking about (“in just about every last corner of the planet”) actually means this: Technology, i.e. font formats and layout methods, which was created out of a Latin-script based understanding of “type” is now supposed to serve, with some add-ons, the rest of the world too — including scripts that are of quite different nature than the Latin script.<br>
      I am less happy about a vision of interconnectedness and standardization (vs “diversity that grows out of regional isolation”) when in fact what is standardized is very Latin-script centric and means to squeeze everything else into the Latin-script based conception of “type”.<br>
      Again, the real “limitation” is in what we conceive “type” to be. Since we grew up with the Latin script, we regard the Latin script as the model for “type”. This is our blind spot.</p>
      <p>(Not sure what all this has to to with webfont proposals, Ikea or Verdana. You mention “type that tries to push the boundaries of legibility”. There are signs that this effectively means that — again — a Latin-script based conception of “legibility” is applied to other scripts too, though different scripts may require that “legibility” is defined by different sets of categories and thus is something different for different scripts.)</p>
      <p>P.S. Now I notice some irony of writing this in context of a thread of the given title.</p>
