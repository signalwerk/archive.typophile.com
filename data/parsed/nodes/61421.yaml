      <p>I observe here that emoticons are used to remove ambiguity in written text, hurriedly and briefly put. I think that is the effect of the smiley, which is by far the most often used emoticon. It is also used in the context of addressing a particular person, where you know the emotional state of the conversation. </p>
      <p>In writing where you don’t know the reader, these conditions don’t apply. So I would expect when the conditions apply, emoticons will persist, but probably not expand much. I don’t expect them to migrate to writing where you don’t know the reader.</p>
