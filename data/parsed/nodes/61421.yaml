    html: "<p>@k.l.: While I think most of us liberal-minded people in the west like to think of non-Latin scripts being forced into a Latin-script box as being kind of icky, my experience with designers from other countries, particularly those that don’t use Latin scripts, could be generalized into two groups: those we might consider to be more sophisticated, who see their culture’s design heritage disappearing and want to preserve it in modern design practice, and at the other extreme, those who fetishize the sleek and clean corporate look. My guess is that design culture is so new in places like the Arabic and Indic worlds that those who are buying and developing type now are probably the first type, the more “sophisticated” members of their design culture — not the guys outside Mumbai pumping out Flash banners, in other words. Using India as an example, I think as the middle class grows, we’ll see more Indic scripts that are Helvetica-ized, a sort of cargo cult approach to typefaces — using the style of wealth and power to manifest itself. Once that has become over-saturated, there will probably be a backlash. I’ve recently been reading David Brooks’ book “Bobos in Paradise” (which is almost 10 years old now), and he talks about how American high-class in the 50s was Greek pillars and lion-head armrests — they looked to the wealth of Europe as their symbols of sophistication. The modern day elite, though, look to European peasants as symbols of sophistication — stores like Anthropologie use ethnic motifs and heavy distressing to connect to something we sense as authentic. I imagine this same process will happen in developing countries.</p>"
