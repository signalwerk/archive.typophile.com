    html: |-
      <p><cite>...lettering artists can be very consistent in their work.</cite><br>
      And individual letters could be copied photographically for an exact match.</p>
      <p>Letterhead's <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/cosmiccursive.shtml" rel="nofollow">Cosmic Cursive</a> has a similar feel although isn't quite so angular. <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/glengary-nf/" rel="nofollow">Glengary</a> from Nick's Fonts doesn't have quite such a contrast between the thick &amp; thin strokes.</p>
