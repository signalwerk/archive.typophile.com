  html: <p>Hola typophiles, <br>I need a font in the same spirit of "39 Smooth", but with a complete charset since this font doesnt have accents <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br>Can you please help me finding one? <br> <br>I was using 39 Smooth in the titles for a children book. <br> <br><img src="http://www.typophile.com/forums/messages/83/40715.jpg" alt="39 smooth"> <br> <br>This sample is "39 Smooth" by Lauren Ashpole <br><a href="http://eksten.net/webgraphix/fonts/09/39smooth.html" target="_blank">http://eksten.net/webgraphix/fonts/09/39smooth.html</a> <br> <br>Thx. <br>Christian N.</p>
