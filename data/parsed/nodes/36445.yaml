      <p>Trust me, I'm not trying to defend Morison. Everything I've been reading seems to make it more and more obvious that he happily accepted a lot of credit for being the idea man, leaving the real work of figuring out the type to the Monotype staff. In this case, "art director" is at best a polite way of saying he didn't do the heavy lifting. But who were all those folks that did? That's what I wish I had more time to figure out.</p>
      <p>As for Linotype, from what I've heard from Tracy's successor — a women, at least in the non-Latin office — it was ALL about the girls — no, the women — and their skill. I've been seeing those drawings all Summer, and they're breathtaking.</p>
