      <p>OK, here's another conspiracy theory, engendered by Sparky's remarks about Times. We all know how there is no theory of the authorship of Times that will hold water. This was true long before the outrageous fictions of the irrepressible Giampa. Suppose that ... it was the girls who did it? Who accomplished the miracle of transforming Lardent's interesting drawings into a very different, but real, type. (Lardent's font has been privately digitized by Matthew Carter; Jeff Level gave me a dinner invitation printed in it.) Suppose that nobody could bear to give the girls credit? Suppose there were a couple of them who really knew what they were doing, whose advice was taken by the boys? But it's just as possible they were obedient robots. If anyone could _possibly_ find out more about them, track down their spouses, their children, grandchildren, get hold of their correspondence -- then maybe we might just finally learn what really did happen. I was wrong to focus on Bembo. Times, as suggested, is a much better candidate.</p>
      <p>And by the way, how serious is this inquiry anyway? Serious enough to bother putting apostrophes into contractions where they are almost universally agreed to belong?</p>
