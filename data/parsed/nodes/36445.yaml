      <p>Lindsay, you say you'll look for a biography of Carol Twombly. There isn't one. Very few type designers rate biographies and Carol isn't anywhere near getting one, though it would be interesting. I'd like to comment on Thomas's statement that he interviewed CT and she stated she had never suffered discrimination at the type group. </p>
      <p>Carol Twombly would sooner die than say she was discriminated against. </p>
      <p>Now read the recent thread, a few days ago, on design piracy when I reposted some interesting recollections of John Downer's about Carol Twombly and her role in the design of Trajan. </p>
      <p>She's portrayed by Downer as a non-entity, a servant at the command of her art director. No male type designer would _ever_ be portrayed this way. Downer perfectly captures who Twombly was seen at Adobe, and it isn't a pretty picture. But nobody will directly utter the statement 'she/I was discriminated against on the basis of gender.</p>
      <p>Carol is the ideal victim for gender discrimination, because she is absolutely incapable of acknowledging it directly. She truly is the 'good girl of type', a role she played to perfection.</p>
      <p>You'll learn about her not by asking questions like 'did you suffer gender discrimination' -- but by finding out what actually happened day by day in her career. Use what Strachey called the 'indirect approach' to biography and you could discover a lot of interesting things. If you can find out what people actually did, you'll get the picture.</p>
      <p>I talked to Carol on the phone almost every day from roughly 1997 to 1999 and there was hardly a day when there wasn't a struggle with Robert Slimbach and Fred Brady. Guess who always lost? I suspect some of those conversations were taped, a potential trove for a researcher. During the time that Carol was my art director, she was incapable of making a single decision for herself. She always had to bow to the opinions of Fred and Robert, or life would have been even more unbearable than it was. She was not allowed to do her job. It was inconceivable.</p>
      <p>You could also learn a lot about gender discrimination at Adobe from E.M. Ginger in Oakland -- if she were willing to talk. Nobody is going to tell you the truth, however, if they still have any financial dependency on Adobe or any related company. That makes your work difficult but not impossible. </p>
      <p>Talk to the guys at Adobe. None of them will ever say they discriminated against Carol -- not in a million years. Then have them talk about her years there in detail, get the stories. You'll find she was treated like a gastropod, time after time after time. The discrimination is unconscious on the guys' parts, it seems to me -- automatic. I'd like to say it's Carol's fault, for never once protesting, never once losing her cool -- and it is. But that would just be blaming the victim.</p>
      <p>There's a former PR employee who knows a lot of the narrative and who could tell it from a woman's point of view. I don't remember her name; I'll try to find it if you're interested.</p>
      <p>Carol's own impeccable demeanour is what makes her story interesting. She wears an armour of dignity that is impenetrable. No French nobleman ever went to the guillotine with a more authentic smile. It's difficult to think of anyone else who was as bland as she was heroic. I say this even though her invariable and gracious acceptance of the fate meted out to her cost me much.</p>
