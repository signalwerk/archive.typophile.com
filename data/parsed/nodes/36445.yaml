      <p><cite>That saying, psychological research into the differences between genders have suggested only a handful of actual differences, and insignificant ones at that</cite></p>
      <p>An extremely important point.  Part of the controversy of gender-innate-differences research comes in not so much the studies themselves, but the analysis thereof (generally by pop-science writers) who for example, might find that girls are on average scoring 10% higher on a Spanish exam, and interpreting it to mean that girls are that much smarter than men.  Look at the results though and it might be that the guys scored 30, 40, 50, 60, 70, 80, and 90, and the girls got 40, 50, 60, 70, 80, 90, 100.  The overlap of scores is so high that it makes the difference interesting, certainly, but not something to base, say, Spanish pedagogy techniques off of.  (the study I'm thinking of in particular relates to hearing differences, but represents somewhat standard results)</p>
      <p>Mark Liberman has compiled a large number of posts on The Language Log (a blog run by some of the top linguists in the US and abroad) on the topic, which may be of some use, <a href="http://itre.cis.upenn.edu/~myl/languagelog/archives/003586.html">http://itre.cis.upenn.edu/~myl/languagelog/archives/003586.html</a></p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
