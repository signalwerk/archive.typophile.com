      <p>Billtroop, as Lindsay said, she does not want to point a feminist finger.  It is extremely difficult to be both advocate and objective.  In the interest of scholarly work, sometimes it is better to err on the side of cautious objectivity, because, unrestrained advocacy can at times outright offend a reader.  It's incredibly difficult to read an article blaming men for all of the world's trouble that calls them all evil and holds women on a holy umblemished pedestal.  Unfortunately, I have to read a lot of articles like that in my research, and admittingly, it is hard then for me to stay objective (it's an ugly cycle).  It is far easier to read articles that describe clear and distinct evidence, even more so when evidence to the contrary is presented and synthesised well with the rest, and then give the reader the opportunity to fully evaluate it in light of the evidence.  That is not to say that the author can not take a stand — quite the opposite, it is nearly impossible to publish with a "well it could be this, or it could be that" conclusion.</p>
      <p>There is no problem with being an honest, grounded (post)feminist.  However, the number of self-termed feminists that truly advocate equal treatment, rights, and responsabilities is small indeed (for example, I've never heard of any women advocating requiring women to sign up for "selective" service).  Also, the views and approaches of feminists throughout the feminist movement, from protofeminism to early modern feminism to postfeminism, and from British to American to French feminism, have changed greatly.  Most readers won't take the time (and I fully admit to being part of this group at times) to fine differentiate once they notice certain traits.</p>
      <p>That said, I'm not sure Lindsay needs to take an advocate's stand.  Between Chuck and Nick, it's been pretty well said already:<br><cite>when i was in design school in the early eighties, probably 70% of the students in graphic arts were male. by the time i graduated in 84, it seemed like the incoming classes were closer to 60-40. now, as a professor myself, i think the break is more like 60-70% female to 40-30% male.</cite> (Chuck)<br><cite>to avoid the fate of “pointing a feminist finger” you will have to do your own research: survey all the foundries and get some statisitics. Otherwise, you’re just going on guesswork, opinions and preconceptions. </cite> (Nick)</p>
      <p>There is work that can be done, and if change has come or is already on its way, advocacy is not as needed.  Linsday indicates she's a student, and if she can find and document information in an objective manner that would be of worth to future researchers, then she will undoubtedly produce an article (or monograph?  Not sure how detailed she plans on going) that will be cited for years, which depending on her future aspirations, could be of immense usefullness to her personally.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
