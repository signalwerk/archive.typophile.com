    <p>hey</p>
    <p>im currently researching into the relationship between women and typography/type design, and im looking at the implications of gender in industry.</p>
    <p>Im hoping to use a base of primary research, so Id like to see if any of you guys have experiences or opinions on the subject. Reading a thread on Carol Twombly, there seems to be rumors of discrimination (but nothing so factual.. infact ill look for her biography) Id like to see how things have changed since then. Im interested in whats going on currently - Im sure everyone would like to think equality is here, and im not trying to point some feminist finger. Im interested because I have found hardly any literature on the subject, and believe its not fully explored territory.</p>
    <p>areas of interest:</p>
    <p>-Is gender an issue that has affected you as a designer?<br>
    -Do you think you have had to work harder for the recognition you have achieved because you are a woman?<br>
    -Has your gender affected the course of your career in terms of your decisions and the options open to you?<br>
    -Do you think it would be beneficial for there to be more support for women within typography and type design?<br>
    -Have you found that women are hidden away in production, or cluster in behind-the-scenes jobs?<br>
    -Do in-built female traits make women unsuitable for dominant, leading positions?<br>
    -Does a combination of male and female typographers form a stronger force, balancing skills from each side?<br>
    -Is there a difference in the way each gender uses typography? Are skills in using type gender specific?<br>
    -Are female typographers (and designers) forced to masculinize themselves to 'fit in' to male organisations/earn male respect?<br>
    -Is gender no longer an issue, and we should be concentrating more on the individual instead of grouping them?</p>
    <p>Im very interested in your responses, please refer me to an older thread if youve done this all before </p>
    <p>thanks</p>
    <p>Lindsay</p>
