      <p>thank you all for the debate so far, if anything i feel encouraged that people at least want to talk about the subject</p>
      <p>When i undertook this subject - i was already grimacing at the fact i was another women researching into the discrimination of women. Therefore i am very wary of how i approach research. running alongside that i know that the subject of women is always going to be more interesting to a woman. Part of the reason i chose this was because i am a woman, embarking on a career in graphic design, weighted toward typography. and i want to see what im getting myself into...</p>
      <p>&gt;(or monograph? Not sure how detailed she plans on going) &lt;</p>
      <p>This is my 3rd year dissertation (which on a design course means 6000 words...not much room for manouvre) and therefore it might be that i only scratch the surface and begin an argument that can be carried forth by others. At present with the mixed information and experience, i may not even be able to conclude my research.but i shall continue.</p>
      <p>some other points ive been thinking about recently are as follows:</p>
      <p>- Is the design process asexual? is there a female way to design and a male way. could the wiring of a 'gendered' brain lead to a different methodology. what consequence could this have on the work produced? if different systems lead to the same quality and standard of work, does it matter?</p>
      <p>-what is the consequence of so few female role models? in the past obveously there were few - perhaps now there are more female designers but they shy away from publicity, keeping the amount of role models small. should women make more effort to stand out to encourage students and women considering the career? would this make an impact? and why would women shy away from publicity/media attention. is this inn there nature? or there bad experience of it..</p>
      <p>i have bought my ticket for the brighton ATYPI conference in september, and am looking foward to bringing up the subject in conversations. im hoping to get some more info on peoples experience. and start asking questions within institutions like ATYPI to see what they have to say. might even see some of you there!</p>
      <p>I also am hoping to talk to an old psychology lecturer of mine. By finding out some science about the differences between men and women, i can compare the hype and sterotypes. perhaps stereotypes had been created to keep ladies in their place, and have just lingered on. perhaps scientific results need to be openly discussed more to finish potential discrimination between men and women, and let everyone get on with making the best work they can.</p>
      <p>lindsayy</p>
