      <p>I just attended TYPECON Seattle. I asked myself the same question when I attended the one critique session that happened there. There were 8 conference attendees signed up for it. They were all men with the exception of the last one, which was a woman, but who sent her work to be presented by a man because she couldn't attend the conference herself. She lives in Holland and was just starting to design typefaces. The 3 big-time-type-design professionals on the critique panel were also men.</p>
      <p>I was pretty surprised that there was not woman bringing some work of her own to show. It was great to see all the critiques, but it would be nice to have somebody of the same gender going up the podium to show some work. I could have been even more inspiring to me.</p>
