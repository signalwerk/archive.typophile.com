      <p>Actually, everything I've been reading about the Monotype drawing office at the time makes me suspect it was "the girls" who did the bulk of the job of getting Times New Roman — and everything else that came out of the drawing office — to work. I think "conspiracy" is a strong word for it, and probably inaccurate. In fact, no one in the production chain ever seems to get mentioned, just the fact that every character's matrix went through about 80 stages of development and refinement. (One of the reasons Lardent got a nod even at the time was probably due in part to the fact that he worked for <em>The Times</em>, and was outside the Monotype pipeline.) Morison art directed, Lardent developed a set of drawings based on that direction, and an anonymous team over the course of a few decades developed that basic alphabet into a type family with thousands and thousands of characters. Judging from what I've seen and heard so far, most of those people were women, but it would probably take a close look at old Monotype payroll records to say for sure. And I bet it was the same at Linotype, and ATF, and other places. </p>
      <p>It seems like it was the contribution of the production teams that was glossed over, more than the contribution of women as opposed to men. The better question may be why certain positions were traditionally women's work, and if there were any chances for any of those skilled women to move into other roles. </p>
      <p>It's a thorny issue: at what point does someone in that industry stop being a production person and start being a designer? Are we quicker to consider someone a designer now that the process is less industrialized — less about the physical stuff and more about the intellectual property? There are so many layers to peel on this particular onion, and any institutionalized sexism is only one of them. As Nicole said earlier (and she and I have often discussed this year), it's hard to even figure out what the most useful questions are. It makes my head hurt.</p>
