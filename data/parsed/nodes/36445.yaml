      <p>Have you read Linda Nochlin's essay "Why Have There Been No Great Women Artists?" (I am sure it's on the interwebs...) </p>
      <p>It is from the 70s, and in that sense is dated, but examines all the ingrained assumptions located in the question itself - why are there no great women artists - and posits that the wrong question is being asked.</p>
      <p>The fact that Thomas is still asking Carol about her experiences as a women is a clue that we're not quite past it all (it happens frequently elsewhere, too). Is the real issue women in type design, or the overall lack of diversity in the field? Even this is problematic because the field is everyday growing more and more diverse as others have noted... there are more women in type design than ever before. Something to be excited about - but it seems to get lost in everyone moaning about the lack of women in type.</p>
      <p>Locating the question is both a part of the problem and the solution.</p>
      <p>(BTW, I am not trying to suggest you've come up with 'bad' questions, rather just thinking in general about how the subject of women in type design is too often approached in ways that reinforce rather than challenge dominant attitudes.)</p>
