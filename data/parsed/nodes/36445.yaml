      <p>I can speak up as a woman in design. In New York I owned my own typeshop. Very few women worked in typeshops, nevertheless own one.</p>
      <p>It was always explained to me that because of "hot metal" days, galleys were just too heavy for women to pick up and move around the shop, and therefore were discouraged from working in typeshops.</p>
      <p>But if you are speaking of design, woman have always been there. I think it just depends on which commercial entity for design we are talking about. Woman have been art directors in all the major publishing houses - some have even been presidents and ceos. BTW, who do you think design greeting cards?</p>
      <p>Maybe it is the same double standard, women do the work and want to be paid. They just don't go tooting their horns about it. They are there, but you have to find them -- they are the ones buried at the workplace, because, well, as every man knows, you want the job done, give it to the busy person - and yes, it's that poor, overworked woman.</p>
