      <p>thank you for your post blue streak. I am incredibly interested in the forming of gender (unfortunetly the word count of my dissertation wont allow me to go into more depth on the subject). </p>
      <p> I read a recent article on house work, and the statistics still show that most chores around the house are done by women, even if both partners are in full time employment. This wasnt because cleaning and cooking were deemed as 'womens work' but more that women re-affirmed their femininity and therefore their own identity with such activity.</p>
      <p>to feel 'whole' lets say, people re-affirm their identity (including gender identity), and perceptions of what a woman is and should be largely come from the society we are brought up in. It seems to me that even if parents refrained from girl colours or girl toys, messages from other kids at school, tv, adult role models, are going to completely envelope a 'neutral' child.</p>
      <p>That saying, psychological research into the differences between genders have suggested only a handful of actual differences, and insignificant ones at that. There is more indicative research to show that such a stereotype that men are better at driving - because they have better spacial awareness skills -  is due to boys being encouraged to play with toy cars and building blocks - developing those spacial awareness skills whilst girls brush the hair of their dolls.</p>
      <p>Ive spurted a lot there - and skated over detail. back to work</p>
      <p>Lindsayy</p>
