      <p>Talk to the guys at Adobe. None of them will ever say they discriminated against Carol -- not in a million years. Then have them talk about her years there in detail, get the stories. You'll find she was treated like a gastropod, time after time after time. The discrimination is unconscious on the guys' parts, it seems to me -- automatic. I'd like to say it's Carol's fault, for never once protesting, never once losing her cool -- and it is. But that would just be blaming the victim.</p>
      <p>There's a former PR employee who knows a lot of the narrative and who could tell it from a woman's point of view. I don't remember her name; I'll try to find it if you're interested.</p>
      <p>Carol's own impeccable demeanour is what makes her story interesting. She wears an armour of dignity that is impenetrable. No French nobleman ever went to the guillotine with a more authentic smile. It's difficult to think of anyone else who was as bland as she was heroic. I say this even though her invariable and gracious acceptance of the fate meted out to her cost me much.</p>
