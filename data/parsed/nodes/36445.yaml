      <p>&gt;insignificant ones at that</p>
      <p>I seriously doubt that. My children are 32, 30, and 25. --Boy, Girl, Girl. </p>
      <p>I have heard many parents comment on their surprise at how much of the child's personality is there from the beginning, and how the gender differences are also there and unmistakable. Neither of these facts is politically correct, but both are facts. </p>
      <p>My impression is that differences between men's and women's ways of thinking are perhaps not so many, and in many areas where they are different, the differences may be profound but are subtle and hard to pin down. In some areas, such as the qualities they look for in a mate, the differences are more obvious. Also the differences are partly a matter of averages, similar to secondary physical differences such as height. Many women are taller than many men, but on average women are shorter than men.</p>
      <p>That being said, I personally don't think the innate differences have much to do with type design. There are excellent women type designers, and I expect there will be more in the future.</p>
