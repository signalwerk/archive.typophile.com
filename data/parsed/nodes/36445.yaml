      <p>An earlier poster mentioned that the famed 'drawing room girls' were all women. There being no verifiable author of Monotype Bembo (which really is as much an independent typeface of its time as it is an adaptation of Griffo's punches), I had what I thought was the shrewed suspicion that the girls had done it and nobody wanted to admit it. I haven't been able to find any real support for this. But David Saunders told me that if it was any one of them that he knew of, then it would be Dora ____ (I'm blanking out on her surname though I have notes of our conversations.) It would be very difficult to learn anything more, and it's probably just a feminist pipedream, but it did seem to me worth pursuing. </p>
      <p>One thing to consider about Carol and type design: there are exceptionally few corporate type design jobs available. Carol wasn't replaced when she left. She must be one of the very few women in recent years who had the experience of being a typeface designer for a large corporation. </p>
      <p>Cynthia Hollandsworth would be a great person to interview for experiences of a slightly earlier period. Doesn't Arthur Baker insist that all her ideas came from him? Typical! </p>
      <p>For someone like Licko with her own company, one would assume that gender was as little of an issue as it could be.</p>
      <p>And what of Gudrun ZvH ? ? ? ? Such things one hears! Ma sotto voce!</p>
