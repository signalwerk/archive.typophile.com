      <p>I think this may be coming true today.  There was a much more male dominated typography era when type was hot metal and set in an industrial environment. Today, It seems women can choose typography or type design as a field if they want to.  There may not be a high number of women type designers out there yet but the high quality work that they produce easily makes up for the quantity.</p>
