      <p>Not being a woman I can’t provide much insight into most of your questions...</p>
      <p>Milton Glaser wrote a piece for Design Observer last year about the relative lack of women in the upper echelons of design, which was quite striking given that in the lower and middle ranks of the industry, as well as in design school, women outnumber men. It generated a very heated discussion, and is worth reading.</p>
      <p>It would be worthwhile to see if relevant professional organizations can provide you with information about the gender breakdown of their membership, especially over time. Government Education agencies could probably provide information about the number of women enrolled in design programs, and possibly the number of women teaching in design programs.</p>
