      <p>Jackie, my comment may have come across as rude but it wasn't meant to. All I can say is that I'm genetically predisposed to being a *rick.</p>
      <p>Lindsay, I've held back on commenting in depth on the essence of your post because I don't want to divulge a lot of personal information. And I have so much personal experience on both sides of the argument that I didn't know where to start. Here goes a long comment anyway. (Why can't I focus on billable hours?)</p>
      <p>Because there are always exceptions to nature, this is a generalization. Women and men are very different and have a very different approach to the same situations. </p>
      <p>My experience started with a mom who got her Masters degree in the early '70s. She quickly became the boss of many men. By the time I was in high school she was the boss of dozens of men and women. She's not a tough woman — she's a tough person and mentally perhaps the strongest person I've ever known.</p>
      <p>Then I met my wife of 19 years. Saying she is a genius and the smartest person I've ever met is an understatement. It took me seven wonderful years of work, party and school to get a BFA. My wife graduated Summa Cum Laude with two science degrees in four years. She went on to absolutely ace her post-graduate degree. When it came time to put career paths on the shelf to focus on our children, we both did.</p>
      <p>My wife convinced me that the assumed differences between men and women were bogus. Then we had twin girls. We decided that to avoid having them endure sexist discrimination we would give them gender neutral names. We did this and consciously avoided giving them any gender specific directions from the day they were born. There would be no pink stuff, no Barbie dolls, no fluffy girly things. We would let them gravitate toward their own natural path. </p>
      <p>They are now ten years old. And those past ten years have been very educational about the true nature of girls and boys. It started soon. It became overt in the first days of kindergarten when they weren't really talking much, just slobbering and drooling on everything. One family didn't want their boy child to have gun toys. The first thing the boy did at kindergarten was assemble Legos into a gun and start shooting the other kids. That's just one example of hundreds. With deliberate effort by the adults to not shoe them into predisposed gender paths, they did it anyway. </p>
      <p>So we now have one girl that will only wear skirts and prefers pink to any other color on the planet. And we know, accept and love the fact that girls and boys have wonderful differences — the yin for the yang. Stereotyping and systemic discrimination still occur, and will probably always occur, in both directions. But there are real and specific reasons men go into orthopedic surgery and women go into pediatrics. And in typography women and men will typically have different sensitivities to the same situations — of course that's a generalization though. I hope you keep plugging at documenting a worthy topic.</p>
