      <p>I'm doing my MA Thesis (in Literature though) and currently writing a section that treats a very similar topic.</p>
      <p>To a large extent, the questions asked can reveal your own intentions or presuppositions, and as many have noted, the answers might not always be honest for myriad (hrm, bad pun given the thread content so far) reasons.</p>
      <p>For me, when I hear your questions, I think of early feminist literary theorists.  Such critics aimed to identify female authors who were not in the canon and compile their works, etc, and look for the feminity within the works.  At least within the case of the author I'm working with, many of these critics lost credibility when they began to assume that her works were left out of the canon because she was a woman, when a more likely (given the greater wealth of evidence) is that she was simply too vulgar for the Victorian age, which was the case for many other male authors as well.</p>
      <p>Probably one of the most helpful approaches I've found when I'm forced to ask questions like "Is the female designer hidden away?" is to reverse the gender, or even androgynise it: "Is the male designer hidden away?" or "Is the designer hidden away?"</p>
      <p>Another question brought up by others is why the number of males in typography is / seems to be greater, or perhaps why there are now more women in such programmes than before?  Is it because males have dropped out of the programmes, such as the trend seems to be in most liberal arts fields, or is it because of surge in interest by women, as the case would be within the sciences.  </p>
      <p>Upon rereading what I've written it sounds almost like I'm discouraging your research, which I should make clear I'm not.  If the questions haven't been asked, or there is still considerable disagreement as to some of the answers (as already seen in this thread), then the value of the research should be there.  The most important thing is — and you already recognise it based on your first post —&nbsp;is to avoid coming off as a feminist or worse a feminazi.  There are some critics (*coughVollendorfcough*) who I absolutely can't read because they're so slanted it's unbelievable that they're published.  I actually have the opposite problem you do, I have to avoid sounding like a chauvinist masculinist in my analyses.</p>
      <p>Although primarily based for literature people, given the general confluence these days of all arts (textual, plastic, musical, graphic, etc.), a book that might be of good assistance is <em> Beginning Theory: An Introduction to Literary and Cultural Theory</em> by Peter Barry. Google Books has a preview of it.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
