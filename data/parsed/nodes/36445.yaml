      <p>You're quite right, Nicole, to sense as I think you do that Carol would wince if she knew she was being discussed or should I say dissected in this way. Perhaps it is quite wrong of me to do it. But the party line makes my blood boil. When I hear the same old mendacious platitudes, I have to speak. She left Adobe, and type, because it was made unbearable and hateful for her, and I sometimes wish I had the courage to follow her example. </p>
      <p>Drama aside, the way in which the founding post on this thread was framed raises an interesting question: to what extent did CT suffer from gender discrimination, to what extent did she suffer because her male colleagues were dreadful people? What is the line that separates personal cussedness from plausible discrimination? </p>
      <p>I would suggest that Carol was a product of generation. If anything, she had the mindset of the generation before. It's difficult to imagine a 25 year old woman today accepting or even being offered the same kind of treatment.</p>
      <p>Avital Ronell suggests that we may finally have entered a time when we are 'Jenseits von Gut und Böse/Jenseits von Mann and Frau' -- that is, Nietzsche was worried about being beyond good and evil, Ronell is worried about being beyond man and woman, and suggests that the time may already have arrived. Gender politics moves quickly! At least I hope it does.</p>
