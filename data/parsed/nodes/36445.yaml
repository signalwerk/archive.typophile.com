      <p>"-Have you found that women are hidden away in production, or cluster in behind-the-scenes jobs?"</p>
      <p>It's a shame that there's not more documentation about the behind-the-scenes work that used to go on in the larger foundries, because certain areas of activity appear to have been completely dominated by women, even when men got the credit or managed the activity. </p>
      <p>I've been reading about the development of Times New Roman, for example, where credit generally goes to Stanley Morison for the idea and the art direction, and a production artist named Victor Lardent for the initial drawings. Different sources appear to agree that once the basic principles were established that all the real work of expanding the drawings into full fonts with different sizes and complete character sets were done by the drawing office. Every photo I've seen of the drawing office — including ones published at the time by Monotype — shows women doing the work. The little bit that I've looked at Linotype seems to show the same situation.</p>
      <p>I'm not surprised that people at the production level never get to share in the credit, but it's astounding that areas of the industry could be so dominated by women with so few — if any — of them going on to larger, more influential positions. It makes me wonder if overall diversity in the field has improved as the parts of the overall development process have become less segmented.</p>
