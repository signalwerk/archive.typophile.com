      <p>Sparky, without knowing much more about it, I get the feeling that Benton did most of the work at ATF, and at Lino, you kind of get the feeling that G. Jones, Griffith, etc. were more in control than Morison ever was. Remember the story about Fournier going into production while 'the typographical advisor was absent' or something like that, and they didn't even use the right model. (You could read that two ways: the whole factory was hopeless without Morison's guidance; or that the factory didn't need Morison, since Fournier is incredibly well-implemented. The implication, to me, is that Morison could show the drawing office an historical print, and they could come up with a great, modern type, without him. (Fournier really, really, really is great in metal, just beautifully done, especially the gem-like smaller sizes; don't judge it by the pathetic digitization, but by old Penguins which use the smallest sizes.) The picture that's getting drawn here is that Morison was an incredible idea-man but that the actual work was done by either Pierpont or by the girls.</p>
      <p>I think Nick is extremely on target to focus on that word excogitate. It has always struck me as a weird usage, concealing something. It rankles. It's almost as if he's announcing, 'I'm going to tell a lie.' because there is no way that it can literally be true.</p>
      <p>Lots of interesting inferences. How to prove them? If only a single one of the girls left behind a document ... is it even faintly possible that the MT archives might contain some sort of memo of working procedure that might reveal more? </p>
      <p>Speaking of the archives, David Saunders noted that the drawings always were signed with the initials of the girl who drew them. He suggested that if Dora ___'s initials were on the principal Bembo drawings, it would be an inference in favour of my theory, though not more.</p>
      <p>By contrast, looking at the article on the making of Juliana at Linotype in the 1950s, the implication is that primarily Hartz and Tracy are concerned, nobody else seems to matter. Yet what if the better sizes (better, according to Hartz, perhaps because he had least to do with them) were primarily so because of the girls?</p>
