    html: <p>You can setup a bleed area in Illustrator as well. I have a default PDF export setting which works in Indy and Illy which I use to include crop, trim and bleed marks. I’d also suggest once you create your PDF to test print the separations to a laser printer to make sure your colors separate correctly and that extra plates don’t output.</p>
