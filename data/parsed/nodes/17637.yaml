      <p>It is probably best to use InDesign, where you can set the document size (trim), margins (live area) and bleed in the “Document Setup.” CS 2 will also allow you to export a press-ready PDF/X-1A with the appropriate color profile embedded.</p>
      <p>But whichever app you set-up your file in, do not put a box around your trim. It will be extremely difficult for your printer to cut directly on a .25pt line&nbsp;– that’s what a bleed is for – an area for the printer to safely cut within.</p>
      <p>There is a great deal to know about making files press-ready. <a href="http://www.sappi.com/NR/rdonlyres/58071E52-0EB0-4F34-886F-6CB1CC85FE0F/0/TheStandard1_Prepress.pdf">The Standard</a>, which is published by Sappi, is a great place to start. Sappi also has more advanced informational brochures available <a href="http://www.sappi.com/SappiWeb/Knowledge%20bank/Technical%20brochures/">here</a>.</p>
