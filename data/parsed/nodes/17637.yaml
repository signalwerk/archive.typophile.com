      <p>This is my process:</p>
      <p>I’ve found that different print shops do different things. Some will print 2-up, some 4-up and some more depending on the situation. If I don’t know the exact setup, I almost always set my Illustrator artboard to 11” x 8 1/2” and let the printer set up the artwork for the press (assuming the printer is well established and knows its stuff).</p>
      <p>Then I create a rectangle 3 1/2” x 2” (for a standard card) with no fill and a 0.25pt stroke in black. I’ll be deleting this outline before I send it to the printer, but for now I use it as a guide of the card edges.</p>
      <p>Then I copy this rectangle and expand its dimensions by 1/4” (or 1/8” on each side). I remove the stroke on this rectangle and give it a light grey fill. I’ll be deleting this rectangle as well, but for now I use it as a guide of the bleed. Keep in mind, if you aren’t printing a bleed, you can skip this step.</p>
      <p>To create the trim marks, I select the original 3 1/2” x 2” rectangle and go Filter &gt; Create &gt; Crop Marks. This will produce you trim marks in a registration colour (so that it will print on all plates). I usually add registration marks (targets) as well, but most printers can add this for you.</p>
      <p>Now, using the guides described above, I layout the front of my card. Then, I repeat the steps for the back of the card and set the 2 side-bide side (with some breathing room) on my 11” x 8 1/2” artboard.</p>
      <p>As a final step, I remove the 2 guide rectangles so that all I’m left with is my artwork and the trim marks. Also, I always use the Document Info window in Illustrator to do a final check on the artwork before producing a PDF and test print.</p>
      <p>Hope that helps.</p>
