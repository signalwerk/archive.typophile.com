    html: <p>In InDesign CS2, clicking “More Options” in the Document Setup screen will show you a specific option for Bleed size. This is useful because if you export a PDF and check “Crop Marks” and other printer’s marks, ID will automatically add proper marks for that document size and leave the bleeded color/images.</p>
