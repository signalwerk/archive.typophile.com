      <p>Just to note that ’page size’ in the context you use it doesn’t matter; the printers will arrange many copies of your artwork on whatever size sheet their press uses (“imposition”) and then cut down to the finished size using the cropmarks.</p>
      <p>For a regular, rectangular piece, make the page size the same as your finished item.</p>
