    <p>Hi everyone,</p>
    <p>  I am hoping to get some business cards printed for my first job (non-profit). And when I went to a printers web site I saw their requirments for printing, and I’m a little lost. </p>
    <p>  They ask that the file be PDF, and have bleed and trim marks. I know how to do all that, but I am lost as to how you set it up for a printer. For example, how big do I make the page inorder for them to see the bleed? So if my bleed is 3mm, and my card is 90mm x 55mm, then does that mean I make the page 93mm x 58mm? IS that how it works? And I assume the trim line is just be a box marking the trim with a .25pt line thickness.</p>
    <p>Sorry if these questions are really stupid and sound very noobie, but I want to get it right.</p>
    <p>Thank You</p>
