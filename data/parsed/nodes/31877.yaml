    <p>IEU CD204-ARCH202 project gallery</p>
    <p>“ <a href="http://homes.ieu.edu.tr/~asegalini/0607/t2-arch2-project1.jpg">The Language of the Text</a> ”<br>
    12.02.2007 – 19.02.2007</p>
    <p>My gratitude goes to my associates Gül Kaçmaz Erk &amp; Selma Göker for having made this project feasible, and to all the 2nd year students involved, for having undertaken the task in one week only, and with admirable results.  Last but not least I’d like to thank Dr. Hakan Ertep &amp; Dr. Tevfik Balcioglu for their understanding.</p>
    <p>The letters of the alphabet, the characters of a typeface are building blocks ; as well as I believe that writing is architecture, <em>may graphic design &amp; typography not be banned</em>.</p>
