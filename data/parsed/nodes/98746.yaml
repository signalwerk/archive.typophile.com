    date_raw: 10 Dec 2012 — 2:45pm
    votes: null
    html: |-
      <p>Hi again, I've done some more testing, and haven't had any better luck. I converted all my double-wide characters to regular width, so all glyph widths are the same. Exporting as PS, opening in FontLab, exporting TT didn't work. Copy/paste into new VFB didn't work. I was careful to clear the Windows font cache and make sure everything had unique names and IDs.</p>
      <p>It turns out I was wrong about it being consistent at all sizes. Different characters are wider or narrower at different sizes.</p>
      <p>Stranger still, the italics work fine, mostly. I'm not getting any odd spacing with italics, though they don't match the metrics of the original custom font. I started with the regular, then used that as a basis for the italic, bold, and bold italic, so I'm not sure what's so special about the italics that they're less problematic.</p>
      <p>I was just about to test various smoothing settings, but I've now run into an issue where installing any new fonts causes them to disappear, and can't be used in applications. This is apparently a Windows 7 bug, so I'm not sure what testing I can do next.</p>
      <p>Does anyone have any more ideas?</p>
      <p>Thanks,<br>
      Alan</p>
