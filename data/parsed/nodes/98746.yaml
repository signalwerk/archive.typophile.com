      <p>A few more things to check:</p>
      <p>a) Make sure that all glyphs in the font have exactly the same advance width, with no exceptions.</p>
      <p>b) Ensure that the Panose value for monospaced is set in the Panose / Proportion font info.</p>
      <p>c) Ensure that the TrueType Unique ID record in the font info identification settings is indeed unique to this font and can't be confused with anything else.</p>
    html_clean: |-
