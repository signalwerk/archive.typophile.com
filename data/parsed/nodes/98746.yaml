      <p>This sounds like a font cache corruption problem. Have you tried installing on a different Windows machine?</p>
      <p>I suggest:</p>
      <p>1. Uninstall the font.<br>
      2. Delete this file: C:\Windows\System32\FNTCACHE.DAT<br>
      3. Restart your system.<br>
      4. Re-install the font.</p>
      <p>If the problem persists after that, then there may be some piece of information in the font that is causing the problem, but that would not be my first guess.</p>
