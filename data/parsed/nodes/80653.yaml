    html: |-
      <p>/C/G/O/ are too perfectly elliptical that they are actually distracting.</p>
      <p>/S/ has the problems where both curves meet - in the middle.</p>
      <p>Some letters are based on ellipses others on circles, which makes letters look like they re from two different families.</p>
      <p>Lowercase it too tight spaced. Word spacing with this letter spacing is way too wide. Some letters are too wide compared to others (ie. /V/).</p>
      <p>Put /R/ and /K/ side by side. Do they look they're from the same family? I guess not.</p>
      <p>But keep on doing it. With several adjustments it may become a nice display type. I'm not so sure that this can be body type at all. At least not using these shapes and this kind of spacing.</p>
