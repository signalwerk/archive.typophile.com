      <p>Yeah I'm not really sure what it can be either...I've sort of just stumbled into this and realized how much I love it. I just need to get better at identifying certain things.</p>
      <p>For some reason the /S/ has given me problems whenever I try to smooth out the middle curve, I guess I need more practice.</p>
      <p>You also confirmed my suspicion that the widths of certain letters were not right comparatively...sometimes it gets so hard to tell when you stare at the same thing for too many hours.</p>
      <p>I did try to narrow the stroke width on the top/bottom of /C/G/O/ but it's hard to tell. I don't like the G at all anyway, but wanted initial feedback so thank you.</p>
      <p>Stylistically maybe you can answer this question for me. I have a small affinity for the way the T is very narrow and others are wider which is why I posted as is, but in this case is it trying to be two different things? In other words I can vary widths to create a less formal display type that is fun/loose but just not when using such geometric shapes?</p>
      <p>I will nail down my style, workflow, &amp; chops soon enough. Thanks again</p>
