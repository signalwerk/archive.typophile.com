    html: |-
      <p>It was my first one and I didn’t miss a talk. For the most part, each talk offered something thought-provoking, stimulating, informative or funny (sometimes all of the above). Just two highlights for me were:1) Bill Hill’s (Microsoft) inspiring talk about the Digital Renaissance we’re all part of. If this is the guy Bill Gates wants to keep dreaming about the future of digital typography, then I may have to revise my feelings about that company. 2) The talk by Mexican Font designers Gabriel Martínez Meave and Leonardo Vázquez Conde was an informative and eye-opening look about the history and vitality of the Mexican type community. I want to learn a lot more about those designers.</p>
      <p>Tamye and the gang, including ’Stewf’ Coles, did a great job of planning it and keeping it moving right along. The Typophile Film Festival 4 was sensational. ’Helvetica’, the movie, is a must see if you get the chance.</p>
      <p>It was terrific to finally meet so many Typophiles I have only ’seen’ online before, but we really need a better way to spot each other. I have no idea how many of you I missed because I couldn’t read the last names on the badges unless you were inside someone’s personal space. That was really my only complaint. </p>
      <p>- Mike Yanega</p>
