    <p>The last professional conference I went to involved representatives from every US military service and intelligence agency sitting around giving each other the evil eye. Having survived that mess, I can really appreciate when a conference is great. So I just want to thank Tamye, everyone at S{o}TA, all the volunteers, the people from SVC and Cornish, the sponsors, and the speakers for making Typecon 2007 the best vacation I’ve had in years.</p>
