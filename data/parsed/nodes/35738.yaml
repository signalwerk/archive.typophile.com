      <p>Or at least the user name. </p>
      <p>What was surprising was the amount of people who have never even heard of Typophile. There were a couple of local AIGA guys here, pretty nice guys, who knew next to nothing about this forum. </p>
      <p>But again, the amount of people who DO participate here was also surprising. Most of the type designers participate, exceptions being people like Matthew Carter and John Downer.</p>
      <p>The other thing that was surprising was how familiar and friendly the entire type community is with each other. Competitors and rivals are friends and compatriots, all with the twofold goals of learning and having fun. Newcomers are treated as if old friends, and even the old-timers have time to sit and chat with students who haven’t even had a full year’s worth of design.</p>
      <p>Bravo!</p>
