    html: |-
      <p>First: Jeremy, sorry for the digression (par for the course here on Typophile, especially when yours truly is involved...) but I hope it's still somehow useful.</p>
      <p>Nick, I would say look at Harrier* and the Italic of Nina's Ernestine**. And Martin, I don't have a lot of typefaces... Well, not in digital – they're mostly in brainwave format. :-&gt;</p>
      <p>* <a href="http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif" title="http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif">http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif</a></p>
      <p>** <a href="http://ernestinefont.com/" title="http://ernestinefont.com/">http://ernestinefont.com/</a></p>
      <p>More on my thoughts about Italic in my old Daidala interview: <a href="http://www.daidala.com/25apr2004.html" title="http://www.daidala.com/25apr2004.html">http://www.daidala.com/25apr2004.html</a><br>
      But frankly, I feel like I'm still taking baby steps in this area; I'm just standing on the tip of the iceberg.</p>
      <blockquote><p>you better make it clear that they denote something.</p></blockquote>
      <p>Totally agreed. But cursiveness remains an arbitrary and distracting means to do that. For example I see the "upright Italic" trend of about a decade ago as a huge mistake. Slant, different story.</p>
      <p>I don't think <em>pretty</em> usually makes sense when you're trying to emphasize. Certainly not as a rule, which is what it is now. Most Italics are like a ballerina crashing an economists conference.</p>
      <p>Going nuts? Display face.</p>
      <p>hhp</p>
