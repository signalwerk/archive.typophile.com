    html: |-
      <p>I would say start by realizing that Aldus's matching of a static Roman to a fluid Italic was a shotgun-wedding from hell. Then consider that the ideal flavor of a given Italic depends on its role in the whole, which can vary, so blindly following the established fallacy by default is Bad Design. And usually this role is one of subservience to the Roman, not "Look at meee, look how pretty I am in my tutu doing a pirouette!" Cursiveness has <em>nothing</em> to do with emphasis.</p>
      <p>Now make something real.</p>
      <p>hhp</p>
