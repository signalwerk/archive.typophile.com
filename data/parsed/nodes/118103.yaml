    votes: null
    html: |-
      <div class="comment-spam-body"><p>I like the tension in the italic of Ernestine. Perhaps it's better to have an italic with such tension rather than a full cursive, though a cursive inherently creates tension when combined with a roman. I personally like how text tends to become more vivid when such tensions are employed. For example, I like the combination of roman and blackletter to add texture and color to a page. I suppose in a way it's strange that the italic has become part of the roman while this hasn't been the case for blackletters. I know blackletters are generally out of fashion, but I love it when a blackletter variant has been added to a roman.</p>
      <p>Anyway, I think the ballerina approach to italics tends to work very well for classical typefaces. It's sort of Venetian, with lots of tension within the shapes.</p>
      <p>Hrant, why haven't you done more typefaces? Don't you particularly enjoy the process? Nour &amp; Patria has a very nice texture. I like the tension in the italic, which you probably wouldn't expect from such a transitional, vertical design.</p>
      </div>
