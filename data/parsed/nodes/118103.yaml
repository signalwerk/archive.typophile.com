    html: |-
      <div class="comment-spam-body"><blockquote><p>Cursiveness has nothing to do with emphasis.</p></blockquote>
      <p>How doesn't it? I'm often greatly annoyed when an italic looks too much like the roman and it's barely noticeable that some text is set in italic. I think whether you use italics for emphasis or something else, just like bold and small-caps they have their function and they're used to denote something, so you better make it clear that they denote something. What else is an italic for?</p>
      <p>I personally also see the italic as a way to go a little nuts. Traditionally the italic was a distinct typeface from the roman, so I actually wonder from a historic perspective why you would want the italic to look like the roman. You state the initial combination of roman and italic was a shotgun-wedding from hell, but I just can't relate to that.</p>
      <blockquote><p>so blindly following the established fallacy by default is Bad Design.</p></blockquote>
      <p>I'm not quite sure what you mean here and how you would prefer to see it.</p>
      <blockquote><p>And usually this role is one of subservience to the Roman, not "Look at meee, look how pretty I am in my tutu doing a pirouette!"</p></blockquote>
      <p>Whether you feel italics are for emphasis or not, I think the cursive script inherently says "Look at me — look how pretty I am". Why would you even want to fight that?</p>
      <p>I guess you won't like the italic of Kristal by Eyal Holtzman; I think it's awesome. Here I could understand your sentiment though. It's very prominent, which you generally don't want to that extent in body text, though it's fantastic in a display context.<br>
      <a href="http://www.eyalmyrthe.nl/letterontwerpen.php" title="http://www.eyalmyrthe.nl/letterontwerpen.php">http://www.eyalmyrthe.nl/letterontwerpen.php</a></p>
      <p>Romanée is the same case as Kristal in this regard. How do you feel about upright italics in combination with roman?</p>
      </div>
