    html: '<p>My selection (Italic could be done by shearing Regular): <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/kirsty/" rel="nofollow">Kirsty</a> (Serifs Needing To Be Removed - SNTBR), <a class="freelinking external" href="http://www.myfonts.com/fonts/emigre/brothers-ot/" rel="nofollow">Brothers</a> (SNTBR), <a class="freelinking external" href="http://www.myfonts.com/fonts/device/heretic/" rel="nofollow">Heretic</a> (SNTBR), <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/dime-box-wbw/" rel="nofollow">Dime Box</a> (SNTBR), <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/slinger/" rel="nofollow">Slinger</a> (compressed), <a class="freelinking external" href="http://www.myfonts.com/fonts/intellecta/concave-tuscan/" rel="nofollow">Concave Tuscan</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/dsgnhaus/vintage-gothic/" rel="nofollow">Vintage Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/concave-tuscan-x/" rel="nofollow">Concave Tuscan X</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/gothic-tuscan/" rel="nofollow">Gothic Tuscan</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/solotype/minnesota/" rel="nofollow">Mineesota</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/teniers/" rel="nofollow">Teniers</a> (SNTBR)</p>'
