    <p><strong>We are very proud to announce the first typeface reseller dedicated to charitable causes</strong></p>
    <p>------------------------------------------------------------------------------</p>
    <p><a href="http://www.fontsforhope.com" rel="nofollow"><strong>"FONTSFORHOPE"</strong></a></p>
    <p>Join us and Support a noble cause...</p>
    <p>------------------------------------------------------------------------------</p>
    <p>If you’re a designer or user of fonts you can collaborate with the project FontsForHope. And to say ”yes” we can do something with typography.</p>
    <p><strong>What Fonts for hope?</strong><br>
    A font distribution project in which profit sharing is different from usual.<br>
    Every purchase on our site will generate a profit to generate hope for aspecific cause. Under the menu ‘Hope’ you can see the open cases.</p>
    <p><strong>What is special about the distribution of profits in fonts for hope?</strong><br>
    A minimum of 25% and a maximum of 100% * (see detail at the end of this page) of each purchase is assigned to a specific cause (each font mayallocate funds to a particular case: you can suggest one).</p>
    <p><strong>Are the fonts are more expensive than other sites selling?</strong><br>
    No. The fonts are, at most, at the same price elsewhere.</p>
    <p><strong>How I can participate?</strong><br>
    If you have fonts for sale, or want to get started on it, you can contact us.<br>
    We evaluate your typography and if you are able to access the market,welcome!</p>
    <p><strong>What percentage gets the designer of thetypeface?</strong><br>
    * The default layout is: 50% of each sale goes to the designer of the typeface, 25% for a cause and the remaining 25% for operating costs, financial and minimal benefit to the Fonts for Hope team. But we are humanand are open to handle any situation that requires it.</p>
    <p>------------------<br>
    Best Regards!!<br>
    Martín Sommaruga<br>
    Fernando Díaz<br>
    Vicente Lamónaca<br>
    (TipoType's Team)</p>
