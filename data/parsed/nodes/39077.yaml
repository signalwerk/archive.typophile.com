    <p>This is for a new nursery starting up in Vermont. They’re aiming for the high-end market, by which I mean large, older trees. This means that I needed to find something classy, timeless, and also that I have something like ten years to come up with a good design.</p>
    <p>I started out trying to incorporate an acorn or an oak leaf or a tree or something iconic. The acorn I couldn’t get to not look stupid, a partial oak leaf I couldn’t get to not look like a Far Side character in profile, and the tree just looked trite. Also, various attempts at “classy” fonts seemed to be quickly dated.</p>
    <p>So I wound up with just this, which is one of the Fell typeface-lookalikes from Igino Marini and one of its flowers. I think it captures a colonial Vermont feel without being too dated. But is it too bland; i.e., does it need a graphic? Thoughts? Suggestions? General comments? Thanks in advance!</p>
    <p></p><div class="imageWrap"><img src="/files/ecn_6702.png"></div><p></p>
