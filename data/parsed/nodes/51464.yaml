      <p>Handpicked and commented:</p>
      <p><strong>Caslon 540</strong><br>
      Book: <em>Mason &amp; Dixon</em> by Thomas Pynchon<br>
      Story is set mainly in London and America in the 18th century.<br>
      Caslon is historically a good choice, although the quality of the digitization of Caslon appears to be poor (too flimsy/light). A drawback are initials and chapter titles set in Bank Gothic.</p>
      <p><strong>Plantin (Monotype)</strong><br>
      Books: <em>Quicksilver</em> and <em>The Confusion</em> by Neal Stephenson<br>
      Parts One and Two of the Baroque Cycle (trilogie).<br>
      Story is set all over Europe and beyond. It’s Science fiction set in the 18th century.<br>
      Appropriate choice. Plantin is the recreation attempt of the work by a 16th century Frenchman in Holland with the lowercase ‘a’ taken from another face. Historical Confusion. Artificial. Fiction based on historical facts. Baskerville might have been a good choice reflecting the transitional aspect of the time-setting and content, but maybe too correct.</p>
      <p><strong>DTL Fleischmann</strong><br>
      Book: <em>Water Music</em> by T. C. Boyle<br>
      Actually in this case the typeface was listed with the publishing info (which I saw afterwards). A very cheap re-issue book (5 EUROs). Story is set mainly in London and Africa in the 18th century, about the exploration of the Niger by an Englishman. Fleischmann seems historically correct, but actually Baskerville (or Caslon) might have been a better choice, being more English. Fleischmann performs wonderfully, although being a Dutch extravaganza.</p>
