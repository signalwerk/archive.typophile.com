      <p>&lt;&lt;  It is a shame that digitisations of metal types are near-universally preferred to more recent faces, designed specifically for modern typesetting.  &gt;&gt;</p>
      <p>When hiring freelance designers, art directors and production managers can help lead the way to use of new faces in book typesetting. I have just pulled down a bunch of books that had been in my charge over the past two years as Design &amp; Production Manager for the Press of a state historical society. Here's some of the faces used by freelancers: Requiem, Kingfisher, Miller, Clifford, Malaga, Quadraat, Filosofia, Chaparral, Minion, Mercury, Paperback, Warnock Pro, Adobe Jenson Pro. (&amp; one disaster set in Golden Cockerel far too small for good reading. But we were under a time crunch, and the manuscript had growed too much to fit into the desired page count. It still sells well, though.)</p>
      <p>There are two reasons these designers used these faces. One is that I push them to, following my own practice of never using for text any hot-metal face I used in the years when I printed books letterpress. The other reason is that they are all good designers, able to understand that books they design will be printed better and will look better and read better if they carefully choose new faces, well-designed.</p>
      <p>I do not always like the faces they choose. Quadraat and Filosophia are not faces I'm drawn to for the work in my charge. But as good designers they can pull off good designs with these faces.</p>
      <p>As for Plantin: I have yet to see a digital version I like. That's too bad, for I believe Plantin has inherent good qualities that could come forth if it were well digitized. Maybe now there's a good one; I gave up looking a while back.</p>
      <p>Other art directors &amp; production managers for publishers should join me in pushing freelance talent in this direction. Onward with new types for new books!</p>
      <p>powers</p>
