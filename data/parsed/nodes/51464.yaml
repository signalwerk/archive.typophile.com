      <p>How interesting that Jan's fifteen recently-read books were set in twelve different faces. Presuming Jan reads American books, this gives the impression that US publishers use a considerable variety of fonts. This personal typographic census reminds me of a more ambitious project I tried (but failed) to launch in Italy about seven years ago. The idea was to measure the reading public's perception of book faces. </p>
      <p>Ten examples of a double-page spread from the text of a historical novel (paperback size), each set in a font commonly used by Italian book publishers (Times, a couple of Garamonds, Palatino, Minion, well-leaded Utopia, ITC Baskerville, Galliard, Rialto, Bauer Bodoni) were placed on a table. These ten different fonts came off a quality laser printer on off-white bookish paper. Each sheet had the same nice margins and the apparent size of each font was the same. Each sheet was given a number corresponding to its font and was folded in the gutter to give a more accurate idea of an open book. </p>
      <p>While examining the specimens, readers were asked the following questions about the different fonts: 1) Which is the most classical? 2) which is the most contemporary? 3) which is the most familiar? 4) which do you prefer to read? 5) which is the most difficult to read?</p>
      <p>The idea was to get a close idea of the reading public's perception of type and sort out the results according to: 1) sex, age, profession and residence; 2) educational level; 3) number of books read in a year; 4) type of books prefered and names of prefered publishers. </p>
      <p>A nation-wide «opinion poll» of this kind would need very heavy sponsorship. It would mean having interviewers behind tressle tables in (or near) bookshops or in open spaces like parks on Sundays. People would need to be relaxed and not in a hurry to spend time examining the specimens and answering the questions. I never got any further than playing this game with my typography students. But even in that teaching context — which was a fairly close facsimile of reality — it certainly helped to raise students' awareness of type.</p>
