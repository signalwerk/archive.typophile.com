    <p>I read novels for pleasure, never cared much about the typefaces the books were set in (unless it was horribly bad to read). Working in advertising I didn’t have to deal with setting large amounts of text (especially not prose) but rather designed in display sizes or tried to match the corporate content. But ever since I joined this forum I couldn’t help it, I started looking up the fonts in books. Today I looked up the textfaces of the 15 books I read recently. All books are paperbacks (and novels), some older, some new (I buy quite a lot of used books).</p>
    <p>Here goes:</p>
    <p>Candida<br>
    Monotype Garamond<br>
    Caslon 540<br>
    Plantin<br>
    Stempel Schneidler<br>
    Stempel Garamond<br>
    Rotis Serif<br>
    Stempel Garamond<br>
    DTL Fleischmann<br>
    ITC Mendoza<br>
    Stempel Garamond<br>
    Stempel Garamond<br>
    DTL Documenta<br>
    Minion<br>
    Baskerville (don’t know exactly which one)</p>
    <p>Stempel Garamond seems to be <em>the</em> bookface. Really lovely are the DTL-faces.<br>
    And yeah. You may call me a geek.</p>
