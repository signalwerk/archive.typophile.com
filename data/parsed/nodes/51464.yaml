      <p>How can the publishing industry be encouraged to include a colophon inside all of its titles?</p>
      <p>The typeface designer of a particular book's typeface deserves just as much recognition as the book designer and the cover designer and the illustrator and the person who took the author's photograph, etc.</p>
      <p>Even if it is a line or two on the copyright page, I want to know the typeface name, the point size, the foundry, and the designer's name.  It doesn't always have to be a long description on its own page in the back of the book.  Just something short and sweet.</p>
      <p>Is this asking for too much?</p>
      <p>Rahim</p>
