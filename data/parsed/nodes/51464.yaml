      <p>”Sorry James. German books by German publishers.”</p>
      <p>Yes, that was very presumptuous of me, wasn't it? Dear Jan, I'm the one who should be saying sorry!<br>
      That you refer to faces used by German publishers makes your report even more interesting. All I can say, by contrast, is that Italian publishers are far less adventurous. </p>
      <p>The overwhelming majority of Italian books are not designed at all but are simply part of an automatic production process where only the jacket is designed. That is one reason why "safe" Garamondish faces predominate inside the books — to the point of nausea. </p>
      <p>Will's report above also testifies to a design climate that is inspiring and lively. Nevertheless, an interesting wave of new Italian type designers has emerged over the past few years. And a very good-looking book showing many of them (Italic 2.0, published by De Agostini with dual English/Italian texts) came off the press three weeks ago. All I can hope is that Italian publishers start to open their eyes and put some of the young talent to good use. </p>
      <p>I agree about Plantin. Before the letterpress era ended it was unbeatable for texts in small sizes on art paper, and to think that it was produced in 1913, ten years before Morison set foot in Salfords!</p>
