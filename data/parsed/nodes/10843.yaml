  html: <p><b>SALT LAKE 2002 SIGNAGE &amp; MOTION GRAPHICS?</b> <br> <br>;i'd like to know what typeface is being used for the nbc graphics for the 2002 winter olympics (<a href="http://saltlake2002.com/" target="_blank">salt lake 2002</a>), as well as the typefaces being used for the signage.  does anyone know what design firm did these?  (nbc obviously being seperate) <br> <br>;the main graphic for nbc displays characteristics similiar to rotis serif, but is obviously not.  i know it is not a proprietary face, because i've seen it in coca-cola's ads as well. <br> <br>;i'd also be interested in everyone's opinions of these graphics and the typography in general. <br> <br><img src="http://www.typophile.com/forums/messages/83/809.gif" alt="salt lake 2002 signage icons"></p>
