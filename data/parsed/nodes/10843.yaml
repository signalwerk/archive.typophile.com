    html: "<p>;so, the salt lake 2002 graphics seem to be using <a href=\"http://www.adobe.com/type/browser/F/FRUT/F_FRUT-10067000.html\" target=\"_blank\">frutiger</a>, but no one's mentioned the typeface nbc's using yet --that's the one i'm most interested in. <br> <br>;i agree with the general sentiment that the graphics really stink.  a lot.  i thought of popsicle sticks the first time i saw them, too: <i>i wanted something to gag myself with</i>.  the extruded/beveled versions made me laugh the first time i saw one spinning next to bob costas' head. <br> <br>;off type, i am fortunate to live right on the border of canada, here in metro detroit.  we watch most events on <a href=\"http://cbc.ca/olympics/\" target=\"_blank\">cbc</a>, so we're not tied to the <a href=\"http://story.news.yahoo.com/news?tmpl=story&amp;u=/ap/20020209/ap_on_sp_ol/oly_screen_plays_1\" target=\"_blank\">taped coverage</a> that nbc is dishing out.  <br> <br>;cRaig</p>"
