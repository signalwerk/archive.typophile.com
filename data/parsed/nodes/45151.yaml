    html: <p>One thing I would love to see in writing about type design is an examination of good spacing in existing type, explaining why a well-spaced typeface actually does work well. I have at least half-a-dozen books that repeat the Tracy formula or some variation, and that’s a waste of paper given that its on the internet anyway. Type design can be very counter-intuitive, and while I have figured out plenty of this stuff on my own, spacing is one area that really drives me nuts.</p>
