      <p>While Tracy does a good job of writing about spacing, I think the aspiring type designer should explore spacing on their own, and not give so much weight to these mighty tomes. Straight-to -straight, round-to-round, and straight-to-round values are established first and then after that, it really depends on the type design. Never use kerning to fix anything until you have exhausted all your options with metrics.</p>
      <p>I’m currently working on a set of fonts that were done as a custom project for a major magazine by a very reputable foundry. The AD was complaining about the kerning, and after many years of living with it they hired me to fix it. (among other things)</p>
      <p>It was amazing how poorly thought out the spacing and kerning was. Overly tight round-to-round combinations were adjusted with positive kerning. Straight-to-round combinations were similarly adjusted via kerning. Just one of the messiest fonts I had ever encountered. No wonder they had problems. After stripping the kerning out of the font. It was a simple matter to readjust the straight-to-straight and round-to-round values so that the fit needed no positive kerning. A few hours of work and it was done.</p>
    html_clean: |-
