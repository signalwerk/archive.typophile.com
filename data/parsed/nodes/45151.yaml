      <p>This could be interesting, yet I think this is something which every type designer needs to do for himself.<br>
      For example, you might analyze typefaces by different designers or foundries in search for some common spacing laws — to find that there are none. There is nothing like good-spacing-per-se, everybody has a different approach. At least this was my conclusion so far. The differences might be minute since most people seem to start with strings like the ones sketched above, but the differences are still there. For my taste (obviously Mr Montalbano’s too), it is a frequent mistake that round letterforms get too little space and then need positive kerning. On the other hand, one could regard this as a special method.&nbsp;&nbsp;;-)&nbsp;&nbsp;For my taste, people tend to space uppercase letters (sometimes lowercase letters too) too tight and then end up with need for an endless list of kerning pairs. &amp;c.<br>
      I bet that such an analysis reveals more about the judge than about the analyzed typeface’s spacing/kerning.</p>
      <p>Karsten</p>
