      <p>James’ advice is mighty solid. This might also be helpful:</p>
      <p><a href="http://www.typophile.com/node/30960" title="http://www.typophile.com/node/30960">http://www.typophile.com/node/30960</a></p>
      <p>Most people find it is the diagonals that are especially hard. vwx and sometimes r depending on how it’s designed. You may want to leave those for last.</p>
      <p>I also recommend watching your counterspaces vs. letterspaces. You may find it’s hard to kern a design where those are not considered together. I often see new designs with really enormous counters and smaller than needed spaces between letters. The scale the type will be used also has an impact but a more subtle one.</p>
