      <p>I would add to the excellent comments so far a couple of things. </p>
      <p>First, in Tracy’s defense he does say that getting the control characters spaced right is difficult and worth taking time over. He never says that there is a mechanical rule. </p>
      <p>Second, I would add that when you are doing your first fonts, you are likely to have to revise your initial work several times. </p>
      <p>To get the balance right between control characters right I had to do more characters and check the affect on words, and re-adjust. In the characters that don’t echo the shapes of the control characters—s, g, t, etc., I had to redraw several times to get them to space properly. And the italic was even more difficult in terms of spacing and redrawing. Hopefully, as you gain experience there is less need to do such re-working, but expect it in your first efforts. </p>
      <p>Finally, I note that there are different philosophies for handling the diagonal characters in digital type. It seems that some prefer to space them with negative side bearings, and kern them out more widely as needed. Others prefer to space them positively and kern them in negatively as needed.</p>
