      <p>The combinations: nn nu un on no vn give you the groundwork if you ballance the counter space with the sidebearings. Don’t get all hung up on exact numerical formulae since there is much variation depending on how round or flat your curves are, how bold your strokes are, how much contrast there is in your strokes and the serif size and form if they exist. Give yourself some time to space properly and don’t be surprised if you have to do some redrawing of your glyphs to get it all to work out.</p>
      <p>  ChrisL</p>
