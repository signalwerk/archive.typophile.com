    <p>Greater Albion's next two releases are imminent-Granville inspired by Victorian era shop signage, and Federal Streamliner, based on lettering seen shooting past on the side of an old railway carriage!</p>
    <p>These should appear in the next day or so on Myfonts.  In the meantime there are previews <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> on our blog.</a></p>
