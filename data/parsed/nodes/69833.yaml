  html: |-
    <p>I am new at this forum, so I’m not sure whether this is the right place to post these kind of questions, but I need a typeface for everyday use with Cyrillic letters. Being a poor student, I don’t think I can afford an expensive, professional one. Does anyone have an idea or two?</p>
    <p>What I’m looking for is to begin with, a good all-round typeface, like Garamond but for Cyrillic. The only thing I have now is Times Cyrillic, which I find rather boring. But if anyone has great tips for sans serif fonts, I’d appreciate that as well. And, as previosly stated, I’d prefer free fonts if that is possible.</p>
    <p>Thanks in advance!</p>
    <p>Caspian Rehbinder</p>
