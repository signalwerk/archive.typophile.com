    html: |-
      <p>It may well be Caledonia. Looking at V&amp;M's <em>The Type Specimen Book</em>, the six and seven point sizes of Linotype Caledonia had very small descenders, while the larger sizes, even eight point, had the more generous descenders with which I am familiar.</p>
      <p>The book in question was set in a smaller size than is usual for books, presumably so that it could be a small volume and economical despite being printed on glossy paper.</p>
