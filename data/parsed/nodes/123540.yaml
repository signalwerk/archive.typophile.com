    <p>Saw this typeface in an old AMPHOTO book. I feel I should know what it is, but I don't. It looks a lot like Caledonia, but it's less distinctive, leaning a bit towards Century Expanded. Also, it has very short descenders.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bold_sam_5519.jpg"></div><p></p>
    <p>Here's the bold face, as that may be helpful.</p>
