      <p>I don't see anything wrong with Small Caps B&amp;H. PhD is mixed case but so is every first word in a sentence.<br>
      I think the consistency between ATM and B&amp;H is more important than the visual balance between PhD and B&amp;H (that said I think Garamond Premier has very appropriate small caps for this situation).</p>
