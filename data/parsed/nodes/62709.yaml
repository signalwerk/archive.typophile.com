      <p>No I think U&amp;lc PhD is more appropriate in text.<br>
      It's true that Hedges and Benson are proper names but because it's a brand name I wouldn't keep the initials full caps in body text.<br>
      JFK is set in full caps in 'JFK gave a speech in July 1959' but in small caps in 'We landed in JFK at dawn'</p>
