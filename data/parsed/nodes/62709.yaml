    <p>Hello, </p>
    <p>I'm setting a book of short stories and one story contains two slightly awkward initialisms close together:<br>
    PhD - which has been discussed elsewhere on Typophile and I think is probably best left in mixed case, no small caps.<br>
    Then two lines below:<br>
    B&amp;H - a common UK abbreviation for Benson &amp; Hedges cigarettes (nobody says the full name).</p>
    <p>Elsewhere in the book I have used small caps for things like ATM (on the same page as PhD and B&amp;H), CDs, and  RAF; however, with B&amp;H in close proximity to PhD and having an ampersand, I wasn't sure of the best option.</p>
    <p>•&nbsp;All Caps maybe be 'correct', but I'm worried that it stands out a little too much.<br>
    •&nbsp;Small Caps looks odd, particularly with the mixed case PhD two lines above.<br>
    •&nbsp;Uppercase B and H with a small ampersand (part of the glyph set for Garamond Premier Pro) seems to balance the shape of PhD better, but I don't know if it is correct use of the small ampersand.<br>
    • Something else.</p>
    <p>Any ideas?</p>
    <p>Additional information:<br>
    •&nbsp;There are no other regular ampersands in the book, only one italic ampersand in a title, and one italic ampersand in an italicised film name.<br>
    •&nbsp;Justified, Garamond Premier Pro regular, 10pt/12pt</p>
