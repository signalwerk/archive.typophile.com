      <p>True that. I did enjoy the music, especially the Wolfraam performance. But the House Industries set was not so different from their 2004 TYPO appearance. I would have been disappointed, but I wasn't because I think that "Suburban Curse" is one of the best songs ever.</p>
      <p>Aside from the TYPO Music night, most of my favorite talks had nothing to do with music. But I am a type designer nerd, and I guess I am in the minority of attendees to a more general-themed graphic design conference. Although, I did enjoy the music angle that you and Yves brought into your presentation.</p>
