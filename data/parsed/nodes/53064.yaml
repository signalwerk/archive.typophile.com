    <p>So, who's coming to <a href="https://www.typoberlin.de/2009/index.php?node_id=1&amp;lang_id=2" rel="nofollow">TYPO Berlin</a> (May 21–23)? I saw Nick Shinn will be speaking. Any other Typophiles attending? (If you register TODAY you will probably still get the early booking rate. Yes, I know, it's kind of late to state this now.)</p>
    <p>I registered a few days ago, after realizing I can get the student rate :-). I've been there twice before (2004, 2006) and it was always great input. Would be wicked to meet some Typophiles there!</p>
