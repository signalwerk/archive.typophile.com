  html: |-
    <p>Hi,</p>
    <p>I've been asked to create some mock-ups for a cafe voucher. I'm not really that confident or competent at graphic design. I just wanted some advice from others to where I can improve. Any positive criticism is appreciated.</p>
    <p>The design has been left to my discretion. The images I've used are istockphoto comps, I'm not going to purchase them or fix them up till I know which one I'll use. There is a logo for the cafe but I've removed it from these.</p>
    <p>Thanks.</p>
