    html: |-
      <p>Most of time, having lots of <code>!important</code> declarations indicate a poor understanding of the cascade. But of course, it can  <a href="http://www.w3.org/TR/CSS21/cascade.html#important-rules" rel="nofollow">be used in an appropriate way</a>, too.</p>
      <p>The <code>z-index</code> comes with positioned – and stacked/overlapping – elements. It depends on your design ideas and intentions whether you need it or not. You sure can do splendid things without it.</p>
      <p><a href="http://www.quirksmode.org/blog/archives/2010/03/css_vendor_pref_1.html" rel="nofollow">Vendor-specific prefixes</a> like <code>-moz</code> can be used to serve declarations that haven’t been standardized (yet) to certain browsers that already understand them.</p>
