  html: |-
    <p>I think I have got to a point with Css where I can build anything I or someone else have designed, my codes validates and also work in older versions of IE.</p>
    <p>However, I can't help thinking that I'm still not there yet because my codes doesn't look the same as my web designer collegues. Their codes have a lot of '!important' and '-moz' and they use z-index and mainly position elements. I've never used !important and -moz and z-index in my codes (never had to) and I tend to float most things which they've already told me I shouldn't do.</p>
    <p>The books I've read haven't taught me the above. Should I be coding like how they are? I would like to get really advanced at CSS. </p>
    <p>So what advanced books out there should I be looking at reading? I'd like something quite new that also has a small snippet of Css3 but I want the focus to be Css2.1. </p>
    <p>This book looks like it's inline with what I'm looking for Smashing CSS: Professional Techniques for Modern Layout - Eric Meyers</p>
    <p>Anyone read it? Can anyone recommend anything else?</p>
    <p>P.s - I have read CSS Mastery - I'd like something even more advanced.</p>
