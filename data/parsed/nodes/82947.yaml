      <p>There's good CSS and bad CSS. It sounds a lot like you've found the path to good CSS. Don't feel like you have to emulate the hacks and workarounds of your colleagues. If you're getting good feedback from clients, back-end developers, and users, and your code works on the browsers it needs to, then you're doing great.</p>
      <p>--John</p>
