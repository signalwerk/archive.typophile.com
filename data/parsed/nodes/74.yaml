    html: "<p>Hello there Tom, <br> <br>Here's the Adobe Photoshop mini-tutorial for distressing type in order to  <br>achieve a \"stamped\" look. This little trick I developped almost a decade  <br>ago, so I hope I remember it all correctly. <br> <br>Create whatever type composition you need in Illustrator or directly in  <br>Photoshop. Just remember to keep the resolution fairly low, because  <br>we're going to need pixel texture halfway through. I created this example  <br>in Illustrator using House Gothic 23 ThreeD Fill at 72pt/64pt on a  <br>360x180pt canvas and opened it in Photoshop as a grayscale image at  <br>72 ppi. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10621.jpg\" alt=\"Step_1\"> <br> <br>Select the black type areas with the magic wand or using an alpha  <br>channel based on your piece <i>(Duplicate channel...: Black: invert -&gt;  <br>Select...: Load selection: Black copy: new selection)</i> This prevents you  <br>from mucking up the white background. <br> <br>Apply a High Pass to \"eat away\" the insides of the characters <i>(Filter:  <br>Other: High Pass...)</i> Play a bit with the slider: for the example I set the  <br>Radius to 10 pixels and applied it twice. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10622.jpg\" alt=\"Step_2\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10623.jpg\" alt=\"Step_3\"> <br> <br>Apply a fair amount of Gaussian noise to achieve the \"grainy\" texture.  <br><i>(Filter: Noise: Add Noise...: Gaussian)</i> For the example the slider was  <br>set to an amount of 50. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10624.jpg\" alt=\"Step_4\"> <br> <br>Deselect <br> <br>Increase to desired resolution by resampling. <i>(Image: Image size...:  <br>resample image)</i> I trippled the resolution from 72ppi to 216ppi. <br> <br>Diffuse the image to mask remaining bitmapping of the character shapes  <br><i>(Filter: Stylize: Diffuse...)</i> and apply a Gaussian blur of 1 pixel to remove  <br>the tiny pixels created by the Diffuse filter. <i>(Filter: Blur: Gaussian  <br>Blur...)</i> <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10625.jpg\" alt=\"Step_5\"> <br> <br>Increase the brightness and contrast until you reach the desired amount  <br>of \"inking\". <i>(Image: Adjust...: Brightness/Contrast)</i> I set both sliders to  <br>+50. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10626.jpg\" alt=\"Step_6\"> <br> <br>Treshold the image to prepare for conversion to a bitmap image. Here  <br>you can also play bit with the slider until you reach the desired amount  <br>of \"inking\". <i>(Image: Adjust...: Treshold)</i> I set the slider halfway. (128) <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10627.jpg\" alt=\"Step_7\"> <br> <br>Here's what it looks like from up close: the effect is perfectly random. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10628.gif\" alt=\"Step_8\"> <br> <br>Convert to a bitmap image (Image: Mode: Bitmap...: 50% treshold),  <br>save as TIFF and import in your lay-out software of choice (InDesign  <br>rewlz!) Et voil</p>"
    html_clean: "<p>Hello there Tom, <br> <br>Here's the Adobe Photoshop mini-tutorial for distressing type in order to  <br>achieve a \"stamped\" look. This little trick I developped almost a decade  <br>ago, so I hope I remember it all correctly. <br> <br>Create whatever type composition you need in Illustrator or directly in  <br>Photoshop. Just remember to keep the resolution fairly low, because  <br>we're going to need pixel texture halfway through. I created this example  <br>in Illustrator using House Gothic 23 ThreeD Fill at 72pt/64pt on a  <br>360x180pt canvas and opened it in Photoshop as a grayscale image at  <br>72 ppi. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10621.jpg\" alt=\"Step_1\"> <br> <br>Select the black type areas with the magic wand or using an alpha  <br>channel based on your piece <i>(Duplicate channel...: Black: invert -&gt;  <br>Select...: Load selection: Black copy: new selection)</i> This prevents you  <br>from mucking up the white background. <br> <br>Apply a High Pass to \"eat away\" the insides of the characters <i>(Filter:  <br>Other: High Pass...)</i> Play a bit with the slider: for the example I set the  <br>Radius to 10 pixels and applied it twice. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10622.jpg\" alt=\"Step_2\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10623.jpg\" alt=\"Step_3\"> <br> <br>Apply a fair amount of Gaussian noise to achieve the \"grainy\" texture.  <br><i>(Filter: Noise: Add Noise...: Gaussian)</i> For the example the slider was  <br>set to an amount of 50. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10624.jpg\" alt=\"Step_4\"> <br> <br>Deselect <br> <br>Increase to desired resolution by resampling. <i>(Image: Image size...:  <br>resample image)</i> I trippled the resolution from 72ppi to 216ppi. <br> <br>Diffuse the image to mask remaining bitmapping of the character shapes  <br><i>(Filter: Stylize: Diffuse...)</i> and apply a Gaussian blur of 1 pixel to remove  <br>the tiny pixels created by the Diffuse filter. <i>(Filter: Blur: Gaussian  <br>Blur...)</i> <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10625.jpg\" alt=\"Step_5\"> <br> <br>Increase the brightness and contrast until you reach the desired amount  <br>of \"inking\". <i>(Image: Adjust...: Brightness/Contrast)</i> I set both sliders to  <br>+50. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10626.jpg\" alt=\"Step_6\"> <br> <br>Treshold the image to prepare for conversion to a bitmap image. Here  <br>you can also play bit with the slider until you reach the desired amount  <br>of \"inking\". <i>(Image: Adjust...: Treshold)</i> I set the slider halfway. (128) <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10627.jpg\" alt=\"Step_7\"> <br> <br>Here's what it looks like from up close: the effect is perfectly random. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/10628.gif\" alt=\"Step_8\"> <br> <br>Convert to a bitmap image (Image: Mode: Bitmap...: 50% treshold),  <br>save as TIFF and import in your lay-out software of choice (InDesign  <br>rewlz!) Et voil</p>"
