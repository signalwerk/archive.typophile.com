  html: |-
    <p>The Muna typestyle is everywhere in the Arab countries. It is not difficult to find an example of its usage anywhere you happen to be in these countries. Ranging from its usage on huge commercial advertisements, Arab Spring protest banners, shop signs, to small tickets, the Muna font is usually the designer's or typesetter's preference.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/needchange300_5823.jpg"></div><p></p>
    <p>The main reasons for the popularity of the Muna font is the conformity of the font's characters with the traditional letter forms. This conformity however did not prevent its designer, <a class="freelinking external" href="http://www.abdulla.faris.com/" rel="nofollow">Abdullah Faris</a>, from developing a fresh and contemporary style design. These two reasons, in addition to some beautiful and ingenuous details used in the design, helped to promote the popularity of this font. The popularity of Al-Nashir Al-Sahafy publishing platform, for which the Muna font was designe, is also an important factor that contributed to the widespread usage of this font.</p>
    <p>These issues and more, are discussed in my <a class="freelinking external" href="http://arabictype.wordpress.com/2012/01/02/muna-abdallah-faris/" rel="nofollow">latest blog entry on this successful font</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/munavsyaqout600_4062.jpg"></div><p></p>
