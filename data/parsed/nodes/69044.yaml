    <p>Hi guys,</p>
    <p>I'm doing a project for the university wich consists in making a book about "Adrian Frutiger" and how he focusses on type legibility over any thing. So, I explain in it how he looked at the typography, how It must be done and why some ones are more readables than other ones (as for example, why Avenir is better for reading than Futura, as its like a re-design of it).</p>
    <p>So, the problem is that I'm getting stucked getting HQ photos of Frutiger types to put in the book, as Internet has not a lot of images from he / his types. Also I need them in HQ cause I'm making a 20x20 book, so the resolution have to be bigger and also have a good ppp, not 72 from screen wich is not enough...</p>
    <p>I'm taking some captures from his DVD "Adrian Frutiger, the man of black &amp; white" but I want to have some photos of his types applied to things (brands, signals, posters, whatever).</p>
    <p>I would be glad if you help me with the research to found good Frutiger images.</p>
    <p>Excuse me if this posts don't goes here, I didn't know where to put it.</p>
    <p>Thanks in advice!</p>
