      <p>Um, have you tried books? You know, the offline things made of paper?<br>
      Seriously, the Frutiger monograph («<a href="http://www.springer.com/birkhauser/architecture+&amp;+design/book/978-3-7643-8581-1" rel="nofollow">Adrian Frutiger: Typefaces. The Complete Works</a>», I'm sure you can get it from/via your library) is an amazingly rich book. I'd say you *need* to look through that if you do a project about Frutiger.</p>
