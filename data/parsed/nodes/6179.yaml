    html: <p>On a slight tangent — nobody’s addressing the <span class="caps">BEST</span> way to get a font for free, which is to get your client to pay for it. In the not-too-distant past, people paid an arm and a leg for typesetting (got their money’s worth in terms of quality). Now the client assumes typesetting is part of the designer’s job, and included in the fee. If you think a particular font is really integral to your design, it doesn’t hurt to ask the client to at least split the cost with you. I’ve gotten some of my favorite fonts that&nbsp;way.</p>
