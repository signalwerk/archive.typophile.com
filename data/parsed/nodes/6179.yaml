    html: <p>Free fonts also often contain limited character sets, which can be a drawback. <br> <br>But it depends so much on what you're planning to use it for, i.e. text or display - most free fonts seem to be display. I think it's exceedingly rare to find a fully developed text font for free, with all the bells and whistles. It's different if you just need a few words. <br> <br>Also consider how the font looks at various sizes. If it's well proportioned it should hold up at both small and large sizes. But again, depends on your usage.</p>
