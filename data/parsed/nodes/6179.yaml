    html: "<p>This may become the ‘thread that wouldn’t die’, but I’d like to make a stab at answering your latest question about the quality of a free font design. <br><br>The ﬁrst thing is the hardest. Know whether it is original or copied and re-named. If it’s a rip-oﬀ you should shun it like the plague. <br><br>Then I would say you should see if it has design consitency. Are the letters the same height that should be? Are the strokes of the letters properly executed. Are the letterforms related in their shapes and the way stems intersect? Are the serifs appropriate-looking? Is the x-height consistent? <br><br>The last part is subjective and can over-ride the previous considerations at times: Do you like the way it looks when you use it in words? Are the letters spaced the way they should be? (Poorly designed fonts often don’t have much letter-ﬁtting or kerning done.) Is the lettering reﬂecting a strong style in a way that seems original, or is it just like 50 other fonts that use a similar gimmick, like square counters for a ‘tech look’ (blecchhh!). <br><br>Those are some of the thoughts that go through my mind looking at a free font for the ﬁrst time and trying to decide whether it’s worth downloading, even at that price. To me if it’s garbage, and I won’t use it, what diﬀerence does it make if it’s&nbsp;free?</p>"
