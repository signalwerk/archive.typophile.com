    html: <p>I've done more looking at the Roger White collection and I have to say I have huge doubts that all of his fonts are what he described to you Mike. Maybe some of them are what he said, but I doubt that most of them are.  <br> <br>He even has the ever popular freeware script 'Black Chancery' (Newborough) in there! Not to mention ITC Weidemann (Curborough), Handel Gothic (Newtown &amp; Tamworth Gothic), Helvetica (!!) (Milford, Swansea &amp; Yoxall), ITC Benguiat Gothic (Gratwich), Palatino (Queens Park) and Vivaldi (Hanford Script).  <br> <br>Maybe these are new digitizations, as he describes, but they can't all be from 40 year old books, and they can't all be things whose names he doesn't know. <br> <br>I didn't want to spend more time identifying others, but I am convinced very little of this collection has not been digitized before. Some of his italics were just obliqued Romans. I can't say I am impressed by what he has there, for the most part. <br> <br>That doesn't take anything away from the other points you so forcefully expressed. I agree with much of it. <br> <br>And again, I hope you realize that you are entitled to your opinions and we value your contributions here.</p>
