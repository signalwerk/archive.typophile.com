    html: <p>I guess the more general answer to your question is that I know a good number of fonts on sight, but for the thousands of others I rely on my sleuthing techniques. I love looking things up. Basically I have a number of places to try, but I typically start with MyFonts or DaFont (if it looks like it’s going to turn out to be a free font). I used to always start with WhatTheFont, but haven’t lately, for some reason. Then I move on to one of the likely other foundries whose catalogs aren’t on MyFonts. If I can’t get it in any of those ways, I usually let it go after&nbsp;that.</p>
