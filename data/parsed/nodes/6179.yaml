    html: <p>Mike ... i see you had some stuff on your mind, <br>but please stick around. You do too much good for the <br>forum. It's pretty late here, so I'll try not to ramble. <br>But the ID Forum really is a melting pot with a <br>hundred unique perspectives, perspectives shaped <br>by where a person stands and watches the type wheels spin.  <br>Those who earn their living in and around the wheels are naturally  <br>going to hold stronger opinions about  <br>certain things. Maybe even hypocritical opinions. <br>Or elite opinions. <br> <br>It's the nature of the beast. <br> <br>But please, don't feel as if there are bridges burned. <br>Some times you gotta speak up to feel whole. <br>Certainly, that is something is to be respected. <br> <br>bj</p>
