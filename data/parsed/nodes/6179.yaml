    html: "<p>Mike,  I second (or third) the idea that we need and want you to stay a part of this forum. And you certainly did not offend me in any way with your reply. I know perhaps we have gotten a tad off the 'Type Identification Board' topic, but those issues are ones we all have to deal with and make our own judgments about.  <br> <br>The information about Roger White's fonts is interesting, but it does seem to leave some questions about the originals he was working from. As you say Caxton isn't as old as he stated, unless Usherwood arrived at Caxton in the same way Roger White did, by digitizing something older. In the 'Modern Encyclopedia of Typefaces'  it says: \"Design prepared originally for Typesettra Ltd in Toronto, a design studio owned by the late Leslie Usherwood (1932 - 1982). Rights in the typeface were assigned to Letraset in 1981.\" <br> <br>I don't know how the typeface exists in England in metal form before that period, but maybe there is an explanation. I am also more intrigued to review the other White fonts and see how they match up with other typefaces historically. I know there was a Baskerville, and this can be a valid revival, but I prefer revivals to use the original name, so that we know what they are based on. <br> <br>Anyway, once more, I echo Yves words <i>\"don't you go anywhere Mike\"</i>.</p>"
