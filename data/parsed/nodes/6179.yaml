    html: <p>This has been an interesting thread. I appreciated Tiﬀany’s referral to Gaultney’s Gentium. It looks like a very nice typeface, and I have just downloaded it. <br><br>However, in reference to Mike F’s  recommendation of Roger White’s fonts, I have to say that browsing the collection showed a lot of heavily ‘inspired’ fonts. Sudbury, for example looks remarkably similar to Les Usherwood’s fonts, especially ‘Lynton’. Yes I see some diﬀerences, but the character of the font is not original, in my judgement. Many other fonts on his site also seem like re-named re-interpretations (to give the beneﬁt of the doubt) of other exisiting fonts. <br><br>For me to be impressed by free fonts, I would like to know that they are really original&nbsp;work.</p>
