    html: <p>Alex, <br>As Patricia said, what you seek is quite rare. <br><br>First I’ll mention Graham Meade, who states himself that his fonts aren’t the very highest quality, but he clearly puts lots of time into them (and there are plenty of fonts one can ﬁnd on MyFonts for sale that ail big time in the quality department). Check out Meade’s huge  <a href="http://www.moorstation.org/typoasis/designers/lab/n_s.htm" target="_blank"> Street family</a> for an example. Most of the fonts in the family have 88 kerning pairs. These are pairs of characters coded within the font for custom spacing relative to each other. It’s a time-consuming process and one way to check on quality. 88 is on the low end, but most free fonts have none. Character sets are full in the Street family. <br><br>Also see the incredible output of <a href="http://www.rogersfonts.org.uk/index.html" target="_blank"> Roger White</a>. Kerning pairs vary from about 300 to 900-plus. Character sets are complete. The Sudbury family would be a good one to check out. <br><br>Another incredible free oﬀering is Igino Marini’s <a href="http://www.iginomarini.com/fell.html" target="_blank"> Fell Types</a>. <br><br>Oh, and of course there’s <a href="http://www.stormtype.com/free.html" target="_blank"> Storm’s Lido</a>. <br><br>Note that some (all?) of these font families are free for noncommercial use only. <br><br></p>
