    html: <p>I can't speak for anybody else - after 20 years in this biz I just know a lot of fonts. If I don't recognize a font at all I don't even try - leave it to the experts. No algorhythms. But if I recognize and can't immediately ID a font I'll turn to my font collection or a book, or perhaps a site where I might have seen it. It's like trying to remember the name of a band or a movie title - it bugs me if I can't figure it out. <br> <br>This site is one way I take a break from work, when I'm too lazy to actually get up from my computer.</p>
