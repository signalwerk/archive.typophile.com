      <p>Well, Mike Y., when I discovered Mr. White's body of work some time ago, I knew that it would be questioned somewhere down the line. It's a reasonable thing to do under the circumstances � as long as one doesn't yell, "Pirate, Ripoff!" in kneejerk fashion without knowing all of the facts. Your moderate, tactful approach is appreciated (and quite rare here). <br> <br>I had questioned the legitimacy of these fonts myself and chose White's Plymouth � a digitization of Abbott Oldstyle � as a test font to query the man about. <br> <br>I saved his response for just such an occasion: <br> <br>--- R. White Quote --- <br>My fonts have all been developed from the sample books and in some cases wooden blocks found in the attic of The Benhill Press, a local printing firm in Rugeley, Staffs, England. The sample books, trays of metal type and hand carved wooden blocks were used on very old fashioned printing presses up to the mid 1990's when the company finally succumbed to modern technology. <br>   My part in it was to convert some of the less common typefaces from hot metal to electronic versions. To this day there are at least ten of my fonts which, as far as I know, are the only source of electronic versions, fonts such as Rosart, Fry's Ornamented etc. <br>   My method was simple. I had printed, by Benhill Press, several thousand sheets of paper with a 1 millimetre grid on it printed in pale yellow. Every character in every font was hand drawn onto a separate A4 sheet of paper. The grid enabled me to get the correct proportions for each character. When the set was finished I photocopied them, and because yellow does not copy on a photocopier I was left with a clean image on a sheet of paper. In the early 1990's, when I started this work, 600dpi scanners were the best available, and each character was scanned as a bitmap. These were then imported into a package called Type Designer which was developed in Germany by Manfred Albracht. Bear in mind also that Windows was still in versions 1 and 2 and multi-tasking hadn't really taken off at the time. Having imported the characters one at a time into the font the outlines were cleaned up by hand before the fonts were generated. Hinting and kerning pairs were then added manually to fine tune the resultant font. <br>   The sample books at Benhill Press only identified about 50% of the font names so often I didn't know what I was working on. When I was working on wooden blocks I had to think in reverse because I was looking at the block which produced the printed character rather than the finished character itself. I named all of fonts that were not identified, Plymouth being one, after British towns and Cities. <br>   Four of my fonts, Cardiff, Swansea, Newport and Wrexham were developed from standard fonts but included the accented characters which are used in the Welsh language, but which are not included in the ISO character sets. <br>   Benhill Press was established in 1876 in the town. The books which I worked from had been prepared in the 1950's, and many of the typefaces had been in use for many years before that. The books were all at least 40 years old when I started my work and you also need to bear in mind that there are differences in copyright laws between different countries. Generally, in Britain, copyright on a design expires after 25 years, so none of the designs which I worked on could possibly have been still in copyright. <br> <br>So there you have it. Best wishes, Roger White <br>-- End R. White Quote -- <br> <br>That still leaves us with Sudbury/Caxton � a relationship I was ignorant of. The digitizations of the two vary in many respects. I certainly don't believe Sudbury to be a renamed Caxton. Surely a portion of my own ignorance was at work in this case. Quite possibly others of these fonts are in the same boat. <br> <br>There's a disparity between Mr. White's statement that, "The books were all at least 40 years old when I started my work" and Linotype's date of 1981 for Caxton. The Linotype and MyFonts entries infer that Caxton is an original design by Mr. Usherwood. Does anyone know if this is the case � or is Caxton an interpretation of an older typeface? Can anyone from Britain confirm that 25-year design copyright expiration? Does it apply to fonts? <br> <br><br>
      </p><blockquote><hr size="0"><!---quote-!--><b>quote:</b><p>Does that cover all the bases?<!---/quote-!--></p><hr size="0"></blockquote>
       <br>I think so. You even covered the offenses of some major foundries � Monotype being an egregious example in the not-so-distant past. <br> <br>I've brought up these major foundry offenses here before. Offenses that were willful and resulted in fonts that brought in lots of money (the entire point in creating them). The topic yields total silence from the elitists here. And yet a minor character few people know about, who digitized a few fonts and gives them away for free offends (it appears � and likely out of ignorance) and the cry goes out (I'm not speaking here about this particular thread). Hypocrites! If I had to choose between a major type foundry, say Monotype, and Roger White in a battle of character and ethics, it would not be a tough choice. <br> <br>Thank you, Mike, for the well thought out statement of positions. I agree with pretty much all of them. Hopefully, I've not offended you too much with my own offshoot. I'm truly capable of your tact, but not here. The elitism and hypocrisy is just too thick. Yves not long ago denied any elitism and I laughed aloud. <br> <br>Not a single comment on those splendid Fell Types. Of course not. They're free. They must be bad, bad, bad. 'Nuff said. <br> <br>Obviously, I'm burning my bridges in this forum with this thread (Hey, I just heard several sighs of relief!). I've made myself a pariah � mostly by voicing occasional dissent. It's not tolerated here. <br> <br>Trust me nonposting lurkers here, there are gray areas of font copyright/parentage that are entered into by font makers at all levels. In this forum, however, if that font maker reaps an income from the font, attends typographic conferences, is a known name in the design field ... well, such an incursion is overlooked. Nary a word is said. <br> <br>If, however, a font maker opts to offer the font (an equivalent incursion into that gray area) for free ... well, he/she is beneath contempt. The font maker and the poster are asses. Posts and links within them are deleted. <br> <br>Think Nick Curtis here. Not the likes of Southern Software with their "1500 (Renamed Commercial) Fonts" for $15. See Mike Yanega's statement of positions again if you're confused. <br><br><p></p>
