    html: <p>So it is.  <br><br>I notice you apparently edited out your following question about the ethicality of digitizing typefaces.  Even though the question is gone, I have thought about this a lot, and since I raised the issue with my criticism, I would like to state my own personal position on it. <br><br>I think a digitization is ethical if the typeface design is no longer the property of the designer or the foundry that issed it (in other words, a revival of an old typeface). If an authorized digitization exists of a newer typeface, such as those of Usherwood’s Caxton, then digitization under a new name is unethical, in my view. <br><br>So what about the common practice of imitation of a successful design with an ‘interpretation’ or ‘adaptation’, or whatever other euphemism you choose? You can say it happens all the time, even among well-known foundries, and has throughout the history of type.  I still would call those instances unethical, but because of the ridiculous copyright/patent issues regarding typefaces, they would not apparently be illegal. <br><br>If two designers revive the same typeface under diﬀerent names, I guess it’s up to the user’s decide which is better and how much to pay for them. Neither should be worth as much as an original work, in my opinion. Alternate characters, kerning, and the ﬁdelity and quality of the letterform renderings would all be factors in deciding which I would consider to be the best. <br><br>Making a few alterations to someone else’s design and calling it yours is also unethical. That seems obvious. <br><br>Combining elements of various other typefaces to create a ‘new’ typeface is a bit ‘gray’, but seems basically  dishonest if it is represented as something new and not a hybrid of other designs. Nick Curtis tells you when he does this, and that I can respect. <br><br>Does that cover all the&nbsp;bases?</p>
