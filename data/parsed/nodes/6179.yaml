    html: <p>For this one, I started by searching MyFonts for the keywords "futuristic" and "scifi," since that's how a font like this would be classified. I even checked the free-font archive, DaFont, to no avail. Finally, I did a little tweaking on the file so that I got the letters black on a white background, and put it through MyFonts' <a href="http://www.myfonts.com/WhatTheFont/">WhatTheFont</a>, which yielded the answer. Once I saw what the font was, I understood why I couldn't find it with the proper keywords -- FF fonts typically don't have any, probably because they're relatively new to MyFonts, and there are a ton of them. Probably also because they're spending too much time on things like <a href="http://typographi.com/000894.php">Olympukes</a>, but we won't go into that here.</p>
