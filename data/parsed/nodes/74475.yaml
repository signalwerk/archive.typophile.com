    html: <p>The "TYPOGRAPHY" poster uses <a href="http://typography.com/fonts/font_overview.php?productLineID=100002" rel="nofollow">Champion Gothic</a> from H&amp;FJ. That family and <a href="http://typography.com/fonts/font_overview.php?productLineID=100013" rel="nofollow">Knockout</a> are as good as they come. Other wood type inspired fonts are available from <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/adobe_wood_type_1_vp/?affid=99346" rel="nofollow">Adobe</a>, <a href="http://new.myfonts.com/foundry/FontMesa/?refby=typographica" rel="nofollow">FontMesa</a>, <a href="http://new.myfonts.com/foundry/E-phemera/?refby=typographica" rel="nofollow">E-phemera</a>, <a href="http://new.myfonts.com/foundry/Wooden_Type_Fonts/?refby=typographica" rel="nofollow">Wooden Type</a>, and <a href="http://www.fontshop.com/fontlist/genres/wood_type/?affid=99346" rel="nofollow">more</a>.</p>
