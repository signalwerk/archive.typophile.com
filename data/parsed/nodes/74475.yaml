    <p>I've been looking for a variety of good fonts that are based off old wood type specimens from the good 'ol days. I knew this would be the place to ask. Anyone know of some good digitally revived wood type fonts?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/acc68d5631617268f74b60bcc55edb61974c5b78_m_4369.png"></div><br>
