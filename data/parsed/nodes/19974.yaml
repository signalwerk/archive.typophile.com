  html: |-
    <p>See also <a href="/node/14496" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Trajan</a>.</p>
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12157" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Books</a>&nbsp;: The Trajan&nbsp;Capitals</strong></p>
    <p>This small book is an outgrowth of the reproductions of the <a href="/node/14496" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Trajan</a> Capitals in Frederic Goudy’s own <a href="/node/15387" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">The Alphabet and Elements of Lettering</a>. In the introduction to this book, the author reveals his lack of enthusiasm for the drawings he did in the aforementioned book(s) and took the opportunity to revisit his drawings, with brief commentary. The text is accompanied by the letters reproduced by wood block printing in cool grey ink. It is set in his own Bertham type (his 100th, designed that same year) and dedicated to his&nbsp;wife.</p>
    <p><img src="/sites/default/files/old-images/37663_6743.jpg"></p>
