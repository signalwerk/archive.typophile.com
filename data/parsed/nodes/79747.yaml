    html: |-
      <p>Thanks for you're feedback Stephen, and the quick analysis Nick — it's hard to get this sort of thing where I am.</p>
      <p>Funny you should mention the Osama/Otama link actually. A similar thing happened back in the early 2000s when a rather successful New Zealand band called Shihad were trying to make it big in the States. They were advised that their name was too similar to Jihad, so they changed their name. With the name change, they also lost their soul and turned to absolute rubbish. </p>
      <p>Luckily though, when they failed in the states and came back home, they changed their name back and are currently going better than ever.</p>
      <p>Anyway, I couldn't seem to put my finger on the word, but there is a definite shyness that flows through the design when compared with something like Linotype's Didot — which I see as having a very strong graphic execution and character. To me, Otama heads more down the lineage of H&amp;FJ's Didot.</p>
      <p>I really like the flamboyant k too, but I've been looking at it (along with the g) as the character that is working the least from this quiet and shy perspective. Especially at subheading sizes from 14-24pt. It may be a stretch, but I'd like to try suggest that Otama has been influenced a lot by the philosophy and uniformity of grotesques like Helvetica and Gotham. Though shy is perhaps a more fitting and humane adjective than uniform.</p>
      <p>Thanks again for giving me some things to think about.</p>
