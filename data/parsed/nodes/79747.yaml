    html: |-
      <p>(I'd suggest the Critique section.)</p>
      <p>Offhand, the Q tail is odd, the B and R too thick at the curves joint, the e and s too narrow, the f ball too tight to the main stem, g ball too tight to the bowl and its diagonal too steep and thick, the tittles too small, the figure balls too small, 1 too short and the 7 stress backwards.</p>
      <p>I really like the k and would like to see that curviness in some other letters (it's there in e), possibly at the bottom of d, h, m, n and u, or even a 'u'ish y?—as things stand at the moment it is one of many display didones, with not a lot of unique personality to call attention to itself.</p>
      <p>Also, sounds too much like Bin Laden.</p>
