    <p>Hello all,</p>
    <p>I'd like to announce the release of the work-in-progress version of my new typeface, Otama. All thoughts and opinions are very much welcome and appreciated.</p>
    <p>Free to download from <a href="http://www.timdonaldson.com/otama-ep.zip" title="www.timdonaldson.com/otama-ep.zip">www.timdonaldson.com/otama-ep.zip</a></p>
    <p>Cheers,</p>
    <p>Tim</p>
