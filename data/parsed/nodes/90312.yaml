  html: |-
    <p>I would like to get your suggestions that what kind of typefaces can I use for the project.</p>
    <p>The project is about:<br>
    - Introducing Japanese herbal medicine 'Kampo'. (<a href="http://en.wikipedia.org/wiki/Kampo" title="http://en.wikipedia.org/wiki/Kampo">http://en.wikipedia.org/wiki/Kampo</a>)<br>
    - This project is both print and web based design applications.<br>
    - The target audience is people living in the city in Europe, familiar with contemporary medicine.<br>
    - I would NOT like to represent too cold, too modernistic, too decorative aspects from the typeface.</p>
    <p>Look forward to your suggestions.<br>
    Thanks so much!</p>
    <p>Takuya</p>
