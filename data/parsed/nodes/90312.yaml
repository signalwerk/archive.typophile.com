    html: |-
      <p>Nick, this is for Japanese herbal medicine, not Japanese consumer electronics.</p>
      <p>I think people understand that Japan, and Japanese visual culture, has both <em>(very)</em> modern/futuristic and <em>(very)</em> ancient/mysterious/foreign (from a Western perspective) sides. «Japanese» isn't enough to decide on a design direction; «Japanese high-tech» or «Japanese traditional», at least to me, point in vastly different directions.</p>
