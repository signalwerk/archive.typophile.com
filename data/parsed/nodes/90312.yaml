      <p>Oh come on, is the cliché for Japanese still good olde gesticulative brushwork?<br>
      This has been one of the leading high-tech countries for the past 50 years.<br>
      One of my best friends as a teenager (we spent a lot of time under the covers with the lights out):<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/sony-tr-510-transistor-radio-red-excellent-shape_140523332716_5607.jpg"></div><p></p>
      <p>Sony US branding from the 1960s leveraged its Clarendon wordmark:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/1965-Sony-Ad_5559.JPG"></div><p></p>
      <p>Admittedly, high tech is not herbal, but nonetheless, Clarendon doesn’t exactly spring to mind for high tech, does it?</p>
      <p>But if you really want to go all brushy, it would be hard to top Papyrus!</p>
