      <p>Hi,</p>
      <p>for a web developer your work looks pretty good. (Actually, I am web developer too!)</p>
      <p>Maybe you are having too many thoughts about what the logo should represent. I think it’s best to pick one of the ideas/bullet points above and then develop it further. At the moment, I like logo #1 the most. The other ones may not scale down well, due to the many thin white lines.</p>
      <p>If you say, you are mostly selling Italian products you might also want to consider using a colour scheme that feels more Italian, e.g. terracotta or light brown.</p>
      <p>Good luck!</p>
      <p><a class="freelinking-external" href="http://www.designbits.de">Webdesign Portfolio</a></p>
