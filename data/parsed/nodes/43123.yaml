    <p>Hello,</p>
    <p>Here are some tests for my little company.<br>
    We mainly imports products (most of them from italy). We do not sell directly to the final customer.</p>
    <p>As you can see, I’m not especially a master designer (far away from that, I’m web developer) but this is going to passionate me more everyday. So I certainly made evident big mistakes but I don’t know them : every constructive critics are welcome !</p>
    <p>So here is how I though:<br>
    - D L V letters can be the same character with 45° rotation if you delete the vertical bar from the ’D’.<br>
    - The 2.5D box made with these letters could represent the boxes we deal everyday with (not really inspired)<br>
    - The circle in the middle represent the company, which buy goods (vertical simple line) to supply its retailers (multiple dispersing lines)<br>
    - 1, 3 &amp; 4 could represent an UP arrow, synonym of prosperity</p>
    <p>The typo used is a classic Gill sans MS, at this stage I give priority to the logo itself.</p>
    <p>Thanks in advance ;)</p>
