    html: |-
      <p>Hey,</p>
      <p>Here is the last update. I had different critics about the typo :</p>
      <p>1. eurostile &amp; neuropol extended : “L” can be read as a “I”<br>
      2. microgramma : idem, weight too heavy<br>
      3. solaris : “V” can be read as a “U”, I had to make the font a little bolder</p>
      <p>What I think about that:<br>
      1. .. not sure, all letters are small case. But I’m not sure it’s a good idea to mix 2 different fonts. Maybe play with letter-spacing, etc.<br>
      2. For me it’s the more motorcycle related font of the three.<br>
      3. Not false, but there is something that I like in this font. “L” is readable.</p>
      <p>I’m satisfied with all fonts but I needed to show it to non designer people, to hear what they see.<br>
      Your designer point of view interest me much. What do you think ?</p>
      <p></p><div class="imageWrap"><img src="/files/logo-dlv_5112.gif"></div><p></p>
