    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Gill&nbsp;Sans</strong></p>
    <p>Probably <a href="/node/12115" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Eric Gill</a>’s most well known typeface, and one of the most successful sans-serifs. The typeface was inspired by <a href="/node/12134" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Edward Johnston</a>’s sans serif for the London Underground. Today Gill Sans in digital form is packaged with the Macintosh operating&nbsp;system.</p>
    <p>See also <a href="/node/12115" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Eric Gill</a>.<br><a href="http://typophile.com/wiki/Eric%20Gill#GillSans">direct&nbsp;link</a></p>
