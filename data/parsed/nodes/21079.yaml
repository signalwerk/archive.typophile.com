      <p>Did your degree in multimedia concentrate on conceptual issues, or techincal ones? Most likely the latter, right? So the question is have you really been trained as a designer? Your comment about not being a malleable, creative, art school type speaks volumes. No one cares about art school, but malleable and creative are desireable traits.</p>
      <p>You could continue to entertain and perhaps act upon those ideas of another profession, or you could sit down and read Phillip Meggs "A History of Graphic Design" from cover to cover and get a grip on what graphic design is and who does it.</p>
      <p>There are no mentors, you are all alone. Get used to it.</p>
      <p>Design is the new acting. How bad do you want it?</p>
