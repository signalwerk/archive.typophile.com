      <p>Thanks for your replies.</p>
      <p>Old Nick:<br>
      Good idea.  It shouldn't be too hard to find a bunch of like minded people.  I live in Melbourne.  Plenty big enough with strong design culture.</p>
      <p>Dezcom:<br>
      Agreed, there's definitely credit in sweating it out on your own, and it does make you tougher.  This is what i've been doing to this point, and there is definitely a sense of achievement when you think in terms of what you have become as a direct result of your own effort and perseverence.  It's good, only its hard, sometimes very hard.  If I knew it was like this for everyone facing similar circumstances, I might feel a little better.  From the replies so far, it sounds as though i'm not alone.</p>
      <p>Terminaldesign:<br>
      Multimedia degree attempted to be conceptual and technical.  To its credit, studies in Typography and some other subjects were very conceptual and taught from the College of Art attached to the university.  Having said that, the majority of the program belonged to the Information Technology faculty, and so concentrated on technical issues.</p>
      <p>Thanks for the book reference.  It seems to come highly recommended. I'll probably hit the local design book shop for a look shortly.</p>
      <p>Cheers - Jonny</p>
