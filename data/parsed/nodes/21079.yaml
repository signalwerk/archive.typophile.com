      <p>Jonny,<br>
      I guess the truth is that getting the right mix of critique and encouragement mix is tough to manage under fire in a business situation. In the old days, there was more of an apprenticeship situation with design firms having larger staffs. Today, things are jobbed out so that "under someone's wing" feeling gets lost.<br>
      There is something good about struggling through something on your own though. You become self-reliant and tougher in the process.  This is not easy and filled with frustration.  I am a firm believer that frustration is needed to make you push yourself.  The rewards are greater having done it.</p>
      <p>ChrisL</p>
