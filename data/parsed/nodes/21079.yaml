      <p>Lots of questions, no easy answers...</p>
      <p>The most <strong>practical</strong> path is one you blew off: being a junior designer -- junior to someone who has been in the business long enough NOT to feel threatened by you, and willing to offer help as it's needed.</p>
      <p>Otherwise, join a club -- most large cities have professional designers' clubs, users groups, etc. Besides being avenues for career advancement, they also offer the opportunity to talk shop with other pros in your field.</p>
