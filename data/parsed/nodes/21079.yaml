    <p>Hi all,</p>
    <p>There's been similar discussions i'm sure, but I think its worth sparking up again...</p>
    <p>Design doesn't lend itself to learning solo, but designers are increasingly out on their own performing their function in a solo freelance capacity, or as standalone 'design guys' performing specific design tasks in a bigger company.  I'm curious as to where other young designers are getting guidence, influence, assistance and support.  Ideally, a new designer might be working as a junior, in a larger team where they have access to senior designers for inspiration and guidance, but I know this isn't typically the case.</p>
    <p>My scenario for example.  I'm two years graduated from a degree in Multimedia, where I was 'sufficiently' schooled in too broad a range of topics to be taken seriously in any one alone.  In the first year I worked on web projects with a technology company under an eccentric, bi-polar, Managing Director-cum-Creative Director.  Second year: Stand-alone 'design guy' (print/web) for a large multinational company serving the Corporate Affairs/Communications department part-time while also working as a freelance print/web designer where the majority of work involves designing/typesetting glorified classifieds, trade ads and the odd offset brochure.  </p>
    <p>Where is my opportunity for mentorship in this arrangement?<br>
    Is this a problem that a lot of other young designers are facing?<br>
    How are they handling it?</p>
    <p>I for one am finding it very difficult.  Not so much for the mundane trade-ad type work, but anything that is the least bit challenging or unfamiliar can easily become a burden.  It's a little nerve racking to have no safety net.  Sometimes all that is required is the reassuring voice of a trusted senior that might say 'your on the right track, but maybe think about it like this...' or 'spot on, send to the client...'  Without this though, I feel like I'm driving blind, I have little confidence in my work and i'm doubting my ability to grow as a designer without some other input.</p>
    <p>The folks here at typophile are great, and the critique forum is indispensible.  But lets be honest, it's no match for personal interation with a senior designer in a professional context - mentorship.</p>
    <p>Maybe I should be looking to get in to a firm as a junior designer, but to be honest, i'm not the malleable, creative, art-school student who has potential if he learns how to use a computer.  I more fit the profile of that guy who knows enough about graphics, web technology and the AdobeCS to make things look professional.  </p>
    <p>How can I grow as a designer in this environment?<br>
    Does it just take time?  </p>
    <p>Obviously the work I'm doing at the moment is okay, or I wouldn't be surviving as a freelancer. I just cant figure out how to get to the next step, or at least be confident in what i'm doing.  I'm starting to get rather discouraged and secretly entertaining the idea of another profession.</p>
    <p>Any thoughts muchly appreciated.  I'd especially like to hear how those facing similar circumstances handled it.</p>
    <p>Cheers - Jonny Schneider</p>
