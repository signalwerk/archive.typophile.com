    <p>In 2008 <em>TypeTogether</em> released the <a href="http://www.type-together.com/Bree" rel="nofollow">Bree</a> typeface, a sleek sans serif that quickly became a favorite among brand and editorial designers.</p>
    <p><a href="http://www.type-together.com/Bree%20Serif" rel="nofollow">Bree Serif</a> follows the same theme as its predecessor. It is a young and energetic upright italic that approaches readers with hip and somewhat elegant charm. It has a range of styles that can perform as counterparts to the original <a href="http://www.type-together.com/Bree" rel="nofollow">Bree</a> fonts. At the same time though they bring a whole range of new and individual features that make <a href="http://www.type-together.com/Bree%20Serif" rel="nofollow">Bree Serif</a> a separate type family in its own right.</p>
    <p>The characters in <a href="http://www.type-together.com/Bree%20Serif" rel="nofollow">Bree Serif</a> maintain the original flavour of handwriting, but have a more subtle appearance to support optimal editorial usage. The slabby nature of its shapes, particularly in the heavier weights, makes for a strong impression.</p>
    <p>Some of the characteristic features of its sans serif cousin are present in <a href="http://www.type-together.com/Bree%20Serif" rel="nofollow">Bree Serif</a> too, such as the single-story ‘a’, the cursive ‘e’ and the rhythmical ‘k’ and ‘y’. Alternate letters of these are also available when a more neutral look is desired.</p>
    <p><a href="http://www.type-together.com/Bree%20Serif" rel="nofollow">Bree Serif</a> offers a mixture of fluid and attractive forms that convey a contemporary and vivid aspect. If you loved the multi- award wining <a href="http://www.type-together.com/Bree" rel="nofollow">Bree</a>, you will surely love its seriffed cousin!</p>
    <p>Designed by <em>José Scaglione</em> and <em>Veronika Burian</em>.</p>
    <p>More information: <a href="http://www.type-together.com/Bree%20Serif" rel="nofollow">Bree Serif</a></p>
