      <p>A run-in sidehead is distinct from the text, although it runs on the same line as the text&nbsp;it remains a heading.</p>
      <p>“Neoclassical birdbaths and effigies of liveried slaves, stable boys and faded pink flamingoes all have counterparts in the typographic world” as Bringhurst puts it. By the way he also avoids giving it a name.</p>
      <p>I vote for a faded pink flamingo.</p>
      <p>Tim</p>
