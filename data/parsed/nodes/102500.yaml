      <p>I don't know of a single term(s) to specify this. You need to spell it out, as in</p>
      <p>"First line sets in 14-point full caps."</p>
      <p>Or whatever the specific details. </p>
      <p>In books before the 19th century, you sometimes saw chapter openings where the first line would be set in, say, 16 point, the next in 15 point, then next in 14 point, etc.,</p>
      <p>Showing off how many fonts one had, I suppose. Embellishment always depends on what you have to hand, and the climate. If it's hot outside &amp; minimal clothing is in order, you paint your face. If you need a lot of clothing to stay warm, embroidery works just fine.</p>
