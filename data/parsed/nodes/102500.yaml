      <p>I have never had recourse to my old (1932) edition of <em>What a Compositor Should Know</em> as since I started looking at this site. The author—a W. H. Slater—is dogmatically insistent on so many things, I felt sure he would have the last word on this.</p>
      <p>In his chapter on Bookwork he deals at length with almost every imaginable circumstance and even, "so that every statement made hereafter should be based on something tangible", details that his remarks refer specifically to a ". . . demy 8vo volume with a measure of 22 picas wide by 40 picas deep set in 10pt old style solid." Mr Slater is insistent that chapter numbers, for example, should be in "caps of text or one size larger roman numerals" and that this ". . . rarely changes, except in a schoolbook for young children when a display letter might be used. . . always capital and same body as text."</p>
      <p>Although he uses the <em>faded pink flamingo</em> in his own book he completely fails to inform the compositor as to the rights and wrongs of its use or even to name it.</p>
      <p>Mr Slater sir, you disappoint me.</p>
