    html: |-
      <p>I sometimes use a bold sans serif font on the lead-in to a paragraph of regular serifed text. Usually the lead-in is a single phrase, like “I sometime use”. Sometimes I use a larger size than the normal text size if the phrase merits it and if the typographical context is such that the reader can benefit from a strong cue to where the actual text begins. The bold visual cue captures the eye and draws it in. The dutch word for these kind of cueing device is <em>blikvanger</em>. </p>
      <p>Small caps are also good, especially after an initial drop-cap. </p>
      <p>I try to break the lead-ins off according to sense, so if the first sentence started “Usually the lead-in is a single phrase,” I wouldn’t end the lead-in after the word “the,” but after “lead-in,” or after “Usually.”</p>
    html_clean: |-
