      <p>Nick, I wouldn't term this a side head -- unless it is self-contained. A lot of time, C-level heads are run in, text to follow after a space, often am em-space.</p>
      <p>I sometimes use a first-few-words in a *something* setting following a spacebreak. It is always awkward when a spacebreak falls at the foot or head of a page, and if it is just a blank line with no ornament, you need to signal it somehow.</p>
      <p>When this is done, or with the "lead-in" example above, the text designer has to mark the words to be so set. And then sometimes argue it out with an editor, who may have different ideas... If it is an entire first line, as can be used with a chapter opening, you can leave it to the typesetter.</p>
      <p>But I still don't know of a technical term that covers all instances of the technique.</p>
    html_clean: |-
