    <p>Hi all</p>
    <p>I'm trying to track down a technical typographic term, that I hope one of you lovely people might be able to help me with.</p>
    <p>I'm wondering if there is a term for when the first word, or multiple words, in typeset paragraph are set in a different font. I'm thinking like a drop cap, but rather than just the first letter, the whole word.</p>
    <p>Any help gratefully received.</p>
    <p>Thanks<br>
    Dan</p>
