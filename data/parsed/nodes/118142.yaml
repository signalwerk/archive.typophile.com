      <p>Thank you all, much obliged! It definitely had some art deco as a starting point, but wanting to move it in a much more bold angular/contemporary direction. </p>
      <p>Keeping in mind that the slant-L might be a bit too much, I think it's getting reasonably coherent 'standard' letterforms, and vague ideas on distorting proportions/details on the alternates:</p>
