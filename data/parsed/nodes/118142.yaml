    html: |-
      <p>I like it! Looking at it, my eye tries to assign it a decade, but it keeps flopping between 1930s and 1970s. It has that Art Deco wackiness, but that /L/ feels sci-fi, and the /R/ reminds me of Star Wars and the old Chicago Reader logo.</p>
      <p>With this type of face, I always appreciate it when the designer supplies a "straight" version, along with the more expressive forms as OpenType alternates. For instance, the two different /H/s and /E/s bring a welcome diversity.</p>
