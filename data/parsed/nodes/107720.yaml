      <p>If you follow the link I gave you above, you can see there <strong>was</strong> a digital version of Folio Extended by Berthold (1992):<br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Berthold&amp;ffam=Folio%20BQ%20-%20Medium%20Extended&amp;fid=6e21a55d60c64896cb9df956a678c0ef&amp;fsize=60&amp;text=plays%20and%20players&amp;wrap=2" rel="nofollow">Folio BQ Medium Extended</a></strong><br>
      <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Berthold&amp;ffam=&amp;fid=db45ee702a854035b7916efba3c2acbf&amp;fsize=48&amp;text=plays%20and%20players&amp;wrap=2" rel="nofollow">Folio BQ Bold Extended</a></strong><br>
      I don't know why Berthold decided to drop the font from their official catalog (probably they don't have a distribution license anymore or they never did).<br>
      If you just want to test &amp; inspect the specimen you can Google "Folio BQ Medium Extended" and I'm sure you can find some illegitimate site to acquire the Berthold's digital version, but if you need this for a commercial project I really don't know of a legitimate source to acquire it.</p>
