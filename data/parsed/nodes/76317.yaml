      <p>A tenua is only defined by nikud, and not by the Hebrew letters.</p>
      <p>Perhaps, there are only particular aspects of the nikud which cause different reactions, which we are calling "chain-reactions", and not due to certain Hebrew letters, as Eli showed by emamples.</p>
      <p>If we pin-point those particular aspects of the nikud, then Eli might be convinced that it is necessarily those Hebrew letters.</p>
      <p>Do those same Hebrew letters react in the same way under similar conditions? If not, then this seems to indicate that they themselves cause the said reactions.</p>
