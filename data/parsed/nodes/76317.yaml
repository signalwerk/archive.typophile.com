      <p>David, Eli, </p>
      <p>Among the many things which I don't understand, these are things which I don't understand here.</p>
      <p>1. The term 'gayot', which from the context, seem to refer to the different forms of meteg (ie. how they are used.</p>
      <p>Clarification:</p>
      <p>Marking up Hebrew text with additional symbols/glyphs for additional forms of nikkud and dagesh.</p>
      <p>Why?</p>
      <p>By doing so, distinctions between the shvah-na and shvah-nach, the kamatz katan and the kamatz gadol, can be made accurately in Volt, even though these distinctions are not present as Unicode values in the text.</p>
      <p>For example, if a string of ordinary vocalized text contains:<br>
      a) hirik and meteg, and the next vowel is a shva, then the Volt algorithm can determine whether its a shvah-na or shvah-nach;<br>
      b) patach, meteg, peh mudgash, and the next vowel is a shva, then the Volt algorithm can determine whether its a shvah-na or shvah-nach.</p>
      <p>But if this string of ordinary vocalized text has no additional mark-ups, then no Volt algorithm can determine whether its a shvah-na or shvah-nach, based upon context alone.</p>
      <p>So, the mark-ups enable the string of ordinary vocalized text to contain grammatical rules via the mark-ups, in the form of additional symbols/glyphs (for additional forms of nikkud and dagesh). As a result, the Volt algorithm can then determine whether its a shvah-na or shvah-nach, based upon the new context alone.</p>
      <p>Is this clear?</p>
