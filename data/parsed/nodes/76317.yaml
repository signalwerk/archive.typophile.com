      <p>When I was a child, I learned to eventually derive an unknown meaning of a word from its context in a sentence and/or in the paragraph. </p>
      <p>Later, after the meaning of that word is derived or discovered, meaning by implication, could be further derived, as our sages obm promise: הלומד דבר מתוך דבר - one can derive further information by extrapolation.</p>
      <p>So, David and Eli, when you cite examples with words that sound like Chinese or Greek, they do not fall upon my deaf ears. Rather, eventually, everything is understood. More than you intend to convey is understood.</p>
