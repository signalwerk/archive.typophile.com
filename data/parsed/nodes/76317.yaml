      <p>A tenuah is a single letter with a nikkud. But it is the kind of nikud which makes the tenuah either a tenuah chazakah or a tenuah kalah.</p>
      <p>According to R' Zalman Henna,<br>
      1) a kamatz gedol<br>
      2) a chirik gedol<br>
      3) a tzeirey (there is no tzeirey gedol or katan)<br>
      4) a shuruk gedol<br>
      5) a cholam (there is no cholam gedol or katan)<br>
      is defined as a tenuah chazakah.</p>
      <p>And:<br>
      1) a patach (there is no patach gedol or katan)<br>
      2) a chirik katan<br>
      3) a segol (there is no segol gedol or katan)<br>
      4) a shuruk katan<br>
      5) a kamatz chataf (is this a kamatz katan?)<br>
      is defined as a tenuah ketanah.</p>
      <p>Note:<br>
      Is a kamatz chataf a kamatz katan? Prof. Dotan asked regarding the symbol for a kamatz katan, "Is this a kamatz chataf?"</p>
      <p>Eli brought a different delineation:<br>
      1) a kamatz gedol<br>
      2) a tzeirey - malay and chaser (with or without a yud following it)<br>
      3) a chirik (only a malay --with a yud following it-- is gedol)<br>
      4) a kubutz (in the middle of a word -- note: Chabad calls this a shuruk anywhere in the word)<br>
      5) a cholam (there is no gedol or katan)<br>
      is defined as a tenuah chazakah.<br>
      1) a kamatz katan<br>
      2) a segol<br>
      3) a chirik chaser (without a yud following it)<br>
      4) patach<br>
      5) shuruk (note: Chabad calls this a shuruk anywhere in the word)<br>
      is defined as a tenuah katanah.</p>
      <p>First, who Eli is your list attributed to?</p>
      <p>Why is there a difference?</p>
      <p>There are only one definition different between them:<br>
      R' Zalman Henna:<br>
      1) a tzeiey chaser (without a yud following it) is tenuah chazakah</p>
      <p>Is this why R' Zalman Henna assigns more shvahs to be a shvah-na?</p>
      <p>What is the relationship between a tenuah chazakah, a tenuah katanah, a shvah-na, and shvah-nach?</p>
      <p>What is the relationship between a tenuah chazakah, a tenuah katanah, a kamatz chazak, and kamatz katan?</p>
      <p>What is the relationship between a tenuah chazakah, a tenuah katanah, a dagesh chazak, and dagesh kal?</p>
      <p>Earlier, Eli you cited situations where a kamatz gadol/katan or dagesh chazak/kal caused a shvah to be na or nach? Can this be determined by the kind of tenuah which precedes it, or does it define the exceptions to the rule?</p>
      <p>(David, I getting to your part 1, whhh!)</p>
