      <p>An aside:</p>
      <p>The naming convention and spelling of the name of R' Zalman Henna (Rabbi Shlomo Zalman b"r Yehuda Leib Sh"n Katz from Henna):</p>
      <p>The name 'Henna' is spelled 'הענא'. This is a Yiddish spelling and pronunciation. The ayin ע is like a  ֶ 'EH' sound. Hence, it is pronounced 'Henna', and not 'Hanu' or 'Hanau'</p>
      <p>From his haskamot letters of endorsement, Henna is the name of the town from whence R' Zalman either came or originated. It was common then to identify a person not by referring to his or her surname. Rather, reference was made to the place from whence they came.</p>
      <p>For example, R' Moshe Neviller was called by this name, because R' Moshe came from the village of Neville.</p>
      <p>David, why do you prefer to call "R' Zalman Henna" as "Zalman Hanu"? I've heard also "Zalman Hanau". Is Hanu or Hanau the gentile pronunciation of th Yiddish "Henna"?</p>
