      <p>David,</p>
      <p>Thank you for your continuing expose on this topic of how Hebrew grammar is defined by the placement of the nikud in a word.</p>
      <p>I look forward to part two.</p>
      <p>I have chose R' Zalman Henna's book simply because it addresses the function of nikud, as it name implies: ספר יסוד הניקוד "The Foundation of the Hebrew Vowels (nikud)".</p>
      <p>I have acquired many books, mostly from non-Jewish or secular grammarians. With all due respect to their great scholarship attributed כבודם של כבודם מונחו, the books are very poorly structured and written.</p>
      <p>Each assumes that the reader has certain knowledge, yet that knowledge is not defined in the book.</p>
      <p>Examples and explanatory posts from you and Eli are very helpful, but a succinct comprehensive presentation has not yet been forthcoming.</p>
      <p>You described it accurately earlier, by comparing the relationship between a series of nikud and dagesh as a "chain-reaction".</p>
      <p>Again, I seek to cull from your examples and those of Eli, a set of definitions of the chain-reactions; ie. this causes this, then this causes this, and so on.</p>
      <p>This is why I think this is possible in MS Volt. Once the Hebrew text is marked up completely based upon the set of definitions of the chain-reactions, then the shvas can be marked correctly as na or nach (with a standard appearance), the kamatzes as katan or gadol (with a standard appearance), and afterwards the other markings are returned to their original appearance.</p>
      <p>But I agree with you. This is the structure of the algorithm, but importance of the relations between the nikuds and dageshs is primary.</p>
