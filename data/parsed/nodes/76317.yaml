      <p>R' Zalman Henna quotes Ibn Ezra, Maimonides etc., which seems to imply that his words of Hebrew grammar are reflected in mainstream Torah literature as well. He also quotes the Radak and R' Eliyahu Bachur to imply that his thoughts are consistent with their teachings.</p>
      <p>Much kabbalistic literature associates the meaning of our prayers to the kind of nikud used in those words of prayers, and are called, "kavanot"; this is recorded at length in the original Siddur of Rabbi Schneur Zalman of Liady (not Tehillat Hashem). </p>
      <p>R' Zalman Henna seems to imply in Shar HaTenuah (ch. 2) that the very form of the Hebrew letters are related to the sounds they produce.</p>
      <p>Hence, we see again here the Divine connection between the Hebrew letters and their significance and meaning.</p>
