      <p>Although I'm not at all familiar with the subtleties of Hebrew vowel notation, the discussion is clear enough. The initial post pointed out that there are many controversies with respect to certain subtle points, and that the positions taken on these questions by Zalman Hanu, in particular, are considered controversial and not generally accepted. The response to that by GoHebrew was that the books by other authors had not gone right to the level of the basics, of the foundations of Hebrew grammar, in the way that those of Zalman Hanu had done.</p>
      <p>So instead of resolving this by David Hamuel spending time explaining everything in terms of the basics of Hebrew grammar, one would think what's needed here is a pointer to a good book. Are there more orthodox works on Hebrew grammar that attempt to go right to the basics, right to the foundations, of why Hebrew works the way it does?</p>
      <p>I can see why someone with a new theory might have to go further down than others in order to justify his new ideas; that doesn't make them true, of course, since languages are natural systems that we take as we find them - grammar is not like physics or mathematics, where reductionism all the way down is a strongly effective approach.</p>
