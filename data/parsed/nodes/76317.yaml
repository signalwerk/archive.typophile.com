      <p>If 'Tevel Asur min Ha'tora' has a Biblical source, it is merely an 'asmachta' - a verse which alludes to this prohibition.</p>
      <p>A prohibition that has the severity of a Biblical command often does not have an actual verse associated with it. Rather, when our sages obm debated the matter's status, ie. a Biblical injunction, or a less severe Rabbinical ordinance, one sage may have suggested that the matter can be linked to a particular verse. This linkage is called an "asmachta".</p>
      <p>"Asmachta" is Aramaic, but comes from the Hebrew word, 'somach', which means 'rests upon'. This is said in our daily prayers: "[G-d is our] somach noflim". So, too, this rule about tevel rests upon this verse.</p>
      <p>But like every asmachta, the purpose of the verse is not in order to teach this matter, but merely to allude to it, and remind us of its Biblical status.</p>
    html_clean: |-
