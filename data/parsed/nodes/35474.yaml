      <p>Well I chose helvetica because I’m a one person &amp; freelance designer, so I feel that keeping a simplistic logo might reflect that I am a smaller company. The opposite of a giant corporation. Maybe this direction isn’t as strong as it should be. </p>
      <p>What makes me unique as a designer is my italian heritage, which I try to market (there is an E at the end of my name.. Davide). Everyone always thinks thats very cool. At the same time, I don’t want to SCREAM that there is an e in my name by making it another color or something.</p>
      <p>Thanks for the feedback so far! I really need to get this done SOON!</p>
      <p>I remember seeing Addison hall <a href="http://addisonhalldesign.com/" title="http://addisonhalldesign.com/">http://addisonhalldesign.com/</a> on typophile and I really like his work and Identity. I like the typeface he uses also is great. I like his simplistic approach as well. Website is great too! :)</p>
