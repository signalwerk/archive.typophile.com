    <p>Hey everybody!</p>
    <p>I’ve been struggling with my own corporate image recently. I feel as though I’ve HIT my logo which is in Helvetica, but can’t seem to find a typeface for the body text. Although it may seem weird to say, I’m not a fan of helvetica as a body text. Not because it doesn’t work, but I feel that I’ve seen it a trillion times used badly, and it seems just so standard.</p>
    <p>I’ve been using APEX Sans as my body text for my current image. I have to say, I really enjoy the way its working for me.</p>
    <p>Is there a way to marry Helvetica as my logo and Apex as my body text. They are very differant SANS, but I forget is Sans+Sans is a no-no &amp; wanted to see what masters (you guys) say.</p>
    <p>Also, feel free to comment on the card design. </p>
    <p>Thanks a lot in advance for the much needed help! :)</p>
