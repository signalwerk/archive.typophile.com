    html: "<p>&gt;the strength of feelings  <br> <br>Some of mine: <br> <br>LOYALTY to Quark (it did, after all, save and revitalise my career as an art director, and I must have spent 10,000 hrs using it) <br>SUSPICION of Adobe's monopoly <br>DISAPPOINTMENT at implementation of OpenType features (non-existent in Quark, botched in InD) <br>ANGER at having to reprogram myself to use different software and keyboard commands to do almost exactly the same task in InD as in Quark. <br>FRUSTRATION at not being able to find the Pantone color swatches in InD 2.0 -- because there weren't any!  <br>WARYNESS (?) of the color values associated with surprinting dropshadows in InD. <br>JOY at the ease of making PDFs in InD. <br>ANNOYANCE that I have to keep a foot in both camps -- as a freelancer with different clients who require files in different formats <br>EMBARRASSMENT that my students (I teach part time) will graduate proficient in InD, but with no Quark skills (the faculty chose Adobe), when that's a requirement of most entry-level jobs <br>RESIGNATION to the changing of the guard <br>AMAZEMENT at having a page design criticized for being too \"Quark-y\" (yeah, the grid was too evident and no transparency/dropshadow effects) <br>Of course, SATISFACTION with a lot of what InD does... <br> <br>overall, mixed emotions. <br> <br></p>"
