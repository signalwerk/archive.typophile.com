  - id: 142745
    user: 1160
    date: 2004-05-05T09:35:00
    date_raw: 5.May.2004 9.35am
    votes: null
    html: "<p><b>Grant,</b> I was referring to Nick's disappointment that OT implementation in InDesign is botched (Nick's words, not mine). I only say InDesign is pioneering, because it's the only mainstream app that can use OT fonts at the moment. <br> <br><b>Nick,</b> there are color swatches in InD. They just happen to be in the color palette. (Imagine that.) Rather than in an obscure dialogue box. I agree with Jon, that is one aspect of the Adobe suite that's really nice - the apps all play nicely together. For the most part all the key commands are the same. <br> <br><b>Thomas,</b> of course Quark is the underdog. They're not Microsoft or Adobe. =) It was easy to predict the day Adobe announced InDesign (1998?). I knew then PageMaker and Quark were doomed if Adobe got InD right. (Frankly I was kind of puzzled to see PageMaker continue on for so long after InD came out.) <br> <br>Furthermore, you're right about the Photoshop example. I've been impressed that Adobe has continued to innovate with Photoshop. (Afterall, they still want people to have a good reason to upgrade every year or two, right? No different from any other software maker.) <br> <br><b>Rob Walker,</b> one final point. Don't expect to install InDesign and \"get it\" immediately. If you know Illustrator, sitting in the InD saddle will feel very familiar. But when you switch, give yourself some adequate time to try stuff, read the manual, etc. For me it took half a day to get over the awkwardness of a new app and about a full week before I felt like I really understood the more complex stuff: how to use masks, masterpages, style sheets, etc. <br> <br>I guess the bottom line is, I don't believe in hanging on to old tech for nostalgia's sake. For utility's sake, yes. Just don't expect to see me with a Newton. =)</p>"
