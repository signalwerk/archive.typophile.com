  - id: 142744
    user: 1160
    date: 2004-05-04T18:01:00
    date_raw: 4.May.2004 6.01pm
    votes: null
    html: <p>Come on in, the water's fine. <br> <br>Maybe it's because I'm a lefty or maybe because I'm a middle-child I've always sided with the underdog - Quark, Apple, Pepsi. Quark though, rested on its laurels way too long. When they finally got to OS X it was way too late and without any compelling reasons to go back. I've heard horror stories about their (off-shore?) tech support whose blanket answer is to reinstall. <br> <br>As far as OT support, maybe someone could argue it was botched. But, I see it more as pioneering. The promise of OT is yet to be realized, I think. Especially with the limited support out there. (Can you imagine Flash ever getting OT support? I can't.)</p>
