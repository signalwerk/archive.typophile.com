    html: "<p>Jon: <br> <br>I am in a similar situation with always having used Adobe. I have a familiarity with Quark, but obviously much prefer ID. I didn't mean to imply I disliked ID; it's absolutely fabulous. Especially with the move to CS... mmm Pantone. <br> <br>Tom: <br> <br>I do have a question about ID if you know the answer, even if it is slightly off-topic for this thread. Why when ID documents are PDF'd do white/black borders where invisible objects used to be (textboxes, contentboxes) linger when viewed but not printed? <br> <br>Doesn't hurt anything, just curious.</p>"
