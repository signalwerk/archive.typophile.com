    <p>My company is sending myself and other Mac users on a two day course next month to learn about <a href="/web/20080907073835/http://typophile.com/wiki/Adobe%252BInDesign" class="wiki">Adobe InDesign</a>. Specifically, whether it is worth changing the whole (advertising) company from <a href="/web/20080907073835/http://typophile.com/wiki/Quark%252B4" class="wiki-create">Quark 4</a> to InDesign as opposed to upgrading Quark (the more expensive option).</p>
    <p>Although I am a bit wary about changing over, I’ll be going along with a (relatively) open mind. But I would like to know what thoughts do you people have about the differences between <a href="/web/20080907073835/http://typophile.com/wiki/QuarkXpress" class="wiki">Quark</a> and InDesign? Things to look out for? Basic boxes or tricky typographic twiddling? From an overall design perspective to a more particular typographic viewpoint -  which is best?</p>
    <p>Apologies if this has been covered before, but it would be really useful to have a few opinions and perhaps things to look out for from people who know their stuff.</p>
    <p>Thanks</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080907073835/http://typophile.com/node/4765" class="topic-previous" title="Go to previous forum topic">‹ Building an OpenType font, where to start?</a> <a href="/web/20080907073835/http://typophile.com/node/4624" class="topic-next" title="Go to next forum topic">A substitute for FF Kievit? ›</a></div>
