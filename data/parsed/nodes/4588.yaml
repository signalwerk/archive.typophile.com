    html: <p>Heh. I must say, I'm happily surprised to see that somebody considers Quark to be the underdog at this point. <br> <br>Of course, Quark was unchallenged in their market segment for quite a few years, and their development really stagnated. But even  <br>if one thought that InDesign's market share could end up as strong as that for Photoshop, do people think that's bad? Has having the largest market share for high end image editing hurt the development of Photoshop? <br> <br>How do people feel about using apps from a bunch of different vendors? Is there anybody who used to use the Photoshop/Freehand/QuarkXPress combo who has moved to Photoshop/Illustrator/InDesign who can comment on how much of a plus there is from app integration, versus folks concerns about having one vendor providing multiple apps? <br> <br>Cheers, <br> <br>T</p>
