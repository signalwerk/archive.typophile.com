  - id: 142746
    user: 108
    date: 2004-05-05T10:09:00
    date_raw: 5.May.2004 10.09am
    votes: null
    html: "<p>Thomas asked: <i> ... who has moved to Photoshop/Illustrator/InDesign who can comment on how much of a plus there is from app integration, versus folks concerns about having one vendor providing multiple apps?</i> <br> <br>I can comment on this. Although I'm far from expert, I have to say that is one really major reason I'm trying to work with only InDesign and not going back to Quark. The fact that everything seems to be one application. The ability to go back and forth without having to mentally switch different quick keys. The downside for me is speed. I'm using Panther and Indy CS (all CS now actually). But Quark is still faster, and not just marginally, I would call indy slug-like even. But, I use Indy because the patience pays off in the end. --- BTW Indy &gt; GoLive &lt; Illustrator is pretty cool too.  <br> <br>Nick said: <i>EMBARRASSMENT that my students (I teach part time) will graduate proficient in InD, but with no Quark skills (the faculty chose Adobe), when that's a requirement of most entry-level jobs</i> <br> <br>This is a reality. I can relate to this. It seems most entry level jobs want friggin' ambidextrous multi-lingual multi-platform multi-media geniuses ... an unfair amount of pressure is put upon the teachers whose hands are tied.  <br> <br>I can also say that I have put zillions of hours into Quark and can only say that I'm happy that Adobe allows the quick-keys (and other such) to be the same app to app. I can even set my palettes up almost identically from app to app. Lurvely! <br> <br>Up until recently I've managed to leave Quark alone. I do have a two clients now, one a publisher the other in the training field, who both use Quark 4.11 -- so I happily can help them. Otherwise I might not have been able to accept the work. I consider Quark a tool that I can use when I need to, but only often enough that it doesn't get dusty. However, if more clients need me to use Quark I won't turn my nose up at them. Quark isn't a way of life, it is only a tool to me. <br></p>"
    html_clean: "<p>Thomas asked: <i> ... who has moved to Photoshop/Illustrator/InDesign who can comment on how much of a plus there is from app integration, versus folks concerns about having one vendor providing multiple apps?</i> <br> <br>I can comment on this. Although I'm far from expert, I have to say that is one really major reason I'm trying to work with only InDesign and not going back to Quark. The fact that everything seems to be one application. The ability to go back and forth without having to mentally switch different quick keys. The downside for me is speed. I'm using Panther and Indy CS (all CS now actually). But Quark is still faster, and not just marginally, I would call indy slug-like even. But, I use Indy because the patience pays off in the end. --- BTW Indy &gt; GoLive &lt; Illustrator is pretty cool too.  <br> <br>Nick said: <i>EMBARRASSMENT that my students (I teach part time) will graduate proficient in InD, but with no Quark skills (the faculty chose Adobe), when that's a requirement of most entry-level jobs</i> <br> <br>This is a reality. I can relate to this. It seems most entry level jobs want friggin' ambidextrous multi-lingual multi-platform multi-media geniuses ... an unfair amount of pressure is put upon the teachers whose hands are tied.  <br> <br>I can also say that I have put zillions of hours into Quark and can only say that I'm happy that Adobe allows the quick-keys (and other such) to be the same app to app. I can even set my palettes up almost identically from app to app. Lurvely! <br> <br>Up until recently I've managed to leave Quark alone. I do have a two clients now, one a publisher the other in the training field, who both use Quark 4.11 -- so I happily can help them. Otherwise I might not have been able to accept the work. I consider Quark a tool that I can use when I need to, but only often enough that it doesn't get dusty. However, if more clients need me to use Quark I won't turn my nose up at them. Quark isn't a way of life, it is only a tool to me. <br></p>"
