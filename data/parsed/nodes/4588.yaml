  - id: 33805
    user: 2332
    date: 2004-05-04T20:40:00
    date_raw: 4.May.2004 8.40pm
    votes: null
    html: "<p>Rob: <br>I use InDesign 2 (on Windows) at work (a major Canadian Public Library) and I enjoy it and it works well, smoothly, and is wonderful at setting text. I just like it. If you are already using Illustrator and Photoshop, InDesign makes an excellent fit. <br> <br>There are some interface inconsistencies with Illustrator and Photoshop, and that can bug you, but in all they are very nice together. <br> <br>I have purchased Creative Suite Premium for my own use (on Macintosh) and the integration is better through-out though there is still more to be done. It is pretty well wholesome and delicious from my POV. <br> <br>Thomas: <br>I can't speak to crossing the Quark with Adobe apps. I have only ever used Adobe apps. I even liked Pagemaker and thanks for bringing back the Control Panel in CS. <br> <br>It looks like Macromedia Studio MX is in my very near future because of my various capacities at work, so I may be able to comment on this soon. <br> <br>Nick: <br>What I don't understand is why you feel embarrased that your students haven't learned Quark. InD is clearly gaining traction and improving steadily, and seems the way of the future. Your students are well prepared. I don't understand why employers and potential employees both worry so much about whether you have one or the other. Can't the other be learned and conceptually we're talking about the same stuff right (text and pictures combined on a page), so you sit down, RTFM, screw around, commit to using the new one for a critical project and then you've got a pretty good idea of what goes on. I know this sounds like I'm an arrogant prick (I can be) but what I'm getting at is: are these programs that conceptually different? From what I have seen in the screenshots and movies and stuff it looks a lot the same.* <br> <br>In general: <br>I have never had the opportunity to use Quark. I'm sure it can be learned. I'm sure it's a very capable program or the large number of companies that do use it would no longer be invested in it. <br> <br>As a potential customer (and up until my recent CS purchase I was one), nothing that Quark did or said could convince me that their world was better. Truthfully I must say that their insistence on not bringing their stuff to OS X drove me mad and predjudiced me against them forever. <br> <br>Jon <br> <br>*I remember now: their Flash movie seems to not work when you get to the Landmarks section. I'm downloading a demo of Quark right now just to prove to myself what a reasonable guy I am...</p>"
