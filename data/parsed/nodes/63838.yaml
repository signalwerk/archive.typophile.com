    html: |-
      <p>Good question :)</p>
      <p>The main difference is the reliability of the timestamp. Flickr, for example, allows editing the photo after it was uploaded, replacing the original and keeping the 'uploaded' date and time. Which makes sense because the photo was indeed <em>uploaded</em> on that date.</p>
      <p>Secondary, lesser problem is that if I know someone in Flickr, I may potentially persuade them to change the timestamp by hand. </p>
      <p>In other words, Flickr and alike were not <em>built</em> for trustworthy timestamping. Their time reference information can be manipulated post factum, either using native features, through exploiting flaws in the system design or via social engineering.</p>
      <p>On the other hand there exists mature timestamping infrastructure that is a part of digital certificate issuing business. The very foundation that makes the SSL secure. Timestamps are generated by the sealed servers, servers are physically secured, their security is routinely audited by 3rd parties, etc. The whole nine yards. The likelihood of the timestamp coming out of this infrastructure to be fake, manipulated or mis-applied is virtually zero.</p>
      <p>The idea is to start utilizing this infrastructure by building a system that is dedicated to just one thing and that does it right.</p>
