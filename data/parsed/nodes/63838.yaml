    html: |-
      <p><em>Fast forward mere nine months :)</em></p>
      <p>--</p>
      <p>The project is now alive and breathing.</p>
      <p>I had serious doubts along the way and almost scraped it once or twice. However in the end it seemed like an interesting experiment and a generally good thing to do, so it survived. </p>
      <p>I should probably add here that the goal is not to make money. The goal is to try and do something about rampant online plagiarism. This is not an ultimate solution, far from it, but it is one of those small things that could help, and help substantially.</p>
      <p>--</p>
      <p>Now I crave for feedback. </p>
      <p>If you think it's a dumb idea and it won't work, I would like to hear that. Especially that. If you have thoughts on what could make it work, please type them and post them.</p>
      <p>The homepage is at <a href="https://beta.certtime.com">https://beta.certtime.com</a></p>
      <p>I have put together a comprehensive Q&amp;A page that covers all FAQs accumulated so far - <a href="https://beta.certtime.com/faq">https://beta.certtime.com/faq</a>. If there are more questions that beg to be there, do let me know.</p>
      <p>--</p>
      <p>If you feel like taking the service out for a test, punch in <em>AUGUST</em> as an invitation code when registering. Do keep in mind that it is a work in progress and parts of the site are still being worked on.</p>
