    <p>A bit of an announcement.</p>
    <p>After on and off discussions over at the <a href="http://www.logopond.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Logopond</a> forums over the course of the past year, I have started a <a href="http://www.certtime.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">project</a> to implement an online digital timestamping service. </p>
    <p>The idea is to provide an easy way to establish and validate a proof of existence of any given piece of data, such as an image, so that such proof could later be used to facilitate dispute resolutions. </p>
    <p>Specifically, the context of Logopond discussions was how to facilitate take-downs of the ripped-off logo designs. Having a reliable time reference for an original work seems to substantially simplify such activity. It may also serve as a deterrent and help to prevent the cloning from happening in the first place.</p>
    <p>Timestamping is not rocket science, but its usefulness is generally affected by</p>
    <ul><li>the complexity of stamp verification process -- this typically requires the use of specialized 3rd party software
    </li><li>the complexity of running a timestamping facility -- issuing a timestamp is easy, ensuring that the issuer cannot back-stamp at will is what's hard
    </li></ul><p>I have found a way to resolve both issues and make the whole process as straight forward as it can get. The details are <a href="http://here" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://here</a> if you are interested.</p>
    <p>--</p>
    <p>I am posting this for two reasons. First, I want to obviously get the word out and announce the project. Second, I would like to gather the feedback. What do you guys think of the idea ? Not necessarily in the context of logos or images. Consider that <em>any</em> data can be timestamped.</p>
    <p>--</p>
    <p>Oh, and a teaser screenshot for the desert :-)</p>
    <p><img src="/sites/default/files/old-images/item-info-2_4573.png"></p>
