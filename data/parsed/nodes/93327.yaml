    <p>I offer a stock of the well-known Swiss typographic magazine <strong>Typografische Monatsblätter</strong> (TM)</p>
    <p>Years 1998 to 2006, 39 volumes. Text mainly in German, a few articles in French. Plenty of interesting articles about type and design, e.g. by the late Max Caflish (stunning typeface reviews).</p>
