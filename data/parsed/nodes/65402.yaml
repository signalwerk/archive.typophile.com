      <p>I like your work!</p>
      <p>There's a few places in the digits where some of the curves do not seem to flow together, particularly around the ball serifs.  Two examples are the top left curve of the top of the 4, and the top right of the 3.</p>
      <p>Also, there seems to be a spur on the top of the q, probably because of duplicated points.</p>
      <p>Best wishes,<br>
      Stephen</p>
