      <p>Looks great. Just a few points:<br>
      - the upper serif of the q looks like it is just a mirrored p. try to mirror it, like on d, l h etc.<br>
      - the f needs also more crossbar, it looks too much like a long s (ſ).<br>
      - the upper end of the lowercase thorn feels rather uppercase: should be like l.<br>
      - lower the bowl of the uppercase Thorn to have it more different from P.<br>
      - The broad diagonals in VWXY appear a bit too broad compared with the vertical stems IMHO.</p>
      <p>Andreas</p>
