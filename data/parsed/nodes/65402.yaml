    html: |-
      <p>Some handsome stuff going on here, and the concept is interesting.<br>
      Hairlines this fine will only work at a larger size than what appears in your specimen, I think.<br>
      Accent shapes are too strange.<br>
      /f/ needs more weight in the hood: "affliction" looks like "attliction." /t/ needs more above the crossbar too.<br>
      /g/ looks very horizontal compared to the other letters.<br>
      Should humps branching from stems (/m/, /n/, /r/ for example) come out of the stem lower? look also at joins at bottom of /a/, /b/, /d/, /u/, etc.<br>
      /R/'s leg looks stunted (caps and small caps)<br>
      I'd make /@/'s loop more symmetrical.<br>
      Thin in the middle of /W/ (caps and small caps) looks like it doesn't align as it intersects the thick.<br>
      (I'd also make the specimen black on white.)</p>
