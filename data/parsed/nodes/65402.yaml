    <p>Hello Typophiles!</p>
    <p>I would like to get some professional feedback. I've started drawing a didone-like<br>
    alphabet, taking Bodoni, Didot and a few similar font - and using my imagination and eye at least.</p>
    <p>First of all this is meant to be a self-training project - and I like well-crafted Didone-s too so try to achieve something like that :)</p>
    <p>It is a very early stage - the very basic letterforms are still tweaked here and there, but I like its slightly condensed look. Small caps and text figures are added using some automated effects and hand-tweaking the results of these.</p>
    <p>I've tried to letterspace only the lowercase so far but the first result was a too tight look when text set and way too far wordspaces. First print test showed it too clearly.</p>
    <p>Now it would be great to get some professional feedback and any c&amp;c regarding this project.</p>
    <p>Thanks a lot in advance!</p>
    <p>f.</p>
    <p>P.S.: Sorry for the not-so-good English.</p>
