    <p>Hey Guys...</p>
    <p>I have a big problem and I know there are a bunch of smart font people on here so I sure you can help...</p>
    <p>I'm building an icon font in FontLab Studio 5.1 and for the life of me I cannot get the font to show up in Microsoft Applications (Word, Powerpoint etc.). Shows up in every other professional app like Illustrator, InDesign... I read all the docs on Microsofts website pertaining to output when making a typeface by MS standards and I followed it perfectly (I think). </p>
    <p>DOES ANYONE KNOW THE TRICK TO GETTING CUSTOM FONTS TO SHOW UP IN MICROSOFT APPLICATIONS?</p>
    <p>I'm hoping someone can lead me in the right direction...</p>
    <p>Thanks a ton in advance :)</p>
