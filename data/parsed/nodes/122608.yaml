    html: |-
      <p>It's literally not showing up at all? My experience is that Office 2011 is not keen on large numbers of fonts. A while back I had a huge number (thousands) installed and fonts kept randomly disappearing from the dropdown menu for no reason. If you think you have a lot of fonts that you rarely use on your machine, try deleting them and rebuilding the font database as per Microsoft's instructions. It worked fine for me once I'd trimmed things down. Also maybe try clearing out alternate builds: I once had a problem where I'd modded an <a class="freelinking external" href="http://www.georgduffner.at/ebgaramond/" rel="nofollow">open-source font</a> to make the infant a and g characters default and the new version wouldn't show up as I hadn't changed the font info properly.  </p>
      <p>Microsoft's take isn't entirely unfair, IMO. What they're effectively stating is that while they undertake to debug against system fonts supplied with OS X and the set supplied with Office, the onus is on a font designer to make their font work, not on Microsoft to find out why some font they've never heard of isn't working (the likely answer being because of a bug in it). It's a bit lame (and I would love if they actually undertook to fully implement the OpenType specification, seeing as they actually co-wrote it), but you can see their perspective.</p>
