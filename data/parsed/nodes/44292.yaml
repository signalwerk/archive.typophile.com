    <p>I’m working on ads for a furniture store. I’m a little helpless what to do with the typography on the ads. The typefaces I’m using right now are Farnham Italic Swash for the headline and Dolly Regular for the subheadline and with the logo as a tagline. I think it’s really boring looking. Do you have any suggestions for me what to do typographically?</p>
    <p>thanks for any response!</p>
