      <p>Thank you guys for your comments. I’ve been looking at that A for the last hour or so and I’m also starting to see that it’s just not so.<br>
      Because the overall identity was supposed to be very simple and clean I was depending on that A to be just right so that I could differentiate myself without looking out of place. </p>
      <p>I wanted it to be unique but not overly ornate that it felt out of place against a solid or white background with Gotham Rounded, bt right now it sort of looks like a mess. Im going to work on this tonight after to work!</p>
      <p>For now I have posted a very early concept sketch of the whole thing. (Where Are You Going/Where Have You Been was what I wanted to use for the theme of my portfolio and personal statement when I was first planning things out)</p>
