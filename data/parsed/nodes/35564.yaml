      <p>I like the white card...maybe try swapping the black and red so that the A is the highlighted element in red. At the same time, maybe knock the shadow/3-D back to a 50% black tint.</p>
      <p>I agree that the dashed line just seems extraneous. I’d skip that.</p>
      <p>The only other suggestion is that the A seems a bit in limbo stylistically. Is it meant to be a reminiscent of antique type? If so, maybe go with a more rustic aesthetic like this:</p>
      <p><a href="http://www.archivetype.com/content/view/40/30/" title="http://www.archivetype.com/content/view/40/30/">http://www.archivetype.com/content/view/40/30/</a></p>
      <p>Otherwise, if it’s meant to feel more linear and modern, perhaps push it a bit farther in that direction.</p>
