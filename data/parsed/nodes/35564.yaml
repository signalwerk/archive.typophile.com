    <p>I have been putting together a personal identity for university applications for my portfolio, envelopes, business cards, and other things for meeting with admissions councilors and for submitting the actual applications and portfolio itself.</p>
    <p>So far I have a general which uses an A mark I designed that bleeds off of the right hand side of page and Gotham Rounded for most text and probably Swift or Mercury for longer text applications ( primarily for my personal statement ), and a design for a business card.</p>
    <p>Tell me what you think!</p>
