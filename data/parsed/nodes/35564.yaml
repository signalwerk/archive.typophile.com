      <p>I prefer the red card vs the white. It feels very clean and strong. A few comments though:</p>
      <p>I like the large A, but the shadow is kind of weird. The lines on the bottom don’t seem evenly distributed, and in the middle of the A, the lines don’t match the angle of the cutoff.</p>
      <p>I don’t get the squiggly line. What’s the reasoning behind it? Watch where it intersects with your name—it causes visual tension with some letters.</p>
      <p>I think you can take your contact info down a few point sizes. Right now your name doesn’t stand out because it is the same size as the contact info.</p>
      <p>You might want to make P and E italic as well, in order to help them not blend with the info that follows.</p>
