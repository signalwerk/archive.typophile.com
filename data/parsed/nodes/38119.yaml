    html: |-
      <p>I think "Coldwell" is not a font, although it seems to me to be inspired by Handel Gothic and Motter Tektura.</p>
      <p>BIENES RAICES is a <a href="http://www.myfonts.com/fonts/linotype/itc-berkeley-old-style/itc-berkeley-oldstyle-medium/" rel="nofollow">ITC Berkeley Oldstyle</a>. Another plausible match is <a href="http://www.myfonts.com/fonts/lanston/ltc-californian/" rel="nofollow">Californian</a>.</p>
