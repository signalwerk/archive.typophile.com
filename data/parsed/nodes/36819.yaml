    html: |-
      <p>I think you failed to embed the fonts in your pdf and got substitution fonts which doesn’t help.</p>
      <p>To work with what you have think of it as 4 related pieces of information<br>
      1 Company name/logo<br>
      2 Name and position<br>
      3 Postal address<br>
      4 Telephone numbers and e-mail address</p>
      <p>If you treat 3 and 4 as equal importance try setting them as two blocks all the same weight and point size, no superscript, ranged left, use a tab after tel and fax and before e-mail so that each element starts from the same point on separate lines so it is easier to pick out the various elements – that should give you two blocks each with three lines; position the postal address to the bottom left and the numbers and e-mail so that the type starts at the centre. Name is more important than addresses so you could make it a larger point size than addresses although title could be the same size. Avoiding small caps will mean you don’t get the mixed weights – Title Case will be better, there are many ways to position it but you could start with centred as you have it. The logo is a different problem a simple ‘holding’ text logo could be to set gentle breeze in Palatino Italic with Capital Group in Palatino Roman underneath.</p>
      <p><em>gentle<br>
      breeze</em><br>
      Capital Group</p>
      <p>The italic at a larger size, positioning again has many options.<br>
      Just some suggestions for DIY – no substitute for the real thing (I took a look at logoworks.com which made me wince).</p>
      <p>Tim</p>
