      <p>I'm afraid I must agree with Jan. I also don't want to be rude, of course.<br>
      But I would start with resetting the spaces and letterspacing on the 'gentle breeze' and 'capital group'. Now it looks a bit like something has gone wrong with the prepress or something. ;)<br>
      The false small caps in the name also need to go in my opinion. Either just use lowercase characters with init caps, or choose a typeface with proper small caps (you should probably use something else then Arial anyway).<br>
      The contact information part also looks a bit cluttered. It's mostly because of the (false?) superscript, and the smaller pointsize of 'tel' and 'fax'. I'm not a fan of the digits in brackets either, but maybe that's a standard way of writing phone numbers in de USA, if so, ignore me.</p>
      <p>As for the placing and composition itself, maybe try to just align the text either left of right, instead of centered. And  for example try to align items to each other, so that it becomes more a whole, instead of several individual groups placed seemingly random on the card.</p>
