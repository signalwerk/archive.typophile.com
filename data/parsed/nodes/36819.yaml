      <p>Hi John,<br>
      My suggestion if you are on a tight budget is to head for your local small print shops and see if they offer design services.  I once worked for a print shop where we would do the logo and business card design as part of a package deal if the client ordered enough business cards.  Ask to see samples of their work first.  You might bring in samples of colors you like or tear out magazine pages that to you express the feeling your want your logo and card to have.</p>
      <p>You also could look around to find a business card you like from a totally different line of work and geographic location than your own.  Show it to people you know and see if they too think it looks nice and professional.  Once you locate a good card, choose similar fonts, alignment and spacing to what is on that card.  (I said SIMILAR...it's best never to copy exactly...vary the colors or font or something.)</p>
      <p>For your own growth in things graphic, I highly recommend the book The Non-Designer's Design Book by Robin Williams (a different person than Robin Williams the comedian).  This is a straightforward book about how to make newsletters, posters and yes, business cards, look better.  I think it will really open up your eyes.</p>
