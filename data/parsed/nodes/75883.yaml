      <p>This is looking good. /a/ works for me. I think roman /W/ is splayed too wide (I'd make the bottom vertices closer together), and /y/'s tail is a bit too long for my taste (maybe /j/'s too, but maybe not).<br>
      I wonder if the bracketing on the serifs on the thick strokes should be trimmed back a bit, particularly on the capitals - to my eye, you're getting some dark spots there.<br>
      I think the disconnected bowls in the Latin work fine. /R/ (like /K/) has some sassiness to it which it would be neat to see work. Right now, it (/R/) might be a little dark overall.</p>
