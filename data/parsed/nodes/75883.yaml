    html: |-
      <p>Alright! I'm back.</p>
      <p>Since the last post I've done lots and lots of work on Walleye. I've created a bold and bold italic, and I've made what's needed for supporting polytonic Greek, and I've coded many OpenType features, and I've done some rethinking of various characters. It's all shown in the new specimen that I'm attaching at the top (WalleyeBig.pdf). </p>
      <p>What do you think of this? I have to admit that when I started this two years ago, I didn't think it would get to be nearly this big of a project. I also didn't do any serious research into readability, Cyrillic design, or the history of the Greek alphabet. All my learning was done on the fly. So it's a miracle if there are no glaring mistakes in this font. </p>
      <p>One of my big fears is that the design itself is too weak and I should've waited until I had a stronger idea before sinking two years of my font designing energy into this project. Yet I'm this deep already, so I might as well polish it into something usable. Don't be afraid to offer rather sweeping criticisms. </p>
      <p>As before, I'm hoping especially for someone to let me know whether my Cyrillic and Greek alphabets are just totally way off, since I don't actually fluently read those alphabets. But I would also really appreciate any and all comments.</p>
      <p>Thanks a bundle for looking!</p>
