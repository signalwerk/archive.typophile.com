      <p>New pdfs at the top—WalleyeBig2.pdf and Stannum.pdf. In Stannum, I try out a slightly different S (probably not changed in the right direction, I'll keep thinking about this) and /hmn/ with deeper arches. </p>
      <p>WalleyeBig2 shows everything. Things I've changed since last time:<br>
      —Evened out the white spaces inside all the /M/s.<br>
      —Added contextual alternate for f before things that come above x-height and shouldn't be collided with.<br>
      —Fixed old-style figures' heights so they're all on a level with small caps. For some reason I had them all miscellaneous.<br>
      —Lightened tail of the /Q/s.<br>
      —Enlarged sups, infs, numr, dnom.<br>
      —Shrank all the serifs on the vertical-stem-based Cyrillic letters, after discovering that they were alarmingly big and flappy. Relatedly, spaced these letters out a little looser.<br>
      —Changed xi and ж. Looking better?<br>
      —Changed the methods of the gj, jj, <cite>gf</cite>, and <cite>jf</cite> ligatures. Now the second letter is replaced with a special alternate that's made to fit with the preceding one. So now it's handled through calt.<br>
      —Various tweaks here and there.</p>
