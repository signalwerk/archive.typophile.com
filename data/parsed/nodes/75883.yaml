      <p>Yes, please post a new revision once you have it.</p>
      <p><cite>So, for ЦцЩщ, I guess the "banner" descender is just too old-fashioned or distracting? I've been wondering about that since I made those.</cite></p>
      <p>The banner-like <em>ЦцЩщ</em> look very lettering-inspired,<br>
      they just don't fit in a text typeface.<br>
      You might leave them as alternates, if you tweek them in a more conventional way<br>
      as in Academy<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/academy_3535.png"></div><p></p>
      <p>You will need to revise the stroke modulation and extend the shoulder.</p>
      <p><cite>How necessary are the serifs on italic гз? I see a lot of other<br>
      fonts without serifs on those and it seems like it would<br>
      be hard to make them look good in Walleye.</cite></p>
      <p><em>г</em> doesn't have serifs –&nbsp;you need to extend the terminals<br>
      to balance the white space.</p>
      <p>Yes, traditionally (in Didone typefaces) /з/ italic has no top serif.<br>
      Although, a serif or splayed terminal would fit better in your case,<br>
      considering you have a broad-nib design. Try it.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/kuenstler_4706.png"></div><p></p>
