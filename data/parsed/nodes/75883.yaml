  - id: 506591
    user: 7642
    date: 2012-04-21T20:20:00
    date_raw: 21 Apr 2012 — 8:20pm
    votes: null
    html: |-
      <p>Thanks for the comments! It's good to know it's an okay design. I think familiarity has been breeding contempt for me lately. </p>
      <p>Hrant, when you said the italic was unhappy, my first thought was this: Maybe you're picking up on the detailing of the lead-in serifs for lowercase letters. In the roman those strokes are all convex, but in the italic I've somewhat inexplicably made them concave. I think convex looks more optimistic. But I've been thinking concave might actually fit better with the design, so I've started considering changing the whole roman to concave serifs. I haven't mocked that up yet, but when I do I'll post it here.</p>
      <p>But it could be you're seeing what Eliason is seeing. Eliason, I hadn't thought of changing the italic serifs, but it's an interesting idea. I'm just having trouble picturing it in a way that would leave the italic looking like it's still related to the roman. I kind of have this thing where all the italics I design are very different from the romans, so I always cling to every remnant of similarity they have so they won't look like I just made two different fonts. The capitals are where those similarities abound most. If I can't get a different serif to work, maybe I can fix the S by making the banner less prominent (shorter, a bit thinner on the right).</p>
      <p>I'll work on the Q and M, and take a look at the H (I actually thought it might be too narrow). And I'll check out the italic ж and the general spacing of the roman Cyrillic. I should study up on italic ж's.</p>
