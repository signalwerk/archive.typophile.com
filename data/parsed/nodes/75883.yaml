  - id: 506554
    user: 3254
    date: 2012-04-21T11:01:00
    date_raw: 21 Apr 2012 — 11:01am
    votes: null
    html: |-
      <p>Looking good!</p>
      <p>The challenge you've set for yourself particularly in the italic is summed up in the cap /S/. How do you work together the more "typographic" details with the "pennish" qualities like those thick blunt unseriffed terminals that you want? In the italic /S/ it starts with a "typographic" terminal serif at the top right, then switches gears around the first bend and becomes looser and more "written" looking. Maybe this ambivalent character is what Hrant is seeing as "unhappy." That /S/ is a little Frankensteiny.<br>
      Perhaps the cap italic serifs should try on a less formal form?</p>
      <p>Italic /Q/ (full-size and small caps) tail may be a touch too dark.</p>
      <p>I love the italic /Y/!</p>
      <p>Is italic /H/ a touch too wide?</p>
      <p>I would try revising all your cap /M/s to give more space to the lower side counters and less to the upper middle counter. This looks especially strange in italic small cap /M/ but might need addressing in the other forms too.</p>
      <p>Superscript/subscript figures could be bigger to make them easier to read.</p>
      <p>I'm not confident enough in the alphabets to offer critique of the Cyrillic and Greek (though I will say that I see dark spots caused by your italic /ж/).</p>
