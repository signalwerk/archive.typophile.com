      Italic /p/ is too heavy along the mean line.<br>
      In the roman, is /hy/ kerning too loose? Is /Wa/ kerning too tight? Have you done caps to caps kerning? In the string of italic capitals it seems rather uneven (e.g. /R/ looks closer to /S/ than /Q/, /G/ looks closer to /F/ than /H/).<br>
      Any way to open up the lower counter of bold roman /k/? Maybe trimming back that stem serif?<br>
      I still think italic /Q/ tail is too dark, especially in the bold. And/Or its bottom bowl could be another place where you take a little weight off.<br>
      You might raise that lovely upper right part of italic /v/w/y/ a hair. Consider raising the top of roman /t/ a touch too.<br>
      Bold roman /g/ looks too tall, like it is popping up above the mean line.</p>
