    html: <p>Hrant, I think you are being oversimplistic with the OT cost issue. Yes, I am sure <i>some</i> will use it as an excuse to inflate prices, but there are others who will use the technology to further typographic design rather than further their own selfish ends.  <br> <br>No doubt it will be left to the indys to lead the way - take Jeremey Tankard's new Aspect family as a prime example of using OT innovatively, and without apparent price inflation. <br> <br>Dont condemn an entire technology, condemn companies that misuse that technology. For example, Thomas Phinney of Adobe, speaking at TypeCon2002, did little to reassure people (well, me) that it was nothing more than an excuse for his department to milk a (designer) cash cow. LAck of upgrade options were squirmed around in a way that made me feel decidedly uncomfortable, not only for the transparent spin but also the technological innaccuracies. <br> <br>I am sure that many of the larger, more "serious" families created by Adobe <i>will</i> make reasonable use of the technology, but I doubt that converting the entire library over to OT by the end of the Autumn will herald a new era in typography. <br> <br>Concentrate your efforts on those that deserve it, Hrant <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"></p>
  - id: 12993
    user_id: 1215
    user_name: kentlew
    user_path: null
    date_raw: 29 Jul 2002 — 4:27am
    date: 2002-07-29T04:27:00
    votes: null
    html: <p> I agree with your sentiments, David. It's not the technology, it's who uses it and for what. <br> <br>Regarding Adobe, however, I think the form of their greed may be slightly different than you imply. I believe the primary motivation for converting the entire library to OTF is to actively court Microsoft's corporate Windows market. OTF is cross-platform compatible, so big companies should no longer be afraid to buy lots of fonts. (And while they're at it, they can buy copies of PageMaker for all their employees, and then they won't need to hire designers anymore.) </p>
  - id: 12994
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 29 Jul 2002 — 7:31am
    date: 2002-07-29T07:31:00
    votes: null
    html: "<p> David, you have a point, but I *love* OT - I'm not in the least condemning it. Heck, Adobe might even be excused for their \"cleverness\" considering the poor state of the font market. <br> <br>But business is business, and the reality is that the same identical font with no extra features (in fact with a somewhat higher technological barrier!) can sell for a bit more under the guise of OT. The same way that Toyota changes the bodywork on their Camry, calls it a Lexus something-or-other, and doubles the price; the same with Audi using VW \"essentials\": the much-touted TT is just a really fancy Bug. Some people take advantage of this business reality, others have more scruples. <br> <br>In fact, historically font houses have always looked for (and maybe even sometimes concocted, or at least helped concoct) new formats to resell their core value (sets of letterforms) to a saturated market. Many of these fonts we're using have been around for hundreds of years, and we're constantly having to re-pay for them... It's the price of technology I guess - it has a life of its own, with a ravenous apetite that must be fed. <br> <br>hhp </p>"
