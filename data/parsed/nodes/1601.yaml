    votes: null
    html: <p> Adobe has a whole bunch of motivations for creating OpenType fonts. Trying to make disproportionately more money relative to the work that goes in or the value users get is not among those motives, though. <br> <br>I understand David Earls' concern about upgrade issues. It's true that we don't have a great story there (though Font Folio owners/buyers will be in good shape). <br> <br>That aside, we are working very hard to make our OpenType fonts highly worthwhile, both by making good fonts, and by helping the rest of Adobe develop applications that support them. In particular, the final set of "converted" fonts will include a lot of fonts that look a lot like "Pro" fonts in terms of typographic features, from having merged Expert and supplemental fonts. However, these are still considered "Standard" fonts by Adobe, as they have only the basic language support and lack the additional custom characters and fine tuning of Pro fonts. I think they will make a great value, and in general they are actually quite a bit cheaper than buying the separate Type 1 fonts would be. <br> <br>On top of that, there are the intro prices on each new set of OpenType fonts, at about 1/3 off the regular price. I don't see that as a grab for money on Adobe's part. <br> <br>Regards, <br> <br>T </p>
