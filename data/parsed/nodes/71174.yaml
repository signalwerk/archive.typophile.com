    html: |-
      <p>/S/ is malformed. It's hard to describe exactly how, but when I look at the word "HEISENBERG," the /S/ stands out. I think the lower stroke is too thick, for one thing. And the right/lower curve seems a bit squashed on the bottom. Finally, I think the underside of the top curve should bow up slightly to match the top more closely. I did a sketch:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/S-Correction_3668.gif"></div><p></p>
      <p>Very small changes, obviously, and kind of hard to see at this resolution, but you can see where the lines are bumped inside or outside of what you have.</p>
      <p>In fact, all of the round characters seem to be slightly overweight. /Q/ and /G/ especially.</p>
      <p>/j/ looks like it's being pulled away by someone with a fishing rod offstage.</p>
      <p>There are numerous egregious kerning issues. Is this typed copy or was it handset? It's difficult to judge the color and balance with these odd gaps. A larger block of text—properly kerned—will be essential for critiquing beyond the few obvious oddities.</p>
      <p>My favorite bit is the counter of the /c/. I think the capital /C/ has a lot of character too.</p>
