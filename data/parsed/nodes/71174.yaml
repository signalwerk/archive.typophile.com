    html: |-
      <p>I've recently finished a preliminary spacing based on a description I've read of Walter Tracy's method. A new PDF is up top, with blocks of text in 12, 10, 9, and 8pt. I just used random stuff from Miguel Sousa's adhesiontext tool, and made paragraph breaks and changed some punctuation. I set it using XeLaTeX, left-aligned for critique of the spacing.</p>
      <p>I adjusted six, seven, eight, and nine. I also changed the tail of the /y/ and the ear of the /g/ so that they're more abrupt and don't taper as much; I think it's more consistent this way (compared to the lower terminals of /c/e/t/ and the seven). Any feedback (especially on the spacing) is much appreciated!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/update6789gy_5851.png"></div><p></p>
