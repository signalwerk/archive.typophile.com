  - id: 418302
    user: 65317
    date: 2010-07-01T02:45:00
    date_raw: 1 Jul 2010 — 2:45am
    votes: null
    html: |-
      <p>Thank you for the feedback! This has been very helpful.</p>
      <p>/S/ is a very difficult character... and my failure to catch the /j/ issue just goes to show that I should have studied more fonts before trying this! Gah it's so obvious now!</p>
      <p>Anyway, I've been away from the project for a while, so upon coming back I added numerals and some other tidbits. They're very rough drafts at the moment; I'm finding eight to be very challenging, and I'm not satisfied with the lower terminal of seven. Six and nine are also iffy, I think.... Of course, fixed the /j/ and shortened the /r/ arm. I tried to fix /S/, but... well, you can judge that for yourself.</p>
      <p>Everything so far is typed; I'm not sure how to handset... the closest thing I have would be LaTeX, and it seems that that would require a whole ton of \hspace commands.... I've just been temporarily installing the font on my system and using TextEdit to make samples. In the latest update, I started playing around with the spacing (lowercase only), but before that they were all a constant 24 em units on both sides, with some obvious exceptions. I'm honestly a little lost when it comes to spacing, and I've read that kerning is not to be touched until spacing is <em>perfect</em>... I'm thinking spacing and kerning just might prove even more a challenge than drawing the glyphs!</p>
      <p>Here's the update, and I'll put a new PDF up top as well.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/update_3666.png"></div><p></p>
