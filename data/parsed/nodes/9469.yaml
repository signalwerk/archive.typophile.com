  date_raw: 28 Feb 2005 — 11:59am
  votes: null
  html: <p>Ladies and gentlemen, <br> <br>I'm working on a book project (with a layout more akin to a magazine) and am looking for a good sans-serif family that has a wide range of weights and also has small caps. I really like FF DIN and Griffith Gothic, but neither come with (as far as I can tell) small caps. Thesis, Myriad and Interstate are fine families, but have they become overused? Whitney has some potential... <br> <br>I've come to appreciate your input and expertise on these boards and look forward to your feedback.</p>
  html_clean: <p>Ladies and gentlemen, <br> <br>I'm working on a book project (with a layout more akin to a magazine) and am looking for a good sans-serif family that has a wide range of weights and also has small caps. I really like FF DIN and Griffith Gothic, but neither come with (as far as I can tell) small caps. Thesis, Myriad and Interstate are fine families, but have they become overused? Whitney has some potential... <br> <br>I've come to appreciate your input and expertise on these boards and look forward to your feedback.</p>
