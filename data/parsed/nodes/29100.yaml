      <p>Thomas, </p>
      <p>thanks for bringing it up. Indeed, it is correct to assume and rely on the fact that a font file with a .ttf extension is an OpenType TT font, but a font file with an .otf extension may be either an OpenType PS font or an OpenType TT font. I haven't yet seen any retail OT TT fonts with an .otf extension but I'm sure it's only a matter of time until they appear. </p>
      <p>Adam</p>
