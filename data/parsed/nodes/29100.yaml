    <p>Hi,</p>
    <p>I have being blessed by PHP-driven TypeTester. (Thanks Dieter!) The typetester works exactly as I want it to if I genereate my fonts in TrueType format. Then the typetester displays all character sets correct. It displays å ä ö and all the mathematical and accented characters exaclty as they are.</p>
    <p>However, since I only produce OpenType fonts, I would very much be able to use OpenType fonts to render the images instead. But any OpenType font makes the TypeTester forget about the accented charachters, and some characters becomes mixed up with others.</p>
    <p>I think it’s about some encoding issue, but I havent got the slightes idea on what to do.</p>
    <p>Is there some "trick" I could do when exporting my OpenType fonts for the Typetester for it to work the same way as a TrueType font when it comes to displaying characters? Maybe some Encoding option in FontLab?</p>
    <p>In that case I dont have to do a TrueType version of the font specific for the tester.</p>
    <p>The OpenType rendered images also gets more smooth, so the font looks better with OpenType format...</p>
    <p>The typetester can be seen at:<br>
    <a href="http://autodidakt.se/index.php?page=autostyler" title="http://autodidakt.se/index.php?page=autostyler">http://autodidakt.se/index.php?page=autostyler</a></p>
    <p>Anyone around here with these kind of knowledge?</p>
    <p>I’m forever grateful for all help.</p>
