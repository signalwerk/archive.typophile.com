      <p>&gt; An OpenTpe-TTF font will never have a .otf extension.</p>
      <p>This is an obscure trivia point, but... actually, it is perfectly legal for it to do so. The reason for it to have a .ttf extension is purely for backwards compatibility. Microsoft has often made noises that they may change all their .ttf extensions to .otf one of these days.</p>
      <p>T</p>
