      <p>I am supremely confident that someone will correct me if I'm wrong, but...</p>
      <p>The Truetype fonts which Fontlab produces are, in fact, Opentype fonts, but TTF-flavored instead of CFF flavored. However, in order for the TTF fonts to carry the .otf extension, they must be digitally signed, while the CFF fonts do not require the dsig. In any event, it has been my experience the TTF-flavor fonts seems to behave better overall that the CFF versions. I suspect this may be because Adobe has a few bugs to work out...which is perhaps why a new and improved version of the OT FDK is under development.</p>
      <p>In the meantime, why don't you go with what works? Generate TTF fonts to use on your website and continue to sell your OTF fonts.</p>
