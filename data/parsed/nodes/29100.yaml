      <p>&gt; <em>in order for the TTF fonts to carry the .otf extension</em></p>
      <p>This part is incorrect. An OpenTpe-TTF font will never have a .otf extension. One of the reasons why a TTF font needs to be digitally signed, is so it gets the correct icon under Windows.</p>
      <p>&gt; <em>I suspect this may be because Adobe has a few bugs to work out…</em></p>
      <p>Yep, we spend a lot of time working out bugs, especially the ones in OSes and non-Adobe apps... :^/</p>
      <p>&gt; <em>which is perhaps why a new and improved version of the OT FDK is under development.</em></p>
      <p>Like any other app, the FDK is (and has been) _always_ under development. The reason why you're currently hearing a lot of buzz about it, is because all the version between 1.6 and 2.0 were not made public. The last release (v1.6) before the current one, had been made available more than three years ago.</p>
