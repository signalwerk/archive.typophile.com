    html: |-
      <p>Giles,</p>
      <p>John H is right, it is a big world out there for latin script languages. And while most of us are trying to include as large a character set as is economically feasible, there is some latin-script language support that is not complete in an off-the-shelf-font. My advice would be to identify the fonts you desire and see if those font developers are interested in adding any missing glyphs you may need. It doesn't hurt to ask.</p>
      <p>James M</p>
