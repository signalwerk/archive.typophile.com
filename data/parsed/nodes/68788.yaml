    html: <p>Yes, it all depends on the scope of languages / scripts you require. Andron Mega currently covers about 300 languages, both extinct and major/minor recent ones. At least for the Latin-related and Cyrillic-related languages you’ll find an utmost comprehensive coverage provided. Please check <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=280&amp;changelang=2" rel="nofollow">this alphabetical list of languages</a>. (I still need to update it with the most recent UDHR samples.)</p>
