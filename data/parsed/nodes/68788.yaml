      <p>A lot of foundries, not just Linotype or Apple, Microsoft and Adobe, now regularly produce fonts that cover all the Latin-script using languages. These from my foundry, Shinntype:</p>
      <p>Beaufort Pro<br>
      Duffy Script<br>
      Figgins (also Cyrillic and Greek)<br>
      Oneleigh<br>
      Paradigm Pro<br>
      Pratt Pro<br>
      Scotch Modern (also Cyrillic and Greek)<br>
      Softmachine</p>
