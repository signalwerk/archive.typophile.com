    html: |-
      <p>Nick: <em>A lot of foundries, not just Linotype or Apple, Microsoft and Adobe, now regularly produce fonts that cover all the Latin-script using languages.</em></p>
      <p>Careful, Nick: there are a lot of Latin-script using languages that are not covered by those fonts, which focus on European languages and only accidentally support some other languages. Yes, these fonts are a big improvement on those that only supported major Western European languages, but it's a big world with a lot of Latin-script alphabets and diacritic letters to account for.</p>
    html_clean: |-
