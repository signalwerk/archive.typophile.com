    <p>Hi There,<br>
    I have a client who wants there designs marketed in loads of different countries. I just wondered what the best solution is around fonts displaying and printing in various languages. Should most typefaces from somewhere such as linotype support this? What should I look for?</p>
    <p>cheers</p>
