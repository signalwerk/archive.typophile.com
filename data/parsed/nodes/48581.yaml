    <p>Hi folks,</p>
    <p>I’m designing my resume, and have it all set in Whitney. It looks great, but a bit dry. I was hoping to set my name in a different font to add a little flavor, but can’t find a good pairing.</p>
    <p>Anyone have a good suggestion for a display font to pair with Whitney? My initials are S.H. so anything with nice versions of those letters would work well.</p>
    <p>Thanks!<br>
    Sam</p>
