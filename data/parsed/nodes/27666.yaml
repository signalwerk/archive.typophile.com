      <p>Alan,</p>
      <p>Perhaps you encountered the bug in FLS which was reported and confirmed about 2 months ago. It concerns kerning and the FontInfo option of reordering glyphs on export. But this bug shouldn't affect export in Macintosh PostScript Type 1 format.</p>
      <p>Regards,<br>
      Johnych</p>
