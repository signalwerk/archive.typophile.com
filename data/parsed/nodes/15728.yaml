    html: |-
      <p>Dan,<br>
      I have tried the Tracker.  It has problems too.  The left column instead of repeating “Forum Topic” again and again, should show WHICH forum the post was from. That way if someone was looking for Critiques posts, they could look down the column and find them.  Even better if you could sort by forum so a user could group the things he/she was interested in.<br>
      The tracker could also list the name of the recent poster with the time.  This would help you decide if you want to read it.  For instance; if I was the last poster to a thread but can’t keep track of exactly how many minutes/hours/days ago that was, I don’t want to reread my own post.  If my post was addressed to specific people as a question, I would look to see if those people had answered.<br>
      I have also tried the “my Threads” listing which sorts in some bizarre way.  Instead of putting the most recent post at the top, it sorts by when you first visited that thread so you have to scroll your life away to check everything.<br>
      I am sorry. I know this sounded ranty. I don’t mean to dump on our bunch of very fine people who volunteer their time to make this site work.  Please don’t take any of my spewing personally.  I know you are all doing the best you an with the time and resources you have to work with.</p>
      <p>ChrisL</p>
    html_clean: |-
