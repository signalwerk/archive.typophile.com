    <p>Being completely new to the typographic world, and obviously trying to build a nice font collection for design purposes, I wonder which freeware/free typefaces you consider as a must-have.</p>
    <p>Why only free ones? Being a designer with somewhat a limited budget, I need to slowly expand my collection as my workload increases (and my wallet). I've been aquiring typefaces steadily (among those the ones I love and I urge you guys to buy are Alana from Laura Worthington, Gelato Script from Schizotype and Owned from Typodermic) and I do so when possible but that is not the case right now.</p>
    <p>So, please enlighten me in this topic. <strong>Which free fonts do you consider completely indispensable? </strong></p>
