    html: |-
      <p>Hmm. I'm a late arrival. To answer the question, I don't find any font completely indispensable. Actually, I don't find any font to be partially indispensable.</p>
      <p>I'd assume that as a designer, you've purchased InDesign, which comes with a lot of fonts. So, I suppose that you're looking for fonts not used by other people, for a sort of "self-branding" purpose? The free font world is populated by some giveaways from larger families, which might work for advertising. The open source world still has a lot of dogs, but careful prowling will turn up promising fonts, and a few real gems. That's where a font editing program is useful. </p>
      <p>In my word -- books -- useful is far more important than new, which lets judicious purchases go a long way. I understand that it is a world many find boring, and not terribly profitable. Again, I'd prowl fontsquirrel, dafont, and the TeX font resources. Open source fonts and FontLab Studio will teach you a lot, as well as expand your font library.</p>
      <p>Try Lato, BTW. <a href="http://typophile.com/node/77283" title="http://typophile.com/node/77283">http://typophile.com/node/77283</a></p>
      <p>And look at the League of Moveable type. I don't find the Goudy clones too useful, but while he lacked a sense of space, Goudy was a good man with a curve. Some of these "based ons" might work for you.</p>
      <p>Actually, just Google "open source fonts" and spend a couple days going to the sites. </p>
      <p>FWIW</p>
    html_clean: |-
