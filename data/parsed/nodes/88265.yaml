      <p>One doesn't need to go that far and compare Ingleby with Minion. Just take <a class="freelinking external" href="http://www.aldusleaf.org" rel="nofollow">Crimson Text</a> for example, which is still under development, but already superior to the odd flavor of Ingleby. Or <a class="freelinking external" href="http://www.linuxlibertine.org/" rel="nofollow">Linux Libertine</a> – another open source font. Just type words like „coequating“, “recognizeable” or “concept”... Anyhow that is just my personal opinion. </p>
      <p>Concerning Minion and the Adobe Reader, it seems like the software doesn't give a licence to use the font. The Eula says that a licence to use the software (and fonts) is issued only for the ways of use and purposes described in the documentation (help, online Adobe docs, etc…). Since there is no word in the documentation of how to install Minion, it seems that the Eula forbids it. (However it is another question, if the Eula is applicable in every country.)</p>
