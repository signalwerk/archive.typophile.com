      <p>&gt; <cite>I thought Adobe gave it away with their software…</cite></p>
      <p>It is true (at least on the Macintosh)  that MinionPro comes with the Adobe Reader, which is itself free. The font is however not installed systemwise, it stays inside the application, and I have no idea for what use. I strongly doubt the eula would allow you to install it systemwise.</p>
      <p>If you look at the README file for the <a href="http://www.ctan.org/tex-archive/fonts/minionpro" rel="nofollow"><strong>LaTeX Minion Pro Package</strong></a>, you can read<code><br>
      ---<br>
      Files<br>
      [...]<br>
      o 002.000: This version is included in recent Acrobat Reader<br>
                 installations and is currently for sale.<br>
      ---<br>
      </code>What do you make out of such a last statement? (Is it possible that older versions of the reader had a eula that would not have forbidden the installation?)</p>
