      <p><em>How would you define decent level of quality?</em></p>
      <p>Well, Andralexis obviously wants to use them for professional purposes. That means the recommendations should reflect this need. Ultimately that is something for the professionals here to decide, not for me. </p>
      <p>With decent level of quality I would mean that the outlines are crafted with a certain skill and correctness concerning font-construction guidelines, that the letters are properly spaced and that there is some level of kerning. Further that the programming part of the font is done well, so that it works well in different programs and operating systems. Some free fonts have problems here. </p>
      <p>To me personally Ingleby looks quite horrible, some letters are completely unbalanced, the a tips to the right, the c to the left, the e is horrible, the o is stressed to the wrong side, the q-serif is missing, the w too wide, the x crossbar is mirrored, etc...</p>
      <p>Here is a comparison to Minion:<br>
      <img src="http://img543.imageshack.us/img543/2237/screenshot20111214at751.jpg"></p>
