      <p>I think you can use 2 approaches to this:</p>
      <p>1. close-but-not-touching. This is more mechanical, and will probably leave a few holes. But it's one way to do it.</p>
      <p>2. Triplets. Isolate 3 letters and make sure the middle letter looks optically centred. Take the "ngs" triplet, and you will see that the "g" is too far left. Once the "g" is balanced, then the "n" in the "ing" triplet will probably look a bit off. So balance that "n", and then move on to the next triplet. And so on.</p>
      <p>You should try both these methods out and post the results. Also, print it out, squint at it, look at it upside down (either by doing a head-stand or simply rotating the page, whichever works best for you). And then -- repost.</p>
