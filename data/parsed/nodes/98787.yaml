      <p>I think you've gotten the "s" condensed just a bit much. As far as I'm concerned, the touching t's are preferable (some wouldn't accept it at all), and since they already touch, get the space between them smaller still. If you use a font editing program, you can go into the font &amp; make up special characters as you need them. It's an open source font...</p>
      <p>BTW, as a general comment, at our shop, we only expect the kerning in a font to work for text-size setting. With 300+ pages, you don't want to be adjusting things by hand. On the other hand, we assume any display type will need handwork.</p>
      <p>FWIW</p>
