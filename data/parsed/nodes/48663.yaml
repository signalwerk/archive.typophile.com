    <p>The project plan for my first font design calls for me to come up with the features and intentions of the prominent humanist sans faces of the twentieth century. Once that is done, I will make up a kind of brief for what my design will strive to accomplish, based on a selective composite of these historical faces.</p>
    <p>Some of the discussion at <a class="freelinking-external" href="http://typophile.com/node/48078">this recent thread</a> was helpful for this.</p>
    <p>. .  Gill Sans<br>
    . . . .  date<br>
    . . . . . .  1927-30<br>
    . . . .  designer<br>
    . . . . . .  Eric Gill, Monotype<br>
    . . . .  intended use<br>
    . . . . . .  advertisements<br>
    . . . . . .  signage<br>
    . . . .  design sources<br>
    . . . . . .  Johnston’s London Transport alphabet<br>
    . . . .  “humanism” comes from<br>
    . . . . . .  proportions<br>
    . . . . . . . .  narrower narrow letters (E, P, S, s) than grotesque<br>
    . . . . . . . .  proportions from Johnston, in turn from Roman classical letters<br>
    . . . . . . . .  two-storey a and g<br>
    . . . . . .  stress<br>
    . . . . . . . .  appears monoline, with thinning at branches (h, m, n, etc.)<br>
    . . . . . . . .  contrast most evident in a and e - bowl of a looks pen-formed<br>
    . . . . . .  dynamism<br>
    . . . . . . . .  seen in b (no spur on bottom, bowl is not circular), otherwise largely static<br>
    . . . . . .  details<br>
    . . . . . . . .  diagonals in Q tail, a tail, r arm, t top<br>
    . . . . . . . .  descenders on cap J, Q<br>
    . . . .  other design features<br>
    . . . . . .  E/F arms are even<br>
    . . . . . .  R leg is curved kickstand<br>
    . . . . . .  O/o appear perfectly circular<br>
    . . . . . .  M has vertical sides, high middle vertex<br>
    . . . . . .  chevron K and k<br>
    . . . . . .  round tittles<br>
    . . . . . .  round counters have flat stem side<br>
    . .  Optima<br>
    . . . .  date<br>
    . . . . . .  1952-58<br>
    . . . .  designer<br>
    . . . . . .  Hermann Zapf, Stempel<br>
    . . . .  intended use<br>
    . . </p>
