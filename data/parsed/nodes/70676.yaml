    html: |-
      <p>Do you have any composites that are scaled or inverted/reversed instances of other glyphs?<br>
      Do you have any composites that have overlaps?<br>
      Are all paths orientated in the correct direction?</p>
      <p>Use MS FontValidator on TT fonts to verify that there are no fatal errors.</p>
      <p>Malcolm</p>
