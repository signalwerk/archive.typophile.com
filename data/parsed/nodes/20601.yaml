      <p>Tim,</p>
      <p>Thanks I appreciate the comments. Honestly, we tried several other separators, including [{/ and others and just didn't like the. We kinda liked how the ( gave the logo some space, but you might be right we could find some other interesting separator. </p>
      <p>I sort of agree with your comment on the o, but a plain o just looked too weird to me. Might be wrong about that, though :) Haven't seen anyone I showed it to confused about it's meaning, fortunately, but I'd love to find something else to offset the effort.</p>
      <p>As for the ev kerning, good catch, I'll see to modifying that.</p>
      <p>FWIW, all the text (including the '(') is just plain old Century Gothic. The final o as it stands right now is just the greek small sigma, while the two e's are the cyrillic capital E and the cyrillic capital ukranian le respectively. We sort of chose them because it game some simmetry to the logo (and we software developer types like symmetry ;))</p>
