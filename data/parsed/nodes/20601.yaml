      <p>About the 'company name/deo' aspect.  I was just responding to Tomas when he said:</p>
      <p>"not something anyone else would recognize (and frankly they don’t need to, either)."</p>
      <p>This sounded to me like like they were making a part of the logo and name that was not functional. To me this sounded like he was maybe saying " Well, okay; this logo thing, it's not that important. I mean, if half of it means something to the customer - that's enough."<br>
      That sounded less that ideal to me. Thats all. If the 'e' works or not is just one aspect of a logo.</p>
      <p>RE: "If you get a customer requesting a logo, do you force them to change their name because you don’t like it? :)"</p>
      <p>Force them? Never. But convince them; if it's for the good of the business. Sometimes. Yes! I have actually convinced clients to change their whole identity. Name, logo &amp; everything. Sometimes that old identity had even won awards. But the reason to do it can never to do with my own likes or dislikes. How I feel is irrelevant. The reason to change a logo (or occasionally a name) must to do with effective marketing of the company and it's services. One client of mine was holding onto an award winning logo that no longer worked for them. Why wasn't it working? It related to a business model they were no longer using and which had publically failed. Even though the old logo had won an award it was not serving the business interests of the company anymore - the new logo helped them get 1.25 M in venture funding. The new logo served the new business interests of the comany &amp; helped them say: we are a new company with a new outlook and a new business model.</p>
      <p>Sometimes a logo is meant to work with consumers. Sometimes other companies. Sometimes with investors. Sometimes a combination. But it's wise to think about the purpose of a name &amp; a logo and craft it to be effective for your goals.</p>
      <p>Tomas, the fact that you use the word 'force' in your question tells me I am making my arguements to you in a way that is too strong. So I will stop questioning your approach to logo making here. I have made my point - probably too many times. If I can be helpful to you regarding the shape of an 'e' let me know.</p>
