      <p>This is an interesting discussion. FWIW, the "deo" in our name is a degeneration of "neo" ("new"), which was something we wanted to represent in our name but couldn't use directly (because of another company that used those three letters in an unrelated way).</p>
      <p>Eben did say something that struck me as odd. He said "it sounds like you are saying that the logo’s purpose is to look a certain way but not mean anything". I didn't mean that at all. I consider the logo to represent the company and the company's name, that's the purpose. Our company name is devdeo, and that's what I'd like the logo to reflect. Now, whether the company name means something or not that's another story, I guess. </p>
      <p>I'd agree that, yes, the name might not be as explicit as other names (like Ratbaggy says "Development and Consulting Technologies"). Problem is, pretty much all the other company names in this business around here have names based on that sort of thing and honestly, it's not very pretty. </p>
      <p>A second problem with that approach is language: We are located in south america (colombia to be precise) and our language is spanish. Hence, choosing a meaningful name in that sense would've meant using a spanish name. Nothing wrong with that per-se, but the problem is we also have international customers, most english speaking, and so the spanish name just wouldn't have worked very well there (at least that was our opinion, we might be wrong). So, we decided to go with something that would work well (i.e. was easy to recognize for both sets of audiences). Yes, while the 'dev' part is intentionally english-ish, it is a commonly used prefix here for things related to software development and thus easily recognizable.</p>
    html_clean: |-
