    <p>Hi Everybody,</p>
    <p>I've been lurking around these forums for a while and found them very interesting and enlightening; plenty of good ideas and a very healthy level of participation, I think.</p>
    <p>Anyways, a few friends and I recently started a small, highly focused IT / software development and consulting firm and so were looking at getting a new identity and image to go with it. After going through several proposals and explorations for our logo, we eventually settled on the one I'm attaching. </p>
    <p>Would love to hear any comments you might have on it :)</p>
