    html: |-
      <p>Garamond, Century Gothic, Ecofont... but none of them are designed for dyslexics!</p>
      <p>Some die-hard typographic conservatives feel that the only decent typeface is some form of Jenson - as Poliphilus and Bembo are much inferior, and so are Garamond and Caslon... with nothing else worth mentioning.</p>
      <p>I just remembered - while the Bitstream collection that comes with Corel products doesn't have any Jensons I can recall in normal faces, and it doesn't have Cloister Oldstyle or Cloister Lightface... it does have Cloister Open Face. That would <em>really</em> save ink, and it would be a form of the One True Typeface!</p>
      <p>EDIT: Oh, silly me. I forgot Venetian 301, which is like Centaur, which is also considered a Jenson of sorts. And unlike Morris' Golden Type and its imitators, it is fairly light as well, so it is another alternative.</p>
    html_clean: |-
