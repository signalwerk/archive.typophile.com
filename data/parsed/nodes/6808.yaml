    votes: null
    html: <p>I would suggest another of Hermann Zapf's sans serif designs, since he is the designer of Palatino Linotype. Unfortunately for this case, most of his designs are serifs. The closest to a sans serif that he has in digital form is Optima. <br> <br>Optima is his most well-known non-Palatino design, but it isn't <i>exactly</i> a sans serif. <br><a href="http://www.linotype.com/54142/optimanova-family.html" target="_blank">http://www.linotype.com/54142/optimanova-family.html</a> <br> <br>If you can wait ahile, Linotype will soon release <b>Palatino Sans</b>, a completely new typeface from Hermann Zapf and Akira Kobayashi that was previewed at TypeCon in July. <br> <br>If you need something now (which you probably do), and Optima doesn't get your boat sailing, I would suggest any of Adrian Frutiger's designs as a good starting point</p>
    html_clean: <p>I would suggest another of Hermann Zapf's sans serif designs, since he is the designer of Palatino Linotype. Unfortunately for this case, most of his designs are serifs. The closest to a sans serif that he has in digital form is Optima. <br> <br>Optima is his most well-known non-Palatino design, but it isn't <i>exactly</i> a sans serif. <br><a href="http://www.linotype.com/54142/optimanova-family.html" target="_blank" class="link-external">http://www.linotype.com/54142/optimanova-family.html</a> <br> <br>If you can wait ahile, Linotype will soon release <b>Palatino Sans</b>, a completely new typeface from Hermann Zapf and Akira Kobayashi that was previewed at TypeCon in July. <br> <br>If you need something now (which you probably do), and Optima doesn't get your boat sailing, I would suggest any of Adrian Frutiger's designs as a good starting point</p>
