    <p>hei,<br>
    i’m new to this board. i actually registered some months ago, but then forgot about it.<br>
    but now i’m here.</p>
    <p>so i’m looking for a special font.<br>
    it seems to be popular in contemporary swiss graphic design, though i haven’t seen it that often.<br>
    the remingtons – swiss designer-duo – seem to use it often.</p>
    <p>on one homepage one of their posters was shown and below it said “angela-black”, but i checked and it can’t be right, as angela is a serif font.</p>
    <p><a href="http://www.stepinsidedesign.com/STEPMagazine/Article/28468/0/page/23" title="http://www.stepinsidedesign.com/STEPMagazine/Article/28468/0/page/23">http://www.stepinsidedesign.com/STEPMagazine/Article/28468/0/page/23</a></p>
    <p>here are the images (hope it works out)<br>
    thanks!</p>
    <p>oh and btw, just to be sure, the small typeface is gravur condensed, isn’t it?</p>
    <p>dan</p>
