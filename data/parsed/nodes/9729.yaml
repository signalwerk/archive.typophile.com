    html: "<p><i>I'm curious, did the \"natives\" not mind?</i> <br> <br>No idea. Any Latvian OS X users lurking hereabouts? I doubt if native readers would mind, because they already have a precedence for relocating and rotating the accent when it doesn't fit beneath the letter: all I did was to apply this practice to the uppercase as well as the lowercase: <br><img src=\"http://www.typophile.com/forums/messages/4100/67261.gif\" alt=\"Latvian swash G with 'commaaccent'\"></p>"
