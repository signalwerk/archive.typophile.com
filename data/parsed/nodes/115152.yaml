    html: |-
      <p>Although it's an obvious choice - a geometric sans serif, like Futura, but humanized by some oldstyle features - I would definitely say that you should not use Kabel.</p>
      <p>A sans-serif face that might be used in a dictionary, with a large x-height - I don't know any by name. <a class="freelinking external" href="http://www.fontspring.com/fonts/fontsite/antique-olive-fs" rel="nofollow">Antique Olive</a> certainly has a very large x-height, but it is usually thought of as a display face. In a thread here on a related topic, <a class="freelinking external" href="http://www.identifont.com/show?1N2" rel="nofollow">Century Gothic</a> was recommended, but for your specific case, it seems to resemble Futura too closely.</p>
      <p>I suspect you should go for something wide, not narrow, and lighter rather than bolder, so Bell Gothic is out, even though it's legible in small sizes, and has the additional useful property of clearly distinguishing between I, l, and 1.</p>
