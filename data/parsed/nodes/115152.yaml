    <p>Hello.</p>
    <p>I am working on a dictionary set in Times NR with Futura headings and I need a sans serif text font that fits snugly and unobtrusively next to Times, under Futura and which can be read easily at 8pt.</p>
    <p>Any ideas most, most welcome.</p>
