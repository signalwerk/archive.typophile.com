    <p>Hello all, </p>
    <p>I've been lurking on these forums for a short while now and have finally decided to post something of mine. This a logo for Kilo Records, a label that a friend of mine and myself are running and we'll be the spotlight band for now. However we want to be able to release things without being restricted to a particular genre, so I tried to go for an ecclectic feel. It's working really well for me right now but maybe some of you could shed some outside insight that could improve upon the design. </p>
    <p>I designed these from scratch using faces like Cooper Black and Sauna for reference. I might need to add "records" underneath the logo but since I can't afford Sauna I'd probably have to make the letters for that. Does anyone think that this part of the name would be necessary or not?</p>
    <p>OK, well thanks for your time,</p>
    <p>Mike</p>
