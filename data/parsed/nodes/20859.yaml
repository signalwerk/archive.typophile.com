      <p>Hello. Welcome to the forum.</p>
      <p>I can see where you are going, but I think in the process you've created two ligatures instead of one smooth word.</p>
      <p>- You could exaggerate the terminal on the K more rounder) so it reads as a dot on the i more.<br>
      - You could continue the exit on the i into the l as some scripts do.<br>
      - You could eilimate the connections and just make the serifs more script like.<br>
      - The lo is not working and reads more as an odd letter b<br>
      - The connection of the Ki ... maybe re-visit how Sauna italic exits and enters on the strokes. Also take into consideration Bello.</p>
      <p>I appreciate the desire to depart and make it more ownable and hope my comments help in some way.</p>
