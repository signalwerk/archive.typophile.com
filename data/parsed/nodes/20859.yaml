    html: |-
      <p>Thanks Miss Tiffinay, this my first real whack at doing custom lettering digitally like this. Bezier curves aren't exactly my strong point quite yet. So part of my excitement with this logo is simply that curves look nice. To me, anyway. </p>
      <p>I really appreciate the comments though and I'm going to check into a many of them and report back. I don't quite understand this suggestion though "You could eilimate the connections and just make the serifs more script like." Or maybe it's that I don't want to have the letters sepearte.</p>
      <p>With this version I like that there's a certain ambiguity about the serifs but I don't particularly want to seperate the characters. One thing I was thinking about trying was making some sort of tail on the top of the l to make it appear more like a cap. Maybe this could help distinguish it from being a "b"? </p>
      <p>Well, like I said this is still fairly new, so I might not be totally quick with an update but in a day or two I should have something new to show. More comments are welcome, I'm very friendly in discussion and just want to push it until the best result is there. Thanks again.</p>
