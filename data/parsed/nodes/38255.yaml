    <p>I’m stuck in a deep, dark depression do to my never-ending quest for the perfect logotype to represent my design company, BiKlops Design.  You know how when you work on something for so long you become blind to it?  That’s me.  </p>
    <p>So, what I’m asking is—are any of these good?  Worth continuing with?</p>
    <p>I’m trying to communicate fun, young, big-personality, maybe a touch disturbing/strange. </p>
    <p></p><div class="imageWrap"><img src="/files/anygood_3578.jpg"></div><p></p>
