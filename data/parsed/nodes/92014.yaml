      <p>I think it was based on a font whose name begins with letter ‘A’. They used an alternate ‘H’ and modified ‘k’.<br>
      However, the font is a knock-off of Adobe Caslon. That’s why I’ve not shown the name of the font. You could find the knock-off on Dafont or somewhere else.</p>
