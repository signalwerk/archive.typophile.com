    html: <p>I prefer the first, even though the second is definitely safer and probably easier to work with. The second one feels like solutions I've seen before (and not just Office:mac). The critical circle doesn't need to be the logo. It could be a central image that is echoed either partially or completely in other pieces. The cocentric circles will fall apart at small sizes and on screen, but you probably don't need so many, or so many every time. The logo/small print version could be 'Critical' in a solid red dot (perhaps with small radiating rules). <br> <br>I have a tendency towards difficult logos, so keep that in mind. ;) <br> <br>I went to CMU when Dick Buchanan was the head of the design school. He's a very interesting speaker. <i>Very</i> concept/thinking oriented. Can I ask where he'll be speaking?</p>
