  html: "<p>Please give me some criticism here! <br> <br>I'm graduating an undergrad design program this year and we (the senior design students) are putting on a senior portfolio show.  The concept involves how writing about design issues (in books like Looking Closer, and sites like Design Observer) are finally affecting the academic student level.  We want to celebrate what these writers have done in helping us think about design in a more socially conscious way, a more intelligent way.  We are having Richard Buchanan (editor of Design Issues Journal, MIT Press) come to speak. <br> <br>So, since I sort of put together and presented this concept to the other students, they put me in charge of the identity for the show.  This is going to need to be a mark adaptable to posters, fliers, web, banners, and a book cover for a book we are producing to sell at the show. <br> <br>We are calling the show \"Critical\", because these things discussed by design writers are all critical issues...but we couldn't focus it down to one critical idea.  So to comprimise we decided to try to make a logo that encompasses a broad scope of what design writing discusses. <br> <br>Anyway...here are some directions...I'll quit talking. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/56814.gif\" alt=\"This is the most recent idea. More 'all encompasing'\"> <br> <br>Above: My most recent idea.  More 'all encompassing'.  It is very large, and I'm not sure what might be a good way to deal with that, but on smaller media we could just hint at portions of it, and finally on the book use the whole thing. I think i like how that effect might work. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/56815.gif\" alt=\"Something like this would allow us to highlight certain 'critical' aspects depending on where they're used.  We might do 'Critical: Influence' on the speaker's podium, and 'Critical: Writing' on the book.  I dont' think its all that attractive though.\"> <br> <br>Something like this would allow us to highlight certain 'critical' aspects depending on where they're used.  We might do 'Critical: Influence' on the speaker's podium, and 'Critical: Writing' on the <br> <br> <br>Thank you thank you thank you for any criticism</p>"
  html_clean: "<p>Please give me some criticism here! <br> <br>I'm graduating an undergrad design program this year and we (the senior design students) are putting on a senior portfolio show.  The concept involves how writing about design issues (in books like Looking Closer, and sites like Design Observer) are finally affecting the academic student level.  We want to celebrate what these writers have done in helping us think about design in a more socially conscious way, a more intelligent way.  We are having Richard Buchanan (editor of Design Issues Journal, MIT Press) come to speak. <br> <br>So, since I sort of put together and presented this concept to the other students, they put me in charge of the identity for the show.  This is going to need to be a mark adaptable to posters, fliers, web, banners, and a book cover for a book we are producing to sell at the show. <br> <br>We are calling the show \"Critical\", because these things discussed by design writers are all critical issues...but we couldn't focus it down to one critical idea.  So to comprimise we decided to try to make a logo that encompasses a broad scope of what design writing discusses. <br> <br>Anyway...here are some directions...I'll quit talking. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/56814.gif\" alt=\"This is the most recent idea. More 'all encompasing'\"> <br> <br>Above: My most recent idea.  More 'all encompassing'.  It is very large, and I'm not sure what might be a good way to deal with that, but on smaller media we could just hint at portions of it, and finally on the book use the whole thing. I think i like how that effect might work. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/56815.gif\" alt=\"Something like this would allow us to highlight certain 'critical' aspects depending on where they're used.  We might do 'Critical: Influence' on the speaker's podium, and 'Critical: Writing' on the book.  I dont' think its all that attractive though.\"> <br> <br>Something like this would allow us to highlight certain 'critical' aspects depending on where they're used.  We might do 'Critical: Influence' on the speaker's podium, and 'Critical: Writing' on the <br> <br> <br>Thank you thank you thank you for any criticism</p>"
