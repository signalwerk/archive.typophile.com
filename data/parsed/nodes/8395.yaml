    html: "<p>JT: <br> <br>The first design is a nice concept for a book cover, or other applications that would permit such a large image. Maybe you could create a horizontal oblong oval shape to replace the circular shape. The oval could hug the \"Critical\" type a little more, overcoming many of the spacial issues. On large applications you could include the surrounding words and on small applications you could remove them. That's just one idea. I think there are a myriad of different ways  you could morph the background for different applications, such as leaving it as is, but cropping it around the \"Critical\" word, creating a rectangle or some other shape. <br> <br>Aloha! <br>Scott</p>"
