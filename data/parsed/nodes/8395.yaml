    html: <p>Yeah, I'm glad you picked up on a wheel or rotation on the second one...that was the plan. <br> <br>I tried putting some sort of dial or hand (like on a compass or clock) on the first to point to and highlight different ideas, and it actually looked pretty good.  I just thought it looked too much like a clock or compass, and led the concept astray a bit. <br> <br>Any ideas on making the first one a little more adaptable?</p>
