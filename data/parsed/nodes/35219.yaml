    <p>I've finally relinquished the title of "lurker" and become an official poster. (Yes, you can hang me on the wall if you like)</p>
    <p>I'm approaching the final year of my BFA studies and am doing some study of Dutch type design, specifically the work of Jan van Krimpen. I plan on synthesizing the information I garner into a typeface, whose parameters have not totally been set yet. I'll make sure to keep things posted as the work progresses.</p>
    <p>So, here's the question: What are the best resources for finding specimens (pdfs, scans, or whatever as long as my budget will allow) of Jan van Krimpen's work?</p>
    <p>I've ordered a copy of Dutch Type by Jan Middendorp and have a copy of Letters of Credit by Walter Tracy. Any other recommendations of books I should look into? </p>
    <p>I've also tried to search the Typophile forums to see if any other threads have come up about this specific topic to no avail. If there are any related posts, that would be helpful as well.</p>
    <p>Thanks in advance for the help.</p>
    <p>Arlo</p>
