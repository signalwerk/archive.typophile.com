      <p>Dear Lurker,<br>
      You hit on my favorite subject. There are a few good books on the work of Jan van Krimpen. I had the priviledge of going to Johannes Enschede &amp; Zon(s) in Haalem. I saw some of his original work with the firm. Sem Hartz was alive then and he worked with van Krimpen in the development of type that came out in Monotype form. His most grandeous project was the Cancellersca Bastarda with over 250 characters. I'm sorry that htis face was never digitized. I reproduced it in a photolettering font over 40 years ago. Van Krimpen was also a prolific writer on letter design.</p>
