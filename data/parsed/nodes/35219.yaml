      <p>'The Work of Jan van Krimpen', by John Dreyfus is a must, as well as 'About Design and Devising Type,' mentioned above. If the second is the book I remember seeing, the two are among the most beautiful books I have ever seen. I think both are letter press, I suspect with a lot of foundry type, so you get to see the optical sizing accomplished by punch cutter Paul Rädisch. </p>
      <p>Paul are you doing the digital Cancelleresca Bastarda? I am also curious about the Romulus revival. There is an extensive PDF of it on the DTL site, but it still doesn't seem to be for sale. I still think that for Romulus to be practical, it needs to be mated to an appropriate JvK italic, weight adjusted. This would be in addition to, or maybe even replacing the not so successful sloped roman that DTL has digitized.</p>
