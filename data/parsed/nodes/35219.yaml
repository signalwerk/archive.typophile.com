      <p><cite>His most grandeous project was the Cancellersca Bastarda with over 250 characters. I’m sorry that htis face was never digitized.</cite><br>
      You will be pleased to hear that Cancelleresca Bastarda is actually in the process of being digitised for TEFF. I am a big admirer of Jan van Krimpen's work too, and CB is indeed one of his finest. I have examined the original drawings, type specimens and punches myself, only to find a world of differences (naturally). Paul Rädisch, the punchcutter who cut almost all of Van Krimpen's typefaces, was a very skilled man and I think he has been praised too little for this. It was him who actually made the typefaces work.</p>
      <p>Back to the subject, other notable books about Van Krimpen's work are:<br>
      - About Designing and Devising Type, written by JvK himself<br>
      - Adieu Esthetica, written by various authors for a JvK exhibition in The Hague</p>
