    <p>In the interests of fairness, isn't it about time <a href="/wiki/Impact" class="freelinking" rel="nofollow">Impact</a> got the beats?<br>
    After all, other types made ubiquitous by <a href="/wiki/bundling" class="freelinking" rel="nofollow">bundling</a>, such as <a href="/wiki/Comic%20Sans" class="freelinking" rel="nofollow">Comic Sans</a>, <a href="/wiki/Papyrus" class="freelinking" rel="nofollow">Papyrus</a>, <a href="/wiki/Trajan" class="freelinking" rel="nofollow">Trajan</a> and <a href="/wiki/Arialvetica" class="freelinking" rel="nofollow">Arialvetica</a> have been roundly dissed for overexposure.<br>
    Only trouble is, it could prove difficult to find an alternative with suitable, er, impact, especially considering Impact's barely-protruding <a href="/wiki/descender" class="freelinking" rel="nofollow">descenders</a>.<br>
    Suggestions, anyone?</p>
