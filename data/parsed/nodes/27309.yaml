    html: |-
      <p>Cool, Chris. I'll check out that thread.</p>
      <p>On font bundling, sure the mere availability of computer-based fonts allows for misuse. But that's true for every creative application ever sold for a computer -at least one that was priced at any somewhat affordable level. What do we do about it? Price fonts and any application that can handle them well out of reach of most people?</p>
      <p>I'll offer what I think is the root of the problem: our education system.</p>
      <p>There were penmanship courses in the past. Sometimes the garden variety art course in high school would delve into calligraphy. High schools have taught typing. But what are they doing that is appropriate for today? I think schools need to offer some basic page layout courses that include some basic coverage of typography.</p>
      <p>Just from the simple standpoint of putting together a résumé regular people aren't given much of a clue on what is appropriate for business communication. They are left on their own to guess.</p>
      <p>Even if operating systems and office productivity suites had their font bundles removed, we would still see lots of bad type happening.</p>
      <p>A lady I know who makes banners and other "fast sign" stuff in my town has really horrid taste in type. But she has fun doing what she's doing and other people are stupid enough to pay her for it. The awful nature of her work comes from a lack of design sense (or talent for that matter) in knowing what kind of fonts can work well with each other. She downloads lots of freeware fonts at various free font sites and comes up with some really strange combinations.</p>
      <p>I think most people know good typography when they see it. They know the page looks better, but don't know how to break down the mechanics on why the page looks better.</p>
      <p>In the end good designers have to look at the situation as being more of an opportunity rather than a problem, work harder and use the imbalance to get more work for themselves. The most loyal customers tend to be the ones who are educated enough to understand the difference.</p>
