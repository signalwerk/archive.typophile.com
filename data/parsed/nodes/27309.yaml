      <p>&gt; should bundled fonts come in the four basic styles?</p>
      <p>Many people here will say fonts should not be bundled.</p>
      <p>I like it when fonts come in all four weights. The most overly used bundled font is probably Zapf Chancery, which most people think is a script, since it was bundled without the romans and the italics in other weights. It's a fine font, if you can avoid overuse of the italic weight everyone is so familiar with.</p>
      <p>But I got one of the Shelley fonts bundled in an Adobe product once. There just isn't a roman version, and it would be silly to think of one. </p>
      <p>Display fonts, traditionally, come solely or in incomplete families.</p>
