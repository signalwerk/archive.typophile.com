      <blockquote><p>I've decided not to ask noob questions on the forum.</p></blockquote>
      <p>I think it's not the noobiness of the question that matters, it's how much effort you put into it before you ask for help. If it's something in the manual for example definitely don't pester people. But most of the good questions are not in the manual...</p>
      <p>In fact a noob can't learn without asking noob questions. What, you're going to ask advanced questions right from the get-go?  :-)</p>
