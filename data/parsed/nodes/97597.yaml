  html: |-
    <p>Being Noob always sucks especially when you are in the company of best. Recently I've decided not to ask noob questions on the forum. Also i had recently gotten into trouble with my FL studio. When ever i open a glyph cell i had to open the tools toolbar again and again. I didn't know what the problem was. I wanted to post it in typophile forums but I had restrained myself from doing so. I never knew i would find the actual solution but today i miraculously found the solution. I had the autohide feature turned on( i just wondered what it was when i turned it on and completely forgot it). Now it is working flawlessly and i am happy that i found out the solution. It might not be a lot but it gave me confidence.<br>
    P.S. Be careful while you are messing with your software</p>
