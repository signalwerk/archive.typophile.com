    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 4.Nov.2005 8.39am </div>
      <p>. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . </p>
    <p>Typotheque is pleased to present two new products and a preview of upcoming font release.</p>
    <p> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . </p>
    <p>&gt; Typotheque diary / sketchbook 2006</p>
    <p>Similar like the last year’s version, this is a limited edition of no non-sense, straightforward Typotheque diary for 2006, combined with a sketchbook.  There are 60 pages of pre-printed six different grids for sketching and designing type, including a classic Duerer’s model of renaissance capitals construction. The other 120 pages are plain weekly overviews, leaving plenty of space for personal notes and organizing. Major graphic design and typography events are noted in the agenda (AtypI, AIGA, TypoBerlin, TypoTechnica, TypeCon, etc.)</p>
    <p><a href="http://www.typotheque.com/books/typotheque_diary_2006" title="http://www.typotheque.com/books/typotheque_diary_2006">http://www.typotheque.com/books/typotheque_diary_2006</a></p>
    <p> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . </p>
    <p>&gt; The Stroke, theory of writing</p>
    <p>This is the first English-language edition of the theory of writing by the teacher and type designer Gerrit Noordzij who directed the course at the Royal Academy of Arts in The Hague from 1970 to 1990. </p>
    <p> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . </p>
    <p>Gerrit Noordzij’s powerful and analytical text, illustrated with his own diagrams and examples, presents a genuine theory of writing done with any tool and clarifies the relationship between the written and typographic letters</p>
    <p><a href="http://www.typotheque.com/books/the_stroke/" title="http://www.typotheque.com/books/the_stroke/">http://www.typotheque.com/books/the_stroke/</a></p>
    <p> . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . </p>
    <p>&gt; upcoming release Fedra Serif Pro</p>
    <p>Fedra Serif Pro is in its final stage of testing, and will be published in November 2005. Fedra Serif Pro includes extensive typographic features, and support of over 70 languages, Latin, Greek, and Cyrillic-based, with its small caps. This PDF file presents the available OpenType features, and presents the full character set (over 2000 glyphs per font)</p>
    <p><a href="http://www.typotheque.com/data/static/FedraSerifPro.pdf" title="http://www.typotheque.com/data/static/FedraSerifPro.pdf">http://www.typotheque.com/data/static/FedraSerifPro.pdf</a></p>
