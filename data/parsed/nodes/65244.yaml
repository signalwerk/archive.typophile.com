    html: "<p>It's a good start. Your diagonal weights are all over the place: X, Y, upstroke of K are super heavy, and the middle of Z is light. I like your Q concept. V and W would fit into a standard microgrammoid but I feel they need to join more solidly at the bottom to fit into your \"futura/gotham inspired take\" (I'm pretty sure I understand how you mean that). Judging the curves will probably require getting a closer look.</p>"
