  html: |-
    <p>Hey everyone this is my first attempt at making a font (been doing it as a learning experience) so any critique would be greatly appreciated. I've been a huge fan of eurostile and microgramma for a while so I attempted to take a more futura/gotham inspired take on the font. I'm half-way done with the lowercase and numerical characters. I also made the weights much heavier and kind of centered around the concept of a type to be used in airport signage.</p>
    <p>Any tips on how to make the font better/change characters to suit the concept more would be appreciated.</p>
