    html: |-
      <p>Well, I think as you are a jewel designer you are the best one who knows which fonts to use. But I will tell you how I think your card would look better for me.<br>
      at backgrounds I like first one at top. I would prefer to make "K" darker than the illustration in its background, you may even make it black, so you can balance with the huge white space more. You may try also to resize that jewel illustration to make it bigger and make part of it as if it is out of the card { it is just a suggestion here }.</p>
      <p>For the front face, I disagree with the illustration at first card at top, circles over darkbackground can have many meanings, something like stars or globes in sky, may be?<br>
      the one at bottom which contains same circles with one line is a nice gemotrical abstract for jewellery, it tells me that you are simple and modern. You still base your jewels on circle shape only, why not a polligrame or triangel also, or any shape which is entitled to jewels?  if you want circles only because it is related to your style, or any reason I think your name should have to change the idea of writing your name with normal font, you may go to some display font which has a cirlce gemotric basic.. I suggest here an  idea: what about making letters of your name as jewels and make the line pass them instead of passing some circles? that may require the name to be bigger in scale, and require a new, less effortive, and better orgnized layout.</p>
      <p>I would recommend the  text to change in some parts to be like: Tel. Mob. E-mail/Email/email.  + "New Zeland designer jewellery" that way and in italic. It will be fine if you use a serif font for it either. And I recommend to be sure of leading between lines because the spaces between lines aren't look equal for me in your information area.</p>
