    html: <p>I think it looks great, and I"m talking about the .jpg you posted.I think you could look at the type, but I think you're pretty close. I would work on the informational type that is now in the sans serif, either make it flush with the other information or move it enough so it isn't "almost" flush. I don't know if you're going to hole punch the holes or not, but that would be a nice touch. The lines are great. Don't show photos of the product on the business card. Keep in ambiguous enough that it doesn't get outdated. I wouldn't change too much on this, it's clean, simple and elegant. How about instead of black doing a metallic silver or bronze? Overall, a great job.</p>
