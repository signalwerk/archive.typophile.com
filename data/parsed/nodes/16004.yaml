    <p>hey, here is a revised set. Im liking the back monogram and am thinking of using this on the front,what do you guys think of lines i added?(to the front )<br>
    And as for a picture of the jewelry,i dont have any sorry,but i can tell you its very busy with a collection of different shells,im trying to emphasise the hand made quality of it but also put it into a professional context,so that is why i thought of hadriano because it is a sturdy type face but the 'a' still has character. So i thought that the packaging and card should complement the jewllery without mimicking its visual aspects.<br>
    I hope this makes sense!?<br>
    -Al<br>
    /edit/ Hey i have posted a new card still final touches to be made but i have added colour,i should have explained earlier that this is for a family friend,and the card u see is the front and the back,i also have made some stickers which will be used on lime green/light blue packaging,and there is a price tag sticker there too but its a bit wierd(the paua shell)<br>
    And the whole punch idea is good,but i think its alittle time consuming,but gave me some ideas as to showing the product through it as these cards and stickers will be placed on or with the neclaces,earings e.t.c.<br>
    thanks alot for all of the helpful input,its been better than bad its good.<br>
    Al (as in Alistair-a guy) :)<br>
    ps is it 'jewellery' or' jewelry'....?</p>
