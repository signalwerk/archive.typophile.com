    html: <p>&gt; <br> <br>License fees vary a lot. I was in a similar circumstance recently. 3-15% of sales are license fees have been charged. It could be quite a lot of money. Don't get nervous! Talk with a IP Lawyer that understands license and contracts. If you want to contact me off list, we can discuss this further. <br> <br> </p>
