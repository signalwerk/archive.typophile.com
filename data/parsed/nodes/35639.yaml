      <p>This is a very good question I often struggle with myself.</p>
      <p>if your punctuation is circular, seeing as circles read smaller than squares of the same width, I'd say your eriod should be 20-30% wider than the thickness of your thickest stem, up to a a certain point. Derive the rest from there.</p>
      <p>Naturally I defer to the opinion of those with more knowledge and experience than I, should they choose to speak up about it.</p>
