      <p>Apostrophes generally tend to fill the vertical space of an ascender, so, once you have the period, if you raise it up, and then add the curl down to the x-heigh, it will look about right.  To make a comma, take the apostrophe  you made, and then drop it down, and its curve will tend to be about right, unless you have a super-low x-height with a miniscular descender. For that and the periods, here's a sample I put together.  Just look at other fonts in a similar way for the other marks.</p>
      <p><a href="http://www.elahorcado.net/random/punctuation_comparison.pdf" title="http://www.elahorcado.net/random/punctuation_comparison.pdf">http://www.elahorcado.net/random/punctuation_comparison.pdf</a></p>
      <p>Edit: ack, apparently OmniGroup does use a separate engine for generating PDFsfrom their Export command than the standard PDF creation in OS X.  Anyways, some of those are a little off alignment from where I put them but you get the general idea.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
