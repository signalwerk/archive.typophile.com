      <p><em>is there no way besides experiment?</em></p>
      <p>I generally try to avoid following guidelines, and "work out" what looks best for a particular face by trying variants and see how they perform in different settings, before looking around to see how other designers have handled things.</p>
      <p>As David demonstrates, guidelines can provide procedures that are useful for experiments, and using the i-dot as a benchmark is a good idea, because it connects a number of thematic elements; in size, it relates to the period, and in position to quote marks and accents.</p>
      <p>Again, as he explains, the size of the various dots in a type varies. Consider, for instance, the dots in the question mark and bang; don't assume that these dots should be uniform with the dots in period, i, dieresis, etc.</p>
