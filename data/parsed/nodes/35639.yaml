    html: |-
      <p>Punctuation marks being "road signs" aiding interpretation of the text, they need to be legible and distinct without being distracting. In some typefaces the tail of the comma is so thin and/or short that at small point sizes, it's hard to tell it from a period. A version of Times that somebody used to print out a manuscript for me a while back had periods so small that I was always confusing them with specks in the paper stock. The two elements of the double quote marks are sometimes placed too close, again causing legibility problems at small sizes.</p>
      <p>Experimenting is the only way, paying particular attention to the smaller end of the point-size range a particular design would normally be used at. The human eyeball is often the best measurement tool.</p>
