      <p><em> "Are there any guidelines about designing punctuation?" </em></p>
      <p>Yes there are. </p>
      <p>I learned and continue to suggest one start with the i's dot and make a period that is apparently the same size as the i's dot in the middle of the point size range for which the font is intended to be used. (One can also start with the j's dot if one doesn't trust ones own i's. :))</p>
      <p>The period's size may be made larger for smaller uses, and smaller for larger uses. The rest is based on that period with comma being made to look the same size despite its tail, the colon slightly smaller in its twinning and etc. But the period usually remains the largest.</p>
      <p>If there is no lowercase, then base the period on the stem of the H and if the l.c. dots are somehow stylistically deviant, make one that isn't deviant just for this purpose and toss it when done. </p>
      <p>Cheers!</p>
