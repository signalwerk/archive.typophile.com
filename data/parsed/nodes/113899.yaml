    <p>Hello,</p>
    <p>What is this font?</p>
    <p>The closest I can find is Harrington. But we are reprinting this book and I need to know what font this is to recreate the cover.</p>
    <p>We couldn't find it for building the website so we used Harrington: <a href="http://www.haikuwisdom.com/" title="http://www.haikuwisdom.com/">http://www.haikuwisdom.com/</a></p>
    <p>But now we need the font for the second edition of the book. The original publisher is unavailable.</p>
    <p>Any help is greatly appreciated.</p>
    <p>Thank you,<br>
    Diana aka Bonesai</p><div class="imageWrap"><img src="http://typophile.com/files/Capture_4468.PNG"></div><p></p>
