    html: |-
      <p>There are a number of fonts matching your sample, but I can't tell which of them -if any- is a legitimate and/or original design. The ones coming from SSK/SSI/B&amp;P Graphics/WSI etc. are probably clones, but I list them here hopping that somebody more experienced can trace the origin of the font:</p>
      <p><strong>Angelo DB</strong> - (c) 1996 SoftMaker Software GmbH<br>
      <strong>Angelo</strong> - (C) 1993 B &amp; P Graphics, Ltd.<br>
      <strong>Angelo</strong> - (c) 1996 SoftMaker Software GmbH<br>
      <strong>Anglican</strong> - From the WSI Font Collection.  Copyright (c)1997 W.S.I.<br>
      <strong>Anglo</strong> - Generated by Fontographer 4.1.5<br>
      <strong>GE Vienna Script</strong> - Copyright  1999, Graphx Edge.<br>
      <strong>Marquis</strong> - From the WSI-Font Collection.  Copyright (c)1993 W.S.I.<br>
      <strong>Rankle</strong> - Copyright 1995 by Elfring Soft Fonts, All rights reserved.<br>
      <strong>StephanieBecker</strong> - [no copyright info]<br>
      <strong>TR Anglican</strong> - Dinamit Online by Sherlock<br>
      <strong>Viata Script SSi</strong> - Copyright 1992 Southern Software, Inc.<br>
      <strong>ViataScriptSSK</strong> - Copyright 1992 Southern Software, Inc.</p>
      <p>There is also another one having a copyright of Adobe(!) but I think it's just a joke [somebody put it intentionally here, of made a copy on top of another adobe font]:<br>
      <strong>Anglo</strong> - Copyright 2006 Adobe Systems Incorporated</p>
      <p>Please be careful and don't use any of the above, until you get some accurate information about their legitimacy.</p>
