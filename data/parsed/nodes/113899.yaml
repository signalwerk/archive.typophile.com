    html: |-
      <p>Thanks Mike for the lead. This is a big help in clearing the water. So, first the original BB&amp;S font:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LiningAngloDetailBBS1907SM_3567.jpg"></div><br>
      Then an original digitization. Fivios mentioned an Anglo "Generated by Fontographer 4.1.5." I found this in my folder of original digitizations by Dan X. Solo of metal type fonts that he had purchased during his many years of hunting for metal fonts. The digitization is of good quality, not merely an autoscan. This digital font was distributed [1998?] by Dan X. Solo in Dover Victorian book + CD pack. The legitimate way to acquire it is by purchasing the book.<br>
      So the digital font ID could be Dan X. Solo's Anglo.<br>
      There are some other digitizations but of poorer quality. I have not checked their provenance, but some might be original creative works. Version 2: Angelo 1993 B &amp; P Graphics, Ltd. Can't say if this is their original or they lifted it from someone's earlier digitization, perhaps Opti.  Version 3: Viata Script, Softkey, 1992 SS &amp; Rankle 1995 Elfring Soft Fonts. And more loose ends: Anglophile (Novel), Anglican (WSI).... I have not checked.<p></p>
      <p>Don</p>
