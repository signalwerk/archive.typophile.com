    <p>I've been looking for a little background on<br>
      bitstream's Zurich typeface and can't find all<br>
      that much about it. Anyone have any resources<br>
      that may be helpful?<br>
       I know it's a take on univers, almost identical.<br>
      Although the ampersand is drastically different<br>
      than that of Univers'. Im getting the feeling that<br>
      it is to Univers what Arial is to Helvetica;<br>
      just some company trying to get around copyrights.</p>
    <p>  Anyway, any help would be appreciated, thank you.</p>
    <p>  Cheers<br>
      Travis L.</p>
    <p>[Moderator's Note: For continued discuss go to <a href="http://typophile.com/node/18585" rel="nofollow">this thread</a>]</p>
