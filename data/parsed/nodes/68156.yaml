      <p>It's evident that suppliers to nail shops, dry-cleaners and barbershops sell off-the-shelf signs and window graphics kits. Which haven't been up-dated since 1972.<br>
      That would explain why I've seen that blue and pink sign so many times before.</p>
      <p>The decoration on the hand-made sign is kind of out of the "white space must die" school of art. </p>
      <p>There's a shop near where my office used to be called, "Good Hair Day Salon". I'll always got a kick out of the name.</p>
