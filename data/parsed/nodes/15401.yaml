    <p>I am preparing a small article on type and the Olympics and have been trying to find some material on that subject. Namely, how type had been used in past Olympic games. I am not that interested in the logos, or the posters, but in the 'peripheral' material, such as press releases, signage, tickets, etc. During my search I have come accross the comment that a custom font was designed for signage for the Mexico 68 games. Unfortunately, I cannot find any visuals. The only other game in which type has any mention is Athens 2004, where they used Gill Sans and had a Greek cut for it.</p>
    <p>Greatful for any pointers to the above.</p>
    <p>Bruno Maag<br>
    Dalton Maag Ltd</p>
  html_clean: |-
