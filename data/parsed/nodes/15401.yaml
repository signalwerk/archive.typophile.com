      <p>FYI -- <strong>Custom type development for 1992 Barcelona Summer Olympic Games</strong>  (<em>bulleted executive summary version</em>)</p>
      <ul>
      <li>The development of a unique typeface design to be used exclusively for the branding, collateral, PR and wayfinding system was widely accepted and anticipated by COOB92 (Organizing Committee for Barcelona Olympics 92) and Quod Diseño.</li>
      <li>The interest in using ITC Barcelona was more whimsy than serious, and never made it to Quod's "short list"</li>
      <li>I participated in many design planning sessions at Quod reviewing Josep's development plan, scope of project, schematics, and design manifesto, prior to inviting Ed Benguiat into the process</li>
      <li>Part of the branding mission was to celebrate the unique culture and arts of Catalunya (Joan Miró, Juan Gris, Antoni Gaudí)</li>
      <li>Ed and I were passionate about the project and both of us have deep roots in España... all the more for us to celebrate the culture</li>
      <li>On my own I began research into the rich type history of the area, and presented several designs for revival (or as inspiration) from FT Nacional... and yes, I did go to Neufville</li>
      <li>Ed did his own research and sketch development of potential faces</li>
      <li>The design selection process with Quod lasted for many months, presenting numerous type sketches and variants to Trias via fax, DHL, and in person (I always prefer meeting in person in Barcelona... don't you?)</li>
      <li>Ultimately it was Josep Ma Trias' decision as to what design would be developed</li>
      <li>Once a face was selected, the design refinements and weight expansion began</li>
      <li>The naming of the custom type family underwent another process involving the Barcelona Olympic Committee's marketing services manager... and yes, it was VERY POLITICAL</li>
      <li>The selected name <em>Catalana</em> was just a small expression of Barcelona's fierce independent spirit, since the games were to be held there and not in Spain from their viewpoint
      </li><li>The name of the official typeface for Barcelona 1992 Olympics was selected (after extensive international trademark search) and the official press announcement was made BEFORE the actual refinement of the type family's design</li>
      <li>The custom type project was abandoned due to sponsorship issues BEFORE the design was ever fininshed (no where near finished -- still sketching character design)</li>
      </ul>
      <p><em> -- <strong><em>Adios Catalana</em></strong></em></p>
