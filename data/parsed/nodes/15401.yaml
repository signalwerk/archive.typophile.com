      <p>It's amazing how little concern there is for type in an organisation as global and big as the Olympics. Billions are spent every two years to build new sports facilities, but it would never enter the committees mind to design a typeface family, consisting of multiple scripts, that addresses the issues of identity and accessibility. The cost would be negligible, too, considering the benefits.</p>
      <p>Bruno Maag</p>
