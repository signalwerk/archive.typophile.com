    html: <p>Instead of installing Fontforge via an installer, IMO an easier/better solution would be to install it via <a class="freelinking external" href="http://www.macports.org/" rel="nofollow">Macports</a>. Then you know for certain that all of your dependencies, requirements, etc., are taken care of.</p>
