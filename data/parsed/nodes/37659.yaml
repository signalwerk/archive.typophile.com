      <p>@ Stavros: Did you read the instructions for installation I linked above?</p>
      <p>First you need to have X11 installed on your Mac. It comes on the MacOS X install discs, but is not installed by default.</p>
      <p>The Fontforge executables are at <a class="freelinking external" href="http://sourceforge.net/projects/fontforge/files/fontforge-executables/" rel="nofollow">this link.</a><br>
      There are currently three variants for Mac depending on OS version and processor type, along with Linux and Cygwin versions. Choose the one that suits your machine.</p>
      <p>There are additional libraries needed to give Fontforge full functionality. They are packaged for installing convenience for Mac, and <a class="freelinking external" href="http://sourceforge.net/projects/fontforge/files/fontforge-dependencies/20081207/" rel="nofollow">can be downloaded via this link.</a></p>
