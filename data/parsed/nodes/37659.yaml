  - id: 393284
    user: 18942
    date: 2010-02-02T17:54:00
    date_raw: 2 Feb 2010 — 5:54pm
    votes: null
    html: |-
      <p>Installing via macport requires compiling and thus  the developer installation. And it takes time before getting a running version; I have a macport installation on my MacBook Pro and I know. If the aim is only to use pfb2otf, the installer is fast and the version of pfb2otf that uses a fontforge script is quite stable. It runs in less than a minute or so if X11 is already installed (I just tested again on my MacBook pro and fontforge requires /usr/X11/lib/libXi.6.dylib to run in batch mode; can you tell me why?). The fontforge python libraries  also come with the installer. The problem is that the version of python that is to be used changes with time and with the OS. With OS X 10.5 and OS X 10.6, fontforge now expects python2.5 (and on my mini with 10.6, /usr/bin/python is /usr/bin/python2.6). With OS X 10.4, it uses python2.3; pfb2otfpy thus requires some maintenance (and I do it only when someone asks), pfb2otf is quite happy with old or new versions of fontforge; it requires no change and is quite happy with the installer.</p>
      <p>Michel</p>
    html_clean: |-
