      <p>You do not need X11.</p>
      <p>You put the afm and pfb files in a folder where you are allowed to write. For instance, I put some computer modern fonts in some folder called cmr on my mac. After clicking the application pfb2otf, I select that folder and I see this:</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/input_3754.jpg"></div><p></p>
      <p>I then click "Choose" and get the following:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/output_6623.jpg"></div><p></p>
      <p>The otf files that are created can be seen appearing in the window behind as they are written. They are in the same folder as the .afm and .pfb files. I never added the feature to read kerning from .pfm files. This works on my ppc mac wich OS X 10.4 but I see no reason for it not to work on 10.5 or an intel mac. </p>
      <p>Michel</p>
