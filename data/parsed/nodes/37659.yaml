    <p>The question of how to convert pfb font files to a format that can be used on the Mac was raised in two recent threads, one <a href="http://typophile.com/node/37469" rel="nofollow">with FortForge</a>, another one <a href="http://typophile.com/node/37555" rel="nofollow">with FontLab</a>.</p>
    <p>With FontLab, that looks quite easy. With FontForge, for those that are not Unix Shell or Python literate, that may be tricky. I thus wrote a small Mac application <strong>pfb2otf</strong> that you can download by clicking <a href="http://www.iro.umontreal.ca/~boyer/typophile/pfb2otf.zip" rel="nofollow"><strong>here</strong></a> and that makes it easy too: you double click the icon of <strong>pfb2otf</strong>, select the folder containing the afm and pfb files of the fonts to convert, and that is it. If the afm file is not there, you lose  kerning.</p>
    <p>Now for Mac programmers: if you have a look at the script <code>pfb2otf.app/Contents/MacOS/pfbtootf</code> that does everything (in 70 lines or so), could you tell me what would have been the proper way to pass information from Applescript to the Unix shell? I fudged something using temporary files. Is there a good reference on this? Moreover, to show what is being done during processing, I display in a Finder window the otf files that are being generated; sometimes the displayed size is Zero KB, whilst the file is definitely not empty as we see when we check with File Info. Where is the bug?</p>
    <p>Michel</p>
    <p>May 13 2009: link to pfb2otf modified following <a href="http://typophile.com/node/37659#comment-346516" rel="nofollow">this post</a>.<br>
    May 13 2009: pfb2otf now returns an error if X11 is not installed.<br>
    May 14 2009: And here is <a href="http://www.iro.umontreal.ca/~boyer/typophile/pfb2otfpy" rel="nofollow"><strong>pfb2otfpy</strong></a>, that does not require X11, and can also read data from pfm files.<br>
    Feb 02 2010 <a href="http://www.iro.umontreal.ca/~boyer/typophile/pfb2otf.zip" rel="nofollow"><strong>pfb2otf</strong></a>, that does not use the Python library but requires X11, also reads data from .pfm files when they are in the same folder as the .pfb files.<br>
    Dec 27 2011.  The message for <a href="http://www.iro.umontreal.ca/~boyer/typophile/pfb2otf.zip" rel="nofollow"><strong>pfb2otf</strong></a> was changed to <em>"Enter the folder with the font files to convert (listed in grey)"</em>; you must indeed enter the folder containing the fonts to convert before clicking on <strong>Choose</strong> (tested on OS X 10.5, 10.6 and 10.7 with the <a href="http://www.macports.org/ports.php?by=name&amp;substr=fontforge" rel="nofollow">MacPorts FontForge</a>).</p>
