      <p>I just tried on 10.6, also with a MacPorts installed FontForge, and everything worked fine (on some type1 font file in /usr/local/texlive/2011). </p>
      <p>I won't be able to check on 10.7 before next week. Since then, and since you seem to know unix, you could try this: inside <code>pfb2otf.app/Contents/MacOS</code> there is a text file, <code>pfbtootf.txt</code> which is just an executable script. Copy it in some of your working folders; then just execute in a shell window <code>sudo pfbtootf.txt</code>. It will execute as the super user.</p>
      <p>By the way, when you click "Choose", you must be inside the directory containing the font files. It should look like this, with the font files in grey:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/choose_5739.png"></div><p></p>
