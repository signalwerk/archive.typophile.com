      <p>I love Gill Sans, so I like this a lot.  I like the right-angle terminal at the top of the G and the bottom of the C. You've tried to do the same on the top of the C, and the S, c, and s, but it's too subtle there -- even at very large sizes, it just looks smudgy.  And why not make the curves in J, a, e, j, 2, 3 and 5 terminate in the same way?   The rounded terminals of the f, the ear on the g, the r, 4, and 7 look horrible. They really don't match the feel of the rest of the font.  The zero is too wide compared to the other numbers.  The ear on the 1 is too short -- should be two or three times as tall.  The S, s, and 5 look like they are about to tip over to the right.  The 8 should be more asymetrical -- the top should be smaller than the bottom.</p>
      <p>I like the slight curve at the ends of the lowercase verticals, but you seem to have only halfway done it on the q.  I really like the open P, 6, and 9. </p>
      <p>Hope that helps. :)</p>
