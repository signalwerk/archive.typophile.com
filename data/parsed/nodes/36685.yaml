    html: |-
      <p>Thanks for the replies.</p>
      <p>Glyphobet: Thank you for the very indepth critique. It has certainly helped me out. I also didn't particularly like the terminals. I thought I could justify them by slightly incising my design. In the end, the terminals still didn't work.</p>
      <p>bpotstra: I guess it has taken me about three months so far. I have attempted a san serif three times. I don't worry about the time it has taken me. In total I would say around two hundred hours. I try to work slowly, it helps me concentrate harder on the areas that need the most attention. </p>
      <p>I have have attempted to move away from the Gill, Johnston look. To help give the design more contrast, I have incised the stroke endings, allowing a little more contrast. I also wanted to make sure I avioded Optima. My type face is mainly based off Galliard. </p>
      <p>See my first post for updated pdf.</p>
