    <p>Hello typophilers,<br>
    I have been designing this typeface for quite some time. My intention was to create a very humanist design, that captures some of the classic features of Garalde and Venetian faces. </p>
    <p>Metrics and kerning still need some attention. I also just spotted some of my diagonals are producing uneven colour.</p>
    <p>Before I start punctuation and other glyphs. I would appreciate any comments that you guys may have.</p>
    <p>Thanks<br>
    -M Foley</p>
