    html: |-
      <p>Boston acoustics<br>
      - Boston: my intuition says "custom work based on <a class="freelinking external" href="http://myfonts.us/td-K7AVcb" rel="nofollow">Eurostile</a>"<br>
      - acoustics: (also) <a class="freelinking external" href="http://www.myfonts.com/search/eurostile" rel="nofollow">Eurostile</a></p>
      <p>D-BOX Motion Code<br>
      - D-BOX: probably lazy after the previous suggestions but looks like a custom job and, why not, from Eurostile. <a class="freelinking external" href="http://www.myfonts.com/fonts/dsgnhaus/saturn" rel="nofollow">Saturn</a> is another "eurostile-like" that could work too (and for "Boston (accosutics)" too).<br>
      - MOTION CODE: possibly <a class="freelinking external" href="http://www.myfonts.com/search/avant+garde" rel="nofollow">Avant-Garde Condensed</a></p>
      <p>Future Automation Moving Audio Visual<br>
      - future automation: <a class="freelinking external" href="http://www.ffonts.net/Forgotten-Futurist.font?text=future%20automation" rel="nofollow">very first version</a> of <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/forgotten-futurist" rel="nofollow">Forgotten Futurist</a> looks like to match to me<br>
      - moving audio visual solutions: <a class="freelinking external" href="http://www.myfonts.com/search/helvetica+neue" rel="nofollow">Helvetica Neue Light</a></p>
      <p>Velodyne<br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/avant-garde-gothic/" rel="nofollow">Avant-Garde Demi</a>, Pro version to get alternates /<a class="freelinking external" href="http://www.myfonts.com/fonts/itc/avant-garde-gothic/pro-demibold/glyphs.html#glyphs/545652/487" rel="nofollow">e</a> and /<a class="freelinking external" href="http://www.myfonts.com/fonts/itc/avant-garde-gothic/pro-demibold/glyphs.html#glyphs/545652/523" rel="nofollow">y</a></p>
