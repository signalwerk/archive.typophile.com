      <p>Hello folks.</p>
      <p>I wish I could have stuck my nose into this thread a bit sooner. I was just waiting for a bit of the dust from last week’s news to settle.</p>
      <p>Yes, everything is indeed good.</p>
      <p>As an addendum to the clarifications by Nick, Stephen and Ricardo (thank you all), I would like to reinforce the fact that Veer does have a large in-house stock photography production and art department. We are currently building out four brands of photography: Fancy [1], Solus [2], Dear [3], and the Latin-American focused Somos [4].</p>
      <p>[1] <a href="http://www.veer.com/fancy/" title="http://www.veer.com/fancy/">http://www.veer.com/fancy/</a><br>
      [2] <a href="http://www.veer.com/solus/" title="http://www.veer.com/solus/">http://www.veer.com/solus/</a><br>
      [3] <a href="http://www.veer.com/dear/" title="http://www.veer.com/dear/">http://www.veer.com/dear/</a><br>
      [4] <a href="http://www.veer.com/somos/" title="http://www.veer.com/somos/">http://www.veer.com/somos/</a></p>
      <p>As for typeface development, I am but the sole type designer (of sorts) and technician on staff. However, we work very closely with Jason Walcott on adding new faces to our Jukebox [5] collection. Likewise, Alejandro Paul, Stephen Rapp, Christian Robertson and others are all significant contributors to the exclusive typefaces in our Umbrella [6] library. This year, we acquired the Mean Tangerine [7] foundry for its solid lineup of pixel fonts, and are working with Tyler Young, continuing to build out this great collection. Finally, we just soft-launched Cabinet [8], an embryonic new collection of text and titling faces - Stefan Hattenbach of Macrhino is producing exclusive families for us in this context.</p>
      <p>[5] <a href="http://www.veer.com/jukebox/" title="http://www.veer.com/jukebox/">http://www.veer.com/jukebox/</a><br>
      [6] <a href="http://www.veer.com/umbrella/" title="http://www.veer.com/umbrella/">http://www.veer.com/umbrella/</a><br>
      [7] <a href="http://www.veer.com/meantangerine/" title="http://www.veer.com/meantangerine/">http://www.veer.com/meantangerine/</a><br>
      [8] <a href="http://www.veer.com/cabinet/" title="http://www.veer.com/cabinet/">http://www.veer.com/cabinet/</a></p>
      <p>See, we’ve been busy.</p>
      <p><strong>@Jonathan</strong> We’re still cool. I promise that isn’t about to change.</p>
      <p><strong>@Si</strong> I’m truly sorry about the lack of catalogues ... I honestly can’t explain why you never see them. It’s not like we have a zip code block on Redmond.</p>
      <p><strong>@James</strong> No apologies needed. Although I think it may have been me riffing on the work of the mid-80s Mr Brody, rather than the other way around. I was a very impressionable aprés art college grad.</p>
      <p>A more recent example of by type design exploits can be witnessed in this Type Battle: Triline Pixel Font</p>
      <p><a href="http://www.typophile.com/battle03" title="http://www.typophile.com/battle03">http://www.typophile.com/battle03</a></p>
    html_clean: |-
