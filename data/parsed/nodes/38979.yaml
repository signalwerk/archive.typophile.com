    html: <p>As I pointed out in the old thread about this that got nuked, I’m pretty sure this is all about the human capital. Veer knows how to build a great stock library, how to market it, and how to sell it. Corbis sucks at most of that (excluding the massive historic image library) and I’m sure that Veer’s success is hurting them. I wouldn’t be surprised to see the Corbis stock images moved under the Veer brand with the historic stuff treated as another stock library Veer licenses and sells. As for the type, given the way Corbis has been built up via acquisition, maybe those TYPE stock certificates will become collector’s items in the future…</p>
