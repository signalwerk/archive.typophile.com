    html: |-
      <p>I think this must be the issue of the starting node needing to be Sharp, not Smooth - because the two BCPs cannot be guaranteed to form a smooth connection for the starting node (the way bezier math works). But AFAIK it's a technicality - the font will still work fine. And if there are no Sharp nodes in the contour at hand (the biggest example being the -typical- /o) then you have no choice.</p>
      <p>hhp</p>
