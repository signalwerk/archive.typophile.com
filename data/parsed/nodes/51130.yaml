    <p>I've been playing around with fontlab/openType for a school assignment but I'm not really getting it.</p>
    <p>I'm really interested in scripting a font. A teacher told me you don't have a lot of options nowadays since postscript type 3 isn't supported anymore? But you should still be able to do some nice things with openType I think.</p>
    <p>What I am after is the following;<br>
    I'm making a font that lets all the characters respond to each other. Basically I want to check what the first character of a word is, and  let the other characters choose the appropriate glyph based on that.</p>
    <p>So, when I write 'nosebleed' (wow, random) I want the o,s,e,b,l,d to choose their glyphs belonging to the n, some something like o.n, s.n, e.n etc.</p>
    <p>For the combination CA you could do something like this:</p>
    <p>feature replace{<br>
         sub C A by C.A;  (where C.A is a glyph containing both a C and an special version of the A)<br>
    } replace;</p>
    <p>But of course, this won't let you change the whole word.</p>
    <p>This;<br>
    ignore substitute @LETTER f' i';<br>
    substitute f' i' by f_i.init; </p>
    <p>Lets you change glyphs to make a ligature at the beginning of a word. But can you reverse this? Like; only replace the glyph if it's NOT at the beginning of the word, and replace it by it's version belonging to the FIRST character of the word.</p>
    <p>In other scripting languages I would do something like this:</p>
    <p>See if the typed character is the first character of the word being typed.<br>
    If it is, use the standard glyph. If not, see what the first character was and make the typed character the glyph 'typedCharacter.firstCharacter'; </p>
    <p>Does anyone know if there is a way to do this? Or something like this? Or something to get me started?</p>
