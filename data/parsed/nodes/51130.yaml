    html: |-
      <p>A more conventional approach would be a calt feature, something along these lines:</p>
      <p>sub [A A.A B.A C.A D.A E.A] [A B C D E]' by [A.A B.A C.A D.A E.A];<br>
      sub [B A.B B.B C.B D.B E.B] [A B C D E]' by [A.B B.B C.B D.B E.B];</p>
      <p>[A B C D E]' will be replaced, the class before is is what serves as context. This means, in the first line, any glyph following an A will be replaced by an .A alternate, and any subsequent glyph (i.e. following an .A alternate) will be replace by an .A alternate too. The first glyph of a word will not be replaced -- the above context definition requires that at least one glyph precedes the glyph to be replaced.<br>
      Just wondering, how many alternates do you want to draw?&nbsp;&nbsp;;-)</p>
