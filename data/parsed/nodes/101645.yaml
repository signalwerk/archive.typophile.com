    date_raw: 23 Mar 2013 — 8:51am
    votes: null
    html: <p>Many of these books are past the copyright date, so anybody can now publish them. I suspect many are POD (print on demand) books.  I'm not sure if the bad covers are just the result of ignorance, or the publisher is trying to appeal to a different audience than traditional (quality) publishers, or these  covers are a weird way of generating clicks with the associated search engine status.</p>
