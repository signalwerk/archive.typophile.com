  votes: null
  html: |-
    <p>A functioning online community needs a separate place to discuss that community. Specific topic discussions should not be polluted by metadiscussions about how the site works.</p>
    <p>Typophile needs to <a href="http://metatalk.MetaFilter.com" title="MetaTalk" rel="nofollow">clone what MetaFilter does</a> and start a separate forum called MetaPhile. It is there that site policy and the specifics of individual posts can be discussed. If you have a concern about a post in one of the other forums, start a new post in MetaPhile to talk about it.</p>
    <p>In particular, posts about new site features should not be <a href="http://typophile.com/node/65428" title="Viz Jared Benson’s" rel="nofollow">buried</a> in somebody’s “blog,” a feature this site never needed.</p>
    <p>It goes without saying that all these posts with subject lines beginning “MetaPhile” should be moved there.</p>
