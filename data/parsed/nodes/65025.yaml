    html: <p>Most sans faces have a relatively tall x-height. Unless you start digging into display type you’d be hard pressed to find a sans with an x-height small enough to impact legibility on screen except in the heaviest or most compact weights. The kind of small x-heights that effect legibility are found in serif designs like Centaur and Mrs. Eaves which really aren’t likely to get used on screen anyway.</p>
