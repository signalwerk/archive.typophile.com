      <p>Ah sorry good point!</p>
      <p>The brief is -<br>
      ——————————————————————————————————-<br>
      We’re an international TV Brand. We love our drama, reality TV, films, soaps and niche programmes. We commission gutsy programmes and blend cool drama with our own lifestyles. We segue effortlessly from escapist, to gritty, to humanitarian, to sensationalist.</p>
      <p>The picture is fantastic. What’s missing is the frame. We’ve lost our mojo. We are too passive – lost in the avalanche of brands (movies, adverts, sponsors, TV shows) screaming for attention.</p>
      <p>We need to build a big, bold brand – to forge emotional connections with our audiences – to be open and compelling – rooted in truth and effect. We want to carve out a place in people’s hearts – be a challenger and express a clear point of view. We need to be more than expected – not just any other channel.</p>
      <p>The Brief<br>
      We want you to develop the identity/look and creative direction of the channel.</p>
      <p>Name<br>
      Channel X is only a working title – we want you to come up with a name that reflects the personality and values of the channel.</p>
      <p>Logo<br>
      Create a logo that represents the channel. It can be live action, animation-based and it needs to have a strong, bold attitude that feels alive while being essentially typographic. This needs to be applied for on screen use and for a range of channel marketing materials and merchandise.</p>
      <p>do<br>
      – create a distinct, expressive, cohesive, entertaining, exciting channel look.<br>
      – have a strategy that is driven by the proposition ‘stimulation for the masses’.<br>
      – relate the look to channel content.</p>
      <p>don’t<br>
      – create typical logo idents that feel generic.<br>
      – create typical TV design.</p>
      <p>Target Audience<br>
      Our audience<br>
      – love being entertained.<br>
      – are not affluent but have sophisticated spending and tastes.<br>
      – are articulate but not necessarily university educated.<br>
      – are 16–45 with a slight male bias.<br>
      – are a cultural mix.<br>
      – includes young parents.<br>
      ——————————————————————————————————-</p>
      <p>I feel the channel is trying to be like a mix of Channel 4 and MTV.</p>
