    <p>Hi</p>
    <p>I'm currently designing a TV brand for an ISTD project. I am looking for a typeface to be used on screen and for print.</p>
    <p>After reading this thread - <a href="http://www.typophile.com/node/3413" title="http://www.typophile.com/node/3413">http://www.typophile.com/node/3413</a> it stated for maximum legibility on screen a typeface with a high x-height should be used.</p>
    <p>So please recommend some san-serif and slab-serif fonts with high x-heights.</p>
    <p>I have used <a href="http://www.neutura.org/Neutrino.html" title="http://www.neutura.org/Neutrino.html">http://www.neutura.org/Neutrino.html</a> for my logo if this helps :)</p>
    <p>Thanks in advance</p>
