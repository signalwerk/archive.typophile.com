    html: |-
      <p>It doesn't really match your logo, but I used to rely quite heavily on Poppl Laudatio for video/screen work - it's very good at that. It's not technically a sans, but its flares do give it great visual interest at larger sizes. However in print I would not use it for more than a couple of lines of text; for that I would find a font that matches Laudatio but with a smaller x-height (and perhaps not as wide). Maybe Pascal.</p>
      <p>If you want something more contemporary and rigid, try FF Balance, which actually evokes "TV" to me quite strongly. It even has gentle traps, which would compensate for dot gain in video. Also, you could use it for print text, but still not long text.</p>
      <p>Logo feedback in that other thread.</p>
      <p>hhp</p>
