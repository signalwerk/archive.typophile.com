    <p>I've been looking at <a href="/web/20150123173538/http://typophile.com/wiki/ITC%20Berkeley" class="freelinking" rel="nofollow">ITC Berkeley</a> Oldstyle. I think that's what the British Harry Potter books are set in and I've been reading a lot of them with my son recently. (Let me know if I'm wrong). That led me to FB <a href="/web/20150123173538/http://typophile.com/wiki/Californian" class="freelinking" rel="nofollow">Californian</a> and then LTC Californian. There's a discussion in the archives (<a href="https://web.archive.org/web/20150123173538/http://typophile.com/node/3077" title="http://typophile.com/node/3077">http://typophile.com/node/3077</a>) comparing Berkeley and FB Californian, with some talk about the LTC version, which wasn't actually released at the time. It now is released, in Opentype and at a very good price (<a href="https://web.archive.org/web/20150123173538/http://www.lanstontype.com/" title="www.lanstontype.com">www.lanstontype.com</a>). Has anyone used it? Have an opinion to share?</p>
    <p>The consensus in the earlier thread seemed to be that ITC Berkeley was relatively sanitized, FB truer to the original Goudy design and more 'quirky'. The LTC version claims to be closest to the original and looks beautiful on the Lanston PDFs.</p>
  html_clean: |-
    <p>I've been looking at <a href="/web/20150123173538/http://typophile.com/wiki/ITC%20Berkeley" class="freelinking link-lost" rel="nofollow">ITC Berkeley</a> Oldstyle. I think that's what the British Harry Potter books are set in and I've been reading a lot of them with my son recently. (Let me know if I'm wrong). That led me to FB <a href="/web/20150123173538/http://typophile.com/wiki/Californian" class="freelinking link-lost" rel="nofollow">Californian</a> and then LTC Californian. There's a discussion in the archives (<a href="/node/3077/" title="http://typophile.com/node/3077" class="link-kept">http://typophile.com/node/3077</a>) comparing Berkeley and FB Californian, with some talk about the LTC version, which wasn't actually released at the time. It now is released, in Opentype and at a very good price (<a href="https://web.archive.org/web/20150123173538/http://www.lanstontype.com/" title="www.lanstontype.com" class="link-external">www.lanstontype.com</a>). Has anyone used it? Have an opinion to share?</p>
    <p>The consensus in the earlier thread seemed to be that ITC Berkeley was relatively sanitized, FB truer to the original Goudy design and more 'quirky'. The LTC version claims to be closest to the original and looks beautiful on the Lanston PDFs.</p>
