      <p>Speaking of LTC Goudy stuff, a design faculty person recently pointed out that he couldn't stand the lc "a" in Kennerley. I actually saw something in it that I liked, and drew a lc "a" over a large undercooked burger off of Harvard Square the following day. But my main question is, now that I'm taking a closer look, is the LTC version* sanitized, or is the Berthold version** just plain wrong?</p>
