    html: <p>i'm partial to LTC Californian, but that's because i digitized it. the advantage of this Californian is that it is in OT format and supports a full Central European Characterset. I still love Californian FB and the advantage I see to this set is that you have a much greater range of weights/styles. I'd love to expand our LTC family to include cyrillics and more weights, and we may do that if we get enough interest in this type family. i prefer both versions of californian to berkely.</p>
