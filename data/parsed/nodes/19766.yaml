      <p>I have seen a lot of the two other (ITC and FB) "Californian" efforts, and I think they look pretty good on their own merits, but if a person wants Californain true to the origianl it would be hard to beat P22's LTC Californian, since it was digitized directly from newsprint proofs of the patterns which Goudy made with his own hands.</p>
      <p>For today's useage I guess it is expedient to supply at least one bolder version, but it would be hard work to make one that comes up to the earthiness of the original. In Goudy's book "Typologia" there are large point size specimens of both the roman and italic, which show clearly the wonderful grittiness of his original, since these were proofed from the lead patterns retrieved from the Lanston Monotype works shortly after the designers workshop (Deepdene) was wiped out by the fire.</p>
      <p>Jim</p>
      <p><img src="/sites/default/files/old-images/"></p>
