    <p>I've been looking at <a href="/node/add/wiki?edit%5Btitle%5D=ITC%20Berkeley" title="Create node &quot;ITC Berkeley&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">ITC Berkeley</a> Oldstyle. I think that's what the British Harry Potter books are set in and I've been reading a lot of them with my son recently. (Let me know if I'm wrong). That led me to FB <a href="/node/29641" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Californian</a> and then LTC Californian. There's a discussion in the archives (<a href="http://typophile.com/node/3077">http://typophile.com/node/3077</a>) comparing Berkeley and FB Californian, with some talk about the LTC version, which wasn't actually released at the time. It now is released, in Opentype and at a very good price (<a href="http://www.lanstontype.com">www.lanstontype.com</a>). Has anyone used it? Have an opinion to share?</p>
    <p>The consensus in the earlier thread seemed to be that ITC Berkeley was relatively sanitized, FB truer to the original Goudy design and more 'quirky'. The LTC version claims to be closest to the original and looks beautiful on the Lanston PDFs.</p>
  html_clean: |-
    <p>I've been looking at <a href="/node/add/wiki?edit%5Btitle%5D=ITC%20Berkeley" title="Create node &quot;ITC Berkeley&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">ITC Berkeley</a> Oldstyle. I think that's what the British Harry Potter books are set in and I've been reading a lot of them with my son recently. (Let me know if I'm wrong). That led me to FB <a href="/node/29641/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Californian</a> and then LTC Californian. There's a discussion in the archives (<a href="/node/3077/" class="link-kept">http://typophile.com/node/3077</a>) comparing Berkeley and FB Californian, with some talk about the LTC version, which wasn't actually released at the time. It now is released, in Opentype and at a very good price (<a href="http://www.lanstontype.com" class="link-external">www.lanstontype.com</a>). Has anyone used it? Have an opinion to share?</p>
    <p>The consensus in the earlier thread seemed to be that ITC Berkeley was relatively sanitized, FB truer to the original Goudy design and more 'quirky'. The LTC version claims to be closest to the original and looks beautiful on the Lanston PDFs.</p>
