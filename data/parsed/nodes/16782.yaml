      <p>thanks for the feedback.<br>
      it's true, the name is quite long.<br>
      the type is custom, not a font or modified font.<br>
      though it's certainly inspired by deco lettering.<br>
      the uses are pretty standard: letter, web, forms, though there might be some wildcards like a badge or sticker...<br>
      i wanted to keep it simple at least for now--i.e. b&amp;w, flexible relationship between mark and type.<br>
      the balance starts to get at what i see as a problem.<br>
      i'll have to play around with that a bit.</p>
