    html: |-
      <p>hmmn. good suggestion.</p>
      <p>the sheild/duck crest is a legacy mark evolution in a way. chris-craft used a shield at some point with quadrants that also contained a sailboat (despite the fact that they made motorboats)--see attached. the guy who started the company (long-ago now) started by building duck hunting boats (as opposed to luxury motorboats) and presumably because of that, the pair of ducks is on the company crest.</p>
      <p>the boat club has used their own variation of the chris-craft shield as a logo for some time now (since mid-70s)--see attached. at first it appears that they just wholesale appropriated the crest, and only dropped the club name into it. at some point they erased a picture of a sailboat from one quadrant of the crest, and moved the ducks into it (leaving one quadrant empty for 10 years). later on someone drew (poorly) a motorboat into the other quadrant. but the ducks have remained, despite these (and other, smaller) changes. so basically i condensed it down even further to just the ducks and the shield. </p>
      <p>i wonder if moving the crest to a different location with respect to the word mark would make a difference???</p>
