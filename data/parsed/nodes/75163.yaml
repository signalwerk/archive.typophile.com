    <p>In Moshe Spitzer's article 'The development of Hebrew lettering' (<strong>Ariel</strong> 37 (1974), 4-28), he discusses Franziska Baruch's Stam type. He says it was 'unsuitable for the printing of a legible page, and therefore restricted from the outset to use in captions and formal display matter. The light version of this letter, which was cast simultaneously, never took hold, because of the misguided aversion of printers to Hebrew light-face letters.' But what is this light-face Stam?</p>
    <p>Spitzer does not show it in his article, nor have I seen it in any specimen of Berthold (for whom Stam was originally made). Nor is it mentioned in the article on Baruch in the <strong>Israel Bibliophiles Newsletter</strong> (Spring 1984). I think he must be referring to Baruch's similar but lighter 'Mayer' Hebrew. This was not issued simultaneously, but was designed for Leo Ari Mayer at the Hebrew University of Jerusalem and produced by Monotype in 1938. Spitzer himself revived this type under the name 'Mayer-Baruch' at the Jerusalem Type Foundry in the 1950s. But he didn't call it 'Stam light'. </p>
    <p>Besides my question above, it is worth mentioning that Mayer's dealings with Franziska Baruch and Eric Gill (who designed Gill Hebrew also for him) seem to be lost to history. Years ago I wrote to the only contact I had, which was Mayer's Museum for Islamic Art in Jerusalem; but they knew nothing about Mayer's interest in typography, and even thought I had the wrong Mayer! </p>
    <p>And if anyone would like to know more about Monotype Mayer, may I here advertise my new book <strong>The Hebrew Types of the Jericho Press</strong>? Details at <a href="http://www.jericho-press.com" title="www.jericho-press.com">www.jericho-press.com</a>.</p>
    <p>Chip Coakley</p>
