      <p>In Ittai Tamaris Thesis “Hebräische Schriftgestaltung in Deutschland von der Jahrhundertwende bis zum Ausbruch des Zweiten Weltkrieges” (Egelsbach: Hänsel-Hohenhausen 1994) a short biographic sketch on Franziska Baruch can be found. He writes the following [with some additions by myself]:</p>
      <p>Franziska Baruch was born in 1901 in Hamburg. She studied graphic art at the School of Applied Arts (Staatliche Kunstgewerbeschule) in Berlin and completed her studies as a master student. In the 1920s she reached success with designs for porcelain manufacturer and an excellent performance for “Reichskunstwart” Edwin Redslob [Between 1920 and 1933 the Reichskunstwart was an  authority responsible for the visual representation of the state]. Baruch won also great reputation for her work as a set designer in the German Pavillions at the International Press Exhibition “Pressa” in Cologne in 1928. In 1920 Baruch began to work for Jewish publishing houses. At that time she had also for the first time dealt seriously with the Hebrew letter. After a long study of ancient Hebrew manuscripts and prints as well as practical exercises she was able to design Hebrew letters. In 1921 she drew the texts of some Hebrew books with woodcuts by Jacob Steinhardt. [In 1922 she was responsible for the Hebrew titles of the pioneering magazine “Rimon-Milgroim”, and for other publications of the Berlin based Rimon publishing house].<br>
      <a href="http://www.flickr.com/photos/isotype75/8538703705/" title="מילגרוים by isotype75, on Flickr" rel="nofollow"><img src="http://farm9.staticflickr.com/8378/8538703705_13a589bcea.jpg" width="500" height="199" alt="מילגרוים"></a></p>
      <p>In 1922 she gave Joseph Cherkassy [Tscherkassy], head of the Oriental Department of the H. Berthold AG type foundry, her first letters designs, based on a medieval Prague Haggadah-Print. These designs were later [some time between 1924 and 1929] published by the type foundry under the name “Stam” [and some variations Baruchs designs as “Magere Stam”, “Rambam” and “Rachel”].<br>
      <a href="http://www.flickr.com/photos/isotype75/8546596554/" title="Stam Berthold by isotype75, on Flickr" rel="nofollow"><img src="http://farm9.staticflickr.com/8090/8546596554_d0edee29ea.jpg" width="500" height="445" alt="Stam Berthold"></a><br>
       In 1924 [?] Baruch also designed the “Mayer-Baruch”-Letter for the Orientalist Prof. Leo A. Mayer (1895-1959) and tried her hand at the first draft of a type for the Schocken publishing house in Zwickau [finallly published in 1938 as “Schocken-Baruch”]. In 1933 Baruch migrated to Palestine and practiced different professions for her livelihood. She worked in drawing maps, designed stone inscriptions, and also sold marzipan chocolates under the name “Baruch confectionery”, which she made herself at home. </p>
      <p>[Franziska Baruch is also responsible for a numbers of logo designs and the masthead of the daily Haaretz]. </p>
      <p><a href="http://www.flickr.com/photos/isotype75/8542105989/" title="Ha'aretz by isotype75, on Flickr" rel="nofollow"><img src="http://farm9.staticflickr.com/8379/8542105989_c2d83189f3.jpg" width="500" height="157" alt="Ha'aretz"></a></p>
      <p>Franziska Baruch died on the 6. september 1989 in Jerusalem.</p>
      <p>A short article on Baruch (by Gideon Stern) can also be found in the Israel Bibliophiles Newsletter Nr. 4 (1984). I haven’t seen this one as it can't be found in any european library. The providing of a scan therefore would be very much appreciated.</p>
