      <p>What do you mean: "I wouldn’t be that exclusive about the significance of “Frank-Rühl” but I do agree that it is to a great extent also a political one."?</p>
      <p>Don't get me wrong, it was and is a great readable Hebrew face. But, it lacks in its design, and ALL of its great renditions and even in its knock-offs superior improvements of certain design quality.</p>
      <p>Frank-Rühl was created to become the typeface to be used for modern newspapers, cheap novels, and even pornography, instead the imitations of Romm-Vilna, especially after the latter press was totally destroyed and burnt by the Nazis, after they bombarded Vilna.</p>
      <p>&gt;&gt; The art-nouveau-design of Raphael Frank’s typeface symbolically disconnected Hebrew as script from the religious tradition and connected it to a universal “modernity”.</p>
      <p>How was Raphael Frank’s typeface design art-nouveau? isotype75, how do you define an art-nouveau design. In my understanding it is not art-nouveau, just as Times-Roman is not art-nouveau. Perhaps, I err; perhaps, you.</p>
