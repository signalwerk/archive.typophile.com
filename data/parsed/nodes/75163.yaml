      <p>I will post a sample of “Schocken-Baruch” as soon as I can get my hands on an original source (a reproduction could be found in Moshe Spitzer’s article “The development of Hebrew lettering”).</p>
      <p>I wouldn’t be that exclusive about the significance of “Frank-Rühl” but I do agree that it is to a great extent also a political one. The art-nouveau-design of Raphael Frank’s typeface symbolically disconnected Hebrew as script from the religious tradition and connected it to a universal “modernity”. For that reason it was embraced by those who at the turn of the century aimed at the creation of a secular Jewish culture with modern Hebrew literature, newspapers (and finally a nation state).</p>
      <p>I think the tendency in Hebrew type-design in the 1920ies that lead to typefaces like Baruch’s “Stam” and  “Schocken” is a genuine German phenomena. People like Salman Schocken and the members of the influential bibliophilic “Soncino-Gesellschaft” didn’t like “Frank-Rühl”. In their typographic taste, they followed the mainstream of German bibliophiles and designers (Rudolf Koch for example) who idealized typefaces from the early era of printing. Art nouveau (“Jugendstil”) was out of date. “Frank-Rühl” was critized as a fashion-font from bygone times. For their (strictly secular) purposes these people wanted good “classical” Hebrew typefaces that could keep up with the latin designs of that time.</p>
