      <p>1. At the top of this thread it is written, where Moshe Spitzer’s article can be foud.<br>
      2. For the discussion of the qualities of “Frank-Rühl” vs. “Romm Vilna” I suggest another thread as this one is entitled “Franziska Baruch and Leo Ari Mayer“.<br>
      3. “Frank-Rühl” is definitely not as pronounced as the typefaces of Peter Behrens and Otto Eckmann but the spirit of that age did leave an imprint.<br>
      4. “high falluting” - if you say so.<br>
