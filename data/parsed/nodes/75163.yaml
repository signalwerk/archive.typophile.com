      <p>Could you please post a sample of the Schocken typeface, and also a source that mentions it is a recent design, and how it improves upon the design of FrankReuhl, which was created in the very early 20th century in Germany?</p>
      <p>That original design of FrankReuhl was a derivative of the classic Romm design, which dominated the entire Jewish printing industry for over 100 years. The Romm design was cut in metal at the beginning of the 19th century, and perhaps even earlier. Certainly, there is historical evidence that the design precedes Guttenberg, and was used in hand written drawings (see Frederick Goudy's book on this), like also the face known as Rashi. Often, these two letter forms are simply called the Square Letter typeface, and the Round Letter typeface.</p>
      <p>Currently, secular or anti-religious scholarship claims the Romm is actually a much later design. This is foolish, because the 20th volume of the Talmud documents the Talmud set's history, which contradicts this stupid theory, popular by scholars in their own eyes. Look it up; it is called the אחרית דבר - the AfterWord.</p>
      <p>Based upon impressions made by professional scribes, I believe FrankReuhl was less an improvement graphically of Romm, buta political alternative to that which Romm represented. These professionals argue that the letter form design of Romm is easier on the eyes than FrankReuhl, and conducive to lengthy dwelling on portions of the text in Jewish books, while FrankReuhl is better for texts that are read quickly, like newspapers, cheap novels, and the like.</p>
