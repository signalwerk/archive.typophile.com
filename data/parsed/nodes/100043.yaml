  html: |-
    <p>I was wondering if the font used on the covers of the books A Book a Part (<a href="http://www.abookapart.com" title="http://www.abookapart.com">http://www.abookapart.com</a>) would be some ultra compressed version of Trade Gothic? </p>
    <p>I am wondering because:</p>
    <p>1. It looks a lot like Trade Gothic (and probably is)<br>
    2. Jason Santa Maria, who is noted as the designer of the books has expressed his love for Trade Gothic on several occasions online.<br>
    One is in Fontshop newsletter <a href="http://www.fontshop.com/blog/newsletters/june10a/indexEMAIL.html" title="http://www.fontshop.com/blog/newsletters/june10a/indexEMAIL.html">http://www.fontshop.com/blog/newsletters/june10a/indexEMAIL.html</a> and a small part of one cover is shown, but that super condensed/compressed version shown is not available at Fontshop, as far as I can see.</p>
    <p>So, if anyone knows: Where can I buy this font?</p>
    <p>Regards,</p>
    <p>Sigurdur Armannsson at 64°N</p>
