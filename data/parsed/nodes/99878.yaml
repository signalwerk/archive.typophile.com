    html: |-
      <p>The "group character", called a "ligature", requires OpenType programming.<br>
      Make the ligature glyph, and give it a name that is the names of the two glyphs it will replace joined by _ (like "r_i"). Do not give it any Unicode value.<br>
      Open the OpenType panel and add feature "liga" if it is not already there. In it put the code:<br>
      <code><br>
      feature liga {<br>
        sub r i by r_i;<br>
      } liga;<br>
      </code><br>
      with a sub line for every ligature substitution you want.<br>
      Compile it, and test it in the Preview panel.</p>
