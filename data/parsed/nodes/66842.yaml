  html: |-
    <p>This may be a bit of an imposition, but I was wondering if someone would be willing to give some logo-making advice: I'd like to take a shot at making a logo for a research group at a Scottish university, consisting essentially only of a few letters (probably "E-CoS" or "E-CS"). Are there any typefaces typical of Scotland or of Britain of the Edwardian era that would go nicely as a logotype?</p>
    <p>Thanks!</p>
