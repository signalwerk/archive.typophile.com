    <p>I have been putzing with some feature code to try to do what seems like a simple thing, replace 3 glyphs with 3 other glyphs contextually. Some day maybe Adobe et al will allow for one to many substitutions.<br>
    In the mean time, here is a screen grab of my code. The only way I got it to work was to make a succession of 3 lines of code to do what it seems one line should work. I am sure Karsten or someone else has done it far more elegantly so I am hoping they will show us the better way to do it.<br>
    In the following, I am substituting the combinations TT, TTY, and TY with alternates for better spacing. I am repeating similar code for smallcap version in succeeding lines. The last few lines are just part of another substitution.</p>
    <p>Here is hoping you Obbeewon code warriors have a better way than my hack.</p>
    <p>Thanks,</p>
    <p></p><div class="imageWrap"><img src="/files/caltboulder_5292.png"></div><p></p>
    <p>ChrisL</p>
