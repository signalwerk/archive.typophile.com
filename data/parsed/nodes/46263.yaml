    html: |-
      <p>The first line: sub T’ T by T.alt2;<br>
      Looks like you’re substituting instances of two T’s with a single “TT” glyph (T.alt2), and this alt is a ligature?</p>
      <p>Then in the second line you’re substituting instances of T.alt2 plus T.alt plus T plus Y with T.alt3.</p>
      <p>The third line substitutes instances of T.alt2 plus T with T.alt.</p>
      <p>Have I interpreted this correctly? Correct me if I’m wrong.</p>
      <p>It’s a bit confusing not knowing exactly what these alternate glyphs look like, but a few things jump out at me here: What are the apostrophes (quotesingle) for? I’m accustomed to using the quotesingle after the key glyph in a class definition for kerning, eg:<br>
      _kern01: a’ a.1 a.2 agrave aacute acircumflex adieresis [etc etc]</p>
      <p>In that example a.1 and a.2 are stylistic alternates, and the other a’s are the familiar western diactritics.</p>
      <p>But in the code box for defining OT features I’ve never found quotesingle to be of any use. This is how I code similar sequences to your calt examples:</p>
      <p>sub T T by T_T;<br>
      sub T T Y by T_T_Y;<br>
      sub T_T Y by T_T_Y;</p>
      <p>That coding works, compiles without a hiccup. It’s good practice by the way to use an underscore in the names of ligature glyphs to avoid coincidences with standard unicode glyph names.</p>
      <p>j a m e s</p>
