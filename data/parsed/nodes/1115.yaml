  html: <p>Dates and times of the various sessions of the ATypI conference are now online at  <br><a href="http://www.atypi.org/40_conferences/28_Vancouver/40_timetables" target="_blank">http://www.atypi.org/40_conferences/28_Vancouver/40_timetables</a>  <br> <br>Please note that this schedule is still subject to change, but most of it is pretty solid. The list is still sorted by thematic thread, rather than by actual location track, so you will need to cross-reference to see which presentations are concurrent. A version of the programme sorted by location track will be available next week.</p>
