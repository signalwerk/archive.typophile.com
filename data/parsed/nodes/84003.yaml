      <p>There is a bit on kerning and spacing on Briem's site as well as a treasure of other typographic knowledge.<br>
      <a href="http://briem.net/" title="http://briem.net/">http://briem.net/</a><br>
      Because even your round letters here have square sides you will need to optically determine the volume of white space contained between letters. The T, for instance can be tucked into the A a bit more while the OR combo is quite tight. The L will be problematic no matter what.</p>
