  html: |-
    <p>I need some advice on the kerning for this logo. </p>
    <p>The gallery specializes in Aboriginal art, so I wanted it to maintain an indigenous feel, both in colour and symbolism, while still remaining attractive to an overseas (mainly German and Holland) corporate market.</p>
    <p>The gallery will also serve as a store/gallery for tourists.</p>
    <p>The symbol is called a Journey Circle, as I wanted to avoid using a literal translation of a foot.</p>
    <p>I am not very confident in my ability to kern so I need help in making this visually balanced. So far FOOTSTEPS is looking inconsistant. But I cannot put my finger on it.</p>
    <p>help…</p>
