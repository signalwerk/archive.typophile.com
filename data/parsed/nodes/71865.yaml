  html: |-
    <p>I am trying to find a book about type design focusing on the process of designing a font. That is, since the catalyst or the idea, to the first primitive sketches, through the processes of adjusting and choosing the best forms for specific letters, designing alternates, etc. I am more interested in understanding how type designers "think" than the results they achieve.</p>
    <p>Can any one point me in some direction?<br>
    After a quick search, I couldn't find any reference to such a book in Typophile.</p>
    <p>Thank you!</p>
    <p>(Thanks for the replies on the original thread, opened in the wrong forum, specially about <a class="freelinking external" href="http://www.springer.com/birkhauser/architecture+%26+design/book/978-3-7643-8581-1" rel="nofollow"> this</a> beauty. Hoping to get some more suggestions, still!)</p>
