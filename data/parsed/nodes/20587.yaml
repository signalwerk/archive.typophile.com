    <p>I’m looking for .meq and .keq-files to make classes of kern pairs in Fontographers Kerning Assistance.</p>
    <p>There are some that comes with FOG, but they don’t include all the accented letters. I could set this up myself, but since I am rather novice in FOG maybe I will forget about some classes.</p>
    <p>I’m about to all by myself produce my first commercial font that is going to be distributed, so I want to make sure I make everything correct and don’t forget about something.</p>
    <p>So I was thinking there perhaps could be some resources out there? Template-files and such for this kind of matters?</p>
    <p>Thanks, and kind regards from Sweden!</p><div class="imageWrap"><img src="/files/assistancemetrics_5808.png"></div><p></p>
