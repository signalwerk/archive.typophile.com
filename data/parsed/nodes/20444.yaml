    <p>There seem to be a fair amount of books out there regarding type faces and I was under the impression that same would count for the web. But, I have been browsing quite a bit and I cannot find a site which gives  you lots of examples of complimentary fonts. The "big" sites might give you an example of the type face in a particular use, but non make suggestions what to combine it with. (bit like <cite>"people who bought this font also bought..... "</cite>(Amazonism)) Surely someone would have set up a site where you type in a font and automatically a list of analogous, complimentary fonts would roll out... Does anyone know about such a site?</p>
    <p>Be great if you would like to share this.<br>
    W</p>
