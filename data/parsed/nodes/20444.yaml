      <p>Or even better might be a list of what typefaces are used for specifically. Times for newspaper publications, comic sans for 8 yr old birthday party invitations, etc. Does this exist already? Maybe organized by blackletter, modern, humanist, etc.</p>
      <p>I like this concept too, I'm thinking more along the lines of what was the original intended use of the typeface. This would still leave it's use expandable upon while giving a general baseline for a more specific application. </p>
      <p>The idea being more than the broad understanding that Serif fonts are great for small body copy and San-Serif fonts for Display and Titling. </p>
      <p>There are definitely fonts out there with the ability to perform both tasks equally, but was that the designers original intention? Aside from some of the more unique fonts available, I'd assume that most traditional fonts were designed with great versatility in mind.</p>
