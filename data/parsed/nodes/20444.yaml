      <p>I'm not aware of any such site in particular… myfonts.com will let you search by keyword. The most recent issue of Communication Arts has an article by <a href="/wiki/Jonathan%20Hoefler" class="freelinking" rel="nofollow">Jonathan Hoefler</a> about mixing types. Chapter 6 of Robert Bringhurst's <a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking" rel="nofollow">Elements of Typographic Style</a> has a chapter about choosing and mixing type ( ch.6 ) as well. You might try a search of this site, or if you could be more specific, maybe the kind folks here could give some suggestions.</p>
