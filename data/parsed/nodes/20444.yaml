      <p>Being a subjective area, Geoff Riding's recommendation – of collecting usages that appeal – seems more productive than following a list provided by a group (or individual). A list of specific uses would only be broad generalisations more restrictive than guidance. </p>
      <p>I could see the idea of creating an "also bought" feature might be a good sales tool for some smaller sites (individual designers/foundries) but larger (purely retail) sites would have to step carefully to avoid offence to their suppliers.</p>
      <p>Tim</p>
