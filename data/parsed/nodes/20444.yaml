    html: |-
      <p>See this thread; <a href="http://www.typophile.com/node/18342" rel="nofollow">Good book about type mixing</a></p>
      <p>As Eben Sorkin stated simply in a related thread, "the eye is the final arbiter", I  think this is true in finding complementary type solutions. Books covering the basics of type and typography such as Bringhurst’s <a href="http://www.amazon.com/gp/product/0881791326/102-4072842-3990505?v=glance&amp;n=283155" rel="nofollow">The Elements of Typographic Style</a> should give you a basic understanding on how to complement a typeface.</p>
      <p>As for me, I'm an obsessive magazine collector and I usually take notice of good type combinations and "steal" them, not necessarily down to the exact typeface itself but it's overall style.</p>
      <p>I think it's very important to be able to recognize which typefaces are suitable for display or text, or both. It is usually unwise to pair two “strictly” display faces. Also, I like to try and find complementary typefaces with similar x-heights, but in the end it all comes down to how it looks. You decide. </p>
      <p>I hope this helps.</p>
