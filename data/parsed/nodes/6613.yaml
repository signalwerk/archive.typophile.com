    html: "<p>Good points, Randy. <br>Some \"reactions\": <br> <br>&gt; go to people in the old guard. <br> <br>Just make sure you generally do so in old fashioned ways. :-/ That's one problem I've noted - few \"old timers\" can get to grips with newer ways of interaction. <br> <br>&gt; get as much input as you can from people you can trust <br> <br>The problem of course is figuring out who that is! <br> <br>The main thing I've learned about \"processing\" advice is this: be prepared to filter the advice depending on the context of the source. For example, some famous type designers can make great practical fonts that sell very well, but the space between their ears is a theory-free zone, shall we say. So if you're making something innovative you have to ignore big chunks of their advice, and focus on their technical feedback. <br> <br>BTW, concerning the lack of participation at TypeCon, I myself can't blame the \"students\". Seeing the droves of people wanting to get their fonts critiqued on Typophile, where there's not even anybody of the caliber of Carter or Kobayashi, makes me think the problem was something else. <br> <br>hhp</p>"
    html_clean: "<p>Good points, Randy. <br>Some \"reactions\": <br> <br>&gt; go to people in the old guard. <br> <br>Just make sure you generally do so in old fashioned ways. :-/ That's one problem I've noted - few \"old timers\" can get to grips with newer ways of interaction. <br> <br>&gt; get as much input as you can from people you can trust <br> <br>The problem of course is figuring out who that is! <br> <br>The main thing I've learned about \"processing\" advice is this: be prepared to filter the advice depending on the context of the source. For example, some famous type designers can make great practical fonts that sell very well, but the space between their ears is a theory-free zone, shall we say. So if you're making something innovative you have to ignore big chunks of their advice, and focus on their technical feedback. <br> <br>BTW, concerning the lack of participation at TypeCon, I myself can't blame the \"students\". Seeing the droves of people wanting to get their fonts critiqued on Typophile, where there's not even anybody of the caliber of Carter or Kobayashi, makes me think the problem was something else. <br> <br>hhp</p>"
  - id: 46404
