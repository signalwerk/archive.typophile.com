    html: <p>Look, I can tell you how difficult it can be as a student to work up the nerve to show your work to "the pros." I mean, I work 100m away from Akira Kobayashi, and I pass him in the hall several times a week, but I've only had him crit my work twice. He seemed quite happy to do it both times, but I don't want to wear out my welcome. <br> <br>This weariness is because I've previously had a really, really bad experience with another famous type designer here in Germany, but I'm not going to go into that on a public forum(thankfully, he is much further than 100m away). <br> <br>While I was at Typo Berlin (which, as I've heard, has a very different atmosphere from TypeCon), I showed my work to everybody. I mean EVERYBODY. I printed up 300 shiny new business cards and everything. Some designers where very receptive when I showed them things, and they made my day (or, in the case of H&amp;FJ, they made my whole <i>conference</i> ). Some other designers were quite clear that they did not want to look at things. Again, naming names here would be impolite. Sometimes, you need to realize though that at a large event--Typo Berlin had 1000 attendants and hundreds of students--certain people (especially the German speakers) field requests constantly. For example, at one point I waited in line for a half an hour to speak with Erik Spiekermann. And as each new student got up to him, asking him (sometimes downright harrasing) questions, I could see his engery level getting lower and lower. By the time I got to him, he just seemed tired. He asked me to email him instead, and I did. <br> <br><b>Be bold!</b> But be careful, too.</p>
