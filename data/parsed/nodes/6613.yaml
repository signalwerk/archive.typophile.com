    html: "<p>I'll second everything Si has said, and will add one more suggestion: specialists are more easily remembered than generalists. You probably will be happy to pick up any kind of type design work you can, but it pays to market yourself as a specialist: someone who can offer specific services to a particular niche market. If you get a couple of jobs in that area, and do them well, your name will get around. A number of type designers have successfully identified themselves with particular markets, e.g. Jonathan Hoefler with custom types for magazine art directors. Apart from helping to get you remembered, this approach also gets you more of the kind of work you want to be doing, presuming you pick a speciality that you enjoy.</p>"
    html_clean: "<p>I'll second everything Si has said, and will add one more suggestion: specialists are more easily remembered than generalists. You probably will be happy to pick up any kind of type design work you can, but it pays to market yourself as a specialist: someone who can offer specific services to a particular niche market. If you get a couple of jobs in that area, and do them well, your name will get around. A number of type designers have successfully identified themselves with particular markets, e.g. Jonathan Hoefler with custom types for magazine art directors. Apart from helping to get you remembered, this approach also gets you more of the kind of work you want to be doing, presuming you pick a speciality that you enjoy.</p>"
