    html: "<p>By retail I guess I mean making fonts without a direct commission and selling them to the public (for whatever price). The only time I myself have managed to make enough money doing that was when: I had a virtual strangle-hold on the Armenian market; and I was a bachelor living in a small -if comfy- apartment.  :-/ <br> <br>I think the best way to address the retail market is the way many big names do it: design a font under commission, give the client exclusivity for 2-3 years (after which the novelty value is gone), and after that put it out for general sale. And price high. <br> <br>Marketing: use online forums, conferences, and \"networking\". Try to get people to use pre-release versions of your fonts in real projects (maybe give them a break - but make sure they're not the type to \"share\" the fonts too much), and use those to show them off. There's nothing as effective as a physical newspaper or a high-gloss piece in your hand with your font(s) on it. <br> <br>But the fonts have to be good. Hone your craft. <br> <br>hhp</p>"
