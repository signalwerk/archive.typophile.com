    html: <p>At the time I was thinking about the diacritics. I picked Welsh, because someone else (David Earls?) was asking about it in a different thread, and picked CAS knowing that Ross had that market cornered. I agree with the other people on the thread that finding a niche is a good way of 'breaking in', and that the niche may not necessarily be a minority language. It could be cultural or it could be serving a particular type of device or technology. It could equally be serving a community like the Linux community.  <br> <br>With respect to the fonts Darren provided to Debian, these are now open source so assuming the license is really OS, anyone is free to modify, extend, hint them, sell them, bundle them etc., But Darren has the advantage of being the original creator of these so should be able to promote himself as the person best suited to doing the work.   <br> <br>Cheers, Si</p>
