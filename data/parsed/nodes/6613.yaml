    votes: null
    html: <p>It seems to me that one niche (which is more like a gaping canyon in the face of typography) that, although given attention, needs so much more focus is digital type, for websites and the like. <br> <br>The WWW has really only been around and in practical use for ten years, this means that there's a lot a lot a lot of room for both theory and design, whatever you like.  Photography, for example, has a life of roughly 150 years, and people are still doing great new heretofore unthoughtof things with it. <br> <br>Maybe people have held off on doing too much in this field because they're afraid of the extra steps that need to be taken (serious attention to hinting concerns, and the realization that a face may [and probably will] look different from display device to display device.   <br> <br>I know I'm scared.</p>
