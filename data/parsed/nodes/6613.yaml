    html: <p>Well, I just don't want to burn any bridges. Besides, there could be factors that I don't know about. I try to be a nice guy, and especially over here in Germany, we're a small group, and we all should get along. <br> <br>I'm not done trying to play nice yet. <br> <br>And I did name names... in my brief experience, Akira K., H&amp;FJ, and Erik S. have all been super nice and very enlightening. I also had fun talking to Tamye Riggs, Adam Twardoch, and Andreas Seidel in Berlin, not to mention Joan Spiekermann. See I'm naming even *more* names. <br> <br>I'm much to young to get all negative.</p>
