  html: <p>I've been making freeware fonts for a while, and been intersted in letters and letterforms since  <br>forever. I've seen my work used (and misused) in a few magazine ads, alternative newpaper covers,  <br>and even for on-screen text regularly on a television show. <br> <br>On the other hand, I've never been paid for what I've done. If I want to turn my interest into more "job"  <br>and less "hobby", what do I do? All I have is my body of work, nothing in my higher education that  <br>could be spun to make it look like I've studied type in any real way. <br> <br>What are your suggestions? How did you all do it?</p>
