already know their way <br>around letters. At first, get as much input as you can from people <br>you can trust (such as those mentioned). <br>  <br>Finally, let me say I only have one font commercially available,  <br>soon to be two. Needless to say, type design makes up a small  <br>part of my income (and take my advice with a grain of salt!). I'm  <br>a graphic designer with one toe in the font world. Hopefully it  <br>will soon be one foot in fonts. Then maybe graphic design can  <br>be the small part of my income. All that to say, don't quit your  <br>day job just yet :-) <br> <br>Keep loving letters! <br>Randy <br> <br>PS. Good grief, what a rag.</p>"
