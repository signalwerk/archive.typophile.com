    html: "<p>Typophile caughed just as I was posting a few days back. <br>It occures to me (and others) that two things are required: <br> <br><b>1. Quality Work.</b> <br>Without this, all the advice in the world will not amount to  <br>making type design a significant part of your income. You  <br>mention no formal type education. This won't matter much if  <br>your work is excellent. If it's not, consider some good  <br>instruction. Buy it if you can/have to. You're in Vancouver! <br>Great city to be in. Three very kind Vancouverite typophiles <br>prowl these forums (perhaps more): Keith Tam, John Hudson <br>(whom you've just heard from), and Jim Rimmer. They may give <br>you specific ideas about resources nearby where you can really <br>begin to hone your craft and take your work to the next level. <br>While there is not substitute for hands on instruction, post <br>work here for critique. Get help wherever you can. <br>Which brings me to... <br> <br><b>2. Confidence/Boldness</b> <br>This is so useful to improve the quality of your work, and also to  <br>moving your work once it is quality. Attack! Nicely. One bit of  <br>trouble with the term *quality work* is you never know when you've  <br>arrived. I'm content to think if only I had this polished up, then I  <br>could... No. Show people what you have. Ask for their help.  <br>Especially go to people in the old guard. They are usually so  <br>excited to see a new generation of designers they will often  <br>bend over backwards to help you. Type designers are a spry lot... <br> <br>I was shocked at typecon when less than 8 people wanted to  <br>have Akira Kobayashi, Matthew Carter, and John Downer give  <br>them pointers. So what if it's was a public forum? That's what  <br>you're pushing for in the end isn't it? Gopherit! <br> <br>I've heard some say, don't ask for too much advice or you will <br>loose your own voice for everyone elses. I hear that argument, <br>but think it applies mostly to people who already know their way <br>around letters. At first, get as much input as you can from people <br>you can trust (such as those mentioned). <br>  <br>Finally, let me say I only have one font commercially available,  <br>soon to be two. Needless to say, type design makes up a small  <br>part of my income (and take my advice with a grain of salt!). I'm  <br>a graphic designer with one toe in the font world. Hopefully it  <br>will soon be one foot in fonts. Then maybe graphic design can  <br>be the small part of my income. All that to say, don't quit your  <br>day job just yet :-) <br> <br>Keep loving letters! <br>Randy <br> <br>PS. Good grief, what a rag.</p>"
