    date: 2004-09-14T05:35:00
    date_raw: 14 Sep 2004 — 5:35am
    votes: null
    html: "<p><i>I was shocked at typecon when less than 8 people...</i> <br>Shocked was probably too strong a word. I hear you Dan &amp; Hrant. My advice was colored by many great experiences going to established designers. It sounds like on balance, your inquiries have been useful and pleasant. Still, It's likely you'll find a grumpy apple in the lot! <br> <br><i>Be bold! But be careful, too.</i> <br>Uh yeah. Be smart about it. I just know I'm more inclined to say to myself... Yikes, what if he has indigestion right now?? Better hold off and go grab another cup of conference coffee.  <br> <br><i>The main thing I've learned about \"processing\" advice is this: be prepared to filter the advice depending on the context of the source.</i> <br>Sure, be smart about this too. I've gotten alot of advice from Ed Benguiat. He knows letters as well as anyone alive. His taste is, shall we say, a bit retro? Take what you can. For his part, he's really good at saying: That N is wrong. But if wrong is what you want, do it. <br> <br><i>Innovation &amp; theory versus their technical feedback.</i> <br>Well this could be another topic. I would suggest a budding type designer not get too hung up on preserving your innovative or theoretical genius. If that is what floats your boat, fine, write it down so you won't forget, then listen. Looking back at my first fonts, what seemed ground breaking at the time, was really something requiring *technical feedback* </p>"
