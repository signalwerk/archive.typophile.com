  html: |-
    <p>For a third year in a row Punchcut will speak at SXSW Interactive in Austin. SXSW organizers have announced programming for 2010 and confirmed that Punchcut will present our talk <em>Convergence: Already Here, and Gosh It's a Mess!</em>.</p>
    <p>Talk description: Convergence is here and it’s a big mess. People are using services and media within hacked-together ecosystems; systems without neat connections or beautiful symmetries. Punchcut will share the user insights and design principles needed to create applications and services that integrate into emerging digital lifestyles and convergent ecosystems.</p>
    <p>Read the SXSW announcement: <a href="http://bit.ly/8BCAV5" title="http://bit.ly/8BCAV5">http://bit.ly/8BCAV5</a></p>
