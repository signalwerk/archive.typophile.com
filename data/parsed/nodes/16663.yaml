      <p>The designer(s) certainly gave you a lot to look at here!</p>
      <p>I agree with Si, in that I am unsure of the meaning in the leaf. I'm guessing this is something you requested though, as it is in most of the designs. I don't know what it says about your company and the products you produce. Sometimes it seems just tacked on for no reason -- like in #3, 5 and 7.</p>
      <p>Also, in most of these, it is hard to determine the focus. Is the graphic or the company name more important? In nearly all cases the relationship between the graphic element and the text is weak, in my opinion. </p>
      <p>They all feel like they're <em>trying</em> a little too hard. Maybe something simpler -- for example, just a leaf graphic next to the name with no attempt to be clever about it being part of the 'R'.</p>
      <p>Personally, I think the text in #3 is the strongest. None of the graphics strike me as memorable though.</p>
