      <p>I think #1 is a strong mark: It is unique, simple, vaguely evocative of tools and technology, and makes an "R" without having an obvious plain old "R" sitting there. It's the sort of mark that could stay fresh for a long time as your company grows. The type, however, all looks like it was randomly thrown together.</p>
      <p>The problem with these designs is that there are always three different elements competing for your attention: the mark, the word "Rasa," and the word "software." The effect is confusion. Instead, there should be two. That means either (A) eliminating the mark, (B) eliminating the word "software," or (C) making "Rasa Software" into one element, by setting it in one typeface in one size on one line.</p>
      <p>The name of your company makes me think of "tabula rasa," the blank slate. The #1 mark is somewhat suggestive of the corner of a tablet/screen and a stylus. If you're going to try more marks, that may be a concept to explore further.</p>
