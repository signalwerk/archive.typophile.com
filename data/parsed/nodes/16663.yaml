    html: |-
      <p>Many logos are set horizontally, with an icon to the left ot right of the name. I believe this is done more often so the logo can appear larger when (vertical) space on a page is limited. It's also just natural to "read" this way. </p>
      <p>Some companies have both a horizontal standard design, and an alternate "stacked" version for when space is limited in the other direction. This can get confusing though to have different versions of your logo.</p>
      <p>You need to think about how your logo will be used. Which way makes more sense for your Web site, packaging, products, other promo materials?</p>
      <p>Either way is "correct" if it works for you.</p>
