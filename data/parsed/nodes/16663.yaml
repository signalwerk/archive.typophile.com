    html: |-
      <p>I don't know that you want to take the 'brands of the world' web site too seriously. It is no measure of quality in my opinion.</p>
      <p>I didn't really like any of the logos in the PNG. They were all too complicated, and worse without any purpose or reason for that complexity.</p>
      <p>What Lauren Engelhard was saying about logo configuration is correct. There is often a horizontal &amp; a stacked or 'vertical' version too. For instance both Starbucks Coffee, Microsoft do it. The main reason is that the name is long. This doesn't mean that a clever designer can't help you avoid the having two versions especially if you have a short name - but if not it's not a problem if you end up that way.</p>
      <p>I suggest that you simplify the logo to the word 'rasa'. </p>
      <p>You don't need to explain what you do in a logo. That is a common but sophmoric mistake. Beside what you do may well change in the future and a description could undercut your flexibility.</p>
      <p>I suggest a simple but robust type face with no ornamentation </p>
      <p>Try for instance typing RASA here:</p>
      <p><a href="http://www.typography.net/samplers/shires/derbyshire/index.htm" title="http://www.typography.net/samplers/shires/derbyshire/index.htm">http://www.typography.net/samplers/shires/derbyshire/index.htm</a></p>
      <p>If you like it you can buy it here</p>
      <p><a href="http://www.typography.net/type/shires.htm" title="http://www.typography.net/type/shires.htm">http://www.typography.net/type/shires.htm</a></p>
      <p>This idea may very well not be the best one, since I haven't thought about it for too long.  I suggest you listen to Simon Duckworth and simply begin again with a pencil but with one addition. Think carefully about what the logo is mean to do for you. What impact do you want the logo to have on your business? Think of the logo as an employee. What's his job exactly?</p>
