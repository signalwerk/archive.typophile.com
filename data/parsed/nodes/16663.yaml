      <p>I find designing icons difficult - for the simple reason that they have the difficult task of summing up a concept in a very minimal way and communicate this efficiently. It seems from what you've told us that the company's field of work is quite diverse; to this end it would most probably be a strong solution to use a distinctive wordmark approach. I'd lose the leaf as it adds nothing except serving to confuse and pare everything down. Also a good idea would be to ignore the colouring at this stage and get something strong which works in black &amp; white; keeping it strong and simple will let it work down at small sizes (which if you want something to appear on a OSX/WindowsXP desktop icon) will make the transition a lot easier. Think simple, not complex. If you look at most well-known brands, they work very well small, in single colour at their most basic.</p>
      <p>I like the Rasa name, in itself that's a good start. Such a distinctive name should lend itself to a wordmark well.</p>
