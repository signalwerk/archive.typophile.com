      <p>Hi!</p>
      <p>Sorry, I don't understand the relationship between your company and the leaf/feather motif... if you're confused as well, work out the essence of what your company does and use that as a basis for your identity. It might be that a wordmark will suffice or you go down the using-your-company-intial route. I'm afraid nothing's jumping out at me: there seems to be a lot of polish (everything's had the full illustrator treatment with gradients etc.) and not much substance.</p>
      <p>Switch off your Mac, get the pencil &amp; paper out and force yourself to come up with a notebook page of ideas. Then weed out the ones you think are strongest. Then switch the Mac back on!</p>
      <p>Sorry to be critical - it is constructive criticism, I'm not trying to put your work down; I'm really looking forward to seeing new ideas.</p>
      <p>Si</p>
