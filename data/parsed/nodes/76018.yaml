    date_raw: 6.Nov.2010 3.29am
    votes: null
    html: <p>For InDesign, there is <a class="freelinking external" href="http://mathmagic.com/" rel="nofollow">MathMagic</a>, an equation editor compatible with Word and LaTeX. If your original came from Word, InDesign can import its Equation Editor formulas as images –in this case, you may need to reopen some formulas in Equation Editor to edit image size, but it works correctly.</p>
