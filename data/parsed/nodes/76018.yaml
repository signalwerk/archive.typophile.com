  html: |-
    <p>Preparing to layout out a piece in InDesign containing some moderately complex calculations. Beyond glyphs, how does one add all the necessary mathematical notation features? Is anyone familiar with font collections or software particularly suited to this?</p>
    <p>Appreciatively,</p>
    <p>Luca</p>
