    date_raw: 6.Nov.2010 6.57am
    votes: null
    html: <p>Like John, I'd probably import in a PDF, though I'd use LaTeX.  Depending on how many you have, the PDF option (from either LaTeX or Word) is going to the best option.  If you have to set a lot of them, then I'd look at other software that can let you work within InDesign.</p>
