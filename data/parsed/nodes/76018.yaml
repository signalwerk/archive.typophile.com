    html: |-
      <p>There's also an add-on called "InMath" for InDesign/InCopy. I don't think they have a CS5 version as yet, but they do CS2-CS4. (I have no particular knowledge of its merits or failings, and am not endorsing it, just saying I've heard of it.)</p>
