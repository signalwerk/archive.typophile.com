    html: <p>Many common word processors, such as Microsoft Word and Lotus Word Pro, include mathematical formula builders. Since this is an uncommon feature, you may have to change which components of the software package are installed to have access to this feature.</p>
    html_clean: <p>Many common word processors, such as Microsoft Word and Lotus Word Pro, include mathematical formula builders. Since this is an uncommon feature, you may have to change which components of the software package are installed to have access to this feature.</p>
  - id: 438404
    user: 1262
    date: 2010-11-06T00:50:00
    date_raw: 6.Nov.2010 12.50am
    votes: null
    html: <p>I'm not aware of any add-ons that enable one to typeset maths directly in InDesign. What I do is set the Math in MS Word 2007 (for Windows), print or export to a PDF, and then position the PDF as a graphic in InDesign. MS Word 2007 has a built in maths handler and the Cambria Math font that contains maths layout tables.</p>
    html_clean: <p>I'm not aware of any add-ons that enable one to typeset maths directly in InDesign. What I do is set the Math in MS Word 2007 (for Windows), print or export to a PDF, and then position the PDF as a graphic in InDesign. MS Word 2007 has a built in maths handler and the Cambria Math font that contains maths layout tables.</p>
  - id: 438412
