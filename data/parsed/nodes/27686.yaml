    date: 2006-08-16T22:24:00
    date_raw: 16 August 2006 - 10:24pm
    votes: 0
    html: |-
      <p>Hi Mike!</p>
      <p>Thanks for your kind words about Ben and his work and your honest critique of the site. . .</p>
      <p>I agree with you that Bens font work was always original and unique and I felt it was too important to let his collection fo work simply remain abandon and unavailable for purchase or licensing. For me, I am pleased just to be able to help bring it back to the masses among his fans who like yourself so admired the amazing work he created.</p>
      <p>Now regarding the site, even though retro flows through my veins, rest assured a jukebox was NOT even closely inspired when I created the design of the site. Generally jukeboxes are far more colorful, have many moving lights and more whiz-bang elements. The original inspiration was actually an old film projector from the 1930s which has a beautiful textured enamel finish and brushed steel accents. The buttons were inspired by old ivory bakelite plastic. Just to be clear about the aesthetic inspiration . . .</p>
      <p>And generally Nick and Mike you are both correct in your observation that it is a 'darker' site. This primarily was important so the site could do its job well much like the bezel that surrounds a tv tube. Its purpose is to present content, be interesting, but compliment what it is presenting, not be the focus of the presentation. The fonts are the stars of the show and so it was important to present them as the main focus. That aside, it was important to me to be able to present a foundry to end users that could be taken 'seriously' and presented the work professionally I feel something bright and bouncy wouldn't be taken as serious as what we ended up with.</p>
      <p>Beyond that, if you take a blank sheet of paper and sit down to create an online commerce site that retails font software among 12+ individuals/foundries, you start to become overwhelmed with a way to categorize the work, promote the foundries, the designers, and encourage a positive buying experience for the end user. Its alot like starting with a huge pile of books and designing a library where each author gets the same shelf space and everybody who enters can easily find exactly what they're looking quickly and check out hassle free.</p>
      <p>I agree that it isn't a traditional font foundry commerce model but then we're selling professional quality display type which is such eye candy to begin with, most of the audience who appreciates display fonts is getting a very full eyeful very quickly. Dare I say peep show!</p>
      <p>Thanks for the comments though, we do appreciate 'em . . .</p>
      <p>Stuart :D</p>
      <p>PS: To your comment about new fonts from Ben, I beleive there is some unreleased material sitting on a zip disk near Ben's computer I will try to pursuade him to mail to me! Personall, I think if he sees the renewed interest in his work he may start making new fonts from scratch.</p>
    html_clean: |-
