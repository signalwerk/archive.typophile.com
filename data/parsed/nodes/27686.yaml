      <p>Stuart YOU ROCK!!!</p>
      <p>Ben Balvanz is the best type designer in the world and it SO very cool that the Fontalicious marquee is here to stay! If it wasn't for Fontalicious I would have never have started appreciating type the way I do now. (So there! Free fonts are GOOD!!!) Fontalicious is the benchmark in 'cute and funky' that no one has surpassed.</p>
      <p>I wonder though... will Ben be designing new fonts anytime soon or is he just focusing on his t-shirt biz?</p>
      <p>Now for my 2 cents on the site: </p>
      <p>The new site is too dark. I think the background elements need more color- to make the type see a little more dynamic. When I look at Fontdiner the colors and graphics are stimulating and inviting. Does this mean make a themed page for each font/collection? No. What I mean is that the elements surrounding the font images are dull and suck the life out of the fonts. </p>
      <p>And the jukebox theme doesn't fit (for me). The website says nifty 50's but not all the fonts being distributed (or in the future) have that feeling and that (to me) diminishes the capacity to perceive the type designs in end-users context. Another design more slightly more neutral in this regard will allow you to sell anything in the future.</p>
      <p>On the home page the fonts are broken up into two columns. This list visually merges all the designs together and- again- can take away from someone browsing along and spotting the perfect font for their project.</p>
      <p>I know it was mentioned earlier but the ability to sort by foundry/designer is a must. It’s a feature that is expected and it’s a selling point too… you have foundries I have never heard of before.</p>
      <p>I hope you don’t think I’m being a jerk or anything. I just really like the premise behind your new site and I want you to have the most success :-)</p>
      <p>And besides- we need every designer (and their grandmothers) to start buying up Bens fonts so he can make us more new goodies!</p>
      <p>All my best to you on your new venture,</p>
      <p>Mike Diaz</p>
