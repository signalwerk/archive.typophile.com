      <p>Thanks Tiffany! And to clarify, if you want to see all the foundries, simply check out the home page! :D - Each foundry has two featured fonts that appear in random mini showings on the home page and the real cool part is that we developed programming to assure each home page mini showing gets equal face time among our foundries.</p>
      <p>When you sit down to think really hard about the fairest way to share pixel room on the home page among a collective, this seemed like the most logical method. In addition we feel the work speaks of the quality of the foundry and we felt it was as important to present the work as a quality collection rather than a gathering of individuals.</p>
      <p>And thanks Nick for your thoughts on the Selectonic categories. Generally classifying display type by its aesthetic is a subjective judgement so we were more focused on creating simple buckets for each style so that the end user wouldn't be disappointed with the results they were expecing when they clicked on those terms. Overall I'm very pleased with the results of this.</p>
      <p>Too often there is a desire to assign way too many keywords to a specific font design which instead of helping the font by bringing it to the top of every style search ends up dilluting what category it is most powerfully defined as so we decided to be more 'stingy' with the results. I think people appreciate that . . .</p>
      <p>Stuart :D</p>
