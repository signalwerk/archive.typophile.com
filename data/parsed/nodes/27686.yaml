    <p>Hi All!</p>
    <p>As promised, with the news of the <a href="/node/27728" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Bros</a> launch, I thought it was a good time to also discuss the news of the <a href="/node/add/wiki?edit%5Btitle%5D=Fontalicious" title="Create node &quot;Fontalicious&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fontalicious</a> font foundry re-releases.</p>
    <p>Over a year ago I got in touch with <a href="/node/add/wiki?edit%5Btitle%5D=Ben%20Balvanz" title="Create node &quot;Ben Balvanz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ben Balvanz</a> who granted us the exclusive right to distribute his collection. We had the opportunity to work from the original .fog files to digitally remaster and expand all of Ben's original fonts to complete character sets and improved metrics while keeping the original vision of the work as Ben intended it.</p>
    <p>At the launch of the site, we've only remastered and released perhaps 25-30% of the entire collection and are in the process of getting the entire collection again available for sale and licensing.</p>
    <p>Having run the Font Diner for over 10 years, I have learned a lot about distribution and decided it was a good time to take the best of what I know and bring it to bear among some of the most talented font designers online. While my knowledge extends to the design, marketing, and licensing aspects of the company, my founding partner and brother Mike Ibach will be managing the daily operations.</p>
    <p>We're always looking for new display fonts to carry but are selective about what we will feature at the site so this is an open call to all Typophiles to drop an e-mail (stuart at fontbros dot com) and let me know if you'd like to chat further. It has been our goal to favor our designers and teach them about building great quality fonts and the fine art of licensing their work.</p>
    <p>Often times there isn't enough guidance in our industry and rather than just releasing new work into the wild and taking a cut, we'd rather do more to help you grow as a professional type designer.</p>
    <p>Best,<br>
    Stuart :D</p>
