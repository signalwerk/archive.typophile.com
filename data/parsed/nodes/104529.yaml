    <p></p><div class="imageWrap"><img src="http://typophile.com/files/slab-news-480_4081.png"></div><p></p>
    <p><a class="freelinking external" href="http://www.hamiltonwoodtype.com/slab.html" rel="nofollow">HWT Slab</a> features two styles-Antique and Columbian. These two extra bold fonts are classic slab serif wood type styles with one detail of difference. Columbian is an extra bold Clarendon wood type that was manufactured by many of the wood type manufacturers in the late 19th century. "Clarendons" feature bracketed or rounded serif joins whereas "Antique" was a class of typefaces that features squared off slab serifs. Some type designs have only minor differences from others. The Columbian design is essentially identical to Wm. Page &amp; Co.'s "Antique no. 4", with the difference being the bracketed serifs.</p>
    <p>In researching material for the digitization of Columbian, we started with a 15 line font identified as "Columbian" shown in the Angelica Press wood type portfolio (printed in 1976). This font is in fact "Page Antique no. 4". Comparing Antique #4 to Columbian specimens from Hamilton and other manufacturers confirms the only real difference is the serif treatments. Therefore, both fonts are presented as a pair. Each font features a full Western &amp; Central European character set.</p>
    <p>HWT Slab digitized by Tim Martin.</p>
    <p>For more detailed information regarding this release and to learn more about the making of the font, visit the <a class="freelinking external" href="http://www.hamiltonwoodtype.com/slab.html" rel="nofollow">Hamilton Wood Type Foundry</a>  website.</p>
    <p>Special introductory pricing available through July.  </p>
    <p><a class="freelinking external" href="http://www.hamiltonwoodtype.com" rel="nofollow">Hamilton Wood Type Foundry</a></p>
