    html: '<p>I think comparing demand to see a diploma versus a portfolio is misleading, because a client would only ask to see the former if he suspects you of lying*, while he <i>needs</i> to see the "innards" of the latter to figure out what you can do, and if your specific skills and talents are compatible with what he needs. So a better question would be: What proportion of clients ask you about your formal education (or check it out on your resume)? <br> <br>* And is furthermore willing to reveal that. <br> <br>hhp</p>'
