    html: <p>Galin, <br> <br>I believe that you're asking if it's worth your money for an online course or if you should keep saving. <br> <br>I don't know about this particular online school, but my caution is how much more are you going to get from an online course that you can't get from a book? Other than critiques, what more are they offering you? I'd write them a letter and ask just how much more you'll benefit. Also, ask for their credentials. <br> <br>You might also try finding a number for a professor at any design school, explain your position, and ask him/her what they think. My experience is that people are very helpful. And often, they might suggest another alternative of which you are not yet aware. <br> <br>Good luck.</p>
