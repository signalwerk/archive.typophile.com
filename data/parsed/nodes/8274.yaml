    html: <p>Post graduate work is becoming more important in the U. S. and is considered mandatory if you want to teach, but beyond that portfolio is still the thing that gets you work. As for online educaiton, I may be prejudiced, but I think in person works much better. It's vastly easier and more productive to work in person with a teacher and with others. Seeing what others are doing in response to similar design problems and getting feedback from different people is very important. I'd say, keep saving your money for a real school. <br>George</p>
