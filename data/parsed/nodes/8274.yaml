  html: "<p>Dear, typophiles!  <br> <br>I am writing this letter, because recently I found \"<a href=\"http://www.sessions.edu\" target=\"_blank\">www.sessions.edu</a>\". As you know my origin is bulgarian and thus I am unable to afford a substantial tuition in the field of graphic design. Currently I am designing and accumulating money in order to invest in my future education.  <br>This thread is simply for some feedback about the \"Graphic Design Master's Certificate\" found at \"<a href=\"http://www.sessions.edu/program/graphic_design/masters.html\" target=\"_blank\">http://www.sessions.edu/program/graphic_design/masters.html</a>\".  <br>My main concern is : \"Does it worth it?\";\"Would the certificate be valued by employers?  <br>In general, please comment on this specific master's program for graphic design.  <br> <br>All your words will be highly appreciated.  <br> <br>Sincerely,  <br>Galin K.</p>"
  html_clean: "<p>Dear, typophiles!  <br> <br>I am writing this letter, because recently I found \"<a href=\"http://www.sessions.edu\" target=\"_blank\" class=\"link-external\">www.sessions.edu</a>\". As you know my origin is bulgarian and thus I am unable to afford a substantial tuition in the field of graphic design. Currently I am designing and accumulating money in order to invest in my future education.  <br>This thread is simply for some feedback about the \"Graphic Design Master's Certificate\" found at \"<a href=\"http://www.sessions.edu/program/graphic_design/masters.html\" target=\"_blank\" class=\"link-external\">http://www.sessions.edu/program/graphic_design/masters.html</a>\".  <br>My main concern is : \"Does it worth it?\";\"Would the certificate be valued by employers?  <br>In general, please comment on this specific master's program for graphic design.  <br> <br>All your words will be highly appreciated.  <br> <br>Sincerely,  <br>Galin K.</p>"
