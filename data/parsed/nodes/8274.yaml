    html: <p>My comments might not be up-to-date from a student�s point of view, but I consider myself currently involved with both the design and education �industries�. When at university, my instructors emphasized that one�s portfolio is much more important than one�s diploma. The same notion is emphasized at the school with which I am presently affiliated. And, perhaps less importantly, no employer nor client has ever asked to see my diploma, while my portfolio is frequently of value. <br> <br>cheers, <br>Dana</p>
