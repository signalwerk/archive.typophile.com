    html: <p>Galin, <br>Everything that Dana said is absolutely true.  No one ever asked to see any of my diplomas.  The questions then becomes, what will the school teach me that will help me create a good portfolio to get a job; what will the school teach me to help me actually do my job (and therefore keep my job); and what will it teach me so that I can further teach myself throughout my life to grow.  Think of school as a swimmers racing dive.  Any dive (or school) will get you wet; a better dive (school) will move you further along and allow you to keep pace with the competition; the better racing dive and design school will launch you into the lead.  This supposes you have the talent, drive, and willingness to work hard enough to take advantage of what the school has to offer.  A school will maximize who you are from what you bring to it. If you are water, it can make you clear and refreshing.  If you are wine, it can make you robust and appealing.  However, no school can change water into wine. <br> <br>ChrisL</p>
