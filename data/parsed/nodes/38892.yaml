      <p>I will revise the project description to say “lettering” or something in that vein.</p>
      <p>Linda, I have absolutely no idea why you’re disappointed or confused by the project. There is no reason to be. You’re welcome to contact me via email with your questions. I’ll be at the next Calgary meeting as well.</p>
      <p>* * * * </p>
      <p>This is a fun project where we can all express and explore our love of letters through photography. The notion of documenting a city block was to make this a specific activity: take your camera into your immediate surroundings and see what you can find. Even in seemingly the most mundane surroundings, if you look, you can find the beauty. Garbage in the street, a bus token floating in a puddle, an emotional handmade plea to find a lost pet... or perhaps you find a stately plaque on a historical building, decaying hand-painted shop signs or beautifully designed modern signage. Each person’s “type block” will be different.</p>
      <p>* * * *</p>
