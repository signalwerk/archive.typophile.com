      <p>Some more nerdy nitpicking:<br>
      To me, ‘text’ is related to ‘textile’, ‘texture’ – see also <a href="/wiki/Textura" class="wiki">Textura</a>.<br>
      A single letter, even a single word (no matter if lettered, written or typed) can hardly be called a text, at least in German and imho.</p>
      <p>And for the differentiation; <a href="/wiki/Gerrit%252BNoordzij" class="wiki">Gerrit Noordzij</a>’s definition is that <cite>typography is writing with prefabricated letters</cite>.</p>
      <p>By the way, have you seen <a href="http://www.flickr.com/photos/marcwathieu/sets/72157601299541354/">this robot</a>, <cite>silently writing a version of the Martin Luther bible, which was originally printed in a early font called ‘Schwabacher’, retranslated here by RobotLab into calligraphy</cite>?<br>
      Ricardo has <a href="http://www.typophile.com/node/38899">posted a link, too</a>.</p>
