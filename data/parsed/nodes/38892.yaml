    html: |-
      <p>Type is mechanically repeatable, modular systems of letters meant to be combined infinitely.</p>
      <p>Lettering is any letterforms made by hand. Lettering as an umbrella term could include:<br>
      Calligraphy (defined as “beautiful writing)<br>
      penmanship<br>
      handwriting<br>
      signpainting<br>
      lettercarving<br>
      brush lettering</p>
      <p>but not type, or typography. Typography involves type; see above. Type is modular, lettering is handmade; one of a kind. You can reproduce lettering (screenprinted shirts, hotel logos), but it’s still lettering, not typography. Type can be used with lettering, and both involve the alphabet and writing, but they still are not the same. It’s like the difference between studio pottery and production ware, or custom/retail, or couture/rack. Handmade versus mechanical. Type gets designed by hand (sometimes), but then becomes mechanical when it’s made into type.</p>
      <p>I do think the distinction is meaningful and important for designers to acknowledge; hand skills are dying out, and people are becoming oblivious to the way things get made. Everything is not photoshop, assemblage, appropriation and “homage”. Some people create things directly with their hands.</p>
