      <p>I’m really disappointed by the direction this thread has taken; it really hasn’t been much fun or inviting, this being my first (and possibly last) posting in Typophile. Maybe I don’t have a thick enough skin for forums. </p>
      <p>Since a large portion of this thread has been about vocabulary, I will state that I take offense to the juvenile comments of referring to people as “snottier-than-thou” and references to people being “anti-social”. I am trying to produce a professional project here. If you want to discuss the Type Block project, that’s fine. If you want to name-call and insult, start your own thread. Almost anyone reading this thread would likely agree with me. </p>
      <p>I did not “brag about making money”, Linda. What a rude thing to post for all to see. If you can figure out how to make money with this project, let me know, it would certainly be most welcome to hear. </p>
      <p>This project is not a contest. There is no fee for people to participate. People choose to join or not and our intentions are clearly stated on the Flickr group. My gallery will cover the cost of printing and displaying the chosen images. The exhibition is part of a Banff-Calgary photography festival that is free to the public during the month of February. We haven’t decided if the works will be for sale, and if they are, the prices will be determined by the artist with a small portion going to the gallery to recoup the printing and display costs.</p>
      <p>The publication is a way of commemorating the project and will be a book published via Blurb or another print-on-demand source. Participants and the general public who are interested can order the book online and we’ll have a few in the gallery that month. That’s it. This definitely falls into the “labour of love” category.</p>
      <p>So if you share a love for this project, we’d love to have you onboard and I’ll see you on Flickr. It’s a much friendlier place.</p>
