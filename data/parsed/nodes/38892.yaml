      <p>I’m just so utterly thrilled that you are concerned with my health, Nicky. As far too many people will confirm, I have gone through infinite boxes of tissues with a cold this week.  </p>
      <p><em>I would recommend not photographing any type/lettering on federal buildings, FWIW.</em></p>
      <p>It was an unnamed resto of pasta, at 9:30 a.m. on a Wednesday, and a male person with an accent and an IQ under 80. One must wonder....</p>
      <p><em>Linda, I have absolutely no idea why you’re disappointed or confused by the project. There is no reason to be.</em></p>
      <p>Um, well, let’s see. It was supposed to be a small, volunteer local project that Calgary Typos would do for fun. It’s now your own personal commercial project (and that you bragged about making money with at the last meeting), posted in public in an international forum, and there is no stated remuneration for people who submit photographs. (There is remuneration for anyone who wins the contest, right?)</p>
      <p>Gosh, I can’t think of any reason that I (or the other members who thought this was a volunteer project to promote type in Calgary) would be disapponted or confused.</p>
