    <p></p><div class="imageWrap"><img src="/files/typeblockblog_6433.jpg"></div><p></p>
    <p>TYPE BLOCK: photography + typography<br>
    an UPPERCASE project</p>
    <p>International artists are invited to explore typography in their surroundings by documenting what they see within one city block of where they live or work.</p>
    <p>Participants can post their images in a Flickr pool for the online exhibition. UPPERCASE gallery owner, Janine Vangool, and photographer Kirstie Tweed (Orange Girl Photographs) will curate from these images to create a physical exhibition and companion book. The exhibition will be part of Exposure, the Banff-Calgary Month of Photography (February 2008).</p>
    <p><a href="http://www.flickr.com/groups/typeblock/" title="http://www.flickr.com/groups/typeblock/">http://www.flickr.com/groups/typeblock/</a><br>
    <a href="http://www.uppercasegallery.ca" title="http://www.uppercasegallery.ca">http://www.uppercasegallery.ca</a></p>
