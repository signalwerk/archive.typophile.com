      <p>Try running North vertically then East stacked on Ender just to the right. That could make a nice tidy little mark. Use all cap sans serif. Never sacrifice aesthetics for concept. That's what you are doing with the idea of mixing typefaces to speak of the diversity. Not saying you couldn't achieve both aesthetic and concept, but right now in your pursuit of this concept, you haven't acheived an acceptable aesthetic.</p>
      <p>Something beautiful and something ugly almost always works.</p>
