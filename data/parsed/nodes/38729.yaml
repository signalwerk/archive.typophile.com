      <p>"I wanted to use varying typeface to represent the diversity of the area being covered."</p>
      <p>With all due respect, I strongly disagree with that.  Simple is better.  Try a strong slab serif and see how that feels before you go setting three different kinds of type into one or two words.  You can have two faces that compliment each other, but it's not the first place you should look, IMHO.</p>
