      <p><cite>Not sure about any of it really.</cite></p>
      <p>Neither am I. None of these have a very strong concept, and they seem arbitrary and random at best.</p>
      <p><cite>I wanted to use varying typeface to represent the diversity of the area being covered.</cite></p>
      <p>I don't think this is a good idea. Maybe try using different weights of the same typeface. I'd go with a sans serif.</p>
      <p><cite>Don’t know if I want to spend the time developing a icon to go with it, as nothing comes to mind really.</cite></p>
      <p>It might be worth it, since these are all quite bland and uninteresting. A simple mark would help you out.</p>
      <p><cite>Also the spelling of the word... Northeastender, North East Ender, North-East Ender, Northeast Ender??</cite></p>
      <p>Talk to your client about this one. They'll probably know better than us :-)</p>
      <p> - Lex</p>
