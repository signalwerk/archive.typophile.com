      <p>hi again + thanks for taking the time -</p>
      <p>i agree - there probably are better and faster ways (more calculable, so to speak) to make a living than by designing type. a newcomer would need a big “hit” (or two) indeed and get lucky to financially gain a serious outcome -</p>
      <p>i also think the parabola analogy is quiete good, it seems comparable to the ’fact’ that most of the time 5-15% percent of ones clients are responsible for 70-85% of ones profit.</p>
      <p>let me be clear, i am not thinking about the actual profits here, nor the possibility of getting really rich in type design.</p>
      <p>it is just the (approximate) numbers i am wondering about (i know, from there one could estimate the profit as well), e.g. the ’starlets’ section at myfonts (mediocre example), some of the better known fonts at veer.. a really interesting brush type, script type, display font, et cetera..</p>
      <p>kind regards</p>
