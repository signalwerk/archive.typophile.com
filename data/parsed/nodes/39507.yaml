    html: <p>Just like fashion, those who license typefaces are a fickle bunch. Trends rule the day and staying fresh and original makes using the same typeface in the same market very undesirable. You have to be able to sell an idea to a client which sets them apart from the crowd. Very few “smart” clients ask to look like their competitors. I’m not sure you’ll be able to get a straight answer because many foundries offer such a variety and cross-section.</p>
