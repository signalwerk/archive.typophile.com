    <p>hi there,</p>
    <p>first of all, i do not intent to start a huge discussion here -<br>
    i think i can understand why the numbers are actually nonpublic and kept hidden.</p>
    <p>i might be supposed to say, i tried to bring some light into this (for myself ) the last couple of days, read some discussions here at typophile and some other places, did a search on sales, contacted some folks at myfonts, etc.</p>
    <p>anyway, it’s just something i am interested in and i am still a bit curious - </p>
    <p>i wondered if it would be ok to ask what some of you might think, e.g. about how often a font (approximately) sells.. i am not talking about classics here, rather about the younger type design results from the last couple of years..</p>
    <p>are those a couple of hundreds or rather close to a thousand, or more.. ?</p>
    <p>i can imagine that different aspects will play a keyrole in the answer, e.g.</p>
    <p>- how interesting the original idea for the type is<br>
    - how well the type is drawn and/or digitized<br>
    - how many people actually know the final font exists (marketing)<br>
    - how well the font suits a certain contemporary need<br>
    - display and script fonts vs. text font</p>
    <p>et cetera -</p>
    <p>anyway, i was just wondering,<br>
    i hope its not the kind of question the majority will be offended by -</p>
    <p>best to all of you!</p>
