    html: |-
      <p>What’s most interesting to me is that if you line up the fonts in the Adobe Type Library by sales rank, and chart the sales, the graph looks like a parabola. A font at the median sells just a tiny fraction of what any of the top 10 sells, and the difference between number one and number ten is also huge.</p>
      <p>What this means is that if you’re reliant on sales (as opposed to doing work on commission), you’re probably also pretty reliant on getting “lucky” with one or two big “hits.” Kind of like the movie or music recording industries, perhaps?</p>
      <p>Regards,</p>
      <p>T</p>
