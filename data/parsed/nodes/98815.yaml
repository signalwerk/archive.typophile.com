  html: |-
    <p>Macula can be described as the ‘impossible typeface’, since its design is based on the concept of impossible objects. This optical illusion was explored into great detail in the 1930’s by the Swedish artist Oscar Reutersvärd, and simultaneously made very famous by Dutch artist M.C. Escher.</p>
    <p>Macula comes in five styles, some are great to use just by themselves and some are specifically meant for use in layers. By stacking different styles of Macula on top of each other, beautiful multi-coloured typography becomes possible.</p>
    <p>Every character in Macula has been designed in two versions, and to enhance typographic liveliness these two versions are alternated automatically by OpenType features.</p>
    <p>In addition, stylistic alternates for A, E, N and O are included. These will probably please all you hipsters out there! ;)</p>
    <p>To celebrate the launch of Macula we are offering a special price of 35 Euros per font until the end of December!</p>
    <p>More details: <a href="http://www.boldmonday.com/en/macula/" title="http://www.boldmonday.com/en/macula/">http://www.boldmonday.com/en/macula/</a></p>
    <p>Have a very nice day,<br>
    The Bold Monday team<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/macula_1_6232.png"></div><p></p>
