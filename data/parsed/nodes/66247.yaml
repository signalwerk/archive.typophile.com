    html: |-
      <p>Hi, Mike-</p>
      <p>You are right that there are plenty of casual hand-drawn style fonts, and they are – in most parts – very good. But with Suomi Hand it is hand-writing in a single style, with all points in all glyphs hand drawn into place to keep the scale. I used no auto-tracing, and I never scanned anything, just had samples of the text next to me while drawing the glyphs.</p>
