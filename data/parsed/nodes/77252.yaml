      <p>One of my favourite ads to feature an ambigram was from brake line manufacturers Hel Performance. Most ads in bike mags feature either plastic 'crotch-rockets' or scantily-clad women. This one broke the mould and credited us with intelligence and typographical sophistication in one! The advertisement featured a beautifully crafted ambigram that reads DEVIL and ANGEL depending on which way up the page is held. The ad requires the user to actually turn the mag upside down to read the second half of the copy. </p>
      <p>I don't know how to post images but you can see it here: </p>
      <p>(Visit the link below and choose "Ambigram 08/09" "Ambigram - Motorcycle")<br>
      <a href="http://helperformance.com/media/advertising.php#" title="http://helperformance.com/media/advertising.php#">http://helperformance.com/media/advertising.php#</a></p>
