    <p>I'm new to creating actual fonts and I've been fighting hard with a design I'm working on. Our youth  ministries are named "Upsidedown youth ministries" and I'm creating a logo for our youth services which are called "invert." I want the logo to be a vertical ambigram that can be read upsidedown. </p>
    <p>I've got the design that I've spent a bit of time in the problem is that the letters don't seem to all give the same feeling so I'm needing some suggestions. Tear it to pieces please, but remember, it has to be able to be read upsidedown exactly the same.</p>
    <p>Thanks much!<br>
    R</p>
