    html: <p>I'm starting to see INHERIT in the newer versions. I think you should forget the ambigram and do something bold and clearly readable. INVERT in a bold sans with perhaps the N or R reversed. There might be some inspiration in this thread <a class="freelinking external" href="http://typophile.com/node/77215" rel="nofollow">http://typophile.com/node/77215</a>. Establish the visual identity this way and keep your ambigrams on the back burner to use as a one-off for an appropriate situation.</p>
