      <p>I'm afraid it looks rather devilish to me! It immediately reminded me of these John Connolly book jackets.</p><div class="imageWrap"><img src="http://typophile.com/files/gates_3693.png"></div><div class="imageWrap"><img src="http://typophile.com/files/nocturnes_4553.png"></div><p></p>
      <p>I'm not really a big fan of ambigrams unless they manage to avoid that typical goth/metal look that the distortion of letter forms tends to push them into. I think this would be lot better if you tried a much cleaner, geometric, monoline look. If you just want to adjust your current design I would remove the arrows and shorten the left stem of N which when mirrored on the R will help that to read better. At the moment it looks more like "Invent".</p>
