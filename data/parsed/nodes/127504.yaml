    html: |-
      <p>If I see some Egyptian or slab serif on the page, I know I'm being lied to. If I see text set in Palatino, I know they lack imagination (use Aldus Roman!). I am reading a book set in Goudy Old Style; it looks too thin and weak. </p>
      <p>I use Aldus Roman, Palatino 1950 (not current styles), Trajanus, Lydian, and occasionally Optima. Sabon isn't bad. I would never set text in sans-serif of any description.</p>
