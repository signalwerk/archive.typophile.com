    html: "<p>Lots of questions come in my mind when I've to choose a typeface. I would say this: What kind of projetc? Long reading or short folder? Poster or book? Is there all the accented letters in the font? Is there a lot of weights from light to Ultra for instance? What kind of readers will have? After, I choose in my short list the one who reach the most my target.</p>"
