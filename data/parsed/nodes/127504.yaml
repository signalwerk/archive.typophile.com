    html: |-
      <p>You can view paragraphs of text in Fontexplorer. Select the font or fonts (if the're non consecutive hold 'command' key as you select) then hit command I (that's i for info), click on the 'detailed preview' pane and double click anywhere inside that window. there you will see dummy text choices one of which is 'A horse's tale' by Mark Twain. But you can also 'roll your own' by choosing custom and cutting and pasting from whatever source you wish.<br>
      HTH<br>
      Les</p>
