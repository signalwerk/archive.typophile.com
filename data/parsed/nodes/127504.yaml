  html: |-
    <p>Im curious to know what everyones process is for selecting and finding a font for a particular project.</p>
    <p>Do you use a particular font management tool or browse font foundries, a website? I ask because when I feel a project needs a particular style of font, something unique, and something doesn't come to mind straight away, I tend to fall back on Font Explorer X first, which is time consuming, and I cant seem to view paragraphs of text on that (if someone knows if this is possible please let me know), I then bring fonts in InDesign and reference with a possible other fonts and combinations. When one doesnt come to mind early on, and theres alot of fonts to get through, it can be a daunting process.</p>
    <p>An example lets say might be the recent Pentagram design for Garden Museum (<a href="https://fontsinuse.com/uses/19122/garden-museum">https://fontsinuse.com/uses/19122/garden-museum</a>), two beautifully matched fonts, I think, that you probably wouldn't use day to day (Amira and Humanist 970), so finding them would be all the more difficult unless of course you've had them on standby. </p>
    <p>Id just be curious to know the process some of you have?</p>
    <p>Thanks</p>
