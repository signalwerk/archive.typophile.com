  html: <p>Someone once remarked that the craft of typography has been going downhill ever since it was created.  The most recent threat seems to come from grafitti - which has now become mainstream rather than marginal - and grunge, hand scribbled fonts that some designers seem to prize for their spontaneity.  When did the rot set in?  With the introduction of Comic Sans or that potato cut font used by Sainsburys (the UK grocery chain) to give itself street credibility?  Does it matter?  Does anyone care?  As a type designer who sprends hundreds of hours meticulously honing my productions (and hundreds more meticulously kerning them!) I'm beginning to lose faith in the integrity of the profession.  Is there anyone out there with me on this?</p>
