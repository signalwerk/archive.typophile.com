    html: |-
      <p>Can be wrong but looks like a custom job. It's either a sans with some serifs added or a serif with some serifs removed. If I have to reproduce it and even if it sounds lazy, I'd start with Helvetica Neue Bold (/Y, /H and /O look not so far), simply add some serifs manually (they look like to be geometric, simple triangles) and  make /W central flat vertex pointy.<br>
      Same vein but "all" serif: <a class="freelinking external" href="http://www.myfonts.com/fonts/tailspinstudio/alph-dog/" rel="nofollow">AlphDog</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/hensler2.php" rel="nofollow">Hensler 2</a></p>
