      <p>I like #5 best. I really don't like the icons in numbers 1--4; they frankly look amateurish (although I'm not especially one to talk). The reference to Mendel in 1 and 2 is a nice idea, but it definitely didn't become clear to me until I read your description -- and I'm a big bio guy. #5, with the two different typefaces, is the most interesting by far. The leaf in the A is a very nice touch.</p>
      <p>What you really need to do is keep on making lots of attempts with many variations to hone in on what works. Two things I've thought of: First, try using both a geometric sans-serif, like Futura, Avenir, or Nobel, and an oldstyle serif like Adobe Jenson or Centaur to suggest a contrast between math and bio. I'm not sure whether I'd suggest putting "MATH" in the geometric sans or the serif. Second, maybe you could do something to correspond to the leaf in the A: placing a slash through the O in "BIO" to make it into a null sign, making the B into an infinity sign. You could also try moving the leaf from the A into the B.</p>
