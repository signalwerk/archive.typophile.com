      <p>I like both of your new ones. That's what I'm talking about -- making an icon that will be immediately associate with your department. I think you need to keep trying, though, to make it clearer and more aesthetically pleasing, although both are very well executed. In both, even though I'm taking Calc right now, I didn't immediately read the integral sign, although that doesn't mean that you need to fix it drastically. Maybe you could change the integral sign to a font that has rounded terminals to make it a little more obvious? But I do like that the current integral sign has a stemlike feel to it. Also, I didn't see the leaf immediately in the second one, but I agree with Chris that it might not reproduce as well. Keep trying different arrangements -- I think it's a good enough idea to keep pursuing.</p>
      <p>Other quick logo ideas: sigma as a butterfly, sigma as the veins of a leaf, infinity as a butterfly, something with a square root sign.</p>
