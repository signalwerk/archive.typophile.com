      <p>Examine the structure of a cauliflower, preferrably a green variety (e.g.: romanesca, broccoflower). That should give you some ideas on visually relating math to biological systems. Pinecones are worth looking at too, and snail shells. </p>
      <p>Many objects in nature exhibit patterns which can be expressed mathematically. I'd guess there would at least be a chapter on such things in the courses you're designing this logo for. Look to these objects for shapes to inspire your logo.</p>
