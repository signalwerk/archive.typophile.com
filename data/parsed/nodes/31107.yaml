      <p>Thanks again for the additional comments. I'll think about the "Truman" being more pronounced. This logo would mainly be used on the program web page, on posters and in presentations. In the last two contexts, standard practice seems to be to place the logos of all the sponsoring organizations, and often the official Truman logo is on the same page as this one. It might be nice not<br>
      to have to do that, however.</p>
      <p><cite>I’d really like to see “MATH” in one of the geometric sans-serifs I suggested (Futura, Nobel, Avenir).</cite></p>
      <p>I just have to defend myself a little bit here--MATH is in Univers (Bitstream Zurich, really) not Helvetica in these samples. Still a common typeface, however. I'd love to try some of the others, and I think I do have a version of Futura to try. Having said that, I do have a thing for the Univers Condensed/Garamond pairing when I've seen it in other places.</p>
      <p><cite>you may want to go for a more uniform feeling to it</cite></p>
      <p>The first pairing I tried was between Univers and Minion Condensed, and in that case, i did like the pairing that made the weights most uniform. However, when I tried using Garamond as the serif, it was a conscious decision (good or bad) to go with the lighter weight--bold Garamond just doesn't look that good to me.  I liked the contrast with the lighter weight serif, but if the contrast isn't strong enough to convice the viewer that it was done on purpose, that's also a bad thing.</p>
      <p><cite>DNA made of something math-y could be cool </cite></p>
      <p>I really would like to find some nice graphical idea for a logo. My first idea was dna inside an infinity sign, but unfortunately, <a href="http://www.mbi.osu.edu/" rel="nofollow">that one's taken</a>. Our publications office suggested +'s and -'s as the strands of the DNA, but that runs up against the problem that mathematicians don't associate + and - with real mathematics (snobs, all of us). It was a good idea in other ways, but we couldn't quite think<br>
      about how it would work. I still have it in the back of my mind for when inspiration strikes.</p>
      <p>These comments have spurred me to try a couple more quick ideas (comments below so as not to bias first reactions):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_graphical_4939.png"></div><p></p>
      <p>It's an integral sign as the stem of a leaf (in the worst case scenario, you weren't able to get that from the image). I like the second. Either worth pursuing?</p>
      <p>Thanks again for providing a sounding board.</p>
      <p>Scott</p>
