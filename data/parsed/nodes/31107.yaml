      <p>I'm pretty impressed; your logos are looking quite nice to me. Frankly, the feeling I get from them is not ultra-professional; they feel like they were done for a small company or university department, which of course they were. If you want to avoid that feeling, the three things that contribute to it are having the logo be a wordmark (instead of symbolic), using the caption ("Truman Mathematical ..."), and using Helvetica for "MATH."</p>
      <p>My favorite is the fourth try on the right; I really like waht you did with the O -- obviously mathematical. To increase the mathematical sense, I'd really like to see "MATH" in one of the geometric sans-serifs I suggested (Futura, Nobel, Avenir). One thing to be concerned about is the "color" of your logo -- try squinting at your proposals. You'll see that all but the first and fourth on the left and the first on the right are darker on the left than on the right. This may be a good thing, but you may want to go for a more uniform feeling to it.</p>
      <p>If you want to go an entirely different direction, you could go for a purely graphic logo (no type). Off the top of my head, maybe combining biological and mathematical symbols? DNA made of something math-y could be cool -- maybe something along those lines. Good luck -- keep posting.</p>
