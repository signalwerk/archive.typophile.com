    <p>Hi, All.</p>
    <p>I'm one of those people who usually just lurks, but I'm hoping to get some feedback on some logo ideas for a Mathematical Biology program. Do _any_ of these seem like directions worth pursuing, and if so, are there any improvements that might make them better? Since I'm a mathematician, not an artist, by trade, my guiding principle has been to keep things pretty simple. I'm also trying to come up with something that harmonizes well with the logo of another undergraduate research program on campus (the last image below). I don't mind general or nitpicking advice--I read those comments on other threads with interest--but keep in mind that all of these are in rough form.</p>
    <p>Try 1:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/logo2_5843.png"></div><p></p>
    <p>Try 2:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/logo3_5548.png"></div><p></p>
    <p>Try 3:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/logo15_6592.png"></div><p></p>
    <p>Try 4:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/logo16_4282.png"></div><p></p>
    <p>Try 5:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/logo20_3729.png"></div><p></p>
    <p>The "Science Technology Engineering Mathematics Talent Expansion Program" logo:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/logo21_3437.png"></div><p></p>
    <p>Some notes on each:<br>
    Try 1 and Try 2: The four colored circles are meant to refer to Mendel's experiments cross-breeding green and gold pea plants. I thought it was a somewhat clever idea, but none of the biologists immediately recognized the reference. I also see "John Deere" in the color scheme.</p>
    <p>Try 3:<br>
    The iconic graphics are meant to tie in to the STEP logo at bottom. Do they work? I can't tell anymore.</p>
    <p>Try 4:<br>
    "BIO" didn't seem to stand out enough in black and white without some help.</p>
    <p>Try 5:<br>
    Another attempt to make "BIO" stand out. I like the inset leaf in the A well enough, but couldn't find any corresponding representation of mathematics that fit the letterforms. Finally decided I shouldn't try. If this one is worth pursuing, any suggestions for the BIO typeface? I chose one I had, but it doesn't quite fit my mental picture and doesn't seem to harmonize with the leaf image.</p>
    <p>Thanks for any help you can give to someone with great interest, but not necessarily great skill!</p>
    <p>Scott</p>
