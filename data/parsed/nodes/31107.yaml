      <p>Thanks for the feedback so far. My original reply seems to have been eaten, so I'm posting it again:</p>
      <p>I used to be the graduate student to whom amateurs with "proof" of impossible mathematical facts were sent. The "start working in black and white" advice sounds a little like the suggestions I'd make to someone who didn't quite know the basics they needed to know--good advice nonetheless. The big problem I've had is finding any imagery evocative of mathematics that's simultaneously recognizable to many people, still appealing to a mathematician, and simple enough for this purpose. I've made even more attempts that would fall into jpad's "too complex" category.</p>
      <p>I tend to like the last option in the original list better than the others, although I've been staring at all of them long enough that I don't know if I like any of them any more.</p>
      <p>auricfuzz, thanks for the suggestions.  I've posted a few variants on the last design below. I varied the typeface, the weight, leaf placement, and some decorations in the O.  I can't say that any of these are a good final try, but they illustrate the different elements. I couldn't figure out how to make an infinity sign into B without making it look like an 8.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_variations_5628.png"></div><p></p>
      <p>I tend to like the third try in the right column the best, but I'd be especially interested if either of the last two on the right have promise.  After looking for any additional comments, I'll probably give it some time to sink in, reviving the thread if I have anything new or better to post.</p>
      <p>bojev, it's always a pleasure to find Truman alumni where I'm not expecting it.</p>
      <p>Scott Thatcher</p>
