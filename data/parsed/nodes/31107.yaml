      <p>is MATHBIO a logo or the name of the group ?  do people commonly say that ?<br>
      if not, it may be another unecessary invention, more confusing than a logo.</p>
      <p>if so, i prefer your original #4 with no icons, just the type.<br>
      i like being able to derive a unique feeling from MATH and BIO without using different fonts - just variations on the delivery of one font. clean, serious, precise. (see * below).<br>
      i'd even open up the BIO slightly using even thinner lines.</p>
      <p>in general it seems there were too many competing motifs: icons, pos/neg reversals, font play, &amp; combinations of those. keep it simple, and allow it to work in black &amp; white. </p>
      <p>as for your latest two, the more solid leaf will print better in small applications, and the general simplicity is an improvement. perhaps there's a mathematical figure/symbol you could directly combine with an organic/leaf  motif ?</p>
      <p>if i had this assignment i'd need to know more about what mathematical biology really is... is it more about statistics, or math, or biology ? theoretical or laboratory emphasis ? </p>
      <p>* another question i'd ask is: what is the image you want to project ?<br>
      clean precise hard science, friendly academic commeraderie, educational vanguard, etc ?</p>
