    <p>I recently started designing a typeface that I am really excited about. This is where it started:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/simplify_5694.gif"></div><p></p>
    <p>While it looks like a script, its really more of a sans serif. I don’t want cursive or italic forms (like s, one storey a, f and so on), rather I want a relaxed sans typeface that is interconnected. I know this will take some serious work, but I am up for it.</p>
    <p>Please give feedback and let me know your thoughts.</p>
    <p>Thanks!</p>
    <p>Evan MacDonald<br>
    <a href="http://evanmade.com" target="_blank" rel="nofollow">evanmade.com</a></p>
