      <p>As far as readability goes, I think the i might be problematic. Next to the s, it kind of looks like a t, and next to the l, it looks like a lowercase b.</p>
      <p>Of course, I'm assuming that the word in the graphic is "simplify" and not "stmpbfy"</p>
