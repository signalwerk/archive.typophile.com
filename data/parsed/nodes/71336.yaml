      <p>In Mac applications that use the native system font rendering (through ATSUI or CoreText) on Mac OS X 10.4, contextual alternate features don't work. In 10.5 and 10.6, they "sort of" work but more complex contextual substitutions perform incorrectly. But a simple one like yours should work. </p>
      <p>I propose a better solution: </p>
      <p><code>feature liga {<br>
        lookup liga_contextual {<br>
        sub f' f by f.low;<br>
        sub f' [b h i igrave j k l] by f.medium;<br>
        sub f' icircumflex by f.short;<br>
        sub f' idieresis by f.shortest;<br>
        } liga_contextual;<br>
        lookup liga_Th {<br>
        sub T h by T_h;<br>
        } liga_Th;<br>
        lookup liga_fifl {<br>
        sub f i by f_i;<br>
        sub f l by f_l;<br>
        } liga_fifl;<br>
      } liga;</code></p>
      <p>The first lookup will work whenever contextual substitutions are supported (so it won't work in Mac OS X 10.4 or some other environments where contextual OTL rules are not processed).<br>
      The second lookup will always work because it's a simple substitution.<br>
      The third lookup will only be activated if the first lookup did not get processed, so it'll work in Mac OS X 10.4, or in situations when contextual substitutions don't work for some reason. If the first lookup worked, the third will be omitted (because the "f" glyph has been replaced by "f.medium" by the time the third lookup gets processed, so the third lookup won't have any input to process).</p>
