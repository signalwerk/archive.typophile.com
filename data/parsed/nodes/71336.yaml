      <p>I haven't come across any problems doing this kind of thing.<br>
      Technically it's not a ligature, more of a contextual alternate, but so what.<br>
      Some foundries make these extra ligatures discretionary (dlig), but IMO liga is best, on by dfault.<br>
      You can neaten up the code by putting glyphs in brackets into a class -- this may help you manage kerning situations with capitals such as T.</p>
      <p><em>sub T' h' by Th;</em></p>
      <p>That's an Adobe trope.</p>
