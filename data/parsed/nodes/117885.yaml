      <p>Saya Semi Sans Medium or Bold is fairly close <a href="http://www.myfonts.com/fonts/fontyou/saya-semisans-fy/" title="http://www.myfonts.com/fonts/fontyou/saya-semisans-fy/">http://www.myfonts.com/fonts/fontyou/saya-semisans-fy/</a> Also Minerva Modern <a href="http://www.myfonts.com/fonts/t26/minerva/" title="http://www.myfonts.com/fonts/t26/minerva/">http://www.myfonts.com/fonts/t26/minerva/</a> and GHEA Narek -- particularly if the width is compressed to 66% </p><div class="imageWrap"><img src="http://typophile.com/files/GHEANarekBoldAtWidth66Percent_6581.jpg"></div><br>
