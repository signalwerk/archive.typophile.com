      <p>Washington <a href="http://www.myfonts.com/fonts/typeassociates/washington/" title="http://www.myfonts.com/fonts/typeassociates/washington/">http://www.myfonts.com/fonts/typeassociates/washington/</a> has a closer R to ARRIVÉE than any of the suggestions so far, and has about the same height to width ratio as ARRIVÉE , but it is not a thick and thin font.<br>
      If the objective is to replicate the letters Washington might be the best candidate for editing by thickening some of the strokes. Mighty Tuxedo -- particularly the Short Caps <a href="http://www.myfonts.com/fonts/astigmatic/mighty-tuxedo-aoe/" title="http://www.myfonts.com/fonts/astigmatic/mighty-tuxedo-aoe/">http://www.myfonts.com/fonts/astigmatic/mighty-tuxedo-aoe/</a> is similar to Washington as a candidate for editing, but you would have to start with its thicker stokes and thin them as required. If the objective is to do a full uppercase alphabet suitable for compressed signage like ARRIVÉE I would start with Mighty Tuxedo.<br>
      Don</p>
