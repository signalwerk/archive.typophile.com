    <p>I am doing a menu board for a client named Surfs Up Tanning. The menu will advertise their pricing for the different tanning packages they offer. I haven't done the typography yet, but I was wanting to get opinions on the layout. I am concerned the anges are too much.</p>
    <p>The menu will be split into 2 sections. The notces cutout from the top of the shapes will hold the title of the section.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/menu.gif"></div><p></p>
