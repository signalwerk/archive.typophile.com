    html: |-
      <p>Atatched is the updated menu. I really didn't want to use a photograph on this project because I did the logo by hand I wanted to draw everything on the poster. After this I will also be doing stationary using the same elements. It is also cheaper to draw then pay a photographer or use stock. All suggestions made have been great.</p>
      <p>Tiffany, this is a local tanning salon in Louisville, KY. At first I didn't want to center the logo (layout #1), but it fits best with the current layout. I  added handdrawn lei hawaii flowers as a halftone (thanks Chris) to help with the logo being centered.</p>
      <p>Dan, I feel that the burgundy fits better than black. It looks more fresh since there would be no black anywhere else.</p>
      <p>Any more suggestions are welcome. I am up for anything.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/menu6.gif"></div><p></p>
