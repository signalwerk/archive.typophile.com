      <p>Some of the suggestions by Dan (Madden) and Scott offer you opportunities that I think you need to exploit, to me the logo is relegated by its present location/background to an afterthought, removing the background or some form of curve to the box would serve it better. Those backgrounds have that fifties textile design feel to them that is a characteristic of House, but not entirely suitable for this use (the fifties style is increased by the offset borders to your boxes), I think that a closeup view of tanned skin or an abstract soft focus texture in that vein would serve better.<br>
      Tim</p>
  - id: 105366
    user: 2172
    date: 2006-01-22T11:16:00
    date_raw: 22 Jan 2006 — 11:16am
    votes: null
    html: |-
      <p>This is definitely moving forward. Good stuff, Tom. Now that you've got some good character in the menu area, the red block with the logo's starting to feel too slick and empty. How about using a Hawaiian shirt pattern in the red area, with the pattern at a 85–90% of the red area? It would give texture and character to the red field but won't interfere unduly with the logo. This would take that surf feel an extra step. This might even work in the table areas, too. Take it all the way.</p>
      <p>I'm not so sure about using the skin as a background. Unless you have the budget for it, I think you'll have a hard time not having it come out weird from stock photos.</p>
      <p>One last thing, I think the horizontal rules in the tables help and also make them feel less empty, so I recommend keeping them.</p>
  - id: 105619
