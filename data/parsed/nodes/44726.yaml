      <p>great feedback. </p>
      <p>re weights - im looking at that first, i think ill lighten the whole thing slightly, adn try to balance that r/v/e/ weighting issue.</p>
      <p>on a design / style issue.. I am wrestling with the balance of mechanical vs the more 'humanist tapered' forms. my objective is to create something very 'neutral' and with the simplicity of quite geometric shapes - almost removing any 'decoration' but i don't want it to have that look of a mac cut font, with copy and pasted flipped shapes.</p>
      <p>I think chipmans comment about the e and g is spot on, but it highlights my dilemma.. i had cut the g to match the j, but it made the font too individual and gave it too much of a visual hook.<br>
      I like the cheeky friendly look that the g ad e give the font, but am reluctant to cut other letters more in this vein as i'm worried ill lose the simple neutrality of the a/b/d/f/i/j/k/l..(which cature more of the real character im aiming for)</p>
      <p>ill try pushing it both ways and post another pdf in a day or so.</p>
      <p>thanks again for your time looking at this for me.</p>
      <p>Jamie</p>
