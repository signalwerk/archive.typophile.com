    html: <p>The bottoms of the g (descender) and the e don't feel like they match the rest of the typeface, as well as the descender of the j (maybe closer to the t?) The curves on the top of the m feel a little uneven to me. It may be an optical issue. They seem a little flat on the upper right, and the stroke looks a little thick on the upper left. The stems of the g, b, q, p, d look thick in comparison to the bowls, or maybe the issue is vice versa. Overall, I like the simplicity and the short height of all the ascenders (i, l, f, d, etc all the same height). The proportions seem well balanced to me.</p>
