    html: |-
      <p>I like what you've done with the t, though perhaps make the crossbar a bit wider, and the tail the same. I think k's waist needs to slide down the stem a bit more.<br>
      Look at your c and f. The stroke ends at a different angle. They need to harmonise more.<br>
      You have a nice tilt on the top of the ascenders, try repeating this at the bottom of the p and q.<br>
      m and n look the right kind of width. v looks narrow though.</p>
      <p>One thing to remember is that the letters need to be read together, so it's useful to have a preview window open showing words whilst you're moving nodes around.</p>
      <p>If you want to start on numbers or uppercase, i don't think that's a bad idea...it might help you firm up which direction the font is going in, and allow you to come back to the lowercase a bit fresher. On the other hand, it could be too difficult until you know what shapes are likely to be involved and just be confusing! People like to work in different ways.</p>
    html_clean: |-
