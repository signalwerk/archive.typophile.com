      <p>No no no...</p>
      <p>Your letters differ in stroke and style <strong>way too much</strong>. Don't go to number and UC yet because your lc is still far from being finished.</p>
      <p>Your last revision is better when it comes to even stroke width but you're still having problems. Stroke joins are not ok. "a" and "r" have problematic joins. Some double storey letters have too heavy stems: p, t, h, k... k is also too heavy.</p>
      <p>And what's up with "q"'s slant cut stem? No other letter has it and if it does have a slanted cut it doesn't have it up to this extent.</p>
      <p>"f", "t", "j", "g", "r", "y" have different style. Theri termination is too different.</p>
      <p>So please don't hurry to numbers and UC.</p>
