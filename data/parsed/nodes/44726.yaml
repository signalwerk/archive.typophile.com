      <p>The first thing that I notice is the unevenness of visual weight between characters. It looks like you're relying too much on making sure the measurement is the same rather than making sure the visual weight is the same. Like in the last line, "forever", the r's and v look much heavier than the o and e's. The same thing is happening with the letter sizes -- the o, because it doesn't have any decoration, looks smaller than the other letters. It looks like you do have the curves overhanging the median and baseline a bit, but you just need to balance that out more for each letter so that the positive and negative space optically balance out to look the same size.</p>
      <p>There is a lot of indecision going on between mechanical shapes and more tapered humanist forms -- the letter h really stands out in "together" because it's so mechanical, but you said you're still figuring out some of the letters. But on the letter t, for example, it looks very top-heavy because the top is so mechanical, but the bottom is more soft and tapered. I would expect that t to fall over if I left it alone :)</p>
    html_clean: |-
