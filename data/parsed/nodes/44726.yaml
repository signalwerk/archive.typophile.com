    <p>Hi,</p>
    <p>I started to work up a font ive been sketching in my moleskine for a while now.. </p>
    <p>I'm fairly happy so far (only a few hours in) but its early days...  So I'm sticking it up for you guys to tear into.<br>
    I have thick skin - so don't hold back. </p>
    <p>I would like to create a really solid, corporate, sans serif, and i guess this is the boldish weight.</p>
    <p>any thoughts? like / don't like .. stuff i need to look at..</p>
    <p>for me the 'h' 'm' and 'n' aren't working yet, and the 'e' is close but not quite.</p>
    <p>I'd hugely appreciate any input.</p>
    <p>Many thanks in advance.</p>
    <p>Jamie</p>
