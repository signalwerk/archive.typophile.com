      <p>Since I've stumbled on this thread nearly five years late, no one will read this, BUT ...<br>
      I thought the comment by Friedrich Peter about receiving no royalties was pretty sad. Magnificat won second prize in Letraset's 1973 International Typeface Competition, for which there were 2590 entries. According to the company's handout, he received £750 and a "generous royalty agreement." I never saw Magnificat used, however -- or either of the other two cash winners: Bombere, by Carla Ward of Washington, DC (£1000); and Stilla, by Francois Boltana of France (£500). </p>
      <p>The judges were Derek Birdsall, Roger Excoffon, Colin Forbes, Armin Hoffmann, Herb Lubalin, and Marcello Minale.<br>
      (Was that the only international competition that Letraset sponsored?)</p>
      <p>There were 18 more winners, who were also supposed to have received a royalty deal but no cash. I really didn't see much of any of those fonts in use, either -- except for the still-popular LeGriffe, by Andre-Michel Lubac, and Vic Carless's Shatter. </p>
      <p>Shatter was one of three winners in the group of 20 that were based on Helvetica. The other two were Process and Suds -- the latter was Helvetica Medium caps that were made up of black outline + white fill circles of various sizes, to look like letters made of soap bubbles.</p>
      <p>My favorite of all the winners was Vincent, by Trevor Vincent of the UK. It was a deco-ish face with thin white lines that sectioned the letters to suggest ceramic tile. I never saw a full showing of it.</p>
