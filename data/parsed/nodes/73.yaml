    html: "<p>Johns H &amp; B, <br>.  I just sent off an inquiry, including a link to this thread, to Kivart (aIa). I tried to spell things out as clearly but simply as possible for translation purposes, but who knows how clearly the matter will be understood at the Japanese end. <br> <br>Playing Devil's Advocate here ... <br> <br>Both ITC and Esselte list Magnificat under their trademark listings: <br><a href=\"http://www.eyewire.com/copyright/\" target=\"_blank\">http://www.eyewire.com/copyright/</a> <br><a href=\"http://www.itcfonts.com/about/legal.asp?nCo=AFMT\" target=\"_blank\">http://www.itcfonts.com/about/legal.asp?nCo=AFMT</a> <br> <br>ITC, Letraset, Linotype -&gt; none of them seem to offer Magnificat as a digital font. Nobody seems to. <br> <br>Here's a reference I thoroughly enjoyed, but failed to find last night, that confirms Mr. Lawley's evidence trail leading to Magnificat: <br> <br><a href=\"http://www.pkfont.co.uk/page5.htm\" target=\"_blank\">http://www.pkfont.co.uk/page5.htm</a> <br> <br>May we (me being a neophyte relative to you) reasonably assume that Magnificat likely never got past the dry transfer sheet state? <br> <br>OK, so here we have a mid-20s Japanese designer/typographer who probably comes across a print usage of Magnificat somewhere (Gamme's 'a' is different from the image Philip Kelly shows, which suggests that Kivart didn't see all of the characters of Magnificat). \"Beautiful!\" he exclaims. What could he reasonably conclude about its status as a font? <br> <br>If it were a font, the language barrier would make the necessary detective work mighty tough. I'd have to agree here, though, with your statement about ignorance not being an excuse. <br> <br>If it's not even a font, the mission to find a source would have been well nigh impossible! Heck, he may even have (quite reasonably IMO) concluded that the print image he saw was hand drawn. <br> <br>In light of this, I'm: <br>1) Glad that Kivart digitized the thing. It's hardly something to \"widely use\", but it's unique, arguably beautiful and evidently usable in magazine copy. It surely would never have seen the light of day as a font without Kivart's skills. Plus, it's an original version, with, apparently, at least one character different from Magnificat to boot. <br> <br>2) Pretty sure that \"font pirate\" is overkill condemnation here. <br> <br>3) Hopeful that Kivart contacts Mr. Peter, which would now be the right thing to do </p>"
