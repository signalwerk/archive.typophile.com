      <p>Re: Magnificat<br>
      Actually I had my business card printed, where my name was in Magnificat, 18 years ago, at a printer in Bremerhaven, Germany. Later I wanted this "magnificent";-) font in digital form, but only found that Friedrich Peter, living in Canada was the original designer. I think he also designed Vivacious... not sure though.<br>
