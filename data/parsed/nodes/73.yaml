ht of this, I'm: <br>1) Glad that Kivart digitized the thing. It's hardly something to \"widely use\", but it's unique, arguably beautiful and evidently usable in magazine copy. It surely would never have seen the light of day as a font without Kivart's skills. Plus, it's an original version, with, apparently, at least one character different from Magnificat to boot. <br> <br>2) Pretty sure that \"font pirate\" is overkill condemnation here. <br> <br>3) Hopeful that Kivart contacts Mr. Peter, which would now be the right thing to do </p>"
