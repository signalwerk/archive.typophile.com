    <p>The Gothic alphabet is scarcely supported and even more scarcely is it well done. Uncial gets old, and I'm fed up with all the ugly attempts to Latinize it. So here's mine. I hope it's less ugly.<br>
    So, what do you think? The text shown is the Lord's Prayer, "Atta unsar" in Gothic. I think it contains all the Gothic letters except those used only as numbers or in Greek borrowings. I can post more examples if necessary.<br>
    Once I settle on the Gothic designs, I think I may extend this to Latin and Greek.</p>
