    html: |-
      <p>I really like this.  As you mentioned, there's hardly any great examples of it, almost all are heavily Latinsed/Hellenised/Cyrilised, or else fascimile with the rough edges, et al.  Are the inward facing serifs on the Z / T / F considered standard for Gothic, or is this particular to your rendition? (I'm curious.)</p>
      <p>As for the N, I agree the lowercase is a bit staunchy, but the capital looks great.  The problem is that by forcing your capitals do be the same width as your lowercase, you're necessarily squashing them, which is less noticeable on letters like F, E, S, I, Y, etc, because most of their diagonals (if any) are more vertical, and any horizontals are fully horizontal.  The N is more noticeable I think because it seems to cross the 45º line betwixt the cases.</p>
      <p>I think you'd be okay to vary the widths a little bit.  Since not all the letters have the same width, it won't be noticeable that the capital and lower versions are slightly different.  </p>
      <p>Overall though great job.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
