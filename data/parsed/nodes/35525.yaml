      <p>Okay, for some reason I still can't attach a PDF. So instead, here's a link to the one I tried to attach earlier: <a href="http://wurdbendur.googlepages.com/attaunsar.pdf">http://wurdbendur.googlepages.com/attaunsar.pdf</a></p>
      <p>And here's another with the full alphabet (minus the 900 letter that I haven't made yet) and a translated sample: <a href="http://wurdbendur.googlepages.com/gothicpreview.pdf">http://wurdbendur.googlepages.com/gothicpreview.pdf</a></p>
      <p>You'll see that the capitals and lowercase are each the same width. I designed the uppercase first and then the lowercase based on those, mostly just shortening and adjusting. I want them to look similar since Gothic doesn't usually have real capitals; one simply writes a large initial letter. But this causes some of the proportions to be weird. I think I should narrow the lowercase N, at least. Do you think I should adjust the capital too, or is it okay?</p>
