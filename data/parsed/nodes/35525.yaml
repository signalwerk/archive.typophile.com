      <p><em>Are the inward facing serifs on the Z / T / F considered standard for Gothic, or is this particular to your rendition? (I’m curious.)</em><br>
      There aren't many good examples (not that I would shell out the money for the fonts that do exist), but they're pretty much all uncial with downward or leftward pointing serifs, like so (from Code2001):<br><img src="/sites/default/files/old-images/ztf_3594.png"></p>
      <p><a href="http://www.omniglot.com/writing/gothic.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Omniglot</a> has an example in Alphabetum, which is probably the best approximation of the real thing.</p>
      <p><a href="http://upload.wikimedia.org/wikipedia/commons/0/08/Wulfila_bibel.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">This image</a>, sadly, is the clearest example I can find of an actual Gothic text. This comes from the Gospel of Luke (I think—I'm not really sure which) from the Codex Argenteus.</p>
