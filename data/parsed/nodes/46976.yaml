    <p>Hi All,</p>
    <p>We're setting a book dealing with sexuality and the publisher liked the looks of Mrs Eaves. It's likely target audience is going to be female. But everything I've read here suggests that the poor spacing in the font makes it less than desirable to work with for a full book. Does anyone have suggestions for another font that might have the same sort of character or liveliness of Eaves without the wonky spacing. I suggested Jenson and that was almost accepted but now they want to go back to Eaves.</p>
    <p>And am I correct in assuming that the OTF version has the same spacing problems? I have the postscript version and ended up using optical kerning in InDesign with tracking applied in the sample we were playing with.</p>
    <p>Thanks in advance for all suggestions.</p>
    <p>John</p>
  html_clean: |-
    <p>Hi All,</p>
    <p>We're setting a book dealing with sexuality and the publisher liked the looks of Mrs Eaves. It's likely target audience is going to be female. But everything I've read here suggests that the poor spacing in the font makes it less than desirable to work with for a full book. Does anyone have suggestions for another font that might have the same sort of character or liveliness of Eaves without the wonky spacing. I suggested Jenson and that was almost accepted but now they want to go back to Eaves.</p>
    <p>And am I correct in assuming that the OTF version has the same spacing problems? I have the postscript version and ended up using optical kerning in InDesign with tracking applied in the sample we were playing with.</p>
    <p>Thanks in advance for all suggestions.</p>
    <p>John</p>
