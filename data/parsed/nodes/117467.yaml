    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Shepheards_label1_4595.jpg"></div><br>
    I'd like to use this label as the basis for a poster design for a production of Agatha Christie's Murder on the Nile. Haven't got anything on my machine, had a look through Indentifont and WTF with no joy, so found this site recommended on a blog here <a href="http://www.webhostingreviewboards.com/design/5-famous-font-recognition-tools-and-my-personal-experience/" title="http://www.webhostingreviewboards.com/design/5-famous-font-recognition-tools-and-my-personal-experience/">http://www.webhostingreviewboards.com/design/5-famous-font-recognition-t...</a> and thought I'd ask, very nicely, if anyone could help. Design is for a penurious amateur drama company, so free would be nice, but not essential...<br>
    Thanks in advance<br>
    Mike<p></p>
