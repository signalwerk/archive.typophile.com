      <p>I don’t think that logo and corporate typeface must use the same font. If you can’t change the logo it’s ok, but changing Adobe Garamond is not a good idea either. Trying to match it with ITC Garamond is almost impossible, since they are based on different models (first by Garamond, the second a loose interpretation of Jannon’s work). In addition, you say it is a hand lettered version, so it’s not really ITC Garamond anyway. I’d accept they are two separate things and go for Adobe Garamond as it is. Though a bit overused, it is one of my favorite designs.</p>
      <p>Good luck!</p>
