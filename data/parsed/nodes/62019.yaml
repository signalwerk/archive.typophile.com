      <p>I would say the differences are too minor for this case.Ideally, you would want to do so; at best have a type designer design a custom face with those distinctions,but build it from scratch. Otherwise, you'd be stealing someone's work.<br>
      If you have the budget for it, go for it. If not, don't.</p>
      <p>However, altering the font and using it for commercial use like that is illegal. Doing it for a logotype is not quite as punishable, but if you are going to be using it as a full corporate face, you are going to be breaking the EULA of the font. Especially, if you are recreating it as a font and dispersing it along the company.</p>
