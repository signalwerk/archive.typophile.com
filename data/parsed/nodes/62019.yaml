    <p>Hi all-</p>
    <p>First time poster although I have browsed for some really great information in the past. Thanks to you all. Full Disclosure: I am a graphic designer not a type designer so please bear with me.</p>
    <p>I am in the process of establishing some branding type standards for a client. Their logotype which I cannot alter uses a hand lettered version of what looks like ITC Garamond which I do not like for a variety of reasons which have already been discussed in this forum. I have already sold them on the idea of using Garamond as their main corporate typeface and we are both happy with this direction. I have picked Adobe Garamond which I like because it has a good bold weight and has a nice balance between squared off and rounded serifs. It also has a clean, streamlined, timeless look to it, less quirky and "old style" than say Garamond 3. The only problem with Adobe Garamond is that the capital G and A are different than in the logotype: The top of the A is rounded in the logotype as in ITC Garamond and Garamond 3 rather than the chiseled edge in the Adobe version. The G in the Adobe version has a spur vs no spur in the logotype.</p>
    <p>I tried using Garamond 3 as it is closer to the logotype but it is not bold enough for my needs. It also feels more quirky and old timey, mainly because of the capital A and the T.</p>
    <p>I am thinking of altering the A and G in Adobe Garamond to match more closely to the logotype.</p>
    <p>So, my question to the forum is threefold:</p>
    <p>1. Are the differences between the A and G too minor to worry about?<br>
    2. Would you alter the typeface? If so, what software would you recommend? (should be very basic and easy to learn)<br>
    3. Are there other typefaces out there that may work? (A and G like Garamond 3 but a bolder weight.)</p>
    <p>Sorry for the overly long post. I look forward to your insight and feedback.</p>
    <p>Thanks,</p>
    <p>Dan</p>
