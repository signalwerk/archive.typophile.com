    html: <p>Yes and no, Georg. According to my notes, Script Bold was Monotype's 1931, ahem ..., "version" of Lautenbach's earlier Prägefest. There are lots of little details that differ, though. Look at the construction of the 'n' and crossbar of the 't' for two examples.</p>
