    html: <p> One more thing. Your names are always dead on.  <br> <br>Seriatim - One after another; in a series. <br> <br>[Medieval Latin seritim, from Latin seris, series. See series.] <br> <br>However, this name stops me. Sometimes great faces need great names. Seriatim, as a word, seems mellifluously challenged. But then again, this is your baby and usually, you don't change the name after your baby is born. <br> <br>Just a thought. <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>bj </p>
    html_clean: <p> One more thing. Your names are always dead on.  <br> <br>Seriatim - One after another; in a series. <br> <br>[Medieval Latin seritim, from Latin seris, series. See series.] <br> <br>However, this name stops me. Sometimes great faces need great names. Seriatim, as a word, seems mellifluously challenged. But then again, this is your baby and usually, you don't change the name after your baby is born. <br> <br>Just a thought. <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>bj </p>
