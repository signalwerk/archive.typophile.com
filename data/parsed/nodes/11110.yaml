    html: "<p>Very cool, David. Nice coverage from bj. <br>Here are a few more observations: <br> <br>¬ The Seriatim 'a' dark join distracts <br>from the color of the rest of the glyphs. <br> <br>¬ The Seriatim 'g' is beautiful. I don't <br>mind seeing more of Bruhn's Mercury 'g'  <br>form spread about. <br> <br>¬ The Upright 's' looks feeble. Can't <br>add some width? <br> <br>¬ I think the 6 and 9 look strange to bj  <br>because we're accustomed to seeing <br>angular Futurish numerals with this <br>sort of face. I'm not sure if your <br>departure is a good or bad thing yet. <br>Need to see some set text. <br> <br>¬ As to be expected, your ankhs and <br>daggers and other non-alphabetic <br>symbols are delightful. Ever consider <br>a set of these as a font all their own?  <br>It could be handy and a seller like <br>some of the Altemus Creations stuff. <br>(<a href=\"http://www.altemus.com/ACCrs.html\" target=\"_top\">http://www.altemus.com/ACCrs.html</a>) <br> <br>¬ Darling = the Roundform pound sign. <br> <br> <br>Stephen</p>"
    html_clean: "<p>Very cool, David. Nice coverage from bj. <br>Here are a few more observations: <br> <br>¬ The Seriatim 'a' dark join distracts <br>from the color of the rest of the glyphs. <br> <br>¬ The Seriatim 'g' is beautiful. I don't <br>mind seeing more of Bruhn's Mercury 'g'  <br>form spread about. <br> <br>¬ The Upright 's' looks feeble. Can't <br>add some width? <br> <br>¬ I think the 6 and 9 look strange to bj  <br>because we're accustomed to seeing <br>angular Futurish numerals with this <br>sort of face. I'm not sure if your <br>departure is a good or bad thing yet. <br>Need to see some set text. <br> <br>¬ As to be expected, your ankhs and <br>daggers and other non-alphabetic <br>symbols are delightful. Ever consider <br>a set of these as a font all their own?  <br>It could be handy and a seller like <br>some of the Altemus Creations stuff. <br>(<a href=\"http://www.altemus.com/ACCrs.html\" target=\"_top\" class=\"link-external\">http://www.altemus.com/ACCrs.html</a>) <br> <br>¬ Darling = the Roundform pound sign. <br> <br> <br>Stephen</p>"
