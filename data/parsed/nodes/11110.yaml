    html: <p> David, congrats on a wonderful system!  <br>Where the kabel, avenir, avant garde,  <br>futura systems are predictable  <br>stay-at-home types, Seriatim is a loose <br>geometric looking for some action. <br> <br>You've executed something on a high level, <br>a level approaching Hoefler's Proteus or  <br>House's Chalet systems. <br> <br>Your attention to detail is superb, <br>as always. <br> <br>There's so much here to talk about  <br>so I'll pinpoint some areas that  <br>I like/dislike. <br> <br>DTD Seratim -- My favorites are the uc K, Q <br>and R, and the lc g.  <br>The oblique M, V and W are reminiscent of avant <br>garde alternates, but the perhaps the V and W <br>could be less oblique. As you pair letters, <br>there's going to be a pronounced gap with these. <br>Maybe 6 degrees of separation might work. Your <br>extended characters are great. <br> <br>DTD Seriatim Upright - This is the most  <br>textworthy and the one that adheres to a <br>geometric convention of past faces. <br>I like the uc J wide like that.  <br>The uc Q seems to call for an alternate.  <br>The numbers 6 and 9...they seem a bit odd  <br>for some reason. <br> <br>Seriatim Roundforms -- This face is worth the price of admission by itself.  <br>Every letter except for 'I' and 'V' uses rounded forms. What a treat. <br>Your ampersand is darling.  <br>Don't kill your darlings. <br> <br>Seriatim Alternates -- I like a lot of the stuff  <br>here, including the feel of the lower case.  <br>I'd like to see some different treatments on  <br>the some of the plain uppercase letters. D E F etc. <br>I like the experimental uc K and R, but the <br>uc P and the uc Z are not my favorites. <br> <br>Terrific work! <br> <br>bj </p>
