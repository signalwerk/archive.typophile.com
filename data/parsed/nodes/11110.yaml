    html: "<p><img src=\"http://www.typophile.com/forums/messages/29/1006.jpg\" alt=\"SeriatimFamilyKerningSample.jpg\"> <br> <br>bj: <br> <br>&gt; Where the kabel, avenir, avant garde, <br>&gt; futura systems are predictable <br>&gt; stay-at-home types, Seriatim is a loose <br>&gt; geometric looking for some action. <br> <br>Thanks! I love this paragraph. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> May I use the description later in promotion? <br> <br>&gt; DTD Seratim --  <br>&gt; The oblique M, V and W are reminiscent of avant  <br>&gt; garde alternates, but the perhaps the V and W  <br>&gt; could be less oblique. As you pair letters,  <br>&gt; there's going to be a pronounced gap with these.  <br>&gt; Maybe 6 degrees of separation might work. <br>... <br>&gt; ps by 'six degrees of separation,' i mean &gt; toning down the oblique angle.  <br> <br>The obliques definitely pose a problem, but because of the geometric nature of the font, I want to follow Lubalin's lead as in Avant Garde Gothic and keep all of the oblique strokes as uniform as possible in their angles. In other words, I want to keep the diagonals parallel to each other as much as possible. Granted this creates a kerning challenge, but if I am careful, I hope to catch all of the possible combinations. <br> <br>The sample above shows how many of the characters fit together, and some combinations for their own ligatures naturally (as the Seriatim \"LY\" combination does). <br> <br>&gt; DTD Seriatim Upright -  <br>&gt; The uc Q seems to call for an alternate. <br> <br>&gt; Seriatim Alternates --  <br>&gt; I'd like to see some different treatments on  <br>&gt; the some of the plain uppercase letters. <br>&gt; D E F etc. ... the uc P and the uc Z are <br>&gt; not my favorites.  <br> <br>I've been looking at many of those as well. Do you have any specific ideas in mind? <br> <br>&gt; However, this name stops me. Sometimes great <br>&gt; faces need great names. Seriatim, as a word, <br>&gt; seems mellifluously challenged. <br> <br>Heh heh... Well, we could choose between \"Seriatim\" and \"Mellifluous\"... <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> Actually, the more I say the name \"Seriatim\", the more lyric it sounds to my ear. But I am prejudiced, admittedly. Does anyone else have an opinion on the name? <br> <br>Thanks for the comments &amp; encouragement! <br> <br>Stephen: <br> <br>Thanks to you too! <br> <br>&gt; ¬ The Seriatim 'a' dark join distracts  <br>&gt; from the color of the rest of the glyphs. <br> <br>I agree, and I'm taking steps to minimize this without changing the structure too much, mostly by extending the counter's light trap up further into the join area, thinning the two strokes slightly as they come together. <br> <br>&gt; ¬ The Upright 's' looks feeble. Can't  <br>&gt; add some width?  <br> <br>I could try, but I don't want to depart too much from the basic geometry. It's the same lc \"s\" as it used in the Seriatim (normal) set, and it essentially the same structure as Avant Garde Gothic, Kabel, and (to a lesser extent) Futura. I'll try adding a bit of a straight horizontal stroke between the curves to see if it works. <br> <br>As far as those \"6\" and \"9\" glyphs, As bj notes, the extenders are pretty strong, but I think Stephen may have a point. I tried for a different form (although the more angular Futura forms are available in the Seriatim Alternates set) so it looks unusual. I think they work pretty well with the other figures, especially the \"3\", \"5\", \"8\" and \"0\". Anyone have other views on this? <br> <br>&gt; ¬ As to be expected, your ankhs and <br>&gt; daggers and other non-alphabetic <br>&gt; symbols are delightful. Ever consider <br>&gt; a set of these as a font all their own? <br>&gt; It could be handy and a seller like <br>&gt; some of the Altemus Creations stuff.  <br> <br>Thanks. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> That's an intriguing idea, and I have entertained it before. And thanks for the link! There are some great symbols and designs in Altemus' work. <br> <br>Thanks for the comments so far. <br> <br>David</p>"
    html_clean: "<p><img src=\"http://www.typophile.com/forums/messages/29/1006.jpg\" alt=\"SeriatimFamilyKerningSample.jpg\"> <br> <br>bj: <br> <br>&gt; Where the kabel, avenir, avant garde, <br>&gt; futura systems are predictable <br>&gt; stay-at-home types, Seriatim is a loose <br>&gt; geometric looking for some action. <br> <br>Thanks! I love this paragraph. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> May I use the description later in promotion? <br> <br>&gt; DTD Seratim --  <br>&gt; The oblique M, V and W are reminiscent of avant  <br>&gt; garde alternates, but the perhaps the V and W  <br>&gt; could be less oblique. As you pair letters,  <br>&gt; there's going to be a pronounced gap with these.  <br>&gt; Maybe 6 degrees of separation might work. <br>... <br>&gt; ps by 'six degrees of separation,' i mean &gt; toning down the oblique angle.  <br> <br>The obliques definitely pose a problem, but because of the geometric nature of the font, I want to follow Lubalin's lead as in Avant Garde Gothic and keep all of the oblique strokes as uniform as possible in their angles. In other words, I want to keep the diagonals parallel to each other as much as possible. Granted this creates a kerning challenge, but if I am careful, I hope to catch all of the possible combinations. <br> <br>The sample above shows how many of the characters fit together, and some combinations for their own ligatures naturally (as the Seriatim \"LY\" combination does). <br> <br>&gt; DTD Seriatim Upright -  <br>&gt; The uc Q seems to call for an alternate. <br> <br>&gt; Seriatim Alternates --  <br>&gt; I'd like to see some different treatments on  <br>&gt; the some of the plain uppercase letters. <br>&gt; D E F etc. ... the uc P and the uc Z are <br>&gt; not my favorites.  <br> <br>I've been looking at many of those as well. Do you have any specific ideas in mind? <br> <br>&gt; However, this name stops me. Sometimes great <br>&gt; faces need great names. Seriatim, as a word, <br>&gt; seems mellifluously challenged. <br> <br>Heh heh... Well, we could choose between \"Seriatim\" and \"Mellifluous\"... <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> Actually, the more I say the name \"Seriatim\", the more lyric it sounds to my ear. But I am prejudiced, admittedly. Does anyone else have an opinion on the name? <br> <br>Thanks for the comments &amp; encouragement! <br> <br>Stephen: <br> <br>Thanks to you too! <br> <br>&gt; ¬ The Seriatim 'a' dark join distracts  <br>&gt; from the color of the rest of the glyphs. <br> <br>I agree, and I'm taking steps to minimize this without changing the structure too much, mostly by extending the counter's light trap up further into the join area, thinning the two strokes slightly as they come together. <br> <br>&gt; ¬ The Upright 's' looks feeble. Can't  <br>&gt; add some width?  <br> <br>I could try, but I don't want to depart too much from the basic geometry. It's the same lc \"s\" as it used in the Seriatim (normal) set, and it essentially the same structure as Avant Garde Gothic, Kabel, and (to a lesser extent) Futura. I'll try adding a bit of a straight horizontal stroke between the curves to see if it works. <br> <br>As far as those \"6\" and \"9\" glyphs, As bj notes, the extenders are pretty strong, but I think Stephen may have a point. I tried for a different form (although the more angular Futura forms are available in the Seriatim Alternates set) so it looks unusual. I think they work pretty well with the other figures, especially the \"3\", \"5\", \"8\" and \"0\". Anyone have other views on this? <br> <br>&gt; ¬ As to be expected, your ankhs and <br>&gt; daggers and other non-alphabetic <br>&gt; symbols are delightful. Ever consider <br>&gt; a set of these as a font all their own? <br>&gt; It could be handy and a seller like <br>&gt; some of the Altemus Creations stuff.  <br> <br>Thanks. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> That's an intriguing idea, and I have entertained it before. And thanks for the link! There are some great symbols and designs in Altemus' work. <br> <br>Thanks for the comments so far. <br> <br>David</p>"
