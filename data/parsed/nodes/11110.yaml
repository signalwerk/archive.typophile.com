  html: "<p><img src=\"http://www.typophile.com/forums/messages/29/990.jpg\" alt=\"SeriatimUpright.jpg\"> <br><img src=\"http://www.typophile.com/forums/messages/29/991.jpg\" alt=\"Seriatim.jpg\"> <br><img src=\"http://www.typophile.com/forums/messages/29/992.jpg\" alt=\"SeriatimRoundforms.jpg\"> <br><img src=\"http://www.typophile.com/forums/messages/29/993.jpg\" alt=\"SeriatimAlternates.jpg\"> <br> <br>The Seriatim Family is a system of geometric sans serifs in four surprisingly interchangeable styles: <br> <br>1. Upright, the most conservative set; <br> <br>2. Normal; <br> <br>3. Roundform; and <br> <br>4. Alternates, generally the most daring set. <br> <br> <br>Many of the characters have an ability to form natural ligatures between them, especially in the Normal and Alternate sets. <br> <br>Not all of the characters have unique glyphs in each of the four sets, but many do. For example, there is one design for lower-case \"i\", but there are 4 designs for Upper-Case \"E\" -- 7, actually, if you count the 3 unique \"sigma\" glyphs, which function well as display upper-case \"E\"s. <br> <br>I'm still fine-tuning many aspects, such as kerning and hinting. <br> <br>The font was designed with display applications in mind, but the Normal and Upright versions, especially, seem to compare roughly to Kabel, Futura, and the like for short text applications. (No, I wouldn't set a book in it. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> ) <br> <br>I have tried to design enough original characters to justify yet another geometric face. As I pushed myself to find new geometric ways to portray the various glyphs, I arrived at some rather unexpected solutions -- many of those ended up in the Alternates set, but a few of them were unique enough yet readable enough to be placed in the other sets. <br> <br>I'm still toying with the designs as well, of course, so nothing is set in stone as yet. <br> <br>Comments very much desired, and will be appreciated! <br> <br>David</p>"
  html_clean: "<p><img src=\"http://www.typophile.com/forums/messages/29/990.jpg\" alt=\"SeriatimUpright.jpg\"> <br><img src=\"http://www.typophile.com/forums/messages/29/991.jpg\" alt=\"Seriatim.jpg\"> <br><img src=\"http://www.typophile.com/forums/messages/29/992.jpg\" alt=\"SeriatimRoundforms.jpg\"> <br><img src=\"http://www.typophile.com/forums/messages/29/993.jpg\" alt=\"SeriatimAlternates.jpg\"> <br> <br>The Seriatim Family is a system of geometric sans serifs in four surprisingly interchangeable styles: <br> <br>1. Upright, the most conservative set; <br> <br>2. Normal; <br> <br>3. Roundform; and <br> <br>4. Alternates, generally the most daring set. <br> <br> <br>Many of the characters have an ability to form natural ligatures between them, especially in the Normal and Alternate sets. <br> <br>Not all of the characters have unique glyphs in each of the four sets, but many do. For example, there is one design for lower-case \"i\", but there are 4 designs for Upper-Case \"E\" -- 7, actually, if you count the 3 unique \"sigma\" glyphs, which function well as display upper-case \"E\"s. <br> <br>I'm still fine-tuning many aspects, such as kerning and hinting. <br> <br>The font was designed with display applications in mind, but the Normal and Upright versions, especially, seem to compare roughly to Kabel, Futura, and the like for short text applications. (No, I wouldn't set a book in it. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> ) <br> <br>I have tried to design enough original characters to justify yet another geometric face. As I pushed myself to find new geometric ways to portray the various glyphs, I arrived at some rather unexpected solutions -- many of those ended up in the Alternates set, but a few of them were unique enough yet readable enough to be placed in the other sets. <br> <br>I'm still toying with the designs as well, of course, so nothing is set in stone as yet. <br> <br>Comments very much desired, and will be appreciated! <br> <br>David</p>"
