    html: <p> David, you're sure giving us a lot of work, man!! :-)  Fortunately, BJ and Stephen have already done some great critiquing. <br> <br>&gt; I have tried to design enough original characters to justify yet another geometric face. <br> <br>And you've totally done it - not an easy feat in my book. Providing a set of fonts that can be intermixed isn't just technically cool, it really provides for a lot of versatility, and not just aesthetically either. <br> <br>Your tiled text setting is very revealing. I think you have a great balance between variance and congruence. And speaking of fancy words, at first I didn't like "Seriatim", but now I think it's totally good, on a number of levels. <br> <br>hhp </p>
