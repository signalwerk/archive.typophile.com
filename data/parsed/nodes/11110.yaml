    html: "<p> Sorry for the delay in responding. I've been trying to get some client deadlines met and some bills paid.... Argh.... <br> <br>Stephen: <br>Thanks! I'm still fussing over the kerning and optical corrections, but I hope to finally get this done and released by sometime in July -- early July, if possible. <br> <br>bj: <br>I agree about the lc \"y\" -- as well as Hrant's suggestion about the \"&amp;\" (and a few other characters that I have noticed). These will be adjusted. <br> <br>Funny you should mention ornaments. I'm indeed working on some, but I have a lot of work before a set will be completed. <br> <br>Thanks for all the encouragement. <br> <br>Hrant: <br>I agree about the \"&amp;\", and it's led me to double-check all of the curve-line vertices too. <br> <br>On looking at the uc \"G\", I'm going to try eliminating the curve on the crossbar, but keeping the descending curve. I'll post it for comments soon. <br> <br>I'm conflicted about the lc aesc (\"ae\" ligature). I agree that the stem helps identify the glyphs, but it also made it really dark -- and it doesn't seem to belong, especially in an italic. I'll tinker with it again and see if I can reach a better solution. I'm avoiding a sloped roman \"a\" form. <br> <br>David </p>"
    html_clean: "<p> Sorry for the delay in responding. I've been trying to get some client deadlines met and some bills paid.... Argh.... <br> <br>Stephen: <br>Thanks! I'm still fussing over the kerning and optical corrections, but I hope to finally get this done and released by sometime in July -- early July, if possible. <br> <br>bj: <br>I agree about the lc \"y\" -- as well as Hrant's suggestion about the \"&amp;\" (and a few other characters that I have noticed). These will be adjusted. <br> <br>Funny you should mention ornaments. I'm indeed working on some, but I have a lot of work before a set will be completed. <br> <br>Thanks for all the encouragement. <br> <br>Hrant: <br>I agree about the \"&amp;\", and it's led me to double-check all of the curve-line vertices too. <br> <br>On looking at the uc \"G\", I'm going to try eliminating the curve on the crossbar, but keeping the descending curve. I'll post it for comments soon. <br> <br>I'm conflicted about the lc aesc (\"ae\" ligature). I agree that the stem helps identify the glyphs, but it also made it really dark -- and it doesn't seem to belong, especially in an italic. I'll tinker with it again and see if I can reach a better solution. I'm avoiding a sloped roman \"a\" form. <br> <br>David </p>"
