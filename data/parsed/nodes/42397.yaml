    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 23.Feb.2008 10.11am </div>
      <p>L*E*T*T*E*R*S<br>
    &amp; LITERATURES<br>
    a joint presentation by<br>
    CHARLES BIGELOW and KRIS HOLMES</p>
    <p>“We’ll talk about calligraphy and typography for oral literatures that<br>
    became literate at some time. Such as Kiksht Chinook, colloquial modern<br>
    Irish, medieval Provencal, a little K’iche’, a smattering of Old English and<br>
    Ancient Greek.”</p>
    <p>Charles Bigelow is the Melbert B. Cary, Jr. Professor of Graphic Arts at the<br>
    Rochester Institute of Technology, the recipient of RIT’s Frederic W. Goudy<br>
    Award in Typography, and a former MacArthur Prize Fellow.</p>
    <p>Kris Holmes is an internationally known calligrapher and the designer of<br>
    more than one hundred type faces, including Lucida Grande, the standard font<br>
    for Macintosh OS X. She is the President of the Bigelow &amp; Holmes Studio.</p>
    <p>Tuesday, February 26 at 4:00 PM in the Poetry Collection, UB Libraries<br>
    Special Collections Research Room, 420 Capen Hall, University of NY at<br>
    Buffalo North Campus, Amherst NY.</p>
    <p>There will be a display of their work.</p>
