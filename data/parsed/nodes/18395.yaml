    <p>Hello,</p>
    <p>i'm always a fan of the oscars. </p>
    <p>And i was wondering what you guys thought of that broadcast design used this year. The presentation of categories animation were really nice i thought, all black and grey. </p>
    <p>And the hole screen above the stage that presented the categories and presenters. </p>
    <p>I was just feeling that the whole thing had a bit more class than last year with some very loud colors. </p>
    <p>Your turn</p>
    <p>Thanks!</p>
