      <p>In spite of the (happy for me) fact that they used one of my fonts <a href="http://www.marksimonson.com/article/117/mostra" rel="nofollow">rather prominently</a> on last year's show, I thought the overall look this year was an improvement. Except for that Crash musical number. That was bizarre.</p>
