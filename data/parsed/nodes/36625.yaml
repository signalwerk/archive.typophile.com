      <p>I’m going to do this off the top of my head, rather than consulting the actual fonts first, so I may be inserting foot in mouth, but . . . </p>
      <p>I dislike the “zero” characters in Sabon and Stempel Garamond that are (respectively) a perfect circle, unstressed, and a character with equal weight on both sides and vertivcal rather than oblique stress. Both of these seem sharply arresting to my eye rather than flowing, because their personalities look (to my eye at least) so different from all their sibling glyphs. Do others find this charming in these two cases? Or are you also bothered by this? The Sabon 0 actually looks like a wrong font to me when combined with the other o.s. figs.</p>
      <p>Bruce</p>
