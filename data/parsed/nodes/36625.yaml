    <p>We have one discussion going on right now about the lower case a in Kabel Book.</p>
    <p>That got me thinking about things in fonts that really disturb me. I LOVE the family - Today…but…I cannot stand the ampersand that was designed for it.</p>
    <p>Any one else have any grips over letters, punctuation, etc. in any font that you fancy?</p>
