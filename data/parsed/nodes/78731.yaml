    <p>Hi,</p>
    <p>I'd be grateful for any feedback on these characters before I go ahead and make more.</p>
    <p><a href="https://docs.google.com/leaf?id=0B3-5rAZSJymzZDZiMDk4ZDgtMGVkZS00NTBhLTkxNzUtN2U5YTM2YjBjNDQ4&amp;hl=en_GB&amp;authkey=COKo-owP" title="https://docs.google.com/leaf?id=0B3-5rAZSJymzZDZiMDk4ZDgtMGVkZS00NTBhLTkxNzUtN2U5YTM2YjBjNDQ4&amp;hl=en_GB&amp;authkey=COKo-owP">https://docs.google.com/leaf?id=0B3-5rAZSJymzZDZiMDk4ZDgtMGVkZS00NTBhLTk...</a></p>
    <p>They were initially for a logo so I only made a few characters but now I'm thinking of extending it into a font. They're pixel based for screen use although I might make outline versions for print later, I know very little about font creation. I'm not planning on making lower case characters because of time constraints.</p>
    <p>Strokes are 3px thick and I've tested that it also works with 2px and 1px strokes for smaller sizes. If anyone knows of anything similar, pixel based so it reproduces perfectly on screen at this kind of size, I'd be happy to hear about it.</p>
    <p>Thanks all.</p>
