    <p>Strokes are 3px thick and I've tested that it also works with 2px and 1px strokes for smaller sizes. If anyone knows of anything similar, pixel based so it reproduces perfectly on screen at this kind of size, I'd be happy to hear about it.</p>
    <p>Thanks all.</p>
