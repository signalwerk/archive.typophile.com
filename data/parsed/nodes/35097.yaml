    <p>Wow. I just saw some fantastic typography all over the new Potter film. What a nice surprise to see such carefully chosen type, very much of it in the old style(s), in a movie. Newspapers, signs, closing credits - everything throughout the film - ughh. It was like porno for typos.</p>
    <p>Film is a medium with which I have not seen type treated with this kind of attention (credits excluded - there are many wonderful examples of beautifully set credits!). Does anyone have any favorite type-showcasing films? Please share your experiences.</p>
    <p>Feel free to include any documentaries about type, too, I guess. Many of us are familiar with the the Helv documentary (maybe even seething to see it), but I suspect there may be more out there.</p>
    <p>Best,<br>
    Ray</p>
    <p>P.S. By the way (and my intention is not to turn this into a HP thread), but even beyond the type treats, HP5 is a fantastic film...</p>
