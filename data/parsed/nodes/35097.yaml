      <p>I was going to post about this after I caught OotP, but for some reason I didn’t.</p>
      <p>The movie really did have a lot of sick type stuff to offer. Between the main transitions that were done in 3d animated, 2d pages from the Daily Prophet, to the typographic riot that were Umbridge’s decrees, someone was really earning their paycheck.  Too bad I can’t find any screenshots of the Prophet’s sleek new redesign. In all the previous films, the main heads were done in wizard-anachronistic blackletter, but in the latest outing, most of it was done in a weathered, black, condensed sans (though the text still looked like a gnarly blackletter). It’s too bad they omitted all the stuff about the Quibbler – I’d have been interested to see how it would look compared to the Prophet.</p>
      <p>Concerning other films, for some reason the ubiquity of Gill Sans in near-future London in Children of Men struck me as a nice touch. The director, Alfonso Caurón, was also behind Azkaban, with it’s sweet Marauder’s Map, incidentally.</p>
