    html: |-
      <p>I think the key point is that Adobe does not want to limit the use of the type. You can put it into a logo, or make it your corporate font. But they do limit the actual font software to one machine (normally). In other words, you cannot take the Myriad Pro font files and supply them to everyone in the company to install on their computer. Your license (I think) is only for the machine CS was installed on.</p>
      <p>With a logo, you can save the logo in PDF (or another) format that embeds the font, and then it can be used on other computers that don't have the font installed. Or you can do the Flash or sIFR thing for the web, or just create the text as a GIF. There is no way that I know of to make it yoru corporate font (to be used in memos, reports, etc.) without buying licenses for all the computers it will be used on.</p>
    html_clean: |-
      <p>I think the key point is that Adobe does not want to limit the use of the type. You can put it into a logo, or make it your corporate font. But they do limit the actual font software to one machine (normally). In other words, you cannot take the Myriad Pro font files and supply them to everyone in the company to install on their computer. Your license (I think) is only for the machine CS was installed on.</p>
