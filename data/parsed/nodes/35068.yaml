    html: <p>Almost all font vendors allow you to create a logo, bitmap or outline (vector art) and distribute it. In fact this is so common that most licenses don't even mention it. Most of the restrictions in licenses relate to the distribution of the digital font file itself (and fonts derived from it).</p>
