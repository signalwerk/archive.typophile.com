      <p>EULAs and TOSs typically require a staff of attorneys to fully comprehend. Even if you were fluent in english, these things wouldn't make a lot of sense.</p>
      <p>All that said, my guess is that they mean that you may not put the font files themselves on your web site or any server publicly accessible. If you create your logo and save it as a JPG or GIF, then it's no longer a font file, but just an image file, which is fine.</p>
