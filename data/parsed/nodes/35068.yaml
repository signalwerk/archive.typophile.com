    <p>Hi everyone,</p>
    <p>I bought the Adobe CS2 premium bundle including some fonts like Myriad.</p>
    <p>Now, i want to use the font "Myriad Pro" which was also on the cd's for my company (logo, website...).</p>
    <p>Do I have the rights to do that? Are there any limitations? Where can i find the license for Myriad? </p>
    <p>Many thanks!</p>
    <p>Manfred</p>
