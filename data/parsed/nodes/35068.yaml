      <p>&gt;Does this mean, i am not allowed to create a logo for my website? </p>
      <p>Maybe this will be helpful (from a non-lawyer, so no guarantees): the font is technically the software to produce the letters on the screen or paper, not the printed or screen letters. They are limiting your rights to let others used the same software. They are not limiting others seeing the type, either in print or on screen.</p>
