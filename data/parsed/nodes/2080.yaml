    html: <p>What I see is that your spacing/tracking is tighter and your letters have not been scanned and enlarged, from who knows what medium. Will you concede that the shapes and proportions of the letters are the same? Look at the counters in the a and e, and the angles of the connectors. Even the spur on the top of the a is the same. It almost looks to me like the sample was done on an inkjet and there was some spreading of the ink that blurred some of the edge details, like the top of the t's.</p>
