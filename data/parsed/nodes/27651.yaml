    <p>hey,</p>
    <p>just wondered if anyone knew of any good examples of typography being implimented in moving image?</p>
    <p>obviously Robert Brownjohn and Saul Bass spring to mind along with the opening sequence to seven. but i wondered if anyone had anything they could share as i am currently researching techniques and methods that use type and moving image togther in an interesting and exciting way.</p>
    <p>thanks,</p>
    <p>leonidas</p>
