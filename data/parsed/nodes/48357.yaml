    <p>Here are 2 typefaces from an old WPA poster.</p>
    <p>The first two images are (obviously) variants of the same typeface. The third image is another typeface from the same poster. (These are the best scans I could do; the edges are cleaner/sharper than this.)</p>
    <p>Does anyone know if they're relatively unique to this poster (I'm assuming they were hand lettered), or if there are any existing fonts similar to them?</p>
    <p>THANK YOU!</p>
