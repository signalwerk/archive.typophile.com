    <p>I'm trying to come up with a design for a local firehouse. The captain at the fire department stated he wanted the name of the firehouse "in a font that looked simluar chrome" Does anyone have any suggestions? I know the chrom effect can be created with third party design software, but what about the font?</p>
    <p>Thanks,<br>
    Tim</p>
