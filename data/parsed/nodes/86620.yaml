    html: |-
      <p>You need to gather more info from the captain, as Luma Vine suggested, but my guess is that he had a chrome effect something like this in mind (which you'd need to create in Photoshop)...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cars2_4488.jpg"></div><p></p>
      <p>Most fire department logos I've seen are just awful. They're designed like an old-fashioned city seal with tiny details that are illegible unless blown up large and examined carefully. </p>
      <p>bad fire department logos:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/bad-logos_6221.jpg"></div><p></p>
      <p>I guess the fact that he's interested in a chrome effect at least shows that's he considering something a little different. But keep in mind that a client's initial ideas may or may not be the best way to go. Try to find out why he likes that look. It may not be the chrome itself, but something else that he likes (a more contemporary look, or the vehicle association, or the pizazz, or whatever).</p>
