      <p>I was just trying to see if you guys knew a font that looked good in a chrome effect, not necesarily that the font looked like chrome. For example, the type of font I'm experimenting with is LHF Burbank. Again I'm just trying to identify other fonts that have an Old West / Fire Department look to them and will try applying a chrome filter to them to see if it works well or not.</p>
