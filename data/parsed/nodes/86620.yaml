    html: <p>Did he mean actual chrome or some font called chrome (I think there is one called chell chrome or something like that)?  Custom lettering treatment could probably capture some aspects of actual chrome.  That would be independent of font.  Maybe you could give some more info from your brief - what are the main themes, ideas and messages of the brand, who is the audience, etc.</p>
