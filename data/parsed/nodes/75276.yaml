      <p>@Nick Shinn I think it's pretty objective to say that sans-serifs such as Helvetica and Univers are more legible than their serif counterparts, especially when they are scaled to tiny sizes. These claims are also backed up by focus reports and legibility tests. Also to say that there is no such thing as "objective typography" is pretty naive, there are without a doubt certain styles that apply more so to certain fields. </p>
      <p>Personally I believe we guide our decisions to an extent with objective purposes in mind, and then allow the subjective conclusions select typefaces and so-on. </p>
      <p>Your statement "Default design offers the illusion, but is nothing more than lickspittle subservience to cultural imperialism." is a little ironic though, especially considering that when believing in an absolute subjectiveness means that you are subservient to the cultural imperialism of your clients.</p>
      <p>Just my 2 cents<br>
      Andrew</p>
