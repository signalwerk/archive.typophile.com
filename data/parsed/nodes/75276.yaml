      <p>Andreas, objectivity in science is a philosophical problem..<br>
      In Anthropology, for instance, with the field-worker compromised by living "under cover" with the subjects, or in quantum mechanics, with the observer's presence effecting outcomes.<br>
      And in general, with the vested interests of those funding research influencing what gets studied, and the conclusions that are made.</p>
      <p>There is no such thing as objective typography.<br>
      Default design offers the illusion, but is nothing more than lickspittle subservience to cultural imperialism.</p>
