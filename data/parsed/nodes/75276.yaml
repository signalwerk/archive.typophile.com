      <p>It is ONE thing to typeset, say, poetry *of* a certain period in a font of that period, to get some flavour to it.<br>
      It is, i.m.h.o., ANOTHER thing to typeset a thesis *about* a certain period in the typographic mood of that very period. As a decent scientist, a certain critical distance to the subject of your treatise suits you well. </p>
      <p>But maybe philosophy can claim to occupy another, third position …</p>
