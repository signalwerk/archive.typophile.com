      <p>@lordk: Where do your study and who is your supervisor? </p>
      <p>Can you provide us with more information about the content, such as who the philosopher is, what he wrote about, significant dates, his birth and death &amp;c? When selecting a typeface, this sort information is very helpful to the typographer.</p>
      <p>The idea of a somewhat more playful display face for a "Chapter 1" page is very cute, and a great opportunity to provide a little visual interest. Not sure about Bauhaus however. For myself, it has very strong associations to the school then to post German WW1 philosophers. Semantically, I would consider it inappropriate. </p>
      <p>If I think German and War (I'm a Canadian) The first font that pops in to my head is <a href="http://en.wikipedia.org/wiki/Fette_Fraktur" rel="nofollow">Fette Fraktur</a>, specifically for it's dagger-like lowercase p, which would be on every chapter page (<a href="http://www.searchfreefonts.com/free/luftwaffe.htm" rel="nofollow">Luftwaffe</a> is similar). However, some people look at it as being associated with Nazi Germany, which is an area you may wish to avoid.</p>
      <p>If you could work in a nice display face for your chapter pages, then perhaps you could simply focus on a pair of serif and sans that work well together and not concern yourself with making them look of the time as you have already done that with your display face.</p>
      <p>Bodoni and Futura make a nice pair due to their contrast, but Bodoni is a a little hard to read at small sizes unless it's set exceptionally. Nick should be able to shed some light on setting Bodoni. I have never had much success with it.</p>
      <p>Additional pairs include:</p>
      <p>Syntax/Minion (or Garamond)<br>
      Frutiger/Meridene (or Frutiger Serif)<br>
      Univers/Utopia<br>
      Gill Sans/Perpetua<br>
      Rotis Sans/Rotis Serif</p>
      <p>There are others, and several threads that discuss this here, but I do not have them ready to mind.</p>
