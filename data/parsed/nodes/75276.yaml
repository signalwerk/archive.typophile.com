    <p>Hi, I have to write a PhD thesis in philosophy about a german philosopher who wrote after WW1. I would like to use fonts that would give the spirit of that time...</p>
    <p>I need two fonts (serif/sans) but maybe rather three: for each chapter, I thought that the beginning could use three fonts for title, content and the formula "Introduction/Chapter 1/Chapter 2/etc."</p>
    <p>What do you think about (bodoni/futura)  (urw antiqua / urw grotesk)    (berthold walbaum / berthold Akzidenz Grotesk)?</p>
    <p>Could the third font (for "Introduction/Chapter 1/Chapter 2") be "Bauhaus"?</p>
    <p>I made some attempts but I am not very happy with the result? Maybe the design of the the first page of each chapter (I mean the page with three different things: "Chapter X", Title, beginning of the content) could help but I am not very good for that; could you help me with some nice ideas? Regards.</p>
