      <p>Just to get back on topic:</p>
      <p>I think the example you've shown doesn't work to well because there are too many typefaces and styles combined that don't go too well together, and create an unfocused and messy result. I would ditch ITC Kabel, as this is not accurate for the time, if you want to use Kabel use the original version. As there were a lot of styles and fashions going on in that timeframe, with quite different ideals and objectives, I think it would be wrong to try to bring them all together, as it will probably be quite wishy-washy. If you want to go period style, find the style that is accurate, it could be bauhaus inspired, geometric, expressionistic, grotesk, classical.... Look at period pieces, and try to find out what defines it. I'm not saying it's the way to go, but if you want to go in that direction, it's important to be accurate.</p>
