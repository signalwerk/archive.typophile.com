      <p>Hi,</p>
      <p>Koch Antiqua and Kabel are great recommendations, although personally, I’m a bit sceptical about Koch Antiqua’s performance in longer texts.<br>
      Walbaum and Akzidenz Grotesk could be a good choice, too. Also have a look at Storm’s Walbaum Text: <a href="http://www.stormtype.com/typefaces-fonts-shop/index.php?id=52" title="http://www.stormtype.com/typefaces-fonts-shop/index.php?id=52">http://www.stormtype.com/typefaces-fonts-shop/index.php?id=52</a><br>
      It would also work with FF Bau,, which is a revival of Schelter Grotesk (even older than Akzidenz Grotesk and used a lot in the early 20th century, and in particular by bauhaus designers).<br>
      Another possibility is Venus Grotesk.<br>
      Probably one of the best known expressionist typefaces is Neuland, also by Rudolf Koch. It could be used for short headlines (it’s upper case only and also kind of related to Koch Antiqua and Kabel).</p>
      <p>I wouldn’t use the ‘Bauhaus’ font since it’s a 70s typeface, loosely based on experimental Bauhaus typefaces. It would be anachronistic in a post-WWI context.</p>
