    <p>Talented brazilian designer Marina Chaccur designed this beautiful poster featuring Bree, the successful award-winning typeface published in 2008 by TypeTogether. This is the second poster in a series of collectibles we will make available through our website. Posters will be rolled and shipped by snail mail in a tube. (44×70cm, two-colour offset print over Munken Lynx 130gr paper. Price including shipping: €10.00)</p>
    <p>Learn more: <a href="http://www.type-together.com/index.php?action=carro/getMerchandising_3" title="http://www.type-together.com/index.php?action=carro/getMerchandising_3">http://www.type-together.com/index.php?action=carro/getMerchandising_3</a></p>
