    <p>Hello,</p>
    <p>for upcomming design portal (reviewing design, trends) I created this logo series. It stands for 3 different categories: online, offline, brand. Are logos understandable or operate just like cliparts? The problem was, that there is not much space for logo, because portal was designed first. So logo concept had to fit there. At 2th picture you can see how its integrated in the website. </p>
    <p><a href="http://www.kahlkopf.com/files/stylespin.gif" title="http://www.kahlkopf.com/files/stylespin.gif">http://www.kahlkopf.com/files/stylespin.gif</a><br>
    <a href="http://www.kahlkopf.com/files/stylespin_web.jpg" title="http://www.kahlkopf.com/files/stylespin_web.jpg">http://www.kahlkopf.com/files/stylespin_web.jpg</a></p>
