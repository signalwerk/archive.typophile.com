  html: |-
    <p>Something I've noticed recently is the surpringly awful type design used in on-screen graphics on tv shows like the Tonight Show, Ellen, The Today Show, etc. These programs make a fortune (yesterday's New York Times reported that the Today show alone rakes in $180 million per year, or something like that, making it the most profitable show on tv) but their typography looks like something from a high-school newspaper. The opening sequences are usually okay (although the Tonight Show is pretty bad) but any additional type they have to denote segments, highlight contests, etc. looks completely amateurish. I was wondering if this was always the case -- this format of show has been around since the 1960s or earlier. Does anyone have any thoughts or has anyone seen anything written about this?</p>
    <p>(I saw a rerun of a "What's My Line" show from the early 1960s on Nickelodeon and the title design was brilliant... reminiscent of Saul Bass's film-title designs from the same era. It's animated in black &amp; white.)</p>
