    html: "<p>Things were lighter this year than last. Chalk it up to  <br>trimmed marketing budgets or perhaps people's  <br>hesitancy to travel on the anniversary of 11 Sept. <br> <br>Some highlights. <br> <br><b><a href=\"http://www.dgusa.com/\" target=\"_blank\">STEP</a></b> <br>Got a free copy of their September/October issue. A  <br>great magazine. They've moved away from their former  <br>dumbed-down, plug-in tips and software tricks into a  <br>much more intelligent read. There's also a good piece  <br>on <a href=\"http://www.mvbfonts.com/\" target=\"_blank\">Mark van Bronkhorst's</a> <a href=\"http://www.fontshop.com/shop/view_main.cfm?fuseaction=listitems&amp;searchby=package&amp;searchterm=&amp;searchfor=&amp;searchletter=A&amp;view=package&amp;id=C.100316.0.0&amp;designerid=0\" target=\"_blank\">ITC Conduit</a>. <br> <br><b><a href=\"http://www.quark.com\" target=\"_blank\">Quark</a></b> <br>Quark was there, sort of. If you count one guy  <br>occupying a bar stool and laptop stand. \"We don't do  <br>trade shows\" was the rep's explanation of Quark's new  <br>policy. <br> <br>Asking about the upcoming Quark release, he said I'd  <br>be blown away by all the nifty features coming in Quark  <br>6, due Q1, 2003. He quickly added that he'd have to kill  <br>me if he told me all of them. I think he was bluffing.  <br>Regarding OpenType support for the new version: of  <br>course. But don't look for full access to all OT features  <br>until 7.0. Where does that put us, 2006? <br> <br>How could I not feel bad for this guy? He's representing  <br>the market leader in layout software, sitting in the  <br>shadow of the buzzing Adobe pavillion across the aisle.  <br>What these guys need is a serious cash infusion (for  <br>product development and marketing). <br> <br><b><a href=\"http://www.fontreserve.com/\" target=\"_blank\">Font Reserve</a></b> <br>This app looks much cooler than I expected. I've never  <br>tried it, but I'm downloading the <a href=\"http://www.fontreserve.com/products/trial_mac.html\" target=\"_blank\">free trial</a> as I write this. <br>There are the usual features, like creating sets and  <br>creating type sample books--stuff you could print for  <br>reference. But there are some handy features I wasn't  <br>familiar with, like searching or sorting fonts by genre  <br>and foundry.  <br> <br>What I really miss (now that I'm using OS X) is the ATM  <br>Deluxe feature that auto-activates fonts from the  <br>background, even if ATM itself is not open, and  <br>regardless of whether you have a set 'active.' That's  <br>technology you can use.</p>"
