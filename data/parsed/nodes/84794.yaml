    html: <p>This seems to be the bold italic cut of a typeface called ‘Eng Gothic’ (cf. <a href="http://www.whatfontis.com/Eng-Gothic-BoldItalic.font" rel="nofollow">this</a> sample). It is apparently contained in the <a href="http://www.broderbund.com/p-47-clickart-fonts-v5-2009.aspx" rel="nofollow">ClickArt Fonts</a> package by Brøderbund and can also be found on some more or less dubious free font sites.</p>
