  html: |-
    <p>I am looking for a good primer on Global Typography, i.e. the 'ins' and 'outs' of working with multiple translations and language/character sets (English, Chinese, Japanese, Cyrillic, etc)</p>
    <p>could be as simple as a break down of terms: 'what's a sans serif' equivalent called in Chinese simplified? to more technical side of working with fonts across languages (addressing missing characters, accessing and using fonts etc.)</p>
    <p>anyone have some good reference sites or pointers?</p>
    <p>many thanks<br>
    /brad</p>
