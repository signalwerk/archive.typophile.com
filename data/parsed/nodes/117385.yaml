    <p>Dear all,</p>
    <p>My wife's home parish contracted a professional to create a new sign for the church. The work has taken much longer than expected, and the parish is trying to help him to finish. He created ‘one-of-a-kind’ letterforms for the name of the church, but he gave up trying to engrave them in a way that would meet his standards. Is there a font available that would give them an approximation of these letterforms?</p>
