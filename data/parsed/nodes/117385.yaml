      <p>A “Latinized” Church Slavonic alphabet like the letters shown in your draft sign, is much closer to what I believe would be a good interpretation of the Orthodox Church tradition for a for a church sign in a Western country than the parodies found in most of the faux Old Church Slavonic fonts. If you have to use  a font without modification, then I suggest you look at Zamolxis  <a href="http://www.dafont.com/zamolxis-i.font?text=CHRISTSAVIOURORTHODOX" title="http://www.dafont.com/zamolxis-i.font?text=CHRISTSAVIOURORTHODOX">http://www.dafont.com/zamolxis-i.font?text=CHRISTSAVIOURORTHODOX</a><br>
      Maran Orthodox Church <a href="http://www.dafont.com/maran-orthodox-church.font?text=CHRISTSAVIOURORTHODOX" title="http://www.dafont.com/maran-orthodox-church.font?text=CHRISTSAVIOURORTHODOX">http://www.dafont.com/maran-orthodox-church.font?text=CHRISTSAVIOURORTHODOX</a><br>
      or Petra Heidorn's Krasni Fellows <a href="http://www.fontspace.com/cybapee-creations/krasni-fellows" title="http://www.fontspace.com/cybapee-creations/krasni-fellows">http://www.fontspace.com/cybapee-creations/krasni-fellows</a> If you can do modifications then some of the other fonts could be made more Latinized, by for example replacing the mirrored _R_ with an _R_ with the standard Latin orientation.<br>
      Kremlin Orthodox Church <a href="http://www.dafont.com/kremlin-orthodox-church.font?fpp=100&amp;text=CHRISTSAVIOURORTHODOX" title="http://www.dafont.com/kremlin-orthodox-church.font?fpp=100&amp;text=CHRISTSAVIOURORTHODOX">http://www.dafont.com/kremlin-orthodox-church.font?fpp=100&amp;text=CHRISTSA...</a><br>
      Don</p>
