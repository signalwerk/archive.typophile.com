    html: "<p>thanks john, i appreciate your feedback and i agree with your suggestions. especially shortening the descender. now when i look at the \"oab\" of logo b all i see is an excited flourescent snowman. <br> <br>yes i am in vancouver! in case you know anyone else that would be interested (maybe keith would be as well) oscar's is having a logo contest with $500 books as payment for the designer. oscar's is one of my favourite bookstores so that's why i'm doing this in the first place... thanks again for your help: ) </p>"
