    html: "<p>Oh. Andrea, are you in Vancouver? <br> <br>I'm not a good person to judge whether this is a good logo idea overall: I'm not a graphic designer, and my approach to a design problem is simply to work at a single solution until it is perfect, usually ignoring any question of whether a different solution might be better. <br> <br>I think A and C are working much better than B, in both colour and arrangement. Some suggestions for improvement: <br> <br>Shorten the ascender on the lowercase b in the vertical lettering. It sticks out way too far. See how short you can get it and still have a legible b. <br> <br>Adjust the alignment of the three words so that the left side of the O A and B are optically aligned. In your current versions the O is too far right and the B too far left, creating a visual slant. <br> <br>In the A and C arrangment, there is more optical white space below the word 'Art' than above it. See if you can balance this. <br> <br>I think the words look much better closer to the 'spine lettering' as in C. <br> <br>Here is a modified version with these suggestions applied: <br><img src=\"http://www.typophile.com/forums/messages/29/8700.gif\" alt=\"OAB (JH)\"> <br>Finally, I recommend providing two versions, one with 'Vancouver's Art Book Stores' incorporated as in C, and one without this line. Both will be useful.</p>"
    html_clean: "<p>Oh. Andrea, are you in Vancouver? <br> <br>I'm not a good person to judge whether this is a good logo idea overall: I'm not a graphic designer, and my approach to a design problem is simply to work at a single solution until it is perfect, usually ignoring any question of whether a different solution might be better. <br> <br>I think A and C are working much better than B, in both colour and arrangement. Some suggestions for improvement: <br> <br>Shorten the ascender on the lowercase b in the vertical lettering. It sticks out way too far. See how short you can get it and still have a legible b. <br> <br>Adjust the alignment of the three words so that the left side of the O A and B are optically aligned. In your current versions the O is too far right and the B too far left, creating a visual slant. <br> <br>In the A and C arrangment, there is more optical white space below the word 'Art' than above it. See if you can balance this. <br> <br>I think the words look much better closer to the 'spine lettering' as in C. <br> <br>Here is a modified version with these suggestions applied: <br><img src=\"http://www.typophile.com/forums/messages/29/8700.gif\" alt=\"OAB (JH)\"> <br>Finally, I recommend providing two versions, one with 'Vancouver's Art Book Stores' incorporated as in C, and one without this line. Both will be useful.</p>"
