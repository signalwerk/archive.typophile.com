  html: <p>Hello. <br> <br>I have a typeface on my system that is called Enschede. I need to direct a client to where they can buy it, but I am starting to think that the font in question maybe named wrong as I cannot seem to find it anywhere. <br> <br>Any help? <br> <br>Thanks<img src="http://www.typophile.com/forums/messages/83/42396.jpg" alt="enschede.jpg"></p>
