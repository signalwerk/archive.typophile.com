    html: <p>If the font is on your system then you may have some luck examining it yourself.  <br> <br>If you are on a Windows PC, find the font in the fonts folder (in Control Panels) and double click on it. A window will appear that gives information on the font, and, if the font is well made, you will probably find where its from there.  <br> <br>See below for an example. I have highlighted in orange the appropriate place to look. <br> <br><img src="http://www.typophile.com/forums/messages/83/42399.gif" alt="rebuchet type info"></p>
