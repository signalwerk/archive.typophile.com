    html: "<p>Metadox: Paratype offers the Roman of Trooper as <a href=\"http://www.paratype.com/pstore/default.asp?search=Troover&amp;fcode=SU_TRR\" target=\"_blank\"> Troover</a> and <a href=\"http://www.castletype.com/catalog/CastleType_catalog.pdf\" target=\"_blank\"> Jason Castle's version</a> corresponds to Trooper Roman Bold Extended, if I'm not mistaken. For some reason, this font doesn't show up anywhere else on the CastleType website. I e-mailed Mr. Castle about this once a few months ago, but never received a reply.</p>"
