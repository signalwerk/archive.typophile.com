    html: <p>Nice! I only wondered why you did not create 'real' ligatures, not the combined glyphs they are now. I think that especially in the italic this could make a positive aesthetic difference. And perhaps you could fine-tune the fractions, as the fraction bar seems too thick to my eye. Just nitpicking..., nice job and nice price too!</p>
