    <p><img src="http://origin.myfonts.com/s/aw/original/143/0/73216.png" width="500px"></p>
    <p>Motiva Sans has received a major facelift, with revised shapes, all new true italics, small caps, and OT features.</p>
    <p>Until March first, it's available at the old price of 10.00 a piece or 45.00 for the whole family (6 weights: Light, Regular, Bold and Light Italic, Regular Italic and Bold Italic)!</p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/niramekko/motiva-sans/" rel="nofollow">Check it out at MyFonts!</a><br>
    Cheers!</p>
    <p>Rodrigo</p>
