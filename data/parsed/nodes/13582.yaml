    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12015" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Software</a>&nbsp;:&nbsp;Python</strong></p>
    <p>Python is a programming language developed by <a href="/node/add/wiki?edit%5Btitle%5D=Guido%20van%20Rossum" title="Create node &quot;Guido van Rossum&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Guido van Rossum</a>. It was designed to be simple and easy to use and understand. It is used in various type design applications, most notably as the primary macro language for <a href="/node/12240" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontLab</a>. Other tools have been written in python such as <a href="/node/13583" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">RoboFab</a>.</p>
