    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : Python</strong></p>
    <p>Python is a programming language developed by <a href="/wiki/Guido%20van%20Rossum" class="freelinking" rel="nofollow">Guido van Rossum</a>. It was designed to be simple and easy to use and understand. It is used in various type design applications, most notably as the primary macro language for <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a>. Other tools have been written in python such as <a href="/wiki/RoboFab" class="freelinking" rel="nofollow">RoboFab</a>.</p>
    <p><strong>See also:</strong> <a href="/wiki/Python_How-To" class="freelinking" rel="nofollow">Python_How-To</a>, <a href="/wiki/Python%20Scripts" class="freelinking" rel="nofollow">Python Scripts</a>.</p>
