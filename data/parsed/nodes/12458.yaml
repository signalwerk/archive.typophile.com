    <p>i could really use some font suggestions.</p>
    <p>i am in search of a stylish, contemporary looking font to be used for small amounts of body copy in a photography monograph.  </p>
    <p>this font should work well when placed next to another section that is set in Univers Light.</p>
    <p>i would like the font to be clearly and instantly read as separate from the paragraphs set in Univers.</p>
    <p>this font will possibly replace the garamond face used in the PDF sample attached.</p>
    <p>in my mind, i am looking for something like a sturdy but not overbearing slab-serif face - but i could be totally wrong about that and i’m willing to consider anything at this point.</p>
    <p>unfortunately, the client don’t have much of a budget, so whatever it is, it should be inexpensive or free (or perhaps something that i already own that i might have overlooked!)  i know, that is a lame requirement and i am embarrassed to have to mention it, but what can you do??? </p>
    <p>thanks for any help!!</p>
