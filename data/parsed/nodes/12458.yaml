    html: |-
      <p>If you want a contemporary slab serif, try Serifa or PMN Caecilia — the latter seems to be popular lately, but I guess I don’t have a problem with that as I love it. I’ve been using it and TheSans for my own materials (résumé, business cards, etc) lately.</p>
      <p>If you want something that is distinctive and will look nice next to Univers, I humbly suggest either Van Dijck or <a href="/wiki/Zuzana%252BLicko" class="wiki">Zuzana Licko</a>’s Filosofia. Van Dijck may be too delicate for what you’re trying to do, but Filosofia (or another didone) will match the weight and width of Univers well.</p>
