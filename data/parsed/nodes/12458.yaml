      <p>Wow, the whole reason I chose PMN Caecilia was because it was like Clarendon, only more “boring”. I like things that are “boring”. I’m a photographer myself, and call what I do taking “boring pictures of nothing”, which is of course mildly disingenous, but I’ve never found a better name for what I do. In this case, “boring” means “businesslike”. I’m surprised it turned out to be too whimsical, but I suppose I can see what you mean.</p>
      <p>You may already be stuck with Garamond, but on the off chance you aren’t, there’s a <a href="http://www.typophile.com/forums/messages/30/70242.html?1114510192">thread here about Clarendons</a> (started by yours truly). You may find the faces discussed too quirky for your needs, but it’s a pretty good rundown on recent slab serifs. Or you could try Bitstream Charter, which is conservative but squared off and won’t clash too badly with Univers. Hmm...</p>
