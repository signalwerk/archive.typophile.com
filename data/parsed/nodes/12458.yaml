      <p>i’m quite fond of PMN Caecilia as well, and it was one of the first fonts that i tried!  unfortunately, it feels a little too “light” or “whimsical” (for lack of a better word) in this context.</p>
      <p>i had also previously used filosofia, but the client seems to prefer garamond instead.</p>
      <p>i thought i had finally found the perfect font in reform from psy/ops, but that doesn’t seem to fit so well either.</p>
      <p>our deadline is quickly approaching and i might just have to settle for the garamond/univers combo.</p>
