    date: 2010-06-03T23:42:00
    date_raw: 3 Jun 2010 — 11:42pm
    votes: null
    html: |-
      <p>Too many cooks . . . the first version you showed was on the right track. The proportions were strange but that's what was cool about it. Keep whittling it down and you'll end up with a Gotham clone. Pointers are pointers but don't let a bunch of people design it for you or it'll lose all its personality. I've watched a lot of fonts get spoiled or amlost spoiled by committee on Typophile. Everyone here has their own idea of what looks good but if you average it all together it's just a gray mass.</p>
      <p>Don't let beziers design your S for you or you'll end up with a generic S. Try making a an S only using straight lines. Spend an hour moving those points around and testing in words. When you're comfortable with it, then works on beziers on another layer. About half the time I spend on an alphabet is on the S and X . . . tough letters.</p>
    html_clean: |-
      <p>Too many cooks . . . the first version you showed was on the right track. The proportions were strange but that's what was cool about it. Keep whittling it down and you'll end up with a Gotham clone. Pointers are pointers but don't let a bunch of people design it for you or it'll lose all its personality. I've watched a lot of fonts get spoiled or amlost spoiled by committee on Typophile. Everyone here has their own idea of what looks good but if you average it all together it's just a gray mass.</p>
      <p>Don't let beziers design your S for you or you'll end up with a generic S. Try making a an S only using straight lines. Spend an hour moving those points around and testing in words. When you're comfortable with it, then works on beziers on another layer. About half the time I spend on an alphabet is on the S and X . . . tough letters.</p>
