      <p>I would say that is called <em>lettering</em>. Maybe posting on the General Discussions forum a question about resources for lettering would give some result. Typophile <a href="http://typophile.com/node/31391">Charles Borges de Oliveira</a> <a href="http://www.borgeslettering.com/">http://www.borgeslettering.com/</a> does some lettering. I don't think he is the only typophile to do that. By the way, Cabarga's book, <a href="http://www.amazon.com/Logo-Lettering-Bible-Leslie-Cabarga/dp/1581804369">Logo, Font &amp; Lettering Bible</a> used to be a reference here on typophile.</p>
      <p>Here is a typophile thread that may lead to something helpful: <a href="http://typophile.com/node/98612">http://typophile.com/node/98612</a></p>
