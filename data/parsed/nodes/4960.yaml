    html: "<p>I didn't try to 'gauge my own immersive reading', I just read the bloody books. I read them like any other book, and the italics functioned like any other italics: they did their job, they typographically signalled information about the text. <br> <br>[If anything, being a type designer is more likely to be an impediment to comfortable immersive reading of things like upright italics: it makes one more likely to notice something unusual and out of the ordinary. Being a type designer is something one overcomes in order to be a reader.] <br> <br>I disagree with you because I disagree with what you say, not because you're the one saying it. I'm not about the run out and start designing upright italics, because I do think that there is a net benefit to slant: a compound differentiation of letterform and slant  is <i>more</i> effective than a single differentiation of letterform (upright italic) or slant (sloped roman). I also agree that slant generally makes for greater differentiation than letterform. Where I disagree is in how great the differentiation actually needs to be for successful reading: I think a well designed upright italic can be perfectly sufficient in this regard and that slant, while desirable, is far from necessary. I do not think slant is even the 'central attribute of an italic': the central attribute is sufficient differentiation from the roman, however that is achieved.</p>"
