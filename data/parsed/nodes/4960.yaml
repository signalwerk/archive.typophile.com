    html: "<p>Your experience is moot for two reasons: <br>1) You're a type designer. <br>2) Nobody can consciously gauge their own immersive reading. <br> <br>There can really be no doubt that slant is the central attribute of an italic* - everything else (like cursiveness) is secondary. Don't disagree just because I'm the one saying it, John. <br> <br>* In its primary role as an emphatic style. <br> <br>-- <br> <br>That said, sure, an upright italic won't give you problems 95% of the time. But good design is exactly in that last 5%. Otherwise just use Times and Arial, and nobody will [consciously] notice jack anyway. <br> <br>hhp <br></p>"
