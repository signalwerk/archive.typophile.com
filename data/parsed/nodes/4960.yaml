    html: '<p>According to Knuth, CM was created in 1977: <br> <br><a href="http://www.tex.ac.uk/tex-archive/fonts/cm/mf/README" target="_blank">http://www.tex.ac.uk/tex-archive/fonts/cm/mf/README</a> <br> <br>first paragraph. <br> <br>As for the cm sans, it is based on the same Monotype Modern: both cmr10.mf and cmss10.mf (for example) load cmbase.mf, just check it out. <br> <br>CM i think it is the biggest font family, not only "complementary sans and serif". There are more: startin from typewriter endin with funny fibonacci face or upright italic. <br> <br>i found a book typeset in Monotype Modern8A but the pic is useless. maybe someone will buy that book and we all see a comparison: <a href="http://www.arionpress.com/catalog/048.htm" target="_blank">http://www.arionpress.com/catalog/048.htm</a> <br> <br>For a indepth between mm and cm: <a href="http://www.tug.org/TUGboat/Articles/tb22-3/tb72hoenig-modern.pdf" target="_blank">http://www.tug.org/TUGboat/Articles/tb22-3/tb72hoenig-modern.pdf</a></p>'
