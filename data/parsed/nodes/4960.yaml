    html: "<p>First of all, the parallels between music and type are seriously over-rated. Massively. <br> <br>But anyway, I didn't say that type designers have \"no idea\" what their designs look like, just that their consciousness filters things more -and in different ways- on their way \"down\" to the subconscious. This should be pretty obvious. This is why evaluating a text font by merely reading it is not enough. And there's another reason: a font contains many more glyphs than are encountered in any reading session. So reading provides \"deterministic\" evaluation, but not \"mathemetical\" evaluation: for the latter you have to look at each glyph in the font, which is something that doesn't happen in reading. For example, a font can have a wonderful alphanumeric set, but a lousy eszet - and few people will ever realize. <br> <br>-- <br> <br>Some more thoughts about upright italics: the chances that an emphasized word will be noticed is proportional to the length of the word (among other things). We might agree that single-letter words are highly problematic for an upright italic, but there are only two of those in English, and one of them (\"a\") has a structurally different form in cursive, so it's not disasterous (although I might doubt the ability of a reader to appreciate the difference [enough] during immersive reading). And I might further concede that three-letter words are pretty safe. But in English two-letter words are about 20% of text! And I think that's a notable problem. <br> <br>hhp <br></p>"
