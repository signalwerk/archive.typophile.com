    html: <p>Yes, I think so. Minion MM back in 1991 (which also predates ITC Bodoni). <br> <br>Of course, it all depends on what you mean by optical sizes. I suspect that Minion MM was the first digital typeface to have the full range of characters in a range of optical sizes. <br> <br>However, some degree of optical size variation had been done even earlier than this. Adobe Garamond, for instance, had an all caps titling face back in 1989. <br> <br>Of course, Adobe Garamond was a revival. But I see the question of revivals versus originals as rather orthogonal to the question of optical size variation. <br> <br>Regards, <br> <br>T</p>
