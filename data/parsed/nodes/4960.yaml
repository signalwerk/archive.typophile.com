    html: <p>&gt; Some people [...] would disagree <br> <br>There's certainly a fun debate to be had about whether <br>an italic font need necessarily be slanted, but the CM <br>'upright italic' is just the ordinary italic, mechanically <br>unslanted. It has to be seen to be believed. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I can't find a sample online, but you'll see that it's <br>actually (shudder) <i>used</i> in the Zapf article I linked <br>earlier, to set the text "Editor's note" in one of the <br>footnotes. (Such a pity that Texiness and taste seem <br>so inimical to one another.) <br> <br>To be fair to Knuth, I think his intention (aside from <br>the understandable desire to play with his new toy <br>Metafont) was to demonstrate to the typographically <br>innocent that the structural differences between roman <br>and italic forms go beyond mere inclination, and <br>it's certainly a shocking demonstration of that!</p>
