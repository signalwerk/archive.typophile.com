    html: <p>Ah, I've been waiting for Hrant to raise his objection about the dysfunction of upright italics again. I've now read two books set in Martin Majoor's Seria, both using the upright italic for emphasis etc. and I didn't find any problem with it at all. I read the books and my brain processed the italics as italics. I don't think one can form a general rule from this that upright italics are always going to function as well as slanted ones -- surely this depends on the individual design --, but equally one shouldn't denounce upright italics as dysfunctional on a theoretical basis. Go read a book that uses them. Further evidence that our reading ability is good enough to handle most of what we typically throw at it and then some.</p>
    html_clean: <p>Ah, I've been waiting for Hrant to raise his objection about the dysfunction of upright italics again. I've now read two books set in Martin Majoor's Seria, both using the upright italic for emphasis etc. and I didn't find any problem with it at all. I read the books and my brain processed the italics as italics. I don't think one can form a general rule from this that upright italics are always going to function as well as slanted ones -- surely this depends on the individual design --, but equally one shouldn't denounce upright italics as dysfunctional on a theoretical basis. Go read a book that uses them. Further evidence that our reading ability is good enough to handle most of what we typically throw at it and then some.</p>
  - id: 36096
