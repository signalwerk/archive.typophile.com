  html: <p>This is something I've been thinking about lately. <br>What was the first digital typeface to have optical sizes? <br> <br>I think the first digital font to have them was ITC Bodoni <br>(released in 1994, according to <a href="http://www.daidala.com/itcbodoni.html"> Daidala</a>). But, it's a <br>revival. <br> <br>So. What was the first original typeface, created with <br>digital technology, to have optical sizes? <br>Maybe something from Adobe, back in the days of MMs?</p>
  html_clean: <p>This is something I've been thinking about lately. <br>What was the first digital typeface to have optical sizes? <br> <br>I think the first digital font to have them was ITC Bodoni <br>(released in 1994, according to <a href="http://www.daidala.com/itcbodoni.html" class="link-external"> Daidala</a>). But, it's a <br>revival. <br> <br>So. What was the first original typeface, created with <br>digital technology, to have optical sizes? <br>Maybe something from Adobe, back in the days of MMs?</p>
