      <p>How do you say "calm down" in Finnish?</p>
      <p>Melissa, if password-protection is an all-or-nothing proposition (meaning a password can stop people from viewing a PDF, but once they can view it there's no password to stop them from editing it) then you might have to have two versions of the PDF: one that's password-protected and editable, and another that's not password-protected and not editable.</p>
