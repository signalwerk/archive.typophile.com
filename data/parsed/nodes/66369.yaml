    <p>Hi all,</p>
    <p>I have a client who wants an editable PDF that can be saved locally to his desktop so he can email it to reps. He is using Adobe Reader and wants to be able to email them to his sales reps without the reps being able to edit them. I have completed the forms in Adobe LiveCycle ES2 but I'm not sure how to password protect them so only those with the password can edit them. Can anyone offer me some assistance as I haven't found much online pertaining to this and the help section is just confusing me. Thanks for any help!</p>
