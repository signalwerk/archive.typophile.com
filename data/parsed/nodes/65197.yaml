    <p>Logo for a swedish theatre school for kids. The name translates as follows "Åboland" is the name of the county and "Teaterskola" means theatre school.</p>
    <p>Not much intructions from the client. They want some sort of an emblem and that the school theme comes across.</p>
    <p>Been working on a concept that brings out the theatre part, based on the theatre masks you usually see with theatre related things.</p>
    <p>Gonna do some more school based scetches and work on an emblem.</p>
    <p>Any feedback is much appreciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophile_v1_6610.jpg"></div><p></p>
