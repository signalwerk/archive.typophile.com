    html: "<p> JH: <br>&gt;Despite Mr. Stalin's nanofont goofiness above <br> <br>(Actually, it's Comrade Joe, we don't go in for that \"Mr\" stuff) <br> <br>You mean it's not true!? But that's what my source says, and he's never wrong... <br> <br>JH: <br>&gt; I do think that these kinds of atomic  <br>&gt;metaphors  are useful for agate type... <br> <br>For sure, it's similar to some of the trickery you do with type or logos for lowres bitmaps for screen/web design where you don't have the pixels to really do what you need, so you perhaps create shapes/counters \"outside\" the shapes you're actually \"shaping\" to trick the eye into seeing something that isn't really there. <br> <br>And of course the kind of tricks played with sub-pixel positioning. <br> <br>The issue with small type like this is that the distortion to type isn't relative to it's size, it's pretty much a constant. Where 0.05mm ink spread makes no difference at 72pt, it's sure going to have an effect down there at 6pt. </p>"
