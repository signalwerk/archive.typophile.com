s us something to look forward to! <br> <br>&gt; Tobias likened these strangenesses to particle theory <br> <br>Not to be too literal, but let's not forget that we're physical beings in a physical world! <br> <br>I in turn might draw a parallel between the states of matter (solid, liquid, gaseous, plasma) and the states of reading (here with respect to size). I once sketched this rough graph: <br> <br><a href=\"http://www.themicrofoundry.com/other/optic_01.gif\" target=\"_top\" class=\"link-external\">http://www.themicrofoundry.com/other/optic_01.gif</a> <br> <br>It tries to show a correspondence between size and optical compensation (here I mean things like more open counters). Above a certain point size (nominally 24 here) there is no need for compensation at all. Below a certain point size (like 5), the extenders [have to] become so short that you'd break down and use all-caps - at that size immersive reading is virtually impossible anyway. And the segment of least slope (here between 8 and 12) is the most delicate part, where boumas (word shapes) have to be just right. I could elaborate more, but you might be bored senseless already, and it's getting late over here... <br> <br>So let me try to wrap this up: <br>The reason for the non-linearity of the graph is due to the \"fighting-sisters\" nature of Legibility versus Readability: they come into play differently depending on type size (among other things, of course), and together they give up three states of reading: <br>1. Below comfortable immersive reading: here legibility is king (queen?), and x-heights have to swell, for example. <br>2. Immersive reading: readability is more important than legibility - and for example ITC-style x-heights ruin everything. <br>3. Above comfortable reading: legibility is a non-issue (although what might be called \"decipherability\" is key), and readability is moot. What counts most here? What I call \"drama\" (avoiding the potentially misleading \"beauty\"). <br> <br>hhp</p>"
