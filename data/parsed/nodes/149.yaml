    html: "<p>WARNING: I wouldn't want to turn this thread into a discussion of press gain (at least not entirely so), but please allow me this digression of sorts: <br> <br>&gt; the typeface in question would be in the stock listings <br> <br>Oh, good thing you told me - I almost scanned the wrong section. \"Scanned?!\", you ask? Well, I've been obsessed with measuring press gain in newspapers for a while now. This is partly because Nour (Patria's Armenian counterpart) is supposed to end up as the body face for a daily newspaper. Another reason is my fascination with trapping - something not usually needed but potentially very beneficial in a newspaper, *especially* for tiny type like in stock listing... <br> <br>So what I would love to be able to do with TFJ's new font is to superimpose a small snippet of hi-fi outline data over a hi-res scan of actual output. A big favor to ask, maybe, but something I will do once I have the scan for you guys. <br> <br>In the meantime, you can check out the following images: <br> <br>A scan from my \"target\" newspaper, next to a rendering, with measurements: <br><a href=\"http://www.themicrofoundry.com/other/armnews2.gif\" target=\"_top\">http://www.themicrofoundry.com/other/armnews2.gif</a> <br>Point size: 8 <br> <br>This one is not my own comparison; it's from an article by Gurtler &amp; Mengelt in Visible Language: <br><a href=\"http://www.themicrofoundry.com/other/latnewsp.gif\" target=\"_top\">http://www.themicrofoundry.com/other/latnewsp.gif</a> <br>Point size: they don't say. <br> <br>Now, the Armenian sample clearly exhibits much more gain than any western newspaper would find itself stuck with, and even the second image is probably too drastic these days, but as long there's *some* gain, I'd like to measure it. <br> <br>BTW, in case you'd like to see how bad it can get, here's a staggering overlay of Mandel's masterful Colorado font (used for phone books): <br><a href=\"http://www.themicrofoundry.com/other/armnews2.gif\" target=\"_top\">http://www.themicrofoundry.com/other/armnews2.gif</a> <br>Point size: ~4 <br> <br>hhp</p>"
