    date_raw: 10 Apr 2002 — 11:04am
    votes: null
    html: <p> Retina does work successfully even smaller -- we've proofed the fonts down to two point (!), and they still read comfortably. Of course, at this size you're really depending upon reliable printing. Sheet-fed offset on coated stock is a little more hospitable than the maelstrom of the WSJ print facility. <br> <br>Here are some additional high resolution scans of Retina and its predecessor. These are true 1,200 dpi scans, unadjusted. (They're also about 2mb each, so download them at your own peril.) <br> <br>www.typography.com/press/wsj_after_retina.gif <br>www.typography.com/press/wsj_before_retina.gif <br> <br>At some point I'd like to rescan these in color, but these should do for now. <br> <br>Despite Mr. Stalin's nanofont goofiness above, I do think that these kinds of atomic metaphors are useful for agate type. Like Bell Centennial, Retina has a lot of burlesque moves that are incomprehensible in large sizes but essential in small ones. In explaining this to Joe and David at the Journal, Tobias likened these strangenesses to particle theory, noting that when you reduce things down to an atomic scale, the laws of physics break down. I thought it a good comparison. </p>
