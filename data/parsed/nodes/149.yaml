    date_raw: 9 Apr 2002 — 11:00pm
    votes: null
    html: "<p> What a nice press release. And what a nice font. Those fractions are genial - and phenomenally legible at that size - as are the alphabetics. And the font has 10 \"uniwidth\" weights too, wow. But I'm a sucker for technical wizardry... On the other hand, I even like the name! <br> <br>BTW, am I correct in noting that the paper quality is a bit lower now than before, or is that just within expected variance? If it is lower, then that makes Retina even more impressive. Another coolness is the trapping. Look at the bold \"N\" in the zoom view - it's clearly superior to the old Helvetica results. And the characters with small bowls (like the \"R\" - not shown there) have that distinct Bell Centennial thing going on. <br> <br>Anyway, if nobody at THF minds, I'd still like to scan and post a couple of more views of Retina: one showing a short paragraph, the other at very hi res. Tomorrow. <br> <br>TFJ + THF: Keep it up! <br> <br>hhp </p>"
    html_clean: "<p> What a nice press release. And what a nice font. Those fractions are genial - and phenomenally legible at that size - as are the alphabetics. And the font has 10 \"uniwidth\" weights too, wow. But I'm a sucker for technical wizardry... On the other hand, I even like the name! <br> <br>BTW, am I correct in noting that the paper quality is a bit lower now than before, or is that just within expected variance? If it is lower, then that makes Retina even more impressive. Another coolness is the trapping. Look at the bold \"N\" in the zoom view - it's clearly superior to the old Helvetica results. And the characters with small bowls (like the \"R\" - not shown there) have that distinct Bell Centennial thing going on. <br> <br>Anyway, if nobody at THF minds, I'd still like to scan and post a couple of more views of Retina: one showing a short paragraph, the other at very hi res. Tomorrow. <br> <br>TFJ + THF: Keep it up! <br> <br>hhp </p>"
