    html: "<p>OK, first a caveat: my scanner is only 600dpi optical, so anything greater has been interpolated - but it *is* an Agfa. The thing is, 600 is beyond the absolute resolution-fidelity of the reproduction anyway. *However*, gain can still be measured. <br> <br>The first is at 1200dpi, and it shows the good effects of the killer trapping, in some key letters. It also shows how the lc \"g\" has been reduced in the x-height to make more room for its descender. <br>(~250K) <a href=\"http://www.themicrofoundry.com/other/retina_1.gif\" target=\"_top\">http://www.themicrofoundry.com/other/retina_1.gif</a> <br>Note: I've applied some gentle Levels, Unsharp Masking, and Posterize. <br> <br>The second is at 2400dpi, and this is the one I would like very much to be able to superimpose the outlines. If anybody could pass this request to TFJ for his consideration, I'd be very grateful. <br>(~300K) <a href=\"http://www.themicrofoundry.com/other/retina_2.gif\" target=\"_top\">http://www.themicrofoundry.com/other/retina_2.gif</a> <br>Note: This is a raw scan, just posterized down to 128 shades. <br> <br>The third shows a rare text block in Retina (600dpi). WSJ is till using Helvetica for most of their tiny text blocks - but maybe this was a test to see if Retina could replace it wholesale. <br>(~200K) <a href=\"http://www.themicrofoundry.com/other/retina_3.gif\" target=\"_top\">http://www.themicrofoundry.com/other/retina_3.gif</a> <br>Note: Tweaked as #1 above. <br> <br>---- <br> <br>What's really interesting about Retina is this: <br>If you consider that optimization for small sizes and press gain goes hand-in-hand with a certain \"funkiness\" in letterforms (like severe trapping, and exagerated counters - look at the lc \"e\"), it looks to me like Retina actually has a lot more room \"down below\". In effect, among the three lower limits (reproduction fidelity, font features and reader acuity), Retina removes the font issue: it could be used even much smaller than in the WSJ, were it not for limit #1, but especially #3. <br> <br>hhp</p>"
    html_clean: "<p>OK, first a caveat: my scanner is only 600dpi optical, so anything greater has been interpolated - but it *is* an Agfa. The thing is, 600 is beyond the absolute resolution-fidelity of the reproduction anyway. *However*, gain can still be measured. <br> <br>The first is at 1200dpi, and it shows the good effects of the killer trapping, in some key letters. It also shows how the lc \"g\" has been reduced in the x-height to make more room for its descender. <br>(~250K) <a href=\"http://www.themicrofoundry.com/other/retina_1.gif\" target=\"_top\" class=\"link-external\">http://www.themicrofoundry.com/other/retina_1.gif</a> <br>Note: I've applied some gentle Levels, Unsharp Masking, and Posterize. <br> <br>The second is at 2400dpi, and this is the one I would like very much to be able to superimpose the outlines. If anybody could pass this request to TFJ for his consideration, I'd be very grateful. <br>(~300K) <a href=\"http://www.themicrofoundry.com/other/retina_2.gif\" target=\"_top\" class=\"link-external\">http://www.themicrofoundry.com/other/retina_2.gif</a> <br>Note: This is a raw scan, just posterized down to 128 shades. <br> <br>The third shows a rare text block in Retina (600dpi). WSJ is till using Helvetica for most of their tiny text blocks - but maybe this was a test to see if Retina could replace it wholesale. <br>(~200K) <a href=\"http://www.themicrofoundry.com/other/retina_3.gif\" target=\"_top\" class=\"link-external\">http://www.themicrofoundry.com/other/retina_3.gif</a> <br>Note: Tweaked as #1 above. <br> <br>---- <br> <br>What's really interesting about Retina is this: <br>If you consider that optimization for small sizes and press gain goes hand-in-hand with a certain \"funkiness\" in letterforms (like severe trapping, and exagerated counters - look at the lc \"e\"), it looks to me like Retina actually has a lot more room \"down below\". In effect, among the three lower limits (reproduction fidelity, font features and reader acuity), Retina removes the font issue: it could be used even much smaller than in the WSJ, were it not for limit #1, but especially #3. <br> <br>hhp</p>"
