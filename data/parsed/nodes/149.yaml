    html: "<p>&gt; www.typography.com/press/wsj_after_retina.gif <br> <br>First, thanks for that scan. It's much much better than mine (no surprise). <br> <br>I've taken the liberty to do two things with it: <br> <br> <br>1. Crop out this string: <br> <br><a href=\"http://www.themicrofoundry.com/other/retina_4.gif\" target=\"_top\">http://www.themicrofoundry.com/other/retina_4.gif</a> <br> <br>If TFJ is indeed \"listening\", I'd like to revise/downgrade my request for outlines to just those three letters (at that weight, of course). If it doesn't happen, no biggie - if it happens, super nice of him. <br> <br>BTW, it's interesting to note that some of the trapping is still visible - a sure indication that Retina has more room \"below\". <br> <br> <br>2. Splice together a comparison of pre and post numerals: <br> <br><a href=\"http://www.themicrofoundry.com/other/retina_5.gif\" target=\"_top\">http://www.themicrofoundry.com/other/retina_5.gif</a> <br> <br>I'll note again that the quality of the paper/reproduction seems lower in the Retina sample: look at the decimal points (which I'm presuming are rigid rectangles in the outlines). <br> <br>But the point of this comparison is the *structures* of the numerals, and Retina's are so superior to Helvetica's (while remaining stylistically homogenous), it's not even funny. <br> <br>---- <br> <br>Thinking some more about what I previously wrote concerning the three \"lower limits\" of legibility (with respect to size), I realized that the untapped potential of Retina (I mean untapped by WSJ) isn't really in terms of size (especially considering that the average WSJ reader is more likely to have faltering vision, being more \"senior\"), but more in terms of fidelity (or actually, lack of it): TFJ has made a font which can work well in much poorer reproduction conditions than we're seeing here. Now, a trapping axis would be *so* nice, but at least its [apparent] absence gives us something to look forward to! <br> <br>&gt; Tobias likened these strangenesses to particle theory <br> <br>Not to be too literal, but let's not forget that we're physical beings in a physical world! <br> <br>I in turn might draw a parallel between the states of matter (solid, liquid, gaseous, plasma) and the states of reading (here with respect to size). I once sketched this rough graph: <br> <br><a href=\"http://www.themicrofoundry.com/other/optic_01.gif\" target=\"_top\">http://www.themicrofoundry.com/other/optic_01.gif</a> <br> <br>It tries to show a correspondence between size and optical compensation (here I mean things like more open counters). Above a certain point size (nominally 24 here) there is no need for compensation at all. Below a certain point size (like 5), the extenders [have to] become so short that you'd break down and use all-caps - at that size immersive reading is virtually impossible anyway. And the segment of least slope (here between 8 and 12) is the most delicate part, where boumas (word shapes) have to be just right. I could elaborate more, but you might be bored senseless already, and it's getting late over here... <br> <br>So let me try to wrap this up: <br>The reason for the non-linearity of the graph is due to the \"fighting-sisters\" nature of Legibility versus Readability: they come into play differently depending on type size (among other things, of course), and together they give up three states of reading: <br>1. Below comfortable immersive reading: here legibility is king (queen?), and x-heights have to swell, for example. <br>2. Immersive reading: readability is more important than legibility - and for example ITC-style x-heights ruin everything. <br>3. Above comfortable reading: legibility is a non-issue (although what might be called \"decipherability\" is key), and readability is moot. What counts most here? What I call \"drama\" (avoiding the potentially misleading \"beauty\"). <br> <br>hhp</p>"
