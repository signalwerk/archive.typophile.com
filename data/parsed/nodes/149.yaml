    html: "<p>Were you thinking I forgot?  :-) <br> <br>So I scanned the Retina specimen from \"Language, Culture, Type\"*, and did the compositing myself: <br><a href=\"http://www.themicrofoundry.com/other/retina_4a.gif\" target=\"_top\">http://www.themicrofoundry.com/other/retina_4a.gif</a> <br> <br>* <a href=\"http://www.atypi.org/lct/\" target=\"_top\">http://www.atypi.org/lct/</a>  Worth every penny. <br> <br>It's not the best quality (and I hope I chose the correct weight - the Agate Five), but hopefully it gives you some idea. <br> <br>Thinking about this some more, I feel more comfortable in restating that Retina goes further than it needs to in this specific commission/application (the WSJ stock listings), but that *does* mean it can survive even worse repro conditions and/or smaller sizes. <br> <br>hhp</p>"
    html_clean: "<p>Were you thinking I forgot?  :-) <br> <br>So I scanned the Retina specimen from \"Language, Culture, Type\"*, and did the compositing myself: <br><a href=\"http://www.themicrofoundry.com/other/retina_4a.gif\" target=\"_top\" class=\"link-external\">http://www.themicrofoundry.com/other/retina_4a.gif</a> <br> <br>* <a href=\"http://www.atypi.org/lct/\" target=\"_top\" class=\"link-external\">http://www.atypi.org/lct/</a>  Worth every penny. <br> <br>It's not the best quality (and I hope I chose the correct weight - the Agate Five), but hopefully it gives you some idea. <br> <br>Thinking about this some more, I feel more comfortable in restating that Retina goes further than it needs to in this specific commission/application (the WSJ stock listings), but that *does* mean it can survive even worse repro conditions and/or smaller sizes. <br> <br>hhp</p>"
