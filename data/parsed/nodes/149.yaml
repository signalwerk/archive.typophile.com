  html: <p>Pick up a copy of the Wall Street Journal tomorrow, early, before it sells out. WSJ is supposed to unveil its redesign April 9. <br> <br>This paper is known as a 'financial' newspaper, but less known is the fact that WSJ has the best daily feature writing in the country on a consistent basis. <br> <br>Now, maybe design to match. <br> <br>I was worried that WSJ was going to become another horrid McPaper, the USA Today. But then I read that the redesign is being done by Garcia Media. <br> <br>bj <br> <br>Here are a few links. <br> <br><a href="http://www.ojr.org/ojr/business/1017788129.php" target="_top">http://www.ojr.org/ojr/business/1017788129.php</a> <br> <br><a href="http://www.medialifemagazine.com/news2001/dec01/dec03/5_fri/news1friday.html" target="_top">http://www.medialifemagazine.com/news2001/dec01/dec03/5_fri/news1friday.html</a> <br> <br><a href="http://www.garcia-media.com/in_the_press/examiner.html" target="_top">http://www.garcia-media.com/in_the_press/examiner.html</a></p>
