      <p>Talk about a coincidence -- I was looking for the typeface on the <a href="https://web.archive.org/web/20150123092125/http://www.impawards.com/2010/red_riding.html" rel="nofollow">Red Riding</a> movie poster today (new episode of <a href="https://web.archive.org/web/20150123092125/http://fontfeed.com/archives/tag/movie-posters/" rel="nofollow">ScreenFonts</a> in the works) and it turned out to be OPTI Favrile. Now I feel less bad about not finding it. ;^)</p>
      <p>The closest match I could find was <a href="https://web.archive.org/web/20150123092125/http://www.fontshop.com/fonts/downloads/linotype/trump_mediaeval_std_complete_family_value_pack/" rel="nofollow">Trump Mediaeval</a>, but that's already quite a long shot. Anybody knows of other alternatives?</p>
