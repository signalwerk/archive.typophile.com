      <p>Castcraft, aka Type Founders of Chicago, moved decades ago from Hubbard St in Chicago to a close-in suburb (Skokie? Niles?) and was still operating within the past few years when I happened to drive by. I failed to find any current incarnation, but they used several names even years ago as a prominent pirate. Besides pirated fonts (Typositor to later, generally poor digital), they were a big metal vendor (I have a partial metal set of Helvetica gifted as they left downtown in the ’70s), and also had a guy (whose name escapes me) who did fabulous high-end signage, from sand-blasted glass to the created-on-building inscribed metal logo for a well-known Michigan Ave mall. Longtime owner Manny Kreiter died in 2005, but whether Boomie or any of the others who may still be around kept it going is unknown.</p>
      <p>Aside from simply having ANY version of their many offerings, most would consider their collection worthless. Anyone who has a digital "OPTIfont" and a font editor can readily view the problems, including usually several times too many Bezier points within any character. I counted 78 control points on a minimal character, for instance, that should have had less than a dozen.</p>
