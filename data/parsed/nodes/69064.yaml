      <p>Was just looking for a cut of Thorne Shaded I've used and found it was theirs. Seems I have the entire Opti-Fonts library.</p>
      <p>Say what you will about the quality of their renderings, at least they included the entire character set. The currently available cut lacks punctuation. Huh?</p>
      <p>That said; I was fortunate in passing through Chicago 10 years ago (my how time flies) to phone Boomie, and to take a walk through the building. Having bought foundry type from them in the past, I was keen to see.</p>
      <p><a href="http://www.flickr.com/photos/interrobang918/sets/72157594426247688/">http://www.flickr.com/photos/interrobang918/sets/72157594426247688/</a></p>
      <p>What I regret having missed photographing was the wall of pigeon-holes filled with typositor film spools. If my memory serves, it had to have been 50 x 50 grid with 3' x 3" cubbies, each with a different face. Boomie's nephew... Tracy? laughed and asked if I wanted to buy them. Thanks, but no.</p>
      <p>In a back room was where he worked using machines to cut plexiglass signage. </p>
      <p>An undistinguished end to the work of some at least resourceful, if ahem, unethical, entrepreneurs.</p>
      <p>michael babcock<br>
      interrobang letterpress</p>
