      <p>Talk about a coincidence -- I was looking for the typeface on the <a href="http://www.impawards.com/2010/red_riding.html">Red Riding</a> movie poster today (new episode of <a href="http://fontfeed.com/archives/tag/movie-posters/">ScreenFonts</a> in the works) and it turned out to be OPTI Favrile. Now I feel less bad about not finding it. ;^)</p>
