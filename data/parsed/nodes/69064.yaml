      <p>Favrile was also digitized as "Fascinate" in the NovelFonts collection done for the Expresiv Ornate font collection sold by Tiger Direct in the mid-90's (which I have). There are samples of it, with its italic, in my <a href="https://web.archive.org/web/20150123092125/http://www.bowfinprintworks.com/SerifGuide/serifsearch.php" rel="nofollow">Serif Font ID Guide</a>. Notes there show it was also digitized as "Francois" by Serials.</p>
      <p>- Mike Yanega</p>
