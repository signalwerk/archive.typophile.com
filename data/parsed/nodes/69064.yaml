    <p>Hi all --</p>
    <p>Does anyone know what became of Castcraft fonts, makers of the OPTI typefaces? I just used one in a project and wanted to provide my client a way to purchase their own copy, but it looks like Castcraft is no longer around. Is someone else handling the OPTI fonts, or are they orphans now?</p>
    <p>thanks,<br>
    Meredith</p>
