    html: |-
      <p>Ah ha, very clever. (thanks!)</p>
      <p>But no fair resorting to the appropriate unicode block.  :o) (where's the imagination?)</p>
      <p>I have noticed in a number of fonts designed for signage, arrows are placed in arbitrary locations, which normally contain glyphs that are very unlikely to be needed on a sign. I'll try the unicode 2190 arrows block and see how it works out but, I had always assumed there was a reason for replacing other glyphes with arrows instead of using the appropriate unicode block. </p>
      <p>in my experience, sign shops and many sign designers aren't all that type-savvy, and software they use can be limiting where type is concerned, except when it comes to fancy new ways to distort it. I want to place arrows where they can be found easily on any type pallet or with a simple key stroke combination.</p>
