    <p>K.A.B.K., or <em>Koninklijke Academie van Beeldende Kunsten,</em> in Dutch.</p>
    <p>Located in The Hague (<em>Den Haag,</em>) The Netherlands.</p>
    <p><a href="http://www.kabk.nl/-/en" target="_blank" rel="nofollow">www.kabk.nl/-/en</a></p>
