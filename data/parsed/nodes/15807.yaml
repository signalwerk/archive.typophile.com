      <p>FontShop carries <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=avant%20garde">Avant Garde Gothic</a> from three vendors. Pictured (welcome back Typophile image upload!) are all three versions of "Avant Garde Gothic Book" rendered at 40pt. Note that the E+F and ITC versions are identical in size, weight and spacing, whereas the Monotype version differs quite a bit. At bottom is the <a href="http://www.fontshop.com/showfont.cfm?fid=EF.101895.0.0">Avant Garde Gothic Alternates</a> by Scangraphic (now owned by E+F). It matches the E+F and ITC versions perfectly.</p>
      <p><img src="/sites/default/files/old-images/Avant Garde Gothic - ITC.png"><br><a href="http://www.fontshop.com/showfont.cfm?fid=ITC.119137.0.3">Avant Garde Gothic</a> by ITC</p>
      <p><img src="/sites/default/files/old-images/Avant Garde Gothic - EF.png"><br><a href="http://www.fontshop.com/showfont.cfm?fid=EF.371.0.1">Avant Garde Gothic</a> by Elsner+Flake</p>
      <p><img src="/sites/default/files/old-images/Avant Garde Gothic - CA.png"><br><a href="http://www.fontshop.com/showfont.cfm?fid=C.7.0.1">Avant Garde Gothic</a> by Monotype Imaging</p>
      <p><img src="/sites/default/files/old-images/Avant Garde Gothic Alt - SG.png"><br><a href="http://www.fontshop.com/showfont.cfm?fid=EF.101895.0.2">Avant Garde Gothic Alternate</a> by Scangraphic</p>
