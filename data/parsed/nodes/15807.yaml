      <p>FontShop carries <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=avant%20garde" rel="nofollow">Avant Garde Gothic</a> from three vendors. Pictured (welcome back Typophile image upload!) are all three versions of "Avant Garde Gothic Book" rendered at 40pt. Note that the E+F and ITC versions are identical in size, weight and spacing, whereas the Monotype version differs quite a bit. At bottom is the <a href="http://www.fontshop.com/showfont.cfm?fid=EF.101895.0.0" rel="nofollow">Avant Garde Gothic Alternates</a> by Scangraphic (now owned by E+F). It matches the E+F and ITC versions perfectly.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Avant Garde Gothic - ITC.png"></div><br>
      <a href="http://www.fontshop.com/showfont.cfm?fid=ITC.119137.0.3" rel="nofollow">Avant Garde Gothic</a> by ITC<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Avant Garde Gothic - EF.png"></div><br>
      <a href="http://www.fontshop.com/showfont.cfm?fid=EF.371.0.1" rel="nofollow">Avant Garde Gothic</a> by Elsner+Flake<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Avant Garde Gothic - CA.png"></div><br>
      <a href="http://www.fontshop.com/showfont.cfm?fid=C.7.0.1" rel="nofollow">Avant Garde Gothic</a> by Monotype Imaging<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Avant Garde Gothic Alt - SG.png"></div><br>
      <a href="http://www.fontshop.com/showfont.cfm?fid=EF.101895.0.2" rel="nofollow">Avant Garde Gothic Alternate</a> by Scangraphic<p></p>
