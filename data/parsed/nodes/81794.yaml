    html: |-
      <p>You don't use kerning in a monospace font, because it defeats the purpose.</p>
      <p>Proportions: an x-height of 50% of ascender is very small, especially for a design like this. So I would shoot for very wide forms; maybe start with a totally circular lowercase letter "oh" and see how much narrower you'd like to make it, working with the rest of the lc in parallel. A generous width will also help the unusually tall caps and numerals (which I presume also need to be at cap/ascender height) not to look too narrow/cramped.</p>
      <p>BTW:<br>
      - What about the descenders?<br>
      - The "t" usually doesn't [need to] go to full ascender height; and especially in a font with a very small x-height that will look very idiosyncratic.</p>
      <p>hhp</p>
