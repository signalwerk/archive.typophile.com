  html: |-
    <p>Hello.<br>
    I've been requested to design a monospace font on very tight requirements. So:</p>
    <p>    It needs to be Sans-serif, except on the 1, I,i and l characters.<br>
        The height of the uppercase letters needs to be at the same level of the top of the ascender (example: T and t letters need to have the same height)<br>
        The x-height (height of the lower case letters without ascender nor descender) needs to be one half of uppercase letters (example: the letter a needs to have half the height of A; also the letter a nees to be half the height of d)</p>
    <p>So, the question is:</p>
    <p>    What proportion do you recommend me for relation between the x-height and width (or between cap-height and width - it will be exactly twice)?<br>
        How much should I give for kerning ? Seems to me it should be said in terms of proportion relative to width, or x-height or cap-height.</p>
    <p>Thanks in advance,<br>
    Sérgio</p>
