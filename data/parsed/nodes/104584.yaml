    <p>I'm trying to id the typeface used in the Spokesman-Review newspaper in 1893. It's still (roughly) the same logo we use today, but I think it may actually have been a real type and not a one-off drawing like many others. Thoughts?</p>
    <p><img src="http://i.imgur.com/swIBdf0.png"></p>
