    html: <p>There is at least some weight problems between heavy e s and others letters. The e don't fit very well with the rest. The weight structure of it is quite different from p, perhaps use same way to built them. (oblique axis of e compared to vertical axis of p). Dots of the i are little too close. <br> <br>And Forge will be indeed better in a Sans, perhaps better little more far from the bottom of the baseline of the ellipsis word.</p>
