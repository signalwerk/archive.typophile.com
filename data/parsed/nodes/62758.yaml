      <p>Ok, for the interested:<br>
      Following should work, cheers</p>
      <p><code><br>
      from robofab.world import CurrentFont</code></p>
      <p>myFont = CurrentFont()<br>
      print myFont.info.postscriptFullName</p>
      <p>myGlyph = myFont.keys</p>
      <p>for myGlyph in myFont:<br>
      &gt; print myGlyph.name<br>
      &gt; myGlyph.autoContourOrder()<br>
      &gt; myGlyph.correctDirection()<br>
      &gt; &gt; for myContours in myGlyph:<br>
      &gt; &gt; myContours.autoStartSegment()<br>
      &gt; myGlyph.update()</p>
      <p>print "done now"<br>
      </p>
