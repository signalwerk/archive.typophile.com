  html: |-
    <p>Hi guys, </p>
    <p>Just keep getting error messages after running the following code:</p>
    <p><code><br>
    from robofab.world import CurrentFont</code></p>
    <p>myFont = CurrentFont()</p>
    <p>for myGlyph in myFont:<br>
    	print myGlyph.name<br>
    	myGlyph.autoContourOrder()<br>
    	myGlyph.correctDirection()<br>
    	myGlyph.update()<br>
    	for myContours in myGlyph.contours:<br>
    		myContours.autoStartSegment()</p>
    <p>print "done now"<br>
    </p>
    <p>This is the error message:<br>
    <code><br>
    Traceback (most recent call last):<br>
      File "", line 16, in ?<br>
      File "/System/Library/Frameworks/Python.framework/Versions/2.3/lib/python2.3/site-packages/RoboFab/robofab/objects/objectsBase.py", line 2129, in autoStartSegment<br>
        on = segment.onCurve<br>
      File "/System/Library/Frameworks/Python.framework/Versions/2.3/lib/python2.3/site-packages/RoboFab/robofab/objects/objectsBase.py", line 2330, in _get_onCurve<br>
        return self.points[-1]<br>
      File "/System/Library/Frameworks/Python.framework/Versions/2.3/lib/python2.3/site-packages/RoboFab/robofab/objects/objectsFL.py", line 1942, in _get_points<br>
        node = self._node<br>
      File "/System/Library/Frameworks/Python.framework/Versions/2.3/lib/python2.3/site-packages/RoboFab/robofab/objects/objectsFL.py", line 1880, in _get__node<br>
        return glyph.nodes[self._nodeIndex]<br>
    IndexError: list index out of range<br>
    </code></p>
    <p>The weird thing is (after running it a second time) it will not bump into the same problem again, but rather continues to the next problem, if that makes sense. After a while the script runs fine. Really have no clue here.</p>
    <p>Thanks,</p>
    <p>Bruno</p>
