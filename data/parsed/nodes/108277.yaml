  html: |-
    <p>Hi guys</p>
    <p>Just released my latest typeface - Port Vintage - expanded upon the original Port.</p>
    <p>Port Vintage is a new typeface expanded upon the original Port typeface, released in 2013, and being an experimental Didone typeface with a modern twist, inspired by the well known forms of typography masters such as Bodoni and Didot and the exuberance and elegance of calligraphy typefaces.</p>
    <p><img src="https://m1.behance.net/rendition/modules/95184531/disp/f5b98f6f07c41244f67ef6ffee6e7e9f.jpg"><br>
    <img src="https://m1.behance.net/rendition/modules/95184533/disp/bed052e97cf359baefec8c1848895e47.jpg"><br>
    <img src="https://m1.behance.net/rendition/modules/95184535/disp/d3b19cdb9fb8ffa6968a4d98c833cf6a.jpg"></p>
    <p>Check the full presentation at <a href="https://www.behance.net/gallery/Port-Vintage/13714003" title="https://www.behance.net/gallery/Port-Vintage/13714003">https://www.behance.net/gallery/Port-Vintage/13714003</a> and I hope you enjoy it!</p>
