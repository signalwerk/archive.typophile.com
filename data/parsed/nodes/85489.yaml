    html: |-
      <p>Hi Stacy,<br>
      It seems like a custom lettering with mixed styles.<br>
      Even the LC 'l' which is present twice is different on each instance.</p>
      <p>I can only suggest some starting points:</p>
      <p>=&gt; For /l/d/w/l/i/n: Flange BQ (<a href="http://new.myfonts.com/search/Flange+bq/fonts/" title="http://new.myfonts.com/search/Flange+bq/fonts/">http://new.myfonts.com/search/Flange+bq/fonts/</a>)<br>
      or Llewelyn Heavy SF</p>
      <p>=&gt; For /a/s:   EdwardianEF ExtraBold</p>
      <p>=&gt; For N: Articula Display SSi [Regular]</p>
      <p>I found the alternatives using Find my Font utility: <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a><br>
      Fivos</p>
