  html: |-
    <p>I've been relentlessly researching and analyzing the font used in the logo for a New Orleans restaurant which closed some years ago, but which has recently reopened and asked me to help with their website and screen printing. Problem is no one knows the font of the copy of the logo they've provided, who made it, how or when. I'm not even sure it's all one font. Can anyone help?<br>
    Thanks in advance. I've all but given up hope.<br>
    Stacy</p>
