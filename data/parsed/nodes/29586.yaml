    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Horatio_5425.gif"></div><p></p>
    <p>So, if you had to pair Horatio with some other typeface, what would you use?<br>
    Sans, serif, script - I'm open to any suggestions.</p>
    <p>I have a logo set in Horatio, and need to set a slogan under it but I haven't<br>
    found any typeface that I think goes well with Horatio.<br>
    The first thought was a geometric slab serif, but again, the results have<br>
    been quite dissapointing.</p>
    <p>Any ideas?</p>
