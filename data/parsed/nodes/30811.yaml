    html: <p>Thanks. As I rather suspected. Good to know I was right. And I think Nomprull should have had the stress on the first syllable, not the second. You don't hear it quite so often these days, of course, but when you want get someone to insert a line space that is less than a whole Pica, it's quite a useful term.</p>
