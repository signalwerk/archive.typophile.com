      <p>The creolization debate in regard to Middle English depends largely on how latitudinarian one's theory of creolization is, and thus how little change one requires to consider something to be a creole language. The proponents tend to take the view that any structural change that happens in a contact situation can be seen as the result of creolization, while the opponents tend to take the view that a change shouldn't be seen as creolization unless it is part of a package of total structural change.</p>
      <p>Middle English has been argued to be a result of creolization of Old English with either Old Norse (Vikings) or Norman Old French (Normans), or in the most extreme (Bailey and Maroldt) version of the hypothesis, both (plus Ile-de-France French due to later medieval contact) in successive stages. The strongest case can be made for Old Norse, which had much more effect on grammar and core vocabulary than French did. But it's highly debatable among linguists whether that effect should be considered creolization, particularly since Old English and Old Norse were so closely related.</p>
    html_clean: |-
