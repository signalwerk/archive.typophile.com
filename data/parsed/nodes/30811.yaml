      <p>David, thanks for your interesting window to the history of the evolution of English. I didn't know the history, and I wrote that English is a Creole partly in jest. I see from you there is in fact a serious scholarly debate about it. </p>
      <p>My wife speaks a real Creole, and I've visited the place where she grew up, so I've been exposed a bit to the real thing. There are some striking differences between the structure of English and the kind of Creole my wife speaks, but also striking similarities. The Creole she speaks is much more dominantly French in origin. As Nick notes, the dominant source of the most commonly used words in English is Germanic. However there is huge amount of French, with estimates on the internet ranging from 30% to 60%. For example, the previous two sentences are about half/half Germanic and French origin, I am guessing.  </p>
      <p>The similarity of my wife's Creole and English is that a lot of the  conjugation of French is wiped out. English is much less inflected than German. In this <a href="http://www.chass.utoronto.ca/~cpercy/courses/6361ryan.htm" rel="nofollow">interesting review article</a> on the debate over English as a Creole, the author notes that a defining characteristic of a Creole is that it started as a 'pidgin' language, a language of underlings trying to speak the  language of foreign overlords, and acquiring their vocabulary with a radically simplified grammar, based on their own language of origin.   </p>
      <p>According to the wikipedia article on <a href="http://en.wikipedia.org/wiki/Inflection" rel="nofollow">Inflection</a>, Old English was inflected to a similar extent as German, but lost inflection in the transition to Middle English. This makes me suspect that a 'pidgin' French created by Old English speakers trying to speak French was indeed a factor. However, the article on inflection also notes that the current Scandinavian languages also lost their inflection, which Old Norse had. So there may be another process at work. </p>
      <p>I would be interested to know the theories of why English and Scandinavian languages became less inflected. I see the references in the Wikipedia article, but won't be going to them. I have this font to finish :)</p>
