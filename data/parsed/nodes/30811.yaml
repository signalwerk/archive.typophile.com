      <p>To bring things back to type, William Caslon junior (the Caslon who cast the ‘Egyptian’ type) advertised ‘Sanspareil’ (or maybe ‘Sans Pareil’) types, that is big types cast in a new kind of matrix, in 1810.</p>
      <p>‘Sanspareil’ means the same as ‘Nonesuch’, or indeed ‘Nonpareil’. (Someone ordered a little italic called ‘la Non Pareille’ from Robert Granjon in 1551.) The French 80-gun ship <em>Sanspareil</em> was captured on 1 June 1794, and became a ship of the same name in the Royal Navy. The Sanspareil Theatre opened in the Strand in London in 1806 and kept the name until 1819, when it changed to the Adelphi. And the <em>Sans Pareil</em> steam locomotive was the runner up to Stephenson’s <em>Rocket</em> in the Rainhill trials of 1829 which introduced the railway age. </p>
      <p>I suspect that this was how the Sans of Sans-Serif got into the language.</p>
