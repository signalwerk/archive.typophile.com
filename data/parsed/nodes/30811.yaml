      <p>I'm convinced, James.</p>
      <p>***</p>
      <p>All this talk about sans begs the question of "serif".</p>
      <p>If "sans" was a trendy French word in the early 1800s, did English speakers think that "serif" was a French or Oriental word, and pronounce both with long vowels in proper "foreign" manner (rhymes with Omar Sharif) --or with short vowels as is the norm (in my experience) today?</p>
      <p>If "serif" was derived from the Dutch schreef (line), pronounced laboriously in two syllables as it is read, then the original pronunciation of sans serif was probably with long "a" and "i", in an impressively erudite manner -- maybe with the tongue slightly in cheek.</p>
      <p>Hence, such a magnificent term for so lowly an artefact is a Euphemism, and, through its preposterous pedantry, an in-joke -- a parody of the pretension with which merchants dress up their most humble wares.</p>
