      <p><cite>I would be interested to know the theories of why English and Scandinavian languages became less inflected.</cite></p>
      <p>There's a general tendency over time for languages to add new features and simplify old ones all the time; for example in English over the past several generations the number of derivational affixes in colloquial use has increased through borrowing from Latin and Greek (e.g., <em>hyper-</em>), while subjunctives seem to be dying out in colloquial speech. How likely something is to resist the tendency to simplify depends on things like how much it's used and whether it's supported by clear sound patterns or parallel grammatical structures within the language. In the Germanic languages, accent tends to be toward the start of the word but the inflections are mostly at the end, and unstressed parts of the word are more likely to simplify, other things being equal. In this respect German and especially Icelandic are the odd ones in retaining their inflection systems.</p>
      <p>For English, you can take your pick of two possibilities: either creolization or this normal simplification process. The simplification of Middle English seems to have occurred earliest and most thoroughly in northern England, where the most Viking settlement had occurred, but it has also been pointed out that the sound system in northern Old English seems already to have been changing in ways that gave less support to the inflection system. I'm sure the question will still be wide open when you get your font done :)</p>
      <p><cite>For example, the previous two sentences are about half/half Germanic and French origin, I am guessing.</cite></p>
      <p>There's a lot of Latin in modern English too (meaning words that came into English directly from Latin rather than via Old French). In those two sentences, I get the following (omitting Nick's name, which comes from Greek):<br>
      from Old English: as, the, of, most, -ly, in, English, is, however, there, French, with, on, net, from, thirty, to, sixty<br>
      from French: note, source, common, use, huge, amount, range<br>
      from Latin: Germanic, estimate, inter-, percent<br>
      from either Latin or French: dominant</p>
      <p>But your general point is quite right - the Latin words tend to be "educated" terminology, while the French words are basic functional vocabulary and quite pervasive in the language.</p>
      <p>Part of the question that's debated among linguists, as far as I can tell as an outsider, is whether you see a creole language as a new creation or creolization as a process that happens to existing languages. The thing that makes English different from classic creole languages like those of the West Indies is that there's quite a lot of continuity in the grammar as well as in core vocabulary from Old English. Some things were simplified, like noun inflections (from four cases to one and a half) and person-marking in verbs (from four categories to two), but a lot of the other grammatical features survived, more than usual in a pidgin-&gt;creole situation. There's enough continuity that the "new creation" model doesn't apply, but a process of simplification through widespread imperfect bilingualism might.</p>
