    <p>I'm sure this will have been covered before, but can't seem to find anything.</p>
    <p>Is the correct pronounciation the French, or to rhyme with "man's", or both?</p>
    <p>I've always used the latter for typefaces, but I think I tend to use the French the rest of the time (this may just make me a snob, though).</p>
    <p>But sometimes I hear "san-serif" said quickly with a long "a" -- "saanserif".</p>
    <p>What's the definitive answer?</p>
