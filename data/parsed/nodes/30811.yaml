      <p><em>I prefer “raises the question”.</em></p>
      <p>That would have been somewhat prosaic, as I was in fact discussing question-begging.</p>
      <p>My point was that the question of the correct pronunciation of "serif" is not answered (nor even asked) by determining the pronunciation of "sans". Therefore, there is a logical fallacy in assuming, for no proven reason, that "serif" will be pronounced in a certain way, dependent on the pronunciation of "sans". </p>
      <p>(That's the long version of <em>All this talk about sans begs the question of “serif”.</em>)</p>
      <p>I then established a logical relationship between the pronunciation of the two halves of the term sans serif.</p>
