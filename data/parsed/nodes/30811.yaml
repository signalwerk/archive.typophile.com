      <p><cite>If there were founts of sanserif (or sans-serif) types in the printing shop, which in practice were mostly called just sans for short (as in Gill Sans), it stood to reason that you said sans to rhyme with man’s, whatever other people did outside.</cite></p>
      <p>This actually connects up nicely with all that linguistic history :) Because so much French got so thoroughly integrated into medieval English, the pronunciations got thoroughly anglicized, and it remained normal until much later to anglicize the pronunciation of French words coming into English (putting stress on first syllable, omitting nasalization, retaining consonants that were becoming silent in French, etc.). Since <em>sans</em> was already naturalized in Middle English, it would definitely have had an anglicized pronunciation. Unlike today, it would probably have been familiar to English speakers in Figgins' day as much from its use by Shakespeare as from contemporary French, so I would expect that it was usually pronounced to rhyme with either <em>man's</em> or <em>dance</em> outside printer's shops as well.</p>
