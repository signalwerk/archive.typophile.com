      <p>&gt;I was in fact discussing question-begging.</p>
      <p>Ha! Think you can out-pedant me, Nick? I'll show you what useless, annoying pedantry is all about!</p>
      <p>Eliot's original question was about how to pronounce the 'sans' part of 'sanserif', not about how to pronounce the 'serif' part of 'sanserif'. There was no possibility of begging of the question about 'serif' since that question had never been mooted. </p>
      <p>Also changing the meaning of the question under discussion is another logical fallacy: equivocation :) </p>
      <p>For some reason, perhaps because French was once the mark of an educated person, we in English are tempted to Frenchify some words of French origin--which ones is capricious, as over half of English comes from French. The same thing never happens with Dutch words, which we have even less clue how to pronounce.</p>
