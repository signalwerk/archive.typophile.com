      <p>The linguistic history is fascinating (you learn so much around here) and it’s probably tactless to come crashing in and bring this discussion back down to the practicalities of the shop floor. But that is at the heart of the question with which this thread started – how do you, or how should you, say <em>sans</em>? Compositors had founts of nonpareil (pronounced nom<strong>prull</strong>), brevier (bre<strong>veer</strong>) and bourgeois (bur<strong>joyce</strong>) in their type cases. When a British army found itself at Ypres in 1915 it sensibly called the place Wipers. People who had been to France or who fancied themselves on their posh pronunciation could show off with <em>Sansouci</em> or <em>Madame Sans-Gêne</em>, the success by Sardou (1893) that kept its original name on the London stage. If there were founts of sanserif (or sans-serif) types in the printing shop, which in practice were mostly called just sans for short (as in Gill Sans), it stood to reason that you said sans to rhyme with man’s, whatever other people did outside. Still does.</p>
      <p>As for the word serif, I have tried to get the Oxford English Dictionary to improve its entry. For its first use of <em>sanserif</em> it cites the same Figgins type specimen of 1830 twice, wrongly in each case: first as <em>San-Serif</em> (‘8 Lines Pica San-Serif’) and then, under the headword <em>ceriph</em>, as <em>Sans-cerif</em>. In the Figgins specimen it is in fact SANS-SERIF. For <em>serif</em> by itself OED has nothing earlier than Savage’s <em>Dictionary of printing</em> (1841), which spells it <em>ceriph</em>. But there are several earlier uses of <em>serif</em> (variously spelt) than 1841 or even 1830. I know one of 1813 (‘surripses, more usually pronounced surriphs’) and there is another in 1827 (‘syrifs, or cerefs’). Justin Howes (of course) found <em>ceriph</em> used in 1785. I’ll have another go at OED.</p>
    html_clean: |-
