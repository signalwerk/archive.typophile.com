      <p>In French, when saying "sans" you also drop the S. It's pronounced with a close "a", just like the words "blood" (sang) and "one hundred" (cent). The s is only pronounced when connecting it with some words that begin with vowels, in which case they join and the s has a z sound.</p>
      <p>In Brazilian Portuguese most people say "Sans" as "sãs" (a nasal a), sort of like english "suns", but with a "weaker" n. </p>
      <p>I'm all for each language to use its "own" pronunciation, especially for words that come up all the time in conversations (like sans) -- it usually keeps both speaker and listener more relaxed.</p>
