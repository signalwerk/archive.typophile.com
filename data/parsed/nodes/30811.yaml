      <p>If you read at the end of James Mosley's <a href="http://typefoundry.blogspot.com/2007/01/nymph-and-grot-update.html" rel="nofollow">update on his history of the sanserif</a>, you will see that the term Sans-serif or 'sanserif' is not French but a neologism by the English typefounder Vincent Figgins. He also says that the French tended to call 'antique', as in 'Antique Olive', what the English call 'sanserif'. </p>
      <p>Since 'sanserif' is an English neologism mixing French and (apparently) a mispronounced Dutch word, the correct pronounciation in English rhymes sans and man's. This is the way both the Concise Oxford and the Webster's Collegiate dictionaries have it. So unlike a huge number of typeface names, here there is actually an authoritative answer on correct pronounciation. </p>
      <p>It is often something of a quandry in English whether to try to pronounce a foreign word as in the original language, or Anglicize it. In this case 'sanserif' is an English word, so go with it as English and be happy :) </p>
      <p>ps. I've read that in inventing neologisms, it is recommended to stick within one foreign language, if part of the word is foreign. So, for example, 'television', which mixes Greek and Latin, is bad practice. 'Sanserif' is like that, but at least it resolves the question of how to pronounce it: not French, not Dutch. </p>
      <p>Since English is in fact a 'Creole', a product of colonials who couldn't quite manage the language of their French masters (William the Conquerer) this kind of mixed-up word fits very happily into our language :) </p>
      <p>pps. Bringhurst, evidently uncomfortable with the bastard word 'sanserif', uses his own neologism "unserifed" typefaces. To me this is a rare false note in Bringhurst's beautiful use of language. I think it is better to embrace the wild multicultual mix that is English, and not prissily 'correct' a perfectly serviceable and well established word of dubious origins.</p>
    html_clean: |-
