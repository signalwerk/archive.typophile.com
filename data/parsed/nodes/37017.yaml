      <p>I look at your typeface for a while and I think the problem is not the terminal. I like terminal on some typeface. Also, you're not force to use it at each letter. You can decide to use it on the a but not on the b, on the d and on the p but not on the q, may be on the r and so on. The problem, to my point of view, is how the terminals are. You choose to use them at an angle of about 45 degree, have you try to draw them align on the alignment line at 90 degree? Or use the same angle of the top of the b or the a bowl. Of course it's only some suggestions. Keep going - BTW I like terminals.</p>
