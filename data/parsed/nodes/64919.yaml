      <p>I'm going to have to agree, and thanks for posting the interface...</p>
      <p>show it on a bottle. that grey colour you have ... sitting over beer in a bottle will look like...terrible.</p>
      <p>seems like a fairly playful brand, so run with it.<br>
      maybe it's the method in which the beer is brewed - so portray that in the deaign, backyardish.<br>
      maybe it's how they started...you're going to have to add some history to what you've got. even faux history.<br>
      put a handle through the bottle!<br>
      have the lable as a single stroke of paint.</p>
      <p>get creative.</p>
      <p>I associate buckets with bucket bongs, insane parties and a lot of messiness...and spewing. So...sure;y there's a good spin on it. i.e, It might not be good...but there's LOTS of it.</p>
      <p>...unless of course this is your homebrew, then what you have is no doubt fine.</p>
      <p>----------<br>
      <strong>Paul</strong></p>
