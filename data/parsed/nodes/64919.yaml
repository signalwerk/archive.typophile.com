      <p>I think this is not very good at all. I wouldn't buy this beer. </p>
      <p>The label looks like a clip art, the color scheme (esp. the white background) is odd, the drop shadow doesn't add anything, yet it makes the whole package look amateurish. This could work for a bucket of a hand-crafted paint at the country arts and crafts fair, but for the beer bottle it is not working at all. Perhaps others will see it differently though, just wait for other opinions.</p>
