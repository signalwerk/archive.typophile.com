      <p>The small type is also Conduit. The l.c. 'g' and the U.C. 'S' and generally squarer counters are all Conduit signatures. <em>"If it looks like DIN, but isn't, it's usually Conduit."</em> -- I think that was an Yves Rule.</p>
      <p>- Mike Yanega</p>
