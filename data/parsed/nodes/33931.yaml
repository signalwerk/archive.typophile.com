      <p>From fonts.com...</p>
      <p>"Or, as Erik Spiekermann said, “The beauty in ITC Conduit is that it doesn’t pretend to be anything that it’s not. It may not be pretty, but it is versatile, legible and easy to work with – a wonderfully stupid typeface.”</p>
      <p>Kind of a back-handed compliment?</p>
      <p>I'm not sure who else has disparaged it, but I've always liked Conduit. I used to use it on my website, and had a few people (non-typophiles) comment that they "liked the font..."</p>
