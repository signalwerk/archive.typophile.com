    <p>apols to sully the forums with an announcement of a distainfully commercial nature, but thought this might be of interest to certain typophiles...</p>
    <p>i'm selling the following reprint for £35. price includes P&amp;P to any UK address (sorry overseas chaps:)email me if interested; scans provided on request. ta, g.</p>
    <p>A History Of The Old English Letter Foundries with Notes Historical and Bibliographical On the Rise and Progress of English Typography. (Bound with) A Dissertation Upon English Typographical Founders and Foundries</p>
    <p>Reed, Talbot Baines and Mores, Edward Rowe<br>
    Thoemmes Press, Bristol; 1996; ISBN 1855065932<br>
    Hardback; No dust jacket (as published); Green cloth, claret spine-panel, 8vo, Fine.<br>
    Description: 2 Vols bound in 1. 394pp + 91pp. Reprints of the editions of 1887 and 1778 respectively. Reed's book is one of the most important books on printing types from Caxton onwards. More's work was a pioneering history of eighteenth-century English typefounding and includes specimens of all the types it describes. Published at £125.</p>
