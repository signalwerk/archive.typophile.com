    <p>I would be grateful for some suggestions. </p>
    <p>I'm looking for typefaces which might complement a strong all-caps Didoni title/logo:<br>
    <a href="http://new.myfonts.com/fonts/urw/didoni/urw-d-normal/" title="http://new.myfonts.com/fonts/urw/didoni/urw-d-normal/">http://new.myfonts.com/fonts/urw/didoni/urw-d-normal/</a></p>
    <p>This is for a web-magazine with an academic/literary bent, so anything that might work for headings, sub-headings and the like would be useful!</p>
    <p>Thanks very much!</p>
