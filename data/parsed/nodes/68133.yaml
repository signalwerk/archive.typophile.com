      <p>Unfortunately, offhand, I cannot remember where I got that image, except that I think it was a scan. I was given a large collection of Opti fonts, but I cannot find that one among them. I don't think my collection was complete, so that isn't proof it wasn't Opti. I am thinking I scanned it from one of the Dover books I have, but I am having trouble finding the right book.</p>
      <p>Some of the FontBank (a.k.a. Expresiv Classic), or other "Expresiv" brand fonts were the same as some of the Opti fonts (none of them were original designs), but I don't see this one in those either. </p>
      <p>If I come across the source, I will post to this thread.</p>
      <p>- Mike Yanega</p>
