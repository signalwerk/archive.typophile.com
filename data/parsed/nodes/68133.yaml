    <p>After looking over the Bowfin print website , I stumbled across a font that I'm curious about. The name is Limited View.</p>
    <p><img src="/sites/default/files/old-images/lv_bpw_4277.jpg"></p>
    <p>I remember this font from years ago as it was used on both the ColecoVision &amp; NES packaging. Does anyone know if it's been digitized and if so , does it still carry the same title?</p>
    <p>Any help is greatly appeciated. Thanks in advance.</p>
