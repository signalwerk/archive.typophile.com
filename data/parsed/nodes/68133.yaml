      <p>It was likely digitized by Opti, but ...</p>
      <p>Castcraft owned the rights to Opti fonts for several years. Castcraft had a dated, dysfunctional website with overpriced fonts (when they would even respond) and that website disappeared within the last few months.</p>
      <p>I'm not aware of another digitization.</p>
