    html: |-
      <p>Most of what is being talked about is the curve positioning at cups of serifs or other tight turns. These kinds of things don't impact hinting and make the curve easier to draw with fewer points. You can extend the handle as a smooth point out from that curve section and still have enough tension to smooth that curve without having to add another point in such close proximity. Smooth Points in close proximity have limits on handle placement within the UPM grid thereby kinking the curve to force the handle to end at a UPM raster intersection.</p>
      <p>Believe me, it is the best way out of a sticky wicket. Slimbach has his sh*t together when it comes to this.</p>
      <p>ChrisL</p>
