    html: |-
      <p><cite>I find it odd that, if you can achieve precisely the same results by following the conventions strictly, one would choose not to.</cite></p>
      <p>It's not odd when you consider the extent of work required to address it, and the resulting benefit.</p>
      <p>As someone who participated in the production work on Garamond Premier, I can tell you that it was a massive undertaking -- a large glyph complement in eight separate multiple master fonts. It is easy to ask that outlines simply be designed "right" in the first place, to avoid time-consuming outline futzing later, but it's simply not compelling when the resulting problems are negligible (or non-existent). Believe me, various people in the Type group here have probably been conscious of it since Day 1 of PostScript. Over the years, we have come to realize that it's just not a significant problem and "choose our battles" accordingly.</p>
      <p>When a designer (Robert Slimbach, in this case) is confronting such a massive undertaking, one finds that it's better to simply allow the outlines to be produced in whatever way comes naturally to the designer, rather than fixate on details that are of little consequence. Of course, Robert understands as well as anyone the importance of points at extrema where it will have an impact on rasterization, and is, IMO, very good at putting points in the right places. If I was receiving outlines that were truly horrible, of course it would be worthwhile to offer the designer some guidance.</p>
      <p>I don't mean to sound pompous about it... just conveying a bit of font <em>realpolitik</em> from my perspective.</p>
