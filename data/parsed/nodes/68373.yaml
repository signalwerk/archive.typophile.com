    <p>Hi there,</p>
    <p>I was wondering if anyone could help me? I am using Scrivener on the Mac to output PDF files using dobe Garamond Premier Pro 12pt as my chosen font. However, in instances where the character 'f' is the last character on the line of justified text, it looks clipped. Does anyone know why this would be happening?</p>
    <p>Kind Regards</p>
