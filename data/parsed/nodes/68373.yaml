    html: |-
      <p>Apparently, Scrivener is masking the text area when it creates the PDF. The top of the "f" extends outside the character bounding box (many do) and consequently gets cut off by the mask when it's at the edge of the text area.</p>
      <p>I can't think of a workaround (other than using a different font). I would say this may a problem with Scrivener and you should contact the developer. It's also possible that it's something inherent in the PDF writer in OS X. If it does the same thing in either Text Edit or Pages, that might be the case.</p>
