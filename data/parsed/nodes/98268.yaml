    <p>This is treatment I did of 18th century Armenian calligraphic style. Its the first letter of Armenian Alphabet - AIB (alpha, alef).</p>
    <p>Dear Admin, I would also propose to create a Armenian Letters sub-forum in Special Interest Groups. I am sure that there are quite many Armenian font designers who are here and would join. Hrant Papazian is at least one of them I know :)</p>
