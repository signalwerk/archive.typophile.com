    html: |-
      <p>@Richard Fink:<br>
      <cite>As I've said elsewhere, there seems to be a meme making the rounds that assumes that, as typographical options become more available, web typography will "grow up" and begin to resemble typography in print.</cite></p>
      <p>Well, that's already happened. Many web sites use Adobe Flash, or at least they lay out their pages with tables, so that the appearance of text is static and controllable, instead of reflowing whenever a user changes the width of his browser window and being displayed in the user's default typeface.</p>
      <p>In other respects, yes, the flow of stylistic elements is from the medium percieved as "new" and "innovative" to the print medium.</p>
      <p>So what's likely to happen is:</p>
      <p>As web browsers gain the ability to do everything print can do, this will be made use of, and in ways that make use of the experience in the print medium.</p>
      <p>But web sites will continue to be designed for likely computer screen sizes.</p>
      <p>And the web, as it's new territory, will be a hotbed of stylistic experimentation, and so in that area, the flow of ideas will be (to some extent, at least) from the web to print.</p>
