    html: |-
      <p>&gt;Some of these techniques will look pretty sad in a year or so. :-(</p>
      <p>Not so. Fallback is unique to CSS. No equivalent in print. And the idea of subsetting when needed, rather than packing the font with everything under the sun, is sound thinking. And the CSS syntax you reference in your link to the W3C Recommendation is not simple to grasp. Changing the font-family to reference a special purpose font is conceptually much, much easier.</p>
      <p>Further, if there is any evidence that, for even a significant percentage of web designers, small-caps and lining numerals are a high priority, I'm certainly open to seeing it.<br>
      But there is none that I can see. I don't think the average web designer knows what lining numerals are. (I didn't until recently. Of course, if you describe them - "You know, the numbers that kind of go up and down instead of straight across" - you'll probably get a nod of recognition. But the idea of  "Small-Caps" as opposed to just Caps but sized smaller, I don't think would bring a nod at all. "You mean there's a difference?" There is no awareness of the distinction.<br>
      Considering the other problems web designers face today - the really BIG problems - stuff like this is incredibly trivial.</p>
      <p>As I've said elsewhere, there seems to be a meme making the rounds that assumes that, as typographical options become more available, web typography will "grow up" and begin to resemble typography in print.<br>
      This will not happen. In fact, the trend is noticeably the reverse - with typography in print more and more resembling web design.</p>
      <p>In the new marketplace for text (even now 40% of fiction is being read on electronic devices), "fine typography" - meaning fine distinctions of value to an ever shrinking pool of cognescenti stripped of influence by the new economic realities - are an indulgence that few can afford and few will provide. They are anacronisms.</p>
      <p>The history of the web for the first fifteen years of its existence is living proof of this. As is, more recently, the rise of devices like the Kindle, the Nook, and the iPad - all of which offer very poor typographic options. Yet demand has grown and grown.</p>
      <p>However, on the web, color is free. And that's really cool. :-)</p>
      <p>And why did you guys drop the blink tag? I loved that.</p>
