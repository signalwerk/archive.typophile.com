    html: <p>Aloha Rafael! <br> <br>If they want to downplay the oil association, I would decrease the size of the type in relation to the mark and reposition the mark to the left so it is the first read. <br> <br>The mark has a fresh, clean look that goes well with "clean" technologies, and the blue/green color scheme seems to make an association for GPS. Well done. <br> <br>I may catch some flack for this here, but I think a dark gray would go better with the mark than the black type.</p>
