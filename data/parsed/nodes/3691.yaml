    html: <p>I don't like the R. Maybe just because it reminds of the cheap Bitstream-Revue-typeface.  <br>The circle in the logo also strikes me as odd, mimicking the O-form, not really a circle at all, and the O has nothing to do with their name or anything else, so that confuses me quite a bit. Also, the logo in itself looks a bit generic, I more or less associate it with a crosshair of a weapon system, and that, indeed, is not a good ind of visual metaphor for a company. And in some weird way it also reminds me of the (otherwise quite nice) newish BP-sun (maybe due to the green), which doesn't help establish an individual identiy at all. I don't see oil, I don't see water, I don't see information in all of this. And if you cannot see it... why opt for a ideographic trademark at all? I the  and &lt;&gt; 's don't make any sense and are just visual special effects, just leave them away and concentrate on the word rockoil itself. <br> <br>On the technical side, the logo probably won't work in black and white and even in colour, it will take three, probably even four colours to print/plot that artwork, which is not quite the most economic solution available.  </p>
