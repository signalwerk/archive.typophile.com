  html: <p>Hi Everybody, <br> <br>This is a logo I'm working on for a technology company which primary focus was the oil industry, hence the name Rockoil (petroleum). Now they don't want to be exclusively associated with the oil industry anymore, as the technological solutions they provide can serve to many other clients. <br> <br>The company actually represents 2 other big international companies, which fields are satellite-positioning systems, and "clean" technologies for industrial cycles (water purifying systems, etc.)  <br> <br>Comments would be much appreciated! :-) <br>Thanks, <br> <br>Rafael Iskin<img src="http://www.typophile.com/forums/messages/29/28913.gif" alt="rockoil logo"></p>
