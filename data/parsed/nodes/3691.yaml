    html: <p>Hi Kris and Ivan, thanks for the feedback. <br> <br>I'm really surprised with this resemblance you guys see with the BP logo, the only connection I can see is the use of green and a certain "concentric" construction. Could you possibly elaborate a bit more about this? I would be really interested. <br> <br>Frankly, there aren't so many different color schemes as there are companies (in any field), and I'm sure I can find a logo already using any (good) color combination. If I had used the colors of a competitor I would have committed a major flaw, but that's not really the case. (I will explain a bit more about the nature of the company at the end) <br> <br>Please have in mind that I've never heard of those companies before (BP or OMV) as we don't have them around here; but I'm actually glad to see they use a similar color scheme as mine; because I'm sure they have used (expensive) research to determine their colors, while I had to just trust my guts. <br> <br>About "technological solution" </p>
