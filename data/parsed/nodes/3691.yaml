    html: <p>Hello Scott and Tiffany, thanks for the comments! :-) <br> <br>I do have an horizontal version of the logo, and I'm using it in some applications (see the business card). <br>Maybe the horizontal is really better, but I still tend to keep the vertical for some instances. <br> <br>I chose the proportion of the mark/logotype based on the horizontal version, see that the horizontal "arrows" match the caps height of the logotype (and they in fact refers to the "K"). <br> <br>I liked the suggestion of using gray in the logotype, but I am still not sure, doesn't it makes the logo too bright? <br>I like the contrast of the black, but also, if I print the business card in serigraphy I would have to set the type in gray as well to avoid one more printing color, and I'm not so sure it will work. <br> <br>Well, what do you think? <img src="http://www.typophile.com/forums/messages/29/28935.gif" alt="horizonral-rockoil"></p>
