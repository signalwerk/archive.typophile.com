  - id: 28062
    user: 3251
    date: 2004-03-22T07:24:00
    date_raw: 22 Mar 2004 — 7:24am
    votes: null
    html: "<p>I don't believe you HD!!! :-) <br> <br>Seriously, I believe you. People have different tastes, and as you are not criticizing the construction or anything objective about the letter there is nothing I can say except \"I like it\". I have found a Linotype-Revue, I don't like it too, but I don't see any resemblance. <br> <br>Yes, the mark *is* a bit generic, and the main reason is because the company acts in many different fields (I don't want to say water, or oil) it is an abstract concept, and BTW I don't see *any* trouble in using purely abstract ideograms. <br> <br>If you don't see any association in the mark, I think you are not even trying to put yourself in the position of the target public of the logo. The crosshairs are not exclusively used in weapon systems, but in *any* positioning system, as they denote direction. <br> <br>For example:  in the controls that position oil platforms above the hole they want to drill. <br> <br>Also, to me the mark have a positive association in the other field the company operates; as it can be read as a \"green\" focus over a industrial cycle. Have you ever noticed that the pictogram for \"cycle\" often is not a perfect circle, but a more squashed one? look at some washing machines for example) <br> <br>As to the technical side, it has been considered, and there is no problem in using 4 colors. <br>Of course, when you design something is crucial to take in account the uses it will have, but that's exactly why it is nonsense to limit yourself to constraints that don't apply to you. <br> <br>In any case I'm posting different versions of the logo, one for good quality 1 color printing, and the other to coarse low quality 1 color printing  (like old fax machines). <br> <br>Well, that's it. <br>Lucky me you are not my client HD  :-) <br> <br></p>"
    html_clean: "<p>I don't believe you HD!!! :-) <br> <br>Seriously, I believe you. People have different tastes, and as you are not criticizing the construction or anything objective about the letter there is nothing I can say except \"I like it\". I have found a Linotype-Revue, I don't like it too, but I don't see any resemblance. <br> <br>Yes, the mark *is* a bit generic, and the main reason is because the company acts in many different fields (I don't want to say water, or oil) it is an abstract concept, and BTW I don't see *any* trouble in using purely abstract ideograms. <br> <br>If you don't see any association in the mark, I think you are not even trying to put yourself in the position of the target public of the logo. The crosshairs are not exclusively used in weapon systems, but in *any* positioning system, as they denote direction. <br> <br>For example:  in the controls that position oil platforms above the hole they want to drill. <br> <br>Also, to me the mark have a positive association in the other field the company operates; as it can be read as a \"green\" focus over a industrial cycle. Have you ever noticed that the pictogram for \"cycle\" often is not a perfect circle, but a more squashed one? look at some washing machines for example) <br> <br>As to the technical side, it has been considered, and there is no problem in using 4 colors. <br>Of course, when you design something is crucial to take in account the uses it will have, but that's exactly why it is nonsense to limit yourself to constraints that don't apply to you. <br> <br>In any case I'm posting different versions of the logo, one for good quality 1 color printing, and the other to coarse low quality 1 color printing  (like old fax machines). <br> <br>Well, that's it. <br>Lucky me you are not my client HD  :-) <br> <br></p>"
