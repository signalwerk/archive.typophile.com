    html: <p>You know, I had been looking at an ad for her new album and was thinking, "Jeez, I hate her, but at least her designer didn't use a font for this." Got me on that one. I hadn't looked closely at the album title, which did have obviously repeating letters, but the designer did distress her name enough so that the letters didn't repeat exactly (on the ad I have, which is a little different than the sample above). So I guess I'll give the designer moderate props for fooling me. That's what I think a designer should do with a handwriting font for a logo such as this. <br> <br>Good call, Yves.</p>
