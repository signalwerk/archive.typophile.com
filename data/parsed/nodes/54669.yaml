    html: |-
      <p>I wasn't suggesting using Times, as I have no idea what your layouts are like.<br>
      In the AG magazine, Lubalin's heads were all caps and squared off--justified columns of Times text went well with that.<br>
      It's interesting to note that another famous art director/type designer, Neville Brody, used Times as the text face of <em>The Face</em>, again matching justified text columns with squared off heads (in Industria).<br>
      Both art directors felt it necessary to become type designers as there were no faces available to fully satisfy the strict geometry of the layouts they wanted to do.</p>
