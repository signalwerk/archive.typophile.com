    <p>Hi,</p>
    <p>I'm working on a lifestyle booklet/catalogue for a premium brand and want to introduce a complementary serif for editorial use with their house font, Avant Garde. Would be nice to get a family that can work both as an alternative headline (to AG body) as well as suitable body copy to an AG headline. At the moment they only use Avant Garde in Medium and Book. Tonally, I'm looking to warm up what is currently a very clinical feel, and introduce changes in pace throughout the booklet.</p>
    <p>thanks in advance for any comments/suggestions,</p>
    <p>K</p>
