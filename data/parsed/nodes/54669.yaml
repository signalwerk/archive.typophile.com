    html: |-
      <p>Avant Garde is harshly geometric, but because of that you know what sort of letterforms to look at. </p>
      <p>Would I be wrong in thinking that some oldstyle type might work? I've never really thought about it before. I'm thinking an oldstyle O, with very little contrast. Not a spindly oldstyle, and perhaps not too sophisticated in its curves. (It is after all, being matched with Avant Garde...)</p>
      <p>There might be too much life in an oldstyle though. </p>
      <p>Is there a such thing as a geometric oldstyle? Of course, we have examples like Albers, etc., but oldstyles are typically associated with their humanist touch. What about a geometric oldstyle with less of the humanism and more of the geometry, but without the increases in contrast associated with the move away from humanism and into rationalism and the engraving tool?</p>
