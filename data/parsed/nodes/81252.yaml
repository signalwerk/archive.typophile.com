  html: |-
    <p>Say you've got two client-defined typefaces you must use b/c it's part of their marking/branding - a solid sans and a complimentary, solid serif. Say you need to design them something with more pizazz, like a big fancy poster.</p>
    <p>What guidelines, other than "not a sans and not a serif and nothing too similar to the typefaces already picked," might one follow?</p>
    <p><em>p.s.: it's Century Schoolbook</em></p>
