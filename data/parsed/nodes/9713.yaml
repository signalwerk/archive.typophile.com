    html: |-
      <p>According to Martin Kotulla, SoftMaker is finally updating two versions of Eurostile. "Eurasia" (an actual clone of Linotype Eurostile, Berthold's version) to come in 10 styles - Regular, Demi Bold, and Bold (each in the parts of regular and italic for the regular-"widthed" part only), plus the condensed and extended widths each come in the styles of "regular" and "bold", marking as SoftMaker's exclusive typeface family update. SoftMaker's other version of Eurostile appears to be "MicroSquare" under license from URW++, except that the typeface itself comes in all 5 styles for the "regular"-widthed part (Regular, Medium, Bold, Heavy &amp; Black), plus the "extended"-widthed part comes in the styles of Regular &amp; Black, the "stencil" part as an actual clone of "Eurostile Extended Black Stencil", and the small-caps part is two styles (Regular &amp; Bold).</p>
      <p>Those font names are finally appearing on two of SoftMaker's premium-quality typeface collections - "MegaFont XXL 3.0" (for home users) and "infiniType 4" (for designers) - both being released around May 27, 2014.</p>
