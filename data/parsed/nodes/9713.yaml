    date_raw: 27 Nov 2012 — 4:20am
    votes: null
    html: <p>According to Martin Kotulla, SoftMaker is finally updating two versions of "M730 Sans" (an actual clone of "Microgramma Extended" under license from Berthold/Brendel) to include the styles of Regular &amp; Bold each for the "regular" and "small-caps" parts. SoftMaker's other version of Microgramma Extended appears to be called "Micro" (which comes in the styles of "regular" and "bold", and also under license from URW++). And of course, "M731 Sans" (an actual clone of Microgramma Deco, the older "Microgramma Bold Extended" in all-uppercase only form, which appears to be in the design of FontBank's Microbus and Southern Software's Chino SSi/SSK), appears in to join "M730 Sans" and "Micro" (the two actual clones of Microgramma Extended), and so these font names are finally appearing on "MegaFont XXL 3.0" and "infiniType 4" - the two premium-quality typeface collections from SoftMaker - both being released around May 27, 2014.</p>
    html_clean: <p>According to Martin Kotulla, SoftMaker is finally updating two versions of "M730 Sans" (an actual clone of "Microgramma Extended" under license from Berthold/Brendel) to include the styles of Regular &amp; Bold each for the "regular" and "small-caps" parts. SoftMaker's other version of Microgramma Extended appears to be called "Micro" (which comes in the styles of "regular" and "bold", and also under license from URW++). And of course, "M731 Sans" (an actual clone of Microgramma Deco, the older "Microgramma Bold Extended" in all-uppercase only form, which appears to be in the design of FontBank's Microbus and Southern Software's Chino SSi/SSK), appears in to join "M730 Sans" and "Micro" (the two actual clones of Microgramma Extended), and so these font names are finally appearing on "MegaFont XXL 3.0" and "infiniType 4" - the two premium-quality typeface collections from SoftMaker - both being released around May 27, 2014.</p>
