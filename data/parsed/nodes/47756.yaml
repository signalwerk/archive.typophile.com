    <p>Did this as a promotional t-shirt for a photographer friend of mine. We'll be printing it two color on either a black or dark gray shirt, possibly with a very small tagline or URL on the back. It's fairly final but I'm doing some tweaking, I'd love to hear some feedback and crits either way. Thanks.</p>
