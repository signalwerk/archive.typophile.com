      <p>Now that you mention it the kerning between "P" and "A" is killin' me :) Good call on the others too, appreciate the feedback. The top splatter mark was originally a little more solid which I think balanced the overall design with the bottom graphic a bit better. I'll take a look and do a bit of tweaking.</p>
      <p>Thanks for the comments guys, though I don't know that Joe is much of a fan...ah well ;)</p>
