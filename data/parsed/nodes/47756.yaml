      <p>I love the design but do have a few minor suggestions:</p>
      <p>The kerning between the "P" and "A" of "passion" is too loose. Same with the "e" and "a" of real. And I might tighten up the front end of "emotion" too.</p>
      <p>The graphic at the lower left corner feels a bit heavy to me. It throws off the balance. Perhaps if that particular graphic was a bit transparent (lighter) the balance would seem better.</p>
      <p>Again, these are minor. You did a great job with it.</p>
