    html: |-
      <p>abuzaynab, that is indeed possible. You can select any available font on your system as 'template' and so all you have to do is move an underdot in the appropriate position under an "H", assign the correct Unicode (highly advisable), export, and you have a new font.</p>
      <p>But .. see David W. Goodrich's advice on <a href="http://indesignsecrets.com/topic/applying-diacritical-marks-for-transliteration-of-arabic-language" rel="nofollow">InDesignSecrets</a>; with IndyFont you cannot <em>change</em> existing fonts, so you need to add your characters as a new one. That may mess up ID's native kerning. Another limitation is that you must select this new font for all individual characters (GREP Styles <em>may</em> work, but this depends enormously on your current style set-up).</p>
      <p>Try the free One-Character demo for your "H-dot" and see if it works for you.</p>
