      <p>Thank you for that great review!</p>
      <p>You can somewhat lessen the rounding effects you are seeing by enabling Document Grid (IndyFont already sets the grid at "10 points with 10 subdivisions" for that) and switching "Snap To Document Grid On".</p>
      <p>The rounding effects are more visible when using Bezier control curves because each <em>end point</em> is rounded separately from its (presumably) mirrored counterpart. I did a brief experiment to see if it was possible to round one end, then extrapolate this adjusted direction to its counterpart and find the nearest integer values for that one. But that wasn't detectably better :(</p>
      <p>I think this could be why Adam is hesitant to allow fractional coordinates in FontLab by default. The end result <em>might</em> be slightly better for the tiniest of curves, but the font is not going to be compatible with "older" font engines (i.e., about anything on the market right now), and a straight conversion to integer points will reveal the same problems I got.</p>
      <p>By the way, how did I ever come up with this idea? From reading Typophile of course!<br>
      A funny story. I came across an older thread discussing Apple's Emoji font and I thought I might expand my own 'read_otf' software to see if it was possible to fish out interesting data from it. While rewriting, it occurred to me I knew a fair lot of the OpenType font format and it sounded like a fun project to try creating a font through ID. Well, (1) I found had to learn quite a bit more about OTF -- evidence is lingering in a couple of threads where I needed additional clarification --, and (2) I <em>still</em> haven't got round to examining Apple's Emoji font!<br>
      (Hmmm ... creating an Opentype bitmap font, straight out of Photoshop -- possible?)</p>
