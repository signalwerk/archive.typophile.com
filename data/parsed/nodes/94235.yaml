      <p>Native line art in InDesign is internally drawn as a subset of PostScript like commands (and thus translate *very* easy to PDF). Unfortunately, the Javascript interface translates it back into a dumb series of vertex points, including some pretty freaky conversion of perfectly okay Bezier curves to 'left, anchor, right' point sets. Those need to be converted <em>back</em> into proper Beziers, as the output format I'm using is Type 1.<br>
      On top of that, the internal vertices are all in full floating point format. Since most font rendering software is "not there yet", I round off the vertices to integer points.<br>
      So your delicate details may get lost in translation ...</p>
      <p>Nevertheless: one of the nicer surprises is that Mac OS X is smart enough to allow real-time updating of fonts <em>even when you already used it</em>. That means you can preview your design in a live document! (One of the nastier surprises, on the other hand, was that Windows is not as forgiving and puts a File Lock on the font as soon as you use it anywhere, so you cannot overwrite or update it without quitting InDesign.)</p>
