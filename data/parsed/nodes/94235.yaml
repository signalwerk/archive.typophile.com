    html: |-
      <p>Jeffrey, thanks! I think you fit *exactly* in our envisioned target audience :-)</p>
      <p>I have thought about kerning, but I cannot work out a good interface to add this to a font ... Currently, IF's Design Paradigm is "one page, one glyph" -- this sort of follows naturally from working through InDesign's interface. (But suggestions are welcome. I agree it would be a nice addition.)</p>
      <p>The UFO format is only used by professional type designers. Theoretically I <em>could</em> add an export function specifically for this ... but that is veering outside the main purpose of the program. On the plus side, though, since the exported font is a regular OTF font, you should not have any problems opening and editing it with any existing font editor. (Of course, you'll have to keep in mind that any external edits will be lost if you re-create the font through InDesign.)</p>
      <p>There are lots of OTF features that may be added. For this first version, we (I and Marc Autret, the programmer who re-wrote my demo into a full product) chose to add a couple of obvious eye-candy features first and see how that works out. There is a long list of other, more rarely used features that could be integrated with more-or-less the same code, and they may appear one at a time in various updates.</p>
