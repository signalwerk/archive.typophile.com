    html: |-
      <p>I wouldn't go overboard adjusting yellow for a natural stock. The eye will always perceive the stock color as the relative white point, so any yellow correction to images will run the risk of actually looking too cool in context. I would talk the matter over with your printer, as has been suggested. </p>
      <p>Or contact someone at the paper manufacturer. Undoubtedly they've run some promotional campaigns and printed specimens of Cougar Natural with four-color photography. Someone there might have suggestions on profiles or compensations. Plus they might have specimens showing the same image on white and natural, which would allow you to judge for yourself if color compensation is even really warranted.</p>
      <p>-- Kent.</p>
