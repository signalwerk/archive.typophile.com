  html: <p>Is there a formula to use when adjusting photos in Photoshop for uncoated paper? My issue is that I am trying to compensate so I can print on Cougar Natural Opaque. So not only do I need to adjust for uncoated paper, but what is the best way to take yellow out of an image in Photoshop to compensate for the cream colored paper?</p>
