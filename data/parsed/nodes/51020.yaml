    html: |-
      <p>James is spot on. I've always felt the best way to work is to get a good image on your calibrated equipment, which would include a profile, then as a final step, convert to the profile supplied by the printer. Sometimes testing is needed; one trick is to profile the printer's proofer, and it then becomes the printers job to match their proofs.</p>
      <p>The easiest way to get the proper color balance is if there is a grayscale chart with (in) the image. For white, light gray, and medium gray, the amounts of red, green and blue should be about equal. Once you have the color balance corrected, then make a small change for the paper hue if you want.</p>
      <p>There are some limitations to this -- you can't do everything with profiles. For example, you just won't get as deep a black on uncoated paper, so you can't get quite the shadow detail, and shouldn't try. We run proofs on a profiled inkjet or laser printer with the appropriate sheet type, &amp; correct from there.</p>
      <p>FWIW</p>
