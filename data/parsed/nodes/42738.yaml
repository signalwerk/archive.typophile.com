      <p>I don't think this person is a useless or trendy, just slow and not likely to finish. He is not a miinor celebrity, I'll give him that. My jaw remained firmly raised. The really interesting thing in this video, besides the crap type, was the number of times, the presenter says, "what if". Like, what if "everybody" put all kinds of text data and metrics matching data into all their photos, and then gave them away for free! Or, what if everybody had enough memory and bandwidth to browse a glabobyte of data on their computer in ten seconds...What if Operating systems were as scaleable as the fonts and images we've been supplying for nearly three decades, WOW!</p>
