      <p><cite>Author Paul Stamets, bless his heart, “...mushrooms can save the world”, not unless they can learn to grow in sea water, not to mention that they’re breathing my air. </cite></p>
      <p>An interesting note on Mycelium is that several types work symbiotically with the roots of trees and provide nutrients that fertilize the trees. It is a very important issue with forestation and the paper industry because if the mycelium can be kept alive it reduces or eliminates the fertilization needs for tree farming. So David, the mushrooms are helping to make the air you breathe and are probably a huge factor in keeping a steady supply of breathable air.</p>
