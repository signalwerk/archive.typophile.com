    html: |-
      <p>"why is that funny ?"<br>
      I won a 1968 Mustang in buzz-word bingo, with that phrase.</p>
      <p>I'm sorry to leap out of the forum at anyone's opinion, but I am of the opinion that there is a whole kind of conference, and this is not new, that I find, and have found, to be deeply superficial, narrowly hypocritical... and broadly hilarious. But, I've mostly resisted.</p>
      <p>Author Paul Stamets, bless his heart, "...mushrooms can save the world", not unless they can learn to grow in sea water, not to mention that they're breathing my air. Undersea explorer Robert Ballard, brilliant guy, lots of people Do Explore the Oceans, stop taking pictures, haul up some of them battleships, lower sea level, make reefs. Todd Machover, genius, is gonna make sure that no rich parent will survive, and no rich child will be left behind, by Star Search. And I don't mean to 'peck' at you but Joshua Klein master of machines, why is he building a vending machine for crows to deposit coins, for peanuts...some future web model?</p>
      <p>"Writing in sand is probably our best bet."<br>
      Sand? For one to impress such an audience, one'd need to design and 'draw' a new font, liiive, in ones own blood.<br>
      Maybe next year.</p>
      <p>Cheers!</p>
