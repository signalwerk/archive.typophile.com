      <p>Before worrying about drop shadows, you should address the modulation of strokes and the smoothness of letter shapes.<br>
      Anyway, you could look at accomplished chromatic typefaces for clues (a suggestion: instead of applying some effect to one glyph, you could start placing one glyph over an identical one, then nudge it around until you're satisfied with the result).</p>
