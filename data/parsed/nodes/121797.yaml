    <p>Hey guys,</p>
    <p>I'm working on a typeface this quarter for a school class and need some critique from you type experts. The name of my typeface is "1800 Something" because it was Inspired by the “Franklin TYPE Foundry - Book of Specimens Edition of 1889”. The goal with this font was to use characteristics of 1800 typefaces and make them relevant again for type nerds alike. Basically i'm looking for any critique but I am specifically concerned with my drop shadow alternates, how can I make the drop shadow less illustrator stroke looking, it feels too blocky. </p>
    <p>Thanks for any comments and all your critiques!</p>
    <p>Kyle</p><div class="imageWrap"><img src="http://typophile.com/files/1800-something-specimen_5564.jpg"></div><p></p>
