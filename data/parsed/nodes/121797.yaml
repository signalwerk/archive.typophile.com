    html: |-
      <p>I will start by saying that this style isn’t exactly my cup of tea, so please keep in mind that some of my comments could be more a matter of taste than else.<br>
      Also, in your image the outlines look jagged, making it difficult to see if a problem lies in the curve or just in the rendering of it.<br>
      In random order:<br>
      - |G|’s top serif is different from anything else in the typeface.<br>
      - The chisel-shaped “closing” serifs on |E|F|L|T| look a bit weak, and out of character next to the triangular ones.<br>
      - Not a fan of the elephant-trunk-like middle arm of |E|.<br>
      - |A| could be wider.<br>
      - |&amp;| could do with less overshot.<br>
      - |R|’s leg is a bit weak.<br>
      - |C|’s top and bottom curves look heavier than the vertical stroke.<br>
      - Overall, horizontal and vertical strokes vary sensibly from letter to letter, not in an organic way.</p>
      <p>Hope it helps.</p>
