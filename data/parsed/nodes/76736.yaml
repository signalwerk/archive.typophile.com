      <p>BTW, I grew up during the "Duck and Cover" or "Better Red than Dead" era and saw some of the propaganda images of the 50s and 60s when the CIA released them to the media under either the "Know thine enemy" or else the "Keep defense spending fueled" reasoning depending on your bias. :-)<br>
      I even made a few spoof posters myself several years back.</p>
