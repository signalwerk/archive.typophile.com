      <p>"constructivist-era Soviet lettering"</p>
      <p>The propaganda era was in the late 1940s and 1950's--well past the Constructivist era (30 years prior).  Stalin had either sent those guys to Siberia or they had wisely escaped the country by then.</p>
      <p>The old standard 1990s Windows Cyrillic condensed bold sans probably would work fine.</p>
