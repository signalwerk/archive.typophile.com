      <p>Yes! Those Propaganda fonts are perfect!</p>
      <p>Here are a few images going through a few Soviet decades:</p>
      <p><img src="/sites/default/files/old-images/1Soviet-1923-Const_5994.png"><br>
      1923 before constructivist ejection</p>
      <p><img src="/sites/default/files/old-images/2Soviet-1921_4497.png"><br>
      1921 Typical</p>
      <p><img src="/sites/default/files/old-images/3Soviet-1947_5774.png"><br>
      1947 early post war</p>
      <p><img src="/sites/default/files/old-images/4Soviet-work-1948_6140.png"><br>
      1948 worker propaganda</p>
      <p><img src="/sites/default/files/old-images/5Soviet-1955-typical_6357.png"><br>
      1955 Typical Cold War</p>
      <p><img src="/sites/default/files/old-images/6Soviet-1963-castro_4576.jpg"><br>
      1963 Castro Krushchev era</p>
      <p>BTW, I grew up during the "Duck and Cover" or "Better Red than Dead" era and saw some of the propaganda images of the 50s and 60s when the CIA released them to the media under either the "Know thine enemy" or else the "Keep defense spending fueled" reasoning depending on your bias. :-)<br>
      I even made a few spoof posters myself several years back.</p>
