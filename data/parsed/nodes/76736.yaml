  html: <p>Hello there! I am about to start campaigning and I would like to base my posters around the communist propaganda style favoured by countries such as the Soviet Union and North Korea. My biggest problem is finding the right font! The text needs to be easy enough to read, so no backwards Russian-style letters or anything, and the capital D and O need to be distinguishable, since my name is ADO on the posters. I want the font to be imposing and cutting, perhaps with a little jaggedness. Most importantly, though, the font needs to be easily recognisable as a propaganda-style type! I hope that's not too specific for you; I've struggled, having tried a few such as VKB KonQa and Propaganda but not being satisfied. Thank you.</p>
  html_clean: <p>Hello there! I am about to start campaigning and I would like to base my posters around the communist propaganda style favoured by countries such as the Soviet Union and North Korea. My biggest problem is finding the right font! The text needs to be easy enough to read, so no backwards Russian-style letters or anything, and the capital D and O need to be distinguishable, since my name is ADO on the posters. I want the font to be imposing and cutting, perhaps with a little jaggedness. Most importantly, though, the font needs to be easily recognisable as a propaganda-style type! I hope that's not too specific for you; I've struggled, having tried a few such as VKB KonQa and Propaganda but not being satisfied. Thank you.</p>
