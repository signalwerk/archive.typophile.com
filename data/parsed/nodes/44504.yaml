  html: |-
    <p>an eclectic typeface i designed while experimenting for my final major project. Designed with children's beads.soon to be printed on A1 paper and displayed at my colleges end of year show</p>
    <p>also i'm contemplating printing a few up to sell/send to people for promotional purposes though if you hang around i will more than likely be designing a Complete poster with illustration etc</p>
    <p>also this is purely for display purposes only,i have never used fontlab or any font making software and don't think i'm about to,i'm just happy making typefaces that can be used as headers or such like</p>
    <p><a href="http://www.flickr.com/photos/thomasbird/2430990587/" title="http://www.flickr.com/photos/thomasbird/2430990587/">http://www.flickr.com/photos/thomasbird/2430990587/</a></p>
    <p>psview all sizes to get a better view of the typeface</p>
    <p>crit more than welcome</p>
    <p>thom</p>
