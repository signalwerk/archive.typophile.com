  html: |-
    <p>I would like to find a replacement for DTL Argo, which, as you know, is rather expensive selection. If you would have recommendations? Weights I need are medium and black, as well as respective obliques.<br>
    Argo looks like this: <a href="http://www.dutchtypelibrary.nl/Images/Argo%20Black%201.GIF">http://www.dutchtypelibrary.nl/Images/Argo%20Black%201.GIF</a></p>
    <p>I would like to use a font that has "normal" or inexpensive price. I did find a free one from <a href="http://www.dafont.com">www.dafont.com</a> called Communist (that is inexpensive indeed: <a href="http://www.dafont.com/communist.font">http://www.dafont.com/communist.font</a> ), but it's obliques are not suitable and some are even missing, also some problems with characters.</p>
