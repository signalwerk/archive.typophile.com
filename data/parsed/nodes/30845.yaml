      <p>I’ll keep this brief as it’s off the point of this poll.</p>
      <p>&gt; <cite>Conor, what’s with the Latin 8 (Celtic) encoding?</cite></p>
      <p>It exists because it is required by <em>some</em> living in Ireland, Northern Ireland, Scotland, Wales, The Isle of Man and Brittany. I may be wrong, but thanks should go to <a href="http://www.evertype.com/" rel="nofollow">Michael Everson</a> for this.</p>
      <p>&gt; <cite>Does Gaelic use all those consonants with dots over them?</cite></p>
      <p>It’s traditional <em>Irish</em> or <em>Gaeilge</em> that uses them. So in short, yes. However, Modern Irish only has one diacritic, the <em>síneadh fada</em> or <em>fada</em> (for short) which means “long”. This looks like a standard “accent”.</p>
      <p>The “dot” is called a <em>ponc séimhithe</em> or <em>buailte</em>. I would need all day and night to explain to you what it’s role is in traditional Irish. In Modern Irish it is replaced by a proceeding <em>h</em>.</p>
      <p>&gt; <cite>Would you find a font with that encoding useful, and be predisposed to licence it?</cite></p>
      <p>Like I said above, <em>some</em> would find it useful. I would be delighted to licence it should someone require it. It’s a very small character set.</p>
