      <p>CE is kind of a no-brainer to me; no question that it's worthwhile.</p>
      <p>The next steps are Cyrillic and Greek. Then you have to decide whether to do polytonic Greek, and how much Cyrillic to do as there is lots beyond the basic set.</p>
      <p>See also my blog post on extended Cyrillic here: <a href="http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html" title="http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html">http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html</a></p>
      <p>Particularly interesting is how I/Adobe got a bit of flack for not going far enough in what we put in our standard extended Cyrillic character set (see the comments on my blog, and those on the OpenType mailing list). Basically, some people felt that anything less than everything was insufficient and discriminating against the smaller language groups.</p>
      <p>The flip side of that is, if we had to put *all* the Cyrillic characters into every typeface we did that supported Cyrillic, we'd probably put Cyrillic in about half as many typefaces.</p>
      <p>Oops, I think I'm digressing. I'll stop now.</p>
      <p>Cheers,</p>
      <p>T</p>
