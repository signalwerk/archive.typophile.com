      <p>The Baltic languages and Romanian use letters with a comma accent below them. The Turkish language uses cedilla. </p>
      <p>The Unicode Standard was admittedly wrong when assuming that the Baltic letters such as "G with comma accent" are letters with cedillas. This is why they named them "Latin capital letter G with cedilla" and created a canonical decomposition into G and cedilla. The Unicode Consortium now knows that they were wrong, but for compatibility reasons they were not able to change the decomposition or the names. The only thing they revised is the sample glyphs in the Standard. </p>
      <p>Adobe is not bound by backwards compatibility issues in glyph naming so Adobe was able to change the old AGL name "Gcedilla" to a new AGLFN name "Gcommaaccent". This was done deliberately, after a careful review of all the issues involved. Of course the Unicodes are still the same for those characters, and the keyboard layouts you tried use those Unicodes. Some older fonts (that you may have tried to preview the results of your typing) may also be wrong in that they include cedillas in place of commaaccents in the design of those glyphs. But this is a problem with those fonts, and some of them (e.g. Arial) will likely be changed in the next version of Windows. </p>
      <p>The issue of keyboard mapping has nothing to do with glyph design or the naming. Keyboard layouts generate Unicodes. The fonts map Unicodes to glyphs. Glyph names are only used as an auxiliary mechanism. </p>
      <p>Even though the Unicode names and canonical decomposition is wrong, it is fixed and cannot be changed. But each font is separate and the glyph design should reflect the typographic traditions and not the mistakes of some gremium. </p>
      <p>To sum up: </p>
      <p>1. All Baltic glyphs should use commaaccents, and use the names like Ncommaaccent, Kcommaaccent, Gcommaaccent etc., but of course they map to Unicodes that in the Unicode Standard have names such as "Latin capital letter N with cedilla", and decompose into N + cedilla. That's fine, and that's the correct (at least from the standards point of view) way of handling things. </p>
      <p>2. The T character has two instances in the standard: Latin capital letter T with cedilla (in the 01xx section) and Latin capital letter T with commaaccent (in the 02xx section). The latter is newer, so this character has been "disambiguated" at some point. Their glyphs should be named as they are specified in standard.nam, and both should use commaaccent in the design. </p>
      <p>3. The issue of Scedilla and Scommaaccent is a bit more complicated. Again, in older versions of the Standard there was just one character that was meant for use in both Turkish and Romanian. Later, the character has been disambiguated. The Latin capital letter S with cedilla should use the cedilla in the design, and the Latin capital letter S with commaaccent should use the commaaccent. For Romanian however, some locales use the old (wrong) S with cedilla Unicode rathen than the new assignment. Therefore, it is useful to provide an OpenType "locl" feature that replaces Scedilla with Scommaaccent in the Romanian context. </p>
      <p>(All above comments also apply to lowercase appropriately, of course). </p>
      <p>Some more discussions:<br>
      <a href="http://groups.msn.com/FontLab/general.msnw?action=get_message&amp;ID_Message=1825" title="http://groups.msn.com/FontLab/general.msnw?action=get_message&amp;ID_Message=1825">http://groups.msn.com/FontLab/general.msnw?action=get_message&amp;ID_Message...</a></p>
      <p>Adam</p>
