      <p>&gt; Although no break for American English-only buyers — but<br>
      &gt; do such folk really exist, licensing all their fonts<br>
      &gt; from Paratype?</p>
      <p>Well, you could (rather simplisticly) assert that for an American-English buyer it doesn’t really matter if he gets the "Pro L", "Pro C" or "Pro G" version because all they will care for is what’s in the "lower half" of the encoding. In fact, I believe many people will indeed never realize that their font includes European accents, or Greek, or Cyrillic. </p>
      <p>As for the Latin+Greek+Cyrillic scenario, the most likely use I imagine is by scientists from Moscow who would write in Russian, include English, French or German personal names and occasionally intersperse mathematical or physical symbols using Greek. Jokes aside, I definitely agree with Tom Phinney that both the Cyrillic and the Greek font would need a full set of accented Latin simply because Latin-script words or names are occasionally quoted in all the other scripts (Cyrillic, Greek, Hebrew, Arabic etc.). </p>
      <p>A.</p>
