      <p>I agree with you whole-heartedly, Chris!</p>
      <p>I hate to make this sound all black-or-white, but the trend with OpenType is to only offer one version of a font. Everything is either inside font that you have to offer, or it is not. (Custom work is a whole different ball game. There, you put in what the client pays for; each client could conceivably have their own version… something not really possible at the moment with retail fonts).</p>
      <p>If you don't put CE glyphs into your font because you think that they are not important, then you limit the possible reach of your work (and your sales). You are welcome to do this, of course, but I don't see how it makes much sense at the moment.</p>
      <p>This does also mean that designers, going forward, may produce less new typefaces per year than they previously were used to, but that each new typeface will have more to offer. I don't see this is a negative thing. But it migh mean that, before a designer begins work on a new face, he or she should consider its maketability more than they did before, since each typeface will have to carry a bit more weight… if that makes any sense.</p>
