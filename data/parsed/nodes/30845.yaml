      <p>I've been thinking about how to put the different encodings into fonts.</p>
      <p>It may make sense if you're bundling fonts with other apps to put everything into one big non-discriminatory font, but I'm leaning towards the following scheme:</p>
      <p>A. PRO<br>
      Includes all Latin-based encodings (but not Vietnamese)<br>
      And OT features<br>
      $49</p>
      <p>B. CYRILLIC PRO<br>
      Includes Cyrillic (extended as per Thomas' new blog entry) and non-accented Latin.<br>
      And OT features<br>
      $29</p>
      <p>C. GREEK PRO<br>
      Mono- and Polytonic Greek and non-accented Latin<br>
      And OT features<br>
      $29</p>
      <p>D. SUPER PRO<br>
      Everything<br>
      $79</p>
      <p>The purpose of such a scheme would be to:</p>
      <p>(1) differentiate between Shinntype fonts that have Greek and/or Cyrillic, and those that don't, right in the name, and </p>
      <p>(2) to offer a better price to those who don't want to pay lots for stuff they'll never use.</p>
      <p>***</p>
      <p>In this scheme, the assumption is that basic Cyrillic and Greek users will need English (non-accented latin), but not other European Latin languages. Is this correct? </p>
      <p>***</p>
      <p>NB. I wouldn't call the base fonts "Pro" if I didn't intend to keep Type 1 and TrueType versions of my older typefaces on the market. That's a business necessity for now,</p>
