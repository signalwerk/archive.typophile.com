      <p>I don't know if Eurocentric is the right word…</p>
      <p>Today, we make fonts and license them over the internet. These fonts are licensed by people all over the world, but probably primarially in North American and Western European countries. These two big customer groups have different needs; and the myriad of smaller groups have their own needs as well. But since the rise of OpenType fonts, we just produce one font for the whole marketplace.</p>
      <p>So, new fonts have to meet the needs of many groups. Do all Western Europeans need CE glpyhs at their fongertips? Probably not. But I would gamble that more of them do (or will in 5 years) than do not.</p>
      <p>Do all North American need them? Again probably not… but the range of people who do need them is probably smaller than the market segment that doesn't in Western Europe.</p>
      <p>Lastly, there are lots of clients in North America who do require CE glyphs (travel agents, direct to customer companies who sell in Europe, cultural heritage groups, some Christian demoninations, etc., just to name a few}. Even if you aren't servicing any of these types of clients now, can you guarantee that you won't be doing so in the future? Fonts are a long term investment.</p>
