      <p>Tom,</p>
      <p>My logic for the lesser Greek and Cyrillic prices:</p>
      <p>1) Those fonts are not really more work, because they are add-ons, and starting from the Latin of a typeface, one already has the figures and punctuation, plus common glyphs and glyph parts to work with. </p>
      <p>2) As you surmise, what the market will bear. But perhaps I am wrong -- there is a lot of consumer wealth in Russia now, surely some of it must find its way into the design budgets of upscale Russian magazines and advertising?</p>
      <p>3) Yes, there's a clever "low budget" buy for the English-only language user.</p>
      <p>***</p>
      <p>OK, several people have pointed out Russian-Western links, and the European Union and all that implies -- with the implication that the comprehensive "LCG" font should be the standard. Perhaps L (incl.CE) + C, and L (incl. CE) + G would also be suitable formats. Or is there a C + G user base -- surely not?</p>
      <p>If you are a font user who really does need to cover the full EU, then you should have no qualms about getting the full LCG font for $79.</p>
      <p>I still think that the LC and LG fonts make sense, given that those are the legacy encodings, and given that English is far and away the most-used "other language" in C and G documents.</p>
      <p>***</p>
      <p>So, using something like Adam's terminology:</p>
      <p>1. Pro L (Latin 1-8)<br>
      $49</p>
      <p>2. Pro C (includes "English", i.e. non-accented Latin)<br>
      $49</p>
      <p>3. Pro G (includes "English", i.e. non-accented Latin)<br>
      $49</p>
      <p>4. Pro LCG (everything)<br>
      $79</p>
      <p>With this scheme, an upgrade from any basic Pro font to  Pro LCG gets you two extra full script groups. For Latin, you get C + G, for Cyrillic you get Latin 2-8 + G, for Greek you get Latin 2-8 + C. There seems to be a balance now. </p>
      <p>(Although no break for American English-only buyers -- but do such folk really exist, licensing all their fonts from Paratype?)</p>
