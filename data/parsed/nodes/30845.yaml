      <p>William, </p>
      <p>for what it matters, a large part of the Eastern European or Central European countries that use Latin accented characters outside of the Western set are part of the European Union now. The situation looked very different in the 1990s but these days, my sense is that for example in Poland, font piracy is even less imminent than in Germany. This has to do with a smaller number of fonts that have these characters and with a smaller number of font distributors, so if an ad or a magazine uses an illegal copy of a font, it’s pretty easy to spot this. This has also to do with factual enforceability of copyright, which is actually quite amazing. A few years ago, Business Software Alliance seized computers in some companies and actual led to some convictions (not for illegitimate fonts but for illegal software installations), which had a large impact on the publishing industry. To some extent, it has also to do with the fairly low typographic awareness of the clients and designers -- designers are keen on trying out new fonts and alternate solutions, but are not so extremely determined to do so. The clients won’t be extremely upset if the designer uses a more common font rather than a more original one. So the designer will only go for something different if he is sure that the client will pay for it and that everything is in the legitimate area. </p>
      <p>Since many fonts don’t come equipped with CE glyphs, local font distributors such as Kentype in Warsaw "localize" the fonts, i.e. add the local glyphs. Typographically, this is not always the best option (because many of those "localizations" are done hastily) but some font distributors actually put the client’s name at the end of the copyright string in the modified font. This has proven to be a quite good method to encourage the clients not to leak the fonts outside of their company. Since these are custom localizations that the clients pay extra for (though it’s not really much), the clients actually do have a slight sense of exclusivity of what they have, so they’re less likely to leak the fonts anyway. </p>
      <p>Given that nearly half of European Union uses Latin characters outside of the Western codepage, I think it only make sense to "pre-emptively" put them in, especially that with FontLab Studio, the Generate Glyphs feature, anchors and class kerning, it’s not really a very complex task. </p>
      <p>As for the design of the diacritic characters goes, there are many resources available online, e.g.:<br>
      <a href="http://diacritics.typo.cz/" rel="nofollow">Filip Blažek’s Diacritics project</a><br>
      <a href="http://www.twardoch.com/download/polishhowto/intro.html" rel="nofollow">My old Polish how-to document</a> (needs to be re-worked)<br>
      <a href="http://www.twardoch.com/adam/project.php?pid=0016" rel="nofollow">My essay about Polish diacritics</a><br>
      <a href="http://www.sil.org/~gaultney/research.html" rel="nofollow">Victor Gaultney’s essays</a><br>
      <a href="http://www.twardoch.com/adam/project.php?pid=0062" rel="nofollow">Slides from a lecture Victor and I did</a></p>
      <p>People like myself offer critique and consulting on diacritic design for particular projects, both paid and unpaid, depending on the nature of the project. </p>
      <p>Best,<br>
      Adam</p>
