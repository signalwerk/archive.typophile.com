      <p>I’d also to point out that while until January 1, 2007, Latin and Greek were the only alphabets officially used in the European Union, now Cyrillic was added to the list as Bulgaria joined the EU. That means that only LCG (Latin+Cyrillic+Greek) fonts offer a complete EU coverage. </p>
      <p>Nick, how about using suffixes like "ProL", "ProC", "ProG", "ProLC", "ProLG", "ProLCG"? Optionally with a space after Pro, or perhaps omiting "Pro" completely. Alternatively, you could use suffixes "XL", "XC", "XG", "XLC", "XLG", "XLCG" :) And for the fonts that have small caps and other extravagancies for all those scripts, you’d go with "XXL", "XXC" etc. :D </p>
      <p>I mean it :D</p>
      <p>A.</p>
