      <p>Location, Location, Location. Dan is right about much of the U.S. market but that is not why I will include CE in all the fonts I design. As a type designer, you not only have an obligation to your customers to supply them with all the glyphs they need but you should also think about the marketability of your work. The world does not begin and end within any single country's borders. International interbusiness relationships are growing steadilly. So is the need for communication ease with the printed word. I would also add that non-Latin scripts are also important.  The difficulty is that it is much harder to learn a foreign script than it is to learn how to extend Latin to CE. This means fewer typefaces will be extended to foreign scripts by Latin based language designers and much of the task will fall to native speakers of the non-latin scripts.  This in time may change as well--at least I hope it does. TDC is sponsoring workshops in foreign scripts to help type designers in the U.S. develop non-latin understanding.</p>
      <p><a href="http://www.tdc.org/events/education/non-latinweek-ends/index.html" title="http://www.tdc.org/events/education/non-latinweek-ends/index.html">http://www.tdc.org/events/education/non-latinweek-ends/index.html</a></p>
      <p>ChrisL</p>
