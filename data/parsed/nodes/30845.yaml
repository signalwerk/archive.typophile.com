      <p>I'm not totally convinced it makes business sense for my foundry.<br>
      After all, Latin 1 encoding covers quite a few European countries where I don't sell many fonts, including the UK. Most of my sales are in the US.<br>
      Actually, I've recently sold some fonts to a Polish newspaper, but they wanted Type 1 Mac and PC.<br>
      Nonetheless, convinced of my civic duty by Adam, Gerry, and Maxim, I am soldiering ahead with extending language support for upcoming OT releases, so that they will all have CE encoding at the least.<br>
      Also, it's quite interesting doing the work, despite the extra tedium. Thank goodness FontLab automates so much of it.</p>
      <p>There is another reason, which is derived from the Long Tail, the principle being that you can never have enough products because there is always someone somewhere who will buy that obscure non-best-selling product, and all those combined small sales add up to more than the income from the best-sellers. </p>
      <p>So what every designer and foundry should do (as many have in the past) is produce "their" Venetian, their Old Style, their transitional, their Didone, their Geometric Sans, their Humanist Sans, their Grotesque sans, their Script, their Slab Serif, and so on.</p>
