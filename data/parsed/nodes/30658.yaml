    <p>hey everyone, glad I found you guys...</p>
    <p>I'm trying to identify a font used in the logo of the football (soccer) team I support and have come up with a pretty close ID, and that is Albertus.  It isn't quite right though...is there a font similar that it could be? or is it a custom one maybe?</p>
    <p>many thanks!</p>
