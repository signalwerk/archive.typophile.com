      <p>&gt; lots of times my pictures don't look sharp </p>
      <p>Evie, lots of good advice has been given, but I just want to emphasize that if you're making a high-quality PDF and yet the pictures still look fuzzy or pixelated, then you probably need to start with higher-quality original photos, or else print them in smaller sizes.  </p>
      <p>As a simple test, take a photo that's been looking pixelated and try printing it in several different sizes, and you'll probably see it looks sharper when smaller. </p>
      <p>Other factors (like paper, PDF settings, etc. ) will obvious affect results too, but even if those are optimal there are still limits to how big you can make a particular photo before it starts looking fuzzy.</p>
