      <p>The final output from sending RGB to your average printer would be terrible. </p>
      <p>However, it is good if you can get print profiles from your printer, along with some idea of how much sharpening works best with their press and paper.</p>
      <p>To the original poster:<br>
      I have found this book quite handy for questions about production:<br>
      Mastering InDesign CS3 for Print Design and Production<br>
      <a href="http://ca.wiley.com/WileyCDA/WileyTitle/productCd-0470114568.html" title="http://ca.wiley.com/WileyCDA/WileyTitle/productCd-0470114568.html">http://ca.wiley.com/WileyCDA/WileyTitle/productCd-0470114568.html</a></p>
      <p>It's for CS3, but everything still applies. It also has good notes if you are in the unfortunate situation of having to use inCopy with a remote editor.</p>
