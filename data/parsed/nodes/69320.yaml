      <p>Ha, we cross-posted. Kristians Sics describes some really advanced methods.</p>
      <p>Anyway, Evie, the answer is yes. Save both the grayscale and CMYK files as tif files. The simple fact that they look black-and-white doesn't mean anything. They could be either RGB, CMYK or grayscale. To be sure, convert the BW images to grayscale (if your BW images do not contain hues of gray and depict only hard black shapes, you could try to use a rich black in CMYK mode - that is assigning percentages of cyan, magenta and yellow to the 100% Black or K - just be sure not to go above 240% total ink coverage).</p>
      <p>To Kristians: does it make any difference if you sharpen the image after resizing while in RGB or CMYK mode?</p>
