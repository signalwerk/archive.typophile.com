      <p>1) Books (I mean literature) usually are printed on offset paper SO BE CAREFUL!!! Picture books are printed on glossy paper so there is nothing to worry. Euroscale will be ok.<br>
      2) "do not downsample" mean in pdf the resolution will not change. If you prepare pictures at 100% may it not worry you.<br>
      3) "no compression" means the tiff will be ziped (so you'll get a big file size) I always make with JPG with quality "Maximum". Your linked file will remain tiff if you want to work with it but in pdf a high quality jpg will be embedded - it is ok for printing.<br>
      4) about sharpening - I try to edit my photos in Adobe RGB mode not to loose any of colour information. I just made it to me a habit. To get perfect cmyk conversions so I can be sure than there are no excessive ink coverage. But I may be wrong. There are other designers retouching already cmyked pictures and getting good results.</p>
