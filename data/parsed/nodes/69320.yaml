      <p>Couldn't help but notice that you said you're working on a "10-page booklet." If you're making a booklet (unless it will be perfect bound or ring-bound), it needs to have pages divisible by four. Why? Usually a booklet is made of multiple nested folded sheets of paper. Take a piece of paper, fold it in half, count your panels: four.</p>
      <p>Hope this alleviates any printer headaches!</p>
      <p>Good luck with your project.</p>
