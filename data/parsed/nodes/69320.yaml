      <p>Hello, Evie!</p>
      <p>First of all, you have to decide in your InDesign layout how big your image has to be (width/height of the image box in mm or in).</p>
      <p>After that you open your image in Photoshop and select the crop tool (shortcut: C). In the upper horizontal bar you will see some fields for setting the crop tool. You set up there the width and height of the picture box from InDesign and, in the last field, set the resolution to 300 dpi (not 150). This makes the crop tool to constrain proportionally to these settings. After you crop it how you see fit, you convertit to CMYK (Image&gt;Mode&gt;CMYK) and then save it as a tif file.</p>
      <p>Now you have an image with the metric dimensions as it will appear on the printed brochure at 300 dpi (standard for print). If at 100% zoom setting in Photoshop this image appears of low quality, then you need an initial larger image to work with - otherwise it will print poorly. If it's OK, you simply place it in InDesign, as you described.</p>
      <p>When you export your PDF for print from InDesign, you go to File&gt;Export&gt;PDF. A panel will appear with settings categorized in the left column. Somewhere there you will find settings for dealing with raster files. You select from the drop-down menu "no compression" and "do not downsample" CMYK files. This should export you a PDF ready for print.</p>
