    html: |-
      <p>Working in RGB is still going to be problematic, even if the RIP makes the highest possible quality conversion, as the CMYK color range remains much smaller than RGB. So you will have this funky orange in a RGB file, which will then come out like a murky brown orange regardless of the conversion quality.</p>
      <p>I'd say a color-calibrated workflow is still a much better way to obtain optimal CMYK reproduction. Especially since it will be wysiwyg, as you're working in the limited color range all the time.</p>
