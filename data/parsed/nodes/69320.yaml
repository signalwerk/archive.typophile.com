    html: "<p>klickverbot (about the erratic results): CMYK has a lower range of colors than RGB mode. If, for example, you have a picture with sea water in very bright blue hues in RGB mode, when converting it to CMYK you may find that a lot of the details (such as water ripples) are lost. So you have to color balance and tweak the curves/levels of the image to get some of the detail back. Therefore, it's better to convert it yourself to CMYK and see more or less how it will look on the printed page and make final adjustments, rather than letting InDesign deal with the conversion.</p>"
