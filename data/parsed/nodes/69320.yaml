    votes: null
    html: <p>The RIP might have an internal conversion table, and thus produce the highest possible quality conversion, given that they know what paper it's being print on, with what dot density, and how much *exactly* their ink (toner?) deviates from ideally colored Cs, Ms, Ys, and Ks. That combination is hard to beat by general conversion profiles.</p>
