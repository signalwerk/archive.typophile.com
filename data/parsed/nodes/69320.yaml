      <p>You are pretty safe when you always make your images 300dpi. When you have an image open in Photoshop, set to 300dpi, you can see what the printing size is by going to Image -&gt; Image size -&gt; Document size - the values you see there is the size it will be.</p>
      <p>If you increase the resolution from 72dpi/150dpi to 300dpi via Image -&gt; Image size -&gt; Resolution, make sure 'Resample Image' is <em>unticked</em> before pressing ok. This will keep the pixel dimensions unchanged, and only adjust the printing size.</p>
      <p>After that, when you place the image in InDesign, you can see its effective resolution by opening the Info Palette and selecting the photo. There you will see 'Actual ppi', which will be 300dpi, and 'Effective ppi', which will also be 300dpi if you do not resize the image. If you make the image larger in InDesign, the Effective ppi will show a lower value, if you make it smaller the value will rise. With a good image, you can usually safely increase in size until the Effective ppi rises to about 240ppi. Sizing up until its 150ppi is the max, after that the image will very noticeably degrade in quality.</p>
      <p>To make a good printable PDF, you go to File -&gt; Export -&gt; and choose pdf and give it a name -&gt; there you can choose an Adobe PDF Preset from the drop down menu, for example 'Press Quality'. If you want easy results, you can then pick 'PDF/X-1a:2001' from the Standard drop down menu. Of course, you can also set everything manually (for example if you want crop-marks and such).</p>
      <p>However, you'll also want to set the color management options to both InDesign and Photoshop to the same settings. You can do this manually, or with Bridge. RGB to Adobe RGB (1998), and CMYK to whatever default CMYK profile is generally used in your area/country. Choosing 'PDF/X-a1:2001' as PDF preset, no color profile will be included. If you want one to be included, change it manually in the PDF export settings.</p>
