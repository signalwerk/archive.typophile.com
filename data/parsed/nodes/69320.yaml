    html: <p>First of all you have to decide where, how and on what type of paper you will print it. The resolution of your photo depends of the raster the typography will use to print your document. The size of raster depends from the paper. On the glossy paper you can use 175 lpi or even denser raster, so accordingly you need your pictures 300 - 340 dpi. If you use the offset paper (for example Arctic Paper design range like Munken Lynx) you have to increase the dot size to 133 - 150 lpi otherwise the fibres of paper will stick to the press form and the result will look like mud. Then the picture of 240 dpi will do. Just when you convert RGB to CMYK use the correct profile or ask the printers if they have any preferences. Usually for the glossy paper I convert everything to Euroscale version2, but by the method of trial and error fine lingerie photos I submit in Euroscale v.1. Offset paper manufacturers usually have their profiles for each paper for download in their webpages. And for the best results do the final sharpening when you have resized your picture to 100% in the needed resolution just before converting to CMYK.</p>
    html_clean: <p>First of all you have to decide where, how and on what type of paper you will print it. The resolution of your photo depends of the raster the typography will use to print your document. The size of raster depends from the paper. On the glossy paper you can use 175 lpi or even denser raster, so accordingly you need your pictures 300 - 340 dpi. If you use the offset paper (for example Arctic Paper design range like Munken Lynx) you have to increase the dot size to 133 - 150 lpi otherwise the fibres of paper will stick to the press form and the result will look like mud. Then the picture of 240 dpi will do. Just when you convert RGB to CMYK use the correct profile or ask the printers if they have any preferences. Usually for the glossy paper I convert everything to Euroscale version2, but by the method of trial and error fine lingerie photos I submit in Euroscale v.1. Offset paper manufacturers usually have their profiles for each paper for download in their webpages. And for the best results do the final sharpening when you have resized your picture to 100% in the needed resolution just before converting to CMYK.</p>
