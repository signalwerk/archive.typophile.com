    <p>Hello everyone,</p>
    <p>i'm hoping for some help as i'm still learning to work properly in Indesign. Hope i'm not sounding to stupid but  I'm making a litl 10 page booklet and i'm having some trouble with making a perfect pdf for print.</p>
    <p>a few questions:</p>
    <p>- I took all the pictures myself and they are all jpeg format(150dpi), do i import them into Indesign as an RGB or CMYK for print, and how do i actually convert them correctly is it simply opening the image in photoshop, image / mode / RGB or CMYK and save it?</p>
    <p>- for importing the images in indesign i do the following: i use the rectangle frame tool to draw a box, go to "file / place and then select the image. if for example my image is bigger than the frame i just use the direct selection tool (white arrow), select the picture and just scale it down. is this the trick or does this mess up the quality of the eventual printed document.</p>
    <p>Reason why i'm asking these questions is because lots of times my pictures don't look sharp after printing them, sometimes pixeled.</p>
    <p>here's how i make the printable pdf: when the document is finished i got to "file / adobe pdf presets" and choose "high quality print" basically that's it. </p>
    <p>most of the time i end up with poor quality prints for the images and i don't know what i'm doing wrong so i would really appreciate it loads if you could help a beginner out.</p>
    <p>thank you so much in advance</p>
    <p>Evie</p>
