      <p>A related question I've had for a while: I understand printers are also moving over to RIPs that take RGB source files and print them CMYK. The whole file is set up as RGB, all parts. They won't take CMYK files.</p>
      <p>This leaves me baffled as to how are blacks handled (or 100% C, M, or Y). 100% K doesn't exist in RGB accurately when converted to CMYK.</p>
      <p>100K is 35R 31G 32B; input 35 31 32 as your RGB values and you get 70C 68M 64Y 74K (in Photoshop, 70C 70M 64Y 78K in InDesign for example). </p>
      <p>How does the RIP know what % K to use? 70C 68M 64Y 74K is heavier than a rich-black, wouldn't that pose a problem for making a mess on the press with too much ink, or registration issues? Or if you just want 100K black text? I think the RIP is supposed to know what to do with text as a font, but what if your text isn't embedded as a font, just an outline? Or you want a 100K black box?</p>
      <p>Curious...</p>
