      <p>Hello everybody. I just saw this post. And I think that Adobe Clean resembles many features of Corisande. I am not sure if directly tweaked from it (specially considering identical corpus sizes, shape sizes, the striking similarities of i.e. l, c and o, that is always difficult to assure) but no doubt it is highly related. Probably not as dramatic as Frutiger and Myriad :-)<br>
