      <p><em>"A 'bit illegal' is like being 'a bit pregnant,' right?"</em></p>
      <p>Is a rolling stop at an intersection with no other cars around totally illegal or just a bit illegal? I think we are overloaded with lawyers, courts, judges, and juries because a bit illegal is more like a bit overweight — purely in the eye of the beholder. </p>
