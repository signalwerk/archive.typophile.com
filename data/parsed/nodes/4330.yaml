    html: <p>Peter, <br> <br>I think TypeTool is a great place to start--it's what I'm learning with myself. The price is affordable, plus it counts towards your purchase of FontLab when you're ready to move up. <br> <br>TypeTool incorporates all the features you need to create Type 1 and TrueType fonts from scratch. FontLab is much richer in features, but someone else like Adam Twardoch could elaborate better than I can... A big difference is the ability to create OpenType fonts.</p>
