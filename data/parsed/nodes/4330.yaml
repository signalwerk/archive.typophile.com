    html: <p>I may not have this right, but I'm pretty sure TypeTool lacks the capability to create OpenType fonts nor build multiple weights. <br> <br>Go to the <a href="http://www.fontlab.com/html/typetool.html" target="_blank">TypeTool site</a> and download the demo (ver. 2) and the manual. This would probably be the best way to find out if it has the features you're looking for. I tried a search on this site, but couldn't find exactly the answers you're looking for. You may try posting your questions in the "build" section.</p>
