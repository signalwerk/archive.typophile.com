    <p>Typophile readers have spoken! Well, at least 16 of you have. The results are in from <a class="freelinking external" href="http://typophile.com/node/104961" rel="nofollow">last post’s survey</a> on what I should pay for <a class="freelinking external" href="http://practicaltypography.com/" rel="nofollow"><em>Butterick’s Practical Typography</em></a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/surveymonkeyresults_6736.png"></div><p></p>
    <p>I’m not sure what the results do to inform the discussion around reader-supported web publishing endeavors but here are a few of my own thoughts on this little experiment:</p>
    <p>1. Most Typophile readers are not interested in what I pay for <em>Practical Typography</em>.<br>
    2 . Very few people actually read this blog. OK, maybe a few more than 16, but definitely not more than 23.<br>
    3. My 150+ Twitter followers have failed me. Can one “fail” at Twitter?<br>
    4. Anyone with a decent Klout ranking wouldn’t touch this one with a ten-foot ascender. I can’t blame them.<br>
    5. Maybe this was a silly idea.<br>
    6. I should probably go back to, you know, <em>designing stuff</em> and <em>teaching other people how to design stuff</em>.<br>
    7. I just paid $7.50 to take my kid to a local children’s museum. <em>He spent the whole time playing with a train set we already have at home</em>.<br>
    8. $7.50 is a respectable payment for <em>Practical Typography</em>.<br>
    I think. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/practicaltypographypayment_5831.png"></div><p></p>
