    html: |-
      <p>&gt; <cite> I believe there’s another program called LaTeXit</cite></p>
      <p>LaTeXit comes with <a href="http://www.tug.org/mactex/" rel="nofollow">MacTeX-2007</a>. You typeset your equation in LaTeXit, then select, drag and dropt it into your application. In Adobe Illustrator, I get a fully scalable object. In Word or PowerPoint, it is just a picture.</p>
