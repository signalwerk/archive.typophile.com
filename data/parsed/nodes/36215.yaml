  html: |-
    <p>I'm trying to create flash cards (in Adobe Flash) for a mathematics course, and it's driving me crazy trying to figure out the Ascii codes for all the mathematical symbols I need. I was wondering if anyone knows of a free font out there that has all the math symbols you'd typically find in an equation editor like MathType. </p>
    <p>If no one knows of anything I can get for free, is there a low-cost option out there that might do? I don't want to spend a ton of money on this, simply because I don't think I'd use the font all that much other than for the design for this particular course.</p>
    <p>Thanks for any information you can provide,</p>
    <p>Stevie</p>
