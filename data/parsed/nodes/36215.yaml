    html: <p>A more recent font is MnSymbol, that accompanies Minion Pro. The type1 and Open Type fonts are <a href="http://www.ctan.org/tex-archive/fonts/mnsymbol/" rel="nofollow">here</a>; if you look at the file <a href="http://tug.ctan.org/cgi-bin/getFile.py?fn=/fonts/mnsymbol/MnSymbol.pdf" rel="nofollow">MnSymbol.pdf</a>, you will see that there are probably more symbols than you will ever need.</p>
