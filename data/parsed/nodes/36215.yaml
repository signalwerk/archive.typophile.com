    html: <p>if you want good mathematical typesetting, I'd suggest not only looking at the fonts for LaTeX but actually using real LaTeX, and then pulling the outlines of your entire equations into flash. You can write formulas simply (with a standard math-like syntax) and not have to worry about spacing, superscripts, and so on. It becomes all the more important if you use matrices or large integral symbols and so on.</p>
