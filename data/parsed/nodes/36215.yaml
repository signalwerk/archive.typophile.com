      <p><cite><br>
      if you want good mathematical typesetting, I’d suggest not only looking at the fonts for LaTeX but actually using real LaTeX, and then pulling the outlines of your entire equations into flash.<br>
      </cite></p>
      <p>If you're using a Mac, there's a nice add-on to LaTeX that makes it easy to typeset a single equation, then import it into another Mac program as a PDF file:</p>
      <p><a class="freelinking external" href="http://evolve.lse.ac.uk/software/EquationEditor/" rel="nofollow">LaTeX Equation Editor</a></p>
      <p>I believe there's another program called <a class="freelinking external" href="http://www.apple.com/downloads/macosx/math_science/latexit.html" rel="nofollow">LaTeXit</a>, which is similar and perhaps better.  I don't use a Mac, so this information is based on what others have told me.</p>
      <p>Scott</p>
