      <p>One piece of advice: I think you’re right with the too many fonts idea. Try to cut down on all the different fonts - consistency doesn’t have to be boring.</p>
      <p>Even on the cover if you could take out one of the fonts and re-use one of the other ones, it would eliminate some of the clutter that is facing you in the rest of the project. You could also turn the March &amp; April section into 2 columns and fill that space while opeing up the rest below for more white space.</p>
      <p>And watch out for that white on yellow stuff, I can barely read it and that’s on the computer, it won’t get better when printed.</p>
      <p>—-</p>
