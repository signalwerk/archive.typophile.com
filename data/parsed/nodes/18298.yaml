    <p>I’ve been doing a Newsletter for my Church for a while now but I need some constructive criticism of how it looks.</p>
    <p>Sometimes I don’t know what font to use and I think I’m using too many. If you guys could provide some input and suggestions I would really appreciate it. Anything helps I what to really improve it for the month of April. One of the challenges is that it has to be bi-lingual so it’s kinda hard to do diferent layouts.</p>
    <p>It’s in pdf format this is the direct link:</p>
    <p><a href="http://vidanueva.cc/spanish/recursos.../Feb%20NLC.pdf" title="http://vidanueva.cc/spanish/recursos.../Feb%20NLC.pdf">http://vidanueva.cc/spanish/recursos.../Feb%20NLC.pdf</a></p>
    <p>I really want to improve my typography skill specialy since I found this site.</p>
    <p>Thanks for your help</p>
