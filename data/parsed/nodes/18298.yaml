    votes: null
    html: |-
      <p>Kristian,</p>
      <p>The reason most people don’t like it is because it’s a MS knock-off of a solid sans, you may know. HELVETICA. MS decided they didn’t want to pay menial licensing fees to use it, so they commissioned someone to make something nearly like it. </p>
      <p>That being said, type should be designed for need, or specific use in the aesthetic realm. Getting around licensing fees isn’t considered an aesthetic need,therefore it is considered weak. There is a bit of difference, the tops of the t’s are chopped off, the leg of the R is different etc... I think part of has to do with overuse, I just prefer to use the real thing. Set a block of text in Arial and then in Helvetica, and see which reads better. </p>
      <p>Garamond in good body text. I’d have to agree w/ Nick on the too many fonts end. Do you have any kind of budget in the printing dept. you could talk into buying nice display family? I think if you get a nice modern sans with a bit more character that Arial/Helvetica.</p>
      <p>Eric</p>
