      <p><em>Filosofia seems to be an exception for me.</em></p>
      <p>Yes, while the didone style says fashion, it has to be clean cut (rich?) and the hairlines can never be too thin; with its interpretive serif treatment Filosoﬁa is a little too post-modern.</p>
      <p>M/M redesigned <em>Interview</em> a couple of years ago using Scotch Modern, but I’m afraid it looked a little too academic for Fabien Baron, and was promptly abandoned.</p>
      <p>ITC Bodoni is another didone that incorporates the trace of letterpress process, again not ﬁnding much favor as a fashion face.</p>
