      <p>Nick, I agree that usually Didone faces connote fashion, but Filosofia seems to be an exception for me. Maybe it's just a personal association—that's why I was wondering if anyone has ever actually seen it used in a fashion context. It also could be, as Hrant suggested, that it's simply dated.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/didot_vs_filo-02_4403.jpg"></div><p></p>
      <p>Hrant, I'm actually liking your suggestion of Ernestine. We could even replace Museo with it as well—I think having 3 corporate typefaces is overkill anyway. I wish there was at least one thinner weight, though.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ernestine_4155.png"></div><p></p>
      <p>Like you mentioned, we're not necessarily haute couture. Some of the higher end brands we carry are OGI, Derek Lam, Guess, Oakley. Some of the lower are Smith Optics, Ernest Hemingway. So there's a pretty broad range of styles.</p>
      <p>David, I would like to see something more own-able as well. I think especially the use of Chalet is running on the safe side. But maybe pairing it with one more unique face will help that.</p>
      <p>No takers on the "make me love Filosofia" request?</p>
