  html: |-
    <p>Hi everyone,</p>
    <p>With the recent developments in web typography: web fonts, latest browser upgrades, higher screen resolutions, mobile devices, iPhone, iPad, responsive Web Design, etc, what's the best practice when it comes to setting type on the web, is it better (in terms of usability, accessibility, readability) to set the font size in pixels or ems? What about the margins, padding and line-height?</p>
