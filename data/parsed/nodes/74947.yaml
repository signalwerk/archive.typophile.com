    html: |-
      <p>All methods are valid.</p>
      <p>The argument against pixels in the past was that, as usual, Microsoft screwed things up and IE couldn't resize type set in PX. If that's still a concern, use anything but pixels. Most modern browsers now scale the entire page and can deal with pixel units just fine. </p>
      <p>In terms of accessibility and usability, make sure you aren't using an insanely small default font size setting and aren't going nuts with the contrast (too much or too little). As for readability, stick with your design skills. Most of the same rules apply online as they do on paper.</p>
