      <p>Hi Nancy,</p>
      <p>what Jan said.<br>
      This might have started out with a font, but if so, it has been heavily customized –&nbsp;perhaps beyond recognition of the potential base typeface. Or, just as well, it might have been drawn completely from scratch. Keep in mind that not every letter is part of a font.</p>
      <p>If you are looking for fonts in a similar style, <a href="http://sudtipos.com/home" rel="nofollow">the Sudtipos foundry</a> is a good starting point.<br>
      F</p>
