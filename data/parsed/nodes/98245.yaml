    <p>Hello Everyone,</p>
    <p>Looking for some input on a New Years resolution I'm making. For the next year I want to work with a limited set of typefaces. </p>
    <p>The idea of working with "a few good typefaces" has always appealed to me, but I've never decided what those should be. Now that web fonts are sufficiently supported (90% of my work is web design), I have decided to pick 20 typefaces to work with all year.</p>
    <p>But I have a slight problem. I narrowed my selection down to 17  typefaces and don't really see any more that seem necessary.  Do you see some glaring omissions in this list? Or is 20 not really a very restrictive number? Should I aim for 10, 5? </p>
    <p>Here's the selections so far:</p>
    <p><strong>THE SERIFS</strong><br>
        1 - Beufort<br>
        2 - Caecelia<br>
        3 - Clarendon<br>
        4 - Chapparrel<br>
        5 - Palantino Nova<br>
        6 - Perpetua<br>
        7 - Georgia<br>
        8 - Iowan Oldstyle<br>
        9 - ITC Charter</p>
    <p><strong>THE SANS</strong><br>
        1 - Avenir Next<br>
        2 - FF OCR<br>
        3 - Gill Sans<br>
        4 - Myriad<br>
        5 - Optima Nova<br>
        6 - Sweet Sans<br>
        7 - Trade Gothic<br>
        8 - Verdana</p>
    <p>What would you add or subtract?</p>
    <p>Thanks,<br>
    Moe</p>
