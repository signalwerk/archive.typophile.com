      <p>Thanks Chris for your input. A couple of contextual clarifications. </p>
      <p>1)  Based on my clients web analytics, less than 5% of their customers are using Macs. So <em>very</em> few of them will have retina displays (and honestly, I think we're still several years away from these displays being mainstream)</p>
      <p>2)  The typefaces that were selected which also happen to be system fonts were chosen because they have been hinted for the screen. Honestly, I don't know if many of the other typefaces recommended here are. Until retina displays are mainstream, this is still important for anyone serious about type looking <em>crispy</em> on the web. Sadly, a lot of great typefaces designed for print turn to absolute mud on the screen.</p>
      <p>But as for using Helvetica on wedding invitations, I couldn't agree more! Used it last year for a baby shower card. Worked great.</p>
      <p>-Moe</p>
