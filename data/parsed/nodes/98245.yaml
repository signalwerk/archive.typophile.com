      <p>And, to actually address the topic of the thread, I disagree quite a bit with your list — of course every designer will disagree with a list like this, but here's my opinions:</p>
      <p>Chaparral (note the spelling) is fairly similar to Caecilia — both kind of humanistic slab serifs. I would never use Perpetua for anything on screen. It's too delicate. What about some classic serifs — a Garamond, a Jensen, a Janson? </p>
      <p>Baskerville is very different from Georgia — I'm not sure how that replacement works. Georgia is more similar to Caslon than Baskerville. </p>
      <p>There's certainly a more interesting monospaced font than Courier.</p>
      <p>How about Scala, which looks great on screen?</p>
      <p>I could do without Verdana, and I might add Scala Sans or some other humanist sans.</p>
      <p>If you think through the different categories of serifs and sans fonts, and different historical models, you can probably put together a more comprehensive list without making it any longer.</p>
      <p>And a few nice display faces are in order too....</p>
      <p>Here's a thought — since this is a resolution, why not resolve to license and use only recent releases for your list of fonts? So for every category, choose one new font by a smallish or up-and-coming foundry to use. Then you would be limiting yourself to your list, but also expanding your knowledge of contemporary type design. And you could get to know some lesser-known fonts and support some independent designers along the way!</p>
      <p>Good luck!</p>
