      <p>Asking type designers about using fewer fonts is sort of fruitless. They tend see it as a loss of income.</p>
      <p>Most of the really good book designers I know work with about 4 text faces. They'll change those from time to time. A few more for display.  The plus is they get to know the fonts they use very well. One exception was Richard Eckersley, he'd usually cut that to one or two fonts. Believe he only used Trinite (and Baskerville, if Trinite was just wrong) the last 3-4 years of his life.</p>
      <p>The paper used for printing is a factor -- if this is indeed about print projects. Hard to find fonts that work equally well on both coated &amp; uncoated stocks. </p>
      <p>And BTW, for text, Perpetua doesn't work with ink on paper, either, unless you're talking 14-point, metal type/letterpress printing. For display, it can work. However, I suspect from the fonts you've selected you're doing work for the web?</p>
