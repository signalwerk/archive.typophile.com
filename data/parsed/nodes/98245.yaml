    html: |-
      <p>I did not realize they were strictly for screen. Given that we are rapidly approaching resolutiution that exceeds our visyal acuity threshold, fonts designed for screen are irrelevant. Basically, past a certain point, we can only see so many dots per inch. Some say we are there with apple’s Retina Displays. As such, designing for screen is finally moot.</p>
      <p>Regarding your choices, I still think you’re crazy ;).</p>
      <p>First, Gill is sooooo far from Futura there’s no way one can possibly replace the other. One is humanistic, looks good as a sans for small body copy, the other is almost perfectly geometric. Just compare the [a] and [t] glyphs. The Berthold Futura also comes with small caps and oldstyle figures (SC &amp; OSF). Rare for a sans.</p>
      <p>As far as your other replacements, Myriad = Univers, they don’t even come close to resembling one another, and Univers kicks the siht out of Myriad bassed on the size of its family alone.</p>
      <p>Bodoni is a tough call, and I might give you that one. I have never used it for body copy, and sometimes for display. But in an “I can only have so many” list, I think having a didot is essential.</p>
      <p>Caslon. Possibly one of the best workhorse fonts even designed. “When in doubt, set it in Caslon.” Somewhat of a “if theres a chance things are going to go totally of the rails, I better use this one just in case.” However, this adage came from the days of potentally poor paper and printing (deliberate alliteration).</p>
      <p>Century Schoolbook, again, not even close to Georgia so I’m not sure where the replacement logic comes into play. Century is another fantastic workhorse. Easy to read (some say bassed on frequency of exposure), good x-height, strong bold, salient italic, another very good go-to. Personally, I prefer ITC Century.</p>
      <p>Oh, and I may have missed a few. You should have a glyphic, Optima is pretty standard, but has quite a small family. I prefer Nick Shin’s <strong><a href="http://www.fontshop.com/fonts/downloads/shinntype/beaufort/" rel="nofollow">Beaufort</a></strong>. Mainly due to the size of the family, and the presene of SC &amp; OSF.</p>
      <p>Also a blackletter. Possibly <strong><a href="http://www.myfonts.com/fonts/linotype/san-marco/" rel="nofollow">San Marco</a></strong> as it traditionally pairs well with Garamond. I think that came from Bringhurst, but my library is in storage. If you went for some <strong><a href="http://www.linotype.com/search/goudy#603ce4d6a2eab537102f7929695ab6ed" rel="nofollow">Goudys</a></strong>, you’d be killing two birds with one stone (serif &amp; blackletter from the same family).</p>
      <p>For a swash I’d have to go with <strong><a href="http://www.fontyukle.net/en/1,poetica" rel="nofollow">Poetica</a></strong> again, due to the size of the family. That, and the set of ampersands simply kicks ass.</p>
      <p>Script, never used that many, but I find myself leaning towards <strong><a href="http://www.myfonts.com/fonts/linotype/kuenstler-script/" rel="nofollow">Kuenstler</a></strong>.</p>
      <p>When selecting a typeface, two of the most important things I consider are:</p>
      <p>1. The size of the family (range of weights, italics &amp;c).</p>
      <p>2. Does it have SC &amp; OSF?</p>
      <p>If it doesn’t meet those criteria, it seldom makes it to the list of contenders. If you *cough*Paul*cough* want to get into a discussion about appropriateness for the context, I will still say a skilled typographer can use most any typeface and have it speak in a certain tone of voice through use of additional design decisions such as colour, space, size &amp;c. The same old Helvetica wedding defence. </p>
      <p>And definitely look into Starling. It truly is a work of art (and Mike Parker is a wonderful person).</p>
      <p>I still might be missing your intention, but it seems as though most of your selections are cheep, if not free, and lousy covers of the real thing. Right down to being pre-installed system fonts. Is there a logic to this?</p>
      <p>BAM!</p>
