      <p>Thanks Dean, I appreciate your viewpoint. Thanks for the link to Starling as well, I'll have to take a good look at that.</p>
      <p>All of the other fonts you mentioned were on my short list and got removed for the following reasons:</p>
      <p>Univers - too similar to Myriad on screen<br>
      Futura - x-height is a bit small for screen. Replaced with Gill Sans</p>
      <p>Garamond - replaced with Iowan Oldstyle<br>
      Baskerville - Replaced with Georgia (on the screen, pretty similar)<br>
      Bodoni - Removed. Too difficult to reproduce on screen at even medium sizes<br>
      Caslon - Removed. Too similar to Iowan Oldstyle on the screen<br>
      Courier - Completely overlooked selecting a mono-spaced font, thanks!<br>
      Century Schoolbook - Replaced this with Georgia, but that might have been hasty, on screen they're fairly distinct.</p>
      <p>Please don't cringe at these substitutions, I do realize these typefaces in print are very distinct from one another and have unique histories. But since this exercise is almost exclusively going to be carried out on the screen, these typefaces become similar enough (to my eye at least) that I didn't think the redundancy was warranted.</p>
      <p>Is this way off base? Are there better compromises to take, or important features that I missed?</p>
      <p>-Moe</p>
