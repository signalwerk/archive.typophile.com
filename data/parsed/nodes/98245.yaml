      <p>Well, any reply is going to get disagreement, but I'm a big boy, so here's an example.</p>
      <p>Far as I'm concerned, Merlo work fine on a coated stock. But not on uncoated, if set large than 10 point, and at 10-point, it is hard to read for anyone of the eyeglass generation.</p>
      <p>Same holds true with a number of Adobe's medium weights. Far as I'm concerned, the "regular" weights in .otf were set up for best appearance when laser printers were used to output the type. Probably not a bad decision on Adobe's part. For book fonts, Adobe assumed coated stock, and gave us the medium weights. But they're usually too heavy when used on uncoated sheets, where the ink spreads more.</p>
      <p>It really is a matter of how the ink is applied to and taken by the paper.</p>
      <p>* * *</p>
      <p>Type that looks good on a laser printer will be a bit weak if printed offset, on uncoated  paper, and 2400+ dpi with direct-to-plate plates. If you go back to when PostScript was first printed without an intervening repro stage, and again when direct-to-plate technology came out, you'll see all sorts of complaints about type being too thin &amp; spindly, even though it looked good on lasers. Usually the printer was blamed, but it wasn't the printer's fault, it was the type publishers. Remember that with DTP, the halftones are in the same file, and dotgain has to be minimized. Simply increasing the exposure when burning the plate isn't an option for the printer.</p>
      <p>That's an old argument, and the counterargument today is everybody's eyes have adjusted to thinner, weaker type. Not a very good counterargument, IMSLTHO.</p>
      <p>* * *</p>
      <p>As for "understanding" a typeface, Rich Hendel remarked that with Trinite, he could steal Richard Eckersley text specifications, item for item, and the book still wouldn't look right. I know what he means, and can't explain it, either.</p>
      <p>Broadening that to a more reasonable position, there will be certain measure/size/leading/margin relationships that work better than others with individual types. Varying one does NOT mean a simple scaling of the others. When you go from a 6-1/8 x 9-1/4 to a 6x9, or have to get a few more/less characters on a page, what do you do? That's where having a type in your fingers pays off.</p>
      <p><cite>Edit:</cite></p>
      <p>I do know a couple book designers who could just take a font &amp; make it work. During the 1980s and 1990s, the designer who got the most books in the AAUP Book Show for any given year was usually either Richard Eckersley, Rich Hendel, or Mary Mendell (an alphabetical sorting). Mary could, and did, make just about anything work well.</p>
