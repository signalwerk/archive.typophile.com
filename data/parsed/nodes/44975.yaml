      <p>I always remember hearing differences of opinion on Spanish translation. There were 2 guys from the east who spoke a Caribbean version of Spanish and a women from the southwest who spoke a Mexican Spanish. They never seemed to agree on the translation. We were trying the impossible task of having a universal Spanish translation. Your best bet might be to go with the region you live and work in. If your audience is New York, perhaps the typical Puerto Rican way is best, for LA, perhaps the Mexican preference would be best?</p>
      <p>ChrisL</p>
