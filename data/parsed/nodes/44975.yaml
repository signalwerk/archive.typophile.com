      <p>Thanks for all the input. </p>
      <p>I know, I was worried about the regional thing, that's why I was wondering if there was something more proper. I am currently located in San Diego, and got most of my Spanish education here, but then I also lived in Spain, so my Spanish is more Spanish than Mexican. But I know if I move to another part of the country, NY for example, that will change things all over again. Empaque sounds best so far... I'll keep asking around and try to figure it out.</p>
      <p>Thanks again.</p>
