    <p>I have a somewhat random question for the Spanish-speakers out there. When referring to packaging, as in packaging (graphic) design, Spanish, is it just called "packaging"? Or is it more formal to say something like "embalaje"? I'm designing a bilingual portfolio. All the design blogs and articles that I've ever read in Spanish just say "packaging", but I'm wondering if that's the term I should use for the Spanish portion of the portfolio, too.</p>
    <p>Thanks!</p>
    <p>Cassie</p>
