      <p>Not a simple question as the answer seems to vary depending on person and region.  Like you mentioned a lot of people say packaging, but that's often used to sound more cool than proper.  </p>
      <p>A survey of possibilities: envase, embalaje, empaque.  I would personally go with the former if you can stick "diseño de" (~ design), but my opinion is hardly authoritative, I asked around to double check and got different answers from all, but those were the three recurring ones.  If you have to use it alone I would probably go with empaque.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
