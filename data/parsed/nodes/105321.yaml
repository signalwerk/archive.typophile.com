    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sandiego_6256.jpg"></div><p></p>
    <p>This font comes from a San Diego Chargers wallpaper. WhatTheFont IDs it as Rogue Sans, but that's not it. I'm not sure if the serifs have been added to an existing typeface to go with the font used for the 'Chargers' name (see the logo in the top corner of <a href="http://www.chargers.com/" rel="nofollow">the Chargers website</a>).</p>
    <p>Any help greatly appreciated! Thanks.</p>
