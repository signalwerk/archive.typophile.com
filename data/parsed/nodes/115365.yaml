      <p>According to the copyright note in the font, this is "Sans Poster Bold JL" reworked with a starry effect. My initial impression is that "Sans Poster Bold JL" is not a rip of another font-maker's work. So here is a link to "Starlight Sans JL" <a href="http://www.fonts2u.com/starlight-sans-jl.font" title="http://www.fonts2u.com/starlight-sans-jl.font">http://www.fonts2u.com/starlight-sans-jl.font</a><br>
      Note that Jeff Levine's website, "Jeff's Fonts &amp; Dingbats" has expired.<br>
      Don</p>
