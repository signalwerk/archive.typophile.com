    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Indices</a>&nbsp;: <a href="/node/12207/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">History</a>&nbsp;: Carolingian&nbsp;Miniscule</strong></p>
    <p>Sometimes called <a href="/node/13705/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Caroline</a>.</p>
    <p>Around <a href="/node/add/wiki?edit%5Btitle%5D=800" title="Create node &quot;800&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">800</a>, <a href="/node/13830" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-lost">Charlemagne</a>—king of the Franks and the first emperor of the Holy Roman Empire—decided that all his lands should write out their Latin texts with the same handwriting style (even though he himself was illiterate). His court scholars developed a hand, which was loosely inspired by a variety of <a href="/node/13703/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Uncial</a> styles. This has been called Carolingian Minuscule by historians, and it looks almost identical to our current lowercase Latin&nbsp;alphabet.</p>
    <p>During the Renaissance (c.<a href="/node/add/wiki?edit%5Btitle%5D=1465" title="Create node &quot;1465&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">1465</a>), two German printers, <a href="/node/add/wiki?edit%5Btitle%5D=Conrad%20Sweynheym" title="Create node &quot;Conrad Sweynheym&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Conrad Sweynheym</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Arnold%20Pannartz" title="Create node &quot;Arnold Pannartz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Arnold Pannartz</a>, were hired by a monastery in Subiaco, <a href="/node/19599/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Italy</a>. Seeking to find a more Italian alphabet for their new employers (as opposed to the Teutonic blackletter type of their homeland), the two sought to research classical Roman literature. However they unknowingly were reading <a href="/node/add/wiki?edit%5Btitle%5D=9th%20century%20ce" title="Create node &quot;9th century ce&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">ninth-century</a> transcriptions in Carolingian Minuscule and falsely assumed that this was actually an Ancient Roman invention, just like “capital” monumental letters. The two combined the two alphabet forms in text—<a href="/node/14510/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">upper</a> and <a href="/node/13807/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Lowercase</a>—just like we do today (actually, we only do it because they started it…). The first italian “Roman” typefaces (like <a href="/node/13706/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Nicholas Jenson</a>’s work in Venice), borrowed this two-case innovation from the&nbsp;scribes.</p>
