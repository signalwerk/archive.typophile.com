    html: <p>Block quotes one point smaller than the main text and indented is a standard practice, and will look "normal" to readers. I'm not sure if it's wise to have your baseline grid any finer than 1/2 your normal text line size (point size + leading). You want your bottom lines on facing pages to line up. When I did this recently, I didn't lock the block quotes to the grid, but let them float, and made visually equal space before and after. Maybe there are better ways to do it, but that worked.</p>
