      <p>Try the locking the body copy to the document baseline. I always define this in the paragraph styles.</p>
      <p><em>...is this sort of visual hierarchy advisable?)</em><br>
      You might want to consider upping the blockqoute, but this all depends on the style you are after. If they are more important than the notes they should get more attention. The New Yorker have smaller quotes in text, btw. It works quite nice for them.</p>
      <p>Are you using Minion’s optical sizes?</p>
