    html: <p>As you can see <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/minion/" rel="nofollow">here</a> Minion comes with a multitude of versions. I’m refering to Capt(ion), Disp(lay), Subh(eader). These are, in addition to the normal version the optical masters. Each version is intended to be used at a specific size. You’ll have do some exploring yourself, but the idea is to have a page of even color across all sizes. A good optical size also take into consideration the typical needs for it’s intended size. This might include changing the cap-height, x-height, ascenders or descenders length, spacing, width, weight, trapping, degree of openness, etc. One size does not really fit all, even though digital makes it possible.</p>
