    <p>Hello, everyone! I'm on my first book layout project and I'm having trouble setting the baseline rhythm. The manuscript has a lot of blockquotes and footnotes.</p>
    <p>Body type is set in 11 pt Minion Pro.</p>
    <p>Blockquotes, footnotes and endnotes are also in Minion Pro, though at 9.5 pt. (I've made all three equal in size...is this sort of visual hierarchy advisable?)</p>
    <p>These are what I hope to achieve:</p>
    <ul>
    <li>Leading for body type that is proportional to the one used for blockquotes, etc.</li>
    <li>Baselines that match up on both sides of the page (this is a developing country and we don't always have good quality paper)</li>
    </ul>
    <p>I've tried setting tiny baseline increments I can multiply later, for example, 2 or 3 pts. I don't mind the lines so much, and I'm able to maintain proportionate leading by tweaking font sizes. However, the baselines don't match up on both sides of the page.</p>
    <p>Any tips? I've looked through some threads about baselines in this forum, but so far I haven't encountered recommendations specifically for book design.</p>
