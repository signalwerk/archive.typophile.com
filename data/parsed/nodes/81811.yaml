    html: <p>Yes, definitely lock the main body text to the baseline grid. Don't drop the point size of block quotes. (I know this is very typical, but it's a Victorian custom with no real benefit; simply indent both sides of the quote to match the paragraph indents, or set in italics or sans serif or something; no need to drop the size.) If you disagree and do end up setting the block quotes smaller, incorporate a blank line as a "space before" option in the style, then manually baseline-shift the whole quote to visually center it between the line above and the line below, the position of which will be determined by the grid.</p>
