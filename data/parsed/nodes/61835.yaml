      <p>I'm glad to hear that – thank you! If you need it *now* it won't be early enough… but if you drop me a line at altairas_eye at mac dot com  I'll make sure to alert you when it becomes available.</p>
      <p>Regarding inspiration/similar fonts, some people think Archer is similar, but that was already mentioned in this thread and frankly, I myself don't think it shares the exact "same spirit" (although I like it). My inspiration has come from a whole bunch of different sources, most of which are actually quite different from this.<br>
      But if you like friendly slab serifs that are still readable at smaller sizes, there's stuff like <a href="http://new.myfonts.com/fonts/adobe/pmn-caecilia/" rel="nofollow">PMN Caecilia</a> or maybe Gerard Unger's <a href="http://new.myfonts.com/fonts/bitstream/oranda/" rel="nofollow">Oranda</a>. But those are probably less quirky than you want – more businesslike. You might also like <a href="http://new.myfonts.com/fonts/canadatype/clarendon-text/" rel="nofollow">Clarendon Text</a>. There's a bunch of stuff in that genre… What's the packaging for if I may ask?</p>
