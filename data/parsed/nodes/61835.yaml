      <p>Thank you for all the info. I´ll send you an e-mail from my work address.</p>
      <p>The packaging is for a chain of bakeries in Galicia, Spain. It will be applied on the packaging of all kinds of breads, cookies, sweets, etc. All very natural, rich and tasty products. Simple and delicate design for a down-to-earth yet sophisticated brand. No pretty pictures of the products on the packs, just see-through windows or transparent wrappers with colorful labels and tags. That´s why they are so text-heavy. And that mixture of structure and quirkiness is exactly the philosophy of the bakery.</p>
