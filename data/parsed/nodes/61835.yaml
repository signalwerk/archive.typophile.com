    <p>Hi there, I´m looking for fonts similar in spirit to american typewriter light. So basically I am looking for simple-structure fonts with quirky details here and there, such as fancy or oversized serifs, odd-designed characters and such. ( perhaps even going further than Amer. typewriter but still retaining legibility)<br>
    It doesn´t matter if it´s sans or serif, old or new.<br>
    Thanks in advance</p>
