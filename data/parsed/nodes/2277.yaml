  date_raw: 2 Dec 2003 — 1:17pm
  votes: null
  html: <p>So I'm thinking of buying the Czech Type Library from Storm &amp; I was wondering what people's opinions were of it. I did a quick search through Typophile &amp; saw that a few people actually have it, and some have used some of the faces in it. <br> <br>Specifically, are there faces that work really well for long amounts of text? I'm thinking specifically of Tyfa &amp; Regent. I'm mildly worried about how mannered Storm's faces are - i.e., Serapion &amp; Biblon - and how that would affect their suitability for longer copy. Oddly, my eye finds Preissig easier to cope with than either of these. <br> <br>Anyhow, just thought I'd ask before my wallet becomes $200 lighter ;-)</p>
  html_clean: <p>So I'm thinking of buying the Czech Type Library from Storm &amp; I was wondering what people's opinions were of it. I did a quick search through Typophile &amp; saw that a few people actually have it, and some have used some of the faces in it. <br> <br>Specifically, are there faces that work really well for long amounts of text? I'm thinking specifically of Tyfa &amp; Regent. I'm mildly worried about how mannered Storm's faces are - i.e., Serapion &amp; Biblon - and how that would affect their suitability for longer copy. Oddly, my eye finds Preissig easier to cope with than either of these. <br> <br>Anyhow, just thought I'd ask before my wallet becomes $200 lighter ;-)</p>
