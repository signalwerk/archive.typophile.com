    html: <p>Hmm. So I bought the Czech Library last night. Love it, but there are a few odd problems. Some of the fonts are missing, and several don't show up in PDFs. Or, rather, they show up as a line of dots. <br> <br>I'm figuring the self-extracting archive might be corrupted (?). Never run into this before, so what's the protocal for something like this? Should I contact MyFonts where I bought it, or Storm Type directly? Or does it matter? <br> <br>And thanks for the recommendation of Týfa, Tiffany. I'll definitely keep that in mind.</p>
