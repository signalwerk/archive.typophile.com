    html: <p>&lt;font class="dontLookLikeCrap"&gt;I bought the Czech Type Library last month... it is fantastic. My favourite is Tyfa. Yes, very ideosyncratic. I love Serapion, but what to do with it? Not setting long texts, surely (?). <br> <br>I ran into some problems with some of the fonts in the library... family linking, etc. But I solved it by re-juggling them in FontLab. But for some reason the OSF and SC fonts of Regent live with the multilingual fonts at the bottom of my font menus. Why is that? They did cause a few glitches as well (qutting Word). Laurence, could you tell Storm this while you're at it as well? Thanks!&lt;/font&gt;</p>
