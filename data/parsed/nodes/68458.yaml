      <p>Perhaps have a look at <a href="http://www.paragraph.com.au/mentone.html" rel="nofollow">Mentone</a>? Alternatively, and I realize it's a heresy, you can take any font and simply add a stroke around it with rounded joints.</p>
      <p>BTW I know of Fido and I really really like their slightly rounded font. I am too not sure if it's Alte Haas. It looks like it, but given the size of Fido I think they are more likely to commission the replica than to use an (effectively) abandoned font.</p>
      <p>(edit)</p>
      <p>Here's what I meant by adding a stroke to round the type. Top is Alright Sans Medium, bottom is Alright Sans Regular padded with stroke with rounded corners. You can see some distortion in letterforms, especially in /r/ and /e/, but it is not <em>that</em> bad.</p>
