      <p>I don’t think you can solve this kind of a problem with just a typeface.<br>
      You have to have some idea of how you are going to set it.<br>
      Whimsy suggests, for instance, an old-style face with an ostensibly conservative personality, set large without much leading, on a narrow measure.</p>
