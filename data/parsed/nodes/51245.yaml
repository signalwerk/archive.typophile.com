    <p>I am doing an identity redesign for a dance studio. I am running into the wall regarding typography.</p>
    <p>The dance studio caters to an eclectic genres of dancing—ballroom, salsa, hip-hop, swing, tango, zumba, latin, flamenco, and other style of dances I am not familiar with. The typography has to appeal to a broad audience of dancer and encapsulate a whimsical feel.<br>
    (man, i sound like my worst client)</p>
    <p>Can i get a few suggestions?<br>
    Thanks in advance for all of your feedbacks.</p>
