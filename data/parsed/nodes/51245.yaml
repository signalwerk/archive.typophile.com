    html: |-
      <p>Oh, I thought you were after a general typographic look, not a logo/wordmark.<br>
      If you are thinking of a script wordmark, you should consider an OpenType script with contextual glyph substitutions, which will give more of the look of custom calligraphy. Veer and House are good places to look for such things. (Not to mention my own Handsome.)</p>
      <p>If all goes well, you will be able to preview these effects at the new MyFonts.</p>
