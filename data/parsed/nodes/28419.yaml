      <p>I like the terminal you've made for me quite a bit, Bram. Cutting it at an angle makes the form less rigid and mechanical, and that slabby-wedge shape is more graceful than the thick square that I was using. </p>
      <p>As far as tilting the pen angle goes, I think it's worth a shot. It may take a little time to implement, though, so don't hold your breath. Some diagonal cuts and subtle curves would help this design chill out a little. I don't want to lose too much of that stark verticality, though; I may be wrong, but I think that's what gives it some personality.</p>
      <p>This is exactly the kind of stuff I'm looking for, and I am very grateful for your help.</p>
      <p>David</p>
