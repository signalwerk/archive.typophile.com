      <p>Hi David,</p>
      <p>Looks great! It definitely is very energetic. </p>
      <p>One thing that jumps a bit at me is the terminal of the lower ear of the g. This brush stroke terminal only occurs at the g and feels a bit off-tune. What about giving it a cornered serif just like the j?</p>
      <p>While having only serifs on the right stem of all multistem letters (e.g. m, n, x, h, k) gives it that creative off-the-beaten-track-energy (I think 'Froggy' from Dezcom also has this scheme), it impedes a bit the readability I think. But depending on the application this could be perfectly o.k. </p>
      <p>Did you consider having two-sided serifs on single stem letters like l, r, f? Their current a-symmetric right pointing serifs look a bit confusion if you just see the individual letter, but when reading words, it's o.k. What sbout a serif having a small left pointing part? Why doesn't the i have a serif?</p>
      <p>Btw, your specimen looks great!</p>
      <p>Take my input with a grain of salt, I am a beginner myself...</p>
      <p>Sebastian</p>
