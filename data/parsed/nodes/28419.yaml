      <p>Termopolium: Thank you for commenting on the "tense" curves. The curves and the verticality of the face make it a bit rigid and static, and maybe letting them loose will improve it. I'll try to work on this and get a new specimen up, but it might not be immediately. </p>
      <p>Bram: I am indeed trying to make something that is very readable in text, and hadn't looked at Swift before you mentioned it. I'm eager to hear how you think it reads.</p>
      <p>Sebastian: Thanks for showing me what you mean about the g. I think I understand your point, but I want to make sure. I know that you're talking about the brushy end of the stroke, and adding a terminal there is an interesting approach. I was concerned about the gap being too quirky before, and this makes it quirkier. Will it still work in text? </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/djr_g2_6702.gif"></div><p></p>
      <p>Normally the terminal comes out of a thin stroke, not a thick, and I'm worried that all that weight next to that gap might be too distracting in text. It's worth playing around. However, I see now that you were also talking about the contrast of the loop, and I really like what you've done here; it matches the other letters much better. </p>
      <p>Cheers,<br>
      David</p>
