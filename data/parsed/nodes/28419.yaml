      <p>Looks great! Definitely has a personality.</p>
      <p>Some observations:<br>
      * The L is optically too narrow.<br>
      * The R feels a little "tense". Relax the curve a little bit. This is currently the biggest problem I see with the typeface. Same thing, in much smaller degree, with the Q.<br>
      * g feels slightly awkward. I'm referring to the lower ear. Makes the g sort of stick out.<br>
      * When faced with a choice, always go for more restrained and readable. I think you do that, most of the time.</p>
      <p>Really looking forward to seeing this one finished!</p>
