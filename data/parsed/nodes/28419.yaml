    html: |-
      <p>So I've finally gotten around to incorporating your suggestions on this semi-serif face (still unnamed). A pdf is up top in the original post. It's been a while I know; I've been letting this font simmer while focusing on other projects.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/djr_alphabet2_4019.gif"></div><p></p>
      <p>I tried to fix the curves up a bit, but things still seemed a little tense. In the old version, the stems were vertical, and to me the serifs made them optically lean back a touch, adding to its stiffness. In this version, I've tried compensating for that by giving it a little tilt. Let me know if you think it works.</p>
      <p>I couldn't get bilateral serifs on the single-stemmed letters to work; it impeded the rhythm too much. I did work a lot with the lc g, using Sebastian's examples as a guide (thank you again Sebastian for your work on those).</p>
      <p>I'm excited to see what people think of the changes, and of course to get any general comments on the design. I'm also curious to hear if people would ever use this font if it were fully developed, and if so, what size and treatment you think it is best suited for.</p>
      <p>Much appreciated,</p>
      <p>David</p>
