      <p>To tell you the truth, I never actually printed your specimen, so my analysis wasn't exactly done in full justice.</p>
      <p>That two-storey <em>f</em> was a nice idea. I would reduce the space between the f's by a touch, though.</p>
      <p>About the stiffness, my theory is that the strong vertical stroke, when coupled with the Swift-like slabs on <em>a, c, e, f,</em> etc. (this is not your bottom slabs which I like), might have something to do with it. My suggestion is to move your pen angle to the side and tone the slabs down a little bit.</p>
      <p>Beyond that, ask Typophile's many experts :)</p>
      <p>Anyways, below is two hastily done pen-tool tracing of your <em>f</em> to illustrate my points. It's too wide, so I'm afraid you have to scroll right too see it in full-size.</p>
