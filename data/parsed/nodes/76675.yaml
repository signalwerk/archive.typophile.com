    html: |-
      <p>In typography, small differences cause huge effects.</p>
      <p>I second Janek's advice. Optimal placement for acute and grave accents are not an absolute center alignment, as one can find in many fonts. Accents are slight dislocated towards its 'direction', exactly as Janek's sample. Although he talks about Polish, I can assure you the same applies to accents in Portuguese. AFAIK, this criteria also must be considered to other Romance languages – Spanish, French, Italian, Romansh, Provençal, Catalan and Romanian, amongst other less known.</p>
      <p>If you will verify other fonts, please also remember that many were made by designers whose languages have rare or no diacritics at all – especially English, German and Dutch. It's normal to a person who does not uses a language with many diacritics not to identify the better placement for them. Take for example Meta Serif, a font widely regarded as excellent. Its acute and grave accents are very centralized and tilde is very heavy, making it unusable for high quality typography in Portuguese.</p>
      <p>This is why we use Typophile to get help about these questions. There is nothing better than eye from people who use diacritics dialy to criticize its design.</p>
      <p>I suggest you to take a good look at Slimbach's fonts, whose diacritics are usually very good.</p>
      <p>About your design, diacritics themselves are OK except tilde – I find it very round to Expletus style. Vertical gap may be a bit wider for all diacritics.</p>
