      <p>Jasper, I probably was not as clear as I should. Nothing is <em>wrong</em> with your tilde. I just have the opinion that it is very much geometric. It would combine more with Expluts style if you make its curves more open. But this is subjective.</p>
      <p>You can benefit from this <a class="freelinking external" href="http://www.twardoch.com/download/polishhowto/intro.html" rel="nofollow">article</a> by Adam Twardoch about Polish accents. If you plan to support Polish (and also Lithuanian) you need to include ogonek in your font.</p>
