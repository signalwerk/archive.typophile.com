    html: <p> wow here's a thread I missed. kind'a awkward. I guess mine is the "over-designed" one we're referring to eh?  <br> <br>I chose, tweaked and arranged the faces, but what "overly-designed" aspects you may find all lay in the faces themselves - I wouldn't think its in the design. the arrangement is justified center and that's about it. Elements aren't thrown about at all. - I thought it would *read* very clearly to typophiles. I was thinking about the harley-davidson emblem/patch thing. let's ride, band together in our bad-•••, coded, shirts. the way t-shirt design started...for a team, a uniform, worn to identify/show-off what you like, and what community/club you belong to. I specifically did not want it to be simple. I definately don't hold any bauhaus memberships but I understand having a purpose for each element or arrangement of.  <br> <br>I do like the California job case too. Funny - the case itself with all its mysterious arrangement of boxes, we knew was designed so with some purpose and yet left such confusion. My Grandmother still has one filled with knick knacks above the sink. - I always wondered why why why those shapes and sizes. </p>
