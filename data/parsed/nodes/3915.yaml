    html: <p> What does under/over-design mean? I guess to me it means that it looks (although not necessarily *is*) designed too sloppily/obsessively. For example, a lot of people think Barcelona is over-designed (although I personally think it's the best city in the world). BTW, I'm not sure what "grill" you're talking about, but hopefully -for you- it's not the one on my car, 'cause you'd have to catch me first, and if by some freak of nature you did, you'd regret it... Hundreds of Americans agree.  :-) <br> <br>As for your design, the orginal is definitely the best, and although I only really like 18.008 of all the ones we could pick from (I triple-voted for it), 24.002 is the only other one I would actually buy, if only to support Typophile. Tanya's is cool, but it's just too far from my [warped] sense of style. <br> <br>hhp </p>
