    html: <p> Under/Over? This is interesting 'cause a friend and I have been having a three year-long "how do you know when something is actually done" argument.  <br> <br>I've always thought of "under-designed" as being something that has that look of incompletion. Overdesigned is easier; you could subtract and be better off than when you started. Or... it looks as though every single trick has been used in its creation just for the sake of something, showing off, something? </p>
