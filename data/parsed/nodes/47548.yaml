      <p>Two student class projects were:<br>
      Egyptian 505 (students of André Gürtler at the Allgemeine Gewerbeschule, Basel, by 1966)<br>
      Project 306 (students of Ronald Arnholm at the University of Georgia). </p>
      <p>Both were released for display filmsetting by VGC.</p>
      <p>I'd guess there are other designs accepted for production that originated as student projects. How about the 1949 sketches for Univers, according to Friedrich Freidl?</p>
