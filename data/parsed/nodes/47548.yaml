    <p>Dear Typophiles</p>
    <p>Can anyone remember or does anyone know who may have been the first college-level students to design their own typefaces? I ask because the topic came up while I was visiting with a type designer friends this last weekend. I know of an RIT student in the late 60's, but could there be an earlier example of a student type designer? I'd be very interested to find out. Meanwhile, I am transcribing a paper written by aforementioned RIT student describing his process to post on my Typophile blog later.</p>
    <p>Kindest regards</p>
    <p>TeePeeCee</p>
