    html: "<p><i>i don't suppose this is a quick way to set all of my side-bearings to a fixed value? it's going to be nasty to jump back in and readjust all of those by hand :</i> } <br> <br>I agree with Thomas, HOWEVER... There is a way: <br> <br>Select all the characters whose sidebearings you want to be the same value. Choose \"Set Metrics...\" from the Metrics menu. The rest should be self-explanatory. Caution: Save your font before you proceed just in case you don't like the results.</p>"
