  html: "<p>Hello all, <br> <br>I am a font design and construction novice. I am using fontographer 4, which i'm sure is considered far out-of-date by most type-savy people, but please entertain me for just a smidgeon of your time! <br> <br>Please tell me what in the world is going on here: <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/52436.png\" alt=\"figure1\"> <br> <br>many of my characters won't preview in solid shading. i don't know why! <br> <br>letters were drawn in illustrator 8, and copied over. <br> <br>any help is appreciated. thanks!</p>"
  html_clean: "<p>Hello all, <br> <br>I am a font design and construction novice. I am using fontographer 4, which i'm sure is considered far out-of-date by most type-savy people, but please entertain me for just a smidgeon of your time! <br> <br>Please tell me what in the world is going on here: <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/52436.png\" alt=\"figure1\"> <br> <br>many of my characters won't preview in solid shading. i don't know why! <br> <br>letters were drawn in illustrator 8, and copied over. <br> <br>any help is appreciated. thanks!</p>"
