    html: <p>actually, give or take, i <i>do</i> want a fixed width between each character for this particular typeface. sort of like monospacing, but not! <br> <br>i will look into Tracy's book. i am well-familiar with the notorious scarcity of "type by design." i have been looking for something to fill the gap. that is, a book that focuses mainly on the technicalities of font creation (as opposed to design theory). <br> <br>thanks, thomas!</p>
