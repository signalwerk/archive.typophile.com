    html: <p>thanks, mark! <br> <br>i extend my heartfelt gratitude also for the tip on the spacing. this is my first font, so i am absolutely clueless as to how to go about any of this. <br> <br>i don't suppose this is a quick way to set all of my side-bearings to a fixed value? it's going to be nasty to jump back in and readjust all of those by hand :} <br> <br>thanks again.</p>
