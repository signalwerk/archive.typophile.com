    html: "<p>I'll just note that you don't want to have all of your sidebearings to be the same value. The left hand side of the \"a\" in your font should have a sidebearing about 1/2 that of the right hand side (roughly speaking). <br> <br>Walter Tracy's \"Letters of Credit\" has a good section on sidebearings and spacing of letter forms. This is reproduced in Moye's \"Fontographer: Type by Design,\" but that book is long out of print. <br> <br>Regards, <br> <br>T</p>"
    html_clean: "<p>I'll just note that you don't want to have all of your sidebearings to be the same value. The left hand side of the \"a\" in your font should have a sidebearing about 1/2 that of the right hand side (roughly speaking). <br> <br>Walter Tracy's \"Letters of Credit\" has a good section on sidebearings and spacing of letter forms. This is reproduced in Moye's \"Fontographer: Type by Design,\" but that book is long out of print. <br> <br>Regards, <br> <br>T</p>"
