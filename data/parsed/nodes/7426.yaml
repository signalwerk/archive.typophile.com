  - id: 50560
    user: 1043
    date: 2004-11-01T08:12:00
    date_raw: 1 Nov 2004 — 8:12am
    votes: null
    html: <p>Select all the character cells in the main font window. Choose "Selection Info..." from the Element menu. Make sure the Tint is set to 100 (and that Stroke is unchecked). That should fix it. <br> <br>What happens is if your art in Illustrator is not solid black, it comes out shaded when pasted into FOG. Or sometimes it just happens for no apparent reason. Maybe Macromedia will issue an update to fix this annoying problem. ;-)</p>
