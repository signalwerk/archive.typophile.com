      <p>I have a copy of the 1844 revival of Caslon, 'Lady Willoughby's Diary'. It was not only celebrated at the time, and led to the wider revival of Caslon, but also much later shown in exhibitions as an example of superb printing. It has more consistency and less distortion of the letters than in Caslon's own 1766 sample book--no doubt because of superior inks and printing technology of time. Its text is in a beautiful black against the woven matt paper, which incidentally looks not aged at all over 150 years later. </p>
      <p>I am not a printer, but I have printed letter press and was taught about over inking, and I do not agree that a deep black indicates over-inking. I think it is a feature of good, properly inked letter press. But as I say, I want to learn more about the differences on between offset and letter press from knowledgeable printers. </p>
      <p>As of now I find Chris's analysis plausible.</p>
