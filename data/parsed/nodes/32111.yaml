      <p>However in letterpress the degree of black tends to be proportional to the degree of letterform distortion - over-inking is the sad norm (not least because you can always add ink, but you can only reduce ink by starting over). Few printers are willing and able to produce a good black without making the type something the type designer never intended (ergo: worse, in general).</p>
      <p>BTW, it's tempting -and probably intuitive- to think that the blacker the<br>
      better, but I think there's definitely such a thing as too much contrast.</p>
      <p>hhp</p>
