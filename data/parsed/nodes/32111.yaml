      <p>Possibly, although high-quality offset printing still doesn't look as good; plus when you look at physical pieces of type there's paralax distortion. Also, I feel that letterpress (which btw can now be done with plates made from digital files) does have some subtle advantage, and actually I think it might be from the avoidance of extreme crispness! I have an idea of how to replicate that in offset, but it's sort of far-fetched. I also wonder whether at the tail end of photosetting (where presumably the blur had become tamed if not eradicated) this subtle softness was also present (except digital was already making photosetting practically obsolete).</p>
      <p>Another reason metal sorts seem to look better might be that they don't form actual readable words, hence leave our imagination to embelish the abstract; sort of how a person generally looks more attractive from a distance!  :-)</p>
      <p>hhp</p>
