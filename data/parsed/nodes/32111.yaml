    html: |-
      <p>The ink film in letterpress is physically thicker on the paper and impresses more into the paper fibers. Offset has a wash cleansing of extra residue from the plate and a second transfer from plate to blanket which further thins the ink that hits the paper. This allows for finer detail and less need for trapping but the thickness of ink is less. The effect is greater on noncoated paper which is more typical of books than slick mags. Web presses can get overly washed sometimes too so even coated stock impressions can be a bit anemic. As usual, a good pressman is required no matter what method is used.</p>
      <p>ChrisL</p>
    html_clean: |-
