    html: |-
      <p>This looked vaguely familiar to me also. So I, too, did a quick check of my 1923 ATF and didn't find it. Neither was it in my Barnhart Brothers &amp; Spindler, ca. 1925.</p>
      <p>But . . . I did find it in my 1926 Stephenson, Blake &amp; Co. specimen. It's titled <em>Lining Romany</em>. (Many of the SB fonts from this period are hyped as "lining," meaning they are cast on the American Point Line system -- still a fairly new concept over there at that time, I think.) </p>
      <p>It's offered in 60, 36, 30, 24 18, 12, 10, and 8 point.</p>
      <p>I've noticed that there are several SB designs that seem to have come over from the States and acquired new names (for instance, Chippendale = Pencraft), but there are also a few that may have traveled the other direction (Munder Roman = Verona?). So, it's hard to say whether this particular design originated with Stephenson Blake or not, and whether there might be an American equivalent, or even a predecessor.</p>
      <p>-- K.</p>
