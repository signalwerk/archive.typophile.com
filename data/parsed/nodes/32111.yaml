      <p>I don't know that I would characterize it as "my view." I was just making an observation on the differences between the two methods which might corroborate your view. In terms of "blacker", I could not say without some sort of densitometer reading. The effect of blacker on the page is often, as Hrant mentions above, due to overinking and the inkspread that it causes. Too much packing is another culprit. It forces deeper impression and even rounding of type.<br>
      The other issue is that often text faces that started in metal and later were made for photo or digital, didn't adjust for weight difference in inkspread when the transition was made and therefore seem lighter on the page.</p>
      <p>ChrisL</p>
