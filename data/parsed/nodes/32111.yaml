    <p>I saw this font at ArcheType recently, and last night took a photo of it:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Funky_4615.jpg"></div><p></p>
    <p>I really like the "bravado" - to me this is a more charming Cooper Black. I'd like to find out what it's called and who made it (the pinmark was no help: it's just a thin straight vertical line in a circle) but most of all I just wanted to share it. The label on the drawer says "Old Style Grotesque", which is of course completely uniformative and probably incorrect.</p>
    <p>hhp</p>
