      <p>&gt; It has more consistency and less distortion of the letters than<br>
      &gt; in Caslon’s own 1766 sample book—no doubt because of superior<br>
      &gt; inks and printing technology of time.</p>
      <p>I'm curious, what about consistency of letterform? When you say it was a "revival", do you mean just of printing with Caslon, or of the fonts themselves? I ask because Caslon's forms exhibit a lot of inconsistency (which doesn't necessarily bother me within a font, but definitely bothers me across sizes - unless it's something like Neuland, where I feel it's actually a plus).</p>
      <p>&gt; I do not agree that a deep black indicates over-inking.</p>
      <p>I didn't say it was unavoidable or inherent. But when you printed letterpress yourself, did you manage to get that great black while maintaining letterform integrity? Unlikely, and not necessarily because you were -I'm presuming- just dabbling: it's very hard; even qualified people who want to do it (which is sadly rare) have trouble.</p>
      <p>My point wasn't that it's not possible, it was that it's very rare. On average, in practice on the ground, offset tends to arrive at a better balance of blackness and letterform integrity; it's simply a lot harder to mess it up.</p>
      <p>Speaking of which, you must have seen some offset printed with "rich black" (black that's made with some C, M and Y, not just K) on thick coated paper: it's pure lustre. Which is not to say I admire it.</p>
      <p>&gt; ... as long as it seem promising.</p>
      <p>With the elaboration that I guess it depends on whether you're a positivist or a cynic. When the crow gets the grapes instead of you, do you think "damn it", or do you think "they were probably sour anyway"? :-)  You guys should hear all the variants on that Æsop fable that my brother and I once came up with!</p>
      <p>&gt; we expect more technical perfection/performance from offest</p>
      <p>Yes, and I think this extends beyond tangible things like binder; we expect letterpress to be imperfect in some ways, so we ignore that, or even turn it into something commendable.</p>
      <p>hhp</p>
