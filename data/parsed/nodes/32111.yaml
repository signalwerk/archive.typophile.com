      <p>I have a theory about letterpress ink which is that it may have less ( because it needs less) lacquer or other shiny binders. A smooth paper has less 'tooth' and is less spongy. Offset tends to use a smoother paper. A paper like that would shed ink morer easily and need more binder + plus we expect more technical perfection/performance from offest which would make you use more binder maybe. Binders will tend to shine, so the less binder, laquer/glue/whatever; the blacker the ink can look. The more matte the black the darker it can look.  It could also be that the paper used in offset sucks more the binder deeper into the paper leaving a more matte result even when the same ink is used. What do you think? </p>
