    html: |-
      <p>This is nice work and I think you've done the right thing with the e.<br>
      Here are some suggestions, take with a bit of salt:<br>
      £ is out of character. The base needs to be flat in this style of font.<br>
      I think the guillemets should be bevelled like the greaterthan/lessthan symbols.<br>
      I'd make the tops and bottoms of the braces and brackets longer as the proportions of the alphabetics are quite wide.<br>
      Section sign is really interesting!<br>
      Horizontal arm of 4 could be a bit lower to open up the counterspace and balance the figure better.<br>
      I'd make the circles of % a bit darker.<br>
      B looks wide?<br>
      Crossbar of f looks lower than the one on t. I'm quite a fan of low crossbars but I think they should be the same height.<br>
      X and x may benefit from some offset.<br>
      y may need more counterspace above its tail; can you move the junction up? This style is quite hard to draw in my experience and might take a few tries to work nicely.</p>
      <p>If you post a pdf we can take a closer look. Good work :)</p>
