      <p>Well, I finally managed to make time to post some updates to the design. I took all your observations under consideration and I also managed to add a Cyrillic and Greek set of characters. They are based on two codepages, but I'm considering adding more characters to cover the Unicode ranges for these two alphabets. Also, I made a poster for a friend's band (the one that inspired the design of Elektro) using a somewhat older version of the typeface:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stop_the_flood_5046.png"></div><p></p>
      <p>A small detail, where another type experiment of mine can be seen used alongside Elektro:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stop_the_flood_detail_6686.png"></div><p></p>
      <p>I updated the PDF in the first post with the new version. Let me know what you think, as always, feedback is greatly appreciated! Thanks!</p>
