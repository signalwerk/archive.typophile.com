    <p>Hello everybody,<br>
    I'm submitting to your critique a display font called Elektro. It began as custom lettering job I did for a friend's band logo. It's inspired by their prog rock music style with a touch of modernist aesthetic. I'm currently working on alternate weights, as well as a matching italic and a slab serif. Any advice on how to improve it is greatly appreciated.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/elektro_01_3474.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/elektro_02_3601.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/elektro_03_5435.png"></div><p></p>
