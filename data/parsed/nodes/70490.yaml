    html: |-
      <p>Looking good.<br>
      I would consider bringing in the foot of lowercase el a bit - it opens up spaces within the words.<br>
      I find the /st/ ligature a bit distracting.<br>
      On /W/, does the last stroke lean out too far? Looks thick in the middle, too. /w/'s last stroke also leans out to my eyes. Is your intention to have even stroke weights on /w/? It looks to me a bit like (l to r) thick thin thin thick, when convention would have it thick thin thick thin (or even thickness).<br>
      I'd consider thin crossbars on yen and Euro, like $ has.<br>
      Would you consider a version with longer extenders? They look pretty stubby here.</p>
      <p>That rounded face is appealing, too!</p>
