    html: |-
      <p>Yes, those all look like definite improvements to me, but the important thing is whether you're happy with them?</p>
      <p>A few more suggestions:<br>
      Ampersand looks kind of dark. Maybe you can trim some weight off somewhere (shorter hood?) I'm not sure if the design isn't too funky?<br>
      I'd make the outside of parentheses curved not straight.<br>
      1: larger flag?<br>
      2: the horizontal middle seems ungainly to me, can it slope slightly?<br>
      4: widen the whole shape or just the counter slightly?<br>
      W: feet should be wider apart<br>
      £: I'd switch the top and bottom terminals so the hood curls over and the foot is flat. The crossbar should be lower — think of an E rather than an f.<br>
      Centre of currency sign looks too round for this font.<br>
      Dieresis on y is off-centre.<br>
      n_acute needs diacritic a bit further right. Check s_acute too.</p>
      <p>I'm enjoying this one.</p>
