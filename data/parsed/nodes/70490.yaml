    html: |-
      <p>Thanks for the remarks guys, keep'em coming! They're greatly appreciated.</p>
      <p>@Bendy: Of course I'm happy with the those changes. Your remarks were spot on!<br>
      @Cerulean: I live and work in Poland as a designer (though I'm not Polish) and I'm very familiar with the ogonek. Generally the one on 'e' is not positioned flush right, it's supposed to flow down from the tail. Of course, there can be quite different stylistic approaches to it.</p>
      <p>I'll post some new stuff soon to reflect your suggestions as well as new glyphs for the Cyrillic and Greek alphabet. By the way, I designed this face for a rock band, so I was thinking that this can be used for music related design. But do you see other potential uses for it?</p>
      <p>And once again, thank you very much!</p>
