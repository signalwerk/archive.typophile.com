  html: |-
    <p>All,</p>
    <p>The logo-design spec calls for geometrically round \o\, \a\, \e\, and \d\, and a calligraphic \W\ that expresses reserved, *elegant* beauty in a personable, approachable way. I wondered if there wasn't a way to fuse them; to decorate the tops of the ascenders in such a way as to draw them together with the calligraphy of the \W\.</p>
    <p>I have a first draft, but it is apparent that I need more experience, and attention to far more of the details. And so I submit my very humble work to the crucible here, and solicit your advice on how to proceed!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/woodendale3_6249.jpg"></div><p></p>
