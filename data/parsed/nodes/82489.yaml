      <p>Some random sggestion:<br>
      - try with a even more calligraphic contrasted W.<br>
      - as you noted, thicks and thins should match among all letters.<br>
      - also, the swashes should be of the same kind.<br>
      - for elegance and balance, you could also experiment with non-swashed but very tall d's ascenders.<br>
      - finally, you could print out just the needed circles and experiment sketching different variations for W, ascenders, and maybe even n.</p>
