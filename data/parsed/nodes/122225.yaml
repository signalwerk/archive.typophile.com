    <p>Joe Coniglio, from Coniglio Type listed at MyFonts...<br>
    - - - -<br>
    FontLab Studio 5 Mac —Can't find trace tool, please help<br>
    Hello I am importing some character scans and I haven't been able to find the trace tool.<br>
    The 900+page manual shows the opened trace window on page 109 ONLY and doesn't say how to get the window open via a tool bar or command: I could be mistaken but I thought FontLab Studio had a trace feature in Studio 5. My program has no plug ins or separate modules that I know of. It just doesn't seem to be there. THANKS!!</p>
    <p>I spent a few hours looking for it.<br>
    I will take anything:</p>
    <p>1) A key command to get me to the trace setting box<br>
    2) A pull down tool (0r)<br>
    3) A trace icon tool I can click.</p>
    <p>I found nothing and want to build a font off traces of a very nice hand sketched letter set.<br>
    I could revert to my Fontographer, but want to make an OpenType format.</p>
    <p>Folks thanks for any help.<br>
    email me at<br>
    Joe<br>
    <a href="mailto:roubideau@gmail.com">roubideau@gmail.com</a></p>
