    html: <p>Paul, <br>I too have been baffled by this error. As near as I can surmise, it means there is a stray point around that used to join the line which shows the error.  For me, it is usually a point hidden behind another one.  I don't know what the term "move is empty" means.  Maybe Adam Twardoch will answer for us? <br> <br>ChrisL</p>
