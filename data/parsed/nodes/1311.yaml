    html: <p>I have spent way too much time toodling through various listings on MyFonts.com in a vain attempt to determine what style of font this is. It's not keyworded or categorized as <i>linear</i>, <i>monoline</i>, <i>script</i>, <i>swash</i>, <i>loopy</i>, <i>decorative</i>, <i>alternate</i>, <i>curly</i>, or <i>fancy</i>... <br> <br>I think I've covered all of the most obvious characteristics of this sample. Perhaps I'm missing something completely, or else the face is simply keyworded incorrectly. <br> <br>Aaagh! <br> <br>Chesh, you're such a tease. <img src="https://web.archive.org/web/20080907085233im_/http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
