    html: <p>The 'Latinisation' of Futhark mainly involved extension and re-ordering of the sign set to match the set of Latin graphemes, so one could write Futhark as a one-to-one transliteration of contemporary spelling. An interesting aspect of this is the addition of dots to create new consonants. All in all, this 'Latinised' Futhark doesn't <i>look</i> very Latin. One could argue that the changes to Futhark kept it alive as part of the culture for 600+ years after it ceased to be used to regularly write a living language.</p>
