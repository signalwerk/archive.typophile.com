    html: "<p>Rene, the type of artwork most commonly associated with Scandinavian culture -- at least in the U.S. -- is <a href=\"http://www.rosemaling.com/\">rosemaling</a>. These are brightly colored floral patterns, typically hand-painted by amateurs onto wood (furniture mostly). <br> <br>Stephen's example, while not rosemaling, is definitely a good one as well and might be a better source of dingbat inspiration. Good luck! <br> <br>By the way, I really like your font. <br> <br>Stephen: did you buy a new pair of boxers in Sweden or something? :-)</p>"
    html_clean: "<p>Rene, the type of artwork most commonly associated with Scandinavian culture -- at least in the U.S. -- is <a href=\"http://www.rosemaling.com/\" class=\"link-external\">rosemaling</a>. These are brightly colored floral patterns, typically hand-painted by amateurs onto wood (furniture mostly). <br> <br>Stephen's example, while not rosemaling, is definitely a good one as well and might be a better source of dingbat inspiration. Good luck! <br> <br>By the way, I really like your font. <br> <br>Stephen: did you buy a new pair of boxers in Sweden or something? :-)</p>"
