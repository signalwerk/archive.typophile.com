    html: '<p>Danish stuff: <br>a classic: <a href="http://www.royalcopenhagen.com/copenhagen/webapp/news?show=604#" target="_blank">http://www.royalcopenhagen.com/copenhagen/webapp/news?show=604#</a> <br>You can lift elements of of this I think.  <br> <br>Maybe the ornaments ought to be furniture or pinetrees or Aurora Borealis-inspired stuff, (the patterns on) Swedish Dalar-horses (ask Stewf, he must have had encounters with them by now. Or any of the Swedes.) Norwegian sweaters could have usable elements too. hmmm, what else is there? Something woody?  <br> <br>Spirals. (think viking ornaments here, not that that really defines Scandinavia today.) By the way, Ase-tro (Thor, Odin, Freya and the lot.) has just been accepted as an official religion in Denmark. <br> <br>Actually, a Dalar Horse itself would be a great ornament for your typeface.</p>'
