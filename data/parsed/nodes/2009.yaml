    html: "<p>I scribbled down the latinized runes in my sketchbook at Nationalmuseet, I didn't draw the runes that these evolved from as I was mainly interested in 'the end of runes'. But I'm sure they will help you if you contact them. <a href=\"http://www.nationalmuseet.dk/sw73.asp\" target=\"_blank\">http://www.nationalmuseet.dk/sw73.asp</a> <br>If you use the form 'Navn' means 'Name' and 'Emne' is 'Subject.' <br>Or you could simply email them: <a href=\"mailto:fogf@natmus.dk\">fogf@natmus.dk</a> <br> <br>It might interest you that after Runes the Danes used romans as uppercase only, fraktur was used for both upper- and lowercase. <br>During a short period they may have had all three alphabets. <br>Boy are we off topic... <br> <br>And since we are off topic: go find a Finnish cemetery, they rake nice patterns in the gravel on the graves. (the one I visited was in Tornio, customs may be different further south.) <br></p>"
