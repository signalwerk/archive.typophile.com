    html: "<p>Hi Gerald,  <br> <br>Thanx for your input. I've also asked my ex, she's Finnish, and also said the Norwegan flower ornaments would be to much. They don't mean anything to her, she said. She herself suggested something from the Vikings. That was my first thought also, but I realised too that it could be too prototype. She also suggested using the ear-marking of the raindeer, but that's a little too abstract for me: <br><a href=\"http://tuikku.urova.fi/avoin/poronhoito/merkitys.htm\" target=\"_blank\">http://tuikku.urova.fi/avoin/poronhoito/merkitys.htm</a> <br>That's an alfabet for it self, but not enough decorative. <br> <br>Personally I liked the birds under the trees on your site. Something like that would be great. If you have more suggestions, I have time. <br> <br>I've been in Finland once and it was great. My ex's parents live in Rovaniemi, very close to the north pole as I could feel. Perhaps I visit Finland again. I liked it a lot. I'll also visit the 'Santa Pukki' again (is that spelled correctly?). <br>Who did invent the sauna by the way? ;-) <br> <br>Love your way of working with ornaments, by the way.  <br> <br>Regards, <br>Ren</p>"
