    html: <p>That's interesting that rosemaling isn't really "authentic" Scandinavian art anymore. <br> <br>Most of the Scandinavian immigrants came to my state of Minnesota in the late 19th and very early 20th Centuries, and they brought it with. It was a very "Swedish grandma" thing to do. But if you were to ask a typical Minnesota Scandahoovian, they'd swear up and down it was the real deal. Well, I guess Europe has left us behind again. Damn it!</p>
