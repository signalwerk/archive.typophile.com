  html: "<p>Hi, <br> <br>I'm currently finishing up my next typeface but am still looking for a nice Scandinavian ornament.  <br>Some types have the French Lily or any other ornament as a decorative element. I'm looking for something that fits to this type: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/20181.gif\" alt=\"Nordic\"> <br> <br>Any suggestions? I've thought about the Vikings but can't find anything. <br> <br>Thanx, <br>Ren</p>"
