    html: "<p>Wow John, that's a cool idea. I found already some info on the Futhark, but couldn't seem to figure out how it works. Perhaps it's worth the trouble to find it out. Perhaps I can make a cool expert type with it. <br> <br>I found some ornaments that I like from the Vikings. I'm strongly thinking about using the spirals or snake-kind-of ornaments. I'm only not sure if I can really make them to work like a pattern. I would like that they outgrow the only-ornament state, they should also be able to work as a complete background pattern. Any suggestions Gerald? <br> <br>These images jumped to my attention: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/20288.gif\" alt=\"snakes\"> <br><img src=\"http://www.typophile.com/forums/messages/30/20289.gif\" alt=\"Dragon\"> <br><img src=\"http://www.typophile.com/forums/messages/30/20290.gif\" alt=\"Coins\"> <br><img src=\"http://www.typophile.com/forums/messages/30/20291.gif\" alt=\"Boat\"> <br><img src=\"http://www.typophile.com/forums/messages/30/20292.gif\" alt=\"Golden ring\"> <br> <br>Ren</p>"
