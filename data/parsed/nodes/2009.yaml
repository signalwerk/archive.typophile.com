    date_raw: 11 Nov 2003 — 7:12am
    votes: null
    html: "<p>Dan, <br> <br>That certainly is interesting. I wonder if there are any copies to be had. Thank you for the tip. As you know I am writing a book about ornaments, typographical and otherwise. My present focus, at the moment, is on traditional source readily available to me in Scandinavia. <br> <br>My working title is \"Ornament and Function.\" This is based on some of my original thoughts. <a href=\"http://www.lanstontype.com/FishBasket.html\" target=\"_blank\">http://www.lanstontype.com/FishBasket.html</a> <br> <br> <br>The reason I asked about knitting: Knitting clearly illustrates my point about the subtle aspects of ornament. Also illustrates ornament as function, and the structure of mans' day to day activities. See second link. <br> <br><a href=\"http://www.lanstontype.com/SpiderWeb.html\" target=\"_blank\">http://www.lanstontype.com/SpiderWeb.html</a> <br> <br>Ornament is not necessarily just \"icing on a cake.\" Pretty little things tied on like a woman's bonnet, or masking an otherwise ugly face with lipstick. <i>Mind you, that has useful function too.</i> <br> <br>That ornaments have strong purpose, that they have served man and nature profoundly well. They do not deserved to become orphaned ancestors. They are building blocks of society, building blocks of nature. <br> <br>That is why I am so delighted Ren</p>"
    html_clean: "<p>Dan, <br> <br>That certainly is interesting. I wonder if there are any copies to be had. Thank you for the tip. As you know I am writing a book about ornaments, typographical and otherwise. My present focus, at the moment, is on traditional source readily available to me in Scandinavia. <br> <br>My working title is \"Ornament and Function.\" This is based on some of my original thoughts. <a href=\"http://www.lanstontype.com/FishBasket.html\" target=\"_blank\" class=\"link-external\">http://www.lanstontype.com/FishBasket.html</a> <br> <br> <br>The reason I asked about knitting: Knitting clearly illustrates my point about the subtle aspects of ornament. Also illustrates ornament as function, and the structure of mans' day to day activities. See second link. <br> <br><a href=\"http://www.lanstontype.com/SpiderWeb.html\" target=\"_blank\" class=\"link-external\">http://www.lanstontype.com/SpiderWeb.html</a> <br> <br>Ornament is not necessarily just \"icing on a cake.\" Pretty little things tied on like a woman's bonnet, or masking an otherwise ugly face with lipstick. <i>Mind you, that has useful function too.</i> <br> <br>That ornaments have strong purpose, that they have served man and nature profoundly well. They do not deserved to become orphaned ancestors. They are building blocks of society, building blocks of nature. <br> <br>That is why I am so delighted Ren</p>"
