    votes: null
    html: <p>John, <br> <br>It is the real deal. Nordic people are sea people, they get around. Still do. Ornaments are just a broad topic. I wish I had my hands on historical showings of "Arabia" china products. A distinquished Finnish pottery. Their museum is quite the place. If you get to Finland don't miss it. <br> <br>It would take you through time zones. Quite the material. Unfortunately they closed down their hand painting department since I moved here. Things are moving the way of Nokia.</p>
