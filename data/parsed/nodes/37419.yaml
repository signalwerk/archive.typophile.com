      <p>I think 2 and 3 have the most potential to develop although both need tweaking and tidying up, as Satya recommends start simply with black and white, the graduation which includes both colours probably won’t work too well out of four colour where the brown meets the green will reproduce as a muddy shade. The name works against a ‘cool’ type treatment, but the type for 2 is not doing it at all for me the x-height and baseline are bouncing around too much and is much too tightly kerned.</p>
      <p>Tim</p>
