    <p>Hi everyone, how are you doing.  ive been going in circles for the past week.  i have been up reading articles and doing tutorials.  im always on here reading articles and different stuff but i freelance for different ppl here and there.  but i so get confused when its a family member.  my husband now is in the flooring business so he wants a cool logo and nice type. he is gonna sell ceramic, wood, carpet and tile.  so he didnt want the carpet roll basic theme.  i dont know if i get nervous or what, but literally i did about 10 logos and i still think they look like crap.  so the name is called flooring 4 you. i wanted to intertwine the letters but that didnt go to well either.  i can not find the perfect type and i cant link the words togather,  he chose the colors teracotta and green.  and im just trying to figure out where to go from here.  can you please critique me and give me some guidelines to let me go on my way so i can achieve what i need.  lol i dont know im just so lost. Ruia</p>
