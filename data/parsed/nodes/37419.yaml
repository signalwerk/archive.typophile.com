      <p>You might also want to rethink if a symbol is really needed. </p>
      <p>Flooring For You (and perhaps not Flooring4U) is quite expressive as a name. Possibly all you need to do is set it in some really nice serif typeface. If you think that’s too plain maybe you could introduce a sort of underline as a visual pun for flooring. </p>
      <p>This underline could be rendered in different patterns and textures drawn from various flooring material. So the logo would be slightly different from one application to another. Could be fun!</p>
      <p>Of the existing options, 3 does seem to be the one with most potential. It may be an idea not to have the name within the diamond form. It might be quite hard to read in smaller sizes. And by the way why not make an ’F’ out of the three words?</p>
      <p>As Tim correctly puts it, the only way is to keep working at it. And again as he says, get another person’s perspective every once in a while.</p>
      <p>Good luck!</p>
