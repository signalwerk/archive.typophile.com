      <p>Keep it very very simple and dont use these gradients.<br>
      Work in black and white if possibble and then add the color in the last.<br>
      Logo is like an unique word. It should be very simple so that people can remember.</p>
      <p>You should also have a look at the logos of few existing companies who do same kind of business.</p>
      <p>all the best.</p>
