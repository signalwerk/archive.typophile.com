      <p>Charles, </p>
      <p>it is really difficult to offer any kind of constructive criticism without knowing some background behind the 3 logos.</p>
      <p>Lacking this, one can really only comment on the technical aspects.</p>
      <p>Having said that, all three logos seem to lack refinement in the curves. The top one needs work on the leg of the 'R', the symbol of the middle looks unbalanced and falls over to the left. Finally, the bottom 'R' looks clumsily extended without paying any attention to the stroke width.</p>
      <p>Hope this is helpful.</p>
