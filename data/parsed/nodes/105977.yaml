      <p><em>The optimization for small size use, lowering contrast of strokes, uncrowding single stroke glyphs and all the usual small size tricks, gobble up pixels at all ppm.</em></p>
      <p>Yes, optimisation <em>for small size use</em>, not optimisation for a <em>particular</em> ppem size. It's a classic evolutionary adaptation scenario: deliberate selection for one trait -- specific ppem optimisation that happens to be small --, inherently involves selection for a range of traits (lowering contrast of strokes, uncrowding single stroke glyphs and all the usual small size tricks) that are not ppem specific and have an affect at all ppems. This is what I meant when I said that what makes Verdana work at a whole bunch of sizes is <em>tangential</em> to its optimisation for a particular ppem size: that range of inherent traits can be arrived at other than by selecting for a particular ppem size (which is, in effect, what Matthew did when he revised the design for Meiryo, taking Verdana off the specific ppem grid but retaining lowered stroke contrast, open spacing, etc.).</p>
