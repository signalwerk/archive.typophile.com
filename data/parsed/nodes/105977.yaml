      <p>The site performance went down the tubes and I lost track of wanting to waste time, but, ONE problem in making fonts that work optically mastered as your client's clients desire is documented here: <a href="http://en.wikipedia.org/wiki/Dots_per_inch" title="http://en.wikipedia.org/wiki/Dots_per_inch">http://en.wikipedia.org/wiki/Dots_per_inch</a>,<br>
      in the&nbsp;Computer monitor DPI standards section, look for the word "hack".</p>
