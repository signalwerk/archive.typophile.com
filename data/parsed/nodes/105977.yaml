      <p>"No. As explained, we started with two interpolated instances within that range, targeting text and heading sizes"</p>
      <p>No, as explained, it was a smooth variation with two interpolated instances that too were smooth. So what was NOT smooth?</p>
      <p>"I'm not sure I understand this statement, "Size table values would be a better solution than amputation of the screen range."</p>
      <p>I guess not. When one scales a font down on the body to please people (who've never held a 6 pt master in their hands, so of course it's metrics are out of the box), you raise the size mastering, eliminating the smallest end of the original master. </p>
      <p>Then, you try to introduce this into an environment with the dpi hack and size master hacks referred to above and still, I simply can't wait ;)</p>
