      <p>It could be tangential, depending on the design. However, since most Latin type for text has a very clear beat, i.e. strongly suggested design units, independent of ppm, and these are at the core of any small size of such type, and, design to no grid has consequences in family planning under size or resolution pressure, and I was doing both, the choice was, and still is quite clear. </p>
      <p>And since the beat was there before type, the grid was too. So, for Latin text I'm not sure how evolutionarily adaptive I'm being. Since I once could hint extra pixels into the smaller results size independently, by controlling minimum distances and rounding tendencies, and I now must draw those tendencies into the font, it actually feels devolutionarily maladaptive... But whatever works, we can screwed it all together as well as the next drill.</p>
