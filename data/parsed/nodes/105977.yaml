    html: |-
      <p><em>So what was NOT smooth?</em></p>
      <p>Again, what was not smooth was the transition from where we stopped using one instance and started using another. The character of the design changed too much from instance A at size X to instance B at size X+1. As I recall, one such a point occurred somewhere in the mid 20s pt range; we needed something between the initial 'subhead' instance and the 36pt master, because the change in design between those two was too abrupt. If that's not clear, ask Matthew.</p>
      <p><em>...eliminating the smallest end of the original master. </em></p>
      <p>As you note, it works well down to 4.5pt, so I'm really not too concerned about eliminating the smallest end of the original master, which was <em>nominally</em> 6pt but actually significantly larger than most 6pt designs.</p>
      <p>As regards hacks, I'd love to have a reliable way to target specific pixel per em sizes in the wild -- independent of screen resolution and nominal type size --, rather than point sizes, which is all the new MS mechanism currently allows. [The latter, by the way, I fully expect to see properly documented and added to the OTF/OFF specs; it's already implemented in one third party font tool. The only reason I'm being coy about it is that I'm presuming someone else wants to make an official announcement.]</p>
      <p>On the subject of pixels and size-specific designs, I am wondering if you can explain how the RE fonts behave in this regard? From what I have understood of your explanations, and from the description in Sofie Beier's book, you are designing on a 512 UPM grid sub-divided into a grid corresponding to a particular ppem size (16 ppem according to Beier; is this standard for all the RE fonts?). That ensures fabulous results at the corresponding ppem size but, given the diversity of screen resolutions now in play, that ppem size is going to correspond to wide array of nominal type sizes. So when, on webtype.com, RE fonts are recommended for use at 'Small 9px-14px' sizes, that still implies a whole bunch of different ppem sizes at various resolutions, and only at some specific combination of nominal px size and resolution will you hit the ppem grid around which the RE outline is optimised. Right?</p>
