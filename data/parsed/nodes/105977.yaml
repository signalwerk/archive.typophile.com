      <p>The industrial problem/opportunity with hinting for optical size, above what I'll get to in a second, is that we all saw the 'Godzilla's here' panic, screaming and running around when hinting was required for Windows web fonts. So, I hope what they had in mind was automatic variations-to-hints vacuforming of some kind, that no one would have to check. </p>
      <p>Storing variations as deltas with interpolation of the untouched points, is basically what GX did, while also offering all the possibilities for weights, widths, etc. as well as solving tricky parts of  mostly non-Latin typography where glyph features vary in twining ($), and glyphs intertwine via tables beyond the glyph table (place worst graphemaniacal nightmare here).</p>
      <p>We can get from a relatively tiny variation-bearing source to a subset font about the same size as the source for the new MS standard. But each time we add a true optical size, (weight, width or graphemaniacal option), we add the file size of another font to the family. For simple Latin designs, this is not a big deal, but what about a technology enough people would seriously consider globally?</p>
      <p>I think some new kinds of hints, as you suggest MS suggested, would only be the beginning of getting this to work on Windows. I know, the numbers in Windows menus do not represent points. That's just the start of font sizing issues on Windows, and font sizing is just the beginning of typography, and, it's 2014 now.</p>
