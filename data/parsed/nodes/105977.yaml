    html: |-
      <p>David: <em>John, you started with a smooth progression of 300 .1 pt sizes from 6-36 available via simple interpolation.</em></p>
      <p>No. As explained, we started with two interpolated instances within that range, targeting text and heading sizes, looking at integer point sizes for most sizes, but .1 pt increments in the regions where we anticipated the change from one instance to another. The jumps that needed to be smoothed out occurred between the text instance and the heading instance, and between the heading instance and the 36pt (banner) master. Hence, the final set of size instances added subheading and display.</p>
      <p><em>A size table might be better than a link to typophile.</em></p>
      <p>The size selection data <em>is in the fonts</em>. It's not a separate size table, but new data fields in an existing table. As I wrote, I don't know how much I am allowed to say yet, since the spec has not been made public, and the layout API has not been implemented. I provided the size range data here, so that users wanting to test the fonts in the Win 8.1 preview could check them out at the intended sizes.</p>
      <p><em>Can you share the OS/2 weight values? (counting to 12, I left my fingers and the possible values behind).</em></p>
      <p>From a OS/2 WeightClass value perspective, the family consists of only two weights: regular (400) and bold (700). The Small, Text, Subheading etc. instances are <em>size</em>-specific variants within those two weight classes. Remember, the OS/2 WeightClass value records weight <em>class</em> not absolute weight, and from a GDI family perspective there are six separate families, each with its own Regular and Bold weight class inclusions.</p>
