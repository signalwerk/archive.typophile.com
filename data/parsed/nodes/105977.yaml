      <p>The fonts are built with that intention, but the layout support has not been implemented yet. The fallback support requires manual selection: depending on the environment, users will either see six separate families in font menus, one for each size, or a single 'Sitka' family with 24 members.</p>
      <p>In case anyone is working with the fonts in Windows 8.1 preview, and wants to make size selections based on the same point size ranges as implemented in the fonts, here they are:</p>
      <p>Sitka Small &gt;0 &lt;9.7<br>
      Sitka Text ≥9.7 &lt;13.5<br>
      Sitka Subheading ≥13.5 &lt;18.5<br>
      Sitka Heading ≥18.5 &lt;23.5<br>
      Sitka Display ≥23.5 &lt;27.5<br>
      Sitka Banner ≥27.5 &lt;∞</p>
      <p>I don't know what I am allowed to say at this time regarding the size selection mechanism in the fonts -- the first to be built in this way --, but presume I can at least confirm that it does <em>not</em> involve the old, dead-on-arrival OTL 'size' feature.<br>
      _____</p>
      <p>Folks might be interested in the development of the size-specific design instances and the determination of the ranges to which they apply. For one of the meetings with Matthew and the Advanced Reading Technologies team at MS, we prepared an initial pair of two intermediate interpolated instances between Matthew's 6pt and 36 pt designs, and produced print tests of a full range of integer point sizes, one per sheet, with overlaps in the ranges assigned to each instance. These were laid out in sequence around the large conference room, and reviewed by Matthew and the rest of the team. We identified two places in the sequence where there were apparent 'jumps', i.e. where the transition from one instance to the next broke the smooth progression of optical size increase. From this, we determined that two more intermediate instances would be needed, bringing the total number of size-specific designs to six.</p>
      <p>When the additional intermediate instances were produced, we reviewed print tests again, and this time looked at fractional point sizes in the transition areas to determine more precisely the size at which the smoothest progression could be made from one instance to the next. That gave us our initial size ranges and instances, and from there we proceeded to hinting, kerning, etc.</p>
      <p>And then something interesting happened. Initial testing of the fonts at Microsoft indicated concerns about the apparent size of the Sitka type relative to other fonts. Matthew had cast Sitka large on the body, to give it a legibility advantage over nominally same-size type. Now this looked like it might provoke complaints that Sitka was out-of-scale to other fonts, and would make it less easy to work with in typical layouts and templates that didn't take into account its larger optical size. So the decision was made to reduce the size of the type overall, despite the fact that hinting was already underway and the outlines were locked. This was done by increasing the UPM setting in the fonts, so that the scaling factor relative to nominal point size would be reduced. We tested a few different UPM settings, and settled on 2250 units-per-em. This worked well for most of the sizes, and achieved the desired goal, bringing the optical size of Sitka more in line with typical fonts. But it made the Small size fonts too little at their target sizes, affecting legibility. So we decided to differentially scale the Small fonts, using a UPM of 2200. This is why, if you look at the second page of my PDF, you will note a larger jump in height between the Text and Small fonts than between the others.</p>
      <p>We then tested size range selection again, using the new scaling, and arrived at the final range settings documented above.</p>
