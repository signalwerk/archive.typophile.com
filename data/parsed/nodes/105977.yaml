      <p><em>Making masters for all or any "point size" is not the problem.</em></p>
      <p>Just to be clear: what the last few posts have been about is using TT instructions (hints) applied to a <em>single</em> master to manipulate the outlines to affect the appropriate size-specific design <em>independent of resolution.</em> So this is not only different from making masters for arbitrary sizes, but also different from typical use of TT instructions, which are usually device (resolution) specific, i.e. applied to rasterised ppem sizes rather than to nominal point sizes, which would be the case here. Ideally, it would be possible in such a model to have resolution-specific hints applied on top hints that affect the size-specific design. So even if the necessary query for nominal size were reliably supported, making the hinting to do the work would be no doozy.</p>
