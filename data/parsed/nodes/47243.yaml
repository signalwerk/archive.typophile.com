    html: |-
      <p>The Info Panel seems to have the information. </p>
      <p>Here's what the Help Viewer says:</p>
      <p>Determine word and character counts</p>
      <p>Place the insertion point in a text frame to view counts for the entire thread of frames (the story), or select text to view counts only for the selected text.<br>
      Choose Window &gt; Info to display the Info panel.<br>
      The Info panel displays the number of characters, words, lines, and paragraphs in a text frame. The position of the insertion point within the text frame also appears.</p>
      <p>Thanks for asking, never knew about it!</p>
