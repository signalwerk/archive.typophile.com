    <p>HI there people from typophile.</p>
    <p>Many years ago i started a font called "Serene Sans" and i've posted here for appreciation. But i never finished.<br>
    So here i'am again with a new version called "Purpura sans" and i would like to hear what do you think.</p>
    <p>My best regards to u all</p>
    <p>Luis Gomes</p>
