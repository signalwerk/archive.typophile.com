      <p>The Long Tail has been working for Myfonts since 1999, and has made possible the proliferation of independent foundries.<br>
      There's always someone somewhere finding a use for some font. If you produce enough of them, and have enough distribution, you don't need to rely on big sellers (although I always dream my next type will go viral...).</p>
      <p>Script fonts: the public's appetite seems unbounded.</p>
      <p>Tiff: yes, I would make the subtle variants a contextual alternate because as James M notes, very few users know enough about OpenType to move beyond the default and turn on a stylistic set, and what's the point of putting a "raison d'être" feature in a type that (one hopes) will become massively successful, if it's not going to be used?</p>
