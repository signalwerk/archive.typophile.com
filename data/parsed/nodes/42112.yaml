      <p>In the immediate future I think we’re going to see more exploration of expressive/postmodern typography, but this time driven more by enhancing communication and less by the technological experimentation that was so prevalent the last time around. </p>
      <p>In type design, large, versatile families and superfamilies will become more popular as multinational entities flex their identity muscles on a global scale. There’s going to be a greater demand for fonts with five weights, three widths, and supports for every possible Latin language, Cyrillic, Chinese, and probably Arabic. On a somewhat related note, the “great designers” of the future will no longer be the high-minded hotshots in New York and Basel, they’ll Dubai-based geniuses who can effectively communicate across cultures. </p>
      <p>The comfortable threads of nostalgia and historicism that are running through American design will cool off and popular type designs will be more detached from the past, but I’m not sure how long it will be before consumers have a hopeful outlook on the future and designers will tire of appropriation. </p>
      <p>At some point in the more-distant future there will be another revolution in reproduction technology when information can be blasted right into our brains, but I doubt that any of us is going to produce an accurate prediction about what that will do to type.</p>
