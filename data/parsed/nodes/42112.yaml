    <p>Hello typophiles!</p>
    <p>I was at first a little hesitant about asking about this in the fear of perhaps not being relevant enough. I've decided, however, that I'll at least give it a try anyway.</p>
    <p>Alrighty, my situation. I'm currently writing an assignment paper about typography: Its history throughout the centuries, notable persons, font faces, Movable Type, ligatures, and so on. So far I've come through it with all my limbs intact, although my sleeping routine might've been affected a little--it's been a good ride, though!</p>
    <p>The paper. The place where I live isn't exactly known for typographic literacy, so I kind of look at my paper as an exclamation mark... a statement, of sorts. The problem is that the exclamation mark is missing its dot, it feels not quite finished yet. So I thought I'd pose the question:</p>
    <p>How does the future of typography look?</p>
    <p>It's been rather easy to research the past, information being relatively easy to obtain and all, and the current is a piece of cake, but I find it's hard to imagine how it's going to develop. I've covered in my paper how typography currenty works on the internet and on various devices, which, to me, seems quite futuristic already (although it has numerous limitations).</p>
    <p>When I think of the future, holographic displays and such comes to mind, but it doesn't say so much about typography. I can imagine that Sans-Serif fonts probably will become way more popular (in some areas in Europe it's become normal to use them in print, for example), but I also see fonts perhaps becoming more sofisticated or more/less imaginative, but in what fashion I cannot seem to get my head around.</p>
    <p>So, if I could get a few moments from your time, I'd really appreciate it if you scribbled down what you think about the future of typography. Thanks!</p>
