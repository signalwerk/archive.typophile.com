      <p>@severri <cite>Highly competitive market = Innovation (?)</cite></p>
      <p>The relationship between competition and innovation is universal. But in the context of this discussion, I believe that global communication is going to force designers—and thus typographers—to push themselves to understand and engage multiple cultures simultaneously. That’s probably not something any one designer can pull off, but I expect that we’ll see a lot of interesting collaboration, especially when it comes to ensuring that global marketing campaigns don’t keep getting botched by non-natives bad attempts at setting a “foreign” language.</p>
      <p>And on a wacky tangent, what the hell is the word foreign really going to mean fifty years from now?</p>
