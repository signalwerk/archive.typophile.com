      <p>From all I've seen and learned, typography is the collision of three forces: technology of type production, medium of use, and humanity's creativity and self-expression pushing up through the fertile but firm earth of those two constraints. </p>
      <p>To guess about the future of typography is to guess about the future of human expression and communication. To speak about the future of <em>type</em> is a different but no less expansive thing.</p>
      <p>To make a guess, I suggest looking at where communication is headed and then look at the overall trending of style as it relates to the prevailing cultural mindsets. For example: modernist, baroque, fascist, industrial, and commercial ideologies. How did their ideas manifest in typography? The contrast of page design in a scribal pre-literate community vs an industrial community vs the individualist communities of the web. Just be mindful to not get too high-minded. How much fine typography does the average person see vs how much cheap vinyl signage and cruddy Blackberry interface?</p>
      <p>A very interesting question to tackle. I hope this helps.</p>
