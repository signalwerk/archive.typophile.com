      <p>Firstly, I see the long tail showing up in typography, as in everywhere else. This means more interesting and varied forms. I wouldn't be surprised if horizontal stress gains some popularity.<br>
      Now, let's look at the current favorite of the serifed C fonts: Constantia. Based upon this, we should see a rise in wedge serifs and diagonal stress, the later prediction also supported by its incorporation in the highly scientifically designed NPS Rawlinson, which is an old style font. While the wedge serif will probably fade, I believe the diagonal stress will stick around, but it won't be old style, as advancements in technology allow for much greater line contrast, which typographers will take advantage of. We'll also see more open and larger counters, as seen in Constantia and Clearview.<br>
      Given the advancements in screen resolution and the increasing use of electronic paper, humanist sans serif fonts will dominate the sans. I can say with certainty that there will be at least one highly popular sans with a diagonal stress. Now, the fonts that I think will have the most influence are Calibri, Clearview, Optima (Nova), and the font designed by the guy who defended my inquiry about sans in the book font thread (his novelty and rejection of orthodoxy make me feel that he will be an innovator). Now, I don't have the specifics of Clearview or the unnamed typeface on hand, so I'll talk about Calibri and Optima. As duel use becomes more crucial (remember, electronic paper behaves like paper), typographers will try to make more almost-serif fonts, a popular example of which is Optima. This meens we'll see more flaring, with the first, furtive attempts being based upon Optima. Eventually, the serif/sans distinction will be a continuum. Calibri will have the influence of familiarity, making it the basis people will use when thinking about a sans for long enough to influence the majority of sans at least slightly. Now, the most distinctive part of Calibri is its rounded corners and ends. This tells me will go in the opposite direction from how they were at their height and become softer. Now, these two trends could combine in such a way that the lines will flare into a rounded end, which would look slightly reminiscent of a ball terminal.</p>
