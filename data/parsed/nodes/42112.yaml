      <p>Hey, I'm back again.</p>
      <p>First I'd like to answer <strong>charles_e:</strong> <cite>What are we doing, writing the final section of your paper?</cite>.</p>
      <p>No. The last section of my paper will be at least 5 pages long, so what is written here isn't enough for that. The paper will also be written in Faroese, so I cannot just copy and paste anything (and I wouldn't dream of doing that anyway). No, I'm asking for your opinions so I might build upon what I already have.</p>
      <p>Before I asked the question here, I did have a few ideas to what I'd write about, but I think I've gotten quite a lot of material here, which I'm grateful for.</p>
      <p><strong>Nick Shinn:</strong> <cite>1. Making my handwriting into an OpenType font. I think there’s a lot of potential to get a much more natural effect, using contextual alternates, than has so far been achieved, so I’d like to take a crack at that.</cite></p>
      <p>Personalised fonts. I can write about that and point to examples, if any.</p>
      <p><strong>bieler:</strong> <cite>From a personal perspective I’d suggest there is very little to expect from typography in the future. [...] Typography is what it is. There may be occasional questioning as to what it is in an idealogical sense, but ultimately it is what it is. We just keep coming back to the fundamentals.</cite></p>
      <p>I could suggest that there might not be happening too much in the near future, and my opinion on why and point to something that points towards that being the case.</p>
      <p><strong>Don McCahill:</strong> <cite>There will always be progress, as long as a product is used. The only way typography can die is if reading dies, and that isn’t likely to happen before someone invents mental telepathy (and who knows, maybe that will require fonts as well.)</cite></p>
      <p>A very good argument for typography always changing, as long as people use it.</p>
      <p><strong>James Puckett:</strong> <cite>On a somewhat related note, the “great designers” of the future will no longer be the high-minded hotshots in New York and Basel, they’ll Dubai-based geniuses who can effectively communicate across cultures.</cite></p>
      <p>Highly competitive market = Innovation (?)</p>
      <p><strong>Ch:</strong> <cite>i see trends such as L33T, slang, revisions in punctuation norms, and other popular modifications as healthy signs that the language is alive and well. sure, customized and colloquial usage may offend the keepers of orthodoxy, but it’s inevitable and, imho, part of the (r)evolution.</cite></p>
      <p>Slang, punctuation norms, etc. could change how we write.</p>
      <p><strong>charles_e</strong><cite>Sverri,</cite></p>
      <p>Id recommend getting your hands on a copy of Fred Smeijers little book Type Now. What you ask is, I think, implied by his discussion.</p>
      <p>Thank you for that. I'll order it right away.</p>
      <p><strong>charles_e:</strong> <cite>Anyway, it depends on the time frame you consider “future.” Your history covered over 500 years. If you are looking 100 years ahead — or even 50 — it would be silly to expect OpenType to still be the format. </cite></p>
      <p>Yeah, I guess I should've mentioned that in the original post. I'm trying to limit it to the near future, perhaps around 25 to 50 years. I think looking futher than that is quite pointless, seeing as technology (which undoubtetly will have a big impact) is speeding up, and the speed at which the speed is growing is also growing.</p>
      <p>And I'm trying not to limit my thoughts to formats and stuff like that because, as you say, they come and go as the times change.</p>
      <p><strong>Scalfin</strong> <cite>I’ve got it: automated font-tone matching for voice recognition software(Dragonspeak), so the text can match your speech.</cite></p>
      <p>Interesting idea, heh.</p>
