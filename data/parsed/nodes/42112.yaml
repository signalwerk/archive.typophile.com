      <p>In the future I hope I can create fonts with:</p>
      <p>Alpha channels: If I want to create the effect of a semi transparent ink right now, I have to use multiple layers, crude shading using dots or noise. Users are requires to apply multiple layers. Alpha channels in a font format will be a new way to alter weight. Currently I can only adjust weight by reducing stem width, crude dots, light traps, stripes &amp;c. Picture a counterless art deco display fonts like Baby Teeth, Parkitechture, Misirlou. Now imagine the O, instead of being solid, having a gradient so the centre is transparent. Picture a boringsans lowercase b. The stem width is uniform. Where bowl meets stem, the lines gradually fade to near transparent. Picture a spraypaint font that looks like real spraypaint. How about a "lipstick on a mirror" font with variable transparency? Now imagine how shitty/unconvincing those effects would look using current font technology.</p>
      <p>Assignable colours: Currently, fonts have one assignable colour. To assign multiple colours, I have to create separate font layers. No fun to make, no fun to use. Assignable colours could work with CSS to make headline fonts which correspond with a web site's colour scheme.</p>
      <p>Hue and value shifts: Currently, a designer can assign a wood texture to a font and it'll looks like letters cut out of wood. But what about a hillybilly-style font with planks and nails? Each plank would have a fake woodgrain effect and self shadowing where the planks overlap. Maybe I'd like to make a cheesy 70's airbrush chrome effect font? To make something like that where the designer can apply a colour to a material, I need to be able to assign hue and value shifts.</p>
      <p>Z plane: I would like to be able to assign three dimensional attributes to glyph? Visual displays aren't going to be flat forever so why not support 3d geometry in a font format? Imagine Frankfurter if it were really 3D and appearing to hover 3cm off your monitor. Face recognizing fake 3D desktops are probably only a few years away. Currently, designers can loft their own text but as a font designer, I want to be able to shape each letter precisely in three dimensions.</p>
      <p>Pseudorandomization: Currently, I have to use OpenType ligatures to create a pseudorandom effect. That system doesn't allow tracking because the spacing font each ligature is fixed. Other systems can be used to create a pseudorandom effects but none are turned on by default in Adobe apps so it's unlikely that designers will use them.</p>
      <p>Designing fonts with current TTF/OTF tech is like being an designer whose only tools are black construction paper and a pair of scissors. There are a lot of possibilities but after a decade of cutting shapes with black paper and scissors I'm pining for different art supplies. I'm primarily thinking of features that would improve display fonts. If you think new font capabilities wouldn't improve text fonts as well then try using your imagination. It seems like new fonts formats are created to support existing font ideas instead of giving us tools we can use to create something totally new.</p>
      <p>Yeah, I know about Photofonts, no thx. I want vectors and I want it to be fully supported by default. Either the future of typography will involve some of the above or it'll involve me going completely nuts.</p>
