    html: |-
      <p>I liked what you said Charles, but I think Postscript language specifically, not computers, are what changed the relationship of fonts to hardware.<br>
      I think the future of typography is bright, but most fonts will be relegated to where they belong, and a few will shine on, as it always will. ITC fonts were so exciting, I remember waiting for releases (via Linotype), looking back, I cringe… Only time really tells what stands out and breaks out of its time period.<br>
      Font formats come and go… got any type 3 fonts? or NimbusQ? or Letrafonts? Or Fonts with Typestyler? All these formats came out around the time of Postscript, who cares or needs most of these others? Font formats will only be adopted when they are soo much better than what is standard at any time, which is why you will see postscript fonts linger around for a long time, because OT fonts need to be far more compelling for users to be willing to purchase them, over an already purchased PS font. Only a fool would buy an OT font that has no more functionality than a PS font, as it would be redundant.<br>
      Paper will carry on, the ultimate archive, we still have Gutenberg Holy Bibles, but we can only guess how he produced them, as his instruments and technology are long gone. In his life, he was a failure, financially, but to me, quite an evangelist!</p>
      <p>Ink on paper adds the permanence, and quality that the publisher intends, while at the moment (we have been waiting for decades) screen resolutions are roughly the same as before the computer revolution.<br>
      I believe signs will be a strong outlet for typography, which bodes well for headline fonts. Print will keep fighting, with costs continuing to decrease (mature technology plus competition from internet and far ranging competitors) and automation increasing. Niche market magazines (check B&amp;N) will increase. Catalogs. More range of printed material but fewer copies printed, which will be good for typography in general.<br>
      Fonts and font ownership seem to be going back to metal type years. Agfa seems to own everything, through consolidation (Agfa (Compugraphic), Monotype, Linotype, ITC, and Letraset(I think). And there are lots of smaller and regional boutique font companies. And who can forget Adobe?<br>
      The Truth shall set you free</p>
