      <p>From a personal perspective I'd suggest there is very little to expect from typography in the future. I think the major upsurges (in terms of idealism) were from 1455 to 1501, the  major investigations at the beginning of the 20th century (both in regard to traditionalism and modernism), and in the 1990s (as a consequence of the unlicensing of font formats). </p>
      <p>Other than than that it has been merely technological transitions (which have not been insignificant—but seem other than what you are looking for). In terms of "holographic displays," and similar such multi-media stuff; I'm not sure how much this actually has to do with typography so much as something else (and we have gone through that time and time again). Typography is what it is. There may be occasional questioning as to what it is in an idealogical sense, but ultimately it is what it is. We just keep coming back to the fundamentals.</p>
      <p>Gerald<br>
      <a href="http://BielerPrss.blogspot.com" title="http://BielerPrss.blogspot.com">http://BielerPrss.blogspot.com</a></p>
