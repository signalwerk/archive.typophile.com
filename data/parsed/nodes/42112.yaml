      <p>What are we doing, writing the final section of your paper?</p>
      <p>Anyway, it depends on the time frame you consider "future." Your history covered over 500 years. If you are looking 100 years ahead -- or even 50 -- it would be silly to expect OpenType to still be the format. PostScript has lasted 15 years. Hot metal lasted about 70 years. Photocomp around 40 years. The technology from the time of hot metal through photocomp caused certain changes in type because the economic emphasis was on selling the machines that set type, not the type itself. Typography (the type design part of it) was a servant to those machines.</p>
      <p>The computer changed that. Now, for a period, anyone can produce type. But OpenType changes the software requirements considerably; if OpenType goes a certain way, it may again take a large foundry to economically produce fonts.</p>
      <p>But that is very short term. Consider this. In 50 years, or 100 years, or however far into the future you want to project, we will still be communicating, at least in part, with the written word. And you can type faster than you can write longhand, and speak faster than you can write longhand. Therefore, type will be around. In what form will depend on where technology takes us.</p>
