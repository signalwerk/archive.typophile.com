      <p>I'll be tied up extending my back catalog into the OpenType format for a while, it's something I still haven't finished.<br>
      Two new projects that I do however have in mind:</p>
      <p>1. Making my handwriting into an OpenType font. I think there's a lot of potential to get a much more natural effect, using contextual alternates, than has so far been achieved, so I'd like to take a crack at that.</p>
      <p>2. A straight forward roman OpenType face that uses alternates -- most definitely not ligatures -- to create a subtle effect. Not necessarily imitating the idiosyncracies of letterpress, but with the idea that such variations may serve a purpose.</p>
      <p>So, no predictions, and somewhat self-centred, but that's as real as I can get.</p>
