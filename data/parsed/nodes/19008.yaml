      <p>IN PERSON: There were very few rounded fonts used then. That's probably the bleeding ink of something like <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.45.0.3&amp;attributes.sampleSize=48&amp;sampleText=IN+PERSON&amp;sampleSize=48" rel="nofollow">Futura Extra Bold</a>. Futura or <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.121017.0.1&amp;attributes.sampleSize=48&amp;sampleText=CARNEGIE+HALL&amp;sampleSize=48" rel="nofollow">Tempo</a> is used for the other small type.</p>
      <p>The big wide stuff can be emulated with Font Bureau's newly released <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=7&amp;displayfontid=FB.122839.0.0&amp;fontRendererText=JUDY+GARLAND" rel="nofollow">Titling Gothic</a> or <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=4&amp;displayfontid=FB.100197.0.0&amp;fontRendererText=JUDY+GARLAND" rel="nofollow">Rhode Extended</a>, or <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=ITC.103137.0.3&amp;attributes.sampleSize=48&amp;sampleText=JUDY+GARLAND&amp;sampleSize=24" rel="nofollow">ITC Blair</a>.</p>
