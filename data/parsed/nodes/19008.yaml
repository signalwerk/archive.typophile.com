    <p>hey everybody, i saw the post about gay type earlier and one of the posters mentioned judy garland, who is also a favorite of mine as well. can anybody tell me what this font is that they used on her classic poster from the show at CARNEGIE HALL?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Judy at Carnegie.jpg"></div><p></p>
    <p>i hope i figured out how to post the image right. </p>
    <p>i found a few fonts that are pretty close, but nothing that has the right spirit! i think "IN PERSON" might be rounded, but sorry it's hard to tell from the image. thanks everybody, this is my first time wth a request like this and it's great to see how helpful you are to amateurs like me!!!</p>
