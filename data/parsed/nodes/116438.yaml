    <p>Hi all!</p>
    <p>This is my first visit and your help would be much appreciated! I was on the website of houseandgarden and found their font so simple and nice to work with. However, I could not identify the font on several websites. I am hoping one of you knows what font this is!</p>
    <p><a href="http://www.houseandgarden.co.uk/interiors/hipster-home-trends/washi-tape" title="http://www.houseandgarden.co.uk/interiors/hipster-home-trends/washi-tape">http://www.houseandgarden.co.uk/interiors/hipster-home-trends/washi-tape</a></p>
    <p>I am not sure if the text "20 HIPSTER HOME TRENDS WE LOVE" and the text below the image "The £3 magic decorating tape from Japan. If you're a hipster, you use it to create your moodboard - you know,  " are the same... But I want to know :)</p>
    <p>Thanks a lot.</p>
