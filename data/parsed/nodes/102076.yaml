    <p>Hi Folks,</p>
    <p>I just released my first font in MyFonts. It's a text sans. If it makes success, I'll make a Cyrilic. Hope you like it! Here is a description:</p>
    <p>Inspired by Italian Renaissance fonts like Poliphilus, Blado, Centaur and Arrighi, Lucca presents a simple charm and a powerful classic feel. It is cute, friendly, clear and superbly readable.</p>
    <p>Its low contrast provides Lucca a firm yet flexible substance, making it sensual and enticing. There’s a certain degree of abstraction in the precise endings, and the whole design was made to survive even in the harshest conditions, conserving its readability and beauty.</p><div class="imageWrap"><img src="http://typophile.com/files/Lucca poster 1_5783.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Lucca poster 2_5227.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Lucca poster 4_3766.png"></div><p></p>
