    html: <p><a href="http://www.myfonts.com/fonts/bitstream/futura/" target="_blank">Futura</a>, but the M is different. <a href="http://www.myfonts.com/fonts/bitstream/geometric-415/" target="_blank">Geometric 415</a> is close. <a href="http://houseind.com/house.php?kit=NEUTRAFACE-FO&amp;sub=view" target="_blank">Neutraface</a> (from House Industries) would work. <a href="http://www.myfonts.com/fonts/linotype/avenir/" target="_blank">Avenir</a> is OK too but some characters are different. Can't easily find an exact match but any of the above should do the trick. Neutraface gives you the funky 33.</p>
