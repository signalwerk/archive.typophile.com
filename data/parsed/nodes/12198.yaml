      <p>If Apple knew it and did nothing then it's a real catastrophy. I'm not sure if the term 'hybrid' is justified in this case. The AAT components of an AAT/OT font doesn't intervene with the OT component of it as far as I know. I can easily open my AAT/OT font in FontLab and delete all its OT features and generate a font which is perfectly capable of running on TextEdit. Do I need to do that? Is it so difficult for Apple to simply ignore OT in it's own environment?<br>
      AAT/OT fonts for some languages like Persian or any other language of Arabic script is not a fancy supposition. It's bear minimum for cross platform compatibility. How Apple could ignore it in an evolution which incidently was born with cross platform compatibility in mind?!<br>
      Apple runs AAT fonts as good as ever. Can't it 'identify' an AAT/OT font as an AAT font and do the same thing?<br>
      Regards</p>
