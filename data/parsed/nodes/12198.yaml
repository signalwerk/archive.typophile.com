    html: |-
      <p>You are absolutely right.<br>
      As a matter of fact, the behavior of my OT/AAT font is slightly different depending on whether it's used in AAT or OT environment. These differences could be more pronounced if I wanted to (and could!) produce a font with more 'fancy' components and sophisticated presentation. Dual technology for text presentation is inherently inconsistent but this is not about a choice between AAT or OT. It's about having or not having cross platform compatibility.<br>
      I'm talking about bear minimum requirements for a Persian font to be able to be useable in both platform. This is what essentially I put in my OT/AAT font and slight differences of font behavior in each environment is not a major concern. The concern is having a readable text in both environment or not having it at all. And I think facing this reality, the choice of Apple about which part of an OT/AAT font should be sacrificed in favor of the other is rather clear.<br>
      Sometimes it's hard to describe how this can be important to those who don't use the concerned languages. But to give you an idea I give you a recurring problem for Mac users on Safari.<br>
      If Mac users had installed MS Office for Mac, they have installed along Times New Roman and Arial of MS which cover Arabic script.<br>
      Now, many web-pages in that script are designed on PC and frequently TNR and/or Arial are tagged in their page layout. So Safari opens those pages with these fonts... with broken characters because they don't have AAT! The only choice for Mac users is to delete their fonts to be able to view those pages properly!<br>
      If those pages were tagged with an OT/AAT font, users on any platform would not have such problem, whether they had those fonts installed or not.</p>
