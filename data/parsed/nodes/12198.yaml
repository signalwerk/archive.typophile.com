      <p>Whichever way they do it, as soon as you have an environment that supports both, some things can go wrong. What if I were to take a fancy OT font, and add some basic AAT functionality to it? If AAT features take precedence, then the greater bulk of the functionality would be lost.</p>
      <p>In this case, the OS can do more with one format than the other. So the "right" behavior is more apparent. But there's always the danger, or even likelihood, of fonts implementing one path more than the other, or worse just having some slightly different effects depending on whether one treats them as AAT or OT. There will be problems with hybrid fonts, it's just a question of degree and what those problems are.</p>
      <p>T</p>
