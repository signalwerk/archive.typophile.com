      <p>Shooting from the hip, I believe you would have to set line-height to a specific fixed size for all inline elements within the block to work around this. Since most people set line-height, AKA bastardized leading, to relative em heights, it is sometimes difficult to accomplish.</p>
      <p>Someone please correct me if I'm wrong, but I'm sure I'm right because I just did something like this.</p>
      <p>For anything that requires Unicode, I make a specific HTML class to make darn sure that the fallback font is a full Unicode font. And even then it's iffy to get it to work because of the differences in browsers and OS.</p>
