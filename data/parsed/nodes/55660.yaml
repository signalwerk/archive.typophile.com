    html: |-
      <p>SUP, like the superscript option in most word processors will raise (and sometimes scale) the regular numerals. I'd imagine Wikipedia uses it because most system fonts don't contain a full set of the real thing* and because it's machine parse-able? There may be ways in CSS/HTML to lock leading, but my guess is that support will vary from browser to browser. </p>
      <p>Looking at the fonts on my machine, Calibri seems to have them all (Georgia does not), and the design and alignment seems consistent. Comparison with Outlook/Word's superscript option. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CaptureOutlook_6020.JPG"></div><p></p>
      <p>*not sure if this is their intended purpose.</p>
