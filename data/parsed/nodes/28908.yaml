    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Albert Pinggera</strong></p>
    <p>Albert Pinggera comes from Southern Tyrol, the German-speaking region in northern <a href="/wiki/Italy" class="freelinking" rel="nofollow">Italy</a>. Realizing that the letters interested him more than the medium, he apprenticed to the typesetting and graphic design department of a newspaper in Bolzano. In 1993 he went to Munich where he worked with <a href="/wiki/Gert%20Wiescher" class="freelinking" rel="nofollow">Gert Wiescher</a>, and a year later he moved on to <a href="/wiki/MetaDesign" class="freelinking" rel="nofollow">MetaDesign</a> in <a href="/wiki/Berlin" class="freelinking" rel="nofollow">Berlin</a> to assist <a href="/wiki/Luc%28as%29%20de%20Groot" class="freelinking" rel="nofollow">Luc(as) de Groot</a> in the type department. In 1995 Albert moved to The Hague for the postgraduate course in type design and typography at the <a href="/wiki/Royal%20Academy%20of%20Art" class="freelinking" rel="nofollow">Royal Academy of Art</a>. After graduating cum laude in 1997 he returned to Italy, to the mountain town of St. Leonhard in Passeier, and founded the company <a href="/wiki/design.buero" class="freelinking" rel="nofollow">design.buero</a>. Clients range from local institutions to multinationals and the work is varied: custom typeface design, concept/design/production of complex book projects, designing exhibit spaces and signage systems, corporate identities, etc. From 1998–2002 Albert Pinggera taught and gave seminars on type and typography in Bolzano. In 2003 Albert Pinggera’s <a href="/wiki/FF%20Strada" class="freelinking" rel="nofollow">FF Strada</a> was a winning entry of <a href="/wiki/TDC2" class="freelinking" rel="nofollow">TDC2</a> 2003, the <a href="/wiki/Type%20Directors%20Club" class="freelinking" rel="nofollow">Type Directors Club</a>'s annual type design competition.</p>
    <p><strong>Fonts by Albert Pinggera</strong><br>
    <a href="/wiki/FF%20Letter%20Gothic" class="freelinking" rel="nofollow">FF Letter Gothic</a><br>
    <a href="/wiki/FF%20Strada" class="freelinking" rel="nofollow">FF Strada</a></p>
