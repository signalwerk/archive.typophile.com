  html: <p>Greater Albion Typefounders have just posted the first preview of their next release, Brosse. Brosse is intended to be a lively slabserif face that emphasises simple geometric curves.  The sampler can be viewed <a class="freelinking external" href="http://gatf.wordpress.com/files/2009/09/brosse.pdf " rel="nofollow"> here</a>.  All constructive feedback greatfully received.</p>
