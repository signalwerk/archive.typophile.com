      <p>Your profile identifies you as a freelance designer. When you refer to your boss, do you mean a client?<br>
      If you're a full-time employee of a company, you may have signed an intellectual property agreement when you were hired, making anything you create in the course of your 9-to-5 job effectively a work for hire. This may not be fair, but if you signed one of those, your best course of action is to tell your boss, <em>Oops, my bad. It won't happen again.</em><br>
      If this is a logo you're designing for a freelance client, your contract with them may have some non-disclosure clause in it, in which case the <em>my-bad</em> approach is advisable.<br>
      In either case, point out that you acted in good faith with the goal of getting the best outcome for your client/employer, and with no intent whatsoever to harm or deceive them.<br>
      It's an unfortunate fact of life that businesses base their rules on worst-case scenarios, and therefore eliminate many valuable opportunities because they have a minuscule but real risk attached to them. You are in the awkward position of someone who might have to choose between being <em>right</em> and being <em>employed</em>.</p>
