    <p>I've been a member of typophile for a couple of years now. I love the quality of the feedback, the willingness to help, the sense of community. It's a website that I trust.</p>
    <p>However, after a recent forum post for a logo I was creating, I was approached by my boss after our legal dept. contacted him. They were not happy, it seems, with me posting a forum discussion on our logo. As usually happens though, we got a better logo because of it. </p>
    <p>They were afraid someone would steal the wording that we were using, and hoped to trademark. Maybe they also worried someone would steal the logo itself.</p>
    <p>I don't know too much about words themselves and how they are protected, I suppose it's possible for someone to decide to "trademark" a term before we get around to it. As far as the logo goes, it's copyrighted, always, as our own creative piece--or so my understanding has always been. Therefore the logo would be protected (though, I must admit if our terminology was stolen, the logo is useless).</p>
    <p>As I said, I trust those on this website. The problem was that entering the terminology on Google lead to the first result being this thread (that's how legal found it). So...anyone out there could read the thread, and decide to try and steal my work.</p>
    <p>Now I feel this is all highly unlikely. BUT does anyone have any tips on how to keep using this site as a resource (as so many ppl do for identity projects), without risking the work/the terminology? </p>
    <p>What can I say to my employer? To our legal dept?</p>
    <p>If there is a definite risk--Would ppl in our community be obliging if I asked them not to explicitly write out the words in question in their responses? For example, if I show the words next to the mark in a logo as a JPG, and ask that people refer to them as words, in general, not in specific ("blue lantern fisheries")--wouldn't that forum not show up on a google search? Would people mind? </p>
    <p>But what if someone did write out "blue lantern fisheries"--telling me it should be centered, or rag right--and now google hits this thread, and I get in trouble.</p>
    <p>So you see the problem, there must be a way to be protected without having to annoy people by telling them how to frame their responses. Or maybe their isn't.</p>
    <p>Could anyone offer me some advice, share experiences, etc?</p>
