      <p>I've never heard of anyone "stealing" work from others on Typophile, though I can imagine plenty of people are inspired and perhaps borrow ideas seen here (This does not include any instances of ripped-off intellectual property in the greater type design community). </p>
      <p>The majority of our users are honest and respectful people, but this is the world wide web. Anyone and everyone has access, so really, there is no guarantee that your work is safe from copy-cats. (I should also mention that legally, Typophile cannot be held responsible in this case).</p>
      <p>Posting client work should always be done with great discretion and yes, Google loves Typophile, so chances are your posts here will get on the first page of any search result. There have been dozens of situations where a designer's client has contacted us to remove content - usually from the logo/identity critique section. We have also been contacted by legal departments on a few occasions. I've seen it get ugly and I've also seen people lose their jobs.</p>
      <p>It has already been said here, but I recommend removing any proper names associated with the business. Remove it from the threads text and remove it from the file name.</p>
