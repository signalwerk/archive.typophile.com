      <p>In my book there is no way anyone can steal something that has been published and get away with it. If you described a wordmark or logo on a public forum that counts as publishing and is therefore protected by copyright. In case someone would steal the idea and trademark it (or any other way of registration), you can prove previous use and win litigation.<br>
      Especially with a lot of Typophiles as witnesses : )</p>
      <p>What your legal dept. is afraid of is the cost of litigation and the possibility of getting some dumbass judge who doesn’t get it, resulting in years of drawn out and expensive court cases. But that’s the American Way, I guess (highest ratio of lawyers to general pop., right?)…</p>
      <p>A historic event comes to mind, where a Brazilian trademark was established for the wordmark ‘Coke’ by an outsider (because the C-C people kinda forgot to get there first) and that guy had to be bought of for a couple of mil.</p>
      <p> . . .<br>
      Bert Vanderveen BNO</p>
