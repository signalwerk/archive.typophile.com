      <p>I've only posted one logo on Typophile (<a href="http://typophile.com/node/5414">here</a>, with the permission of the client), though I've commented on many. I have no experience with stolen work from Typophile, but if you're working with pre-copyright/pre-trademarked stuff you shouldn't put it on the web. Period. Sounds to me like you want the quality critique you get here (most of the time), but are running up against very real client constraints. I don't know if you're on sound legal ground or not, but I have to imagine it is more trouble than it's worth.</p>
      <p>In the end, you have to bow to their needs or you risk creating a huge problem for both you and them. Again, I suggest you ask them to file the appropriate legal docs before you post here. Also you should notify them that you plan to expose the development of their logo/ tagline/ identity freely online. I bet many of them would not want the process work up online and would be angry that you did, legal issues aside. Additionally, you have the risk of someone seeing your work get critiqued on the web. If a potential client don't understand the design process, they may perceive the thread as showing that your work isn't good, or the client whose logo it is may believe that you didn't show them all the options.</p>
      <p>I think Typophile is a great resource for logo input, but I don't think it's always the right choice, given its completely open nature.</p>
