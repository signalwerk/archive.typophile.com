      <p>I'm glad to see this discussion is growing. It's very helpful to me (and many others I imagine) as to how to approach the business and all it's nuances. </p>
      <p>As a designer I dont require outside critique, but when it comes to identity work, sometimes I get stuck--and other minds and opinions usually help. In all other areas, I dont post examples online. Yet, the nature of identity work does indeed make it a very touchy, very risky subject in this case.</p>
      <p>If I have to do any other logos for this company I will be sure have a discussion as to the potential risks and benefits involved (thank you for enumerating them), and whether any of the prescribed treatments (such as using nonsense words) would make this a viable option.</p>
      <p>TM--my company has used it before actually registering a phrase/motto, as an instance of intent to register.</p>
      <p>As far as "can you," I'm not sure if that is the correct thing to do or not--it doesn't seem like that practice would be illegal....and hopefully would be a deterrent from stealing.</p>
