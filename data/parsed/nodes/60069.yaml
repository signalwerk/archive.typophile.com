      <p>I think it's unlikely that people will steal as long as you only post jpegs. I once posted a PDF of a logo in progress on another design forum, and someone directly stole a "k" from my totally-drawn-from-scratch logo. I know this only because he asked for a critique on his own studio logo a month or two later, and I recognized the very unique "k" I had drawn. Thankfully he was cool about it when I confronted him, and he changed his logo sufficiently. So: lesson learned, don't post PDFs.</p>
      <p>I can't add anything to what others have suggested about how to approach your boss and the legal dep't, except to stress the fact that you never know who might be watching. </p>
      <p>I once posted in another design forum about my unhappiness with the pay at a former job. I didn't mention the name of the firm I worked for; I didn't even say anything bad about them. I only mentioned that with a new baby, my wife and I needed more income than I was getting, and that the salary freeze we'd all been subject to was putting a financial strain on me. All I wanted was input from the people who knew me on the aforementioned forum, regarding whether they thought I was ready to make the move to self-employment or if I should stay put.</p>
      <p>My former boss somehow found me on there, not sure how because she doesn't exactly hang out on design forums. She didn't fire me per se, but she did give me 2 hours notice with a couple months worth of severance. She said she was "going to tell people the decision is mutual, and is giving me the wings I needed to start my own studio" (read: I've realized you're not loyal to me anymore, and I can't stand the idea of having someone on staff who's looking to make a move). Moral of the story: just don't broadcast what goes on at work... that is unless it's been months since you've left and are now happily, gainfully self-employed and couldn't care less about whether said former employer is still stalking you or not.</p>
      <p>;)</p>
