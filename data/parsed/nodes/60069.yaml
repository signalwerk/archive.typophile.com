      <p>I'll go with Cerulean and others here: I'd rather send a 'work in progress' logo I'm feeling stuck on with friends of mine on private emails, and for sure not be foolish enough to post it on the Internet - that actually seems insane, and I think you are lucky not to have been fired. Also, as it has been written elsewhere, it definitely makes you look like an incompetent designer who needs input from others in order to have a good logo. Well at least, that's what I would think of you if I was your boss and I came across a thread like this - and by the way, I hope you realize that your legal dept. and boss are very much probably still reading this thread.</p>
      <p>In my opinion there is only ONE rule: do not post anything as long as the product is not out on the market. Even if it has been protected in terms of copyrights (name, visual, etc), it may destroy strategic efforts deployed to launch a brand or a concept, by showing it too early. What you did is a HUGE mistake, and you better try not to do it again, ever. I know it, because I did almost the same mistake some years ago, at a time I was not completely aware of the power of Internet; I posted a finished job on my portfolio, not even a forum, and it was not even accessible without knowing the proper address. Unfortunately, Google found it, and this product was not yet out on the market. The customer was spending $$$ to prepare its launch. It is my only mistake of this kind so far, but it is one I learned a great deal from.</p>
      <p>dr</p>
