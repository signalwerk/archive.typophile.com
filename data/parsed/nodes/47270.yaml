  html: |-
    <p>C’mon people, get it right, be specific.<br>
    Don’t you know the difference between typographers and type designers?</p>
    <p>Calling a type designer a typographer...<br>
    ...is like calling composers musicians.<br>
    Or choreographers dancers.<br>
    Or authors writers.<br>
    And so on.</p>
    <p>I suppose it could have been worse.<br>
    At least we weren’t identified as font developers :-)</p>
