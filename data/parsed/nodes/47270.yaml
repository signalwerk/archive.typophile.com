      <p>Little did Erik Spiekermann know that when he submitted his handwriting samples that he would loose a long held secret. His sixth tool from the top, in the examples, proves that Helvetica was in fact derived from the scripts of Zaner himself with influences from the tablets from Ugar.</p>
      <p>By the way, the term typographer originated in Ptolemaic times and was spelled with a P. They were the center of the universe.</p>
      <p>Pandora’s box is open.</p>
      <p>Michael</p>
