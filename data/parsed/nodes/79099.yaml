      <p>If you think these look smashed together, you should try reading some American Session Law ( <a class="freelinking external" href="http://frwebgate.access.gpo.gov/cgi-bin/getdoc.cgi?dbname=111_cong_public_laws&amp;docid=f:publ025.111.pdf" rel="nofollow">e.g.</a>)! I don't know how they can bare to deal with that on a daily basis.</p>
