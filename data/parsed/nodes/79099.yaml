      <p>Scott: at least on my machine, xpdf doesn't properly handle the soft hyphens and copies the text literally as it appears (which reminds me that it was one reason I switched to evince on Linux). The only reader I can find which allows column selection in a vaguely sensible way is Foxit Reader on Windows. I'm surprised that the PDF specification doesn't specify a proper way of handling columns or, if it does, that it is not implemented by the readers.</p>
      <p>Nick: I think the difficulty with these documents is the volume that are produced each day. Looking at the UK's <a class="freelinking external" href="http://www.legislation.gov.uk/new/2011-02-16" rel="nofollow">Legislation Site</a>, there were 60 pieces of legislation published yesterday (albeit all Statutory Instruments rather than Statutes), some of which can run to several hundred pages. If they are also attempting to published up-to-date legislation showing consolidated amendments, then I think some automatic generation is going to be inevitable, since the costs of getting everything professional set might be prohibitive. That's not to say the templates should not be properly designed and implemented, nor that official printed versions should not be properly set, but I think there is a limited to what can be done for the consolidated versions. In the old days, when going to the higher courts in the UK, one was required to have the pleadings printed (<a class="freelinking external" href="http://www.scottishlawreports.org.uk/resources/dvs/donoghue-v-stevenson.html" rel="nofollow">e.g.</a>) but that seems to have died a death in the name of efficiency and so it's not surprising that the statutes are going that way too.</p>
