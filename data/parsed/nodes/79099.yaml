    html: |-
      <p>As someone who reads (English) statutes on a daily basis, I was a bit surprised to read this in the design brief:</p>
      <p>"The number of characters on a line of text influences the speed of reading and the ease of comprehension: a line of text that is too short can slow reading and cause eye fatigue as the eye must move more often from one line to the next, whereas a line that is too long may cause the eye to skip to the next line. With respect to long texts, the ideal length of a line is between 50 and 70 characters. In the new page layout, the lines are on average 56 characters in length (versus 42 in the current PDF version)."</p>
      <p>My experience is that most people who use statutes do not read them for any length. I rarely read more than one section--perhaps 150 words--in one go, and often single subsections of a few words are all that is required. I'm therefore not sure that design considerations suitable for book typography are the most appropriate in this case. That said, increasing the line length is certainly welcome for most statutes since it reduces the number of orphans when short subsections break over the line.</p>
      <p>Having more information in the header and footer of each page is, I expect, a big improvement, since single pages from acts are (in the UK at least) regularly printed and it is helpful to have as much information about where they came from as is possible.</p>
      <p>Technically, I wish they would prepare the PDFs so that copying from them is easier. Particularly since this a bi-lingual text, in two columns. Testing it in a few PDF readers, I can't successfully copy two consecutive sections from the same language without pulling in a section from the other; something which would be extremely annoying if I had to use these on a regular basis.</p>
      <p>In terms of the type, it doesn't seem to be a very radical change over the old system. I like the bold Univers figures for the section numbers but find them quite distracting in the running text. It is interesting that they have turned the marginal comments into headings for each section. In the UK, these are added editorially by the printers after the Act is approved by Parliament. This affects the weight given to them as aids to interpreting the statute by the Courts since they were not directly approved by the legislature. If the Canadians have the same system, then this could cause confusion since the typography clearly suggests them to be part of the Act.</p>
      <p>I wonder if there is a reason why the subsections in English are labeled (a) (b) (c) &amp;c. and those in French a) b) c)?</p>
