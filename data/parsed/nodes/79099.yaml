    html: |-
      <p>1. Georgia's oldstyle figures replaced by lining figures in Univers, strange, but presumably following some sort of logic.<br>
      2. Faux italics of Univers.<br>
      3. Never have liked fake ordinals (e.g. in 1st) either.<br>
      4. Needs a double space after the bold italic sans side heads, before main serif text style.</p>
      <p>But these are typographic nitpickings, not really important to the layout and hierarchy of the new bilingual layout, which I'm not really qualified to judge, not being familiar with the previous version. I think they want feedback from regular users of these kinds of documents.</p>
      <p>Canadian content: Patrick Griffin, John Hudson, Chester Jenkins, Ray Larabie, Rod Macdonald, Thomas Phinney, Jim Rimmer, Les Usherwood.<br>
      Should be able to get some Georgia and Univers alternatives out of that bunch.</p>
