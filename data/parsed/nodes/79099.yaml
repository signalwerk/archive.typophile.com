      <p><em>…some automatic generation is going to be inevitable…</em></p>
      <p>That doesn't preclude professionally polished typography.<br>
      The amateurish features of the new design which I pointed out in my initial post are all things that can be fixed globally, and do not require fixing at the level of manual adjustment.</p>
      <p>In fact, if Georgia's old style figures are unacceptable (though why that should be escapes me), then surely it makes sense to switch to a typeface that has default lining figures, rather than  change fonts every time figures appear in the text?!</p>
      <p>And there is simply no excuse, in 2011, for faux italics in a professional document.</p>
