      <p>Statutes are also my bread and butter: and these are disgusting.</p>
      <p>While I can see the point of these bold subsection numbers, everything looks too smashed together. If I had to deal with Canadian legislation I would get very sore eyes very quickly. And the chapter headings do not stand out at all (the face is too narrow) - which is a problem, as I use section headings to catch my eye when I'm flicking through a statute trying to find a correct chapter (and if it's too narrow, I'm not going to see it).</p>
      <p>Forgive me, but I am a fan of the Queensland legislation layout. Yes, it's boring. Yes, it's simple. But it works: which is the most important thing for me: <a href="http://www.legislation.qld.gov.au/LEGISLTN/CURRENT/A/ApiariesA82.pdf" title="http://www.legislation.qld.gov.au/LEGISLTN/CURRENT/A/ApiariesA82.pdf">http://www.legislation.qld.gov.au/LEGISLTN/CURRENT/A/ApiariesA82.pdf</a></p>
