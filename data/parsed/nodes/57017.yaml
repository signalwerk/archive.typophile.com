      <p>Hi, </p>
      <p>yes your correct that originaly 3B2 used converted type 1 postscript fonts in its own fnt format to enable all it clever stuff with character setting. Version 8 brough truetype font support and 9+ added open type support.</p>
      <p>Pre unicode the basic character set was 256 ISOLAT1 using the font table as set in the users own font. Unicode came in for version 7+ but the fear of change and lack of knowledge and availability of unicode fonts, and the fact it would change behaviours of kerning and ligatures (therefore line endings) made few typesetters want to change over existing templates. New templates however should have made this a breeze! :)</p>
      <p>Any further info i can help you with on 3B2 (now Arbortext advanced print publisher) please let me know.</p>
      <p>cheers</p>
      <p><a href="http://www.tformat.com" title="www.tformat.com">www.tformat.com</a></p>
