      <p>As far as I ever got in understanding 3B2, it uses a font format of its own -- much like (LA)TeX. PostScript fonts had to go through a conversion phase into the proprietary format, before the program could use them.</p>
      <p>As with TeX fonts, it's not unusual to see "original" solutions to accented characters, unhindered by any standard such as Unicode.</p>
      <p>But,</p>
      <p><cite>... typesetting colleagues on another continent ...</cite></p>
      <p>hints to me those "colleagues" are unhindered by any typographical knowledge at all. Perhaps they have an extremely expensive and capable piece of software but don't have the accompanying manual.</p>
