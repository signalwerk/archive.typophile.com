      <p><cite>Hmmm.</cite></p>
      <p>What I'm thinking is operator error. Or, rather, not knowing anything else than plain ASCII. I find it quite hard to imagine even <em>basic</em> font conversions to 3B2's internal format looses A-ring and copyright. It makes more sense those guys don't even know they are special characters:</p>
      <p>"Hey, dude, look what the client asks. How am I gonna type <em>that</em>?" "No prob, take an o, make it smaller, and manouevre it somewhat up ... there you go..."</p>
      <p><cite>partly because it’s techie ...</cite></p>
      <p>My knowledge of 3B2 is a decade old and taken from the few pointers the sales rep was allowed to divulge, but even then I was amazed by both its price (...) <em>and</em> by its tantalizing abilities--in the range of and perhaps beyond what FrameMaker does in the hands of a pro.</p>
      <p>I'd love to see their explanation. Care to share some of the good bits?</p>
