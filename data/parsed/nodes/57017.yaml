      <p><cite>***<br>
      ... it takes up to 255 characters, ARING is not coming in this range.</cite></p>
      <p>How very 20th century :-)</p>
      <p>A-ring can be found in the standard encodings for Windows (Western), Macintosh, and Adobe Standard Encoding.<br>
      So Arbortext's font conversion uses an entirely different encoding (one wonders why, and which one); but shouldn't it be possible to re-map to users' specifications? It's not very user friendly not being able to access all characters, somehow.</p>
      <p>I can't say anything on the Unicode version without any further knowledge on how 'a complete template change' works.</p>
      <p>You might want to assure them it's unacceptable to <em>fake</em> characters that <em>do</em> exist in the fonts they use. It's their software--they should contact the manufacturer for the how-to's.</p>
