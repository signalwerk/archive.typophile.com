    <p>I work in journals production so get a lot of PDFs to check, of work done by our typesetting colleagues on another continent. Some of this was done in InDesign, and some in 3B2 (version 9). I often have trouble with them failing to set characters beyond the basic Latin alphabet (eg, accented characters such as Å, and even bog-standard non-alphanumerics such as the © symbol), and have queried this with them. For example, I've seen a regular A kerned onto a degree symbol (yes, not even a floating ring-diacritic, but a °), or a lowercase c kerned onto a circle taken out of some symbol font.</p>
    <p>The response I have received is kinda hard to interpret, partly because it's techie but also because I suspect it's non-native-speaker English.</p>
    <p>So if there's anyone on here who's <em>really</em> conversant with 3B2, please let me know, and then I can show you more detail and see if you think their response is reasonable...</p>
    <p>Thanks in advance,</p>
