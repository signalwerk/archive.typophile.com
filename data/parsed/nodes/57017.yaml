      <p>OK, they now agree that the necessary characters are definitely there in the source fonts (thank goodness, and they have sent me their Win postscript copy of Stone Sans for verification), but say that the problem is down to them using <em>"non Unicode version of 3B2 and there we are not able to produce © in that version"</em>. They admit that <em>"The switch of 3b2 version to Unicode would resolve this problem in totality. There would be addition work from our side, that would be to re-map all special characters and then validate the output. Apart from this there wouldn’t be any change."</em></p>
