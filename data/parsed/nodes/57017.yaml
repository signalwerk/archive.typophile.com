      <p>I found a recent PDF created w/3B2 (v8.07f/W).</p>
      <p>Adobe's Digital Printing Preflight reports nothing unusual -- some images in RGB. Some lines as well, although they appear on screen in black. And, come to think of it, all text is in RGB as well, leading to tons of warnings and absurd CMYK values. Ptoei!</p>
      <p>The fonts have interesting names: AdvGreekM, AdvMT_SY, AdvPi1, etc., none of them has a recognizable regular font name. The plain text font, however, clearly is MS Trebuchet.</p>
      <p>I see a single '©', but copying yields an ampersand. So no Unicode, but it <em>is</em> a real glyph, not a manually faked one. Copying an '=' gives a '¼'. A degree gives '8'. Well, perhaps those are symbol fonts.</p>
      <p>No trademark sign--superscript 'TM' instead. No plusminus but underlined '+'.<br>
      Beta's have been slanted manually to fake italics, and they're not from Trebuchet.</p>
      <p>All in all, yeah, some surprises. But at this level it's hard to differentiate between (possibly) program limitations and (probably) operator stoopidities.</p>
