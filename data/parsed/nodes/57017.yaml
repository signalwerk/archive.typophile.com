      <p>Yeah, when I <em>do</em> see a real copyright, it's invariably one of the two out of the standard Symbol font (one serif, one sans). Also, as mentioned earlier, if I look at the font info in the PDFs, it does tend to say stuff like "AdvP4C4E74" where the font name should be (and Encoding will be listed as either "ANSI" or "Custom")...</p>
      <dl>
      <dt>OK, here's what I got from them, when I asked about the Å:</dt>
      <dd> ********************************************************************************
      <p>We are using 3B2 Version 9 (not Unicode) it takes up to 255 characters, ARING is not coming in this range. We have to use PS value of ring that is PS202 with A. It will not look like a degree sign.</p>
      <p>In Unicode version it will come directly, but it involves a complete change in the template, which is not a viable option. A sample has been attached for reference.</p>
      <p>*********************************************************************************<br>
      </p></dd>
      </dl>
      <p>Ever since I chose to block pop-ups, my toaster's stopped working.</p>
