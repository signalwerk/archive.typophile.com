      <p>Maybe you should go all out?  :-)<br>
      <a href="http://new.myfonts.com/fonts/emigre/missionary/" title="http://new.myfonts.com/fonts/emigre/missionary/">http://new.myfonts.com/fonts/emigre/missionary/</a></p>
      <p>If you need light fonts, instead of really thin ones it's usually better to use "inline" ones: fonts that have the insides cut out. And if you're using a DTL face, Cristal pops into my mind:<br>
      <a href="http://www.flickr.com/photos/bielerpress/258240026/" title="http://www.flickr.com/photos/bielerpress/258240026/">http://www.flickr.com/photos/bielerpress/258240026/</a></p>
      <p>Or maybe something even lighter (not<br>
