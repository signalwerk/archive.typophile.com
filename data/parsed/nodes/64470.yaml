  html: <p>looking for a drop cap which can work with some serif typesetting I'm doing. 3 line single character in conjunction with some DTL typefaces (paradox) and the drop cap just comes in so strong. Trajan is the only one I can think of which is very light but even that comes in very fat when blown up 300%; anyone have thoughts? I'm looking for a light and airy look for the entire piece.</p>
