    html: "<p>Although your vertical proportions are well balanced, the huge x-height means that: <br>- The font will work best for small sizes (I'd say ~8pt in this case). <br>- You need to pull some tricks to make more room for the descenders, specifically by making the bowls of the \"g\", \"p\" and \"q\" rise [slightly] above the baseline. <br> <br>And a question: Could you explain the vertical distribution of the numerals? <br> <br>BTW, it's best to use GIF (not JPEG) for type samples. <br>You can see all the artefacts especially around the white-on-orange text. <br> <br>hhp <br></p>"
    html_clean: "<p>Although your vertical proportions are well balanced, the huge x-height means that: <br>- The font will work best for small sizes (I'd say ~8pt in this case). <br>- You need to pull some tricks to make more room for the descenders, specifically by making the bowls of the \"g\", \"p\" and \"q\" rise [slightly] above the baseline. <br> <br>And a question: Could you explain the vertical distribution of the numerals? <br> <br>BTW, it's best to use GIF (not JPEG) for type samples. <br>You can see all the artefacts especially around the white-on-orange text. <br> <br>hhp <br></p>"
