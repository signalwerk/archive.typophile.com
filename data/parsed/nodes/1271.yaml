    html: <p>Dear Marconi, <br> <br>This is a nice project. Even with so many other typefaces with this same principles, It has somenthing that sparks from the rest. <br> <br>Here are some comments/suggestions wich I guess you should consider... <br> <br>1. The uppercase S seems to be falling to the right. <br>2. The lowercase r has a spacing problem on the right margin. <br>3. There are some weight problens on your figures. Clearly the 3 is much heavier than 1 or 2, and so are 4, 5, 6 and 8. <br>4. You uppercase M seems too wide, comparing to the entire font <br>5. I guess your descender must go down a little bit more... thinking in a text oriented typeface. <br> <br>Just think about it. <br>Keep up this good work! It would be a nice family. <br>Go on!! <br> <br>Fabio Luiz Haag <br></p>
    html_clean: <p>Dear Marconi, <br> <br>This is a nice project. Even with so many other typefaces with this same principles, It has somenthing that sparks from the rest. <br> <br>Here are some comments/suggestions wich I guess you should consider... <br> <br>1. The uppercase S seems to be falling to the right. <br>2. The lowercase r has a spacing problem on the right margin. <br>3. There are some weight problens on your figures. Clearly the 3 is much heavier than 1 or 2, and so are 4, 5, 6 and 8. <br>4. You uppercase M seems too wide, comparing to the entire font <br>5. I guess your descender must go down a little bit more... thinking in a text oriented typeface. <br> <br>Just think about it. <br>Keep up this good work! It would be a nice family. <br>Go on!! <br> <br>Fabio Luiz Haag <br></p>
