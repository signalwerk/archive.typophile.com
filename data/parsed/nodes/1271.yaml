    html: "<p>Nice work, Marconi, it's getting much better. <br>Good points, Fabio. <br>I'd add that your caps are too dark, and: U and S are wide, P is narrow and Y is too light. <br>There are some little weight inconsistencies over the alphabet, and finally, I think your non-alphabetical glyphs need some work. <br>Keep it up! <br>Abra</p>"
