    html: <p> Thanks for the suggestions David and Tiffany. <br> <br>I was in a used bookstore the other day and found... <br> <br>How Typography Works (and why it is important) <br>by Fernand Baudin <br> <br>Lettering Design by Michael Harvey <br> <br>The Alphabet and Elements of Lettering <br>Frederic W. Goudy <br> <br>These books + this thread have given me a small bit of enlightenment as to how to construct a 'text face'...from scratch. <br> <br>That secret, I think, is to turn off your computer and draw the face on paper. Eureka! <br> <br>bj </p>
