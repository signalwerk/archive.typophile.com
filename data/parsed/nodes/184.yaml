    html: "<p>The best calligraphy markers I've ever used are <br>the double-ended ZIG waterproof markers available <br>from http://www.johnnealbooks.com/ . One nib is <br>2mm for ordinary everyday writing (checks, forms, <br>letters, envelopes) and the 5mm nib is great for <br>drawing big letters. <br> <br>As far as books go, I'm hoping to get my hands <br>on Doyald Young's <i>Fonts &amp; Logos</i> one day <br>soon. For great examples of blackletter, you have <br>to learn German and buy Koch's <i>Die Schrift als <br>Kunstfertigkeit</i> and Julius de Goede's  <br><i>Kalligraphie mit gotischen und Frakturschriften</i> <br>\"Lehrbuch.\"  <br> <br>I'm trying to improve my Dutch as well, as so <br>many great books on type and lettering are written <br>in Dutch. It's pretty easy if you learn German <br>first. <br> <br>For blackletter <b>type</b>, nothing beats Peter Bain <br>and Paul Shaw's <i>Blackletter: Type and National <br>Identity</i>. Also indispensible is Albert Kapr's <br><i>Fraktur</i>. Kapr is in German.</p>"
