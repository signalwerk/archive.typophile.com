    html: "<p> \"The Art of Hand Lettering\" (Helm Wotzkow/Dover) is a good, rather comprehensive  book for hand-lettering, especially emphasizing proportion, spacing and color. Wotzkow also goes into some useful detail about the basic forms and structure of the various glyphs, even if getting a bit dogmatic about it. <br> <br>For someone interested in creating hand-drawn faces, a good, comprehensive type specimen book is always useful (and fun to flip through for inspiration from time to time). <br> <br>\"Encyclopaedia of Type Faces\" (Jaspert, Berry &amp; Johnson/Blandford) is a good (if flawed) one, among several others. <br> <br>\"Type: The Best in Digital Classic Text Fonts\" (Graphis) is a good specimen of 18 fonts that will probably all be seen somewhere on the \"favorite fonts\" lists due to be posted this coming weekend. It's probably more useful to digital typographers, but couldn't hurt for hand-letterers too. </p>"
