    html: <p> Calligraphic pens and brushes would be helpful, too -- and not just for calligraphy. They help a designer understand the logic behind stress (the typographic kind, anyway <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> ) and lyric movement in a design. <br> <br>A proportional scale is an invaluable tool as well. <br> <br>Grid paper is helpful as well. </p>
