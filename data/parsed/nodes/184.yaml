    html: "<p> Hi, here jacques writting. <br>you should not forget to buy strong paper. I always explained people, drawing type is a lot about knowing how to erase. What I mean by that, is that you should be afraid of erasing, but should not erase so much, that you can't recognize the drawings anymore. <br> <br>Although some people might like them, I never used moulds(is that the right word). Try get a feeling for curves by drawing them by the hand. You don't have to be able to draw them in one stroke.  <br>Sometimes when I draw, I know from the beginning the curve I started to draw will be bad. You sometimes feel and see that strokes are under- or overstreched, or that it has the wrong character. <br> <br>What might help to understand the strokes, is to do a little bit of callygraphy. <br> <br>What john said is true. There are some very gut dutch books. For example: 'de theorie van de letter, by Gerrit Noordzij'. Where he is explaining his theory of type, based on calligraphy and writting. <br> <br>Jacques </p>"
