    <p>Hi everybody, I just wanted to tap in to Typophile’s incredible ability to suggest things that I would never think of on my own.</p>
    <p>About three years ago, I initiated a complete rebranding of my very small company. Along with updated colors and logos, I selected a sans and a serif typeface to use consistently in all our material. I ended up picking FF Unit as the sans and Dolly as the serif. Both of them are excellent faces.</p>
    <p>Over time, I’ve grown more comfortable with Unit and less so with Dolly. Dolly’s tone is a little too casual, and its overall color a little bit dark.</p>
    <p>I’m looking for something contemporary that is a little monolinear, and has some character  without being too mannered, esp. at display sizes. Most of all, it needs to play well with  Unit.</p>
    <p>Currently, I’m leaning towards Chapparal. I also really liked Chronicle Text from Hoefler. Any other suggestions would be wonderful. Here is a little sample of Chapparal, too low-res to be that helpful, but it should give you a feel of the color:</p>
    <p></p><div class="imageWrap"><img src="/web/20081015211131im_/http://www.typophile.com/files/chaparral_4290.gif"></div><p></p>
