    <p>i’m at a loss... how large should i make the <a href="/wiki/ornaments" class="wiki-create">ornaments</a>? should they be <a href="/wiki/baseline" class="wiki">baseline</a> to ascender height? should they fill the <a href="/wiki/em%252Bsquare" class="wiki">em square</a>? should i make them oversized so that they are equal to 120% of the em square? Some of them are supposed to be used to build borders &amp; patterns. That’s why i think 120% may be right as that seems to be the default leading in Adobe Apps &amp; Microsoft Apps as well (but i’m not totally sure about that). Does anyone have any experience with this kind of thing and can offer advice? thnx for looking.</p>
