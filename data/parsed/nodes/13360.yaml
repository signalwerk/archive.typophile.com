    html: |-
      <p>I think a border elements should be designed to “set solid”. i.e., a 12 pt. border with 12 pt. leading should align correctly. It’s much easier than setting 12 pt. on 14.4, or 11 pt. on 13.2.</p>
      <p>Word and the like can be set to exact line spacing, and borders are more likely to be used in a DTP app, where people are less likely to use default percentage based leading. </p>
      <p>You _will_ provide all the rotations necessary to make a simple box, won’t you? Some fonts require the user to rotate elements, while the font’s EULA forbids the user from modifications...argh! And, please, don’t rely on kerning for horizontal positioning!</p>
      <p>Other ornaments, leaves and the like, just have to “look good” when set in a line with text. Of course, what “looks good” beside a uc A will look too high beside a lc a, or a smallcap A. I suppose one could make use of “case forms” in OpenType to help with that.</p>
