      <p>Just after a quick glance i feel that the downstroke of A is too heavy. The A itself could also be a bit wider. Maybe Z could be wider, too. The N looks a bit out of balance? The difference between the two counters is maybe too big. Y is too heavy on the left stroke, and the right stroke of V is too thin. Compared to M and N the tapering on the baseline of V and W is stronger. S and s lack dynamic standing inbetween other characters, for my taste (see daws, e. g.).<br>
      Go on, great work!</p>
