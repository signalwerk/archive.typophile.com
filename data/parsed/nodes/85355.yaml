      <p>"Angled to the left", sorry. :o Or, actually, more specifically, rotated to the left - to a certain extent it feels as though the whole glyph has simply been rotated a few degrees anticlockwise.</p>
      <p>Take the /A/. The slight taper on the left leg - and the lack of any other horizontal lines, and the angled right leg stroke ending - creates an optical illusion that the stroke ending of the left leg that rests on the baseline is actually angled slightly. My eye reads the axis of the letter as being the bisector of the angle formed by these two lines, as if both were angled equally in relation to the main axis. This bisector leans one or two degrees left. Extremely crude illustration of what I mean:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Angle_5499.png"></div><p></p>
    html_clean: |-
