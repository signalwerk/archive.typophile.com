    html: |-
      <p>Hi again Jasper :)</p>
      <p>There are a couple of things that strike me, but take with plenty of salt of course:</p>
      <p>G: perhaps the stem is too light?<br>
      K: Something bugs me about it, perhaps it's what Craig just said about the top arm. Or maybe I'd bring the connection a tiny bit closer to the stem.<br>
      M and W: agree with Craig.<br>
      Diagonals (UC and lc) are rather lively with all their terminals. How do they work in text?<br>
      p and q look to have descenders longer than the ascenders of b and d.<br>
      I was also going to comment about the A and a, but someone else mentioned those and it looks better now.<br>
      X and x: I'd offset the upstroke more, only because of personal preference. Cap VWX seem to me to be falling right, but that could be my eyesight!</p>
      <p>I'd love to see a pdf with the regular and black alphabets (UC and lc) compared. If you don't want to post a pdf here, I'd be happy to receive it by e-mail, if you'd like further observations.</p>
      <p>This is going to be a very interesting and attractive family.</p>
