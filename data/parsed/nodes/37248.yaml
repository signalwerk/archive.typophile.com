    html: |-
      <p><cite>I also have one of my own that legibly eliminates the bottom segment and can use the same coding as a normal display</cite></p>
      <p>Thanks cerulean - i like your approach in eliminating the bottom segment - esp. given it can be retrofit around an existing display architechture - which is of particular concern for this project as developing a new display layout with diferent segments, you need to re-program the IC chip and i think need to produce some ungodly amount like 100k units to make it worthwhile for the factory... so if we could go with an existing IC chip and just re-design the font.. that's a little easier to swallow.</p>
      <p>Certainly some good food for thought.. i wonder if a fairly geometric typeface like DIN could be modified to become a 'somewhat-respectable number-of-segments' display.. Here's an <a href="http://au.nixonnow.com/watches/mens/the-connect-A069.html" rel="nofollow">example</a> that's heavy on the segments..</p>
