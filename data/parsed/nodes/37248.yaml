    <p>I'm a product designer undertaking a project at work which will essentially be the development of a small computer interface with a basic LCD seven segment display (like a heart rate monitor, bike computer etc).</p>
    <p>In order to take the display from a boring 'sourced straight from china' watch display, I'd like to look into using a more interesting 7 segment font. I realise there are significant restrictions on segment shape etc in order to maintain readability.. just wondering if anyone had dealt with anything similar in the past?</p>
    <p>Any ideas, leads etc are most welcome...</p>
    <p>Cheers.</p>
