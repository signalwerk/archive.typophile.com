    html: |-
      <p>All text looks like <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/bindlestiff-nf/" rel="nofollow">Bindlestiff NF</a></strong> by Nick Curtis (Nick's Fonts, 2011) a revival of <strong><a class="freelinking external" href="http://www.flickr.com/photos/myfonts/7316615096/" rel="nofollow">Binder Style</a></strong> designed by Joseph Binder and released by D. Stempel AG in 1959. The |C| looks a bit modified.</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
