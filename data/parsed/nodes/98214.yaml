    <p>Hi, </p>
    <p>I am trying to ID the typeface used for the cover of Richard Price's book CLOCKERS. (The version with red type running vertically on a black background). Any help would be great. </p>
    <p>Thanks in advance</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Clockers_5277.jpg"></div><p></p>
