    html: |-
      <p>When I read the name of the show, and see the the trippy 70s headline font, here's what comes to mind:</p>
      <li>Loud, informal, fun.
      </li><li>Celebration of lowbrow, pop culture (flipping the bird to highbrow art).
      </li><li>Retro-modern (the future as seen through 20th-Century imagination).</li>
      <p>Here's the problem: It's too damn tasteful. The carefully balanced layout with elegant flourishes and double rules undermine the B-movie aesthetic you're (probably) aiming for.</p>
      <p>I'd start by throwing out the grid. Make the whole thing more crowded and busy. Be more adventurous in your choice of body type(s). Make the 2 photo images bigger, and tilt one or both of them. If I were designing this, I'd put "music by Johnny Tran" in a speech balloon coming out of the alien's mouth, but that's just me. (If you do put anything in a speech balloon, <em>don't</em> use Comic Sans!)</p>
    html_clean: |-
