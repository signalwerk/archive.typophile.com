      <p>This reminds me of the posters we used to make to promote the underground concerts in college - not a bad thing at all. </p>
      <p>A couple suggestions: Try adding a serrated edge to the end of the tape. This will make them look more scotch tape-like.</p>
      <p>Right now, it looks like it says "The Robots Art Show vs. Aliens." You'll have to play with that a bit because moving "Art Show" and bumping up "vs. Aliens" will create weird negative space issues.</p>
