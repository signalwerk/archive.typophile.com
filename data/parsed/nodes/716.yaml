  html: <p>Hi, I am new to the Typophile community, nice to meet you all! <br>I have been working on a logo for a company named AC Wireless yesterday and i would like some feedback on what you think of it. Do u like the design of the logo, any suggestions are welcome. <br>For the name of the company, i have not started on making a unique logotype for it and so i just used the fonts that are installed on my computer. What do u think of the font choices, which is the best out of the three? Should i use another font instead?   <br>Please give comments, thank you! <br><img src="http://www.typophile.com/forums/messages/29/13287.jpg" alt="Here is the logo design with type"></p>
