    html: "<p>I like the fact that you are using one color. But are you certain you always want to have the text reversed?? Also, try to give the logo a bit more character, a little less generic. It really reminds me of a pair of old airwalks I had circa 1989 (the enclosed \"A\" logo, not to be confused with airwalk's shoestring man). <br>I geuss what Im trying to say is, I want to see the logo and have a sense of technology, or mobility, or freedom (wireless).  <br>Can you explain why you are using the encircled A? What factors about the company, or their product, or the feelings their products gives you when you use them led you to arrive at this conclusion-- <br>Communicate to me why I should use that company too. Right now: mashed potato sandwich.   <br> <br>and say no to hash</p>"
