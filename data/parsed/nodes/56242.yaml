    <p>Barbieri is a casual sans type family, based on a German lettering style from the 1960s. The original hand-drawn alphabet was used in a rather peculiar edition of Der Barbier von Bagdad, an opera composed by Peter Cornelius. Our efforts to identify the cover designer have been, so far, unsuccessful. As fans of informal typography and popular lettering styles, we thought these few thin letters deserved a re-incarnation as a complete type family. Andrés Torresi and Marta Sánchez Marco were in charge of the production work.</p>
    <p>Now Barbieri has 6 weights suitable for packaging, posters, and music covers. It resembles a certain ‘Americana’ spirit, though with a Germanic twist.</p>
    <p><a href="http://www.re-type.com/fonts/barbieri.html" title="http://www.re-type.com/fonts/barbieri.html">http://www.re-type.com/fonts/barbieri.html</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/barbieri-newsletter2_5871.gif"></div><p></p>
