      <p>I agree with Jared's comments. And it's certainly not necessary to say negative things about their work, you could just say "another candidate fit our needs better".</p>
      <p>But on the other hand, when I was just out of college several interviewers gave me some friendly advice about my portfolio and I found it very helpful.</p>
      <p>&gt; there's a job out there for designers of all levels of sophistication</p>
      <p>So true. I've known unsophisticated designers who made a nice living doing supermarket flyers, newspaper ads, and other work that didn't require much finesse. One of them makes more money than I do.</p>
