      <p>That link is priceless, Nick! Much like a lot of the work that was rejected in it :)</p>
      <p>We're totally on the same page, Jared. I'm trying to find the balance between sounding curt and wasting my time giving thoughtful feedback to strangers. The responses I give are along the lines of your examples, but they also generate a lot of follow-ups asking for clarification. And <em>that's</em> where I get hung up. </p>
      <p>I thought I had hit a good phrasing the other day -- "Keep developing your skills, and stay up to date with the standards and trends of the industry through blogs, publications, and professional groups" -- but it didn't go over so well. Using it twice, I got one snarky response that accused me of not actually looking at his portfolio since I didn't give specific feedback, while the other decided it was an invitation to turn this exchange into an in-depth portfolio review to get specific feedback. This is when I start to wonder, do I just tell them their work looks unrefined? That the multi-colored papyrus on their resume shows a poor taste level (true story)? I thought my response was sound, fair advice, so maybe it's just the best I can hope for.</p>
