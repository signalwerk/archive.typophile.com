      <p>In my experience, there's a job out there for designers of all levels of sophistication. If an applicant's work is not at the quality levels that you expect at your organization, there's nothing wrong with letting them know that "it's not a good match" or "not what we're looking for."  I've met many designers who didn't make it through our process who have gone on to great jobs and fulfillment elsewhere.</p>
      <p>If you had all the time in the world, you could sit with each applicant and coach them through how they could improve their work. In my heart of hearts, I often feel the same way. But who truly has that kind of time? If you found a junior designer you believed in and exhibited other desirable qualities (cultural fit, proactiveness, humility, eager to learn/grow) that in-depth coaching might make better sense if they were employed with you. </p>
      <p>If your workday is anything like mine, time is precious and almost always at a deficit. Unfortunately, you may have to ask yourself: Is providing feedback to applicants the best use of my time?</p>
