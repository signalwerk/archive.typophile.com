      <p>Hi EC</p>
      <p>Hmmm seems like you might be in a bit of a fix not asking them before. Now your problem is gonna be that you've spent a certain amount of time where you might price yourself to let's say 100$ an hour (don't really know what the level of the hourly rate is in the US) and the client only sees the small item (logo and businesscard) and not all the work behind it. Whatever you tell them is probably gonna sound expensive to them while if you would inform them before the job started they might have checked around and found that your price was actually quite cheap.</p>
      <p>How many hours did you spend?<br>
      Did you finance the printing up front or did they pay for that directly?</p>
      <p>On a general level I would price a logo and bc job in the vicinity of 3.000$ - 10.000$ depending on the expectations from the client, how bad I wanted the job from a creative point of view and the financial situation of the client.<br>
      Prices in Norway are aprox 150$ an hour with a semi-large design firm and about 75$ if you are a freelancer. </p>
      <p>Logo development can run much higher than what's stated above but then there might be a lot of strategic development involved to define target groups, what best will appeal to this group etc. etc. We normally work in this way and our latest Identity job is  around 100.000$ which only includes development up to approved logo. Implementation comes as a seperate project with it's own budget after that.</p>
      <p>Check which hourly rate you should charge with Aiga. They would probably know the level in your neck of the woods.</p>
      <p>Hope I cleared up some of your questions.?<br>
      I hope I cleared up some questions</p>
