      <p>Yikes. That sounds like a situation where you're doing a job for someone primarily as a favor and any payment you receive will be more of a token gesture. If you didn't discuss pricing, then I don't see why they wouldn't have assumed it was mostly a favor.</p>
      <p>If you think they're willing to pay "realistic" rates, figure out how many hours you worked and multiply it by $35 / 45 / 55... If they're a friend of the family and would feel shocked and a little taken advantage of for paying more than $300 for something as "simple" as a logo, send them an invoice for $200 and chalk it up to a learning experience.</p>
      <p>Going forward, <a href="http://www.amazon.com/Graphic-Artists-Guild-Handbook-Guidelines/dp/0932102115" rel="nofollow">The Pricing and Ethical Guidlines Handbook</a> is always a good starting place to get ballpark estimates.</p>
      <p>Though a lot of people feel you should never lower your rates, when I was just starting out it seemed unreasonable to charge someone for every hour I worked on a project - since I was just learning it seemed like I might put 20 hours into something that a more experienced designer could churn out in 10 or less. I think that, early on, when you're trying to build a portfolio, it's ok to put $5000 of work into a design that you're only getting paid $1000 for. At the end of the project you've got something representative of the type of work you'd LIKE to be doing, and something you can show of to clients who can actually pay what you want to earn.</p>
      <p>Don't make a habit of it... it's not sustainable or good business, but once or twice isn't bad (IMO).</p>
