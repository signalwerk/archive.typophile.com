      <p>great topic, I work for a London agency and am charged out at £80 an hour.  My boss always top loads the quotes for a job as he reckons that after 12 years in the industry its the only way to make money from design, so for example there would be 4 days for a logo design then only 1 hour for its application to each piece of media, eg. business cards, compliment slips etc... </p>
      <p>This way the client is less likely to back out in the later stages as they have already put the majority of the money in.  Also if they do get cold feet in the later stage, you do not loose out as much.</p>
      <p>Personally with my own brand identity freelance projects I charge out at 3 days work @ 9hours a day for a selection of logos which is stage 1. (5-7 different logos)</p>
      <p>Stage 2: Shows the application of 2 of the logos throughout their literature in different colours and 1 revision. 1 days work @ 9hours a day charged.</p>
      <p>Is this a good way to do it, am I loosing out?  I am only charging £15 an hour for my most recent job as its a sweet project and I am still an undergrad on placement.</p>
