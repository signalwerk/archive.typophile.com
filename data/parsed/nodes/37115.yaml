      <p>EC, I see you've already received plenty of good advice here... </p>
      <p>One thing I would add is, besides naming your figure up front, never, ever, begin work on something before you've received 1/3 of your fee, especially when dealing with a new client you know nothing about... You have no idea how many horrible situations you will avoid by doing this... and it helps to weed out clients who don't really value design or your work, or who don't take a business transaction seriously. This shows them you mean business, and lets you start working without fear of getting completely burned. Also: have a kill fee figured out beforehand as well, in case a client cancels a job halfway through.</p>
      <p>Can I recommend a few books I own or have read?</p>
      <p><em>Talent Is Not Enough</em>, by Shel Perkins</p>
      <p><em>Starting Your Career as a Freelance Illustrator or Graphic Designer</em>, by Michael Fleishman</p>
      <p><em>The Designers' Commonsense Business Book</em>, by Barbara Ganim</p>
      <p>There are more "business of design" books recommended here:</p>
      <p><a href="http://www.graphicdesignforum.com/forum/showthread.php?t=28133" title="http://www.graphicdesignforum.com/forum/showthread.php?t=28133">http://www.graphicdesignforum.com/forum/showthread.php?t=28133</a></p>
      <p>Good luck!</p>
