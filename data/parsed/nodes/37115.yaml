      <p>Did the original person get their question answered?</p>
      <p>Aside from all the numbers people are throwing out, I would say that if you are feeling uncomfortable about where things are going, just be honest. Ask if you can put the project on hold till you work out some kind of agreement on payment.</p>
      <p>You can do things differently next time. But for now, if you keep giving it for free, they may be expecting it for free. You might<br>
      become resentful. Or they may be planning to pay you but without you knowing, you may not approach the work with the best mental state.</p>
      <p>Say that you should have addressed a fee up front but didn't. You can admit that dealing with aquaintances is a bit awkward. But that now that the project has been going on for quite a bit, you'd like to establish some parameters. (It's better for everyone by the way).</p>
      <p>Establish what the final deliverable is (logos in various formats, etc), how many rounds of revisions are included in the base fee, and of course the fee.</p>
      <p>If they don't want to pay, at least you have your answer.</p>
      <p>I might disagree with the person who suggested you lose quite a bit early on. I would say that a lower hourly rate is what you get for being new. The client shouldn't pay as much for someone who doesn't have much experience troubleshooting, or with solving sophisticated problems, etc. But I think you should charge for your time spent (unless there is a specific learning curve like a software program or something). As you gain more experience, your hourly rate goes up.</p>
      <p>I know someone who said no good logo can be done in fewer than 40 hours. Not sure I would say that exactly. Depends on if you are doing a thorough company analysis, audience study, etc. But if you figure at least a time+materials rate and maybe add on a percentage (the value-added fee the person spoke of which covers the fact that they are using this over and over for years), that should do it.</p>
      <p>Good luck.</p>
