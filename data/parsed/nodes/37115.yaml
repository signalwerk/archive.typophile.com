    html: <p>I think logos are some of the hardest most time consuming thing I do. Don't underestimate your time spent especially if it's a good mark that you can stand by. Don't forget the the value of a logo either. A good mark should last 5-10 years? If they use it that long think about the price divided out over time. They'll probably want to plaster it everywhere too. So in my opinion it's the best bang you can get for your buck when paying for a design. A flyer may be used once or twice, but a logo will be used for a long time.</p>
