  html: <p>I’m a new member of this forum, and I'm a new graphic designer in the field as well. Can someone PLEASE HELP ME pricing my designs? I know it can vary...a lot but I don't even know where to start. I have designed a logo to a company and their Business cards but I have no clue how much to change them. PLEASE HELP!</p>
