      <p>Pricing is a rather simple equation:</p>
      <p>(Annual Salary you want + All expenses) / # BILLABLE hours you can or want to work in a year = your hourly rate.</p>
      <p>(Your hourly rate * # hours it takes to make the logo) + expenses + 'added value markup'= what you charge the client.</p>
      <p>You NEED to figure your hourly rate to even find a baseline to see if you are making an actual living at doing this. A lot of new designers completely fail to fully figure in their hourly rate. Design firms don't charge $100 an hour so they can get rich, but rather to eek out a living. ;0)</p>
      <p>Bottom line is to be sure to figure out all the above to know what your absolutely bottom-line price can be. For me, it was in the $65/hr range...anything less than that wouldn't be worth my time. I then charge more than that to hit my 'worth my time' rate.</p>
      <p>And note that the $65 rate I figured has no bearing on what you should charge. We likely live in different parts of the globe with different economies and different clients and different personal preferences and different skill sets, etc. </p>
      <p>And one last tip...don't underestimate your expenses and don't overestimate your billable hours. Few freelancers are likely going to be billable more than 20-25 hours in a week. A (sane, IMHO...though there are plenty of insane ones) full time employee for a large design firm won't be billable more than 30-34 hours a week.</p>
