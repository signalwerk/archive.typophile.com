      <p>You may like the ‘More fonts like this’ feature at <a href="http://new.myfonts.com/fonts/bitstream/handel-gothic/?refby=mfde" rel="nofollow">MyFonts.com</a>. You can also examine the tags that were assigned to Handel Gothic. Note that you can <a href="http://new.myfonts.com/search/tag%3Afuturistic+tag%3Awide+tag%3Asans-serif/fonts/?refby=mfde" rel="nofollow">combine several tags</a> in a search.</p>
      <p>Furthermore, there are lists that feature stylistically similar typefaces, like <a href="http://bowfinprintworks.com/BauhausFaces5.html" rel="nofollow">Mike Yanega’s Bauhaus-Style Guide</a> or <a href="http://www.fontshop.com/fontlist/genres/star_trek/" rel="nofollow">FontShop’s Star Trek FontList</a>.</p>
      <p>Another way that often is promising: search Typophile for terms like ‘<a href="typophile.com/node similar Handel" rel="nofollow">similar to Handel</a>’.</p>
