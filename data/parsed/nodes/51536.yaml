    html: |-
      <p>Could it be because the font size is relatively big compared to the line height? This is how Helvetica 18pt with line height 15pt looks (Word 2008 on a Mac, but I think it's the same on Windows). It's only a screen issue; it looks fine in print.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Malmoe-Skaane_5720.png"></div><p></p>
