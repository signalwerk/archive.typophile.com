    html: <p>My memory was playing tricks on me. I see, now that I checked, that ordinary Times 327 was sloped by 16 degrees, and Times 569 was sloped by 12 degrees. So I suppose a slope of 8 degrees or less is what I would really like to see for Ritalics. Perhaps 5 to 7 degrees.</p>
