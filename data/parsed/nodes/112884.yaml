      <p>What hrant said. For carthography you needed many different visual text styles to represent cities, areas, states, rivers, seas, … and using a “reversed italic” just was a way to achieve this. </p>
      <p>Also popular beside Venus:<br>
      Römisch: <a href="http://www.typografie.info/3/page/Schriften/fonts.html/_/roemisch">http://www.typografie.info/3/page/Schriften/fonts.html/_/roemisch</a><br>
      Kursivschrift: <a href="http://www.typografie.info/3/page/Schriften/fonts.html/_/kursivschrift-r166">http://www.typografie.info/3/page/Schriften/fonts.html/_/kursivschrift-r166</a></p>
      <p>In copy texts, I can’t think of a specific purpose of such fonts. They are occasionally used for purely stylistic reasons.</p>
