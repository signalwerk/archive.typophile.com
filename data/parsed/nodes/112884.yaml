    <p>I'm writing to you because I'd like to know the use or the meaning of reversed italic—left-sided italic—inside a paragraph?<br>
    I invite you to observe the case of the 1907 German Sans Serif <em>Venus Linkskursiv</em>.<br><a href="http://www.fonts.com/font/linotype/venus/linkskursiv">http://www.fonts.com/font/linotype/venus/linkskursiv</a><br>
    Thanks in advance for your inputs.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/VenusLinkskursiv.gif" width="432" height="288" alt="">
