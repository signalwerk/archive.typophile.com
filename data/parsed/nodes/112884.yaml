      <p>I'm of the opinion that for Hebrew, at least, italics should indeed slope in the opposite direction.</p>
      <p>I wasn't aware of the use of reversed italics to indicate rivers. Using them to indicate sarcasm is an interesting idea, but it's just useful to have another way to indicate emphasis.</p>
      <p>The thought has struck me that it might be a good thing if reversed italics for the Roman alphabet were sloped by a significantly smaller angle (say by 15 degrees or so) than normal italics. That would avoid them being mistaken for normal italics at a quick glance. Also, that would be useful to avoid clashing with how the letters are structured, and to allow them to be a slanted roman instead of a semi-script-like new set of characters like true italics. (And having them a slanted roman again differentiates them from normal italics in a second way.)</p>
    html_clean: |-
