      <p>The only "mainstream" use of Ritalic (I didn't just make up that term :-) I've heard of is for denoting rivers on maps. Related to that, I think lettering on boats, planes, etc. can benefit from it.</p>
      <p>That said, I do feel there's more unexplored potential for Ritalic, especially concerning mixing with Semitic scripts (which go leftward).</p>
      <p>hhp</p>
