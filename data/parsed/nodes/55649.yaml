    <p>I'm in the marketing department of a large company, and we recently adopted a new logo. The logo is mostly text in a fairly obscure font. </p>
    <p>I deal with vendors who produce promotional items and non-standard communication pieces (logo in stitching, etc). </p>
    <p>Even though I'm sending them the logo in vector format, with the font outlined, I often get back proofs where they reset the type into whatever looks most similar to them. </p>
    <p>How can I avoid this? What's the correct explanation to give to make sure they reproduce the logo exactly, and not try to mimic it? It seems obvious to me (after all, they wouldn't try to mimic an image-based logo, would they?), but this happens so often, that I must not be explaining it well. </p>
    <p>Any help is appreciated.</p>
