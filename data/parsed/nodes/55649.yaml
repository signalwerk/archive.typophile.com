      <p>"How can I avoid this?"</p>
      <p>You can't. Most vendors are type ignorant.</p>
      <p>You can solve it by sending it back with the invoice unpaid.</p>
      <p>My parents have a small business that I whipped up a quick logo for. They spent several thousand dollars on a new sign laser-cut out of metal for the front of the building. I prep'ed the files, outlined the typefaces, spec'd everything out and sent the file out.</p>
      <p>A month or so later my proud parents asked me to come look at the great new sign.</p>
      <p>"Umm...that's not the logo I sent them."</p>
      <p>"It's not?"</p>
      <p>"No, that's a completely different typeface"</p>
      <p>"Oh, well, no one can tell. Looks good to us!"</p>
      <p>"sigh"</p>
