      <p>Not to say this is the problem with this particular vendor (which sounds more like incompetence and/or negligence), but:</p>
      <p>The software and drivers for many of these specialized output devices have rather antiquated format filters, or when updates are available they are too expensive to be purchased as often as a service provider would want. The software I use for a vinyl cutting plotter, for example, requires I downsample vector files to Illustrator 8 format for them to work properly. Other devices may have different needs, so press as hard as you can on the issue of file format compatibility, including version numbers where applicable. Ask them what software they use in their shop, again, down to version number and OS.</p>
    html_clean: |-
