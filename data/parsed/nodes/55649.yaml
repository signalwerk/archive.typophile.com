    html: |-
      <p>I experienced that before.<br>
      The printer couldn't open my illustrator file<br>
      and just decided it would be easier to recreate<br>
      the logo rather than asking me to save it down<br>
      to his illustrator 5 version.</p>
      <p>I think the best way for something like this is<br>
      to ring up your vendor and ask for the file<br>
      specs and what exactly is required for the<br>
      job. Sometimes you need to investigate a bit<br>
      more than just sending a vector file.</p>
      <p>Different processes require different files.<br>
      Some stitching companies prefer a tiff file<br>
      to a vector file, because the software used<br>
      for stitching patterns works with pixel-based images.<br>
      But by saying that, an other stitching company<br>
      might be fine with your vector art.</p>
      <p>ring and investigate...</p>
