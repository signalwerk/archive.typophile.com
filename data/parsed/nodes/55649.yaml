      <p>I worked for a company (who shall remain nameless) and when we'd send out our logo, we'd attach this corporate "warning": </p>
      <p>The guidelines are as follows:<br>
      1. The only acceptable presentation of ********* logo is as it<br>
      appears here. Presentations with elements missing are not acceptable. Presentations that change the order of the elements are not acceptable.</p>
      <p>2. Wherever possible, The LOGO should appear in ****(your color: PMS<br>
      XXXc), and the words *****(whatever) should appear in black, on a white or light-colored background. In grayscale presentations, the entire logo should be 100 percent black (do not present portions of the logo as grayscale). In reverse-out presentations (white text on a black background) the entire logo should be in white.</p>
      <p>3. Do not kern, stretch or compress the text, present it in alternate<br>
      colors, or in different typefaces. There is no acceptable or approved reason to vary our identity.</p>
      <p>4. The logo must be followed with a small (R) registered trademark<br>
      dingbat, superscripted to the "***" in "*******".</p>
      <p>These guidelines are non-negotiable. It is vitally important for us to use our logo in a unified manner, both for legal reasons (the protection of our trademark) and for cultural reasons (so people identify with one logo alone).</p>
