      <p>Difficult task.</p>
      <p>You may ask them the reason, but here are my two cents: they are doing this because it is easier for them (safer, faster or more convenient) to type the name of the company instead of placing an image.</p>
      <p>And what if you generate a font with only one glyph: your logo? Maybe it would be even easier for them to type only one letter and change the font.</p>
      <p>Of course, it may work only if your logo is supposed to be black and white. Otherwise, you may obtain the right logo, but wrong colors.</p>
