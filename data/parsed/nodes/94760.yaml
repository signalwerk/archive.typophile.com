    date: 2012-07-16T14:01:00
    date_raw: 16 Jul 2012 — 2:01pm
    votes: null
    html: <p>There are several ways in which this could be approached, but the easiest way for your purposes and the mostly widely supported at this time, would be to a) create mirrored glyphs in the font and b) use the 'calt' layout feature to contextually substitute them when not followed by another letter glyph.</p>
