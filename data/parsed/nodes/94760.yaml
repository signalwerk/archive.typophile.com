      <p>Would the .fina feature be totally inappropriate for this?</p>
      <p>(Entirely possible, because I recall some threads where attempts were made to make .init, .isol, .medi and .fina work with Latin fonts, and some software doesn't properly handle these four for non-Arabic glyphs. Well, that's what I recall, at least.)</p>
