  html: |-
    <p>I was wondering is there a way to mirror an glyph in Open Type font?</p>
    <p>For example, if I type word:</p>
    <p><strong>RemarK</strong></p>
    <p>And <strong>K</strong> as a last glyph, could it be mirrored on some way automatically?</p>
