  html: "<p>as one of the 2005 editors for my university's student magazine (officially it's a newspaper, but the design, footprint, and publication schedule make it feel more like a magazine), i'm in charge of (re)designing the masthead. <br> <br>this has been giving me grief and headaches for days now. i've got a few (half-finished/half-baked) ideas (the edges are very rough, stray points here and there): <br> <br><a href=\"http://www.somnambulist.org/crap/vertigoideas.gif\">low-res gif</a> <br> <br><a href=\"http://www.somnambulist.org/crap/vertigoideas.pdf\">...and the pdf</a> <br> <br>- i quite like the top one, but i worry about legibility. <br>- the r and t in the second one feel unresolved. and the o hangs off the edge. <br>- i've been staring at these for too long now. my brain's broken -- any feedback appreciated. <br> <br>some afterthoughts/background info: <br>these seem a bit 'techy', maybe? the magazine's always had a sort of 'grungy/street' feel to it (which i would like to keep, but not as an overarching/exclusive visual theme) - it's a fairly low budget, politicised/lefty magazine, distributed for free in stands on and around campus)</p>"
  html_clean: "<p>as one of the 2005 editors for my university's student magazine (officially it's a newspaper, but the design, footprint, and publication schedule make it feel more like a magazine), i'm in charge of (re)designing the masthead. <br> <br>this has been giving me grief and headaches for days now. i've got a few (half-finished/half-baked) ideas (the edges are very rough, stray points here and there): <br> <br><a href=\"http://www.somnambulist.org/crap/vertigoideas.gif\" class=\"link-external\">low-res gif</a> <br> <br><a href=\"http://www.somnambulist.org/crap/vertigoideas.pdf\" class=\"link-external\">...and the pdf</a> <br> <br>- i quite like the top one, but i worry about legibility. <br>- the r and t in the second one feel unresolved. and the o hangs off the edge. <br>- i've been staring at these for too long now. my brain's broken -- any feedback appreciated. <br> <br>some afterthoughts/background info: <br>these seem a bit 'techy', maybe? the magazine's always had a sort of 'grungy/street' feel to it (which i would like to keep, but not as an overarching/exclusive visual theme) - it's a fairly low budget, politicised/lefty magazine, distributed for free in stands on and around campus)</p>"
