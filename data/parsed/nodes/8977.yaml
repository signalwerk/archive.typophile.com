    html: "<p>Frankly, I like the direction. It's less 'tech' to me and more 'funky, so bad it's hip-retro' it's more 'low-tech' to me because it feels self-consciously dated. I don't know if it's appropriate, but it's interesting. The rest of the mag would have to keep up with it, tho. <br> <br>I like #3, since the implied connection between the descenders could hold date/issue/subhead info in it. The 'g' doesn't read right away. It reads a bit like 'vertieo' at first glance, but you might get around that by making the upper-left curve of the bowl into a corner. <br> <br>Perhaps some distressing or faux-wear will make it feel more suited to the publication.</p>"
