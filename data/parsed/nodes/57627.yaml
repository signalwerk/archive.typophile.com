      <p>Hello from Trek,</p>
      <p>As previously asserted here on Typophile, the Trek wordmark is custom typography. It was designed by Joe Sutter, formerly of Milwaukee's Hanson Dodge + Sutter, who found inspiration in the classic Honda logotype. Having worked on the identity for our new world cup mountain bike team, I can confirm that <em>WORLD RACING</em> is indeed set in Herb Lubalin's Avant Garde Gothic—<a href="http://www.fontshop.com/fonts/downloads/itc/itc_avant_garde_gothic_by_adobe_std_book/" rel="nofollow">ITC Avant Garde Gothic Std Book</a> to be more specific.</p>
      <p>Ken</p>
