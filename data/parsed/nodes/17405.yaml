  html: |-
    <p>I’m working with a number of editors who are using Microsoft Word to write their articles. Because they’re not particularly savvy, these editors use the “<a href="/wiki/faux%252Bformating" class="wiki-create">faux</a>” bold and italic buttons regularly, instead of changing the typeface to the correct italic or bold variant. Regardless of your opinion on this poor practice, it hasn’t proved a problem because InDesign had the smarts to convert faux italics into real italics when the Word docs are imported, making the necessary substitutions automatically.  Or so I thought.</p>
    <p>We’ve just changed our primary text typeface and InDesign now ignores the “faux” formatting on import. The text appears a straight roman with no bold or italic. I can only imagine that this is an issue with the new font we are using because this is the only variable that has changed — that perhaps the designer missed a step when generating the font files or that there’s a requisite box defining a particular weight as the default bold? I’m talking about in Fontographer or FontLab. Both the old font and the new font are Type 1, so it’s not an OpenType thing.</p>
    <p>I’d like to go back to the type designer armed with some suggestion for a fix. (Because I’m making the assumption that the fix needs to be made to the font.) The client has already signed off on the typeface, so simply changing the font isn’t an option, and there are enough italics and bolds set that I’d rather not go back and change them all by hand. Can you help?</p>
