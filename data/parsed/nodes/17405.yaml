    date: 2006-01-19T10:42:00
    date_raw: 19.Jan.2006 10.42am
    votes: null
    html: <p>It sounds like the font is not set up with reg/bold/italic/bold italic linkings. I believe this is the only way that InDesign would know which font to use for bold or italic when it imports the Word doc. It has been common practice for some foundries to set up each font in a family as its own separate one-font family in order to overcome Windows/Mac name compatibility issues. Perhaps this is the case with the new fonts?</p>
