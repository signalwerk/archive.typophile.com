    html: <p>Hmmmm. I have now tried out Transtype. But there's a new problem now... I have converted the fonts and gotten a whole long list of files (.afm .inf .pfb .pfm). I can see that all these fonts are actually located on my computer. BUT, apparently ATM cannot. It only shows 4 out of 20.  <br> <br>Argh!</p>
  - id: 32588
    user: 571
    date: 2004-04-23T23:16:00
    date_raw: 23 Apr 2004 — 11:16pm
    votes: null
    html: <p>Magnus <br> <br>Well, should you not be getting "a whole long list of file"? Those four as opposed to the normal two with a Mac (plus the optional AFM)? <br> <br>You do have to be a bit careful with batch conversion, especially if you are converting from format to format rather than just platform to platform. Font "families" are treated a bit differently in the differing formats/platforms and can get botched if generated within the orginal folder. PC fonts have a number restriction (as I recall, four). I usually generate from PCTT to Mac PS1 and I will generally configure PCTT multiple fonts separately, rather than run them in batch mode, because of this problem. Doubt this makes much sense. <br> <br>If you have the software program Font Doctor, that can often help you resolve conflicts. <br> <br>Gerald</p>
  - id: 32589
    user: 3408
    date: 2004-04-24T13:37:00
    date_raw: 24 Apr 2004 — 1:37pm
    votes: null
    html: "<p>Thanks, Gerald but as you said yourself. It doesn't make too much sense to me. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> A little maybe. <br> <br>Should I convert each weight separately? <br>I don't know. But I have found that if I put the all the files into the windows/fonts folder instead of using ATM, it actually works. ?!?!?!?! Crazy. If it was just one fontfamily that did this I guess I could live with it but I see it happening to others as well. It's a real drag with that windows/font folder. It very easily becomes a huge mess of font files.  <br> <br>BTW:  <br>Gerald&gt;&gt;&gt; \"Well, should you not be getting \"a whole long list of file\"? Those four as opposed to the normal two with a Mac (plus the optional AFM)?\" <br> <br>Yes I know. For instance: I have 1 font I convert it, I get 4 files. Yup that's right. <br> <br>The font I'm trying to convert is Berthold Akzidenz Grotesk and as you probably know it has a lot of weights. And that's 4 files for each weight in windows. The problem is that ATM doesn't \"recognize\" all of these files as being fonts or pehaps more likely it assumes that a lot of them are the same. Because it only shows four weights. This has been bugging me for quite some time now. Frustrating. <br> <br>I will try and see what this Font Doctor is about  if I can get my hands on a demo or something. <br> <br>thanks <br> <br>Magnus</p>"
  - id: 32590
    user: 571
