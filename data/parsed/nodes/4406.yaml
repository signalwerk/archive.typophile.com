    html: <p>Magnus <br> <br>A bit clearer to me now. Yes, you are correct regarding the weights. A problem is that the name of either the printer font or screen font could be replicated in the conversion process and hence deleted. Or it is assigning the same name. I think you are only allowed the regular, italic, bold, bold italic unless you create separate fonts/folders.  <br> <br>If you are trying to generate the various weights you many need to rename the primary font, or some of the weights, to avoid this. Or this could be a FOND ID problem. One of the great things about FontDoctor (maybe the only really great thing) is that it will change the ID for you and assign unique numbers. Your system may be recognizing a duplicated ID number, and consequently ignoring the second or third instance of it. <br> <br>I'm not a PC guy (well, not since about 1990) so I'm just making some assumptions here. <br> <br>Gerald</p>
