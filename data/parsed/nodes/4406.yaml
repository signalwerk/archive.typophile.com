    html: <p>Magnus <br> <br>Fontographer and FontLab's TransType will do the proper job if you configure the incoming and outgoing encoding correctly. <br> <br>I prefer Fontographer when I need a bit more information about a font (FOG is very specific in providing encoding particulars) and TransType when I need to do more generic batch conversions. <br> <br>Gerald</p>
