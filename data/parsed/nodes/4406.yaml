    html: <p>This looks like an encoding problem - it seems to me that it is doing the conversion exactly backwards, since, for example, slot 230 is Ecircumflex on the Mac and ae on Windows. I have never seen Crossfont, but if it has options for you to specify the original encoding and the final encoding, try swapping them. <br> <br>Otherwise, if you'd like a free tool, I am sure <a href="http://fontforge.sourceforge.net/">FontForge</a> can do the job. <br></p>
  - id: 32585
