    html: <p>This may be based on <a href="http://www.myfonts.com/fonts/linotype/itc-elan/elan-bold/">Elan Bold</a> or <a href="http://www.fonts.com/findfonts/detail.asp?pid=204524">Memo Medium</a>. The ‘R’ and ‘S’ make me think Elan is a better choice, but the ‘A’ looks closer to Memo. A lot of tweaking was done to the letters though (the ‘P’ may be based on a ‘D’, &amp;c.) <br><br> -&nbsp;Lex</p>
    html_clean: <p>This may be based on <a href="http://www.myfonts.com/fonts/linotype/itc-elan/elan-bold/" class="link-external">Elan Bold</a> or <a href="http://www.fonts.com/findfonts/detail.asp?pid=204524" class="link-external">Memo Medium</a>. The ‘R’ and ‘S’ make me think Elan is a better choice, but the ‘A’ looks closer to Memo. A lot of tweaking was done to the letters though (the ‘P’ may be based on a ‘D’, &amp;c.) <br><br> -&nbsp;Lex</p>
