      <p><em>Regarding, “about your client who has no taste” and liberating husbands “from the protective shield of idiocy”: my client has taste, just not good taste; and, his force field reference was related to protecting marriage. That’s not idiocy, is it?</em></p>
      <p>Sorry!  Sarcasm and irony often read poorly in written form.  You ought not take me so seriously, particularly on the "client who has no taste" part.  Tongue was firmly inserted in cheek when I typed that.</p>
      <p>On the count of the outside ellipse representing the protection of marriage, while the association may exist in the mind of your client, I doubt very much that the average viewer would wind up with that idea unless it were explained to him or her.  I don't have anything against "protecting marriage," (as a married guy, it is not a completely alien concern to me), I just don't buy that those ellipses are so essential to the logo that if they were missing that concept would be lost completely.</p>
      <p>As concerns these latest treatments:</p>
      <ul>
      <li>The top one doesn't work as well as the bottom two.</li>
      <li>The color of outside curves in the middle one lends more of a superhero feel to it.  They're no longer as blade-like.  I like it.</li>
      <li>The middle one is a good compromise if your client won't budge on the outside ellipse element.</li>
      <li>The bottom one loses the sense of motion that the top two have, although I think Chris's suggestion may address that.  Still, I like the bottom one better than the top one.</li>
      </ul>
      <p>--<br>
      Nick Hladek</p>
