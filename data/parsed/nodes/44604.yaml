      <p>Thank you all for your comments. Unfortunately, I was hesitant to post much more info, due to NDA, but I have clearance from my client to be a little more forthcoming. Perhaps some of this info will pacify some of this critique (or maybe not).</p>
      <p>The business is titled *[Business name removed by request] and has very much of an "average Joe with hero inside" approach. HH will provide monthly emails of pre-planned romantic ideas and reminders that enable husbands to easily sweep their wives off their feet ... and, yes, it's sad but true that "such a service is actually required" for some of us. Really, it's more of a helpful resource than a requirement.</p>
      <p>Early in our process, we pushed the super hero direction pretty far, and later in the process we explored a series of these chest emblem type of designs. That is why this may look a bit sporty, and I may have understated the appeal to our masculine audience. At this point, we won't be heading in a different conceptual direction, but my client (though satisfied with the logo, as is) is open to some minor tweaking. Also, I presented several color choices that included reds (for romance), but so far, none have been accepted. Most of my original color options offered a male/female two-tone color combo. My client really likes blues and blue/gray combos. (I'm presenting to a very masculine Harvard grad ... but we've come a long way from this project's inception)</p>
      <p>Thanks again for your comments ... I'd love to hear more.</p>
      <p>Aloha,<br>
      Scott</p>
