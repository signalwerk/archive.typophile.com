    <p>Aloha! I've been away for awhile, but I'm looking for some refining eyes today. Below is a representation of where I've arrived with my client after several alternative directions being pursued and rejected. I have identified (framed) the design that my client has selected from our elliptical choices. Aside from the obvious need to smooth some curves, please help me identify any other problem areas and offer up any color suggestions. The top two options are colors that I presented, while the bottom two are client requested variatinos. Thank you in advance for your assistance ...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HH_Logo_3674.jpg"></div><p></p>
    <p>FYI: The business provides a service aimed at helping a husband by digitally delivering romantic ideas to strengthen their relationship with their wife. The mark must cross gender lines, but may be more heavily weighted toward the masculine side.</p>
    <p>Mahalo,<br>
    Scott</p>
