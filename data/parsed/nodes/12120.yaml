      <p>I think that part of it is that posts to the Critique section aren't showing up on the front page yet, and people are just coming back to the site.</p>
      <p>As for a critique of the face, it depends on your goals. It is too rough and unfinished for display sizes, but it works better at "book" sizes. It seems to be in the vein of 20s and 30s Eastern European faces like Preissing, Antykwa Torunska, among others. If that is the direction you want to go, you're on track. The lc g calls too much attention to itself, and the lc e isn't quite happy either. The axis is basically vertical, so I see no reason for the crossbar to be slanted.</p>
