    <p>I'm hoping for some serious input on what to do with this face I've been working on. The italic is maybe half finished, the roman is 99% done. Or are they? And is it any good? Be honest, is it rough, irregular, derivative, bland, uninspired, brilliant, not terrible, pretty good, ... I'm to close to the forms to judge them objectively and I would really appreciate some no-holds-barred feedback. So here are the first 5 chapters of "<a href="http://www.grodworks.com/temp/Book.pdf" rel="nofollow">Three Men in a Boat</a>" it prints nicely on postscript laser printers at 1200x1200 dpi, and OK on everyday office printers. The cover image and layout is temporary, btw.<br>
    In addition to the book weight I'm working on a semi-expanded family with a full range of weights. <a href="http://www.grodworks.com/temp/various.pdf" rel="nofollow">Sample</a></p>
