      <p>I assume you mean the baseline… line.<br>
      In my view, it was the Romans, in a break from Ancient Greece (who generally preferred a centerline “around” which the letters would float), who standardized the double lines (baseline and cap-height) within which everything (except the ideologically vestigal “Q”) must fit, snell!</p>
      <p>hhp</p>
