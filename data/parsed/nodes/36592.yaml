    html: <p>To my knowledge <em>Baby Teeth</em> and <em>Pluto Outline</em> never were digitized. <em>Block</em> can be found <a href="https://web.archive.org/web/20141114075814/http://www.myfonts.com/fonts/berthold/block-be/" rel="nofollow">here</a>. <em>Cable Heavy</em> is a rip-off of Kabel, I don't know if it is the <a href="https://web.archive.org/web/20141114075814/http://www.fontshop.com/fonts/downloads/linotype/kabel_std_ot_virtual/" rel="nofollow">ATF</a> or the <a href="https://web.archive.org/web/20141114075814/http://www.fontshop.com/fonts/downloads/itc/itc_kabel/" rel="nofollow">ITC</a> version you need. And I've never heard of <em>Playboy Ultra</em>, although Googling it produces some... errr... interesting hits. :^P</p>
