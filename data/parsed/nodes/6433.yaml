  html: <p>The book dedicated to the Helmut Salden's work is just great. It's in dutch, but 90% of it are good reproductions of his works. So, if you want to see one of the higher expressions of lettering and dustjacket design, just get it. <br> <br>   <br><a href="http://www.010publishers.nl/cataloque/design.php?id=435&amp;page=1" target="_blank">http://www.010publishers.nl/cataloque/design.php?id=435&amp;page=1</a> <br> <br>Cheers.</p>
  html_clean: <p>The book dedicated to the Helmut Salden's work is just great. It's in dutch, but 90% of it are good reproductions of his works. So, if you want to see one of the higher expressions of lettering and dustjacket design, just get it. <br> <br>   <br><a href="http://www.010publishers.nl/cataloque/design.php?id=435&amp;page=1" target="_blank" class="link-external">http://www.010publishers.nl/cataloque/design.php?id=435&amp;page=1</a> <br> <br>Cheers.</p>
