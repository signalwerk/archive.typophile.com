      <p>&gt; I think I’m going to make Naxia regular more<br>
      &gt; upright to set it apart from the italic more</p>
      <p>What does the Italic look like? Because the Roman's slant is gentle, so a typical italic won't have any problem standing out. Plus keeping the slant in the Regular is a nice way of differentiating from the Latin.</p>
      <p>&gt; I’m not sure they fit really well with<br>
      &gt; either the lowercase Greek or the Latin.</p>
      <p>Well there's a severe limit to how much formal harmony the UC and lc can have. If you force it too much one or the other case stops working.</p>
      <p>&gt; comments and suggestions about the Latin portion of Naxia?</p>
      <p>The difficulty is that intelligent comments would have to take the Greek into account. My own lack of expertise in Greek means I can only comment reliably on the Latin out of that context... but here goes:</p>
      <p>The descenders are a bit too long for a text face.</p>
      <p>The "e", "g" and "x" could be a hair wider.</p>
      <p>The "v", "w" and "x" could used more activity.</p>
      <p>Your spacing is too loose for the ideal target size<br>
      indicated by the vertical proportions and color.</p>
      <p>hhp</p>
