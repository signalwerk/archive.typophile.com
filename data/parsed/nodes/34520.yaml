      <p>The Greek lowercase already looks jumpy enough to my eyes, but for a different reason than the innate character of Greek script--incline angle inconsistency. I think I'll concentrate on tempering it somewhat by maintaining the same minute optical incline throughout.</p>
      <p>As for the non-descending eta, that's the form I prefer in my own handwriting. That goes for all the lowercase Greek forms I chose as defaults (it would be silly to extend that to the capitals, e.g. the Omega which I usually write as an O with an underline). </p>
      <p>The enlargement of the alpha of Apollonia Hrant posted on the Greek ductus thread was indeed fresh on my mind when I drew my alpha. But I had not noticed the non-descending eta in the small sample of Apollonia on the Cannibal website (eta occurs just once there). I see now that the etas are more prominent in the Apollonia Polytonic sample, which I had missed before.</p>
      <p>The non-descending eta in Apollonia doesn't surprise me, as it is common in contemporary Greek designs, as one can easily check browsing through the Cannibal website's samples.</p>
      <p>As for why <em>I</em> personally use the non-descending eta... I don't know. My Greek hand was strongly influenced by the handwritten Greek I was exposed to when my family lived in Greece, and most of those had non-descending etas, as did a lot of typefaces I saw in use around me.</p>
      <p>Perhaps, subconsciously, the eta with a descender bothers me because none of the other vowels have descenders. Then again, a descender might help to differentiate it from pi in some handwriting... Well, if I ever finish and release this a couple of years down the line, then I'll decide which form of eta to put as the default.</p>
      <p><em>If that’s the first time you’ve drawn Greek letters, it’s very impressive!</em></p>
      <p>Thanks, Thomas. It means a lot coming from someone who has designed the beautiful Greek of Hypatia Sans. But I've drawn Greek letters before, though this is the first I've put up for critique. One set of Greek letters I've drawn would surely draw Hrant's wrath for its latinized forms. :)</p>
