    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123042243im_/http://typophile.com/files/Naxia01_sample_5787.gif"></div><p></p>
    <p>I caught <a href="https://web.archive.org/web/20150123042243/http://typophile.com/node/33869" rel="nofollow">this thread on the Greek ductus</a> a couple of weeks ago, and was inspired to sit down and draw letters to test out my idea of what a Greek text face could look like. I'm building it into a typeface I'm calling Naxia, and I would like your criticism, comments, and suggestions.</p>
    <p>I wanted to recreate the rhythm of the classic Greek typefaces like Didot's with a modern edge. The lowercase letters are slightly inclined, but close enough to being upright to harmonize with the uppercase letters and to differentiate them from the not-yet-presentable italic. The letterforms are based on my handwriting, and alternate forms are provided for certain characters.</p>
    <p>There is no real underlying logic in the patterns of stress other than doing what seems natural for each individual letter to serve the rhythm as a whole. The angles of stress are all over the place. I sliced off the ends of thicker strokes to create sharp angles rather than the rounded terminals seen in similar designs. This becomes a design feature that adds a subtle sparkle to the page.</p>
    <p>Lacking nativity in Greek, I have no idea how much of this works if at all for native Hellenophones. So I would really appreciate help from Greeks especially. How acceptable would this attempt be? Could this work as a serious text face?</p>
    <p>As for the Latin alphabet which was added afterwards, it's quite close to some of my previous unpublished designs, but it also takes some subtle design cues from the Greek. I haven't really spent enough time on the uppercase letters for both alphabets, so there's some stroke width issues going on among other things. Not to mention that all the spacing is preliminary and there is no kerning yet.</p>
    <p>In short: long, long ways to go. Comments, please!</p>
