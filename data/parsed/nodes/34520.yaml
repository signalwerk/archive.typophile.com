      <p>Good choice of specimen text, Brian. 'Ιθάκη' is one of my favourite poems. I don't know the Dalven translation, though, only the classic Keeley &amp; Sherrard. But setting it as monotonic is cheating. :)</p>
      <p>There are some lovely shapes in Naxia, but I think you have too much going on in the Greek: too many flairs and bent strokes, going in all sorts of directions, and this -- combined with the variable ductus -- is what is making the text jumpy. The individual letters have beautiful features, but they are not setting well together. I think you are going to need to rein the design in considerably. The good news is that it is easier to rein in an overly fanciful design than it is to inject life into a dull one.</p>
      <p>As a general rule of thumb, I'd say that the more inconsistent the ductus, the more tightly constrained other elements of the design need to be, because that basic inconsistency is already pulling at the texture of the text, threatening to unravel it. If you regularise the ductus, then you can afford more elaboration in other areas, which is how something as amazingly elaborate as a page of Garamond or Granjon's heavily ligatured text holds together so well: the traditional Byzantine ductus provides a consistent foundation for the fanciful forms.</p>
      <p>Some specific comments:</p>
      <p>The upper left portion in the rho, sigma and final sigma is weak, and causes the letters to fall to the right. This is particularly bad in the sigma. This is a very common problem when one first starts making Greek letters. This area needs to be pushed out more.</p>
      <p>The top of the final sigma is too long and too straight: it is confusable with the stigma ligature.</p>
      <p>The bowl of the uppercase Phi should be wider but shorter, i.e. there should be more stem above and below the bowl, and compensation in the width to keep the counters nicely open and balanced.</p>
      <p>If you make the part of the uppercase psi that crosses the vertical stem squarer, you can open the counters a bit more. At the moment, this letter looks a bit cramped.</p>
      <p>Your uppercase tonos accents are too close to the letters. They need a bit more room to breathe.</p>
