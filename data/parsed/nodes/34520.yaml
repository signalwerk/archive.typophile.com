      <p>Thanks for your detailed comments, John. I have made some adjustments since I posted this and started work on an italic, with a more regular ductus, but I haven't done any work on this for the last few weeks as I have entered a busy stretch at work.</p>
      <p>I think I'm going to make Naxia regular more upright to set it apart from the italic more, making the adjustments John suggested in the lowercase rho, sigma, and final sigma (good point about the final sigma being confusable with the stigma). I will also open up the counters more. I see John's point about reining in the design. I had some fun exploring the idea of 'What if Greek mimicked the look of being written with the sharpness of broad nibbed pens, only crazier with more flair?', but yes, the letters need to work together more. </p>
      <p>I am quite dissatisfied with the uppercase I have so far. I'm not sure they fit really well with either the lowercase Greek or the Latin. They feel perhaps too narrow overall. And maybe I should make at least the Greek capitals lighter.</p>
      <p>I hope to get back to work on this soon. In the meantime, for the rest of the typophiles, are there any comments and suggestions about the Latin portion of Naxia?</p>
