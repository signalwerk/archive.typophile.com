      <p>Brian, I don't think you need to make the Greek much more regularly upright, at least not so far as vertical strokes are concerned. As Hrant notes, the slant is very gentle, and will be more reduced once you modifiy the rho, sigma and final sigma, and probably straighten the leg of the mu somewhat (it certainly shouldn't slant outward more than the descender of the gamma, and often curls inward following more the descender of the rho). Most of the apparent slant comes from misapplied weight, rather than from the actual slope of verticals. The raised left side of the pi and tau, for instance, contribute more to the apparent slant than the angle of the legs.</p>
      <p>If you are interested in experiments writing Greek with a broadnib pen, including a variety of approaches to ductus, try to find a copy of Epictetus' stoic aphorisms published as <em>Virtue and Happiness</em> by Shambala. The Greek texts are expressively written by Claude Mediavilla. I don't always agree with his choice for individual letters, and I'm not sure, overall, that the calligraphy reflects the meaning of the texts, which are pretty sober. But it is worth taking a look at, and there's a lot of beauty in it.</p>
