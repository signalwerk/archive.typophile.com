  html: |-
    <p>I've been translating/editing a lot of articles recently, mostly about art history (some Renaissance, some 19th century art). I'll also be working on a webjournal/academic journal for my art history department soon.</p>
    <p>For articles I've been using Latex because I find it simpler to type along, but of course I'll consider using InDesign for the journal (or whatever they have available at the university, but I'm afraid I'll have work with opensource/free software, or else with my personal computer).</p>
    <p>After fiddling with fonts, I have decided to go with Kepler, perhaps with Sanvito for titles/sections/title pages.</p>
    <p>I'm no professional typesetter, but since I'm going to be working with publishing, I decidedly want something decent, not html/word formatting done by someone who lacks any awareness of type.</p>
    <p>So, do the examples attached look "decent" enough? (In terms of type choice, margins, figure placement, etc.)</p>
    <p>Any comments would be much appreciated.</p>
