      <p><em>I've change figures to old style and captions to sans-serif -- should I apply sans-serif to old style figures, too?</em></p>
      <p>No. It's not crucial to have old style figures in your sans serif captions.<br>
      But it does make a difference to extended serif body copy.</p>
