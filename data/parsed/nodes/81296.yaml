      <p>@dunwich type, @frank: I agree the lines were too long; I tried to decrease the character number per line with Latex but it didn't work out as expected (some 2-3 characters less, plus lots of empty upper and outer margin space).</p>
      <p>I decided to try out editing the whole thing in Word 2010 (took some time) to see how it would look like, and the result seemed very straightforward and acceptable -- althought I added space between paragraphs and used Myriad as a sans-serif.</p>
      <p>@eliason: I hadn't paid attention yet to how images would fit when printed or photocopied, but your observation makes sense. There must be an obvious difference between home-made printing and books/magazines I hadn't noticed -- I always see images extending beyond the text margin. </p>
      <p>Anyway, I made a new document just in case (I just hope I didn't screw it up and made it worse). You can find it <a class="freelinking external" href="http://dl.dropbox.com/u/23970121/Da%20monera%20ao%20homem.pdf" rel="nofollow">here</a> if you want to take a look.</p>
