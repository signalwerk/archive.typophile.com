      <p></p><div class="imageWrap"><img src="http://typophile.com/files/lint_14_6508.gif"></div><br>
      Here is an early draft. This one is a degenerative version, where parts of the counters and ascenders and descenders have been removed. The letter "l" disappears altogether and distinctions between "n" and "h" and "b", "d", "p" and "q" are unclear. This is something I am working on to fix. Also you can see that it is not strictly a counter form typeface as some features such as the dot on "i" and "j" remains.<p></p>
