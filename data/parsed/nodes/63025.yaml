    <p>Hi all,<br>
    I'm a newbie here, and I hope to generate some discussion and get some feedback on my masters project while I'm here :)</p>
    <p>I'm developing a typeface based on the counter forms of letter shapes, in order to test the ability of readers to recognise these first as alphabetic forms, and secondly their ability to decipher and read them. I am not interested in creating a highly readable typeface for common use but rather in testing the readers ability to decipher new letter-shapes based on a subconscious familiarity with the counter-forms.</p>
    <p>The typeface is close to the testing phase and I want to create an interview or questionnaire in order to test these theories. I have ideas about how this questionnaire should be constructed but I would really benefit from some specific examples of legibility tests. Although there are alot of references to legibility tests out there I'm having trouble finding actual examples of these tests.</p>
    <p>If anyone can provide advice on where to find such test examples it would be greatly appreciated!</p>
    <p>Thanks in advance<br>
    Kate</p>
