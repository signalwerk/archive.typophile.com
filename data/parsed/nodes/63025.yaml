      <p><cite>There’s a very fundamental flaw here:</cite><br>
      Artistic license? I am aware of this however I have made the decision to work with the inner counters only as much as possible. The font is still in development so I hope to deal with some of the legibility issues...</p>
      <p><cite>things that just happened<br>
      like lint.</cite></p>
      <p>Indeed, you are correct! Its from a Richard Brautigan poem from which the fonts name was decided.<br>
      Heres the whole thing:</p>
      <p><strong> lint </strong></p>
      <p>I‘m haunted a little this evening by feelings that have no vocabulary and events that should be explained in dimensions of lint rather than words. I‘ve been examining half scraps of my childhood. they are pieces of distant life that have no form or meaning. they are things that just happened like lint.</p>
      <p>By Richard Brautigan</p>
      <p>I found it quite apt.</p>
