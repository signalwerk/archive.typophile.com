    html: |-
      <p>Usually, whenever you see a typeface on the web that is not a font installed on most operating systems, it's displayed as an image. The easiest way to tell if it's an image is to try to select the text. If you can, it's a font that you have on your machine, and not an "embedded bitmap". If you can't, it's an image. (There are a few rare exceptions, such as sIFR, that Dan mentioned.)</p>
      <p>This is the case with Unibody on the Underware page. Take the "NEW" icon, for example. The type is set in an app like Photoshop, output as a GIF and displayed on the page as an image. The rest of the text on that page is set in Verdana, as indicated in the <a href="http://www.underware.nl/site2/underwarebasic.css" rel="nofollow">site's CSS</a>. </p>
      <p>Still not seeing the vllg.com bitmap. Can you tell us exactly which words you're seeing in this font?</p>
