    html: <p>Yes, there is something there, isn't there?  The bottom of the element is raised off the baseline, same with the b and d, and the corresponding element on the p and q are set below x height.  I didn't know if it could really work, but then someone posted about Serif Gothic and I noticed that it did it as well.</p>
