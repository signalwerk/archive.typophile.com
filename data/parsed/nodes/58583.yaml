  html: |-
    <p>Hey there.. I'm looking for the typeface<br>
    used on the album cover to 'All my friends are dead'.</p>
    <p>Another example of a similar style I'm looking for is on the book cover to 'The Heart Keeper'.</p>
    <p>I havn't yet been able to find either in my academy's library.</p>
    <p> I don't know if there are many free typefaces like this but anything in the right direction would be appreciated!</p>
    <p>Thanks, O</p>
