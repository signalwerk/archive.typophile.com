      <p>Thanks, those are some good places to start. I admit I know shamefully little about script fonts. I'm liking <a href="http://new.myfonts.com/fonts/hubertjocham/susa/" rel="nofollow">Susa</a>, never seen that before. More in such a direction (maybe a hint less soft) would be muchly welcome.</p>
      <p><cite>"If it’s for a logotype, why not just freely drawing it by hand –?"</cite><br>
      I <em>might</em> end up needing/wanting to use the same font for multiple headings; so I'd prefer to first look for a font-based solution to give me that flexibility.</p>
      <p><cite>"very special requirements, indeed!"</cite><br>
      Thanks to Florian Hardwig for pointing out that script fonts sometimes do come with locally-specific alternates. The thing is, such local conventions can very quickly instill a local flavor that may or may not be appropriate. For instance when I see, say, <a href="http://new.myfonts.com/fonts/flat-it/ht-maison/" rel="nofollow">HT Maison</a>, which might otherwise be quite a nice match, its "e" immediately makes it feel «foreign» to me. But on the other hand, such modifications of single letters would certainly be within a doable scope.</p>
