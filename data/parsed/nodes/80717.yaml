      <p>The Five W method is helpful to give a structured explaination : </p>
      <p>¶ Who is it about?<br>
      It's about communication &amp; typography</p>
      <p>¶ What happened (what's the story)?<br>
      There is a lot of type classifications (Thibaudeau, Vox-ATyPi, Alessandrini) but they most focus on the look of the typefaces rather than on the use of the typefaces. Erik Spiekermann in “Stop Stealing Sheeps” raises the question of a classification of type according to their purpose (cf. Jean-François Porchez, “On type classifications”, Gazette, Typofonderie, March 10th 2011)<br>
      In the same time, I had an opportunity to re-read the Jakobson scheme. Roman Jokobson is a American linguist, he studied the language according to six functions :<br>
      § The Referential Function<br>
      corresponds to the factor of Context and describes a situation, object or mental state. The descriptive statements of the referential function can consist of both definite descriptions and deictic words, e.g. "The autumn leaves have all fallen now."<br>
      § The Expressive (alternatively called "emotive" or "affective") Function<br>
      relates to the Addresser and is best exemplified by interjections and other sound changes that do not alter the denotative meaning of an utterance but do add information about the Addresser's (speaker's) internal state, e.g. "Wow, what a view!"<br>
      § The Conative Function<br>
      engages the Addressee directly and is best illustrated by vocatives and imperatives, e.g. "Tom! Come inside and eat!"<br>
      § The Poetic Function<br>
      focuses on "the message for its own sake"[3] and is the operative function in poetry as well as slogans.<br>
      § The Phatic Function<br>
      is language for the sake of interaction and is therefore associated with the Contact factor. The Phatic Function can be observed in greetings and casual discussions of the weather, particularly with strangers.<br>
      § The Metalingual (alternatively called "metalinguistic" or "reflexive") Function<br>
      is the use of language (what Jakobson calls "Code") to discuss or describe itself.<br>
      (see: <a href="http://en.wikipedia.org/wiki/Jakobson%27s_functions_of_language" title="http://en.wikipedia.org/wiki/Jakobson%27s_functions_of_language">http://en.wikipedia.org/wiki/Jakobson%27s_functions_of_language</a>)<br>
      So I decided to mix Jakobson with "Erix" (Erik S.) hence "Jax"</p>
      <p>¶ Where did it take place?<br>
      It took place in France, because, in there, we love speculative/abstracts studies.</p>
      <p>¶ When did it take place?<br>
      It took place in 2011, because, from time to time, a type classification appears.</p>
      <p>¶ Why did it happen?<br>
      It happened because I wasn't satisfied with my reflexions about type licencing. So I wanted to go further : what's a typeface is for and in which case, people have to use it willingly or unwillingly.</p>
      <p>¶¶ So what?<br>
      Nothing, such a type classification is pointless from a "graphic design"/"visual" point of view.<br>
      But it could be useful to explain what typography means as a communication tool.</p>
      <p>¶¶ Some examples, just to be more concrete?<br>
      Yeah of course :<br>
      - as a piece of art (A), a typeface is sometime expressive as such: e.g. a calligraphic typeface, a decorative titling typeface --- Zapfino, History, PF Champion<br>
      - as a branding tool (B1), a typeface carries the message<br>
      - as a default typeface (B2), a typeface is used in a word processor, in Gmail or in instant messaging application --- any preinstalled typeface, like Times New Roman or Arial for instance<br>
      - as a full-featured workhorse design (B3), a typeface could be used for a book, a magazine, a website, etc. --- most commercial typefaces<br>
      - for core applications, terminal, display, programming (C), a typeface is a interface --- courier, fixedsys, ms sans serif</p>
      <p>¶¶ Is there, however, a connection between function &amp; aesthetics/licencing aspects</p>
      <p>Yeah, possibly:<br>
      A | calligraphics | copyright/copyleft | on-demand, self-made<br>
      B1 | all classes | copyright | on-demand<br>
      B2 | transitionnal, modern | copyright/copyleft | pre-paid<br>
      B3 | all classes | copyright/copyleft | on-demand, pre-paid<br>
      C | mechanistics | copyright/copyleft | pre-paid</p>
