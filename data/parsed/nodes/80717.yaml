      <p>@quadibloc : you've got it! :-)</p>
      <p>Bodoni and Albertus belong to B3 category, because they are often used for publishing.</p>
      <p>The C-class (code) is specific to programmers (context of use: text editor, emacs, vi, etc. --- in that specific context, type conveys information, nothing more ; to a certain extent, writing as a novelist is a kind of coding, and many writers appreciate typefaces like courier, especially if you use distraction-free text editors)</p>
