  - id: 458505
    user: 50554
    date: 2011-04-03T10:24:00
    date_raw: 3 Apr 2011 — 10:24am
    votes: null
    html: |-
      <p>Seeing the distinction between "message", "contact", and "public", I would have put Courier in the "Message" category - I'm still vague on what "Code" should mean. If it means simply a way to express the symbols of the alphabet without much subtext, that <em>can</em> apply to Caslon or Helvetica in the right context.</p>
      <p>So what I'm seeing here is:</p>
      <p>Expression: Script and display typefaces - where the style of printing is intended to convey some type of "feeling". Comic Sans and Papyrus would go here too, along with Hobo, with the fonts that look like candy or balloons - but also much more respectable ones, Zapf Chancery being an example.</p>
      <p>Message: This also seems to be a "display" category to a limited extent. Franklin Gothic seems to be what goes here - typefaces that are bold, but otherwise relatively plain.</p>
      <p>Contact: If Times New Roman, then Century Expanded and Caledonia. I think Helvetica will sometimes be used in this mode, even if Helvetica Medium, normally used for signage, goes under "Message". These are utilitarian typefaces, used for ordinary communication - often, without much thought being put into the choice, by people who are not typographers. Courier can go here some of the time too.</p>
      <p>Public: If Caslon and Garamond - then this is where traditional classic typefaces are used for things like the "visual identity" of a prestigious college. This is where a typeface is formal and elegant - without verging into script or display.</p>
      <p>While the use of a typeface more clearly corresponds to one of these categories, one can also classify typefaces - although this classification is fluid - by their dominant use. Caslon was once firmly in the "contact" category in its heyday.</p>
      <p>I'm not quite sure where to fit Bodoni or Albertus here, though...</p>
