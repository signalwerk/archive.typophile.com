    html: |-
      <p>Hi, </p>
      <p>I'm glad you love the word "globomunication" ;-)</p>
      <p>Some examples, sure :<br>
      - expression : zapf chancery, zapfino, bickham script, and so on any typeface expressing a feeling in first place<br>
      - message : gotham when used for obama campaign, helvetica, din<br>
      - contact : arial widely used in e-mail applications, times new roman widely used in everyday life<br>
      - public : garamond widely used in publishing, baskerville and caslon as well<br>
      - code : courier is the best example, as a core system fonts in most of OSes</p>
      <p>I apply the classification to the fonts themselves, because, somehow, form is related to use. For instance, courier could hardly be a typeface for expression. Helvetica and Arial are very close, but do not belong to the same category, because the context and the people who are using them are different.</p>
      <p>M. a. a. n., I didn't know the abbreviation, so thanks you for giving me an opportunity to improve my english ;-)<br>
      Jax is possibly "maan" for type designers, but it could be useful for "the rest of us" in order to make understand what typefaces &amp; typography actually is nowadays in the real life. Out there, most people use typefaces but do not see them ; they cannot distinguish every subtle forms but context of use is meaningful for them.</p>
