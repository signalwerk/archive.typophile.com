    <p>I know there are more than one flavour of Garamond. I found a PDF with an embedded Garamond (or at least that what Illustrator told me it was looking for when I opened it) in it. I dont think this is Garamond at all, but am still wondering what it is.</p>
    <p>Can anyone identify this one?</p>
    <p>Thanks</p>
