    html: |-
      <p>OK, so after more digging, it turns out this is a substitute font that is a hidden part of the PDF system, and is used when the original font is not embedded. However...</p>
      <p>Is there a font that is similar to it? It’s not too bad, and I quite like the forms! (there, I admit it!)</p>
