    html: |-
      <p>I find it efficient to use Scanfont on tif images, save the result as a vfb then open in Fontlab where I can see a shadow outline of the tif behind the nodes. For all but key nodes where a sharp connection is obviously needed -- crotches and corners --I convert everything to curves and smooth connections. If I'm having problems I reconvert the curves to lines and then back to curves with smooth connections at the non corner and non vertex segments. [I'm probably now as clear as mud.]  I then delete as many of these nodes as possible by an incremental process until my vector outline is a fair approximation of the shadow. I find that the automated features of Fontlab to simplify are generally more trouble than doing it by hand. Add new sharp points as required. I then copy this outline to a clean glyph space and resize to my final font specs, e.g. caps height 700.<br>
      I then begin the refining of the design. Straightforward for a sans or standard Roman, incredible amount of work for something like a scanned Morris design! The objective is always to produce a glyph with the minimum number of nodes that will be a good representation of the original design. Too many and the font will be a slow or unworkable kluge. Easier said than done, particularly when time is not unlimited.<br>
      BTW the process works better by careful choice in the size of the tif image. Too large generates too many unnecessary points. Too small produces loss of accuracy in representing the outline. With practice its possible to find a relatively sweet spot.<br>
      As in all such comments, your mileage may vary.<br>
      BTW I use an ancient version of Scanfont, but it still gets the job done.<br>
      Don</p>
