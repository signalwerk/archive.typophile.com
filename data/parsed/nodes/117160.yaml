      <p>I am interested in Scanfont, as I can really see it as a great help, however on my mac (OSX Lion) it is no longer compatible, except with a rather questionable workaround. Otherwise I would have certainly tried the demo version in combination with typetool. </p>
      <p>It is a shame that typetool is not a standalone application, which is compatible with newer macs, otherwise it would be a no-brainer. I could buy typetool+scanfont as a reduced package, but I don't really want to invest in another fonteditor if it does not offer a significant plus in features. It seems better to work with illustrator and glyphs for the moment (even if Illustrator's handling of bezier curves really annoys me) and wait and see what the fontlab people come up with in the next few years with a promising, completely redesigned code-base. I have tried Transtype 4, and if this is anything to go by, it will be a massive improvement!</p>
