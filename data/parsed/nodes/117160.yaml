      <blockquote><p>I am interested in Scanfont, as I can really see it as a great help, however on my mac (OSX Lion) it is no longer compatible, except with a rather questionable workaround. Otherwise I would have certainly tried the demo version in combination with type tool.</p></blockquote>
      <p>The WINE wrapper for ScanFont on the latest Macs is much faster than ScanFont running native on Snow Leopard. The only "workaround" is you have to save the results to a .vfb file rather than have the vfb open in FL. Not such a bad thing. That said, I keep a Mac laptop running Snow Leopard just so I can use the ScanFont in its original incarnation when I have more than one or two things to import.</p>
      <p>Many of the tracing settings available in ScanFont have been in Fontlab for years. The last item in the Preferences is "Trace Options" and you can auto trace a background using: Tools/Background/Trace.</p>
