  html: "<p>Karmaflage is a dingbat containing three different types of ornament to be used for making decorative camouflage patterns. <br> <br>On the underlying idea, Kenn says: 'I'm fascinated by camouflage as decoration, It has some interesting aesthetic qualities. I'm taking these aesthetics further by basing Karmaflage on ornaments. That way the camouflage becomes the complete opposite of what camouflage is all about.' <br> <br>The dingbat system is free and can be downloaded for Mac and PC at <a href=\"http://www.kennmunk.com\" target=\"_blank\">http://www.kennmunk.com</a> <br> <br>The Karmaflage pattern was originally made for a couple of toy designs, the launch is timed with the release of the first of these, the 'Trexi' by Playimaginative of Singapore. Later the dingbat was expanded to contain other ornamental details.  <br> <br>Elements from Karmaflage can also be seen on Kenn's own line of toys; 'Antlor - The Deer Departed' paper kits. (<a href=\"http://www.antlor.net\" target=\"_blank\">http://www.antlor.net</a>)</p>"
