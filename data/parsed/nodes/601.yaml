    html: <p><i>It's interesting that letters that [normally] fit in the x-height follow the x-height, but those with extenders have their x-heights reduced. ... The only exception is "o...</i> <br> <br>I think the key may be that all the enclosed counters are roughly the same size. We're used to the <i>e</i> and <i>o</i> being the same height, but the guiding principle in this banner seems to be that the enclosed counter of the two letters should be visually balanced.</p>
