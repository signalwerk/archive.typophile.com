    html: "<p>&gt; 22 of the 28 arabic letters have 4 variants <br> <br>And the remaining 6 only have two: they don't join on the left (leading) side no matter where they are in a word. Also: Arabic has no caps. <br> <br>David's example #1 probably has linguistic validity, but it might confuse some people: those two are actually different letters. <br> <br>And in example #2, the \"lone\" (more conventionally called \"independent\") form of the letter yaa' (the first letter in \"yawm\"/day) is missing the two lower dots. <br> <br>&gt; short vowles are not written <br> <br>Yes, that's an important distinction: <i>long</i> vowels are very much written. Also, short vowels are also written out in texts meant for learning to read Arabic, as well as when they're required to clear up a serious ambiguity (rare). <br> <br>The feature of Arabic that you can dump part of the script when it's no longer needed* is enviable - although in the West it's usually portrayed as a negative. Another positive feature of Arabic that tends to be distorted into a negative is that it appears \"too small\" on the body, while in reality it's simple using the Cartesian space differently than Latin, in fact more efficiently in terms of readability (but not legibility). Latin is great for posters. Which makes sense when you consider that its [most relevant] origins are in large public inscriptions. <br> <br>* Note that Arabic can do this only because it's a consonantal language - you couldn't apply the exact same system to an Indo-European language. <br> <br>&gt; in ISAREL YOU HAVE TO STUDY ENGLISH, ARABIC, FRENCH <br> <br>Unless I'm mistaked, you don't really <i>have</i> to study French, and I'd be suprised if Arabic was really required either. In comparison, in Lebanon (where both Arabic and French are official languages), if you're Armenian, you end up with a requirement of 4 languages! That's because when it comes to English, you do practically <i>have</i> to learn it pretty much anywhere!  :-/ <br> <br>BTW, I'm pretty sure Chris was talking about <i>my</i> images*, especially since you hadn't been able to show us yours when he made that remark! But it's interesting that Chris seemed too busy feeling offended to realize it was just a misunderstanding. I'm just happy there's no land at stake... <br> <br>* BTW, Chris, I don't think the \"non-Farsi\" example is nice at all, it's the \"non-Urdu\" one that I find stellar. <br> <br>-- <br> <br>&gt; the guiding principle in this banner seems to be that the enclosed counter of the two letters should be visually balanced. <br> <br>Interesting observation. <br> <br>-- <br> <br>&gt; One would assume that if they had studied English, their writing would be better <br> <br>But there's no definite point where you either know it or not, it's a continuum. Examples: <br>1) The people who made Yakout (the first Simplified Arabic typeface*) knew the Arabic script very well, but they still managed to deface it. <br>2) Calligraphers consider people like me (with lousy handwriting) insufficiently educated in the making of letters. <br>So it's a question of context. <br> <br>* <a href=\"http://www.microsoft.com/typography/links/news.asp?NID=2930\" target=\"_blank\">http://www.microsoft.com/typography/links/news.asp?NID=2930</a> <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; 22 of the 28 arabic letters have 4 variants <br> <br>And the remaining 6 only have two: they don't join on the left (leading) side no matter where they are in a word. Also: Arabic has no caps. <br> <br>David's example #1 probably has linguistic validity, but it might confuse some people: those two are actually different letters. <br> <br>And in example #2, the \"lone\" (more conventionally called \"independent\") form of the letter yaa' (the first letter in \"yawm\"/day) is missing the two lower dots. <br> <br>&gt; short vowles are not written <br> <br>Yes, that's an important distinction: <i>long</i> vowels are very much written. Also, short vowels are also written out in texts meant for learning to read Arabic, as well as when they're required to clear up a serious ambiguity (rare). <br> <br>The feature of Arabic that you can dump part of the script when it's no longer needed* is enviable - although in the West it's usually portrayed as a negative. Another positive feature of Arabic that tends to be distorted into a negative is that it appears \"too small\" on the body, while in reality it's simple using the Cartesian space differently than Latin, in fact more efficiently in terms of readability (but not legibility). Latin is great for posters. Which makes sense when you consider that its [most relevant] origins are in large public inscriptions. <br> <br>* Note that Arabic can do this only because it's a consonantal language - you couldn't apply the exact same system to an Indo-European language. <br> <br>&gt; in ISAREL YOU HAVE TO STUDY ENGLISH, ARABIC, FRENCH <br> <br>Unless I'm mistaked, you don't really <i>have</i> to study French, and I'd be suprised if Arabic was really required either. In comparison, in Lebanon (where both Arabic and French are official languages), if you're Armenian, you end up with a requirement of 4 languages! That's because when it comes to English, you do practically <i>have</i> to learn it pretty much anywhere!  :-/ <br> <br>BTW, I'm pretty sure Chris was talking about <i>my</i> images*, especially since you hadn't been able to show us yours when he made that remark! But it's interesting that Chris seemed too busy feeling offended to realize it was just a misunderstanding. I'm just happy there's no land at stake... <br> <br>* BTW, Chris, I don't think the \"non-Farsi\" example is nice at all, it's the \"non-Urdu\" one that I find stellar. <br> <br>-- <br> <br>&gt; the guiding principle in this banner seems to be that the enclosed counter of the two letters should be visually balanced. <br> <br>Interesting observation. <br> <br>-- <br> <br>&gt; One would assume that if they had studied English, their writing would be better <br> <br>But there's no definite point where you either know it or not, it's a continuum. Examples: <br>1) The people who made Yakout (the first Simplified Arabic typeface*) knew the Arabic script very well, but they still managed to deface it. <br>2) Calligraphers consider people like me (with lousy handwriting) insufficiently educated in the making of letters. <br>So it's a question of context. <br> <br>* <a href=\"http://www.microsoft.com/typography/links/news.asp?NID=2930\" target=\"_blank\" class=\"link-external\">http://www.microsoft.com/typography/links/news.asp?NID=2930</a> <br> <br>hhp <br></p>"
