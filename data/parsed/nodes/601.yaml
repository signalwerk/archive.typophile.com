  - id: 4358
    user: 1250
    date: 2003-07-13T10:42:00
    date_raw: 13.Jul.2003 10.42am
    votes: null
    html: "<p>&gt; Was it assumed to be natural proportion based <br>&gt; on the proportions found in Farsi script? <br> <br>I think that must be it. It's not sloppiness, since the Farsi lettering is very well done (assuming the same person did both), and since it really is pretty consistent (only one errant \"el\" and one errant \"y\"). <br> <br>It's interesting that letters that [normally] fit in the x-height follow the x-height, but those with extenders have their x-heights reduced. Kinda like Fleischmann... :-) The only exception is \"o\", and that might be the influence of the \"sekoon\": a small circular floating mark in the Arabic script, used to denote the absense of a [short] vowel. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; Was it assumed to be natural proportion based <br>&gt; on the proportions found in Farsi script? <br> <br>I think that must be it. It's not sloppiness, since the Farsi lettering is very well done (assuming the same person did both), and since it really is pretty consistent (only one errant \"el\" and one errant \"y\"). <br> <br>It's interesting that letters that [normally] fit in the x-height follow the x-height, but those with extenders have their x-heights reduced. Kinda like Fleischmann... :-) The only exception is \"o\", and that might be the influence of the \"sekoon\": a small circular floating mark in the Arabic script, used to denote the absense of a [short] vowel. <br> <br>hhp <br></p>"
