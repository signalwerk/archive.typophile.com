    html: <p>The lettering on the second banner IS beautiful, but I'm more fascinated by the vertical proportion variances you pointed out on the first sample. Why do you think this was done? Was it assumed to be  natural proportion based on the proportions found in Farsi script? Ir was it simply decorative? <br> <br>I turn specifically back to Hrant as one of our resident experts in non-Latin letterforms (or, now, "non-non-Latin" letterforms.... <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> ) <br> <br>Everyone else is encouraged to post, too. ;) <br> <br>David</p>
