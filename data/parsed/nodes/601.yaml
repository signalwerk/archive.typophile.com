    html: '<p>22 of the 28 arabic letters have 4 variants: <br> <br>a. first letter in a word <br>b. inside the word <br>c. standing alone. <br>d. last letter in a word - joining to the letter in front. <br> <br>when you write - you will connect letters; and the shapes of the letters will change - to adjust to the writing of other letters. <br> <br>and just fast sample: <br> <br>sample 1 - arabic has to "h". the left - stressed. the right - normal. <br> <br>sample 2 - "day" . this word is made out of three letters  ya, waw, mim. (but in english you will say : a day. in arabic - short vowles are not written. </p>'
    html_clean: '<p>22 of the 28 arabic letters have 4 variants: <br> <br>a. first letter in a word <br>b. inside the word <br>c. standing alone. <br>d. last letter in a word - joining to the letter in front. <br> <br>when you write - you will connect letters; and the shapes of the letters will change - to adjust to the writing of other letters. <br> <br>and just fast sample: <br> <br>sample 1 - arabic has to "h". the left - stressed. the right - normal. <br> <br>sample 2 - "day" . this word is made out of three letters  ya, waw, mim. (but in english you will say : a day. in arabic - short vowles are not written. </p>'
