    html: |-
      <p>It is possible to create Indic fonts with AFDKO 2.0+, I believe. What was missing previously was support for GPOS anchor attachments. My understanding is that the more recent AFDKO supports all the lookup types necessary.</p>
      <p>I've been using VOLT for so long, though, and have so many FL-to-VOLT workflow tricks and scripts, that I don't see switching any time soon. Also, my most regular client requires VOLT sources as a deliverable.</p>
      <p>The <a href="http://www.microsoft.com/typography/SpecificationsOverview.mspx" rel="nofollow">MS Indic font development specs</a> are very helpful, and worth studying.</p>
