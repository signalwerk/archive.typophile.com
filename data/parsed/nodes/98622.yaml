    html: <p>So, John, am I to understand that this happens at the level of the text processing engine and does not rely on any specific OT feature being written into the font? Not having attempted a Devanagari design (yet), I had always assumed that there would need to be language-specific OT features written to handle vowel positioning, etc. Has this burden been shifted to the layout engine? And if so, I assume it is responding purely to the Unicode codepoints in the text flow? Cool.</p>
