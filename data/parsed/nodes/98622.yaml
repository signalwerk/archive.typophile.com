    html: |-
      <p>Kent: <em>So, John, am I to understand that this happens at the level of the text processing engine and does not rely on any specific OT feature being written into the font?</em></p>
      <p>Correct.</p>
      <p>The layout engine is responsible for any standard reordering, such as the short <em>i</em> in Devanagari, Bengali and other northern scripts, and for splitting two-part vowels in southern scripts. The font is responsible for what happens with these glyphs after re-ordering. What this means is that the font GSUB and GPOS lookups need to presume reordering. So, for example, if you want to vary the width of the short <em>i</em> vowel sign dependent on the width of the letter or conjunct to which it applies, you make variant substutions based on the <em>following</em> (right side) context, even though the phonetic character input has the vowel after the letter/consonant. Between the character input and the glyph substitution, the Indic layout engine is performing reordering.</p>
      <p>The reordering is based on standard Unicode rules, so when the layout engine sees the character code for the short <em>i</em> in the text, it knows that the glyph associated with that code in the font cmap table needs to be reordered.</p>
      <p><em>I had always assumed that there would need to be language-specific OT features written to handle vowel positioning, etc.</em></p>
      <p>It is a good idea to make a usage distinction between '(re)ordering' and 'positioning'. Positioning would be an instance of GPOS, typically an anchor attachment positioning of a combining mark, so would apply to e.g. the <em>u</em> vowel sign. Ordering is a buffered character level operation (buffered in this case meaning that the underlying Unicode character string is not affected, only the display).</p>
    html_clean: |-
