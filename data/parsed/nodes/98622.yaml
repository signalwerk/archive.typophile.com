    html: <p>That looks like proper glyph-handling behavior for the short <em>i</em> in Devanagari, assuming what you’ve attempted to write in your screenshot is <em>pāpīki</em>. You’ll want to adjust your right sidebearing (and/or kerning) accordingly.</p>
