    html: |-
      <p>Your character input is correct, i.e. phonetic.</p>
      <p>With regard to lookup input, the ikar variant width substitution is a contextual 'pres' feature substitution, which would normally be applied after 'pres' conjunct formation, which would in turn be applied after 'half' form substitution. So there would be a sequence of three lookups affecting this syllable. In VOLT syntax and using my naming conventions, these would be as follows:</p>
      <p>1. d.half<br>
      <code>dSa dHalant -&gt; dS.half</code></p>
      <p>2. d.pres.conjuncts<br>
      <code>dS.half dTa -&gt; dSTa</code></p>
      <p>3. d.pres.ikarwide<br>
      <code>dSignI -&gt; dSignI.wide<br>
      | dSTa</code></p>
      <p>Obviously in the last of these the context string is more likely to be a class of glyphs of similar width. </p>
      <p>In the Adobe Devanagari fonts, we used a lot of ikar variants to get quite precise relationships between the tip of the ikar and the main stem of the following letter, as one finds in manuscripts. In some more recent designs, we've limited the number of variants, since some readers found the very long ikars in Adobe Devanagari distracting on the page.</p>
