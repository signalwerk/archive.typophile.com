    <p>Well it has very little to do with type but a client is paying us to draw monsters!<br>
    I am soo happy, if they just asked us nicely I would have done it for free.<br>
    Any hows typy stuff at the moment is,<br>
    company logo is  ITC Avant Garde, copy text on ads is Gotham Round, but this my change.</p>
    <p>If any one is interested have a look at the temp website <a href="http://www.madebykate.co.uk" title="www.madebykate.co.uk">www.madebykate.co.uk</a></p>
    <p>I still can't believe we're getting paid to draw monsters, it's like being at primary school and your dreams coming true.<br>
    Have a great weekend<br>
    Martin</p>
