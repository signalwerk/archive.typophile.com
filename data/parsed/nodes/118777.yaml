    html: |-
      <p>Maybe what we're dealing with here is some knock-off of Futura (Spartan Heavy comes to mind, but it still isn't a perfect match--the 5, for instance).</p>
      <p>In the phototypesetting era, there were often clones of famous typefaces that not only were given different names, but also "improved" on the details.</p>
