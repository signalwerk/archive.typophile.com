      <p>I think you may be right kthomps5.  The manual contains a couple of other fonts which don't seem to be available in digital format.  One of them looks almost identical to Garamont Amsterdam EF Medium Italic, save for a couple of very minor differences.  The Garamont typeface was created in 2004 however, whereas the manual was written in 1946.<br>
      <a href="http://myfonts-wtf.s3.amazonaws.com/b2/b2c286799fbf380b09f0c00714980174.104577.png" title="http://myfonts-wtf.s3.amazonaws.com/b2/b2c286799fbf380b09f0c00714980174.104577.png">http://myfonts-wtf.s3.amazonaws.com/b2/b2c286799fbf380b09f0c00714980174....</a></p>
