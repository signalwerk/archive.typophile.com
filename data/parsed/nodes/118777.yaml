    <p></p><div class="imageWrap"><img src="http://typophile.com/files/15 AUGUST 1976_3706.png"></div><br>
    I classified the typeface as 'Display' but I'm not completely sure that it is.<p></p>
    <p>This typeface is similar to the Futura series, however the '5' is quite a rare design and the '9' and '6' are different to what is common with Futura.</p>
