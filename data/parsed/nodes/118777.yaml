    html: |-
      <p>The TR Avalon at fontsplace looks like a clone of Avant Garde, designed in 1970.<br>
      As for Spartan, this was produced in many variations from 1939 onwards by Bauer &amp; Linotype, as a knockoff of Futura. Only two versions have been digitized, as Book and Heavy<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/SpartanBookNumbers_6172.gif"></div><div class="imageWrap"><img src="http://typophile.com/files/SpartanHeavyNumbers_3638.gif"></div> For _5_, top but not bottom is similar to your manual. For _6_ some curvature of the back, but not as much as your manual. No real difference from Futura.<br>
      It's almost as if the font designer took the bottom of a Futura _3_ and pasted it on _5_ or lifter the bottom of the _5_ in Helvetica.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/HelveticaBoldNumbers_6410.gif"></div><br>
      Don<p></p>
