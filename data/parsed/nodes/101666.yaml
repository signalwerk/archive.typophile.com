      <p>I joined Typedrawers only recently, when there seemed a general lull in anything of any interest on Typophile and massive spam problems. That in itself, I think, explains part of the reason why Typedrawers exists: people who for various reasons were frustrated with Typophile wanted a different place with a different structure.</p>
      <p>So far, I'm pretty happy with Typedrawers but it hasn't yet reached anywhere near the quality of Typophile at its best, but then neither has Typophile recently. I appreciate the focus on professional type design over there, and the absence of 'Can anyone tell me what this font is?', and I do think both forums are different and necessary. There will be times when the same topic -- the Canberra competition, for instance -- gets aired in both place, but I suspect this will happen less often than one might think, and it might be interesting to see the ways in which the actual discussions differ.</p>
