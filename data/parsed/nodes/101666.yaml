      <p>Well, I am running a online-forum for over 12 years now and I can tell you from experience (like anyone else who runs a larger online discussion board) that a successful forum just needs to be an autocracy. Someone is paying for that board and maybe is putting in hundreds of hours of work every year to make it flourish. That someone needs to protect this work, even if that means deleting posts, banning members and so. Thousands of online boards work this way since the 1990s.  </p>
      <p>I am convinced, that the demise of the reputation of Typophile over the last years was specifically caused by the fact, that no one here set and executed clear rules.<br>
      And this eventually lead to the creation of alternatives. So what? If you don't like the way those boards are run, don't use them. Move on. At best: don't even read the public forums there. Continue to use Typophile or any other board. </p>
      <p>But do the users of this »house« really need to peak over the neighbor’s fence and complain about every step the people there are doing? That seems a bit childish. Especially since many users of TypeDrawers continue to be active here. It's just two boards. No one is at war. No one is fighting about profits or the most users. It's just people interested in typography and type design who like to exchange their thoughts. Live and let live.</p>
