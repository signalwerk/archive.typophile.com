      <p>Different people browse Typophile differently. Because my own ideal habits are poorly supported by the current mechanism I have to assume it's inefficient for many others as well. So the large number of boards is moot to me personally; it could certainly be relevant to other people, or become relevant to [people like] me if the user interface changes.</p>
      <p>If there were a way to entirely exclude the ID section during browsing (which actually used to be possible) that would help certain kinds of users. Watching the activity on the ID section versus the rest of Typophile you realize that there is virtually zero interaction: people who use the ID section never go anywhere else, and people who spend time actually discussing type almost never set foot in the ID section. It's not a healthy state of affairs, not least because there is no such demarcation in terms of user interface.</p>
      <p>Most of all, things wax and wane. If things are handled correctly Typophile can start waxing again, even if it has to change. But you will never please everybody, certainly not people who see public discussion as a venting mechanism or some sort of necessary evil. Just because somebody's type design skills are highly respectable does not mean they are psychologically fit for discourse. Remember that any creative person has an over-sensitive artist in him, so has trouble handling criticism. Some of those who don't value what Typophile is or can be wisely and kindly simply stay away; sadly however there are some who can't stand not watching, but can't or don't want to participate much, so they want to shut people up. It makes no sense to deride people who spend a lot of time disagreeing with you; make your decision of how seriously you want to defend your views in public, and stop whining.</p>
      <p>Also, more of us need to be more pro-active, more loyal. When somebody who has struck down public discussion for over a decade starts drunkenly vandalizing the place and randomly abusing members, I shouldn't be the only person putting up resistance, and then be singled out for confronting people. Typophile might be "virtual", but it is still a community; it needs defending. Watching it devolve is very short-sighted, and that attitude can't sustain <em>any</em> community for any meaningful length of time.</p>
      <p>hhp</p>
