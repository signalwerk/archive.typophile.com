    html: |-
      <p>Ralf, you certainly have a point. But it's also not very efficient, because -unless you just want a social fix- you basically do have to post both places, and read both places. Also, I personally believe in freedom <em>from</em> choice too!  :-)</p>
      <p>Not everything on Typophile belongs on TypeDrawers, but I think everything on TypeDrawers does belong on Typophile... Which means it could have been some sort of sub-forum, at least in theory. But that wasn't meant to be, for a number of reasons.</p>
      <p>Also, I value the mingling of makers and users that Charles mentions. I guess what some makers mind though is being distracted by the "noise" that non-practitioners can cause. On TypeDrawers, even when a post by a maker isn't "tight" enough, sparks fly.</p>
      <p>In the end, some people are not open to changing their attitudes - they just want to get better/faster at what they do, and they don't want ideological confrontation to impede that. For others, things like this<br>
      <a href="http://typophile.com/node/101331" title="http://typophile.com/node/101331">http://typophile.com/node/101331</a><br>
      are the best thing on the planet.</p>
      <p>BTW, in case not everybody knows this: I (along with at least one other person, but probably more) am not allowed to participate on TypeDrawers. One of the triggers was that I confronted the friend and former teacher of its owner on Typophile, when this person started "digitally vandalizing" Typophile, and randomly abusing members in the harshest manner. I felt it was my duty to try to stop that; I wish others weren't so detached. What's quite ironic BTW is that this person has been flagged a Troll six times on TypeDrawers, and I'm not even there! :-/  Looking for scapegoats is for weaklings.</p>
      <p>To me TypeDrawers does fill a role, one that sadly seems necessary. However I don't respect its genesis (as others on TypeDrawers itself have actually opined) and I don't have faith in its owner on a number of levels. But none of that makes TypeDrawers pointless.</p>
      <blockquote><p> Typophile is .... a private endeavor with no “official” status.</p></blockquote>
      <p>This part I don't get. Is TypeDrawers any different? In fact isn't it <em>more</em> private?</p>
      <p>hhp</p>
