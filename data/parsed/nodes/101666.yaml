      <p>Nick, it doesn't make sense that I'm that much of a singularity. Note that I'm not the only one who's banned; there are at least four people now (but probably more, certainly many who won't know until they try). And do you not believe James Puckett when he states that my exclusion is only a side-benefit? If you think he's confused or lying, what should you feel/do?</p>
      <p>Also, I'm sure you realize -and hopefully you can openly admit- that I don't try to get people to do what I consider the Right Thing as much these days. However I actually believe it's <em>inappropriate forum behavior</em> to suggest that expressing moral preferences has no place in the health of a community, because silence can lead to an erosion of community morals. So why would your type of view of proper behavior get priority over my type? And how is expressing morals worse than your first post of October 4 here?<br>
      <a href="https://web.archive.org/web/20141028122340/http://typophile.com/node/96774?page=1" title="http://typophile.com/node/96774?page=1">http://typophile.com/node/96774?page=1</a></p>
      <p>So for example, for people like David who think Chris Burton's ejection from TypeDrawers was not a good thing (and covering it up certainly can't make it better) is complaining about it good or bad? That <em>is</em> a moral stance. Communities naturally exhibit vectors of moral pressure - think of it as feedback to help everybody know how others feel, and thereby better predict future reactions, promoting overall harmony. Excluding that from a community puts it at greater risk, not lesser. It can never only be about content - that's inhuman. Or: the morals are content too.</p>
      <p>Example: There was a regular in the ID section who had a massive library of pirated fonts and used software to identify them for people. He had no qualms about suggesting blatantly plagiarized fonts, and helping out people who admitted to pirating the fonts he would recommend, and the only reason he stopped IDing outright pirated fonts was that he was warned he'd get kicked off. Thanks to the concerted efforts of a few people <em>who exerted moral pressure</em> he seems to not come here any more. It took about 3 months I think, and now Typophile is slightly better for it. We are all moderators.</p>
      <p>So let me ask this: Is font piracy morally wrong? If you see it happen on Typophile (which you occasionally would if you spent enough time in the ID section) should you complain?</p>
      <p>hhp</p>
