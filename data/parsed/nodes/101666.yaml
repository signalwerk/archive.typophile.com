      <p>Chris, on the technical/security aspect:<br>
      I think that encoding font files as base64 strings into the CSS files, does not make them more secure, only more "obscure" ( <a href="https://web.archive.org/web/20141028122340/http://en.wikipedia.org/wiki/Security_through_obscurity" title="http://en.wikipedia.org/wiki/Security_through_obscurity" class="link-external">http://en.wikipedia.org/wiki/Security_through_obscurity</a> ) but people already know how to decode those strings. It was never a secret since encoding/decoding files into the css its a common optimization practice (for example for encoding icons or image files to reduce HTTP requests). This is evident since there are already lots of 'tk-rips' floating around. And, in fact, they don't even need to decode those strings. Technically, developers can just grab the CSS files 'as is' and use it for other websites. The only thing stopping users from doing that are ethics and the license text included in the css files as a comment.</p>
      <p>But more important, it creates a problem for the webfont provider and a PITA for the legit users/webmasters: As the font are stored in the individual CSS files of each website and not linked to the real font files on a server, each time you update hinting or fix problems in the fonts, you need to force all your users to "republish" their kits in order to see the upgrades. Instead, if you keep the files in the server instead of encoding them on CSS files, each time you upgrade the fonts on the server all users get the upgrade on the fly, automatically. No "republish your kits" action needed.</p>
      <p>The best protection scheme for the foundries and easy of use for the webmasters, so far, is to keep the files on the server AND check for the HTTP_referrer before serving the fonts files. This way, people who look into the CSS files will see the links to the font files, but if people try to grab them: they can't (all they will get is a 403 Forbidden error) as the access to the files is denied to those having an incorrect HTTP_referrer header.</p>
      <p>Of course, the HTTP_referrer can also be faked, but I think it's a bit more complex.<br>
      Saddly, there is not a better solution yet.</p>
      <blockquote><p>"Why wouldn't WT use a simple method of encoding their syntax much like Typekit and other distributors?"</p></blockquote>
      <p>Now that the technical side has been cleared.. maybe they have simply decided that the "encoding/republish" scheme is simply adding an unneeded extra layer of complexity for both, themselves as providers and their users as webmasters, that does not worth it, given the very low increase of security they may provide.</p>
