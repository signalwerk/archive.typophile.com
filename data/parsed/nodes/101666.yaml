      <p>I had always assumed that typophile was a site for people working with and interested in type. There are more people professionally involved with type who are not type designers than who are. Then there are those, whatever their profession, with a general interest in type.</p>
      <p>So far, at least from the people who post and the categories available, TypeDrawers, is primarily aimed at type designers. Typography for example, has only History and Education as subcategories. Nothing there for users, generally -- except, maybe, under "business" as as potential customers?</p>
      <p>Sort of implicit in your post --hopefully unintended -- is that the non-designers who frequent typophile should go away.</p>
