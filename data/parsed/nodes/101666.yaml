      <p>For some people, its all connected... Ask one person a question get another one charging you with board slaughter, five counts of board neglect, squelching conversation and more! because as you see, it's all connected. Everything they ever said or done is in there ...buzzzzzijng around.</p>
      <p>Others compartmentalize not because they are boring or withholding, but for the sake of productive discourse, and to spend time at mouse, with their faces. Little box here, little box there, boxes for everything. </p>
      <p>There is a video on the subject here: <a href="https://web.archive.org/web/20141028122340/http://www.youtube.com/watch?v=0BxckAMaTDc" title="http://www.youtube.com/watch?v=0BxckAMaTDc" class="link-external">http://www.youtube.com/watch?v=0BxckAMaTDc</a></p>
      <p>So it's your baby! You have models with strong moderation and little or none. You also have:</p>
