      <p>John, that post is so 2005. As some people have noted, I don't anger people the way I used to. The relatively recent incident with the Jameses frankly I see not as my failure, but a failure of others, who didn't bother coming to Typophile's defense. Of course that's just my view, but it remains that my stance was not an act of aggression or even self-defense, but an act of defending a community I value.</p>
      <p>But since the past isn't irrelevant, I'll try to address your major points.</p>
      <p>You can't predict people's reactions. Or at least I can't. For example I can't figure out how what I wrote above could be considered "arrogant". It's not that I think angering people is OK, it's that it's often an unavoidable pothole on a worthwhile path - it comes with the territory of making people think (which does not mean those two things always coincide). At least where I come from (which I don't necessarily mean geographically or ethnically). Remember, we're from different -personal- cultures; your "civilized" is often my "deceptive".</p>
      <blockquote><p>If you know that you bring out the worst in people</p></blockquote>
