      <p>Chris (Burton), you were bad for business. :-/  But it still seems pretty extreme. Maybe he thinks you betrayed the Old Boys by talking about it on Typophile. Maybe he was pressured. Without an explanation all somebody can do is speculate, which is no good for anybody. And unless you did something really wrong that you haven't revealed, I have to say that anybody over there with half a spine should complain. Otherwise fear of capricious censorship will stifle meaningful discourse.</p>
      <p>Jared, people are reactionary. The reason the Uppercase forum didn't succeed was probably that there was nothing very wrong with the rest of Typophile. I don't think things were less confrontational back then (I for one was probably more confrontational) so maybe the more recent combination of mountains of font IDs (with its undercurrent of piracy and plagiarism) and gobs of spam changed things. And I have to frankly agree with those who say that Punchcut was too hands-off for too long. I hope it's not too little, too late now.</p>
      <p>Would it be a good idea to restart a more restrictive section of Typophile? Ironically, now that the ID section is less unethical (for which I can immodestly take partial credit) and the spam seems 99% under control, maybe it's again not needed. :-/  But two fruitful distinctions between an exclusive section and the rest might be:<br>
      - More hands-on moderation, dampening confrontations. Since the exclusive section would be less active (see below) that would be more doable.<br>
      - Total ban on IDing.</p>
      <p>So, what would the exclusivity criteria be? My suggestion: $1 a year subscription. Some other paths to exclusivity would lead to something like TypeDrawers. Besides the fact that we already have one of those, I personally don't value that sort of environment -with the way that Chris Burton was treated for example- and I think it's too culturally limiting.</p>
      <p>But there's also the elephant in the room that a forum like this can't be as relevant as it was a few years ago. People have -sadly- moved to shallow expression channels like Twitter, from being totally public (opening themselves up to challenges) to being semi-public and conversing with people they mostly agree with. Technological improvements have facilitated the manifestation of that human weakness. Typophile doesn't have to play along with that, even if it means being less active. Quantity does not replace quality - we do however need an adjustment in quality.</p>
      <p>hhp</p>
