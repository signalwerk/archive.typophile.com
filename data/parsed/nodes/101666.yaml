      <p>Jared: "Should we start it up again? What would be the criteria for getting beyond the velvet rope?"</p>
      <p>This first question, what have you to got to lose?</p>
      <p>The second, I hope if someone gives you the advice to open a new area that has more moderators, you judge the suggestion closely. Hilariously, that's the only alternative to "this", the definition of which I'll get into in a minute. </p>
      <p>It's hard to imagine why a board for professionals would need <em>more </em> moderation than an unprofessional board. I mean, non-self moderation means its gone too far already 100% of the time.  So if that's the proposal, and it's the only option, then there are probably some other issues, bringing us to this.</p>
      <p>For some people, its all connected... Ask one person a question get another one charging you with board slaughter, five counts of board neglect, squelching conversation and more! because as you see, it's all connected. Everything they ever said or done is in there ...buzzzzzijng around.</p>
