      <p>Puckett's personal friends are also exempt from the rules sometimes. Only two of Montalbano's six Troll flags are visible; this is because the first four were quietly removed, but when the recording of Troll flags became an explicit issue (partially because he got two more, partially because he complained about not being able to mark any Troll flags himself, but possibly also because I brought up the issue here*) the <em>number</em> was -again quietly- reinstated.</p>
      <p>* <a href="http://www.typophile.com/node/52576#comment-545229" title="http://www.typophile.com/node/52576#comment-545229">http://www.typophile.com/node/52576#comment-545229</a></p>
      <p>None of this makes TypeDrawers useless, but cronyism does make it markedly less useful, because some people have principles concerning what kind of people they associate with, principles that over-ride any benefit they might draw from participating. To be fair, there are also people who participate because they're vying -or at least hoping- for improvement. That actually describes my own participation on Typophile: loyalty makes me want to weather spam attacks, lack of ethics in the ID forum, and personal attacks. I would say this sort of "family loyalty" is somewhat lacking among creative people in general (partly because of difficulty handling criticism) and I feel this is strongly reflected in the genesis of TypeDrawers.</p>
      <p>hhp</p>
