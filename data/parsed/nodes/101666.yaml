      <p>Google searching of Typophile was blocked for a few months (apparently due to a spam "lock-down" of sorts) but it's been up again for a few months now. I can find things pretty easily these days. You might say something like TypeDrawers can be searched via Google too, but quite often people look for something they know -or strongly suspect- is on Typophile (remember that it's by far the biggest repository, even if it's chaotic) they just need to locate it. So I put "site:typophile.com" in Google to narrow things down, and I'm set. Frankly it's not a disaster having multiple fora, but when it comes to the "library" concept it's not ideal either.</p>
      <p>David, I agree that Typophile is much more dangerous for business than something like TypeDrawers (and I alluded to that above). But maybe that's why Typophile seems better for cultural progress. That's not everybody's cup of tea, but nobody should think it should be nobody's.</p>
      <p>Should Typophile evolve? I love evolution a great deal, but there's no reason to throw out the baby with the bathwater. It's completely possible to "re-configure" all the built-up material and the -legitimate- membership. And is it crazy to suggest that the internal search can be fixed? Whether Punchcut is willing to do any of that is another matter. But if they're not, they just might be gracious enough to pass the baton.</p>
      <p>Most of all, I have zero faith in something like Twitter leading to any kind of progress. Without reading a great deal (and writing a good deal) all one can achieve is a deeper trench. What I do have faith in is loyalty, resilience, patience and open discourse.</p>
      <p>hhp</p>
