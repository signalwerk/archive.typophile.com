      <p>The back-story of why I posted the discussion:</p>
      <p>I found that you can easily download Webtype's <strong>entire library</strong> for free. I tweeted them to make it aware (without compromising how it can be done) without any reaction or reply. Could I have emailed them? Sure but it isn't my responsibility. Therefore, it seemed that a) they don't care or b) they are aware of the issue and didn't want to respond in case others read through their tweets. Even then I would have at least emailed the person that found a loophole in my business. I was looking for discussion on the topic of why a distributor wouldn't use the basic methods of protecting their content.</p>
