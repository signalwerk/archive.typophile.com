      <p>Ralf, I'm actually a monarchist - I don't believe in Democracy. But the King/Queen must be honorable. So I agree that there has not been enough moderator activity on Typophile; however an imbalanced application of rules has its own problems. And your "live and let live" doesn't really mesh with any of that.</p>
      <p>And there's nothing childish about worrying about the state of public discourse on type design; Typophile and TypeDrawers are both part of that, together (along with many other things). It's all related. And if you can't see the various levels of confrontation (maybe not a war, but certainly a network of battles) I don't know what to say.</p>
      <p>Indra, I can assure you that Montalbano's Troll count went down from two to zero; that's when I wrote my comment on that thread I mentioned; then it jumped to six after your two. So I actually missed what happened to the two in between, and I might be making an incorrect -if safe- assumption on those. But qualitatively two is still infinitely more than zero. BTW the point isn't to nitpick - the point is that the person who was a catalyst of the birth of TypeDrawers was himself a big part of the problem on Typophile; sadly some people prefer to demonize a single individual. And actually this person has been anti-online_fora at least since I first started, in 1998. Not everybody is fit for every kind of social interaction, and living with something one considers a necessary evil for too many years eventually explodes.</p>
      <p>Also, marking somebody a Troll merely in retaliation should not be tolerated.</p>
      <p>hhp</p>
