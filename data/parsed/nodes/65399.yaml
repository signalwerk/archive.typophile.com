      <p>If it doesn't have to be too Baskerville, Mrs Eaves is the prettiest - although you'll have to manually kern it up the wazoo. If you can drift further I might look towards Bell as well.</p>
      <p>BTW, display Baskervilles generally come from the Fry's lineage, not the authentic JB branch. Just sayin'.</p>
      <p>hhp</p>
