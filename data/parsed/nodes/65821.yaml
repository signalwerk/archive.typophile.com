      <p>Did you know that most libraries not only let you borrow books, but also CDs and DVDs? </p>
      <p>I've always wondered why this wasn't a more complained-about source of piracy for music and movies. One can simply check out a CD or DVD, copy it, and return it. All without paying any money. I can understand why it would be difficult to quantify the extent of the problem--it's virtually undetectable--but shouldn't that fact alone makes it a really obvious, attractive alternative to the more risky, yet-equally $0 process of using the usual, internet-based way of illegally downloading those things? </p>
      <p>Is it just that it's inconvenient and that impatience constitutes some portion of the motivation behind piracy?</p>
