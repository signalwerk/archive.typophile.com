      <p><cite>I don’t know about the folks who want to read Dan Brown but I can tell you that a lot of the people who are into makeshift book scanning and unlicensed distribution are people who love literature, love books, and find the notion of an “out of print” book in the digital age a travesty. (It is.)<br>
      There is something akin to a “Fahrenheit 451” phenomenon going on.<br>
      Nearly all of 20th Century culture in print is being held hostage by a very, very small percentage of rights holders whose works still have some commercial value.</cite></p>
      <p>I can agree with that sentiment, and yet not feel that it is a good enough reason to ignore or abolish copyright law. I do feel that copyright law is intended to benefit society by encouraging the production of new works - it is not a compulsory respect for the human rights of authors - and so legislators should not extend copyright in every way that vested interests ask them to.</p>
      <p>Of course, as an English speaker living in Canada, I can very easily go to thrift shops and pick up a vast number of books on all sorts of subjects at bargain prices, while fully respecting copyright law.</p>
      <p>Other people are not so fortunate. Thus, the people who live in Eastern Europe, for example, if they are seeking books that have honest contents, that have not been cruelly deformed into making a mockery of truth, must, at least for works on many subjects, confine themselves to books published recently, or imported books in foreign languages. Except for books on the most politically innocuous of subjects, therefore, books are likely to be more expensive: perhaps used copies at half price of last year's popular books, but not at thrift shop or library book sale prices.</p>
      <p>So I suspect that for them, much more than for us, the copyright issue you outline is a genuinely serious matter.</p>
