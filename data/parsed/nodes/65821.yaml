      <p>stuart said:<br>
      &gt;   You could split hairs that there is<br>
      &gt;   a big enough difference between<br>
      &gt;   lost pirated font sales and book sales<br>
      &gt;   but I feel they are akin to one another . . .</p>
      <p>i agree.  they're very much the same thing.</p>
      <p>that's why i laughed when you said publishers<br>
      are just starting to experience the phenomenon.</p>
      <p>now let's pursue the matter just a bit farther...</p>
      <p>that "casual friendly sharing" is something that<br>
      people expect to be able to do with paper-books.<br>
      and indeed, there's nothing illegal about it at all...</p>
      <p>no, to the contrary, under the "first sale doctrine",<br>
      this is a legal right that people have with p-books.<br>
      in addition to loaning them to other people, you<br>
      can also rent books, or sell them used outright...</p>
      <p>all of this "takes income from the author's pocket",<br>
      if you choose to think about it that particular way,<br>
      but it's all perfectly legal, and it jives with our sense<br>
      of the way things "should" be, as per our experience.</p>
      <p>it's also the case that _libraries_ "take income from"<br>
      authors, if you choose to think about it that way, but<br>
      -- once again -- that's the way the world was set up.<br>
      a copy of the book is bought, once, so the author<br>
      and the publisher are paid, and then that copy gets<br>
      loaned out, perhaps dozens of times over its lifetime,<br>
      even though the author was only paid that one time...</p>
      <p>the thing is, what publishers are trying to do now, is<br>
      to change the _sale_ of a book into a _rental_ instead,<br>
      and a strictly constrained rental at that, via a "license".</p>
      <p>they even want to try to "enforce" the license via d.r.m.</p>
      <p>this gets to be ridiculous.</p>
      <p>and similarity between books and fonts breaks down.</p>
      <p>-bowerbird</p>
