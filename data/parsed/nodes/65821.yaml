      <p>Didn't read the article. I might, but...<br>
      I don't know about the folks who want to read Dan Brown but I can tell you that a lot of the people who are into makeshift book scanning and unlicensed distribution are people who love literature, love books, and find the notion of an "out of print" book in the digital age a travesty. (It is.)<br>
      There is something akin to a "Fahrenheit 451" phenomenon going on.<br>
      Nearly all of 20th Century culture in print is being held hostage by a very, very small percentage of rights holders whose works still have some commercial value.<br>
      It was *my* Congress who got bought off and voted for this sh-t. Reform is way overdue.</p>
      <p>The music industry periodically sues kids who download music to make an example out of them. But they're an easy target public-relations-wise. They're just trying to get a freebie. Is the publishing industry going to sue middle-aged librarians and college profesors who are doing this on principle? I really want to see how that flies.</p>
      <p>rich</p>
