      <p>This is fascinating reading Bowerbird - <a href="http://en.wikipedia.org/wiki/First-sale_doctrine" title="http://en.wikipedia.org/wiki/First-sale_doctrine">http://en.wikipedia.org/wiki/First-sale_doctrine</a></p>
      <p>Although it doesn't really make a clear case for the difference between digital and physical goods but it is very interesting none the less because I was not familiar with this doctrine previous to your posting . . .</p>
      <p>Otherwise one wrinkle in your post regarding libraries states they as well as non-profit educational institutions are exempt from this doctrine.</p>
      <p>Further, EULAs aside, so long as the terms of the sale are presented and accepted by the user prior to their ability to take possession of the good, there is a strong case against the first sale doctrine, especially if they demonstrated acceptance of the terms prior to purchase and/or use . . .</p>
      <p>That said, does it remedy the author? dunno. . . It would seem it's easier to protect a Blog than it is an actual written novel under these conditions . . .</p>
      <p>Stuart</p>
