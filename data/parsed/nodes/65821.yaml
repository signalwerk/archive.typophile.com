      <p>It is unfortunate that font designs are being copied widely, and have a lack of legal protection, at least in some countries.</p>
      <p>Of course, I cannot condemn makers of cheap font CDs too harshly when I remember that the major typesetting machine companies and typefounders had been taking advantage of the lax legal regime to do the exact same thing.</p>
      <p>The solution, of course, is what ITC had been trying to do. Instead of a type designer working for Linotype, or Monotype, or Compugraphic, or Bitstream, type designers design their fonts independently, and through a co-operative organization similar to ASCAP, license their fonts on equal terms for use on any phototypesetting system.</p>
      <p>Of course, today, all that is obsolete. People don't use phototypesetters, they use high-resolution laser printers, and TrueType, Type 1, and OpenType work on them all just fine. So you can buy a typeface from Linotype and use it on any laser printer, even if it were made by ATF or VariTyper.</p>
