      <p>There are a lot of contemporary serif faces that are somewhat condensed and have a large x-height, such as my own <a href="http://www.shinntype.com/pratt.html" rel="nofollow">Pratt Pro</a>.</p>
      <p>Failing that kind of proportional matching, you could go for matching the "ink gain" (assuming that's what the roundedness of Brauer signifies) with a "chubby" face such as Dolly or in a more oldstyle vein, my own <a href="http://www.shinntype.com/paradigm.html" rel="nofollow">Paradigm Pro</a>. A more offbeat rounded partner for Brauer: Souvenir.</p>
