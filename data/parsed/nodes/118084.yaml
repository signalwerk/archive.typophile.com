      <p>Perhaps the closest out of the box tiny/spur serif fonts to this lettering are:<br>
      Mythica <a href="http://www.myfonts.com/fonts/k-type/mythica/" title="http://www.myfonts.com/fonts/k-type/mythica/">http://www.myfonts.com/fonts/k-type/mythica/</a> Even has a similar convex curve to the leg on the _R_ Has several weights to handle the different versions sof the lettering.<br>
      Modesto <a href="http://www.myfonts.com/fonts/parkinson/modesto/" title="http://www.myfonts.com/fonts/parkinson/modesto/">http://www.myfonts.com/fonts/parkinson/modesto/</a> Note the close _E_. Several widths and weights.<br>
      Don</p>
