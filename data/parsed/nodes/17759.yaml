      <p>The way its set its a very wide logo. Try making it Coded line one and Vision line two and add Intergrated Solutions as line three. As Tim suggested you have kerning issues as well.</p>
      <p>May I suggest you go away from the computer and take a note pad and a pencil and just write different solutions. That way your not caught up in typefaces and kerning. This allows you to work on the bigger issues like communications and layout.</p>
