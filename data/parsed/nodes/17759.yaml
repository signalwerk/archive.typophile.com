    <p>Hello friends</p>
    <p>This is my first post and I am a bit nervous about it.<br>
    I come from a place where typography is almost completely ignored and chances of getting exposed to it is very scarce. I dont know how it happened but these days I find that I am really in love with type. I never knew that so much things existed with simple letters.</p>
    <p>Actually, I am really excited to find a place like this at the very beginning of my studies about type.</p>
    <p>Coming to the logo, I made this for a software company focussing on software related to communication. They have made softwares for TV Channels, Governmental agencies etc.</p>
    <p>This is not a redesigning. They did not have an identity till now.<br>
    Guidelines given were to make it 'modern, simple and clear'<br>
    Their target include local clients and overseas clients.</p>
    <p>I have used Trajan and later found that it is so much used with movie titles. Is it ok to use Trajan?<br>
    I could not play much with type regarding this logo.</p>
    <p>CIS stands for Codedvision Integrated Solutions.</p>
    <p>In case I am missing something please tell me.</p>
    <p>Thank you guys, in advance.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CIS_fro_Typophile.jpg"></div><p></p>
