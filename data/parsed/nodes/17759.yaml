      <p>My first concern about this is that it is very difficult to read, and easy to mis-read as in Code Division, you should investigate separating the two with colour, a large cap for V or moving your icon to the V. It strikes me that it doesn't really represent a software company (this might not be a drawback actually). As a word of warning orange is not always the best colour to reproduce from four colour process.<br>
      Trajan, although not modern, is well proportioned; and although it is over-used it is mostly in the roman weight rather than the bold. You have kerning issues, especially in the vision bit where it looks a bit crushed, and the CI combination could be closed up a touch.<br>
      Tim</p>
