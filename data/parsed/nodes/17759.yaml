      <p>I think Trajan would be a nice typeface choice initially, but I get caught up on the drama that it brings. Trajan (as you stated) is overused and overhyped on many movie posters in Hollywood today, and many for good reason. Trajan simply works. In this case, to me, it feels a little off?<br>
      Maybe if you tried something more neutral, in the sans family. Maybe some kind of mark implying vision? If you are dead set on a serif with drama for a mark, dare I say Rotis? I may be burned at the stake for saying that. :)<br>
      The orange triangular accent isn't happening for me yet. Too detached visually...doesn't explain or add anything?<br>
      One mark (not the typeface) for inspiration could be Fuji Television's? A nice abstract interpretation of the eye, and its always nice to go overseas to get inspiration! Keep working and post progress!</p>
