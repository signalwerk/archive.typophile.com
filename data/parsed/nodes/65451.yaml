      <p>I can only think of a few serifs with a 'reversed tail' on the g. One is <a class="freelinking external" href="http://new.myfonts.com/fonts/t26/jones/" rel="nofollow">Jones</a> from T-26; another is <a class="freelinking external" href="http://www.fonts.com/FindFonts/Detail.htm?pid=272992&amp;/cgi-bin/MsmGo.exe?grab_id=0&amp;page_id=19997&amp;query=AITOS&amp;SCOPE=Fonts" rel="nofollow">Aitos</a>, from Monotype; and the last I can think of is from Unifonts, and I would have to look for the name.<br>
      - Mike Yanega</p>
