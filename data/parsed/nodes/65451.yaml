    <p>It's kinda like the Hobo g but the typeface is a cursive serif. Can anyone think of a font that has this kinda g?<br>
    I'm not sure if my description is accurate someone else saw and described it to me!<br>
    So if you guys can think of anything that's even remotely similar to the description above please let me know!</p>
