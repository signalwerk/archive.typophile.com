    <p>the free-font <strong>»Fracmetrica Black«</strong> is a modern and geometric blackletter with several opentype-features like ligatures, case-sensitives, text figures.<br>
    It's kind of condensed and has a high contrast. The typeface's construction is based on an isometric 60°-grid.</p>
    <p><img src="/sites/default/files/old-images/jakob_p2_fracmetrica_intro_3878.jpg"></p>
    <p>Created by Jakob Runge 2009 during the <a href="http://Workshop »fancy_fonts_&amp;amp;_porno_pattern« at the university of applied sciences würzburg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Workshop »fancy_fonts_&amp;_porno_pattern« at the university of applied sciences würzburg</a></p>
    <p><img src="/sites/default/files/old-images/jakob_fracmetrica2_style_1_4071.jpg"></p>
    <p><img src="/sites/default/files/old-images/jakob_fracmetrica2_zeichen_5447.jpg"></p>
    <p>the open-type version of »Fracmetrica Black« is for free creative-commons download.<br><a href="http:// about the finished and digitalised font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http:// about the finished and digitalised font</a><br><a href="http:// sketches and work in progess" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http:// sketches and work in progess</a><br><a href="http://issuu.com/werk_statt_villa/docs/werk-impuls/107" title="Click to visit an external URL." class="freelink freelink-external freelink-external">fracmetrica black in the »WERK imPuls« magazine</a></p>
