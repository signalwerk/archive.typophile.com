  html: |-
    <p>the free-font <strong>»Fracmetrica Black«</strong> is a modern and geometric blackletter with several opentype-features like ligatures, case-sensitives, text figures.<br>
    It's kind of condensed and has a high contrast. The typeface's construction is based on an isometric 60°-grid.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jakob_p2_fracmetrica_intro_3878.jpg"></div><p></p>
    <p>Created by Jakob Runge 2009 during the <a class="freelinking external" href="http://gestaltung.fh-wuerzburg.de/blogs/werk_statt_villa/?cat=6" rel="nofollow">Workshop »fancy_fonts_&amp;_porno_pattern« at the university of applied sciences würzburg</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jakob_fracmetrica2_style_1_4071.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jakob_fracmetrica2_zeichen_5447.jpg"></div><p></p>
    <p>the open-type version of »Fracmetrica Black« is for free creative-commons download.<br>
    <a class="freelinking external" href="http://gestaltung.fh-wuerzburg.de/blogs/werk_statt_villa/?p=462" rel="nofollow"> about the finished and digitalised font</a><br>
    <a class="freelinking external" href="http://gestaltung.fh-wuerzburg.de/blogs/werk_statt_villa/?p=372" rel="nofollow"> sketches and work in progess</a><br>
    <a class="freelinking external" href="http://issuu.com/werk_statt_villa/docs/werk-impuls/107" rel="nofollow">fracmetrica black in the »WERK imPuls« magazine</a></p>
