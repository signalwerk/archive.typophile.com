    html: <p>When I read your question I wasn't thinking about thick serifs, I was thinking thin and long. My suggestions are Carol Twombly's <a href="http://www.myfonts.com/fonts/linotype/charlemagne/" target="_blank">'Charlemagne'</a>,  or Xavier Dupre's new one for Font Font called <a href="http://www.myfonts.com/fonts/fontfont/angkoon/" target="_blank">'Angkoon'</a></p>
