      <p>What is going on with all the banks these days??? It seems like every time a store goes out of business, a bank sprouts up to take its place. I do most of my banking online, there is an ATM everywhere you look, who is using all these banks? And gawd they add nothing to the neighborhood. I guess it’s appropriate, tho, in a city only bankers can afford to live in. And like banks, bankers do nothing to enhance the neighborhood. </p>
