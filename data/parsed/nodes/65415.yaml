    html: |-
      <p>Some selected highlights of the upcoming Fontographer 5 version include:<br>
      — glyph antialiasing (smoothing) in all application windows and glyph window zoom level up to 1600%;<br>
      —&nbsp;radically redesigned and updated, easy-to-use Font Info dialog for editing the relevant technical parameters, with updated, intelligent automatic generation of OpenType-compatible font family naming and of cross-plattform linespacing values;<br>
      — reading and generating OpenType fonts (both PS/.otf and TT/.ttf flavor) with 20,000+ glyphs, with the ability to define the features using the most recent Adobe FDK for OpenType (AFDKO) version 2.5 syntax;<br>
      — reading and generating the FontLab VFB format for easy integration into a FontLab-based workflow;<br>
      — the Adobe PostScript autohinter and the excellent FontLab TrueType autohinter, integrated Adobe and Microsoft rasterizers for high-quality bitmap generation from the hinted outlines, and the ability to export the bitmaps into the BDF format. </p>
      <p>This is only a selection of the improvements, there are many more, including some nice surprises. </p>
      <p>Fontographer 5 will run natively on Mac OS X (universal binary), Windows XP, Windows Vista, and Windows 7.</p>
