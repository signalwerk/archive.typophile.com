    html: |-
      <p>1. The demo version for Windows has been updated now, sorry for that. Please re-download. </p>
      <p>2. The main organization for the windows is largely the same as in FOG 4, i.e. a Font Window, a Glyph Window, a Metrics Window. No classes editor, no OpenType features editor, no Preview panel etc. You can specify OpenType Layout features in an external text editor using the AFDKO 2.5 syntax. We plan auto-generation of OpenType Layout features for common European scripts in a later version, but there won't be a "visual" feature editor -- this is something for FontLab Studio. I mean, you can use Microsoft VOLT or the demo version of FontLab Studio, or one of the DTL applications or FontForge etc. to develop the features if you want. Or a text editor. Or something else (I think DTL announced a GPOSMaster which they will present at ATypI Dublin). But Fontographer has rock-solid glyph drawing, convenient and easy Font Info, solid PS and TT autohinting, and can "do" OpenType, in principle. </p>
      <p>3. The Illustrator copy-paste has been improved for format compatibility but the principle is the same. </p>
      <p>4. The fractional-coordinate drawing is the same as in FOG 4. Generally, the drawing interface is largely the same, except antialiasing and zoom up to 1600% (in FOG 4 it was 200%). </p>
      <p>5. The "add-on" basically means that as FontLab Studio user, you can buy Fontographer 5 for $99 and use both at the same time (so there is no special add-on application, you get the regular Fontographer 5 application). You can move your projects back and forth, you can e.g. design in FontLab Studio and then move to FOG and generate the fonts from there, benefitting from the much more cleaned up Font Info settings, the Adobe PS autohinting and the fact that it does AFDKO 2.5. So those who generated fonts using standalone AFDKO 2.5 could use FOG 5 now, then they'll be able to use Adobe PS autohinting and AFDKO 2.5 compilation, but also the FontLab-quality PS-to-TT hint conversion. Or, if you like FOG's simple drawing tools better, you can draw in FOG, then move to FLS5, use the class-kerning editor or Python scripting there, and then master your fonts in FLS. Whatever you like. FOG opens and exports VFB files. </p>
      <p>One catch: FOG won't import the OpenType features from VFB. If you have feature code in FLS, save it as a FEA file, save the font as VFB, open the VFB in Fontographer, then in Font Info / Encoding, point to the FEA file for feature definitions. </p>
      <p>It's not quite perfect but we didn't want to haphazardly clutter the FOG UI interface with new panels etc. -- that would make it the new FontLab Studio. However, there WILL be a new FontLab Studio. Fontographer is just an application that by definition is simpler, and should remain simpler. No manual fine control over some technical aspects of the font, but automatic algorithms instead.</p>
