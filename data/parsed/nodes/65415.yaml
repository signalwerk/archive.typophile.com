    votes: null
    html: |-
      <p>Unfortunately, RofoFog is based on Fontographer 3.5, a version which Fontlab Ltd. cannot maintain (we have not received the source code). Also, the RoboFog developers have long moved to RoboFab, a fully new font development environment, and they also established UFO as a new font interchange format. </p>
      <p>There are several RoboFab-based applictions available (Metrics Machine, Superpolator, Prepolator, Glyphs). We at Fontlab Ltd. have supported RoboFab from its inception, and we are now working on supporting UFO natively in our applications. It is likely that Fontographer 5.0 will be able to read UFO files, and we have plans to have full read-write support in Fontographer, TransType, FontLab Studio and other applications. </p>
      <p>Fontographer 5.0 is indeed under development. We are making good progress on the project. There will be a native Mac OS X version (universal binary) and a Windows version. The editing tools will stay largely the same, although some improvements have been made, especially in the user interface. Fontographer 5 will also include a streamlined Font Info dialog box (with much better family naming and linespacing management, hopefully much better than anything that we've made before), OpenType support (including quite smart, automatic OpenType Layout feature generation), better Unicode support. </p>
      <p>The output of OpenType (PS .otf and TT .ttf) fonts will be handled using FontLab's industry-standard output, so fonts made with Fontographer 5 will be technically fully up-to-date. </p>
      <p>In short, Fontographer 5 will be a pure type design application: stable, good, streamlined tools for type design. The type designer won't need to bother about any technical parameters, most of the work will be done automatically behind the scenes, producing optimized OpenType fonts (of course you'll still be able to make Mac and Windows Type 1 fonts). </p>
      <p>It will be more powerful than TypeTool and less complex than FontLab Studio. We hope that it will hit the "sweet spot" between simplicity and power. </p>
      <p>Cheers,<br>
      Adam</p>
