    date: 2009-12-26T15:08:00
    date_raw: 26 Dec 2009 — 3:08pm
    votes: null
    html: |-
      <p>Richard, </p>
      <p>Currently, Fontographer 4.7 sells at US$349, which is sort of half-way between TypeTool and FontLab Studio. We have not announced the final price for Fontographer 5, but one can expect that we will stick to the aforementioned principle. </p>
      <p>James, </p>
      <p>we are looking into the possibility of adding Python scripting (compatible with the FontLab Python scripting API, i.e. compatible with RoboFab) into Fontographer. While this is possible in theory, one needs to keep in mind that Fontographer is largely based on Macromedia code (though Fontographer 5 will be extended with FontLab code to ensure that opening and generating fonts will be done at our industry-standard quality). </p>
      <p>We do have "full blown" Python scripting in FontLab Studio 5, and we have simple scripting support in TransType Pro 3. While we will not add Python scripting into the initial Fontographer 5 release, we are investigating the feasibility of doing this in a later release. </p>
      <p>Cheers,<br>
      Adam</p>
