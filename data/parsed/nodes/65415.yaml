    votes: null
    html: |-
      <p>Since it is now out, I have some time to comment :)</p>
      <p>UFO: not in 5.0, even for reading. We just needed some more time to test it and decided to not delay release even further for this single reason. Will be added soon: code is done, just needs some attention.</p>
      <p>Scripting: on our list for future update, but it will depend on how good it will go. Fog5 project already took much more time than we have planned, so we need to be very careful with our resources for some time. In any case, it will not be "live scripting" as in FLS, but "in-out", where font data is "out" to Python and then comes "back" from the script. Our plan is to make it Robofab-compatible.</p>
      <p>I/O: In Fog5 we have some mix of legacy and FLS code. Type3 input and output, MM output and .fog i/o (extended to support new stuff) is based on old Fog4 code. Everything else (OTF, TTF, T1, VFB, suitcases, export of BDF fonts) is hadnled by FLS, which is improved over 5.x. OTF export is done with Adobe FDK 2.5, so yes, you can add GPOS stuff there.</p>
      <p>Hinting: T1 glyph autohinting is done with Adobe algorithms. FLS code is not used. Font-level hints are generated by FLS algorithms in most cases, with one exceptions for alignment zones: in dialog box for their editing old Fog4 code is used (which is good and which is fixed compared to 4.7). Conversion of T1 hints to TT instructions is done by our code, the same that works in FLS5. </p>
      <p>Bitmap generation (if you need that): as Adam said earlier, Fog5 uses native rasterizers when you generate NFNT bitmaps on export of suitcases (T1 or TT). Internally, in the UI it will run old rasterizer, unchanged since 4.1. </p>
      <p>Windows and Mac: two versions are equal with one exception: you cannot import and export mac-format fonts (LWFN T1s and T1/TT suitcases) in Win version. That will be added later if all goes well (and if anyone will ever need it).</p>
    html_clean: |-
