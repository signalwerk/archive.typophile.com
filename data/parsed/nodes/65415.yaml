    html: <p>I can't speak for Nick Shinn, but I use Fontographer for importing EPS files, basic housekeeping, and rough spacing. In FOG, with simple keystroke combinations, I can add extrema, correct path direction and remove overlaps 1-2-3. FOG also lets you perform rotate and flip operations to composite characters, which can be handy at times. However, for the industrial-strength work, I generate a Type 1 font file, then open it in FontLab. FL5's whole-em-unit point placement and extra levels of zoom allow for a much higher degree of fine-tuning than FOG allows.</p>
