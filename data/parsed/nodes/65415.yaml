    html: |-
      <p>Still tinkering — but overall I'm very pleased with the new version. Fast and snappy, and thankfully installs with those goofy sounds OFF as a default. And the display is so much smoother.</p>
      <p>I like that you can pick, say Latin Pro encoding (SC, I assume, means it has glyph slots to draw small caps — this is not explained in the manual). I wish that the font window would label these extra slots with the names of the intended characters instead of "**". You can see the names when you open the outline windows, but I hate having to hunt for stuff.</p>
      <p>I always thought Fontographer's kerning assistance was more intuitive than FontLab's class-based kerning. However, I know there are limits to how many kerning pairs a program will recognize, hence the necessity for class-based kerning in OT fonts with many glyphs. I don't yet know how a complex OT font generated by the new Fontographer will work with, say, MS Word (the worst offender when it comes to arbitrarily tossing out kerning pairs). Experience will tell.</p>
      <p>Also, it would be helpful if Fontographer would automatically generate certain OT features — or at least be able to allow a user to select certain pre-set OT features. I see no reason why — if a font contains things like small caps, ligatures, discretionary ligatures, OSF, historical forms, ordinals, fractions, etc — that the program shouldn't automatically know that it should include these features when generating an OT font (providing the glyphs adhere to a standard naming system). And a user should also be able to select optional features, like case-sensitive forms. These sorts of things are only a few lines of code each, and common enough that the program should be able to handle this without the interface becoming cluttered. Apparently, this is in the works.</p>
      <p>Anyway, I'm very happy to be able to create OT fonts in Fontographer. Leslie Cabarga's book made FontLab a lot easier, and maybe I'll need to finish up my OT fonts in FontLab for now. It's a pleasure to work again in Fontographer tho. I never have to look anything up!</p>
