      <p>Two days into Fontographer 5 and I've still got a smile on my face. You've done a wonderful job — it looks beautiful, it feels great to use, and all the old keyboard commands are with my slippers, pipe and rocking chair next to the dog. Thank you FontLab for keeping faith with the faithful and breathing new life into our worthy old friend. I'm sure it can't have been easy to consolidate old and new coding, improve the functionality yet still retain the essential identity and superbly intuitive drawing tools of Fog, but you have succeeded, and I send you a big, heartfelt thankyou!</p>
