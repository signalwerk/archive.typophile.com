    html: "<p>Gerald, here is the formula in case you have styles in Photoshop 5.5. <br>Bevel/Emboss &gt; Pillow Smooth &gt; 390% &gt; Size 2 &gt; Soften 4 <br>Inner Glow &gt; 100% Opacity &gt; Solid Color (choose your own) &gt; Technique: Percise &gt; Source: Center <br>Inner Shadow &gt; Multiply Black &gt; 75% &gt; Distance 7 &gt; Size 7 <br> <br>This will give you a good starting point. When you make the effect put the type above your wood image and change the blending effects to Multiply</p>"
    html_clean: "<p>Gerald, here is the formula in case you have styles in Photoshop 5.5. <br>Bevel/Emboss &gt; Pillow Smooth &gt; 390% &gt; Size 2 &gt; Soften 4 <br>Inner Glow &gt; 100% Opacity &gt; Solid Color (choose your own) &gt; Technique: Percise &gt; Source: Center <br>Inner Shadow &gt; Multiply Black &gt; 75% &gt; Distance 7 &gt; Size 7 <br> <br>This will give you a good starting point. When you make the effect put the type above your wood image and change the blending effects to Multiply</p>"
