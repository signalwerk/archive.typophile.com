    html: |-
      <p>Thanks for including me in your research and for all the images/links! Here's some others that I've run across (thanks to Lindsay Ballant for some new ones) for your use:</p>
      <p>Letterror is sort of the granddaddy of programmatic type (though I'm sure someone's going to object to that). Specifically, <a class="freelinking external" href="http://www.letterror.com/foundry/beowolf/index.html" rel="nofollow">Beowolf</a> has randomized rough edges.<br>
      And the letterforms for <a class="freelinking external" href="http://www.letterror.com/portfolio/twin/index.html" rel="nofollow">'Twin'</a> are affected by the weather in the Twin Cities.</p>
      <p>Another older fella ;) is <a class="freelinking external" href="http://www.pcho.net" rel="nofollow">Peter Cho</a>, with <a class="freelinking external" href="http://www.typotopo.com/" rel="nofollow">Typo Topo</a></p>
      <p>You should definitely check out <a class="freelinking external" href="http://www.scriptographer.com/Gallery/" rel="nofollow">Scriptographer's Gallery</a>, featuring the work of <a class="freelinking external" href="http://www.jonathanpuckey.com/" rel="nofollow">Jonathan Puckey</a> &amp; <a class="freelinking external" href="http://www.scratchdisk.com/" rel="nofollow">Jürg Lehni</a>. Eye magazine did a feature about it a while back.</p>
      <p>David Reinfurt created an interesting feature for the design of Yale's architectural 'zine. He asked various designers to take a customized version of Hevetica Neue and make a new typeface from it using some form of alteration. Two examples of computational results were created by <a class="freelinking external" href="http://www.projectprojects.com/#H_HELV_NEUE" rel="nofollow">Project Projects</a> &amp; <a class="freelinking external" href="http://www.syntheticautomatic.com/activity.html#helvetica" rel="nofollow">Apirat Infahsaeng</a>.</p>
      <p>Former classmate Joshua Walton's <a class="freelinking external" href="http://babel.conflux.org/" rel="nofollow">Babel type</a> generator. <a class="freelinking external" href="http://joshua.conflux.org/portfolio/workImages/babel2.jpg" rel="nofollow">Example 1</a> <a class="freelinking external" href="http://joshua.conflux.org/portfolio/workImages/babel3.jpg" rel="nofollow">Example 2</a></p>
      <p><a class="freelinking external" href="http://www.ortho-type.it" rel="nofollow">3d type created in Processing</a>.</p>
      <p>More processing by <a class="freelinking external" href="http://www.caligraft.com" rel="nofollow">Ricard Marxer</a>.</p>
      <p>Still not so sure about Hudson-Powell's <a class="freelinking external" href="http://www.responsivetype.com/" rel="nofollow">Responsive Type</a>.</p>
      <p>Robotic type in Nikita Pashenkov's <a class="freelinking external" href="http://acg.media.mit.edu/people/nik/projects_n.cgi?alphabot&amp;screenshots" rel="nofollow">Alphabot</a></p>
      <p>agency:collective's <a class="freelinking external" href="http://www.agencycollective.com/projects.php?view=type&amp;id=container" rel="nofollow">Container Steganography</a>.</p>
      <p>While not typeface work, these German Students have using <a class="freelinking external" href="http://www.looksgood.de/log/2007/07/27/diploma-posters-indesign-scripting/" rel="nofollow">scripting in InDesign</a> to do some new methods of layout.</p>
      <p>That's what I've got at my fingertips, hope it helps!<br>
      -- JK</p>
