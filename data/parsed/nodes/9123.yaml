  html: <p>Hey everyone. I was getting ready to design and flow a book and I am looking for everyone's favorite typeface to use for book interiors. <br> <br>I've used Bembo at 9/13.5 as well as Minion, Slimbach, and Serifa. <br> <br>Anyone have any favorites or any suggestions?</p>
