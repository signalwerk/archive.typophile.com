      <p>I don’t think that you need a separate face for the headlines; the heavier weights of Meta provide a tremendous amount of contrast with the text weight, resulting in a design that’s highly functional and harmonious. Meat also fits into the “highbrow” category because it has warm, humanist characteristics that most neo-grotesques lack.</p>
      <p>The pullouts are creating tension that could be resolved by bringing the lines together into a single shape and providing a little more breathing room for ascenders and descenders at the top and bottom. </p>
      <p>For your second color, try something with a hint of aqua that provides a relaxing alternative to the orange/red scheme, and will also allow you to mix the colors as complements now and then. It will also work with the outdoor shots you’ll be using.</p>
      <p>Regarding your grid and advertisements, you’re already breaking pages down into more than two columns, so why not just bump up the number of columns for flexibility?</p>
