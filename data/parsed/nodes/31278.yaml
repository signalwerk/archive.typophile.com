    <p>Hi all</p>
    <p>I’m after some much needed inspiration. I’ve just started a new role as creative director, and as well as managing the studio, introducing and streamlining systems - I have 4 ongoing redesigns, 2 of which I am personally handling. I’ve spent the grand total of 4 hours intermittantly working up these roughs and need a critique.</p>
    <p>The brief is to revamp an existing Australian state-specific tourist guide (6 regions in all). The only constraint is that they currently sell into editorial 1/4 page ads, and so therefore I believe we need to retain a 2 col grid to place these. There are also a lot of 1/8 and 1/16 page ads which I have said need to go into a directory rather than be placed in copy. They want to position it as a high-brow title however are still selling ads to small b&amp;bs and, restaurants that ABC1’s simply won’t go near. </p>
    <p>I’m using meta, but want to introduce a serif for headlines - any suggestions?</p>
    <p>Also need to bring in a second colour which will run over all editions - something like a stone or fawn colour?</p>
    <p>It is really early stages just wanted to bounce it off you guys.</p>
    <p>Thanks for any suggestions + or - all helps!</p>
