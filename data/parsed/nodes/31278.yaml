      <p>Thanks guys!</p>
      <p>First off ABC1 is a British socio-economic grouping referring to the high-end of the market i.e. top earners, lots of disposable income, buy prestige brands etc.</p>
      <p>Thanks sincerely for the feedback. I have introduced Minion as a extra face - I agree that Meta is pretty good however the publisher still sees serifs as more high-end than a sans.</p>
      <p>Colour wise some of the states are blue so bringing in an aqua although great for the red and orange state colours won’t work with the blue ones. So I’m using a fairly ubquitous tan colour.</p>
      <p>Heres a reworked version - I couldn’t post another pdf hence the jpg</p>
      <p>Look forward to your comments</p>
