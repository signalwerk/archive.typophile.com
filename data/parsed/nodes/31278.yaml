      <p>Darren,<br>
      I did a search for ABC1 but didn’t come up with anything - is it tourist publication?<br>
      Aside from that I think that the use of one colour (brick red in this instance and tints thereof) and the consistent placement of the masthead could link all editions together. There is plenty of colour in the stock photos.<br>
      I wonder if a serif typeface might be more appropriate for the body copy? If the cover is advertised in the newspaper, the sanserif face should hold together better at a smaller size. The choice may also depend on the target market for this publication. For instance, a senior citizen’s version might need text to be set at a larger size and in a face with a low x-height. High-brow covers a fairly large group, IMHO.<br>
      I don’t like the reversed out pullquotes, they stand out a little bit too much compared to the other elements on the page. More emphasis could be given to the events in each state too. Sometimes, a tourist might base their trip around one event.<br>
      HTH</p>
      <p>David</p>
