      <p>Acording to <strong><a class="freelinking external" href="http://www.google.com/webfonts/specimen/Della+Respira" rel="nofollow">Google Web Fonts</a></strong> page:</p>
      <blockquote><p>Della Respira a revival of the Della Robbia typeface by American Type Founders (ATF).</p></blockquote>
      <p>Della Robbia is currently published by both <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/della-robbia/" rel="nofollow">Bitstream</a></strong> and <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/tilde/della-robbia/" rel="nofollow">Tilde</a></strong>. MyFonts.com has no reference to ATF and no design date for either of those.</p>
    html_clean: |-
