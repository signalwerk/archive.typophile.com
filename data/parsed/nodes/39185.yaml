    <p>Hey all!  I've lurked around here for quite awhile but never really posted anything.  Nevertheless, I've found it very enriching to read your critiques and watch the creative process at work.</p>
    <p>My brother and I are in the process of starting up a graphic design / fine art company, and I'm trying to finalize a logo.  We're planning to do a wide variety of things, from basic design work (identity, signage, etc.) to music-oriented work (gig posters, album art) to more traditional artwork (painting, murals).  We both tend toward "quirkiness" in our work, I guess you could say.</p>
    <p>I've sketched out a bunch of ideas, and this seemed to be the strongest to me.  I'm reluctant to explain myself too much, because I really want to see what comes across to you through this logo.  Needless to say, it's not strict typography.  Any suggestions are much appreciated!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/reinvention_design_idea_3456.png"></div><p></p>
