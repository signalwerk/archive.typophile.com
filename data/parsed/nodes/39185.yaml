      <p>I like your logo, it rocks.<br>
      The socket of the lightbulb is screwed into the word design like you are saying "screw design". Reinvention is exactly that, and spelling it out in your font of choice is perfect for the concept. I get the idea!?<br>
      Thin strokes, like those in the middle of the lightbulb, will be hard to print in smaller versions and then the lightbulb might look like a sun. You could do something to the "DESIGN" as it do not look as good as the "REINVENTION", maybe try to make it more related by removing the serifs on the "I" (but that might go against the concept?).<br>
      Great colors!<br>
      Love it! Well done and best of luck!</p>
