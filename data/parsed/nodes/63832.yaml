    html: <p>To help illustrate what is going on let's rotate the text back to a straight line for a moment. As you'll see the text is 'skewed' to the right... in this case 20 degrees. After the skew has been applied the text block is rotated 20 degrees to match the skew angle. This will keep the vertical alignment of the type at 90 degrees while producing the results you desire.<br><img src="/sites/default/files/old-images/Press-Tutorial_5788.gif"></p>
