    <p>Hi everyone</p>
    <p>I've been reading and learning allot here on the forum and today decided to join in, i'm a first year graphic design student and was wondering if maybe someone here could help me out on "how to" do a retro or old style kind of effect in indesign. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nedwright6_5195.jpg"></div><p></p>
    <p>i tried doing this with type on path but i get a completely different look, here it looks as if the type is already slanted and put on a path (maybe?) I'm really still figuring allot of Indesign out and learning as i go, really hope you fine people could give me some good pointers on how to achieve this effect</p>
    <p>Also if someone knows witch font is being used that would be cherry's on top  </p>
    <p>Appreciate all the help!!</p>
