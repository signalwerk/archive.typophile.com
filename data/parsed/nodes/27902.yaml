    html: |-
      <p>When I first tried to enter the info on Apple’s Battery Recall page it didn’t work. I think this must have been because so many people were trying to access the site at the same time because the battery I was checking fell in the s/n range. Then a few days later I tried again and it worked. I am now waiting on a new battery.</p>
      <p>At first the pages wouldn’t load completely. Then, after I entered the information and clicked continue, the link timed out. Later, the link worked but it said the battery s/n was invalid. A few days later I tried again and everything went through.</p>
      <p>The point is, if your battery s/n is within the specified range, but you got a message declaring it invalid, perhaps you should try again.</p>
