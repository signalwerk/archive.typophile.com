    <p>Caused by Sony battery cells in G4 Powerbooks, IbooksG4 and 15in MacBook...</p>
    <p>Mine is one and in the range but Apple’s website checker said my number is invalid.</p>
    <p>affected battery model: A1079<br>
    affected range: 3K428 - 3K611</p>
    <p>Mine is A1079 and serial number 3K441.. but their stupid website said the number is invalid. </p>
    <p>Anyone else have an affected battery but Apple’s website say’s the serial no. is invalid?</p>
    <p>Dell and some HP laptops have also had a Sony based recall.</p>
