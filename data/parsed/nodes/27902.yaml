      <p>To clearify your battery might be in the range but may not be manufacturered with Sony parts.</p>
      <p>Ie. 3K428 - 3K611 is the range for my PowerBook battery. My battery starts with 3K441 which is in the Apple recall range. The website said the number was invalid. Calling Apple they said that even though it is in the range some batteries in the range are made by different manufacturers and not affected. </p>
      <p>Also a Dell we have is also in the Dell recall list and the battery is listed but the Dell website also says the battery is not affected even though it is in their recall list.....</p>
