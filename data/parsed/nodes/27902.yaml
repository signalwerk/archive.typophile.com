      <p>you should remove the battery by turning the screw thing on the bottom to release the battery.</p>
      <p>on the back of the battery will be the battery model and serial number.</p>
      <p>Check your numbers against the ones on <a href="http://www.apple.com/support/" title="www.apple.com/support/">www.apple.com/support/</a>  Then select the link from ’Exchange and Extensions’ and ’Battery Exchange’ </p>
      <p>There you will find the models affected and the serial numbers affected.</p>
      <p></p><div class="imageWrap"><img src="/files/battery_12inch_pbook_large_4852.jpg"></div><p></p>
