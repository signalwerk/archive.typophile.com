    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : FF Maiola</strong></p>
    <p>Designed by <a href="/wiki/Veronika%20Burian" class="freelinking" rel="nofollow">Veronika Burian</a> in 2003-04. Released as a <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a> in 2005.</p>
    <p><strong>Notes from FSI</strong></p>
    <p>FF Maiola was born as part of Veronika Burian’s MA in Typeface Design at the <a href="/wiki/University%20of%20Reading" class="freelinking" rel="nofollow">University of Reading</a>. Although a contemporary typeface, it retains strong links to historical models by implementing old-style features and calligraphic forms. Sources of inspiration include Czech type designers <a href="/wiki/Oldrich%20Menhart" class="freelinking" rel="nofollow">Oldrich Menhart</a> and <a href="/wiki/Vojtech%20Preissig" class="freelinking" rel="nofollow">Vojtech Preissig</a>, whose works display both vigor and elegance. Still, the intention was not to follow their path, but to define a personal interpretation. Maiola bears its idiosyncrasies with care and imparts the concepts of irregularity and angularity in a beautifully discrete way.</p>
    <p><a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> technology adeptly combines typographic features such as small caps, lining and old-style figures, both tabular and proportional, ligatures, alternate characters, case-sensitive variants, and fractions. In addition to the regular Latin character set, Maiola Pro includes Central European, Cyrillic and Monotonic Greek characters.</p>
    <p>In 2004 FF Maiola received the “Certificate of Excellence in Type Design” award from the Type Director’s Club (<a href="/wiki/TDC" class="freelinking" rel="nofollow">TDC</a>). </p>
    <p><strong>External Links</strong><br>
    <a href="http://www.fontshop.com/search/?q=FF%20Maiola" rel="nofollow">FF Maiola at FontShop</a><br>
    <a href="http://www.fontshop.com/features/newsletters/jul2005/" rel="nofollow">Release Announcement</a></p>
