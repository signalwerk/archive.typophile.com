    html: <p>You are limiting yourself with this concept. A hard horizontal isn’t going to work for all applications. Try AAN with a star (or a few stars) with the name stacked under it in 3 lines. By doing this you can over time establish AAN star(s), as their look much like the Dallas Cowboys. I guess what I’m saying is you are being to literal.</p>
