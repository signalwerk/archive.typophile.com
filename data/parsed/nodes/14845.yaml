    <p>Alot of you are familiar with my previous Fiberpack Audio design. Now I am working with one of their competitors (hey I couldn’t say no) to design their logo. The name is Andromeda Audio Networks. There is a much better visual potential here, namely the metaphor of constellations as networks. Just looking for some comments on my first hack at it. Thanks!</p>
