    html: |-
      <p>The current treatment of the stars is a natural looking one, however you may well run into problems when this logo has to be used at smaller sizes than shown in your example. Issues such as dot gain and variable pressmanship may cause these fine details to fill in on printed matter, and will also suffer when used on screen. Adopting an approach which uses larger, stylised pointed star shapes would be both punchier and more robust.</p>
      <p>I would get rid of the tan colour for the constellation, and design the logo in black and white only until you are completely happy with the shapes. For colour variations you could consider replacing the black of the sky with a very deep blue.</p>
    html_clean: |-
      <p>The current treatment of the stars is a natural looking one, however you may well run into problems when this logo has to be used at smaller sizes than shown in your example. Issues such as dot gain and variable pressmanship may cause these fine details to fill in on printed matter, and will also suffer when used on screen. Adopting an approach which uses larger, stylised pointed star shapes would be both punchier and more robust.</p>
      <p>I would get rid of the tan colour for the constellation, and design the logo in black and white only until you are completely happy with the shapes. For colour variations you could consider replacing the black of the sky with a very deep blue.</p>
