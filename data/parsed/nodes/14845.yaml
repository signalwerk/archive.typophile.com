      <p>Yeah, what Dan and others have said. Make the stars/constellation the focus. The mountains are extraneous.</p>
      <p>The constellations/networks thing is good, but you’re not emphasizing it enough. Perhaps you could design an interesting network-ish web of connections, with a central emphasized shape that looks like an ‘A’? Maybe?</p>
      <p>Dunno, but Andromeda’s a galaxy, not just a constellation, so I think of <a href="http://www.science-explorer.de/astronomie/space-andromeda.jpg">this</a> and <a href="http://www.starshine.com/frankn/astronomy/images/Andromeda.gif">this</a> more than the form in your first design.</p>
      <p>The typeface is interesting. Though I guess it’ll change with the different concepts.</p>
