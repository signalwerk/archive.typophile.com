    html: |-
      <p>Andromeda, daughter of Caseopea, was chained to a rock to die as penance for her mother’s insults to the gods. She was rescued by Perseus.</p>
      <p>That theme was not to uplifting or appropriate for a corporate logo, so I thought I’d just stick with the constellation. Unfortunately, as you can see, the constellation of Andromeda leaves much to be desired. I’m having a hard time coming up with something interesting that can stand alone with just that silly V shape.</p>
