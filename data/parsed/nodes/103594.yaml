      <p><em>Tittles and diacritics: I took that straight from the source that way, but of course I'm not obliged to reproduce it faithfully</em></p>
      <p>Indeed, the medium of the original dictated such Tittles and umlauts, but that's not the case with your font so it looks more arbitrary. I can see some of the quirky appeal you're talking about but I also find them confusing and distracting. </p>
      <p>On the /U/u/, if you don't want a downward stem on the right (and I can see why you don't) just de-pointify the bottoms as much as you can without losing the triangular character.</p>
