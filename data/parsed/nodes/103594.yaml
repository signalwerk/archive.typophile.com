      <p>Alright, I found a clunky but workable way of exporting my paths from Glyphs to FontForge, expanding them there, and re-importing them to Glyphs for finishing.  I put up a provisional Behance page for illustration:</p>
      <p><a href="http://www.behance.net/gallery/Blumenkind-a-bright-utopian-script-font/10159067" title="http://www.behance.net/gallery/Blumenkind-a-bright-utopian-script-font/10159067">http://www.behance.net/gallery/Blumenkind-a-bright-utopian-script-font/1...</a></p>
      <p>And here are two of the posters for the click-lazy among you.  ;o)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bposter01_cut_5924.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Bposter03b_cut_4081.png"></div><p></p>
      <p>As you can see, I went with a monolinear approach for the default cuts — it seems to work well enough for Rolling Pen after all...  also, it makes the round stroke terminals look natural. I also made a heavily contrasted "calligraphic" cut with diagonal stress. I found sharp cutoffs at the stroke ends look the most natural there. </p>
      <p>I'm thinking of releasing Blumenkind in the next few days. Any last-minute thoughts?</p>
      <p>@ Dave: Adding stress in unexpected places sounds like fun, but also like more work than I was planning to put into Blumenkind. Perhaps an idea for a "Blumenkind Pro" further down the road...?</p>
