    html: <p>As far as expanded path fonts go, this has some potential. The terminals need a bit of tinkering to look more natural. If you're set on going down the expanded path route, I'd suggest only using this model for the lightest weight. Add some contrast in unexpected places (maybe thicker in curves, where the pen would slow down) and I think you'll have something interesting. It reminds me of fifties lettering on space themed adverts, and weird contrast seemed to be all the rage then.</p>
