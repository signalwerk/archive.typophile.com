    html: |-
      <p>@ Craig: Thanks for the feedback!</p>
      <p>Tittles and diacritics: I took that straight from the source that way, but of course I'm not obliged to reproduce it faithfully (for instance, I've made the {t} much nicer than it was). The {ü} was one of the letters I found most inspiring about the source, though.  I agree the overlapping forms are quite unconventional, and I could make Blumenkind more widely usable with more conventional diacritics. I might just make an alternate cut of the font for that, then. Good idea!</p>
      <p>Yes, the {UuVv} look too much alike for my taste, but I haven't found a satisfying way of resolving the issue. I certainly want to keep the current shape of {Uu}, which I find very attractive and in line with the font's design philosophy. That doesn't leave much space for {Vv} to be different, though. I don't suppose two crossed slashes would work... Then again, the {UuVv} distinction is probably not very crucial to readability in most languages, is it?</p>
      <p>I've given the inverted {G} a couple of tries on paper, and I don't like it much — it looks top-heavy and menacing. One reason why Blumenkind looks so friendly is its teddybear-like cuddly and bottom-heavy shapes. The current design of {G} also allows its bottom terminal to angle inwards with a minimum of tension on the bottom corner, which I like.</p>
