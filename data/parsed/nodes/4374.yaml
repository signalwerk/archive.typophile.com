    html: "<p>Grant's recent inquiry into this has prodded me back into action on this project. I had three books destroyed by an irresponsible paper cutter and it really sunk my sails for a bit. But I'm back in the saddle on it and hope to get the other books out before too long.  <br> <br>The short story on the project is this: One book disappeared the moment I gave it at TypeCon to an East Coast student, a second book has been to Russia (and back? I've lost this one as well, but heard it went to the last ATypI conference) and the third one, our most prosperous, has been bouncing around Brazil for months. I have some images to post on that one. <br> <br>In the meantime I've been building a new world-map flash engine to track each book and potential recipients in the vicinity, as a sizeable number of people would like to participate. <br> <br>If anyone has any sightings of the book(s) in question, please post it here. <br> <br>Last sightings: <br>Book 18: Alexander Bohn (East Coast) / 23 July 2003 - (email: <a href=\"mailto:bohnal@rpi.edu\">bohnal@rpi.edu</a> - Please help us track him down!)  <br>Book 19: Graziella Iacocca (Sao Paolo) / 21 Jan 2004 (our most active book to date) <br>Book 20: Vladimir Yefimov (Moscow) / 8 Aug 2003 (did this go to AtypI?) <br> <br>jb</p>"
