      <p>Yes, I have checked it using the Color Bridge - which I agree is a great investment. The problem was I didn't have a printed piece to reference for color so rather than just guestimate I wanted a starting point. </p>
      <p>I was just doing this as a favor for a friend, so whether or not the colors match exactly is kinda not really my problem. I gave her the disclaimer that there you never get an exact match between spot color and process. But even if the color's off it will look better in 2C spot than 4C.</p>
      <p>Thanks again, all.</p>
