  html: <p>Is there a way to convert a CMYK swatch to it's Pantone equivalent? I can do it the other way around but can't figure out a way to do this. I'm working with a 2C logo that was inexplicably created using CMYK and I'd like to convert it to a two-color design.</p>
  html_clean: <p>Is there a way to convert a CMYK swatch to it's Pantone equivalent? I can do it the other way around but can't figure out a way to do this. I'm working with a 2C logo that was inexplicably created using CMYK and I'd like to convert it to a two-color design.</p>
