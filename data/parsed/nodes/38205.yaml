    html: |-
      <p>"Try plugging the cmyk values into the color palette in Photoshop and then select the pantone guide"<br>
      This works sometimes...This direct convertion dont work almost everytime. And if the logo is to be printed them Its really a problem. The cmyk values must be corrected manually. If not you will have a diferent color! I have that experince in pantone 179 (a dark red) that converted directly to cmyk results in printed page orange!<br>
      This is really an issue!<br>
      So the best way is to ask to the print house a catalogue with cmyk values and them convert manually to the best value (eg that matches best with your pantone number).</p>
      <p>António</p>
