    html: <p>Get your hands on a Pantone Color Bridge and see the CMYK and Pantone equivalents side by side. Then you can see how similar/different the different colors are. Find someone who has this swatch book and borrow it to find this out. You might have to shell out for one, but it's worth it later on.</p>
