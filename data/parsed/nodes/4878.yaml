    html: <p>One thing to keep in mind about buying software on E*Bay is that there's a lot of piracy there. If you see somebody advertising Photoshop 7 for $50, then you should assume there's something wrong. Most commonly, it's either a pirated copy in the first place, or unregisterable because the person upgraded to the next version, and is (illegally) selling their previous version. <br> <br>I don't mean to tar all E*Bay software sales with that brush; there are plenty of good deals on old versions of software there. But sometimes, perhaps often, if the price seems just too good to be true, it is indeed too good to be true. <br> <br>Cheers, <br> <br>T</p>
