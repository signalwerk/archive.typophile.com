  html: <p>What are the legal issues involved with buying used softare? For instance, Ebay lists some older software (for those of us who still use Mac OS 9). Are there other places to get older software? <br> <br>What about transferring a font license from one person to another? <br> <br>Thanks, <br>Addison</p>
