    html: <p> Kudos, Jared on retaining some really fine nuances that are strikingly absent in most screen fonts. (Like you mentioned, the triangular A, the stacked a and g, the descending J. Further, typical fonts in this genre totally avoid the lower case. <br> <br>The ornaments are just icing on the cake and take the thing to the next level. <br> <br>(Stephen, I've been thinking the same thing.) <br> <br>//joe </p>
