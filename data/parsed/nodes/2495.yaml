  html: <p>Designed for use as button text on web sites, Benson Caps is my statement to the bitmap-caps conversation. Benson Caps seeks uniqueness by including a "Button" face, including various ornaments, connectors, and endpieces. <br> <br>I'm also intrigued by constructing the letters based on some of the historical texts I've read; traditional (triangular) A, two-story lowercase G, contrast the bowls of the P and R, the J descends, etc.  <br> <br><img src="http://www.typophile.com/forums/messages/29/229.gif" alt="caps"></p>
