    html: "<p> Jared, <br>Superb stuff! <br>You're designing for the medium, and there's nothing better. The button/border idea is *right on*, and I think you should definitely take it even further: beveled ones, multiple-outline ones, etc. <br> <br>As for the letters themselves, the regular caps are well made, but I have a problem with some of the alternates: I've never liked so-called \"unicase\" fonts - I don't think they're worthwhile; I think it would be much better to provide true alternative cap designs. Small bitmap fonts really benefit from usable alternates. <br> <br>Allow me to make these suggestions for the alternates: <br>A: Make a round-top one. <br>E: Make one with rounded corners. <br>G: It's too tall. The only bicameral \"g\" that <br>   works at 6 pixels high is the Koch form. <br>L: Give it a longer base - it could be useful at the <br>end of a word. (Set the right sidebearing flush.) <br>M: Make a round-top one, with a hanging middle stem. <br>Q: Don't change a thing! <br>S: Make a wider one? <br>T: Like the \"L\", make a version that spans wider. <br>U: Super! <br>W: Make one with the middle going full-height? <br>Y: This form is a favorite of mine. <br> <br>BTW, the descending \"J\" is brilliant. You might consider doing that with the \"G\" as well, probably as an alternate. And the \"P\"-\"R\" distinction is great. For the numeral \"3\" I'd pull in the middle bar. <br> <br>All in all, you have a winner. <br>Go all the way with it. <br> <br>hhp </p>"
