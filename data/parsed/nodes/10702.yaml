  html: <p>My original inspiration derived from xerox waste sheets that I found interesting imagry on. From this I proceeded to build letterforms out of a specific section comprised of three images.  <br> <br>The conceptual idea was to try to hold on to the destructive quality of xerox duplication and cohesively form a systematic display face that can be used at small and large point sizes. <br> <br>Any input is greatly appreciated,  <br>Thanks<img src="http://www.typophile.com/forums/messages/29/7447.gif" alt="xero"></p>
