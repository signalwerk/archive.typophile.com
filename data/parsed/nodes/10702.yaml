    html: <p>poor frankie, no posts.  <br>i think the overall attitude of this is pretty visceral, but the thickness of the forms makes it more approachable; like it's gritty but not in a scary way. it's surprising how well it holds up at that 12 pt size, which is real nice. i think the 3 needs a clearer middle horizontal stroke (not crossbar, but you know...), the "xero" title has the R shifted downward, but it's higher in the sample below. i think the lower position is nicer, and you may try that with a few u.c. and l.c. glyphs for a tiny bit more variety. </p>
