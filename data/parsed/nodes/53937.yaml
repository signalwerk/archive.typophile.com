      <p>Hi,</p>
      <p>&gt;(Hey, I think I spotted the original Filmotype Ginger a little ways in on a poster design.)  WHAT IS/WAS FILOTYPE?</p>
      <p>&gt;First I thought “what kind of a clock that may be?”, then I realized that the image is mirrored ;-)  NO, THIS WAS NOT DONE IN A MIRROR, EACH CHARACTER WAS STRUNG FROM THE CEILING WITH FISHING LINE, I  VISIT PERIODICALLY WITH DON SMITH WHO PRODUCED THIS AND 2 VISITS AGO HE TOLD ME HOW HE DID THIS SHOT.  THIS WAS ORIGINALLY A 35MM SLIDE SHOW WITH SYNCED REEL-TO-REEL AUDIO TAPE.  EACH SLIDE WAS ADVANCED (BY HAND WITH THE SLIDE PROJECTOR "CLICKER") ACCORDING TO A SCRIPT WHICH I HAVE.  THIS WAS PRODUCED  IN 1962.</p>
      <p>THE AUDIO WAS CONSERVED THEN CONVERTED TO DIGITAL BY SETH WINNER STUDIO IN LONG ISLAND AND THE 140, 35MM SLIDES WERE SCANNED HERE.  EACH FILE IS ABOUT 80M BECAUSE, SOMEDAY, WE'D LOVE TO CREATE A BOOK.</p>
      <p>&gt;MARK, I REMEBER THE GIZMO, TOO.  I'M SURE I BROKE THE ONE I USED BACK IN THE LATE 70s.</p>
