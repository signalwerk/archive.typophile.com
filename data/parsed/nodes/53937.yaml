      <p>Hi Nancy,</p>
      <p>I think Bonobo meant that the image you posted above is flopped (backwards). It's correctly oriented in the slide show video.</p>
      <p>Anyway, Filmotype was a headline setting machine that was popular in art studios in the late fifties through the sixties. I and some others have been reviving Filmotype typefaces over the last year or so.</p>
      <p><a href="http://www.filmotype.com/" title="http://www.filmotype.com/">http://www.filmotype.com/</a></p>
      <p>Thanks so much for posting the video. I really enjoyed it.</p>
