      <p>Hi Mark,</p>
      <p>I have the original one-line specimen Photo-Lettering book and lived by it way back when. I still think its organization is brilliant, by style.  Its such a good way to learn to recognize type too. </p>
      <p>For a while I would take Bob Rose out to lunches hoping to get the masters from him but he kept making noises about expecting a million bucks compensation for letting it go.  Eventually the smart kids at House Industries got the collection.  </p>
      <p>I love that you'all are converting other Filmtype typefaces.</p>
