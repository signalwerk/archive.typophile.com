      <p>I also spotted Glenlake (ad with the headline "CHANGE -- INGREDIENT OF PROGRESS").</p>
      <p>I did a double, and then a triple take when I saw this slide:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/proportionalscale_3728.jpg"></div><p></p>
      <p>1. It looks like a White Stripes CD cover.</p>
      <p>2. The gizmo in the guy's hand is a Scaleograph, an aid for sizing photos and art that was commonplace before computers made their way into design studios.</p>
      <p>3. According to the narrator, the guy in the photo, New Orleans designer Bob Brandt, invented it.</p>
      <p>I still have one of these hanging in my office for sentimental reasons. Sure enough, in small print it says: MFD. BY THE BRANDT CORP., NEW ORLEANS, LA.</p>
    html_clean: |-
