      <p>Thanks John for the reply.</p>
      <p>What if I only make the default encoded Unicode characters in Fontlab with nuqtas added to them, and dont do anything (ccmp or any type of decomposition) to these glyphs in VOLT, and compose rest of glyphs and nuqtas in VOLT..</p>
      <p>Is that a possible workflow?</p>
      <p>Thanks and regards.</p>
