      <p>Thanks bahman for the reply.</p>
      <p>From this discussion this far, I think the workflow goes something like this:</p>
      <ul>
      <li>Create all default encoded Unicode characters in Fontlab with nuqtas added to them.</li>
      <li>Decompose them in VOLT using CCMP feature.</li>
      <li>Add nuqtas to them again in VOLT using GPOS mark positioning.</li>
      <li>For all the other glyphs, only create a base glyph in FontLab, and add nuqtas in VOLT using CCMP feature.</li>
      </ul>
      <p>Please correct me if I'm making any mistake in the above list.</p>
      <p>Another question: I'll use mark positioning to add Nuqtas. Then again I'll use Mark positioning to add Diacritics. Wouldn't that be a problem?</p>
      <p>Thanks and regards.</p>
