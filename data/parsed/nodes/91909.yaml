    html: |-
      <p><em>I'll use mark positioning to add Nuqtas. Then again I'll use Mark positioning to add Diacritics. Wouldn't that be a problem?</em></p>
      <p>No, because you will use different named anchors for dots and for vowel marks (you may end up with more than one anchor for different numbers of dots, too). The other thing you need to cater for in this method is positioning of vowel signs relative to dots <em>when preceded by some letters but not by others.</em> In other words, sometimes you will want mark-to-mark positioning for the vowel signs and sometimes mark-to-base. And that is contextual.</p>
      <p>There's no denying that this approach introduces a lot of complexities, and I only recommend it for styles in which you need to be able to move the dots around.</p>
