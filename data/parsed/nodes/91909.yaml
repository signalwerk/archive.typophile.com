      <p>I'll use mark positioning to add Nuqtas. Then again I'll use Mark positioning to add Diacritics. Wouldn't that be a problem?</p>
      <p>Note 1: The operating system - like Windows - will deal with the Noqta as if it were a diacritic mark, if requested by coloring composition it will color Noqta with it.</p>
      <p>Note 2: You should test positions of Noqta to the letters and to diacritics with any GPOS you do, Noqta will be affected by it.</p>
      <p>Note 3: You will make a lot of GPOS tables - like John hinted - and it will be so complexity, so trying.</p>
      <p>We can benefit the experience of our friend Khaled Hosny, He has developed his font - Amiri -  by this way and he faced some problems.  </p>
      <p>best wishes<br>
      Badr</p>
