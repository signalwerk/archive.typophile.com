      <p>Thanks John and Badr for the valuable guidance.</p>
      <p>The font I'm working on for about 3 years is based on a reasonably complex naskh script.<br>
      Movable nuqtas is on of the top 3 requirements of the design. (to avoid collision of nuqtas in words like  النبيين، تتقون، تقتتل، تقول), currently I've made seperate glyphs for some common collisions and used CALT on them. The current approach is not at all working, as it only covers specific collisions. This led me to find some other solution.</p>
      <p>I found these very useful guide on Khtt.net.<br>
      <a class="freelinking external" href="http://khtt.net/attachment/31760" rel="nofollow">Part 1</a><br>
      <a class="freelinking external" href="http://khtt.net/attachment/33164" rel="nofollow">Part 2</a></p>
      <p>Amirifont.org is also very useful reference.<br>
      Khaled Hosny talking about THE PROBLEM : <a class="freelinking external" href="http://www.khaledhosny.org/node/178" rel="nofollow">Khaled's Blog</a><br>
      Thanks Badr.</p>
      <p>Thanks and regards.</p>
