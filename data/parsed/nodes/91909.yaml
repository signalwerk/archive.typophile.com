    <p>Hello,</p>
    <p>Somewhere on Typophile I read about adding dots (nuqta) to base glyph in VOLT.<br>
    This means instead of making glyphs for each combination of base glyph with dots in FontLab, you use VOLT to compose glyphs on the fly using a single base glyph.</p>
    <p>This has something to do with CCMP feature.</p>
    <p>I request anyone who has used this feature for the mentioned purpose to kindly share their experience.</p>
    <p>Thanks and regards.</p>
