  html: "<p><i>Posting this for AIGA Saint Louis:</i> <br> <br>AIGA St. Louis is honored to host renowned typographer, Doyald Young. On Friday, March 28 Doyald will talk about his commitment to letterforms as evidenced in the trademarks and logos he has produced for leading companies such as Prudential Insurance, General Electric and Hilton Hotels. In his lifelong career, he has produced countless logotypes and typefaces. In this lecture sponsored by Smart Papers, he will feature logos he has created for every letter of the alphabet as well as some fonts that he himself labels \"funky.\" <br> <br>Following his lecture is a luncheon and discussion session in which Mr. Young will share his design process, from sketches to critical thinking in designing a logotype. His latest books, Logotypes &amp; Letterforms and Fonts &amp; Logos will be available and are discounted 20% for the event. <br> <br>10:30a-12n   Lecture, \"A-Z: Corporate to Camp\" and \"Funky Fonts\", Q&amp;A <br>Open to the public <br>$10 AIGA Members <br>$20 Non-members <br> <br>The historic Chase Park Plaza, 212 North Kingshighway, St. Louis 63108 <br> <br>Seating is limited for both sessions. For reservations, send your name and contact information to <a href=\"mailto:cherie@maryville.edu\">cherie@maryville.edu</a>. Reservations received by March 7 will be entered in a drawing to receive a free set of Young's books ($140 value). <br> <br>See <a href=\"http://www.stlouis.aiga.org\" target=\"_blank\">http://www.stlouis.aiga.org</a> for more information on Doyald Young and the event. <br> </p>"
