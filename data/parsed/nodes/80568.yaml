  html: |-
    <p>dear friends typophiles!</p>
    <p>i looking for corporative typefaces of city and territory identities. </p>
    <p>if you know any special designed typeface for use in whole city, please let me know. generally i interested in maximal universal typefaces for all aspects of city life, but glad to know about special (like navigation) types too. </p>
    <p>what i found for now:</p>
    <ul>
    <li><a class="freelinking external" href="http://www.yanone.de/typedesign/amman/" rel="nofollow">Amman Typeface</a> by Yanone for Amman, Jordania</li>
    <li><a class="freelinking external" href="http://pampatype.com/php/2008/Tipografias_GR.php?secc=conc&amp;menu=menu_T_CO.html&amp;sub1=sub1_T_G_CO.html&amp;sub2=sub2_T_G_CO.html&amp;pag=pag_T_G_Concepto.php&amp;pag2=pag_T_G_C_Toulouse.html" rel="nofollow">Garonne</a> by PampaType for Toulouse, France</li>
    <li><a class="freelinking external" href="http://www.slaskie.pl/strona_n.php?jezyk=pl&amp;grupa=3&amp;dzi=1249389234&amp;id_menu=196" rel="nofollow">Silesiana</a> by Artur Frankowski for Śląskie region, Poland</li>
    <li><a class="freelinking external" href="http://www.molotro.com/ninzio.html" rel="nofollow">Ninzioletto</a> by Luciano Perondi for Venice, Italy</li>
    <li><a class="freelinking external" href="http://issuu.com/ruderman/docs/permiantypefaces_31.05" rel="nofollow">Permian</a> by Ilia Ruderman for Perm, Russia</li>
    <li><a class="freelinking external" href="http://www.gerardunger.com/fontstore/store-capitolium.html" rel="nofollow">Capitolium</a> by Gerard Unger for Rome, Italy</li>
    <li><a class="freelinking external" href="http://www.alessio.de/things/bmfchange_campaign.html" rel="nofollow">bmfChange</a> by Alessio Leonardi for Berlin, Germany</li>
    </ul>
    <p>and i want to know more ))</p>
