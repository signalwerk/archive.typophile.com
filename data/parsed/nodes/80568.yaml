      <p>Riccardo, you are thinking of Pieter van Rosmalen's <a class="freelinking external" href="http://www.caketype.com/custom/signing/index.html" rel="nofollow">Hangil E-Type</a>, the Latin component of the <a class="freelinking external" href="http://www.sandoll.co.kr//IR/project/road.asp" rel="nofollow">Hangil typeface</a> designed for road signs in Korea. Hangil of course includes Korean alphabet glyphs; Hong-Ik University and the foundry Sandoll were involved in the design. I didn't include this because it's not a city/territory thing.</p>
      <p>You can't really find Hangil in use in Seoul because the new signs use the Seoul typefaces. I had to go outside the city limits to Gyeonggi-do Province to see Hangil in use.</p>
