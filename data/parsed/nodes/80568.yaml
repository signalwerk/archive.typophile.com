    html: <p>The foundry <a class="freelinking external" href="http://www.yoonfont.co.kr/" rel="nofollow">YoonDesign</a> is credited with the Seoul typefaces. After some digging, it looks like YoonDesign president Pyun Seokhoon 편석훈 was the general director of the Seoul typefaces project and Park Yoonjeong 박윤정 the senior designer. Korean digital typefaces are invariably collaborative efforts, and a whole team would have worked on the design of the typefaces. It is for that reason that individual designers are rarely credited and information about the designers behind typefaces can be difficult to find.</p>
