      <p>When I was back in Seoul in February, I noticed a dramatic increase in the use of the <a class="freelinking external" href="http://design.seoul.go.kr/dscontent/designseoul.php?MenuID=490&amp;pgID=237" rel="nofollow">Seoul typefaces</a>, the semi-serif Seoul Han-gang and the sans Seoul Namsan.</p>
      <p>Here's a street sign in Seoul Namsan:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Namsan-sample_3967.jpg"></div><p></p>
      <p>Here's a display in the metro in Seoul Han-gang (sorry it's out of focus):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/han-gang-sample_4213.jpg"></div><p></p>
      <p>Elsewhere in Korea, the cities of Busan and Gimje have their own typefaces as does the province of Jeollabuk-do, though I cannot comment on whether they are in active use. But my favourite may be for the island province of Jeju-do, whose <a class="freelinking external" href="http://www.jeju.go.kr/contents/index.php?mid=010212" rel="nofollow">Jeju typefaces</a> include a serif, sans, and a funky display variant. These all support special characters needed for writing the Jeju dialect, which uses a vowel letter ㆍ that is obsolete in Modern Korean.</p>
    html_clean: |-
