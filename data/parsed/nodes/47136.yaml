      <p>It seems you already know the answer you want to hear. Why bother asking?</p>
      <p>Personally, I’d set it in a light <cite>geometric sans,</cite> all caps, without the tight kerning. Something like Futura Light, Kabel Light, Gotham Light, or Proxima Nova Light - with a nice round ’O’ and ’G’. But, since you obviously want a tightly kerned serif typeface, go with what you’ve got. It’s not terrible, but it’s not great.</p>
      <p> - Lex</p>
