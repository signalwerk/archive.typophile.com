      <p>I think the problem with the serif font is that it is too weak. I mean, you need contrast to make it work. So you have a symbol that is very geometric, sharp angels and straight lines. So you either need something that mimics that style or something that complements it. Just a regular everyday serif font isn’t going to serve this symbol well. It needs a strong type to mirror it’s strong build.</p>
      <p>courtney</p>
