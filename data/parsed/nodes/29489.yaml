      <p>The question was about female typographers, the respondents have moved sideways towards type designers. One can be both, but not usually. Type designers are rarely typographers. More rarely–good ones.</p>
      <p>Some names of notable female typographers, Línea Gentry, San Francisco, Edna Beilenson, Peter Pauper Press, Bertha Goudy. I do not have a reference including memory but John Henry Nash worked with an excellent female typographer in his plant.</p>
      <p>Not to mention Fiona Garrick. Although many typographers remain nameless it was not uncommon to have female typographers in the hot metal days.</p>
      <p>Giampa</p>
