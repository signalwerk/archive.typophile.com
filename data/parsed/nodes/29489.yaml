    html: <p>Amelia Bloomer (she of the rational dress movement) became the first female publisher of a newspaper in the US, The Lily, this was around 1850. I recall reading that she was involved in a battle to get women typographers working on it, but forget where I read that. In "The Origins of graphic design in America" perhaps.</p>
