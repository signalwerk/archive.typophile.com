      <p>- <a href="/wiki/Clotilde%20Olyff" class="freelinking" rel="nofollow">Clotilde Olyff</a></p>
      <p>She used to design typefaces but she also created logos, stamp for the belgian postal service, sculpture inspired by letters, beautiful wooden objects and a lot of other things.<br>
      An exhibition of her work is being held in Brussels but the website shows very little of the content :<br>
      <a href="http://users.skynet.be/rouge-cloitre.ca/clotilde_olyff,_biographie.htm" title="http://users.skynet.be/rouge-cloitre.ca/clotilde_olyff,_biographie.htm">http://users.skynet.be/rouge-cloitre.ca/clotilde_olyff,_biographie.htm</a><br>
