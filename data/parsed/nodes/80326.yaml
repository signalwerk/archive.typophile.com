  html: |-
    <p>Hello everyone,</p>
    <p>I am looking for a good, legible in windows, body text serif companion (a web font and one free, not from a paid service for technical reasons) for <a href="http://tinyurl.com/n7mrhv" rel="nofollow"> League Gothic</a>.</p>
    <p>This is for a magazine-type website, I want a modern but austere look, with league gothic set in all caps for titles and meta and  the actual content of the site in a serif. </p>
    <p>One I thought of is Georgia, but I don't know if they combine well, what do you think? Actually i would prefer a less common choice, maybe Droid Serif? Is it a good choice to pair with League Gothic?  </p>
    <p>Any opinions and options is appreciated. </p>
    <p>Thanks in advance</p>
