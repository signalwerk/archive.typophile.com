      <p>Hmm, if you want something in the general direction of Helvetica but fresh and not as tired – how about <a href="http://www.typetrust.com/font/breuertext" rel="nofollow">Breuer</a>* maybe? (There's also a <a href="http://www.typetrust.com/font/breuerheadline" rel="nofollow">Headline variant</a>.) Or <a href="http://new.myfonts.com/fonts/device/paralucent/" rel="nofollow">Paralucent</a>? Warmer / less tech-y: <a href="http://www.klim.co.nz/national_samples.php" rel="nofollow">National</a>? If you want less quirky and more geometric/clean, maybe look at <a href="http://commercialtype.com/typefaces/graphik" rel="nofollow">Graphik</a>, and <a href="http://www.klim.co.nz/founders_samples.php" rel="nofollow">Founder's Grotesk</a>. </p>
      <p>These are just a few that popped into my mind, there are many more…<br>
      Maybe also look at the <a href="http://www.fontshop.com/fontlist/alternatives/helvetica/" rel="nofollow">Helvetica Alternatives Fontlist</a> over at FontShop.<br>
      (* Be sure to read the EULA, IIRC Typetrust requires special licenses for logos and such.)</p>
