  html: |-
    <p>Hey everyone, </p>
    <p>I decided to rework the visual system of a personal web project of mine from scratch, and am having problems deciding on a new logoface for it. Right now I'm just using Helvetica, but I'm looking for something with the same sturdiness and transparency, but a little more playfulness and character. The site focus is images and video, so the interface, and ultimately the visual system as a whole, should disappear when it needs to.</p>
    <p>The site is social, and this would pretty much be the logotype.</p>
    <p>I'm kind of liking Brauer Neue, but I know that I can do better. I was hoping someone might have some suggestions. Already went through a few foundries websites and came up with nothing.</p>
    <p>Thanks a lot!</p>
