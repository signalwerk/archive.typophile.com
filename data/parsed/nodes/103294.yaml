      <p>In print, I often resorted to increasing the word space in the last line of a justified paragraph. It occurs to me that this could be done by an algorithm that bases last line spacing on an average of the space value for the whole paragraph.</p>
      <p>On topic, wouldn't a "justify last line" setting be more useful than "center last line"?</p>
      <p>And most obviously, hyphenation!</p>
