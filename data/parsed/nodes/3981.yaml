    user: 2021
    date: 2004-03-28T13:33:00
    date_raw: 28 Mar 2004 — 1:33pm
    votes: null
    html: <p>Sounds like you have "smart quotes" checked in the Quark preferences, which causes the "stupid" quotesingle and quotedbl to be replaced by the curly quote marks. If you have no glyph in these character positions, it will seem as if the "stupid" quote marks aren't working.</p>
