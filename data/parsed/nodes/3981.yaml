  html: <p>Hi guys, <br> <br>I have a problem with Fontographer. My quotesingle and quotedbl don't work in Quark. They work in FOG, but when I generate the font, they don't work. <br>The fill colour is OK and the font is generated as a macintosh postscript 1 with a NFNT bitmap output. <br> <br>Has anyone else had this problem before? <br> <br>Thanks in advance, <br></p>
