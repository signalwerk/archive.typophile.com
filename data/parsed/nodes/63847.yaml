      <p>I for one don't like the look of tabular lining numerals shifted up and down, I've seen it in one or two fonts before, but it just looks clumsy to me. Anyway: if you want to pursue this direction, I would definately not take the lower case "o" as zero. Rather I would use a perfect circle to make it clearly distinctive. BTW, for another example of gothic with oldstyle figures look at ITC Franklin Gothic book condensed. </p>
      <p>But why not go for another alternative. <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/bell/" rel="nofollow">Bell</a> uses numerals that are ±75% the height of the caps, therefore making them stick out a lot less. It is a rather easy modification to make, and I think it works well in texts. There's probably other examples of this (and a fancy name) but I can't come up with them now.</p>
      <p>greetings Jeffrey<br>
      <a class="freelinking external" href="http://www.infraordinaire.com/wordpress" rel="nofollow">infraordinaire</a></p>
