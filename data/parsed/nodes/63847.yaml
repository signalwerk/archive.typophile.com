    <p>I am looking to parachute old-style numerals into Helvetica, as part of an effort to use a modified version in a Corporate ID.  </p>
    <p>So far, I've been looking at kerning pairs, quote marks, parentheses, ampersand, etc etc in FontLab, and I would love to have proper numerals but I don't quite presume to be able to draw up my own at this point—especially given that they will see heavy use in text applications. </p>
    <p>But I wouldn't mind playing with the size and placement of existing numerals, which I have enough time and confidence to attempt.</p>
    <p>Thought Typophiles might find this interesting - - any suggestions?</p>
  html_clean: |-
