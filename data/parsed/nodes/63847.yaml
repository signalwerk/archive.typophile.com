      <p>I don't think that using the "French" scheme of numerals would be such a good idea. By applying OsF to a grotesque, you're making a statement - ironic, perverse, whatever. This statement should be clear, so as to become somewhat unobtrusive after the first moment of surprise. By using that quite unusual scheme of numerals you're introducing a second level of typographic sophistication, if you will, that muddles the original point and makes the solution rather less efficient (unless your target public is the Typophile crowd).</p>
      <p>Agree with Hrant about the inappropriateness of the perfect circle. That's a Neogrotesque, not a Geometric Sans.</p>
