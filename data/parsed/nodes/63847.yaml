      <p>Riccard0 - thanks for that; very cool find indeed. A cursory look at the numerals has me convinced that their starting point is the same as my own proof-of-concept : i.e. they've shifted most numerals up or down, used the <em>lc</em> ‘o' as the zero, shortened the 1 and winged a 2.. </p>
      <p>I will have to take a look at its behavior, because the snags I ran into upon investigating my own 'faked' versions is that there is no end of trouble arising from the 1,2, 3 &amp; 7 in terms of their tone in a body of text and 'visual' x-height—especially apparent at smaller sizes. I see their 2 is dramatically different. It's either that they compressed the 2 or that they know something I don't. I'll take a look - thanks;</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/HelveticaOldStyle_5319.jpg"></div><p></p>
      <p>BTW : I wouldn't want to discourage other suggestions. The idea that there will be numerals that ARE Helvetica is not necessarily the end-goal here... Otherwise, I'd be fighting that battle and not be asking typophile.. It would be valid just to arrive at a selection of numerals that function in the same way as an italic, or a different language, might inside latin text..</p>
      <p>Thanks again Riccard0</p>
