      <p>Thanks for the very useful discussion.</p>
      <p>Miss Tiffany : believe me, I hear you... To assuage some of the skepticism a bit further ( and save some face, lol ) let me explain that the thinking behind this has been to co-opt the, yes, commercial, ‘inclusive' qualities Helvetica can imbue, yet arrive at a singular and unmistakable application of it. There is an element of fun and irreverence intended, which is central to the brand being developed : a fashion house’s lower-cost product line. </p>
      <p>As I said, the Helvetica mandate comes straight from the client, but not out of a place of ignorance : the very idea is taking generic, base elements which may not be ‘ideally suited for the job' and elevating them through decisions made in their use and juxtapositions. A certain level of garishness will ensue if all goes to plan, which will hopefully be part of the charm. That said, we also need good function and so I find great value in a lot of the information here - - the French scheme and Bell scale are both very appetizing indeed...</p>
      <p>Thanks again to all!</p>
