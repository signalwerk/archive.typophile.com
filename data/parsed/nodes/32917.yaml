      <p>I’m not an expert, but I understand InDesign’s situation like this:<br>
      1. Adobe wanted to have it truly cross-platform, and because Microsoft’s and Apple’s implementations -- Uniscribe and ATSUI/Core Text -- are different, Adobe had to create a third one for itself.<br>
      Also, they can’t use the AAT font technology that Apple used or uses for its Indic script support.<br>
      2. Because InDesign has very sophisticated typographic possibilities, it’s much more difficult to integrate Indic-script support in it than in a simple text editor. Although I guess that, if they had planned it for complex scripts from the start, things would have been easier.</p>
      <p>Hope that helps to clear the air...</p>
      <p>For the time being, a way of using InDesign for Indic scripts is to use non-Unicode fonts. There is FontSuvidha for converting Unicode Devanagari to many other encodings; I don’t know if there are similar programs for the other scripts.</p>
