      <p><em>That said, I was intrigued by the earlier post about Thai script. Does InDesign handle this script completely, or does it leave it to Uniscribe’s grace when the text is marked as “no language”?</em></p>
      <p>I believe the support for Thai is entirely internal to InDesign; it does not rely on Uniscribe. We originally developed the Adobe Thai fonts for Acrobat forms, and in that context I believe support was, at least initially, via Uniscribe. But as I understand it the InDesign CS3 developers then added support for Thai internally.</p>
      <p>Thai is relatively easy for Adobe to implement within their existing layout architecture, because there is only on instance in which a single character (sara am) needs to be represented by more than one glyph, and this can be handled as a buffered character substitution since the two parts are also independent characters (sara aa, nikhahit).* So Thai does not require any one-to-many glyph substitutions, which are the big stumbling block for Adobe.</p>
      <p>*Uniscribe also handles this as a buffered character substitution.</p>
