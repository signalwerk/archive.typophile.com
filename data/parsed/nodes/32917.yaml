      <p>Jenny, there are two issues here: one is that CS2 does not support Thai layout at all, and the other is that the Mac OS X Thai fonts are probably AAT format rather than OpenType, i.e. they use Apple's own layout intelligence model rather than OpenType's, which means that they will also not work in CS3 or anywhere else in Adobe apps.</p>
      <p>So if you want to use those particular fonts then you will need to set the text in a Mac app that uses AAT layout. What you might be able to do is to set individual blocks of text in such an app, export or print them to PDF, and then embed the PDFs in your InDesign app as graphics. This is what I do when I need to include text in InDesign documents using scripts or font formats that are not supported by Adobe.</p>
      <p>Another option, if you don't mind updating your software and switching fonts, would be to install InDesign CS3 and use some OpenType Thai fonts. The Adobe Thai font family ships with Acrobat 7.0.5 and later (look in the Acrobat/Fonts folder) and is good for text. Linotype have just launched OpenType versions of their classic Sukothai and Sirichana typefaces.</p>
