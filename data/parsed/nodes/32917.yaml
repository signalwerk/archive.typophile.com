      <p>As the engineer on InDesign who added improvements for Thai in CS3, I want to be as clear &amp; honest as I can. We took some steps towards Thai support in InDesign, but we do not claim to have reached our minimal level of support (yet). The same is true for other scripts.  For Thai, there is <a class="freelinking external" href="http://www.indesignthai.com/board/" rel="nofollow">InDesign Thai</a> which I have heard of, but haven't evaluated.<br>
      Anyway, for Thai:<br>
      1) We do not use AAT or Uniscribe. In fact, we only do the correct positioning of marks using OpenType fonts that do the positioning themselves using 'mark' and 'mkmk' features. Microsoft's original Thai fonts had a table-based way of doing mark positioning using some PUA accent glyphs, but we don't support it. I think InDesign ME and InDesign Thai both support the Microsoft legacy fonts, but not AAT fonts.  (not sure)<br>
      2) In CS3 we did not utilize any code to break Thai phrases correctly. The user would have to insert "discretionary line break characters" manually (U+200B: zero width breaking space). FYI, Thai doesn't use spaces between words, but still expects line-breaks to occur between words. There are free algorithmic approaches available which we are investigating.</p>
      <p>The InDesign team believes that extending our script support is a good long-term business opportunity, but as pointed out above we have to implement a cross-platform solution and (more critically) we are unwilling to release something under the "Adobe InDesign" label unless it reaches a pretty high level of quality. And, of course these features compete for resources with every other wish-list...</p>
