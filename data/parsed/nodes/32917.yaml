    html: <p>I have been told that CS3 supports Thai. I believe I read this from John Hudson somewhere here on Typophile. It is my understanding that you cannot do this in CS2, be it on a Mac or on a PC. The international versions of InDesign have been CE and ME – these handled the accents of Central and Eastern European languages, as well as the Right to Left nature of certain Middle Eastern scripts like Hebrew and Arabic. There isn't an "InDesign South Asia" or anything like that… but if the hints I heard were correct, you'd be just fine with your Thai texts as long as you upgrade!</p>
