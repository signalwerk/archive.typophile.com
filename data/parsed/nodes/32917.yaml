      <p>The OpenType specifications were released ten years ago in April 1997.</p>
      <p>This is not an April Fool joke. This is a fact.</p>
      <p>The OpenType font format was devised to support non-Latin scripts, especially the so-called "[edited by moderator] scripts".</p>
      <p>Merrian-Webster's Collegiate Dictionary, 11th edition, defines "[edited by moderator]" as "a member of a socially disadvantaged class of persons". Ten years ago, "[edited by moderator]" in Africa, India etc. were disadvantaged such that none of them was permitted to use any of their own scripts (Devanagari etc.) under Windows.</p>
      <p>Seven years ago, Microsoft implemented the OT support for "[edited by moderator] scripts" in Africa, India etc. as an integral component of all versions of Windows published since that time. Since many years, even the most elementary Windows programs (e.g. the simple one line editor "Edit") and also all freeware word processors (e.g. Open Office Writer) can handle "[edited by moderator] scripts".</p>
      <p>As opposed to this, for the past ten years, Adobe has been intentionally preventing "[edited by moderator]" from using "[edited by moderator] scripts". Although the OT support for "[edited by moderator] scripts" is an integral component of Windows readily available to all application programs, Adobe wilfully blocked this Windows OT component so that "[edited by moderator]" in Africa, India etc. cannot use their own "[edited by moderator] scripts".</p>
      <p>Considering that even the simplest one-line editor written by a hobby programmer permits "[edited by moderator]s" to use "[edited by moderator] scripts", there is no other explanation than that Adobe deliberatey prevents "[edited by moderator]" from using "[edited by moderator] scripts" for reasons of racism and apartheid.</p>
