      <p>Well, you could set the text in Word, using the same text block size as in your target InDesign document, make use of Word's Thai dictionaries for linebreaking, and then you could insert hard linebreaks at the end of every line, and copy/paste the text into InDesign, preserving the Word linebreaks.</p>
      <p>Or, perhaps tidier on the InDesign end, you could paste in the text without hard linebreaks from Word, and then use the (printed) Word setting as a guide for where to place discretionary linebreaks (shift+enter/return) in InDesign. This would produce correct linebreaks but wouldn't treat every line as a separate paragraph.</p>
    html_clean: |-
      <p>Well, you could set the text in Word, using the same text block size as in your target InDesign document, make use of Word's Thai dictionaries for linebreaking, and then you could insert hard linebreaks at the end of every line, and copy/paste the text into InDesign, preserving the Word linebreaks.</p>
