      <p>Adobe decided more than a decade ago, i.e. around the same time that they were first getting involved with OpenType, to free their applications from dependence on OS support for font rendering, text encoding and text layout, in order to provide a seamless cross-platform experience for users. This means, among other things, that Adobe's support for complex scripts has lagged behind that of Microsoft for the simple reason that Adobe's historical internationalisation pushes have not been as global as Microsoft's and they have concentrated on the East Asian market.</p>
      <p>As the developer of the Adobe Arabic, Adobe Hebrew and Adobe Thai fonts, though, I'm pretty confident about Adobe's long-term commitment to complex script support, even if I wish it were happening faster.</p>
