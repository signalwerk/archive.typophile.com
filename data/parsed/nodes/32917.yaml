      <p>Uli's statements about Adobe "intentionally blocking" Uniscribe (or Apple's Indic font rendering) are simply false. Adobe is not "blocking" these services, but is simply avoiding using OS-specific calls in the first place, in favor of our own cross-platform text handling and text rendering. (As many others have mentioned.)</p>
      <p>Adobe is certainly interested in better international language support, and it's an area we know we need to improve dramatically.</p>
      <p>However, when things descend from questions and honest discussion to abusive false accusations and attempts at rabble-rousing, that's where I exit the discussion. I don't expect I'll respond further to Uli here (or probably in any other thread, based on what I've seen). </p>
      <p>Cheers,</p>
      <p>T</p>
