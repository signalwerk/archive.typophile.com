      <p>&gt; In that case, dear sir, please you or someone kindly write a little something<br>
      &gt; so we hapless Windows InDesign users can use unicode Indic scripts in InDesign.</p>
      <p>Swami Mahayogananda:</p>
      <p>If Windows application programs do not intentionally block or disable the built-in Windows Uniscribe font renderer for complex scripts, then these programs will automatically render Indic scripts.</p>
      <p>For instance, if you look at</p>
      <p><a href="http://www.sanskritweb.net/itrans/fonttest.htm" title="http://www.sanskritweb.net/itrans/fonttest.htm">http://www.sanskritweb.net/itrans/fonttest.htm</a></p>
      <p>you will see this</p>
      <p><a href="http://www.sanskritweb.net/itrans/fonttest.gif" title="http://www.sanskritweb.net/itrans/fonttest.gif">http://www.sanskritweb.net/itrans/fonttest.gif</a></p>
      <p><strong>if and only if</strong> you use a Windows browser that <strong>does not</strong> intentionally block or disable the Uniscribe renderer.</p>
      <p>However, since all Adobe application programs (InDesign etc. etc.) intentionally blocked or disabled the built-in Windows Uniscribe font renderer for Indic scripts, it is not possible to write "a little something", because Adobe intentionally prevents Indians from using Indian scripts.</p>
      <p>I hope that you now get it that Adobe does not want you to use Indic scripts in InDesign, otherwise it would not willfully block the Uniscribe functions.</p>
      <p>The "a seamless cross-platform experience for users" described by Mr. Hudson means that Indian users have a "seamless cross-platform non-experience", because Adobe intentionally blocked or disabled both Microsoft's Uniscribe as well as Apple's own Macintosh Indic font renderer.</p>
