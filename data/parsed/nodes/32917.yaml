      <p>&gt; it is actually very difficult to incorporate Uniscribe into InDesign</p>
      <p>Since Uniscribe is an integral component of all newer Windows versions (Windows 2000, Windows XP, Windows Vista), even young school kids writing simple programs can easily display all Indic scripts. This means, that Adobe programmers, who are assumed to have more programming experience than young school kids would have no difficulty to display "[edited by moderator] scripts" in Adobe programs, if the Adobe outfit were willing to permit "[edited by moderator]" to use the "[edited by moderator] scripts" of their own mother tongues.</p>
      <p>Typophilers do not care that "[edited by moderator]" in Africa, India etc. cannot use their own "[edited by moderator] scripts". For instance, if Typophilers see this picture</p>
      <p>http://www.sanskritweb.net/temporary/[edited by moderator].jpg</p>
      <p>the only thing they care about is to know the name of the typeface which was used for typesetting the headline. But Typophilers do not care that, for instance in India alone, there are more than one billion (1,000,000,000) speakers who want to use fonts for the scripts of their own mother tongues.</p>
      <p>But Adobe deliberately prevents "[edited by moderator]" from using their mother tongue scripts.</p>
      <p>So, "[edited by moderator]" who want to use InDesign will have to renounce their mother tongue.</p>
