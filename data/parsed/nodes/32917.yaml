    html: <p>We call the shift+enter a "soft return" because it forces a line break without forming a new paragraph.  The discretionary break is an optional break that doesn't insert a hyphen or anything. We don't assign it a keyboard shortcut, but one could.  Numerically, the soft return is U+000A, paragraph break is U+000D, and discretionary break is U+200B.</p>
