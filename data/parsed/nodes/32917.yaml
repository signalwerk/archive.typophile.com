      <p>Thanks for your comment. </p>
      <p>I am not a programmer, so I can't judge how difficult it would be to do what I was imagining. But I still hope that someone who is a programmer might have the interest and the genius to write some kind of code (be it a plug-in or anything else) that can make Uniscribe and InDesign become more friendly. Waiting for Adobe might be like waiting for Godot! </p>
      <p>Why, actually, hasn't Adobe incorporated Uniscribe into InDesign? I hesitate to impute to Adobe the kind of sinister racist motives that another commenter has suggested. I imagine it would be one of two possible reasons: (i) it is actually very difficult to incorporate Uniscribe into InDesign, because the features of the one somehow conflict with the features of the other; or (ii) It is not economically viable: why spend money to develop a feature that will be used primarily by people who will not pay for it? (That is, at least in India, as I understand it, the vast majority of Adobe software users do not have licensed software: they buy it on the street corner or download it from pirate sites. (An aside: when we needed two licenses for InDesign, we put in an order with a software supplier in Kolkata, and waited over two months before we received the disks. Adobe doesn't make it easy to go legal in India!))</p>
      <p>With best wishes<br>
      MY</p>
