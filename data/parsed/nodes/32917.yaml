    html: |-
      <p>Instead of blaming or fighting with Adobe, I like to submit my humble proposal to make enable Indic processing in InDesign as follow:</p>
      <p>Adobe InDesign CS3 supports Unicode, XML, XMP, HTML and all web compatible tech, but Indic (Hindi-Devanagari, Oriya, Gujarati etc.) not supported because these are very complex due to some illogical positioning of Maatraas and conjuncts. </p>
      <p>For example:</p>
      <p>(1)<br>
      Input is<br>
      क+ि = </p>
      <p>But Output is needed/optained as<br>
      कि </p>
      <p>i.e. shifting of character inputed afterwards, but to appear before it. </p>
      <p>(2) </p>
      <p>Input is </p>
      <p>क+ा+र+्+य+ो+ं </p>
      <p>But output of which is </p>
      <p>कार्यों </p>
      <p>i.e. shifting of third+fourth character-code to seventh+eighth in sequence. </p>
      <p>For obtaining this rendering only OT font's glyph substitution/possitioning rules can not solve the problem. This illogical and complex positioning has to be obtained by the special technic inbuilt in the Rendering Engines of Operating System. (In case of Windows : Unicows.dll and USP10.dll etc. i.e. Uniscribe or Unicode Script Processor) </p>
      <p>Whereas the scope of a PageLayout program like Adobe InDesign should remain limited upto the OT Fonts (i.e. glyphs). Even if in Edit mode the text is rendered in traditional/desired form with the help of rendering engine of Operating system, but when the layout output in Unicode will be sent to the printer(Postscript, or color separation processing units), the repossitioned glyphs gets distorted, because there the rendering engine does not work or save the balance between sequences of Encoded characters and repositioned sequences of glyphs of OT fonts. </p>
      <p>More, the output not necessirialy to be get with that particualr OS (like Windows) only, user should have freedom to get it with any OS. Or the layout-output must be OS independent. </p>
      <p>I think this is the policy of Adobe, the great IT gaint must finding some OS independent tech. for their products like InDesign.</p>
      <p>So I propose a solve, atleast may be for presently/temporarily, as : </p>
      <p>(1)<br>
      For Print media<br>
      In Hindi (or other Indic) in Unicoded OT fonts: </p>
      <p>-- 1st Compose with Layout in Unicoded OT fonts (with Rendering Engine help)<br>
      -- Then make a PDF of the pages with option of "inlcude OT fonts"<br>
         (As PDF uses only sequence-wise glyphs of a OT font, does not use the Unicode character code sequences, as there is no need to futher processing)<br>
      -- Then send the PDF for print or pre-print processing. </p>
      <p>(2) </p>
      <p>Design/Develop Hindi (or other Indic) OT Fonts with all the complete syllables(अक्षरों), not with mere/limited characters (वर्ण) and glyphs(वर्णों के टुकड़ों या संयुक्ताक्षरों). The possible number of complete syllables in Hindi still could not be counted yet. It may go beyond Billions. </p>
      <p>For example in Devanagari (Sanskrit) in the word </p>
      <p>कार्त्स्न्या </p>
      <p>का is one syllable<br>
      and<br>
      र्त्स्न्या is second syllable</p>
      <p>र्+त्+स्+न्+य+ा </p>
      <p>Here 10 number of Unicode characters combindingly makes one syllable (अक्षर). </p>
      <p>There should not be any such thinking or arguments that "this or that Conjunct/syllable is never used". If one has to write name of all the persons all over the world in Devanaagarii, all combinations of C+C+C+C+C(n)...+V/M+VM should be taken in account in syllable designing. [C=consonant, V=Vowel, M=Maatraa, VM=Vowel Modifier].</p>
      <p>For this in Devanaagari</p>
      <p>if Base Consonants = 34 Numbers<br>
      Base Vowels = 16<br>
      Base Maatraa = 16<br>
      Vowel Modifiers = 3<br>
      Nukta = 1</p>
      <p>Then at 1 level of consonant, total number of syllables may be 34+16=50*16=800*3=2400</p>
      <p>क का कि की कु कू..... को कौ<br>
      कं कां किं कीं कुं कूं..... कों कौं<br>
      कँ काँ किँ कीँ कुँ कूँ ..... कोँ कोँ<br>
      कः काः किः कीः कुः कूः... कोः कौः<br>
      ....<br>
      ....<br>
      ह हा हि...<br>
      हः हाः हिः</p>
      <p>क्कि क्कु क्कौ, क्कौँ<br>
      स्मि र्क्रोँ... ल्क्य (याज्ञवल्क्य)</p>
      <p>At 2 level of consonant conjuncts 2400**2<br>
      At 5 level of consonant conjuncts 2400**5</p>
      <p>At 10 level of consonant conjuncts 2400**10 = 6.3403380965376e+33</p>
      <p>Which comes to infinite, or we may say total number of syllables in Devanaagari (or in other Indic script may be as much as total number of stars in the sky or hairs in a human body)</p>
      <p>N.B. : Above calcutaion may be wrong, it should be taken just a mere example/glympsh.</p>
      <p>====</p>
      <p>So the Indic users should </p>
      <p>Either make a Hindi OT font with all the syllables(अक्षर) </p>
      <p>or </p>
      <p>Remain satisfied by just using the glyphs (pieces of characters) only, forget further processing, searching, replacing, sorting and indexing. </p>
      <p>Hariram</p>
