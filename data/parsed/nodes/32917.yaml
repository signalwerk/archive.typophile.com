      <p>Maybe I’m unnecessarily stirring this up, but I want to give you a better opinion of Uli, even if I don’t support the tone of his outbursts. Over the years, he has worked so hard on enabling proper Indic script typesetting, struggling with all the intricacies presented by the various font technologies and operating systems, that I can understand how the creators of so many obstacles to his goal have started to appear like enemies to him.<br>
      Also, the word you edited out was not meant in an abusive, but in a defensive sense, as you had surely noticed, and could have been replaced by something like "underdeveloped". In Europe, by the way, this word (or what I think it was) is not as shocking as it is in the US.</p>
      <p>That said, I was intrigued by the earlier post about Thai script. Does InDesign handle this script completely, or does it leave it to Uniscribe’s grace when the text is marked as "no language"?</p>
