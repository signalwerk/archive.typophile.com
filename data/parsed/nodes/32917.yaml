    <p>Hi Folks,</p>
    <p>Uniscribe and Devanagari (or any complex script): the glyph substitutions are not supported by InDesign.</p>
    <p>Has anyone written or heard of any conversion tool, that will analyze Uniscribe text (that is, text written in a complex script like Devanagari) and make all substitutions permanent (that is, the actual glyphs, rather than lookups for substitution, will be written), thus making the font useable in InDesign? So it would be a workaround for Indesign and Uniscribe. . .</p>
    <p>Thanks.<br>
    MY</p>
