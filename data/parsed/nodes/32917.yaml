      <p><em>The “a seamless cross-platform experience for users” described by Mr. Hudson means that Indian users have a “seamless cross-platform non-experience”, because Adobe intentionally blocked or disabled both Microsoft’s Uniscribe as well as Apple’s own Macintosh Indic font renderer.</em></p>
      <p>Adobe apps neither 'block' nor 'disable' either Windows or Mac Indic script processing, they simply don't use it (and they are not alone in this). Uniscribe is a set of APIs for processing Unicode text, and applications have to deliberately make use of it, either directly or via a higher level set of APIs; it is not something that one blocks or allows, it is something one deliberately takes advantage of or chooses not to. And there are good reasons why developers might choose to 'roll  their own', as Adobe have done, rather than making their application dependent on OS services that are outside of their control. One of the key reasons is, as I wrote, cross-platform compatibility. Yes, Windows and Mac both offer Indic text processing via system services, but they do so in incompatible ways using competing font layout formats. Adobe have a decade-old commitment to cross platform compatibility in their design apps, and that means waiting for them to assign resources to supporting language and script handling for specific markets.</p>
      <p>I'm the first person to say that I wish Adobe apps supported Devanagari and other Indian scripts, and also that we've been waiting much too long for this. I know Adobe have the know-how to implement this stuff, because I've worked with some of the people who would be responsible. It's a question of managers releasing budget funds to get the work done and getting it into the product cycle.</p>
      <p>Misrepresenting what Adobe have done and their reasons for doing it is not going to make Indic support in Adobe apps happen any sooner.</p>
