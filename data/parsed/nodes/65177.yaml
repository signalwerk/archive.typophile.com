    html: <p>In many ways, the title influences the font...is the title more than found characters? I always think of the magazine Mademoiselle, which is a long title by anyone's standards and it was a condensed Futura in its later years. My own feeling about magazine logos is that they should not have too much character; they have typically been simple because of newsstands. A recent resign I did I went back to News Gothic because it was strong, readable and just seemed right. I would also recommend House Industries Chalet (Tokyo) <a href="http://www.houseind.com/fonts/chalet" title="http://www.houseind.com/fonts/chalet">http://www.houseind.com/fonts/chalet</a> as a font that has character and is not overused.</p>
