    <p>Hey guys,</p>
    <p>I was wondering if I could ask you typographical gurus a question. I'm production manager on my university's magazine, and we're interested in redesigning our magazine to be less The New Yorker and more Wired or another equivalently modern magazine. I was wondering if any of you know some really nice modern fonts we should investigate into purchasing for our magazine's new cover typeface. We were thinking either thin or bold lettering, possibly in all lowercase with some nice x-height. That being said, I think something like Myriad Pro won't strike readers as being all too ingenious. We want an awesome, not-really-overused-yet typeface.</p>
    <p>Thanks for your time, guys!</p>
    <p>-- David</p>
  html_clean: |-
