      <p>The design is the issue first, not the typeface. This requires a process of development and a skilled practitioner to perform. Don't get a font first and then saddle a designer with it. Hire a professional--you may even have a design school and design faculty on your campus to help you.</p>
      <p>ChrisL</p>
