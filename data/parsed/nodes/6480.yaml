    html: <p> During the time I had been working with PC ( windows). On begining it was complicated because I started to draw the forms with corel draw and  <br>I generated the true type with the same program. It was a very hard <br>way to control the potencial of the work (clean forms and good syntax). <br>But during that period I tryed to experiment very technics to tasted the potencional of the programs and the process. ( lots of people think's poor guy, which work with PC  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)">. So I founded the Fontographer and all kind of difficults of the past are gone!!!.  I also work with Fg on MAC and I made some type faces with freehand but sicerely I prefer my old corel draw 7 to draw my work because I like the tools and the way to control the bezier points. Normaly I creat my own  factory or a table to work the layout and the forms of letters. ). Some of my type faces were are draw directly on paper the idea and some notes to desenvolve and devolepment with a digital technology. I created a standart layout with the rigth dimentions to use as a true type font 2048 (points), but sometimes I make some adjustments to some special situation. I continue to draw and generate the true type with corel draw ( temporary file ) which I only used to work only to draw my type faces, next I opean the file on Fg to correct all forms and finnaly the syntax correction. I had been make some corrections with prints prof on paper (300 dpi) to make the visual correction. But since I had been presentation my stuff on typophile forum I had been make some corrections to adapted the print function as a display type face. I also would like to know the way to transport the vectorial (BCP) information from freehand to Fg? (only curiosity). </p>
    html_clean: <p> During the time I had been working with PC ( windows). On begining it was complicated because I started to draw the forms with corel draw and  <br>I generated the true type with the same program. It was a very hard <br>way to control the potencial of the work (clean forms and good syntax). <br>But during that period I tryed to experiment very technics to tasted the potencional of the programs and the process. ( lots of people think's poor guy, which work with PC  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)">. So I founded the Fontographer and all kind of difficults of the past are gone!!!.  I also work with Fg on MAC and I made some type faces with freehand but sicerely I prefer my old corel draw 7 to draw my work because I like the tools and the way to control the bezier points. Normaly I creat my own  factory or a table to work the layout and the forms of letters. ). Some of my type faces were are draw directly on paper the idea and some notes to desenvolve and devolepment with a digital technology. I created a standart layout with the rigth dimentions to use as a true type font 2048 (points), but sometimes I make some adjustments to some special situation. I continue to draw and generate the true type with corel draw ( temporary file ) which I only used to work only to draw my type faces, next I opean the file on Fg to correct all forms and finnaly the syntax correction. I had been make some corrections with prints prof on paper (300 dpi) to make the visual correction. But since I had been presentation my stuff on typophile forum I had been make some corrections to adapted the print function as a display type face. I also would like to know the way to transport the vectorial (BCP) information from freehand to Fg? (only curiosity). </p>
