    html: "<p> Speaking in broad generalizations, I design in Fontographer, on the computer, starting from geometrics (rectangles, usually) and convert points to curves/Beziér control points (BCP) as needed. <br> <br>On rare occasion, I will draw something, scan it, then convert it to outlines. More frequently I will draw out an idea on graph paper (taking note of approximate locations of vital extrema points and angles), then redraw it in Fontographer. <br> <br>I have also found that what they say is true: the fewer control points, the better. You'd be amazed at the control you can get using only endpoints and the cardinal extrema points (north, south, east &amp; west). I rarely even use a control point at the directional change in the midpoint of the spine of an \"s\", for example. I've found that (usually) a smoother curve can be obtained (with remarkable control) by limiting myself to the east and west extrema and controlling the shape of the curve by dragging out these two points' BCPs. <br> <br>As for italics and weight variations, I've found that the most success comes from redrawing the characters from scratch. I'll usually paste a copy of the original glyph in the working window for reference, but trying to convert one glyph to another usually leads to more cleanup work that it is worth. Similarly, using Fontographer's skewing or weight change options often (but not always) leads to more work than simply starting the glyph from scratch. <br> <br>I do, however, rely a great deal (some may say too much, I suppose) on cutting and pasting parts from one glyph to build another within the same font. <br> <br>I also find myself using mathematics a lot to compare widths, length, and often BCPs of similar or rational curves. For example, if the BCPs at the top of the uc \"C\" are 150 units away from the extrema point, then I make sure they are similarly 150 units away on the bottom extrema point. <br> <br>I'd still love some hints on hinting, however. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> Anyone?  <br> <br>David </p>"
