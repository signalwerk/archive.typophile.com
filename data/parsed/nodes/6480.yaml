  html: <p> I'm interested in hearing about other people's process. <br> <br>Do you draw out the face by hand, then trace it? Do you start out in illustrator? What do you do in illustrator? Do you start with a lineal version, then flesh it out? How do you flesh it out? Do you employ stroke width, then polish it, or are you a purist, and render only the outlines? Do you start from geometrics, then move them around, or do you just draw the characters with the bezier curve tool? Do you copy and paste from one character to another? If so, which characters? What are your building blocks? How do you approach different weights? Italics?  How about references? How much do you use your research while you're designing? How do you go about checking your type in a block of text? Do you revise most at this stage or before? <br> <br>Something to think about. I'm interested in what other designers have to say. <br> <br>Christian R. </p>
