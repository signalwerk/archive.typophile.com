    html: <p> Too many questions!  :-/ <br> <br>In terms of "where" I design, it depends on the nature of the typeface. I used to do everything on the computer, but the type of designs I've started to like to do I really need to draw them out first, if not final glyphs, at least good approximations. But a *lot* of tweaking still happens after the stuff goes bezier. <br> <br>hhp </p>
