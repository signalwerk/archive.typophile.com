  html: |-
    <p>With Hamburgefonstiv (or any variation of it) as the overall measuring stick of a typeface’s design/progress, couldn’t you also use it to identify typefaces? As it shows all the stroke variations used throughout a typeface, it should be a pretty good way to discern different typefaces.</p>
    <p>I’m curious also how everyone here goes about identifying typefaces. A lot of it is experience, but are there any other tips/tricks that anyone wants to share?</p>
