    html: "<p>CJ: <br> <br>The bottom two designs don't make any sense to me, but I like the improvements made in the top two designs. I like that you have created a heavier version, but it might be a little too heavy. If the heavier version is bold and the lighter version is regular, then you are looking for a medium. If you look at your bold version, it looks like it is going to fall over (to the right). To eliminate this unbalance, I have cut off the little returning curve from the end of the \"S\" and I have cut off a significant portion of the arm at the beginning of the \"S\". <br> <br>This is rough, because your original JPEGs are very rough/pixelated, but hopefully it will give you an idea of what I mean. Also, the bottom probably needs to be a little thicker and the top arc might need to be rounded out a little more. I'm not positive about the arc, though, because it might only read as an \"S\"', whereas, right now, it looks unatural, like two shapes are melded together</p>"
    html_clean: "<p>CJ: <br> <br>The bottom two designs don't make any sense to me, but I like the improvements made in the top two designs. I like that you have created a heavier version, but it might be a little too heavy. If the heavier version is bold and the lighter version is regular, then you are looking for a medium. If you look at your bold version, it looks like it is going to fall over (to the right). To eliminate this unbalance, I have cut off the little returning curve from the end of the \"S\" and I have cut off a significant portion of the arm at the beginning of the \"S\". <br> <br>This is rough, because your original JPEGs are very rough/pixelated, but hopefully it will give you an idea of what I mean. Also, the bottom probably needs to be a little thicker and the top arc might need to be rounded out a little more. I'm not positive about the arc, though, because it might only read as an \"S\"', whereas, right now, it looks unatural, like two shapes are melded together</p>"
