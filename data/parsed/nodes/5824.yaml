  html: <p>Our University department is changing its name from Quantitative Management to Decision Sciences. Our teaching and research focuses mainly on the mathematics underlying decision making and management processes.  <br> <br>We need a new logo to reflect the new name. It should also give some hint of the fact that mathematics is the focus. We played around with the Greek sigma and delta (often used in a mathematical context), roman s and d, and the integration sign. (We shy away from the capital Sigma or summation sign because it is overused.) <br> <br>We (mathematicians, not typographers or designers) came up with the following concept. The idea is that it should alternate between a d and an S in the mind of the reader. <br> <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="ds"> <br> <br>Any advice will be appreciated! <br> <br>Chris Swanepoel <br></p>
  html_clean: <p>Our University department is changing its name from Quantitative Management to Decision Sciences. Our teaching and research focuses mainly on the mathematics underlying decision making and management processes.  <br> <br>We need a new logo to reflect the new name. It should also give some hint of the fact that mathematics is the focus. We played around with the Greek sigma and delta (often used in a mathematical context), roman s and d, and the integration sign. (We shy away from the capital Sigma or summation sign because it is overused.) <br> <br>We (mathematicians, not typographers or designers) came up with the following concept. The idea is that it should alternate between a d and an S in the mind of the reader. <br> <br><img src="http://www.typophile.com/forums/clipart/your_image.gif" alt="ds"> <br> <br>Any advice will be appreciated! <br> <br>Chris Swanepoel <br></p>
