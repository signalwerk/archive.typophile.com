    html: <p>Thanks for the comments, Scott. The first use of the logo would be as background design for a preprint cover -- hence the pale colours. (It will have to be even paler to prevent it from interfering too much with the black title that will be overprinted on the cover...) For other uses it makes sense to have it bolder. There are no colours with mathematical significance, as far as I know.  <br> <br>Would it be better to frame the symbol when it is printed as say red or dark blue on white, to get a rectangular logo, or should it be used without a frame?  <br> <br>Not being designers, we would appreciate any suggestions on refinements of the weight, curves, etc. <br> <br>Thanks! <br>Chris</p>
