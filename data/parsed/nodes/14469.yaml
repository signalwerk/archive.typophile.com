    <p>I need your opinions, please. I am in the middle of reworking a basic introduction to typography curriculum for first year graphic design students. I have received a second edition of the book I used last year as a reference (A Typographic Workbook: A primer to history, techniques and artistry). In this second edition (and not in the first), there is a section devoted to the art of Copy fitting as well as related exercises. How important and/or relevant do you think it is to teach budding graphic designers this procedure? Realistically, I don't think anyone uses this anymore - and it might be of interest to talk about but is it worth actually teaching?</p>
    <p>Your views?</p>
