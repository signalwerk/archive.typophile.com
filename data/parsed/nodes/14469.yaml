      <p>I also met James Craig many years ago. He started teaching typography at The Cooper Union years after I left.</p>
      <p>Last year while I was using his book for typography class, I had a  genuine interest in contacting him and suggest a possible collaboration on new excercises/projects that could be added to the web site. But I am ashamed to say that I never acted on it.</p>
      <p>I did talk with Alan Halley about what Agfa-Monotype (now Monotype Imaging) had available for educational resources and he did give me links to the type info/education areas they were developing online.</p>
      <p>I am less interested in developing any guidlines for selecting and using type since those kinds of resources abound. I have been more interested in exploring new methods/exercises that would help interested students to develop that <em>special sensitivity and feeling</em> for typography.</p>
      <p>I use the term <em>excerise</em> because that is exactly what they would be. Not a project or anything finished, but a series of "warm-ups" that aid understanding. </p>
      <p>Like traditional Chinese <em>Kung Fu</em>, the master would run students through a series of seemingly useless routines, all of which actually help to develop new abilities. Remember, "<em>Wax on. Wax off</em>."?</p>
      <p>---------------------------------------------------------<br>
      Yes, I'm old, but my Chi flows strong!</p>
