      <p>"I’ve written to Mr. Craig as well, very nice man"</p>
      <p>By happenstance, He sat with us at the party at TypeCon.  Too bad you missed meeting him while you were there--he is a very nice man.</p>
      <p>Years ago, when I was teaching, copyfitting was very important and I had made up an exercise for my students.  I will Check Jack Benny's vault for it if you like but I think Norbert has a good way of making it current and useful.  Today, copyfitting after the text is written is mostly pointless.  Allowing an exact amount of space, as Norbert points out, to be filled later is still a current need.</p>
      <p> ChrisL</p>
