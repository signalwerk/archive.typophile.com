      <p>I learned casting off, counting characters, and all that in the mid-eighties, pre-computer. It is useless now, except as mentioned above to tell a writer what character count will fit. That takes 1 minute:</p>
      <p>In InDesign, use the Placeholder Text feature to flow in Lorum Ipsum text into the ad, mag page, web page, etc. Then copy and paste that into Word (shudder!) and do a character count. Easy greasy. All that old chacter counting stuff and math is completely obsolete. Any book that seriously suggests you teach it is obsolete too. </p>
      <p>As for books, I find Lupton's Thinking with Type to be just the right fit for an intro class. Cutting edge examples, copulating dinosaurs (seriously!) and enough typographic history, theory, and technique discussed quite intelligently. Some good projects available online too at thinkingwithtype.com. I love it. Structure my quizzes, exercises, and projects around it. </p>
      <p>Good luck!</p>
      <p>H. Todd Duren,<br>
      designer. educator. yada yada</p>
      <p>myopendoor.net</p>
