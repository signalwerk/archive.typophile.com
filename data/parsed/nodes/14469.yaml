      <p>Andi,<br>
      that's an interesting question that I asked myself last year while teaching typography to a second year graphic design class.</p>
      <p>They had already started the basics with Quark during their previous year so "copy fitting" came as no real mystery to them. The school was using James Craig's <em>Designing with Type</em> and when we reached the section on traditional copyfitting (manually calculating) I did talk them through the excercise quickly, just for the mechanics of it, but then added an in-class project for them to solve.</p>
      <p>I gave them a "real case" scenario of working production at a small weekly news magazine. The style sheet is fixed: display and subhead styles &amp; sizes, body text and caption typefaces, point size &amp; line spacing, and column widths. They were also given 4 photos and a sidebar to work into a 2 page spread. All the Quark layouts were done WITHOUT text insertion, just the text columns blocked out ready for copy. </p>
      <p>Knowing that news articles come in last minute and are often re-edited, my question to them was: <em>What is the character (or line) count number to be given to the writer/editor so that it could all fit at the last minute</em>.</p>
      <p>The answer (and solutions) can be arrived at very easily in several ways, but the principle is that text fitting SHOULD NOT be done on-the-fly, fudged, nudged or mutilated, but can be estimated beforehand.</p>
      <p>It is not uncommon to be given a large manuscript file to start with, and to be asked "<em>How many pages long will this book, manual, catalog or whatever, going to be?</em>" And many times, the graphic designer is just doing production and cannot make arbitrary changes to layout and content. Somebody has to tell them <em>it ain't gonna fit</em> before spending hours and then discovering that it won't.</p>
      <p>No, I personally don't feel traditional copyfitting techniques need be taught, but I do believe that graphic designers should treat text the way architects and construction companies treat bricks. Not just an element to build with, but a tangible entity that gives character to the building itself. Again, someone has to calculate how many and what specific kind of bricks will be needed before starting the project.</p>
      <p>---------------------------------------<br>
      Yes, I'm old, but I copyfit with style!</p>
