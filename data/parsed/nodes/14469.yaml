    html: <p>I've been on the site, Norbert, and through all of the sample exercises. There are some really good ones there adn I've downloaded a few. I've written to Mr. Craig as well, very nice man. So far, for the first year students, I have found the workbook I am using the most helpful. I use it mostly as reference but it's very comprehensive. The trouble is that there is just so much typographic material to cover in such a short period of time under the roof of one big Graphic Design program. I really have to be very selective with what I feed young minds. I want it all to be relevant and interesting (even though I find all the information I teach very interesting myself!)</p>
