    <p>Hey Guys,<br>
    I am currently working on my final exam. I made a concept for a luxury restaurant with it’s focus on exotic meals from different cultures all over the world. The target group mainly consists of people with high income and interest in exotic food and culture. The name is Xanadu.Now I’m working on the artwork and I was wondering which typeface to choose as corporate type and logo type. What do you guys think? Should it bei two different types (logo&amp;corporate type) or could the logotype be from the same family? My favorite is the Archer by Hoefler &amp; Frere-Jones. I especially like the thin and hairline versions.But I’m not sure about using the bold face as a headlinefont. The design should be elegant and clean and do not cover the international culture aspect (thats gonna be covered by the food).So, what do you guys think about archer as corporate type?Which would be a nice additional type?Any other suggestions?<br>
    Thanks in advance for your help!</p>
