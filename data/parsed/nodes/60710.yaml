    html: <p>Hehe the problem is,the artwork process is still in the first stadium, so i can’t really show some work yet. The overall look&amp;fell is gonna be very clean, high-end and representing luxury. The style of images used for advertising and other visual touchpoints of the brand should inspire emotion and dreaming (dreaming is an important part of a luxury brand) in the recipients.Another idea for the artwork is creating a color-code to navigate through the different styles of food and their culture. Maybe i can refer to the roots of Xanadu in the logotype. Xanadu is first mentioned as the name of Kublai Khans summer residence in one of Marco Polo’s diarie. Since then it is a metaphor for wealth and splendor. Orson Welles refers to it in his movie Citizen Kane, where Kane’s palace is named after it. However, it should speak the language of luxury/premium/high-end.I’m sorry i can’t give any further information rightnow…</p>
