    <p>I need help identifying this font:</p>
    <p><img src="http://typophile.com/files/Unknown%20Font_0.jpg"> </p>
    <p>It seems to actually be two fonts (one for the top text and one for the bottom).  I have downloaded a Vector Stock image from <a href="http://www.vectorstock.com/royalty-free-vector/vintage-card-vector-826177" title="http://www.vectorstock.com/royalty-free-vector/vintage-card-vector-826177">http://www.vectorstock.com/royalty-free-vector/vintage-card-vector-826177</a> and I really liked the way this font looked together with that image.  Unfortunatly the text is not editable and does not have any info about the font used.</p>
    <p>If the exact font cannot be identified, suggestions would be helpful.  I am looking for something to go along with that image.  I plan on using the floral type design from the link to make a gift label for guests at a wedding.</p>
