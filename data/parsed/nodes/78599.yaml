    <p>I've been working on rebranding my bakery. We are hoping to have the new logo be reminiscent of an old fashioned american bakery. I've done a bunch of sketches, but I think I need some feedback on what is working and what might not be working.</p>
    <p>Oh, please note, we will be sticking with Sugar Bakery &amp; Cafe as the brand (not switching Sugar Bakery as seen on some of the comps)</p>
    <p>You can view the logos here:<br>
    <a href="http://www.sugarbakerycafe.com/rebrand" title="http://www.sugarbakerycafe.com/rebrand">http://www.sugarbakerycafe.com/rebrand</a></p>
    <p>Thanks!<br>
    stephanie<br>
    sugar bakery &amp; cafe</p>
