    votes: null
    html: |-
      <p>I like it. I agree with JamesM that you need to make BAKERY &amp; CAFE thinner so it doesn't outcompete Sugar. Also, try looking at the logo without the striped background - you won't always be able to use it with the background (unless you can afford fancy full-color-printed paper bags, cups, stickers, etc., and only advertise in full-color publications).</p>
      <p>Also, the dotted outline collides with the solid outline in a few places. Try printing the logo very small and see how those dots look. You might need to make the dots bigger/farther apart/farther from the solid line. Are you doing this in Illustrator? At some point you'll have to convert everything to outlines, so if your borders are single vector lines with a thickness and/or dotted pattern applied, you'll need to settle on a relative dot spacing/line width that will work at all sizes. (I didn't explain that very well).</p>
      <p>If/when you do place the logo over the stripes, it might look nicer if the edges of the logo don't collide with the edges of the stripes (i.e., make the edges of the logo fall in the middle of a stripe).</p>
