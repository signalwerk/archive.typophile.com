    html: |-
      <p>It would help to see it bigger, but my first impression is that the 2 lines are fighting for dominance, with the 1st line (sugar) being larger, but the 2nd line being bolder.  If the words are not identical in importance, then you want to have a clear hierarchy of importance. So if you want "sugar" to be the focal point of the logo, I would tone down "bakery &amp; cafe", perhaps by making it less bold.</p>
      <p>Also the letterspacing needs work. For example, compare the narrow space between SU with the wide space between GA.</p>
      <p>The vivid pink stripes in the background seem overpowering.  I know you use them as a background on your website, so perhaps they aren't part of the logo itself, but either way you might want to experiment making them more pastel.</p>
