    <p>Basic question:  Is text on a curved path considered a major "type crime"?<br>
    Perhaps it's just an issue on a font like Futura Extra Bold... see the attached pic for an example.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/aawposter_6114.jpg"></div><p></p>
    <p>Specifically regarding the large "Art-a-Whirl" in the upper left.  For example, the baselines of the 'A' and 'r' are at different angles. Do graphic designers hang in hell for these kinds of problems?</p>
    <p>I'm open to any other comments regarding colors/layout/whatever.<br>
    Keep in mind this poster is far from done... yes, I'm well aware of the major kerning issues :)</p>
    <p>FWIW, the instructor and other students seem to like the "curved" version, but since it's not a type class they may not know any better.</p>
    <p>PDF, if you want a closer look: <a href="http://udesign.org/poster/aawposter.pdf" title="http://udesign.org/poster/aawposter.pdf">http://udesign.org/poster/aawposter.pdf</a></p>
