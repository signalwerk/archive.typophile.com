      <p>&gt; <em>Is text on a curved path considered a major “type crime”?</em></p>
      <p>Don't lose sleep over it.<br>
      Type, letterforms, engravings, etchings, chiseled in stone...<br>
      setting words set on curves, arcs, angles is NO CRIME at all,<br>
      just BAD DESIGN and POOR TYPOGRAPHY are considered crimes.</p>
