      <p>Notice that Peignot used a condensed typeface and generous spacing, both of which minimize the baseline angle problem.</p>
      <p>The alternative is to use a curved envelope, so you get a curved baseline (and cap line). The drawback is that the distortion this causes to the letters is often more noticeable, not to mention ugly.</p>
