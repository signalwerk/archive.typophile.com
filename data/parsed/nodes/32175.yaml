    <p>Hi everybody, I'm looking for a solution on a branding project for a startup company that is about to introduce a newly invented medical device. In search for an appropriate sans serif I came across Spiekermann's "DB Sans" which would be perfect in my opinion but is unfortunately unavailable for purchasing, I've looked at FF Unit, Vista Sans, and vesta. </p>
    <p>Additional suggestions anybody?<br>
    thanks..... in advance...</p>
