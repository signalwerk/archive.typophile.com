    <p>Hi everyone,<br>
    First post on this great community. Have decided to try and replicate the typeface used on the back on australian (melbourne) train tickets - its probably just a standard font used for receipts and such but i couldnt find any info on it so thought it probably easy to make my version of it, </p>
    <p>Anyway i would love your comments, it obviously needs work its still very new but i quite like it. "daily fare" is in extended version, everything else in normal and I am going to make a thin version aswell</p>
    <p>Thanks for comments - sorry for poor quality</p>
