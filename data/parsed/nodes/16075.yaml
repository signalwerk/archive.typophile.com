  html: |-
    <p>Provided the EULAs of certain fonts in my collection allow me to do this (some of which are horribly written), I'd like to convert a few Type 1 and TrueType fonts of mine to OpenType. </p>
    <p>There are several tools that can do this (for Windows):</p>
    <p>- Fontlab Studio<br>
    - TransType Pro<br>
    - Crossfont 4.0</p>
    <p>Another one I've read about is "Adobe OpenType Converter", but I'm not sure if it is available for the average consumer. I'm still curious about this one, however. Is it Adobe's exclusive tool? Does it work well?</p>
    <p>Which program should I use? All I want to do is simply take a Postscript file (.pfm,.afm, etc.) and convert it. Same for TrueType. I don't intend to include any special features. But are there any kerning perculiarities or other issues I should consider?</p>
