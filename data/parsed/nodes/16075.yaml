      <p>Techncially for TrueType all you need to do is add a digital signature. As this adds no functionaility and is not currently validated by any known software this would be a waste of time. </p>
      <p>So although there are benefits to converting the Type 1 fonts to OT, there's no benefit or reason to 'convert' TrueTypes.</p>
      <p>Cheers, Si</p>
