    html: |-
      <p>I think I see what you want to do. I had unconsciously assumed that it was OK to have the first two pages numbered 1 and 2.</p>
      <p>If you want the pages before the contents page to be unnumbered, you'll have to put in a section break (<strong> Insert &gt; Break &gt; Next page</strong>) as the very last thing on the page immediately before the contents page. You want all the pages before the contents page to be in section 1, and the contents page to be the first page in section 2.</p>
      <p>(When working with section breaks, it really helps to show all the formatting marks. You can show formatting marks either by clicking the <strong>Show/Hide</strong> button on the <strong>Standard</strong> toolbar, or by going to <strong>Tools &gt; Options &gt; Formatting marks</strong> and selecting <strong>All</strong>.)</p>
      <p>Next (assuming the page number should be in the footer), go into the footer in section 2 and disconnect it from the footer in section 1. (You can also disconnect the header if  you want or need to.) You do the disconnect by clicking the <strong>Same as Previous</strong> button on the <strong>Header and Footer</strong> toolbar; the button should <em>not</em> have a blue background and outline. If the headers or footers are still connected, there will be a <strong>Same as Previous</strong> message at the corner of the dotted box around the header/footer; you want that message to go away.</p>
      <p>After you have the footers (and/or headers) disconnected, make sure you're in section 2 and then follow the steps I described earlier (beginning with <strong>Insert &gt; Page Numbers &gt; Format</strong>). Don't put the page numbers in before doing the disconnect or you'll have to go back and delete them from section 1.</p>
      <p>If you want to stop the page numbering at some point after the contents page, or change the page number format, you'll have to put in another section break and disconnect the headers/footers at the appropriate point.</p>
