      <p>Basically, what you do to create a page number is go to <strong>Insert &gt; Page Numbers &gt; Format</strong>, select the number format you want (<strong>Number format</strong>), and then, under <strong>Page numbering</strong>, click the <strong>Start at</strong> radio button, then use the spinner to select the page number you want.</p>
      <p>The above procedure puts the page number in a floating frame in the footer. If you don't like the floating frame, the alternative method is to show the header and footer toolbar (doubleclick on a header or a footer, or go to <strong>View &gt; Header and Footer</strong>) and use the options there. This creates the page number inline.</p>
      <p>If there's already a page number somewhere that you're trying to change, use the cursor to select the entire page number and then do the steps in the first paragraph above.</p>
      <p>This is a little more complicated if you have sections and want different page numbering schemes in different sections, but the procedure is basically as described above.</p>
      <p>(Later edit: If you inadvertently create a page number in a floating frame when you really wanted it inline, you can cut the page number out of the frame, paste the number where you want it, and delete the frame. Also, a page number doesn't always have to be in a header or a footer; you can cut it out of the header or footer and paste it into the body text. But unless the page number is in a header or a footer, it will only show up on that one page. However, you can copy an in-body page number to as many different pages as you want and it will increment correctly.)</p>
