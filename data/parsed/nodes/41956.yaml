      <p>Some other style-related tips that come to mind:</p>
      <p>1. If you have a document with a style or styles that you like, you can copy that style or those styles into any other document using the style organizer (<strong>Tools &gt; Templates and Add-Ins &gt; Organizer</strong>). This is also a fast way to delete all the styles from an existing document, rather than deleting them one-by-one using the Styles and Formatting pane. Just make sure you have the correct files open in both the source (left-hand) and target (right-hand) panes; by default, Word opens normal.dot in the target pane, and there are few things more aggravating than nuking the styles in your carefully-constructed normal template.</p>
      <p>2. You can find and replace styles (<strong>Ctrl+H</strong> or <strong>Edit &gt; Replace</strong>).</p>
      <p>3. You won't see any styles listed down the left-hand side of the screen in Normal view unless you first go to <strong>Tools &gt; Options &gt; View &gt; Outline and Normal options</strong> and set the <strong>Style area width</strong> to something other than zero.</p>
