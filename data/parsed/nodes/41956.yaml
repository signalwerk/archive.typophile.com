      <p>Well, the journals work (thankfully) is handled by our overseas setters who work in InDesign and 3B2, so I don't have to worry about Word TOCs any more. But, from back in the day: your template will have a bunch of TOC paragraph styles built in. Assuming you've used proper heading styles for your headings, you can then let Word build the TOC for you (in Word 2003 it's at <em>Insert &gt; Reference &gt; Index and Tables</em>); the best option is to choose to use the styles "From template". The initial result will probably look naff, because by default it'll be single-spaced, full text measure, with dot leaders running right the way across to the page number aligned with the right margin. But you can fix the format after you've generated it.</p>
      <p>Each style in Word has a setting "Update automatically" and for most styles this is an absolute no-go area and should always be switched off (it means that if you apply direct, manual formatting somewhere, it changes the style definition to match it), but in the TOC styles it's actually worth leaving switched on because you know the only page(s) where the TOC styles will be used, and you can then just pull in the left and right indents, adjust the paragraph spacing, etc, in one line, and have the other parts of the TOC update to match.</p>
      <p>First thing, having created the TOC, though: recent versions of Word make ALL parts of the TOC into hyperlinks to the relevant sections, which is annoying when you're trying to restyle the TOC, so you need to switch this off so that only the page number is a hyperlink, like in old versions. Use the keyboard to put the selection point somewhere in the TOC and then press ALT+F9 to toggle to seeing the field code: delete the bit that says "\h " and then ALT+f9 back again, then F9 alone and choose to "update entire table". Then you can select bits of the TOC and horse about with their formatting to your heart's content. The dot leaders can be a bit naff, but you can select them all (in one go, because they're a format associated with a single tab stop) and expand the character spacing to loosen them up a bit.</p>
      <p>Another thing for speeding up repetitive formatting: you can ‘copy' and ‘paste' formatting: not with the "format painter" tool, which switches off the moment you do something else (like type some text) but by selecting something and hitting CTRL+SHIFT+C. That copies the formatting. Then at any time after that you can do CTRL+SHIFT+V to paste it onto other selections.<br>
      ______________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
