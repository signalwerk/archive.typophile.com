      <p>Actually, if you double-click the Format Painter tool, it will stay selected until you double-click it again.</p>
      <p>Just to add to what dtw above says, macros can really speed up the process.</p>
      <p>For example, I have used macros to reformat existing tables with specific text styles, borders and shading; to insert landscape pages into a portrait document; to pull in content from databases.</p>
      <p>You could also assign frequently used styles to a toolbar, or keyboard shortcuts.</p>
      <p>The "Styles and Formatting" task pane, when set to show "formatting in use", is handy for tracking down formatting glitches - text that is not set to one of your approved styles.</p>
