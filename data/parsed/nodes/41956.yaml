      <p>180 pages?  Hah!  We did upwards of 50 topics, with 1-20 volumes for each, and anything from 50 to 500 pages for each volume. ;-)  Five senior editors, twelve junior editors, and upwards of 40 different formatters, tinkering the words of more than 100 authors -- for stuff like that, you really need a serious plan and have everyone sign on to it....</p>
      <p>Finding the easiest way to do it saved us weeks.</p>
      <p>Truth be told, when we were notified that Word was going to be the program of choice, more than a few of us were not happy, but it's really quite amazing what you can beat it into submission to do.</p>
      <p>The most important thing is to format your own Body style in the beginning and to make that the default style for all the text -- it sets the tone for everything else you want to do and lets you figure out where (and how) in the hierarchy you want to move things up and down. Probably 85% of hardcore documentation is this style anyway....</p>
