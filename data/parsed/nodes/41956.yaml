    html: |-
      <p>Glad to see some people actually admitting that Word CAN actually do a lot of things... it's just that you have to know what you're doing to get it to do them. I spent 4 years doing technical radiocommunications manuals in Word, and the ONLY difficulty is the handover between the documenter who knows what they're doing in Word and the content author who doesn't, and who hands you back your file with everything screwed up after they were only supposed to be adding a paragraph here or there...</p>
      <p>Cheryl, you could do either of those options. Setting up a style will take a little longer at the start but be waaay quicker in the long run. As part of the style definition you can set a border (thickness, colour, distance from text on each side, etc.) Don't forget that once you've set up the 'Boxed' style you can give it a keyboard shortcut so you can apply it really quickly without reaching away from the keyboard to the mouse.</p>
      <p>It you get any specific Word probs, google for "Woody's Lounge"; the MS Office experts on there are really knowledgeable and can help set up complex time-saving macros for practically any repetitive task.<br>
      _____________________________________________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
