      <p>Linda, those are really great tips... When I was working in multilingual DTP, I had to work on many documents that had been created in MS Word, and had to pretty much figure things out as I went along.</p>
      <p>Cheryl, to the fine advice already posted here, I might add:</p>
      <p>Turn on invisible characters and make sure the margins and borders of text areas are showing up (I think that last one is under Tools &gt; View, but it's been a while). Also, the Paragraph Format dialog box comes in handy for dealing with lots of things, like leading and hanging indents. Press the Alt/Option key while dragging tab arrows or boxes, to place things precisely where you want (rather than where the program wants).</p>
      <p>Also, there is a handy little <a href="http://www.oreilly.com/catalog/wordpg2/" rel="nofollow">Word Pocket Guide</a> from O'Reilly... (There might be more than one edition, but I'm not sure.) Might be of use to you for the next project.</p>
