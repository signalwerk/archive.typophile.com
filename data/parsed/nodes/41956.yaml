    <p>Hi,</p>
    <p>Just started a new job working for a property firm, I have been given a long Word document which has various styles and formatting that is very inconsistent.</p>
    <p>The document looks like formal corporate documentation which has lots of numbered, indented paragraphs ie. </p>
    <p>1.1 Blah blah blah</p>
    <p>1.2 Blah blah blah</p>
    <p>Lots of bulleted lists, other sublists with dashes etc. I am used to typesetting from Indesign but they want me to use Word here. </p>
    <p>Does anyone know any good web or book resources about Styles and Formatting in Word?</p>
    <p>I want it to look perfect but it is rather fiddly in this program.</p>
    <p>In Indesign you can click a command using a crosshair character and everything will indent to that point, (I can't remember the exact command). If anyone knows any shortcuts to get all the paragraphs in line please advise.</p>
    <p>There is also an annoying problem, with the dashed lists, like HANGING INDENTS - something I hate and want to eliminate in the quickest way possible throughout the document!</p>
