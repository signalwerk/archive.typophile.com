      <p>Unfortunately, there doesn't seem to be any commercial printed resources for newer versions of Word, although the DIY approach was quite normal when did this 15 or so years ago. </p>
      <p>In particular, I worked on a lot of hardcore nasty scientific documentation with just Word, and the only way we ever found to deal with it consistently (multiple, large volumes from diverse authors, to be co-ordinated into one package) was to turn off the automatic numbering stuff (print out a hard copy first, so you know what and where your head levels are), and code it manually. </p>
      <p>Kill all the generic Word styles and create your own as well, since they won't have the autonum features.  After I print out a reference copy, I generally dispose of all formatting, then start with a Body style (make the whole thing this style to start, once you've got it), devolve whatever I want for indents/points/quotes from that, and then create a series of heads after that (starting from biggest to smallest is easiest, I've found), and tag them as you go along.</p>
      <p>Yes, it's fiddly -- you might even find it worth your while to create a dummy document to do all this in, then paste your styles as a template into the "real" document, but any other approach will leave you tearing your hair out as some point.</p>
      <p>And unless you want your friends to call you "Baldy".....  ;-)</p>
