      <p>No, it’s Hollywood grand guignol, gravitas applied pretentiously to a campy kids comic book.</p>
      <p>Graphics and text can be integrated into a ﬁlum, but instead we get the pseudo-reality of a video game.</p>
      <p>It’s not as if outrunning an explosion or surviving a 30 ft fall without crippling yourself is real, so why pretend? To me, the feigned realism of such movie effects just looks stupid—why not have something impossible shown in non-naturalistic imagery, especially if it’s derived from a comic book? Didn’t art get beyond mere naturalism in the 19th century? </p>
      <p>However, I thought <em>The Matrix</em> made sense.</p>
