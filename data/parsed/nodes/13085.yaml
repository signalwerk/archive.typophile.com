    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Randy Jones</strong></p>
    <p>Randy Jones is <a href="/wiki/Bay%20Area" class="freelinking" rel="nofollow">Bay Area</a> based freelance graphic designer and principal of <a href="/wiki/Aquatoad%20Design" class="freelinking" rel="nofollow">Aquatoad Design</a>.</p>
    <p><strong>Typefaces by Randy Jones:</strong></p>
    <p><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000054" rel="nofollow"><strong>Olduvai</strong></a>: Olduvai is a rough, hand drawn font suitable for text. It's available through <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a>. More on it's development <a href="http://typophile.com/node/3238" rel="nofollow">here</a>.<br>
    <a href="http://www.veer.com/products/typedetail.aspx?image=FOT0000085" rel="nofollow"><strong>Eason</strong></a>: Eason is a post modern text face with loose roots in <a href="/wiki/Jenson" class="freelinking" rel="nofollow">Jenson</a>. It's available through <a href="/wiki/Fountain" class="freelinking" rel="nofollow">Fountain</a>/<a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a>. More on it's development <a href="http://typophile.com/node/2349" rel="nofollow">here</a> and <a href="http://typophile.com/node/9290" rel="nofollow">here</a>. </p>
    <p>Website: <a href="http://www.aquatoad.com" title="www.aquatoad.com">www.aquatoad.com</a></p>
