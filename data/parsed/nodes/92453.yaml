    <p>This is a rough sample of hhgregg's Fine Lines store logo. I'm trying to recreate it as a vector type logo but I don't know what fonts are being used. The font for hhgregg has a unique g letter but I have been unable to find what font it is. The font for Fine Lines is a different font, I think, that I hope someone can id. The web address is a third font but I don't need that font id'd. Just the Fine Lines and hhgregg.</p>
    <p>Any help would be greatly appreciated.  Thank you in advance for any help you all can offer.</p>
    <p>Debsterbug</p>
