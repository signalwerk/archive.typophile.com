    votes: null
    html: |-
      <p>Hi there,</p>
      <p>Well this sort of stuff is always going to be tricky, because quite possibly it will have been done as a one off hand lettered job and not be based on any particular font as such. Although, when I first saw the logo it had a familiarity about it, so just for the hell of it I dropped a key line of a "brush style' font over it and, well, it looks to me that it may well have started out being based on the font "Bira" by Måns Grebäck as the e, o, n are almost identical on the overlay. Then it would have been further modified for the swash on the g etc. You get the general idea!</p>
      <p>Anyhow, as you seem interested in this type of "hand lettered/brush" style of font with extra ligatures and glyphs, check out others by Måns Grebäck:<br>
      <a href="http://www.aringtypeface.com/" title="http://www.aringtypeface.com/">http://www.aringtypeface.com/</a><br>
      and especially the classy fonts available from<br>
      <a href="http://sudtipos.com/fonts/90" title="http://sudtipos.com/fonts/90">http://sudtipos.com/fonts/90</a><br>
      Way cool stuff -<br>
      Also, for the real sign writers:<br>
      <a href="http://artandsignstudio.com/fontmenu.html" title="http://artandsignstudio.com/fontmenu.html">http://artandsignstudio.com/fontmenu.html</a><br>
      Plus, as ever - the always fantastic:<br>
      <a href="http://www.letterheadfonts.com/" title="http://www.letterheadfonts.com/">http://www.letterheadfonts.com/</a><br>
      Enjoy!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bira-Personal_5285.gif"></div><p></p>
