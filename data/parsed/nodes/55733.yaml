  html: |-
    <p>I'm wrapping up a retro baseline script <a href="http://typophile.com/battle28">that started as a type battle entry</a>. I want the high/low joins to happen automatically. At first I put them in calt because, well, they are contextual alts o+r -&gt; o+r.high (<a href="http://typophile.com/node/52410">see here</a>). However some major apps (Illustrator CS2) don't have calt on by default, but most do have liga on. I have seen many examples in the wild of nicely designed scripts ruined by ignorance about calt. </p>
    <p>Would it be a problem to do this kind of sub inside liga? The result is very ligature-esque and I can't imagine a time when you'd want ligs on, but this off, or visa versa.</p>
    <p>Anything I'm overlooking? Thx!</p>
  html_clean: |-
    <p>I'm wrapping up a retro baseline script <a href="http://typophile.com/battle28" class="link-lost">that started as a type battle entry</a>. I want the high/low joins to happen automatically. At first I put them in calt because, well, they are contextual alts o+r -&gt; o+r.high (<a href="/node/52410/" class="link-kept">see here</a>). However some major apps (Illustrator CS2) don't have calt on by default, but most do have liga on. I have seen many examples in the wild of nicely designed scripts ruined by ignorance about calt. </p>
    <p>Would it be a problem to do this kind of sub inside liga? The result is very ligature-esque and I can't imagine a time when you'd want ligs on, but this off, or visa versa.</p>
    <p>Anything I'm overlooking? Thx!</p>
