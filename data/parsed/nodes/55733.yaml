      <p>don't hijack the spec as a quick fix for things that may seem problematic now. at least that's the conventional wisdom on such things.</p>
      <p>my opinion is that if you're going to be making OpenType fonts, you must be an OT evangelist yourself, insofar that you educate your user base how to use your the OT features of your fonts effectively.</p>
