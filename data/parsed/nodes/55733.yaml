      <p>As liga is used as a default in more applications, I'd say use that.<br>
      I put contextual alternates in a "Pro" script font, thinking it would be default, but lo and behold, a distributor managed to produce an advertisement for the font with the contextuality turned off, i.e. non-pro.</p>
