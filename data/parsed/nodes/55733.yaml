    html: <p>No matter which feature you choose, there is no guarantee that the end user will set it nicely. They can turn on calt or not. They can just as easily keep ligatures on while attempting to track it out. Since your script is connected using ligatures seems like a reasonable way to go. You could even use the clig feature, though its probably not necessary in your case.</p>
