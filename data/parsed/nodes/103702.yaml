      <p>I will note that doing something with love is not *necessarily* synonymous with doing it well.</p>
      <p>That being said, I note that I would expect the left sidebearing of "a" to be less than the right. Also, that it is not unusual for the default spacing of the slash to step outside its advance width on both sides, which could collide with letters with minimal sidebearings such as z and W.</p>
