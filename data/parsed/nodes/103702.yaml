    <p>[I might post a sample, but it's not that relevant to my question; and ranting about a specific designer and foundry is not what I'm up to...]</p>
    <p>Now I know that badly spaced/kerned font aren't hard to come by. What makes this case special, though: the foundry, in its press release that's reproduced by retailers, emphasizes the ›love‹ that the designer put into spacing and kerning. At first sight it seems some of that love simply missed a few kerning pairs. But even the most fundamental pairs (<code>Te</code> etc.) don't seem to be kerned either.</p>
    <p>Looking at the font file itself, it turns out that the font doesn't contain any kerning information *at all* (nor does it contain any other OpenType features, but unlike the kerning, I wasn't promised anything along that lines anyway).</p>
    <p>Was I too naive thinking that the terminology of such blurbs wouldn't be flexible enough to include the absence of any any kerning even when it advertises the font as particularly well kerned? Should I consider it a bug, contact the retailer (or foundry?), »I think the kerning information got lost along the way... could you provide me with new files that include it?« As for a refund? etc. What do you think?</p>
    <p>any ideas appreciated!<br>
    -- Nils</p>
