      <p>the 1st three paragraphs got lost somehow -- maybe someone can add them...</p>
      <p>I licensed a font the other day, a recently released family of 10 weights * 2 styles * text + display version. I was a bit suspicious of the whole thing, as there didn't seem to be a PDF specimen available anywhere. But the introductory offer was a nice one, and the font seemed perfect for my purposes.</p>
      <p>What I got was a font that, as expected, does have its qualities in some respects, but is kerned/spaced so horribly that it's pretty much useless for the application it was designed for -- it's meant to be a ›legible‹ sans for body text.</p>
      <p>For example, in a string like <code>Hertz/Watt</code>, the lower end of the slash overlaps with the <code>z</code>, and its upper end overlaps with the <code>W.</code> In a word like <code>pad</code>, the <code>a</code> is considerably closer to the <code>p</code> than it is to the <code>d</code> ...etc. All these things a clearly visible at regular reading sizes.</p>
