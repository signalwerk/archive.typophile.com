    html: <p>Take care. While English speakers tend to think of a glottal stop as a 'pause in pronunciation', it is actually just another consonant sound, and in some languages it may appear in a pre-vocalic position, i.e. at the beginning of a syllable and even, as in Arabic, at the beginning of a word. Presuming you are aiming to hyphenate between syllables, you need to understand how the glottal stop is used in the languages you are setting and whether a glottal stop ever begins a syllable. If it doesn't, then you should be safe to hyphenate after the glottal stop.</p>
