  html: |-
    <p>We are setting a book with A LOT of different Native American languages -- Hopi, Navajo, etc. etc.</p>
    <p>If you make a general word list (language unknown) and avoid certain letter pairings as hyphenation points, not many choices remain -- for example, ngw, ngy, ky, kw etc. are single letters in Hopi, and ay, aw, iw, iy, etc. are dipthongs.</p>
    <p>But it occurs to me -- why can't you always break at a glottal stop? there is a pause in pronunciation there anyway. Did a quick search &amp; found nothing either way.</p>
    <p>Thoughts?</p>
    <p>TIA</p>
    <p>Charles</p>
