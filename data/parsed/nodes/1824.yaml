    html: "<p>Well, here's the maths: <br> <br>point size = (pixel size / resolution) x 72 <br> <br>So 12 pixel type at 72 dpi approximates 12pt type. 12 pixel type at the old typical Windows standard of 96 dpi is approximately 9 pt type. <br> <br>On my 133 dpi screen, 12 pixel type is about 6.5 pt. On the popular new Del laptops with 145 dpi screens, it is a little smaller than 6 pt. <br> <br>On the IBM 200 dpi screens (now down to $7,500 US! -- when I started paying attention they were $22,000), 12 pixel type is 4.3 pt. <br> <br>Now what does this tell you about the wisdom of using a non-fixed unit to specify fixed sizes of specify type?</p>"
