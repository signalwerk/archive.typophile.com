    html: "<p>\"The page width is set at 780 pixels. If people post big graphics IE will still maintain the page width, but Safari doesn't. What do you think?\" <br> <br>I think that's simply too wide for comfortable reading lengths for a lot of people. Plus, I normally browser with my window at roughtly 5/600 pixels wide. I think the problem is how the template is spit out. <br> <br>The code is also INCREDIBLY messy, redundant and bloated with all sorts of font tags and such. On this page, I see 16 closing font tags in a row (yikes!): <br> <br>&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt; <br> <br>The problem is that the entire thread is in one table that is nested in another table. Each comment in the thread is a TR of the parent, so whatever the parent table's width is, each comment will be that width. <br> <br>If you want to stick with tables, the fix (I think) is to get rid of the wrapper table and then allow each comment in the thread be it's own table, with a percentage width. <br> <br>This isn't an uncommon problem with these types of forums that were built in the hey-day of 'let's do everything with a ton of tables' and it's really only a problem here due to the fact that we post rather large images. <br> <br>\"Arial, Helvetica, Sans-serif at 12pixels (not 12points).\" <br> <br>A typographic site spec'ing Arial? Gasp! Shock! Horror! ;o) ;o) ;o)</p>"
    html_clean: "<p>\"The page width is set at 780 pixels. If people post big graphics IE will still maintain the page width, but Safari doesn't. What do you think?\" <br> <br>I think that's simply too wide for comfortable reading lengths for a lot of people. Plus, I normally browser with my window at roughtly 5/600 pixels wide. I think the problem is how the template is spit out. <br> <br>The code is also INCREDIBLY messy, redundant and bloated with all sorts of font tags and such. On this page, I see 16 closing font tags in a row (yikes!): <br> <br>&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt;&lt;/font&gt; <br> <br>The problem is that the entire thread is in one table that is nested in another table. Each comment in the thread is a TR of the parent, so whatever the parent table's width is, each comment will be that width. <br> <br>If you want to stick with tables, the fix (I think) is to get rid of the wrapper table and then allow each comment in the thread be it's own table, with a percentage width. <br> <br>This isn't an uncommon problem with these types of forums that were built in the hey-day of 'let's do everything with a ton of tables' and it's really only a problem here due to the fact that we post rather large images. <br> <br>\"Arial, Helvetica, Sans-serif at 12pixels (not 12points).\" <br> <br>A typographic site spec'ing Arial? Gasp! Shock! Horror! ;o) ;o) ;o)</p>"
