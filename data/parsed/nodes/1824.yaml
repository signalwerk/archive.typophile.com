    html: "<p>Aargh! What's happened to Typophile? Someone has been playing with the style sheet, and suddenly the message type is 6pt, half my screen is wasted, things are colliding, it's a mess. <br> <br>Guys, fixed pixel type sizes = Really Bad Thing. Those of us with 133+ dpi screens will go blind with this tiny type. <br> <br>Sure the line length thing was was annoying, but the way to fix that is to specify text blocks as divs with widths in ems. <br> <br>It is 6:00 here in Vancouver, and the General Discussion list looks like this (if your resolution is less than 133 dpi, imagine that this graphic is only 5.75 inches wide and the type correspondingly small; the type in threads is about 2pts smaller): <br> <br><img src=\"http://www.typophile.com/forums/messages/30/19500.gif\" alt=\"Typophile at 18:00 hours\"></p>"
    html_clean: "<p>Aargh! What's happened to Typophile? Someone has been playing with the style sheet, and suddenly the message type is 6pt, half my screen is wasted, things are colliding, it's a mess. <br> <br>Guys, fixed pixel type sizes = Really Bad Thing. Those of us with 133+ dpi screens will go blind with this tiny type. <br> <br>Sure the line length thing was was annoying, but the way to fix that is to specify text blocks as divs with widths in ems. <br> <br>It is 6:00 here in Vancouver, and the General Discussion list looks like this (if your resolution is less than 133 dpi, imagine that this graphic is only 5.75 inches wide and the type correspondingly small; the type in threads is about 2pts smaller): <br> <br><img src=\"http://www.typophile.com/forums/messages/30/19500.gif\" alt=\"Typophile at 18:00 hours\"></p>"
