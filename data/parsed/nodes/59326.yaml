    html: |-
      <p>Mind that the AFDKO feature file syntax as used in FLS5 and FM is a higher level language and does not match binary layout tables one-to-one. There is some "translation" involved which shows when you re-import layout tables. With some lookup types, differences are more drastic than in your example.</p>
      <p>The "dflt" (lowercase) keyword is only used in combination with "language". The default "script" is designated by "DFLT" (uppercase).<br>
      If you want to address "script DFLT", you need to run FLS5-generated .otfs or .ttfs through Adam Twardoch's script <a href="http://www.silesian.com/software/FixDFLTScriptTagSL.zip">Fix DFLT Script Tag</a>. (He also made helpful remarks about script DFLT in a more recent Typophile discussion, you need to google for it.)</p>
