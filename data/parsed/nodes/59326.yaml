      <p>paragraph</p>
      <p>You can decompile the GSUB-table of your Font, generated with FontLab. Autohint the font with the AFDKO and then merge the decompiled GSUB-table back into the autohinted font. But somehow I doubt, that the autohint program messes up the GSUB-table. However, it is worth to try. I often correct fonts in this way, when I want to keep changes at the minimum.</p>
