  html: |-
    <p>Something weird's going on with my fonts: if I open a font that has been generated, and passed trough autohint, the contents of the liga feature changes, and FL5 refuses to compile (Fatal Error). This seems to be sticky, so fonts opened afterwards acquire the same problem (or I might just be going nuts). The only real change other than numberin simplified seems to be that "script dflt;" becomes "script ;"</p>
    <p>Is it another of the FL5 little surprises or does autohint simplify/edit liga? Please see transcript below:</p>
    <p>Before:</p>
    <p>feature liga { # Standard Ligatures<br>
     # Latin<br>
    lookup liga16 {<br>
        sub f f i by ffi;<br>
        sub f i by fi;<br>
    } liga16;<br>
    lookup liga17 {<br>
        sub f f j by f_f_j;<br>
        sub f f l by ffl;<br>
        sub f f by ff;<br>
        sub f j by f_j;<br>
        sub f l by fl;<br>
    } liga17;<br>
     language AZE  exclude_dflt; # Azeri<br>
    lookup liga17;<br>
     language CRT  exclude_dflt; # Crimean Tatar<br>
    lookup liga17;<br>
     language MOL ; # Moldavian<br>
     language ROM ; # Romanian<br>
     language TRK  exclude_dflt; # Turkish<br>
    lookup liga17;<br>
     script dflt;<br>
    lookup liga16;<br>
    lookup liga17;<br>
    } liga;</p>
    <p>After generating OTF and passing through FDK autohint:</p>
    <p>feature liga { # Standard Ligatures<br>
     # Latin<br>
    lookup liga1 {<br>
        sub f f i by ffi;<br>
        sub f i by fi;<br>
    } liga1;<br>
    lookup liga2 {<br>
        sub f f j by f_f_j;<br>
        sub f f l by ffl;<br>
        sub f f by ff;<br>
        sub f j by f_j;<br>
        sub f l by fl;<br>
    } liga2;<br>
     language AZE  exclude_dflt; # Azeri<br>
    lookup liga2;<br>
     language CRT  exclude_dflt; # Crimean Tatar<br>
    lookup liga2;<br>
     language MOL ; # Moldavian<br>
     language ROM ; # Romanian<br>
     language TRK  exclude_dflt; # Turkish<br>
    lookup liga2;<br>
     script     ;<br>
    lookup liga1;<br>
    lookup liga2;<br>
    } liga;</p>
