      <p>The hose writing could be a very beautiful but tricky and painful wordmark. BUt if you can pull it off could work. It also reminds me of this logo/typeface that  <a href="http://www.muccadesign.com/" rel="nofollow">mucca design </a> created. I dont think its available though but you get the idea. I would keep it connected.</p>
