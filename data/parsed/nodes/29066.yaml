      <p>I'd be careful in filling the counter shapes of your earlier versions. Depending on the media logos should work well in black and white and with color. So if this were to be in black the counter shapes would be lost. Now if its for web ONLY well I've seen all kinds of crazy logos with millions of colors etc. but in any case I would avoid that.<br>
