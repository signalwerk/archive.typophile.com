      <p>Hey Satya nice photo, It's always good to put a face to the name,</p>
      <p>I'd go concept no. 1. yes I think no. 2 may be a touch close to typophile ;)</p>
      <p>My humble advice is to go a bit further, you've got the concept of water interacting with letters, it's a good concept but it seems like there's more room to take it in different directions. filling the bowls/counters of the letters is a simple solution but perhaps isn't special enough for a logo.</p>
      <p>Something I tell myself often is that I don't need to somehow remain faithful in a 1:1 relationship with a concept, but I rather need to recognise that a concept is a starting point and not a straitjacket. It is not necessary for a viewer to 'get' straight away what they are looking at, but rather to get a feel or a sensation that is relevant.</p>
      <p>For example, what would happen if you deleted the black outlines around the blue bowls and treated the blue colour as a dynamic shape, where could you take that? etc etc etc. It's always worth spending a bit more time brainstorming ideas out on paper even when you think you've got something, don't be an editor at this point, that will kill it, just let the ideas come from that starting point</p>
      <p>take it or leave it, it works as it currently is but maybe there's room to add more interest<br>
      cheers</p>
      <p>--N</p>
