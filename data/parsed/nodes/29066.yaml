    html: |-
      <p>There are several problems with this logo idea ( as presented)  that I see:</p>
      <p>- Neither the bird nor the water thing ( bird bath fountain? how can we guess?) is shaped so that it is recognzeable instantly. And it's not thet you have an aha moment either. They are just not strong.</p>
      <p>- the color is essential to the logo making sense. This is not good. it may need to be in in B&amp;W.  </p>
      <p>- the blue when printed in B&amp;W (unless you make special b&amp;w version which might be accidentally NOT used) will print as dark obscuring the name</p>
      <p>- The letters are placed so closely to gether that they dont read very effectively especially the lowercase.</p>
      <p>My advice. Make it work in B&amp;w first so that color is a bonus but not required, Make your bird more birdlike. Conside a different angle. Find somebody who can draw if you cannot. Make the name bigger or clearer or both. </p>
      <p>And keep considering new ideas. What about a storm cloud with reversed white on grey type? You could use a photo or get a weather icon. What about a watering can? What about a melting ice cube - you could write the name out with your finger on glass so the meltwater spells it out. Or the reverse use a glass that has been sprayed and is beaded up with water. Then use your finger ( or whatever)  to make the beads join and up flow away revealing your letters...</p>
      <p>good luck!</p>
