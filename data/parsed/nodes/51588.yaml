    <p>Yes, that's what I've been looking for.<br>
    I've been working with an old PS version of Gerard Ungers Swift, but we wanted the OpenType version for our client, and so we went a-looking. But I can't find one that includes both small caps and old style figures. I've found the small caps in the PRO version but the OS figures are impossible to find. Or I could be going blind.<br>
    Could anyone of you with better eyesight and/or stamina direct me towards a proper version?</p>
    <p>It would be appreciated.</p>
    <p>Yours,</p>
