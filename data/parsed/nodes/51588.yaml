    html: |-
      <p>That is a good question! Unfortunately, I do not know the answer. Swift was originally produced at Hell, if I recall, which became part of Linotype in 1989. But by that time, there were may or may not have been other legitimate versions of Swift in distribution. I suspect that, as was the case with some other faces during their conversion to OpenType, Linotype may not have had its own SC and OsF font data available. If this were the case, the only way to include them in the OT fonts might have been to redraw the SC and OsFs glyphs directly. What goes into a legacy OpenType font is not as simple a decision as one might wish it to be, and it depends on a number of factors in the air at the time of the font's conversion.</p>
      <p>On the other hand, I feel bad that we don't have an off-the-shelf solution for Fredrik, which is why I suggested Gerard's website. But that does seem to just offer PostScript and TT Swift 2.0 fonts. I'm sorry that I cannot be of more help :(</p>
