      <p>Will, there is an argument for it. A dash signals a thought not (grammatically) connected to the previous sentence or clause. As some point, the author's name below the blurb is not connected -- you don't say "written by . . " etc. Though as you say, there is a long history for finding the name below the quote (generally recognized visual clue).</p>
      <p>The same is often true of subheads, by the way. Instead of saying (more eloquently) "I'm through talking about <cite>this,</cite> now I want to talk about <cite>that</cite> -- i.e., a paragraph of transition, we just dump that paragraph &amp; stick in a subhead. So, does it need to be bold, as is so often thought &amp; taught? Or does it need to be bold only when the author is particularly opaque?</p>
    html_clean: |-
