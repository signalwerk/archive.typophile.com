      <p>Getting rid of em dashes: that's something I can get behind — sometimes. (What follows is a bit off topic, I admit.)</p>
      <p>One of my pet peeves is the un-thinking use of the em dash on book jackets and ad cards before the name of a blurber. I refuse to let such uses stand on/in books from our publishing house. In such uses the em dash is an utterly inappropriate marker. This holds true also for such things as epigraphs.</p>
      <p>The distinction between a bit of text and its author can be entirely visual. We have typeface, weight, color, spacing, indent to do that job. </p>
      <p>I'm not sure when the practice began. But it is time for it to go.</p>
      <p>A well-fitted 3/4 em dash in text is a thing of beauty, though.</p>
      <p>powers</p>
