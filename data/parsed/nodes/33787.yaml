      <p>I would agree with the others that this needs some work, though not particularly with the suggestions -- except the one that you use a new dash only when there is a new speaker.</p>
      <p>The partially outdented dash doesn't bother me too much visually -- an alternate treatment would be to outdent the first words of a new speaker -- but it does structurally. One part of using a dash is that it keeps some of its regular meaning.</p>
      <p>I've been involved in some interesting arguments on em dashes. Richard Eckersley, a product of the London College of Printing, use to argue in favor of the word-spaced en dash. He argued that a dash separates two thoughts, whereas a closed-up emdash visually appears to join them. I finally got him to agree that another way to describe a dash is that it joins two thoughts without the grammatical work usually needed. Whether you describe a dash as joining or separating involves a bit of whimsy. We finally settled on a 3/4-em long dash centered in an em space as the perfect dash for normal use.</p>
      <p>Now how is this relevant? Again, because I think the dash viewed as a character carries some of its usual meaning in this context. It isn't simply that a dash is more graceful than a bullet. If all you want is a visual separator, you could use almost anything.</p>
      <p>To me, this is what is know as a design problem -- you need a cue, and it can be visual or grammatical, or both, and which you choose has an effect. So make it one you want.</p>
      <p>&amp;BTW, this appears to be 2-columns, with the attendant short measure.  You could get by with an en-dash or 3/4 dash is space is a concern.</p>
      <p>FWIW</p>
