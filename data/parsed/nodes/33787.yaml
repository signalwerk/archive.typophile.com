      <p><cite>Does the em dash typgraphically speaking works within this context if I may ask.</cite></p>
      <p>Well, yes and no. As you say, the dash removes the repetition of using the names. If the text clearly &amp; quickly identifies the speaker, a dash works fine. But if the questioner asks long and thought-provoking questions, a reader might get confused as to who is speaking. In other words, you are relying on context to identify each speaker. If this is pretty clear, the dash works. If it isn't, another approach is needed. If you don't want ot use the full name, initials work too -- </p>
      <p><cite>C.E.</cite> Don't apologize, English is my <cite>only</cite> language.</p>
      <p><cite>H.C.</cite> (whatever you'd say, I don't want to put words in your mouth).</p>
      <p><cite>C.E.</cite> (long, rambling question).</p>
      <p><cite>H.C.</cite> (concise answer).</p>
      <p>Etc. The initials could be small caps, though that might look strange in this context. If the magazine is informal, the period could perhaps be omitted, check with an editor.</p>
      <p>I think something like this is what you were doing with the questioner's words set in italic, and the responder's words in roman, right? That works too, and with such a structure, the dash isn't needed, and might get in the way, since it can imply, as you say, a discontinuity.</p>
      <p>But if the questions are short &amp; obviously questions, there are only two speakers, and the answers clearly that, a dash will work fine.</p>
      <p>Best,</p>
      <p>Charles</p>
