      <p>I agree with Maxim -- I am used to seeing em dashes opening lines of dialogue in Spanish-language novels, but only because it is an established convention for that language. I expect them to be there. Whereas in English, I expect to see quotation marks (again, in a novel -- interviews can be set differently).</p>
      <p>Jpad makes a great point, too. Whether you use bold or italics to differentiate the questions from the answers, you already have a way to tell the two speakers apart. Just add their initials, names, or "Q" and "A" at the beginning of the first two comments, and you are all set.</p>
