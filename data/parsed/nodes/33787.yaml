      <p>Well, I find the way you implemented it to be a bit confusing. The first bit of dialogue is in italic, suggesting a question, but the next two are not. Are there multiple people responding? If there are, then you need some way to differentiate between the two -- and the em dash method on its own won't work well. But if it's just one person's response in multiple paragraphs, then you shouldn't put an em dash in the second paragraph -- it makes it seem like there's another person talking. Instead, just indent paragraphs until the next question is asked. You might find, though, that italicizing and screening the questions may do enough to differentiate them from the answers, so no need for em dashes.</p>
      <p>In summary, it can work fine, but you need to refine it.</p>
