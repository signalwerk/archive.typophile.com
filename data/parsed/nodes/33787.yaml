    <p>Quoting from The Elements of Typographic Style, a good use of em dashes is to introduce speakers in a narrative dialogue. This is inspired by the European style, and is less fussy than quotation marks:</p>
    <p>Taking a slightly different approach,<br><strong>Instead of</strong><br>
    Q: How are you<br>
    A: I am fine.</p>
    <p><strong>I've used</strong><br>
    — <em>How are you</em><br>
    — I am fine</p>
    <p>for an interview spread which I am designing.</p>
    <p>I've seeking for feedback whether would this way of marking interview dialogues be a feasible one. Suggestions are much appreciated.</p>
    <p><img src="/sites/default/files/old-images/Picture-2_4272.gif"></p>
