      <p>Charles:</p>
      <p>Forgive me if I'm being a bit opaque myself this late in the evening. Are you saying there's an argument for getting rid of the em dash, or for keeping it?</p>
      <p>In extended text: keep it, but use the spaced 3/4-em dash. This makes that "connection" work.</p>
      <p>In the instance of jackets and covers, as well as epigraphs at chapter heads, etc: get rid of it. If I attribute a blurb or an epigraph through the use of a type change [most likely smalls or semibold], color, line feed, indent, etc., then even the thickest of readers will be able to comprehend the "written by" inherent in those visual changes.</p>
      <p>powers</p>
