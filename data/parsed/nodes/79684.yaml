      <p>Hi all,</p>
      <p>Thanks for responses. You caught me dropping in some holding text in development there Frank! It's more of a general question on practice/any recent observations really; it's always interesting to run through methods/procedures for mulling over typefaces for a print editorial setting.</p>
      <p>From a brief perspective, things really can be best described as 'general', as items may be on news to general interest for most of the public (all ages and backgrounds), so must form a solid base for generic content; variations within a type family where appropriate may add interest, but reinforce consistency. Currently considering a sans/serif compliment: possibly a geometric for display paired with a transitional serif for body. But it would be interesting to hear of any favourites in this setting/publications or typeface selections that have caught your eye.</p>
      <p>One thing that stood out to me recently was the Economist's Intelligent Life magazine: beautiful typography that shares a high standard with the magazine's sister publication.</p>
