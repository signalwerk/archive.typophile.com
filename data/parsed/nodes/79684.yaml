    <p>Hi all,</p>
    <p>Am currently researching type families for use in a general-interest magazine that will be produced. The design is being generated from the ground up with no prior style guides; as well as developing structure and layout, appropriate text and display faces must be selected.</p>
    <p>Am wondering of any suggestions you may have for classic or contemporary faces in an editorial setting that you're feeling at the moment. Or in fact strategies you may have in place for selecting typefaces in these cases that have worked for you.</p>
    <p>Thanks in advance</p>
