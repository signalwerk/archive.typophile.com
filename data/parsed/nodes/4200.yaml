  html: <p>Hi guys, <br> <br>I'm redesigning an identity for a european designer and manufacturer of memory products. (<a href="http://www.ez-memory.com" target="_blank">http://www.ez-memory.com</a>)  <br> <br>Well, the customer needs/wants a refreshment in both style and name so we've changed it to Easymemory and added some dynamics and a fresh green color <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>The font is Bliss regular... what do you think so far? <br> <br>Gracia! <br> <br><img src="http://www.typophile.com/forums/messages/29/33002.jpg" alt="Easymemory"></p>
  html_clean: <p>Hi guys, <br> <br>I'm redesigning an identity for a european designer and manufacturer of memory products. (<a href="http://www.ez-memory.com" target="_blank" class="link-external">http://www.ez-memory.com</a>)  <br> <br>Well, the customer needs/wants a refreshment in both style and name so we've changed it to Easymemory and added some dynamics and a fresh green color <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>The font is Bliss regular... what do you think so far? <br> <br>Gracia! <br> <br><img src="http://www.typophile.com/forums/messages/29/33002.jpg" alt="Easymemory"></p>
