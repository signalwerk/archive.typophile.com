  html: |-
    <p>I'm in the process of making a text face comparision for non-designer colleagues, using familiar fonts bundled with various operating systems and programs. And also a few unfamiliar (to them) text faces for contrast.</p>
    <p>I know Franklin Gothic is known as a newspaper &amp; advert headline face, but since it also comes with a lighter weight, is it ever suitable as a text face?</p>
    <p>To me it looks businesslike, certainly not elegant, but preferable to Arial, for instance.</p>
    <p>Thanks in advance.</p>
