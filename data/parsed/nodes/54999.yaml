    html: <p>Franklin Gothic is perfectly suitable for text as long as you choose the right weight and point size. I use 9.5 pt. ITC Franklin Gothic Std Book Condensed for short articles and sidebars. I will choose it, News Gothic or Trade Gothic over Helvetica or Arial every day of the week.</p>
