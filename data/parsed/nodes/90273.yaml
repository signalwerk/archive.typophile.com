      <p>This is my first free-hand sketch of what I had in mind. </p>
      <p>I wanted the font to communicate a modular approach to design, clean lines, and "air" in the room. The spacing, weight, proportions, curves, etc..., will be taken care of by a graphics/font designer - I just wanted to see what these shapes looked like on paper. </p>
      <p>First sketch</p>
