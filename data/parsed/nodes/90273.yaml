    <p>If I look at one more logo portfolio, I'm going to get sick. I've literally browsed through thousands of logos. Maybe this isn't the way to go. Maybe everything that I need to communicate is bundled into the font itself. I was reading an article entitled "Creating Beautiful Fonts," and it led me to the Typophile community.</p>
    <p>What's in a name? I have a decent enough domain name to work with, but I would love to find a unique font, that by itself, could be recognized. I'll give you a brief, and I'd love to hear your suggestions. All suggestions will be appreciated.</p>
    <p>Business Name: Lumeor (.com)</p>
    <p>Name Reasoning: Lumen, unit of light, bright living, bright choices.</p>
    <p>Tag Line: {lifestyle, delivered}</p>
    <p>Business Description: Design and manufacture unique home furnishings with quality products for every income level and every lifestyle. Delivered directly to the customer. No store mazes, no pressure, just point, click, and deliver. Hand-made furnishings at affordable prices.</p>
    <p>Thanks,<br>
    Michael</p>
