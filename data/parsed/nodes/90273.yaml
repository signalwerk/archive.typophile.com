      <p>I just realized that I failed to answer some specific questions:</p>
      <p>&gt; Does the slant on the L give it a lighter feel?</p>
      <p>More than lightness, what slant would do (both in the "L"<br>
      and the "o") is make the overall visual impression more<br>
      consistent, since the other four letters in the name all<br>
      exhibit that idiosyncratic slant. The letterforms in a<br>
      font are designed to work well "on average" with all the<br>
      other letterforms, and when you have a <em>specific</em> set of<br>
      letterforms to work with (as with a typographic logo)<br>
      then the opportunity arises to tune the letterforms in<br>
      ways that amplify the setting at hand.</p>
      <p>&gt; Is it standard to use all uppercase?</p>
      <p>There is no standard, and in fact in this case<br>
      using all-caps would go against your identity.</p>
      <p>&gt; What color or shade should i be thinking of?</p>
      <p>Any color as long as it's black. Kidding. That's just<br>
      what a type designer likes to limit things to. If you<br>
      want to play it safe maybe furniture = brown? But of<br>
      course it's not that simple, and I would defer to the<br>
      professional graphic designers amongst us when it<br>
      comes to color.</p>
      <p>hhp</p>
