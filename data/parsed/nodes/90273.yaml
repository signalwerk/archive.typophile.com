      <p>Your company's visual identity is more than just a logo. It's also the design of your website, letterhead, business cards, business forms, advertising, signage, packaging, etc.  </p>
      <p>If you want your company to look professional you should hire a professional graphic designer (or design firm). I'd suggest interviewing local designers so you can meet them face to face. Review their portfolios, ask them how they would approach the job, ask to see examples of similar jobs they've done for other clients, ask for a list of other companies they've done similar jobs for and call to ask how the jobs went, get a written estimate giving estimated fees, expenses and timelines for your projects.</p>
    html_clean: |-
