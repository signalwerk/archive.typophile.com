      <p>Type-only logos can be awesome, but if you really<br>
      want unique, you gotta customize, hopefully in a<br>
      direction that evokes your brand.</p>
      <p>In your case I'm thinking you could take something<br>
      like FF Primary* and -very judiciously- make it much<br>
      wider, since width conveys friendliness ("every income<br>
      level and every lifestyle"). I'd also change the bottom of<br>
      the "L" to slant up like the bottom of the "e", and possibly<br>
      slant the top &amp; bottom of the "o" in the same way.</p>
      <p>* Especially the Round Bold cut:<br>
      <a href="http://www.myfonts.com/fonts/fontfont/ff-primary/round-bold/" title="http://www.myfonts.com/fonts/fontfont/ff-primary/round-bold/">http://www.myfonts.com/fonts/fontfont/ff-primary/round-bold/</a></p>
      <p>BTW, one nice bonus about Primary (although not the<br>
      Round cuts) is that it comes in "layers" that you can<br>
      apply in different colors (hopefully just shades of one<br>
      base color :-) to "build" depth - sort of like furniture.</p>
      <p>hhp</p>
