      <p>I think you should consider hiring a professional.</p>
      <p>Yes, type selection is a good place to start; but it's only one part (and it's also really more complex than just following one person's, or even a few people's suggestions). Then there's how to set the text in question. There's the whole world of color. The question of additional graphical elements. Customization of the lettershapes. No offense, but the nature of your questions makes me suspect that if you continue this way you're probably only going to tap into a tiny corner of the vast array of possibilities and variables that need to be carefully negotiated to result in a truly solid and successful solution – successful not just in terms of looking good, but in communicating what you need it to, and reinforcing your brand.</p>
