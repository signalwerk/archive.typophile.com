      <p>Do you mean marathon or do you mean sprint?  :-)</p>
      <p>The bad news is that this sort of exercise might cheapen the craft. The good news is it makes you look good in terms of producing something not horrible in an extremely short time, illustrating the role of talent and skill to newbies who make an attempt and fail at making something decent even though they spend much more time (and often even start from somebody else's outlines).</p>
      <p>And the "a" is actually quite nice.  :-)</p>
      <p>hhp</p>
