    <p>I just had a talk with an old friend, and remembered I once made a font in just three hours and four minutes. It was for AtypI 05. I'd promised to the House guys that (after they almost managed their Font Sprint in Vancouver) that I'd try to make a full character Western character set in under five hours. I used an old RoboFog for character design and kerning pairs, and FontLab for OT features. I'd made a file ready with guides, so I didn't start absolutelyfrom  scratch.<br>
    This took me 3 hours and 4 minutes from start to PDF sample:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Mara_4489.png"></div><br>
    I think it's ugly as f**k, but it works as a font. What do you think?<p></p>
