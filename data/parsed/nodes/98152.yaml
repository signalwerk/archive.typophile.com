      <p>The application of the words "sprint" and "marathon" to non-running activities has always confused me. I'll be attending a life-drawing marathon tomorrow that goes for about 6 hours, and in a couple weeks a documentation sprint that takes place over 6 days, to use the names by which their respective organizers call them. I suppose they're both tests of speed and endurance, but not in any other way similar to any sort of athletic competition.</p>
      <p>But anyway, that's a pretty admirable font you made there, all things considered. I'm capable of banging out as many glyphs in a similar amount of time, but they usually don't look that good when I do.</p>
