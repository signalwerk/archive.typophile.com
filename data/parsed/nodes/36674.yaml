      <p>Still, as a math symbol, it's used in the context of computer programming languages and such. I don't think I've ever seen it used in a math text book.* It's a stand in for the lack of superscripted characters in ASCII just as the asterisk and forward slash are used for multiply and divide symbols.</p>
      <p>* Although, I went to school before personal computers were common, so maybe that's changed?</p>
