    html: <p>It's not part of the traditional typographical world. It's part of the ASCII character set which goes back to Teletype days. Generally, it's only used in the context of computer code (programming, scripting, command line, etc.). Same goes for asciitilde.</p>
    html_clean: <p>It's not part of the traditional typographical world. It's part of the ASCII character set which goes back to Teletype days. Generally, it's only used in the context of computer code (programming, scripting, command line, etc.). Same goes for asciitilde.</p>
  - id: 223844
    user: 1551
    date: 2007-08-31T14:29:00
    date_raw: 31 August 2007 - 2:29pm
    votes: 0
    html: "<p>On my American keyboard, it's the shifted 6, and I believe is used among other things to indicate exponents: x^2 means x squared. The keyboard was done by mathematicians, not typographers, which is bad because writing prose is the main use of the keyboards, not doing math or code. Eg. the cent sign disappeared from the standard basic keyboard, which could have also a true multiplication sign, the degree sign, etc.</p>"
