    html: <p> Steve, it's great that you've developed a "taste" for type! The thing is -and I'm no technophile- what's with letterpress? I'm sure some people will say that you can't understand type until you understand metal, but who can understand anything completely anyway? It's really a matter of priorities. With the limited time us humans have to get into something, I think metal is simply too marginal now to warrant extensive study by somebody in your situation. I'd worry more about proper spacing/kerning for example (something largely unworkable in letterpress, btw). <br> <br>Letterpress has its uses, even today, but I don't like seeing typography limited by *any* technology, past or present. In its "pure" form, it's all conceptual, and the physical world can be just as limiting as it is real. <br> <br>hhp </p>
