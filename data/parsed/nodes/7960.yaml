    html: "<p> Nothing is redundant. But some things are more useful than others. Letterpress *was* \"what type <br>is really about\". But today it's largely the *opposite* of what type is really about now: dynamic, context-sensitive forms with complex spacing systems. <br> <br>The biggest influence of letterpress (one could say of any technology) was in the *limitations* it imposed. The best thing one can learn from studying letterpress is to more accurately second-guess what the talented designers of yesteryear (like Dwiggins) *could* have done with better technology. <br> <br>For example, the reason many metal fonts have a deficient lc \"f\" (a very important letter in readability) isn't because the designer was stupid, it's because it was too expensive to do it right in metal. If you look at Octavian, you'll see the improvements Carter and Kindersely made to the \"f\" once the design was freed from behind its metal prison. (Granted, many designs that worked well in metal got trashed when converted to photo/digital, but that was due to idiocy and cost-cutting, not the fault of the newer technologies.) <br> <br>The way to get ahead of your peers is by walking forward. <br> <br>hhp </p>"
