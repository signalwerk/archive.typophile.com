    html: <p> Hrant, I think you just try to deliberately distort anything you read to your own agenda, positively or negatively. <br> <br>What I wrote was that getting your head around typographic measurement systems will put this student ahead of his peers. He doesn't appear to be at the stage where he neds to start considering "advanced" typography, he's at the stage where he needs to get his head around the basics. <br> <br>As the basis of type, even today (and tomorrow), is pts and EM squres it is *very* useful to get the concepts behind those units right before you move on. From what Steve has already written it seems clear that its a good grounding that he's lacking. <br> <br>So, I write again, "Letterpress is really useful in one respect... the origin of typographic measurement systems". <br> <br>I think your problem is that you want to run before you can crawl. </p>
