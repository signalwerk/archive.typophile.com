  html: <p> As a graphic design student, I have rather belatedly just realised the importance of good typography in design. Silly me for thinking my tutors might have warned me, but it seems I have been mistaken. Now, with six months left until I graduate, all I seem to be doing nowadays is find out new typo-facts that I probably should have learnt ages ago. My only hope is that I can learn enough to get by before I get my first job.  <br>Can anyone tell me whether I need to go and try my hand at some letterpress, as my college doesn't have one. There are plenty of books about, but I don't know if I am missing out on anything? </p>
