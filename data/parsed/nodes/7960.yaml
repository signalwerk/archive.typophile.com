    html: <p> Um, just for the sake of disagreeing. <br> <br>Letterpress is really useful in one respect, and it'll give you an understanding of what type really is about. Metal/moveable type is the origin of typographic measurement systems, pts and EMs and ENs, it's also the origin of terms like "leading" and "body". <br> <br>Get your head around those things and you'll already be a few steps ahead of your peers - and that knowledge is not redundant, or ever likely to be. </p>
