    html: <p> Yes! Type has the capacity for expression in  <br>the same ways we use color and photography  <br>and space. (But I'm preaching to the  <br>converted.) <br> <br>If you have the chance to use a letterpress, by  <br>all means go out of your way to do so. There's  <br>an aesthetic quality about letterpress that  <br>cannot be had by today's presses or screens. <br> <br>But, I'd agree with Hrant that it's not a  <br>requirement for honing typographic skills.  <br>Typographic skill comes from using and  <br>working with type. I think that's seperate from   <br>an appreciation for type that can come from <br>studying the subject.  <br> <br>So, if using a letterpress forces you to pay  <br>attention to those details, then by all means... <br> <br> <br>//joe </p>
