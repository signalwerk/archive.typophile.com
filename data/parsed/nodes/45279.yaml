    <p><a href="http://ilovetypography.com/crossword-1/#respond" title="http://ilovetypography.com/crossword-1/#respond">http://ilovetypography.com/crossword-1/#respond</a> </p>
    <p>I recently submitted my answers, but I had a few blanks and was wondering if anyone could help me figure them out.</p>
    <p>7 Down: <em>upright Italian</em> (5) <strong>- - - - -</strong> ~Dave Williams answer below<br>
    9 Down: <em>idiot sayings</em> (10) <strong>- - - - - - - T - -</strong> ~I answer below.<br>
    10 Across: <em>early type class</em> (8) <strong>- - - - - - S -</strong> ~Craig Eliason answer below<br>
    16 Across: <em>ducks and type share</em> (4) <strong>- - A -</strong> ~Dave Williams answer below.<br>
    34 Across: <em>when ascenders and descenders meet</em> (10) <strong>- - - L - S - - N -</strong> ~Dave Again!<br>
    40 Across: <em>Unger's bird</em> (5) <strong>S - - - T</strong> ~Dan Reynolds answer below.<br>
    46 Down: <em>dot in other words</em> (6) <strong>- - T - L -</strong> ~Dave Williams answer below.</p>
    <p>Obviously, I have answers for the others if you're stuck. Also, if you want to try and figure out the puzzle yourself and don't want to know any answers then stop reading here and leave this post.</p>
    <p>Thanks</p>
