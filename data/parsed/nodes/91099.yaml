      <p>I'm pretty sure that Joe is correct—unless things are radically different here in the UK, anything you produce as an employee is the property or your employer; that's what they are paying you for.</p>
      <p>I think you are correct in your assumption that any prospective employer would laugh you out of the interview at your suggestion or if they wanted to spare your feelings maybe they might say "Well keep your fonts away from our computers then".</p>
      <p>If you are freelance however things are open to negotiation I guess; I imagine it depends how much they want your work.</p>
