    <p>(I ran a search but didn’t find anything. If it has been covered, apologies in advance, please direct me to the relevant thread and ditch this one.)</p>
    <p>Not sure I sufficiently summed up my question in the subject line...</p>
    <p>I’ve been noodling around with type for a long time. Took a long break. Now I’m getting back into it again.</p>
    <p>I have no interest in selling my type commercially - as if it’s even good enough. I just want to use it in my own work, and hopefully it’s something of a selling point if I look for a job with someone. Unique type that no one else has. I figure it has more worth that way.</p>
    <p>Now if I work at an agency/studio/etc., I don't mind loading them on the computers to use in projects, but when I go, I want to take them off the computers. I thought of a legal document to state that up front. That when I go, my typefaces remain my intellectual property, and you can no longer use them. </p>
    <p>Am I nuts for even thinking this? Would a potential employer laugh at me and tell me to run along? Would a lawyer tell me I have no legal basis? Does such a document exist? Or should I just be  nice guy, leave them on the computer and quite possibly find them being disseminated on bit torrent sites in the future?</p>
