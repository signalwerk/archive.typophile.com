      <p>As Nick said, you could create a license. But I doubt if any agency would agree to such a license, for the reasons that he mentioned.</p>
      <p>Even if you're the only designer assigned to a project, it's still the agency's client and the agency's project, and they will want to have access to the assets used in case work needs to be done in your absence. For example, suppose a year after you leave the client asks them to update the job?</p>
      <p>Probably best just to use those fonts on your freelance projects.</p>
