      <p>You could create a license which allowed your employer to use your fonts for their client work, but not for projects where you weren’t the designer. Is it realistic to expect that you are the only designer to work on a given client? What if you are sick or on vacation, or have moved on?</p>
      <p>But you might have difficulties if you created an identity or campaign, and your employer’s client needed to do some work using it, in house, and would be unable to licence the fonts commercially to do that.</p>
