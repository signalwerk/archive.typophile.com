      <p>If your fonts aren't good enough to sell commercially, as you say, then you shouldn't be using them for professional work. If they are, and you created them on your own time, then your employer should license them on the same terms that anyone else would.</p>
      <p>If licensing fonts is your call as a designer, they don't even have to know the foundry is you. But if they don't have a budget for licensing fonts, then you should take to heart the reality that your job is not meant to entail a level of design that transcends choosing from the available system/bundled fonts. Your decision of whether to give your work away to impress people should probably start with the assumption that you can't take it back later.</p>
