      <p>If you're paranoid about people misappropriating your work, don’t even <em><strong>consider</strong></em> a career—fill- or part-time—in type design. If your work’s any good, people will steal it if they can; even if your work’s mediocre, people will steal it if they can. Unless you wish to produce your work as real-live foundry type—i.e., a real, physical product cast in metal, which cannot be emailed or downloaded—people will steal it if they can.</p>
      <p>That's the curse—and the blessing—of digital existence.</p>
