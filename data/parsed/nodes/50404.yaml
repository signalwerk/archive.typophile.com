  html: |-
    <p>Is it possible to use python or Robofab to replicate Fontlabs ’copy to composites’ command ?</p>
    <p>I know I could use something like this to update sidebearings of glyphs.</p>
    <p><code><br>
    from robofab.world import CurrentFont<br>
    f = CurrentFont()<br>
    #<br>
    E = ['Emacron','Ebreve','Edotaccent','Eogonek','Ecaron','Egrave','Eacute','Ecircumflex','Edieresis']<br>
    #<br>
    for glyphName in E:<br>
            f[glyphName].leftMargin = f['E'].leftMargin<br>
    	f[glyphName].rightMargin = f['E'].rightMargin<br>
    #<br>
    f.update()<br>
    #<br>
    print "E composites updated"<br>
    </code></p>
    <p>This works fine until I get to the situation where the accents of glyphs over hang the sidebearing of the base glyph, this is where I would use the ’copy to composites’ command or the measurement line.</p>
    <p></p><div class="imageWrap"><img src="/files/Picture-1_3563.jpg"></div><p></p>
    <p>Using ’copy to composites’ is fine if not time consuming, but I have decomposed the composites in the process of generating the intermediate weight from a MM font. If I could write one macro that ensured all glyphs had the correct sidebearing it would save me loads of time.</p>
    <p>Rr</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/50417" class="topic-next" title="Go to next forum topic">Will hinting die before it kills me? ›</a></div>
