    html: <p>IIRC, Century Gothic is Monotype's <a href="http://www.myfonts.com/fonts/agfa/twentieth-century-mt/">Twentieth Century</a> [itself a knockoff (or close-to-knockoff) of Futura] redrawn to match the metrics of <a href="http://www.myfonts.com/fonts/linotype/itc-avant-garde-gothic/">ITC Avant Garde Gothic</a>.</p>
