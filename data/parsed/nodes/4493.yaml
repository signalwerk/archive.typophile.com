    html: <p>I thought I’d include pictures from the ﬁrst movie here since we’re discussing type in Kill Bill. I would have liked to have included them in the last thread on the titles but that thread is already archived. (Yves, please move this somewhere else if it’s inappropriate here). I hope they will help visualize the type for those who have not seen the movie or do not plan to. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"><br><br>These opening credits switched from on typeface to another and back again.  <br><br><img src="http://www.typophile.com/forums/messages/83/34505.jpg" alt=""><br><br>Shaw Brother’s Logo. Lifted directly from these old ﬁlms. Probably custom. <br><br><img src="http://www.typophile.com/forums/messages/83/34506.jpg" alt=""><br><br>To me that looks like Century Gothic <br><br><img src="http://www.typophile.com/forums/messages/83/34507.jpg" alt=""><br><br>Busorama <br><br><img src="http://www.typophile.com/forums/messages/83/34508.jpg" alt=""><br><br>Fritz Quadrata Bold&nbsp;? <br><br><img src="http://www.typophile.com/forums/messages/83/34509.jpg" alt=""><br><br>No Idea <br><br><img src="http://www.typophile.com/forums/messages/83/34510.jpg" alt=""><br><br>Palatino <br><br><img src="http://www.typophile.com/forums/messages/83/34511.jpg" alt=""><br><br>Century Gothic Bold (?) <br><br><img src="http://www.typophile.com/forums/messages/83/34512.jpg" alt=""><br><br>Can’t make it out. Maybe Palatino&nbsp;Bold </p>
