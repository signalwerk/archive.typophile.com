    html: <p>I guessed Avant Garde, too, in that original post last month. But I think James is right with Century Gothic. The closed 'R' and the circular dot on the 'i' give it away. From what I recall, Monotype made Century Gothic to match the look and metrics of Avant Garde, much as they did with Arial to match Helvetica.</p>
