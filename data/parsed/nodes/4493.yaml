    html: <p>I have to say, though I liked both volumes of Kill Bill, I thought the typography was a disaster. I understand he's trying to evoke the flavor of various film influences, as he does in making the movies themselves. But to the filmmaking end, with the exception of one segment, he uses the influence and makes a better scene than what inspired him. <br> <br>Not so the type. Rather than create a pastiche of typefaces inspired by his source material -- and subtly improve on the originals -- he's created a mishmash. I cringed every time type showed up. The end credits at least had something of a classic look, but he didn't even do those well (hello, megadots!), and it was right on the heels of another credit sequence that used a completely different typeface. <br> <br>I don't know how he managed to use a typeface we couldn't identify, though. Maybe it's a Corel font.</p>
    html_clean: <p>I have to say, though I liked both volumes of Kill Bill, I thought the typography was a disaster. I understand he's trying to evoke the flavor of various film influences, as he does in making the movies themselves. But to the filmmaking end, with the exception of one segment, he uses the influence and makes a better scene than what inspired him. <br> <br>Not so the type. Rather than create a pastiche of typefaces inspired by his source material -- and subtly improve on the originals -- he's created a mishmash. I cringed every time type showed up. The end credits at least had something of a classic look, but he didn't even do those well (hello, megadots!), and it was right on the heels of another credit sequence that used a completely different typeface. <br> <br>I don't know how he managed to use a typeface we couldn't identify, though. Maybe it's a Corel font.</p>
