  html: <p>I saw Kill Bill 2 tonight and noticed during the ﬁlm, a font on a set of outdoor chairs which said “<span class="caps">SOL</span>”. <br><br>The font in particular was a beautiful circus/western blend — I undertand this would have been hand rendered, and I am unable to ﬁnd an example. <br><br>If anybody does have any shots from this ﬁlm, of this type — could you please respond.  <br><br>I would like to use the same style for a logo I am working on. Once I saw it, I knew it would be perfect. <br><br>While on the subject of fonts used for circus’s. Does anybody know the historical information behind the use of fonts used for circus’s? <br><br>mwah</p>
