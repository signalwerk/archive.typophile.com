    html: <p>Yes indeed, the font (written as SOL) features in the scene when Uma visits the brothel in Mexico. The chairs are scattered around the place, all with the same word "SOL" written on them.  <br> <br>So if you have a digital camera and go see it. If you take a shot of this font and post it, I will be ever so happy. <br> <br>I think that maybe the font choices Tarintino made throughout KILL BILL were meant to be schitzophrenic and badly done. And were not meant to distract from the cinematography - the same way type used to be treated in film - badly. <br> <br>mwah</p>
