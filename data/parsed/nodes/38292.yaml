      <p>Your friend is "convinced" but you give no evidence of what convinced him/her. I know a bunch of type designers. Some use Mac, some use PC, some use both at least for testing. Some like the Macs with intel chips because they can do both on the same machine. The antialiasing thing makes no sense. There are plenty of folks who prefer the Mac way of displaying over PC. The only issue may be screen use only fonts for web where the user-base of web pages is 90% PC so designers of screen media look to match the majority's expectations. Most font sales are for print media users who are mostly Mac using graphic designers. I don't have numbers from a real study but I have enough anecdotal experience to know that your friends assertion that "No Type designers use OSX" is just plain ridiculous and false. I would guess that the majority of type designers use Macs to design type but a greater number of computer geeks who do post-design production, tweaking, verification, and TrueType hinting, use PCs.</p>
      <p>ChrisL</p>
