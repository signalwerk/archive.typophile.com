      <p>Speaking as part of the Windows-using minority, I'm clear that the majority of professional type design today is done on Mac OS. There is a substantial minority on Windows, though. I can't say whether the Mac percentage is 60 or 75, but I'd say it's somewhere in that range.</p>
      <p>The reasons I'm on Windows are mostly, but not entirely, unrelated to type design:</p>
      <p>- new beta versions of FontLab come out on Windows a long time before the equivalent Mac version. (The time gap is a lot smaller if you're waiting for the official release, though.)</p>
      <p>- Adobe has a bunch of internal business processes that are Windows-centric</p>
      <p>- Outlook sucks less than Entourage.</p>
      <p>- when I switched from mac to Windows for my main machine, OS X had just come out and was not really ready for prime time, plus you couldn't get a Mac laptop with 1200 pixels of vertical resolution on its LCD screen. Both of these factors are no longer true, however.</p>
      <p>Note that you won't see rasterization differences on my list of why I'm on Windows! Yes, I liked Microsoft's rendering better than Apple's the last time I did a head-to-head comparison (which was not recent). But most of my testing and work is in Adobe applications, which use Adobe's rendering, regardless of platform. So it's not a big issue.</p>
      <p>Cheers,</p>
      <p>T</p>
