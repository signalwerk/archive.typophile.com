    <p>I just had a fascinating discussion with someone who claimed no type designers use OS X (for a variety of technical reasons), which absolutely blew my mind. I know for a fact Ed Benguiat uses a Mac since I studied under him at SVA, and I'm (perhaps erroneously) assuming that most Mac users are currently using FontLab Studio under OS X.</p>
    <p>Can anyone with first-hand knowledge talk about what systems are used by the folks at Adobe, Linotype, ITC, etc?</p>
    <p>I'm not looking to start a platform war/discussion, it just amazed me that anyone thought it would make much difference which system type was digitized on, since most designers I know of work on paper first and then use Fontlab software (whether FontLab Studio or Fontographer) that is cross-platform. But it did get me curious if there was some sort of massive systems change that took place since I left NYC and stopped doing things with the Type Director's Club.</p>
    <p>I know occasionally we have discussion on the more technical nature of digital type here, but most type designers I've known haven't spent much time worrying about the algorithms or technology behind any particular system, so long as they got good results out of it when the file was sent to the imagesetter.</p>
