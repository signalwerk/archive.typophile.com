  html: |-
    <p>Cheers,<br>
    I'm currently working on my first font family, using FontLab 5. Now I've got three weights so far (regular, italic, bold). However there is something that concerns me: I'm using MainType 2.1 for Windows for font management, and in the preview my Italic is shown at a much smaller font size than my other weights (about 1/3 to 1/4). It behaves normally in InDesign though. When I check other font families they are previewed more uniformly.</p>
    <p>I checked the key measurements but they are all the same. Is it probably connected with the Font BBox as these values are different? But I don't know how to change that. Or some rulers that are above the en square? Does anyone faced a similar problem before?</p>
