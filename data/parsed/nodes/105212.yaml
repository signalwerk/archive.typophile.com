    <p>Type light (freeware font editor) now has capability to create and edit colour fonts in the new format that is being introduced with Windows 8.1 (Windows version of Type light only).</p>
    <p>Demo video on youtube: <a class="freelinking external" href="http://www.youtube.com/watch?v=Z4S74alCxC4" rel="nofollow">http://www.youtube.com/watch?v=Z4S74alCxC4</a></p>
    <p>Allan Murray</p>
