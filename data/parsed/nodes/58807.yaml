    <p>I´m looking for sugestions for this monogram i´m designing. It´s function is to work as personal logo. The initials are R &amp; C (Ricardo Calabaça). After trying with a few concepts, I came up with this version, which is the one I fell more comfortable with. The typeface is Esta Display, designed by Dino dos Santos (DSType).</p>
    <p>Commnents anyone? </p>
    <p>Kind regards</p>
