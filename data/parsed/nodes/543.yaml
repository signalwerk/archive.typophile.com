  - id: 4011
    user: 1551
    date: 2003-07-13T12:56:00
    date_raw: 13 Jul 2003 — 12:56pm
    votes: null
    html: "<p>Hrant, I asked about the different weights of Minion on this thread:  <br> <br><a href=\"http://www.typophile.com/forums/messages/4100/7027.html?1056591110\" target=\"_blank\">http://www.typophile.com/forums/messages/4100/7027.html?1056591110</a> <br> <br>I learned from Kent Lew there that Slimbach had made changes from the regular to the MM version (no longer sold), and then again to the Open Type version. And John Nolan said he thought the Open Type version was best, even though in general he liked the MM technology.  <br> <br>This led me to get the Open Type version, and also (with your encouragement) to upgrade from PageMaker to InDesign - which is wonderful.  <br> <br>Now, checking the new version with my own eyes, and setting my book in progress in the OT Minion, I find that the regular weight has gone on a diet, and is now slimmer and prettier. It is between the old regular and display weights. I also sets at nearly the same width as the old display weight - perhaps 5% more narrow than the old regular (I haven't measured it).  <br> <br>What led me to my first post here at typofile was the feeling that something was wrong with the regular Minion. It looked too clotted to me at 11 points (though not at 10 points); too closely spaced or something I couldn't exactly put my finger on.  <br> <br>I am still not sure what all went into the changes Slimbach made, but I sure think they are an improvement. My former feelings that something was wrong have now vanished, and I think it is a real solid workhorse for text, with some elegance.   </p>"
    html_clean: "<p>Hrant, I asked about the different weights of Minion on this thread:  <br> <br><a href=\"http://www.typophile.com/forums/messages/4100/7027.html?1056591110\" target=\"_blank\" class=\"link-lost\">http://www.typophile.com/forums/messages/4100/7027.html?1056591110</a> <br> <br>I learned from Kent Lew there that Slimbach had made changes from the regular to the MM version (no longer sold), and then again to the Open Type version. And John Nolan said he thought the Open Type version was best, even though in general he liked the MM technology.  <br> <br>This led me to get the Open Type version, and also (with your encouragement) to upgrade from PageMaker to InDesign - which is wonderful.  <br> <br>Now, checking the new version with my own eyes, and setting my book in progress in the OT Minion, I find that the regular weight has gone on a diet, and is now slimmer and prettier. It is between the old regular and display weights. I also sets at nearly the same width as the old display weight - perhaps 5% more narrow than the old regular (I haven't measured it).  <br> <br>What led me to my first post here at typofile was the feeling that something was wrong with the regular Minion. It looked too clotted to me at 11 points (though not at 10 points); too closely spaced or something I couldn't exactly put my finger on.  <br> <br>I am still not sure what all went into the changes Slimbach made, but I sure think they are an improvement. My former feelings that something was wrong have now vanished, and I think it is a real solid workhorse for text, with some elegance.   </p>"
