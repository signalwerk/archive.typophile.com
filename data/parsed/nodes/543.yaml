    html: <p>1. I don't think that Minion will go with a modern serif = vertical stress typeface.  <br> <br>2. This is not what you asked, but Minion is a match to Slimbach's Poetica (as Bringhurst notes). The italic of Minion, which I think is very good, harmonizes with Poetica, whereas the italics of other typefaces I tried really clashed.  <br> <br>3. I found, as I noted elsewhere, that Open Type version of Minion is a distinct improvement on the original. </p>
