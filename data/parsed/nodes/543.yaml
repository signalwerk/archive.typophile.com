  - id: 4008
    user: 1250
    date: 2003-07-13T10:23:00
    date_raw: 13 Jul 2003 — 10:23am
    votes: null
    html: "<p>Karen, Slimbach rarely says anything in public, and in my 5+ years on discussion groups I haven't seen a single piece of participation from him. So any \"documentation\" about this is going to be second-hand, but also through observation. If I'm not mistaken David Lemon (on maybe it was JFP) has pointed out that Slimbach doesn't use trapping, but if you just look at his work, it's obvious anyway. <br> <br>His reasons are probably the same as for any accomplished type designer who doesn't put trapping: <br>1) Even if he thinks it helps a little bit, it's not cost-effective: the gain is too small compared to the effort. <br>2) In large sizes trapping (generally) looks ugly. <br>3) There's no methodical way of putting in traps, and that's a Modernist/Western turn-off. <br> <br>I can't argue with #1 too much - it's a personal balance of craftsmanship versus delivery of goods.  On the other hand, pretty soon this reason will disappear... As for #2, I would counter that the people who notice traps at larger sizes are the same people who know they should be using the display cut of the font instead anyway! And when it comes to #3, I'd say it's all in your head. A desire for absolute consistency shouldn't trump real-world quality. <br> <br>hhp <br></p>"
    html_clean: "<p>Karen, Slimbach rarely says anything in public, and in my 5+ years on discussion groups I haven't seen a single piece of participation from him. So any \"documentation\" about this is going to be second-hand, but also through observation. If I'm not mistaken David Lemon (on maybe it was JFP) has pointed out that Slimbach doesn't use trapping, but if you just look at his work, it's obvious anyway. <br> <br>His reasons are probably the same as for any accomplished type designer who doesn't put trapping: <br>1) Even if he thinks it helps a little bit, it's not cost-effective: the gain is too small compared to the effort. <br>2) In large sizes trapping (generally) looks ugly. <br>3) There's no methodical way of putting in traps, and that's a Modernist/Western turn-off. <br> <br>I can't argue with #1 too much - it's a personal balance of craftsmanship versus delivery of goods.  On the other hand, pretty soon this reason will disappear... As for #2, I would counter that the people who notice traps at larger sizes are the same people who know they should be using the display cut of the font instead anyway! And when it comes to #3, I'd say it's all in your head. A desire for absolute consistency shouldn't trump real-world quality. <br> <br>hhp <br></p>"
