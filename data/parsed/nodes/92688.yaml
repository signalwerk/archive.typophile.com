  html: |-
    <p>Trying to identify both fonts used in the attached menu from River Road Coffehouse.</p>
    <p>The first font is the header (espresso bar) and the second is everything else in the body of the menu.</p>
    <p>More pages of the menu can be seen here <a class="freelinking external" href="http://www.riverroadcoffeehouse.com/coffee/coffee-menu " rel="nofollow">http://www.riverroadcoffeehouse.com/coffee/coffee-menu </a></p>
