  html: |-
    <p>I work for a company called Uppercase Living, and we would like to find some type designers that would design fonts specifically for us.  We would buy them outright, and use them to design our products with.   We have already done two custom fonts, but would like to do more. If you are interested email me at <a href="mailto:daveu@uppercaseliving.com">daveu@uppercaseliving.com</a>.  Also check out our website at <a href="http://www.uppercaseliving.com" title="www.uppercaseliving.com">www.uppercaseliving.com</a>. Lets see if your font can outsell some of our customer favorites!</p>
    <p>Dave</p>
