    html: |-
      <p>I've never used OTEdit before because this app doesn't seem to be enough for making Latin fonts. It's reasonable to buy it, but it seems that OTEdit can't handle kerning data and OpenType feature. I've checked the manual of it, but the manual doesn't mention kerning pair and OpenType features at all.<br>
      I think this app seem to be for making Japanese font, not for making Latin font. If your fonts don't need to have kerning pair and OpenType features, this app might be good for you, but if you want to make integrated fonts in future, I don't recommend you use it.<br>
      Of course, you'll be able to add feature and kerning data to your font using AFDKO after generating font from OTEdit, but I don't know whether OTEdit can generate proper OpenType font for Latin fonts.</p>
      <p>It's a pity that Musashi systems doesn't have English language site and English ver. applications.</p>
      <p>So far, this is the only type design tool to make Japanese font in Japanese language interface, so I've heard that some of Japanese design school use this app. for learning type design.</p>
