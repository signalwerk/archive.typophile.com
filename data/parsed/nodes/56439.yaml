  html: <p>I followed a post on Fontfeed to this <a class="freelinking external" href="http://vimeo.com/3830490" rel="nofollow">video</a> of a guy in Japan doing what you might call a psychogeographical font, and noticed he was using some tool I'd never encountered before...<a class="freelinking external" href="http://musashi.or.tv/oteditmac.htm" rel="nofollow">OTEdit</a>. The site, and most of the interface in the app itself is all in Japanese, but I was able to start a font and draw a glyph. It seems like a good, simple tool for somebody just starting out in type design. Does anyone know much about this app or its developer/s? An English localization would be nice.</p>
  html_clean: <p>I followed a post on Fontfeed to this <a class="freelinking external link-external" href="http://vimeo.com/3830490" rel="nofollow">video</a> of a guy in Japan doing what you might call a psychogeographical font, and noticed he was using some tool I'd never encountered before...<a class="freelinking external link-external" href="http://musashi.or.tv/oteditmac.htm" rel="nofollow">OTEdit</a>. The site, and most of the interface in the app itself is all in Japanese, but I was able to start a font and draw a glyph. It seems like a good, simple tool for somebody just starting out in type design. Does anyone know much about this app or its developer/s? An English localization would be nice.</p>
