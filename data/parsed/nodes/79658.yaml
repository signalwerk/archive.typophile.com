    <p>But has anyone put together, or even started to put together, something better and more comprehensive, in terms of a database, or query decision-maker (like identifont.com), or the millions of brilliant typographers and graphic artists on this forum?</p>
    <p>This sounds like an area that getting together a bunch of folks like you and me, collaborating online, might be able to put together something that would help us distinguish between the Helveticas and the Arials, between the Times and Garamonds and Palatinos, etc.</p>
    <p>Frankly, we need more classifications of font, and font features, besides some image identification software that could really help.</p>
