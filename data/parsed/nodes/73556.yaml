  html: |-
    <p>I've got a non-profit with a limited budget.  I love Archer for their brand serif, they love Archer for their brand serif, but Archer is not an inexpensive font to license. Hoefler actually does offer non-profit discounts, but only for 50+ licensees— they're smaller than that.</p>
    <p>Has anyone come across any similar slab serif with a similar look and feel (and a full set of characters, and good kerning pairs) offered by a less expensive foundry?</p>
    <p>(Also interested in finding something almost as good as Sentinel if it's out there…)</p>
