    html: <p>Ooh, I wasn't aware of Oxtail.  That's a great find, thanks! For this use, both Museo and Oxtail are just a little too "playful" for what I need though.  Gosh, Archer has this amazing balance between personality and formality that I really haven't been able to find anywhere else.</p>
