      <p>Ah, a topic dear to my heart.</p>
      <p>"Merged fonts" or "harmonized fonts" are possible with Type 1 or TrueType.</p>
      <p>On Windows, in normal Windows applications, only the base font of a style linked set ever shows up in the menus, and other fonts must be accessed through the style links. This is true regardless of font format. One can make the fonts not style linked at all, but this will be mildly surprising for Mac users and quite confusing to Windows users.</p>
      <p>Regards,</p>
      <p>T</p>
