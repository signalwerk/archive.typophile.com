    date_raw: 9 Feb 2006 — 2:05pm
    votes: null
    html: <p>Incidentally, the interesting thing about InDesign is that it's actually choosing the font via its font menu, not "applying" a style to a font. If you check the font menu, you can see for yourself that is has changed fonts. It has no generic "style" buttons or "style" menu choices. So the key commands are simply short cuts for selecting fonts. InDesign apparently looks at the style linkings built into the fonts to choose the appropriate family member. If there is no italic, command-I has no effect. If you choose an italic font from the font menu and do command-I you get the roman.</p>
