    html: |-
      <p>In Quark or Word, if Type 1 font is linked, then you can use the keyboard shortcuts, but you only see one menu item, which at this point in history can be confusing to some users. If your font is separated so that there is one face per font suitcase, then the user will see separate menu items not not be able to use keyboard shortcuts. InDesign is smart enough to apply the italic even if the suitcase is separated, but the bold doesn't seem to work reliably. </p>
      <p>I think one of the intended uses of the font smasher is to take apart "frankenfonts". That is, font suitcases that people have modified (usually in the past) under OS 9. As a lowly prepress person, I used to get fonts with names like "Sans Serif", which would be a Mac font suitcase containing Helvetica, Futura, GillSans, etc...</p>
    html_clean: |-
