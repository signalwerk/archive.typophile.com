    html: |-
      <p>Cocoa apps (TextEdit, Pages, etc.) on OS X are less smart about style linking. They do something similar to what InDesign does, choosing fonts rather than applying styles, but seem to ignore the weight part of the style linking information. </p>
      <p>Command-I toggles between roman and italic, but command-b has less desirable results. If there are only two weights, it will toggle between them, which is fine. In larger families, it seems to decide for itself which weight is "regular" and which weight is "bold", ignoring the intentions of the font designer. "Regular is usually the "regular" or plain weight, while "bold" is whichever weight is next in weight after regular, regardless of the style linking. </p>
      <p>If you repeatedly toggle command-b, you will soon be switching between these two fonts, regardless of which weight you started with. In the following examples, command-B should go between Regular and Bold, Light and Semibold, and Thin and Extrabold:</p>
      <p>&nbsp;&nbsp;&nbsp;Regular (command-B) --&gt; Semibold (command-B) --&gt; Regular<br>
      &nbsp;&nbsp;&nbsp;Light (command-B) --&gt; Semibold (command-B) --&gt; Regular<br>
      &nbsp;&nbsp;&nbsp;Thin (command-B) --&gt; Semibold (command-B) --&gt; Regular<br>
      &nbsp;&nbsp;&nbsp;Semibold (command-B) --&gt; Regular (command-B) --&gt; Semibold<br>
      &nbsp;&nbsp;&nbsp;Bold (command-B) --&gt; Regular (command-B) --&gt; Semibold<br>
      &nbsp;&nbsp;&nbsp;Extrabold (command-B) --&gt; Regular (command-B) --&gt; Semibold</p>
      <p>All this makes command-B rather useless with large families.</p>
    html_clean: |-
