    html: <p>I'm not sure how you would do it with OS X and I don't think it's possible on Windows. With OS 9 and earlier, you could just open the font suitcase in the Finder and move bitmap or TT fonts in and out. With linked families, the FOND resource, which has all the link info, would follow the individual fonts around. If you spit up a family into separate suitcases, they would still find each other when they were active.</p>
