    html: <p>Style linking does not mean that the italic/bold/bolditalic styles will disappear from font menus. It is possible to modify FOND resources so that this also happens, but it's an optional step and not necessarily a good idea for the reasons you mention. It was a popular trick for a while around 1990, the idea being that you could clean up your font menus, but I don't think fonts are normally shipped this way.</p>
