    <p>heylo there, i am off to amsterdam next week, and im trying to do my research so as not to miss out on anything - so would be greatful if anyone knew of any exhibitions, galleries, places of interest, really anything to do with graphic design and typography (and anything connected to female typographers) anything a bit more off the beaten track of a travel guide.</p>
    <p>REALLY appreciate the guidance. searching the internet runs me in cirlces</p>
    <p>Lindsayy</p>
