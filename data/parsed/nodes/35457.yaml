      <p>Not typeconnected, but don’t miss the GREAT Max Beckmann exhibition at the Van Gogh Museum. It is a must see. Closes on Aug 17.<br>
      Typeconnected: visit the Nijhof and Lee bookstore for an extensive collection of books and magazines (old and new). They are located at the Staalstraat. Googlemap here:<br>
      <a href="http://www.nijhoflee.nl/bookstore/" title="http://www.nijhoflee.nl/bookstore/">http://www.nijhoflee.nl/bookstore/</a><br>
      Enjoy your stay and try to avoid those nasty paddo’s.</p>
      <p>___<br>
      Bert Vanderveen BNO</p>
