      <p>Make a trip to Leiden if you have time. A university town, but much more beautiful than Amsterdam, and of course with photogenic streetsigns. Some of the university buildings have poetry and literary passages in various languages written on them in big letters. </p>
      <p>In Amsterdam a canal boat tour will give you a basic intro to some architectural and city history.</p>
