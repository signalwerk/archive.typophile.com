    date_raw: 28 Aug 2003 — 3:51pm
    votes: null
    html: <p><i>If the dots made it any easier to read, wouldn't they have been kept?</i> <br> <br>In a perfect world, maybe, but when it's a group of non-specialists (who have a million other things to worry about in any case) making the decision, the principle criterion is going to be saving money. <br> <br>When the government did away with the dots and the bizarre, backward characters that were upsetting Ireland's printers, there were no national Gaelic language newspapers. Now there are two and one of them's just gone daily. Modern Irish Gaelic is notoriously difficult to set in justified columns because of its relatively very long words. Very often, you end up with two words per line with an enormous, eye-catching space in between. With up to 5 h-es in some common words, dots are extremely useful for this sort of work. <br> <br>All the same, because of the high 'h' content, this particular letter does play a big part in  Gaelic's visual personality.  <br> <br>Matha <br> <br></p>
    html_clean: <p><i>If the dots made it any easier to read, wouldn't they have been kept?</i> <br> <br>In a perfect world, maybe, but when it's a group of non-specialists (who have a million other things to worry about in any case) making the decision, the principle criterion is going to be saving money. <br> <br>When the government did away with the dots and the bizarre, backward characters that were upsetting Ireland's printers, there were no national Gaelic language newspapers. Now there are two and one of them's just gone daily. Modern Irish Gaelic is notoriously difficult to set in justified columns because of its relatively very long words. Very often, you end up with two words per line with an enormous, eye-catching space in between. With up to 5 h-es in some common words, dots are extremely useful for this sort of work. <br> <br>All the same, because of the high 'h' content, this particular letter does play a big part in  Gaelic's visual personality.  <br> <br>Matha <br> <br></p>
