  - id: 6811
    user: 1352
    date: 2003-08-21T14:23:00
    date_raw: 21 Aug 2003 — 2:23pm
    votes: null
    html: "<p>&gt;it looks like he got himself a life. ;-) <br> <br>Not so much getting a life as figting for the last 6 months to hang on to the one I've already got. Office poltics almost got the better of me. But don't worry, I've still got a job and an appartment but it was a hard struggle. <br> <br>Now this is an interesting thread <br> <br>Officially (in other words, according to our beloved government) dots and dodgy characters have been considered backwards since the 1960s and Roman <b>must</b> be used in all cases (unless of course you're trying to sell something to tourists).  <br> <br>For me (but I'm not the only one), there are a few problems with this. <br> <br>1. Does the government actually know what it's talking about ? Or did it just go along with the cheapy printers who wanted to eliminate the cost of maintaining two alphabets? And as the present government is allowing/ helping the Irish language to disappear, why should anyone listen to anything they say about typography?  <br> <br>2. Nobody has designed (or even customised) a Roman font with the letter frequency and general uniqueness of the Irish language in mind. It's all very well to say that Roman works but, to be honest, setting GAelic text with it can be a bloody nightmare. The very poor quality of modern gaelic typography is shameful.  <br> <br>Chris, h-es are just grand but you wouldn't believe how practical dots are. <br> <br>Check out what Vincent Morely is doing here: <br> <br><a href=\"http://www.fainne.org/gaelchlo/\" target=\"_blank\">http://www.fainne.org/gaelchlo/</a> <br> <br>It's all in Irish but just click on everything in the first section and see what you think.  <br> <br>Matha <br></p>"
