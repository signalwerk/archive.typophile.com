    html: <p>Being over 50, I find both the types mentioned, with their strong colour, easy to read. In that sense, they both remind me of Janson. <br> <br>On inspection, yes, that w is a bit wide. <br> <br>But to tell the truth, these are plain typefaces that I didn't really notice as I was reading -- they did their job, and I didn't derive any extra pleasure from them.  <br> <br>Quadraat, however, is a Smeijers typeface that I sometimes find myself savouring, rereading a line of text. Its forms have an organic coherence and an evenly distributed personality.</p>
