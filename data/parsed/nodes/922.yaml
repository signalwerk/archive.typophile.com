  html: <p>I just recieved a copy of Counter Punch by Fred Smeijers. I am very excited about this book and have been ejoying reading it. <br> <br>I have found his type - Renard - difficult to read and was wondering if I am alone. I keep finding myself looking at the lower case 'w' and hanging on it as it appears in the text. Also, the black color of the text is distracting for some reason. The overall feel I have is that the reading is choppy. <br> <br>I am no type expert and am not discounting Mr. Smeijers' work. I am just wondering if others have some experience with Renard and some input. <br> <br>Thanks.</p>
  html_clean: <p>I just recieved a copy of Counter Punch by Fred Smeijers. I am very excited about this book and have been ejoying reading it. <br> <br>I have found his type - Renard - difficult to read and was wondering if I am alone. I keep finding myself looking at the lower case 'w' and hanging on it as it appears in the text. Also, the black color of the text is distracting for some reason. The overall feel I have is that the reading is choppy. <br> <br>I am no type expert and am not discounting Mr. Smeijers' work. I am just wondering if others have some experience with Renard and some input. <br> <br>Thanks.</p>
