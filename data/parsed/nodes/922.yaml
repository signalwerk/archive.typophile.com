    html: "<p>{Take this with a <i>bag</i> of salt...} <br> <br>From what I know, Gaelic can be written with dots (more authentic) or with \"h\"s to mark where a dot is supposed to be (more technology-friendly). For the latter you can use Chris's nice sample text. But for the former you need a special font. <br> <br>This is \"dotted\" Gaelic in a Times New Roman (inauthentic*) style: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/14354.gif\" alt=\"gaelic_1.gif\"> <br> <br>While this is in the Colm Cille font: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/14355.gif\" alt=\"gaelic_2.gif\"> <br> <br>* Gaelic has such variance that \"authentic\" is actually very hard to qualify. Except it's pretty clear that the conventional Roman model for example isn't. <br> <br>hhp <br></p>"
