    html: "<p>I don't think \"ugly\" is a useful word here, especially when somebody is discussing a culture he has no real nativity in. It might be better to think of it as \"inauthentic\" (which could be ugly to some people, but it really goes beyond aesthetics). Inautheticity does two bad things: it harms a culture, and it reduces functionality. <br> <br>Interestingly, some people think that the Latin alphabet has an element of inauthenticity even for things like English! Zhukov &amp; Sadek's \"Typographia Polyglotta\" contains insights like this. <br> <br>hhp <br></p>"
