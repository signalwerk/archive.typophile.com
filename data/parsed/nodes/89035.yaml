    votes: null
    html: |-
      <p>Ah -- you can use the information from Step 2 to make Step 3 a bit easier :D</p>
      <p>Step 2 will tell you which file(s) InDesign is currently using. So reach into your computer and make these files not-available (move them somewhere else, delete them, I don't know).<br>
      If InDesign still displays your file as if nothing happened, you know for sure it found the very same font set <em>somewhere else</em>.</p>
      <p>Repeat this until ID finally acknowledges it cannot find the font anymore, because possibly you have more than <em>two</em> versions of the font as well! Then choose any of the complete sets you have and install only that one.</p>
