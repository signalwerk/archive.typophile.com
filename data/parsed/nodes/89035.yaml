    <p>I am having some trouble with the font Frutiger in InDesign on my Mac. When I open an InDesign file created on a different computer the the pairing of characters “io” displays as Š (S caron) (see attached). I say display because it is recognised as two characters and I can highlight them individually and copy them out as “io” to other applications. Also, I have just noticed “il” displays as Õ (O tilde)…</p>
    <p>Any ideas what is going wrong?</p>
    <p>I am using Universal Type Client to manage fonts…</p>
    <p>Thanks in advance.</p>
    <p>(Mods, feel free to relocate this post if I have used the wrong forum.)</p>
