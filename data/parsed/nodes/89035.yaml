    html: |-
      <p>(It's funny -- I read this yesterday on my iPad and thought, "what's so special about those characters then?")</p>
      <p>Your problem has been reported a couple of times in the <a href="http://forums.adobe.com/community/indesign" rel="nofollow">Adobe InDesign forums</a> (which, by the way, you'd better avoid for a while as they appear to have some serious server malfunction on this Friday the 13th). Extensive communication only led to the OPs switching off ligatures, because that <em>seemed</em> to be the root cause of the problem.<br>
      I am not convinced about that, though.</p>
      <p><cite>... I am using Universal Type Client to manage fonts ...</cite></p>
      <p>Step 1 is to switch this off and see if the problem persists. Possibly it will, possibly not. Read on for further clarification.</p>
      <p>Step 2 is -- either with or without UTC -- to check in what folder these font files reside; you can use Find Font's "More Info" button for that. Is the location some place you could reasonably expect?</p>
      <p>Step 3, finally, is to scan your entire hard disk for other versions of this same font. You cannot rely on the <em>file name</em> for this; InDesign reaches into the files and uses the actual Font Family Name and Full Name, no matter what the file is actually called.</p>
      <p>My reasoning is that you might have several different versions of the same font set of Frutiger, but with slightly different features. InDesign cannot handle same name/different versions of fonts and is prone to nervous breakdowns if it encounters these, rather than just popping up an alert.</p>
