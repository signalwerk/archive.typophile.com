  html: |-
    <p>I’ve come across an interesting typographical dillema in the face I’m creating - which happens to be a ’pixel-font’.</p>
    <p>The typical thing to do, would be to size the Q and O characters proportionally the same in the grid, simply adding any variation of the cross-bar below to make the Q. The thing that I’m finding, however, is that if I extend the Q character one additional pixel, the cross-bar [at the corner] appears ’aesthetically correct’, even though the two characters are now proportionally distinct.</p>
    <p>I guess then, I’m wondering if anyone can offer their feedback - opinions toward to what extent should we feel it necessary to break certain rules in favor of the aesthetic? Or, would making such changes be a severe no-no in your opinions?</p>
    <p>And - in referencing some typefaces that are centuries old - it appears that a distinct Q was often used that was non-proportional to the O character. Thus, is there really a ’rule’ afterall, if one can reference typography of the past?</p>
    <p>(Perhaps I’m over-thinking this issue?)</p>
