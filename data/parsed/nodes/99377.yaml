      <p>Good to hear, Erum.</p>
      <p>Hrant - You seem to increasingly be trying to dictate the rules of this forum.</p>
      <p>In this case, you just might be missing the very legitimate, "I can't afford it" factor. Erum didn't ask for a freebie ripoff of Genial. He asked for a free <em>alternative</em> (and was, it seems, happy to pay for a cheaper option [than $77 for the whole family] on the original).</p>
      <p>I hate ripoff clones of commercial fonts as much as you, but sometimes very cheap or free alternatives are the only option for posters. What is suggested to them as a poor substitute may be a crappy font, but their crappy font budget may be able to afford nothing better and, so, your 'hranting" against affording them options is truly misguided.</p>
      <p>Moreover, I don't think that your stance of, "Please do not ask for or suggest free alternatives" is an official Typophile policy but, rather, a personal agenda.</p>
      <p>Lastly, your dislike of revivals because it's hard to determine legitimacy is not the poster's problem - it's yours. Those of us who recognize a typeface as originally an old metal or wood creation understand that anyone is free to create a digital version -no matter the quality. Again, your inability to do so should <em>not</em> be the poster's problem.</p>
