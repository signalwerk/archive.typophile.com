    html: |-
      <blockquote><p>I don't think that your stance of, "Please do not ask for or suggest free alternatives" is an official Typophile policy but, rather, a personal agenda.</p></blockquote>
      <p>Bingo.<br>
      Please look up what "dictate" means. And look up "please" while you're at it. Please.</p>
      <p>I've been a Typophile member since week 2, and remain one of its most dedicated users. But I've never had any formal authority (probably mostly because I've never wanted it) and have very rarely asked the moderators for anything (and never BTW for the removal of a member). Maybe my tone threw you off; on the Internet (and these days apparently most of the US as well) it seems only official moderators are supposed to (in fact <em>have</em> to) express themselves in measured terms - everybody else is expected to engage in trench warfare...</p>
      <p>My agenda is no secret, and is nothing nefarious - quite the contrary: I want to support typeface design, and I want Typophile to be healthy. Nasty stuff, eh? To me what's nasty is the increase in catering to users who hurt the craft, helping them ID fonts only to steal them, helping them find free clones, etc.</p>
      <p>Can't afford it? I do feel I'm sensitive to that* but there are limits, especially when it comes to choosing "just the right font", which is essentially a luxury, not a need. That said, I certainly agree that settling for buying a bad font is much better than pirating a good one. You should note that I wrote my post above at a point where it seemed probable that Erum simply didn't want pay <em>anything</em>. I'm glad that doesn't seem to be the case - thank you, Erum.</p>
      <p>* As I've said elsewhere I feel even outright <em>property theft</em> can sometimes be justified.</p>
      <p>BTW this recent thread is pretty revealing all-around I think:<br>
      <a href="http://typophile.com/node/99112" title="http://typophile.com/node/99112">http://typophile.com/node/99112</a></p>
      <blockquote><p>your dislike of revivals</p></blockquote>
      <p>Please bring that up in the pertinent thread and I will gladly address it - I don't want to distract from the helpful conversation happening here.</p>
      <p>As for what's whose problem: this is a community - your problems are my problems (just milder). People who don't like community responsibilities can go live in the forest.</p>
      <p>hhp</p>
