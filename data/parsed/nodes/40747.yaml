    <p>Hi everybody,</p>
    <p>A friend of mine runs a art &amp; technology convention in Cleveland called Notacon, and was looking for somebody who'd be interested in giving a talk about the basics of font design, the technical issues involved, and maybe give an overview of nifty OpenType features that people who aren't in the graphic design industry might not know about, but might find interesting.</p>
    <p>I'm considering doing the talk myself, but I've never done anything like this before. If there's anybody out there who lives near Cleveland and is more comfortable with this sort of thing, the Notacon people would love to hear from you.</p>
    <p>The con runs April 4-6, and you can see the call for proposals at <a href="http://www.notacon.org/cfp.html" title="http://www.notacon.org/cfp.html">http://www.notacon.org/cfp.html</a> .</p>
