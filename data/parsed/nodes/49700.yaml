    <p>I am developing a corporate brand for a company called 'All Styled Steel'<br>
    This can't be abbreviated for obvious reasons, so all 3 words need to be included.<br>
    At the moment i'm trying to find examples of good logos with 3 or more words to look at.<br>
    I'm also trying to figure out whether this can be just typographic or if it needs a mark. </p>
    <p>It would be really helpful if you could link me to some logos with a few words in them.<br>
    thanks!</p>
