    html: <p>I know it sounds peeky and my intention is clearly not to contradict Renko. Gotham is definitely a very good call but I rather think it's Mark Simonson's <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" rel="nofollow">Proxima Nova</a>. Gotham glyphs are a bit larger. Having a look to <a href="/wiki/https%3A/%252Fwww.google.com/search%3Fq%3D100%2Bdays%2Bof%2Blove%2526safe%3Doff%2526hl%3Den%2526source%3Dlnms%2526tbm%3Disch%2526sa%3DX%2526ei%3DdvcLVYmpAYj1apfxgegD%2526ved%3D0CAcQ_AUoAQ%2526biw%3D1920%2526bih%3D1061%2523q%3D100%2Bdays%2Bof%2Blove%2526safe%3Doff%2526hl%3Den%2526tbm%3Disch%2526tbs%3Disz%3Al" class="freelinking" rel="nofollow">more samples</a> (mainly <a class="freelinking external" href="http://www.kerala9.com/images/wallpaper/100-days-of-love/100-days-of-love-malayalam-movie-wallpapers-hd63.jpg" rel="nofollow">this one</a>) confirms it for me (/M for sure).</p>
    html_clean: <p>I know it sounds peeky and my intention is clearly not to contradict Renko. Gotham is definitely a very good call but I rather think it's Mark Simonson's <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" rel="nofollow">Proxima Nova</a>. Gotham glyphs are a bit larger. Having a look to <a href="https://www.google.com/search?q=100+days+of+love&amp;safe=off&amp;hl=en&amp;source=lnms&amp;tbm=isch&amp;sa=X&amp;ei=dvcLVYmpAYj1apfxgegD&amp;ved=0CAcQ_AUoAQ&amp;biw=1920&amp;bih=1061#q=100+days+of+love&amp;safe=off&amp;hl=en&amp;tbm=isch&amp;tbs=isz:l" class="freelinking link-external" rel="nofollow">more samples</a> (mainly <a class="freelinking external link-external" href="http://www.kerala9.com/images/wallpaper/100-days-of-love/100-days-of-love-malayalam-movie-wallpapers-hd63.jpg" rel="nofollow">this one</a>) confirms it for me (/M for sure).</p>
