    html: '<p>Go to the Pages palette. In the flyout menu, select Numbering and Section Options. Select the button for Start Page Numbering At: and enter the page number that you want the document to begin with. <br> <br><img src="http://www.typophile.com/forums/messages/30/66844.gif" alt="ind.gif"></p>'
