  html: |-
    <p>I was making a change in indesign earlier and the program crashed. Now Indesign crashes whenever I scroll down and that page becomes visible. I’ve cleaned the app and system font caches, that’s not fixing things. Does anyone have any suggestions for getting this file working again, or should I just start over from an older version?</p>
