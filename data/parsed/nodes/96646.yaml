    <p>So I'm starting on my first serious Hebrew companion to a font in the works. I'm far from professional or even good, I'd say. Either way, I found that resources about Hebrew text are very rare, and while I could fine plenty of resources about latin character design, I find myself doing mostly guesswork when it comes to Hebrew.</p>
    <p>So I managed to figure out a lot of things by myself just from looking at how existing known fonts look: shin connects to the left side, samech is kind of like a lowercase sigma as opposed to final mem, and so forth. But still, I know virtually nothing besides.</p>
    <p>The other thing is that (naturally) Hebrew letters are constructed somewhat differently from latin characters. I have a hard time really finding which components I should match up. There are certain things between different latin characters which are kept roughly the same throughout most characters (serifs, stems, etc) but I don't really know which ones I should match, really.</p>
    <p>If you have any useful tips, tricks, resources and such about this subject, I'd love to know.</p>
    <p>Also a more specific question now. Should my final nun reach all the way down to the same descender as the latin characters in the font? If so, wouldn't that be far too long? </p>
    <p>Thanks<br>
    Adi</p>
