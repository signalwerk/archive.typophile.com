      <p>I'm not an expert on Hebrew (I've only done highly imitative designs in that script) so hopefully you'll get some good replies from people with more specific experience, but from my long experience designing non-Latin type in general I will state one thing, and quite strongly: make sure you don't bend the Hebrew to the will of the Latin. Too many people who make non-Latin type value formal harmony between shapes so highly that they ignore what a script truly needs to function well. For example, serifs: don't do what Eric Gill did!<br>
      <a href="http://www.myfonts.com/fonts/lerfu/gill-hebrew/" title="http://www.myfonts.com/fonts/lerfu/gill-hebrew/">http://www.myfonts.com/fonts/lerfu/gill-hebrew/</a></p>
      <p>I once wrote an article about this topic titled "Latinization: Prevent and Cure" - maybe you can find a copy of Spatium magazine (issue #4) or the Greek journal Hyphen (#5) where it was featured.</p>
      <p>hhp</p>
