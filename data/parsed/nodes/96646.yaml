      <p>The Hebrew fonts that come with Ubuntu (a version of Unix) have a license that might give you what you want.  I believe this is available in Israel.</p>
      <p>Some licenses,  for instance the one I use for the Hebrew Font Shuneet are for "free" fonts where "free" is to be interpreted as in 'free speech' rather than 'free beer'(!)</p>
      <p>When you use font A as a source for another font B, the license of the new font B may not be more restrictive than the original license of A, which means that the license of font B must also be free (or even more free).</p>
      <p>Mike</p>
