      <p>@hrant:<br>
      <cite>In my view it's entirely possible for a "non-native" to make an acceptable typeface, simply by carefully imitating precedent; it is however extremely unlikely that he can make an innovative design.</cite></p>
      <p>That may be, but even that level of success may not always be achieved. Thus, the Unicode font "Caslon Roman" resembles the kind of Roman letters often found with Chinese or Japanese DBCS fonts, and I think they are failures... a non-native may not know <em>what to look for</em> when attempting to imitate precedent.</p>
