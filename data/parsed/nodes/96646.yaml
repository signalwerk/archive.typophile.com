    html: |-
      <p>Adi,</p>
      <p>I have written a little on how I designed companion Latin fonts for my Hebrew Font Shuneet see "Matching Hebrew and Latin" on 15 Oct 2010.  I would stress that in no way do the two fonts look alike!  They are companions - they go together and coexist comfortably when displayed or printed on the same page. On my website <a href="/wiki/%20http%3A/%252Fhebrew-font-shuneet.com%20" class="freelinking" rel="nofollow"> </a><a href="http://hebrew-font-shuneet.com" title="http://hebrew-font-shuneet.com">http://hebrew-font-shuneet.com</a>  you will see many examples of Hebrew and English side-by-side.</p>
      <p>If you look at the Introduction on my web site you will see that I have spent about forty years at this activity.  I began with calligraphy and did not imagine that would lead to font design.</p>
      <p>Your intention is to design a Hebrew font. I don't know what level of knowledge you have concerning the language ...but I can't imagine that a person who doesn't know some Hebrew could do this.</p>
      <p>What I suggest is this. Find an existing Hebrew font that you can add to your own font and import the characters. You will need to find a font with a suitable license. I did this for my Hebrew font by importing the Latin characters of Tuffy.  </p>
      <p>Clearly Tuffy doesn't look like a Hebrew font in any way. I did not change my imported Tuffy to "look Hebrew" however I did change it to have some of the characteristics of the Hebrew Font Shuneet, for instance I modified it so that the stroke width was more constant, also I changed the stroke terminators to match, and so on...</p>
      <p>You can copy the example texts from my web site, change the English to your font then look around for a free Hebrew font that will make a tolerable companion.</p>
      <p>Good luck, Mike</p>
