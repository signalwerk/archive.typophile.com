    <p>/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////<br>
    <strong>LADY RENE</strong><br>
    /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////</p>
    <p>We are proud to announce a new collaborative addition to the <strong><a href="http://sudtipos.com" rel="nofollow">Sudtipos</a></strong> library. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Lady-Rene-typoph_5509.jpg"></div><p></p>
    <p>This is the time for the Grammy awarded argentinian graphic designer <strong>Laura Varsky</strong> and her first commercial typeface named <strong><a href="http://sudtipos.com/fonts/137" rel="nofollow">Lady René</a></strong>.</p>
    <p>To illustrate the use of <strong><a href="http://sudtipos.com/fonts/137" rel="nofollow">Lady René</a></strong>, Laura designed a wonderful piece of art available to <a href="http://sudtipos.com/downloads/Lady_Rene-specimen.pdf" rel="nofollow">download</a> here:</p>
    <p>Never before illustration and typography were so close and well paired. We hope you like Laura style as much as we enjoyed building this into a complex font full of OpenType work until the limits.</p>
    <p>/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////<br>
    <strong>WORDS ABOUT LADY RENE</strong> by Laura Varsky<br>
    /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////</p>
    <p>Looking back on my production to date, neither so little nor so large, it does not come as a surprise to find myself now introducing <strong><a href="http://sudtipos.com/fonts/137" rel="nofollow">Lady René</a></strong>.</p>
    <p>A brief review of my career would read as follows: graphic designer graduated from Buenos Aires University, a 10-year professorship in Typography in the same institution, an illustrator in the making.</p>
    <p>For almost 15 years now my work has focused on the design of editorial pieces, predominantly books and CD sleeves. Typography proper has always been central to my research projects.</p>
    <p>All my obsessions eventually embodied as much the search for a perfect, spotless text as for a daring and provoking one. In my view, "how-to-say-something" ranks highest amongst a graphic designer’s responsibilities.</p>
    <p>It was in this vein that I called in the written word to illustrate, to draw, to narrate. Why not reverse the saying and proclaim that “a word is worth a thousand images”? If so, one single word could trigger endless meanings, associations, ideas, and memories in every reader’s mind. Language, we know, has a strong power and is a living expression of a culture.</p>
    <p>In my illustrations, letters and drawings reunite in one synergy said and unsaid, the finiteness of the message and the freedom of the free reading.</p>
    <p>And this is how and when, <strong><a href="http://sudtipos.com/fonts/137" rel="nofollow">Lady René</a></strong>, my first born type font sees the light of day conceived out of a love of illustration and a reverence for the written word, recalling the whimsicality of the handmade drawing and reflecting its sensitive, warmth and spontaneity.</p>
    <p>Allowed by the characteristics of Open Type and the hard, outstanding work of designer <strong>Ale Paul</strong>, <strong><a href="http://sudtipos.com/fonts/137" rel="nofollow">Lady René</a></strong> succeeds in composing texts in a simple, organic way by means of its contextual and stylistic alternates, swash characters, ligatures and connecting words.</p>
    <p>A bundle of decorative miscellanea completes the set of signs, enabling the user considerable freedom to create new typographic landscapes.</p>
    <p><strong><a href="http://sudtipos.com/fonts/137" rel="nofollow">Lady René</a></strong> is then prepared, very much like a character in a short story, to come to life in the reader’s mind. I expect you will enjoy her as much as I did creating her.</p>
    <p><strong>Laura Varsky</strong></p>
    <p>/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////<br>
    More fonts check<br>
    <a href="http://www.sudtipos.com" title="http://www.sudtipos.com">http://www.sudtipos.com</a><br>
    /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////</p>
