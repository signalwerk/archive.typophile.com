    html: |-
      <p>The letterforms show the hallmarks of the work of F.W. Goudy, as shown for example in Goudy Old Style <a href="http://www.myfonts.com/fonts/bitstream/goudy-old-style/" title="http://www.myfonts.com/fonts/bitstream/goudy-old-style/">http://www.myfonts.com/fonts/bitstream/goudy-old-style/</a> but I did not spot an exact match to any digital font.<br>
      F.W. Goudy is known to have designed over 120 fonts, including ones that were for private purchasers. See the list at <a href="http://www.goudyfonts.com/shop-numerical/" title="http://www.goudyfonts.com/shop-numerical/">http://www.goudyfonts.com/shop-numerical/</a><br>
      Other persons have designed fonts in Goudy's style.<br>
      It is possible that this is a private font for Smythson that uses an expanded width of the letters.<br>
      BTW you do not provide a reference for your statement "I agree with the author of the below thread who loves the curly in the end of the R."<br>
      Don</p>
