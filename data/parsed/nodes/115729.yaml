    <p>I'm looking for an equivalent to what Smythson use and I think call George Street in their stationary. </p>
    <p>I agree with the author of the below thread who loves the curly in the end of the R.<br>
    <a href="http://www.typophile.com/node/19233" title="http://www.typophile.com/node/19233">http://www.typophile.com/node/19233</a></p>
    <p>The suggestion there is Classic Roman but that looks like its upper case only, can anyone help with this which includes the lower case? Thank you in advance.</p>
