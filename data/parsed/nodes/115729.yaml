    html: |-
      <p>I saw the the suggestion by Fivo's of Goudy's Bertham for the lower case after I made my post. I also saw that you added a link to the previous thread. I checked the link in that thread to Monotype Classic Roman.<br>
      If you use Monotype Classic Roman for the upper case and Bertham for the lowercase, and expand the width you will be fairly close to the font being used by Smythson .<br>
      Don</p>
