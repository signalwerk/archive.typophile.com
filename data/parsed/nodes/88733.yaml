  html: |-
    <p>I'm able to embed bitmap font within a  true type font file .ttf which<br>
    contains kerning table.  Molizza firefox only uses the true type font<br>
    in the .ttf file, but not the embedded bitmap font.   Is there a way<br>
    to ask the firefox to render text using the embedded bitmap font, and<br>
    apply the kerning as well?   I already set<br>
    "browser.display.auto_quality_min_font_size" to 0, so that the kerning<br>
    effect should be applied for any font size, if it is used at all.</p>
    <p>If not, is there a way for Molizza to apply kerning to bitmap font?<br>
    What kind of bitmap font file would preserve kerning info that Molizza<br>
    can be used? It looks like bdf and pcf can't have kerning info with it.</p>
