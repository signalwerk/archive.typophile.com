      <p>"But isn't Firefox displaying anti-aliased text, so it only displays "graymaps"? In that case, if you've embedded black and white bitmaps, they'd never be called."<br>
      -- I put the following in the fonts.conf file<br>
              &lt;match target="font"&gt;<br>
                      &lt;edit name="antialias" mode="assign"&gt;&lt;bool&gt;false&lt;/bool&gt;&lt;/edit&gt;<br>
              &lt;/match&gt;<br>
       But it didn't help.</p>
      <p>"BTW, how are you embedding the bitmaps?"<br>
      I used fontforge to generate the embedded bitmap ttf file and followed the instructon:<br>
      <a href="http://fontforge.sourceforge.net/editexample8.html" title="http://fontforge.sourceforge.net/editexample8.html">http://fontforge.sourceforge.net/editexample8.html</a></p>
      <p>Also I find out that some system setting in fonts.conf can turn embedded bitmap off. So I especitally turned it on by setting the following in my local fonts.conf. But it seems still not working...</p>
      <p>        &lt;match target="font" &gt;<br>
                      &lt;edit name="embeddedbitmap" mode="assign" &gt;<br>
                              &lt;bool&gt;true&lt;/bool&gt;<br>
                      &lt;/edit&gt;<br>
              &lt;/match&gt;</p>
      <p>First I need to let the browser display the embedded bitmap font, kerning is the second priority here.  But so far I'm not able to reach my first goal yet.  BTW, I'm testing with Firefox 3.6 in RedHat 5.5.</p>
