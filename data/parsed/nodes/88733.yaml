    html: "<p>Kerning is not supported cross browser yet, so (for a useable webfont) you'll just have to wait that one out. As for the embedded bitmaps: as far as I know they're not supported by any relevant browsers. What you want to do is fix Windows' poor rendering right? Embedded bitmaps is not the way to go.</p>"
