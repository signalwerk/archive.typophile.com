      <p>&gt;now if the font were extinct, you coudn’t really use it, could you? </p>
      <p>The problem is that even with all the ancient technology used for typesetting and printing there are hobyists or developing world print shops still using them - so they are not extinct. Or the technologies are so obscure that they were never really popular in the first place - so DOA not extinct.</p>
