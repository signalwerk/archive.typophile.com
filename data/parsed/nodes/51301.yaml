  html: <p>I just read about Kindersley's "MoT serif"-typeface, originally designed for British roadsigns, but never used. Does anyone know if this face has ever been digitized? It is a very interesting typeface, although very peculiar.</p>
  html_clean: <p>I just read about Kindersley's "MoT serif"-typeface, originally designed for British roadsigns, but never used. Does anyone know if this face has ever been digitized? It is a very interesting typeface, although very peculiar.</p>
