      <p>Dear Hassebasse. The Cardozo Kindersley Workshop offers a font called <a href="http://www.kindersleyworkshop.co.uk/type-design/" rel="nofollow">Grand Arcade as a free download</a>. According to their site, it is based on the MOT Serif.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/grandarcade_4260.gif"></div><p></p>
      <p><em>Our new face based on KINDERSLEY MOT has been designed, for the Grand Arcade, Cambridge. It will have a newly designed lower-case to fit the original capitals from David Kindersley’s drawings which have now properly digitised.</em></p>
