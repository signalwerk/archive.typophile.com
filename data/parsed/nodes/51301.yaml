      <p>It <cite>was</cite> paid for, according to the Cardozo Kindersley Workshop site:</p>
      <blockquote><p>...thanks to Grosvenor who paid for David’s 1950s face to be properly digitised – David would be most upset to see the terrible variations of his KINDERSLEY MOT. So please use this proper version.</p></blockquote>
      <p>So it should meet hhp's stamp of quality, money was paid. Interestingly enough, one "terrible variation" may be a for-sale font -- brought to you by Monotype &amp; others...</p>
      <p><a href="http://www.myfonts.com/search/octavian/fonts/">http://www.myfonts.com/search/octavian/fonts/</a></p>
      <p>Oh, and stay out of libraries with all their books free to be read, denying us authors our proper royalties...</p>
