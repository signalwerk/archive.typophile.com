    html: "<p>I think it's pretty cool. The problems I see: <br>1) It's highly expressive, which is sort of anti-news. On the other hand, the smaller the town the more \"personal\" news can be. <br>2) The x-height isn't just big, it's massive. The target for these proportions is more around the footnote scale. Especially since provincial newspapers tend to set their type a bit large (for various reasons). <br>3) I would shift more of the vertical space from the descenders to the ascenders, for optimal use of line height. <br>Or combining #2 and #3: just make the descenders taller. <br> <br>BTW, FYI, AFAIK :-) Christian Schwartz's recent face for the Houston Chronicle was the first Venetian news face. Let's hope for a trend! <br> <br>hhp</p>"
