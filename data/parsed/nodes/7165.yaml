      <p>Where did this go?</p>
      <p>(edit)<br>
      I engaged in a bit of hyperbole here earlier, but I'd like to say that I like that you took Cloister as an inspiration, and made a large x-height typeface with it. I like the "arts &amp; crafts" feel and that it's "designed for readability and economy." And the open /P/ is very nice -- something I like and that you don't typically find in a Jenson or a Golden Type.</p>
      <p>I'd love to get a close look at the tops of your /b/d/h/k/l/. It;s a quirk, but I like the top serif on those letters in Golden Type and Phinney Jenson. URW's cut of Cloister may have my favorite rendering of these serifs, from what I've seen so far, but its x-height is unfashionable.</p>
      <p>I would love to use your Erwin.<br>
      (/edit)</p>
