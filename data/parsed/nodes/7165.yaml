    html: <p>I think your graphic comparing Erwin to other newspaper types demonstrates well how soft your outlines are compared to what's out there. The main change between Christian Schwartz's Houston[1] and other venetian interpretations (Adobe Jenson, Goudy's Californian) is that (aside from x-height, proportions) they have subtly modulated strokes and soft curves while Houston adopts the simple modulation and sharp lines of conventional newspaper type. Erwin would look to me more like a newspaper type, albeit a unique and inviting one, if it had more of sharpeness of other newspaper types. <br> <br>Btw, I would like to see this set in columns. It's hard to imagine exactly how it'll set from the specimen but your copyright notice in the sample looks very promising. <br> <br>[1] <a href="http://typographi.com/art/articles/houston/houston.pdf" target="_blank">http://typographi.com/art/articles/houston/houston.pdf</a></p>
