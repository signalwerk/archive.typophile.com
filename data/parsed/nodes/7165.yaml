  html: "<p>I've been lurking for months, but it's time to <br>poke my head out again &amp; re-join the discussion. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>What if Cloister (Jenson) and Plantin had a child <br>who went into the newspaper business? <br> <br><img src=\"http://www.typophile.com/forums/messages/29/51271.gif\" alt=\"erwintextroman.gif\"> <br> <br>Erwin is a news text face designed for use in <br>the Erwin Record, a small, weekly newspaper <br>in the town of Erwin in northeastern Tennessee. <br>The paper currently uses ITC Bookman as its <br>body text typeface, but the editor is considering <br>a re-design. <br> <br>I based Erwin on two of my favorite text faces: <br>Plantin, the grand-daddy of all news faces, for <br>sturdiness and practicality; and Cloister, my <br>favorite Jenson-inspired design, for elegance <br>and beauty. The x-height was increased, extenders <br>decreased, and overall width condensed to aid <br>readability and space economy. <br> <br>The chief concerns are, of course, readability, <br>coupled with the rigors of printing on newsprint. <br>In addition, we want a font with a warm, homey, <br>inviting feel. Plantin and Jenson seemed to fit <br>the bill as models from which to begin. <br> <br>Old-style numerals will be posted soon. <br>Small caps, italics, bold and ornaments are also <br>among the planned extensions of this family. <br> <br>Any and all comments will be greatly appreciated. <br> <br> <br>David</p>"
  html_clean: "<p>I've been lurking for months, but it's time to <br>poke my head out again &amp; re-join the discussion. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>What if Cloister (Jenson) and Plantin had a child <br>who went into the newspaper business? <br> <br><img src=\"http://www.typophile.com/forums/messages/29/51271.gif\" alt=\"erwintextroman.gif\"> <br> <br>Erwin is a news text face designed for use in <br>the Erwin Record, a small, weekly newspaper <br>in the town of Erwin in northeastern Tennessee. <br>The paper currently uses ITC Bookman as its <br>body text typeface, but the editor is considering <br>a re-design. <br> <br>I based Erwin on two of my favorite text faces: <br>Plantin, the grand-daddy of all news faces, for <br>sturdiness and practicality; and Cloister, my <br>favorite Jenson-inspired design, for elegance <br>and beauty. The x-height was increased, extenders <br>decreased, and overall width condensed to aid <br>readability and space economy. <br> <br>The chief concerns are, of course, readability, <br>coupled with the rigors of printing on newsprint. <br>In addition, we want a font with a warm, homey, <br>inviting feel. Plantin and Jenson seemed to fit <br>the bill as models from which to begin. <br> <br>Old-style numerals will be posted soon. <br>Small caps, italics, bold and ornaments are also <br>among the planned extensions of this family. <br> <br>Any and all comments will be greatly appreciated. <br> <br> <br>David</p>"
