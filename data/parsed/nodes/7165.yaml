    html: "<p>&gt; Erwin can be set 1/2 a point larger and <br>&gt; still have better word economy than Bookman.  <br> <br>But any comparison is incomplete without factoring in: <br>1) The apparent size (where Erwin will probably win). <br>2) The apparent leading (where Erwin will probably lose). <br>and <br>3) The readability, which is extremely hard to measure, but can be gauged through an observation of the vertical proportions, the ideal depending on point size. At your ~9.5 point, I think Erwin is a bit large on the body. <br> <br>The \"Z\"/\"z\": I'm no longer sure about what I said before. Although in the UC I think it's tangibly distracting. <br> <br>&gt; I'm not convinced that sharp corners and <br>&gt; straight lines are much of an advantage <br>&gt; in newspaper type.  <br> <br>I think they do work better, because they're more neutral/newsy. <br> <br>Some micro stuff: <br>- I think the \"g\" is still off. <br>- The \"r\", \"v\" and \"y\" are too wide. <br>- Killer OS zero! <br>- Dollar: try adding a ball to the top. <br>- Pilcrow: needs dark mass (to work). <br> <br>hhp</p>"
