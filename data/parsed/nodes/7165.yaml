      <p>For several reasons, this project has been on the backburner for a couple of years, but it's coming off the backburner again. That means it's time to show you some of the progress. :)</p>
      <p>Again, this will be used for body text in a weekly, small-town local newspaper. No hard-hitting news, just local stuff – so the purpose is to create a warm, friendly text face that will be legible and readable at small sizes, and will withstand the rigors of newspress printing.</p>
      <p>The roman was designed using elements of Plantin and Cloister, with an increased body height, so it has a very Arts &amp; Crafts feel to it:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ErwinTextRomanSpec8x6_6596.jpg"></div><p></p>
      <p>The italic draws from both of these sources, but also contains many Baroque features:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ErwinTextItalicSpec8x6_6176.jpg"></div><p></p>
      <p>As you can see, there are several alternate glyphs available, as well as small caps and three sets of numerals so far (with fractions in the works). There are also swash characters and ligatures that I'll post soon. I'll also post some text settings ASAP.</p>
      <p>David Thometz</p>
