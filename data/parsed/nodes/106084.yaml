      <p>I'm not so sure about that now Josh. I'm not say it can't be done as you say but take a closer look at the diagonal lines in the Op's sample. There are several different sections each having the diagonal lines on different angles. Can that be accomplished by 3d extrusion of the text, perhaps I'll try it later. But, I think it was hand rendered via guides and all ...and not extruded.</p>
      <p>In my below sample I overlayed text and traced the areas I wanted to fill as I mentioned earlier. All the diagonal lines are evenly spaced and of the same angle because it is a pattern, but the shadow effect seems to get lost especially on the crossbar of the G...</p>
