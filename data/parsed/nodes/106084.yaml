    html: <p>5star, it's a little more complicated than that because the line pattern is part of a 3d extrusion of the text, not a drop shadow of the text. To make that shape you'd need to make two copies of the letter and manually connect the points on one to the equivalent points on the other to create the diagonal extrusion.</p>
