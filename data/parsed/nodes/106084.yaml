    html: <p>Create a line the desired thickness for the shadow effect &gt; rotate the line to the desired angle  for the shadow &gt; create a pattern from/with that line &gt; duplicate the text layer move the layer under the original text layer and create outline of the text &gt; fill the outlined text with the line pattern &gt; off set the pattern from the text &gt; and as in your above example stroke the original text.</p>
    html_clean: <p>Create a line the desired thickness for the shadow effect &gt; rotate the line to the desired angle  for the shadow &gt; create a pattern from/with that line &gt; duplicate the text layer move the layer under the original text layer and create outline of the text &gt; fill the outlined text with the line pattern &gt; off set the pattern from the text &gt; and as in your above example stroke the original text.</p>
