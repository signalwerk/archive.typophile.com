    <p>The School of Art and Design at the University of Illinois at Chicago is an art school that teaches discipline in Graphic Design. It has a strong focus on the International Style of&nbsp;typography.</p>
    <p>Students are trained to compose works without the use of computers. They must print out type in various sizes and set it, not unlike photographic typesetting. After they are satisfied with the work, the reproduce it on the Max <span class="caps">OS</span> X platform to be archived and printed for&nbsp;display.</p>
