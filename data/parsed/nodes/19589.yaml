    <p>hello typophiles</p>
    <p>at work we are redesigning the corporate newspaper of a very big global company, active in the medical sector.</p>
    <p>at the moment, they use the official CD-fonts, namely Minion for text and  minion condensed for headlines and Berthold Imago for subheads, and captions and infoboxes.</p>
    <p>needed:<br>
    - two typefaces that get then used for headline and body copy, infoboxes and captions. normal, bold and italic,  the fonts need char-sets for spanish, german, french and english.<br>
    - a sans and a serif that work together<br>
    - typefaces that dont use too much space (the layout has 5 columns, the papersize is only A3)<br>
    - style: classic but modern, timeless, not trendy and not too playful (no vista, for example :))</p>
    <p>do you have any ideas or thoughts? any help would be greatly appreciated!</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/19686" class="topic-previous" title="Go to previous forum topic">‹ Pratt/SCAD Grad programs?</a> <a href="/node/19671" class="topic-next" title="Go to next forum topic">Typeface for female photographer ›</a></div>
