  html: |-
    <p>Hi-</p>
    <p>I'm designing a logo for a school project that is for a bird sanctuary. I am doing a watercolor wing,<br>
    and would like to figure out the proper type to go with it. I like the contrast between having<br>
    a watercolor with a slab serif, but want to see what others think.</p>
    <p>The name is called:</p>
    <p>Arbutus Migratory Bird Sanctuary.</p>
