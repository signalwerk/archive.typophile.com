      <p>Couldn’t find a match, but Ryu Gothic and Kozuka Gothic are both very close, and would only require minor editing to achieve the look:<br>
      <a href="http://www.myfonts.com/fonts/adobe/ryo-gothic-plus-n/" title="http://www.myfonts.com/fonts/adobe/ryo-gothic-plus-n/">http://www.myfonts.com/fonts/adobe/ryo-gothic-plus-n/</a><br>
      <a href="http://www.myfonts.com/fonts/adobe/kozuka-gothic-pr6n/" title="http://www.myfonts.com/fonts/adobe/kozuka-gothic-pr6n/">http://www.myfonts.com/fonts/adobe/kozuka-gothic-pr6n/</a></p>
      <p>Myriad Pro is a close second:<br>
      <a href="http://www.myfonts.com/fonts/adobe/myriad/" title="http://www.myfonts.com/fonts/adobe/myriad/">http://www.myfonts.com/fonts/adobe/myriad/</a></p>
