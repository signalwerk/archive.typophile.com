    <p>Our own frequenter of Typohile and brilliant young type designer from <a href="/wiki/New%252BZealand" class="wiki">New Zealand</a>, <a href="/wiki/Kris%252BSowersby" class="wiki">Kris Sowersby</a>, <a href="/wiki/KLIM" class="wiki">KLIM</a>  (is milk spelled backwards:-)) is the newest member of <a href="/wiki/Village" class="wiki">Village</a> and his <a href="/wiki/Feijoa" class="wiki">Feijoa</a> type is soon to be released.<br>
    I have seen and admired his work here in the critique area and now it is finally out on the market!  BRAVO! BRAVO! BRAVO!!!</p>
    <p>Great work Kris and the best of luck to you!</p>
    <p>ChrisL</p>
