    html: "<p>ok. <br>A, it swaps horizontals with 45', over and over again.  <br>B, verticals stay the same, but offset in-glyph by A. <br> <br>Every time I look at it my brain's type reader gets all drunk and starts playing air guitar at 45'. <br> <br>As others have said, it's very refined. I can't tell if the \"p\" is different. <br> <br>disclaimer: I am not impartial. and I play air guitar poorly.</p>"
