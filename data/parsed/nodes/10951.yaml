    <p>Headbangers Nostalgic Typophiles: <br> <br>-This font was designed and inspired listening with some good Heavy-Thrash Metal Old 80`s bands, i hope that this design would be usefull. <br> <br>-At 100% it looks with no Jagged angles(smoth angles?) <br> <br>-i try to make something like ligatures, "edgedures" <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Please critique. <br> <br>MH <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/8637.gif" alt=""></p>
