      <p>hrant: At one time there was a bug in Fontographer that defaulted ALL fonts to 'no embedding'. If the font creator even knew about it, finding the fsType entry to set the bits properly wasn't clear either. That's why there are thousands of older fonts that routinely need this fix.<br>
        - Herb</p>
