    html: |-
      <p>If there is no tool to give you simply the fsType of your files, here is a script that does it</p>
      <p>#!/bin/sh<br>
      AFDKOPython &lt;&lt;EOF<br>
      from fontTools.ttLib import TTFont</p>
      <p>f=TTFont("$1")<br>
      try:<br>
        print "%s; 0x%04x" % ("$1", f["OS/2"].fsType)<br>
      except:<br>
        print "%s; fsType not found" % ("$1")<br>
      EOF</p>
      <p>If you call it <code>fstype</code>, make it executable and put it in a directory that is in your path on the Mac then<br><code><br>
      find . -iname "*.[ot]tf" -exec fstype {} \;<br></code><br>
      will list all ttf and otf files if the current directory and subdirectories with their fsType. I guess that should also work with Cygwin on Windows but I have no way to check.</p>
