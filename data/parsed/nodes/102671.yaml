    html: |-
      <p>On the mac, to change to 0x0008 the value of fsType of all otf and ttf files in the current directory and subdirectories, all you need to do is to type in the terminal window </p>
      <p>find . -iname "*.[to]tf" -exec chngfs {} 0x0008 \;</p>
      <p>provided the call <code>chngfs fontfile 0x0008</code> changes the fsType of fontfile to 0x0008. The following code for <code>chngfs</code> does it if <a href="http://www.adobe.com/devnet/opentype/afdko.html">AFDKO 2.5</a> for Mac is installed:</p>
      <p>#!/usr/bin/env AFDKOPython</p>
      <p>import sys, os<br>
      from fontTools.ttLib import TTFont</p>
      <p>f=TTFont(sys.argv[1])<br>
      f["OS/2"].fsType=int(sys.argv[2],16)<br>
      if len(sys.argv) == 4:<br>
        f.save(sys.argv[3])<br>
      else:<br>
        f.save("tmpfil")<br>
        os.rename("tmpfil",sys.argv[1])</p>
      <p>provided  <code>chngfs</code> is made executable and put in your path. </p>
      <p>As for Windows, the Python 2.7  documentation says  it is not possible to rename with os.rename a file to a file name that is already in use. That is why <code>chngfs</code> above was written to take an additional, optional, argument. If AFDKOPython is made available at the command line on Windows then the command</p>
      <p>AFDKOPython chngfs fontname.ttf 0x0008 newname.ttf</p>
      <p>produces a new font with the chosen fsType (works the same on the mac).</p>
      <p>You can also call <code>chngfs</code> with 0x0002 and 0x0004, 0x0008 as well as 0x0000 and variations 0x01?? and 0x02??; cf <a href="http://www.microsoft.com/typography/otspec/os2.htm#fst">http://www.microsoft.com/typography/otspec/os2.htm#fst</a>.</p>
      <p>Michel</p>
