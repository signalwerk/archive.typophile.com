    <p>Claramaria<br>
    Hi mates.. :D</p>
    <p>I come for leave my new font proyect that I was start a few days ago. I'm trying to make a  modern font using a constant proportion on most of cases for get clear white spaces with soft curves for be used in posters and graphic performances.</p>
    <p>For example instead vertical rectangle of "o" the "m" use a similar proportion but an horizontal orientation.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Claramaria_show_lowercases_5835.png"></div><p></p>
    <p>Hope you can drop me litle comment or critique for improve some detail that obviousely I can't see.</p>
    <p>Regards &amp; respects..!!</p>
