      <p>And Happy 2010 to you too Pedro :)</p>
      <p>In that case, you could try thinning the spurs (e.g. the top left corner of the vertical stroke on r). I think the combination of the small notch and the no-thinning junction makes that part quite dark.</p>
      <p>Your contrast looks almost reversed. Is that intentional? The horizontals are rendering heavier than the verticals, it seems?</p>
