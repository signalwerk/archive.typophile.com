    html: <p>Yes, hard to tell without seeing the letters a bit bigger, and without a full glyph set. I quite like the tone of this. The junctions of the arched letters (nmr) are a bit high and the white notch will clot at small sizes, so I'd make that more substantial. I think e and o look a bit narrow. I think the crossbars on f and t should extend further to the left. And I'm sorry to say the spacing is not very good ;) Look forward to seeing how this progresses!</p>
