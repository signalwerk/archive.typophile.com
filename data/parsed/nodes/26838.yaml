  html: <p>Just a reminder, in case you don’t already know. The San Francisco Center for the Book is presenting a symposium at <span class="caps">CCA</span> this Saturday, Sept. 20, to coincide with its current exhibition of French design legend Massin’s work. <br><br>I posted a press release here on Typophile in the News <span class="amp">&amp;</span> Events section. Starts at 2pm at <span class="caps">CCA</span>. Reception at <span class="caps">SFCB</span> to follow the talks. Free event, open to the public.  <br><br><span class="caps">SOTA</span>’s a proud sponsor <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> I won’t be able to make it, but I hope to hear reports from any locals who can attend. Should be another great event. Go to the <span class="caps">SFCB</span> website at <a href="http://www.sfcb.org" target="_blank">http://www.sfcb.org</a> to get more&nbsp;details.</p>
