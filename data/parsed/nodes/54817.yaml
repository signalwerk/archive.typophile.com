    <p>Hey there, I've searched for an answer to this question here and elsewhere, but haven't found anything too useful.</p>
    <p>I've got a job designing and laying out the student magazine for my university this year and am looking for a clean, contemporary body font to do so.</p>
    <p><a class="freelinking external" href="http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Courier+Sans/" rel="nofollow">Courier Sans</a> would be great but at NZ$470 is a bit too expensive for such a task, but is the sort of thing I'd love to use. The best I've found so far is <a class="freelinking external" href="http://new.myfonts.com/fonts/testpilot/saarikari/regular/" rel="nofollow">Saarikari</a>, which at about NZ$180 isn't too unreasonable, and has that nice pseudo-monospaced feel, and handles pretty well at smaller sizes.</p>
    <p>If anyone had any suggestions for something else that might be in the vein of what I'm after I'd love to hear them.</p>
    <p>Thanks very much!</p>
