    html: |-
      <p>I did see the link (and I know what you meant by "pseudo-monospaced"). Courier has so many idiosyncracies that you can't evoke it and stay reasonably readable. It's monoline, its serifs look like stems, but most of all it's monospaced. Being monospaced is a curse in terms of readability; pretending to be monospaced is just diluting that curse. Is it possible to dilute it enough? Maybe, but I highly doubt it. I think when you dilute it enough you've already gone way beyond looking monospaced at all. Probably because readability is in a different ballpark than conscious evaluation. And I haven't even elaborated on it being monoline and having ridiculous serifs.</p>
      <p>Courier is simply not something to emulate for extended reading, no<br>
      matter how much it might appeal to a certain ideology or aesthetic.</p>
      <p>hhp</p>
