    html: <p>I created the monospaced letters because when I was creating it and putting the letters into sentences, I enjoyed the interweavings that were created not only in the letters, but also within the words. See the example below. <br> <br>I tried to keep the knotwork relatively true to traditional forms, specifically in the sharp edged corners where it applied to. This is also why the cord width in the letters is regular. I also wanted to create the letters forms out of the cord instead of using the cord to fill in the letter forms, although  I do like the effect that it gives to letters when it is used. <br> <br>I am looking for new ways to try to do the &amp;, with the letter having the over and under pattern to begin with, it is hard to work the over and under pattern of the celtic knotwork into the &amp;.  I am also looking into creating different forms for some of the other letters that are not as successful as others.  <br> <br>Thank you for the input, and keep it coming! <br><img src="http://www.typophile.com/forums/messages/29/28821.jpg" alt=""></p>
