    html: <p>I really like this idea. It looks promising. <br> <br>Here is my crit- The base of your font's shape &amp; our clue as to the identioty of a glyph is alluded to with the curves &amp; then knot or celticness goes over that often ending in very modern square edges.( why monospaced?, why modern shapes as a base?) This technique adds a consistancy &amp; tension to the font which is fun - but in some characters not enough consideration is given to the form to be evoked &amp; the glyph gets bogged down by an extreme regularity. The K is like that. VW &amp; X are not. The zero,Q and the '&amp;' are like that. The H is not. Q is a great glyph to venture beyond basic rules. Really it's the charcters where you venture from your base idea &amp; do something beyond it which work best to me.  <br> <br>One other idea - what about making the thread vary in width here &amp; there to give emphasis? I have seen celtic art that used that to great effect.</p>
    html_clean: <p>I really like this idea. It looks promising. <br> <br>Here is my crit- The base of your font's shape &amp; our clue as to the identioty of a glyph is alluded to with the curves &amp; then knot or celticness goes over that often ending in very modern square edges.( why monospaced?, why modern shapes as a base?) This technique adds a consistancy &amp; tension to the font which is fun - but in some characters not enough consideration is given to the form to be evoked &amp; the glyph gets bogged down by an extreme regularity. The K is like that. VW &amp; X are not. The zero,Q and the '&amp;' are like that. The H is not. Q is a great glyph to venture beyond basic rules. Really it's the charcters where you venture from your base idea &amp; do something beyond it which work best to me.  <br> <br>One other idea - what about making the thread vary in width here &amp; there to give emphasis? I have seen celtic art that used that to great effect.</p>
