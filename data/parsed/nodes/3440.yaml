    html: "<p>This is a very interesting concept, Lisa!  <br><br>One thing I have trouble with is diﬀerentiating “B” and “8”… And also, I think that perhaps the crossbars in those two characters would beneﬁt from intertwining on both ends instead of just one…  <br><br>I have a similar issue with the zero ﬁgure: perhaps the diagonal bar should be one long cord rather than two short ones that almost touch in the middle…, or, as an alternative, keep the two cords, but have them tightly intertwined, like in your “H” character’s crossbar. <br><br>Looking forward to seeing more of this, <br>Ricardo</p>"
    html_clean: "<p>This is a very interesting concept, Lisa!  <br><br>One thing I have trouble with is diﬀerentiating “B” and “8”… And also, I think that perhaps the crossbars in those two characters would beneﬁt from intertwining on both ends instead of just one…  <br><br>I have a similar issue with the zero ﬁgure: perhaps the diagonal bar should be one long cord rather than two short ones that almost touch in the middle…, or, as an alternative, keep the two cords, but have them tightly intertwined, like in your “H” character’s crossbar. <br><br>Looking forward to seeing more of this, <br>Ricardo</p>"
