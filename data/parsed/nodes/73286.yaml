    <p>/////////////////////////////////////////////////////////////////////////<br>
    <strong>FAN SCRIPT</strong> - A NEW SUDTIPOS RELEASE<br>
    /////////////////////////////////////////////////////////////////////////</p>
    <p>We are proud to announce the release of our new typeface <strong><a href="http://marketplace.veer.com/fonts/UMT0001033" rel="nofollow">Fan Script</a></strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fantypophile_3691.jpg"></div><br>
    .<p></p>
    <p>A typeface basically focus in sports but with a strong contemporary attitute<br>
    and ready to be used in any kind of projects.</p>
    <p>We have designed a <a href="http://www.sudtipos.com/downloads/Fan_Script-Specimen.pdf" rel="nofollow">PDF</a> specimen to show some of the possibilities of the font. </p>
    <p>Please take a look at our <a href="http://www.behance.net/gallery/Fan-Script/643678" rel="nofollow">Behance page</a> for a fast preview or download the hi-res <a href="http://www.sudtipos.com/downloads/Fan_Script-Specimen.pdf" rel="nofollow">Fan Script Specimen</a></p>
    <p>We hope you enjoy that new release.</p>
    <p>More fonts &gt; <a href="http://www.sudtipos.com" rel="nofollow">www.sudtipos.com/</a></p>
