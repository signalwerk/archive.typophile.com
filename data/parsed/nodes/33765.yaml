      <p>Hi Steph,<br>
      Thanks for your suggestions! </p>
      <p>&gt; Some of these are not what I would call “contemporary”, but that term is a far cry from Engravers,</p>
      <p>Exactly what I told the client. "Contemporary" is not equals to what he chose. But I supposed ever since the genre got mixed up with luxury goods, it became somewhat associated with being modern, classy and "contemporary". </p>
      <p>So now, I'm taking a step back and trying to see through his eyes. How something like "Engravers" is contemporary, and how to use it as if it was "modern" and "contemporary".</p>
      <p>Actually, I made a mistake, he chose AT Sackers. </p>
      <p>I first looked  at Luxury, and I really liked Diamond, etc, so I chose a poor man's version — engravers and gave Sackers as an option.</p>
      <p>The client liked the funky "C" in Sackers. I have MAJOR MAJOR problems with the Sackers "R". And also the contrast. It's not nearly as high contrast as engravers, which I kinda prefer. But the serifs in Engravers, I find too pronounced. </p>
      <p>So now I know what exactly we're paying for when you dish out $$$ for Luxury. </p>
      <p>But first, I'll check out all your suggestions!!!</p>
