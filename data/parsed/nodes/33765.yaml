    <p>I'm a little stuck. My client has chosen "Engravers Lt" for a logotype for a restaurant that we're working on. Not a choice I would've made, but since it was one of the suggestions I gave, I'd be happy to roll with it and work with it. </p>
    <p>The look we're going for is classy (where have you heard that one before), contemporary, but not too formal, stuffy or otherwise fuddy duddy. </p>
    <p>Now I need to find a matching "text" face  to go with it. He has a preference for serif faces, but I'm open to both. I have suggested Neutraface to contrast with Engravers and to give the identity a modern edge. </p>
    <p>I am looking for something that is<br>
    -slightly broad (like engravers),<br>
    - something with both old style and lining figures and also<br>
    - small caps. IS that too much to ask?</p>
    <p>I have tried Goudy Old Style, Mrs Eaves, Adobe Caslon. But it seems like none of them are working very well. Mrs Eaves small caps is ok but the rest of it looks too "pretty" for this quite androgynous or even "masculine" look we have going. </p>
    <p>On the bright side, we're not really setting prose, so it does not need to be *too* readable. Just namecards and menus.</p>
    <p>Any suggestions at all would be welcome. </p>
    <p>Thanks!</p>
