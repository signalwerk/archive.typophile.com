      <p>Hi Karen. The first thing that comes to mind if you want a text match for <a href="http://www.fontshop.com/fonts/singles/linotype/engravers_lt_std_bold_face_ot/" rel="nofollow">Engravers LT</a> is <a href="http://www.houseind.com/index.php?page=showfont&amp;id=536&amp;subpage=viewfonts" rel="nofollow">Luxury Text</a>.</p>
      <p>Otherwise:<br>
      <a href="http://www.fontshop.com/fonts/downloads/urw/corporate_a/" rel="nofollow">Corporate A</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_clifford/" rel="nofollow">FF Clifford</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/linotype/linotype_gianotten_virtual/" rel="nofollow">Gianotten</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/linotype/linotype_centennial_virtual/" rel="nofollow">Centennial</a><br>
      <a href="http://www.fontshop.com/search/?q=swift" rel="nofollow">Swift</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_absara/" rel="nofollow">FF Absara</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_acanthus_text/" rel="nofollow">FF Acanthus Text</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/font_bureau/miller_1_text/" rel="nofollow">Miller</a> - hybrid figures<br>
      <a href="http://www.fontshop.com/fonts/downloads/itc/itc_modern_no_216/" rel="nofollow">ITC Modern No. 216</a> - no small caps or OSF<br>
      <a href="http://www.fontshop.com/fonts/downloads/font_bureau/escrow_text/" rel="nofollow">Escrow Text</a> - no small caps or OSF</p>
      <p>Some of these are not what I would call "contemporary", but that term is a far cry from Engravers, so I went with the best fit for the type you are working with. Scotch romans, text didones, sharp serifs, and a few contemporary faces that share characteristics of those.</p>
