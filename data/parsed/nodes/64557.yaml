    so i've come to the board for a critique on my wedding invitation. i've been through dozens and dozens at this point, and i'm finally feeling good about where we're at. (exact spacing/kerning/leading yet to be done - i wanted to get the general thing good enough, then move on to those details). thoughts? thank you!</p>
