      <p>What Chris said. I like dry champagne at weddings, but I think an invitation should have more playfulness, more joy. This is not just another design job.</p>
      <p>What to do? All I can think of might be too cheesy: bring the tail of the "R" in "LAUREN" all the way down to merge with the "R" in "ANDREI". The angles are actually lining up quite well as is!</p>
      <p>One other thing: you (and especially your parents) I don't think are getting enough "respect" here. This is an issue not just of fairness (no matter who's paying for what) but your future collective happiness as well.</p>
      <p>&gt; keep the Mums away from the champagne</p>
      <p>Ah!<br>
      "Don't serve mums Mums."</p>
      <p>hhp</p>
