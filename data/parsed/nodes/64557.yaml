    html: |-
      <p>Hi Lauren,<br>
      love it, what a refreshing break from the usual sentimental stuff.<br>
      As you're both in the magazine world it fits great. </p>
      <p>For me the second line doesn't sit well, extending wider than the rest it breaks the flow, given that magazine layout is the inspiration the left and right margins should align, this would help reinforce the magazine inspiration.</p>
      <p>Having designed my own wedding invitations, recently, I know how hard it is to finally sign them off.</p>
      <p>A small idea...<br>
      Being in the magazine world hopefully you know some good copywriters, adding a short sharp paragraph at the beginning/end would help balance the layout on the page. It could also give it a more personal feel and show off one of the most underrated skills in the design world, that of good copywriting.</p>
      <p>Congratulations on the big day hope it goes well.<br>
      Martin</p>
      <p>P.S. keep the Mums away from the champagne early on. (I know this from experience!)</p>
