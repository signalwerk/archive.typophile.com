      <p>While I greatly applaud your effort to escape from the traditional wedding invitation with centered formal script, I wonder if you have yet achieved something that communicates a marriage of 2 people.<br>
      For me, what you have done, looks like a cutsheet of rigid old-school magazine ads.<br>
      I think you have to loosen up and be a bit more personal with it--put some love in it. Make it look like a happy union of two people, not an overly tight exercise in spacing and leading.</p>
      <p>Make a break from both tradition and rigidity.</p>
      <p>ChrisL</p>
