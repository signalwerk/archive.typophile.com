      <p>I give you respect for designing your own invitations. I tried and nothing clicked so we opted for another route. </p>
      <p>I do want to mention one thing. To me, the typeface (Miller?) says "newspaper" more than it says "magazine". (Perhaps one of you works for a news magazine?) </p>
      <p>In its current state, I would be very surprised if guests pick up on any nod to the magazine world. Unless Miller is a signature typeface in a publication for which one of you work. It looks most like a font specimen or 19th-century advertising.</p>
      <p>Just a thought.</p>
