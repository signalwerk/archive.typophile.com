    <p><iframe src="http://player.vimeo.com/video/54223456?byline=0&amp;portrait=0&amp;color=c9ff23" width="659" height="371" frameborder="0" webkitallowfullscreen="" mozallowfullscreen="" allowfullscreen=""></iframe></p>
    <p>I’d like to draw your attention to a film project I’m currently raising fund for. Its concept is loosely spun around the design concept for »Antithesis«, my master’s degree typeface from Type]Media in The Hague, 2011|http://typemedia2011.com.</p>
    <p>The project has developed into an interdisciplinary art story.<br>
    I’m about to make a ten minute dance film, in 3D, the concept of which, like Antithesis, revolves around the tension between three unequal poles.</p>
    <p>The perks for the film involve a deal particularly aimed at graphic designers and typophiles: Donation starting at $75 will receive the typeface itself. I’m in the process of finishing a professional version of the typeface and expect to send it out to donators beginning of March.</p>
    <p>Please help in making this fascinating project come true.<br>
    Links:<br>
    Crowd funding campaign on Indiegogo| <a href="https://www.indiegogo.com/antithesis" title="https://www.indiegogo.com/antithesis">https://www.indiegogo.com/antithesis</a><br>
    The project’s home base| <a href="http://antithesis.de" title="http://antithesis.de">http://antithesis.de</a></p>
    <p><img src="http://antithesis.de/wp-content/uploads/TrinityDesktop_Thumbnail.png"></p>
