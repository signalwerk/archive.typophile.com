  html: <p> This may or may not be workable solution to the Team Dynamics idea. <br> <br>Grid Gothic has the potential to be a very useful system. While simple, it's a modular face that can be modified to no end. I use these faces, especially the top one, for basic chores. <br> <br>This particular system calls out a width and height and a stem width. Grid Gothic 991 is made on a 9X9 grid with a stem of 1. It's black value is 81 (9X9/1). (The higher the number, the lighter the face.) <br> <br>GG662 has a value of 18 (6X6/2), GG 733 has a value of 7. You can get darker than 7, but you have to fudge a bit. <br> <br>What I was proposing was that Grid Gothic become a tester or a guinea pig for the Typophile Team Dynamics idea. <br> <br>Everybody, newbies and veterans, can make these faces if they have access to Illustrator. <br> <br>The faces can be brought together into a family. <br> <br>Once you get a basic grid down, you can elaborate. Example No. 4. <br> <br>First, maybe within a week, anyone interested would let the Team Leader know with a post or email and what weights they'd like to attempt. Then the Leader could make the dummy files to work from. (If the grid isn't done right, when it is United, it will leave gaps). <br> <br>I would think that Jared or Joe should Team Leader. I would not want to do it, but I'll contribute these three as a start. <br> <br>I think that Jared or Joe might have some good ideas on what to do with the family once it's finished. (bandwith$) <br> <br>There are some other points to talk about (spacing, etc.) and some things I'm leaving out. <br> <br> If anyone's online now, feel free to discuss. <br> <br>If there's not enough interest, I will keep the concept, though it's on the back burner. <br> <br>bj </p>
  html_clean: <p> This may or may not be workable solution to the Team Dynamics idea. <br> <br>Grid Gothic has the potential to be a very useful system. While simple, it's a modular face that can be modified to no end. I use these faces, especially the top one, for basic chores. <br> <br>This particular system calls out a width and height and a stem width. Grid Gothic 991 is made on a 9X9 grid with a stem of 1. It's black value is 81 (9X9/1). (The higher the number, the lighter the face.) <br> <br>GG662 has a value of 18 (6X6/2), GG 733 has a value of 7. You can get darker than 7, but you have to fudge a bit. <br> <br>What I was proposing was that Grid Gothic become a tester or a guinea pig for the Typophile Team Dynamics idea. <br> <br>Everybody, newbies and veterans, can make these faces if they have access to Illustrator. <br> <br>The faces can be brought together into a family. <br> <br>Once you get a basic grid down, you can elaborate. Example No. 4. <br> <br>First, maybe within a week, anyone interested would let the Team Leader know with a post or email and what weights they'd like to attempt. Then the Leader could make the dummy files to work from. (If the grid isn't done right, when it is United, it will leave gaps). <br> <br>I would think that Jared or Joe should Team Leader. I would not want to do it, but I'll contribute these three as a start. <br> <br>I think that Jared or Joe might have some good ideas on what to do with the family once it's finished. (bandwith$) <br> <br>There are some other points to talk about (spacing, etc.) and some things I'm leaving out. <br> <br> If anyone's online now, feel free to discuss. <br> <br>If there's not enough interest, I will keep the concept, though it's on the back burner. <br> <br>bj </p>
