    html: |-
      <p>The font is Spellbound (Not Spellbound BV by Blue Vinyl).</p>
      <p>It's a WSI font. WSI was a major font ripoff cloning outfit, but this one may have been an original. Over many years, I've never seen it under any other name. Note, though, that because of its dubious parentage, I'd be leery of using it commercially.</p>
