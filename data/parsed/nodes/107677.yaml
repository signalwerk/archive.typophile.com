      <p>Could be <a class="freelinking external" href="http://typophile.com/node/66618#comment-533925" rel="nofollow">Combat</a>, bespoke typeface exclusive for Nike, some kind of stencil version of <a class="freelinking external" href="http://www.myfonts.com/fonts/processtype/stratum2" rel="nofollow">Stratum 2</a>.<br>
      Ready-to-go alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/gautier/amiral" rel="nofollow">Amiral 205</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/suitcase/vafle" rel="nofollow">Vafle</a> Stencil<br>
      To-be-"stencil(iz)ed": <a class="freelinking external" href="http://www.myfonts.com/fonts/hold-fast-foundry/industry" rel="nofollow">Industry HFF</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/quarca" rel="nofollow">Quarca Insigne</a></p>
