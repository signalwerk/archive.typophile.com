    html: <p>"as the current crop of tricked-out OT latin-based fonts only has two members to choose from" <br> <br>Um, you are completely wrong about that. <a href="http://www.houseindustries.com">House</a> has been producing (and promoting) OpenType fonts since 2001 -- essentially all of our fonts since the Las Vegas Font Collection have been shipped in OpenType format. The features in these fonts have become increasingly complex over the <a href="http://houseind.com/house.php?kit=SIMIAN-FO&amp;sub=features">last</a> <a href="http://houseind.com/house.php?kit=NEUTRAFACE-FO&amp;sub=features">three</a> <a href="http://houseind.com/house.php?kit=SHAG-FO&amp;sub=features">years</a>. Our <a href="http://houseind.com/house.php?kit=EDFONT-FO">most recent release</a> features <a href="http://houseind.com/house.php?kit=EDFONT-FO&amp;sub=lettersetter">a font</a> that contains 1,384 ligatures that are <a href="http://ls.houseind.com:8089/cgi-python/ltrstr/code/LetterSetterImager/house?text=AN%20IM%20ATI%20ON&amp;font=edinterlock">intelligently</a> <a href="http://ls.houseind.com:8089/cgi-python/ltrstr/code/LetterSetterImager/house?text=ANIMATION&amp;font=edinterlock">placed</a> via a complex range of contextual rules. I think this qualifies it as a "tricked-out OT latin-based font." Considering this, I've found the recent claims of <a href="http://www.typophile.com/forums/messages/30/55691.html?1103066486">"my feature is bigger than your feature"</a> to be quite amusing, yet sadly pointless and misinformed. <br> <br>Sorry to hijack this thread, but I felt compelled to clarify. <br> <br>You may now return to your comments about <a href="http://houseind.com/house.php?page=contact">us</a> being washed up.</p>
