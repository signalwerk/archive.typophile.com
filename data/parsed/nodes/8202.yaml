  html: <p>There have been a lot of very nice typefaces released in the past couple of years and it seems like the number of grunge/badly drawn typefaces is waning. <br> <br>Has this been influenced by the design market wanting different/better products? Is it related to changing styles? Do you think that the digital fontmaking craze that Macs/PCs/fontographer brought about is over? <br> <br>It seems to me there is still experimentation going on but it has shifted from "How illegible can we make this?" to making more technically enhanced and feature-packed fonts. <br> <br>I'd like to hear what everyone thinks. Hopefully this topic isn't too outdated yet.</p>
