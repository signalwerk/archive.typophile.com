      <p><code>lookup curs {<br>
        lookupflag 0;<br>
          pos cursive \a &lt; anchor 21 13&gt; &lt; anchor 413 161&gt;;<br>
          pos cursive \t &lt; anchor 2 -24&gt; &lt; anchor 338 217&gt;;<br>
      } curs;</code><br>
      and in FireFox:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Font2_4208.jpg"></div><p></p>
