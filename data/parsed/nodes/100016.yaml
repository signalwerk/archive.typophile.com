  html: |-
    <p>To create a connecting script, for Latin use,<br>
    I was searching to get the 'Cursive attachment' working on a script that is written from left to right.</p>
    <p>Any chances I get this to work in Latin text?<br>
    or any other technique to connect glyphs together with anchors?<br>
    If someone can reference to an example, it would make understanding of 'feature curs' easier</p>
    <p>On the OpenType Feature File Specification<br>
    <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#6.c" rel="nofollow">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#6.c</a><br>
    it is not mentioned it is only possible with right to left scripts.<br>
    But on other sources, there is stated it doesn't work with left to right, like<br>
    <a class="freelinking external" href="http://glyphsapp.com/blog/arabic" rel="nofollow">http://glyphsapp.com/blog/arabic</a></p>
    <p>Ps, is it required to work with .init and .fina if I want to work with 'curs'?<br>
    Most times it is done so…</p>
