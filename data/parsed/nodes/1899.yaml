    date_raw: 31.Oct.2003 10.29am
    votes: null
    html: <p>Any chance of seeing the corporate logo that this would be used with?  <br> <br>One thought is that sometimes you don't want a typeface that looks *similar* to the logotype, because if it's obviously not the same it makes it look as if you just couldn't match it. If you think sans serif is still what you want, then pick a sans style that doesn't resemble your logo. <br>That's my two cents.</p>
