    html: "<p>That's exactly my two cents* too, Mike. Well observed. <br> <br>* Well, actually my two eurocents are worth  <br>2.31350 dollarcents, but let's not get nitpicky here. <br><img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>P.S. Neutraface Text works wonderfully well: I'm  <br>currently setting a congress book in Neutraface  <br>and Aurora, and the fun part is when you start  <br>combining NeutraText Book (Avenir-mode) with  <br>NeutraText Alt Bold (Futura-mode). Brilliant stuff. <br> <br>But Grant I must agree that Paralucent is a beauty  <br>(though a bit pricey).</p>"
