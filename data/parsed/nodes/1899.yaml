  html: <p>Can anyone recommend a text typeface (Mac &amp;PC) which will be used alongside a coroprate logo. The logo is a bit futura / 20's deco inspired. Futura itself is no good as it looks awful when loads of copy is set. Any thoughts anyone? <br> <br>Thanks a lot <br> <br>Ged</p>
