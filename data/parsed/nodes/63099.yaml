      <p>Finding the Japanese equivalent of Courier is the interesting bit. Courier is used for many reasons. Sometimes, it is used to evoke the output of typewriters. Sometimes, it is used mainly because it is a monospaced font, especially to display code.</p>
      <p>Now, because most Japanese typefaces are monospaced anyway when it comes to the kana and the kanji, it's tricky to decide what to use for the translation when in the original Courier was used only because it is a monospaced font.</p>
      <p>I might be wrong, but I have the feeling that in Japan the Courier rough equivalent is probably the monolinear, rounded ナール(Nar). It's visually distinct from the Mincho or Gothic styles, and is quite widely used. I'm having trouble finding any information on it in English, though. Here's the Japanese Wikipedia page: <a href="http://ja.wikipedia.org/wiki/ナール" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://ja.wikipedia.org/wiki/ナール</a></p>
