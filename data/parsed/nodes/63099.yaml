    <p>Hi,</p>
    <p>I've been tasked to find typefaces for a Japanese translation of an English book. In the English book, 3 typefaces are used:</p>
    <p>Univers (Title, Body copy)<br>
    Sabon (Subtitles)<br>
    Courier (Callouts)</p>
    <p>I need to find Japanese equivalents or substitutions for these typefaces.</p>
    <p>Does anyone have suggestions on good Japanese typefaces or ways to go about finding the optimal Japanese substitutions?</p>
    <p>Thanks!</p>
