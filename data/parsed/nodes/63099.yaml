    html: |-
      <p>It's hard to say the equivalents without seeing the design you try to make, but,</p>
      <p>If you need to set Japanese font and Univers together in the same page, I recommend you use AXIS Font from <a href="http://www.typeproject.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Type Project</a>. AXIS Font covers wide range weights and has smart skeleton, each weight style of which was developed along with the one of Linotype Univers. Axis trial fonts are available to use from <a href="http://www.typeproject.com/trial/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>. The trial version font has only Regular weight and the limitation that Kanji have about 1000 characters only, but all Hiragana and Katakana characters are included, so you can check the looking of it before buying it. Of course, the retail version of AXIS Fonts have all Kanji characters (Adobe-Japan1-3).</p>
      <p>The retail site is <a href="http://www.axisfont.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>.<br>
      This site is only Japanese language, but the customer support via Contact will answer your request in English.</p>
      <p>Apple Japan uses AXIS fonts on its web site. You can also browse them <a href="http://www.apple.com/jp/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>.</p>
      <p>Sabon goes well with Mincho style. Kozuka Mincho from Adobe might be good for Sabon. And Kozuka and AXIS, both Kanas of these have similar skeleton, I think these work well together. Kozuka family has Gothic style but it has tiny serifs on the end of strokes, so I recommend AXIS for Gothic style. </p>
      <p>Unfortunately, almost of Japanese foundry don't support the order from overseas. However, Linotype deals with <a href="http://www.linotype.com/289648/typebank-library.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Typebank family</a>, it would be helpful for you to get Japanese fonts quickly. Typebank Gothic and Mincho would be useful to combine with Univers and Sabon.</p>
      <p>Which Courier, rounded or edged? Its hard to find the an equivalent of Courier. I can say rounded san-serif might be better, but Gothic would be also no problem for it.</p>
      <p>M+ 1m might be good for it, but it seems to be in progress now, so it doesn't have enough Kanji characters to set Japanese texts.</p>
      <p>I hope it would be helpful for you.</p>
      <p>Best regards.</p>
      <p>Kunihiko Okano Shotype.com</p>
