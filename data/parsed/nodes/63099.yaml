    html: <p>I would browse the fonts at the Morisawa or Iwata websites. Your body font (the Univers equivalent) will probably be a basic Gothic of some kind. For the other two, you'll want to choose whatever fits the character of the book. Don't constrain yourself too closely to matching Sabon or (ugh) Courier.</p>
