      <p>I'm not a Japanese expert but in my humble opinion, it's hard to call any fonts with Japanese support equivalents to Latin designs because of the writing style differences. </p>
      <p>Having said that, I would suggest a gothic style for Univers and a Mincho style for a serif or Sabon.</p>
      <p>You can get an idea of the styles available here:<br>
      <a href="http://www.ascenderfonts.com/category/japanese-fonts.aspx" title="http://www.ascenderfonts.com/category/japanese-fonts.aspx">http://www.ascenderfonts.com/category/japanese-fonts.aspx</a></p>
