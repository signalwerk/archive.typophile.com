    html: |-
      <p>I agree -- nice job. Few things: 1) Trajan is a bit overused, although it works well enough here (unless this is a different Trajan than Adobe's). I don't have any suggestions for a particular reason, but it seems to me that something with tension in it's letterforms might be good: <a href="http://www.myfonts.com/fonts/fontfont/ff-legato" rel="nofollow">FF Legato</a>, <a href="http://www.myfonts.com/fonts/fontfont/ff-avance" rel="nofollow">FF Avance</a>, <a href="http://www.myfonts.com/fonts/storm/sebastian" rel="nofollow">Sebastian</a>, and <a href="http://www.myfonts.com/fonts/fontbureau/prensa" rel="nofollow">Prensa</a>. EDIT: <a href="http://www.typography.net/type/shaker.htm" rel="nofollow">Shaker</a> and <a href="http://www.typography.net/type/enigma.htm" rel="nofollow">Enigma</a> go here too.</p>
      <p>2) The S is too loose, and I'd kern a bit tighter between the Y and L.</p>
      <p>3) I like that you didn't track the "aviation and training" to the full width of "SkyLark," but I find it distracting that it lines up so neatly to the end of the R. I'd either line it up with the end of "SkyLark" or make it end somewhere in the middle of a letter.</p>
    html_clean: |-
