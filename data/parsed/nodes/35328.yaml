    html: |-
      <p>I'm with Eben on this. My eyes seem conflicted. I want to look at the word mark, but the bird is beautiful and pulls my eyes up away from the word mark. Then the shadow is clever, but ultimately is the biggest distraction because it's so out of focus and light, my eyes fight to focus on it more.<br>
      and the "aviation and training feel tacked on, running into the shadow.</p>
      <p>The elements of the logo are strong, you have a great stepping stone, but it's needs refined so the parts work in unison. You have a lot of artistic elements, which maybe be "over flavoring" the work.</p>
      <p>Also, I tend to agree with Tim in the refinement of the stylized illustration. If your image was more "realistic" in nature, I wouldn't argue, but since the image has been striped down to the bare essentials to infer a skylark, precision takes precedence.</p>
      <p>You're very close, it's an excellent design and you should strive to make it as perfect as possible.</p>
