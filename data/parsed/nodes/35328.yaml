    html: |-
      <p>In the process of stylising you have created an illustration, and you should be aware that I and any other audience will not have the benefit of a photograph, the left wing is clearly not a pair to the right wing and the wings are not at a right angle to the body. Unfortunately photographs are not real life, they suffer from all kinds of distortions and this is a further distortion – it is an accepted technique to work from photographs but there comes a time when you have to view it as a stylised illustration and as such it is no longer a genuine representation, it needn’t be a huge job to alter I would suggest you try it. By the way, skylark is one word and doesn’t need the L capitalised.</p>
      <p>Tim</p>
