      <p>Sii, thanks for your comments. I admit I am at the beginning of considering all of this but I’m sorry if you have the impression I’m incapable of making this work or that I would be as unopen and unresponsive to critique and advice as the people on that show. I am relatively successful in a closely related field and I am not receiving hand outs so I would have to work hard.</p>
      <p>What I would be offering is an collective Australian voice, I have some material lined up and some designers ready to participate. I think Australian type design needs a representative as none currently (of any great virtue) currently exist. Large advances in royalties may lure designers but I’m unable to tell if this would be possible financial, or would in fact be sensible.</p>
      <p>Mk2, it would definitely be a collective, I currently have no type designs worth licensing. I don’t know what my plan is as yet, nor do I know whether I really want to proceed and put in all the effort this is going to take to make successful.</p>
