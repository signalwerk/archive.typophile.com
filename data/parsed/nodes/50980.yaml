      <p>In reading this post I can’t help but think of countless episodes of “Kitchen Nightmares” where someone, successful in another field, or blessed with an inheritance or rich parents, decides to open a restaurant, despite having no experience in the trade. As you can imagine it all goes horribly wrong – and it’s not just the food that ends up getting burnt. </p>
      <p>Putting this image aside for a bit, my other thought is what’s your value proposition? What can you offer that established, proven foundries can’t? What will convince type designers to throw their hat in with your new company? Perhaps it’s as simple as offering large advances on royalties?</p>
