      <p><em>This made me laugh out loud. Will that $20 cover your shopping cart, your payment gateway or your merchant services fees?</em></p>
      <p>In the beginning, it is certainly possible to sell typefaces using very little cash, particularly if you are using a service like PayPal to process your transactions. Because the service handles just about every part of the transaction, then things like a merchant account, payment gateway or SSL certificate are unnecessary. The processor takes care of that for you. Money that might be spent on those items comes directly out of your sales in the form of a percent to the payment processor. And, if you know how to wrangle a little code, you can easily set up a shopping cart yourself. </p>
      <p>This can be a great way to start (and is in fact how we started) so you have very little cash investment up front. The only time you pay for services related to taking in money is when, in fact, you take in money.</p>
      <p>Not so funny now, eh?</p>
