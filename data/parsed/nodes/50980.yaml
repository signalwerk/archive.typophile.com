      <p>David, I should add that there isn’t a lot of money in retail fonts unless you are a large vendor like Fonts.com, Myfonts, Ascender Corp or Veer, with sizable collections of trendy commercial fonts from numerous sources. Some font buyers grumble about the price of retail fonts, but in reality vendors sell them at an absurdly low price and still have trouble turning in the kind of sizable revenue required to sustain a going business. Small vendors usually are not successful and rapidly go out of business.</p>
      <p>The real money in type design is in commissioned works</p>
      <p>j a m e s</p>
