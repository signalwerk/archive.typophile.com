      <p>I’m not sure how quickly you want to grow, but I don’t think you need a lot of money to start a foundry, just time. For $20 a month or so, you can host a site that will allow more traffic than you will ever get. Maybe a few hundred or thousand dollars extra for ads here and there, but I don’t think you need the level of capital that would require getting investors or bank loans or anything (and good luck making that happen for the next year or two!) </p>
      <p>If your typefaces are really good, there’s plenty of small foundry pools out there like vllg.com and Type Trust that might publish your fonts, and they give full credit to your foundry. Even “big time” places like Veer give complete credit to the designer and/or foundry. Once you get a few type designs published, you could think more about developing your own foundry into a go-to shop. But when you have only a few fonts under your belt it would make more sense to me to put them out there on established sites as your primary point of sales. You might take a look at Underware.nl as a case study, they only have a few fonts for sale, but each one is really unique and has an incredible level of thought and skill apparent in its design. They sell their fonts on other sites, too.</p>
      <p>Hope that helps, I would like to start a foundry myself, too, but I plan on taking it slow. If you want something that’s quickly profitable, typeface design is not the route to go — not as difficult as saying “I’m going to be a rock star” with no musical training and never being in a band or performing in front of an audience, but it’s close.</p>
