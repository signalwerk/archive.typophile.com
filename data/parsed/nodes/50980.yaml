    <p>Hey everyone,</p>
    <p>I’m not sure how many people here have experience with this side of the type design scene but I’m considering establish a foundry. I can get my hands on some good capital but the issue of a skill base is the most pressing. I myself am not skilled enough to take designs from type and graphic designers in half or almost finished states and turn them into desirable commercial typefaces. I am however, confident in my business capabilities as well as my ability to curate the collection wisely. I have never worked at a type foundry but I am a budding type designer and my background is in graphic design.</p>
    <p>Does anyone have any advice for me about aspects to keep an eye out for or put heavy consideration into? I would not be planning that this consume 100% of my time because I still want to design type and be a graphic designer but I can dedicate a good amount of time to the initial rollout and sustaining the company.</p>
    <p>Cheers,<br>
    Dave</p>
