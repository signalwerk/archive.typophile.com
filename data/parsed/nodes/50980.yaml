      <p>I would ask yourself, what right do the fonts I am going to publish have to exist?<br>
      What kind of typefaces will they be?<br>
      Is there an existing or emergent market for them?<br>
      Do they express something that caters to or can create its own niche in the marketplace?<br>
      I don’t believe that the people who are making a go of this set out to “run a foundry”, they decided to design, make, and publish certain kinds of typefaces.<br>
      So that’s what should be at the centre of your business plan.<br>
      The way it stands at the moment, your business model could be applied to just about anything.</p>
