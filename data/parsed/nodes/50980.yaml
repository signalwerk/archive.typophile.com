      <p>Hi David. It’s encouraging to see an Australian announce an interest in starting up this kind of outfit. An Australian collective would be unique and have the potential to improve the situation in our country.</p>
      <p>As an Australian type designer I am underrepresented. I support your idea in theory. In practice I make mainly strange, unconventional, original types not based closely on existing type designs, and these kinds of faces don’t sell in appreciable numbers. I’d gladly offer them to you for your collective, but would it be worth your while trying to market them? Somehow I don’t think so. Plus I have my own highly-developed indie type house marketing, brand / branding and branding communications strategy already worked out.</p>
      <p>On the positive side I have started making commercial text and display fonts which need better marketing / distribution. If that material would be of interest you may certainly contact me offline.</p>
      <p>j a m e s</p>
