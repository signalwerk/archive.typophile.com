    <p>hello<br>
    this is my eeemm typeface called " the great i.t.",<br>
    because it is derived from a logo i made for the world famous<br>
    electronic music group. i.e., a friends project. this logo is attached, as well.</p>
    <p>the forms are very simple,and very thin,<br>
    so it is like the basic idea and form half finished:<br>
    uppercase letters have an exoskeleton, lowercase letters a endoskeleton,...</p>
    <p>i hope for input, i need to hear what you typophiles think about my great i.t.<br>
    i am prepared for all kind of support,<br>
    and rotten tomatoes, as well.</p>
