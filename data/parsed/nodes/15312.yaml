    html: |-
      <p>David,<br>
      I think you have to decide between making all the glyphs the same width or the same stem width.  The E look very wide and the V and W look tiny and lost. You might want to limit diagonals to one or 2 angles.  You might also use 2 different line weights, one to define the left side and one to define the right.  This may not work either.  I am just trying to figure a way for glyphs to differentiate more.<br>
      You have tried a very tough problem but when you solve it, the result will look quite simple.  Keep at it.  Perhaps try some unusual grids to base it on.<br>
      I think Tiff is right about the triangles.  They were helpful in differentiating glyphs as well as giving it a very unique look.</p>
      <p>ChrisL</p>
