    <p>Hello everybody, </p>
    <p>This is my first post here. Can you feel the electricity? I can. </p>
    <p>I recently became interested in the typeface used in the first edition of Moby Dick (which, since it was the British version, was just called “The Whale”). I found some scans online of the <a class="freelinking-external" href="http://historical.ha.com/common/view_item.php?Sale_No=683&amp;Lot_No=57563&amp;type=&amp;ic=">title pages here</a> (nice, large images). Also see the smaller image I’ve posted. </p>
    <p></p><div class="imageWrap"><img src="/files/leviathan_4242.jpg"></div><p></p>
    <p>This typeface is remarkably like Century. I’d ID it as such, except Century was designed around 1900 by Moris Fuller Benton at ATF, and this face was in use fifty years earlier. </p>
    <p>Any sage wisdom on this would be much appreciated. Thanks!</p>
