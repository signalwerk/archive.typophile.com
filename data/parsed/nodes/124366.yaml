    <p><img src="/sites/default/files/old-images/MrBollywood-LOGO-Light-01_6408.jpg"></p>
    <p>Dear sir or ma'am:</p>
    <p>Thank you for your time and I am humbled by the many creative and graphical artists on the Typophile forum. I am seeking your expertise on kerning advice on the font in the embedded logo for my personal photography project. The colors are inspired from the actual flag of India. I found the Pantone colors that appears on the actual Indian flag.</p>
    <p>The colors on the Indian flag are (top to bottom): Saffron, White (Cool Grey), Navy Blue, and India Green. I started with Saffron and alternated the sequence to color the individual letters in "MR. BOLLYWOOD." My question pertains to kerning. The actual Hindi Devanagari look like this: <img src="/sites/default/files/old-images/sam_5083.png">. It's taken from the Linotype website. The font I used in "MR. BOLLYWOOD" is Sansara from the Linotype foundry. You can see that the actual Devanagari script appear interconnected. That's what I tried with the first four words "MR." and "BO."</p>
    <p>Do you think it's a better design-wise, if I continue the pattern with the remaining letters?</p>
    <p>If you would like to download the .AI (CS6) and play, you're more than welcomed to. I uploaded to my guest directory: <a href="http://guest.ronaldnztan.com/MrBollywood-LOGO-Light.zip" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://guest.ronaldnztan.com/MrBollywood-LOGO-Light.zip</a>. It's changed into outlines via the "Create Outlines" command.</p>
    <p>I look forward to hearing back from you. I appreciate the help and suggestions on improvement.</p>
    <p>Ron</p>
