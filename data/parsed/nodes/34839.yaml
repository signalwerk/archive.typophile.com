      <p>Christian Schwartz has actually done a version of Amplitude without the extreme trapping for use in newspaper headlines. You can find examples at his site: <a href="http://www.christianschwartz.com/amphead.shtml" target="new" rel="nofollow">http://www.christianschwartz.com/amphead.shtml</a>. The fonts are available through the Font Bureau Studio Library.</p>
      <p>It sounds like you're looking for a sans serif design. But if you're open to considering a serif face, you might also look at the Whitman Display series, which was originally designed for newspaper commissions. It is currently used by the <a href="http://www.newseum.org/todaysfrontpages/hr.asp?fpVname=MN_ST&amp;ref_pge=lst" target="new" rel="nofollow"><cite>Minneapolis Star Tribune,</cite></a> the <a href="http://www.newseum.org/todaysfrontpages/hr.asp?fpVname=WA_NT&amp;ref_pge=lst" target="new" rel="nofollow"><cite>Tacoma News Tribune,</cite></a> and the <cite>Idaho Statesman.</cite></p>
      <p>The family has been recently expanded to 7 weights in 3 widths. I posted a few previews in <a href="http://typophile.com/node/33419" target="new" rel="nofollow">this other thread</a> on a magazine redesign. The fonts are not available in Retail release just yet (we're working on it). But you can contact the <a href="http://www.fontbureau.com" target="new" rel="nofollow">Font Bureau</a> for licensing through their Studio Library.</p>
      <p>-- K.</p>
