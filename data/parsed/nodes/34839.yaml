      <p>Thank you for suggestions! </p>
      <p>And yes, I'm looking for a sans serif headline. The newspaper in question has used only serif headlines so far and they want to take a little distance to their oldish, conservative image.</p>
      <p>kentlew: Beautiful, Amplitude Headline is pretty much just what I'm looking for...! It has edge, but not too much. Its rectangular and round forms make a nice dynamic contrast. It's definitely contemporary, but you can imagine it doesn't get dated too soon. Thanks!</p>
      <p>kuroneko: Mercury and Whitney condensed is nice, only thing that bugs me with Whitney is that its angular cut ends have a little too much personality to my taste. Especially words with k's (we have a lot of them in Finnish) tend to look jumpy and unbalanced.</p>
      <p>If anyone else has suggestions of headlines with similarity to Whitney Condensed and Amplitude Headline, I'd love to hear them.</p>
      <p>BTW: I'm also redesigning their logo, so I can modify its forms based on typographic choices I make.</p>
