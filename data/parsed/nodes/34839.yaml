      <p>Jussi, I’m helping to redesign a local newspaper here in Glendale (circulation 13k, daily, tabloid, established in 1908) and I’m making the fonts for them.  :-)</p>
      <p>The choices above are very good; some of them I personally like very much. If you'd like to explore the possibility of custom type please get in touch: hpapazian_at_gmail_dot_com. Especially if you go easy on the exclusivity* the costs might be much more reasonable than you suspect.</p>
      <p>* Usually one limits the timeframe, but a clever possibility here would be limiting it to exclusivity for publications in Finland, or Finnish-language newspapers worldwide, etc.</p>
      <p>hhp</p>
