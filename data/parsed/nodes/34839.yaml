      <p>I'll suggest <a href="http://www.typography.net/type/shaker.htm" rel="nofollow">Shaker</a> from Jeremy Tankard. I recently bought it for my newspaper's redesign as a caption/sidebar font. I have to say that I'm not 100% pleased with how it mixes with Farnham and Merucry, the other typefaces (I think the difference in x-height between them irritates me), but I really liked it when I tried it in headlines as a demo. The italic is especially nice, IMO; I used it for a temporary nameplate while our final one was in the works.</p>
      <p>Since you said no serifs, I'll interpret that as not including slab-serifs and point out a few modern ones: <a href="http://fontbureau.com/fonts/Dispatch" rel="nofollow">Dispatch</a> (and its sans, <a href="http://fontbureau.com/fonts/Stainless" rel="nofollow">Stainless</a>), <a href="http://www.linotype.com/3273/soho.html" rel="nofollow">Soho</a>, and <a href="http://terminaldesign.com/fonts/sets/?CID=6" rel="nofollow">Enclave</a>.</p>
