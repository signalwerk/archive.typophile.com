    <p>Hi,</p>
    <p>I'm redesigning a local newspaper here in Finland (circulation 8k, twice a week, tabloid, established in 19th century) and I'm searching for a headline font. My favorites so far are <a class="freelinking external" href="http://www.typography.com/catalog/whitneycondensed/index.html" rel="nofollow">Whitney condensed</a> and <a class="freelinking external" href="http://www.fontshop.com/search/?q=amplitude" rel="nofollow">Amplitude</a>, although its big ink traps bother me. </p>
    <p>Properties for headline font are "humane" and "contemporary", but because this is a newspaper with long history and traditional image, it shouldn't be TOO contemporary... you know the story. Condensed version would be nice. </p>
    <p>If you have any further suggestions, I'd love to hear them. Thanks in advance.</p>
    <p>(for body text I've thought of Mercury Text, but that's only if I manage to convince paper to give up their Utopia...)</p>
