    <p>Hello Everyone,</p>
    <p>I'm new at Typophile, this is my first post, so please excuse me if I'm writing this into the wrong topic, if an admin will change this and put it into the right place, I will be glad.</p>
    <p>Anyway: my problem is, that I just want to create a font (I made every glyphs in Illustrator) which is a normal outline font, but it is specialized for the size of 13 pixels on 72DPI (yes, this font is basicaly designed for screen purpose).</p>
    <p>I have Fontographer, because I have Lion on my Mac, and because I'm new to font creating. So what I want is, to import all my AI glyphs into my FOG file. The first thing I don't know, is how to calculate UPM size, to be best fitting for my needs. I read a lot of opinions, that UPM does not matter, some said, that this is count when the computer will scale it: I can't decide what is true, and why..</p>
    <p>The next thing is when I import as EPS or paste them as AI outlines, they are going to have different sizes ("a" has the same height as "b", etc.) My problem is, I really don't know how to add specific sizes to outline, because on the Outline window the only tool I have is Scale tool, which can only be defined by percentages and not by em units, or pt-s. How to do this? Or I have to set my Illustrator canvas in a different way? I did not find any tutorial or help on Google, Vimeo and Youtube. And the FOG manual did not say anything about this either.</p>
    <p>Oh, I almost forget, here are the details I want:<br>
    While my font is set to 13pt:</p>
    <p>Ascender: 13px<br>
    Caps Height: 10px<br>
    X-Height: 7px<br>
    Baseline: 0px<br>
    Descender: -3px</p>
    <p>has to be on the screen.<br>
    Which means from Ascender to Descender is 16px (because characters like: ÉÁŰÚŐÓÍ — Capitals with accents will be larger than the common 13px)</p>
    <p>Any help will be appreciated, or any link will help me.</p>
    <p>Thank You very much! And sorry for my bad english..</p>
