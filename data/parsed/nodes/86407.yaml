      <p>&gt; I wonder where that convention of 8 point comes from</p>
      <p>I'm not sure, but I think some of the very early popular<br>
      pixelfonts were 8 pt, and when designers found themselves<br>
      trying to explain to users ("Me, read the README?!" :-)<br>
      how to make the rendering crisp they figured to just use<br>
      8pt for everything. I might've chosen 10, but it's too late,<br>
      plus one nice thing about 8 is that you can handle Ems that<br>
      are a power of 2 in addition to the legacy 1000.</p>
      <p>Em of 1000: Peter didn't specify TT, and just to be<br>
      safe I recommend 1000, since in TT the worst that<br>
      can happen is a very small loss of performance, while<br>
      in PS it can cause a... total loss of performance!  :-)</p>
      <p>hhp</p>
