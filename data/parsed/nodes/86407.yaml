      <p>Peter, glad to hear it worked out. I don't use Illustrator for glyph drawing, but it's good to know there's a way.</p>
      <p><em>Question: When somebody else wants to use your font, how will they know to set it at 16?</em></p>
      <p>I wonder where that convention of 8 point comes from, has it got something to do with the way points are related to pixels at screen resolutions?</p>
      <p><em>Also: An Em of anything other than 1000 will cause problems in some older systems.</em></p>
      <p>Not if you generate the fonts as TrueType :) Hrant, you certainly know this but for Peter: powers of 2 like 2¹⁰ (= 1024) were commonly used for TrueType fonts because the grid can be divided by two more easily/often (for machines).</p>
