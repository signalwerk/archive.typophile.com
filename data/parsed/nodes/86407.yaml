      <p>Use a UPM size that can be divided by 16 (your font height in pixels), for instance 1024. Then one pixel would correspond to 64 font units.</p>
      <p>But you would need to set the font at a size of 16 px, not 13, because the nominal font size is the measure from ascender to descender.</p>
