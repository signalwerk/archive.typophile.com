      <p>The classical problem is people might not know what point size<br>
      to use to make the pixels "click". This is why there's a point<br>
      size convention irrespective of how many pixels tall the design<br>
      actually is; and for various reasons that convention is 8 point.</p>
      <p>Which means you:<br>
      - Use an Em of 1000 (the legacy standard).<br>
      - Use a grid of 125.<br>
      - Let the pixels freely go outside the Em bounds.</p>
      <p>And when you use the font, you have to make sure no anti-aliasing<br>
      is being performed. And you can use multiples of 125 for tracking.</p>
      <p>hhp</p>
