    html: |-
      <p>Thanks for the helps, again. It just turned out Jens solution is working perfectly.</p>
      <p>After few days of desperatly trying pasting Illustrator outlines to FOG, I finally have the solution. I share with you, because I guess a lot of newbies, have this same problem, and  can not find any answer on the internet. So here we go:</p>
      <p>1.) Create all the glyphs in one file in Illustrator on different layers. This is for the ease, because now you can select every outline from one single file, by hiding or showing the layers.</p>
      <p>2.) Create a new layer, and draw two lines on it, the first will be the Ascender and the second will be the Descender. You don't need other lines. Place them to the coordinates you wanted them to be.</p>
      <p>3.) Select one glyph plus the A and D lines, and press CMD+C (or Ctrl+C) to copy them.</p>
      <p>4.) Select one glyph-place in FOG and open the Outline window. Now paste it. You will see that the ascender line, and the descender line is in its right place, and therefore your glyph too.</p>
      <p>5.) Delete the A and D lines, you don't need them any more.</p>
      <p>6.) Repeat these steps with all your outlines from Illustrator.</p>
      <p>I hope this will be helpful. I now really enjoying spaceing, kerning, and things like that in FOG.</p>
      <p>P</p>
