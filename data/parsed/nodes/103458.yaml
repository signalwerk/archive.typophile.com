      <p>I knew I'd come across this recently. This comes from <cite>The Making of Garamond Premier</cite> by Robert Slimbach: </p><div class="imageWrap"><img src="http://typophile.com/files/Garamond_4553.jpg"></div><br>
      Slimbach writes: <p></p>
      <blockquote><p>...the lowercase letters of Granjon's <cite>Petit Texte</cite> size are significantly wider and more upright than his more stylish text size italics. By opening the lowercase counters and decreasing the italic angle, Granjon was able to improve legibility significantly.</p></blockquote>
