      <p>Hrant: <em>You don't mean that a customer will specify an Italic angle variance, do you?</em></p>
      <p>Not exactly. Consider that some sizes of a type might only exist because a particular customer requested them and paid for their manufacture. So while it is unlikely to be a case of a customer specifying a variance in the italic angle, it could be a case of a particular customer having requested an italic style of a particular slant for the size they needed, and then that being incorporated into the family <em>despite the italic angle variance.</em> These things happen.</p>
      <p>With regard to technical constraints, consider the possibility that the casting equipment might have a horizontal aperture limit, meaning that as italic type gets taller it needs to be steeper in order for the widest letters to fit within the manufacturing width limit.</p>
      <p>I don't know if either of these possibilities is the case: one would need access to the company archives in order to determine the reason for the variance.</p>
