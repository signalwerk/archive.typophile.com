    html: "<p>Whether one varies the italic angle at all, or in which manner one varies it, must depend on the individual design and what your intentions are, especially at the smaller sizes: is one trying to emphasise the 'italicness' of the letters by slanting them more, or is one trying to improve the legitibility of the letters by making them more open and less compressed and hence slanting them less? One can easily conceive, surely, that a sloped roman type of italic would benefit from more slanting at smaller sizes, while a highly cursive design might benefit from less slanting at smaller sizes. At display sizes, everything is pretty much a matter of style and aesthetics.</p>"
