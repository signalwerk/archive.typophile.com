    <p>I was sent a scan of the typeface Mediaeval-Kursiv from a 1930s Genzsch &amp; Heyse specimen book, and noticed something interesting: up to the 20 point size the Italic angle is about 24 degrees, but the 28 point Italic (the largest shown) is about 18 degrees.</p>
    <p>I can see how that can make sense, and I'm wondering if there are other such cases.</p>
    <p>hhp</p>
