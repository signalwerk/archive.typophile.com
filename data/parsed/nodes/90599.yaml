    <p>Chinese typography 101 please!</p>
    <p>I am working on a bilingual document at work, Mandarin (simplified) &amp; English. I am acutely conscious of my complete lack of sensibility. In the short time I have available on the project I would like to begin to address this and hopefully gain a little understanding along the way.</p>
    <p>Maybe what I need breaks down into two categories:</p>
    <p>• General rules for typesetting - for equivalent example in Latin: No orphans<br>
    • Strong editorial style - perhaps there are some Chinese design blogs out there…</p>
    <p>Thank you all</p>
