      <p>Chapter 7, <em>Typography</em>, of my latest book entitled <a class="freelinking external" href="http://oreil.ly/CJKV2E" rel="nofollow"><em>CJK Information Processing</em></a> (Second Edition), covers much of what you need. In general, Chinese typsetting is a subset of the features required for Japanese typesetting. There are no spaces, so windows and orphans are handled on a per-character basis, meaning that some characters are prohibited from ending lines, and some are prohibited from beginning lines. Horizontal writing is preferred in China, so you shouldn't need to deal with the additional intricacies of vertical writing.</p>
      <p>-- Ken</p>
