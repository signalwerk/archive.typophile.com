    html: |-
      <p></p><div class="imageWrap"><img src="system/files?file=bummer.gif"></div><p></p>
      <p>Well, haven’t participated in previous battles but this one interested me and I decided to do a proof of concept … My approach was far more minimal than most of what was presented so far in that I wanted to accomplish a script ‘feeling’ with the least amount of modification to the face so if they were presented in tandem folks would know one was the script and one was the base weight …</p>
      <p>The other thing I noticed as with other script faces I’ve developed is that not EVERYTHING needs to connect in order for it to be a script style. This is certianly true of trying to make the Hobo CAPS connect where there isn’t a natural ‘tail’ …</p>
      <p>Beyond that, things like the ‘er’ combination I felt had nice flow so what would be gained with a formal connection between them? Functionally the idea of a script in my mind is to present a comfortable eye flow rather make everything touch … </p>
      <p>Not the most exciting submission but I feel it appropriately accomplishes the challenge …</p>
      <p>Best,<br>
      Stuart :D</p>
    html_clean: |-
