    html: <p>The job title Mr Zimmer is asking about has always been and continues to be Assistant Art Director. <br> <br>Everyone knows the Senior Art Director can't really DO anything. So making sure everything is just so has always fallen into the Assitant AD's lap.  It is a curious phenomenon that once an Assistant AD gets promoted to Senior Art Director, they forget how to do everything, and become just as useless as the previous Senior AD.</p>
