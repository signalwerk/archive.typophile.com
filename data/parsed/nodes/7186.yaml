    html: "<p>Hey, Zimmer. I'd take Spiekermann's advice, 'cause then you can always say \"Well, that's what Erik Spiekermann called me...\"  <br> <br>(apologies to Mr. Spiekermann) <br> <br>Seriously, I avoid all titles with the term 'artist' in them, not because being an artist is bad, per se, but because it carries a lot of implications for the people we work with who <i>aren't</i> in our field. Though 'Production Artist' is probably more meaningful to a lot of design professionals, I agree that it's more mechanical than what you want. In the end, if you're comfortable with 'Finishing Artist/Typographer', I'd go with it. <br> <br>PS: Alisa says hi.</p>"
