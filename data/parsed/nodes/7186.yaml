  html: <p>Hello typophiles... I am a new registrant.  <br> <br>I am wondering if there is a name for the kind of work I do best. <br> <br>I like to be the person who takes a project that is about 80% done and makes it right. Tightening the screws, polishing it up. Make that a little bigger, kern this a bit, adjust h&amp;j settings, etc.  <br> <br>I would imagine that back in the day when things were not computerized and the workflow was spread over many people there would be individuals who did just this. Did these people have a special name? <br> <br>Any insight on this or what kind of language I can use to differentiate myself from a production person would be appreciated.</p>
