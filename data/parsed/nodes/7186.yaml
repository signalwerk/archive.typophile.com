    html: <p>Ok, now I'm confused.  <br> <br>As I understood it, the title "Finished Designer" offered by Mr. Spiekermann is (was ? ) industry jargon. My thought was to translate that to "Finishing Designer" but I certainly don't want to do that if "Finishing Designer" already applies to a guy at the print shop who does something very different from what I do. Unless that guy is just a "Finisher" and not a "Finishing Artist." <br> <br>(I was just thinking I'm being too attentive to too small a detail on this forum here, but then I thought better and remembered that there's no such thing as too small a detail for "typophiles" ;) <br> <br>The art director I'm currently working with thinks this "Finishing Designer" business is silly and that I should just call myself a "Production Artist." But its important to me that I not be confused with someone who only does mechanical production, as my work is largely typographic. I could always explain as much on my resume, I guess... <br> <br>Maybe "Finishing Artist/Typographer" ?</p>
