      <p>Theunis de Jong: 'It’s really a very good and thorough piece of work ...'</p>
      <p>Thanks for the compliment. This is another one (especially Dr. Juergen Willrodt deserves the credits here) by Dr. Ken Lunde, Sr. Computer Scientist at Adobe, on Thomas Phinney's blog (<a href="http://www.thomasphinney.com/2009/01/dtl-otmaster/" title="http://www.thomasphinney.com/2009/01/dtl-otmaster/">http://www.thomasphinney.com/2009/01/dtl-otmaster/</a>):<br>
      'As someone who works with OpenType fonts on an every-day basis, and with the tools that are used to build and check them, I would like to state here that DTL OTMaster is a fabulous tool. The best way for me to characterize it is that it gives me the power of AFDKO’s “spot” tool, and that of TTX, but wrapped up in nice GUI. It handles CJK fonts well, including those with a large number of glyphs. I especially appreciate that there is a Mac OS X version, because that is the OS that I use.'</p>
      <p>AzizMostafa: ‘Please allow 2 weeks to explore it.’</p>
      <p>OTM supports mark positioning lookups and can display them. These mark to base, mark to mark and mark to ligature positions are editable in OTM. They are also supported when a features file is imported. Since OTM is based on the latest version of the Adobe SDK it supports the GPOS mark features and one can create a GPOS table from the features file. </p>
      <p>I wrote: 'The downloads also contain the OTM manual in PDF format.' and I would like to add here that version 1.5 of the OpenType specs is attached and linked to the manual, thanks to the permission granted by Microsoft.</p>
