      <p><strong>New: DTL OTMaster 2.4</strong><br>
      &nbsp;<br>
      A new version of OTM has become available. The new functionality comprises improved export of OpenType layout features, a couple of enhancements in the <em>OTF Consistency Checker</em> and the options to change the table version numbers in the ‘post’ and ‘gasp’ headers.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/OTM_240_1_3669.jpg"></div><br>
      DTL OTMaster can be used to export OpenType layout tables present in a font. The exported OpenType layout features ﬁles can be read-in directly without any alterations. And although the way the exported features are listed could be different (due to the inevitable interpretation of the binary tables) from the features-description that was used for generating the font originally, the functionality should be completely identical.<br>
      &nbsp;<br>
      OTM 2.4 supports the latest AFDKO 2.5 build and can be used to update the OpenType layout features in a font. Any OpenType layout features ﬁle with the AFDKO syntax can be imported, even if the listed features are not covered by the font’s character set. The modiﬁed Hatch OpenType (‘HOT’) tool will remove the none-covered features during font generation. Of course, to make all applicable features work, the character naming convention should be identical in both the font and the OpenType layout features ﬁle.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/OTM_240_2_3725.jpg"></div><br>
      The <em>OTF Consistency Checker</em> in OTM 2.4 contains a new, extensive, ‘Language’ section, which can be used to list and print the (missing) glyphs that a font supports for a speciﬁc language.<br>
      &nbsp;<br>
      FEB<p></p>
