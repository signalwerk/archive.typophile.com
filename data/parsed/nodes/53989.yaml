    html: |-
      <p>Indeed, I consider OTMaster Light a very powerful "in-depth font viewer". For example, its Tools/'GPOS'/'GSUB' Table Viewer is a quite powerful and useful tool to examine the functionality of the compiled OpenType Layout tables. </p>
      <p>TypeSupply FeatureProof [1] offers a similar functionality, but OTMaster is much more robust with more complicated fonts (e.g. complex-script fonts for Indic languages, which FeatureProof simply does not open at all). Also, OTMaster works on both Mac OS X and Windows, while FeatureProof is Mac-only. On the other hand, FeatureProof offers a more practical interface for testing contextual OpenType Layout features in a "real text string". </p>
      <p>And yes, indeed, the full version of OTMaster allows you to edit pretty much any aspect of the low-level structures of a TrueType or OpenType font. TTX/FontTools [2] allows pretty much the same, but in a rather different manner: OTMaster offers a graphical user interface while TTX/FontTools allows the user to convert an entire TTF or OTF font (or one selected table) into XML, edit the XML in a text editor, and convert it back into a font. Also, installing and setting up TTX/FontTools can be challenging for some users, while OTMaster works "out of the box". </p>
      <p>Both working manners have their advantages. If you need to make more changes, the XML workflow (through TTX/FontTools) can be more efficient, but for a simple fix or two in a font, OTMaster is the better solution. </p>
      <p>I definitely think DTL OTMaster is an excellent product. </p>
      <p>Regards,<br>
      Adam</p>
      <p>[1] <a href="http://code.typesupply.com/wiki/FeatureProof" title="http://code.typesupply.com/wiki/FeatureProof">http://code.typesupply.com/wiki/FeatureProof</a><br>
      [2] <a href="http://fonttools.sourceforge.net/" title="http://fonttools.sourceforge.net/">http://fonttools.sourceforge.net/</a></p>
