    <p>The <em>Dutch Type Library</em> and <em>URW++ Design &amp; Development</em> proudly present <strong>DTL OTMaster</strong> (OTM), a highly sophisticated application for reviewing, editing and saving tables of fonts with a snft file structure, as there are CFF and TTF flavored <strong>OpenType</strong> fonts, <strong>TrueType</strong> fonts and <strong>TrueType Collection</strong> fonts.</p>
    <p>Font editors, like for instance the <strong>DTL FontMaster</strong> suite, <strong>FontLab Studio</strong> and <strong>FontForge</strong>, rely on their own internal data formats for type design and font production. From these data, binary fonts for the end-user are compiled as the last step in the font production process.<br>
    <strong>OTM</strong> is a tool for inspecting and adjusting such binary fonts, irrespective of the font editor used for their creation.</p>
    <p><strong>OTM</strong> makes the editing of tables possible from a <strong>graphical user interface</strong>. It comes with built-in tools like the <em>Glyph Editor</em> for proofing and editing contours or even drawing glyphs from scratch. A ‘kern’ Table Viewer is available for proofing and refining the kerning, and a ‘GSUB’/‘GPOS’ Viewer to visually test (and in case of GPOS also adjust) these OpenType Layout tables.</p>
    <p><strong>DTL OTMaster</strong> was programmed in Hamburg, Germany at <em>URW++ Design &amp; Development</em>, renowned for pioneering in the field of font technology development for more than thirty years. The <strong>FM Team</strong> (Dr. Juergen Willrodt, Axel Stoltenberg, Hartmut Schwarz, Peter Rosenfeld and Frank E. Blokland) was joined by Karsten Luecke as advisor and also author of the extensive and detailed <em>OTM manual</em> and Nikola Djurek for the design of the function icons.</p>
    <p><strong>OTM</strong> is available for Mac OS X, Windows and Linux. Free <strong>Light versions</strong> are available for: <a href="http://www.fonttools.org/downloads/OTMA/OTM_Light_1.0.0_MAC.zip" rel="nofollow"><strong>Mac OS X</strong> (download)</a>, <a href="http://www.fonttools.org/downloads/OTMA/OTM_Light_1.0.0_WIN.zip" rel="nofollow"><strong>Windows</strong> (download)</a> and <a href="http://www.fonttools.org/downloads/OTMA/OTM_Light_1.0.0_LIN.tgz" rel="nofollow"><strong>Linux</strong> (download)</a>. </p>
    <p>The downloads also contain the <em>OTM manual</em> in PDF format.<br>
    &nbsp;</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OTM_scrndmp_small_5025.gif"></div><p></p>
