      <p></p><div class="imageWrap"><img src="http://typophile.com/files/OTM_20_TP_6600.jpg"></div><br>
      &nbsp;<br>
      <strong>A new version (2.0.0) of DTL OTMaster is available now.</strong><br>
      &nbsp;<br>
      The functionality of DTL OTMaster has been enhanced considerably in the new 2.0.0 version. For instance the <em>Glyph Editor</em> now supports the option to import and export EPS and SVG data. It is also possible to cut, copy and paste glyph data between CFF and TTF fonts. Imported glyphs can be autohinted.<br>
      &nbsp;<br>
      The OpenType Layout features processing is based on latest build of the AFDKO 2.5 version and the OpenType specification 1.6 is supported. The <em>Concistency Checker</em> has been enhanced with new ‘Version’ and ‘Statistics’ options.<br>
      &nbsp;<br>
      Especially because of the new glyph editing functionality and the option to add EPS and SVG data to OpenType (CFF and TTF) fonts, DTL OTMaster 2.0.0 is not only suitable for professional font producers, but also for graphic designers who want to add special characters and logo’s to existing fonts (if the end user license that came with the font in question permits this, of course).<br>
      &nbsp;<br>
      •&nbsp;<a href="http://www.fontmaster.nl/english/downloads.html" target="_blank" rel="nofollow">Download DTL OTMaster Light 2.0.0</a><br>
      &nbsp;<br>
      <strong><em>New in version 2.0.0:</em></strong><br>
      &nbsp;<br>
      — Support of the latest ‘build’ of the AFDKO version 2.5.<br>
      — Support for OT Specification V1.6.<br>
      — Support for Mark Filtering Sets<br>
      — Support for cv00–cv99, ss01–ss20<br>
      — Support for feature name tags<br>
      &nbsp;<br>
      — Two new options in the <em>Consistency checker</em>:<br>
      1. Version checker,<br>
      2. Glyf and Header entries checker.<br>
      &nbsp;<br>
      — <em>Glyph Copy Tool</em> supports copying OTF(CFF) &lt;–&gt; TTF now.<br>
      — Cut/Copy/Paste between Bezier outlines (CFF) and quadratic splines (Glyf).<br>
      — EPS import &amp; export<br>
      — SVG import &amp; export<br>
      — Metrics editing and update (hmtx, vmtx) in the glyph editor.<br>
      — Autohinting (for single glyphs).<br>
      — Display of hints for CFF Fonts.<br>
      &nbsp;<br>
      &nbsp;<br>
      <a href="http://www.fontmaster.nl/index_main.html" rel="nofollow"><img alt="Home.GIF" src="http://www.fontmaster.nl/Blogs/FMNews/archives/Home.GIF" width="28" height="28" border="0"></a><br>
      <a href="http://www.fontmaster.nl/index_main.html" rel="nofollow">Home</a><p></p>
