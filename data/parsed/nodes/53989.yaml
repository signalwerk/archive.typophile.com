    html: |-
      <p>I can also attest that the AFDKO functionality of DTL OTMaster 2.4 is great. </p>
      <p>1. The export of AFDKO feature definition files from existing OpenType fonts has been improved so now OTMaster can export the code in such a way that AFDKO 2.5-compatible compilers such as MakeOTF, Fontographer 5 or the upcoming FontLab Studio 5.1 can easily compile it, problem-free. </p>
      <p>2. The intelligent subsetting of the AFDKO code works very well. If your glyph naming is consistent, you can use one large AFDKO file that covers the largest possible glyph set. You can import it into any font that uses the same glyph names, and OTMaster will only add the feature definitions that are covered by the glyph set. </p>
      <p>An example on how this can be used: </p>
      <p>Open a large multi-script OpenType font in OTMaster, export the AFDKO code, open the same OpenType font in a font editor such as Fontographer or FontLab Studio or even TypeTool, remove some glyphs, generate the font, open it in OTMaster and import the previously exported AFDKO code. The rules or lookups that no longer apply to the font (because the relevant glyphs are no longer present) will be transparently ignored, and only features that are covered will be included. </p>
      <p>In fact, you can then export the AFDKO file again from that font, and then you'll get the subsetted AFDKO file. So rather than removing lines of code by hand, editing your classes etc., you just use OTMaster as a "filter" that will process your code. You can then, perhaps, make some small changes to that new, subsetted AFDKO file, and take it into any tool such as FontLab Studio, Fontographer or MakeOTF. </p>
      <p>Of course this means that you can have a large "master" AFDKO feature definition file, and use OTMaster to add the code to any font you're making, regardless of the actual glyph set. You can either import the AFDKO file in OTMaster and then save the new OpenType font (with features included) right from OTMaster, or -- if you want ultimate control -- import the master AFDKO file into the font in OTMaster and then export it again: then you'll get the custom-tailored AFDKO file, and you can perform some additional manual edits (e.g. if you have some special "calt" or "ssXX" features which are not present in your master file). </p>
      <p>This is, potentially, a huge time-saver for people making OpenType fonts. </p>
      <p>Last year, I've started using OTMaster as the final step of font production, after generating the font from Fontographer or FontLab Studio. OTMaster gives you a low-level OpenType-spec-native view at the font, quite like FontTools/TTX, but wrapped in a quite clean user interface. </p>
      <p>OTMaster is a great "illustrator" for the OpenType spec. If you want to take the step of reading through the OpenType spec at some point (which I do recommend if you are developing fonts), reading the spec is much more pleasant if you open a font in OTMaster and view the actual tables organization and values. This will help you understand the spec much better. I hope for many of you, if you do this, it'll allow your brain to make "click" at some point, and you'll quite likely be able to finally "get" the inside structure of OpenType font. IMO, that's tremendously helpful. </p>
      <p>The trial version of version 2.4 is not available. OTMaster Light 2.0 is the latest trial version available. As a trial, it works quite well. You can familiarize yourself with the tool and see whether it's any good for you, in general. Also, there's a small video that I've created showing DTL OTMaster in action. The video is based on OTMaster 2.3, so some of the new features are not shown. </p>
      <p>DTL OTMaster 2.4 will be available shortly at<br>
      <a href="http://www.fontlab.com/dtl-urw-font-utilities/dtl-otmaster/" title="http://www.fontlab.com/dtl-urw-font-utilities/dtl-otmaster/">http://www.fontlab.com/dtl-urw-font-utilities/dtl-otmaster/</a></p>
      <p>Regards,<br>
      Adam</p>
    html_clean: |-
      <p>I can also attest that the AFDKO functionality of DTL OTMaster 2.4 is great. </p>
      <p>1. The export of AFDKO feature definition files from existing OpenType fonts has been improved so now OTMaster can export the code in such a way that AFDKO 2.5-compatible compilers such as MakeOTF, Fontographer 5 or the upcoming FontLab Studio 5.1 can easily compile it, problem-free. </p>
      <p>2. The intelligent subsetting of the AFDKO code works very well. If your glyph naming is consistent, you can use one large AFDKO file that covers the largest possible glyph set. You can import it into any font that uses the same glyph names, and OTMaster will only add the feature definitions that are covered by the glyph set. </p>
      <p>An example on how this can be used: </p>
      <p>Open a large multi-script OpenType font in OTMaster, export the AFDKO code, open the same OpenType font in a font editor such as Fontographer or FontLab Studio or even TypeTool, remove some glyphs, generate the font, open it in OTMaster and import the previously exported AFDKO code. The rules or lookups that no longer apply to the font (because the relevant glyphs are no longer present) will be transparently ignored, and only features that are covered will be included. </p>
      <p>In fact, you can then export the AFDKO file again from that font, and then you'll get the subsetted AFDKO file. So rather than removing lines of code by hand, editing your classes etc., you just use OTMaster as a "filter" that will process your code. You can then, perhaps, make some small changes to that new, subsetted AFDKO file, and take it into any tool such as FontLab Studio, Fontographer or MakeOTF. </p>
      <p>Of course this means that you can have a large "master" AFDKO feature definition file, and use OTMaster to add the code to any font you're making, regardless of the actual glyph set. You can either import the AFDKO file in OTMaster and then save the new OpenType font (with features included) right from OTMaster, or -- if you want ultimate control -- import the master AFDKO file into the font in OTMaster and then export it again: then you'll get the custom-tailored AFDKO file, and you can perform some additional manual edits (e.g. if you have some special "calt" or "ssXX" features which are not present in your master file). </p>
      <p>This is, potentially, a huge time-saver for people making OpenType fonts. </p>
      <p>Last year, I've started using OTMaster as the final step of font production, after generating the font from Fontographer or FontLab Studio. OTMaster gives you a low-level OpenType-spec-native view at the font, quite like FontTools/TTX, but wrapped in a quite clean user interface. </p>
      <p>OTMaster is a great "illustrator" for the OpenType spec. If you want to take the step of reading through the OpenType spec at some point (which I do recommend if you are developing fonts), reading the spec is much more pleasant if you open a font in OTMaster and view the actual tables organization and values. This will help you understand the spec much better. I hope for many of you, if you do this, it'll allow your brain to make "click" at some point, and you'll quite likely be able to finally "get" the inside structure of OpenType font. IMO, that's tremendously helpful. </p>
      <p>The trial version of version 2.4 is not available. OTMaster Light 2.0 is the latest trial version available. As a trial, it works quite well. You can familiarize yourself with the tool and see whether it's any good for you, in general. Also, there's a small video that I've created showing DTL OTMaster in action. The video is based on OTMaster 2.3, so some of the new features are not shown. </p>
      <p>DTL OTMaster 2.4 will be available shortly at<br>
      <a href="http://www.fontlab.com/dtl-urw-font-utilities/dtl-otmaster/" title="http://www.fontlab.com/dtl-urw-font-utilities/dtl-otmaster/">http://www.fontlab.com/dtl-urw-font-utilities/dtl-otmaster/</a></p>
      <p>Regards,<br>
      Adam</p>
