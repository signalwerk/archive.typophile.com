      <p>"Stop the <em>colour</em> Presses" 😄</p>
      <p>Every now and then innovations in font design didn't percolate into actual design software because there were no <em>fonts</em> to use them with, and there were no fonts because the <em>software</em> wasn't there. And the software wasn't there because there was no demand from the design software writers ...</p>
      <p>It's fantastic that OTM so quickly integrated this, as did <a href="http://www.typophile.com/node/105216" rel="nofollow">FontCreator</a> and <a href="http://www.typophile.com/node/105212" rel="nofollow">Type Light</a>! Now it's up to the higher echelons of software vendors to implement proper support, first for viewing, then for printing.</p>
