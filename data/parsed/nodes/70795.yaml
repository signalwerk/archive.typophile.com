    html: |-
      <p>Tuom, </p>
      <p>what you're talking about is OpenType Layout. </p>
      <p>I recommend reading <a href="http://www.microsoft.com/typography/Glyph%20Processing/intro.mspx" title="http://www.microsoft.com/typography/Glyph%20Processing/intro.mspx">http://www.microsoft.com/typography/Glyph%20Processing/intro.mspx</a> as a starter. </p>
      <p>With OpenType Layout, the representation in memory must be formatted/styled text, not plain text. It's up to the software vendor to choose the appropriate representation. Unfortunately, RTF (a quite common cross-vendor format for styled text) does not have standard means to store OpenType Layout formatting, although Apple made some custom extensions to RTF that work within Mac OS X (so you can copy-paste between Pages or Keynote or TextEdit and retain OpenType Layout formatting). </p>
      <p>HTML, being another cross-vendor format for styled text, also currently has no standard means to retain this information, but CSS3 has is planning to include properties that allow authors to turn specific OpenType Layout features on or off on a portion of text. There's an editor's draft available at<br>
      <a href="http://dev.w3.org/csswg/css3-fonts/" title="http://dev.w3.org/csswg/css3-fonts/">http://dev.w3.org/csswg/css3-fonts/</a></p>
      <p>In that case, your x^2 example would look like <code>x&lt;span style="character-transform:superscript"&gt;2&lt;/span&gt;</code></p>
      <p>Microsoft's XML dialect XAML used in Windows Presentation Foundation also has extensive formatting clauses for OpenType Layout features. </p>
      <p>Best,<br>
      Adam</p>
