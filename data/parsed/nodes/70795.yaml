    html: <p>If I understood correctly, it might not be possible to access all the glyphs of a font via cmap, right? What should I do then, if I want to write "x^2" (x squared, "2" is superscript)? In other words, how does InDesign's Glyph Selection panel work? I assume it is possible to list all the glyphs of a font (i.e. output the content of glyf or CFF?), but how would such text look like (say, in memory)? Is it possible to e-mail "x^2" so that it displays correctly (if the font is available)?</p>
