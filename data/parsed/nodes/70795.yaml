    <p>Hello,</p>
    <p>I'm trying to understand how TrueType works but I have some difficult time with how glyph selection works. I mean, a user types in a sequence of Unicode characters, i.e. Unicode code-points. TrueType cmap specifies various formats of mapping between code-points and actual glyphs data stored in .ttf (.otf). But sometimes there in font are ligatures, stylistic variants and what not - how are those selected? I assume Unicode does not define a code-point for 3rd swash of capital F.</p>
    <p>Related question, when I look at a font through MS ttfdump, there is different number of entries in cmap than the count of all the glyphs.</p>
    <p>Please, could someone explain to me how this works?</p>
