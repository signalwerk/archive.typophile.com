    html: |-
      <p>The translation from text string to displayed string is not <em>entirely</em> a Unicode procedure.</p>
      <p>High-level text APIs (such as Uniscribe) can interrogate the font for its features. This may return, for example, a list of glyphs forming ligature combinations. The high level API then creates a list of glyphs (Unicode or not) and displays them by itself.</p>
      <p><cite>Related question, when I look at a font through MS ttfdump, there is different number of entries in cmap than the count of all the glyphs.</cite></p>
      <p>Part of it is because the cmap may define glyphs more than once -- Carriage Return, Space, Non-breaking space all may map to the same glyph. Same with hyphen, non-breaking hyphen, and discretionary hyphen. So this accounts for <em>less</em> glyphs than cmap points.<br>
      If the font contains Opentype features, the font file may have additional glyphs that cannot be mapped (just about anything, from Small Caps to composite characters to ligatures and alternates).</p>
      <p>It's also quite possible a font has glyphs that are not "meant" for regular use -- I think Cambria Math may be an example, as its extra glyphs cannot be accessed through the usual OTF features, and you need specialized software (which?) or manually insert the glyphs you want (meaning, you need a Glyph Selection panel such as in InDesign).</p>
