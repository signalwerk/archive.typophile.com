  html: |-
    <p>How fast can you make a font from scratch?</p>
    <p>I think it is a fascinating question, with some merit, though of course, if we expected everyone to work as fast as possible, we would have a lot of mediocre typefaces.  So that's it then, how fast can you create a mediocre font? From scratch mind..</p>
