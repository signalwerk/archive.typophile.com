  html: |-
    <p>I am using a FontFont opentype typeface, which by default contains oldstyle numbers. I require the use of lining numbers. Unfortunately the difficult part is that I am using the typeface in an old fashioned labelling software. Is there anyway I can reproduce the lining numbers in this software?</p>
    <p>For example, I have accessed the opentype features in My design software and tried to copy and paste the numbers I need into the labelling software, but it doesn,t allow this. I have also tried looking through all the glyphs both in the software and in character map (Windows). I can find the lining numbers in the software  but the oldstyle numbers and the lining numbers have the same code, so when I hold down ALT+0051 I still only get the the oldstyle number. Is there any way around this?</p>
    <p>Many thanks,<br>
    Andy</p>
