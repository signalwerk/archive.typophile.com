    <p>Hi Typophile users</p>
    <p>After the initial critique last month on 'Typophile' I went away and studied every aspect of this font to see why it didn't seem to work. </p>
    <p>I realised that the weight of vertical and horizontal strokes weren't visually in harmony. This was due to the height of the vertical strokes. I rectified this by reducing the thickness of the horizontal strokes by a third.</p>
    <p><a href="https://www.dropbox.com/s/7xjs9vrprbqlke6/STROKES.pdf" rel="nofollow">strokes.pdf</a> - As you can see the top and bottom stroke of the body of the 'Q' are slightly thinner.</p>
    <p>The thinning of strokes also helped to make the curves feel more natural. Because of this the thinner strokes gave the letter forms more white space. In turn the perfect circles that previously made up counters and white space turned into ovals.</p>
    <p><a href="https://www.dropbox.com/s/meh1pnr8a37b7vm/OVAL.pdf" rel="nofollow">ovals.pdf</a> - The straight and curved strokes are less noticeable.</p>
    <p>The width of certain letter forms where complicating the overall feel of the uppercase so I split some of the letters into sections, each section with a specific body width. 'E', 'F', 'L', 'T' and the 'Z' hold a lot of white space so I decided on reducing their width so they sat comfortably with other wider letters. 'B', 'K' and 'R' where slightly wider to compensate for the lower counters or white space so they didn't feel too top heavy.</p>
    <p><a href="https://www.dropbox.com/s/atqq1q623hc5pax/GROUPS.pdf" rel="nofollow">groups.pdf</a> - They now sit more comfortable with each other now.</p>
    <p>Lastly stroke edges have been made to feel softer with barely any sharp points in site. This was achieved by rounding off most of the sharp points.</p>
    <p><a href="https://www.dropbox.com/s/x0etyiu21h6q5hq/FONT.pdf" rel="nofollow">desperation.pdf</a> - The overall UPPERCASE of desperation.</p>
    <p>Please let me know what you all think?</p>
    <p>Many thanks</p>
    <p>Darren Reay</p>
