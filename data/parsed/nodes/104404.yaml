      <p>Really sorry for late reply, been busy doing other projects over the past few weeks for a bit of a break away from this typeface. I've now started picking it back up and playing around with it again. I appreciate your reply :).</p>
      <p>I agree about the strokes on both EF, the contrast in weight are too much, I think I was being too strict with the grids. The S is definitely unfinishes and needs more work on it. </p>
      <p>I've recently started creating the lower case and finding it hard to contain the same character as the UPPERCASE but I'll post the progress over the next few weeks.</p>
