      <p><em>Boston, Mass., 02134-5623, U.S.A.</em></p>
      <p>More properly, should be</p>
      <p>Boston, MA 02134-5623, USA</p>
      <p>The "oldstyle" state abbreviations—Mass., Penna., Tex., etc.—may be considered proper AP style, but they introduce unnecessary confusion into the postal address process. And, FWIW, to avoid confusion, using the middot or periodcentered characters with added space on either side is probably preferable, given that a comma is used in the city-state-zip segment.</p>
