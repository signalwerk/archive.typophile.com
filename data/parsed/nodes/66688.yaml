    html: |-
      <p>With comma splices replacing line breaks, e.g.:</p>
      <p>Greg Yourp<br>
      137 Stiener St. Apt #3<br>
      Boston MA 02134-5623<br>
      USA</p>
      <p>becomes:</p>
      <p>Greg Yourp, 137 Stiener St. Apt #3, Boston, Mass., 02134-5623, U.S.A.</p>
      <p>Note that there are no commas in the city state zip line in the envelope format, in accordance with postal guidelines, but there are when an address is written as inline text. Older custom is to include them on envelopes and to use a longer abbreviation for the state. Guidelines were updated to make addresses more easily readable both for machine readers and human sorting machine operators.</p>
      <p>(Name and address are made up, but I think I got part of the ZIP code right)</p>
