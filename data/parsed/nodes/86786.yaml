    <p>Hi Typophilers,</p>
    <p>I was wondering if you guys have any idea what this typeface is:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/02-02-04_6478.gif"></div> <div class="imageWrap"><img src="http://typophile.com/files/designact_3655.gif"></div> <div class="imageWrap"><img src="http://typophile.com/files/02-01-02-D2_6040.gif"></div><p></p>
    <p>At first i thought it was Norm's "Simple", but as you can see the letters Z, A, G, and the question mark is different.</p>
    <p>Please help me solve this typographic mystery. I'm dying to know what typeface this is! </p>
    <p>Thank you.</p>
