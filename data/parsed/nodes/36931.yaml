    html: |-
      <p>Which learning difficulties are we talking about here? Dyslexia or other? If dyslexia you should follow this thread: <a href="http://www.typophile.com/node/36906" title="http://www.typophile.com/node/36906">http://www.typophile.com/node/36906</a></p>
      <p>In case of dyslexia I would not do so because of the way shapes and colour is perceived by a dyslexic. </p>
      <p>Why do so in the first place? It reduces legibility and makes it harder even for those without difficulties.</p>
