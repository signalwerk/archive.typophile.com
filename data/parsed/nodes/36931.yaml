      <p>I'm certainly no expert, but 'learning difficulties' is rather vague. We'd probably need to know more info as well...age target? Screen? Print? In what context?</p>
      <p>I think reversed type is useful on-screen. I wouldn't do it a lot on paper, but that's not based on any specific accessibility guideline that I'm aware of.</p>
