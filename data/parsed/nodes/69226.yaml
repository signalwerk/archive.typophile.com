      <p>If it was Kulturista then there were a lot of modifications made. The 'a' is more square, and the y is quite different. I could believe Kulturista was the starting point for a custom design. The only other similar font I found was <a class="freelinking external" href="http://new.myfonts.com/fonts/philatype/gravity/normal/" rel="nofollow">Gravity Normal</a> from Philatype.</p>
      <p>- Mike Yanega</p>
