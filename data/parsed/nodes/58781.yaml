      <p>The problem with the Google logo is that the type has significant contrast between thicks and thins, and the drop shadow is too far away from the type. The resulting slivers of white impede recognition of the letterforms. It might be better with a lighter shadow, or if it were moved a few pixels up and to the left. </p>
      <p>Drop shadows should be used with caution and restraint.</p>
