      <p>I renovated the <em>Birmingham News</em> nameplate a few years ago, and at the client's request added a drop shadow to help it stand its ground on the page. I also added a "casing" (is that what you call it?)--a hard white line, technically a drop shadow too, between the type and the vignetted shadow. That can give a vignetted shadow more "pop", so that it can be quite discreet--light in tone and without much spread--and yet still do its job. More graphic, less pictorial.</p>
