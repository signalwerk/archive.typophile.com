    html: |-
      <p>From the view point of the sign industry, it is always best to create a basic version of any logo without effects. At some point, your client is going to want a sign. If it is a flat, digital print on a substrate, soft drop shadows and textures etc. are not an issue. If it is going to be a back lit sign, or routed sign these special effects pose a problem. If your logo doesn't really look good without the effects, it isn't going to look that much better routed out of brushed aluminum, mounted on a brick wall. Exterior lighted signs with special effects generally turn into visual noise from any distance. Designers don't generally take these conditions into account when creating these really cool effects. </p>
      <p>~~~~~~~~~~~~~</p>
      <p><a class="freelinking external" href="http://www.thefontry.com" rel="nofollow"><em>...from the Fontry </em></a></p>
