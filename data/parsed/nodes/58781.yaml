    <p>Throughout my design education I was taught to not use drop shadows – ever. Now, in my day to day job, I have been told numerous times to add drop shadows now and then, often to type. I am sure the same happens to many of you all too.</p>
    <p>I am just curious of everyone's opinion of the drop shadow.</p>
