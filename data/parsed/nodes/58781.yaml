    html: |-
      <p>Drop shadows have a purpose, usually to add contrast between letters and background. Google's primary-color theme stuck them with a yellow <strong>o</strong> that disappears into a white background unless you give it a shadow.<br>
      Drop shadows used to be laborious (and therefore expensive) to make, so designers didn't use them very much. When PageMaker, Quark, and Photoshop made drop shadows available at the click of a mouse, designers and designer wannabees went crazy putting drop shadows on <em>everything</em>. (The same thing happened with gradient fills.)<br>
      Professors and art directors who lived through the Great Drop Shadow Epidemic of the early 90s often have a phobia about them, but you have nothing to fear if you practice safe specs.</p>
    html_clean: |-
