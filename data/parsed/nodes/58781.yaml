      <p>I'd take the criticism seriously.<br>
      Drop shadows are a quick fix, like MSG.<br>
      If your boss feels your work would benefit from a drop shadow, it may be a bit "flat".</p>
      <p>However, there are some circumstances where a drop shadow can be quite proper, such as when running type over a lively photograph.</p>
