    html: |-
      <p>This is coming along well.<br>
      A few suggestions to take or leave:<br>
       - roman /f/ appears to lean rightward, moreso in the lighter weights. Extending the bottom right serif might help. (I don't know that the lean in itself is a problem, but extending that serif will help with spacing at any rate.)<br>
       - roman /g/ I think that corner at the northeast of the bottom bowl is yet too angular for my eyes, but maybe you have it where you want it. Could the ear take a tiny bit more weight?<br>
       - is roman /c/ a little light?<br>
       - small caps could be a touch darker in every weight. I like the stemmed /U/!<br>
       - /m/ is too wide I think, certainly in italic at least.<br>
       - the (illusory) upslant of the italic /f/ and /t/ crossbars may be too strong.<br>
       - in the lighter weights, italic /g/'s counters look out of balance, with the lower one looking pinched. Keep the structure for sure -- it's great -- but consider tweaking the proportions.<br>
       - loop of italic /k/ looks pinched, too.</p>
