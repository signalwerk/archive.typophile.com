  - id: 518945
    user_id: 92807
    user_name: LexLuengas
    user_path: null
    user_image: /files/pictures/picture-92807.png
    date_raw: 13 Aug 2012 — 3:37am
    date: 2012-08-13T03:37:00
    votes: null
    html: |-
      <p><em>Italics:</em> I like the /R/, it has an original, distinctive shape, there's no need to tweak it in my opinion. It's lowercase counterpart /r/, however, is clearly too wide. It gives the impression of falling forward. /Q/ is wonderful! I'm not sure about the top right of /x/. The top right serif of /K/ could grow more to the right.</p>
      <p><em>Roman:</em> The last sentence also goes to /k/. /k/ is also too wide. The serifs of /u/ in the light weight are too short. In the bold and regular weight /e/ has a "big nose". To fix this bring the terminal nearer to the eye's right end (horizontally, of course). You may compare with the italics, where this problem is unexistant. The weight of the different serifs in /t/ and /x/ is unbalanced. I would definitely keep working on /g/. It reminds me of an intestine :-) which doesn't mean it's badly drawn, just that it's not what you're looking for.</p>
      <p><img src="http://www.fileden.com/files/2012/2/9/3262384/g.png"></p>
      <p>In my opinion, you could improve it by taking into account the following:<br>
      - In practically all text fonts the blue area has an even thickness.<br>
      - The blue area normally slopes downwards or stays horizontal, and doesn't necessarily has to sit on the baseline.<br>
      - The thin-thick transition in the red area is "uncertain".</p>
      <p>Personally, I would dispose of one of the two right crooks. /g/ has a very complex structure in comparison with the rest of your alphabet, not counting that it itself is the most complex constructed letter.</p>
      <p>Hope it helps ;-)</p>
  - id: 518952
    user_id: 44740
    user_name: daverowland
    user_path: null
    user_image: /files/pictures/picture-44740.gif
    date_raw: 13 Aug 2012 — 6:04am
    date: 2012-08-13T06:04:00
    votes: null
    html: |-
      <p>Thanks<br>
      I agree with most of your points on the italic. I don't mind the |x| though; the serifs relate to the |s| and (to a lesser extent) |r| and |c|.</p>
      <p>Roman<br>
      k - yes I suppose it was slightly wide, but it's a toss up between width and counter size and I erred towards getting the counters more in keeping with the rest than the width. I've trimmed it slightly since then and it's now the same width as the h.<br>
      e - you're right, I'd already changed this but have yet to post updates as concentrating more on italic.<br>
      u light - It's not just the |u|. I'm going to extend the serifs throughout the light weight, and perhaps loosen the spacing slightly as I do it.<br>
      t and x - I agree some problems with light |x| but others I think are ok. I've thickened bottom right of |e|, |c| and |t| since last images posted, so difference between crossbar and bottom is not as big. I like the left of the crossbar looking thicker than the right. I don't know why, just feels better to me that way.</p>
      <p>g - in most recent iteration, the 'blue area' is closer to horizontal, and the red area is more clearly thin, and joins the blue area with a corner instead of a curve. It probably still looks like an intestine to you, but I like it...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/newromans_5522.JPG"></div><br>
      This is Roman as it stands now. I've yet to extend serifs on light.<p></p>
