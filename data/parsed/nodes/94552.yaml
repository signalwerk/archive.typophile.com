      <p>While I think that it does harmonise, I do want to put more of an obvious corner in the counter of o in the light (more like it is in the b now). I think I was trying too hard to get it almost monoline in that weight, and keeping that interpolatable with the *black* weight has made for some lumpy looking strokes in certain glyphs. Hrant, g and a were my main concerns before. I'll have a play around with them and post results soon. You're right, of course, I've definitely chickened out on the g ear.<br>
