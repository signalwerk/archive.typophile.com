      I agree with you on italic /g/ and I've balanced it a bit better in the light weight. I think I was too caught up on keeping the top counter in line with the /a/, but I think it's much better now.<br>
      Tweaked /k/ slightly.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fumble_6467.png"></div><p></p>
