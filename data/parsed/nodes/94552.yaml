      <p>Ok, I'm thinking about f-ligatures. At the moment I've not made any but I have made an alternate f which would be substituted via calt feature in front of letters with ascenders on left-hand-side and 'i's (bottom row in image). My problem with this is A LOT of end users don't have calts on as default (nomatter how hideous the results!) whereas most do have ligatures on by default. I'm forced to make fi and fl ligatures, but should I make all the others with the alternative f, leave combinations like fh to be kerned if calt is not turned on, or make 'proper' (ie. joining) ligatures for the usual (ff, fi, fl, ffl, fh, ffb etc.etc.)?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/falt_4823.png"></div><br>
      A quick go at joining ligatures kind of persuades me not to go down that route:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/ff_4612.png"></div><br>
      What do you think?<p></p>
