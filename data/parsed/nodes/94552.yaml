      <p>I like the italic much better than the roman (and the bold better than the monoline) so far. My sense is that the roman hasn't entirely figured out what it is like the italic has. Could the italic success guide the roman more (could the roman be almost a restraightened italic?)? If a broader overhaul isn't in the plans, certainly the roman bold /k/ arm and /x/ have problems. </p>
      <p>I kinda liked the trapping but you should be adding that at the end if at all to save yourself headaches. </p>
      <p>Italic /m/s are too wide, and probably /w/s too.</p>
      <p>Tittles on the lighter cuts look low to me.</p>
