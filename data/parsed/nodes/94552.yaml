    html: |-
      <p>Ok, working on getting the roman and italic right before doing any other styles. I've changed |k| and |x| in the roman - you're right, Craig, that arm wasn't working. Raised tittles in light weight, and narrowed the |m| and (to a lesser extant) |w| in the light italic (I thought the black italic was ok as it was).<br>
      In the light roman, I've brought down the junction with the stem in letters like h, n, and b, and brought it up in letters like d, q, and u. I think this makes a big difference - getting closer to the look of the italic. Don't think it's needed so much in the black italic, so I left them alone.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/czech_5245.png"></div><br>
      Getting a little tired of quick brown foxes so used one of Craig's pangrams.<p></p>
      <p>That light roman ampersand is looking down a bit. gotta change that.</p>
