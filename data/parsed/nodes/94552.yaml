      <p>Small caps are in progress - for the italic, they are mainly a slanted Roman (Q is like the italic) but I'm wondering how to deal with the more lowercase-like UC glyphs (A, K, R, U and X). I think the kick at the bottom which works well with lowercase doesn't work so well in all caps (or small caps if I changed them too) settings. I was thinking of reintroducing the more standard slanted roman forms of these uppercase letters, but I'm undecided about where to put them. Standard as default and lc-like as salt or stylistic set, or the other way round, or with standard forms in CASE function (and probably in smcp too).</p>
      <p>These are the two possible cap styles in different settings:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/army_6192.png"></div><br>
      1. lc style with small caps<br>
      2. standard with small caps<br>
      3. lc style all caps<br>
      4. standard all caps<br>
      5. lc style with lc<br>
      6. standard with lc<p></p>
      <p>I'm leaning towards having the standard as default and the lc style as stylistic set, but I fear that alternates just end up unused.</p>
      <p>PS. please ignore spacing issues for now!</p>
