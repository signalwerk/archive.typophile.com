  html: <p>Hi, <br> <br>Just wondering what peoples thoughts are on these 2 versions, and which they think is better? <br> <br>I've compared them and the main difference seems to be that the weights of the Frutiger Next version are slightly lighter than the Frutiger version, as well as the addition of a medium weight, true italics and a different ampersand (looks the same as the univers ampersand). <br> <br>thanks <br>iota.</p>
  html_clean: <p>Hi, <br> <br>Just wondering what peoples thoughts are on these 2 versions, and which they think is better? <br> <br>I've compared them and the main difference seems to be that the weights of the Frutiger Next version are slightly lighter than the Frutiger version, as well as the addition of a medium weight, true italics and a different ampersand (looks the same as the univers ampersand). <br> <br>thanks <br>iota.</p>
