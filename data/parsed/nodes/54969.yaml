      <p>I think the serif in the IKEA catalog is Century Schoolbook and I find it does go very well with Futura. It takes up some of the geometrical simplicity while providing a pleasant contrast in rhythm...</p>
      <p>That being said, I'd stay away from looking just like IKEA. It's such a well known contemporary design that people will notice and wonder why your university's design looks like a furniture catalog.</p>
      <p>Maybe Frutiger's "Egyptienne F" would be something... It has a lot of simplicity is more geometric than Century Schoolbook... I think this could work, what do you think? </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fe_4411.jpeg"></div><p></p>
