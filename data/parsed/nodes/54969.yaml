    html: |-
      <p>@ Nick Shinn: Well, thanks for the link. I really hadn’t thought about that. Unfortunately, Brazilian typography never had that much tradition and it consists basically of display typefaces. The only decent serif I found was Adriane Text, by Marconi Lima and Silas Dilworth. I’ll test it with Futura and I’ll post my thoughts later.</p>
      <p>@ Artur and Lars: IKEA catalogs really look good, but I got to agree with Lars: it would look just like IKEA, and that’s not what we’re looking for. And even though I like the combination Futura/Egyptienne, I’m not sure whether a slab serif typeface would suit the ‘social institution’ image they’re trying to pass. Or maybe I’m wrong?</p>
      <p>Thanks again, folks!</p>
