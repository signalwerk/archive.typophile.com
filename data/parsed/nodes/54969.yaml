    <p>Hey fellas!</p>
    <p>It’s the first time I’m writing something around here, even though I’ve been following you for quite some time. And the reason I’m writing is that I really need some help.</p>
    <p>I’m a graphic design student and currently an intern at the Marketing Department of the university I study in. I’ve been assigned to redesign their brand guidelines, since the ones they have aren’t that good.</p>
    <p>The issue I’m struggling with is that their primary typeface is Futura, but they don’t have a secondary one. I want to define a serif typeface as secondary, you know, for the sake of contrast. This serif family would be used to set long texts, letters and other stuff like that. I am aware of Bringhurst’s suggestion – to use a modern one, like Bodoni – but this combination looks too vanguardistic to me, as they define themselves as a regional, social institution.</p>
    <p>I was thinking in something more humanistic. Any suggestions on that? Oh, and it’s not possible to change Futura, since they already are well known for it.</p>
    <p>I’d really appreciate any help!</p>
    <p>Thanks in advance.</p>
