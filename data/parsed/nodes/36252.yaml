    html: |-
      <p>My vote, if I were trying to replicate it, would be Font Bureau's <a href="http://www.myfonts.com/fonts/fontbureau/agenda/" rel="nofollow">Agenda Bold Ultra Condensed</a>, but these are such 'neutral' letters that I suspect many sans serif families could work. The counter on the P is about the only earmark of note in this lettering. If you get close, and have the right color blue, it would be hard to tell the difference.</p>
      <p>- Mike Yanega</p>
