  html: <p>A about a month ago someone posted this image asking if it was a digital font. It will soon be a new digital font from Jukebox. I went bananas when I saw this because I thought it was so cool! Thanks to Mark Simonson who provided me with a usable sample, this font is currently in production  as "Cabernet Italic &amp; Italic Swash" It should be available from Veer sometime later this summer. Enjoy...<img src="http://www.typophile.com/forums/messages/83/36531.jpg" alt="Caslon Black sample"></p>
