    <p>A bit of a mystery, but perhaps someone here knows right off what the story is.</p>
    <p>I saw an example of Berthold's Quadra 57 BQ (<a href="http://www.myfonts.com/fonts/berthold/quadra-57-bq/" title="http://www.myfonts.com/fonts/berthold/quadra-57-bq/">http://www.myfonts.com/fonts/berthold/quadra-57-bq/</a>) that led me to believe it was the absolute perfect solution for a project I'm working on.</p>
    <p>Problem is, I can't find it. Anywhere. It's listed on myFonts, but as no longer available. Poking around Berthold's site, it's not there at all. All references to it that I can find on the web point to myFonts.</p>
    <p>It's not a new font (1974), so I can't imagine any copyright issues that would explain it's disappearance.</p>
    <p>Anyone know the story?</p>
