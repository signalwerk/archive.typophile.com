  html: '<p>Ok, here we are. To say I am having trouble formulating any half way good ideas on this project would be an understatment. <br> <br><a href="http://www.kylehildebrant.com/downloads/cd_business_card.pdf" target="_blank">http://www.kylehildebrant.com/downloads/cd_business_card.pdf</a> <br> <br>If you reference this thread: <a href="http://www.typophile.com/forums/messages/4100/16215.html?1063976534" target="_blank">http://www.typophile.com/forums/messages/4100/16215.html?1063976534</a> <br> <br>You might have a little beter understanding of the logo and such. <br> <br>Keep in mind that the colors in the .PDF came out quite washed out (the joys of illustrator), if you reference the PMS, you might get a more accurate feel for the colors. <br> <br>Suggestions Please!!! <br> <br>Hildebrant.</p>'
  html_clean: '<p>Ok, here we are. To say I am having trouble formulating any half way good ideas on this project would be an understatment. <br> <br><a href="http://www.kylehildebrant.com/downloads/cd_business_card.pdf" target="_blank" class="link-external">http://www.kylehildebrant.com/downloads/cd_business_card.pdf</a> <br> <br>If you reference this thread: <a href="http://www.typophile.com/forums/messages/4100/16215.html?1063976534" target="_blank" class="link-lost">http://www.typophile.com/forums/messages/4100/16215.html?1063976534</a> <br> <br>You might have a little beter understanding of the logo and such. <br> <br>Keep in mind that the colors in the .PDF came out quite washed out (the joys of illustrator), if you reference the PMS, you might get a more accurate feel for the colors. <br> <br>Suggestions Please!!! <br> <br>Hildebrant.</p>'
