    html: <p>Kyle - main problem, imho, is the little digital doodads <br>that you created. For lack of a better description, <br>they are like little digital sperm rising up, ready <br>to overthrow Cobalt Data. <br> <br>I think what you have looks better standing alone. <br> <br>If the client insists on another element... <br> <br>You might check with a stock-image provider and type <br>in words such as "database" "network"  "digital" etc. <br>With such a raster element you could have a background <br>that uses a diffusion dither approach with a subtle  <br>5- to 10-percent tint variant. <br>(bitmap tiffs are color-changeable when placed in Illustrator) <br> <br>another idea to try is to use those little doodads <br>within the letters of Cobalt Data as digital connectors... <br>i'm guessing it'll probably be over the top in a comic <br>book kinda way, but it might be worth exploring...if <br>the client wants to you to go there.  <br> <br>bj <br></p>
    html_clean: <p>Kyle - main problem, imho, is the little digital doodads <br>that you created. For lack of a better description, <br>they are like little digital sperm rising up, ready <br>to overthrow Cobalt Data. <br> <br>I think what you have looks better standing alone. <br> <br>If the client insists on another element... <br> <br>You might check with a stock-image provider and type <br>in words such as "database" "network"  "digital" etc. <br>With such a raster element you could have a background <br>that uses a diffusion dither approach with a subtle  <br>5- to 10-percent tint variant. <br>(bitmap tiffs are color-changeable when placed in Illustrator) <br> <br>another idea to try is to use those little doodads <br>within the letters of Cobalt Data as digital connectors... <br>i'm guessing it'll probably be over the top in a comic <br>book kinda way, but it might be worth exploring...if <br>the client wants to you to go there.  <br> <br>bj <br></p>
