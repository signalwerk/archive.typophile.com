    html: <p>Looks great to me.  <br>I agree with bj about that "sperm thing".  <br>I would take it out completely. Will look cleaner  <br>and will give more emphasis to the logo. <br>And center the logo optically not mathematically. <br>(just move it up a little) Look like it is falling domn now. <br></p>
