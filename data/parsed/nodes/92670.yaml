    <p>I have an aircraft that I have to do some paint work on. I'm replacing registration numbers, and the font that exists is what they want used. I took a tracing of one of the numbers, and have a couple of pictures, but I can't find an exact match. Is this Marathon Serial Heavy? The fonts displayed on myfonts.com look like they have sharper corners than what's painted on this bird.</p>
