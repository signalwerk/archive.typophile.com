    html: <p>Thanks for the link. The stencil was made in vinyl, so this is probably what happened. Is there any way to identify the font to a particular company, if it is indeed an OEM font on some software for vinyl cutting? I'm about at wit's end. I had to use photos of the exxisting numbers and create them manually with software. It's not entirely too much work, but if there's an easier way, I'm all about it :)</p>
