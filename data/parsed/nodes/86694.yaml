    <p>Hello,</p>
    <p>Thanks for your time!<br>
    Below are two images of the front and back of a chocolate box I recently picked up in New Zealand.<br>
    I am curios of the the typeface itself. I understand there are multiple effects (and distracting lines) but the sans-seif typeface inside the angled effects is what eludes me. </p>
    <p>The face has very straight and harsh edges (hard to see with rounded effects and image quality) and an interesting C, R and D.</p>
    <p> <a class="freelinking external" href="http://imageshack.us/photo/my-images/705/photoon20111023at2307.jpg/" rel="nofollow">Victory #1</a> (White Color)<br>
     <a class="freelinking external" href="http://imageshack.us/photo/my-images/148/photoon20111024at0005.jpg//" rel="nofollow">Defeat #2</a> (Red Color)</p>
    <p>Thank you for your time,<br>
    ~Dylan Jones</p>
