  html: "<p>Is there a problem: <br> <br>1. to design a type in PostScript and to generate the type as TrueType? (the TrueType is going to be with same size of the em-square 1000; and not the power of two 1024 etc etc) <br> <br> <br>or... <br> <br>2. to design a type in PostScript; convert to TT with TransType?</p>"
