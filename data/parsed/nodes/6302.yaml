    html: "<p>&gt; 1000   70.71%  <br>&gt; 2048   26.83% <br> <br>Although I agree that using a power of two is no big deal (unless it's for MS), I do suspect that there are a lot more \"quality\" fonts among that 26.83% than there are among the other. So it would be nice to have a filter on those stats - but how do you measure quality? Well, I don't think you can, numerically, but here's an idea: break down each of those percentages according to the level of hinting included. <br> <br>hhp</p>"
