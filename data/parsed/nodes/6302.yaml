    html: '<p>Re 1.:  <br> <br>&gt; Why to have TT/Open Type TT when OP TT  <br>&gt; "does not work on Mac OS 8/9.."? while  <br>&gt; OpenType PS "works on Windows, Linux,  <br>&gt; Mac OS 8.6, 9. and OS X".  <br> <br>There are issues and problems with OT TT and with OT PS.  <br> <br>The downside of OT PS is that in Office 2000/XP for Windows and in any non-Adobe application running on Windows 95/98/ME, you will only get Western characters from OT PS fonts (or the multilingual characters will be problematic to access) while you will get multilingual/Unicode characters from OT TT fonts. Only Office 2003 and Windows 2000/XP/2003 are free from the mentioned limitations of OT PS fonts.  <br> <br>The downside of OT TT is that it does not work on Mac OS 8.6 or 9, and that the outlines are not stored in PostScript curves which seems important to some designers.  <br> <br>Other advantages and disadvantages of the formats are listed in the book, most notably regarding hinting.  <br> <br>Re 2.:  <br> <br>Yes, principally OpenType PS/TT helps you solve the compatibility problem, and yet, it is extremely difficult to decide between the PS and the TT flavor because of problems mentioned above.  <br> <br>Regards,  <br>Adam</p>'
    html_clean: '<p>Re 1.:  <br> <br>&gt; Why to have TT/Open Type TT when OP TT  <br>&gt; "does not work on Mac OS 8/9.."? while  <br>&gt; OpenType PS "works on Windows, Linux,  <br>&gt; Mac OS 8.6, 9. and OS X".  <br> <br>There are issues and problems with OT TT and with OT PS.  <br> <br>The downside of OT PS is that in Office 2000/XP for Windows and in any non-Adobe application running on Windows 95/98/ME, you will only get Western characters from OT PS fonts (or the multilingual characters will be problematic to access) while you will get multilingual/Unicode characters from OT TT fonts. Only Office 2003 and Windows 2000/XP/2003 are free from the mentioned limitations of OT PS fonts.  <br> <br>The downside of OT TT is that it does not work on Mac OS 8.6 or 9, and that the outlines are not stored in PostScript curves which seems important to some designers.  <br> <br>Other advantages and disadvantages of the formats are listed in the book, most notably regarding hinting.  <br> <br>Re 2.:  <br> <br>Yes, principally OpenType PS/TT helps you solve the compatibility problem, and yet, it is extremely difficult to decide between the PS and the TT flavor because of problems mentioned above.  <br> <br>Regards,  <br>Adam</p>'
