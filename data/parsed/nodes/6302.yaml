      <p>Some time ago, I did a survey on a very large set of TrueType fonts (over 22000) from a large selection of font foundries. The following is the list of UPM values found in these fonts and their percentage count.  <br> <br>Regards,  <br>Adam <br></p>
      <pre> <br>UPM    Count <br>1000   70.71% <br>2048   26.83% <br>1200    0.64% <br>4096    0.43% <br>2000    0.31% <br>1600    0.23% <br>900     0.11% <br>1100    0.08% <br>1400    0.07% <br>1024    0.06% <br>920     0.06% <br>256     0.04% <br>1800    0.04% <br>2594    0.04% <br>600     0.03% <br>1050    0.03% <br>1500    0.03% <br>400     0.02% <br>875     0.02% <br>1190    0.02% <br>3400    0.02% <br>1020    0.01% <br>2200    0.01% <br>4000    0.01% <br>Others  0.18% <br></pre>
