    html: <p>In TrueType / OpenType TT fonts, you can use ANY em-square (up to 16384). For example 200, 202, 500, 523, 998, 1000, 1024, 2000, 2048, 2049 etc. Pleae forget the neccesity of using an UPM that is a power of two!  <br>If you use FontLab or TypeTool, just design your font as PostScript and generate it as TrueType. If you wish to fine-tune the screen appearance, you can refer to Leslie Cabarga's book "Learn FontLab Fast" (<a href="http://www.logofontandlettering.com/" target="_blank">http://www.logofontandlettering.com/</a> ) for tips on the process of converting PostScript fonts to TrueType fonts.  <br> <br>Regards, <br>Adam</p>
    html_clean: <p>In TrueType / OpenType TT fonts, you can use ANY em-square (up to 16384). For example 200, 202, 500, 523, 998, 1000, 1024, 2000, 2048, 2049 etc. Pleae forget the neccesity of using an UPM that is a power of two!  <br>If you use FontLab or TypeTool, just design your font as PostScript and generate it as TrueType. If you wish to fine-tune the screen appearance, you can refer to Leslie Cabarga's book "Learn FontLab Fast" (<a href="http://www.logofontandlettering.com/" target="_blank">http://www.logofontandlettering.com/</a> ) for tips on the process of converting PostScript fonts to TrueType fonts.  <br> <br>Regards, <br>Adam</p>
