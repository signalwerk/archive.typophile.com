    html: <p>Also true for PostScript Type 1 and PostScript flavored OpenType fonts, with the caveat that regardless of the em square, all coordinates used in the font must be no greater than +- 4096 (or is it 4095, given the use of zero as a coordinate? I forget). <br> <br>IIRC, earlier versions of FontLab had a problem generating T1/OT-CFF fonts with em squares other than 1000, but I believe that restriction has been lifted. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>Also true for PostScript Type 1 and PostScript flavored OpenType fonts, with the caveat that regardless of the em square, all coordinates used in the font must be no greater than +- 4096 (or is it 4095, given the use of zero as a coordinate? I forget). <br> <br>IIRC, earlier versions of FontLab had a problem generating T1/OT-CFF fonts with em squares other than 1000, but I believe that restriction has been lifted. <br> <br>Regards, <br> <br>T</p>
