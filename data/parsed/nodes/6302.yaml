    html: '<p>Paul,  <br> <br>all fonts that Microsoft ships with Windows, Office etc. have one unified UPM size (of 2048). For Microsoft, this surely simplifies quality assurance.  <br> <br>Microsoft explains that on their web page: <a href="http://www.microsoft.com/typography/ProductionGuidelines.mspx" target="_blank">http://www.microsoft.com/typography/ProductionGuidelines.mspx</a>  <br> <br>Other vendors such as Apple or Linotype have been shipping TrueType / OpenType TT fonts with other UPM sizes for years. The value of 1000 is most common, especially if you ship PostScript and TrueType fonts from the same source. But Apple also shipped fonts with completely different UPM sizes, e.g. 400 for the Zapfino (AAT) font in Mac OS X 10.3.  <br> <br>Regards,  <br>Adam</p>'
    html_clean: '<p>Paul,  <br> <br>all fonts that Microsoft ships with Windows, Office etc. have one unified UPM size (of 2048). For Microsoft, this surely simplifies quality assurance.  <br> <br>Microsoft explains that on their web page: <a href="http://www.microsoft.com/typography/ProductionGuidelines.mspx" target="_blank">http://www.microsoft.com/typography/ProductionGuidelines.mspx</a>  <br> <br>Other vendors such as Apple or Linotype have been shipping TrueType / OpenType TT fonts with other UPM sizes for years. The value of 1000 is most common, especially if you ship PostScript and TrueType fonts from the same source. But Apple also shipped fonts with completely different UPM sizes, e.g. 400 for the Zapfino (AAT) font in Mac OS X 10.3.  <br> <br>Regards,  <br>Adam</p>'
