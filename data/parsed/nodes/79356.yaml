      <p>You say you are "designing an event taking place in the mid to late 18th century and I need to use some fonts from back then." Any signs would have been hand lettered in a wide variety of styles. Printed material, books, handbills, newspapers would have used type. We are talking about type with serifs, not sans-serif. 18th century printed pages may look lighter, i.e. less black compared to white, than 19th &amp; 20th century pages. In the mid 18th century it's too early to use "modern" i.e. high contrast faces such as Didot or Bodoni. Printer's had a large stock of "old style" faces, which varied by country.  Something like Adobe Garamond would work for most countries in the 18th century. Typefaces that we now classify as "transitional" or "baroque" are are good for representing the Enlightenment movement. Consider Plantin, everywhere, and for England, Caslon and Baskerville. Fleischman's Dutch designs were widely imitated in most countries during the last quarter of the 18th century. Bodoni light to medium weights can be used for fashionable texts from the 1780's onward. Revolutionary France can use Didot. For text in Germany and Germanic influenced areas of central and eastern Europe, Fraktur for politics and popular texts, "Antiqua" i.e. the serifed Roman types, was used for scientific papers.<br>
      BTW this is written on the fly. It's not the word of God.<br>
      Good luck with your project.<br>
      Don</p>
