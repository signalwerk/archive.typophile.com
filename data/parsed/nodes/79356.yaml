      <p>Where?  I think during the 1700's it's going to matter where you are shooting for, so to best answer the OP, I'd want to ask where do you want it to look like during the 18th century? ex: people in italy had different lettering needs than people in germany, and they were incredibly isolated, so their printing "fonts" were thick in mimicry but lack hybridization.  (language&gt; usage&gt;design elements to consider) </p>
      <p>Otherwise, something blackletter to some sort of double stroked calligraphic I'd imagine would be convincing, like  some sort of 'Ye Olde' truetype. </p>
      <p>Or, you're going Latin.</p>
