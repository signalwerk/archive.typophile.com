      <p>I know this sounds like I am nit-picking…<br>
      But France and UK are definitely not “Central Europe”. I would say that term discribes the area from Germany, Poland, Austria, Hungary, Czech Rep., Slovakia, northern Balkan, maybe western parts of Belarus, Ukraine, Romania.<br>
      There terms are anyhow socially constructed, as is the whole concept of Europe itself. Which is why I see it as even more important to include former Warsaw-Pact countries, to shape a new European understanding, which adopts the new integrated reality.</p>
