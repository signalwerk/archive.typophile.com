      <p></p><div class="imageWrap"><img src="http://typophile.com/files/KCMasterpieceLabelTypophile112896SM_3664.jpg"></div><br>
      U.S. federal trademark registration for this design was filed on September 20, 2011<br>
      <a href="http://www.trademarkia.com/kc-masterpiece-85427596.html" title="http://www.trademarkia.com/kc-masterpiece-85427596.html">http://www.trademarkia.com/kc-masterpiece-85427596.html</a><br>
      I believe this is lettering/artwork and not based on a single font.<br>
      In some ways the letters are similar to a sans with Clarendon style serifs added to the base and top of the vertical strokes. Check for example the letter-forms and terminals for C, c and e in Euro Sans Cond Bold <a href="http://www.myfonts.com/fonts/profonts/euro-sans-pro/" title="http://www.myfonts.com/fonts/profonts/euro-sans-pro/">http://www.myfonts.com/fonts/profonts/euro-sans-pro/</a> There are also similar features with some serif fonts, such as  the lobe on r Jakob Erbar's Candida, as suggested by Fivos. Also, Walbaum or Sirba <a href="http://www.myfonts.com/fonts/type-together/sirba/" title="http://www.myfonts.com/fonts/type-together/sirba/">http://www.myfonts.com/fonts/type-together/sirba/</a> for the top terminal on the s. The diamond dot on the i is a feature of some Fraktur designs.<br>
      Don<p></p>
