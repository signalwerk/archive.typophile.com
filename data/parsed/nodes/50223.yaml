    html: |-
      <p>1. I have the light and bold weights open - these weights oulines have been checked with AFDKO’s Fix Contour order, sharp angles and start points and Outline check<br>
      2. With the light weight selected, Tools - Mask - Assign font Mask, and select the Bold weight.<br>
      3. Then, Tools - Multiple Master - Define New Axis, and select weight.<br>
      4. Then select all glyphs in the light weight, Tools - Multiple Master - Mask to Master and select Wt1</p>
    html_clean: |-
      <p>1. I have the light and bold weights open - these weights oulines have been checked with AFDKO’s Fix Contour order, sharp angles and start points and Outline check<br>
      2. With the light weight selected, Tools - Mask - Assign font Mask, and select the Bold weight.<br>
      3. Then, Tools - Multiple Master - Define New Axis, and select weight.<br>
      4. Then select all glyphs in the light weight, Tools - Multiple Master - Mask to Master and select Wt1</p>
