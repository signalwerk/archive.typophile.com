  html: |-
    <p>I’m generating the intermediate weights from a MM fonts but I’ve noticed a problem with the placement of the accents in the uppercase glyphs of the bold weight that is generated.</p>
    <p>I’ve created the MM font with the light and bold weights, if I then generate the bold weight so the Generate instance weight slider is set to 1000 the font created is the same weight as the original bold weight used to create the MM font. The problem is the accents in this generated bold are higher than they were in the original.</p>
    <p>In the image the glyph on the left is the generated bold and on the right the bold that was used to create the MM font.</p>
    <p></p><div class="imageWrap"><img src="/files/Picture-2_5449.gif"></div><p></p>
    <p>After some testing it seem to only happen to the uppercase glyphs and those that are composites.</p>
    <p>If I decompose the glyphs before creating the MM font the problem doesn’t seem to happen.</p>
    <p>Is this the solution ?, do you have to decompose all the glyphs before creating the MM font ?</p>
