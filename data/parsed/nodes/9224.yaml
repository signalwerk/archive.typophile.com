    <p>I have a question with regards to the Katherine McKoy quote: 'The challenge for the graphic designer is turning data into information and information into messages of meaning. <br> <br>I have been thinking about this in detail and talking about it with other designers. The reoccuring question is: What did she mean graphic design is about:  <br> <br>Data -&gt; Information -&gt; Messages of meaning <br> <br>as opposed to <br> <br>Information -&gt; Messages of meaning <br> <br>If you could give us your own views on the quote I would really appreciate it. <br> <br>Thanks <br> <br>Marc</p>
