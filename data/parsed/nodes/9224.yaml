    html: <p>Your information has to come from somewhere. Sometimes the information you recieve needs to be reprocessed or rewritten in order to create an effective message.  <br> <br>I participated in a workshop with her a year ago and one of her biggest points centered around a very early project of hers. If I remember correctly it was a guide for janitors on how to perform certain cleaning tasks. There was a big problem with people mixing cleaning chemicals. <br> <br>She reluctantly showed us slides of the final piece, which were very clean and modern(ist) in appearance. By all standards of visual quality, it looked very nice, a very good example of information design.  <br> <br>Unfortunately, the janitors kept screwing up and mixing chemicals and the project was unsuccessful. She realized a few years </p>
