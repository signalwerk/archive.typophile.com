    html: |-
      <p>Very nice Italic and also the rest is quite handsome.<br>
      The Italic stroke has something that reminds me of Fournier but obviously the type is from a later epoche.<br>
      The g, yet, is very different from Cochin feeling (which is good I think)</p>
      <p>Stefan</p>
      <p>Sorry for not knowing anything about it ;-)</p>
