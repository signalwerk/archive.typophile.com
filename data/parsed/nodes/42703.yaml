    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 1.Mar.2008 3.55pm </div>
      <p>Type Camp has updated their site. </p>
    <p>From the site: “Type Camp can be whatever the camper needs it to be. It can be rigid, with critique comments being noted for future revisions, or it can be enriching, with a primary goal of exposure to new ideas and subject matter. It can even be a connector, with campers making friends and professional colleagues that last far beyond the event itself. We welcome you to the camp that you’ve always wanted — we welcome you to Type Camp.”</p>
    <p>- This year’s fellow instructors announced and introduced<br>
    - 4 events listed for this year including London, Galliano Island, India, and Information Design<br>
    - Registration information</p>
    <p>Type Camp London: 9-16 May 2008;<br>
    Featuring: Dr Rathna Ramanathan, Dr Shelley Gruendler, Martin Andrews and others</p>
    <p>Type Camp Galiano: 3-8 August 2008;<br>
    Featuring: Tiffany Wardle + Dr Shelley Gruendler</p>
    <p>Type Camp Information Design: 10-15 August 2008;<br>
    Featuring: Jay Rutherford, Ben Weiner + Gustavo Soares</p>
    <p>Type Camp India: 8-20 Dec 2008;<br>
    Featuring: Dr Rathna Ramanathan + Dr Shelley Gruendler</p>
    <p>For more information visit <a href="http://www.typecamp.org/" title="http://www.typecamp.org/">http://www.typecamp.org/</a></p>
