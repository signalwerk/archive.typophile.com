  html: |-
    <p>Hi gang,</p>
    <p>A colleague of mine needs help identifying the face used in the words "VITAL SPEECHES," and I'm drawing a blank. It's not:</p>
    <p>- Caslon Openface<br>
    - any of the Handtooled families from ITC (Century, Garamond, Cheltenham)<br>
    - Acanthus Open<br>
    - Narcissus<br>
    - Academy Engraved<br>
    - Monotype Old Face</p>
    <p>The A is one of the distinctive characters.</p>
    <p>(And yes, I know that the TA pair needs to be kerned, and that "of the day" is Trajan.)</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vital_speeches_4976.jpg"></div><p></p>
