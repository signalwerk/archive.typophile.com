      <p>Seo Tae,<br>
      please stop posting your translation requests. This thread is about Iris/Gaelic typefaces. This forum is about type and typography.<br>
      As <a href="http://typophile.com/node/61919#comment-393201" rel="nofollow">Ken Lunde said</a>, “there is a massive difference between 1) asking someone, or a group, to translate and/or transliterate text from one language to another as a one-time or one-off request, and 2) doing what you're doing, which clearly amounts to significant work or effort, and is thus extraordinarily unreasonable and incredibly inappropriate.”<br>
      Further attempts, here, in the <a href="http://typophile.com/node/61919" rel="nofollow">other thread</a> or anywhere else will be treated as spam, and deleted.<br>
      Thank you,<br>
      F</p>
