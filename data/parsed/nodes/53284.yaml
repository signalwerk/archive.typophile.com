  html: |-
    <p>I'm a big fan of Renner's original lowercase 'g' which was rejected and eventually replaced with the current one. Does anyone know if a Futura font exists that contains the original 'g' as a alt character? Is it available in any other form?</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/RennerG_6738.jpg"></div><p></p>
