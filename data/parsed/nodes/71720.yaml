    html: |-
      <p>Here's the original:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/temp1_6324.gif"></div><p></p>
      <p>Here's Richmond Medium Italic, sheared and smushed into compliance:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/temp2_6742.gif"></div><p></p>
      <p>And here's a 50/50 opacity, with the original in red and Richmond in blue:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/temp3_4265.gif"></div><p></p>
      <p>A few things: The top tails of the s's just aren't from the same letter. The bottom curves of the s's are very different weights. And while the verticals on the A's are the same weight, the diagonals on the A's and k's aren't. (All the letters were distorted equally.) I tried distorting just the Richmond k to get it to the right weight, but then the "&lt;" was much too far to the right and too severely angled.</p>
    html_clean: |-
