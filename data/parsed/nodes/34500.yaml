    <p>‘AvanType’ is the foundry of <a href="/node/34494" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Israeli</a> typeface designer, <a href="/node/34501" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Habib Khoury</a>. AvanType offers typefaces in the <a href="/node/14508" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Latin</a>, <a href="/node/38857" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Arabic</a>, and <a href="/node/34368" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hebrew</a> scripts.</p>
