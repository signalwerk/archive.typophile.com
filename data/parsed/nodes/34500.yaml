    <p>'AvanType' is the foundry of <a href="/wiki/Israel" class="freelinking" rel="nofollow">Israeli</a> typeface designer, <a href="/wiki/Habib%20Khoury" class="freelinking" rel="nofollow">Habib Khoury</a>. AvanType offers typefaces in the <a href="/wiki/Latin" class="freelinking" rel="nofollow">Latin</a>, <a href="/wiki/Arabic" class="freelinking" rel="nofollow">Arabic</a>, and <a href="/wiki/Hebrew" class="freelinking" rel="nofollow">Hebrew</a> scripts.</p>
    <p>URL: <a href="http://avantype.com/" title="http://avantype.com/">http://avantype.com/</a></p>
