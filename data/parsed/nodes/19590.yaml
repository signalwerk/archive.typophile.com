    <p>As I am currently doing a little bit of typo-historical research about the nameplate [was: masthead] of the New York Times, I wondered if any of you typophiles probably could help me find more sources and maybe also give me some more facts.<br>
    Here is what I found out until now:<br>
    The masthead looks basically the same since 1860 (see <a href="http://www.nytstore.com/ProdImages/NSPD1_large.jpg" rel="nofollow">http://www.nytstore.com/ProdImages/NSPD1_large.jpg</a>)<br>
    Who made the original design and when? Is the nameplate [was: masthead] based on a historical blackletter face that I could not find yet?<br>
    The masthead was redesigned by Ed Benguiat in the late 1960s (anybody knows the exact date?), and since then it has been altered and simplified (I could not find anything specific on who/when, yet I can see that the spacing has been loosened, contrast between thick and thin lines has been increased, and the scrolled terminals have been straightened).<br>
    Any hints are greatly appreciated!</p>
