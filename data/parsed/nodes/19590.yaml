      <p>Masthead: The part of the newspaper where the names of the officers, editors, etc., are listed.</p>
      <p>Nameplate or Flag: The decorative rendering of the newspaper name, on the front page, often a logo.</p>
      <p>History: The names of a ships owners were traditionally engraved on a brass plate nailed to the mast of a sailing ship in old days. The term masthead was moved from shipping to the newspapers. </p>
      <p>The term is often misused, but if Stephan is doing research, hopefully he will find this information of use.</p>
