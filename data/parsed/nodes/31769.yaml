      <p>The exact number is, of course, irrelevant.</p>
      <p>The sobering thought is that most typographers own thousands of typefaces, and use only a fraction of them the majority of the time.</p>
      <p>The important thing to remember is that, like wine, while you probably only NEED a few varieties, there will always be new and vibrant examples created.</p>
