    html: |-
      <p>Fonts Fonts = <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a>s?</p>
      <p>Are you asking how many <em>typefaces</em> exist or how many <em>fonts</em> exist? I hesitate to get into a longwinded discussion here about nomenclature (again!) but for the sake of your question:</p>
      <ul>
      <li>A <a href="/wiki/typeface" class="freelinking" rel="nofollow">typeface</a> is a specific design of an alphabet. It usually refers to an entire typeface family, such as Palatino or Helvetica.</li>
      <li>A <a href="/wiki/font" class="freelinking" rel="nofollow">font</a> refers to the actual files which enable the typeface to be set <em>or</em> to an individual weight, width, or style of the typeface.</li>
      </ul>
      <p>The number of digital typefaces in existence is difficult to estimate, but it's probably less than 50,000. The number of digital fonts is certainly greater than 100,000. (FontShop's database alone contains more than a hundred grand).</p>
      <p>Then, of course, you'd also have to specify whether you wish to count <em>all</em> typefaces or digital typefaces only. At this point you'll start to realize it's really too difficult a thing to count.</p>
