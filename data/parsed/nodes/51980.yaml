    html: |-
      <p>A few thoughts:</p>
      <p>- I'm not sure the slanted crossbar of e is working in this grotesque face.<br>
      - Where rounded forms merge into straight stems, I think the combination of the thinned stroke and the ink-trap like cut are too strong - they seem to sever the rounded stroke. (I wonder if the "inktrap" should bite a bit into the straight stroke as well?)<br>
      - Shouldn't bottom of b angle away from bowl (compare a and d)?<br>
      - Leftmost stroke of A is too thin.<br>
      - Round dots of 'i' with square period is a bit weird to my eye.<br>
      - Your space character may be too wide, making the font's function in running text more difficult to gauge.</p>
