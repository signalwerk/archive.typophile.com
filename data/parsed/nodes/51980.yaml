    <p>Hello all, though it is still early in the process, I still want to show this before I continue. It'll be obvious that I'm looking at the forms of Franklin Gothic for cues. Every now and then I feel like it's not original enough. So I ask you, trained experts — is this too similar to Franklin Gothic? In the end, I hope for it to be a strong but friendly and soft, grotesque face. I'm thinking it'll have more personality once I get to the bold/black weights. Should I just jump to those instead and neutralize the unique features for the text weights?</p>
