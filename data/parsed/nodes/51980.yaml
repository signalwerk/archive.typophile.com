      <p>Maybe <em>more</em> slant on the e crossbar would work, then - so it's clearly a design feature rather than a misprinted letter. Look at <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>'s e (the first example of a sans with such a feature than comes to my mind) - a much more assertive angle.</p>
      <p>Maybe someone else will weigh in on suggestions for the W - I agree it needs work.</p>
