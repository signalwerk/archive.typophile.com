    html: <p>Thanks for the comments, eliason. I really want to make the slanted crossbar of e to work. It gives an almost casual feel the whole face. Any ideas on how to work on that? I'll definitely take a look at the convergence of round to straight. It was my goal for it to have a smooth, monolinear quality, it's important not to sever the strokes. The W is bothering me, too but I can't seem to find good examples of that shape. Any recommendations would help.</p>
