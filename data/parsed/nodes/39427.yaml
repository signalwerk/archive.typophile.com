    html: |-
      <p>Hi cassie.</p>
      <p>I'd go with #1 on the front but I'd change the back to match the front. What I'd like you to consider for the back to match the front is to introduce some font play in it. You use three different fonts on the front, but only one on the back.</p>
      <p>And why #1? Because the symbol is still a symbol and not a background pattern/item. #2 emphasizes it the most. Maybe a bit too much because it becomes overwhelming and makes people recognise the symbol but can't relate it to any trademark.</p>
      <p>And I guess that word "graphic" isn't necessary. Design is enough.<br>
      "cassie forrington design" is a trademark name. When "graphic" word is used, then "cassie forrington" become a trademark name with an explanation of "graphic design".</p>
      <p>Of course it depends what you want to achieve here.</p>
