    html: "<p>I like working with local printers, so you can see the proofs without too much of a hassle. Look up some letterpresses in your area, and then work with them to find papers you like. You don't need anything dazzling. I'd say fairly smooth, but not glossy, and bright white. It would be nice if you can pay for 160 lb cover stock. That way it's a really hefty card {ethos! : ) } and you won't get impressions from the opposite side of the card. It's pretty expensive, though, so if you choose against it, your printer will be able to recommend something else for you. Prices also depend on what he may have in stock, so it's best to work that out with him (sorry, and/or her). : )</p>"
