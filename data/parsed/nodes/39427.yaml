    html: |-
      <p>Hi Cassie,</p>
      <p>I like #2 the most —&nbsp;the composition is interesting, yet not too crazy for the classy style you're going for. What doesn't work for me is your name treatment; I don't think lowercasing it and closing it fits well with the back of the card, where everything is simply typed out. I'd say either more variation on the back, or (better yet) the front is also typed out quite simply. It's your name; it should be very clear and clean. Ethos is an important aspect — you can have your name treatment project authority and simplicity. </p>
      <p>I'm not sold on the typeface either. Is it Mrs. Eaves? It's nice, but it's a bit overused. Not bad, I just wonder if it can be better. Something slightly updated, but still serif. And then I wonder if, in addition to the old-style figures, you can have another special treatment here &amp; there. I would love the text to feel really crafted, fitting your beautiful traditional esthetic. </p>
      <p>Also your mark at first seems a bit arbitrary, like any old pretty thing — but then I see C's in it! It's a great discovery. Did you intend that? It's beautiful. Anyway, my 2 bits.</p>
