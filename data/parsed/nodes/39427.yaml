    html: |-
      <p>Thanks for all the input! Looks like I have some decisions to make...</p>
      <p><em>I think this would suit the conservative and refined style of your design better.</em></p>
      <p>I'm not sure that I want to be 100% conservative. I'd like to find a way to mix a contemporary type treatment with a more simple, traditional composition, but I guess I haven't gotten there yet. I definitely haven't spent enough time on the type on the back (in any version)...</p>
      <p><em>Is it Mrs. Eaves?</em></p>
      <p>Yes, it is. I chose it because my mark is constructed out of MrsEaves italic c's and f's, so I feel it best complements the mark. I'm also using Johnston for the sans. I used the treatment that I did on my name mostly because of the italic f, to reference the mark. Not necessary?</p>
      <p><em>I would love the text to feel really crafted...</em></p>
      <p>:) Yes! That is exactly what I need, and want. As soon as I know which one I'm going with, that will definitely be my next step.</p>
      <p><em>Are these going to to be handset or lettepressed via a plate?</em></p>
      <p>Probably with a plate. That's an interesting idea... making a sort of series with a few different layouts. I've seen business  card series before, but I'm worried about having too many different compositions, just for the sake of consistency. But it's definitely something to think about. Thanks for the idea about setting each as a separate block, I didn't even realize that was an option!</p>
      <p><em>2 is interesting, but with the added tactility of the letterpress process, I think you might have a bit too much going on with the stroke.</em></p>
      <p>I was hoping the stroke would help accentuate the tactility. It's offset slightly from the mark on purpose, and I know it may be even more slightly off with the registration of the letterpress, which I like. I feel the layers add a nice depth, although I am worried that it detracts from the mark too much to be worth it.</p>
      <p>So it seems like the general suggestion is to set my name more traditionally? Or should I keep trying to make the contemporary+traditional thing work?</p>
      <p>Looking forward to more feedback!</p>
