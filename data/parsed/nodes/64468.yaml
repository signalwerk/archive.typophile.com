    <p>There's something I'm trying to wrap my head around, and not quite succeeding.</p>
    <p>Many "free fonts" either:</p>
    <p>1) Do not permit modifications, or<br>
    2) Require one to change the name if the font is modified</p>
    <p>How does this interact with web font services like TypeKit and Kernest, which offer such fonts? Do we choose to believe that an EOT wrapper is not a modification? What about subsetting?</p>
    <p>I'll note that fonts embedded in PDF are usually subsetted, but most fonts actually used in the world do not permit modifications in their license terms.</p>
    <p>Comments welcome. I'm especially interested in the opinions of people who are licensing "free fonts" under such conditions.</p>
    <p>T</p>
