      <p>I'm not really following this. Typekit or whatever similar service still has to sign an agreement with the owner of the "free font," don't they? Well, let me put it this way: If the free font license doesn't allow something that a font subscription service does, then the font subscription service has to make an agreement with the font owner before serving the font, otherwise they are very simply violating the license.</p>
      <p>I don't know what Typekit or Kernest or anyone else is doing, legal-wise, but I think it would be wise to get explicit permission from a font owner to serve their font, regardless of how permissive their standard license seems to be.</p>
