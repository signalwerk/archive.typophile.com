    html: |-
      <p>&gt;...which may be outside the control of the folks doing the font serving anyway.</p>
      <p>TP is referring, I think, to the way @font-face works in CSS. The font file is given a font-family name, an alias of sorts, which doesn't need to reference anything within the font file.<br>
      The web author can choose any font-family alias for the file the service company is providing. Kernest, for example, suggests a default font-family alias, but you're not bound to it.</p>
      <p>rich</p>
