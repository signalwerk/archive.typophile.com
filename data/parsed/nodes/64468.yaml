    html: |-
      <p>@TP</p>
      <p>&gt;it might actually matter<br>
      Yes, of course it does. If and when you try to enforce the provisions. If Typekit or Kernest are violating EULA's the licensors do have remedies they can pursue. A EULA is a private contract and enforcement is, and rightfully should be, a private matter.<br>
      You can try until the end of time to explain to average folks that the software product they are buying is not the product itself, it's only the license to use it, subject to a list of restrictions, and they will still not understand that because it is so counter-intuitive. I, being quite average, have trouble understanding it on an emotional level, myself. If I can't use the software in a manner that makes sense to me, as defined by me, why are you offering to sell it to me?<br>
      In patent law there is the concept of patent exhaustion - once you've paid money for a patented thing, there is an implied license and you can do what you want with it. Perfectly intuitive. Once I pay money for something, I own it. Done.</p>
      <p>I'm being flip because EULA's <em>can</em> be quite comical. The iTunes EULA says, in capital letters, too, that the software:<br>
      IS NOT INTENDED FOR USE IN THE OPERATION OF NUCLEAR FACILITIES<br>
      Try wrapping your head around that one. iTunes, this is.<br>
      There's so damned much convolution I don't think there's any possibility of unscrambling it without Federal legislation. A EULA is a contract and a contract can say anything you want. And it's a one-way negotiation.</p>
      <p>Regards, Rich</p>
