    html: |-
      <p>@thomasphinney and abattis:</p>
      <p>TP, when I first read your post my feeling was, "More talk about how many angels can dance on the head of a pin."<br>
      Licenses. Legal bull. Sick of it.</p>
      <p>But now I'm trying to wrap my head around the same things.<br>
      No choice. Last night I was reading the SIL OFL.<br>
      Thanks for the info, abattis.</p>
      <p>With Typekit, I have no way of knowing if their EULA agreement is the same as is being offered to me when I buy the font. Right?<br>
      But anyway, I think that the bottom line for Typekit, Kernest - or anybody for that matter - is the "Am I In The Clear?" question. Does it seem like the intent of the creators is that I can do the particular thing I'm looking to do without a take-down notice arriving at my ISP. I've got enough problems, thank you. <strong>And</strong> I want to do the right thing by the font's creators and anybody who downloads it and plays around with it. If it's a sub-set, it should say so.</p>
      <p>Is it unwise to say that, as a rule of thumb, if you are modifying the original file in any way you should, at least, modify the name and/or make a notation in the version string?</p>
      <p>Don't know. Anybody?<br>
      (And then of course, making a notation that you've modified the file is, in itself, a modification. I would speculate that at least 400 angels can fit on the head of a pin. Maybe as many as 500. :-) </p>
      <p>rich</p>
