    html: <p>My understanding from conversations on the OFLB mailing list with Nicolas Spalinger, co-author of the SIL OFL, is that EOT conversion is seen a 'modified version of the file' and therefore requires renaming; a subsetted font file is also seen as a modified version.</p>
