      <p>Probably a Garamond, and <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/garamond-premier/" rel="nofollow">Adobe Garamond Premier</a> seems very close, at least for the caps. </p>
      <p>The italic is another story. That doesn't look like any Garamond, so I think they mixed fonts.</p>
      <p>- Mike Yanega</p>
