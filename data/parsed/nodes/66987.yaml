    html: |-
      <p>I have often complained about italics as being especially hard to ID because most sites show the Roman face until you burrow down into each family. I think FontShop is one exception that shows all faces that meet the search condition.</p>
      <p>This is one time when a book is better than most web sites. I thought about having a Serif  &amp; Sans Italics Guide, but I don't think I can handle another Guide right now.</p>
      <p>- Mike</p>
