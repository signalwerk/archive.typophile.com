      <p>My main thought with newsprint &amp; inkjet printer was that I could pump out proofs whenever I wanted.</p>
      <p>But as has been suggested I’m better off getting a proof into an actual print run. This has the added benefit of being able to see how the design will perform on heavier-inked and lighter-inked sheets. I’m liking the sound of this method more and more.</p>
      <p>Thank you all for your responses, they are quite helpful.</p>
