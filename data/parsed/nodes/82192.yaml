    html: <p>When you are testing for a newspaper, you are testing the total combination of variables, not just paper.  There is no point in bothering with inkjet on newsprint, whatever it is, it is nothing like what the real thing will be.  You might try making some test words in your font with minor variables such as, ink traps, small weight changes, join angle.  That way, when you make your on-press test with the real magilla, you will be able to see what effect any or all of these minor changes make in print.  You go from just knowing it is a bit off to having a clue how to fix it.</p>
