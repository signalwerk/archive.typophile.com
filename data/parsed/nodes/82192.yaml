      <p>A while back when I became curious what Patria would look like in a newspaper I tried just that. I bought "newsprint" paper and ran it through my inkjet. The bleed was out of control. So it's like people are saying here. And really, it's not too hard to swing some inclusion in an actual newspaper issue.</p>
      <p>HOWEVER, I can imagine a way, for somebody who needs quick iterative proofing showing something that comes close to the final product:</p>
      <p>Get the font your target newspaper is currently using, and instead of using newsprint in your inkjet find a paper stock that gives very close results to the real thing when printed on your inkjet. Then use that paper with your proposed font to proof away!</p>
      <p>hhp</p>
