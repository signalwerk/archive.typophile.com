    <p>I’m in the process of redesigning a newspaper, and I’m wondering if there is a way I can more accurately print proofs. Crisp laser printouts are nice, but I want get a feel for how the design will work in its ‘native’ media.</p>
    <p>Does anyone have experience putting newsprint through an inkjet printer? Can it be done effectively? I’m pretty sure I can get some of the same paper the news is printed on.  </p>
    <p>My other alternative is to experiment with type in a house/fill ad that runs in the actual newspaper. This is probably most accurate, but totally up to chance, and only available once a week.</p>
    <p>Any advice or information is most appreciated. Thanks.</p>
