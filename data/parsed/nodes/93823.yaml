  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gilels_6696.jpg"></div><br>
    One of the reasons I collect old record albums is the covers.<br>
    Many classical albums from the 1950s and ’60s have spot color and interesting card stock.<br>
    The Angel label is often good for foil embossing, or perhaps a black dowel along the inner sleeve edge, to help extricate it.<br>
    Here’s one I picked up recently, designed by Atelier Cassandre in 1957.<br>
    Presumably the lettering is by the master (slightly anticipating his YSL logo with its overlapping letters, and perhaps Avante Garde, with the skewed M).<br>
    The stock is off white and matte, and the title colour burnt sienna, a scheme often found in type specimen books of the early and mid twentieth century.<br>
    The fact that it only cost me a dollar, the record is in good condition, and Gilels’ playing astonishingly ﬂuid, is a bonus!<p></p>
