    html: |-
      <p>Thanks for the feedback, much appreciated.</p>
      <p>The general problem with the lightening of the glyphs is that there is not one treatment that will work for both small and large sizes. If some glyphs look too light at large size they may still be too heavy at small size. I should therefore probably make a choice and go for large and not try too hard to make the black work at small size.</p>
      <p>@eliason: As to the baseform of the glyphs: there is no logic in them other than my own liking, and my likings are not very logical at all. Traditionally there are lots of varieties of each character but they all belong to certain style classes and these classes are generally not supposed to be mixed up. So very often it’s like: if the a looks like this then the e has to look that and the g like that. Or if you use that p you shouldn’t use that f. As devious as I am, I sometimes like to challenge these systems and go by curiosity rather than rule ;-)</p>
      <p>I agree that the black t needs a slightly larger top and I will look into the high tittles too, although until now I thought they gave a nice lively feel. The single storey a and g are present already! Just not in these samples. Attached another one.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/samp_6114.png"></div><p></p>
