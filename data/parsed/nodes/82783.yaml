      <p>These do work well small.</p>
      <p>The letters you appear to have lightened for overall balance are in some cases lightened too much I think (the /a/ and particularly the /g/). Maybe widen the upper bowl of /g/?</p>
      <p>The tittles seem awfully high relative to the ascender height. I'm not sure that tiny stroke shape is better than the circle I expected to find.</p>
      <p>I don't quite get the intended structure of the /e/--I feel like it straightens out and gets curvier as it goes around without clear logic. </p>
      <p>The /t/ needs a higher stroke above the crossbar in the Black, I think.</p>
      <p>FWIW the name Klarendal makes me half expect some relationship to Clarendon fonts...</p>
