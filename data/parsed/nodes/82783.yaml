      <p>Alex, I'm a fan of Engine and Roice. They aren't exactly versatile typefaces, but once in a while there is a need for a simple, informal thing that doesn't have any direct connotations and they fit perfectly. This happened a couple of years ago when Marian Bantjes asked me for that very thing. She was designing a spread for “<a href="http://www.bantjes.com/i-wonder/about-book" rel="nofollow">I Wonder</a>” and I recommended FF Roice. “Perfect”, she said.</p>
      <p>Naturally there is value in a Roice with fewer quirks, as long as you don't get too typographic/straight-laced with it. I think you're on the right path. I think the Black is problematic. Maybe stop one weight short of that one.</p>
