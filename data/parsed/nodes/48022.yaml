    date_raw: 3.Aug.2008 5.44pm
    votes: null
    html: <p>Closest I can think of would be Epitaph, digitized by Jonathan Smith as <a href="http://www.dafont.com/gyptienne.font?text=CUBA" target="_blank">Gyptienne</a>, and a mix of characters from the regular and alternate fonts of <a href="http://www.myfonts.com/fonts/spiecegraphics/quaint-gothic-sg/" target="_blank">Quaint Gothic</a>.</p>
