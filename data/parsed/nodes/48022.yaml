    html: "<p>It’s a poster from the book “Cuba Style: Graphics from the Golden Age of Design.” Didn’t know if someone out there had digitized this typeface, or if there’s even anything similar. I looked on Letterhead fonts, thinking this would be my most likely source, but to no avail.</p>"
