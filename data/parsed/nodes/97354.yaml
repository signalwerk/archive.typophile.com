    html: <p>It looks like you don't actually have letter outlines in those slots (since the x appears gray rather than black in the font window). Did you accidentally design letters in the mask layer rather than the main layer (or accidentally switch the layers)?</p>
    html_clean: <p>It looks like you don't actually have letter outlines in those slots (since the x appears gray rather than black in the font window). Did you accidentally design letters in the mask layer rather than the main layer (or accidentally switch the layers)?</p>
  - id: 526996
    user: 1215
    date: 2012-10-19T12:00:00
    date_raw: 19 Oct 2012 — 12:00pm
    votes: null
    html: |-
      <p>I don’t mean to be rude, but have you checked the manual?</p>
      <p>Granted, the manual is long and of limited usefulness overall, but you should at least read enough to get a basic orientation. That is what it’s there for, to help beginners get started.</p>
      <p>From the gray appearance of your ‘x’ in the Font window (in the background of your image), it looks like you might have drawn your outlines in the Mask layer, which won’t display in the Metrics window. You should be drawing in the Outline layer.</p>
      <p>[ Edit: looks like Craig beat me to it, while I was previewing ;-) ]</p>
    html_clean: |-
