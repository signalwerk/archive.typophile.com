      <p>Does this happen with the one font only?</p>
      <p>If I had such a question, I would open the font in FontLab, copy the outlines to the mask, delete the mask, delete the kerning and generate the font. (Or I would destroy the outline with an effect filter.) Then I would check, if the problem still is there. If yes, I would post the font file here. It is much easier to detect problems with a font, if you have the font. I don’t have Office installed, but for sure other member, maybe even the same version as you. And sometimes it is not necessary to have the same program installed, if you want to make out, where the problem is.</p>
