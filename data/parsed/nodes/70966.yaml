    <p>I just tested a font in an old PC with Word.</p>
    <p>The font works fine, but in the font menues (in word) the .notdef character is displayed a couple of times AFTER the fontname.</p>
    <p>For instance it looks like this if I hade the bullet as notdef.</p>
    <p>Myfont Regular ••••••••<br>
    Anyone knows why?</p>
    <p>Thanks in advance.</p>
