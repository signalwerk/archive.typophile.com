      <p>a.alt doesn’t fit in (too light, too grot). If you would like to have a two-storeys a, you should look at Kabel’s.</p>
      <p>In general, I like it. The question is: how it differentiate itself from other similar designs? (but it could well be a non-problem, maybe you just want/need your own black geometric typeface)</p>
