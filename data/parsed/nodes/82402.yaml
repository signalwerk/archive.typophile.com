    votes: null
    html: |-
      <p>Stephen: Thanks for the links. Metric was a new one to me. Luckily, it too has blunt corners. </p>
      <p>You're right cerulean, about those glyphs. After a few days break and with fresh eyes I found a couple of more points:<br>
      - Cross-beams of both /Q's are too heavy<br>
      - /z a little too heavy<br>
      - /f a little top heavy now maybe?</p>
      <p>I'm starting to see lowercase glyphs based on the circle, as too heavy (/a, /b, /d, /g, /p, /q, /g.alt). Is it just me?</p>
      <p>Sharp overshoots of /A, /M, /N, /V, /W, /M.alt and /W.alt seem a little too much. Those pop out in large point sizes, but blend in more in smaller sizes. I guess I found out why true sharp angles are not favored; a small cut at the tip might balance the overshoots when used in various sizes. </p>
      <p>I'm really worried about the overall color of the text and the proportions of some glyphs. /w.alt should be wider, and also both /e's. I'm on the fence with the width of /y.</p>
      <p>I'll run a few tests next...</p>
