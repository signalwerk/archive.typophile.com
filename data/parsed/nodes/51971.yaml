    html: |-
      <p>To answer the specific question: If I didn't want to use class-based kerning, here is what I'd do. (I use Vedit, but I'd bet Edit Pad Pro can do the same thing.)</p>
      <p>Kern the caps. Be sure the lower-case letters are in the .vfb, but don't bother to kern them.</p>
      <p>Write off an .AFM</p>
      <p>Grab all the KPX lines &amp; put them in another buffer.</p>
      <p>Select all and change the case.</p>
      <p>Search the string "kpx" and replace it with "KPX".</p>
      <p>Paste these "new" kerning pairs back into the .AFM.</p>
      <p>Go back to FontLab, import the .AFM &amp; select "replace all kerning."</p>
      <p>You can do this faster than I can write this post.</p>
      <p>FWIW</p>
