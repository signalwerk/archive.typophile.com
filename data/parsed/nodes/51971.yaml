      <p>The only reason why I can see anyone wanting to duplicate uppercase/lowercase kerning is if you were creating an all-caps face with the glyphs duplicated in the lowercase position.</p>
      <p>In such a case, I'd think it would be easiest to simply create the uppercase characters and assign each of them two code points (e.g. assign A to both 0x0041 and 0x0061). I've read a number of times that doing things this way is actually a bad idea, but I've never really seen a satisfactory explanation as to why its a bad idea. I was wondering if anyone could enlighten me on this.</p>
      <p>André</p>
