      <p>That's a clever solution, Charles, but assumes that the kerning is finalized. Class kerning has more set up, but once it's done, it gives you a lot of flexibility in the kerning process.</p>
      <p>By the way, Adam: I just thought of a feature you should add to FontLab that would make setting up classes even easier. How about a command for making a new class based on glyphs selected in the Font window? You select a bunch of glyphs, choose "New Class..." from, say, the Glyph menu. A dialog appears with the glyphs displayed, a text field for the class name, a pop-up to choose the kind of class. For kerning classes, it would have some way to select the left/right of pair option and which one is the key glyph. Maybe you just drag it to the beginning of the glyph list.</p>
      <p>Or, maybe you could enhance the current Kerning Assistance dialog by having it use whichever glyphs are selected in the Font window as the basis when you click on the little "New" button to create a new kerning class?</p>
