    <p>is there a way to automatically make fontlab apply the exact same kerning values i have set for uppercase to lowercase?</p>
    <p>i've searched around and found a great post by mark simonson that explained how to do it fontographer but i can't seem to find anything similar for fontlab.</p>
    <p>the kerning assistance panel in fontlab confuses me to no end.</p>
    <p>any help would be amazing!</p>
