    html: |-
      <p>André, </p>
      <p>In Type 1 fonts, you have to duplicate the glyphs as Unicode codepoints are not used at all. </p>
      <p>In OpenType PS (.otf), there are quite a few situations where applications rely on glyph names rather than on Unicode codepoints. In some PDF creation scenarios where OpenType PS (.otf) fonts get converted to Type 1 fonts. In such scenarios, the original Unicode character strings of the text are lost, and also the glyph-to-Unicode information (the "cmap" table) is lost. The only carrier of text information are the glyphnames associated with the glyph stream. Tools such as Acrobat use that information to reconstruct the original character string, which is necessary for operations such as Find or Copy-Paste. Note that more "intelligent" PDF creation engines may include additional resources in the PDF file that store the original Unicode text.</p>
      <p>In OpenType TT (.ttf) fonts, the approach with not duplicating the glyphs but assigning multiple Unicode codepoints is fine. </p>
      <p>A.</p>
