    html: |-
      <p>What you need to do is set up kerning classes. Open the Classes panel, click on the "+" pop-up menu in the lower left-hand corner, and choose "New Kerning Class". This will create a new kerning class with a dummy name such as "_kern1". </p>
      <p>In field at the the lower right, change the name to something more meaningful to you such as "_A", but make sure it starts with an underscore or it won't be processed properly. (The underscore indicates that it's a kerning class, not some other kind of class.)</p>
      <p>You set up the class by indicating a key glyph ("A" for example) by adding a tick mark (apostrophe) after, and then list the names of the glyphs with which you intend to have the same kerning ("a" for your case). In your case, it should look like this:</p>
      <p><code>_A: A' a</code></p>
      <p>A more complete one would look more like this:</p>
      <p><code>_A: A' Aacute Agrave Acircumflex Adieresis Aring Atilde a aacute agrave acircumflex adieresis aring atilde</code></p>
      <p>When it looks the way you want, click on the "Accept" button (very important--if you don't, whatever you typed in will be lost). The glyphs you chose will populate the field at the upper right of the panel. If you've mistyped a glyph name, it will simply not show up, so it's a good idea to compare the two fields.</p>
      <p>Finally, you need to tell FontLab whether this class applies to when these glyphs are on the right or left or both sides of other glyphs. You do this by checking the little boxes to the right of the class name in the list at the top left. The dot in the center indicates the glyph that this class is sitting next to in a string of text. If this class should only apply when it's glyphs are the <em>left</em> side of a kerning pair, then click the left check box, or right box for the right side of a pair.</p>
      <p>After you set up your kerning classes, FontLab will automatically apply kerning to all members of class based on the kerning you apply to the key member in the Metrics window. If you choose "Class Kerning" from the "Options" pop-up menu at the bottom of the Metrics window, any kerning you apply to any member of a class will be applied to the key glyph, instead of to the member glyph.</p>
      <p>I hardly ever use the Kerning Assistance dialog, except to update the kern OpenType feature based on the current kern table. The Kerning Assistance dialog allows you to do some of the same things you can do in the Classes panel, but I find it to be less handy.</p>
      <p>The manual goes into all this stuff in more detail.</p>
