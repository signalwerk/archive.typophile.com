    <p>Hi All,</p>
    <p>I have just given a folder of font by a friend - however the formats are unrecognizable in my Mac OS X 10.6. The files are all in .afm .inf .pfb .pfm formats and I could not find the TrueType or OpenType format at all.</p>
    <p>I have looked up on Google, they said it's a kerning format, etc.<br>
    But I need help on how to compile all of them into the .ttf format? So that I can use this typeface.</p>
    <p>Thanks so much.</p>
  html_clean: |-
