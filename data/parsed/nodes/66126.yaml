      <p>Note that:<br>
      1) It's possible that these are illegal copies of fonts.<br>
      2) Quite often conversion from one format to another is<br>
      not allowed in a font's license. On the other hand, I'm<br>
      of the opinion that if a font is legally owned and the<br>
      resultant conversion stays on the hard disk of the font's<br>
      owner, it's OK.</p>
      <p>hhp</p>
