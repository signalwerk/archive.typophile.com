      <p>Mark: <em>‘Windows PostScript Type 1 fonts have not been supported by any version of Mac OS [...]’</em><br>
      &nbsp;<br>
      The Adobe font engine supports PS Type1 for Windows also on the Mac though. Dropping the files in the applicable fonts folder should do the trick for the Adobe apps.<br>
      &nbsp;<br>
      Hrant: <em>‘I'm of the opinion that if a font is legally owned and the resultant conversion stays on the hard disk of the font's owner, it's OK.’</em><br>
      &nbsp;<br>
      We will ad a special ‘Hrant clause’ to our EULA then ;-)</p>
