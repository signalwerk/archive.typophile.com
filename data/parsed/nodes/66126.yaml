    html: |-
      <p>These are components of a Windows format PostScript Type 1 font. Some of them have also been of use on other platforms.</p>
      <p>.afm = Contains spacing and kerning info for a font. Not used normally in Windows, except in special situations.<br>
      .inf = An informational file used by some older MS-DOS programs.<br>
      .pfm A file similar to the .afm, required by Adobe Type Manager (ATM) for Windows.<br>
      .pfb The file that contains the actual font outlines for use with Windows.</p>
      <p>Only the second two are normally needed to use a Type 1 font on Windows.</p>
      <p>Windows PostScript Type 1 fonts have not been supported by any version of Mac OS (or even the Mac version of ATM). You will need some sort of conversion utility or font editor to make them usable on a Mac.</p>
