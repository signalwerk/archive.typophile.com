    <p>So I've been tasked with designing a small fashion magazine. They are on a pretty tight budget, so unfortunately I can't spend a lot on fonts.</p>
    <p>I have Calluna for the body copy, it's a nice font and the price was right.</p>
    <p>What I am looking for is a font for the display. Does anyone have any suggestions?</p>
    <p>I've been experimenting with Otama e.p. ( <a href="http://freetypography.com/2011/09/29/free-font-otama-e-p/" title="http://freetypography.com/2011/09/29/free-font-otama-e-p/">http://freetypography.com/2011/09/29/free-font-otama-e-p/</a> ) but I worry that not having italics could be trouble down the road.</p>
    <p>I've also been trying Cicle ( <a href="http://www.fontsquirrel.com/fonts/Cicle" title="http://www.fontsquirrel.com/fonts/Cicle">http://www.fontsquirrel.com/fonts/Cicle</a> )</p>
    <p>Anyway, any advice would be appreciated!</p>
