  html: |-
    <p>I would like to submit a screenshot from my computer (PowerPC G4 - MacOs 10.4.11) because my FontLab decided to stop working this morning, and I tried everything I could think of, from erasing the preferences to uninstalling-reinstalling the program, but I still can’t manage to open FontLab.</p>
    <p>It’s strange because I’ve had it working for more than a year, on this same computer, with no problem at all. </p>
    <p>It worked untill last night, but when I opened it this morning, this is what i got: no file opening, no bar on top, just the chance to quit the program, and when I do that it crashes.<br>
    </p><div class="imageWrap"><img src="/web/20080705162143im_/http://www.typophile.com/files/fontlab-problem_5608.jpg"></div><p></p>
