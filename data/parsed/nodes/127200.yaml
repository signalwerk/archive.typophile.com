      <p>I tried in the font identification website <a href="http://en.likefont.com">http://en.likefont.com</a> and there are 1944 matched fonts in total, and the most similar font is HelveticaNeueLT Com 83 HvEx Regular.<br>
      This is my identification result page for your image: <a href="http://en.likefont.com/community/2579320/">http://en.likefont.com/community/2579320/</a></p>
