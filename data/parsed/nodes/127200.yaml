    html: |-
      <p>THE BEATLES is Filmotype Washington, which sadly has not had a proper digital revival:<br><a href="http://luc.devroye.org/fonts-27506.html">http://luc.devroye.org/fonts-27506.html</a> [search the page for a sample]</p>
      <p>OPTI-Castcraft had a bootleg version of it, but use with extreme caution:<br><a href="http://opti.netii.net/fonts-w/index.htm">http://opti.netii.net/fonts-w/index.htm</a></p>
      <p>Dave Bailey did a much better revival, but it doesn’t appear to have been released yet:<br><a href="https://dave-bailey.squarespace.com/typeface-design/#/filmotype-washington/">https://dave-bailey.squarespace.com/typeface-design/#/filmotype-washington/</a></p>
