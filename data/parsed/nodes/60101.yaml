      <p>Sometimes it's good to come up with the worst possible logo ever. Just go nuts - scribble with crayon, use Papyrus and Comic Sans, whatever. Then, either a) you'll accidentally stumble upon something that works or b) you can fix the mistakes in your fake logo and in the process maybe come up with something that works. Or you could just end up with a really bad crayon rendering of Papyrus :-)</p>
      <p> - Lex</p>
