      <p>Not to sidetrack this thread too much, but I've always loved the Civic logo and wish they'd use it on the cars (to date, the on-the-car version is still a very bold, pointy thing). I love that sorta-anagram Zlatko put up. Both remind me of one of my all time favorite logos: <a href="http://upload.wikimedia.org/wikipedia/commons/d/dc/Nine_Inch_Nails_logo.svg" rel="nofollow">Nine Inch Nails' famous NIN</a>.</p>
      <p>The middle of E, S, and E aren't align with each other in the current RESET version. And what about taking off the wings of that arrow (the fins?) and simply leaving it as a clean spear point? Would match the straight edges of the rest of the type in my eyes.</p>
