    html: |-
      <p>There are several 'signature' elements in this font (duh!), but the closure of the C, oblong O, and the style of R are proving to be an elusive combination for me. We even see the G, M and Q, which you think would help nail it, but so far I have not found a match.</p>
      <p>This site doesn't strike me as a place that would be getting custom font work done, so this is probably sitting out there somewhere, but so far my best (poor) match has been <a href="http://www.fountain.nu/catalogue/ketchupa_reg.asp" rel="nofollow">Ketchupa</a> from Fountain. Most shapes are OK, but the R is wrong and the 1 isn't right. I like Ketchupa because the edges are softened, but that is also unlike the posted sample. I told you it was a poor match.</p>
      <p>- Mike Yanega</p>
