      <p>EXTRA EXTRA READ ALL ABOUT IT =)</p>
      <p>Coming 'round back to this.<br>
      At last, recently I have discovered the ID of this font. I felt like a character in a Dan Brown novel unraveling the shrouded mysteries that cloak this font. Well I finally have my answer.<br>
      It's called Vibration, and its a FontBureau font, originally created for VIBE Magazine. It's not available on the site, but they will sell it to you over the phone. I hope this info helps some of you, and for those that have helped along the way, I also thank you.</p>
