      <p>Hey Paul</p>
      <p>I find it fascinating that you're posting this now; I meant to respond to it earlier. This is the subject of a master's degree I'm working on at the moment – never mind a first essay at Reading! (if they're in order, congratulations, BTW)</p>
      <p>Practically and conceptually speaking I have found this topic a real struggle and I think what you're attempting with the wikipedia info boxes for typefaces is very ambitious (possibly overkill for 'typical' wikipedia audiences as Don McCahill says). There are so many variables, and if you mean to apply it to all typefaces, well, an infinite range of subjects. Of course if you succeed with it we'll all be very grateful!</p>
      <p>In the course of my studies I was inspired by much of what was said in the old typophile thread from early 2005</p>
      <p><a href="https://web.archive.org/web/20150123085459/http://www.typophile.com/node/9757" title="http://www.typophile.com/node/9757">http://www.typophile.com/node/9757</a></p>
      <p>This and other experience led me to conclusions about classifications and categorisations <em>per se;</em> in practice, they're often unworkable howevermuch good intention and clarity of thought gets put in at the beginning. I had tried doing a Vox-based scheme much earlier, in 2004, that had 9 major categories.<br>
      </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123085459im_/http://typophile.com/files/aclassification_3905.jpg"></div><p></p>
      <p>Categories such as '3b - 19thC Newspaper Face' and '9a - 20thC Sans&amp;Serif Families' were my attempt to get around traditional limitations of Vox as documented by Catherine Dixon in her work. The problem still becomes either the validity or the ballooning number of subcategories, as you're suggesting above. The earlier typophile thread used Barbedor as an example, but Karen Cheng (in her book about designing typefaces), shows Palatino, Angie Sans, Matrix, Melior, Alega, PMN Caecilia, Bell Gothic and Chicago, all as candidates that defy easy pigeonholing.</p>
      <p>On advice from my supervisors (appalled at the potential scope of what I was looking at), I settled for a smaller sample for my study and went to work on Paul Shaw's list of <a href="www.tdc.org/reviews/typelist.html" rel="nofollow"> ‘100 Top Types of all Time?’</a> on the TDC site – I'm sure you know of it.</p>
      <p>Paul Shaw himself suggested</p>
      <p><em>If you want to work on a database I think the first key step is determining the information to be included. Here’s a shot:</em></p>
      <p>Typeface Family Name<br>
      	Principal or Original Design<br>
      		Designer(s)<br>
      			Year(s) of Design<br>
      			Year of Release/Publication<br>
      		Foundry (with location)<br>
      			technology (eg. Linotype, digital, transfer)<br>
      				size range if metal<br>
      			limitation notes (eg. capitals only)<br>
      			alphabetic system (eg. Hebrew—or this database could be limited to Latin fonts which might be a good idea)<br>
      		Revivals (with same info re: dates, foundries, limitations, etc.)<br>
      		Pirated versions (if relevant—names, foundries, dates)<br>
      	Family Members<br>
      		(with same information as above if different years, designers, etc.)</p>
      <p>Paul's approach, like yours, is very detailed and rigorous, and to do it properly like this may take forever; I have had to settle for what I know can be achieved within my remaining timeframe. The more I get into it, the more the metal originals – the prototypefaces – come to be seen as the unimpeachable source. So current prototypes for a 'typeface profile' page for a proposed website have come to look like this</p>
      <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123085459im_/http://typophile.com/files/profile1_3981.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123085459im_/http://typophile.com/files/profile2_4042.jpg"></div><p></p>
      <p>When I say 'current equivalent' on these screens I just can't be literal about it; the digital fonts don't (and never will) match their earlier counterparts, so all we can talk about is a near-likely equivalent.</p>
      <p>But when you say <em>Couldn’t these all just be called “variations”? Is there a reason Nimbus Sans is more legitimate than Swiss 721 BT? </em></p>
      <p>Well yes there is, but the wikipedia forums might not be the place to argue about legitimacy – that might, and probably does, happen here.</p>
      <p>One of the things this exercise did throw up was how unwilling I now am to make distinction between 'legit' and 'knockoff' versions of what is essentially the same thing; it's one of the things that I used to be uptight about and now find less relevant. In the case of making the profiles above, I decided that saying 'see also' withholds moral judgement and might encourage further research.</p>
      <p>Finally, if there is one traditional book reference that I think does this well, it would be Bartram and Sutton's <a href="https://web.archive.org/web/20150123085459/http://www.amazon.com/Atlas-Typeforms-James-Sutton/dp/1555213405" rel="nofollow">'An Atlas of Typeforms';</a> I've only seen the hardbound 1968 edition, but it really does put that notion of prototypefaces under the microscope.</p>
      <p>(Edit) apologies for over-long post!</p>
    html_clean: |-
      <p>Hey Paul</p>
      <p>I find it fascinating that you're posting this now; I meant to respond to it earlier. This is the subject of a master's degree I'm working on at the moment – never mind a first essay at Reading! (if they're in order, congratulations, BTW)</p>
      <p>Practically and conceptually speaking I have found this topic a real struggle and I think what you're attempting with the wikipedia info boxes for typefaces is very ambitious (possibly overkill for 'typical' wikipedia audiences as Don McCahill says). There are so many variables, and if you mean to apply it to all typefaces, well, an infinite range of subjects. Of course if you succeed with it we'll all be very grateful!</p>
      <p>In the course of my studies I was inspired by much of what was said in the old typophile thread from early 2005</p>
      <p><a href="https://web.archive.org/web/20150123085459/http://www.typophile.com/node/9757" title="http://www.typophile.com/node/9757">http://www.typophile.com/node/9757</a></p>
      <p>This and other experience led me to conclusions about classifications and categorisations <em>per se;</em> in practice, they're often unworkable howevermuch good intention and clarity of thought gets put in at the beginning. I had tried doing a Vox-based scheme much earlier, in 2004, that had 9 major categories.<br>
      </p><div class="imageWrap"><img src="/files/aclassification_3905.jpg"></div><p></p>
      <p>Categories such as '3b - 19thC Newspaper Face' and '9a - 20thC Sans&amp;Serif Families' were my attempt to get around traditional limitations of Vox as documented by Catherine Dixon in her work. The problem still becomes either the validity or the ballooning number of subcategories, as you're suggesting above. The earlier typophile thread used Barbedor as an example, but Karen Cheng (in her book about designing typefaces), shows Palatino, Angie Sans, Matrix, Melior, Alega, PMN Caecilia, Bell Gothic and Chicago, all as candidates that defy easy pigeonholing.</p>
      <p>On advice from my supervisors (appalled at the potential scope of what I was looking at), I settled for a smaller sample for my study and went to work on Paul Shaw's list of <a href="www.tdc.org/reviews/typelist.html" rel="nofollow"> ‘100 Top Types of all Time?’</a> on the TDC site – I'm sure you know of it.</p>
      <p>Paul Shaw himself suggested</p>
      <p><em>If you want to work on a database I think the first key step is determining the information to be included. Here’s a shot:</em></p>
      <p>Typeface Family Name<br>
      	Principal or Original Design<br>
      		Designer(s)<br>
      			Year(s) of Design<br>
      			Year of Release/Publication<br>
      		Foundry (with location)<br>
      			technology (eg. Linotype, digital, transfer)<br>
      				size range if metal<br>
      			limitation notes (eg. capitals only)<br>
      			alphabetic system (eg. Hebrew—or this database could be limited to Latin fonts which might be a good idea)<br>
      		Revivals (with same info re: dates, foundries, limitations, etc.)<br>
      		Pirated versions (if relevant—names, foundries, dates)<br>
      	Family Members<br>
      		(with same information as above if different years, designers, etc.)</p>
      <p>Paul's approach, like yours, is very detailed and rigorous, and to do it properly like this may take forever; I have had to settle for what I know can be achieved within my remaining timeframe. The more I get into it, the more the metal originals – the prototypefaces – come to be seen as the unimpeachable source. So current prototypes for a 'typeface profile' page for a proposed website have come to look like this</p>
      <p></p><div class="imageWrap"><img src="/files/profile1_3981.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="/files/profile2_4042.jpg"></div><p></p>
      <p>When I say 'current equivalent' on these screens I just can't be literal about it; the digital fonts don't (and never will) match their earlier counterparts, so all we can talk about is a near-likely equivalent.</p>
      <p>But when you say <em>Couldn’t these all just be called “variations”? Is there a reason Nimbus Sans is more legitimate than Swiss 721 BT? </em></p>
      <p>Well yes there is, but the wikipedia forums might not be the place to argue about legitimacy – that might, and probably does, happen here.</p>
      <p>One of the things this exercise did throw up was how unwilling I now am to make distinction between 'legit' and 'knockoff' versions of what is essentially the same thing; it's one of the things that I used to be uptight about and now find less relevant. In the case of making the profiles above, I decided that saying 'see also' withholds moral judgement and might encourage further research.</p>
      <p>Finally, if there is one traditional book reference that I think does this well, it would be Bartram and Sutton's <a href="https://web.archive.org/web/20150123085459/http://www.amazon.com/Atlas-Typeforms-James-Sutton/dp/1555213405" rel="nofollow">'An Atlas of Typeforms';</a> I've only seen the hardbound 1968 edition, but it really does put that notion of prototypefaces under the microscope.</p>
      <p>(Edit) apologies for over-long post!</p>
