      <p>&gt;possibly never were</p>
      <p>I agree. As you may remember, at the talk I gave at TypeCon last summer I made the same point with regard to Caslon. And I said I had learned it from James Mosley, the historian of type and printing, and former long time head of St. Brides library in London.</p>
      <p>Mosely made the point about revisions of the original Caslon by the Caslon foundry itself--beginning at the latest in the 1880s--in passing in his essay dedicated to Matthew Carter, in 'Typographically Speaking: the Art of Matthew Carter'. He also has extensive comments on the various sizes of the original Caslon in his facsimile reprint and notes on Caslon's 1766 specimen booklet (1980/81). </p>
      <p>John Hudson learned about this point of the revisions--which he mentions in the thread you link to--from Mosley's Carter essay. John doesn't mention this in the Typophile thread, but I asked him at Typotechnica in London, and he told me that's where he learned about it. I also met Mosley briefly in London, and spent an afternoon talking Caslon with him at University of Virginia in the summer of '05. </p>
      <p>In that discussion, Moseley noted that Caslon isn't really a unified design--such as Fleishman was in fact cutting at about the same time in Holland. I can't remember who, but it may be Bringhurst, who noted that Caslon and other old faces are not 'typeface families' in the sense of being fully unified designs. </p>
      <p>In fact Mosley indicates in the Carter essay that in a sense the 'Type Designer' didn't exist until after the invention of the pantographic punch cutter. Then the different sizes could be scaled, so there were three or four masters, and the rest was scaled using the machine. The designer really was then a drawer of type, and the process of production was more separate than with the punch cutter. </p>
      <p>Of course, there was a lot of production drawing for Monotype and Linotype, and it has been noted that today with digital type we are in some respects back to the punchcut days when the same hand finishes the type design as conceives it.</p>
      <p>At any rate, I suspect your 'revelation' to a large extent reconstruction of what various people have mentioned, all of which traces back to Mosley. I just think credit should go where it's due--to Mosley. </p>
      <p>In my work on Caslon I have found that the revisions are much more extensive even than Mosley noted, but that is just an extension of Mosley's point.    </p>
      <p>I did argue in my talk that attempts to be 'authentic' are doomed to failure, and that in fact 'Founder's Caslon,' which is a fine typeface in many respects, fails to be authentic in several key aspects. I have a feeling that Mosley believes more in the virtue of authenticity than I do, but I can't speak for him, of course. </p>
      <p>At any rate I will look at your template and comment further in another post.</p>
