      <p>Paul, if you like the comparison between different existing systems then don't forget to include the PANOSE system as well. That was an attempt to sort this out rationally, that had a lot of good intention and clarity of purpose upfront, but never went anywhere practically – largely as a result of it not being adopted. Call me a pessimist, but I think <a href="https://web.archive.org/web/20150123085459/http://www.type-expertise.com/" rel="nofollow">type-expertise.com</a> and the <a href="https://web.archive.org/web/20150123085459/http://www.typeindex.org/" rel="nofollow">type-index.org</a> are headed the same way. Dennis Ravizza has written to me in the past about his plan and while it sounds plausible, the idea that it's private revenue-generating enterprise dooms it. Is this the reason why you chose the wikipedia as a vehicle?</p>
      <p>As for Peter's remarks, well, no offence meant, but anyone who can list</p>
      <p><em>Versions (identifying different types with Bodoni in their name)<br>
      and / or<br>
      Varients: Filosofia<br>
      and / or<br>
      Spinoffs: (like Arial in the case of Helvetica)</em> </p>
      <p>and then go on to ask another contributor about the relative exactitude of <em>their</em> terminology has really put their finger on the underlying issue as far as I'm concerned. The good people at Monotype will offer you valid reasons for why Arial should be considered a <em>version</em> or a <em>variant</em> of Helvetica, so where does that leave your classification?</p>
