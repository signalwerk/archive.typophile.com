      <p>Paul — I have been collecting (entries) of typfaces/fonts for some time, trying to categorize them. The strategy I adopted is something like:</p>
      <p>Category(*) &gt; Typeface &gt; Cut or Version &gt; Font</p>
      <p>Categories in my case more or less follow a historical classification, quite similar to Vox'. They may adopt other parameters, though, such as use (body text, display, advertising, book or newspaper). A Typeface I consider to be a set of formal or stylistic traits with which the basic skeleton shapes of alphabets are interpreted (i.e. a typeface can cover several scripts), typically devised by one designer. The actual rendering of a Typeface (its visual realisation) results in a Cut or Version; several different punchcutters may have their own interpretation of a Typeface, all within the boundaries of its style. I also distinguish between a Revival and an Interpretation, the latter more freely following on original Typeface design. I think this distinction (between Typeface and Cut) is what bothers you. A last level I use is Font (or Fount); this involves the physical realisation of a Typeface (or Cut thereof). Different Vendors (or in the old days Type Foundries) may offer different releases of principally one and the same Cut, sometimes with a few visual differences, but primarily with technical distinctions (such as type height or file format).</p>
      <p>An example (from my modest little database):</p>
      <p><code>II FRENCH OLD STYLE (GARALDE)</code></p>
      <p>II.1 Claude Garamond (italics: Robert Granjon)</p>
      <p>II.1.A — ORIGINAL</p>
      <p>II.1.B — REVIVALS<br>
      II.1.B.a Deberny &amp; Peignot Garamond (George &amp; Charles Peignot, 1912-28)<br>
      II.1.B.b Nebiolo Garaldus (Aldo Novarese, 1957)<br>
      II.1.B.c Linotype Granjon LT Std (George W. Jones, 1928-31; Linotype)<br>
      II.1.B.d Linotype Estienne (George W. Jones, 1930)<br>
      II.1.B.e Stempel Garamond (D. Stempel AG, 1925)<br>
      II.1.B.f Berthold Garamond<br>
      II.1.B.g Garamond 3 LT Std (Linotype)<br>
      II.1.B.h ITC Garamond Std Lt (Tony Stan, 1954)<br>
      II.1.B.i Adobe Garamond Pro<br>
      II.1.B.j Simoncini Garamond Std<br>
      II.1.B.k 1503 Garamond (Ross Mills, 1994; Tiro Typeworks)<br>
      II.1.B.l Amsterdammer Garamont (URW++)<br>
      II.1.B.m URW Garamond<br>
      II.1.B.n Augereau (George Abrams, 1989)<br>
      II.1.B.o Envoy (Tim Rolands, 2001)<br>
      II.1.B.p Adobe Garamond Premier Pro (Robert Slimbach)</p>
      <p>II.1.C — INTERPRETATIONS<br>
      II.1.C.a Sabon (Sabon-Antiqua) (Jan Tschichold, 1964/7; Stempel, Linotype, Monotype)<br>
      II.1.C.b Sabon Next (Porchez)</p>
      <p>(I grant that this is very incomplete and the classification model is not consequent. It's been a long time since I have been working on this.)</p>
      <p>Yet another:</p>
      <p><code>VII DIDONES</code></p>
      <p>VII.1 Giambattista Bodoni (ca 1791)</p>
      <p>VII.1.A — ORIGINAL<br>
      VII.1.A.a Giambattista Bodoni, Manuale Tipografico)</p>
      <p>VII.1.B — METAL REVIVALS<br>
      VII.1.B.a Morris Fuller Benton (ATF, 1907)<br>
      VII.1.B.b Monotype, 1930s<br>
      VII.1.B.c Bauer Bodoni (Bauer, Heinrich Jost, 1926)<br>
      VII.1.B.d Berthold Bodoni Antiqua, 1930s<br>
      VII.1.B.e R.H. Middleton (American Ludlow foundry, 1930s)</p>
      <p>VII.1.C — PHOTO COMPOSITION<br>
      VII.1.C.a Berthold Bodoni (Gunter Gerhard Lange, 1970)<br>
      VII.1.C.b Berthold Bodoni Old Face (Gunter Gerhard Lange, 1983)<br>
      VII.1.C.c IBM corporate identity (Karl Gerstner, 1980s)	</p>
      <p>VII.1.D — DIGITAL REVIVALS<br>
      VII.1.D.a Monotype 135 Bodoni (Monotype, 1921)<br>
      VII.1.D.b Bauer Bodoni Std (Heinrich Jost, 1926)<br>
      VII.1.D.c Monotype 357 Bodoni Std Book (Monotype, 1932)<br>
      VII.1.D.d Bodoni Std<br>
      VII.1.D.e WTC Our Bodoni (Massimo Vignelli, 1989)<br>
      VII.1.D.f Berthold Bodoni<br>
      VII.1.D.g Berthold Bodoni Old Face<br>
      VII.1.D.h Bodoni Old Fashion (URW++)<br>
      VII.1.D.i Bauer Bodoni URW<br>
      VII.1.D.j Bauer Bodoni BT (Bitstream)<br>
      VII.1.D.k EF Bodoni<br>
      VII.1.D.l EF Bauer Bodoni<br>
      VII.1.D.m FF Bodoni Classic [+ Swashes &amp; Chancery] (Gert Wiescher, 1994)<br>
      VII.1.D.n ITC Bodoni (drie opticals: six, twelve &amp; seventy-two; Sumner Stone e.a. 1994)<br>
      VII.1.D.o Linotype Bodoni Classico (Franko Luin, 1995)<br>
      VII.1.D.p Linotype Gianotten (Antonio Pace, 2000)<br>
      VII.1.D.q Filosofia (Zuzanna Licko, Emigre)</p>
      <p>VII.1.E — INTERPRETATIONS (“bodoniennes”)<br>
      VII.1.E.a Fenice (Aldo Novarese)<br>
      VII.1.E.b Iridium (Ardrian Frutiger, Stempel, 1972)<br>
      VII.1.E.a FF Acanthus (Akira Kobayashi, FontFont)</p>
      <p>Man, I see now there's lot to be updated. And this all should urgently be ported to an XML schema.</p>
      <p>Anyway, my two cents.</p>
    html_clean: |-
      <p>Paul — I have been collecting (entries) of typfaces/fonts for some time, trying to categorize them. The strategy I adopted is something like:</p>
      <p>Category(*) &gt; Typeface &gt; Cut or Version &gt; Font</p>
      <p>Categories in my case more or less follow a historical classification, quite similar to Vox'. They may adopt other parameters, though, such as use (body text, display, advertising, book or newspaper). A Typeface I consider to be a set of formal or stylistic traits with which the basic skeleton shapes of alphabets are interpreted (i.e. a typeface can cover several scripts), typically devised by one designer. The actual rendering of a Typeface (its visual realisation) results in a Cut or Version; several different punchcutters may have their own interpretation of a Typeface, all within the boundaries of its style. I also distinguish between a Revival and an Interpretation, the latter more freely following on original Typeface design. I think this distinction (between Typeface and Cut) is what bothers you. A last level I use is Font (or Fount); this involves the physical realisation of a Typeface (or Cut thereof). Different Vendors (or in the old days Type Foundries) may offer different releases of principally one and the same Cut, sometimes with a few visual differences, but primarily with technical distinctions (such as type height or file format).</p>
      <p>An example (from my modest little database):</p>
      <p><code>II FRENCH OLD STYLE (GARALDE)</code></p>
      <p>II.1 Claude Garamond (italics: Robert Granjon)</p>
      <p>II.1.A — ORIGINAL</p>
      <p>II.1.B — REVIVALS<br>
      II.1.B.a Deberny &amp; Peignot Garamond (George &amp; Charles Peignot, 1912-28)<br>
      II.1.B.b Nebiolo Garaldus (Aldo Novarese, 1957)<br>
      II.1.B.c Linotype Granjon LT Std (George W. Jones, 1928-31; Linotype)<br>
      II.1.B.d Linotype Estienne (George W. Jones, 1930)<br>
      II.1.B.e Stempel Garamond (D. Stempel AG, 1925)<br>
      II.1.B.f Berthold Garamond<br>
      II.1.B.g Garamond 3 LT Std (Linotype)<br>
      II.1.B.h ITC Garamond Std Lt (Tony Stan, 1954)<br>
      II.1.B.i Adobe Garamond Pro<br>
      II.1.B.j Simoncini Garamond Std<br>
      II.1.B.k 1503 Garamond (Ross Mills, 1994; Tiro Typeworks)<br>
      II.1.B.l Amsterdammer Garamont (URW++)<br>
      II.1.B.m URW Garamond<br>
      II.1.B.n Augereau (George Abrams, 1989)<br>
      II.1.B.o Envoy (Tim Rolands, 2001)<br>
      II.1.B.p Adobe Garamond Premier Pro (Robert Slimbach)</p>
      <p>II.1.C — INTERPRETATIONS<br>
      II.1.C.a Sabon (Sabon-Antiqua) (Jan Tschichold, 1964/7; Stempel, Linotype, Monotype)<br>
      II.1.C.b Sabon Next (Porchez)</p>
      <p>(I grant that this is very incomplete and the classification model is not consequent. It's been a long time since I have been working on this.)</p>
      <p>Yet another:</p>
      <p><code>VII DIDONES</code></p>
      <p>VII.1 Giambattista Bodoni (ca 1791)</p>
      <p>VII.1.A — ORIGINAL<br>
      VII.1.A.a Giambattista Bodoni, Manuale Tipografico)</p>
      <p>VII.1.B — METAL REVIVALS<br>
      VII.1.B.a Morris Fuller Benton (ATF, 1907)<br>
      VII.1.B.b Monotype, 1930s<br>
