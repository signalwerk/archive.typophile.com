      <p>Actually Peter, <em>Triple-stroked display type with an abundance of flourishes...</em> tells me much more than your (mistyped?) subtitle for the presentation ; )</p>
      <p>I didn't detect anti-classificatory sentiment in George's post. On the contrary, I think he's just being realistic about the challenges involved. Like you and me, he's in favour of classifications <em> per se</em> for the sake of analysis and discussion. I'm putting my project together with the absolute certainty that it will probably provoke hair-splitting disagreement (and perhaps pedagogically, that might be more useful than consensus).</p>
      <p>When I started the project I found myself quoting Walter Tracy:</p>
      <p><em>The classification of type designs is an unresolved problem... The fact is, any classification is simply an aid to study, not an end in itself. Once the student has got the characteristics of the groups firmly in mind and can 'place' any typeface without difficulty the actual names of the groups, and their precision and logicality [or lack of it] cease to be important.</em><br>
      Tracy, Walter. 1986, 'Letters of Credit' pp.19 - 21</p>
      <p>But the key challenge appears to me to me to get free of the semantic shackles that attach value judgements to phrases like 'spinoff', 'version' and 'variant' – because the common reading of these terms would suggest that they are not all equally legitimate. And that, with the typefounding industry's historical attitude to offering new product curiously simlar to the competition's best sellers, raises considerable questions for anyone attempting type classification.</p>
      <p>I mentioned PANOSE because, like Mundie's <a href="https://web.archive.org/web/20150123085459/http://www.anthus.com/Typography/Faces.html" rel="nofollow">Field Guide to the Faces</a> (still online), it's a classic example of going rigorously scientific at the expense of (as you say) the ethno-social and heuristic dimensions of the enquiry. In other words they make good examples for contrasting approaches to classification.</p>
