    html: <p>Well, one thing to remember is that to the average Wikipedia user, one Bodoni is pretty much identical to the other one, even though to most of us here they are extremely different. So unless an article is addressing the differences between Bodoni cuts, you can use any cut you have handy to illustrate. The importance is to show how Bodoni is different from a Garamond, or a Times.</p>
