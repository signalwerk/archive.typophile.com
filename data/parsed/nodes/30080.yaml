      <p>[my mistyped subtitle]</p>
      <p>I've changed the 'and' to 'an'.</p>
      <p>"…tells me much more than your […] subtitle…"</p>
      <p>Then you need to step inside. From my introduction: "[I]n my subtitle ‘quirk-notes’ is meant to evoke a descriptive protocol, and ‘ambiguously affiliated generic’ to suggest a way out of a taxonomical conundrum. The descriptive protocol draws from the language of description used by cognitive scientists Douglas Hofstadter, Gary McGraw and John Rehling in their attempts to model creativity in the letterform domain. The taxonomical conundrum has to do with the fact that in different contexts of description the initials seem affiliated with different forms." So that is what I tried to show.</p>
      <p>"But the key challenge appears to me to me to get free of the semantic shackles that attach value judgements to phrases like ‘spinoff’, ‘version’ and ‘variant’ – because the common reading of these terms would suggest that they are not all equally legitimate. And that, with the typefounding industry’s historical attitude to offering new product curiously simlar to the competition’s best sellers, raises considerable questions for anyone attempting type classification." </p>
      <p>How do you propose to deal with this?</p>
      <p>I did not feel that Filosofia simply follows on a line with the various Bodonis, at least not in intent. And it strikes me that the 'norm violations' of a 'version' are more sytematic and structural than the incidental or ad hoc changes of a "spin-off." So, business ethics aside, there seem to me to be differences in relation to the prototype that bear tracking.</p>
