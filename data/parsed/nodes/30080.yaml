      <p>Paul, I think what you are confronting is that in the course of typographical history <em>proprietory</em> designations of formally distinctive instances--or groups of formally distinctive instances--of sets of items within the typographical domain become / became <em>generic specifiers</em> or <em>distinctive names</em> for a class of things having some common characteristics or an array of family resemblences--as Bill suggests--and a common ancestry. </p>
      <p>The thing to figure out is whether the category has come to have a the specificity of a species name or the generic qualities of a genus name. My impression is that Bodoni has the characteristics of a species designator, with all the variants being local varients (eg Linotype or Monotype Bodoni) or subspecies (eg., Filosofia). The term Garamond on the other hand, seems to cover a broader variety of forms whose commonalities have the lesser specificity characteristic of a genus or sub-genus, and whose ancestry is of a different rank. I don't know about Caslon.</p>
      <p>A relevent info box system might have to reflect this.</p>
