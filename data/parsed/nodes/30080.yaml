      <p>I hope you don't mind - I'd like to switch this back to one of the topics in the original post. The showing of Helvetica on the Wikipedia site. There seems to be a large segment left out that can truly give a person more of an insight to why there are so many different Helveticas in the world. (Perhaps this can be extended towards other font families...while we are there - find out why Monotype, etc. removed the diamond punctutation from Goudy!)</p>
      <p>After Helvetica was released for Hot Type (one of the last faces to do so, and perhaps the very last - not sure) the typesetters in the USA fell in love with it and wanted it. The European foundry was extremely slow in making up sets (and many typesetters were already figuring in their costs of becoming cold type shops) that there were foundries here in the States that made their own. </p>
      <p>As far as cold type went - that only made matters worse. Each shop again redraw their own. We are talking before "digitalization for home computers."</p>
      <p>BTW - The US judges had agreed that 3 characters changed and a new name meant a new typeface.</p>
      <p>Berthold had the original drawings to make their fonts from and called it Helvetica.<br>
      Mergenthaler/Linotype also had Helvetica.<br>
      Harris called their's Vega<br>
      Varityper's was called Mergaron<br>
      Alphatype was Claro<br>
      Compugraphic Helios<br>
      Dymo was Newton<br>
      and Graphic Systems was called London Roman.<br>
      Itek was HE</p>
      <p>It wasn't until we started using Macs and IBMs/IBM Compatibles that places like URW introduced us to Nimbus Sans and let's not get started on Arial.</p>
      <p>Just had to share.</p>
      <p>BTW - owning an Alphatype typeshop at that time and having both Claro (then Alphatype was bought out by Berthold) and the Helvetica. I'd like to share a small story with you. When we finally got the "real" Helvetica, the Claro was put to the side never to be seen again. Helvetica letters fit without tons of extra kerning. They had a crisp look that didn't exist in the Claro.</p>
      <p>A job was set for a front cover of a computer book at Bantam Books by us. At the time, Len Leone Sr. was "The Art Director." It was just before the ABA and the whole art department didn't have a second to breath. Len saw the type from our shop and stopped everyone in the department. He invited them into his office where for 2 hours he proceeded in giving a lecture about true Helveticas. He had been very happy to see...</p>
      <p>So yes, in the eyes of the layman - (and American judges) all typefaces look the same... to those who have studied, used, worked with -- they are familiar with the little nuances that give each font their personality.</p>
      <p>P.S. You could always give credit to whose Bodoni you used....</p>
