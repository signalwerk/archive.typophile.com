      <p>&gt;effectual categories of typefaces</p>
      <p>Oh, I see what you mean now. I think it is somewhat arbitrary where you decide to call something a variation on a typeface and what a different face within the same category. I think you are running up against the impossibility of really sharp borders in the categories of type designs.  </p>
      <p>For example with Caslon, if you compare it to Van Dyke you can see the kind of thing Caslon was looking at--Eg., DTL Elzevir as a close modern derivative--and it is clear that he belongs to the 'Dutch' category, whether you want to call it Baroque or whatever as Bringhurst does. But within that Caslon has some personal characteristics that are specific to him. Some of these are revived in some Caslons, but not in others. But still I bet in most you can find stuff that is specific to the original, and not shared by other Dutch examples. There are some exceptions, like 'Antique Caslon', which has little to do with Caslon, and 'Caslon 224', which has a lot more to do with Benguiat than with Caslon.   </p>
      <p>I guess the problem is one of 'family resemblence'. When does a cousin look more like one family than another? Families will discuss, with almost everyone having a different opinion!</p>
