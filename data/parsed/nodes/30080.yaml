      <p><em>the real problem i’m facing for the wikipedia infoboxes now is categorization info. right now the typefaces are classified into “categories” falling into:</em></p>
      <p>It was the anthropologist Levi-Strauss who pointed out humans are the only inhabitants of the planet who insist on categorizing things.</p>
      <p>Things created by humans don't fall into easy categories so I suggest stick with the obvious ones and let the rest fall where they may. There is no solution that will work for all. It's even difficult to devise a system for espresso machines and chain saws, much less something as culture / history specific as typefaces.</p>
      <p>I'm wholly in favor of categorizing things so they can be discussed and analyzed, but it's not easy and it's not pretty.</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
