      <p>"no offence meant" / "where does that leave your classification"</p>
      <p>No offence taken.</p>
      <p>Where it leaves my classification: the categories <em>version</em>, <em>varient</em>, <em>spinoff</em> might well prove workable, but the example for <em>spinoff</em> might easily have been ill-conceived, or maybe the category <em>spinoff</em> itself is ill-advised.</p>
      <p>My response to George was directed at the anti-classificatory sentiment I thought his comment expressed. Perhaps I was wrong about this.  </p>
      <p>To my way of thinking classifications are informative. A classification like <em>didoni</em>, or <em>garalde</em>, or <em>lyrical modern</em>, or [type of contrast] <em>expansion</em>, might not be as obvious as <em>sans serif</em>, but why would we not want to be informed of the story these terms seek to tell us, or stimulate us to see?</p>
      <p>Truth be told, I'm very interested in efforts at classification, including yours. In my files are an entire series of papers with titles like "Classifications in their Social Context,"  "Basic Objects in Natural Categories," "Principles of Categorization," "Ethonobiological Classification." My ATypI Vancover presentation on Henk Krijger's Raffia Initials was to a large degree an effort in typographical categorization. The subtitle read: "Quirk-Notes on an Ambiguously Affiliated Generic." Triple-stroked display type with an abundance of flourishes doesn't say enough.</p>
      <p>In the quest to be rigorous and scientific, the ethno-social and the heuristic dimensions of categoriztion are often overlooked.</p>
