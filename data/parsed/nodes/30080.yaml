      <p>Are you really going to Reading, Paul? Congratulations!</p>
      <p>Thinking about the classificaton problem:</p>
      <p>As in biology, I think--I don't know that much about it--I believe you can classify either by evolution--what came from what--or by structure. And these may be different. For example in Australia you have animals that have a different evolutionary history but similar structure--marsupial cognates to squirrels etc. </p>
      <p>In type, you can often identify what influenced what, but structural changes might be another thing--there might be similarities in different periods and styles. ...Noordzij's observations on history of writing and type are interesting partly because he is able to unite both to a degree.</p>
