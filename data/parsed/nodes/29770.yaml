      <p>David, </p>
      <p>I do understand each word of yours but not the contents of the entire sentence :) What do you mean by "FL"? FontLab Studio, the application? Fontlab Ltd., the company? What do you mean by "do the digital signature"? Embed the digital signature in the font? Purchase the digital certificate? Something else? </p>
      <p>FontLab Studio 5 has the ability to embed digital signatures into fonts, if the font developer installs an appropriate certificate. But Fontlab Ltd. does not issue or share digital certificates, and Fontlab Ltd. is not a certification authority. You need to obtain a digital certificate from a certification authority such as VeriSign or Thawte. </p>
      <p>Font developers are free to form a "coalition" of some sort to share the cost and effort (the certification authority would have to issue the certificate to that "coalition", which I presume would need to be a legal entity of some sort. </p>
      <p>Also, any font developer can purchase a digital certificate in his own name, and then choose to offer a service of using his own certificate to digitally sign fonts for other developers as well, or even to share his digital certificate with some other trusted vendors so they can sign the fonts using that certificate as well. </p>
      <p>A.</p>
