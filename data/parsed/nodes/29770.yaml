      <p>You can get the OpenType icon without a digital signature, you just need the DSIG header with: </p>
      <p>usNumSigs (Number of signatures in the table) = 0;</p>
      <p>it works. The font wont be digitally signed of course, but the operating system only checks if the DSIG table is present to produce the icon.</p>
      <p>Don't think you can do that with FontLab though.</p>
