    html: |-
      <p>Hi DH,</p>
      <p>Don't know how to do it with Python, but you can do it with Microsoft's free 'AddTable.exe' tool available here:<br>
      <a class="freelinking external" href="http://www.microsoft.com/typography/tools/tools.aspx" rel="nofollow">http://www.microsoft.com/typography/tools/tools.aspx</a></p>
      <p>you also need a data file containing the bytes for the blank DSIG table (8 bytes):<br>
      00 00 00 01  (ulVersion = 1)<br>
      00 00        (usNumSigs = 0)<br>
      00 00        (usFlag = 0)<br>
      (Ive made one here you can download:<br>
      <a class="freelinking external" href="http://homepages.ihug.co.nz/~allanm1/DSIG.DAT" rel="nofollow">http://homepages.ihug.co.nz/~allanm1/DSIG.DAT</a>)</p>
      <p>Then type on the command line:<br>
      addtable   DSIG   dsig.dat   in.ttf   out.ttf<br>
      (make sure that the DSIG is uppercase)</p>
      <p>in.ttf is your original font.<br>
      out.ttf is the output font which will now have the OpenType icon on Windows XP.</p>
      <p>Allan</p>
    html_clean: |-
