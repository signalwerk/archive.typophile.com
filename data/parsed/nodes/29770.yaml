      <p>Ludwig, </p>
      <p>from your remark, I gather that you're one of those fellows who are happy in their simplistic view of the world that goes like "Microsoft is bad, others are good". </p>
      <p>Therefore, I guess it will be a huge shock for you to learn that this has very little to do with being an "MS proprietary standard". The Authenticode code signing certificates are X.509 IETF certificates issued for a particular purpose and packaged in a particular, Microsoft-specific way. However, there are opensource tools that can convert a code signing X.509 certificate into an Authenticode code signing certificate, and the format of the Microsoft packaging of digital certificate is widely published. </p>
      <p>X.509 digital certificates are an IETF international standard, and are used widely on the WWW, for example in SSL (https) encryption. They all cost money, even those that you use on an opensource Apache server. This has to do with the fact that the certification authorities that issue the certificates are companies that have costs of operation and (since they are companies) their purpose is to make money. </p>
      <p>This, per se, has nothing to do with Microsoft, but I guess where you live ranting against "M$" is just an easy way to escape the complex reality. </p>
      <p>Tip for the future: do some background reading before publicly announcing your conclusions. </p>
      <p>Regards,<br>
      Adam</p>
