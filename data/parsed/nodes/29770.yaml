    <p>Hi there!!</p>
    <p>When I generate a Opentype TrueType flavored font on FLAB, it gets a TrueType icon file in Windows. (I'm not sure that also happens on MAC platform).<br>
    But I've seen these kind of font files with the .TTF extension presenting an Opentype font icon. I know DaltonMaag uses this.</p>
    <p>How can this be done?</p>
    <p>I'm selling fonts with this format (for better screen hinting), but the .TTF extension and font file icon missleads some users...thinking they've bought a simple TrueType font.</p>
    <p>many regards from sunny Brazil ;)</p>
    <p>Fabio</p>
