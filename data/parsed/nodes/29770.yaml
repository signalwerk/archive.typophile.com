    html: |-
      <p>Ralf, </p>
      <p>the digital signatures singed with a proper (non-test) certificate are a safe way to ensure that the font you're dealing with is an original creation of a certain foundry. If a font was modified, the digital signature becomes invalid (or is not included at all). Some foundries, e.g. Linotype, use DSIG to check if a font that a customer is complaining about is an unmodified Linotype original or if it was "touched" by someone and therefore "the warranty is void". You could view DSIGs as some sort of "warranty seal". </p>
      <p>A.</p>
