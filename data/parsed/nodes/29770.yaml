    html: |-
      <p>Microsoft's idea way to differentiate somehow between the old-style TrueType fonts and the new OpenType TT fonts. Since both carry a ".ttf" extension, Microsoft decided to check for the presence of the "DSIG" table. At the time when Windows 2000 was created, they thought digital signatures in fonts would become "the big thing". </p>
      <p>BTW, I don't think DSIGs are useless. When you produce original typefaces, it's quite useful to stamp them in a way that cannot be forged -- no? </p>
      <p>A.</p>
