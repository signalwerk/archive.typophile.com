    html: |-
      <p>Add a <a href="/wiki/digital%20signature" class="freelinking" rel="nofollow">digital signature</a> (DSIG). You can do it in FontLab Studio but you need to own an "Authenticode" Class 3 code signing digital certificate. You can get one from Thawte or Verisign, they cost some $200-$400. It's also possible to create a self-signed test certificate for free -- for more information see</p>
      <p>http://msdn2.microsoft.com/en-us/library/aa140234(office.10).aspx#odc_dcss_procedure</p>
      <p>(you only need to complete steps 1-3). Once you have the private key file and the .spc certificate file that you produce in this process (or obtain from VeriSign/Thawte), you can link these files to the Digital signatures section of FontLab Studio's Preferences/Options dialog box. </p>
      <p>A.</p>
    html_clean: |-
      <p>Add a <a href="/wiki/digital%20signature" class="freelinking link-lost" rel="nofollow">digital signature</a> (DSIG). You can do it in FontLab Studio but you need to own an "Authenticode" Class 3 code signing digital certificate. You can get one from Thawte or Verisign, they cost some $200-$400. It's also possible to create a self-signed test certificate for free -- for more information see</p>
