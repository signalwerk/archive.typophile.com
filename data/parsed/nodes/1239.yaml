    html: "<p>It is an interesting form. There are two things about the form that are unsettling to me, but only on a personal level: (1) the form looks like it's going to roll/tip over to the right, and (2) for some reason the curve at the bottom of the \"f\" isn't working for me (unfortunately, I am not offering any suggested resolutions tonight). <br> <br>Good luck! <br>Scott</p>"
