    html: "<p>I'll work on a version of the logo without the curve (on the 'f'), but it'll still look like it's going to tip over. I don't know if that'll bother other people or not - I didn't even really think about it. <br> <br>I'm sort of wondering if I should just stick with the logotype on the temporary page 2 of our site: <br><a href=\"http://www.furtherstudios.com/\" target=\"_blank\">http://www.furtherstudios.com/</a> (just click the splash, no need to read the outlandish manifesto-esque text unless you really want to) <br> <br>Thanks again.</p>"
