    html: <p>"Thanks, Chris. Do you think the design "works"? Or does the legibility work against it too much?  <br> <br>I was trying to go for something abstracted far enough that it's more of a design than just initials, but I know that a logo also shouldn't need an explanation for it to work.  <br> <br>Thanks for the comment, and I'd love to hear more crits!" <br> <br>For normal usage you could put the symbol and then right next to it "further studios", then for places where it wouldn't be appropriate to have the text you could just use the logo.  It is definitely unique and memorable, so I think it would work fine on it's own. <br> <br>I like how the S cuts into the F on the new logo, however I think I like how the F and the S meet at the bottom on the old version.</p>
