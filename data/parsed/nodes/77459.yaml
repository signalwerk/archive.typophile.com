    html: <p>That you checked TypeKit would indicate that you're for looking for a webfont, which would enable content to be published as plain text and rendered by the browser. On the other hand, you're worried that the plain text might then be copied and pasted, which is one of the main advantages of using webfonts. Hmmmmm... Pre-rendering the text to images would make it harder to copy the actual text, but still the individual images wouldn't be that difficult to save. Rendering the text within a Flash container, using <a href="http://www.atomicmedia.net/font.php?font_name=PixelPak" rel="nofollow">one of those microscopic pixel fonts</a>, might be the perfect solution (although one could still take screenshots and magnify...)</p>
