  html: |-
    <p>I am currently using Verdana for an academic web site that is text heavy. The format of the page includes lots of captions and blurbs, some up to 20 lines long, but only 200 pixels wide.</p>
    <p>I checked typekit and there are some but they don't seem significantly sharper than Verdana.</p>
    <p>Any suggestions for clear legible fonts...?</p>
    <p>Secondly is there a method to lock down the type to encourage students from copy and pasting the site content?</p>
    <p>Thanks!</p>
