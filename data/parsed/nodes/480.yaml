    html: "<p> From my understanding: <br>The algorithms for rendering fonts versus outlines are different, with respect to deciding if a border dot should be turned on or off. This translates to an average of half a dot of difference on the edge. On the screen, this is highly visible (irrespective of the additional difference in rending method - b&amp;w versus gray). On a laser printer, it's very visible at text sizes, and even perceptible at sizes upto and beyond a single-fixation of the fovea (at normal reading distance). On lino, it's generally perceptible at just below normal reading distance, which isn't so bad. <br> <br>On lino, the only real problem is when you're making specimens of a text face for close scrutiny, and you don't want to give the service bureau the fonts (or they don't want to bother with them). An 8pt text block for example will be visibly darker. You can reduce this by going to the maximum resolution (in case the resultant lower lpi doesn't matter), which can be above 3000 dpi. On the other hand, since almost any reproduction method will introduce *some* gain, you could view the result as being closer to the eventual output! But of course that's not quantitively controllable. <br> <br>hhp </p>"
