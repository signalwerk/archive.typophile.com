    html: <p> I was in Stuart's camp because I'd see this effect with my own eyes and always wonder. But Joe might be right about the optical illusion. <br> <br>I did a quick 'color stack' test at 8 pt. and 800 pt. with Helvetica UC I and found the differences to be imperceptible at either size, but I didn't try printing. <br> <br> <br>When you zoom in and out, Illustrator redraws quickly and that's when I've noticed the weight difference. <br> <br>An another subject, when you stroke with dashed lines, Illustrator doesn't let you create dashed outlines. Has anyone figured out a way to create dashed outlines? <br> <br>bj </p>
    html_clean: <p> I was in Stuart's camp because I'd see this effect with my own eyes and always wonder. But Joe might be right about the optical illusion. <br> <br>I did a quick 'color stack' test at 8 pt. and 800 pt. with Helvetica UC I and found the differences to be imperceptible at either size, but I didn't try printing. <br> <br> <br>When you zoom in and out, Illustrator redraws quickly and that's when I've noticed the weight difference. <br> <br>An another subject, when you stroke with dashed lines, Illustrator doesn't let you create dashed outlines. Has anyone figured out a way to create dashed outlines? <br> <br>bj </p>
