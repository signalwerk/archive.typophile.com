    html: <p>Font outlines are rasterized by ATM, which uses a different algorithm for turning on pixels than the one used by Illustrator. Put differently, fonts are hinted but other outlines aren't. The effect is visible even at 1,200 dpi on paper, and more so on screen. <br> <br>I think the effect has been mollified in Illustrator 10, where everything seems to be anti-aliased, but I haven't used the application enough to be sure.</p>
