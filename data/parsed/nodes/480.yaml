  html: <p> This has always perplexed me, in Illustrator when a font is converted to outlines, it seems to get a significant weight gain. <br> <br>Is this perception primarily just the on screen display of the face or does the font gain in the output as well? <br> <br>I've done a few tests and found that this is more apparent at font sizes below 10. . . <br> <br>Is there any way to counteract the affects of the font to outline process? <br> <br>Stuart :D </p>
