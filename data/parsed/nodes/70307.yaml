      <p>Korean should be relatively straightforward, as it is always set horizontally. Furthermore, 99% of text typefaces supporting Korean have fixed width for the hangul. Korean fonts often come in two flavours, fixed-width and proportional, where in the former even the non-hangul glyphs come in fixed widths (alphanumerics taking up half the width of a hangul syllable). Take care to use the proportional version.</p>
      <p>In many older Korean fonts, even in the proportional version, the punctuation and the space character have fixed width, which results in bad spacing. A space exactly half the width of a hangul syllable is too big for Korean. In addition, the hangul syllables themselves set quite loosely because they retain the same width as in the fixed-width versions where each syllable has to be twice as wide as an alphanumeric.</p>
      <p>In the early days of digital typesetting when Korean typesetters had to use such fonts, they would track the text tighter, condense the space character, and manually kern punctuation (Latin letters would often touch each other because of the global tight tracking). I'm not sure if those who don't read Korean can get a good enough sense of how much of these adjustments to make. The easiest solution would be to use the latest text font offerings from Korean foundries with better default spacing.</p>
