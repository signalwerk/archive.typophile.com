      <p>Leonardo — I believe the Apple system fonts have some restrictive embedding bits, which is why you have a problem embedding in a PDF. But there are some Adobe versions which are essentially the same and allow embedding. </p>
      <p>I believe at least some of these basic Adobe Chinese fonts are included with various installations of Creative Suite software. You might look into these in the future.</p>
      <p>See also this thread: <a href="http://typophile.com/node/59688" title="http://typophile.com/node/59688">http://typophile.com/node/59688</a></p>
