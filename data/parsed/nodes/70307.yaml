    html: |-
      <p>The same spacing and leading principles apply in Korean, but it is considerably easier since Korean line breaks can come after any letter (each 'letter' represents a syllable). Since long words don't wreck havoc with the line spacing, this also means that hyphenation is not needed for Korean, it almost always makes sense to full-justify, and there are no rivers running through Korean text.</p>
      <p>Check that the software you are using is breaking Korean text correctly. This is really important!</p>
      <p>You can adjust tracking for a line to fit, but if you do, do it ever so slightly so that there is no noticeable difference between the tracking of different lines. The justification should be achieved mostly through varying the spaces anyway.</p>
      <p>As for the global tracking, a good rule of thumb is to make it so that the central horizontal lines of 을을 almost or just barely touch. As for leading, what works for Latin text generally should work for Korean text. Korean fonts also contain Latin glyphs, so you can test with them.</p>
