    <p>From time to time i had to design documents that are tri lingual, or bi-lingual.<br>
    its almost always, spanish, english and another language, the last two were Chinese and Korean...</p>
    <p>Usually i receive documents in word, with the text in chinese, and usually i don't have problems opening it. The trouble comes when i  import or copy it in Indesign, because most of the times the font used by word is not the same that indesign uses for the same language.</p>
    <p>I understand that in the mac there are some system fonts that are there to be used in this cases. For example, for the chinese document I used the MS Mincho, and after looking carefully I understood that the other two fonts (MS PGothic and MS PMincho) are like te times and helvetica versions of this font.</p>
    <p>in this last document, I couldn export it to a PDF to be printed, because it said that the font had copyright  restrictions. It was a real problem because i had to convert to outlines almost 90 pages, and get me into trouble whenever i needed to make corrections (fortunately I kept the editable version of the document) and this meant time and money I spent making a PDF each time  there were corrections.</p>
    <p>• I want to know how this kind of fonts work, and what can I do if this chinese font (or any another) has copyright restrictions. Why did it had restrictions? </p>
    <p>• How does the kerning and leading can affect the reading in chinese? are there any basic rules regarding writing with chinese in an occidental way?</p>
    <p>Links, books, mails etc, is very appreciated.</p>
    <p>Thanks </p>
    <p>Leonardo Vazquez</p>
