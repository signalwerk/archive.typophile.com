    html: <p>Well, there are a few fonts with alternate swash italics (Adobe Caslon, Adobe Garamond, HTF Hoefler Text, etc.), but I suppose that's not exactly the same thing. <br> <br>The only others I can think of are Adobe Poetica (<a href="http://www.myfonts.com/FontFamily4328.html" target="_top">http://www.myfonts.com/FontFamily4328.html</a>) <br> <br>and ITC Zapf Chancery (<a href="http://www.myfonts.com/FontFamily4556.html" target="_top">http://www.myfonts.com/FontFamily4556.html</a>). <br> <br>Both of these are technically italics anyway, with companion italic ITALICS. (I know. Don't ask me. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> ) I think in both cases, the "italic" forms are best used as alternate italics rather than italic forms of the italic. (Okay -- I'm confusing even myself now....) <br> <br>Like Majoor's Seria, though, the italic italics are sloped (well, MORE sloped) than the "roman" italics. (I think I need an aspirin....) <br> <br>David (I think)</p>
