    html: "<p>Fairfield has two sets of Italics, plus swash capitals. It's probably my favorite transitional design. One thing I wish more fonts would have is simply a pairing of Roman uppercase with Italic lowercase as seen in Adobe's Poetica IV. It looks <br>nice in Palatino, though it might not work for <br>every font. <br> <br>If you include the swash uppercase characters, you can have six different kinds of italics per weight of Fairfield: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/954.gif\" alt=\"Fairfield Italics\"></p>"
    html_clean: "<p>Fairfield has two sets of Italics, plus swash capitals. It's probably my favorite transitional design. One thing I wish more fonts would have is simply a pairing of Roman uppercase with Italic lowercase as seen in Adobe's Poetica IV. It looks <br>nice in Palatino, though it might not work for <br>every font. <br> <br>If you include the swash uppercase characters, you can have six different kinds of italics per weight of Fairfield: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/954.gif\" alt=\"Fairfield Italics\"></p>"
  - id: 60934
