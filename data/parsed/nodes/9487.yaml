  html: "<p>What do you guys think of having more than one italics in a typeface? Although this is not a completely original idea, examples are extremely rare, and the two \"historical\" ones I know of (Bembo and Electra) only had a second italics made after the first one was rejected (with the first one losing all promotion). As for contemporary works, the only one (well, the only *other* one... :-) I know of for a fact is the upcoming Sauna (previously \"Sofa\") from the increasingly amazing Underware: <br> <br><a href=\"http://www.underware.nl/site/sauna/general/twoitalics.php3\" target=\"_top\">http://www.underware.nl/site/sauna/general/twoitalics.php3</a> <br> <br>Sauna however isn't a full-fledged text face (by Underware's own admission), so a text face with *intentional* multiple italics I have yet to encounter. The only thing I've heard (again, from a friend in Underware) is that Majoor's recent Seria has a second italics (which makes sense because the \"main\" italics has almost no slant - unorthodox, but I love it), except FontFont does not show it on their site (and I don't know where to look for it). <br> <br>Anyway, thoughts and examples greatly welcome. <br> <br>hhp</p>"
  html_clean: "<p>What do you guys think of having more than one italics in a typeface? Although this is not a completely original idea, examples are extremely rare, and the two \"historical\" ones I know of (Bembo and Electra) only had a second italics made after the first one was rejected (with the first one losing all promotion). As for contemporary works, the only one (well, the only *other* one... :-) I know of for a fact is the upcoming Sauna (previously \"Sofa\") from the increasingly amazing Underware: <br> <br><a href=\"http://www.underware.nl/site/sauna/general/twoitalics.php3\" target=\"_top\" class=\"link-external\">http://www.underware.nl/site/sauna/general/twoitalics.php3</a> <br> <br>Sauna however isn't a full-fledged text face (by Underware's own admission), so a text face with *intentional* multiple italics I have yet to encounter. The only thing I've heard (again, from a friend in Underware) is that Majoor's recent Seria has a second italics (which makes sense because the \"main\" italics has almost no slant - unorthodox, but I love it), except FontFont does not show it on their site (and I don't know where to look for it). <br> <br>Anyway, thoughts and examples greatly welcome. <br> <br>hhp</p>"
