    html: "<p>Wow - great find. <br>So I guess the first column shows the cursive lc italics, and the second shows [what I might call] the \"sober\" lc, and each is paired with three kinds of caps: italics (shared?), roman, and swash. <br> <br>Looking at what MyFonts has*, it seems that the \"sober\" one might be meant for titling (called \"caption\"**), and Adobe says***  that it was actually designed in the 90s by Alex Kaczun. And note that the \"sober\"/caption fonts look bigger on the body than the cursive. So I guess they're not really interchangable in terms of being used with the roman.  :-( <br> <br>BTW, since I started this thread I found a font that comes pretty close to what I'm looking for: Arrow****, by Treacy. But since the second italic was designed as an afterthought (due to customer demand for a clean sloped roman), it's *still* not exactly it... <br> <br>* <br><a href=\"http://www.myfonts.com/FontFamily78.html\" target=\"_top\">http://www.myfonts.com/FontFamily78.html</a> <br> <br>** <br>It's funny that Adobe is now using that term to mean small type. <br> <br>*** <br><a href=\"http://www.adobe.com/type/browser/P/P_281.html\" target=\"_top\">http://www.adobe.com/type/browser/P/P_281.html</a> <br> <br>**** <br>http://www.treacyfaces.com/ <br> <br>hhp</p>"
