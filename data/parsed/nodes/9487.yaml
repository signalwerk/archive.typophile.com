    html: <p> More power to them. I say the more the merrier. To take it one step further, why just italics? Italics are a just a traditional way of mixing two writing styles. It would be cool to see more variations within type "families." There have been some recent forrays into serif, and sans versions of faces that are in fact completely different but work very well together (ie scala), but that isn't extraordinarily innovative. In what other ways could type families be expanded? </p>
