  html: |-
    <p>I've been seeing a few similar styled typefaces lately. They seem to share a similar aesthetic of the single story 'a' and usually have a slight awkward quality to them. Do you think most of these are made by the designers or are there typefaces like this out there?</p>
    <p>A few I know that are similar are <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/neuzeit-grotesk/" rel="nofollow">Neuzeit Grotesk</a>, <a class="freelinking external" href="http://fonts.gestalten.com/index.php/catalog/product/view/id/3559" rel="nofollow">Planeta</a>, of course <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/futura/" rel="nofollow">Futura</a></p>
    <p>I really like the way the 'e' terminal is cut almost awkardly short in the top example.</p>
