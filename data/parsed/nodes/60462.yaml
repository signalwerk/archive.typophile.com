      <p>I think I get it. The top left serif on that lowercase N sticks out. It’s too big and too straight for comfort when we compare it with other more regular text typefaces. Kind of bothers me too.</p>
      <p>In fact, if I get in “designer nitpicking mode”, the whole type bothers me; alignment, lowercase/uppercase mixing, different size mixing (and hence, different stroke widths), kerning (mixing uppercase with lowercase makes that a bit harder) and even some of the details on some of the letters.</p>
      <p>But if I relax, I’d say I really like the whole thing. The looks and feel of it are pretty nice (although not necessarily innovative, but I’m not nitpicking, now) and it kind of makes me want to taste that coffee. And I don’t drink coffee. And of course, that symbol rocks.</p>
