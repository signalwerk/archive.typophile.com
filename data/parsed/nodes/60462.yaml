      <p>I’d try to make it identical (or as close as you can) to the bags they’re actually going to be using and the way they’ll be printed. Do they already have new bags in the works?</p>
      <p>Is there going to be a white square on the bag where all the info goes (eg: roast, blend, etc.)? Take a picture of the bag and put the card next to it to see how close they are. I’m not quite sure if I understand the bottom crease on the card and what part of the bag it’s representing.</p>
      <p>Have you thought about printing on actual mini bags? If you did that, then into each bag (or card) you could insert a few roasted beans which would give it the smell of fresh coffee. Or maybe you could ask the printer to mix some coffee beans into the ink :)</p>
      <p>penn</p>
