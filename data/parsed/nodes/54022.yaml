    html: |-
      <p>smile<br>
      Just had a discussion with my girlfriend about this topic.<br>
      It came up because of the word modern in regards to fonts.<br>
      what is a modern font? I think people just wanted<br>
      everything faster and faster, so there was no time to draw<br>
      nice dropcap letters, there was no time to do something to<br>
      perfection...which evolved to a point where you<br>
      couldn't reduce letterforms anymore and it seems,<br>
      now we start saving on letters, simplify a whole<br>
      language...but where is this going? do we simplify a<br>
      language to a point where we're not using words any<br>
      longer and just grunt at each other?</p>
      <p>smile</p>
      <p>by the way: as a none native english speaker txt language is a pain<br>
      in the ass.</p>
