    <p>The <a href="http://museum.antwerpen.be/plantin_moretus/index_eng.html" rel="nofollow">Plantin Moretus Museum</a> is located at the <em>Vrijdagmarkt</em> in Antwerp, Belgium.</p>
    <p>The Museum is the only printing-office/publisher from the Renaissance- and Barokperiod that is kept till this day. Plantin Moretus is the continuation of the <em>Officina Plantiniana</em>, founded in 1555 by <em>Christoffel Plantin</em>, the first industrial printer in history.</p>
    <p>The unique typographic treasure chamber holds two of the world's oldest printing presses.</p>
    <p>The old library houses the most complete overview of the <em>Officina Plantiniana's</em> production from the 16th to the 19th century.</p>
    <ul>
    <li><strong>4 September 2001:</strong> the Plantin-Moretus archives are added to the list of <em>Memory of the world program</em>, because of it's possession of the oldest documents about the art of book-printing and as a reference to some of the most important cultural and social tendencies of the 16th century.</li>
    <li><strong>15 July 2005:</strong> Unesco adds the historical monument, including all its collections and archives, to the list as <em>Complex woning-ateliers-museum Plantin-Moretus</em></li>
    </ul>
    <p><a href="http://museum.antwerpen.be/plantin_moretus/index_eng.html" rel="nofollow">Plantin Moretus Museum website</a></p>
