    <p>This has nothing to do with making glyphs, but it might make making glyphs easier. </p>
    <p>Make simple sugar for your ice tea/coffee and lemonade. One cup of sugar in a bowl add one cup of boiling water and stir with a spoon. The sugar desolves making simple surup. Simple surup desolves in your ice tea/coffee and lemonade, unlike raw sugar which goes to the bottom of your glass like a lump.</p>
    <p>Lemons and Limes can be a pain to juice. Microwave them for 15 to 20 seconds then cut then into wedges, not across, you get more juice. </p>
    <p>…summertime and the glyphs are easy…</p>
