    <p>Hi.  I am new to this forum and wondering if someone could help me with a question.   I am a huge. St. Cardinals fan.  I am working in making my Christmas cards for next year.  (Dec 2014).  I what to play off the Cardinals Logo.  I will be using 2 hand made cardinals that will be sitting in a pine branch instead of a bat.  I would like to do Merry Christmas in the Cardinals font. </p>
    <p>Can anyone offer any suggestions?  I have attached s copy of what I am trying to recreate.</p>
    <p>Thanks so much for any advice!</p>
    <p>Kim</p>
