    html: <p>Just a caution that any commercial use of their logo — including in a Christmas card that you sell, or send in large quantities on behalf of a business —&nbsp;could result in trouble. A friend of mine works in the licensing department of a team and frequently sues people and has their unauthorized merchandise destroyed. But if your project is strictly a non-business, personal Christmas card that you don't offer for sale, you should be fine.</p>
