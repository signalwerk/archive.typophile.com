    html: <p>Thanks for the feedback everyone!  I have found a font on my one of my die cutting machines that is pretty close to the letter except the C.   Since I am only making 11 cards for the rest of the Cardinal nuts in my family I have traced and hand cut the 11 C's that I need.  Geeze the make it hard for fans!  :)</p>
