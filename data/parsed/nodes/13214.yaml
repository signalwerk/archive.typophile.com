  html: |-
    <p>“Apple's Font Tools 3.0 is a suite of command-line font utilities for developers. This release has been updated for Mac OS X 10.4 and adds the ftxdumpfond and ftxfusefond utilities. It comes as a single installer package and includes a PDF manual, Quick Start, and tutorial.” </p>
    <p><a href="http://developer.apple.com/fonts/OSXTools.html" title="http://developer.apple.com/fonts/OSXTools.html">http://developer.apple.com/fonts/OSXTools.html</a></p>
    <p>Not for the feint of heart, as you can do some serious damage to your System with command line tools. The tool descriptions are intriguing though…</p>
    <p>Bill</p>
