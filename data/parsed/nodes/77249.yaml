    <p>Hi all,<br>
    I do not always have an intuitive eye for these things, and so I figured I'd be better off if I turn to you guys for advice. Here's the thought process I have been through so far with picking fonts for an upcoming magazine design:</p>
    <p>I have been looking at a magazine where they have (in my opinion) beautifully combined lineto's Replica and what I think is Matthew Carter's Miller. Because of budgeting limitations, I started out thinking I could maybe try to replace Miller with Adobe Caslon. That's the first question, I guess: What do you guys think of such a replacement?</p>
    <p>Then I started looking at Replica versus Schwartz’s Graphik. I want a sans-serif I can use both for headings and for body text. Would Graphik work for that? And would it combine with Caslon, or is this just outrageous?</p>
