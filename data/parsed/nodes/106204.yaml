      <p>One of the first posts says:</p>
      <p>I hate to say this, but a font by a programmer makes as much sense as a database library by a font designer.</p>
      <p>So true. However, if no one else is going to design a font in which 0 and O on the one hand, and 1, I, and l, on the other hand, can be easily distinguished, a programmer might have to. Also, for some purposes, programmers may require monospaced typefaces.</p>
      <p>Also, typefaces are aesthetic objects, not technical ones.</p>
      <p>For myself, I would prefer something based on Courier to a light line sans-serif made to imitate the aesthetics of dot-matrix faces.</p>
