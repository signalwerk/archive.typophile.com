    date_raw: 15.Mar.2004 2.56pm
    votes: null
    html: "<p>Hello, all - <br> <br>Good eye, Mark! You're right; it was originally created using Headliners' neo-Belwe B weight. The actual typeface is sharper than this sample, by the way. Here's where the confusion sets in: The tail of g is actually cut and pasted from a different Headliners typeface. My guess, without actually trying it, is Headliners' neo-French Oldstyle (for which there was only one weight). The D looks like it may have not come from Headliners' neo-Belwe, but instead from another Headliners series called neo-Pageantry. Very similar D. I looked in a number of specimen books before replying, and have found no other typefaces that do this combination of things, all in one design. <br> <br>To Jess Gorick: We have not yet digitized these faces, but if you just need the letters as shown above, we can do that for you rapidly. <br> <br>Feel free to e-mail me directly if you are interested. <br> <br>Thanks. <br> <br>Joe <br> <br></p>"
    html_clean: "<p>Hello, all - <br> <br>Good eye, Mark! You're right; it was originally created using Headliners' neo-Belwe B weight. The actual typeface is sharper than this sample, by the way. Here's where the confusion sets in: The tail of g is actually cut and pasted from a different Headliners typeface. My guess, without actually trying it, is Headliners' neo-French Oldstyle (for which there was only one weight). The D looks like it may have not come from Headliners' neo-Belwe, but instead from another Headliners series called neo-Pageantry. Very similar D. I looked in a number of specimen books before replying, and have found no other typefaces that do this combination of things, all in one design. <br> <br>To Jess Gorick: We have not yet digitized these faces, but if you just need the letters as shown above, we can do that for you rapidly. <br> <br>Feel free to e-mail me directly if you are interested. <br> <br>Thanks. <br> <br>Joe <br> <br></p>"
