    date: 2004-03-15T09:23:00
    date_raw: 15.Mar.2004 9.23am
    votes: null
    html: "<p>I think it could be the old Headliners version called neo-Belwe. The one at MyFonts is the Letraset version from the late '70s, but it's not the only attempt to revive the 1926 original. Here's a scan from a Headliners one-line specimen book: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/28601.gif\" alt=\"neobelwe\"> <br> <br>I've condensed the B weight to approximate the title sample. The details seem to match where they don't in the Letraset version. Notice, for example, the bracket in the bottom counter of the B and the treatment of the ascender on the lowercase l. The lowercase e may be tilted clockwise slightly. <br> <br>Unfortunately, this is the only sample of it I have. Headliners never showed complete alphabets in their samples.</p>"
    html_clean: "<p>I think it could be the old Headliners version called neo-Belwe. The one at MyFonts is the Letraset version from the late '70s, but it's not the only attempt to revive the 1926 original. Here's a scan from a Headliners one-line specimen book: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/28601.gif\" alt=\"neobelwe\"> <br> <br>I've condensed the B weight to approximate the title sample. The details seem to match where they don't in the Letraset version. Notice, for example, the bracket in the bottom counter of the B and the treatment of the ascender on the lowercase l. The lowercase e may be tilted clockwise slightly. <br> <br>Unfortunately, this is the only sample of it I have. Headliners never showed complete alphabets in their samples.</p>"
