    <p>hi everybody,</p>
    <p>i hope i am not putting this question in the wrong place, although i guess i am b/c it is a backwards type ID — that is, i know the name of the font, but i just can’t find where to buy it, or even if it is for sale.</p>
    <p>so maybe, what i am asking for is similar fonts to this one?</p>
    <p>it seems that script fonts are somewhat in style now? so i was looking at some type books and found this cool font in the book “typology”, on page 63, #141, it is called “lo kursiv” and is by louis oppenheim and the type specimen sheet says “h. berthold ag” and 1912.</p>
    <p>i looked online and found a foreign site that mention it (a type forum i think in german?), and that has some images (attached), but i can’t seem to find a foundry that has digitized it and sells it.</p>
    <p>any ideas? it is a pretty cool font.</p>
    <p>thanks guys!</p>
