    html: <p>I don't think the font is in one of the Solotype disks. I got a listing once of what was on them. Anyway, I think this typeface is Linotype Memphis, which had identical alternate characters to the A &amp; M shown here. See attached scan from 1930's Linotype Catalog. However, I can't see any evidence that the digital version of Memphis has these characters.<img src="http://www.typophile.com/forums/messages/83/20228.gif" alt="Memphis scan"></p>
