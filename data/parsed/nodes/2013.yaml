    html: <p>Dover has a <a href="http://store.doverpublications.com/by-subject-art-dover-electronic-display-fonts-series--cd-rom-.html">series of cds</a> with display fonts compiled by Dan X. Solo. The font you want might be on one of them -- unfortunately, I haven't found an easy way to know exactly what's on there. You might just have to go to a bookstore or art supplies store and look at them in person. Hope that isn't a wild-goose chase.</p>
    html_clean: <p>Dover has a <a href="http://store.doverpublications.com/by-subject-art-dover-electronic-display-fonts-series--cd-rom-.html" class="link-external">series of cds</a> with display fonts compiled by Dan X. Solo. The font you want might be on one of them -- unfortunately, I haven't found an easy way to know exactly what's on there. You might just have to go to a bookstore or art supplies store and look at them in person. Hope that isn't a wild-goose chase.</p>
