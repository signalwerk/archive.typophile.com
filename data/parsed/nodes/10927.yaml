  html: "<p>CHANK &amp; SPUNK SAY \"QUIT YOUR JOB AND GET TO WORK!\" <br>World-Famous Minneapolis Design Entrepreneurs Lecture on Building Creative Careers <br> <br>MINNEAPOLIS, MN, APRIL 9, 2003 - It's not exactly the career advice that spouses, parents, or friends give a budding entrepreneur, but then again, they haven't actually done it themselves. On the other hand, Chank and Spunk, two well-known and respected Minneapolis-based graphic designers and artists, have created successful businesses by taking their own advice - that is, quitting a secure thing for a thing of their own. <br> <br>WHAT: Quit Your Job &amp; Get to Work! - A lecture featuring Minneapolis design and art entrepreneurs Jeff Johnson of <a href=\"http://www.spunknation.com\">Spunk Studio</a> and Chank Diesel of <a href=\"http://www.chank.com\">The Chank Company</a>. <br> <br>WHERE: <a href=\"http://www.mnbookarts.org\">Open Book</a>, Marshall Field's Performance Hall, 2nd Floor 1011 Washington Ave. South, Minneapolis <br> <br>WHEN: Wednesday, April 16 at 7 p.m. <br> <br>TICKETS: The lecture is open to the public. Tickets are $20 general admission/$15 student rate and are available at <a href=\"http://www.chank.com\" target=\"_blank\">www.chank.com</a>, or by calling 612-782-2245. Tickets will be available at the door, but seating is limited. Advance purchase is advised. <br> <br>Quit Your Job &amp; Get to Work! will review the hazards and rewards of running your own business in the creative field. Johnson and Diesel will each give a one-hour speech addressing how they built successful art and design businesses, and will include slide presentations of portfolios, as well as anecdotes from their experiences as designers and businessmen. Johnson and Diesel are entertaining and inspirational speakers, regularly addressing college classes, design associations, and design convention audiences. <br> <br>Johnson will recount how he got the guts to leave his high-paying design director gig at Fallon, and Diesel will share stories about his life as the \"traveling font salesman\" and his decision to become a fine artist. They</p>"
