    <p>Hi<br>
    This has probably been asked before but with the problems searching at the moment I can't find anything. Does anybody have a list of characters that never appear at the end of a word (in any Latin language)? I'm making a font with end forms for most lower case letters and don't want to clog it up with alternate forms of glyphs. IIRC ae and oe never appear at the end of a word.</p>
