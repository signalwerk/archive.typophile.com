    html: "<p> I don't think you can export via Illustrator 9. Here's a workaround: <br> <br>1. Save your file out as an earlier version (ie. 3.0/3.2) Illustrator EPS. <br> <br>2. Double-click the first character in Fog to pull up the character's edit window. <br> <br>3. Select File/Import/EPS and import your file. </p>"
