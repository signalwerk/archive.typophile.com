    html: <p> This site is great. I'm picking up little bits from all over. I wish there was a Fontographer tutorial put together by someone who actually puts out fonts on a regular basis. This would bring me glee. <br> <br>I'm working on my first couple fonts via Illustrator and Fontographer. Illustrator 9 does not work with Fontogapher. Fontographer should get whipped with a wet noodle for neglecting their product. Is there an update planned? <br> <br>okay, to the nitty-gritty. Remember, I am a neophyte. I'm trying to make the 'Great American Font' It's a continuous reading font with serifs. I am not ready to post anything, but I will as soon as I get a few things figured out. <br> <br>How far under the baseline should a rounded letter go? I've analyzed some fonts and some dip like 1/16 of an inch. <br> <br>What is the trick with kerming? There are advanced settings. The fontographer book is not a real-world guide. What do people actually do? What settings? <br> <br>How long should kerning a font take? (hours, days, weeks?) <br> <br>If a font is ever released to the general public, and it's a continuous-reading font, how important is hinting. I've noticed that certain fonts that come with your computer are very big. They must have hinting. But other free fonts on the internet obviously have no hinting. They are small. <br> <br>How long is hinting supposed to take? (Days, weeks, et cetera) <br> <br>Any people who have actually made and released fonts or any of their colleagues, please post some information. You will make beginners like me happy. <br> <br>emerson </p>
