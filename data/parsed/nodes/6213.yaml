    html: <p><img src="http://www.typophile.com/forums/messages/4101/481.gif" alt="shim"> <br> <br>I'll tell you the trick that actually made fontographer useful to me. When I am ready to export to illustrator (see illustration) I make a rectangular shim and place it directly on the left edge of the letter in question. The bottom of the shim rests on the descender height of the lowest descender, and the top on the ascender height of the highest. This way, all of the letters come in at exactly the right size and perfectly aligned. <br> <br>It's important that the shim not move up or down as you move it from letter to letter, as it will throw off your alignment. I also use the shim to set letterspacing, moving it a little to the left or right depending on the letter.  <br> <br>After pasting each letter simply delete the shim in fontographer. There may be a faster way to do this (someone tell me if they know it), but this has worked best for me so far. <br> <br>Good luck, <br> <br>Christian Robertson</p>
