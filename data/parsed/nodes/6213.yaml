    html: "<p> &gt; How far under the baseline should a rounded letter go? I've analyzed some fonts and some dip like 1/16 of an inch. <br> <br>What's an inch? Worry about em units. <br> <br>In a text face, projections of round parts (and not just at the baseline) should generally be around 15/1000 ems. Projections of pointed parts (like the tip of the lc \"v\", if it's not very flat) should be a little more. <br> <br>BTW, looking at existing fonts is a great idea, as long as you're sure they're good (choose stuff by Matthew Carter). <br> <br>&gt; How long should kerning a font take? <br> <br>It depends on your dedication level as well as the sensitivity of your users. For a basic Latin font, between a day and a week. BTW, avoid auto-kerning. <br> <br>&gt; how important is hinting. <br> <br>There are two kinds of hinting: <br>1. For print: it's very important on laser printers, but not important on high-end offset printing (like in a book). <br>2. For screen: if you expect people to read the font on-screen (as opposed to just typeset it) then hinting (specifically delta-hinting, which is a major pain) is extremely important. But you can always make bitmap fonts instead - that's easier. <br> <br>&gt; How long is hinting supposed to take? <br> <br>I haven't done huge amounts of hinting, <br>but recently I hinted three somewhat similar TT fonts for screen rendering: the first one took almost three weeks (major learning curve), the other two a little over a week each. Hinting for print is a lot easier, but still takes learning and time. <br> <br>&gt; please post some information <br> <br>Just one thing: don't expect too much help from experts, I'm sad to say - they tend to be very protective; mid-range people are generally your best bet. <br> <br>hhp </p>"
