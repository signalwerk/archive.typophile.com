  html: <p> New here. I've been following the site for about a month and thought I'd start a new thread. (where's Hrant?) So here's my question to all of you talented fontmakers and typographers. How do you do it? I've read fontmaking tutorials but most of those are not useful and Fontographer is very vague and outdated. I build my characters in Illustrator, using guides and using the pen and pathfinder tools but I want to know if there are some tricks so that my characters are all the same height, and do you need to convert anchor points, etc. etc. Could someone else who works in Illustrator &gt; Fontographer please give me some insight. <br> <br>thank you. </p>
  html_clean: <p> New here. I've been following the site for about a month and thought I'd start a new thread. (where's Hrant?) So here's my question to all of you talented fontmakers and typographers. How do you do it? I've read fontmaking tutorials but most of those are not useful and Fontographer is very vague and outdated. I build my characters in Illustrator, using guides and using the pen and pathfinder tools but I want to know if there are some tricks so that my characters are all the same height, and do you need to convert anchor points, etc. etc. Could someone else who works in Illustrator &gt; Fontographer please give me some insight. <br> <br>thank you. </p>
