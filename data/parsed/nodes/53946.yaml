      <p>I think there is a limit to how much you can "talk shop" with anyone who does not do that activity.  It's just courtesy to know when you're starting to bore them, and that depends on the other person's level of interest and knowledge. It's not an issue peculiar to type. </p>
      <p>What is different about type is that fewer people understand the passion for it, compared to those who understand a passion for architecture or music. That's one of the reasons why we need Typophile!</p>
