      <p>My husband is pretty understaning and doesn't roll his eyes too much when I stop to  take yet another photo of an interesting sign, he even points potential ones out occasionally, but I try not to go on too much. I also try not to say it aloud every time I recognise a font somewhere…<br>
      Sometimes I can't help myself and go on about something for ages, like this shopping center in Helsinki, they used Coquette for their Christmas ads in 2007 and in 2008 it was a mixture of last years' ads and new ones set in Avant Garde Gothic (that hurt). I try to limit my rants, though.</p>
