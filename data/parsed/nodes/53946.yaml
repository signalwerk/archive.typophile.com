    <p>ok, so i'm a big typenerd. i'm the first to admit it. i get distracted looking at signs when i'm out, i take pics of as many as i can. i often don't see what the product or message is in ads as i just notice the letters...</p>
    <p>i love type specimen books. i can and will talk fonts and/or design for hours. </p>
    <p>so basically, while this would be fine if i was with a bunch of like-minded people, it's caused some strain on my relationship.</p>
    <p>my girl has stuck with me for a year so far, and most of the time she's a good sport about it, but sometimes my passion for type just gets too much for her.</p>
    <p>so basically i'm asking, has anyone else had this or simialr issues with their significant other just not being into type?</p>
    <p>and how do you deal with it?</p>
    <p>thanks!</p>
