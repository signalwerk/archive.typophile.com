      <p>Since you say this was a <cite>series</cite>, I have a hunch that some of it (most probably the VOLTAIRE, and possibly the CERNISEVSKI) was type, but then they couldn't find the same type (and Typophile's ID section was down in that decade ;-) so they either used a bad clone or rendered it by hand. Look at the quality difference between the tops of the legs of the "R"s for one.</p>
      <p>hhp</p>
