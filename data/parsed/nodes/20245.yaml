    html: |-
      <p>If this wasn't before digital, I would said it was stretched by some amateur typographer. Indeed the proportions in the three samples are different.</p>
      <p>Could it be something from Nebiolo ? I found on the page of <a href="http://cg.scs.carleton.ca/~luc/nebiolo" rel="nofollow">Luc Devroye</a> the following description :<br>
      "<strong>Inglesi allungati</strong> (an extremely condesed serif type with high contrast. Looks like something Georg Trump might have done, something like Amati. Never digitized.)"</p>
      <p>I wonder if someone who has typespecimens from Nebiolo could take a look ...</p>
    html_clean: |-
