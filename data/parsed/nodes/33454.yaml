      <p>How are using the face? All caps, upper- and lower-case?</p>
      <p>For all caps, there are a number of fonts that have a similar geometric/Art Deco construction--for some reason, Mostra and Penumbra Sans spring to mind.</p>
      <p>For upper and lower-case, Avenir and Futura are affordable options that are sold in single weights for around $30.</p>
