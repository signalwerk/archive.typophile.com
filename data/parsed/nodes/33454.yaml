    <p>Good morning together!</p>
    <p>I am new in type. Somehow I found this great forum. </p>
    <p>I am working on a logo for non-profit/charitable organization. Eventually I want to use <a href="http://www.houseind.com/index.php?page=showfont&amp;id=18" title="houseind.com Neutraface" rel="nofollow">Neutraface</a>. The family is $249 – pretty much for my uncompensated project.</p>
    <p>Do you know a way out? Is there a similar free font? Would House Industries probably give me a great discount (I do not need the whole family, it is for charity, it is only used in one single logo)?</p>
    <p>Thank you for your help!<br>
    lu</p>
