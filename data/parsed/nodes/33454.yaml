      <p>If you just need certain letters/characters of a single cut, why not just ask someone to typeset those letters for you, convert them to paths, and send you an .EPS file? I'm sure that someone could work out a reasonable price, or it's a charity/pro-bono job, maybe they could just donate their time as you are.</p>
      <p>In the olden days, when you ordered type, you just got a page with the type you asked for, and then cut it up, enlarged it, etc as needed.</p>
      <p>You might also try scanning from one of their catalogs, but you probably won't get a clean enough image to work with.</p>
      <p>Sean Glenn<br>
      Art Director<br>
      <a href="http://www.superunicorn.com" title="www.superunicorn.com">www.superunicorn.com</a></p>
