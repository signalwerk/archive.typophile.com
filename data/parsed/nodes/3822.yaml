    date: 2002-11-04T02:58:00
    votes: null
    html: <p> krrrristos... happy birthday for yesterday... as for the posters, all of them are very nice... my favourite (and natasha's, if this interests you) is the fourth one... i think it catches the eye very fast, but on the other hand maybe you're getting bored also that fast, because of the empty space on the left and on the right... the middle part is maybe too dynamic for the empty spaces... the red "s" is also problematic used on the raster... although red and black are very powerful, maybe they are getting monotonous... i don't know... i'm just expressing my thoughts... the fifth proposal has also a dynamic effect, but i'm not sure if the national theatre of northern greece would understand that you have put their logo on top left (me, i like this contradictional behaviour)... your first proposal has very nice typography, but i get tired seeing again this cliche of a "t" used as a dagger... out of number 2 and 3, i like the 3 more... i don't like the vertical use of bodoni in proposal number 2... proposal number 3 should be the one which should be used by n.t.n.g. for advertising their new play... in number 3 i don't like the dagger on the right part of it... have you thought of using number 4's background in the right half of number 3?.. keep on shining, krrrristos... </p>
