    date: 2002-11-01T05:12:00
    votes: null
    html: <p> Thank you all for the comments. To be honest I didn't expect such a response and I appreciate it. The fonts I used are various including a version of Trajan by a Greek office (CFColloseum), Galliard (by Bitstream) Bauer Bodoni Titling and a version of Futura Condensed Bold. <br>I am pleased that you can imagine the hand that is holding the knife in the 3rd poster, 'cause I was afraid that it another eye wouldn't catch it. <br>The target group is...people who go to opera,(whatever that means)... I guess are educated at least about opera...but the client is the "Thessaloniki Opera" and they have not such an organized office to give as a decent briefing. They expect no radical solutions and they are pleased to be understood by the common public. <br>Thanks again all for your views and I apologize for my spelling and the delay of the work on the font I started...I am not sure if I will keep on working on it because I don't believe in it so much...time will show maybe <br> <br>have a shinny and creative day </p>
