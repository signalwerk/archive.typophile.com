  html: "<p>These are some roughs for a poster to announce the play in Thessaloniki of the famous opera of Puccini, \"Tosca\".  <br> <br>The (very short) story of the play:  <br>In the beginning of 18th century in France, a young, beutifull and very famous soprano (Tosca), is blackmaled by a powerfull man, to marry her. In the most tragic moment of the play Tosca is killing him with a knife, while he was ready to sign the death sentence of the young man that Tosca was in love with. The couple is chased by the law and in the end they suicide, falling from a window. <br> <br>I know that the style is old fashioned, but that's the way the customer needs it. <br> <br>Any comments? <br> <br>PS I know...i forgot to put the name of Puccini... <br> <br><img src=\"http://www.typophile.com/forums/messages/29/2946.jpg\" alt=\"1.jpg\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/2947.jpg\" alt=\"2.jpg\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/2948.jpg\" alt=\"3.jpg\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/2949.jpg\" alt=\"4.jpg\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/2950.jpg\" alt=\"5.jpg\"></p>"
