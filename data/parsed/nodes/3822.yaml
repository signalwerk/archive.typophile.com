    html: "<p> i like these. the first is maybe a little too dramatic, with the knife in hand, but it's a treatment i think the general public would appreciate. <br> <br>the third would be my pick, the invisible hand being one of the reasons. i also like how the audience is shown, and the contrast of the color of the audience against the black. what if \"tosca\" were a little smaller and confined to the black area? that would keep only one element interacting with both sides of the poster. <br> <br>#5 is too much like a horor movie, but #4 is great. reminds me of saul bass and the man with golden arm. very cool, but still not as classy and tragic as #3. </p>"
