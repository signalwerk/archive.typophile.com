    html: |-
      <p>Certainly a logo or symbol can have negative connotations (a nazi flag, for instance).</p>
      <p>Regarding the modified/vandalized BP logos, I doubt if they have any substantive impact with the general public, other than with those people who already have negative feelings towards BP. </p>
      <p>A more common reason for a logo having negative connotation is that it makes the company look old-fashioned, or highlights a technology that's now frowned on. For example, an old logo for a power company showing smoke stacks with billows of smoke. A few decades ago those smokestacks would be a symbol of power and progress; today they would symbolize pollution.</p>
