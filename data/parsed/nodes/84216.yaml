    html: |-
      <p>The images you showed aren't examples of a company rebranding, they're examples of a well-known logo being turned into propaganda against a corporation: In effect, leveraging its own brand recognition to discredit the brand.</p>
      <p>Sometimes companies rebrand to keep up with public opinion: Ronald McDonald is far more trim and athletic than he used to be. And Fred Flintstone no longer appears in cigarette commercials. </p>
      <p>Some brand disasters are unrelated to the product itself. The weight-loss candy product called AYDS disappeared after the the disease AIDS became widely known. </p>
      <p>Ford is a great master of protecting the integrity of the brand through a series of disasters. The blue oval seems to be made of Teflon, surviving the Edsel debacle, the Pinto and Explorer lawsuits, and OJ's notorious Bronco chase.</p>
