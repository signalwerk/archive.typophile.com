    <p>Hi, I have a gig coming up in Rome...the last time I was there, one of my colleagues had some super-nice calling cards engraved at a famous, old printing/engraving place...she said it's called Barberieni, and it's located close to the House of State...</p>
    <p>I've looked and googled everywhere and cannot find anything about it online, which seems to be not uncommon for Italian places of commerce ;)</p>
    <p>Any Roman designers here (or designers who know Rome) who may know more about this place and where they are located, exactly?</p>
    <p>Thanks!</p>
