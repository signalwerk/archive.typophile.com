      <p>I ended up not having enough spare time to hand-bind a version, but I got a copy printed from one of the print-on-demand companies, which turned out not to be as bad as I was expecting.</p>
      <p>It’s very interesting to see the final version in print. I’m mostly quite pleased with it, but there are lots of lessons to learn for the future, particularly with regards to margins and to the first few sections of each chapter.</p>
      <p>I’ll see if I can sort out the pdf so that others can downloaded it, if anyone is interested.</p>
      <p>Many thanks for all the help and advice!</p>
