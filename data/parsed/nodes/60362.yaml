      <p>Thanks for all the thoughts so far. I left this a few days for contemplation (one of the advantages of being an amateur, I suppose!) and have since been trying a few other changes. A new version of the front matter and the first few pages should be attached to the front page.</p>
      <p>The main things that I have changed are:<br>
      The margins for the Introductions have had to be increased quite a bit so that the long introduction to Book 10 stays on one page. In compensation I’ve therefore dropped the running titles from those pages, which I think works quite well.<br>
      The location of the line-numbers has moved slightly to the right which should, with a bit of luck, avoid the need to break any lines of verse.<br>
      A contents page allows the first page of each section to be on the recto (and have an odd page number).<br>
      I’ve heeded the advice and removed the discretionary ligatures.</p>
      <p>I think, with all the help here, I’m nearly there. The only thing I am now uncertain about is the first page of verse in each book. I can’t help wondering whether it needs something more distinctive; I’m slightly worried that the “Book x” running title (which appears there for the first time), looks more like a title than a running title and makes it seem a little weak.</p>
      <p>Ivan: If it’s the written form of the book that’s the problem, I could relieve you of your hard-copy of the Milton in exchange for the Naxos <a class="freelinking external link-external" href="http://www.amazon.co.uk/Paradise-Lost-John-Milton/dp/9626343508" rel="nofollow">audio-book version</a> ;-)</p>
      <p>Lex: I think you’ve got it in one ;-)</p>
