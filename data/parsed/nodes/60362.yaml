      <p>I like the overall look of your layout, it's a nice work. The poetry pages are very beautiful and readable. Here's what I don't like;</p>
      <p>- I would set the title Paradise Lost with the regular lowercase "s", as other people already said; this is a book set in 2009, so I don't see why using such typographycal anacronysm. Equally, I would disable the discretionary ligatures in the text (ct, sp, etc...), they "disturb" the reading process, in my opinion. Storm's Jannon is a great choice, by the way.</p>
      <p>- What is the exact function of the first page, anyway? You already have the title page on page 3.</p>
      <p>- An observation on the page layout: the page numbers are too close to the bottom of the page, giving the impression that the text block is falling down. You should also increase the size of the bottom margins.</p>
      <p>- I would delete the page number on the verso with the Blake illustration, it's not necessary.</p>
      <p>- Perhaps, page numbers could be 1 point smaller?</p>
      <p>Keep up the good work!</p>
