      <p>@ ncaleffi:</p>
      <p>Many thanks for your post and your suggestions which were really helpful. I've added a new PDF incorporating some of the changes you suggest; particularly the three suggestions about the page numbers. I’m going to think about the ligatures and play around with several ideas.</p>
      <p>I've also messed around with the front-matter a bit more. I think the Title Page looks a bit better now, but I'm slightly worried that it looks too much like a pastiche of a 17th Century one, and perhaps ought to be a bit more modern.</p>
      <p>The very first page is supposed to be a Half Title page (i.e. to be the recto which should have the end paper as its verso) but perhaps I’m misunderstanding the book binding process? That’s why I was slightly bothered about ending up with the pages reversed. At the moment each Book starts on the verso, with the illustration on the recto and the poem appearing overleaf. </p>
      <p>Finally, on a different issue, I was wondering if there were any suggestions about how to deal with this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/clash_6478.png"></div><p></p>
      <p>It looks like in the first 6 books (over 5,000 lines) there’s only one line which actually clashes with the numbering and about 3 more which are just a bit too close. I wonder whether it be preferable to split the line or drop the line numbers. As so few lines have this problem, I’m unwilling to move the numbering further too the right.</p>
      <p>Many thanks for all your suggestions, again.</p>
