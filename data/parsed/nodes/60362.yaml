      <p>Hmm...The S and C ligatures will need some thought; I really like them and one of reasons for doing this edition is that there aren’t any that are available with them. That said, they do rather stand out. Particularly as, historically, most of the S ligatures would be less prominent due to the long-Ss (i.e. there would be lots of ſt and ſp rather than st and sp). One experiment might be to keep the sp ones and remove the st and C ones, they occur much more rarely. Or just keep them in the italic introductions.</p>
      <p>Other changes: I’ve changed the titles to Paradise Lost from Paradiſe Loſt. That’s also necessitated changing the running title to small-caps to avoid an st ligature that looked very out-of-place. I’m not quite sure what to do with the main titles as I think the Long-Ss added interest which are now missing.</p>
      <p>Could anyone help me with the following? I’ve been putting the names of the main characters (i.e. God and Satan) in small-caps. Is that too over-the-top?</p>
      <p>Also, how should the abbreviation of "the" to "th’" be set? Most of the examples I can find set it with a space like this: th’ Empyreal Heav’n, but I can’t help thinking it would look better in many cases as th’Empyreal Heav’n.</p>
      <p>The page below is the first one I can find which has Satan in small-caps and a “the” abbreviated to “th’”:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/pl_test_6272.png"></div><p></p>
