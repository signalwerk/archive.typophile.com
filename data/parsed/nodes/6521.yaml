    date: 2003-01-28T09:33:00
    date_raw: 28 Jan 2003 — 9:33am
    votes: null
    html: "<p>Hrant:  <br><i>What bugs me about the Golden Section is this: since it   <br>deals with proportions of </i>length<i>, when you use it for   <br>surfaces (like in type design), do you </i>square-root<i> it?</i>  <br>  <br>No! If you have a rectangle and sections the longer side   <br>according to the golden ratio the areas you get will still   <br>be, of course, in the (A+B/A = A/B) relationship.  <br>This is a misleading question. The \"visual assessment\" of   <br>the relationships of surfaces was not very much the point.   <br>The two more important applications of the golden ratio  <br>were the golden section (=cut) which deals with the   <br>positioning of an element inside a certain width, and the   <br>golden rectangle, which is a shape. Though the ratio is the   <br>same, these are quite unrelated perceptual experiences.   <br>Naturally, if the rectangle you sectioned above was a   <br>golden rectangle to begin with, you get a square and a   <br>new golden rectangle, so you begin to tie the loose ends.  <br>  <br>Now, the mathematical validity of the golden ratio is   <br>universal, it turns up in many natural phenomena (*),   <br>etc., but the question is: does it have any <i>aesthetic</i>   <br>validity outside the area of Greek cultural influence   <br>(the so-called \"West\")? For instance does it appear in   <br>Islamic (**) architecture and decoration somehow? (As   <br>you know, the Muslims were the heirs and \"keepers\" of   <br>Greek culture through the middle ages.) In China? In   <br>Japan?  <br>  <br>For those interested in the golden ratio, I recommend a nice   <br>little book called <i>The Divine Proportion</i>, by H.E. Huntley.   <br>It's edited by Dover, and not hard to find, I think.  <br>  <br>(*) <a href=\"http://www.guardian.co.uk/online/science/story/0%2C12450%2C875198%2C00.html\" target=\"_blank\">http://www.guardian.co.uk/online/science/story/0,12450,875198,00.html</a>  <br>  <br>(**) The golden ratio is directly related to the pentagon,   <br>and the Muslims have a much greater interest in the octagon,   <br>AFAIK.</p>"
    html_clean: "<p>Hrant:  <br><i>What bugs me about the Golden Section is this: since it   <br>deals with proportions of </i>length<i>, when you use it for   <br>surfaces (like in type design), do you </i>square-root<i> it?</i>  <br>  <br>No! If you have a rectangle and sections the longer side   <br>according to the golden ratio the areas you get will still   <br>be, of course, in the (A+B/A = A/B) relationship.  <br>This is a misleading question. The \"visual assessment\" of   <br>the relationships of surfaces was not very much the point.   <br>The two more important applications of the golden ratio  <br>were the golden section (=cut) which deals with the   <br>positioning of an element inside a certain width, and the   <br>golden rectangle, which is a shape. Though the ratio is the   <br>same, these are quite unrelated perceptual experiences.   <br>Naturally, if the rectangle you sectioned above was a   <br>golden rectangle to begin with, you get a square and a   <br>new golden rectangle, so you begin to tie the loose ends.  <br>  <br>Now, the mathematical validity of the golden ratio is   <br>universal, it turns up in many natural phenomena (*),   <br>etc., but the question is: does it have any <i>aesthetic</i>   <br>validity outside the area of Greek cultural influence   <br>(the so-called \"West\")? For instance does it appear in   <br>Islamic (**) architecture and decoration somehow? (As   <br>you know, the Muslims were the heirs and \"keepers\" of   <br>Greek culture through the middle ages.) In China? In   <br>Japan?  <br>  <br>For those interested in the golden ratio, I recommend a nice   <br>little book called <i>The Divine Proportion</i>, by H.E. Huntley.   <br>It's edited by Dover, and not hard to find, I think.  <br>  <br>(*) <a href=\"http://www.guardian.co.uk/online/science/story/0%2C12450%2C875198%2C00.html\" target=\"_blank\">http://www.guardian.co.uk/online/science/story/0,12450,875198,00.html</a>  <br>  <br>(**) The golden ratio is directly related to the pentagon,   <br>and the Muslims have a much greater interest in the octagon,   <br>AFAIK.</p>"
