    html: "<p>hmmmm. The golden section is quite a big subject.  <br>It's not that difficult. (I wrote a paper about it <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> ). Maybe first a link to start: <a href=\"http://www.mcs.surrey.ac.uk/Personal/R.Knott/Fibonacci/phi.html#golden\">the pages of mr Knott</a>, which have a big deal to say about the golden section, and helped me alot.  Non-designed, but filled with information &amp; examples on the subject. (I always liked the part about Fibonnacci and his rabbits <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">) <br> <br>In fact, it is just a proportion of 1 to 1,618.... Some people believe this is the \"divine proportion\" because it appears in nature so often (this has rather economical reasons, see Professor Knott's pages). I think it is rather difficult to apply to design, because of it's irrational nature. Le Corbusier used it to design his buildings (he made a system out of it, called 'le Modulor'); Wiedemann used it in his Corporate ACE-typefaces (and the Mercedes-star). Many bookcovers have this proportion also. There is alot written about applying this to bookdesign (see Bringhurts \"Elements of Typography\" for instance), and I think Tschichold studied it and distilled a method to apply it to the margins of a page... <br> <br>hope this gets you going...</p>"
    html_clean: "<p>hmmmm. The golden section is quite a big subject.  <br>It's not that difficult. (I wrote a paper about it <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> ). Maybe first a link to start: <a href=\"http://www.mcs.surrey.ac.uk/Personal/R.Knott/Fibonacci/phi.html#golden\">the pages of mr Knott</a>, which have a big deal to say about the golden section, and helped me alot.  Non-designed, but filled with information &amp; examples on the subject. (I always liked the part about Fibonnacci and his rabbits <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">) <br> <br>In fact, it is just a proportion of 1 to 1,618.... Some people believe this is the \"divine proportion\" because it appears in nature so often (this has rather economical reasons, see Professor Knott's pages). I think it is rather difficult to apply to design, because of it's irrational nature. Le Corbusier used it to design his buildings (he made a system out of it, called 'le Modulor'); Wiedemann used it in his Corporate ACE-typefaces (and the Mercedes-star). Many bookcovers have this proportion also. There is alot written about applying this to bookdesign (see Bringhurts \"Elements of Typography\" for instance), and I think Tschichold studied it and distilled a method to apply it to the margins of a page... <br> <br>hope this gets you going...</p>"
