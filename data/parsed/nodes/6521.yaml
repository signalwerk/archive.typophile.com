  html: <p>Ok.. granted I hav not taken a huge amount of time trying to comprehend this -- Golden Section -- rule.  But being a man with a seemingly un-annalitical brain, I just cant exactly comprehend this.  Could somone spell this out in lamens terms?  All I have ever seen written on it is very technical mathmatical expressions. Does anyone have any good examples of layouts that comply to the guidlines of the Golden Section??  Would love to hear/learn more about this. <br> <br>hildebrant. <br></p>
