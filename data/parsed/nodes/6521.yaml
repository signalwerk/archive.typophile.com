    html: "<p>I'm sure somebody can point you to a nice web resource, but I would recommend a book: \"Geometry in Design\" by Kimberly Elam. It's a \"light\" work, but contains a nice treatment of various geometric \"ideals\" in design, and Nature. Of course it has a section on the Golden Section. <br> <br>What bugs me about the Golden Section is this: since it deals with proportions of <i>length</i>, when you use it for surfaces (like in type design), do you <i>square-root</i> it? I've never seen a convincing discussion of that. <br> <br>BTW, I also have an article from an old issue of PEI (back when they encouraged thinking, instead of being a source for Qwik Trix with Fotopix type ••••) that discussed the Golden Section with great insight. But please don't ask me to find it!  :-/ <br> <br>hhp <br></p>"
    html_clean: "<p>I'm sure somebody can point you to a nice web resource, but I would recommend a book: \"Geometry in Design\" by Kimberly Elam. It's a \"light\" work, but contains a nice treatment of various geometric \"ideals\" in design, and Nature. Of course it has a section on the Golden Section. <br> <br>What bugs me about the Golden Section is this: since it deals with proportions of <i>length</i>, when you use it for surfaces (like in type design), do you <i>square-root</i> it? I've never seen a convincing discussion of that. <br> <br>BTW, I also have an article from an old issue of PEI (back when they encouraged thinking, instead of being a source for Qwik Trix with Fotopix type ••••) that discussed the Golden Section with great insight. But please don't ask me to find it!  :-/ <br> <br>hhp <br></p>"
