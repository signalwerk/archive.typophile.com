    html: "<p>You can see a flash animation demonstrating how to construct a rectangle conforming to a Golden Section at Textism &lt;a href=\"<a href=\"http://www.textism.com/bucket/fibsquare.html\" target=\"_blank\">http://www.textism.com/bucket/fibsquare.html</a>\"&gt; here. &lt;/a&gt; <br>The ratio of a golden section can be represented by a line bisected in such a way that the ratio of the smaller \"piece\" to the larger piece is equal to the ratio of the larger piece to the whole.  <br> <br>Sort of like this: <br>----------|------  <br>(but don't count those hypens, it can't be shown with whole units - it's roughly 1:1.6, but really it's an irrational.</p>"
