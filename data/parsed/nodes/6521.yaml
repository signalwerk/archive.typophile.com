    html: "<p>Hrant, you're to quick for me! Yes 'Geometry in Design' is a indeed good book for showing some examples of applying the GS. I forgot about it ... <br> <br>There are many proportion-systems, Palladio used the  proportions that are based on the musical harmonies. There is a magnificent book on that (only architecture tough) by <b>Rudolf Wittkower</b>: <i>Architectural Principles in the Age of Humanism</i> (1949).  <br>I think one should just find a system (or make up his own) that suits him (and the job) and apply that to his design, so you have a certain consistency in your design. </p>"
    html_clean: "<p>Hrant, you're to quick for me! Yes 'Geometry in Design' is a indeed good book for showing some examples of applying the GS. I forgot about it ... <br> <br>There are many proportion-systems, Palladio used the  proportions that are based on the musical harmonies. There is a magnificent book on that (only architecture tough) by <b>Rudolf Wittkower</b>: <i>Architectural Principles in the Age of Humanism</i> (1949).  <br>I think one should just find a system (or make up his own) that suits him (and the job) and apply that to his design, so you have a certain consistency in your design. </p>"
  - id: 45764
