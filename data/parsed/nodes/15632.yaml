    <p>“Say it with fonts” - P22’s Pre-holiday gift giving sale!</p>
    <p>For the first time, we are offering 50% off on select,<br>
    packaged, P22 artist-themed fonts (see details below).<br>
    Give a unique gift this season with a packaged CD font<br>
    set. These packaged font sets have long been the way that<br>
    many people have been introduced to the world of P22 and<br>
    they make great gifts. For two weeks only, you can get the<br>
    following four P22 CD titles for 50% off or $14.98 each:</p>
    <p>Vincent - http://www.p22.com/products/vincent.html<br>
    Vienna - http://www.p22.com/products/vienna.html<br>
    Art Deco - http://www.p22.com/products/artdeco.html<br>
    Koch Signs - <a href="http://www.p22.com/products/kochsigns.html">http://www.p22.com/products/kochsigns.html</a></p>
    <p>— This offer is valid through October 31st.<br>
    — Does not apply to downloads.<br>
    — Shipping is not included<br>
    — No limit to the number ordered, but quantities are<br>
    limited.</p>
    <p>To order the boxed sets, you can place an order on-line or<br>
    call 1 800 722 5080.</p>
    <p>BUT if you are not ready for the Winter holidays yet, and<br>
    still need to make Halloween party invitations… you are<br>
    in luck!</p>
    <p>INTRODUCING: LTC Halloween Ornaments</p>
    <p>Halloween is a time when perfectly reasonable people<br>
    choose to reenact some lost pagan rituals. No one seems to<br>
    know why exactly, but Halloween has been celebrated in its<br>
    present form for a little over one hundred years. This new<br>
    set of ornaments dates back to the early 20th century and<br>
    depicts a “classic” Halloween collection of black cats,<br>
    pumpkins, witches and other indispensable Halloween<br>
    ornaments.</p>
    <p>Special intro sale price. 50% OFF - only $10 (until<br>
    Halloween 2005) <a href="http://www.p22.com/lanston/products/halloween.html">http://www.p22.com/lanston/products/halloween.html</a></p>
