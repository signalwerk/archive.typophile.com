  date: 2007-01-03T04:01:00
  date_raw: 3 Jan 2007 — 4:01am
  votes: null
  html: <p>Every car's logo seems to use custom type, and pretty cool type at that.  Where is all this original work coming from?  Are designers from major foundries commissioned?  Then why aren't they making fonts this cool?  And can anyone think of another industry that generates as much custom type?</p>
  html_clean: <p>Every car's logo seems to use custom type, and pretty cool type at that.  Where is all this original work coming from?  Are designers from major foundries commissioned?  Then why aren't they making fonts this cool?  And can anyone think of another industry that generates as much custom type?</p>
