    html: |-
      <p>Can you show us some examples of car logos you like? Maybe they just look so much cooler, because they are in chrome and not in black and white? ;-)</p>
      <p>When it comes to those script-like car logos, it makes a big difference to make ONE word look good or to make a typeface, because of the problem of all the letter ligatures. I am just in the process of making a font inspired by car logos, and I can tell you it's not easy. Without the relatively new OpenType technology it would be impossible at all. So I learned pretty quick, why there are not much fonts in this style.</p>
      <p>Ralf</p>
