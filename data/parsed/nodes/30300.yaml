    html: |-
      <p>Porsche has all it's own fonts. It has the script it has been using for years and no one has ripped off or digitized. It has even taken Franklin Gothic and put it's own spin on it, so that when you see a genuine Porsche ad it is in genuine Porsche Franklin Gothic.</p>
      <p>Land Rover has been using fonts that the public can buy. Last year they switched their body copy to a font that is sold in England, and well, I couldn't see spending the money they were asking. (I've put it in Eurostile, and Y&amp;R have been okay with the results -- because we are getting paid.)</p>
      <p>Many of the cars have fonts that look original, but they have been modified to get the "logo type look."</p>
      <p>It remind me of publishing -- during the days when every titled was handlettered. Only, they weren't all handlettered -- so many were handtailored. A swash added here, a line deleted there - and voila - a great looking three word title...</p>
