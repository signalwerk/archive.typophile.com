    html: |-
      <p>&gt; Then why aren’t they making fonts this cool?</p>
      <p>Well, it is a lot easier to make six or eight letters "cool" than an entire set of glyphs. With a font you might have to change the shape of one letter to provide visual consistency with others.</p>
      <p>Basically, there is a big difference between creating a logo and creating a font.</p>
