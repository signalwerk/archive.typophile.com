    <p>Newbie here - go easy... (i've been reading thru many, many forum topics to get an understanding of the process. I have little grasp of the advanced terminology)...</p>
    <p>I found an old european book that has a few alphabets that i would like to digitize. I have done a search of the author ( i assume he designed the alphabets as no other credit is given), and it appears he has been dead for over 20 years. Very little other info.</p>
    <p>I can make vector drawings of the glyphs, but after that i wouldnt have the knowledge or the patience to do what else is needed to turn them into a working font.</p>
    <p>i'm glad to hire someone to do it for me if the cost seems reasonable.<br>
    advice?<br>
    thanks!!</p>
