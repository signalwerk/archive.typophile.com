      <p>I can't speak for others, but from me you would not find the cost reasonable.</p>
      <p>My suggestion is that you buy a copy of TypeTool 3 for $99 from FontLab (<a href="http://www.fontlab.com" title="www.fontlab.com">www.fontlab.com</a>). The documentation should be sufficient to help you make the fonts yourself since you can already do the art. There is a demo version you can download from the same page and try before you buy to help you make a decision.</p>
