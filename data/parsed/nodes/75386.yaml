    html: "<p>This agreement may not imply anything for FontLab's own product development. It is notable I think that FL are only going to be selling OTMaster, and not any of the other DTL tools such as KernMaster. OTMaster is a table editing tool, something that has been missing from FontLab's product line, but something that they are aware that people need. Over the years, I've used a number of tools that enabled direct editing of TTF/OTF tables, mostly for post-processing of fonts generated from FL or compiled from VOLT and/or VTT, or for copying tables between different fonts. I have to say that DTL OTMaster is the best of such tools, so this is a smart move on FontLab's part: why expend development effort creating a table editor when someone else has already made such a good one.</p>"
    html_clean: "<p>This agreement may not imply anything for FontLab's own product development. It is notable I think that FL are only going to be selling OTMaster, and not any of the other DTL tools such as KernMaster. OTMaster is a table editing tool, something that has been missing from FontLab's product line, but something that they are aware that people need. Over the years, I've used a number of tools that enabled direct editing of TTF/OTF tables, mostly for post-processing of fonts generated from FL or compiled from VOLT and/or VTT, or for copying tables between different fonts. I have to say that DTL OTMaster is the best of such tools, so this is a smart move on FontLab's part: why expend development effort creating a table editor when someone else has already made such a good one.</p>"
