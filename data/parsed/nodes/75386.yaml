    html: |-
      <p>Indeed, we've entered a collaboration with DTL in such a way that they of course remain to be the vendor of the software, and in complete control over its development, and Fontlab Ltd. acts as a distributor. It's interesting, because this is the first time where fontlab.com actually sells non-FontLab software. </p>
      <p>DTL OTMaster was the obvious choice as the first product to offer, because it's quite self-contained (opens and saves OpenType fonts). So it does not directly fit into any *particular* tool workflow, but can be used with any workflow. </p>
      <p>This does not mean that it's the only tool we'll be selling. We are interested in increasing interoperability between font editing applications, so I feel we'll need to do some work in order to achieve that. I for myself certainly would like to make sure that we're making tools available to the users that are easy to work with, and to mix with each other. </p>
      <p>I consider this the first step, not the only step. </p>
      <p>Importing and exporting UFO files is definitely planned for most if not all new versions of our apps. The more formats we support the better.</p>
