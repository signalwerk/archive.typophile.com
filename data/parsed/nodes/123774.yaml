      <p>I’m inclined to think that the lettering concept is quite original, a response to the serendipity of the photo’s distortion. 1965 was too early for the West Coast psychedelic lettering style in which Wes Wilson morphed jugendstijl. Just look at the early Family Dog posters from 1966, it’s not emerged yet.</p>
      <p>The album art fashion in the UK beat group/mod era of the early-mid 1960s was for strong typography, lots of Compacta, a reaction against the hand-lettering of the late 1950s—which would include the beatnik style of loose interlocking.</p>
      <p>Just look at the title of the Stones’ 1966 album Aftermath, based on Impact-like letter-forms. Hand-drawn, but still wedded to the mod(ernist) aesthetic. <a href="http://wwwrollingstones.wpengine.netdna-cdn.com/files/1966/04/aftermath-uk-600x600.jpg" title="http://wwwrollingstones.wpengine.netdna-cdn.com/files/1966/04/aftermath-uk-600x600.jpg">http://wwwrollingstones.wpengine.netdna-cdn.com/files/1966/04/aftermath-...</a></p>
      <p>Modernism and psychedelia were parallel trends in the 1960s, the modernism slightly earlier.</p>
      <p>Donovan album from 1965—he transitioned from folk to psychedelic, his producer Mickie Most had an eclectic influence. <a href="http://www.hotplatters.com/images/2-182.jpg" title="http://www.hotplatters.com/images/2-182.jpg">http://www.hotplatters.com/images/2-182.jpg</a> That’s as close as it gets.</p>
