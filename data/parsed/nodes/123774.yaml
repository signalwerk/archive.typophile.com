      <p>Nick:  I'm writing the story about the cover art on each Beatles' UK album.  Stories have been published in "Beatlefan" magazine in the issue marking each album's 50th anniversary.  "Help!" comes up this summer; "Rubber Soul" for the holidays.  I'll take you up on your offer for your observations about the typography on upcoming albums - thank you very much for offering!</p>
      <p>I'm not writing about the US releases except in cases where thew US covers were based on the UK art, such as "With/Meet The Beatles", "A Hard Day's Night", "Help", and, now, "Rubber Soul", which was the first cover truly shared by UK and US releases (although the songs were different).</p>
      <p>Thanks again for your interest, time and insights.   Looking forward to further discussions. Best, Ken</p>
