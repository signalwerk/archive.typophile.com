  html: |-
    <p>Can anyone identify this font? I used it on some CD labels that I printed a few years back before my computer crashed and I lost all my fonts. I'm pretty sure that it was a free font that I downloaded around 2003-2004. When I go into the Properties/Font window in Mediaface (CD labeling software), it says that the font is "Sleepwalk," but I can't find anything by that name and it didn't offer any substitutes.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sleepwalk_4217.jpg"></div><p></p>
