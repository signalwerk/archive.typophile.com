      <p>The most important thing you can do is to fine-tune the typography of your text type.<br>
      The variables are :<br>
      -column width<br>
      -type size<br>
      -leading<br>
      -tracking<br>
      -H&amp;J setting<br>
      Notice that I haven't mentioned choice of font.<br>
      Anyway, experiment by doing test settings of the same piece of text, varying these typographic parameters slightly against one another, until you have a setting you're happy with.</p>
