      <p>Editor. Maybe we should take a different approach. Try focusing on overall identity, not just a fancy graphic-nameplate. (Just my opinion) Get these books if you do not already own them! They will help you.</p>
      <p><a href="http://www.amazon.com/gp/product/0972424032/002-8529655-1696001?v=glance&amp;n=283155" rel="nofollow">Contemporary Newspaper Design - John Berry/Roger Black</a><br>
      <a href="http://www.amazon.com/gp/product/0072492910/qid=1141082105/sr=2-1/ref=pd_bbs_b_2_1/002-8529655-1696001?s=books&amp;v=glance&amp;n=283155" rel="nofollow">The Newspaper Designer's Handbook - Tim Harrower</a><br>
      <a href="http://www.amazon.com/gp/product/1592531695/qid=1141082164/sr=2-1/ref=pd_bbs_b_2_1/002-8529655-1696001?s=books&amp;v=glance&amp;n=283155" rel="nofollow">Any SND compilation work</a></p>
      <p>If you want to check out other college newspapers, and get an exchange, check out:</p>
      <p><a href="http://www.bsudailynews.com/" rel="nofollow">The Ball State Daily News</a><br>
      <a href="http://www.idsnews.com/news/index.php" rel="nofollow">The Indiana Daily Student</a><br>
      <a href="http://www.dailyneb.com" rel="nofollow">The Daily Nebraskan</a><br>
      <a href="http://www.dailyorange.com/" rel="nofollow">The Daily Orange</a><br>
      <a href="http://www.dailytarheel.com/" rel="nofollow">The Daily Tar Heel</a><br>
      <a href="http://www.digmo.com/" rel="nofollow">The Missourian</a></p>
      <p>The Daily Pennsylvanian is a quality college publication — journalistically and design wise. In my opinion anyway.</p>
      <p>Those are just a few things to try... but seriously, those <a href="http://www.collegefrontpage.com" rel="nofollow">CollegeFrontpage.com</a> and <a href="http://www.newspagedesigner.com" rel="nofollow">NewsPageDesigner.com</a> websites are very helpful.</p>
      <p>Also, most college newspapers are a part of <a href="http://cpsite.collegepublisher.com/index.html" rel="nofollow">The College Publisher Network</a>, so that might be a place to network as well.</p>
      <p>A lot of college newspaper designers are very vocal and very helpful.</p>
