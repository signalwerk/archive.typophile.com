    <p>Hello everybody! My name is Taylor Buley -- I'm an undergraduate at the University of Pennsylvania and editor of the Pennsylvania Independent. I've got a pretty cool project that I'm currently working on and wanted to get you guys in on.</p>
    <p>A little while back, due to copyright restrictions on our masthead we were forced to change our banner. We went for the more modern look you can see at <a href="http://www.pennindy.com" rel="nofollow">the top of our website</a> and in the PDF issue. We tried to compliment the modernity by raising the photos and giving them drop shadows.</p>
    <p>We want to continue the modernization process by choosing and establishing a new font for the header, the byline and the text of the paper.</p>
    <p>Our only competition is the <a href="http://www.dailypennsylvanian" rel="nofollow">school sponsored rag</a> -- whose been recieving school funding since 1879 and hasn't updated their style since. We already have better journalism, so I want to compliment our work with a fantastic canvas to print on.</p>
    <p>So I'm turning it over to you guys. Are there fonts you think would work well? We have little to no budget, so freeware is preferred; but cheap files can be considered. There's so much that needs work that I'm sure you all will have some good suggestions. Thanks!</p>
    <p><a href="http://www.pennindy.com/PennIndy.v1e2.pdf" rel="nofollow">LINK TO OUR LATEST ISSUE</a> [.PDF]</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/biglogo.jpg"></div><p></p>
