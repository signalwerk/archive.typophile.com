    html: |-
      <p><em>- can quark automatically fix ligature combinations?</em> – only fi and fl in Preferences&gt;Print Layout&gt;Character is an option button<br>
      <em>- can it replace true quotation marks with curly quotes?</em> –&nbsp;yes in Preferences&gt;Application&gt;Interactive is an option button for smart quotes</p>
      <p>You can alternatively use find/change for these, also use it if you are receiving copy with double word spacing, replace space-hyphen-space with space-endash-space or emdash with no space, double hard returns, there is a thread.<br>
      <a href="http://www.typophile.com/node/12883" title="http://www.typophile.com/node/12883">http://www.typophile.com/node/12883</a></p>
      <p><em>- what is a good leading height?</em> – really depends on the font, size and measure<br>
      <em>- does quark do kerning?</em> – yes<br>
      <em>- what could I do better with the column width? Go to 5 column?</em> – only if the measure and the font will support this<br>
      <em>- type size: with a college audience, is 12 pt. too big?</em> – some students are going to be visually impaired so you should cater for them but here again it depends on the font choice<br>
      <em>- tracking.. what is this?</em> – wheras kerning is inter letter spacing, tracking is spacing a whole line or word<br>
      <em>- H&amp;J setting.. what is this?</em> – this is a preference in Quark under the edit drop down menu that allows you to specify the limits of tracking that is applied and the number of hyphens allowed per paragraph there are threads about the optimum settings on Typophile this is only one of them<br>
      <a href="http://www.typophile.com/node/3989" title="http://www.typophile.com/node/3989">http://www.typophile.com/node/3989</a></p>
      <p>Hope this helps with some of your questions<br>
      Tim</p>
