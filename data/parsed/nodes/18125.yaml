      <p>Alright, I've done my research. Some things I've learned that we'll be using in issue three:</p>
      <p>- the value of small capitals, and lower-case numbers<br>
      - justified text optimizes space and brings with it a more formal feel<br>
      - serif text fonts are dramatically easier to read<br>
      - headlines set in all caps are significantly harder to read than mixed case<br>
      - a single, consistantly used graphic as a bullet can make it sexy<br>
      - always hang paragraphs with bullets<br>
      - no more than two typefaces on the page<br>
      - one font pt. is exactly 1/72"<br>
      - w/justified columns, never allow letter spacing to vary; eliminate gaps and rivers<br>
      - never underline text; apparently it's a style leftover from typewriters that didn't have italics<br>
      - generally, a line should have 55-60 characters, or 9 to 10 words for optimal readibility</p>
      <p>Questions I still have:</p>
      <p>- can quark automatically fix ligature combinations?<br>
      - can it replace true quotation marks with curly quotes?<br>
      - what is a good leading height?<br>
      - does quark do kearning?<br>
      - what could I do better with the column width? Go to 5 column?<br>
      - type size: with a college audience, is 12 pt. too big?<br>
      - tracking.. what is this?<br>
      - H&amp;J setting.. what is this?</p>
