    <p>Hello, I am a graphic design student, and I am working on a project using the theme of an antique map of the stars. I am a little stuck on the typeface. Here is a map I am using for reference. I love these typefaces, but I'm not sure what they are. If anyone has any suggestions, that would be wonderful! Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/starmap_5195.jpg"></div><p></p>
