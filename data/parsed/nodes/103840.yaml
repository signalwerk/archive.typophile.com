    html: |-
      <p>I suspect someone's butchered this as a logo, but given any repeated character has precisely the same form, that led me to conclude it was an actual font 'out there' somewhere.</p>
      <p>Sadly I've had to manually create a set of vector shapes to recreate the logo. I could not find the font on all the usual free font sites, admittedly it could fall under any number or categories - it's such (poor) font.</p>
      <p>Each to their own I suppose, but it's not my cup of tea either!</p>
