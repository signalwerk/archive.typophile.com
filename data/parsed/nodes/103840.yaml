    html: |-
      <p>Easy to make but clumsy in appearance -- IMHO these letters are a product of too much DIY font making. Start with a nice Didone  and infest it with ball terminals, ball swashes and balls on crossbars--we see H, I suspect A was also hit.  For some reason the "designer" missed the beak on C and the crossbar on E. Perhaps it is available as a "free" font, and could be located by searching the ornamented categories. If nothing turns up, the lettering could be called "Ballpox." Perhaps I am too harsh, I can see it as a descriptive title for a story about a closet -- all those balls resemble hooks for hanging clothes.<br>
      Don</p>
