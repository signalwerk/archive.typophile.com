      <p>abattis: <em>@Jens Kutilek: Why bother? As Sii points out, I worked on this typeface before the TrueType hinting patents expired, and since those patents restricted the use of free rendering software, I wouldn't consider doing any. Now that the patents have expired, on 9th October 2009, I could consider it.</em></p>
      <p>AFAIK, the patents were on the bytecode interpreter for TT hints. I.e., on the rendering, not the hinting side of the process.</p>
      <p>It's fine by me if you choose ideology over usability, but then perhaps you should put a badge on the fonts »Not for use on evil proprietary systems«. When the fonts are used on a website via Fontsquirrel or Kernest, the majority of visitors <em>will</em> probably see them on Windows, that means, nearly illegible without hinting.</p>
      <p>I guess the lesson to learn from the example of the three fonts mentioned, Titillium, Paneuropa and Cantarell, is that you need to look very closely into what you get for free.</p>
      <p>--</p>
      <p>What about Paneuropa and the OFL, who is liable for an infringement of other people's IP by a typeface design that couldn't have been legally implemented into an OFL-licensed font? The user, the webfont service, or the original author who applied the OFL to a protected design?</p>
