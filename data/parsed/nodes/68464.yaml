      <p><em>The problem is, outside of FontSpring, I know of no other online vendor who has adopted the practice of providing in-browser specimens so you can get an idea of what you're buying.</em></p>
      <p>I doubt the usefulness of a real webfont preview. If a customer looks at it with an uncritical browser (for example he looks at an unhinted font which looks fine on Mac OS X), that may lead to wrong impressions &amp; decisions. Or the customer would have to be knowledgeable enough about the whole rendering issue to look at the specimens using various browsers, even different operating systems and font smoothing settings.</p>
      <p>For the rendering issue, I like Typekit's screenshot preview function, though it has its flaws in its current implementation (it doesn't mention different user settings for example).</p>
