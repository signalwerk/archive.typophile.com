      <p>Although my explanation was  over-the-top, and Dave makes a valid point about OSX ignoring (mostly) hints, I think there is value and a certain purity to designing outlines with a view to screen rendering, without ever buying into the hinting game. It’s a game that you can’t ever win as the goalposts continue to move. </p>
      <p>In the spirit of open source anyone can take work like Dave's and modify, tune or hint it for a particular rendering environment proprietary or otherwise. </p>
      <p>Somewhat related. It’s no accident that Verdana and Georgia hold on screen across a range of rendering environments including those that ignore hints.</p>
