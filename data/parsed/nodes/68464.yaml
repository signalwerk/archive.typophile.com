      <p>@chimerical</p>
      <p>The Droid families are excellent fonts designed for the screen. Commissioned by Google, created by Ascender. First rate. There is a serif family and a sans serif family.<br>
      Released under the Apache license - free to redistribute and use with @font-face.</p>
      <p>Available at Font Squirrel I believe, and at Kernest, too, as a downloadable package.</p>
      <p>For IE users, I would recommend creating natively compressed EOT files using <a href="http://eotfast.com" rel="nofollow">EOTFAST</a>. (The video demo uses Droid)<br>
      For the very small but growing number of Firefox 3.6 users, converting to a natively compressed WOFF file using Font Squirrel's generator is another good option.</p>
