    html: |-
      <p>@jens</p>
      <p>&gt;is that you need to look very closely into what you get for free.</p>
      <p>Fact is, you need to look closely at the stuff you're paying for, too. The problem is, outside of FontSpring, I know of no other online vendor who has adopted the practice of providing in-browser specimens so you can get an idea of what you're buying.<br>
      The techniques for obfuscating and sub-setting so as to not, "give away" the font on preview are now well known.<br>
      Showing the buyer what they're getting for their money is salesmanship 101. If the vendor doesn't show you how the font actually looks in the browser, you should go elsewhere or rely on free downloadable fonts that you can view - and even improve - until you're satisfied.</p>
    html_clean: |-
      <p>@jens</p>
      <p>&gt;is that you need to look very closely into what you get for free.</p>
      <p>Fact is, you need to look closely at the stuff you're paying for, too. The problem is, outside of FontSpring, I know of no other online vendor who has adopted the practice of providing in-browser specimens so you can get an idea of what you're buying.<br>
      The techniques for obfuscating and sub-setting so as to not, "give away" the font on preview are now well known.<br>
      Showing the buyer what they're getting for their money is salesmanship 101. If the vendor doesn't show you how the font actually looks in the browser, you should go elsewhere or rely on free downloadable fonts that you can view - and even improve - until you're satisfied.</p>
