      <p>I always thought the "T" should be worth more than 1. </p>
      <p>&gt;Quartz ignores TrueType hints and uses an autohinter too,</p>
      <p>AFAIK:<br>
      Quartz uses the hints in the glyph table for aliased rendering of fonts <strong>below</strong> the user-selected threshold for smoothing, just like it says in the appearance control panel. There is nothing proprietary, Quartz's use of TT is based on the open TT standard, where there are no patents in force and if Quartz does any auto-hinting for this aliased rendering, it is not evident.  <strong>Above </strong>the user-selected threshold for smoothing, Quartz uses no hints, does no auto-hinting, and there are no patents. </p>
      <p>So far, the only exceptions I have found to this are that fonts named Lucida Grande, Monaco or Courier define their own thresholds regardless of the user-selected threshold for smoothing.</p>
      <p>AFAIK:<br>
      It'll take longer to describe what the Windows platforms do, but the 4 desktop Microsoft renderers (None, Standard, CT and CT2) are not "...evil or conceptually broken..." for Windows. That's just impossible, because so many people use them effectively. </p>
      <p>You have to dig deeper if you are going to understand what happens when Windows users become @fontface users. I tried  <em> just to query </em> for the user's rendering setting for Windows, (which would have made possible better @fontfacing for Windows users), but I was told: "You cannot change the user settings!", you hear now!?</p>
      <p>Cheers!</p>
