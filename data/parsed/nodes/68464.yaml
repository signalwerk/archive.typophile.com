      <p>@Garrick: Thanks :-)</p>
      <p>@Sii: Quartz ignores TrueType hints and uses an autohinter too, just like FreeType does, although since it is proprietary software it is Evil. Its just the Microsoft renderers that are both evil and conceptually broken. :-)</p>
      <p>@Jens Kutilek: Why bother? As Sii points out, I worked on this typeface before the TrueType hinting patents expired, and since those patents restricted the use of free rendering software, I wouldn't consider doing any. Now that the patents have expired, on <a href="http://www.osnews.com/story/18166/Interview-with-David-Turner-of-Freetype)" rel="nofollow">9th October 2009</a>, I could consider it. </p>
      <p>But since all free software systems, especially the mobile ones I'm interested in (Android, Palm Pre, Meego, GNU/Linux) use FreeType's autohinter, as do all Apple kit, it seems a bit of a waste of time to me.</p>
