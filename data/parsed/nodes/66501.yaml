    <p>Hello,</p>
    <p>Hoe that all the expert here will help me: I have to put on the side of a microlight plane the identification mrkings (usually done with pre-spaced self adhesive), but I can't find the font I like.</p>
    <p>Looks like (apart the military one, called "Amarillo") that two kind are the most used. One can be seen on this <a href="http://www.cessna.com/MungoBlobs/889/41/mm_1280_162_ext-01.jpg " title="Click to visit an external URL." class="freelink freelink-external freelink-external"> &lt;strong&gt; &lt;ul&gt;Cessna 162 &lt;/ul&gt;&lt;/strong&gt;</a> </p>
    <p>The other is in the sample included. </p>
    <p>By the way, it should be available both with the right and left slanted characters.</p>
    <p>I've tried in a great number of font sites, but with no luck.</p>
    <p>Is it there some kind soul which can help me?</p>
    <p>Many thanks in advance for any help.</p>
    <p>Best regards, Max</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Aircraft_Font_0.gif" width="811" height="197" alt="">
