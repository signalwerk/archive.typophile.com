    html: |-
      <p>I think you can make the slant in either direction using your graphics software. I think you will be unlikely to find a font that matches the style and has the slants too.</p>
      <p>The closest font I found so far was Nick Curtis's <a href="http://new.myfonts.com/fonts/nicksfonts/route-66-nf/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Route 66</a>. Other fonts had bigger problems with the '1', or the 6 or 9 not being closed the same way.</p>
      <p>- Mike Yanega</p>
