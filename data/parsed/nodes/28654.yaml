      <p>Sebastian,</p>
      <p>Consider what different lessons you can learn from developing sketches, digitizing outlines, spacing, adjusting and refining a keyword without any references. The model of Quadraat, or Palatino, or any existing design can be instructive, but only by telling you how one person did one design. In doing all the work yourself, you don't refer to their decisions, you make your own, and while it's not as easy, it's much likelier to teach you meaningful things about proportion, spacing, serifs, etc. </p>
      <p>Another design can be very inspirational and instructive without being used as a crutch.</p>
