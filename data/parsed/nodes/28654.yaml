    <p>Hi,</p>
    <p>As Thomas Phinney mentioned somewhere else on this forum, a lot of typefaces look very similar (~95% similarity).</p>
    <p>I am working on a design in which I take inspiration from a couple of existing fonts. After doing a "What the font" search on myfonts.com (with my design), it comes up with the inspirational font listed as nr. 1...</p>
    <p>Do I need to start worrying on originality / distinctiveness? Did I take too much inspiration, or is the search engine looking for gross indicators (x-height, as/descenders, sidebearing etc.)?</p>
    <p>I know you all take originality very serious, so I wonder what opinions are out there.</p>
    <p>Sebastian</p>
