      <p>"I didn’t have any particular intentions other than learning"</p>
      <p>The best way to learn is to jump in and do battle with it, make the struggle your own and see what you learn from it.  What I mean is, start with a clean slate and design a set of glyphs from scratch.  You will, by seeing your frustrating errors, figure out what all the many variables are and make a leap from there. If you have a typeface inside of you, let it out.  Giving birth to a typeface involves a justation period and labor pains, yes, but don't fear it.</p>
      <p>ChrisL</p>
