      <p>I am not sure if you are talking about a revival or not.  If not, I think it is a case of "in your heart, you will know" kind of thing. If you are trying to make a "me too" font, you know when you have gotten too close.  It may be better to just start drawing type without looking for inspiration from type that is already out there. Something must have prompted you to get into designing type to begin with.  I can't imagine it was purposely copying something already done. You probably have a personal vision of what a typeface could be from your perspective. As Goudy once said, "just draw a line around that vision."</p>
      <p>ChrisL</p>
