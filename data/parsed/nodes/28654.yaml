      <p>Whenever this subject comes up, I always think of art students who set up their easel in a museum and paint a copy of some great master's work. (Not like they let you do that in museums any more!) I think it's one of the best ways to learn.</p>
      <p>With type, I see nothing wrong with trying to create some version of Times Roman for yourself, with some changes that you think make it better for you. Such work, though, should remain forever in your desk drawer. In any case, it's probably not the kind of thing you want to try to profit from.</p>
      <p>It strikes me as pretty common for a designer to find that something he is making turns out to look a lot like something else. If one designs a typeface and finds out later that it resembles something else, then it comes down to just how similar it is, and the designer's intentions. If the similarity was unintentional, then I think there is a lot of leeway -- and that's where we depend on everyone being ethical and considerate. After all, there are <em>a lot</em> of typefaces out there which are similar to others. A lot of applied design, from automobiles to architecture, has always had the same problem. When one designs something that really works well, one will find that others will model their own work on it. I think designers need to have thicker skins about it -- and I certainly think every designer has to do their part by not being evil.</p>
