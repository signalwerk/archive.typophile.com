      <p>Sebastian, I just wondered, looking at the x and a few other things: was Dolly among your inspirational fonts? You seem to like Dutch type. So do I (and I think we're not the only ones).</p>
      <p>Choz has a point about the potential of lowercase g. Because it's the letter with the most complex history, which has made it most different from its uppercase counterpart, and, in its present state, because it has practically no part in common with any other letter. John Baskerville and Fred Goudy made the best of this - and Pierre Didot jumped to amusing conclusions about how g really ought to be (see JFPorchez' late-Didot revivals).</p>
