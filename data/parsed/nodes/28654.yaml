      <p>Pixion -</p>
      <p>I don't like movements. Ultimately they are counter productive. This font was designed in 2000, so in a way you are peers.</p>
      <p>It's much easier for me to frame creativity with music since that is my passion. When Motley Crue made it, suddenly there were thousands of hair bands. The same was true when Nirvana broke through, thousands of "alternative" rock bands. Alternative to what? Now there's thousands of "punk" bands. Punker than what?</p>
      <p>I think it's good to be grounded in the history of your craft/art (whatever you want to call it) and leave it at that. I don't have to hear what's going on now to create music, as a matter of fact it's a hindrance, it leads to repetitive ideas. For me that's the downfall of movements.</p>
      <p>At a certain point in a career it's time to stop being a fan and start playing. That happened to me in my mid 20s. I am not a fan of music, except playing it. And when I do listen, it's certainly not to anything remotely resembling what I am trying to do.</p>
      <p>I'm a LAlien. We tend to isolate.</p>
      <p>Best of Luck!</p>
      <p>peace</p>
