      <p>[Since I don't know to which typeface you are referring, this is about the notion of 'inspiration' in general, not about particular typefaces.]</p>
      <p>What do you mean by 'inspiration'? Whenever you look too close at a some typeface when working on your own, this may result in something more than just 'inspired-by'.&nbsp;&nbsp;:)</p>
      <p>Personally, I am not fond of typefaces that want to look as if they were made by Underware or OurType (the way they deal with curves, stem ends and serifs) or, a few years ago, by sanserifs that wanted to be another Thesis (either being a bombastic family of the same genre, or imitating the special way of handling shoulder-to-stem connections: italic construction in an upright type, at worst without even <cite>understanding</cite> what is so special about the imitated one).<br>
      In general, there's nothing worse than drawing 'inspiration' from too recent typefaces -- this is plain 'me too' and waste of time.</p>
      <p>On the other hand, it seems only natural that at a particular period of time, very similar typefaces emerge. So after a period of neat and round typefaces in the eighties, designers felt a need for doing rather dark and rough typefaces. It may even happen that around the same time, two or more designers draw inspiration from similar or same historic typefaces. Sometimes some things are in the air.<br>
      And sometimes it can be a funny game to 'compete' with a collegue. Say, both address a special problem by applying a similar solution, and see who will achieve the better result. But this implies that each must follow his/her own design style (mere copying/imitating outlines and tweaking a bit here and there is not allowed), and most of all, it requires a good portion of friendship and open-minded-ness and humor.</p>
      <p>Karsten</p>
