      <p>Worry, but not a lot. If you are making someone else's design over again, it will be glaringly apparent pretty much instantly, so you probably don't have to contemplate it too long.</p>
      <p>Bearing that in mind, if you find it is too similar, think about why, more than the specifics of what. If you still want it feel inspired, borrow more from the other font. If you wont it to be more your own look, make up a bunch of silly or weird vatiants, like doodles. Go on to another task for a bit. Then, borrow some from the best of your own brainstorm.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
      <a href="http://www.exclamachine.com" title="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
