      <p>True, I should have mentioned François Rappo's Pierre Didot revival too. Did he do it before JF Porchez? I seem to remember he did, but haven't checked. (My point was only about the funky g, but those Didots really are extraordinary faces altogether.)<br>
      The next bold move on the g was by Renner of course, with Futura. Both with the deconstructed roman g now to be seen in Architype Renner, and with the plain open-tail g, a marvellous simplification of the cursive handwritten g, which up to then had only been used for italics. So obvious that we hardly notice how new it was then. (Or does someone now of an earlier open g in a sanserif?) And the same goes for his round a. Sorry, I feel I'm drifting away from the point of this thread. But if you want originality, Futura was original for sure!</p>
