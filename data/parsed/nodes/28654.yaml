      <p>I think there the design is too similar to Quadraat. There's noting wrong with that–so long as it's original work–but surely a designer is better off to try create his/her own 'voice'? For example, here's a sample of Halvorsen, my new Opentype family  <a href="http://www.atf.com.au/font.asp?Font_ID=89" title="http://www.atf.com.au/font.asp?Font_ID=89">http://www.atf.com.au/font.asp?Font_ID=89</a>   and I will gladly state here it's been inspired by the Dutch and germans sans families such as Meta and Fedra. But it's not similar, it's come out of my own head. My admiration of other faces definitely colours the design, but so does everything we see in any given day. It's just a matter of being inspired by, rather than trying to emulate.</p>
