      <p>Your face has it differences, in particular the j and the x are very endearing. On the other hand, the e looks different, but not 'better', per se. I think, if I felt it was close enough to first even ask, then I'd look at the most common letters and letter pairs, and ponder how I could mmake them the most distinct components.</p>
      <p>If it was my project, I'd do something with one aspect that was consistently different, like a particular serif location, across all the letters. But, then, I might make the g look really weird for the heck of it, too. Flipping through fonts it amazing how little people play with baby g.</p>
