      <p>This topic has surfaced in a massive number of lists and groups, and, I suspect, will for years to come.  </p>
      <p>The questions you have to ask about what makes what you're doing "different" should include what the "changes" you are making to something that already exists.</p>
      <p>The standard Roman alphabet has the requisite numbers and letters (upper- and lower-case), standardized symbols, the generally accepted alternates (accents, etc.) and whatever other languages you want to do, which leaves a lot of room for move around.</p>
      <p>As most others have pointed out, it's an extremely fine line to walk: in my "spare" time, I create art in a very different medium, and we're always picking nits about what is "original" and what isn't.  And in that field, have considerably fewer basics to build on....  </p>
      <p>Linda</p>
