      <p>Hi John,</p>
      <p>Thanks for the reply. I am actually using FontForge, not FontLab, for opentype programming, since, as we all know, adfdk is not quite there yet.***** I am actually amazed at the depth of FF's opentype support, even for mark classes (which the fea syntax does not support at all, let alone implement).</p>
      <p>"As I understand it, you are trying to produce a situation in which </p>
      <p>base + primary mark + secondary mark</p>
      <p>results in the primary mark being positioned independently of the secondary mark, i.e. with an independent anchor on the base, but capable of being contextually shifted in presence of the secondary mark."</p>
      <p>That's exactly it!</p>
      <p>"[The more difficult situation is if the first mark needs to act as context for the second mark. Actually, I’m not sure at all how one would handle that.]"</p>
      <p>I think that's largely avoidable. If it did come up, we could probably express it as the reverse (relativity).</p>
      <p>"So you might have an initial, non-contextual lookup in which primary marks are positioned on the base using an anchor called e.g. ’primark1’ and a second lookup, with the secondarymarks context, in which the primary marks are positiong on the base using an anchor called e.g. ’primark2’ or some similar mnemonic name.</p>
      <p>Does that make sense?"</p>
      <p>Yes, I believe so. Is this contextual chaining positioning (GPOS lookup 8)?</p>
      <p>In any case, I may need your help to walk me through this, at least the first time around. Does arabtype use this scenario at all?</p>
      <p>I'll play with this some more and report back. If there is any font you can point me to that implements this, I'd like to know. Also, a friend/colleague mentioned that vietnamese (which distinguishes vowel letters and tone marks) could be a candidate for this kind of treatment.</p>
      <p>Best wishes<br>
      Idris</p>
      <p>***** I was very excited by the fea syntax but it is sad that Adobe is taking forever to a) complete and standardize the syntax; b) cover all of opentype (eg no mark classes); c) implement it!</p>
