      <p>Read: <em>I don’t understand why it is a more difficult case when the first mark would act as context for the second. I think you could cover this case with a second contextual positioning rule with the context reversed, and referencing the same MarkToBase rule.</em></p>
      <p>I'll have to experiment, but in a MarkToBase lookup, wouldn't a context string</p>
      <p>mark1 |</p>
      <p>(mark1 preceding context) imply mark1 preceding the base glyph, i.e.</p>
      <p>mark1 BASE mark2</p>
      <p>not</p>
      <p>BASE mark1 mark2</p>
      <p>?</p>
      <p>Actually, I'm not sure such a context would have have effect at all, because if one is defining preceding context for a MarkToBase one seems to need the base glyph to be part of the context, e.g.</p>
      <p>mark1 BASE |</p>
