    <p>Hi all,</p>
    <p>Now there is no GPOS lookup called "contextual mark positioning", but that's an accurate description of the scenario I'm about to describe. Consider the following (using Latin as a model, though the context I'm using this is not Latin):</p>
    <p>Consider a unicode point UniChar decomposed into a base glyph Base1 and a mark PrimaryMark1. So</p>
    <p>UniChar =&gt; Base1 + PrimaryMark1 </p>
    <p>For example, the character atilda can be decomposed into an "a" and a "tilda".</p>
    <p>The feature "ccmp" and a single lookup takes care of this, of course.</p>
    <p>Now I want to add a secondary mark SecondaryMark1 to the base, say, a macron. Note that I am adding SecondaryMark1 to the base glyph, NOT to PrimaryMark1. </p>
    <p>The feature "mark" and a single lookup also takes care of this.</p>
    <p>I apply this to lots of base glyphs and it works fine, but...</p>
    <p>For the particular case of Base1, when I apply SecondaryMark1 to Base1, I need to offset the anchor coordinates of PrimaryMark1 for more aesthetic positioning. I cannot use "mkmk" because the relation between PrimaryMark1 and SecondaryMark1 is not constant from base glyph to base glyph.</p>
    <p>So I need a contextual positioning definition that says, if SecondaryMark1 is applied to Base1, offset PrimaryMark1 by (x1,y1).</p>
    <p>Let's express this scenario in feature-file syntax:</p>
    <p># GSUB</p>
    <p># Base1.comp is the unicode point in the font<br>
    lookup compose_primarymarks {<br>
        lookupflag IgnoreMarks;<br>
    	sub  Base1.comp by Base1 PrimaryMark1;<br>
    } compose_primarymarks;	</p>
    <p>feature ccmp {<br>
          lookup compose_primarymarks;<br>
    } ccmp;	</p>
    <p># GPOS</p>
    <p>lookup primarymarks {<br>
    	mark PrimaryMark1  ;<br>
    	pos  Base1          mark [PrimaryMark1 ];<br>
    } primarymarks;</p>
    <p>lookup secondarymarks {<br>
    	mark SecondaryMark1 ;<br>
    	pos  Base1  mark [SecondaryMark1 ];<br>
    } secondarymarks;</p>
    <p>Now I need a rule such that, if Base1 is marked by a SecondaryMark1, then the anchor coordinates for Base1 in the primarymarks lookup must be offset by (x1,y1).</p>
    <p>Opentype does have a Contextual Chain Positioning lookup but it is very obscure and I'm not sure it is designed or capable of dealing with this kind of situation (which deals with different anchor classes). I've spent many hours on this but cannot find a solution.</p>
    <p>I could add alternate glyphs and use more GSUB lookups but that defeats the entire purpose and will lead to the glyph mess I wanted to avoid in the first place. The point is to be able to control, for a given character or character string, the interrelation of base glyph, primary mark, and secondary mark.</p>
    <p>Put another way: If the string</p>
    <p>Base1 PrimaryMark1 [SecondaryMark2 SecondaryMark3 SecondaryMark4 SecondaryMark5 SecondaryMark6]</p>
    <p>is encountered, the primarymarks and secondarymarks lookups are invoked. But if</p>
    <p>Base1 PrimaryMark1 [SecondaryMark1]</p>
    <p>is encountered, then the anchor coordinates of Base1 in primarymarks are offset by (x1,y1).</p>
    <p>There is a feature-file syntax for contextual chaining positioning, but this aspect of the syntax is a bit obscure for me:</p>
    <p><a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#6.h" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#6.h">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.htm...</a></p>
    <p>NOTE: I am NOT worried at this point about whether or not Uniscribe or some other renderer supports this. I am only concerned about representing the above scenario in valid, opentype form. That is, How do I represent the above scenario in an OpenType font?</p>
    <p>I hope the above is clear. I cannot use mkmk, and I want to avoid a multiplication of glyph alternates.</p>
    <p>Thank you in advance</p>
    <p>Best wishes<br>
    Idris</p>
