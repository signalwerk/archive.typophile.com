      <p>John Hudson's suggestion is very clever. I  have yet to come up with anything that works as well.</p>
      <p>I don't understand why it is a more difficult case when the first mark would act as context for the second. I think you could cover this case with a second contextual positioning rule with the context reversed, and referencing the same MarkToBase rule. </p>
      <p>The one problem is that this approach may be cumbersome when there starts to be significantly more than two mark attachment points on the base glyph. Since (I think) there is no restriction on the sequence in which mark glyphs of different classes appear in the text string, than means that you must provide enough contextual rules to cover all the possible glyph sequences that you need to match.  For example, if the base glyph could have four different marks attached at once, then the  primary and secondary marks in a text sequence need to match a rule when they are separated by anything from  none to two mark glyphs of the other classes, and you would need six contextual rules to cover all the cases in order to treat any single pair of mark classes as a special case for the MarkToBase rule.. In AFDKO syntax, these six context matching rules would look like:<br>
      **********************************<br>
      pos mark1' mark2<br>
      pos mark1' [mark3 mark4]  mark2<br>
      pos mark1'  [mark3 mark4]  [mark3 mark4]  mark2<br>
      pos mark2  mark1'<br>
      pos mark2 [mark3 mark4]  mark1'<br>
      pos mark2  [mark3 mark4]  [mark3 mark4]  mark1'<br>
      # do special case MarkToBase rule when any of the contexts above match.<br>
      # The special case sets a different base attachment point for<br>
      # glyph mark1, whenever glyph "mark2' is also attached to the base glyph.<br>
      **********************************</p>
      <p>However, I can't think of a more concise way to get the desired result.</p>
      <p>FYI, there is supposed to be a new version of the ADKO package coming out in a few months, which will add support for mark and attachment lookups. (See " http://www.adobeforums.com/webx/.3c05d2bd/0" for a preview of feature file syntax changes). </p>
      <p>I'd also like to check that I understand in detail how the example font provided by John Hudson works. Please correct me if I am wrong about the following.</p>
      <p>When I look at the font with the AFDKO program 'spot' , what I see is that the feature "mark" contains two lookups, which will be applied in order.</p>
      <p>The first lookup is a MarkToBase type. There is only one rule in the lookup, and the rule positions both the first and second mark glyphs at the same attachment position on the base glyph, at (x = 400, y = -400)</p>
      <p>The second is a chaining contextual position lookup. There is only one rule in the lookup, and it  will be applied when the glyph sequence is "mark glyph 1", "mark glyph 2", and the current text position is at the "mark glyph 1". The actual positioning rule which gets applied at this position is a MarkToBase rule. This MarkToBase  rule specifies a single attachment point on the base glyph at (x=140, y = -400) for the "mark glyph 1".</p>
      <p>The way this works, as the layout program steps through the text string [base glyph, mark glyph 1, mark glyph 2], is as follows:</p>
      <p>1) text position is at the base glyph, the first glyph in the text string "[base glyph, mark glyph 1, mark glyph 2], ".<br>
      Lookup 0 is processed, but the one rule does not match the current context, as the current glyph is not a mark glyph preceded by a base glyph.<br>
      Lookup 1 is processed, but the one rule does not match the current context. The current glyph is not "mark glyph 1' followed by 'mark glyph 2'.</p>
      <p>2) text position is at "mark glyph 1"<br>
      Lookup 0 is processed. The MarkToBase rule  matches  (because "mark glyph 1" is a mark glyph and is preceded by the base glyph), and so "mark glyph 1" is moved  to the base glyph attachment point at (x = 400, y = -400) relative to the base glyph origin.</p>
      <p>Lookup 1 is processed. The context is satisfied for the one rule in this lookup  ("mark glyph 1" is followed by "mark glyph 2") - and so the associated MarkToBase rule is processed. It also matches - the "mark 1 glyph" is preceded by the base glyph - and is applied. It says to attach the the "mark glyph 1" to the base glyph at (x=140, y = -400). This overrides the result of processing lookup 0.</p>
      <p>3) text position is at "mark glyph 2".<br>
      Lookup 0 is processed. The markToBase rule  matches  ( "mark glyph 2" is a mark glyph, and is preceded by the base glyph, and the only intervening glyph is another mark glyph), and so "mark glyph 2" is moved  to the base glyph attachment point at (x = 400, y = -400) relative to the base glyph origin.</p>
      <p>Lookup 1 is processed, but the one rule does not match the current context. The current glyph is not "mark glyph 1".</p>
      <p>For this to work, the lookup flag for lookup 0 must be set so that the rule processing will ignore all mark glyphs in the text sequence between the current glyph and the base glyph.</p>
      <p>The one thing that I do not understand here is why the MarkToBase rule in Lookup 0 defines "mark glyph 1" and "mark glyph 2' to be two separate mark classes, which happen to attach at the same location on the base glyph. It would take slightly less space, and would be conceptually simpler, to define a single mark class which contains both of them. I understand that the glyph lists of mark classes cannot overlap within a MarkToBase subtable, nor within the mark class definitions that are referenced by any lookup flag field,  but the mark classes defined in one subtable are completely independent of mark classes defined in other subtables, which in turn are independent of the set of mark class definitions referenced by any lookup flag.</p>
