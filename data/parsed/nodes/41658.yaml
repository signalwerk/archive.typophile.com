      <p>2) text position is at "mark glyph 1"<br>
      Lookup 0 is processed. The MarkToBase rule  matches  (because "mark glyph 1" is a mark glyph and is preceded by the base glyph), and so "mark glyph 1" is moved  to the base glyph attachment point at (x = 400, y = -400) relative to the base glyph origin.</p>
      <p>Lookup 1 is processed. The context is satisfied for the one rule in this lookup  ("mark glyph 1" is followed by "mark glyph 2") - and so the associated MarkToBase rule is processed. It also matches - the "mark 1 glyph" is preceded by the base glyph - and is applied. It says to attach the the "mark glyph 1" to the base glyph at (x=140, y = -400). This overrides the result of processing lookup 0.</p>
      <p>3) text position is at "mark glyph 2".<br>
      Lookup 0 is processed. The markToBase rule  matches  ( "mark glyph 2" is a mark glyph, and is preceded by the base glyph, and the only intervening glyph is another mark glyph), and so "mark glyph 2" is moved  to the base glyph attachment point at (x = 400, y = -400) relative to the base glyph origin.</p>
      <p>Lookup 1 is processed, but the one rule does not match the current context. The current glyph is not "mark glyph 1".</p>
      <p>For this to work, the lookup flag for lookup 0 must be set so that the rule processing will ignore all mark glyphs in the text sequence between the current glyph and the base glyph.</p>
      <p>The one thing that I do not understand here is why the MarkToBase rule in Lookup 0 defines "mark glyph 1" and "mark glyph 2' to be two separate mark classes, which happen to attach at the same location on the base glyph. It would take slightly less space, and would be conceptually simpler, to define a single mark class which contains both of them. I understand that the glyph lists of mark classes cannot overlap within a MarkToBase subtable, nor within the mark class definitions that are referenced by any lookup flag field,  but the mark classes defined in one subtable are completely independent of mark classes defined in other subtables, which in turn are independent of the set of mark class definitions referenced by any lookup flag.</p>
