    html: |-
      <p>Hi Read,</p>
      <p>I want to spend some time with your comment and analysis and perhaps say more. In the meantime, here is John's method in fea syntax:</p>
      <p>================================================<br>
      lookup markMarkPositioninginLatinlooku {<br>
        lookupflag 0;<br>
          mark \mark1 ;<br>
          pos \BASE  mark [\mark1 ];<br>
          mark \mark2 ;<br>
          pos \BASE  mark [\mark2 ];<br>
      } markMarkPositioninginLatinlooku;</p>
      <p>lookup Marktobaseattachmentlookup2 {<br>
        lookupflag 0;<br>
          mark \mark1 ;<br>
          pos \BASE  mark [\mark1 ];<br>
      } Marktobaseattachmentlookup2;</p>
      <p>lookup pos_chain_marklatn_0 {<br>
        lookupflag 0;<br>
          sub [\mark1 ]'  [\mark2 ] ;<br>
      } pos_chain_marklatn_0;</p>
      <p>feature \mark {</p>
      <p>  script latn;<br>
           language dflt ;<br>
            lookup markMarkPositioninginLatinlooku;<br>
            lookup pos_chain_marklatn_0;<br>
      } \mark;<br>
      ================================================</p>
      <p>I find the use of the &lt;'&gt; to be rather alienating. Most of the feature-file syntax is rather easy to read and write except this part. It's very error-prone.</p>
      <p>My own idea was to do a huge part of the opentype programming in fea syntax, then compile it in FontForge or, eventually, Fontlab. For some tasks (like choosing ancho-coordinates) a gui is much more useful, but for other tasks the fea file helps me see the overall structure clearly (and to do certain kinds of repetitive editing tasks). But the syntax for contextual chaining is a bit obscure, and the examples in the spec are rather unclear. </p>
      <p>Could you, by way of example, explain the pos_chain_marklatn_0 lookup in english so I can understand better exactly what's going on? Is there another way to write this? Could there be a better way to syntactically express this?</p>
      <p>Could we replace (or have the option of replacing) the &lt;'&gt; by something more verbose? perhaps even a begin-end syntax?</p>
      <p>In any case I do look forward to the next iteration of the fea-file syntax language.</p>
      <p>Best wishes<br>
      Idris</p>
