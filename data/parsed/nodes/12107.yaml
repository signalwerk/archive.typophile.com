    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12011" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Education</a>&nbsp;: HfG&nbsp;Offenbach</strong></p>
    <p>Hochschule für Gestaltung Offenbach am&nbsp;Main.</p>
    <p>In Offenbach am Main, Germany. Right near Frankfurt. A state-run art university that teaches fine art, advertising, product design, set design, graphic design, and a bit of typography, amoung some other things. Between 600 and 700 students total. The professor for typography is <a href="/node/12182" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Friedrich Friedl</a>.</p>
    <p><a href="/node/13483" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klaus Hesse</a> has been the professor for conceptional design since 199. His work (including his professional work at <a href="/node/13484" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hesse Design</a>) is very&nbsp;typographic.</p>
    <p>Type design has not been part of the curriculum officially since 1979. Many type designers have taught at the school, however. For instance, from 1947–1979, <a href="/node/13485" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Karlgeorg Hoefer</a> taught calligraphy and type design&nbsp;there.</p>
    <p>The school’s website is <a href="http://www.hfg-offenbach.de">http://www.hfg-offenbach.de</a></p>
    <p>In 2004, several students came together to form a type design collective, <a href="/node/12176" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypeOff</a> as several attempts to reintroduce it officially back into the curriculum were thwarted. <a href="http://www.typeoff.de">http://www.typeoff.de</a></p>
