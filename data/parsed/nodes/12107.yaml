    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Education" class="freelinking" rel="nofollow">Education</a> : HfG Offenbach</strong></p>
    <p>Hochschule für Gestaltung Offenbach am Main.</p>
    <p>In Offenbach am Main, Germany. Right near Frankfurt. A state-run art university that teaches fine art, advertising, product design, set design, graphic design, and a bit of typography, amoung some other things. Between 600 and 700 students total. The professor for typography is <a href="/wiki/Friedrich%20Friedl" class="freelinking" rel="nofollow">Friedrich Friedl</a>.</p>
    <p><a href="/wiki/Klaus%20Hesse" class="freelinking" rel="nofollow">Klaus Hesse</a> has been the professor for conceptional design since 199. His work (including his professional work at <a href="/wiki/Hesse%20Design" class="freelinking" rel="nofollow">Hesse Design</a>) is very typographic.</p>
    <p>Type design has not been part of the curriculum officially since 1979. Many type designers have taught at the school, however. For instance, from 1947–1979, <a href="/wiki/Karlgeorg%20Hoefer" class="freelinking" rel="nofollow">Karlgeorg Hoefer</a> taught calligraphy and type design there.</p>
    <p>The school's website is <a href="http://www.hfg-offenbach.de" rel="nofollow">http://www.hfg-offenbach.de</a></p>
    <p>In 2004, several students came together to form a type design collective, <a href="/wiki/TypeOff" class="freelinking" rel="nofollow">TypeOff</a> as several attempts to reintroduce it officially back into the curriculum were thwarted. <a href="http://www.typeoff.de" rel="nofollow">http://www.typeoff.de</a></p>
