    html: |-
      <p>Helvetica stands out for being very clean and tidy without being severe. A somewhat rare and likeable combination.<br>
      Very regular spacing, the characters tend to end in a neat horizontal line instead of emphasising the shapes, curves flow neatly into straights.</p>
      <p>However, I find Helvetica a surprisingly poor text face - much worse than most that look almost identical at first glance. The same regularity coupled with a large x-height makes it tiring to read because there is little to guide the eye.<br>
      Akzidenz Grotesk fares much, much better.</p>
      <p>Stressed capitals:<br>
      I found these helpful if the author uses long sentences in a language without gratuitous capitalisation: names and starts of sentences are things that the reader may want to find quickly.<br>
      They break the flow and become seriously annoying if there is too much capitalisation though; German set in typefaces with shouty capitals is a pet peeve.</p>
