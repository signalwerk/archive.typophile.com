      <p>Ok, swallowing my pride here with what is hopefully the last update: <strong>FontBook will be ready to ship in August 2006.</strong> May angry Typophiles strike me repeatedly with a pica pole if I am wrong again, but this time I have the existence of <em>actual press proofs</em> to back up my estimate.</p>
