      <p>I might get off topic there, but we have a chain of shops in France called "Nature et decouvertes", some kind of new age-discovery channel stuff, and in there you can actually buy ambiance perfumes with names such as "breakfast under the tree in autumn" or "a visit to grandma's countryhouse"... I'm regularly buying the one called "nature after the rain" and it is quite amazing: it really does reminds a whole lot of things, from hours walking in some normandy fields right after a shower. Odour is an extremely powerful memories safekeeper.</p>
