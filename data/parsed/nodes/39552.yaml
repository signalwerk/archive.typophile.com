    html: <p>Expensive Printing Smell. This is a spray on product manufactured in Japan and, under license, in Germany, by the same people who invented New Car Smell. The US imposes heavy tariffs on products whose only purpose is to produce an odour, which is why a lot of European perfumes are also not available in the USA or are very expensive. I believe this is due to the Hollywood lobby, which wants Americans only to purchase perfumes 'designed' by American celebrities. Unfortunately, Expensive Printing Smell got caught in the same classification. American used car dealers use a knock off of New Car Smell, but no one in the USA has succeeded in replicating the scent of the highly secret ingredients in Expensive Printing Smell, although some vegetable based inks have been found to have powerful if often unpleasant odours.</p>
