  html: <p>What gives expensive, well-printed book that incredible luscious smell? You know what I mean—that soft odor of luxury and petroleum that comes out of every single book printed in Belgium, most of the books from France, Italy, and Japan, and not a damned thing printed in the USA. Is it the inks, the paper, the glue, or just some tangible residue of the dedication of insanely dedicated pressmen?</p>
