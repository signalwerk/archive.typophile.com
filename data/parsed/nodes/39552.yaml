      <p>Paper quality is also quite important. Cheap paper stinks. But in most cases publishers are not willing to charge 5-10% more for a book that is printed on good (or at least decent) quality paper. </p>
      <p>Klaus Wagenbach, a publisher who has founded the Wagenbach Verlag in Germany, was famous for tasting the paper before printing his books on it. Wagenbach books are arguably the nicest books produced in Germany - and yes, these books are a bit more expensive than the average books, but it’s a pleasure to read them.</p>
