    <p>Reasons for this project:</p>
    <p>[k/K letter is this shape क/क]</p>
    <p>I would not liकe to purchase my meditation chanting beads from a compromised Hare कrishna  temple who are under a coup and usurper regime here in England since November 14th 1977.  The meditation chanting beads process basically is  to chant  the prayer for deliverance in this Age or the Hare कrishna Maha-mantra at least minimum of 16 rounds, each round composed of 108  meditation chanting beads on a daily basis:  </p>
    <p>Hare कrishna Hare कrishna<br>
    कrishna कrishna<br>
    Hare Hare<br>
    Hare Rama Hare Rama<br>
    Rama Rama<br>
    Hare Hare </p>
    <p>Also there are scenarios where showing my meditation chanting beads and/or audibly chanting so someone is able to hear would not be possible and thus meditation chanting sans the beads would have to be done ‘informally.’  Although ticकing with a pen on paper to कeep tracक of the meditation chanting sans the beads, for example, 1 to 50 numbered areas on Boards A to E on ‘Euro lottery’ printed slips   issued by the lottery company, Camelot (Britain) albeit not using<br>
    for playing the lottery i.e not  for gambling purposes,  is a tool-solution in certain circumstances, see:</p>
    <p>HTML for Websites<br>
    <a href="http://tinypic.com?ref=2jcdeu8" target="_blank" rel="nofollow"><img src="http://i42.tinypic.com/2jcdeu8.jpg" border="0" alt="Image and video hosting by TinyPic"></a></p>
    <p>IMG Code for Forums &amp; Message Boards<br>
    [IMG]http://i42.tinypic.com/2jcdeu8.jpg[/IMG]</p>
    <p>URL for E-Mail &amp; IM<br>
    <a href="http://tinypic.com/r/2jcdeu8/5" title="http://tinypic.com/r/2jcdeu8/5">http://tinypic.com/r/2jcdeu8/5</a></p>
    <p>Direct Linक for Layouts<br>
    <a href="http://i42.tinypic.com/2jcdeu8.jpg" title="http://i42.tinypic.com/2jcdeu8.jpg">http://i42.tinypic.com/2jcdeu8.jpg</a></p>
    <p>-- I also have a preference for a customised solution for other scenarios, for example, ‘formal’ meditation chanting beads scenario (at least minimum of 16 rounds, each round composed of 108  meditation chanting beads on a daily basis)  therefore this RFQ:  Request For Quotation -  Graphic Design project.</p>
    <p>Project itself:</p>
    <p>1.  On a piece of paper 109 circles from large to small connected together as if on a chain and bound together at each end, thus 109 circles in a circle.  </p>
    <p>2.  The 1st circle and the 108th circle are faintly labelled 1 to 108 on the outside of the circle and really are from large to small.  They are faintly labelled 1 to 108 from each end, so they are 2 numbers for each circle, for example, 1st circle is labelled 1/108 and the 108th circle is labelled 108/1.  Probably having the 1st number labelled faintly on outside at the top end of each circle and the 2nd number faintly labelled at the lower end also outside the actual circle is the solution.  The reason for 2 numbers labelled for each circle is because the meditation chanting beads process is to reverse at each end rather than jump-over the 109th circle.  </p>
    <p>3.  From 1st to 108th circle, each circle is to be divided with 4 vertical lines and 4 horizontal lines or is 4x4 with 16 identifiable intersections on each circle, due to meditation chanting beads process, that could be marकed by me whilst chanting providing a reference location and also would be useful if I am interrupted away from the meditation.</p>
    <p>4.  The project should fit a sheet of ordinary computer printed paper, for example, in Britain the standard computer printer paper size is A4.  Thus due to size limitations the 109 circle in a circle might require an inner or outer loop.  The final output should be on a PDF file.  </p>
    <p>5.  The 109th circle should not be intersected or labelled, simply shaded with more of a cooकing pot shape rather than a circle shape with some bushy hairy top / as if the cooकing pot is boiling and overflowing.</p>
