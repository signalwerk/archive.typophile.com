      And it's nicely not Latinized. Although the Arabic 7-Up logo whips it bad.</p>
      <p>BTW, pull-tabs are a man's tabs. They provide for a unique and... handy test of one's manual dexterity and power that the pansy swivel/push-tab does not: try opening a pull-tab can with one hand without resting the can on anything. And what to do with the tab? A man's man removes it completely and dumps it in through the hole, before starting to drink the beverage of course. And don't forget, all with one motion, with the can in the air the whole time. Shoo abadaï.</p>
      <p>hhp</p>
