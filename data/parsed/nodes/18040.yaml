      <p>&gt; ‘The obvious is better than the obvious avoidance of the obvious.’<br>
      Maybe true, but nothing should have to be so obvious.</p>
      <p>To me this logo is particularly bad because of it's lack of subtlety. To paraphrase pica_pusher, it hits you over the head with a number of things:<br>
      1. That the Coke company is not Coke the drink (look how different we are!)<br>
      2. That the Coke company is still strongly tied to Coke the drink (see! we're keeping the script!)<br>
      3. That the Coke company makes many many different types of drinks (can we have about 400 droplets? No? How about five?)</p>
      <p>&gt; But I don’t think the idea of multi-colored drops is so bad, just the execution with the logo.<br>
      I think it's a lame idea made worse by insensitive execution.</p>
      <p>I don't know why but I can hear the client asking for all sorts of things when I look at the logo.</p>
