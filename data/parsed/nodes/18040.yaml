    <p>Ha! Got you didn't I?</p>
    <p>Coke now has a droplet logo for <a href="http://www2.coca-cola.com/makeeverydropcount/index.html" target="blank" rel="nofollow">The Coca Cola Company</a>, along with the tagline, "Make every drop count." This is apparently in a move to differentiate Coke, the soft-drink, from Coke the company which "now provides nearly 400 products in over 200 countries."</p>
    <p>I first read it at <a href="http://www.beadesigngroup.com/blog/archives/2006/02/the_new_coke_identity.html#more" target="blank" rel="nofollow">Be A Design Group</a>.</p>
    <p>Well, it's almost as bad as the New Coke. Seems like most people (currently 3) don't like it. </p>
    <p>I always say, <a href="http://typophile.com/node/252" rel="nofollow"> be careful what you ask for</a>.</p>
