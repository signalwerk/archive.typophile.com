      <p>&gt;clip-art design of the worst kind</p>
      <p>Ok the more I look at it the worse it looks with the script. But a lot of the problem is the script itself with both the logo with two baselines--which looks great on its own--but then the 'The' and 'Company' aligning with only 'Cola' making the thing unbalanced. And then the sans at the bottom plus the logo. It is just over over-done and busy.</p>
      <p>But it other contexts I don't see the drops as bad. 'The obvious is better than the obvious avoidance of the obvious.' Of course it is much better if it looks fresh but natural and logical and simple. But I don't think the idea of multi-colored drops is so bad, just the execution with the logo.</p>
