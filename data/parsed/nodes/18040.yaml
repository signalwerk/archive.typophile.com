      <p>"This is truly clip-art design of the worst kind".</p>
      <p>I definitely agree. Even without understanding the strategic reasons for this rebrand/campaign/whatever it is, the message 'in everything we do, we give up drops of ourselves' is trite at best, and downright unappetizing at worst. There's something vaguely unappealing about linking a soft drink with the bodily fluids of wonderfully diverse ethnic groups enjoying themselves on a beach.</p>
      <p>The solid drops - quite apart from being badly drawn and composed - do nothing to suggest refreshment and the thirst quenching properties that you come to expect from fizzy pop. I don't think I'll be able to buy a Coke now without wondering exactly how much blood, sweat and tears (and worse) has gone into it.</p>
