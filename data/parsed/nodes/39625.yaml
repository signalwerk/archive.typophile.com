    <p>First post here...</p>
    <p>I have a client and we're looking to use the Hoefler Titling Light Swash, but the budget doesn't allow to buy the whole package, and unfortunately HFJ doesn't sell the individual faces.  So we're sadly left trying to find a Typeface that will be able to fit the following:<br>
    A) Sold individually, not as package<br>
    b) Have some of the same characteristics as Hoefler Titling Light Swash, particularly the uppercase "E" and "K"</p>
    <p>Thanks and help is greatly appreciated.<br>
    Daniel<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/hoeflerTitling_6739.jpg"></div><p></p>
