  html: |-
    <p>I'm putting together an interactive timeline of British music in the 1960's for a University project and I would like to find 10 different display fonts to use in the title for each year. I was thinking of typefaces like Cooper Black, Pump Triline (though that may be more 1970's) and Decorated (451?)</p>
    <p>Any suggestions are welcome!</p>
    <p>Jim</p>
