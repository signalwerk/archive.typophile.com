    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Paul-Jones-Privilege-EP-74117_3862.jpg"></div><p></p>
      <p>Louis Minott's Davida (1965).<br>
      Neo-Victorian, capturing the exuberant "display" that saw mods adopting Regency, and hippies Victorian military styles, eg in Sgt. Pepper, and recolouring them.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/401-1-im-Cover-8268_5763.JPG"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/The_Rolling_Stones-1964-The_Rolling_Stones-EP-_3918.jpg"></div><br>
      Everyone used Compacta, or some such thing.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/592001_4533.jpeg"></div><br>
      1965: Pop art. The stencil effect could be Futura Black. Fun to break up the colouring.<br>
      By the same token, bouncing was big at the start of the decade.<p></p>
