    <p>Just released 5 weight font, Motown at YouWorkForThem.</p>
    <p><a class="freelinking external" href="http://www.youworkforthem.com/product.php?sku=T0315" rel="nofollow">Motown</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/T0315_00_4169.jpg"></div><p></p>
    <p><em>Motown is a geometric slab serif with 5 weights. Although it was intended to be used as a display face, Motown's heavier weights can be used effectively for text as well. The angled crossbars and vertically symmetrical slabs give Motown a unique flair for a font of its class. The implied energy in these features also help give the font an athletic, youthful vibe. And it can also look quite classic when set appropriately for headlines, titles, and identities. Motown is available in Open Type format.</em></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/T0315_01_5906.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0315_04_5843.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0315_05_3782.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0315_07_5372.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/T0315_10_4357.jpg"></div><p></p>
