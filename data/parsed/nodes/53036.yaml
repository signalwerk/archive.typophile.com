    <p>My apologies in advance if this is a repost, but House Industries just announced a new website via their <em>Show and Tell</em> blog (<a href="http://www.houseind.com/showandtell/" title="http://www.houseind.com/showandtell/">http://www.houseind.com/showandtell/</a>):</p>
    <p><cite>In the spirit of our initial contempt of the world wide waste of time as a delivery medium, we have tried to keep our reliance on third-party plug-ins and other digital trickery to a minimum for this new design. The site is more searchable, easier to use and actually generates simple readable urls.</cite></p>
    <p>I agree. Check it out at <a href="http://www.houseind.com/" title="http://www.houseind.com/">http://www.houseind.com/</a></p>
    <p>Ken</p>
