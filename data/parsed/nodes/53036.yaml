      <p>Folks,</p>
      <p>Thanks for noticing and posting up about the new site design. Also thank you for the kind words. I would like to make a clarification and a comment.</p>
      <p>SuperUltraFabulous, we did not have any price increases. We did, however make the following changes to our multiple device licensing structure:</p>
      <p>1. Increased number of devices covered under the base licensing fee to ten from six.</p>
      <p>2. Got rid of the "Locations" restriction on the license. So, the "devices" just need to be owned by the same company or "entity". We wanted to make it easier for smaller companies and individual designers to properly license our font while making the fees more proportional for bigger companies and organizations.</p>
      <p>To your other point, we agree that we need to show complete character sets. We are working on that now. In the mean time, we are using a newer version of Lettersetter that can preview any glyph in the character set. Thanks to Erik van Blokland and Tal Leming, Lettersetter can also read and preview any OpenType feature in the our fonts.</p>
      <p>Thanks again for your comments and happy new year!</p>
      <p>Regards,</p>
      <p>Rich Roat</p>
