    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Eduardo Manso</strong></p>
    <p>Eduardo Manso was born in <a href="/wiki/Argentina" class="freelinking" rel="nofollow">Argentina</a> in 1972. He studied Graphic Design in the "School of Visual Arts Martín Malharro" from Mar del Plata and made a Postgraduate of "Visual Communication Design" at la Universidad Nacional de Mar del Plata. He was Art Director and Co-publisher of the Argentinan graphic design magazine "<a href="/wiki/el%20Huevo" class="freelinking" rel="nofollow">el Huevo</a>" (the Egg). He has designed and published diverse types through <a href="/wiki/T-26" class="freelinking" rel="nofollow">T-26</a>, <a href="/wiki/ITC" class="freelinking" rel="nofollow">ITC</a>, <a href="/wiki/Bitstream" class="freelinking" rel="nofollow">Bitstream</a> and <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>. Manso's Bohemia typeface, among other distinctions, gained 1st Prize in the text category of Linotype's "International Type Design Contest 2003". He has obtained the certificate to the "Excellence in Type" granted by the Type Directors Club of New York in 2004 for <a href="/wiki/Bohemia" class="freelinking" rel="nofollow">Bohemia</a> (Argot), in 2006 for <a href="/wiki/Relato%20Sans" class="freelinking" rel="nofollow">Relato Sans</a> and in 2007 for <a href="/wiki/Lorena%20Serif" class="freelinking" rel="nofollow">Lorena Serif</a>. Currently, Eduardo combines his graphic design work with classes in typography at diferents schools of Barcelona and the design of new typefaces.</p>
