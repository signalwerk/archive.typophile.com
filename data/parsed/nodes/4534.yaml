    html: <p>Thanks Yves. <br> <br>Its indeed custom designed with some of the flavours mentioned above. <br>An acquaintance at <a href="http://www.bubble.be">bubble</a> told me it was designed by <a href="http://www.landor.com/index.cfm?fuseaction=cNews.news&amp;storyid=272&amp;g=1200&amp;n=1220&amp;year=2002">Landor</a>, from there I found <a href="http://users.ncrvnet.nl/mstol/belgacom.htm">this</a> excellent site on corporate identity by Hans Stol. <br> <br>I also found <a href="http://www.lineto.com/">Typ1451</a> from lineto as a 'stronger' alternative. <br> <br>Thanks all of you for the feedback, <br>G</p>
