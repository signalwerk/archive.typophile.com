    <p>This is my first attempt at a serif pixelfont. I didn't have anything in mind when I was making it (just wanted to make it as neutral as possible), but I think it turned out to resemble Century Schoolbook somehow. I haven't done any kerning as of yet, but I'm quite happy with the result so far. Tell me what you think of it.<br>
    BTW: I'm still not working with grayscale pixelfonts, so it's still not as crisp as it could be ;-)</p>
