    date: 2008-11-06T11:00:00
    votes: null
    html: |-
      <p>I added a few pangrams. Mind you, I haven't done my kerning yet which is definitely necessary for the italics.<br>
      The 2 hasn't changed since the very beginning, I was quite pleased with it myself ;-)<br>
      Your comments make a lot of sense although I like the eszet as it is.<br>
      The N would probably look 'cleaner' without that corner pixel &amp; I hadn't thought of giving the y a bottom serif, but it might improve if I do.<br>
      The æ is where I got caught up in my own rules (simply a + e pushed together) rather than 'flexible' aesthetics ;-)<br>
      I had to look up what a pilcrow is… Still learning.</p>
  - id: 310503
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 6 Nov 2008 — 11:30am
    date: 2008-11-06T11:30:00
    votes: null
    html: |-
      <p>Thanks for putting up some text. I think it's coming together very well, and the swashes are wonderful; used judiciously they could really mark some new ground.</p>
      <p>I think you're OK with the double serifs on the "u" after all, but I'm starting to feel more strongly about your ascenders being too short. I'd love to find out what others think, but personally I can almost hear the font wheezing from being put in a straight-jacket! Giving the ascenders one more pixel would really help. I promise.  :-)</p>
      <p>Some other things:<br>
      - It just hit me that your Bold is three pixels heavy. Did you make one that was two pixels but didn't like it?<br>
      - Your smaller size is generic enough not to warrant making... except for the swashes! So pay extra attention to them at that size.</p>
      <p>hhp</p>
  - id: 310513
    user_id: 13099
    user_name: ill sans
    user_path: null
    date_raw: 6 Nov 2008 — 11:51am
    date: 2008-11-06T11:51:00
    votes: null
    html: |-
      <p>I admit I got a little sloppy at the end; I just used the same swashes for the mini-version as I did for the regular which obviously makes the balance shift.<br>
      The 3-pixel bold was a deliberate choice since I wanted to make a bigger contrast than I could do with only 2 pixels. It looks more like a black version now &amp; I might rename it later if I decide to include a 2-pixel bold as well. For the mini-version I did however reduced it to 2 pixels 'cause the dimensions of the characters would have to be to stretched too much to fit in the 3 pixel strokes.<br>
      For the lc u I'll probably try to find another font that has doublesided serifs on the u to find comfort in. I actually like the way it looks &amp; think it fits well with the other characters, but if it's just 'not done' I'll probably be too insecure to leave 'em the way they are. Any other thoughts and opinions on this would be appreciated.<br>
      I'll do a 3-pixel ascender version of the regular in the next few days (have to do some other stuff I shifted forward to finish this first) &amp; post it here for comparison.</p>
