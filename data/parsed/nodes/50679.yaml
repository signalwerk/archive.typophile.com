      <p>I added the final additions to the Minimade family.<br>
      As mentioned before, I made some more swashes &amp; divided them into two fonts for practical reasons. I also added a bold, italic &amp; swash version to the Minimade Mini family. I redid the italic version 'cause I wasn't completely satisfied with it. I'm quite happy with the end result now, but I might still make some minor changes in the future (such as the lc u perhaps).<br>
      Thanks all for your lovely comments, they really kept me motivated throughout the process.</p>
  - id: 310478
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 6 Nov 2008 — 9:03am
    date: 2008-11-06T09:03:00
    votes: null
    html: |-
      <p>Nice.<br>
      Could you whip up some text, in both the sizes?</p>
      <p>Just looking at the 11 point Roman for now:<br>
      - Was the "2" always so cute? I like it.<br>
      - I would remove the inside pixel from the bottom-right of the "N".<br>
      - The "y" might benefit from a leftward serif at the bottom.<br>
      - Because your "a" is binocular I don't think you need that ungainly pixel at the bottom of the "ae".<br>
      - The eszet might look better with a smaller top bowl.<br>
      - I would connect the two parts of the pilcrow with a pixel at the top.</p>
      <p>BTW, I'm pretty sure there's a limit to how much you can overshoot the em space (re: swashes) before you hit rendering problems in some OS/app environments.</p>
      <p>hhp</p>
  - id: 310494
    user_id: 13099
    user_name: ill sans
    user_path: null
