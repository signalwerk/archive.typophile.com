    html: |-
      <p>I didn't even notice the fact that the y's were flipped, but I did do several versions before settling down with this, so unconsciously the aesthetic part must have played a role in my decision.<br>
      As for the lc u, that was probably due to not paying a lot of attention ;-) It seems a bit odd now, but I'm not really sure it actually bothers me… I'll have to make a comparison first &amp; let it rest a while before I decide (when you work on something for too long, you can't see the forest for the trees anymore). I'm still working on more swash variations &amp; after that I'll take a break from Minimade for a couple of days.<br>
      The length of the ascenders however wás a deliberate choice. Along with the x-height &amp; descenders, it was the only thing I had already determined when I started this. I didn't want it to end up looking too jagged, so I used the same measurements everywhere which I like to think it adds a little personality (or maybe amateurism? ;-p) to the font.<br>
      If anything, I think the descenders could benifit from an extra pixel, but again, I wanted to keep it simple.</p>
