      <p>This is quite nice, with a lot of cool touches.<br>
      And those swashes rule!</p>
      <p>A couple of quick things:<br>
      - The head serifs on the "u" should probably be leftward only.<br>
      - I would increase the ascenders by one pixel: it would help readability a good deal (and give you room to raise the bar of the "f", and make the dots on "i" and "j" two pixels tall).</p>
      <p>hhp</p>
