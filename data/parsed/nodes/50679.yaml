      <p>&gt; Let’s hope this moves into full consciousness on the part of certain people</p>
      <p>Are you referring to anyone in particular?</p>
      <p>&gt; The simply reason is that in real text ascenders are much much more frequent.</p>
      <p>You see, that's why Typophile is very usefull for people like me who have no educational background in typography. When designing I don't even think about these things, but from now on it's something I'll keep in mind.</p>
      <p>Since I started fooling around in Fontographer a couple of years ago, I already see some progress in my work.<br>
      Pixelfonts are actually great for learning about typedesign; they don't leave you with too much room for choice (or in other words, they eliminate a large part of  doubt) which I find quite stimulating, it justifies a mathematical approach (which again simplifies things) &amp; its simplicity &amp; sheer size can camouflage (or compensate for) a lack of know-how.<br>
      Thanks to the comments here, I'm also learning a lot about the relationships between characters &amp; the actual use of a font.</p>
  - id: 308640
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 28 Oct 2008 — 8:45am
    date: 2008-10-28T08:45:00
    votes: null
    html: |-
      <p>&gt; Are you referring to anyone in particular?</p>
      <p>Well, in this thread Underware in particular, but in general I'm talking about designers who believe that their favorite world order is more important than the results. It's a justification of creation over function, which is Art and not Design.</p>
      <p>&gt; Pixelfonts are actually great for learning about typedesign</p>
      <p>I agree (although many designers do loathe them). Besides the paradoxically refreshing limiting of choice, there is a purity to bitmap font design; something that makes you think in a certain healthy way that vector-editing tends to obscure. Maybe it's because the illusion is fully broken, so you can see -or at least feel- the heart of the matter.</p>
      <p>hhp</p>
  - id: 308662
    user_id: 13099
    user_name: ill sans
    user_path: null
    date_raw: 28 Oct 2008 — 9:59am
    date: 2008-10-28T09:59:00
    votes: null
    html: |-
      <p>I can imagine some typedesigners loathe pixelfonts, but in terms of designing is apples &amp; oranges. It may be easier (especially to start with), but it takes a completely different state of mind.<br>
      I love vectors for their flexibility &amp; 'weightlessness', but it's something very different. Pixels are not just about stripping down an image to its core, it's much more than that. The illusion is indeed broken, but you create an entirely new one with the right use of pixels (e.g. creating rounded shapes by pixelplacement). It has a lot to do with 'feeling' where all the pixels should (or should nót) go -much as bezierpoints in vectorial design- &amp; it requires more thinking outside the box than vectors. Even though it may seem very technical, only by breaking the rules can you achieve a perfect bitmap.<br>
      For someone who's used to working with vectors, it demands a lot of flexibility on the designer's part.<br>
      At least, that's my experience…</p>
