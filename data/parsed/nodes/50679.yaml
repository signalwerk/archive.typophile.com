      <p>&gt; unconsciously the aesthetic part must have played a role in my decision.</p>
      <p>Yup.<br>
      Let's hope this moves into full consciousness on the part of certain people.</p>
      <p>&gt; If anything, I think the descenders could benifit from an extra pixel</p>
      <p>At this low res leaving them equal isn't so bad, but making the descenders <em>longer</em> than the ascenders would be a pretty bad use of the vertical space. The simply reason is that in real text ascenders are much much more frequent.</p>
      <p>hhp</p>
