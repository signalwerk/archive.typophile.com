    html: |-
      <p>"I'm also confused by how somebody can trademark a word they did not invent. Sure, them's the rules, but I can't fathom the logic."</p>
      <p>I'm no expert, but I think trademarks have to do with protecting brand recognition. If a company or product takes on a name that is striking similar to another, also similar, entity, confusion could arise as to what's what and who's who.</p>
      <p>For example, even though the car company did not invent the word Jaguar, they have the trademark because the name, logo, et cetera are widely recognized and strongly identify them. However, it was perfectly fine for Apple to call its OS "Jaguar" years ago, since "Mac OSX Jaguar" is sufficiently distinct, and in a very different market, therefore preventing any appreciable amount of confusion.</p>
      <p>Copyrights, on the other hand, are a different story altogether...</p>
      <p>That's my layman's understand of it anyway.</p>
      <p>@DeptH<br>
      I really like it. Although, I do find the p to be distracting. The bowl feels odd to me, even though I can see it is constructed identically to the a, b, q, etc bowls.</p>
