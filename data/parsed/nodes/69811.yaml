      <p>I had a look at removing the right-angles from the a,b,p,&amp; q but the whole look of the font is the clash between such geometric details and humanist forms. This aspect also determines the look of the lowercase r, l and the 1. There's also an optional n form that is without curves and many of the characters have curves that become corners: U,u, P, R, B, A etc. Thanks for the suggestions though. I have now redrawn the italic numerals:</p><div class="imageWrap"><img src="http://typophile.com/files/DPTHitalicNumerals_4017.gif"></div><br>
