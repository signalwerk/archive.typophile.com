      <p>I can easily live with the sharpness of the /a/, /b/, etc. But the /d/ still bothers me. I think the problem is that its axis of symmetry <strong>unusually</strong> goes NW-SE. The same is true for the /p/, but for whatever reason I'm more comfortable with this one.</p>
      <p>I must confess I don't like the /l/ (lc L) either. I'd try a bottom like the one of the /t/, or settle on a standard rectengular shape.</p>
      <p>Also, the /o/ is composed of two perfect circles, isn't it? It doesn't look so good. You should make the BCP handles a tiny bit longer. And then do the same with all the other quarter circles.</p>
