    html: |-
      <p>A classic slab-serif like Cairo or Memphis or Stymie certainly is suitable for extended text in a pinch.</p>
      <p>Obviously, you don't want to use Comic Sans; not only isn't it a serif typeface, but it's badly overused.</p>
      <p>Is it possible you might be able to get away with Century Expanded or Goudy Old Style... or Corona, or Ionic No. 5? Textype, based on Century Expanded, and available from Bitstream as Century 731, doesn't seem too authoritarian in appearance.</p>
