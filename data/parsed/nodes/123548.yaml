      <p>I think some of these non-slab serif faces could work -- they're playful (quirky even), contemporary and at the same time are perfectly suited for long bodies of text:</p>
      <p>Dolly (<a class="freelinking external" href="http://www.underware.nl/fonts/dolly/" rel="nofollow">http://www.underware.nl/fonts/dolly/</a>)<br>
      Feijoa (<a class="freelinking external" href="http://www.vllg.com/klim/feijoa" rel="nofollow">http://www.vllg.com/klim/feijoa</a>)<br>
      Yoga (<a class="freelinking external" href="http://www.fontfont.com/fonts/yoga" rel="nofollow">http://www.fontfont.com/fonts/yoga</a>)</p>
      <p>I'm also partial to last year's Franziska (<a class="freelinking external" href="http://www.fontfont.com/fonts/franziska" rel="nofollow">http://www.fontfont.com/fonts/franziska</a>)... It's just a tad more slab-ish, but it shares so much of the versatile but playful characteristics of the others I didn't want to leave it out.</p>
