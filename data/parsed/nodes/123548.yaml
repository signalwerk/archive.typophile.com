    html: <p>There's a lot about what they want it to NOT be, but you don't have a direction until you know what they DO want it to be. From the context, my chips are on "fun", in which case you are probably going to have to go well outside the realm of what are conventionally considered text faces before you have something unsubtle enough to be approved. Start with humanist slabs, and if you're very lucky, you won't be picking among casual comic hands in the end.</p>
