    <p>Astype releases new stencil fonts: Vtg Stencil Germany No.1</p>
    <p><a class="freelinking external" href="http://www.astype.de/font_v_vtg_stencil_germany_no1.php?fontname=vtgstencilgermanyno1 " rel="nofollow"> astype site</a> | <a href="/wiki/www.astype.de/s/specimen/VtgStencilGermanyNo1.PDF%20" class="freelinking" rel="nofollow"> specimen pdf</a> | <a class="freelinking external" href="http://www.myfonts.com/fonts/astype/vtg-stencil-germany-no1/ " rel="nofollow"> myfonts site</a></p>
    <p>The Vtg Stencil series of fonts from astype are based on real world stencils. The Germany No.1 design was derived from authentic antique German stencil-plates.</p>
    <p>Surprisingly these stencil-plates offer a high contrast Didot design very similar to the French stencils produced and sold till today. The production time of these stencils is in the range of the German imperial period (1871–1918). Of course the usage period was even longer.</p>
    <p>The font styles »Paint« and »Sketch« include 4 additional variations of base glyphs and figures. An extensive random function will mix the glyphs as you type - on proper OpenType-savvy apps like Adobe InDesign.</p>
    <p>All styles offering an extended Latin character set.</p>
