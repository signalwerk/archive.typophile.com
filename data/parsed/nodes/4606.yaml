      <p>Briem is my hero. I will never make another diagram. (not) <br>These optical illusions are one of the critical areas of type design, and a tough aspect to teach. You need good eyes for it.  <br> <br>It's tempting to say: <br>Aha! Helvetica is 7.34% more blah blah. My font will be 7.34%. <br>Here are two beginning excercises. You may find printing is needed because your monitor will lie to you: <br> <br></p>
