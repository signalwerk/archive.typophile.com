  html: <p>Hi, <br> <br>Could anyone please share any advice with diagonal lines? They seem to thin out compared to the other lines, despite using the same width as the vertical lines. Is there a quantifiable approximation as to determining the optical thinning of the line? <br> <br>Mahalo!</p>
