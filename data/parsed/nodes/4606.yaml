      <p></p></center><p></p>
      <!--/attachment--><!--/attachment--><p> <br> <br><i>Could anyone please share any advice with diagonal lines? They seem to thin out compared to the other lines, despite using the same width as the vertical lines.</i> <br>When you slant them, yes they get thinner. When you rotate them, they actually get thicker. The above pdf shows the difference. The top excercise shows slanting, the bottom is rotational thickening. <br> <br>Have fun! <br>Randy</p>
