  html: |-
    <p>So I see that a FL font object has a "classes" attribute that's a list of the classes in the font.</p>
    <p>1) Is there a way to filter this list to only see kerning classes?</p>
    <p>2) When I try to copy kerning classes via script, e.g. —&nbsp;</p>
    <p>fl.font2.classes = fl.font1.classes</p>
    <p>This will copy the class members properly, but it loses the state of the left glyph / right glyph checkboxes in the class panel. Where does that data live?</p>
