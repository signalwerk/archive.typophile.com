    html: <p>You can also save a copy of your classes as a text file from the "Classes" menu.  In the upper left corner of the window is a tiny icon which when clicked reveals the option to "Save classes".  You can  either import this file completely as a replacement classes file, append some parts of it, or copy paste from a text editor the things you want.</p>
