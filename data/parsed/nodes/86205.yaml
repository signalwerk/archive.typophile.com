    html: |-
      <p>The FontLab Font object offers the folowing methods to access class attributes:</p>
      <dl>
      <dt><strong>SetClassFlags</strong>(int class_index, bool left, bool right)</dt>
      <dd>allows to set 'left' and 'right' properties of the kerning class</dd>
      <dt><strong>SetClassFlags</strong>(int class_index, bool lsb, bool rsb, bool width)</dt>
      <dd>allows to set 'lsb', 'rsb' and 'width' properties of the metrics class</dd>
      <dt><strong>GetClassLeft</strong>(int class_index)</dt>
      <dd>returns the 'left' property of the class</dd>
      <dt><strong>GetClassRight</strong>(int class_index)</dt>
      <dd>returns the 'right' property of the class</dd>
      <dt><strong>GetClassMetricsFlags</strong>(int class_index)</dt>
      <dd>returns the tuple containing LSB, RSB and Width flags of the metrics class</dd>
      </dl>
