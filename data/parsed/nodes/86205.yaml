    html: |-
      <p>Filter for kerning classes by matching the first character of each class with an underscore:</p>
      <pre>classes = fl.font.classes
      for c in range( len(classes) ):
        class_text = classes[c]
        if class_text[0] == "_":
          print class_text
      </pre>
