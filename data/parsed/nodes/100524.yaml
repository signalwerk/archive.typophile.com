    html: <p>You switch to kerning mode to reveal the text preview box. Either type in your new text, or click on the Options button to change or add options for the preview box, or to point it to an external text file that contains your text strings. Then you can select your appropriate base string and drag glyphs from the Font window and drop them into the Metrics window where you want them to appear.</p>
