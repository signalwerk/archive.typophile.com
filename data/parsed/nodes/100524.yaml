    html: |-
      <p>From the manual:</p>
      <blockquote><p>You can customize the context by editing the Metrics.txt file located in the Application user data/Data folder.</p></blockquote>
      <p>Although it doesn't go into any detail on the syntax used in the file, or how to add new contexts for different languages. From what I can tell, the actual strings are composed using glyph names preceded by a slash, with the @ character representing the selected glyph, and \n (<em>backslash</em> n) for a newline.</p>
