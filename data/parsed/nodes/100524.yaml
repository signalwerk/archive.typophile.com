      <p>Switch? What for??</p>
      <p>I think I wasn't understood... in my screen capture the ampersands stand between 4 different text strings:</p>
      <p>HOH*HOH<br>
      HHH*HHH<br>
      OOO*ooo<br>
      XHX*xox</p>
      <p>In the FL metrics window, whenever you select a glyph from the Kerning or Metrics Table, it will appear between those 4 text strings in the position where the * is.</p>
      <p>My question is, how can I edit those text strings, even add a few ones? For example one line with cyrillic characters?</p>
