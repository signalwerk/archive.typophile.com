    <p><img src="http://pics.livejournal.com/m_zhukov/pic/000592rc" width="320" height="295"></p>
    <p>The submission of entries to TDC² 2012 is now officially open. To enter your type designs to the competition go to <em><a href="http://www.tdc.org/enter" rel="nofollow">www.tdc.org/enter</a></em>, choose ‘<strong>ENTER</strong>’ in the middle column (‘<strong>TYPEFACE DESIGN</strong>’), and fill out the on-line forms.</p>
