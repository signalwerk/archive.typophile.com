    <p>I'm trying to recognise an embedded font on the Yell.com website. The font is rendered using Cufon, I have checked through the code and there is no reference to the name of the font.</p>
    <p>They have recently reduced the font weight so the type on the website looks lighter than in the image I provided.</p>
    <p>Any help would be hugely appreciated.</p>
