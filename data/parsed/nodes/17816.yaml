      <p>If you take ’ty’ and ’Ar’ as they are currently, as your base to work from you do need to increase the spaces between the other characters ’Ci’ needs only a slight increase, while ’it’ needs more than that, ’rt’ needs slightly more than ’it’. I must admit that I find the difference in t’s intrusive, have you tried removing the righthand arm of the first t?<br>
      Your ’r’ is looking much better, while you are polishing, you could look at the top serifs of the ’iy &amp; r’ they seem too small and the where the vertical meets the curve of the inside of the ’t’s is too abrupt a transition.<br>
      Tim</p>
