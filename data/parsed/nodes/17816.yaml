      <p>The brush strokes do appear to be an afterthought. The shapes themselves don’t match the type. The type is unyielding and sharp. The strokes flow and curve. What makes them worse is that you have mounted them to the top of the “A” for no reason. You may be able to make them work by arranging them in a different manner, but I don’t think they work where they are.</p>
      <p>I like the type, but I agree with James on the serif on the left of the stem of the “r” (from the 13th of feb.) looks better removed. That way you can place it closer to the “A”.</p>
