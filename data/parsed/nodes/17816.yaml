      <p><em>Since the type design is a light display weight it probably wasn’t designed to be used at small sizes.</em> </p>
      <p>Good point. That was what I thought anyway :)</p>
      <p><em>As for being more fun, there are times when that is good but I would prefer not to be surprised too much when dealing with a corporate identity.</em></p>
      <p>Yes. Different people see these things differently. I think we’re very lucky to be part of a design community that tolerates differing points of view. As I have noted on other threads recently, I seem to enjoy being surprized a bit more than most.</p>
      <p>Anyway, one solution for reproducing this logo at smaller sizes is to make a version with reinforced details for use at small sizes only.</p>
      <p><em>As for the spacing, I intend to keep the letters together and crashing the t into y was intended and I would not like to give it up.</em></p>
      <p>It forms a ligature, and you could take that as an opportunity to introduce an additional detail, on the cusp of the left stroke of y, as a finishing touch—-artistic flair;</p>
      <p></p><div class="imageWrap"><img src="/files/444.jpg"></div><p></p>
      <p>I raised the arm of “r” a tiny bit to give it some overshoot, to make it optically aligned with the x-line.</p>
      <p>One other small detail I changed earlier: compare my first drawing to the second and third under “suggested spacing schemes”. Reduced the thickness of the “A” bar to bring it closer to the “t” bars. This is to add elegance rather than modularizing.</p>
      <p><em>Generally I try to maket things either very different or exactly the same, so the small difference between the two t’s is somewhat bothering me.</em></p>
      <p>That’s a familiar experience :) Perhaps if you show the designs to a few people with good taste who are not designers to get a non-designer’s prespective, that may help you decide.</p>
      <p><em>good-craft-oriented.</em></p>
      <p>Crafted, hand-crafted etc, is the feel I was trying to evoke with the letter spaced versions. You could suggest craft-oriented another way—-by adding subtle flair details like the one I put on the “t-y” bar/serif above, which is much like the flair Robert Slimbach put on the original Warnock “A”. Thanks for showing the sample Tim.</p>
      <p><em>As a suit, you know: black, but from Armani.</em></p>
      <p>I know exactly what you mean. I paid a small fortune for 3 black Armani suits fives years ago, which I wear every day. The design, cut and workmanship are so beautiful I bought Armani spectacles to compliment.</p>
      <p>Take care,<br>
      j a m e s</p>
