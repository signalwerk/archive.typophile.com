    <p>In the light of recent events I have decided to go on and create my own company which would do quality graphic design. Of course, I need my own ID, so there it is.<br>
    The message I want to get across is that we are very good, very classic design agency, so all our ID materials will be about that. So I have designed my own logo according to that message. I took Warnock as a base for the letterforms. I still have issues with the lc r, which seems to be from whole another planet, but I don’t know how to make the rt look good together.</p>
    <p>Any thoughts appreciated :).</p>
