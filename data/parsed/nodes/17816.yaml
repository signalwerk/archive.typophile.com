      <p>Thank you for your great comments, that gave me a lot to think about.<br>
      As for the spacing, I intend to keep the letters together and crashing the t into y was intended and I would not like to give it up. I would like to keep the differen t’s too, because of the feeling they provide, but I agree it looks awkward. So I made two versions to look at. Generally I try to maket things either very different or exactly the same, so the small difference between the two t’s is somewhat bothering me.</p>
      <p>I would like to keep the two “flags” on the top of the A. I initially put them just for fun ie - without any justification, but then my partner pointed out that they look just like Latvian flag which has three stripes of similar proportion: wide red-narrower white-wide red, so I decided that it’s a good thing after all and should stay that way.</p>
      <p>I made the top serifs a bit bigger and corrected the spacing. I think it looks a lot better now. The logo won’t be reproduced in very small sizes generally, so I don’t care much about serif loss. I tried to abandon the serifs altogether, but the result turned out to be something faceless and closer to Optima than I would like to.</p>
      <p></p><div class="imageWrap"><img src="/files/CA logo rev31.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="/files/CA logo rev32.jpg"></div><p></p>
      <p>James: classic as not exactly classy, but rather good-craft-oriented. As a suit, you know: black, but from Armani.</p>
