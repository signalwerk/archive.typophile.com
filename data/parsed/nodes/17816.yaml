      <p>Suggested spacing schemes.<br>
      </p><div class="imageWrap"><img src="/files/cityart4.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="/files/cityart5.png"></div><p></p>
      <p>To make the white space between “t-y” closer to the spaces between the other pairs—-without crashing the serif of “y” into the “t” bar—-I shortened the bar. The alternatives are to crash “t” into “y”, or hack off the “y” serif.</p>
      <p>Do both t’s have to be identical? If you value consistency to the exclusion of all else and can’t tolerate the slightest aberration, sure. If they’re not identical does that make it inferior design? Allowing them to be different adds an interesting quirk.</p>
      <p><em>...look at the top serifs of the ‘iy &amp; r’ they seem too small and the where the vertical meets the curve of the inside of the ‘t’s is too abrupt a transition.</em></p>
      <p>Whoa there. Making every detail perfectly consistent could make this logo predictable and boring. Its art, not science. The top serifs being smaller doesn’t neccessarily make them inferior—-just different. Surely the designer of Warnock made them that way on purpose, as an act of artful design. The same rationale can apply to the “t”. The abrupt transition could be an imperfection by design to give the “t” character.</p>
      <p>Appologies if it seems I’m giving you a hard time Tim. I’m only arguing aesthetics. It isn’t meant personally.</p>
      <p>j a m e s</p>
