      <p>^ With the words separated the original r matches the “t” in “art” and my eye no longer compares the “r” to the angular “y”.</p>
      <p></p><div class="imageWrap"><img src="/files/cityart3.png"></div><p></p>
      <p>Restricting the wavy swash to one keeps things neat. Coloring it red makes it like a penant or flag, or a flame.</p>
      <p>L e t t e r &nbsp;s p a c i n g<br>
      Greek classical architecture was founded on the horizontal principal. The Greeks built their temples very wide and exagerrated the horizontal aspect by placing lots of columns along the sides of their buildings. The columns in rows also exaggerated the sense of perspective.</p>
      <p>Hellenistic/Roman classicism. The Romans emphasized the vertical more than the Greeks, but they kept the horizontal theme alive. Lettering on Roman buildings echoed this with long horizontal freizes divided by spaced capitals.</p>
      <p>Renaissance neo-classicism. When Venice became the center of printing in Europe the Italian printers continuted the classical tradition with their letter-spaced Antiqua type. Western typography was more or less founded on this recurring principal dating back to Greek temple architecture.</p>
      <p>Letters are still (more or less) spaced out in book typography. For display typography the trend has been (aince the mid to late 1970’s) to use tight spacing, and for good reason; the extra space loses its original function at display sizes. Visually and design-wise it makes sense, and isn’t really “wrong”.</p>
      <p>There is a reverse trend going now for spaced-out setting in display typography.<br>
      The effect makes more sense if the glyphs are spaced out a fair bit as in renaissance book typography, or very spacey like the classicism of antiquity.</p>
      <p>You could letter space this logo to evoke a classical tone, or keep it tight and rely on the constructed classical letter forms for classical chic. Go for one extreme or the other, depending which flavour of classical you’re after.</p>
      <p><em>very good, very classic design agency</em></p>
      <p>classy?</p>
      <p>j a m e s</p>
