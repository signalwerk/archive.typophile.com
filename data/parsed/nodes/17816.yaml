      <p>Warnock has a lot of qualities, but I don’t think it lends itself to the graceful/classic characteristics you have created in your amended characters, so bravo for starting from there, I think you have many minor modifications to make (and being a personal identity this can turn into a life’s work). </p>
      <p>Regarding your question about the rt, first I would lower the arm of the r (it seems too proud of the x-height) and then slightly reduce the length of the arm to bring the terminal more into the stem (to reduce the space under the arm) and give the terminal an edgier* character, maybe developing it from the dot above the i, then you could experiment with the curve so that the terminal will fit under the lefthand arm of the t (which I think you will need to replace). I would also look at the kerning of the it combination, I think loosening that would make more sense of the rt combination.</p>
      <p>Hope this helps and isn’t discouraging.<br>
      Tim<br>
      *I mean edgy in the sense of having edges.</p>
      <p><em>{edit: Sorry, cross post with James}</em></p>
