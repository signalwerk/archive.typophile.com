    html: |-
      <p>Art Deco, contrasty sans, somewhat condensed:<br>
      <a href="http://www.fontshop.com/fonts/downloads/red_rooster/radiant/" rel="nofollow">Radiant</a>, <a href="http://www.linotype.com/1328/Peignot-family.html" rel="nofollow">Peignot</a>, or my <a href="http://www.myfonts.com/search/eunoia/fonts/" rel="nofollow">Eunoia</a>.<br>
      More pronounced Deco style: <a href="http://www.letterheadfonts.com/fonts/gloria.php" rel="nofollow">Gloria</a>, <a href="http://www.ms-studio.com/FontSales/mostranuova.html" rel="nofollow">Mostra Nuova</a>. </p>
      <p>You could also use <a href="http://www.myfonts.com/fonts/itfmecanorma/bodoni/" rel="nofollow">Bodoni Condensed</a> or some such thing, the idea being that its hairlines relate to the linearity of Carrosserie.</p>
