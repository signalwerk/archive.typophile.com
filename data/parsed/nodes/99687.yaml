    html: <p>Thank you, Nick. They all worked really well for my project, having a hard time choosing now (best problem to have, lol)!</p>
  - id: 539685
    user_id: 2021
    user_name: Nick Shinn
    user_path: null
    user_image: /files/pictures/picture-2021.jpg
    date_raw: 23 Jan 2013 — 9:11am
    date: 2013-01-23T09:11:00
    votes: null
    html: <p>I would go with the Bodoni; ﬁne-tuning the relationship between the weight of the headline’s “hairlines” and the subhead’s linearity will provide a constraint you can design against, an issue that, when resolved, will create harmony in your type hierarchy. Bear in mind that you can adjust the weight of the headline type (especially the thickness of its hairlines) by stroking the type outline in your layout app. You can also introduce line rules into your layout which play against this quality.</p>
