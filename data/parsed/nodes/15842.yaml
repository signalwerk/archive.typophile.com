      <p>As a type designer, I may have a certain idea how a font might be or even should be used. I long ago learned that designers will do whatever they want anyway, often exceeding my expectations, doing things with my fonts that I would not. (I thought Felt Tip Roman should only be used about the size of actual handwriting, that it wouldn't look right at headline sizes. Silly me.)</p>
      <p>The fact is, in graphic design there is a constant demand for novelty. Using typefaces in ways they were not intended is one way to achieve that. Once somebody does it, it gets noticed by other designers who copy the idea. Eventually, the idea becomes so widespread, that the novelty wears off and the cycle starts again with some other idea.</p>
