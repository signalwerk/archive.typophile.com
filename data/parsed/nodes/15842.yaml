      <p>First off, thank you everyone for the responses…but one in particular sparked an interest for further discussion…<br>
      <strong><br>
      RE: Mark Simonson<br>
      The fact is, in graphic design there is a constant demand for novelty. Using typefaces in ways they were not intended is one way to achieve that.</strong></p>
      <p>In response to this, where, as designers and critics, do we draw the line? I feel like from so many sources, whether it be former some of my art directors or the wonderful <a href="http://www.spiekermann.com/iblog/" title="http://www.spiekermann.com/iblog/">http://www.spiekermann.com/iblog/</a>, I've been trained and told to respect and follow rules and guidelines.</p>
      <p>Will people use typefaces without regards to its “rules?” Perhaps. But is that wrong or right? Even if one does create novelty? Isn’t disregarding its previous intention and function incorrect or “disrespectful” to a certain extent?</p>
      <p>Just giving food for thought and discussion…</p>
