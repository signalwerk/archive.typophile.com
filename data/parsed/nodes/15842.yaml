    <p>I came across a previous thread that mentioned the typeface Bell Gothic, and wanted to discuss a couple things with you fine and wonderful people.</p>
    <p>As a young designer, Bell Gothic has intrigued me for its functionality and history, as it was designed primarily for small print and legibility. But I’m starting to see this face more and more in corporate identity systems (the company I am employed at included). I’ve seen it used on anything from the new FBI Anti-Piracy label on CDs, to American Express television advertising and collateral.</p>
    <p>I guess my question and invitation for discussion is, what do YOU as a designer think/feel when you see a typeface being used against its primary creation function? (IE: A face designed for small sizes being used for display type, etc).</p>
    <p>And on a side note, does anyone else think the uppercase “I”, when set in black, looks awkward? What was the motivation on keeping those serifs so thin???(See attached)</p>
