    html: |-
      <p>Thanks Riccardo. I've been playing with your code and finally figured out why the sidebars were not moving to appropriate places — need the !important tag in there.</p>
      <p>Here's what I came up with for my 1680x1050 screen:</p>
      <blockquote><p>
      <code>@namespace url(<a href="http://www.w3.org/1999/xhtml" title="http://www.w3.org/1999/xhtml">http://www.w3.org/1999/xhtml</a>);<br>
      <code>@-moz-document domain("www.typophile.com") {</code></code></p>
      <p><code>html<br>
      <code>	{text-align: center;}<br>
      <code>#wrapper<br>
      <code>	{text-align: left;<br>
      <code>	margin: auto;}</code></code></code></code></code></p>
      <p><code>#sidebar-right<br>
      <code>        {position:absolute;<br>
      <code>        left:1340px!important;}</code></code></code></p>
      <p><code>#sidebar-left<br>
      <code>{position:absolute;<br>
      <code>left:952px !important;}<br>
      </code>
      </code></code></p></blockquote>
      <p>That's my first time doing anything with CSS, (I didn't even know you could have user stylesheets) so this is probably quite poor/untidy. Sidebar-left takes care of the Prolific Posters and Wiki Recent Edits sidebars.</p>
    html_clean: |-
