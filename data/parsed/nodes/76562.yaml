  html: |-
    <p>For those of us with wide or hi-res screens, Typophile's pages appear on the left side of the screen. Ergonomically (and aesthetically) it might be better to have the content appear centrally, rather than having to have the neck or screen turned all the time to one side. Here's what I mean, now and suggested:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile-Centred_3793.gif"></div><p></p>
    <p>Do any other users think that would be nice?</p>
