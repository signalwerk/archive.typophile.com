    html: |-
      <p>That sounds like a clientsfromhell.net quote. ;)</p>
      <p>I’m not trying to sound smart or anything, but this really isn’t that big a job. Obviously, some of the HTML might be generated by the back end system but the main structure probably isn’t. Even so, if Typophile use PHP or ASP, the back end system typically does not generate the HTML —&nbsp;it would rather loop/reuse snippets of code from the HTML files. What the biggest problem usually is with old systems is the mess of conflicting CSS styles that have accumulated over the years.</p>
