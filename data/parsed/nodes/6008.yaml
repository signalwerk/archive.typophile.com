  html: <p>Here are a few I was able to locate, ranked somewhat in order based on recommendations. I haven't actually tried worked with any, yet. <br> <br>Alan Hillesheim <br>Digger Pine Press <br>651-G Addison Street <br>Berkeley 94710 <br>548-2448 <br> <br>Seibert Richard Letterpress <br>510 845 8566 <br> <br>Julie Holcomb Printers <br>510 654 6416 <br> <br>Crafty Cards  <br>(510)849-CARD  <br><a href="http://www.craftycards.net" target="_blank">www.craftycards.net</a>  <br> <br>Mercurio Bros. Printing <br>2830 San Pablo Ave. <br>Berkeley, CA 510 845 2600 fax 510 845 1630 <br> <br></p>
