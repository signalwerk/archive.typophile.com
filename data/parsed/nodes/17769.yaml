      <p>Way to go Elias. This is the kind of contemporary "blackletter" needed to help redeem the German tradition. Very cool.</p>
      <p><em>the a feels funny because the upper stroke is noticeably heavier than the lower diagonal stroke of the bowl</em></p>
      <p>Same with the "a" in Gill Sans. I guess lots of designers complain about that, but we established on the "g's anyone?" thread that the Gill Sans "a" is that font's signature letter and helps makes it iconic. I would keep the upper stroke in this sans as thin as it is, and thin down the bar of "e" to match.</p>
      <p>Besides, it matches the thin stroke on h, m, n, b, q, p, d, u, r.</p>
      <p>Suggestion: you could try making the right-hand strokes of v and w thinner to match. Try it on k. Nothing to lose by trying.</p>
      <p>Elias, I like this font very much and look forward to seeing it in use :)</p>
      <p>j a m e s</p>
