      <p>What a big contribution James! Thanks very much!</p>
      <p>Let me say something about:</p>
      <p><cite>I think that your “pen angle” on top of the b, d, and l is too steep.</cite></p>
      <p><cite>Yes. Even tho this design is synthetic its pen-derived nature should not be neglected. The angled stem ends do not feature realistic nib &amp; ink details but are abstracted with their crisp geometric precision, and suggestive of calligraphic forms. Therefore at least make the angle realistic to make the motif authentic. It may sound contradictory, but abstracted design can have realistic qualities.<br>
      Is all this philosophical design justification neccessary? Not absolutely, but it definitely gives insight into your design and aids in solving various kinds of problems :^)</cite></p>
      <p>Yes Dan and James, I do agree with you. I need to improve my ductus logic. I’m doing, but this kind of modifications needs what we use to say here in Brazil “tempo de gaveta”. Its sounds like take time to the forms get mature. I’m thinking about it. ;-)</p>
      <p><cite>If you break the curve in one or two places along the letter, you won’t loose any rotunda-ness… </cite></p>
      <p><cite>After a quick look, I think that the c, e, and o are too round. Have you tried “breaking” their curves?</cite></p>
      <p><cite>Try it Elias, keep it subtle, flattening only a small amount, and the b-q, d-p pairs to match, to better integrate those letters with the straight-sided h, n, m.</cite></p>
      <p><cite>Another potential reason for flattening the rounds is to instill a stronger blackletter heritage—-if blackletter is the direction you want to go in.</cite></p>
      <p>Perfect Dan and James that is the point! Benedicta is a Sans, with some kind off Blackletter’s reference and not a Blackletter at all. It’s made me timid to do this kind off modification; I’m not going on old styles direction but try to give some classic appeal to the modern forms. But I'll try it once more :-)</p>
      <p><cite>The alternative is to leave the rounded letters rounded—-to contrast with the straight-sided guys. This approach is found in most sans serifs, eg: officina, frutiger, futura. Not many people question the design logic of those fonts or complain they lack integration.</cite></p>
      <p>Yes James! You were very accurate on your speech! It is definitely the point again. I think the Benedicta is what Vox/AtypI classify like a Humanistic Sans, a kind of sans project that redefine classic forms or a classic review eg: Optima, ITC Officina, FF Meta… But instead of an italic renaissance references, I’m looking for a German ones. So, I’m not intending to make a Blackletter typeface but a Humanist Sans with Blackletter’s references. It’s change everything. It’s why my structures do not match in the least with the old German forms.</p>
      <p><cite>The shape contrast is taken for granted, as a defacto standard in roman type design. The advantage of contrasting forms—-rounded versus rectangular—-is maintaining differentiation and readability.</cite></p>
      <p>Right! This first version of Benedicta is for headings and not for long texts, so I prefer to keep the strong forms and contrasts of the Blackletters and balance it with the clarity and legibility of the sans. I thought that it could be interesting! ;-)</p>
      <p><cite>One problem to tackle is deciding on structures for x, y and z. Dan doesn’t like them and its easy to understand why*. In a strict blackletter font, roman x, y, z structures stand out next to all the straight-sided forms. Many blackletters solve this integration problem with cursive forms for v, w and y, with straight sides (or at least one straight side). Traditional blackletter “x” is very abstracted, and not compatible with your font (people simply would not accept it). That leaves s and z as oddballs—-“z” can be made with straight sides, but is a risky solution. Rounded “s” form isn’t a problem in schwabacher and fraktur; textur s’s have square sides.<br>
      These are crucial factors that will help determine whether to keep c, e, o, b, d, p, q rounded, or flatten or even fracture their sides. Decision time…which direction should the whole thing go? Flatten c, e, o, b, d, p, q and it will very likely go the blackletter route. Keep those letters rounded and defacto roman s, v, w, x, y, z forms will integrate much more plausibly; but the whole will still have tangible blackletter characteristics. Which direction you go depends how gothic, or roman you want it to be.</cite></p>
      <p>Right again! This kind of question has exhausted me and takes a lot off my time… But I think that this project is more disposed to be a Sans, so the roman forms of s, v, w, x, y and z sounds more according with my proposes. In fact I’m planning to draw some alternate Caps and lc letters more closely with the old forms. It would be released in alternate version of the Benedicta that could be combined with this actual version for specific uses. As you say: <cite>“Your current “s” is not well integrated, but don’t take that criticism too seriously. Lots of fonts, some quite successful, have an unintegrated “s” problem.”</cite> Some characters will call for fine-tuning adjusts to match with the whole but this way looks more interesting than blackletters way for me now… ;-)</p>
      <p><cite>The most interesting thing about this font so far is the curious blend of gothic and roman elements. Making it decidedly blackletter could make it routine and predictable, and not particularly interesting compared to traditional blackletters.</cite></p>
      <p>As I think James! As I think :^D</p>
      <p>About the <strong>quick rework</strong>, I agree with some points like reduce the angle on stem ends and redefine the end of the “f” arch, but I’m not sure about angling the stem ends. I do prefer variety of details but in this case I think it reduce a bit of strength and make the left sides of the characters looks lower than they really do. Perhaps improve overshoots below the base line… But I’m not sure… I’ll save this comments for later, let me do the adjusts first ;^) All in all, tks for your interest ;-)</p>
      <p><strong>Vertziert Schwabacher</strong>, amazing! Have you already post it here in typophile?</p>
      <p>James, I really appreciate your contribution thanks a lot! </p>
      <p>I'm working on it and will post some news at soon...</p>
      <p>Thanks for all guys, keep the comments! </p>
      <p>e.</p>
