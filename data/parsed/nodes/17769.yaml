      <p>After a quick look, I think that the c, e, and o are too round. Have you tried "breaking" their curves? In your e-mail to me, you said that this was inspired in part by rotundas. If you break the curve in one or two places along the letter, you won't loose any rotunda-ness…</p>
      <p>Also, I would play with the ligatures a bit more. The f in the f-k liagature curves over too low before it meets the stem of the k. This isn't so happy. I can't if your f-h does the same… the image that you posted above isn't big enough for me to see it clearly.</p>
      <p>Also, the join of your c-ligatures should be lower so that the h and the k have more stem and read clearer.</p>
      <p>I think that your "pen angle" on top of the b, d, and l is too steep.</p>
      <p>All in all, this seems like a great start! Keep going with it.</p>
