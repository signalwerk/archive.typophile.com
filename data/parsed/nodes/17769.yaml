      <p>just a couple things that jumped out at me:</p>
      <p>the weight distribution of the strokes is off in places: you might want to spend a bit more time working out your <a href="/wiki/ductal%20logic" class="freelinking" rel="nofollow">ductal logic</a>. for example the a feels funny because the upper stroke is noticeably heavier than the lower diagonal stroke of the bowl. i would think that these should be of a more similar weight.<br>
      secondly, i don't know if you meant to make the 10 o'clock portion of your f curve flat, but i think that's just about right. however, i think this should be applied to other round characters at the same 10 o'clock position. for some inspiration, you might check out <a href="http://www.myfonts.com/fonts/urw/bradley-urw/" rel="nofollow">Bradley</a>. Of course, you want to tame this down a bit, but you might want to capture a bit more of its "essence."</p>
