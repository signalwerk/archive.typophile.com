      <p>I do agree with Paul about the weight being inconsistent, but I think you should go for a more increased contrast between thin and thick strokes; I like the contrast in letters 'h', 'm' and 'n'.</p>
      <p>And, I think this is still too raw, undeveloped. IMO, you should incorporate more blackletter elements to it (like what Paul said about the detail in your 'f'); make it a real mashup. As it is now, it looks likes you just applied some random elements to a generic sans-serif.</p>
      <p>Working on your 'ductus logic' would be a great start. Fixing the stroke contrast will make it easier to evaluate and improve this typeface.</p>
      <p>-- <a href="http://www.omine.net/" rel="nofollow">omine.net</a></p>
