    html: |-
      <p><em>I think that your “pen angle” on top of the b, d, and l is too steep.</em></p>
      <p>Yes. Even tho this design is synthetic its pen-derived nature should not be neglected. The angled stem ends do not feature realistic nib &amp; ink details but are abstracted with their crisp geometric precision, and suggestive of calligraphic forms. Therefore at least make the angle realistic to make the motif authentic. It may sound contradictory, but abstracted design can have realistic qualities. </p>
      <p>Is all this philosophical design justification neccessary? Not absolutely, but it definitely gives insight into your design and aids in solving various kinds of problems :^)</p>
      <p><em>If you break the curve in one or two places along the letter, you won’t loose any rotunda-ness...</em></p>
      <p>True, but that kind of thing tends to be more successful in rotundas drawn with a flat nib and ink where the line contrast is high. I'm not disagreeing with you outright, but think fracturing may be problematic in a low contrast linear font like this one. The best answer is to try it and see how it goes.</p>
      <p><em>After a quick look, I think that the c, e, and o are too round. Have you tried “breaking” their curves?</em></p>
      <p>Right on Dan. Try it Elias, keep it subtle, flattening only a small amount, and the b-q, d-p pairs to match, to better integrate those letters with the straight-sided h, n, m. Another potential reason for flattening the rounds is to instill a stronger blackletter heritage---if blackletter is the direction you want to go in.</p>
      <p>The alternative is to leave the rounded letters rounded---to contrast with the straight-sided guys. This approach is found in most sans serifs, eg: officina, frutiger, futura. Not many people question the design logic of those fonts or complain they lack integration. The shape contrast is taken for granted, as a defacto standard in roman type design. The advantage of contrasting forms---rounded versus rectangular---is maintaining differentiation and readability. One detractor of blackletters is their reduced readability because they're so modular.</p>
      <p>But that kind of modularity is a defining characteristic of blackletters, and there is a very special, sublime art to making them hang together and read properly. Some letters are differentiated only by serif &amp; swash lengths and positions.</p>
      <p>One problem to tackle is deciding on structures for x, y and z. Dan doesn't like them and its easy to understand why*. In a strict blackletter font, roman x, y, z structures stand out next to all the straight-sided forms. Many blackletters solve this integration problem with cursive forms for v, w and y, with straight sides (or at least one straight side). Traditional blackletter "x" is very abstracted, and not compatible with your font (people simply would not accept it). That leaves s and z as oddballs---"z" can be made with straight sides, but is a risky solution. Rounded "s" form isn't a problem in schwabacher and fraktur; textur s's have square sides.</p>
      <p>These are crucial factors that will help determine whether to keep c, e, o, b, d, p, q rounded, or flatten or even fracture their sides. Decision time...which direction should the whole thing go? Flatten c, e, o, b, d, p, q and it will very likely go the blackletter route. Keep those letters rounded and defacto roman s, v, w, x, y, z forms will integrate much more plausibly; but the whole will still have tangible blackletter characteristics. Which direction you go depends how gothic, or roman you want it to be.</p>
      <p>The most interesting thing about this font so far is the curious blend of gothic and roman elements. Making it decidedly blackletter could make it routine and predictable, and not particularly interesting compared to traditional blackletters. The best advice I can give is---keep it interesting :^)</p>
      <p>A quick rework:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/eliasrework3.png"></div><p></p>
      <p>* upper arm of "k" thinned to obey stroke/ductus logic<br>
      * angled ends on ends that were horizontal<br>
      * redesigned "f" hood (your current version was too thick)<br>
      * less angle on stem ends</p>
      <p>Angling every stem end is optional and I only drew them to find out what it looks like. Some people like it that way---very uniform. I prefer variety of detail and a sensible amount of non-conformity to keep things stimulating.</p>
      <p>Rhodaelian modularity:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/rhodiemodular.png"></div><p></p>
      <p>There are intelligent modular fonts and simplistic modular fonts. One thing I strived hard for with Rhodie was intelligent modular design in a blackletter-like font with straight sides---not easy. </p>
      <p>* "w" isn't just two v's stuck together<br>
      * "u" (not shown here) and "w" have shared form, but distinguishing details<br>
      * stroke ends on "s" are not straight diagonal lines---a shallow curve was neccessary to contrast with the straight diagonals of the spine---straight stroke ends were palpably wrong in context<br>
      * how an "x" can have straight sides---it only integrates properly in this kind of a font where straight sides dominate.</p>
      <p>Vertziert Schwabacher I am working on:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/verziertschwabach02.png"></div><p></p>
      <p>* example of cursive "v" and "w"<br>
      * new "x" is roman form but I made it fit in with modular details<br>
      * original y is roman form too but fits in for same reasons<br>
      * "z" is cursive blackletter form, I recommend it for your font<br>
      * traditional schwabacher "s" is just plain beautiful---sublime beauty. Consider adopting/adapting it<br>
      * cursive loop "k" is replacement for traditional schwabacher form, also recommend cursive loop design for your font.</p>
      <p>Your current "s" is not well integrated, but don't take that criticism too seriously. Lots of fonts, some quite successful, have an unintegrated "s" problem. If you decide to change your "s" the schwabacher form would be a good starting point. Study a few well-regarded schwabachers. Make sure you're looking at genuine, authentic schwabacher "s", as some schwabacher fonts have corrupted/bogus "s" forms. Forget textur "s", not suitable. Fraktur "s" offers possibilities too.</p>
      <p>It's been a pleasure working on your font Elias.</p>
      <p>* I empathize strongly with your attitude to those diagonals Dan :^)</p>
      <p>j a m e s</p>
    html_clean: |-
      <p><em>I think that your “pen angle” on top of the b, d, and l is too steep.</em></p>
      <p>Yes. Even tho this design is synthetic its pen-derived nature should not be neglected. The angled stem ends do not feature realistic nib &amp; ink details but are abstracted with their crisp geometric precision, and suggestive of calligraphic forms. Therefore at least make the angle realistic to make the motif authentic. It may sound contradictory, but abstracted design can have realistic qualities. </p>
      <p>Is all this philosophical design justification neccessary? Not absolutely, but it definitely gives insight into your design and aids in solving various kinds of problems :^)</p>
      <p><em>If you break the curve in one or two places along the letter, you won’t loose any rotunda-ness...</em></p>
      <p>True, but that kind of thing tends to be more successful in rotundas drawn with a flat nib and ink where the line contrast is high. I'm not disagreeing with you outright, but think fracturing may be problematic in a low contrast linear font like this one. The best answer is to try it and see how it goes.</p>
      <p><em>After a quick look, I think that the c, e, and o are too round. Have you tried “breaking” their curves?</em></p>
      <p>Right on Dan. Try it Elias, keep it subtle, flattening only a small amount, and the b-q, d-p pairs to match, to better integrate those letters with the straight-sided h, n, m. Another potential reason for flattening the rounds is to instill a stronger blackletter heritage---if blackletter is the direction you want to go in.</p>
      <p>The alternative is to leave the rounded letters rounded---to contrast with the straight-sided guys. This approach is found in most sans serifs, eg: officina, frutiger, futura. Not many people question the design logic of those fonts or complain they lack integration. The shape contrast is taken for granted, as a defacto standard in roman type design. The advantage of contrasting forms---rounded versus rectangular---is maintaining differentiation and readability. One detractor of blackletters is their reduced readability because they're so modular.</p>
      <p>But that kind of modularity is a defining characteristic of blackletters, and there is a very special, sublime art to making them hang together and read properly. Some letters are differentiated only by serif &amp; swash lengths and positions.</p>
      <p>One problem to tackle is deciding on structures for x, y and z. Dan doesn't like them and its easy to understand why*. In a strict blackletter font, roman x, y, z structures stand out next to all the straight-sided forms. Many blackletters solve this integration problem with cursive forms for v, w and y, with straight sides (or at least one straight side). Traditional blackletter "x" is very abstracted, and not compatible with your font (people simply would not accept it). That leaves s and z as oddballs---"z" can be made with straight sides, but is a risky solution. Rounded "s" form isn't a problem in schwabacher and fraktur; textur s's have square sides.</p>
      <p>These are crucial factors that will help determine whether to keep c, e, o, b, d, p, q rounded, or flatten or even fracture their sides. Decision time...which direction should the whole thing go? Flatten c, e, o, b, d, p, q and it will very likely go the blackletter route. Keep those letters rounded and defacto roman s, v, w, x, y, z forms will integrate much more plausibly; but the whole will still have tangible blackletter characteristics. Which direction you go depends how gothic, or roman you want it to be.</p>
      <p>The most interesting thing about this font so far is the curious blend of gothic and roman elements. Making it decidedly blackletter could make it routine and predictable, and not particularly interesting compared to traditional blackletters. The best advice I can give is---keep it interesting :^)</p>
      <p>A quick rework:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/eliasrework3.png"></div><p></p>
      <p>* upper arm of "k" thinned to obey stroke/ductus logic<br>
      * angled ends on ends that were horizontal<br>
      * redesigned "f" hood (your current version was too thick)<br>
      * less angle on stem ends</p>
      <p>Angling every stem end is optional and I only drew them to find out what it looks like. Some people like it that way---very uniform. I prefer variety of detail and a sensible amount of non-conformity to keep things stimulating.</p>
      <p>Rhodaelian modularity:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/rhodiemodular.png"></div><p></p>
      <p>There are intelligent modular fonts and simplistic modular fonts. One thing I strived hard for with Rhodie was intelligent modular design in a blackletter-like font with straight sides---not easy. </p>
      <p>* "w" isn't just two v's stuck together<br>
      * "u" (not shown here) and "w" have shared form, but distinguishing details<br>
      * stroke ends on "s" are not straight diagonal lines---a shallow curve was neccessary to contrast with the straight diagonals of the spine---straight stroke ends were palpably wrong in context<br>
      * how an "x" can have straight sides---it only integrates properly in this kind of a font where straight sides dominate.</p>
      <p>Vertziert Schwabacher I am working on:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/verziertschwabach02.png"></div><p></p>
      <p>* example of cursive "v" and "w"<br>
      * new "x" is roman form but I made it fit in with modular details<br>
      * original y is roman form too but fits in for same reasons<br>
      * "z" is cursive blackletter form, I recommend it for your font<br>
      * traditional schwabacher "s" is just plain beautiful---sublime beauty. Consider adopting/adapting it<br>
      * cursive loop "k" is replacement for traditional schwabacher form, also recommend cursive loop design for your font.</p>
      <p>Your current "s" is not well integrated, but don't take that criticism too seriously. Lots of fonts, some quite successful, have an unintegrated "s" problem. If you decide to change your "s" the schwabacher form would be a good starting point. Study a few well-regarded schwabachers. Make sure you're looking at genuine, authentic schwabacher "s", as some schwabacher fonts have corrupted/bogus "s" forms. Forget textur "s", not suitable. Fraktur "s" offers possibilities too.</p>
      <p>It's been a pleasure working on your font Elias.</p>
      <p>* I empathize strongly with your attitude to those diagonals Dan :^)</p>
      <p>j a m e s</p>
