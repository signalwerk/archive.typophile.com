      <p>I just saw this thread on Benedicta for the first time and was wondering if you've managed to finish the face. I would be very interested in seeing the final product and reading what others have to say about it.</p>
      <p>Personally, I'm extremely impressed with your concept and competence. When I saw Benedicta, I said out loud to myself, "Wow, this is nice!".</p>
      <p>I completely disagree with our colleague who said it was "too raw" and that you should make it a "real mashup". I believe simplicity is a virtue, and this proposed "mashup", as I understand it, would turn your face into the equivalent of an American pizza with everything but the kitchen sink on top. This is probably the reason I'm not very fond of your c ligatures (ch, ck), and don't much care for the h with the little bit of flab hanging to the left. Also, I much prefer the fl ligature in which the top end of the l sticks past the terminal of the f; I find the other (in which the f merges into the l, or vice-versa) distracting and a bit confusing.</p>
      <p>Other than that, your face is personable, energetic, and highly readable (provided those distracting ch and ck ligatures are not used). Can't wait to see your book weight, italic, caption and display sizes, small caps... ;-)</p>
      <p>P.S. Só descobri agora, com agradável surpresa, que você tem sua base no Brasil. Neste país em que a boa tipografia é pouquíssimo conhecida e ainda menos praticada, e em que a grande maioria dos pseudo-tipógrafos e designers têm uma fixação com tipos neoclássicos estáticos ou realistas, é muito bom ver talento como o seu.</p>
