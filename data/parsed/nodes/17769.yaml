    <p>Hi everybody, </p>
    <p>I’m working on a sans with a blackletter influence. The forms was inspired by the rotunda style of the blackletters and the sans serif's design of twenty century. The first version was called Benedicta, it keeps the heavy structure of the gothic types and the legibility of the sans what make it a good type for headings. Until now, these are the first versions of some lowercases. The diacritics, punctuation, symbols and characters x, y and z are under construction as the uppercase letters. I'll post it here as soon as possible. </p>
    <p>tks</p>
