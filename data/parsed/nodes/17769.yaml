      <p>Yes, alright, textur is the one with modularity problems.  I wrote an essay on textur versus fraktur &amp; schwabacher, the conclusion goes some thing like:</p>
      <p>"Textur, that pious black broken bastard, gives the other two a bad reputation they haven't earned."</p>
      <p>I'm well aware of the differences between the 3 main blackletter types, having looked very, very closely at them. Even so, the blackletter = modular = unreadable myth clouds my perception. LOL.</p>
      <p><em>On the contrary, blackletter has a lot more structural variety -especially in the extenders, the important place- than Roman.</em></p>
      <p>Absolutely, especially fraktur and its rich "o" design. The structural wealth of schwabacher and fraktur is what makes them so great and roman so predictable. The uniformity/modularity of roman is what you'd expect from design decended from an authoritive, militant, regimented, heavily ordered culture---romanis de antiquitus.</p>
      <p>Do you think Koch's Klingspor Gotisch is an intelligent textur design compared to historic texturs from the 12th --- 15th centuries?</p>
      <p><em>...think [...] of fraktur, and its sublime archetypical Yin-Yang “o”.</em></p>
      <p>I think of that at least once every week. It just shows up in my mind, like a template---an archetype.  :^)</p>
      <p>j a m e s</p>
