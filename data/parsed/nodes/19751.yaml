    html: |-
      <p>I think you have gone overboard with the glow and stars, given the name and use I would look at a more casual script like<br>
      <a href="http://www.myfonts.com/fonts/underware/bello/">http://www.myfonts.com/fonts/underware/bello/</a></p>
      <p><a href="http://www.myfonts.com/fonts/positype/kari/">http://www.myfonts.com/fonts/positype/kari/</a></p>
      <p>or pare down the effects and use your original face maybe with an outline. The ball needs to show all the black panels like this<br>
      <a href="http://guide.theemiratesnetwork.com/living/images/soccer%20ball%202.jpg">http://guide.theemiratesnetwork.com/living/images/soccer%20ball%202.jpg</a></p>
      <p>I would also look at the relationship of the three elements<br>
      Place<br>
      Name<br>
      Image<br>
      at the moment they are each fighting for prominence<br>
      Tim</p>
