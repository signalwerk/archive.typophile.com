      <p>I’ve been working in the medical industry and know how wasteful it is, so kudos for the idea. </p>
      <p>You said “green thinking pouring into hospital,” so why not play with the l as a droplet? I think you could customize the font a bit and this could work. Also a bit bolder weight might help. I like the n turning into an l, but the I think the whole logo should be the same color.</p>
