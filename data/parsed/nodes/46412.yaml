    html: <p>Green n is becoming l (which is suppose to be black) to visualize something like green thinking pouring into hospital. Backward e in version 2 and 3 has no meaning. I was trying to avoid stuff like green leaves, water drops, trees and other thing so often used in this sort of logos.</p>
