  html: |-
    <p>Hi everyone,</p>
    <p>I discovered Typophile just recently, but was instantly charmed by it. I love the fact that a lot of people are so passionately engaged in discussions. For example, you can witness first hand how some logos have transformed and became 1000 times better thru comments and suggestions from numerous members. </p>
    <p>I haven’t contributed to this community yet, so it seams undeserving for me to ask for your help, but I really need it and it is for a good cause. </p>
    <p>I am trying to design a logo for a wiki called Green Hospital. The idea behind it is to provide relevant information to hospital decision makers which will allow them to transform their hospital into more environment and people friendly facilities.  </p>
    <p>Thank you for your time and critiques.</p>
    <p></p><div class="imageWrap"><img src="/files/green_hospital_4029.png"></div><p></p>
