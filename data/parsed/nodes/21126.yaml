      <p>I've been comparing Fontographer with FontLab Studio... Fontographer is (much) nearer my budget - but Fontlab Studio has other features, but would actually benefit me...<br>
      For example, what is "TrueType hinting"?</p>
      <p>There's other things I don't understand, so maybe it's best to crawl, then walk before running! Should probaby head down the safer route with Fontographer, as a novice! At least it can import EPS files - that way I could create some Illustrator letterforms and bring them into Fontgrapher.</p>
      <p>How did you guys start out making fonts? Is the Fontographer software easy to get on with? The FCP software I previosuly used was quite basic.</p>
