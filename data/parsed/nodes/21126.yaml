    <p>Hi all,</p>
    <p>I've only ever designed two fonts, way back during my time at college. (One was called Pill Popper, which can still be downloaded off of 1001fonts.com)</p>
    <p>Anyway, I designed these using some Windows program called FCP - Font Creator Program - which I think I bought online from about £20. It was okay, but given my lack of font design skills, I spent ages forming one character! I also didn't have much of a clue about how things should be spaced, kerned, etc...</p>
    <p>I've been graphic designing for three years in book publishing -  I want to get back into designing some fonts, even if it is only ever a hobby/personal work.</p>
    <p>I need to know where to start. I know that Fontographer is available for OSX, which would set me back a few hundred quid. Or is there another option to creating fonts? Can I use Illustrator, or Photoshop? Or is there a better alternative to Fontographer?</p>
    <p>Are there any suitable books for designing digital typefaces? Recommendations a must!</p>
    <p>Apologies if you've had loads of email like this before.<br>
    Best,<br>
    Russ</p>
