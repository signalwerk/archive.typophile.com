    html: |-
      <p>I am pretty much a beginner in Font-producing aswell, and by coincidence I started with Fontographer. After a couple of weeks I started to love it. If you compare the path-tools with Illustrator – Fontographer is so much better and more "logical" in a way too.</p>
      <p>There is really only one thing that bothers me about Fontographer, and this is the strange preview. It doesnt show (or print out) fonts with a good screen resolution. So if you want to look at it on screen, you'll have to use InDesign or similar app. And also print from another app.</p>
      <p>On the other hand; this is also actually rather nice in some strange way. It feel a little bit retro - and it doesnt bother mo anymore.<br>
      I would probably advance to FontLab sometime in the near future UNLESS Fontographers big feature update that is coming, implements a better screen preview and some Opentype-support. Today it can't produce Opentype-fonts, so if you want to add some Opentype-feature, you have to open the Fontographer-file in Fontlab anyway.<br>
      Download and test the demo's available at Fontlab.com, and see what appeals to you.</p>
      <p>With the latest CS2 Illustrator you can even copy paste Illustrator vectors. But really, you dont gain anything if you start drawing the letters in Illustrator - better do them directly in Fontographer (or Fontlab) in my opinion.</p>
      <p>But, hey - just a little warning: Designing Type is like a drug! You can't stop ;-)</p>
