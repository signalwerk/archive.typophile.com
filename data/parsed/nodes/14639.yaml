    html: <p>You really should say what your “this” is, but it’s FontExplorer, and a bit heavy of a program for his purposes. Although, if he needs all that functionality, it is useful.  They have a <a href="http://www.linotype.com/freedownload/tools/fontexplorer/FontExplorer-Setup.exe">Free PC Version</a> and <a href="http://www.linotype.com/freedownload/tools/fontexplorer/FontExplorer.sit">Free Mac Version</a> but at about 180 Mb each, it’s a pretty big program.  A smaller program, only 658k, is a free version of Advanced Font Viewer called <a href="http://www.styopkin.com/details_free_and_easy_fonts_viewer.html">Easy Font Viewer</a>.  Still, I prefer <a href="http://www.styopkin.com/details_advanced_fonts_viewer.html">Advanced Font Viewer</a> and it is still small but powerful.  It’s main feature is just what he’s looking for.  A text box to type in the text you want to show in a particular font, and then a window that shows that text in all your fonts, listed neatly and quickly.</p>
