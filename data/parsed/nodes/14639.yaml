    <p>Hey everybody,</p>
    <p>My name is Andy Welfle, and I am a writer/amatuer designer. I have a question for the Masters…</p>
    <p>When I am picking out a typeface, I like to see my options. I like to see a sample of text in Myriad, Frutiger, Utopia, etc., all next to each other. </p>
    <p>I downloaded a demo of a program called FontTasteTester for Mac, but it expired (and being a cheapskate, I don’t want to renew it…). It was also for the old OS.</p>
    <p>Can anyone recommend a freeware program for Mac OS X that can display a chosen phrase or word in list form all the fonts available? </p>
    <p>Thanks for your help, I look forward to posting more often!</p>
