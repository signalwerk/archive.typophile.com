      <p>Lieutenant Pigeon – Mouldy Old Dough<br>
      <a href="http://fontsinuse.com/uses/232/lieutenant-pigeon-mouldy-old-dough" title="http://fontsinuse.com/uses/232/lieutenant-pigeon-mouldy-old-dough">http://fontsinuse.com/uses/232/lieutenant-pigeon-mouldy-old-dough</a></p>
      <p>Lieutenant Pigeon: very close to <a class="freelinking external" href="http://www.myfonts.com/fonts/facetype/aeronaut" rel="nofollow">Aeronaut</a> so may be (quoted from MF description) "Kirchengotische Schrift, a font that can be found in a German font book from 1879 entitled Vorlegeblätter für Firmenschreiber."<br>
      MOULDY OLD DOUGH: a gothic concave tuscan should do the job from <a class="freelinking external" href="http://www.myfonts.com/fonts/intellecta/concave-tuscan" rel="nofollow">Concave Tuscan</a> (Shade version unshaded would probably the closest I have), <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/gothic-tuscan" rel="nofollow">Gothic Tuscan</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/solotype/minnesota" rel="nofollow">Minnesota</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/mansard" rel="nofollow">Mansard</a></p>
