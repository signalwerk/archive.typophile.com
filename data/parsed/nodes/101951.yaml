      <p><a href="http://fontsinuse.com/uses/212/wild-life-jazz-band-swinging-dixieland-evergr" title="http://fontsinuse.com/uses/212/wild-life-jazz-band-swinging-dixieland-evergr">http://fontsinuse.com/uses/212/wild-life-jazz-band-swinging-dixieland-ev...</a></p>
      <p>The western font looks like (or shares characteristics of) a non-condensed version of <a href="http://www.dafont.com/hff-young-wanna.font?text=WILD+LIFE+JAZZ+BAND&amp;fpp=500&amp;af=on" rel="nofollow">HFF Young Wanna</a> which was derived from Juanita on page 50 of the Solotype catalogue »Condensed Alphabets: 100 Complete Fonts« or<br>
      page 37 of »The Solotype Catalog of 4,147 Display Typefaces«.</p>
      <p>Don’t know if the SoloType fonts are non-condensed, though.</p>
