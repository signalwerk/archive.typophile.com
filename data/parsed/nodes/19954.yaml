      <p>I think 1) John's claim that <em>The Stroke</em> "makes no claims to being about type design" and "is completely concerned with the study and description of written forms" is misleading, and 2) the 'incantation' [sic] Hrant wants us to believe is 'codswallop' ought to be taken seriously. </p>
      <p>Gerrit Noordzij: [Foreward 2005] "My contribution to the course of graphic design at the Royal Academy of Art in The Hague was founded on calligraphic exercises. Calligraphy is handwriting pursued for its own sake, dedicated to the quality of the shapes. From evaluating and discussing our experiences a theory of writing emerged that allowed us to describe the properties of shapes with parametric precision, without imposing aesthetic or ideological conditions.This book is an introduction to the theory."</p>
      <p>And in an unpublished text provisionally called " The decadence of all design:" "While looking for an alternative [to indoctrination] I avoided the subject of design. Instead I concentrated on the interaction of tool and shape that could be expressed in parameters of the stroke. And here, at a convenient distance from design, I found the Archimedean point that enabled me to describe design with a high degree of precision."</p>
      <p>No book will say all there is to say about designing type, but I do think Noordzij's book deserves the status of 'recommended reading.' My hope in translating it was that it would achieve 'recommended reading' status, and that it's actual worth be recognized. If the subject was the shape characteristics of exhaust systems in modes of public transportation, the horse poop metaphor might have been a little bit less of a load of crap. (I have not seen Karen Cheng's book.)</p>
    html_clean: |-
