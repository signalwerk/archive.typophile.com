      <p><em>Anything is better than having “The Stroke: Theory of Writing”<br>
      as the main textbook.</em></p>
      <p>Actually, I think trying to build a type design curriculum around either book would be equally mistaken. But <em>The Stroke</em> makes no claims to being about type design, and I think one would have to deliberately misread it in order to think it was about type design. It is about what it says it is about, a theory of <em>writing.</em> It doesn't even contain a single illustration of a piece of type. It is completely concerned with the study and description of written forms.</p>
