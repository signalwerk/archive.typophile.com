  html: <p>Just bought the <a href="/web/20131024053048/http://typophile.com/wiki/Designing%20Type" class="freelinking" rel="nofollow">Designing Type</a> by <a href="/web/20131024053048/http://typophile.com/wiki/Karen%20Cheng" class="freelinking" rel="nofollow">Karen Cheng</a> and its the best book ever... Even before looking at it I used to say that a good type design book should have:a.basic rvisual rules and (most importantly) 26 Different chapters, ONE for each letter (or52) with all the individual characteristics and that exactly what this book is about. For some weird reason there seems to be no bibliography devoted to the actual proffesional design of fonts.. I would recomend Cheng's book to anyone.</p>
