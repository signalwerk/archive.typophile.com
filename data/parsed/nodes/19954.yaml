      <p>Learning the numbers in the measurements is not of so much value.  The act of taking the measurements and conjuring theories for differences as you take them, leads to thought beyond what the caliper tells you.  This is the value that goes beyond the time spent doing it. I would also recomend that students fight with drawing glyph curves--building them up by going back and forth using black and white paint and brush--before ever drawing glyphs with bezier curves on a computer.  Once you complete the struggle and learn to see what makes a curve work with paint, you will later make leaps in seeing curves on the computer as you draw them. Sure, you can more quickly draw a glyph on the computer at first but taking the slower route at first speeds learning later. </p>
      <p>ChrisL</p>
