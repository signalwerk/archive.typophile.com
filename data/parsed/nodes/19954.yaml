      <p>Lawson's book is one of those happy texts that offer more than the title suggests. Cheng's offers less, and also less than the introduction to the book suggests.</p>
      <p>It is precisely because there are so few books on type design that we need to critically appraise books that do come out which claim e.g. to be focused on type design processes and issues, because they may easily be taken up by people, especially students and ill-informed teachers, as standard texts, simply because there are no alternatives. Cheng's book seems a useful sort of thing, and I'm glad it exists. But it isn't really about what it says it is about.</p>
