      <p>Perhaps there is no such thing as a "best book". </p>
      <p>One of the things that I like about Bringhurst is that his book shows the impact of various design choices. This makes it possible to step back from the content and examine, and analyse, the book as an object. To take an obvious example, each of his appendices is laid out differently. </p>
      <p>Very helpful.</p>
      <p>A book about a particular philosophy towards design of type, or about the development of a specific type, has its own place, either a good or bad book for what it is and (if I can inject a personal bias) whether it is well written.</p>
