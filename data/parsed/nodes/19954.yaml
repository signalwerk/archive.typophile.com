      <p>Peter: <em>I think 1) John’s claim that The Stroke “makes no claims to being about type design” and “is completely concerned with the study and description of written forms” is misleading...</em></p>
      <p>It also represents my reading of the book, which is in the context of my readings in palaeography. It is only because I know Noordzij has taught at The Hague and I have seen his type design work and the work of his students that I would think to relate his ideas to type design. If I encountered <em>The Stroke</em> without knowing anything about Noordzij's involvement in type, and considered only the content of the book, I would presume that its principal audience was palaeographers and its principal critique was of common methods of palaeographic analysis, which seek to categorise letter shapes without understanding the tools and techniques involved in making them. For me, despite the fact that I am a type designer, this seems the content of the book. Applying the content to type design requires interpretation and extrapolation, because the subject of type design is not directly addressed in the text.</p>
      <p>Hrant: <em>The proof is the fonts...</em></p>
      <p>Thesis? Beowulf? Proforma? Caecilia? Inter? The work of the most notable graduates of The Hague programme is hardly characterised by strong chirographic characteristics, and is notably dissimilar to Noordzij's own typeface design. If you talk with these designers, it is obvious that their engagement with Noordzij's ideas are critical, and they need to be critical precisely because Noordzij positions his ideas at a distance from design (deliberately, as Peter's quotes indicate). The ideas are not prescriptive for type design -- cannot be prescriptive for type design -- because they do not engage with the processes of type design: they need to be interpreted, extrapolated and critically applied by the student.</p>
