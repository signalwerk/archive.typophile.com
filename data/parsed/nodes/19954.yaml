      <p>Hrant: <em>John was caught with his pants down, surprised that the GN book is used so centrally in those classes; he doesn’t agree with it, but he won’t admit that in my presence...</em></p>
      <p>I wrote: 'Actually, I think trying to build a type design curriculum around either book would be equally mistaken.'</p>
      <p>I stand by that statement. So what am I not admitting?</p>
      <p>If I were trying to teach type design, I would put both <em>The Stroke</em> and <em>Letterletter</em> on the reading list, and I would comment on what I think is useful about each book. I don't think I would put Cheng's book on the list because I think it would be a better educational opportunity for students to make their own measurements and observations of typefaces, rather than reading about Cheng's measurements.</p>
      <p>Far from teaching chirographic type design, I think I would put the focus on scale, having students explore different techniques for making letterforms readable at different sizes. This derives from notes I made many years ago when I was researching different approaches to spacing (including Kindersley's). I was planning a two-part essay for the defunct <em>Serif</em> magazine entitled 'On the just spacing of letters'. The title was a reference to Durer's 'On the just shaping of letters', and it struck me that what the renaissance treatises on letterform construction and modern writing on the spacing of letters had in common was that both ignore the question of scale. I think it would be fruitful to put size at the centre of a type design curriculum.</p>
