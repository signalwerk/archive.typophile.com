    html: "<p>I don't think Peter is missing the point at all: the book is entitled <em>Designing Type</em> and advertises itself as focusing on 'processes and issues of designing type'. It may well be a good book on letterform construction, and valuable in that regard, but letterform construction is not type design and analysis of letterform construction is not analysis of type design <em>processes.</em> Obviously these are criticisms of what the book claims to be and is advertised to be, rather than criticisms of what it actually is. As Peter says, the book is useful in providing a comparison of approaches to letterform construction. But to claim this is focusing on type design processes is a bit like saying a book on structural engineering focuses on architectural design processes.</p>"
