      <p>&gt; Noordzij’s book deserves the status of ‘recommended reading.’</p>
      <p>I agree! Although pretty much how an automotive<br>
      engineer analyses the scene of a freeway pile-up.</p>
      <p>The problem, Peter, is when the book starts getting recommended as the sole/central textbook in a type design course. When that happens, you can't convince anybody with half a set of wits that the "describes, doesn't prescribe" hymn holds any water whatsoever. The proof is the fonts, and in the curricula. If GN truly agreed with that hymn and cared about the fallout of its de facto fallacy, he would tell his disciples to cut it out already. Personally, I have to suspect he <cite>loves</cite> the fallout. Why? Because <cite>his own fonts are highly chirographic!</cite> Wake up and smell the fuel &amp; oil on the pavement.</p>
      <p>&gt; Type is not writing</p>
