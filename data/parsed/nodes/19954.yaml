    html_clean: |-
      <p>&gt; a better educational opportunity for students to make their own measurements</p>
      <p>But that would take up too much of the class, and assume direct<br>
      access to numerous fonts, some of them quite expensive. This is<br>
      one reason Cheng's book is so useful.</p>
      <p>&gt; having students explore different techniques for<br>
      &gt; making letterforms readable at different sizes.</p>
      <p>That would be a superb component in a <cite>second</cite> class in typeface design. For an introductory class (like the one I teach, and those two I referenced in this thread) it's actually pretty hard to strike a good balance between results and ideology, guiding versus brainwashing, etc. in a way that students can relate to and leverage. I actually managed to mention optical scaling, and how size affects everything (with some specifics, like color) but no way did I have time to get them to actually practice it.</p>
      <p>Here's something informal I wrote in response<br>
      to a person who asked me <cite>how</cite> I teach my class:<br>
      "<br>
      It's not an easy thing to wrap your head around. Especially<br>
      for somebody who sees problems in the two major schools,<br>
      Constructivism and Chirography. Strangely enough I think my<br>
      strategy has been to simply scare them a bit. :-) To say that<br>
      the "good way" of making letterforms is a thorny issue, and<br>
      they'll have to think about it on their own a lot. Mechanically,<br>
      I've advised them to think principally about notan, about the<br>
      *boundary* of black/white, as opposed to merely building the<br>
      black and allowing the white to fall into place. Beyond that I<br>
      try to explain the necessary balance between cohesiveness<br>
      and individuality among letterforms, I show different ways in<br>
      which certain elements (like numerals) have been done and<br>
      what the pros/cons are, all while asking them to doubt doubt<br>
      doubt, to take no precedent for granted, and certainly not try<br>
      to make fonts the way I do! I have no idea if this'll work though...<br>
      "</p>
      <p>Strangely enough, I think my students appreciated this style.<br>
      But I'll know more when I read the class evaluations...</p>
      <p>&gt; I think it would be fruitful to put size at<br>
      &gt; the centre of a type design curriculum.</p>
      <p>I agree, and really, I don't want to sound like a broken record, but by GN's<br>
      own admission, the dimension of scale is missing from his celebrated cube.</p>
      <p>hhp</p>
