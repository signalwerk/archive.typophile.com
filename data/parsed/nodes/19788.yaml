    <p>Dear readers,</p>
    <p>I am trying to do metrics for my italic serif-face Canapé, but I'm stuck right at the beginning...</p>
    <p>For upright designs, I usually would space the "o" symmetrically, assigning (for example) 40em/1000 on each side of it. For "n" I would do similar.<br>
    When testing the settings with "nnnnn" and "ooooo", this looks ok, and when typing "nonon", it's even as well. But not for italics obviously...</p>
    <p>When doing the same thing here, the "nonon"-combination looks very uneven. It would only help to assign asymmetrical space on the "n" (i.e. 10 left, 50 right instead of 30 on both sides), shifting it into the right place, but this is not very practical. Even more, the "o" has to stay symmetrically spaced, otherwise the effect is cancelled. So this is very inconsistent and will lead to problems I assume.</p>
    <p>Can anybody tell me how to do this right? At the moment I just don't get where the problem is...</p>
    <p>Thanks for your help<br>
    Sebilar</p>
