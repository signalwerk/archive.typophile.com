      <p>Sebilar, do you know <a href="http://briem.ismennt.is/2/2.3.1a/2.3.1.01.notes.htm" rel="nofollow">Briem's site</a> on type design? He partly explains Walter Tracy's method of spacing from 'Letters of Credit'. In this method in the roman the right side of the n usually has less space than the left. He also discusses italic. </p>
      <p>One important thing to remember, also from Tracy, is that when doing spacing, particularly for the italic, it may be best to modify the letters if they don't space well.</p>
