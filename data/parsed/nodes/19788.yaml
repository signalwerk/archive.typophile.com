      <p>The measuring line in FontLab is very helpful when adjusting the sidebearings on slanted glyphs. For italics, I usually set it to half the x-height. There will be cases when it does not work (glyphs with open sides like c and s), but those should be done by eye anyway.</p>
      <p>The "vertical bar" trick that Chris mentions needs a little clarification, I think. What I do is draw a rectangle. I then slant it to the same angle as the italic and then set the sidebearings to zero using the measurement line. This slanted rectangle can then be used as a spacing aid in the metrics window.</p>
