    html: <p>Any mathematical rule you follow for roman is likely to be useless for Italics. See the point about different serif structure, and what that does to numerical sidebearings. The object is to space each letter so it fits with each other. Math and symmetry are red herrings here. It ought to be a visual process. LC o is probably the only lowercase italic letter that can be spaced that way. Use o as a basis for subsequently spacing the other glyphs optically. Keep in mind that Caps will have even more asymmetrical sidebearings, since they are taller and intrude further to the right. You simply have to decide what part of the letter is centered (middle of x-height, top of lc, baseline, whatever), and then space everything pleasantly. It might help to look at the spacing of the Roman while working on the spacing of the lowercase, but I don't think you will be able to use a formula or methematical rule.</p>
