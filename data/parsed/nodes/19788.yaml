      <p>Sebilar,<br>
      Take this as my opinion, not fact. The dilemma with italic o is that the point of closest proximity on the left side is below center (about 60% down) and the point of closest proximity on the right side is above center. When you have a letter like n with a serif at bottom right but none at tp next to "o", the serif is in close proximity to the low left protrusion of the o making the 2 seem close together there. The left side of the n has serifs both top and bottom which makes it necessary to compensate by using a wider left sidebearing on the n.<br>
      The solution is to consider the centering vector you measure from to be a diagonal equal to the angle of inclination used to slant the italic. I usually set sidebearings on italic by setting a string of glyphs interspersed with the vertical bar.  If you can balance sidebearings this way, making compensations for adjoining shape differences become more predictable.<br>
      I hope this makes sense to anyone other than me :-)</p>
      <p>ChrisL</p>
