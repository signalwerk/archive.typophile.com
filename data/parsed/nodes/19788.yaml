      <p><em>And I think I also understand the method with the “vertical” bar or the slanted rectangle. But do you draw the rectangle around the whole letter (including serifs) or just the “main part” of them?</em></p>
      <p>Neither. The slanted rectangle should be a separate character. You can put it anywhere it's convenient--the non-breaking space for example. You can then type it before, after, or between the characters you're working on in the Metrics window. You can also use it with the measurement line. When your spacing is done, you delete the slanted rectangle.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/slanted-rect_5677.gif"></div><p></p>
