    <p></p><div class="imageWrap"><img src="http://typophile.com/files/1273505382flint_prepaid_3874.jpg"></div><p></p>
    <p>I would like to find out what the "FLINT" font is. Image search apps identify "Snowslider," which is almost identical on the L and N, but slightly different on the F I &amp; T.</p>
    <p>I'm re-creating this logo for this same company which no longer has their original EPS created many years ago, but already has a great deal of marketing material in circulation, so an exact match is unfortunately essential.</p>
    <p>Any help is greatly appreciated, thanks!</p>
    <p>Kev</p>
