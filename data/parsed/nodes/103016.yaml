      <p>I came up with a solution by scaling the original glyph in Illustrator to 8000pt and then importing the EPS into FontLab (giving the character much larger scale in FontLab as well). It still has a larger top than is needed, but it will work for my purposes.</p>
      <p>I guess I will have to open up some fonts like the Adobe Woodtype Ornaments which have these kinds of horizontal rules and see how they worked it out there. I have a feeling by setting the sidebearings out as far as I did that there might be issues if the page width ended up different than it is currently (its for a 6x9 paperback so for now, it works).</p>
      <p>Hopefully it will only be used this way on this one project, and I won't have to worry about it again. I've already spent more time on it than I billed for.</p>
