      <p>I'm not sure I see the problem.<br>
      Can't you simply scale the outline of the glyph to 1000% of it's current size, but not change the vertical metrics or UPM of the font? That should mean that setting it at 20pt gets you the same as you now get at 200pt, but with no extra vertical space. </p>
      <p>Unless I'm missing something. It is getting late. </p>
      <p>- Jason C</p>
