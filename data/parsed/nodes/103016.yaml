      <p>As I read the post, it isn't the left-right sidebeariungs that are the issue, it's the top and bottom. That is, the top-bottom need to be 20 point when the character is set to 200 points.</p>
      <p>If that's right...</p>
      <p>Several ways to do this in the font I suppose -- break the character up into 10 parts, and put each part in a separate character, the first &amp; last only having side bearings. Code in private use - or, use  a,b,c,d,e,f, etc, if he/you're willing to be sloppy...</p>
      <p>Or, when setting, it it can be scaled in one direction only, say the horizontal, within InDesign. InDesign lets you do that, even put the instruction in a character style if you prefer. So, if it's a taper rule, set it so that when scaled 999% horizontally, it's vertical (the swell, in this case) is just right at 100%; you could provide for that &amp; anticipate such scaling in the characters you draw in the font.</p>
      <p>Etc.</p>
      <p>I don't think I've been very clear. Let me know if I need to try again.</p>
