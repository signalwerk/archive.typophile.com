    <p>Previously, I've only ever used FontLab for editing fonts, or adding special characters, but I've recently been asked to build a very simple dingbat font for a client, which consists of two dividers that are going to be used in the layout of a paperback novel. Both need to be page width (which works out to be about 5" wide), and the designer doing the print production has requested a version where the dingbat font I built would work when set to 20pt or so so that when it appears at the top of a page it does not push the paragraph down to the middle of the page when using InDesign (currently it needs to be 200pt to be the correct width, I'm sure I could solve this if I was laying it out, but alas, I am not). I've looked through the FontLab manual, but I am not finding it to be particularly helpful for this question.</p>
    <p>Thanks!</p>
