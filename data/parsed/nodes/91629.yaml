    date: 2012-04-04T08:26:00
    votes: null
    html: |-
      <p>I once gave a talk in Thessaloniki about the hidden benefits of ligation, including aiding readability. At least one person though thinks that talk was crap. :-)  But he's (still) a friend.</p>
      <p>I haven't thought it all through, but I think the best basis would be to go through the lexicon of a given language and for word pairs (or more generally, sets) that have convergent boumas use ligation to diverge them. But it has to be consistent.</p>
      <p>For example in English, for "guest" and "quest" the latter might get an "st" ligature but the former not.</p>
      <p>hhp</p>
