      <blockquote><p>For example in English, for "guest" and "quest" the latter might get an "st" ligature but the former not.</p></blockquote>
      <p>Interesting idea. Wouldn't that be distracting in some cases, at least at first. While that would change the word shape for "quest" in this case, perhaps for better recognition, but it would only really work if everyone made the same choice. What if one designer thought the former should it? I'm not arguing that it wouldn't improve things, but it would only to well if it were adopted by many people.</p>
