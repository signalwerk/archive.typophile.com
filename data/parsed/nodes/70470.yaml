      <p>I'm not saying that this face is necessarily as appealing to others as the one noted in another recent post, the "Transitional English Type" from Updike.</p>
      <p>In the late 19th and early 20th centuries, I had seen so many bad examples of Scotch Roman as to cause me to deprecate the entire genre. Finding one where the letters appear very well-proportioned is pleasing to me. But is it different enough from, say, Bell or Oxford to be generally useful?</p>
      <p>After Times Roman, the next two most popular serif typefaces are Caledonia and Century Expanded, so there does seem to be a preference for the plainness of a Modern face if it is attractive enough - although Baskerville and Garamond, for example, are also still quite popular. And then there's Palatino and Weiss Roman.</p>
