    <p>Some time back, I noted that I was not fond of most Scotch Roman typefaces, and yet there were some Modern faces that I liked in addition to Century Expanded and Century Schoolbook on the one hand, and Bodoni on the other.</p>
    <p>Just recently, I found one book online that was an excellent example of what I thought of as a "good" Scotch Roman. It was entitled "Gravitation", and dated from 1835, and was written by George Biddell Airy, of fame in connection with the discovery of Neptune. While the book did not note its typeface, it did note its printer, and so I searched for other books by that printer, one William Clowes.</p>
    <p>It turns out that this was a famous printing firm, being one of the early stereotype printers, and they made their own type. In addition to printing the Penny Cyclopaedia and the Penny Magazine, they also printed an edition of Lyell's Principles of Geology and Franklin's account of his expedition to the Arctic.</p>
    <p>The italic, however, still looks odd and dated to modern eyes, but the roman seems to me to be a very friendly and human example of the Modern Roman.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/clowes_6426.jpg"></div><p></p>
