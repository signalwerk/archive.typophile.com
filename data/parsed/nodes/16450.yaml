      <p>&gt; Also wondering if anyone knows of a InD/FL path? :)</p>
      <p>You make a PostScript file out of InDesign, then run through GhostScript’s free “ps2ai” utility and import the resulting file into FontLab. It’s easy. The most dreadful step for many people will be using the command-line GhostScript. :)</p>
      <p>Adam</p>
