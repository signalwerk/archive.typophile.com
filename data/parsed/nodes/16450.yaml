      <p>Wow! To make sure the drawing didn’t scale wrong in the copy, I used to make an Em square, incl. baseline, and copy that along with the glyph. It reminded me, always, of the cartoon with the portable hole that the cat-burgler character would use to get loot through windows and escape from the cops. </p>
      <p>I was moving whole cases back and forth then just to change serifs, or all of a stem type, or importing logos. Do other people use this path in the design porocess nowadays, or is it primarily an entry level, or very-special-case path. Also wondering if anyone knows of a InD/FL path? :)</p>
