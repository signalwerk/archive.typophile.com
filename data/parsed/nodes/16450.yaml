      <p>I sometimes start putting letterforms together in FreeHand, which is my drawing program of comfort/choice. But once outlines are in FLab, that’s where I work on them. (Quite often these days, I will start drawing in FLab.) </p>
      <p>One of the greatest benefits of this “workflow”, or “workpuddle”, is that there are no surprises with nodes and BCPs aligning to whole units on the em grid. If you develop a font with a lowercase “i” with a vertical stroke width of, say, 25 units, and you want to center a 30-unit wide dot, you can make that in AI or FH, but it won’t fly in FLab. Likewise, if you wanted a 29-unit wide dot on your i, you couldn’t have a perfect circle, since the midpoint of 29 is 14.5, and decimals are verboten.</p>
      <p>Unfortunately, FOG gave us the false impression that we could work in decimals and half-units, but the app then “flattened” points and handles when the fonts were generated.</p>
