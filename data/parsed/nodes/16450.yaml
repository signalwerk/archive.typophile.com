    date: 2005-11-27T12:41:00
    date_raw: 27.Nov.2005 12.41pm
    votes: null
    html: <p>I think it’s mainly people who can’t get used to drawing directly in FontLab (i.e., wimps). Seriously, there are some procedures which are easier to do in Illustrator, which is reason enough to use it in many cases. But you can always go from FL &gt; Illustrator &gt; FL if you just need to run a special Illustrator filter on a glyph or whatever. As a routine method for drawing glyphs, though, working in Illustrator involves quite a few extra steps and seems inefficient to me now. (I used to work that way.)</p>
