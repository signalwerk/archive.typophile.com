      <p>A month later.</p>
      <p>I contacted the museum, and you were right, Stefan. The logo is made by Bo Linnemann of <a href="http://www.kontrapunkt.dk/" rel="nofollow">Kontrapunkt</a> (who has made many far superior faces—I wonder why this one is so sub-par), and there is no font made from it, only the letters needed for the logo were made.</p>
