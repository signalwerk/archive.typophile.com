    <p>Hello all,</p>
    <p>Below is the logo for the <a href="http://kunstindustrimuseet.dk" rel="nofollow">Danish Museum of Art &amp; Design</a>. I’m taking a graphic design course, and the task for the exam is to make some (hypothetical) material for this museum. To create a stronger bond with the museum’s own site, I wanted to use their own font where possible (despite the fact that they seem to use Helvetica more), but I can’t figure out what font it is, and whatthefont.com seems stumped, too.</p>
    <p>I hope someone here can help with a positive ID—otherwise, I’ll have to see if I can get in touch with someone at the museum directly.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_kunstindustrimuseet_4F_4446.png"></div><p></p>
