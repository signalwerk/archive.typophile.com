      <p><em>It would be better if you go back to the insecticide table and work on a better bug-squashing app!</em></p>
      <p>Considering our limited resources what would be your recommendations on how to use them:<br>
      - keep fixing old stuff based on ancient code without hope to ever fix ALL bugs;<br>
      - use resources to make new things?</p>
      <p>FLS is not the most stable program in the world (especially on Mac OS), but its stability is comparable with the "OK level" of the industry (which is sad). It worked fine with up to 10.5 but apparently recent OS release by Apple is not fully compatible with it.</p>
      <p>We'll see what we can do, but since current FLS is not made for Intel Macs, it will require to move ALL current database to the XCode. That's not simple. And if you ask me, I'd say that it is a waste of time, compared to the new code that we are doing.</p>
