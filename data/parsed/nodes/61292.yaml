      <p>Let me tune in here and explain the problem: </p>
      <p>FontLab 4 and FontLab Studio 5 for Mac were built using Metroworks CodeWarrior: a PowerPC development environment that has been created long before Apple introduced their XCode. It was a reasonable environment but the problem with it was that Metroworks sold their Intel compiler to some other company short before Apple announced that it’s transitioning to Intel technology from PowerPC. </p>
      <p>The original developer who worked on FontLab Studio 5 left the company about two years ago to find some other challenges (I guess ten years of developing font editors was too much for him). It was not trivial for us to find a new quality programmer to replace him, so it took us some time. I’m not sure what your idea of our company is, but we certainly are not a huge team. Much rather: a small team. I do apologize that we don’t respond to all bug submissions, but please be assured that we’re collecting and analyzing them. </p>
      <p>A huge number of the bugs found in FontLab Studio 5 for Mac is absent from the Windows version, which is far more stable. So for FontLab Studio 6, we decided to abandon the old PowerPC code that was done in Metroworks, and port the code again from Windows into XCode. This will allow us to build universal binaries, and will for certain get rid of a large number of bugs. </p>
      <p>On top of that, we’ve always been open to collaborating with other software developers. We have donated a reasonable sum of money to Erik van Blokland, Just van Rossum and Tal Leming for their RoboFab development, and we’re currently working with Georg Seifert, the developer of Glyphs. In FontLab Studio 6, we plan to have native UFO font format support, so our applications can interact with those made by others. We’ve never intended to be ”monolithic”, and don’t intend that in the future. </p>
      <p>I have been working for a few months now on some of the issues you’ve mentioned above: much better and more consistent family naming management, family linespacing management, automatic generation of OpenType Layout features, and others. </p>
      <p>We’re all about diversity. We’re working on releasing Fontographer 5, which will have the high quality input and output for various font formats coming from FontLab Studio, while it will have a somewhat improved user interface as known from Fontographer. FontLab Studio 6 will have some improvements as well. And as I mentioned, if you prefer to work in a different drawing environment (Glyphs, DTL applications etc.) — we don’t mind it at all. Actually, we support it. </p>
      <p>Cheers,<br>
      Adam</p>
