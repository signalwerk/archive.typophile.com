    <p>After seeing the FontLab <a href="http://forum.fontlab.com/fontlab-studio-problems/old-persistent-fontlab-bug-paste-special-sidebearings-on-composites-t7123.0.html" rel="nofollow">paste sidebearings bug</a> for the 1000th time, I decided to post it on the FontLab forum in the vain hope that it might get fixed. It's been around since <em>paste special</em> was introduced and I had mentioned in the old Fontlab Forum. So I'm wondering how many bugs we've learned to live with FontLab is aware of. I searched the Typophile Forum and found lots of posts about FontLab bugs: bugs which still persist in the current version of FontLab Studio.</p>
    <p>I'm getting fed up with weird snapping BCPs, <a href="http://www.typodermic.com/promotions/the-dead-curve.png" rel="nofollow">dead curves</a>, bizarre shift-drag,/alt-drag behaviour, "auto" naming buttons that name things incorrectly and more. Some of these bugs are so old they've probably just forgotten about them.</p>
    <p>So, even if you've mentioned bugs here or on the old forum, pop over to the new <a href="http://forum.fontlab.com/fontlab-studio-problems-b5.0/" rel="nofollow">FontLab forum</a> and list them again.</p>
    <p>I don't know about you, but I don't want to spend another decade working around the same old FontLab bugs.</p>
