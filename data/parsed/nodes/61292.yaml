      <p>I am the one who wants to have FLS bug-free more than anyone else. FLS is my brainchild and you don't want your child to be sick :) Unfortunately, we are very small and, as a result, slow. Basically Apple changes rules more too fast for us to follow. FLS codebase (codenamed Leningrad) is older than OS X! Since then we had X revolution, then Intel and now 10.6. That's a bit too fast for the industry which adopted opentype font format in 10 years since its announcement :)</p>
      <p>Usually it was enough to publish 4-5 after-launch updates for the product, but with FLS5 it became more difficult, considering the size of the product and its age. It is right, we must have released FLS6 a year ago, but it didn't happen for many reasons. We will do it and we are trying to keep working on perspective things in the same time. It is just not easy.</p>
