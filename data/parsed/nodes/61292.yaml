      <p>In addition to my apologetic note posted above, I'd like to play devil's advocate for a moment and offer you a different perspective: </p>
      <p>It's quite interesting that very few people seem to be really bothered that Apple does not care much about continuity in their own operating system. </p>
      <p>Microsoft has always made sure that even quite ancient applications work on their newest operating systems, so people who have invested in very expensive software systems 10-15 years ago can still run them — even if the original manufacturer went out of business and there is no chance to actually upgrade the software. </p>
      <p>Apple has been changing platforms and APIs happily, and has been dumping the responsibility to "make their apps compatible" with the new system, again and again. And even more surprisingly, users happily keep upgrade prices even if the sole purpose of the upgrade is to make the software run on the new system. </p>
      <p>I would like to hear your opinion on that: </p>
      <p>As far as I can tell, an average Windows user, when upgrading from Windows 2000 to XP or from XP to Vista or from Vista to Windows 7 just "expects their existing programs to work". And if lots of applications fail to make a transition smoothly (as was the case with the XP-to-Vista transition), people blame Microsoft much more than the app developers. </p>
      <p>(For example, I can still run FontLab 3.0 made in 1998 on Windows 7, and it runs fast and stable.) </p>
      <p>An average Mac OS X user upgrades the OS and if some of the apps don't work, he typically blames the app developer. I mean, I've switched to Mac OS X from Windows about two years ago, and I'm quite happy with the OS — but I was always bothered that lots of software applications don't work after the transition. It seems that Apple is much more happily adding and removing new APIs in a kind of a ghost chase. Or perhaps Apple has just figured out a better way to get the money flowing continuously, both to them and to the 3rd party developers? "Keep the user paying again and again" — that indeed is not a bad strategy. </p>
      <p>Am I right in my estimation, and if so, why do you think that is? </p>
      <p>Cheers,<br>
      Adam</p>
