      <p>First, I would say that a product that has been on the market for as long as yours should be bug free. Being bug free seems to be an obligation supplier has to customer.  Five years is enough time to make it bug free on the Mac as well as on the PC. Since you are obviously aware that your Mac customers suffer from bugs more than your PC customers. I don't see you offering to reimburse your Mac customers half price because your Mac product is only half as good as your PC product.</p>
      <p>It is your obligation to hire capable Mac programmers. I don't know why you can't manage to do this unless it is not a priority for you. You should value all of your customers equally.</p>
      <p>So back to your question, Yuri, fix the bugs first but don't do it in the dated and useless programming environment. I would rather see a bug free FontLab out quickly than a new version filled with new features that is still laden with bugs. A smooth running problem free Volkswagen on the highway is far better than a 600 horsepower Jaguar sitting in the shop constantly needing repairs.</p>
      <p>&gt;&gt;&gt;</p>
      <p>"A huge number of the bugs found in FontLab Studio 5 for Mac is absent from the Windows version, ...This will allow us to build universal binaries, and will for certain get rid of a large number of bugs."</p>
      <p>Thank you, Adam for this honesty. A great deal of my frustration with FontLab comes from the company's silence. An open dialogue goes a long way in helping customers see it from your perspective. Silence and ambiguity gives the appearance of not caring.  It is too bad your explanation took so long to be made public. I am usually a very easy-going person who is very slow to anger but being left in the dark about issues but only getting explanations like "it is a known bug" and having years go by without correction builds up to a point of severe frustration in me (and seemingly to others as well).</p>
      <p>I apologize for my less than gentlemanly tone but still stand by my expectation of a bug-free product in a timely manner.</p>
