      <p>The problem is some of those things I've avoided doing so long I don't remember any more what they were. They've just become ingrained.</p>
      <p>One thing I do do that I think avoids a lot of major nastiness: If I'm working on a path and it suddenly does something unexpected, I immediately undo, select the entire path, cut it, then paste it again. And save. Something about the way a path is represented in memory seems to make it vulnerable to getting scrambled sometimes. Cutting and pasting a path seems to sort it out again. At least that's my working model. I have no idea what's actually going on.</p>
      <p>Another thing I do is always save if I am running a Python script, especially one that I've written myself. This is my most common source of FontLab crashes.</p>
      <p>I've had some crashiness with generating Mac font suitcases, but thankfully there's not much need for them anymore.</p>
