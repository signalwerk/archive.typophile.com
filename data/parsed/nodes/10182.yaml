    html: <p>I disagree about Caslon, because it seems to me only the A and C have any sort of Caslon similarity -- the other letters are much more like a classic Roman titling type. (My copy of the FontBook is not handy, or I might suggest a few similar ones.) <br> <br>FWIW, AMICA is listed as a client of Font Bureau, although this typeface doesn't resemble any FB styles I have seen.</p>
