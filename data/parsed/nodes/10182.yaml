    html: '<p>Went out and bought the magazine today. Here is a scan from one of the pages. I am almost sure now it is the custom work by FontBureau Mike and Mark mentioned. It is a beautiful and exquisite face in my opinion. <br> <br>The other FontBureau typefaces used in the magazine: FB Agenda Light and FB Agenda Regular (for captions and short paragraphs), FB Giza Seven Five (from what I can tell) for some of the titles. <br> <br>Can anyone provide a scan of the NY Times version of the font? <br> <br><img src="http://www.typophile.com/forums/messages/83/69155.gif" alt="2"></p>'
