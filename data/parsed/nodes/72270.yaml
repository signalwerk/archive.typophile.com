    date_raw: 25 Jul 2010 — 5:31am
    votes: null
    html: |-
      <p>Matthew, </p>
      <p>The crossbar of /t/ is generally lower than x-height and is related to the crossbar of /f/, so I changed the /f/ accordingly.<br>
      Though the relationship is very design-specific. In New Baskerville /f/'s crossbar is lower than /t/'s, whereas New Century SchoolBook, and didone typefaces share the same height. This is also dependant on hook of /f/.</p>
    html_clean: |-
