      <p>Hi!<br>
      I think is coming great, congrats.</p>
      <p>Things I see:<br>
      - the leg of "k", "K" and "R" could be a problem whem printing, it could generate a lot of black.<br>
      - final tail stroke in the "g" doesn't match very well with the sistem you are trying to acomplish. It shouldn't be so pointy, perhaps something more like your "j"<br>
      - "s" kind of heavy<br>
      - "A" is thin and the middle stroke is too low<br>
      - "G" and "U" is too wide (compare the white space with the other letters<br>
      -  Lining numbers are kind of boldish</p>
      <p>Keep up the good work<br>
      Regards.</p>
