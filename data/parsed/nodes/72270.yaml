      <p>this is really nice. it's got a great texture to it.<br>
      enough punch to give it character yet not too dazzling.</p>
      <p>I'd either make make the opening of the /g/ descender larger or just close it up, not sure how much of a difference keeping it that small would make around 9pt. Perhaps same with the open /k/ join.</p>
      <p>The /y/ descender is great. I love the subtle curve it has. Interesting /U/ as well. Definitely keep working on this.</p>
