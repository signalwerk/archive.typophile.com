    <p>Dear typophiles,</p>
    <p>I'm working on a text face mainly intended for magazines.<br>
    It's a low-contrast wedge-serif. My aim is good legibility at small sizes (9pt).</p>
    <p>Looking forward for your valuable feedback.</p>
    <p>Also I have some problems with hinting, letters start to wobble on screen in 400% zoom.<br>
    I did some manual hinting on top of autohinting(opentype) and it got better.</p><div class="imageWrap"><img src="http://typophile.com/files/wob2_6381.png"></div><p></p>
