    html: <p>Hello Petro <br> <br>Mr Brighurst (in his "The Elements of Typographic Style") implies a use of very common acronyms as dotless with loose kerning and small caps. In your case of cource you don't need sc, but half space between the letters would do your job and look better (i think). <br> <br>christos <br> <br>p.s. if you are going to use dots it is for sure wrong not to use all of them.  <br>It will be like United States of A.</p>
