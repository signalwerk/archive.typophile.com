  html: <p>I am pretty much done with this logo, and I didn't have a lot of leeway with it (couldn't really modify the bear since this is originally a Chinese org).  But I am wondering if you all think I need to have a period after the A in USA?  It looks wonky if I put one there.  My other idea was to use circles in place of periods, then I think that makes this less 'agrammatical' <br> <br>thoughts? <br> <br><img src="http://www.typophile.com/forums/messages/29/35366.gif" alt=""></p>
