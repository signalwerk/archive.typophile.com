      <p>Another aspect is that many shop signs must function during day and night. The project might address how different kinds of lighting (i.e. warm, soft lighting vs. neon) give different impressions of a company. In that sense, certain types of lighting could be "errors".</p>
      <p>Durability in various weather conditions and over time, how colors reflect and change over time of day, dimensionality.. lots of factors are fairly unique to store sign design and could be addressed, although those are more on the construction side of design...something designers often lose touch with by looking at a monitor.</p>
      <p>penn, you reminded me of a billboard I saw over thanksgiving holiday. It had a few sentences (!) and I have no idea what it was about, but the one part I caught was, "It's not to late to educate." I wanted to go back and read the rest to see if it was on purpose, but the next u-turn/exit was several miles away.</p>
