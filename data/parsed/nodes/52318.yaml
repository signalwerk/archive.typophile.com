    <p>Hi typophiles.</p>
    <p>I am doing a school project on bad shop signage, and that is a huge area, since almost every shop sign is terribly designed (At least i southeast London where I live).</p>
    <p>I have been collection research material in the form of photographs of several hundreds of signs, which I have analyze.<br>
    I have created a list of certain errors that are often seen in shop signs. I have my own thoughts on why the errors are errors, but I am sure that you guys know so much more about typography than me. </p>
    <p>The list is as follows:</p>
    <p>Use of capital letters only</p>
    <p>Use of 2 or more contrasting colors - Red, blue, green, yellow</p>
    <p>Warping effects - you know those wavy effects etc.</p>
    <p>Use of clipart</p>
    <p>Use of shadow effect, outline/stroke effect, and diagonal effects</p>
    <p>Compressed texts</p>
    <p>Several typefaces</p>
    <p>Wrong letter spacing/word spacing</p>
    <p>Maybe you can contribute to an explanation of why these errors are actual errors. I know the obvious reasons but maybe<br>
    you guys have a different take on it? I am waiting in excitement :-)</p>
