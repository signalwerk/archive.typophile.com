    html: "<p>Something else I probably should have brought up: seriously consider the possibility that some shop owners and signmakers know that their signs are crap, and make them that way on purpose. In a working-class neighborhood putting up a great sign might make a business seem haughty or expensive. Similar things happen in advertising: rock bands pay designers to give them the ”authentic” look of the indie music scene, government contractors and discount stores demand that their advertising look cheap to convince people that the money is really being spent elsewhere, etc.. You might try asking shop owners if they’re just trying to fit in.</p>"
