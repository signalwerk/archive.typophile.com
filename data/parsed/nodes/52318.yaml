      <p>“Unfortunately, the average customer lacks all of these skills and buys solely on price.</p>
      <p>What is the answer?”</p>
      <p>Zoning regulations. When I was in Alaska I went through Ketchikan, a Klondike gold-rush era town turned tourist trap. Zoning laws require all signage to be hand—painted in historically accurate styles. It sounds cheesy, but it looked a hell of a lot better than  many contemporary urban streets. I’ve been through a town with similar requirements in West Virginia—as soon as you drive into the city limits everything, even the porno store, has a sign that looks like something John Downer painted. </p>
      <p>If stick on letters, backlit plastic, and vinyl banners were all banned it would dramatically enhance the aesthetics of our world.</p>
