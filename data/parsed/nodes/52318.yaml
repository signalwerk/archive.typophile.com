      <p>Once upon a time... Not to wax too nostalgic on how it was "always better in the old days", but Once upon a time signs were made by people who had trained for many years to learn the skills of painting signs, and when they weren't designed by the sign painters themselves, they were designed by professional designers. There was no other way, unless you were going to make the sign yourself. Then along came desktop publishing and vinyl plotters,and anyone who could afford the equipment could become a "sign maker." people with absolutely no graphics background at all could get work by charging less than they guy down the street who knew what he was doing. </p>
      <p>@ james: Graphic design is communcation. A Crazy "Joe's Discount Carpet" sign is going to look different from an up-scale Presian rug store's sign, and if Crazy Joe's sign is a little loud and crass, that would be appropriate,, and wouldn't necessarily entail bad or artless design.</p>
