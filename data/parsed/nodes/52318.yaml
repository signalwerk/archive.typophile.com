      <p>Hi </p>
      <p>Your project sounds like areally good one to work on and with so many awful signs out there, you have the subject matter to make it great.</p>
      <p>I'm sure that much of the horror we see in our streets is a result of signage not being in anyones budget, resulting in 'expensive' designers being cut out of the equation ( a false economy).</p>
      <p>Many signwriters I've come into contact with just don't have any care for the personality, or era a font has come from, resulting in horrible clashes of typefaces seen in the examples above. If I were you, I'd grab a copy of 'The Elements of Typographic Style' by Robert Bringhurst. This has some brilliant advice on matching fonts and will allow you to critique the BAD signage.</p>
      <p>As with logo design, there should always be clearspace around the lettering of your signage. In my experience, this is what can make even a fairly good sign look awful. The examples above illustrate this perfectly, with the signs being cropped just inches after the type. Everything is cramped and probably due to the fact that if they've paid for something that size, they want something on every square cm! Again a false economy.</p>
