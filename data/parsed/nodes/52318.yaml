      <p>Even taking the client out of the equation, sign design is different from any other type of design. There are limits imposed by factors unrelated to any other graphic form. Time (the time it takes the viewer to understand your message verses the time it takes for them to pass your sign and no longer care) and distance (does the whole sign turn into an artistic blur from any distance) are factors. The worst negative design factors are clutter, a lack of negative space, too much info and incorrect font choices. Proper typography is important, but only insofar as it relates to getting the message across.</p>
      <p>As for all signs being made by true sign writers (these artists are not the same as sign painters), it might work in Alaska, probably not anywhere else. And, please, save me from the deathly combination of an architect and a designer. Batman never faced such villains as this dastardly duo.</p>
