      <p>Reference your image IMG_8100, O'Crea's Cash &amp; Carry. The letters are ok on the awning, even with--maybe because of the vertical rhythm of--the rectangular primes instead of typographically correct apostrophes.<br>
      So two expressions of a single idea. Signs are not typography. Formally they are the visual distribution, patterns, of shapes, some of which may be letters and numerals. Such signs involving letters and other standardized symbols representing language, work between two extremes; the largest number of ideas within the smallest possible space vs. the single idea in the largest possible space. Letters possess "shapeness" and "symbolness"--here I wish I wrote in German. When many ideas are presented in the smallest possible space, then attention to the graphic properties of the shapes must give way to the visual rules of writing, instead of exploiting the grammar of shape, attribute, and context.<br>
      Seen from a typo-aesthetic point of view, the problem  with such signs as you have shown is the over abundance of "shapeness" and not enough attention to the niceties of polite visual discourse. From a socio-economic perspective, that of the proprietors, the visual form of the signs is determined by the desperation/aspiration by which they are driven. The need of the proprietors to survive and succeed doesn't allow them the luxury of aesthetic detachment. As Albertine Gaur says, "If all writing is information storage, then all writing is of equal value. Each society stores the information essential to its survival …. If a form of information storage fulfils its purpose as far as a particular society is concerned then it is (for this particular society) 'proper' writing."</p>
