      <p>What makes bad signage bad? There are many variables, including the fundamentals of design, rules of typography, etc, but it also depends on the people. What is aesthetically pleasing to one may not be to another. Additionally, this variance applies to different cultures as well.</p>
      <p>For example, in my country, what is aesthetically pleasing for the traditional mindset is that negative space should be filled. Obviously, this is an eyesore, as there is not enough space for the letterforms to breathe. Case in point, the Philippines didn't have a typographic history like the west had, and was colonized before it could even develop its own national identity, thus restricting any native cultural developments. However, since the colonizer was a European country, Spain, there was an influence of western aesthetics. But the treatment of Spaniards towards Filipinos was very condescending, and thus they generally would not teach Filipinos what they know in typography and design, so the Filipinos would resort to imitating their colonizer, which is actually a quite bad way to learn, if left unguided. Thus, different views and takes on typography and design emerged in the Filipinos' consciousness, which would lead and shape the current design aesthetics we have today.</p>
      <p>Then, there's the Americans, but this post would become too long and I think you get the point. If any of you guys find this offensive, I'm sorry. I was just citing history and trying to speculate how a culture's take on design came to be.</p>
      <p>The shaping of good signage (or design, generally) might first depend on the culture that shaped and continuously shapes it. Through this, though, we encounter contradictions with the purpose of communication on some levels, like typography (illegible, overstuffed signs, etc), but what the people find aesthetically pleasing might be contradictory to foreign eyes. Even if cognitive psychology comes in and discovers which is good signage or bad, it is the people's cultural preference that might come first.</p>
      <p>I know that some of you are thinking that there is a union: a marriage of cultural differences and design concepts backed by psychology, history, and tradition which need not contradict, which lies in good, well-researched design. And indeed there is.</p>
