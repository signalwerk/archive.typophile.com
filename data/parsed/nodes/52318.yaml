      <p><cite>Are we saying that signage is not much different from any other rules in design?<cite></cite></cite></p>
      <p>To a certain extent, I think so. The basic principles of design apply to signs just like everything else.</p>
      <p><cite>If so, why focus on signage?</cite></p>
      <p>Because so much of it is just abominably bad. And because when an abominable sign goes up, people get stuck looking at it. There’s really no reason for me to care about the poor design in, say, a magazine about pro-wrestling, because I’ll never see it anyway. But I think many people get sick of otherwise gorgeous old urban neighborhoods covered with signs that look like the work of a myopic, colorblind, illiterate lunatic.</p>
