    html: |-
      <p>I don’t see many examples in your photos, but what’s really been bugging me lately are designers who think they’re doing a great job by using a really great book face for signage. A book face that works at ten points looks as chunky as Cooper Black when it’s three feet tall. Anyway…</p>
      <p><em>Use of capital letters only</em></p>
      <p>Not necessarily bad if the type is well-chosen and tracked appropriately. Unfortunately most signshops use the blackest faces around and track them like it’s 1979.</p>
      <p><em>Use of 2 or more contrasting colors - Red, blue, green, yellow</em></p>
      <p>This one tends to look really tacky because the intense colors call attention to cheap materials and poor workmanship.</p>
      <p><em>Warping effects…Use of clipart…effects</em></p>
      <p>Blatant evidence of cutting corners. Why pay someone to think when the letters can wave with a mouseclick?</p>
      <p><em>Compressed texts</em></p>
      <p>Bad because they’re always used in all caps and set too tight, turning them into a block of vertical lines.</p>
      <p><em>Several typefaces</em></p>
      <p>This is another trick used to cut corners. Don’t be creative, just let the fonts do the work!</p>
      <p><em>Wrong letter spacing/word spacing</em></p>
      <p>Impairs readability and looks like someone wasn’t really thinking about the work.</p>
      <p>And as for who makes the signs, just watch job listings for these positions. You’ll see plenty of software experience requirements, and none even ask for a strong portfolio.</p>
