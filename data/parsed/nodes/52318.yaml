    html: <p>One important issue that hasn't been brought up, and I think that Zapf's point about the size of signs relates to, is the relation of the signs to the architecture and the 'streetscape'. Here in the US, you often have signs each trying to be bigger than the other, and the overall effect is chaotic and ugly. That is what argues for regulation on size, materials, etc. But how to do this best is something I don't know. It would be very interesting to see the effect of different regulations on different streetscapes. Perhaps there are books about this.</p>
