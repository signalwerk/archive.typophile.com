      This sign is cramped also, with none of the typography conforming to any sort of grid. Poor hierarchy and placement take the viewers eye to the centre first, then to the left and down. 'Stationery' is spelled incorrectly, unless they mean that their fancy goods and bedding literally stand still. This becomes a good selling point if it is true.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Funny_4319.jpg"></div><br>
