      <p>There are different rules to designing signs, and yes, size and spacing relative to intended viewing distance and speed is among the considerations, and usually the most significant factor, but:</p>
      <p>There are also often arbitrary restrictions on size and style imposed by local ordinances.</p>
      <p>Sometimes, the design is limited by the space available in an existing frame that might have fit the name of the original business well but is an awkward proportion for a new tenant, as demonstrated in some of the examples already shown.</p>
      <p>There is also a tendency of clients to demand too much information be included on a sign (also demonstrated above).<br>
      How much information can and should be in a sign is related to its size and placement. A small sign on a door can have much more information than a large sign at the roof line, since it is meant to be read by someone walking up close to it rather than be noticed and identified by someone driving by.</p>
