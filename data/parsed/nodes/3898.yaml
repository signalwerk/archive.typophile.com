    html: <p>The excellent book <i>Typo</i> Friedl, Ott and Stein is a generously-sized encyclopaedia in French, English and German parallel text. Also available is Huib van Krimpen and Rob van de Elzen's <i>Grafischzakboek</i> with main text in Dutch and terms/headings translated into English, German, Italian and Spanish. Neither of these may be exactly what you want, but they may prove helpful, and both are very fine books.</p>
