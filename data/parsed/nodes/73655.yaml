    html: |-
      <p>You could change the colour by changing the rhythm of the verticals.<br>
      The important ratio is the vertical strokes in "i_n".<br>
      Either they are even, or the space inside n is larger/smaller than the space between glyphs.<br>
      So compare yours to the "classic" and do otherwise.<br>
      (Note this difference between Adobe Caslon and Caslon Old Face.)<br>
      You could also change x-height and cap height relative to ascenders.</p>
