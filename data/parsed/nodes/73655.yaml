    html: <p>I don't see a problem here, as they are quite different in the details. I think you could make it even sharper in the details. I like it. There are a lot of oldstyle serifs around, but I think a more modern sharp interpretation does fill a gap, as far as I know. Lots of typefaces look simular when set in small sizes, but are quite different when looking at the details. I think the image above does not give a correct picture of how it will look in hires print, as the details (and thus the differences) will be much more visible.</p>
