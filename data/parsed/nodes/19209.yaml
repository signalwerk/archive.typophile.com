    html: |-
      <p>The TeX, publisher and Mellel comments cracked me up :)</p>
      <p>I’m actually on again with the Quark beta for typesetting parts as they didn’t sleep-in. For Photoshop I’m using Cinepaint since some months now as Photshop’s wimpy 16-Bit support doesn’t quite cut it with real color correction, especially when you need to do the work on 32-Bit float images or higher, like bringing down HDRI files.</p>
      <p>I basically only use photoshop to add type to the final images, or to do title plates to integrate with Cinepaint or Final Cut.</p>
      <p>I tried Inkscape and quickly got bored. Xara seems to have topped Illustrator a while ago, but spending a day installing it? naah!</p>
      <p>@ Miguel: I got in late with X on production machines since virtually nothing was there, but with the Intel machines I only have very few apps that I need that aren’t ported yet. I’m actually looking forward to be running my X11 apps in virtualization mode.</p>
      <p>So until Xara has something installable out I’ll stick with Illustrator. Photoshop might be still around for backwards compatibility with my archives. Pages is becoming more powerful with each update, I’m doing all of my letters and invoices with it now. Might be a real layout app soon. </p>
      <p>Also I’m wondering if Adobe has a huge interest in Mac native versions anymore since virtualization and bootcamp. They were having a hard time with OS-X right from the start so that’ll be interesting to watch.</p>
      <p>Production machines, Aether? Did you actually work on a new iMac yet? I was very surprised how well it handles HD content, didn’t try film res yet on one of those.</p>
