    <p>Since Adobe needs 2 years where everybody else only needed one year to convert their apps to Universal I’m wondering how many of you are waiting that long and how many are ditching Adobe.</p>
    <p>For my 2¢ I’m less and less dependent on Adobe with each job. So it’s rather unlikely that I’ll hold my breath. How about you?</p>
    <p>can someone turn this into a poll somehow? I don’t see that option here.</p>
