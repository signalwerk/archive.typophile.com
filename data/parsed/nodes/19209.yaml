      <p>This is “hammer” syndrome stuff—give a kid a hammer there will suddenly be nails all over the house just begging to be banged back into the floor boards.<br>
      Remember that every machine and application that you buy is already obsolete because the successor is under development. To date no software development schedule has ever  led to having any of my jobs cancelled or delayed. So I just don’t worry about what’s coming when. It is not the platform or application that determines the result. It is the interface of task and user. One just does the job with what one has. When the tool is no longer capable of the task, then I look for new stuff. Oh yes, I also make it a principle to never buy a new car.</p>
