    <p>Hi, everyone I´m new to this site<br>
    I have begun working on a proyect to promote tourism to certain parts of the world : London, Paris, and New York.<br>
    To this point I´m happy with the typographical approach we achieved with Paris and London, but I´m not happy with New York.</p>
    <p>Can anyone help suggesting typography that would relate to New York city life?</p>
    <p>Thanks</p>
