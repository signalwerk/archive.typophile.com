    html: |-
      <p>Tironian sign is completely new to me too, the unicode is a land to discover,<br>
      i choose to work with "Et tu, Brute?"<br>
      "The investigation of the history of  ‘printing types’, for example, leads us to a series of interconnecting facts" is forming a base for my informative publication</p>
      <p>because we deal with the "middle eastern" version of the brief;<br>
      we have to adapt english and arabic type- interesting and challenging.<br>
      if we are to include 1500 words, 750 latin and 750 arabic.</p>
      <p>my subject basically the derivation of modern arabic type, through few phases.<br>
      there was proposals to latinize arabic type because of printing difficulties;<br>
      arabic being cursive and letters are almost always connected<br>
      to the phase were printing technology could keep the spirit of arabic script,<br>
      and be able to print it seamlessly.<br>
      and finally the conversation between the latin world and arab world needed a good<br>
      latin arabic adaptation typefaces in order to make bilingual designs look harmonious.</p>
      <p>an eye-opening experience. i eat/drink/see/sense type all day because of this project.</p>
