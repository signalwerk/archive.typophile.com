    html: |-
      <p>Hi Claire. 'Classic' does not necessarily have a very good definition anymore, within or without the type world. At its core, classic denotes timelessness, or being of a quality by which all subsequent works are measured. If something were produced today that fit those standards, it may then be considered a 'modern classic,' but this term itself is as you point out kind of silly because of its paradoxical nature and general overuse (and misuse).<br>
      To further complicate the issue, pair that with typographic classification systems that use the same or similar words—<em>classical</em> describing the renaissance &amp; post-renaissance Roman types, <em>modern</em> describing romantic faces such as Bodoni's and Didot's, <em>modern</em> describing a high-contrast Scotch Roman as seen in faces such as <a href="http://new.myfonts.com/fonts/bitstream/de-vinne/" rel="nofollow">De Vinne</a>, <em>modern</em> describing futurist types such as Futura, <em>modern</em> describing any types that coincided with the artistic movement called 'modernism,' and <em>modern</em> describing anything done recently.</p>
