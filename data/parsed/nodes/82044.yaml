  html: <p>so i have been hearing recently from people call fonts modern classic and i'm confused. isn't the term classic for old things like Bodoni. also can something be modern and classic at the same time, could you explain please. when does a modern thing become classic and is it correct to call something created in the year 2011 a classic? thank you very much!</p>
