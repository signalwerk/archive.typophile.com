    html: <p>My standards may be (and likely will be) different from y'alls' in that I consider a classic (<em>n.</em>) to be something man-made that can and/or has survived virtually unchanged for a period of time while affecting things around them. Okay, that's a right broad stroke, but that's the essence of it. The Speccy, the Commie, the Beeb; I see them as classics among home computers. Others would no doubt want to add Vicky and the Apple 2 to their list. /* Sinclair ZX Spectrum, Commodore 64 and Acorn's BBC Computer. Commodore VIC 20. */</p>
