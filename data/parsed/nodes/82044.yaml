      <p>There is a distinction between classic as noun and adjective.<br>
      A new typeface can be classic, in the sense that it adopts a venerable style, but it can never be <em>a</em> classic until a suitable period of time has elapsed.</p>
      <p>With music, classics are works that have been interpreted many times, over time. Perhaps the same meaning can be applied to typefaces.</p>
