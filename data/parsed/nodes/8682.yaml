    html: "<p>As a last resort you can always use the Character Palette to insert special characters on a Mac. Go to System Preferences: International, choose the Input Menu pane and check the Character Palette box. Then you can 'Show Character Palette' from the little keyboard menu on the right of the menu bar. If you pull the palette's View menu down to Unicode, you can browse the entire unicode space. Double-click on a character to 'type' it. <br> <br>(Of course this will only work if the app you're using is vaguely Unicode-savvy. Works well in TextEdit, for example.)</p>"
    html_clean: "<p>As a last resort you can always use the Character Palette to insert special characters on a Mac. Go to System Preferences: International, choose the Input Menu pane and check the Character Palette box. Then you can 'Show Character Palette' from the little keyboard menu on the right of the menu bar. If you pull the palette's View menu down to Unicode, you can browse the entire unicode space. Double-click on a character to 'type' it. <br> <br>(Of course this will only work if the app you're using is vaguely Unicode-savvy. Works well in TextEdit, for example.)</p>"
