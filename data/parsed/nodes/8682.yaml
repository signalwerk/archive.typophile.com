    html: <p>Hi Adam <br> <br>I am using FontLab on a Mac. I have a set of 10 symbols I want to add to my font. To make things easy I would place these symbols on existing characters but the problem is that there are no open spaces left (the font is completely Unicode). <br> <br>What's the best way to add these symbols? <br> <br>Thanks.</p>
    html_clean: <p>Hi Adam <br> <br>I am using FontLab on a Mac. I have a set of 10 symbols I want to add to my font. To make things easy I would place these symbols on existing characters but the problem is that there are no open spaces left (the font is completely Unicode). <br> <br>What's the best way to add these symbols? <br> <br>Thanks.</p>
  - id: 56987
    user: null
    date: null
    date_raw: null
    votes: null
    html: '<p>Nicolas,  <br> <br>what do you mean by "no open spaces left"? Unicode has really *plenty* of space!  <br> <br>There are existing Unicode codepoints for miscellaneous arrows:  <br><a href="http://www.unicode.org/charts/PDF/U2190.pdf" target="_blank">http://www.unicode.org/charts/PDF/U2190.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U27F0.pdf" target="_blank">http://www.unicode.org/charts/PDF/U27F0.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U2900.pdf" target="_blank">http://www.unicode.org/charts/PDF/U2900.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U2B00.pdf" target="_blank">http://www.unicode.org/charts/PDF/U2B00.pdf</a> <br> <br>There are also other graphical symbols that are already encoded:  <br><a href="http://www.unicode.org/charts/PDF/U2300.pdf" target="_blank">http://www.unicode.org/charts/PDF/U2300.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U2500.pdf" target="_blank">http://www.unicode.org/charts/PDF/U2500.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U2580.pdf" target="_blank">http://www.unicode.org/charts/PDF/U2580.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U25A0.pdf" target="_blank">http://www.unicode.org/charts/PDF/U25A0.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U2600.pdf" target="_blank">http://www.unicode.org/charts/PDF/U2600.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U2700.pdf" target="_blank">http://www.unicode.org/charts/PDF/U2700.pdf</a> <br> <br>If the symbols that you are planning to add are similar to those encoded, use the existing assigned codepoints. If you want to add symbols that are not similar to any of the encoded symbols, you should encode them in the Private Use Area, where you can freely assign the codepoints:  <br><a href="http://www.unicode.org/charts/PDF/UE000.pdf" target="_blank">http://www.unicode.org/charts/PDF/UE000.pdf</a> <br> <br>Regards,  <br>Adam</p>'
    html_clean: '<p>Nicolas,  <br> <br>what do you mean by "no open spaces left"? Unicode has really *plenty* of space!  <br> <br>There are existing Unicode codepoints for miscellaneous arrows:  <br><a href="http://www.unicode.org/charts/PDF/U2190.pdf" target="_blank" class="link-external">http://www.unicode.org/charts/PDF/U2190.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U27F0.pdf" target="_blank" class="link-external">http://www.unicode.org/charts/PDF/U27F0.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U2900.pdf" target="_blank" class="link-external">http://www.unicode.org/charts/PDF/U2900.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U2B00.pdf" target="_blank" class="link-external">http://www.unicode.org/charts/PDF/U2B00.pdf</a> <br> <br>There are also other graphical symbols that are already encoded:  <br><a href="http://www.unicode.org/charts/PDF/U2300.pdf" target="_blank" class="link-external">http://www.unicode.org/charts/PDF/U2300.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U2500.pdf" target="_blank" class="link-external">http://www.unicode.org/charts/PDF/U2500.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U2580.pdf" target="_blank" class="link-external">http://www.unicode.org/charts/PDF/U2580.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U25A0.pdf" target="_blank" class="link-external">http://www.unicode.org/charts/PDF/U25A0.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U2600.pdf" target="_blank" class="link-external">http://www.unicode.org/charts/PDF/U2600.pdf</a> <br><a href="http://www.unicode.org/charts/PDF/U2700.pdf" target="_blank" class="link-external">http://www.unicode.org/charts/PDF/U2700.pdf</a> <br> <br>If the symbols that you are planning to add are similar to those encoded, use the existing assigned codepoints. If you want to add symbols that are not similar to any of the encoded symbols, you should encode them in the Private Use Area, where you can freely assign the codepoints:  <br><a href="http://www.unicode.org/charts/PDF/UE000.pdf" target="_blank" class="link-external">http://www.unicode.org/charts/PDF/UE000.pdf</a> <br> <br>Regards,  <br>Adam</p>'
