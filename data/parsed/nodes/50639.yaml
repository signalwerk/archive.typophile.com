  html: |-
    <p>Hello Typophiles,</p>
    <p>I have produced a limited edition screen print.<br>
    It's metallic gold lettering on Plike, a luxurious black paper.</p>
    <p>I have a big site update planned in the next month at<br>
    <a href="http://www.seblester.co.uk" title="www.seblester.co.uk">www.seblester.co.uk</a>, with lots of new work, but wanted<br>
    to give Typophiles a preview of this piece.</p>
    <p>Please contact me via my site for pricing and availability.</p>
    <p>Thanks,</p>
    <p>Seb</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Mightier_3676.jpg"></div><p></p>
