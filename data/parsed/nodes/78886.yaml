      <p>What are the locations supposed to indicate? </p>
      <p>I can’t figure out what would lead one to associate Frankfurt, Germany, with Interstate and Tobias Frere-Jones, for instance. </p>
      <p>You should be more specific about something like “Century.” There are several members of the Century family. M.F. Benton designed many, but his father Linn Boyd Benton designed the original Century Roman upon which all the others are based, more or less.</p>
