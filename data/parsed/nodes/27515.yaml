      <p>That's very, very close! Of the Interstate family, I'd say that Interstate Regular Compressed is the closest. </p>
      <p>The type on the street signs actually differs from the font in some very small details. It makes me wonder whether the sign typeface predates the release of Interstate, and thus represents a slight ancestor. Close enough for me. Many thanks.</p>
