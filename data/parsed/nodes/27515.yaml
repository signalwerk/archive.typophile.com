    date: 2009-10-05T08:21:00
    date_raw: 5 Oct 2009 — 8:21am
    votes: null
    html: <p>Actually they are probably still in Highway Gothic which was created in 1949 for the Federal Highway Administration. Tobias Frere-Jones used Highway Gothic as inspiration for Interstate. Albeit his typeface is much more successful and legible than Highway Gothic. Highway Gothic is being phased out by Clearview, but you could not mistake one for the other because the l in Clearview has a distinct curved terminal.</p>
