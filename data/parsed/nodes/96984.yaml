    <p>Hello,<br>
    I am new to this forum and hope you can help me: I am looking for the font that the Wall Street Journal Magazine uses for headlines and Sub-headlines. I already found out that they use Phaistos for some headlines and Verlag for body text. But I could never find the name of the third font they use. Here is a photo of a title page that uses it:<br>
    <a href="http://www.theentertainmentlifestyle.com/2011/10/david-beckham-suits-up-on-wsj-magazine.html" title="http://www.theentertainmentlifestyle.com/2011/10/david-beckham-suits-up-on-wsj-magazine.html">http://www.theentertainmentlifestyle.com/2011/10/david-beckham-suits-up-...</a></p>
    <p>I also attach a rates/specs list that can be downloaded at their Media site. </p>
    <p>Note that it is the WSJ-Magazine, not the Journal itself.</p>
    <p>Thanks a lot in advance!<br>
    Best<br>
    Theo</p>
