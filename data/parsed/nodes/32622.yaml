  - id: 193694
    user: 2289
    date: 2007-03-28T23:24:00
    date_raw: 28.Mar.2007 11.24pm
    votes: null
    html: |-
      <p>Assuming the shoe shape is an enclosed line, copy from illustrator and paste into photoshop, first as a path and then again as pixels, so you now have a layer with the shoe illustration and a background layer, between the two copy and paste the scanned material into a layer and create a layer mask (reveal all), go to your path drop down menu and using the option in the top right create a selection from the path, then inverse the selection and fill with black. If you need to move the material scan remember to unlink the scan layer and the layer mask.</p>
      <p>There are many ways of doing this, depending on the final use, for example, I would also consider doing it as Mili suggests except making your duplicate illustrator path a compound path and then placing your material scan behind the path, select both and make clipping mask.</p>
      <p>Tim</p>
    html_clean: |-
      <p>Assuming the shoe shape is an enclosed line, copy from illustrator and paste into photoshop, first as a path and then again as pixels, so you now have a layer with the shoe illustration and a background layer, between the two copy and paste the scanned material into a layer and create a layer mask (reveal all), go to your path drop down menu and using the option in the top right create a selection from the path, then inverse the selection and fill with black. If you need to move the material scan remember to unlink the scan layer and the layer mask.</p>
      <p>There are many ways of doing this, depending on the final use, for example, I would also consider doing it as Mili suggests except making your duplicate illustrator path a compound path and then placing your material scan behind the path, select both and make clipping mask.</p>
      <p>Tim</p>
