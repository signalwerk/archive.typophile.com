      <p><em>the easy and real way</em> – really not necessarily (nor likely to be) the same thing at all. RTFM Miss G! or failing that get a book like ’Real World Photoshop’ to learn from...</p>
      <p>Which technique you employ for this depends very much on your intended outcome;<br>
      1. if you want the material to appear as a flat shape delineated by the outline of a shoe, then Illustrator.<br>
      2. if you want the material to appear as if it follows the contours of a shoe in three dimensions, then Photoshop.</p>
      <p>As I’ve just reread your original post and it seems like 2. applies, so then a fair amount of layer-masking, adjustment layers and freehand addition of shadows and highlights will be inevitable if you want to achieve a realistic effect. </p>
      <p>I notice that no-one else here says you should be working with anti-aliased or feathered selections to keep the edges soft and natural-looking, or that you should be working with different layer blending modes (shadows=multiply, highlights=screen) and opacities.</p>
