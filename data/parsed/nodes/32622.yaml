    <p>I have a problem. I have scannned in a piece of material in photoshop. I have also done an<br>
    illustration in illustrator and brought it into Photoshop but i want to fill it<br>
    with the priece of material so it will look like that the shoe is made of that material. How do I<br>
    go about it? Is it something like mask off the area outside teh shoe and something? I’d like to knw<br>
    the easy and real way. Not the ’use lasso tool and go round the shoe an ddelete every<br>
    little bit of material etc etc’. thank you. Please guide me. I really appreciate your help.<br>
    Thanks.</p>
