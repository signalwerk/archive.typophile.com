    html: |-
      <p>Join them how? Unite them? That doesn't create a single, self-intersecting path as described in the video (at 2:16). Your method does suggest a cleaner solution though.</p>
      <p>1. Create a crescent shape by overlapping two circles and Pathfinder &gt; Intersect.</p>
      <p>2. Break the sharp anchors with the scissor tool and delete the larger arc.</p>
      <p>2. Make two copies and rotate one of them 120° and the other -120°.</p>
      <p>3. Move them into position and connect the anchors with Object &gt; Path &gt; Join.</p>
      <p>4. Rotate 30°.</p>
