    html: <p>I don't think you're "going wrong" anywhere, it's simply that the Shape Builder tool doesn't get you all the way there, and you seem to basically understand what needs to be done next. Since some of the anchor points are overlapping, first move the paths away from each other, then break them apart into pieces using the scissor tool. To avoid issues with overlapping anchors, I'd suggest breaking every anchor to get nine short paths. Use those pieces to assemble the shape's three main curves with smooth joins, then move those into position and reconnect the corner joins.</p>
