  html: |-
    <p>The new version of DTL OTMaster supports the new COLR and CPAL tables deﬁned by Microsoft.<br>
    &nbsp;<br>
    First there is a new color glyph viewer:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OTM3_CLR_1_5859.gif"></div><br>
    &nbsp;<br>
    The Color Viewer shows all the glyphs in deﬁned in the COLR table. One can display the<br>
    complete glyphs as well as the individual layers. <p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OTM3_CLR_2_5145.gif"></div><br>
    &nbsp;<br>
    Entries in the glyph color viewer are fully editable; the palette index can be modiﬁed and individual layers can be added or deleted. <p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OTM3_CLR_3_5024.gif"></div><br>
    &nbsp;<br>
    The content of the tables will be displayed as usual as a nested list.<br>
    Below is the example for the COLR table from Microsoft’s Segoe UI Emoji font (part of Windows 8.1).<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OTM3_CLR_4_5215.gif"></div><br>
    &nbsp;<br>
    This table is editable, one can create new entries, add color glyph records or change the palette index. This allows to add colored glyphs to any font with OTM in a simple way:<p></p>
    <p>– Create the necessary glyphs with OTM’s glyph copy and editing tools<br>
    – Copy an empty COLR/CPAL table from another font<br>
    – Modify the COLR/CPAL table</p>
    <p>The glyph palette CPAL is also editable and will be shown as follows:<br>
    &nbsp;<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/OTM3_CLR_5_5086.gif"></div><p></p>
    <p>The CPAL table can be edited as usual; records can be deleted, added, copied or modiﬁed<br>
    Here is an example for adding colored glyphs:<br>
    1. Select the base glyph (in this case 71)<br>
    2. Copy it to new positions (246, 247, 248)<br>
    3. Edit the glyphs (delete selected contours)<br>
    4. Edit the COLR table<br>
    &nbsp;<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/OTM3_CLR_6_5936.gif"></div><br>
    &nbsp;<p></p>
