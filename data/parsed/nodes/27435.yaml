    html: <p>The old one is indeed stronger. The problem with the new one is that it's not simple. The broken pieces and outlines create uncessary complexity. Just as important, what do the broken pieces communicate? The old logo has more contrast, the red 'M' is eye catching, and even the typographic choices are better. Keep it simple.</p>
