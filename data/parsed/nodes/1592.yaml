    html: <p> David -- <br> <br>I'm not familiar with that particular title. I see a couple of copies available through abebooks.com.  <br> <br>You might try contacting James Mosley at the St. Bride Printing Library in London. He may be able to help you with both questions. I believe he's quite a Gill aficionado. <br> <br>-- Kent. </p>
