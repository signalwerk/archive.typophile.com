  html: |-
    <p>There used to be something in Quark called, something like, Line above/Line below. This allowed you to have a line above the first line of copy etc.</p>
    <p>Does anyone know how to do this in Indesign, the only way I can figure is to use underline but this seems a little strange because how would you get the line above a first line of copy???</p>
    <p>Can anyone help?</p>
    <p>Cheers<br>
    Steve</p>
