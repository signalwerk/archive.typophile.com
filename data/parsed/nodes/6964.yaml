  html: "<p>Ottopilot is a font that has gone through a lot of versions and I have yet to settle on something I'm happy with. I included an older version (Glampire) that was more typical of a 'Fraktur' font. (Apologies for some of the letters, including the 'z' ) You can see some of the revisions and how it has evolved. I'd appreciate any feedback on Ottopilot.  <br> <br>zoom in w/ flash <br> <br>bjh <br> <br><!---Attachment: ottopilot.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">ottopilot.swf<br><a href=\"http://www.typophile.com/forums/messages/29/ottopilot.swf\"><b>ottopilot.swf</b></a> (9 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
