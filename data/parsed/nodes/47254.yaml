    html: |-
      <p>Yes, but the EULA issue isn’t going to affect you, if what you’re doing is using it to create a logo, then delivering the logo as vector art (or other image file.) </p>
      <p>Assuming you have the rights to use the font, then you can use it to create a logo/wordmark. then you can distribute the wordmark as an image file with no licensing issues.</p>
      <p>The issue would only come into play if you’re going to do some sort of template design or similar, where you supply a use of the typeface, then each user would have to have the font licensed for themselves.</p>
      <p>Similarly, you can use the font to create an image, then alter that image in any way you like. Say, you type out “MiMo” in TNR, then convert to vector shapes, then delete some of the serifs, and distribute the image file. That is a fine use of the type.</p>
      <p>What you can’t do is open TNR in Fontlab, delete some serifs, save as a font called Times for MiMo, and distribute the font (unless the EULA allows that.)</p>
      <p>Jason C</p>
