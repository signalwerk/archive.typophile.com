    html: <p>If your question is whether you can use Times New Roman for your logo, there should be no problem; the thing to check is the End-User License Agreement (<a href="/wiki/EULA" class="wiki">EULA</a>), but there may not be a clear one if this is the version bundled with an operating system. Regardless, it is a valid use of a font to use it in a logo—otherwise, purchasing a font wouldn’t be very worthwhile. There are sometimes limitations (e.g. you may not embed the font in a PDF, you may not use it in a video game without prior permission, etc.). If your question is about something else, such as the name or appearance, that I don’t know.</p>
    html_clean: <p>If your question is whether you can use Times New Roman for your logo, there should be no problem; the thing to check is the End-User License Agreement (<a href="/wiki/EULA" class="wiki link-lost">EULA</a>), but there may not be a clear one if this is the version bundled with an operating system. Regardless, it is a valid use of a font to use it in a logo—otherwise, purchasing a font wouldn’t be very worthwhile. There are sometimes limitations (e.g. you may not embed the font in a PDF, you may not use it in a video game without prior permission, etc.). If your question is about something else, such as the name or appearance, that I don’t know.</p>
