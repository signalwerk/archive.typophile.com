  html: |-
    <p>Can anyone explain this "G"? The Tunnel Garage once stood at the corner of Broome and Thompson Streets in Soho. Built in 1922, it had an air of pride uncommon for a garage, announcing itself in grandly proportioned capitals. The letters were dignified, if a bit quaint, and I had used them many times as a wayfinding marker in the neighborhood.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/pic_5397.jpg"></div><p></p>
