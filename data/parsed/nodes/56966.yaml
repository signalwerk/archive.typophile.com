    <p>Okay, I'm sure there's a very simple answer to this, but I must ask. I'm new to FontLab and can't find answers on the web... </p>
    <p>I'm wondering how to connect two points that are on different paths. Every time I try to the program won't allow it, but will only on the same path. See attached image, I'm trying to join the two top points, and the lower 2 points. Any thoughts? <img src="/sites/default/files/old-images/B_5185.jpg"></p>
