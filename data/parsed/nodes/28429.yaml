      <p>Dear Phillipe,</p>
      <p>This is no typeface! It is lettering! Lettering by&nbsp;the&nbsp;incomparable Paul Barnes. Or maybe it is one of Barnes as yet unreleased typefaces. I can't recall what he told me about this piece. In any case, I am looking forward to his presentation at ATypI. I spoke with him last week and he is very eager to discuss his work on The Guardian. I wanted to hear more but he had to dash off to an Aston-Villa match.</p>
      <p>Unger? No way. Though Good Gerard certainly would have an entertaining story or two to tell.</p>
      <p>Sincerely,<br>
      Randolph T. Burke</p>
