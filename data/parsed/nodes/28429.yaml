      <p>Dear Stephen,</p>
      <p>I am certain that this is the work of Barnes. He is the lettering source for Saville. I just spoke with Barnes about this matter and he confirmed his hand in this matter. I tried to cajole him into posting in this forum, but he is too excited about his ATypI presentation. He said that he had done it for an art magazine and was not aware of Unger’s work until afterwards. He said he made a serif version then cut the serifs off.</p>
      <p>Sincerely,<br>
      Randolph T. Burke</p>
