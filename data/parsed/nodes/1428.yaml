    html: "<p>I prefer the mac, but it cannot compete when it comes to computer gaming. <br> <br>Anyway, they're 2 different tools. They match and mismatch in many ways. What I want to know is why do people seem so eager to devote their mind and spirit to a corporation or corporations they know very little about? Believe me, if your opinion of a company is based on its website and its products, you have a <i>very</i> incomplete picture. <br> <br>To swerve back to the topic (sort of): What's so wrong about a given company using a chrome look to their mark, particularly Apple, if it also works in B/W, etc.? Is there something <i>inherently</i> wrong about it? Again, I think that Apple has a pretty distinct look (as a whole) and some very strong brand management. They <i>are</i> a consumer-oriented, image-conscious electronics manufacturer/ software developer. Why would they keep their image (which I consider to be a subset of their brand) static? <br> <br>Look at Nike. Their logo gets used in all sorts of materials and colors, but the Swoosh is still the Swoosh. I think the same goes for the Apple. The surface changes, but the mark endures. I understand the disdain for shiny, swooshy crap, but most of those low-grade redesigns often accompany a total brand overhaul and a total re-shaping of their mark. Apple has remained very controlled compared to many corporations. I think that's probably why we freak out every time they tweak (redress) the logo or change the typeface (What is it, <i>once</i> so far?. <br> <br>It's hard to be innovative and consistent at the same time. Most of the objections I've read are high-minded design concerns that ignore the practicalities of business and focus on a conceptual level, or are a general reaction to sheep-like actions of large corporations (which is hardly shocking). Consumers still know Apple, still recognize the mark, and Apple still looks contemporary. What other visual brand concerns should they, as a corporation, have?</p>"
