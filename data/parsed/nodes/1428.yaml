    html: "<p>Personally, I quite like the less swoop-y version with the shine to it. It was in line with their hardware, and still simple enough to accommodate the different colors (for cases and product lines). <br> <br>I think apple strove and continues to strive for 1) sleek, different, elegant hardware 2) friendly, simple print design. Their interface design is trying to reflect both of these and, unfortunately, sometimes forgets its place in the process. However, I think that ITC Garamond Tall 'n' Fat and Myriad match(ed) Apple's desires. I'm sure that they aren't the most typo-rigorous choices, but they have other concerns. At least they didn't use Gill Sans, which is _everywhere_ in the US for corporations whose creative directors don't want to actually make a decision concerning their identity/ branding.  <br> <br>Believe me, Apple is in the upper echelons compared to some of the obscene 'style guides' I've seen. One major medical company actually stipulates \"san serif\" for headlines and \"serif\" for body copy! <br> <br>PS: The packaging for the old iPod was brilliant, and is a great example of what keeps a lot of people loyal. It even had Myriad on it. And _somehow_ it still worked.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
