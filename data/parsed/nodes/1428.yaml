    html: <p>Oh no! I'm missing a PC/Mac debate! <br> <br><i>There is no way it should have taken them so long to develop a Unix based operating </i> <br> <br>Umm...Unix has been around for 25 years now? Longer? And it finally took Apple to develop a usable, clean GUI to Unix. KDE is getting close to the same goal, but they've taken the 'let's copy windows as best we can' approach instead of trying something new. Not nearly as succesful. <br> <br>As for the platform wars, there's interesting, outdated arguments coming from both sides. Wintel fans still claim that the price difference amongh the platforms is gigantic, and Mac fans still claim that the Mac is much easier to use. Neither are really true anymore. They're simply different OSes that pretty much do the same thing for the most part. <br> <br>As far as I am concerned, it's all been downhill since the C-64 ;o) <br> <br></p>
