    html: <p>To me, there is no PC/Mac debate. It's just tools, and since the software is basically the same, it's all just a matter of taste anyway. Both operating systems have massive faults, and I for one woul dbe happy to see something sleek and completely new come along that feels like InDesign felt compared to Quark.  <br> <br>The porice, however, is not an argument. The kind of hardware you need for a really good system makes Mac and PC almost equally expensive. My machine is in the 17.500 Euro range, and a really nicely tuned-up G5 would be in the same range. It really boild down to what you're used top and what you feel more comfortable with. I still stand by the Umberto Eco comment that Mac is catholic and PC is protestant :-). </p>
