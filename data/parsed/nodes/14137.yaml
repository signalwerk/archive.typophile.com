      <p>Nike, </p>
      <p>Your reasons are understandable, and you may be right that it is a professional script design, but for what it’s worth, it isn’t one that I have collected, and Script fonts are my specialty.</p>
      <p>I am inclined to think that this is a personal font, but made by someone who took the trouble to do it right. I don’t think it is a commercially available script font. </p>
      <p>If we find out otherwise, I want to add it to the Script Font ID Guide.</p>
      <p>- Mike Yanega</p>
