    <p>We would like to announce that <a href="http://www.terminaldesign.com/" rel="nofollow">Terminal Design</a> has launched its new website featuring a number of new font releases and updates to old favorites.</p>
    <p><a href="http://www.terminaldesign.com/fonts/sets/?CID=10" rel="nofollow">Tangent</a> A new geometric sans in eight weights with obliques and small caps.</p>
    <p><a href="http://www.terminaldesign.com/fonts/sets/?CID=6" rel="nofollow">Enclave</a> A contemporary condensed slab serif also in eight weights with small caps and lovely italics.</p>
    <p><a href="http://www.terminaldesign.com/fonts/sets/?CID=9" rel="nofollow">Now Playing</a> A  marquee font designed for use on the new plasma screen marquee for the reopening of the Apollo Theater in Harlem.</p>
    <p><a href="http://www.terminaldesign.com/fonts/sets/?CID=4" rel="nofollow">ClearviewADA</a> A family of Clearview fonts that conform to the letterform specifications for signage outlined in the Americans with Disabilities Act legislation</p>
    <p><a href="http://www.terminaldesign.com/fonts/sets/?CID=5" rel="nofollow">ClearviewText</a> Is the OpenType update of our popular ClearviewOne family.</p>
    <p><a href="http://www.terminaldesign.com/fonts/sets/?CID=7" rel="nofollow">Giacomo 2.0</a> Is updated to include small caps and Cyrillic.</p>
    <p><a href="http://www.terminaldesign.com/fonts/sets/?CID=8" rel="nofollow">Rawlinson 2.0</a> Also updated to include small caps.</p>
