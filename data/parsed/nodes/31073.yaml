    html: |-
      <p>Monotype supplied no data and I looked at no drawings at St Brides. While the work is modeled on Perpetua it is not "Perpetua". It was done in about three or four weeks and I used some old reference I had here at the studio. The art director didn't even know what they were asking for was called Perpetua, since they were using a Bitstream version of the design (with a different name)for their text composition.<br>
      My agreements with Conde Nast limit me from providing many samples. The ones on my website will have to do. I don't think the typographic world will miss not having access to it. </p>
      <p>James</p>
