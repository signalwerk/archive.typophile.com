    html: |-
      <p>Nigella, James is a great guy actually. And I suspect his comments merely amounted to healthy self respect as far as he was concerned. I know cultural differences can be hard to grip in general, we all fumble there I think. And all the more so in email and by text. </p>
      <p>Also, think of it this way: if you don't ever hope in some corner of your heart to be better than your hero, how can you ever try? Perhaps you'll fail - yes. But giving it your best shot is important. And if some us carry that sentiment on our sleeve &amp; others don't then so bit it. I am not sure there is much harm in being forthright. And lastly this myth of self effacement in type designers is just that. Sure Dwiggins was a sweetie from what we can tell. But not everybody was. Some designers have been pretty severe! And I would not like to be without their designs I can tell you!</p>
      <p>I'll be signing up for that promo.</p>
