    html: |-
      <p>Dear Terminal Design,</p>
      <p>I've just noticed the website. Alot of very interesting things.</p>
      <p>I was interested in your versions of PERPETUA and GILL SANS. Several years ago I was approached about reviving the same faces for a large French governmental agency. Following standard protocol, I approached Monotype for their approval. They wanted a large sum of money for a license even though I wasn't going to start with their outlines. That is their right of course, but the agency could not afford the license plus the custom development fees.&nbsp;Did you find such a problem? Or do Conde Nast deal with this problem? Will these fonts eventually be released to the general public? Why did Conde Nast commision another hairline Gill Sans when they had commisioned one already for British Vogue? Si Neuhouse must have more sense than money! And yes, I too thought it was odd that a French organization wanted revivals of classic British typefaces!</p>
      <p>I also enjoyed your comments about your clients for Miller. Is this the same agency that I am thinking of? I did some work for them many years ago with similar results. I must applaud your insult of them!&nbsp;I wish I had so many clients and enough money to be able to insult them like you have. Brooklyn attitude indeed! Bravo!</p>
      <p>Did we meet at the 1989 AIGA conference in San Antonio? I met a fellow type designer from Brooklyn at that conference but my memory has faded. Old age strikes again!</p>
      <p>Sincerely,<br>
      Randolph T. Burke</p>
  - id: 182357
    user: 1947
    date: 2007-02-03T08:06:00
    date_raw: 3 Feb 2007 — 8:06am
    votes: null
    html: |-
      <p>Randolph,</p>
      <p>Conde Nast handles all of these sort of things. The British and the American versions of Vogue are completely separate entities and do not share resources, as far as I have been told. The fonts are the property of Conde Nast and will never be released to the general public.</p>
      <p>The agency and the art directors are to remain nameless. The ADs are all off doing other things these days. I didn't say anything on my website that I did not say to them when the logo was published. </p>
      <p>Unfortunately this poaching of developmental drawings goes on all the time. A colleague of mine has a clause in his contracts that forbids this sort of thing. I am thinking of incorporating such a clause in my future agreements.</p>
      <p>I have never been to an AIGA conference so you must have me confused with another person.</p>
      <p>James</p>
