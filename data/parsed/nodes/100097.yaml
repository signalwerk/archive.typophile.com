    <p>Hi,<br>
    I have an old 'work in progress' font that contains Latin, Greek and Cyrillic glyphs created by an old colleage who has since passed over, and it has class kerning values assigned inside the font, however, no glyphs have been assigned to the class set, using Font Forge to create an FEA file, I can see the following under GPOS:</p>
    <p> @kc4_first_1 = [];<br>
        @kc4_first_2 = [];<br>
        @kc4_first_3 = [];<br>
        @kc4_first_4 = [];<br>
        @kc4_first_5 = [];<br>
     ................. thru to<br>
        @kc4_first_180 = [];<br>
        @kc4_first_181 = [];<br>
        @kc4_first_182 = [];<br>
        @kc4_first_183 = [];<br>
        @kc4_first_184 = [];</p>
    <p>@kc4_second_1 = [];<br>
        @kc4_second_2 = [];<br>
        @kc4_second_3 = [];<br>
        @kc4_second_4 = [];<br>
        @kc4_second_5 = [];<br>
    ------------------- thru to<br>
        @kc4_second_170 = [];<br>
        @kc4_second_171 = [];<br>
        @kc4_second_172 = [];<br>
        @kc4_second_173 = [];<br>
        @kc4_second_174 = [];</p>
    <p>then </p>
    <p>    pos @kc4_first_1 @kc4_second_34 31;<br>
        pos @kc4_first_1 @kc4_second_38 102;<br>
        pos @kc4_first_1 @kc4_second_97 31;<br>
    .................... thru to<br>
        pos @kc4_first_184 @kc4_second_164 -41;<br>
        pos @kc4_first_184 @kc4_second_165 -51;<br>
        pos @kc4_first_184 @kc4_second_168 -92;<br>
        pos @kc4_first_184 @kc4_second_171 -92;<br>
        pos @kc4_first_184 @kc4_second_172 195;<br>
        pos @kc4_first_184 @kc4_second_174 -123;</p>
    <p>I am wondering, is there a way to work out what the constituent members of the class settings would be? I do have a list of the glyphs from GDEF table. That probably sounds silly, but I would like to finish the font and pass it back to his family.</p>
