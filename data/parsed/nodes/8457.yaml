    html: "<p>I tried writing another response to this during the 'down time', so now that you're back I'll repeat it:  Veronese is very close but as the sample below shows, it is not exactly identical (RR Veronese Book is the bottom sample). The sample looks like it is a thinner weight, the serifs are longer than Veronese Book, and the eye of the 'e' isn't the same shape. It's almost like Steve Jackaman's adaptation of the font from the TP Collection (the stated source) is just a bit heavier. <br> <br>Even so, I can't disagree that Veronese is at least based on the same font, or vice versa. <br><img src=\"http://www.typophile.com/forums/messages/83/62680.gif\" alt=\"Abaner Veronese comaprison\"></p>"
