    html: <p>Nick -- Those are excellent questions. DD&amp;B had their own ways of doing things with typography and they used an excellent typographer named Klaus Schmidt to ride herd on their output. At the time that Gage did that ad for the Model 150, Polaroid was a $50 mill. business with an uncertain future and the ad was done before I got into redesigning the packaging. However, DD&amp;B totally ignored my design concepts to the point where they never, ever included a photo of a package in one of their print or tv ads. This bothered me a lot more than the type they used. I can understand their competitiveness but it was IMO counterproductive to effective sales promotion. They made millions with television advertising and major print buys and I'm not aware that they pitched the package design biz, though the major national firms did. Polaroid did not appear at the bottom of the dealer ads because that is where each individual dealer pasted up his usually horrible logo and pertinent info. We tried to separate Polaroid from the schlock as much as possible. <br> <br><a href="http://giam.typepad.com/the_branding_of_polaroid_/" target="_blank">http://giam.typepad.com/the_branding_of_polaroid_/</a></p>
