    date_raw: 9 Jul 2004 — 3:12pm
    votes: null
    html: <p>Paul, I started work as an art director in 1979 for Raymond Lee, a classic Big Idea art director/copywriter. He always preferred not to show packaging or logo, and if possible not show the product either, relying merely on the genius of the ad to win awards, I mean sell the product. For instance, a photo of two naked feet, with the headline "Pity the poor soles with no Macgregor socks." </p>
