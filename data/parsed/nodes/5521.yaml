    html: <p>Nick -- Awards were the bane of my existence. Polaroid inhouse staff (not I) sent in the material and attended the awards dinners. I can't ever remember being invited. Once a piece got an award I never saw it again as the inhouse designers glommed onto related projects hoping to cover themselves with glory. I never got any other clients based on awards received. Freelancers could go broke submitting material to the weekly show announcements in their mail boxes. "Award-winning" has become a ridiculous clich</p>
