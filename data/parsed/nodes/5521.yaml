  html: "<p>Beginning at the top is the Polaroid mark I did in 1958, its application to package design and corporate identity, which is the bottom panel just above the date, 1958. Somewhere in the lower right of the photo is the corporate sign POLAROID, identical to the mark above. I haven't been able as yet to find a better photo. <br> <br>On the left are package designs for Polaroid Sunglasses, 1962, Polaroid Colorpack and black-and-white filmpacks, package design for a Polaroid Colorpack camera, and to the far left, package design and product identity for Polavision, 1977. At the bottom of the row is a package design and product identity for a Polaroid Square Shooter camera. <br> <br>In the row on the right are package designs and product identity for Polaroid SX-70 cameras and accessories, dating from 1972, and just below is a photo of package design for Polaroid Pronto! cameras, 1976. <br> <br>For your information and for what it's worth, I try to post a few times each week with new visuals. <br> <br>The blog link is: <br> <br><a href=\"http://giam.typepad.com/the_branding_of_polaroid_/\" target=\"_blank\">http://giam.typepad.com/the_branding_of_polaroid_/</a> <br> <br><img src=\"http://www.typophile.com/forums/messages/30/40113.jpg\" alt=\"Polaroid Iconography by giam, 1958 - 1977\"></p>"
