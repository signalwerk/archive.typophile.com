    html: |-
      <p>John, thanks for pointing the hlig feature. I was unaware of it.</p>
      <p><cite>There's also "init", "medi", "fina" and "isol"... and "jalt" for justification alternates.</cite></p>
      <p>Yes, but these features are just for scripts like Arabic, where glyphs change according to its postion in a word. Actually, most features are optional and one can properly implement Unicode using just some of them.</p>
      <p>Back to Davide question, if you are planning a font with wide language support, it's important to consider the inclusion of combining diacritics. This implies a good amount of additional work, but it's highly recommended.</p>
