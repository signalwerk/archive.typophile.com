    html: |-
      <p>After following a link in that thread, I learned something new.</p>
      <p>In OpenType, "clig" tags a contextual ligature; "dlig" tags a discretionary ligature; and "liga" tags a standard ligature. That does provide... a reasonable amount of flexibility.</p>
      <p>Ah, but not mentioned in the discussion is "hlig" for historical ligatures - handy, as is noted, for long s forms.</p>
      <p>There's also "init", "medi", "fina" and "isol"... and "jalt" for justification alternates.</p>
      <p>I suppose all this complexity is needed if one is going to properly implement Unicode. So one even has "haln" for the halant forms in Sanskrit... oh, dear.</p>
