  html: <p>In New York City in the '70s, I owned a tiny cold type company called Intertypographics. There was a guy, whose name I don't remember, who was not an employee, but used to hang around a lot because he was a typophile. Both he and I are African American. He would be about 50 by now. If he happens to be reading this, or anyone who thinks he might know him happens to be reading this, it would be great to make contact and find out what he's been doing for the last 35 years. The are other identifying details I could mention if someone things he knows him.</p>
