      <p>Wow... what a long shot.<br>
      I grew up in Manhattan, went to Junior High uptown, went to High School in Brooklyn, and college in Greenwich Village.</p>
      <p>I left NYC in 1970 but hung around with many design students up until that point. Do you have any clues? School? Where did he live? C'mon, dig into your old memory cells.</p>
      <p>I have been tracked down recently by an old neighborhood friend, and I have chased down a few old friends here and there.</p>
