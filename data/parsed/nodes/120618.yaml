      <p><a class="freelinking external" href="http://notetoself.typepad.com/note_to_self/2011/07/holiday.html" rel="nofollow">Cover lettering for Holiday Magazine</a> October 1959 issue so probably never released as a font. Best would have been compressed or more contracted versions of <a class="freelinking external" href="http://commercialtype.com/typefaces/austin" rel="nofollow">Austin</a> Hairline, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/miller-banner" rel="nofollow">Miller Banner</a> or <a class="freelinking external" href="http://www.typography.com/fonts/chronicle-display/overview" rel="nofollow">Chronicle Display</a> Compressed.<br>
      As digital alternative but far less elegant or contrasted: <a class="freelinking external" href="http://www.myfonts.com/fonts/typofonderie/ambroise-std" rel="nofollow">Ambroise</a> Firmin, <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/onyx-mt" rel="nofollow">Onyx</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/torino" rel="nofollow">Torino</a>/<a class="freelinking external" href="http://www.fonts.com/font/monotype/torino/condensed" rel="nofollow">Torino Condensed</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ortizlopez/ol-roman-compressed" rel="nofollow">Roman Compressed</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/bagraphics/fashion-didot" rel="nofollow">Fashion Didot</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/bodoni-rr-campanile" rel="nofollow">Bodoni Campanile</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/moderno" rel="nofollow">Moderno</a> Compressed, <a class="freelinking external" href="http://www.myfonts.com/search/bordeaux" rel="nofollow">Bordeaux</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/arsis" rel="nofollow">Arsis</a></p>
