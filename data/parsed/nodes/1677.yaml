  html: '<p><img src="http://www.typophile.com/forums/messages/72/18668.jpg" alt="Who died and made you Matthew Carter"> <br> <br>Printed up for the <i>Typographically Speaking: The Art of Matthew Carter</i> opening in Saint Louis, the soon to be classic, "Who died and made you Matthew Carter?" t-shirts are now available for sale outside of Saint Louis. Only 25 shirts remain, but if demand is high enough more will be printed. Also available is the letterpress poster for the show. <br> <br>All at <a href="http://tensofdollars.em-dash.org" target="_blank">http://tensofdollars.em-dash.org</a></p>'
