      <p>Dan, great to meet you at Rimmerfest, &amp; sii, sorry we didn’t see you there. The evening itself was entertaining (really a roast of sorts with a variety of shared anecdotes about Jim spraying molten lead all over his musty studio), but the schmoozing afterward (which I normally can’t stand) was a nice opportunity to talk to other folks crippled &amp; reduced to obssessions typographic.</p>
      <p>Then, of course, came the normally-4-hour but this weekend 11-hour return trip from Vancouver to Victoria. Nothing like driving the 30klms to the ferry terminal all in 1st-gear. But, the university campus here is closed today, so, like my students, I’m heading out <!--
