    html: <p>I was wondering if any of you folks from across the border might be coming up. I’m heading over from Vancouver Island on Friday afternoon for Bringhurst’s discussion that night, then on to Rimmerfest on Saturday evening. For anyone interested, there are details on both events <a href="https://web.archive.org/web/20080828001051/http://www.alcuinsociety.com/events/index.html#nov" target="_blank">here</a> (look for the November 24 &amp; 25 listings).</p>
