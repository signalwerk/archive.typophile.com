    html: |-
      <p>The design of No. 157 says <em>old</em> to me, not <em>new</em>. I think you're on the right track with No. 162. The mix of caps and lowercase, of wide and condensed, of serif and sans, are the visual equivalent of swinging improvisational music.<br>
      Having all the lines justifed feels wrong, though, like you're playing on the beat when you should be syncopating. How would it look if you moved <em>MESSENGERS</em> a little to the right and <em>OF JAZZ</em> a little to the left?<br>
      I personally would tighten up the linespacing a tiny bit, but that's just my own preference in a headline with no descenders.</p>
    html_clean: |-
