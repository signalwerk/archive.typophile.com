    <p>Grotext still needs some time. In the meantime have fun with Tiptoe Toy, our uppercase-only demo font. It includes four weights, and some Stylistic Set features to play with them. Free download at <a href="http://www.kltf.de/tiptoetoy.htm" title="http://www.kltf.de/tiptoetoy.htm">http://www.kltf.de/tiptoetoy.htm</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/kltf_tiptoetoy_6282.gif"></div><br>
    KLTF decided to produce OpenType fonts only. However, alongside each full-featured OpenType font, there is a Basic version. This is OpenType too and covers the same CE accented letters as the full-featured version, but omits alternate glyph forms and OpenType features.<p></p>
    <p>The full-featured Tiptoe family can be licensed at US$180, a single weight at US$60. The Tiptoe Basic family can be licensed at US$120, a single weight at US$40.</p>
    <p>The full-featured Litteratra -- including italics, titling uppercase and a bunch of ligatures -- can be licensed at US$120. Litteratra Basic can be licensed at US$40.Read more about our typefaces or download manuals at <a href="http://www.kltf.de/news.htm" title="http://www.kltf.de/news.htm">http://www.kltf.de/news.htm</a></p>
    <p>Full-featured versions can be licensed from Village at <a href="http://vllg.com" title="http://vllg.com">http://vllg.com</a></p>
    <p>Type designers only: Visit our new little download area! It offers a few PDF documents like the updated OpenType Resources link collection, and some more or less useful FontLab Studio 5 scripts. See <a href="http://www.kltf.de/otproduction.htm" title="http://www.kltf.de/otproduction.htm">http://www.kltf.de/otproduction.htm</a></p>
    <p>Have a nice summer!</p>
    <p><a href="http://www.kltf.de" title="http://www.kltf.de">http://www.kltf.de</a></p>
