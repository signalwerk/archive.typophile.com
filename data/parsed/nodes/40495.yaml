    html: <p>Actually, every text-use family DOES need at least two weights, with matching italics, in order to attract wide use. Adobe's new Arno Pro, an obvious competitor in your "look"...just see how complete and developed that family is, and at a much better price! FF Clifford and H-FJ Requiem would be much bigger news by now, used much more extensively, if their foundries had finished their work and had released them with extra weights. This is not a small issue industry-wide.</p>
