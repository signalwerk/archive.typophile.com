    html: |-
      <p>@ John</p>
      <p>Old thread, but I had a closer look to Toshna these days. Great typeface! With and without other weights. And Clifford is one of the very rare fonts, about which I would say, that they are perfect as they are. Clifford is simply an absolute masterpiece! Except from that I wonder, whether it is possible to create a worthy semibold  partner for Clifford because of its darkness. Clifford IS finished. I really would not waste my time with creating semibold styles for Clifford just for filling an expectation of the market.</p>
