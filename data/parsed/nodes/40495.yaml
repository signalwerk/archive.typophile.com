  html: |-
    <p>Toshna is a garaldic typeface design offering three real optical weights. The display weight for titles and headlines is kept very tall, thin and graceful. The book weight for body text is drawn essentially wider, more round with robust, bold details. </p>
    <p>Toshna Std (characterset) is distributed by <a class="freelinking external" href="http://www.astype.de/s/toshna_std/show.php" rel="nofollow">astype</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/astype/toshna-std/" rel="nofollow">MyFonts</a>.<br>
    Toshna (Pro) is available exclusively through by <a class="freelinking external" href="http://www.germantype.com/cms/front_content.php?idcat=76" rel="nofollow">GTF</a>.</p>
    <p>The printed specimen book is featuring an extensive article in English and in German about the type designer Herbert Thannhaeuser. The edition is limited to 500 copies.</p>
    <p><a class="freelinking external" href="http://www.germantype.com/cms/front_content.php?idart=285 " rel="nofollow"> Order your copy</a> including an additional poster.</p>
    <p><a href="http://germantype.com/toshna" title="http://germantype.com/toshna">http://germantype.com/toshna</a><br>
    <a href="http://toshna.germantype.com" title="http://toshna.germantype.com">http://toshna.germantype.com</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gtf_toshna_05_typh_5609.gif"></div><p></p>
