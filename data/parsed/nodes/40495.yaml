    html: <p>It's a lovely face, very elegant and finished, but you offer no bold and bold italic, and your price is too high for freelancers to purchase by themselves--and they are the taste-makers you want to target. This face occupies an especially crowded field, and competing faces are more complete, more extensive, and better priced.</p>
