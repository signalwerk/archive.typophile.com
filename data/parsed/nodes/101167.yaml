      <p>Hrant: Please don't get me wrong. I love a good back and forth in a discussion, and I am thrilled to interact with people who are fundamentally at odds with me in terms of taste, preference, and style. You are absolutely right: these people are often your best teachers. </p>
      <p>But when your first response to a specific question in a forum  is "What's worse acting dumb or being dumb?" it amounts to little more than interrupting and pulling focus. Where exactly is the conversation supposed to go after that?</p>
      <p>So yes, let's have a discussion about what defines this trend, let's identify what qualities these pieces share, let's talk about what is at the core of the movement (which, hey, maybe "acting dumb" <em>is</em> a quality at its core) —&nbsp;but let's not derail things right off the bat with flippant remarks about ebola, whether being intelligent is cool, or what have you.</p>
      <p>Am I crazy here? </p>
      <p>If this was a real life discussion, and I'd laid out a bunch of work from various people, and said "I'm trying to classify these pieces, is there a name out there for this style and I just don't know it? Or is this something new? These are what I could find, but these are some qualities I'm talking about..." and you strolled over after the discussion had begun with an arch "What's worse acting dumb or being dumb?" How exactly do you think that would be received? </p>
      <p>Is or is it <em>not</em> a dick move to sit through this conversation of your own free will and then interject "This is boring! I'm amazed you people actually care about this!" </p>
      <p>Is or is it <em>not</em> a dick move to walk into a room where people are talking about trends and drop an icy "I think all people who follow trends are abdicating their individual responsibility and refuse to think for themselves"?</p>
