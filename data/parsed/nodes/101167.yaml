      <p>Frode: That is exactly how I meant it. I don't think ›anti-design‹ is necessarily dismissive, just as anti-establishment isn't. </p>
      <p>And personally I think the application of these styles are poor when implemented without context or cause. It can be quite a quick fix, create a duplex-image and a 4-by-6-grid using Century Gothic with 120%-glyph-height and there you go. If the content of the design on the other hand transcends historical/political/etc classifications, ›anti-design‹ can be a fine choice — but regarding work ethic, I think it has to be a deliberate choice (even when playful – at least in hindsight) or it's just insulting pretty much.</p>
