      <p>I find this discussion extremely interesting. I feel like graphic design as a function in society is becoming more and more recognized (departing the »Oh, thats actually a job?«-sphere). Living and working in Berlin, it's ubiquitous — both this ›anti-design‹ and the awareness. I like the pastiches within pastiches, because I like the inherent post-modern idea to take existing codes and rearranging/intertwining them. It can be very exciting, and there can be great results from people approaching a design with less inhibition concerning rules and proper usage. I kind of see it as graphic designs’ equivalent to Jaimie Warrens’ photography in a way if that makes sense...</p>
      <p>As a job, graphic design is a craft to me. Me and some colleagues refer to this style as ›hortig‹, meaning HORT, a Berlin-based agency that constantly rides the edge of ugliness and genius or just pleasing. And I have done that myself I guess. But this ›anti-design‹ can also be nothing more than just a quick fix. If applied properly though, with context and function or the deliberate disregard for both, I would definitely consider it a style that is itself composed of anachronistic elements. Movement might be a bit much though.</p>
      <p>Anyways, my two cents. Exciting.</p>
