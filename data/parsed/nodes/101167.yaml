      <p>Jory, it's not useful to try to limit the ways in which different people will react to a question. People you disagree with can be your best teachers. Also, you don't have to like something to think it's worthy of analysis; I myself dislike all the "anti-design" examples I've ever seen* (even though I dislike Modernism as well) but I try to pay attention because that's a designer's responsibility. However I think it's good to remind people that just because something is trendy doesn't mean it's Good or that it will have deep cultural impact.</p>
      <p>* Especially type that acts technically stupid - it's insincere.</p>
      <p>That said, I think your quest to grasp the terminological "common currency" is very worthwhile, and I hope you share your findings here.</p>
