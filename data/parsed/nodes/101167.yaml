    html: <p>I have heard people calling this trend ‘post design’. The term suggests that contemporary applied art (which I will refer to as design here) should look like as if not being designed at all. As if designers now can leave all things that are thought of as ‘rules’ can be ‘left behind’. As if designers may now become something like artists. A strange attitude in a time where practically everyone that has access to a computer can ‘design’ something. Yes, I think that everyone can be an artist, but design is right between craftsmanship and art. Surely, we can debate wether artistic talent can be ‘taught’ at an art school at all, but in the case of craftsmanship, the idea that it may fall from the sky is nonsense. And, seeing this from a practical point of view, why would clients pay for something that is as illegible and user-unfriendly as anything else one can pick from the street? In Europe, partly due to the shift to the bachelor-master in design education, art theoreticians that are new to the applied arts have begun promoting the idea that by introducing art-theory into design education, and making it a major part in master sudy programs, applied art is now being upgraded into ‘art’ (or at least something very very close to it …). Which, imho, is humbug. When designers are going to behave as artists, they will soon be ending up as artists. Which is fine with me as long as they do not call their work ‘design’. I’m fine with design theory, but I think that the applied arts need their own focus in this field. There is still a lot to be researched when it comes to legibility, readability, usability, sustainability, etc. Also the history of writing, lettering, calligraphy, book design, graphic design is a field where research which even recognizes us designers as people that may eventually come up with suggestions on where research is needed and how our knowledge could be scientifically evaluated is rare.</p>
