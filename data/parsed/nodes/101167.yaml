      <p>Trendlist was referenced in the thread early on, but the site was down, so reposting the link for anyone interested.</p>
      <p><a href="http://www.trendlist.org/trends/exposed-content" title="http://www.trendlist.org/trends/exposed-content">http://www.trendlist.org/trends/exposed-content</a></p>
      <p>Gestalten has a few decent books providing an overview of the direction editorial and graphic design is taking. The cheekily named, "Regular Graphic Design Today" is a nicely curated cross-section of what modern design looks like; a somewhat dada-ist, reductionist, type-centric approach to page composition with a healthy sense of humour. Another one in the series that I recommend is "Turning Pages: Editorial Design for Print Media", which makes a case that we're in a golden age of print design because in order to succeed, mediocrity is no longer a business model that works.</p>
      <p><a href="http://www.amazon.com/Regular-Graphic-Design-R-Klanten/dp/3899552539" title="http://www.amazon.com/Regular-Graphic-Design-R-Klanten/dp/3899552539">http://www.amazon.com/Regular-Graphic-Design-R-Klanten/dp/3899552539</a></p>
      <p><a href="http://www.amazon.com/Turning-Pages-Editorial-Design-Print/dp/3899553144/ref=pd_cp_b_3" title="http://www.amazon.com/Turning-Pages-Editorial-Design-Print/dp/3899553144/ref=pd_cp_b_3">http://www.amazon.com/Turning-Pages-Editorial-Design-Print/dp/3899553144...</a></p>
