      <p>All design, from corporate branding to my barber's hand-lettered sign that says "No Waiting," has the purpose of adapting a client's (or author's) message to a medium and an audience. </p>
      <p>What we might call anti-design is mostly just getting attention by subverting the audience's expectations--or more likely, reassuring an audience that they're the cool kids because they're in on the subversive joke. </p>
      <p>Poor design promotes the designer's message--or lack of one--at the expense of the client and the audience. Poor design drives the audience away, e.g., by lack of legibility or insensitivity to cultural symbols. Poor design sends the wrong message about the client, e.g., by rebranding a prestigious state university as a <a class="freelinking external" href="http://vimeo.com/53530934" rel="nofollow">beach-bum party school</a>.</p>
