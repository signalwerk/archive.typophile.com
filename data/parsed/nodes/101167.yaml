      <p>I've enjoyed reading this thread.</p>
      <p>I tend to agree with aluminum's observation that there are signs of David Carson / RayGun / BlahBlahBlah in there, also, perhaps, some of Neville Brody's later, more conventional/restrained work.</p>
      <p>When I first started work as an apprentice comp. in the 1960s I worked for a small company that had been in business since the 1920s. One day I unearthed a box of old electros from the 1920s/30s that were created from either hand-drawn lettering or from repro proof paste-ups. Many of them were two-colour sets, wrapped with a proof. Type reversed out of a colour band or stripe or colour on colour was popular. There is something about the use of colour in these examples that reminds me of those electrotypes. The influence, I believe, came from a very watered down Art Deco; typefaces used were either Gill Sans variants or were geometric sans faces, both of which were popular amongst jobbing printers at that time.</p>
      <p>One of the things that always frustrated my desires with my early, naive designs was the limitations of hot metal typesetting; anything beyond the horizontal and vertical was problematic. We had angle-quads which would, with considerable work, allow 45 degree angles—like the example in the CAB09.Spread 01.jpg example, but I was only very rarely allowed to use them as it took much longer to set and time was money. That example looks very like it could have been set in hot metal type and I wonder if the designer is mimicking this—either consciously or otherwise.</p>
      <p>A couple of the page layout examples remind me of the layouts produced by Octavo in the 80s.</p>
      <p>Conclusion? I'm not sure but maybe there are a number of influences at work here. Perhaps it is, like the widespread use of typewriter faces in the early days of desk-top-publishing, some kind of back-to-basics—simplicity is never poverty; it is great virtue movement, if in fact it is a movement at all.</p>
