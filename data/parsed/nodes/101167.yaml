      <p>Frode: I agree that these microtrends have a brief half-life, and I don't see these small patterns as underpinning a movement per se. I think the emotional response they seem to born out of, however, is building into something of a movement. It's a nice exercise to attempt to identify a movement in its infancy, but you are absolutely right: we can only really look at it in hindsight, so time will tell. </p>
      <p>All I was trying to do here is figure out some nomenclature so I could track down more examples of it. I'm trying to give my layout students a better look at trends in type and the design world as they happen, and train them to look for these trends, and get at deeper cause as to why a trend gains traction and usage.</p>
