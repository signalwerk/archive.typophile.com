      <p>Several of those examples remind me of things design students do when they're deliberately being unconventional and pushing the boundaries. The result isn't always "good design" in the conventional sense (for example the one with text overlaying a rather busy photo background), but it would be a boring world if everyone followed the same design rules.</p>
      <p>&gt; the freedom that digital production gives<br>
      &gt; them to superimpose type on photos, etc.</p>
      <p>Yep. Years ago I was in a large print shop when a job came in with type overlaying photos and color blocks in complex ways, and I overheard an employee say "this job is a stripper's nightmare!"  ("Stripper" being the guy who prepared the printing films.) And maybe it was with the technology back then. But these days with digital production, those things are much easier.</p>
