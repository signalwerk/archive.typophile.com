      <p>@Victor To your point about the sense of playfulness, I've been referring to it in my head as "deadpan design" as it seems to have similar DNA to what Wes Anderson has done in his films' type treatments: there's a straight-faced reference to this sort of vintage avant garde/high brow treatment, but it's done with a wink.</p>
      <p>@Neil That's partly why I finally wanted to get this sorted out — this trend (or trends with similar hallmarks) keep cropping up, and I think it's becoming more of a movement than just a treatment. I feel like it's wrapped up in this zeitgeist of transparency and sincerity: they're "designing down" or at least using a short-hand for a naïve design approach to communicate honesty/earnestness/every-man-ness. It seems like there's the business as usual reaction against polished establishment &amp; corporate design, but I think what's interesting to me is that there's almost an element of a reaction against irony, as well.  </p>
      <p>@hrant I suppose the answer to that largely depends on what your goals are ;)</p>
