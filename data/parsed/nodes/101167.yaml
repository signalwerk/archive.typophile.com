      <p>&gt;  from corporate branding to my barber's hand-lettered sign</p>
      <p>One of my design professors used to use this example. Imagine 2 signs. One says "First National Bank" and is made of steel and marble. The other one is outside a farmhouse and says "Fresh Eggs" and is made from a piece of cardboard. It's hard to image 2 signs that are more different, but each is appropriate for its purpose and setting.</p>
      <p>&gt; What we might call anti-design is mostly just getting<br>
      &gt; attention by subverting the audience's expectations</p>
      <p>Yes, I think that's a big factor. And even though it might be harder to read in some cases, readability isn't the only factor in design. They are trying to appeal to their target audience.</p>
