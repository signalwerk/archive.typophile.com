      <p>This is my first exposure to this style <em>per se</em>. My first reaction is that it embodies many of the principles of Bauhaus/Swiss/modernist design:</p>
      <p>* Typography as the principal visual element<br>
      * Preference for simple sans-serif types, minimal use of large type sizes, and use of a single font throughout.<br>
      * Grid as the definer of the space.<br>
      * White (or flat color) space as an important compositional element.<br>
      * Avoidance of decorative elements other than simple geometric shapes.<br>
      * Emphasizing the two-dimensionality of the page space. </p>
      <p>I see some influence of the backlash against modernism that cropped up in the 1980s (a style I used to call sub-modernism):</p>
      <p>* Offbeat use of color.<br>
      * Non-traditional use of letterspacing.<br>
      * Intentional violations of the grid. </p>
      <p>Your examples are different from mid-20th-Century modernism in that they have more sense of style, and even a hint of playfulness. </p>
      <p>The modernist aesthetic was partly a matter of acknowledging, and even celebrating, the industrial processes that produced office buildings and books. Type on a grid with little color or decoration was optimal for letterpress printing. The examples here are riffing on that look, but they also have some fun with the freedom that digital production gives them to superimpose type on photos, etc. </p>
      <p>If I had to name it, I'd pick something like Digital Modernism. Or maybe I'd refer to the Bauhaus influence, and call it Adobe-haus.</p>
