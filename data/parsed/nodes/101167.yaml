      <p>Gosh, I thought used pretty plain language when I wrote: "<em>I'm hoping to get some guidance if there is actually a name for it — I'm not looking for snarky barbs in terms of appraisal of this trend.</em>" But thanks anyway for the <em>kids these days</em> handwringing and the snobbery.</p>
      <p>As far as not "seeing the trend" — If you mean that from the examples given here, in this post, you don't see a consistent application of the exact same principles from piece to piece, fine, that's valid. But as I mentioned, not knowing what to call something makes it difficult to search for, and also to aggregate examples —&nbsp;so I'm left with what I've happened to bookmark that I recognize as being part of a larger trend.</p>
      <p>If on the other hand, you mean that you are not seeing this trend in the wild, or more broadly, that you are simply not familiar with it, that is less a dismissal of the trend and more a dismissal from a meaningful place in <em>this</em> conversation, where I am explicitly looking for input from people who <em>are</em> familiar with it.</p>
      <p>-----------------------------------</p>
      <p>Back to the conversation at hand — and I'm definitely getting to a "why bother" place here, but just in case anyone was <em>actually</em> interested — I finally got my hands on Computer Arts' Typography Collection last night, and they've got some interesting notes on these microtrends in their trend report from FranklinTill. I thought I'd share some excerpts here from their appraisals, here:</p>
      <p><strong>Microtrend: House of Fun</strong><br>
      "Bold statements have been given a witty, light-hearted twist... bad taste is being celebrated by designers who utilise free fonts, clip art and Letraset transfers."</p>
      <p>"Design collective Zweizehn's... tongue in cheek approach gently mocks the showy celebrity world, whilst still trying to be a part of it. 'Trashy' renderings and comic typography push the posters in a fun direction so they stand out from more obvious party flyers."</p>
      <p><strong>Microtrend: Soft Modernity</strong><br>
      "[Last year] We tracked a theme through many of the design sectors the explored notions of simplicity and clarity. In a bid to stand out amidst the visual noise that surrounds us on a daily basis, an increasingly sober approach is being applied.... We have seen a return to minimalism... utilising unfettered sans-serif fonts and limited colour palettes. Over the last year, this minimalist and monochrome direction has softened to become slightly less sober and more feminine, whilst still retaining a bold and clean aesthetic. Fonts such as Aperçu... have gained much pupularity... Klim Type Foundry's Calibre has also been widely adopted."</p>
      <p>"Using sans-serif typefaces in modular graphic grids, together with solid pastel tones create a new form of modernity" </p>
      <p><strong>Microtrend: Gothic Revival</strong><br>
      "Elsewhere, designers continue to update historical forms to make them feel newer and fresher. Lydian MT, the traditional gothic font designed by Warren Chappell in 1938, is a source of inspriation for many designers." Erik Johsson's font based t-shirt for the Violent Elegance series uses lydian bold, framed within a geometric grid. </p>
      <p><strong>Macrotrend: The Real Thing</strong><br>
      After these reports on these microtrends, they segue into a macrotrend they're calling <em>The Real Thing</em>, which they characterize as being defined by: Tradition Revived, The Magic of Making, Linking Past to Present, and Traditions Reborn. Here are some salient points,</p>
      <p>"We have seen not only a return to traditional visual design references, but also the celebration of the craftspeople and producers themselves."</p>
      <p>"...We explored how transparency in the production process was being used to communicate to consumers how products are made. The consumer's desire to learn how things are made shows no sign of waning, whilst also being a tool for brands to communicate the rich stories behind their products."</p>
      <p>"Preservation of our cultural typographic surroundings is a major factor for those wanting to connect us to our past as well as future, but also to connect a community to its history."</p>
      <p>"Traditional typography techniques are seeing a revival. Methods such as letterpressing are being combined with modern aesthetic interpretations.  <em>Das Mainzer Grotesk Experiment</em> by design collective Zweizehn celebrated the experimental use of the letterpress rather than simply focusing on its retro charm. Zweizehn created and cast its own letterpress type and invited up-an-coming typographers Marcel Häusler, Alexander Lis, Daniel Weberruß and Malte Weinmann to create posters in response to the question 'More than Retro?'"</p>
      <p>I think it's interesting to frame these layout patterns as a part of this "Real Thing" trend, and I definitely think there's a confirmation in what's been previously mentioned in this thread around the ideas of levity, reaction against corporate mass-production and its attendant polished styles, and a pivot on classic design clichés. Here's some more examples from groups that they call out in the collection:</p>
      <p><img src="/sites/default/files/old-images/collection1_3559.jpg"><br><img src="/sites/default/files/old-images/collection2_6431.jpg"></p>
      <p>See also:<br><a href="">www.aronfilkey.com</a><br><a href="http://www.les-graphiquants.fr/">www.les-graphiquants.fr</a><br><a href="http://blog.zweizehn.com/">blog.zweizehn.com/</a><br><a href="http://blog.zweizehn.com/post/14818103335/das-mainzer-grotesk-experiment"> Das Mainzer Grotesk Experiment</a><br><a href="http://www.davisngarupe.com/">Davis Ngarupe</a><br><a href="http://k-u-n-g.com/">KUNG</a><br><a href="http://teamyacht.com/">YACHT</a></p>
