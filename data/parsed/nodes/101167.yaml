      <blockquote><p>I think it's becoming more of a movement than just a treatment.</p></blockquote>
      <p>I do too. And what is even better is that it has gained traction on all levels of society including gallery pieces.</p>
      <blockquote><p>I feel like it's wrapped up in this zeitgeist of transparency and sincerity: they're "designing down" or at least using a short-hand for a naïve design approach to communicate honesty/earnestness/every-man-ness. </p></blockquote>
      <p>I don't know about that, but it's in interesting take on it. For me it just comes with the proliferation of design software. </p>
      <blockquote><p>It seems like there's the business as usual reaction against polished establishment &amp; corporate design, but I think what's interesting to me is that there's almost an element of a reaction against irony, as well. </p></blockquote>
      <p>I remember this graphic style gaining attention during the first Cut &amp; Paste comp. Competitions like that were a breading ground for graphic layout of quick fun in quick time. And as things evolved a fresh design software graphic signature/style began to emerge ...seen in band fliers and on underground zines etc.. </p>
      <p>What I find refreshing is a Mix Don't Match approach to communicating a visual message, that and the fresh approach dealing with the surface of the page itself. The good stuff has completely shrugged off the shackles of page boarder slavery ... and instead has layouts which deal in visual depth (ranging richness to thinness) without the use of traditional point perspective(s). But unfortunately the bad stuff is seen around more often partly because it is readily understood/copied I guess.</p>
      <p>But the overall rule is the same for all eras of graphic design ... that being one of a hierarchy of visual communication. So in that regard, the song remains the same. </p>
      <p>n.</p>
