      <p>Speaking of art:<br>
      When I was in art school c.1970, conceptual art was the big thing.<br>
      It’s now mainstream in gallery art.<br>
      Conceptualism makes the distinction between artists and makers, with making derogated.<br>
      Now conceptualism has spread further, to commercial design.<br>
      (I suppose you could say it was already there, as art direction is essentially conceptual—however, the end result has traditionally been documents with highly aesthetic qualities.)</p>
      <p>An example I came across yesterday—Canada’s new photography stamps.<br>
      Whereas a stamp celebrating photography would have in the past (e.g. 2008 Karsh series, below) shown photos as aesthetic objects with nice compositions, now the idea holds sway.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/st_yousuf_4564.gif"></div><br>
      Yousuf Karsh was recently feted in Canadian stamps (above, 2008) so now a new series of photo stamps cleverly manages to include him—in a conceptual artwork by Arnaud Maggs. The photos in Maggs’ work are so small however—even after being “cropped” down to a dozen from 48—that all one notices (at real 100% size) are that they are black and white head and shoulders shots of a man in a hat. Could be anybody. The stamp as a whole has the plain squared-off serial lineup of many of Maggs’ gallery works—lab specimen/minimal/default/non/un- design.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/arnaud_maggs_yousuf_karsh_5362.jpg.size.xxlarge.letterbox.jpg"></div><p></p>
      <p>The lack of design in the new series of photo stamps may be attributed to the fact that the selection of photos was created by a design manager working with curators. So all the images are hopelessly the wrong scale for stamps, unless one is a collector with a magnifying glass. But there’s a lot of supporting BS, which is a hallmark of conceptualism:<br>
      <a href="http://www.canadapost.ca/cpo/mc/personal/collecting/stamps/2013/2013_mar_photography.jsf" title="http://www.canadapost.ca/cpo/mc/personal/collecting/stamps/2013/2013_mar_photography.jsf">http://www.canadapost.ca/cpo/mc/personal/collecting/stamps/2013/2013_mar...</a></p>
    html_clean: |-
