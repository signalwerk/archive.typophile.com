    <p>Been seeing this around a lot for the last little bit, and while everyone I talk to recognizes the trend, no one I've spoken to has any idea what to call it, and therefore searching for examples has been difficult. I'm hoping to get some guidance if there is actually a name for it — I'm not looking for snarky barbs in terms of appraisal of this trend. </p>
    <p>I've attached some images, but overall I'd describe it as being a design approach with priority on type, characterized by unconventional grids, typically monochromatic or duotoned color selection, minimal use of photos/illustrations, frequent use of minimal geometric graphics, and frequently executed with fonts by The Entente, but also with Futura, Times. Ideologically it seems to be taking a naïve posture — and while there is a superficial lo-fi-ness to it, it's still pretty systematized/polished.</p>
    <p>Thanks!</p>
