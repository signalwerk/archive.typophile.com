      <p>As I commented a week or two ago, "All design . . .  has the purpose of adapting a client's (or author's) message to a medium and an audience . . . Poor design promotes the designer's message--or lack of one--at the expense of the client and the audience."</p>
      <p>In the past couple of centuries, Western industrial societies have come to think of <em>art</em> as where the artist's own message trumps all other considerations, and <em>design</em> as where the designer's imagination and skill serve as a vehicle for someone else's message. </p>
      <p>The border between <em>art</em> and <em>design</em> is permeable, as it should be, to allow good ideas to flow back and forth. But if we remove the border entirely, we risk encouraging designers to neglect our professional responsibility to authors, publishers, clients, readers, and viewers.</p>
