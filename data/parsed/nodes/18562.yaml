      <p>‡‡‡‡‡‡‡</p>
    <p>KAPITZA is a London-based design partnership founded by sisters Nicole and Petra Kapitza in 2004. In 2006 they set up KAPITZA FONTS, a new font foundry specializing in dingbat and pictographic fonts.</p>
    <p><a href="http://www.kapitza.com/?section=fonts-blossomy">Blossomy</a> explores the beauty of shapes and structures in nature. It is the result of a long term interest in the organic and erratic lines of natural forms. Blossomy is featured both on the cover and in the article ‘The decriminalisation of ornament.’ (pp.18-37) of Eye Magazine Spring 2006. </p>
    <p><a href="http://www.kapitza.com/?section=fonts-eastend">East End</a> is a portrayal of the multitude of people and cultures living in the east end of London. It is where we live and work and are unceasingly inspired by.</p>
    <p>Both fonts will be featured in the upcoming issue of Computer Arts (April 2006).</p>
    <p>(All illustrations are based on photographs which have been traced by hand.)</p>
    <p><a href="http://www.kapitza.com/" title="http://www.kapitza.com/">http://www.kapitza.com/</a></p>
    <p>‡‡‡‡‡‡‡</p>
