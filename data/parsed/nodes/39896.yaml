  html: <p>I've previously published a book typeset in Palatino.  Examples in the book were presented as an italic in greyed boxes.  I'm considering revising the book for a second edition, and among other changes I am using the more readable (and to me, visually interesting) Aldus.  I'd also like to ditch the italic in favor of a sans serif, but am unsure what pairs well with this typeface.  Any recommendations?  (Likewise, any reservations against mixing sans serif and serif in this fashion?)</p>
