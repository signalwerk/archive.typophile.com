      <p>Actually, while I'm on the subject...</p>
      <p>Part of the reason I'm switching to Aldus is because, originally, I had artificially altered the width of Palatino due to its rather wide stature.  I have since seen the error of my ways and thought Aldus was a better way to go about it.  However, I have a vast preference for Palatino's more script-esque punctuation.  Aldus's commas and exclamations seem blandly round by comparison.</p>
      <p>With the advent of the new Palatino Nova, has a face more suitable for extended book text been created?  Conversely, how egregious would it be to simply slip Palatino's punctuations into Aldus?  Or, just to simplify matters, is it so bad to simply set Palatino's width to 92.5% as I had before?</p>
