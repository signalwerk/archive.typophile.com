      <p>Regarding <a href="/wiki/squooshing" class="freelinking" rel="nofollow">squooshing</a>: You should do what looks good to you, but usually, compressing or expanding type by more than a few percentage points is dangerous as it messes with the delicate proportions of the verticals and horizontals and the thicks and thins. For example, my newspaper compresses its headline type by 90%, which I cringe at every time I see it. So I'd suggest Aldus over compressed Palatino.</p>
      <p>Regarding Palatino Nova: There's also an <a href="http://www.linotype.com/109957/aldusnova-family.html" rel="nofollow">Aldus Nova</a>. I haven't had a chance to use Palatino/Aldus Nova, but I've heard good things. I've read that Zapf designed them to work with digital typography, as opposed to metal.</p>
      <p>Regarding sans-serif pair: Rather obvious, but have you looked at <a href="http://www.linotype.com/111707/palatinosans-family.html" rel="nofollow">Palatino Sans</a> and <a href="http://www.linotype.com/113189/palatinosansinformal-family.html" rel="nofollow">Sans Informal</a>?</p>
