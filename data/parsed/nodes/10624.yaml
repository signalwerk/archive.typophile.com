  html: "<p>For Immediate Release: <br>Buffalo, NY April 29, 2005 <br> <br>P22/ International House of Fonts announces the release of 2 new fonts, Kilkenny and St.G Schrift, from 2 new IHOF designers, Colin Kahn and Paul Hunt. <br> <br>St. G Schrift is a font based on the type designs of German poet Stefan George. This sans-serif face features a few variations found in books published by George in Berlin. P22 St. G Schrift One</p>"
  html_clean: "<p>For Immediate Release: <br>Buffalo, NY April 29, 2005 <br> <br>P22/ International House of Fonts announces the release of 2 new fonts, Kilkenny and St.G Schrift, from 2 new IHOF designers, Colin Kahn and Paul Hunt. <br> <br>St. G Schrift is a font based on the type designs of German poet Stefan George. This sans-serif face features a few variations found in books published by George in Berlin. P22 St. G Schrift One</p>"
