  html: |-
    <p>I'm considering to buy the font Trinité (No. 2) from Enschedé (<a href="http://www.teff.nl/fonts/trinite/trinite.html" title="http://www.teff.nl/fonts/trinite/trinite.html">http://www.teff.nl/fonts/trinite/trinite.html</a>), but as far as I can see it has no fi (or other f-) ligature(s). I find this very strange, since I've seen examples of Trinité in use with the fi- and fl-ligatures. The other fonts from Enschedé seems to have several f-ligatures. </p>
    <p>Does anyone have a point of view on this? Thank you!</p>
  html_clean: |-
    <p>I'm considering to buy the font Trinité (No. 2) from Enschedé (<a href="http://www.teff.nl/fonts/trinite/trinite.html" title="http://www.teff.nl/fonts/trinite/trinite.html">http://www.teff.nl/fonts/trinite/trinite.html</a>), but as far as I can see it has no fi (or other f-) ligature(s). I find this very strange, since I've seen examples of Trinité in use with the fi- and fl-ligatures. The other fonts from Enschedé seems to have several f-ligatures. </p>
    <p>Does anyone have a point of view on this? Thank you!</p>
comments:
  - id: 118950
