      <p>I tought Trinité was so well designed that it didn't need any ligatures. With the n°2 the stem of the lowercase f always covers the point of the i.</p>
      <p>You can see it clearly on the sample sheet (<a href="http://www.teff.nl/fonts/trinite/pdf/trinite_a3_print-600.pdf" title="http://www.teff.nl/fonts/trinite/pdf/trinite_a3_print-600.pdf">http://www.teff.nl/fonts/trinite/pdf/trinite_a3_print-600.pdf</a>).</p>
