    date: 2006-04-19T02:39:00
    date_raw: 19 Apr 2006 — 2:39am
    votes: null
    html: |-
      <p>There is no need for separate ligatures in Trinité.<br>
      The f seamlessy closes up to the i, j, l, h, k and b<br>
      if the glyphs are set without letterspacing.</p>
