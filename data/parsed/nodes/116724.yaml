    html: |-
      <p>Questions regarding dashes are usually decided by a project's writer, using the style guide they've chosen. If there is no writer, buy a good style guide for reference. You can find a list of common guides here:<br>
      <a href="http://en.wikipedia.org/wiki/Style_guide" title="http://en.wikipedia.org/wiki/Style_guide">http://en.wikipedia.org/wiki/Style_guide</a></p>
      <p>If a paragraph begins with a small cap I might ask the writer to reword the sentence for a better appearance. If they don't want to, I'd stick with small caps to be consistent with the style I'm using elsewhere (assuming the small caps are intended as capitol letters, which is usually the case, like in an acronym such as NASA).</p>
