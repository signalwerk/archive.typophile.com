    html: |-
      <p>“How do you deal with acronyms in italicized passages if you've been using small caps throughout the text and, like in most fonts, you don't have italic small caps?”</p>
      <p>If you have to break your own rules because the font you’re using can’t fulfil them, use a different font. In this case, one that has italic small caps (I’m not sure “most” don’t if you use quality type). This sort of thing is why, if you make a book for instance, you want to be as sure as you possibly can that the fonts of your choice cover everything you need before you start typesetting. (I’m aware this isn’t always possible, but it’s a good rule.)</p>
      <p>And yes, no emdashes in European usage. In the usage you mentioned I’d probably use a non-spaced endash. But yes, check with writer/editor/publisher for existing/preferred style guides.</p>
    html_clean: |-
