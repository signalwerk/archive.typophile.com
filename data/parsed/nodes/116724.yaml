    html: |-
      <p>That's why I omit the spaces on the insides of en-dash parentheticals.<br>
      <a href="http://armenotype.com/2012/04/archipelago/" title="http://armenotype.com/2012/04/archipelago/">http://armenotype.com/2012/04/archipelago/</a><br>
      See the ends of the second and third paragraphs.<br>
      As you can see I also use guillemets in English.<br>
      The em-dash I use rarely, like for an attribution with space(s) in it:<br>
      "— Gustave Flaubert" (versus "– Heraclitus")</p>
      <p>Make your own style. Just base it on logic.</p>
      <p>hhp</p>
