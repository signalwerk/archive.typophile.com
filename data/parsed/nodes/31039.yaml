    <p>hi there,<br>
    i'm actually creatin a new font and i want to create ligatures in the font. but i've problems with it. i am able to create ligatures as new characters but they doesn't work in the preview panel, not as fontlab data and neither as opentype or truetype. can anyone help me, what's my problem.<br>
    thx</p>
