    html: |-
      <p>Since glyph names still matter, you better name the glyph "w_w_w" so e.g. Acrobat knows it is a ligature and must be decomposed to w w w if you copy/paste text from a PDF. So:<br>
      &nbsp;&nbsp;&nbsp;sub w w w by w_w_w;</p>
      <p>Or, if you like:<br>
      &nbsp;&nbsp;&nbsp;sub w w w period by w_w_w_period;</p>
      <p>Also, you can use contextual substitution:<br>
      &nbsp;&nbsp;&nbsp;sub w' w' w' period by w_w_w;<br>
      So w w w will be substituted only if period follows, but the period itself remains.<br>
      (You could put w_w_w into your w kerning class. Might be that XPress7 ignores this then, I don't know, you have to try.)</p>
      <p>Karsten</p>
