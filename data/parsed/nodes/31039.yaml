    html: |-
      <p>Glyphs are just glyphs, you have to tell the font which substitutions to perform:<br>
      In the OpenType panel, add a new feature (click the plus in the bottom left part of the panel) which creates a new empty feature (displayed in the top right part). There, enter something like:</p>
      <p>feature liga {<br>
      &nbsp;&nbsp;&nbsp;sub f i by f_i;<br>
      &nbsp;&nbsp;&nbsp;sub f l by f_l;<br>
      &nbsp;&nbsp;&nbsp;[etc]<br>
      } liga;</p>
      <p>which tells the OpenType interpreter to replace single "f" and "i" by the ligature glyph named "f_i" (or "fi" if you call it like that).<br>
      You can add other substitution commands by the same scheme.</p>
      <p>Karsten</p>
