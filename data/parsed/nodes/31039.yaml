      <p>three letter ligatures:</p>
      <p>i'd go like that with it?</p>
      <p>feature liga {<br>
         sub w w w by lig_www;<br>
      } liga;</p>
      <p>(if the name of the glyph is lig_www)</p>
      <p>on another note: if i do a www-lig, wouldnt it be good to make it "www.", because then i can make sure that there's not a strange word in a language that has three w's following each other and getting replaced - also, makes kerning easier.</p>
