      <p>&gt; Or, if you like:<br>
      &gt;   sub w w w period by w_w_w_period;<br>
      &gt; Also, you can use contextual substitution:<br>
      &gt;   sub w’ w’ w’ period by w_w_w;<br>
      &gt; So w w w will be substituted only if period follows,<br>
      &gt; but the period itself remains.</p>
      <p>But note that not all OpenType-savvy applications support contextual substitutions. The contextual ligature will work in InDesign, Illustrator, Photoshop, QuarkXPress 7 but will not work in Apple TextEdit, Keynote or Pages (under Mac OS X 10.4), while the plain ligature will work in all of the above. </p>
      <p>Adam</p>
