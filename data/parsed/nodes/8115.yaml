    html: "<p>Or maybe the current 'Font of the Day', at myFonts, today.: '<a href=\"http://www.myfonts.com/fonts/phatphonts/equaliser/\" target=\"_blank\">Equaliser</a>', from Phat Phonts.? <br><i>( But, that one may as well be a tad too smooth and rounded.. )</i> <br> <br>Edit.: This may be 'Off Topic', but, I just noticed something else related to 'Equaliser', which stumped me.: Take a look at '<a href=\"http://www.myfonts.com/fonts/australiantype/euron/euron/testdrive.html?s=Q%3F+similar+or+not&amp;p=60\" target=\"_blank\">Euron</a>', from <a href=\"http://www.atf.com.au\" target=\"_blank\">Australian Type Foundry</a>, and compare it to '<a href=\"http://www.myfonts.com/fonts/phatphonts/equaliser/regular/testdrive.html?s=Q%3F+similar+or+not&amp;p=36\" target=\"_blank\">Equaliser</a>', from Phat Phonts.. Notice any similarities.? Or is it just me.?</p>"
