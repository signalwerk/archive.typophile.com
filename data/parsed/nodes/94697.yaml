    <p>Greetings! I'd like to know the font of following sentences: <strong>"Das Ziel!"</strong> and <strong>"Sieg für HYDRA!"</strong>. </p>
    <p>The former one looks like Tannenberg, but I don't think it's actually Tannenberg.</p>
    <p>Thanks in advance.</p>
    <p>Sincerely,<br>
    Felix M.</p>
    <p>P.S.: The picture is attached to this message, but can also be found here: <a href="http://i.imgur.com/L9oTs.jpg">http://i.imgur.com/L9oTs.jpg</a></p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/L9oTs.jpeg" width="596" height="897" alt="">
