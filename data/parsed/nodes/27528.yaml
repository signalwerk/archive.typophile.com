    <p>Thanks in advance for any help I could get with this. I'm looking for a san serif script font called (I think) 'Noise'. It looks similar to the font on Bjork's Vespertine album. Any leads? I'd love to find something free, if possible, but any sort of direction someone could point me in would be appreciated, free or not!<br>
    Thanks a million...<br>
    Sarah</p>
