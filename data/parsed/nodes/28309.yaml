      <p>Thanks for the (lighting fast) feedback.<br>
      All excellent points :)</p>
      <p>I’ve reduced the roundness of the stalk in the ‘a’ and made the loop in the ‘o’ larger, hence distinguishing the letters better.</p>
      <p>I’ve moved the ‘p’ off the ‘O’ and taken out the white counters, which as suggested brings out the ‘O’ better and makes the whole thing more readable. A clearance area has also be made around the inside of the ‘O’ to try and stop the image hiding it.</p>
      <p>And err.. gundogds :| it’s late !</p>
