    <p>I made this font during a course at Columbia College Chicago and as the image below explains each character contains thousands (or at least hundreds) of points. This made it difficult to work with so I'm making a new one based off of outlines I'm drawing from prints of the old one. Also am making it a bit heavier in the process. Interested in your impressions and thoughts (especially things like where this font would be appropriate or things it might remind you of). </p><div class="imageWrap"><img src="http://typophile.com/files/kreep_6551.png"></div><p></p>
    <p>What I might do is make some of the character more normal (like the B and J) and keep the current ones for use as alternates. I'm not sure how far I'm going to take it really, I'm just using it in my quest to really understand the beziers and so on.</p>
