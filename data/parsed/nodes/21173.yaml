      <p>thanks for the comments everyone!</p>
      <p>bram, the inspiration is actually just a lot of sketching, both digitally and naturally (with both brush and pen). no apostrophe, i just recently got the uppercase in and i'm working on getting the lowercase in now. </p>
      <p>toni, it is supposed to be somewhat irregular and i can definitely see things i want to tweak but i want to do the lowercase before i start tweaking those again. </p>
      <p>goran, i'm actually not sure how i would go about doing that. see the original letters were drawn as a mono width and then had an illustrator brush applied, expanded and then imported. it's quite daunting to think about cleaning it up. maybe you are right and i shouldn't give up. it's just like working with an image that's been live traced, i don't know where to start since i didn't make any of the points. maybe i should just quit thinking it's daunting, eh? afterall that's what finally got me using the pen tool. </p>
      <p>what kind of designs do you guys think either of these fonts would work best in?</p>
