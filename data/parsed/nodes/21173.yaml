      <p>I agree with Goran, your typeface feels alive because of the many points, twists and turns.</p>
      <p>So I have a totally different suggestion. Like J.F.P.'s kerning table, why not take your bezier points and push it to the limit? Today's computer, I believe, can handle such loads. Just make sure to remove the really <em>unneccessary</em> points, though.</p>
      <p>To answer your question, I can see your font used in a postmodern piece of design (a la Neville Brody, etc.)</p>
