      <p>Kostal, don't give up your old font (the thinner version). There are ways to optimize the points so it gets more user-friendly. I like the thin better actually, it feels more free and alive.<br>
      If you go through the whole alphabet, optimize the points (and take away some points aswell) and where it's possible use straights instead of curves - the font will definately work better.</p>
      <p>I would on other words, try to "clean" up the old font aswell. It's looking very nice.</p>
