  html: |-
    <p>I had an idea for promoting my foundry's (<a class="freelinking external" href="http://new.myfonts.com/foundry/Greater_Albion_Typefounders/ " rel="nofollow"> Greater Albion Typefounders</a>) latest releases.  It goes like this. Three of our larger families on Myfonts.com (Whitehaven, Vertrina and the newly released Bonning) include free faces.  The challenge would be to take one or more of these faces and use them to design an advertising poster that respects the spiri of the chosen faces.  The best submissions would be published on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a> and the winners would receive complimenary copies of font faces as prizes.</p>
    <p>Now the questions:</p>
    <p>What do people think of this idea?</p>
    <p>Does anyone have any suggestions of where to publicize it, apart from on here and our own <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>?</p>
    <p>Cheers,<br>
    Paul.</p>
