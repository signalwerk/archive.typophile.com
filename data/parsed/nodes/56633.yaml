      <p>Well...It's certainly an idea. Unfortunately I don't have time (and I'll be honest here - inclination) to enter such a contest. But it sounds like an interesting "publicity" campaign. </p>
      <p>You might check in with Smashing Magazine's blog - they often like to highlight free fonts and other resources and they have a wide, international audience.</p>
