    votes: null
    html: <p>Can I add my 2d worth as a constant user, not a designer, of books. <br> <br>I find the typeface to be about the least important thing in whether a book is nice to read. How the type is set, and how it is printed, and on what paper, and how the book is bound -- these are far more important. Crispness and modernity are as likely to come from the design of the book, as from the design of the type. I have often seen two books set in the same type, and one is lovely to read, the other ghastly. This is down to the detailed typography, not the typeface. <br> <br>I suspect that using a new typeface for a book is a leap in the dark. Very long text settings really stretch text types. Little tiny idiosyncracies which would be perfectly tolerable in, say, a magazine article, become infuriating. <br> <br>I don't know how many books you have designed. But if the answer is "not many", it might be better to choose a typeface that is in common use so that you can look at lots of books that use it and learn its idiosyncracies. There is still surely plenty of scope for creativity in the many other (actually, more important) design choices to be made.</p>
