    html: <p>Kent -- I hope you didn't take my comments as in any way hinting that Whitman would not be suitable. Whitman from what I've seen of it (never, unfortunately, a book) is probably a great text face. What is more, it is in a tradition of other great text faces. I'd love to see it used in some books. <br> <br>It really can make all the difference in the world, even with a good typeface, whether it is used or abused. Some perfectly horrible things are done with wonderful fonts; some fairly respectable books can be made with nasty typefaces (though it's harder). <br> <br>I wish Jonathan the very best of luck in choosing a font; may he both choose and use well.</p>
