    html: <p>Jonathan <br> <br>Type is the fountain pen of the gods. <br> <br>My inclinations are opposite to most. What works for me may not for you. I never tackle any project with <i>a fixed idea</i> in mind. <br> <br>Other than a glass of wine. <br><a href="http://lanstontype.com/WineGlass.html" target="_blank">http://lanstontype.com/WineGlass.html</a> <br> <br>My designs are one of discovery, as you can see, I am a simple man without any ideas, or opinions. I suppose working with the narrow parameters you have chosen for yourself is for others more brave than myself. <br> <br>Also if I were to, and I do, design books, the last thing I would ever do is ask anyone for help choosing a typeface. Taste is what will decide the success of <i>book building.</i> So if it fails, it is because of you. No book has ever won any award simply because it was set in  the <i>latest model type face.</i> Type design, thankfully, does not follow <i>any planned obsolescence marketing model.</i> Recycling is good practice. We do not want perfectly good fonts leaching toxins in a land fill site. Do we? <br> <br>Type design is steeped in tradition. Built to last for hundreds of years. Some, hard to imagine, but in this very forum, bitterly complain, that types designs hundreds of years old outperform the digital carnival that is coming to town. Type is an investment, not a <i>Bic Pen throw away consumable.</i> <br> <br>Type is a language, dialects tend to stick around.  <br> <br>That said, maybe you should listen to Hrant. He is a rational man, hates artist and poets. But I think he likes wine. <br> <br>So he can't be all that bad, can he? <br> <br></p>
