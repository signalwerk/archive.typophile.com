  - id: 27208
    user: 1215
    date: 2004-03-12T05:18:00
    date_raw: 12 Mar 2004 — 5:18am
    votes: null
    html: "<p>I agree with Paul that there are many other factors as (or even more) important to the design of a book as the text typeface. If those other things have been dealt with competently, however, the choice of a typeface can play a key role in determining the \"voice\".  <br> <br>And, as Gerald implied, the choice of a text typeface is often a very personal one for a book designer.  <br> <br>It is tricky to work with a new typeface. I often play for a long time with a new face, before I feel comfortable spec'ing it. When time is tight, I fall back on old favorites because they are reliable in the clutch. <br> <br>But someone has to be bold and put these new faces through their paces, so good for you for wanting to explore. <br> <br>Hrant did not provide a link above, so allow me to do so. Whitman may be seen and purchased at the Font Bureau site: <a href=\"http://www.fontbureau.com/fonts/font_frames.tpl?fontname=Whitman\" target=\"_blank\"> www.fontbureau.com/fonts/font_frames.tpl?fontname=Whitman</a>. <br> <br>However, online showings are not so helpful for book types. A more extensive PDF specimen is available from my site: <a href=\"http://www.kentlew.com/Type/\" target=\"_blank\"> www.kentlew.com/Type/</a>. The Whitman PDF has several samples in text sizes (9-14 point) with two different leadings. <br> <br>Even this is not as good as seeing some real-world uses. Unfortunately, the books that I'm aware of using Whitman are all from relatively small publishers here in the States. I don't know that any of them would be on a UK bookshelf. The most likely would be <i>Extreme Simplicity</i> by Christopher and Dolores Lynn Nyerges (Chelsea Green Publishing Co., 2002). <br> <br>I'll go one better than that, though. If Whitman fits your criteria and you would like to seriously consider it, then send me 1000 words of your sample text in plain text format and give me some specs -- trim and margins, or line-length, leading, and number of lines -- and I'll set you some sample pages in a couple sizes and send back a PDF file. <br> <br>Best of luck with your project. <br> <br>-- Kent.</p>"
