      <p>Right now, it is a script run in the text file, so it isn't in the font. We really just have two: one for fonts with a swoopy "f", one for fonts without. Just generalized kern vaules, will be much better when we can get it in the fonts. We also take care of some roman/italic "interchanges" with the script, and forbid line breaks for numerous constructions (8:00 P.M., F. M. Murphy, etc. etc.).</p>
