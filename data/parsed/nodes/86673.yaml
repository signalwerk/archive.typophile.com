  html: |-
    <p><strong><a href="http://forum.fontlab.com/fontlab-studio-public-preview/build-4311-download-fontlab-studio-51-for-mac-public-preview-4-t8277.0.html" rel="nofollow">FontLab Studio 5.1 for Mac Public Preview 4 (build 4311)</a></strong> is now available as a free update for all registered users of FontLab Studio 5. </p>
    <p>This build fixes many problems with FLS 5.1 crashing on Mac OS X 10.7 and 10.6, improves OpenType .otf and .ttf font generation, improves the decompilation of OpenType Layout features into FEA 2.5 syntax (e.g. automatically includes the "languagesystem" statements required by the AFDKO 2.5 library), and includes many stability fixes and small UI improvements. </p>
    <p>FontLab Studio 5.1 is a 32-bit Mac Intel application that runs on Mac OS X 10.5, 10.6 and 10.7. </p>
    <p>Regards,<br>
    Adam</p>
