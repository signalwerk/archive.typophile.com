      <p>Adam, I was responding to James' comment, which seemed to suggest that an update to the Windows version wasn't necessary, since it is already Intel-native. I was pointing out that the updates in the Mac version involve more than just making it Intel-native. Yes, the Windows and Mac versions have always been incompatible in various, mostly small ways, but I think changing the ADKFO code base is a different order of incompatibility, because it makes .vfb sources with .fea code in them non-cross-platform compatible.</p>
      <p>Not an issue for me, of course, since I still use VOLT for all OTL work. :)</p>
