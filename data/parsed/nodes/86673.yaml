    html: |-
      <p>It all depends on your needs. I almost never need more than 6,400 glyphs. But I always have a need to kern triplets, or come up with work-arounds. We now run a text-processing routine on incoming manuscripts to kern triplets, using a hard kern in InDesign. Couple examples: f + space + J/(plus any letter with an ascender on the left) period/comma + space + a/c/d/e/etc.</p>
      <p>Etc. Could well use some of the other ADKFO 2.5 tools as well. As far as supporting ADKFO 2.5 goes, AFAIK &amp; IIRC, FL promised it for Windows by December 2010.</p>
