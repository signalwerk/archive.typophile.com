    html: |-
      <p>It certainly is true that in practice when smaller type is used, line lengths in characters tend to be longer.</p>
      <p>When discussing the "ideal" line length, though, generally the discussion is about a book that is optimal in other ways, such as having the ideal type size (possibly around 14 points) and it's an aesthetic characteristic.</p>
      <p>When a range of widths - 1 1/2 alphabets to 3 1/2 alphabets, for example - is specified, while part of that is due to an "ideal" not being well defined, that also includes space for the one to use varying with the type size.</p>
