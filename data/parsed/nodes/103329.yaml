      <p>"But thinking about this more, the[re] may be some other power [or] law governing the relation between the font size and line length."</p>
      <p>The power of the reader, I think.</p>
      <p>There are two directions and one place. The past was dedicated to the publisher's knowledge of their readers, the future is dedicated to the reader's abilities as granted by their choice of devices. The place is the present. If you are talking in the present about composition ideals of the past,  the publishers knew the laws. When you are talking in the present about composition ideals for the future, the laws start with the devices. </p>
      <p>Another way of talking about this, is that the "font size" is not the parameter we look at when determining the optimal size-to-length relationship of text type, it's the x-ht.</p>
