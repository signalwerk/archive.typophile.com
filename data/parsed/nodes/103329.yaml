      <p>&gt; <em>the[re] may be some other power [or] law</em></p>
      <p>Just in case: power law ≡ <code>x ↦ xᵗ</code> (for a fixed value of t).  It is equivalent to saying that when x increases by k%, the result will increase by t·k % (for small values of k).</p>
      <p>&gt;  <em>the "font size" is not the parameter we look at when determining the optimal size-to-length relationship of text type, it's the x-ht.</em></p>
      <p>I intentionally used a vague term so that when answering, people have an opportunity to choose whatever measurement they consider relevant to the question.  <strong>Update:</strong> actually, what I had in mind in the original post was using the same font, just of different font sizes.  (My experience is only with optically scaled fonts; so I would prefer this assumed in the discussion.)</p>
      <p>But your refinement makes a lot of sense: when considering different fonts, which of font measures is better to use in the context of my question?</p>
