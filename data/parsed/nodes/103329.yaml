      <p>If you can locate the guidelines mentioned below perhaps they might contain something useful:</p>
      <p>The National Association for Visually Handicapped (NAVH) provides the NAVH Seal of Approval to commercial publishers for books that meet their large print standards. The standards call for:</p>
      <p>Maximum limits on size, thickness, and weight<br>
      Minimum limits on margins<br>
      Type size at least 16 point, preferably 18 point<br>
      Sans serif or modified serif font recommended<br>
      Adequate letter and word spacing<br>
      Flexible binding recommended to allow open book to lie flat</p>
      <p>- <a href="http://en.wikipedia.org/wiki/Large-print" title="http://en.wikipedia.org/wiki/Large-print">http://en.wikipedia.org/wiki/Large-print</a></p>
