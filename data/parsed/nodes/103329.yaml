      <p>Duderino,</p>
      <p>It is not my opinion that some large-print editions use the same page size as normal editions; it is my experience—hence, it has been empirically verified in some instances. It is not uncommon that people who require larger type are somewhat old-school, and are used to reading newspaper and multi-column-formatted magazines. Such folks tend to eschew the whiplash encountered when trying to read very wide columns.</p>
      <p>So, you can presume all you want: presumptions can be unwarranted, as well.</p>
