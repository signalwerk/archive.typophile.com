    html: <p> Regarding all the various "B"s, (reading acorss, left to right, starting in the top row) I prefer the 3rd, 4th and 7th "B"s best. They seem to have the best balance of legibility and innovation, and seem to harmonize best with the other glyphs. <br> <br>I prefer the 1st "D" and the 2nd "M", too. <br> <br>David </p>
