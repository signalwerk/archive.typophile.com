    html: <p> This seems to lack the depth or the character of  <br>your "Syncratica." Perhaps it's the mono  <br>widths... or the seemingly forced 'curves' in the  <br>J or the various Bs, etc. <br> <br>But, I can't really put my finger on it. </p>
