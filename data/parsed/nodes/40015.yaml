      <p>Hi Emma,</p>
      <p><cite>why is rotis ugly?</cite></p>
      <p>There’s a whole award-winning book on this topic; <a href="http://www.typografie.de/verlagsverzeichnis/typografie/717-3.html" rel="nofollow">rotis – eine Streitschrift </a> by Christian Hartig &amp; Ralph Burkhardt. [The book title’s pun is lost in translation: ‘Streitschrift’ means ‘(polemic) pamphlet’ <em>and</em> ‘controversial typeface’]</p>
      <p><a href="/wiki/Rotis" class="freelinking" rel="nofollow">Rotis</a>, designed in 1988 by <a href="/wiki/Otl%20Aicher" class="freelinking" rel="nofollow">Otl Aicher</a>, tried to bridge the gap between Sans and Serif. It soon became heavily debated and generated polarized opinions. Some found its hybrid system very useful for corporate communication, and so Rotis consequently was used extensively to embody ‘solidity’.</p>
      <p>Others dispised Aicher’s design, claiming he was a great designer (most notably: 1972 Olympics in Munich), but just not a proper <em>type</em> designer. Rotis is said to be defective in running text, as it has a distinctive vertical stress and therefore tends to form undesirable columns.</p>
      <p>Especially the ‘smiling’ (or ‘keeling over’) lowercase ‘e’ gets lots of love and hate.</p>
      <p><cite>The Rotis type family was developed much from Aicher’s own theories on typography and readability, and as such, works better in concept than in practical application.</cite><br>
      — Norbert Florendo in <a href="http://www.typophile.com/node/15785" rel="nofollow">this thread</a></p>
      <p>That’s exactly what we call a ‘Kopfgeburt’ in German – a mere mind game, useless in practice. </p>
      <p>F</p>
      <p>[edit] Oh, I knew I had read this ‘Kopfgeburt’ attributed to Rotis somewhere else: <a href="/wiki/Robin%20Kinross" class="freelinking" rel="nofollow">Robin Kinross</a> and <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a> on <a href="http://www.spiekermann.com/iblog/C1109747452/E1829097339/index.html" rel="nofollow">Is Rotis a typeface?</a></p>
