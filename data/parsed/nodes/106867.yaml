    <p>Hi People,</p>
    <p>I would like to tell you how magnificent Times New Roman in Indonesia is. Times New Roman (especially in 12 point for body text) is very standard in various writing. Every scientific writings, school assignments, government documents, law documents and other non-casual non-modular (i.e like advertisement etc) should use Times New Roman. I ever created a assignment in Georgia and my teacher in high school rejected my assignment. In every single University in Indonesia, all of scientific writing (minithesis, thesis, dissertation, paper etc) must be printed in Times New Roman 12. I don't know how why people standardize and convene Time New Roman as the one and only formal serif font that able to use in Indonesia. This kind of 'natural' convention is really irritating me.</p>
    <p>Did this happen in other country? What about western countries?</p>
    <p>Gunarta</p>
