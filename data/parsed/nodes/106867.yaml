      <p>To answer the OP’s question:<br>
      There certainly are dominant typefaces in the West (if not quite so omipotent as TNR appears to be in Indonesia).</p>
      <p>Two reasons for this:</p>
      <p>1. Zipf distribution of typeface popularity.<br>
      2. Bundling.</p>
