      <p>&gt; I ever created a assignment in Georgia and my<br>
      &gt; teacher in high school rejected my assignment.</p>
      <p>That doesn't mean that Times was necessarily the best choice; there are other reasons why a teacher may require a particular font .</p>
      <p>Specifying a standard format may reduce the number of questions the teacher gets about formatting. It prevents students from making poor font choices that are hard to read. Also it's easier for the teacher to visually judge the length if all students are using the same font and size. </p>
      <p>&gt; is very standard in various writing</p>
      <p>It's a fine typeface, but things become "the standard" often just because a lot of people are using them, not because they are necessarily the best choice.</p>
