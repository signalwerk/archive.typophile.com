      <p>As a charter member of the "For my $10, I'll buy a used, Smyth-sewn hardcover edition in near-fine condition rather than any ebook," I get to review a lot of older typefaces. A review done in passing, reading is what's going on. </p>
      <p>One conclusion: Times holds up very well indeed. So well I'm making a variation for our shop to use, starting from Nimbus No 9L (for the GPL+FE license). Yes, I'll change it a bit, trying for a look more like the old Linotype fonts with long descenders.</p>
      <p>Point is, a lot of the fashionable fonts don't read nearly as well. Style -- fashion -- is often just another form of planned (i.e., artificial) obsolescence.</p>
