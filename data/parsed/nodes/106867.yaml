      <p>@Nick Shinn:<br>
      <cite>And there are even some quite acceptable faces that have been designed in the last 75 years.</cite></p>
      <p>True, but it takes <em>so long</em> for a typeface to become recognized and well-known.</p>
      <p>I know, though, that by trotting out the tired old choices that everyone has been using for ages, I am being terribly unfair to contemporary type designers who are trying to make a living. Still, I assume typographers who are looking for something novel and unique are able to find them, despite my lack of help.</p>
      <p>And it's something of a sad reflection that <em>even</em> more use of 75-year-old typefaces as alternatives to Times Roman would be an improvement on its current level of overuse, the merit I find in it notwithstanding.</p>
      <p>Here are a few examples I found quickly:</p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/aragon/" rel="nofollow">Aragon</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/baltica/" rel="nofollow">Baltica</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/magna/" rel="nofollow">Magna</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/minister/" rel="nofollow">Minister</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/timeless/" rel="nofollow">Timeless</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/itf-alanmeeks/brigade/" rel="nofollow">Brigade</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/impressum/" rel="nofollow">Impressum</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/spiecegraphics/el-castillo-sg/" rel="nofollow">El Castillo</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/kepler/" rel="nofollow">Kepler</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/cepuertas/legitima/" rel="nofollow">Legitima</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/capearcona/ca-normal-serif/" rel="nofollow">CA Normal Serif</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/apollo/" rel="nofollow">Apollo</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/bagraphics/grandeur/" rel="nofollow">Grandeur</a></p>
      <p>And then there's Palatino - or Aldus, which might be considered to be Palatino Book - and Imprint, Bembo, Poliphilus, Cloister Lightface, and many other choices.</p>
