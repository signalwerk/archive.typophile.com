      <p>Times New Roman is certainly very common, and some colleges in North America do insist on its use for theses. Law courts in the United States instead demand Century Schoolbook in some cases, if I remember correctly.</p>
      <p>I think Times Roman <em>is</em> a very well-designed typeface, probably warranting the adjective "magnificent", as I feel it bids fair to have the same level of popularity as Caslon did. However, I'm not overly fond of Times Titling.</p>
      <p>Just because it's a very good typeface, however, is not a good reason to overuse it to the exclusion of all else. Garamond, Baskerville, Century Expanded, and Caledonia are all very good alternate choices for body copy.</p>
