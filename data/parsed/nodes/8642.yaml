    html: <p>You can't typeset Arabic on the regular version of InDesign. It doesn't support right-to-left rendering, the contextual selection of initial and final forms, vowels positioning etc. But all that is supported in InDesign ME. Best would be to us a Unicode-encoded Arabic font with OpenType layout features. I don't think Nazanin exists in such a version, so InDesign ME may or may not support it. But InDesign ME ships with Winsoft Naskh Pro, a quite reasonable OpenType Arabic text face. I sugges that you give Nazanin a try in InDesign ME, if it doesn't work then either use Winsoft Naskh Pro or contact Linotype for information regarding availability of Nazanin in OpenType.  <br> <br>Regards, <br>Adam</p>
