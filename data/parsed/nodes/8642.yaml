  html: <p>this is the first time i am working on a layout with non-latin scripts. <br>i have ms word files, set in tahoma in arabic and want to do the layout in indesign 2.0. the word documents where written on a pc, i work on a mac. the font i want to use is nazanin truetype for mac. <br> <br>when placing the documents into my indesign document all glyphs are highlighted as missing.  <br>solutions?</p>
