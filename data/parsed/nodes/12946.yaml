    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Flavor</strong></p>
    <p>There are two types, or <em>flavors</em>, of <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> fonts (OTFs): PostScript flavored OTFs and TrueType flavored OTFs. Those with <a href="/wiki/PostScript" class="freelinking" rel="nofollow">PostScript</a> outlines are of the <a href="/wiki/Compact%20Font%20Format" class="freelinking" rel="nofollow">Compact Font Format</a> (CFF) variety and are designated by the ".otf" suffix. Technically, all Windows <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TrueType</a> fonts can be considered OpenType fonts and are cross-platform and may be designated by either the ".ttf" or ".otf" suffix. TrueType flavored OTFs are thus backwards compatible on Windows operating systems as long as they are designated with the ".ttf" suffix. However, TrueType fonts do not appear with the OpenType icon unless they are <a href="/wiki/digital%20signature" class="freelinking" rel="nofollow">digitally signed</a> by the font foundry.</p>
    <p>see also:<br>
    <a href="http://www.adobe.com/type/browser/OTReadMe.html#Anchor-Flavors" title="http://www.adobe.com/type/browser/OTReadMe.html#Anchor-Flavors">http://www.adobe.com/type/browser/OTReadMe.html#Anchor-Flavors</a><br>
    <a href="http://www.microsoft.com/OpenType/OTSpec/otff.htm" title="http://www.microsoft.com/OpenType/OTSpec/otff.htm">http://www.microsoft.com/OpenType/OTSpec/otff.htm</a><br>
