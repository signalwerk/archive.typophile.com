    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Indices</a>&nbsp;: <a href="/node/12038/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Terminology</a>&nbsp;:&nbsp;Flavor</strong></p>
    <p>There are two types, or <em>flavors</em>, of <a href="/node/12420/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">OpenType</a> fonts (<span class="caps">OTF</span>s): PostScript flavored <span class="caps">OTF</span>s and TrueType flavored <span class="caps">OTF</span>s. Those with <a href="/node/14482/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">PostScript</a> outlines are of the <a href="/node/add/wiki?edit%5Btitle%5D=Compact%20Font%20Format" title="Create node &quot;Compact Font Format&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Compact Font Format</a> (<span class="caps">CFF</span>) variety and are designated by the “.otf” suffix. Technically, all Windows <a href="/node/13679/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">TrueType</a> fonts can be considered OpenType fonts and are cross-platform and may be designated by either the “.ttf” or “.otf” suffix. TrueType flavored <span class="caps">OTF</span>s are thus backwards compatible on Windows operating systems as long as they are designated with the “.ttf” suffix. However, TrueType fonts do not appear with the OpenType icon unless they are <a href="/node/18413/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">digitally signed</a> by the font&nbsp;foundry.</p>
