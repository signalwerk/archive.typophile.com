    html: <p>KPT didn't have that function. There's a couple ways to do it. The best way is to create your halftone screen in photoshop, and then run it through Streamline, or another autotrace function. The roughness of the autotrace can lend a good look to that, but I wouldn't use it with anything over say 20 lpi or so. The dots would just be too small, and have too many points. <br> <br>The second way, which is less likely to work consistantly, is to use the set lpi function in Freehand. However, a lot of imagesetters will just override that, and you'll end up with a flat field or gray or color.</p>
