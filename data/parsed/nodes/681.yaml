    html: <p>1 iota -  <br> <br>Besides what Sean said...here's something else you can do. <br> <br>After you convert, select all the points and go to <br> <br>Edit &gt; Convert to &gt; Circle <br> <br>Actually, you will have to deselect the "main piece" <br>or pieces. <br> <br>the surrounding halftone blips will  <br>become decent looking circles instead <br>of malformed globs, a'ite mate. <br> <br>bj <br> <br></p>
    html_clean: <p>1 iota -  <br> <br>Besides what Sean said...here's something else you can do. <br> <br>After you convert, select all the points and go to <br> <br>Edit &gt; Convert to &gt; Circle <br> <br>Actually, you will have to deselect the "main piece" <br>or pieces. <br> <br>the surrounding halftone blips will  <br>become decent looking circles instead <br>of malformed globs, a'ite mate. <br> <br>bj <br> <br></p>
