  html: <p>hey, just wondering if anyone knows of a program/plugin that does bitmap halftone screen effects in vector? i thought kpt vector effects might, but i think its gone out of production. <br> <br>thanks <br>iota.</p>
  html_clean: <p>hey, just wondering if anyone knows of a program/plugin that does bitmap halftone screen effects in vector? i thought kpt vector effects might, but i think its gone out of production. <br> <br>thanks <br>iota.</p>
