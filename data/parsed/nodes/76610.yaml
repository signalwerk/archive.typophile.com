    html: <p>In any other situation, I would be more than happy with a site's font preview (MyFonts' implementation is exceptional, and House Industries allows for enabling ligatures and alternate characters). However, H&amp;FJ has one of the most restrictive and featureless font previews I have used. If I am going to plunk down $200 for a seat of Forza, I better know pretty well whether or not it is going to work perfectly. At any rate, if this is the best I can get, then I guess I'll try to work with it.</p>
