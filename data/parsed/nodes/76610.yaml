      <p>Just as a sidenote: I feel that some people here are a little bit too much on the procedurial side. I do not own Forza myself (I seriously use Eurostile instead...), but if I did, I would send him his word right away, as a kind gesture; I really don't see where is the problem. He's not stealing the type (though he could), he just wants to check it in a good way but doesnt want to put 200 bucks away with a little risk, and I totally understand that.</p>
      <p>And about asking H+FJ for a favor, forget about it. Last year I asked them for a photo and some sketches of Gotham for my (then) upcoming book (that is still the bestselling typo book in France btw), and I am still waiting for an answer. They are insanely great type designers, though, among the best. But when it comes to "thanksgiving spirit spreading"...</p>
      <p>d.</p>
