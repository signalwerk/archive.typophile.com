    <p>Hi all, </p>
    <p>I don't see any reason why this would be illegal or even ethically gray, but if it is, please let me know and I will delete this thread. In any case, I have a logo design project and I have a feeling that Forza might work well for part of the logotype. Would somebody be willing to type out the word "RETRO·QUAKE" (and if you have time, with varying caps styles like Retro·Quake and retro·quake). EPS outlines or even semi-hires JPEG/PNGs would be incredibly helpful! If it works in this setting, I will be purchasing a license for it.</p>
    <p>Cheers!<br>
    Brendan</p>
  html_clean: |-
