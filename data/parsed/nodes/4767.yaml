    html: <p>I checked with Michael C. Gross, one of the associate producers of Ghostbusters who also designed the "no ghosts" logo, and he doesn't remember. He said that Columbia Pictures' agency did the type treatment. He also said he doesn't think it was custom. Mystery unsolved.</p>
