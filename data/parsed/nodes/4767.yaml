  html: <p>Hello all, <br> <br>Any ideas on these two? The Ghostbusters logo was created in 1984. The type seems very familiar but frustratingly I haven't been able to find it. The type is distinctive by the spur on the G. I can't tell if the type below ("collector's series") is the same family or different typeface altogether (maybe another Norvarese?). That too is familiar, but my eyes or my brain are too tired now. <br> <br><a href="http://www.myfonts.com/fonts/redrooster/silverado-rr/" target="_blank">Silverado</a> from Red Rooster seems close (including the spur), but Silverado was created after 1984. RR says Silverado was based on Eldorado, but they had to change the name since linotype had a dissimilar type by the same name. <a href="http://www.myfonts.com/fonts/linotype/itc-symbol/" target="_blank">ITC Symbol</a> is also similar, as is <a href="http://www.myfonts.com/fonts/agfa/memo/" target="_blank">Memo</a>, but both don't have the spur on the G.  <br> <br>As for the type in used for autamata <i>(another good CD, btw)</i>, I haven't a clue.  <br> <br><img src="http://www.typophile.com/forums/messages/83/35877.jpg" alt=""> <br><img src="http://www.typophile.com/forums/messages/83/35878.jpg" alt=""></p>
