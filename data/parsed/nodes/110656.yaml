      <p>&gt; it is too abstract and theoretical</p>
      <p>The image of two people shaking hands was immediately obvious to me.  Letters have been used to represent people in logos for a long time.  The "Families" logo below was designed over 30 years ago, and we still see the concept used a lot today. </p>
      <p>If you're worried about people not recognizing it, one thought would be to use photos of shaking hands in some of the company's literature (although that image is a bit of a cliche).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/families_6573.jpg"></div><p></p>
