      <p>I have to admit I didn't see the two men shaking hands at first, but then I can be rather naive about these things. Now I've seen it I can't unsee it, and it's very clever. I find the icon to be aesthetically pleasing as well, and so is the color.</p>
      <p>I'm personally still concerned that the concept is too subtle, but then I also wonder if the concept even has to be obvious. The icon is pleasant to look at. I guess I agree it just needs some polishing.</p>
