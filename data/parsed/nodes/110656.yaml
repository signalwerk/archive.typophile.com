    <p>Hi everyone,</p>
    <p>this logo is meant for a small consultancy that does intercultural trainings, for example for Indian businessmen who come to Germany and want to understand people and culture. </p>
    <p>The claim means "Global Mediators" and the logo consists of the first names of the two consultants. The visual idea is that of "connecting" cultures. However I already got the feedback that this metaphor is 1, recognized very hard and late visually and 2, that it is too abstract and theoretical.</p>
    <p>The logo is based on an "Aller" but heavily modified. The claim is a "Andada".</p>
    <p>What do you think?<br>
    Thanks for your feedback!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bildschirmfoto 2014-01-23 um 22_4278.17.56.png"></div><p></p>
