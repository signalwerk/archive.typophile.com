    <p>For those who are interested in how OpenType font naming can be handled in FM, I just published a <a href="http://www.fontmaster.nl/pdf/FM_docs/Name_table_entries.pdf">PDF</a> on this subject. Also some details are revealed on how the automatic generation of OpenType Layout features is handled. At the coming <a href="http://www.fontmaster.nl/pdf/FM_docs/FM_Track_2008.pdf">FM Track</a> in St. Petersburg more info will be given, also on OT Master.</p>
