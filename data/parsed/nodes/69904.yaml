    <p>I'm reading John Irving's novel, Last Night in Twisted River and enjoying it quite a bit. The Canadian cover is beautiful, thanks largely to the photo by Irving's son, Everett Iriving.</p>
    <p>The type appears to be <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/sackers-light-classic-roman/sackers-light-classic-roman/" rel="nofollow">Sackers Light Classic Roman</a>. And the thing that my eye keeps going to is the space after the R in "IRVING" – is it kerned oddly? Is that because of the metrics that Monotype assigned, or did a designer kern it that way for a good reason? I keep staring at it, trying to see the rationale.</p>
    <p>Perhaps folks here, many of whom have extensive knowledge of kerning, would like to comment?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/twisted_5900.jpg"></div><p></p>
