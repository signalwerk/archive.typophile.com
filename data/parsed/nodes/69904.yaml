    html: |-
      <p>Nina, to answer your question about the temperature of the novel: several seasons are covered in the course of the book – several decades, in fact. I haven't finished reading the book, but two pivotal moments have already taken place in icy conditions, so I can see why the snowy landscape is appropriate. The warmer, antique look fits too, though.</p>
      <p>I have read that Irving takes great interest in the design of his books. His was apparently disturbed that as the writer, his input was not so greatly valued when it came to Hollywood adaptations of his works. He has had to struggle to have his say in the movie business. Actually, he wrote a <a class="freelinking external" href="http://www.john-irving.com/My_Movie_Business.asp" rel="nofollow">book about that.</a></p>
      <p>Perhaps the issues of "suboptimal" kerning on a Canadian version of his latest novel were not vetted by the author. On the paperback edition, maybe.</p>
