      <p>It definitely draws the eye. Fonts are rarely that badly kerned and I can't imagine anyone doing that on purpose. </p>
      <p>Kerning all caps presents many challenges and especially with a font that has such variation in widths. If I had the font, I'd love to re-kern this and see what could be done to improve the kerning throughout.</p>
      <p>It is a very evocative design. Too bad about the type.</p>
