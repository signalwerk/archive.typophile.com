    html: |-
      <p>&gt;easiest on-the-eyes for papers </p>
      <p>Satya, this is so influenced by size, measure, leading, paper and press that you can't give a simple answer. For example, not to pick on your country, but my wife is struggling with a book printed India because it has such poor readability. </p>
      <p>It is cleanly printed in Adobe Garamond 10.5/12 at a measure of 24 picas on paper with a huge amount of show-through. If it were Adobe Garamond 12/14 at a comparable measure for that size and on more opaque paper, you would find it hard to beat that for readability. But as it is, it is a headache-inducing horror. </p>
      <p>This poor readability is because of a combination of things. First, Adobe Garamond has a small x-height and so 10.5, which would be fine in many other types, is a bit of a problem. More than that, the show-through is so bad that any type could be a problem. Moreover, it is exacerbated by the fact that the design doesn't keep a consistent baseline grid. This makes the show-through appear irregularly between lines, and gives an 'out of focus' look to the type, in spite of the fact that it is cleanly printed. </p>
      <p>This is an extreme case, but it shows the difficulty of giving a definitive answer on readability. There are somewhat similar problems on what type is most economical. A the lower case alphabet of one face may be shorter at 10 point than another, but that doesn't mean it is necessarily more economical. The wider font, set at a smaller size, with equal line spacing, may be more readabile. And since readability is probably influenced by how dark the type looks, which is in turn influenced by leading, everything gets rather complicated. </p>
      <p>For exploration of all this see The Complete Manual of Typography by James Felici, or Book Typography by Mitchell &amp; Wightman. I am finding the latter particularly informative. It is rather expensive so you might ask your university to get it, if they don't already have it. </p>
      <p>All that being said, there are types which have problems as text types. For example my pet hate is Helvetica/Arial used as text type (small size, extended text) for print. While it is fine as far as readability used as a display type, I think it is horrible to read as text type. But many of the great text types, like Garamond, Times, Baskerville, Caslon, etc. work extremely well at text sizes, though each ideally is handled a bit differently, according to its distinctive characteristics.</p>
