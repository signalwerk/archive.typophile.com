      <p>Trying to address several people's questions, here, so bear with me.</p>
      <p>I have several favorites, but readability has a lot to do with the medium. On screen readability is not the same as printed by any means. For printed media in large blocks of text, I suggest Baskerville or Garamond. Large bodies of text should be in a serif font.</p>
      <p>I would rank the top 10 fonts for printed text (large bodies of text) this way (favorite to least favorite).<br>
      1. Garamond (take your pick - I like JG Garamond, though it is only currently in True Type and hard to find.  I would also say try Adobe Garamond or Garamond Premier Pro)<br>
      2. Baskerville (In particular MBaskerville, Berthold Baskerville, Baskerville Win95 BT, Baskerville Bookprint or New Baskerville).<br>
      3. Book Antiqua<br>
      4. Georgia<br>
      5. Goudy Old Style<br>
      6. Acanthus<br>
      7. Caslon<br>
      8. Atlantix<br>
      9. Bauer Bodni<br>
      10. Century Schoolbook</p>
      <p>As for a top 100, I do not agree with the list above at all for some, but that is sort of the point.  I think everyone with have their own list of top 100 fonts.  Doubtless many people would very much differ with my top 100 list and I am sure there are many that will differ with my top 10 list above.  Thus, give the ones mentioned a try and pick your own.  </p>
      <p>But in the category of more unsolicited suggestions...</p>
      <p>For titles or fancy text I would say go with:<br>
      1. Bernhard Modern<br>
      2. DeVinne<br>
      3. Tiffany</p>
      <p>For a sans serif you can't go wrong with Arial, but Swiss is also really nice.</p>
      <p>In a pinch, for a serif font, Dutch is also good. I tend to avoid CG Times, Times and Times New Roman if I can, because it is just WAY over used (my opinion), plus I do not find it that easy to read. I have much less eye fatigue reading Garamond or Baskerville.</p>
      <p>On screen I find that Helvetica, Swiss, Sans Serif, Arial or Verdanda to be easily readable.  If you are using an old picture tube monitor, these will be better for you.  For those of you that have a flat panel or high definition flat panel monitor, try the open type (in windows they render better on the screen than true type fonts for most people) Dutch, Goudy Old Style or Georgia.</p>
      <p>Regarding the space saving fonts.  The space saving fonts generally are relegated to the condensed fonts, such as some condensed Garamond font or something like that.  Times New Roman is one of the most space saving fonts around without being a condensed font, but I dislike the Times family.  Recently, but unfortunately still very hard to find, there has been a Baskerville developed with the same rough width as Times New Roman.  The result is a font that is more readable than Times but saves space like times.  The font is called (brace yourselves for the imaginative genius of the name) Baskerville Times.  In my opinion it is the most space saving font for the level of readability out there.</p>
    html_clean: |-
