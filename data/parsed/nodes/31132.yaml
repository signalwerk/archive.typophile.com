      <p>The best type designer ever is Francesco (Griffo) da Bologna. His genius defined the printed lower case as we know it, so he is the innovative and most influential. He would need an asterisk to Alcuin, the scribe, though, who codified the Carolingian miniscule. I recently saw the exhibition of oldest Bible manuscripts at the Smithsonian, and you could really see what the historians' shouting is all about, so to speak. The Irish monks introducing the word space into latin script was one huge step in readability. And when I saw Alcuin's actual work, I was blown away: there it was, the lower case, strong, open, humanist, contemporary to today. No doubt at all why Jenson and Griffo took it as their model.</p>
      <p>ps. Maybe you could make a case for Jenson, but the debate would be between those two, nobody else. The question of what is the best design is different. And there Garamond and others would come in.</p>
