      <p>Satya, thank you so much for posting this; I was unaware FontShop.de had done this and I must admit it is <em>very</em> much more elegant than <a href="http://www.100types.com/100types.com.intro.html" rel="nofollow">my attempt</a> at a very similar thing.</p>
      <p>Chris, FWIW, my version is in English; however only some of the information overlaps because </p>
      <p>a) it's based on the <a href="http://www.tdc.org/reviews/typelist.html" rel="nofollow">"The Top 100 Types of All Time?"</a> list at the TDC site, rather than best seller lists compiled by the FontShop from their sales/search data.</p>
      <p>b) I did all the research for my site by myself (with a lot of help, admittedly) but I don't have the resources for either research or website production that the FontShop does.</p>
      <p>Aziz, the the most space-saving one out of the 100 listed (at my site) would probably be <a href="http://www.100types.com/100types.com.96compacta.html" rel="nofollow">Compacta</a> for display work, or <a href="http://www.100types.com/100types.com.41bellgothic.html" rel="nofollow"> Bell Gothic</a> – but both of these evolved for very specific purposes (good condensed types for general text setting are now quite plentiful among the large hybrid families). Or check out <a href="http://www.100types.com/100types.com.27minion.html" rel="nofollow">Minion</a>. The 'easy-on-the-eyes' thing is as William says, quite subjective, but for on-screen work there is <a href="http://www.100types.com/100types.com.68base9and12.html" rel="nofollow">Base Nine &amp; Twelve</a> in that list.</p>
      <p>William <em>...my pet hate is Helvetica/Arial used as text type (small size, extended text)</em> Berkson, please be aware that this 100types site is only in beta testing stage so far!! Feedback to date includes the comment that, yep, the text is too small : 0</p>
