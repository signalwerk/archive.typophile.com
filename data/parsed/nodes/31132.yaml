      <p>Some of the entries on Paul Shaw's TDC list make more sense to me. Some of them, not the whole list. At least it includes Memphis, Neuland and Fette Fraktur. Neuland and Fette Fraktur alone are arguably two of the all-time greats. The Fontshop list has a number of pointless double entries in the form of revivals. Why leave out Memphis and venerate Rockwell when that face owes so much to Memphis? Mrs. Eaves is sweet, but it too is indebted to John Baskerville's original roman face. The Fontshop list includes too many recent successes. Cézanne---gimme a break. It's a very trendy hand-written script face but not great type design and vastly overrated. DIN, Interstate---no, sorry, they're just very trendy. Don't confuse fashionable with great design. </p>
      <p>The "many more tasty contemporary faces" on the Fontshop list is a pleasant touch for short-sighted typographers and the easily-persuaded, much like the NME reader polls that rate Radiohead and Queens of the Stoneage along with the Beatles amongst the "greatest bands of all time".</p>
      <p><em>...they may have shot their bolt by mixing up sales, panel preferences and historical import into one big “best” category</em></p>
      <p>Yep-yep-tep. More useful and meaningful top 100 font lists could be compiled based on sales alone, aesthete panel ratings alone, historical value alone, and so on.</p>
      <p>I get the impression this is a marketing exercise rather than an objective and meaningful list.</p>
      <p>j a m e s</p>
