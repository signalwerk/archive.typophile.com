      <p>Thanks Paul. Very kind of you.</p>
      <p>mail k? Feel free to make your own list. In doing so you'd likely realise that all such lists are necessarily compromised by their very nature. I'll confess it's also my kneejerk reaction whenever I see 'the 100 all time best <em> whatever</em>'... usually with restaurants, hotels, movies, books and cds. That's why Paul Shaw put a question mark in the title of the original list. But specifically, Optima was judged to be more innovative as a design than the other types you mention by the people (TDC members) that he asked; you could say it broke the mould of what a sans serif could be at that time.</p>
