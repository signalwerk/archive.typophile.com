      Also, props to those who dismissed the long s, and introduced lining figures (around 1800).</p>
      <p>These constitute alphabetic design, therefore more significant than mere typeface design.<br>
      By that logic, Tzar Peter the great is The Man. However, he wouldn't make it to the Hall of Fame either, having tortured and killed his son.</p>
