      <p>On a similar note: being fed up with the overall presence of Times in Polish publications, some four years ago I made a subjective list of 60 "Times replacements" for a Polish website:<br>
      <a href="http://dtp.art.pl/nietylkotimes.html" title="http://dtp.art.pl/nietylkotimes.html">http://dtp.art.pl/nietylkotimes.html</a></p>
      <p>I've only considered font collections widely popular in Poland (Bitstream, Linotype, URW, Adobe), so the list only includes classics. Obviously, many excellent typefaces from smaller foundries are missing, so are many newer typefaces as well as such that were missing Polish diacritics. Because the list was supposed to gather "Times replacements", it's obviously lacking sanserifs, scripts etc. </p>
      <p>I categorized the potential use of those typefaces into popular literature (beletrystyka), magazines (czasopisma), high-profile editions (wyd. eleganckie), daily newspapers (prasa codzienna). I must admit that I'm still a great fan of the Linotype legibility series, hence the inclusion of Aurora, Textype, Ionic 5, Impressum, Gazette, Corona and Olympian in my list. </p>
      <p>A.</p>
