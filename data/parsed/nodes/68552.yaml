    html: |-
      <p>Changing the interface has got to take time, when you are integrating the different interfaces from what, a half dozen companies. I think Illustrator is the only big app that is entirely Adobe-made. Even InDesign is based on PageMaker, which was Aldus. Then there is all the Macromedia stuff.</p>
      <p>While it might seem a great idea to pick one interface, the problem is choosing which one. Folk get upset when you start moving shortcuts and workflows around on them.</p>
      <p>I think Adobe has done a pretty good job, with the interfaces getting closer and closer together all the time. I suspect we will see more this version, but still short of perfection.</p>
