    html: |-
      <p>@Don Mc Cahill:<br>
      <cite>While it might seem a great idea to pick one interface, the problem is choosing which one. Folk get upset when you start moving shortcuts and workflows around on them.</cite></p>
      <p>Why not let the user do the picking? If there are five applications with diverse interfaces in the suite, fully debug each of the five interface styles for each application, and make it a user-configurable setting which one is presented by the application to the user.</p>
      <p>That way, users comfortable with the traditional interface for any of the applications can keep those interfaces, and they can set the other ones to be similar for when they move to the other applications from the one most important to them.</p>
