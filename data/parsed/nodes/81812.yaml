    html: |-
      <p>My guess is that it's a crapload of overlapping nodes created by Illustrator's not-so-hot autotrace routine that make FontLab freak out. If so you might be able to merge the stacked nodes by option-clicking the merge button in pathfinder. But that's just a guess.</p>
      <p>If that doesn't work, try copying over small sections or even individual paths, one at a time. That might allow you to get a simple enough mess to see what is really going on in the Illustrator paths.</p>
