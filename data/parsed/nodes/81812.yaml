  html: <p>In the past I have designed "textured" looking faces by rendering with pencil, photographing, tracing (in freehand mx at the time), then copy/pasting into fontographer. I recently have designed a face, rendered it in chalk, vectorized it and am now attempting to copy it from ai into Fontlab. I have even tried copying it into Fontographer. Is there anyone out there that can suggest a work flow that will help me achieve success? Are there preferences that I can change that I am missing?</p>
