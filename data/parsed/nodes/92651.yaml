    <p>Hi Guys,</p>
    <p>I'm trying to identify the script font used at the bottom of this logo in "Spirit of Kent" but so far my attempts have proved unfruitful.<br>
    I think the K is particularly identifiable.</p>
    <p>Logo:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ks_logo_master_small_6379.jpg"></div><p></p>
    <p>Straightened extract (t, o, f and K):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-2_4526.jpg"></div><p></p>
    <p>(If anyone also recognises the font used for "THE KENT SPITFIRE that could also come in handy although I've already found 2 close matches:<br>
    <a href="http://www.identifont.com/find?font=CG+Alpin+Gothic+No.+1&amp;q=Go" title="http://www.identifont.com/find?font=CG+Alpin+Gothic+No.+1&amp;q=Go">http://www.identifont.com/find?font=CG+Alpin+Gothic+No.+1&amp;q=Go</a><br>
    <a href="http://www.identifont.com/find?font=Titling+Gothic+Compressed&amp;q=Go" title="http://www.identifont.com/find?font=Titling+Gothic+Compressed&amp;q=Go">http://www.identifont.com/find?font=Titling+Gothic+Compressed&amp;q=Go</a> )</p>
    <p>Thanks in advance :)</p>
