    html: "<p>As past mod (well before I was into type stuff, around 1983-1987), I will say that the best its perhaps to look at records sleeves? Looking to Mods websites can be good idea too, such that page: <a href=\"http://www.bomp.com/BompbooksMod.html\" target=\"_blank\">http://www.bomp.com/BompbooksMod.html</a> or such <a href=\"http://www.modculture.co.uk\" target=\"_blank\">http://www.modculture.co.uk</a> (look at them via google) <br> <br>The main references of the 60's Mods, after British pop, was Motown and Stax records and Blue Note (in early days). So, looking to such records sleeves too can give you good indication. <br> <br>To me, there is no real special typefaces but yes, Chalet is a good start. Mod is more patterns, such all pop art ones <a href=\"http://www.modculture.co.uk/art/\" target=\"_blank\">http://www.modculture.co.uk/art/</a> and the targets, arrows associated with type, like the famous The Who logo.</p>"
