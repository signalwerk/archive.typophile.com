    html: <p>Mod as in British mid-60s, right? Monotype Grotesque and Gill Sans were standard workhorse sans serif families of the era, Times would probably be appropriate for a text font. As far as display stuff compressed grotesques &amp; gothics were common -- Bureau Grotesque and Compacta would be reasonable simulations. Psychedelic stuff came later and was generally hand-drawn. Just please don't use that awful blobby Austin Powers font.</p>
