      <p>Just this quickly, I'm struggling for time…<br>
      Lining things up is certainly a very human impulse. :-) One thing about type design though is that – especially in text type, and very especially in text type for smallish sizes –, there's much less of a point in actually lining stuff up mathematically. It has to look/feel/work right, and for example small caps often look too small when they're exactly as tall as the x-height.<br>
      In such cases, I'd say quickly trying out 2 or 3 different sizes and trying to see what looks and feels better is much superior, as a method, to lining things up and then trusting it <em>needs</em> to «look right», well, because it «is right». :-)<br>
      You'd need to, of course, mix words in smallcaps into running text to see how well it works. BTW, regarding your sample, I'd strongly advise for ragged-right text setting (also linksbündig/Flattersatz für den Lauftext), otherwise it is near impossible to see how the spacing and texture of the font really is.<br>
      Cheers!</p>
