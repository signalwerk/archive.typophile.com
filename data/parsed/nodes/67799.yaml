      <p>Thanks for droping by Nina. (:</p>
      <p>You convinced me. I will do tests with height of small caps as soon as I get into near of an laser printer. You are absolutly right. Mathematics are most often not the best solution to pick when designing a typeface (curves seem thinner, crossed lines broken, overshoot, etc.). I just wasn't aware of that optical effect (small caps looking smaller than aimed for). I have to admit I spend much more time in the lowercase characters than the small caps. Shame on me. ;)</p>
      <p>Thanks a bunch for your advice about alignment of the specimen. I spend so much time in FontLab and I tend to mess everything up because I am not patient enough with actually setting it in InDesign. I just forgot (how could I?) that justified text brake up the wordspace.</p>
      <p>New PDF with text aligned left is attached to first post.</p>
