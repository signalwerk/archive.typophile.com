      <p>Hi David, I'm really not *such* an expert but here are some thoughts. Take with a grain of salt, or two :-)<br>
      I think this is already quite nice! The texture is good and it reads nicely, even in small sizes. Nice degree of character too. I hope you have the patience to spend some more time ironing out the little wrinkles (zooming in reveals the curves still need work).</p>
      <p>Especially the lowercase reminds me a bit of <a href="http://typophile.com/node/65841" rel="nofollow">Ben's work</a>, in terms of its slightly gummy friendliness. One thing I'm not sure about are the rounded corners on straight ascenders and descenders. That seems potentially gimmicky. I love what that «curvy corner» does on the descender of the "j": there it quite successfully hints at a curve that isn't actually there. Same in the "q" maybe (where I'd actually put it the other way round). But in the "h" etc, it's not supposed to be a curve – the rounding just seems to be «decoration»? Thing is, people may see it as a «curve» there as well – and then it can make the letters look a little backslanted.<br>
      But maybe that's just me.<br>
      Also:<br>
      - Some of the straight-to-curve transitions, especially on «inside» contours, are bumpy and jarring, like in the "u".<br>
      – "t" seems a little unhappy. Maybe needs a more stable foot? And/or make it [more] off-vertical.<br>
      - I'm not sure the shape of the "a" is different enough from the "o".<br>
      – Diacritics: Why is the tilde cut vertically, not perpendicular to the stroke, as with other diacritics (see the caron)? Also, I think the ring is too small.</p>
      <p>Caps: I enjoy the technoid rounding. But the lowercase feels more coherent; I'm not quite sure all caps speak the same (stylistic) language yet. The "B" for example is bumpy and a bit strange in terms of how it flares its strokes, while other caps are very straight and rigid (like the "E"). The "G" isn't yet sure where it's going either. "W" is wide. "J" is cool, but I'm not sure that corner works in the context of your soft, curvy caps. Maybe there *is* a coherent system in all this, I'm just not really seeing it right now. :-\<br>
      Also:<br>
      - I like the "R" a lot, but something with the contrast isn't right – its right side seems much heavier than the stem?<br>
      - The "M" has quite unconventional stress too, is this intentional?<br>
      - Bottom-left of the "U" (and others) are bumpy, see above.</p>
      <p>Smallcaps: I really dig the rounded slightly-stressed flavor.<br>
      - Are they the exact same height as the lowercase? You *can* make them taller – trust your eye. To me they now look possibly too small.<br>
      - Widths and spacing might need a little more work.<br>
      - I'd make the smallcap "G" a bit narrower, and possibly lower its crossbar (and maybe make it a bit longer).<br>
      - Smallcap "Q" might benefit from a stronger tail.</p>
      <p>Numerals are very cool!</p>
