    <p>Hi! :)</p>
    <p>Here is my first approach on type design. It's a friendy sans serif font with slightly rounded corners, large x-height and wide lettershapes. It's name says it all – designed to be used for body copy in magazines in around 10 point size.</p>
    <p>Because it is supposed to be used in print, it lacks of proper hinting (autohinting only actually), so tons of hinting errors may occur. Sorry for that. I hope I can improve hinting as soon as I find some advice how to hint a font properly. See (or even better print) the pdf for a better view on Brevier Ten.</p>
    <p>Brevier Ten features some OpenType functionalities like ligatures, discretional ligatures, contextual replacements, lining and old style numbers, caps, historical forms and ISO-Latin 1-3 Glyphs.</p>
    <p>Dan Reynolds helped me allready A LOT with the process of designing this font, so thank you very much, Dan. :)</p>
    <p>I'm really looking forward to read your thoughts, critique and suggestions on this! So fire at will. ;)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/brevierten_specimen2_3964.jpg"></div><p></p>
