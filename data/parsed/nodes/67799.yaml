      <p>Wow altaira, thank you very much for your detailed feedback! I read it like the 5th time and I really enjoy your view on the design! :)</p>
      <p>Some questions/thoughts on your input:</p>
      <p>- You are absolutly right with the "curvy corner" thing going on with all the descenders and ascenders. It's more an decorative feature. I now think about dropping it and making all the ascenders plain like the "I" but keeping the curvy corner on "j" and maybe even bring it to "J", however I fear "J" would not be distinctive enough then.</p>
      <p>- I'll check contrast of "R". All curves are ca 10 Units heavier than the verticals for optical compensation. Maybe the "foot" of "R" is optically too heavy, even if its the exact same width than all similiar diagonals. And even the width of the vertical stem in this case.</p>
      <p>- "M" differs in width of the stem from all other capitals, indeed. Mainly because I had serious color/texture problems with "M" and "N". So I made their vertical stems 20 units smaller than all other vertical stems to get it brighter. And I pulled the outer stems in a slight diagonal position get more whitespace on the inside of "M". You are right, thats a really bad solution, since it's the only character with "semi diagonal" stems. I will try to redraw them from scratch.</p>
      <p>- The straight-to-curve transitions … I have problems to see which are bumpy and which are not but I am sure that is because I am such an beginner. :) I will review all the transitions. Do you have a hint how I can draw them smother?</p>
      <p>- You are perfectly right on "B". I will redraw it from cratch. :)</p>
      <p>- "J" has a unique descender indeed. One of those "happy little incidents" i liked and kept. ;) There is no coherent system in that, so it is not your fault. :) I will think about what to do there. Thanks again for your detailed feedback here! :)</p>
      <p>- Smallcaps are exactly the same height as the lowercase. Thats one of the "coherent ideas" in this font. A lot of aligning heights are shared by different features. Like the height of diacritics is also the cap height. Maybe that is too much here. I am not sure about that.</p>
      <p>Again thank you for your feedback. :)</p>
