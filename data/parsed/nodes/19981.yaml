      <p>Whether you choose to work with a reseller or a foundry there really are no words to express the feelings when you get that royalty statement and you see that your take on a sale is $2.20. Everyone takes a cut and you the designer are left with the short end of the transaction. Even if you are promised a particular percentage, you have to remember that the reseller may sell to another reseller who then bundles your fonts to another reseller.</p>
      <p>Early im my career I Iicensed some fonts to FontHaus, boy, ya gotta love those $3.25 royalty checks. I have a whole bunch in a pile on my desk uncashed. They are worth so much more as a reminder. And those ITC royalties, wow!</p>
      <p>My advice is to manage your own intellectual property. An e-commerce web site, a EULA, some marketing, yes it all costs money, but what is that old saying about spending money to make money. But only if you are serious about making some money in the type business. And don't pay any attention to all those Typophile members who keep carping that you can't make money doing type. Those are the people who haven't figured out how to do it. Believe me you can make money in type.</p>
      <p>James</p>
      <p>PS- Stephen, in a thread like this don't you think you should make it clear that you work for FontShop.</p>
