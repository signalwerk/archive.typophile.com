      <p>Well, Josh...you are asking questions that I did years ago. I can sympathize. But I think I have a unique perspective on this.</p>
      <p>I released my first few fonts with T26 several years ago and continue to release with them. I was so eager, so willing to do whatever I needed to get published. Despite what anyone says, how they put it, or whatever degree of cool bravado they might toss out...it's really cool to see your fonts for sale, to see them being used, to see them in print. In time, that cool factor evolves into 'what can I do to make more money, what can I do to get recognized more' and so on. I think people on this post have offered some great advice, but it is important to realize...you ultimately can control this. I sell my work with T26, Veer, MyFonts and my and Silas' new baby, TypeTrust. I appreciate them all.</p>
      <p>I have tried it all. Small foundry, large foundry, self-publish...they all have their benefits and each has benefitted me. The attitude I have taken of late is that I love type and I want it diefied and its creators as much as possible. Greater attention to detail, perfection of the craft, finding niches that I can explore creatively, using my resources to create a platform that I can present my work and others that truly showcases the artist's work. It sounds a little over blown, but it is an exploration...the same as picking up the pencil and sketching something out on paper to see if it works....sometimes it does, sometimes it doesn't.</p>
      <p>The important thing to realize is that there really isn't one right answer. Just keep trying, know that you will never do your 'best work' with any one arrangement, and sometimes even the coolest typeface won't make you a dime and the one you spent the least time on will buy you a car.</p>
      <p>Keep sketching. Every 'successful' type designer started somewhere.</p>
