      <p>And a point of clarification about companies that own both a foundry/label and a reseller operation.</p>
      <p>Monotype is a <em>foundry</em>. Fonts.com is a <em>reseller</em>.<br>
      Both are owned by Monotype Imaging.</p>
      <p>FontFont is a foundry. FontShop.com is a reseller.<br>
      Both are owned by FSI FontShop International.</p>
      <p>GarageFonts is a foundry. Phil's Fonts is a reseller.</p>
      <p>Umbrella* is (sort of) a foundry. Veer is a reseller. </p>
      <p>*I take mild exception to the claim that Umbrella is a "Veer Exclusive". Many of the fonts in the collection, such as Underware's and Mark Simonson's, are available elsewhere. Rebuttal, Grant?</p>
