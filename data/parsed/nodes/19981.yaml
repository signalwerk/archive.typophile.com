      <p>I am an old geezer as well. I quite remember plenty of lousy stuff from years back.  The difference is, the crap gets buried in the sand and people only remember what they want to remember. In  the 50s, lots of very bad typography ended up being used to wrap the garbage. I remember Paul Rand and had the brief privilege of working with him.  I also remember plenty of design hacks back then who are just as bad as any recent design hacks. Time sifts our memories and leaves us with the few grains that mean the most to us. Today, the technology speeds up the process so more stuff gets done quicker prompting quicker deadlines and quicker technology to meet them. The percentage is the same but the volume in 10-fold greater.  We can't go back to the "good old days" of our youth but we can do what we can to make today work better than it does.  This is more likely to succeed if we old fogies teach by example and give reasons with sound judgement spiced with some anecdotes to describe what we mean. We geezers can't just shout "everything you young folks do is wrong" and expect to be listened to. We should be teachers, not impeachers. I'll bet GOB has some sound advice to give and I'll bet that advice would be listened to more with reason than with rant if he would give it a chance?</p>
      <p>ChrisL</p>
