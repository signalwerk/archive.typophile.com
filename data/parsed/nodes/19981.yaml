    html: |-
      <p>We should make the distinction between a "foundry" and a "reseller". Basically, you have two options:</p>
      <ol>
      <li>Submit fonts to an existing foundry (i.e. Emigre, FontFont, Font Bureau, ITC).</li>
      <li>Create your own foundry and sell those fonts through resellers like MyFonts, FontShop, Fonts.com, and Phil's Fonts.</li>
      </ol>
      <p>If you have several fonts ready to release and wish to create your own label (option 2), there is no reason you need to be limited to one of the resellers. Just remember that there is a lot of work besides font creation that goes into creating your own label - writing and maintaining a EULA, for instance.</p>
      <p>There are other advantages to going the first route. An exclusive foundry like FontFont will do the distribution and promotion for you (with your input and collaboration, of course). Your work will be advertised around the world in various outlets and in printed catalogs, and it will be attached to a trusted, established brand. In most cases, the foundry will be carried by more than one reseller, further extending your reach. Some foundries will also help you complete the development of your fonts.</p>
      <p>Some like to release their early, more experimental work for free or through MyFonts. Once they've cut your teeth and created something they feel really confident about, they look to an established label to help it sell well.</p>
      <p>Many designers release work through various foundries throughout their career (Xavier Dupré, Akira Kobayashi, Jim Parkinson). Sometimes a certain style simply fits in one foundry's library better than another's.</p>
      <p>Much of this decision depends on how much time and effort you're willing to put into promotion and business, and what type of fonts you've created. Tell us more.</p>
