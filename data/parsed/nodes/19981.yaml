      <p>In 2004 an email from Monotype droped in my mail box with their contracts and some technical stuff (FontSubmissionKit). But some well informed people suggest me to stay from it and don't join fonts.com. Maybe the documents are a bit outdated, but they are no secrets. </p>
      <p>After all, the big issue I miss on the side of the big distributers is, they don't see us as partners! A lot of the type designers are well qualified technical font developers too. They deliver a "ready for shipment" product. But in general, their contracts are written in a manner of taking out a maximum of your rights. Some of them are essential goods and not necessary for a simple online distribution. </p>
      <p>For a pure online distribution its not necessary to give the rights:</p>
      <p>- to modify and convert your fonts<br>
      - to customise your fonts for "their" clients<br>
      - to bundle your fonts with other products to "new" products (e.g. CDRoms, OEM-bundles, font colletions)<br>
      - to sublicense it to other "distribution partners" of theirs</p>
      <p>So in the light of this, out of the big five, I can recommend MyFonts.com only. </p>
      <p>--<a href="http://www.astype.de" target="_blank" rel="nofollow">astype.de</a>--</p>
