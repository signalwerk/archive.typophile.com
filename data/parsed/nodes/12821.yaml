      <p>Peter,</p>
      <p>Futurist and Dadaist poetry come to mind as examples of pre-digital sub-culture typographic expressiveness….Marinetti, Apollinaire, etc. Johanna Drucker’s book “The Visible Word: Experimental Typography and Modern Art, 1909-1923” (University of Chicago Press, 1994) goes into great detail about their work…the punk fanzine aesthetic of the late 70s - early 90s established its own visual language (via typographic expressiveness) as a way of sub-culture identification…</p>
      <p>Have you checked out Saki Mafundikwa’s book <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0972424067/ref%3Dpd%5Fsl%5Faw%5Falx-jeb-9-1%5Fbook%5F5094816%5F3/002-3013161-5862407">Afrikan Alphabets</a>? He covers the writing systems of several African language, many of which were established during and post-colonial rule as a way of establishing and maintaining cultural heritage.</p>
      <p>This is <a href="http://www.typetalkfonts.com/frame_orthography.html">a paper</a> I wrote in grad school this year about non-standard orthography and non-standard dialects that you might find interesting…i cited Haitian Kreyol and Rastafarian Jamaican as examples where nonstandard orthography is used to express national/ social identity.</p>
      <p>Sounds like a good topic, good luck!</p>
      <p>amy</p>
