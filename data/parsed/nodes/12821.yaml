    <p>Hi again.<br>
    Thanks to the great feedback I got for my last post at this forum (<a href="http://typophile.com/node/12689">http://typophile.com/node/12689</a>), I understand this place is packed with people sitting on a lot of knowledge. Would therefor like to see if there are any interesting answers to this question:</p>
    <p>I am looking for examples/books/website/opinions etc on ways of using typography and written language in ways that have more of a “sub”cultural aspect to it. What I mean is groups of people, changing the way their (written) language is communicated, to state a belonging to a group or such. An example of this is “Leet Speak”* , used by computer gamers/hackers/etc. New ways of adding values to the written language, based on for example technical limitations.<br>
    There are more examples on this from the computer era (the smileys could be considered one), but I havn’t yet come across any from the pre-computer age so that is what I am especiallt interested in.</p>
    <p>I am also looking for ways of using existing typography in other visual ways, such as ASCII-art*, art done with typewriters, ANSI-art* etc etc. If you have other examples for this I’d love to know more about them.</p>
    <p>* More on…<br>
    Leet:<br>
    <a href="http://en.wikipedia.org/wiki/Leet">http://en.wikipedia.org/wiki/Leet</a></p>
    <p>An experiment with Leet and Caslon I did a while ago:<br>
    <a href="http://burnfield.com/peter/work/caslon-leet">http://burnfield.com/peter/work/caslon-leet</a></p>
    <p>ASCII-art:<br>
    <a href="http://en.wikipedia.org/wiki/Ascii_art">http://en.wikipedia.org/wiki/Ascii_art</a></p>
    <p>ANSI-art:<br>
    <a href="http://en.wikipedia.org/wiki/ANSI_art">http://en.wikipedia.org/wiki/ANSI_art</a></p>
    <p>Thanks,<br>
    Peter</p>
