    date_raw: null
    votes: null
    html: "<p>Another version is The Fontry's <a href=\"http://www.signweb.com/fontdownload/fonts.html\" target=\"_blank\"> ARB-85 Poster Script</a> - <br>and it's free! (there are two other Alf Becker digitizations <br>offered for free from here as well). <br> <br>Edit: Hey, the <a href=\"http://www.thefontry.com/scriptpak1\" target=\"_blank\"> ARB-85 Poster Script</a> that The Fontry offers <br>for free download directly from its own website (see the <br>links just above the 2nd graphic) differs from the one <br>above and is, in fact, precisely the same as the lettering <br>on the sign. <br><br></p>"
    html_clean: "<p>Another version is The Fontry's <a href=\"http://www.signweb.com/fontdownload/fonts.html\" target=\"_blank\" class=\"link-external\"> ARB-85 Poster Script</a> - <br>and it's free! (there are two other Alf Becker digitizations <br>offered for free from here as well). <br> <br>Edit: Hey, the <a href=\"http://www.thefontry.com/scriptpak1\" target=\"_blank\" class=\"link-external\"> ARB-85 Poster Script</a> that The Fontry offers <br>for free download directly from its own website (see the <br>links just above the 2nd graphic) differs from the one <br>above and is, in fact, precisely the same as the lettering <br>on the sign. <br><br></p>"
