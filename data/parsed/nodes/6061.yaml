    html: <p>It appears to be based upon some Alf Becker lettering, <br>judging from Letterhead Fonts' <a href="http://www.letterheadfonts.com/contributors/chuckdavis/posterscript.shtml" target="_blank"> Becker Poster Script</a>.</p>
