    html: <p> <br>someone had a photo of that same lettering on their site. <br>Was it Corey? <br> <br><a href="http://www.coreyholms.com" target="_blank">www.coreyholms.com</a> <br> <br>Anyway, I think it's just a fancy lettering job. <br>If it was anywhere, it would be in a PhotoLettering <br>or Sign Painter's catalog.</p>
