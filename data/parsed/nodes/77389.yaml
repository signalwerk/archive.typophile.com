    html: |-
      <p>Indeed, there is no search box or top nav, nor is the front page working.  The problems are not unique to Safari iOS but also to the few other WebKit-based browsers which also run on iOS.  It wouldn't take much to tweak the typophile site to fix these buggies, to be sure.  On the other hand, I have no problems using the site as is (and am posting from my iPad, in fact). </p>
      <p>Regarding Flash on iOS, to JamesM's comment, Jobs has done more than imply.  He has become quixotic in his mission to move the web beyond Flash.   In addition to Apple's perception that it is a CPU hog and buggy, the other reason it is very unlikely ever to be permitted on iOS is that Flash would permit the running of arbitrary (read : not Apple-approved) code on it's host device, which would defeat much of the purpose of "walled garden" security that Apple imposes through the ITunes approval process.</p>
      <p>James</p>
