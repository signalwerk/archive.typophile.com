      <p>Sabon is a close match to Mrs. Eaves (or should I say Mrs. Eaves is a close match to Sabon). </p>
      <p><a href="http://www.identifont.com/samples/emigre/MrsEaves.gif" title="http://www.identifont.com/samples/emigre/MrsEaves.gif">http://www.identifont.com/samples/emigre/MrsEaves.gif</a><br>
      <a href="http://www.identifont.com/samples/adobe/Sabon.gif" title="http://www.identifont.com/samples/adobe/Sabon.gif">http://www.identifont.com/samples/adobe/Sabon.gif</a></p>
      <p>Look at Monotype Sabon which is slightly more refined and narrower. I don't  have source to show you.</p>
      <p>Also, just found Arena New by Gunter Gerhard Lange on Berthold site. It's got a larger x-height and more condensed than Mrs. Eaves.<br>
      <a href="http://www.bertholdtypes.com/bq_library/90098.html" title="http://www.bertholdtypes.com/bq_library/90098.html">http://www.bertholdtypes.com/bq_library/90098.html</a><br>
      The sample is hard to review so I suggest downloading the PDF of Transitional type sample from their home page.</p>
      <p>---------------------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
