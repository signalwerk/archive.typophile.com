    <p></p><div class="imageWrap"><img src="http://typophile.com/files/GetAGrip_3532.jpg"></div><p></p>
    <p>Anyone have any ideas - it is obviously similar to courier, but a bit sleeker. It's wider, has ball serifs and some egyptienne traits (g, a, etc)</p>
    <p>I feel like i've seen it, but can't place my finger on it. The AD on the project is asking for an exact match. I've spent many hours coming...close - so bear in mind it needs to be really, really close/exact.</p>
    <p>Thanks!</p>
