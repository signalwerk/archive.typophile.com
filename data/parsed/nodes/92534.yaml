    html: |-
      <p>Sooner or later, you have to accept the fact that there are some limitations you cannot overcome.</p>
      <p>Although your targeted example says “17ppem,” the glyph itself is probably 14ppem high, or perhaps 12ppem. If the actual glyph height is an even number, you will <strong>never</strong> be able to center the midline: it will <strong>always</strong> appear either above or below true center. At larger sizes, the shift will be less apparent, but it won't go away entirely.</p>
      <p>Given that the 17ppem problem is insuperable, the solution to your problem is really quite simple: don't use the font at that size.</p>
