    html: |-
      <p>And by the way:</p>
      <p>"If the actual glyph height is an even number, you will never be able to center the midline: it will always appear either above or below true center."</p>
      <p>...is untrue. If the glyph pictured above were 16 pixels tall, the stems would each be 2 pixels, which subtracted from 16 leaves 10 — a number that evenly divides by two, enabling a centered mid-line. At 17, an odd-numbered pixel height, the mid-line would not center.</p>
      <p>I believe mid-line centering is about white pixels, not height pixels.</p>
