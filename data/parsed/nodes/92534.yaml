      <p>Regarding fixing it youself: I think delta instructions are the least intrusive way to fix this if you don't have access to the source files.</p>
      <p>If you use other instructions, the Control Value Table in the font has to be rewritten. I'm not sure how well FontLab handles that case, if something goes wrong then all kinds of bad things may happen.</p>
  - id: 507435
