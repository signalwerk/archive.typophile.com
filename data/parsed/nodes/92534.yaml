      <p>It is 8 ppem there. And yes I know that it's not possible to center a midline.<br>
      It's completely natural for Cyrillic letters if these horizontal stems are higher, than the letters' center. I recon there are some fonts, which have these stems quite high. And never lower than midline, even in Cyrillic handwriting.</p>
      <p>So as I said, they should be exactly a pixel higher.</p>
      <p>Jens, just curious, what software do you use for hinting?</p>
