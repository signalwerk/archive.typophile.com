    html: |-
      <blockquote><p>Jens, just curious, what software do you use for hinting?</p></blockquote>
      <p>We are using FontLab Studio. The problem, or rather just the way it works, is that FontLab cannot open a TTF and reconstruct the hinting "source code". For the most effective way to edit the TT hinting you need the source FontLab file. In your example screenshots, the alignment zones and stem width values are something that FontLab made up by guessing when it opened the TTF.</p>
