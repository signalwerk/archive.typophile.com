    <p>Hello Typophiles!</p>
    <p>It's been a while and I'm happy to announce that Chiq is up for grabs now.</p>
    <p>Chiq is a sans serif face inspired by Optima with a modern touch. It has 3 weights regular, medium &amp; bold with true italics.</p>
    <p>Spread the love =)</p>
    <p>Grab it <a class="freelinking external" href="http://www.andrewpaglinawan.com/typeface/ChiqFamily.zip" rel="nofollow">here!</a></p>
