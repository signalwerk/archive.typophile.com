    <p>Spring cleaning—I’ve been going through my papers and found some printed samples of 1966 typography studies from students in Basel. Always amazing.</p>
    <p>A friend emailed some PNGs of a face she’s working on—very fresh and multi-dimensional. So I’m sitting here at the kitchen table with a large “A” on my laptop and in the distance, in my field of vision is Tom Geismar’s “Z” poster.</p>
    <p>So I’m wondering, what is it about letterforms, that psychological something, that’s so evocative?</p>
