      <p>what is it about them... that’s a terrific question. they’re beautiful at times, coarse at times, crude, eloquent well-proportioned and gangly... really amazing.<br>
      i think sometimes though, it’s the incredible promise they hold. with letterforms, we can say anything. we can be shakespeare or tupac or basho or springsteen.</p>
