      <p>I agree that there is no reason not to use a condensed letter style for a logotype. But I can see a few problems with Futura condensed in this particular instance. The nature of the cap S is to be beautifully balanced, but arrayed against the lower case i the upper and lower counters appear too balanced and the S becomes somewhat unstable. I would be tempted to make a minor—and carefully crafted—adjustment to the S, slightly enlarging the lower space. The caps in Futura condensed can appear slightly too heavy and, in my opinion, the weight of the S, I, and extended l need adjustment. The spacing also needs some fine tuning. Ironically slightly open space may work better with Futura condensed, and especially in cases where it is a stark white on black, and may be all that is required to make the font work for this application</p>
      <p>Good luck.</p>
