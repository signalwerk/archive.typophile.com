    <p>hi typophiles-</p>
    <p>I’d greatly appreciate any advice. I’ll try to provide details as per forum guidelines...</p>
    <p>I’m a newish designer, working with a great client. They’re called Sins Invalid, and they do performance and political organizing around disability and sexuality, etc. I’ve been designing most of their new materials over the past few months, and now I’m working with them to redesign their website. Here is their current site: <a href="http://www.sinsinvalid.org/events.html" title="http://www.sinsinvalid.org/events.html">http://www.sinsinvalid.org/events.html</a>. They are very attached to their current logotype, which is just the group’s name in Futura Condensed (see below). I have no formal typography training, but the condensed font for this use just rubs me the wrong way! My feeling/guess is that condensed fonts should only be used when space is really at a premium, not for a display purpose. The Futura condensed letter shapes just scream “smooshed” to me. I am trying to convince them to at least use a non-condensed Futura (also see below), which to me is elegant, especially by comparison.</p>
    <p>I’m not sure if there’s anything I can do to convince them, but perhaps your pearls of (more experienced) wisdom will help me either a)realize I’m wrong or b)give them solid typographic reasons that they should switch logo fonts.</p>
    <p>Thanks! Micah</p>
