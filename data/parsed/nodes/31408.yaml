    <p>I'm working on a project that has be coming up with a system, of sorts, that depends a lot upon color for differentiation and is to be used across different media. (For instance workbook covers and Keynote presentations.) </p>
    <p>This got me thinking what are some of your favorite ways color has been used in systems?</p>
