      <p>There was a book I saw once (and I'll NEVER remember the name) where the footnotes were color coded (bars behind the text) and then placed - in their color - in the margins. It wasn't ideal for readability necessarily but it looked fantastic and was very easy to use once you got used to it. And this was not a reading book.</p>
      <p>I'd also check out children's textbooks - they do more with color than adult stuff.</p>
