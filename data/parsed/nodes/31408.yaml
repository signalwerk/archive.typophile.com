    html: |-
      <p>I've always liked duotones, especially when there's some selective masking or done with unusual spot colours.</p>
      <p>I'm impressed by the full-page, full-colour newspaper ads for Gwen Stefani's new tour, with the platinum and gold colour scheme, subtle bling -- like many tinted effects you can get with "full-colour" photoshop files it reminds me of those old duotone effects.</p>
      <p>I guess what I'm saying is that there are graphic possibilities in the way pictures can be integrated into a colour system.</p>
    html_clean: |-
