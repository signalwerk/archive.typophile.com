    html: <p>The way the entire Magic The Gathering trading card game revolves around colors that defined the concepts behind the game is great. It's one of the most obvious parts of the whole rule system, but it quickly becomes subtle and makes way for gameplay mechanics which include a huge collection of type and symbols.</p>
