    html: <p>It is very close to Requiem, specifically to the Text Roman, but not identical. Requiem has more of an arched curve, starting lower down the stem, and the bracketing of the serifs is not so heavy as in Dave's sample. And the beak of the ascender in Requiem points slightly down, while Dave's sample seems to angle slightly up.</p>
