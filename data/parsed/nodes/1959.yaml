  html: <p>I'm a student in a graphic design class at school and my teacher gave us a challenge to figure out what font this letter is in.  It's been 2 months now and no one has figured it out.  I came across this website which looks like the people know their stuff, so i thought I'd try.  I only have ONE letter unfortunately.  i guessed Centaur, but he said it was wrong.  o yea, he wants the designer too.  thanks for any help.<img src="http://www.typophile.com/forums/messages/83/19868.jpg" alt="font"></p>
