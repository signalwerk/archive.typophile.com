    html: <p>it's blurry because it was actually mirrored on our syllabus and I took a pic of it and reversed it and blew it up.  thanks for the responses, i'll try Venetian301 today when I go to class.  I took an h from centaur, blew it up to the same size and put them over each other they matched perfectly, so I was shocked when he said I was wrong, but hopefully Venetian works.  And it's not cheating, it's using all available resources :-)</p>
