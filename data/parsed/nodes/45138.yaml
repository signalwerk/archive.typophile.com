    <p>Because I hate domestic air travel and would like to save some money, I am thinking about driving from DC to Typecon. It looks like about an eight-hour drive in a big Mercury with a nice sound system and cushy leather seats. Anyone else want to join in, take turns driving, and split gas costs?</p>
