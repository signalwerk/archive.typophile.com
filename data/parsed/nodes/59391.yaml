    html: <p>I thought Olympics as well, mostly because of the colors or the "ribbons," which are, if not identical, very similar to ones in the Olympic rings. People can't really give a very good critique unless they have more context, like what is this logo for? Where will it be used? Also, I think you'll find a lot of resistance here for no other reason than this is for a design contest. The vast majority of users here (myself included) do not approve of commercial design contests. Troll a bit and you're sure to find several threads which will explain that position more fully.</p>
