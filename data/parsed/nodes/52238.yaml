    <p>Good Evening fellow people.</p>
    <p>I'm a student and need a little assistance.<br>
    In current brief I have been set out to find examples of where this typeface has been used.</p>
    <p>I have found the common Morrisons offers and Ups logo, and also the recent Don't Blink campain in this months Focus mag. But I was wondering if anyone knew of a higher level of design it has been put into. If it be the main face or a subordinate face.</p>
    <p>Many Thanks in advance, and I look forward to your replies. </p>
    <p>Ash</p>
