      <p>Hi all, </p>
      <p>Thanks very much for your suggestions. </p>
      <p>I'd say the price range is £5 to £15. </p>
      <p>Should have said that I already own Leslie Carbarga's 'L,F&amp;LBible' and Ellen Lupton's 'Thinking with Type'. Ta though.</p>
      <p>'The Stroke' by Gerrit Noordzij was something I'd had a look at. It deals with constructing typefaces from the point of view of the written letter. I was wondering if anyone knew of any books that approach type design from the opposite point of view; rejecting the stroke and considering each glyph as a collection of shapes? This is something that I am equally interested in. </p>
      <p>[I'm not trying to start an argument about which is the right approach here, I'm just intrigued by both perspectives]</p>
      <p>Thanks for your help, </p>
      <p>G</p>
