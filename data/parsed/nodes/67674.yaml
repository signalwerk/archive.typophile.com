    html: |-
      <p>re. The Stroke: <em>It deals with constructing typefaces from the point of view of the written letter.</em></p>
      <p>Well, no, it doesn't deal with ‘constructing typefaces’ at all. I'm not sure that type is even mentioned in the book, except perhaps in passing. It's an approach to analysing and understanding what is happening in letterforms in terms of stroke construction. As such, I'd say it is a fundamental text, even if one's approach to type design is more or less independent of such analysis. It's not about a right or wrong way to design type, but about building analytical toolsets that enable one to understand what one is doing and looking at. I'd love to be able to recommend another book that provides a comparable analytical approach to letters ‘as collections of shapes’, but to my knowledge such a book doesn't exist. Perhaps because type designs approached in such a way tend to be individual, so there is no common model that can be applied to their analysis.</p>
      <p>By the way, Walter Tracy's <em>Letters of Credit</em> remains one of the best books on the subject of type design.</p>
