    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MessyLinocut2D_720x360_02_5268.png"></div><p></p>
    <p>Don't try to find logic in this font, nor the harmony of the forms.<br>
    It is meant to be crank. All the letters were first cut in linoleum and then digitized. Hence, everything is alive. You will find no uniform elements. We think this font will find its use in the hands of a brave designer.<br>
    Designer: Nika Nekrasova</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MessyLinocut2D_720x360_07_4278.png"></div><p></p>
