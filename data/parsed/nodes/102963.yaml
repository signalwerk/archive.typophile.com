    html: |-
      <p>There's a nice collection of types of this style here: <a href="http://bowfinprintworks.com/BauhausFaces1.html" title="http://bowfinprintworks.com/BauhausFaces1.html">http://bowfinprintworks.com/BauhausFaces1.html</a><br>
      I think it's not a font because<br>
      1) the way e-d and e-n connect seems so specific to those particular combinations - that n shape in particular would basically only work after an e, which is not how fonts work.<br>
      2) there's only three different letters and they are very simple geometry, making the built-from-scratch theory more likely.<br>
      3) there is clumsiness in the drawing (where the strict geometry creates awkwardnesses) that you're more likely to find in a one-off than in a *professional* font design (though of course amateurish fonts abound too).</p>
