  html: |-
    <p>I’ve got some odd behaviour testing my PostScript flavoured OpenType that I suspect is down to the naming of certain glyphs. I wondered if anybody could shed some light on where I’ve gone wrong. I spent a long time matching my glyphs to the exact spec in the FontLab manual too, so I’m a bit frustrated.</p>
    <p>In InDesign some of my oldstyle numbers are jumbled. If I add a 1, say, I get a 2!</p>
    <p>It could be down to bad Unicode names too. I used FontLab’s Generate Unicode tool to populate as many Unicode points as possible. I’m wondering if that was my bum move.</p>
    <p>Testing with FontQA does bring up naming issues though, listing the following as errors. </p>
    <p>All my small caps, which are named, <em>A.smcp</em> etc.<br>
    All my proportional lining numbers, named <em>zero.fitted</em> etc.<br>
    All my tabular oldstyle numbers, named <em>zero.taboldstyle</em> etc.<br>
    And all my proportional oldstyle numbers, named <em>zero.onum</em> etc.</p>
    <p>Looking now, <em>zero.taboldstyle</em> seems to be an erroneous format, but then, the others fail the FontQA test too. Maybe <em>zero.taboldstyle</em> and <em>zero.onum</em> are in fact equivalent, which may explain InDesign’s confusion.</p>
    <p>Hmm. I’m stuck I suppose. Anyone able to suggest what the names should actually be?</p>
