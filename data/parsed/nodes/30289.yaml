      <p><cite>How can we get this fixed? It’s driving me nuts. My three or four emails...</cite></p>
      <p>Well, you could try just emailing Steven Heller directly; his email address is on his web site. But if you keep emailing people at the times they’ll eventually decide you’re a nutter.</p>
      <p><cite>How much of an issue should this generally be?</cite></p>
      <p>Given that only anal retentive designers care, and the general public is essentially ignorant of the issue and quite happy to use tick marks instead, it really shouldn’t be much of an issue. What we really need to do is get a competent US government willing to throw out the English measurements so those stupid inch and foot marks can come off of keyboards altogether.</p>
