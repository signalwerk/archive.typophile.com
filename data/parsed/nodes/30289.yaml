    <p>A few times over the past year I have sent emails to The New York Times to inform them of an improper apostrophe that appears in the subscription information alongside the daily crossword. You’ll find it in the word “Today’s” in the following:</p>
    <p>Annual subsriptions: Today’s puzzle and more than 2,000<br>
    past puzzles, nytimes.com/crosswords ($34.95 a year)</p>
    <p>Regarding this I have two questions:</p>
    <p>1. How can we get this fixed? It’s driving me nuts. My three or four emails to The New York Times and to its public advocate went unanswered.</p>
    <p>2. How much of an issue should this generally be? The vertical mark is used constantly in lieu of the “smart” curling apostrophe. I’ve been educated and appreciate the curling apostrophe. Tick marks are eyesores but it seems silly sometimes to make such a fuss about a miniscule detail in typography - seems to over-emphasize the grammatical aspect of an otherwise complex art.</p>
    <p>Any thoughts?</p>
