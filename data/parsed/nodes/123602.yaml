      <p>Hobo, for everything except the |g|:<br>
      <a href="http://www.myfonts.com/fonts/linotype/hobo/" title="http://www.myfonts.com/fonts/linotype/hobo/">http://www.myfonts.com/fonts/linotype/hobo/</a></p>
      <p>For the |g|, Geometric 415 (Bitstream’s version of Metro No. 2) works nicely:<br>
      <a href="http://www.myfonts.com/fonts/bitstream/geometric-415/" title="http://www.myfonts.com/fonts/bitstream/geometric-415/">http://www.myfonts.com/fonts/bitstream/geometric-415/</a></p>
      <p>And yes, the vibe is very 60s or 70s (Hobo saw a resurgence in use at that time), but the typeface actually dates from 1910.</p>
