    html: |-
      <p>The thin 'sexy' lines of Neue Helvetica Ultra Light is often used to convey luxury. And generally speaking the whole entire family of Helvetica is a good choice.</p>
      <p>Bickham Script is definitely opulent. Optima connotes clean classic chiseled lines.<br>
      I see Didot used at Saks all the time (Bodoni too).</p>
      <p>ITC Blair, Petras Script, and Mrs. Eves are also really excellent choices. </p>
      <p>There are about 5 billion other fonts that can convey a sense of luxury too, the key is the how will you use the fonts.</p>
      <p>Appropriate color harmony, granular adherence to the rules of typography, print material, and numerous other factors have play in the success of your project.</p>
      <p>What is your application?</p>
      <p>Mikey</p>
