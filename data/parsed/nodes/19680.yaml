    html: <p>I agree with Tiffany. I would also say that to create a real luxury brand ( which must by definition be unique in some way) requires vision &amp; innovation. To steal the style of existing luxury brands past or present is as easy as recognizing their formula &amp; using it or using it with a twist. There is of course some room inbetween &amp; no pure state per se. However I think it's best to stick to what Tiffany is talking about - creating a new idea of luxury that is aware of &amp; builds on history instead of wallowing in it.</p>
