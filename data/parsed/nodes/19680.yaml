      <p>Since it is for  the photography industry, I was thinking something art deco inspired yet accompanied by a flexible font family that can meet any challenge you could throw at it. Logos, signage, web, and print.</p>
      <p>My choice is Neutraface from House Industries. I can totally see this typeface being used to convey luxury for the photography industry.</p>
      <p>And then again, my second choice is Neue Helvetica matched with some other gothic/grot.</p>
      <p>Is this a high end processing lab, a studio, what??? Who are the clientele? Are they young or old? Where are you located? The point... there are different kinds of luxury. Classic, Sexy, Young/Trendy, Minimal, Rococo etc. Provide more info so I can help you better (if I'm helping at all ;O)</p>
      <p>As far as trying to develop new ideas on luxury or some other 'revolutionary' kinda thing... forget all that! If you do look at all (and I do mean all) the top luxury brands. They all follow a similar formula for conveying luxury. Trying to reinvent the wheel is not necessary. The general public expects things to look a certain way in terms of luxury. Cliche- maybe- but it works.</p>
      <p>Thin, sparse, sexy are mantras for luxury. And like you said consistent typography is the key.</p>
      <p>Hope I'm Helping,</p>
      <p>Mikey</p>
