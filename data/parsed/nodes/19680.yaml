    <p>I searched through the typophile archives and was looking for some good typefaces that might convey and solidify the idea of a luxury, exclusive brand but only came up with a thread about the typeface: luxury, which is about a exhorbitantly priced typeface that might not even exist.</p>
    <p>Would anyone be kind enough to throw up some suggestions?</p>
