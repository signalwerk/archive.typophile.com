      <p>personally if i think about luxury brand logos (normally fashion brands), it's usually an all text logo, black text on white, usuall all caps, usually with loose tracking between the letters and fairly often high contrast serif typefaces (think Bodoni), or thin/light typeface at least.</p>
      <p>just look at the logos of these brands: Armani, Bottega Veneta, Burberry, Calvin Klein, Chanel, Christian Dior, Fendi, Ferragamo, Gucci, Hugo Boss, Louis Vuitton, Marc Jacobs, Prada, Versace, Yves St. Laurent, etc. etc.</p>
      <p>of course, going that direction isn't exactly new and fresh, but i'd say that's how you emulate the luxury brand look.. and if it's a logo for a single photographer then it might work as the name of the person becomes the brand name, much like it usually is for fashion brands.</p>
