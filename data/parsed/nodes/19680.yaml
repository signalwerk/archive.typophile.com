      <p>There's also typography, the careful, artful and stylish USE of a carefully chosen typeface in conjunction with the specific imagery to convey an overall luxurious feeling. Even the most pedestrian typefaces, depending on the context, can be used in this way. You might be surprised to find Avant Garde, Helvetica and Times in use by extremely high-end merchants.</p>
      <p>Take a look at some of the current magazines hawking jewelry, perfume, shoes and fashions. Tiffany is right; it could be almost anything. There are a lot of esthetic codes to play off of and it would probably be misleading to suggest specific typefaces unless the other elements are present. </p>
      <p>Do you have a product? Does it contribute anything to the mystique and perceived value of the advertisement? </p>
      <p>Luxury, the typeface, does exist. It happens to be very exclusive, that's all. If you have to ask the price, well.... </p>
      <p>;D</p>
