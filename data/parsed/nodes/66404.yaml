    html: |-
      <p><cite>this seems so rare that I was suspecting some underlying big issue</cite></p>
      <p>Thinking about it, other than the inability to scream DAN BROWN or similia using all available space (mitigated by the better readability of horizontal text), the only other issue I can think of is with the type of binding. A used paperback book, one that was actually read, tend to develop vertical cracks along the spine. Vertical text would appear somewhat stenciled, but still legible until a certain point. The risk with horizontal text would be the cracks deleting single letters.</p>
    html_clean: |-
