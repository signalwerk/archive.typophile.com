  html: |-
    <p>Has anyone got nice examples to share of current books that have horizontal spine text, preferably set flush left / ragged right? I'm aware of the slews of classic books with centered horizontal text on the spine, but I'm looking for more current examples.</p>
    <p>Is this more popular with nonfiction than fiction? If so why?</p>
    <p>Also, any good reasons against doing this sort of thing (assuming of course that it works without making the text too small and/or causing uncomfortable breaks)?</p>
    <p>Thanks.</p>
