    html: |-
      <p>Interesting. I've been thinking about this as well of late. It seems that we've become quite used to tilting our heads (or our brains) to be able to read vertical text on a spine, especially when it reads from top to bottom (in North America). But on websites, magazines, or other collateral, it's not recommended nor is there a convention established.</p>
      <p>Does anyone know when vertically displayed text became a standard in book publishing or is it just a matter of longer titles and shorter books requiring it?</p>
