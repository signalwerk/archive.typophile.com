    html: |-
      <p>"What is the difference between a “Premium Typeface” and a non-premium?"</p>
      <p>Glad you ask!<br>
      The Premium Typefaces are more like a process or a service than just a collections of fonts.</p>
      <p>You can choose to license 10 weights, for instance, and that doesn't mean that the weights should be the ones available in my site because it's possible to customize certain aspects (weights, widths and few new glyphs) without charging extra money. Of course without exclusivity.</p>
      <p>This implies a more close relationship between designer-costumer, and I appreciate that. The client might need a not-so-condensed version of Prelo, and a weight between the Medium and Semi-Bold, to use in the cover of a magazine. It will allow the fonts to fit as perfect as possible, the costumer ideas.</p>
      <p>Dino</p>
