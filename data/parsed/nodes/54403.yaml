    <p>DSType announces the release of the new website and very soon a completely new online store will be available. The new site brings new typefaces: Dobra and Glosa Display.</p>
    <p><strong>Dobra</strong></p>
    <p>We proudly introduce Dobra, the redesign of a previous released typeface by DSType named Dione. We decided to keep the same basic structure but we added more style and personality, while gaining a few more weights and styles. Dobra is now more robust than ever and is available in five weights with matching italics and is a good choice both for publication designers and corporate identity.</p>
    <p><a href="http://www.dstype.com/index.php?id=59" title="http://www.dstype.com/index.php?id=59">http://www.dstype.com/index.php?id=59</a></p>
    <p><strong>Glosa Display</strong></p>
    <p>Glosa Display is the latest addition to the Premium Typefaces and the perfect companion to previously released Glosa. With it's extra high contrast for eye-catching feature titles and strong personality, Glosa Display is the ideal typeface for use in very big sizes, every time you want to achieve a stylish but classic look.</p>
    <p><a href="http://www.dstype.com/index.php?id=57" title="http://www.dstype.com/index.php?id=57">http://www.dstype.com/index.php?id=57</a></p>
    <p>Dino dos Santos<br>
    DSTYPE</p>
