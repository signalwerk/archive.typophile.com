    html: |-
      <p><cite>Why do you make a difference between the two?</cite></p>
      <p>Because SIFR does all the rendering server side while @font-face is redistributing my fonts for client-side rendering. And SIFR isn’t sending copies of my font to anyone who downloads it.</p>
