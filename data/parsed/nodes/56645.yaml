    html: |-
      <p><cite> For SIFR I expect the user to buy a per-server font license, but for @font-face I think a per web site license is more appropriate. </cite></p>
      <p>Why do you make a difference between the two? </p>
      <p><cite>As a designer would you be willing to license a font for every web site you embed it in? And would you object to an @font-face license being priced higher than traditional licenses that allow unrestricted use for static content?</cite></p>
      <p>Well, if you <cite>ask</cite> the users, they would probably say that a normal license should allow @font-face usage without any extra costs. The real question is: Will the pay extra when they have no other option? But that really depends on the font and (in most cases) the client of the designer.<br>
      A large corporation with a unique corporate font will probably be very happy to use their font online, even if they would have to pay an expensive server/website/annual fee. But for a fancy display font you might rather want to reach other users (but a lot of them) like bloggers who pay  tiny fee.<br>
      It's really hard to say at the moment. We usually establish the right price for something by comparison, but there is market for @font-face yet. So some vendors need to step forward and just try out different models.</p>
