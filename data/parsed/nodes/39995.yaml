    <p></p><div class="imageWrap"><img src="http://typophile.com/files/airheat_3738.jpg"></div><p></p>
    <p>This font is very similar to Gusto Black by Bob Alonso and Churchward Freedom by Joseph Churchward but the difference is the slant to the "A", the angle to the ends of the crosspieces on the "E" and "T" and the curve of and drop on the tail of the "R". </p>
    <p>I do not know if the "&amp;" is from the same font or was borrowed from another.<br>
    This is a vinyl sign.</p>
    <p>Kevin</p>
