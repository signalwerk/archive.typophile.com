      <p>Concerning the less relevant issue of what kind of system I personally work on: I've used computers since 1977, age 9. Contrary to what somebody who doesn't own a cellphone might seem to be, I'm no technophobe. I've called myself a "technoskeptic" :-) since I do feel I know when a technology is unnecessary to me personally, and I don't like just buying stuff, so I'm not into getting the latest-and-greatest; it just has to do what I need, and I'm not editing video! The time I spend staring at a glyph makes hardware performance moot. BTW, I'm on my fourth car, and none of them were bought new. I will move to Win7 one day (I avoided Vista - we probably all agree it sucked too hard) but just last month I bought a new 9-cell battery for my warhorse (after 5 years), for $35. Which is a nice segue to Apple, since gradually they're making their batteries non--user-changeable, and this belies a business philosophy I'm not alone in hating...</p>
      <p>Apple isn't "wrong" to sell stuff (except to the extent that Capitalism is wrong, and you can't blame individuals too much for the system they've grown up in) but I do feel that does not equate to the qualities that I personally value, not least functionality, yes, at the expense of popularity, superficial attractiveness, etc.</p>
      <p>All that said, nobody should ignore the reality that Apple <em>does</em> have a lot of presence these days, especially in the portable market; so testing on those platforms is critical. Which is why I'm grateful to LAUSD for putting a free Macbook about 3 feet away from me.  :-)</p>
      <p>hhp</p>
