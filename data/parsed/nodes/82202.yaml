      <p>Despite the fact that the human eye can indeed distinguish letterpress from 300 dpi laser printing, one has to admit that hinting would usually not be relevant there, except when one gets into the realm of microprinting.</p>
      <p>Also, while it is quite correct that abandoning the users of older or less-expensive devices is unconscionable, there <em>is</em> also the consideration that hinting is extremely problematic at the moment. The technology is essentially limited to proprietary environments because Apple still holds patents covering the use of hinting with TrueType. Of course, there's also the Adobe Type 1 font standard, and I remember hearing of a little-known third alternative outline font format which includes hinting (I can't find the name, but it may be one of Fastfont (Atech), Intellifont (Agfa Compugraphic), Nimbus-Q (URW), or Speedo (Bitstream); it definitely <em>wasn't</em> Metafont I was thinking of), but those are proprietary as well. (TrueDoc, derived from Speedo, does include hinting, so it might have been the one I was thinking of.)</p>
      <p>Thus, hinting is essentially unavailable with free distributions of Linux, which means that it would be highly desirable to be able to avoid it completely.</p>
