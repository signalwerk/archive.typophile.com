    <p>With the high res screens coming closer, (<a href="http://www.macrumors.com/2011/05/12/samsung-2560x1600-tablet-lcd-paves-way-for-ipad-retina-display/" title="http://www.macrumors.com/2011/05/12/samsung-2560x1600-tablet-lcd-paves-way-for-ipad-retina-display/">http://www.macrumors.com/2011/05/12/samsung-2560x1600-tablet-lcd-paves-w...</a>), I was wondering if hinting will still be necessary if fonts are rendered with the same quality as a magazine or a book on screen.</p>
    <p>Fonts being vector based, even zooming in won't impair any quality, so I'm not really sure if hinting will be necessary when all computers and portable devices are built with high res screens.</p>
    <p>Also, if hinting isn't necessary, will the font file be significantly lighter, allowing webfonts to include more otf features like ligatures?</p>
    <p>Thanks for your inputs on this :)</p>
  html_clean: |-
