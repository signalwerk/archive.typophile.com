      <p>Posted elsewhere:</p>
      <p><a href="http://prometheus.med.utah.edu/~bwjones/2010/06/apple-retina-display/" title="http://prometheus.med.utah.edu/~bwjones/2010/06/apple-retina-display/">http://prometheus.med.utah.edu/~bwjones/2010/06/apple-retina-display/</a></p>
      <p>“So, if a normal human eye can discriminate two points separated by 1 arcminute/cycle at a distance of a foot, we should be able to discriminate two points 89 micrometers apart which would work out to about 287 pixels per inch. Since the iPhone 4G display is comfortably higher than that measure at 326 pixels per inch, I’d find Apple’s claims stand up to what the human eye can perceive.”</p>
      <p>Se also:</p>
      <p>Curcio, C. A., Sloan, K. R., Kalina, R. E. &amp; Hendrickson, A. E. (1990). Human photoreceptor topography. <em>Journal of Comparative Neurology. 292</em>, 497-523.</p>
      <p>Long short, there’s only so much detail the human eye is physiologically capable of detecting. Sure, if we get in an look at the type 1 cm away we'll see a difference, but at 12 inches, ~300 DIP is our threshold. Beyond this neither resolution nor hinting make a significant difference.</p>
