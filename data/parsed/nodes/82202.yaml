      <p>A five minute search:</p>
      <p>Ziefle, M. (1998). Effects of display resolution on visual performance. <em>Human Factors, 40(4)</em>, 554-568.</p>
      <p><strong>Abstract</strong>: The role of display resolution in visual information processing was investigated in 2 experiments. Experiment 1 examined the effects of 2 CRT conditions (resolutions of 60 and 120 dots per inch [dpi]) and a paper control condition (255 dpi) on proofreading speed and accuracy. The results showed that reading performance was significantly better in the paper condition than in the 2 CRT conditions. Experiment 2 examined the effects of 3 different CRT resolutions (62, 69, and 89 dpi) on eye movement parameters (fixation duration and number of fixations) in a visual search task. Further, search reaction times (RTs) and observers' ratings of visual fatigue were analyzed. RTs and fixation durations were significantly increased in the low-resolution condition (62 dpi) as compared with the high-resolution condition (89 dpi). The significant interaction between display resolution and time both for search RTs and fixation durations was taken as evidence for stronger fatigue in the low-resolution conditions. Additionally, the extent of visual fatigue correlates both with search RTs and eye movement parameters. This finding gives rise to the assumption that observers' responsiveness to effects of display resolution in terms of visual fatigue differs markedly Actual or potential applications of this research include recommendations for the use of high-resolution displays (90 dpi and greater) to optimize visual performance, to make prolonged on-screen viewing more comfortable, and to avoid visual fatigue.</p>
      <p>Note the year. Old news. No electronic text is available from the databases and I do not have access to the paper version yet. However, it appears as though reading comprehension is not being measured. Knowing where and when people look, and how tired they “feel” doesn’t really tell us anything about comprehension. It’s entirely possible (and very easy to do) that an exact replication of this study could yield no significant difference in comprehension, were it to be measured. Give me another hour and I could probably find a study that supports (or refutes) this. Dyson or Larson have probably already done it. Again, I would need to read the entire paper to support or refute its conclusions.</p>
