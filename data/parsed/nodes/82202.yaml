      <p>@hrant:<br>
      That is a good point. Obviously, hinting is <em>necessary</em> if one is going to be using vector fonts, as opposed to bitmap fonts, on a display screen with conventional resolution.</p>
      <p>I'm not trying to say that people should give up displaying text on computer screens, I was merely pointing out that there is an issue surrounding hinting that does give a reason to try to do without it. Whether by using bitmapped fonts extensively, as is done to a large extent in the X Window System, or the brute-force method of increasing resolution beyond what would otherwise be reasonably required.</p>
