    html: <p>Eventually, sure, this will make hinting unnecessary for displaying text on those devices. Heck, it's already unnecessary for iOS because Apple's Quartz rendering engine ignores built-in hinting anyway. And yet this has approximately zero impact on font production, because what matters isn't the least problematic environments, it's the most problematic environments. So the question isn't just when we will start having noticeable numbers of super-high-res devices, it's when will we no longer have to worry about the other devices... and that will be many years later.</p>
