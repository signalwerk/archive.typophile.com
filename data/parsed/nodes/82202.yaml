      <p>DB: You're being more rude than seems called for under the circumstances.</p>
      <p>However, in the interests of accuracy, I will henceforth change my usual comment to one with the appropriately nuanced caveat, such as this: "With normal settings and sizes, iOS Quartz rendering completely ignores all hints in a font."</p>
      <p>The full explanation? At normally used sizes, with standard settings, Quartz ignores hinting. At *very* small sizes, it turns off anti-aliasing entirely and displays hinted, aliased glyphs. A user can change the default for the largest "very small size" if they like, to make it a bigger size so it will actually matter in practice. The possible range of settings is 4 to 12 pixels. The default is reportedly 8 px, which has no impact at what I think of as actually usable font sizes on screen. Even Verdana is not hinted to be usable at 8 px, as counters close up and the like. But I suppose that for the right typeface and if you were into extreme hinting, you might try to make something more workable at 8 px (or below).</p>
      <p>However, a user could increase that setting as high as 12 pixels, which would come into play quite a lot.</p>
      <p>So, yes there are some circumstances, with people who have changed their system settings, in which hinting matters in Quartz rendering. Or if you want to go beyond where mainstream fonts have tread to date. I have long regarded this as an extreme corner case, and used the more simplistic phrase about what Quartz does. </p>
      <p>Note: I haven't spotted a way to change this setting on the iPhone. Given the pixel sizes and resolutions involved, I'd say this really is irrelevant to the iPhone.</p>
      <p>T</p>
