      <p>The first Laserwriter was 300 dpi, and unsatisfactory for text type.</p>
      <p>Never mind high-res screens, I have always preferred letterpress to offset.<br>
      As the man said, we have two eyes.</p>
      <p>I also prefer rotogravure to halftones, and spot colour (including metallics and fluorescents) to CMYK.</p>
      <p>The nature of LED screens is quite different to print: it's transitory, emitted light—whereas with print the image is fused into the medium, and illuminated by reflected light — you can turn the image and it changes, and even without moving it, one is aware of the different effect of reflected light through two eyes. The printed image is an object, an artefact which may be possessed in a relationship that is more substantial and profound than that involving temporary images on a screen.</p>
      <p>Monitors are quite different to laptops and tablets. With monitors, the image plane stays relatively the same angle to the viewer, but with tablets, you can manually twist them away, more like holding a print document.</p>
