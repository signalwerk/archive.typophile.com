    <p>Hi,</p>
    <p>Within OpenType or TrueTpe fonts, can I make a decorative ligatures with long expressions or small sentences? Here is what I mean,</p>
    <p>I want a specific sentence when typed be turned into a symbol: love you -&gt; (a symbol), so that when I copy/paste the original text into a different environment (where there is not supportive fonts available) with newly obtained symbols I end up with my originally typed sentences.</p>
    <p>More specifically,<br>
    I am working on Arabic OpenType/TrueType fonts and want to design a fonts that's capable of converting some specific sentences into symbols such as:</p>
    <p><a href="http://img51.imageshack.us/img51/4577/47005124.jpg" title="http://img51.imageshack.us/img51/4577/47005124.jpg">http://img51.imageshack.us/img51/4577/47005124.jpg</a></p>
