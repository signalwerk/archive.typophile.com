      <p>Drogowskaz is based on the Polish road sign typeface, with its strange clipped e.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Polish_4512.jpg"></div><p></p>
      <p>I've never seen it used outside of that context before.</p>
      <p><a class="freelinking external" href="http://fonts.gestalten.com/planeta.html" rel="nofollow">Planeta</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/hvdfonts/brandon-grotesque/" rel="nofollow">Brandon Grotesque</a> are two other currently popular contenders for this look.</p>
