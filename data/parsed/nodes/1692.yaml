  html: <p>I know we've been thru this a couple of times, but I'm looking for a font utility, as it becomes clearer that FontBook will not work the way we like. Right now I'm using a demo of Suitcase 11, and it works alright (still miss ATM tough). But I haven't read anything about <a href="http://www.alsoft.com/MasterJuggler/index.html" target="_blank">Alsoft's Masterjuggler</a>, which seems to have a pretty neat interface. <br>Does it have auto-activation?  <br>Any experiences out there? </p>
