    <div class="info">Submitted by <a href="/user/2642" title="View user profile.">morten</a> : 17.Nov.2004 3.35am </div>
      <p>FF Max Demi Serif: <br> <br>The Demi Serif-versions, 7 weights, is designed 2003-04. The design comes as a personal wish to create a 'less technical-looking' version of my popular Max-family. Therefore, I have added a friendly, round serif on a, h, i, l, m and n. Letters as b, d, p, q, v, w, y are also changed, with a little bend on the stems, to 'erase' the very straight look and give a break in the line... <br>Also a great supply of flush-characters and ligatures is available from the Expert-files. To use in headlines and small pointsizes. <br>Will be released very soon at fontfont.com...Max type? Type Max!</p>
