    html: "<p>No match or name either and probably too late. Anyway, to me, the base looks like some sort of refined <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/hihretrofonts/figgins-tuscan\" rel=\"nofollow\">Figgins Tuscan</a> or <a class=\"freelinking external\" href=\"http://www.fontmenu.com/site/_Bujardet.html\" rel=\"nofollow\">Bujardet</a>. Even if you're clearly not after that, dropping here some alternatives I've encountered with during my search: MFC <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/monogram/mfc-budding-monogram\" rel=\"nofollow\">Budding</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/monogram/manoir-monogram\" rel=\"nofollow\">Manoir</a> and <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/monogram/mfc-chaplet-monogram\" rel=\"nofollow\">Chaplet</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/intellecta/azalleia\" rel=\"nofollow\">Azalleia</a> and <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/intellecta/menina-poderosa-ornaments\" rel=\"nofollow\">Menina Poderosa Ornaments</a> (foliage and floral ornaments, close to the ones of your sample)</p>"
