      <div class="comment-spam-body"><p>As I said in my first post, this is a hybrid of styles.<br>
      A thin formal Tuscan. MFC Budding has some similarity to this type of letterform, but is far from a match, except for the top of the _L_.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/MFCBudding_BEFL_4988.jpg"></div><br>
      Large spear shaped serifs. These remind me of the ones in Bodoni Poster Condensed Regular <div class="imageWrap"><img src="http://typophile.com/files/BodoniPosterCondensedRegular_EFLC_4192.jpg"></div><br>
      Don<p></p>
      </div>
