    html: |-
      <div class="comment-spam-body"><p>AFAIK this is not a retail font.<br>
      It could be a modern hybrid of styles produced for Cranes.<br>
      The base letters are in a style developed in the early 19th century, which is known as "Tuscan" and is characterized by the fishtail terminals.<br>
      The clean line rationalist structure and minimalist flower ornamentation reminds me  of some 18th century initials.<br>
      If you only need the letters _L_, _C_ and _I_ your best solution might be to have them scanned to make vector outlines for your laser cutter.<br>
      Needless to say, I could be wrong and someone has made this into a font. All I can say is that I have not seen anything like it in the sources, both printed and online, that I usually check.<br>
      Don</p>
      </div>
