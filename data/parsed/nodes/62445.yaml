  html: |-
    <p>Hi guys,</p>
    <p>Can someone please point me towards typefaces imitating (or close-ish to) those found in the 19th Century - particularly those of France (and Europe).</p>
    <p>I'm looking for serif typefaces than can be used for body text and headings, not script fonts. H&amp;FJ have a couple of nice ones, but I would like to look around before deciding what to purchase.</p>
    <p>Absolute accuracy to period is not vital - just something approximating it...</p>
    <p>Many thanks,</p>
    <p>Martin</p>
