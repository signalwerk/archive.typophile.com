    html: |-
      <p>While the term “legend” seems heroic, it is also pretty murky as well.</p>
      <p>Two questions. What specific geographic region and cultural influence does the type need to reference? What time period does the type need to invoke?</p>
      <p>Answers to both of those questions will narrow down the field of obvious choices to a mere few.</p>
      <p>If the client wants something more non-specific which can work for a variety of time periods and cultural themes, you might consider a good all-caps titling font. Adobe Garamond, Perpetua, Utopia and Goudy Old Style are a few that come to mind.</p>
      <p>I would suggest Trajan or Trajan Pro. It is a very attractive typeface. But it has been terribly overused for the past decade, especially on movie poster titles.</p>
