      <p>Wim's response is the sensible option: overprinting the black will improve the results; however, it won't completely solve the problem.</p>
      <p>Black ink appears black on paper because it absorbs—to a greater or lesser degree—all reflected light from the substrate beneath it. Metallic inks, on the other hand, are so-called because they reflect more light than ordinary inks do; therefore, even overprinted black isn't going to look entirely black. But it will look better than what you're getting now.</p>
