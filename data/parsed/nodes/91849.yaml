    <p>Hello</p>
    <p>I’ve got a problem with trapping:<br>
    Diagonal lines (0.25pt) with a black PMS color that are on top of a gold surface.</p>
    <p>- The lines are PMS black and have a 0.25 pt line-weight.<br>
    - The area where the lines cover the gold are extracted from the gold.<br>
    - The golden object is given an outline stroke (centered) of 0.14 pt and set to overprint.</p>
    <p>What happens is that the gold overprints the black, but the black lines are so thin that the remaining line-weight ends up at 0.11pt! (0.25-0.14pt).</p>
    <p>What’s the best way to fix this?<br>
    - Let the black lines overprint the gold?<br>
    - Let the gold overprint the black lines but change the line weight</p>
    <p>Hope theres someone who can help me out,<br>
    Thanks!</p>
