      <p>"Let the black lines overprint the gold?"<br>
      I don't fully understand what you're doing there, but that sounds like that's you're best bet. Especially when lines are that thin. Anytime you have thin lines you are forced to over print them onto what ever is beneath them. What else can you do? And I would not double print lines that thin. If the second printing's registration is off one little bit it will screw it up.</p>
