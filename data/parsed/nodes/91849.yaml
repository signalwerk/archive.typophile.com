    html: <p>@oldnick, the more inks you have mixing together to make a hairline, the more danger you have of mis-registraion and fuzzy multicolored lines. If you want a 100 percent guarantee of a sharp line, you use only 1 ink for that line, and you overprint it onto what's underneath, without trying to do some kind of tricky knockout. That's not called trapping. That's called VERY VERY VERY VERY risky business.</p>
