    <p>Dear Typophiles,</p>
    <p>I know you are not the support-forum for adobe, but maybe someone knows anyway:<br>
    I registered my copy of CS2, to get my “free Garamond Premier Pro” as a benefit, but after registering via help —&gt; registration and filling out the form, nothing happens.<br>
    Further, I don’t find any information on the adobe website how to get the font, the only information I can find is that der *is* the font as one of some possible bonus (the same information I already have printed in my manual addition).<br>
    ... But no forms, logins, download-links...</p>
    <p>Thanks for your help<br>
    Sebastian</p>
