    html: <p>Former collegues bought me a copy of The <a class="freelinking external" href="http://www.amazon.co.uk/Manual-Bookbinding-Thames-Hudson-Manuals/dp/0500680116/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1273523350&amp;sr=8-1" rel="nofollow">Thames and Hudson Manual of Bookbinding</a>, which is serious &amp; detailed, assuming you're <em>not</em> after artsy-craftsy bookbinding, but <em>proper</em> (ahem) stuff.</p>
