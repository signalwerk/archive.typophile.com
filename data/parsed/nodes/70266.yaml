    html: <p><em>Proper</em> is relevant. Maybe the "proper" binding for a booklet is a French-folded folio with a 4-hole Japanese stab bind, because the booklet is about the history of Japanese prints? Or maybe it's a 2 inch thick journal and it needs a good ol' coptic stitch? :)</p>
