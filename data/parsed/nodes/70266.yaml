    html: <p><a href="http://www.amazon.com/500-Handmade-Books-Inspiring-Interpretations/dp/1579908772/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1273463438&amp;sr=8-1" rel="nofollow">500 Handmade Books</a> is a great visual reference, although it doesn't really go into detail on how to build. For that, <a href="http://www.amazon.com/Cover-Creative-Techniques-Beautiful-Journals/dp/0937274879/ref=sr_1_1?ie=UTF8&amp;s=books&amp;qid=1273463503&amp;sr=1-1" rel="nofollow">Cover to Cover</a> is one of the best I have found.</p>
