    html: <p>I like <a class="freelinking external" href="http://www.keithsmithbooks.com/" rel="nofollow">Keith Smith's books</a>. There are lots of them but they all demonstrate lots of techniques (the Non-Adhesive Binding series, at least). I find them very inspiring.</p>
