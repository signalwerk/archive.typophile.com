    html: '<p>Wads,  <br> <br>please tell us:  <br>1. Which font format you are generating? (How do you generate the font.)  <br>2. Which operating system and Photoshop versions you are using.  <br> <br>Altneratively, it is a good idea to contact FontLab support: <br><a href="http://www.pyrus.com/Font-tools/FontLab-Product-Support/FontLab-Problem-Report/" target="_blank">http://www.pyrus.com/Font-tools/FontLab-Product-Support/FontLab-Problem-Report/</a> <br>and include the font there.  <br> <br>Regards, <br>Adam Twardoch <br>Fontlab Ltd.</p>'
