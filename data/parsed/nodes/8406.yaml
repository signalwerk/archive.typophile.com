  html: <p>Hi all, <br> <br>I'm new here, but have been following along for quite some time. I'm trying to output a font created in Bitfonter 2, but its name is not appearing in the font menu. To create the naming I used the "wizard" button (green gem icon) in the Bitfonter menus, which appears to automate some naming but its still not appearing. Is there something I'm missing? The font name is currently set to WadsSansBold18.  <br> <br>Font Book seems to accept and preview the font, but I can't get PhotoShop to notice and/or use it. <br> <br>What considerations do I need to make sure of in order for a font to appear correctly in the font menu? And how can I relate (style-link?) styles of the font (say, Regular, Bold) under one font name in the menu? <br> <br>Thanks and HNY <br> <br>Wads</p>
  html_clean: <p>Hi all, <br> <br>I'm new here, but have been following along for quite some time. I'm trying to output a font created in Bitfonter 2, but its name is not appearing in the font menu. To create the naming I used the "wizard" button (green gem icon) in the Bitfonter menus, which appears to automate some naming but its still not appearing. Is there something I'm missing? The font name is currently set to WadsSansBold18.  <br> <br>Font Book seems to accept and preview the font, but I can't get PhotoShop to notice and/or use it. <br> <br>What considerations do I need to make sure of in order for a font to appear correctly in the font menu? And how can I relate (style-link?) styles of the font (say, Regular, Bold) under one font name in the menu? <br> <br>Thanks and HNY <br> <br>Wads</p>
