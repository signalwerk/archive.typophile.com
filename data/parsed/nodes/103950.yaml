    html: |-
      <p>Your graphic elements are overwhelming your type.</p>
      <p>Note that when you peel back the idea you're representing, you essentially have a hierarchical list:</p>
      <blockquote><p>
      Hardware-Software-Design (is a course in):</p>
      <ul>
      <li>Informationstechnik</li>
      <li>Informatik</li>
      <li>Electronik</li>
      </ul>
      </blockquote>
      <p>From there, decide what you want us to read first, second...</p>
