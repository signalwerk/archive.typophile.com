  html: |-
    <p>Hi all!</p>
    <p>We came up with the following info graphic, which is intended to show that a university course ("Hardware-Software-Design") incorporates information technology ("Informationstechnik"), computer science ("Informatik"), and electronics ("Elektronik"). However, while this is the best I could come up with, I really do not like it... Any better ideas or improvements on our idea would be greatly appreciated!</p>
    <p>Thanks,<br>
    Rainer.</p>
