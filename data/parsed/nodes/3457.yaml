    html: <p>Be aware that you have to make an appointment to visit the Type Museum in Hackford Street, the actual museum is not fully functioning, as most of the exhibits are still in boxes and archiving is still going on. There is a treasure trove of Bertold Wolpe's books and machinery some of it from the old Monotype Foundry and some donated from other now defunct foundries. Check out the street signs in that area. A book shop in Soho that you should visit is on Broadwick Street (I think, I normally walk straight there without noting the street names), definitely off Wardour Street. It is not Magma books but does have a selection of graphic books at lower prices (probably subsidised by the adult section in the basement). Also check out the bookshop in Tate Modern while you are visiting the Design Museum (which can be a disappointing visit for the expense, depending on what is showing there). <br>Have a good visit. <br>Tim</p>
    html_clean: <p>Be aware that you have to make an appointment to visit the Type Museum in Hackford Street, the actual museum is not fully functioning, as most of the exhibits are still in boxes and archiving is still going on. There is a treasure trove of Bertold Wolpe's books and machinery some of it from the old Monotype Foundry and some donated from other now defunct foundries. Check out the street signs in that area. A book shop in Soho that you should visit is on Broadwick Street (I think, I normally walk straight there without noting the street names), definitely off Wardour Street. It is not Magma books but does have a selection of graphic books at lower prices (probably subsidised by the adult section in the basement). Also check out the bookshop in Tate Modern while you are visiting the Design Museum (which can be a disappointing visit for the expense, depending on what is showing there). <br>Have a good visit. <br>Tim</p>
