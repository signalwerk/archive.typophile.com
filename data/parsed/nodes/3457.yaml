    html: <p>The staff at the Type Museum are, I believe, all ex-workers from Monotype and are enthusiastic and friendly with an in-depth knowledge of technical production of type. I think it is well worth a visit. The level of engineering is humbling. The Design Museum can be a fruitless experience - I don't know why, you would have thought the opposite. I do recommend Tate Modern though, brilliant use of an old power station. The bookshop is also close to Charing Cross Road North which has a large selection of secondhand book shops - good for browsing if you enjoy that. <br>Tim</p>
