    html: "<p>Magma books isn't in Soho, its in Covent Garden, which is just a brief walk away (about 5 mins). They also have a store in Clerkenwell - details and map can be found here: <br> <br>http://www.magmabooks.com/content/service/shops.asp <br> <br>Literally around the corner from Magma is Zwemmers, which has two stores, one specialising in design books on Charing Cross Road. Here's a photo-map-thingy to show you what to look out for: <br> <br>http://www.explore-london.co.uk/char5A.html <br> <br>Hope that helps. By the way, if you are in Soho, look UP! There are lots of examples of fascinating stone carved type on many of the older buildings, high high up on the frontage, beyond the shopfront signs, that most people miss...</p>"
