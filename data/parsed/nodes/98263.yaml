      <p>There are two open-source versions of Baskerville, and since licensing for Web use is often a pain, that would tend to lead me to consider them first.</p>
      <p>Not that I blame font suppliers; it is easier to steal a Web font than it is to steal a font from the printed page. If copy protection didn't hurt legitimate users as much as it often tends to do, it would be a good thing, not a bad one.</p>
