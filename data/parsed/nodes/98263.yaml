    html: |-
      <p>Thanks for all the replies to this,  great input!</p>
      <p>As I'm digging into this further, it appears just hinting for screen might be enough when dealing with sans. But when looking for the "next Georgia" I'm pretty sure it's going to have to be built specifically for the screen,  just like those Impallari typefaces (thanks for those links Pablo!). </p>
      <p>That comment on licensing reminded me of some older threads I've been reading recently on the topic of free fonts, I appreciated the viewpoint voiced by someone (Nick Shinn I think). Who said that companies should be making thier money by innovating not just by reformatting  their old typefaces to new formats (re-buying a typeface as a webfont is much akin to re-buying your Betamax movies on VHS). A way to combat this in the world of type would be to have a set of openly available source outlines for classic faces that can be reformatted and innovated upon by anyone whenever new media comes along. Then people can pay for any meaningful innovation that actually occurs. All of this is to say I'm <em>very</em> interested to see the Libre set of typefaces Impallari is building! (though it appears they are also generously doing a lot of innovation too, quite worth donating for).</p>
      <p>-Moe</p>
