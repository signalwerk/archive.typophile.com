      <p>Why do you say that licensing fonts for the web is often a pain? Have you had bad experiences?</p>
      <p>When making a website, I usually tell my customers to either get a web account at fonts.com, and I then just implement the CSS (which works fine), or I tell them to go to myfonts.com and simply purchase a webfont license with a one-time payment, and then we host the webfont ourselves. Both works fine, and I hadn't had any pain, actually. I have never tried Typekit before.</p>
      <p>Anything I should steer clear of?</p>
