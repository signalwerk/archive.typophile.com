      <p>A new Libre (ATF/Fry) Baskerville optimized for web body text (12, 14, 16 pixels) is coming soon<br>
      <a href="http://www.impallari.com/projects/overview/libre-baskerville" title="http://www.impallari.com/projects/overview/libre-baskerville">http://www.impallari.com/projects/overview/libre-baskerville</a></p>
      <p>And Libre Caslons (Display and Body Text)<br>
      <a href="http://www.impallari.com/projects/overview/libre-caslon-display-and-text" title="http://www.impallari.com/projects/overview/libre-caslon-display-and-text">http://www.impallari.com/projects/overview/libre-caslon-display-and-text</a></p>
      <p>And Domine<br>
      <a href="http://www.impallari.com/projects/overview/domine" title="http://www.impallari.com/projects/overview/domine">http://www.impallari.com/projects/overview/domine</a></p>
      <p>All heavily tested on <a href="http://www.impallari.com/testing/" title="http://www.impallari.com/testing/">http://www.impallari.com/testing/</a> for awesome rendering at small sizes. When you set them at 16px size, you get a 9-pixels x-height, and the counters remains wide open. Domine Beta28 look like this: <a href="http://www.impallari.com/media/uploads/profotos/110-foto01-original.jpg" title="http://www.impallari.com/media/uploads/profotos/110-foto01-original.jpg">http://www.impallari.com/media/uploads/profotos/110-foto01-original.jpg</a></p>
      <p>They all avoid the "fussiness under the baseline" sindrome<br>
      <a href="http://typedrawers.com/discussion/106/fussiness-under-the-baseline" title="http://typedrawers.com/discussion/106/fussiness-under-the-baseline">http://typedrawers.com/discussion/106/fussiness-under-the-baseline</a></p>
      <p>And.. if you need a formal script that can resist being set that small, try Petit Formal Script<br>
      <a href="http://www.impallari.com/media/uploads/profotos/57-foto01-original.jpg" title="http://www.impallari.com/media/uploads/profotos/57-foto01-original.jpg">http://www.impallari.com/media/uploads/profotos/57-foto01-original.jpg</a><br>
      <a href="http://www.impallari.com/projects/overview/formal-script-for-the-web" title="http://www.impallari.com/projects/overview/formal-script-for-the-web">http://www.impallari.com/projects/overview/formal-script-for-the-web</a></p>
