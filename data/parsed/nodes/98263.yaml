    html: |-
      <p>From the user perspective, having to buy 2 or 3 separate licenses (one for web, one for print, another one for apps) is ridiculous. Plus, in 95% of cases is the same font re-packed (Except Hoefler, Webtype and a few others exceptions that truly make fine-tunned customized and reworked version for the web.). And Users are starting to notice that... as Moseph  suggested "these appear to just be print typeface hinted for the screen".</p>
      <p>I love Global (<a href="http://theglobalfont.com/" title="http://theglobalfont.com/">http://theglobalfont.com/</a>) from Dino Dos Santos approach, is super simple. Just 1 license covering all the stuff.</p>
      <blockquote><p>
      "Global is a hard-working sans typeface that eliminates the licensing boundaries between the screen and the paper, therefore it can be used and embedded both for the web and mobile applications, because it’s provided, not just in OpenType™, but also in EOT, WOFF and TTF formats, all in a single, unlimited, license. Available at DSType."</p>
      <p>Can I use the fonts in devices and/or mobile apps?<br>
          Yes. No special license is required to use the fonts in electronic books and applications for mobile devices.</p>
      <p>Can I embed the fonts in PDF files?<br>
          Yes. The embedding of fonts in PDF documents is allowed as long you make sure that you set embedding to prevent the extraction of the fonts.</p>
      <p>Can I use the fonts in the web?<br>
          The license permits web usage of Global font, so we will provide you with an installable "DSType_Global_Kit" version of the fonts for use on the web (EOT, WOFF, SVG and TTF), so you can choose the format you prefer. You can also use PostScript flavored fonts when needed, for improved screen render when desired.</p>
      <p>Can I host the fonts on my server?<br>
          Yes you can!
      </p></blockquote>
      <p>But... you know... selling 3 licenses instead of just 1 is much more profitable I guess.<br>
      Sadly, I don't think other foundries will follow Dino's example.</p>
