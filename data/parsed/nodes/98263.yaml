    <p>Now that @font-face is widely supported in browsers, I'd like to start incorporating some classical typefaces on client websites. </p>
    <p>Are there any versions of Garamond, Baskerville or Fleishmann that have been designed for the screen, and that you'd recommend? </p>
    <p>Thanks<br>
    -Moe</p>
