      <p>Tried to identify <a class="freelinking external" href="http://www.behance.net/gallery/Restaurant-branding/5745415" rel="nofollow">one</a> very close recently with no success. As suggested by Don, this is close to Copperplate but too many details remain off to me (serifs shape, none of the standard weights looks to match, overall design is far more balanced, stroke thickness more regular and consistent...). I can only confirm the feeling you have regarding Gotham. That really looks like it with some serifs added (which is a long process but not so hard).<br>
      Alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/biondi" rel="nofollow">Biondi</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/thomasjockin/garcon-grotesque" rel="nofollow">Garçon Grotesque</a></p>
