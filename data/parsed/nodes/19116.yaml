  html: |-
    <p>This is not a logo but rather an idea which I had. </p>
    <p>Soon my apprenticeship ends and I had to apply for a job. So I thought about not making a standard letter to write to the agencies but rather just a logo printed on a selfmade postcard. So I could write on the back and the guy from the agency could read immediately my application. Therefore I could not glue a picture of me on the postcard, so I decided to paint myself. So my name should look a little bit like a signature.</p>
    <p>Its a bit late now and I want to go to bed but before go to sleep I want to upload my current status to hear what you think of it.</p>
    <p>Its just a rough sketch which I traced in freehand. Its not cleaned yet. </p>
    <p>Because the logo only appears on a postcard I thought about giving my picture an irregular, selfpainted border that let it look like a postage stamp.(only sketched yet)</p>
    <p>So what do you think of it!?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Steven-Wulf-Logo.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Borderline-Logo.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Steven-Wulf-Letter.gif"></div><br>
    …<br>
    Bye: Steven<p></p>
