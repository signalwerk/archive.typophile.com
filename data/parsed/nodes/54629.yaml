      <p>Dispatch is exactly the right idea, and I've looked at it as well, but I worry it's still too similar. It's like I need the exact opposite-yet-twin of that font (no, not Stainless, though).</p>
      <p>I'm obviously going to base body font off of the headline, though, so Melior's flexible.</p>
      <p>I was considering Gotham, but Obamarama has unfortunately made that option too cliched. And Giza's really fun, but I worry it's too swirly. At the moment I've got one template using Belizio Bold as the headline, that's not looking too bad.</p>
      <p>Can I eke one last final suggestion from you in the vein of the anti-Dispatch? I'd greatly appreciate it!</p>
