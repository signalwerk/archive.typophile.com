    <p>i'm working on a redesign of an alt weekly over here. our competitor uses <a class="freelinking external" href="http://www.fontbureau.com/newspaper/fonts/Amplitude" rel="nofollow">FB's Amplitude</a> as a headline font so I'd like to stray as far away as possible from that. </p>
    <p>At the moment I'm using Aaux Pro Medium for subheads, Aaux Pro Poster for section titles and I think I've settled on Melior for body copy, but a well balanced, possibly serif headline font is hard to find. A condensed option would be grand. Actually, my only real "want" is for the headline and the subhead to be opposite - one sans, and one serif. I'd like to achieve some balance and texture through those choices.</p>
    <p>Does anyone have any suggestions? I'd greatly appreciate any ideas, or love/hate combinations, or general discussion.</p>
    <p>Thanks a bunch, I really enjoy reading these boards!</p>
