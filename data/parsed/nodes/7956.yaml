  html: <p>Took an exsisting free font made by MS and lined the numbers up so they are all even, renamed the font and resaved it as a truetype Mac Suitcase in Fontlab 4.6, but these bracket characters show up when I scroll across the screen once I'm in Quarkxpress 6.5 on Mac OSX Panther. I haven't seen this happen in any other application. <br>Is this a known issue with Fontlab and Quark? <br>How do I fix it?</p>
