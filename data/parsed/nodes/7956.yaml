    html: <p>Ooops, I forgot to say when it print's a message comes up saying (The font used in this layout may be corrupt and may be substituted by courier. [108]).  And that 108 alert says <br>(The path name "___" specified in the Windows Registry is invalid. Using default path name "___".) <br>Does anyone have a clue?</p>
