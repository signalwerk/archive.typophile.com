    html: <p>That's a little confusing. It sounds like you're working on OS X with Mac TrueType fonts, but that's a Windows error message! Of course Windows can't recognize or work with suitcase-based Mac TrueType fonts. <br> <br>In any case, you are breaking your license agreement with Microsoft by altering the font. Microsoft's license explicitly forbids modifying their fonts. <br> <br>Regards, <br> <br>T</p>
