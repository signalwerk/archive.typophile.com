    html: <p>I think it has some nice aspects to it, but I have to translate it in my head before I know what it says. I simply can't read those Ts. It looks like "SLEREOLYPE" to me. Actually, the O bothers me a lot. Nothing wrong with a plain old circle, or even just a circle that doesn't close at the top. Rotate the zero 45 degrees so you have a diagonal bar, and you've got a nice joke on dot-matrix zeroes. <br> <br>The "ED" ligature is very, very interesting. Something very Shakespeare-gone-modern about that.</p>
