    html: <p>Bye the way, Thanks for the advice so far, and thanks a ton Kyle.....what did you do? <br> <br>The green characters I feel need some help, and the Pink characters I feel are very bothersome.  I am working on making alternate characters to be included in the face to play along with the title of the face-Stereotype-.  The characters are simular in thier construction, but by using shift or option you could get alternates to kind of destroy the stereotype of preconcieved ideas of what the next typed character will look like.</p>
