    html: <p>Hey wow, thanks alot Kyle! You rule. <br>Now that you can actually see the face, I should probably explain my idea. <br> <br>I looked to some of  Herbert Beyers early faces in addition to many other modular, grid fonts and geometric sans faces for inspiration.  I wanted to mesh the formulaic and reconstructing attributes of modular design with a touch of humanistic qualities to give a bit of spontaneity to the forms.   Thus, a kind of subtle man vs. machine characteristic. <br>I limited myself to vertical and horizontal segments &amp; one radius for the construction. <br></p>
