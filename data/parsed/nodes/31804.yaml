    <p>I am playing with an OpenType font design where the default figures are <a href="/node/17239" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">proportional</a> rather than <a href="/node/16999" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">tabular</a>.</p>
    <p>All the OT fonts I am using for reference have tabular as their default.</p>
    <p>Are there set <a href="/node/12237" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">unicodes</a> for glyphs zero.tab through nine.tab and tabular currency?</p>
    <p>And how important are the unicodes for OT fonts anyway?</p>
    <p>Won't everything work if I set up my OT classes using glyph names?</p>
    <p>I have developed several PS type one fonts and I'm trying to get a handle on OT font design. I'm thrilled by the potential and I read the Fontlab manual and the adobe and microsoft reference pages and some things make perfect sense. But a lot of things I just can't get my mind around. Seems like there are no easy answers for anything when it comes to OpenType!</p>
