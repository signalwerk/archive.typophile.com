      <p>There was a case several years ago regarding (fuzzy memory) a large ad agency that brought in a freelancer or intern who used a font on a major national campaign that the firm hadn't actually licensed. </p>
      <p>As for your collect for output issue, maybe that's an excuse to get them updated on their prepress file prep technology. Perhaps push them towards a PDF workflow (one of the good uses of PDFs) that would help eliminate the need to bundle fonts all the time with the production files.</p>
