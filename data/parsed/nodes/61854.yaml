    <p>This is only my second post.  My first post was back in July entitled "Help with Licensing Management (dubious Font server thrown in my lap)"</p>
    <p>SInce then, I am happy to report I've had some success getting fonts to be purchased according to their licensing.  For example, we purchased a font for all the required seats of actual users with font access, instead of just the bare minimum option of 1 to 5 users.  </p>
    <p>But now my trouble is the other half of licensing — usage.</p>
    <p>When I point out that the licensing does not allow collect for output or modifying into a logo for common example, I am literally laughed at and told nobody pays any attention to usage limitations.  I don't mind being the brunt of jokes, but I am concerned about the infringement of intellectual property.  Sometimes the reaction is anger,  "We paid $5000 to use this font legally, instead of our usual $50 for 1 user, and you think we can't use it however we want?!"  So they proceed to use it however they want to use it and I am viewed as the big office monkey-wrench trying to muck up the system with my imagined power.</p>
    <p>I have explained how type can be protected by copyright, trademark, patent and all the laws pertaining to software.  I have described collect for output to unlicensed users as software piracy.  I am seen as being nuts.  No one takes this seriously.</p>
    <p>I realize we are not the only people operating this way, and I'm pretty happy I have made some progress on the purchasing side of licensing, but I still have a long way to go.  So I would appreciate any help.  One thing that would really help me is some accounts of the consequences of getting caught.  I actually had a person hand me their mattress tag, "Do not remove under penalty of law" to demonstrate to me the FBI hasn't kicked their door down yet.  So a link to convicted felon, or imposed fines or something from the public record that would help to support my idea of smart business practice.  Meanwhile, I'm framing the mattress tag.</p>
