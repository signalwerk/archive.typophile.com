      <p>Dave, your efforts are exceptional, and highly<br>
      commendable. Please keep it up! Note however:<br>
      1) Fight the battles you can win, because if you<br>
      start losing, you'll lose more and more.<br>
      2) Just like there are unreasonable laws, there<br>
      <em>are</em> EULAs that have unreasonable clauses. The<br>
      best example is the one that says you can't do a<br>
      convert-to-outlines. Ridiculous. So you do your<br>
      best, but being a slave to the letter of the law<br>
      does not work out - not for you, not for society.<br>
      3) People getting caught or not doesn't need to be<br>
      the main affector. You might instead focus on the<br>
      ethical drawbacks of robbing small, hard-working<br>
      outfits, and the long-term social effects (like fewer<br>
      people bothering to make good fonts).</p>
