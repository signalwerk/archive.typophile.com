    html: |-
      <p>Thanks for the suggestion, but we have the updated technology and we do sometimes exchange PDF's with embedded fonts.  The problem is many printers, developer and post production houses insist on native files.  So they require the font and someone in effect pirates it for them, at their request, by doing a collect or packaging or just plan copy it.  Also, many times last minute edits are needed and that often requires native files.  Not to mention, some preflight systems are so restrictive, they are impossible to clear with a PDF.  Or so I am told those are the excuses.</p>
      <p>If you think of any specific search criteria for your ad agency case, let me know.</p>
