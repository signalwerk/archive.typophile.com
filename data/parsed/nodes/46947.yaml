  html: |-
    <p>I'm scratching my head looking for a typeface to go out with DIN in this report I'm working on. I've tried The Serif Extra Light and Serifa, but The Serif is too prickly and condensed and Serifa the x height is wrong. Does anybody have any other suggestions? FYI client is a power company </p>
    <p>Thanks. C.</p>
