    html: <p>Miss Tiffany, I know this might sound like an ignorant question, but isn't that set of alternate swash caps really not meant to connect? Or am I missing something?</p>
    html_clean: <p>Miss Tiffany, I know this might sound like an ignorant question, but isn't that set of alternate swash caps really not meant to connect? Or am I missing something?</p>
  - id: 300863
    user: 108
    date: 2008-09-11T12:28:00
    date_raw: 11 Sep 2008 — 12:28pm
    votes: null
    html: |-
      <p>You are right, but they didn't use the features completely. They turned on swash but not contextual alternates thus leaving the entry strokes. I suppose this is a matter of taste and opinion. ;^)</p>
      <p>1. Out of the box<br>
      2. Swash feature; z has calt turned off to keep the loop.<br>
      3. Swash + calt; z has calt turned off to keep the loop.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bickhamcalt_5511.gif"></div><p></p>
      <p>I should add that my first statement was off-the-cuff. So I do apologize for that.</p>
