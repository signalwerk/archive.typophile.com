    html: |-
      <p>I could be wrong but have you tried inserting an explicit line "script latn;" below your line "# Latin" in locl?<br>
      ID does casing first, then applies c2sc to the uppercased string. Idotaccent and Idotaccentsmall are not covered in your classes @uc and @sc, so are not available to c2sc. Also I think you can omit Ismall and Idotaccentsmall from "sub [i Ismall] by [i.TRK Idotaccentsmall];" in locl but then need an additional line in smcp, as sketched <a href="http://www.kltf.de/stuff/locl-feature.zip">here</a>.</p>
      <p>By the way, I spotted "sub f i.TRK by fi;" in liga which is better removed. Part of i.TRK's job is <em>avoiding</em> this ligature if language is TRK. In Turkish, i-with-dot and i-without-dit are separate letters, and an f-i ligature in which the dot is connected to the f would look like f-dotlessi ...</p>
