      <p>Hi Karsten<br>
      Thanks a lot for your approach. The whole thing now works in Fontlab's preview panel, but all the declared languages in the locl feature still can not display their small caps in InDesign – that problem persists.</p>
      <p>My new features look like this:</p>
      <p><code><br>
      @_n1=[a h m n  aring adieresis agrave aacute acircumflex];<br>
      @_period=[period  comma quotesinglbase quotedblbase];<br>
      @_n2=[m n  r u udieresis uacute ugrave ucircumflex];<br>
      @_o1=[b e o  p oslash edieresis eacute oacute odieresis ograve egrave ocircumflex ecircumflex];<br>
      @_o2=[c d e o  q oslash edieresis eacute oacute odieresis ograve egrave ocircumflex ecircumflex];<br>
      @_i3=[i  j dotlessi iacute igrave icircumflex];<br>
      @_v3=[v  w x y ydieresis yacute];<br>
      @_dashes=[hyphen  endash emdash];<br>
      @_upperquote=[quotesingle  quoteleft quoteright quotedblleft quotedblright];<br>
      @_k1=[k  x];<br>
      @_l2=[b h l  k];<br>
      @_O2=[C Ccedilla G O  Oslash Q];<br>
      @_O1=[D O  Oslash Q];<br>
      @_H2=[B D E F H  I K L M N P R U];<br>
      @_H1=[H  I M N U];<br>
      @lc=[a b c d e f g h i i.TRK j k l m n o p q r s t u v w x y z];<br>
      @sc=[Asmall Bsmall Csmall Dsmall Esmall Fsmall Gsmall Hsmall Ismall Idotaccentsmall Jsmall Ksmall Lsmall Msmall Nsmall Osmall Psmall Qsmall Rsmall Ssmall Tsmall Usmall Vsmall Wsmall Xsmall Ysmall Zsmall];<br>
      @uc=[A B C D E F G H I Idotaccent J K L M N O P Q R S T U V W X Y Z];<br>
      @acute=[cacute sacute zacute nacute oacute];<br>
      @kreska=[ckreska skreska zkreska nkreska okreska];<br>
      languagesystem DFLT dflt;</code></p>
      <p>languagesystem latn dflt;<br>
      	languagesystem latn PLK;<br>
      	languagesystem latn MOL;<br>
      	languagesystem latn ROM;<br>
      	languagesystem latn TRK;<br>
      	languagesystem latn AZE;<br>
      	languagesystem latn CRT;</p>
      <p>	languagesystem cyrl dflt;<br>
      	languagesystem cyrl SRB;</p>
      <p>	languagesystem grek dflt;<br>
      feature locl {</p>
      <p>	script latn;<br>
      		language TRK;<br>
      			lookup ITRK {<br>
      				sub i by i.TRK;<br>
      			} ITRK;</p>
      <p>		language AZE;<br>
      			lookup ITRK;</p>
      <p>		language CRT;<br>
      			lookup ITRK;</p>
      <p>		# Handling of Romanian Scommaaccent<br>
      		language ROM; # Romanian<br>
      			lookup COMMAACCENT {<br>
      				sub [Scedilla scedilla] by [uni0218 uni0219];<br>
      				sub [uni0162 uni0163] by [uni021A uni021B];<br>
      			} COMMAACCENT;</p>
      <p>		language MOL; # Moldavian<br>
      			lookup COMMAACCENT;</p>
      <p>		language PLK exclude_dflt; # Polish;<br>
      			sub @acute by @kreska;</p>
      <p>} locl;<br>
      feature c2sc {<br>
        sub @uc by @sc;<br>
      } c2sc;</p>
      <p>feature smcp {<br>
        sub @lc by @sc;<br>
        # Here, we need an additional substitution to<br>
      	# cover the "dotlessi":<br>
        sub dotlessi by Ismall;<br>
      } smcp;</p>
      <p>feature liga {<br>
          sub f f l by ffl;<br>
          sub f f i by ffi;<br>
          sub f f by ff;<br>
          sub f i by fi;<br>
          sub f l by fl;<br>
          sub f b by f_b;<br>
          sub f f b by f_f_b;<br>
          sub f h by f_h;<br>
          sub f f h by f_f_h;<br>
          sub f j by f_j;<br>
          sub f f j by f_f_j;<br>
          sub f k by f_k;<br>
          sub f f k by f_f_k;<br>
          sub T h by T_h;<br>
      } liga;</p>
      <p>feature kern {<br>
         pos slash slash -357;<br>
         pos backslash backslash -357;<br>
      } kern;<br></p>
      <p>Can you figure it out?</p>
