    html: |-
      <p>Claus, </p>
      <p>it's quite simple: your <code>smcp</code> feature is only registered in <code>latn dflt</code> (also other features, I guess, such as kern). </p>
      <p>In the lower-right part of the OpenType panel, you need to declare ALL languagesystems in which you want to register the feature definitions which do not have explicit languagesystem handling. If this is not done, the features get registered only in the implied languagesystem, which is <code>latn dflt</code>. </p>
      <p>So, you should put: </p>
      <p><code>languagesystem DFLT dflt;<br>
      languagesystem latn dflt;<br>
      languagesystem latn PLK;<br>
      languagesystem latn MOL;<br>
      languagesystem latn ROM;<br>
      languagesystem latn TRK;<br>
      languagesystem latn AZE;<br>
      languagesystem latn CRT;<br>
      languagesystem cyrl dflt;<br>
      languagesystem cyrl SRB;<br>
      languagesystem grek dflt;</code></p>
      <p>I see that you have done this but there may be something wrong there... </p>
      <p>Also, I advise that you don't use glyphnames outside of AGLFN. <code>Asmall</code> is a definietely a bad idea. <code>A.smcp</code> or <code>A.sc</code> or <code>A.small</code> would be much better. </p>
      <p>Use DTL OTMaster or FontTools/TTX to examine your font and find out if the <code>smcp</code>-related lookups get actually registered in the <code>latn TRK</code> languagesystem. </p>
      <p>Cheers,<br>
      Adam</p>
