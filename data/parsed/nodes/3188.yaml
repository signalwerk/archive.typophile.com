    html: <p>Perhaps I can sqeeze them into a Dune Beetle :D <br> <br>The more I thought about the original post, the more obvious it became to me that I have no predisposition to purchasing particular fonts because of who made them or their country of origin. <br> <br>I'll site Cottingly as one of my alltime favorite typefaces and its designer hails from the UK. <br> <br>See! Simple as that! It's also hard to ignore a successful typeface like Fontesque from our pal Nick Shinn up in Canada. It's become an incredibly popular display face in the US. <br> <br>I guess a great typeface is a great typeface and I'd personally be reluctant to go out of my way to find a "local" homerolled version of something that already is exactly what I want. <br> <br>That's my opinion when it comes to purchasing type. Regarding other products I purchase, I think I may have a bias due to regionality, relationship to my personal background, etc. - less 'legitimate' reasons and more 'gut' reasons. <br> <br>Hopefully I'm not going too far into a tangent, but I think my purchase decisions are based mostly on historical purchase experiences, sense of value for amount paid, packaging/ambiance, and cost.</p>
