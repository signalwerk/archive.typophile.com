    html: <p>Thanks Daniel! <br> <br>Acutally I had a different angle on this question . . . <br> <br>Say I'm an Art Director in Toronoto and I want to capture the regional flavor. Chances are I'd want to use a face that reflects that flavor and more than likely it'd be a face developed locally. <br> <br>The job of an Art Director is to do as much as they can to influence a purchase decision to 'joe public' to buy what they are creating advertising for. If 'joe public' lives in a specific region, I'd be a fool not to design work that they can relate to visually. <br> <br>It's part of that whole advertising, getting into the consumers head, blah blah making them feel familiar with the message I'm trying to create for them . . . <br> <br>Stuart :D</p>
