    html: <p>I'm also not a type patroit. <br> <br>BUT, we have run into difficulty buying fonts from other countries.  <br> <br>When we bought a set of multiple-work station fonts from Switzerland a couple of years ago, the over $1000 U.S. price tag triggered some kind of mechanism under the Patriot Act.  <br> <br>My colleague had a lovely time trying to explain to some bored government official how it is possible to pay that much money for "a couple of fonts". They were positive we were involved in something nefarious and held up the transaction for several days. <br> <br> <br> <br> <br></p>
