    html: <p>Sally, <br>The logos you have designed look nice, but they do have a food design feel to them and after reading other posts it seems like many of the people think the company sells steaks not livestock. Perhaps you should think more "ranch" than individual "cow". Your design could show a few cows in a field, indicating breeding cow (without going completely graphic) rather than hamburger. Or not even show a cow, a branding iron, rope or fence sign are quick imagery that comes to mind when thinking ranch. Maybe it's something as simple as showing a whole cow to get rid of the food association, the severed head sort of leads one to think of butchery.</p>
