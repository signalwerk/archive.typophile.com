    html: "<p>I like your first designs better.  <br> <br>The circle with K and bull on top of each other is far too complicated. It's like your telling two jokes at the same time. Which is better: a drawing of a bull, or a drawing of K defined by the negative spaces? I think the bull. But certainly not both on top of each other. <br> <br>The circle as it is now is not likely to be reproduced in small sizes, let alone in one colour (where the rightmost part of the K would grow out of the shoulder). <br> <br>If you were to balance a circle next to KAUT and the subline, I would place the circle higher, sharing a horizontal axis with only KAUTZ, not with both lines, thus letting the subline 'hang' underneath.  <br> <br>-- <br>Soren O</p>"
    html_clean: "<p>I like your first designs better.  <br> <br>The circle with K and bull on top of each other is far too complicated. It's like your telling two jokes at the same time. Which is better: a drawing of a bull, or a drawing of K defined by the negative spaces? I think the bull. But certainly not both on top of each other. <br> <br>The circle as it is now is not likely to be reproduced in small sizes, let alone in one colour (where the rightmost part of the K would grow out of the shoulder). <br> <br>If you were to balance a circle next to KAUT and the subline, I would place the circle higher, sharing a horizontal axis with only KAUTZ, not with both lines, thus letting the subline 'hang' underneath.  <br> <br>-- <br>Soren O</p>"
