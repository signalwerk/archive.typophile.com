    html: <p>The angus is one element. And the word Kautz is another. If they are side-by-side as in version 1 and 2, they shouldn't touch ... because the eye wants to see them as "one thing and another thing", not "one thingand another thing" (pardon my English). <br> <br>If they on the other hand are intertwined, it's okay ... but watch out for production difficulties. <br> <br>I think the 'tree' must have to go. <br> <br>Beware that in version 1 and 2 there is too much space around A. <br> <br>In version 3, could you avoid "cropping the angus with a scalpel"? You may have to put the angus in a frame ... I haven't got any solution to this right now ... Maybe version 2 could be realized ... <br> <br>-- <br>Soren O</p>
