    html: "<p>Sally - I like where you are going - the illustration is better in these second rounds - but I think you may also try something a little more removed from such a literal illustration  you run the risk of it looking clip arty. <br> <br>Something with clean lines that would work well in single color - (the merril lynch logo comes to mind for obvious reasons) but what about a hoofprint or something with just the horns cradling the type?  <br> <br>I can totally empathize with you - I do design work for a supplier to the dairy industry. Udder dip, mating supplies and bull um... well lets just say essence... and there is so much cow imagry in marketing pieces and ads and so forth that a mark that is distilled down to a quicky symbol may play stronger than a more illustrative approach. Just a thought -  <br> <br>having said that so far I like #2, but agree with Scott about flipping the type right side up at the bottom - perhaps also think of using that seal without an enclosure around the type.</p>"
