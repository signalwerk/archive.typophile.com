      <p><em>So I would see the addition of an "oo" kern as part of a gradual improvement in Slimbach's craft.</em></p>
      <p>I would see it also as changing taste.<br>
      Whether the direction taken is the result of the person maturing, or the tenor of the times, is hard to say.</p>
      <p>I’ve tried “…various alternatives to the current spacing and kerning model…” in several of my types, most of which could be considered Critical Design.</p>
      <p>I put positive kerns on the rounds of Figgins Sans, partly so that it would set tight in tracked-in headlines, without collisions. The normal (“text”) fit is derived from doing the spacing with a tight fit, for headlines, as it were, then just opening up the metrics by adding space consistently to all sidebearings.</p>
      <p>In Richler I put massively wide sidebearings on the rounds, on the principle that the face is square and high contrast, and the vertical rounds are almost like straight stems. This looks a bit silly-travesty at large sizes, but works well in body.</p>
      <p>In Preface, I employed space-hogging glyph shapes from outside the subtly spaced foundry type tradition, to open up the colour of text.</p>
      <p>In Goodchild and Nicholas, like Goudy I went back to try and emulate Jenson’s clockwork ﬁtting, in the interplay of glyph form, detail and spacing.</p>
