      <p>Thank you for your responses so far. Certainly, I did not expect an answer "out of a hat", although I believe that some people already have their favorites that they "carry around with them", and could perhaps share the insight. </p>
      <p>I think Typophile is the one place on the net where the most educated people working with type meet (type designers, but also critics, reviewers, users etc.). Many younger type designers have looked at existing typefaces and studied them, so perhaps they might tune in. </p>
      <p>Indeed, I'd prefer to see newer typefaces in the list rather than the ones which have been "compromised" by the unit system. They may be very good designs, but with a coarse unit system it's hard to retroactively guess whether some decision was an "ideal" choice of a "hard-worked compromise". This is why I'd prefer to see designs that have been made without those constraints. (This is nicely illustrated on <a href="http://www.fontbureau.com/nhg/features/" title="http://www.fontbureau.com/nhg/features/">http://www.fontbureau.com/nhg/features/</a> where the advance widths of the old digital Helvetica and of Neue Haas Grotesk are compared). </p>
      <p>In certainly do intend to take an "auteur sample", by picking some faces designed by type designers I know and trust (both older and younger generation) and see whether I can find some patterns there that could be applied to the methods we're researching. I do have some selection of candidates of my own, so this thread is intended mostly to broaden my own perspective rather than needing to serve as the only source for information. </p>
      <p>Many thanks, and I appreciate your opinions coming! </p>
      <p>Best,<br>
      Adam</p>
