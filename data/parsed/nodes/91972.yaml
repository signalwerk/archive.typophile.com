      <p>Hrant, I just checked Slimbach's Adobe Garamond on the kerns between 'o' and a following lower case letter. Unlike Minion (the positive oo kern is 9 units), he kerns very lightly. The only kerns following 'o' are with the diagonal characters—vwxy. No kerning on oo. </p>
      <p>I think this shows something that is important for Adam's investigation. Slimbach evidently wanted to do something different with Minion: to produce using maximum kerning a very economical typeface. The design with the narrow characters and large x-height also has the same goal.</p>
      <p>So here we have the same designer following a different philosophy, and doing a different kind of kerning. To me Minion and Adobe Garamond succeed in different ways, with different goals. So any 'auto' kerning is going to have to have latitude to be most useful for designers.</p>
      <p>By the way, whether Minion's solutions are the best way to be economical is another issue. I am biased, but to me a smaller size of Williams Caslon Text is a more comfortable read in the same space, partly because the tight, darker and large x-height Minion calls for more leading. Being a bit wider and looser and lighter, in other words, helps reading comfort more than size.</p>
