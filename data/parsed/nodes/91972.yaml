    html: |-
      <p>HVB: "...impact on rendering engines (if any)...?</p>
      <p>I'd guess no impact. Sub-integer coordinates get rounded to integer coordinates for generation of TT 0r PS fonts.  TT and PS fonts are rendered from these integer values, usually today with sub-pixel values being determined from the integer values of the outline coordinates. </p>
      <p>AT: "I mostly draw up those analogies for myself... " </p>
      <p>I think that's best, as the true nature of type design, from the first scratch in a tool to the  deployment of device-, layout- and language-independent typography, is less like anything else, the more one understands it. :)</p>
      <p>...and: "For example, we’d [FL] like to be able to use the same basic information that RoboHint or VTT uses." </p>
      <p>In VTT's case, you're better off dealing with Microsoft, but we're talking about a documented and extendable font format (SFNT)*, so usability by other programs is entirely up to the program's programmer. VTT adds a table(s) that VTT interprets from VTT-talk to TT, and you can read and interpret that talk in FL if you write an interpreter, no?</p>
      <p>In Robohint's case, as Petr presents it, he's just finishing the translation of all the TT hints to Python, implementing scaling, dash-boarding the graphic state (which VTT lost), displaying all the popular renderings and debugging the inter-hint translators. (It's not in alpha yet, but Robohint's use is not intended to be limited to me or by me).</p>
      <p>On Winglet (a feature-specific single-dimensional output-specific hint set), and Wing (a complete single-dimensional output-specific hint set); they should "technically" be followed by the word "Command", and are followed up in a hierarchy by "Glyph Commands",  "Glyph Sub-Group Commands", "Glyph Group Commands" and up to "Font Family Commands", (or they could be "Winglet Command, "Wing Command", "Stroke Command", "Sub-radical Command", "Radical Command", etc... whatever one needs to order their parametric scaling, actually) — these are just terms invented to contain python code.</p>
      <p>So, I don't think anything technical should stop a marriage of use if FL is up-to-date in Python versions, reads and writes TT instructions in one of the common tongues and if vfb maintains close contact with the capabilities of TT &amp; UFO as they evolve, which is all up to FL, no?</p>
