      <p>Ps. In a message that I cannot find right now, I compared the glyph design and the layout/positioning in a font to the video and audio tracks in a video file. A video file typically has one video track but can have multiple audio track (for different languages, and with different mastering quality — mono, stereo, dolby 5.1). </p>
      <p>An analogy could be made that a font usually has one set of glyph images but can have several kinds of layout/positioning info (TrueType kern table, OpenType GSUB+GPOS tables, TrueType GX/AAT tables, SIL Graphite tables etc.). TrueType and OpenType layout models are a bit like English mono (no kerning), English stereo (TrueType kern table kerning) and English dolby 5.1 (OpenType GPOS+GSUB), while TrueType GX/AAT and SIL Graphite are a bit like Norwegian and Slovenian audio tracks. The browsers that can display a font but ignore all kerning and features are like audio equipment that can only play mono audio tracks. </p>
      <p>Of course, these are all just coarse analogies, but if we stick to that analogy (video+audio tracks vs. glyph design+layout/positioning), we can assume that in a video file, there can be very independent compression and optimization algorithms for video and audio, just like the glyph optimization and compression mechanisms (different hinting, embedded bitmaps, different outline flavors, different UPM sizes, outline quantization etc.) are different from the possible layout/positioning optimization and compression mechanisms (that I talked about before). But of course, the tracks still need to be in-sync. </p>
      <p>I mostly draw up those analogies for myself so that I can explore existing approaches, processes, algorithms or methods employed by people who work in those fields that I draw the analogies into. Sometimes I find that some approaches developed for areas completely unrelated to type can be potentially employed in type design and font production, but of course often they need to be adapted for the specifics of type design. And of course, sometimes my analogies are moot. Yet it’s rather refreshing to still draw them :)</p>
