      <p>&gt; was the 18-unit system replaced with a 100-unit one?</p>
      <p>Sorry, this isn't necessarily correct, since even if you limit your sidebearing determination to multiples of ten* if the outlines themselves don't snap to multiples of ten the <em>advance widths</em> will have no such coarseness.</p>
      <p>* Actually another flaw in my question, since that's not the same as greater-than-10.</p>
      <p>BTW, I assume that anybody who uses no kerns less than a given value should have all the kerns in a multiple of that value*. For example in Vem (Ernestine's Armenian component) all my kerns are multiples of 5.</p>
      <p>* Except perhaps very small collision-avoidance kerns.</p>
      <p>hhp</p>
