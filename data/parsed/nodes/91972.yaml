      <p>Hi Adam. I think there is a problem is talking only about spacing and kerning, and not about character design. Also there are issues on what kind of compromises you are going to call 'good.' </p>
      <p>In my own experience, spacing the lower case of my Williams Caslon Text was not that tough, because I think I got the character widths and stroke weights (these interact) right. Of course I had a lot of help from Caslon and the models he was influenced by. When it came to the italic, I had a lot more problems. I widened and straightened up Caslon's italic, so it really became a different animal. Initially I had the hook terminals at  the baseline kicking out beyond the shoulders. And I just couldn't get the design to space and look good. The rhythm was never right. When I pulled the hooks back under the shoulder, then things started to work. But even in the end the italic seemed to need more kerning than the roman. This may have to do with the varying slopes of characters in a true old style italic. </p>
      <p>I say all this because I think the key issue is what rhythm is readable, and works. Then good character design and spacing and kerning all follow from this. </p>
      <p>Also you have compromises and design philosophy issues for which there is not necessarily one right answer. A prime consideration is always to get the white space between letters visually even. A sometimes competing consideration is not to have parts of letters touching, or close to touching, as that can be distracting. For example, you might want to overlap KA, and RA, letting them touch as the lesser of evils. But you might want to modify the design of the K and R and A also, so that there is a small gap, without compromising too much on visual evenness. </p>
      <p>You also have the need to have the letter spacing in proportion to the counters. Here there are problems involving the caps that again don't necessarily have one best solution. When you kern caps to lower case, you have the question of what the space between the cap and the lower case letters should relate to, the counters of the caps and or of the lower case. If they relate to the caps, then you have the caps standing off a bit from the rest of the word. If the space relates to the lower case, then you have a more abrupt change in color between the cap and lower case parts of the word. You can also make the caps smaller to ameliorate this problem, but then you face the question of whether caps should be clearly differentiated in color to serve as their signaling function as caps. So I think there is a fair amount of latitude involved in these decisions involving caps and lower case. </p>
      <p>On kerning the caps to one another, I think you have the problem that the inherent shape of caps mean that you get a wide gap in combinations like KA RA LA, etc. The traditional way to deal with this is to space caps out more widely, and that can work. But now people usually want tighter spacing in caps, so it fits into running text, and you then are forced to make more compromises about overlaps and touching. And that means when you have a title, especially one pretty big, all digital fonts that I have worked with need to re-kerned to work really well. That's because when it's bigger you may want to change the spacing, and then either because of that or the original compromises the kerning doesn't work so well any more. </p>
      <p>All that being said, I personally looked to Slimbach as my model of excellent craftsmanship on spacing and kerning. I set the same words in my font and his Minion and Adobe Garamond, and if mine didn't work as well as his, it was a sign I'd screwed up. Also, alongside general admiration for his craftsmanship, I had a couple disagreements with his spacing and kerning philosophy. I felt his spacing overall tended to be a hair too tight for text sizes, and his kerning of quotation marks, especially in Minion, was so tight as to be distracting, and so a blunder.</p>
      <p>Doing the exercise you are talking about, I would test different rules for kerning against a number of faces of the best craftsmen working today. That would include in addition to Slimbach, certainly 'senior masters' such as Matthew Carter, Sumner Stone, Gerard Unger, Bram de Does, Adrian Frutiger (for sans only) and Hermann Zapf. There are many younger than these who are also excellent craftsmen, including Berlow, Schwartz, Hoefler, Frere-Jones, De Groot, and quite a few more. I would also include classic text faces such as Times New Roman and Sabon.  </p>
      <p>Finally, I hope Charles Ellertson chimes in. His work as a compositor has involved re-kerning existing typefaces so that they set better, so his critique of some of the best work would be interesting.</p>
