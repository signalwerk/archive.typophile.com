      <p>BTW, since most of my work is in non-Latin I had never been involved in the production of fonts with very large character sets until I collaborated on Ernestine. I only made the Armenian glyphs but because we chose to put them in the same font as the Latin I hit the kerning-limit wall very early - basically I was told to limit the number of kerns within the Armenian somewhat severely, not least because some of the Armenian characters had to kern with some of the Latin ones (mostly the numerals and some punctuation). In contrast when you're making a font with not a very large character set the "kerning philosophy" can be qualitatively simpler, in a way more pure. Anyway now I realize first-hand how tricky the kerning-limit situation is (and frankly it's a bit surprising). Will it be fixed?</p>
      <p>hhp</p>
