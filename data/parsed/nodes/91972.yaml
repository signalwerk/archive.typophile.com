    <p>Hello everyone, </p>
    <p>for research &amp; experiment purposes, I’m looking for a list of 60-100 digital fonts for the Latin alphabet (upright and italics, primarily serifs and sanserifs or various kinds), as well of 3-4 digital fonts for each of the major non-Latin scripts, which you would consider extremely/exceptionally well spaced and kerned. </p>
    <p>I’d like to exclude from that list all the digitizations made of typefaces that were designed on a unit-based system which made it necessary to make compromises. In other words, I’m looking for fonts designed with “high UPM resolution” in mind. </p>
    <p>We’re experimenting with various alternatives to the current spacing and kerning model, and would like to verify those models we’re prototyping with existing data (i.e. fonts) of high visual quality. </p>
    <p>Please list font names preferably by their family and style name, plus foundry name. Please give more details regarding the format, version, source vendor or release year etc. if there is a possibility of confusion. </p>
    <p>Many thanks in advance,<br>
    Adam</p>
