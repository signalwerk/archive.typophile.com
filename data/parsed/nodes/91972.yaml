      <p>The Goudy spacing shown in Nick’s image is typical of Monotype fitting, and of the era in general. There has been a shift in taste/philosophy/understanding — whatever you want to call it — between then and now.</p>
      <p>Recently, I have been studying a few Monotype and Linotype settings in books I admire, rather closely, and I’m beginning to wonder if part of the <em>je ne sais quoi</em> of that period, in addition to the typically cited letterpress vagaries, is also the matter of a different approach to fitting.</p>
