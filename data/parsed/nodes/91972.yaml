    html: |-
      <p>Carter’s approach to fitting is more or less what I would consider traditional, the sort of approach that underlies Tracy’s elementary account in <cite>Letters of Credit</cite>. And Carter’s approach to kerning is fairly light-handed.</p>
      <p>It’s been a while since I delved into Slimbach’s work, but his approach seemed to rely more on micro-kerning. In the original Minion there were lots of single-digit kerns — lots of ±2 or 3 units, even. And there were lots of unexpected pairs. </p>
      <p>The re-release of Minion Pro was refitted from the original; but looking just now at the Regular, for instance — if you take /o/ as the first member and pair it with each lowercase letter, you’ll find that there are kern pairs for 24 out of the 26, both positive and negative. That’s a very different approach.</p>
      <p>So, perhaps we have to paraphrase Duke Ellington: “If it <em>looks</em> good, it <em>is</em> good.”</p>
