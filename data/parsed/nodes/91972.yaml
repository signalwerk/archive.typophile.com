      <p>David, I can't envision Type Design as separated from spacing of type.  I can see letterform drawing perhaps as a beast of a different class but have difficulty prying apart the design of the spaces between letters from the spaces within a given letter.  To me, there are times to solve a space to neighbor problem by adjusting the drawing of the glyph instead of kerning.  This may seem like more work but it may also be critical work.<br>
      Space between glyphs can be quantified to a point and solved in groups.  There are instances when the proximity of terminals of neighbors can over-ride the quantified space (v to y for example).  The tension between these points has far less room for error and is often destroyed with enduser tracking.  It is like placing two magnets next to each other at the exact point where they stay in that relationship regardless of polarity. Movement in one direction causes immediate collision and in the other direction, disengagement.  This tension does not live alone. It is compounded by spacial volume and the shape of the space relating to nearby spaces. By this I mean that the space between parallel forms like A against V can create more of a magnetic attraction than unlike forms like S and H. When the W, A, V slopes become too  far from parallel , the counter forms play in a different key than  each-other and require a different spacing plan to play in harmony.</p>
