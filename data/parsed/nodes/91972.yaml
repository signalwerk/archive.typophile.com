      <p>What I would like to see are plus/minus 0-100% slider preferences for typical spacing and kerning patterns.  This would allow a type designer using the software to make educated kerning changes characterset wide.  An example would be o-o, n-n, n-u, v-n, v-v, etc..<br>
      This would allow for a table of neighboring shape interactions which could be portable and editable.  It would greatly reduce the amount of time by reducing the number of interactions needed to kern or set sidebearings for a given font.  The computer could read left and right shapes of glyphs for categorization but allow manual override by the user. When finished, the software could then set classes and metrics globally.  Changes could be made globally as well.  The user set slidebar settings would vary with font width, serifs, contrast, etc. as the user sees fit.</p>
