      <p>Adam,<br>
      I am not sure that I quite understand the point you are after and I have not studied the classic kerning systems mentioned.  I am not saying that what I do is any great mystery or even better than the average bear.  I would just say that I approach kerning/spacing with a naive but purposeful plan.  Naive, because I have made no attempt to study the methods of master craftsman throughout history.  Purposeful, because my intent is to marry the process of spacing and kerning, simply to make the glyphs fit with little effort. I certainly use positive kerns when they make the job easier.  I do positive kern oo and even HH simply because it reduces the number of kerning pairs overall. I don't recall ever making a kerning pair less than 4 units either positive or negative. I tend to fit beginning capitals on their right side with lowercase glyphs left side because this is the most common occurrence of mixed case.<br>
      Since I started my journey in to type design within the past 8 years, it has all been digital and therefore not based on solutions to problems brought to bear by the older technologies.  Is this any better way? Who knows.  I just say that it comes only with its own baggage rather than including baggage influenced by past technology.<br>
      Not to add credence to right-wing politicians, but I am a firm believer in "Family Values", meaning classes by shape in the typical class kerning scheme.  I consider some classes twins and other classes just siblings--that is to say, their behavior only partially mimics a sibling but in a predictable way.  the "u" and "n" glyphs are siblings, etc.<br>
      I make no claim that my method is any better than anyone else's.  I just say that this is what makes sense to me in my attempt to revisit my inner-child. If this is of any use to you in your experiments, let me know and we can discuss it further.</p>
      <p>Chris</p>
