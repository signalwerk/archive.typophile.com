      <p>The spacing of metal fonts should indeed not be seen as "out-of-whack", because of their inescapable physical limitations. But if you digitize a metal font and pretend it's not worth improving the spacing (assuming you're not vying for total historical accuracy) to me that's out-of-whack.</p>
      <p>&gt; 10 is as small a kern as I'd use</p>
      <p>I never go below 5, so Slimbach's 2s do indeed seem like overkill to me as well. But what about sidebearing determination? I myself stop at 2 (and that's for my best effort, not just anything).</p>
      <p>Like when making the new NHG, was the 18-unit system replaced with a 100-unit one?  :-)</p>
      <p>&gt; a change from one method to the other could simply signal a believe in the fonts being used primarily in environments with kerning enabled.</p>
      <p>That makes sense on the surface, but I would counter with the obvious: having kerns in place doesn't hurt when there's no kerning.</p>
      <p>hhp</p>
