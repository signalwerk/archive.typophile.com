      <p>Twins are so because they're quantized, siblings have been thresholded from each other. </p>
      <p>It's kinda a big issue if you think about all things type, from a pair of counters, to the weights in a font family, where this pair of activities, quantholding perhaps, is much of the creative activity as well as being a big part, in reverse, of tt hinting.</p>
