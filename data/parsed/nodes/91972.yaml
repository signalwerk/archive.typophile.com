      <p>I don’t know that it makes sense to cite a positive o-o kern out of context. How large are the sidebearings to begin with? How tight are the straights &amp; arches? And what is being gained or lost in other areas?</p>
      <blockquote><p>The reason it makes sense (to me) is that it reduces the need to fix a bigger mess on the negative end.</p></blockquote>
      <p>That may be all well and good; but in the case of Minion Pro, for example, the o is being kerned closer to most straights (on both sides, in many cases) and away from rounds. So, I don’t think Slimbach is employing this method in order to fix any “bigger messes” on the negative end. There are plenty of negative kerns.</p>
      <p>Instead, he seems to “split the difference” and then push things back and forth.</p>
      <p>Is this a better strategy? I don’t know. </p>
      <p>My point is mainly that you can’t really cite the presence of specific kern pairs out of context. You have to examine the entire strategy and the results.</p>
      <blockquote><p>David, don't you think metal types would have been better spaced if they had kerning (I mean in the sense we use it now)? </p></blockquote>
      <p>You may have meant this rhetorically, but I’ve begun to wonder if the answer to this is so obvious. Yes, it may have been able to be more even (as we now define that quality), but would that make it <em>ipso facto</em> better? Are today’s books easier to read than yesteryear’s? I don’t have a pat answer.</p>
