      <p>David, </p>
      <p>we’re re-imagining our font editing products: in our new codebase (codenamed Victoria), we have rewritten it from scratch, completely expanded its possibilities, developed a new flexible storage system for working files, removed the limitation of integer coordinates. We’ll be introducing a new drawing environment with improved drawing tools, some completely new drawing tools for both PostScript and TrueType outlines, with fully new approach to guidelines and the grid. It’s under heavy development now, parallel to the development of FontLab Studio 6, which will still be based on the current FontLab Studio codebase with some improvements within the existing paradigm. So we’re working two-fold (short-term and longer-term). </p>
      <p>We believe that Victoria will be a radical improvement for type design. For some time, both FontLab Studio 6 and Victoria-based products will likely co-exist, because users will need to re-learn the tools when switching from FLS to Victoria. Also, it’s likely that in the first iteration of Victoria, not all of FLS’s functionalities will be replicated right away. </p>
      <p>I myself think of FontLab Studio being like Adobe PageMaker, and Victoria being like Adobe InDesign. InDesign 1.0 was, on one hand, much more flexible than PageMaker and free of many of its limitations, but it still took some time until InDesign incorporated (and improved) all of PageMaker’s capabilities. </p>
      <p>As for hinting, there are numerous projects going on right now in the world (there’s VTT-based workflows, there is FreeType ttfautohint, there is RoboHint, and there are our own FontLab TT Hinting tools). We’d love to create a common project with all the parties involved that would allow at least basic interoperability between the various tools. For example, we’d like to be able to use the same basic information that RoboHint or VTT uses. We’d like to be able to read the “wings”, even if perhaps not all of the tools’ functionalities would be the same. </p>
      <p>Since we’ve supported Werner Lemberg financially in the development of the FreeType ttfautohint project, and intend to continue to do so, I think it’d be very likely that we could come to an agreement at least between RoboHint, FreeType and FontLab for some interoperable notation. Do you know if RoboHint would be interested in open-sourcing or publishing at least some aspects? I think the actual contents of the wings and winglets could be owned by various developers, but the basic underlying data could be shared. We’d love to get involved in this. </p>
      <p>I agree that the image compression metaphor shouldn’t be transferred literally to font editing. For me, the “uncompressed image” is analogous to a “spacing matrix” — the relative positions of each glyph in a font to every other glyph in a font (with the “text run left boundary” and the “text run right boundary” being pseudoglyphs in that matrix). Such spacing matrix is a finite, “decompressed” representation of glyph positioning in a font. Such a spacing matrix can be expressed or approximated with (i.e. “compressed into”) various combinations of sidebearings and kerning pairs. If the glyph pairs are prioritized by their frequency of appearance in real text, this would influence the compression mechanism — the most frequent combinations should have a preference of being expressed by sidebearings while the less frequent combinations could be expressed by kerning. Some very rare combinations or such that practically never occur in real life could be eliminated from kerning, especially if the kerning values were small. It’s a bit similar to how some audio compression mechanisms work — the frequencies that are less hearable by the human ear are compressed more aggressively (more lossy) while the frequencies to which the human ear is more sensitive are compressed more moderately (less lossy). </p>
      <p>That’s roughly my direction of thinking. Comments? </p>
      <p>Cheers,<br>
      Adam</p>
