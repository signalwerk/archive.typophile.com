      <p>I don't know if you plan an interactive module or just a "compressing" tool, but I am very impressed.</p>
      <p>Ever wondered why we, graphic designers, hated Quark, and why so quickly migrated en masse  to InDesign. Well, I guess, because it was not a pre-press program. It was a program <em>about</em> pre-press.<br>
      Definitely - as it was with Quark - the current font creation technology is too focused on telling a story about itself, about its history and current state. We think with pre-computer paradigms, because our new tools still mimic the old workshop. But wherever possible, the mechanically repetitable, technology-specific issues  should be hidden from the user and displayed only on request (as it is with the JPEG compression settings/previews), because when a man does the work of the machine, he is a machine. It's the effect, that counts - not the way the classes were set. Any tool that helps to focus solely on the work will bring great relief.</p>
