      <p>Hrant, </p>
      <p>unfortunately, the 64K limit (65,536) is deeply tied into the OpenType font format specification, for example: </p>
      <p>* An OpenType font can only hold up to 64K glyphs; it may appear as a large number but the Unicode Standard 6.1 encoded 110,181 characters. Some people may say that it’s “not necessary” to include glyphs for all Unicode characters in one font — but that, indeed, depends on the subjective notion of necessity. </p>
      <p>* The OpenType “kern” table, which holds the “old-style” TrueType pair kerning information can include multiple subtables, each of them being limited to 64KB in size, which translates to up to 10,920 kerning pairs. If you were to kern each glyph with every other one, you could only provide a kerning table for 104 glyphs using this mechanism. Of course you don’t kern each glyph with every other one, but at least this limit means that you can only provide kerning for about 100 glyphs that need kerning. The kerning can be placed into multiple subtables but not all operating systems and applications can access more than one subtable in the “kern” kerning table. </p>
      <p>* The OpenType “GPOS” table, which holds the “new-style” OpenType kerning can include multiple subtables (each limited to 64KB in size), but kerning in the “kern” feature can be expressed using class kerning pairs and individual glyph kerning pairs, and can be split into multiple lookups (that are being executed one after another). Also, a special ExtensionType GPOS lookup can be used to address subtables with an offset larger than 16-bit but the subtable size is still limited to 64KB. The combination of multiple lookups (simple and extension), multiple subtables and class kerning theoretically lifts the limit in kerning size, but is difficult to handle for the designer. (Writing all these lookups, subtables and classes so that they just fit into technical limitations of OpenType is like as if you were forced to write your novel with just the words and syntax that allow Google Translate to automatically translate your novel into a different language.) Also, various operating systems and applications do not support multiple lookups in the “kern” feature, or the extension-type lookups. So in addition, you need to prioritize your kerning values: put the largest adjustments into the first subtables or lookups, and put the minor adjustments “further down the stream” in anticipation that they get ignored by some apps. </p>
      <p>Type design always has been subject to limitations of the currently available technology. But the limitations of the technology imposed by the OpenType font format should be easily solvable for today’s software. After all, we have gigahertzes of CPU power and gigabytes of RAM at our disposal. Unfortunately, we have to yet see a software developer who writes a good bullet-proof algorithm for expressing any kerning table, regardless of its size and complication, within the boundaries of the OpenType reality. We at Fontlab Ltd. are working on such solution, but the results aren’t yet ready for prime-time. </p>
      <p>Personally, I believe the current paradigm of spacing (setting sidebearings) and kerning to be a mechanism of compression. If you look at the image formats such as PNG and JPEG, they include a “progressive” flavor where high-resolution images are compressed and in addition, lower-resolution versions (also compressed, but with less details visible) are provided in one file. The difference between PNG and JPEG is that PNG is “lossless” i.e. after decompressing, you get exactly the same pixels as before compression, while JPEG is “lossy” i.e. some neighboring pixels are made the same during compression and the pixel-perfectness gets degraded (by a factor determined by the user). The more loss, the more efficient the compression. </p>
      <p>We’re working on transferring these concepts onto glyph spacing and kerning. In my view, sidebearings provide the “topmost” rule for spacing glyphs (“this is how this glyph spaces to <em>all</em> other glyphs including glyphs from other fonts”), class kerning provides spacing corrections to pairs of glyph groups (“this is how this glyph spaces to <em>many</em> other glyphs, correcting the previous spacing”), and individual pair kerning (class kerning exceptions) provide additional corrections to pairs of individual glyphs (“this is how this glyph spaces to <em>this other</em> glyph, correcting the previous spacing even more”). Following this paradigm, contextual kerning (which is possible in “GPOS”) provides correction in yet more isolated cases. </p>
      <p>This is almost like the “progressive” image formats. “Just sidebearings” are the lowest-resolution version of the image, and sidebearings plus class kerning plus exceptions are the highest-resolution version. The way the sidebearings, the kerning classes, the subtables, the lookups, the individual pairs etc. are set up in a font is primarily a <em>technical matter</em> of dealing with <em>compressing all spacing situations between all glyphs</em> into a specific compressed format. </p>
      <p>Along the same lines, if PNG is lossless and JPEG is lossy, then the cluster quantizing of spacing or kerning values is a method for lossy compression. </p>
      <p>Note that some image editing applications, when producing the lower-resolution versions of “progressive” image formats, or when producing lower-resolution thumbnails for images, apply some image-processing filters — notably sharpening. This is very similar to the quantization and hinting techniques which David Berlow has been talking about for a long time. </p>
      <p>Type designers and font engineers have become accustomed to drawing optical sizes, performing outline quantization, hinting, setting sidebearings, making kerning classes, setting the class kerning values, adding kerning pair exceptions etc. — mostly by hand, and sometimes as semi-automated steps. </p>
      <p>However, all these steps have been mostly performed separately from each other. I believe that a lot of knowledge that has been gathered in image-processing research with regard to compression, low-resolution optimization, progressive image encoding etc., can be applied to type design and digital font production. </p>
      <p>Sometimes, I think that type design and font production today works as if a digital photographer were hand-editing each region of a compressed JPEG image, fiddling with different regions, applying shuffling various compression parameters and filters by hand of all the different regions of an image. Or as if the font engineer was compressing a JPEG image by hand, writing each compressed segment himself (and running a somewhat imperfect, simplified version of the compression algorithm in his head). </p>
      <p>While this may be a good working method for some, I don’t think this has to be the only working method for all. The image editing software has done tremendous progress in developing all kinds of smart algorithms — which was mostly because images arrived on the web and bandwidth was sparse. </p>
      <p>Unfortunately, fonts arrived on the web at a time when bandwidth is no longer so sparse. And fonts are relatively small compared to images. I think if webfonts had taken off back in the IE/EOT times of 1996, we would have been in a much better place now when it comes to software tools. </p>
      <p>But I still believe that there is a lot to be done. We should work on automatic algorithms for “electronic type compression and low-sizes optimization” (which includes autohinting as much as intelligent dealing with spacing/kerning). </p>
      <p>Some weeks ago I found this Typophile thread on <a href="http://typophile.com/node/66574" rel="nofollow">alternative spacing paradigms</a> from two years ago. Much of what I’ve read there was in-sync with my own thoughts and concepts that I’ve been developing over the last two years myself. </p>
      <p>So I started this current thread to gather some additional input data and get some discussion going — so that I can work on some models that, on one hand, could improve the current paradigm of doing spacing/kerning (by possibly separating it from the internal details of how this is handled in the OpenType font format), and on the other hand, could finally address the “compression” problems properly. </p>
      <p>Because I’m really unhappy to see the “subtable break” problem being reported for the 987th time. But the “subtable break” problem cannot be reasonably addressed in isolation, just by itself. The whole thing needs a fresh look. </p>
      <p>So I’m wiping my glasses now. :)</p>
      <p>Thanks for the discussion so far,<br>
      Adam</p>
