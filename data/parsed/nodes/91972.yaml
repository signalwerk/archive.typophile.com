      <p>The only problem I have with looking at Robert Slimbach’s more recent work is that, with such massive character sets, I know there are some bugs and omissions in the font, and also some compromises made because of the technical limitations of the OpenType font format (the way classes are set up etc.). </p>
      <p>I’ve discovered some problems myself there, and even though I know how much effort goes into the design and production process at Adobe, with such ambitious efforts, I think some mistakes are inevitable. </p>
