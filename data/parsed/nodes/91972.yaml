    html: |-
      <p>Whenever i go off to rethink spacing I look at a small number of well-spaced families in the class I'm interested in, containing as wide a variety of widths and weights as I can find.</p>
      <p>@HP "David, don't you think metal types would have been better spaced if they had kerning (I mean in the sense we use it now)?"</p>
      <p>Sure! Not having to saw off serifs is one kerning that helped, and the Latin uppercase AFKLPTVWXY were not designed to fit well mechanically to its entire lowercase. But that's far from saying all metal fonts' spacing  was out-a-whack for lack of an oo kerning pair.</p>
      <p>@HP "David, would you say Slimbach is wrong in positively kerning "oo"?"</p>
      <p>Nope! But 9/1000 ain't so far from zero that I'd hold it up for the class. 10 is as small a kern as I'd use, 1/100th of an em, and that's mildly ridiculous. Carrying around 100s of +-2-9 unit kern pairs is... I'm not sure what the word is in English, in Berlowese I just bow and smile these days.</p>
      <p>I think, that there are two general ways to do this; one is to space for a smaller number of kerning pairs even if it looks not as well in non-kerning apps, and the other is the opposite, there are more kerning pairs but it works better without kerning. </p>
      <p>Far from some mystical development of some type designer's view, a change from one method to the other could simply signal a belief in the fonts being used primarily in environments with kerning enabled. As the web has proven, kerning is not yet a safe bet to me, so I do it the way I always have, which means o, n and p do not kern to each other.</p>
