      <p>Adam, I don't think it fits your model, but another tool for letterfit is to use alternate glyphs. For example, an "f" with a fairly large negative right sidebearing allows you to skip kerns with many x-height lowercase letters, at the cost of problems with glyphs having ascenders (or "ink", as with quotes) on the left, and word spaces. A second "f with a bit shorter terminal and a bit less negative sidebearing can be quite useful. The trick is to make the difference between the two glyphs at least unobjectional, if not unnoticeable. </p>
      <p>* *  *<br>
      The way I think about kerning is any kern value between a pair of letters is limited to the case worst situation. For example, take a look at the string</p>
      <p>A'," </p>
      <p>in Adobe's Warnock. Any two of those in combination look just fine. But the four together -- which can happen in a text -- creates a mess.</p>
      <p>I'm stealing from my chapter in a forthcoming book here. A few more typophile posts and the chapter will lose all value. But what you're after is important, I think. As you define the problem, I worry it will cause sacrifices on the shapes of some glyphs, but that's a worry, not a fleshed-out thought.</p>
      <p>Charles</p>
