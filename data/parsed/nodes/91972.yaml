      <blockquote><p>I would also include classic text faces such as Times New Roman and Sabon. </p></blockquote>
      <p>I think Sabon falls outside Adam’s original criteria. The original design, as you know, was constrained by the goal to set exactly the same on both Monotype and Linotype, and so it was unitized <em>and</em> had little or no kerning. </p>
      <p>Sabon was an excellent solution to a knotty challenge and has always set surprisingly well given the circumstances. But I suspect it would not be an apt exemplar for the work Adam &amp; team are doing.</p>
