  - id: 506441
    user: 1133
    date: 2012-04-20T07:26:00
    date_raw: 20 Apr 2012 — 7:26am
    votes: null
    html: |-
      <p>Nick, </p>
      <p>&gt; Why redesign the core to ﬁx a few peripheral glitches?</p>
      <p>As you are a type designer, you’ll know that there are situations when you can, indeed, “fix some peripheral glitches” such as improve some kerning pairs or fix a few odd outlines, like I’m sure Robert Slimbach had done with Adobe Garamond when he was working on Adobe Garamond Pro. </p>
      <p>But then, there is also time for a comprehensive re-imagining, and redrawing everything from scratch, where you don’t need to worry about backwards compatibility, document reflow etc. Which is what Slimbach did with Garamond Premier Pro. </p>
      <p>Both Adobe Garamond Pro and Garamond Premier Pro are on sale, and we intend to make incremental improvements to FontLab Studio as it exists today, but also have a new platform which allows us for much greater flexibility. On top of that, the new platform is by design much more stable because it follows a different style of programming. It’s easier to fix problems or change things, because they’re all cleanly separated from each other rather than being interwoven deeply. </p>
      <p>We consider the FontLab Studio codebase “mature”, in both positive and negative connotations of that word. The positive aspect of maturity is that it’s well-known, familiar and predictable, but the downside is that it’s much less agile and flexible, and it takes a lot of time to change things. The Victoria codebase is “young and learning”, currently in its teens. It still needs to learn quite a few things (including learning from FontLab Studio), but has immense potential. </p>
      <p>The codebases are 15 years apart, and since software ages a bit more faster than people, it’s roughly equivalent to one human generation. There is time in which both generations (parents and children) are “professionally active”, and we’re approaching the moment this starts. At some point, the old codebase will be retired and only the younger generation will be active, but it’s still a *long* way towards that. </p>
      <p>Best,<br>
      Adam</p>
