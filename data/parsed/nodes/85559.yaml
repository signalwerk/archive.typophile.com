    html: |-
      <p>Monotype could handle kerning f’s, Ben; it’s Linotype that could not. (Although, that doesn’t mean that Mono always cut kerning f's. Often they did not. But that wasn’t a mechanical limitation.)</p>
      <p>This is most likely one of the relatively generic Old Styles, which usually went by just a number. Both manufacturers had plenty of similar faces in the genre.</p>
      <p>I’d have to pull out my old catalog to identify which one. But it probably doesn’t matter, because most have not been digitized. </p>
      <p>A few digitizations in the general category:</p>
      <p><a href="http://new.myfonts.com/fonts/agfa/old-style-mt/" title="http://new.myfonts.com/fonts/agfa/old-style-mt/">http://new.myfonts.com/fonts/agfa/old-style-mt/</a><br>
      <a href="http://new.myfonts.com/fonts/agfa/old-style-7/" title="http://new.myfonts.com/fonts/agfa/old-style-7/">http://new.myfonts.com/fonts/agfa/old-style-7/</a><br>
      <a href="http://new.myfonts.com/fonts/agfa/binny-old-style-mt/" title="http://new.myfonts.com/fonts/agfa/binny-old-style-mt/">http://new.myfonts.com/fonts/agfa/binny-old-style-mt/</a></p>
      <p>The roman and bold would not necessarily have been part of the same family. The Old Styles generally date from a period before our modern concept of type family had fully emerged.</p>
