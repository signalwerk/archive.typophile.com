    html: |-
      <p>It helps to have seen the two different machines in operation to understand what’s possible and distinct between the two. But it’s mostly just historical trivia now.</p>
      <p>Often the bolds were pulled in from other designs altogether. Sometimes they would be renamed and married together (what we Americans might call “a shotgun wedding” ;-)</p>
      <p>Or compositors would just make their own combinations as the situation required. Often an Old Style was paired with an Antique or Ionic/Clarendon for emphasis, since these styles were naturally bold.</p>
      <p>The combo in the posted example seems to be a little bit more closely related (but only a little).</p>
      <p>As I said, our modern notion of “family” was only just taking shape at the turn of the 20th century and was by no means pervasive.</p>
