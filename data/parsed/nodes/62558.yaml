    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2_3692.png"></div><p></p>
    <p>Greater Albon Typefounders has just released our next two families on Myfonts. com.</p>
    <p>Goldbarre is a finely engraved slab serif face in the spirit of ‘between the wars’ commercial confidence. It’s a solid and dependable face of distinction for use on certificates and posters which need to convey an emphatic yet refined message. The letterforms of Goldbarre combine finely hatched shading with and embossed, three-dimensional, quality.</p>
    <p>Veneribe -the Venerable face- is an experiment in what many today might call ‘grunge’, though we at Greater Albion would probably prefer to talk of rustic (or if we’re feeling really old-fashioned rustick) charm. It’s a derivative of our Clementhorpe family, and aims to combine a battered antique look with the charm of that decorative Roman family. Regular and oblique forms are offered.</p>
    <p>You can preview these faces in acction on our <a class="freelinking external" href="http://gatf.wordpress.com "> blog</a> or try them out for yourself on <a class="freelinking external" href="http://new.myfonts.com/foundry/Greater_Albion_Typefounders/ "> Myfonts.com</a>.</p>
