    html: <p>While it should be a custom job by <a href="http://www.saguez-and-partners.com/Yves-Rocher-Producer-Manufacturer" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Saguez &amp; Partners</a>, I suspect it's just a mix of some well-known sans. /Y, /V, /E, /H and /S could have been taken from Helvetica Neue (or any other Helevetica-ish (rip-off) font like Zurich, Pragmatica, Nimbus Sans...), /O and /C from Avant-Garde Gothic and /R from Akzidenz Grotesk or Proxima (Sans or Nova) or Gotham...</p>
