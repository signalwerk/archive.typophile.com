    html: "<p>David, <br> <br>I don't actually want to do technical and administrative support on this forum, but in your case it looks that something was just wrong. It usually takes about 24 hours to process any request by our sales department. Please, fill an update request form one more time and contact me directly if it will not work. <br> <br>We decided to not publish freely downloadable 4.5-&gt;4.6 update because we are releasing it for free and we don't want to give this update (which is very serious) to non-legal users of FontLab. That's why you have to pass trough this upgrade process. 4.6.1 update which we plan to release soon will be available as simple download and will fix few problems in 4.6. <br> <br>I will say it again: if you contact us and get no reply in 48 hours then it means that there is a problem in communication. Just post your question again to <a href=\"mailto:support@fontlab.com\">support@fontlab.com</a>.  <br> <br>And you always have a backup support system: <a href=\"http://groups.msn.com/fontlab\" target=\"_blank\">http://groups.msn.com/fontlab</a>. All messages posted to that forum go to my mailbox immediately. Sometimes you will get faster answer from other FontLab users who are there. <br> <br>Best regards, <br>yar[at]fontlab[dot]com</p>"
