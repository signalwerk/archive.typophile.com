    html: |-
      <p>I think Calluna is quite beautiful and holds up well next to other faces with much heftier price tags (this is my extremely inexperienced lay-opinion). I find the "direction" or "flow" characteristic to be very nice; it adds character without sacrificing legibility or seriousness. Because this "direction" is more pronounced at larger sizes, I'd feel comfortable using it in both lengthy text and display settings.</p>
      <p>Also, I don't have Minion pre-installed, and I only have the bold and italic faces... however, as necessity dictates, I wouldn't be at all surprised to find myself buying the rest of them sometime in the future.... :]</p>
