    html: <p>Well, <a href="http://new.myfonts.com/fonts/exljbris/calluna" rel="nofollow">Calluna</a> is neither bad nor expensive — but you could use <a href="http://new.myfonts.com/fonts/adobe/minion" rel="nofollow">Minion</a> instead. It is similar in style, certainly not inferior in quality and you might already have it on your machine in a sufficient range of weights. This leaves you some room to purchase a complementing display typeface.</p>
