    html: |-
      <p>There’s a <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/features_pt.htm#size" rel="nofollow">‘size’ feature</a>, but AFAIK it is not supported by any software. If this is true, I don’t think it’s a good idea to put all your optical variants into one single file.</p>
      <p>A better approach would be to use different fonts named properly, as <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/garamond-premier/" rel="nofollow">Adobe does</a>.</p>
