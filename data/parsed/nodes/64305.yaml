    <p>I need help..<br>
    I am aware of how to do optical scaling to make different weights using MM based work-flow. But how to make open-type font that would include different masters for different pt sizes. As I want to refine 4tp, 5pt, 6pt, 7pt, etc. I guess it has to do something with wrapping up multiple fonts and some open-type coding, is it so?</p>
    <p>So, some help on this would be highly appreciated.<br>
    Links or key words for searching would do too.</p>
