    html: |-
      <p>I've played around with it, and will say you can use Object &gt; Blend to achieve interpolation. You can also specify the number of steps you want so you will end up being able to choose which one you like the best.</p>
      <p>The downside? Unless you are super-attentive to making sure your two masters are node compatible, it will probably only work one character at a time without making a huge mess of things. I never tried it with multiple characters.</p>
      <p>It just occurred to me that I should have tried it with three in-line masters; that might be interesting.</p>
