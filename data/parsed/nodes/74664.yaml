    <p>I'm currently working with a client who's main corporate font is Linotype Didot including the ornaments cuts. As it was a relatively new font for me I started to gather inspiration on usage around the web (mainly Vogue &amp; Google images) to look at styling and layout compositions.<br>
    One of our recent proposals included usage of some Didot ornaments, more in a abstract decorative manner and I'm keen to study this area further.</p>
    <p>Would anyone know of any online resource or even books I could purchase on modern/contempory usage of Didot ornaments? If nothing so specific any suggestions for further reading?</p>
    <p>Many thanks,<br>
    Hugo</p>
