      <p>I think Adrian Fruitger was influenced by La Henriade when he 'revised' Didot to a family of 12 weights including the ornaments in 1991, so recent editions they are.<br>
      I've heard typographers call them elegant, classic and even powerful but never wretched!<br>
      Just out of interest as I enjoy hearing constructive criticism, why do you feel that way?</p>
      <p>...one mans rubbish is anothers treasure i suppose :)</p>
