      <p>I fear I am walking blindly into an area I know very little about but that's not going to peturb me. I'll need to work with them for a while before I'll feel comfortable presenting further and I have some time (until the new year) to guideline usage of these cuts within their corporate visual guides. I'm still not sure if they will end up in there or not, I need to look at application carefully, in the wrong hands it could end up a disaster.</p>
      <p>I'm rather excited about the reference of 'Art Moderne' by Nick though, I hadn't thought to research in that era or art style. I sense it's not an area of passion for you both but again, could you recommend further reading in this area?</p>
      <p>I have also taken advice and purchased myself a copy of Giambattista Bodoni - Manuale Tipografico (well it is my birthday today and amazon twists the arm so well). It's one of only a handful of serious historical reference books I've bought since my college days and almost since I owned my first computer, which I'm sure is more to-do the reason. So I look forward to receiving it, it's a good read at over 1200 pages too.</p>
