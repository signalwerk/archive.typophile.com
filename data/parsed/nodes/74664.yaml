      <p>It's made me wonder why the ornament cuts were developed in the first place, was this a 'fad of the times' or something that was added at a later date? I really know very little history of ornaments.</p>
      <p>There seems a lot of attention in getting them to mirror a Didone ascetic of unornamented structure and a "modern" appearance, I would have thought ornaments useful in typographic design of today when you see attributes of fonts like flourishes becoming (perhaps too) popular within typography also.</p>
