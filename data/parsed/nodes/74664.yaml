    html: |-
      <p>Akira Kobayashi's FF Acanthus has some good neoclassical ornamentation.</p>
      <p>But surely the point of the Didone (modern) style was a spartan classicism.<br>
      The only ornament really necessary when working in this style is the bulging rule; IIRC H&amp;FJ have a few of those.</p>
      <p>Various Didone glyphs have been used decoratively, such as the asterisk.</p>
      <p>I included a few dingbats (not really ornaments) in Scotch Modern.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/dings_5303.png"></div><p></p>
