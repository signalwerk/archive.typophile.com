      <p></p><div class="imageWrap"><img src="http://typophile.com/files/didot_ornaments_5011.png"></div><p></p>
      <p>It would appears that whoever designed the Didot Ornaments shown above took "Modern" to mean "Art Moderne," a.k.a. Art Deco,a style which they attempt--at least to my eye, rather poorly--to emulate.<br>
      On the other hand, the Bodoni ornaments below which appear in the book I referenced are in keeping with their actual historical period, and are--again, to my eye--rather elegant.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/bodoni_ornaments_5151.png"></div><p></p>
