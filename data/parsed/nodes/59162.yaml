    html: |-
      <p>My web site is <a href="http://bowfinprintworks.com" rel="nofollow">Bowfin Printworks</a>, and the majority of its content is about <a href="http://www.bowfinprintworks.com/FontSpotting.html" rel="nofollow">Font Identification</a>. Since 2000 I have developed, with a lot of help from many typophiles (with and without capital T), five Font Identification Guides:</p>
      <p>the <a href="http://www.bowfinprintworks.com/ScriptIDGuide.html" rel="nofollow">Script Font ID Guide</a>, which is probably used the most on my site, with its <a href="http://www.bowfinprintworks.com/ListPages/ScriptListAB.html" rel="nofollow">Script Font Reference List</a>; </p>
      <p>the <a href="http://www.bowfinprintworks.com/BauhausFaces.html" rel="nofollow">Bauhaus-style Font ID Guide</a>, my first ID Guide; </p>
      <p>the <a href="http://www.bowfinprintworks.com/SansIDPage.html" rel="nofollow">Sans Serif Font ID Guide</a>, which was the first Guide to use my Key letter identification method, and which is in the process of being replaced by the <a href="http://www.bowfinprintworks.com/SansGuide/sanssearch.php" rel="nofollow">new interactive version</a>; </p>
      <p>the <a href="http://www.bowfinprintworks.com/LinedFontGuide01.html" rel="nofollow">Lined Fonts ID Guide</a>, for multiline and inline styles; </p>
      <p>and my personal favorite, and most complete Guide, the <a href="http://www.bowfinprintworks.com/SerifGuide/intro.php" rel="nofollow">Serif Font ID Guide</a>, which allows the use of the attributes of just 12 letters (a, b, e, g, y, E, J, K, M, R, U and W) to identify over 1,800 serif type families, including many pre-digital typefaces.</p>
      <p>The Bowfin Printworks home page talks about custom spice labels and other graphic services, but these are how I pay for the web site, along with some donations from people who get personal font ID help from me via e-mail.</p>
      <p>The site also includes the <a href="http://www.bowfinprintworks.com/BowfinPond.html" rel="nofollow">Bowfin Pond</a>, where I have collected most of my poetry and other writing.</p>
      <p>- Mike Yanega</p>
