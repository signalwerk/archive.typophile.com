    <p>Hi there.</p>
    <p>I'm currently working on my final major project at uni. The aim is to express norwegian values through a typeface. I was hoping that you guys, could help me out in the initial stage. As i guess there is not many norwegians here, although some might be familiar with my country, i would appreciate if you know about other similar project, good books, links on the internet, or just thoughts and comments about how i should get started.</p>
    <p>I have been looking into swiss typography and i know there is a obvious link. Also german blackletters inspired norwegian typography in the early days.</p>
    <p>Hope you can help me out in some way.</p>
    <p>thx.</p>
    <p>henrik fjeldberg</p>
