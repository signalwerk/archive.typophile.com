    html: |-
      <p>Henrik,</p>
      <p>Perhaps you could focus some of your research on how Norway has used design to project a national image to an international audience. </p>
      <p>This would include the Norwegian tourist authority and, obviously, the design work done for the Lillehammer Olympics. </p>
      <p>It might be interesting to speak with some of the people involved in these campaigns, because they had to deal with the very issue in which you are interested, although embracing issues beyond typography. </p>
      <p>As a balance, it might be usefull to look at trends in Norwegian art, writing, music and film, as they relate to popular culture.</p>
      <p>This idea that a particular culture can be captured in type is interesting. I believe that there is some truth to it, but that it is an  elusive idea among countries that share a common cultural heritage. </p>
      <p>I assume that you have seen Kitchen Stories, which would be an interesting, and amusing, point of embarkation for a project like this if you want to be whimsical. </p>
      <p>Good luck.</p>
