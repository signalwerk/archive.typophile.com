      <p>Except for the modern links above, you might have found a slim topic. I grew up around Norwegian-Americans but none of them designed fonts. Even a Norwegian type designer is going to be challenged to single out (cultural?) "values" that can be translated into a unique typeface. Besides this, most typefaces are designed to express something in a particular kind of document, or something slightly less broad than a national "something". Even if one were trying to compose an exclusively "Norwegian-looking" document of some kind, one would need to travel back to a time before the Latin alphabet was use in order to be clear of Sweden, Denmark, or Spiekermann.</p>
      <p>Now in Boston, we have a single letter, a "B",  in a specific font, that sums the whole culture up. NY, being twice as mouthy and not nearly as discerning, needs two letters and the font doesn't matter. Most other places, Seattle, the Bahamas or Milwaukee, e.g. have nothing much to show for themselves typographically.</p>
