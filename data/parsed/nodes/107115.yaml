    <p>Hello,<br>
    We are Novo Typo / Typopixo from Amsterdam, The Netherlands.<br>
    We developed a code to make multi-color fonts (multicolor-pixels in png format in unicode) useable as webfonts. </p>
    <p>The website for this new project is online for testing now. We are looking for high quality multi colorfonts to extend this collection.<br>
    Who will be&nbsp;interested in selling your typefaces via this website?<br>
    It will increase your market, audience and sales for webfonts. We did some testing with typographers, designers, webdevelopers and programmers and the response is very enthusiastic and promising.</p>
    <p>If you are interested in a collaboration we can send you a link to the website, a personal login-code and detailed information about the technique, contracts and EULA, etc.</p>
    <p>To convince you of our good intensions and the quality of our technique you can send us some multicolored png’s with a transparant background. We can put them on the test-website so you will get an idea how it all works. Of course, if we don’t come to an agreement we will trash all files.<br>
    If you are just curious how our technique is working, just send us an email. We will be happy to send you an inlog-code and some information about this new project. Please feel free to attend us on people who might be interested in this project.</p>
    <p>Looking forward to hear from you,<br>
    best regards,</p>
    <p>Novo Typo<br>
    Beautiful typefaces from The Netherlands</p>
