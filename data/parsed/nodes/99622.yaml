    html: |-
      <p>Wow.<br>
      Here's what happened: since Daniel didn't provide a link I typed "Sinaloa font" into Google, and got a full page of sites offering it for free. I didn't bother checking MyFonts since it's rare for the cloners not to even change the name... :-/  Whoever owns Sinaloa sure isn't doing a good job protecting it. So I was right that the free one is illegitimate - but Daniel could've been talking about the commercial original. On the  other hand since he never corrected me I have a feeling he saved that $26.  :-/</p>
      <p>As for Bifur: there I was saying that Sinaloa feels inspired by Bifur (which is from the 1920s) and it might be worth considering a "purer" original.</p>
      <p>You know what's sad BTW? Nobody besides me -not even people I'm <em>dead sure</em> knew that Sinaloa has both a legit and a clone version, under the same name- said a word about this.</p>
      <p>hhp</p>
