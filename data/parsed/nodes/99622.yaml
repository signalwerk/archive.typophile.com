      <p>That’s news to me, I just remember it from Letraset days.<br>
      Sinaloa always struck me as being a kind of Baby Teeth with Stripes design, rather than letters composed of bifur-cated parts on the same plane. Anyway, I tend to be a bit of an historical purist, and like to match faces from the same era, hence the AG suggestion.</p>
