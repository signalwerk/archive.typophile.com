    votes: null
    html: <p>David Lawley wrote <br> <br>&gt;I notice that with some typefaces,  <br>&gt;for example Bliss, the 'Cap height' and  <br>&gt;'Ascender height' are different, is there  <br>&gt;a reason for doing this, or is it just  <br>&gt;a look thing? <br> <br> <br>It's rarely just a look thing. As Hrant says, readability is usually paramount.  <br> <br>But ascenders can be exactly the same height as cap H, successfully. As long as the stem weights of the caps (like H, with its vertical straights) are properly balanced with the (slightly thinner) weight of the lowercase letters with vertical stems, it can work fine. <br> <br>The same applies to italics and obliques. <br> <br>For a very interesting, decades old and quite delightful experiment with ascender/descender variance, look at the typeface series called 'Parsons'. <br> <br>Try to find an original cut, or an original type specimen or promotional booklet from the founder, showing all the designed alternates.  <br> <br>It's a lovely thing, really. <br> <br>Joe <br></p>
    html_clean: <p>David Lawley wrote <br> <br>&gt;I notice that with some typefaces,  <br>&gt;for example Bliss, the 'Cap height' and  <br>&gt;'Ascender height' are different, is there  <br>&gt;a reason for doing this, or is it just  <br>&gt;a look thing? <br> <br> <br>It's rarely just a look thing. As Hrant says, readability is usually paramount.  <br> <br>But ascenders can be exactly the same height as cap H, successfully. As long as the stem weights of the caps (like H, with its vertical straights) are properly balanced with the (slightly thinner) weight of the lowercase letters with vertical stems, it can work fine. <br> <br>The same applies to italics and obliques. <br> <br>For a very interesting, decades old and quite delightful experiment with ascender/descender variance, look at the typeface series called 'Parsons'. <br> <br>Try to find an original cut, or an original type specimen or promotional booklet from the founder, showing all the designed alternates.  <br> <br>It's a lovely thing, really. <br> <br>Joe <br></p>
