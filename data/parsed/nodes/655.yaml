    html: "<p>&gt; ascenders can be exactly the same height as cap H, successfully. As long as the stem weights .... <br> <br>I don't see it as a weight issue - instead it's a matter of proportions: caps generally fill most of the rectangle defined by their width and height, while lc characters fill the x-height or at most the x-height and a stick to the ascender height (except the wonderful \"f\"). So the only way you can safely match the cap and ascender heights (in a text face) is if: the lc x-height is very large and/or the caps are very narrow. But the former is damaging to readability while the latter is usually aesthetically fatal. <br> <br>&gt; ascender/descender variance <br> <br>Such variance is sady under-rated, in this Modernist era of regularity. ATF Garamond (AKA Garamond #3) has some amazing ascender variance, even though aesthetically I wouldn't touch it with a 10-foot composing stick. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; ascenders can be exactly the same height as cap H, successfully. As long as the stem weights .... <br> <br>I don't see it as a weight issue - instead it's a matter of proportions: caps generally fill most of the rectangle defined by their width and height, while lc characters fill the x-height or at most the x-height and a stick to the ascender height (except the wonderful \"f\"). So the only way you can safely match the cap and ascender heights (in a text face) is if: the lc x-height is very large and/or the caps are very narrow. But the former is damaging to readability while the latter is usually aesthetically fatal. <br> <br>&gt; ascender/descender variance <br> <br>Such variance is sady under-rated, in this Modernist era of regularity. ATF Garamond (AKA Garamond #3) has some amazing ascender variance, even though aesthetically I wouldn't touch it with a 10-foot composing stick. <br> <br>hhp <br></p>"
