  html: <p>I notice that with some typefaces, for example Bliss, the 'Cap height' and 'Ascender height' are different, is there a reason for doing this, or is it just a look thing?</p>
  html_clean: <p>I notice that with some typefaces, for example Bliss, the 'Cap height' and 'Ascender height' are different, is there a reason for doing this, or is it just a look thing?</p>
