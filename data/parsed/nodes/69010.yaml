    html: <p>This is a welcome and long awaited addition to the Unicode repertoire. As for the typographic details, these are of course left to the experts. I would like to propose an additional refinement of the proposal, based on my Arabic expertise. I need to remind the experts that there exists a related character, with the exact same function, that could be described as Latin capital A followed by a dot and with a dot below, commonly known as niggiz. Careful analysis reveals that the Latin capital A preceded by dot with dot above, niggaz and the Latin capital A followed by dot with dot below, niggiz are in complementary distribution. Therefore, they can be considered to be allographs of the same grapheme, that I propose to call NUGUZ. I therefore advise to amend the proposal to the effect that a single Unicode character be exploited to cover both letters. The selection mechanism can be left to smart font technology, in a manner analogous to what is now commonplace in Arabic font handling. I realize that the resulting graphic balance between the two glyphs will be a challenge for physiotypographers.</p>
