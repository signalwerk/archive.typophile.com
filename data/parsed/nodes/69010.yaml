    <p>FOR IMMEDIATE RELEASE</p>
    <p><strong>Recording artist, music producer and actor Cordozar Calvin Broadus, AKA Snoop Dogg submits proposal to Unicode Consortium for addition of new character: "Latin capital A preceded by dot with dot above, niggaz".</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Adotdot_4922.gif"></div><p></p>
    <p>According to Snoop Dogg's publicist Kisha Maldonado this initial foray into character encoding is the typographic sista of the artist's seminal debut album of 1993. Maldonado did not elaborated on the practical necessity of adding "Latin capital A preceded by dot with dot above, niggaz" to Unicode. However sources close to the artist indicate that this effort is intended as a viability test of devising a bespoke writing system for elegantly encoding rap lyrics.</p>
    <p>Steve Small, an agent for Snoop Dogg revealed the following further details:<br>
    • The proposed location of "Latin capital A preceded by dot with dot above, niggaz" is immediately behind any suitable bottom-heavy character.<br>
    • The structural viability of the proposed new character was confirmed by means of a prolonged, multi-party, psychokinetic séance with Eric Gill.<br>
    • Although Unicode does not proscribe or even prescribe specifics of glyph rendering, Snoop Dogg is mandating that the ideal position of the Dot Above is slightly to the left of the apex of the "A". According to copious research by noted scientist Kevin Larson this position reduces the risk of resultant neck pain. Further research is needed to ascertain any benefit to readers.<br>
    • In spite of the potential for courting controversy the first typeface to have "Latin capital A preceded by dot with dot above, niggaz" added to its glyph repertoire will be Miles Newlyn's Missionary.</p>
    <p>hnp</p>
