    <p>I'm doing a big brochure kind of thing, with lots of text and the client's font of choice is Whitman paired with FF Clan, and I agree with the choice!</p>
    <p>However, I am looking for examples of use of the SmallCaps version. I've seen smallcaps used as almost everything, but some nice typographic layouts would be nice to refer to.</p>
    <p>All help appreciated.</p>
