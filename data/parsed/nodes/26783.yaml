      <p>12 Posters Plus Rarities. <br>This set includes 12 posters used to promote Emigre magazine, <br>fonts, and books. Also includes a set of untrimmed Emigre <br>magazine cover press sheets of sold out issues #2, #4, and #9. <br> <br>Only 40 sets available! <br> <br><a href="http://www.emigre.com/EPosters.php" target="_blank">http://www.emigre.com/EPosters.php</a> <br> <br>Price $95 plus Express shipping. <br>(Poster sets will NOT be shipped Economy.) <br> <br>Offer applies to on-line orders only, and is valid through <br>May 30th 2003. <br> <br>-------------------------------------------------------------- <br>Emigre Inc <br>4475 D St <br>Sacramento CA 95819 <br>USA <br> <br><a href="mailto:sales@emigre.com">sales@emigre.com</a> <br>Fax: (916) 451-4351</p>
