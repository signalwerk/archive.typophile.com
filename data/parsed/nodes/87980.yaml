      <p>The effect is not significant, but it’s there.</p>
      <p>A quick test:</p>
      <p>Postscript 1000 upm: 28kb<br>
      Postscript 64 upm: 24kb</p>
      <p>Truetype 1000 upm: 92kb<br>
      Truetype 64 upm: 84kb</p>
      <p>At least for my TT file, I can go even lower with less points (a straight conversion from PS outlines typically introduces more points than you really need), and both formats could be stripped of some extra data. </p>
      <p>In any case, you should start from scratch with conditions like these: Draw the type within the boundries with as few points as possible, working the coarse grid to your advantage, rather than downscaling an existing font.</p>
