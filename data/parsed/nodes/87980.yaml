  html: |-
    <p>It seems to me that it should be feasible to create decent looking fonts with upem values between 64 and 128.</p>
    <p>The purpose for me is to represent points as 8-bit values in memory restricted microcontrollers. In the past I have defended my viewpoint that the advantages of outline fonts make them preferable to bitmap fonts even on microcontrollers. The typical microcontroller today has lots of processing power but not necessarily a lot of RAM. Quarter VGA colour displays are easily connected to such a micro and I just hate to see nasty blocky fonts being used on hardware that in my opinion might just as well display beautiful anti-aliased sub-pixel positioned outline fonts. Once the rendering of outlines is in place the render code can be used for displaying more types of graphics, for instance buttons of various shapes and sizes.</p>
    <p>Some experiments that I have carried out seem to confirm the idea. I converted various 2048 and 1000 upem fonts to 128 upem fonts, with some of the fonts the conversion was hardly noticable whereas the more artsy fartsy fonts suffered a great deal from the conversion. On a QVGA display no bells and whistles are required. One of the arguments against outline fonts would be that they require too much storage space, but I just cannot believe that this is true. Especially if I can consequently store point data as 8-bit values. In addition to low space consumption, fixed 8-bit values would offer simplicity and efficiency.</p>
    <p>Are you aware of the presence of such fonts? Is anybody using such fonts? Designing them? Are there simple font file formats based on similar ideas?</p>
    <p>I am a software developer, not a designer.</p>
