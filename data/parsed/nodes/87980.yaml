    html: |-
      <p>For a specific [text] size, a bitmapfont will always be smaller. The only exception<br>
      might be designs with long straight lines (not pretty). Think about it: a pixel in a<br>
      bitmap font can be just one bit; in the worst case (if you go for subpixel rendering,<br>
      which nobody has done yet AFAIK) a pixel would be 3 bytes*. With outlines, even at<br>
      1 byte per x/y coordinate you're looking at for example 8 bytes to define the smallest square. In practice of course you don't define an outline square for each pixel, but<br>
      you certainly need more than 3 bytes per end-result pixel.</p>
      <p>* And this is only at the edges of the glyph.<br>
      The body of the glyph being solid, run-length<br>
      encoding** compresses the data to near-nothing.</p>
      <p>** What would be great BTW is to compress the<br>
      data in vertical columns, since [Latin] glyphs<br>
      have long verticals but short horizontals.</p>
      <p>Where outlines do save more space is if you reuse the same outline to generate<br>
      a large number of sizes; but you have to resort to hinting (and superhinting*)<br>
      to coax the outlines to come close to what the bitmap would do. Also, if you<br>
      decide that text flow is paramount you have to abandon integer glyph widths,<br>
      so bitmaps are out the window, but then the net result is ugly rendering.</p>
      <p>* The moving of an individual point in an outline glyph for one ppem.</p>
      <p>More than saving space, outlines rule the land now because they save effort.<br>
      To me however this is a bit strange, because if you really want to save effort<br>
      you shouldn't be designing type in the first place!  :-)</p>
      <p><strong>Here's the thing: are you making a large number of sizes, or a few?</strong></p>
      <p>More:<br>
      - Bitmaps don't have to be blocky:<br>
      <a href="http://www.themicrofoundry.com/manademo/" title="http://www.themicrofoundry.com/manademo/">http://www.themicrofoundry.com/manademo/</a><br>
      And that's not even using subpixels.</p>
      <p>- CJK fonts as a rule use small UPMs, to save space.</p>
      <p>- Downer: I didn't realize an actual coarse grid was used! I always<br>
      thought the segmentation was an effect applied at full Em resolution.</p>
      <p>- Carter/Charter: the way that design saved space was to use straight<br>
      lines for short segments, thus eliminating control point data for those<br>
      segments. BTW, there have been font formats (most notably during the<br>
      phototype era, but also used by URW to release lo-fi trial versions of<br>
      their fonts) that feature straight lines only, and I believe [some] font<br>
      rasterization algorithms [still] rely on this when the laser hits the film.</p>
      <p>- Amount of savings: one would expect 1-byte data to take up half the<br>
      space of 2-byte data, but because of compression this is not the case.</p>
      <p>- Hey, here's a crazy idea for saving more space: use lossy compression!</p>
      <p>--</p>
      <p>In direct competition to Gustavo (a friend from our Ultrafonts days, FYI :-)<br>
      I will also offer to work with you. I guarantee we can nail down a killer way<br>
      to deliver the best font rendering anywhere at the smallest filesizes. This<br>
      might actually involve outlines that mimic bitmaps exactly, but it's the<br>
      spirit of the bitmap that shines through and delivers the goods.<br>
      hpapazian at gmail dot com</p>
      <p>BTW, can you tell I love this stuff? I've been making<br>
      screenfonts since 1982, and I don't want to stop.  :-)</p>
      <p>hhp</p>
