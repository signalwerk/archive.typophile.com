      <p>I have been developing <a href="http://hptp.net/the-primacy-of-the-pixel/" rel="nofollow">grid-based PPEM-specific screen fonts</a> for a few years now, building on my work on <a href="http://typotheque.com/fonts/elementar" rel="nofollow">vector-based bitmap fonts</a>.</p>
      <p>But the data in the fonts I am producing is scaled (e.g 60 UPM units per pixel), so the final UPM size is not as small as the design size.</p>
