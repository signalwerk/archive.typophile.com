      <p>ahyangyi – <cite>Why can restricting UPEM reduce font size significantly, given the current font formats?</cite></p>
      <p>TTF's <em>glyf</em> table can store coordinate values either in a byte or in two, depending on how big the value is. So a small UPM and hence smaller coordinate values may make a difference. I assume that <em>CFF</em>, with its different ways to represent integers, allows for similar optimization.</p>
