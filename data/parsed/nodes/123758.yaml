  html: |-
    <p>I've created a new version of a typeface for the correct use for "Office" users, but the small caps won't work... do small caps need an special Unicode to work in office? I've seen that there is a Unicode something like 1D00 (for A).</p>
    <p>My typeface had 14 weights... and I've reduced it to 4, and-re named it using TransType 4</p>
    <p>Any help that I can get in this matter will be welcomed.<br>
    Thanks!</p>
