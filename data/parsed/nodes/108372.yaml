    <p>Hello,<br>
    I'm hoping there are some former phototypesetting workers on here or possibly some folks who are knowledgeable in that area. I'm desperately hoping to accurately ascertain a certain font used in various magazines in the 1980s. I've included some examples below from three separate magazines.</p>
    <p>Here are the examples:</p>
    <p><a href="http://i1.wp.com/maximumrocknroll.com/wp-content/uploads/2012/08/NorCal_scene-MRR006_1983.jpg" title="http://i1.wp.com/maximumrocknroll.com/wp-content/uploads/2012/08/NorCal_scene-MRR006_1983.jpg">http://i1.wp.com/maximumrocknroll.com/wp-content/uploads/2012/08/NorCal_...</a></p>
    <p><a href="http://sendbackmystamps.files.wordpress.com/2013/07/editorial-news.jpg?w=949" title="http://sendbackmystamps.files.wordpress.com/2013/07/editorial-news.jpg?w=949">http://sendbackmystamps.files.wordpress.com/2013/07/editorial-news.jpg?w...</a></p>
    <p><a href="http://www.thrashermagazine.com/images/image/Features/2009/1983_mag/8302/8302%20800t/8302C2-p1crop800.jpg" title="http://www.thrashermagazine.com/images/image/Features/2009/1983_mag/8302/8302%20800t/8302C2-p1crop800.jpg">http://www.thrashermagazine.com/images/image/Features/2009/1983_mag/8302...</a><br>
    (Left side)</p>
    <p>The fonts are neither Signa nor Univers (the G and 9 are slightly different). Any help is greatly appreciated. Thanks so much!!</p>
