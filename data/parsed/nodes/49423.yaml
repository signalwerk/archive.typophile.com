    html: |-
      <p>Often times, files that are identified as UNIX executable are simply files that OS X doesn't know what to do with (i.e., there is no application associated). AFM files are normally not needed on Macs.</p>
      <p>If the files have are empty (i.e., zero kb), it probably means that the files are corrupt due to being transfered through a non-Mac file system (Windows, UNIX, Linux). Some Mac files (including suitcase files) have have a component called a resource fork. This is a special part of a file that is not visible to non-Mac file systems, such as Windows. If you move such a file to Windows and back, the resource fork will be lost, resulting in an empty file if all the data was in the resource fork, which is the case with font suitcases.</p>
      <p>If you want to transfer font files from one Mac to another over the internet or via a Windows PC, you need to make sure the font files are placed into a zip or StuffIt file on the originating Mac before transfer and never opened on a PC at any point during transit.</p>
