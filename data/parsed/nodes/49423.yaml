    <p>Hello all,</p>
    <p>I have been given a font (.zip) archive from a client, and I am having a problem deciphering some of the files once it has been decompressed.</p>
    <p>I have tried both StuffIt Expander AND BOMArchiveHelper. I get the same thing with both extracting processes.</p>
    <p>Once the archive is decompressed, I get Font Suitcase files and PostScript Type 1 outline font files (both of which I am familiar with).</p>
    <p>What I am NOT familiar with and the files that STUMP me are:<br>
    Unix Executable Files(s) - some of which are Zero KB in size<br>
    Stuffit Expander.app Document(s) - some of which have "afm" suffixes after the file name(s)</p>
    <p>Can anyone shed some light on what I am supposed to do with these files?<br>
    Are they corrupt files?<br>
    Am I supposed to import them into FontAgentPro?<br>
    Has my client archived them improperly?<br>
    Should I Trash the Zero KB files?</p>
    <p>Please help! Thank you in advance!</p>
