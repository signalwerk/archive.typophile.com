  html: <p>I'll venture a guess that this isn't a font because it is pixel-perfect. I find it doubtful that any existing non pixel-perfect font would render so precisely at this size. It's equally doubtful that anyone would produce a bitmap font at this scale ergo it's probably not a font. <br> <br>It's very cool though.</p>
