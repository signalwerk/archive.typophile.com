      <p>Just to clarify, the reason I'm asking this is that in the past I've always placed 'ccmp' first. However, in the new FLS beta, standalone lookups need to be declared in the bottom pane which means in effect that all standalone lookups end up being placed before any features placed in the left hand feature pane. I'm unsure, therefore, whether I need to declare 'ccmp' (and possible 'aalt') in the bottom pane as well rather than declaring it in the left hand pane along with all other features.</p>
      <p>André</p>
