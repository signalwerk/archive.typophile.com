      <p>Typical feature ordering, in layout engines that apply features in discreet blocks rather than relying only on the order of lookups in the font, is</p>
      <p>locl<br>
      ccmp<br>
      [language shaping features, e.g. for complex script processing]<br>
      [typographic layout features]</p>
      <p>aalt is a bit of an oddity, since it isn't really used in layout but, rather, is used to build glyph palettes.</p>
