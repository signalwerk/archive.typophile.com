    html: |-
      <p>FWIW, in Germany that seems to be quite common; a bunch of design schools offer such courses themselves (which are mostly rumored to make it easier to get into that specific school). In German, the word is <em>Mappenvorbereitungskurs</em> (portfolio preparation course).</p>
      <p>Another thing to look out for is that many design schools (again, specifically in Germany, dunno how it is in other countries) have something like "portfolio days", the idea being that prospective students can bring in their portfolios and have them critiqued by some professors of the school, who would then give specific advice if they'd consider accepting it or not, and if not, what you can do to make it better (i.e. increase your chances).<br>
      These sessions can be anything from very helpful and constructive to shattering, but of course that also tells you something about the school at hand, and teaches you to not flip out if they act all important. ;-)</p>
      <p>Good luck.</p>
