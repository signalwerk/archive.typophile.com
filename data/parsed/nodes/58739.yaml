  html: <p>does anybody know if there are courses that give you a basic knowledge in graphic design and typography to help prepare a portfolio to present in a design school. I would need courses from august to december, anywhere in europe.</p>
  html_clean: <p>does anybody know if there are courses that give you a basic knowledge in graphic design and typography to help prepare a portfolio to present in a design school. I would need courses from august to december, anywhere in europe.</p>
