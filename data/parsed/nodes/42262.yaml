  html: |-
    <p>Hi</p>
    <p>This font is one from an archive of fonts we have (it's called 'StampComp'). It's perfect for my title on front cover of a book, but I've discovered there are no apostrophes, hyphens or colons so I can't really use it throughout the book for chapter headings.</p>
    <p>(I have a funny feeling it was an amateur experiment because it looks like impact with a distressed stamp effect). </p>
    <p>Does anyone know where I can find a full set of this font (I've tried the usual suspects like myfonts with no luck), or suggest a good alternative? </p>
    <p>Many thanks!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/stamp_sample.jpg" width="497" height="344" alt="">
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/stamp_sample_0.jpg" width="497" height="344" alt="">
