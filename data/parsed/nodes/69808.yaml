      <p>You don't necessarily need OT feature functions in an application to access alternates. It's more tedious but as long as the alternates have been given Unicode values, you can make a text file which the customer can copy and paste into Corel Draw or Word. They can also be accessed with the character map tool. (accessories/system tools/character map)</p>
      <p>Windows has supported OpenType(OTF) with no additional software required for a decade . . . a couple of years before OSX was released. It's the apps that are the issue.</p>
