      <p>As long as I know, just Adobe suite and Quark Xpress offer this in Windows world. Suite 602 had partial support back in 2002, but the product was discontinued.</p>
      <p>I know some apps that <strong>does not</strong> have OT proper support: all Office releases (it seems Office 10 will have at least partial OT support), CorelDraw, Xara, OpenOffice and Scribus. Not sure about Ulead and ACD software.</p>
