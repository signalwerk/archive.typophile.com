    <p>I got a question from a customer who can't take advantage of all the OpenType features with his PC... if anyone can help, I'd appreciate it.  Here is what he asked:</p>
    <p>Do you have any recommendations on PC software capable of using the different letter options (swash characters) in fonts such as your Estonia Nouveau?  I purchased a similar font from MyFonts once before (Mussica) in the OTF format, only to realize that none of my main software applications (Word, CorelDRAW) could use the extended character set.</p>
    <p>I realize the PC is behind the Mac in this type of functionality.  I have also considered purchasing a program like FontCreator in order to re-map an existing font into different font sets so all the characters are available for use (just using different font names).</p>
    <p>Thanks in advance.</p>
