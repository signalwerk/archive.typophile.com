  html: |-
    <p>Recently found out that when in your user profile you simply write (e.g.) "www.example.tld" Typophile interprets that as <a href="http://typophile.com/www.example.tld" title="http://typophile.com/www.example.tld">http://typophile.com/www.example.tld</a> - which produces an error.</p>
    <p>I just corrected my entry adding "http://", and , lo, now it works.<br>
    Since I saw that problem in quite a few of your user profiles I thought it worth mentioning.</p>
    <p>HAND,<br>
    Andreas</p>
