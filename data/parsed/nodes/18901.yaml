      <p>Thanks for the suggestions. Bliss costs a freaking fortune too — I have always been a bit wary of Jeremy Tankard's type, not sure why.  </p>
      <p>It seems difficult to find the right match without treading too near Gotham territory. Scala was one of the first ones that came to mind, since it's just a short leap from Gill, but it was just used on an excruciating project so I'm taking a break from it. The R is very no-nonsense and a bit narrow. </p>
