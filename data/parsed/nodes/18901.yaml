    html: |-
      <p>I think claes' theory can go either way. I prefer to plan out the type system as a serif and a sans, preferably of the same basic design or designer. At least the same x-height. Ideally there would also be a couple of display faces thrown in for larger projects, like magazines. The alterations I made to the original Prokyon are not easily reproduced by simply typing out the letters. But for the most part, I agree that there should be a level of contrast. In fact, I would prefer to use something that is visually concussive.  </p>
      <p>In this case I am sticking to a one family system. It's for a company that designs, builds and sells modular buildings. Since there are other companies that have the same name that do other things, as is often the case, they have a descriptor line under the company name to specify which "Company X" they are. The logo was designed as a three-color, type/bug pair, and with the descriptor below the type it starts to get pretty busy. So I am opting for a single type family because anything else would be visual suicide.</p>
      <p>Another option is to use a typeface that is nearly invisible, like Akzidenz-Grotesk. But it is a different kind of sans, and it just seems plain silly to mix a humanist with a grotesque.</p>
