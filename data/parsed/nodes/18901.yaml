    html: |-
      <p>The Problem with Etelka:<br>
      When it is installed in a font manager, it shows up. The font files are even listed as .otf files. The problem manifests itself that when you try to use it in an application — in my case, Illustrator CS on OSX — it behaves like a Postscript font. When you switch to small caps, it makes the fake small caps out of the full caps. Selecting any alternate figures produces no result. All OpenType options in the OT palette, including all standard ligatures, are greyed-out and disabled. The only way to access any character that deviates from the standard 256 PS/TTF character slots is to insert it manually from the glyphs palette. Furthermore, switching to a different Pro font, including other weights of the same family, causes some characters to change into different characters. For example, the 'st' ligature changes into an 's' with a caron, and an alternate ampersand turns into a percentage sign or lozenge. Thus the Unicode glyph maps are inconsistent. The multiple language support (it has full-on cyrillic built in) may have something to do with it.  </p>
      <p>Storm says it works fine on a Windows XP box, but that does me little good. I think he was in a rush to release it in OpenType, and did not test it properly. Fortunately, all his fonts carry a lifetime guarantee.</p>
