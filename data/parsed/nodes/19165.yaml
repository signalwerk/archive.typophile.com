    html: |-
      <p><em>-10 in indesign is the equivalent of -1 in Quark and -20 of -2. </em></p>
      <p>sorry, but that is wrong. Quark uses 200 units, Indesign 1000. Quark's 1 unit track is therefore 5 units in Indesign (and Illustrator, for that matter). In other words: –10 in Indesign would be –2 in Quark.</p>
