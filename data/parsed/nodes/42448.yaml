    <p>Hello i am in my final yea of University.. and studying graphic design...<br>
    i hope to continue with this city map series when i finish......i hope i can post this here...</p>
    <p>here are some of the images...of maps i have done so far..</p>
    <p>New york (my first linocut)<br>
    <a href="http://www.flickr.com/photos/markandrewwebber/2258516606/in/set-72157603892334695/" title="http://www.flickr.com/photos/markandrewwebber/2258516606/in/set-72157603892334695/">http://www.flickr.com/photos/markandrewwebber/2258516606/in/set-72157603...</a></p>
    <p>London (commisioned by ISTD for my city my London)<br>
    <a href="http://www.flickr.com/photos/markandrewwebber/2258521132/in/set-72157603892334695/" title="http://www.flickr.com/photos/markandrewwebber/2258521132/in/set-72157603892334695/">http://www.flickr.com/photos/markandrewwebber/2258521132/in/set-72157603...</a></p>
    <p>Amsterdam (for a college project in which i could do what i wanted, so i really wanted to carry on with the series so had just been to amsterdam and loved the look of the map.. so carved it)<br>
    <a href="http://www.flickr.com/photos/markandrewwebber/2258526982/in/set-72157603892334695/" title="http://www.flickr.com/photos/markandrewwebber/2258526982/in/set-72157603892334695/">http://www.flickr.com/photos/markandrewwebber/2258526982/in/set-72157603...</a></p>
    <p>yea i have more pictures but you can scroll through the sets for them!... </p>
    <p>im going to be doing Paris this summer.</p>
    <p>kk cheers!.</p>
