    <p>Fellow Typophiles,</p>
    <p>I read somewhere that a student, Miko McGinty, revived the Caslon Sans Serif of William Caslon IV, dated 1816, in a 1997 class supervised by Tobas Frere-Jones. Does anyone know more about this? Is this digitized Caslon Sans available somewhere?</p>
    <p>thanks<br>
    dr</p>
