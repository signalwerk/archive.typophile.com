    votes: 0
    html: |-
      <p>As the only English sans serif lower case letters that were around during the first half of the 19th century were Bold Condensed, an "accurate revival" of a Regular style from that era is impossible. </p>
      <p>There are other considerations today. For instance, in the Figgins lower case I contemplated giving the top of the "f" a substantial overhang, which I thought would be appropriate for that era, but decided against that in a 21st century international face, where the "f" is followed by all sorts of accented characters.</p>
      <p>Note that the early 19th century "G" is problematic, and very few new faces in the style of that era follow the model authentically.</p>
