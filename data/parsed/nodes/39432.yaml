      <p>David, I know of several versions. First there’s James Mosley’s own Tivoli type, which is a an autotraced version from scans turned into a Type 1 font. I think it works very well for single words, it was used in the Italian book <cite>Radici della Scrittura Moderna</cite> which is a collection of translation of James’ own essays on typography, including <cite>The Nymph and the Grot</cite> (<a href="http://typefoundry.blogspot.com/2007/01/nymph-and-grot-update.html" rel="nofollow">recently updated</a>) where he introduced the history of sanserif types.</p>
      <p>After seeing Mosley’s Tivoli I decided to have a go myself and produced my own version, called Micerino (Italian name of the smallest – as in “small character set, uppercase only” – pyramid in the Giza complex). It’s quite rough around the edges as to spacing and kerning. Some glyphs need review, too, but it’s almost usable. I included the alternate forms found in the two specimens I was given by James and Œ Æ ligatures as OpenType features/stylistic sets.</p>
      <p>The Font Bureau version is definitely the way to go if you want something more usable. It has several weights and a lowercase, although it’s more loosely based on the original from what I’ve seen. I think it’s a reasonable type, especially considering it was done for a contemporary magazine so it’s natural that some of the features in the original type had to be somewhat muted.</p>
      <p><a href="http://www.moderntypography.com/" rel="nofollow">Paul Barnes’ home page</a> used to feature a specimen of what looked like his own digitization on Caslon’s Two Lines English Egyptian. I know nothing about it, apart from what I saw online, so I’m not sure about it, but you could try asking. <a href="http://www.idiidiiidesign.at/" rel="nofollow">Martin Tiefenthaler</a> from Vienna recently wrote me about it, and I think he’s enquiring Paul as well as per my suggestion.</p>
    html_clean: |-
