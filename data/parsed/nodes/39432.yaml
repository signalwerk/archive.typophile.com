      <p>David:</p>
      <p>I created my own version of Caslon Two Line Egyptian for a book I published with Coach House Books in 1997 entitled "Head Paintings". I added lowercase letters, numbers and punctuation. The book is now out of print but copies can occasionally be found at <a href="http://www.abebooks.com" title="www.abebooks.com">www.abebooks.com</a>. You can see the full font at my website: <a href="http://www.robertfones.com" title="www.robertfones.com">www.robertfones.com</a>. I have to confess that I found the combination of uppercase and lowercase very awkward and have never used the font since. No wonder Caslon only issued it originally in caps. I have also seen a version used in the New York Times magazine.</p>
