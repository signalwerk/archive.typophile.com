    date_raw: 8 Oct 2007 — 5:37am
    votes: null
    html: <p>There are several other student competitions as well that have national exposure. <a class="freelinking external" href="http://www.cmykmag.com/site.cfm?sect_id=10&amp;page_id=11" rel="nofollow">CMYK</a> magazine and <a class="freelinking external" href="http://www.cqjournal.com/contests_entries.html" rel="nofollow">Creative Quarterly</a> are two that I've been published in with fairly low entry fees.</p>
