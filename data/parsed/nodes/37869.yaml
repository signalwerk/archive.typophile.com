    html: <p>Before you stroll down the treacherous path of producing work for competition, it couldn't hurt to read through a few articles about the pitfalls <a href="http://www.no-spec.com" rel="nofollow">and the damaging effects caused by spec work and spec-based design contests.</a>  I learned the hard way.  This is the number one thing I wish to GOD somebody had taught me when I was back in school!</p>
    html_clean: <p>Before you stroll down the treacherous path of producing work for competition, it couldn't hurt to read through a few articles about the pitfalls <a href="http://www.no-spec.com" rel="nofollow" class="link-external">and the damaging effects caused by spec work and spec-based design contests.</a>  I learned the hard way.  This is the number one thing I wish to GOD somebody had taught me when I was back in school!</p>
  - id: 232227
