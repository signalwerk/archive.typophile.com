    date_raw: 7 Oct 2007 — 10:04pm
    votes: null
    html: <p>Check with your local AIGA and Art Director’s Club chapters for local contests. The fees will be lower, you’ll be more likely to win, you won’t get taken advantage of by the aforementioned spec-contests, and your work will be exposed to local design firms who might be hiring.</p>
    html_clean: <p>Check with your local AIGA and Art Director’s Club chapters for local contests. The fees will be lower, you’ll be more likely to win, you won’t get taken advantage of by the aforementioned spec-contests, and your work will be exposed to local design firms who might be hiring.</p>
