    html: "<p>I became interested in the concept of type design for subtitles a few months ago.  In my phase of cramming as much information on the subject as possible, I discovered that there is one handsdown expert on the subject--Joe Clark.  Go to his site:  <a href=\"http://www.joeclark.org\" target=\"_blank\">www.joeclark.org</a> <br> <br>When you get there you can either browse the seemingly endless resources he provides, or you can email him with your question and I'll bet he can answer it.</p>"
