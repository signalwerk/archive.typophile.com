      <p>Sharon: pretty negative review of that model’s text quality from PC World. <a href="https://web.archive.org/web/20081011063639/http://www.pcworld.com/article/id,127557-page,1-c,printers/article.html" title="http://www.pcworld.com/article/id,127557-page,1-c,printers/article.html">http://www.pcworld.com/article/id,127557-page,1-c,printers/article.html</a></p>
