  html: <p>Disclaimer, not a designer, just an amateur who appreciated beautiful fonts and page-layout. For an upcoming interview that I need to present printed document at hand and also send digital documents, I've been looking for a clear, beautiful, and distinct font that can also accommodate Greek. I've settled on the GFS Didot, redesigned by Katsoulides -I like its elegance and yet ability to function as vehicle for body text. I wanted to ask which font combinations you'd recommend, and whether you think of it as functioning on screen.  Thanks!</p>
