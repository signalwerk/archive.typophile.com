      <p>- What city?<br>
      - What kind of people are supposed to stay there?<br>
      - What does the building look like?</p>
      <p>BTW, if you find a font that you really like but it has a non-splayed “M”, you could always just make a splayed one - or pay a pro to do it, since it’s tricky - in fact it’s technically the most difficult Latin cap letter. Usually I myself make complete fonts, but last year I made a custom “C” for a restaurant in Singapore: <a href="http://www.manic.com.sg/work_macaron.html" title="http://www.manic.com.sg/work_macaron.html">http://www.manic.com.sg/work_macaron.html</a></p>
      <p>hhp</p>
