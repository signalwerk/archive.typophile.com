    <p>I am looking for a font to use for the identity of a new boutique hotel that is all about a modern take on ’old world’ it needs to be a great family that is versatile like Mercury by Hoefler Frere Jones. I need a capital M with diagonal legs like the capital M in Calligraph 810, but don’t like it to look like it was calligraphy.... Please help?</p>
    <p>Eben<br>
