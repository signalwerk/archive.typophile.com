  html: |-
    <p>For reasons I don’t understand and that the “moderators” probably could not defend, typefoundries and others are allocated space to publish press releases. Seriously: Don’t they have their own Web sites?</p>
    <p>There is an argument – marginal at best – that Typophile is the place to go to find typographic news, so such news should be published here. Let’s imagine that argument held water. What’s the argument against opening up those press releases to comments? Why are comments disabled on such posts?</p>
    <p>Also, the so-called “moderators” of this site must go out of their way to publish, in a prominent and stable location, the exact criteria that are used to accept or reject a press release or similar pure-marketing postings.</p>
