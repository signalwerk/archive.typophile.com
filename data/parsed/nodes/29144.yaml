    html: <p>That's quite unfortunate. Could it be done by the text setting engine? I mean, at every instance where a line or paragraph breaks, the text engine could call the font and insert the appropriate glyph. One could go even so far as to implement this into the line breaking algorithm, so that the advance width of the alternate glyph could be reckoned with, while calculating the optimal spacing. I guess this is similar to how 'jalt' (Justifcation Alternates) works?</p>
