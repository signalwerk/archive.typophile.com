    date: 2006-02-05T02:32:00
    date_raw: 5 Feb 2006 — 2:32am
    votes: null
    html: <p>I don't get the large type and poetry thing either. The only thing I notice about poetry is designers tend to allow a lot of white space around the poem to create focus on the stanzas.</p>
    html_clean: <p>I don't get the large type and poetry thing either. The only thing I notice about poetry is designers tend to allow a lot of white space around the poem to create focus on the stanzas.</p>
  - id: 107303
