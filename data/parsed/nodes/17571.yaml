    date: 2006-02-04T20:08:00
    date_raw: 4 Feb 2006 — 8:08pm
    votes: null
    html: <p>I'm not sure about Verdigris for poetry - it's designed for small sizes, and all the best poetry should be set fairly large to slow down reading. Small x-height, small counters and substantial interest and delicacy in the details are the things to look for. It's a pity Lutetia with the Porter-Garnett e isn't available, but you could try lengthening the extenders on Spectrum (a very quick job).</p>
