  html: |-
    <p>Hi! I'm trying to identify the font used for the title text of the core-rules publications for the Third Edition of Dungeons &amp; Dragons. I've previously posted a request over at myfonts.com, but have had no real success there; as indicated in my more recent post there, I'm starting to think that the font may not exist, or may have been developed for in-house use only and (gasp!) never leaked to the public by *anyone*! ;-)</p>
    <p>Anyway, <a href="http://new.myfonts.com/WhatTheFont/forum/case/321958/">here's the link to the image and original Request For Identification (RFI) over at myfonts.com</a>. Many thanks in advance for anything anyone can find!</p>
