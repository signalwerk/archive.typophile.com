    html: "<p> A reply from Agfa: <br> <br>Our Quick Font Search feature has been provided for our users to find the <br>font that they are looking for despite the fact that it could be sold by <br>someone else. Our goal at Fonts.com is to give people information about ALL <br>fonts. Of course if we do not sell the font that they are looking for, we <br>would like to suggest to them a suitable alternative that we do carry. <br> <br>Like any system having so many entries, it is not perfect, and I appreciate <br>your comments as they can help to make the product better. I will refer your <br>comments to the people who maintain this utility on our end. Please be sure <br>to let us know if you have any other comments. Thanks again for letting us <br>know. <br> <br>Thanks for visiting Fonts.com. <br>We appreciate your business. <br> <br>David Harned <br>Manager, Internet Development <br>Agfa Monotype Corporation </p>"
