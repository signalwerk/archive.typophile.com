    html: "<p>There is one distributor that is doing it right. <br> <br>I'm often surprised how accurate MyFonts.com's <br>\"see also\" suggestions are. As far as I can <br>tell, related fonts are found solely by matching  <br>keywords. As long as whoever enters the keywords  <br>for each font is smart and thorough, the first few  <br>results are decent. <br> <br>An example: <a href=\"http://www.myfonts.com/MoreLike?id=9575\" target=\"_blank\">\"more fonts like\"</a> Mark Simonson's  <br>wonderful <a href=\"http://www.myfonts.com/FontFamily9575.html\" target=\"_blank\">Blakely</a>. <br> <br>Yes, there are plenty of narrow art deco faces  <br>missing on this page, but this system has a lot  <br>of potential if some more work is put into the  <br>keywording. Ahem, MyFonts.com... hire me. <br> <br>Stephen</p>"
