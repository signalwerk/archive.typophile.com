  html: "<p>Among other mysteries of Agfa's Fonts.com is this: <br> <br>Search for \"shadow\". Results include two Apollo <br>Program fonts, Blue Eye Shadow and Jigsaw Dropshadow. <br>\"Huh?\" says I, \"Agfa is distributing Emigre fonts <br>now?\" A click on Blue Eye Shadow reveals this page: <br> <br><a href=\"http://agfa-monotype.identifont.co.uk/show?1G9\" target=\"_blank\">This font is not available from AGFA-Monotype.  <br>However, we can supply the following alternatives that  <br>are similar in appearance or similar in concept to  <br>Elliotts Apollo Blue Eye Shadow:</a> <br> <br>Listed are about 15 Agfa Monotype fonts with no <br>relation to one another, let alone Blue Eye Shadow. <br>Perhaps this is some faulty <i>Identifont</i> output, <br>but I'm still very confused, and the standard user will <br>be even more so.</p>"
