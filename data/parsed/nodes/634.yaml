    html: <p>I know what's behind this. I submitted all of my fonts to Identifont last year.  <br> <br>I had a similar thing happen when I tried AGFA's Identifont thing to search my own fonts. The Identifont database includes lots of fonts that AGFA doesn't sell. It also uses a system for matching fonts based on a sort of 20 questions strategy. Fonts that give roughly the same answers will be grouped together. This will usually identify the correct font, but the "similar" fonts won't necessarilly look the same.  <br> <br>A more subtle problem I found was that it correctly identified fonts of mine that are licensed to FontHaus, but incorrectly stated that they were unavailable from AGFA, despite the fact that FontHause sublicenses all of them to AGFA. You can even find them on the AGFA site by other means. This is because the Identifont database only knows about the main licensee, not the sublicensees. If you go to the Identifont site and search for fonts, it will display links to whatever sources it knows about. But when AGFA uses it, they change the results so if the source isn't AGFA, they offer the "similar" fonts they do sell and hide the links to the other foundries and distributors.  <br> <br>It's kind of stinky, but then I don't really like it as much when someone buys one of my fonts from a sublicensee like AFGA instead of FontHaus since I only get half my usual cut. So I don't really care.  <br> <br>If you like the Identifont system, use it on their own site (<a href="http://www.identifont.com" target="_top">http://www.identifont.com</a>) and not on AGFA's site. You'll get less biased purchasing information.  <br> <br>The most ironic thing for me is that the only other typeface that matches my Proxima Sans, according to Identifont, is Arial. Excuse me while I go shoot myself...</p>
    html_clean: <p>I know what's behind this. I submitted all of my fonts to Identifont last year.  <br> <br>I had a similar thing happen when I tried AGFA's Identifont thing to search my own fonts. The Identifont database includes lots of fonts that AGFA doesn't sell. It also uses a system for matching fonts based on a sort of 20 questions strategy. Fonts that give roughly the same answers will be grouped together. This will usually identify the correct font, but the "similar" fonts won't necessarilly look the same.  <br> <br>A more subtle problem I found was that it correctly identified fonts of mine that are licensed to FontHaus, but incorrectly stated that they were unavailable from AGFA, despite the fact that FontHause sublicenses all of them to AGFA. You can even find them on the AGFA site by other means. This is because the Identifont database only knows about the main licensee, not the sublicensees. If you go to the Identifont site and search for fonts, it will display links to whatever sources it knows about. But when AGFA uses it, they change the results so if the source isn't AGFA, they offer the "similar" fonts they do sell and hide the links to the other foundries and distributors.  <br> <br>It's kind of stinky, but then I don't really like it as much when someone buys one of my fonts from a sublicensee like AFGA instead of FontHaus since I only get half my usual cut. So I don't really care.  <br> <br>If you like the Identifont system, use it on their own site (<a href="http://www.identifont.com" target="_top" class="link-external">http://www.identifont.com</a>) and not on AGFA's site. You'll get less biased purchasing information.  <br> <br>The most ironic thing for me is that the only other typeface that matches my Proxima Sans, according to Identifont, is Arial. Excuse me while I go shoot myself...</p>
