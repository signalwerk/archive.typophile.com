    <p><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : David Březina</p>
    <p>Czech type designer and typographer, writer, lecturer, the impresario of <a href="/wiki/TypeTalks" class="freelinking" rel="nofollow">TypeTalks</a>, and partner at <a href="/wiki/Rosetta%20Type%20Foundry" class="freelinking" rel="nofollow">Rosetta Type Foundry</a>. He got Masters degrees in Informatics (Masaryk University, Brno) and Typeface Design (<a href="/wiki/University%20of%20Reading" class="freelinking" rel="nofollow">University of Reading</a>, UK). From 2004 to 2007 he also ran his own design studio, with projects in graphic, web, and interface design. He has been working as an associate with <a href="/wiki/Tiro%20Typeworks" class="freelinking" rel="nofollow">Tiro Typeworks</a> and giving various type workshops around Europe.</p>
    <p>His interest in the world’s writing systems and multilingual typeface design and typography manifests in the award-winning, multi-script typeface family Skolar released by TypeTogether. So far, he has designed typefaces for Cyrillic, Greek, Gujarati, Devanagari, and various extensions of Latin.</p>
    <p><strong>Typefaces</strong><br>
    <a class="freelinking external" href="http://www.type-together.com/Skolar" rel="nofollow">Skolar</a></p>
