    <p>I’ve been struggling with a logo for a long, long time. It’s for a natural foods grocery store. I presented a much earlier version and received helpful advice, though this version does not neccessarily include that.<br>
    In order to maintain a certain handmade feel, and to create a sense of history, I’d love to utilize type that relates to the hand painted windows and signs of day gone by. I’m interested primarily in type that either stem from long enough ago that they smack of history, or that comes from the mid-seventies, when the store was founded. Currently, I have three logo consepts in progress. One that feels way back, using Brothers by John Downer, another that should feel a little groovy, but still contemporary (hopefully I’ll find something just right—maybe a rounded serif Didone?) and the attached. I’d like this to feel very contemporary, but I don’t want to give up the history. It’s Century Gothic, but I’d love to hear if anyone knows of a more interesting geometric gothic with some roots in brush lettering.<br>
    Thanks!</p>
