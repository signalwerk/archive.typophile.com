      <p>One trick I've tried for designing italics of letters like O and S, is after getting the initial weight and condensation correct, get the slant by doing half of it via obliquing and the other half by rotation. One catch on the rotation is that it affects the height, so you still can't get away without doing at least a few manual corrections.</p>
      <p>Cheers,</p>
