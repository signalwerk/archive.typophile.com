      <p>Nick,</p>
      <p><cite>I tried Harmonizer on an uppercase and lowercase s, and nothing noticeable changed.</cite></p>
      <p>I'll simply quote the RMX manual:</p>
      <p>Note that the Harmonizer does not modify the shape as a matter of principle. How much a glyph gets modified glyph depends entirely on the deviation from the required conditions. Consequently, a shape that is already harmonious will not be changed at all if the Harmonizer is applied to it a second time.</p>
      <p>Did you see the Harmonizer video? It also demonstrates why this is the case.</p>
      <p><cite>I tried Slanter, and it slanted alright, but didn't maintain orthogonal extrema. Curious...</cite></p>
      <p>With extreme slanting, or if there are too many additional (diagonal) control points then some orthogonal handles are not retained. If you want you can also send me a (one-glyph) FontLab vfb file, then I can have a look.</p>
