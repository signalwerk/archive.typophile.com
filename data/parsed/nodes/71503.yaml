    html: <p>Nick, the RMX Slanter and Tuner only correct nodes that connect two curves, not connections of straight line and curve like in your example. In that case, would you simply add nodes at the extremes? That can be done with FontLab's built-in tools. Or, would you maintain the orthogonal extrema by converting the straight to a curve and then adjusting everything? This would be a bit complicated, I am afraid, and it involves design decisions. The Slanter, like all RMX tools at the moment, does not insert nodes or change the node structure. Not treating the outline is the only sensible thing I can think of in the above example - do you have an idea for a better behaviour of the tool?</p>
