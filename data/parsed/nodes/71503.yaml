    <p>Good evening/morning,</p>
    <p>I'm drawing an italic to accompany an old-style face (drafts <a href="http://typophile.com/node/70139" rel="nofollow">here</a> and <a href="http://aldusleaf.org/specimen.pdf" rel="nofollow">here</a>), and slanting + cursify-ing the Roman just doesn't do. My <em>o</em> looks like an easter egg.</p>
    <p>Apart from <a href="http://typophile.com/node/13743#comment-79043" rel="nofollow">this wonderful comment</a>, I couldn't find any specific tips on how to do optical correction; neither here nor via Google (Books). So here's the newbie asking for your help:</p>
    <p><strong>1.</strong> How do you "push out" and "pull in" curves, e.g. in <em>o</em>, <em>c</em>, and <em>e</em>, without ruining the slant, to make round curves round again? Do you, to be precise, just shift control points back and forth til' you're happy? Is there a mathematical function of angle, thickness and contrast factor? — Or could I establish such a thing and become rich?</p>
    <p><strong>2.</strong> What are good guidelines for slant variation? My <em>f</em> seems like it's tipping over. Again, I can't find numbers, and I don't completely trust my eyes (yet). Then again, I personally dislike the un-slanted capitals in Arrighi- and Granjon-inspired fonts.</p>
    <p>Unfortunately – I'm an engineering student, not a designer – I don't own any literature; and the few fonts I've looked at failed at teaching me an efficient way of consistent correction.* </p>
    <p>(Recommendations are more than welcome though, there are libraries after all.)</p>
    <p>---</p>
    <p>One other, unrelated question to the book designers here:</p>
    <p><strong>3.</strong> Bringhurst §5.3.2 recommends, among other things, upright parentheses in italic text. While I don't disagree with the look of it, I was surprised at the very least. Is this normal practice?</p>
    <p>Thanks!</p>
    <p>Sebastian</p>
    <p>* I'd open the Roman, slant it, paste it onto the italics and look at the differences.</p>
