      <p><cite>It is the best practice when an italic word/phrase within a paragraph of roman text is parenthesized.</cite></p>
      <p>Most publishing houses have style guides regarding this. There are a handful of schemes, usually referencing either the surrounding text or the enclosed text, then sometimes adding specific guidance regarding mixed styles.</p>
      <p>Nick describes a circumstance where the style of parentheses follows the surrounding text regardless of the nature of the enclosed text. This approach certainly has many adherents. I believe this is more or less <em>Chicago Manual of Style</em>’s current practice. </p>
      <p>But Bringhurst’s rule is advocating something slightly different — <em>always upright, regardless of context </em>(<em>surrounding or contained matter</em>)<em>, even if all italic, like so.</em> </p>
      <p>Bringhurst’s own sidenote explains “This rule has been broken  more often than followed since the end of the 16th century.” It is worth noting that the period prior, when this ‘rule’ was more often <em>followed</em>, is also a period wherein the capitals used with italic are still largely upright as well.</p>
      <p>I’m not arguing that one should or should not employ this approach. The point of my terse reply to the third point in the initial post is simply that this strict approach is not what most compositors would consider “normal” practice today.</p>
    html_clean: |-
