    html: <p>The font is from Handcrafted Fonts (now called JM Fonts) and is called <a href="http://www.fonts.com/findfonts/detail.asp?pid=415551" target="_blank">Exposition</a>. It's by Jonathan Macagba, although Fonts.com doesn't mention the designer. I know this one because I use it in my Bowfin Printworks logo,and it was one of the earliest fonts in my collection. There are a Plain One &amp; Two and a Rounded version. This is one of the Plain versions. Also available at Veer.com in the Umbrella collection.</p>
