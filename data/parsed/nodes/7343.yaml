  html: <p>Does anyone recognise this? <br> <br><a href="http://img.photobucket.com/albums/v114/DeSevenFree/Type-Sample-BW.gif" target="_blank">http://img.photobucket.com/albums/v114/DeSevenFree/Type-Sample-BW.gif</a> <br> <br>The closest What The Font comes up with is Solpera by Storm, but that certainly ain't it. It's not used anywhere else in the booklet, so it could be custom drawn.</p>
