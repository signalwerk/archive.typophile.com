      <p>&gt;  I passed around a printed version of the blue<br>
      &gt; logo to some friends ... their response every time<br>
      &gt; was either a light bulb or a number nine</p>
      <p>Some of them probably knew your company name was Brightbulb, so that may have influenced their recognition of it, but perhaps it's more recognizable than I first thought. In any event I think it works. </p>
      <p>And I like the fact that it's not a traditional-looking lightbulb, which I think has been overused as a symbol of creativity. Your approach is fresh.</p>
