    date: 2010-12-30T14:51:00
    votes: null
    html: <p>Thanks, that's pretty much exactly what I was going for.  I've heard before that because light bulbs are so outdated and overused I should completely change the name.  I considered doing just that, but it seemed like such challenge to come up with something new, I felt it was better to just work with what I had.</p>
