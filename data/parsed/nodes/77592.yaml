      <p>Welcome to Typophile!</p>
      <p>I like the design; it's very clever.  If the "g" was viewed by itself I don't think anyone would know it's a bulb, but teamed up with the company name I think it works.</p>
      <p>It would be more consistent, though, if the blue "g" was the same orientation in both uses. And in the lower one the company name looks too small relative to the icon.</p>
  - id: 445518
    user_id: 86000
    user_name: brightbulb
    user_path: null
    user_image: null
    date_raw: 30 Dec 2010 — 6:33am
    date: 2010-12-30T06:33:00
    votes: null
    html: <p>Keeping the orientation the same for the "g" was something I was actually looking into last night.  I passed around a printed version of the blue logo to some friends without the company name and asked them what they saw in it, their response every time was either a light bulb or a number nine.  I'll tweak it some more and see what I come up with.</p>
