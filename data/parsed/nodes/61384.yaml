    html: |-
      <p>If you're talking about FF DIN OT or Pro, the alternates are included in the OpenType layout feature "Stylistic Set 1".</p>
      <p>So you should replace the missing font in InDesign by the normal DIN, and turn on the OpenType feature "Stylistic Set 1" in your appropriate paragraph style.</p>
