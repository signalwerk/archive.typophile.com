    html: '<p>Yves, I don’t think Frutiger and/or Helvetica match… Considering the dating Frutiger is out of the question, of course. My guess is, one should look into transfer lettering of the time.  <br><br><span class="caps">BTW</span>: The stretching remark I made doesn’t make sense in this respect, either. Probably the “original” BrushScript is a bit wider than the one that’s digitally available — or the illustration has been stretched a&nbsp;bit.</p>'
