    html: <p>When I got my first 6x9 Wacom tablet in '95 I envisioned my <br>ideal computer being just that size/weight with no additional <br>hardware. Think no keyboard - rather true, robust dictation <br>instead; wireless; super long battery life, and no external <br>monitor - a direct drawing interface screen like the Cintiq. <br>In my recent search for a new system I took a serious look at <br>the latest tablet PC's. However they only approach what I've <br>been waiting for as the specs still fall short, overall. <br> <br>I know this is tangential to your initial question but I thought <br>anyone interested in the Cintiq is forward-thinking enough <br>to perhaps share my vision.</p>
    html_clean: <p>When I got my first 6x9 Wacom tablet in '95 I envisioned my <br>ideal computer being just that size/weight with no additional <br>hardware. Think no keyboard - rather true, robust dictation <br>instead; wireless; super long battery life, and no external <br>monitor - a direct drawing interface screen like the Cintiq. <br>In my recent search for a new system I took a serious look at <br>the latest tablet PC's. However they only approach what I've <br>been waiting for as the specs still fall short, overall. <br> <br>I know this is tangential to your initial question but I thought <br>anyone interested in the Cintiq is forward-thinking enough <br>to perhaps share my vision.</p>
  - id: 8720
