    date_raw: null
    votes: null
    html: <p>I have tried the Fujitsu Stylus and the Motion Tablet PC. The  Stylus is a 600x800 screen, and the Motion is 768x1024. Both are less than enthralling. Paper, pencil and ScanFont are really the way to go here. <br> <br>The highest resolution touchsceen I've seen is the NEC LCD2010X-T at 1280x1024. I don't think it has the pressure granularity that a Cintiq has. Public-use kiosks and specialized design tools are two different things. <br> <br>I'll reconsider Tablet PCs when Apple ships one.</p>
