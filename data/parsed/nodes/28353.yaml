    html: |-
      <p>The i's are bothering me, they have a strange starting point* (and seem a bit too tall), the pen would start more in the position of the p and r and are a touch too narrow. The ie needs kerning tighter and I would look at some kind of decorative ending or flourish to the second e. The Ta ligature is rather attractive, but I think you need to do some work to the outside/bottom stroke so the join is smooth, there seems to be a flat point between 5 and 6 o’clock.<br>
      *anti-chirographic<br>
      Tim</p>
