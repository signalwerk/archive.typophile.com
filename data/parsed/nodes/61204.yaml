    html: |-
      <p>That bold "a" is highly charming!<br>
      But overall this still needs a lot of work (as you might suspect).</p>
      <p>Slant: what you show just above is great - I'm a very big fan of slight slants. But your original 1 degree idea won't work - it's way too slight. To me a slant of 1/16 (about 3.5 degrees) is generally the lowest you want to go.</p>
      <p>BTW, for better or worse, this doesn't look at all Dutch.</p>
      <p>hhp</p>
