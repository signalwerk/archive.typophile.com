    html: |-
      <p>Thank you all for your comments. It's interesting that folks should mention the slant as I was originally planning to oblique it slightly, by about 1 degree. The rounder forms do still pull to the right, and I suppose that slightly obliqueing the others is the best solution for this as otherwise I will loose some of the unique characteristics of the font.</p>
      <p>I agree about the baseline overshoot. I will work on that. I also agree about the s in the black weight. I've worked on the 's' quite a bit, but it still needs a bit more work. </p>
      <p>How do you feel about the E? The serifs?</p>
      <p>Thanks again,</p>
      <p>Jeremy Dooley<br>
      <a href="http://www.insignedesign.com" title="www.insignedesign.com">www.insignedesign.com</a></p>
