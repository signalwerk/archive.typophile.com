    <p>I've been working on a new sans serif. It takes some inspiration from the recent trend of Sans/Handwriting hybrids and from the "Dutch style." </p>
    <p>Shown are the Thin, Regular and Black weights. This is an early build, and I welcome your constructive comments. Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sovba-Page-Source_5183.png"></div><p></p>
