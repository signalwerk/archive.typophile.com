      <p>I'm not a typeface buff like some (most?) other people around here, but I second fabergraph; it would be very interesting to see a slightly slanted version of these fonts.</p>
      <p>I get the feeling that something is "crooked", and though I'm not sure exactly why, it might have to do with the angle of the 'e' stroke misbehaving with the thinner 'n', 'm' or 'r' strokes.</p>
      <p>I think I like the Black better :)</p>
