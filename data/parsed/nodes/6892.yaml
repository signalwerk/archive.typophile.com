  html: <p>Hi everyone, <br> <br>Does anyone here recognize this typeface?  It was used by a sports team in the late 1890's in England, and I'm trying to find its modern-day equivalent.  Take a look at those 'A's and 'S's.  Pretty distinctive, don't you think? <br> <br>Any ideas would be greatly appreciated! <br> <br>Many thanks for your time, <br> <br>Andrew <br> <br><img src="http://www.typophile.com/forums/messages/83/49960.jpg" alt=""> <br><img src="http://www.typophile.com/forums/messages/83/49961.jpg" alt=""> <br><img src="http://www.typophile.com/forums/messages/83/49962.jpg" alt=""></p>
