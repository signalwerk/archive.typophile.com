    html: "<p>Inexplicably the link for Ravenscroft which worked fine earlier seems to have shut down... <a href=\"http://www.fontseek.com/cgi-bin/fsearch.pl?search=ravenscroft\" target=\"_blank\">here's</a> another. <br> <br>Besides being free, the font contains alternate characters for the R, A, N among others. It seems to have been created by/for Disney's Haunted Mansion. <br> <br>and while we're on the subject of links, am I the only one who vastly prefers when they open up in new windows? <br> <br>A note to Type: the links exist (often) if you look for them. I found <a href=\"http://www.myfonts.com/fonts/solotype/goodfellow/\" target=\"_blank\">Goodfellow</a> very easily. Google works too.</p>"
