    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 31.May.2006 12.09pm </div>
      <p>+++</p>
    <p>For Release: June, 1st, 2006, Buffalo, NY</p>
    <p>P22 type foundry announces an addition to its popular series of Frank Lloyd<br>
    Wright fonts with FLLW® Midway™ and releases a new font inspired by<br>
    Post-Impressionist artist Paul Gauguin.</p>
    <p>FLLW® Midway™</p>
    <p>In 1913, Edward C. Waller, Jr. commissioned Frank Lloyd Wright to expand an<br>
    Amusement Park complex and turn it into an upscale palatial beer garden.<br>
    The Midway Gardens was born. FLLW® Midway™ is based on the lettering found<br>
    on the Midway Garden’s working drawings. The lettering itself is in Mr.<br>
    Wright’s distinctive hand. This type of architectural lettering is a bit<br>
    more casual than standard lettering found on most blueprints. It evokes the<br>
    personality of Frank Lloyd Wright in a way that complements the other fonts<br>
    in the P22 FLLW font series. The set contains Midway One and Midway Two,<br>
    which can be used interchangeably to give a more naturalistic feeling of<br>
    hand lettering.  Also included is Midway Ornaments, which features over 100<br>
    architectural and decorative elements that can be combined in many ways for<br>
    surprising and effective decorative motifs and borders. Designed for P22 by<br>
    Paul hunt.</p>
    <p><a href="http://www.p22.com/products/fllwMidway.html" title="http://www.p22.com/products/fllwMidway.html">http://www.p22.com/products/fllwMidway.html</a></p>
    <p>P22 Gauguin Font Set™ -</p>
    <p>P22 Gauguin™, designed by Colin Kahn, is based on the writings and sketches<br>
    of Post-Impressionist artist Paul Gauguin. This naturalistic writing font<br>
    is based on Gauguin’s notebooks from his travels to Tahiti and the South<br>
    Seas. This set presents two styles of script fonts (Regular &amp; Brush) and a<br>
    set of decorative extras featuring Gauguin woodcuts, sketches and imagery<br>
    from his paintings.</p>
    <p>P22 Gauguin™ is also available as a Pro font. The OpenType font<br>
    incorporates P22 Gauguin Regular™ plus over 350 additional characters<br>
    including: Stylistic alternates for all characters (a-z, A-Z), Central<br>
    European and Cyrillic character sets, ligatures, swash characters and many<br>
    other OpenType features.</p>
    <p><a href="http://www.p22.com/products/gauguin.html" title="http://www.p22.com/products/gauguin.html">http://www.p22.com/products/gauguin.html</a></p>
    <p>Prices starting at $19.95 for single fonts. Both sets are available on<br>
    CD-ROM, contained in a DVD ThinPak case. All fonts can be test driven with<br>
    TypeCaster™.</p>
