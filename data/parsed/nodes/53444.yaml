      <p><strong>"Linux was not a hobby, it part of Linus Torvald’s education in computer science at a state school in a socialist nation where higher education is free. Linux grew into his master’s thesis."</strong></p>
      <p>Linus Torvald's Usenet posting that basically <a href="http://groups.google.co.uk/group/comp.os.minix/browse_thread/thread/76536d1fb451ac60/b813d52cbc5a044b" rel="nofollow">announces Linux:</a></p>
      <p><em>Hello everybody out there using minix -</em></p>
      <p>I'm doing a (free) operating system (just a hobby, won't be big and professional like gnu) for 386(486) AT clones. This has been brewing since april, and is starting to get ready. I'd like any feedback on things people like/dislike in minix, as my OS resembles it somewhat (same physical layout of the file-system (due to practical reasons) among other things).</p>
      <p>I've currently ported bash(1.08) and gcc(1.40), and things seem to work. This implies that I'll get something practical within a few months, and I'd like to know what features most people would want. Any suggestions are welcome, but I won't promise I'll implement them :-)</p>
      <p>Linus (<a href="mailto:torvalds@kruuna.helsinki.fi">torvalds@kruuna.helsinki.fi</a>)</p>
      <p>PS. Yes – it's free of any minix code, and it has a multi-threaded fs. It is NOT portable (uses 386 task switching etc), and it probably never will support anything other than AT-harddisks, as that's all I have :-(.<br>
      </p>
      <p><strong>"And the Linux operating system as a whole is hardly the work of hobbyists. Much GNU software that makes the kernel useful was produced by computer scientists and academics who wanted code that they could edit and redistribute. They didn’t give it away because they were great philanthropists, they did it because they were nerds who wanted to tinker with code unfettered."</strong></p>
      <p>As I said earlier, I don't really think that the Open Source/free software paradigm can work with type design. I'm not saying that you should design a font-family for free. In fact, I only stepped in to clarify that many open source projects are started as hobbies that grow into something much more. Too, I never said that Linux was STILL a hobby. It's obviously much more than that now.</p>
      <p>Furthermore, what would it matter whether the programmers were doing it be philanthropists or merely "nerds" who wanted to mess around with code? They released it OS/Free all the same. And again, I AGREE that this sort of thing wouldn't really work with type design. However, if type design is something that you love to do, and you find yourself fiddling with a font in your down time, just "tinkering" around with it, why not release it for free if you're already not being paid for it? After all, OS/Free also doesn't mean that a team of people HAS to work on it. A lot of my favorite software comes from a single coder who is nice enough to share their personal projects with the net.</p>
