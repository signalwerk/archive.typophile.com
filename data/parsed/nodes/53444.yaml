      <p>Very well Zara, I never intended to cause either through the creation of the thread, or either of my 2 following comments to cause disrespect to any particular person or to Typophile itself.</p>
      <p>I <em>am</em> young, and I know that.  I don't have the benefit of being shielded by tough impermeable hide to protect me from some of the direct ad hominem attacks thrown at me while I was attempting to raise support for the benefit of others, though I did try my best to remain diplomatic and not fall into the trap of replying or arguing against any comment that I may have taken offense to in the interest of trying to keep the thread itself on track, lest it decay into bickering and nothing get accomplished.</p>
      <p>I apologize if I have disappointed you through my failure to either engage the forum in a manner in which intelligent discussion could be carried out, or through my greatest efforts to remain impartial toward comments comparing me to throwing a tantrum and questioning my comprehension of the nature of open-source and commercial development models.</p>
      <p>This whole thing has really been a learning experience for me, and I hope that long after I have been removed from this thread and forum that maybe some seed of charity will grow in the hearts of those who did read the ideas, and hopefully some will eventually consider releasing some work under a license that allows free redistribution.  If that happens because of what has become this ugly thread I will still count it as a win for the greater good although I likely won't be here to see it.</p>
      <p>I was no longer checking this thread, and if I hadn't been emailed by another forum member I wouldn't have been back here to post this apology.  I feel that there are others here who rightfully owe an apology, but based on how things have unfolded I have serious doubts that other apologies will be made.</p>
      <p>I can't quite understand though Zara, and maybe it's because you haven't got the time to go through all of the comments as much as I had, but when a direct ad hominem attack is made against you, how else can you take it <em>but</em> personally?  Isn't that inherent in the nature of such attacks?</p>
