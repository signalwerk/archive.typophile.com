      <p>James: <em>But that does bring us back to the earlier problem—how does the experienced designer pay his mortgage when he’s taking time from work to oversee a free font project?</em></p>
      <p>Someone, somewhere, pays him. Even a reasonable likelihood of income is usually enough to get a type designer moving. I'm working on a project now that took two years of planning before the contract was signed, including a lot of work on glyph set definition, making spreadsheets, costing the development, etc. all of which was done before I was assured of any payment. But I was willing because I knew that the client had the money and serious intent, so it was a reasonable investment of my time. So far, every open source font sounding has been incredibly nebulous. I'm waiting for someone to come along and say 'We have a grant/investment of X number of dollars/euros and want to commission some fonts that will be released under an open source license'.</p>
      <p>It seems to me that one of the problems of open source advocates is that they are coming to type designers presuming that we are going to be enthusiastic about treating type design as open source software development. It isn't, and I'm not enthusiastic. As far as I'm concerned, open source or proprietary is a licensing choice that has absolutely nothing to do with design. So rather than looking for type designers to play at being open source software developers, I think interested parties should get their hands on some cash and then commission some fonts the same way our commercial and institutional clients commission fonts.</p>
