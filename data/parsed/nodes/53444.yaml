      <p>(First of all, sorry if this sounds aggressive, it's not my intention)</p>
      <p><em>So I’d suggest Tom send similar “calls” to other lists. A few suggestions…</em></p>
      <p>Do not confuse services and products. Dentist, airline, icon and font design are services, it makes sense to pay for that. Pizzas are physical products, it makes sense to pay at least as much as the flour/tomatoes/etc cost. Making and baking the pizza is a service that adds value to the raw flour and tomatoes.</p>
      <p>Using a font on my website or in a PDF is not a product nor a service the font designer provides, thus I don't see why I should pay or have to read legalese and worry about abusive embedding/redistributing/per-cpu limits. Once the font is designed, distribution is basically free. But of course unless the designer has a patron (is that the correct word? «mécène» in french) there is nobody to pay.</p>
      <p>This is the same problem as with the music industry —except font designers cannot live from live performances :-) In the end I wish I could have unlimited use and pay a flat fee per year and have that redistributed to the artists according to my listening statistics on last.fm. Maybe I should move to <a class="freelinking external" href="http://arstechnica.com/news.ars/post/20090119-isle-of-man-gets-unlimited-music-downloads-with-blanket-fee.html" rel="nofollow">Man</a>.</p>
