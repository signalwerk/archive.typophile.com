    html: |-
      <p>This Baskerville face is fine and those whose work and generosity brought it forth should be commended for a type design well executed. But it is not the base of a style set upon which an open source effort begins.</p>
      <p>All such fonts have a core set that begins with sans, sans monospaced, and symbol. Next in the style set are bold, italic and bold italic to complete the sans and sans monospaced. Then comes serif and monospaced serif followed by their bold, italic, and bold italics. Look around, (this is probably not the best situation in which to choose your own ground).</p>
      <p>Not only is it lazy-seeming to start with a willowy and cross-device averse Baskerville (its reason for being), but there is no need to break up styles by character group within a script, to farm out for design as there are lots of styles and scripts required. Extended language support gets added as progress is accepted. Extending language support in a display Baskerville will not be likable with visual compatibility, (think kanji).</p>
      <p>Starting without a spec and, claiming any kind of group view, will be unfortunate for this group. Sii and Thomas must know these things all too well — or are they hiding what they know, or have they lost it? </p>
      <p>Cheers!</p>
