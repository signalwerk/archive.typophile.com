      <p>I’ve been only now catching up on this thread and the open invitation to type designers on Typophile and was sad to see how poorly received it was. I believe most of the negative responses were due to misinterpretations of the invitation due to ignorance of FOSS, its community and development models. I have seen many similar responses to the concept of pro bono work from professionals who felt themselves and their business models threatened by the flag of FOSS. Ultimately I believe ignorance begets arrogance and fear and thus hold it vital to try to understand new (sometimes very radical) ideas for often they are the proponents that lead to (often positive) change.</p>
      <p>It is equally regrettable to hear that Tom may take an absence from the typophile.com community. Although I am not much of an active member, I particularly value the contributions in a holistic sense of those who do in fact understand FOSS for their insight and willingness to look past immediate concerns of payment for their time and efforts.</p>
      <p>This said I understand the situation of many professionals who may find they do not have the time or otherwise ability to participate in an open type project—I find I often don’t have the time to read and respond to many of the discussions that occur here, along with the thousands of other things I wish I had time for. I think Tom’s invitation was worded persuasively yet it was an invitation that begged for consideration, and he felt was met with outright rejection.</p>
      <p>I believe the misconception that openly licensed fonts are prone to depreciation through inconsistent or ‘amateurish’ edits comes from being compared too directly with other code-based software projects. In my opinion no font is ever perfect, and yes while this will always be an entirely subjective opinion, even Robert Bringhurst states that adjustments of the kerning tables can, and even should be made. Furthermore with Unicode always expanding the task of adding new glyphs and ensuring widespread language support will keep any open font project alive for years to come—see the commit change logs of the more successful open font projects. If the project lead feels a negative edit has been made this can be easily reverted; similarly if the community is not happy with the decisions of a project lead, the project can easily be forked.</p>
      <p>The argument that projects with visual aesthetics at their heart are harder to collaborate on than software projects with code at their center I believe has some merit. I think of these potential issues more as a challenge to overcome rather than a reason not to get involved—the possible benefits of collaboration in my opinion are worth the efforts of overcoming subjective opinions on aesthetics. Having participated in the GNOME and Tango Desktop Project and otherwise the FOSS community for over a three years now, I am personally convinced that we have overcome many subjective disagreements over aesthetics and as a result have produced work we are proud of and the community readily uses.</p>
      <p>As a final thought, I think a good starting point for a new open font project would be to begin with a faithful historical revival, thus possibly sidestepping some of the issues of aesthetics.</p>
      <p>Kind regards.</p>
      <p>—Simon Pascal Klein</p>
