      <p>I don’t think point of the project is to create an awesome open-source Baskerville based on Fry’s. I think that everyone realizes the open-source world really doesn’t need a Baskerville designed to use at p48 and up. But what is going to come out of this is the work Pascal is doing to set up an open-source font project. If he can put a small team together and finish this simple task, they don’t have to worry about how to set up the server, what file formats to use, software, etc. when they move on to a big project. All they’ll have to do is write a brief, replicate a development environment that functions as needed, and get to work.</p>
