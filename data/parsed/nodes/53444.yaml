      <p>I'm reminded of a maxim I heard once that went something like <em>"if you can't say anything nice, don't say anything at all"</em></p>
      <p>I have had a greater response here than I could ever have hoped for, but unfortunately the response has been overwhelmingly negative.  You question my ability to assess the hours of work that go into designing a typeface simply because I threw a question out knowingly against the odds?  I don't see the logic in that.</p>
      <p>I don't think you have any basis for making statements calling my understanding of open-source development, the differing contribution models or the knowledge of different open-source funding models into question.</p>
      <p>I lack the authority on this forum to close a thread, but that cannot change my desire to do so.  I think that while you all line up to take your respective shots at a young designer with your witty and <em>élite</em> comments you might be losing sight of the fact that I'm not just some anonymous thug holding you at gunpoint and asking politely for your wallets, but one of you.</p>
      <p>I asked for a willing contribution, and if you don't find that in yourself I'm reminded of another saying: <em>"Nothing to see here, move along, move along."</em></p>
      <p>I could spend my time sitting here and replying to each of your individual personal attacks, flawed logic, inconsistent illustrations of the way you perceive the nature of open-source development, and insults - but at the end of the day I would have hoped you'd agree that my time could be spent doing something of greater benefit. I will simply consider the source and allow disappointment.</p>
      <p>You have collectively, and completely, shocked me.  It's not often you misjudge an entire collective of people, but it appears that in my life thus far I have become too accustomed to the helpful and giving nature of the open-source communities in which I take part. </p>
      <p>I offer not just those who have wasted five minutes of their time conjuring a seemingly harsh response to my ludicrous question, but to all members here, my most heartfelt apology for being so incredibly and publicly naïve, and through my suggestion placed a burden on your conscience that merited such hostility to overcome.</p>
      <p>I imagine you'll see less of me on here after this, I have greater things to accomplish than to become so consumed by money and propriety that I wither and rot into a bitter state of existence.  Personally, the satisfaction for the work I do derives directly from how many people I am able to help through it, not from the money I can acquire if I keep ownership of it.  I have now understood my error and will spend my time amongst people closer to who I wish to become.</p>
