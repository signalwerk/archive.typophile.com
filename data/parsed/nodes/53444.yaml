      <p>Seeing as how I was a prick earlier in this discussion I thought it would be nice to throw the open-source crowd a bone. Last year I started work on a high-contrast version of Fry’s Baskerville for private use. I won’t ever finish it so I’ll throw it into the public domain. </p>
