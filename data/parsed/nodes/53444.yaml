      <p><cite> […] how else can you take it but personally? Isn’t that inherent in the nature of such attacks? </cite></p>
      <p>Tom, I have two perplexities about your attitude:</p>
      <p>1) Charity: I have strong doubts about the possibilities of being charitable through the offering of open-source works. Firstly, because people tend to abuse what's gratuitious. I would like to see initiatives to be rewarded by donations, I would like to see more sharing of work, and not all backed up by sponsorization, but as long as we're on this earth, in this human condition, spiritual progress largely depends on everyone's commitment and availability.<br>
      If you are unable to sensibilize people about recognizing the gratuitious nature of things (and I have strong doubts you can do that by words, seen how everything is often taken for "granted" and not "given", but this opens up a whole reflection on "creation" and "authority" which people tend to dislike, as they seem to prefer to live in a sort of "automated" way.<br>
      Charity comes out of Charity, no other way.</p>
      <p>2) Youngness: I think this is a point of strength on your part, not just a "vulnerability". Personally I have never had the chance to attend studies. We simply did not have them around 20 years ago in Italy, that's all. But I see I have "learned" nonetheless, and the first step is not to give so much importance to "personal attacks" or the short-sightedness of many so-called professionals.<br>
      I feel I still have everything to learn, but I am no longer saddened or embittered by that, since I have realized you learn in an infinite number of ways, and it may prove a more enriching experience to learn from a small, single thing, than to try to tackle the biggest problems on a wide scale.</p>
      <p>Of course, I quite agree about the fact that it would be good to have more open source faces, but I also agree with the idea that we should have more works of personal dedication priced accordingly.</p>
      <p>So, if you really wish to understand better, try to explain more in detail what you would propose, and I'm sure you'll get a lot of constructive feedback.</p>
