      <p>Back in the dim and distant there was an attempt at collaborative typeface design on Typophile, kind of along the lines of the Type Battles, zip files of ai files were posted for anyone to download, work on and re-submit. Somewhere on a backup disc I have some/all of the completed glyphs, I think just most of the lowercase was completed and from memory it certainly wasn't a <em>professional</em> typeface, unfortunately (or maybe fortunately) it was never completed and just ran out of steam, lack of commitment etc.</p>
