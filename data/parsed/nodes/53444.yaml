      <p><em>I have not seen any of that here until your last post. Rather, I saw members of a community come together and provide extremely useful information to your effort and shared their perspectives on the topic.</em></p>
      <p>I would disagree with this statement. There were a few moments in this thread where, though not named personally, rather unflattering terms and generalizations were used about a community to which innovati clearly belongs (I too, count myself in that community). I understand completely why he would get defensive and take things like that personally. Any vitriol found here cannot be fully attributed to the him, though. But for the most part, I think everyone's been very respectful.</p>
      <p>Just some more food for thought: <a href="http://hcsoftware.sourceforge.net/jason-rohrer/" rel="nofollow">Jason Rohrer</a>, an open source/free game designer based in up-state New York, makes his living (roughly $10k/year) almost entirely from web donations from fans, plus the occasional commissioned game/article from an online gaming publication (which can't amount to too much). Of course, Rohrer doesn't want bills to pay, etc., so his meager income is by design. But you CAN make money from releasing your spare-time projects open source/free (or even just free) and ask for donations. Will everyone who downloads your font/project/whatever? Of course not, but you can make a decent amount of money all the same, even if you just do something in your spare time.</p>
      <p>Though a bit hesitant to do so, I would liken exljbris foundry's release method to this, at least for Museo. 3(?) fonts for free, and you can purchase the other 2(?) to make the family complete. You get a great quality product for absolutely nothing. If you like it (a sidenote: I do!), you "make a donation" to Jos and get the other two weights. It's a bit of a stretch, as you're not really making a donation, but I think the spirit is there.</p>
      <p>All that said, I'll just reiterate that I think any open source font project would have to have either a sole author or a very small group of like-minded designers to be "professionally" successful. </p>
      <p>Edit: Rohrer's income is actually in the range of $14.5k, as he has a consulting job with Electronic Arts, as well as a patron. I was a little surprised that such people still existed (patrons, that is).</p>
