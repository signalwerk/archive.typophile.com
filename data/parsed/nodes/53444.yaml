      <p><cite>What if the fonts are released in a CC-BY-ND licence, your work would be free to use and distribute, and even use commercially, but they would still be required to give you credit at the author, and they would not be allowed to make derivative works based on your typeface.</cite></p>
      <p>That’s not enough for the F/OSS world. People redistributing software do not want to get bogged down in crediting everyone who contributed something. These licenses got washed out of the free software over a decade ago when BSD distributions were shipping with multi-page lists of code authors. When the XFree86 authors went this way everybody dumped XF86 for X.org. And if users can’t develop derivative works, then what’s the point of releasing the fonts to the F/OSS world anyway?</p>
      <p><cite>I personally have been using linux since 2001.</cite></p>
      <p>Good for you. But most of the world isn’t interested in Linux even though it offers substantial cost savings. I’ve used damn near every Unix system out there at some point, and I dumped Linux back in 2001 because it isn’t worth the headaches. I haven’t run Linux without regretting it in ages. I certainly don’t think Linux is worth giving fonts away.</p>
      <p><cite>All mac users use a proprietary desktop, built on an open-source kernel called Darwin.</cite></p>
      <p>The UNIX code under the hood of Macs was developed by people working for AT&amp;T, the University of California, DARPA, IBM, HP, SGI, Sun, NEXT and plenty of other organizations who had financial support coming from cold-war era defense projects. Most of the other programmers in the BSD world are IT professionals who use and tweak the system as part of their day-to-day work.</p>
      <p><cite>If you’ve visited 3 websites in your life, chances are 2 of those depended on open-source technologies to be served to you.</cite></p>
      <p>Technologies like HTML and HTTPD were not developed by hobbyists giving up a little time; they were developed by government-funded computer scientists. </p>
      <p><cite>When a schoolboy comes to your door raising funds for a charity do you tell him to get himself a job and donate his own money?</cite></p>
      <p>I can’t think of many charities that come around asking for weeks of work. What you’re asking for is more like someone showing up at my door selling tickets to a gala at $10,000 a plate. And the entertainment is Clay Aiken.</p>
      <p>Innovati, your thinking on this issue is very callow. You don’t know enough about type design, software development, or the history of F/OSS software to even understand what you’re asking for.</p>
