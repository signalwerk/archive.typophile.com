      <p><cite>I think that while you all line up to take your respective shots at a young designer with your witty and élite comments you might be losing sight of the fact that I’m not just some anonymous thug holding you at gunpoint and asking politely for your wallets, but one of you.</cite></p>
      <p>Tom, You are really taking the criticism a bit personally, aren't you?</p>
      <p>Over the last 5+ years, I have read a lot of threads in which professionals and students bickered about this and that, and unfortunately on occasion some turned to personal attacks to get their points across. I have not seen any of that here until your last post**. Rather, I saw members of a community come together and provide extremely useful information to your effort and shared their perspectives on the topic.</p>
      <p>If I had started this thread, I would feel pretty good about getting so many talented people engaged in what is a very important topic in this industry, yet it seems you only want to listen to those who agree with you. Resolutions only come when you have explored the opposing sides of a problem. You could probably benefit highly from listening to their experiences since most of them know what they are talking about because they live it breathe it every day - some for many years.</p>
      <p>You don't have to agree with them, but in the spirit of collaboration, you might consider taking a chill pill and treating your future colleagues with respect.</p>
      <p>**My apologies for missing the first one. But whatever!</p>
