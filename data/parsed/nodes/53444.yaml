      <p>Harhuum.</p>
      <p>The primary difference between open source code and open source fonts would be that the code would likely be improved over time, but the fonts would very likely become worse.</p>
      <p>The "scratch your own itch" model of software development works very well for large open-source projects exactly because my new feature or fix is something that &gt;I&lt; need in a current project, and therefore &gt;I&lt; will spend the time (or get the funding) to build the new feature or squash that bug.</p>
      <p>This really would not be the case in font development.<br>
      A professional designer is very unlikely to need, or want, to go into somebody else's font and fix the problems in order to be able to use the font themselves.</p>
      <p>i'm actually sympathetic to innovati's thinking, and had at one time talked with Lee Quin about donating some fonts from the Alphabets Library to the {forgot the name of the FOSS Desktop project} he was involved with. </p>
      <p>However, the same concerns and issues arose on further consideration, and it never came to pass.<br>
      The idea of releasing DESIGN into the public domain is perfectly legitimate. However, that certainly does not mean that DESIGNERS should be obligated, nor brow-beaten, for considering their own livelihoods.</p>
      <p>FOSS is NOT in any sense, a charitable institution. It thrives exactly because it provides more value back to those who donate to it than they are required to 'pay'. Unless and until the same model would work for fonts... or photos... or creative writing, or any other pursuit, the model will not thrive in these domains.</p>
      <p>Just my 2 cents ;-)</p>
      <p>Peter Fraterdeus</p>
