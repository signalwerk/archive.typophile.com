      <p>I don't agree about posting emails in a public forum. It's something a professional just does not do.</p>
      <p>What did you hope to achieve by posting it?</p>
      <p><em>And more: you answered to my request as Alt Indie Typo group responsible so, in my opinion, there’s no privacy issue at all.</em></p>
      <p>False logic. Alt Indie Typo is a private group. Its contents aren't visible to the internet public, and I did not give you permission to make your application public. The whole point of the application process is that it is meant to be a private conversation between the group owner and applicants.</p>
      <p><em>Many talked about collaborative working here showing technical, practical and also philosophical difficulties. I just wanted to point at the human factor.</em></p>
      <p>You chose an unethical way to do that.</p>
      <p><em>About the Fell Types: please don’t feel obliged to justify your admission criteria.</em></p>
      <p>I'll justify whatever I feel like justifying. You offered your Fell fonts to Alt Indie Typo, and accordingly I have given reasons why they don't meet Alt Indie Typo's technical standards. So this part is an issue.</p>
      <p><em>In any case many actually use them without the problems you think will arise and every browser I have display them perfectly.</em></p>
      <p>I tested them in Internet Explorer, Firefox, Opera and Google Chrome, and those fonts render slowly. Speed of rendering is a critical factor for embeddable web fonts. Every font vendor I've had contact with will not accept fonts with stacked points in the outlines, and I conceive of Alt Indie Typo by the same technical standards.</p>
      <p><em>Anyway I didn’t offered my design services at all. Just spacing and kerning.</em></p>
      <p>I thought you were offering your Fell type fonts. I appreciated what you were offering at the time, and as I told you in my reply email, if Alt Indie Typo needs manual hinting services I may contact you if and when the time comes. So it's hard to see the point of what you're saying above.</p>
      <p>I can't put any more time into this discussion thread, so I thank you Igino for acting in good faith and for offering the Fell Types and your hinting services. The best thing you can do with the Fell type fonts is clean up the outlines, reduce the number of nodes and eliminate all the stacked points.</p>
      <p>j a m e s</p>
