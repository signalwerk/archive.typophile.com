    html: |-
      <p>There is a whole heck of a lot more wrong with Lavoisier than the oblique italics. Just in a couple of minutes I noted:</p>
      <p>- no optical adjustment where curves meet straights. hmnru are horrible<br>
      - inconsistent sidebearings (left straight cap: 56 or 60? left round cap 41 or 44?)<br>
      - just bad sidebearings (Z and N have the same left sidebearing, while s is 60% of Z)<br>
      - slightly inconsistent stem weights for no obvious reason<br>
      - horizontals are not enough thinner than the verticals to be optically the same. They look too thick or the verticals too thin.</p>
      <p>Also, where curves turn into straights is very clunky to my eyes. Either give it an angled join or make it smooth, but the status quo looks bad. I suppose this could be argued to be a design feature (unlike the errors above), but I'm skeptical at best.</p>
      <p>This is real amateur stuff. In a one-day seminar on type design, I'd cover all these points. Heck, I think I covered all these points in my 45-minute talk on font quality for "TypoBerlin" last year. They are just fundamentals.</p>
      <p>(No wonder type professionals and serious aficionados are skeptical about quality for open source fonts.)</p>
      <p>Cheers,</p>
      <p>T</p>
