      <p>On examining the OpenType versions of Igino's Fell type fonts as vector outlines in Illustrator, I discovered hundreds of glyphs constructed with an abundance of excess points and *stacked points*.</p>
      <p>The excess points and stacked points in these fonts will generate lots of postscript errors on rasterization by user agents rendering the type outlines embedded on webpages, resulting in sluggish (slow) rendering times.</p>
      <p>Do web designers demanding embeddable web fonts really want font products with this level of technical quality? I certainly would not offer such underdeveloped products under any circumstances. Web designers need and deserve better quality than that of the IM Fell type fonts. </p>
      <p>Alt Indie Typo is committed to developing embeddable web fonts without technical errors, complete with EOT and @font-face empowered EULAs.</p>
      <p>j a m e s</p>
