      <p>@Nick: Tom does not speak on the behalf of ‘the open source community’ (in a holistic sense) nor any specific project (that I aware of). There is no general guideline on starting a new project, though it generally just begins with invitation through dialogue, much like Richard Stallman’s GNU project or Linus’ kernel project posting on mailing lists—in fact that’s how most FOSS projects that I can think of came into being. Many developers perused mailing lists or newsnets, whereas many type designers are found at home here on typophile, hence Tom’s decision to post his idea and invitation here.</p>
      <p>We are not going to get a formal proposal from someone because the FOSS community does not operate like a traditional business; there is no brief, quote to write or contract to sign. FOSS projects commonly begin with a general invitation to join a cause to scratch an itch.</p>
      <p>So, in an effort to get a ball rolling, here’s what I think a Tom and we could consider aiming for:</p>
      <ul>
      <li>a high-quality font family, whereby the quality is measured in hinting, kerning, character support/language support, number of weights and styles available, etc.;</li>
      <li>stylistically a good place to start as I noted above might be a digital revival, perhaps from the humanist period (it’s one gap that is not yet covered by open fonts and humanist typefaces are reasonably popular);</li>
      <li>to publish the work under an open license, anything from public domain to an open font license (I haven’t looked into this), a Creative Commons license, one of the open artistic licenses (their proper names currently escape me) or even the traditional GPL, or variant thereof (or anything else if none of these are applicable?).</li>
      </ul>
      <p>Supportive technologies could include a mailing list, which would probably be a good place to start from if this project attracts a couple of people. Once anything gets going a distributed version control system (e.g. git or bazaar) could be set up to manage contributions and edits and to manage new interest and show off the work, a small site/wiki—as an example, have a look at <a href="http://tango.freedesktop.org/" title="http://tango.freedesktop.org/">http://tango.freedesktop.org/</a>.</p>
      <p>Just some thoughts?</p>
