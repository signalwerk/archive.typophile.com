      <p>Tom, you'll get over it.<br>
      This is just one small aspect of type.<br>
      Sure, you have been told in no uncertain terms that you don't know what you're talking about, but that happens to everyone here at one time or another if they say something contentious.</p>
      <p>I don't think you will find too many type designers subscribing to the feasibility of font altruism as a smart career move -- the Torvalds path, making a name in OS fonts, geting scooped up by David Berlow and eventually ending up with millions in Font Bureau stock options--so I'd like to suggest this alternative course of action to accomplish your goal:</p>
      <p>Divvy the job up: set up strict metric and aesthetic parameters, assemble a team of volunteers each willing to do a subset of glyphs, and that way no one person would be too heavily invested emotionally, with too onerous a workload.</p>
