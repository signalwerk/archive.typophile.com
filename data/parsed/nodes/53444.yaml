      <p><em>Still, your example of Jason was that he is doing this *full time*, and even with a consulting contract and a patron on top of his donations, he is only pulling in $14.5 K a year? Presumably one wouldn’t be doing nearly as much work if it was in one’s spare time. Plus, Jason is a full-time open source game designer rather than an open source type designer (the former seems more viable to me). I think this example actually hurts rather than supports an argument for the financial viability of donation-based open source type design.</em></p>
      <p>So if it wasn’t for the consulting and the patron, he’d be getting, what, maybe half of that? Somebody doing it on the side of a full-time job would be putting in what, 1/3 the hours? So maybe $3K or $4K a year? Sure, that’s money, and I’m discouraging anybody from trying it, but it doesn’t sound like a living as most folks would think of it.</p>
      <p>According to numbers he provided Esquire magazine, Rohrer's budget before his patron and before his consulting job was the $10k that I provided in my initial comment. And his games are not quite what you think of when you think of a video games. Very retro and low-budget (understatement of the year). And again, I'm not suggesting that anyone try to match his level of desired poverty. But even $3-4k garnered from doing work on the side—work that, in all likelihood, you love to do—is nothing to sneeze at. I wouldn't want a living on $3-4k/year, but I'd love a side bit of income like that.</p>
