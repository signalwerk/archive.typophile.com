      <p>I'm just catching up to this thread -- it seems like the thread turned the corner. (Is everybody done getting their feelings hurt?)</p>
      <p>Now that this group has had the initial reactions and people have expressed themselves will you start a new thread and invite the interested parties to join in a directed effort that has a clear charter? Or will you let the negative initial reaction kill the whole idea? If it's worthwhile and you're committed to it there's no reason to waste energy by getting offended.</p>
      <p>If it's worthwhile the people with passion for the idea will help make it happen. Wikipedia started as one guy who invited a small group of people to help him out with a social experiment. He didn't start with a grand vision of replacing printed encyclopedias. Say what you will about Wikipedia's quality, it has changed the landscape.</p>
      <p>Typophile will gladly host a project of this nature. There's no compelling reason not to. What Typophile can't do is convince people to join in or donate their energy, time or resources. You've got to muster that and clearly you've got a hurdle to overcome already. Although, all you really need are two or three people to get the initial momentum going...</p>
      <p>Earlier someone mentioned the group font effort. What was that, 2003? It was a social design experiment. It didn't start with a charter or a design brief. It fizzled out because there was no clear vision for how it was going to impact people, make lives better, or [insert lofty goal here].</p>
      <p>If you have that clear need or vision, then start a new thread and announce your project, say what you need and run with it. And if people don't want to participate I think you'll find that they won't get in your way.</p>
      <p>Lastly, you have received some good input from folks here who don't believe the idea will work. Use their reactions as constructive input -- they have industry understanding that would benefit you and it's wasteful for you to get offended by their reactions.</p>
      <p>__</p>
      <p><em>Post script. Ideo recently announced an open source UI design effort to envision a new interface for Bug Base. And don't tell me a UI is too subjective or too aesthetically-driven for an open source effort to work. <a href="https://client.ideo.com/buglabs/" rel="nofollow">https://client.ideo.com/buglabs/</a></em></p>
