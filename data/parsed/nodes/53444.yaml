      <p><cite>Linux was started by Linus Torvalds as a hobby. He was not paid for the code.</cite></p>
      <p>Again, you guys are doing a very poor job of being open-source nerds. Linux was not a hobby, it part of Linus Torvald’s education in computer science at a state school in a socialist nation where higher education is free. Linux grew into his master’s thesis. If type designers could go to school for eight years on someone else’s dime there would probably be a lot of free typefaces out there. But that is not the case.</p>
      <p>And the Linux operating system as a whole is hardly the work of hobbyists. Much GNU software that makes the kernel useful was produced by computer scientists and academics who wanted code that they could edit and redistribute. They didn’t give it away because they were great philanthropists, they did it because they were nerds who wanted to tinker with code unfettered.</p>
