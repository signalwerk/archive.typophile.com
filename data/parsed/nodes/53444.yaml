      <p>I <em>am</em> young, and I know that.  I don't have the benefit of being shielded by tough impermeable hide to protect me from some of the direct ad hominem attacks thrown at me while I was attempting to raise support for the benefit of others, though I did try my best to remain diplomatic and not fall into the trap of replying or arguing against any comment that I may have taken offense to in the interest of trying to keep the thread itself on track, lest it decay into bickering and nothing get accomplished.</p>
      <p>I apologize if I have disappointed you through my failure to either engage the forum in a manner in which intelligent discussion could be carried out, or through my greatest efforts to remain impartial toward comments comparing me to throwing a tantrum and questioning my comprehension of the nature of open-source and commercial development models.</p>
