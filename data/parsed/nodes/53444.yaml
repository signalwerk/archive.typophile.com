      <p>Apologies in the delay of my response. I’m happy to see conversation return and new ideas coming forth, and because it deserves mention again, James Puckett’s release of Fry’s Baskerville into the public domain.</p>
      <p>I’ve been contacted by two interested persons off-site regarding starting an open font project. This would probably be run on Google Groups and possibly Google code (they provide version control systems which is all we really need), and if anything came from it, could be added to Open Font Library (heck, if someone wanted to put anything up there earlier, they can).</p>
      <p>From my understanding a charter or roadmap is being written. I don’t think a full spec. is at all required—I think the three of us understand what we want quite well, and for those interested in joining, a one or two line intro on a page somewhere could explain it. I also don’t think developers and general users of FOSS would be very adept at writing such a specification.</p>
      <p>So, for now I believe the project or idea for the project has moved to Google Groups. If you’re interested, please see <a href="http://groups.google.com/group/altindietypo/" title="http://groups.google.com/group/altindietypo/">http://groups.google.com/group/altindietypo/</a></p>
      <p>Regards.</p>
      <p>—Pascal</p>
