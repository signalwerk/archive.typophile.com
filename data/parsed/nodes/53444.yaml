      <p>Libby, an open-source community isn’t going to produce good fonts. Type isn’t like code. If you see that my code is wrong, it’s great to have you send me a patch and maybe even have a short group email discussion about it. There’s a great deal of black-and-white, right-or-wrong in code. The same doesn’t hold true for type, where design decisions are very subjective. Open-source projects are known for turning into flame wars over simple things like indentation styles or code comments; imagine what happens when half the group decides the Akzidenz revival needs to look more like Futura. </p>
      <p>Communal efforts with no funding are just going to create what the F/OSS world already has plenty of: malformed, disjointed, unfinished fonts that get used to pad out those 10,000 fonts for $4.95 collections.</p>
