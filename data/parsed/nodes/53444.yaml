      <p>I’ve just been informed of a few reqs. for joining the aforementioned Google Group:</p>
      <p>***<br>
      Admission to Alt Indie Typo depends on a few basic requirements.<br>
      Applicants must:</p>
      <ul>
      <li>have made at least three fonts</li>
      <li>demonstrate competence at type design / font production</li>
      <li>provide samples of their typeface designs</li>
      <li>do not submit font files please</li>
      </ul>
      <p>Sorry, but them's the rules.We have to keep this practical and<br>
      maintain a focus on font design and production.</p>
      <p>We have a few members who aren't font makers who will assist with<br>
      logistics and running the group. But no more who are not type<br>
      designers / font makers cannot be accepted at this stage of the<br>
      enterprize.<br>
      ***</p>
      <p>If and when we/I/… decides to launch a project to create a free family I’ll ensure it sits somewhere accessible with access to the font files, discussion lists, probably on a devoted web page.</p>
      <p>Cheers.</p>
      <p>Kaffee und Kuchen</p>
