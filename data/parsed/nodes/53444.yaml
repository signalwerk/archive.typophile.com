      <p>Type design and font production are much more specialized tasks requiring expert contributors. One applicant I had to knock back told me, in his own words, he only wanted to be "a lurker" in Alt Indie Typo. That could only slow us down. It isn't practical to have hangers-on lurking in the group solely to satiate their own curiosity. His use of that word "lurker" made me wonder what his true motive for wanting to be involved was. It's hard not to be circumspect of that word. At any rate, that kind of member would be too distracting.</p>
      <p>Alt Indie Typo progress report --- we already have 7/10ths of our base linear (sans serif) type thoroughly designed. This type will serve as the basis for a text font superfamily.</p>
      <p>j a m e s</p>
