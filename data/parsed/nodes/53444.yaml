    html: |-
      <p>It would be interesting to know more about the contributors to this thread.<br>
      How many of you for example rely entirely on type design for your living or are totally self employed? How many of you are financially secure? etc . I don't really want to know the answers but from my experience of over 40 years I find that self employed designers/craftsmen etc without financial security, can normally understand the attitudes of those with financial security better than the other way round.<br>
      As one who is totally self employed there is nothing I would like to do more than give of my talents freely for the benefit of others, and indeed I have done so on so many occasions. My family suffered as a result but my Bank manager was delighted as he could enjoy the interest on my overdraft. </p>
      <p>Many years ago I was a Chairman of a prestigious  society and I willingly gave my services and help for free and hopefully helped many people. But after 2 years I had to give it up as my freelance work and family suffered badly.<br>
      There is nothing I would like more now than to put my 40 years experience with lettering into font design as I feel I have learnt so much. But can I afford to do so - NO.<br>
      I have no financial security so I have to keep on working to make ends meet.<br>
      This is not meant to be a sob story or an excuse to get the violin out but to ask some of you to grow up and face reality. Not all of us can give our time for free even if our hearts want to.</p>
      <p>If you want the best-pay for it. </p>
      <p>From my long experience  I have come to realize that many of those who expect things for free normally have low standards and lack professionalism and don't really appreciate what is really involved in good design.</p>
      <p>Ieuan Rees</p>
