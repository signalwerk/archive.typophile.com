    html: |-
      <p>There already is a small movement towards collaboration growing, with things like iKern and the like. The only problem with truly open-source typefaces is that, to its designer, a typeface is more than a purely functional tool. Trying to move typefaces into the open-source spirit of collaboration is tricky, for the same reason that an artist doesn't expect people to add more brushstrokes to his painting after he finishes it. While there are certainly technical aspects to type design, it is ultimately much more subjective than coding is. Someone earlier raised the issue of how a type designer would feel if someone suddenly decides that shortening the serifs would look better.</p>
      <p>I dunno, maybe I'm expressing it too simply, but I think that that's the major roadblock preventing type designers from joining the open-source community.</p>
