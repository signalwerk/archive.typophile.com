    <p>Hello all,</p>
    <p>I have recently noticed the lack of professional quality fonts available under open licenses here that are of any professional value.</p>
    <p>Apple and Microsoft may have the money to license typefaces from other groups, or pay to have typefaces developed for them, but a community-built operating system depends on the community to contribute each in their own little way.</p>
    <p>I am looking for any open fonts on a professional level, there are a couple already like Gentium, Bitstream Vera out there, which is a great start.</p>
    <p>Are there any more freely available and freely redistributable fonts you're already aware of?</p>
    <p>I urge all of you who benefit daily from open-source technology (Firefox, Openoffice, even Typophile is hosted on a linux server) to consider contributing some of your work towards the community that has provided you with so much software.</p>
    <p>I am looking to build a package of only the highest quality typefaces under a free licenses and make that available for download on my site related to Linux and Design, but they would be valuable to people on all operating systems.</p>
    <p>Also, the availability of professional alternatives might help even just a couple from pirating or stealing those fonts type designers sell to make a living.  hopefully together we can give the community something valuable, generate more interest in good typography and at the same time help support those commercial designers who rely on font sales.</p>
    <p>And lastly, by releasing one font for free with credit to a group of open-source users who desire fresh new fonts, you can direct traffic to your other reasonably priced fonts and this will more thank likely channel an entire new market of clients that are currently not buying your fonts.</p>
