      <p>Much of the open-source software I use was produced by paid professionals working in universities, corporate research labs, government research labs, etc. In most cases the work was funded by the US government (which taxes me) or various corporations. Even Firefox is programmed primarily by programmers paid by Google (and is built on the old Netscape code), which pays the Mozilla foundation millions of dollars for search results from the search tool. The notion that great open source code is being freely given away by a bunch of generous hackers is largely nonsense; without financial backing of entities who have financial or other interests the code would not exist. </p>
      <p>And like all those paid programmers I have plenty of bills to pay. Going through design school put me in debt up to my neck. I’m not about to give my work away—especially when a global recession is kicking my ass. If the Open Source dorks can’t live without GNU/BSD/CC licensed fonts they need to convince someone with deep pockets to fund the labor.</p>
