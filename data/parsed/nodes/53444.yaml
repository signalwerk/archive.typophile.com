      <p>Interesting how this thread evolved.</p>
      <p>I think, there are different valid points, but the thread lost track do to missing the main idea and the "two sides" speaking not with each other, but against each other.</p>
      <p>It probably was not diplomatic (and actually also *unreasonalbe* to suggest releasing fonts for free. Who would want to give away months of work?</p>
      <p>Also, the arguments saying that fonts don't work like code is true (or not so... see details below), as it's evident that too many cooks will spoil the broth.</p>
      <p>I will, how ever feeble it might be, try to play the interpreter (and why I'll won't take this position permanently, I hope to give this thread a new track. (Yeah, tracking).</p>
      <p>Now, open code actually does not work like anyone changing anything at will. Or open code would not work either. Also, if you do study the OFL (it's not as long and NOT legalese. Go read it: <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=OFL_web" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=OFL_web">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=OFL_web</a>) carefully, you will find that it caters for overseen developement.</p>
      <p>(a) Open does not mean void of copyright! (b) there is the concept of "Reserved Font Name"</p>
      <p>Basically it thus also enables a cooperation style which would not ask for as much as innovati initially did and which also allows for a consistent font style and quality.</p>
      <p>The licence allows users to modify the font, however if they redistribute the modified font they must use a different name. Of course they can resubmit their additional or updated glyphs to the original copyright holder, who then can decide to incorporate them right into the font with the reserved name, or can touch them up and include them then, or not to include.</p>
      <p>This enables a workflow process that will benefit from micro-contributions and maintaining quality.</p>
      <p>A potential use case would be a designer releasing a basic set of ASCII-only character set, e.g. Designers are using them in their work. One needs a non-ASCII character (say, "é"), so creates an é-character for his local copy. Cause he cannot monetize on that single character he has created anyway, he resubmits it to the original author, who might include it in the next official release with little effort.<br>
      If our user created a whole big set (e.g. Cyrillic), 'cause he needed it, he can either decide to resubmitt (and he would be attributed), or he can start a "new" font (i.e. distributing it under a new "reserved name" including the latin and cyrillic, attributing the original author.</p>
      <p>Anyway, the more interesting scenario is the former one, as it operates with micro-contributions, which consume (relatively) little time each, and effort which comes collaterally: which you (potentially) need to do, but cannot monetize on anyway.</p>
      <p>This could be a potential model for Open Fonts. Well, it's exactly how it's supposed to work already, however the movement needs some pro's taking care of the key part assuring quality as the holders of the rights to the "reserved names".</p>
      <p>Now, it probably won't work out, 'cause once any one of us is at that level, he has also a couple of years behind him. Which necessarily reaps a man from idealism and which necessarily makes every man into an egoist ("it does need to hurt me, but by not helping them out, I'll be in a 'better' position by not improving theirs"~~~ whatever-like thinking).</p>
      <p>No, it's just natural. We're all like thet (no exception here). We all become like that with time, and we have to feed our families after all, don't we?</p>
      <p>Go, micro-contributions! [That's how Wikipedia works. Wikipedia sysdevelopers might, but editors are not paid by large corporations [except for those touching up information on world powers' politics and big pages about big companies' products...]].</p>
      <p>/Szabolcs</p>
