      <p>wow.  Based on the interaction I've seen on this site I never would have expected such an averse reaction to the idea.</p>
      <p>I understand that this is what people do for a living, but simply because something is released does not mean it is a free-for-all and subject to derivative works.  What if the fonts are released in a CC-BY-ND licence, your work would be free to use and distribute, and even use commercially, but they would still be required to give you credit at the author, and they would not be allowed to make derivative works based on your typeface.</p>
      <p>As for the big question of what do I get out of it, I think it's pretty clear.  I personally have been using linux since 2001.  I've used Firefox since it was Mozilla Phoenix, then Mozilla Firebird.  All mac users use a proprietary desktop, built on an open-source kernel called Darwin.  Safari is based on the open-source webkit engine, which was based on the khtml engine from the open-source desktop KDE.</p>
      <p>If you've visited 3 websites in your life, chances are 2 of those depended on open-source technologies to be served to you.  If they use Wordpress, Joomla, Drupal or another popular CMS it would also be running open-source software.</p>
      <p>If you've ever been to wikipedia you've benefitted from open content, run on open-source sofware, hosted on open-source servers.  And some of you have personal entries on that site too.</p>
      <p>So, what do <em>you</em> get out of it?  I'd say you've already benefited from open-source in so many ways they could never all be listed.  Although many other groups of people (programmers, artists, musicians, photographers, 3d modelers, etc) have seen the open-source movement and joined in, helping each other out, it has become very clear to me that type designers are a cold, ungrateful group of people.</p>
      <p>It may take a company funding development to get a good typeface designed, but it's shame that it would require that before anybody would consider 'giving'.  Because if you're paid, you aren't giving at all.  Well, I hope you enjoy your fonts all by yourself then, and I expect none of you will use open-source software again (or visit the linux-hosted Typophile) because it's all just trash anyway.</p>
      <p>Are you guys serious with this response?  When a schoolboy comes to your door raising funds for a charity do you tell him to get himself a job and donate his own money?  I can't believe how cold-hearted this thread is.  Khakis-on-Fire is the only one who understood what I was suggesting.</p>
