      <p>@Thomas: <em>I think that on at least one point aszszelp and I are in rather strong agreement: a high quality open source font project involving multiple contributors would need strong leadership and vision to stay on track and maintain that quality. But I suppose that even if the goal is to release something open source, there’s nothing to say that one can’t run the main development line in a less “open” (in the sense of accepting all contributions) fashion.</em></p>
      <p>Thank you Tom for articulating that point so clearly. This is the approach I have taken with Alt Indie Typo. Totally open projects like Wikipedia have massive problems with their user communities. Complete freedom of everyone involved to edit everyone's contributions works for Wikipedia because it's a vast text writing project, but such openness comes with a price attached to it---lots of very stressed-out, frustrated contributors and a massive pseudo-legal arbitration system backed up for six months.</p>
      <p>Type design and font production are much more specialized tasks requiring expert contributors. One applicant I had to knock back told me, in his own words, he only wanted to be "a lurker" in Alt Indie Typo. That could only slow us down. It isn't practical to have hangers-on lurking in the group solely to satiate their own curiosity. His use of that word "lurker" made me wonder what his true motive for wanting to be involved was. It's hard not to be circumspect of that word. At any rate, that kind of member would be too distracting.</p>
      <p>Alt Indie Typo progress report --- we already have 7/10ths of our base linear (sans serif) type thoroughly designed. This type will serve as the basis for a text font superfamily.</p>
      <p>j a m e s</p>
