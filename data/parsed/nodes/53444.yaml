      <p>Given the generally generous spirit of typophilers, I must say that I have been surprised at the backlash against this request. After all, the motto of Typophile is "Typographic Collaboration". </p>
      <p>In response to this bitterness, I would like to highlight how this forum has, indirectly, perhaps already contributed to the requested project. Typophile is a forum in which experienced type designers can share their knowledge both among themselves as well as among less experienced designers. Without the Typophile forum we likely would not be seeing, on the one hand, the quantity or quality of free fonts that are being released these days, nor, on the other hand, the number of people would be in a position to contribute to such a project. So while it might be imprudent to try to design a coherent type system using collaborative strategies similar to those used in the open source community, this forum likely has given knowledge to many people who could participate in a more organized, even modestly funded project. And many of these people would not have the knowledge they do without this forum.</p>
      <p>As a final note, I do not believe that the massive <a class="freelinking external" href="http://mplus-fonts.sourceforge.jp/mplus-outline-fonts/index.html" rel="nofollow">M+</a> type system has been mentioned. Most of the page is in Japanese, but the English portion reads thus:</p>
      <p><cite>These fonts are free softwares.<br>
      Unlimited permission is granted to use, copy, and distribute it, with or without modification, either commercially and noncommercially.<br>
      THESE FONTS ARE PROVIDED "AS IS" WITHOUT WARRANTY. </cite></p>
      <p>Since I can't read Japanese, I don't know if this project was/is funded or not.</p>
