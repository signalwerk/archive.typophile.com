      <p>I am posting this not because I think asking for free stuff is horrid ( we can say no ) or that saying no is horrid ( heavens!) but because I think there is some missing context. </p>
      <p>If people in the font industry didn't fear that bunch of glib cocksure code adjusting unix folk was going to steal it's lunch with @font (and laugh merrily and in a self satisfied way while doing it) the response would have been different. Should the font industry take a different attitude? Maybe. But I suspect that the unanswered questions raised by @font and Håkon Wium Lie's attitude has made a difference. Nobody likes being dragged by the hair into a new business model which BTW may or may not exist. </p>
      <p>As things stand font people ( in general ) don't really think of *nix and open source proselytizers as their pals. Not yet anyway. Maybe that can change. But it will take time patience and thoughtfulness all around. And maybe a grant.</p>
