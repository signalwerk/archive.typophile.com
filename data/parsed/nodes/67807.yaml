    <p>Now available for purchase via <a href="http://www.youworkforthem.com/product.php?sku=T0494" target="new" rel="nofollow">YWFT</a> and <a href="http://new.myfonts.com/fonts/madtype/audebaud/" target="new" rel="nofollow">MyFonts.com</a>.</p>
    <p>Check out <a href="http://www.madtype.com" target="new" rel="nofollow">MADType</a> for more info.</p>
    <p>Audebaud is the first release that contains my new multi-language character set. It covers more languages than Adobe Latin 3.</p>
    <p>I am also in the process of updating all of my previously released fonts with various types of fixes. They will all be OpenType, some with more features than others. You should see them up soon.</p>
