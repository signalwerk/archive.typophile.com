    html: <p>Looks like <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/ronda" rel="nofollow">Ronda ITC</a> to me, Bold weight (possibly still not digitized) using the alternate /K as seen on <a class="freelinking external" href="http://bowfinprintworks.com/BauhausFaces1.html" rel="nofollow">Ronda Light specimen</a> from fellow Typophile Mike Bowfin Printworks Font Identification guide.</p>
