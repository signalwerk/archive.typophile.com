    html: <p>There is a digital version of it, called <strong>Serius SSK (Bold)</strong> (or Serius SSI) but it's from the well known font forgery company Southern Software (Copyright 1993 Southern Software, Inc) so I suppose they steal the outlines from another digital font as usual.</p>
