    votes: null
    html: |-
      <p>Found another version with rounded top M - 1990-1993 FontBank, INC. called Rondalo Regular (possibly source of SSI)</p>
      <p>edit: further research shows FontBank did digitize its products from various printed type specimens.  The most likely source being a old Chartpak transfer lettering catalog which shows both M versions.</p>
