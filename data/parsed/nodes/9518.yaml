  - id: 61010
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>What are the ethics of "sharing" fonts that are not commercially available anywhere - but once were? The Fontographer fonts for example, which I believe you can't buy even if you're a millionaire.  <br> <br>Just asking... it's a shame to lose fonts from circulation.</p>
    html_clean: <p>What are the ethics of "sharing" fonts that are not commercially available anywhere - but once were? The Fontographer fonts for example, which I believe you can't buy even if you're a millionaire.  <br> <br>Just asking... it's a shame to lose fonts from circulation.</p>
  - id: 61011
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>I agree with you about the loss of fonts, and thus I think it becomes a personal judgment about making a good faith effort to see if anyone still holds a copyright to the font before you decide that a design is 'dead' and in need of 'revival'.  In this case NovelFonts was cautious enough to rename all of their fonts, although many, if not all, of them were old designs that were never digitized.  <br> <br>But I guess those statements were really about when you could revive a design. As far as 'sharing', I have always been VERY reluctant to do that, unless I believe the font is no longer commercially available, AND the individual I am 'sharing' it with is someone I know will not be using it commercially or selling/distributing it themselves. It's a slippery slope, so I would rather err on the side of conservativism, and avoid the practice altogether.</p>
