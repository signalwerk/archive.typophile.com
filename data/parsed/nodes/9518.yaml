    html: <p>That's the problem. I cannot find anywhere that still sells these fonts. As far as I know NovelFonts is defunct. I was able to find Powhatten on the web just now, but we do not like to point out sites with dubious wares for download. <br> <br>If anyone knows of a source for NovelFonts, I would love to know about it, so I can tell others who ask about these fonts. I bought my set in 1994 from Tiger Direct as the "Expresiv Fonts Ornate Collection".</p>
