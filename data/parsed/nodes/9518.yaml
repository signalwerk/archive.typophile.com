    html: "<p>Here is a version of Powell done by NovelFonts in 1994 called Powhatten. With added stroke thickness I thinks it's a very good match. Also, for comparison, Packard, which had some similar feeling. (Two of the 5 P's of Antique Type that always make me pause: Pabst, Packard, Parsons, Poor Richard and Powell.) <br> <br>I agree, Pabst is not right. Neither is Poor Richard or Parsons. (Or, clearly, Packard) <br> <br><img src=\"http://www.typophile.com/forums/messages/83/66409.gif\" alt=\"Powell, Packard samples\"></p>"
