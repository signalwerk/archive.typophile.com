    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Cooper Old Style</strong></p>
    <p>Cooper Old Style was designed by <a href="/wiki/Oswald%20Bruce%20Cooper" class="freelinking" rel="nofollow">Oswald Bruce Cooper</a> in 1919. It is the older, but lesser known sibling of <a href="/wiki/Cooper%20Black" class="freelinking" rel="nofollow">Cooper Black</a>. Cooper was a student of  <a href="/wiki/Frederic%20W.%20Goudy" class="freelinking" rel="nofollow">Frederic W. Goudy</a>, and is evident in the very organic forms visible in Cooper's types.</p>
