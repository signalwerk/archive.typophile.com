    <p>Cooper Old Style was designed by <a href="/node/16082/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Oswald Bruce Cooper</a> in 1919. It is the older, but lesser known sibling of <a href="/node/add/wiki?edit%5Btitle%5D=Cooper%20Black" title="Create node &quot;Cooper Black&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Cooper Black</a>. Cooper was a student of  <a href="/node/19481/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Frederic W. Goudy</a>, and is evident in the very organic forms visible in Cooper’s&nbsp;types.</p>
