    html: |-
      <p>Well, support for kerning anyway...as you say on your blog, it's better to have no contextual subs than bad ones, every day.<br>
      In addition, kerning may work fine at the gigantic sizes you're showing, but without sufficient control over rendering, smaller sizes will be screaming the same thing, "no kerning is better than this kerning."</p>
      <p>Cheers!</p>
