      <p>I have <em>seen</em> acronyms set in small caps, primarily in books from the United Kingdom. In the United States, however, this is definitely not standard practice.</p>
      <p>I don't dispute that this makes acronyms look less jarring, compared to the use of ordinary full-sized caps. But because it isn't normal practice, one shouldn't be surprised that some typefaces won't be designed to facilitate this practice - and so the small caps might not be tall enough to work well in the particular special cases outlined.</p>
      <p>Along with mid-caps, another way to avoid capital letters being quite so distracting might be to use a typeface in which the capital letters are somewhat condensed.</p>
