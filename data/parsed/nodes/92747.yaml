      <p>Very good question. I don't know the answer.</p>
      <p>But here are some thoughts: I think it's particularly troubling in combination with oldstyle numbers, where I would expect the size of the small caps to match the x-height of the numerals. Since abbreviations and numbers often go hand in hand — 9:30 PM, 640 BCE — this slight difference in height can look haphazard. It might be a similar situation with NASA's or UFOs — I feel like the slight height difference is noticeable enough to be distracting, but not large enough to seem deliberate. </p>
      <p>I will say, though, that I do not always use small caps for abbreviations. For each individual project I'll choose to use small caps for some or all or none of the following:</p>
      <p>acronyms — UNESCO<br>
      initialisms — PTA<br>
      abbreviations with periods — U.S.A.<br>
      Mixed case — Ph.D. (actually I don't think I would ever used small caps here)<br>
      "All caps" for stylistic purposes — I said, STOP!<br>
      Headings and editorial emphasis<br>
      etc</p>
      <p>And which of these I employ will depend mostly on the feel and aesthetic of the piece, and where it falls on the continuum of literary to journalistic/academic. It also depends on what the small caps look like in the particular font.</p>
      <p>In some contexts, particularly academic, small caps that are not very small may actually be the least obtrusive, as they more closely resemble what the reader expects to see. In more literary contexts, I like them as small as possible.</p>
