      <p>Thinking about this some more, I think there's a better explanation than -what I view as- Modernism's clash with true functionality. An attempt at some cause-and-effect historical analysis:</p>
      <p>Reading has slowly been shifting from an act of reference (where you often look up proper nouns and dates) to an act of entertainment (where you read once, linearly). More significantly, acronyms used to be virtually non-existent, but now they pepper most texts we read. These two phenomena have combined to cause the cap-size requirements of text to shift, but many of the fonts we use predate this, which sets up a conflict between conservatism (which is basically following the rules of a previous generation) and progress (making new rules, which is hard to get right) in the realm of "proper" cap size(s).</p>
      <p>Type designers concerned with the full-caps of "old-fashioned" fonts being too large (and the smallcaps being too small to adequately sub in) make them smaller (and/or make the smallcaps larger) and like-minded type users choose fonts along the same lines. This is not the same as saying that one should avoid full-caps as a rule (certainly not for grammatically capitalized words). It simply means that a good cap size depends on context. I think this is a nice refinement, even though it increases complexity. Just like making the effort of choosing a font beyond Times and company.</p>
      <p>hhp</p>
