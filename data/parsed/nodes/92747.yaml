      <p>Stephen, that the typeface in question has too small small caps, as Frode and you claim, is not <a href="http://twitter.com/typographica/status/199252048296947712" target="_blank" rel="nofollow">"the real problem"</a>:</p>
      <p>1) The typeface's small caps are well sized for book typography, i.e. setting author names in cap plus small caps. Typeface is <a href="#comment-508651" rel="nofollow">FF Celeste</a>. I trust that Dr Burke, as scholar-designer, can design a book typeface. I trust that FontShop only adds quality typefaces to the FF library. Funny that you recommend to <a href="http://twitter.com/typographica/status/199459217009156096" target="_blank" rel="nofollow">"buy new type"</a>.</p>
      <p>2) It is the typographer who chooses and uses a typeface. If the typographer's decisions contradict each other –&nbsp;text having mixed caps/lowercase abbreviation / using small caps / putting mixed abbreviations into the small caps category / using typeface with pretty tall caps&nbsp;– then the sum of these amount to asking for trouble. The typeface's fault?</p>
      <p>Alternatives: Choose type with larger small caps. Use caps at reduced size. Use caps. Choose type with smaller caps, then you do not need small caps for abbreviations (mixed or not). There are many possible problems – and solutions. Some involve relaxing the "use small caps" dictum which leads to ...</p>
      <p>Mr Clark's <a href="http://blog.fawny.org/2010/01/11/goreschoice/" rel="nofollow">blog post</a> is enlightening in that it deals with an education and followership phenomenon by way of a typographic detail: Typographers learn that good typography means adhering to some Bringhurst- or Tschichold-compiled checklist of rules and later continue to adhere to them strictly. (Sometimes not only to make good typography but also to demonstrate that they know what good typography is, or putting it the other way round, in fear to look like an ignorant when not doing so.) I read the post not as being against Bringhurst or Tschichold but against following any one or textbook too strictly.</p>
