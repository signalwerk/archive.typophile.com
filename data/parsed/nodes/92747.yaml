      <p><cite>and scaling up the small caps a bit as a make-do (116% vertically, 108% horizontally). </cite></p>
      <p>Yes, we use non-proportional scaling to get good (i.e., effective) small caps run into text a fair bit. The problems with doing this in InDesign are two. The first is you can't scale up a letter without also changing it's weight. To my eye, 107% is about as far as you can go. Obviously, it depends on the letter and the font. Since we do this globally as a part of a character style for run-in small caps, "depending on the letter" drops out -- they're all affected.</p>
      <p>The second one is a bit more subtle: If there is any kerning, it will be blocked between a scaled and unscaled letter. For example, if you have a scaled-up small cap D and a program kern between D.sc and quoteright, that kerning will be blocked. IIRC, you *can* put it in by hand...</p>
      <p>It is for such reasons I like to make the changes to the characters in the font rather than in the applications program. Done in the font,  the weight increase can be adjusted, and kerning will remain programmatic. BTW, I have absolutely no problem with a non-proportional scaling of the small caps, depending on how they were originally drawn.</p>
    html_clean: |-
