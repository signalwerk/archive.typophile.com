      <p>Jeeze. This one again. I can think of 1000s of examples where the use of small caps in place of full caps looks awkward. Give me $5.00 each &amp; I'll list them &amp; be able to retire. Old favorites: MoMA. GMbH. The G.I. Bill.  </p>
      <p>As you've poionted out, any short abbreviation that is part of a word pair where one of the words is a capped proper noun with the rest lower cased  letters, (DIA Inc, the G.I. Bill, etc.) Or, any mixed upper &amp; lower case abbreviation/acronym with  c, o, s, u, v, or w in them. Or, any  mixed upper &amp;  lower case abbreviation/acronym with a lower-case letter that has an ascender, or even a descender.</p>
      <p>Here's the deal. No matter what you do, there will be situations where either choice will look awkward. You have to make a choice which awkwardness to accept. The absolute wrong thing to do is to blindly follow a rule that doesn't have general acceptance, or appeal to an authority (particularly a disputed one) who represents about 5% of the audience.</p>
      <p>How about this. Set a longish text and change all the naturally occurring full caps to small caps. Take a look, do you like it? I'd guess there is a certain percentage of people who would say "yes." What can one say to them? Recommend they take up one of the CJK languages?</p>
