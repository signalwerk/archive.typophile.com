      <p>Thanks for all the feedback. Who needs Bringhurst when you have Typophile! (Kidding; Bringhurst doesn't really address the issue specifically in Elements, therefore the reason for this thread.)</p>
      <p>The font is Celeste Pro, so it is certainly no slouch typeface. Its small caps are larger than x-height, though only slightly. Most of the time I really appreciate the subtle qualities of its small caps. It is only rarely (&lt;1/year) that I run into an issue like this, but I've seen it for a few years running now, so I thought I'd ask. The project currently is a newsletter, though I've run into the issue with Annual Reports as well.</p>
      <p>I ended up setting "DIA" in small caps, leaving "Inc." capitalized, and scaling up the small caps a bit as a make-do (116% vertically, 108% horizontally). I know it deforms the characters a bit, but I don't have the budget nor time to add a proper 3/4 cap to the font (not to mention getting permission). </p>
      <p>Scaling the full caps down to 3/4 caps proportions and setting "DIA" in full caps at a smaller size both left the characters a bit too thin. Scaling small caps up left them a little dark, but much less noticeable than a reduced full cap, which is too light. This also lets me make the change consistent across the document.</p>
