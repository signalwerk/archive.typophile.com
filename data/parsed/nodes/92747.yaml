    html: <p>These issues might be caused by poorly designed (usually too small) small caps. They should be less intruding, yes, but when they look plain wrong with a genetive s or if you introduce a capitalised word in the sentence it's nothing but bad design.Some type designers introduce mid caps (3/4 height) as a solution. I do see the relevance of just-above-x small caps in book design, but once you embark on more editorial stuff they're rarely useful.</p>
