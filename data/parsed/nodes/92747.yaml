    <p>A house style of which I try to adhere is to set capitalized abbreviations and acronyms, in a running paragraph of text, as small caps. It's a convention that I am quite happy with, as setting them in full size caps makes them really jump off the page. I have run into two problems with this:</p>
    <ol>
    <li>How to set an acronym/abbreviation which falls at the beginning of a sentence. ("NASA plans to launch another shuttle in 2020.") For these instances, I will usually set the first letter as a full cap with the rest as small caps. This seems pretty satisfactory, but I wonder how others handle the same situation.</li>
    <li>How to set a mixed acronym/abbreviation in the middle of a sentence. ("Under this agreement, DIA Inc. has complete...") This issue is really causing me some grief this morning. "DIA" and "Inc." both appear at other places in the paragraph—mere lines away, but not previously paired—so their settings should be consistent throughout the document. I have tried the following settings in the attached image, none of which has seemed satisfactory:
    <ul>
    <li>Top: <em>DIA Inc.</em> set with full caps</li>
    <li>Center: <em>DIA I</em> set in small caps, <em>nc.</em> set in minscule</li>
    <li>Bottom: <em>DIA</em> set in small caps, <em>Inc.</em> set in mixed caps</li>
    </ul>
    </li>
    </ol>
    <p>I am not sure if these settings just look odd to me because they are unfamiliar due to the rare pairing of acronyms and abbreviations, or if there might be a setting which is more natural.</p>
