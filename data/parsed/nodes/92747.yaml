      <p>I agree that <em>any</em> caps that are not visibly taller than the x-height are wrong. Just because it's a tradition does not make it a good idea.</p>
      <blockquote><p>setting them in full size caps makes them really jump off the page.</p></blockquote>
      <p>Depends on the font of course. For something like a novel it's better to use a font with modest caps. It's mostly in reference books (where you have to scan for a proper noun or a date*) that large caps are more effective, and in those cases it's useful to have midcaps for extreme cases, like acronyms of three -or maybe four- letters or more - you probably never want to set "FYROM" in full-size caps.  :-)</p>
      <p>* Where additionally the numerals should be cap-height (or at least large).</p>
      <p>There was a recent thread strongly related to this. But lately even Google can't seem to crack Typophile...</p>
      <p>hhp</p>
