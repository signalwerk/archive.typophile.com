      <p>I agree totally with most of what you wrote, especially with the need to put each person's personal objectives in context. Please see my second comment here:<br>
      <a href="http://www.flickr.com/photos/56183109@N02/6964823544/in/photostream/" title="http://www.flickr.com/photos/56183109@N02/6964823544/in/photostream/">http://www.flickr.com/photos/56183109@N02/6964823544/in/photostream/</a></p>
      <p>However I see a great many advantages to doing a critique in public, not least that it's dangerous to rely on too few people; and sometimes the best feedback will come from a totally unexpected, unsolicited source. And if a person is too sensitive to criticism, that's his loss. Survival of the fittest! It's also relevant how useful a critique (or really any discussion) is for the person doing it: it forces him to think more clearly, and quite often he learns something himself! And this is amplified when it has do be done in public.</p>
      <p>hhp</p>
