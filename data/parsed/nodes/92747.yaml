    votes: null
    html: <p>Of course, based on my conception of type there are things that others do that I don't appreciate and things that I did that I would not do again. But first of all I want to understand why things were made the way they were made, be it a piece of design or a text or anything else. Something that appears wrong at first glance may make perfect sense after considering it a bit and putting it in context of the problem it was made to solve. (I got into type because I found it illogical that, in Times, x-height serifs of n vs v started at different height and set out to "correct" that. I prefer to not comment any further on my former self.) That does not mean that everything is right, though ... Discussing work is necessary but, I think, more fruitful when done in private. It allows both sides to be frank, without one side looking like a fool and the other like the expert coming to the rescue. It also allows discussing both sides' conceptions, the critic needs to know the conception on which the work is based if he wants to offer more than an opinion, the one criticised in turn needs to know the critic's conception to make sense of and evaluate the criticism. Unless one of them is an absolute beginner, any clear-cut right/wrong is likely to disappear in the course of this discussion.</p>
