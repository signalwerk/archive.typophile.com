      <p>You are a bit quick with your judgement "it's nothing but bad design", especially when what you criticise is standard practice and there are good reasons for doing so, as you indicate right in the next sentence "I do see the relevance of just-above-x small caps in book design". After all, this is a special case.</p>
      <p>Maybe in this case set "DIA" in uppercase but at slightly smaller size, if it stands out a little then be it so. Or, if the author/editor allows and unless "DIA Inc." is the official abbreviation, omit the "Inc." from the abbreviation and use small caps as you would do with NASA.</p>
      <p>(Wasn't there an earlier discussion on this with quite good suggestions? Cannot find it.)</p>
