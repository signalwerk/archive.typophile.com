      <p>Good historical perspective Hrant.</p>
      <p>I would add that when words (not acronyms) were set in small caps, they were letterspaced (the traditional precept of all cap setting), in which situation having them lower case x-height was actually preferable to taller. Similarly, old style ﬁgures, tabular of course, were very open in ﬁt.</p>
      <p>Now, text is much more tightly ﬁtted—kerned, ragged, and with word- and letter-space justiﬁcation, and word spaces are smaller. In these circumstances, that spacious treatment of ﬁgures and x-height small caps is out of place.</p>
