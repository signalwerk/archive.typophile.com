    html: |-
      <p>Reasons to like the current logo:</p>
      <ol>
      <li>Boxy appearance makes it work very effectively if you think of "text as user interface", i.e., a call to action button. In fact, I would say that Digg does a poor job of capitalizing on that fact by NOT using the logo on the myriad "Digg this" buttons on the interwebs.</li>
      <li>There are no shadows, gradients, reflections, swooshes, spheres, whitsits or whatsits</li>
      <li>The logo reproduces well on ALL mediums, works as a single color, and works positive or reversed</li>
      <li>The overt technical connotations of the bitmap-esque letterforms are appropriate to the concept of "repository of web resources"</li>
      </ol>
      <p>What they should replace is that stupid icon of the dude with a shovel, which is barely recognizable even at large scale.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/about-diggguy_5406.gif"></div><p></p>
