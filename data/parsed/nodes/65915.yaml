    <p><strong>This week's battle: Design a new logotype for digg. (<a href="http://www.digg.com">digg.com</a>)</strong></p>
    <p>Let's show our friends over at <a href="http://www.digg.com">digg</a> what a logotype could look like when designed by typography experts.</p>
    <p>Winner take all, no holds barred. May the best designer win.</p>
    <p>// REQUIREMENTS</p>
    <p>- Solution must be typographic and contain the letters "digg" in lowercase.<br>
    - Letters must be custom drawn. No use of existing fonts!<br>
    - Image size: 550 width x 400 height. 72 dpi*<br>
    - Color: Black and White<br>
    - Format: PNG, GIF or JPG (Preferred in that order. Mmake sure there are no spaces in the name)</p>
    <p>*Please try to keep your file sizes to a minimum! 50k per file max.</p>
    <p>// ABOUT TYPOPHILE TYPE BATTLES</p>
    <p>This is your chance to flex your type muscles on a weekly basis. You have one week to create and submit your entry. Anyone may submit a design response to the challenge. You may enter as often as you wish. Post anytime. Critiques and comments are welcome throughout the game, from participants and spectators alike. Smack talk is encouraged.</p>
    <p>As with any street battle, there is no panel of judges and no prize — only the ability to call yourself the best on the block.</p>
    <p>Link directly to this battle: <a href="http://www.typophile.com/battle39">http://www.typophile.com/battle39</a><br>
    Link to the battle directory: <a href="http://www.typophile.com/typebattles">http://www.typophile.com/typebattles</a></p>
