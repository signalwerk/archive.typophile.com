    html: |-
      <p>Tallys must be regarded more as an experiment. It's quite quirky but I think it has a certain charm. I myself wouldn't use it as a text face.</p>
      <p>A few months ago I recieved <a class="freelinking external" href="http://www.masterkeysystem.de" rel="nofollow">this book</a> which was completely set in Fontin &amp; Fontin Sans. They work very well as text faces. On the same site I found a <a class="freelinking external" href="http://www.masterkeysystem.de/pdf/Das%20Master%20Key%20System%20-%20Leseprobe.pdf" rel="nofollow">pdf</a> sample of Fontin in use (it's not a pdf of the book unfortunately) and also some screens (<a class="freelinking external" href="http://www.masterkeysystem.de/downloads/wp/1024/Gedanke%20ist%20Ursache.jpg" rel="nofollow">here's one</a>) of Fontin Sans SC in use.</p>
      <p><cite>Jos is a crazy Tausendsassa. ;°)</cite><br>
      Had to wiki that, but that's a lot of credit :-)</p>
      <p><cite>Fontin looks like it could be a rare exception. I’ll try to give it a decent test soon.</cite><br>
      Please do and keep me/us posted (if it's ok with Erik, because it's a bit off topic).</p>
