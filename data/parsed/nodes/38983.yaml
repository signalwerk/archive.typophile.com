    date: 2007-11-17T14:23:00
    votes: null
    html: |-
      <p>Lack of italic, small caps and bold is certainly an issue, but to me Tallys looks less quirky at text sizes than Fontin. That's not to say I don't like Fontin, but if I had to choose one or the other for extended text, I'd go with Tallys.</p>
      <p>Anyway, many thanks to Jos for offering such fine typefaces for free.</p>
