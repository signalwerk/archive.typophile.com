      <p><cite>none of these have true italics, small caps, or even a proper bold</cite></p>
      <p>What about <a href="http://www.josbuivenga.demon.nl/fontinsans.html" rel="nofollow">Fontin Sans</a>? It has all of these. Well, it’s a sans, but a) one of those that might work quite well as text face (though I haven’t tested it myself) and b) <a href="http://exljbris.wordpress.com/2007/03/10/fontin-serif/" rel="nofollow">Fontin Serif</a> will follow someday (not to confuse with the hybrid <a href="http://www.josbuivenga.demon.nl/fontin.html" rel="nofollow">Fontin</a>).<br>
      Jos is a crazy Tausendsassa. ;°)</p>
