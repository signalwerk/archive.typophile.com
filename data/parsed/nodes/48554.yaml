    html: |-
      <p>Although it is close, I dont think it is Cachet.  For starters, the dot of the "i" is round, and Cachet's is squared.  overall, this font is more rounded than Cachet, especially evident when you compare the lowercase e.</p>
      <p>For reference, here is the same sample in Cachet.</p>
      <p><img src="/sites/default/files/old-images/Picture4_6663.jpg"></p>
      <p>Unfortunately, I dont know what face it is, but I'm sure someone else will.</p>
