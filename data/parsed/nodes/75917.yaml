    <p>Looking for the ID of this curly display font used for the lettering of Jacques Tati’s “Maison de Jour de Fête” movie.</p>
    <p><a href="http://www.maisondejourdefete.fr/" title="http://www.maisondejourdefete.fr/">http://www.maisondejourdefete.fr/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/maison_3652.png"></div><p></p>
    <p>It’s definitely a digital font, not hand lettered, because of the identical glyph shapes and use for the lettering of the (digitally remastered) movie trailer.</p>
    <p>No succes at MyFonts’ “What the Font”.</p>
    <p>It looks like <a href="http://new.myfonts.com/fonts/pizzadude/vegacute/" rel="nofollow">Vegacute</a>, but isn’t.</p>
