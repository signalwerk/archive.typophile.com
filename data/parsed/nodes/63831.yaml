    <p>I hate to bring this up, but it has always bothered me about Typophile:</p>
    <p>Quotations are the backbone of discussion, but two positively mundane HTML elements, <code>&lt;q&gt;</code> and <code>&lt;blockquote&gt;</code>, are disallowed?</p>
    <p>Because of this, the poor <code>&lt;cite&gt;</code> element is used and abused, although it is <em>not</em> the most appropriate markup for quotations.</p>
    <p>According to the W3C, "<code>&lt;cite&gt;</code>" is markup for text which "contains a citation or a reference to other sources."  (<cite><a class="freelinking external" href="http://www.w3.org/TR/html401/struct/text.html#edef-CITEM" rel="nofollow">HTML 4.01 Specification § 9.2.1 Phrase elements</a></cite>)</p>
    <p>Allowing <code>&lt;cite&gt;</code> is fine, even giving it a little semantic wiggle room, but not allowing <code>&lt;q&gt;</code> or <code>&lt;blockquote&gt;</code> is just plain silly.</p>
    <p>Given that this is a forum <em>for</em> discussion, shouldn't the proper markup be allowed?</p>
