      <p>Do you mean it's base on a 14ppm pixel grid? a pixel grid can't be point based, since the pixel grid is determined using the point size in relation to the device resolution. (i.e, at 72ppi, 14point=14ppm, but at 96ppi, 14point = 19ppm)</p>
      <p>Could you list the ppm sizes displayed in the gif image for reference?<br>
       interesting work!</p>
      <p>Jason C</p>
