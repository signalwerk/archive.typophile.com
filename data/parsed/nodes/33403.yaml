      <p>Very nice design so far.  I think it's quite readable---the idea of basing it off a grid is quite clever.  Adding some basic Postscript-style hints would make the stems cripser at sizes other than 14pt.  Of course, your sample makes it look like you don't need it, but since auto-generating such hints is pretty painless, it's worth trying it.</p>
      <p>I would suggest posting a pdf file.  How much of the design is tuned to the Mac rendering model?</p>
      <p>The s looks like it's falling backward ever so slightly.</p>
      <p>In your anobe picture, what are the blue letters?</p>
