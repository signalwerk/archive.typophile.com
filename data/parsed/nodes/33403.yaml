      <p>If it's optimized for 14ppem why are the stems not crisp or consistent<br>
      (look at an "em") and why is there any subpixel action going on?</p>
      <p>BTW, a pixelfont (even in the looser sense of the term where the outlines are<br>
      intended to look decent in print) shouldn't have any talus (internal leading).<br>
      In your 14 point sample the ascender-descender span is 13 pixels.</p>
      <p>Something's not exactly snapping into place.</p>
      <p>hhp</p>
