      <p>for the line height, look at the values of the OS2&gt;WinAscent and OS2&gt;WinDescent, and also hhea&gt;ascender and hhea&gt;descender. One or more of these values may be set too small. Depending on the app you're using,  the value in OS2&gt;sTypoLinegap may need to be adjusted also. </p>
      <p>Another question though, (and I might be way off on this one...) If OSX  uses oversampling to generate graymaps for the screen, then drawing on a 14pixel grid might not work exactly, correct? I'd imaging there may be cases where the larger oversample size rounds differently then the base 14pixel grid drawing? I am thinking this might be why you're seeing some of the strangeness that Hrant mentioned. As I said, I might be wrong about that, I certainly haven't tested it myself. </p>
      <p>Jason C</p>
    html_clean: |-
