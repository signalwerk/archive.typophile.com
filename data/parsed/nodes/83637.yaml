  html: |-
    <p>Appeared in SF Chronicle on Thursday re: Ted Bundy (a serial killer)<br>
    I'm no English major but was appalled at the use of the word ‘famous’. I suspect 'infamous' would have been too long for the column width but other choices could have been made. Am I wrong to be critical?</p>
    <p>Does the layout accommodate the size of the article or the other way around?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sfchron_4031.jpg"></div><p></p>
