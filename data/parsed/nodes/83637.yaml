      <p><cite>Does the layout accommodate the size of the article or the other way around?</cite></p>
      <p>Both. The layout was designed to accommodate articles typical of the paper; headlines and photos get tweaked to work within the layouts. In the editorial world content and design are not really so separate.</p>
