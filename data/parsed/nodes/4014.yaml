  html: <p>Hey! <br> <br>I just got an idea the other day about making some own type speciments for my favourite typefaces and then make SRA3-posters to frame and put up on my wall. I just finished the second one (Minion Pro) and I would like to get some critique on my work. <br> <br>I will create at least one more but I'm still deciding on what more typefaces I want to pay homage to. <br> <br><a href="http://www.joacim.net/forum/gillsans_speciment.gif">001. Gill Sans</a> <br><a href="http://www.joacim.net/forum/minion_speciment.gif">002. Minion Pro</a> <br> <br>Best regards, <br>Joacim W</p>
