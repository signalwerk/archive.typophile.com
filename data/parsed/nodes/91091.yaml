    html: |-
      <p><em>I can't see it puzzling the Dutch reader any more than an st ligature puzzles an English reader.</em></p>
      <p>The Quaint ligatures st and ct do puzzle English readers, not in the sense of perplexing as to what characters they represent, but as to why such an affectation should have been used to frequently interrupt text.</p>
      <p><em>…there are some super-funky "ij"s in the Netherlands, </em></p>
      <p>But surely they are in type and lettering (especially scripts) that has a general funkiness, which this style doesn’t appear to.</p>
      <p>It’s my opinion that for this particular typeface, an ij ligature would seem unwarranted and out of place to a Dutch reader.<br>
      But if the face also has some other quaints and oddities, maybe it would fit in.</p>
      <p>At any rate, it could be a discretionary ligature, but if you make it default it would be sure to annoy typographers (and their clients) who might like the face but don’t think quaints are quite right for the job in hand.</p>
