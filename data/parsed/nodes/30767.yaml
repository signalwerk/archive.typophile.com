    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Morten Olsen</strong></p>
    <p>Morten Rostgaard Olsen (1964) is a graphic designer and type architect, living and working in Copenhagen. After five years studing at The Danish School of Art and Design, he now runs a supplies solutions for corporate design and typefaces as well as teaching and consulting. Among his clients at home and abroad is The Ministry of Education in Copenhagen, the first user of his typeface <a href="/wiki/FF%20Olsen" class="freelinking" rel="nofollow">FF Olsen</a>. Morten is a member of The Association of Danish Designers MDD.</p>
    <p>His most well-known typeface is <a href="/wiki/FF%20Max" class="freelinking" rel="nofollow">FF Max</a>.</p>
    <p>Olsen and <a href="/wiki/Ole%20S%C3%B8ndergaard" class="freelinking" rel="nofollow">Ole Søndergaard</a> created Danish type design studio <a href="/wiki/Fontpartners" class="freelinking" rel="nofollow">Fontpartners</a> in 2006.</p>
