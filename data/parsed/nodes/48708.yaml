      <p>Various European modernists were convinced that certain sans-serif styles represented the culture of industrialized twentieth-century nations. The Nazis tried to establish blackletter designs as the national face of Germany (but weren’t especially consistent about it. Neither group ever really settled on any particular face, although the Swiss modernists did narrow things down to Akzidenz/Univers/Helvetica. And I don’t think that either one was especially successful at trying to reflect their culture with those styles. </p>
      <p>Consider your own situation: how does one typeface reconcile traditionalist Maori, white New Zealanders, and the Maori that live in-between the two? </p>
      <p>You should probably read Tschichold’s writing about sans type in <em>The New Typography</em> and his later attacks on modernist monoculture (some appear in the appendices of Ruari McLean’s books about Tschichold.).</p>
