      <p>Lindsay, this is a stupid project.<br>
      If the agenda is diversity and empowerment, just cut to the chase and get more ethnic variety in design schools, and get more agencies and publishers using Kiwi designers and Kiwi-designed typefaces. Mount a campaign against Adobe, Microsoft, and Apple fonts, not to mention Helvetica and all the rest of that old Euro stuff. And good luck with that.</p>
      <p>If you get distracted by overt ethnic signifiers, such as those that appear in some of Joseph Churchward’s faces, you will get embroiled in touchy debates over authenticity and appropriation. That kind of face lacks range and is marginal at best, so tying your agenda to its cute banality will fail to address the mainstream of typography.</p>
      <p>To move forward, you will have to overcome internationalism at home, and rise on the international stage.<br>
      For instance, the <em>Sunday Star Times</em> (in which the article on Kris appeared) was designed by foreigners, using foreign typefaces. That’s a frequent occurence in the newspaper business, everywhere.<br>
      But then, when New Zealand publishers have been persuaded that using their own art directors and designers, and Sowersby fonts, won’t put them out of business, the question is, how much do his faces reflect or express local culture, and how much are they the product of an international type culture? It’s irrelevant. More important, if you want to help your own culture express its individuality, support “indie” foundries everywhere, and in particular,</p><div class="imageWrap"><img src="/web/20081122060925im_/http://www.typophile.com/files/button_4298.png"></div><p></p>
