      <p>I know little of New Zealand, and its multiple cultures.</p>
      <p>I know that Arabic and Urdu are very similar technically except for a handful of characters unique to Urdu.</p>
      <p>For this many non-Arab designers, and Arabic-specific designers too, created a very unsuccessful group of Urdu fonts. Although they were technically correct, many Persian customers complained. “When will true Urdu fonts become available reflecting Persian culture?”</p>
      <p>I was surprized. I was told repeatedly that there is a sttylistic difference between Arabic and Urdu, reflecting not only in art, music, architecture, food, clothes, even in accent in speaking, choice of words, and of course language.</p>
      <p>I saw that Urdu and other languages needed a lot of cultural reseach to produce successful type designs.</p>
