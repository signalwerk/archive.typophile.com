    <p>Hi everyone</p>
    <p>I’m new to this and unsure of how to explain what my question to you all is but i will try below and hopefully it not to long winded.</p>
    <p>I am a forth year student working on my major project which revoles around the question, can many different cultures be reflected in a display typeface. Specifically in relation to New Zealand which is where i live, can the cultural diversity which contributes to New Zealands identity be expressed in a display typeface?</p>
    <p>Does Anyone know of typefaces that were designed with a similar intent? Are there typefaces that were intended to reflect the cultural masses and were succeful or failed?</p>
    <p>i dont know if i explained that very well but i would love some feedback.<br>
    Cheers</p>
