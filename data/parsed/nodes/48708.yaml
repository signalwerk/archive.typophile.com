      <p><em>The Nazis tried to establish blackletter designs as the national face of Germany</em></p>
      <p>They might have done so for some time, but eventually (they were very forward thinking) they figured that as soon as they would have conquered the world (!) they would want everybody (!) to be able to read their orders. Since most of the world wasn’t familiar with blackletter they switched to roman.</p>
