    html: <p>It occurred to me that this line of thinking would be far more interesting/worthwhile if you twist it around to “What makes typefaces relevant in the first place?” For example, why the hell won’t Helvetica go away? Why is Times New Roman, an aging newspaper face, being used for everything from office documents to books? Why is Franklin Gothic so popular all of a sudden? Why do foreign newspaper designers consider foreign typefaces relevant to New Zealanders? Would typefaces by a New Zealander really be any more relevant? Is Bringhurst full of shit when he claims that historically linking type to content is a good idea, given that most people would believe Didot was created the indian slave who did the punchcutting on board the Pinta’s return journey to Spain (or at least I suspect they would believe it given how little most people know about type)?</p>
