      <p>@eliason: If I recall correctly from my reading of Metro Letters, sorry for the vagueness, this was a while ago, a participant claimed that the idea of designing a typeface for a ’city’ was perhaps a silly endeavour, that it could not encapsulate the values of a place or culture but rather that it would complement it.</p>
      <p>In an obvious manner you see the wide variety of ’Oriental’ or ’Mexican’ typefaces that are probably more representative of the Western appropriator than the culture it is attempting to resemble. That reversal might make for an interesting project as well:</p>
