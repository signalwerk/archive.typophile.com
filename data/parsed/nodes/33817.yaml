    <div class="info">Submitted by <a href="/user/18613" title="View user profile.">JamesKing</a> : 15.May.2007 3.04pm </div>
      <p>The St Bride printing library is holding a fundraiser and after party for its 6th annual conference: <em>Great British Design?</em>. Everyone is welcome and all money raised will help to keep the library running. Details are below and you can keep informed about the event <a href="http://upcoming.yahoo.com/event/191801/">here</a>. Please come along and spread the word!</p>
    <p>When:<br>
    Friday, June 1, 2007,<br>
    from 6:00 PM</p>
    <p>Where:<br>
    St Bride Institute<br>
    Bride Lane, Fleet Street<br>
    London, England EC4Y 8EQ</p>
    <p></p><div class="imageWrap"><img src="/files/typeaid_5958.gif"></div><p></p>
    <p><strong>Type Aid</strong></p>
    <p>Raising money for St Bride’s – The world’s foremost printing and graphic arts library</p>
    <p>Featuring:<br>
    Dave Farey’s typographic pub quiz (starts at 7pm)<br>
    (Team and individual prizes including unlocked Monotype and Linotype CDs)</p>
    <p>Visuals by the guest speakers and YOU<br>
    (to display your work email <a href="mailto:type.aid@gmail.com">type.aid@gmail.com</a> for info)</p>
    <p>£6 entry includes 3 free drinks and quiz entry (then drinks for donations)<br>
    Free entry for conference ticket-holders</p>
