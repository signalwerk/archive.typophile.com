    <p>Hello!</p>
    <p>Every year I push a design challenge on myself about myself. I love redoing my personal logo, especially because I'm just a student designer and my "personal" brand is still being built upon. My initials are D, L, and S, and I've always had a problem piecing them together based on the shapes and high x-height of the L in comparison to the bowls of the D and S. Recently, I've been very interested in geometric monograms and especially how the specific letters--triangles for D's and L's, and a swirl for the S--could overlap to become my personal logo and being slightly legible while really deriving from the letters as opposed to clearly showing them.</p>
    <p>These are the product of a late-night brainstorming process. Any thoughts?</p>
    <p><img src="http://typophile.com/files/Logo 1.png" width="200" height="534"></p>
    <p>Best,<br>
    David</p>
