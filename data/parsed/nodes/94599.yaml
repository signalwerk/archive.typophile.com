      <p>I like it. I'm also seeing the nice degree of ambiguity you say you want.</p>
      <p>Two things:<br>
      - The top right seems too long. You might consider gently deviating from your "lattice grid" to reduce (if not eliminate) that effect, although you'll have to mind the gaps so they all look equally thin.<br>
      - Speaking of the gaps, you'll need a different version of this -with thicker gaps- for small/lo-res instances.</p>
      <p>hhp</p>
