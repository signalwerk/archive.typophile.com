      <p>Well, David—</p>
      <p>The top version has a lot more visual interest overall but, to my eye, neither one makes DLS very clear.</p>
      <p>If you are selling your creative skills, don't sweat it. If you are trying to promote yourself as a creative communicator, you probably ought to pursue a less visually ambiguous approach. Sometimes, less is actually more.</p>
      <p>In my humble opinion, for what it's worth.</p>
