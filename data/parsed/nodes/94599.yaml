      <p>Thank you for the feedback! And hrant, it looks like it now that you've said it, haha!</p>
      <p>After a hundred more iterations, I found another way to communicate my initials and sort of develop and interesting, ambiguous monogram (in a way).  This logo is one that I really liked after many attempts at changing the length of the lines and the way they intersected; it seemed like this one was the most visually interesting. Any ideas about it? Edits? Comments? But sometimes the just black was making me board--or maybe it's just because I've been looking at it for so long. I'm curious as to how I should present it, so I've tried pretty quickly a few different ways and would love to hear your thoughts on the logo itself and the treatment of it.</p>
      <p><img src="http://typophile.com/files/Treatments_5205.png" width="346"></p>
