      <p>Patty had the right idea with a search for "latin" fonts. These all have a pointed wedge serif. Here are <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=latin" rel="nofollow">Latin fonts</a> at FontShop.</p>
      <p>Where will it be used? Text or headlines? Do you need various weights and widths? Italic? There isn't a more complete latin family than Matrix.</p>
