  html: |-
    <p>A year ago I read about a font that truncated the spelling of words to mimic the abbreviated spelling that you often find in text messages and instant messaging. For example, this font would truncate "Vancouver" to "Vncvr".</p>
    <p>What was this font?</p>
    <p>Was it a Spiekermann design?</p>
