      <p>Hello All,</p>
      <p>I'm having a problem with my Font.... after generating it and using programs (flash, word) to write with it, I see that the tops of the taller letters as well as the bottoms of some letters with "tails" are cut off...... what could possible be the problem?<br>
      By the way - the point hight areas that the metrics window shows are 720 and -250.... if I go as tall as 840 for the ascender height could that be the reason ? I thought so but then it wouldn't explain the bottoms getting cut off as well.... </p>
