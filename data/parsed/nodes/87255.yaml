    html: |-
      <p>Hello Stephen, Glad you solve the trouble you found with neighbors, that's exactly what happen there.</p>
      <p>Hi Asceder, According that I know if you choose  the able area must to be 1000 pt from descender to ascender, you can combine values equivalent between boths (for Example you can set ascender heigh 750 + descender heigh must to be -250 = then you obtain a total 1000 pt). Any shape must to be inside of this boundaries, if you out this area, at least in word your font will be cropped out. I don't know exactly why this happen but you can avoid that trouble keeping that 1000 pts.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_4115.jpg"></div><br>
      File/Font Info<br>
      Ctrl (or comand) + Alt + F<p></p>
