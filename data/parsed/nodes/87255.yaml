    <p>Just ran into a very strange thing where FontLab kind of went nuts on me. I was drawing outlines in FL for a few glyphs in one glyph window. Not sure exactly what triggered it, maybe merging outlines on a glyph. Anyway… all of a sudden I have what look to be random composite glyphs in my window. I can't select them to delete them. If I click on a composite I'm brought to another random glyph cell. They all appear to have composites in them. I can't even figure if there are any patterns to which composites have shown up in which cells. </p>
    <p>When it first started I immediately quit FontLab hoping I could get rid of the glitch. Didn't help. Any ideas what to do? My first thought since I only have Upper and Lowercase and a handful of alternates so far is to just start a new FL data file and Paste Special only the outlines into the new file.  If any one has any ideas I would be very appreciative. Seems like the file is completely corrupt at this point.</p>
    <p>Stephen</p>
