    <p>Hello all,</p>
    <p>I'm trying to access the following Resources on Typophile:</p>
    <p>"Typography 101"<br>
    An interactive course on Type Styles, by Jonathan Hoefler.</p>
    <p>"Typography 110"<br>
    An interactive course on Type Design, by Jonathan Hoefler.</p>
    <p>I initially thought that the reason I couldn't access these pages was because I didn't have an account.  So, I signed up, then logged on, and I still can't get to these pages.  Comments/suggestions concerning this matter would be appreciated.</p>
    <p>Thanks,<br>
    Joe Konior</p>
