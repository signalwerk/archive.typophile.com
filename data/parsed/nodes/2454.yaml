    html: |-
      <p><i>That Adobe name list has multiple names per codepoint for some characters. Like periodcentered/middot for 00B7 and overscore/macron for 00AF. Do you just choose any of the names? </i> <br> <br>This is a novelty of version 2.0 of the AGL. Previous versions had only Adobe's own glyph names, but version 2.0 includes names that have been used by other major developers, e.g. Apple, which Adobe software using AGL 2.0 will recognise. It is important to remember that the AGL does not primarily exist for the purpose of font developers, but for software developers who need to parse glyph names to obtain character codes. <br> <br>So yes, you can choose any of the names in the AGL, but for maximum exchangeability with other font developers I recommend using Adobe's original names from the previous AGL versions. Here is one of the Tiro resource files which you and others might find useful: a FontLab .nam file that covers all the Basic Multilingual Place assignments for Unicode 4.0. Unzip and open the .nam in a text editor and read the lengthy comments at the top to understand what the file contains. <br> <br><!--attachment: tiro_Unicode4_0_BMP_withAFII-22786.zip*mime_zip.gif*application/x-zip-compressed*175.4*Tiro+AGL+name+mapping*tiro_Unicode4%2e0_BMP_withAFII%2ezip --></p><center><br>
      <table border="1"><tbody><tr><td><img src="http://www.typophile.com/forums/icons/mime_zip.gif" align="left" alt="application/x-zip-compressed">Tiro AGL name mapping<br><a href="http://www.typophile.com/forums/messages/4101/tiro_Unicode4_0_BMP_withAFII-22786.zip" target="_blank"><b>tiro_Unicode4.0_BMP_withAFII.zip</b></a> (175.4 k)</td></tr></tbody></table>
      </center><!--/attachment--> <br> <br>If you drop this .nam file in your FontLab /Mapping folder, you can use it with the Generate Unicode and Generate Names functions in FL. When the new Tiro website goes online, we plan to have a resource download section from which this and other useful FL files will be available, including a .nam that uses a much more extensive list of human-friendly production glyph names.<p></p>
