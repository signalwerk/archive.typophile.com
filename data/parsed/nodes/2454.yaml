    html: <p>What do you mean by "raw Windows codes"? If you open your file in WordPad, can you see the rendered glyphs or some decimal values?  <br> <br>Are there only paired glyphs, or are there kerning values as well?  <br> <br>And then, if you choose File / Save As, which format do you choose? Text Document or Unicode Text Document?  <br> <br>Look at the K1.TXT file in the Kerning folder of your FontLab. Is this something you mean? If so, just put some name in the first line of the file and save it in this folder as K4.TXT (Text Document).  <br> <br>Adam <br></p>
