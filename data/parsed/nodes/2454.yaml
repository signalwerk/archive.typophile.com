    html: "<p>Cool - thanks. <br> <br>-- <br> <br>BTW, I wrote: <br>&gt; you cannibalize any old AFM file <br> <br>It turns out you need to make sure the source AFM file has a metrics entry for any character you're kerning: kern pairs for characters undefined in the \"StartCharMetrics\" section are ignored. The complication is that the names declared in AFM files output by FontLab don't always match the Adobe stuff, or maybe it's that they only [can] match one of the choices. Like if you declare a pair \"L middot\" (useful in Catalan) it won't show up because the metrics definition (assuming it was output from FontLab) uses \"periodcentered\" instead. And some stuff (like the superior numerals) are represented by Unicode numbers in the metrics section instead of names... <br> <br>So it looks like my macro needs revision (to match FontLab). <br>Or I guess one could use an AFM file with names that match the ones in the macro. <br> <br>hhp <br></p>"
    html_clean: "<p>Cool - thanks. <br> <br>-- <br> <br>BTW, I wrote: <br>&gt; you cannibalize any old AFM file <br> <br>It turns out you need to make sure the source AFM file has a metrics entry for any character you're kerning: kern pairs for characters undefined in the \"StartCharMetrics\" section are ignored. The complication is that the names declared in AFM files output by FontLab don't always match the Adobe stuff, or maybe it's that they only [can] match one of the choices. Like if you declare a pair \"L middot\" (useful in Catalan) it won't show up because the metrics definition (assuming it was output from FontLab) uses \"periodcentered\" instead. And some stuff (like the superior numerals) are represented by Unicode numbers in the metrics section instead of names... <br> <br>So it looks like my macro needs revision (to match FontLab). <br>Or I guess one could use an AFM file with names that match the ones in the macro. <br> <br>hhp <br></p>"
