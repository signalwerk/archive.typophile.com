    html: <p>Right, but the thing to watch out for is that the character names in the kerning pairs have to match the ones in the metrics section of the AFM file. That might seem obvious, but it gets complicated when you consider that the Adobe list shows multiple names per codepoint (like any kern using "middot" instead of "periodcentered" won't be recognized upon [re]import). So basically you can/should just use the names in the AFM file that FontLab outputs - you don't need the Adobe list (in this case). <br> <br>-- <br> <br>I've found 7 wrong names and one typo in my macro - I'll provide an updated version soon. <br> <br>hhp <br></p>
    html_clean: <p>Right, but the thing to watch out for is that the character names in the kerning pairs have to match the ones in the metrics section of the AFM file. That might seem obvious, but it gets complicated when you consider that the Adobe list shows multiple names per codepoint (like any kern using "middot" instead of "periodcentered" won't be recognized upon [re]import). So basically you can/should just use the names in the AFM file that FontLab outputs - you don't need the Adobe list (in this case). <br> <br>-- <br> <br>I've found 7 wrong names and one typo in my macro - I'll provide an updated version soon. <br> <br>hhp <br></p>
