  - id: 19766
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>The Adobe Glyph List is <a href="http://partners.adobe.com/asn/tech/type/glyphlist.txt">here</a>. Note that this is version 2.0, which contains additional recognised names from multiple sources. Personally, I found the earlier version more useful for font development, as with few exceptions there was only one 'correct' name per Unicode character. General Adobe glyph naming rules are <a href="http://partners.adobe.com/asn/tech/type/unicodegn.jsp">here</a>. <br> <br>The easiest way to get your kerning data into FontLab is probably to replace character pairs with spaced glyph name pairs in your list, append 'KPX ' before each one, paste them into a AFM and import them into FontLab. Note that the count of kern pairs at the beginning of that section of the AFM should equal or exceed the actual number, otherwise the list may be truncated during import.</p>
    html_clean: <p>The Adobe Glyph List is <a href="http://partners.adobe.com/asn/tech/type/glyphlist.txt" class="link-external">here</a>. Note that this is version 2.0, which contains additional recognised names from multiple sources. Personally, I found the earlier version more useful for font development, as with few exceptions there was only one 'correct' name per Unicode character. General Adobe glyph naming rules are <a href="http://partners.adobe.com/asn/tech/type/unicodegn.jsp" class="link-external">here</a>. <br> <br>The easiest way to get your kerning data into FontLab is probably to replace character pairs with spaced glyph name pairs in your list, append 'KPX ' before each one, paste them into a AFM and import them into FontLab. Note that the count of kern pairs at the beginning of that section of the AFM should equal or exceed the actual number, otherwise the list may be truncated during import.</p>
