  - id: 19770
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>So the Word macro -a quick &amp; dirty brute force affair- is here: <br><a href=\"http://www.themicrofoundry.com/other/namesubber.rtf\" target=\"_blank\">http://www.themicrofoundry.com/other/namesubber.rtf</a> <br> <br>All it does is convert non-alphabetic characters (except the space and non-breaking space) <i>in the Windows:Western codepage</i> to their Adobe names. So in my case I still had to do some manual processing: <br>1) Separate the pairs with a space. Which I actually did by hacking the macro: I put a space before each Adobe name, but then also had to find/replace all 52 alphabetic characters with space+character (which could be put in the macro as well though). This left me with a prefix space per line. <br>2) Put the \"KPX\" prefix per line (no space since I got a prefix space from #1). This I did by typing in a Tab at the head of each line* (Shoutcast's Goa channel helped) then doing a find/replace: Tab -&gt; \"KPX\". <br>3) Put the kerning amounts (which were 99% either \" +125\" or \" -125\"). Using the same Tab trick. Tab is safe because nobody makes kerns with it... I assume! <br> <br>* Note that leading Tabs are messed up by Word (it turns them into \"ruler tabs\"), so I used WordPad. <br> <br>If I could get the macro to process linefeeds (which I couldn't) then I could get rid of manual processing entirely. <br> <br>And after that you cannibalize any old AFM file (that has at least one kern defined) to get FontLab to read it in. <br> <br>-- <br> <br>A question: <br>That Adobe name list has multiple names per codepoint for some characters. Like periodcentered/middot for 00B7 and overscore/macron for 00AF. Do you just choose any of the names? <br> <br>hhp <br></p>"
    html_clean: "<p>So the Word macro -a quick &amp; dirty brute force affair- is here: <br><a href=\"http://www.themicrofoundry.com/other/namesubber.rtf\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/other/namesubber.rtf</a> <br> <br>All it does is convert non-alphabetic characters (except the space and non-breaking space) <i>in the Windows:Western codepage</i> to their Adobe names. So in my case I still had to do some manual processing: <br>1) Separate the pairs with a space. Which I actually did by hacking the macro: I put a space before each Adobe name, but then also had to find/replace all 52 alphabetic characters with space+character (which could be put in the macro as well though). This left me with a prefix space per line. <br>2) Put the \"KPX\" prefix per line (no space since I got a prefix space from #1). This I did by typing in a Tab at the head of each line* (Shoutcast's Goa channel helped) then doing a find/replace: Tab -&gt; \"KPX\". <br>3) Put the kerning amounts (which were 99% either \" +125\" or \" -125\"). Using the same Tab trick. Tab is safe because nobody makes kerns with it... I assume! <br> <br>* Note that leading Tabs are messed up by Word (it turns them into \"ruler tabs\"), so I used WordPad. <br> <br>If I could get the macro to process linefeeds (which I couldn't) then I could get rid of manual processing entirely. <br> <br>And after that you cannibalize any old AFM file (that has at least one kern defined) to get FontLab to read it in. <br> <br>-- <br> <br>A question: <br>That Adobe name list has multiple names per codepoint for some characters. Like periodcentered/middot for 00B7 and overscore/macron for 00AF. Do you just choose any of the names? <br> <br>hhp <br></p>"
