  html: <p>I have a hand-made kerning list consisting of pairs of characters, one pair per line (in WordPad). The characters are the actual Windows codes, not descriptives like "left square bracket", and the pairs are not separated by anything. I know FontLab can import AFM files, but I want to avoid converting my "raw" data to AFM before import. Help? <br> <br>hhp <br></p>
