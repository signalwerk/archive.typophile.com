    <h2><a href="/web/20081121143513/http://typophile.com/battle29" title="Type Battle 29 // Circuit City Logo Redesign">Type Battle 29 // Circuit City Logo Redesign</a></h2>   <p>It was announced in the news last week that <a class="freelinking-external" href="https://web.archive.org/web/20081121143513/http://www.circuitcity.com/">Circuit City</a>, a major US electronics retailer, has filed for bankruptcy protection amid a weak economy. According to <a class="freelinking-external" href="https://web.archive.org/web/20081121143513/http://money.cnn.com/2008/11/10/news/companies/circuit_city/index.htm">CNN</a>, the company plans to keep its remaining stores open through bankruptcy proceedings and encourages consumers to continue shopping at its stores.</p>
    <p>Typophiles, how can you as type and/or graphic designers help Circuit City in these pressing times?</p>
    <p>// TYPE BATTLE 29</p>
    <p>Design a new logo (or logotype) for Circuit City. Extra points for creating additional branded examples to support your design.</p>
    <p>Winner take all, no holds barred. May the best designer win.</p>
    <p>// REQUIREMENTS</p>
