    html: <p>Found it at <a href="http://www.lineto.com/cont_cat.html?ID=47&amp;dir_id=60" target="_blank"> LineTo</a>, but it's "currently NOT available". <br> <br>alpha headline (1 weight) <br>designed by cornel windlin, 1993-1997 <br> <br>"alpha headline" is derived from the standard british car registration plates. the first version dates back to 1991. it was subsequently used on a number of design projects and presented at the FUSE '94 conference in london. "alpha" served as a headline typeface for phil bicker's redesign of "creative camera". at present it exists in a capitals only version, with two alternative sets of characters within the same font. </p>
