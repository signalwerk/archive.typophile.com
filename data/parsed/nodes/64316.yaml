      <p>I remember reading about the genesis of Centaur and how Rogers wanted<br>
      to capture the spirit of Jenson's type. So rather then use a printed<br>
      example with its distortions due to ink squash etc he drew over bleached<br>
      out photographic enlargements.I think it's very successful.</p>
      <p>But another type which has it origins in those times and was drawn by<br>
      Monotype to be a facsimile of an Aldine type is Poliphilus. This was meant<br>
      to recreate the appearance of a 15th century printed page.<br>
      In text sizes it works very well nice and dark much more character<br>
      than Bembo for example.</p>
      <p>Wouldn't be brilliant if any drawings or sketches which punchcutters<br>
      used in those times remained. Of course it may be they didn't use<br>
      sketches just had perhaps a calligraphic page as a guide.<br>
      I've strayed sorry can Juhani tell us whats happening with his type?</p>
