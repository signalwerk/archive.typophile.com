    html: |-
      <p>thanks for the comments &amp; sorry for my late response. the typeface hasn't gone much further yet. </p>
      <p>my main concern is how the type works in text size. i was hoping the pen characteristics, like abrupt transitions &amp; asymmetric serifs, would come through as more than just calligraphy reference. i think these features are less eye-catching in smaller size and contribute to the overall feel &amp; rhythm of the text. the contrasts of form are more important than their tool origin. i'm not saying the features of the pen are an improvement to general readability, but they don't appear to me as a hindrance either. i admit they're a bore if they only raise associations of arts &amp; crafts. </p>
      <p>i think i've broken the constraints of the pen more than once, though. the flatted counter forms in some of the letters (f, s &amp; t esp.) don't have much to do with the broad pen in my view. i just thought there's a slight visual resemblance (round outer curve vs. flat counter) to the pen 'fractures' that would hold the type together somehow. also it seemed like something that a smaller size would allow to do: short counter curves look almost superfluous in body text.</p>
