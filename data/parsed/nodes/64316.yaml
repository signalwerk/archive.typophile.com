      <p>First: IMVHO I think there are many good things.<br>
      Second: using words to check a font does not work at such an early stage. you'd be better off checking all combinations, or at least all combinations with lead characters (typically: o, n, i)<br>
      Third: it already looks better on your small size than on your large size because of the harsh transitions in curve but is this what you want?</p>
      <p>Drop the pen and think indeed. The pen is only a start, mostly to find the ductus, IMVHO.</p>
