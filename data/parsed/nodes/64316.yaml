      <p>Yes, 95% of type people will do that, some to a greater degree<br>
      than others. People tend to repeat what they've been taught.</p>
      <p>My own thoughts have led to what I presented at the Mexico City<br>
      conference in October: that not only the pen and cartesian grid are<br>
      artificial constraints on type design, but the even the fundamental<br>
      idea that letters are "fattened" skeletons prevents us from properly<br>
      serving the reader.</p>
      <p>To me the design expressed here is best rendered as faux type,<br>
      not a font. In that medium it would look quite charming I think.<br>
      Some recent discussion here: <a href="http://typophile.com/node/64369" title="http://typophile.com/node/64369">http://typophile.com/node/64369</a></p>
      <p>hhp</p>
