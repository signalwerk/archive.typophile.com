    <p>hello everyone. here's an oldstyle lowercase with a collection of features that aren't probably very original in themselves. i've been sketching with a broad pen and looking at Quadraat's italic, trying to arrive at some crude approximation of a garalde face. i thought i'd ask your opinion if there's any novelty in this try. all comments welcome!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/obduracy_3559.png"></div><p></p>
