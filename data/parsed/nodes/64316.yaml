      punchcutter were not the same person, the latter would<br>
      be a "silent modifier", greatly affecting the results.</p>
      <p>And in many (most?) cases where the designer and punchcutter<br>
      were the same person, there were no drawings - the guy simply<br>
      started cutting!</p>
