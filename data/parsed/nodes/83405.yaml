      <p>I think this may be a composite of more than one font, but I think I can find most of these letters in the Red Rooster <a href="http://new.myfonts.com/fonts/redrooster/xctasy-sans-rr/?refby=bowfin" rel="nofollow">Xctasy Sans</a> family. The lower case letters may have been enlarged to make the M and N. A font like Plaza might also have been used for certain letters. Just be open to the mixing of fonts -- I think it happens.</p>
      <p>- Mike Yanega</p>
