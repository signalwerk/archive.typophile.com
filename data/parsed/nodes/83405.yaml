    html: |-
      <p>Thanks, both of you! </p>
      <p>I found this sample as a print somewhere (in the letraset age) when looking for a typeface for wedding invitations and recently came across it again in storage. </p>
      <p>Xctasy Sans certainly has many of the same character shapes and it's interesting to see what they decided for upper &amp; lower case. It would be interesting to find Design Fineline somewhere too.</p>
      <p>I've already started digitizing this, making up the characters not shown. Xctasy gives me a character map as reference. I didn't want to start working on a typeface that already existed somewhere. I'll be posting for critique!</p>
