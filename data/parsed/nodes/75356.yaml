      <p>I agree with Riccard0, can't really give suggestions unless there are more specifics.</p>
      <p>I have to say that Bleeding Cowboys doesn't really say "Theater" to me, at all. As a matter of fact, it's painfully overused for projects in which it doesn't belong. Just the day before yesterday I got a political advertisement using Bleeding Cowboys. It looked terrible! Granted, local politics never have good design departments, but Bleeding Cowboys? For an election brochure? C'mon.</p>
