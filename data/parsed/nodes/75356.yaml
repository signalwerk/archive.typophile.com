      <p>The <a href="http://new.myfonts.com/fonts/exljbris/museo/" target="_blank" rel="nofollow">Museo</a> series is clean, contemporary and offers three flavors (original, sans and slab), and is reasonably priced...certainly a step up in "class" from Bleeding Cowboys.</p>
      <p>On the other hand, if you really want to be bleeding edge, this freebie will take your bruchure to where no studio theater brochure has gone before...</p>
