      <p>Ah, sorry, It's a smallish and they operate from what they call a 'studio' theater- capacity around 100. They have a number of groups that come to put on shows, of all type and genres. To summarise, not big, but could be a lot bigger. Also they are involved in shows around the area- so not anchored the the studio.</p>
      <p>They have been going for around 10 years or more, so they aren't needing a major publicity campaign. Thanks for helping folks!</p>
