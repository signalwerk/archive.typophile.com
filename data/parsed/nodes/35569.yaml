    <p><a href="http://www.flickr.com/photos/joepemberton/956953273/" title="Typophile Found Type Buttons"><img src="http://farm2.static.flickr.com/1230/956953273_0b4d3c9359.jpg" width="500" height="258" alt="Found ephemera buttons"></a><br>These Typophile buttons have been designed, used, discarded, found and now repurposed. <br><br>Everyday information -- once carefully designed by some anonymous person -- passes through our hands. Without a thought it does its job and ends up in the trash, or left to carelessly flutter to the ground to be found and repurposed.<br><br>Each button is of course unique. These are not scanned and printed. They are found, curated and lovingly composed in a circular frame.<br><br><a href="http://typophile.com/node/35569/">Read more after the bump...</a></p>
    <p><a href="http://www.typophile.com/merchandise/" title="Typophile Found Type Buttons"><img src="http://farm2.static.flickr.com/1085/957744948_efc7bae3c8.jpg" width="500" height="281" alt="Everyday information passes through our hands,"></a><br><a href="http://www.typophile.com/merchandise/" title="Typophile Found Type Buttons"><img src="http://farm2.static.flickr.com/1064/957742420_fff157de46.jpg" width="500" height="375" alt="Putting found type in new contexts..."></a><br><a href="http://www.typophile.com/merchandise/" title="Typophile Found Type Buttons"><img src="http://farm2.static.flickr.com/1030/957741260_a9877c0c80.jpg" width="500" height="231" alt="Wearable art / wearable leftovers"></a><br><br></p>
    <p>Quantities are very limited. If we have some left over after TypeCon (or if we make more) we'll put up ordering information on the <a href="http://www.typophile.com/merchandise/">Merchandise</a> area. All sales support our ability to provide a thriving Typophile.</p>
