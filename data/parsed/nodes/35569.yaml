    <p>Quantities are very limited. If we have some left over after TypeCon (or if we make more) we'll put up ordering information on the <a href="http://www.typophile.com/merchandise/" class="link-lost">Merchandise</a> area. All sales support our ability to provide a thriving Typophile.</p>
