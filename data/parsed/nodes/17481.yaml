    html: <p>I haven’t seen the magazine, but the sans used in their <a href="http://www.smartmoney.com/mag/mediakit/pdf/E1.pdf">media kit</a> is <a href="http://www.philsfonts.com/showing.html?sku=AB890010X1P1&amp;start=1">Akzidenz Grotesk</a>. Alternatively, you could try <a href="http://www.myfonts.com/fonts/linotype/basic-commercial-lt/?refby=typographica">Basic Commercial</a>.</p>
