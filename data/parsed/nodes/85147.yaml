      <p>If you insist on using the italic, you can get a typeface with an upright italic. <a class="freelinking external" href="http://www.typotheque.com/fonts/nara/" rel="nofollow">Nara,</a> for example.</p>
      <p>“Nara includes two different secondary scripts for situations where you need to emphasise a selection of text that is already italicised. The designer of Nara also explored the notions of what defines a secondary script. While the Cursive version is perfectly upright with a stroke structure inspired by handwriting, Italic uses a 12 degree slant.”</p>
