      <p>The novel <em>Birdy</em> by the pseudonymous William Wharton, published in 1978 by Knopf, had a similar problem. The story was told by two different narrators, usually speaking in alternating chapters.<br>
      The book's designer (whose name, alas, I do not know), solved the problem by using W.A. Dwiggins' Electra font, designed for Linotype in the 1930s. Dwiggins' original design included a Roman and an Italic, but his Italic was an oblique Roman, generally considered easier to read in mass than the more conventional cursive italic. It was Dwiggins' original oblique Roman type that was used for the second narrator in <em>Birdy</em>.</p>
      <p>P.S. No. 1: In the 1930s, Linotype's customers found Dwiggins' oblique Roman a little too avant-garde, so Linotype sent Dwiggins back to the drawing board to create a cursive version of Electra, and that's pretty much the only Electra Italic you see these days. Check around, though, I'll bet someone has made a digital version of the original Electra Italic. </p>
      <p>P.S. No. 2: <em>Birdy</em> became a bestseller and was published as a mass-market paperback, set in another Dwiggins face, the then-ubiquitous Caledonia. Caledonia has a cursive Italic, and the Italic chapters in the mass-market paperback <em>Birdy</em> are damn near impossible to read.</p>
