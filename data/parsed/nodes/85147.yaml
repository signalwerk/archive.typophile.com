    <p>hi</p>
    <p>I'm working on a book with English and French on the same page. My idea was to do the English in roman text and the french in italic, the problem is that the text has a lot of italics in it, that is fine with the english but how do you show the italics in french(since the text will be all italic)?<br>
    do you just change it back to roman?</p>
    <p>thank you</p>
