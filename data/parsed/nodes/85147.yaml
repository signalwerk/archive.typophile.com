      <p>Your idea is a bad one in the first place. We have generations of experience with bilingual English/French documents in Canada and no one would contemplate setting one language (always the implicitly <em>inferior</em> language) in bold, italic, or another typeface.</p>
      <p>A bilingual document must communicate the equality of both languages typographically. Abandon your plan, please, and typeset both languages in roman by default.</p>
