      <p>If text blocks are flagged by typeface as language-specific, this indicates a shortcoming of the layout.<br>
      Ideally, the reader should be able to determine the conventions of the document design immediately, established on the first page, have this confirmed at the first page turn, and then be able to anticipate where his/her eye should go on subsequent page turns, without having to look for cues such as typeface, or having to start reading text to determine which language it is.</p>
      <p>**</p>
      <p>However, as to your point about the French being a translation, there is a case to be made for identifying the secondary status of translation. For instance, in a book of poems by Lorca (Penguin), the verse is set in standard manner, in Spanish, and the English translation is in footnotes, prose style. This respects the primacy of the original language, and the limits of translation.</p>
      <p>Somewhat related, in a recently acquired album (Ozawa/TSO, late 1960s), I was intrigued to find that the English and French liner notes were written independently, with different information and critical perspective.</p>
