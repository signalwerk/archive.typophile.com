      <p>John: <em>An italic derived from the chancery italic handwriting (and fonts) of the 15th and early 16th centuries is usually much better for this than one derived from the more rounded italics of the 18th and 19th centuries, which were usually meant only as companions to the roman.</em></p>
      <p>Really? The rounded italics of the 18th Century were based on contemporary secretarial hands, just as the italic hands of the 15th and 16th century were, and both were used extensively -- in both written and typographical form -- for extended text. Bodoni, for example, set the entire introduction to his <em>Manuale Tipographico</em> in italics.</p>
      <p>I think there is a good argument to be made -- and a testable one -- that the 18th Century neo-classical and romantic italics may be easier to read in extended text because a) they are more regular than many of the renaissance italics, having consistent slant angle and consistent stroke contrast patterns, b) the stroke contrast typically follows the slant angle, rather than being independent of it, c) letters are typically less cramped than in the more compressed renaissance italics and closer in proportion to roman types.</p>
