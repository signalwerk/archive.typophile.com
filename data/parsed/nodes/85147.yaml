      <p>John: <em>Really? The rounded italics of the 18th Century were based on contemporary secretarial hands, just as the italic hands of the 15th and 16th century were, and both were used extensively -- in both written and typographical form -- for extended text. Bodoni, for example, set the entire introduction to his </em>Manuale Tipographico<em> in italics.</em></p>
      <p>I'm aware of the relationship between 18th/19th-century italics and contemporary roundhand, but I think that by the 18th century the connection between type and handwriting had gotten much looser than in the 16th. And as far as I know, italic type in the 18th century was mainly used as a secondary face, to complement the roman; not intended for use in long passages of text. </p>
      <p>It would be interesting to try to test your hypothesis that 18th-century italics are easier to read than chancery italics. Maybe it's just my eye, but to me, every factor that you name in favor of the later style is one that makes it less readable.</p>
