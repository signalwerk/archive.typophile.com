      <p>I agree with Joe Clark: don't treat one language as "secondary" or inferior to the other. You can use position to separate the English and French texts, without any change of typeface.</p>
      <p>But in general, the question of using italics for text, and then dealing with "italics" within that text, comes up again and again. There's no ideal solution.</p>
      <p>First of all, if you're going to set any lengthy text in italic, make sure that you're using a type family whose italic was *designed* for extended reading. An italic derived from the chancery italic handwriting (and fonts) of the 15th and early 16th centuries is usually much better for this than one derived from the more rounded italics of the 18th and 19th centuries, which were usually meant only as companions to the roman. That lets out Times Italic, for instance: we're all used to seeing it, so it's familiar, but it's really not designed for continuous reading. (In fact, I think that all by itself, Times Italic is responsible for a good deal of the prejudice against *ever* using italic for text.) </p>
      <p>The usual practice for dealing with titles or emphasized words within an already-italic text is to set them in roman. That's logical, and expected; but it has always bothered me, because it's almost always ugly. When the "italic" words are sparse, and the typeface has the requisite characters, I sometimes use small caps for emphasis or titles within the italic passage. (All small caps, not caps &amp; small caps.) Of course, if capitalization within those words is important, then this won't work. But in an old-style typeface, it can look quite elegant, and easy to read.</p>
