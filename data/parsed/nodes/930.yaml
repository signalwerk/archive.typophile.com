  html: <p>Some first raw sketches of a font to be used for logotypes. It is inspired by the wide capital letters in the corporate logotypes from companies like SHARP, BNP PARIBAS, INTERSHOP. <br> <br><a href="http://www.typografie.info/logotypia.gif" target="_blank"> http://www.typografie.info/logotypia.gif</a> <br> <br> <br>I also think of a version with overlapping letters, and lots of ampersands and ligatures. <br> <br>What do you think? <br> <br>Ralf <br> <br></p>
  html_clean: <p>Some first raw sketches of a font to be used for logotypes. It is inspired by the wide capital letters in the corporate logotypes from companies like SHARP, BNP PARIBAS, INTERSHOP. <br> <br><a href="http://www.typografie.info/logotypia.gif" target="_blank" class="link-external"> http://www.typografie.info/logotypia.gif</a> <br> <br> <br>I also think of a version with overlapping letters, and lots of ampersands and ligatures. <br> <br>What do you think? <br> <br>Ralf <br> <br></p>
