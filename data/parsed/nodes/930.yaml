  html: <p>Some ﬁrst raw sketches of a font to be used for logotypes. It is inspired by the wide capital letters in the corporate logotypes from companies like <span class="caps">SHARP</span>, <span class="caps">BNP</span> <span class="caps">PARIBAS</span>, <span class="caps">INTERSHOP</span>. <br><br><a href="http://www.typografie.info/logotypia.gif" target="_blank"> http://www.typograﬁe.info/logotypia.gif</a> <br><br><br>I also think of a version with overlapping letters, and lots of ampersands and ligatures. <br><br>What do you think? <br><br>Ralf <br><br></p>
  html_clean: <p>Some ﬁrst raw sketches of a font to be used for logotypes. It is inspired by the wide capital letters in the corporate logotypes from companies like <span class="caps">SHARP</span>, <span class="caps">BNP</span> <span class="caps">PARIBAS</span>, <span class="caps">INTERSHOP</span>. <br><br><a href="http://www.typografie.info/logotypia.gif" target="_blank" class="link-external"> http://www.typograﬁe.info/logotypia.gif</a> <br><br><br>I also think of a version with overlapping letters, and lots of ampersands and ligatures. <br><br>What do you think? <br><br>Ralf <br><br></p>
