    html: <p>Like Linux, free fonts are usually only free if your time is worth nothing. For example, if you like the fonts on The League of Movable Type’s sites, you first have to start downloading them and figure out which ones are actually finished. Because most of them aren’t. If you want to use the stuff you find on DaFont, you have to sift through the ninety-plus percent that are just student projects based on movie, comic book, or album logos. Then you have to narrow it down again, sifting for the ones that were actually drawn, spaced, and kerned correctly as opposed to just being spaced and kerned with no human intervention. Etc., etc., etc.. I would recommend just downloading the exLibris free fonts and not even bothering with the rest.</p>
