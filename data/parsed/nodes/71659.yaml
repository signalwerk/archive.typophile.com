    <p>I want to know if any of you pros think free fonts are worth using.</p>
    <p>I downloaded about 100 fonts from DaFont - the majority were poor; some were good; some were excellent. But according to some designers, free fonts never cut it. </p>
    <p>What's your opinion on this? Is it nearly impossible to find good typefaces which are on par with commercial fonts, or not?</p>
    <p>If anyone could put up links to good free font resources, I'd be grateful.</p>
    <p>Anyway, I'm waiting for your responses.</p>
