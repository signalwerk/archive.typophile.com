      <p>For basic display use: If we start by removing the free fonts that are rip-offs, the ones with messy outlines, no (or bad) kerning, uneven spacing, uneven weight, none of the necessary ligatures, no overshots, no optical corrections and the ones that doesn’t support basic Western European you still have a few left.</p>
      <p>For more complex use: If you also remove the ones with no more then one weight, you’ve narrowed it down to a handful.</p>
      <p>For screen use: Remove those who does not preform well on screen …</p>
      <p>Next: Remove the plain ugly ones.</p>
      <p>And there’s also how well they actually preform. No amateur could afford the testing that went into a professional problem solving typeface like Terminal Design’s <a class="freelinking external" href="http://www.terminaldesign.com/fonts/" rel="nofollow">Clearview</a>.</p>
