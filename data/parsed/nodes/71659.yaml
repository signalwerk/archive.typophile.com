    html: |-
      <p>There's also the articles <a class="freelinking external" href="http://fontfeed.com/archives/an-introduction-to-free-fonts/" rel="nofollow">being posted</a> on <a class="freelinking external" href="http://fontfeed.com/archives/free-fonts-free-is-not-always-free/" rel="nofollow">the FontFeed</a> (notice that's two articles, with apparently more to come, very interesting) and, as someone points out in one of the comments of one of those articles, there's <a class="freelinking external" href="http://www.fontsquirrel.com/" rel="nofollow">Font Squirrel</a>.</p>
      <p>As for my own opinion as not a pro but a serious, interested onlooker, I believe <em>everything</em> has its place in the realm of graphic design; the hard part is making educated choices (because choices are always hard and education doesn't just fall on our lap) and making everything work. You could make a career and a name for yourself, if you so chose, just using free fonts. Hey, I believe someone already did, grunge style.</p>
      <p>I think there's a lot more room for error than hardcore typophiles (myself included, note) might acknowledge. If you have a vision of what you're trying to create, then everything should come relatively easily and all the rules of classic typesetting need not (well <em>not necessarily</em>) apply.</p>
