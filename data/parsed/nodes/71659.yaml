    html: |-
      <p>I don't think you can generally say freefonts are good or bad. There are some excellent fonts out there that are free, some good display faces. And there is a lot of crap. What is often said is that you get what you paid for it. I don't neccesarily agree with this. I think sometimes freefonts can be useful, for instance for single use headlines in magazines, or for banners. And designers like Jos Buivenga give away some weights of their fonts for free, and they are brilliant. </p>
      <p>As for freefont resources: this is hard as most offer illegal fonts as well, and no proper information on licencing. Fontsquirrel.com is quite good in this respect. And fontspece.com is OK as well. But always double check, and avoid websites like fontyukle and 1001fonts, as they offer lots of illegal and probably corrupted fonts.</p>
