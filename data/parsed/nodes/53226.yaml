    html: <p>You could probably find something similar to "liquid," <a class="freelinking external" href="http://www.letterbox.net.au/research/res_fo_terital.html" rel="nofollow">Terital</a> is close, and the type used for "branding" looks similar to <a class="freelinking external" href="http://new.myfonts.com/fonts/alphabetsoup/orion-md/" rel="nofollow">Orion</a>. But the two on the right are really unique. Closest I can think of is <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_chambers_sans_ot/" rel="nofollow">Chamber Sans Italic</a> with ligatures, you might get close.</p>
