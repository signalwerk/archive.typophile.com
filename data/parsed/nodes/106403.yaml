      <p>I also agree about having a minimalistic font against the highly detailed paintings. I also understand how you feel about the Helvetica family. Instead of Helvetica I recommend Avenir. Personally I looove that typeface and I think you would too. It is a sans serif and is minimalistic but has a little style to it compared to the neutral Helvetica.</p>
