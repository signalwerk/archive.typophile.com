      <p>I would forget about modernity, whatever that means, and concentrate on type that looks good (to you) next to the paintings.</p>
      <p>If you work with a sans serif that has a lot of weights, that can help in the design process as you experiment with different settings.</p>
      <p>For stationery, it’s important to take into account the ﬁgures (numbers) in a typeface.</p>
