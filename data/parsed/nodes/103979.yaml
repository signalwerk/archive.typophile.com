    html: |-
      <p>"Futura", the canonical 'futuristic font', was designed "in the summer of 1924" (<a href="http://people.ku.edu/~delange/paulrenner.html" title="http://people.ku.edu/~delange/paulrenner.html">http://people.ku.edu/~delange/paulrenner.html</a>).</p>
      <p>From that article:</p>
      <blockquote><p>... it became a cornerstone of the “New Typography” classified as Geometrical Modernism, form follows function became the key words and careful reasoning constrained all the character shapes to their utmost functional simplicity.</p></blockquote>
      <p>So apparently 'simplicity' is linked to 'futuristic'. Looking at FF QType, its design reminds me of 1970s computer monitors: straight lines (or only very subtly curved), with round corners. Could that be the subliminal link?</p>
      <p>"Space Colony" appears built with simple primitives, in an almost pixel-like fashion. Early 1960s futuristic fonts such as ITC's <a href="http://www.fontshop.com/fonts/family/countdown_itc/" rel="nofollow">Countdown</a> (1965) show similar characteristics.</p>
      <p>Now high-res screens have become available we might next see a backlash to classic serifed fonts -- just because it is possible :-)</p>
