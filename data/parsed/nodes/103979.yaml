      <p>Many futuristic fonts — especially in movies —&nbsp;are rather gimmicky, designed to look cool and different, but are unlikely to actually be used much in the future. One exception that comes to mind is 2001: A Space Odyssey, in which Kubrick resisted the urge to use "futuristic" fonts.</p>
