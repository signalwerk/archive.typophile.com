    <p>Hi everybody,</p>
    <p>for my opinion there are masses of these fonts in use. Especially for Logo. Can anyone explain, why its so "zeitgeisty" to use these "futuristic" fonts? And what about the history? Its all from the beginning of computer technology?</p>
    <p>Thanks!</p>
