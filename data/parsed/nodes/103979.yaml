      <p><img>http://astroprofspage.com/wp-content/uploads/2008/10/800px-nasa_worm_logo.png</p>
      <p>Certain important logos help set the tone! Conceptually, unbroken curves suggest aerodymanics and speed, which go hand-in-hand with "the future." which make them a perennial favorite for that purpose.</p>
      <p> Fonts more closely with specific technologies often look dated - the opposite of futuristic - after several years. I don't think anyone would call this: <a href="http://www.fonts.com/font/monotype/computer" title="http://www.fonts.com/font/monotype/computer">http://www.fonts.com/font/monotype/computer</a> futuristic, but at one time it certainly seemed that way.</p>
