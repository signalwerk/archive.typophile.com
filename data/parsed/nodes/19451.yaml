    <p>I’ve been using Safari since it came with my Mac and like it just fine, vast improvement over IE or Netscape both visually and in terms of speed and display of graphics. I notice on this forum that a lot of people use Firefox and wonder why. Are there any advantages to Firefox that should make me consider using it instead of Safari?</p>
