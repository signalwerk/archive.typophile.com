      <p>i agree with nic. i work with a mac, and at home i use a pc. the shortcuts are really nice (better than in safari), the extensions are very powerful (if you start using some, take those from the top-lists on mozilla.org, they are all good in terms of coding etc). also, i love the search-tab to which you can add every search engine (or even translation-websites, wikipedia and others), and you can easily access it with ctrl+k / apple+k.</p>
