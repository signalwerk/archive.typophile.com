    html: |-
      <p>There are many philosophical reasons for using Firefox, but when it comes to a web browser, I’m not such an idealist. I’ve used Firefox and Safari extensively and will tell you that, especially on the Mac, Firefox isn’t nearly as polished. IMHO, Safari feels like more of a professional product. I prefer Safari for type rendering, ColorSync, Bookmark syncing with iSync and the highly usable SnapBack feature. If you prefer the Mozilla/Gecko layout engine that Firefox uses, I recommend <a href="http://www.caminobrowser.org/">Camino</a>, which is much more Mac-like and professional feeling than Firefox.</p>
      <p>Some practical reasons for using Firefox might include:<br>
      1. Better compatibility with crumby banking websites and such.<br>
      2. More extensible features with plugins. However, for every Firefox plugin that’s well-written, there are at least ten that are poorly written.</p>
      <p>I’m not trying to start a war here – these are just my personal preferences.</p>
