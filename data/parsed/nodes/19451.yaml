    html: <p>I use Firefox for some of the aformentioned reasons. My note is that I use “Tab X”, which is a Firefox extension that puts the close-tab button on the tab. When moving from Safari to Firefox, I found it really weird that the close-tab button was not on the tab. The cross-platform compatability and the extensions are very important to me.</p>
