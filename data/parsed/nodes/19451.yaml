      <p>I prefer Firefox simply because for *most* intents and purposes what I do on my PC corresponds to what I do on my Mac (shortcuts, menu positions, plug-ins etc). </p>
      <p>It’s convenient to be able to do things in a similar manner no matter which machine I am using or where I am, ie. work (PC &amp; Mac), home (PC &amp; Mac). Yup, there is every possibility that I will be using anywhere from four different machines in a day, so portability is key.</p>
      <p>-nic</p>
