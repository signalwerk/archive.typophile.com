  html: |-
    <p>Let me say that these Greek Sets are not Greek language supported fonts. My apologies.  They are Greek symbol fonts (with a complete set of numbers and Roman upper case) for college organizations, fraternities, and sororities for logos, posters, t-shirts, etc. </p>
    <p>I've used them for t-shirts mostly...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/GRKBanner1_3842.jpg"></div><p></p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/fontry/greek-font-set-1/ "> Greek 1 available from MyFonts...</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/GRKBanner_5950.jpg"></div><p></p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/fontry/greek-font-set-2/ "> Greek 2 also available from MyFonts...</a></p>
    <p>Also, you might like to know that more complete versions of each of these fonts are available from the <a class="freelinking external" href="http://new.myfonts.com/foundry/The_Fontry/ "> Fontry</a> or <a class="freelinking external" href="http://new.myfonts.com/foundry/Fontry_West/ "> Fontry West</a> on MyFonts or from<a class="freelinking external" href="http://www.thefontry.com "> the Fontry website</a>.</p>
    <p>Thanks for taking a peek and have a great day....</p>
    <p>~~~~~~~~~~~~~</p>
    <p><a class="freelinking external" href="http://www.thefontry.com"><em>...from the Fontry </em></a></p>
