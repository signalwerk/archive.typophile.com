    html: <p>I’ve noticed that you haven’t explained why you think that Minion and Myriad are appropriate for this project, or why ITC Garamond and Franklin Gothic are inappropriate. Address the intellectual and cultural connections between the magazine and the typefaces before you address the connections between the typefaces themselves.</p>
    html_clean: <p>I’ve noticed that you haven’t explained why you think that Minion and Myriad are appropriate for this project, or why ITC Garamond and Franklin Gothic are inappropriate. Address the intellectual and cultural connections between the magazine and the typefaces before you address the connections between the typefaces themselves.</p>
  - id: 238400
    user: 19337
    date: 2007-11-09T07:45:00
    date_raw: 9 Nov 2007 — 7:45am
    votes: null
    html: <p>Besides the appropriateness of the typeface designs for the subject matter and tone of the magazine, you may want to consider having for the body type a slightly condensed design, particularly if you have relatively narrow fully justified columns of text. Minion is good in that regard, being a bit narrower than other similar typefaces; but of course it may not suit your subject.</p>
