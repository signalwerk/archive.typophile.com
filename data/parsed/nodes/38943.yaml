  html: <p>Hi there, this is my firts post in this nice and useful forum. I'm going to re-design a public company magazine. Now I'm using ITC Garamond for text and Franklin Gothic Extra Condensed for headline. I would go with Minion for text and Myriad Bold for headline. Feels like a good choice since they were both designed by Robert Slimbach. How about it? Thanks.</p>
