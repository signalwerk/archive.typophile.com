  html: <p><em>x-height magazine</em> was published as a paper and ink publication by <a href="/wiki/FontHaus" class="freelinking" rel="nofollow">FontHaus</a> until the mid 1990s. Issues usually contained nicely illustrated articles on type and doubled as the FontHaus catalog. It now has a virtual home on the web at <a href="http://www.fonthaus.com/xheight" rel="nofollow">FontHaus.com/xheight</a>.</p>
