    html: <p>I've written lowercase <strong>q</strong> with a crossed descender since I was in college, and that's a long damn time. I can't remember anyone teaching me to make <strong>q</strong>'s that way, but I surely didn't invent it. I either saw it printed that way, or saw it in someone else's handwriting. I picked up the habit of crossing my <strong>7</strong>'s (considered an affectation here in the US) from a friend of mine around the same time, and maybe he crossed his <strong>q</strong>'s too.</p>
