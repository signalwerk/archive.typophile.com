      <p>Oh yes. The version I showed just wasn't fused into one outline yet. In fact, softening of corners has become quite a compulsion for me, fonts with sharp corners and straight lines now look unfinished and crude to me (though I know that isn't the case. I also know that most of my time-consuming filing and filling won't be visible at print sizes anyway. </p>
      <p>(By the way, for a soft-cornered typeface, I must say this is starting to look pretty violent. Must be Hrant's influence. That 'j' (slightly modified now) is a scythe, the question mark a sickle, and 'e' reminds me of some kind of blade my father, the luthier, uses for scraping the inside of a carved-top string instrument.) </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screenshot_4_6564.png"></div><p></p>
