    html: |-
      <p><cite>"A straight line is a dead line"</cite></p>
      <p>Bloemsma's ideal is nice, but the reality in digital fonts is that you're always having to cope with a grid. Lines that are long, flat, but not quite straight tend to rasterize with bumps and jogs that look like mistakes. </p>
      <p>It's fine to avoid straight lines as part of your design concept, but if a line wants to be straight —&nbsp;make it straight. Don't knock it three units off plumb just on principle.</p>
