      <p>I like most of them. The "3" is fine - maybe slightly plain. The "4" rules. The "6" and "9" are definitely a bit plain, and the "8" is way too regular and clean.</p>
      <p>The zero: although I'm aware of the need to pull it away from the lc "oh", I've never grasped the benefit of the extreme monoline form. Flipping the contrast is one of the two tricks I'd recommend (especially when you consider that many numerals have flipped contrast anyway). The other is making only the left or right curve thick.</p>
      <p>BTW, it looks like the "1" is heavy and the "5" is light.</p>
