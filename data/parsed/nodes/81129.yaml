      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screenshot_3_3605.png"></div><p></p>
      <p>I abandoned that idea because it made the very usual (in the Nordic languages and in Albanian) digraph 'gj' close to impossible. </p>
      <p>I've never even heard of Bremer Antiqua, thanks for that link. I'm looking forward to studying that now.</p>
      <p>I want this to be an original typeface rather than a conventional one. And I agree that my 'a' is the ideologically most important glyph. I'll start redrawing things as soon as possible, that will be in seven hours or so. </p>
      <p>Ben, I'm really looking forward to your critique.</p>
