    <p>This started as an attempt to draw type with curves only, and soon became an exercise in tension. I drew this several months ago, and had almost forgotten about it, until <a class="freelinking external" href="http://typophile.com/node/80991" rel="nofollow">this post</a> brought it back to mind. I don't really know if this experiment has identity enough to be considered a typeface in its own right. There's a companion italic in the works too, but I want to wait with that.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/untitled_5959.jpg"></div><p></p>
