      <p>Thank you very much! That ampersand was a nightmare, but one I learnt a lot from. One structural problem with the ampersand is that it has to balance between upper and lower case, as it belongs to neither (or both). I tried to do that by combining the upper case cusp and diagonal with the lower case flag serif and v/k/x-arm. </p>
      <p>I'm quite satisfied with that my new ampersand has a rather conventional outline, yet still is structurally not so orthodox. One can clearly see a rather undistorted 'et', without the glyph being too cursive nor too "literal".</p>
      <p>Your honest and very qualified critique is invaluable! I cannot imagine how I can ever draw type this good without Typophile. </p>
      <p>I think Centaur's j terminal looks like melting, brittle metal. That's cool, but not for my typeface. But I'll try to come up with a more distinct shape (though I quite like it as it is, I realise it might be a bit passive.)  </p>
      <p>I think I need to do something else than drawing tomorrow. Stay tuned for updates in a couple of days.</p>
      <p>That is one insane g, Sevag! Thank you. </p>
      <p>I've thought about making such an upwards-pointing spur on mine, by the way, but just can't get it right. Should I keep trying? By the way, what are good examples of typefaces with an open 'g'? I'm not counting Baskerville, it's aperture is purely ornamental.</p>
