    html: |-
      <p>Well well! I can see you've had a lot of fun drawing this! I like the way you've balanced the variables: smooth/cuspy, sharp/soft, lively/restrained. It's very artful, almost every glyph has some unexpected delight! I especially love the Pagan-cross shapes of F and the 4, which is just incredible.</p>
      <p>I'm having to go into the realm of vague suggestions since this is already so polished, so be wary of taking my comments too seriously.</p>
      <p>A seems somehow a bit plain. I like the spur on the apex of your AE, wonder whether that would work on the A. Also the foot serifs feel a little flat/shallow.</p>
      <p>B is perhaps heavy on the left, meaning add a fraction more weight to the arches. Compare with D.</p>
      <p>Tail of C looks unresolved. And the tail of J may be an area to play with.</p>
      <p>Q: This puzzles me. The overall shape fits well with the rest of the alphabet, but I'm curious whether there is a better solution for the tail. Crossing the bowl?</p>
      <p>T arm-serifs look lighter than on E; I'd expect them to be heavier.</p>
      <p>On U, I'd be tempted to try bringing the weight down the left slope more.</p>
      <p>W: I think the apex needs a slightly wider top, but that would lift some of the weight there upwards, which would not look so great, so also lowering it a fraction might be the solution. In fact that right hand downstroke could do with a couple of units extra weight I think.</p>
      <p>Lowercase</p>
      <p>a, f, m, q, r, t and u are super. I'd personally agree that the flags of f and r could take more weight, but Craig's also right, see how it looks in text.</p>
      <p>c is wide. Just an observation, I don't know what to think of it :)</p>
      <p>Counter of d looks somehow oblong compared to the more oval ones in p and q.</p>
      <p>e: yes. I'm a real fan of the inky eye, but I'd want an alternate for larger sizes, somewhere closer to the e part of /ae/ and /oe/. (I think these two may be too wide, and the vertical side to the counter of /a/ in the /ae/ bugs me. But I'd happily defer to your familiarity with these glyphs.)</p>
      <p>g: I'm not accustomed to the narrow tail, and to my eye the terminal seems a bit far to the right, but I'd want to see how it works in text before recommending any change. </p>
      <p>h may be a bit wide, or not.</p>
      <p>I'm curious about the placement of the tittles. </p>
      <p>I don't know how, but the w seems very much to bear your signature, it reminds me of your previous typefaces, which are actually rather different. I like the way you draw w.</p>
      <p>Loving the shape of thorn! Diacritics may be slightly too large (but only slightly, I like the weight of them). Placement of acute and grave may be too central.</p>
      <p>Comma may be out of character?</p>
      <p>Section sign may be falling left. It's an absolute beast to draw.</p>
      <p>I absolutely love the numerals, but some of them feel too sharp/crisp/stripped/modern. Like comparing the 567 with the glyphs in the line above, they sort of seem like a different tone. This is probably connected with what Hrant said about the strangeness. Is the contract too vertical on 5 and 6? I fear the 4 may be too wide, but don't change the shape please! Also I wondered whether you could curve the diagonal of the 7 into a swashy terminal like the 2 and 3. 3 and 5 may need more open lower bowls.</p>
      <p>Well I hope this hasn't put you off by seeming like there's too much to do...it's been instructive to look so carefully at what works and doesn't work for me. Thanks for sharing! :)</p>
