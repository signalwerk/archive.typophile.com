      <p>It did yes. I think it looks much better now although descender should go a bit more to the left to stabilize it even further (or move the right part a bit more to the left). I very much like the top part descender stroke contrast. Very playful and a bit feminine.</p>
      <p>P.S. I never wanted you to follow my <em>advice</em>. I way only trying to point out things that I don't like. It's on you whether you see them the same way and agree or not. My observation about /s/ being a bit vertically unstable still stands but you said it's a feature. So it will stay. :)</p>
