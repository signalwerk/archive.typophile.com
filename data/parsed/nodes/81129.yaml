      <p>Dear friends, meet Satyr. Thank you, Hrant, that name is perfect. The sound of it and the look of it. (Though perhaps not to the same extent some of its connotations, at least not to the early Greek satyrs, as they were ugly, old, sex-crazed men with horse tails. In late Antiquity, they became much nicer and better looking, though.) Actually, I wanted to give an earlier old style attempt the similar sounding (but unrelated) name Saturn, but found out that was taken by some Eurostile copy. Also, my old nom de plume as a <a class="freelinking external" href="http://en.wikipedia.org/wiki/Causerie" rel="nofollow">causerie writer</a> (and my earlier user name here on Typophile) was Satyagraha. Though yet again unrelated, I chose it for its sound and my associations to it (and literal meaning) rather than its political meaning. (Though I am indeed a fan of Gandhi's methods (and of Sanskrit, possibly the most beautiful of all the recorded Indo-European languages, especially in its earliest stage)).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screenshot_5_6001.png"></div><p></p>
      <p>I still think your idea was brilliant, Ben, and will definitely use it for future projects.</p>
