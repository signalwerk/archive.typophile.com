      <p>Apertures reexamined. I've tried to inject more whitespace everywhere. The 'g' and the related 's' now has a faint echo of the 'a' and 'e' trick. I've chopped off most of the left-facing serifs, but not to the radical extent of Bremer Antiqua. I think this is going places, perhaps even the right ones. And no, I haven't forgotten all your helpful critique, I'm just following Hrant's advice. What do you think of this new direction, dear critics?</p>
