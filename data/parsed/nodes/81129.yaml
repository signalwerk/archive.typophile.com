      <p>Thank you very much, Craig. It's great to be back. As usual, I think you've found the most important flaws in my design. That tall crossbar in 'A' is just a weird hangup I have (caused by the 'A' crossbar of Zapf's <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>.  Will be lowered. I'll make some 'e' variations. I really like its wide open mouth, but I agree the eye lacks character. That 'y' tail is a remnant from an earlier incarnation, where 'f', 'r' and even 'y' had similar terminals. The 'y' must go too, I agree. Are the 'r' and 'f' terminals slightly too light, by the way? </p>
      <p>It's well past midnight here, so redrawing will have to wait till tomorrow. Thanks again for invaluable feedback.</p>
