    date_raw: 15 Apr 2011 — 12:15pm
    date: 2011-04-15T12:15:00
    votes: null
    html: <p>I can't understand how thickening 'c's stem by two units can have such an effect, and I can't see it myself. I've however made the 's' more stable by moving its upper part five units to the right (back to where it was, but the new structure is kept). I guess one could say that the 'i' (and the 'l') is less balanced now, but the structure itself is now almost completely different too. What about the Bremer Antiqua if my glyphs are falling? Perhaps I've made a big mistake by doing this. When I've worked my way through the lower case, I'll upload a pdf with text settings. I think that will answer that question.  </p><div class="imageWrap"><img src="http://typophile.com/files/Screenshot_3_4990.png"></div><p></p>
