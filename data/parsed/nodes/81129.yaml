    votes: null
    html: |-
      <p>This reminds me of two things: my own Paphos*, which I started over a decade ago but soon stopped since I realized I wasn't ready to do it right (I'm still not ready); and Bremer Antiqua**, which is of course a much higher compliment. I like this a lot, and it doesn't have to try any harder to be a "typeface in its own right".</p>
      <p>* You can see the "j" at the far right here: <a href="http://themicrofoundry.com/s_latin.html" title="http://themicrofoundry.com/s_latin.html">http://themicrofoundry.com/s_latin.html</a></p>
      <p>** <a href="http://www.typophile.com/node/66461" title="http://www.typophile.com/node/66461">http://www.typophile.com/node/66461</a></p>
      <p>That said, you do have a decision to make: how conventional or not you want this to be. You could end up with a solid, charming, somewhat old-fashioned design; or you could end up with something that will make people (including you) <em>think</em> a little bit (even though it might still <em>seem</em> old-fashioned). The strangeness in the "a" is probably the best example of what might or might not need to be happening.</p>
      <p>This -very personal- decision has to come before any specific glyph critiques can really be worthwhile I think.</p>
      <p>&gt; 8 points its intended size</p>
      <p>Although the ample width might point towards such a smallish size, the vertical proportions are more significant, and there (especially in the longish descenders) I'm seeing 10-11 point.</p>
      <p>hhp</p>
