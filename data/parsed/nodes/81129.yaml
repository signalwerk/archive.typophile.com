    html: |-
      <p>Two units is plenty to see an effect.</p>
      <p>Glyphs are not vases - they don't risk falling down! This is especially true in a text face. Furthermore, imbalance can just as well mean dynamism, which to me seems part of the spirit of this design. A cobra isn't a cobra without that huge head. And a cobra is awesome. So I would be very wary of taming something like the original "s".</p>
      <p>BTW, as you suspect, the "s", binocular "g", and any glyph that's dense <em>needs</em> to look too light when viewed large for it to work well at text sizes.</p>
      <p>&gt; No straight lines.</p>
      <p>Assuming you haven't already, you might like to study the thoughts and work of Evert Bloemsma, who used to say "A straight line is a dead line" (although IIRC he got that from one of his former teachers).</p>
      <p>I myself believe that balancing straight and curved is what's optimal. For one thing, death is a part of life too.</p>
      <p>hhp</p>
