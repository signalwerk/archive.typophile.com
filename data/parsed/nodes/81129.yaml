      <p>Thank you for commenting, Jelmar.</p>
      <p>I've thought the same thing about the upper case myself. But isn't it always like that? I think this typeface needs some kind of serenity in its upper case, as so much is going on elsewhere. And it isn't that conventional, is it? I'd say U, J, G, R (and to a lesser extent the new Q, which no-one has commented on, by the way) are all somewhat progressive for a traditional text face. I tried injecting more of that contrast-trickery into the upper case alphabet, and found it lost character rather than gained. I think almost all upper case alphabets are less fun than their children. Unlike them, the adult letters have a unifying design and inner logic that needs to be there. </p>
      <p>I'll have another look on the 'g'. I'm very satisfied with it waist down, but the upper part may need something. </p>
      <p>Here's an ampersand, basic punctuation and three different question marks. Please help me decide with one deserves further development. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screenshot_9_5347.png"></div><p></p>
      <p>Another thought: Not once while drawing have I been using historical models for my letters, or even looked much at other typefaces. All my previous attempts have been quite east to classify. But which category would you put this typeface in?</p>
    html_clean: |-
      <p>Thank you for commenting, Jelmar.</p>
      <p>I've thought the same thing about the upper case myself. But isn't it always like that? I think this typeface needs some kind of serenity in its upper case, as so much is going on elsewhere. And it isn't that conventional, is it? I'd say U, J, G, R (and to a lesser extent the new Q, which no-one has commented on, by the way) are all somewhat progressive for a traditional text face. I tried injecting more of that contrast-trickery into the upper case alphabet, and found it lost character rather than gained. I think almost all upper case alphabets are less fun than their children. Unlike them, the adult letters have a unifying design and inner logic that needs to be there. </p>
      <p>I'll have another look on the 'g'. I'm very satisfied with it waist down, but the upper part may need something. </p>
      <p>Here's an ampersand, basic punctuation and three different question marks. Please help me decide with one deserves further development. </p>
      <p></p><div class="imageWrap"><img src="/files/screenshot_9_5347.png"></div><p></p>
      <p>Another thought: Not once while drawing have I been using historical models for my letters, or even looked much at other typefaces. All my previous attempts have been quite east to classify. But which category would you put this typeface in?</p>
