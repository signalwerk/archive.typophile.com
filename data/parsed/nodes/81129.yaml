      <p>A different approach: The white of the eye of 'e' now is a morphed version of 'a's internal whitespace. I think this a minor breakthrough. The glyph is a little narrower too, and slightly tweaked in every thinkable way. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screenshot_5_6506.png"></div><p></p>
