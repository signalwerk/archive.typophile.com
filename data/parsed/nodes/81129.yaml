      <p>Ah! But of course! Why didn't I think of that! That tradition (being older than recorded history) has a load of arcane terminology, with countless dialect variations. There's bound to be a name there. I'll pull out my books tonight. </p>
      <p>I'm almost humbled by the adjectives you chose to describe my typeface, Craig. I can only say thank you. Those words certainly renew my inspiration.  </p>
      <p>Trevor, Nordland is a bit too generic, I'm afraid. It's the name of the second largest county, and in Norwegian the name doesn't imply anything marine without -båt attached to it. Besides, my ancestral farm Bremnes is in Troms, which is the neighbouring county. My ancestors would rotate in their graves. "Ballast" would possibly be more suitable for a heavy sans serif, but still of utmost importance in those boats we're talking about. The <a class="freelinking external" href="http://upload.wikimedia.org/wikipedia/commons/0/0b/Seilende_nordlandsb%C3%A5ter.JPG" rel="nofollow">large ones</a> have up to two tons of round stones in them. It would be a nice double entendre, though. I'll consider it, really.</p>
