      <p>Phew, things take time. Been tinkering forever after the last round of critique. This is what I've done (see pdf):</p>
      <p>A: A little weight added both on crossbar and stroke.<br>
      C: Slightly meatier tail.<br>
      D: Weight equalisitation.<br>
      E: A little narrower, some polish<br>
      G: Same shape, but slightly less extreme<br>
      J: Prettier curves under the baseline.<br>
      K: More tension in the foot.<br>
      M &amp; N: Finishing polish<br>
      P: Significantly larger bowl<br>
      Q: Oh boy, oh boy. I've tried a lot of stuff, and wound up with this. Couldn't make a crossing tail model work. That's a shape I just don't understand, obciously.<br>
      R: Polish.<br>
      S: A lot of subtle tweaks.<br>
      V, W: Polish.<br>
      X: Less black, polish.<br>
      Y: Polish.<br>
      Z: Less black, polish.</p>
      <p>Slightly narrower (and weight-compensated) 'm' and 'u'. 'x' is lighter, and significantly tweaked. 'k' is slightly weight-tweaked. And I've made a working "æ", the old was just a leftover from several iterations ago. </p>
      <p><cite>Is "gj" that serious a problem?</cite></p>
      <p>Oh yes. 806 words in Bokmål, 2967 in Nynorsk. Grammatically correct sentences with /gj/ in every word can easily be constructed. Very, very common in Icelandic, Faroese and Albanian too. </p>
      <p><cite>[...] but in the way it seems to say "I've been doing this for a long time - you can trust me."</cite></p>
      <p>That is some compliment. Thank you! (I wish I felt the same way.)</p>
      <p><cite>I wonder whether z could have a spur or two on the serifs or even on its angles.</cite></p>
      <p>Possibly, I have doubts about both zeds, actually. Something to look into tomorrow. Along with numerals (the top terminals on 2 and 3 must go, mustn't they?) and punctuation.</p>
    html_clean: |-
