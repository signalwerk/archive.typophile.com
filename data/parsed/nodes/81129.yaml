      <p>Thank you, Frode! I've been browsing your typeface list, and I have to agree with Hrant. Those g's aren't really similar to ours, they are all (even Ingeborg's) embellishments on the same old structure. Most of them treat the opening like the gap in a renaissance 'P', the stroke is continued, althoug there's no ink there. Our 'g' descenders are much more independent, and they have a terminus. </p>
      <p>Ingeborg (that I haven't at all heard about) is irritatingly similar to my unfinished Mondegreen, by the way). While it's a good typeface, I think it suffers from slighly sloppy curves and lack of attention to micro-detail. Enigma is good, too. </p>
      <p>It looks like the typeface from your list that has the most comparable g's to ours is ITC Italia. But the rest of it looks like a parody of William Morris' parody of Nicolaus Jenson.  </p>
      <p>Hrant, your right (again), I've now come to think that an upwards-pointing ear is inevitable.</p>
