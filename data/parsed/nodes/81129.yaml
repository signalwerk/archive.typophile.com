    html: |-
      <p>Glad you're doing this, and glad you're sharing it here. I love looking carefully at your designs - I think they're all top notch and this is no exception.</p>
      <p>Some observations to take or leave:</p>
      <p>I would consider dropping the /A/ crossbar a little.<br>
      I think the leg of /K/ and /R/ and the tail of /Q/ might be too dark. Maybe in addition /K/'s leg could use more of the straight vs curve tension that the other two have.</p>
      <p>/W/'s middle vertex comes too high to my eye.</p>
      <p>I'd like to see more variations for /e/. It's not the contrast weirdness that bugs me, but it just looks too soft. Is it worth trying a spur (or maybe just the hint of projection like the beard of /G/, which I love)? </p>
      <p>I'm not sold on /y/'s tail terminal. Would a flag terminal like /f/ has work there?</p>
      <p>Diacritics look big--particularly tall, especially circumflex and caron.</p>
      <p>I like the monoline zero, but think it could be a hint darker.</p>
      <p>That four is seriously weird. Not necessarily a bad thing!</p>
      <p>Tittles' rightward placement may be overdone a touch.</p>
      <p>Favorite bits: /E/ is great; /b/c/m/ are all terrific; I like the "upside down" /s/; /2/ is very tightly wound but wonderfully drawn.</p>
      <p>Looking forward to text sizes and settings. I'm eager to see whether that cusp on the right side of /U/ can work without being an eye-catcher.</p>
