    date_raw: 4 May 2011 — 2:53am
    votes: null
    html: |-
      <p>Wow, I'm overwhelmed by the number of comments after my last update. Thank you very much, everyone. </p>
      <p>About the '4': Yes, it is extreme. But keep in mind that this font is intended for 10 points. This typeface will have true optical sizes (not just text and display, but korpus (10 pt), cicero (12), mittel (14), tekst (20), kanon (36). I'd really like to use those traditional names, by the way, but that's something to decide much later), and the larger the size, the more refined and less boxy everything will be (and the curves shallower). I doubt the curve of '4' will scream excess! at 10 points. But yes, I know what to do, and that is thorough testing. For practical reasons, I must do all testing on paper later in the process. </p>
      <p>It seems my '4' (and to some extent the 'g') is a love it or loathe it-glyph. That tells me I'm doing things right.</p>
      <p>Another thing: I begun drawing this typeface as a self-educational, strictly non-commercial one (I'm just a hobbyist), and won't think much about saleability during the drawing process. That may change, though. </p>
      <p>No time for updates today, but stay tuned.</p>
