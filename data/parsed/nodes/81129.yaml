    html: |-
      <p>Differentiating the cases has become a very conscious decision in the making of this design, I've actually exaggerated the differences, the serif treatment are different, the upper case has none of the lower case contrast weirdness. </p>
      <p>About my open g: It stays that way. I've come to think that the s and g, the two loners of the lower case, should resemble one another. That solves a lot of problems, and looks pretty. Harder to read? Not if you're used to it, no way. I think reading Fraktur is frustratingly time-consuming (and my mind often refuses to accept that the "k" is not a "t"), but I'm one hundred per cent certain no-one thought so 150 years ago.</p>
      <p>I'm working on the spacing now, and will post a new pdf with Latin Extended-A support and small caps in a few days.</p>
    html_clean: |-
