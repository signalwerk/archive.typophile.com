      <p>Thank you for yet another invaluable piece of criticism, Ben. Not offputting at all, rather the opposite. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rev1_5815.png"></div><p></p>
      <p>Here's my very first partial revision. I've only concentrated on some of the most important lower case letters. More to follow.</p>
      <p>'e' is now more related to 'a'. Have I've done the opposite of what you both suggested? Feel free to slaughter it. </p>
      <p>'s' is a litter wider, slightly more "upside down" and slightly rotated and fattened, inspired by Bremer Antiqua. </p>
      <p>'d' was faulty, thanks for spotting that, Ben.</p>
      <p>'g' is somewhat tweaked. I didn't quite understand your advice, Ben. Is this any better? </p>
      <p>'f' and 'r' slightly altered.  </p>
      <p>'c' a tiny bit narrower now.</p>
      <p>Except for the 'e' (and perhaps the 's'), these are all rather minor tweaks. Maybe I should follow Hrant's advice and think a lot more on this typeface before I continue drawing. Any way, all your input will be taken into account. Thanks again.</p>
