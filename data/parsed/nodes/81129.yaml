      <p>Hrant, your thoughts on glyph balance and weight distribution makes me happy. I'm a lot less experienced than you, but it seems we have drawn somewhat similar conclusions. Thank you for your cobra metaphor, I'll remember that. (I learned vector drawing from designing traditional Norwegian boats (descendents of Viking æra vessels, still built (in unbroken tradition) in the Western and Northern parts of Norway); their seemingly idiosyncratic hull shapes ("cod in the front, mackerel in the back") makes sense first when on water. I think a text face works much in the same way.) </p>
      <p>Yes, I've studied Bloemsma, and even sketched a couple of faces based on his principles, more or less. Here are some glyphs from one of them: </p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/Screenshot_7_6484.png"></div><p></p>
      <p>I now realise that this is the true beginning of the typeface this thread is about.</p>
      <p>My decision to use only curves in this typeface is one I made only because restrictions fuel my inspiration. Also, this is my last typeface made for purely self-educational reasons. Next time, it's serious. No such rigid rules then. (A critic once said that Richard Wagner's music is much better than it sounds. I feel the same way about Evert Bloemsma.)</p>
      <p>Craig, thanks for printing. I've adressed the issues you brought up. No more drawing today, but I'll start refining the upper case tomorrow.</p>
