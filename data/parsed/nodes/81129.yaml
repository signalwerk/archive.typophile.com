    user: 1250
    date: 2011-04-14T10:10:00
    date_raw: 14 Apr 2011 — 10:10am
    votes: null
    html: |-
      <p>I'm not holding back.  :-)<br>
      I just think any ideological decision is personal so it has to come from you; all I can do is try to help reveal the issue. Until you settle on the spirit of the design any specific glyph critiques risk becoming moot.</p>
      <p>That last "e" fits with the rest. The troublemaker -in the best possible sense- is the "a". You might actually leave it that way - for a text font it's not going to jump out; it might even become a conversation piece (like the [in]famous "g" in Meta). Or you could tame it, get over it*, and polish the font away. The hardest thing -again, in the best possible sense- would be to let the "a" trigger a full re-evaluation of the font - perhaps even hibernating the design again...</p>
      <p>* It's a maxim of sorts that -for a text face-<br>
      one must discard the most beautiful glyph.</p>
      <p>hhp</p>
