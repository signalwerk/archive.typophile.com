    html: |-
      <p>Dreamhost will likely suit your needs. Their offerings are best suited to sites that don't get a *lot* of traffic (this being in excess of 100,000 visitors daily). </p>
      <p>I've hosted a number of sites with them for many years and couldn't be more pleased with the level of service for the price. Mediatemple is another solid host (which I also use), but the real advantages of their offerings aren't realized until you need to handle really substantial traffic or database loads. I'm talking about volume that's inappropriate for their less expensive packages.</p>
      <p>Things look bleak when you research hosts of a reasonable size online. The most vocal customer in that business is the upset customer during a temporary outage. Happy customers typically have little reason to say so.  </p>
      <p>If you're not really sure and you're deciding between these two, go with Dreamhost. If you outgrow them, it's fairly trivial to migrate to another host like Mediatemple when the need arises.</p>
