  html: <p>The Web Font Awards is accepting submissions. If you're hearing about it for the first time, the Web Font Awards is a design competition for sites using Web fonts. The competition is open to users of any form of Web font implementation that uses an @font-face declaration (including self-hosted solutions). Visit <a class="freelinking external" href="http://www.webfontawards.com" rel="nofollow">http://www.webfontawards.com</a> to enter or rate the submissions. Official rules here <a class="freelinking external" href="http://www.webfontawards.com/official-rules" rel="nofollow">http://www.webfontawards.com/official-rules</a></p>
