    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Quiosco_456_6553.gif"></div><p></p>
    <p>Already available on newsstands everywhere, so to speak — <a href="http://www.fontbureau.com/fonts/Quiosco/" rel="nofollow"><strong>Quiosco</strong></a>, designed by <a href="http://www.fontbureau.com/people/CyrusHighsmith/" rel="nofollow">Cyrus Highsmith</a>, is now part of the Font Bureau Retail library and available for licensing and download. </p>
    <p>While initially conceived for newspaper text, Quiosco has also found gainful employment in a variety of magazines — <em>Sports Illustrated</em>, <em>TV Guide</em>, <em>Outside</em>, and <em>The Hollywood Reporter</em>, to name-drop just a few.</p>
    <p>With Quiosco, Highsmith continues an examination of themes and possibilities which he first explored in Prensa, inspired by the work of W.A. Dwiggins — specifically a dynamic tension between inner and outer contours. However, the crackling, electrical energy of Prensa here gives way to a more fluid, mercurial muscularity in Quiosco. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Quiosco-SI_456_6479.gif"></div><br>
    <em>Quiosco, as seen in the pages of Sports Illustrated, circa 2009.</em><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Quiosco-Outside_456_6415.gif"></div><br>
    <em>From the current issue of Outside magazine.</em><p></p>
    <p>The new Quiosco premium fonts include the FB Extended Latin <a href="http://www.fontbureau.com/fonts/Quiosco/characters/" rel="nofollow">character set</a>, which covers all major languages and dialects written with the Latin alphabet, plus a host of professional <a href="http://www.fontbureau.com/fonts/Quiosco/ot/" rel="nofollow">OpenType layout features</a> including small caps, ligatures, both lining and oldstyle figures (plus tabular forms of each), and fractions.</p>
    <p><a href="http://www.fontbureau.com/fonts/Quiosco/" rel="nofollow"><strong>Quiosco</strong></a> comes in six styles (three weights): Regular &amp; Italic, Semibold &amp; Semibold Italic, and Bold &amp; Bold Italic.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Quiosco_langs-2_5220.gif"></div><br>
    <em>Quiosco supports Spanish, Slovak, Czech, Turkish, Polish, Latvian, Hungarian, and many more.</em><p></p>
