    html: "<p> Food: Along with alphabet soup, there's Alpha-Bits cereal, candy letters, letter-shaped cookies/biscuits, and even letter-shaped pancakes. <br> <br>There are letter-shaped notepads, keychains, bookends, candleholders, and the like, which function as monograms or identification in addition to their more obvious uses. <br> <br>How about beads with letters on them that are made into personalized necklaces and other jewelry? <br> <br>Also, customized vanity license plates serve the dual functions of vehicle identification and personal expression. <br> <br>David </p>"
