    html: <p> Military Dogtags, Lit Exit Signs, Debossed Tire Tread Inflation Specs, Vintage Bricks Embossed with Company's Name, Illuminated Elevator Buttons, Country Design Napkins, Themed Adhesive Bandages, Pyrex Liquid Measuring Cup, Coffee Maker Water Indication Fill Lines, M&amp;Ms, Andes Mints, Alphabet Soup, DYMO Lables, Old School Typewriter Balls, Fruit Roll Ups w/ Die Cut Letters, Tic Tac Toe - any application, Scrabble . . . <br> <br>I think alphabet soup is my favorite - not only are the letters decorative, they also serve to enhance the 'body' of the soup as a pasta. <br> <br>Stuart :D </p>
