    html: <p> A while back I thought it would be interesting to collect images of that sort with my digital camera for future reference. Some of the categories that came to mind included public space, office area, private home and everything else out there. Public space could include everything from a parking street meter to that generic closed store sign that shows when it's open. Office could have the hold button on a telephone all the way to the postal systems stamp over a letter. Misc. could include that "Hello my name is" sticker to the type on the outside of a light bulb. As a side note, I'd be interested in reading the article when your finished... <br> <br>m </p>
