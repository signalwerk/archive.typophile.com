    html: <p>hopefully this post isn't too confusing. <br> <br>when i considered functional type to meaning, i equated it with its form. lets say i were to copy the aesthetic of a postal systems stamp {that stamp the postal office puts on a the stamp that you put on an envelope} and change the words of that system stamp to something that really didn't relate to its form. if i was a person that takes visuals for granted, perhaps I'd look at that circular mark and understand through its form that its gone through the mail system. if that's the case than its functional to me. <br> <br>w/ all that said though, i think that if a letter that a sign maker has produced works for support for a bird as a home for its nesting materials then whom i'm a to disagree w/ its function? i hadn't considered that materlal aspect as much as i will now which is very cool in that if the original question hadn't been asked i would be no further ahead.</p>
