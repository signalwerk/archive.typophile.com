    html: <p> LAX (airport) and Disneyland both have letterforms as 'public art'. At Disneyland California (a newer theme park right next to Disneyland) people snap pictures of their subjects sitting in the counters of the letters. The letters are roughly 15 feet high and spell out California. <br> <br>Never been to the Trajan column, though. </p>
  - id: 11550
    user: 533
    date: 2002-07-18T16:25:00
    date_raw: 18 Jul 2002 — 4:25pm
    votes: null
    html: <p> I also thought of the gardens at Disneyland, where the flowers are arranged in the form of the Disneyland logotype. There's also the "HOLLYWOOD" sign (formerly "HOLLYWOODLAND") which could qualify as public art, or at the very least, a major landmark. <br> <br>Here in Utah, high schools, colleges and universities have enormous whitewashed concrete letters embedded in the sides of mountains (Brigham Young University's "Y" or the University of Utah's "U"). An extention of this was the huge light sculpture of the Olympic rings which adorned the mountain near the "U" at the Salt Lake City Olympics. <br> <br>I also came up with children's building blocks -- the cubes with letters and numbers marking the faces of the cube. They can be considered educational as well as recreational. <br> <br>David </p>
  - id: 11551
