    html: <p> What about type on medicines and hospital equipment. I remember a news paper article about a case where a doctor administered the wrong medicine because the packaging and typography was almost identical to something else.I think the patient actually died. <br> <br>Also type on packaging boxes that reads  <br>THIS WAY UP or FRAGILE. <br> <br>Off topic but are there different styles of braille obviously keeping the same dot pattern <br>but instead of dots, raised squares/stars to give certain words more importance like warnings on hazardous liquids like bleach? <br> <br>Hope this helps. </p>
