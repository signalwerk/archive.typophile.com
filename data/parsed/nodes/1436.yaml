  - id: 138164
    user: 1203
    date: 2002-07-19T16:03:00
    date_raw: 19 Jul 2002 — 4:03pm
    votes: null
    html: <p> Thanks a million everyone. The suggestions are great! You've really filled my head with tons of ideas. I love the alphabet soup. <br> <br>I'm looking at this from an Irish perspective naturaly because I live in Ireland. The reason I want to write articles like this is because in Ireland there is a serious lack of interest in typography, something I want to address. We have never been famous for our designs, unlike the Netherlands, and I think it boils down to people becoming too safe in their offices sitting in front of their computers. I want them to read about design and not be overwhelmed by the technicalities (such as ledding and EMs). I would like them to perhaps look at design from a slighty different angle than they normally would. It would pleasure me to think that someone on the bus would go "hey thats what that guy was on about" as they drove past an aspect of design after reading one of my articles. <br> <br>So here I go on my merry quest... <br>=) </p>
