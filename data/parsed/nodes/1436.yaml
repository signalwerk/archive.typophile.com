    html: "<p>why yes supreme knower of all, <br>it did for me at least when I realized I had to lay out a magazine in Ethiopic and was informed of the new fonts they've just released for communication....before it was either that or scanning the articles or english. <br> <br>here's some background from: <br><a href=\"http://www.ethiopic.com/index2.htm\" target=\"_top\">http://www.ethiopic.com/index2.htm</a> <br> <br>Ethiopic or Geez is one of the oldest alphabets and has been in use in Ethiopia for more than 3,000 years. Until we computerized Ethiopic, the alphabet was printed manually or in the printing presses. Starting in 1982 we have taken the beautiful Ethiopic through DOS (ModEth, 1988) and Windows 3.0, 3.1 and 95. We have continued to develop applications for communicating with Ethiopic scripts via e-mail and the Internet since 1994. Our Ethiopic scripts contain the 480+ characters and require a maximum of two keystrokes to type each character. Our clients have started enjoying Ethiopic HTML (and HDML) on the information superhighway. Our sites are under continuous construction and the pages will have many language alphabets. Currently most of our Ethiopic web pages are in English and Amharic (Aírµ) languages. We expect to see documents in many of the languages of this historic African region in the near future. As of January 1997, Ethiopia has obtained limited access to the Internet and this has enabled Ethiopians to see our multi-lingual site for the first time. However, the use of Ethionet requires prior publication of Ethiopic documents using our software.  <br> <br>These pages are also dedicated to Ethiopic and the technology we have been developing and standardizing for it. You will find some free software or links to software for use with Geez documents. We will have many links to Ethiopic and Ethiopia related references, news, lessons, products, advertisements, organizations, entertainment, etc. in Amharic and English. This is the multi-lingual Ethiopic information superhighway at its infancy.  <br> <br>Our products are protected through pending patent, copyright, trade secrets, etc. We have also submitted patent application to the Ethiopian government though there was no patent protection in Ethiopia. (In spite of these, our fears have come true by the proliferation of copycats to plagiarize our products. Beware of copycats who would try to peddle incomplete character sets and macros as Ethiopic software. None of the copycats can type the Ethiopic characters using two keystrokes or less per character or post Ethiopic documents on the Internet. Click here to read about our concern and elaboration on this topic.) Click here for the Amharic version of this introduction.</p>"
