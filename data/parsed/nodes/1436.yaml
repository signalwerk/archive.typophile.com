    html: <p> Ian, I think you're trying to get at something  <br>more tangible, like when type goes beyond visual  <br>communication to function as something else  <br>entirely. In your example, type must provide grip  <br>on a man-hole cover. It's no longer just type,  <br>it's actually a texture with a purpose. <br> <br>I can only think of a couple, like type on the  <br>soles of shoes that also provides grip. <br> <br>How about the raised letters on credit cards so  <br>one can make a rubbed transfer of the info? <br> <br>Or how about when birds nest in the counters of  <br>large signs. <br> <br>Or when the type on a medicine bottle is raised  <br>so that it can't fade or be rubbed off, which  <br>also provides grip. <br> <br>Am I taking your example way too literally?  <br>If so, please kill me quickly. </p>
