    html: <p> you could start the book with byzantine art leading to illuminated manuscripts. the Drop cap often having a dual purpose, 1) for starting the passage, 2) an illustration.  <br> <br>I don't know if this fits (maybe just functional typography with no other purpose then simply functional) AMBULANCE...often printed backwards and reflected so we can read it in rearview mirrors at the flip of a dime.  <br> <br>telephone buttons - after its stardard 3x4 rows of digits, even if the printing has rubbed off we associate a pattern of dailing a number without seeing the number. keyboards work on the same concept. letter forms arranged in a functional manner that facilitates typing - and then how that invention almost westernized the whole world's form of cummunication. Ethiopia for example having to adopt the roman alphabet, transforming their entire language into 2 different modes. </p>
