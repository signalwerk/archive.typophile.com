      <p>If you are concerned with the word “Volume” cutting into the title, then don’t worry about it, language difference is enough. Just an idea regarding the word at the bottom…<br>
      BE33AKOHNR- BE3 translates as “without” 3AKOH = “law” and NR is just an suffix,<br>
      you might play with that a bit…<br>
      Well good luck with your design.</p>
