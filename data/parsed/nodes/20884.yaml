    <p>Need some advice on this type/image I'm working on for press kit that will go to Russian media outlets. This is my first draft. The final design will be screen printed on ready-made presentation folders, a bright color on a dark colored folder. The Russian title translates roughly to "Rock against Racketeers", the story is about a theatened music equipment factory in Russia.</p>
    <p>Not being a Russian-speaker I'm having some trouble determining if this design will read with my Russian audience. I've consulted with a Russian friend regarding mixing the English and Russian, and he thought Russians would know the word VOLUME since most sound equipment they buy has English labels, but he didn't see it as separate from the title and part of the image.</p>
    <p>How does this read to you? Does it seem like part of the title, or is the language variation enough to separate it?</p>
    <p>Any other comments on type/design (whether you know Russian or not) are also appreciated.</p><div class="imageWrap"><img src="http://typophile.com/files/RussianDesign_3726.jpg"></div><p></p>
