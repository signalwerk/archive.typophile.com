    <p>Hi everyone <br> <br>My name is Ragnar and I am from Iceland. <br>I am doing my Bachelor Degree essay on International Typographic Style and was wondering if you could point to me some resources (Books, websites, persons etc.) on the subject? I have been doing a lot of research but I still think I need more material to make this a good essay. So if you have anything that I might be missing please post it on this thread. <br> <br>P.s. I am writing about ITS in regards to the post-war situation and if graphic design could ever be totally mechanised through the principles of the grid system and "Swiss Typography". <br> <br>Thanks you very much, <br> <br>Ragnar Freyr <br><a href="http://www.onrushdesign.com" target="_blank">www.onrushdesign.com</a></p>
