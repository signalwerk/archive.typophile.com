    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Books" class="freelinking" rel="nofollow">Books</a> : <em>Fonts &amp; Logos</em></strong></p>
    <p>By <a href="/wiki/Doyald%20Young" class="freelinking" rel="nofollow">Doyald Young</a>, published by his own <a href="/wiki/Delphi%20Press" class="freelinking" rel="nofollow">Delphi Press</a>. This lengthy, expensive, oversized analysis of commercial lettering and typeface design can be seen as both a sequel and a replacement for Young's earlier manual on the subject, <a href="/wiki/Logotypes%20and%20Letterforms" class="freelinking" rel="nofollow">Logotypes and Letterforms</a>. It contains general typographic reference material, in-depth analyses of the special features of several classes of typeface, and an in-depth explanation of the creative process he used in revising the <a href="/wiki/logo" class="freelinking" rel="nofollow">logo</a>, <a href="/wiki/logotype" class="freelinking" rel="nofollow">logotype</a>, and corporate identity of the Prudential Corporation.</p>
    <p>Like the earlier book, <em>Fonts &amp; Logos</em> is clearly a product of Young's own preferences: <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> (under whom Young studied) and <a href="/wiki/Morris%20Fuller%20Benton" class="freelinking" rel="nofollow">Morris Fuller Benton</a> (and <a href="/wiki/ATF" class="freelinking" rel="nofollow">ATF</a>) are benevolent sprits present in most of  Young's work, and Young's joyous love of baroque scripts gets the better of him on more than one occasion. His design work can get a little fusty, although the many tight pencil and pen comps he includes as examples are marvelous to see. For a visual analysis of typeface construction and the process of logotype design, it is unequalled, and Young's voice is a friendly, inviting one, sharing rather than lecturing, descriptive rather than prescriptive.</p>
    <p>His West Coast location has given him many opportunities to work throughout the Pacific Rim, and it's interesting to see how his conservative, wealthy Japanese clients have ended up using Western design idioms to signify elegance, wealth, and class. Also, being in Los Angeles has given Young many opportunities to work in television, and it's striking how much his work defined the look of television in the 70s and 80s. Here, too, though, some fussiness and camp begins to creep in, and so devotees of cutting-edge European minimalism will probably be somewhat put off by his rococo American style. However, his examples are all real examples developed for real clients, and there are many of them, so unlike just about every other book on logo design, this one leaves you with a solid idea of how the play of give and take works in real-world design.</p>
