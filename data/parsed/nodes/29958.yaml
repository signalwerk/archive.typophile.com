  html: |-
    <p>I am in Australia and am shortly going to be travelling to the UK and Europe. While there, I was hoping to go on a bit of a type tour - looking at places and things of typographic significance.</p>
    <p>What suggestions of places and things to see do people have? This may be an interesting list to make into a sticky post too.</p>
    <p>Things I'm thinking of are:</p>
    <p>type foundries<br>
    presses<br>
    museums<br>
    typographers birth places/places of work<br>
    examples of fonts</p>
    <p>etc.</p>
    <p>Thanks!</p>
