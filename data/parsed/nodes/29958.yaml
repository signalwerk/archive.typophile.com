    html: |-
      <p>Just a brief start…</p>
      <p>St Bride Printing Library, London<br>
      Victoria &amp; Albert Museum, London<br>
      maybe the University of Reading, UK</p>
      <p>Gutenberg Museum, Mainz, Germany<br>
      Klingspor Museum, Offenbach, Germany (depending on the exhibition, at least)<br>
      Lots of bookstores in Berlin</p>
      <p>Plantin–Moretus Museum, Antwerp</p>
      <p>Rome (all of it)<br>
      but I particularly enjoy the lettering at Santa Maria in Trastevere, the Vatican, St Paul's Outside the Walls, and the Forum</p>
      <p>Florence (all of that, too)<br>
      But Santa Croce may have the most lettering</p>
