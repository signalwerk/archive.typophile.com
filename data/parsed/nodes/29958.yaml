      <p>If you end up in Provence, stop by Arles for the Museum and the Necropolis. Both feature Roman sarcophagi and tombstones inscribed with text and all sorts of crazy custom ligatures, IIRC most of the Roman goodies date from ~0 to ~1000 AD.</p>
      <p>And I second the notion of digging deep into Florence. It's an amazing place.</p>
