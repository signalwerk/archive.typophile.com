    html: |-
      <p>A further note about the special characters:</p>
      <p>You may notice this line in the screen shot above:</p>
      <p>AaÄÅ á-ã ÀÃÂÁ</p>
      <p>This was originally entered something like this:</p>
      <p>AÄÅÀÃÂÁaááåäâã</p>
      <p>When you click “OK”, FOG rearranges the characters in ASCII order and compresses the list (if possible) using the special hyphen character. The hyphen means “through”. The run of a’s with accents I typed happen to be consecutive characters in the Mac Roman encoding when listed in ASCII order. The spaces separate the shorthand notation from the rest of the list.</p>
      <p>The straight quote is the escape character. I’m not sure what the comma or exclamation point are used for.</p>
