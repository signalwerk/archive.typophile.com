      <p>I could be mistaken, but it sounds like you want to adjust sidebearings—not kerning. (Kerning overrides the sidebearing values for specific character pairs.)</p>
      <p>You can copy left or right sidebearing values from one character to any number of other characters using the “Set Metrics...” command. The options should be pretty easy to figure out.</p>
