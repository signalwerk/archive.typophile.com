      <p>Okay. It’s coming back to me.</p>
      <p>Here is the KA dialog box for an all caps font which has duplicate caps in the lowercase positions:</p>
      <p></p><div class="imageWrap"><img src="/files/ FontographerScreenSnapz001.png"></div><p></p>
      <p>(This is in FOG 4.7 (demo), but it works the same in any FOG 4.0 or later. I don’t know why there are some strange characters in some of the rows. Just ignore them.)</p>
      <p>Note that in the first field are a bunch of A’s, both upper and lowercase. The design of these characters is identical for kerning purposes, so they are “equivalent first letters”, the left-hand letter in a kerning pair. The field the two T’s is another set of equivalent characters for the right-hand position. Don’t worry about the “link all” check boxes for now.</p>
      <p>What this first row says is that every pair composed of a character from the left and one from the right will have the same kerning value. If you change the kerning value of any of these pairs (using the Metrics window), the others will change automatically, as if they are all marching in lock step. So, if you change AT, you are also changing At, aT, at, áT, Åt, etc. The reverse is also true.</p>
      <p>The “link all” check boxes let you take a shortcut in certain situations. Let’s say you have the following pair equivalents set up:</p>
      <p>F&nbsp;&nbsp;&nbsp;&nbsp;[x]&nbsp;&nbsp;&nbsp;&nbsp;AÅÁÀÃ&nbsp;&nbsp;&nbsp;[x]<br>
      P&nbsp;&nbsp;&nbsp;&nbsp;[x]&nbsp;&nbsp;&nbsp;&nbsp;AÅÁÀÃ&nbsp;&nbsp;&nbsp;[x]<br>
      T&nbsp;&nbsp;&nbsp;&nbsp;[x]&nbsp;&nbsp;&nbsp;&nbsp;AÅÁÀÃ&nbsp;&nbsp;&nbsp;[x]</p>
      <p>(Pretend the x’s are the check boxes.) F followed by any of those As will have the same kerning value. Same with the P and T. This is a bit redundant, and it would seem that you need to do it this way unless you want FA, PA, and TA to have the same kerning value. BUT, by unchecking one of the “link all” boxes you can combine these into one row:</p>
      <p>FPT&nbsp;&nbsp;&nbsp;&nbsp;[&nbsp;&nbsp;]&nbsp;&nbsp;&nbsp;&nbsp;AÅÁÀÃ&nbsp;&nbsp;&nbsp;[x]</p>
      <p>The F, P, and T are not linked to each other and will have independent kerning values with regard to the As. So, if you change the FA kerning pair, the FÅ pair will also change, but not PA, PÅ, TA, TÅ, etc. The limitation is that it’s an all or nothing proposition. If you want the F and T to be linked, but not the P, then you can’t put them in the same row. You would need one row with the F and T, and another row for the P.</p>
      <p>Note: At least one of the two check boxes should always be checked. If both boxes are unchecked, then nothing in that row will be linked, and whatever you put in that row will have no effect on the kerning, as if the row did not exist.</p>
      <p>Normally, you will want both boxes checked and not bother with this unlinking option. It just makes things more complicated and less flexible for very little gain.</p>
      <p>Also, normally you will leave the “make new pairs” option checked. If it is off, KA will only affect existing kerning pairs and not generate new pairs, which is usually why you use KA in the first place. There are, however, situations in which you want to, say, clean up inconsistent kerning pairs without generating new ones. Also, using KA with “make new pairs” on can potentially generate a lot of pairs which will never be used in the real world. After you’ve used KA to generate all the pairs you need, you can turn this option off and delete the extraneous pairs. The pairs that are left will still be linked.</p>
      <p>One other thing: Certain characters (single-straight-quote, exclamation, comma and hyphen) have special meanings in the KA window. As a result, you can’t include them in character lists just by typing them. There is a simple way around it: Just use a single quote before the character (” or ’- or ’, or ’!). You can see an example of this in the third row, second field (’,). [edit: Typophile’s formatting genie is messing with my straight quotes.]</p>
