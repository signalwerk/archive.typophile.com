    <p>I’m building a font using fontographer 4.15 on a mac and could use some advice. In my font the lowercase characters are exactly the same sizes but with some minor tweaks as the uppercase ones. I have kerned the uppercase charcters and want to apply the same kernning values to the lowercase characters without having to go through them all manually again. Is there a function to apply the values from the uppercase to the lowercase? Maybe using kerninng assistance can do it but I don’t know how to use it. Thanks for your time.</p>
