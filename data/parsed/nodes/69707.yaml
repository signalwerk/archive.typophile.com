      <p>Frank, can you tell me how your XP system is set? If you do the following</p>
      <p>To activate ClearType in Windows XP right click on the desktop and select 'Properties', select the 'Appearance' tab and press the 'Effects…' button. Check the tick box next to the words 'Use the following method to smooth edges of screen fonts;' and select 'ClearType' from the drop down box. Close the Effects dialog by clicking Okay and click 'Apply' to complete the process.</p>
      <p>if 'Use the following method to smooth edges of screen fonts button is not selected, you will most likely see the uneven stem widths. if you choose 'Use the following method to smooth edges of screen fonts, then choose 'standard' you will see Greyscale, and if you choose ClearType, you will see ClearType. </p>
      <p>the uneven stem widths, is a lack of x-direction hints to control stams, so it looks like the font is not otimised for black and white.</p>
