    html: |-
      <p>On XP, the usual default setting is 'Standard' font smoothing. What this means is that the rasteriser applies font smoothing as specified in the font gasp table. Typically, this results in aliased text sizes at which main stems are fitted to a single pixel thickness, and greyscale antialiasing kicking in at the size at which those stems jump to two pixels. Often, greyscaling will also be turned on at very small sizes e.g. &lt;9 ppem, for which hints are not provided. A typical text face will have gasp table settings something like this:</p>
      <p>&lt;9 ppem = antialiasing only<br>
      9–18 ppem = hinting only (aliased)<br>
      &gt;19 = hinting and antialiasing</p>
      <p>Note that this applies specifically to TrueType fonts.</p>
      <p>I say ‘usual default’ because it is possible for an OEM distributor, such as a computer manufacturer shipping a machine with Windows pre-installed, to set different defaults.</p>
