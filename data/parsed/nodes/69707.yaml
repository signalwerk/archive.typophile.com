    html: <p>In compatible widths ClearType the m @ 12 px is narrower as it had to match the black and white hinted width. I think you mean gridfitted Greyscale showing the m @ 9 pixels wide. In gridfit mode, the m is hinted to be narrower than the outline, to maintain symmetry @ 12px = m is 9 pixels in total width from left stem to right, with a 3 pixel white space for interior, left and right. If you disable hinting and just show Greyscale, you will see the m is wider. the Greyscale mode you are referring to, which is hinted, will never be seen at this size as the GASP will disable Greyscale, and only show the black and white bitmap.</p>
