      <p><em>4. The font has a GASP table that may disable smoothing at some sizes. Why?</em></p>
      <p>Legibility studies reliably indicate that stroke density is important to reading and that making some strokes grey instead of black undermines letter recognition. None of which should be surprising. When a stem is being represented by a single pixel width, black and white aliased rendering (presuming a well hinted producing legible bitmaps) performs better than greyscale antialiased text because it maintains stroke density. This is why the GASP table exists and why it is typically set as it is. Compare (aliased top, antialiased below):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/a2aa_6344.png"></div><p></p>
      <p>In contrast, ClearType antialiasing does a much better job of retaining stroke density due to its colour filtering technique, and of representing the true weight of stems in the x-direction due to its subpixel rasterisation:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/timesct_3534.png"></div><p></p>
      <p>Which is why ClearType rendering ignores the GASP table settings and applies its anti-aliasing at all sizes.</p>
      <p>Of course, ClearType has other issues that are evident at lower resolutions, notably colour fringing. Which is why some users will still prefer 'Standard' rendering.</p>
      <p><em>5. The font might be (should be) hinted. Will these hints be used at all sizes regardless of the GASP table?</em></p>
      <p>The GASP table has three settings:</p>
      <p>antialiasing only<br>
      hinting only (aliased)<br>
      hinting and antialiasing</p>
      <p>Generally speaking, the antialiasing only setting is used only for very small sizes, e.g. &lt;9 ppem, or occasionally for very large sizes; that is, for sizes too small to produce legible b/w bitmaps and for sizes too large for hints to have much effect anyway.</p>
      <p><em>I’m more interested in knowing if I can trust “web fonts” to look like they should...</em></p>
      <p>How should they look?</p>
