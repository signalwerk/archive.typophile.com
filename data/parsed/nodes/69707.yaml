  html: <p>Does Win XP have font smoothing (not standard greyscale, neither cleartype) turned off by default? Every computer running Win XP I've seen have had it turned off, and the owners usually don't even know you can change the settings. The rendering samples from Typekit and likes are quite misleading if this is the default setting.</p>
  html_clean: <p>Does Win XP have font smoothing (not standard greyscale, neither cleartype) turned off by default? Every computer running Win XP I've seen have had it turned off, and the owners usually don't even know you can change the settings. The rendering samples from Typekit and likes are quite misleading if this is the default setting.</p>
