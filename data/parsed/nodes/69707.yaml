      <p>David: <em>With the implication, of course, that an alternative solution to the all-or-nothing of ClearType might help many aliased users over the hump into anti-aliiasing.</em></p>
      <p>I'm not convinced that's the implication. From a readability perspective, I suspect a lot of users are better off with well-hinted aliased text than they would be with any antialiasing model that reduces stroke density, and that includes e.g. Apple's Quartz rendering. ClearType is the only antialiasing technology that does a good job of maintaining stroke density. In another thread recently, you suggested at ‘to be safe, one would want a font where all the main stems have become 2-pixels-worth of the em’, but that's cheating: once one is up to that kind of weight, stroke density is guaranteed for such stems regardless of AA method, but a) I don't think setting everything in Bold is the answer to screen readability and b) with anything other than ClearType horizontal hairlines will still turn a paler shade of readable.</p>
      <p>[There's a syntax error in your link to the gasp table spec, David: a trailing " at the end of the URL.]</p>
