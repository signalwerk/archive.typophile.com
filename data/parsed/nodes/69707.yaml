    html: <p>Actually, font smoothing is enabled on XP by default. It is up to the designer of the font to set the GASP table to tell the system when to enable Greyscale for a particular font. In the case of Verdana and Georgia, the GASP is set to disable greyscale at reading sizes, as John mentioned above. You can set the fonts GASP table to always render in greyscale, when standard font smoothing is enabled, if that is what you consider best.</p>
