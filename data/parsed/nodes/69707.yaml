      <p>@Frank:<br>
      Let’s break it down:</p>
      <p>&gt;&gt;Font smoothing is either off or on in the OS (I have to count from XP and up, where it’s “on” by default). Can we get a clear answer regarding XP, something official? </p>
      <p>John touched on this at the beginning of the thread. OEMs could set the default setting on their shipping machines with Windows preinstalled, in the XP timeframe.</p>
      <p>&gt;&gt;Some web browsers override the OS settings (Safari on Win).<br>
      I believe that Safari on Windows now defaults to Windows Rendering.</p>
      <p>The font might be (should be) hinted. Will these hints be used at all sizes regardless of the GASP table?<br>
      Yes</p>
      <p>&gt;&gt;A selected few fonts (Verdana/Georgia) are hinted more extensively. What is the difference between this and basic hinting (other than the price tag)? </p>
      <p>the difference is in the details, as alway in high quality type design. Spacing is highly controlled in Verdana and Georgia, and details for example serifs in Georgia,are hinted in a consistent manner. Basic hinting may be good enought to clean up a font for screen display, but may miss out on some details that will ultimalty let the font down, some hinting control missing on a serif, or a crossbar somewhere, and this detail becomes obvious.</p>
