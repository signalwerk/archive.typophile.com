    html: |-
      <p>Every XP system I ever had came with Standard font smoothing on by default.</p>
      <p>Again, one thing you need to be aware of when reading e.g. support forum questions about this is that if users are looking at typical text sizes with Standard font smoothing turned on, they're not going to see any smoothing in most cases because the typical font gasp table turns off smoothing at those sizes. This is confusing for a lot of users, who don't understand that smoothing is size specific in the Standard mode; whereas in ClearType mode it applies to all sizes.</p>
    html_clean: |-
