      <p>Thanks Kent!</p>
      <p>&gt;Basic hinting may be good enought to clean up a font for screen display, but may miss out on some details that will ultimalty let the font down, some hinting control missing on a serif, or a crossbar somewhere, and this detail becomes obvious.</p>
      <p>But beyond controlling all the serifs and crossbars, (which I consider to be basic hinting), hints for CT require more than simply writing perfect instructions. It also requires testing them against the actual scaling and rendering to see how CT has interpreted those instructions, and then fiddling to make up for this non-standard interpretation. This is new to the process.</p>
      <p>If one looks e.g., closely at the instructions and results of GS vs CT on a 12 pixel Verdana l.c. m, the issue is clearer, perhaps. The GC rendering shows an m that's 9 pixels wide, the CT rendering is a whopping 13 pixels!? Same instructions!</p>
      <p>Cheers!</p>
