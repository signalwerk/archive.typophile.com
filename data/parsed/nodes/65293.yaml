    <p>Anyone up for an impromptu battle of Type ID skills?</p>
    <p>I've been digging through our archives, and found these (gasp!) zero-response posts from January 2009 that never got solved. I'm teeing them up for you Type IDers who love a good mystery.</p>
    <p>If you solve them, respond on the respective thread and let us know back here if you've closed it out. Can we get them all?</p>
    <p>We'll track the results (who solved it, and how fast) and post a scoreboard here as they're solved. The timer starts as of this posting.</p>
    <p>Ready.. Set.. Go!</p>
    <p>// SANS<br>
    <a href="http://typophile.com/node/53219">anyone know the id of this font?</a><br>
    <a href="http://typophile.com/node/53438">Ronan Bennett - "Zugzwang" condensed gothic</a> / SOLVED by Jan, Justin_Ch<br>
    <a href="http://typophile.com/node/53797">Can you identify this font?</a><br>
    <a href="http://typophile.com/node/54024">Can anyone name this font or find something simliar?</a><br>
    <a href="http://typophile.com/node/54207">Need help ID'ing this one</a> / SOLVED by Rasmus Michaëlis </p>
    <p>// SERIF<br>
    <a href="http://typophile.com/node/53156">BIRRA MORETTI</a> / SOLVED by Mike Yanega<br>
    <a href="http://typophile.com/node/54147">Help please, can you ID this font? thx</a></p>
    <p>// DISPLAY<br>
    <a href="http://typophile.com/node/53135">any clues?</a><br>
    <a href="http://typophile.com/node/53378">looking desperatly for the name of this font</a><br>
    <a href="http://typophile.com/node/53633">Two fonts for One Drop</a><br>
    <a href="http://typophile.com/node/53775">Grunge font identification</a> / SOLVED by JL<br>
    <a href="http://typophile.com/node/53979">500 - Chunky font - any ideas?</a><br>
    <a href="http://typophile.com/node/54084">What font is this?</a></p>
    <p>// SCRIPT/HANDWRITTEN<br>
    <a href="http://typophile.com/node/53721">solutions font id</a> / SOLVED by himasf<br>
    <a href="http://typophile.com/node/53774">Can anyone identify this font</a></p>
    <p>// BLACKLETTER<br>
    <a href="http://typophile.com/node/54087">Book cover typeface</a></p>
