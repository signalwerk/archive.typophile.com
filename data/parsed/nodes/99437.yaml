    html: |-
      <p>hhp: "Ballpark Weiner is almost certainly an illegal clone of Falkner Pro"...</p>
      <p>Certainly NOT.  Of Ballpark Weiner and Falkner Pro, the most recent is Falkner Pro. </p>
      <p>Ralph Unger says that Falkner pro is based on Alan Meeks' Kestrel, and has a release date of 2011. Ballpark Weiner was around before 2005 that I know of. Mickey Rossi said that he used an original Letraset rub-on sheet (or maybe a catalog) to work from.</p>
      <p>In fact, your reference to Rossi's "Satans Minions" (pre 2005)  and Nick Curtis' "Shiver Me Timbers" (Version 1, 2006) fails the same antedating test. These two fonts are completely different.</p>
      <p> - Herb</p>
