    html: <p>dc <br> <br>There were tuscans with the "little balls." I've seen a near dead ringer for this in Gray's Nineteenth Century Ornamented Typefaces. But your showing is an inverse. By the end of the century the metal foundries began copying the wood type designs and essentially took the wind out of the sails of the wood type manufacturers. Everyone was copying everything so it is almost impossible to pin down. <br> <br>But if you scrounge around a bit on the web you will find a similar situation today. Lots of copies of old wood type designs are available, and metal too, of course. In some cases these might be reworked a bit, at least commercial designs, but a lot of the freeware and shareware stuff are straight copies. Sometimes useful because of that if you are only interested in specimens. </p>
