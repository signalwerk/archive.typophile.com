      <p>Thanks Herb and Indra.</p>
      <p>I understand that Folio is a precious witness of a past era, and that many foundries digitalized it.</p>
      <p>I was thinking about Bitstream, since I heard (sorry, I don't have the source) that they distributed an imperfect copy of Folio under the name <a class="freelinking external" href="http://www.myfonts.com/search/bitstream+swiss/fonts/" rel="nofollow">Swiss 911, 921, 924</a>. Should I avoid these (Swiss 721 being a Helvetica knockoff)?</p>
      <p>I also came across <strong>Folio BQ</strong>, but I can't find the source. Anyone can help me confirm <strong>Berthold Quality</strong> actually had a Folio version?</p>
      <p>Thanks !</p>
