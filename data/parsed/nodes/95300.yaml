    <p>Hi,</p>
    <p>I'm currently comparing all the available versions of <strong>Folio Bold Condensed.</strong> <a class="freelinking external" href="http://www.fontshop.com/search/?q=folio%20bold%20condensed" rel="nofollow">There are so many!</a> Linotype, Elsner+Flake, URW, Bitstream, Scangraphic... I prefer versions that also offer a Bold Italic weight.</p>
    <p>Which version should I consider or avoid at all cost? What are the differences between them. I'm not exactly looking for the most accurate version. Just the most well balanced.</p>
    <p>Thanks</p>
