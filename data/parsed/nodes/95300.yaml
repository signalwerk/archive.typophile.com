    html: |-
      <p>Yes Berthold had an extensive Folio family. The copyright dates start in 1992. The italics appear to be obliques rather than true italics, but so are Bitstream's. They're not in Berthold's current sales list.</p>
      <p>Some years ago Adobe stopped marketing Berthold's fonts. However they are now marketing their own collection of Folio fonts (not to be confused with The Adobe Font Folio) .  I have nothing to base this on, but maybe when they separated, Adobe got custody of the Folio family, and Berthold got everything else.</p>
      <p> - Herb</p>
