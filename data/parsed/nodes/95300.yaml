    html: <p>Swiss 911, 921 and 924 are no versions of Folio, rather, they are different versions of Helvetica (Compressed and Inserat) and Hansaetic. I only the know the Bitstream version of Folio, which seems alright to me, tough I have not used it until now. The URW version is a good deal as well, with wide language support, and a couple more weights. From my experience the URW fonts usually are good quality.</p>
