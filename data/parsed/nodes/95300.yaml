      <p>That's kind of like asking which model Chevrolet you should buy. It depends on what specifics you're looking for, and nobody can answer that but you.  They have different character complements, some differences in punctuation glyphs, and some subtle differences that only a discerning eye like yours might see.   And the same typeface, from the same vendor, may undergo changes and improvements as time goes by.</p>
      <p>I'd suggest comparing them as best you can, side by side, and making your judgement call.</p>
      <p> - Herb</p>
