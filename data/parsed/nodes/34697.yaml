    <p>I'm assuming the answer to my question is no, but thought I would ask just in case:</p>
    <p>Has Raul Rosarivo's <em>Divina proporción tipográfica</em> been translated into English? I can only find it in Spanish and German. My German is so rusty I don't look forward to reading it.</p>
    <p>George<br>
    I felt bad because I had no shoes until I met a man who had no Bodoni</p>
