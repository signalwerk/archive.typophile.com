      <p>Thanks to your post I found out about Raúl Rosarivo, so I am grateful for that, George.</p>
      <p>Unfortunately, it seems that none of his books or articles can be found in English translation -- an Argentine designer, Fabián Carreras, has what looks like <a href="http://fabiancarreras.com.ar/rmr/bibliografia.htm" rel="nofollow"><strong>a very complete Rosarivo bibliography</strong></a> on his website.</p>
      <p>P.S. On Amazon, he only comes up as <a href="http://www.amazon.com/s/ref=nb_ss_gw/103-3680925-5180609?url=search-alias%3Dstripbooks&amp;field-keywords=raul+rosarivo&amp;Go.x=11&amp;Go.y=11&amp;Go=Go" rel="nofollow">mentioned in three books about type and design, and as the illustrator of a fourth one</a>.</p>
