      <p>There's a discussion of his work in Tschichold's <em>Form of the Book,</em> but Tschichold doesn't go into a lot of detail so I was interested in finding out more about his work on Gutenberg. Rosarivo is evidently the guy responsible for figuring out Gutenberg's page layout. Guess I'll have to try and sharpen up my Geman then.</p>
      <p>Thanks for the bibliography reference.</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
