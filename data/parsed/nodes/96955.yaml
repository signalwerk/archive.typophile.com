    html: <p>Calligraphy used to be the only way to make books until typesetting came along.  The first types were made to look very much like calligraphy.  After a while, type moved its own way and did not try to be calligraphy for mass production.  There still was a strong visual relationship for many years.  Modern tools did not require using calligraphic tools so type lost its dependence on calligraphy, but not its history.  Today's type can either mimic script writing better than ever or totally ignore any relation to it.  The tools have opened the possibilities to anything imaginable.  The tools are still slave to the human who uses them and directs them just as once upon a time when the human directed the pen.  The pen had certain limitations that the digital era tools do not.  Digital tools may also have limitations but they are much less predictable.</p>
