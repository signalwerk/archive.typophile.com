      <p>Chris: <em>Calligraphy used to be the only way to make books until typesetting came along.</em></p>
      <p>Better to say that writing was the only means of text production until typesetting came along (block printing of text existed, but it was never a very significant technology). Scribal text production shouldn't be called calligraphy, which refers to a particularly high quality of writing that is treasured for its graphic excellence. Some scribal book production meets that standard, but huge amounts was the written equivalent of what we would call jobbing work.</p>
