      <p>I agree with John on the distinction between “writing” and “calligraphy”.</p>
      <p>It is also interesting that the word <cite>calligraphie</cite> doesn’t appear in French before the mid-16th century — <cite>i. e.</cite> at a time when scribal work has been stripped of most of its relevance (in the Western world) by the spread of Gutenberg’s technology. It looks as though Western scribes invented the concept of “beautiful writing” in order to continue to exist in spite of the general demise of “useful writing” — making writing a pursuit of aesthetics by turning it into calligraphy gave it a new, though different, relevance.</p>
