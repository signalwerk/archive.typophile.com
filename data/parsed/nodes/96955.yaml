    html: |-
      <p>@hrant:<br>
      <cite>It's because too many type designers remain too convinced of the relevance of calligraphy (better termed chirography) in our craft. In particular there's a minority of type designers who actually practice calligraphy extensively (which of itself is a wonderful and enviable thing) who get disturbingly agitated when the essential difference between the two is pointed out.</cite></p>
      <p>Typography and calligraphy are two means by which a text can be presented to a reader.</p>
      <p>As calligraphy, unlike typography, involves forming the letters used by hand, it can also be used as a method of type design.</p>
      <p>It certainly is true that types may be designed in a non-calligraphic fashion. One may take <a class="freelinking external" href="http://fontsinuse.com/uses/1197/bifur-typeface-specimen" rel="nofollow">Bifur</a> as a simple and obvious example.</p>
      <p>Futura, Optima, and Cooper Black might be cited as more conventional typefaces that really don't make one think they were written with nibbed pens.</p>
      <p>Although Cooper Black could be pulled off with the right Speedball point. And so could Times Roman, or Copperplate Gothic.</p>
      <p>But Roman type, in general, while it owes something to calligraphy, also owes something to the <em>chisel</em> instead of the pen.</p>
      <p>So, yes, I will agree that type design is not subservient to, or a branch of, calligraphy. However, despite that, I still also feel that calligraphy is a very useful influence on typography; it's a source of new, yet conservative, ideas that will lead to typefaces that will be readable and find ready acceptance.</p>
      <p>While I reject Fraktur as a desirable written style, I think - and hope - that among the various rotundas a starting point for a viable alternative to Roman may yet be found.</p>
