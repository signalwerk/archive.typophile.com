    html: <p>Nick, let me clarify what I meant by 'block printing of text', and it not being a significant technology. By this I meant carving of entire pages of raised text in wood, which does not appear to have ever been a major technology in text manufacture in the West (it was more widely known in Asia). The transition that occurred in book publishing in the second half of the 15th Century is from predominantly scribal production to predominantly metal typeset production. Block printing of text existed both before and during this period, but doesn't seem to have been widely used enough to factor in the transition.</p>
