    html: |-
      <p>Type design will produce letter shapes that can be used in the process of typesetting. After the type designer's job is done, there will be other people doing the lay-out and the printing of the text.<br>
      Calligraphy will reproduce text. Calligraphers may or may not design their own letter shapes, but in any case they will do the lay-out and the printing (as in: putting the letters to paper) themselves.</p>
      <p>For type designers and calligraphers it may be interesting to discuss the letter shapes each of them comes up with. A conclusion will be that some calligraphers do not invent their own letter shapes. That's fine, as long as they do not claim the contrary. They may discuss kerning as well. A conclusion will be that some type designers do not kern their own letter shapes. That's fine, as long as they do not claim the contrary.<br>
      For graphic designers and calligraphers it may be interesting to discuss the lay-out issues each of them deals with. Most type designers will be laymen in these discussions. That's fine, as long as they do not claim the contrary.</p>
      <p>So why should this topic be so delicate?</p>
      <p>Bart</p>
