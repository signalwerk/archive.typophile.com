      <p>John: <em>But Roman type, in general, while it owes something to calligraphy, also owes something to the chisel instead of the pen.</em></p>
      <p>Given that letters to be cut on stone have almost always been either drawn or written on the stone first -- most famously, Fr Catich demonstrated how imperial Roman inscriptions would have been brush lettered before cutting -- it is hard to conceive of any characteristic of these letters that are owed particularly to the chisel. Stone, especially those kinds most favoured by letter cutters, such as the fine English and Welsh slate, is a high resolution medium: with a sharp chisel of appropriate size and shape, there is pretty much no form that one cannot cut in it.</p>
