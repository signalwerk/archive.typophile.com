    <p>Hi, I was hoping to get some help with some bizarre problems. </p>
    <p>#1- "w" doesn't appear until struck twice in illustrator. But only when it is the first letter in the text box. </p>
    <p>#2- The lower counter on the ampersand appears filled when illustrator is zoomed in. This appears to be related to the character's optical size on screen, not the specific zoom level. </p>
    <p>#3- a few characters display little hairlines at small sizes. </p>
    <p>I'm frankly stumped. Has anyone seen any of these before?</p>
