    html: |-
      <p>Looks like a great font is going to be born once more.<br>
      Didn't mean to say anything at all at first, since it looked so good.</p>
      <p>Now on close inspection I'm with eliason about the serif of the 2, (also 7, T, E, s etc). I can see the pointed angle is not a bug, it's a feature ;-) but maybe it looks better when it's a bit shorter (like with the Euro [lining figures]).<br>
      The right arm of the r looks too thick (and perhaps too short) to me, in particular where it connects to the stem.<br>
      The axis of the g is out of tune with, say, e or s.<br>
      Ah, and the opening single quote is (mirrored) upside down.</p>
      <p>Andreas</p>
