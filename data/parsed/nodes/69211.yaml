    html: |-
      <p>I realize I should have been more clear - when I said the /4/s look slight, I meant that they look small (especially, narrow), not light. "Slight" in proportions, not in stroke weight.<br>
      I also forgot to mention I'm not persuaded by that @, which looks /d/-like and flat on the right.</p>
      <p>Italic /p/ is defintely too wide. Italic /e/ probably, too. Italic /u/ might be too narrow? </p>
      <p>Did you consider other structures for italic /x/? And a single-story /g/ might be nice for the italic (though perhaps that's in the works as an alternate already).</p>
