      <p>I wonder if the /s/ serifs close up too much, but its spine is beautifully done. The thin long stroke of /y/ looks light to me. Having seen your other fonts I'm guessing that the /g/ is untouchable? :-) /M/ looks very good.</p>
      <p>Figures look good though both /2/s bug me with that serif, and both /4/s look too slight.</p>
      <p>The name is quite good; I get a storybook vibe from this.</p>
