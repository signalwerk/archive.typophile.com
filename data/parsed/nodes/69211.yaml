      <p>Hi, Craig-</p>
      <p>I did get your meaning with 4, just went at it somewhat haphazardly.</p>
      <p>@ is something of a pet peeve of mine: generic @ is what it is; generic no matter what font you use. Like copying and pasting instead of design. Mine is too narrow right now, though.</p>
      <p>Italic p is too wide. And x in work in progress, and I do have a single-storey g. I think two-storey should be there as an alternate.</p>
