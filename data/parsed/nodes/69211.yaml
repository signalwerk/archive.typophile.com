    <p>Hello again-</p>
    <p>This is Telltale, a study of low contrast in serif style. Once again it is fairly narrow to work in Finnish language (ääliö älä lyö, ööliä läikkyy, senkin sikaniskainen kaupunkiinmuuttajapaskiainen). I tried to make it low in contrast without making it look fat.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Telltale_3604.png"></div><br>
    Italics are under production, so samples in pdf are somewhat random.<p></p>
    <p>Any comments?</p>
