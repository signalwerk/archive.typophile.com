      <p>I'll try to make time to read beyond<br>
      the initial post, but in the meantime:</p>
      <p>There are at least two good reasons (beyond<br>
      any historical baggage, which I'm no fan of) for<br>
      an Italic to be narrower than the Roman:<br>
      - Uh, emphasis! :-)  Something doesn't have to<br>
      be bigger to get attention - it can be smaller.<br>
      You just need contrast (and it's important to<br>
      note here that slant isn't the only thing).<br>
      - In a traditional serif system the Italic has<br>
      far fewer serifs than the Roman, so it simply<br>
      can't be as wide without looking dorky.</p>
      <p>BTW, if you're thinking slanted-Roman, you're<br>
      reading my mind. To me -when done right- it's<br>
      the ideal approach.</p>
      <p>That said, as many here know I'm actually not<br>
      a fan of Italics in general! And I think there are<br>
      some better avenues of emphasis, which have yet<br>
      to be properly explored. One of then is weight,<br>
      just not massive weight like with a Bold; I think<br>
      Demi weights usually work great for emphasis.<br>
      Another one I quite recently thought of is to in<br>
      fact increase size, but not based on point size,<br>
      instead based on x-height (so apparent size).<br>
      <a href="http://typophile.com/node/81755#comment-462531" title="http://typophile.com/node/81755#comment-462531">http://typophile.com/node/81755#comment-462531</a></p>
      <p>hhp</p>
