      <blockquote><p>Italics are now used for emphasis...</p></blockquote>
      <p>But that's not their only use. When I teach about italic design I emphasize that the <em>purpose</em> of italics is <em>contrast</em>. That can be for <em>emphasis</em> or for quotation (see above) or commentary or to set apart a word or phrase as different somehow, such as a foreign word. In the first sentence of this paragraph I've even used italics for two slightly different types of emphasis. It would actually be more effective to do as John did and say:</p>
      <p>When I teach about italic design I emphasize that the <em>purpose</em> of italics is <strong>contrast</strong>.</p>
      <p>There are a variety of techniques that can be used to provide that contrast, and horizontal compression is one of them. So is a lighter weight. Or alternate letterforms. Some of these are more effective than others for a particular purpose. The bottom line, however, is that the contrast must be clear and strong. <em>What bothers me is not which technique is used, but when the contrast is too weak.</em> That's my rant.</p>
