      <p>Hrant: <em>I'm a big fan of using Demi for emphasis</em></p>
      <p>See my comment earlier on the distinction between linguistic emphasis and visual emphasis. One expresses an articulatory emphasis of a word or phrase, the other expresses a hierarchy of importance. One should be encountered in the text as one reads, the other should draw attention to itself and stand out from the text.</p>
      <p><strong>Important</strong> I can't stress <em>enough</em> how critical is this distinction.</p>
