    votes: null
    html: |-
      <p>I second the recommendation of Sabon. When I'm doing legal work, I use Sabon for all my court filings in part because filings require so much italic (not for emphasis, but because italic is used in legal citations). I think Sabon is great anyway, but the wide italic really does look nice in that context.</p>
      <p>I disagree with the recommendation of Computer Modern. Don Knuth has made many impressive contributions to digital typography, but that's not one of them. It's ugly and awkward. You can't justify it when there are so many better choices.</p>
      <p>Electra is a typeface with two italics: one a sloped roman, one a true "cursive" italic. I don't know off the top of my head whether the sloped roman is available in digital. </p>
      <p>In general J. Tillman raises a good point and some of the responses here are underselling the value of what he suggests. When I'm in graphic-design mode, there are plenty of times I'd like to have the choice between two italics. </p>
      <p>Forget about sloped romans for a moment, which I agree are too subtle. I love Galliard Roman, but Galliard Italic is too aggressive and stylized for certain projects. So I can't use Galliard. Meanwhile, Charter Italic is more moderate. But Charter Roman isn't as nice as Galliard Roman. If I had a Charter-like italic for Galliard, I'd use Galliard more often. (You could also consider the difference between Georgia Italic and Miller Italic, which might be more apt since Georgia &amp; Miller are derived from the same DNA).</p>
      <p>Really it's no different than having the choice between semibold and bold. Sometimes you want one, sometimes the other. So why don't we have more "semi-italics"? Clearly because semibolds are often just interpolated, which is an afternoon project in Fontlab. Semi-italics would have to be drawn from scratch.</p>
