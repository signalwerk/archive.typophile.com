      <p>@hrant:<br>
      <cite>But I think he was complaining about any narrowness at all.</cite></p>
      <p>I agree; I said as much in my post.</p>
      <p>As to your suggestion in the Daidala interview: that is an interesting idea, but I can see why, in general, designers have not gone there.</p>
      <p>It's hard enough to see that Times Roman italic <em>is</em> Times Roman italic; so, while it is possible to make new typefaces that convey different emotions, making ones that are clearly associated with an existing Roman is significantly more difficult.</p>
      <p>Also, while writers are used to using the stereotyped forms of italic and boldface for emphasis, anything else is likely to be stigmatized as gimmicky.</p>
      <p>There is <em>some</em> existing precedent for this; besides italics, bold, and small capitals (which I've argued should be thought of as a third case) there is, of course, demibold and extra bold; some typefaces have script versions and others have monospaced versions.</p>
      <p>But what first came to mind when I saw your suggestion, and which made me think right away that a "gimmicky" stigma would be likely, was that there would be a weight that makes the given face look somewhat like Ondine. And another possibility would be a weight replete with Valentine's Day cliches.</p>
