      <p>By that I mean, for short phrases for emphasis, or at most a few lines. "Companion italics" are generally designed to work that way, and if you try to set extended text in a companion italic it is going to be sub-par. You do have a lot of other options, including text blocks indented on both sides, bullet points, lists, etc. If you keep italics to use as intended I think you can find a lot of good options.</p>
