      <p>Interesting analysis, John. I think a problem may be that, as you say, technical text calls for a wider palette of options. </p>
      <p>Mr. Tillman, I'm not sure what you mean by "small". Companion italics are often both lighter and narrower than the roman, but the combination can achieve the same typographic "color" as the roman, while having a very noticeably different texture. The actual x-height can be the same or bigger. </p>
      <p>While I agree that some companion italics are too hard to read, I think it is difficult to isolate one variable as "small", when the different variables interact to get the overall affect. </p>
      <p>In the case of my Williams Caslon Text, I made the italic a lot wider than Caslon's original, similar to what Carol Twombly had done for Adobe Caslon. But I also made mine more upright than the original, and upright than Adobe Caslon as well. I think reducing the slope makes it a little more readable. </p>
      <p>But there is a delicate trade-off here. If you don't differentiate it enough, it's not going to function to highlight emphasis. And since almost all differentiation from the roman makes a type less readable, if you go to far in differentiation, you start to compromise readability too much. </p>
      <p>I agree that getting it right is a challenge, and some, like <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/joanna/" rel="nofollow">Joanna</a> are wildly off. But I don't think you are taking into account that you can go the other way too much. The idea of replacing italic with slanted roman, in serif type, has been a flop. The most striking "disproof of concept" is van Krimpen's Romulus, where a wide slanted roman is a flop as a companion to a beautiful roman.</p>
