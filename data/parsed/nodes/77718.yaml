      <p>@J Tillman.  Are you reading printed text or something on screen as you type? and using what application? Some applications don't properly show or even print italics, particularly if they are large opentype families that don't nicely fit the old Windows 4-unit limit on a family system.</p>
      <p>I guess what I am saying is, is this a selection problem caused by the users application or is this a font design issue? As Nick mentioned above, genre of typeface can, to some degree, influence the italics. Most modern designs don't have wimpy italics.  Identical metrics from Roman to italic is not really a good thing.  The glyphs have different shapes so the fit must accommodate them. We all know that putting something in Italics is not a way of saying "IGNORE THIS".  Most type designers spend more time designing Italics than they do Roman, even though the amount of usage is far less.  All Type designers I know design the italic to work well with the Roman, not to meekly and subserviently coexist with it as an impotent step-child.<br>
