      <p>Thanks again to all those who have commented or may comment in the future. </p>
      <p>To Nick Shinn: Sorry I misspelled your name in my earlier post. Re: the two boxes, I have no doubt that I used the wrong technical words, resulting in the diagram you showed. From a less technical perspective, how about if I say I am looking for an italic that has the same horizontal distance as the Roman.<br>
      You mentioned Georgia in an earlier post. When I looked at the font closely, yes, this is the italic-Roman relationship, or very close, that I am looking for. (You should have hit me on the head harder.) Maybe the italic is a shade too obvious, even.</p>
      <p>And the whole point of this rant, re-stated now, is that the Georgia italic-Roman relationship should be more the rule, and not the exception to the rule, for text fonts. Is Georgia considered an unsophisticated font because of this? or is it considered inappropriate for general use because of this? (Obviously, as a Microsoft standard font,  it's very widely used.) Why isn't everybody here already? I am genuinely curious about this.</p>
      <p>To John Hudson: I will be mulling over various options you have suggested. There's a lot there to think about. But I do not think that this is only a technical writing discussion. It's about all writing.</p>
      <p>To riccard0: Thanks for those two links. The first is an interesting thread. And I liked Hrant's "Classic, schmassic" post. Also, now I know how to link to a particular post.</p>
