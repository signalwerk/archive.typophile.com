      <p>Without doing an exhaustive comparison of recent text typeface families, I'd say that the general trend is probably in the direction that you desire, i.e. italics are tending to be wider, closer in proportion (and more directly related stylistically) to their roman companions than was historically the case. [Remember that italic types did not originate as designed components of families, as they are used and typically produced now. Italics originated as distinct typefaces, that only gradually assumed supporting typographic rôles. The essentially independent design of italics persisted into the late 18th century, and almost any historical revival typeface will reflect this.]</p>
      <p>PS. You might like my <a href="http://en.wikipedia.org/wiki/Constantia_%28typeface%29" rel="nofollow">Constantia</a>: the italic is only very slightly narrower than the roman.</p>
