      <p><em>...bump those italics up the final 5 or 10 percent so that that they are the same size and weight as the Roman.</em></p>
      <p>That doesn't make visual sense.<br>
      You want an equivalence in emphasis between roman and italic.<br>
      But there is no such discrete graphic quality as "emphasis".<br>
      There are only things such as area, width, and length.</p>
      <p>When the letter l is skewed, it doesn't remain the same length, but becomes longer, and increases in area.<br>
      Effects such as this make it appear bigger.<br>
      To counteract this and achieve an equivalence of emphasis, it is necessary to make adjustments, one of which, that seems to have proven quite successful, is to make the italic occupy less overall width.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/skew_4783.png"></div><br>
      This illustration compares a rectangle that has been skewed 10° with one that has been rotated 10° (in red).<p></p>
