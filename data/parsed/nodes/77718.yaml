      <p>Tillman, I partially agree with you: there are many fonts with so much narrow italics. When the glyph width change, there is a cadence break. Although this break is actually desired (otherwise you would not be using italic), it may become excessive when roman and italic have very different widths and are mixed in the same paragraph.</p>
      <p>Please note italic naturally tend to be a bit narrower due to its calligraphic shapes –not to mention the fact they are initially conceived as independent sets of types, as Bert pointed. An italic style with exactly the same width of roman could feel actually wider than the roman.</p>
      <p>Many contemporary fonts already use a wider italic. Anyway, this is not a choice for all fonts. For example, revival from a 16th Century type would become historically incorrect (and thus feel strange) without narrow italics.</p>
      <p>Some fonts I remember have wider italic (although still narrower than roman): Tisa, Guardian, Charter, Skolar, Utopia, Gina, Yukatek and Centro Serif.</p>
  - id: 446203
    user_id: 1262
    user_name: John Hudson
    user_path: null
    user_image: /files/pictures/picture-1262.gif
    date_raw: 4 Jan 2011 — 7:18pm
    date: 2011-01-04T19:18:00
    votes: null
    html: "<p>It seems to me that the problem here isn't the typefaces but the notion of <em>emphasis.</em> See what I did there? I used italics for articulatory emphasis, a linguistic phenomenon, <strong>not for graphical emphasis</strong>, a visual phenomenon. I've seen plenty of style guides that blithely state 'Use italics [or bold] for emphasis', without defining what they mean by emphasis, and certainly without recognising that there are different kinds of emphasis. The practice of using italics for emphasis originated in articulatory typography, <em>i.e.</em> italics were used -- among other things: citations, foreign words, Latin abbreviations <em>etc.</em> -- to stress words or phrases, the typographic equivalent of the way we would stress those words or phrases in articulated speech. In technical writing, it is more often the case that emphasis needs to be used to draw attention to some piece of information; this is graphical emphasis, and bold type is more appropriate than italics of any style or width because the heavier weight draws the eye. If a style guide has boxed itself into a corner by using bold type for something other than emphasis, then you need to look to some other eye-drawing solution, <em>e.g.</em> semi-bold sans serif, reserving italics for their traditional functions, which are already too numerous without also using them for graphical emphasis for which they are seldom well adapted.</p>"
