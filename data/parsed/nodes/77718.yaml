      <p>Sure.<br>
      But I think he was complaining about any narrowness at all.</p>
      <p>&gt; I think that problem was solved hundreds of years ago</p>
      <p>The problem I have in mind hasn't been solved yet...<br>
      How do you avoid "skewing the voice" of the Roman?</p>
      <p>From my Daidala interview:<br>
      "<br>
      If you believe that a typeface carries emotional associations in its forms*, then you have to conclude that the conventional practice of having only italics for emphasis is one-dimensional. There can be many kinds of emphasis, many nuances a discerning typographer might want to give snippets of text. So what would be nice is a system of fonts than can nest into each other and convey various emotions, such as stress, sensuality, whatever. What do italics convey? Mostly informality and motion – not necessarily what the text being marked is about.</p>
      <p>    * And if you don't, how do you justify making yet more fonts?<br>
      "<br>
      <a href="http://www.daidala.com/25apr2004.html" title="http://www.daidala.com/25apr2004.html">http://www.daidala.com/25apr2004.html</a></p>
