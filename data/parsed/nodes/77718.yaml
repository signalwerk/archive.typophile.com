      <p>Thanks to everyone who has commented so far. My position is unchanged. (I told you this was a rant at the beginning!) 1. When I see emphasis using smaller type it makes me want to groan. 2. I think foreign language words deserve the same weight (typographically and figuratively) as English words. </p>
      <p>I'm seeing two very different responses here.  One group is saying that there are lots of good fonts where the italics are almost the same size and weight as the Roman, and I should just use one of these and be happy.  The other group is saying that italics are just smaller than the Roman; it's always been that way. Not to fear. I'm gonna argue with everybody.</p>
      <p>To Nick Shinn and dezcomm: Yes there are a lot of good fonts where the italic size and weight is almost the same as the Roman. And I think the type design community should just take a deep breath and bump those italics up the final 5 or 10 percent so that that they are the same size and weight as the Roman. And then we can all be happy. Or maybe just me.</p>
      <p>To paul d hunt and Bert Vanderveen: We may have to agree to disagree here. I recognize how it has been. I just think it's time for a change. Italic is different than Roman. Even if they are the same size and weight, they're still different.</p>
      <p>To JoergGustafs: As you implied, I am mostly talking about serif fonts. Nonetheless, the sans serif Actium is very interesting and is an example of what I want. But I'm really talking about serif text fonts.</p>
      <p>To William Berkson: Yes, I'm talking about what you're talking about, namely short phrases of two to four words. </p>
      <p>To Dezcom: Take a look at your post. Imagine that instead of having capital letters that say "IGNORE THIS", you have letters that are actually much smaller than everything else. Does your post seem a little incongruous?<br>
      What I am looking at is printed material. In most cases it is a printed version of the specimen PDF.  There are a lot of problem fonts; that's why it's a rant. But the one that just makes me shake my head is Greta Text. This seems to me to be a great font in the Roman, not only for newspapers but for general purpose. Why is the italics so small?<br>
      <a href="http://www.typotheque.com/fonts/greta_text/" title="http://www.typotheque.com/fonts/greta_text/">http://www.typotheque.com/fonts/greta_text/</a></p>
      <p>To Freiberger: Of the fonts you mentioned, I have been looking at three for some time, FF Tisa, Skolar, and Yukatek. (Yukatek in the still-in-progress form on the Reading site.) Now if those italics were a little wider....</p>
      <p>To John Hudson: Your articulatory emphasis is getting a graphical boost due to the font in use here. As Nick Shin pointed out earlier, this has a significant italics. And I stand by my feeling that emphasis with small letters (smaller than the Roman)  doesn't cut it.</p>
