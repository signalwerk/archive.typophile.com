      <p>My take on the original post is thagt it's a complaint about the slight narrowing of italics in ordinary and contemporary typefaces, such as Times Roman or Century Expanded.</p>
      <p>Had the original poster seen Bembo with its more historically-appropriate italic, for example, presumably he would have made an off-the-scale comment about this.</p>
      <p>However, his rationale is largely valid. Italics are used to emphasize words in line or indicate foreign words. They aren't used to make inexpensive editions of books possible by allowing more characters per line. So italics shouldn't be excessively narrow.</p>
      <p>But I think that problem was solved hundreds of years ago, and only italics like the Aldine ones pose a real problem in this connection, not those of ordinary recent typefaces.</p>
