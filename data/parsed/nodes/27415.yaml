    html: |-
      <p>You can’t use FontLab or FontLab Studio to combine smaller fonts into a larger one, simply because FontLab [Studio] will not output fonts with more than 6,400 glyphs. </p>
      <p>AsiaFont Studio 4 is functionally equivalent to FontLab 4.5 plus it has support for reading CID-keyed Type 1 fonts, reading and creating TrueType collections, supporting fonts with more than 6,400 glyphs. </p>
      <p>AsiaFont Studio 5 is under development. It will be functionally equivalent to FontLab Studio 5, plus it will have some additional features such as improved Change weight and Clean up paths algorithms, CID-keyed Type 1 and OpenType import and export, support for vertical glyph metrics, support for non-BMP (5-digit) Unicode codepoints etc. We don’t have yet a precise release date or pricing information, but I’m sure there will be an upgrade path for both AsiaFont Studio 4 and FontLab Studio 5 users. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
