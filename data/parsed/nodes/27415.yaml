    <p>I have searched the site, and found few detailed information on FontLab’s two-byte font editor, AsiaFont Studio. I gather it’s a high-end version of FontLab with features that come handy for dealing with CJK font.</p>
    <p>In the long run, I would like to create fonts with Hangul (Korean alphabet) support. However, the $1,999 price tag is rather prohibitive. Is there anyone who has used AsiaFont Studio, preferably with an Asian script, that could tell me whether it would be worth blowing my annual budget on it?</p>
    <p>I know about the ability to support something like 65,000+ glyphs at once. But just how much of an improvement is it over the method of working on several smaller files separately using FontLab or other font editors then combining them at the end? I’d appreciate any opinions from those who have used this program.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/27444" class="topic-previous" title="Go to previous forum topic">‹ Wonky hinting</a> <a href="/node/27424" class="topic-next" title="Go to next forum topic">More FL class based Kering ›</a></div>
