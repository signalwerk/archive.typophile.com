      <p>I have just finished reading 'typographie' today. I have been working through it this last week. First-off, the English translation in Rotis Roman *wasn't* difficult to read. It has been the first time I had read Rotis (Roman) in any quantity. There is an example in the book later on which shows the comparison between Rotis Roman and Times Roman and it becomes clear that Times is a significant influence from the Roman end of the scale.</p>
      <p>The book lays out a *Big* argument about the adoption of capitalis by the Romans (and later Renaisance) with the usage of Capitalis' drawing an association to vacuous superiority. This is both interesting and enlightening as this had not been apparent, though subconsciously obvious.</p>
      <p>Typographie, the Book is a fine example of 'Total Design' in the true Dutch sense, where all aspects of the design work in a holistic way (typeface, illustration style page make-up). The only aspect of the book design that bugged me was a really tight gutter margin and some bad column return alliterations.</p>
      <p>I have always admired what I have seen of Aicher's work and have his Sahara Desert book and essays (English and German) so am looking forward to the book from Markus Rathgeb.</p>
      <p>Rotis as a font is a remarkable undertaking. I really like the concept of legibility being increased upon the increased distinction between letterforms and admire the notion of being inspired by pen-forms and early type design, especially the Garamond lowercase e (Carolingian minuscule). If we were to take these to starting points - would we end up with something so successful as Rotis, perhaps? But what is commendable is having the ideas and working them out and creating a font programme of 17 variants. It can be criticised but has yet to be superseded. I believe this is suggested as the eternal challenge to the typographer anyhow.</p>
      <p>I wish I had read it years ago. An important book!</p>
      <p>/hernan</p>
