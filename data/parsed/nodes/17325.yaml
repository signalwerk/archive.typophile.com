      <p>Thanks for the correction about the page, Ricardo.</p>
      <p>Whereas it is great when important typography books get translated,<br>
      sometimes it is hard to maintain all the original context in which these books<br>
      were written.<br>
      This chapter from 'Designing books' was first published as a small booklet<br>
      with the title 'Buchgestaltung als Denkschule' (Designing books as a training<br>
      of reasoning) - already the title suggested that some book designers were<br>
      in urgent need of help in order to learn how to think.<br>
      The subtitle of this booklet 'Gegen die Ideologisierung gestalterischer Strukturen'<br>
      (Against the ideologization of design structures/principles) made even clearer<br>
      from where the menace to reasoning came from: from ideology/dogmatism.</p>
      <p>Aicher was quite dogmatic and articulate about his ideas,<br>
      but this does not mean that the traditionalists were less dogmatic.<br>
      It is just that their dogmatism had the force of habit on their side<br>
      and therefore it was probably less obvious.</p>
      <p>A lot of people got very obsessed with the question of symmetry versus asymmetry:<br>
      Paul Renner, Max Bill, Richard Paul Lohse, Karl Gerstner and<br>
      Jan Tschichold (both the young modernist as well as the older traditionalist Tschichold)<br>
      - they all had something to say on this topic.<br>
      The whole chapter 11 in Kinross' 'Modern typography' is full of these debates.</p>
      <p>The remarks by Hochuli on Aicher as well as Aicher's remarks on symmetry<br>
      in his book 'Typographie' are rooted in a long history of conflicts<br>
      between traditionalists and modernists/functionalists - and the question<br>
      of symmetry versus asymmetry made these different views again manifest.</p>
