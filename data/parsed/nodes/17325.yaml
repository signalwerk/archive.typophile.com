      <p>&gt; <em>Hi,<br>
      I’m looking for info about Otl Aicher (in english).</em></p>
      <p>Getting back to the original request -- you might find this extremely informative in regards to Aicher's philosophy and process during the major corporate rebranding of FSB and ERCO (both in mid-eighties), with personal recollections by Juergen W. Braun.</p>
      <p><a href="https://web.archive.org/web/20150124092613/http://www.id.iit.edu/~mebert/aicher.pdf" target="new" rel="nofollow">PDF: http://www.id.iit.edu/~mebert/aicher.pdf</a><br>
      Martin Ebert<br>
      Design Policy<br>
      ID 515<br>
      Professor John Heskett<br>
      Institute of Design<br>
      Illinois Institute of Technology<br>
      Spring 1997<br>
      -------------------------------------</p>
      <p>I also started the process of gathering some of my own personal notes and correspondences related to period Aicher was in process of publishing <em>Typographie</em> and the development of Rotis type family. My intent is only to fill some critical facts which seem forgotten or lacking on the information, theories and criticism associated with Rotis. </p>
      <p>It's important to know that the preparation and publishing of <em>Typographie</em> was happening simultaneously with the development of the Rotis typefaces. Aicher was commissioned to compile a record of his typographic experiences by Klaus Maack of Druckhaus Maack (major printshop in Germany since 1849), who also happened to be the CEO of <a href="https://web.archive.org/web/20150124092613/http://www.erco.com/" target="new" rel="nofollow"><strong>ERCO</strong></a>, the major high-end lighting manufacturer that Aicher was rebranding (with Rotis).</p>
      <p>------------------------------------<br>
      &gt; <em>One thing to remember about Rotis is that it was Aicher’s first font.</em></p>
      <p>FYI -- technically not his "first" but in actuality Rotis was his only type design effort, due to his untimely death.</p>
      <p><a href="https://web.archive.org/web/20150124092613/http://www.spiekermann.com/iblog/C1109747452/E1829097339/index.html" target="new" rel="nofollow">spiekerblog -- Erik Spiekermann</a><br>
      "Aicher certainly didn’t do himself a favour by aiming so high with his first proper type design (he had previously adapted Univers for Bulthaupt and the Traffic typeface for Munich airport)."</p>
