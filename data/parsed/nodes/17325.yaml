      <p>Someday I will endeavor to write about my experiences with Otl Aicher (which for me was wonderful) and about the development of the Rotis type family during transitioning from Aicher's studio (he had his own Ikarus system) to Agfa (we had to adapt the outlines to our database) which was NOT so wonderful.</p>
      <p>Erik put it well:<br>
      <em>We have a word for that in German: Rotis is a “Kopfgeburt”, it is born from (by?) the head.</em></p>
      <p>If anything, Aicher was a formalist in turmoil. A philosopher in spirit who was shackled by his "sense" of order. He called for revolution in design and typography, but adhered to the grid (anti-nature) in distrust of chaos. </p>
      <p>He admired Adrian Frutiger immensely and one can undoubtably see how Univers influenced the Rotis matrix.</p>
      <p>If one reads deeper into Aicher's <em>Typographie</em>, one will see Aicher's concepts as being less typographic (relating to type design and type layout) and more involved with humans within a rapidly changing environment in need of new symbology and notation systems.</p>
      <p>There are some aspects to the Rotis forms that I find interesting, but most of the weights leave me cold... from the first time I saw initial test through the release and promotional material.</p>
      <p>By the time the entire Rotis family was available for sale, my job had less to do with type promotion, so I never really spent much time setting the faces and learning what unique and usable aspects could be exploited. </p>
      <p>I am far more an admirer of Herr Aicher than Rotis the type family (Rotis the village was idyllic) and will eventually share more of my experiences and learning from Otl Aicher.</p>
