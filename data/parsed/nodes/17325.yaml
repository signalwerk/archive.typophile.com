      <p>The only book on your list that I have read is the original printing (1988-89) of <em>Typographie</em>. I also have another of Aicher's obscure books named <em>In Rotis</em>, which has nothing to do with the "super type family" Rotis, but about the mini-think-tank he ran near his residence in Rotis in the Allgäu region of Germany. (Both of his books were inscribed to me saying something like "Norbert -- for the time you spent here in Rotis" or so he said. It probably said, "Nobert -- now go on and get out of here you little doofus!" since I still can't read his writing.)</p>
      <p>I spent a couple of years going back and forth from Massachusetts to Germany working with Otl Aicher during his development of Rotis type family.</p>
      <p>Here are a couple of links that might lead to additional works by Aicher. He did teach in the states a while, but I don't have that info at hand at this moment.</p>
      <p><a href="https://web.archive.org/web/20150124092613/http://www.biza-project.de/otl/start.htm" target="new" rel="nofollow">http://www.biza-project.de/otl/start.htm</a><br>
