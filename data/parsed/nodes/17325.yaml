      <p>There is also very nicely designed issue of Form+Zweck<br>
      about Hochschule fuer Gestaltung Ulm available:<br>
      <a href="https://web.archive.org/web/20150124092613/http://www.formundzweck.com/titel.php?20" title="http://www.formundzweck.com/titel.php?20">http://www.formundzweck.com/titel.php?20</a></p>
      <p>(Form+Zweck is always beautifully designed, even if it tends to be<br>
      'over-designed' sometimes.)<br>
      It is in German, but the magazine goes with a CD<br>
      on which you can find an English version as a PDF.<br>
      This issue covers different aspects of the Hochschule fuer Gestaltung Ulm<br>
      rather than only Otl Aicher.<br>
      However, there's also an article in it about Aicher's illustrations for a book<br>
      about William of Ockham.</p>
      <p>The best introduction to Aicher's design philosophy is in my opinion<br>
      his essay 'Die dritte Moderne' ('Third modernism'<br>
      - or something similar: I only know the German edition)<br>
      in 'Die Welt als Entwurf' ('World as design').</p>
      <p>Aicher's book 'Typographie' is also quite interesting.<br>
      His considerations about center axis versus left-ranged title pages and<br>
      about the importance of the lower case are worth to be read, to whatever<br>
      own conclusion the reader might come.</p>
      <p>BTW, Jost Hochuli was quite critical about this book<br>
      (especially about the design of this book), as one can read<br>
      in Hochuli 'Designing books' where Hochuli wrote (without mentioning<br>
      Aicher or the title of the book 'Typographie') that functionalism is in danger<br>
      of becoming a superficial pose if text is printed on ultra-white paper<br>
      (which creates a too strong contrast and is therefore hard to read)<br>
      in a book which is almost 2 kilogram heavy. Even if Hochuli did not mention<br>
      Aicher, at the time this text was published first, everybody knew to which book<br>
      Hochuli was referring to. (I do not have 'Designing books' here with me,<br>
      I am quoting out of my memory. The exact words of this critical comment<br>
      should be in 'Designing books' somewhere between page 12 and 14.)</p>
      <p>Aicher's writing is very critical about any style or superficial aesthetics in design<br>
      and never lacks a certain polemic note.</p>
      <p>The questions Aicher raises are sometimes more interesting than his answers<br>
      to these questions. </p>
      <p>It would be a little bit unfair to judge Aicher only by looking at Rotis,<br>
      and by doing so one would cut oneself off from the opportunity<br>
      of coming to know his design philosophy which always revolves round<br>
      the question of the designer's responsibility. His strong moral point of view<br>
      also traces back from his experiences in Nazi-Germany where he was in contact<br>
      with the resistance group Weisse Rosearound Sophie Scholl.</p>
      <p>Aichers design for the Olympic games 1972 (and his pictograms)<br>
      brought him world wide recognition.</p>
      <p>There was a time when Aicher had acquired an almost guru-like status<br>
      (especially when he just had had been killed by an accident.<br>
      Untimely death can boost popularity and helps building instant-saints).<br>
      This led of course to a counter-movement amongst some designers<br>
      who argued that Aicher had confused ideology with design.<br>
      Using or rejecting Rotis was for a certain time  at least in Germany<br>
      and other German speaking countries -<br>
      a demonstration whether one was pro or contra Aicher.<br>
      This time of hysteria is luckily over.<br>
      One can only hope that now Aicher's achievements<br>
      (as well as the limitations of his approach  are there any? Erik, what do you think?)<br>
      in his own design works  as well as in his writings can now be discussed<br>
      in a more objective way.</p>
      <p>Otl Aicher: World as design<br>
      starting from 19,99 Euro at<br>
      <a href="https://web.archive.org/web/20150124092613/http://www.amazon.de/exec/obidos/ASIN/3433024049/sfb/303-0163000-3573040?dev-t=D1KWL3A8UKEH5K" title="http://www.amazon.de/exec/obidos/ASIN/3433024049/sfb/303-0163000-3573040?dev-t=D1KWL3A8UKEH5K">http://www.amazon.de/exec/obidos/ASIN/3433024049/sfb/303-0163000-3573040...</a></p>
