      <p>The only comment on Aicher’s claim of being ripped-off<br>
      I found in typography books is in<br>
      Hans Peter Willberg: Typolemik/Typophilie.</p>
      <p>In this book Willberg, the German typographer and teacher<br>
      who had also written ‘Lesetypography’, mentioned Aicher’s claim and states<br>
      (in German, of course, this is my translation):<br>
      '… and ever since the typographic world wonders about whom<br>
      Aicher was talking about.'</p>
      <p>The slightly ironic tone indicates that Willberg regarded this<br>
      rather as a part of gossip. I think we should do the same<br>
      as long as assumptions are ONLY based on similarity of typefaces,<br>
      but of course I am curious too...</p>
