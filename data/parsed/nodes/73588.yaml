      <p>Neat. Are you going to do capitals?</p>
      <p>I think it's interesting and good that the digits treat diagonals differently than the letters do. But I think the 4 looks oddly narrow. I would elongate the horizontal some, moving the pieces that go with either end along with them, even though it takes them off the grid. Or pull it out one whole bigpixel and remove the beak.</p>
