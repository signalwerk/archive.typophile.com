    <p>Hi folks, </p>
    <p>I'm trying to get my first simple font ready. Since the construction principle is quite simple, I guess there are many similar type faces, but I hope no identical one.</p>
    <p>Feedback and critique is very welcome.</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150124083330im_/http://typophile.com/files/display_6179.png"></div><p></p>
    <p>Best wishes, mike</p>
    <p>Edit: Updated image.</p>
