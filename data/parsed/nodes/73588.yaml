    html: |-
      <p>Thank you for your comment.</p>
      <p>New image above, some more symbols to comment ;-)</p>
      <p>I gave the 4 a little more room, but I think it's good to stick to the alignment of the pieces.</p>
      <p>I'm not sure if/when I will add capitals, the point is, I don't think that they will respect the same look. So I will test some and if not, there could be alternate glyphs, e.g. with the opposite construction principle or something like that.</p>
      <p>greets mike</p>
