    html: "<p>The € (euro) is a place where you'll need to decide on the best way to break your rule: It looks just as much like ₤ (lira, often used as an alternate form of £ pound sterling). They are used in the exact same context, so people will not be entirely sure which it is supposed to be.</p>"
