    html: |-
      <p>Thank you cerulean.</p>
      <p>I don't know, if breaking the principle is really the right way. It is a fun font, so when the € sign is used it may be on a flyer for a party or something like that and not a text discussing currencies... So, is there really a high potential that people will misinterpret it? The sign will always be used in context, that helps a lot... </p>
      <p>Well, of course it's easy to have an opentype alternative ;-)</p>
      <p>greets mike</p>
