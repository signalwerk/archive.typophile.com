    <p>Hello. </p>
    <p>Does anyone have any typeface suggestions for botanical gardens's wayfinding signages? </p>
    <p>I'm currently working on wayfinding project for a well-maintained 165 years old botanical gardens. </p>
    <p>I'm looking at FF DIN as my typeface choice at the moment, but still unsure about it, since its a park/garden, there will be more time for people to read/study signs, is DIN the best choice? Yes, it definitely can communicate with a clear voice, but does it connect to its environment (natural, plants, life)? Or the 'connection' doesn't matters in signages? </p>
    <p>Any suggestions? </p>
    <p>Cheers.</p>
  html_clean: |-
