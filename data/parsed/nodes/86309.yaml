      <p>A little something about sign shops and conservative design...</p>
      <p>In the average sign shop, economy is a strong factor in regards to typography and design. Depending on the scale of the project, the competition is extremely fierce and profit margins are thin. When a graphic designer tells the client that the cost of layouts is going to be x amount of design time and x cost, that is expected. When a sign designer says that there will be x amount of design time at x cost, the client finds someone else. This is not true of every project, but it is frequent enough to be an issue. So, design time is rolled into the cost of the sign. If the design work runs over on time or you decide to use some cool font that you don't currently have, you eat the cost. If the client doesn't like it and goes with a Helvetica clone, you are out the time and money. Each change eats into your profit margin. So, most designs run to the conservative out of economy. If you are a one man operation, you can decide to be creative. If you are a wage slave, the boss is going to complain that your taking too long on the design. In large shops, which score the sweet, high profile jobs, the costs of design and new fonts can be spread over a larger invoice and is to be expected. With many interior wayfaring projects, the production costs are almost always more than the client expects because they have ignored the fact that they need a large number of signs.</p>
    html_clean: |-
