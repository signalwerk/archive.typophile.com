      <p>Nice that so many agree with me.<br>
      I was a bit extreme in relating the cult of legibility signage to driving, because institutional use (hospitals, universities, government buildings) and airports and malls and subway systems all involve ergonomic signage for pedestrians. And the pedestrian precincts that so many European cities have, a concept almost non-existant in North America.</p>
      <p>However, even if you're hurrying to make a connection or appointment, does a split second of extra glyph-processing time really make a significant difference?</p>
      <p>It may even be that when scanning a long list of names, serifed types are best at disambiguation—e.g. in a medical building lobby when checking to see what floor your doctor is on, and faced with a bewildering array of international names and medical specialties.</p>
