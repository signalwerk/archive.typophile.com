    html: <p>Wayfinding typefaces for directing people walking in a building have different legibility standards than highway signage.  Speed and distance requirements are much less demanding for pedestrians.  There are plenty of typefaces that would work fine for interiors of buildings that would be marginal for highway signage. "Perceived Neutrality" is rarely an issue for the reader, but some designers of signage may still cling to this as a desirable trait.  Other designers would choose a face for sense of place or harmony with surroundings, or in an attempt to get a particular feel.  For example, the original post mentions "natural, plants, life".  Perhaps they are intentionally looking for a type that might reflect those words reasonably well?</p>
