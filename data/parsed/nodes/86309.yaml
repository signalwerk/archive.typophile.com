      <p>That does sound like a good reason for the prevailing attitude. And I do see a lot more interesting design happening in the Environmental Design field now, so maybe these preconceptions are being eroded.</p>
      <p>I think the obvious answer too, is that a lot of the institutions are using the same "signage" sort of typefaces in or as their logos/brand/identities. So of course they are going to end up with it in their wayfinding signage by extension. I just heard a lecture<br>
      by Michael Bierut where he talked about designing the wayfinding for a Science Center in CT. He looked at the architecture<br>
      of the building and got all excited and ran off and had Chester Jenkins (I think that is who he said) design a whole typeface based on the angle of the architecture. When he presented it to the client, they looked phased and said "well we have to use Frutiger, that is what our identity is in."</p>
      <p>But I am still curious about wether visitors might actually be looking for an authoritative voice in an institution's wayfinding even if the place itself is not about being efficient. The idea that the wayfinding is somehow this voice outside the place it is representing. Would the visitors at a large amusement park not trust the signs leading to the concession stands and exits if they were set in Hobo?</p>
      <p>I guess the answer to the second part of ihio's question — Or the 'connection' doesn't matters in signages?— is, like in all design projects, that it really depends on the situation.</p>
      <p>Rats, and I thought I was going to come to some empirical knowledge about design on this one.</p>
