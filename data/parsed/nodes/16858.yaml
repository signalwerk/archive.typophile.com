    <p>Dear typophiles,</p>
    <p>What are the standards for using the Unicode Private Use Area's? For example, comparing Adobe Garamond Pro and Adobe Minion Pro:</p>
    <p>1. old-style numeral zero is represented in both by F730;</p>
    <p>2. For E04E, Garamond has Sacute.titling, while Minion Pro has orn.001 (an ornament).</p>
    <p>Are there any guidelines for this or is it just the wild west? (Context: working on an Arabic expert font, need a sane encoding scheme for alternates, swashes, etc.)</p>
    <p>Best<br>
    Idris</p>
