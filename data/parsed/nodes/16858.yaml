      <p>Just an aside: I think that encoding Arabic ligatures (As in Arabic Presentation Forms A) was a really bad idea. The list is not exhaustive and many of these are virtually never used.</p>
      <p>Indeed, the whole concept of ligatures with respect to Arabic is generally very poorly thought out. When one works on highly vowelized classical text (as I do-&gt;) the limitations of this approach becomes very apparent. I am working on an alternate approach, which maintains the beauty of Classical Arabic-script while disposing of ligatures (except for a couple or so).</p>
      <p>Best</p>
