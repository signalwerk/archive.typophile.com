      <p>Thank you very much for your insights-)</p>
      <p>So what do I do for alternate glyphs in an Arabic font? I am not talking about the usual contextual variants (ini, med, end, and iso) or ligatures, but rather alternates (like swashes). So, e.g., [nun]-iso (0646) may have a usual glyph and a swash variant [nun.swash] (generally used to improve paragraph and line spacing). How do I encode [nun.swash]?</p>
