      <p><em> What confuses the analysis is trying to determine where the lam ends and the alif begins, which is probably why this combination has been taken as a singular textual element.</em></p>
      <p>Actually, the primordial reason is more cosmological/numerological. The word [laa] (symbolized by [laam]-[alif]) means "no", as in, "No god but Allah". The symbol for the negation is counted as a single "letter" of the alphabet. It is also significant that the Arabic for "No god but Allah" is composed only of alif's and laam's (with a haa at the end). Phenomenologically "laa" symbolizes the stage of mystical or unitary consciousness where all discrimination ceases. At the same time the name for this character/letter is just [laam-alif]. The point is that no other letter combination is reified as such in Classical Arabic other than this one: It is often and traditionally counted as the second-to-last letter of the alphabet. Thus one could make a strong argument for maintaining it as a ligature in the Unicode main Arabic block. [laam-alif] is in the interesting (and perhaps unique) situation of being both a ligature and a single character at the same time</p>
      <p>Of course, for type design and typography purposes this is all <em>practically</em> irrelevant-) But on philosophical grounds I would place U-FEFB in the U-0600 block...</p>
      <p>Best</p>
