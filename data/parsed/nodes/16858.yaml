      <p>It depends on what you intend your font to be used for.  For example, if your font is going to include a large number of mediaeval variants forms, ligatures, and symbols, it might be a good idea to follow the standards laid out by a group so that your font can be used on all documents that previously used theirs, and vice versa.  Basically, PUA is a sort of neutral-zone, where anyone can define their standard using standard code point references (as opposed to adding encoding slots which most likely won't be reproducible in all applications).  A number of groups have collaborated to define these spaces but they are hardly required.  For an example of how these work try reading more about the Medieval Unicode Font Initiative at <a href="http://gandalf.aksis.uib.no/mufi/" title="http://gandalf.aksis.uib.no/mufi/">http://gandalf.aksis.uib.no/mufi/</a> .  </p>
      <p>On the other hand, if you're including dingbats, ornaments, or other features that can't or have no need to be transcoded (transliterated? transgraphemed? transcoded?) to another font, then feel free to fill it up as haphazardly as you'd like.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
