      <p>I second what James Montalbano said about the Cherokees. They so movingly explained how in their efforts to keep their language, reading and culture alive, having good typefaces, and aesthetically varied type designs are key to motivate people to read, and the preservation and development of culture. They said "What you do is precious, it is a valuable contribution to culture, thank you!"</p>
      <p>Incredibly touching.</p>
