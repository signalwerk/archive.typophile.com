    html: |-
      <p>With the insanity of Bourbon Street just outside I think most folks were having a good time in the hotel. I tried drinking Sazeracs in three different bars, and the hotel bar made the best one by far. I turned Petra Weitz on to Negronis, she was trying to blame me for getting her drunk before the TypeQuiz.</p>
      <p>I think the conference organizers did a terrific job, and from a content point of view, the best TypeCon I ever went to.</p>
      <p>One of the more compelling presentations was done by three gentlemen from the Cherokee Nation, encouraging the type design community to develop more fonts with Cherokee language support.</p>
      <p>No location for 2012 was announced. Too many organizational decisions yet to be made I would gather.</p>
