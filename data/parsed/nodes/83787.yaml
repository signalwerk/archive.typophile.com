      <p>It was an awesome conference. The mood was super, with content to match!</p>
      <p>The Cherokee presentation also stood out for me. What struck me most<br>
      is what smooth operators they are (especially Joseph Erb) - they really<br>
      know how to work the ropes, getting Apple to fully support a script for<br>
      a population of less than 300,000! They're working so hard with so<br>
      much insight to plant hope where there is so little.</p>
      <p>Another highlight for me was making new friends - usually I hang out with<br>
      the people I already know, but New Orleans has an infectious friendliness!<br>
      Oh, and the riverboat cruise at the end - talk about a smooth finish.</p>
      <p>hhp</p>
