    <p>GansBlasones is a new dingbat font by Intellecta. The images was selected from the vignettes catalog from Fundicion Gans published in 1920 and represents heraldry devices, Spanish city seals, world nations seals, coats of arms, helms, crowns, crests etc. Gans typefaces from Intellecta was researched in several type-specimens of the extinct spanish foundry of Fundicion Gans  and reprents the efforts of Intellecta to maintain the memory of this remarkably type foundry. Actually,this font is in the Hot New Fonts at MyFonts</p>
