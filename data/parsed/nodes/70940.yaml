    html: <p>I'll second the Illustrator suggestion, though my tool of choice is FreeHand. I worked in a print shop for years and had to recreate logos all the time, and with practice it goes really fast. I'd say this logo, with its geometric forms and repeated elements, would take under an hour to recreate with vectors.</p>
