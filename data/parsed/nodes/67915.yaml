      <p>Alex</p>
      <p>As others have mentioned, the type craving market is small, and while you might have a list of 10 fonts, 99.99% of the world does not.</p>
      <p>I used to sell newspaper advertising. It bothered me when people would put an ad in the paper, and then complain that it didn't boost sales. I tried to impress on them that ads work best when the message they have is noteworthy, like a significant sales deal.</p>
      <p>I think the other thing works just as well. You can cut prices 75%, but there will be no reaction unless people are made aware of the discount, and it is something that is in demand. The problem is, as others have said, that fonts are not heavily advertised.</p>
