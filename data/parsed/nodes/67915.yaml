      <p>Who purchases typefaces?</p>
      <p>People who buy videogames buy them <em>with their own money</em>. So a discount makes a big difference to them, and impulse purchases are a normal phenomenon in that market - because a game is something one can have a lot of fun with.</p>
      <p>When it comes to typefaces, the way I see it, the market is broken down into a number of segments.</p>
      <p>One group is ordinary computer users who would like to have a selection of typefaces to use on their laser printer - other than the limited number that comes with their operating system, or the somewhat greater number that comes with Microsoft Office.</p>
      <p>If they purchase Corel Draw, or their computer came with Corel Office, their font requirements would mostly be met, because they would have professional versions of pretty well all the old standbys - Garamond, Baskerville, Palatino, Optima, Cooper Black, Hobo, Papyrus - and would not see a need to obtain more.</p>
      <p>The people who would consider spending even $20, never mind $200, for a typeface like Williams Caslon, Starling, Times Ten, Goodchild or even Stone... work for art departments and the like. They're not spending their own money, and they are purchasing typefaces for the specific requirements of a job. Yes, there is a possibility of buying a few typefaces on spec if it's anticipated they'll be useful multiple times in future work, adding to its perceived quality - but price elasticity is still far lower in this kind of market.</p>
      <p>This situation may change in future, if typefaces somehow become perceived as more of a fun thing to play with. For example, I could see more ordinary people being in the market for fonts if they were:</p>
      <p>a) more likely to be licensed for, and<br>
      b) easier to be used in</p>
      <p>web pages.</p>
      <p>Thus, I think that font foundries are acting soundly by not perceiving the likely results of discounts to be anything like those which would apply in the video game field.</p>
      <p>This is not to say that they're necessarily selling an awful lot at high prices either; it seems to me that there are a lot of commercial typefaces out there, only a limited portion of which will ever achieve any significant success. But since there are many typefoundries that appear to be thriving businesses, throwing up their hands and quitting the business doesn't appear to be the necessary solution. They're managing, and they will monitor market conditions and respond to them with due caution.</p>
