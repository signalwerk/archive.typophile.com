    html: |-
      <p>It seems to me that there are about 4 kinds of type buyers:</p>
      <p>1. The big guys who buy lots of seats and often custom fonts.  They need more exclusivity to ensure brand imprint. They need broad worldwide language support and numerous weights along with support and back up. They frequently work with established houses that can come to them with options, do testing, and offer after sales service.</p>
      <p>2. Large publishers or advertising groups who may need some exclusivity but for a shorter time span and perhaps not quite in the custom market. but need a bit of hand-holding. Need good language support but perhaps only one script.</p>
      <p>3. Graphic designers, freelancers, smaller publishing shops, who need very little supplier input but have much price negotiation with their own clients.  They may not need exclusivity but they can make multiple uses out of one purchase for work after the initial use of the type. Some students edge in to this area who will shortly carry their catalogue of type to freelance usage. This group needs a broad range of things but not always.  They may need display faces with limited weights but book faces with a broader spectrum of choices.  They don't expect to pay for after purchase service but need rock-solid products which just plain work as expected. Reasonable price but with expectations for multiple use drive them but mostly, their client's needs.</p>
      <p>4. One timers, hobbyists, scrap bookers and some students who just like the stuff but may never be in a position to make money from it. These folks have limited language requirement and limited weight usage.  They buy on a whim and assume type should be almost free. They make no money from type, it is more recreational for them. Quality is often not recognized by this group and the certainly make use of free type. They are the least technically savvy and may not even be sure how to load a font and determine if it is working properly. Cheap price and high novelty drive them.</p>
      <p>Does one price fit all?  No... But neither does value and quality and service.</p>
      <p>If you want to make money on volume, design type for group 4. Make it cheap and don't dwell on it much.  Think of it as a consumable with little longevity and  no sense of quality. Release very often and batch bunches of your older faded stock with slash/cut sales. You don't need a sales force or much of a craftsman's sense of pride to sell here.</p>
      <p>For number one, big guys, you need a core of operations that can handle these clients--in other words an investment in staff, and capital as well as a good base of connections and clients who "know you".  You can make money here too but you need a big investment to do well. The work must be quality work but not too leading edge to appeal to the market.  This is a collaborative approach. You need to understand business and be able to work with different sets of people.  This is not the place for someone who just wants to design nice type.  This is a place for a business head and a process thinker who has access to all the other pieces of the puzzle.</p>
      <p>The other two groups are tougher to pin down because boundaries get fuzzy quickly. These guys want great design because that is what they assume they do. They need a mix of both innovative and workhorse type. They need to be able to more than cover type costs with usage but do not have deep pockets.  They prize quality highly but can't afford boutique prices.</p>
      <p>Which is the most lucrative market? Depends on who you are as supplier. Can you deliver the goods that are needed? Can you support the client segment? do you have access to the client segment in a usable way? What satisfies you? in the "make money vs design great type for your own sense of pride" continuum. You have to know who you are and what motivates you as well as who your market is and what motivates them.</p>
      <p>Align yourself with the market that fits you.  Are you a big profit guy or a "love of craft guy"?  You need to go for the mix that you can live with as a person and live on as a human being. Mix and match if that is you but realize that every venture has some sort of price for some sort of reward.  The price and reward can be either monetary or pride, whatever floats your boat.  Just be able to accept what you wish and work for with all of its ramifications.</p>
    html_clean: |-
