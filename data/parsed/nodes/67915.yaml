      <p>I don't buy fonts as often as I'd like to primarily because I do mostly web stuff these days. But I have made impulse purchases over the last couple of years...one being James' Recovery (it was at an easy 'impulse buy' price point) and several from Dino's DSType when they had a large sale. Granted, DSType's wares were getting a lot of awareness before the sale, which probably helped.</p>
      <p>So, anyways, I am but one fence sitter.</p>
      <p>I think the 'non piker serious client' designer is a valid market just as much as the 'freelancer who has an eye on a few faces just because they really like them' market. I think one can market to both using the occasional discount model. Designer A needs a face when they need it. They have the budget to buy it at that point. Designer B doesn't need a particular face, but would like to have it if/when they see a discount. </p>
      <p>It's sort of like airfare. M-F the airlines charge what they want as most business travelers will pay whatever because they have to get from point a to point b. Tourists can get a discount by flying weekends and waiting for that occasional discount on a non-full flight.</p>
