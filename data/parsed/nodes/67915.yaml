      <p>I think the way some of us think about the value and distribution of fonts is a bit draconian.</p>
      <p>We all agree that people's hard work is valuable, and that good fonts are worth money. That isn't debatable.</p>
      <p>What Steam does for videogames is outstanding. Steam sells millions of games in an age of piracy and penny pinching. People happily spend their hard earned money on games because the games are good and the prices are amazing. Steam's christmas sale, for example, had games from 60-90% off. Good games too. I personally purchased dozens of games that I haven't even played yet just for the fact that they were great games and the prices would never be cheaper. </p>
      <p>Do video games take a lot of time, talent, and resources to create? Yes. Are good videogames worth money? Yes. Are the distributors, creators, developers, or game community the lesser for selling their games at a heavy discount? Absolutely not.</p>
      <p>Perhaps a great font like Bembo isn't something I would purchase. I have other nice serifs that do a fine job. Now, if the Bembo family went on say for say, $20 I would be extremely likely to purchase it because it becomes an incredible value for me.</p>
      <p>Discounted sales on fonts would be huge and I support the idea 100%.</p>
