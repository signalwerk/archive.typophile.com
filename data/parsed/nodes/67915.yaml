      <p>Discounts do result in extra font sales, but the numbers are very different from first-part discounts on Steam, and the Steam model is largely irrelevant in comparison to fonts. This is because:<br>
      • There are literally tens of millions of people capable of buying and playing games using a service like steam. The number of graphic designers in a position to actually buy fonts is in the tens-of-thousands. So there’s a hard limit in how big a font sales spike can be.<br>
      • Because the market for fonts is so much smaller advertising budgets are also much smaller. Valve spends millions of dollars to promote its games. No type designer can do that—most type designers are making less money in a year than Valve spends advertising a single game. When Valve has a sale thousands of people are waiting for it. Not many people are just waiting for that one font to go on sale.<br>
      • Games are inexpensive entertainment items and there is a constant market for them as impulse buys. Even discounted, fonts are professional tools and usually purchased only as needed. This is why fonts discounts happen mostly during August and December when the design market slows down. Discounts during the rest of the year just eat away at profits on sales that would occur anyway.<br>
      • Discounts should be irrelevant to serious designers as fonts are professional tools and their cost should be passed along to clients. Designers with serious fonts budgets aren’t pikers working for clients who nickel-and-dime everything. Constantly experimenting with pricing and promotions to try and dredge up some extra sales from the bottom of the barrel eats up time that could be spent drawing more fonts to sell to serious designers.</p>
