    <p>In the light of <a class="freelinking external" href="http://typophile.com/node/67790" rel="nofollow">this thread</a> I just remembered this piece of news from a year ago - <a class="freelinking external" href="http://www.shacknews.com/onearticle.x/57308" rel="nofollow">a half-price sale of a game resulted in 3000% increase in sales</a>.</p>
    <p>&lt;quote&gt;<em><br>
        * 10% sale = 35% increase in sales (real dollars, not units shipped)<br>
        * 25% sale = 245% increase in sales<br>
        * 50% sale = 320% increase in sales<br>
        * 75% sale = 1470% increase in sales<br>
    </em>&lt;/quote&gt;</p>
    <p>Some strings attached of course, not exactly the same product type, but still I suspect that those of you guys open to licensing experiments may find it quite interesting.</p>
