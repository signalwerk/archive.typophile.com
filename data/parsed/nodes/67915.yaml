      <p>Stop with Stream, just stop. Forget about the games. Don't anchor there, look at a larger picture.</p>
      <p>There are different categories of buyers, <em>especially</em> for such a niche product as fonts. If you are pricing your fonts too high, you are aiming at agencies and missing out on individuals. If you are pricing your fonts too low, you are getting to the "mass market", but commoditizing the font, making it less appealing to the larger agencies. Why you guys are so resistant to the idea of scooping up low-budget buyers once a year with a deep discount sale (not 5-15%, but 50%... something that would make an impulsive purchase an <em>absolute</em> no-brainer) - that frankly I don't understand. $60 per weight should get you a flow of well-budgeted customers, and $5/weight would get you a burst of those who are ready to pay you less, but pay no less. </p>
      <p>Also, this is an excellent opportunity to develop a mailing-list (or Twitter, or Facebook) following that can be further used to market new designs and what nots. Just put a small plug on a website saying "we have a deep discount sale once a year, sign up if interested". Guess how many of those who really like the font, but find it too pricey will <em>not</em> sign up? A rhetorical question.</p>
