      <p>Pretty close, but there are some differences. The image has slab/angled serifs,<br>
      Decorated 035 has Clarendon style cove serifs and the bottom of the J is more rounded.<br>
      The problem is that we are examining to an image you drew rather than an original image. Close examination of the original is required to determine the shape of the serifs. If they are in fact Clarendon style, then Decorated 035 is a good candidate for a match.<br>
      BTW Bistream's Decorated 035 is actually a font designed by Eugen Lenz and Max Lenz in 1946 and sold by Haas as Profil.<br>
      Don</p>
