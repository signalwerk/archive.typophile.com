    date_raw: 23 Mar 2014 — 1:52am
    date: 2014-03-23T01:52:00
    votes: null
    html: |-
      <div class="comment-spam-body"><p>Getting inside the mind of the designers of the past is a necessary (if somewhat subjective) part of type revival, and an interesting exercise in itself for someone like me for whom type has not been a vocation. I agree on the various faults of the Jaspert volume, but it does beat sifting through endless, musty old type specimen books from the world's many former metal type foundries - though some of these are now available as free pdf downloads. I also have the Rookledge, covering the most popular faces of the phototypesetting age. But this has even more egregious faults than the Jaspert, providing no background information on a typeface's origins - designer, date or foundry - even though there is a better categorization.</p>
      </div>
