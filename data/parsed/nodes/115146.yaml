      <p>Hi Andrew, yes Jaspert is gold for font detectives. Some errors, but nothing else comes close for digging into metal type IDs. To bad it does not have a good category index. Have to go though it page by page to find the Ah-Ha moment. As for this font, I can't understand why Lenz &amp; Lenz released Profil only as a sloped font. Why not a regular vertical version too? Go figure, mind-reading the past is a mugs game...<br>
      Don</p>
  - id: 574411
