    <p>Hello everyone, I'm new here, My name is Adam and I'm from Poland.</p>
    <p>I really enjoy watching and working with type while doing internship<br>
    in one of fast growing branding studio in Gdańsk.</p>
    <p>Meanwhile I'm still working on my personal portfolio and trying to<br>
    make logotype for my web alias (not best naming but I like it).<br>
    Image of second version is attached, first was based on avant garde,<br>
    new one (attached one) is based on gotham.</p>
    <p>My main concerns are about light between glyphs and proportions of<br>
    "D" merged with "1". I got some concerns also about "E" but my main<br>
    problem is "1D" and overall kerning, focus on that.</p>
    <p>If there is any typophile so kind to help me with his knowledge and<br>
    good eye I would be very thankful for help.</p>
    <p>Regards,<br>
    Adam</p>
