    html: <p>You could try <a class="freelinking external" href="http://www.fonts.com/font/linotype/neue-helvetica/73-bold-extended/web-font" rel="nofollow">Neue Helvetica 73 Bold Extended</a> through Monotype's web fonts service. However, the samples generated on their web site for Firefox (5/7) on different versions of Windows are not promising.</p>
  - id: 518377
    user: 173785
    date: 2012-08-08T04:48:00
    date_raw: 8 Aug 2012 — 4:48am
    votes: null
    html: <p>Thanks Karl, I'll compare those. I'm actually thinking that this does render better than the others I've found. It might not be extended enough though. It needs to be very close to help convince the client to not use CUFON or something equally ancient.</p>
