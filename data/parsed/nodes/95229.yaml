    <p>Hi all</p>
    <p>I need to find a webfont alternative to Berthold Akzidenz-Grotesk Bold Extended (<a href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-be/bold-extended/" title="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-be/bold-extended/">http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-be/bold-extended/</a>) preferably with a light weight in the same family.</p>
    <p>So far, I;ve found "foundation sans" <a href="http://www.fontspring.com/fonts/fontsite/foundation-sans" title="http://www.fontspring.com/fonts/fontsite/foundation-sans">http://www.fontspring.com/fonts/fontsite/foundation-sans</a> and Nimbus Sans <a href="http://www.myfonts.com/fonts/urw/nimbus-sans/black-extra/preview.html" title="http://www.myfonts.com/fonts/urw/nimbus-sans/black-extra/preview.html">http://www.myfonts.com/fonts/urw/nimbus-sans/black-extra/preview.html</a>  - These are close enough for this project.</p>
    <p>However, they both render badly in Firefox on seemingly all versions of windows. Does anyone have any tips or can suggest alternatives?</p>
    <p>Much appreciated</p>
