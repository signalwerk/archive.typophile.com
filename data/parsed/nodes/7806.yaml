  html: <p>Hi everyone,  <br> <br>yes Fontlab is the best font-editor?, but I'm having so much troubles with the program. Is it the system (OSX 10.3.6) or is it me?, I'm having a legal copy. The people at Fontlab can't help me much, maybe there is someone who can help me?, th last few weeks I cannot start up Fontlab (4.6), the programs starts up but halfway after the message 'caching ATSUI fonts' the program quit. I've tried to start up in OS9 and OSX.  <br> <br>Anyone knows what the problem could be?, at fontlab they suggested to reinstall the system, but that is to much for me,  <br> <br>thanks in advance  <br> <br>greetings  <br> <br>zoe <br> <br>(I've posted this topic also under 'general discussion' since i did not know there was a 'build' section)</p>
