      <p>Andreas — I understand your frustration and that it seems like no one is paying attention. From what I understand, however, the IT guys at Punchcut are unable to reproduce many of the image upload issues that various users encounter. That makes it very hard to troubleshoot and fix. They have been trying.</p>
      <p>When all else fails, you can always place an image in a post using an HTML &lt;img&gt; tag. I realize that this is inconvenient. I also realize that this may not be so easy for folks who aren’t comfortable with HTML, but I bet they’re a small minority here. For those who don’t have their own server to host images, there’s always Flickr or a similar hosting site. </p>
      <p>Not perfect solutions, but ways to work around these stubborn bugs.</p>
      <p>As for the limited character support in the sIFR headlines, someone at Punchcut will have to respond about that. I don’t know what their limitations are or what guides their decisions with Featured Font sponsors about glyph subsetting.</p>
      <p>Dust — Your issue is completely separate. You got server error messages because your ID request was flagged by Akismet as spam and was sent to a moderation queue. I can’t tell you why this happens, because I don’t really understand the Akismet algorithm. It is imperfect at best. I wish the system returned a more informative message to users, but that’s not an area under my control.</p>
      <p>Your forum message has been cleared now and should be posted, and I’ve whitelisted your account.</p>
