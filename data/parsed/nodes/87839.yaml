    html: |-
      <p>1MB is a reasonable limit for images. If its a web-friendly format like jpg/png/gif, 1MB would typically be too large for useful display. That said, I use a Wiki at work, which provides a really cool 'thumbnail' option. The article gets a small, re-sized image and a link is auto-generated to load the full file. That kind of scheme would be ideal for Typophile because users sometimes want to share minute details. It is a community of design wonks, after all. </p>
      <p>This might be an opportunity to explore different uploader options. Perhaps there's something commonly used with Drupal with similar functionality that doesn't depend on Flash.</p>
      <p>Hot-linking, or whatever the web kids call it, is wrong because the content is not contained. Typophiles refer to old content much more often than other web communities. If a pertinent image goes missing from an archived thread, the value could be lost. It might not seem obvious if you ignore other discussion sites, but the signal-to-noise ratio is probably higher here than any other site I visit. </p>
      <p>I'm not even sure I'm a true Typophile--I just find John Hudson and Hrant's banter interesting.</p>
