      <p><cite> &gt; Are you suggesting that they're simply incompetent?</cite></p>
      <p>No. I was trying to convey that the pleas have not simply been ignored.</p>
      <p>I doubt the issue is pixel dimensions, since there are plenty of images still being uploaded by users that push the pixel size boundaries.</p>
      <p>The default maximum file size per upload is 1 MB. I thought that was stated somewhere, but perhaps users aren’t aware. (But why would someone be uploading a &gt;1MB file anyway?)  Do you recall how large your original file was, Carl?</p>
      <p>I did just notice a setting in the Admin section that Drupal annotates with “The default maximum size of all files a user can have on the site.” I wonder if users who are having the upload issue are frequent posters and have surpassed this “lifetime” limit?</p>
      <p>I don’t think that would explain all cases, but I’ll check with Rhett and the guys and see if maybe we should change that setting.</p>
      <p>I seem to recall that there are two separate and perhaps unrelated (or maybe not) issues — one is uploading and inserting images in a comment; the other is uploading and attaching files (especially PDFs) in an initial post. I think Andreas’ latest frustration was triggered by the former, while Ben was having problems with the latter (or maybe both?).</p>
      <p>I have always suspected that the Flash uploader might be a culprit in the current configuration, but I don’t know enough about Drupal.</p>
