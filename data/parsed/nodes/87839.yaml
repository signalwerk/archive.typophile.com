      <p>The "onHTTPError: 500" is different than the problem with spaces or UTF-8 characters in the file name. The latter results in: "Could not copy image. Error". </p>
      <p><cite>But my point is that in 2011 we should have uploading programming sophisticated enough to convert submitted filenames into workable ones rather than just failing.</cite></p>
      <p>Exactly.The latter issue reminds me of a statement made within Flickr's API documentation. It says something like "The Flickr API expects all data to be UTF-8 encoded" in giant letters. This is the baseline/expected behavior for the web circa 2011. A Chinese type designer should be able to name their files in Chinese. The majority of human beings do not speak English, and modern type design potentially involves all written language. So, it seems to me that Typophile should be able to handle this stuff. Again, I'm not suggesting that Punchcut is capable of creating an uploader. They just need to find/license one that works properly for their site and implement it.</p>
