    <p>Hello all,</p>
    <p>Trying to find an appropriate typeface to use for a book I'm designing.<br>
    Looking for an Italian typeface from around 1400-1500.<br>
    So far I only really have Bembo in my palette, so I thought I'd see if you good people could offer any further suggestions whilst I continue my research.</p>
    <p>Thank you,<br>
    Sam</p>
