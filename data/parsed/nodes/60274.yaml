    html: <p>Centaur is a great one--a redesign of Nicolas Jenson's work, and is considered a Venetian Renaissance font. Designed (if I remember correctly) in the 1920s by Bruce Rogers. Does great in display (as the header for the Metropolitan Museum of Modern Art) as well as in print (for a long time Rogers used it exclusively himself on small, fine art books).</p>
