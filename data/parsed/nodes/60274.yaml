      <p>In general you're looking for a Venetian font:<br>
      Adobe's Jenson Pro is one, Nick Shinn's Goodchild is another. The field is wide... do you want "authentic look" or "inspired by"?</p>
      <p>See:<br>
      <a href="http://www.fontshop.com/fontlist/subclasses/serif_venetian/" title="http://www.fontshop.com/fontlist/subclasses/serif_venetian/">http://www.fontshop.com/fontlist/subclasses/serif_venetian/</a></p>
