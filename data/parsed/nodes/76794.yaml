    html: |-
      <p>@ Jens</p>
      <p>Yes, I remember, that it also works directly with the userContent.css. I started to learn CSS by customizing the Firefox skin by adding CSS to the user<strong>Chrome</strong>.css.</p>
      <p>Do you know, if it is possible, to disable the original Typophile CSS without using “menu / view / page style / no style”? First it is not permanently disabled and second I would like to turn it automatically off, when my user style is turned on. I am not searching for a CSS, that tries to rebuild the browser default preferences, but a kind of one-liner in my code.</p>
