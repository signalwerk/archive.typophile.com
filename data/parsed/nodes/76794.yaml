  - id: 442400
    user: 45774
    date: 2010-12-04T13:46:00
    date_raw: 4 Dec 2010 — 1:46pm
    votes: null
    html: |-
      <p>If you want to permanently disable the original CSS of Typophile.com, you can use the add-on <strong><a href="https://addons.mozilla.org/en-US/firefox/addon/748/" rel="nofollow">Greasemonkey</a></strong> and this script:</p>
      <p><code>// ==UserScript==<br>
      // @name           Typophile<br>
      // @namespace      <a href="http://www.greasespot.net/" title="http://www.greasespot.net/">http://www.greasespot.net/</a><br>
      // @include        <a href="http://typophile.com/*" title="http://typophile.com/*">http://typophile.com/*</a><br>
      // ==/UserScript==<br>
      for (var i = 0; i &lt; document.styleSheets.length; i++)<br>
        document.styleSheets[i].disabled = true;</code></p>
      <p>Your user CSS (stylish/UserContent.css) will not be disabled by that code. And instead of user CSS, you can add CSS to the script above. Example:</p>
      <p><code>var css = "* {color: #00f !important;}" +<br>
        "div {background: #ff0 !important;}";<br>
      GM_addStyle(css);</code></p>
      <p>Greasemonkey adds an icon to the status bar, with the help of which you can turn Greasemonkey on and off.</p>
      <p>And you also can use those user scripts in Google Chrome.</p>
