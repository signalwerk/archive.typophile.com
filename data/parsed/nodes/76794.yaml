  html: |-
    <p>With the help of the add-on <strong><a href="https://addons.mozilla.org/de/firefox/addon/2108/" rel="nofollow">stylish</a></strong> you can make use of it.</p>
    <p><code>/* :::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::<br>
    * User style for Typophile.com<br>
    * Version: 1.004<br>
    * Author: Arno Enslin<br>
    * :::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::<br>
    */</code></p>
    <p><code>@-moz-document domain(typophile.com) {</code></p>
    <p><code>* {<br>
    font-family: Verdana !important;<br>
    font-size: 13px !important;<br>
    }</code></p>
    <p><code>.content {<br>
    color: #222 !important;<br>
    }</code></p>
    <p><code>code {<br>
    font-family: Consolas !important;<br>
    font-size: 14px !important;<br>
    }</code></p>
    <p><code>.comment .content *,<br>
    .node .content * {<br>
    line-height: 19px !important;<br>
    }</code></p>
    <p><code>a:link,<br>
    a:visited,<br>
    a:hover,<br>
    a:active {<br>
    border-bottom: 0 none !important;<br>
    }</code></p>
    <p><code>.comment .content a:link,<br>
    .comment .content a:visited,<br>
    .comment .content a:hover,<br>
    .comment .content a:active,<br>
    .node .content a:link,<br>
    .node .content a:visited,<br>
    .node .content a:hover,<br>
    .node .content a:active {<br>
    text-decoration: underline !important;<br>
    font-weight: normal !important;<br>
    }</code></p>
    <p><code>a:link,<br>
    a:visited {<br>
    color: #003E6F !important;<br>
    }</code></p>
    <p><code>a:hover {<br>
    color: #A00 !important;<br>
    }</code></p>
    <p><code>a:active {<br>
    color: #003E6F !important;<br>
    }</code></p>
    <p><code>ul.primary li a {<br>
    color: #FFF !important;<br>
    }</code></p>
    <p><code>ul.primary li a:hover {<br>
    color: #AAA !important;<br>
    }</code></p>
    <p><code>ul.primary li.active a {<br>
    color: #AAA !important;<br>
    }</code></p>
    <p><code>}</code></p>
