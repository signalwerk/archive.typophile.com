    date_raw: null
    votes: null
    html: <p>I hate to say it, but I think the popularity we have been seeing for 'Eclat' has a lot to do with Nick Curtis's freeware version. Evidently this typeface is older than Doyald Young's version, because Nick gets a lot of his lettering from old font books from the 30's and earlier. <br> <br>I think we talked about this with at least indirect participation from Doyald, but I admit I don't recall the 'punchline' about the origin of the font.</p>
