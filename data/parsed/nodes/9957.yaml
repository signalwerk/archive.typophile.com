    votes: null
    html: <p>Thanks Sander. I know he provides notes, so I am remiss in not reading that one. For a long time Eclat was not available except in the Image Club Letterpress. Letraset had apparently never digitized it. The Image Club version even had an alternate version, which I don't see anywhere now. The f, g, k, r, y, z, W and Y were different. See sample below, which will be added to the Script Font ID Guide ASAP. <br><img src="http://www.typophile.com/forums/messages/83/68248.gif" alt="Eclat Alternate Sample"></p>
