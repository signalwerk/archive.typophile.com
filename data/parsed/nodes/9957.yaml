    date_raw: null
    votes: null
    html: "<p>Actually Nick Curtis's freeware version is directly based on Eclat and not on an earlier source. This is Nick's note on the font: <br>\"Another phine phont phorwarded by Phil --- Letraset Eclat --- provided the inspiration for this addition to the collection. A mover, a shaker and a money-maker, ideal for when when you want to make a strong but elegant statement. The name? Eclat � �clair � Creampuff � seemed like a natural progression to me.\"</p>"
