      <p>Both of Michael Harvey's books are good instructional books on just the sort of exercise you are embarking on (drawing letters) except they do not, that I remember, deal with "scripts." The techniques, though, are there. Johnston's is a good historical resource. </p>
      <p>Go to Myfonts and look at scripts, set your name/logo in them, and ponder :-)</p>
      <p>Good luck.<br>
      Michael</p>
