    <p>I've never done anything like this before, but I want to learn as much as I can from this little project. I'm trying to come up with a nice handwritten-script logo for myself. I may end up using it, but I'm more interested in learning and practice at this point.</p>
    <p>I'm anxious to hear your thoughts! I want to improve construction, flow, and consistency if possible (and I'm sure it is).</p>
    <p>Cheers<br>
    Brendan</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/wip_bstrom_a1_5045.jpg"></div><p></p>
