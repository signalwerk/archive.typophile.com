    html: |-
      <p>Only use an edged pen if you want edged-pen letterforms. Yours look like they want to be a formal connecting script. An edged pen will not help you with that.</p>
      <p>Doyald Young's books can give you a major insight into formal script. </p>
      <p>You are killing yourself with this with the r and s. The two most difficult letters to draw and harmonize in a script. Most of a formal script can be created with 3 or 4 main shapes with exceptions for the r and s. And sometimes the x. Draw a set of parallel lines that delineate the angle of the script. Draw an i, l, n to match that angle with whatever connecting stroke you desire. Then go on to the o. Once you have an o and an l, you are on your way to a d. Cut the top off of the d and you have an a. The b will be different. Ultimately it is all modular, with variations that give it flavor. </p>
      <p>Remember: nnoonon</p>
      <p>Straight stroke, curved stroke, connecting stroke.</p>
      <p>Start there and eventually you will be ahead of the game.</p>
      <p>The uppercase is an entirely different matter. But modular just the same.</p>
