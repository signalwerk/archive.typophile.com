    html: <p>From reading the comments in the python files, autohintexe works only on glyphs in some "bez" format, there is a Pyhton wrapper AC.py that work on font files, which is called by autohint.cmd. With some little effort you can get it to work on Linux with wine (I have to add the "win" directory to my PATH, rename all .exe files to get rid of the extension, make sure binfmt support is working so windows programs can be called directly like native executables) Now it is working and I got it to hint a font, but I didn't check if the hinting is correct.</p>
