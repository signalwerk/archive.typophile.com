      <p><cite>…unless I'm doing something wrong (yes, it's a crappy old laser printer).</cite></p>
      <p>Low-end printers don’t always interpret hints correctly, and if the model has no Postscript emulation at all bad hints can deform letters when the output is converted to PCL. The hints produced by the Adobe autohinter work better than others, but in my experience it’s best to just not autohint a font until the final step of production.</p>
