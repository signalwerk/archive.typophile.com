  html: |-
    <p>Ladies &amp; Gentlemen,</p>
    <p>I'm a happy user of FontForge under Linux. I'd like to try out Adobe's autohinter just for the fun of it. Back in the day, Thomas Phinney <a href="http://www.thomasphinney.com/2009/01/afdko-25/" rel="nofollow">announced</a> it'd be available for Windows, Mac and Unix. It seems that this is not true -- at least I was only able to find Windows and Mac versions. </p>
    <p>Wine allows me to run autohintexe, but when passing any files to it (OTF or PFA/AFM) I get error messages like <code>"Error. Illegal command line. Must provide font info file name."</code> or <code>"ERROR: Bad file format. Unknown operator: dict in  character."</code></p>
    <p>If anyone ever got this to work, or if I'm doing something totally wrong, I'd be thankful if you could share your wisdom!</p>
