    html: |-
      <p>I don't really see Interstate in the logo - the proportions are quite different, not just on the K and the S.<br>
      It almost looks like a mishmash of different sources, with the special K, s and low R.<br>
      You may want to take a look at Gotham Ultra and then start tweaking.</p>
      <p>Certainly a long way from the Karstadt I knew with back in Duesseldorf.</p>
