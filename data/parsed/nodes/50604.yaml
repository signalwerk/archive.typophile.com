      <p>I'm doing great! Back in Offenbach, for the moment at least…</p>
      <p>The Karstadt logo sure looks like Interstate to me…&nbsp;here is a comparison image:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/karstadt-logo-maybe_4892.jpg"></div><p></p>
      <p>The K and the S do look a little tweaked… especially the S!</p>
      <p>They definitely use Interstate in some of their advertising and graphics (see <a href="http://www.fontblog.de/neue-karstadt-schrift-albertina" title="http://www.fontblog.de/neue-karstadt-schrift-albertina">http://www.fontblog.de/neue-karstadt-schrift-albertina</a> – in German; the picture is in Albertina, but Interstate is mentioned in the text)</p>
