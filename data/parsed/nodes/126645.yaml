    html: <p>It's not a problem either way, but really depends on line length—hyphenation being added to shorter lines for a nicer rag.</p>
    html_clean: <p>It's not a problem either way, but really depends on line length—hyphenation being added to shorter lines for a nicer rag.</p>
  - id: 606130
    user: 8415
    date: 2017-08-20T05:24:00
    date_raw: 20 August 2017 - 5:24am
    votes: 3
    html: <p>Depending on the usecase, do it wisely, sparsely and/or to create visually appealing rags that also contribute to a proper outline leading to better readability. Try to use hyphens only in places that do not disturb the text's legibility (i.e. where two significant parts of a compound word meet, before/after pre-/suffixes, don't hyphenate proper names or in problematic cases like "anal-phabetic"). If you cannot spend time and effort to do it properly, avoid it completely. This question also relates to different languages and national/regional conventions or norms with regard to typesetting, which are in part defined by language structure – e.g. agglutinating languages will likely have to use hyphenation in order to avoid underfull lines.</p>
