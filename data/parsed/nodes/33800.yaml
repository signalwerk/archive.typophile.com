    <p>I am designing packaging for chocolates and I want to get the message across as them having a luxury feel to them. They are aimed at women, maybe over 25 who want to relax and enjoy eating these luxurious chocolates. I would like feedback on the choice of typeface I have chose but not sure which one works the best. Please feel free to give feedback.</p>
