  - id: 203376
    user_id: 7783
    user_name: Randy
    user_path: null
    date_raw: 18 May 2007 — 9:12am
    date: 2007-05-18T09:12:00
    votes: null
    html: |-
      <p>I hate to be a sour puss, but it's really hard to make any call from only a stripe + text. Any of these typefaces could work in some context to accomplish your goal. But here we have no context. It feels like you're starting with a typeface instead of a direction. And there are so many directions that would fit your demographic.</p>
      <p>If the packaging had line illustration, that might dictate a certain type choice.<br>
      If the packaging had watercolor illustration, perhaps another type choice.<br>
      If the packaging was wrapped in sassy fishnet stockings a very different choice.<br>
      If the packaging was a just a stripe, I'll take the fishnet.</p>
      <p>All that to say... show us the packaging. Show us your direction so we can help you.</p>
      <p>As a lover of chocolate I admire the shelf appeal and taste of the following:<br>
      <a href="http://www.charleschocolates.com" title="http://www.charleschocolates.com">http://www.charleschocolates.com</a> (hip contemporary - especially their bars)<br>
      <a href="http://www.scharffenberger.com" title="http://www.scharffenberger.com">http://www.scharffenberger.com</a> (old world with a twist - love the nibby bar)<br>
      <a href="http://www.vosgeschocolate.com" title="http://www.vosgeschocolate.com">http://www.vosgeschocolate.com</a> (juicy couture meets tiffany's over truffles)</p>
      <p>FWIW, Sabbath Black is the type of choice to go with the fishnet :-)<br>
      Give your chocolate a voice...</p>
      <p>Best of luck.<br>
      Randy</p>
