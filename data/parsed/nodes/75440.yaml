    html: <p>These kinds of posters were usually hand-lettered, so they don't necessarily match standard typefaces. The serif font on No. 2 resembles Barnart Brothers &amp; Spindler's Old Roman, while the sans on No. 3 is similar to Futura Bold Condensed.</p>
