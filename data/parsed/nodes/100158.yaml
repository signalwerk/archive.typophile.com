    html: |-
      <p>Starting by having a look to <a class="freelinking external" href="http://typecache.com/font-clusters/06/" rel="nofollow">Typecache Font Cluster: Stencil Serif/Slab Serif Fonts</a> could be helpful.<br>
      None of them are actually close. They share only "serif+stencil" specifications. Dala Floda is an original design and deserve its price.<br>
      Anyway, here's a selection: <a class="freelinking external" href="http://www.myfonts.com/fonts/applyinteractive/caslon-fina-stencil/" rel="nofollow">Caslon Fina Stencil</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/avia/" rel="nofollow">Avia</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typeinnovations/nadia/" rel="nofollow">Nadia</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typonine/ty-stencil-pro/" rel="nofollow">Typonine Stencil Pro</a>, <a class="freelinking external" href="http://www.playtype.com/font/q-stencil" rel="nofollow">Q-Stencil</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/gestalten/sensaway_pro_heavy/" rel="nofollow">Sensaway</a>, <a class="freelinking external" href="http://www.tendollarfonts.com/product/stencil-two-typeface" rel="nofollow">Stencil Two</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/de-vinne-stencil/" rel="nofollow">DeVinne Stencil</a></p>
