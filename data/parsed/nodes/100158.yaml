      <p>Starting by having a look to <a href="http://typecache.com/font-clusters/06/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Typecache Font Cluster: Stencil Serif/Slab Serif Fonts</a> could be helpful.<br>
      None of them are actually close. They share only "serif+stencil" specifications. Dala Floda is an original design and deserve its price.<br>
      Anyway, here's a selection: <a href="http://www.myfonts.com/fonts/applyinteractive/caslon-fina-stencil/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Caslon Fina Stencil</a>, <a href="http://www.myfonts.com/fonts/fontbureau/avia/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Avia</a>, <a href="http://www.myfonts.com/fonts/typeinnovations/nadia/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Nadia</a>, <a href="http://www.myfonts.com/fonts/typonine/ty-stencil-pro/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Typonine Stencil Pro</a>, <a href="http://www.playtype.com/font/q-stencil" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Q-Stencil</a>, <a href="http://www.fontshop.com/fonts/singles/gestalten/sensaway_pro_heavy/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sensaway</a>, <a href="http://www.tendollarfonts.com/product/stencil-two-typeface" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Stencil Two</a>, <a href="http://www.myfonts.com/fonts/jnlevine/de-vinne-stencil/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">DeVinne Stencil</a></p>
