  html: '<p><img src="http://www.typophile.com/forums/messages/83/52803.gif" alt="Example of Basilea"> <br> <br>Hey guys, Typophile has solved all my problems in the past, so I have no doubt this one will be cracked quickly as well. <br> <br>I guess this is not essentially an identification request, but I am looking to use a typeface for a project, and I want to purchase it for my client. The problem is that I have the typeface but I cannot find any place that offers it for sale. <br> <br>The type is called "Basilea" and/or "BasileaFont" and I know it was formerly distributed by Image Club. The only hit I get from Google is this: <a href="http://cgm.cs.mcgill.ca/~luc/ICG.txt" target="_blank">http://cgm.cs.mcgill.ca/~luc/ICG.txt</a> (a list of Image Club Graphics fonts). <br> <br>As you probably know, Image Club no longer exists, and while the Image Club Typeface Library is available through Fonts.com, they do not have it in their collection online.  <br> <br>Any ideas or suggestions are highly appreciated!</p>'
  html_clean: '<p><img src="http://www.typophile.com/forums/messages/83/52803.gif" alt="Example of Basilea"> <br> <br>Hey guys, Typophile has solved all my problems in the past, so I have no doubt this one will be cracked quickly as well. <br> <br>I guess this is not essentially an identification request, but I am looking to use a typeface for a project, and I want to purchase it for my client. The problem is that I have the typeface but I cannot find any place that offers it for sale. <br> <br>The type is called "Basilea" and/or "BasileaFont" and I know it was formerly distributed by Image Club. The only hit I get from Google is this: <a href="http://cgm.cs.mcgill.ca/~luc/ICG.txt" target="_blank" class="link-external">http://cgm.cs.mcgill.ca/~luc/ICG.txt</a> (a list of Image Club Graphics fonts). <br> <br>As you probably know, Image Club no longer exists, and while the Image Club Typeface Library is available through Fonts.com, they do not have it in their collection online.  <br> <br>Any ideas or suggestions are highly appreciated!</p>'
