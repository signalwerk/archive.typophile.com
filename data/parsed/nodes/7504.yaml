    html: <p>Folkert, Basliea was one of the several hundred typefaces that I personally expunged from the Image Club library for 'technical quality' reasons back in 1998. That's not to say that the face wasn't usable, it just wasn't up to the current technical specifications and typographic standards that I had set in place for the newer releases. <br> <br>The only place you'll find Basilea these days is on a old copy of Image Club's LetterPress disc. I have several LetterPress 7.0 CDs in my software archive, which are for sale. Contact me through my <a href="http://www.typophile.com/cgibin/board-profile.pl?action=view_profile&amp;profile=grant-users">profile</a> if you're interested in following up. <br> <br>Cheers.</p>
