    html: <p>If you don't hold a license for a font, or how it landed on your computer is questionable, chances are you shouldn't use it and you most certainly shouldn't be passing it along to other people. (Even if it was licensed properly, most/all foundries do not allow sharing their fonts.) If the designer still holds the rights to the design it is well within their rights to not allow a digital version of the font to be made.</p>
