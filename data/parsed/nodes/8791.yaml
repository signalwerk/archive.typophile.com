    html: "<p>Vojtech,  <br> <br>As Simon writes, there are different digital versions of Univers: official designs and their clones. Some of them are still available for sale, some are not. Below is a short list of those I know of. I agree with Simon that the Linotype \"XSF\" version is probably the one with the best screen quality.  <br> <br> <br>1. Font: LTUnivers (LinotypeUnivers-BasicMedium) <br>Format: Type 1 <br>Copyright (c) 1997 by Linotype Library GmbH / Heidelberger Druckmaschinen AG <br> <br>2. Font: Univers LT Std 55 Roman (UniversLTStd) <br>Format: OpenType PS (UniversLTStd.otf) <br>Copyright (c) 1987-2002 by Adobe Systems Incorporated, 1981-2002 by Linotype Library GmbH / Heidelberger Druckmaschinen AG <br> <br>3. Font: Univers LT 55 Roman (UniversLT) <br>Format: Type 1 (lte50138.pfb) <br>Copyright (c) 1987-2002 by Adobe Systems Incorporated, 1981-2002 by Linotype Library GmbH / Heidelberger Druckmaschinen AG <br> <br>4. Font: Univers LT 55 Roman (UniversLT) <br>Format: TrueType (lte50138.ttf) <br>Copyright (c) 1987-2002 by Adobe Systems Incorporated, 1981-2002 by Linotype Library GmbH / Heidelberger Druckmaschinen AG <br> <br>5. Font: Univers 55 Roman (Univers) <br>Format: Type 1 (UV______.PFB) <br>Copyright (c) 1987-1998 by Adobe Systems Incorporated, 1981-1998 by Linotype Library GmbH / Heidelberger Druckmaschinen AG <br> <br>6. Font: Univers 55 Regular (UniversBQ-Regular) <br>Format: Type 1 <br>Copyright (c) 1992 by H. Berthold AG, Berlin <br> <br>7. Font: Univers Medium (Univers-Medium) <br>Format: TrueType (unvr55w.ttf) <br>Copyright (c) 1992-1997 by Hewlett-Packard <br> <br>8. Font: Zurich (ZurichBT-Roman) <br>Format: Type 1 (0178A___.PFB) <br>Copyright (c) 1990-2001 by Bitstream Inc. <br> <br>9. Font: Zurich BT Roman (ZurichBT-Roman) <br>Format: TrueType (tt0178m_.ttf) <br>Copyright (c) 1990-2001 by Bitstream Inc. <br> <br>10. Font: Unitus T Regular (UnitusT-Regu) / U001T (U001T-Regu) <br>Format: Type 1 (u001003t.pfb) and TrueType (u001003t.ttf) <br>Copyright (c) 1994 by URW; (c) 1998 by (URW)++ <br> <br>11. Font: Univers Roman SB / Univers Roman SH <br>Format: Type 1 <br>Copyright (c) 1994 by Scangraphic <br> <br> <br>This list is by no means extensive and I'm sure I omit something.  <br> <br>I recommend testing on following operating systems:  <br> <br>[OSX] Mac OS X 10.3.7 <br> <br>[OS9] Mac OS 9.2 or Mac OS X Classic mode, with ATM 4.6 Lite installed <br> <br>[W98] Microsoft Windows 98 SE with ATM 4.1 Lite installed <br> <br>[WXP] Microsoft Windows XP SP-2 <br> <br>(If you're only working on a Mac, I recommend that you get Virtual PC and install two virtual machines, one running Windows 98 and the other Windows XP -- this way you will have the ability to test on all platforms on just one computer).  <br> <br>You can go to <a href=\"http://www.fontlab.com/\" target=\"_blank\">http://www.fontlab.com/</a> and download the demo versions of FontLab 4.6 for Mac and FontLab 4.6 for Windows. In FontLab, you can activate the \"Type 1 hinting tool\" to preview Type 1 fonts and the \"TrueType hinting tool\" to preview TrueType fonts.  <br> <br>Using FontLab 4.6 on Windows 98, you can preview the Type 1 and OpenType PS fonts using the Adobe ATM 4.1 rasterizer in 2 modes (black-and-white and grayscale), and TrueType fonts using the Microsoft Windows 98 TrueType rasterizer in 2 modes (black-and-white and in 5 shades of gray).  <br> <br>Using FontLab 4.6 on Windows XP, you can preview the Type 1 and OpenType PS fonts using the Adobe Windows rasterizer in 2 modes (black-and-white and grayscale), and TrueType fonts using the Microsoft Windows XP TrueType rasterizer in 3 modes (black-and-white, in 21 shades of gray and in Windows XP ClearType).  <br> <br>Using FontLab 4.6 on Mac OS X, you can preview the Type 1 and OpenType PS fonts using the Apple ATSUI rasterizer in 2 modes (black-and-white and grayscale), and TrueType fonts using the Apple Mac OS X rasterizer in 2 modes (black-and-white and in grayscale).  <br> <br>Using FontLab 4.6 on Mac OS 9 or in Classic mode (you can switch the start mode of FontLab in Get Info), you can preview the Type 1 and OpenType PS fonts using the Adobe ATM 4.6 rasterizer in 2 modes (black-and-white and grayscale), and TrueType fonts using the Apple Classic rasterizer in 2 modes (black-and-white and in grayscale).  <br> <br>Alternatively, you can also use VTT as Simon recommended to preview the TrueType fonts. <br> <br>You should also consider testing the fonts in at least two Adobe applications: InDesign CS on Windows and Photoshop 6 on Mac, for representative results. I believe you can get free trial versions of the Adobe applications from the Adobe website.  <br> <br>So altogether, you have 4 different environments to test, with a total of approx. 10 modes for each format.  <br> <br>If you choose 10 different digital versions of Univers and test it in 10 different rendering modes, you would have a very nice sample of 100 different screen renderings of Univers. I'm sure people on this forum would be interested to see such a comparison <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>Regards,  <br>Adam</p>"
