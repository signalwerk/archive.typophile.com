e and in grayscale).  <br> <br>Using FontLab 4.6 on Mac OS 9 or in Classic mode (you can switch the start mode of FontLab in Get Info), you can preview the Type 1 and OpenType PS fonts using the Adobe ATM 4.6 rasterizer in 2 modes (black-and-white and grayscale), and TrueType fonts using the Apple Classic rasterizer in 2 modes (black-and-white and in grayscale).  <br> <br>Alternatively, you can also use VTT as Simon recommended to preview the TrueType fonts. <br> <br>You should also consider testing the fonts in at least two Adobe applications: InDesign CS on Windows and Photoshop 6 on Mac, for representative results. I believe you can get free trial versions of the Adobe applications from the Adobe website.  <br> <br>So altogether, you have 4 different environments to test, with a total of approx. 10 modes for each format.  <br> <br>If you choose 10 different digital versions of Univers and test it in 10 different rendering modes, you would have a very nice sample of 100 different screen renderings of Univers. I'm sure people on this forum would be interested to see such a comparison <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">  <br> <br>Regards,  <br>Adam</p>"
