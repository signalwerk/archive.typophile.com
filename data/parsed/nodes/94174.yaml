      <p>I'm not sure what you mean by 'functionally' in this question, but in any case I don't think there is a sufficient comparison set of sans types intended for text, and those that do exist tend also to solve different problems. I mentioned Legato and Verdana, but I don't think they can be directly compared because of the different media for which they were intended, which in the case of Verdana strongly influenced the spacing. The most one can say, I think, by way of comparison is that Legato has more even rhythm of internal and inter-letter spacing than Verdana: a function of having narrower counters.</p>
