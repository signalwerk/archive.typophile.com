      <p>Bill, I mostly agree with what you've written, and obviously with regard to the relationship of spacing to rhythm and colour that involves proportion and internal space. Hence my comment that simply tracking out a typical sans won't magically make it more suited to continuous text.</p>
      <p><em>...the problem of spacing and color is never ideally solved for sans, if what you want is maximally readable extended text. That's one reason I think seriffed fonts are inherently superior for text. </em></p>
      <p>This is where I disagree with you somewhat. I would rather say that the strategies for solving the relationship of spacing and colour in sans serif for text setting are much more constrained and limited than in serif type, so while there will be thousands of serif text types of various constructions, stroke models and proportions, there will be a relatively small number of sans serif types that work well for continuous text because the strategies that make them work permit only a limited range of variation in construction, stroke model and proportions.</p>
