    html: <p>On the other hand, Nick, insights from the exploration of the physiological process of reading can suggest <em>typographic</em> experiments, i.e. not applying scientific theory to optimisation of reading, but applying new typographic hypotheses to design. And because design is not science in the modern methodological sense -- although, in the mediaeval sense, <em>inter scientias non minima est typographica</em> --, the experimental strictures are looser (hopefully tighter, though, than those of the 'experimental typography' of the mid-90s, which mostly lacked even hypotheses, let alone observation or conclusion).</p>
