      <p>Yo, Chris—</p>
      <p>Thanks for the lame attempt: no matter what, it's better than ANYTHING that I could have done.</p>
      <p>Anyhow, bad design sometimes SIMPLY DOES NOT WORK. Like, the other day, when I am doing the crossword puzzle, whose clues are in a condensed sans-serif type. Which is a little too small.</p>
      <p>I READ the clue as "Mail tenant," which makes no sense—even to me. However, later on, when I really need the right answer to finish up, it STILL makes no sense UNTIL I READ "Mall tenant"—which DOES make sense, and S-T-O-R-E makes PERFECT sense, and I finish up 1-2-3, and I am outta here.</p>
      <p>So, screw what the studies say: sometimes, poor design simply does not help. Or, a better choice of typefaces—like a nice serif which disambiguates a bit better—would solve this stupid, unnecessary annoyance.</p>
      <p>IMHO…</p>
