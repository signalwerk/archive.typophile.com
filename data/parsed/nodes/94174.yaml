      <p>If one wishes to promote analytical thinking, though, advocating the use of "ugly" typefaces won't get very far. People who produce printed materials, after all, are competing to get other people to <em>read</em> them in the first place, so they feel constrained to make them as attractive as possible.</p>
      <p>Hence, we need some way of making reading more difficult that is an inherent feature of all reading materials, one that a specific publisher cannot escape from.</p>
      <p>Unfortunately, as the essay at the beginning of <em>The Chinese Language: Fact and Fantasy</em> illustrates, there isn't really a practical way to write English using Chinese characters.</p>
