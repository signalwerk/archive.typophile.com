      <p>Ldavidson: "The science is rough"</p>
      <p>There are four things that nearly every reading study has in common: it does not involve actual reading, it tests a single script, the number and diversity of the subjects is challenged, and there  is no typographer involved in the composition of the test materials.</p>
      <p>How do you define rough? </p>
      <p>I think we're, well, most people here, are being kind. And quite a few give generously of their time away from their curves, lines and clients to study and discuss these studies and discussions.</p>
      <p>"...there are people here who could make a real difference in people's lives."</p>
      <p>Could you elaborate on this, please?</p>
      <p>Cheers.</p>
