      <p>@dberlow: "rough" in a couple of ways: in its infancy, with mistakes and gaps and the groping that usually occurs during that stage, and because the relationship is not being directly investigated, to be understood, refined, and used, at least in the few studies I've seen. Gray Courier on white is not where this will lead.</p>
      <p>"Make a real difference" because I think the effect they see is real, i.e. there is a significant relationship between a typeface (and its setting, and page composition) and comprehension and retention. And the relationship is not pretty&amp;smooth = better. Given that, people who love type could be:</p>
      <p>1) engaging the (few) science-ish people active in this area: providing feedback, exchange of knowledge (I know, there needs to be funding for serious work), in general furthering the science to get beyond the very primitive position of today - like addressing the 4 items you mention.</p>
      <p>2) once it's better understood how to support comprehension and retention by type design, embracing those concepts and applying them to at least some typeface designs and promoting their use when appropriate. </p>
      <p>I would not be surprised if testing showed a 10-20% improvement in learning, given a design based on a sophisticated understanding of how type influences the mind. There aren't many occupations in the world that can do that much direct good for large numbers of people.</p>
