      <p>If you're genuinely concerned that reading two different pieces of text is going to skew speed and accuracy results, that hypothesis can itself be tested by isolating just the difference in text. Do it a few times, and you'll easily establish a baseline of average reading speed and accuracy for different texts of similar lexical and stylistic complexity*, not only that, you'll have measures of the variance from that average and can weed out test subjects whose individual results vary too far from that of the majority of participants. Then you can start varying other factors such as type size, etc. and compare the results to the established average.</p>
      <p>*Bear in mind that word processing software has been able to automatically rate the complexity level of prose writing for at least twenty years, so its not like you even need to base the text selection of subjective judgement. And there's this thing called the Internet that is a vast repository of text, examples of which can be located and selected based on common level of lexical difficulty and stylistic complexity.</p>
