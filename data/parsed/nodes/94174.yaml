  html: '<p>The July 2012 issue of <em>Scientific American</em> (Advances: How Critical Thinkers Lose Their Faith in God) points out that a hard to read font "...promotes analytic thinking by forcing volunteers to slow down and deliberate more carefully...". People in the study discussed in the article expressed less belief in God compared to those who read material in a "clear" or easy to read font. Maybe we have been doing this all wrong.</p>'
