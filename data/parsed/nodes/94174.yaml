      <p>hhp: "Lee suggested a possible "10-20% improvement in learning", while I simply stick to speed, where I see comparable possibilities for improvement. I would so not mind helping millions of people read just a little bit faster (because that gives them time to do other things, including maybe read more stuff). Not all by myself, mind you, but by spreading ideas that others might adopt and implement."</p>
      <p>Out of personal curiosity, I (an amateur) did some reading on reading speed. My conclusion, from the studies I found, is that there is a wide range of values for most choices that make little difference, once within fairly wide threshold values. For example, once contrast above background reaches a minimum, then changes in level of contrast (or colors, for most people) don't matter much.  Line length, between about 40 and 100 characters doesn't matter much. Leading doesn't matter much. Serifs v. sans doesn't matter much. By "matter much" I mean two things: they are not close to being the most significant effects, and the effect they do have is quite small, a few percent or less. (Of course, optimizing several small effects can have a substantial impact in total.)</p>
      <p>The two factors that did consistently make a significant difference (&gt;10%) in reading speed were letter size and familiarity with the font. </p>
      <p>Text is commonly set too small for maximum reading speed, and an easy way to increase speed is to simply make the text larger, until you run into line length problems. </p>
      <p>A reader that is familiar with a font has adapted to read it at close to that reader's maximum speed, faster than that reader can read an unfamiliar font; even if the unfamiliar font has characteristics that we think are more condusive to fast reading. Once the reader is familiar with the new font, the two are read at about the same speed. Our brains' base reading functions seem to learn to accomodate a wide range of styles and shapes without significant impairment - with sufficient exposure.</p>
      <p>Accepting these results means that a reader should be able to choose the font(s) they prefer and have them be applied across a wide range of disparate reading material; and that text size defaults should be increased, and the reader should be able to further adjust the size. With those two things, general reading speed is close to maximum.</p>
      <p>What caught my attention was the ability of a typeface to significantly affect a reader's comprehension of a concept. I had not considered this possibility. I will accept an increase in reading fatigue if the cause of the fatigue is that I am better understanding the content because my mind is engaged more effectively.</p>
