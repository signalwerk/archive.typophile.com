      <p><cite>Humility is indeed an issue, which is why I always chime in against whatever the latest bizarre hubrisitic scientiﬁc pronouncement on typography happens to be. I’ll say one thing for the reading researchers though, they do push the envelope: Bad type = better analytical thinking is the most absurd yet.</cite></p>
      <p>They don’t. It is incorrect, I think, to attribute this absurd equation to either Daisy Grewal, the author of the summary in Scientific American, or even Will M. Gervais and Ara Norenzayan, the authors of the original study. I at any rate couldn’t find anything remotely similar to ›bad type = better thinking‹ in their texts and certainly nothing that translates to ›Start designing hard to read fonts‹. What they say is: In a controlled lab context, artificially slowing down readers during information processing makes them switch to a different (not: better) mode of thinking that yields different results. As far as I can see, Gervais &amp; Norenzayan weren’t interested in typography at all and not even trying to make any contribution to the debate about what a legible typeface should look like (or whether illegible typefaces would promote content comprehension). It is simply that their means of choice to slow down the subjects happened to be a type setting that was difficult to read. The stance you’re criticising is one that actually nobody, at least none of ‘the scientists’ in question, took.</p>
