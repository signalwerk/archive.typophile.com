      <p>Would those results hold outside a controlled environment, where a likely reaction is "annoying to read, didn't bother"?</p>
      <p>The fetish for hard data prompts researchers to ask dumb questions and jump to the first conclusion that presents itself, because everything else is hard to test for.<br>
      It gets really annoying when the supposed way forward is making things better by making them worse, in a way backed by such evidence.</p>
      <p>There are slightly less dumb questions about the effect of type on comprehension that could be asked. E.g.:<br>
      Will large and commanding capitals improve recollection of names and proper nouns in an unfamiliar subject?<br>
      Will they disturb the flow and hinder the understanding of underlying concepts?</p>
      <p>I ought to look through my old schoolbooks some day and check whether the ones set in bright colours and sanitised sans serifs truly sucked compared to the legacy ones, or whether the aesthetics automatically made me think "dumbed down and uninteresting".</p>
  - id: 513868
    user: 50554
    date: 2012-06-25T10:37:00
    date_raw: 25 Jun 2012 — 10:37am
    votes: null
    html: <p>Incidentally, it has also occurred to me that there is no need for people to start using wretched typefaces for science textbooks. After all, such tomes usually feature a large number of <em>equations</em>, and these will slow down the flow of reading enough that even the most beautiful, legible, and readable typeface will not result in the absence of opportunity to pause and think analytically along the way.</p>
