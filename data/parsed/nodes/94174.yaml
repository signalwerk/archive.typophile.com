      <p><em>It'll be interesting to see if @Hudson's idea of spacing sans-serif fonts in a way approaching serif fonts bears edible fruit.</em></p>
      <p>I don't think I would describe the idea in  quite those terms, because it might be misleading. The presence of serifs shapes interletter space in ways that play an active rôle in the perception of spacing. When spacing letters without serifs, a different approach is called for, but Walter Tracy's advice that sans spacing needs to be tighter is too much of a simplification, and I also think he was looking almost exclusively at sans serif type outside of continuous text. </p>
      <p>The sense in which your summary of the idea might be true is that my idea is that sans serif types can be designed for continuous reading if they are able to establish more even rhythm between interior and exterior space, which is indeed what we generally do when spacing serif type.</p>
      <p>Here's a useful exercise: do a search on MyFonts that turns up a lot of sans serif types, e.g. <a href="http://www.myfonts.com/search/sans/fonts/" rel="nofollow">'sans'</a> and view the search results with a good text string for looking at spacing, e.g. 'nihilim millioon'. Except in the case of condensed faces, you will see that in almost all cases the types are spaced such that there is considerable, and in some cases extreme, unevenness between interior and interletter white space. From this I conclude that pretty much none of these sans serif types has been designed for continuous text. For contrast, view the same test string in Verdana and in Legato, which for slightly different reasons have notably looser spacing than most sans serifs. These are sans serif types that were designed for continuous reading.</p>
