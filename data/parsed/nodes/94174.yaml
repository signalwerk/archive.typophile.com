      <p>ld:"If you do, then you are almost alone in your opinion." </p>
      <p>If we were talking about SAT tests I'm not really interested.</p>
      <p>ld: "Scientific method does not require you to kill the same rat twice."</p>
      <p>Don't be silly. Rats are bred in huge batches to be identical, so science can kill the same rat 1,000's of times. Readers are bred in tiny batches to be unique, so science can scratch its head. And type designers are bred in even tinier batches so science won't have any trouble publishing reams of bullshit about type.</p>
      <p>ld: "The two factors that did consistently make a significant difference (&gt;10%) in reading speed were letter size and familiarity with the font"</p>
      <p>Believe me, these two, for normal readers, are all that matters, and the second thing really translates into "familiarity of the font specifier with the audience".</p>
