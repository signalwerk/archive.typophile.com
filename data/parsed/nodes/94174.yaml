      <p>John (H), the way I used "science" in "The science that recommends experimenting with looser spacing is the same science that says serifs don't help" could have been misleading. I'm essentially referring to the origins of both "conclusions" (and origins are always there - results never come from a vacuum) in terms of denying the binding of letterforms. As I suggested to Kevin before, in the face of powerful, long-standing anecdotal evidence (I'm using the positive, layman terminology here) one must actively doubt one's own hypothesis, and basically try to disprove oneself. If you fail, then you have a powerful tool. And your recent counter-intuitive experience that you describe is exactly that sort of commendable mentality.</p>
      <p>Concerning serifs, I certainly agree that thinking of this in terms of sans-versus-serif is oversimple to the point of fallacy. I have long felt that serifs aren't merely appendages you slap on, they are in fact structural. In terms of this discussion serifs are sort of a proxy for the binding of letterforms into clusters, since they do promote that. But as you say there must be more to it than that, especially concerning the binding of the whites, as I agree Legato aptly demonstrates.</p>
      <p>The problem is the suggestion of loose spacing is coming from the same bad place as the suggestion to ignore serifs; so if loose spacing <em>does</em> help you, it's just dumb luck.</p>
      <blockquote><p>there are almost always multiple ways to test the same hypothesis.</p></blockquote>
      <blockquote><p>this doesn't mean that if we have only one way to test facts about the readability of type that it can teach us nothing.</p></blockquote>
      <p>Agreed. What I meant was, on the ground, there's no more sophisticated way of testing readability than the sort of thing Kevin does, but since that's so deficient it's more misleading than anything else to rely on it. So you're guaranteed to get "validation" of your hypothesis since it's all coming from the same place.</p>
      <p>hhp</p>
