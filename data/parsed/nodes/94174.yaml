      <p>I'd like to respond to many comments of interest to me, but will pick my spots.</p>
      <blockquote><p>William Berkson "...they didn't control for time on task I don't think the result is sound. If you get students to spend more time on the same material, in another way than making it difficult to read, I think you will probably get still better results."</p></blockquote>
      <p>You are right, the study is inadequate. More work to determine if the time/comprehension trade is a good one is needed. I also agree there are other ways, maybe superior in many or even most cases, to increase comprehension. (I am thinking of alternatives like graphics or other non-text media.) I still find the idea of manipulating the representation of the words themselves appealing, as an efficient in-line method that has potential elegance in its simplicity, working its magic at the reader's subconscious level.</p>
      <blockquote><p>hrant " I for one certainly don't buy the view that simply reading more of a font makes it optimally readable." &amp; "But ah, how long does that take?..." &amp; "no can do"</p></blockquote>
      <p>Nobody suggested it did, at least in this thread. But it seems the reading mind is quite accomodating - there will be costs; but within the mentioned bounds, not a substantial cost in speed, which was my comment on your comment on speed (not readability, a broader term)...When I used the term "familiar", I meant it as you seemed to understand it: personally familiar, not John Hudson's meaning of familiarity - although that may also exist. For what I was describing, my understanding is that a good dose of recent exposure (say a few novels' worth in a month) produces, from scratch (0 exposure), an increase in reading speed...As far as "no can do", I'd prefer you felt otherwise, but on reflection it probably doesn't matter much. Increasingly, in OSes, browsers, e-readers, iDevices, and Android, the reader can already choose for themselves - whether or not the typographer would wish it so. And, increasingly, those are what people use to read.</p>
