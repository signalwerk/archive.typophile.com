      <p>How very true. I once bought a six-pack of Samiclaus Brown—because that's the only purchase option offered—because it is one <strong>very stout</strong> brew. How strong? 24% ABV strong—about as strong as beer gets.</p>
      <p>Unfortunately, I really couldn’t swallow more than a sip at a time, which kind of takes the enjoyment out of the process, so I ended up making half-and-halfs with a pleasant smooth ale. Well, half-and-half was better, but not ideal, so I found an acceptable balance at three-to-one. The net result was more mixer than the star of the show, and a net ABV of 7-8% or so…which I could achieved with Moretti Birra La Rossa, which tastes mighty nice right out of the bottle—if you happen to like seriously malty brews with a great finish and a bit of a kick, which I do—and costs about a third as much.</p>
      <p>So, you live and learn. I just wish that it hadn't cost me twenty-five bucks for "the good stuff" plus the cost of the mixer—another twenty-five bucks or so—to learn that, yes, you actually can get too much of a good thing. As I recall, this guy named Aristotle figured that out a long time ago. Hey, Lozos: what's up with you Greek guys, anyhow? How come you always seem to have the right answers? Except when it comes to paying taxes…</p>
