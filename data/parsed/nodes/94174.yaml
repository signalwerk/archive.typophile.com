    html: <p>Incidentally, it has also occurred to me that there is no need for people to start using wretched typefaces for science textbooks. After all, such tomes usually feature a large number of <em>equations</em>, and these will slow down the flow of reading enough that even the most beautiful, legible, and readable typeface will not result in the absence of opportunity to pause and think analytically along the way.</p>
