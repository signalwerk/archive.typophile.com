      <p>ldavidson:  "in its infancy, with mistakes and gaps and the groping that usually occurs during that stage, and..."</p>
      <p>Oh, I thought it's been going on for 125 years or so. </p>
      <p>..."because the relationship is not being directly investigated, to be understood, refined, and used, at least in the few studies I've seen."</p>
      <p>As I pointed out in a long-ago thread, directly investigation via strict scientific method <em>is</em> impossible. To summarize — if only one variable can change per read of the the same text by the same subject, then either the font can't change, or the reader must read the same thing twice. <em>And then,</em> comes the testing of comprehension and retention. No one has a study, or will. That's why it's <em>the</em> all-time typophile subject. </p>
      <p>"And the relationship is not pretty&amp;smooth = better."</p>
      <p>What's pretty? where's smooth? who said it was = to better? and what's one study against 400 years of organic humano-typographic evolution?</p>
      <p>"There aren't many occupations in the world that can do that much direct good for large numbers of people."</p>
      <p>Oh I agree but I'd "ain't" instead of aren't. By-and-large, these issues started popping up in the realm of normal-people-reading screen fonts, screen legibility, screen readability and screen resolution —&nbsp;upon windows. What's been done there is a tragedy, as one former MS employee has clearly stated, and the type design community has spent millions of dollars helping windows users to, not comprehension and retention, but less gag reflex if they must read, and hopefully less printing of email.  </p>
      <p>In general, outside of the windows or any other resolution/politics-based tragedy, I'm pretty sure comprehension and retention is 00.01% a type design issue and 99.99% an issue of type selection and type composition. And I think those latter two activities just need smarter fonts and smarter apps, and not smarter studies, and certainly not smarter users.</p>
