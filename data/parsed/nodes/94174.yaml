      <p>Hrant: <em>The science that recommends experimenting with looser spacing is the same science that says serifs don't help</em></p>
      <p>Really? Can you point me to the study? I got the idea from a conversation with Kevin, and it is the idea that interests me, rather than the particulars of the methodology.</p>
      <p>There's a longstanding anecdotal belief that sans serif type is less readable / less suited to continuous text than serif type. But I've thought for some time now that this is a problematic assertion because almost all sans serif types were not designed for text, and hence it shouldn't surprise us that they perform less well. But people seem quick to presume that the reason has something to do with the presence or absence of serifs, and I reckon that's not the case or, at least, far from the whole story. And one of the reasons I think this is because Legato is so darn readable in continuous text. So I know that there's at least one way to make a sans serif that is highly readable in a text setting, and I think there may be others. Over the years, I've worked on a number of sans serif projects, but they've all involved either starting from an existing Latin sans, a particular historical model, or have had to operate within a set of technical constraints. And they've all been initiated by clients with a specific brief. So recently, as a weekend project, I started designing a sans serif from scratch, in which to explore my own ideas about sans for text, and one of the first things I've done is to make the spacing somewhat looser than a) most sans serif types and b) looser than I was initially comfortable with, i.e. I went against the instincts that years of looking at sans serif type have left me with. So this is an instance in which an idea from reading science -- and for this purpose it hardly matters whether it is good or bad science -- served as a kind of mental liberation. The really interesting thing for me was that it took about two days of working on the design for my mind to adjust, and now I find the spacing very comfortable to work with.</p>
      <p><em>The only way you can gauge the success of your loose spacing is by using the same testing methods that supposedly confirm the merit of the idea.</em></p>
      <p>That's not even logical: there are almost always multiple ways to test the same hypothesis. But I'll gauge the success of my spacing the same way I would gauge the spacing of any other typeface: does it set well and is it easy to read at the intended size range. All I've taken from the science is an idea: I'm not committed to a programme and I'm certainly not setting out to reproduce some particular experimental result.</p>
      <p>So far, so good. I reckon my new sans is very readable, and <em>one</em> of the reasons for this is that it is what I now think of as 'spaced for text', which is a concept I think most of us understand very well when it comes to serif type, but about which I doubt we'll find much agreement when it comes to sans serif. It isn't by the way, simpler 'looser', i.e. you can't achieve the same thing by tracking out a typical sans.</p>
