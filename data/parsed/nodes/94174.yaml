      <p>I'll give this one more try, since there are people here who could make a real difference in people's lives.</p>
      <p>Science is, apparently, breaking new ground in investigating how the type in which text is set can influence not only legibility and readability, but also finding that characteristics of the typeface can have a substantial impact, a significant difference, on the ability of the reader to "get" the content - to understand the meaning, to comprehend the ideas being conveyed – and to remember it.</p>
      <p>The science is rough. So far, all that is clear is that significant improvement is possible. The body of knowledge will be refined over time to more specific statements about what characteristics a typeface should have.</p>
      <p>This is an opportunity for type designers to "move up the value chain", to use business language: from legibility, readability, and appearance; to include comprehension, understanding, and retention.  It is an opportunity that some type designers will not miss. Yet I get the impression here is that people are not interested – to the point of ridiculing the concept. </p>
      <p>The question for a designer is, do I commit to create typefaces that promote the ability to learn? Or do I ignore the opportunity (some might say "and responsibility") and do as I please?</p>
