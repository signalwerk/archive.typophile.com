      <p>John, I think that tightness of spacing affects readability, but it can't be evaluated apart from rhythm and color. Tracy writes that best spacing is a function of the width of the counters. I think that's correct, which is my problem with Helvetica. Its circular forms have a lot of counter space within the 'o' for example, but the space between letters is much less. I think that the space between and within letters needs to be visually equal in area for good color and rhythm. </p>
      <p>A face that is overly tight by these standards is not a problem for display, but I think it is less readable in extended text. </p>
      <p>Serifs among other things help you get even color with adequately roomy spacing. When you chop the serifs off a seriffed font and leave the spacing as is, the color is hurt, and the words seem to fall apart. Hence, as Tracy says, the sans letter spacing needs to be tightened, stem to stem. That becomes a problem with faces based on the circle, but less so for those based on the oval, because you have harmony between counter and spacing, and more even color. That's why 'humanist' sans like Frutiger work better in text than Helvetica. One of the sans I find most readable in text, Vesta, is also narrower and also 'cheats' by having more stress variation, and less of a monoline appearance.</p>
      <p>IMHO, the problem of spacing and color is never ideally solved for sans, if what you want is maximally readable extended text. That's one reason I think seriffed fonts are inherently superior for text. </p>
      <p>In sub-par conditions such as low resolution screens, all this seems to matter less, but then text is less readable (more fatiguing) on low res screens anyway.</p>
