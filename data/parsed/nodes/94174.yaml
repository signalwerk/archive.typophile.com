      <p><cite>This is becoming a bit of a meme amongst the scientiﬁc set.</cite></p>
      <p>More like among hack science journalists. </p>
      <p>Anyway, the real problem here is that nobody has noticed that readers do better with engaging content than bland content. Typography doesn’t have to be bad to be engaging. And I suspect that good writing would solve the problem even more handily—as the success of J. K. Rowling and George R. R. Martin at getting young people to read long books shows us.</p>
