      <p>Hrant: <em>I for one certainly don't buy the view that simply reading more of a font makes it optimally readable.</em></p>
      <p>No, but that's not the real implication of familiarity. The real implication is that for two typefaces, one of which might perform better than the other given equal familiarity, i.e. be more readable because of some features of the design, it is strongly possible that the other typeface will perform better if it is more familiar to the reader. In other words, familiarity is what might be called a strong cultural bias in readerability. This certainly explains why alphabet reform tends to go nowhere, even when focused on trying to improve readability: who wants to have to learn to read again?* Hence text type design operates in a narrow conventional field, in which even novel designs seek to leverage the familiarity bias in various ways.<br>
      _____</p>
      <p>* There will always be a small number of enthusiasts, of course. These are the people who taught themselves Shavian script, and perhaps have decided opinions on Esperanto versus Ido. The vast majority of people just don't care: they read, they read reasonably quickly and accurately, and they are not interested in learning new systems.</p>
