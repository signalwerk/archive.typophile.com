      <p>Nick Shinn's hypothesis <em>"Any cognitive disﬂuency is caused not by hard-to-read fonts, but by settings which are recognized by the readers as inappropriate to the document"</em> may or may not be correct. It is irrelevant to my original point, as is the entire theory of cognitive disfluency. The rule "Use an inappropriate font" is just as useful as "Use a difficult-to-read font". </p>
      <p><strong>For whatever reason, the typeface used made a substantial difference in the ability of the reader to comprehend the information.</strong> The rest of the paper, as far as I'm concerned, is irrelevant.</p>
      <p>This is not religion; it may not be science. It is straightforward to find what makes a difference and what doesn't. For example, in outline: </p>
      <p>Get the help of one skilled in the art of experiment design. Get access to a large number of SAT reading comprehension test passages, with the accompanying questions and answers. Mark up the passages with html like &lt; idea&gt; and &lt; easy&gt;. Get a large number of test participants. The typeface and typesetting parameters are the varying parameters. If the comprehension scores and time used are invariant across a range of values for a parameter (size, case, leading, slant, contrast with background, serifs, descenders, lower case height, Nick's "inappropriateness", ...whatever) then those are not of interest.  For whatever reason, however poorly understood, there is clear evidence that that won't be the case for all of the values for all of the parameters. </p>
      <p>This particular test is as useful for its purpose as the SAT reading comprehension test. Other tests of reading comprehension could be similarly adapted.</p>
      <p> Understanding "why" may take a lot longer.</p>
