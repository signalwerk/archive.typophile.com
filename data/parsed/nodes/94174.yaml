      <p>There has never been a scientific study that indicated that "type design isn't there yet".  Studies compare existing faces by "attempting [badly] " to isolate variables. Since science has never had a typeface that is the "dog-gonned best possible ever" to use as a benchmark for all the others, there is no way to know that the types we have available now are not good enough to read well.  I think the best tests to do would be those that compared READERS to each-other instead of typefaces. Why do some people read so much better than others?  If we could isolate the perception and comprehension variables that make people read better, then we might have a clue as to how type must be designed better for reading [if need be]. In medical science, we compare well rats with sick rats to see what makes them resist a sickness.  Then, the knowledge gained is used to develop cures or vaccines.  We don't compare collections of mixed diseases to see which is the least harmful to a given organism.<br>
      Other than dyslexia and other physical/neurological conditions, we really have done little to differentiate between perception/interpretation conditions that may exist in what we might call normal spectrum reading sample populations.</p>
