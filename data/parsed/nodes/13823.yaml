    <p>Hello everyone,</p>
    <p>I am looking for image editing software for OS X that can render fonts with sub-pixel hinting.  I am creating GUI Mockup's and I need the fonts to look as close to the final outcome as I can.  Unfortunately none of Photoshop's anti-alias modes create clear type at size 10-12.  </p>
    <p>Thanks in advance.</p>
