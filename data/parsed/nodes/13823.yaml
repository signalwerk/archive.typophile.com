      <p>Hmm. I am not sure how Photoshop does it now, with the integrated type engine that is common to all new Adobe apps (or is at least supposed to be), but from what I understand PS never properly rendered type in true AA mode but actually blended fore and background colour. So, you would not get sub pixel addressing.</p>
      <p>When sizes 10-12 are referred to, are you speaking of point size or pixel per em (ppm) size? This is important as point size 10-12 on a Win machine running at 96dip would translate to approx 13-16ppm. More pixels!<br>
      Hrant, Clear Type was exactly created for these sizes. A well engineered font will look really nice on the appropriate screen with CT rendering. Of course CT rendering only applies to TrueType outlines, whilst CFF outlines are rendered by Adobe's ATM engine (now built into the OS) or the app inherent type engine. Adobe's equivalent technology to CT is CoolType, or was at least. I am not sure if it is still supported.<br>
      Now, if you have a well hinted TTF it should behave reasonably within ClearType. However, it may be that the odd Delta causes havoc and depending on how diagonal controls are set, they may stray too. This can be amended with appropriate additional code within VTT, if the font has been hinted using VTT in the first place. As we (at Dalton Maag) do not use FontLab to hint our TTF, I cannot really comment on the controls available for ClearType.</p>
      <p>True anti-aliasing can only be achieved by an outline and how much of the outline is passing through the pixel. Depending on the rendering engines available, this can vary from app to app, os to os, and depending on the Gamma settings of your hardware, even from screen to screen or model of laptop etc. That's the problem with rendering on the screen today. You cannot control it totally. What you can do is design and engineer your outlines to perfection, then hint to perfection for all modes: black/white, grey, ClearType. Then you have the best chance of getting decent type on the screen.</p>
      <p>Everything else is a waste of time.</p>
      <p>Bruno Maag<br>
      Dalton Maag Ltd</p>
