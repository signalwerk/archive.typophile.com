      <p>The "filtering" of the anti-aliasing into the three component colors is not public knowledge, so I don't think you'll be able to simulate it. You might be able to reverse-engineer it (to some extent) but I suspect it won't be worth the trouble. What about splicing &amp; dicing screen grabs?</p>
      <p>&gt; none of Photoshop’s anti-alias modes create clear type at size 10-12.</p>
      <p>Nothing creates clear type at those sizes, not even... MS's ClearType! Well, nothing except hand-made grayscale pixelfonts, of the sort available at ultrafonts.com...</p>
      <p>hhp</p>
