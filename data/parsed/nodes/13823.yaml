      <p>&gt; A well engineered font will look really nice<br>
      &gt; on the appropriate screen with CT rendering.</p>
      <p>I agree it's very nice - much better than what we've had before - I'm actually a big fan of it.</p>
      <p>It does have two problems though:<br>
      1) The color fringing. Some people can't stand it (even on hi-res displays).<br>
      2) A character has variable rendering -variable glyphs- depending on where it falls on the subpixels. This is basically a result of the legacy reliance on an outline "master". As long as one file tries to serve both print and screen, the stuff is going to hit the fan, somewhere. (In effect, the root problem here is WYSIWYG-worship.)</p>
      <p>So, handmade grayscale bitmap fonts are even better than CT (except in Italics, where the two techniques come out about even overall).</p>
      <p>What's interesting about the CT fonts is that they are <strong>lightly</strong> hinted. I've yet to figure out exactly why. It can't be a filesize issue (any more). One could say that with their good subpixel algorithm, they don't need hinting as badly as they used to. On the other hand, it can only help (some more). So this boils it down to two possibilities I think: it's too expensive to do the whole thing; they're leaving room for even more improvement. This latter is pretty routine in contemporary software development, and in fact has happened with CT itself, in the form of: subpixel spacing; and supporting y-direction hinting. (Although there is admittedly a performance dimension to why these weren't implemented earlier).</p>
      <p>&gt; You cannot control it totally.</p>
      <p>Very true. But I've found that the parameters are narrow enough that you can get away with it, in my case via partial-pixel outlines. It's a tightrope act, and ideally you need an alternate cut of a font (for setting light-on-dark text) but that can be -in fact has been- automated. But it's worth it.</p>
      <p>&gt; Everything else is a waste of time.</p>
      <p>Come on, don't be so Swiss, Bruno.  ;-)<br>
      There's some viable ground between making a really dodgy screen font and a Perfect one. In fact the CT fonts (which are a big improvement on what we've had before) represent such a compromise I think.</p>
      <p>&gt; I pick the ppm, make a grid and adjust the font, (everything!) to the grid.</p>
      <p>Which I think is what Apple is doing with their iPod Photo adaptation of Myriad.</p>
      <p>hhp</p>
