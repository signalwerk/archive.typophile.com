      <p>Not sure if this will work on the Mac, but the trick I passed on to the Windows designers was to use HTML. </p>
      <p>Create a 'blank' canvas in Photoshop, the UI minus any text, and then place this as a background image on a Web page. Use your favorite HTML editor, or edit by hand, to position the desired text over the background image. When everything looks good take a screengrab of the page from IE.</p>
      <p>This way you're using the native rasterizer, gamma and ClearType settings, which in most cases is what the OS is using in the UI.</p>
      <p>Cheers, Si</p>
