      <p>I'm not sure if answer is looking for clear type or ClearType...but when I want something to work best in photoshop, I pick the ppm, make a grid and adjust the font, (everything!) to the grid. Then the user just has to make sure to use that size type, view itat 120% (the closest to "actual size"), and either dither yourself, or leave it alone. It's kind of like hints, 1986.</p>
      <p>"Everything else is a waste of time." Even listening to you? ;)</p>
