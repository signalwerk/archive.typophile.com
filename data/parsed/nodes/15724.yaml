      <p>Oh thanks.</p>
      <p>But it will turn out useful manuals really are. I doubt anyone will save fonts and manual together. </p>
      <p>My first idea was to use ssXX features consistently throughout my typefaces, so, ss01 for certain substitutions, ss02 for certain others &amp;c. But with the second and now third type it turns out the idea is unrealistic.<br>
