    html: |-
      <p>What I intend to do is this:</p>
      <p>There are four alternate characters in Proxima Nova: A more geometric (Futura-like) G, a one-story a (and corresponding two-story a in the italic), an l with a tail, and a curved y (similar to a one-story g). Note: The normal roman a is two-story; the normal italic a is one-story.</p>
      <p>There will be seven stylistic sets:</p>
      <p>Set 1: Alternate a, l, and y in the roman; Alternate l, and y in the italic. This is the "primer" or "schoolbook" set, intended for early reader books.</p>
      <p>Set 2: Alternate G and a in the roman; Alternate G in the italic. This is the "Futura-like" set.</p>
      <p>Set 3: Alternate G.</p>
      <p>Set 4: Alternate (one-story) a (roman only).</p>
      <p>Set 5: Alternate (two-story) a (italic only).</p>
      <p>Set 6: Alternate l.</p>
      <p>Set 7: Alternate y.</p>
      <p>The first two are Stylistic Sets in the way (I think) the feature is intended to be used. The rest are effectively <em>à la carte</em> alternate character styles which can be mixed and matched to taste. You could actually recreate the first to sets using the others like this:</p>
      <p>Equivalent to Set 1: Apply Set 4, Set 6, and Set 7.</p>
      <p>Equivalent to Set 2: Apply Set 3 and Set 4.</p>
      <p>And so on.</p>
      <p>(By the way, the current version of Proxima Nova has two Stylistic Sets, basically the same as the first two of the proposed sets, except that the alternate (two-story) a is included in the italic. This was ill-conceived, I realize on hindsight.)</p>
