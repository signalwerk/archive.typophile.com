    html: |-
      <p>Eben,<br>
      If you can define your context as a particular glyph following a particular glyph or glyphs, it should work fine.  The substitution won't be due to a degree of kerning but the pairing of stated glyphs in sequence.<br>
      In my case, I am subing r when it precedes i or j.  Here is my script:</p>
      <p>feature calt { # contextual alternate<br>
      	sub r' [i j] by r.alt;<br>
      } calt;</p>
      <p>ChrisL</p>
    html_clean: |-
