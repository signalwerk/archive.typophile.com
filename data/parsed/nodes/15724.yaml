      <p>Eben, I use FontLab for my own substitutions. VOLT is more powerful and definitely worth learning if you have access to a Windows machine. (Which you also want anyway because FontLab Studio 5 is Windows-only so far, and because soon you'll want to test OpenType font behavior in Avalon applications.) I have not learned VOLT yet because I don't do complex script type design. (Yet.) Er, and because I'm sorta lazy.</p>
      <p>OpenType is supposed to have contextual kerning at some point in the future. At present, only <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;cat_id=RenderingGraphite">Graphite</a> can do that. So far Graphite is only used in a <a href="http://sila.mozdev.org/screenshots.html">limited range of applications.</a></p>
