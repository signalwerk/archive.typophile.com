    html: |-
      <p>The definition of "contextual" (as in 'clig' and 'calt') is that some glyphs, other than those being substituted, provide the context. There's no reason to use 'clig' when it's not contextual; you might as well use 'liga', 'dlig' or 'hlig' as appropriate.</p>
      <p>You can of course use what's supported by current applications as a guiding factor as well. But beware that using inappropriate features will just confuse things later when future applications do implement the more "correct" features. Remember, fonts last almost forever.</p>
      <p>Cheers,</p>
      <p>T</p>
