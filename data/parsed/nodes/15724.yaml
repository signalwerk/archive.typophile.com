    html: |-
      <p><em>Is there a way to globally use alternates?</em></p>
      <p>In InDesign, you can apply a stylistic set. There can be up to 20 of them.</p>
      <p>Personally, I think the mechanism for choosing alternate characters in OT fonts is flawed and limited. </p>
      <p>Let's say you always want to use a certain alternate "e" in a certain font. </p>
      <p>You could insert it manually every time an "e" appears, but that would be extremely tedious. </p>
      <p>Or, you see that the alternate "e" is part of Stylistic Set 2, so you select all the text and apply that. But then you notice that Stylistic Set 2 also contains a bunch of other alternates that you don't want. The only recourse is to apply the Stylistic set just wherever an "e" appears, but that's almost as tedious as the first method. (You get a similar problem when you put the alternates in a separate font.)</p>
      <p>It seems like you ought to be able to look at a list of alternates for a particular character and set a preference for which one to use in a particular text selection or style sheet. This would be a sort of user-defined "stylistic set." </p>
      <p>(Yet something else for Adobe's feature request page. Not that Adobe should be the only one listening.)</p>
    html_clean: |-
