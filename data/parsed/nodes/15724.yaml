    html: |-
      <p>Wow. Thats cool. Very cool.</p>
      <p>Actually making the *preceding* character change seems X-TRA cool! </p>
      <p>Do you know if there are web pages which offer example code so I can start to deduce what is going on in the code? And maybe make off with some that is relevant too? For some reson I get MEGO when I read directions meant for programmers. But I can code CSS &amp; HTML just fine because I can look at the code &amp; look at what it makes &amp; make the intuitive leap. This probably means I won't be coding javascript but maybe I can manage some Opentype code with time. It doesn't look too hairy.</p>
      <p>I did find this example from Adam Twardoch @ fontlab's MSN help site:</p>
      <p>feature calt {<br>
      sub n o' by o.calt1;<br>
      sub b o' by o.calt2;<br>
      } calt; </p>
      <p>It is for 'The first substitutions means: if the "o" glyph is preceded by "n", substitute the "o" with the "o.calt1" glyph. The second means: if the "o" glyph is preceded by "b", substitute the "o" with "o.calt2" '.</p>
      <p>So... I think I could maybe say:</p>
      <p>feature calt {<br>
      sub V a' by a.calt1;<br>
      } calt; </p>
      <p>And as long as I have a glyph named 'a.calt1' then it should work. </p>
      <p>Does anybody know what apps support what open type 'calls' now (eg. 'calt') - or is there a master list somewhere? I imagine that 'calt' is a basic call supported by all apps that support open type - but is this right?</p>
