    html: |-
      <p>I've been reading through this interesting thread and have a question...</p>
      <p>The book publisher I work for had this custom font developed years ago. It's a cursive font designed to teach children cursive writing. It's quite an amazing piece of work, each character has the ability to connect with the next character at either a high, middle, or low connector.</p>
      <p>Originally the type 1 font was a 3-piece font: screen, printer, and some sort of executable that had to be downloaded to the postscript printer to control the contextual connections. This method caused 2 problems: 1) the font would sometimes get kicked out of the PostScript RIP if another font was downloaded, 2) You could not save to postscript for making PDFs.</p>
      <p>Later this was all combined in to one font with built-in contextual intelligence. so that on postscript output from Quark Xpress (in OS 9) had all the processed contextual characters in place and PDFs could be made properly.</p>
      <p>Well, we haven't used the font in awhile, have upgraded to OS X and InDesign and it occurred to a couple of us the other day that perhaps this special font will no longer work.</p>
      <p>After a few tests we found that not only does it not work in OS X, but it only worked with QuarkXpress 4.11 in OS 9... Even a dusty copy of InDesign 2.02 in OS 9 would not work properly with the font.</p>
      <p>Given all this back history, anyone have a clue as to how this font was made? We outsourced the original design of the font, so no one here knows how it was done.</p>
      <p>At any rate, we have Font Lab on order and hopefully soon enough I'll be re-constructing the font in OpenType, and perhaps asking for hints along the way on this here messageboard...</p>
      <p>Cheers,<br>
      /ed</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cursive.jpg"></div><p></p>
