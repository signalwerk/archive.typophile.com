      <p>Mac users for many years could use space characters in their file names.  When they started naming web pages and directories, the space habit was still there,  Web servers replaced spaces with %20 because spaces are a no-no in URLs. Mac users have since learned not to use spaces in their URLs and that is why you don't see it anymore.  It had nothing to do with OS-X. Iknew about %20 for years but didn'y know about %27 'til Mark's post tonight.<br>
      I was joking with Thomas by the way.</p>
