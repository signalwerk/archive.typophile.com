    user: 7006
    date: null
    date_raw: null
    votes: null
    html: |-
      <p>this may be able to be condensed somehow, but this works for letters that connect low and high (no middle connections).</p>
      <p>OT Code:</p>
      <p><code>feature calt {<br>
      lookup calt1 {<br>
        sub @lc_highexit @lc_all' by @lc_highentry;<br>
      } calt1;<br>
      lookup calt2 {<br>
        sub @bovw_default' by @bovw_natural;<br>
      } calt2;<br>
      } calt;</code></p>
      <p>Classes:</p>
      <p><code>@lc_highexit: b o v w b.high o.high v.high w.high<br>
      @lc_all: a b c d e f g h i j k l m n o p q r s t u v w x y z<br>
      @lc_highentry: a.high b.high c.high d.high e.high f.high g.high h.high i.high j.high k.high l.high m.high n.high o.high p.high q.high r.high s.high t.high u.high v.high w.high x.high y.high z.high<br>
      @bovw_default: b o v w<br>
      @bovw_natural: b.calt o.calt v.calt w.calt</code></p>
      <p>just to explain a bit, if it doesn't all make sense on it's own: x.high is a lc character which has a high entry stroke, b.calt has a low entry stroke and a high exit stroke, b.high has high entry and exit strokes. This is an abbreviated chunk of code, leaving out diacritic forms (or else the class info would be much longer, but the OT coding would be the same). Critiques to this method are welcome.</p>
