    html: |-
      <p>Type 1 fonts come with two files (at least): a PFB file that contains just the outlines, and a PFM file that contains metrics and kerning. It seems one of the two is deleted/moved/managed and the other stays put. I can imagine your system getting upset about that.</p>
      <p>Installing/removing fonts under XP (my system) copies and deletes both files at the same time.</p>
      <p>If you intend to use the fonts exclusively for CS4, you can locate the CS4 Fonts folder — somewhere inside the CS4 shared stuff — and put the Type 1’s there. They won’t be manageable, though.</p>
