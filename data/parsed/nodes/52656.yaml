      <p>A little searching brought this up from an Adobe Technote:</p>
      <p>Type 1 fonts don’t list in Creative Suite 2 and 3 applications (Windows XP Professional x64 and Vista x64)<br>
      Issue</p>
      <p>Type 1 fonts installed in the Fonts control panel on Windows XP Professional x64 or Windows Vista x64 do not list in the font menus of Adobe Creative Suite 2 applications.</p>
      <p>Fonts display as expected in other Windows applications (for example,Character Map, Wordpad).<br>
      Solution</p>
      <p>Move copies of the Type 1 fonts to the Common Files\Adobe\Fonts folder.</p>
      <p>   1. In the Fonts control panel, select the Type 1 fonts that you want to move.<br>
         2. Select Edit &gt; Copy.<br>
         3. Open the Program Files (x86)\Common Files\Adobe\Fonts folder.<br>
         4. Select Edit &gt; Paste to copy the font files into the Adobe\Fonts folder. </p>
      <p>Additional Information</p>
      <p>Type 1 fonts installed in the Fonts control panel on Windows XP Professional and Vista x64 do not list in the font menus of Adobe Creative Suite 2 and Creative Suite 3 applications. Creative Suite applications can access Type 1 fonts installed in the Adobe\Fonts folder.</p>
      <p>OpenType fonts from Adobe, both TrueType- and OpenType-flavored (.TTF and .OTF) display and work as expected in Creative Suite 2 and Creative Suite 3 applications when installed in the Windows Fonts control panel.</p>
