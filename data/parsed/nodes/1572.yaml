    html: <p><i>And Derrida and Foucault aren't the same thing. At all.</i> <br> <br>I didn't say they were, I was pointing out that both have had a major influence on North American Academia (as has Lacan, Baudrillard, Barthes and others). It wasn't necessary for Foucault and Derrida to have the same philosophy for both to feed the 'hermeneutics of suspicion' that dominates academic discourse in the humanities in North America. In fact, one could argue that the paranoid departmental and sexual politics of most universities here is the perfect synthesis of Foucault's obsession with power and Derrida's deconstruction of truth.</p>
