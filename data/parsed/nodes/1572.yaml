    html: <p>When I say '<i>a lot of what</i> is called "social science"' I mainly mean parts of sociology and psychology. Geography et al I have no problem with. Sorry for the confusion there. I am talking about a small subsection of that body of knowledge that seems to expend a disproportionate amount of the available funding. I don't know how familiar you are with American academia over the past ten years, particularly in the humanities and social sciences, but in my view (and for many others) lots of scholarship in these otherwise worthwhile subjects has been wasted on things like identity politics. I ran into this issue in pursuing my own degree (in German) and ended up having to make a rather painful decision not to go to grad school.  <br> <br>Nothing personal, but I get really tired really quickly explaining the problem, because it's been covered so well elsewhere already, so please just consult the Sokal book I cited if you want to explore this more. Or read any copy of <i>The New Criterion</i>.</p>
