    html: "<p>There is a sense in which <i>all</i> serious type design is experimental: it proceeds from an idea, through a process of testing and refinement, and generally reaches a significant resolution if not conclusion. But something tells me that when Brandon asks for examples of 'experimental typography' he is thinking of stuff that <i>looks</i> experimental, i.e. novel and unorthodox. One way to clarify this would be to ask what is counter to experimental typography: presumably that which is based on known results, i.e. prior experiment or discovery. Above, I mentioned the types and typography of the Didots and Bodoni as examples of experimental typography, and if we no longer think of a block of text on a relatively narrow width, with generous leading, set in a Didot or Bodoni type as 'experimental' it is because we have analysed and understood the results of that experiment.</p>"
    html_clean: "<p>There is a sense in which <i>all</i> serious type design is experimental: it proceeds from an idea, through a process of testing and refinement, and generally reaches a significant resolution if not conclusion. But something tells me that when Brandon asks for examples of 'experimental typography' he is thinking of stuff that <i>looks</i> experimental, i.e. novel and unorthodox. One way to clarify this would be to ask what is counter to experimental typography: presumably that which is based on known results, i.e. prior experiment or discovery. Above, I mentioned the types and typography of the Didots and Bodoni as examples of experimental typography, and if we no longer think of a block of text on a relatively narrow width, with generous leading, set in a Didot or Bodoni type as 'experimental' it is because we have analysed and understood the results of that experiment.</p>"
