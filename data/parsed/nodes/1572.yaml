    html: <p>Mr. Hudson wrote <br> <br><i>The same sort of thing happens when the jargon of critical theory -- itself an appropriation of scientific and pseudo-scientific terminology by way of social sciences --</i> <br> <br>which is what I was referring to. And I wasn't paraphrasing what he said, merely taking it and running further. I think a lot of what is called "social science" today is the result of an almost scientific process built upon entirely unscientific grounds and therefore nonetheless ultimately worthless. I don't expect Mr. Hudson to agree with it entirely... who knows... he might. But I'm sorry if you infer that I expect him to. <br> <br>Really, Sokal does a much better job of taking it apart. The main argument in this thread seems to be the abuse of the term "experimental." <br> <br>In terms of type, I'm definitely not a purist. I don't like anything that anyone called "grunge" but I have a weakness for silly decorative stuff. "Over the top," you might call it. I still love a great text face, but I like florid baroque stuff as well, especially blackletter. There are a number of interesting "experimental" blackletters, probably the most famous of which was Unger Fraktur.</p>
