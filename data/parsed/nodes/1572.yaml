    html: "<p>If experiment were used simply in the sense of 'trial-and-error' in regard to type design and typography, I wouldn't mind so much. But the term seems to have been fairly frequently used to elevate what was, in fact, stylistic play by suggesting a scientific rigour that it didn't possess. Lewis Blackwell's books about David Carson are prime examples. The same sort of thing happens when the jargon of critical theory -- itself an appropriation of scientific and pseudo-scientific terminology by way of social sciences -- is applied to graphic design: its main purpose seems to be to make designers feel important. <br> <br>We should never underestimate the vacuity of much of the design industry, and should be wary when it starts using impressive sounding words. Erik Spiekermann made this point at ATypI this year, relating how, having established a reputation as an information architect (another appropriated term), he began to receive requests for him to give things 'that information design look'.</p>"
    html_clean: "<p>If experiment were used simply in the sense of 'trial-and-error' in regard to type design and typography, I wouldn't mind so much. But the term seems to have been fairly frequently used to elevate what was, in fact, stylistic play by suggesting a scientific rigour that it didn't possess. Lewis Blackwell's books about David Carson are prime examples. The same sort of thing happens when the jargon of critical theory -- itself an appropriation of scientific and pseudo-scientific terminology by way of social sciences -- is applied to graphic design: its main purpose seems to be to make designers feel important. <br> <br>We should never underestimate the vacuity of much of the design industry, and should be wary when it starts using impressive sounding words. Erik Spiekermann made this point at ATypI this year, relating how, having established a reputation as an information architect (another appropriated term), he began to receive requests for him to give things 'that information design look'.</p>"
