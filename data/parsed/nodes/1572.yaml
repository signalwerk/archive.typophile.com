    html: "<p>Brandon...From what I've seen and heard, the word 'experimental', <br>as it applies to type, bugs a lot of people for some reason. <br> <br>You'd have to hit up google, but if I remember correctly, <br>Jonathan Hoefler had a good quote that attempted to define <br>what is actually experimental...I think he said most of what is <br>supposed to be experimental is not experimental...but I <br>don't remember. <br> <br>Maybe it was in Texts on Type. <br> <br>Also, Claudio Piccinini <br><a href=\"http://fsd.it/thoughtype/main/\" target=\"_blank\">http://fsd.it/thoughtype/main/</a> <br>would be a great person to email. <br> <br>His email address is on the site. <br> <br>He's an expert in Keedy, Deck, Carson, Newlyn, <br>Emigre, et al. and the type scene of the 90s. <br> <br>You should check out another book by Stephen Heller... <br>Letterforms: Bawdy, Bad and Beautiful... <br> <br>see also <br>New Faces: type design in the first decade of <br> device-independent digital typesetting (1987-1997) <br>by Emily King <br> <br>archived at the typotheque site <br> <br>I like to use the word 'exploratory' to describe <br>type design that veers off into unexplored areas. <br> <br> <br>bj</p>"
