    html: <p>Uhm... Hrant, how would you define a RESULT in a creative experiment. Isn't part of the charme of an experiment that you don't know the results. Although it would be nice to have an ex-post-analysis of, say, the 80s/90s post-digital-typographic-experimentation, I don't think it should matter to those who DO the experiments what is the actual outcome of their work. I think in experimentating, the process, the finding-out-about-things or the plaing-around-without-things is very much in the foreground, it is very much an explorative, not a teleological animal. </p>
