    html: <p>I have this thing called a Korg MS2000. It's a MIDI-controlled analog modeling synthesizer designed to make lots of obnoxious noises in rapid succession. I poke at it about once a month or so. I don't play it--I'm not a musician--I just twiddle the knobs and approximate tunes, basslines, and something the kids today call "grooves." Which is different than the Susan Sontag kind, I think. Anyway, I would have called the resulting recordings "experimental music:" a few years ago when I was more  overconfident. Now I just call it "obnoxious music" cos that's what it is. Except maybe for the "music" part. But it's fun to make! <br> <br>I couldn't agree more with Mr. Hudson about humanities and social sciences. These tedious, insufferable ho-dads presume to adopt this ersatz scientific-sounding jargon to inflate their worthless, totally subjective, self-involved yet publicly funded work in blatant service of this or that completely transparent agenda which they nonetheless deny without fail. <br> <br> For more on this I recommend the book <i><a href="http://pfaedit.sourceforge.net/gposgsub.html#AAT">Fashionable Nonsense</a></i> by Alan Sokal and Jean Bricmont and anything by David Stove or Roger Kimball. <br> <br>But I confess I never thought twice about using the word "experimental" to describe type or typography, which now in hindsight seems a mistake. Thanks for the reminder. Then again I won't get too worked up over what's often just semantics. Or do I have the right definition of "semantics?"</p>
