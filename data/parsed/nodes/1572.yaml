    votes: null
    html: "<p>Here I go agreeing with Hrant again: a result I'm not keen to analyse. <br> <br>Experimental is typically used, in reference to type design and typography, as a lazy term to <i>avoid analysis</i>. Unorthodox design is explained away as 'experimental', often as a means of ducking criticism of the results. There is a presupposition that all experiments are successful experiments, justified entirely by their experimental nature rather than by either their goals or their results. True experimental design follows an experimental path: hypothesis, procedure, analysis. <br> <br>If you want to see amazing experimental type design and typography, take a look at the work of the Didots and Bodoni.</p>"
    html_clean: "<p>Here I go agreeing with Hrant again: a result I'm not keen to analyse. <br> <br>Experimental is typically used, in reference to type design and typography, as a lazy term to <i>avoid analysis</i>. Unorthodox design is explained away as 'experimental', often as a means of ducking criticism of the results. There is a presupposition that all experiments are successful experiments, justified entirely by their experimental nature rather than by either their goals or their results. True experimental design follows an experimental path: hypothesis, procedure, analysis. <br> <br>If you want to see amazing experimental type design and typography, take a look at the work of the Didots and Bodoni.</p>"
  - id: 12687
    user: 1262
    date: 2003-10-09T11:14:00
    date_raw: 9 Oct 2003 — 11:14am
    votes: null
    html: "<p><i>I think in experimentating, the process, the finding-out-about-things or the plaing-around-without-things is very much in the foreground, it is very much an explorative, not a teleological animal.</i> <br> <br>Then why not speak about 'explorative typography' or even about 'playing-around typography'? I don't have a problem with either of these terms, and they are more often accurate than 'experimental', which I think should involve an experimental process that leads from an idea to observation and conclusion (not necessarily, nor even likely, a final conclusion, but a judgement). Playing-around, exploring and experimenting are three different activities: they may overlap insofar as playing-around may have an exploratory component, or exploration may proceed from a hypothesis in the same way as experimentation, but largely they are distinct in their method and in their spirit.</p>"
