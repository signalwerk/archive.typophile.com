    html: <p>This is a very interesting subject. <br> <br>I think it's safe to say that all type designers worth their salt experiment permanently. They don't necessarily call their work 'experimental', though, and after a few years, I suppose nobody else does either. Just because a thing works or sells well or looks fairly commonplace doesn't mean it's not experimental. <br> <br>In R&amp;D departments all over the world, all sorts of people are experimenting as I write. I'm not sure they would be very happy if their finished product was labelled 'experimental'. It sounds like something that's not finished. <br> <br>Carter, Unger, Bilak, Berlow, countless others...that about sums it up, I reckon. <br> <br>M.</p>
