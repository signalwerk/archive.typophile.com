    html: <p>&gt;thinking isn't very fashionable in the US.  <br> <br>As usual, Hrant's anti Americanism has little relation to reality. America has many thoughtless and ignorant people, and many thoughtful and brilliant people. Including those who largely invented the computer industry, for a start.  <br> <br>&gt;stopped reading a while back when everyone started to philosophize <br> <br>Brandon, sometimes knowing a little philosophy and history of ideas can help you. (Don't go and confirm Hrant's prejudices about us Americans!)  <br> <br>In this case, the word 'experimental' is sometimes used where 'avant garde' would be used. This is a specific tradition where it is believed that making progress means 'shocking the bourgeois'. There are other kinds of innovation. The bauhaus was once consciously 'avant garde' and made a contribution, though probably also did harm. But the art nouveau and art deco movements were, I believe, not 'in your face', but popular with the well-off of their day. And they too were important additions to type as well as other fields.       </p>
