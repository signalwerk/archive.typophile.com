    html: |-
      <p>When Sandie Shaw won in 1967 with <em><a href="http://www.youtube.com/watch?v=iseZexzSDoM" rel="nofollow">Puppet on a String</a></em>, it was like none of her other songs, a real sell-out tailored to appeal to square Europeans, or it seemed to teen mod moi. As Sandie said, “"I hated it from the very ﬁrst oompah to the ﬁnal bang on the big bass drum. I was instinctively repelled by its sexist drivel and cuckoo-clock tune.”</p>
      <p>As well as being simple, timeless and geeky, Comic Sans is a guaranteed crowd pleaser for people who don’t know any better, and don’t care. You could increase its appeal with a bright RGB color and dropshadow.</p>
