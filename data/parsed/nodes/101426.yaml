    html: <p>Can I ask if you have permission from the Munch heirs? Some of these ‘woodcuts’ are seriously mangled. I was a bit surprised to see your Kafka font, since FF Mister K have gotten so much attention lately. A closer look reveals auto-tracing artifacts, yet they both Edvard and Kafka are much more normalized than the actual handwriting. Can you elaborate on how you made these?</p>
