    <p></p><div class="imageWrap"><img src="http://typophile.com/files/edvard_flags_200x200_6038.png"></div><p></p>
    <p>Hello everyone!</p>
    <p>This is my new release Edvard:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/edvard_heft2_neu_6380.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/edvard_heft5_5325.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/edvard_heft7_4849.jpg"></div><p></p>
    <p>This font is based on the handwriting of Norwegian painter Edvard Munch. Using his many letters, drafts, note- and sketchbooks as reference (source: Archive of Edvard Munch's writings), this font characterizes the elegant yet sometimes quite irregular writing style Munch had. To resemble naturalistic writing and remain as authentic as possible, a combination of extended ligatures and alternates has been included, as well as Swash characters (accessible via open-type). Additionally, several of Munch‘s paintings and woodcuts are embedded as extras. Available at <a class="freelinking external" href="http://www.fontspring.com/fonts/julia-bausenhardt/edvard" rel="nofollow">Fontspring</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/julia-bausenhardt/edvard" rel="nofollow">Myfonts</a>.</p>
    <p><a class="freelinking external" href="http://juliabausenhardt.de/Edvard" rel="nofollow">More info and pictures on my site</a></p>
