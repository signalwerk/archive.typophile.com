    html: <p>I get the same problem with the delay, even though I have a  <br>fast connection. I get the 500 error once in a while. The  <br>script that runs Typophile seems to have trouble sending  <br>back the updated page with your post appended, but not  <br>storing the post. If you get the error, go back to the page  <br>you posted to and see if it's there. Most likely it will be. If  <br>you are worried that you might lose your post, copy it to  <br>the clipboard before hitting the "post this message" button.</p>
