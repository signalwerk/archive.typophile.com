    html: <p>Of course people can express their own views but what is "unethical" or "bad behavior" about protecting valuable intellectual property? <br> <br>Hrant, your comment about "prior art for Delta" is irrelevant regarding trademarks. That is why you have Delta Airlines, Delta faucets, Delta typeface etc. All different classes of goods. <br> <br>Joe's comment about "nobody believes Berthold will suffer a loss in the marketplace" is not the point. If a company lets one person do it, then another will follow and so on until it falls into the public domain. <br> <br>Escalator, Band-Aid, Asprin, Shredded-Wheat, and Kerosene" were once trademarks. Those trademarks became generic because the corporations that originally owned them did not properly use them, and they allowed anyone to use them improperly. <br> <br> <br>Nigel Hamilton</p>
