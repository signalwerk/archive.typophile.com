    html: <p>jumping in late here with a few points <br> <br>Prior Art, while mostly cited in patent and copyright cases, <br>can also apply to trademarks. <br> <br>You can file a trademark as <br> <br>a) the word <br>b) the design alone <br>c) word + design <br> <br>the patent examiner will check active trademarks <br>for possible conflicts, thus checking for Prior Art. <br> <br>In the Berthold/Delta situation specifically, Prior Art, taken literally, is <br>indeed irrelevant but Prior Use is not. <br> <br>William wrote "my understanding is that the owner of a trademark <br>is required to sue or risk losing ownership of the trademark." <br> <br>Not quite right. It will help you if you can <br>show a track record of protecting your mark. <br>But there is not requirement to sue. <br>It's not about that. <br>But if you have a trademark that is in jeopardy, <br>nowadays, you probably are spending your money elsewhere. <br>On advertising. <br>That's how you keep from 'losing' a mark from <br>it becoming genericized. <br> <br> <br>Take Xerox, Wite-Out, Band-Aid, Velcro and some <br>others. The owners of these marks take out ads every month in various magazines <br>(usually Writer-oriented publications) that spell <br>out proper usage of their marks in print. <br> <br>Kleenex (TM) brand disposable tissues, etc.  <br> <br>the older brands did not do that ... if I'm not mistaken.  <br>So these brands today can point to a pile of money <br>spent educating others on proper usage <br>if the generic nature of their mark becomes an issue. <br> <br>As far as Berthold, it's interesting to look specifically at the Delta mark's history. <br> <br> <br> <br>2004-02-17 - Registered - Principal Register  <br> <br>2003-11-25 - Published for opposition  <br> <br>2003-11-05 - Notice of publication  <br> <br>2003-09-22 - Approved for Pub - Principal Register (Initial exam)  <br> <br>2003-08-07 - Communication received from applicant <br> <br>2003-08-27 - Case File in TICRS <br> <br>2003-08-07 - PAPER RECEIVED <br> <br>2003-04-11 - Letter of suspension mailed <br> <br>2003-03-27 - PAPER RECEIVED <br> <br>2003-02-03 - Letter of suspension mailed <br> <br>2002-11-14 - Communication received from applicant <br> <br>2002-11-14 - PAPER RECEIVED <br> <br>2002-11-05 - Case file assigned to examining attorney  <br> <br>2002-06-21 - Case file assigned to examining attorney  <br> <br>2001-04-18 - Letter of suspension mailed  <br> <br>2001-02-09 - Communication received from applicant <br> <br>2000-08-18 - Non-final action mailed <br> <br>2000-07-18 - Case file assigned to examining attorney  <br> <br>I don't know if this TM just got forgotten when a <br>sale of the business was happening? I know <br>nothing about the Hunts, but become more and <br>more curious to hear the truth. <br> <br>And I'm not saying that Berthold taking four years to get this <br>trademark is relevant, just interesting. <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br> <br>bj <br></p>
