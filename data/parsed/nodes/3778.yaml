    html: <p>BJ <br>&gt;but if Berthold had wanted to sue Jamie, it would have had to wait until  'Delta' became registered <br> <br>You are wrong on this. You can sue without a trademark being registered. <br> <br>&gt;More interesting ... luc's summary, below <br> <br>Luc's article is full of incorrect statements and conclusions it belongs in the Star or National Enquirer.  <br> <br>He also references comments by Fred Nader which speaks for itself. <br> <br>As far as how I feel that Berthold is being run I think that the type industry is going back to the days when foundries exclusively distribute their own product. <br> <br>For example only Linotype markets Linotype Univers, Optima Nova, Linotype Syntax etc. <br> <br>You don't see any of Agfa Monotype's new product (including ITC) in the Adobe Library or through Linotype. <br> <br>In fact in a recent Adobe's SEC filing there is a lawsuit between Agfa Monotype and Adobe which Adobe claims would have an adverse effect if they lost. <br> <br>Berthold controls its product although it apears that Agfa Monotype distributes Berthold rather than licensing it as they did in the past. <br> <br>I think Agfa Monotype, Berthold, and Linotype are doing things the right way. Controlling their product. <br> <br>And the only reason that I entered this thread is that I keep seeing so much misinformation about trademarks that no wonder the independent type designer gets into trouble if he doesn't know right from wrong. Especially if he follows Luc's positions. <br> <br>Nigel Hamilton</p>
