    html: |-
      <p>Nigel, you wrote that Linotype no longer delivers the Akzidenz Grotesk. That's right. But nowadays Linotype delivers 4 weights and 4 italics of the Basic Commercial typeface. If you look at <a href="http://www.linotype.com" target="_blank">www.linotype.com</a> you will be able to read the following sentence: "Basic Commercial font is based on the design for Akzidenz Grotesk, which appeared with Berthold in 1900, designed by type setters whose names have not been recorded, but whose skill cannot be overlooked. This typeface has been popular among groups and movements so diverse as the Bauhaus, Dadaism, and the masters of Swiss typography. It served as an influence for a variety of newer, more anonymous grotesque fonts as well as Helvetica. Basic Commerical font is a clear and objective font whose forms exhibit almost nothing unusual, but which remains both lively and legible".  <br>Basic Commercial is available in OpenType with the better hinting, But also in PS and TT for non-InDesign users.</p>
