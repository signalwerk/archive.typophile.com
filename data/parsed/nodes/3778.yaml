    html: <p>&gt;it is essential to protecting intellectual property <br> <br>Leaving aside Hrant's raving, my impression that many on these boards do not understand the legal situation with intellectual property rights, which are important to the type business.  <br> <br>As Nigel says, my understanding is that the owner of a trademark is required to sue or risk losing ownership of the trademark. This is perhaps a bad law, but that is the box that it puts the trademark owner in. If all that Berthold is doing is protecting its trademarks, I do not think they can be faulted for that, and people should not boycott them for that reason.  <br> <br>In the US, my understanding is that only the name can be trademarked, and that in general design itself is not protected. The laws do seem to need changing, but Berthold should not be blamed for the box that the law puts them in.  <br> <br>I am not a lawyer, and I do not know about Berthold's business practices generally, but there needs to be some understanding of the problem any digital foundry faces. <br> <br>Perhaps other owners of digital foundries can comment.       <br></p>
    html_clean: <p>&gt;it is essential to protecting intellectual property <br> <br>Leaving aside Hrant's raving, my impression that many on these boards do not understand the legal situation with intellectual property rights, which are important to the type business.  <br> <br>As Nigel says, my understanding is that the owner of a trademark is required to sue or risk losing ownership of the trademark. This is perhaps a bad law, but that is the box that it puts the trademark owner in. If all that Berthold is doing is protecting its trademarks, I do not think they can be faulted for that, and people should not boycott them for that reason.  <br> <br>In the US, my understanding is that only the name can be trademarked, and that in general design itself is not protected. The laws do seem to need changing, but Berthold should not be blamed for the box that the law puts them in.  <br> <br>I am not a lawyer, and I do not know about Berthold's business practices generally, but there needs to be some understanding of the problem any digital foundry faces. <br> <br>Perhaps other owners of digital foundries can comment.       <br></p>
