    html: <p>&gt;I think Agfa Monotype, Berthold, and Linotype are doing things the right way. Controlling their product&lt; <br> <br>I've kept quiet for a long time, but now i have to clear up a few facts. <br> <br>1. Berthold Types in chicago is not the legal successor to H. Berthold AG <br> <br>2. Berthold Types has registered most of H. Berthold's trademarks and thus has every right to defend them <br> <br>3. Berthold Types has no contracts with any of the original designers whose fonts are being sold today; thus effectively stealing from designers like Hans Reichel, who designed Barmeno but doesn't receive license payments for his design. Nor was he allowed to re-issue his own face as New Barmeno. So he had to call it Sari and redraw it extensively, just to be able to publish a typeface he licensed to H. Berthold AG, not Berthold Types (see 1).  <br> <br>4. Berthold Types sues everybody who only gets into the vicinity of one of their trademarks or even imagined marks, for example "super" or even "grotesk". In these cases they just lost, finally. It is absurd to want to claim a trademark for a generic term like Grotesk, just because it occurs in one of their trademarks (Akzidenz Grotesk). Defending this not only cost countless hours but also tens of thousands of dollars in attorneys' fees. <br> <br>5. They have been sueing dozens of people with frivolous cases. Failing to answer brings about a judgement in their favour; answering cost more money than all these small designers and foundries have. They win not by being right, but by default. <br> <br>6. They are bullies; it is not about trademarks but about deleting the competition. <br> <br>7. I could cite many more (and worse) cases which have cost me and other designers and foundries millions of dollars (and i am not exaggerating), but this will probably already make me the target of the next attack. <br> <br>8. This list doesn't discuss legal matters for their own sake. This list is not called legaphile; it is run by and for people who care for and live by typography.</p>
