      <p>Hi Té,</p>
      <p>It isn't. The app was actually created in an old version of Flash before it supported paragraph styles, so it's not even possible to specify the line spacing (!). After a bit more experimentation, it seems that modifying the font metrics via <em>Type light</em> doesn't make any practical difference to the font's rendering — perhaps these values are here purely to provide visual aids for the designer in the glyph editor?</p>
