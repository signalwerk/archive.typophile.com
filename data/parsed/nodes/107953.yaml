      <p>Hi Bob,</p>
      <p>The fields in question are <em>Line Gap</em> and <em>Typo Line Gap</em>. I've since found a stable release of <em>FontForge</em>, if anybody's more familiar with that: this also exposes a «<em>Has Vertical Metrics</em>» boolean which I can tick (I thought this might cause the <em>Line Gap</em> or <em>Typo Line Gap</em> to take effect, but no dice).</p>
      <p>I'm willing to concede that I might be going about this completely the wrong way. Maybe there's a better method of reducing the default line-height without modifying the glyphs? Any suggestions welcome.</p>
