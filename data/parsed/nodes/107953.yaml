    html: |-
      <p>For historical reasons, Windows and Mac obtain font-based line spacing from different tables: Mac gets it from the hhea table while Windows from the OS/2 table.  See the section on <strong>Baseline to Baseline Distances</strong> in <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/recom.htm" rel="nofollow">Recommendations for OpenType Fonts</a>.</p>
      <p>I don't know what fields <em>Type Light 3.2</em> is adjusting, but perhaps it is adjusting some but not all of the relevant values.</p>
