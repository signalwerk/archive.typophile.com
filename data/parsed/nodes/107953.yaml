    html: |-
      <p>Regarding Type light 3.2:</p>
      <p>As long as you have "calculate automatically" unchecked in the advanced metrics dialog, you can input your own values for all of the standard font metrics and they will be saved with your font. ie:<br>
      winascent<br>
      windescent<br>
      hhea ascender<br>
      hhea ascender<br>
      hhea line gap<br>
      typo ascender<br>
      typo descender<br>
      typo line gap</p>
