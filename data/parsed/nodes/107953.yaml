    html: |-
      <p>There are actually three sets of values, two in the os/2 and one in the hhea. Two of these use ascent, descent and linegap settings, while the third uses only two values (WinAscent and WinDescent). It's possible that your flash app is not using linegap information and simply using ascent+descent as the line height. In that case you'd have to modify one or all of these values. </p>
      <p>Unfortunately I don't use FontForge, so this is as far as I can go. Sorry about that.</p>
      <p>Jason Campbell</p>
