  html: |-
    <p>I've been tasked with making modifications to a Flash application which uses an embedded custom font. The font used in the first instance has since been lost: the version we have is a slight variation which displays a greater line-height, which breaks the fixed layout in many instances.</p>
    <p>I'm using <em>Type light 3.2</em> — it seems to be the most stable free font editor available for Windows (<em>Font Forge</em> crashes whenever I modify the font) — to try and modify the font metrics to reduce the line height. <em>Line Gap</em> and <em>Typo Line Gap</em> were set to <code>200</code>, which I reduced to <code>0</code> for each (this seemed the most obvious metric to try) in an attempt to see an immediate difference, however the new font doesn't appear any different in any software I use to render it across several lines.</p>
    <p>There are other less obvious options: I could try reducing the various ascender and descender values, or reduce the EM unit size, but these seem overly invasive and contrived ways to get around what seems fairly conceptually simple. Am I missing something?</p>
