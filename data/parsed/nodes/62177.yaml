  html: <p>WhiteCrow has designed 11 Indian language fonts for  Vodafone. WhiteCrow team is planing to launch a new set of ’Indian Language TypeSet’ soon, which will be user friendly by keeping the Indian language authenticity intact. We are looking forward for modern Indian typefaces by maintaining the localness in it. I hope, we will get the genuine feedback on our work. :)</p><div class="imageWrap"><img src="http://typophile.com/files/WhiteCrow-Sarang-Kulkarni_5912.gif"></div><p></p>
