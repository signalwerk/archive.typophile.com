    votes: null
    html: |-
      <p>William, pretty much right on.</p>
      <p>The audience is mostly 40 and up crowd. people with money looking to donate and to have a good time at particular charity events through the next year.</p>
      <p>there will be a mix of short and long text passages as their will be many columnar listings and a few features or call-outs of certain events. </p>
      <p>the size will be somewhere between the 6x9 to 8x10 range…(yet to be finalized and decided upon)</p>
      <p>the paper will most likely be matte stock, although this will be running and shipping as an insert to our larger and main magazine, they may get a deal on the stock we are currently using.</p>
      <p>text color will be black with a splash or two of accent color that i have yet to decide upon</p>
      <p>i like the idea of the Goudy types…warm and unpretentious, and his Chicago connections are right on. subtle details for those who care. it’s important to not make this look too inaccessible to the general public. this insert booklet needs to span the bridge between the usual reader of our main magazine and the common person who picks it up, not knowing what the main magazine is about (fashion and expensive everything).</p>
      <p>w|m</p>
