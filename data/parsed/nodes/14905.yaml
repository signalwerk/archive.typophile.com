  html: |-
    <p>I’m going to be working on a 64 or so page booklet/pamphlet highlighting charity events and charities over the next year in the city of Chicago. i was wondering what a good typeface might be for use in text passages and also one that would be used for headlines or as display in conjunction. Maybe a quick explanation as to why for each as well would be really helpful.</p>
    <p>thanks-<br>
    w|m</p>
