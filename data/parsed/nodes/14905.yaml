      <p>Important questions, but I thought Will already answered most of them, or implied the answers. The readership of a charitable pamphlet is likely to have many people over 50 years old, well off contributors or potential contributors. A pamphlet is usually 6 x 9. He implied that there will be some extensive text passages. A pamphlet is usually not on coated paper. There will likely be extensive lists of names of contributors and sponsors…</p>
      <p>Am I right?</p>
