    html: <p>I’d use <a href="http://www.p22.com/lanston/products/goudyoldstyle.html">Goudy Oldstyle</a> or another of Goudy’s faces. His formative years were spent in Chicago, he comes from the mid-west, and his typefaces have the warmth and unpretentiousness that I associate postively with the midwest (I come from there). Goudy Oldstyle will have a reassuring familiary with the generous and caring overtone.</p>
