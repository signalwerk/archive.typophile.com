    html: |-
      <p>Your code has several problems.<br>
      The language tag for Bulgarian is BGR, not BUL. See <a href="http://www.microsoft.com/typography/otspec/languagetags.htm" title="http://www.microsoft.com/typography/otspec/languagetags.htm">http://www.microsoft.com/typography/otspec/languagetags.htm</a><br>
      The <code>languagesystem</code> declarations are missing.<br>
      <code>script latn;</code> is also missing.</p>
      <p>Here's the correct code (not tested)<br>
      <code>languagesystem latn dflt;<br>
      	languagesystem latn MOL;<br>
      	languagesystem latn ROM;</code></p>
      <p>languagesystem cyrl dflt;<br>
      	languagesystem cyrl BGR;<br>
      	languagesystem cyrl SRB;</p>
      <p>feature locl {</p>
      <p>script latn;<br>
      	language MOL exclude_dflt;<br>
      		sub Scedilla by uni0218;<br>
      		sub scedilla by uni0219;</p>
      <p>	language ROM exclude_dflt;<br>
      		sub Scedilla by uni0218;<br>
      		sub scedilla by uni0219;</p>
      <p>script cyrl;<br>
      	language BGR exclude_dflt;<br>
      		sub @russ by @bulg;</p>
      <p>	language SRB exclude_dflt;<br>
      		sub afii10066 by b.serb;</p>
      <p>} locl;</p>
