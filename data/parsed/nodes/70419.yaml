    <p>I try to create locl feature for Serbian and Bulgarian letters. But while working in FontLab, they don’t work both in Illustrator and InDesign (CS4). My initial feature code:</p>
    <p>feature locl { # Localized Forms<br>
    # Latin<br>
    language MOL exclude_dflt; # Moldavian<br>
    sub Scedilla by uni0218;<br>
    sub scedilla by uni0219;<br>
    language ROM exclude_dflt; # Romanian<br>
    sub Scedilla by uni0218;<br>
    sub scedilla by uni0219;<br>
    script cyrl; # Cyrillic<br>
    language BUL  exclude_dflt; # Bulgarian<br>
    sub @russ by @bulg;<br>
    language SRB  exclude_dflt; # Serbian<br>
    sub afii10066 by b.serb;<br>
    } locl;</p>
    <p>It works for Moldavian and Romanian, but doesn’t work for Bulgarian and Serbian.<br>
    Then I used lookups:</p>
    <p>feature locl { # Localized Forms<br>
    # Latin<br>
    lookup locl1 {<br>
    sub Scedilla by uni0218;<br>
    sub scedilla by uni0219;<br>
    } locl1;<br>
    lookup locl2 {<br>
    sub @russ by @bulg;<br>
    } locl2;<br>
    lookup locl3 {<br>
    sub afii10066 by b.serb;<br>
    } locl3;<br>
    language MOL; # Moldavian<br>
    language ROM; # Romanian<br>
    lookup locl1;<br>
    script cyrl; # Cyrillic<br>
    language BUL; # Bulgarian<br>
    lookup locl2;<br>
    language SRB; # Serbian<br>
    lookup locl3;<br>
    } locl;</p>
    <p>In this case Cyrillic local features (Bulgarian and Serbian at the same time) works only if I change language to any “Latin” language. In “Cyrillic” languages locl features don’t work.</p>
    <p>Any help would be appreciated.</p>
