    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: Amazing People In Type&nbsp;: Tiffany Wardle (aka <a href="/node/20077" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Miss Tiffany</a>)</strong></p>
    <p>Resident expert on <a href="/node/13538" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Dwiggins</a>.</p>
    <p>Authored <a href="http://fontlab.wikidev.net/The_Case_for_a_User-Friendly_EULA"><em>The Case for a User Friendly Eula</em></a> for the second issue of <a href="/node/13045" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Interrobang</a>.</p>
    <p>Miss Tiff is also the trademark holder for the infamous typographic term “<a href="/node/33713" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Squooshed™</a>.” She also coined the term <a href="/node/add/wiki?edit%5Btitle%5D=Alphabettys" title="Create node &quot;Alphabettys&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Alphabettys</a> for which trademark protection is currently&nbsp;pending.</p>
    <p>For a more complete profile, visit the <a href="http://fontlab.wikidev.net/User:Miss_Tiffany">FontLab <span class="caps">EULA</span> Wiki site</a>.</p>
