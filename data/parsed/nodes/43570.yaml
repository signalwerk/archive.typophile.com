    html: |-
      <p>Stephen: I tried, but I can't get through to him mailwise. He is probably busy with his own work right now.</p>
      <p>Miguel: Whew, you scared me there for a second.<br>
      <a href="http://www.robofab.org/index.html" title="http://www.robofab.org/index.html">http://www.robofab.org/index.html</a><br>
      If you follow this link here, </p>
      <p>you'll arrive at the RoboFab page. </p>
      <p>RoboFab is a little plugin that works with FontLab and allows manipulation of glyph segments via Python script. It also allows the usage of what I called "tooltips" in my descriptions, only that they are called pens, but the idea remains the same.</p>
      <p>RoboFab saves data in its very own file format called UFO (Unified Font Object) which is pretty neat as it is XML-based and can be read without an editor. It exports fonts into every format that is supported by FontLab.</p>
      <p>I thought that the Python scripts you write for RoboFab would somehow get included into the font file and be run when the font is in use. Maybe, this was a misunderstanding and the scripts are only executed <em>before</em> the font is generated and the font afterwards becomes just a normal font with all the usual limitations.</p>
      <p>I will check on that, but this will require some time.</p>
      <p>If in the meantime you come up with any other ideas, please let me have them.</p>
