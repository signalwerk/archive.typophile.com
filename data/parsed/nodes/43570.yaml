      <p>Since RoboFab applies the Python scripts before the font is rendered, you could try a "hack" approach by using something like PHP to vary the CSS stylings of a web page. In this case, the your font would have to be installed on the reader's computer. </p>
      <p>Otherwise, you could try using PHP to call a random image from a specified folder (a folder containing your variations of the "C" character, for example.</p>
      <p>Although the former approach would be easier, the latter wouldn't be overwhelming -- you'd just have to specify a randomization for each character you wanted to use. It wouldn't be all that hard.</p>
