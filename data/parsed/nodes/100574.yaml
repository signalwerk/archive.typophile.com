      <p>Agreed. I like to try out new type-related products and services, but before entering personal data, I would like to know who is behind it, what it is about and where it is headed.</p>
      <p>BTW: Have you cleared that name with Linotype? Helpetica set in Helvetica with just one letter changed from the most famous trademark in the type industry. That sound's like trouble.</p>
