  html: <p>I am a product manager working on a new prototype for a mobile typography app. I need some typographers and designers to have a look and potentially participate in a free beta program. I would like to gain some insight into what would be interesting for you and what may or may not be useful. If you are interested please let me know by going to <a class="freelinking external" href="http://www.helpetica.com" rel="nofollow">http://www.helpetica.com</a> and you can sign up there. There will be limited spaces.</p>
  html_clean: <p>I am a product manager working on a new prototype for a mobile typography app. I need some typographers and designers to have a look and potentially participate in a free beta program. I would like to gain some insight into what would be interesting for you and what may or may not be useful. If you are interested please let me know by going to <a class="freelinking external link-external" href="http://www.helpetica.com" rel="nofollow">http://www.helpetica.com</a> and you can sign up there. There will be limited spaces.</p>
