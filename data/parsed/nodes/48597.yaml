    html: |-
      <p>Take a look at DaFont.com and do a search for Art Deco. You should come up with some good things. Do it cleanly with nice rich, vibrant colors. See if you can’t get into Photoshop and get an illustrated look going. Also, I think city skylines and things of that nature were big back then so you might incorporate a skyline into your design somehow. </p>
      <p>Hope that helps!</p>
