  html: <p>Doing up a brochure on Art Deco Poster Art for my design course... Am designing the brochure as a poster (it’s a 5 page concertina fold...)... would appreciate any suggestions for good typefaces to use... Thanks heaps!</p>
  html_clean: <p>Doing up a brochure on Art Deco Poster Art for my design course... Am designing the brochure as a poster (it’s a 5 page concertina fold...)... would appreciate any suggestions for good typefaces to use... Thanks heaps!</p>
