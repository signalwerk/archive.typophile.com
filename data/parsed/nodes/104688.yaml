    html: |-
      <p>Thank you. I went with Monserrat and cabin as a fallback. I also increased the font size slightly and changed from all caps to lower case except for the first letter of each item. I also changed the long menu item name "announcements" to "news" to give the whole menu more breathing room.<br>
      I think it looks a lot better. For the drop downs I maintained the uppercase and increased the size a bit.<br>
      Also, I changed the color and increased the font size of the city names on the grey tabs in the "Latest hotel openings" section in the middle of the page. I think it looks a lot easier to read.<br>
      Thank you for your suggestions..</p>
