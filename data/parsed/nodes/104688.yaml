    html: <p>I can read the ones with the colored backgrounds okay; the ones with the gray backgrounds (further down the page) are a little harder for me. But if you're getting negative feedback you obviously need to consider that. You might try upper &amp; lower case heads (rather than all caps) and then bump up the size a bit.</p>
