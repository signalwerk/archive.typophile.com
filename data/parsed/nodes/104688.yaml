      <p>Hi -<br>
      Yes the thin white font is not very legible, but it is still possible to read.  I do not know how much control you can have over the colors and font, but if you do you can try making the fonts <strong>BOLD</strong>.  The html tag may be 'strong'.  If that does not solve the problem, try to play with the colors:<br>
      EITHER make the menus background a shade darker, OR  use a very dark red (instead of white) for the font.</p>
      <p>In the black and white menus under the title "Hot Hotel Openings".<br>
      Also make the fonts <strong>BOLD</strong>, and try to use a larger font size.  Try using a light yellow for the font instead of white. </p>
      <p>Good luck</p>
