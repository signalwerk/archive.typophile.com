    <p>Hello,</p>
    <p>I have just finished building out a website, based on a wordpress theme. I am quite happy with it but when I have asked for comments from people, a number of people have said that I should change the font in the top menus as the current font doesn't stand out well enough against the bright backgrounds. I was hoping somebody here could give me some advice on what type of fonts would look good in this situation.</p>
    <p><a class="freelinking external" href="http://newthaihotels.com" rel="nofollow">This is the site</a></p>
    <p>Thank you</p>
