    <p></p><div class="imageWrap"><img src="http://typophile.com/files/4fonts_may2009_3771.png"></div><p></p>
    <p>Every two months, we offer a font discovery pack at a very affordable price compared to regular prices when purchased with the rest of a family. From €98. You save approximately 30%.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/4fonts_a_may2009_4192.png"></div><p></p>
    <p>The first Font Discoveries pack is a good way to discover our fonts at an affordable price. Jump on the <a class="freelinking external" href="http://www.typofonderie.com/alphabets/special_offers/fontdiscoveriesmay2009" rel="nofollow">Font Discoveries May 2009</a> for more info about the 4 fonts included: Parisine Plus Sombre PTF Bold Italic, Angie Sans Std Regular, Le Monde Livre Classic Std Swashes, Apolline Std Demi. In July, a new pack will remplace it, so don’t miss this opportunity.</p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/special_offers/fontdiscoveries" rel="nofollow">Font Discoveries page</a><br>
