    html: |-
      <p>I think the "ff" link needs to look more intentional and less like it might be a typesetting mistake. To achieve that, it needs more air and more flourish. I'd increase the leading and match the font sizes, then perhaps elongate/redraw the second f for a more custom, hand-drawn feel. </p>
      <p>If you elongated both effs, it might alleviate the kerning problems of Af; if the top eff was longer, you could lower it a smidgen and then, nudge over the A.</p>
      <p>Few clothing companies use the word "fashion" in their name anymore because it evokes a London haberdashery or 50s dress shop....so, maybe a nod to vintage hand-painted signage would appeal to them?</p>
      <p>No offense, but right now, it looks like a scary blood clot where the effs meet. The eye just hangs there, waiting for it to pop or something. </p>
      <p>(Well, that's not a pretty image, is it? ew. Sorry!)</p>
