      <p>If it's for kids, I don't think the font choice is at all appropriate. I've seen some of your web design, and it's lovely, so I think with some work your attempt at logo development will turn out great. </p>
      <p>Shop around at some kids stores for some guidance. If I were looking for a font to appeal to both kids and parents, I'd start over at the Sudtipos font foundry. I'm thinking something sophisticated yet playful like <a href="http://sudtipos.com/fonts/129" rel="nofollow">Ricotta,</a> <a href="http://sudtipos.com/fonts/11" rel="nofollow"> Pinguino</a> or perhaps <a href="http://sudtipos.com/fonts/117" rel="nofollow">Aladin</a> both work better than what you have now -- which feels more like a men's suit than a child's overalls.</p>
