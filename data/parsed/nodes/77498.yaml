    html: <p>Perhaps avoid the <em>f</em> ’s linking all together if you say drawing isn’t your strong point. Just set it on a single line in the same point size. If it’s childrens clothes perhaps using something with a bit more charm would be more appropriate. You could also hint towards fashion by using something like <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code> or <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code>. And tie in the kid factor by using some pastelly colours. Just a few thoughts…</p>
