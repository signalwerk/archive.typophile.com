    html: |-
      <p>OK, thanks for your harsh but honest opinions. It's exactly what I wanted (and probably needed).</p>
      <p>My main occupation is web design, so I rarely venture out into logo design :-)</p>
      <p>The target audience is essentially young parents looking for fancy clothes for their kids aged 0 to approximately 15.</p>
      <p>The shop is legally based in Germany, but the plan is to sell clothes outside Germany as well, especially to Russia where the store owner is originally from.</p>
      <p>According to my client "Afonja" is some little fairy that all kids in Russia know. I think it's a good choice for a company name because it's short and easy to memorise. It was my client's wish to add "fashion" to the name so it becomes instantly clear what the company does. I would have dropped the "fashion" bit too, but I failed to convince my client here.</p>
      <p>My drawing skills in Illustrator are extremely limited, so it's probably best if I don't do to much drawing there. Especially drawing curves causes me a headache. </p>
      <p>The client wants a simple logo and has even approved my first version (which has actually never happened to me before). So I just want to improve it a little bit without changing the underlying idea too much.</p>
      <p>How do you like this one:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-v2_4079.png"></div><p></p>
