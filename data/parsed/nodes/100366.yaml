    html: |-
      <p>If you want the "a" (like John's) to be less like an "o" you give it a hard top-right. Or you could make the "a" from a "u" rotated 90 degrees clockwise, then close the right side with a stem.</p>
      <p>BTW:<br>
      - An "n" made from a flipped "u" will appear slightly narrower than the "u" (optical illusion) so you probably want to compensate for that.<br>
      - Make sure you don't end up too close to this:<br>
      <a href="http://unum.newshq.businesswire.com/sites/unum.newshq.businesswire.com/files/logo/image/UnumBW.jpg" title="http://unum.newshq.businesswire.com/sites/unum.newshq.businesswire.com/files/logo/image/UnumBW.jpg">http://unum.newshq.businesswire.com/sites/unum.newshq.businesswire.com/f...</a><br>
      - What are the other letters in the name? Is there an "e"?</p>
      <p>hhp</p>
