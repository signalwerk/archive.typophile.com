  html: |-
    <p>Having lived in LA for a couple years during my youth I encountered <a href="http://www.kcrw.com" rel="nofollow">KCRW</a>, a public (non-commercial) radio station based out of Santa Monica College that happens to have a consistently excellent music show, <a href="http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=76016777" rel="nofollow">Morning Becomes Eclectic</a> with host Nic Harcourt. The show always involves the band coming in the studio for a live 40 minute session.</p>
    <p>Well, they've always had Real Audio streams (which have had sub-par quality over the years) but they've recently made the show available as a <a href="http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewPodcast?id=76016777" rel="nofollow">Podcast</a> (Link requires iTunes).  </p>
    <p>Recent bands include Clap Your Hands and Say Yeah and a gem out of Tijuana, called Nortec Collective. Yum.</p>
