      <p>While categorizing or developing a <em>greyscale value</em> system for text blocks might be useful (and in fact the more common awareness of what affects type color), my focus on this topic thread is about expressions for <em>texture</em> and not density or value of text blocks.</p>
      <p>An example of what I mean would be this --<br>
      (the LAST place one should evaluate type color is on screen, so I've used exaggerated examples here.)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/BenguiatCond_5031.png"></div><br>
      The characteristic sharp wedged serifs of Benguiat Condensed are still prominent enough at text sizes of 8--12 points to create a "<em>Spikey</em>" look. It is the intrinsic nature of the face, and can either be emphasized or diminished by adjusting spacing/leading.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Basilia_reg_3674.png"></div><br>
      In Basilia Regular, the rounds are slighly narrow yet the counters feel open. The straight-to-round and round-to-round character combos unless given adequate space will tend to darken quickly but in contrast the counters create open holes creating a block of text that <em>Dazzles</em> (a term that may not really exist, but expressed to me by several "type directors" of yore). To decrease the <em>dazzle</em> you need to open letter spacing.<p></p>
      <p>There are many characteristics in blocks of text that you may or may not want presented. The very reason why one text face may work "better" than another for the intent of the printed piece is based on these subtle and intrinsic apects of a given typeface. As you can see, this has less to do about the <em>lightness</em> or <em>heaviness</em> of a text block, but more about the <em>texture</em> or <em>flavor</em> one might say.</p>
