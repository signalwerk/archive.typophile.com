      <p>Dark and light are obvious ones referring to texture. 'Dance' is a useful one I have seen people use on typophile, and is particularly relevant to italics. There is also the 'picket fence' effect, which is generally to be avoided, though not in some display types. </p>
      <p>Here is Tracy on ascender height: "For my own taste, if x to h is a proportion of about six to ten a face will look refined and be pleasant to read. If the x-height is much less than that the face may be stylish but will be unsuitable for a long text. A larger x-height conduces to dullness."</p>
      <p>Very well said, I think.</p>
