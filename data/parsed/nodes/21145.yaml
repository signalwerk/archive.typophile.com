      <p>That's A-Ok, Chris.<br>
      In fact, the type exercise I'll be sharing at Type Ed session is for students to evaluate <em>tonal value</em> of copy blocks... in other words, how light or dark one block of copy compares to another.</p>
      <p>The first step in "seeing" type color is understanding that text is basically ink on paper. Type style, size, density and massing of glyphs within a given area equals the ink coverage... the more ink coverage the darker the tonal value.</p>
      <p>Whoever thinks the world is just black and white will have a hard time seeing type color.</p>
