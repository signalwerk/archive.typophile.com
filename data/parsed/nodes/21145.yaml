      Bringhurst's Elements of Typographic Style lists four entries on text block colour, and I think some of the writing about Matthew Carter's work also includes considerations about his types' resulting overall colour on the page. 'Fine Print on Type' also comes to mind, although I'm not sure which section.</p>
      <p>For myself, I've been known to use weather-related terminology to describe text block colour – from 'light drizzle' through to 'blizzard' because these terms convey some accompanying notion of direction and degree of noise, possibly amounting to what we construe as texture in this instance. I'm also pretty sure that the old terminology relating to textures in mezzotinting and mechanical tint-laying might be relevant to this.</p>
