    <p>In one of the sessions during Thursday's "Type and Design Education Forum" at TypeCon, I will be sharing an exercise aimed at improving design students' awareness of and sensitivity to type color.</p>
    <p>One of the many components that effect the 'color' of text blocks is <em>texture</em>.</p>
    <p>Most of the terms used in describing text texture that I am aware of sound closer to the expressions used in classifying the varying sensations of <a href="http://zebra.sc.edu/smell/wine_glossary.html" target="new" rel="nofollow">wine tasting</a> -- fruity, dirty, hearty, nutty, rustic, woody, etc.</p>
    <p>Of the <em>texture</em> "expressions" I have used, here are a few of the key ones:<br>
    - Sparkle, Dazzle, Spikey, Flowing, Weak, Thin, Heavy, Staccato, Contrast, Even, Flat...</p>
    <p>(Some of these expressions I learned from "old type composers" during my formative years.)</p>
    <p>Questions --<br>
    Is anyone aware of a resource (like a Wine Terminology glossary) that ellaborates on actual type texture terminology/descriptions.</p>
