      <p>Reading the range of descriptors here and realizing the apparent lack of written history on the subject, or consensus for that matter, speaks to the loss of apprenticeship in typography education. I'm not lamenting the loss, in fact I value the call to invent. I'm just observing further evidence of the dissolution of some official "Order of Typographiliacs." :•)</p>
      <p>I frequently use terms like "chewy" or "soft" and other metaphors referencing how something feels in the mouth. How does it work on the tongue, how do teeth negotiate the text? I encourage my sophomore students to add these words to our type wiki and try to define them. The exercise reveals much about trying to define "taste."</p>
      <p>Also I appreciate what Norbert is attempting here, to categorize or stabalize a "standard" for how we talk about such things. The work progresses through discussion and agreement (or fraternal enforcement). Where it gets tricky is assigning value (worth) of one or the other. The standards would need to be specific to particular uses: a set for reading online, one for newspapers, one for shampoo labels, etc.</p>
