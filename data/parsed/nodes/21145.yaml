      <p>I think the problem with a greyscale value is that it may not tell you enough about the variables.  An 18% grey may be achievable by both a light weight set solid or a bold weight set loose.<br>
      With the numeric system above, you could add another digit for letterspacing if needed. An example might be Helvetica, with tight letterspacing  might be a 1 and a very open letterspaced font might be a 9. This would give us a 4 digit number. You could also add letters or substitute them for a number.  The letter could stand for degree of slant or any other important variable.  I guess what I am getting at is that we first need to define each variable that we consider important and then give it a value scale.  I think esoteric descriptive words can be very vague.  It seems trying to emulate the Pantone matching system is a better idea to me than trying to emulate colors used in car paint--Zombie red, Caribbean Blue, Bahama Yellow say less than PMS396.</p>
      <p>ChrisL</p>
