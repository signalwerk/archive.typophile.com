      <p>&gt; <em>You can identify density of grey separately from texture, but I don’t think texture is an independent variable, so to speak, from density or ‘tonal value’ as you put it.</em></p>
      <p>William, I agree that <em>texture</em> is not an independent variable affecting <em>type color</em>, but it does happen to be one of the lesser discussed or defined aspects. My perspective is from the "type user" or typographer's point of view and less from the type designer's point of reference.</p>
      <p>Back during my Cg/Agfa days, I produced no less than six editions of their "big" type specimen books, each containing 5-6 lines of 10 pt. type over 11 points of leading at 20+ pica width. (Not the one or two liners you see nowadays.) By maintaining these settings consistently, the user could make comparitive judgements regarding what cut (version) of a typeface or family they preferred.</p>
      <p>Getting an even and balanced color to each copy block was a prerequisite (as was for all printed material coming out during my watch). There is no doubt that even small adjustments to leading or overall tracking affect the <em>lightness</em> or <em>darkness</em> of a copy block.</p>
      <p>Teaching students and novice designers about achieving a balanced grey tone or color in text blocks is not too difficult to explain or demonstrate. My main concern (and the reason for this topic thread) is how to teach students to see the more subtle aspects of block copy, that each typeface and each weight/style has an intrinsic <em>feel, flavor, personality, texture,</em> and/or <em>flavor</em>, so to speak.</p>
      <p>It just seems that there are few, if any, standard <em>terms</em> or <em>descriptions</em> used to express these inherent type qualities. Hence my reference to "wine tasting" glossaries, since this is an example of how an industry or user base sought to define subtle but discernable aspects of aroma and taste.</p>
      <p>It would be great if we were able to describe a newly released italic old style as <em>gracefully dancing</em> at 10 through 12 point settings... and have someone understand what it implies.</p>
