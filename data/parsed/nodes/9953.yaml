    html: <p>THX HD for saving me the trouble. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> BTW I believe the person who originally explained it to me was German as well, when I did my training at MetaDesign Berlin. It might even have been Herr Spiekermann himself. <br> <br>The problem I have with the American way of using Em-dashes for parenthetical statements is that it creates humongous gaps in your lines of text. It <i>can</i> look beautiful in book settings or in two column magazine lay-out, even quite elegant, but you simply can't get away with it when your columns of text get narrower. It also gets a bit awkward when the dash almost literally sticks to the neighbouring words.</p>
