    html: <p>&gt;<i>As for spacing around the em-dash, I don't like crashing it into the letters around it. In Quark I typically use a kern of +30 between a letter and an em-dash -- about a third of a space, so it's not too close and not too far.</i> <br> <br>Cheshire, perhaps you've got a script to do all that manual kerning for you, but here's an alternative approach that I use.  <br> <br>In Quark, I set all my em dashes with a "flexible" space on either side -- <b>shift-opt-space</b>. Quark doesn't have access to a thin space, per se; but you can set the value of the flexible space in the Document Preferences &gt; Character tab. The specification is a percentage of the width of the normal space. I like to use 25%, which generally yields approximately a 16th em space. <br> <br>You can do this with a global search-and-replace. I usually replace all em-dashes with the string <b>\f—\f</b>. (That should read <i>backslash f emdash backslash f</i>). The \f (<i>backslash f</i>) is Quark code for the flexible space. Then I follow up with a search for the [space][flexible space] combination and replace with just the flexible space, and the same for the reverse, to catch any double spaces fore and aft. <br> <br>You can add the command key (command-shift-opt-space) to make the flexible space non-breaking, if you need to (to prevent a line from breaking before the dash, for instance), although you can only do this manually, as far as I've discovered. <br> <br>If the em dash in a font is too long for your taste, but the en dash too short, you can create your own "three-quarter" em dash by horizontally scaling the em dash 80% or so. In this case, the scaling does no damage to the integrity of the character shape. You can define a character style specifically for applying this to your em dashes and do a search-and-replace, unchecking the Ignore Attributes box and applying your character style. <br> <br>-- K. <br></p>
    html_clean: <p>&gt;<i>As for spacing around the em-dash, I don't like crashing it into the letters around it. In Quark I typically use a kern of +30 between a letter and an em-dash -- about a third of a space, so it's not too close and not too far.</i> <br> <br>Cheshire, perhaps you've got a script to do all that manual kerning for you, but here's an alternative approach that I use.  <br> <br>In Quark, I set all my em dashes with a "flexible" space on either side -- <b>shift-opt-space</b>. Quark doesn't have access to a thin space, per se; but you can set the value of the flexible space in the Document Preferences &gt; Character tab. The specification is a percentage of the width of the normal space. I like to use 25%, which generally yields approximately a 16th em space. <br> <br>You can do this with a global search-and-replace. I usually replace all em-dashes with the string <b>\f—\f</b>. (That should read <i>backslash f emdash backslash f</i>). The \f (<i>backslash f</i>) is Quark code for the flexible space. Then I follow up with a search for the [space][flexible space] combination and replace with just the flexible space, and the same for the reverse, to catch any double spaces fore and aft. <br> <br>You can add the command key (command-shift-opt-space) to make the flexible space non-breaking, if you need to (to prevent a line from breaking before the dash, for instance), although you can only do this manually, as far as I've discovered. <br> <br>If the em dash in a font is too long for your taste, but the en dash too short, you can create your own "three-quarter" em dash by horizontally scaling the em dash 80% or so. In this case, the scaling does no damage to the integrity of the character shape. You can define a character style specifically for applying this to your em dashes and do a search-and-replace, unchecking the Ignore Attributes box and applying your character style. <br> <br>-- K. <br></p>
