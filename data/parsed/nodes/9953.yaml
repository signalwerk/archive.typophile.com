    html: '<p>Get yourself a copy of the book "The Elements of Typographic Style" by Robert Bringhurst. It will tell you this, and a whole lot more besides, and make up for the ineptitude of your lecturers  perfectly <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  <br>  <br>You dont mention if you are using a Mac or a PC. On a Mac, you do it thus:  <br>  <br>- for a hyphen  <br>Alt + - for an en dash  <br>Alt + Shift + - for an em dash <br> <br>On windows, you do: <br> <br>- for a hyphen <br>Alt + 0150 for an en dash <br>Alt + 0151 for en em dash <br> <br>Both these codes need to be typed on the numeric keypad, and not the number rows above the QWERTY keys. <br> <br></p>'
    html_clean: '<p>Get yourself a copy of the book "The Elements of Typographic Style" by Robert Bringhurst. It will tell you this, and a whole lot more besides, and make up for the ineptitude of your lecturers  perfectly <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  <br>  <br>You dont mention if you are using a Mac or a PC. On a Mac, you do it thus:  <br>  <br>- for a hyphen  <br>Alt + - for an en dash  <br>Alt + Shift + - for an em dash <br> <br>On windows, you do: <br> <br>- for a hyphen <br>Alt + 0150 for an en dash <br>Alt + 0151 for en em dash <br> <br>Both these codes need to be typed on the numeric keypad, and not the number rows above the QWERTY keys. <br> <br></p>'
