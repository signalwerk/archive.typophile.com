    html: "<p>Thanks, Kent. Your solution to the spacing issue is good. My script, such as it was, went like this: Do a search for an em-dash, place cursor before, go thwack-thwack-thwack on the keyboard (that's shift-command-] for you Mac folks), move the cursor to the other side, go thwack-thwack-thwack, then repeat as necessary. It was always the last thing I did on a document, so it was kind of soothing, like cleaning one's desk after a job is done. <br> <br>As for horizontally scaling the offending em-dash, you just blew my mind. It never occurred to me. I wish you were in my life six years ago.</p>"
