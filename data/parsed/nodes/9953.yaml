  html: <p>endashes and emdashes. They're different from hyphens - thanks to my many lecturers for NEVER pointing this out - this I know. Now that I know, hyphens just don't look right some places. Problem is I'm not entirely sure where to use them, so whats the protocall? <br> <br>And while we're at it, how do I access them in Quark (I can get the code for them from fontographer but don't know how to specify this in Quark)?</p>
