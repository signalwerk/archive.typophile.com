    html: "<p>On a Mac, Alt is also often referred to as Option. <br> <br>The proper use of hyphen, en, and em dashes is also frequently covered by editorial style guides, since the various dashes serve different semantic purposes. <i>Chicago Manual of Style</i> is a good reference, in addition to Bringhurst. <br> <br>In short:  <br> <br>Hyphens are used for hyphenating words, either because they are spelled as hyphenated compounds or because of end-of-line hyphenation.  <br> <br>En dashes are used for ranges of numerals. There are also special circumstances for using an en dash in certain hyphenated compounds, but editorial style guides differ on this. <br> <br>Em dashes are used for parenthetical statements. These are the dashes that are often represented as double hyphens in text -- such as I'm doing here -- and usually indicate a change in voice or a subordinate clause with a relatively looser relationship to the main statement. Style guides (editorial and typographic) differ on whether em dashes should be set on either side with full spaces, thin spaces, or set closed. <br> <br>HTH <br> <br>-- K. <br> <br> <br></p>"
    html_clean: "<p>On a Mac, Alt is also often referred to as Option. <br> <br>The proper use of hyphen, en, and em dashes is also frequently covered by editorial style guides, since the various dashes serve different semantic purposes. <i>Chicago Manual of Style</i> is a good reference, in addition to Bringhurst. <br> <br>In short:  <br> <br>Hyphens are used for hyphenating words, either because they are spelled as hyphenated compounds or because of end-of-line hyphenation.  <br> <br>En dashes are used for ranges of numerals. There are also special circumstances for using an en dash in certain hyphenated compounds, but editorial style guides differ on this. <br> <br>Em dashes are used for parenthetical statements. These are the dashes that are often represented as double hyphens in text -- such as I'm doing here -- and usually indicate a change in voice or a subordinate clause with a relatively looser relationship to the main statement. Style guides (editorial and typographic) differ on whether em dashes should be set on either side with full spaces, thin spaces, or set closed. <br> <br>HTH <br> <br>-- K. <br> <br> <br></p>"
