    <p>This online survey is about fonts and their personalities. The purpose of this survey is to determine whether or not participants think that the 24 particular fonts are associated with tangible personality traits. The findings of this survey will help contribute to limited research on fonts and their personalities, and will also provide valuable data for further research. Your participation is essential for the success of this study.</p>
    <p>This survey is expected to take 20-25 minutes. If you agree to participate in this survey, you will be asked to:</p>
    <p>Follow the link noted below,Complete the survey, and Press the “Finish Survey” button noted at the end of the survey.</p>
    <p><a href="http://freeonlinesurveys.com/rendersurvey.asp?sid=zyr6ib8ef4fbf6f604182" title="http://freeonlinesurveys.com/rendersurvey.asp?sid=zyr6ib8ef4fbf6f604182">http://freeonlinesurveys.com/rendersurvey.asp?sid=zyr6ib8ef4fbf6f604182</a></p>
    <p>thanks</p>
