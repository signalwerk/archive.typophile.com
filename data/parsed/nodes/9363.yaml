  html: <p>I'm looking for the font used for the Chicken Soup for the Soul titling. <br><img src="http://www.typophile.com/forums/messages/83/65814.gif" alt=""> <br>The C is, of course, identical to the C in the Campbell's Soup logo, and I've found that FlashFonts' Casey Classic is pretty close, but not quite the same. <br> <br>Any further guesses?</p>
