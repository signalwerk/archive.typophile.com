    html: <p>WOW! Thank You very much. I did some searching and downloaded it from what-font.co.uk. I do remember that T being "not wanted" and "fixed" as per the boss but I do not remember that name. It certainly would have stood out just like "Belching up Salisbury Steak" which I used to sneak in art files as live text just so some artist or out-putter would have to call me and ask for the font. As it turns out in my searching I came across Jsh Wilhelm and an association with "Spork Thug Typography" on 1001freefonts.com along with a few others. He apparently is very creative with his names and guess what? He is responsible for Belching up salisbury steak! crazy!!!! Thank You very Much!!!</p>
