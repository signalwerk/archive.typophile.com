      <p>Well, after seeing it with letters I must say that it doesn't fit like it should...<br>
      I would say that letters have a nice calligraphic, but a bit rough feeling, and ampersand misses this roughness - for me it looks like you've used "rounder corners" illustrator filter on it:)<br>
      Maybe you should try to make this ampersand's curves more like j's or e's, a bit harsh, not so rounded.<br>
      It's just what I feel, so you can really ignore what I said:)</p>
      <p>By the way, I really, really like this font - good job!<br>
      - Filip Łysyszyn</p>
