    <p>Hi everyone.</p>
    <p>I’m doing some research regarding newspaper design. I was asked to help someone clean up a monthly newspaper about Wine.<br>
    They are currently using Times New Roman for the body text and Futura for titles and so on.</p>
    <p>Can anyone recommend a serif typeface suited for the body text that would also include Romanian diacritics/accents ? As well<br>
    as a sans serif typeface that would work with it ?</p>
    <p>Cheers,<br>
    Vlad</p>
