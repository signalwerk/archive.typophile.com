    date_raw: 11 May 2010 — 3:09pm
    votes: null
    html: |-
      <p>That's partly what I meant, and why I put "authentic" in quote marks.</p>
      <p>But it's a question, really, of anachronism.<br>
      For instance, while National is strongly informed by the 19th century grotesque genre, it contains elements, such as ascenders that protrude above cap height, and "l" with tail, which one would not find in a 19th century sans. However, IMO (and without studying every glyph in great detail), Founders Grotesk is a revival with nothing "out of time".</p>
