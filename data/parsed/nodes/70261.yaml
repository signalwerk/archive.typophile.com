      <p>I don't think Founders Grotesk is too different in sentiment than National, but it is more "authentic".<br>
      I particularly like the way you've stuck with certain idiosyncrasies of the style, such as the small aperture of C, the big lean of the italic, and the roundness of S in the Bold Italic, without attempting to make "improvements"! Those are things I've always admired in 19th century grots, for their unusual quality.</p>
