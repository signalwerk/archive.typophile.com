    html: |-
      <p><cite>I don't think Founders Grotesk is too different in sentiment than National, but it is more "authentic".</cite></p>
      <p>Why does the term “authentic” seem to be the preferred description for grots that get back the the pre-twentieth century? If these types were really authentic they would come with optical sizes, no small caps, limited punctuation, and a few completely botched letters in every font. I don’t think that getting at the roots of the genre is really so much about authenticity as it is about getting away from the twentieth century tendency to iron out every last quirk and take harmony within families to extremes.</p>
    html_clean: |-
