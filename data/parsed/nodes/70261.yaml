    <p>I'd like to draw your attention to my new releases, <a href="http://www.klim.co.nz/tiempos_text_samples.php" rel="nofollow">Tiempos Text</a>, <a href="http://www.klim.co.nz/tiempos_headline_samples.php" rel="nofollow">Tiempos Headline</a> and <a href="http://www.klim.co.nz/founders_samples.php" rel="nofollow">Founders Grotesk</a>. For the first time I've written fairly comprehensive design information, and the new PDF specimens are by my good friend Duncan Forbes from <a href="http://the-international-office.com/" rel="nofollow">The International Office</a>.</p>
    <p>Best regards, Kris.</p>
