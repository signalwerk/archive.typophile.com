    html: <p>Well, some Italian renaissance artists believed that an accurate, geometric construction of letters according to the golden ratio, or divine proportion, was the correct way to go about it. Others like Giovanni Cresci believed that using the naked eye and one's own discretion was better. So there isn't one way in making it “proper”, but I'm sure there are guidelines I don't know about that could help you improve your typeface.</p>
