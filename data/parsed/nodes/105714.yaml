    html: |-
      <p>It is an aesthetic judgement, not something determined by a fixed rule.</p>
      <p>However, you can look at the widths used by other typefaces, particularly ones similar in style to the one you are designing.</p>
      <p>I have a web page at</p>
      <p><a class="freelinking external" href="http://www.quadibloc.com/comp/propint.htm" rel="nofollow">http://www.quadibloc.com/comp/propint.htm</a></p>
      <p>which may be useful, particularly if you are designing a conventional text typeface, in providing some starting points.</p>
