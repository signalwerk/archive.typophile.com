    <p>Hi,</p>
    <p>I've been designing my first typeface for the last few weeks and I run into a question:</p>
    <p><strong>How do you know the proper width for each glyph?</strong></p>
    <p>I'm worrying that, for instance, the width of my "A" is too long compared to other letters. Is there a mathematical way or something like that, other than just the naked eye to figure out the correct proportions?</p>
    <p>I'm mainly having this issue with the Caps.</p>
    <p>Thanks in advance!</p>
  html_clean: |-
    <p>Hi,</p>
    <p>I've been designing my first typeface for the last few weeks and I run into a question:</p>
    <p><strong>How do you know the proper width for each glyph?</strong></p>
    <p>I'm worrying that, for instance, the width of my "A" is too long compared to other letters. Is there a mathematical way or something like that, other than just the naked eye to figure out the correct proportions?</p>
    <p>I'm mainly having this issue with the Caps.</p>
    <p>Thanks in advance!</p>
