    html: <p>I'm back, finally. Between Kai, my 1 yr old, and progressing on some of those projects that pay the bills, I haven't had much time to focus on Creative Squeeze. <br> <br>The following concepts explore the "Q-drop" that was initiated in my last round from the concept where I embarrassingly left out the "U" in SQUEEZE. So I won't be winning any spelling bee's, but hopefully one of these concepts will take me into a direction that is acceptable at all necessary levels. <br> <br>I am personally leaning toward the Clarendon logo, as the "Q" has some fun personality while the logo in its entirety maintains corporate appeal</p>
