  html: <p>After going through the grinder of naming my business Creative Squeeze I am finding that developing one's own identity is extremely difficult. Rather than focusing on the objectives of the design, I am constantly dealing with emotions and opinions. I have hit the sketchbook and funneled with friends to arrive at these two design directions. Typophiles</p>
