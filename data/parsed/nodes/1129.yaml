    html: "<p>To give you an idea of how_much/what_kind of \"literality\" I think might be good: like half a lemon is obviously too much, but a drop shape might be great. Like you're getting the last drop of benefit out of projects. Maybe just a drop shape between \"creative\" and \"squeeze\", with possibly a progressive (but subtle) narrowing of the letters the closer they are to the middle. <br> <br>The one with the wavy bulging/squeezing letters: I think the problem with it is simply that it's too cheesy, too much squeeze ecstasy or something. Plus it looks like a suspension bridge or an audio company. <br> <br>As for the Windows thing: <br>- I don't think it's very pronounced. I didn't see it. <br>- As much as some people (like me) can't stand the beast, most layman actually like MS. But since you're a design outfit (an area of Mac-worship) the MS connotation would indeed be a negative. <br>- Those \"E\"s don't really say much anyway. Or maybe they say tickle, but not squeeze. <br> <br>hhp <br></p>"
