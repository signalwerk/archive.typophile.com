    html: <p>I think it's great. As for the typeface, I agree, in theory, that it's always nice to use custom type as it just makes the logo mark that more unique, but, in this case, it is the '0' that's the mark and is what allows it to stand apart.  <br> <br>I much prefer the bottom colors...brown is such a tough color to pull off. <br> <br>As for the back of the cards, will that be a die-cut? I like the idea, but I'm not sure if I like the exact same drop on both sides. It might be a bit more clever to use a different type of treatment on the back. </p>
