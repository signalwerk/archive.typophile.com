    html: "<p>&gt; 6pt Helvetica <br> <br>I think my tea will shortly be coming out backwards... <br> <br>There's always some type on eBay, but: <br>1) The keywords vary, especially among people who are selling stuff they don't understand. Some people for example use the term \"hot stamping\" to mean lead type.  :-/ <br>2) Be careful of crappy ones. Like there's this guy who sells them heaped in plastic bags... <br> <br>Here's something decent: <br><a href=\"http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;category=46735&amp;item=3849892871&amp;rd=1&amp;ssPageName=WDVW\" target=\"_blank\">http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;category=46735&amp;item=3849892871&amp;rd=1&amp;ssPageName=WDVW</a> <br> <br>Also: besides avoiding Helvetica outright, I would recommend staying away from very small sizes. Not because they're useless, but because they might sap your passion for typesetting. I know I personally hate fidgeting with the really small stuff. <br> <br>hhp</p>"
