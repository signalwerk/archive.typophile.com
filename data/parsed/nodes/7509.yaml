  html: <p>I'm new to typography and I'd really like to get my hands on some metal typefaces play around  and get my hands dirty, I've searched the net and so far all I found was some 6pt Helvetica on e-bay. <br> <br>Does anybody know of anywhere in London that I can buy some faces either 2nd hand or new???</p>
