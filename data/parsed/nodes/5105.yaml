  html: "<p>I'm looking for visual examples of grids and modules for Logos, Icons, Pictograms and Typefaces. <br> <br>My list contains: <br> <br>- Wim Crouwel: Alphabets <br>- Norm: The Things. Norm: SimpleKoelnBonn (<a href=\"http://www.lineto.com\" target=\"_blank\">www.lineto.com</a> &gt; The Designers &gt; Norm &gt; Simple-Airport &gt; Specimen &gt; Page 2) <br>- <a href=\"http://briem.ismennt.is/2/2.3.4a/2.3.4.02.grid.htm\" target=\"_blank\">http://briem.ismennt.is/2/2.3.4a/2.3.4.02.grid.htm</a> <br> <br>Do you know more? <br> <br> <br>(Wasn't there a picture of the transit font's bell with grid somewhere?)</p>"
