  html: |-
    <p>This time, I took the inspiration mostly from the Greek epigraphic style. I wanted to see what could be done with only straight sides and sharp angles.</p>
    <p>It looks to me like a definite improvement in visibility, but it feels hard on the eyes and reading is slower than with a typical text face.</p>
    <p>This leads me to wonder, are more rounded forms needed for better reading speed? Is all-sharp-angles unworkable? There are scripts that just don't have curves. I need ideas on how to approach those cases.</p>
    <p><img src="http://img197.imageshack.us/img197/1879/sawtooth.png"></p>
