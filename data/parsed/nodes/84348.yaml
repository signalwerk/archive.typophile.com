      <p>I know of no such study that looks at the influence of rounded versus angular letterforms on reading speed. A literature review should provide you with more than enough material to develop an experimental design to answer your research question.</p>
      <p>If this is an academic project I would advise you ask your faculty to point you in the direction of someone in the psychology department of your school or a related one if you don’t have a psychology program. An experimental (as opposed to clinical) psychologist with experience in the cognition would be a good place to start. If they do not have experience with reading, they could most likely point you in the right direction as has been my experience.</p>
      <p>Additionally, people in the references department/help desk of a local university library would be more than willing to show you how to do use the databases. I recommend PsychInfo or Web of Science.</p>
      <p>There may be a few articles of interest in the literature section of my “web site.”</p>
      <p><a href="http://readthetype.com/literature/" title="http://readthetype.com/literature/">http://readthetype.com/literature/</a></p>
