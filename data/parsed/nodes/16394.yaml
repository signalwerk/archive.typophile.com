      <p>&gt; I am looking for some really diverse sans serif fonts (extra light, light, condensed, roman, bold, caps etc…) that are legible at small sizes on the screen (7-9 points). </p>
      <p>This is hard (some would say impossible) - unless you have ClearType (or one of its clones) activated the best you can do with bi-level rendering is have one or two pixel stems which means a maximum of two weights.</p>
