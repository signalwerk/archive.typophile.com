  html: |-
    <p>I have a corporate client whose font is Calibri.<br>
    This was chosen because the majority of their communication is on-screen and also because they like to generate their own documents from word (god help me).</p>
    <p>They have now come to me with a book design project and have expressed a desire to use Calibri throughout.</p>
    <p>Any opinions regarding this will be appreciated.</p>
    <p>Thanks for your time.</p>
