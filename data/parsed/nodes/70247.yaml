    date_raw: 9 May 2010 — 8:24pm
    votes: null
    html: "<p>Yes, it depends what sort of book, and also what kind of layout. If the design is more like a magazine or an annual report, then Calibri is a possibility: give plenty of leading and set text in columns. If they layout is more like a traditional book, then use a serif face for text and limit Calibri to headers.</p>"
