  html: "<p>I have an issue... Bitstream Vera is too tall. I have a bitmap version of Bitstream Vera Mono I use for programming, but if I mix in Bitstream Vera (to make it easier to read comments in the source code) then my editor increases the line spacing by one pixel (I assume it uses the tallest of all the fonts it is going to use) and I lose 5 lines of code per screen. <br> <br>All I have available to edit the font is Softy, but I'm not sure if that is sufficient because it isn't clear to me what is causing it to be one pixel taller. How can I make it shorter? If I can't do it with Softy, would someone be willing to do it for me? If so, please rename the font to \"Lava\" (per the Vera license the name must change). You can find the font here: <br> <br><a href=\"http://www.n4te.com/temp/Vera.ttf\" target=\"_blank\">http://www.n4te.com/temp/Vera.ttf</a> <br> <br>TIA! <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
