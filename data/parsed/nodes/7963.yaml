    html: <p>You need to take a look at the vertical metrics values in the font OS/2 and hhea tables. See <a href="http://www.typophile.com/forums/messages/4101/53053.html?1100009406">this thread</a> for a detailed explanation of how these values should be set. You can probably figure out by how much to reduce the ascender values in order to give Vera the same linespacing as the bitmap font.</p>
