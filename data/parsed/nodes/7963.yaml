    html: <p>Thanks Tiffany. <br> <br>I should mention that the characters in Vera at 9pt are the same height as my 9pt bitmap version of Vera Mono. Well, all the characters I looked at atleast. Maybe there are a few characters that are slightly taller and are causing the extra pixel? That is all I can think of, or maybe there is some setting in the font header for this.</p>
