    html: |-
      <p>You may want to learn a bit more about type design. For example, the idea that in order to *look* monoline, the horizontal strokes need to be thinner than the vertical strokes. I'm guessing that you have made them the same thickness, which makes the horizontals look slightly heavier than the verticals.</p>
      <p>There are some other minor suggestions I'd make, but in any case I agree that those styles are not as well suited to the project, anyway.</p>
      <p>Cheers,</p>
      <p>T</p>
