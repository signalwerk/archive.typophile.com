      <p>Your logomark looks impressive. I definitely get the tribal feeling. Besides you can easily transform the abstract symbol into information design for instance to classify wide range of things, wayfinding design and galleries. I also think the simple elegance of Verlag doesn't steal the lead role from the identity design.</p>
      <p>It is a nice idea to experiment custom typefaces to match – a unique touch in my opinion. But I think your proposal takes me to the wrong eras: Constructivism, De Stijl, Sci-fi. Nowhere near tribal and earthy tones of the African culture.</p>
