  html: |-
    <p>Hi everyone,</p>
    <p>This is a class project: an identity for the Museum for African Art. I'm wondering if adding a custom typeface to the project will complicate it with too many elements.</p>
    <p>Below are rough sketches:</p>
    <p>(A) My original logo concept: symbol with wordmark (in Verlag). Verlag is used throughout the identity as a display and text face. </p>
    <p>(B) Symbol with wordmark in a custom typeface (I haven't built out the entire font however). I like how strong the type looks when big and overlaid on an image, but does it clash/fight for attention with the symbol? </p>
    <p>My gut says the symbol and custom face are both viable options, but maybe not when used together. </p>
    <p>I've been wrestling with this for a while.<br>
    Thanks so much for your feedback!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/MAA_A_4277.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/MAA_B_4924.jpg"></div><p></p>
