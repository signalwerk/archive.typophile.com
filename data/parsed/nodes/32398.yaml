      <p>First of all I'd say that Blur is a display typeface. Display typefaces tend to follow trends and fashion and may be contemporary in their time but grow old fast.<br>
      Brody initiated the Fuse series of experimental typefaces around the same time as Blur came out. That would be the other category I'd think of. Fuse was a platform for type designers to question the relation between form and funcion of type and to experiment with what type could communicate other than the text it displayed.</p>
