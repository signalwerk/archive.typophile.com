      <p>I wouldn't call Blur contemporary.<br>
      The Blur typeface was released in the early days of digital type, pre-internet. What, 15 years ago? Type culture was hugely different then.</p>
      <p>Blur derives from photographic processes NB used for making type in the early 1980s, in Face magazine. Remember, he was traditionally educated/trained at the London College of Prining. I could be wrong, but I believe the technique involved making a negative-film-to-positive-paper contact print -- but with a layer of clear acetate between -- which will throw the image out of focus. Interestingly, Photoshop filters can produce a similar effect. But I don't know what technique he used to make the digital outlines of the FontFonts.</p>
