    html: <p>Blur was published in 1994 and EVERYBODY used it to look up to date like with the earlier typefaces Brody did. It wore out pretty fast. I can't remember anything remarkable using that typeface other than Brody's posters. Any logo with a wordmark set in Blur would have said "Blur" instead of what it was supposed to say. I consider Blur more to be an idea published as a typeface than a typeface being designed to serve a certain purpose. This would probably describe Brody's philosophy as well. Look at amazon for "The Graphic Language of Neville Brody 2". The title uses Blur.</p>
