    html: |-
      <p>Like Blur being a blurred Helvetica (or similar)?<br>
      Why?<br>
      Well, we are talking experimental typography here.<br>
      Experiments are done to see what happens (if I do this or that) and to come to unexpected results. It's about breaking rules and overcoming tradition.<br>
      In the case of Blur Brody wanted the look of the typeface to show the process of its technical production (like woodcut type does). The typeface was supposed to have a human touch this way. It says all this in the book. As I said, there's an idea behind the whole thing. There has been a lot of experimenting with type back then - like combining Futura and Bodoni in a font called Fudoni for example. It's tweaking known typefaces but with a different idea.</p>
