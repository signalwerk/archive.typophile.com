      <p><em>Subscribe via iTunes or any other podcast receiver that you’re using and you get all updates automatically.</em></p>
      <p>Or crack open the XML files and find the direct references to the MP3 files:</p>
      <p><a href="http://www.myfonts.com/media/typecast/vitrasans.mp3" title="http://www.myfonts.com/media/typecast/vitrasans.mp3">http://www.myfonts.com/media/typecast/vitrasans.mp3</a><br>
      <a href="http://www.myfonts.com/media/typecast/singapur.mp3" title="http://www.myfonts.com/media/typecast/singapur.mp3">http://www.myfonts.com/media/typecast/singapur.mp3</a><br>
      <a href="http://www.myfonts.com/media/typecast/cagesilence.mp3" title="http://www.myfonts.com/media/typecast/cagesilence.mp3">http://www.myfonts.com/media/typecast/cagesilence.mp3</a><br>
      <a href="http://www.myfonts.com/media/typecast/stranger.mp3" title="http://www.myfonts.com/media/typecast/stranger.mp3">http://www.myfonts.com/media/typecast/stranger.mp3</a></p>
      <p>By the way, the estate of John Cage has been <a href="http://archives.cnn.com/2002/SHOWBIZ/Music/09/23/uk.silence/" rel="nofollow">very strict</a> about even partial performances or recordings of 4′33″. I wouldn't like to see MyFonts sued for plagiarism of silence, although it would make for great publicity.</p>
      <p>A friend of mine had a Chicago college radio show in the early 1990s, and devoted an entire show to playing and commenting on different recordings of 4′33″. Very, very funny. 'Ah, now this version is my favourite....'</p>
