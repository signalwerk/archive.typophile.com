      <p>I agree that the small caps potentially add a lot of value. </p>
      <p>There are some potential misreadings of letters but of course they mostly come from the blackletter tradition, so within that mode they might not register as problematic. I'm thinking of the /r/ and especially /c/ reading as an /e/, /X/ as /H/, perhaps /A/ as /U/.</p>
      <p>Second (empty) counter of /W/ looks awkward to my eye. /Y/ seems too wide. /z/ still feels mechanical.</p>
