      <p>Good call on the {d}. I stretched out the ascender a bit more into the diagonal, and it does look more handsome now. I had to make a somewhat more reserved contextual alternate to avoid collisions with {f ſ}, but that's no problem; I have a bunch of such alternates already in place for other letters.</p>
      <p><img src="/sites/default/files/old-images/d_3893.png"></p>
      <p>As for the SC {z}, I'm rather fond of the shape, and couldn't bring myself to move it from its default position. However, since an experiment with a flat-bottomed lunate {z} shape failed, I made a stylistic alternate in the shape of a Roman {Z}:</p>
      <p><img src="/sites/default/files/old-images/z_4508.sc.png"></p>
      <p>Oh, and this is what I made of the {W} problem...  still not exactly elegant, but better, IMHO (new version to the right):</p>
      <p><img src="/sites/default/files/old-images/W_4231.png"></p>
      <p>Thanks for the help!</p>
