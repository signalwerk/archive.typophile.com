      <p>Thanks for the quick feedback! If you guys really think the small caps are worth it, I think I should spend some more time evening out the color and relaxing some of the awkward shapes (like the too-narrow {R} or the too-wide {E}).</p>
      <p>@ R: I'm also not really an expert, but from what I've seen, most blackletters (especially Texturas, which I guess this qualifies as) tend to be very heavy.  Brilliance feels light and airy to me in comparison. In fact, I had been practicing some more traditional blackletter with my 3.8 mm and 2.4 mm Pilot Parallel Pens, and I discovered this particular style when I used the 2.4 to write at the glyph size at which I'd been writing with the 3.8 before.  I also like the texture that the caps create when several of them appear close together.  </p>
      <p>@ Craig: I can see the ambiguities you mention, but I agree that they're part of blackletter tradition, so I think I can get away with them. At least I'm not using the Fraktur {k}...  Good point about {W}. It just feels awkward to me, but I haven't found a better architecture for it so far. I can easily make {Y} narrower, too. Not sure how to make {z} more natural, though. Maybe I should return to the curved descender loop I originally had? I think I replaced it with the angular loop so it would fit in better with the other descenders.</p>
