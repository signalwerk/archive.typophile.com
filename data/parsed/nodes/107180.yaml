    <p>Hey all,</p>
    <p>here's something I came up with while doodling with the Pilot Parallel Pen my girlfriend got me for my birthday. So far, I had prided myself on being a "digital native" as far as font design was concerned, finding it easier to play around with Béziers than with pen strokes. For this particular style, though, I found the natural constraints of broad-nib writing very helpful in quickly trying out different shapes and converging on a solution in an intuitive way.</p>
    <p>The font is, of course, drawn entirely in Glyphs, and is much more regular than anything I could muster by hand. Still, I've made sure to soften the straight strokes a bit so as to avoid an overly mechanical look. The exuberant caps are inspired by Spencerian script.</p>
    <p><img src="/sites/default/files/old-images/Brilliance_5033.png"></p>
    <p>Cheers</p>
