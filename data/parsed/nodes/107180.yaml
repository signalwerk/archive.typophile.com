      <p>Maybe adjust the ascender of /d/ so it doesn't come over to the left side so quickly at the mean line. Your /d/s wind up looking like /b/s.<br>
      Your small-cap /Z/ is a structure that looks like it should descend--seems a little odd sitting on the baseline. Maybe a form with a bottom like the small-cap /L/ would be worth trying.</p>
