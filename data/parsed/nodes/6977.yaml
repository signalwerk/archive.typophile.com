    html: "<p>Hi Christopher, <br> <br>this is not a bad start at all. <br> <br>Some first impressions and quick ideas: <br> <br>Where crossbars meet a stem (and anywhere else where two \"pen strokes\" come together under a sharp angle), ink traps are often a good feature to add in order to make a too heavy or \"black\" portion of a character optically lighter (if you don't know what an ink trap is, Google will easily find you an explanation). <br> <br>In your typeface, this mainly, but not exclusively, concerns the A and H. <br> <br>Compare, for instance, the A to the O. The A looks a tad heavier than the O, although stroke widths may be the same. This could be (at least partially) corrected by adding an ink trap in the appropriate place. <br> <br>Possibly the O Q D G bowls could use a tiny bit more weight. <br> <br>You surely are aware that, especially in typography, geometrical symmetry and measurements rarely equal optical symmetry and measurement and only the visual appearance of a character is of interest to the typographer. <br> <br>The bowls of you B, for instance, have the same dimensions, but the upper bowl appears to be both too high and long, disequilibrating the characters appearance. The B is top heavy and slightly tends to tip over to the right. <br> <br>The upper arm of your K seems to reach out a bit too far to the right. <br> <br>If you decide to retouch it anyway, you'd be able to judge more easily if the K should really be wider than the R with which it shares the \"lower limbs\". <br> <br>The horizontal symmetry in the D and C works uncommonly well in this typeface. <br> <br>The D's belly (which seems to be an exact copy of the C O Q bowl) looks almost a bit too pointy to me. <br> <br>About the same applies to the top/right heavy S. <br> <br>Besides that, the S lacks the typical features of the typeface and doesn't fit in very well. Look at your C and copy these spurs to the S. <br> <br>Round letters (C G O Q S in your typeface) tend to look too small when designed exactly as tall as the rest of the alphabet. The reason for this is, simply put, that a circle touches a tangent only in an infinitely small spot which has an effect on how tall we see a character. To compensate for this, the O, for instance, is often designed to reach over the lower and upper character grid line. <br> <br>The same is often true for pointed letters like A V W, where also few \"optical mass\" is near the lower or upper grid line. This does not apply to your typeface, though, since it features extended flat apices. <br> <br>I think the upper bar of the F and the T bar are a bit short. <br> <br>The Q tail shows a clearly more open and fluent and \"forward\" character than the nice sturdy legs of the R and K and I'm not sure whether that fits well together. Maybe try something like the R/K leg as the Q tail. <br> <br>I don't think that the O and P look bad next to each other. <br> <br>If you decide to keep the Art Nouveau touch and the quite special E F H, you might want to try to copy the A crossbar to the B (and R and even K and P). <br> <br>More could be said, but I leave that to others. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Keep working on that typeface. <br> <br>See you <br>jpg <br> <br>PS: Maybe show us a small passage of text set in your typeface. I find it easier to judge a font in real use.</p>"
