  html: <p>Hello people, I have just begun a course called "Digital Type" where I study. I have begun to create a typeface originally designed around the form of the numeral "2". This typeface has been created from scratch in three days, and I THINK it is going well, but I would deeply appreciate any critique you can give me. <br> <br>It was initially quite neoteric, a hard sans-serif. The spine (?) of the 2 reminded me of an art-nouveau style and I pursued that for a while. I became unsatisfied with its legibility and removed some elements of this "art nouveau" styling. I added some serifs and this is where I guess it is heading. It has all been very intuitive and based on a poor base-knowledge of typeface design. <br> <br>I intend to change the proportions of the O; next to the P it obviously doesn't work. I guess the art nouveau style will eventually completely dissapear in favour of legibility and unity. the perfect-circle O was inspired by art nouveau, but I have no particular reason to keep the style; it was just a stepping stone. <br> <br>Sorry for my post length. <br> <br>Shoot it to bits and i'll glue it back together in a better way.<img src="http://www.typophile.com/forums/messages/29/50399.jpg" alt=""></p>
  html_clean: <p>Hello people, I have just begun a course called "Digital Type" where I study. I have begun to create a typeface originally designed around the form of the numeral "2". This typeface has been created from scratch in three days, and I THINK it is going well, but I would deeply appreciate any critique you can give me. <br> <br>It was initially quite neoteric, a hard sans-serif. The spine (?) of the 2 reminded me of an art-nouveau style and I pursued that for a while. I became unsatisfied with its legibility and removed some elements of this "art nouveau" styling. I added some serifs and this is where I guess it is heading. It has all been very intuitive and based on a poor base-knowledge of typeface design. <br> <br>I intend to change the proportions of the O; next to the P it obviously doesn't work. I guess the art nouveau style will eventually completely dissapear in favour of legibility and unity. the perfect-circle O was inspired by art nouveau, but I have no particular reason to keep the style; it was just a stepping stone. <br> <br>Sorry for my post length. <br> <br>Shoot it to bits and i'll glue it back together in a better way.<img src="http://www.typophile.com/forums/messages/29/50399.jpg" alt=""></p>
