ok too small when designed exactly as tall as the rest of the alphabet. The reason for this is, simply put, that a circle touches a tangent only in an infinitely small spot which has an effect on how tall we see a character. To compensate for this, the O, for instance, is often designed to reach over the lower and upper character grid line. <br> <br>The same is often true for pointed letters like A V W, where also few \"optical mass\" is near the lower or upper grid line. This does not apply to your typeface, though, since it features extended flat apices. <br> <br>I think the upper bar of the F and the T bar are a bit short. <br> <br>The Q tail shows a clearly more open and fluent and \"forward\" character than the nice sturdy legs of the R and K and I'm not sure whether that fits well together. Maybe try something like the R/K leg as the Q tail. <br> <br>I don't think that the O and P look bad next to each other. <br> <br>If you decide to keep the Art Nouveau touch and the quite special E F H, you might want to try to copy the A crossbar to the B (and R and even K and P). <br> <br>More could be said, but I leave that to others. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Keep working on that typeface. <br> <br>See you <br>jpg <br> <br>PS: Maybe show us a small passage of text set in your typeface. I find it easier to judge a font in real use.</p>"
