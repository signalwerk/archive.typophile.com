    html: <p>&lt;font class="dontLookLikeCrap"&gt;jpg, <br> <br>Thanks heaps for the critique! The S is a particularly problematic glyph for the inexperienced. I should have mentioned that I have not yet made optical adjustments; I am trying to establish the base structure of the typeface. The R, B, K, and P used to use the curve crossbar form in their arms, legs and er... other limbs. However, all the curves everywhere created a wierd wobbly visual pathway. It was just for legibilitiy reasons I removed them. <br> <br>That being said, I do believe it will become a display face as I have no time to produce a lower-case. Therefore, I think it is important n hindsight to retain those parts that give it it's character. <br> <br>Sorry about the image width, that really was clumsy of me. I have seen a really great shockwave viewer somebody used for their typeface, and will probably create something similar with zooming and panning features... I'll definitely explore PDF as well. <br> <br>Thanks twice for the help; I think I am the only student here really pursuing the creation of typefaces, and you probably know how tutors have little time out of class. <br> <br>Well, I have alot of work to do now! <br> <br>- Chris&lt;/font&gt;</p>
