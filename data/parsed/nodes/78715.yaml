    html: <p>Did you do the type design course at Reading as they use the word adhesion for testing?. I'm guessing you know about the adhesion text site where you could generate some copy based on those 8 characters. Until you set some text the real problems won't show up. As Pablo said the  a. e, and s, have nice sharp angles while the rest need somthing to echo that. Have you tried having a right foot serif same as "a" on "d" "h" "i" "o" and "n" KEEP GOING</p>
