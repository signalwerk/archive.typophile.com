      <p>I think it will be difficult to find someone who has Dorian. DTL license holders are rare, and Dorian isn’t often discussed (nor purchased, I assume).</p>
      <p><a href="/wiki/Elmo%252Bvan%252BSlingerland" class="wiki-create">Elmo van Slingerland</a> may be the best type designer name of all time.</p>
      <p>You might also dig <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_quadraat_ot/">FF Quadraat</a>, which has a similar Dutch pedigree but is perhaps less delicate.</p>
