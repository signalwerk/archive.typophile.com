      <p>I think Budapest and the date are two different typefaces.</p>
      <p>Budapest appears to be DIN Neuzeit Grotesk:<br>
      <a href="http://www.myfonts.com/fonts/linotype/din-neuzeit-grotesk/" title="http://www.myfonts.com/fonts/linotype/din-neuzeit-grotesk/">http://www.myfonts.com/fonts/linotype/din-neuzeit-grotesk/</a></p>
      <p>The date is too small for a positive ID, but it looks like Gill Sans:<br>
      <a href="http://www.myfonts.com/fonts/mti/gill-sans/" title="http://www.myfonts.com/fonts/mti/gill-sans/">http://www.myfonts.com/fonts/mti/gill-sans/</a></p>
