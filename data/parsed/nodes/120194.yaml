      <p>Stephen, this is a feature we lost when the new type ID board was created :(<br>
      I followed the links in your earlier post and confirmed my impression that the digitization of Jackson MN is of poor quality compared to the original.<br>
      Here are a few letters from the pre-digital era</p><div class="imageWrap"><img src="http://typophile.com/files/EgittoRipotecaItalianaExcerpt_4021.jpg"></div><br>
      The best quality image was from the Ripoteca Italiana version, so I used it for this excerpt. The Mecanorma dry transfer sheet looks the same.<br>
      Here are a few letters from the digital Jackson MN<br>
      <div class="imageWrap"><img src="http://typophile.com/files/JacksonMN_FO__6098.jpg"></div><br>
      Not only are the outlines sloppy, but height of the letters varies  noticiably.<br>
      Don<p></p>
