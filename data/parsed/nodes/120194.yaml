    html: |-
      <p>Good find Mike. All I can find out about this font is that it was by Bernard Jaquet, presumably a French or Swiss designer, and it was first used by the French  dry-transfer lettering company, Mecanorma in 1971. [Source Identifont <a href="http://www.identifont.com/show?1CG" title="http://www.identifont.com/show?1CG">http://www.identifont.com/show?1CG</a> and <a href="http://www.identifont.com/show?273K" title="http://www.identifont.com/show?273K">http://www.identifont.com/show?273K</a> ]<br>
      Do we know anything more?<br>
      Don</p>
    html_clean: |-
