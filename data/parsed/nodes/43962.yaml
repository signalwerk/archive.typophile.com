    <p>Just read about, and eagerly downloaded fontXchange.<br>
    Been looking for a good way to port my fonts to opentype. (still waiting for fontographer to be updated with this feature:-)</p>
    <p>Well, before I buy and get going converting my fonts, has anyone here used fontxchange?</p>
    <p>Cheers</p>
    <p>Hans g</p>
