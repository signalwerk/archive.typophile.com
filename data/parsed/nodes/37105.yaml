      <p>I may be mistaken, but I thought we had a policy of not getting involved in IDing type from 'official document' serial numbers, or currency. We did not want to accidentally help with document forgery, if we could avoid it. I'm not saying that's your purpose, but I think we should be careful about making it easy to copy government documents.</p>
      <p>- Mike Yanega</p>
