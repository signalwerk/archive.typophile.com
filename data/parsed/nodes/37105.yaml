  - id: 227362
    user: 110
    date: 2007-09-16T02:04:00
    date_raw: 16 Sep 2007 — 2:04am
    votes: null
    html: <p>You're right Mike, but we take these on a case by case basis. In this instance it is (a) quite hard to forge a license plate due to the manufacturing process involved and (b) letters and numbers on license plates have nothing in common with typefaces or fonts as we know them. For more information please read my article on license plate fonts on <a href="http://www.fontshop.be/details.php?entry=57" rel="nofollow">Unzipped</a>, my blog.</p>
