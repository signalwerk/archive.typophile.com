    <p>Hi, I'm looking for a similar font to the one used on swedish tax registration marks (or whatever they are called) to print the registration number. I included some sample photos. It will be used very small so I don't feel like doing a custom font, something in the same vein will do.</p>
    <p>Thanks in advance.</p>
