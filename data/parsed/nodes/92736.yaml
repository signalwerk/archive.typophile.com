    <p>The Type Directors Club and Monotype Imaging, proudly announce, from June 1st to June 6th, the Type Masters Week 2012. The Type Directors Club and Monotype Imaging will be offering the unique opportunity for you to participate of these workshops with the Masters; Gail Anderson, Henrik Kubel, Bas Jacobs (Underware) and David Berlow.<br>
    <a href="http://www.tdc.org/" title="http://www.tdc.org/">http://www.tdc.org/</a></p>
