    <p>I'm designing an annual research report into wealth generation and thinking for a premium estate agency. I specified Hoefler and Freres Landmark because of it heritage (New York building signage circa 1950). Just wondered if anyone could suggest anything similar? </p>
    <p>Also I need a body copy font to pair with it - currently using Swift but can anyone suggest something else? It's targeted towards high net worth individuals and is reporting on how, where and on what they spend their wealth (millions) and is used for marketing the high end property practice.</p>
    <p><a href="http://www.typography.com/fonts/font_overview.php?productLineID=100044" title="http://www.typography.com/fonts/font_overview.php?productLineID=100044">http://www.typography.com/fonts/font_overview.php?productLineID=100044</a></p>
