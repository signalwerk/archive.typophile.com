    html: |-
      <p>Darrenn, a type in the same vein of Landmark - but with a wider range of styles, glyphs, weights - could be Neutraface, which could also work as body copy:</p>
      <p><a href="http://www.houseind.com/fonts/neutraface" title="http://www.houseind.com/fonts/neutraface">http://www.houseind.com/fonts/neutraface</a></p>
      <p>By the way, House Ind. also licenses a family named "Luxury"...</p>
      <p>As for the body copy, if you're after a serif, you could try to keep a link to the modernist cultural heritage of the XX century by using something related to Century - like FB's Bureau Roman or Benton Modern, both available on request:</p>
      <p><a href="http://www.fontbureau.com/fonts/serif/BureauRoman/" title="http://www.fontbureau.com/fonts/serif/BureauRoman/">http://www.fontbureau.com/fonts/serif/BureauRoman/</a></p>
      <p><a href="http://www.fontbureau.com/fonts/BentonModern/" title="http://www.fontbureau.com/fonts/BentonModern/">http://www.fontbureau.com/fonts/BentonModern/</a></p>
      <p>... if those don't look too "traditional".</p>
      <p>A couple of more "contemporary" alternatives:</p>
      <p>- Matthew Carter's Fenway;<br>
      - Christian Schwartz's Publico Text.</p>
      <p>Hope this helps.</p>
