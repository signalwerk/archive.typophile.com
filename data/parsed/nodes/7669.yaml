    html: <p>thank you for the response, David! <br> <br>Yves, I do apologise for obviously posting a font that has already been discussed in-depth on typophile. In fact, before posting I searched the archives with all kind of different terms ("3G", "hutchinson", "3 mobile", etc.) but to no avail.  <br> <br>Once I got the name, Verona, it was very easy to trace it down. <br> <br>Thanks and have a nice day!</p>
