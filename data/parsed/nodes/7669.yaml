    html: "<p>A custom, corporate typeface, named '<a href=\"http://www.typophile.com/forums/messages/29/870.html\" target=\"_blank\">Verona</a>', by Miles Newlyn.. <br><i>As seen on Typophile..</i> <br> <br><i>( Edit.: For rather similar, publicy available, alternate typefaces, refer to '<a href=\"http://www.myfonts.com/fonts/linotype/melior/\" target=\"_blank\">Melior</a>' and '<a href=\"http://www.myfonts.com/fonts/linotype/renault/\" target=\"_blank\">Renault</a>'.. )</i></p>"
