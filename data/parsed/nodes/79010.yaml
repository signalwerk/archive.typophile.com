    html: |-
      <p>Make it project-based. </p>
      <p>Change minor requirements a few times in the middle of each project. </p>
      <p>Include a round of feedback where changes are required without any rational reasoning.</p>
      <p>Start each project with a brief. Have the students right a de-brief after hearing about the context of the project.</p>
      <p>Have them present their concept BEFORE they begin designing. </p>
      <p>Attach a grade to their professionalism during the process.</p>
      <p>Have them report their time as they work and include it with project documentation. Give them a budget (of time) to stay within. </p>
      <p>Every project should be presented formally, in person, with a slide-based presentation.</p>
      <p>Attach a grade to how well they matched their original concept and target audience. </p>
      <p>Teach them to edit a portfolio to only their best work.</p>
      <p>If you can manage to do that, regardless of the technical details of the program, they will come out expecting real life, rather than lab-conditions.</p>
