    html: <p>I would lighten the weight of the top of the swoosh/join. The best ligatures of this type I have seen make the connection but do it in a light almost self effacing way. I might reduce the weight of the h's top serif as well because the weight of it is exagerated now that the connection is there. Or you could bring the arc into the h from higher up. There are many many ways of going from where you are but I think it's a fine start. I would try all this in pencil quickly rather than mucking about on screen. But I would try at least 4 or 5 different modifications.</p>
