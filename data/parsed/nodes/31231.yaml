      <p>Yes that's right. The word I'm working with is 'Acushla' (pronounced A-koosh-la), and my line of thought is that the sh ligature is a good way to finish off the second syllable 'koosh' and draws attention to the pleasant sounding 'sh'.</p>
      <p>I've tried a few more options (below) (number 1 is the same as the previous post, allowing you to see how it's developed) which gradually seem to gain more of a higher, rounder loop, ending in number 5 where I've slightly altered the end of the 's' by curving that sharp corner (don't know if typographiclly speaking, that's an acceptable thing to do?)</p>
      <p>Let me know your thoughts :)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/sh_options_4249.jpg"></div><p></p>
