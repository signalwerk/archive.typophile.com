    <p>Hello everybody,</p>
    <p>It's been quiet around Sensato for a while, but here it is again. Capitals have always been my weakest point, so I guess there is much to improve on. I decided to step away from the caps in Sensato A (the text/low-contrast variant) with the caps, so once I'm satisfied with these I'll adjust the caps in Sensato A accordingly. All feedback is much appreciated and will be carefully considered. </p>
    <p>Cheers,<br>
    Jasper de Waard</p>
