    html: |-
      <p>When I visualise drawing these with a broadnibbed pen (which fits the type of font you aim for) there are some glyphs and parts of glyphs that stand out as being ‘wrong’, eg:<br>
      the tail of \R\, the descending part of \y\, the terminals of \K\ and \k\ which differ too much from \A\, the top left of \N\ which is way too blotchy.</p>
      <p>Also the vertical ricght of \G\ isn’t wide enough.<br>
      The angle of the left part of \Y\ is too steep.<br>
      You may want too take a closer look at \W\ and esp. \w\ because the relation between the two ‘valleys’ is off.</p>
      <p>Don’t try to emulate Optima — I like the super-ellipsis-ish tension caused by the ‘bulging’ verticals. Maybe you should accentuate that and use it more.</p>
      <p>BTW. Are you using your May-vacation to work on this? The sun is shining!</p>
