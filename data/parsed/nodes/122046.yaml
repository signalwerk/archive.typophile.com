      <div class="comment-spam-body"><p>The closest to Face Photosetting's Stack is the font by Bright Ideas called Staxx, which was found by Ryuk.<br>
      Like Stack, Staxx has three layers, a shaded effect, and sharp corners. Stroke thickness and spacing between stacks are similar. Letter-forms for the capital letters are generally similar but the numbers are quite different. Major differences in the capital letters include  the lack of a spur on _G_, angled instead of horizontal terminals on _S_, the curved stroke and terminal angles on _C_ and _G_, and the bottom stroke on _J_.<br>
      Comparison was made to the Stack specimen in my Letraset Product Manual. See the scan I posted in <a href="http://typophile.com/node/107360" title="http://typophile.com/node/107360">http://typophile.com/node/107360</a><br>
      Unfortunately, Staxx is unusable for commercial purposes because it is an orphan font by a defunct company, and there does not seem to be any legal owner of the intellectual property in its digital fonts.<br>
      Don</p>
      </div>
