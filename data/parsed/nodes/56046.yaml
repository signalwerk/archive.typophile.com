    html: |-
      <p>That last sample makes a stronger case that this is a font, and I really think it looks like many of Rob Leuschke’s works. If so, it must be something that he does not sell through MyFonts. I just checked <a class="freelinking-external" href="http://www.typesetit.com/enter.html">his own site</a> and didn’t see this either, so it’s a mystery to me. He may have drawn a custom font for the stationer where you saw these samples.</p>
      <p>You could write to him and ask. I’ve done this before and he responded.</p>
      <p>- Mike Yanega</p>
