    html: |-
      <p>I think Raymond (microspective) is right that it’s probably handlettered. What would prove otherwise is to see more lettering in the same style, where we can see repeats of the same letters.</p>
      <p>If you are looking for commercial alternatives, you might check out the scripts of <a class="freelinking-external" href="http://new.myfonts.com/search/leuschke/">Rob Leuschke</a> (at MyFonts), or the work of <a class="freelinking-external" href="http://www.veer.com/search/results.aspx?keyword=Alejandro%20Paul&amp;producttype=TYP&amp;resulttab=vr&amp;category=Type">Alejandro Paul at Veer</a>, or Sudtipos.</p>
      <p>- Mike Yanega</p>
