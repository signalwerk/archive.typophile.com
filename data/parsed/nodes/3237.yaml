  html: "<p> Helvetica spawn? <br>I've always enjoyed -ica named typefaces. Anyone else? I thought we'd build an -ica repository, our little gift of typographica for type designers who can't think of a proper name. The names would be donated so if you have killer -ica names you want to keep, don't post them here. <br> <br>:: so post some -ica names already in existence. <br>helvetica <br>poetica <br>syncratica (Ole) <br> <br>:: or some based on -ic words. <br>cryptica <br>gothica <br>graphica <br>neurotica <br>generica <br>synthetica <br>eccentrica <br>statica <br>plastica <br>simplistica <br> <br>:: or some that are musica-related <br>elastica <br>plasmatica <br>popmusica <br>harmonica <br> <br> <br>:: or others that are headpoppers <br>typopica <br>dressuppica <br>serifica <br>jetsettica <br>centrifica <br>ponchandjohnica <br> <br>:: or others with hidden meanings <br>ovonica <br> <br>:: or whatever else </p>"
