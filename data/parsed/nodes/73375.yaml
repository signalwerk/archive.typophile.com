      <p>"the free market." Ah, but the free market only exists because of law and its enforcement. The government defines and enforces what is private property, and without that there is no market. In the case of intellectual property, it is the government that authorizes copyright and patent, and enforces contracts (including the EULA), which enables creatives in the digital realm to sell their wares. </p>
