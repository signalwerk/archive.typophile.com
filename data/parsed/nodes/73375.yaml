      <p>@aluminum</p>
      <p><cite>To violate the law by copying a digital file without the IP holder's permission is not, in and of itself, harming the IP holder.</cite></p>
      <p>In US law, that is not true. A copyright holder who registers their copyright is entitled to pursue statutory damages from an infringer, ranging from $750 to $30,000 per work infringed. These statutory damages exist because harm from infringement is presumed.</p>
      <p><cite>Theft, legally, is the taking of someone's physical property. It has nothing to do with copying digital files. This would be in the context of US Law.</cite></p>
      <p>In US law, that is also not true. "Theft" is not limited to physical property. Theft of services, for example, is still theft. Copyright infringement is also theft. See the No Electronic Theft Act of 1997, which expanded criminal prosecutions for copyright infringement.</p>
      <p>Here's an article on "Intellectual Property Theft" published by the US govt:</p>
      <p><a href="http://bjs.ojp.usdoj.gov/index.cfm?ty=pbdetail&amp;iid=998" title="http://bjs.ojp.usdoj.gov/index.cfm?ty=pbdetail&amp;iid=998">http://bjs.ojp.usdoj.gov/index.cfm?ty=pbdetail&amp;iid=998</a></p>
      <p>@William Berkson</p>
      <p>FB settled its suit with NBC in March 2010.</p>
