      <p>@ William Berkson</p>
      <p>Whenever I say free software, I mean free software as <a class="freelinking external" href="http://www.gnu.org/philosophy/free-sw.html" rel="nofollow">defined by the free software movement</a>, so as long as the fonts (or any other software) meet these criteria, I'm fine working on it, whether voluntarily or paid.</p>
      <p>There is no single way to make money from free software, however it usually works like this for me: I start working on some free project for fun, for learning or scratching an itch, then some company would approach me and offer paying me for doing what I was essentially doing for free because they have some specific need and wants me to give it a higher priority. And that is win-win game, for me, for the company and for the community. Some times the money gets from some NGO or other non-profit organisations that wants to support certain developments that fits with there goals, and free software projects are usually better candidates for such organisations. The same, more or less, applies to my work on fonts.</p>
