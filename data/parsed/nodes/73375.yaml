      <p><em>I'm curious to know if they manually put the serial number somewhere in the font file before generating the OTF to send to the customer, or if there's some automated way of doing this.</em></p>
      <p>If I understand the capabilities of TTX correctly...</p>
      <p><a href="http://www.font.org/software/ttx/" title="http://www.font.org/software/ttx/">http://www.font.org/software/ttx/</a></p>
      <p>A program like Access could record the purchaser's information linked to a sequential unique number in a database, place that same number within an XML file, then instruct TTX to generate the OTF font--all entirely automated.</p>
      <p>However, maybe it's time we taught respect for Intellectual Property Rights in our schools. Back in Ye Olden Days, a person who purchased a book might lend it to a friend but, unless that friend had a LOT of time on his or her hands during which they could copy the book by hand, said friend would read the book, then return it to the buyer. If the friend wanted his or her own copy, he or she would have to buy it--or steal it from a local bookstore or library. Kids need to be taught that sharing digital files with friends is not sharing: it's stealing.</p>
