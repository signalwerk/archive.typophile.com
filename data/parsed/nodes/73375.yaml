    html: |-
      <p>Khaled, you are being paid to produce this software, so that's my second category, above. I think that's great. In the font world, as in the rest of software, this is a segment of the market. But I fail to see how that is morally superior to producing a font essentially without knowing whether it will pay you anything, and then having people buy it. </p>
      <p>In either case you are being supported by the market place, either directly or indirectly. Of course the group paying you may be government or a non-profit corporation, but I still don't see why this is morally superior.</p>
      <p>So I would ask: is it immoral for a farmer to invest and produce an apple, and sell it in the market place, for which you need rule of law (the police need to stop thieves from raiding the market)? Is it immoral for a designer to produce a font and sell it in the market place, for which you need IP protection?</p>
      <p>Very few high quality fonts are free in the sense of the free software movement you cite. Most fonts used by computer users are now bundled fonts, which cannot legally be shared with those who don't have a license for the software they are bundled with, such as Microsoft Office or Windows, or one of the Adobe products. So I don't see how you can argue that the 'free software' movement will produce all the fonts that people want. </p>
      <p>In the case of Web Fonts, we right now see this moving forward as a test case. Raf Levien, who frequents Typophile now and then, has been an advocate of the free software movement, and has led Google's effort to put up free web fonts accessible through Google. </p>
      <p>I'm sure that will be a piece of the pie. But also FontFont, Adobe, and FontBureau and Ascender have got on board with web fonts. If history is any guide a lot of those with web sites will find these commercial fonts better for their purposes than the free web fonts that Google is supplying. </p>
      <p>The point is, the market place is not in itself immoral, and helps people.</p>
      <p>I think the anger against it is misguided. Who am I hurting if design a font on my own time, and offer it on the market place, for those who are willing to license it and not share it with others who may also want to buy it? </p>
      <p>They have lots of other options, including free ones. The market place helps develop more and often better options.</p>
