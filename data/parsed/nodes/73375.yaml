      <p>@sebastian_k</p>
      <p>What may have consistently failed to grasp in this discussion is that fonts, not unlike fashion accessories, often have a limited shelf life. Is Comic Sans really such a terrible font? Actually, no: it’s well-done and useful in the proper context. The reason that it is so reviled is that it’s used far too often, and used wrongly, far too often, as well.</p>
      <p>Fonts come into and go out of fashion and, the more often a font is used, the sooner its popularity will wane. The freeloaders who download from file sharing sites aren’t potential sales lost: the cheap bastards won’t pay for anything they’re not forced to. But each time an unbought font is used, it cheapens the font overall. Here, loss of <em>income</em> isn’t the point: loss of <em>value</em> is.</p>
      <p>For example, back in Ye Olden Hippie Days, the folks who began the trend of wearing bellbottoms bought their pants at the Army-Navy store: surplus woolen (real, not Old) Navy bellbottoms with a drop-flap fly fastened by thirteen buttons (note to beer drinkers: not the right apparel choice if you’re planning on hoisting several brews with your buddies). Eventually, niche retailers started offering their versions but, once Sears started selling them, the trend was officially dead.</p>
