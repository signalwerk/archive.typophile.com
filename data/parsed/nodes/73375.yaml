    html: |-
      <p>Interesting discussion here. </p>
      <p>Of course there is the legal side and the moral side.</p>
      <p>The legal side again is in some countries divided in how much an EULA is actually worth. I can tell you for Austria (and Germany) that an EULA is worth nothing if you are not able to have a look at it before you give your consent to a buying contract (=paying). I guess this might be in many EU countries, this is why many "rules" so not apply. </p>
      <p><em>Sidenote</em></p>
      <p>On a sidetone, I am always fascinated how vigorously people try to enforce the idea behind an EULA and think it is a moral rule to comply. It is not, it is a contract, which is only legal if the conditions under it came to happen are making an EULA binding. This might be different for every person who buys software (depending on country, shopping online/offline, which shop/vendor, etc…). If an EULA does not apply, normal law applies. The producer does not establish universally applicable rules or even a moral code with an EULA. Particularly I am fascinated - as Mac owner - how brainless Mac- and iPhone users defend the "right" of Apple to decide how to restrict their systems. (Mac OS only on Macs, Jailbreaking), while the right comes from the law, as the EULA does not apply, nor from Apple. </p>
      <p><em>Back to topic</em></p>
      <p>So the legal side depends if the EULA applies, and if not, how are intellectual property rights are protected by domestic law. </p>
      <p>Sharing among friends and family actually is legal in my country in a limited way, I think. That was called "right for a private copy". But uploading something online in the anonymity of the internet, is not. </p>
      <p>So even if one sticks to the law, legality can be a mixed bag. </p>
      <p>For the morals, I do think that the creators of fonts should be rewarded for every font that is actually commercially used, not only those officially sold. So yes, font users should pay for their licenses. One should not obtain fonts without permission.</p>
      <p>BUT </p>
      <p>There is no stealing involved. The act of using and obtaining a font without permission is not theft to me, it is a breach of market rules and intellectual property rights. The IPRs are not stolen, they are broken. I do agree something that is virtual can't be stolen, only unlawfully duplicated.</p>
      <p>When it comes to the MARKET, there is no market with the exchange of free software. There is value of labor of the community which created all the code. There is a MARKET for services around free software. As well more and more big companies use the previous development for their own software, because the quality is just convincing and the costs for developing something new can be radically reduced. Thanks to the genius GNU license they need to give back their developed code to the public. Free software is winning right now especially in the mobile OS market. </p>
      <p>But when I say there is no market with the exchange of free software, then I mean that there is no market where a piece of free software is being exchanged for a price, which is good. There is anyhow an immense value created by free software, by the services around them, and by the possibilities to develop certain products they open up for other business. </p>
      <p>But similar there is no market for shared fonts as such, as who shares a font does not get anything in return. Font-sharers are actually participating in the normal font market, as they simply do see the price higher than the value of a legal license would create for them. Now of course that does not say anything about the morals of it. Does it hurt the market? I guess it depends. In a market setting where there is one threshold where there are people who buy fonts based on the value a legal license has for them (and the risk an illegal font includes) and there are people who do not buy them, on can only change the ratio between the two fractions by:<br>
      (a) introducing new differentiations at different price marks<br>
      (b) by increasing the quality of the official good (increase language support, Open Type functions, special characters, etc...)<br>
      (c) or by increasing the risk an illegal obtained font poses. </p>
      <p>The first two things are something you guys can do. Thinking about the creation of "amateur versions" I can imagine here it is hard to find the threshold what should be cut, what not, and give it a price tag. Would it make sense? Depends on how big the market is. Depends if those people who are font-sharers would be convinced enough by the price and feature set to reach into their wallets. Here it is hard to say, as some font-sharers maybe will for ideological reasons refuse to pay any kind of price?</p>
      <p>Anyhow what Ray said, which is option (b), makes a shared version (and I assume a fonts gets shared in the beginning, updates then not so much, as for the first version the availability would be higher so the update-share would not compete) less attractive to those people who are likely to pay: professionals. So improving a font might be a good option.</p>
      <p>(c) would be the discussed mall-sheriff politics.</p>
      <p>my two euro-cents. ;)</p>
    html_clean: |-
