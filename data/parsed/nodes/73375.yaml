      <p>"harm from infringement is presumed"</p>
      <p>Legally speaking, very true.</p>
      <p>But that's simply a presumption (one that was helped along with heavy lobbying for things like the DMCA). In reality, the harm is as likely to not be there as it is to be there.</p>
      <p>Which is why true debates on these topics can get complex. The legal arguments don't necessarily always parallel ethical arguments. </p>
      <p>"Copyright infringement is also theft. See the No Electronic Theft Act of 1997"</p>
      <p>which states...</p>
      <p>"Criminal intellectual property theft offenses include copyright and trademark infringement and theft of trade secrets. Civil intellectual property suits include copyright, trademark, and patent infringement."</p>
      <p>So, alas, now we're getting into a debate that, sans a law degree, I'm woefully out of my league on. Debating legal semantics sounds like fun, but I'm simply not well versed on it.</p>
      <p>Key point, though, is that it's not really that helpful to use analogies to physical property theft. They are such different concepts, both ethically and legally, that I'd argue the use of said analogies only harm the debate rather than help it along.  </p>
      <p>@oldnick...that's a valid point on the dilution of the value. A fake $50 Prada bag sold on a NYC street corner isn't likely a direct financial hit to Prada, but one can certainly argue that it has lessened Prada's value overall. </p>
      <p>That said...an already popular font that is now popular and over-exposed due to file trading is a likely as scenarios as a not popular font that has now become commercially successful due to exposure due to file trading. </p>
      <p>What mostly irritates me, though, is your point combined with what Larabie brought up...it sounds like the most likely element contributing to likely lost sales is within the design industry itself. Which is a real shame.</p>
