      <p>Comparing font piracy to slavery and genocide overstates the issue enormously. (Do I really need to say that?)</p>
      <p>Perspective, please. We are talking about the mechanics of the free market. Nobody has the right to make a living off their work. (Not type designers -- not creative artists generally -- nobody.) The only right anyone has is to participate &amp; compete in the free market. Every corner of the free market has benefits. It has costs. And if you don't like that particular corner, you have the right to do something else with your time and effort.</p>
      <p>"Right" vs. "wrong" and "legal" vs. "illegal" are discussions that eventually get trumped by "fact" vs. "fantasy". Every piracy-protection system is broken sooner or later. People who don't want to pay for the product don't have to.</p>
      <p>I completely agree with Typodermic that in rational economic terms, type designers are usually better off putting the "mall cop energy" into designing more type &amp; better type.</p>
