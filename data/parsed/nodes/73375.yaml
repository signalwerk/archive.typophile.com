      <p>After rereading the thread I posted above, your suggestion is what they ended up doing after their initial plan (having the fonts installed by an installer, and invisible on your system to anything but the installer) didn't work out.</p>
      <p>I'm curious to know if they manually put the serial number somewhere in the font file before generating the OTF to send to the customer, or if there's some automated way of doing this.</p>
      <p>It all seems like a lot of work for very minimal gain. A foundry would have to spend a fair amount of time and energy generating and keeping track of those serial numbers, and even more time tracking them down, and yet more time writing strongly worded letters to the offenders (or paying a lawyer to do it for them). And in the end, unless they can convince the person to buy a license (which might not be worth more than the time they've put into tracking the person down), they won't end up any further ahead financially.</p>
      <p>This isn't to say that trying to minimize piracy isn't worthwhile, but I don't think this particular method is worth the time.</p>
