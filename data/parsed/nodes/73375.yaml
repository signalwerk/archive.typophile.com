      <p>I don't see a solution to this problem ever coming from within the font file itself or from the download controls of vendors. The simplest and most effective way of eliminating font piracy will be to overhaul the operating system engine that serves fonts to applications to require activation like any other software in order to operate on a unique system.</p>
      <p>For example, Adobe Creative Suite's activation process was met with initial resistance (predictable), but has mostly become routine and manageable for end users who really need to use the software. Efforts to undermine the activation process have met limited success and are out of technical reach for the vast majority of users. It has pretty effectively reduced piracy of CS.</p>
      <p>Having the infrastructure to manage such activation systems is probably overkill for many small foundries, but it would not take much work for someone to create a reasonable server-based PHP/MySQL solution that is affordable and secure. Or, multiple foundries could employ a central service through a subscription pay system.</p>
      <p>It is Microsoft and Apple who must ultimately fix this at the OS level. As long as the OS treats fonts like resource files to which users can have complete access and control, then users will treat them that way too, instead of treating them like legitimate software.</p>
