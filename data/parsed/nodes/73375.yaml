      <p>I rememember buying Didot from Foefler in mid-nineties, and that came with password protection, and only low-resolution version for display (no curved forms; they were replaced with a LOT of corner-points). So, if you wanted to actually make a printed product, you then had to buy the hi-res version for the printer.</p>
      <p>In the end I threw away the font after I got a new Mac, and failed to install Foefler Didot, because I could not find the original password slip.</p>
      <p>So, that method is not viable in my books, but 'stamping' might work. It should be done automatically, or as a choice in preferences, by your font building program in a deep enough level for hackers to simply removing it.</p>
