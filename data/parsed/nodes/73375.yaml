      <p>Kudos for your attitude, Mr. Larabie.</p>
      <p>Here's why the apple analogy is ruining the entire "content industry."</p>
      <p>1) You don't steal an apple from the market stand because you see the apple's owner, and the owner sees you. If there were no one around and you really wanted an apple, wouldn't you at least consider taking one?</p>
      <p>2) You know you can multiply apples infinitely, so you don't even have to physically take the apple away. You magically duplicate it and walk away with a brand new apple, and the farmer will never know. Does that feel like hurting him? Not really.</p>
      <p>3) When I buy a newspaper, or a CD, it feels like buying an apple: we trade objects for coins. When a newspaper website makes me pay 50¢ to read an article, I feel ripped off. 50¢ may be nothing, but I suddenly pay without getting a physical object in return that would justify the cost. The fact that the supply of copies is now infinite lowers its perceived value to zero. Fonts are <strong>crazy</strong> expensive (unless you're a professional who can put them on the clients' bill). (Almost) no one, at least not me, will buy a family for more than a couple bucks "for fun". Us type designers very much overestimate the importance of our work.</p>
      <p>4) Try to teach your virtues to your kids, who, like me, grew up in a virtual world, where everything happens on screen. It just feels unnatural to us to bring the concept of money into this immaterial world. Doesn't mean we don't <em>intellectually</em> understand you need money to survive, but 1), 2) and 3) are just so overwhelming.</p>
      <p>50 years from now, "intellectual property" business will have to work differently. I can't wait.</p>
      <p>(and yes, I make fonts myself. I just don't get why people in the creative business pretend the world is being deliberately evil to them.)</p>
