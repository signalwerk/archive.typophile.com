      <p>Michael,<br>
      The reason why you question your ability to write off this theft as a business loss is derived from the fact that you know better. Your claim is that what? Nine thousand font licenses were stolen? That would work if, say, you had invoices from each of the transactions and proof that in each case the payment was stopped—but even then, you could merely void their license agreements. So this specific argument doesn't hold up. You can 'steal' or illegally obtain fonts, but I don't see any way to steal font licenses (your product).<br>
      Yes, you have suffered legitimate, real damages, but you are only entitled to redress as far as and in the ways you've protected yourself in your EULA, and to the extent the law applies.</p>
      <p>Virtue is the only complete solution to this problem.</p>
