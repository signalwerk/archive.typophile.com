      <p>Matthew: The Font Bureau recently went after NBC for violating a EULA: <a href="http://arstechnica.com/tech-policy/news/2009/10/font-bureau-clashes-with-nbc-over-font-licensing.ars" title="http://arstechnica.com/tech-policy/news/2009/10/font-bureau-clashes-with-nbc-over-font-licensing.ars" class="link-external">http://arstechnica.com/tech-policy/news/2009/10/font-bureau-clashes-with...</a></p>
      <p>The point is, the vikings (promoters of piracy) don't seem to be aware that while private piracy is overlooked, public piracy is not, and this is a commercially important fact. </p>
      <p>There is a difference between IP protection and what is known as DRM, which tries to use technology to defeat piracy. Your example of Itunes is off the mark, because the music is copyrighted, and there have been suits for violation of copyright. If you don't think copyright matters commercially, just try and download the Beatles from Itunes. </p>
      <p>Your point about the parties accepting the rules of exchange voluntarily is correct, but I think, that if the rules were never enforced by government, then the parties would not respect the rules. You just have too look at poor countries to see where the rule of law is much weaker, and commerce is as a result harmed. Poor countries are poor partly because of the lack of rule of law, and particularly the enforcement of contracts. This stuff actually matters a lot to the wealth of a country.</p>
