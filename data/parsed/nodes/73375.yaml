      <p>&gt;Has any font foundry ever sued a nonlicensed user for copyright / EULA violations? I haven't heard of it happening, though it may have</p>
      <p>Yes. Adobe vs SSI established that you can't just copy and resell software from another company. </p>
      <p>There have been several law suits against companies for violating font licenses. The de facto situation is that private individuals can use pirated fonts privately with impunity, but publishers and other companies cannot. </p>
      <p>&gt;its notion of "IP protection" is radically different than yours. </p>
      <p>You are being presumptuous in thinking you know what my notion of "IP protection" is. I don't know myself, as I'm not a lawyer, and haven't studied this complex matter. </p>
      <p>I do think a few things: 1. if Adobe had lost to SSI instead of winning, and similar suits were defeated, it would have hurt the font industry. 2. If you download and use my font without paying for it, you are depriving legitimate income to both me and Font Bureau, who both worked on it--a lot. It is particularly nasty if you make money using the font without ever paying for it.</p>
      <p>Matthew: The Font Bureau recently went after NBC for violating a EULA: <a href="http://arstechnica.com/tech-policy/news/2009/10/font-bureau-clashes-with-nbc-over-font-licensing.ars" title="http://arstechnica.com/tech-policy/news/2009/10/font-bureau-clashes-with-nbc-over-font-licensing.ars">http://arstechnica.com/tech-policy/news/2009/10/font-bureau-clashes-with...</a></p>
      <p>The point is, the vikings (promoters of piracy) don't seem to be aware that while private piracy is overlooked, public piracy is not, and this is a commercially important fact. </p>
      <p>There is a difference between IP protection and what is known as DRM, which tries to use technology to defeat piracy. Your example of Itunes is off the mark, because the music is copyrighted, and there have been suits for violation of copyright. If you don't think copyright matters commercially, just try and download the Beatles from Itunes. </p>
      <p>Your point about the parties accepting the rules of exchange voluntarily is correct, but I think, that if the rules were never enforced by government, then the parties would not respect the rules. You just have too look at poor countries to see where the rule of law is much weaker, and commerce is as a result harmed. Poor countries are poor partly because of the lack of rule of law, and particularly the enforcement of contracts. This stuff actually matters a lot to the wealth of a country.</p>
