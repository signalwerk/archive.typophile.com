      <p>I'm glad we don't have the font equivalent of the RIAA. I want the sharing world to exist. It's always going to be a few font versions behind, it lacks tech support which ends up providing incentive to buy. That's the stick that encourages people to consider the option of buying it.</p>
      <p>I used to sell personal use licenses the they were ignored. I used to go back to check the domains of who was purchasing the personal use licenses. About half were ad agencies and a look through their portfolios would reveal my fonts being used for commercial use. More than half of the personal use licenses I sold could be seen in commercial use. I'm not exaggerating. I think it's human nature to just buy the cheapest version and ignore the fine print. If you release amateur versions, they will be used for commercial use anyway so it just ends up being a way for commercial users to "cheap out". I used to believe that another price option could be offered but I've since learned that ad agencies always go for the cheapest option, even if commercial use is prohibited.</p>
      <p>So how about we keep selling fonts, the file sharers will do their thing and everything's cool.</p>
