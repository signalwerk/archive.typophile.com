      <p>The only thing you can change about piracy is how you feel about it. Sometimes stealing is sharing. Sometimes sharing is stealing. Sometimes sharing is sharing. Sometimes stealing is stealing. Anyone who claims that any of these is always the case is wrong.</p>
      <p>Torrents, rapidshares, alt.binaries and pirate font sites: sales are affected. Maybe every 9000 downloads, costs you 10 sales. Maybe it costs you 0.05 sales. I'm pretty sure it doesn't cost you 100 sales.</p>
      <p>You can try to classify the type of person who pirates fonts but to what end? Some of those people are your customers, some aren't. A few times, just for fun, I've sent a free commercial font license to someone who was asking for my fonts on a pirate site. Why not? You don't lose a sale anyway and you might gain a Twitter follower. </p>
      <p>Do your paying customers a favor: put your bitter mall cop energy into making new fonts and improving old ones. If your fonts end up on a free font site, that's what you need to worry about. I didn't always feel that way but that's the conclusion I've come to after over a decade of selling fonts. I'd have a few less fonts in my library if I spent more time on a pirate crusade or feeling bad about it.</p>
      <p>However: free font sites that mistakenly carry commercial fonts can hurt sales. They deliver fonts to people who think they're supposed to be freeware. I think those are worth the effort on a polite reminder/impolite take down.</p>
