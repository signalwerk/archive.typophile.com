      <p><cite>the free market only exists because of law and its enforcement. The government defines and enforces what is private property, and without that there is no market ... government that authorizes copyright and patent, and enforces contracts (including the EULA), which enables creatives in the digital realm to sell their wares. </cite></p>
      <p>The essence of a market economy is exchange, not private-property rights. Items are successfully exchanged all the time in our economy that are not property, or not private.</p>
      <p>There is a difference between "enabling" a market and "enforcing" it. By and large, the govt only takes a role in enforcement when it's a criminal matter. For copyright, patent, and contract, the govt makes private parties enforce the law. This is not a merely academic distinction. Economic incentives would be distorted if private parties did not internalize the costs of enforcement. </p>
      <p>(PS Has any font foundry ever sued a nonlicensed user for copyright / EULA violations? I haven't heard of it happening, though it may have)</p>
      <p><cite>Pro-piracy Vikings fail to notice that there is a multi-billion dollar market for software, which would not exist if there were no IP protection</cite></p>
      <p>I am not pro-piracy (nor, last I checked, a Viking) but software markets DO exist without IP protection. For example, the iTunes store. For the last couple years, all songs have been sold in unprotected MP3 format. Has that impacted Apple's bottom line? For the better, apparently.</p>
      <p>Example #2: fonts. There is no meaningful IP protection for fonts in the United States. Entire companies have been built around the premise of legally cloning existing fonts. But the market hasn't collapsed. That's not a pro-piracy argument. That's just pointing out that whatever is holding up the font market in the US, it's not private IP rights.</p>
