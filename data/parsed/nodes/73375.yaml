      <p><em>would it not be possible to 'stamp a serial number into' or uniquely mark each font distributed so that in these cases of mass piracy we may conclusively know the origin of its dispensing?</em></p>
      <p>A TRULY Unique PSID would be invaluable. I suppose that a font vendor could store font data as XML, then merge that data at point-of-sale with a unique add-on ID tied to the buyer's name, email and--even better, but it would never fly--credit card information, and do an XML-to-OTF conversion. I doubt that this will happen, but what if such a "What if" scenario were circulated among the type-buying public?</p>
