    <p>so far the iPhone lives up to its hype, including posting to community sites from mobile Safari.</p>
    <p>After a day I, m typing as fast as I could on the blackjack with about the same error rate. The qwerty is actually as large as the blackjack, but the lack of  tactile feedbackdoes have an impact. </p>
    <p>More later i’m sure.</p>
