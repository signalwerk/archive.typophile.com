    html: |-
      <p>Why not use the corporate font?<br>
      It should be suitably understated.<br>
      Scripts are OK for personal expressions of grief, but kitsch and phony for a corporate expression of sentiment. After all, corporations aren't concerned with clients' feelings, they are legal entities predicated on profit.<br>
      Note that you said the company sends out the card, not an insurance agent.<br>
      If an agent is involved, their handwritten note on an ID-compliant card would make a nice contrast.</p>
