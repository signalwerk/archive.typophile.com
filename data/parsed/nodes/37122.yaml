      <p>Another smaller problem I noticed is that the AppleTypeServices RTF code for small caps was changed. While in 10.4, it was F196611, in 10.5 it is F196620 -- which means that documents saved in Tiger that had the small caps feature applied lose this formatting in 10.5 (at least in TextEdit). I guess this may have something to do with the fact that in 10.4, the OT Letter Case selector was a set of radio buttons while in 10.5 it is a set of checkboxes. </p>
      <p>Other codes such as F1376256 for oldstyle numerals seem to have stayed the same. Is there a reference list of those constants available somewhere? </p>
      <p>A.</p>
