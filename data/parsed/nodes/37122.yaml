      <p>Miguel -- the OT style-linking bugs you mention (which I posted <a href="http://www.adobeforums.com/webx/.3bc4737d?@63.pNushOJD21b@" rel="nofollow">here</a>, not realising how much livelier the Typophile forums were) have been fixed in Leopard (as of 10.5.1; I never checked in 10.5). At least, the default font when selecting Arno Pro is now Regular, and command-B/command-I do sensible things at last. The list order looks much the same but with a better default at the top.</p>
      <p>More generally -- I realise this is dragging the thread way off topic, but as it seems to be a productive place to discuss Leopard font bugs, may I point out with some frustration that a very old bug has returned from 10.3.5, viz broken support for old PS1 fonts with alternative glyph sets -- most notably 'Expert' fonts, which have been working fine since 10.3.6, and now don't display any more? Dan, if you're reading, I did file this on Bug Reporter, but any help in getting it fixed in the next SU would be much appreciated. I've had to go back to fake small caps and lining figures, and they're horrible.</p>
