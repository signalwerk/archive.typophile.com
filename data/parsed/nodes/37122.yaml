      <p>Since Miguel mentions style-linking in Arno Pro, the question is, what is Command+B supposed to do in Apple applications?<br>
      Does it rely on 4-style subfamilies defined by name table IDs 1+2 and OS/2 fsSelection? Or does it rely on the OS/2 weight value and allow toggling through weights, as in Adobe applications? (Needs to treat optical weights as separate families.)<br>
      [Edit] To put the question differently: Does Apple want to imitate style-linking behavior as in Microsoft applications, or in Adobe applications? The former may make sense if the goal is to match (Word) users' expectations. But Apple applications' font menus show large families rather than the 4-style families into which large families are teared in Windows, so there is no need to pay tribute to 4-style families when it comes to style shortcuts.</p>
      <p>Dan -- <cite>I've seen fonts that were not ordered.</cite></p>
      <p>I think this then is a problem of fonts. At least in Latin script fonts, considering the OpenType List discussion to which Miguel refers.</p>
      <p>Dan -- <cite>For the capitals features, I changed them to checkboxes from radio buttons (just for OT fonts though) based on feedback though I've seen a few comments stating that this was not preferred. At least, it's up to the user to check a single or multiple capitals features.</cite></p>
      <p>Hm. Does it mean to get smallcaps from both upper and lowercase one needs to activate two options? I have not seen OS 10.5 yet ...<br>
      (Seems I am one of those who would have preferred mutually exclusive options "Upper &amp; Lower Case", "Upper Case", "Upper Case &amp; Small Caps", "Small Caps". Still wondering why a user would want to select uppercase and smallcaps at the same time.)</p>
      <p>I have a question:<br>
      Does/will OS 10.5 also interpret GPOS features (e.g. 'kern') with multiple lookups and contextual positioning?</p>
      <p>Karsten</p>
