      <p>Thanks all-</p>
      <p>I already addressed the lookup ordering issue - simple fix works like a charm and I'm hoping to get this and some other changes in an SU though I feel a little uneasy about relying upon the order of the lookups in the fonts themselves; I've seen fonts that were not ordered.  I guess worst case would be to have a huge precedence list of features to follow.  For the capitals features, I changed them to checkboxes from radio buttons (just for OT fonts though) based on feedback though I've seen a few comments stating that this was not preferred.  At least, it's up to the user to check a single or multiple capitals features.</p>
      <p>I wasn't aware of the kerning problem you noted which I'll investigate but I did indeed just find and address a vertical kerning issue: values were definitely confused.  Also note, fonts that don't have a 'morx' or 'mort' but have a 'GSUB' go through OT processing but if the font has also has a 'kern' table, MacOS X positioning for ATSUI and CoreText will use that instead of the 'GPOS' (this is specified by the OT spec).</p>
      <p>So the gist the 'cmap' issue then is it's been fixed correctly in Leopard.  Unfortunately, we're past the last SU for Tiger so there's no going back.  I'll post back after investigating the kern issue.  Cheers,</p>
      <p>Dan</p>
