      <p>Dan, </p>
      <p>it's not a rumor, it's true. Or at least, it used to be true.<br>
      Now it seems like it ain't true anymore. Some things were fixed in 10.5 as opposed to 10.4.10, but some got broken. Please take a look at the screenshots attached. </p>
      <p>They show three fonts: Cambria (OpenType TT by Microsoft, version 5.02), Garamond Premier Pro (OpenType PS by Adobe, version 2.000) and Arno Pro (OpenType PS by Adobe, version 1.011), in TextEdit on Mac OS X 10.4.10 Tiger and 10.5.0 Leopard respectively. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/TextEditOT104_5599.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/TextEditOT105_5020.png"></div><p></p>
      <p>Note: </p>
      <p>1. In Tiger, all OpenType PS fonts have their cmap table synthesized. You can see this with the U+0163 character -- in Garamond Premier Pro, the respective glyph is named "tcommaaccent", and is of course mapped to U+0163, but Tiger ignors the cmap mapping, looks at the glyph name, does NOT recognize it, so the glyph is not shown. In Arno Pro, the glyph name is "uni0163", which Tiger does recognize and synthesizes an appropriate Unicode. In Leopard, this automatic Unicode synthesis based on glyph name was apparently done away with. I just tested it: I assigned a fully fictitious glyph name to the U+0163 and generated an OpenType PS (.otf) font, and according to my expectation, Tiger failed to show the glyph but Leopard did show it. </p>
      <p>2. While the support for different OpenType Layout lookup types in Leopard has been improved, Leopard seems to have introduced some serious problems in the interaction of different OpenType lookups. You can see on my screenshots that I activated both "Common Ligatures" and "Small Capitals" for the third word in each row. If we disregard the U+0163 problem mentioned above, we see that Tiger correctly interprets the order of the OT lookups that is stored in the font -- the "smcp" feature lookups precede the "liga" lookups and therefore, with both applied, only "smcp" gets processed and "liga" is disregarded. In Leopard, we see that this is no longer the case. In Garamond Premier Pro, the "smcp" lookups get processed first, and "liga" get ignored (correctly), while in Arno, the "liga" lookups get processed first, and the "smcp" lookups later (which is not correct). Cambria is a particularly good test case because it implements the "liga" feature in an innovative way -- by contextually inserting a different variant of the "f" glyph before "i" or "l". And you can clearly see that that "liga" lookup also gets processed before the "smcp" lookups, which contradicts the lookup order stored in the font. </p>
      <p>3. A fully new problem also was introduced in Leopard -- some GPOS kerning in OpenType TT (.ttf) fonts gets disregarded, though it worked in Tiger. Look at the Cambria example -- Cambria only has GPOS kerning, without classes but implemented in several lookups. We can see that both Tiger and Leopard processed the standard TA kerning pair correctly. However, Tiger also processed the small-cap LT, TA, AŢ and ŢA pairs correctly while Leopard failed to process those pairs. </p>
      <p>I will send you a fully-documented case per e-mail. </p>
      <p>Best,<br>
      Adam</p>
