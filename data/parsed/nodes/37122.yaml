      <p>Man, we diverged from the original topic quite a bit (should have started a new thread "Type issues in MacOS Leopard").  But no matter, I'll try answering the best I can.<br>
      <cite><br>
      what is Command+B supposed to do in Apple applications?</cite></p>
      <dt>
      Well, it's supposed to do the most sensible, logical thing and switch to a weighted style that also is associated with the style that was previously selected.  So if say "Oblique" is selected, doing a Command+B will change the style to "Bold Oblique".  But sometimes it's not entirely obvious what to change the style to based on the original style.  We can do better though and will try.<br>
      <cite><br>
      Does/will OS 10.5 also interpret GPOS features (e.g. ’kern’) with multiple lookups and contextual positioning?
      </cite></dt><dt>
      I'm not sure what you mean but if you're asking if Leopard has full 'GPOS' processing, the answer is yes.  There was an omission in Leopard for my default 'GPOS' feature list though: it's missing the 'mkmk' and 'mark' for general layout (of course, it's there for CoreText Arabic if the font has a 'GPOS').  Also, I mentioned it earlier but I should reiterate that we now always use the 'kern' table if present in a font in lieu of its 'GPOS'.<br>
      <cite><br>
      Hm. Does it mean to get smallcaps from both upper and lowercase one needs to activate two options? I have not seen OS 10.5 yet ...<br>
      (Seems I am one of those who would have preferred mutually exclusive options “Upper &amp; Lower Case”, “Upper Case”, “Upper Case &amp; Small Caps”, “Small Caps”. Still wondering why a user would want to select uppercase and smallcaps at the same time.)
      </cite></dt><dt>
      Actually, it is written (in the OT spec) that these feature shall be permitted to interact with any other 'GSUB' substitution feature (just need to apply them in the correct order, doh!).  Cheers,
      <p>Dan</p>
      </dt>
