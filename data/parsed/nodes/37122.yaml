      <p>&gt; Does this mean that the FontLab default, which assigns a character name of,<br>
      &gt; for instance, “tcommaaccent”, and gives it the Unicode 0163, is incorrect?</p>
      <p>It depends on what you mean by "incorrect". The "registered" glyphnames are not an official part of the OpenType standard, they're a recommendation by Adobe. Mac OS X recognizes most of the mnemonic glyphnames listed by Adobe in the AGLFN (such as aogonek, cacute, ntilde etc.) but in case of U+0163, Adobe recognizes both the glyphnames "tcommaaccent" and "uni0163" while Mac OS X 10.4 only recognizes "uni0163". </p>
      <p>A.</p>
