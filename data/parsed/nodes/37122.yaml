      <p>Hello all:</p>
      <p>Thank you Adam for your comment. So I guess Zapfino Extra Pro (you worked on this correct?) will only work correctly in Adobe apps for now.</p>
      <p>I wholeheartedly agree Apple needs to improve their font technology. As it is right now, there are lots of inconsistencies. </p>
      <p>Adobe Poetica is a prime example of a font I cannot use to the full. This font comes with small cap alternates that are quite beautiful. However I cannot access them though the typography panel nor through the Character Palette. At least when using the Pages app.</p>
      <p>But I just discovered I can access these characters in TextEdit. But only if you use a "special trick". Pull up the Character Palette. Find your glyph. Instead of dragging it into your document- double click on it. Then you can use it in TextEdit. Spell check will not recognize the character you just popped in but it works otherwise (Poetica's funky kerning aside though). </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture24_6319.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Picture22_3892.png"></div><br>
