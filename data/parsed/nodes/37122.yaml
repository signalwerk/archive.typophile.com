  html: <p>If i remember correctly, someone recently refered to the Mac as being a "marginally Unicode compliant environment" or something to that effect. Why is Apple taking so long to adopt the standard and what is the best way to get around this apparent obstacle? I'm assuming (correct me if i'm wrong) that Apple is still adhering to some glyph naming standard to access glyphs, but which standard is that?</p>
