      <p>Based on what I'm seeing, I would summarize what's going on as, "<strong>for CFF-based OpenType Fonts</strong>, Mac OS X derives character mapping using something other than the contents of the character-to-glyph mapping table (cmap)."</p>
      <p>I would add the following:<br>
      - this does not appear to be a problem with TrueType-based OpenType fonts (it's possible to create TrueType based fonts that do not use glyphnames at all and whose glyphs all appear as expected).</p>
      <p>- this does not appear to be a problem with the OS's <em>Unicode</em> support; it's a problem with <em>font-handling</em>, and very specifically with CFF.</p>
