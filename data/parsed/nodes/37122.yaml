      <p>Well, I know the behavior changed since I changed it.  Basically, all the lookups and glyph coverage specifics were implemented and/or fixed.  What is missing are complex script shaping engines (for ATSUI, CoreText at least has Arabic) - I simply ran out of time but fully intend to knock them off this coming year.  Also what's missing is a decent UI for the features.  I cleaned this up in the existing framework the best I could but the OT alternates are way more involved than AAT which necessitates a major revision to the Typography Palette (actually, it would be easier to just scrap the current one and rewrite it).  Not having the alternates also closes off other features that rely on the presence those glyphs (such as specified in the Estilo font I've come to recently understand).  Suffice to say, I have many action items on my plate.</p>
      <p>As far as the Capitals feature interacting with 'liga' for instance, I'll check that out for possibly getting into an update - it might be a simple issue of the order in which these features are carried out.  I'll write up bugs from the comments listed here and investigate.<br>
      Dan Fenwick</p>
