    date: 2007-11-08T16:05:00
    date_raw: 8 Nov 2007 — 4:05pm
    votes: null
    html: |-
      <p>I asked our scaler expert about this issue and pasted his response below.  To proceed, it would be good to get specific cases that we can examine here at Apple.<br>
      Dan Fenwick</p>
      <p>"CFF based OpenType fonts are data fork fonts that has OTTO sfnt tag, thus we call these OTF font as the ones shipped from adobe bare such extension. For these, we only synthesize a unicode cmap if it does not have one (rare the case) or it require morx table synthesis. In the process of that, we do use the existing unicode cmap subtable to generate basis table for the new cmap. Only case for using the glyph names are type 1 fonts (non CFF).</p>
      <p>So I don't what this rumor is from or how we can proceed with the following questions."</p>
    html_clean: |-
      <p>I asked our scaler expert about this issue and pasted his response below.  To proceed, it would be good to get specific cases that we can examine here at Apple.<br>
      Dan Fenwick</p>
      <p>"CFF based OpenType fonts are data fork fonts that has OTTO sfnt tag, thus we call these OTF font as the ones shipped from adobe bare such extension. For these, we only synthesize a unicode cmap if it does not have one (rare the case) or it require morx table synthesis. In the process of that, we do use the existing unicode cmap subtable to generate basis table for the new cmap. Only case for using the glyph names are type 1 fonts (non CFF).</p>
      <p>So I don't what this rumor is from or how we can proceed with the following questions."</p>
