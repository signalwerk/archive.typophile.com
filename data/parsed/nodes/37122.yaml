      <p>So...we've strayed pretty far from the opener of this thread. </p>
      <p>I wonder if Dan or anyone else from Apple could comment on Paul's original concern (which I now share)? I would summarize that as "OS X 10.4 appears to synthesize Unicode mappings in CFF-based OpenType fonts from glyphnames rather than from 'cmap' subtables, possibly resulting in unexpected behavior for some glyphnames/Unicode values."</p>
      <p>The thread that Paul pointed out at <a href="http://www.typophile.com/node/37077" title="http://www.typophile.com/node/37077">http://www.typophile.com/node/37077</a> gets to the issue somewhat. My testing suggests that this behavior is limited to CFF-based fonts, not TrueType (where OS X seems to make direct use of 'cmap' subtables, ignoring glyphnames altogether).</p>
      <p>What I'm specifically interested in, relative to that issue is:<br>
      - is there a detailed spec discussing the method(s) used in OS X to derive Unicode mappings from CFF-based OpenType fonts?<br>
      - has anything changed in that mechanism from 10.4 -&gt; 10.5?<br>
      - does Apple have any guideline, standard, "best practices", etc. for glyph naming in CFF-based OpenType fonts?</p>
