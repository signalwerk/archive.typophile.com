      <p>Okay, specifics always help :-)</p>
      <p>There does seem to be something strange going on. I just tried creating a .OTF where the name of the glyph 'A' was changed to some other name (my favorite "foo" substitute, "butthead"). The glyph is still present in the font, and the included Unicode cmap subtables encode that glyph as U+0041. But the shape does not appear in Font Book nor in other mapping utilities.</p>
      <p>However, I'm not sure I'd classify this as an 'Apple and Unicode' deal; rather, it would appear to be an 'Apple and OpenType (CFF)' deal. Specifically, it appears that the OS does not to use cmap subtables of a CFF font to obtain character-to-glyph mapping. But I would not call it a Unicode problem at all; the problem (or maybe "feature") happens before Unicode enters the picture. [Edit: as an aside, I can do the same thing with a TrueType font and it works just fine].</p>
      <p>As to the relationship between OS and app: there's no requirement for an application to use what the OS provides; I can (and do) have a Mac OS X application that *will* properly render my example "butthead" font properly...but, I'm supplanting the OS's font-handling (even rendering) routines with my own. The point is, just because an OS supports something doesn't mean that all applications running under that OS will; and just because an OS doesn't support something, doesn't mean that you can't write an app that will.</p>
