      <p>-- j.hadley -- <cite>I did do a bit more experimenting, naming the 'A' glyph as 'uni0041'</cite></p>
      <p>Still didn't do much testing with this, but as regards 'tcedilla' &amp; 'tcommaaccent' named in uniXXXX fashion, it seems that these names work fine in OS 10.4 but not always in 10.3 which is still around. [In apps that use OSX's text engine.]</p>
      <p>-- Henyk -- <cite>I tested it with Indesign CS3.</cite></p>
      <p>Adobe uses it's own text engine which does support contextual substitution and positioning. Adam was referring to Apple's own applications like TextEdit and Pages, or other third-party apps that use OSX's text engine.</p>
      <p>-- Henyk -- <cite>Feature locl still not implemented :(</cite></p>
      <p>Are you sure? AFAIK it is applied when you select a dictionary for a text string. You can try e.g. with Arno Pro: type a text with 'fi' in the string; apply the Ligatures feature which turns 'f' 'i' into 'fi'-ligature; then apply Turkish language to the string, and the ligature will be decomposed into individual letters. This is 'locl' at work.</p>
