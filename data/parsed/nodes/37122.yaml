      <p>Re Apple and the triangles -- It was already there in earlier versions. Looks clean but has disadvantages too:<br>
      -- You have to open the sub-menu before getting at, or seeing, the options.<br>
      -- If you open all of them, the menu gets pretty long.<br>
      If at all, then I'd favor something which would fly-out on mouse-over: touch the headline word and a sub-menu pops up right where the mouse is, make your settings or not, and if the mouse leaves the popup's area it will close and accept the changed settings. Yet even this way the settings are hidden by default.</p>
      <p>What InDesign would badly need is a cleaned-up style/OT menu, and I feel tempted to say that anything would be better than the current one. Either removing the OT/non-OT distinction entirely, or emphasizing it as in your example on the other thread. (Currently I'd prefer removing the distinction. If, for example, the currently selected font features small caps, then the option is preceded by an OpenType icon, if not, then there's no such icon and it would return fake small caps. Maybe another option could forbid faking anything.)<br>
