      <p>Points and Picas are easier to break down. At least that is why I find them easier to use when I need a finer grid. Who wants to work with .7854 of an inch grid? ;^)</p>
      <p>It is always easy to go back to inches if you need to because 12 picas make an inch, or 72 points make an inch.</p>
