    <p>I've done okay for the last few years using inches for the page and points for type, meaning I can make pretty decent looking pages, but I definitely labour over the beauty. I've recently realized that If I knew how to properly think and build in points and picas, the beauty would be considerably less laboured. I learned it in one course, but we all thought 'yeah this is archaic' and didn't pay a whole lot of attention. </p>
    <p>So, now that I want to go from decent to amazing, can anyone recommend a good explanation of how and why points and picas work so well? This could be a book or online article. Then, I would really like to work through a series of exercises that will get me up to speed on building pages and setting type. </p>
    <p>Suggestions?</p>
    <p>thanks,<br>
    Jennifer</p>
