    html: |-
      <p>Jennifer, I think that the best is you start to visualize the measurement. You can build a ruler in quark or other app. of your choice. Just change the preferences to the measurement you want (i.e. picas or points) and, by duplicating lines you can make your ruller. 1 pica is 12 points. Make a 12 point square divided in 12 parts, then duplicate it (by the number, don't drag) until it reaches the size you want. Do you follow me? You can include lines thicker or thinner in it as seen in a typical rulers. When you have the artwork done, output to positive film, the result is a transparent ruler. You ruler.<br>
      I once confronted myself with this problem, but in my case I need to understand visually what is a inch. Now I know: 72 pts.</p>
      <p>After you are done you can call it "The Jennifer Typometer"</p>
      <p>Cheers</p>
      <p>André</p>
