    html: |-
      <p>You're lucky you're in north america.</p>
      <p>The silly US system for measuring pages in inches will be handy if you're planning on using a point/pica grid because these measurements are compatible.</p>
      <p>an inch is made up of 6 picas.</p>
      <p>each pica is made up of 12 points.</p>
      <p>each inch then contains 72 points.</p>
      <p>Now, using points to measure the size of type goes back to when they used to have metal type for printing.</p>
      <p>The total maximum size of the font (maybe used in a capital M or something) was the entire height of the size.  a 12-point 'e' won't be 1/6 of an inch in height, because a lowercase 'e' doesn't take up the full height it could within the character set.</p>
      <p>I am stuck here in Canada, and we're 100% metric, save our paper sizes thanks to america.  I really really wish we could just have metric paper sizes, they make so much more sense.</p>
      <p>Oh well, I guess I'll have to live in a world of measurements *not* based on a base-10 decimal system.</p>
