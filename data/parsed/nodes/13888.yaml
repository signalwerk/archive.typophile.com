    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Jim Rimmer</strong></p>
    <p>Canadian type designer, Jim Rimmer, is a rare typographic craftsman who is fully at ease cutting metal typefaces by hand and working the same designs with Bezier Curves on a Macintosh computer. Jim has designed typefaces for his own books that he designs, illustrates, prints and occasionally writes himself. His output approaches <a href="/wiki/Frederic%20Goudy" class="freelinking" rel="nofollow">Frederic Goudy</a>'s in volume and quality.<br>
    Mr.Rimmer has digitized several Goudy faces for Lanston and continues to assist in the evolution of <a href="/wiki/Lanston%20Type%20Co." class="freelinking" rel="nofollow">Lanston Type Co.</a> In January of 2006, Mr. Rimmer's designs were released through <a href="/wiki/P22%20Type%20Foundry" class="freelinking" rel="nofollow">P22</a> under the name of the <a href="/wiki/Rimmer%20Type%20Foundry" class="freelinking" rel="nofollow">Rimmer Type Foundry</a>.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/12554" rel="nofollow">Jim Rimmer speaks to Toronto Type Club</a><br>
    <a href="http://typophile.com/node/27685" rel="nofollow">Rimmerfest: A Celebration of the Life and Work of Jim Rimmer -- and a Call for Broadsides</a></p>
