  html: |-
    <p>Hi all,</p>
    <p>Long time no post! Sorry about that. I got married, bought a house, had a kid-- forums were the first thing to get cut. I guess I was never super active here, but nevertheless I'm glad my account is still around. I still think of this as the premiere place to talk about type.</p>
    <p>I work at the Chicago Humanities Festival, and we just posted a video of a presentation by Chicago designer Jason Pickleman. He's created identities and branding for some great restaurants and cultural organizations here in Chicago.  </p>
    <p>His talk covers three areas: </p>
    <ul>
    <li>A philosophical look at the role of text and type in our lives</li>
    <li>A look inside his own creative process</li>
    <li>(My personal favorite) A biting critique of trends in Chicago signage</li>
    </ul>
    <p>It's about 45 minutes long, and you can watch it <a class="freelinking external" href="http://youtu.be/hQuUJ63O8mY" rel="nofollow">on youtube</a>.</p>
    <p>We'd love your feedback, especially if you were willing to share it as YouTube comments (comments are part of how we measure success in getting our content online). </p>
    <p>Hope all is well in Typophile land.</p>
    <p>Cheers,<br>
    Matt Heinrich</p>
