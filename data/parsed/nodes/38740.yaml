      <p><cite>I wonder if the information design used in planning the Iraq War is available to researchers?</cite></p>
      <p>Mapping aside, I doubt that much information design was done. Given the agencies involved, it’s likely that everything was just dumped into basic Word templates and/or Excel Spreadsheets. And given the statements made by the people who planned this Iraq war during the first Iraq war, it seems like they understood the information really well.</p>
