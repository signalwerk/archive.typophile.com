    <p>That was the roughly (not verbatim) the topic of my thesis. I wanted to explore the connection between the information designer and the audience, how the information is presented by the designer, how it is perceived by the audience, and who is responsible when the information is misunderstood. That was the written part. For the visual part, I selected a college campus (my old undergraduate university) and redesigned their map and wayfinding/signage system.</p>
    <p>I decided to pick it up last night and reread it, almost 2 years later. Afterwards, I began to realize that despite my thesis committee kicking my butt with a plethora of revisions and pushing me to make this a great finishing stroke on my graduate school career, I only scratched the surface and maybe went a bit under. What I want to do is revisit my written part of the project in more depth as well as my visual part of the project. For my resources (and like a complete dolt I left my thesis at home and now I’m in a coffee shop doing a bit of research) I used Tufte, Ferdinand De Sassure, DAvid Crow, Saul Wurner, Nathan Shedroff, Josef Albers, multiple essays on information design from various authors in the last 200 years or so, explored semiotics, cognitive thinking, etc. There are a few others that I’m simply forgetting to mention.</p>
    <p>Any suggestions on additional resources that I could use to expand on my thesis?</p>
