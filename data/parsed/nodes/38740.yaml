      <p>There is a very interesting book about visual perception, but you’ve to know read french or german: »La loi et ses conséquences visuelles« – „Das Gesetz und seine visuellen Folgen”  (... The law and it’s visual consequences or effects)<br>
      It has been a project of research of the Academy of Visual Arts in Leipzig (Germany) and Zuerich University of Arts (Swizerland), directed by Ruedi Baur. Published by Lars Mueller.</p>
