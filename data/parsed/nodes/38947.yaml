      <p><em>no less real or important</em></p>
      <p>Craig, these cliches and myths that you term cultural constructions are important, because people believe them, whether or not they are true.<br>
      But they are not real. They are "real", as you might put it.<br>
      So we discuss what we imagine something to be, or would like it to be, or what someone else thinks it is.<br>
      But what connection does this have with reality?<br>
      We all have our ideas about what "French" typography is like.<br>
      But what is French typography really like?<br>
      Isn't it more important to investigate what is misrepresented in cultural identities, rather than just keep batting the myths around?</p>
      <p>If someone were to discover what kind of fonts are selling most in France, or what commonality there is in the typography of the most-read daily newspapers, or the corporate fonts of the biggest-spending advertisers, or the types used on the covers of the best-selling books there, that would recognize and define a national typographic identity grounded in reality, rather than myth.</p>
