    <p>hello type people,</p>
    <p>i am just about to write a long research paper about country identity within type, and will be focusing on french typography. I want to show that different countries do have an identity with type and show that a country can be reflected with type. </p>
    <p>i think its hoopefully going to be about 6000-8000 words long. </p>
    <p>i am finding resources quite scarce though and was wondering if anyone knows of any good books i should check out aimed at this general topic, any articles in magazines... ANYTHING that would help me to write a good research paper on french typography and identity. </p>
    <p>i have just got back from paris!. i took myself there so that i could get a good look first hand and french typography, but yea i do understand that the rest of france might be quite different but yea i got a taste for it at least!. </p>
    <p>anyways so any help would be much appreciated ok CHEERS!<br>
    from<br>
    Mark</p>
