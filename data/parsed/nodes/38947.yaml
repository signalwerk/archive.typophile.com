    html: <p>There's an interesting anecdote in one of Michael Beirut's essays. The story is of a client who has an unflagging (if ignorant) view that the typeface must be "more French." After repeated presentations, the CD finally produced the design using Empire. He proudly unfurled the design with the exposition, "and as you can see we are using the typeface 'ahm-peer'." The client bought it.</p>
