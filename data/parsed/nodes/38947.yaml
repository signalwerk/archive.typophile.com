      <p>I wish I had time to post more in this thread, as it is turning towards topics of particular interest to me. (I'm currently assembling an <a href="http://www.typophile.com/node/36998" rel="nofollow">exhibition on national identity and modern type design</a>.) From my perspective, a typeface isn't necessarily "French" because it was designed in France or by somebody with French ancestry, or used more than others in France - I'm more interested in why types have been associated with France in historical discussions. To put it in a different (and perhaps only more confusing) way, I'm interested in "French" types, not French types. (So I guess I'd defend a link of type design and national identity, but by pointing to what David R just called "its unconscious geographical identity, not its actual point of origin on earth.")</p>
      <p>I believe that what needs to be recognized is that national identity is a cultural construction - but is no less real or important for that. I think this is the way identity works. I might liken it to discussions of race: as I understand it, "race" doesn't really exist, genetically speaking, and yet it would be hard to say "race doesn't matter" socially.</p>
      <p>Another example: when I moved to the Twin Cities, I looked for housing in both western Minneapolis and eastern St. Paul (separated by the Mississippi). While I was househunting, locals seemed to always ask in which city my search was happening - as if it would be weird to look in both, rather than "declaring my allegiance" to becoming a Minneapolitan or a St. Paulite first. This struck me as ridiculous at first - could it really make a difference whether I was on one side of the river or not? - but I have come to realize that the fiction of difference between the two cities, because it is held by a good number of residents, actually does shape the culture of each. It isn't an "objective" difference, but there is a cultural difference.</p>
      <p>Oh, and this<br>
      <em>Writers and speakers who embrace both the existence, provisionality and provenance of their point of view have my respect and keep me reading &amp; listening</em><br>
      is beautifully put!</p>
