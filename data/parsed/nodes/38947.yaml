      <p>But Tiffany, it sounds more like Gerard's 2¢ than yours!</p>
      <p>Nonetheless, if you're a student and attribute your thesis sources -- and work with Eben's "strong sense of specificity" from the outset, there's a lot to be learned from the studies of others.</p>
      <p>I would still say that what we need at this point in time is a more objective approach to the academic study of typography, especially in such nebulous and contentious cultural areas as "national identity". </p>
      <p>I say contentious because local type designers have been annoyed, and some have campaigned against, the use of foreign types in their countries to the detriment of local creatives. I don't think this so much of an issue now, what with the spread of independent foundries to so many countries, and the international market for fonts.</p>
