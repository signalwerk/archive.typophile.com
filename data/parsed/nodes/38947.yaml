      <p><em>I’d don’t see how this cannot be subjective.</em></p>
      <p>I agree. At the risk of stating the obvious, <em>any</em> history, research paper, etc., is going to be subjective, because its author has to make choices about what to show and what to leave out, among other things. And then there is the author's stance, the paper's thesis, etc. (I'm saying such obvious things that it hurts. Sorry.)</p>
      <p><em>Right away we see that the ads in question must be “creative” to be considered worthy of history.</em></p>
      <p>Or, perhaps it's just that Krone's ads broke away from what was typical. That's what I was taught, at least. They are in the history books because they focused on the VW's supposed disadvantage (smallness) rather than an advantage -- unheard of back then! And because they represented a major shift in how things were done (think of that scene in <em>Helvetica</em> where Michael Bierut compares the 1950s and 1960s ads in "Life" magazine). But I see your point, Nick: the other ads were representative of American advertising, too -- up until then.</p>
      <p><em>If you go with material from the books Mark, you will be discussing country identity in pre-defined terms</em></p>
      <p>Books are just a starting point, but what else can a student do? Mark's already gone the extra mile and been to France.  :-)</p>
