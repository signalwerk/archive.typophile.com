      <p>Nick, While I have to agree with much of the thrust of what you are saying I think you are letting the idea of severing our ideas from myth become too absolute. I think that the complete avoidance of engagement Myth or perhaps better put 'story making' is simply not available in human thought. Story making is where insights and theory come from. Insights can be pounded into a theory which can be pounded on with evidence. But plain data without interpretation is essentially unusable. </p>
      <p>But all this discussion of intellectual frameworks may not be the deal way of pushing foreward on it's own. Maybe it would be better to suggest a model of study that you would like to see done. </p>
      <p>For instance I would be semi-interested to know what fonts feel 'french' and by what degree to people broken out by font, and by specific city/region and in multiple countries with lots of datapoints. Likewise it would be interesting to take discreet features of a single typeface say serifs maybe and see if they are seen as more or less 'french' in association as the feature changes. I suspect that what would be chased in both cases is a false phatasm. But... Sorry these are just examples and don't reflect a serious interest in the idea of National type. What kinds of studies/research could you be interested in Nick?</p>
