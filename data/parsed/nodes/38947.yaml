      <p><cite> there is no reason not to imbue it with your own 2¢ </cite></p>
      <p>It seems to me like it would be a rare individual who could hope to avoid leaving his or her own 2 cents. </p>
      <p>Also it seems to me that an academic paper is one thing; and a talk given by a Type luminary that is meant to inform to some extent entertain is another. The standards should be different both because of the context in the one case and because Gerard can better afford to make more general statements than most because he has been in Type for a respectable amount of time.</p>
      <p><cite> objective </cite></p>
      <p>To the extent that we can manage this - yes.</p>
      <p><cite> That’s why I mentioned the book Dutch Type, which has a similar approach </cite> - yes.</p>
      <p>And just so I don't come off as bigger monster than I really am ( I am a little no doubt ) -  in many cases it helpful to have vague ideas as motivation for exploration. I also don't object to talking about these vague romantic ideas. I have them too. And I know that these kinds of narratives must exist. It's just part of being human to come up with this stuff. It's just that they almost always make a poor framework for good academic work even if they start off sounding accessible and compelling.</p>
