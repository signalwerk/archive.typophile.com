      <p>Consider the Philip Meggs approach to American ads of the 1960s.<br>
      In his <em>History of Graphic Design,</em> he discusses "the New Advertising"--but not the old.<br>
      Right away we see that the ads in question must be "creative" to be considered worthy of history.<br>
      Are the majority of ads, which are "non-creative" not more typically American?<br>
      For instance, as is de rigueur, mention is made of the famous award-winning Helmut Krone VW ads, which have come to typify American print advertising of the 1960s.<br>
      But consider that those were one-page black and white ads, and far more representative of the era, statistically, would be the double-page, full-colour, car-porn spreads from GM, Chrysler, Ford, and AMC.<br>
      Of course, both kinds of advertising were American, but don't you think that ignoring the mainstream paints a misleading picture? Surely Detroit=America, not Volkswagen!<br>
      If you go with material from the books Mark, you will be discussing country identity in pre-defined terms, i.e. by what those authors have chosen. </p>
      <p>For comparison, how would you write a history of Hollywood movies?<br>
      Would the films you discuss be taken from a list of Oscar winners?<br>
      From a list of Golden Globe winners?<br>
      From a list of the top-grossing movies of each year?<br>
      Or the most watched movies, taking into account TV re-runs?<br>
      Or the most written-about movies, the canon of literature about the movies?</p>
