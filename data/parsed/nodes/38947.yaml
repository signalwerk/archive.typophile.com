      <p><em>I’m interested in examining the myths’ historical origins, their historical effects, what interests they serve(d), by what mechanisms they proliferated, etc.</em></p>
      <p>That sounds like a pretty accurate description of "batting the myths around"!<br>
      It is a fallacy that analysis of myths serves to deconstruct them--all it does is propagate their evolution; that's the way that canons emerge and thrive in academia.</p>
      <p><em>(I’m not ready to cede that it’s “more important”...)</em></p>
      <p>Perhaps not, but given the almost complete engagement of design writing with myth, as opposed to reality, wouldn't at least some recognition of reality be a good idea?</p>
      <p>"Recognition" is a key concept when it comes to the notion of identity, which is not a quality inherent in the individual. If we only recognize myths as constituting identity, we will continue to live in a primitive dream world. </p>
      <p>If you're going to mess with nationalism, why not recognize French typography as it is practised, rather than as it is imagined?</p>
      <p>The reason why that approach isn't happening: it's hard work collecting and analyzing data, and boring for those in the humanities, especially when they have to deal with the quotidian stuff, with no opportunity to wax lyrical about the award winning work of design heroes.</p>
