      <p>One could certainly say that the history of the development of typography certainly had nationalistic tendencies right up to about mid-twentieth century. As opposed to say, Bringhurst's pan-historic notions. Updike and McLean have been proponents of this, and it is quite hard to imagine it otherwise. I'd don't see how this cannot be subjective. How would a statistical approach prove Frenchness!!!</p>
