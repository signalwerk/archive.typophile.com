      <p>Eben, as I said, statistical data on "what kind of fonts are selling most in France, or what commonality there is in the typography of the most-read daily newspapers, or the corporate fonts of the biggest-spending advertisers, or the types used on the covers of the best-selling books there". </p>
      <p>Certainly, one could statistically research what "feels" French to people (French and otherwise), but again, why not find out what French people actually prefer, as determined by what they use?</p>
      <p>One of the best books on type culture I've come across is Kenneth Day's <em>The Typography of Press Advertisements</em> (1956), which has a multiplex "no heroes" approach. Day mentions the quantitative type-use surveys done by W. Harold Butler in <em>Advertising Weekly</em> from 1928, and his own analysis of types in the International Book Exhibition of the National Book League in the 1950s, where he compares the preferences of different countries.</p>
      <p>A recent work built on a firm statistical foundation (not about typography, but very relevant to it) is William St Clair's astonishing <em>The Reading Nation in the Romantic Period.</em></p>
