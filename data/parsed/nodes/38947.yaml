      <p>Being French myself, this is a topic that has preoccupied me for a little while.<br>
      I would urge you not to take everything in Wlassikoff's book at face value, since he has a tendency towards ideological readings of periods in history he doesn't know very much about (namely, everything before the end of the nineteenth century).<br>
      The main problem here is to find something "typically French" in typefaces as hugely different as Garamond, Didot or Antique Olive (to name just a few) when they obviously are the results of radically different intellectuel, cultural and historical contexts.</p>
