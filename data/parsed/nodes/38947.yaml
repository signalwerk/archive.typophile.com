      <p><em>the other ads were representative of American advertising, too — up until then</em></p>
      <p>I don't think you do see my point Ricardo. The "other" ads were far more representative of American advertising before, during, and after the 1960s. Design history focuses on the atypical, the award-winning stuff that appeals to the art directors and graphic designers who buy design history books. What best represents national identity: the mainstream of design as it exists in the mass media, or the minority tastes of the design community?</p>
      <p><em>but what else can a student do?</em></p>
      <p>Statistical research.</p>
      <p>For instance, Martin L’Allier surveyed the top corporations (listed by net worth) in Quebec and determined what their corporate typefaces were. I believe that was a student thesis. The same approach could be applied to advertising or periodical design. Or you could duplicate his research in France, and see how it differs from Quebec.</p>
