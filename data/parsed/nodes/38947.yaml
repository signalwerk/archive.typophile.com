    html: <p>It would be worth taking a look at Roxane Jubert, 'graphisme typographie histoire' (Éditions Flammarion, Paris, 2005) -  the lack of punctuation and conjunctions is in the original. It's a survey of typography through the ages and across the world, similar in scale and scope to 'Meggs' History of Graphic Design', but the perspective is French and each chapter has a section on developments in France. Since buying the original I've seen an English translation but I don't know if the content is exactly the same.</p>
