      <p>I share Craig's view that you need not submit to myth making per se to examine myths or evaluate the cultural impact of those myths. I am not willing to toss out cultural analysis ( as opposed to glyph analysis ) as long as it is moderately rigorous. Succumbing to a mythic or sloppily romantic view happens all the time though; a quick look at many student queries about 'National qualities' in type on this board will quickly show that. So I can am sympathetic to Nick's instinct to be suspicious. Still, it sounds like you are up to the task Craig! </p>
      <p>I also agree with Nick that an analytical approach to the glyphs themselves and they way they were used is something that we don't see enough of. Certainly more of that would go a long way to putting the myths down and increasing our understanding &amp; appreciation.</p>
