      <p><em>But what is French typography really like?<br>
      Isn’t it more important to investigate what is misrepresented in cultural identities, rather than just keep batting the myths around?</em></p>
      <p>Mark me down as also being against "just batting the myths around"! I'm interested in examining the myths' historical origins, their historical effects, what interests they serve(d), by what mechanisms they proliferated, etc. </p>
      <p>We'd agree that your question of what "French typography is really like" is a different question - one that I certainly respect as both legitimate and interesting. (I'm not ready to cede that it's "more important"...)</p>
      <p>What I take from this is that the real problems arise not by choosing one or the other of these kinds of questions to pursue, but by not being clear about <em>which</em> kind you <em>are</em> pursuing.</p>
