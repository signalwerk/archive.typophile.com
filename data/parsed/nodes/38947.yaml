      <p>Sorry guys for joining this discussion so late, but I am heavily stuck in this topic. I am the guy Florian Hardwig introduced and I spent quite some time on such a french topic. </p>
      <p>In my opinion, the very first thing is to seperate form from usage. What I found out was, that there is a pretty distinctive french way of contributing certain roles or functions to different sorts of letterforms (Caps, minuscules, scripts). It is rather the uage (connected to cultural ideas of beauty and appropriateness) than the shapes of the letters that makes the french twist in daily life signage. And that's the very important next point: please consider the difference between type as lead typography and lettering. In my opinon, the national identity thing rather relates to lettering than to type in the narrower sense. </p>
      <p>I disagree with the statistical approach though. The fonts most used in Germany today are Times New Roman, Arial and Comic Sans. I would make a bet that you'd get similar results for northern America, France and, say, Andorra. What does this tell about national identity ? Nothing. Would you choose these to design something, say, andorrian ? No. </p>
      <p>Take a look on french packaging of the 19th century and compare it to contemporary products. You will find consistencies and differences in layout principles, ornament and lettering and you will find that some sorts of products are closer to the graphical tradition than others. Wine bottles will want to refer to it, medical products won't. </p>
      <p>The best-selling charts of contemporary foundries won't give you a clue either, as these are extremely influenced by the 500 biggest enterprises of Europe and the USA who will for the biggest part have adopted a sans serif type that is "neat", "clean" and "neutral" in a way not to refer to a specific country. Most of them will have a mid-tone or dark blue somewhere in their corporate design...</p>
      <p>The question, wether culture is a construct (myth) or not seems meaningless to me as it is real in a way that people like to believe in it and by education make sure that this believing is transported from one generation to the next. Never the less it is possible to accept and appreciate culture and still regard it with some sort of scientific, cool distance. Humanities is a discipline of discussing and rediscussing constructs over the centuries without ever coming to the point of having a clear, reliable result. It tells as much about us than about our ancestry and future generations will enjoy to get a picture of us when they will read what we thought about, let's say Andorra in the 17th century. </p>
      <p>It was already mentioned before, and I agree that the nationality of specific designers is less important. I think what is important is to find out who were their teachers, what school of spirit the adhered to and what general spirit ruled the period they worked in. French designers arround Maximilien Vox thought of Helvetica gestaltung as a major threat for the french graphic culture. German designers of the same 50s/60s period thought of it as liberation from the nationalistic and mystical traps Germans had been running into. The same typeface has a very different meaning. By the way: the swiss school was very influential in post-war France too, so you will always have to consider wether the designer was on the "swiss" side or the "french" side.</p>
      <p>This whole subject is far to big to be handled in an online forum. It's great to have it going, I enjoy reading all the different opinions. Maybe there should be a congress on that soon !</p>
