      <p>Hello there</p>
      <p>After years of lurking here I am, to kick in the beehive I'm afraid.</p>
      <p>I am french, and I think that you can't seriously link type with national identity. In all these years, cultures always interpenetrated each other, and economical aspects also contributed in the fast propagation of specific styles - Didot and Walbaum making copies of the super successful Bodoni for example, thus bringing a very italian style in France and Germany. If you show a Bodoni-like typeface to some french guy now, He'll say it looks very french. and He will be right: Didot, Bodoni and Walbaum have been extensively used over here, thanks to Balzac, Voltaire, Knapp or Appeloig. Show it to some american ladies and they will recognize it as extremely north american, thanks to the logo of Harper's Bazaar. The Roman inspired Trajan reminds instantly of Hollywood Blockbusters today. The use or overuse of a typeface contributes to its unconscious gegraphical identity, not its actual point of origin on earth. Thanks to Apple, Garamond looks american when condensed, though it can also be considered very french. Frakturs always look somewhat german, until you show them to some Harvard or Cambridge student. And today's types, especially modern humanistic lineales, are just, thanks to Internet, completely "apatrides": they belong to the whole planet. Of course come typefaces just seem to stick to a specific country, like Mistral... But these are really very few.</p>
      <p>You are lucky I am not in the jury when you show off your study, for I absolutely disagree with you  :-)</p>
      <p>Well, that was my point of view,<br>
      David R</p>
