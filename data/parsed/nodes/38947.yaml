      <p>To me the whole notion of National type style is intellectually bankrupt because the notion is far too blunt an instrument with which to probe a the delicate and nuanced world of type. A strong sense of specificity is needed if the work is going to be of any value. This means no specious and superficially thought through generalizations. </p>
      <p>Working with statistics might be of of help but equally reframing the question is almost certainly of use. So for instance one might ask 'What characteristics do we see in type made in France ( maybe not by ethnically French people! ) or by French people ( maybe not working in France ) during the period from x to y.' Then you can ask either with statistics or not -  'what interpretation can we make of this?'. </p>
      <p>I am not saying these isn't something of interest to be found through this kind of study - just that is has to be done with intellectual integrity.</p>
