    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Fit </strong></p>
    <p>The “fit” of a font describes how the individual letters fit together alongside each other. A <em>loosely</em> fitted font has relatively large gaps between the individual letters; a <em>closely</em> fitted font has narrow gaps. The fit of a font makes quite a substantial difference to its general&nbsp;appearance.</p>
    <p>When type was, one way or another, little metal blocks, with each letter placed on its block (save in the few cases where there was a <a href="/node/12054" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">kern</a>) fitting was a matter of adjusting the amount of spare metal to the left and right of the actual letter (the <a href="/node/12623" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">sidebearing</a>). Only rarely, through the use of <a href="/node/add/wiki?edit%5Btitle%5D=Ligatures" title="Create node &quot;Ligatures&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">ligatures</a>, did the designer adjust the space between particular pairs of&nbsp;letters.</p>
    <p>With digital typography, getting the side bearings “right” remains important; but it is also possible to make small adjustments for particular pairs of letters to move them a little closer or a little further apart than their sidebearings would indicate. This requires a careful eye and good judgment: it can easily be&nbsp;overdone.</p>
    <p>Fit is also often adjusted by a designer if s/he is making a font for use at a particularly small size or large size: generally speaking fonts designed for smaller sizes have been more loosely fitted, and fonts designed for larger sizes have been more tightly&nbsp;fitted.</p>
    <p>It was always possible to make manual adjustments to fit: tiny spaces could be inserted to make the fit looser; type could be filed down to make it tighter. But in practice the labour involved made this practical only for short texts in long sizes. Software makes it relatively easy for everyone to fiddle to their own satisfaction–but it is commonly held that since fitting is a difficult art, it is in most cases (and in all cases of doubt) best left to the designer. Opinions differ on whether “automated” fitting by software (such as InDesign’s optical spacing feature) improves fit: it probably depends on the font, whether it was well-fitted to start with, and the particular&nbsp;task.</p>
    <p>There is a classic discussion of the difficulties of fitting in Tracy’s <cite>Letters of Credit</cite></p>
