    html: |-
      <p>IMO some space is required between 1 and the other numerals, even when kerning is possible.<br>
      These days, I provide proportional 1 with comfortable sidebearings.<br>
      If this space is not allowed for, numbers such as 1177 won't look right, because 7_7 is always going to be very airy.<br>
      The 1_1 combination does require some negative kerning, however.</p>
