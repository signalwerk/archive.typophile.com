    html: |-
      <p>Oldstyle numerals may potentially have proportional spacing, and may be kerned in that case.</p>
      <p>Normally, lining numerals do not kern, and they are monospaced. This permits the setting of tabular material. This has, in the past, also applied to oldstyle numerals, so it should be followed as well in their case if they are not an alternate style in a given font.</p>
      <p>Of course, this applies to general purpose text typefaces only. A display typeface would not be used for the setting of tabular material.</p>
