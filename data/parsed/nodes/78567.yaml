    html: |-
      <p>I kern all (proportional) numbers. As Nick says, they interact with other numbers. The first model I use is for folios, for a text running over 300 pages. The second is dates, as Nick mentions. They have to look good for both usages.</p>
      <p>Again as Nick says, they need their space -- it is easy to kern 7_4 too tightly, then when you have 774, you have a mess.</p>
      <p>Don't forget punctuation, and such oddities as The Summer of '42</p>
