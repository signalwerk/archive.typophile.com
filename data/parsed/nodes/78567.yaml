    <p>Hi all,</p>
    <p>Any thoughts on the correct kerning of the lining numeral '1'? Specifically, correct kerning when a sans-serif face whose '1' is simply a stem (dangerously close to an uppercase 'I' or lowercase 'l').</p>
    <p>The context would be when old style figures aren't available however proportional spacing would be desirable, such as in body copy. </p>
    <p>Thanks</p>
