  html: |-
    <p>I have two ID requests from a beer container. On the top, "Refined Pleasure," a wide (perhaps artificially extended?) connecting script with dual-stroke caps. Below, "PRIMA" set in a geometric sans with pointed bowls on the <strong>P</strong> and <strong>R</strong>. The top script I'm sure is a font, but the geometric sans could be custom. (The other typefaces on the box and bottle include Copperplate Gothic, Berthold Boulevard, Arquitectura, and Futura Condensed.) Thanks in advance!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Prima_6095.jpg"></div><p></p>
