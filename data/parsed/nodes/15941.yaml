    html: |-
      <p>I was going to suggest (in ascending order of retro) Letraset's Data 70, Countdown or BT Amelia. Now there's also Element or Union or Epps Evans, and Fontfont have a mass of bitmap faces, but hey - "to infinity and beyond!" </p>
      <p>Nothing personal, Chester, it's just that where I <a href="https://web.archive.org/web/20141113153937/http://www.aut.ac.nz/" rel="nofollow">work</a> Infinity is the corporate brand typeface, for reasons best known to our advertisers (maybe they wanted to join the space race too?). They have saddled us with a corporate template that allows for 12pt Infinity ST Medium to be force justified with no hyphenation over a 79mm line length with only 2pts of leading. Because Infinity sets pretty wide (as the name suggests?) and the university uses a lot of long words that don't break, it is all too easy to figure that a good face can be used very badly indeed.</p>
      <p>I hope it's treated much better in the the 'man and space' book elsac is working on... after all, it'll be used for display right?</p>
      <p>Incidentally Chester did you have anything to do with Infinity Maori or is that just a local variant?</p>
