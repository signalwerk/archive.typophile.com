      <p>The book won't be timeless, but I do think it's a good point that using anything too kitchy would get dated very quickly. I'm designing this book to be removed from it's original 1960s context. More modern, but not too trendy.</p>
      <p>Futura and avenir are classic, but not really the direction I'm hoping for. More technological I guess?<br>
      Where would we say space travel is today?</p>
      <p>I'm still very open to suggestions.</p>
