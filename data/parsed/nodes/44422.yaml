    <p>I never really noticed this before, but in last week or so I’ve seen it a few times.</p>
    <p>Emigre’s Tribute was used in a magazine I read recently, that’s when I got interested for the first time.</p>
    <p><a href="https://web.archive.org/web/20080821154604/http://www.emigre.com/fontpage.php?STrbR.html" title="http://www.emigre.com/fontpage.php?STrbR.html">http://www.emigre.com/fontpage.php?STrbR.html</a></p>
    <p>Then in the Best of Finnish advertising and graphic design exhibition there was one new font, Eero Astala’s Oksa for Luonto-Liitto, and the M was there, too.</p>
    <p><a href="https://web.archive.org/web/20080821154604/https://www.grafia.fi/index.php?sid=1208591950efd28cd2972a8109d5e215579ad7ff66&amp;rand=1119068881&amp;article_id=10926&amp;__from_id__=8007&amp;__variableName__=sarja&amp;profile1=42196&amp;search_type=article_search&amp;source_id=10479&amp;variableSearch=1.+Graafinen+muotoilu" title="https://www.grafia.fi/index.php?sid=1208591950efd28cd2972a8109d5e215579ad7ff66&amp;rand=1119068881&amp;article_id=10926&amp;__from_id__=8007&amp;__variableName__=sarja&amp;profile1=42196&amp;search_type=article_search&amp;source_id=10479&amp;variableSearch=1.+Graafinen+muotoilu">https://www.grafia.fi/index.php?sid=1208591950efd28cd2972a8109d5e215579a...</a></p>
    <p>Is this kind of M common, and what’s the history of it? Can you name other fonts with M with single left facing serif?</p>
    <p>Sorry about missing pictures, upload didn’t work.</p>
