    html: |-
      <p>I just did something similar, just opening a font in Fontlab and then generating it again, resulting in a size increase from 70kb to 116kb. I then compared the two, using MS Font Validator, and found that some tables were added and some were deleted. Specifically:<br>
      Added:  LTSH, VDMX, hdmx<br>
      Deleted: FFTM, GPOS<br>
      In addition, the contents of some tables were changed.<br>
      So, no, you did nothing wrong.<br>
      - Herb</p>
