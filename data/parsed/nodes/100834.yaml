    <p>Hello,</p>
    <p>I need to modify an existing font (OFL) to add a few characters (ç and Ç), to use it in french.<br>
    I opened the .ttf font file in Fontlab Studio 5, duplicated the c with copy/paste, and added the tail.</p>
    <p>The generated file is 36ko while the original is 17ko.</p>
    <p>What did I do wrong ?</p>
