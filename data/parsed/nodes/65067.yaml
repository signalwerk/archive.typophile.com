    <p>I know the library can be much better than the internet for these things but:</p>
    <p>But I read on a website :</p>
    <p>" so what are the features of humanist sans serif faces? One of the first such designs was Frutiger"</p>
    <p>But isn't Johnston also one, and Gill sans..? These are way older right?</p>
    <p>It's more that besides architecture (read my other forumposts); I'm also looking for artpieces that fit these typefaces.. </p>
    <p>Maybe you have an idea?</p>
    <p>x</p>
