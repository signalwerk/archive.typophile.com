      <p>A couple of essays that I wrote several years ago about humanist sans-serifs might be of use:</p>
      <p><a href="http://www.creativepro.com/article/dot-font-not-your-father-s-sans-serif" title="http://www.creativepro.com/article/dot-font-not-your-father-s-sans-serif">http://www.creativepro.com/article/dot-font-not-your-father-s-sans-serif</a></p>
