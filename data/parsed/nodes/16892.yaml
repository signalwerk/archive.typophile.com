    html: |-
      <p>It’s Bastarda style, judging from the shape of the ‘o’, and the closest style in general form (not details) that I could find was Washington Text (see <a href="http://bowfinprintworks.com/Script03Pg5.html">http://bowfinprintworks.com/Script03Pg5.html</a>). The ‘a’ is also not a very typical blackletter shape.</p>
      <p>It would be my guess that this is custom lettering or a custom font, and not something commercially available. It looks very professional, whatever it is.</p>
      <p>- Mike Yanega</p>
