    html: <p>andy - there are five sites that I can think of  <br>off the top of my head...  <br>  <br><a href="http://www.chank.com" target="_blank">www.chank.com</a>  <br><a href="http://www.larabiefonts.com" target="_blank">www.larabiefonts.com</a>  <br><a href="http://www.iconian.com" target="_blank">www.iconian.com</a>  <br><a href="http://www.shinntype.com" target="_blank">www.shinntype.com</a> <br><a href="http://www.apostrophiclab.com" target="_blank">www.apostrophiclab.com</a>  <br>  <br>Each site has some tutorial type of stuff.  <br>Jared Benson is working on something, too,  <br>that will be here at typophile.  <br>  <br>if you'd like to learn some Illustrator  <br>glyph-building techniques, send me an email.  <br>  <br>If you want to build a text face, examine the  <br>great ones and MLAM.  <br>  <br>bj  <br></p>
