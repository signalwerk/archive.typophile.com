    html: "<p>might I add a few books off the bottom of my head... <br> <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0907259065/qid=1052552189/sr=8-3/ref=sr_8_3/104-9488721-6785502?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\">Counterpunch: Making Type in the Sixteenth Century, Designing Typefaces Now</a> <br>I'm in the middle of this one, but it's an easy read and a good history of the stuff you should keep in mind while designing type. <br> <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0321127307/qid=1052552416/sr=1-1/ref=sr_1_1/104-9488721-6785502?v=glance&amp;s=books\" target=\"_blank\">The Complete Manual of Typography </a> <br>Once again, not a how-to, but a good what-to. All the language, rules, suggestions, and good sections on PostScript, Unicode and TrueType. <br> <br>but I'll repeat the best advice: examine the great ones. <br></p>"
    html_clean: "<p>might I add a few books off the bottom of my head... <br> <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0907259065/qid=1052552189/sr=8-3/ref=sr_8_3/104-9488721-6785502?v=glance&amp;s=books&amp;n=507846\" target=\"_blank\">Counterpunch: Making Type in the Sixteenth Century, Designing Typefaces Now</a> <br>I'm in the middle of this one, but it's an easy read and a good history of the stuff you should keep in mind while designing type. <br> <br><a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0321127307/qid=1052552416/sr=1-1/ref=sr_1_1/104-9488721-6785502?v=glance&amp;s=books\" target=\"_blank\">The Complete Manual of Typography </a> <br>Once again, not a how-to, but a good what-to. All the language, rules, suggestions, and good sections on PostScript, Unicode and TrueType. <br> <br>but I'll repeat the best advice: examine the great ones. <br></p>"
