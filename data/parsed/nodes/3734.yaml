    html: <p> &gt; ask the creator of the original design if its OK with him/her <br> <br>This is medieval guild mentality. <br>It's certainly necessary to require purchase of the original by the client and research restrictions on the rights (like the rare case where any modification is prohibited), and very good to ask for a blessing from the original designer, but *not* to ask for permission from him. Why? For one thing, the fact that the guy is not dead shouldn't be the determining factor - he himself copied from others, without permission - any design is part of our cultural landscape, and the "original designer" is not entitled to absolute control, just some control (like requiring adherence to the contract). Also, because the original designer might be an unreasonable, senile hogger. <br> <br>There has to be balance - don't put your head under the guillotine. <br> <br>hhp </p>
    html_clean: <p> &gt; ask the creator of the original design if its OK with him/her <br> <br>This is medieval guild mentality. <br>It's certainly necessary to require purchase of the original by the client and research restrictions on the rights (like the rare case where any modification is prohibited), and very good to ask for a blessing from the original designer, but *not* to ask for permission from him. Why? For one thing, the fact that the guy is not dead shouldn't be the determining factor - he himself copied from others, without permission - any design is part of our cultural landscape, and the "original designer" is not entitled to absolute control, just some control (like requiring adherence to the contract). Also, because the original designer might be an unreasonable, senile hogger. <br> <br>There has to be balance - don't put your head under the guillotine. <br> <br>hhp </p>
