    html: "<p>Each time you download/buy a font, there is a textfile included. (Almost every time.) Usually, the designer/company says that it's not allowed to modify the font. But if it says: \"take this font and do whatever you want with it\", i guess that is to be considered as \"open source\"... ¶Speaking as a type designer, I can imagine it is a sour experience if somebody else custom-modifies your font and sells the custom work for more money than you will ever earn just by making the font in the first place. ¶The Swedish phone company <a href=\"http://www.telia.se/\" target=\"_top\">http://www.telia.se/</a> had their design bureau change Bliss, so that the upper case W was a bit different. I can imagine that wasn't cheap, and what does J. Tankard think about that? Ericsson Mobile <a href=\"http://www.ericsson.se/\" target=\"_top\">http://www.ericsson.se/</a> apparently has \"their own\" cut of Helvetica Neue (or is it Akzidenz Grotesk?) - anyway, I can't see the damn difference. And where does the money go? In the design bureau's pocket? Not to the type foundry or the type designer, I believe... Contact the type designer if you are able to find him/her. I think that is the morally right thing to do.</p>"
    html_clean: "<p>Each time you download/buy a font, there is a textfile included. (Almost every time.) Usually, the designer/company says that it's not allowed to modify the font. But if it says: \"take this font and do whatever you want with it\", i guess that is to be considered as \"open source\"... ¶Speaking as a type designer, I can imagine it is a sour experience if somebody else custom-modifies your font and sells the custom work for more money than you will ever earn just by making the font in the first place. ¶The Swedish phone company <a href=\"http://www.telia.se/\" target=\"_top\" class=\"link-external\">http://www.telia.se/</a> had their design bureau change Bliss, so that the upper case W was a bit different. I can imagine that wasn't cheap, and what does J. Tankard think about that? Ericsson Mobile <a href=\"http://www.ericsson.se/\" target=\"_top\" class=\"link-external\">http://www.ericsson.se/</a> apparently has \"their own\" cut of Helvetica Neue (or is it Akzidenz Grotesk?) - anyway, I can't see the damn difference. And where does the money go? In the design bureau's pocket? Not to the type foundry or the type designer, I believe... Contact the type designer if you are able to find him/her. I think that is the morally right thing to do.</p>"
