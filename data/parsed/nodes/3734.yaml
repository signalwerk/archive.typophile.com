    html: "<p>This is good, practical, advice but what about the <br>larger ethical debate? <br> <br>This reminds me of the thread in our critique  <br>regarding <a href=\"http://www.typophile.com/forums/messages/29/870.html?1015601821\" target=\"_blank\">Miles Newlyn's \"Verona\"</a> which was  <br>based upon Zapf's \"Melior.\" If I recall Miles  <br>took a lot of heat UNTIL he was able to clarify  <br>that the font was not for retail sale, but for a  <br>client that owned the proper license for Melior... <br> <br>Some questions Stephen Coles asked at that time <br>are relevant, but mostly went unanswered by the  <br>previous thread: <br> <br>Stephen wrote:  <br> <br>&gt; When does a \"revival\" become ethically unsound?  <br>&gt; How different must it be? Can we only reissue a  <br>&gt; design that wasn't available digitally? Can we  <br>&gt; only revive type of a certain age? How old must  <br>&gt; it be? 500 years? 100? 50? I'm sure these  <br>&gt; questions have been asked and answered before.  <br>&gt; Anyone know of a good reference?</p>"
