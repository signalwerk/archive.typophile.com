    html: "<p>If you want to draw your own Jenson, no one is stopping you. If you want to make something derived from the <b>digital outline data</b> in Adobe Jenson or FB Hightower, you damn well better contact Adobe or Font Bureau and talk to their staff. Yes, most enduring type is historically informed, but this does not mean you can pillage someone else's <b>programming</b>. <br> <br>Treat type designs as you would treat any other intellectual property: with respect for the owner. Those looking for professional advice would do well to know that Hrant's opinions are, shall we say, not very representative of any major type designer other than Hrant. He continually demonstrates a need to see colossal, labrynthine complexity where there never was any. But THIS STUFF IS NOT HARD. Don't let anyopne convince you otherwise. <br> <br>Talk to the font's originators (and by \"font\" I mean the digital outline) before you mess with their <b>files</b>. And yes, scanning printed output of their fonts is still derivative work. <br>Derivative work without authorization is ILLEGAL. And if you simply take the time to ask permission, you may be surprised at how cool the designers really are. <br> <br>I had a request just like this today. Someone wanted me to add CE glyphs to a font package they bought. I told them I'd be willing as long as I get formal permission from the original foundry. What is difficult about this? <br> <br>Those medieval guilds actually got a few things right. <br> <br>Hrant, please cease these attempts to muddy the waters. Your posts have become so predictable, I have built a drinking game around them.</p>"
