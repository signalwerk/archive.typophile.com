    html: "<p> &gt; When does a \"revival\" become ethically unsound? <br> <br>That's a very interesting question. For example, one of the entries in Bukvaraz was just disqualified because it was based on Stone Sans. I don't know exactly what line the designer took, but to me the result is so different that it's almost a moot point. Nobody would use that font instead of Stone Sans. Sure, the intentions matter too, but don't we have bigger fish to fry? And I wonder, would it have been OK fifty years from now? If I had a dime for every type designer who's benefited from the fact that Jenson is dead... <br> <br>Besides the ethical stance, there's also the \"cultural\" one: overly literal revivals are good for making money, otherwise they suck. There have only been two fonts I've wanted to revive so far, and one of them I'd never do. The other is actually in the planning stages, but only because it's a totally unique text design that simply doesn't exist in digital form, in any guise. <br> <br>-- <br> <br>Jen, it would indeed be good to have a list of \"open\" fonts, with sources. By \"open\" I mean fonts that you can just download, modify, resell (or at least redistribute), etc. Not that there's a lot of them, certainly not a lot of quality ones. But for example isn't there a \"Times\" like that somewhere? <br> <br>hhp </p>"
    html_clean: "<p> &gt; When does a \"revival\" become ethically unsound? <br> <br>That's a very interesting question. For example, one of the entries in Bukvaraz was just disqualified because it was based on Stone Sans. I don't know exactly what line the designer took, but to me the result is so different that it's almost a moot point. Nobody would use that font instead of Stone Sans. Sure, the intentions matter too, but don't we have bigger fish to fry? And I wonder, would it have been OK fifty years from now? If I had a dime for every type designer who's benefited from the fact that Jenson is dead... <br> <br>Besides the ethical stance, there's also the \"cultural\" one: overly literal revivals are good for making money, otherwise they suck. There have only been two fonts I've wanted to revive so far, and one of them I'd never do. The other is actually in the planning stages, but only because it's a totally unique text design that simply doesn't exist in digital form, in any guise. <br> <br>-- <br> <br>Jen, it would indeed be good to have a list of \"open\" fonts, with sources. By \"open\" I mean fonts that you can just download, modify, resell (or at least redistribute), etc. Not that there's a lot of them, certainly not a lot of quality ones. But for example isn't there a \"Times\" like that somewhere? <br> <br>hhp </p>"
