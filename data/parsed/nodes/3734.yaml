    html: <p><i>There is no pillaging if the thing is paid for. </i> <br> <br><b>Exactly.</b> And fonts are not "paid for" generally. They are <i>licensed.</i> You can <i>license</i> a font package for generally between $0 and $150 a weight. <br> <br>Actually <i>paying for</i> a font, also called a <i>commission</i> or a <i>work for hire</i>, generally will cost you several orders of magnitude more, depending on the nature and scope of its use, whether you want exclusive use rights, whether you want exclusive <i>distribution</i> rights, or what have you. I suspect you already know this distiction, Hrant, and find it baffling that you seem not to acknowledge it. <br> <br>And yes, some designers will let you add accents and other new features to their design, and others will be hesitant. Too bad. That's their right. <br> <br>Fortunately for you, Trajan is not the only clasically proportioned imperial capitals font available. Try Friz Quadrata or Weiss. There are umpteen digitizations of Weiss floating around. Perhaps one of them is maintained by a mellower company. <br>  <br>A good metaphor, for Those Who Seem To Require Metaphors, might be font-as-child. Do not graft new limbs, organs or eyeballs onto a child without the parents' explicit consent. <br> <br>Neither Hrant nor I are lawyers. I suggest anyone still not convinced you should approach the designer/programmer get a Real Opinion from a Real Intellectual Property Lawyer before taking any risks you may come to regret.  <br> <br>I will offer a wager, though, for anyone interested in losing some money. Inquire privately.</p>
