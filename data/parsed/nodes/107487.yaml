    html: |-
      <p>I was hoping someone would spot a match. I didn't.<br>
      I wonder if this is two different scripts. The lower case seems heavier than the upper case. The _M_ is a very bad fit for the _ar_, it reads like _Moar_ more than _Mar_.<br>
      As for the _C_, it is in the style of Spencerian Script and close versions are found in several fonts. For example the _C_ in Ambassador Script CT <a href="http://www.myfonts.com/fonts/canadatype/ambassador-script/" title="http://www.myfonts.com/fonts/canadatype/ambassador-script/">http://www.myfonts.com/fonts/canadatype/ambassador-script/</a><br>
      or in Parfumerie Script Text <a href="http://www.myfonts.com/fonts/typesenses/parfumerie-script-pro/text/" title="http://www.myfonts.com/fonts/typesenses/parfumerie-script-pro/text/">http://www.myfonts.com/fonts/typesenses/parfumerie-script-pro/text/</a> or in Helinda Rook MT <a href="http://www.myfonts.com/fonts/mti/athelinda-rook/" title="http://www.myfonts.com/fonts/mti/athelinda-rook/">http://www.myfonts.com/fonts/mti/athelinda-rook/</a><br>
      _M_ and lowercase, also Spencerian variations.<br>
      For a good general substitute to your image I like Davison Spencerian HI <a href="http://www.houseind.com/fonts/spencerian" title="http://www.houseind.com/fonts/spencerian">http://www.houseind.com/fonts/spencerian</a><br>
      Don</p>
