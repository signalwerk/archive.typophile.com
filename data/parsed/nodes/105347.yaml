      <p>Hey Jim,</p>
      <p>FF Unit and FF Unit Slab would be the perfect match, but indeed FF Unit Slab is a way to compressed for long term paragraphs. FF Meta Serif would be a great choice, too. You could try something like Adelle if you want a modern look.</p>
      <p>Regards,<br>
      Florian</p>
