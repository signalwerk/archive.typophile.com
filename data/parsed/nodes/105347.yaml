  html: |-
    <p>Hello all,</p>
    <p>I was wondering if anyone had any suggestions for a serif font to use for body text in an instructional manual. The headers and sidebar boxes will use FF Unit, and I'd like something vaguely modern to use for the body.</p>
    <p>The obvious choice might be FF Unit Slab, but I don't know how that might look as a body text font at low point size (probably 9.5 - 10.5 pt font) and with largish paragraphs. Any suggestions are appreciated.</p>
    <p>Thanks!<br>
    Jim</p>
