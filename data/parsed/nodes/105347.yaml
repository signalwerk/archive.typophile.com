    html: "<p>I would try FF Meta Serif - it was designed by the same team (Spiekermann and Schwartz) and shares the same contemporary lineage, while being sufficiently different. And, to me, looks like an appropriate typeface for the text of a manual - something in the line of, say, Robert Slimbach's Utopia; see this interesting page and the dedicated site: <a href=\"http://metaserif.com/story/\" title=\"http://metaserif.com/story/\">http://metaserif.com/story/</a></p>"
