    html: <p>Never seen a "q" or "g" like that before, very original.  <br>I think the name" organica" is taken. I can't place <br>where I have seen it, but do a bit of research before you stick with this name. Very nice work, reminds me of something Mark Von Bronkhorst/Kanna Aoki could have done back in the mid-90's (mvbfonts.com ). Could benefit from some unique ligatures.</p>
