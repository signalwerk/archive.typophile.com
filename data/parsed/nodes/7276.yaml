  html: <p>Hello, everyone. I belong to the group of people who're showing their very first typeface on this forum . So here it is.. It is based on letterforms drawn with a brush on paper, which I then outlined and made more uniform. The inspiration behind the typeface was originally based on shapes in nature - the curves that occur in plants, leaves, etc (hence, the name "Organica"). It was conceived as imperfect, but based on aesthetically pleasing shapes, which strive for symmetry/ideal shape, but never quite reach it. Now that I'm simplifying the shapes more, it seems like it's evolving into an exploration of calligraphy, something humanist, done by hand (I just heard a great talk by Robert Bringhurst at the Design Thinkers in TO <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> ).  <br> <br>Please give me critique in this typeface- any kind of feedback will be very much appreciated. <br> <br>Kristina. <img src="http://www.typophile.com/forums/messages/29/51744.jpg" alt="Organica"></p>
