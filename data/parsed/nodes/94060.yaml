    <p>Dan's stepson Dave posted this message today at the printmag site:</p>
    <p><a class="freelinking external" href="http://imprint.printmag.com/daily-heller/dan-x-solo-type-revivalist-dies/#comment-917291" rel="nofollow">http://imprint.printmag.com/daily-heller/dan-x-solo-type-revivalist-dies/#comment-917291</a></p>
    <p>    Hi,<br>
        I’m wondering if anyone can help me with something related to Dan.  I had the pleasure of knowing Dan for 30+ years as my mother married him in 1982.  In the process of cleaning out his files/records (along with his 2 sons), we have come across a number of vintage materials that I’m sure would have value to collectors or others interested in typography.  Can anyone recommend how we could go about determining what is valuable/of interest and what is not?  Please let me know via post, or the moderator has my email.  Thanks.<br>
        Dave</p>
    <p>I couldn't figure out how to contact the site's moderator to suggest Typophile or other sources to him.</p>
    <p> - Herb</p>
