      <p>I envision this becoming the Trajan of book covers.. you know the thriller kind with embossed fluorescent metallic type. The New York Times Bestseller list will become a Dezfest. Airport bookshops will be crawling with Sqeeze. Someone will register the website BanDezSqeeze.com, from whence they will launch a guerrilla sticker campaign. Then we can all login to Typophile and lament how popular it’s become, the thoughtless choice of lazy art directors, and we’ll have to start a type battle called “Fix Squeeze” that nobody will be able to improve upon, meanwhile you’ll fly to type conferences in the DezJet, sponsor the rocking font-herd all-night parties, and relax by swimming in your vault of royalties. But perhaps I’m getting ahead of myself?</p>
      <p>Which is to say what I should have said before: this is really good. Squeeze comes into it’s own in narrow. Congrats.</p>
