      <p>Michael I have resisted opening the Pandora’s box that comes with the S. Then would need to be the C which then screams for the G but what can be done with the G? Actually the S does not have serifs. It is just the typical closed form of a sans serif like Helvetica or Univers. The E, L, and the Z are hard to rationalize though. I was trying for blackness and a minimum of holes to promote knockout of photos and a heavy weight.</p>
      <p>ChrisL</p>
      <p>PS: Your Ad, Michael:</p>
      <p>Wanted, Vixen with No Traps! Serifdipidy welcome, though :-)</p>
