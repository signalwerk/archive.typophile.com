  html: |-
    <p>Hello,<br>
    I would like to hear an opinion about a logo that I designed for my laboratory, which is a Physics laboratory in which we use ion beams to analyze materials.<br>
    I am not a professional designer, I just like to tinker a bit with graphics, so any suggestion or critic will be appreciated.<br>
    By the way I was not appointed to design it, I am just doing it for fun and I will probably not even show it to the director.</p>
    <p>The idea of the logo is that a beam of particles, that are represented by the dots, comes from left, passes behind the first letters, and hits the left 'l.' The hit then scatters the particles in other directions. The colors are the colors of the university in which I am working.</p>
    <p>Thank you!</p>
