    <p>Hi there, I was wondering if anyone here could help me identify this font:</p>
    <p><a href="http://www.travelportland.com/tpimages/home_header_the_offers.gif" title="http://www.travelportland.com/tpimages/home_header_the_offers.gif">http://www.travelportland.com/tpimages/home_header_the_offers.gif</a></p>
    <p>I've seen this one around in a few different places, but haven't yet been able to pinpoint it. It seems like it's similar to Helvetica, except a bit more narrow and some letters, like "D", "C", and "O" are less round. The "R" seems to be very distinctive as well, with the tail curving outward a decent bit more than Helvetica's "R". Any help identifying this would be greatly appreciated. Thanks!</p>
