      <p>Hello,</p>
      <p>In some fonts the unicode value 0x0020 (SPACE) and 0x00A0 (NO-BREAK SPACE) are assigned to the same glyph. 'uni00A0' is also a valid name for the none braking space.</p>
      <p>Eigi</p>
      <p>PS<br>
      hex codes in old style figures are looking curious ;-)</p>
