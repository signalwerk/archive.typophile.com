    html: |-
      <p>If the character display and printing routines of an operating system require fonts to specify a glyph for a non-breaking space, this allows them to make it, say, a different width than a regular space. Since the only distinction between the two entities is supposed to be how they behave when breaking lines of text, these routines should instead "eat" the non-breaking space, and ask the font for a regular one.</p>
      <p>However, that's just my personal opinion based on general principles. What font designers would really need to do is consult the OpenType standards (or TrueType standards, or whatever) to find out what they are required to do in order for their fonts to work properly on all applicable platforms.</p>
      <p>I've found some threads with information about this:</p>
      <p><a class="freelinking external" href="http://typophile.com/node/68985?page=1" rel="nofollow">http://typophile.com/node/68985?page=1</a></p>
      <p>A font with a nonexistent nbsp character will cause problems in the Opera browser, and</p>
      <p><a class="freelinking external" href="http://www.typophile.com/node/51198?page=1" rel="nofollow">http://www.typophile.com/node/51198?page=1</a></p>
      <p>one with an nbsp character that's the wrong width will cause problems in InDesign.</p>
