  date_raw: 22 Sep 2011 — 6:31am
  votes: null
  html: <p>I just opened several fonts in fontlab like Helvetica and Avant Garde Gothic, and can't find the nbspace glyph. I opened about a dozen more and struck out every time. I thought that was pretty strange. It seems like I'm the only font designer concerned with including it.</p>
