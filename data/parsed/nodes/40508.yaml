    <p>Can anyone help me figure out how this graphic style is achieved?</p>
    <p>I’ve seen this used before a number of times, and I find it hard to believe that it’s done by hand - it seems that would take forever. I imagine there’s some sort of Illustrator plugin that automates the process and allows the user to control how the forms are filled. You’ll notice that the ’fill shapes’ are never sliced, but rather resized to accurately define the boundaries of the outer form.</p>
    <p>Any ideas? Suggestions?</p>
    <p>Thanks so much,<br>
    Jim<br>
    </p><div class="imageWrap"><img src="/files/C5-128-01_5732.jpg"></div><p></p>
