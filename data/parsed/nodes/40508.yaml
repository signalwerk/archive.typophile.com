      <p>I once did a poster where I replicated a colour vision test which did not actually contain any hidden letters or numerals. (Don’t laugh; it was one of those “loose lips sink ships”-type military operation security posters, and it was no work of genius.)</p>
      <p></p><div class="imageWrap"><img src="/files/poster01_3610.gif"></div><p></p>
      <p>I also looked for ways to automate this, but in the end, it was all done by hand. This involved making hundreds of copies of circles of various sizes and similar hues and positioning each by hand. I think it took me no more than an hour.</p>
