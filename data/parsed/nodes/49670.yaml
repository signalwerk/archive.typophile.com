      <p>Yes. FF Good Wide Light was a featured free font last month I believe. </p>
      <p>They are quite different from one another. But I gather you are leaning toward FF Good, yeah? And you are hoping for Free? While I'd really suggest licensing FF Good as it will become a tool* which you can use again and again. But, if it is free that you are after I can point you toward:</p>
      <p>- <a href="http://www.smashingmagazine.com/2007/11/08/40-excellent-freefonts-for-professional-design/" rel="nofollow">40+ Excellent Freefonts For Professional Design</a>.<br>
      - <a href="http://typophile.com/node/44453?" rel="nofollow">FAQ Free Fonts</a> Typowiki entry.</p>
      <p>*Always better to opt for quality in terms of tools to be used in the long term.</p>
