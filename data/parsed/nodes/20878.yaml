    date_raw: 23 Jun 2006 — 1:25pm
    date: 2006-06-23T13:25:00
    votes: null
    html: <p>I tried adjusting the baseline shift to no avail. I wonder if it only happens on this computer? I'll send myself a copy and look at it at home. If anyone else has encountered this, please let me know how you solved it.</p>
  - id: 130949
    user_id: 1844
    user_name: Miguel Sousa
    user_path: null
    date_raw: 23 Jun 2006 — 6:26pm
    date: 2006-06-23T18:26:00
    votes: null
    html: |-
      <p>I just tried out, and it's quite simple to fix this problem.<br>
      As odd as it might sound, you'll need to select "Anti-alias for animation" as the Font rendering method, instead of "Bitmap text (no anti-alias)".</p>
