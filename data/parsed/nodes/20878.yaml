      <p>&gt; <em>I wonder if it is a bug in the font or in Flash 8?</em></p>
      <p>Neither, I'd say. Unlike previous versions, Flash 8 offers additional Font Rendering methods. The way these new options were worded was probably unfortunate, as they're not quite intuitive. I guess that's the problem.</p>
