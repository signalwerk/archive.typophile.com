      <p>Original might be an ITC font under the name of Uptight. Luc Devroye's list of Corel font name equivalences matches this with Corel's Uptown, which is far better made than an autotrace.<br>
      <a href="http://luc.devroye.org/corelequivalences.html" title="http://luc.devroye.org/corelequivalences.html">http://luc.devroye.org/corelequivalences.html</a><br>
      At least it's somewhere to start your search for originals.<br>
      Don</p>
