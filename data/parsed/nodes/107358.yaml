    html: |-
      <p>With the assistance of fvilanakis's list, and Don's identification of ITC Uptight I've managed to locate some possible print sources of the original.</p>
      <p>I also now see that this request has been posted here before: <a class="freelinking external" href="http://typophile.com/node/47014" rel="nofollow">http://typophile.com/node/47014</a></p>
      <p>I doubt whether a synthesizer company would be creating their own custom letters for a few print ads, and indeed the previous identifier, Mark Simonson, states that ITC Uptight Regular (as opposed to Neon) did indeed have several alternate letterforms which have been used in the samples I have posted here. Most modern sources such as Rookledge's Classic International Typefinder list only ITC Uptight Neon, not Uptight Regular. But at least now I have what I need. Thanks all!</p>
