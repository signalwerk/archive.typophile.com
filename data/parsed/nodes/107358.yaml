      <p>For M rotate the bowl of p 90 degrees, extend the vertical strokes, clip the inner stroke into a taper to match the other letters, mirror and use both original and mirror and this is what you get:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/UptightUptownMmodified_3582.jpg"></div><br>
      As I mentioned in an earlier post, I suspect that these letters are not in the original font.<br>
      Don<p></p>
