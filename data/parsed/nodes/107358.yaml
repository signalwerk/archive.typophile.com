      <p>Note in "ARIES MUSIC" that S in MUSIC matches Uptight/Uptown while S in ARIES is different. This suggests to me that R, M and C may also be modifications. The font has the elements for the R. Merely mirror the 9 and do a little editing for the leg.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/UptightUptownRmodified_4613.jpg"></div><br>
      M, C and S are even easier to modify.<br>
      Don<p></p>
