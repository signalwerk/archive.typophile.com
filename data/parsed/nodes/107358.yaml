    <p>I am looking to identify the original name/designer of the font used in the uppermost catch-line of <a class="freelinking external" href="http://retrosynthads.blogspot.no/2012/07/aries-music-inc-modular-synthesizer-ad.html" rel="nofollow">this advertisment</a> from 1977 ("It's syn-ful!") ... and also in the company name seen on the cover of <a class="freelinking external" href="http://1.bp.blogspot.com/-ngYaWa_2l0I/UNXvhFcNQcI/AAAAAAAGJlg/FozrXQEBk8M/s1600/%2524%2528KGrHqV%252C%2521rUFCN-VW9CFBQ1eF%25295qyw%257E%257E60_57.JPG" rel="nofollow">their 1977 catalogue</a>.</p>
    <p>A digital version of this face called "Upperville" was published by Bay Fonts in the early 90's, but this was an absolute travesty of digitzation, mostly likely an autotrace and with many forms different to the few printed samples I've seen. I am looking for more original printed samples, preferably the full set of glyphs, and the only way I will be able to do this is to know the original typface name. Knowing the designer/foundry will also help me to track down the copyright holder and to understand if that is still current.</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        ITC Uptight Regular        </div>
            </div>
    </div>
    <div class="field field-type-userreference field-field-solvedby">
          <div class="field-label">Solved By:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        <a href="/user/205259" title="View user profile.">donshottype</a>        </div>
            </div>
    </div>
