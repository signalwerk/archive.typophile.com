      <p>I can't find this /R/S or /c in a digital font, but look at the following travesties(?), matching "Upperville" to help with your inquiry:</p>
      <p>Xippy (no more info),<br>
      Tatum (Freeware! from A. Carr),<br>
      Tolum (Freeware! from A. Carr)<br>
      Tahitelbait (no more info),<br>
      Oneil (no more info),<br>
      Daubler (1994, by CompuWorks)<br>
      Core 1, Core 3, Core 5, Core 7 (Cambridge Fontworks)<br>
      Uptown (Copyright (c) 1992 Corel Corporation)<br>
      Uptight Neon (Copyright (c) 1992 Corel Corporation)<br>
      Uptight (Copr.1992 Image Club Graphics, Inc)<br>
      URSULINE (1997, ARC MEDIA INC)<br>
      Downtown (©1995-2001 Arts &amp; Letters Corporation)</p>
