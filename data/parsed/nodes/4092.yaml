      <p>I know I'm getting ahead of myself here by designing a specimen sheet way before the font is finished, but I have an interview later this week for a production designer job, so I put this together for a portfolio piece. At least it should show that I take typography seriously -- but I hope the interviewer doesn't look *too* closely at it <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">. Lots of details left to fix, and the kerning is very "quick and dirty." <br></p>
