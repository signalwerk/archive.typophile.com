  - id: 30484
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 3 Apr 2004 — 12:54pm
    date: 2004-04-03T12:54:00
    votes: null
    html: "<p>This is pretty elegant. <br> <br>Some \"macro\" stuff: <br>- The caps are too big. <br>- The caps are very conservative while the lc is more progressive. Some difference between the two cases in this respect is generally good (if only in an inescapable sort of way :-), but I think here the disparity is too much. <br>- You might like to look at Berthold's Imago and Agfa's Rotis (SemiSans) for possible inspiration. <br> <br>And some micro stuff: <br>- In the caps especially there's some wobbliness in the stroke thicknesses and skeletons. Like look at the \"S\". <br>- I'd give the \"Y\" a bigger head, and make the \"Z\" narrower. <br>- The \"g\" is really very good. Ideal modulation in the join. Maybe an oppen bottom though? <br>- Why is the \"j\" short? <br>- The \"k\" seems over-extended. <br>- The top-lefts of the \"m\" and \"n\" seem out of place. <br>- The \"s\" is too heavy on the bottom-right. <br>- I'd make the bar of the \"t\" like the \"f\". You have a \"reductionist\" thing going on (most notably in the \"a\", and that's one reason I think an open \"g\" might be better), and the \"f\" fits that - so should the \"t\". You were probably thinking along the same lines for the \"m\" and \"n\", but in those two it's not working as it stands (and what about the \"r\"?). <br>- The \"z\" is leaning right. <br> <br>If you make darker weights, I'd suggest increasing the stroke contrast a lot as you go up in color. <br> <br>hhp <br></p>"
  - id: 30485
    user_id: 3346
    user_name: john_todoroff
    user_path: null
    date_raw: 3 Apr 2004 — 5:07pm
    date: 2004-04-03T17:07:00
    votes: null
    html: <p>&gt;- The caps are too big.  <br> <br>I imitated the vertical proportions of Akzidenz Grotesk, since it is one of the more readable sans-serifs, but now that you mention it, the caps in AG are too big, aren't they? <br> <br>&gt;- The caps are very conservative while the lc is more progressive. <br> <br>I'm going to try a straight-sided "A" with a rounded top, and see what rounded corners look like on some of the other caps letters. <br> <br>&gt;- You might like to look at Berthold's Imago and Agfa's Rotis (SemiSans) for possible inspiration.  <br> <br>Actually I think Imago was one of the sparks for this project. I've also been looking at Optima, and even Bodoni (its "g" shows up a little bit in mine). <br> <br>&gt;- The "g" is really very good. Ideal modulation in the join. Maybe an open bottom though? <br> <br>I think the gap in the loop of an open-bottom "g" is often distracting. I tried playing around with opening it up, but settled for a closed loop instead. Since the "g" is already so much more complex than the other lc glyphs, the extra bit of white space makes the "g" stick out as too "noisy" in context. <br> <br>&gt;- Why is the "j" short?  <br> <br>Oops, an accident I forgot to fix. <br>  <br>&gt;- The top-lefts of the "m" and "n" seem out of place.  <br> <br>I've been struggling with these... A simple curve works on the "u" but looks gimmicky to me on the "n". Making an assymetrical curve on the "n" (sort of like FF Dax) worked nicely until I tried to make an "m" to match, which looked ugly. <br> <br>&gt; (and what about the "r"?).  <br> <br>It just doesn't look like an "r" anymore without the stem poking up a little (I forget what that little part is called).  <br> <br> <br>Thanks for your keen eyes, Hrant. <br> <br> <br>/ john</p>
  - id: 30486
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 3 Apr 2004 — 5:47pm
    date: 2004-04-03T17:47:00
    votes: null
    html: <p>&gt; Since the "g" is already so much more complex than the other lc glyphs, <br>&gt; the extra bit of white space makes the "g" stick out as too "noisy" in context. <br> <br>It is in fact the way in which the "g" is too complex that makes an open bowl better. Looking at it topologically (the "layers" of positive/negative space), only the "B" is as complex (and at least the "B" has a calming symmetry). By making the bottom open* you make the "g" much less complex - you basically make it belong more in the Latin alphabet. <br> <br>* And I mean generously open, not like the way Baskerville and Meta have it. I agree (if that's what you meant) that such minimal (almost apologetic) openness is worse than none at all, especially in smaller point sizes where the gap becomes neither here nor there, so to speak. <br> <br>hhp <br></p>
