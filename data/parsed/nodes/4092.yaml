    <p>Newbie here... I blame the Typophile site, and this forum in particular, for rekindling my obsession with type. Consequently I've been inspired to start working on this, my first attempt at designing a font (not counting "remixes"). My goal is to make it fairly readable even though some of the letters are stylized. It still needs plenty of refinements, but I think it's ready for some feedback. Numbers and punctuation are coming soon, and eventually italics and bolder weights, depending on how ambitious I get. <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/32535.gif" alt="exfoliant alphabet"> <br></p>
