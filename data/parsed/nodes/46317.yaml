    html: |-
      <p>Definitely a decorative font.</p>
      <p>But it's surprisingly readable. At least, I don't think a native Chinese reader would have any trouble reading passages like this, any more than a native English reader would have any trouble reading something set in the more experimental but successful display faces. (It would really have to be a passage of more than just a couple of characters so that the concept of the design is apparent, since just a couple of characters in isolation would just puzzle the native Chinese reader.)</p>
      <p>Being Korean, I myself don't read Chinese, but I'm familiar enough with the characters to recognize most and even to read a few. It would be nice to get an opinion from a native Chinese reader, though.</p>
