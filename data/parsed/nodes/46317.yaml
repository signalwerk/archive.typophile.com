      <p>Indeed very amazing!</p>
      <p>Not being trainedin Chinese, I wonder whether the letters, especially whole texts are immediately readable by a native reader of simplified Chinese, or would readability suffer, be reduced to "being able to spell it out" instead of reading it fluently.<br>
