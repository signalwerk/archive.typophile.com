    <p>Robofab script problem</p>
    <p>Hi all</p>
    <p>I wrote this robofab script to adjust the height of accent - I know<br>
    there are other ways of doing this but I like this way.</p>
    <p>This will move the accents up 5 points.</p>
    <p><code><br>
          from robofab.world import CurrentFont<br>
          #<br>
          f = CurrentFont()<br>
          #<br>
          one = [</code></p>
    <p>      'Aacute',<br>
          'Abreve',<br>
          'Acircumflex',<br>
          'Adieresis',<br>
          'Agrave',<br>
          'Amacron',<br>
          'Atilde',<br>
          'AEacute',<br>
          'Aring',<br>
           …  </p>
    <p>      ]</p>
    <p>      #<br>
          for g in one:<br>
          	f[g].components[1].move((0,5))<br>
          	f[g].mark = 10</p>
    <p>      f.update()<br>
    </p>
    <p>I wanted to use the same code to move the accents down using -5 but I get an error</p>
    <p>Traceback (most recent call last):<br>
      File "", line 86, in<br>
    IndexError: list index out of range</p>
    <p><code><br>
          from robofab.world import CurrentFont<br>
          #<br>
          f = CurrentFont()<br>
          #<br>
          one = [</code></p>
    <p>      'Aacute',<br>
          'Abreve',<br>
          'Acircumflex',<br>
          'Adieresis',<br>
          'Agrave',<br>
          'Amacron',<br>
          'Atilde',<br>
          'AEacute',<br>
          'Aring',<br>
           …  </p>
    <p>      ]</p>
    <p>      #<br>
          for g in one:<br>
          	f[g].components[1].move((0,-5))<br>
          	f[g].mark = 10</p>
    <p>      f.update()<br>
    </p>
    <p>How can I move the accents down?</p>
