    html: "<p>Hi Greg. <br> <br>You have a fine idea working. However, this logo looks like it was done in illustrator version 8+ with one of the standard brush effects. I'd suggest doing it with an actual brush. Do 100 different versions. Not happy? Do a hundred more. Bing Bing Bing. Rip them out. Then pick the best one. Try different papers/surfaces. You might be so happy with the personality of the new mark, that it can live without a drop shadow. <br> <br>As a general rule: computer effects meant to simulate the real thing are seldom as nice as the thing itself. If you want a photocopied look, use a photocopier. If you want a brushed look, use a brush. Don't let the computer limit you. Go for it! <br> <br>Randy</p>"
