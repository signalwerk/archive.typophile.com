    html: <p>Hi Greg, <br> <br>I clearly see the "A", but narrowing the upper "S" curve - so that it no longer crosses the "A" - <i>could</i> make the "A" even easier to recognize. (I don't know if that's a good idea.) <br> <br>I guess you made the upper "S" curve flat on top to get a straight "A" cross bar. A slightly more curved upper "S" I <i>might</i> like more, though. <br> <br>hhp isn't so wrong when he's reminded of blood smeared on a wall. <br> <br>I'm not sure whether I like the grey shadow. The logo looks handwritten and the 3D shadow <i>maybe</i> doesn't fit in this idea. It makes the stroke ends quite frayed, too.  <br> <br>jpg</p>
