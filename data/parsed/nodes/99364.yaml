      <p>I'm not familiar with CorelDraw, but in Adobe Creative Suite, there are tools to adjust the spacing between lines so you can set consecutive lines as close as you want within the same text box. </p>
      <p>It's true that points and picas are artifacts of extinct technology, like furlongs and fortnights. And it's counterintuitive that the 36-point sizes of different faces have widely different cap heights and x-heights. But once you get the hang of it, you can easily tweak the size of a font to the desired cap height or x-height. I usually do it visually rather than with the ruler, or set guides to check alignment.</p>
      <p>Like the QWERTY keyboard, the point system survives mainly because that's what the majority of users are familiar with. Anyone attempting to get users to switch to a new system would have to overcome a huge amount of inertia. </p>
      <p>Here in the US, where we're more afraid of the metric system than we are of psychos with machine guns, the printer's point serves another useful purpose: At 1/72 of an inch (0.35 mm), it's about the smallest increment that can be seen with the naked eye.</p>
