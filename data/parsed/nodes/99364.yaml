    html: |-
      <p>Hrant: <em>But more often the paper size is pre-determined, and you can't just ignore that.</em></p>
      <p>Of course you can't ignore the paper dimensions. But you can start from those dimensions and work inwards, as typified by modernist grid systems, or you can start at the level of letters and words and work outwards. Practically, there's always some back-and-forth, but as first principles they embody different design philosophies. If the first question I am asking is 'What size should the text be in order to be comfortably read in X typeface?', this implies something quite different from first asking 'How should I best subdivide this A4 sheet for the purposes of this document?'. Both are important questions that need to be asked, but the order in which you ask them is also important.</p>
