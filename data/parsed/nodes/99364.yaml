      <p>&gt; How (other than trial and error) am I to select proper "point" size<br>
      &gt; in order to get the characters to be a certain height and/or width? </p>
      <p>Trial and error is part of the design process. You set type, judge how it looks, and make adjustments until its right.</p>
      <p>But if you need a line of type to be an exact width, just make the text box that width (or draw a line or a box onscreen that is that width) and then adjust the type size until it matches that width. No need for a ruler; every drawing program will display the width of objects.</p>
      <p>If you want type to be an exact height — for example if you need your caps to be exactly 1" tall for some reason —&nbsp;you can use a similar method of matching the height to a line or box of that height, or you can draw guidelines that are that far apart.</p>
      <p>Tip: With many applications you can adjust type size up or down quickly with your arrow keys. Just select the type and then press the arrow. Can be very handy when trying to match a width. See your application's instructions for details.</p>
