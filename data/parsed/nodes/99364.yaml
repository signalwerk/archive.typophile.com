      <blockquote><p>Why does software have me select font size in "points"?</p>
      <p>How (other than trial and error) am I to select proper "point" size in order to get the characters to be a certain height and/or width? Seriously.
      </p></blockquote>
      <p>As noted, you're really asking two separate questions here.  The point size doesn't directly correlate to the visible size of the characters.  What it measures is the height of the em-square, the (imaginary) type body.  Whether you measured it in points, millimetres or pixels, you would have the same problem (viz requiring trial and error).</p>
      <p>The great strength of measuring by point size (or em height) is that it doesn't change when the typeface does.  This is useful when you may potentially be combining different fonts within a single line at a fixed point size.  If you measure line height by a calculation based on the font glyphs themselves, things may not line up properly.  Whereas with a em-based line height, any number of 12-point fonts on a single line of type should all occupy the same vertical space.</p>
      <p>The actual units are points because, I suppose, that's what people are used to.  Since both screen and printer resolutions are normally measured in dots per inch, it's actually a more straightforward conversion than many other units would provide.</p>
      <p>On-screen, for instance: At 72dpi 1 point == 1 pixel.  At 96dpi, 1 point == 1.33333 pixels.  Et cetera.</p>
