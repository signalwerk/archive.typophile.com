      <p>Actually Q is the system that makes the most sense. It's used in Japan, and the base unit is 1/4 of a millimeter.</p>
      <p>As for what can practically be done, it's not actually hopeless - here's an idea: every font should have two additional numbers embedded: the ratio of cap height to EM, and the ratio of x-height to Em; this would allow a quick automatic scaling when the user chooses to set the size based on one of those two measures (which however would need to be supported in the software of course). Alternatively, good layout software could actually have the ability to automatically figure out what those numbers are by looking at the font, more than 99% of the time.</p>
      <p>hhp</p>
