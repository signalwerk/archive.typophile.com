      <p><em>And actually I think the point system, while old, works pretty well once you learn it. Subdividing an inch in 72 tiny increments is useful because the difference between, say, 7' and 8' type is indeed very tiny. And applications have been displaying type size in points for as long as I can remember. I know it can be confusing to newcomers, but what alternatives are there for accurately displaying type size?</em></p>
      <p>The issue raised by 'Dumpling' is not the unit system or how it relates to other unit systems such as inches, but what it relates to in the typeface, i.e. what is being measured/scaled. The fact that the body (em) that the nominal point size relates to is <em>invisible</em> and has no fixed relationship to any of the visible features of a typeface design means that you can't actually rely on it to specify the size of any visible feature. That makes it non-useful for all sorts of purposes. Further, as as typography becomes more and more internationalised, the limitations of such a system become more and more evident. It is one thing for two Latin types to be slightly different visual size at the same nominal size, but another for e.g. the Latin component of an Arabic font to need to be set at 22pt to be of equivalent size to a typical 12pt Latin font. This messes with user expectations of 'normal text size', not to mention the recurring issue of legal requirements for accessibility specified in point size.</p>
      <p>Hrant, the information required to comparatively scale types by cap height or x-height already exists in fonts, so adding explicit information expressed as a ratio seems redundant. Software that would need to be updated to make use of such information could just as easily be updated to use the existing data. But the problem with both approaches is that it is terribly Latin-centric (or Euro-centric if you prefer, since the same concepts apply to Greek, Cyrillic and Armenian, although not always compatibly).</p>
      <p>What I have in mind is a more radical but global solution, one that could result in all fonts being relatively scaleable to harmonise optically. This would require two things: a standard reference font in which the relationship of outlines to em height would constitute the value 1 of a Standard Visual Size; and a single new piece of information in fonts that would indicate the designer's proposed scaling of that font relative to the standard reference font, e.g. 0.87, 1.14 etc.. This isn't intended, of course, to replace existing scaling methods, but to enable a new way of visually harmonising types of varying on-the-body size independent of writing system.</p>
