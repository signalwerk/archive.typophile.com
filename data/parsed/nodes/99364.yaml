      <p><em>Font size, as expressed in points, is strictly a measure of how far down the page your cursor goes when you hit the return key.</em></p>
      <p>No. The distance that your cursor moves down the page when you hit return will only be equivalent to font size expressed in points if the text is 'set solid', i.e. if there is no additional interline distance. Otherwise, the cursor will either move the point size plus some explicit leading value, if that is the typesetting method being used (default in e.g. InDesign), or will move a distance equivalent to the sum of vertical metrics in the font OS/2 table (Windows) or hhea (Mac) table (default in e.g. WordPad), or will move some multiple of the sum of those vertical metrics (default in MS Word).</p>
      <p>Let me try to explain point sizing for vector form digital types as succinctly as possible:</p>
      <p>The vector outlines defining the shapes of letters, numbers, punctuation etc. in a font are plotted on a unit grid. The fineness of this grid is defined in terms of 'units per em', in which an 'em' is a square that, when scaled, will be equivalent to the nominal point size of text. The em height is directly analogous to what was known as the body height in metal type. So, for example, the vector outlines of a letter might be plotted on a grid of 2048 units per em (pretty common for TrueType fonts). When you are setting text, it is this em that is scaled to the nominal point size. Think of it this way: the em grid is like a canvas on which the letter is painted, and when you scale the text what you are scaling is the canvas, not the letter directly.</p>
