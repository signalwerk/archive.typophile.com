      <p>@dumpling:</p>
      <p>Although you've probably been bashed enough by the greedy money-grubbing type designers around here for these comments, as they involve some factual misunderstandings, I feel I need to respond as well, although hopefully in a constructive manner.</p>
      <p><cite>I cannot use typefaces with weird licensing requirements. I don't want the user of my site to have to specify how many copies of the calendar will be printed, whether their use is commercial or non-commercial, etc.</cite></p>
      <p>Ahem. You won't have to worry about that. One of the first weird requirements of any license agreement with weird requirements is: if you give access to the font to anyone else that gives them the opportunity to lie to you, and hence you let them break the agreement because you've been fooled, it's your fault. Your obligation under the license agreement is to control access to the font so that breaches are impossible.</p>
      <p>Also, most licensed fonts are licensed for use on one computer, by whoever is sitting down at it. If somebody else wants to print something with that font, they can buy their own copy.</p>
      <p><cite>In an ideal world (ideal for me, at least), the typeface designer would be paid a fair, flat fee for their labor, and then the typeface would be released into the public domain.</cite></p>
      <p>What's the obvious problem with this?</p>
      <p>Who decides which fonts are worth the expense to have commissioned in this fashion?</p>
      <p>The free market has a certain usefulness for which substitutes have not been found.</p>
      <p><cite>I want to know, if I want the characters on the page to be a certain height (think of using a wooden ruler to measure characters on a sheet of paper), then how many points do I tell the computer to use for the em sizeit uses internally to generate the page?</cite></p>
      <p>Usually, the "point size" for a font to the computer is what it uses on a printed page. It's the size of those letters on the screen that is not controllable, as users can set it to be bigger if they have poor eyesight.</p>
      <p>Incidentally, there are 72 points in an inch (in letterpress, a point is slightly smaller, 0.013837 inch), and 2.54 centimeters in an inch, and, of course, 10 millimeters in a centimeter.</p>
      <p>So a point is 0.3514598 millimeter or 0.3527778 millimeter.</p>
