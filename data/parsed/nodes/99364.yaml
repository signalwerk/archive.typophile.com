      <blockquote><p>By the way... you have thought of printing "SydSydSyd" at 100 points and measuring that to get some starting numbers?</p></blockquote>
      <p>Who's Syd?</p>
      <p>No, but I printed "250pt" and "350" in those respective sizes, together with rectangles of known dimensions (10 mm x 50 mm or 10 mm x 100 mm) for comparison. I learned:<br>
      * On the printer I used, the rectangles came out a bit too small (about 93 mm for 100 mm). I think it had to do with the page margins I chose and automatic page scaling.<br>
      * The vertical measurements were ever so slightly (by a fraction of a percent) inconsistent with the horizontal measurements.<br>
      * The overshoots (is an "undershoot" still called an overshoot?) were indeed there. Each over/undershoot is on the order of 1/140 (darn near impossible to measure accurately with the tools at hand) of the total character height.</p>
      <p>The thing with overshoots is, once you see them, it's kind of hard not to see them, which defeats their entire purpose. I have seen signs with very large lettering on which the overshoots were laughably obvious. You probably have seen such signs too. Perhaps along with "Bold" and "Italic" options for a font, there should be a "No Overshoots" option!</p>
    html_clean: |-
