      <p>Quit dumping on the dumpling, his question is entirely legitimate given what he wants to be able to do, and digital technology should enable what people want to do, not <em>force</em> them to operate by trial and error in an arcane system of type sizing inherited from long-obsolete technologies involving little pieces of metal.</p>
      <p>Dumpling, there are a couple of different aspects to the issues you are facing. First, let me explain why point sizing of type is meaningless for your purposes. What is scaled when type is specified by point size is the 'body' of the type, which corresponds to the height of the face of the piece of metal in foundry type. Of course, in digital type, this body is invisible, even to the person setting the type. What you have noted is that the visual size of individual typefaces <em>relative to the body height</em> varies. There are sometimes good technical reasons for this, which is why this somewhat arcane scaling system remains useful. For instance, if a type involves more than one writing system with different use of vertical space, or if it includes some particularly tall characters, it may make sense to 'cast the type small on the body' -- to use the old foundry terminology. Another reason why digital type might be visibly smaller than the nominal type size is inherited scaling, i.e. it was cast small in the original metal versions of the design, and subsequent technologies have inherited this scaling (see, for instance, Monotype Perpetua).</p>
      <p>Now, what you need for your purposes is a way to scale type relative to visual features rather than invisible body. And there's no good reason why software shouldn't be able to provide you with this functionality. After all, the information you need is present in the font, either in explicit form (e.g. declared cap height or x-height) or in a manner derivable from character identity and outline. I'm guessing that there is some software out there that provides such an option, but I don't know which. The first thing you should do is dig around in Corel's preferences to see if there is some kind of option to scale type by e.g. cap height.</p>
      <p>The linespacing issue you mention is related, but a bit different as it is particular to digital type. Fonts have sets of vertical metrics data that software uses to determine default linespacing <em>when software is not using explicit leading values set by the user.</em> Since these vertical metrics data are font-specific, different types will have different default linespacing at the same nominal size. Again, there are good technical reasons for this. The good news is that almost all software -- even MS Word! -- provides means for the user to specify linespacing as an absolute value (usually in point size) for selected text. So you should be able to easily resolve this aspect of your problem.</p>
