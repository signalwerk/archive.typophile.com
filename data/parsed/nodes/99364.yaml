      <p>Indeed.</p>
      <p>Pancho Gálvez, in his nice book <em>Educación tipográfica</em>, suggests, IIRC, that one could turn to points/picas for all the measurements on the page. To me that would be impossible.</p>
      <p>Just before the worldwide onslaught of DTP software from US companies made it irrelevant, there had been in Europe a proposition of an adjusted Didot point measuring 0.375 mm (instead of the traditional 0.3759), which would make 8 pt = 3 mm, fitting metric pages more easily. I have a nice Faber-Castell typometer using that revised Didot point, and when I used to do this sort of work more often I would reset QuarkXPress's Didot point to this value.</p>
