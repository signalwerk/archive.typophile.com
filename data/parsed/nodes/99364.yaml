      <p>It goes like this:</p>
      <p>I'm trying to automate the process of generating the calendars. The key word here is "automate".</p>
      <p>My goal (it remains to be seen if I will reach it) is to set up an online service to generate just this sort of calendar on the fly. I intend to use software called FPDF for this. (Maybe this is the wrong software. I don't know. But I'm not going to spend hundreds of $$$ for something that will turn out unusable anyway.)</p>
      <p>Now. I'm in America. We do not use A4 paper here. I originally designed my calendars for A4 paper, and I found out the hard way that nobody around here has it. Another thing I found out is that dealing with available paper margins is a pain, and a rather expensive pain if you go to get your calendars printed and get them all off-center because you went closer to the margin than their machines are set up to support.</p>
      <p>So. I am planning on setting up a service where the user specifies what paper size she has available, and how close to the edge of the page it will print. I will probably have a test page or two so she can see how her printer deals with margins. She will of course also specify what time period she wants the calendar for, which (if any) region's holidays she wants on it, etc. Maybe there will be an option for her to choose the typeface. (I like DIN, but maybe she doesn't. Any ideas, folks?*) And as the calendar will be generated <em>without human eyes to look it over,</em> I need a way to get character size and position from point size and position.</p>
      <p>* I cannot use typefaces with weird licensing requirements. I don't want the user of my site to have to specify how many copies of the calendar will be printed, whether their use is commercial or non-commercial, etc. (What if the calendars are being used by a business for the business's internal use? Is that commercial or non-commercial?) I'm not a lawyer and I can't afford a lawyer. So I must use fonts without strings attached.<br>
      In an ideal world (ideal for me, at least), the typeface designer would be paid a fair, flat fee <em>for their labor,</em> and then the typeface would be released into the public domain. But this is not an ideal world.</p>
