      <p><em>And who would determine that?</em></p>
      <p>The type designer. The whole point is, as you say, that eyes -- and preferences -- vary, so there is never going to be a single, optimal solution. What I am suggesting is a means of establishing a base reference to overcome the most obvious problems of the current system; I fully expect that typographers would want to refine the results according to their own eyes and tastes, but the point is that they already have plenty of means by which to do that. What is lacking is a means to automate harmonious visual scaling according to the Pretty Darn Good criterion. I think the best way to do that is to put it in the hands of the same people on whom we rely to make all sorts of other judicial decisions about aspects of how fonts work: the type designers. What they need, though, is a standard reference against which to make those judicial decisions.</p>
