      <p>In CorelDraw you can set how you specify  text size by going to Tools &gt;options (Control-J) &gt;text. In the dialog box you can then set the default units to inches, millimeters, picas, points, ciceros, didots, or Q. I don’t know what Q is but 24 points is  but 24 points is 33.867 Q.</p>
      <p>Character formatting tools are at Text &gt; Character formatting and Text &gt; Paragraph formatting. Adjustments to leading and paragraph spacing, are measured by percent of character height, points or percent of point size. Adjustments to tracking (character spacing in Corel) and word spacing are by percent.</p>
