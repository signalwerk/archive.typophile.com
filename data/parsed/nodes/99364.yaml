      <p>&gt;  And there's no good reason why software shouldn't<br>
      &gt; be able to provide you with this functionality</p>
      <p>I think newer versions of InDesign can set a word or phrase to a given width (although I've never used that feature), and perhaps other page layout or drawing programs do too.</p>
      <p>But while people commonly need to set a *column* to a certain width, setting a particular word or phrase to an exact height or width — such as "I need this word to be exactly 2.73" wide" — is not something that most people need to do every day, and when needed it can be accomplished fairly easily by making a text box that wide and adjusting point size until the width matches. I'm not sure it's a feature that many users are asking for.</p>
      <p>And actually I think the point system, while old, works pretty well once you learn it. Subdividing an inch in 72 tiny increments is useful because the difference between, say, 7' and 8' type is indeed very tiny.  And applications have been displaying type size in points for as long as I can remember. I know it can be confusing to newcomers, but what alternatives are there for accurately displaying type size?</p>
