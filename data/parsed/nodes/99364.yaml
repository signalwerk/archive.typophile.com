      <p>If there is only one line of text, then leading is a meaningless concept.</p>
      <p>I have done some shopping online for rubber stamps, specifically date stamps. Character size is expressed in the same units of measure you use for tasks unrelated to typography.</p>
      <p>I have designed calendars. I have posted one of them on the "Typography / composition" board, under the title "Page-per-week calendar design".<br>
      * For the month numbers at the top of the page, as well as the week numbers at the bottom of the page, I wanted the characters to be of such a size as to just barely fit within certain margins. Only by trial and error could I do this.<br>
      * At least in the cells for Monday through Friday, I wanted the date numerals to be centered vertically. Again, trial and error.<br>
      * I wanted the numerals at the bottom to be a certain exact distance from the edge of the page. Same deal.</p>
      <p>The way I see it is, anything that isn't ink should not be included in the measurement.</p>
