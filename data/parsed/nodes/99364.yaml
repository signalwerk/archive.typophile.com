      <p>So, I can deal with decimals.</p>
      <p>Or rather, my computer can.</p>
      <p>:o)</p>
      <p>My point in saying that the kind of unit used is irrelevant is that I understand the original question to be about how to determine the dimensions of the visible portion of type and the space above and below. </p>
      <p>Ultimately, as designers, why care? If it looks right to your eye, then it is right. We ain't tool and die makers when we make calendars. None of this matters until you have to replicate a layout or build something with real materials, in which case all the data you need is already there. You can round your dimensions off to fit an existing standard or you if feel that that makes life easier, or you can live with something cumbersome like 19.976 barley corns, because you don't need to remember it. (Or even know it.) Your computer does that for you. </p>
      <p>While it is possible to obtain that data from the font itself this is already done to a certain extent.  llustrator and CorelDraw both recognize the base line. </p>
      <p>I design signs for a living and am, always having to set sigle lines of type to specific cap heights and place them  in precise locations on sign faces  - using the methods described above. When spec'ing for sign shops and design consultants, I'll define the cap height and, if I am concerned they might have limited skills in the field, I provide the size in points that will produce the size of text I want. I.e, to get a cap-height of 25mm, and in brackets, I specify 106 points* (for ClearviewADA).</p>
      <p>* 0.149 points, or 0.053 mm or 0.0021 inches too large, which is an acceptable magin or error</p>
