      <p>As it turns out, I <em>am</em> able to use the baseline as a reference point, which makes things much easier. Now all I have to do it find the conversion factor between points and millimeters. (More trial and error, I guess.)</p>
      <p>Here is a little "demo" of what I have so far: <a class="freelinking external" href="http://pdf52.comyr.com/phpstuff/pdftest2.php" rel="nofollow">http://pdf52.comyr.com/phpstuff/pdftest2.php</a></p>
      <p>I know it is not nearly finished.<br>
      * I have hard-coded start and end months as January 2013 and March 2013, respectively. Ultimately, the user will choose the months, as well as many other options.<br>
      * If all goes according to plan, the finished calendar pages will have the same sort of information as in the sample page I posted earlier in this thread. (week numbers, sunrise / sunset times, moon phase info, local holidays)</p>
      <p>Boy, it is surprisingly simple to come up with something that looks like it rivals a commercial product. Well, not quite. The (lack of) alignment of weekday abbreviations with date numerals is something I need to work on.</p>
      <p>I intend to make this available as a free, public service. Any profit will be made by sale of <em>physical, paper</em> calendars, as well as possibly commission fees for custom calendars.</p>
