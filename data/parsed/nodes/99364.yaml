    <p>Why does software have me select font size in "points"?</p>
    <p>How (other than trial and error) am I to select proper "point" size in order to get the characters to be a certain height and/or width? Seriously.</p>
    <p>I recently designed some calendars in CorelDRAW and the <em>only</em> way I could know the size of characters I had selected was to measure them with the on-screen ruler.</p>
    <p>Same thing with the position of the characters. Even if I only want a single line of text, there is still obligatory whitespace above and below, which I have to measure and compensate for. I deal with text boxes overlapping, even when the text itself does not even come close to overlapping; it is the fault of this obligatory whitespace.</p>
    <p>Are there standard ways of dealing with these issues?</p>
