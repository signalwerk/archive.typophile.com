      <blockquote><p>Now all I have to do it find the conversion factor between points and millimeters. (More trial and error, I guess.)</p></blockquote>
      <p>I brought this up before: which part of a simple calculation is <em>trial and error</em>?<br>
      1 point = 1/72 inch<br>
      1 inch = 25.4 millimeters<br>
      So 1 point is ~0.353 millimeters</p>
      <p>But, yet again: you still can't predict how large parts of letterforms will end up in the Em square, because there are ballparks, but no benchmarks.</p>
      <p>hhp</p>
