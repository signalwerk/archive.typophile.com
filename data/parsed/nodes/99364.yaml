    html: |-
      <p><em>In an ideal world (ideal for me, at least), the typeface designer would be paid a fair, flat fee for their labor…</em></p>
      <p>Ah-ha, Dumpling is a communist!</p>
      <p>@Hrant: <em>…if you want a block of text to harmonize with the rest of a metric-system layout, the point is non-ideal…</em></p>
      <p>I always set the page size units to be in picas, whether metric or imperial.<br>
      Then the margins and gutters come out to be manageable integers.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Layout_5286.png"></div><br>
      Here is a Letter-size layout I did with horizontal metrics in picas of:<br>
      3 + 14 + 1½ + 14 + 1½ + 14 + 3 = 51<p></p>
      <p>A comparable layout for A4, in centimeters would be:<br>
      1 + 6 + 0.5 + 6 + 0.5 + 6 + 1 = 21</p>
      <p>Not bad, but needs a bit more width in the margins and gutters, I would say.</p>
      <p>The body type is 9/12 and the headline 24/30 in points.<br>
      That’s 3 mm on 4 mm (2 on 4 if one goes by cap height), and 8 mm on 10 mm.<br>
      Not bad, but the difﬁculty arise for the “next” body sizes.<br>
      If I had decided that the leading should be less, it’s easy to take it down a notch (or half) in points—9/11 (or 9/11½)—but that would be 3 on 3.8 (or 3 on 3.9), which makes ﬁguring out vertical metrics of the page more complicated.</p>
      <p>Perhaps I am wrong on this; I’d be interested to hear from designers who work in metric how they handle similar layouts—I might even theorize that the units used have some inﬂuence on cultural style.</p>
