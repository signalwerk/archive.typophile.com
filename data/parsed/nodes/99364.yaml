      <p>@dumpling  I'm still a bit confused as to your dilema. I think you are struggling with two issues.</p>
      <p>1) Converting points to a unit of measurement you'd prefer. Hrant gave you the forumla for that. That's simple math, no big deal.</p>
      <p>2) Measuring the height of the printed glyph. This is the part you can't readily do based on the 'type size', since the point size of type refers to the bounding box that all the glyphs have to fit in. </p>
      <p>There's no 'fix' for within the font file. This simply because most fonts will have glyphs of wildly varying heights. A simple example being a 'g' vs. 'Q'. But then you also need to account for punctuations, special characters, accent marks, swashes, ligatures, etc.</p>
      <p>Programtically, you might be able to fix this by rendering the type and then some how evaluating the generated pixels.</p>
