      <p>This is true, but it is also somewhat irrelevant, since his statement was simply a complaint that point size has no fixed ratio to x-height or cap height and so on.</p>
      <p>Also, there is another exception, at least in some word processors. Sometimes, two fonts will have different baselines, and mixing them on the same line at the same point size will result in the line taking up additional space corresponding to the difference in baselines.</p>
