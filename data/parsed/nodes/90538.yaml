      <p>Yeah, no kidding. Here, I fixed that for you:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Columbia_old_4371.gif"></div><p></p>
      <p>Only because I happen to know their old logo (above) was set in <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/itc-galliard/" rel="nofollow">Galliard</a>.  :)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Columbia_new_4075.gif"></div><p></p>
      <p>New logo (above) is probably custom-drawn to look Galliard-like (note the weird “a”), but with beefed-up serifs. The “Trying stuff” tagline is <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/dispatch/cond-bold/" rel="nofollow">Dispatch</a></p>
