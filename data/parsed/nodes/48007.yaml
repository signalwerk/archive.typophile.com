    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Software" class="freelinking" rel="nofollow">Software</a> : <a href="/wiki/Design%20Applications" class="freelinking" rel="nofollow">Design Applications</a> : XeTeX</strong></p>
    <p>XeTeX is a document preparation system based on the <a href="/wiki/TeX" class="freelinking" rel="nofollow">TeX</a> typesetting program and works with both <a href="/wiki/LaTeX" class="freelinking" rel="nofollow">LaTeX</a> and <a href="/wiki/ConTeXt" class="freelinking" rel="nofollow">ConTeXt</a>. It is created by <a href="/wiki/Jonathan%20Kew" class="freelinking" rel="nofollow">Jonathan Kew</a> of <a href="/wiki/SIL" class="freelinking" rel="nofollow">SIL</a> to be used with Unicode, currently it supports <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> and <a href="/wiki/AAT" class="freelinking" rel="nofollow">AAT</a>.</p>
    <p><a href="http://scripts.sil.org/xetex" title="http://scripts.sil.org/xetex">http://scripts.sil.org/xetex</a></p>
