  html: |-
    <p>I would really appreciate a few suggestions. I should also add that this identity project is a real low budget wonder so I can't buy a font.</p>
    <p>The project is for a southern old country-style press that is printing really modern comics. So I used rosewood fill hand kerned for the logo. Now I have to come up with a font to put everything else in: I want it to go and look intentional, but express the old/new part too.</p>
    <p>here are the sans serif fonts I am considering (own), please help me pick one (it will be in all caps):</p>
    <p>interstate<br>
    helvetica neue<br>
    avenir<br>
    meta<br>
    rotis<br>
    swiss</p>
    <p>thanks for any and all suggestions!</p>
