    html: <p>I’d go with something that strong geometric features, a friendly tone,  and a classic look to contrast the decoration in Rosewood; Neutraface or Futura would both work, as would Avenir. The neo-grotesks seem less appropriate; they’re a little to cold and inhuman to pair with Rosewood, and even though Meta is warmer than helvetica, interstate and swiss, it feels to new to pair with Rosewood.</p>
