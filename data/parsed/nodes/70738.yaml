    <p>Hey Canadians,</p>
    <p>I'm quite new at the freelance game and I'm at the beginning of the process to obtain my GST number. Or at least I thought I was until the new HST made me question what to do.</p>
    <p>With the new HST set to begin in Ontario is this going to change what I need as a freelancer? Do I still need to get a federal GST number?</p>
    <p>I'm assuming design services are now taxable for the full HST amount falling under professional services? If I'm charging a client in another province that also has HST, do I charge them my provincial HST tax rate (Ontario) or the client's provincial HST tax rate?</p>
    <p>I'll go searching for these answers but just thought that maybe some of you veterans would have an idea what I need to do.</p>
    <p>TK</p>
