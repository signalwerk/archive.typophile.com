      <p>Get an accountant!</p>
      <p>I'm in Quebec, sans HST but our 'unique' government manages the GST along with the provincial tax. The Federal site has a very good introduction to how it all works, and when I had to get clarification, the tax agent helped me greatly. It would probably be a bad idea for me to pass on any info I got, since Quebec laws may not apply to your case. Even if you don't get an accountant, get some professional advice.</p>
