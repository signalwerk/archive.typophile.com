    <p>Hello,<br>
    I have a question about the following picture.<br>
    </p><div class="imageWrap"><img src="/files/Pic1.jpg"></div><br>
    From time to time I like to open up exisiting fonts<br>
    in Type Tool to see how they work. I recentley opened up<br>
    Helvetica Regular and noticed that on the C they have<br>
    these guidelines, in Tpye Tool it is located on the Vector<br>
    control layer, that follow the curve. When I erase the<br>
    guidlines it then erases the  section of the font.<br>
    What are these lines for and how do you use them?<br>
    Thanks!<p></p>
    <p>j o s e p h</p>
