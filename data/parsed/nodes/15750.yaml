      <p>My ex uses Sibelius. You can also get (or it comes with?) software used with your scanner to drop a handwritten score into Sibelius. The handwritten score has to be neat and tidy for the program to pick up everything, though, and may require some adjustments.</p>
      <p>K.</p>
