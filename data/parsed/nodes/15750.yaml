      <p>Ages ago I used a great program called <a href="http://www.scoremus.com/score.html">Score</a>, but I haven’t had any need as of late. If you like the way the Henle* editions are set, you should like the results with Score. </p>
      <p>*Henle doesn’t used Score, but they are widely available engraved editions that are a joy to read.</p>
