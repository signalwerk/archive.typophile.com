      <p>Thank you both for your comments. Those were the two programs I had heard about (I was hoping there might be others).</p>
      <p>I found this article:<br>
      <a href="http://www.jefferycotton.net/info.asp?pgs=hairpin" title="http://www.jefferycotton.net/info.asp?pgs=hairpin">http://www.jefferycotton.net/info.asp?pgs=hairpin</a></p>
      <p>It would seem to say that Finale is the better choice, as does most of the chatter on the web on the subject. But I wonder if it is not a Quark versus InD debate...</p>
      <p>Tiffany, if your brother has used both, I would love to know what his feelings are on the subject!</p>
      <p>- Robert</p>
