    html: "<p> &gt; What have you heard about Flash? <br> <br>Heard: <br>That the difference between a protected Flash movie and non-protected one is one byte: you set it to the right value, and you can load up the movie in Flash, and access the font. <br> <br>Seen: <br>About a year ago, to prove a point, somebody emailed me one of my fonts (in TT format - the original was T1) extracted from a Shockwave movie on my site. At that time I had not yet sold any copies of that particular font, but had *possibly* given a single copy to one person (unrelated to the person who emailed me) - I don't remember. <br> <br>&gt; I think [PDF is] the best format for people who'd like to print test the specimens as well as preview them on screen. <br> <br>I agree for printing. But for the screen I see a number of problems with PDF: it's not live; it's big/slow/clunky; and it doesn't integrate into a web environment like Flash does. SVG is supposed to fix some/all of those, but it's not being supported (which I don't mind - SVG just doesn't smell right to me, for some reason). Oh, and what about MS's WEFT/EOT and BitStream's TrueDoc stuff? <br> <br>BTW, I should say that I'm actually a lot less concerned with security than I might have sounded. My motivations in this thread are: <br>1. I just like to *know* what's going on. <br>2. I'll be posting samples of a new font in the Typophile Forums, and would like to avoid having old/incomplete versions floating around by the time I release it. <br> <br>&gt; I figure if someone has the technological savvy to extract fonts, they could also easily change the embed flag. <br> <br>Nice and pragmatic - my cup of tea! <br> <br>hhp </p>"
