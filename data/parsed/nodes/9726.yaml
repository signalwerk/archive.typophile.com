    html: "<p> &gt; Do you mask the specimen or not? <br> <br>No! I thought about this myself, and here's my [typically pragmatic] conclusion: <br>You have to draw an -admittedly- fuzzy line between different types of customers. Some people will buy a font with little coaxing, to be \"ethical\". Most of these people would buy it even if they could \"steal\" some (in any case notably limited) renderings. Other people will very seldom pay for type - you have to lure them in. How? Exactly by letting them \"steal\" your Flash *renderings* (but not the font). You let them become dependent on a font, and many of them will eventually break down and buy the thing, to avoid all those time-consuming screen grabs, or maybe more significantly to eventually use the font for print. I thought about this a lot, and that's why I made my Shockwave renderings as clear as possible: exposure, and addiction. <br> <br>Lose the bars, dude. Set your fonts free, and if they're good they'll go out and bring in customers better than any marketing department ever could. <br> <br>hhp </p>"
