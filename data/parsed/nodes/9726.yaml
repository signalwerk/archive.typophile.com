    html: <p> Hrant, <br> <br>You're right, PDF is not very secure -- especially with Type 1 fonts -- but I think it's the best format for people who'd like to print test the specimens as well as preview them on screen. <br> <br>I create special versions of fonts to embed in PDFs containing only those glyphs I'm displaying in the file, so if someone were to extract it, they wouldn't have the complete font. I also give them different names so that they appear, to the untrained eye, as some special system font Adobe has embedded (e.g., a name consisting of numbers followed by "_mm"). <br> <br>Another level of protection (in addition to the above) would be to generate the font in TrueType format with the embedding level set to read-only print/preview. <br> <br>I haven't tried that because I figure if someone has the technological savvy to extract fonts, they could also easily change the embed flag. But at least they'd wind up with a TrueType version (this wouldn't make sense if you were designing in TT native, in which case maybe you could embed in T1 format). </p>
    html_clean: <p> Hrant, <br> <br>You're right, PDF is not very secure -- especially with Type 1 fonts -- but I think it's the best format for people who'd like to print test the specimens as well as preview them on screen. <br> <br>I create special versions of fonts to embed in PDFs containing only those glyphs I'm displaying in the file, so if someone were to extract it, they wouldn't have the complete font. I also give them different names so that they appear, to the untrained eye, as some special system font Adobe has embedded (e.g., a name consisting of numbers followed by "_mm"). <br> <br>Another level of protection (in addition to the above) would be to generate the font in TrueType format with the embedding level set to read-only print/preview. <br> <br>I haven't tried that because I figure if someone has the technological savvy to extract fonts, they could also easily change the embed flag. But at least they'd wind up with a TrueType version (this wouldn't make sense if you were designing in TT native, in which case maybe you could embed in T1 format). </p>
