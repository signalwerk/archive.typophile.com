    html: <p> &gt; the ability to use a font in Flash (in the FLA) depends on whether you have it on your system. <br> <br>That seems very different than Director/Shockwave, where you can use a system font, or you can import a font and have it available all the time (although the "native" format isn't [necessarily] preserved). <br> <br>So how does the Flash Player use fonts that are not on the viewer's system? <br> <br>&gt; imported flash files display with arial, not the used font... at least when imported back into flash <br> <br>Do you mean when you import a non-protected SWF? <br> <br>&gt; I always thought (this is just an assumption I have no facts) that when you made the SWF from the FLA the font was made into plain vector outlines... <br> <br>If that's the case, then setting a lot of text in Flash is very inefficient (unlike if the font was available)... unless it's making Library entries for each character and then using those! <br> <br>&gt; Is an idea, for the purpose of security, to just include the basic characters &amp; not all? <br> <br>Except that for a font specimen you'd like to show all the characters.  :-/ <br> <br>hhp </p>
