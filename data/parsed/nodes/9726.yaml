    html: <p> &gt; FLA files contain all of the original media as native data, including sounds, bitmap images, and vector artwork, but not fonts. <br> <br>What does this mean, exactly? <br>1. The font is kept external to the file, like in a cache (which is maybe even less safe)? <br>2. The font is converted (as we already know) when it's imported into Flash, so the "native" data is gone? But this could just mean that you get a TT instead of a T1 - and I *have* also heard that Flash prefers the TT format as the source (as long as it's native TT, not stuff Fog exports). <br> <br>BTW, interesting links. <br> <br>hhp </p>
