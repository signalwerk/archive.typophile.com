  html: <p>I've taken part in many discussions about the flaws/merits of the various ways of presenting type specimens on the web. But one thing that I've yet to get a handle on is the security aspect (referring to the extraction of fonts by hackers). <br> <br>Bitmaps are of course totally safe (except for bitmap fonts! :-), but they're yucky in so many ways. Even the ones that generate images of user-defined phrases real-time are uninspiring to me. I personally like specimens where you can type "live" (like on http://www.typography.com/ - although I actually think those horizontal jail bars make things worse overall). So if one wants to use a technology which uses the outline font (in one incarnation or another), like PDF, Flash, etc., what are the relative security merits of each? <br> <br>There is general agreement that PDF is not highly secure, but many large, established font houses use them. There is also general agreement that Flash is highly secure, but I've been shown with 90% credibility that it's not. <br> <br>So far I've been using Shockwave* (not Flash), but that was a temporary solution - even though it's been two years now... :-/  So what should I *really* use? <br> <br>* <a href="http://www.themicrofoundry.com/f_arasan.html" target="_top">http://www.themicrofoundry.com/f_arasan.html</a> <br> <br>hhp</p>
  html_clean: <p>I've taken part in many discussions about the flaws/merits of the various ways of presenting type specimens on the web. But one thing that I've yet to get a handle on is the security aspect (referring to the extraction of fonts by hackers). <br> <br>Bitmaps are of course totally safe (except for bitmap fonts! :-), but they're yucky in so many ways. Even the ones that generate images of user-defined phrases real-time are uninspiring to me. I personally like specimens where you can type "live" (like on http://www.typography.com/ - although I actually think those horizontal jail bars make things worse overall). So if one wants to use a technology which uses the outline font (in one incarnation or another), like PDF, Flash, etc., what are the relative security merits of each? <br> <br>There is general agreement that PDF is not highly secure, but many large, established font houses use them. There is also general agreement that Flash is highly secure, but I've been shown with 90% credibility that it's not. <br> <br>So far I've been using Shockwave* (not Flash), but that was a temporary solution - even though it's been two years now... :-/  So what should I *really* use? <br> <br>* <a href="http://www.themicrofoundry.com/f_arasan.html" target="_top" class="link-external">http://www.themicrofoundry.com/f_arasan.html</a> <br> <br>hhp</p>
