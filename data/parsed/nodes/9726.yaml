    html: <p> Joe's pretty much covered my feedback on this topic. I've always assumed that if anyone were able to extract the vectors, they would have to rebuild the font manually by pasting those vectors back into a tool like Fog. <br> <br>The precaution? When we build the HTF Testdrivers, we included a limited character set just in case someone, someday, was able to extract them. But so far I've never heard of anyone doing it successfully.  <br> <br>FWIW, I definately prefer a Flash-based interface over one where it renders type as a pixel-based image. <br> <br>The bigger question in my mind is, Do you mask the specimen or not? Without any visual noise (ie. the horizontal bars at HTF), what's to stop people from setting type and screenshotting it for use on their site, etc? </p>
