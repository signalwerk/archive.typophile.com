    html: <p> &gt; .... re-importing the unprotected .swf .... <br> <br>So where's the font? If the correct font shows up when a third-party browser accesses the file, it must be *somewhere* in there. Maybe the SWF contains the font *and* a reference to the font, and when you *play* the file it shows up, but when you *reload* it, it doesn't. This would make sense because it avoids unnecessary loss in quality for the author* (if he reloads a SWF). What's really cool is that this in effect might be a great form of font protection! (Assuming protected SWFs -which can unfortunately be cracked- do the same thing; I'm guessing they do. Does anybody here know how to crack a protected SWF? We should try importing one and see how the font shows up.) <br> <br>* Although third-parties would end up fontless... But I guess they're not "supposed" to open a SWF anyway! <br> <br>Spiral, if you have the inclination, could please try playing the un-protected SWF on *another* machine (and one that doesn't have the font installed)? <br> <br>BTW, this might [help] explain the (related?) confusion with "FLA files contain all of the original media as native data, including sounds, bitmap images, and vector artwork, but not fonts." <br> <br>hhp </p>
