rive at Hoefler's or Thirstype's site. <br> <br>Through some friends, working daily with Flash, I have also  <br>put the question on different Flash communities. All the  <br>answers concluded that they  wouldn't know how to extract a font <br>&amp; no one had heard of any software that did so. <br> <br>Working on a big update of my site, where Flash is the way I show all  <br>the specimens, I really hope that it's safe enough. <br> <br>Just from the top of my head i can think of some  <br>foundries that also uses Flash: <br> <br>psyops.com <br>typography.com <br>thirstype.com <br>t26.com <br> <br>theres's probably more <br>I guess they wouldn't use it if it wasn't safe?  <br>Anyone from those sites reading this? <br> <br>/peter </p>"
