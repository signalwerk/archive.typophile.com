    html: <p> Peter, the FLA is the native Flash format that you edit and work with. The SWF is the file you export before publishing the file to a site. Just like the difference between a PhotoShop file and a GIF or JPG. So, the ability to use a font in Flash (in the FLA) depends on whether you have it on your system. <br> <br>So, Peter the FLA isn't the file you'd distribute anyway. Pardon me if you already knew this... perhaps I misunderstood you. <br> <br>Hrant, there's no caching of fonts involved. Further, the font is not converted when you use it in Flash. It is however set to outlines when you export it to SWF format. <br> <br>//joe </p>
    html_clean: <p> Peter, the FLA is the native Flash format that you edit and work with. The SWF is the file you export before publishing the file to a site. Just like the difference between a PhotoShop file and a GIF or JPG. So, the ability to use a font in Flash (in the FLA) depends on whether you have it on your system. <br> <br>So, Peter the FLA isn't the file you'd distribute anyway. Pardon me if you already knew this... perhaps I misunderstood you. <br> <br>Hrant, there's no caching of fonts involved. Further, the font is not converted when you use it in Flash. It is however set to outlines when you export it to SWF format. <br> <br>//joe </p>
  - id: 148655
    user: 1160
    date: 2002-01-17T16:49:00
    date_raw: 17 Jan 2002 — 4:49pm
    votes: null
    html: <p>Peter, you're right. When you export the native  <br>Flash file (FLA) to an exported file (SWF) it  <br>turns all fonts into outlines. There is no way to  <br>export a SWF without turning fonts to outlines. <br> <br>You're also right that Flash only embeds the <br>characters you use in the file. <br> <br>Further--Hrant's second guess is correct--if you  <br>use a particular lc k 43 times in a single SWF,  <br>the user only downloads one lc k. Flash merely  <br>references other instances of the 'symbol.' (This  <br>is one of the main reasons SWF is such a brilliant  <br>web medium--it's very economical to download.) <br> <br>Let me clarify one last point. When you view an  <br>exported Flash file (SWF), you are viewing  <br>whatever fonts the creator used in the native  <br>Flash file (FLA)--which are only available if  <br>that creator had the fonts on his/her system.  <br>Viewing fonts in a SWF is totally independent of  <br>fonts you have in your system. Sorry if I led you  <br>astray. <br> <br>Jared's modesty prevented him from taking credit for  <br>building the font preview mechanism at  <br>http://www.typography.com. It's 'real time'  and is not as  <br>cumbersome as some GIF-based mechanisms  <br>because it's built with Flash. <br> <br>//joe</p>
