      <p>I personally like Antique Olive. It's got a lot more personality than most sans serifs. Its non-uniform stroke weight contributes to this, as do the vertical cutoff on the <strong>C</strong>, <strong>G</strong>, and <strong>S</strong>, and the idiosyncratic shape of the bowls on the <strong>B</strong>, <strong>P</strong>, and <strong>R</strong>.</p>
      <p>I've never used Antique Olive smaller than 12 point. You may be able to read it at 8 point--if you're an undergraduate, you're probably younger than my children--but I can't, and some of the people you want to read your resume are my age.</p>
