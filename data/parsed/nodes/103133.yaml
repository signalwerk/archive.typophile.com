      <p>When working with such an unconventional and expressive typeface, I would strongly consider relying on its family of weights and styles alone. Optionally, you can leave the expressiveness to display and tone down the text.</p>
      <p>Btw, <a href="http://typographica.org/on-typography/farewell-evert-bloemsma/" rel="nofollow">Bloemsma</a>’s <a href="http://typographica.org/on-typography/our-favorite-typefaces-of-2004/" rel="nofollow">Legato</a> and <a href="http://www.daidala.com/25sep2002.html" rel="nofollow">Avance</a> are also worth exploring.</p>
