      <p>Hi there, that's a great thing you pointed out, thanks a lot. My worry is that the letter shapes will start to call too much attention to themselves (with the big counters and vertical emphasis, regrettably, some of the very things I like about the typeface), especially since it's used as body text. </p>
      <p>Maybe it's too much for a resume...I'll keep experimenting with Antique Olive and also trying out some other options. In the mean time, does anyone have suggestions for a similar sans serif that's a bit more understated and appropriate?</p>
