    <p>My first post here. hiii : )</p>
    <p>I'm wondering about general thoughts on pairing Antique Olive with Chaparral Pro? There seems to be few discussions on the former typeface and I'm wondering if someone could offer their insights. This is for resume &amp; portfolio layout, with light Antique Olive as body text (8/11 pt) and light Chaparral Pro as headers in all caps at 8pt.<br>
    Being a type novice and new to this font combination, I'd greatly appreciate any thoughts or opinions.</p>
    <p>Some concerns I have are:<br>
    1) readability<br>
    2) the general impression it conveys<br>
    3) hisory/cultural associations?</p>
    <p>I like Chaparral, and in looking for a san-seirf complement I came across Antique Olive. Personally I enjoy the big x-height and the warm, statuesque feeling the typeface conveys. However I've heard that this is a hard typeface to work with and I'm afraid that it might be attracting more attention than it wants as a body text? I thought about using Chaparral as body text, but felt that it's a bit too delicate and distracting for my taste.</p>
    <p>Regarding big x-height and readability, here's a thread that discusses it at great length: <a href="http://typophile.com/node/31427" title="http://typophile.com/node/31427">http://typophile.com/node/31427</a><br>
    I'm keeping the body text at fairly short lengths (5-10 words per line), and have increased the leading, but still not totally sure if everything works together. Any comments, thoughts, opinions? </p>
    <p>Thanks in advance.</p>
