    html: <p>Not sure what you're looking for, but Autocad ships with ISOCPEUR (proportional) and ISOCTEUR (fixed pitch). Standards include DIN-ISO 3098 (Part 5 for Latin lettering) and DIN-ISO 10646. Luc Devroye has a page on CAD fonts at <a href="http://cg.scs.carleton.ca/~luc/autocad.html" title="http://cg.scs.carleton.ca/~luc/autocad.html">http://cg.scs.carleton.ca/~luc/autocad.html</a>.</p>
