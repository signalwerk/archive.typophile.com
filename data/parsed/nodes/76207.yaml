    html: |-
      <p>I find this hard to understand as 'a poster', posters originated as bold and clear pieces of print; this is confusing, uninformative and provides me with very little. Other than a passing glance I would be disinclined to give this any more of my time. </p>
      <p>Maybe work on some stronger type, more info and more simplicity in the repetition. I believe a concept is present but its far from complete, repeating and rotating what could essentially be a page with 4 words on it doesn't do it for me.</p>
      <p>Sorry if that sounds negative but here's a few pointers:</p>
      <p>- Get the type to stand out more, larger/more swiss typeface.<br>
      - Consider some colour unless you have a limited brief, maybe white background with black/red laid over?<br>
      - Simplify the 'optical illusion' and try and make more of a stylish feature of it than what I dare call 'a mess'</p>
