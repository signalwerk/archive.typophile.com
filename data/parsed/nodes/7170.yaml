    html: <p>Gerald Lange, <br>Thanks for your help. Luckily I am not expecting to much. Really I just want to get my hands dirty. Even locking up a small chase, I think, may have its merits. Then, I can move onto bigger things as space and ( even just a little) experience comes along. It will also get me started on gathering up some very basic tools. I'll be using you book as a guide when I get there. <br> <br>Nick, <br> Your attachment to your press and the experience you describe have kept me encouraged. To hear that someone self-taught and isolated can get a few years of use out of such a simple press will keep me soldering on. ; ) <br>For now, I managed to a hold of a <a href="http://www.briarpress.org/cgi-bin/briarpress/show.cgi?db=press&amp;uid=default&amp;ID=1047&amp;view_records=1&amp;popup=1"> Chicago No. 10.</a> I don't know how it compares to the Adana, but is sure is good looking! It is in pretty good shape, but, my plan is to restore it to all of its original glory. It will be quite pretty- gold details and all. It is a first press anyway. Now I need rollers! Eh. <br> <br>Hrant,  <br>As for the type I got I am still identifying some of it but I know I do have quite a bit of Piranesi. Not something I would have picked out but it could work for greetings and the like. I need a nice Roman. I plan to see a man about a horse ( so to speak ) before to long. He has tons of type that he will never use again. I buttered him up awhile back to see how he would feel parting with it. Let's hope it worked because now I have a press. <br> <br>Gerald Giampa , <br>I have orded a copy of <i>Printing for Pleasure</i> per your advise. Thanks for the help. <br> <br>Sean</p>
