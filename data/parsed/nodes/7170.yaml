    html: "<p>Monotype depth of drive: <br>American composition cellular mats are .030\" depth. <br>American large composition cellular mats 14 to 24 pt inclusive are .050\" depth. <br>American Giant Caster Caster mats 42 to 72 point are .065\" depth. <br> <br>British Monotype composition mats, all sizes from 5 to 24 point are .050\" depth. <br>British Monotype Super Caster mats are .065\" depth. <br> <br>All of these mats are interchangeable between all models of American and British Monotype caster with the appropriate matrix holders and molds. <br> <br>The strength of kerns is anhanced with a deeper drive, so type cast from British Monotype cellular mats is stronger than that cast on .030\" depth American mats. <br> <br>The deeper or shaller the drive has no bearing on how closely the type can be fitted, since the punches are milled to a vertical wall at both left and right sidebearing, and at the head and foot to avoid hanging of the body pointwise. <br> <br>This verticality does not create a difficulty in allowing the matrix to be lifted off the newly cast letter. <br> <br>The problem of variance in alignment from one series of casting from another is completely operator oversight. Each series of typeface has a strict and rigid standard of alignment for the baseline in the form of a numbered steel alignment slip (sort of like the Greenwich Time) which is used on a viewing stand when aligning the cast. <br> <br>Setwise fitting is also accurate if certain procedures are observed: an operator can use either the em dash centered setwise on the body or in the case of British Monotype cell mats, an alignment \"star\" is placed in the matrix case. If this is centred point and setwise, alignment and fit are accomplished accurately all in one. <br> <br>The matter of Monotype type being inferior to foundry is of course true to a degree. <br> <br>1. When a person is buying Monotype compsoition castings, whether it is in the form of comped pages or packaged \"fonts\", that person is not really buying a type font that is meant to last forever. It is a shame that the foundries that have done and are still casting composition castings as foundry fonts do not make a note of the fact that it is not foundry type. By its nature comp cast type is made in a soft grade of metal, and the Monotype Composition Caster does not have the physics or the strength to deliver the molten metal into the mold cavity in a dense enough manner to make foundry type. A foundry automatic caster works on an entirely different principle verging on brute force. When I cast a font of 10 point for somebody on the Composition Caster, I use hard resmelted foundry metal (ATF, S&amp;B) and the like in the melting pot. This makes the type last a lot longer, but it still is not Foundry type. <br> <br>2. Monotype Composition mats used on the Thompson Caster with hard foundry metal is very nearly as good as any ATF or Stepehnson Blake type, but ATF is still superior. The same stands for Monotype Display mats used on the Thompson to cast display type. I won't argue that the results are 100% as good as ATF, but ATF ain't there anymore, and the only type a person can find from that company is now either worn, missing characters or to be found in broken sizes. If I were buying type to begin a life in letterpress I wouldn't turn up my nose at well made Monotype type. <br> <br>3. Anyone insisting that they must have typoe that is made on a foundry automatic (Barth, Kusterman etc) can have it. Theo Rehak of The Dale Guild is an ex-ATF foundryman, and operates more than a dozen of their old Barths, making limited selections of types. I may be wrong, but I think if anyone wants a full run of ATF Garamond from 8 point to 72 they might be out of luck. On the other hand if they will settle for well made Monotype, it's possible. <br> <br>Making type, aside from knowing how to release the pump handle, is a matter of how much care the typefounder is willing to put into making the type. I have just completed cutting and casting one of my new designs: 24 and 36 point Duensing Titling. The fonts were cast on my Thompson. I discovered shrtly after I shipped off the last font, that the extremely long tail on the Q was far to fragile to last. I got bust an re-cut both the Q and the U to an .075\" depth of drive (since for most applications Q and U are a pair) and cast up more than enough replacement letters to go with the fonts. Since they came out .025\" over type-height, I milled the feet down to make the type the correct height. I have mailed these off to the people who bought the fonts so that they won't have any breakage problems on the press. This last comment is only to stress that things can be done to make type better. I certainly don't want anyone to buy a font from me and be sorry they did. <br> <br>Some of when casting for ourselves, will cast special kerns (as Hrant noted; y.) and things like ATA, AYA etc. <br> <br>Many fine pieces of work have been and are still being done using Monotype. If I could offer this: Monotype composition type was never intended to fill your cases for use from here to the end. On the other hand if you don't punch the crap out of it on the press it will serve you pretty well. <br> <br>Regarding table top presses, I agree that the Kelsey is the one most likely to break your heart. The Adana models are generally better. Chandler &amp; Price platens are great if you don't expect to fill the chase with type and have it print solidly. It is wiser to get a bigger format than you think you need because a 14x22 or a 12x18 will print small stuff as well as big work, but an 8x12 or a 10x15 has its limits. <br> <br>I am in the last few stages of refurbishing a much abused 14x22 Colts Armory. I expect a lot from it because I put a heap of money into getting it and moving it here. The Colts Armory's reputation is one of great strength, so I am reasonably sure it will print whatever I throw at it. I will be using Monotype incidentally. <br> <br>Jim Rimmer</p>"
