    html: "<p>I inherited one from my grandfather in 1969. <br>He had 4 fonts: Times Roman, Gill Sans, Palace Script, Bodoni Ultra -- mostly around 10pt size. Plus a lot of nice ornaments and rules. <br> <br>I used it for a few years, to do invitations and stationery for friends and family. <br> <br>The quality was a bit iffy, because it was so hard to get even inking and pressure, all of which depends on the operator's \"touch\" to a large degree -- as Gerald explained. But in my self-taught isolation, I always thought my problems were due to being a clumsy oaf (which was true), so I soldiered on.  <br> <br>Anyway, I discovered what combinations of type, ink, paper and layout were most forgiving. Annoyingly, the most interesting effects, like Bodoni Ultra in silver ink on dark green card stock (hey, it was 1970 - BIBA ruled), were the ones that were hardest to pull off cleanly. <br> <br>Using an Adana is certainly the most intimate experience I've ever had with type, and I will always treasure our relationship, stormy though it was.</p>"
