  - id: 49291
    user: 571
    date: 2004-10-18T04:37:00
    date_raw: 18 Oct 2004 — 4:37am
    votes: null
    html: <p>Ramiro <br> <br>Private press is an older term so I am not exactly sure what might be meant by this. It depends upon what you want to do and how extensively you want to do it. I assume you mean a non-commercial venture, so I won't discuss commercial machines here.  <br> <br>The most popular entry level letterpress activity today seems to be card printing. When I started out it was book-related printing. There are low-end and high-end presses for both. The problem is any of them take up room and make noise (don't know if these are considerations but if so..). <br> <br>I'd say a floor model Chandler &amp; Price would do you fine if you were interested in card and related kinds of production, and a flatbed cylinder, such as a Vandercook, if you are interested in producing books, broadsides, posters. I've generally seen and experienced much finer quality to the presswork with a Vandercook. The ideal Vandercook is the Universal, followed by the SP series. Both of these were quite popular in the 15 and 20 inch bed size models. <br> <br>The best press, but it takes considerable skill to operate, would be a smaller floor model iron handpress, such as an Albion. Small foot pattern, no noise, more tool than machine. But relatively expensive, around 5 to 6 grand and hard to find. <br> <br>I've used C&amp;Ps (never liked them), but Vandercooks mostly. I had five of them at one time but I've pulled back quite a bit from my previous printing activity and am down to a small Vandercook SP15 that I picked up many years ago "as new" for $200. With the relatively recent increased interest in letterpress, Vandercooks now run about $1500 to $3500 and it is quite hard to find one in excellent condition. My SP15 has its drawbacks but I am quite familiar with it and for the kind of work I do, it does me well. <br> <br>Had a little beauty of an Albion for quite some time but I actually only used it once for a collotype project. Regretted having to let it go, kind of wish I still had it. The kind of machine that garnered the phrase, "proof of the existence of God."</p>
