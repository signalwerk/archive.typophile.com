  - id: 49310
    user: 2575
    date: 2004-11-01T15:41:00
    date_raw: 1 Nov 2004 — 3:41pm
    votes: null
    html: "<p>Hrant <br> <br>I am not certain why the j would have a wide left sidebearing. Somebody maye indeed have shifted the matrix to the right as a special casting to make the tail of the letter a lesser kern, although I think that would make the fit look terrible. <br> <br>In a type size as small as 24 point I wouldn't have any fear of the kerned tail breaking off, since it is almost certainly a drive of .050\", and is quite strong in relation to its thickness to its kern, if that makes any sense. On the other hand if you take as an example the generous kern on the tail of the cap Q in 24 point Garamont 248, there is a chance of breaking the kern off in the planing down of the forme or in the printing. This is still at .050\" depth of drive. The same instance in 36 point can be very fragile, and must be handled with care in the lockup and planing. And giving it exaggerated impression is certain to both break kerns and wear the type. I like an evident amount of impression, but I have never been a \"tactility junkie\" . . . is that the expression? <br> <br>When I set up a font on the caster, I make certain that the base alignment and setwise position is correct, and then I carefully follow the 1/4 incremental markings on the matrices. My attitude is that Monotype took a lot of care in the fitting of the suite of matrices, and that is wise to follow it. It's only very rarely that I will feel that they have done something strange with the fit, and I may change the ocasional letter's stance on the body, but that's not very often. Lanston did a great job of making their fonts look right. <br> <br>A couple of days ago I attended the Alcuin Wayzgoose at the Vancouver Public Library. It was a great success, full of joy, fine work and conviviality. An ex-student of mine, along with Rollin Milroy of Heavenly Monkey Press (that's  real name) came up to my table and showed me a book that they had worked on together; she writing and designing it, and Rollin printing it. <br> <br>The text was in 12 point Garamont 248 with Italic and Small Caps that I had cast for the project. I have to say that they made they type look good, or the type made the book look good. Summation: the Monotype printed beautifull, and Rollin has dissed it back into the case for future use. Rollin prints with a blend of impression, restraint, and good taste. <br> <br> <br>Many Monotype foundries, both internal and commercial, have in the past used a soft grade of metal. In the shop I apprenticed in the composing room was predominently Linotype, so the Monotype Orphan Annie was compelled to use the same soft metal. It was JW Boyd's habit to treat it as a non-distribution system, so we used the type for the most part just once and then it went into the hell-box. <br> <br>So as not to suggest that this type was good for only the one-time use, I have to tell you a strange story: After 80 years in business the company eventually abandoned all letterpress, and the composing room effects and equipment went to a smaller printer, who carried on using it for some years. About 15 years ago that company sold the same stuff off cheap to a friend of mine who was operating a fine press. About six years ago she called me and  told me she had a bunch of type, and that I could have it. Once I got the cases home I was flabbergasted so discover that two of the cases  containing 14 and 18 point Nicholas Cochin were types that I had cast when I was about 19 or so. It was certainly the fonts I had cast at JW Boyd becuase of the unusual system we had of laying  extra caps in the boxes abopve the cap side of the case. The type (linotype metal, Monotype cast) is still useable today after more than fifty years. A young student from a local art college worked at my workshop for five days and set a broadsheet of about 50 lines in the 18 point. It was necessary to pick out about a half a dozen worn letters and replace them with better ones. <br> <br>Even though I have the same matrices that came from Boyd's, and can now cast new type on the Thompson, I will always keep the old fonts. <br> <br>In any case, there is Monotype and there is Monotype, depending on how it was cast. I know that is small comfort to any person buying type. on the other hand there is a lot of ATF type out there that is worn all to hell. It is just as easy to wear out good hard foundry type  in a hundred impressions if the person at the press overdoing the impression. It is also very possible to break kerns on ATF type if it's not handled properly. Sorry for the length of this post. <br> <br>Jim Rimmer</p>"
