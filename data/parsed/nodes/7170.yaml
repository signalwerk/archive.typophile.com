    html: <p>Sean <br> <br>Table top platen presses were not engineered with significant strength or the mechanics required to provide adequate impression and consistent inking control. They do provide a lot of hobbyists with an enjoyable experience but they are in no way capable of exacting quality production work. They are what they are. Have fun, but don't expect too much from them.</p>
