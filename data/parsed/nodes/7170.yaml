    html: "<p>&gt; is quite strong in relation to its thickness <br>&gt; to its kern, if that makes any sense. <br> <br>I think I understand: the strength of a kern depends on the ratio of drive depth over point size (all else -like alloy quality- being equal), meaning that smaller sizes need less drive to maintain adequately strong kerns. So looking at the numbers in your Halloween post, I guess the 30s range is the most liable to break? <br> <br>&gt; \"tactility junkie\" <br> <br>Tell me about it. The stuff some people do competes favorably with Braille... <br> <br>&gt; Heavenly Monkey Press <br> <br>:-) <br>My own press is [tentatively] called the Idle Pig Press. <br> <br>&gt; .... 14 and 18 point Nicholas Cochin were types <br>&gt; that I had cast when I was about 19 or so. <br> <br>That's too much! <br> <br>hhp</p>"
