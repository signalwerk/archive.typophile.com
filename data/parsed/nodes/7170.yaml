    html: <p>Sean <br> <br>You would need a range of quads and spacing for every point size. 3-to-the-em are three spacers that are the equivalent to the em in that size, eg, in 24-pt, 3-to-the-em would measure 8-pt by 24-pt, 4-to-the-em would measue 6-pt by 24-pt.  <br> <br>Contact me off list as I have a couple thousand pounds of spacing and thins (all sorted) that I am selling, and new leading as well. <br> <br>Gerald Lange</p>
