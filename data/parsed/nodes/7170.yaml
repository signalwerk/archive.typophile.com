    html: "<p>Gerald, question: <br>Do you think the \"depth of drive\" of the Monotype faces at ArcheType are 0.03\" or 0.05\"? <br>And: Since the depth affects sort strength, might the difference in depth determine how kerned the \"j\" for example is made? I ask because in the Monotype Basekerville 24R print I made on Tuesday the \"j\" has a huge left sidebearing, but in the sample in Sutton's Atlas the spacing is not nearly as bad. So maybe it's due to neck depth? <br> <br>BTW, I do realize that \"j\" is almost always an initial letter in English, I just think that Slovenians are people too. <br> <br>hhp</p>"
