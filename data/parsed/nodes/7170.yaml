s that came from Boyd's, and can now cast new type on the Thompson, I will always keep the old fonts. <br> <br>In any case, there is Monotype and there is Monotype, depending on how it was cast. I know that is small comfort to any person buying type. on the other hand there is a lot of ATF type out there that is worn all to hell. It is just as easy to wear out good hard foundry type  in a hundred impressions if the person at the press overdoing the impression. It is also very possible to break kerns on ATF type if it's not handled properly. Sorry for the length of this post. <br> <br>Jim Rimmer</p>"
