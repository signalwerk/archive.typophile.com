    html: <p>Hrant <br> <br>Was hoping you would mention the Czech Printing Office's close alliance with Monotype. Alas. <br> <br>There could easily have been two different J's. One on a regular body (to, as you surmise, reduce breakage) and another on a smaller body (with the J overhanging the body). No uncommon with characters such as the cap W. <br> <br>When we ordered Monotype sorts it was generally required to send a cap M from the existing font so that the operator could align the characters to the correct position on the body. Baseline, side bearings, etc. That would "sort of" ensure that the new sorts matched what you already had. Not all suppliers were competent at this!!!! <br> <br>There was a lot of possible variance. You could have characters kerned to each other. For instance, a "y" and a period kerned close on one body. So Monotype was quite flexible in this regard and therein lay the problem.</p>
    html_clean: <p>Hrant <br> <br>Was hoping you would mention the Czech Printing Office's close alliance with Monotype. Alas. <br> <br>There could easily have been two different J's. One on a regular body (to, as you surmise, reduce breakage) and another on a smaller body (with the J overhanging the body). No uncommon with characters such as the cap W. <br> <br>When we ordered Monotype sorts it was generally required to send a cap M from the existing font so that the operator could align the characters to the correct position on the body. Baseline, side bearings, etc. That would "sort of" ensure that the new sorts matched what you already had. Not all suppliers were competent at this!!!! <br> <br>There was a lot of possible variance. You could have characters kerned to each other. For instance, a "y" and a period kerned close on one body. So Monotype was quite flexible in this regard and therein lay the problem.</p>
  - id: 49308
