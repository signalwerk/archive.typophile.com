    html: <p>Sean <br> <br>Just a further note on this. My first new type was purchased from Acme and I bought from them many times over the years. Along with Detroit Type Foundry, they were my most trusted sources for Monotype casting. I believe that both are long gone now. <br> <br>Best current source, is Michael Bixler. Great selection of English Monotype faces. Excellent work. As I recall, all the Edward Tufte books were comped by the Bixler foundry. <br> <br><a href="http://www.mwbixler.com/" target="_blank">http://www.mwbixler.com/</a></p>
