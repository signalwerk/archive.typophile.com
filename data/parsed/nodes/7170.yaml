    html: <p><i>"Aren't those better than C&amp;Ps?"</i> <br> <br>Do you mean cylinder presses or Adana? The C&amp;P Pilot is said to be the best hand operated table top ever made. That is what I am told anyway. <br> <br><i>"BTW, what type did you get? "</i> <br> <br>Not really sure yet. I just unloaded it and now my back is recovering. It has from about 7pt. up to 72pt. The serif is something I have never heard of. It starts with a P. I'll find out this weekend for sure and let you know. The sans is a Futura or something. It's 50's stuff. There are quite a few borders and ding bats too. <br> <br>Should be fun anyway. Not too picky right now.</p>
