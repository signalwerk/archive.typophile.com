    html: <p>Hrant <br> <br>Don't know. If you had one of those old Pittman depth gauges though, we could sure find out. I missed one on eBay just last week. An ex-apprentice broke mine when she was cleaning the place and knocked it off the cabinet. <br> <br>Deeper depth would generally "indicate" strength. Foundry metal is harder and stronger than Monotype and would thus likely have a deeper depth. It has better metallurgy (includes copper in the mix), and could be cast slower (longer), at higher temperatures and under higher pressure, on foundry casters (proprietary machines, sort of). <br> <br>A j on a foundry caster would be fitted to the body in a continous manner (and would likely not vary much from casting to casting). A j on a Monotype could be fitted to the body in a relative way, and even cast on a wider or narrower body. So the Sutton specimen would not necessarily represent the fitting across the board. Monotype machines weren't proprietary in the sense that they were sold to printers, typesetting firms, et al, and the  owner-operator could adjust the character on the body however he chose, within obvious restriction. <br> <br>Slovenians may be people, as you say, but they sure weren't much of a market for Monotype I'd bet.</p>
