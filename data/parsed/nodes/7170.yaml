    html: <p>Well, I got my press and I have to say I am in love with it. I've even printed a small picture of it and put it in my wallet. <br> <br>And I must say that "Printing for Pleasure" is an excellent companion to my most wonderful machine - however small they both may be. <br> <br>I am now looking for some advise / opinions regarding. <br> <br>First; <br>Really, my press is in good working order. It has what I would call the usual mild to moderate rust that you might expect. Basically the parts that had no paint on them have a thin sheet of rust on the that can easily be removed with steel wool. My question is this; how far should I take this process? Should I keep it "nicked" and aged? Or should I pimp it out a bit? Repaint it black - make it shiny? <br> <br>Second; <br>While I have some type, I really doubt I can live with it. So, I am looking for a nice serif roman in about 10pt. to start. I know the type of Jim Rimmer was suggested already. But cost is an issue for me. Because, even if I love my press, I have never really letterpress printed, and I am not sure how much I will love <i>it</i> ( though I suspect I will ). Good type seems essential for the beginner. Does any one have any suggestions on some good type at a decent price for me? <br> <br>And, what is up with brass type? <br> <br>Thanks, <br>Sean</p>
