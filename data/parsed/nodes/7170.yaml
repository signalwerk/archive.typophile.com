    html: <p>Sean <br> <br>Brass type (as well as zinc type) is usually used for stamping, such as by bookbinders or for foil stamping where the type needs to be heated. Lead type doesn't often fair well in this regard. <br> <br>Acme (Chicago) was a Monotype outfit. They were pretty good casters actually. But, as opposed to foundry type, Monotype will barely stand up to three printings before it has to be thrown in the hell box.</p>
    html_clean: <p>Sean <br> <br>Brass type (as well as zinc type) is usually used for stamping, such as by bookbinders or for foil stamping where the type needs to be heated. Lead type doesn't often fair well in this regard. <br> <br>Acme (Chicago) was a Monotype outfit. They were pretty good casters actually. But, as opposed to foundry type, Monotype will barely stand up to three printings before it has to be thrown in the hell box.</p>
