    html: "<p>It would be a shame not to have (or leave the possibility open for) the swash italic caps, which are available in the ATF* cut but not the Monotype. But as Jim said, an ATF would be hard to locate - and I suspect more expensive as a result. But the italic is so much better (except for the \"g\"). Dunno. But in any case it's great you'll be buying some Baskerville! My advice: get the 12; it seems to me that Baskerville is a design that's most happy slightly large. Or maybe an 11, if they have it. <br> <br>* BTW, one thing about the ATF cut is that it's a Fry's Baskerville, not a \"classic\", which means it's a bit different (most notably in the \"a\", \"C\" and \"Q\"). But -as Raph actually pointed out to me- the 12 point ATF Baskerville is particularly authentic for some reason - it even has the right \"Q\". <br> <br>hhp</p>"
