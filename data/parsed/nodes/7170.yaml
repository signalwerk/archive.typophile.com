    html: "<p>Thanks for the superb insight - this is definitely a keeper. <br> <br>-- <br> <br>So the Monotype Baskerville I'm looking at, being 24 point, must be 0.05\" deep no matter what. <br> <br>&gt; The strength of kerns is anhanced with a deeper drive <br> <br>&gt; The deeper or shaller the drive has no bearing <br>&gt; on how closely the type can be fitted <br> <br>I'm seeing some room between those two statements. <br>If a deeper drive makes for stronger kerns, then something like the \"j\" is liable to have its left sidbearing exagerated to improve strength depending on depth (as well as alloy quality). So maybe the guy who cast the font I'm dealing with was a tightwad (he used a cheap alloy, and hated having to deal with broken sorts), so he gave the \"j\" a huge left sidebearing. Or am I missing something? <br> <br>It seems to me that when a \"user\" casts a Monotype font, a balance is struck between: <br>- sort (and clean-up effort) preservation, <br>- alloy quality, <br>- spacing integrity. <br> <br>Also, at the type design end, letterform fidelity and spacing integrity can be reduced to accomodate the <i>eventual</i> physical issue of broken sorts. <br> <br>Does that makes sense? <br> <br>&gt; as Hrant noted; y. <br> <br>For the record: that was Gerald. <br> <br>hhp</p>"
