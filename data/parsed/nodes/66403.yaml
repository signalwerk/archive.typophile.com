    <p>John Downer will be in New York City to teach a weekend-long intensive sign painting class at The Cooper Union in mid March.  This class will be open to the public.  The class has a very limited capacity so if you'd like to attend it would be wise to book early.  </p>
    <p>Get more info or sign up <a class="freelinking external" href="http://cooperunion.augusoft.net/index.cfm?method=ClassInfo.ClassInformation&amp;int_class_id=647&amp;int_category_id=2&amp;int_sub_category_id=19&amp;int_catalog_id=0" rel="nofollow">here.</a></p>
    <p>There is a nice article on John's work on a shopfront in Brooklyn on Hannes Famira's <a class="freelinking external" href="http://www.typedu.org/dynamic/blog/signpainter" rel="nofollow">blog</a>, the source of the image below.</p>
    <p>John Downer is a sign painter by trade, with a specialty in gold leaf lettering. He has a B.A. in Fine Art from Washington State University and both an M.A. and an M.F.A. in Painting from The University of Iowa. He began his career as a freelance type designer in 1983. Mr. Downer writes about type and type history for Emigre magazine, House magazine, and other publications. He lives in Iowa City, and travels widely in the United States and Europe, always on the lookout for interesting letterforms. His digital type has been released through Emigre Fonts, Inc., The Font Bureau, Bitstream Inc., Design Lab, Inc., and House Industries.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/JohnDowner_12_6654.jpg"></div><p></p>
