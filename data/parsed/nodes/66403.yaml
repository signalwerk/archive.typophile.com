      <p>I wish I could attend this. For those of you who are serious about lettering or font design this is a class that you do not want to miss. True Sign Painters are hard to find these days. John Downer is truelly a Master Sign Painter. I have taken private lessons with John and I was impressed not only with his manipulation of letters with the brush but his vast knowledge of lettering and font design.</p>
      <p>I highly recommend this and truelly wish I could attend this class. If you have the means then you would be wise to attend.</p>
