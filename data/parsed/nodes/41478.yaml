      <p>Do you know many graphic designers doing typefaces of the quality of the ones from H&amp;FJ as example?</p>
      <p>A typeface designer draw more, think about forms, counters, in a human sense, a graphic designer do that but also play with concepts, meanings, etc. Indeed booth do the same, but not at the same proportion in their everyday job.</p>
      <p>This is particularly true for students: you can have a great student in use of typography but suddenly very bad in typeface design, when the student from Illustration section is very good in typeface design. Clearly not the same skills.</p>
      <p>But this sort of "Rules" can't be true for all, Erik Speikermann is the best example of a great designer for everything, even if for typeface design, he always point out that he is bad when its time to finish or expand an idea.</p>
