      <p>Why is that 'funny'? Seems rather typical to me. Most graphic designer suck and architecture. Most architects suck at Web Design. Most Web Designers suck at Fashion design... ;o)</p>
      <p>I think we assume all to often that 'design' is some universal skill that applies easily to any medium, which isn't always the case.</p>
