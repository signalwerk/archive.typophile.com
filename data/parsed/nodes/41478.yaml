      <p>Maybe I wasn´t clear enough... I didn´t mean to as radical as graphic design vs architecture (and I believe that an architect IS a designer, either they like it or not, and designers aren´t frustrated architects as many people think... but that's another issue). What I wanted to point out is that typography is complex and in order to draw typefaces, the designer needs to have some knowledge on editorial design, text composing, format, layout... in order to achieve a certain goal of drawing a specific typeface for a specific usage, and consider perceptual issues and "laws" of graphic design. It reminds me of using wonderfully designed stones and build a horrible house with it... or play tecno with a gibson guitar...</p>
      <p>It doesn´t sound right.... of course there are remakable examples of good layout, but sometimes I get really disapointed.</p>
