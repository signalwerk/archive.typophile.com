      <p>seml...I guess I'd argue that typeface design is as unique a design discipline as is graphic design or architecture design. People that get really good at one particular aspect of design tend to focus solely on that one aspect/medium. </p>
      <p>A heart surgeon and a dermatologist are both doctors, but they really live in their own subset worlds of medicine.</p>
