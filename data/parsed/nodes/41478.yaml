    <p>One thing I find funny, (without being funny at all) is that there few typeface designers who can actually achieve good work with their own created typefaces. I mean the graphic design part...<br>
    Typeface designers produce an essential tool for graphic and editorial design, but the work they produce in those areas is far from having the same kind of quality that they achieve with their "glyphs".<br>
    What I can actually find is some good text composing and good editorial details or very well written essays... but as for web and graphic... well, that's another story...</p>
    <p>Is this just an impression? Am I being unfair?</p>
