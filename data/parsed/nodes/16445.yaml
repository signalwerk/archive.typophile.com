      <p>Nice work nebrow I really like the way you conceptualized the overall theme of the brand, however I wanted to share two quick opinions I have from a purely psychological point of view.</p>
      <p>Firstly, I am not completely sold on the idea of using an oblique typeface for the branding of a car manufacturer. Aside from Range Rover I can't think of many automotive brands that make use of oblique typefaces. You really need to consider the characteristics of the cars the company would be selling. Perhaps if the cars were really fast you could use a heavily italicized typeface to insinuate speed but the typeface you're using is neither here nor there. Personally I think the type would be stronger if it wasn't oblique.</p>
      <p>Secondly the colours you're using are too bright and cheerful. I do understand that the manufacturer is supposed to produce hybrid cars but right now it feels more like you're creating something for a candy company rather than a car manufacturer. While green, orange and blue are great colours for the theme you could try picking chromatic grays of those hues.</p>
      <p>As Jason said as a first attempt the logo is quite impressive, and shows loads of potential. Keep working on it and you should have quite a strong identity by the end.</p>
      <p>-mmilo</p>
