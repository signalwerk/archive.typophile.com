    html: |-
      <p>I thought maybe the script looked like some of Ronna Penner's scripts, but it's not an exact match to any I found. <a href="http://www.myfonts.com/fonts/typadelic/sweet-pea/" rel="nofollow">Sweet Pea</a> is fairly similar, but that's the most I can say about it. A few of her others also resemble it a bit. </p>
      <p>I also looked at Rob Leuschke's work, but nothing was very close. </p>
      <p>Seeing the language used, this could be from a Scandinavian font designer -- an area we don't see enough of to know very well, speaking for myself.</p>
      <p>If someone does ID it, I would like to add it to the Script Font ID Guide.</p>
      <p>- Mike Yanega</p>
