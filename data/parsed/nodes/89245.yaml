      <p>This is all rather theoretical.<br>
      In practice, you need to know what your client’s philosophy is.</p>
      <p>I once designed an early reading typeface, and the directives I received seemed to be a compromise between what they thought was logical for their readers, and what they thought looked good. In other words, theory is all very well, but theory be damned if it doesn’t create the right impression to the fluently-reading adults who are the book-buyers.</p>
      <p>This is similar to the postmodern take on modernism: functionalism was as much about looking functional and conforming to functionalist theroy, as being functional in performance.</p>
