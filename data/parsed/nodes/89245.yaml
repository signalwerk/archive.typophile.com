      <p>Comenia Serif looks very good. Although, the f leaves me a little bit wondering, why is the crossbar thinner than the serif?? For me this is no logic.<br>
      What should be peculiar about the æ?</p>
      <p>Another typeface with a relaxed feel (similar to Comenia) is Novel, Sans and Serif.</p>
      <p>As for the much debated single-storey a and g, those are certainly not the guilty parts if typography for youngsters turns bad. Futura has a single-storey a and a single-storey g and no one complains about that.<br>
      I have made “infant” variant fonts of Andron with this alternate glyphs because there is some request for it. As for legibility, I’d say its the same as with the usual glyphs, even for children.</p>
