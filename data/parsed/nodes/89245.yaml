      <p>IMO Comenia is too sophisticated.<br>
      This is a result of its broad-nibbed chirographic forms, which the readers will not understand.<br>
      For instance, why is there no serif at the top left of “a” or on the right leg of “k”?<br>
      And what about all the f ligatures?<br>
      The virtue of Century Schoolbook was that it was a simplified, or naive, almost pop-art version of the typical modern text face of its era, and had an easy to understand thematic serif structure.</p>
