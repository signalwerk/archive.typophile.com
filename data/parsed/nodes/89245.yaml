      <p>Thanks for all the great comments! I see I went a bit over board about Comenia. It happens sometimes.</p>
      <p>@Nick: I see your points. But using the f-ligatures in the sample was a fault on my part. The typeface works very nicely without them. </p>
      <p>@Andreas Stötzner: Novel Serif and Sans are awesome. So far I have only played with the demo version, but it's certainly something I will consider for other projects. The roman is indeed very similar to Comenia. The italic versions might have a bit too much character. I also quite like Andron, but haven't had time to try it extensively yet. Demo versions are great, the only way to really try out a font before buying.</p>
      <p>@Frode Frank: I considered Dolly, it's a favorite of mine, but the italic isn't straightforward enough, and the font lacks lining figures, as far as I can tell. About Sauna: Its charm doesn't quite work on me, I think. To me it just looks kind of square and geometric (without actually being either). Would maybe work for shorter texts set large. </p>
      <p>@Hrant: It's only on the first level (out of four) that we consider using the monocular a and g. To be clear, the only reason I mentioned Futura was the fact that some easy reader books use fonts like that. I could say: we're not aiming for cool (that's the illustrator's job), but for warm. </p>
      <p>@charles_e @Té Rowan: Charter/Charis is another favorite, and we we almost picked it. But so far we're still with the rather more rounded shapes in Comenia. </p>
      <p>Which isn't to say that I'm ignoring all the good advice from these forums. For the beginner's books we're still trying to figure it out. One alternative is to pick something like <a class="freelinking external" href="http://www.linotype.com/6258/mantikainformal.html?PHPSESSID=6374ef1f344de88bb3c79717e8918b7c" rel="nofollow">Mantika informal</a></p>
      <p>About that æ: I made a little comparison with some of the other fonts that either were or could have been in consideration, and to my eyes Comenia is the more elegant, though it's pretty meaningless to look at this one glyph in isolation. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ae3_6138.jpg"></div><p></p>
