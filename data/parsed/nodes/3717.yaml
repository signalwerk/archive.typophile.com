    html: "<p>Dyanna - <br>As an alternate, you can crack open one of your old FOG  <br>generated PS T1 files and use the components. Sounds strange, <br>but try this: <br> <br>1.) Open the old font in FL and also have open <br>your new font (without the accents) but with proper accents <br>in their slots - acute, diereses etc. <br>2.) Select the accented characters in the old font <br>and paste them into the new font. <br>3.) Magically, if all goes well, your new font will sub <br>the accents and proper letters into these slots. <br>Instant accented characters. <br> <br>Disclaimer - I figured this one out by accident and <br>pure desperation. It requires your old font to <br>have all of the components present. Old FOG files <br>will often decompose the accented cap characters <br>once opened in FL. You can of course manually insert <br>each component via Glyph &gt; Add component. <br> <br>You can then apply this to your other 15 fonts <br>once you've got a decent file working. <br> <br>Hope this helps.</p>"
