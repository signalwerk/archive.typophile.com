  html: <p>Hello everyone. <br> <br>I'm trying to add a component, in Font Lab 4.6, to every glyph in my font. I tried the Generate Glyphs command, but it ended up renaming every glyph... which I don't really need to have happen. I tried to figure out how to program a macro but I can't seem to wrap my brain around Python. I checked out the FontLab/Mapping folder and my computer kept crashing. Hitting Opt-F9 every single time is very exciting, but I have to do this to 15 more fonts and I'd like to have some time to eat this week. <br> <br>If any one has any clues or hints to share I'd appreciate it.  <br> <br>Thanks, <br>Clueless Newbie.</p>
