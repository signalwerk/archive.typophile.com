    html: |-
      <p>Hi Yael,</p>
      <p>#1 looks like <strong><a class="freelinking external" href="http://www.fontsquirrel.com/fonts/Brushstroke-Plain" rel="nofollow">Brushstroke Plain</a></strong> free font by Kevin Willis (1992)<br>
      Note though that there is another quite similar font called <strong>Pennello Becker</strong> (Copyright  1999 Data Becker) so, I 'm not sure if Brushstroke Plain is the actual original design.</p>
      <p>#2 must be a handwritten font called <strong>Maria</strong> but I have no more data about it (Designer, Foundry, License etc) and I have not found any legitimate source to acquire it, therefore I advise to check twice and be extra careful if you want to license/use the font in any commercial project.</p>
      <p>Fivos</p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
