      <p>Here we go again ...</p>
      <p>Brushstroke Plain (which I have as Brushstroke Medium) is a 1992 digital recreation of Stop A by Walter Honisch, 1939. Separately, I have in my notes that Mark Simonson confirmed this as, "an old metal font called Stop."  I can't find the post to verify this, though. Mark?</p>
      <p>Again, Hrant, your "strongly suspect" is based upon ignorance and a highly dysfunctional gut feeling.</p>
