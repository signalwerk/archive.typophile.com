      <p>One does not look like a scan of the other. With a scan there would be exact duplicate letters or strokes someplace.  Clearly, Pennello Becker could be derivative of Brushstroke as it appears far muddier in comparison. </p>
      <p>It also seems that Brushstroke Plain is nicely drawn which gives weight to it being an original or at least a legitimate font. Whether it's "free" or not ...</p>
      <p>ps. Don't trust anything written in a font.  I predate all my fonts to get "prior art".</p>
