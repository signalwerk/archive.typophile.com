    html: |-
      <p><cite>“Classicism is not a style, it’s a sensibility.”</cite></p>
      <p>This quotation – from where do you know it?! – is not from me but from British-Greek architect Dimitri Porphyrios (<a href="http://www.porphyrios.co.uk/" title="http://www.porphyrios.co.uk/">http://www.porphyrios.co.uk/</a>)</p>
      <p><cite>Your new Andron-Sans seems to have all of the sensibility, &amp; sensuality, of Andron-Serif.</cite></p>
      <p>Well, this was the initial idea to try out if this is possibly to be achieved. Yes, the first sample (it’s no more than that) looks quite nice.<br>
      But, as others have commented here, wether this fashion is advisable to go for an actual companion typeface is another question. Maybe the answer is ‘no’.</p>
      <p><cite>Shall an Andron-Sans also have Latin, Greek (polytonic!, with archaic letters &amp; acrophonic numerals), &amp; Cyrillic, &amp; Anglo-Saxon, Old Italic … </cite></p>
      <p>It could have all this, of course. It’s a matter of resources, at the end.</p>
      <p><cite>… yet once the trichotomy was<br>
      "roman / italic / gothic" ... perhaps then, also an Andron-Fraktur?!</cite></p>
      <p>Why not? I recall that I did even try this option some years ago. The initial result was not overly promising. But who knows, “stranger things happen at sea”!</p>
      <p><cite>And then there's the question of "tricameral"</cite></p>
      <p>– always!  . ;-)</p>
      <p>Andron uncial sets I developed years ago. They only did not yet see the light of a release. Latin, Greek, Irish and Coptic middlecase char. sets are in stock.</p>
      <p>And yes, one could also do “Andron Sans Coptic Medior” or Andron Latin Medior Italic. By the way, uncial small capitals would be also a variety I’d like to explore. (wait – did I already??)</p>
      <p>Yesterday I shortly thought about a possible didone Fraktur-Uncial.<br>
      But this has nothing to do with Andron.</p>
