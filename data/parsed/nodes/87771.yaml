      <p>Softened sans faces are not a good proposition for a foundry to produce, mainly because typographers assess them at display size, and get the impression that they are quaint, which severely restricts their usage.</p>
      <p>The sans and serif members of a super-family should be able to stand on their own, because the majority of their sales will not be in the complete package containing both.</p>
