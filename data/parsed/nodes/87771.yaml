      <p>As you've said yourself,<br>
      "Classicism is not a style, it's a sensibility."</p>
      <p>Your new Andron-Sans seems to have all of the sensibility, &amp; sensuality, of Andron-Serif.<br>
      Yet, beside the deep beautify of its classical Venetian ductus, the great glory of Andron is its wide literacy.</p>
      <p>Shall an Andron-Sans also have Latin, Greek (polytonic!, with archaic letters &amp; acrophonic numerals), &amp; Cyrillic, &amp; Anglo-Saxon, Old Italic (Etruscan, Oscan, ...), Runic, Ogham, Coptic, &amp; ... , ... , with all the MUFI characters; in roman &amp; italic?</p>
      <p>Today the dichotomy is<br>
           "serif / sans-serif";<br>
      yet once the trichotomy was<br>
          "roman / italic / gothic".</p>
      <p>... perhaps then, also an Andron-Fraktur?!</p>
      <p>And then there's the question of "tricameral".</p>
      <p>K.</p>
      <p>I'm sorry that I've not at all answered your initial question.</p>
