    <p>This month I finally created a typeface that I feel happy about (maybe even too happy). This is just a compilation of different forms and ideas that I find appealing. I think I will also do a monospaced version. Some letters still have the a kinda "default" look, but I think that even in this early stage the personality of the typeface stands out?</p>
    <p>Or does it?</p>
