      <p>Pretty cool design. I like its playfulness. I don't quite know what kind of feedback to give on this though. I could tell you to condense n/m/u a bit more so the white space matches the counters of other letters, I could tell you to expand the D a bit, to decrease the top bowl of B, to slightly rotate S/s to the right, to raise the tittles in i/j, to fix the dark spot in 4 and to balance the t better, but honestly I find these irregularities rather charming. It's not an all-purpose typeface but I can certainly see its application. What is this typeface intended for though? If it's meant to be playful I wouldn't change things drastically. If you're attempting to design a well balanced typeface which is useful for much broader applications then I think you need to polish quite a bit. I wouldn't do that though. I'm actually trying to develop a more impulsive approach to type design, where I'm less concerned with consistency and more with creative shapes, such as I see here. I'm fond of Eyal Holtzman's work for this very reason.</p>
      <p>I would however make the hyphen shorter and thicker. Right now it looks like an en-dash. On that note, did you also add the en-dash and em-dash? I'm asking because in the text you're using a hyphen in the bottom left column where you should be using an em-dash.</p>
