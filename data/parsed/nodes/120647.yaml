      <p>It's hard to make out in the pixelated image at the top, but my impression is that the light version has very uneven stroke widths, both between letters and within them. I'm having trouble parsing that as "playful", and would recommend fixing this.</p>
      <p>The bold looks like it has significantly better-balanced stroke widths for some reason, and looks more useful. Here I can see a bit of the "playfulness" that Martin mentions. It reminds me of DIN up close and of Comic Sans at small sizes...</p>
      <p>In both cuts, the spur of /G and the serifs of /i/j strike me as too timid; either make them distinct or lose them. The /t looks lopsided, though perhaps in character. Some of the glyphs are top-heavy, but probably by design (?).</p>
