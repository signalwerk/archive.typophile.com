    html: |-
      <p>Better, but there's still a lot going on that needs to be fixed. H and S could be wider, I_r is too close together, the tittles on i/j should be higher (at around the height of where the terminal of /f ends), the /f should be wider, the crossbar of /t should be longer on the right while its terminal should be condensed a bit (and so should the tail of /j), the /v is too light, the diagonals in /k could extend a bit further and the /r is too heavy in the join.</p>
      <p>There's also something going on in the rendering. For example, in 'abolish' I see the /h with a thinner right vertical, the next /h looks good and the last /h in the text has a thinner stem. This makes it more difficult to check the typeface for inconsistencies. I just downloaded the PDF to see if it's the same on my computer. It was. I then zoomed in on your typeface to look if I can identify where the rendering problem comes from. I've found it. For starters, your horizontals are thicker than your verticals. Note that horizontals always look optically thicker than verticals, so you need to compensate for that. But this is only the start of the issues with this typeface. If you look at the /n for example, you have a very thick shoulder, thinner stems and the weight of the typeface is all clumped together near the join. That's exactly where you don't want the weight to be. Make the horizontals thinner and move the weight at the top of the shoulder to the right and decrease the weight in the join. I can recommend reading this short tutorial I wrote on dark spots in type design: <a href="http://martinsilvertant.deviantart.com/journal/Dark-spots-in-type-design-322930112">http://martinsilvertant.deviantart.com/journal/Dark-spots-in-type-design...</a></p>
      <p>Also have a look at the resources on this page: <a href="http://temple-of-typefaces.deviantart.com/journal/Type-resources-276795259">http://temple-of-typefaces.deviantart.com/journal/Type-resources-276795259</a><br>
      I think the Type Workshop might be particularly useful to you.</p>
      <p>Also, here's one of 3 tutorials I did on type design; this one is on designing a sans serif: <a href="http://martinsilvertant.deviantart.com/journal/How-to-design-a-typeface-Part-1-362811889">http://martinsilvertant.deviantart.com/journal/How-to-design-a-typeface-...</a></p>
    html_clean: |-
