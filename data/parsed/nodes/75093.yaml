    <p>Archer is a lovely typeface, but here in Sweden it have gone too popular, especially in magazine design. Pretty much every other lifestyle-cover in the stands have Archer on it. So here I am, with my first post on Typophile, asking you for great alternatives to Archer.</p>
    <p>I'm looking for slab-serifs with a classy och and soft feeling. Great span of weights, from hairline to black, is qualifying.</p>
    <p>I like <a class="freelinking external" href="http://www.dardenstudio.com/typefaces/jubilat" rel="nofollow">Jubilat</a>, but it haven't any hairline. <a class="freelinking external" href="http://www.typotheque.com/fonts/charlie" rel="nofollow">Charlie</a> is also quite nice.</p>
    <p>Any suggestions?</p>
