      <p>I'm of the other mentality: you don't want want two styles<br>
      competing for your attention to convey the text, and to me<br>
      the best Italic is a subservient one. So I think the older<br>
      philosophy reflects a less sophisticated understanding<br>
      of how an Italic is supposed to be read.</p>
      <p>And I don't think a subordinate Italic needs to look dead:<br>
      <a href="http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif" title="http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif">http://www.themicrofoundry.com/other/nour&amp;patria/dev/nour-latin.gif</a></p>
