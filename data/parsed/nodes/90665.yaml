      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Garams_4479.jpg"></div><p></p>
      <p>Here, I reset the deck from a 1920s magazine article in the 1990s, to compare foundry type with digital type.<br>
      I had long been interested in the sterilizing effect that technological progress, with its greater precision, has upon older forms.<br>
      For indeed, this is not a new digital phenomenon.<br>
      Fred Goudy addressed the issue with many of his designs, made for metal, such as Garamont and Kennerley.<br>
      Do italics suffer more than the roman?</p>
      <p>Whatever reasons Robert Slimbach had for “cleaning up” Adobe Garamond, there is also a certain amount of technological determinism at play: in particular the role of hinting and alignment zones in PostScript Type 1, which tend to regularize x-heights. If you don’t standardize x-heights, slight deviations become ridiculously and unpredictably exaggerated at low resolutions—so rather than the charming and evenly distributed wonkyness of old letterpress, what you get is abrupt oddities standing out from conformity. </p>
      <p>The italics of Garamond Premier Pro have slightly more personality than the older Adobe Garamond.</p>
      <p>At any rate, there are by now, twenty-five years into digital type on personal computers, and with a solid ten years of prolific “indie” foundry font publishing, plenty of sturdy text faces with interesting new italics. Quadraat and Dolly spring to mind, both over 10 years old now. For my part, rather than redo Garamond, I produced a new design in the garalde genre—Oneleigh, with italics inspired by Oz Cooper’s love of a certain off-kilter font.</p>
