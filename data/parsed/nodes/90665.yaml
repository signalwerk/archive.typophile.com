      <p>This type is alive, for several reasons! It's wonky, shoddy, un-even, bits have broken off. The regular doesn't sit straight on its baseline either. The italics lean forward and backward, some individual characters almost look roman. Stem widths are un-even.</p>
      <p>I love it. No surprise here that digital versions look flat and dead in comparison.</p>
