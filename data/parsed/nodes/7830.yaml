    html: <p>Scott, I feel your pain. I'll also step apart from the group and vote for 2C. I think 2B is too jumbled stylistically, and the mountain peak feels weak without an outline. <br> <br>Try 2C without the dark upper-right corner. Or, perhaps, make the mountain ridge cut down between 'Sun' and 'Ridge', then fill in the box behind 'Sun' and make 'Sun' the grey color? This will make it look like a ridge rising against a blue sky. Or perhaps make the entire box a jagged ridge without any box shape on top? <br> <br>Is there any way to fill in the S and R? I'm sorry, but that is terribly distracting to my eye, and it looks to me as though someone forgot to fill in the counters with grey. If you bring this 'printing mistake' aspect up with the client, maybe they'll let you change it. <br> <br>I guess my basis for these suggestions is that I see about 3 or 4 graphic moves in the design that all serve to make the name harder, rather than easier, to read. Perhaps you should pick one (i.e., the ridge shape) and get rid of the others. If any of this is unclear, I can clarify. Good luck! There's a good logo in there, keep hacking at it.</p>
