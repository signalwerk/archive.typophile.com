    html: <p>Daniel, I appreciate your defense of the integrity of the designers here. <br> <br>Galin, don't sweat it. I did not feel the least amount of disrespect or offense by your renditions of my design. Especially in a predominantly English language international forum like this where there are varying degrees of English communication, I don't have any issue with showing visuals to explain your concept. I was involved in the previous discussion that Daniel referenced. I don't necessarily agree with the perceived verdict to refrain from including visual versions of the posting designer's concept, the main reason being that the posting designer can accept and implement, regect and disregard, or completely ignore any response. For me, the beauty of this critique forum is that I can bounce my concepts off of some super talented and insightful designers</p>
