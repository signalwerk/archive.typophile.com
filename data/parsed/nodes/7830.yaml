    html: <p>I can't tell you how many times I have steered clients away from the wrong choice, and taken control of the direction. Once in awhile, however, no matter how much consulting I do, a client will not get past their emotional connection with something; hence, we end up with a framed, logotype that's missing a few teeth. <br> <br>Thank you for your comments, and the others here as well, as I am recommitted to salvaging this project. I am going to try to squeeze in some time to go back to the drawing board on this one and present a solution they will have to connect with. <br> <br>Mahalo! <br>Scott</p>
