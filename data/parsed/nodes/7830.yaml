    html: <p>Ugh. I feel for you. <br> <br>Opening the E makes things worse, IMHO. That eliminates most of the 1 series. The "sun" in  1b and 1c looks too moon-like, and it looks weak in 1d. I'd abandon that route. <br> <br>Of the ridge solutions, 2b is probably best. But those holes... To be truly evil, of course, you need a big happy sun (cf. the old <a href="http://www.dc-8jet.com/Images/na-dc8-logo-gif-tn.gif">National Airlines logo</a>) poking out to the left of the mountain.</p>
