    html: "<p>I will follow your advice Daniel. Nevertheless, I do respect the designers here and maybe even more than you can believe. Please give the link of that post in order to read it. I suppose it was better to post the colored sun idea on the last color version, than merely post something of the sort : \"I like 2b, 1a, etc.\" ---that kind of post is common here, and it's not so all-encasing either. It surely says personal opinion about the work of the other designer, but we all express in different ways and that is the good part of it. If all of us were machines and each of us responded in predesigned patterns, than it would be a dull monotony. <br> <br>If there was a hint of disrespect, it was unintentional. <br> <br>Salute <br> <br>P.S I still think that incorporating the sun in the box is a good idea.</p>"
