    html: <p>Scott, you need a creative director or marketing expert with writing talent to assist you with your clients. I've more than once convinced a client that "The Kings new clothes" would be better in red than green.  <br> <br>I once shot a product that was a rectangle and put it on a linear textured background and had that at an angle. After the posters were printed the client came back to me and asked why the lines on the background didn't aline with the product. I explained that due to the distortion of the camera it would never look right if they were in the same direction. It was bought hook, line and sinker</p>
