  - id: 52961
    user: 2332
    date: 2004-11-23T22:39:00
    date_raw: 23 Nov 2004 — 10:39pm
    votes: null
    html: "<p>Scott: <br> <br>From what I see here I'd be inclined to roll with 2b. 2c has potential because of the ridge's reference to a graph but it doesn't look as cool. I'd leave the 1 series behind. <br> <br>Thinking out loud: <br> <br>Could you drop the top border to the height of the small caps and have the tops of the letters form a ridge? <br> <br>Is it a matter of colour? Maybe the blue on silver (as sober as it is) creates a too lurid feel. What about a more navy blue? What about a navy field and reversed letters? Yeah registration/trapping issues but the serifs would survive and it might look sharp. <br> <br>In this respect see this (~2Mb PDF) <a href=\"http://vpl.ca/MDC/CIO_Fall_04.pdf\" target=\"_blank\">http://vpl.ca/MDC/CIO_Fall_04.pdf</a> which is the magazine we publish. The cover is silver. Our blue (Pantone 2925U) doesn't fair well, the red (485U) does but don't use it for finance, and the gold's(123U) okay. Go to the back/second to last page where there's the ad for Word On The Street and see the purple and violets pop against the silver. The effect in real life is really nice. Also the yellow and greens. I don't have those colours here but I'm sure you'd be able to zero in on them. <br> <br>A silver rule between Sun Ridge and Financial Group? <br> <br>Not a fan of the white counters in S and R but if you're stuck with 'em then that's that. What happens if you add MORE of them? Or is that too insane?... <br> <br>Or put on the brakes and say I had an epiphany and here's a totally new direction...and then start again. Ugh, I can feel time pressure from here. <br> <br>Hope any of this helps. Don't despair. <br> <br>Jon</p>"
