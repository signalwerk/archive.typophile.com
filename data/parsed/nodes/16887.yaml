    html: |-
      <p>I agree with dan about the obviously computer made quality of the b/w image. I have to admit it basically works on some level - but it could be better. Much better. </p>
      <p>Redraw the book/graduation hat by hand. Then some life will return to the core logo element. While your at it draw it again many times to make sure your making the best one you can. But... maybe not</p>
      <p>At some level I don't know that I would use that book/gradhat idea because it is so potentially ambigous. It's like the classic visal illusion young lady/old lady-crone image in that you have to resolve the image either one way or the other. As a hat or as a book. Not both. I am not sure that that effect - while effective - is a good one to have at the core of a company identity. It seems to say you can be academic or research but not both at once - which is effectively the opposite of what the company does. It DOES do both. And that is the point.</p>
      <p>And Dan is right about the negative tracking on the font. Some fonts can handle it better than others &amp; this one can't it seems. I also don't think it makes a strong statement for you. It's too nothing in particular. I think a type face needs to contribute meaning to the logo. So in short I suggest that you try something else. Or maybe explain what you want the font to be saying &amp; why.</p>
