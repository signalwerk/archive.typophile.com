    html: <p>Love the graphic but the type/graphic relationship needs to be changed. Explore either making the graphic or the type smaller. Right now they are both fighting for the same attention. Your type is boring and I hate the negative leading. That y is almost crashing the R. You are another person who needs to get away from the computer and free up your creativity and sketch. Work on relationships.</p>
