  html: |-
    <p>The multi-disciplinary design studio, Kapitza will be joining us at St Bride to talk about their working processes and inspirations. They will discuss their profound fascination with fonts and where ideas for these are found and how they are subsequently pursued, developed and refined. Their extensive Geometric and Organic collections, for example, have been realised as published books that illustrate and explore the diversity of the font collection.</p>
    <p>They will also share with us their experiences of the ins and outs of self-publishing, the creation of pattern fonts, how to start a font foundry, designing an app, book design and working with a worldwide audience.</p>
    <p>Kapitza collaborate with a variety of international clients to create exhibitions and products featuring their distinctive artworks, such as stationery, canvasses, calendars, wall stickers and tiles, textiles and postage stamps.</p>
    <p>Copies of their new self-published book Organic will be available to purchase at a special discount after the talk.</p>
    <p>Wednesday 30 May 2012 at 7pm<br>
    Bridewell Hall, St Bride Foundation<br>
    Standard £12.00<br>
    Concession (Friend of St Bride Library or full time student) £8.00</p>
    <p>Tickets can be booked here: <a href="http://www.eventbrite.com/event/3305866937/" title="www.eventbrite.com/event/3305866937/">www.eventbrite.com/event/3305866937/</a></p>
    <p>stbride.org/events</p>
