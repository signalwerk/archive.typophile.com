    html: |-
      <p>As the beginner I am, I feel there are some lacks of consistency across the font, even when they could be only in my mind.<br>
      First of all, some characters (<em>Futura-like</em> c, e, o, O, Q and 0) seem to me very discomfortable, perhaps due to their extreme geometrical ('unnatural') shape I would intuitively try to soften and overhelm.<br>
      Another thing disturbing to my eyes has to do with the high weight: there are certain unbalances that become evident in the a, e, f, z, E, F, G, 2, 5, 8, not to mention the odd ø, ligatures and accents, all related to the way you manage the boldness.<br>
      One distracting question about the sample is that some outlines render ugly because they are not propperly merged.<br>
      That's all at a very first sight.<br>
      I'll be back later, when I get more time.<br>
      Cheers,</p>
      <p><strong>MarS</strong></p>
