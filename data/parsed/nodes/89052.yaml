    votes: null
    html: |-
      <p>Ha, Hrant!<br>
      It may well be, that this was partly your fault :-) Sometime around here you were talking about only slightly slanting italics. That could have been one of the reasons to try this approach. But the main reason was that i intended to make the overall widths of the four weights the same. With only a gentle slant this was the best way to do it. But then other ›cursive‹ elements were needed to make the italic work as a companion and to be a convincing type for emphasis in running text.</p>
