    html: |-
      <p>The concept of mixed sans/serif families is fairly new (eg something that has started in the last decades). Earlier examples are in the line of what Frutiger did: using an existing sans or serif family as a starting point for a variant serif or sans. If I recall correctly the block serif Serifa shares a lot of basic forms with Univers.<br>
      Another example of this procedure, but maybe more controlled is what Martin Majoor did with Scala. He first did the sans and the serif a couple of years later. </p>
      <p>I don’t think you will find a lot of examples.</p>
