    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Manilla_hand_drawn_5150.jpg"></div><p></p>
      <p>I attached some more logo ideas. I really can't pinpoint which direction I want to go in. Why am I treating this identity like it's for Nike lol? </p>
      <p>Anyways, to answer some of your questions:</p>
      <p>Yes, Manilla is a creative agency and yes we're US based. We chose the name for a couple of reasons: </p>
      <p>Aluminum is half right on one of them. It does represent the plain, generic office cubicle-land. But to me it more so representative of the manila paper I drew on as kid. Creativity was welcome and free to express.</p>
      <p>It's an inside joke. I'm half asian, so if you take a yellow asian man and mix it with a white caucasian man what do you get? Bad joke.</p>
      <p>The two L's in manilla stand for my sister and I -- it's our company. Having the L's connected can represent our brother-sister relationship.</p>
      <p>It sounds fun to say! We wanted a name that didn't make us <em>seem</em> like geeks i.e Hyper Revolution Media or Digitalistic Realm Design.</p>
      <p>Aluminum, since you said it reminds of of the corporate world that makes it even more important for us to show in the identity that we're completely opposite of "cubicle land". That's why I feel a hand-drawn/"artsy" logo will hopefully get the message across.</p>
      <p>As of now, I'm leaning towards the bottom ones. Unfortunately, it takes the emphasis away from the L's but I feel it's more fitting. As you can see in the top right, it looks funky mixing computer fonts with hand drawn letters in the same word. Well, at least the way I'm doing it.</p>
      <p>What do you all think? BTW, these are all roughs and the bottoms ones aren't supposed to be on a baseline.</p>
    html_clean: |-
