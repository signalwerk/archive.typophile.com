    <p>I'm trying to create an identity for my company, Manilla, but I'm having a hard time deciding what it should look like. I want the logo to represent that we are creative, fun and artistic (traditional arts). We try to use our own artwork in all the sites we do if the client is willing and if it fits. I've looked around for inspiration like on Logopond and Behance but I haven't found what I'm looking for.</p>
    <p>However, Mike Perry has a lot of great hand-drawn type <a href="http://www.midwestisbest.com/work.php" title="http://www.midwestisbest.com/work.php">http://www.midwestisbest.com/work.php</a><br>
    The question is, if I decide to use a hand-drawn logo will that look less professional? </p>
    <p>I attached some past <strong>mock-ups</strong>. The last one is what I'm trying to perfect. The L loops represent my sister and I and are also supposed to be a stylized M.</p>
    <p>btw, hi Typophiles! (first post)</p>
