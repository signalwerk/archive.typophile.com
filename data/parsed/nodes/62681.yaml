      <p>Paul: <em>i believe there is a bug that limits the number of characters for font names within Mac Word. Could this perhaps be the problem?</em></p>
      <p>I reckon that to be absolutely sure that the <em>PostScript name</em> will not generate errors, it should be limited to 28 characters. For at least older Mac versions of MS Word the <em>Full font name</em> (nameID 4) should not contain more than 32 characters. One way to circumvent this, is to limit the <em>Compatible Full name</em> (nameID 18) for the Mac to this number.</p>
    html_clean: |-
      <p>Paul: <em>i believe there is a bug that limits the number of characters for font names within Mac Word. Could this perhaps be the problem?</em></p>
