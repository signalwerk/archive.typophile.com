      <p>Joshua: <em>It is this apparent randomness that leads me to believe there’s a Word 2008 issue at play [...]</em></p>
      <p>After running some extra tests in Word 2008 for Mac, version 12.2.1, under Leopard 10.5.4. (Server, because of image file), I tend to agree with Joshua. By removing fonts (after quitting Word) that didn't appear initially in the Word font menu and reinstalling these (without cleaning caches), the fonts in question showed up after a spinning wheel session in the restarted Word. Therefor it looks to me a matter of font menu refreshment, especially because the ‘hidden’ fonts seem to work via the style keys. Also the problem does not seem to be restricted to OpenType (CFF/TTF) fonts.</p>
