      <p>The name length thing may <em>also</em> be a problem, and should be checked out, but I have also seen this behavior in Word 2008 with names that are well within those limits.</p>
      <p>One thing I've noticed is that it is not necessarily predictable or even repeatable: for example, installing a family with members Light, Light Italic, Regular, Italic, Medium, Medium Italic, Bold, and Bold Italic, in one instance it might be the Light Italic that doesn't show in the menu. A separate install could omit the Medium Italic. It is this apparent randomness that leads me to believe there's a Word 2008 issue at play, and not necessarily a font naming or styling issue.</p>
    html_clean: |-
