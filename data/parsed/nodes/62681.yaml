      <p>I have also witnessed some strange behavior, very similar to what's described, in Word 2008 Mac. It seems to affect only "super-families", that is, families with more than the usual 4 members. Have not found anything wrong with the font data despite numerous investigations of naming, weight class values, PANOSE, etc... It really seems to be something with Word 2008 Mac (only).</p>
      <p>We haven't found a workaround; fortunately the actual style-linking seems to function correctly...it's just the Font menu entry issue that is a problem.</p>
