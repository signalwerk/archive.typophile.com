  html: |-
    <p>Maybe I’m the last kid on the block on this one, but congrats Tamye on your blurb in the ‘<a href="http://www.nytimes.com/2005/07/17/magazine/17CONSUMED.html?">Type Casting</a>’ article in the <em>NY Times Magazine</em> this weekend. It’s also good to see a great face like Bello get such good press.</p>
    <p>Even the cover is typographic. Though, I question the font choice… {<a href="http://nytimes.com/pages/magazine/index.html">the magazine online</a>} A JPEG of the cover is attached to this post.</p>
