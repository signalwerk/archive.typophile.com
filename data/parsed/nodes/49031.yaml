      <p>When you say "short-run," are you thinking about offset or digital printing?</p>
      <p>If you are printing only 250 books, an offset shop such as Meridian is going to be very spendy. But charles_e is right: they are very good.</p>
      <p>Since you are not getting any responses about short-run printers in NYC, check out BookMobile.<br>
      <a href="http://www.bookmobile.com/" title="http://www.bookmobile.com/">http://www.bookmobile.com/</a><br>
      Mostly they do paperback books on uncoated stock. But they also do very good photo work on coated stock, and they can bind your book in boards. Their high-end color &amp; b/w work is getting very close to "offset-quality" when they are given good files to work with.</p>
      <p>&amp; they will send you a set of proofs before they run the whole edition.</p>
      <p>powers</p>
