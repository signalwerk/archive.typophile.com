      <p>Hi Will,</p>
      <p>Not to disagree terribly, but "approaching offset" is a loaded term. I've seen some pretty poor offset printing (including images).</p>
      <p>The only way to get it right, regardless of the paper, is to prepare a profile for a printer -- taking into account the *characteristics* of both the paper used &amp; the press (includes ink). Then ignore all that dribble the printer sends out about chopping off the last 10 percent of the black &amp; white. The profile handles dot gain; done right, you only loose about 1/2 of one percent with the black. White loss depends on the boundary colors (tones) of the image &amp; whether or not you want to allow them to fade into the paper.</p>
      <p>I suppose I'm biased, but it became apparent to me long ago that the old dicta "price, quality, speed -- pick two" is wrong. It is really "pick one."</p>
