      <p>Is Rhode Island close enough? Extremely fine book printer of photographic images is Meridian Printing, in East Greenwich, Rhode Island. <a href="http://www.meridianprinting.com/" title="http://www.meridianprinting.com/">http://www.meridianprinting.com/</a><br>
      My wife also suggests that you simply make "portfolio" editions by printing the text conventionally; make 100 to 200 photographic prints of the images; and then hand-affix the images onto the book pages. Something like the old method of spot-gluing plates in letterpress days.<br>
      The resulting albums could be very valuable.</p>
