  html: |-
    <p>i'm designing the back of a postcard for a tech client's IBC tradeshow party in Amsterdam.<br>
    After sending the layout, which is sophisticated and euro simple she asked for - </p>
    <p>"funky splatter text and all skewed" </p>
    <p>and she said it 2x, so she's adamant.</p>
    <p>does any typeface like that or look and feel come to mind?</p>
    <p>that's still sophisticated and euro?</p>
    <p>the copy is something like this so you get a sense of how much to make splattery and skewed.</p>
    <p>VIP Party at IBC 2008</p>
    <p>Saturday 17 September<br>
    21:00hr – 1:00hr</p>
    <p>At Cobra Cafe BV<br>
    Rjiks Museum Square<br>
    Hobbemastraat 1<br>
    Museumplein, Amsterdam<br>
    + 31 (0) 20 47 00 11</p>
    <p>urgh,<br>
    thanks,<br>
    liz</p>
