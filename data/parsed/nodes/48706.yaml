      <p><a href="http://www.fontshop.com/fonts/singles/font_bureau/reactor_degrading/" rel="nofollow">Reactor Degrading</a></p>
      <p>"First drawn in 1993 by Tobias Frere-Jones for Neville Brody’s Fuse magazine, Reactor FB combines abraded forms with Tesla’s theory of destruction through accumulating rhythmic points of noise. The “Derelict” style offers choices of eroding framework for each character. In Degrading, each letter flings soot and smut at its stark neighbors until accumulating flecks build up a roaring vibration that can overwhelm the outlines; FB 1996"</p>
