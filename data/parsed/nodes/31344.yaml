    <p>Merely a concept sketch (currently two sliced fonts put together; the final would be a continuous and original whole) ... but what do you think?</p>
    <p><img src="/sites/default/files/old-images/Minotaur_4703.jpg"></p>
    <p>Has this been done much before - half one style, half another? If so, can you recommend examples? Is this experimental or just stupid?</p>
