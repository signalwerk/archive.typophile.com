    html: |-
      <p>this idea got done to death in the early to mid 90's. it was initially an idea p. scott came up with at cranbrook -- he did it by manually combining postscript files from a sans and a serif in a text editor, cut and paste until he got something that worked -- but then everyone and their mother copied the idea with varying degrees of success. usually, not so much.</p>
      <p>there were about eight thousand variants for a while and wow was it tired by 1995.</p>
      <p>my favorite take was patrick giasson's "the royal family." currently off the market, unfortunately.</p>
