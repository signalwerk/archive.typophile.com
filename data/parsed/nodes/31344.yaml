    html: <p>I'm inclined to suggest quartering your source fonts crosswise for some of the characters, rather than halving them horizontally as you have in your image posted above. It might make for more balanced contrast, or it might just make it look weirder. It could suggest solutions to the problem of the lower half dominating in letters with long decenders like the "g" and "y".</p>
