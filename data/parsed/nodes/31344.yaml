    date: 2007-02-10T16:12:00
    votes: null
    html: <p>I think there is not much of a market for this kind of thing now. But if you are interested in doing it for it's own sake then by all means go on with it. I think there are more useful projects to do in order to learn about designing fonts - but to each his own.</p>
