    html: <p>Yup. The example I know of is <a href="http://emigre.com/EF.php?fid=88" rel="nofollow">Dead History</a> by P. Scott Makela. I dont' know if I personally am a fan of the style, but that doesn't mean that you shouldn't pursue it -- I'm sure that other people would have a use for it. As long as you follow through on making the letterforms smoother, I think you should be good to go. Now that I'm looking at yours, the effect is growing on me -- Dead History is a bit too out there for me, but yours has a more pleasing effect, even at this stage. Keep going.</p>
