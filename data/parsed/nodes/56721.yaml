    date_raw: 9 Apr 2009 — 6:00am
    votes: null
    html: <p>I guess they're using the term "Letraset" generically, as in "rub down type". Letraset never carried Zelek, only Mecanorma as far as I know. The only difference I can see is that the lines dividing the shapes in the letters are thicker than in the original.</p>
