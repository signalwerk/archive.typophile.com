    html: |-
      <p>I have a Mecanorma catalog from the early '70s where it is called Zelek Black. Bronislaw Zelek is credited as its designer. There were also some related fonts, Zelek Shadline, Zelek Bold, and Zelek Boldline. There is also another face he did called New Zelek that pops up here now and then. </p>
      <p>Solo probably didn't rename it. "Zelda" probably came from a pirate source, which was quite common if you look through catalogs from back in the film font days, even from major typesetting houses.</p>
