      <p>Hi, I redrew this typeface for Wired UK, I found it in an old Typaedia catalogue although it was named 'Zoro', I couldn't find a digital version and I didn't know who originally created it. Great to find out it was Bronislaw Zelek, thanks Mark.</p>
