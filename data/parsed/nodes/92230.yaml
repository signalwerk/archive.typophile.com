    <p>I'm looking to get 'up-to-date' regarding sans-serif typefaces and was wondering if anyone could give me a general overview of what's happening at the moment, particularly with geometric/neo grotesque styles.</p>
    <p>I have got to a point where I am familiar with the majority of 'classic' faces (i.e. Helvetica, Univers, Futura etc). I now want to start using something a bit more contemporary. The problem is I don't really know where to start - I am aware of most of the major foundries and have looked at a few faces I've heard of such as FF Bau, Calibre, Graphik, and Brown, but am concerned I may be missing something very obvious, or should be considering some other options.</p>
    <p>Is there anything that's been released in the past few years that really stands out? Can anyone provide a semi-decent list of faces I should be looking at?</p>
