      <p>I would suggest you look at publications/ads/websites that you like the typography of (or which give you ideas to pursue), and try and identify the fonts used. Then eliminate the oldies and retreads.</p>
      <p>Alternatively, you could investigate the rationales behind a variety of new faces, and see if any of the theory strikes a chord with your own design interests.</p>
      <p>To get a feel for who is designing what, start with MyFonts and FontShop, which distribute the majority of contemporary designers/foundries, and add the self-distributors to ﬁll out the picture:<br>
      <a href="http://typophile.com/node/92109" title="http://typophile.com/node/92109">http://typophile.com/node/92109</a></p>
      <p>Get on the mailing list of foundries/distributors, for email newsletters.</p>
