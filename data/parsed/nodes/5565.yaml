    votes: null
    html: <p>Stephen, I knew about Persons but hadn't looked at it. I think that must be what they used. I just checked an old BB&amp;S catalog and McGrew, both of which show the original metal version. Parsons looks just as funky in metal as all the digital versions mentioned so far. Only Persons has the simpler G, as in the Gracie logo.  <br> <br>Huh! Two Phil Martin faces in one day.</p>
