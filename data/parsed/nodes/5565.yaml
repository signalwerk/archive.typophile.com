    votes: null
    html: <p>By the way, that version of Parsons I linked to is not a very good version of Parsons, but the only digital one I could find. Also, it lacks the alternate G that is used on the Gracie Films logo. You can see better versions of this face in older type books.</p>
    html_clean: <p>By the way, that version of Parsons I linked to is not a very good version of Parsons, but the only digital one I could find. Also, it lacks the alternate G that is used on the Gracie Films logo. You can see better versions of this face in older type books.</p>
  - id: 39856
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p><a href=\"http://www.moorstation.org/typoasis/designers/steffmann/index.htm\" target=\"_blank\"> Dieter Steffmann</a> digitized a set of 3 Parsons Bold fonts under the name Puritan. The set contains the base font as well as an Alternates and a Swash variant. None of these include the G in the Gracie image, but Puritan Regular contains that M, which the Alphabets version doesn't. <br> <br>Herr Steffmann digitized Parsons Heavy and, for some reason, allowed it to keep its name. This also includes an Alternates font. <br> <br>Finally, for completeness sake, there's an old Compuworks font called <a href=\"http://www.grsites.com/modperl/fontview.cgi?dir=c&amp;fn=CW_CHRCH\" target=\"_blank\"> Churchman</a>. This is Parsons Light. <br> <br>None of these fonts are terribly well made and the Compuworks font is missing some punctuation and all extended characters. They all look lousy on screen at even medium small sizes. <br> <br>I know how you all drool over Swash fonts, so here's Puritan Swash: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/40711.gif\" alt=\"\"></p>"
    html_clean: "<p><a href=\"http://www.moorstation.org/typoasis/designers/steffmann/index.htm\" target=\"_blank\" class=\"link-external\"> Dieter Steffmann</a> digitized a set of 3 Parsons Bold fonts under the name Puritan. The set contains the base font as well as an Alternates and a Swash variant. None of these include the G in the Gracie image, but Puritan Regular contains that M, which the Alphabets version doesn't. <br> <br>Herr Steffmann digitized Parsons Heavy and, for some reason, allowed it to keep its name. This also includes an Alternates font. <br> <br>Finally, for completeness sake, there's an old Compuworks font called <a href=\"http://www.grsites.com/modperl/fontview.cgi?dir=c&amp;fn=CW_CHRCH\" target=\"_blank\" class=\"link-external\"> Churchman</a>. This is Parsons Light. <br> <br>None of these fonts are terribly well made and the Compuworks font is missing some punctuation and all extended characters. They all look lousy on screen at even medium small sizes. <br> <br>I know how you all drool over Swash fonts, so here's Puritan Swash: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/40711.gif\" alt=\"\"></p>"
