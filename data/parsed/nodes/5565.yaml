    date_raw: null
    votes: null
    html: <p>I think only about half of Phil Martin's fonts are available in digital format, and many of those are incomplete (basic character set only--no alternates, ligatures or swash characters). Persons is among the undigitized. Several parties are at work rectifying this situation, but it takes time.</p>
