    <p>Hi all,</p>
    <p>I have generated <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OTF</a> fonts from my vfb file which work fine, but when I try to generate the <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TTF</a> fonts they don't come as well, the <a href="/wiki/hinting" class="freelinking" rel="nofollow">hinting</a> seems to be off on them. How should I go about generating the TTF fonts using my vfb to get better results.</p>
    <p>c.</p>
