      <p>Eben, </p>
      <p>Windows TrueType was extended by Microsoft and named TrueType Open around 1994-95, and later (1997-98) renamed to TrueType-flavored OpenType, or OpenType TT. FontLab has supported TrueType and therefore TrueType-flavored OpenType since version 3.0, and allowed including OpenType Layout features since version 4.0 that came out in 2001. However, in FontLab versions prior to Studio 5, the OpenType TT was simply labeled "TrueType (.ttf)" or "Windows TrueType (.ttf)". </p>
      <p>A.</p>
