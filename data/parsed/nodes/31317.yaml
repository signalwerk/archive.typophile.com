      <p>Coop, </p>
      <p>indeed, the alignment zones and standard stems should in principle be the same between formats. But sometimes, it turns out to be necessary that you replace two alignment zones or stems with one that has a larger value, so that more things are aligned. Good setting of alignment zones and stem values has more impact in the TT hinting model than in the PS hinting model, because the PS hinting model is simpler while the rasterizer makes more decisions as for what to unify and align. In the TT hinting model, this information is taken more directly from the stems and zones, and of course, is driven by the instructions. But worrying in detail about the instructions is a yet another level of complexity, which I wouldn't worry at this point. </p>
      <p>Note that if you're using ClearType, the dependance on the perfectly optimized stems is slightly less relevant, but alignment zones are still important. </p>
      <p>Also, for the stems, what's important to fine-tune in the TT hinting is the ppem sizes at which stems "jump" from one pixel to two pixels (and then from 2 to 3 etc.). Especially when designing semibold or bold styles, there may be some screen sizes where, using the standard Windows antialiasing (not ClearType), some styles may look the same although they nominally have different weights. In such case, for the bolder styles, you'd set the ppem sizes in which stems jump from 1 to 2 pixels lower (so they become thick "earlier", e.g. at 13 ppem), and for the regular styles higher (so they stay thin "longer", e.g. 17 ppem). I personally prefer typefaces for the screen where the regular style jumps from one pixel to two pixels as early as 15 ppem, but in a large family with many weights, this might not be practical (on the other hand, in such a family, it could be the Medium style that jumps at 15 or even 14). </p>
      <p>Perhaps what I'm saying is that when choosing the optimal alignment zones and stems, you may want to test both PS and TT outlines and how they appear on screen, and then only after testing both outline flavors, you'd decide on using the same set of stems and zones for both PS and TT. </p>
      <p>Adam</p>
