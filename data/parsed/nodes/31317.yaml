      <p>Regarding TrueType hinting -- FontLab Studio has very sophisticated autohinting which converts PostScript hints into TrueType instructions. However, it takes some experimentation to achieve the best results. One option would be to use Adobe's PostScript autohinter that is built into AFDKO 2, open the autohinted font in FLS and then convert the hints to instructions. Alternatively, you can use FLS's built-in autohinter. Two essential settings that should be carefully set, and perhaps re-turned several times *after* PostScript autohinting but *before* converting hints to instructions, are Font Info / Hinting settings / Alignment zones and also Standard stems. You can use the "Auto" buttons there (*after* PostScript autohinting) but it's sometimes useful to manually edit the stems to reduce their number (you'd usually take some average values). </p>
      <p>After converting hints to instructions, the stems are imported into the TT Hinting Options dialog (that can be opened by clicking on the "..." button in the TrueType Options panel when using the TrueType Hinting tool). In there, you can experiment with the "Optimize PPM" button and the "Reset PPM" button as well as with changing the values (you should open a multiline preview from the TrueType Tools panel, and then click on the "Apply" button in the TT Hinting Options dialog and observe how the results change). </p>
      <p>Adam</p>
