      <p>What amazes me lately is the ability of those who are in now way shape or form, designers, to find themselves WORK as designers. </p>
      <p>I find the problem to be that our audience is ignorant (clients).</p>
      <p>I recently printed a banner for a guy. He got to the framer and came back to ask us why his logo (which looked so nice on his business card) looked so bad at large sizes. I calmly explained that we were not at fault--some idiot decided to livetrace the most simple of compass designs and not even worry that it couldn't become any bigger without being noticeable. </p>
      <p>The funny thing is that the compass can be found in Zapf Dingbats, outlined, and voila! Some guy managed to find a picture on the web, I'm presuming, and livetrace it. Which is sooo much more work than it required. </p>
      <p>I offered to give him a perfect logo for payment of 1 hour--but he's got his "logo guy" working on it.</p>
      <p>Indeed, God help us help them.</p>
