    html: <p>To me the most worrying issue isn't about the fee, it's about how the work of a designer is misunderstood and design trivialised. The fact that Canada Glulam could post such a request on this forum without embarrassment shows that we have a vast problem of how what we do is perceived and valued. Most of us would feel we are so well outside the realm of Crowdspring and similar sites we can ignore the phenomenon but they are having an insidious impact and are redefining and solidifying what we do as light weight and low status. As are those crass and laughable sites where 'off the peg' logos can be chosen like Build-A-Bear. We might dismiss all this as beneath our concentration but I was at a branding conference recently where the presentation of one of those sites (and it's £10 price tag) was greeted with extraordinary excitement and rapturous applause by professionals who would be horrified to apply such standards to their own fields. Can't help feel it is our fault if design is held in such slight regard and it makes us very vulnerable now. There has always been hack, ignorant work of course but computer technology is giving it a spurious respectability and power to overwhelm and control and as anyone has the means of production, anyone is a designer and we are diluted into oblivion! The responsibility lies with us to change this and establish the high ground. Everything is in flux. Now or never I rather think.</p>
    html_clean: <p>To me the most worrying issue isn't about the fee, it's about how the work of a designer is misunderstood and design trivialised. The fact that Canada Glulam could post such a request on this forum without embarrassment shows that we have a vast problem of how what we do is perceived and valued. Most of us would feel we are so well outside the realm of Crowdspring and similar sites we can ignore the phenomenon but they are having an insidious impact and are redefining and solidifying what we do as light weight and low status. As are those crass and laughable sites where 'off the peg' logos can be chosen like Build-A-Bear. We might dismiss all this as beneath our concentration but I was at a branding conference recently where the presentation of one of those sites (and it's £10 price tag) was greeted with extraordinary excitement and rapturous applause by professionals who would be horrified to apply such standards to their own fields. Can't help feel it is our fault if design is held in such slight regard and it makes us very vulnerable now. There has always been hack, ignorant work of course but computer technology is giving it a spurious respectability and power to overwhelm and control and as anyone has the means of production, anyone is a designer and we are diluted into oblivion! The responsibility lies with us to change this and establish the high ground. Everything is in flux. Now or never I rather think.</p>
