      <p>Orange is correct, and no-spec.com is a great place to learn why. </p>
      <p>I also encourage "Canada Glulam" to spend some time considering how they might react to a proposal for a project with ZERO guarantee of ANY compensation. Is that how you run your manufacturing company? You research, design and produce a product, and do so while knowing your client has solicited thousands of other manufacturing companies to do the exact same project? You invest your time, resources, materials, and expertise to complete the project. </p>
      <p>Then, "your" client picks only <strong>one</strong> manufacturing company to pay, and the other thousands of companies get nothing - except stuck with a useless product. They can't even sell it themselves, because it's specifically designed for the client and it'd be legal infringement to sell it. Sound like a good way to make a living? </p>
      <p>And worse---what would happen to the manufacturing industry if they all had to survive in this system?</p>
