  html: <p> For TTF you have loads of handy little tools with which you can preview, select and print your fonts, for Postscripts you obviously have Adobe's Type Manager Lite, but with that one you can only view one at a time, and basically it is far from convenient to use. So without forking out the big cash, I am looking for a handy shareware/demo little tool to do this, preferably downloadable. </p>
  html_clean: <p> For TTF you have loads of handy little tools with which you can preview, select and print your fonts, for Postscripts you obviously have Adobe's Type Manager Lite, but with that one you can only view one at a time, and basically it is far from convenient to use. So without forking out the big cash, I am looking for a handy shareware/demo little tool to do this, preferably downloadable. </p>
