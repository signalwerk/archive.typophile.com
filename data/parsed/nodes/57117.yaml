      <p>Alaskan, thank you very much for the link!<br>
      Unfortunately, I have noticed that more and more companies want to work with designers it terms of a contests. I guess it’s a side effect of a current financial crisis—they simply want less for more. (I don’t know what’s the situation in the US, but in Eastern Europe it is like that... Sad.)</p>
      <p>Now, to not make it entirely off-topic...</p>
      <p>angechilada<br>
      Concerning your design... The negative leading does not work well here. If you are going to enter the contest, go for something simple. As the typefaces go, it is actually pretty hard to find a good, reliable, classic serif font that is free. I can suggest trying out Microsoft’s Georgia. It has oldstyle figures, so the 2008 part would look nice... Also the kerning in YO is way off (the letters should be closer to each other). You should also let the type breathe. Letterspace an uppercase a little (Yorkville Cellars especially) and maybe make the type a bit smaller to give it more space?</p>
