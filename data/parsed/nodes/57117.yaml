      <p>I second the remarks from Alaskan and aluminum about expanding your portfolio with personal work or nonprofit work, and I say that as a fellow student. I’m particularly fond of nonprofit work. There’s bound to be a local organization that would love to be able to sit down with a designer, but can’t afford to. </p>
      <p>Locally, I’m currently working with a NP that provides services and resources to HIV/AIDS patients and low-income families. I have a good amount of creative freedom and get to (carefully) educate non-designers about the value of our work. When it’s done, I’ll have a solid identity system for my portfolio with a variety of elements in it, and a warm fuzzy feeling from working for these people (who do an incredible job at an incredibly difficult and stressful job, if that makes sense).</p>
