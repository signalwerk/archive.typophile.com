      <p>Angechilada,</p>
      <p>It has nothing to do with being a student. There are several ways to expand your portfolio and gain experience without undercutting the profession you want to join. If graphic designers continue to work for free through contest work, how will you ever earn a living after graduation? Think about how you’ll feel when you can’t find a job, but you’re working 80 hours a week entering contests in the hope of getting paid.</p>
      <p>If you want to gain experience and build a portfolio, work on your own identity. Do you have a personal logo? Business card? </p>
      <p>Or, find a non-profit charity and volunteer to do some pro-bono work for them. When I was in college, I did several projects for a women’s shelter. </p>
      <p>You can do work for a friend or relative. Do you know any musicians? Tell them you’d like to take a stab at making them a logo, poster, or album cover.</p>
      <p>The projects I’ve suggested are far more valuable to your education than a contest could  ever be. Graphic design is MUCH more than making something look pretty. It’s visual communication, and in order to craft the right message, you need to understand your client. A contest doesn’t offer any relationship to the client, so any understanding is minimal. It’s guess work! Good communication through design is NEVER guess work.</p>
      <p>AK</p>
