    <p>Okay, so I’m entering a side contest for a wine label re-branding, and I have a draft, but I really hate the typeface for the “Yorkville Cellars/2008” part.  For the logo, the sumi-e style “y” had to remain part of the label; and the specific information listed on the label also had to be there.  The logo image provided is pretty low quality, so it can’t be made much larger without looking grainy.  I just wanted to know mainly opinions/recommendations for spacing of the type, or maybe some different (free?) typefaces that I could perhaps use for the text on the label.  </p>
    <p>I’m thinking of maybe centering the “Yorkville Cellars” as well, even though it’s kind of boring.  The image for the wine is supposed to be not corporate looking, but more of a country, organic feel, while still being minimalistic. I was trying to maybe find a serif font that isn’t too rigid, but a little more playful? Please help. Thanks. :)</p>
    <p>Draft: <a class="freelinking-external" href="http://i49.photobucket.com/albums/f254/strwbrrygshs88/newred.jpg">Yorkville Cellars</a></p>
