    <p>I have been on the television news this weekend, on several Belgian channels. I was in photos in almost every Belgian newspaper, mostly in the Arts or Culture sections. One of these newspapers even published an online photo special, and you can send friggin' e-cards with me on it!</p>
    <p>Well, that is me and the 1949 other participants of <a href="http://www.spencertunick.com/" target="new" rel="nofollow">Spencer Tunick</a>'s installations for the <a href="http://www.corpusbrugge05.be/" target="new" rel="nofollow">Corpus Brugge 05</a> art festival last Saturday morning. It was freezing cold, barely 5°C. It was raining. The ones that couldn't get in at the first installation (limited capacity) had to wait from 03:15 till 06:45, outside, with no shelter, waiting for sufficient light for the outdoor shoot. During the shoot we were standing with our bare feet in puddles of icy water on wet cobblestones. And just because I was at the outskirts of the installation, I was smack dab in front of the television cameras and newspaper photographers who were positioned a mere 10 meters away.</p>
    <p>I have been on the <a href="http://www.vrtnieuws.net/nieuwsnet_master/default/magazine/overzicht/050507_CorpusBrugge/index.html" target="new" rel="nofollow">television news</a> this weekend, I was in photos in <a href="http://www.standaard.be/extra/fotospecials/index.asp" target="new" rel="nofollow">almost every Belgian newspaper</a>, you can even send friggin' e-cards with me on it... naked.</p>
    <p>Would I do it again? In a heartbeat. This experience, nobody can take that away from me. My wife thinks it's funny like hell and wishes it had been summer so she could've joined me, my kids think I'm way cool (luckily they're not teenagers yet), and my colleagues and friends all had a good laugh.</p>
    <p>I am become art, and it was friggin' awesome.</p>
