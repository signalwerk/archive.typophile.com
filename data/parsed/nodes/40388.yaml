  html: <p>Small circular character used as a universal typographic element, principally in the role of a <a href="/wiki/period" class="freelinking" rel="nofollow">period</a>, but also as part of an <a href="/wiki/i" class="freelinking" rel="nofollow">i</a> or <a href="/wiki/j" class="freelinking" rel="nofollow">j</a>. <a href="/wiki/Comma" class="freelinking" rel="nofollow">commas</a> are often extensions of the period dot.</p>
