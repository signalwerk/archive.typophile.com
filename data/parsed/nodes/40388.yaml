  html: <p>Small circular character used as a universal typographic element, principally in the role of a <a href="/node/add/wiki?edit%5Btitle%5D=period" title="Create node &quot;period&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">period</a>, but also as part of an <a href="/node/add/wiki?edit%5Btitle%5D=i" title="Create node &quot;i&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">i</a> or <a href="/node/add/wiki?edit%5Btitle%5D=j" title="Create node &quot;j&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">j</a>. <a href="/node/add/wiki?edit%5Btitle%5D=Comma" title="Create node &quot;Comma&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">commas</a> are often extensions of the period&nbsp;dot.</p>
