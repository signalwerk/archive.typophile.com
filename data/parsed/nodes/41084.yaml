    html: |-
      <p>The API is also pretty awesome. If you have a Wordpress blog, for instance, you can use a  plugin to automatically use Flickr as a database of your images if you want to create a photo gallery. That’s what I have on my page <a class="freelinking-external" href="https://web.archive.org/web/20080709010409/http://dangayle.com/photos">Photos</a>.</p>
      <p>At my school’s newspaper, we use Flickr to manage all photo content that is going to be published. Editors can comment on which ones they like best, etc., for selection for print. THEN, as an added benefit, our Webmaster can then hotlink to Flickr so that readers can look at higher-res versions and also to comment.</p>
      <p>It’s a win-win-win situation.</p>
