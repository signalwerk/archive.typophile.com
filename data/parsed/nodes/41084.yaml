      <p>Real links instead of JavaScript pseudolinks, meaning every photo has a permalink. Tags, sets, collections. You can upload by E-mail or any number of other methods.</p>
      <p>Certain tasks are unreasonably difficult on Flickr, but most tasks aren’t.</p>
