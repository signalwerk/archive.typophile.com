    <p>I use <a href="https://web.archive.org/web/20080709010409/http://picasaweb.google.com/russ.mcg/SignsFoundGraphicsAndType">Picasa</a> to host images.</p>
    <p>All the cool kids and designers seem to use Flickr. Is there any particular advantage I’m missing? Any compelling reason I should use Flickr instead of Picasa? </p>
    <p>.... Aside from being cool, I mean.</p>
