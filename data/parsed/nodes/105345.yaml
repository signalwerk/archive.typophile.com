    html: <p>That kind of serifs are normally called <em>flare</em> serifs or <em>lapidary</em> serifs. If the curves would be straight and the forms looks like a triangle, one might call them <em>wedge</em> serifs. Triangularity usually is not described with slanted. Slanted is normally used for letters, words or fonts being skewed ‘electronically’ i.e. by means of simple software modification and without any optical compensation.</p>
    html_clean: <p>That kind of serifs are normally called <em>flare</em> serifs or <em>lapidary</em> serifs. If the curves would be straight and the forms looks like a triangle, one might call them <em>wedge</em> serifs. Triangularity usually is not described with slanted. Slanted is normally used for letters, words or fonts being skewed ‘electronically’ i.e. by means of simple software modification and without any optical compensation.</p>
