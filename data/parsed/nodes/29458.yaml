    <p>I started working on the small-caps of the serif a few days ago after work.</p>
    <p>That's the first time I've been working on making small-caps and I need your experienced advices and eyes.</p>
    <p>Today I added the Æ ligature, but the original one for the capitals (the gray one) seemed just odd so I redrew it, that too needs your eyes.</p>
    <p>There's the SVG (Inkscape format) for review: <a href="http://www.heliosmulti.com/images/dejavu-smallcaps/dejavu-smallcaps-005.svg" title="http://www.heliosmulti.com/images/dejavu-smallcaps/dejavu-smallcaps-005.svg">http://www.heliosmulti.com/images/dejavu-smallcaps/dejavu-smallcaps-005.svg</a></p>
