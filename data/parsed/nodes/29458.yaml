    html: |-
      <p>Release 011!</p>
      <p>I finally started porting the glyphs to the font.</p>
      <p>Here's the file:<br>
      <a href="http://www.heliosmulti.com/images/dejavu-smallcaps/djvus-sc-011.zip" title="http://www.heliosmulti.com/images/dejavu-smallcaps/djvus-sc-011.zip">http://www.heliosmulti.com/images/dejavu-smallcaps/djvus-sc-011.zip</a></p>
      <p>Unfortunately no preview file yet.</p>
      <p>-------------------------------------------<br>
      From the Readme:<br>
      First release as a font file. First revision of the left and right bearings (on all characters).</p>
      <p>Changes:<br>
      - Old-style figures<br>
      - The complete Basic Latin letterset -- except @, %, $<br>
      - From the Latin-1 supplement:<br>
         -- all variants of "A"<br>
         -- "AE" ligature<br>
         -- Ccedilla<br>
         -- Eth<br>
         -- Oslash<br>
         -- Thorn<br>
      - From Latin Extended-A: "OE" ligature.<br>
      - Modified Basic "o" width and bearings.</p>
      <p>To Do:<br>
      - Drawings for a few characters to complete coverage of Basic Latin, Latin-1 Supplement and Latin Extended-A:<br>
         -- Eng<br>
         -- Yen // NO OFFICIAL MAP<br>
         -- Pound // NO OFFICIAL MAP<br>
         -- Cent old-style<br>
         -- Percent<br>
         -- At @<br>
         -- Dollar old-style<br>
         -- Dollar small (same as Dollar old-style?)<br>
      - Composition of basic letters with accents to complete coverage of Basic Latin, Latin-1 Supplement and Latin Extended-A.</p>
