    html: |-
      <p><em>Here's an update</em>.</p>
      <p>Changed a lot of stuff that I can't actually all remind. </p>
      <p>Of what is obvious:</p>
      <ul>
      <li>added many glyphs to the small-caps set,</li>
      <li>added a first attempt to old-style numerals,</li>
      <li>added a "Th" ligature.</li>
      </ul>
      <p>Also in the less obvious (but you probably notice it anyway):</p>
      <ul>
      <li>tweaked the letters heights on the rounded small-caps letters that seemed to be too low or floating in the air,</li>
      <li>tweaked some shapes so they fit better with the overall color of the typeface.</li>
      </ul>
      <p>I really wish you would help me, all you experienced type designers. You might not give a damn, but <strong>I do</strong>.</p>
      <p><em>There’s the SVG </em>(<em>Inkscape format</em>)<em> for review</em>: <a href="http://www.heliosmulti.com/images/dejavu-smallcaps/dejavu-smallcaps-009.svg" title="http://www.heliosmulti.com/images/dejavu-smallcaps/dejavu-smallcaps-009.svg">http://www.heliosmulti.com/images/dejavu-smallcaps/dejavu-smallcaps-009.svg</a></p>
