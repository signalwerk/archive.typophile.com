      <p>Looks like it's coming along nicely. I would say that it could be a little lighter still, especially letters with diagonal dark strokes like AMNVWXY.</p>
      <p>The E has a couple of problems. Crossbar is too low, and middle serif is too big and bold, I think. Similar problems for F and H. U seems to have a bulgy weight at 7:00. OSF's 5 seems to have too wide a bottom.</p>
      <p>I'm not sure if I have a good general reference for making small caps, but Nick Shinn's <a href="http://www.shinntype.com/Richler/Richler_Specimen.pdf" rel="nofollow">Richler</a> sample is one good example from a highly technically competent designer.</p>
