      <p>Number3Pencils,</p>
      <p><cite>How do I do that? I must have missed something along the way.</cite></p>
      <p>DejaVu is one of the few Open Source fonts available right now. I'm extending its features with a few things, but the capitals and the lowercase are not my work. <em>DejaVu is a fork of Vera, a font Bitstream released for free to the Gnome Desktop community. The font is available here: http://dejavu.sourceforge.net</em></p>
      <p>I agree with what you say, I'd change more than that personally, but I'm not the only one in this; I'll propose some changes later but right now my focus is making small-caps and old-style figures fit with the rest of the font.</p>
