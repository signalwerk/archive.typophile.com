      <p>“And your right. See ≠ best selling. I’m not interested in sales. Just what they SEE the most. Sales has nothing to do with this question.”</p>
      <p>This is confusing; why is your thread title “How big is the font industry?” and why are you asking about annual revenues? If sales is of no interest, and visibility is the crucial point, then you are talking about exposure, perception, popularity, which, in western cultures, does not necessarily reflect anything about the “font industry”. </p>
      <p>I say this because your questions seem unfocused, and my answers would have to be lengthy and include many caveats and questions in return. For example, what do you mean by “as common as Times”? Since Times is about 90 years old, and has been made available in every type format since its release, and has been included in all major personal computing platforms as a default since the early 80’s, it’s impossible to consider designing a typeface as widely used, or as easily available, or as thoroughly exposed as Times. This completely ignores the issue of what Times has historically proven to be worth in financial terms, or what you might pay as the total cost of a new design. </p>
      <p>This is the tip of quite an iceberg.</p>
