      <p>1. the “average” results would probably be skewed by China and India. I would narrow the definition of average. Also what people “see” doesn’t mean they are the best selling. Graphic designers buy fonts, so those bundled with vinyl sign cutters, those used by books and newspapers, bundled with computers are probably not the best sellers.  </p>
      <p>5. Both Monotype Imaging and Bitstream are publically traded companies so you can probably get a good picture based on their annual reports.</p>
