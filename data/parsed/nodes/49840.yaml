    <p>I am in the process of gathering a little information which relates to my graduate studies. If you could take a few minutes to answer the following questions it would make a significant contribution to my research.</p>
    <p>1. Name the 10 most common typefaces the average living person has seen through out the course of their life. If you can’t name 10, just name as many as you can. Place them in order of frequency.</p>
    <p>2. Who sells number one on your list? If more than one person, company, foundry &amp;c sells it, say so. Three references should do.</p>
    <p>3. About how much does it cost?</p>
    <p>4. If you designed a font that was as common as Times New Roman and sold it as part of a business, what do you suppose would be your annual revenues from this font?</p>
    <p>5. For some industries it is not so hard to find out how large they are (sales; profits). Does anyone have any idea how large the typeface industry is on these dimensions?</p>
    <p>Thank you for your participation and I look forward to your responses.</p>
