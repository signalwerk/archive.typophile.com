      <p>Alex,</p>
      <p>The official policy of the Unicode Consortium is not to introduce any new precomposed characters when such can be represented by a combination of existing characters plus combining diacritics.  This approach has some theoretical advantages, especially for encoding text, but it has a number of practical disadvantages, especially for graphically representing text.  The overwhelmingly predominant approach of the font design community has been to ignore combining diacritics completely or else to put in a handful of them without adding the mark attachment information to make them usable.  (Plantagenet Novus, in preparation, appears to be a refreshing exception to this rule.)</p>
      <p>I work on a daily basis with the Aleut language, which can't be represented in Unicode without combining diacritics.  The Aleut community is using a rather disappointing font that replaces the characters [ { ] } with accented characters.  I mainly use <a class="freelinking external" href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=CharisSILFont" rel="nofollow">Charis SIL</a>, which has excellent support for combining diacritics.  I may switch to <a class="freelinking external" href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=Gentium_basic" rel="nofollow">Gentium Basic</a> as my default font when the final release comes out.  I'd love to see more fonts that supported complex phonetic transcription and the special characters of Latin-based Native American orthographies.  Although at present the market is almost entirely served by free fonts, I'd pay money for good-looking, feature-rich fonts that served my needs as a linguist, and I know several others who feel the same way.</p>
