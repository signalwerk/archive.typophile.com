      <p>Michel, John, thanks for the information.</p>
      <p>Nick, until I read Thomas's blog I wasn't aware that FontLab lacked this support.  That does put a damper on things.  But the poor support for these characters may also stem from a fear of diminishing returns for time invested to support these features.  I'm not in marketing, but I'm not surprised if the demand for these features may not be so great, and certainly don't fault font designers for leaving them out.  If linguists and the communities they worked with had chosen more standard characters for their orthographies, a lot of these issues would be resolved.  Of course, at the time many of the orthographies were under development, the biggest criterion for new characters wasn't whether they were used in Western or Central Europe but whether you could recreate them on a typewriter.  Ugh.</p>
      <p>Charles, thanks for the information on modifying fonts to support accented characters.  For Aleut, the process you describe is probably sufficient.  As far as Charis and Gentium Basic go, they already provide the characters I need for Aleut.  I haven't yet tested the limits of Gentium Basic, but Charis supports all the phonetic symbols I need as well as all the characters used by the various Alaskan Native languages.  It's not quite on par with Charter in terms of quality, but it's very nice and it's free.  I appreciate the info on the Adobe EULA and will bear that in mind as projects come up; one of these days I'm going to learn how to modify a font.  But most linguists, and probably most academic presses, indigenous communities, etc., don't have the time, the skills, or the desire to modify fonts, and for them, fonts that provide the necessary characters and features out of the box would be just the ticket.</p>
