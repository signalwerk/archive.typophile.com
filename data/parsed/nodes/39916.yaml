      <p>The pronunciation of the french word "main" (meaning "hand") is normally represented (using IPA) with an "m" followed by 'latin letter open e' with a tilde (which represents a nazalized open e). In the <a href="http://dejavu.sourceforge.net/wiki/index.php/Main_Page" rel="nofollow"><strong>DejaVu</strong></a> Sans Serif font, the zero width combining diacritic tilde is placed on the open e using marks and anchors. To make sure that no lig table is used in my back, I added a dot to the open e, as a tracer. Then I used xeTeX with the following input:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/main_3966.gif"></div><br>
      and here is the output:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/DejaVuMain_4331.gif"></div><br>
      The zero width tilde is properly placed using the anchors only with xeTeX.<p></p>
      <p>Michel</p>
