      <p>Alexey, perhaps I would have been further ahead in my (as yet unreleased) multi-language fonts if I had developed them in Font Forge from the beginning.  When I started on them over three years ago I was coming from a background of commercial type design, making Type 1, Latin 1 fonts, first with Fontographer, then with FontLab, on a Mac. So I chose those tools and formats because they are the norms in my line of work, and it's important to stay connected.</p>
      <p>Also, I didn't have quite such a clear goal as you did with Old Standard. I had a similar sentiment to you, no doubt--an appreciation for the 19th century Modern style, and its tone of scholarship. But I didn't originally intend to do Cyrillic and Greek, let alone polytonic Greek, it just kept growing! Not because I had a specific market of scholars in mind, but because it seemed an interesting thing to do, and commercial font development is moving in a multi-lingual direction.</p>
      <p>I realize my fonts will not have quite as much language support as yours--but they should be reasonably serviceable with their precomposed characters. And they have small caps! The combining accents are in the fonts, but not connected. I think the main thing I should do is release them fairly soon, and perhaps revise them later with "mark" features.</p>
