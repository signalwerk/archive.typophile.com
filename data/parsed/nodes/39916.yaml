      <p>aric,</p>
      <p><cite>I’d pay money for good-looking, feature-rich fonts that served my needs as a linguist, and I know several others who feel the same way.</cite></p>
      <p>Adobe, at any rate, allows the end used to modify the fonts they purchase, as long as they count the modification as one of the allowed fonts -- from the number of copies that can be installed on different computers, or number of computers served from a server.</p>
      <p>If, in Aluet, subbing [{}] (which amount to four characters) comes even close to meeting your needs, it isn't hard to make up the needed characters. They don't get a Unicode encoding, but a name such as uniXXXXXXXXXXXX, where the groups of 4 X's are the unicode index of the component characters. Then, add a ccmp feature that tells an OT savy application to sub for the string (name1) (name2) (name3) into uniXXXXXXXXXXXX.</p>
      <p>Once you figure out how to use FontLab -- esp. reading in a font that already has class-based kerning, it is pretty simple -- if I were at work, I'd steal &amp; post an example -- but my example would be no better than the examples that come with Fontlab.</p>
      <p>Since you are only modifying a font, all the other goodies you want are still there when you recompile the features.</p>
      <p>I've looked at the beta version of Gentium basic book, which will print well, I think. But it needs ligatures, kerning, and extended numbers (oldstyle &amp; proportional). Charis too is nice -- Charter is a font I use a fair bit for work in the social sciences -- but again, kerning, ligatures and numbers are absent. I think it would be easier to modify a font along the lines I've suggested that try to add what is needed to Charis or Gentium.</p>
