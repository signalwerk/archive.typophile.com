    <p>I've been trying to get a better handle on exactly how zero-width combining diacritics fit into a font. I've been combing through the Unicode chart PDFs and have found their unicode indices and have integrated those into my glyph generating script, but I can't find them actually being used anywhere in the Pro fonts from Adobe. I figured they'd be likely candidates to support such a feature, but I can't find any actual example of them in use.</p>
    <p>Can anyone point me in the direction of fonts that make use of these glyphs? Thanks.</p>
