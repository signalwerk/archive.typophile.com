      <p>What are you trying to do? A zero-width combining accent won't automatically position itself over a letter with any layout engines I know -- of course, I don't know that many; mainly InDesign CS2. TeX would center them left-right over a character (not always correct), but not vertically unless you wrote some extra code, &amp; then you could also control the left-right fit.</p>
      <p>For OT fonts &amp; InDesign, I make them up when re-working an Adobe font only so that if we get in a text where they have been used (i.e., specified by the Unicode number in the combining diacritics range), we have a good idea which letter they go over. In some texts you might have several such marks around a single letter -- a Latin lower case a with a macron, acute, and ogonek, for example. In this case, before you kern the diacriticals, the macron will overprint the acute, but we can usually determine what's what, and of course, you can always look at the text stream.</p>
      <p>If a particular accented letter happens more than about 5 times in the text, I go back in the font &amp; make it up in a precomposed form &amp; write a feature that calls the new character (unless it is already in Unicode). Otherwise, the comp has to kern all of the diacritics by hand.</p>
      <p>You can put a "mark" with the individual letters -- numerous threads in the build forum on this -- but I've never done it -- it is a lot of work, and I've never found one "mark" point that will work for all the diacriticals. The argument is made that it will make for a smaller font, and I guess that is true. The larger font doesn't seem to be a problem for us, and I, anyway, find it easier to get thing right when I precompose the letters.</p>
      <p>But that's our work situation -- a comp shop -- and you might have a different objective in mind.</p>
