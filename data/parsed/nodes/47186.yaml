      <p><strong>Take your love to a higher level with up to 25% off.</strong></p>
    <p></p><div class="imageWrap"><img src="/web/20081013185630im_/http://typophile.com/files/screenshot1_4593.gif"></div><p></p>
    <p>Expand your design options in print, web, and electronic<br>
    documents with Adobe® Font Folio® 11 software. Get<br>
    savings, compliance, and great fonts. In addition, check<br>
    out these great features:</p>
    <p>• Utilize award-winning Adobe Original typefaces<br>
    and one-of-a-kind designs created by expert type<br>
    designers at Adobe.<br>
    • Enjoy updates to the Adobe Type Library, including<br>
    revisions to many fonts.<br>
    • Print confidently knowing you will get reliable quality to<br>
    inkjet printers, laser printers, imagesetters, or<br>
    platesetters.<br>
    • Get all new and existing users a legitimate collection to<br>
    maintain font license compliance. <a href="https://web.archive.org/web/20081013185630/http://direct.adobe.com/r?xJnWqvPEnWTTJEcqPnWPv">Learn more.</a></p>
    <p>Order today and discover more than 170 new type<br>
    fonts—all in OpenType® format—<a href="https://web.archive.org/web/20081013185630/http://direct.adobe.com/r?xJnWqvPEnWTTlEcqPnWPW">and save 25%.</a></p>
    <p><strong>Your Promo Code: FF11PROMO</strong></p>
    <p><a href="https://web.archive.org/web/20081013185630/http://direct.adobe.com/r?xJnWqvPEnWTTTEcqPnWnc">Get the Font FAQs and see what is included.</a></p>
