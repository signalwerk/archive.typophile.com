  html: |-
    <p>I couldn't find an answer in the Bringhurst. Maybe someone knows the correct answer. It's German related. Let me know, if the rule is only applied to the German language.</p>
    <p>Should I get rid of the second dot at the end of a sentence if there is a dot before? </p>
    <p>Example:<br>
    Auf dem Kalender steht Freitag, der 23.. Eigentlich waren wir aber für…</p>
    <p>This looks really stupid to me. So is it allowed to get rid of the second dot?<br>
    What should i do?</p>
