      <p>You know this ’spiral 5’ idea is pretty popular — there are 15 fonts just in my 1998 ITC/Fontek catalog that have some form of spiral 5:<br>
      Bang, Clover, Dancin’, Deelirious, Gigi, Ironwork, Kulukundis, Lambada (mentioned by Patty), Marguerita, Mo Funky Fresh, Party, Riva, Scriptease, Victorian and Ziggy.</p>
      <p>There’s ’Countryhouse’ from the House General Collection. There’s ’Kismet’, and good old Monotype ’Curlz’.</p>
      <p>I’m sure this is not an exhaustive list, and none of those I’ve mentioned is an exact match to the posted sample. How do we know this is even a font? Maybe it’s hand-drawn.</p>
      <p>- Mike Yanega</p>
