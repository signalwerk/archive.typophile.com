    <p>I thought this would probably be the most logical place to post this.</p>
    <p>I'm looking for typefaces, preferably sans serifs, which have (in your opinion) nice/beautiful numbers. I need to typeset a project which will consist mainly of large (i.e. display sizes) pairs of numbers on the page, supported by minimal graphics. It's basically going to be a typographically based infographic.</p>
    <p>So, sans serif, oldstyle, lining or both, all welcome.<br>
    I was thinking about numbers like Akzidenz Grotesk has, those have a pleasant quirky feel to them, without getting too playful. I could use those, but I always like to see some alternatives before I decide.  Especially since the numbers are going to be playing the lead role. </p>
    <p>Thanks in advance.</p>
