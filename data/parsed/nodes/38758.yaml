    html: <p>For really nice quirky numerals, it's always a good idea to take a look at typefaces that were specifically designed with the numerals in mind, like <a href="http://www.fontshop.com/fonts/downloads/linotype/bell_gothic_virtual/?sample_text=0%201%202%203%204%205%206%207%208%209&amp;sample_size=36" rel="nofollow">Bell Gothic</a> and <a href="http://www.fontshop.com/fonts/downloads/linotype/bell_centennial_virtual/?sample_text=0%201%202%203%204%205%206%207%208%209&amp;sample_size=36" rel="nofollow">Bell Centennial</a> which were created for telephone books. Also <a href="http://www.fontshop.com/fonts/downloads/font_bureau/garage_gothic/?sample_text=0%201%202%203%204%205%206%207%208%209&amp;sample_size=36" rel="nofollow">Garage Gothic</a> is worth a look, as it <em>"was derived from numbered tickets given at city parking garages"</em>. Any typeface designed for use in really small sizes is bound to have nifty numerals as well, like <a href="http://www.fontshop.com/fonts/downloads/linotype/doric_std_ot_virtual/?sample_text=0%201%202%203%204%205%206%207%208%209&amp;sample_size=24" rel="nofollow">Doric</a> for example.</p>
