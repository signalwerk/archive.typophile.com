      <p>I agree with Carl that one shouldn't be too literal. On the other hand, I'm sure he agrees with me that typefaces do have associations, and it <cite>is</cite> a French movie (and the character isn't French by "accident") so it's a bonus if the font has something French about it. All this means that the French angle should be just another factor, and not anything central. But since there are so many fonts out there, it is a nice way to narrow things down.</p>
      <p>Considering the movie seems to be a dark but human tale, I think Peignot is too playful (although the youth angle might make it click) and Didot/Bodoni is too cold. Just mentioning two things from the top of my head: Beorcana (one of its superb dark weights) or ITC Mendoza.</p>
      <p>hhp</p>
