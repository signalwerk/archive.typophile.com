      <p>1)<br>
      Mouchette is a young teenager living in the tough country. Her mother is going to die, and her father does not take care of her. Mouchette does not manage to express her rebellion against the humiliations she undergoes. One night, in the wood, she meets Arsene. Arsene is the poacher of the village. He thinks he has just killed Mathieu, the rural policeman. He tries to use Mouchette to build an alibi.</p>
