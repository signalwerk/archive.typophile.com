    votes: null
    html: <p>Mouchette was released in 1967 at the peak of the French New Wave. For that period, your best text face is Vendome, used for heads in all the hot paperbacks the French read at the time. If you want an earlier French look, FF Acanthus or Andrade from MyFonts are very authentic. If you want late 19th century, ITC Bodoni Twelve serves very well. Peignot, however, is too specific, Parisian, and touristy, so avoid that choice. And Antique Olive is appropriate to nothing here--ugh! The original poster shows a crude block display face, which can be found at any of the free font sites, but you still need a proper text face, and for that, think of what would go with the world of cinema-going at that time--Vendome.</p>
    html_clean: <p>Mouchette was released in 1967 at the peak of the French New Wave. For that period, your best text face is Vendome, used for heads in all the hot paperbacks the French read at the time. If you want an earlier French look, FF Acanthus or Andrade from MyFonts are very authentic. If you want late 19th century, ITC Bodoni Twelve serves very well. Peignot, however, is too specific, Parisian, and touristy, so avoid that choice. And Antique Olive is appropriate to nothing here--ugh! The original poster shows a crude block display face, which can be found at any of the free font sites, but you still need a proper text face, and for that, think of what would go with the world of cinema-going at that time--Vendome.</p>
