    <p>Hello,</p>
    <p>(I tried to find anything on the issue, but no luck, sorry in advance if it has come up before)</p>
    <p>When exporting a PDF from InDesign (Mac OSX), how can I make sure all fonts are embedded? It only gives this uninformative notice about permission bits...</p>
    <p>Can I check later in Adobe Reader if fonts are embedded, and if so, how?</p>
    <p>Thank you for helping.</p>
