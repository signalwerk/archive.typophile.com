      <p>I believe InDesign CS2 always embeds fonts (even the <a href="http://desktoppub.about.com/library/glossary/bldef-base14fonts.htm" rel="nofollow">Base 14</a>) and it always subsets fonts (despite putting the value to 0%).<br>
      Why would anyone want/need to embed 100% of every single font used in the document?</p>
      <p>AFAIK, there's no "Use Local Fonts" option in Adobe Reader (former Acrobat Reader). Nonetheless, it's possible to check if a given font is embedded or not, by analysing the Fonts panel in Document Properties.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ms_pdfembed_4764.png"></div><br>
      In this case the fonts are all embedded and subset.<p></p>
