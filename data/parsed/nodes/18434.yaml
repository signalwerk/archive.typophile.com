      <p>&gt;&gt;Why would anyone want/need to embed 100% of every single font used in the document?&gt;&gt;</p>
      <p>Because some book printers require it. We just got a note from a printer that a lot of our customers use, indicating that they have a new proofing system. One of the changes they require is that all fonts be (fully) embedded.</p>
      <p>BTW, we created an InDesign CS2 document on the PC, specified 0% in the subsetting block, and generaed a PDF.The text was simply "Hello world" (using Warnock Pro Regular). On opening the PDF, we were able to edit it, to add  the characters "iu", which I believe would not be possible if the font had been subsetted. And in looking at the PDF file, Preferences &gt; fonts showed "embedded."</p>
      <p>So I too am confused about David Brey's post.</p>
