    html: |-
      <p>1. In the box "subset fonts when percent of characters used is less then" put in: 100%<br>
      The informative notice you're talking about is a hint for the user to check if the font policy allows embedding, so if that's ok, just click "ok", that is: go on with exporting. If there is no appropriate permission, the pdf exporting will stop anyway. So generally it's recommendable to check permission issues <strong>before</strong> using a font in a publication.</p>
      <p>2. In Adobe Acrobat uncheck "use local fonts" (Cmd + Shift + Y), you'll find this option under "Advanced". Possibly there is a similar option in Acrobat Reader.</p>
