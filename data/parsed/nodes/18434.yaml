  - id: 111833
    user: 7181
    date: 2006-03-10T06:22:00
    date_raw: 10 Mar 2006 — 6:22am
    votes: null
    html: |-
      <p>It means fonts on your computer. i.e. if the box is unticked, it will only render the document using the fonts which are embedded. Other text will appear in a substitute font.</p>
      <p>In Acrobat (or Reader) File &gt;Properties &gt; Fonts will give you full information whether fonts are embedded, subset embedded or if a subsitute is being used for display (in which case it'sll tell you which)</p>
    html_clean: |-
