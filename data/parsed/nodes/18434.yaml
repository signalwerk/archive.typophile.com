      <p>Hi</p>
      <p>This is *apparently* clear. I say "apparently" because in fact this does not always work. I use InDesign CS2 on PC and find that I cannot fully embed all fonts. When I create a PDF from the InDesign file, even if I select Embed All Fonts and Subset ... 0%, what I actually get is a file with embedded *subsets* only. This causes untold problems with my service bureau who say that they need to remove all the multiple instances of the subsets before the file will print correctly on their Docutech digital printer. </p>
      <p>Does anyone know what causes this problem and what is the solution? Help needed urgently, please!  </p>
      <p>David Bray</p>
