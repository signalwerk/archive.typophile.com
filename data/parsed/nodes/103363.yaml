    html: |-
      <p><em>Is it ever appropriate to match the numbers within the 2nd image with neo-grotesque letters?</em></p>
      <p>I wouldn’t do it.<br>
      The neo-grotesque genre is a very narrow, very understated revival of a 19th century genre. Understatement is the whole point, but the non-traditional forms of 1 and 3 refute that, by increasing angularity and complexity. A revival that departs signiﬁcantly from the model is a lost soul, unless it moves sufﬁciently far to become something else.</p>
      <p>If your neo-grotesque were to include a binocular /g, an /l with a tail, and a straight-legged /R, then by all means.</p>
