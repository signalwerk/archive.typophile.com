    html: |-
      <p>Numbers and Letters have different historical background.<br>
      The Latin alphabet (a, b, c, z) originally used the roman numerals (I, II, III, V, etc...).<br>
      The numbers that we use today (0, 1, 2, 3...9) comes from the Hindu-Arabic cultures, so you have a little more freedom when choosing the style of constructions (skeleton) you want to use, as long as they match the general spirit/style/voice of your font.</p>
