      <p></p><div class="imageWrap"><img src="http://typophile.com/files/numbers_test_4949.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/numbers_test2_6651.png"></div><p></p>
      <p>Here's some more to go by..</p>
      <p>A little back story -</p>
      <p>This project links back to a previous post of mine, on revivals. What you're looking at is a project that started a few months ago as a loose revival of Haas Unica, but has since morphed into another neo-grot. I'm trying to reconcile the purity of a neo-grotesque against the present context, in a non-gimicky way, something that Atlas Grotesk in particular does beautifully.</p>
      <p>So I am, for all intents and purposes, the designer. And my view on this particular issue was that I've always admired the angular aesthetic of the more geometric numbers, so would love to find a way to incorporate them into the font, without sacrificing the neo-grotesque spirit. </p>
      <p>But I'm beginning to think that using the geometric is too anachronistic. But at the same time, it's hard to judge, since I am looking specifically at them, and know them so well, so I'll always see the difference! I'm finding objectively judging your work in type-design is impossible (its impossible in everything too!) :D</p>
      <p>What do you think?</p>
      <p>At this point I'm still ironing out glyphs &amp; metrics in a book weight (its not kerned or hinted). I'm still a small fry in the big pond, so I'm slowly feeling my way through the project..</p>
