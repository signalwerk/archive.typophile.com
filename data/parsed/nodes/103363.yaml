    <p>Hi Typophiles,</p>
    <p>I'm still a student, so my education in type-design still has some large holes, forgive me if the question is very obvious. Was wondering if anyone tell me why these numbers are different? Am I right in thinking that the glyphs in the 1st are typical neo-grotesque while the 2nd glyphs are based around more geometric forms?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Numbers2_6734.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Numbers_5363.jpg"></div><p></p>
    <p>Is it ever appropriate to match the numbers within the 2nd image with neo-grotesque letters? See sample below.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/handgloves_6173.jpg"></div><p></p>
    <p>Any advice is appreciated,</p>
    <p>Seb</p>
