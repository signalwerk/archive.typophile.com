    <p>Starving Student (no-meals, no big dinner event) rate</p>
    <p>Only available to full-time students</p>
    <p>To especially appeal to local students with limited budgets, we made this cheaper by NOT including: lunches, opening reception, and the big dinner out at Guinness. It still includes (non-lunch) snacks and refreshments, and the opening keynote. Not to mention the regular talks and conference.</p>
    <p>If you're a full-time student and have already registered, you may downgrade to the "Starving Student" package by contacting <a href="mailto:secretariat@atypi.org">secretariat@atypi.org</a>.</p>
    <p>- 5 days full conference: $270 or<br>
    - 3 days main conference: $170 or<br>
    - 2 days PreFace: $150</p>
    <p>Check it out at:<br>
    <a href="http://www.atypi.org/03_Dublin/70_register" title="http://www.atypi.org/03_Dublin/70_register">http://www.atypi.org/03_Dublin/70_register</a></p>
    <p>These rates are less than half the "late registration" rate currently in effect for students/associates. See the registration page for details.</p>
