    <p>DULUTH, MN - Michael Browers, a Duluth based designer, announced today that he has entered into an agreement with MyFonts.com, a font distributor based in Cambridge, MA, for the distribution of his typefaces online. Michael’s first two font releases are Formasi and Isoglyphics.</p>
    <p>Formasi, Azeri for "Form of," resulted from the concept of a civil war between serif and sanserif. Formasi is intended to be the result of the aftermath of such a war.</p>
    <p>Isoglyphics was initially concepted as a rip on Otto Neurath and the resulting movement towards icons as visual language. However, the final design evolved into visual commentary and satire of contemporary culture through the resulting 94 icons.</p>
    <p>The fonts may be purchased online at <a href="http://www.myfonts.com/foundry/michaelbrowers/" title="http://www.myfonts.com/foundry/michaelbrowers/">http://www.myfonts.com/foundry/michaelbrowers/</a>.</p>
    <p>Michael Browers is the Graphic Designer/Project Manager for Ikonics Corporation. Additionally, he offers freelance logo and type design. More information about his work can be found at<br>
    <a href="http://www.michaelbrowers.com" title="http://www.michaelbrowers.com">http://www.michaelbrowers.com</a></p>
