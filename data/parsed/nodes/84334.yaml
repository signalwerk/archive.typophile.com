    html: |-
      <p>Try to write with some monoline instrument (felt-tip pen, for example) to understand the logic better. And i think you could make ligatures for the most difficult pair connections. Also you could have 2 or 3 forms of some letters to receive more accurate connections depending on what kind of letter in next (like in handwritten scripts).<br>
      For example your can use your present form of «e» as a beginning form and also make<br>
      a middle form with more elongated eye for a better connection with previous letter.<br>
      Good luck!</p>
