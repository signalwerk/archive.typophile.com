    html: |-
      <p>I second the recommendation to try writing the letters first. I also suggest writing an non-connecting version of the basic letter structures and experiment with spacing these before introducing the joins. One of the most obvious problems with your design is the tight spacing and the imbalance of internal white spaces.</p>
      <p>I suggest you look at the French upright script style that was developed in the 18th Century. This style was cut in type by Nicholas Gando, and <a href="http://new.myfonts.com/person/Nicholas_Gando/" rel="nofollow">revived</a> in modern times by Matthew Carter. It is the best realisation of an upright joining script.</p>
    html_clean: |-
      <p>I second the recommendation to try writing the letters first. I also suggest writing an non-connecting version of the basic letter structures and experiment with spacing these before introducing the joins. One of the most obvious problems with your design is the tight spacing and the imbalance of internal white spaces.</p>
