  html: |-
    <p>Hey All, first time poster, long time lingerer.<br>
    I'm working on an bold upright monoline script. But, I'll be honest, it's driving me nuts. I am an amateur typographer, so I'm guessing it's either just inability or maybe it was just naive of me to think that building an upright script face wouldn't be that dissimilar from designing some kind of "fancy monospace", but (as you can see) I am failing.</p>
    <p>I'm almost there with my letterforms, but what I'm struggling with is the rhythm and logistics of actually building a seamless connecting script. I've dismantled other similar scripts to see if I can ascertain how they work, but it's not helped.</p>
    <p>Right now all "connecting strokes" along the baseline are exactly the same. I had them of varying widths previously, but it definitely screwed up the kind of rhythm of the baseline. The face just didn't flow. But as you can see now, building of a sort of "monospaced" connector between letters is making for uneven and tight spacing between letterforms. The "r-g" relationship is confounding, and the "e" is just weird.</p>
    <p>Any basic script face design advice?<br>
    HELP! </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Monoline_5899.jpg"></div><p></p>
