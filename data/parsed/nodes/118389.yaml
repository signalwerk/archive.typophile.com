    html: |-
      <p>Confirming Kevin's guess of Futura with a custom /j. Baseline is also definitely set in Futura and to be precise should be either Futura from <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/futura" rel="nofollow">Linotype</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/futura" rel="nofollow">Adobe</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/futura" rel="nofollow">URW++</a> (no <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/futura" rel="nofollow">Bitstream</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/tilde/futura" rel="nofollow">Tilde</a>). Type has also been slightly vertically compressed.<br>
      The rest of their identity uses <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/brandon-grotesque" rel="nofollow">Brandon Grotesque</a> (same kinf of /j as logotype but rounded, borrowed from it?), Times and Open Sans.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_5084.png"></div><p></p>
