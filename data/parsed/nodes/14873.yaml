    html: <p>I was in a similar circumstance during my final year of art school. I did a comprehensive review of the origins of the sans-serif, as well as some fairly detailed analysis of the relationship of modernism to type design. I worked for several weeks on a paper of nearly 50 pages in length. I had discussed the paper thouroughly beforehand with my instructor so I felt fairly sure about what grade to expect. However, when the paper came back, I had received a grade of D+. Why? At the time, I didn't actually have Futura on my system and had set the paper in Avenir. When I asked the instructor about it, he went off on an insane tirade about how the most sucessful type designers were the best rip-off artists. I pointed out that Robert Slimbach had done a pretty swell job of ripping off Frutiger, but that just seemed to make him angrier.  I never graduated from that school, but years later I did receive an associates degree from a local junior college. Let this be a warning to you.</p>
