    html: |-
      <p>As far as I know the history of sans and geometrics is not very well documented. (Anyway, not as much as compared to serif, where every fart Claude Garamond passed has been discussed by learned scholars, haha.)</p>
      <p>Back on topic: Renners Futura was a spec, commisioned by the Bauersche' Schriftgießerij(please bear with any typo's and smallish mistakes — I'm not in the 'hood of my library) as they perceived a growing demand for constructivist typefaces (yes, marketeers ruled even then!). Paul Renner bypassed the use of compasses and rulers, but was pretty good at manually doing circles etcetera. He drew a remarkable set of characters.</p>
      <p>Too remarkable to be marketable, so his client asked for some alternate designs that were more in line of current taste. And belo: Futura was born. It proved to be so succesfull, that all the other Schriftgießereien of the time (that's German for Typepublishing in lead) wanted teir own versions. Ergo typefaces like Metro, Nobel and so on.</p>
      <p>Fast forward to the late 90's and you'll notice digital versions that incorporate the original glyphs Renner designed but were considered to fiendish, eg a wonderful g.<br>
      That's The Foundry's Archetype Renner, to you and me.</p>
      <p>(I have a late fifies speciman of Futura somewhere, stille printed in letterpress. Fonts go through the same fashion trends as clothing. Futura was thé font before Adolf took over. Doyle Dane Bernbach US Volkswagen campaign in the sixties made Futura once again fashionable. My prediction: it's gonna be the 'it' font for 2006.)</p>
      <p>And Carl: I used to (re)sell my papers to fellow students (not in my class, of course!) and they ALWAYS got higher grades than I did. Go figure.</p>
    html_clean: |-
