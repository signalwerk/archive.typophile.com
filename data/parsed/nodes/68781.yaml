    html: <p>Steuerstrich is the German word for <a href="http://en.wikipedia.org/wiki/Lubber_line" rel="nofollow">lubber line</a>. It is an essential marking on a compass. As it usually is just a simple line, I have no idea why one would need to have a glyph for it.</p>
