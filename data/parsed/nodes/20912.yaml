  html: |-
    <p>City along the Rhine in <a href="/node/19574" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Germany</a>, at the confluence of the river&nbsp;Main.</p>
    <p><a href="/node/13707" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Johann Gutenberg</a> was born here (or nearby), and was a citizen of the city. Sometime after his return from Strasbourg in the 1440s, he began producing and distributing printed books. He is credited with inventing western printing with movable type in Mainz, but whether the technology was actually created their, in Strasbourg, or elsewhere is not known. Gutenberg also had a workshop in Frankfurt, and later in Eltville, where he died in the later&nbsp;1460s.</p>
    <p>There is a magnificent museum in Mainz, which chronicles the history of printing. It is fittingly named the <a href="/node/13013" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gutenberg Museum</a>.</p>
    <p>There is a publishing house there called the <a href="/node/20911" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Verlag Hermann Schmidt</a>, which makes nice typography&nbsp;books.</p>
