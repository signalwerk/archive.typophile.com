    html: "<p> Yeah, that's a great page - I'd forgotten about that. <br> <br>The only thing that bugs me about it is its heavy reliance on control strings. They're certainly a great basic tool (I use them a lot, just like everybody else), but they do contain a danger: real language is not \"ooonoonononnonnn\", and sometimes control strings mislead. The best example I can think of is the letter \"oh\": if you look at a well-spaced font you'll notice that its sidebearings are much tighter than a control-string method would generate, and the designer has compensated for the method's shortfall \"manually\", probably by just going in and tightening all the round characters after having done the control-string method. (The reason rounds need to be tighter is simply because round-round adjacency is rare in actual language). Another example is the most common English word, \"the\": when you rely exclusively on control strings it doesn't come out very nice. <br> <br>hhp </p>"
    html_clean: "<p> Yeah, that's a great page - I'd forgotten about that. <br> <br>The only thing that bugs me about it is its heavy reliance on control strings. They're certainly a great basic tool (I use them a lot, just like everybody else), but they do contain a danger: real language is not \"ooonoonononnonnn\", and sometimes control strings mislead. The best example I can think of is the letter \"oh\": if you look at a well-spaced font you'll notice that its sidebearings are much tighter than a control-string method would generate, and the designer has compensated for the method's shortfall \"manually\", probably by just going in and tightening all the round characters after having done the control-string method. (The reason rounds need to be tighter is simply because round-round adjacency is rare in actual language). Another example is the most common English word, \"the\": when you rely exclusively on control strings it doesn't come out very nice. <br> <br>hhp </p>"
