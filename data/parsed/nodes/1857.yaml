    html: "<p> Richard is right that good spacing reduces kerning. But it's also very true that many designers (especially \"anglos\") don't pay kerning its due respect. <br> <br>ville/Helle, <br>It's possible to write a book on your question! And such a book might contain as many questions as answers... But: <br> <br>If you're starting from scratch, make two lists, one that contains right-hand \"exceptions\" and one that contains left-hand. An exception is a character (or actually a glyph) whose profile (left or right) is irregular beyond a certain threshold. For example, the right side of the lc \"t\" is almost always an exception; while the left side of the lc \"a\" is *sometimes* an exception (think of designs like those of Gudrun Zapf von Hesse). The threshold depends a lot on the level of quality you want, in terms of the number of pairs you'll end up with. After you have the two lists, match up each right-exception member with all the left-exception members, and for each pair decide how much (if any) adjustment is needed. <br> <br>To me this is the ideal method if you make few fonts. But if you make a living in type design, it's more cost-effective to make a list of pairs (or get one from an expert - just make sure he/she is *really* good) and just check those. But  if you do that you always have to stay on your toes - lest you miss something parrticular to the design at hand. <br> <br>Also note that pairs aren't enough by themselves. Since we generally read word shapes (not individual letters) it's important to test words, of course. But that's a different book. <br> <br>hhp </p>"
    html_clean: "<p> Richard is right that good spacing reduces kerning. But it's also very true that many designers (especially \"anglos\") don't pay kerning its due respect. <br> <br>ville/Helle, <br>It's possible to write a book on your question! And such a book might contain as many questions as answers... But: <br> <br>If you're starting from scratch, make two lists, one that contains right-hand \"exceptions\" and one that contains left-hand. An exception is a character (or actually a glyph) whose profile (left or right) is irregular beyond a certain threshold. For example, the right side of the lc \"t\" is almost always an exception; while the left side of the lc \"a\" is *sometimes* an exception (think of designs like those of Gudrun Zapf von Hesse). The threshold depends a lot on the level of quality you want, in terms of the number of pairs you'll end up with. After you have the two lists, match up each right-exception member with all the left-exception members, and for each pair decide how much (if any) adjustment is needed. <br> <br>To me this is the ideal method if you make few fonts. But if you make a living in type design, it's more cost-effective to make a list of pairs (or get one from an expert - just make sure he/she is *really* good) and just check those. But  if you do that you always have to stay on your toes - lest you miss something parrticular to the design at hand. <br> <br>Also note that pairs aren't enough by themselves. Since we generally read word shapes (not individual letters) it's important to test words, of course. But that's a different book. <br> <br>hhp </p>"
