    html: <p> Hold everything. What I'm talking about is not "professional" at all - maybe it could be called "academic". In fact it's a waste of time if you're trying to make as much money as possible. But I'd like to think that there are better reasons to design type, or at least to attain a level of quality irrespective of finances. <br> <br>From what I can tell most people use variations/extensions of Tracy's system, which is indeed based on control strings. But even as Tracy states, the eye is the "final arbiter", which means it's not "illegal" to make the "o" tighter for example. But the eye cannot know linguistics - the *mind* has to help advance the quality of the spacing beyond merely control strings + guesswork. <br> <br>The way I do my own spacing is actually a diluted version of my "ideal" method, but I think it's still more demanding than what the average designer does. <br> <br>I do the base spacing with control strings pretty much in the Tracy way, but then I tighten the round sidebearings, and apply certain other adjustements (like loosen the lc "el" - to give it more presence in a word - set the word "million" to see), then I test with the most frequent digraphs and trigraphs, then I test with the most frequent English words (I should do more than English, but...), then I test with a list of rare but "problematic" words. Linguistics also applies in kerning, simply because some pairs are more important than others. That's the gist of it - and I'm really not too happy with it - because I have dreams of what spacing *could* be... <br> <br>hhp </p>
