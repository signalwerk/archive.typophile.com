    html: "<p>OK, I'm late but you might find this useful: <br> <br>Anyone who thinks spacing and kerning is an unnecessarily tedious process is right. Computers are designed to automate repetitive tasks. To that end, please read pages 424-436 of <a href=\"http://www.font.to/downloads/FL45WinManual.pdf\" target=\"_top\">the FontLab 4.5 manual</a> and spend a minute calculating the time you will save. <br> <br>Yes, FontStudio had something like this, but FL's version is truly astounding. Combine that with anchors and glyph permutation and you have an amazing time-saving tool. <br> <br>I wrote a class kerning script for Robofog once. I sold one copy, then this feature came out in FL. Oh well.</p>"
