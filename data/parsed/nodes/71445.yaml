    html: |-
      <p>This kind of question is one of the uses for the <a href="http://www.bowfinprintworks.com/SerifGuide/serifsearch.php">Serif Font ID Guide</a>. If you pick the key letters from Whitman that you want to resemble the font you may already have, and then search on those letter attributes you will see a list of fonts with similar structural characteristics. They certainly won't all look even similar, but a few might.</p>
      <p>If you don't select letter characteristics that you don't 'need' you broaden the possibilities you can see. For example, if I ignored the 'b', 'E', 'K' and 'W' I got 13 different choices from about 6 different serif families (in addition to Whitman).</p>
      <p>- Mike Yanega</p>
