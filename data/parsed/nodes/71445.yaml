      <p>@meanjean</p>
      <p>There is nothing quite like Whitman. Believe me I know—I have looked around for a "replacement" typeface for a while now (Whitman's lack of CE support was driving me insane…), and I have failed.</p>
      <p>Both Joanna and Scala are great, yet they each possess various idiosyncrasies and exuberances that are not present in the calm and meandering Whitman. Whitman is one of those rare typefaces that can maintain neutrality without being boring. I can only hope that one day it goes "Pro".</p>
      <p>If you do not require the extended language support, I second William's advise not to look for replacements and to get the real deal.</p>
