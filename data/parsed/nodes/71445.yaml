    html: <p>According to Kent's <a href="http://kentlew.com/Type/WhitmanSpecimen.pdf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Specimen PDF on Whitman</a> It was Gill's Joanna, not Perpetua, that was the inspiration, along with Caledonia. It is a marriage of the two, but a very creative one that doesn't look like any other type—that's one reason it's so good. Buy it and enjoy :)</p>
