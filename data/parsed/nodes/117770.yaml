      <p>Nothing really even close to matching. Some handwrtten - style pseudo-frakturs that might work with some alteration:</p>
      <p>Robert Schenk's <a href="http://old.myfonts.com/fonts/ingrimayne/gothamburg/" target="_blank" rel="nofollow">Gothamburg</a> and <a href="http://old.myfonts.com/fonts/ingrimayne/benecryptine/" target="_blank" rel="nofollow">Bene Cryptine</a>,  Jerry Landers' <a href="http://www.fontspace.com/mouser-fonts/gourdie-gothic-black" target="_blank" rel="nofollow">Gourdie Gothic</a> and Graham Meade and apostrophe's <a href="http://moorstation.org/typoasis/designers/lab/k_m.htm" target="_blank" rel="nofollow">LaBrit</a>.</p>
