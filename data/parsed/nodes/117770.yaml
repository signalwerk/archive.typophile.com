      <p>Dick, looks like the same font. My sample was from a typescript and looks heravier because of ink spread from the ribbon. Yours shows more detail, as if it was direct from an IBM catalog. Both demonstrate the difficulty of squeezing Old English capitals into a monospace format.<br>
      Don</p>
