      <p>Vern,</p>
      <p>I know, of course, what you're talking about when you describe the 1px "stretch".<br>
      That doesn't bother me all that much as long as it's consistent.</p>
      <p>What's plagued me - and stopped me from using ttfautohint for release fonts except very, very occasionally - is the "shotgun" effect. At some sizes, there's pixels drop out that makes the letter look like a victim at the Saint Valentines Day Massacre.  (google it, bro'.)<br>
      I've been neglectful and not taken screen shots. Do you know to what I'm referring? Have you seen it?</p>
      <p>It tends not to happen with heavier weights. </p>
      <p>Alas, we're at version .8 and still there are killer problems. I'm discouraged.</p>
      <p>rich</p>
