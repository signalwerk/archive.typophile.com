      <p>@Frank: Thanks for the kind words!<br>
      @Richard: Version 0.8 doesn't mean that there will be 0.9 and then 1.0.  It will rather be 0.91, 0.92, etc. :-)  I agree that it would have been better to start with version 0.01...</p>
      <p>Additionally, I would be glad if you can send me a snapshot of the font which behaves as you've described (together with a short description of your rendering environment).  It might be a systematic effect, but it also might be simply a bug.</p>
      <p>For private reasons, I wasn't able to intensively work on ttfautohint recently.  A new version will appear in the next few days, this time with only small improvements (mainly on the documentation side, and with reduced bytecode size).</p>
