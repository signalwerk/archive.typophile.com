      <p>Reynir: ‘<em>It isn't time to start doing the wowhawk until version 0.99!</em>’</p>
      <p>I agree. In my opinion <em>ttfautohint</em> is an amazingly convenient tool for (batching) autohinting. My experience with developing software is that the closer one comes to the ofﬁcial release, the more difﬁcult the problems that have to be solved become. And after seeing what has been improved in <em>ttfautohint</em> from the early versions on, I am pretty convinced that the resulting 1.0 edition will be impressive.</p>
      <p>Concerning problems with initial software versions, I quite well recall the ATypI conference in Rome in 2002. We just ﬁnished one of the ﬁrst ofﬁcial releases of <em>DTL&nbsp;FontMaster</em> and the focus during the development was on the Windows version. For Rome a Mac OS 9 version was compiled and I took it with me on my laptop, barely tested.<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Demonstrating it under Classic became actually a disaster, because the modules crashed constantly. If I remember correctly, there were some problems with a couple of MS&nbsp;libraries, and later I found out that a required temporary directory was missing at root level. Especially I remember that Yuri was <strong>quite</strong> relaxed after I gave him a personal, highly buggy FM-demonstration.</p>
      <p>FEB</p>
