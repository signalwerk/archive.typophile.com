    <p><a href="http://code.newtypography.co.uk/" title="http://code.newtypography.co.uk/">http://code.newtypography.co.uk/</a><br>
    <a href="https://picasaweb.google.com/107807505287232434305/Ttfautohint08?authuser=0&amp;feat=directlink" title="https://picasaweb.google.com/107807505287232434305/Ttfautohint08?authuser=0&amp;feat=directlink">https://picasaweb.google.com/107807505287232434305/Ttfautohint08?authuse...</a></p>
    <p>I have made some comparative tests with OpenSans and ttfautohint 0.8. with WinGDI Cleartype and Greyscale.<br>
    Tested original font (OpenSans regular, Light, Extra Bold), plus - unhinted, ttfautohint with 'taller xheight', and regular ttfautohint versions.</p>
    <p>The most significant issue remaining is the rendering at small text sizes with bolder weights, e.g. ttfautohinted versions can't yet emulate the finesse of a human manually hinting chars such as 'a', 'e', 'g' etc with such few pixels to play with. However, to my mind in the medium size text ranges i can see characters rendered a bit 'better' by ttfautohint ;)<br>
    Another gripe i still have is that ttfautohint tends to stretch the xheight by 1 pixel at particular small size instances. In my screenshots this happens noticeably at 12px, where the manually hinted x-height retains better proportion.</p>
    <p>Suggestions for alternative fonts to test please. Manually hinted to 'industry standard' of course.</p>
    <p>-vern</p>
