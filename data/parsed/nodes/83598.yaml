      <p>@Characters</p>
      <p>Getting a design patent is like getting any other kind of patent. The same steps, costs, etc...<br>
      In the case of typefaces, there is so much prior art that your typeface is bound to be similar to in some ways that I can't imagine attempting it without professional (and expensive) legal help.<br>
      Mind if I ask what the purpose is? In other words, what do you hope to gain?</p>
      <p>rich</p>
