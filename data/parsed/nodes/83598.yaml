    <p>Hi guys,</p>
    <p>Does anyone have information about the (im)possibility of patenting typefaces? I always thought it's not possible to patent a design based on the alphabet, but it is possible and George Bruce did it in 1842: <a href="http://en.wikipedia.org/wiki/Design_patent" title="http://en.wikipedia.org/wiki/Design_patent">http://en.wikipedia.org/wiki/Design_patent</a>   (look under 'Notabale design patents').<br>
    I want to be up to date before I give out a statement, and it seems that my thoughts on this topic were not accurate.</p>
    <p>Any thoughts on this?</p>
