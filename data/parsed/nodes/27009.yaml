  html: <p>It was hard work, but I've finally managed to track down  <br>the elusive sans serif which had everyone puzzled since  <br>Jonathan lawley posted <a href="http://www.typophile.com/forums/messages/83/27701.html" target="_blank"> this identification request</a> more  <br>than two months ago. It is a face in development by  <br>Florian Ribisch, a Viennese designer, currently working  <br>as an art director for the Italian magazine GLAMOUR. <br> <br>========== <br>Hi, my name is Florian Ribisch. <br> <br>The typeface of the album <a href="http://www.mic.gr/cds.asp?id=25016" target="_blank"> "The Eclectic Sound Of Vienna - </a> <br><a href="http://www.mic.gr/cds.asp?id=25016" target="_blank"> Vol. 5"</a> is called LABOR and was done by me. <a href="http://www.oliverkartak.com/" target="_blank"> Oliver Kartak</a>,  <br>the designer of the sleeve, did use it exclusively, since the  <br>font is not 100% ready yet. <br> <br>Hopefully it will be soon - I'm working on it. <br> <br>Sincerely, Florian Ribisch</p>
