    html: |-
      <p>I've designed many types, some quite unconventional, but have never considered roman "f" with descender as an option.</p>
      <p>However, I've given descenders to some italic sans "f"s, in genres where it's not the norm, to signify an "old style" sensibility.<br>
      e.g. Alphaville, Figgins Sans and Sensibility.</p>
      <p>That's not to say I consider the "f" in Fedra a mistake, it's just not my thing.</p>
