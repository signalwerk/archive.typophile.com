    <p>Hi there,</p>
    <p>first of all I'd like to introduce myself briefly: My name is Julia and I'm a German student. I follow typophile.com for quite a long time and I'd like to start a topic on myself.</p>
    <p>What do you think about sans serif typefaces with a short f descender (not italic), for example in fedra. Do you know other typefaces in which it works? I noticed fedra in a long text and getting used to the descender version. I thought about using it for my own typeface I'm working on at the moment. Perhaps it would also work with a little "tail".<br>
    So what do the experts think? I'm looking forward to get your point of view. :)</p>
    <p>Greets<br>
    Julia</p>
