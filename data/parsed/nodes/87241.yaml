    html: |-
      <p>It's really quite simple: it has nothing to do with "incorrect",<br>
      it's that we read "expected" boumas and a descending "f" destroys<br>
      those pre-built expectations. How quickly can we build a given<br>
      bouma expectation that over-rides (or at least coexists with) all<br>
      our previously built expectations? Good question. Until somebody<br>
      can convincingly answer that question with "in minutes", I will<br>
      stick with the view that a descending "f" harms readability.</p>
      <p>Now, it's entirely OK to sacrifice some readability (it's never<br>
      perfect anyway) intentionally* but it's not OK to pretend no<br>
      price is being paid. THAT is nonsense, as is thinking that one<br>
      can evaluate readability by reading a little bit.</p>
      <p>* I've done that myself in Patria by making<br>
      certain letters atypically wide, in order to<br>
      reinforce the character of the face.</p>
      <p>hhp</p>
