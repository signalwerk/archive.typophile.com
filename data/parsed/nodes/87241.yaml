    votes: null
    html: |-
      <p><cite>a descending "f" destroys those pre-built expectations</cite></p>
      <p><strong>Hrant</strong>, why do you think it destroys expectations? Italics have their own style, changing many upright forms. I believe reader expectations are mainly determined by the kind of design he/she was used to –and italic f with descender is an usual form since long time.</p>
      <p>I agree that a no-descending italic f may be more coherent, but I do not see readability sacrifice in it. Anyway, this is an interesting question.</p>
      <p>I have another kind of worry. Descending italic f is hard to diferentiate from f with descending left hook (Unicode 0192, companion to uppercase 0191). This may justify a no-descending f in a font supporting non-European languages. (Actually, many less used Latin characters conflict to the usual way italics and swashes are designed.)</p>
      <p><strong>Julia</strong>, for the reason above I do not recommend to use a tail if the font aims wide language support.</p>
