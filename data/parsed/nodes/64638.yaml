    <p>Hi,</p>
    <p>I want to reproduce this sign:<br>
    <a href="http://pix.alaporte.net/pub/d/20273-1/Berlin+Wall+-+You+are+Leaving+the+American+Sector.JPG" title="http://pix.alaporte.net/pub/d/20273-1/Berlin+Wall+-+You+are+Leaving+the+American+Sector.JPG">http://pix.alaporte.net/pub/d/20273-1/Berlin+Wall+-+You+are+Leaving+the+...</a></p>
    <p>and do already know that the font used there is (at least close to) Blue Highway or Interstate:<br>
    <a href="http://www.dafont.com/blue-highway.font" title="http://www.dafont.com/blue-highway.font">http://www.dafont.com/blue-highway.font</a></p>
    <p>However, Blue Highway does not containt cyrillic (Russian) chars.</p>
    <p>So do you know maybe a similar font containing them?</p>
    <p>Cheers,<br>
    jorges</p>
