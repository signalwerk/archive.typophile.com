  html: "<p>Hey Everybody: <br> <br>I am a <i>new</i> design student from Canada, and i am working on a project that requires a highly legible typeface from a distance that's also friendly and optimistic.   <br> <br>I do not know where to start. Can you suggest a few typefaces? or direct me to some resources that might be helpful for me.  What kind of physical characteristic should i be looking for in such typeface? <br> <br>Thanks for your input, god bless</p>"
  html_clean: "<p>Hey Everybody: <br> <br>I am a <i>new</i> design student from Canada, and i am working on a project that requires a highly legible typeface from a distance that's also friendly and optimistic.   <br> <br>I do not know where to start. Can you suggest a few typefaces? or direct me to some resources that might be helpful for me.  What kind of physical characteristic should i be looking for in such typeface? <br> <br>Thanks for your input, god bless</p>"
comments:
  - id: 61992
    user: null
    date: null
    date_raw: null
    votes: null
    html: '<p>Its a broad field. Friendly and optimistic could conflict with legibility, if the design got too "friendly and optimistic". <br> <br>Depending on the distance, the mood, and just how legible you need to be, you could look at some of these: <br> <br><a href="http://www.stonetypefoundry.com/html_pages/BasaltOverview.html"> Basalt, </a><a href="http://www.gerardunger.com/fontstore/store-capitolium.html">Capitolium, </a><a href="http://www.fontbureau.com/fonts/GrandCentral"> Grand Central, </a> <a href="http://www.typography.com/catalog/gotham/index.html"> Gotham, </a><a href="http://www.typography.com/catalog/whitney/index.html"> Whitney,</a> <a href="http://www.fontbureau.com/fonts/Mantinia"> Mantinia, </a> <a href="http://www.fontbureau.com/fonts/Sophia"> Sophia, </a> <a href="http://www.stormtype.com/expert/mett.html"> Metron, </a> <a href="http://www.typofonderie.com/alphabets/view/Parisine"> Parisine</a> and the meticulous <a href="http://www.clearviewhwy.com/"> Clearview. </a> <br> <br>Some of these are obviously not for use where legibility is _critical_, and some are quite pricey, too pricey for a student project (unless you only need to spec the type, not set it.)</p>'
    html_clean: '<p>Its a broad field. Friendly and optimistic could conflict with legibility, if the design got too "friendly and optimistic". <br> <br>Depending on the distance, the mood, and just how legible you need to be, you could look at some of these: <br> <br><a href="http://www.stonetypefoundry.com/html_pages/BasaltOverview.html" class="link-external"> Basalt, </a><a href="http://www.gerardunger.com/fontstore/store-capitolium.html" class="link-external">Capitolium, </a><a href="http://www.fontbureau.com/fonts/GrandCentral" class="link-external"> Grand Central, </a> <a href="http://www.typography.com/catalog/gotham/index.html" class="link-external"> Gotham, </a><a href="http://www.typography.com/catalog/whitney/index.html" class="link-external"> Whitney,</a> <a href="http://www.fontbureau.com/fonts/Mantinia" class="link-external"> Mantinia, </a> <a href="http://www.fontbureau.com/fonts/Sophia" class="link-external"> Sophia, </a> <a href="http://www.stormtype.com/expert/mett.html" class="link-external"> Metron, </a> <a href="http://www.typofonderie.com/alphabets/view/Parisine" class="link-external"> Parisine</a> and the meticulous <a href="http://www.clearviewhwy.com/" class="link-external"> Clearview. </a> <br> <br>Some of these are obviously not for use where legibility is _critical_, and some are quite pricey, too pricey for a student project (unless you only need to spec the type, not set it.)</p>'
