    html: <p>Thank you for your reply. I have carefully read through your responses.  <br><br>I did consider Arrival, but Keith Tam is actually teaching in my school.  I thought it would be too easy to just pick it randomly out of the hat, since that’s the only type that i know designed for signages (cough* cough* due to Keith’s heavy advertising in his type class, hehe) <br><br>I like to explore other options so i have a few to compare from.   <br><br>For this project, the phrase “Big City, Here We Come” will be set in large sizes on the side of the street for driver to read as they drive, so i guess in a way it functions like a highway signage. <br><br>This tag line that i am using is to promote an friendly and optimistic feeling it’s ideal that the typeface doesn’t feel too&nbsp;cold.</p>
    html_clean: <p>Thank you for your reply. I have carefully read through your responses.  <br><br>I did consider Arrival, but Keith Tam is actually teaching in my school.  I thought it would be too easy to just pick it randomly out of the hat, since that’s the only type that i know designed for signages (cough* cough* due to Keith’s heavy advertising in his type class, hehe) <br><br>I like to explore other options so i have a few to compare from.   <br><br>For this project, the phrase “Big City, Here We Come” will be set in large sizes on the side of the street for driver to read as they drive, so i guess in a way it functions like a highway signage. <br><br>This tag line that i am using is to promote an friendly and optimistic feeling it’s ideal that the typeface doesn’t feel too&nbsp;cold.</p>
