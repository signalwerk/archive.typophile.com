  html: "<p>Hey Everybody: <br><br>I am a <i>new</i> design student from Canada, and i am working on a project that requires a highly legible typeface from a distance that’s also friendly and optimistic.   <br><br>I do not know where to start. Can you suggest a few typefaces? or direct me to some resources that might be helpful for me.  What kind of physical characteristic should i be looking for in such typeface? <br><br>Thanks for your input, god&nbsp;bless</p>"
  html_clean: "<p>Hey Everybody: <br><br>I am a <i>new</i> design student from Canada, and i am working on a project that requires a highly legible typeface from a distance that’s also friendly and optimistic.   <br><br>I do not know where to start. Can you suggest a few typefaces? or direct me to some resources that might be helpful for me.  What kind of physical characteristic should i be looking for in such typeface? <br><br>Thanks for your input, god&nbsp;bless</p>"
