    html: <p>What kind of project is it for?  <br><br>There are types designed for extreme circumstances (like  <br><a href="http://www.clearviewhwy.com/" target="_blank">Clearview</a> for highway signage) and then there are typefaces that  <br>are designed for wayﬁnding and signage (<a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;startrow=1&amp;records=20&amp;currpage=1&amp;totalrecords=17&amp;searchby=&amp;searchID=&amp;searchletter=&amp;searchstr=frutiger&amp;font_categories_checkbox=font_name_search&amp;fontRendererText=Hello+Typophiles" target="_blank">Frutiger</a>, <a href="http://www.typography.com/catalog/whitney/more12.html" target="_blank">Whitney</a>) and  <br>then there are faces that just hold up well at large sizes (<a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;startrow=1&amp;records=20&amp;currpage=1&amp;totalrecords=2&amp;searchby=&amp;searchID=&amp;searchletter=&amp;searchstr=thesis&amp;font_categories_checkbox=font_name_search&amp;fontRendererText=Hello+Typophiles" target="_blank">The Sans</a>).</p>
