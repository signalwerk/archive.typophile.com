    date: 2005-03-12T08:54:00
    date_raw: 12 March 2005 - 8:54am
    votes: 0
    html: '<p>Its a broad ﬁeld. Friendly and optimistic could conﬂict with legibility, if the design got too “friendly and optimistic”. <br><br>Depending on the distance, the mood, and just how legible you need to be, you could look at some of these: <br><br><a href="http://www.stonetypefoundry.com/html_pages/BasaltOverview.html"> Basalt, </a><a href="http://www.gerardunger.com/fontstore/store-capitolium.html">Capitolium, </a><a href="http://www.fontbureau.com/fonts/GrandCentral"> Grand Central, </a> <a href="http://www.typography.com/catalog/gotham/index.html"> Gotham, </a><a href="http://www.typography.com/catalog/whitney/index.html"> Whitney,</a> <a href="http://www.fontbureau.com/fonts/Mantinia"> Mantinia, </a> <a href="http://www.fontbureau.com/fonts/Sophia"> Sophia, </a> <a href="http://www.stormtype.com/expert/mett.html"> Metron, </a> <a href="http://www.typofonderie.com/alphabets/view/Parisine"> Parisine</a> and the meticulous <a href="http://www.clearviewhwy.com/"> Clearview. </a> <br><br>Some of these are obviously not for use where legibility is _critical_, and some are quite pricey, too pricey for a student project (unless you only need to spec the type, not set&nbsp;it.)</p>'
    html_clean: '<p>Its a broad ﬁeld. Friendly and optimistic could conﬂict with legibility, if the design got too “friendly and optimistic”. <br><br>Depending on the distance, the mood, and just how legible you need to be, you could look at some of these: <br><br><a href="http://www.stonetypefoundry.com/html_pages/BasaltOverview.html" class="link-external"> Basalt, </a><a href="http://www.gerardunger.com/fontstore/store-capitolium.html" class="link-external">Capitolium, </a><a href="http://www.fontbureau.com/fonts/GrandCentral" class="link-external"> Grand Central, </a> <a href="http://www.typography.com/catalog/gotham/index.html" class="link-external"> Gotham, </a><a href="http://www.typography.com/catalog/whitney/index.html" class="link-external"> Whitney,</a> <a href="http://www.fontbureau.com/fonts/Mantinia" class="link-external"> Mantinia, </a> <a href="http://www.fontbureau.com/fonts/Sophia" class="link-external"> Sophia, </a> <a href="http://www.stormtype.com/expert/mett.html" class="link-external"> Metron, </a> <a href="http://www.typofonderie.com/alphabets/view/Parisine" class="link-external"> Parisine</a> and the meticulous <a href="http://www.clearviewhwy.com/" class="link-external"> Clearview. </a> <br><br>Some of these are obviously not for use where legibility is _critical_, and some are quite pricey, too pricey for a student project (unless you only need to spec the type, not set&nbsp;it.)</p>'
