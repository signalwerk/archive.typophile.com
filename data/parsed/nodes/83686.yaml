    <p>I am researching 50s typography for a new project.</p>
    <p>(1) would love of any good examples from the most knowledgable members of Typophile</p>
    <p>(2) would love to a bit of Type ID of the this great poster of The Man Who Fell To Earth.</p>
    <p>Some of the letter looks in the vicinity of BureauGrotesque but the O is definitely different—my guess would be custom but again, would appreciate any help on this.</p>
