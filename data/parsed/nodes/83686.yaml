    html: |-
      <p>In the 1950s and 60s, Saul Bass (1920-1996) was the superstar designer of film titles and film posters. His film credits included:</p>
      <p>The Man withe the Golden Arm<br>
      Anatomy of a Murder<br>
      Around the World in 80 Days<br>
      Psycho<br>
      It’s a Mad Mad Mad Mad World<br>
      North by Northwest<br>
      Vertigo<br>
      Spartacus<br>
      Exodus<br>
      West Side Story</p>
      <p>Like many of his contemporaries, he was a talented creator of handlettered headlines, so some of his best work may be described in terms of graphic design or letterforms, but not as typography <em>per se</em>.</p>
