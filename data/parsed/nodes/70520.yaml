    html: |-
      <p>Separately but related, I have started assembling the seeds of an idea for an online type specimen book and ephemera library via ebook or printed on-demand. It seems regrettable that all these great type books are hoarded up and cannot be shared, also they have no path to the future if they end up as estate sale winnings . . .</p>
      <p>The origin of this thought was because of working with the Filmotype and Lettering Inc libraries with tons of amazing specimen books from the 1930s through 1960s many of which aren't likely to be reprinted again and I cringe flipping through the pages as they are fragile and I don't want to damage them further while being able to enjoy reading them . . .</p>
      <p>Granted, I would admit copyright concern is a major priority but in most cases, many of the original companies and publishers no longer exist . . .</p>
      <p>Any thoughts?<br>
      Stuart :D</p>
