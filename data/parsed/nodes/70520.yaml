      <p>From my perspective as a type designer and student of typography, no resolution can be too fine. I want to see every fibre of paper, because it is the effect of inked letter shapes on metal as it is pressed into paper that concerns me, and I want to see it exactly the way the type founders of the day saw it, because it is this degree of detail upon which they based the subtleties of their designs.</p>
      <p>**</p>
      <p>Resolution is not the only issue.<br>
      What should be the scanner's setting?<br>
      For different subject matter, contrast and brightness may be varied to optimize the image.<br>
      Then there is the somewhat postmodern question of whether a scan should represent the artefact as it is now, or be adjusted (i.e. "improved") to represent its original condition.</p>
      <p>**</p>
      <p>I have a nice facsimile copy of 200-year-old Bruce Foundry book, reproduced so accurately they even went to the trouble of printing the foxing in a special colour!</p>
