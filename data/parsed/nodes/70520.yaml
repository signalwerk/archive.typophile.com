  html: <p>Ok, maybe a strange question here, but I've got some old specimen books, lettering books, etc. and I love looking through these things, but the moldy "odor" is really almost unbearable. Does anybody have any tips on how to safely remove treat this?</p>
  html_clean: <p>Ok, maybe a strange question here, but I've got some old specimen books, lettering books, etc. and I love looking through these things, but the moldy "odor" is really almost unbearable. Does anybody have any tips on how to safely remove treat this?</p>
