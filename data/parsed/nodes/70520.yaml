      <p>&gt; the 1923 ATF specimen is around 1,100 pages</p>
      <p>My first real design job was a summer internship at a corporation. Each afternoon we'd send our marked-up copy to the typesetter, and the next morning we'd receive our type galleys.</p>
      <p>One morning the typesetter's delivery guy walked in and dropped an enormous envelope on my desk with a thud. "Here's your type." The package must have weighed 5 pounds. I stared at it in horror. Had I made some horrendous mistake when spec'ing type? Was I going to get fired?</p>
      <p>With trembling hands I opened the package. My type was in there all right, but so was something I didn't expect -- the typesetter's massive new specimen book. Wheh.</p>
