      <p><em>The POD problem since most of them only deal with fixed sizes and who can attest to quality?</em></p>
      <p>POD could do some B&amp;W specimens really well, but only if someone devoted a great deal of time to cleaning up all the images. I’m not a big fan.</p>
      <p><em>A host for 4-6mb images PER page at minimum</em></p>
      <p>Eek. We might need to just have a central repository for ordering DVDs.</p>
      <p><em>An online reader</em></p>
      <p>I think we would be better off just zipping everything up as CBZ files for use with comic-reading software. It’s much faster than trying to view big images through browsers or PDF readers.</p>
      <p><cite>I presume perhaps naively that any contributors will do their own scanning and uploading and their own due diligence on legal issues pertaining to copyright . . .</cite></p>
      <p>We could always just start with the public domain stuff and move forward from there. And we might also find that some of the people who have bought up the rights to old type libraries own the rights to the specimen books.</p>
      <p>It might be worthwhile to try finding a private library where we could set up a camera stand and a server and work on something like this. Maybe the TDC library would be good given it’s proximity to some pretty exceptional collections of type specimens and other rare book.s</p>
