      <p>I feel your pain: I had a copy of <em>The Book of Oswald Cooper</em> that curled my nose hairs anytime I removed it from solitary confinement, until I applied "the cure."</p>
      <p>Book preservation pros recommend zeolite: place the offending article in a heavy-duty zip-lock bag with a couple tablespoons of the stuff, and change it out every three months or so. Less expensive and more readily available: kitty litter. Neither is a complete cure, but both definitely reduce the pungency.</p>
