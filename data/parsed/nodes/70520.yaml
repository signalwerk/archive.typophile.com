    html: <p>An online specimen library is definitely something we’re all going to need to work on. Between the growing numbers of type designers and the popularity of specimens with non-type designers (including people who should be hanged for cutting the books up to sell as prints!) these books are in very short supply. And the quality of Google Books scans is often abominable, making it useless for anything small. Maybe we should all get interns to scan everything and start uploading to Flickr.</p>
