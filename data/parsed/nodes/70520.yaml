      <p>I want to add some comments on this.<br>
      I do believe that what is being spoken here is a digital library of Old Specimen Books.<br>
      There are lots of definition (and attempts) of what a digital library is.<br>
      For the Digital Library Federation:</p>
      <p>"Digital libraries are organizations that provide the resources, including the specialized staff, to select, structure, offer intellectual access to, interpret, distribute, preserve the integrity of, and ensure the persistence over time of collections of digital works so that they are readily and economically available for use by a defined community or set of communities."</p>
      <p>As we can agree, a digital library includes several layers.<br>
      The main layers are:<br>
      -providing the resources<br>
      -Organize them<br>
      -Distribute them<br>
      -Preserve the integrity of them<br>
      -Ensure the persistence over time of collections of digital works </p>
      <p>When I study this issues some years ago, we came up with a solution in using a Open-source software that was built in order to guaranty this all issues as they are of main concern when you developed a digital library. There are lots of software out there but this solution was fine for us: <a class="freelinking external" href="http://www.fedora-commons.org/about/examples" rel="nofollow">FEDORA </a> and <a class="freelinking external" href="http://fez.library.uq.edu.au/about/" rel="nofollow">FEZ </a> an interface for it.<br>
      These software working together can be what is need here. Lots of different users working together with the same application with several levels of permission (from user to administrator of collection responsible for checking who can add documents and validating them).</p>
      <p>This software address some issues referred here by Nick Shinn: "as a type designer and student of typography, no resolution can be too fine" and "Then there is the somewhat post-modern question of whether a scan should represent the artefact as it is now, or be adjusted (i.e. "improved") to represent its original condition". I do agree with Nick "no resolution can be too fine and I want to see every fibre of paper, because it is the effect of inked letter shapes on metal as it is pressed into paper that concerns me". The software allows us to create this High-Res digitalisations and store them and develop all kind of disseminators(like a low-Res JPG or grayscale doc- everything you want).</p>
      <p>Of course that the implementation of these software are not easy (not that difficult either- I'm no programmer and manage to install it) and a dedicated server. But in my opinion if the purpose here is to develop a real usable archive/digital library these matters have to be addressed.</p>
      <p>António Fonseca</p>
