      <p>My son had a job at his university library for a while. The management's view of scanning books was that it was the answer to all their storage problems. (With permission) he'd brought home a number of old, leather-bound, musty smelling books and maps that, having been scanned, would otherwise have ended up in the recycling bin. </p>
