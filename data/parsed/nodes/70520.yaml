      <p>Hi António,</p>
      <p>I continue to study this matter deeply but haven't made much progress I'm afraid . . .</p>
      <p>There are it seems two concerns . . .</p>
      <p>1) Scanning/Offering the materials</p>
      <p>2) Institutionalizing the materials</p>
      <p>Insofar as issue one goes, I have some e-mails out to high end book scanning resources that won't destroy the book in the process of digitizing them . . . I will advise once I have heard some results . . .</p>
      <p>As far as issue two goes, unless the originals are donated to an institution or provided to a large enough source whereby they can be hosted infinitely there is a fear that they will not survive archival storage if they are maintained at only one source . . .</p>
      <p>I'm likely getting ahead of myself, but I think insofar as a digital copy goes, it can and should be scanned and shared and even a Print-on-demand solution would be desirable . . .</p>
      <p>As far as the actual physical materials go, they should likely eventually end up in the hands of a library that can archive and store them for future generations rather end up at an estate sale marked for 5 cents each . . .</p>
      <p>Stuart</p>
