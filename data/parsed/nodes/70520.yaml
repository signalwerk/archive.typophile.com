      <p>Thanks for the thoughtful input gang! I spoke with a tech buddy of mine and this isn't as difficult to do as we may think . . .</p>
      <p>The problems are the problems . . .</p>
      <p>Flickr only allows a max resolution and knowing what I know about this group, I don't think any of us would be satisfied without seeing the grains of the paper upon full zoom. OpenLibrary nor Flickr gave me this piece of mind . . .</p>
      <p>The flip side of it is that nobody can print above 300 dpi, so at some point you hit diminishing returns on scans created for screen vs scans created for print . . . And as James mentioned, Google Books just ain't cuttin' it . . .</p>
      <p>I guess the solution is something much closer to an OpenLibrary but even that isn't close enough . . .</p>
      <p>I think there are multiple things that need to be solved:</p>
      <p>* The POD problem since most of them only deal with fixed sizes and who can attest to quality?</p>
      <p>* A host for 4-6mb images PER page at minimum</p>
      <p>* An online reader</p>
      <p>I presume perhaps naively that any contributors will do their own scanning and uploading and their own due diligence on legal issues pertaining to copyright . . .</p>
      <p>Any thoughts on how to solve the rest of it?</p>
      <p>Stuart :D</p>
