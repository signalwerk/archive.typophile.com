      <p>In Germany, since some weeks we are working on a project to upload around 1,600 so called "Typokartei" DIN A5 (800 of it, two-sided). All scans are done already (300 dpi), each scan has around 180 KB. I guess this is close to maximum of what might be alright for the users of the website later on.</p>
      <p>The cards show german lead letters from all german foundries, developed between 1910 and 1980 and in general they show all the same informations about the font - see pic below. We'll edit important informations about font name, foundry, year of first production, artist, DIN 16518 group/subgroup and more in a XML or ITCP format.</p>
      <p>Yes, its a lot of work. Right now I start we renaming the pics, so font name is file name. fontware, a norwegian company out of prepress, specialists on archives and handling of large number of pictures, sponsored the project by giving us server and software.</p>
      <p>I hope anywhere in three months or so, a visitor will have the chance to call a font on <a href="http://www.bleisetzer.de" title="www.bleisetzer.de">www.bleisetzer.de</a> or he can select e.g. all fonts, first produced between 1920 and 1933. Or all fonts of Rudolf Koch or whatever.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Neues Bild_6030.JPG"></div><p></p>
