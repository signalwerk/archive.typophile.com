      <p>I've got volumes one and two of the German DVDs. Each DVD contains a collection of specimen books organized by country then by foundry. Within that structure, each specimen (books, pamphlets, cards, etc.) is a PDF made up from 150dpi scans (best guess). </p>
      <p>I think they are a wonderful survey of what was available in the world of metal type, good enough to get an idea what typefaces look like (for identification purposes for instance), and perhaps for judging whether or not you want to get hold of a certain physical specimen or not, or whether it's worth the asking price. I don't think the quality is good enough for doing tight digital revivals, but good enough to inspire and inform new faces.</p>
