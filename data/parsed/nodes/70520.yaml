      <p>You could have the books re-bound, especially if they're falling apart as you said (I am a hobbyest binder, which is why I found this discussion). There are plenty of hand binders in every city. It doesn't really take an institution. One nice thing is when a book is completely disassembled it is much easier to scan. The only thing that really can't be fixed is very brittle paper. I'm always surprised how many people never consider rebinding books when they see what is actually just superficial damage. Sometimes it's just the cover that's damaged but the book doesn't even need to be re-sewn. If the edges look dingy, sometimes you can just trim the margins in a guillotine and the book looks almost new.</p>
      <p>Another fun thing about rebinding is you can personalize the books imprinted with your initials or choose or color or so it matches your apartment. I've often taken a series of different books of similar sizes and made them look like a set. </p>
      <p>TJ</p>
