    <p><a href="http://www.typetrust.com/fonts/font.php?id=ODEx">Black Monday</a> is a distressed or “grunge” version of James Puckett's Recovery typeface. The core of the Black Monday type family is a single Opentype font containing three full character sets of varying degrees of distressing treatment. Every glyph in each of the subsets is unique to provide an organically weathered look and feel. Opentype scripting rotates through the character sets to automatically generate a pseudo-random look.</p>
    <p>The three distinct glyph sets are also available as individual fonts for use in applications that do not yet support the Stylistic Sets Opentype feature. These styles are identified as Subset 1, Subset 2, and Subset 3, while the full version is simply "Black Monday Regular".</p>
    <p><a href="http://www.typetrust.com/fonts/font.php?id=ODEx">Black Monday is available now at www.TypeTrust.com</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/black_monday_5879.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/BlackMonday3_3929.gif"></div><p></p>
    <p>And to give credit where it’s due: Recovery and Black Monday are based on the work of Charles Coiner and the typeface Eagle Bold by M.F. Benton.</p>
