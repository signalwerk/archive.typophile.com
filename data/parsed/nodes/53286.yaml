    html: |-
      <p>@Nick: Silas can explain it better—the LIGA method, and the code that produced it, was his brilliance—but LIGA is more widely supported than CALT. The stylistic sets allow the results of the randomizer to be quickly changed. And everything has alternates configured so that the user can quickly change the results at any given character.</p>
      <p>The subset fonts allow for a single, less chaotic look to be chosen; each set was distressed using a different technique and suffered less damage. In subset one the letters are nearly annihilated, in subset three they’re just weathered. The subset fonts also allow manual randomization in applications that do not support the other OpenType features.</p>
