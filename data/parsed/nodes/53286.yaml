      <p><em>The stylistic sets allow the results of the randomizer to be quickly changed. </em></p>
      <p>That's clever.</p>
      <p>It suggests an improvement to a random effect I put into Duffy Script, whereby the user can "bump" the sequence of characters in a word by inserting space(s) in front of a word. (Sort of like spinning the tumblers, to get a different look each time.) But being able to apply different Stylistic Sets, each of which will produce a different sequence, would be better.</p>
