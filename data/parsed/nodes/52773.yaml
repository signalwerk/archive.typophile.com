      But as a regular user here you finally could read the <a href="http://typophile.com/forum/typeid/faq/#Q_2" rel="nofollow">FAQ</a> especially Question 2:<br>
      <strong>What do I enter in the »Title« line?</strong>:<br>
      <cite>Try to define your type ID request as clearly as possible. For example »1960’s newspaper headline face« or »Lost in Translation movie logo« or »retro script« will do nicely. Whereas »Please help me identify this font« is pretty pointless as that’s the only thing we do on the Type Identification Board. Compare it to a newspaper where every single headline would say »Stuff happened!«</cite></p>
