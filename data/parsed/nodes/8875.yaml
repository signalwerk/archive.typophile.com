    html: <p>Hi Darren, <br> <br>Depending on your goal, it's difficult to comment on what you're doing. <br> <br>If you aim  to make a buck, you need only shop specimens to distribution outfits or put the fonts through MyFonts.com . . . <br> <br>If you aim to get hired as a font  designer, specimen sheets will help but any foundry would insist on reviewing the font files. <br> <br>If you're asking what is the best way to set up a specimen sheet, I'd say look through all the online photo  galleries from different type design shows like Typecon, TDC, etc. <br> <br>Many folks tend to emulate the House/Font Bureau formula of words in use as phrases at different scales along with a character showing to demonstrate the completeness of the font and consistency of the letterforms. <br> <br>Hope this helps refine your question somewhat . . . <br> <br>Stuart :D</p>
