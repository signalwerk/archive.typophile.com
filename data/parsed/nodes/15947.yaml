  html: |-
    <p>I just upgraded to CS2 only to find one of the more useful keyboard shortcuts missing. Previously if you set the Keyboard Increment, for example to 1 inch, selected an object and pressed Option+Arrow Key, Illustrator would duplicate the object 1” in that direction.</p>
    <p>Anyone else run into this problem?</p>
