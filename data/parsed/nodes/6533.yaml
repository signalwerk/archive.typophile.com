    html: <p>No modern discussion of the swastika is complete without mention of Swastika, Ontario - the defiant Canadian town that stands by its name and emblem. <br> <br><a href="http://www.manwoman.net/swastika/fots.html" target="_blank">http://www.manwoman.net/swastika/fots.html</a> <br> <br>I've read about the town before; this was just the quickest link I could find.  The burg won a battle in the 50's to resist a government-mandated namechange to "Winston".  They proudly display the swastika on local merchandise (matchbooks, etc.) and have a campaign going to enlighten people on the symbol's true meanings. <br> <br>Paul</p>
