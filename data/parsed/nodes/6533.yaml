    html: '<p>Just to clarify: a logo is protected by a slightly different branch of intellectual property law -- Trademark, not Copyright. Unlike copyright, which accrues to the creator upon the act of creation (under all copyright laws that I know of anyway), trademark protection is usually only offered after registration and a period of review. Also, the guidelines for determining infringement are specific to trademark law.  <br> <br>If "Satan" has any concerns, he/she should contact a trademark attorney for a professional opinion. <br> <br><i>Svastika</i> is a Sanskrit word derived from <i>svasti</i> ("well-being, fortune, luck, success, prosperity"). Svastika can refer in general to any auspicious mark or object, but it is most commonly used to indicate the familiar swastika symbol. Some claim that the direction of the arms has significance, but I suspect this is a post-WWII revisionism designed to distance the original symbol from the Nazi appropriation/corruption of it. Steven Heller wrote an entire book about this.</p>'
    html_clean: '<p>Just to clarify: a logo is protected by a slightly different branch of intellectual property law -- Trademark, not Copyright. Unlike copyright, which accrues to the creator upon the act of creation (under all copyright laws that I know of anyway), trademark protection is usually only offered after registration and a period of review. Also, the guidelines for determining infringement are specific to trademark law.  <br> <br>If "Satan" has any concerns, he/she should contact a trademark attorney for a professional opinion. <br> <br><i>Svastika</i> is a Sanskrit word derived from <i>svasti</i> ("well-being, fortune, luck, success, prosperity"). Svastika can refer in general to any auspicious mark or object, but it is most commonly used to indicate the familiar swastika symbol. Some claim that the direction of the arms has significance, but I suspect this is a post-WWII revisionism designed to distance the original symbol from the Nazi appropriation/corruption of it. Steven Heller wrote an entire book about this.</p>'
