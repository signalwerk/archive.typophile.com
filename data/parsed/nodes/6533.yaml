    html: <p>I am very interested by the swastika issue. <br>I can confirm that the clockwise or counterclockwise direction is an after-WW2 assumption, since the symbol has always been used with positive meaning in both directions before the Nazi appropriation. <br> <br>Actually I had a short discussion with Heller when he wrote an essay on Outwest for my "Letters" book (coming out before the end of.. etc. etc.) and I mostly disagree with his conclusions. I have not read his book, but I have read an article on Baseline and what I actually consider wrong is the preconception against blackletter (raised by Heller in another article). This is all part of a project I intend to develop on the redemption of the blackletter (and maybe the swastika) considering that, as Miles Newlyn pointed out talking about his Ferox typeface, perceptions towards graphic symbols always arise in context. <br> <br>When I will do it I will ask for the opinion of Typophile members. This tread has proved really interesting.</p>
