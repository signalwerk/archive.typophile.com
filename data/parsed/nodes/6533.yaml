    html: <p>The rules of copyright depend on where the copyright is claimed, registered, and applicable.  <br> <br>Our gouvernment (Canada) has a website where you can search images and their "description" of said logo. If their description and image matches, best not tred in those waters. Some descriptions are as vague as "M" (Helvetica) in a black box symbolizing unity. registered 1966, folded, re-registered ect. ect. <br> <br>Check with you copyright office, hire a lawyer or order the search. its the second step in the identity design process in our hood.</p>
