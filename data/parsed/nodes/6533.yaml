    html: "<p>Paul, talking about unintentional swastika's: we once received a flaming letter by a FontShop customer who bought FUSE 1 and noticed the \"x\" in Ian Swift's <i>Maze 91</i>. This guy was so outraged he virtually accused us of being Nazis! I fear this negative conotation is so engrained in our collective memory that it won't ever go away. Then again, he was the only customer in the entire FS network we ever heard of who was irked by the character. Methinks it's just a question of interpretation, and I suspect some people to intentionally go looking for these kind of things. <br> <br>Graham, I'm very impressed. <br> <br>Satan, I really don't know. Personnally, comparing your design to the other examples shown here I think your interlocking Fs are a pure swipe, and I wouldn't recommend using it from an ethical point of view. Uvcurz, you're a free man. No offense, I don't wanna sound too harsh. Wouldn't want to incur the wrath of Satan... <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
