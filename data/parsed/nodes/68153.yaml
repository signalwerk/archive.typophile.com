    <p>Hi guys,</p>
    <p>I am trying some fonts for a Literary Magazine. Do you know of any Indesign Template or Website that i could a get a template then copy/paste a specific font and take to the laser printer to check how the font works? A fast test drive for fonts which include its family' variations for text.</p>
    <p>I guess is something like that<br>
    <a href="http://www.levien.com/type/atf_1912/p0739_sm.jpg" title="http://www.levien.com/type/atf_1912/p0739_sm.jpg">http://www.levien.com/type/atf_1912/p0739_sm.jpg</a></p>
    <p>or that<br>
    <a href="http://www.fontsquirrel.com/fonts/TitilliumText14L" title="http://www.fontsquirrel.com/fonts/TitilliumText14L">http://www.fontsquirrel.com/fonts/TitilliumText14L</a><br>
    <a href="http://www.fontsquirrel.com/fonts/ChunkFive" title="http://www.fontsquirrel.com/fonts/ChunkFive">http://www.fontsquirrel.com/fonts/ChunkFive</a></p>
    <p>I guess i could do it by hand with each font but it will take me quite a while.</p>
    <p>Any help or ideas?</p>
    <p>Thanks<br>
    Sebastian</p>
