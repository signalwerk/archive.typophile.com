      <p>Thanks!<br>
      Regarding the OTL 'locl' feature, the actual 'middle dot' isn't used anywhere in Greek text? I believe the only intended use in Latin alphabet is as a separator between two 'l' from different syllables in Catalan, yet some people also use it as multiplication sign (even though there's a separate character for that).</p>
