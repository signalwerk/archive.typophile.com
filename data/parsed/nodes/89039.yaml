    html: |-
      <p>Yes, it is used. I usually align the default ano teleia to the top dot of : and ;. I also provide an all-cap variant aligned to the cap height (OTL 'case' feature') and a smallcap variant aligned to the smallcap height (OTL 'smcp' feature).</p>
      <p>You can handle the compatibility mapping issue by providing an OTL 'locl' feature mapping from the period centred glyph to the ano teleia glyph in the Greek script and language system.</p>
