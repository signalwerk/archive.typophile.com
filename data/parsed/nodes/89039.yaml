  html: |-
    <p>Is there any info about this character (U+0387)? Is said that is used in Greek as an equivalent to the semi-colon in Latin languages (while in Greek, semi-colon works as a question mark). Unicode poorly make it a compatibility decomposition to the Middle dot character (U+00B7), even though is frequently said that the character is "sightly above" the x-height, yet I haven't found enough reference. For a while I thought that a ongoing accepted Unicode proposal for the character 'raised dot' was a replacement, but it is actually a dot that resides <em>between</em> the x-height and the baseline, for use in Greek and Coptic too.</p>
    <ul>
    <li>Is the symbol (Ano teleia) actually used?</li>
    <li>Are there any kind of guide of how to design it?</li>
    <li>Is there any solution to the "compatibility decomposition" issue for the future?</li>
    </ul>
