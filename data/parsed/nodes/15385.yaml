    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Analphabetic</strong></p>
    <p>Noun - analphabetic - an illiterate person who does not know/understand the alphabet, or having no knowledge of the alphabet.</p>
    <p>Adjective - analphabetic - relating to/expressed by a writing system which is not alphabetic.</p>
    <p>an example of an analphabetic writing system is Jesperson's system of phonetic transcription.</p>
