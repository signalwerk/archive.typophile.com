    html: |-
      <p>"But it’s too 70s." Exactly.<br>
      If you really want flares with that, you might consider a couple of the old ITC faces - <a href="http://www.itcfonts.com/fonts/detail.asp?sku=ITC9157" rel="nofollow">ITC Novarese</a> or <a href="http://www.itcfonts.com/fonts/detail.asp?sid=VCCLSFKKHEKF8JR0GWD408PSKVFU89H4&amp;sku=ITC9136" rel="nofollow">ITC Newtext</a> are both flared this way, but neither is unique, and the geometry of Variable makes this pairing a bit problematic to harmonise. Alternatively, if the types are not being used in close proximity on the page, you could go for a complete structural contrast in the headlines, captions etc. and try the grandaddy of flare serif types - Berthold Wolpe's <a href="http://itc.identifont.co.uk/partner?VCCLSFKKHEKF8JR0GWD408PSKVFU89H4+Albertus+255290+010082113" rel="nofollow"> Albertus</a>, which is also available in an italic and a light weight these days.<br>
      Having said all that, I much prefer Tim's idea of contrasting Variable with an Egyptian or Slabserif.</p>
    html_clean: |-
