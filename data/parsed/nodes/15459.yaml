      <p>Given the geometric qualities of Variable you could look at a slab serif with a high(ish) x-height. How closely do you want the fonts to work, because Variable is fairly fine and most serifs will be too heavy to combine in body copy with Variable Regular or Bold.<br>
      Tim</p>
