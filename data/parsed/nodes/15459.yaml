    <p>Hi all,<br>
    I am looking for a serif font like Friz Q. that has some flare and is very unique.  Any suggestions?</p>
    <p>It would be great if the font works well with Variable (<a href="http://www.myfonts.com/fonts/madtype/variable/" title="http://www.myfonts.com/fonts/madtype/variable/">http://www.myfonts.com/fonts/madtype/variable/</a>) but I am also open to sugggestions of other fonts that work well with Variable.</p>
    <p>Thanks.<br>
    -Will</p>
