    html: |-
      <p>You need a serif typeface that isn't mousy and won't bow to the pressure of being paired with such a overtly modern typeface. Something quirky on its own, I think. What about something from <a href="http://www.fountain.nu/" rel="nofollow">Fountain</a> such as Stefan Hattenbach's <a href="http://www.fountain.nu/catalogue/delicato.asp" rel="nofollow">Delicato</a>? </p>
      <p>So the faces won't be used on the same page? OR The serif will be text and the sans will be head and sub-head?</p>
      <p>I think you will be updating regularly if you choose to use such a modern typeface as trends change so quickly. I suppose this can be seen as a positive as the art world changes its mind as to what is vogue from week to week as well.</p>
