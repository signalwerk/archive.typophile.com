      <p>A recent newspaper ad for Audi featured a font with holes in it, a metaphor for the "green" construction of their lightweight automobile.</p>
      <p>This creative gem was full page, featuring acres (metaphorically) of white space. (Well, grey space anyway, it was after all newsprint.)</p>
      <p>When I started Earthmark, an environmental marketing company, in 1989, one of our promises was to help reduce clients' environmental footprint, by means of expertise in producing powerful small advertisements and brochures. That was probably one of the reasons for Earthmark's demise -- there's no glory in small ads for product managers, agencies, or creatives, regardless of their efficacy in shifting product.</p>
      <p>As long as print marketing continues to rely on cheap size for impact, "saving the environment" by using less ink on a percentage basis is irrelevant.</p>
      <p>In the world at large, pollution of all kinds has proceeded because industry standards are based on risk assessment tied to percentage concentrations, rather than capping toxic emissions to the finite nature of the physical environment.</p>
      <p>In graphics, the high resolution of the digital workflow has arguably produced the most benefit to the environment, by enabling smaller documents. Newspaper rolls have been steadily decreasing in width, and newspapers in size, with the decline of that industry.</p>
      <p>Increased resolution enables a downsizing of paper-size standards in general, such as has already happened in the newspaper business. (This process has been going on in garment industry dress sizes for many years).</p>
      <p>It is time to shrink A4 etc., and 8 1/2" x 11".</p>
