    <p>Hi everyone, a non-designer friend of mine sent me this:<br>
    <a href="http://www.ecofont.com/en/products/green/printing/sustainable-printing-using-ecofont-software.html" title="http://www.ecofont.com/en/products/green/printing/sustainable-printing-using-ecofont-software.html">http://www.ecofont.com/en/products/green/printing/sustainable-printing-u...</a><br>
    What do you guys think of it?<br>
    Is it possible not to affect legibility?<br>
    I think people are just going crazy with this eco-friendly thing.<br>
    There might be other ways to spend less ink that do not include making holes inside letters.<br>
    Also it makes every typeface looks like those cabaret mirrors.</p>
