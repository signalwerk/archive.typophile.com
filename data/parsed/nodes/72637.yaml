      <p>Some time ago, after I saw that funny ink test made with pen, I did myself some comparison about ink coverage. Just for fun and curiosity.</p>
      <p><strong>My method:</strong><br>
      1. I set an article with 16 pages in InDesign with each of the fonts.<br>
      2. Edited font size to match text extension.<br>
      3. Exported each article to PDF.<br>
      4. In Photoshop, imported these PDFs and rasterized them in 1200dpi.<br>
      5. Did a histogram measure about back/white dots, considering the 127 level the mid-cut.<br>
      6. Made arithmetical medias for all pages of each font usage to get an ink coverage.</p>
      <p><strong>Results:</strong><br>
      <code>Font...............Size....Ink coverage<br>
      Adobe Caslon.......10.25...10.51%<br>
      Garamond BE.........9.85...10.78%<br>
      My project..........9.45...11.27%<br>
      Minion Pro.........10.25...11.53%<br>
      Times New Roman....10.10...11.57%<br>
      Baskerville BE.....10.15...11.91%<br>
      Utopia..............9.50...12.10%<br>
      Guardian Text.......8.60...12.45%<br>
      Meta Serif..........9.50...12.82%<br>
      </code></p>
