      <p>In the spirit of Ecofont, we at H&amp;FJ are spearheading an eight-point plan to promote more ecologically sound typography. We welcome the contributions of other companies and individuals interested in supporting this important initiative.</p>
      <p>KEY GOALS:</p>
      <p>1 - 20% reduction in the use of heavy-ink letters M and W by 2030</p>
      <p>2 - Two-part plan for gradual phase out of dots over i, j</p>
      <p>3 - Tax incentive for households limiting their vocabularies to words of six or fewer letters</p>
      <p>4 - Requirement that all government forms be tracked -200</p>
      <p>5 - "Print" command on home computers to require two users to simultaneously insert and turn special keys</p>
      <p>6 - Reduction of highway signs to maximum size of 8-1/2" x 11"</p>
      <p>7 - Illegalization of circulars and take-out menus, with three-strikes rule and death penalty in most states</p>
      <p>8 - National campaign to ration serifs and collect them to help beat the kaiser</p>
      <p>With your support, we can help the energy, mining, transport and agriculture industries address their number one environmental problem, which is poor font selection.</p>
      <p>Yours,</p>
      <p>Steve Gibbs<br>
      Chief Strategy Officer<br>
      Dept. of Green and Greenish Typography<br>
      Hoefler &amp; Frere-Jones</p>
