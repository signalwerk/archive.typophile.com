    html: <p>Smaller fonts with more conventional proportions are easier to read than narrow fonts, no? I'm not a lab coated font scientist but I believe that to be true. If the goal is squeezing in more text on the page, go smaller and use type designed for small print. Save vertical space too. Those old, tiny pocket bibles had type designed for ridiculously small point sizes. I'm not against the concept of the eco font, but I don't see how compressed type is easier to read than smaller type. I haven't read a bible for more than 3 seconds so I'm just assuming that they're easy to read. I do know that they're tiny and employ special bible fonts which I haven't seen anywhere outside of a bible.</p>
