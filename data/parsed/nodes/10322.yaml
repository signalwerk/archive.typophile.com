      <p>I get a 404 error on your website but your previous PDFs look good. It is a Syntax to Optima arena which is not attempted much--meaning you have chosen a good niche without lots of similar work in competition. I would like to see text in smaller sizes. it makes seeing it as a text font easier for me. I like the feeling of leaning caused by the strees in your b d p q.  You might try tightening the letterspacing a bit overall.  It feels a tad loose to me.</p>
      <p>ChrisL</p>
