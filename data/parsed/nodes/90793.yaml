    <p>Hi,</p>
    <p>I'm looking for fonts that contain condensed weights, but also black extended. And everything in between.</p>
    <p>The "black extended" part is especially important.</p>
    <p>So far:</p>
    <p>Helvetica Neue LT Std<br>
    Titling Gothic FB<br>
    Univers</p>
    <p>Not so much:</p>
    <p>Proxima Nova (doesn't have black extended)<br>
    Roboto (doesn't have black extended)</p>
    <p>Any thoughts?</p>
    <p>W.</p>
