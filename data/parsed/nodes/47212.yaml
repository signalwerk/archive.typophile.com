      <p>1) Nitpick: The native artforms of the Pacific Northwest are completely different and separate from Cree and Inuit artforms. Separated culturally and by thousands of miles of geography. The Pacific Northwest is nowhere near Nunavut, and Inuktituk was never spoken there.</p>
      <p>2) Since your client has no connection to the Haida, Kwakiutl or Coast Salish cultures, other than the stated vague geographic one, I wonder if the concept is appropriate. Orcas have nothing to do with furniture-making or the recently immigrated.</p>
      <p>3) I think the logo itself (the original one) is beautifully executed. Good job. I think your subsequent modifications were unnecessary. You've made Arial out of a perfectly good Helvetica.</p>
      <p>4) I like your choice of Sabon. I wonder if a titling face may introduce some further subtlety. Also, I recognize the L-A is going to give you kerning headaches.</p>
