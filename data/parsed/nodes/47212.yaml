      <p>Origin:</p>
      <p>The Inuktitut syllabary was adapted from the Cree syllabary in the late 19th century by John Horden and E. A. Watkins, missionaries from England. Edmund Peck promoted the use of the syllabary across the Canadian Arctic, and also translated the bible into Inuktitut, and wrote an Eskimo Grammar and an Eskimo-English Dictionary. </p>
      <p>In 1976 the Language Commission of the Inuit Cultural Institute approved approved two standardized writing systems for Inuktitut in Canada: one using the syllabary and the other using the Latin alphabet. </p>
      <p><a href="http://www.fontco.com/info02/arjowigginsinuit.php" title="http://www.fontco.com/info02/arjowigginsinuit.php">http://www.fontco.com/info02/arjowigginsinuit.php</a> is based on The Inuktitut syllabary, cree. I used Bauhaus93 as a way of a rough idea.</p>
      <p>I love to do a little research behind cultural artwork pertaining to typography. You can usually find something interesting.</p>
