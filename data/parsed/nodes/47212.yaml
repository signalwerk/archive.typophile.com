    <p>I took a first stab at the design <a class="freelinking external link-kept" href="/node/44613/" rel="nofollow">here</a>.  Upon visiting the Pacific Northwest, and going whale watching myself, I was inspired by the Native American woodworking designs of the orca whale.  These designs are used in Native American woodcraft, including totem poles.  I think that the orca works well, since it is one of the species that passes along the California coast up to Canada.  I think that the Native American inspiration works well along the lines of sustainability.  Also, I think the designs are wicked cool.</p>
