      <p>@vintagesignman: I don't think your idea about the Innuit syllabary-inspired font is necessarily a bad idea, althought I'm not going with it for two reasons: </p>
      <p>(1) A design completely inspired by Native American forms would not fit the client; he appreciates Native American designs, yet he is of European decent, so a humanist serif fits better in that respect.  Since his shop is as much about selling himself as selling his work, I think that there needs to be some representation of who he is.</p>
      <p>(2) He showed me some letter forms that he has carved into wood, and while they are more mechanical, they have aspects that Sabon matches, such as the crossed middle strokes of the 'W'.  Carving these letters into wood, in fact, is part of a traditional cabinetmaker's apprenticeship training.  While no typophile himself (he keeps asking me why we can't use Times New Roman), he at least has experience with interacting with letterforms in wood.</p>
      <p>Another reason I think a humanist serif is a good idea is that humanist faces speak of the earlier days of typeface crafting, just as cabinetmaking draws from deep and long-lasting traditions of crafting furniture.  So both express a parallel sense of Western heritage in the practical arts.</p>
      <p>--<br>
      Nick Hladek</p>
