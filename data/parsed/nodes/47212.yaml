      <p>@litera: In the interim, I've come around to the circular one.  Good point about its balance and stability.  Also, I may experiment with the sizes of the two animals a little more, although the client is wanting the project done, and is satisfied up until this point.</p>
      <p>@KenBessie: I'm glad you liked the original best, although I did need to come to a compromise between authenticity and recognition of form.  As I did more research into the different ways orcas have been rendered in Native American art, I found myself less satisfied with the execution of the original piece.  Also, the kerning issue is still before me.  Any suggestions or pointers to help out with this L-A dilemma?  (Too bad his name isn't spelled, "WHELEN"!)  Also, any suggestions on your part for a titling font?  I'm pretty set on Sabon, but could be coaxed...</p>
      <p>Also, regarding those people who think that Native American art may be a bad starting point of inspiration, I pose this question: are the art forms of particular people groups privileged with regard to their usage?  What would be wrong with a Native American person drawing on Western European art for a logo?  What would limit Western Europeans from getting inspiration from Native American art?</p>
      <p>The concepts that the client wanted expressed were: natural, sustainable, traditional craft, handmade, custom designed, etc.  Plus, the client personally appreciates both whales and Native American art.  Therefore, I stand by my design as a reasonable expression of these concepts.  I am most willing to engage in more dialogue to understand if I may be missing something, of course.</p>
      <p>--<br>
      Nick Hladek</p>
