      <p>David, I think you've missed the essential beauty of that "y."<br>
      You've picked up the strong diagonals in your collage, but negate the contrast of it's gentle teardrop descender. </p>
      <p>You have no "curves"... it could have been "v marks the spot"... if you chose the "y" then explore it's unique shape. Just a suggestion.</p>
      <p>But have fun, it's the only way you can tease beautiful accidents.</p>
