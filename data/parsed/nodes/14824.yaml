      <p>I agree with it being top heavy. I'd make the tag line "y marks the spot" more prominent by modifying you layout: try playing with the darher letters converging towards the white area that contains the tag line.<br>
      Also, maybe consider making it a bit rougher and dirtier in texture. You could add some transparency to the letters to give it some colour differentiation, thus building up the texture that you have going there.<br>
      Try to play with the concept that the text is bringing to it: If y marks the spot, what is the spot it is marking?<br>
      Enjoy!</p>
