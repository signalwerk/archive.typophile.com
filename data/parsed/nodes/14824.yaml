    <p>Hey guys/girls, I had a little bit of extra time tonight and this is what became of it. Purely a collage of a lower case Didot Bold 'y'. Maybe I was thinking about Pirates of the Caribbean that I watched earlier, not really sure. Opinions? Throw it out? Keep it? I kind of like it...but what do you think? It was kind of random so either way it's all good.</p>
    <p>My only feeling is that it might be a tad top heavy, I'm thinking maybe to add a few y's in the bottom left corner (black) to give some more movement to it. Maybe even move the title down there?</p>
    <p>Sometimes I do random stuff like this with no real intent and I like to see what others think because as 'art' it's hard for me to critique myself.</p>
    <p>Thanks.</p>
    <p>-Dave</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/ymarks.png" width="548" height="835" alt="">
