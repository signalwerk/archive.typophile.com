    <p>hey, i am looking for a sans and a serif that go well together in a CV.</p>
    <p>in <a href="http://typophile.com/node/31800" title="http://typophile.com/node/31800">http://typophile.com/node/31800</a> , there is a pic of a great CV, and I designed mine accordingly. but I do not own freight, nor do I own any other font package that includes a sans and a serif designed to go together.</p>
    <p>I tried Avenir for headlines with minion pro for body which was nice, but now I am looking for other possibilities.</p>
    <p>Arial Narrow with Baskerville? I know I am supposed to despise Arial, but it is combined like this in a pages template (apple software...)</p>
    <p>Myriad with Garamond (both Adobe, both Apple typefaces)? I don't like Myriad in a CV, it is too... soft?</p>
    <p>What do you think?</p>
    <p>Many thanks for your opinion in advance, this is my first post ever!</p>
