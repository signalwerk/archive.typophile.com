    votes: null
    html: "<p>Hey, a word of design advice: merely talking about possibilities before you've attempted to flush out ideas as part of your process is not as effective as you might think. Create some pairs you think might work well together, put them on a page with other pairings, and heck, if nothing really strikes your fancy do some sketches and create your own faces to better match what effect you have in mind. It's a lot like thumbnailing tons of ideas and picking out the few that are potential winners. Just asking other designers what works better before you've actually attempted anything doesn't allow you, as designer, to see things as they appear to you and then draw from your intuition and experiences. You can't learn and grow without jumping into the fire and figuring out for yourself what works and what doesn't.</p>"
    html_clean: "<p>Hey, a word of design advice: merely talking about possibilities before you've attempted to flush out ideas as part of your process is not as effective as you might think. Create some pairs you think might work well together, put them on a page with other pairings, and heck, if nothing really strikes your fancy do some sketches and create your own faces to better match what effect you have in mind. It's a lot like thumbnailing tons of ideas and picking out the few that are potential winners. Just asking other designers what works better before you've actually attempted anything doesn't allow you, as designer, to see things as they appear to you and then draw from your intuition and experiences. You can't learn and grow without jumping into the fire and figuring out for yourself what works and what doesn't.</p>"
