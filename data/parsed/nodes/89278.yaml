    html: |-
      <p>I think one of the major "cons" of the ATypI conference is its cost. That coupled with its being held in the beginning of the Fall Semester makes it impossible for many North Americans who do some teaching to attend.</p>
      <p>In the past TypeCon has suffered from a hobbiest v professional split personality. This last one in New Orleans finally threw that off and was an important professional event, that I enjoyed.</p>
