    html: <p>You are right Yves, Type O Tones has nice fonts, and it is not script but <a href="http://www.type-o-tones.com/p_fonts/p_adeli.htm" target="_top">Adelita Ole</a> will also make a nice headline, specially if you color the balls ... (I did that once for a Kids story book with a very similar font I had to do myself, I was not aware then of the online foundries, not even the spanish ones!) <br></p>
