    html: <p>If you are looking for something that looks like the writing of children, I have many samples of fonts <a href="http://bowfinprintworks.com/Script12Pg1.html" target="_blank"> in the Script Font ID Guide, Part 12</a>. If you see some that you like, you can find who sells them by using the supplier codes in the <a href="http://bowfinprintworks.com/ListPages/ScriptListAB.html" target="_blank"> Font Reference List </a>. <br> <br>(see Oscar, I learn quickly!)</p>
