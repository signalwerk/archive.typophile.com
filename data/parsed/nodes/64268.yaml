    html: |-
      <p>Hrant, I agree. Spiekermann really nailed the deficiencies of Helvetica. And Michael Bierut did a wonderful job of explaining its strength and why it was a great success when it came out. </p>
      <p>Paula Sher's wild exaggeration made clear why some designers have come to have a revulsion for Helvetica, and I found that delightful. </p>
      <p>Her point was not to communicate the technical truth, as Spiekermann did, but the negative emotional connotations that have grown up because of the way Helvetica has been used, and its ubiquity, as well as its original design.</p>
    html_clean: |-
