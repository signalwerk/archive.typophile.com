    <p>Ok, first off, I have to say I really don't care much for Serpentine (<a href="http://www.linotype.com/1465/serpentine-family.html" title="http://www.linotype.com/1465/serpentine-family.html">http://www.linotype.com/1465/serpentine-family.html</a>), but the client's logo (which uses it) WILL NOT BE MODIFIED (the clients words, not mine). And we have to find a typeface that 'goes well with it'.</p>
    <p>We've been looking for a while, but nothing has seemed right. Any suggestions?</p>
    <p>Thanks in advance!</p>
