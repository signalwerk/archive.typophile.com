    <p>FOR IMMEDIATE RELEASE</p>
    <p>LONDON (Reuters) — In response to grassroots outrage against the lowercase "t" in the <a href="http://en.wikipedia.org/wiki/ITC_Avant_Garde" rel="nofollow">Avant Garde type-font</a>, the Coexist Foundation (<a href="http://www.coexistfoundation.net" title="www.coexistfoundation.net">www.coexistfoundation.net</a>) has launched a competition to amend two letters in said type-font, in order to promote better understanding between Jews, Christians, Muslims, Christians and Jews.</p>
    <p>According to Isabella Ward of the Coexist Foundation:<br>
    • Competition entrants may replace any two letters with a crescent and a Star of David, in both lowercase and uppercase forms.<br>
    • The letter "K"/"k" however must be left intact.<br>
    • In the further spirit of fairness the uppercase "T" must be modified to have the vertical element project above the horizontal element.<br>
    • In the Italic styles the "T", "t" and new letter shapes must remain upright, in order to avoid a skewed view of religion.<br>
    • No shapes from the tainted type-font Bookshelf Symbol 7 may be re-used.<br>
    • Consultation with Herb Lubalin is optional but encouraged.<br>
    • The competition entry fee is in the form of a modest tithe of 10% of year 2012 income.<br>
    • The winner of the competition will be awarded 10,000 blessings.</p>
    <p>The Coexist Foundation competition has attracted controversy however. Type-font designer Matthew Margarinck has voiced his opposition to "spec work", the practice of providing servicing with no guarantee of compensation. Margarinck states: "Although it is unfortunate that Avant Garde exhibits a provocative Christian cross where the second-most-frequent English letter should reside, it remains that speculation is contrary to all major religions.”</p>
    <p>However no controversy has arisen concerning any possible impact on the legibility of the resultant type-font. According to attorney Nick Femurr this is because Avant Garde is already impossible to read.</p>
    <p>In order to facilitate submissions to the competition, the Coexist Foundation has produced a “before &amp; after” sample showing one possible approach:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/abrilmeg_6073.gif"></div><p></p>
    <p>Representatives from Hinduism, Buddhism, Sikhism, Baha'i, Shinto, Jainism and Zoroastrianism were unavailable for comment.</p>
    <p>hsp</p>
