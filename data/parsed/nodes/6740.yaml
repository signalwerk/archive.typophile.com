    html: <p>- Try increasing the mi spacing combo. <br>- The right leg of the m needs more weight. <br>- Maybe a subtle little flat rectangular dot on the i (not far off the stem). It would clear up that sequence and wouldn't hurt legibility on the m the other way. <br>- The tricky part is the JA LY. Try adding a small flourish on the tail of your y moving right. It would add the left stroke on the top of the J and solve the d confusion. Scotts suggestion could work too. <br>- Try the Ja connector at a little more of an angle and slightly thicker. It will help the y. <br>- Your EM is genius. Get the bars on the e parallel, or as much as you can. The M will survive. <br> <br>Bravo</p>
