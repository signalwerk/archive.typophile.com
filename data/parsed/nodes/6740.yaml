    html: <p>I can tell you from experience that differentiating the <b>i</b> is important. "Samuely" still pops out at me. I would shear the top of the <b>i</b> at about 20 degrees, which also would only help the <b>m</b>. <br> <br>If possible, reverse one of the title pairs to position the slashes symmetrically. In fact, what I would do is divide the words with a round black bullet instead, and position it to serve at the dot of the <b>i</b>.</p>
