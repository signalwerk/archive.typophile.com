    html: <p>Wow - that is cool! It makes my brain hurt trying to think of all the ways to create ambigrams.  <br> <br>Incidentally - which came first the letterform or the word? Did you seek to create a letterform for the word Jamiely or discover the word in playing around. I'm not sure if Jamiely means anything as it hasn't really been a part of this discussion, but now that it looks like it is a logo and not just an exercise in ambigram it might be a question worth exploring. what will Jamiely mean to consumers. Other than the coolness of being able to turn it over and it say the same thing - although that is totally cool (I have always been fond of xpedx's logo) <br> <br>Could you perhaps shorten the I (middle stroke of the m) to add a slight bit of differentiation in that row of vertical strokes - it might help the eye find the letters a little easier. Without actually trying it, some guesses would be a dot above the I/under the middle m, or perhaps a curved tapering that would mirror the curve of the third leg of the m, but in the opposite direction - ending in a point. <br> <br>I agree with Scott that the J/Y could possibly be straightened a bit to avoid confusion. <br> <br>I think, however, the straight line of the two descriptors makes the ambigram nature of the logo more obvious to people at first glance. For some reason I don't have anyproblem reading the upside down type, and it shows kindof a two-face side to your work (not in the bad way) but that you wear the creative hat or the technical hat.</p>
