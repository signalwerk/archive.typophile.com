    <p>I would like to ask, how much would i charge for designing a book by project (not by per hour). Charging by per hour are just minor changes. We cant keep track by charging the whole idea and design by per hour nor by per page. The book size is 280(h)x280(w)mm and pagination from  200-250pgs with hard cover. </p>
    <p>Content for Quotation:<br>
    1. Proposal on Concept Approach<br>
    2. Consultation on Concept<br>
    3. Design layout typography<br>
    4. Scan, photoshop, Illustrations/tracings graphics, search for stock images<br>
    5. Content Editing / Proofreading</p>
    <p>Please do let me know if i missed out anything or whats the best idea.<br>
    Thank you for sharing your knowledge and experience.</p>
    <p>regards,<br>
    Martin</p>
