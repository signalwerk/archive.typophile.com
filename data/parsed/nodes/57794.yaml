    html: <p>Nadine, I think the quantitative approach is a reasonable one to take to the results of the technology, but the labels are problematic. Since the technical simplification applied in Yakout isn't limited to styles that evoke naskh in their stroke construction, I'd be inclined to call this ‘Simplified Arabic’, rather than Simplified Naskh. And the label ‘Traditional’ doesn't seem to me to fit with the four-shape model, since there isn't a single traditional style in which this is the case. So perhaps, taking a purely technical view of this model, we might call this ‘Basic Arabic’, in that it corresponds to the common, and Unicode, description of Arabic dual- and right-joining forms. Following this approach, I would probably call the DecoType Naskh something like ‘Analytical Arabic’ or ‘Grammatical Arabic’ in that it seeks to capture the full set of rules that governs a particular style of the script. This suggests a fourth category of hybrid fonts that build on top of Basic Arabic but either do not attempt to capture the full rule-set of a style or fail to do so. I would call these ‘Synthetic Arabic’; the Microsoft Arabic Typesetting font would be an example.</p>
