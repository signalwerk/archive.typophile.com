      <p>And what category would be Arabic Tahoma? The most viewed Arabic typeface on the planet?<br>
      Many languages of Arabic script don't even have the meager luxury of choosing between few fonts. They have to use Tahoma that covers them all. And also because it sustains best the poor visual rendition of the text in small size on PC screens, for their lack of antialiasing.<br>
      This is not about elitism. It's the foundation of a culture that is at stake. A culture that has Siaah Mashgh (black draft) which is a textual composition that isn't even meant to be read. Just to be looked at.<br>
      Now I am certainly not suggesting that Arabic typography should address such art forms. They should remain in creative hands of artists. What I'm suggesting is that a culture, with such high value for textual design, should not and will not be reduced to Tahoma, which has effectively numbed the sense of aesthetics of a whole generation.</p>
