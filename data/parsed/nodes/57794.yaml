      <p>Nadine wrote:</p>
      <p>&gt;&gt;The Latinization going on within Arabic branding and advertising design is &gt;&gt;deplorable, and the results hideous. But at the same time, we need not be afraid to &gt;&gt;play a little bit. The most important is to have a deep understanding and &gt;&gt;appreciation for the script, its various styles, and the basic concepts of type &gt;&gt;design.</p>
      <p>What is even more damaging is the scandalous and well orchestrated and organized trend allowed by the rich Persian/Arab Gulf Arabs to practically force the next generations to abandon the Arabic language. The Turks dumped the Arabic script but kept their language, some Arab countries abandoned both their scripts and Language, but these oil shaikhs want to dump the language but keep the script! I can not understand this Bizarre behavior! I am not sure how (for example) customers would read a restaurant menu which writes فش فلليت or فاملي باك (for "fish fillet" and "family pack") instead of شريحة سمك or وجبة عائلية. </p>
      <p>Bahnam wrote:</p>
      <p>&gt;&gt;I sent the link of this thread to a calligrapher friend of mine. He said it’s like &gt;&gt;our archaeologic treasures. We have to rely on westerners to discover and introduce &gt;&gt;us better to our history.</p>
      <p>The Muslim civilization re-introduced the Greek civilization back to sleeping Europe which was the enabling condition for the western renaissance. The Indians re-introduced the number Zero, invented originally and utilized heavily by the Mesopotamian Sumerians, back to Mesopotamia under the Muslims. This seems to be the nature course of the rise and fall of civilizations. </p>
      <p>However, to passively rely on westerners to discover and introduce our past is bad. In my latest published article/study regarding the history of the Arabic script, I had to re-read in depth three heavily cited Arabic Nabataean inscriptions. al-Namarah, the most important one of the three was claimed by French Archaeologist Dusad, in 1902, to be the epitaph of King Umru' al-Qays bin Amru. My article (<a href="http://arabetics.com/more/History_of_the_Arabic_Script_article.htm" title="http://arabetics.com/more/History_of_the_Arabic_Script_article.htm">http://arabetics.com/more/History_of_the_Arabic_Script_article.htm</a>) points out that his reading was fundamentally wrong. The details of my findings will appear in a second following in depth study that will be published next fall.</p>
      <p>-Saad</p>
