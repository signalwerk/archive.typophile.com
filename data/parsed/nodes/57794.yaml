      <p>Further to what Tom has written -- with which I completely agree -- the collapse of Arabic typography into a horizontal line of minimal shape variants has resulted in attempts at typeface classification based upon only superficial similarities to calligraphic styles. Hence, we get classifications like 'Neo-Naskh' and 'Neo-Kufi' that distinguish the kind of shapes and details one sees in the letters while ignoring the fact that they are implemented with identical mechanical models that bear no relationship to the distinct grammars of the styles whose names they borrow.</p>
      <p>Latin typography happened to develop during a period when the contemporary formal manuscript hands involved relatively little interaction between letters, and the principle typographic styles derived from those models further reduced this interaction until ‘ligatures’ became only very occasional exceptions to the sequential arrangement of individual letters in a line. But these are not the only models of Latin writing, nor are they the only ones to be represented in type, nor are they the ‘end of the line’, the peak of evolutionary adaptation: scribes before and since have invented new ways of writing. There are styles of Latin writing that have grammars as complex as Arabic naskh, grammars that determine what forms of letters connect to what other forms, what kinds of connection are forbidden, how to disambiguate similar letters, etc. When these styles have been reduced to typography, they have tended to be simplified for mechanical purposes: a typeface like 'Shelley Allegro' is to the 18th century roundhand of George Shelley what a 'neo-naskh' is to real naskh.</p>
      <p>Today, we have technologies that allow us to much more accurately capture the grammar of a script style in typographic form. This suggests to me new systems of classification based on structural analysis rather than on superficial details.</p>
      <p>But see also <a href="http://typophile.com/node/9757" title="http://typophile.com/node/9757">http://typophile.com/node/9757</a> for more general opinions on typographic classification schemes.</p>
