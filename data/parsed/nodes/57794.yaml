      <p>&gt; He said it’s like our archaeologic treasures. We have to rely on westerners to discover and introduce us better to our history.</p>
      <p>I think there is enough appreciation and understanding of the calligraphic legacy within the Arab/Muslim world. The problem lies in the divide between those who have a full understanding of the aesthetics and mechanism of the script, and current technology. </p>
      <p>What Arabic typography needs is a vision of how the script interacts within the realms of visual communication today, independent of technical constraints. Between ACE and OpenType, we designers can focus more on the design: what we actually *want* to design, rather than what current technology will allow us to.</p>
      <p>The Latinization going on within Arabic branding and advertising design is deplorable, and the results hideous. But at the same time, we need not be afraid to play a little bit. The most important is to have a deep understanding and appreciation for the script, its various styles, and the basic concepts of type design.</p>
      <p>Whether we love or hate the body of work available today, we still need to be able to classify it. For my PhD studies, I refer to Simplified Naskh (as developed by Linotype in the 50's and usually characterized by Yakout) which mostly has 2 contextual forms per character, Traditional Naskh which has 4 forms and a number of ligatures (good example is Lotus), and Calligraphic Naskh with multiple dynamic forms such as Decotype Naskh powered by Tasmeem. </p>
      <p>This is very basic classification based on a quantitative approach. It can be further developed of course. This approach does not have a judgmental aspect to it so it does not try to elevate one style over the other. It merely counts the variants.</p>
