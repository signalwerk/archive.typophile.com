      <p>Benham: <em>And what category would be Arabic Tahoma? The most viewed Arabic typeface on the planet?</em></p>
      <p>From a variant-quantitive perspective, this is Basic Arabic, and a good demonstration that this classification system deliberately avoids distinguishing design styles. A secondary classification system describing styles can be appended. So you have a two-part descriptor: one for the methodology of the technical implementation and one for the style of letter. I suspect the French terminology for Latin types adapts better to Arabic than the English terminology, which is too much concerned with the presence of absence of serifs. Hence, Tahoma might be called something like Basic Lineal.</p>
      <p>Nadine: <em>For Traditional Naskh, my reasoning was that this 4-form analysis was the traditional typographic approach to rendering Naskh.</em></p>
      <p>But was it? It is certainly the mechanical typographic approach, but the evidence of Analytical Arabic implementations in handset metal type originating in the Ottoman context can't be ignored. This is why I think the term Traditional is inappropriate: the typographic tradition is too diverse for this to be a useful term.</p>
