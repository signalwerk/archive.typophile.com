      <p>John, you raise good points. The terms I mentioned were specifically focused on analyzing the body of existing Naskh typographic styles. This is why I use modifiers for the term Naskh. You are right to note though that this approach could fit other styles too. For Traditional Naskh, my reasoning was that this 4-form analysis was the traditional typographic approach to rendering Naskh. I have also noticed that Fiona used that term in the Lotus font description. So, the "traditional" is referring to typographic history and not the calligraphic one. For the Calligraphic, both "grammatical" and "analytical" are viable options. I'm not very happy with the term "calligraphic" as it seems to refer to the design and not the construction method.  I'm thinking the term "dynamic" might be better. Thankfully I have some time before I have to decide!</p>
      <p>You are right regarding the 4th category. The OpenType features add sophistication which is not there in the first 2 categories. It's sort of Traditional+ since it still maintains the 4 forms as the basic analytical approach.</p>
