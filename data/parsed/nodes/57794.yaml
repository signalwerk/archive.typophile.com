      <p>The traditional Arabic calligraphic classification (shesh qalam) is not at all analagous to the Latin typographic one. </p>
      <p>Many of the Islamic calligraphic styles do not even survive in mechanized, typographic form. Surprisingly, perhaps, Kufi is among them. Typefaces that are sold as Kufi today do not have the characteristics of early Arabic. At best they can be described as nostalgic artist's impressions on the basis of simplified Arabic.</p>
      <p>Early European attempts to produce Arabic typography, seen from a Middle Eastern, i.e., a user's perspective, have no relevance for the development of mechanized Arabic script. The reason is that 1. the designers cross-bred between the classic styles en 2. had no knowledge of the "script grammar". As a result, no such European design ever gained acceptance in the Middle East (with the possible exception of some Christian evangelist communities).</p>
      <p>From the great calligraphic styles only Nastaliq, Ruq`ah, Thulth saw 19th century Middle Eastern typographic adaptations, but they are all extinct now (although there are some great computer-aided revivals produced in Iran and Pakistan). It was local Naskh typography that provided the point from where all modern Arabic typography derives - that's why the traditional calligraphic classification plays no role.</p>
      <p>The 20th century Western industrial approach to Arabic, however, has hi-jacked practically all the Naskh-based developments. The western design focus was and still is "simplification", a euphemism for imposing Latin-based criteria without even bothering to figure out why Middle Eastern users do not consider their own script "complicated". </p>
      <p>The latest development in this trend is to abandon Arabic characteristics all together and base the shapes completely on Latin typefaces, according to the professed ideal of certain Western-educated Arab designers.</p>
      <p>Once that revolutionary process is completed - it may require more than just another troop surge - anyone can classify Arabic typography completely with Latin-based categories: Arabic Blackletter, Arabic Glyphic, Arabic Neo-Grotesque.</p>
      <p>In the mean time, all this doesn't answer the question about true classification of Arabic typography. The truth is, it's not yet been done.</p>
      <p>One prerequisite is, imho, a thorough understanding of Arabic "script grammar", the exhaustive analysis and description of the traditional contextual shaping system, something that I hope to contribute to. It will help to define the difference between locally produced "grammatically" consistent typography, and foreign imports, usually much less informed random collections of ligatures.</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
