      <p>I guess what I'm saying is that 'traditional' is too loaded a term for what is, after all, a mechanically-derived -- not culturally-derived -- model.</p>
      <p><em>I’m not so sure about the term Basic for the 4-form category. It implies that this is the minimum requirement though that would be the Simplified.</em></p>
      <p>I don't see it that way. 'Simplified' implies something simpler than basic. I use basic in your second sense of 'serving as a base or starting point'. From that starting point, you can move up -- to synthetic or analytic models -- or down to simplified models. 'Basic Arabic' is what is captured in Linotype Arabic Norm 1.</p>
    html_clean: |-
      <p>I guess what I'm saying is that 'traditional' is too loaded a term for what is, after all, a mechanically-derived -- not culturally-derived -- model.</p>
      <p><em>I’m not so sure about the term Basic for the 4-form category. It implies that this is the minimum requirement though that would be the Simplified.</em></p>
      <p>I don't see it that way. 'Simplified' implies something simpler than basic. I use basic in your second sense of 'serving as a base or starting point'. From that starting point, you can move up -- to synthetic or analytic models -- or down to simplified models. 'Basic Arabic' is what is captured in Linotype Arabic Norm 1.</p>
