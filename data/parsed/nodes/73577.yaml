    <p>Hey everyone!</p>
    <p>I'm back with a new question about typography. I recently ran into an offer at my local Apple store wich offers the massive Adobe Font Folio collection for 400 bucks (360 €) till the 31 of August. I was thinking of making the purchase as it really is a massive cut to the price tag but here's the question : is it worth it? What do you think of Adobe fonts and this package in general? Do you think I should go for it?</p>
    <p>Tell me your opinions freely,<br>
    Pierluigi</p>
