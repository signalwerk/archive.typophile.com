    html: <p>Irony de jour is the font named both after a guy named after a small plot of land tended by little Franks, (not the wee wieners you get at cheap cocktail parties), and their ancient rivals, de Goths, with whom they fought almost continuously for all the centuries they coexisted in the west— you might better name a font Yankees Red Sox, Bush Bin Laden or Microsoft Europa ;) And, from my reading of history, the fact that the Goths never settled down to become good Romans is precisely why we know and have so little evidence of them, their name is associated with barbarism, compared to, Burgundians, Lombards and especially Franks, who did become Romananized, Holy even, and to this day Palatino and Franklin should not be used together.</p>
