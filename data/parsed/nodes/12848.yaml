      <p>Dan is closest to the mark, I think. The OED gives one definition of 'gothic' as:</p>
      <p><em>4. Barbarous, rude, uncouth, unpolished, in bad taste.</em></p>
      <p>citing as the earliest used in English literature:</p>
      <p><em>1695. Dryden. 'All that has nothing of the Ancient gust is call'd a barbarous or Gothique manner.'</em></p>
      <p>This usage was certainly well established -- and reinforced by the prejudices of neo-classicism -- by the time the first sans serif types appeared in the early 19th century. Later in that century, of course, there was a Gothic revival in art and architecture in Britain, which found its typographic expression in the works of the Kelmscott, Vale, etc. presses.</p>
