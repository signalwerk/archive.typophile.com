      <p>Blackletter is related to Gothic architecture in style and date, Gothic is more reflective of the Industrial Revolution. However the compact OED gives this definition, see point 4, however point 3 could be more reflective of early sans serifs, I don't have access to the OED so I can't give the etymology.<br>
      Gothic<br>
      • adjective 1 relating to the ancient Goths or their extinct language. 2 of the style of architecture prevalent in western Europe in the 12th-16th centuries, characterized by pointed arches and elaborate tracery. 3 portentously gloomy or horrifying. 4 (of lettering) derived from the angular style of handwriting with broad vertical downstrokes used in medieval western Europe.<br>
      Tim</p>
