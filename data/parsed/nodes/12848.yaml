    html: '<p>An interesting comment on this subject is offered by JamesMosley in his essay “The Nymph and the Grot: The revival of the sanserif letter” (London: Friends of the St. Bride Printing Library, 1999). That essay, first published in 1965 (<em>Typographica</em>, new series, no. 12, London: Lund Humphries, 1965, pp.2–19) was reissued in connection with the exhibition <a href="http://www.stbride.org/soanepr.htm" rel="nofollow"><em>Primitive Types</em></a> (29 January – 24 April 1999) organised by The Friends of The St. Bride Printing Library in association with Sir John Soane’s Museum. Sir John Soane’s revival of sans-serif (1816) most curiously coincides with the apparition of the well-known “Egyptian” type in the specimen book of William Caslon IV.</p>'
