      <p>According to the New Oxford American Dictionary, <em>gothic</em> at one time meant "not classical," i.e., not Greek or Roman.</p>
      <p>The term was/is used mainly by American type founders. Besides the German "grotesk" there is also the British "grotesque" and the French "antique" designations for the style.</p>
