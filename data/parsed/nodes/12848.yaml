      <p>Maybe it has something derrogatory to it? "Gothic" architecture wasn't called gothic in th Middle Ages, rather "The New Style" or "The French Style" or even sometimes "The International Style." During the Renaissance, it because known as gothic after it was surpased by the Italian classicist revival… the "goths" had destroyed the Roman Empire, i.e., all that was true and good in architecture for the Renaissance Italians. Therefore, medieval architecture was Gothic (barbarian), while their new style was "true to the roots," so to speak.</p>
      <p>Sans Serifs first appeared in the 1800s. The Gothic style of architecture was undergoing an international revival during this time. Maybe type people of the day called those sans serifs "gothics" because they didn't like them (the German term for this style of sans serif is Grotesk, which seems to imply that people must have, at one point, found them "grotesque").</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
