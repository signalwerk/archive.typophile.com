      <p>I hope you’ve thoroughly read <em>Making dictionaries: Preserving indigenous languages of the Americas</em>, William Frawley, Kenneth C. Hill, &amp; Pamela Munro, eds., 2002, University of California Press, ISBN 0520229967. That text addresses more of the content and structure of dictionary design for indigenous languages than it does the form, but there is some discussion of form in there.</p>
      <p>For dictionary design, my professors have recommended simply studying the dictionaries of many other languages and getting a feel for what works well and what doesn’t. Also, especially in your case, you should examine the design of other Eskimo-Aleut and Paleosiberian dictionaries because those families present some difficult problems in dealing with long polysynthetic headwords.</p>
      <p>I heartily recommend giving the Elbert &amp; Pukui dictionary of Hawaiian a good look, it’s a great example of a very usable dictionary for an indigenous language. Also see Robert Young’s dictionary of Navajo.</p>
      <p>If it’s possible, include citations for all of the examples you give that are from already published or archived sources. This makes it much easier for other linguists who need to study the context in which things are uttered, or who want additional information.</p>
      <p>If you’ve already got a grammar published, include references to it for all the function words and morphemes in your dictionary. <em>Do not omit function words in the dictionary</em> – a dictionary is the first place people look for answers, and being alphabetically organized it also serves as an index for grammar forms.</p>
      <p>And an absolute must is ensuring that you have good fonts with consistent representation of the diacritics you need. Make sure that uppercase diacritics are handled well too, this is often overlooked by English speaking linguists who are diacritic-illiterate. Avoid a profusion of different fonts, instead stick to one serif face with relatively short ascenders and descenders and with a good companion italic, and then a fairly strong sans serif for the headwords. Avoid lots of fancy symbols like arrows, daggers, and the like; instead use “standard” dictionary abbreviations like “q.v.”, “cf.”, “arch.”, etc. Include a list of all the abbreviations you use at the beginning of the dictionary. When you’re giving a form of a headword that has an extended context, don’t repeat the headword but instead use a long swung dash (like a stretched out and centered tilde). You may need to add this glyph to your font, but it should be easy to create.</p>
      <p>I haven’t had much chance to look at the new Haida dictionary, published by your own ANLC, but from what I saw of it I was fairly impressed. That would probably be a good example to ponder.</p>
      <p>If you can, you should consider using XeTeX and XeLaTeX for compiling the dictionary since it seems like you already have an electronic database which will be used for it. If you can handle learning TeX &amp; LaTeX you’ll find it much easier to deal programmatically with your large collection of data. The XeTeX and XeLaTeX system handles Unicode natively as well as playing nice with fonts installed normally on your computer.</p>
      <p>For the sake of everyone who uses your dictionary, please make sure to include lots of example sentences. An excellent show of example sentences in a dictionary is the Tlingit Verb Dictionary by Naish and Story. You needn’t provide finely detailed morpheme glosses, just as long as the translations are solid.</p>
      <p>One issue you will need to seriously consider is hyphenation. There are no strict rules for hyphenation in Aleut, I suspect. You’ll need to develop some. Is the orthography one-to-one with the phonemes, or are there things like digraphs? Should you hyphenate only at syllable boundaries, or are there morphemes which cross syllable boundaries that are better candidates for hyphenation? These are some of the questions you’ll need to resolve as early as possible.</p>
      <p>There are lots of other thoughts I have but my wrists are sore from working on my Tlingit grammar... ;-)</p>
