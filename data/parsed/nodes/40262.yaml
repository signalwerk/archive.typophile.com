      <p>Dear Aric,</p>
      <p>I’ve been involved in a large number of dictionary projects together with Peter Matthias Noordzij and Bas Smidt at TEFF. A portfolio of this work can be seen at <a href="http://www.teff.nl/design/portfolio.html" title="http://www.teff.nl/design/portfolio.html">http://www.teff.nl/design/portfolio.html</a>. You will notice that our approach to dictionary design is a pure typographical one, and that we place much emphasis on micro-typography; even the tiniest details in the text are the result of careful considerations. We also have developed custom technology to produce high quality typography in automated layout designs. Quite a lot of these types of books are produced with applications like Adobe Framemaker that are very inflexible from a typographical point of view.</p>
      <p>I am not aware of specific books about dictionary design although many wonderful books have been written about information design which to me are very helpful sources. I can particularly recommend to have a look at the series of books that Edward Tufte wrote on the subject.</p>
      <p>Hope this helps.</p>
