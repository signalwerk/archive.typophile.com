      <p>Aric</p>
      <p>I think your first concern would be to find a font that will incorporate all the possible letterforms you will encounter.</p>
      <p>Secondly, you will want to ensure that you have a number of optically correct small text sizes for a balanced look to the varying elements of the descriptions.</p>
      <p>I've done a dictionary and a work, The Aldine Press (<a href="http://Bielerpressiii.blogspot.com" title="http://Bielerpressiii.blogspot.com">http://Bielerpressiii.blogspot.com</a>), that required descriptive bibliographic entries (over 600 large format pages worth) in the past and that is the very best information I can give you.</p>
      <p>With the appropriate font you have a great advantage typographically; most dictionaries and descriptive bibliographies are rarely considered in this regard.</p>
      <p>Gerald</p>
