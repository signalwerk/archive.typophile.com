      <p>James, Gerald, and James,</p>
      <p>Thanks all three of you for your suggestions and for taking the time to post.</p>
      <p>James P., I stumbled upon the name Paul Luna as a result of your suggestion.  I haven't had much time to find any of his publications, but after the holidays his work will be high on my to-look-at list.  Thanks!</p>
      <p>Gerald, I appreciate the guidelines.</p>
      <p>James C., it's nice to hear from someone else with an interest in indigenous language revitalization.  I agree with your recommendation of <em>Making dictionaries</em>.  It's been invaluable to me.</p>
      <p>I should have been more clear about the nature of my project.  I'm not actually compiling a dictionary; instead, I'm creating a digital version (XML database + GUI) of Knut Bergsland's <em>Aleut Dictionary</em>.  There's definitely room for improvement in his dictionary, especially as far as pedagogical lexicography goes.  But my biggest complaints about the dictionary are the bare-bones English-to-Aleut index, and the complex organizational scheme used to order the Aleut words.  These two things create a lot of difficulty for language learners, and my primary goal is to create a digital version of the dictionary with an interface that mitigates these issues.  Along the way, I hope to address some less critical shortcomings of the paper dictionary, including the dense typesetting, which makes it hard for the user to extract the information they seek.</p>
      <p>I will look for the Elbert and Pukui dictionary.  I've looked at the Young and Morgan dictionary of Navajo; is that the one you recommend, or did Young write another dictionary on his own?  As far as ANLC dictionaries go, I find the Koyukon dictionary quite attractive; the Haida dictionary is not bad either, although the system of using lozenges to represent levels of subentries doesn't work for me.</p>
      <p>I see from your homepage that you have a background in computer science.  If you have any thoughts on the place of technology in language revitalization, I'd be interested to hear them.  Since that subject is quite off-topic for this forum, feel free to send me an e-mail: the domain is uaf dot edu and the address is ftarb2.</p>
