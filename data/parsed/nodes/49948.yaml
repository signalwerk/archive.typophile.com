    <p>Hi, I have a number of questions relating to my build of a font. There seems to be many ways for me to achieve a similar final outcome and I need some advice on the best way forward.</p>
    <p>The display font has no descenders or  ascenders, however some glyphs are based on the forms of l/c letters. For this reason it could be called Unicase, however there will be no Caps version of these ’scaled up l/c glyphs’ and vice versa.</p>
    <p>First of all, I would like the font to display in the same way, regardless of whether the user is working in upper or lowercase - is there a way to achieve this other than repeating the glyphs in both u/c and l/c positions on the key map?</p>
    <p>Secondly, each letter has between 0 and 6 alternate glyphs which I would like to activate through OT functions, however I’m not sure which ones. They could be done as Contextual Alternates, Contextual Ligatures, Discretionary Ligatures or Stylistic sets. Some of the substitutions relate to ’serifs’ not overlapping, whereas some are purely aesthetic options. The font will initially only be used inhouse in AI and ID CS3 on Macs, so perhaps the easiest solution is best for now.</p>
    <p>Any help is greatly appreciated.</p>
