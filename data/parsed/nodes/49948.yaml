      <p>Since the first post, I’ve worked a few things out. </p>
      <p>Although it would be great in the long term, ligatures of any sort would be a nightmare to use right now due the the huge number I would need to create.</p>
      <p>I created some of the alternates as Stylistic Sets which works fine in ID but do not seem directly accessible in AI. I guess I could live with them being accessible through the ’glyphs’ window.</p>
      <p>Anyone know another way?</p>
