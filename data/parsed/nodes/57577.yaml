    html: |-
      <p>I wish that Myriad had a lighter variant too. I might use it more if it did.</p>
      <p>Trajan, although a bit too common for my tastes, is beautiful typeface. All of the Renaissance types like Garamond and Jenson have their uppercases modeled after similar inscriptional styles. As such, try to think of where you would use all caps Garamonds or Jensons, which would usually be in titling.</p>
      <p>If you use Trajan for titles, and Myriad for the body copy, you might have something.</p>
