    <p>My first discussion topic - hope it's in the right place here . . . </p>
    <p>I'm currently working in an environment where Myriad is the face for the organization.</p>
    <p>I'd love to have some advice on applying this face in a university setting.</p>
    <p>It's paired with . . . Trajan. And the alternate fun face is Scriptina.</p>
    <p>I know.</p>
    <p>One of my questions concerning Myriad is, why no extra light or thin? Does anyone know? And can you suggest something that will substitute in that usage?</p>
    <p>And any advice on using Trajan on a day-to-day non-movie-poster basis is always appreciated.</p>
    <p>The bonus question would be whether or not there's an alternate alternates font for Scriptina that contains useful lowercase alternates - you're sensing the time already spent creating these by hand, aren't you?</p>
    <p>Thanks in advance folks.</p>
