    html: |-
      <p><em>...why no extra light or thin?</em></p>
      <p>I can't speak for Adobe, but I do know that Myriad was released (1992) before the general appearance of extra-light weights.<br>
      Although Font Bureau had released hairline styles prior to Interstate Hairline (2000), that font was, IMO, instrumental in popularizing the concept, along, of course, with Neue Helvetica 25 and 35.</p>
      <p>I wrote on the topic in 2001:<br>
      <a href="http://www.shinntype.com/Writing/SeeLight.pdf" title="http://www.shinntype.com/Writing/SeeLight.pdf">http://www.shinntype.com/Writing/SeeLight.pdf</a></p>
    html_clean: |-
