    html: "<p>My own recommendations would be two of Bouwsma's calligraphic faces: <a href=\"http://www.identifont.com/show?5GN\" target=\"_blank\">Mantegna Italic</a> and <a href=\"http://www.identifont.com/show?5I0\" target=\"_blank\">Polenta (formerly Donatello) Black Italic</a>. <br> <br>These were the closest I saw in running through the Calligraphic scripts in <a href=\"http://bowfinprintworks.com/Script04Pg1.html\" target=\"_blank\">Part 4 of the Script Font  ID Guide</a>. Polenta has a lighter weight too.</p>"
    html_clean: "<p>My own recommendations would be two of Bouwsma's calligraphic faces: <a href=\"http://www.identifont.com/show?5GN\" target=\"_blank\" class=\"link-external\">Mantegna Italic</a> and <a href=\"http://www.identifont.com/show?5I0\" target=\"_blank\" class=\"link-external\">Polenta (formerly Donatello) Black Italic</a>. <br> <br>These were the closest I saw in running through the Calligraphic scripts in <a href=\"http://bowfinprintworks.com/Script04Pg1.html\" target=\"_blank\" class=\"link-external\">Part 4 of the Script Font  ID Guide</a>. Polenta has a lighter weight too.</p>"
