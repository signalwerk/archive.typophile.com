    html: "<p>To all: <br> <br>Thanks for the help and the new resources to look at for identifying font faces, I thought I had seen most of them, but I'm not even close! <br> <br>I will take your suggestions and see which flies with the powers that be, and speaking of flying, the dove does look an awful lot like the Dove logo...  I never noticed it before. <br> <br>Philip Bouwsma does good work, I like most of his typefaces. <br> <br>Thanks again</p>"
