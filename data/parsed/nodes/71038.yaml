      <p>1. go to <a href="http://www.geocities.jp/meir000/fontforge/" title="http://www.geocities.jp/meir000/fontforge/">http://www.geocities.jp/meir000/fontforge/</a> , download fontforge-mingw_2010_05_18.zip (ca 13 MB)<br>
      2. unzip it somewere<br>
      3. double click fontforge.bat<br>
      Fontforge has access only to the disk where "somewere" is. It could be even on memory card, no install process is necessary!<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ff1_4017.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/ff_6210.png"></div><br>
      It all took me 12 minutes :)<br>
      Enjoy :-)<p></p>
