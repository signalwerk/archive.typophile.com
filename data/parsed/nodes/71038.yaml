    html: |-
      <p>I also don't speak Japanese. But all you need is download, unzip and use. The unofficial mingw-version is meant to be used easily.</p>
      <p>Some notes:</p>
      <p>1. When Windows Firewall reminds you that it blocks some functionality, you can choose not allow any network access. The problem is this port uses xming, but it doesn't really need any network access.<br>
      2. Perhaps you want to change some line in the bat to<br>
      start /B "" "%FF%\bin\Xming-6.9.0.31\Xming.exe" :9 -xkbmodel pc101 -xkblayout us -multiwindow -clipboard -ac -silent-dup-error<br>
      but I didn't change anything and it works well for me.<br>
      3. It (well, I have only the 200909 version) crashes occasionally. Remember to make backups.</p>
