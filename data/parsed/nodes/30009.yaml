      <p>MissG, I think you're confused about what you're asking for here.</p>
      <p>You'd do better to illustrate it yourself. Years ago an art director commissioned me to do a book cover that looked like the neon lights on the strip in Las Vegas. The following image was part of the result.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bulb-sml_4188.jpg"></div><p></p>
      <p>This is simply Photoshop technique that can be applied to the vector information in any font. I think you can find tutorials about how to do this online. It helps if you're starting with a font that's in keeping with the style, which is why that link to House Industries above that Lari posted is useful, but there's no one font (to my knowledge) that conveys the glow of neon lighting.</p>
