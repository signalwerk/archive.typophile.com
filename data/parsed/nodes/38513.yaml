    html: <p>I remember Brody Neuenschwander talking about being the ’hand double’ for John Gielgud’s Prospero in Peter Greenaway’s <em>Prospero’s Books</em>. Apparently Gielgud had very fine hands, and Brody was embarassed that his own were not as elegant. But his calligraphy was stunning. I remember watching a clip from the beginning of the film during the 1995 ATypI conference in Barcelona, and there was an audible gasp of admiration at the rapid execution of a particularly elegant swash d.</p>
    html_clean: <p>I remember Brody Neuenschwander talking about being the ’hand double’ for John Gielgud’s Prospero in Peter Greenaway’s <em>Prospero’s Books</em>. Apparently Gielgud had very fine hands, and Brody was embarassed that his own were not as elegant. But his calligraphy was stunning. I remember watching a clip from the beginning of the film during the 1995 ATypI conference in Barcelona, and there was an audible gasp of admiration at the rapid execution of a particularly elegant swash d.</p>
