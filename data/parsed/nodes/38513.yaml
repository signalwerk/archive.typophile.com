    <p>In the movie <em>Becoming Jane, </em>a “hand double” is used to do the writing of Jane Austen’s letters.<br>
    Whoever the calligrapher is, it’s absolutely stunning to see a big screen close-up of the writing taking place—the style is spot-on.</p>
