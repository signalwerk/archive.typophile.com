    <p>So I finally got my site issues behind me -- after a couple of years of struggling with ASP, then PHP, I found Ruby on Rails.  It wasn't a smooth relationship at points, but the actual development of the site was a cakewalk.  (Deployment was tough, however.)</p>
    <p><a href="http://www.fontosaurus.com" title="http://www.fontosaurus.com">http://www.fontosaurus.com</a></p>
    <p>Free fonts for now, with the e-commerce functionality following soon!</p>
