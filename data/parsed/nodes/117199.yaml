    html: |-
      <p>The reason might be that a lot of Japanese don’t speak English well. But, I’m not sure.</p>
      <p>Anyway, I don’t recommend Latin fonts Japanese designers designed. Most of them are low-quality.<br>
      Akira Kobayashi who is a Monotype Type Director, Kunihiko Okano who graduated from KABK, and Toshi Omagari who graduated from Reading and works for Monotype UK are, of course, brilliant exceptions. They are great designers.<br>
      And some of the younger designers create high-quality Latin typefaces. (Two Japanese are studying at Reading MA Typeface Design now.)</p>
      <p>I’d say Morisawa and Fontworks, two largest type foundries in Japan, don’t sell their fonts to overseas people. I don’t know why.<br>
      Several Japanese foundries, e.g. Jiyu Kobo, Iwata, TypeProject and Motoya, sell thier fonts at Fonts.com.</p>
