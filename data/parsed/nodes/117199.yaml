      <p>Thanks Akira &amp; Dick. In the absence of any other comments I will put this alphabet in the original design category and credit Masayuki Sata and Mami Kobatyashi. Now for my probably presumptuous comment of the day: This font seems completely unknown outside Japan and will continue to be so as long as its sales are limited to purchasers of a book where most of the fonts are for Japanese use. If the designers want to make some sales to rest of the world they should consider releasing a the Latin letters version of IkahoAL as a stand alone font sold through one or more of the big resellers. In my opinion the design is very competitive with the other big top fun fonts mentioned in my ID request and could be a solid seller.<br>
      Don</p>
