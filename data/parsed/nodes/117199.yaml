    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ikaho2SM_5077.jpg"></div><br>
    I found a Japanese font called Ikaho2 that includes these big top Latin letters and numbers.<br>
    I don't know whether they are an original design or based on an existing font. I looked at Big Top Acrobat, Comedy, Dreamland, Showcard Gothic, Laff Riot NF,   Startling and a couple of other Fun Fonts, but they are different. Any ideas?<br>
    Don<p></p>
