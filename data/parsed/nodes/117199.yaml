    html: |-
      <p>Don - Years ago I used to monitor many websites for new releases of free fonts - including several favororite Japanese websites like Maniackers and <a href="http://www.iai-jp.com/" target="_blank" rel="nofollow">iAi</a> (check out Kivart's font Punition - as well as the wallpapers and artwork).</p>
      <p>Occasionally, on a site like Maniackers, I'd come across a font that I really liked but that was <em>not</em> free. Despite my willingness to pay and try as I might, I could never find any way to pay Western money for these fonts.</p>
      <p>A decade later nothing seems to have changed. In this day and age that seems crazy. Do you know why this is, Akira? Why does Japan seem to be isolated from international sales of fonts?</p>
