  - id: 234582
    user: 19337
    date: 2007-10-21T15:03:00
    date_raw: 21 Oct 2007 — 3:03pm
    votes: null
    html: "<p>I think some of the confusion in the naming of fonts within a family is because some of the terms refer to weight (e.g. light, regular, bold), whereas others I regard more as optical size descriptors (e.g. book, text). When I see a font described as book or text, I expect that it's meant to be used at around 10-12 points in body text. So you could have book (or text) light, book regular, book bold. John Hudson is right: \"roman\" is simply a style descriptor--i.e. bold roman, bold italic. If there is no style descriptor, it's assumed to be roman.</p>"
