    <p>I looked on the wiki and searched, but these are such common terms that I can't pinpoint an answer to what I am sure is a remarkably stupid question:</p>
    <p>if a font comes with both book and roman faces, what is the difference in use intended to be? Is book optimized for a particular size? It appears a bit heavier...</p>
    <p>I'm looking specifically at Didot Elder as an example.</p>
