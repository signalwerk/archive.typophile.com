    date_raw: 21 Oct 2007 — 12:49pm
    votes: null
    html: <p>Using 'roman' to refer to a specific font within a family, e.g. synonymous with regular, seems really dumb to me, since as an adjective it could be legitimately applied to any weight of upright type in the roman style (as distinct from blackletter, civilité, etc.). A 'book' font in this style is just as much roman as any other weight.</p>
