    <p>I'm throwing a house party this weekend and want to make a couple really neat flyers featuring the fonts from my favourite "quality" beers. Pabst and Budweiser.</p>
    <p>Here is what i was wondering if anyone could identify</p>
    <p>1. What font "Pabst" is written in? I know it's probably hand rendered, but does anyone know anything similar?<br>
    2. What font "Blue Ribbon" is.<br>
    3. I like this old style Bud can. Trying to identify the "Budweiser" letters as well as the script text that says.."Brewed by our original..."</p>
    <p>Thanks for any help. I heard you folks are the best at identifying ANY font!?</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Picture%2017_6.png" width="828" height="476" alt="">
