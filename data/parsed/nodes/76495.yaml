    <p>hey, I hve the folowing prblem:<br>
    I made a typeface in which the space  glyph is not just an empty space but instead has an element in it.<br>
    it does get displayed when i write it in indesign for example but not doesnt work in aftereffects.<br>
    In after effects just a blnk appears , also in indesign when i transform letters into paths the element in the space disappears!<br>
    Would be great if anybody would know a solution to  this as i really dont know what to do with this anymore!</p>
