      <p><cite>Isnt it possible to give the space something like a real value so it works just as a regular glyph?</cite></p>
      <p>A space has a "real value." In every font. Think it through. InDesign, for example, lets you modify a character's width (scaling), sidebearings (tracking), etc. Why should a space be different?</p>
      <p>Application programs that don't permit this with all characters still allow it with a space, just as long as they allow justified setting. That's where your complaint about "a value" lies . . . with setting justified copy. And that has nothing to do with the font, it's all the business of the layout program.</p>
      <p><cite>oh and i found a typeface that actually works fine in all programms using an element as blank, but i just cannot figure out why!</cite></p>
      <p>Did you include TeX in "all programs"?</p>
      <p>Edit:</p>
      <p>What is an "aftereffect"?</p>
