    html: |-
      <p>This was discussed a while ago -- perhaps some googling will turn up the thread.</p>
      <p>In the mean time: the space has sort of a special status in typesetting. As remarked in another thread, LaTeX doesn't even <em>have</em> a space "glyph", it calculates the space (in the 2-dimensional meaning) between two characters and 'moves' the rest of the text to the right.</p>
      <p>The older thread discusses the 'meaning' of a dedicated space glyph as well as the repercussions it has on typesetting -- f.i., what should happen if your space should be compressed or expanded to justify a line?</p>
      <p>I think the best solution would be to move the glyph to another character -- any one will do, but you might prefer to have it accessible with a standard keyboard. What standard keyboard character can you do without? Tilde, perhaps?</p>
