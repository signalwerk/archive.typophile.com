      <p>When I had this same problem, I inserted an alternate space glyph in the calt OT feature, like this:</p>
      <p><code>feature calt {<br>
        sub space by space.alt;<br>
      } calt;</code></p>
      <p>The result can be seen <a class="freelinking external" href="http://myfonts.us/aYz0ww" rel="nofollow">here.</a> Make sure you turn on the “Contextual Alternate” mark in the Advanced Typography panel (the ff icon). It works fine in InDesign even when you outline the text since InDesign supports the calt feature, but I am afraid After Effects doesn’t (I don’t work with that software, sorry).</p>
      <p>So if you really need that glyph in After Effects, the best solution can be, as Theunis said, moving this alternate glyph into another, not-so-important slot.</p>
    html_clean: |-
