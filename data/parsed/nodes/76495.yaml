      <p>in my font i have somthing called "BEIN HADVEKIM" where the space is substituted to an alternate glyph.</p>
      <p>In turns out that even though the alternate glyph is displayed, the width does not change, meaning that indesign traets this glyph as a width value glyph and not a glyph he should display.</p>
      <p>in other words, indesign reads the with of the space and uses it in the text level, so even though i substitute the glyph, the value that indesign uses for the text is the original space and not the width of the substituted glyph</p>
