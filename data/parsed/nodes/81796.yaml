    <p><a href="http://www.manystuff.org/wp-content/uploads/2011/04/IMG_3040-copie.JPG" target="_blank" rel="nofollow">Saw this photo this morning and it got me thinking.</a>  Anyone know if there are discretionary ligatures in any opentype versions of Futura?  I'd like to play around with it, but didn't know if such a thing already exists.  I'm pretty sure that those are variations on Futura that they're looking at, but from what I can tell there aren't any pre-existing discretionary ligatures of this kind out there.</p>
    <p>Thanks!</p>
    <p>KC</p>
