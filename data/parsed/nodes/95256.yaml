      <p>If you download <a href="http://rodun.gaggenau.com/en/rodun-ergebnis-interpretation.pdf" rel="nofollow">this pdf</a> and have a close look at the logo using Adobe Illustrator, you get this:</p>
      <p><img src="/files/ugge_5645.png"></p>
      <p>I may be wrong but to me, this looks as if those letters had first been drawn on paper, and then scanned and simply traced out.</p>
