    html: <p>Could be wrong and probably not the kind of answer you're expecting but looks like a mix of fonts. /G and /E are very <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/avant-garde-gothic/" rel="nofollow">Avant-Garde</a> and /A, /N and /U are "à-la-Futura" (the lighter weights). <a class="freelinking external" href="http://www.houseind.com/fonts/neutraface" rel="nofollow">Neutraface Display Titling</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/ealing/" rel="nofollow">Ealing</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/eagle/" rel="nofollow">Eagle</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/durotype/simplo/" rel="nofollow">Simplo</a>, <a class="freelinking external" href="http://www.identifont.com/show?41J" rel="nofollow">CG Gothic no. 3</a> are close for these 3 ones.</p>
    html_clean: <p>Could be wrong and probably not the kind of answer you're expecting but looks like a mix of fonts. /G and /E are very <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/itc/avant-garde-gothic/" rel="nofollow">Avant-Garde</a> and /A, /N and /U are "à-la-Futura" (the lighter weights). <a class="freelinking external link-external" href="http://www.houseind.com/fonts/neutraface" rel="nofollow">Neutraface Display Titling</a>, <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/t26/ealing/" rel="nofollow">Ealing</a>, <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/fontbureau/eagle/" rel="nofollow">Eagle</a>, <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/durotype/simplo/" rel="nofollow">Simplo</a>, <a class="freelinking external link-external" href="http://www.identifont.com/show?41J" rel="nofollow">CG Gothic no. 3</a> are close for these 3 ones.</p>
