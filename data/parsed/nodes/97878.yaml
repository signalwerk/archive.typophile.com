    <p>Can someone please help us find a font that will match:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/font1_5120.png"></div><p></p>
    <p>As you can see there are a lot of  variations in the picture (the only thing we had left was a low-quality picture that I traced using inkscape, this was probably altered by hand at one time)<br>
    The font information has been lost over time and we need a font that will match to create new shirts (we are a theatergroup).  We are looking for an open font that resembles this.</p>
    <p>Thank you!</p>
