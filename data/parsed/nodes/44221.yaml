    <p>Here goes, In a rather brief previous post i explained my situation. Im a 17 year old student that probably makes me quite young to be on his site (or so i imagine), and as i said in other post i needed help on books to read to influence/help me !<br>
    I got 1 reply and followed up on it, and from then i have had a strange sort of faith in this forum and community (brown nosing is over)</p>
    <p><a href="https://web.archive.org/web/20080829235638/http://www.mediafire.com/?32zuxrlz3h6" title="http://www.mediafire.com/?32zuxrlz3h6">http://www.mediafire.com/?32zuxrlz3h6</a></p>
    <p>In the above link is a pdf file to my Final Piece, its meant to be an example of a magazine, based on the likes of GQ and G2 (that rather useless pullout in The Guardian.) It would mean alot to me if any of you could look over this and guide me/tell me how to do better and produce better works, and work more efficiently.</p>
    <p>Also at this time i find it quite fitting to raise the issue of piracy, im not proud but the software i produced my work on was a pirate version of InDesign CS3. Apparently i can be disqualified from my exam for using a pirated version of software ?</p>
    <p>Any help/answers would be greatly appreciated guys.Also at this point id like to point out the text in the ’cars’ pages is lifted and edited. Im not claiming it to be my own. Thanks</p>
    <p> :)</p>
    <p>Also, please remember im only 17. I’m no design pro</p>
