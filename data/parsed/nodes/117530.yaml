  html: <p>The image is from the cover of Polish Playboy magazine 4/2012. By searching the web, the earliest issues showing this typeface I could find were from 2005, thus, the typeface must have been designed in 2005 or earlier.  It looks so familiar, maybe because it's similar to Farnham?</p><div class="imageWrap"><img src="http://typophile.com/files/Playboy_5558.png"></div><p></p>
  html_clean: <p>The image is from the cover of Polish Playboy magazine 4/2012. By searching the web, the earliest issues showing this typeface I could find were from 2005, thus, the typeface must have been designed in 2005 or earlier.  It looks so familiar, maybe because it's similar to Farnham?</p><div class="imageWrap"><img src="http://typophile.com/files/Playboy_5558.png"></div><p></p>
