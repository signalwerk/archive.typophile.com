    html: <p>I miss the Parkway.  <br> <br>They had a great old diner. I spent many Friday nights there,  <br>drinking too much coffee, smoking too many cigarettes and  <br>talking about type with a good friend of mine.  <br> <br>It's long gone now, demolished to make way for the last few  <br>miles of the U.S. Interstate Highway System.  <br> <br>All that's left is Chank's font.</p>
