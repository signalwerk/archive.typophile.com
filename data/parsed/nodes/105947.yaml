    html: |-
      <p>Don't the original name, most probably a proprietary font as almost all MLB team letterings. <a class="freelinking external" href="http://eriqjaffe.50webs.com" rel="nofollow">Eriq Jaffe</a> digitized a version under the name of <a class="freelinking external" href="http://www.ffonts.net/MLB-Block.font" rel="nofollow">MLB Block</a> that should perfectly do the job.<br>
      Alternatives: <a class="freelinking external" href="http://www.houseind.com/fonts/unitedcollection" rel="nofollow">United</a>, <a class="freelinking external" href="http://uppertype.net/fonts/yorker.htm" rel="nofollow">Yorker</a>, <a class="freelinking external" href="http://www.dafont.com/jersey-m54.font" rel="nofollow">Jersey M54</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontasmic/iron-on" rel="nofollow">IronOn</a> Gothic, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/vehicle" rel="nofollow">Vehicle JNL</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/hold-fast-foundry/abolition" rel="nofollow">Abolition</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/hold-fast-foundry/prohibition" rel="nofollow">Prohibition</a> HFF</p>
