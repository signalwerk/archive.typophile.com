    <p>Hi all, </p>
    <p>I’m working on a project where I spaced (with kerning) the caps wider (In classes based on shape) when they stand next to each other. Now my space (Glyph) is too small for in between capitals.</p>
    <p>&gt; Now my question is, what is the quickest/Best way to make the space bigger?</p>
    <p>1 Kern, this means I have to put in a lot of data! Or expand my classes and make a new class?<br>
    2 Replace with space.alt (Never done this, so have no idea how the code will look like)<br>
    3 Spacing the capitals with the kern feature is not smart</p>
    <p>Maybe this is already somewhere explained on the forum, I used the search, but I may don’t know the right jargon.</p>
    <p>Cheers,</p>
    <p>Bruno</p>
