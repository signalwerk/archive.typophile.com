    html: <p>Such spacing should be done by the user of type, not the designer. There are too many situations where it is just wrong. The OpenType spec has a feature that can be used for spacing all cap settings, and InDesign, at least, will use it. It is off by default, but the comp can switch it on. Getting the values right for many standard situations, so all the comp has to do is to switch it on, would be a plus. You might want to include punctuation, but do give it a different (smaller) value. Depending on the fit of the lining numbers, you might want to give them a smaller value too.</p>
