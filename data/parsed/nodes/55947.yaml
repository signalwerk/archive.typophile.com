    html: |-
      <p>I have replaced space by space.case in some OpenType fonts.</p>
      <p>I put it in the "case" feature, so that it works when "all caps' is selected.</p>
      <p>"sub space by space.alt"--where that space.alt is a bit wider than the space character.<br>
      I use space.alt rather than, say, the Unicode one-third em space, so that the text is not altered by the feature.</p>
      <p>My reasoning is to make the look of all caps similar to that of all small caps, which uses the space.<br>
      Also, as a proportion of the cap height, the space is a lot narrower than the proportion it is of x-height, so in some fonts it just looks very, very narrow.</p>
      <p>I rarely use the "cpsp" feature.</p>
