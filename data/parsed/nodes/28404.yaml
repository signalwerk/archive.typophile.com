      <p>The R's in both those suggestions aren't quite the right form. The G, R and C are about the only diagnostic ones in these words.</p>
      <p>I would pick <a href="http://www.myfonts.com/fonts/berthold/formata-bq/cnd/charmap.html" rel="nofollow">Formata Condensed</a>, although I wouldn't be surprised if it was custom designed for the NGS.</p>
      <p>- Mike Yanega</p>
