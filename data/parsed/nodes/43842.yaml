    <div class="info">Submitted by <a href="/web/20080709010813/http://www.typophile.com/user/1334" title="View user profile.">kegler</a> : 3.Apr.2008 5.33am </div>
      <p>A great <a href="https://web.archive.org/web/20080709010813/http://dryden.eastmanhouse.org/program-highlights/a-curious-type-graphic-design-in-film/">film series starts today at the George Eastman House</a>/Dryden Theatre in Rochester.</p>
    <p>George Eastman House Presents: A CURIOUS TYPE: GRAPHIC DESIGN IN FILM - Graphic design is an implicit part of the filmmaking process. It is often so implicit, however, as to become obscured by some of the flashier aspects of movies. For this series, we’re hoping to uncover the elements of graphic design in cinema by exploring artists and examples that exhibit great design.</p>
    <p>April 3rd, 7pm<br>
    7pm: RIT Professor, R. Roger Remington lecture on the Bauhaus Films<br>
    8pm: László Moholy-Nagy &amp; Bauhaus Films (80 min)</p>
    <p>April 10th, 8pm<br>
    British Television Advertising Awards 2007</p>
    <p>April 17th, 8pm<br>
    The Films of Charles &amp; Ray Eames</p>
    <p>April 19th<br>
