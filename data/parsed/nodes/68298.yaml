    <p>Hi,</p>
    <p>I currently use Suitcase Fusion but am a little annoyed with it. I find it difficult to make sure that the correct fonts are activated, especially since I have multiple versions of various fonts. I'm wondering if FontAgent Pro or Font XPlorer are better? What do you all prefer and recommend?</p>
    <p>I'm running Snow Leopard. Thanks!</p>
