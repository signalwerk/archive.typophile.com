      <p>Thanks for your replies. </p>
      <p>To be more specific, I am a graphic designer and my main concern is keeping client's fonts organized in order to be certain that I am using the correct font for the project (since I have multiple versions of fonts with the same name). I also want to be able to meticulously classify and categorize my fonts. I've downloaded FontAgent and am playing around with it, but I'd be curious to hear what works for others.</p>
