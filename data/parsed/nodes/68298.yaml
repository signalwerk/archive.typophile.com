    html: |-
      <p>I'm pretty happy with X-Fonter from Black Sun. I think it's $35.</p>
      <p>I have too many fonts to install, so I keep them in a folder in my documents, divided into many sub-folders. The X-fonter reads, previews, compares, installs and uninstalls quickly. It also displays special effects, but I have not much need for that.</p>
      <p>Awhile back The Font Thing was my favorite and had superior comparison abilities. But it can't read Open Type and I don't think it was ever updated to do so.</p>
