  html: |-
    <p>Looking for folks using Master Juggler. I bought it and was using it happily for a few weeks. Then I tried to install a Mac TrueType file and funkiness ensued. As I'm importing, it checks for errors (which is nice). But for every TrueType font, I get "The PostScript outline file is missing." And subsequently, can't install these fonts. Anyone else run across this?  <br> <br>Secondly, life is fairly SLOW as you scroll through the 'Samples'. I get mad about this.  <br> <br>These are my issues. If I can move beyond these, I can still be happy about buying Master Juggler. Something tells me the slowness in the 'Samples' is something I need to get over, and just live with. </p>
