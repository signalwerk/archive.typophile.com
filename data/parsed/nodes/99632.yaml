    html: "<p>Totally agree with Gräfenberg. It smells \"Univers\" but, as perfectly spotted, some details remain off. But, they could have been the result of some manipulation: slanting, artificially emboldening, edition... As it's for a logo (Osram Sylvania), it would not be surprising it could have been the result of some customization based on Univers. BTW, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/linotype/univers-next/\" rel=\"nofollow\">Univers Next Extra Black</a> is bit closer though not matching.</p>"
