      <p>You guys don't have a clue as to who the font pirates really are. Let me break it down for you. Roughly 6% are actually in the design industry. Mostly coming from 3rd world piss holes like Bolivia or Zimbabwe, and make less than a peso a project. The major bulk are those who download a font, stress on 'A' as in 1, to decorate their Myspace pages with. The last group comprises of about 22%, of the true Font Pirates who collect typefaces like Chuck Davis collects Beanie Babies. These people admire type but only use them in avatars or signatures for their favorite warez forum, or any forum for that matter. And then there's me, less than 1% of the above 22% that also releases just to piss Fontographers off.</p>
      <p>Though there may be some examples as above, there is no grand conspiracy of corporate greed to use your work without compensation. That's just your wishful thinking. A large portion of the faces are bought by pirates for the sole purpose of sharing among other pirates. Only about a quarter are actually extracted from files. And then those end up at a torrent tracker for the Myspace kiddies. The pay is usually distributed among many people. You get 100 people paying $5 for a $500 font its all win/win for everyone.</p>
      <p>You can buy that starving artits bullshit if you want to. Fact is, you're all just tools. Make us these fonts, make them good, and if you no longer make them then you no longer matter. Someone else will gladly pick up where you left off. Many of you don't spend months making fonts. Like Richard Kegler, you just scan public domain books and artwork and copyright the digitizations- claiming the glyph designs as your own original works. A day to run scans through scanfont, a day or 2 to adjust the kerning. Maybe another day to poorly re-create the nonexistent characters like the elipses or tilde. Or you could be like Nick Curtis and crap out 3 to 5 sub-par-yet-original typefaces every month.</p>
      <p>As for the original poster, all you need to do is Google top 10 torrent trackers. Then search for the font names, then foundry, then designer. You will find a lot of crap. Mostly Lino/mono/itc anti-p2p groups releasing dafont font packages to show you what you can get for free. Ugly fonts, like from Ray Larabie et al( BTW Ray, overexposure? You wish you could create a font half as famous as Helvetica). Don't listen to Nick Cooke either, I torrented his recent additions the other day. Just don't search for 'Fonts'.</p>
