      <p>I see these options:</p>
      <p><em>a</em>) You license the typeface, but a very close friend of you wants it too. Why don’t give it to him? Tomorrow he can do the same for you. Buy one, get two (or three, or four).<br>
      <em>b</em>) The company licenses the typeface, the employee not. He copies it from the company computer to his personal computer. He shares it with a very close friend (see <em>a</em>). The cycle starts again.<br>
      <em>c</em>) You license the typeface. You need that some other people (prepress service, an employee) gets the font in order to complete the job. You give it to them. They don’t erase the files after the job is done. They share it with a very close friend (see <em>a</em>), or someone in the prepress service copies the file into his personal computer (see <em>b</em>). The cycle starts again.<br>
      <em>d</em>) If I got the typeface from <em>a</em>, <em>b</em> or <em>c</em>, I didn’t pay for it. Why not upload it? Not my lost! This way everyone can use this lovely typeface, and tomorrow I will get some other typefaces that somebody else will upload, and at the end everybody will have an awesome collection available at every moment. And free! It is great, isn’t it? Well, yes, that’s like stealing, but nobody gets hurt, the big foundries are rich anyway and the type designers… well, they need to get another job or change the way they distribute their typefaces because in this globalised world everything is changing and the information should be free and I don’t have the money to pay for it but I really need that typeface and blah, blah, blah.</p>
      <p>But we still doing typefaces…</p>
