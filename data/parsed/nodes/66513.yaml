      <p>Hier geht’s gerade nicht um die Herstellung und den Verkauf von Plagiaten, sondern um die illegale Verteilung unveränderter, auch nach deiner Rechtsauslegung geschützter Fonts (Schrift-Dateien) und deren Nutzung. Und da gibt es praktisch keinen Markt, jedenfalls praktisch keinen, auf dem die Fonts verkauft werden. Vielleicht kannst du ausnahmsweise mal darauf verzichten, eine Diskussion über Urheberrechtsverletzungen durch Typedesigner anzuzetteln. Unrecht rechtfertigt jedenfalls kein Unrecht.</p>
