    html: |-
      <p>@ VBM</p>
      <p>OpenType programming does not cost much time in relation to the other work, even if you are not talented and even if you program such complex features like the ones in some P22 fonts (Operina) for example.</p>
      <p>And in my opinion a designer, that creates one small, but perfect typeface family in his live, is better than a designer, that creates dozens of half baked typefaces. Except from that I am not really interested in script or deco fonts. I am even not very interested in sans serif fonts. I am fascinated by poesy/knowledge transporters – typefaces made for continues reading of hundreds of pages. And this part of typedesign seems to be less lucrative than designing display fonts. If book (or newspaper) fonts are used without a license in commercial projects, the consequence is not only fatal, because the typedesigner looses money, but also because he maybe decides not to invest time and energy in developing a book font anymore.</p>
      <p>Except from that you simply don’t have the right to decide, which price is fair and which is not. And it is an impudence, that you want to define, what an acceptable tempo for the developing of a typeface is. On the one side you admire the individuality of typefaces. On the other side you are a slave driver. I assume, you are not able to see the invested time, the quality of the kerning of a well made font for example. You just see the single letters. (In my <em>opinion</em> the prices of DTL and TEFF fonts are too high in relation. I doubt, that these prices mirror the work only, but I think, that they are part of business politics. But this does not give anyone the right, to use the fonts illegally.) As I said, for me it is okay, if “font loving” people, that are not rich, use commercial fonts for uncommercial use. But in the moment, in which they earn money with the work, for which they have used a commercial font, they should license it. And I think, that a person, that has a private website, on which he extensively uses a commercial font, also should license it. However, most unlicensed fonts, that are stored on the harddisks of font collectors, never will be used. And many people are collecting fonts, just because they are expensive. “Loving fonts” is very relative.</p>
      <p><cite>I already stated that we do buy fonts, and that they're not used outside of personal images. Its not whether you agree with it or not. That's just how it is.</cite></p>
      <p>Nevertheless I partly agree, because the very most people, that use fonts for private use in small projects, would not license the font, if they could not find it on warez forums.</p>
      <p><cite>Like I said, there's no conspiracy of designers trading typefaces to save money or to smite your EULA.</cite></p>
      <p>VBM, there are designers, that make money with their work, with logos for example, that are not willing to license a font, if they can get it from a warez forum. And people like you, that use the fonts for their personal use, support those people indirectly.</p>
      <p>One word to EULA: They are often a bad joke, especially with regard to embedding and changing anything in the fonts (except from the copyright info). I am fixing bugs by myself, if I can.</p>
      <p><cite>I already stated that we do buy fonts, and that they're not used outside of personal images.</cite></p>
      <p>You, but the very most pirates do not. It simply is not enough, if five of five thousands people by a font. It is not enough money for living (inclusively buying a Hermann Miller Aero chair against back pain [I came over the chair-thread yesterday.]).</p>
      <p>VBM, there is a psychological phenomenon. People have a tendency to find justifications for their doing always. I know that from myself. But I am intelligent enough, to detected justifications, that are overconstructed and absolute synthetical. If I recognize, that I am doing something, that is immoral, something for which I am trying to find a justification, which is the opposite of simple, I decide between the following alternatives: Doing it, although I know, that it is immoral, or stopping it. Everything else would mean lying to myself.</p>
