      <p>I throw music/font analogies around like something in a something. Here's something that I think differentiates font/music piracy. It's not a morality thing, it's a money thing.</p>
      <p>When a song is pirated, it's not likely to be broadcast. It goes into an MP3 player. The lost income is a lost sale.</p>
      <p>When a font is pirated, it may be used for something the public will see, in a sense, broadcast. A blog heading, decal, logo, game etc. This exposure causes a kind of erosion of style. The more people see it, the less novel it becomes. You can certainly see that with free fonts: they quickly become uncool from overexposure.</p>
      <p>For recording artists, it's been argued that exposing people to music who normally wouldn't but it creates fan bases . . . agree or not, you've heard that side of the music piracy argument before. I think there's some truth in it. I don't think it means music piracy is a great boon for recording artists (2000 vs 2010) but more of a big downside with a tiny little upside.</p>
      <p>For font makers, there's not much of a positive side to piracy. The increased exposure lowers the value of a font. There's little prestige in being included in a torrent, especially since the collections are generally trashy. According to apakrat, being included in a font torrent junk pile can potentially increase sales but I think it's pretty far fetched. But I agree about not worrying about it. You can't stop it anyway.</p>
      <p>Free font styles fueling pay font sales: I think that's a myth. The effect on sales is very subtle. If it worked, I'd keep doing it but generally a free version seems to have no effect on sales of the rest of the family whatsoever. I've been including free commercial use font styles since 2001. If it had a noticeable positive effect on sales, I'd be including free styles with every family.</p>
      <p>Maybe Museo does so well because it's awesome.</p>
