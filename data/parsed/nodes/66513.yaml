      <p>A couple more thoughts on the subject.</p>
      <p>There are effectively three types of people interested in fonts:</p>
      <p>(a) those who do not realize that fonts require licensing<br>
      (b) those who know that they should be licensed and use them without licensing<br>
      (c) those who know that they should be licensed and do in fact license them</p>
      <p>(a) are potential customers<br>
      (b) are not paying out of principle<br>
      (c) are paying customers</p>
      <p>Now, let's see what does going after the torrent sites do. First of all, who ends up searching for a pirated copy of the font ? Those who have just been to the font retailer and could not download a copy without paying. I.e. people who <em>know</em> about the licensing requirements, the group (b) or (c). Or those from (a) who were shocked by a sticker price and did not find a way to justify it.</p>
      <p>(b) is not paying, but (c) does. Why is (c) looking at pirated copies ? I think the answer is damn obvious - they want to evaluate the font in detail before committing. They are in a sense compensating for the shortcomings or the inadequacy of previewing systems at the font retailer's site.</p>
      <p>This in turn means that taking down the torrent'ed copy eliminates the font from the consideration by such customers. It effectively translates into lost sales.</p>
      <p>--</p>
      <p>If the goal is to entice people not to use torrents, then the only effective way to address this problem is to provide some form of return policy or to offer selected weights free of charge. Based on how well Jos's Museo is doing, latter is working. </p>
      <p>Former is not something that I've ever seen in the wild, but, again, twist your brains a bit and consider who would be using this option - this would hardly be pirates, wouldn't it ? Every single "return" will come from honest, paying customers that will in the end be grateful for the flexibility; and that in itself will establish a great deal of goodwill and make them more likely to return for another purchase.</p>
      <p>In other words - <em>do not worry about the piracy</em>. </p>
      <p>Focus on simplifying the experience of those who are willing to pay instead of going after those who won't pay regardless.</p>
