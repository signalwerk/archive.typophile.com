      <p>I'd like to think that even those who download and use pirated fonts would actually rather be paying for them. Most designers know - even amateurs - that a well designed typeface can take months, even years to create. </p>
      <p>Unfortunately, many up and coming designers are too poor to buy the typefaces they would really like to be experimenting with. As a result, they will resort to torrents and other file sharing methods to get the fonts they want to use.</p>
      <p>I'd argue that most of these same people, once they've become more established in the design world, will purchase all the fonts they use.</p>
