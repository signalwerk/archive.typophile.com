    html: |-
      <p>I answered your question in a non bitchy manner.</p>
      <p>There's no mass of interested font collectors with a taste for current font releases fonts who use torrents. At least not the public trackers. I think that's why the majority of font torrents are ancient collections of converted junk, graffiti font collections or mainstream big company collections. I'm not saying that to discourage people. Anyone can Google the words font &amp; torrent and see for themselves. The foundry collections, while they sounds exciting and useful, tend to be really outdated. I'm not going to name specific ones but I think they're really only useful to font historians.</p>
      <p>I'm not sure why, but the font scene is mostly a Rapidshare (or similar) scene. Usually when I see my own fonts being posted, it's usually a Rapidshare link. Whenever I see my own fonts in torrents, they're usually old versions of my early fonts mixed in with the usual 40,000 or so font grab bag mixed with free fonts . . . I think you know what I'm talking about.</p>
      <p>I'm not sure about the Usenet font scene . . . those cats are hard core. But so many Usenet search sites are fake so who knows? From the Usenet search tools it looks as if there are some current font collections being traded but it sounds unlikely. I've seen supposed Usenet collections, supposedly containing fonts of which I had only sold 3 copies. Unlikely.</p>
      <p>I don't think it's that way by accident. There's a real lack of availability and a fairly high price point (compared to music, movies, tv) which prevents torrents of new fonts to be released as torrents in the first place. If a font is $50 and sells 25 copies, how likely is it that one of those is going to end up on a tracker? Since, I think, most font buyers are designers, are those designers really going to take the time to post a torrent with single font family? Prolly not.</p>
