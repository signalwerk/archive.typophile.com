    <p>Let me start by noting that I do not condone font piracy.  I am a graphic designer and typographer by trade and I have always licensed all fonts in my work.  That said, I don't have a problem downloading collections for preview and trial purposes.</p>
    <p>I am looking for good trackers for finding fonts and font collections, preferably organized so as to allow browsing fonts as a category, instead of being limited to results of a search.</p>
    <p>if one doesn't exist, it damn sure should.  who is with me?</p>
    <p>please do not turn this thread into a soapbox for copyright and/or intellectual property politics.  start a new one if you must.</p>
