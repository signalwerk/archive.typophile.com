      <p><cite>Of course it is. And it has gone up to 32 now. Record Breaker! Aesthetics are everything. You think you are selling the software, but people are 'buying' the image. The quality isn't measured by the kerning, x-height, or how well you arrange the OpenType tables. Its in the visual aesthetics. The wow factor of how it catches the 'buyer'. If it doesn't wow them, they won't buy it or download it. So how can you say its a quality product?</cite></p>
      <p><cite>About 1 in 10 weights are extracts in the first year. After the second an original is usually bought or found and that drops it to 1 in 877 (I counted) The quality is the same glyph-wise. You can lose metrics and kerning, but so what. You will most certainly have to customize the kerning anyway in Photoshop to suit your needs. Unless you buy fonts to use in Word or Outlook. Then you're screwed. If you're a font pirate however, you can get Fontlab for free too and fix all that.</cite></p>
      <p>As you probably have recognized, I was not your enemy. But now you started to post really bloody **** bullshit! The asterisks come from the board software! As I already have written above, I have grown up with art. My father is an ignorant against everything else than art inclusively me (as long as he cannot process the information, that he gets from the outer space [and the space is he himself] for his art). An asshole as father, but a great artist. In the moment an artist (and designing body text typefaces is not pure art!) begins to create anything just for the simple minded eyes and ears of the public, he is less than a whore. (I love whores, as long as they don’t claim to make art.) You are such a rough – person. The whole is important, but the details are likewise important, namely for the whole. And in typedesign the details are often good, if they are not recognized by pure readers. Making art dependent from the market is pure decadence. In a decadent world the good does not survive anymore.</p>
