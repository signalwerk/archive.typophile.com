      <p>For me, as a book designer, I get a lot of fonts with multilingual prints with just black plate for each language. I use the fonts, and then package them with other files for possible re-prints or corrections. After the job they are just in storage.</p>
      <p>As a type designer, this is sort of built-in thing to do.</p>
      <p>But I've worked in advertising, and there thigs are so very different: an old co-worker started his own agency, and called me to work on a type they had already cleared with the client to be used as a logo and house type.</p>
      <p>That type was something I had done for a publishing company some years ago. I went there and explained to them that this font family was made for exclusive use of that publisher, and I could not see how that could have ended as a logo of a lunch diner.</p>
      <p>My friend said that he just copied ALL fonts from the company he left, and liked my font for the job. He never even considered that the name of the font was the name of the publishing company.</p>
      <p>In the end I made some design changes to the font, and everybody were happy.</p>
      <p>But here you see how fonts are appreciated.</p>
