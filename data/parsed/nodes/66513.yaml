      <p>Tomi has suggested contacting the designers, and I think that this is a great idea. However, couldn't foundries offer some sort of automated service in which you feed in your point size, leading, column width, etc., and it spits out say 12 column-inches of lorem ipsum as a pdf for you to place in your document? I think that this would be a very useful tool.</p>
      <p>But on the original topic, the type community cannot become like the RIAA and unilaterally condemn any mention of file-sharing. I recognize that the analogy to the recording industry is problematic, since the musicians lose much less from having their music downloaded, and type designers don't sell merchandise and play concerts. There's a reason that I have very little problem with downloading music but won't illegally download fonts or aid anyone in doing so. But the type community needs to avoid being seen as a curmudgeonly bunch of old coots who can't get with the times. Type designers need to figure out how to work the current climate to their advantage; just look at Jos Buivenga.</p>
      <p>That's an awful lot of words just to say "don't shout down anyone who mentions file sharing, regardless of intentions," but ultimately I feel that we can benefit fro the conversations that these kinds of threads start.</p>
