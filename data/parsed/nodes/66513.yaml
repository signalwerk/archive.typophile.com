    html: <p>I can see the reasons people use pirated fonts (either not wanting to pay or not knowing about licensing), so my question is why people would share fonts in the first place. If you spend money licensing fonts, you know they are not free. Why would you then share them with others? It's not like it benefits you to share stuff you've spent money on.</p>
