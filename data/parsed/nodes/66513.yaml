      <p>IMO, people don’t even notice they are doing something bad. Or they know, but they don’t care because it’s very unlikely to get caught. And some other people think that designing typefaces is not a big deal, so they feel the prices are too high: they pirate fonts because for them the prices are abusive in the first place.</p>
      <p>———</p>
      <p>That said, I can think of a possible motivation: to get the job.</p>
      <p>Let’s say that a publisher wants to do a book in Quadraat, a not so expensive typeface (because that’s the way the collection is or whatever other reason). He asks two freelances: the first one can do the job for $1000 + $204 for the four basic styles of FF Quadraat OT. The second one is pirating the fonts, so he can do the job for just $1000 (BTW, he has not only the four basic styles, but the whole family). Who will get the job? In my experience, the publisher will not care about licenses, he only wants his book the way he likes it. The “good” freelance can license Quadraat this time with his own money and keep it for him (investment), but tomorrow he is going to need another one and the next week a new one that most likely he will never use again… You get the picture.</p>
      <p>In an ideal world, in these cases you should charge your client for the font licenses. In the real world, since not everyone is playing fairly, trying to do that may mean not to get any job at all.</p>
      <p>(Did I say that nobody has asked me to do a book in two years or so? But it’s ok, since I’ve been forced to do type design.)</p>
