  html: <p>Given that the tracker, at the moment, shows about 60 updated blogs--all SPAM, perhaps it's time to consider moving the blog updates out of the main tracker log? I have no idea if that's an easy task to accomplish, so perhaps it's not a realistic suggestion, but if it is, it may make for reading updates a lot easier/nicer for those that use the tracker.</p>
