    html: |-
      <p>Short answer: no.<br>
      Longer one: yes, spam is bad and sometimes it seems worse, ruining the peaceful perusal of the forum.<br>
      But when spammers attack, they comment on forum topics as well as blog entries.<br>
      And, most important, the tracker is a tracker, it need to show everything.<br>
      The fact that some users (myself included) use it as the primary starting point to access the site means either that they choose to “drink directly from the faucet” or that other means of access have proven less satisfactory (namely the home page and <a href="http://typophile.com/forums" title="http://typophile.com/forums">http://typophile.com/forums</a>) (again, in my case, both are true). Other users have asked something like “give me all but the Type ID Board”.<br>
      “Censoring“ the tracker will not solve the spam problem, nor the access point one.</p>
