    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sutturah_slide_1-kopia_3655.png"></div><p></p>
    <p><strong>Sutturah – dangerous curves!</strong></p>
    <p>Designed by Octavio Pardo, <a class="freelinking external" href="http://www.rosettatype.com/Sutturah" rel="nofollow">Sutturah</a> is a display font intended for poster and editorial design. It was born as an exploration of new text patterns. The font combines very detailed and constructed shapes with script flavour. The design has varied influences, from gothic fraktur to the display super black high contrasted wood types. </p>
    <p><a class="freelinking external" href="http://www.rosettatype.com/Sutturah" rel="nofollow">Sutturah</a> is informal and irreverent. Its strong character goes beyond letter shape construction conventions; it quickly catches the eye and surprises the reader. Its personality allows for the creation of stunning pieces of design without the need of any other elements… a single word in <a class="freelinking external" href="http://www.rosettatype.com/Sutturah" rel="nofollow">Sutturah</a> is worth a thousand images. Extra ligatures and swashes give the user even more possibilities and add to the fun of using <a class="freelinking external" href="http://www.rosettatype.com/Sutturah" rel="nofollow">Sutturah</a>!</p>
    <p>See the specimen at <a class="freelinking external" href="http://www.rosettatype.com/Sutturah" rel="nofollow">Rosetta Type Foundry</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sutturah_slide_2_6433.jpg"></div><br>
