  html: |-
    <p>If you think that browsers are good for reading blog entries, but lousy for writing, raise your hand. Just what I thought. We're all in agreement here. The good news is that there is a better way. There are a number of email-like clients for writing blogs out there, and it just so happens that they will work with the Uppercase blogs. You can also use them to submit news stories. I'm going to quickly walk through the set-up process on one of the better clients I've found.</p>
    <p>The one I'm going to use for this tutorial is <a href="http://ecto.kung-foo.tv/ecto2.dmg" title="ecto2">Ecto</a>. It's cross platform, and it's the best I've found so far.</p>
    <p>Once you have Ecto installed it will ask you to enter some settings for your site.</p>
    <ol>
    <li>Enter the address of your weblog: http://typophile.com/blog</li>
    <li>System: Drupal</li>
    <li>Api: MovableType</li>
    <li>Access Point: http://typophile.com/xmlrpc.php</li>
    <li>Username: Your Typophile username</li>
    <li>Password: Your Typophile password</li>
    <li>Account Name: Whatever you want to call it</li>
    </ol>
    <p>You should now be able to see your blog with any blog posts you've made up to this point</p>
    <p><a href="system/files?file=200510220946.jpg" onclick="window.open('system/files?file=200510220946.jpg','popup','width=474,height=196,scrollbars=no,resizable=yes,toolbar=no,directories=no,location=no,menubar=no,status=yes,left=0,top=0');return false"><img src="system/files?file=200510220946-tm.png" height="196" width="473" border="1" hspace="4" vspace="4" alt="200510220946"></a></p>
    <p>From here, to create a new post, just click new, edit, click publish, and there it is, at typophile.com/blog/youruserid, or in the mix at typophile.com/uppercaseblogs</p>
