    <p>Hello, everyone—</p>
    <p>I'm happy to announce now that Walleye, the culmination of over two years of (often intense) effort, is finally finished and available to buy! You can find it at <a class="freelinking external" href="http://www.myfonts.com/fonts/looseleaf-fonts/walleye/" rel="nofollow">MyFonts</a> or <a class="freelinking external" href="http://marketplace.veer.com/font/Walleye-Volume-CTT0000654" rel="nofollow">Veer</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/WalleyePoster1_6006.png"></div><p></p>
    <p>I've put everything into this font that I thought I could legitimately make. Walleye supports the Latin, Cyrillic, and polytonic Greek alphabets, and includes a full complement of small caps for each of them. Combined, these alphabets support nearly all languages of Europe, as well as many from outside it, such as Mongolian and Lushootseed. Besides standard ligatures, there are <strong>special forms</strong> to prevent (or gracefully manage) collisions between pairs like <code>f”</code>, <code>(j</code>, and <code>gj</code>. There are all the <strong>local features</strong> (such as for Romanian) that are needed for graceful display of sometimes neglected languages. Walleye also has case variants for punctuation.</p>
    <p><strong>Numerals</strong> are also full-featured: both lining and old-style figures are available in monowidth and proportional variants, and super- and subscripts and on-the-fly fractions are available.</p>
    <p>In <strong>Cyrillic,</strong> there are alternate forms for the preferred Serbian shapes of letters. The <strong>Greek</strong> is worth a bit of special attention. It has enough different display options to satisfy even a demanding classicist. And moreover, the design of the letters is a unique contemporary take on the old-fashioned calligraphic style of Greek fonts that was used everywhere until (often ugly) Latinized, "modern" alphabets began getting popular around the beginning of computer typesetting.</p>
    <p>I also think, and I hope you do too, that the <strong>design</strong> itself is no boring slouch. It's a friendly and entirely original design that doesn't try to fit in with any particular historical predecessors; it gets a lot of its character through luxuriously long scroll-shaped terminals and faceted shaping of round bowls. I've also made an effort to unclutter the design for easy reading by simplifying shapes like <code>a</code>, <code>k</code>, and <code>s</code> that would otherwise be crowded with serifs or finials.</p>
    <p>Check it out—and I hope you enjoy it!</p>
