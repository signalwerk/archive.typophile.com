      <p>Thanks, guys! And Dave, thanks for the tip on tags. I'm new using MyFonts—it's my first font with them. </p>
      <p>Sorry the bold weights aren't pleasing everyone. I believe I did my best, but I suppose since bolds are farther afield from my original inspirations, maybe they lose something in traveling into the new weight bracket. But I'm glad to hear that the regular weights are striking a chord. (I never thought of the /b/ as being particularly remarkable, but maybe I wasn't giving it enough credit!)</p>
