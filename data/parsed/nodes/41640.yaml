    <p><em>There was a birthday girl from New York<br>
    Who bought wine bottles she would later uncork.<br>
    As she lived in Manhattan,<br>
    She neither spoke Latin<br>
    Nor dressed or sang like Bjork.</em></p>
    <p>If you saw your shadow this morning, does that mean there will be six more weeks of winter boot shopping?  ;-)</p>
