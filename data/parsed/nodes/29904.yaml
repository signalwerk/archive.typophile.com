    <p>Hello,</p>
    <p>i'm searching for an antiqua or a antiqua-like slab-serif as a compagnion for <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=FF.11670.0.0" target="_blank" rel="nofollow">FF Milo</a>.<br>
    FF Milo has (extremely) short ascenders and descenders - so the "classic" antiquas don't really go with it, i think. One i found so far, is Arnhem (OurType) – do you have other suggestions? Arnhem has a quite similar x-height, but Arnhem offers a different Capital-M, which could be a problem.<br>
    The face should offer OSF and a minimal range of weights – regular, italic, bold, bold italic.</p>
    <p>Thanks in advance, T.</p>
