      <p>Quoted from <a href="http://www.underconsideration.com/brandnew/archives/hi_hi_birdie.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this article</a> at "Brand New"</p>
      <blockquote><p>The new look was more than 18 months in the making. It was created by the Blue Jays with assistance from the Design Services division of Major League Baseball, in conjunction with members of Toronto’s staff, manager John Farrell and several players.</p></blockquote>
      <p>So I guess, it has to be considered as an exclusive typeface for the Toronto Blue Jays.<br>
      Part of that, <a href="http://www.myfonts.com/fonts/itc/elan/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Elan ITC</a> is very close and could be used as it. But, the more I look at it, the more I think it's a custom job based on <a href="http://www.myfonts.com/fonts/itc/kabel/UniqueName-215863-116558/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Kabel ITC Bold</a> (/S, /W and /G can't lie), some kind of "Elan-ization" (terminals extended and manually serifed "à-la-Elan") of Kabel.</p>
