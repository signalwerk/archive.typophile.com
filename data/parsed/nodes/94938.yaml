      <p>Quoted from <a class="freelinking external" href="http://www.underconsideration.com/brandnew/archives/hi_hi_birdie.php" rel="nofollow">this article</a> at "Brand New"</p>
      <blockquote><p>The new look was more than 18 months in the making. It was created by the Blue Jays with assistance from the Design Services division of Major League Baseball, in conjunction with members of Toronto’s staff, manager John Farrell and several players.</p></blockquote>
      <p>So I guess, it has to be considered as an exclusive typeface for the Toronto Blue Jays.<br>
      Part of that, <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/elan/" rel="nofollow">Elan ITC</a> is very close and could be used as it. But, the more I look at it, the more I think it's a custom job based on <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/kabel/UniqueName-215863-116558/" rel="nofollow">Kabel ITC Bold</a> (/S, /W and /G can't lie), some kind of "Elan-ization" (terminals extended and manually serifed "à-la-Elan") of Kabel.</p>
