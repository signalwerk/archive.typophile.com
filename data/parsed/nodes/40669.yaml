    <p>I posted the text below a month ago in the fontlab msn group but got no answer. I am posting it again here and hopefully I will get some answer.</p>
    <p>“I have a problem with a monospaced font. I have manually hinted the font using the Bitmap Tool in the TrueType Tools. The problem is thatin some applications (like Flash - see the corresponding picture) the hinted version of the font (from 9px to 16px) is monospaced (which is correct) while in other applications (like Photoshop CS - see the corresponding picture - or even Notepad) the hinted version of the font is NOT monospaced! I can’t understand why this happens. All glyphs have a width of exactly 600px and the font works great while aliased.”</p>
