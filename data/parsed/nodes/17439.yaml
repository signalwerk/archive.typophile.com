  html: |-
    <p>I'm currently trying to design a logo for a magazine called "quiet light" and I'm leaning towards the use of Clarendon Condensed (Bitstream), or something similar in style. Where I'm running into problems is with the ear on the g, as I'd like to remove it, but it really throws the character off. I'm not even sure that this is definitely the direction I want to go with the letter, however, I have yet to give it a running chance.</p>
    <p>Anyways, I was wondering if anyone might have any recommendations on how to properly remove the ear and rebalance the letter accordingly (if this is possible), or if there might be some other font that might be a better fit for my design (possibly something with a center balanced upper loop?).</p>
    <p>You can find a character map of Clarendon Condensed here:<br>
    <a href="http://www.myfonts.com/fonts/bitstream/clarendon/condensed/charmap.html" title="http://www.myfonts.com/fonts/bitstream/clarendon/condensed/charmap.html">http://www.myfonts.com/fonts/bitstream/clarendon/condensed/charmap.html</a></p>
    <p>Thanks for your help!</p>
