    html: <p>Looking at it more closely in a PDF of the book excerpt that you can download, I think the typeface is <a href="http://www.fontshop.com/fonts/downloads/monotype/bembo_book_pro_complete_pack/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=65&amp;sample_text=Arno%20Schmidt&amp;ft=liga" rel="nofollow">Bembo Book</a>. The font is called ‘ZettelMZ-Regular’, which might mean that Friedrich Forssman modified the original font for typesetting Arno Schmidt’s novel <cite>Zettel’s Traum</cite> (maybe adjusting kerning pairs or the like) and continues to use this version for publications about this author.</p>
