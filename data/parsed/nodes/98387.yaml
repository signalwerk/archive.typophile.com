    <p>Hi everyone!<br>
    Please give me a hand with identifying this serif font used by Friedrich Forssmann in the recently published book »Arno Schmidt in Hamburg« (Hoffmann und Campe, 978-3-455-40345-9, <a href="http://www.hoffmann-und-campe.de/go/arno-schmidt-in-hamburg" title="http://www.hoffmann-und-campe.de/go/arno-schmidt-in-hamburg">http://www.hoffmann-und-campe.de/go/arno-schmidt-in-hamburg</a>). Screenshot from the publisher’s homepage attached to this posting. I feel it’s something between Garamond and Bembo, but what font exactly?<br>
    Thanks a lot in advance!</p>
