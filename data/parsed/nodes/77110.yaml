    html: |-
      <p><em>...a contemporary interpretation of a heritage brand...</em></p>
      <p><a href="http://www.shinntype.com/Figgins_Scotch.pdf" rel="nofollow">Modern Suite</a></p>
      <p>The Scotch Modern was the prevalent serif style immediately prior to the Russian revolution.<br>
      During the Soviet era, it was revived as New Standard, which, like revivals of the Scotch Modern elsewhere, was "cleaned up", so this finely-detailed digitization of the letterpress effect represents a fresh take on the genre.</p>
