  html: <p>Hi all - I am working on an identity project for a client in Russia. I need to find a cyrillic font which reflects a contemporary interpretation of a heritage brand. I am thinking something along the lines of Fedra Serif, but I need a cyrillic character set. Any suggestions?</p>
