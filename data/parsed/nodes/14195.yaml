    <p>My name is Reid Anderson and I teach Graphic Design at Durham College. If any owners of a type foundry are interested in being interviewed for a professional profile in a text book I am writing, can they please send me an e-mail through Typophile or by sending an e-mail to: <a href="mailto:reid.anderson@durhamcollege.ca">reid.anderson@durhamcollege.ca</a></p>
    <p>The interview would take about an hour.</p>
    <p><em> Hope to hear from some of you.</em></p><em>
