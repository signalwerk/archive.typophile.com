      <p>Reid, many owners of type foundries, especially larger ones, do not read every Typophile thread. I would suggest e-mailing them directly. The heads of Linotype, FontShop, E+F, URW++, TypeBox, Porchez Typofonderie, etc. all give interviews for publications on a regular basis, so I’m sure that they would respond favorably to your book if you would ask them.</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
