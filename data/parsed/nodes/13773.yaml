    <p>I'm searching for an alternative for Futura Light, I'm going to use it in all-caps display setting, so the lowercase is not important.</p>
    <p>The criteria:</p>
    <p>-Grotesque, geometric sans<br>
    -Quite Light/Thin<br>
    -N should have sharp, pointed verticles.<br>
    -A should have a pointed top.<br>
    -The bowl of P should be relatively large and the curve should be quite round.<br>
    -Neutraface has a bit too much flavor and the whole family is too expensive.</p>
    <p>I would really want to use something else than Futura for this</p>
    <p><a href="http://www.myfonts.com/fonts/quadrat/toronto-subway/regular/" title="http://www.myfonts.com/fonts/quadrat/toronto-subway/regular/">http://www.myfonts.com/fonts/quadrat/toronto-subway/regular/</a> (not light enough)<br>
    <a href="http://www.myfonts.com/fonts/dsgnhaus/dhsans/light/" title="http://www.myfonts.com/fonts/dsgnhaus/dhsans/light/">http://www.myfonts.com/fonts/dsgnhaus/dhsans/light/</a> (P isn't round enough)<br>
    <a href="http://www.myfonts.com/fonts/galapagos/contax/contax/" title="http://www.myfonts.com/fonts/galapagos/contax/contax/">http://www.myfonts.com/fonts/galapagos/contax/contax/</a> (quite good, not enough. A bit heavy too, "too futura")<br>
    <a href="http://www.myfonts.com/fonts/ortizlopez/olround-gothic/light/" title="http://www.myfonts.com/fonts/ortizlopez/olround-gothic/light/">http://www.myfonts.com/fonts/ortizlopez/olround-gothic/light/</a> (too thin, I don't like the A)</p>
    <p>Any suggestions?</p>
