      <p>Didn’t find any match for the entire set of letters.</p>
      <p>The I searched on everything except the |A| and |R|, and found a very good match to Gotham:<br>
      <a href="http://www.typography.com/fonts/gotham/styles/" title="http://www.typography.com/fonts/gotham/styles/">http://www.typography.com/fonts/gotham/styles/</a></p>
      <p>Mr. Eaves Sans by Emigre has a similar |R| (albeit with a much taller counter):<br>
      <a href="http://www.myfonts.com/fonts/emigre/mr-eaves-sans-opentype/" title="http://www.myfonts.com/fonts/emigre/mr-eaves-sans-opentype/">http://www.myfonts.com/fonts/emigre/mr-eaves-sans-opentype/</a></p>
      <p>Found a similar |A| in the free typeface Nottke:<br>
      <a href="http://www.dafont.com/nottke.font?text=NEUE+GALLERIE" title="http://www.dafont.com/nottke.font?text=NEUE+GALLERIE">http://www.dafont.com/nottke.font?text=NEUE+GALLERIE</a></p>
