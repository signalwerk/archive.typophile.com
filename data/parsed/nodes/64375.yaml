    html: |-
      <p>To a large extent, that 150% (or whatever) in the Max Word Space column does not have as much control as one would hope. When the H&amp;J routine gives up and can't solve your line justification within your parameters, then it's fallback position will be to just throw in a bunch of extra space anyway. So don't think that you're limiting the spaces with that field.</p>
      <p>Mostly it affects the threshold above which letter-spacing will be added (if you've allowed any). And it might slightly influence the calculations of a multi-line composition algorithm.</p>
      <p>There's a danger that having too narrow a range of parameters will actually flummox the algorithm more often and yield gappier spacing, despite your desires to control it.</p>
