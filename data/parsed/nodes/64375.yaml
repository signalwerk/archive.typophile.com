    html: <p>I am against scaling glyphs. Period. Ragged right is the way. Justification, sure, go for it, but don't use glyph scaling to make up for lousy practices. And don't leave last lines in a paragraph with one word. I think that is a basic practice and a no-no. Glyph scaling is a cheap way to make text look better!? How?</p>
