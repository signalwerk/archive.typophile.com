      <p>&gt; can see myself resorting to this trick when all else fails.</p>
      <p>Sure.<br>
      This is not a religion - everything has its usefulness.</p>
      <p>BTW, who told you that metal type can be squeezed? The most you can do is file the sidebearings (and not just flatly - you would even take chunks off to accomodate kerning). But that wasn't really frowned upon. In fact my letterpress teacher (our Gerald Lange) once told me that you could tell how good a printer was by looking at how much filing was evident on his fonts!</p>
      <p>hhp</p>
