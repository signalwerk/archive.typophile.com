      <p>@ hrant</p>
      <p>No, it is not not absolutely true, it is wrong. A well crafted body text typeface might tolerate more mistreatment than a poorly crafted one. Might! And I assume, that the Indesign/Quark algorithms are not scaling all glyphs in all lines and all words; if they would, the scaling would be almost useless with regard to the evenness of the word spacing or the hyphenation. Nobody here said, that there should be established a general rule, that scaling is a good thing. James Puckett already wrote in the beginning, that <em>most</em> fonts can handle 2–3 percent with no noticeable distortion. I don’t know, how many are <em>most</em>, but for sure <em>most</em> is not the same as <em>all</em>. And we are talking about body text, but not about headlines, logos or any other text, that is set in big point sizes. We all have these deterrent examples in mind. But I know extreme examples set in big point sizes only. I never have tested scaling body text with 2–3 percent, neither globally nor with the Indesign algorithm.</p>
      <p>But perhaps it is easier, if I illustrate the logic of your sentence in another way: Imagine two men. The one was born with two arms and legs, the usual condition. The other one was born with one arm and two legs. Would you say now, that the one-arm-man better can abandon his arm? In fact, you cannot conclude anything on this base, because it may be, that the one-arm-man is palsied.</p>
      <p>Hehe, probably the illustration is harder to comprehend. But I don’t delete it.</p>
