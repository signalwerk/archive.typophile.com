      <p>@hrant</p>
      <p>Early implementations of microtypographic extensions for TeX explicitly allowed one to specify, in cases where a multiple master width-axis for a font was available, different designs in place of glyph scaling. The general feeling though is that it isn't worth the effort; unless the printing is being done to very high standards it's  difficult to discern glyph scaling of less than 2% [try having your masterpiece printed on low quality paper and see how <em> that</em> effect overwhelms everything else — I speak from bitter (recent) experience.]</p>
