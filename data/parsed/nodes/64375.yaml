      <p>@ hrant<br>
      There is a reason, why people in composting rooms carried mallets. Hastily and badly crafted forms can be hammered into the chase under pressure, as improperly justified lines get squeezed by a few millimeters when the quoins are tightened. These forms, were always in danger of bursting in a little shower of lead, so the form makers sometimes poured beer on the underside to help sorts stick together. "Just a thimble full for the comp" - as it was called.</p>
      <p>There's a great old song:</p>
      <p>'Twas a busy day in the print shop, with orders coming in fast.<br>
      The stoneman, in a frightful stew, was harried and harassed<br>
      When up to the stone came a pressman with an injured look on his pan<br>
      He started to sing his song of woes as only a pressman can.<br>
      "That form's the bunk. The lockup's poor. The corners don't even meet.<br>
      The leads and slugs are bastard, and the type is off its feet.<br>
      The cuts are warped and rock like hell; the furniture is sprung.<br>
      The quoins are all ass-backward and the type's filled up with dung.<br>
      I've done my best, used all my kinks, but it won't take the hint;<br>
      For two whole days I've sweated blood and I can't make it print.<br>
      The stoneman heaved a mighty sigh, his eyes a glassy stare.<br>
      He threw away his mallet as he wildly tore his hair.<br>
      "You've hammered and you've battered like a blacksmith on a drunk.<br>
      You've filled it up with cardboard and other kinds of junk.<br>
      You've pounded down the work-ups and you've nailed them with a tack.<br>
      You've turned the damn thing upside-down and daubed it with shellac.<br>
      You've screwed it up in every way that's known from A to Z.<br>
      And now that it's a dreadful mess you bring your grief to me.<br>
      That form left here in tip-top shape, the lockup was the class.<br>
      Now you can take the gosh-darned thing and shove it up your"<br>
      _____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br>
      <a href="http://www.ivangdesign.com" title="www.ivangdesign.com">www.ivangdesign.com</a></p>
