      <p>@ Arno<br>
      I printed out that page, and personally, can't see any noticeable distortions, while the benefit in tight spots (like extremely narrow columns and unusually long words) seems to be pretty obvious. I certainly wouldn't use this when setting in a comfortable measure, but can see myself resorting to this trick when all else fails.</p>
      <p>In the days of metal type, glyphs-scaling (or rather squeezing) was rightfully frowned upon as it damaged the type (and could potentially crack up the chase,) but in our illustrious age...seems a tad less criminal.<br>
