      <p>&gt; the legibility is partly dependent from the gray of the text blocks, isn’t it?</p>
      <p>I don't see how. We just like to see things line up because it makes us feel in control. But in fact we're <em>losing</em> control of the reading experience.</p>
      <p>&gt; could you propose an alternate macro typography (an alternate layout)?</p>
      <p>I don't use fonts, I just make 'em. :-)  But I don't mean to be flippant. I just know when something is wrong even if I'm not sure how best to fix it. But one can certainly pay attention to good typographers who are also sensitive to the micro world of fonts; and certainly <em>not</em> Modernists who are obsessed with Regularity.</p>
      <p>One simple thing I can comfortably recommend<br>
      though is this: learn to love the right rag.</p>
      <p>And glyph scaling?! Maybe on a free font.<br>
      Not one that's been crafted carefully in every detail.</p>
      <p>BTW, tracking is probably worse than glyph scaling!</p>
      <p>&gt; Do you view today’s glyph scaling as the digital<br>
      &gt; equivalent to Gutenberg’s multiple glyphs?</p>
      <p>No way.<br>
      Scaling is brutish. Alternate glyphs can be a great idea (although it's much more work) as long as it's done for the reader, not merely the viewer.</p>
      <p>BTW, Gutenberg didn't do that because he had high ideals. He was simply imitating the scribes* (as Don says). He <em>had</em> to come as close as possible to appease the critics of printing.</p>
      <p>* So why did <em>they</em> do it? Not sure.<br>
      Maybe because hyphenation was<br>
      seen as weak, hence unholy?</p>
      <p>hhp</p>
