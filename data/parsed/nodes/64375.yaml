      <p>If you click on the image at the Pentagram blog and get a larger version of the sample <em>Atlantic</em> spreads, you'll see that there is plenty of hyphenation. They happen to be using InDesign's optical margin alignment to hang the punctuation, and in a small screen image the hyphens virtually disappear.</p>
      <p>There are also plenty of gappy lines. For instance, take a look at the first line in the second paragraph in the second column [<em>Twain's atheism was famously</em>] or the first line at the top of the last column [<em>(Thetans ... E-meters!). Medieval</em>].</p>
      <p>I'm not criticizing the work. I'm just pointing out that this is pretty standard fare. Nothing so "perfect" about it.</p>
      <p>Anything relatively competent will look that gray and even when you zoom out far enough.</p>
