      <p><cite>Glyph Scaling, perhaps?</cite></p>
      <p>Right. The roots of contemporary H&amp;J systems go back to the work done by Zapf and others in the 1970s and 1980s, which were designed with text scaling in mind. Most fonts can handle 2–3 percent with no noticeable distortion. Some typefaces can handle more; Vialog was designed to distort 5% before it begins to show. Unfortunately many designers never use glyph scaling because they don’t read beyond the most basic books on typography which usually insist that scaling type is always criminal.</p>
    html_clean: |-
