      <p>&gt; So the typedesigner should not say: ‘I don’t craft my fonts well, because<br>
      &gt; the users don’t handle them well.’ This would be a defiance reaction.</p>
      <p>True.</p>
      <p>But what I was saying is: somebody who thinks it's OK to scale fonts also thinks it's OK not to worry about small details at the letterform level.</p>
      <p>And going back in the discussion, to something more practical: don't scale fonts, not merely because some type designers mind small details, but because you can assume that the type designer of the font at hand minded the small details* and a simple horizontal scaling will do more harm than good (especially if the goal is a Modernist succubus).</p>
      <p>* Otherwise you should be using a font where that's the case.</p>
      <p>If you need to scale type, learn how to do it well at the type design level, and maybe use OT for width alternates (assuming the EULA of the font you're using allows "internal" modification*). Don't just hit 103% in InDesign.</p>
      <p>* And the ones that don't are being unreasonable, in my book.</p>
      <p>hhp</p>
