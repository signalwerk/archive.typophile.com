      <p><cite>If one is going to experiment with extending the scaling beyond 3%, we end up with the terrible justified setting at the beginning of DTP.</cite></p>
      <p>But there was no question of unlimited scaling, but 2–3 percent only. If the very slight distorsion is not recognized, but the word spacing is more even and without holes, the strict principle should be broken by the more important principle <em>legibility</em>. And your typefaces are probably never printed in exactly the same way, as they look in your font editor. Good is, what works. If I draw an image and make a mistake – squirting ink unintentionally for example – I always check, whether the image looks better with the mistake instead of trashing it at once. My aim is not the full control about everything, that I do, but the result. The result may be not perfect without the mistakes. But naturally you should not blindly trust in your mistakes. I don’t force me to make mistakes. <em>If then</em>, but not <em>then if</em>.</p>
