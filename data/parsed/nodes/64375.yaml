      <p>Roy:</p>
      <p>Dale Guild Typefoundry, has a nice account of their attempts to recast a full set of Gutenberg's 42-line bible type.</p>
      <p>They ended up with 245 sorts.</p>
      <p>They wrote:<br>
      ____<br>
      "The narrower letters were used to contract the length of a line and the wider ones to expand it. The space separating words remained constant." And again, "…the narrower or wider alternate characters were skillfully deployed to yield lines of identical optical width…" (Kapr *) These are faulty conclusions. Either the wider or the narrower characters are alternates. As the textual use of the wider characters out-number the narrower ones by approximately 3 to 1, the latter must be considered the alternates. What usually makes these alternates narrower is the fact that they lack serifs on the left side. They are never used or omitted to shorten or lengthen the space required by a given number of characters within a line. Gutenberg had employed them in both his earlier founts, the Sibyllenbuch and the Donatus/Kalender, but none of the extant printed specimens used justified lines. Their inception and use is purely aesthetic. They do not represent consciously narrowed letterforms. These alternates were cut and cast to create tighter fitting of certain character combinations that produced too much white-space within words. The alternates (left side sans-serifs) always follow C, E, F, X, Y, c, e, f, g, r, t, x, and y.</p>
      <p>For the full text:<br>
      <a href="http://www.daleguild.com/B-42_Story_01.html" title="http://www.daleguild.com/B-42_Story_01.html">http://www.daleguild.com/B-42_Story_01.html</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/potb3_big_4965.gif"></div><br>
