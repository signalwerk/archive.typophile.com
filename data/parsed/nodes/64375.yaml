    html: |-
      <p><cite>Glyph scaling is a cheap way to make text look better!? How?</cite></p>
      <p>I wonder, whether really all of you, that insist in the strict rule, have tested the <strong>slight</strong> glyph scaling in body text. I mean the algorithms of Quark XPress and Indesign. I did not test it. But maybe I am coming to the same result.</p>
      <p>I think, there is one thing, that you forget, when you talk about well-crafted fonts. The very most body text fonts don’t have optical styles. And almost nobody of you typedesigners tell the potential customers on your websites, under which printing circumstances and in which point sizes your fonts should be used.</p>
      <p>Typetogether writes about Athelas: "Athelas also takes advantage of the great advances and technical developments made in offset printing." Nevertheless <strong><a href="http://www.type-together.com/index.php?action=portal/viewContent&amp;cntId_content=2682&amp;id_section=146" rel="nofollow">the letterpress print of Athelas</a></strong> seems to work. And it really looks dark in the letterpress print (and probably lower contrasted).</p>
      <p>I own a book, that is printed in Stempel Garamond. A dirty print in my opinion, because on the one page the text is relatively thin and on the other really fat. In other words, on one of the pages the original outline does not match with the printed outline. Nevertheless I enjoy reading it. It is very legible.</p>
      <p>What would you think, if the user enbolds one of your well-crafted fonts? Is the digital version of Stempel Garamond well-crafted? It is not the same as scaling, I know, but probably it is also not that, what you have wished, when you have designed your typefaces.</p>
