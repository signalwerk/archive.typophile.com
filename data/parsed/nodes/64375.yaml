    html: |-
      <p>It's hard to observe the justification at this size of reproduction.<br>
      However, there are some issues in the layout.<br>
      One should try to avoid paragraphs beginning at the top of columns.<br>
      That makes it too easy for the reader to skip text, and for instance begin at the top of the second column, rather than deal with the un-buffered jump from drop cap to text, which creates a semantic schism in the first word, exacerbated by the gutter-width gap between drop cap and body text.<br>
      Function over beauty...</p>
