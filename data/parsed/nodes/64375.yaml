      <p><cite><br>
      No way.<br>
      Scaling is brutish. Alternate glyphs can be a great idea (although it’s much more work) as long as it’s done for the reader, not merely the viewer.<br>
      </cite><br>
      I agree.<br>
      <cite><br>
      BTW, Gutenberg didn’t do that because he had high ideals. He was simply imitating the scribes* (as Don says). He had to come as close as possible to appease the critics of printing.<br>
      </cite><br>
      But the scribes weren't producing texts with columns as tidily justified as Gutenberg's. I agree that Gutenberg's  multiple glyphs enabled his texts to look more natural, but I do believe that the number of alternate glyphs and ligatures were also created so he could achieve a strict justified column with even word spacing. As pointed out <a href="http://www.hrc.utexas.edu/educator/modules/gutenberg/invention/familiar/" rel="nofollow">here</a>, the strict justified columns are one of the ways scholars distinguish Johann's work from manuscripts. So, it appears that the even columns and spacing in his work were not part part of his goal of imitating the scribes. </p>
      <p>From the above link:<cite><br>
      One way to distinguish between Gutenberg's printed Bible and a manuscript Bible is that in the printed book, all lines of text are brought to equal length in the column, forming justified lines. The strictly justified lines of Gutenberg's Bible were considered by some to be superior to the slightly uneven lines of a manuscript Bible.<br>
      </cite></p>
      <p>Personally, I'm against scaling glyphs <em>and</em> spaces. I was taught by a thoughtful typographer that doing so was to butcher the balance and detail put into the font by the type designer. (Not to mention the readability issues). But practically speaking, I'd wager most typographers, book designers publication designers and graphic designers in general don't have the skill (Or the time. As you pointed out, it's much more work) to scale type at the type design level.</p>
