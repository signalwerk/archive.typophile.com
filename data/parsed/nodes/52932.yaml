    <p>OverKill. Is it too much? Is there such a thing as too heavy? I just wanted a type face to fill the space and pretend to be legible. It is great for banner headlines and sale ads (like we need more of those). I created it initally as a font with characters that had space to fill. Could be too much for folks...</p>
