      <p>From the Yale course list at <a href="http://www.yale.edu/bulletin/html/art/program.html" rel="nofollow">http://www.yale.edu/bulletin/html/art/program.html</a></p>
      <p>Graphic Design 743a, Type Design. Type design is distinct from “lettering” in that it necessarily calls for a systematic approach, not just a concern for individual forms. The course focuses on a clear, systematic procedure to building the design of a typeface, as well as the aesthetic issues presented by single letters. The class is taught with Fontographer, a type-design program for the Macintosh® that allows designers to digitize letterforms on screen and turn them into usable PostScript Type One fonts. Fontographer’s ability to output digitized characters at actual size on a laser printer brings a level of reality to the project that was not practicable by pre-computer methods. Students learn the software, together with the principles of designing and spacing type. Fully fledged type designers are not made in one term; the object is to “demystify” the subject and teach users of type an increased appreciation of it. Students work on individual projects, chosen in consultation with the instructors. Individual projects should be carefully chosen, so that the availability of the student’s new font makes a real contribution and serves a clear purpose. With the problems of type design so deeply interconnected, a clearly defined project is necessary to establish solid criteria for subsequent work. The nature of the project determines the route each student takes in researching his or her design. If appropriate to the project, students spend time rendering letterforms by hand, investigating historical sources, or starting immediately in Fontographer. Tobias Frere-Jones and Matthew Carter.</p>
      <p>Sounds like a dream course to me.</p>
