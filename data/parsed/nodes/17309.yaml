    <p>I'm studying graphic design at the Bezalel Academy in Jerusalem, 2nd year, and we're supposed to give a list of priorities on places we'd like to go be exchange students next year, for a single semester (fall or spring).</p>
    <p>There's quite a wide list of options, but I'm thinking either New York or Netherlands as my top priorities... I was wondering if anyone has any recommendations for any specific schools that are known for their typography/type design/calligraphy courses, not necessarily in the countries I've mentioned, since the choice is very wide... Thanks.</p>
