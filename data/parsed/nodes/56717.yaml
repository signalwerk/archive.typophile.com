      <p>Hi Ray,</p>
      <p>Thanks for the quick response. Hyphenation is something I was planning to look at for the next issue. I'd like to keep the main body justified, so hyphens are kind of unavoidable there, but I will definitely try and keep them out of all of the ragged text next time. Certainly wouldn't hurt to set the "Further reading" ragged.</p>
      <p>I liked the muted red on-screen as well, but the brighter one works much better in print. Although we print a small number and otherwise distribute by PDF, I'm more worried about the paper version looking nice than the electronic one. By "folio number" do you mean the numbering in the contents or at the bottom of the page? Either of them could drop a size probably to match the text in the "Team" section or "Further reading" bits.</p>
      <p>Anyway, thanks again: it's great to have some input. I am just going on the advice of Bringhurst at the moment!</p>
