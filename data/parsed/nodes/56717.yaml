      <p>Hi,</p>
      <p>The magazine looks pretty great for an amateur one! One suggestion would be that if you want to run the type on the logo and other department heads off the top you might not want to cut it off on the sides. The reason being you never want those kind of things to seem like they might have been a printing mistake or not thought out. I do like the type running off the top however. Maybe you could bleed the box off the right but leave more space between the edge of the page and the right of the word.</p>
      <p>good luck!</p>
