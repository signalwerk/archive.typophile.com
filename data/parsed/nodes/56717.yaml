      <p>Hi Ed,</p>
      <p>Congrats on your magazines, and welcome to Typophile.</p>
      <p>On first glance, the overall appearance of this magazine is quite nice, especially considering its "amateur" nature, as you say.</p>
      <p>Some thoughts:</p>
      <ul>
      <li>Consider avoiding hyphenation on short, ragged-egde paragraphs (e.g. p.2 of each issue and much of your "Further reading" sections). You may also wish to consider avoiding hyphenating proper nouns. This is often a matter of personal preference, but I encourage practicing it.</li>
      <li>Something about the narrow gutter width distracts me, but I can't put my finger on it. Perhaps someone else can help me define it.</li>
      <li>The folio numbers look oversized to me, but again, maybe that's a matter of personal preference, too.</li>
      <li>Not type-related, but I thought the muted red of issue one contributed a better vibe throughout the magazine compared to the vibrant red of the second.</li>
      <li>Good correction of consistent type families for the second issue. I found the variation extremely distracting in the first; to the point that I wondered if one of them was an ad.</li>
      <li>PDF versions: After creating your PDF, you have the option for the viewer to see it like a magazine, with a cover and subsequent spreads. When the PDF finishes exporting, open it, press Command-D, go to "Initial View" and choose "Two-up (Cover page)" and then choose "Fit Page." Voila! A digital magazine! (<em>I should specify that it will probably only open in the customized view with Adobe Acrobat/Reader, not Preview. Not sure about other third-party PDFers...</em>)</li>
      </ul>
      <p>Okay. I'm done boring you with nitpicky things that the others may find unnecessary. ; ) </p>
      <p>Nice stuff, and good luck!</p>
      <p>Ray</p>
