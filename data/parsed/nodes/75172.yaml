  html: |-
    <p>Greetings!</p>
    <p>We maintain a font for a client that we're moving to OpenType and they want to make the bold version a little heavier while we do this.</p>
    <p>I can use the bold effect to get the glyphs to look the way I want them but is there a way to get Fontlab to expand the width of the character as well when changing the weight of the glyph? Seems like this would be a basic function but I've not yet found it.</p>
    <p>I imagine with Python I might be able to script something to "record" the bearings, adjust the glyph weight and reset the bearings to what they were but I've NO idea how to even begin using Python.</p>
    <p>Any suggestions would be greatly appreciated.<br>
    Ken</p>
