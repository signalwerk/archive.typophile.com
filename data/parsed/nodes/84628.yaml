    <p><a href="http://www.fontfont.com/designers" rel="nofollow">FontFont designers</a> have been recipients of prestigious type design awards, but few can claim to have been even before their creations were officially published. <a href="https://www.fontfont.com/designers/ludwig-%C3%BCbele" rel="nofollow">Ludwig Übele</a>’s <a href="http://www.fontfont.com/fonts/tundra" rel="nofollow">FF Tundra</a> — a recipient of a Certificate of Excellence in Type Design at this year’s TDC2 competition — is now available for licensing.</p>
    <p><a href="http://www.fontfont.com/fonts/tundra" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.fontfont.com/fonts/tundra" rel="nofollow"><img src="http://typophile.com/files/ff_tundra_590_4551.png"></a></div><p></p>
    <p><a href="http://www.fontfont.com/fonts/tundra" rel="nofollow">FF Tundra</a> is a narrow serif typeface with stressed forms and soft contours. The idea evolved from looking at a page in a book of the Bremer Presse from 1925 when Ludwig Übele was fascinated by the balance and incredibly perfect lines. At that time, he was investigating how a narrow typeface should look for optimal readability. In FF Tundra he combined strong serifs, flat shoulders (see n) and open but heavy endings (see a, e, c) with a moderate contrast to achieve a balanced, legible typeface with a certain softness and humanity. FF Tundra has been designed for continuous text, but is also suitable for magazines and headlines (especially the Extra Light) and will surely work in newspapers as well. The family consists of six weights from Extra Light to Bold, each with Italics and Small Caps and many OpenType layout features.</p>
