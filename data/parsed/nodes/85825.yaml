    html: |-
      <p>@SaveGirl101: Who asked you this question and to what end? Is this a personal or academic project?</p>
      <p>Try looking at:</p>
      <p>Berman, D. B. (2009). <em><a href="http://www.davidberman.com/social/dogood.php" rel="nofollow">Do good design. How designers can change the world.</a></em> Berkely, California: Peachpit.</p>
      <p>In addition, you’ll find you get a better response to broad questions like this if you provide specific examples of what you’ve come so far, where you’ve looked, and why you are asking the question. A straight out question from a profile that’s hours old has the potential to come across as a little bit of “do my homework.”</p>
