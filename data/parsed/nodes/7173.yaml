    <p>The  United Nations is hosting Wolrd Enviroment Day in San Francisco in 2005. <br> <br>Its theme is;  World Cities:  Where the future lives. <br> <br>I guess through my teacher they are going to pick a poster from my class that will be plastered throughout the city next year.  This  concept is the one that my class picked for me out of the three that I showed them.  I am not sure it says what the title says. What do yall think?  Do you think I should try to come up with another idea.  I would really want to take advantage of this situation. <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/51330.gif" alt=""> <br> <br> <br>btw I have another idea i never photographed it because I thought it might be hard to execute  <br> <br>It was to have a robot and women (mother earth) shaking hands it would only feature their hands close up and it would show that we are going to make a commitment to the future to improve our cities.</p>
