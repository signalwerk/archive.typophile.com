    html: <p>Gregory, I find the skyline shilohette upside down disturbing and unnessary. I'm from Manhattan and skyline shilos bother me since 9/11. Next the photo looks like the aftermath of a nuclear explosion. No buildings, no people, no animals, just leaves not growing up but strewed along a (barren airport?). Hardly what I would like to experience in an urban green environment. <br> <br>What I suggest is show positive aspects of new urban living. Wind fans generating electricity, parks, people planting trees on urban streets, public transportation. If you can do something abstract try emulating the 60s poster approach like a flower sticking out of a power plant smoke stack. <br> <br>Finally, you have "World Environment Day" but no date. You have to have a date. Investigate another typeface for "Green Cities" too much Gill Sans for my taste. "Where the future lives" doesn't mean anything. "Where our future lives" is somewhat better but need explaination and you have plenity of room on a poster to do it. Does the poster want someone to do something or just know the day exists. If its proactive have contact information, phone numbers</p>
