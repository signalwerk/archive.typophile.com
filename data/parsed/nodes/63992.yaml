    html: <p>You mentioned Droid Sans. I noticed from a brochure describing it that it uses Simplified Chinese characters... even when used to display Kanji for the Japanese language. Oops. Kanji mostly follow the forms of Traditional Chinese characters, but there are a few characters with uniquely Japanese modified forms. While simplified forms of characters may be desirable for legibility in a low-resolution environment, it doesn't help matters if you need to be an expert in a foreign language to know which character you're looking at.</p>
