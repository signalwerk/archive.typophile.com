      <p>Richard -- What you bring up is indeed a potential problem. </p>
      <p>The kind of confusion that Felici describes is often resolved in the actual font naming fields, as most vendors will use a unique element in their font naming (i.e., AGaramond, GaramondITC, GaramondFB, etc.) even if the name of the typeface is pretty much the same.</p>
      <p>However, there are occasions when two different typefaces will have the same name *and* the fonts themselves will also have the same naming. </p>
      <p>Several years ago, I was working on a project with Peter Bruhn's Farao fonts. I also happened to have loaded on my system Frantisek Storm's Farao fonts. Not only were the two typefaces named the same, but so were the font files, and this was causing problems. I alerted Peter and Veer to this issue (I think Storm's face came first) and suggested that, at the very least, they change their font naming to "FaraoFTN" or some such, to eliminate technical conflicts.</p>
      <p>It is also distinctly possible for different versions of the same font to exist with no distinction in the internal font naming. So, for instance, as mentioned in <a class="freelinking external" href="http://typophile.com/node/63979" rel="nofollow">another recent thread</a>, I use a different version of Georgia than most. So I don't always see exactly the same thing as others.</p>
      <p>Also, and I may be wrong about this (someone more technically savvy, like John Hudson or Karsten Luecke may be able to answer better), but I think different platforms/systems reference different name fields within a font, which may or may not contain exactly the same form of the name. So the browser examining what's already available in the local system may need to be looking for different names for the same font, depending upon the platform.</p>
