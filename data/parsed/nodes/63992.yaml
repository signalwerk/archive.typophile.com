    user: 44873
    date: 2009-12-15T08:37:00
    date_raw: 15 Dec 2009 — 8:37am
    votes: null
    html: |-
      <p>@zoltan</p>
      <p>Good. Now we're collaborating. I like it.<br>
      I had a feeling that <strong>src="//:"</strong> was bothering you and probably others.<br>
      We fear what we do not know.</p>
      <p>Where did it come from? Well, I did what I usually do: steal from the smartest people around.<br>
      What would you say if I told you that <strong>src="//:"</strong> appeared for years in jQuery, and is still being used in Javascript libraries like YUI 2 and Dojo today?<br>
      Would that give you more confidence? It's absolutely true.<br>
      As hacks go, it's about as safe and time-tested as you can get.</p>
      <p>Here's the history of using <strong>"//:"</strong> as a null URL as I understand it:</p>
      <p>When using iframes for background Ajax-like requests started in the pre-Firefox days, Internet Explorer had a problem with iframes not containing a src attribute when HTTPS: was used. (And there were situations where you wanted to create the iframe with no real src as yet.)<br>
      I believe it was around that time when someone first came up with using <strong>src="//:"</strong> as a placeholder of sorts so the iframe could have a src attribute. (Another alternative is <strong>src="javascript:void(0)"</strong>. Empty quotes like this: src="" don't work. Browsers don't like it at all.)<br>
      From there, a few years later it made it's way into the javascript libraries I mentioned as part of a way to detect the equivalent of the DOMContentLoaded event in Internet Explorer. Instead of an iframe, this time it was needed for the src attribute of a script element containing a "defer" attribute. This was worked out originally by JavaScript geniuses Dean Edwards, John Resig and also Matthias Miller and Diego Perini. (Perini's discovery that polling IE's doScroll method until it didn't return an error could be used to detect the equivalent of IE's DOMContentLoaded event eventually, after some years, supplanted the practice of using document.write to create the script tag. So jQuery no longer uses it - but it has nothing to do with anything being wrong with <strong>src="//:"</strong>.</p>
      <p>Here it is at work in the YUI utilities from 2007:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/yuiutilities2007_6339.gif"></div><p></p>
      <p>Here it is in Dojo today:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/dojosrc_5572.gif"></div><p></p>
      <p>Now, that's the pedigree of the hack.<br>
      But it's still a hack. We <em>are</em> still talking about sending the browser on a little bit of a wild goose chase until it says, "The heck with this, there's nothing there, I'm moving on." (It's just that with @font-face, IE&lt;9 considers "moving on" differently than the other browsers and that's why the hack works.)<br>
      Using it within a script tag in a test page, Firebug shows me this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/failuretoload_4901.gif"></div><p></p>
      <p>As you can see, it assumes the http: part of the URL and fills in a forward slash. No request is made to the server. Yes, there's a failure to load but the browser doesn't even try. It's not really an "error" any more than a dead link is an error but in that case a request gets made.<br>
      Is this more grammatical?<br>
      <strong>"http://:/"</strong><br>
      I haven't tested it but if it works I've got no problem with it.</p>
      <p>Let me know if this shines a more favorable light. Or whatever occurs to you.<br>
      And then, there's a way of using local() for the same purpose, but without causing any damage, that might be better than this and I'd like to run that through the mill, too.</p>
      <p>rich</p>
    html_clean: |-
