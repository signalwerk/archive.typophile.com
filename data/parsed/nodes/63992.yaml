    html: |-
      <p><em>So soon it will be: which Georgia? Not just for you but for everybody.</em></p>
      <p>Unless an update to a font introduces changes that would affect existing documents set in the older version of the font, e.g. changing widths or kerning such that lines reflowed, updates do not usually involve a change of name. In this case, you have to check the version string to know ‘which Georgia’.</p>
      <p>I'm not sure what browsers are expected to do in this regard. Probably this is an issue to raise on the W3C list. Consider, for example, if a web author has used @font-face to specify e.g. Cambria to display some Ingushetian text in Cyrillic characters. This requires the version of the font that ships with Windows 7; earlier versions of the font do no support these characters. Presumably the web author has arranged web serving of the appropriate version of the font, but what happens with font fallback in browsers that do not support the served font, or which might want to default to a local copy of the font to save bandwidth? If the local font is an earlier version than the served one, it might not support the text; on the other hand, it might.</p>
    html_clean: |-
      <p><em>So soon it will be: which Georgia? Not just for you but for everybody.</em></p>
      <p>Unless an update to a font introduces changes that would affect existing documents set in the older version of the font, e.g. changing widths or kerning such that lines reflowed, updates do not usually involve a change of name. In this case, you have to check the version string to know ‘which Georgia’.</p>
      <p>I'm not sure what browsers are expected to do in this regard. Probably this is an issue to raise on the W3C list. Consider, for example, if a web author has used @font-face to specify e.g. Cambria to display some Ingushetian text in Cyrillic characters. This requires the version of the font that ships with Windows 7; earlier versions of the font do no support these characters. Presumably the web author has arranged web serving of the appropriate version of the font, but what happens with font fallback in browsers that do not support the served font, or which might want to default to a local copy of the font to save bandwidth? If the local font is an earlier version than the served one, it might not support the text; on the other hand, it might.</p>
