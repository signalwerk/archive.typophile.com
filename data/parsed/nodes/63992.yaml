      <p>Richard: I want to start by saying what follows is an opinion, and I don't want to disrespect the fine work that you have done which led you to your "src:url(//:)" solution.  It is definitely clever.</p>
      <p>However, you also describe your solution as not standards compliant - if so, this may cause problems in future web browsers besides Opera (who knows how IE9 may handle this - IE lately has not been known for it's backward-compatible-ness).  We may be introducing something that may cause greater problems than the ones you describe.</p>
      <p>I believe that the local directive has drawbacks, but using it in the way Paul Irish does solves a lot of problems, and it is also seems to be more future-proof.  The problem you describe, I believe, would be best solved today by changing the standard.  This wouldn't help us right now, but maybe we should be suggesting to the W3C that @font-face should be augmented with an additional directive, like "signature", which would have an MD5 signature of the font file with the given URL (or some other hash function).  This signature could be used to identify a font to ensure that the "Droid Sans" is the right version of "Droid Sans".  For example:</p>
      <p>@font-face{<br>
        font-family: "Droid Sans";<br>
        src: url(‘DroidSans.eot’);<br>
        src: local(‘Droid Sans Regular’),<br>
             local(‘Droid Sans-Regular’),<br>
             url(‘/fonts/droidSans.ttf’) format(‘truetype’),<br>
             signature('a6107b3cb60d990767c464bf15264d14');<br>
      }</p>
      <p>Therefore, the browser could check "does my OS have the right version of Droid Sans?  If so, I'll use it, otherwise, I'll download it".  </p>
      <p>I know this doesn't help right now, but I'd rather work right now to fix the problem correctly then to use something that is not standards-compliant that may not work correctly later on down the line (I am going by comments made earlier that it isn't - I have not read the spec in detail).</p>
      <p>My $0.02 right now.  I will read on to see if I can be convinced otherwise. :-)</p>
      <p>Regards,<br>
      Zoltan</p>
