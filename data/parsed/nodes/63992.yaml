      <p>Sorry for my delayed response. Just so busy.</p>
      <p>Well, I think that my post was perfectly clear, so your confusion must simply be on account of the information conflicting with your own experience. If you are right and I am wrong I will be very happy. Because this was driving me nuts for about a week.</p>
      <p>The thing is, I did actually test this forwards and backwards for about a week. All of my results showed IE not using the font if the font-family name in the the @font-face rule wasn't the actual name of the font.</p>
      <p>And all my tests showed FF using the local font if the font-family name in the @font-face rule matched a locally installed font, even when no local sources were given.</p>
      <p>Perhaps I should point out that I am on Windows XP Pro SP3.</p>
      <p>I don't have time at present to jump back into this right now. If I get time in the near future I will redo my tests and link you to the test pages. But I wouldn't hold your breath on that, as I am swamped and busy playing catchup.</p>
