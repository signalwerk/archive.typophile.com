      <p><a href="http://www.typophile.com/node/63992" title="http://www.typophile.com/node/63992">http://www.typophile.com/node/63992</a></p>
      <p>fontsquirrel -- <cite>A user purchased the Museo Sans family from Exljbris. These are CFF OT fonts with OT features. Now, the Museo 500 weight is free and allows @font-face, so a budding web designer dumps it into the Font Squirrel Generator and generates a web-ready version.</cite></p>
      <p>Museo 500 is free and allows @font-face use. But this does <em>not</em> imply that it may be converted. Go to<br>
      <a href="http://new.myfonts.com/fonts/exljbris/museo-sans/500/buy.html" title="http://new.myfonts.com/fonts/exljbris/museo-sans/500/buy.html">http://new.myfonts.com/fonts/exljbris/museo-sans/500/buy.html</a><br>
      and click "commercial" to see the license. It allows @font-face ("4. Embedding") but does <em>not</em> allow modification ("5. Modifications").<br>
      For exactly this kind of wrong conclusion, I cannot say that I am particularly happy about the Font Squirrel Generator. It makes people think: It's there, so let's use it with whatever font we got. After all, and upcoming web font has not changed anything about this, if you license a font (whether paid-for or not) you do not owe it and are not allowed to do with it whatever you want ...</p>
      <p>Jos' EULA by the way is pretty concise and straight-forward. "It's legalese" is not an excuse here.&nbsp;&nbsp;;-)</p>
      <p>* * *</p>
      <p>Back to local(), I do not see the big problem.<br>
      If a font comes in two formats, like CFF-OTF and TT-OTF (or TTF), then metrics and everything should still be the same. Rasterization will differ, but that's about it. A more important issue are different font versions since these may have different character sets. Read: may, not: need to.</p>
      <p>It seems that to make sure that a site looks as expected -- which is not the case anyway across different browsers and platforms -- one better avoid local(), for potentially different font versions. I do not see any merit in using local() with fonts that are <em>not</em> among the safe web fonts. -- Not even if the fonts in question are "for free" and may have been downloaded by the user who in this case is the website viewer.</p>
