      <p>@Paul-</p>
      <p>I don't think the issue is that manipulated web fonts are getting installed on user machines (which would be a bad thing, I agree). It is more like this:</p>
      <p>A user purchased the Museo Sans family from Exljbris.  These are CFF OT fonts with OT features. Now, the Museo 500 weight is free and allows @font-face, so a budding web designer dumps it into the Font Squirrel Generator and generates a web-ready version. The new fonts are subset, converted to TTF and have hinting applied.</p>
      <p>When the user who has Museo Sans installed on his machine looks at the site in Win FF he will see the original CFF OT fonts which are rendered in grayscale anti-aliasing. Everyone else will see the font in TTF and will render in ClearType.</p>
      <p>I'm not convinced that this is a big issue yet, but could be. I'm sure there are some unforeseen consequences to using the local() approach. @john's idea of renaming the font is a good one.</p>
      <p>Anyway, designers are always clamoring for as much control as they can get. I see local() dying as more and more of them get on board and use @font-face in real life.</p>
