      <p>I ran into a problem once where the name of a font caused a problem. I don't know enough about web technology to completely understand this, but here is what happened:</p>
      <p> I stumbled on a website while at work that I seemed to have a proprietary font that I had designed being used as display type. After exchanging a few emails with the site owner I realized my computer was using a font I had called Jester for display, but the owner had an entirely different Jester. For proprietary fonts I typically don't worry about name duplication since they are for internal use only, but I can see how this can be a problem with web technology. It turned out there were at least 2 commercial fonts called Jester as well.</p>
