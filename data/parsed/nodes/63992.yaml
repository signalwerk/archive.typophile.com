  - id: 383859
    user: 49431
    date: 2009-12-14T10:36:00
    date_raw: 14 Dec 2009 — 10:36am
    votes: null
    html: |-
      <p>@quadibloc: Thanks for the heads up about Droid Sans and Kanji.  I occasionally code in Japanese, and if you're right, it is of interest to me.</p>
      <p>@richard:</p>
      <p>I hope my response has not been taking as a "pissing contest" - it wasn't meant as such.  :-)  I, too, care about getting @font-face to work today.  I just have Concerns (TM).</p>
      <p>I seem to have misinterpreted an earlier post in this thread as stating it was non-standard syntax - my apologies on that.  That said, I am still not 100% convinced that your "null URL" is valid.  From what I understand, RFC 3986 states that the scheme, or protocol part of the URL, must "consist of a sequence of characters beginning with a letter and followed by any combination of letters, digits, plus ("+"), period ("."), or hyphen ("-")."   So it must have a letter at the beginning, which your URLs doesn't have.  (The RFC can be read at <a href="http://tools.ietf.org/html/rfc3986" title="http://tools.ietf.org/html/rfc3986">http://tools.ietf.org/html/rfc3986</a>).</p>
      <p>You state that "that the URI points nowhere and the format is made-up and therefore unsupported is irrelevant."  I am just concerned that using this syntax will break something in the future (throwing an error, halting the load of a page, or some other unexpected problem), which I believe is relevant (browsers have done silly things like this in the past).</p>
      <p>Am I being too paranoid?  I wouldn't disparage anyone who makes that claim, and would wholly support you if you made it.  :-)  But there is method in my madness: serving up non-standard code to accommodate Internet Explorer has caused problems for me (and others) in the past - how many hacks that make IE6 work breaks in IE7 and 8?  The company I work with today is trying to clean this expensive mess up right now ... with me being head janitor.  :-)</p>
      <p>At the same time, I don't believe that "anything that clearly appears to accommodate IE is automatically viewed as “non-standard” and somehow dirty and unclean".  Conditional comments, for example, are a way to accommodating IE, but I use them because I don't think they will break anything down the road.  And they don't, as far as I can see, break a standard.</p>
      <p>Your comment about using "local() an unstated requirement rather than an option" is valid, and I am with you in that I hate to use it for anything but it's intended purpose. But since using local() is syntactically valid, I feel more comfortable using it at the moment.  Is it ideal?  No, but nothing that accommodates a buggy browser usually is.  And I would like to be able to handle the "two fonts named the same" issue that you raise.  I would also like to fix local() - the "humongous" file scenario is quite relevant for those who design Japanese or Chinese pages, which I have dabbled in.</p>
      <p>Totally agree with you on the spec missing something.  Hopefully this is something we should be taking to the W3C so they can fix it in an appropriate way.  My "solution" is a possible one, which doesn't look for the latest version of a font - just the one the designer intended to use.  I don't know whether it is right or wrong - just me thinking out loud.  </p>
      <p>Forgive me if I seem too opinionated - but I hope my paranoia seems justified.  :-)</p>
      <p>Z.</p>
