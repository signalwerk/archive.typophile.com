    html: |-
      <p>@all</p>
      <p>There's an unstated secondary technical consideration at work here that should be stated for anyone who drops by and simply says, "Well, if it's a problem, why don't you just not use the local() descriptor?".<br>
      Unfortunately it's not as simple as that and it has to do with Internet Explorer's legacy behavior.</p>
      <p>Some months ago it was discovered that, when presented with CSS syntax like this:</p>
      <p>@font-face{<br>
      font-family: somefont;<br>
      src: url(‘http://mysite.com/fonts/somefont.eot’);<br>
      src: url(‘http://mysite.com/fonts/somefont.ttf’) format(‘truetype’);<br>
      }</p>
      <p>Internet Explorer attempts to find a font file by resolving all the text between the opening and closing parens in the second "src:" rule as something like this:</p>
      <p>“http://mysite.com/fonts/somefont.ttf)formattruetype”</p>
      <p>This wastes time and ends up with Internet Explorer getting sent a "404" from the server. Worse, the second "src:" rule overwrites the previous rule so that in Internet Explorer “font-family: somefont” has no font associated with it at all.</p>
      <p>At that time, I came up with a workaround: a dummy IE “blocker” rule that gets listed first in the ruleset.<br>
      Like this:</p>
      <p>src: url('//:') format('IE-No404'),url(‘somefont.ttf’)format(‘truetype’);</p>
      <p>Which works fine to prevent IE's unwanted behavior and does not require using the local() descriptor if you don't want to.<br>
      I posted about it to the W3C web fonts mailing list:<br>
      <a href="http://lists.w3.org/Archives/Public/www-font/2009JulSep/1361.html" title="http://lists.w3.org/Archives/Public/www-font/2009JulSep/1361.html">http://lists.w3.org/Archives/Public/www-font/2009JulSep/1361.html</a><br>
      and also my blog:<br>
      <a href="http://readableweb.com/mo-bulletproofer-font-face-css-syntax/" rel="nofollow">Mo' Bulletproofer @Font-Face CSS Syntax</a></p>
      <p>These contain all the reasons why I felt it was preferable to just deal with IE's peculiarities and stay away from using local(). (There were also some issues with getting that syntax to work with the Opera browser at that time.)<br>
      This was all well before the problems with font naming became as clear as they are now.</p>
      <p>However, prior to my suggestion, another syntax suggested by Paul Irish – more elegant-looking and less suspicious of local() than mine - had already begun making the rounds. Paul’s been blogging a lot longer than me, gets higher search rankings I'm sure, and it's a fair bet he's in contact with a lot more people in the web development community than I am.<br>
      So Paul’s suggested syntax has seen more use than mine – including the demo pages provided with FontSquirrel’s @font-face packages.<br>
      It looks like this:</p>
      <p>@font-face{<br>
           font-family: somefont;<br>
           src: url(‘somefont.eot’);<br>
           src: local(‘Somefont Sans 500’),<br>
                local(‘SomefontSans-500’),<br>
                url(‘somefont.ttf’) format(‘truetype’);<br>
           }</p>
      <p>Using this syntax, the local() descriptor acts in two capacities. One is obvious and standard compliant, and the other is hidden and non-standard.<br>
      The first capacity is as a mechanism to query the local operating system to see if it has a font named “Somefont Sans 500” or, on the Mac, “SomefontSans-500”. If found, the installed font with that name is used instead of the font specified in the “src” URI. This, of course, is exactly the intended purpose of the local descriptor. It’s how it was designed to work as per the standard.<br>
      However, the second, hidden and non-standard capacity is as a mask so that, once again, Internet Explorer skips the second "src:" rule and does not waste time looking for a non-existent resource on a server that returns a 404. Internet Explorer encounters: "src:local(......)" and skips the entire rule.<br>
      In this fashion, the local() descriptor does double-duty. But you *must* include local whether it does any good or not.<br>
      (BTW - Paul and I have communicated quite frequently. We're not strangers.)</p>
      <p>So back then, I considered Paul's recommended syntax and mine as pretty much six of one, half a dozen of the other. Although I can't say I didn't still feel like the local()/font-naming thing didn't feel like a time bomb to me. Intuitively and intellectually, it just did.<br>
      And that's why I started this thread - to first, ask the experts and get their opinion. But now, facts unfolding on the ground are making things much clearer.</p>
      <p>Now we’re discovering that local() has serious drawbacks. If there was no other concern, the answer would be to simply not use it.</p>
      <p>Like this:</p>
      <p>	src: url(‘somefont.eot’);<br>
      	src: url(‘somefont.ttf’) format(‘truetype’);</p>
      <p>But as has just been discussed, that won’t work for Internet Explorer.</p>
      <p>So, we’re back now to using this masking rule:</p>
      <p>src: url('//:') format('IE-Mask')</p>
      <p>And the question is whether to continue to combine the rules for Internet Explorer with the rules for all other browsers like this:</p>
      <p>@font-face{<br>
           font-family: somefont;<br>
           src: url(‘somefont.eot’);<br>
           src: url(‘//:’)format(‘IE-Mask’),<br>
                url(‘somefont.ttf’) format(‘truetype’);<br>
           }</p>
      <p>Or accept some redundancy and split the rules for Internet Explorer off into their own corner, like this:</p>
      <p>@font-face{<br>
           font-family: somefont;<br>
           src: url(‘somefont.eot’);<br>
           }<br>
      @font-face{<br>
           font-family: somefont;<br>
           src: url(‘//:’)format(‘IE-Mask’),<br>
                url(‘somefont.ttf’) format(‘truetype’);<br>
           }</p>
      <p>To make the long story short, there are arguments for and against either approach which I won't go into here.</p>
      <p>To sum up - that's the complicating technical backdrop behind this discussion of whether or not using local() is a good idea.</p>
      <p>@paulirish</p>
      <p>Paul,</p>
      <p>I'm not understanding you on this at all. Do you see this as a "user freedom" issue of some kind? And, while a smart thing to do I think, how does John's suggestion solve the problem? It doesn't.<br>
      Please explain, I'm befuddled by your comments.</p>
    html_clean: |-
      <p>@all</p>
      <p>There's an unstated secondary technical consideration at work here that should be stated for anyone who drops by and simply says, "Well, if it's a problem, why don't you just not use the local() descriptor?".<br>
      Unfortunately it's not as simple as that and it has to do with Internet Explorer's legacy behavior.</p>
      <p>Some months ago it was discovered that, when presented with CSS syntax like this:</p>
      <p>@font-face{<br>
      font-family: somefont;<br>
      src: url(‘http://mysite.com/fonts/somefont.eot’);<br>
      src: url(‘http://mysite.com/fonts/somefont.ttf’) format(‘truetype’);<br>
      }</p>
      <p>Internet Explorer attempts to find a font file by resolving all the text between the opening and closing parens in the second "src:" rule as something like this:</p>
      <p>“http://mysite.com/fonts/somefont.ttf)formattruetype”</p>
      <p>This wastes time and ends up with Internet Explorer getting sent a "404" from the server. Worse, the second "src:" rule overwrites the previous rule so that in Internet Explorer “font-family: somefont” has no font associated with it at all.</p>
      <p>At that time, I came up with a workaround: a dummy IE “blocker” rule that gets listed first in the ruleset.<br>
      Like this:</p>
      <p>src: url('//:') format('IE-No404'),url(‘somefont.ttf’)format(‘truetype’);</p>
      <p>Which works fine to prevent IE's unwanted behavior and does not require using the local() descriptor if you don't want to.<br>
      I posted about it to the W3C web fonts mailing list:<br>
      <a href="http://lists.w3.org/Archives/Public/www-font/2009JulSep/1361.html" title="http://lists.w3.org/Archives/Public/www-font/2009JulSep/1361.html" class="link-external">http://lists.w3.org/Archives/Public/www-font/2009JulSep/1361.html</a><br>
      and also my blog:<br>
      <a href="http://readableweb.com/mo-bulletproofer-font-face-css-syntax/" rel="nofollow" class="link-external">Mo' Bulletproofer @Font-Face CSS Syntax</a></p>
      <p>These contain all the reasons why I felt it was preferable to just deal with IE's peculiarities and stay away from using local(). (There were also some issues with getting that syntax to work with the Opera browser at that time.)<br>
      This was all well before the problems with font naming became as clear as they are now.</p>
      <p>However, prior to my suggestion, another syntax suggested by Paul Irish – more elegant-looking and less suspicious of local() than mine - had already begun making the rounds. Paul’s been blogging a lot longer than me, gets higher search rankings I'm sure, and it's a fair bet he's in contact with a lot more people in the web development community than I am.<br>
      So Paul’s suggested syntax has seen more use than mine – including the demo pages provided with FontSquirrel’s @font-face packages.<br>
      It looks like this:</p>
      <p>@font-face{<br>
           font-family: somefont;<br>
           src: url(‘somefont.eot’);<br>
           src: local(‘Somefont Sans 500’),<br>
                local(‘SomefontSans-500’),<br>
                url(‘somefont.ttf’) format(‘truetype’);<br>
           }</p>
      <p>Using this syntax, the local() descriptor acts in two capacities. One is obvious and standard compliant, and the other is hidden and non-standard.<br>
      The first capacity is as a mechanism to query the local operating system to see if it has a font named “Somefont Sans 500” or, on the Mac, “SomefontSans-500”. If found, the installed font with that name is used instead of the font specified in the “src” URI. This, of course, is exactly the intended purpose of the local descriptor. It’s how it was designed to work as per the standard.<br>
      However, the second, hidden and non-standard capacity is as a mask so that, once again, Internet Explorer skips the second "src:" rule and does not waste time looking for a non-existent resource on a server that returns a 404. Internet Explorer encounters: "src:local(......)" and skips the entire rule.<br>
      In this fashion, the local() descriptor does double-duty. But you *must* include local whether it does any good or not.<br>
      (BTW - Paul and I have communicated quite frequently. We're not strangers.)</p>
      <p>So back then, I considered Paul's recommended syntax and mine as pretty much six of one, half a dozen of the other. Although I can't say I didn't still feel like the local()/font-naming thing didn't feel like a time bomb to me. Intuitively and intellectually, it just did.<br>
      And that's why I started this thread - to first, ask the experts and get their opinion. But now, facts unfolding on the ground are making things much clearer.</p>
      <p>Now we’re discovering that local() has serious drawbacks. If there was no other concern, the answer would be to simply not use it.</p>
      <p>Like this:</p>
      <p>	src: url(‘somefont.eot’);<br>
      	src: url(‘somefont.ttf’) format(‘truetype’);</p>
      <p>But as has just been discussed, that won’t work for Internet Explorer.</p>
      <p>So, we’re back now to using this masking rule:</p>
      <p>src: url('//:') format('IE-Mask')</p>
      <p>And the question is whether to continue to combine the rules for Internet Explorer with the rules for all other browsers like this:</p>
      <p>@font-face{<br>
           font-family: somefont;<br>
           src: url(‘somefont.eot’);<br>
           src: url(‘//:’)format(‘IE-Mask’),<br>
                url(‘somefont.ttf’) format(‘truetype’);<br>
           }</p>
      <p>Or accept some redundancy and split the rules for Internet Explorer off into their own corner, like this:</p>
      <p>@font-face{<br>
           font-family: somefont;<br>
           src: url(‘somefont.eot’);<br>
           }<br>
      @font-face{<br>
           font-family: somefont;<br>
           src: url(‘//:’)format(‘IE-Mask’),<br>
                url(‘somefont.ttf’) format(‘truetype’);<br>
           }</p>
      <p>To make the long story short, there are arguments for and against either approach which I won't go into here.</p>
      <p>To sum up - that's the complicating technical backdrop behind this discussion of whether or not using local() is a good idea.</p>
      <p>@paulirish</p>
      <p>Paul,</p>
      <p>I'm not understanding you on this at all. Do you see this as a "user freedom" issue of some kind? And, while a smart thing to do I think, how does John's suggestion solve the problem? It doesn't.<br>
      Please explain, I'm befuddled by your comments.</p>
