      <blockquote><p><em>“In my early experiments w/ Chank Diesel - he sent over some tweaked fonts, and he obviously has his own fonts installed on his system - so if the CSS I wrote matched a font installed on his system - it loaded the local font, rather than the hosted, tweaked one.”</em></p></blockquote>
