    html: |-
      <p>My initial thought is that webfonts should probably be differently named from user installed fonts. There are many legitimate reasons why the version of a font served to a website might be different from the version of a font that might be installed on a user's system, and this may affect everything from character set support to outline/hint format to OpenType Layout capabilities. Simply put, if a web developer wants to be reasonably sure that the content of a site will be displayed correctly using a served font, then it is necessary to ensure that the served font, and not a local version, is used.</p>
      <p>Ergo, if I were selling licenses for webfonts, I would ship those fonts with different names from the existing desktop versions of the same design, e.g. 'MyFont WF' instead of 'MyFont', or even with a name that links the font to the customer in some way.</p>
