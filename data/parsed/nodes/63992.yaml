    html: |-
      <p>Summing up feels like the thing to do at this point. New Year coming.</p>
      <p>1) Going forward, there will be many different variations of the same font, with the same name, but with different file sizes, file formats (TTF/OTF), character sets, and variations in quality.</p>
      <p>2) Further, as became clear in Thomas Phinney's thread here on Typophile: <a href="http://typophile.com/node/64468" rel="nofollow"><br>
      Web fonts, Free fonts, and modification requirements</a>, many "open" licenses which permit derivative works, require the derivative font to be renamed. This means that going forward there will also be many different variations of the same font, but with a different name, different file size, file format, character set, and variations in quality.</p>
      <p>3) As the use of @font-face grows, the number of installed fonts on the machines of web designers and developers is sure to grow right along. And it is these people - the authors of web pages - that the use of the local() descriptor is most likely to mislead. And this is most likely to occur during the development process when the font is most likely to be installed, as a convenience, in the operating system. In other words, at the very time when true and accurate results are needed most.</p>
      <p>All of this - taken along with the other observations by myself and others on this thread - makes an overwhelming argument against giving preference to the font installed on the local operating system as opposed to the one posted on the web server. A font identifiable only by its name can be anything. The font file posted on your web server is the only one you can trust.</p>
      <p>Except in very unusual circumstances, keep away from using the local() descriptor to give preference to a font based solely on its name.</p>
      <p>And so, for now, the only CSS @font-face syntax I can wholeheartedly recommend is the one using the "Impossible URL" hack originally presented in <a href="http://readableweb.com/mo-bulletproofer-font-face-css-syntax/" rel="nofollow">Mo' BulletProofer @Font-Face CSS Syntax</a> but amended slightly to conform to the URL naming rules in the RFC cited by Zoltan.</p>
      <p>Like so:</p>
      <p> @font-face{ /* for IE */<br>
        font-family: FishyFont;<br>
        src: url(fishy.eot);<br>
       }<br>
       @font-face { /* for non-IE */<br>
        font-family: FishyFont;<br>
        src: url("http://:/") format("No-IE-404"),<br>
        url("fishy.ttf") format("truetype");<br>
       }</p>
      <p>I will be doing some renewed testing over the next few weeks and if any hidden "gotchas" show up, I shall return.</p>
      <p>Regards,</p>
      <p><a href="http://readableweb.com" rel="nofollow">Rich</a></p>
