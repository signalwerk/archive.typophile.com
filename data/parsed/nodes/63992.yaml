    user: 44873
    date: 2009-12-14T07:54:00
    date_raw: 14 Dec 2009 — 7:54am
    votes: null
    html: |-
      <p>@zoltan</p>
      <p>Thanks for accepting my invitation to comment.</p>
      <p><em>you also describe your solution as not standards compliant</em><br>
      Not true. I didn't say that anywhere. And thanks for kind of proving my point that anything that clearly appears to accomodate IE - which <strong>is</strong> my intention - is automatically viewed as "non-standard" and somehow dirty and unclean. (Hah! ;)</p>
      <p>Syntactically speaking, there's nothing non-standard about this:</p>
      <p>  src:url('//:')format('IE-Mask'),</p>
      <p>It's an unparseable or "null" URI followed by a custom format hint. That the URI points "nowhere" and the format is made-up and therefore unsupported is irrelevant.<br>
      It's syntactically standards-compliant - unless I'm misreading the CSS3 specification. (If I'm wrong, please come back and show me. I'll gladly retract.)<br>
      To me, using local() strictly because it blocks IE's attempt to parse the rule and make a request to the server is what's non-compliant. It makes local() an unstated requirement rather than an option. It makes it non-removable and <strong>that's</strong> non-standard.</p>
      <p><em>I believe that the local directive has drawbacks, but using it in the way Paul Irish does solves a lot of problems</em><br>
      It solves only one problem and in a non-standard way - it blocks IE's legacy behavior. (What other ones get solved?) And, as we're just beginning to see, it brings back the very problem @font-face is designed to solve.<br>
      <strong>All I care about is getting @font-face to work with as few hiccups as possible.</strong> This ain't a pissin' contest.<br>
      local() is for edge cases. I have trouble conceiving a scenario where it would make sense - except in the "humongous" file scenario I described earlier. There may be others, but I don't see them right now.</p>
      <p>I think we agree that the specification, as it now exists, feels like it's missing something as far as accurately identifying the font version. But in a world where font mash-ups are ordinary - and if the web of the recent past is any guide, that's where we're headed - I don't easily see how an identifier can remain reliable.<br>
      Plus, I don't even see why, for purposes of web design, it should be. Do we check for the latest "version" of an image before the browser requests it?<br>
      No. It is what it is - and it's under our control so what's the problem?<br>
      (But I don't mean to dismiss your idea/sample - it's worth more thought and discussion, most definitely. I want all the tools I can get.)</p>
      <p>Thanks again!</p>
      <p>Regards, rich</p>
