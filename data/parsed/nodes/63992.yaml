  - id: 387464
    user: 44873
    date: 2010-01-06T06:58:00
    date_raw: 6 Jan 2010 — 6:58am
    votes: null
    html: |-
      <p>@lampica</p>
      <p>In the absence of more clearly defined terms and a look at your test pages, I can't understand much of what you're saying. And that which I think I do understand is, at best, misleading. I don't mean to be rude, it just is.</p>
      <p>How did you reach the conclusion that:<br>
      "Firefox always prefers local fonts"?<br>
      Always prefers local fonts when?<br>
      If the CSS contains this:</p>
      <p>@font-face{<br>
      font-family: verdana;<br>
      src:url('crazyfont.ttf')format('truetype);<br>
      }</p>
      <p>For any page on which this CSS is used, the font Verdana as it's installed locally, does not exist. Wherever else in the document the font-family name Verdana is used in a font stack, Firefox will display the font contained in 'crazyfont.ttf'. *Not* the Verdana font from the OS. The @font-face assignment takes precedence over any font matching the name "Verdana" provided by the OS.<br>
      However, if you want the locally installed copy of Verdana to be used as a fallback font in case "crazyfont.ttf" doesn't load or is corrupted in some way, my initial test shows that writing this:</p>
      <p>font-family: Verdana, sans-serif;<br>
      or<br>
      font-family: Verdana, Verdana, sans-serif;</p>
      <p>Will display the locally installed Verdana as a fallback in the event the assignment of the name "Verdana" fails in the @font-face rule.</p>
      <p>(I have to see what the CSS3 spec has to say on this. And add a test for this to my collection.)</p>
      <p><em>IE will also not use custom fonts at all if the font-family name defined by the CSS does not actually match the name of the font.</em></p>
      <p>This is incorrect. I've tested hundreds of different fonts with IE using a CSS "alias" name in the @font-face rule that does not match any name in the font file's internal name table.</p>
      <p>If you have any pages containing examples to back up what you're saying, please post links. That would clear up any misunderstanding.</p>
      <p>Rich</p>
