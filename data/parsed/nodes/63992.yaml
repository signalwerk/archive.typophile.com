      <p>@fontsquirrel<br>
      <em>I don’t think the issue is that manipulated web fonts are getting installed on user machines (which would be a bad thing, I agree).</em><br>
      Ethan - if you're still tuned in - Why is this a bad thing?<br>
      (I'm not saying it's a good thing. But to me, it's neither good nor bad. It's just another thing to be taken into account. But why bad?)</p>
      <p>@k.l.<br>
      <em>It seems that to make sure that a site looks as expected — which is not the case anyway across different browsers and platforms — one better avoid local(), for potentially different font versions. I do not see any merit in using local() with fonts that are not among the safe web fonts. — Not even if the fonts in question are “for free” and may have been downloaded by the user who in this case is the website viewer.</em><br>
      Agreed. That anyone would put more trust in the font installed in the operating system is, I think, a holdover from fifteen years of having no other choice <em>but</em> to trust the font installed in the operating system. When you've been imprisoned for so long, freedom can be a bewildering thing. It's like we're out on parole and living in a "halfway" house.<br>
      It will take awhile for the mindset of the average web author to change from "fonts are an OS thing and I have no choice but to accept what it gives me" to "fonts are a server thing and <strong>I</strong> make the choices". </p>
      <p>@all</p>
      <p>More variations on the Museo theme.<br>
      This one is the presumably up-to-the-minute authentic one from the Museo 500 page at <a href="http://new.myfonts.com/fonts/exljbris/museo/500/" rel="nofollow">Myfonts.com</a>:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/museo500otf126kb_4582.gif"></div><br>
      This makes it <strong>three versions</strong> of Museo 500 floating around. As web authors, which ones are installed on who's machine, we can never know for certain. All we can know for certain is what font file is on our web server.<p></p>
      <p>Found two different versions of Museo Sans as well:<br>
      This one from the Museo Sans 500 page at <a href="http://new.myfonts.com/fonts/exljbris/museo-sans/500/" rel="nofollow">Myfonts.com</a>:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/museosans500otf62kb_4197.gif"></div><p></p>
      <p>And this one from Jonathan Snook's article <a href="http://snook.ca/archives/html_and_css/becoming-a-font-embedding-master" rel="nofollow">Becoming A Font Embedding Master</a></p><div class="imageWrap"><img src="http://typophile.com/files/museosans500ttf18kb_4497.gif"></div><p></p>
      <p>rich</p>
