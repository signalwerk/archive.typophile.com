      <p><em>“A decision is a judgment. It is a choice between alternatives. It is rarely a choice between right and wrong. It is at best a choice between "almost right" and "probably wrong" - but much more often a choice between two courses of action neither of which is provably more nearly right than the other.”</em></p>
      <p>      - Peter Drucker</p>
      <p>@fontsquirrel</p>
      <p><em>I’m not convinced that this is a big issue yet, but could be. I’m sure there are some unforeseen consequences to using the local() approach.</em></p>
      <p>The problem is, how long does one wait for more anecdotal evidence to pile up before acting? Isn't there enough now to extrapolate, weigh probabilities, and reassess?</p>
      <p>In my mind, the issue of "best practice" - a basic default approach to a CSS @font-face syntax is now clear.<br>
      One course absolutely does invite problems - we already know this. Maybe big problems, maybe small. The other course avoids problems and has no downside. Choosing which one to use is now a no-brainer.</p>
      <p>Miscellaneous Considerations/Observations:</p>
      <p>1) local() is not an option for Internet Explorer users. The font downloads and is used whether it exists locally or not. This is a condition which will persist for many years.<br>
      (Me arse was unavailable for comment, JH.)</p>
      <p>2) Using the IE mask hack does not preclude using local() for those browsers that support it.<br>
      You just write this:<br>
       @font-face{<br>
       &nbsp;font-family: somefont;<br>
       &nbsp;src:local(‘Somefont Sans 500’),<br>
       &nbsp;local(‘SomefontSans-500’),<br>
       &nbsp;url(‘//:’)format(‘IE-Mask’),<br>
       &nbsp;url(‘somefont.ttf’) format(‘truetype’);<br>
       &nbsp; &nbsp;}</p>
      <p>No big deal.<br>
      Plus this would presumably include IE9. Which means that, in all probability, the @font-face rules for IE&lt;9 will be roped off within conditional comments. This weighs towards using the "redundant declaration" approach I wrote about.</p>
      <p>3) I suspect that resistance to the IE mask hack is a part of the resistance among many in the web development community (but certainly not all) to *anything* that appears to accomodate Internet Explorer users.<br>
      Personally, I can't fathom a philosophy that says it's OK to deliver a less than optimal experience to 60%+ of web users, not because there is no way to do so, but simply because they're not using the browser you prefer. But that's me. I like to stay as employable as possible.</p>
      <p>4) Lastly, the whole point of @font-face is to give web authors control over typefaces and typography. What's the point of it if you're going to cede control back to the operating system by querying with local()?<br>
      The only upside is, if there is a font by that name found, there is no download of the font and there's a quicker rendering of the page.<br>
      Now, there may be instances where that's a fair bargain: taking the chance that the font installed locally is in some way deficient in exchange for avoiding a huge font download.<br>
      And that's fine - but that's the exception, not the rule. And in those situations where that seems like a fair bargain, local() can be used. Sort of like a credit card - you take it out when you've found something you want to buy and you're at the register - you don't take it out in the parking lot and walk around the store with it in your hand.<br>
      Since there's an alernative that doesn't disable IE, the default approach should be no "local()".</p>
      <p>Regards,</p>
      <p>rich</p>
      <p>BTW - I am curious about how this might impact offline browsing. I have to test.<br>
      It's just the beginning, folks!</p>
