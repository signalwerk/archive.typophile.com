      <p><cite> &gt; And then there’s the complication of the author of the web page having the option of naming the font anything they want, pretty much. And what if that name conflicts with a font in the OS?</cite></p>
      <p>Maybe I'm not understanding the @font-face implementation adequately, but my understanding is that any author name designation is just a convenient handle within the CSS. It is then associated with a URL source, which is what gets downloaded and stored in cache for rendering the page(s). In this case, the URL is identified with the specific [external] file name.</p>
      <p>If the author makes use of the "local" attribute, then the name is going to have to be the same as whatever name the system utilizes (right?) in order for the browser to accept that the font is available locally and not bother to download the URL-linked source.</p>
      <p>I don't see how an author-attributed handle can conflict with a font in the OS. What am I missing?</p>
