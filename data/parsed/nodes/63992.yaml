    user: 44873
    date: 2009-12-10T11:10:00
    date_raw: 10 Dec 2009 — 11:10am
    votes: null
    html: |-
      <p>@all</p>
      <p>I wasn't expecting to find an example of this problem so early on in the life of @font-face but I did today.<br>
      I'm now convinced that this is a phenomenon that will become more and more likely the more @font-face is used. I can't see it any other way.</p>
      <p>The font involved is Museo by Jos Buivenga.</p>
      <p>This page:<br>
         <a href="http://www.giordanopiazza.com/candybox/web-fonts-embedding/" title="http://www.giordanopiazza.com/candybox/web-fonts-embedding/">http://www.giordanopiazza.com/candybox/web-fonts-embedding/</a><br>
      names the font in the local() descriptor as this:<br>
      src:local("Museo 500"),local("Museo-500"),<br>
          url("Museo500-Regular.ttf") format('truetype');</p>
      <p>The file is a 29 kb TTF.</p>
      <p>This page:<br>
      <a href="http://nicewebtype.com/fonts/museo-and-sans/" title="http://nicewebtype.com/fonts/museo-and-sans/">http://nicewebtype.com/fonts/museo-and-sans/</a><br>
      names the font in the local() descriptor as this:<br>
      src:local("Museo 500"),local("Museo-500"),<br>
          url("type/Museo500-Regular.otf") format("opentype");</p>
      <p>But it's a 42kb OTF.</p>
      <p>Named the same but ain't the same:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/museo500ttf29kb_3873.gif"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/museo500otf42kb_5015.gif"></div><p></p>
      <p>With all of the slicing and dicing and subsetting and whatnot that @font-face will bring forth, in a year's time there might be a thousand Museo 500's floating around.<br>
      Some of them might be more popular and see more use than the original, "authentic" font by Jos Buivenga.<br>
      And some of them will undoubtedly be installed in the OS.<br>
      And so, writing this: <strong>local("Museo 500")</strong>, becomes a bit of a crap shoot.<br>
      (It won't be the first time unforeseen conditions brought on by actual usage render useless what seemed at the time like a smart feature.)</p>
      <p>One of the promises of @font-face was that it would - in the context of web design - change fonts from variables into constants. It's supposed to take the guesswork out of adding fonts to web pages, not add to it.</p>
      <p>I'm not quite ready to say, "Best practice is to avoid the local() descriptor in all but exceptional cases" but it's sure starting to shape up that way.</p>
      <p>In the words of the old quiz show, <em>What's My Line</em>:<br>
      "Will the real Museo 500 please stand up?"</p>
      <p>Regards,</p>
      <p><a href="http://readableweb.com" rel="nofollow">rich</a></p>
