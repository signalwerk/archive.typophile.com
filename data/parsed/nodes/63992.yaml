      <p>Richard--</p>
      <p>I'm brand new to this site and to this sort of thing. And particularly new to the problem you raise since I still do not have my own website.</p>
      <p>However, here's one solution that I think gets around both the copyright issue and the reproduction (as you would like it) issue. But I'm not a lawyer, don't even play one in the shower.</p>
      <p>It occurs to me that for isolated pieces of text, i.e., headlines, call-outs, initial caps, or even short pieces of body type, etc., you may want to consider creating the text in the font you desire, then making a "picture" of that text, then place the picture on the page where your design calls for it.</p>
      <p>By picture, that could be a screen shot, or perhaps a copy of text set up in Photoshop where you have control of color of text/background, size, and file type.</p>
      <p>You may need to experiment with how different browsers reproduce the image you choose and where they put it and what size. And as a practical concern, how such a solution may adversely affect loading time. </p>
      <p>I know that some designers do this for stand-alone logos. I'm unaware of anyone doing that for inline (with text) work.</p>
      <p>For what it's worth.</p>
      <p>--rlk</p>
