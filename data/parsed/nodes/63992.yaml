    <p>Before I go Googling willy-nilly, I'd appreciate some feedback about how frequently it happens that a font from one source is named the same as a font from another.<br>
    I'll explain why I'm asking in a moment.<br>
    First, there's this, from James Felici's <em>The Complete Manual of Typography</em>:</p>
    <p> "Certain typeface names have been copyrighted, but many are in the common domain. This can create enormous confusion when specifying a particular type-face for a job. Take Bodoni, for example. Nearly every large type foundry has a typeface modeled on the ones made popular by their namesake. The same is true for typefaces based on the designs of Baskerville, Caslon, and Garamond and those based on stylistic characteristics, such as Clarendon, Egyptian, or Gothic. Some popular typefaces are produced by many vendors, but they are not necessarily the vendors (such as M. Olive and Fundicion Tipografica Neufville) who hold the copyright on a typeface's name and design (Antique Olive and Futura, respectively).<br>
     The upshot is that it's important to be precise about not only the names of the typefaces you use but also which vendors their fonts come from."</p>
    <p>The reason I'm asking has to do with using fonts in web pages.<br>
    When using @font-face in Firefox, Opera, Safari, and Chrome, there is the option of asking the browser to look first in the operating system to see if there is a font of a particular name and, if it finds one, using that one instead of going to the trouble of downloading the font file.<br>
    It's called the local descriptor.<br>
    In context, when used in a style sheet, it looks like this:<br>
    @font-face{<br>
    font-family:bembo;<br>
    src:local("bembo"),url("http://fonts/bembo.ttf")format("truetype");<br>
    }</p>
    <p>Two potential problems I'm trying to scope out:<br>
    1) As Felici suggests, there can many different Bembos. What's the probability of confusion here?<br>
    2) There is no provision for detecting the font <em>version</em>. Fonts aren't static things, there are revisions and additions. Specifying a font by name only is inadequate for this.</p>
    <p>So, how prevalent are different fonts named the same?<br>
    (Thanks, in advance, for any feedback. Specific examples extremely welcome.)</p>
