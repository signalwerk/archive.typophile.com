      <p>@zoltan</p>
      <p>We might have a winner!</p>
      <p><em>From what I understand, RFC 3986 states that the scheme, or protocol part of the URL, must “consist of a sequence of characters beginning with a letter and followed by any combination of letters, digits, plus (“+”), period (“.”), or hyphen (“-“).” So it must have a letter at the beginning, which your URLs doesn’t have. (The RFC can be read at <a href="http://tools.ietf.org/html/rfc3986" title="http://tools.ietf.org/html/rfc3986">http://tools.ietf.org/html/rfc3986</a>).</em></p>
      <p>I just tested: src:url("http://:/")format("IE-Mask")</p>
      <p>I'm getting exactly the same results as src="//:" and it conforms to the syntax in the RFC.<br>
      Beyond reproach and future-proof.<br>
      BTW - the <strong>format('IE-Mask')</strong> part of it is optional, as per the CSS3 spec. I'm just including it as a label, revealing the rule for what it is.<br>
      More future-proofing.<br>
      So that ten years from now when IE6, 7, and 8 are dead and gone, the next individual charged with janitorial work can recognize it as obsolescent garbage and sweep it away.</p>
      <p>I'll be testing it some more but I just can't see any griping about this anymore. Thanks for the RFC reference.</p>
      <p>rich</p>
