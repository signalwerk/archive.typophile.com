      <p>@quadibloc</p>
      <p>I understand what you're saying - there's a lot of recycling of old fonts from the print era that get digitized and renamed. However, what I was asking about here was sort of the opposite - the same name applied to fonts that are demonstrably different - even if they are similar. Two fonts can both be named "Minion" and look very similar but they can have different character sets, different kerning pairs, hinting, etc... but yet the browser calls the font from the operating system using only a name which can be the same for both fonts.</p>
