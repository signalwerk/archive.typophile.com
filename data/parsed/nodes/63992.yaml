    html: |-
      <p>I think that you guys are still missing a small piece of the puzzle here.</p>
      <p>In my testing I have found that:</p>
      <p>1)Firefox will use local fonts even if you don't define any, provided the font-family name matches a font on the local system. If the font-family name is identical then no local sources need to be defined for FF to use the local version. So Firefox always prefers local fonts, and the local source parameters seem to just be there to help it find local sources with 'different' names. Not a problem, because you can just define a different name for the font-family. (though I do think that this is not the best behavior and I hope FF will fix it)</p>
      <p>2)IE will never use local fonts. IE will also not use custom fonts at all if the font-family name defined by the CSS does not actually match the name of the font. Not the file name, the actual font name. If the font-family name defined in the CSS is different than the actual font name then IE will just go to the next font in the stack.</p>
      <p>What this means is that if you use a single rule to serve fonts to both IE and FF then it must use the actual font name (for IE) and FF will use local versions of the font if any version exists with that name.</p>
      <p>I determined early on that using local versions of fonts would be problematic. In view of the issues above it would seem that the only solution is to use separate @font-face rules for IE only.</p>
