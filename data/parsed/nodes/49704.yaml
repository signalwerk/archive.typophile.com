      <p>I found this page of ‘font aliases’ interesting: <a href="http://desktoppub.about.com/cs/findafont/a/fontaliases_o.htm" title="http://desktoppub.about.com/cs/findafont/a/fontaliases_o.htm">http://desktoppub.about.com/cs/findafont/a/fontaliases_o.htm</a></p>
      <p>It suggests clones named</p>
      <p>* CG Omega<br>
      * Optimum DTC<br>
      Ottawa<br>
      * Zapf Humanist 601 BT<br>
      Athena<br>
      Chelmsford/II<br>
      Musica<br>
      October<br>
      Optimist<br>
      Orleans<br>
      Ursa<br>
      Zenith</p>
      <p>I was able to find the ones with * asterisks online easily (and Zapf Humanist everywhere, of course), and they are at first glance precise copies of Optima. No interesting variants. My few type books are all very above-board and legitimate, so they don’t have the shady stuff. Nor have I seen any reference to legitimate, licensed variants of Optima. But my resources are few.</p>
