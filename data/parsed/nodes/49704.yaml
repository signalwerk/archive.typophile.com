      <p>No replies yet. I’ve got a bit more information. I actually contacted the game designer, who says that Optima was specified from the beginning. This means either the printer said “oh, this one’s close enough,” or the printer had a face that was called Optima, but wasn’t real Optima. I expect it’s the latter, because the text face of these early books is an odd, corrupted form of Univers, with the e and a couple of other letters much too condensed for the rest of the face. When the display face becomes real Optima in later books and printings, the text becomes real Univers.</p>
      <p>I have also found examples of both Q and J. J is more or less identical to Optima. Q is quite different from Optima, with the tail a straight bar crossing from inside the bowl to well below the line at about a 45 degree angle. (I can scan if anyone’s interested.)</p>
      <p>If I’m right about the face, though, probably the only hope of finding it would be in the catalogue of whatever company sold the font, back in the ’70s. I can always hope, though...</p>
