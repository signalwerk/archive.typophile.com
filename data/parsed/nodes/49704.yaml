      <p>Sorry I didn’t catch this thread earlier. I recognized this right away. It’s Chelmsford, the clone of Optima that AM (Addressograph Multigraph) had for their typesetting equipment. I always hated what they did to poor Optima, making seemingly random and pointless changes to a few letters, apparently to avoid being accused of font piracy. I still cringe every time I see it—which isn’t often anymore, but happens. There is a trucking company that still uses it, so I see it whizz by on the freeway now and then.</p>
      <p>AM had the oddest taste in naming their knock-offs: Melior was called Mallard; Helvetica was called Megaron. A duck and what sounds like something from a Japanese monster movie. And Chelmsford—a British-sounding name for a typeface by a German designer inspired by Italian stone-carved letters. Brilliant.</p>
