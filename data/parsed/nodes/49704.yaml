      <p>Sorry I don’t have enough time to write up more details and provide source files, but Optima had many licensed and unlicensed variants during the 1960s-1980s.</p>
      <p>During that time many printers and designers used type output from multiple sources; hot-metal (often resized by camera), press-type, IBM Selectric, photo-headline, phototype, and closer to the eighties - CRT typesetters and the first generation digital imagesetters.</p>
      <p>Given the fact that optical adjustments were made by type designers and type foundries to visually optimize the font when used for text versus headlines, you often saw these variants within typefaces at different sizes.</p>
      <p>So just multiply the variables — many licensed/un-licensed versions of Optima x display/text versions x various technology = design variants.</p>
      <p>I know of at least six Optima “versions” I used during that time.</p>
