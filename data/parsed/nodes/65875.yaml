  html: |-
    <p>Would the software Typophile uses allow the inclusion of breadcrumbs at the bottom of the page, as well as at the top where they currently are? When I am at the end of a long thread, it is annoying to have to scroll up to the top to use the breadcrumbs. It would be convenient to be able to access them from the bottom, where I generally stop reading.</p>
    <p>(Yes, I know there is the browser back button, but I prefer the breadcrumb route, for some reason.)</p>
