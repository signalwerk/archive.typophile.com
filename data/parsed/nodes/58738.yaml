    html: |-
      <p>It is a standard English word, do not make it italic.</p>
      <p>From the OED:</p>
      <p>coterie |ˈkōtərē; ˌkōtəˈrē|<br>
      noun ( pl. -ries)<br>
      a small group of people with shared interests or tastes, esp. one that is exclusive of other people : a coterie of friends and advisers.<br>
      ORIGIN early 18th cent.: from French, earlier denoting an association of tenants, based on Middle Low German kote ‘cote.’</p>
