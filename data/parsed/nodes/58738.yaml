    html: |-
      <p>English dictionaries mark words still considered foreign with something that specifically says "foreign". Look in the pronunciation guide to see if there is a symbol for it; usually it's a double dagger.</p>
      <p>There is a certain amount of personal preference as to whether a term has been fully assimilated into English. For instance, my 1984 Webster's New World Dictionary marks "voilà" as foreign but not "raison d'etre", and your dictionary may differ. Going by the origin alone is not enough if you don't know the word, as then you could end up italicizing such English words as "inaugural".</p>
