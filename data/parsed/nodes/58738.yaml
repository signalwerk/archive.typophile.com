    <p>I ran across the word "coterie" in a body of type I am setting.</p>
    <p>I am not familiar with this word (and I'm not afraid to admit it :P), should I set it in italics or has it been Englishified enough to where I don't have to?</p>
    <p>ex. vis a vis, voila</p>
    <p>much obliged!<br>
    Rachel</p>
