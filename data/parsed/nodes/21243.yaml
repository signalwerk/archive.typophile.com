    <p>I am trying to find out which Cap Eng configuration is most commonly accepted and understood by those who need to read it. I have seen the cap Eng with the cap N used as in Garamond Prem. Pro (see below) and as done in Gentium, where the cap Eng looks like an enlarged version of the lower case eng (using lc n).  Which will read best to most people?</p>
    <p>Below is a graphic showing both:</p>
    <p>Thanks,</p>
    <p>ChrisL</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Eng_5392.png"></div><p></p>
