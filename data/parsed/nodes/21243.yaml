      <p>Bringhurst --<br>
      eng: A basic letter of the alphabet in Lapp, and in its lowercase form, widley used in lingustic and lexicography. It represents the ng sound in the word wing. (Note the different sounds represented by the same letters in the words wing, Wingate, singlet and singe.) Thought it is ISO character, the eng is missing from most text font.</p>
