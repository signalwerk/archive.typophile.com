      <p>From the link Paul posted:<br>
      " Uppercase Eng<br>
            Unicode: U+014a</p>
      <p>      Design : The preferred design of the uppercase Eng for the Sami language is one based on the uppercase N. The design form that resembles a lowercase n is an equivalent form of the uppercase Eng.<br>
            The uppercase and lowercase Eng are also used in the western African language of Hausa. In this African language the preferred design for the uppercase Eng is one that has a rounded top similar to a lowercase n."<br>
      ChrisL</p>
