    html: |-
      <p>i'm assuming this is an OT font. If so, it's easy enough to implement both (on the font end)</p>
      <p>if you have the Sami Eng as the default<br>
      in the locl feature put</p>
      <p> language HOU  exclude_dflt;<br>
          sub [Eng eng.smcp] by [Eng.salt eng.smcp2];</p>
      <p>you could also make a stylistic set that makes the same substitutions. This makes it easy to implement on the application end too (for InDesign CS2 users) until the locl feature is actually acessible by software apps.</p>
    html_clean: |-
