    html: |-
      <p>&gt; language HOU exclude_dflt;<br>
      &gt; sub [Eng eng.smcp] by [Eng.salt eng.smcp2];</p>
      <p>If you add this code, remember to put the lines: </p>
      <p>languagesystem latn dflt;<br>
      languagesystem latn HOU; </p>
      <p>in the bottom-right part of the OpenType panel. Make sure to include a respective "languagesystem" clause for all languages that are included in your OpenType Layout features code. If you don't do this, for the Hausa language only the "locl" feature will be available, while other features from your font ("smcp", "liga" etc.) will not at all be available for the language!</p>
