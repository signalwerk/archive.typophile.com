    html: |-
      <p>Adam Twardoch wrote:<br>
      &gt; ... remember to put the lines:<br>
      &gt;<br>
      &gt; languagesystem latn dflt;<br>
      &gt; languagesystem latn HOU;</p>
      <p>In his <cite>OT Layout Feature File</cite> presentation at TypeTech, Christopher Slye pointed this out too -- and his examples had an additional line preceding the more specific ones:</p>
      <p>languagesystem DFLT dflt;&nbsp;&nbsp;&nbsp;<strong>&lt;&lt;&lt; Don't forget this one!</strong><br>
      languagesystem latn dflt;<br>
      languagesystem latn DEU;<br>
      languagesystem latn TRK;</p>
      <p>In fact, AFDKO2's compareFamily complains if this line is missing. Don't ask me how I found out ... It is also mentioned explicitly in the Feature File Syntax, at the end of section <cite>4.b. Language system</cite>.</p>
      <p>Karsten</p>
      <p><cite>Edit, 2 Oct 2006:<br>
      With the current FontLab Studio 5.0.2 it is not possible to add the first extra line since it uses an older AFDKO which does not support the 'languagesystem DFLT dflt' statement. See Read Roberts' post (3 October 2006, 9:24pm) on the <a href="http://typophile.com/node/28277" target="_blank" rel="nofollow">AFDKO2 thread</a>. So, let's wait for the update to be able to do things right.</cite>&nbsp;&nbsp;:)</p>
