    html: |-
      <p>It is also worth noting that Kern Pairs may not necessarily be supported. We certainly had a problem with a TTF flavoured font that had both Pairs and Kern Feature tables. Neither Freehand 10 nor MX saw the pairs. Killing the Kern Feature resolved the problem on the TTF at least.<br>
      I seem to remember that kern feature table fonts give no access to older apps. I am not sure now, if you can actually build OTF (CFF) based fonts using Kern Pair tables or if they only come as layout feature.</p>
      <p>Bruno Maag<br>
      Dalton Maag Ltd</p>
    html_clean: |-
