  html: <p>Hello all, I am by no means a computer genius and I really want to know whether or not Adobe's Bickham Script standard font opentype version will work on my program before I buy it because I can't find a TrueType version anymore. I am willing to purchase it if it's out there of course, but I can't find it.  I use Window's XP, Freehand MX.  Any help would really be appreciated!! ThistleBerry Press</p>
