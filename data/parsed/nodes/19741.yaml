    html: |-
      <p>As long as you stick to Freehand, you will not have enjoy an OpenType font fully, since it doesn't support more than 256 characters or any OpenType features.<br>
      Why do you look for a TrueType version of Bickham? Windows XP will just work fine with any PostScript flavoured OpenType font, like Bickham Script (Pro).</p>
      <p>Ralf</p>
      <p><a href="http://www.fonts.info" title="http://www.fonts.info">http://www.fonts.info</a></p>
