      <p>I'd like to point out a terminologic unclarity: "OpenType support" means different things. I usually say "OpenType Layout support" when I refer to the ability to handle the advanced typographic features. Freehand "supports" OpenType as a font format to the extent that it does support other font formats: the Roman codepage (256 character) and no advanced typography support. On the other hand, Adobe CS applications offer Unicode and OpenType Layout support. </p>
      <p>A.</p>
    html_clean: |-
