      <p>Thank you Pascal and Thomas. I'm sorry for the delayed response. I thought I would be notified of responses to this forum.</p>
      <p>Actually, I did have Tasmeem, but it was the Limited Edition. (Pascal, you're right...I had the "Creative Edition" for a limited time.)<br>
      And no, the Tasmeem installer did not come on any of the CDs. I've got everything in the original packaging. I think if I remember correctly, there was a link to the Winsoft website to download the promotional Tasmeem installer. I couldn't for the life of me remember where I put that installer.</p>
      <p>I contacted the company with whom I bought the software and they were able to request another installer from Winsoft. So I was able to install it just fine. I was just quite concerned because I had documents created in Emiri (Thank you Thomas!) but had no way to reproduce the original font.</p>
      <p>Again, thank you both.<br>
      paul</p>
