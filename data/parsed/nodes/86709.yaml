      <p>Hi Paul, I do not follow WinSoft's marketing policies from close by. More importantly, I do not quite understand your problem. As far as I remember, IDME CS3 included a 30 day Tasmeem trial version. Is it possible that you mean with "basic install" that you kept one or two DecoType fonts working with our DecoType ACE engine (after the expiry of Tasmeem, which is the user interace to access the typographic controls that are built around ACE)? In that case you did not have Tasmeem working for years, but only the ACE engine (without the Tasmeem-enabled functionality).</p>
      <p>If I understand it correctly, WinSoft advised to acquire Tasmeem (plus one or more fonts). Like you, I am surprised that you cannot simply reinstall what you licensed.</p>
