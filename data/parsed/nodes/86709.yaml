    <p>I'm hoping Thomas Milo or someone at Winsoft sees this.</p>
    <p>I purchased the whole Adobe Web Premium CS3 ME suite a few years ago. At the same time, I bought InDesign CS3 by itself. This included the Tasmeem plugin. It gave me 30 days of advanced features, then it returned to a basic install. I had Tasmeem working for years, even after I upgraded my computer. I always saw the "Tasmeem" menu in InDesign.</p>
    <p>So I just reinstalled my OS because I had some other OS issues and it's gone. I manually installed my Adobe apps. But nowhere in the installer did I see any mention of Tasmeem. I need it back as I have docs using the Emiri font in Tasmeem! </p>
    <p>I contacted both Winsoft and the place where I bought the software (Aramedia). Winsoft says I just need to upgrade everything. I'm sorry, this isn't acceptable. It was running fine on this system. All I want to do is reinstall what I paid for. The folks at Aramedia suggested I install without an internet connection, and I did, but still no Tasmeem. I have looked through my software discs and don't see anything for Tasmeem or from Winsoft.</p>
    <p>If someone can help, please do. I believe it is the Tasmeem 4 installer that I need.</p>
