      <p>Hi Paul,</p>
      <p>I'll do my best to help you.</p>
      <p>As far as I remember Tasmeem 3 had 3 flavors, the "Limited Edition", the "Creative Edition" and the "publisher edition". InDesign CS3 ME was shipped with the "Limited Edition" (with 30 days of trial of the Creative Edition). After the installation of InDesign, users have to install Tasmeem from a separate CD (delivered in the InDesign box). So, if I'm correct, if you are able to find that CD, your problem should be fixed. </p>
      <p>The Tasmeem4 stuff was a bit different. It was installed automatically by InDesign CS4 ME, no additional work was needed. For CS3 ME users, it was possible to upgrade to Tasmeem 4 using a separate installers, but I think this upgrade was not free.</p>
      <p>Now the latest version of Tasmeem is Tasmeem 5. It works with IDCS4 - IDCS5 &amp; ID CS55. It's not anymore bundled with InDesign...</p>
      <p>If it could help, I could post the installer of TS3 somewhere on a ftp for you. Feel free to contact me offline at pfouque at winsoft dot fr.</p>
      <p>Hope this helps</p>
      <p>Pascal</p>
