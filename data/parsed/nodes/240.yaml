  html: <p>BUFFALO, NY, MAY 19, 2003 - The Society of Typographic Aficionados (SOTA) has announced a call for submissions for TypeGallery2003. The TypeGallery is an international showcase of new typeface design that will be exhibited during TypeCon2003, in Minneapolis, Minnesota, July 17-20. All typefaces shown at TypeCon2003 will also become part of a permanent online exhibition at <a href="http://www.typegallery.com" target="_blank">http://www.typegallery.com</a>. <br> <br>Original type designs created, published, or significantly updated from June 2002 through June 2003 are eligible for inclusion in the TypeGallery. Submissions are limited to 3 new typefaces from a single designer or foundry. <br> <br>This year's exhibition will also feature the winners of the 2002 Type Directors Club and Morisawa typeface design competitions; a South American typography showcase; an international poster show, typographic fine art and photography, and an exhibit from the Hamilton Wood Type and Printing Museum. <br> <br>Deadline for submissions is July 8, 2003. Further information and submission forms are available at <a href="http://www.typegallery.com" target="_blank">http://www.typegallery.com</a>. Examples of typefaces from the 2002 gallery in Toronto are also displayed on the site. <br> <br>The TypeGallery is presented by SOTA, an international not-for-profit organization dedicated to the promotion, study, and support of type design, typography, and the related arts. For more information about SOTA, please visit the website at <a href="http://www.typesociety.org" target="_blank">http://www.typesociety.org</a>, or email <a href="mailto:info@typesociety.org">info@typesociety.org</a>. For details about TypeCon2003, visit the conference website at <a href="http://www.typecon2003.com" target="_blank">http://www.typecon2003.com</a>.</p>
