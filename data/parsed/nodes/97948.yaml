    html: <p>Two different /e/ and /t/ characters leads me to believe that this may be hand-lettered—or a font with extended OT features, including randomization. It has the same kind of vibe as a lot of the Art &amp; Sign or SignDNA brush fonts, but neither of their product line are too OT savvy…</p>
