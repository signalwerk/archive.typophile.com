    html: |-
      <p>You should have the USP follow the same curve as the rest of the copy above it and below. Right know it feels as if the U and P are skewed in oppisite directions. You could also give it a little letter spacing to the letters to fill out the area. </p>
      <p>As for the hand maybe you can be simplier with it. Treat it as an icon like you did with the water, sun &amp; nature symbols. I feel like you are trying to draw a realistic hand, which is something that is just plain hard to do. I think that the bumps on the fingers take away more then it is giving.</p>
      <p>Also I like the black and white version better then the color version. One key thing to remember when designing a logo is that it needs to work first in black and white before color should be applied. When you design in black and white, which is a designers purest form, mistakes will appear that color will hide.</p>
      <p>I hope this was helpful, and good luck.</p>
      <p>&lt; J o s e p h &gt;</p>
