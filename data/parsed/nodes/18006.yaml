    html: |-
      <p>I think you are fitting a lot of information into the logo, and as Joseph notes hands (and feet) are notoriously difficult to draw, I like the simplicity of the first revise, a kind of Matisse cut paper feel to it, try taking the form of that representation but instead of showing the fingers separated join them together into one block (keeping the thumb separate) with four curves as finger tips (kind of like <a href="http://creative.gettyimages.com/source/classes/FrameSet.aspx?&amp;UQR=goxcof&amp;pk=4&amp;source=front&amp;lightboxView=1&amp;txtSearch=openhand&amp;selImageType=6&amp;chkLicensed=on&amp;chkRoyaltyFree=on" rel="nofollow">this</a>, this is not of your style but gives a hint).<br>
      One of the most important considerations when designing a logo is that it should be usable in any number of situations (I realise your logo has a narrow use but the principle is the same) to that end it has to be possible to use it at a small size so in many ways the simpler the better, I would avoid using the dropshadow and gradation, to keep the potential use to a wide range of possibilities.<br>
      Tim</p>
