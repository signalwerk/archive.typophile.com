    <p>Hi people!</p>
    <p>I’m new here, and I think someone can help me. So, let´s go to the problem:<br>
    I study Environmental Engineering in Brazil (my native language is Portuguese, so sorry about any English mistake) and I tried to, at the beginning of the course, create a logo for the course. The first try resulted in:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/14-engamb.jpg"></div><p></p>
    <p>This was a very bad logo, I know… and everybody, all my friends said that too! ;)</p>
    <p>So, I have decided to improve the logo, and then:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/22-engamb.jpg"></div><p></p>
    <p>Although better then the first, I wasn´t completely satisfied. People criticised about the hand of 4 fingers! LOL! Then, finally I did another logo, now with 5 fingers and some more modifications and variations (see attachments to enlarge and see better the hand´s details):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/engenharia1.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/engenharia2.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/engenharia3.png"></div><p></p>
    <p>And here is the final Logo with some lights and shadow effects:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/eng_amb-yahoo.png"></div><p></p>
    <p>But, the problem is that, this new hands with 5 fingers didn´t satisfy my college friends! They told that the hand looks like a monster hand! I'm not professional, and my artistic ability isn´t enought to draw a realistic hand.</p>
    <p>So, I come here with the hope that someone could help me with this hand, and any other suggestion about my logo. I don´t know if is necessary the logo in vetorial format here to you make changes… I can share here the file in CorelDraw format if necessary.</p>
    <p>Thanks to all that help!!!</p>
