    <p>Hi,</p>
    <p>Running into a strange issue on a font I am working on for a client. Created fractions, and the 1/8 fraction will not show up in the glyph palette in Illustrator, but will show up in InDesign (all other fractions I created show up properly). Is this an Adobe/AI/INDD issue or am I doing something wrong in FLS? </p>
    <p>Also, the "notequal" glyph shows up incorrectly in AI (showing up as a glyph that I didn't create), but shows up as the proper glyph in INDD (see attached image- correct glyph is the top image). </p>
    <p>Anyone run into this, and have a fix/solution? </p>
    <p>Thanks for your help.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/notequal_INDD_AI_6465.jpg"></div><p></p>
