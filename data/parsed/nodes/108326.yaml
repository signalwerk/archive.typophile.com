    html: |-
      <p>I would say this is a bug in Illustrator СС. I have version 17.0.2. I have tested this issue with several installed fonts and Illustrator doesn't show totally 2 glyphs: .notdef glyph (which is usually the first glyph in the font) and the last glyph of the font. Adding one glyph to the font in FLS fixes the problem for the previous glyph but the new added glyph is invisible in the Glyphs panel.</p>
      <p>Regards,<br>
      Johnych</p>
