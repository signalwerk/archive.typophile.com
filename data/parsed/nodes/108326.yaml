      <p>When you say it shows up in InDesign can you pick it out of the glyph pallet? If you can, does it flash-up the correct Unicode for the 1/8 fraction. Can you repeat that in the Illustrator glyph pallet? Can you generate the outline from the 1/8 glyph?</p>
      <p>Did you do the amends in FontLab? Do you get the correct Unicode for 1/8 if you read the finished font back into FontLab?</p>
      <p>Check the outlines for 1/8, do you have doubled-up outlines?</p>
