    html: |-
      <p>Should have said David, your second G is looking much better, but still has some issues. In an effort to be helpful:</p>
      <p>One problem I have when sketching a script with a pencil is that there's a big difference between a pencil and a quill/brush/steel pointed pen etc. The difference is that those instruments produce thicks and thins regularly depending on how you hold, twist and form your letters. To replicate it well with a pencil requires an intimate understanding of those details. In your example (like mine often are) the ductus is somewhat confused.</p>
      <p>For example, the following might be two ways to construct your G (green or purple). Depending on what the tool is, that could mean a bunch of different things. Stroke 1 could be entirely thin or include a thick if the tool allows for contrast on the upstroke by applying pressure (such as steel pointed pen -- see Edwardian Script). Whatever rules you set for yourself, stick to them. I'm no expert with scripts, so everyone please chime in here.<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/ductus_4500.gif"></div><p></p>
      <p>Just looking at the quality of the curves themselves, there are some lumps and kinks. I will say it's hard to tell from a gif at this size. In general on the down strokes I would move the weight lower in the curve. This makes sense as you think about pulling the instument down the page adding weight. Watch out for wide-narrow-wide sections where it should be smooth (the little waist marks in green). The other thing is that some of the cuves happen too tight, or not smoothly enough (marked with a green corner). Lastly, watch your intersections. Here you have medium thickness crossing medium (a no-no). In general, thicks cross thins. Thins can cross thins, but never thicks crossing thicks (or almost thicks crossing almost thicks :-) There are probably exceptions, but in general this is true.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/curves_5740.gif"></div><p></p>
      <p>Hope that helps, or at least coaxes out better advice :-) You've chosen an ambitious project. Digital scripts are EXTREMELY tricky on the designer and their beziers. Especially so with thin ones like this since it's often harder to tell what is wrong. Good luck!</p>
      <p>Randy</p>
      <p>EDIT: one last thing. If you can, check pages 180-196 of Doyald Young's excellent FONTS &amp; LOGOS. His is a script master and offers several nuggets there.</p>
