      <p>There are two different things here: one is doing the initial drawing with nodes wherever seems best for drawing and editing; the other is where nodes are placed on the final output font.</p>
      <p>My take is that not having nodes at extrema will result in poor rendering on screen in many Windows rasterizers.</p>
      <p>(EDITED to correct missing “not”)</p>
