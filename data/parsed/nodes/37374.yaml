    html: |-
      <p><cite>I think you mean, some PostScript requires it, so all PostScript prefers it.</cite></p>
      <p>Yeah, that was just my way of saying it without being too dogmatic. I couldn't say it would always be a problem, but the T1 spec seems to want it that way, and at least at Adobe we'd consider it a bug.</p>
      <p>This business of "grid-fitting" points (i.e. integer values) is an interesting topic. If one is going to work on a font and do a lot of scaling, then there is a case to be made for doing it in Fontographer or Illustrator, where shapes can be transformed a lot without the cumulative rounding errors. But it's worth pointing out -- because I've encountered people here and there who miss it -- that the outlines will be rounded to integer coordinates in the final font. That's the advantage of FontLab; it's more WYSIWYG.</p>
    html_clean: |-
