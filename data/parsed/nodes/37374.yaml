    html: |-
      <p>It is easier to see the benefit of designing with extrema in Fontlab vs Illustrator. That's because even though both are vector-based programs, Fontlab's vectors have resolution dependence (ie points and handles can only be on integer numbers). The equivalent in Illustrator would be designing with "snap to grid" turned on, and a fine grid. When I moved into Fontlab this was one of the most frustrating things (and sometimes still is). But, it does help you keep your design consistent and often it helps me create smoother curves than I would in illustrator. Now I finalize all logos in FL too.</p>
      <p>I also agree will Bill that beziers can dull your creativity. Straight stems and crisp corners are the mode by defualt because of the tool. To combat this, sometimes I'll go for a session in illustrator, or rough in a design using short straight segments, and then convert to curves using FL's fantastic line to curve tool. For an example of a roughed design see ye old type battle 12. <a href="http://bigcartel.typophile.com/battle12" title="http://bigcartel.typophile.com/battle12">http://bigcartel.typophile.com/battle12</a></p>
      <p>BRING BACK THE TYPE BATTLE. I'm getting too productive at work.</p>
      <p>R</p>
