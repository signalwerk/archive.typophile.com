      <p>I certainly agree with Mark about point placement, but the thing I find most interesting about the example is how lousy the resulting artwork looks. Whatever your philosophy of point placement is, the outlines created did follow the analog artwork with a fair degree of accuracy but the results are less than ideal. It may be what the analog artwork actually looks like, but in the realm of digital outlines, it disappoints. There is a difference between digital and analog art, and slavishly following an analog original, will not give you what you want.</p>
      <p>But then again, most analog art is flawed, and deeply so, when it comes to translating it to digital outlines, and it relies on the skilled interpreter to render it in a pleasing form in the digital realm, regardless of what the analog original actually looks like.</p>
