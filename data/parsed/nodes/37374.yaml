      <p>I find myself not caring too much about the extrema as long as I am in the design process. For example, I could design an italic "o" with just two points for each contour placed at the point where the stroke should be the thinnest. By doing this it is much easier to change the curves without having always to adjust several points at once.<br>
      After the design is finished I insert points at the extrema and delete the other points. This is very easy in FontLab since it tries to keep the curve the same when you add and delete points. Unfortunately that's not the case in Illustrator.</p>
