      <p>Generally, you want to use as few control points as possible. Too many points makes it hard to get a smooth, flowing line on a long curve. Too few points restricts the possible path the curve can follow. </p>
      <p>If you are intending to create fonts, it's good to get into the habit of placing points at the "extrema" locations on curves, which are points that are on the extreme left, right, top, and bottom of a curve. On a circle, these would be at clock points 12, 3, 6, and 9. Another way to think of it is, if you put a rectangle around the curve just large enough for the curve to fit, the points where the curve touches the rectangle are the extrema points. Extrema points are mostly needed for hinting to work properly in fonts.</p>
    html_clean: |-
