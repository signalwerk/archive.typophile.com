      <p>&gt;That being said, I’ve been told a few times that points at extrema are less useful in italic and script faces, because the stems are not vertical. (Of course there are still horizontal stems.) And there’s no need to get overzealous about it in the small details. The rounded end of a protruding serif probably doesn’t need an extra point there.</p>
      <p>This is an important cautionary note, I think, as it shows there are other approaches that may be helpful, depending on what you are drawing. It is often helpful to the drawing process to have points on curves only at extrema, with horizontal and vertical handles. But sometimes it helps the design process, particularly in an italic, not to do this. And even in the final outline, these are not a requirement for auto-hinting in in Type 1 or CFF in every situation either, as Christopher points out.  </p>
      <p>Also I think there is a problem of too much digital type looking alike, and sometimes looking a bit sterile. Putting in intermediate points creates more challenge in getting smooth curves, but it also can give curves a more warm and organic look. I think trying both ways--with and without intermediate points--is often a good idea.  </p>
      <p>On cubic vs quadratic curves, my impression is that almost everybody initially designs with cubic beziers, and then converts if they are doing True Type. But I may be wrong about that.</p>
