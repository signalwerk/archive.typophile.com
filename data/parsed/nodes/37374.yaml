      <p>"(You’ll want to remove that overlapping path eventually, too — but maybe you knew that already!)"</p>
      <p>Why should overlaps be removed?</p>
      <p>"The reason there are so many points on the Hoefler Text Q is that it is a TrueType font outline converted to PostScript bezier curves."</p>
      <p>I'm certain that it is a PostScript outline converted to TrueType. </p>
      <p>The other two things no one mentioned here, or I missed, that might be helpful, are: that the drawing of the shapes without the points on extrema is common. Left this way, non-extreme contours remain fine at high resolutions. </p>
      <p>And, that anything less than high res and extrema-d contours become required (hinted or not) because of the general effects of scaling. The illustration below shows two perfect circles with that one difference (above). Then, (below), scaled to 1%, and back up again. </p>
      <p>The left bottom "circle" is in fact "better", regardless of the fact that it is also more easily hinted. :-)</p>
      <p>Cheers!</p><div class="imageWrap"><img src="http://typophile.com/files/1000_5662.png"></div><p></p>
