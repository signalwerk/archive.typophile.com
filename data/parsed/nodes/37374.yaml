      <p>The idea of resolution and beziers being used in the same scentence is probably odd to most Illustrator-only folks. Perform the same 100 &gt; 1 &gt; 100 in Illustrator, and there will be no difference (or almost none). David's example above is great to show the resolution limitations of Fontlab and fonts in general. But it should also be said that anytime vectors are viewed, they're quantized into pixels or toner flakes etc. Blow up a scan of a print and the curves looked tweeked too, but less so, if there are points at the extrema. And there's the rub.</p>
      <p>Randy</p>
