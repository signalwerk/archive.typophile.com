      <p><cite>Why should overlaps be removed?</cite></p>
      <p>Because PostScript prefers it. I am not mentally equipped to get into a discussion of how today's various rasterizers behave, but there are plenty of past examples of trouble caused by overlapping paths, reversed paths, and other PostScript oddities. For example, some rasterizers will show a filled, overlapping section as unfilled.</p>
      <p>The <em>Adobe Type 1 Font Format</em> says:</p>
      <p><cite>3.6 Overlapping Paths<br>
      A single closed outline should not intersect itself ...</cite></p>
