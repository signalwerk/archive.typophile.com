      <p>"Why should overlaps be removed?"<br>
      "Because PostScript prefers it"<br>
      I think you mean, some PostScript requires it, so all PostScript prefers it.<br>
      I guess I agree with the points on extrema to an extreme, and that's the rub.<br>
      When people here say "points on extrema" what's really meant, is that the extreme extent of a glyphs curve has an on-curve point and two colinear off-curve points. This makes scaling a relative breeze, as rounding effects the trio of points identically (in one dimension at least). When removing overlap introduces quads of points (or worse, think Ø), that must round in two dimensions to an implied but not specified line, degrading under the stress of resolution and or reproduction is sure thing. Palatino Linotype on the Mac, "&amp;" below 20 pt on screen is a pretty good example. </p>
      <p>Cheers!</p>
