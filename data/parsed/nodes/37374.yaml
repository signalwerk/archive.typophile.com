      <p>Good advice here, I'd say. I'll just elaborate a little:</p>
      <p>Related to hinting benefit, having points at extrema also helps with design by making it easier to keep sidebearings and stem widths predictable. At some point during typeface development, you'll run into some reason to care about the bounding box of a glyph, and if it's being determined by a curve rather than a point, it will be difficult to adjust.</p>
      <p>That being said, I've been told a few times that points at extrema are less useful in italic and script faces, because the stems are not vertical. (Of course there are still horizontal stems.) And there's no need to get overzealous about it in the small details. The rounded end of a protruding serif probably doesn't need an extra point there.</p>
      <p>It helps to have a general understanding about how PostScript lines are drawn. Just like Mark, I'm a little embarrassed by some of the constructions I did ten years ago; back then I though of a single point and its two control handles as an element, whereas PostScript sees two points and the line and control handles in between as an element. If you can get a bit of that embedded in the back of your mind, you'll make better decisions about where to put things.</p>
      <p>If you are designing multiple master outlines, all of this advice becomes more important. Having a simple, disciplined approach to outline construction will help with interpolations.</p>
      <p>(You'll want to remove that overlapping path eventually, too -- but maybe you knew that already!)</p>
