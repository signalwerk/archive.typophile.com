      <p>After completing Outstanding, (a decent font, by freeware standards), I was displeased with the results. I liked the concept, but I thought the rendering of the alphabet design was poor, and the letters were much too wide for practical use. </p>
      <p>I started by reducing the width of the Outstanding source graphics by 20%, without changing the height:</p>
      <p>Source graphic of S  from Cabbagetown:</p>
      <p><a class="freelinking external" href="http://s26.postimg.org/vo5tfamk9/big_vintage_letters_s3_edit5_final_80_mc.png" rel="nofollow">http://s26.postimg.org/vo5tfamk9/big_vintage_letters_s3_edit5_final_80_mc.png</a></p>
      <p>My 'raw' vector looked like this:</p>
      <p><a class="freelinking external" href="http://s26.postimg.org/h7ik0px2x/raw_S_vector.png" rel="nofollow">http://s26.postimg.org/h7ik0px2x/raw_S_vector.png</a></p>
      <p>At this point, I begin to 'sculpt' the vector, by removing all nodes that are not necessary to hold the contour shape in place. I also make alterations to the design in the font editor, by manipulating the positions of the remaining nodes and control handles.</p>
      <p>My final design is almost entirely based on Cartesian geometry, in the sense that the majority of the nodes and handles end up aligned with each other, in vertical, horizontal, and diagonal directions. This screen capture of the final edit:</p>
      <p><a class="freelinking external" href="http://s26.postimg.org/ejvef8gqh/S_133q8_vector.png" rel="nofollow">http://s26.postimg.org/ejvef8gqh/S_133q8_vector.png</a></p>
      <p>shows nodes in green, light blue, and red, with handles in yellow. The purple lines show horizontal and vertical alignments. The majority of the nodes at lower left and upper right have diagonal alignment with each other. Only 36 nodes are used to create the glyph.</p>
      <p>I get really smooth outlines at enormous point sizes:</p>
      <p><a class="freelinking external" href="http://s26.postimg.org/6sa32xn7d/S_133r3_288_pt.png" rel="nofollow">http://s26.postimg.org/6sa32xn7d/S_133r3_288_pt.png</a></p>
      <p>I haven't figured out why the alignments occur, (this process is being used for the first time), but every glyph has them:</p>
      <p>K from Cabbagetown, modified slightly since this screen cap was made:</p>
      <p><a class="freelinking external" href="http://s26.postimg.org/g6rle5juh/K_129i9_vector.png" rel="nofollow">http://s26.postimg.org/g6rle5juh/K_129i9_vector.png</a></p>
      <p>I think of the vector as a malleable shape that evolves as it becomes more efficient and structured. The end result almost has more in common with chemical engineering than with graphic design, but I have to play to my strengths. I barely passed art class in high school, but I had completed all available math courses shortly after by fifteenth birthday.</p>
      <p>I don't advocate that anyone abandon Illustrator to adopt MS Paint, but I do feel that the glyph on the Illustrator drawing board is just the first step in creating a fully realized vector.</p>
      <p>Rather than placing nodes on the extrema, I remove the nodes that are not on or near the natural curvatures that I want to have. The curved dome on top of the S is created by the placement of two control handles on two specific horizontal planes. If I move either or both handles vertically, a flat spot will be created on top. If I move either or both horizontally, the curve on top will remain, but its position will change. This is, by no means, easier to do than the 'by the book' method of placing nodes at North, South, East and West, which guarantees a flat spot at each location, which no one will notice, provided that the text is small enough, or it is displayed in an app that hides small errors with smoothing.</p>
