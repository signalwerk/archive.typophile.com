      <p>&gt; <em>If you are intending to create fonts, it’s good to get into the habit of placing points at the “extrema” locations on curves,(...)</em></p>
      <p>And try to keep the control handles mostly vertical and horizontal. There are exeptions, but for smooth curves, straight handles are important.</p>
      <p>Also important; if there are two vectors with a curve in between, try to make both handles 'carry' the curve equally.</p>
