    <p>Hi all,<br>
    I’m looking for alternatives to a typeface that is not available in electronic form, as far as I can tell from my searches.<br>
    The face is called ’Quadra’, designed in 1970 by Rudolph de Harak. Can anyone suggest something that closely resembles this?<br>
    Cheers.</p><div class="imageWrap"><img src="/files/quadra-font.gif"></div><p></p>
