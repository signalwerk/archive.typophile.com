      <p>John D: <em>For the OpenType spec, the simplest solution I guess would be to add a flag to the fsSelection field similar to the USE_TYPO_METRICS flag, something like USE_OS2_WEIGHT_CLASS maybe, then evangelize folks at Apple, Microsoft, Adobe and at Google to use this in their platform font API's. This flag would certify that the useWeightValues were in fact consistent with the relative scale defined by the OpenType spec and not skewed to hack around GDI-related problems on Windows.</em></p>
      <p>That's the same mechanism I sketched out today. The problem for usWeightClass is very similar to that of the OS/2 usWinAscent and usWinDescent metrics, which were implemented in almost all software in a way that was contrary to their original intention and specification, so a similar solution seems likely. Of course, there would still be problems in the selection and rendering of correct fonts in systems that were not updated to accept the new mechanism, and which would treat the fonts according to past practice, i.e. ignoring usWeightClass or faux bolding certain weights.</p>
      <p>_____</p>
      <p>Aside:</p>
      <p>David: <em>The more I know about the fonts WG...</em></p>
      <p>To clarify, there is no 'fonts WG'. The W3C has a Webfonts working group, which is responsible for defining formats and comformance requirements for served fonts, and a very much larger CSS working group, which is responsible for a massive amount of stuff, one part of which is 'CSS Fonts', which would be more accurately labelled CSS Typography.</p>
    html_clean: |-
      <p>John D: <em>For the OpenType spec, the simplest solution I guess would be to add a flag to the fsSelection field similar to the USE_TYPO_METRICS flag, something like USE_OS2_WEIGHT_CLASS maybe, then evangelize folks at Apple, Microsoft, Adobe and at Google to use this in their platform font API's. This flag would certify that the useWeightValues were in fact consistent with the relative scale defined by the OpenType spec and not skewed to hack around GDI-related problems on Windows.</em></p>
      <p>That's the same mechanism I sketched out today. The problem for usWeightClass is very similar to that of the OS/2 usWinAscent and usWinDescent metrics, which were implemented in almost all software in a way that was contrary to their original intention and specification, so a similar solution seems likely. Of course, there would still be problems in the selection and rendering of correct fonts in systems that were not updated to accept the new mechanism, and which would treat the fonts according to past practice, i.e. ignoring usWeightClass or faux bolding certain weights.</p>
      <p>_____</p>
      <p>Aside:</p>
