      <p>&gt;I was suggesting that they would need a new mechanism</p>
      <p>Nonsense, but I will believe anything from the foot-draggers who require CSS to remain inferior, and to the confused rulers of W3C who seem typographically ambivalent to the future. </p>
      <p>Pay close attention to the undeniable facts<br>
      1. Apple ignores OS width and weight, clinging to antiquated sniffing of name? Where Regular, Normal, Roman, Standard, Medium and Book make this untenable, Apple’s usual position is to wait for an integrate-enabled solution to solidify. No mess there if OS's Wt and OS width become better through use of a more complete set of values, and better used by developers. Repeat, No Mess, like font names will remain forever. </p>
      <p>2. MS’s use of these values is broken in GDI? They fall further every day in market share, and the share using the GDI tail end falls faster than their market share. Besides which, using OS2 Width and weight to perform <em>effects!</em> is so far away from the true intended use of these parameters as to be in a totally different class of functionality. Again! No mess. </p>
      <p>3. FreeType… not used yet? No mess.</p>
      <p>What made/makes the use of these fraternal twin parameters critical a couple years ago, and in crisis mode today? This pair of parameters is flying into a storm of need where an increasing population of developers and web sites perform the composition of web pages on-the-fly for reactive and restive design situations. The former relates to sites that need to look descent on phones, tablets and desktops via media query. The latter is required to better guide and increasingly typo-un-savvy market of users. And backing it all up further into the typography, most visual identities are made from a small number of font families per ID. In such a situation the families need to have Wt and Wth metadata that allows them to interact in the making of good lookin’ shit. </p>
      <p>Comp-ren-do?</p>
