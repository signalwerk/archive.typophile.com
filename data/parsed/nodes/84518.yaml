      <p><em>The one detail you are glossing over is that "most software makers" = Microsoft.</em></p>
      <p>I think any software maker whose current handling of usWeightClass would produce different results from a new handling would be concerned about backwards compatibility issues, and that is as true for those who currently ignore usWeightClass as for those who perform specific functions with it. So, for example, if fallback font selection is currently based on parsing font names rather than on usWeightClass, shifting to using usWeightClass data will result in different fonts being selected in some situations (cf. John D's comparison of two different cuts of Helvetica and their incompatible name and weight class data).</p>
      <p>I don't think anyone has looked yet at all the existing dependencies, or polled the various interested parties to find out just how seriously they take the backwards compatibility issues. I wouldn't like to guess.</p>
