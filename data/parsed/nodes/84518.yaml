      <p>Thomas, a whole new data set was my original notion (see above), but then I started thinking if there might be a way, using a flag mechanism, to preserve the existing data structure. I see your point, though, about the benefits of a clean set of data, which would enable fonts to remain backwards compatible with their GDI behaviour while providing new weight information that CSS and new APIs could access instead of usWeightClass. And, of course, defining the new data as a range 0-999 rather than multiples of 100.<br>
      _____</p>
      <p>David: <em>My way has nothing to lose following the STD!</em></p>
      <p>Presuming STD=standard (rather than sexually transmitted disease), <em>what standard?</em> The OpenType/OFF spec explicitly limits the correct setting of usWeightClass to one of nine multiples of 100.</p>
      <p><a href="http://www.microsoft.com/typography/otspec/os2.htm#wtc" title="http://www.microsoft.com/typography/otspec/os2.htm#wtc">http://www.microsoft.com/typography/otspec/os2.htm#wtc</a></p>
      <p>So that standard clearly doesn't address your requirements for 'font families where the total number of weights exceeds 11'.</p>
      <p>And if, following that standard, you set the usWeightClass value of any of your fonts as 100 or 200, they may end up displaying as heavier than a font with a value of 300 in GDI.</p>
      <p>And if the range of weights in the family don't correspond exactly with the stated weights of the spec, Apple is going to select incorrect weights based on font name.</p>
      <p>So I don't see an existing standard that you <em>can</em> follow, unless your family has seven or fewer weights and these correspond precisely to </p>
      <pre>300 	Light
      400 	Normal (Regular)
      500 	Medium
      600 	Semi-bold (Demi-bold)
      700 	Bold
      800 	Extra-bold (Ultra-bold)
      900 	Black (Heavy)
      </pre>
