      <p>Hold horses for a minute, and survey the view from this ridge.</p>
      <p>There appear to be some people on the plain below talking about what CSS actually does with a particular set of font data and how to ensure that it can be done reliably in a way that doesn't restrict font families to a very limited number of members. But there also appears to be a lone ranger galloping away into the distance, who is talking about completely overhauling CSS font handling in imaginative and visionary ways to do things other than what it currently and actually does.</p>
      <p>I consider both of these to be entirely valid and important conversations. But let's be clear that they are two different conversations.</p>
