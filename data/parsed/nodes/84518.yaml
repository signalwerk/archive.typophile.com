      <p>In defence of the 'unenvisioners' of CSS handling of weight class, they were trying to deal with existing incompatibilities between various software and font makers and come up with something that would produce reliable results in browsers when authors specify relative rather than absolute weights in CSS. It was a messy problem. They could have envisioned and defined some totally new and extensible weight range mechanism  -- they still could -- , but that wouldn't remove the need for some standardised mechanism of handling existing fonts in a way the produces the fewest breakages, which is how I understand what they've done.</p>
      <p>cf. John Daggett's slides from his TypeCon 2010 briefing (slides 17-26):<br>
      <a href="http://people.mozilla.org/~jdaggett/css3fontstypecon2010.pdf" title="http://people.mozilla.org/~jdaggett/css3fontstypecon2010.pdf">http://people.mozilla.org/~jdaggett/css3fontstypecon2010.pdf</a></p>
      <p>and Dave Crossland's notes from that session:<br>
      <a href="http://www.advogato.org/person/crossland/diary/1.html" title="http://www.advogato.org/person/crossland/diary/1.html">http://www.advogato.org/person/crossland/diary/1.html</a></p>
