      <p>David: <em>I've been under the false impression that the W3C do not even recognize OT as a STD...</em></p>
      <p>Oh, they definitely do that (officially as the 'Open Font Format' under ISO, I suppose). There's also a lot of stuff in the CSS Fonts spec that ostensibly permits of other formats -- especially with regard to layout features, e.g. AAT and Graphite --, but OpenType is referred to throughout. Note also that CSS typography has been designed with an option to directly address low level OTL tags rather than higher level CSS syntax.</p>
      <p>David, do you have documented some place what you think it is important to be able to do with width and weight classes, and how you think this should be done? I think there are plenty of people in CSS who would be happy to engage with this issue.</p>
