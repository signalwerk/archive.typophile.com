      <p>Johns (D and H):</p>
      <p>I hate to say it, but since AFAIK many GDI apps even on Windows 7 are still broken in handling usWeightClass, it seems to me that sane font vendors are not likely to use usWeightClass values less than 250. It's not only Adobe who does such odd things in this regard.</p>
      <p>Just as the only way to get around awful legacy metrics and awful legacy names was to invent new ones, while keeping the old ones for backwards compatibility, it seems to me like we need a new "weightclass and this time we really mean it!" entry in the OS/2 table if we want to get out of this.</p>
      <p>There could be some advantages to doing this, such as explicitly allowing values in between the 100's, and explicitly going as low as zero and as high as 1000. That would among other things accommodate families that don't fit into the Procrustean bed of 9 values from 100 to 900, with three weights below "regular" and five above.</p>
      <p>I probably ought to propose this on the OFF and/or OpenType lists.</p>
      <p>T</p>
