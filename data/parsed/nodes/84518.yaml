    html: |-
      <p>David: <em>What exactly would be the downside of having more values available, if as you say they still could allow more values?</em></p>
      <p>I didn't say that they could allow for more values under the existing (usWeightClass) mechanism: I was suggesting that they would need a new mechanism, because the usWeightClass-CSS interaction is hampered by what text handling systems, e.g. GDI, were already doing with usWeightClass, e.g. applying faux bolding to certain weights, while other software makers, notably Apple, had decided to treat usWeightClass as unreliable data and sniff font names to guess weight. As I said: a messy problem.</p>
      <p>I don't see a way to make a clean, extensible CSS text weight system without uncoupling it from usWeightClass.</p>
      <p><em>Also, who/what made the decision that only relative use of this scale was initially desired/ possible?</em></p>
      <p>If you want absolute weights, then you can always reference a specific font in the CSS. It is in the use of relative weights that notions of lighter and bolder need to be related to individual members of a font family.</p>
