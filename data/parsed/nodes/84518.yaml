      <p>Thomas, I guess we can agree that the usWeightClass spec is thoroughly ambiguous about the legitimacy of values other than multiple of 100 and offers no information at all about how these should be implemented or interpreted. No wonder software makers have judged the data to be unreliable and no standard implementation has been possible.</p>
      <p>Yes, one possible interpretation of usWeightClass being on a 100-900 scale instead of 1-9 is that intermediate values are permitted, but it is just as feasible that it was defined this way to be future proofed against the definition of additional standard weights.</p>
      <p>There's nothing in the spec, by the way, to suggest that GDI's synthetic bold of usWeightClass &lt;250 is not, in fact, a legitimate use of this data, even though we consider the results in many cases to be 'broken'.</p>
      <p>Of course, we know that the OT format spec in general is very short on implementation guidance.</p>
