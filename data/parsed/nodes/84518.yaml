      <p>David: <em>The solution here is to shove the parameters in question straight up the W3Cs standards stack and let them be properly filled by an ever increasing roster of well behaved fonts.</em></p>
      <p>Which is roughly what Tom and I are suggesting, except that we think the parameters in question need to be a new data structure independent of usWeightClass because the latter is pretty hopelessly broken in places that, unfortunately, are going to continue to have an impact on Web text rendering. Or, put it another way, there is no clear definition of what constitutes 'well behaved fonts' with reference to usWeightClass, since the data set and its uses are themselves underdefined.</p>
      <p>If everyone were willing to dismiss backwards compatibility issues per se, and usWeightClass was better defined so that, moving forwards, standards for implementation could be specified, we'd still have to deal with existing font data in some way. Hence John Daggett's suggestion that some kind of flag mechanism would be needed to indicate the validity of the usWeightClass data according to the new, clean definition.</p>
      <p>Regardless of whether a new data structure or a flag indicating particular use of the existing data structure is employed, new APIs are going to be needed to know what to do with it. So, that being the case, I'm inclined to agree with Tom's suggestion of a new data structure because it provides for the possibility of making fonts that would be compatible with both new APIs and the old usWeightClass interpretation/ignoring. The flag mechanism would only be compatible with the new APIs, and fonts with that data would break in various ways under the old system (synthetic bolding in a lot of versions of IE; different fonts being selected on different platforms).</p>
