      <p>David: <em>The issue is whether CSS will be able to offer these parameters for use in their currently hobbled conditions, vs how they could be more useful as they were originally intended.</em></p>
      <p>And you have your answer from both John Daggett and from me: CSS can use usWeightClass more usefully, as originally intended, only if there is a mechanism that can be used to tell platform APIs -- on which CSS user agents (browsers) rely -- that they should trust and treat the font's usWeightClass as originally intended, instead of treating them as they currently do. None of those API makers are going to break backwards compatibility for how they currently do things with existing fonts, which means that a different behaviour has to rely on a switch in the font itself, e.g. a new fsSelection bit flag.</p>
