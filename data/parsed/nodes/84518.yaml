      <p>CSS font attributes are used as a font descriptor to match a given face in a font family or to substitute something similar when the specified family doesn't exist on a given platform.  This isn't a taxonomy scheme for font families, it's not an attempt to classify font families in their many different variations, it's a simple mechanism to deal with font selection and fallback.  Whatever weight values are used, there needs to be a way of matching those values with the values available in a given font family and they need to be consistent across families. </p>
      <p>The key is that <strong>if</strong> usWeightClass worked as initially intended, it wouldn't be hard to extend CSS to make it support a range instead of just multiple's of 100's.  But as long as platform API vendors (e.g. Apple, Microsoft) view it as unreliable and instead try to infer the weight from the name, while Adobe puts in skewed weight values to avoid synthetic bolding in GDI, there isn't really a standard to base something on.</p>
      <p>Consider the weight values for the Helvetica Neue family:</p>
      <pre>  Helvetica Neue on Mac OS X 10.6
        100   UltraLight 
        300   Light 
        400   Regular 
        700   Bold 
        900   Black (only condensed) 
        
        Helvetica Neue LT Std in Adobe's Font Folio 11 
        250   Thin 
        275   Ultra Light 
        300   Light 
        400   Roman 
        500   Medium 
        700   Bold 
        750   Heavy 
        900   Black 
      </pre><p>
      Note how the Thin and Ultra Light faces differ from each other and from what's described in the OpenType standard. Apple also uses a slightly different scale than the OpenType standard, UltraLight and Thin are in a <a class="freelinking external" href="http://developer.apple.com/library/mac/#documentation/Cocoa/Reference/ApplicationKit/Classes/NSFontManager_Class/Reference/Reference.html#//apple_ref/occ/instm/NSFontManager/convertWeight:ofFont:" rel="nofollow">different order</a>.</p>
      <p>This is important because the OSX font API's sniff the style name and will assign a weight if they recognize a weight name in the style name.  Only if they can't recognize a weight name will they use the usWeightValue. </p>
      <p>For the OpenType spec, the simplest solution I guess would be to add a flag to the fsSelection field similar to the USE_TYPO_METRICS flag, something like USE_OS2_WEIGHT_CLASS maybe, then evangelize folks at Apple, Microsoft, Adobe and at Google to use this in their platform font API's.  This flag would certify that the useWeightValues were in fact consistent with the relative scale defined by the OpenType spec and not skewed to hack around GDI-related problems on Windows.</p>
      <p>For fonts loaded via @font-face rules, authors define what weight/width values are assigned to individual faces, there's no reference to any weight/width data in the font itself, only what is defined in the @font-face rules.  So unless an author is using more than 9 weights simultaneously, that's not much of a limitation currently.</p>
