    html: |-
      <p>David: <em>They are No More Broken than hints ever were (a total parallel imho), and look how that is shaping up. </em></p>
      <p>I think it is a partial parallel. The problem of different platforms interpreting/ignoring hint data in different ways is that the same font renders differently in different places. One problem of different platforms interpreting/ignoring usWeightClass in different ways is that you can end up with <em>different fonts</em> in different places.</p>
      <p>The hinting problem can be addressed by taking steps to equalise <em>quality</em> of rendering at the design level, i.e. compensating for the variable interpretation of hint data by targeting outlines to grids at select size ranges. The usWeightClass problem has to be addressed at the data level.</p>
      <p>The hinting problem can be addressed in such a way that the same font looks good and is readable on multiple platforms (the renderings remain different, but the quality of the renderings is brought closer to each other). The usWeightClass problem, currently, can't be addressed in a way that will produce the same or even qualitatively equivalent results in different places; the only way to stick with the existing data structure and not require new APIs is to declare that you don't care about some of those places.<br>
      ___</p>
      <p>PS. I like Dr Jekyl.</p>
