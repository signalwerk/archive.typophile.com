      <p><em>So what's the problem?</em></p>
      <p>The problem has been explained above by several people. In a nutshell, as John D put it, there is no standard re. usWeightClass on which CSS can base an extensible recommendation of the kind we need to handle fonts with other than nine specific weights. The OT spec is underwritten and ambiguous, and existing software on which Web browsers rely handles usWeightClass data in inconsistent and incompatible ways.</p>
      <p>So, you can have either the status quo or you can have something new. Even if the something new were not new font data, it would still require new APIs to be able to handle the new interpretation of usWeightClass (and in the process break backwards compatibility, which most software makers will balk at).</p>
