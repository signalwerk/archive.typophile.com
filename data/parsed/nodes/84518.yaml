    html: |-
      <p>Chris: <em>A simple numeric progression seems achievable.</em></p>
      <p>Let's go back to John Daggett's helpful summary of the purpose of weight class vis à vis CSS:</p>
      <blockquote><p>CSS font attributes are used as a font descriptor to match a given face in a font family or to substitute something similar when the specified family doesn't exist on a given platform. This isn't a taxonomy scheme for font families, it's not an attempt to classify font families in their many different variations, it's a simple mechanism to deal with font selection and fallback. Whatever weight values are used, there needs to be a way of matching those values with the values available in a given font family and they need to be consistent across families.</p></blockquote>
      <p>[See the last paragraph of John's post for an explanation of why weight class isn't an issue for @font-face served fonts.]</p>
      <p>So we need two things: 1) a clear definition of the acceptable range of values, and 2) consistent application across font families. It should be the case that two fonts with a usWeightClass value of 300 are pretty close to each other in weight, even if the fonts come from different vendors. This is where David's 'well behaved fonts' come in. At present there is no standard that defines the data in a way that can guarantee such consistency.</p>
      <p>I think the creators of Panose understood something fundamental about font selection and fallback that most other people have missed: matching fonts needs to be based on <em>measurement</em> not on subjective and variable notions of 'Ultra-Light' 'Medium' 'Semibold' 'Heavy' etc. It isn't enough to know that two fonts are both called 'Medium' or that both have usWeightClass values of 500 if one is appreciably heavier than the other and if one family's 'Semibold' font (usWeightClass = 600) is actually closer in weight to the 'Medium' in the other family. That is not going to help what David so excellently described as 'making of good lookin’ shit.'</p>
      <p>It seems to me that the only really sound way to use weight class data to indicate true weight (whether usWeightClass or some new data structure) is to link the data to a key stem weight relative to some standard value (which could be proportional, e.g. capheight, or fixed, e.g. em square. [This gets complicated because the system needs to be extensible to non-Latin types (which also means the the key stem might be horizontal in some scripts rather than vertical), and should be able to interact with other CSS fallback mechanisms, especially font-size-adjust.]</p>
