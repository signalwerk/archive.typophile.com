  html: |-
    <p>I am using MS Word in Windows XP system with Cleartype function turned on. I can see clearly all Truetype fonts, but all Opentype fonts appear rather faded or blurred.  </p>
    <p>I learned here that it's related to anti-aliasing function, but is there any way I can improve the "visibility" of Opentype fonts in Windows system?  Thanks.</p>
