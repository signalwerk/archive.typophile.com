    html: <p>If you're looking for something like Futura, but with a curved lowercase "j", you may like Futura's cousin from behind the Iron Curtain, <a class="freelinking external" href="http://www.fontfont.com/fonts/super-grotesk" rel="nofollow">Super Grotesk</a>. I think <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/brandon-text" rel="nofollow">Brandon Text</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/brandon-grotesque" rel="nofollow">Brandon Grotesque</a> could be fine choices as well, maybe a bit overused as webfonts lately.</p>
