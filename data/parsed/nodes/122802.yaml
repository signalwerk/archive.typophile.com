  html: |-
    <p>Dear reader,<br>
    I am looking for the right font for an Identity. I must me a little bit of a Vintage look font, not to serious, not to loose. Maybe something like Futura, only there is a J in the name and I prefer one with the curve, instead of straight down like Futura.<br>
    It also should have O's in the name.<br>
    Maybe someone has tips?</p>
    <p>Thanks</p>
