  html: |-
    <p>Hi,</p>
    <p>Can someone tell me the name of this lovely high contrast serif from Fabric magazine. The one used for the headings. The whole issue can be read here if more samples are needed. <a href="http://theforwardgroup.ceros.com/fabricmagazine/april/page/1" title="http://theforwardgroup.ceros.com/fabricmagazine/april/page/1">http://theforwardgroup.ceros.com/fabricmagazine/april/page/1</a></p>
    <p>If you know the serif for body cope please free free to share that as well. </p>
    <p>Thanks.</p>
