    html: <p>That's great Nick! I have just been doing a pitch recently using just that combination. It works well. I was fortunate that the agency where I worked had a licence for Legato, so I tried to make good use of it! Unfortunately I don't have Legato licenced myself (a tad expensive), but I do have a licence for your very own Sensibility, and my first impression is that it goes very well together with Mendoza. I will certainly test this combination some more.</p>
