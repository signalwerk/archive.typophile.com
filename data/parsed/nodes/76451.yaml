  html: |-
    <p>Hi,</p>
    <p>I'm looking for a sans that can be combined with Mendoza. It should provide proper contrast without being unharmonious. I would use Mendoza as the main text face, also for things like the index (in an atlas-like book) and would like the companion face for emphasis, headers, footers etc. A more "neutral" sans would be preferred. I combined Photina with Unitus (URW's version of Univers) before, but as Mendoza has hardly any contrast, and Photina a lot I don't think Unitus would be good match for Mendoza. </p>
    <p>Any ideas?</p>
