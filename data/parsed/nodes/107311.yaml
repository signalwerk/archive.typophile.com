    html: <p>I used to do this all the time on a photocopier, exactly as brockfrench suggests. Just move the paper while it's copying/scanning. That's clearly how the example was made, all the telltale signs are there. The squished O, for instance, above the large one, comes from moving the paper up and down such that the top of the O briefly passes the scanning head and then falls behind again.</p>
