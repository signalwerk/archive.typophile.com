    html: <p>Take a baking tray or even better a large glass vessel such as a Pyrex tray, paste a print on the bottom (with folds and such), add some clear fluid or oil. Cause some movement bij shaking or stirring the fluid. Photograph. Repeat as often as necessary. Select near perfect print(s). Process image in PhotoShop, maybe combine some images into one.</p>
