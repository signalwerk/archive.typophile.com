  html: <p>Can anyone direct me on how to achieve this kind of wavy/glitched out looking effect with type? I'd greatly appreciate it any info. Thanks!</p><div class="imageWrap"><img src="http://typophile.com/files/coast-_4599.jpg"></div><p></p>
