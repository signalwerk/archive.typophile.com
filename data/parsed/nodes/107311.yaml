    html: |-
      <p>I'm sure there's a way to slice up the type in Photoshop or Illustrator, but an old-timer like me would probably do it via a scanner like brockfrench mentions, although I'm not sure that moving the print around during a scan will achieve that effect. Instead I'd slice the print and rearrange the segments before the scan, maybe glueing or taping them to a backing sheet so they stay in place.</p>
      <p>It will take some experimentation, and obviously you'll need to do a LOT of cleanup to the scan.</p>
