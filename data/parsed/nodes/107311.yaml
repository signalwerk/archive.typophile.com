    html: |-
      <p>Print out a normal copy of whatever it is you want to look 'glitchy'; place it on a flatbed scanner. As the scanner… scans, jostle your print around. Review the output and repeat until you both understand what you're doing and achieve the desired effect.</p>
      <p>–best</p>
