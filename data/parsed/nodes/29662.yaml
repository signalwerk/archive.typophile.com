      <p>At last! I was just about to post a reply when Typophile went on vacation.</p>
      <p>Thanks Paul and Chris for taking time to try to help, it’s good to get advice from a couple of fellow ’bezier wranglers’ Ha! Paul, I know you’re a Script Meister yourself - love Allyson and Zaner Pro. </p>
      <p>I altered the metrics according to Paul’s equation, minus the Typo Line gap and line gap, (is it necessary to have a value here?). </p>
      <p>Could the problem have something to do with ’Splats’ extending above and below the bounding box? Or too many points in these characters?</p>
      <p>See <a href="http://typophile.com/node/16296">Olicana</a></p>
