      <p>from what i understand (someone correct me if i'm wrong)</p>
      <p>under the latest thinking, the equation should be this:<br>
      TypoAscender + TypoDescender + TypoLineGap = WinAscent + WinDescent = hhea ascender (=WinAscent) + hhea descender (=WinDescent) + hhea line gap (=0(zero))</p>
      <p>now hopefully that's clear and correct</p>
      <p>under this scheme, nick would want to bump his TypoLineGap to 100 to make all these things equal out. even then i'm not sure this would fix the problem as nick has described it.</p>
    html_clean: |-
