    <p>When I generate this typeface as an OpenType PS there are no problems, and it works properly.</p>
    <p>The thing that seems peculiar to me is when I scroll across the type to select in InDesign or Illustrator (or whatever), it goes from baseline to baseline from one line to the next. </p>
    <p>As it's a script the characters are all different sizes, so the Ascender, Descender, Cap height and x height values are all pretty arbitrary, but the ascender and descender values do add up to 1000. The fonts' UPM size is 1000.</p>
    <p>Does anybody have any idea why the type is selected like this?</p>
    <p>Have I entered some incorrect values? please see the pics.</p>
    <p>Thanks.</p>
    <p><img src="/sites/default/files/old-images/scroll_4717.jpg"></p>
    <p><img src="/sites/default/files/old-images/met1_4011.jpg"></p>
    <p><img src="/sites/default/files/old-images/met2_4820.jpg"></p>
