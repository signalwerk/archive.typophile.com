    html: "<p>I know paragraph was just kidding with his Ten Commandments post, but I'm thinking that a two-column page, with a centered title and a bold face for title and text wouldn't be bad. Of course, a bold face might not feel right for a law firm. You could also take inspiration from Beatrice Warde's <a href=\"http://infoshare1.princeton.edu/rbsc2/ga/unseenhands/labels/wardePrintOffice.html\" rel=\"nofollow\">\"This is a printing office\"</a>: big type, subtle use of color, etc.</p>"
