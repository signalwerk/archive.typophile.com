    html: <p>Anything's possible, but I guess I'd be surprised if this were a font. That P is so distorted it's almost a D, and I can't imagine a font with that sort of legibility problem would be very useful. I'd guess this is a custom designed logo, and whether it was morphed from another font, or created new is anyone's guess.</p>
