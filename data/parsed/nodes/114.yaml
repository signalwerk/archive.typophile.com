  html: <p>Does anyone have any preference between or thoughts about Glypha versus Serifa? (I have both families.) <br> <br>Obviously there are similarities. Adrian Frutiger designed them both, and I read something that said Glypha is "based on" Serifa. <br> <br>Glypha has an extra black weight, which is an advantage for my purposes, and Serifa seems to have a smaller x-height. Serifa seems a little hipper or cooler and Glypha seems a little cheesy to me... I think it has a kind of 1970s vibe. <br> <br>But these are just my opinions. I'd really like to know what other people think. <br> <br>Thanks.</p>
  html_clean: <p>Does anyone have any preference between or thoughts about Glypha versus Serifa? (I have both families.) <br> <br>Obviously there are similarities. Adrian Frutiger designed them both, and I read something that said Glypha is "based on" Serifa. <br> <br>Glypha has an extra black weight, which is an advantage for my purposes, and Serifa seems to have a smaller x-height. Serifa seems a little hipper or cooler and Glypha seems a little cheesy to me... I think it has a kind of 1970s vibe. <br> <br>But these are just my opinions. I'd really like to know what other people think. <br> <br>Thanks.</p>
