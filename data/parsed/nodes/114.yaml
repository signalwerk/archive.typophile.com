    html: |-
      <p>Frutiger in Adrian Frutiger: Typefaces. The Complete Works, slams his Serifa: "Serifa is one of my worst attempts at a typeface, I think it's fair to say. ... My idea of a constructivist slab serif type face as wrong for the eye ... just isn't comfortable to read, it doesn't flow well enough because of its wide fit." </p>
      <p>Explains that Glypha is Serifa made narrower by stretching it in the x-height region. It's evident he thinks it works a bit better as text, but he still says "As opposed to other slab serif faces, Glypha is an engineered typeface. There's something contrived about it; I'm a little disappointed in it. It seems too harsh." He does think that it works in headlines and large posters.</p>
