      <p>It was apparent in the mid-1970s that small x-height faces were passé.<br>
      The companies producing typositor fonts, such as Photo-Lettering and Headliners, were cranking out large x-height versions of just about every face of any merit, and many without. And of course ITC, with large x-height versions of Cheltenham, Garamond, Kabel, etc., as well as similarly scaled new designs such as Les Usherwood's Caxton.<br>
      This is the cultural and economic context which informs Glypha.</p>
