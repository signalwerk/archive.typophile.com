    <p>Okay. So this is probably going to sound crazy, but it makes sense in my head, so let's see if I can put it into words well enough to garner some conversation.</p>
    <p>I see personalities in type, as I'm sure most of you do. But I'm taking this to the extreme, and personifying a handful of typefaces, writing about them as if they were people. I've chosen one typeface from each 'category' (although I'm not using any official categorization standard for my basis. Kind of a cross between Adobe's and Bringhurst's, with a little bit of Doyald Young's, although not that extensive), and am talking about the typeface 'personality,' laying out a specimen of the typeface, and then examining the differences between that typeface and its close relatives (Bodoni gets compared to Didot, etc). I'm also creating motifs out of each typeface to help show type as image, which most people don't see it as (Nick Shinn's article on FF Oneleigh in Made by FontFont was really interesting on this subject), kind of like Emigre's <a class="freelinking external" href="http://emigre.com/EF.php?fid=98" rel="nofollow">Hypnopaedia</a>, which I didn't discover until I was halfway into the project.</p>
    <p>Okay, so all that being said, I'm trying to figure out exactly what to do with this collection of personalities. It seems to me that I have a group of representatives; each typeface represents a category of other typefaces. If there were an organization of these representatives, what would it be? Would it be like a Congress, or Parliament, even? Where the collection of all of them were important for the well-being of the general whole? Maybe Parliament would be better, as some members are there by birthright—I don't really ever see Garamond being kicked out of this organization. Or is it more of a professional organization, like the AIGA, where several members come together on a board of directors? And then the question becomes, what exactly are they all coming together to <em>do</em>? To communicate is a good place to start ... maybe to serve designers? If you could imagine such a gathering/organization, what would it look like? What would the point of it be?</p>
    <p>I hope that's not too crazy, and that it makes some sense. I'm really interested to see what others have to say!</p>
    <p>P.S. This is a pseudo-school project. I'm working with a faculty advisor on it, but it is not an actual assignment, rather, something I wanted to do for my own fun ... yep, I'm a full blown nerd.</p>
    <p>The main typefaces I'm including are:<br>
    Garamond<br>
    Cochin<br>
    Helvetica<br>
    Futura<br>
    Johnston<br>
    Rockwell<br>
    Bodoni<br>
    some sort of double-feature on Mrs Eaves and Baskerville (that one's going to be fun!)<br>
    and a display or two, tbd</p>
    <p>Sorry for the ridiculously long post....</p>
