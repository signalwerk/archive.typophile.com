      <p>Wow, Michael, thank you. I'm so happy you, too, thought of that. That's actually the new direction (alluded to in my post above) that I'm going in. I just wanted to develop it further before mentioning it here, since my lack of development in my first post caused a bit of confusion. I think I'm going to present the different typefaces as members of an acting company, or actors that will be performing in a specific theatre during the upcoming year. That will provide the opportunity for me (as "director") to explain why I'm including the typefaces that I am, too—it's not that I feel those are the best, or most notable typefaces (although some may be), but each has its own reason for inclusion in this project.</p>
      <p>About personalities, though. Although I agree with the fact that typefaces definitely do not have "intrinsic personalities," I think it is worth noting that we all see <em>some</em> sort of personality in type. Why do we make the choices we do, when chosing a typeface? Why is one more appropriate than another? It all comes down to the feelings one evokes more clearly than another. Johnston is "friendlier" than, say, Helvetica. Mrs Eaves is more "feminine" than, for example, Eurostile. Obviously, that is not the only thing that makes one typeface a better choice than the next, nor is it the only way to explain it, but it is definitely one thing (of many) I think of when making type decisions.</p>
