      <p>Sorry if I was unclear. I'm not trying to assign each typeface a specific, limiting personality, but rather see possible, strong personalities in the typefaces and expose them. It's more of an exercise for fun than for serious explorations of the relationships of the typefaces and different movements in type. As you suggested, Nick, it has more to do with the special meanings and associations that I attach to them than assigning a definite character to each one. </p>
      <p>I been doing more work on the whole concept of the project today and have decided to go in a different direction. The political thing was not working, it was just too forced. </p>
      <p>&gt;You seem to assume somehow that all these typefaces exist in a peaceable kingdom.</p>
      <p>I think that's why the metaphor of a political system did seem like it would work. While they all do coexist, not all can peacefully work together. But again, I'm changing direction, so it's a mute point.</p>
      <p>Again, sorry for the misunderstanding, I should've been more clear as to my objectives. It was just kind of a "what if?", just a trivial look at the possible characters (no pun intended) that make up our visual language. Thanks for the input, though!</p>
