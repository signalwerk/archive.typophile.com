      <p>I think I see what you're getting at. And I have an idea.</p>
      <p>It seems to me that typefaces are actors, and the texts they are used in are their roles. And just as certain actors are better suited for certain roles, so are certain typefaces better suited for certain projects. You wouldn't cast Harrison Ford in a musical, for example, just as you would not use Impact on a wedding invitation.</p>
      <p>Therein comes your analogy: Sometimes you get directors (designers) putting the wrong actors (typefaces) in the wrong roles, and it shows. Similarly, you get actors who want to defy their traditional roles for fear of becoming -- dare I say it? -- <em>typecast</em>, so they take on something different. Sometimes it works (Leslie Nielsen doing comedy after a career of playing tough guys), but usually it doesn't.</p>
      <p>Think about it. Times New Roman, for seemingly forever, performing newspaper copy -- important, dignified work, yet not very exciting ... compare to a Shakespearean actor who does <em>The Merchant of Venice</em> and <em>King Lear</em> so well. Or Cooper, always has a fun role, but never very many lines. (Is Comic Sans the bad comedian who thinks he's funny but everyone just groans instead?)</p>
      <p>Give it a whirl.</p>
