      <p>Typefaces don't have intrinsic personalities -- unless you can come up with some respectable graphology, which is not something that's much respected.<br>
      A lot of them would end up with split personalities, especially blackletter, hanging out on Christmas cards and gangsta tattoos.<br>
      Nonetheless, types are cyphers, and we all have our special meanings and associations which we attach to them, so you can work with that.</p>
