  html: |-
    <p>I'm working on a project right now and the organization's logo is comprised of Hoefler Text Reg set in small caps. I'm looking for a nice sans to use in conjunction with this. H&amp;FJ recommends Whitney, however, I'm not a fan of Whitney, and would like to use something different. Something easily accessible by the organization is also a plus. </p>
    <p>The organization has a safe, yet modern look. They aim to appeal to a younger generation, yet convey, trust, assurance, and wisdom. Hoefler Text does a good job (in my opinion) of evoking the trust, assurance, and wisdom aspects. </p>
    <p>Looking for a nice clean sans that can wrap up the modern, and young aspect. Thinking something like Helvetica LT Neue or Avenir LT STD would work nicely. Both no frills, clean, almost steril sans-serifs. </p>
    <p>Any further input is appreciated, if you've got the perfect sans for Hoefler, I'd love to know.</p>
