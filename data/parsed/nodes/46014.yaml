      <p>Hello Jason,</p>
      <p>Sorry for my English, I don't know if it is this that you want, I can't fully understand your question :-D</p>
      <p>The way I would do is to have a Paragraph Style with all the text indentend at 4mm and then have the bullets lines with a paragraph first line at -2 (this is because Indesign can't indent text outside the text box frame). For this to work your text box would have to 'include' the gutter.</p>
      <p>If you only have a few lines to put the bullets into you could think of having two paragraph styles, one 'normal' and one like I mentioned above. You would then have two types of text boxes: the 'normal' ones without the gutter and the 'bullet' ones (linked) when you need them.</p>
      <p>Hope this helps<br>
      All the best</p>
      <p>Pedro Monteiro<br>
      <a href="http://whatype.wordpress.com/" title="http://whatype.wordpress.com/">http://whatype.wordpress.com/</a></p>
