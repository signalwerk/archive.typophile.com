      <p>I faced this problem today, with line numbers that hang into the left margin. Our old program (TeX) had llap (left lap) and rlap; I'd sure like to see them implemented with InDesign.</p>
      <p>What worked was to go into the font &amp; make up a zero-width character (U+200B). Set that character first, then your line number, then an em-space (or whatever clearance you want), then begin your text. Put a 1,000 unit negative kern between the zero-width character and the line number (or bullet, or whatever). That is the most ID CS2 will allow. But you can change the actual distance the copy moves left by varying the size of the "zero-width" character. Since it has no width, it doesn't push the copy inward as the point size goes up, it just moves left.</p>
      <p>I could move the line numbers off the page by using a large point size zero-width character with a -1,000 unit kern to the line number. Just pick the size that places things as you want. </p>
      <p>If you are using multiple digits, set up using tabular numbers for the line numbers. As long as you are making up a zero-width space, make up a figure space for padding if needed. We pre-program all this into an InDesign-tagged-text file with a character style around the line numbers, but all that saves is time, the technique will work with direct formatting.</p>
      <p>Not a replacement for reverse carriage, or the better tools of llap &amp; rlap, but it does work.</p>
      <p>FWIW</p>
