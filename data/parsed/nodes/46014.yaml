    <p>Hello,<br>
    I need some advice on hanging indents in InDesign. </p>
    <p>I would like the bullet points of a par to align outside the margin of the text (see attached image LH column). The only way I can seem to achieve this is to indent the normal body copy and heads. Is this the right way to do it? Seems like I need to reset all of my body copy indents to make this work. Then it don't align with my grid (ie page heads are 4mm out of whack).</p>
    <p>Hope this makes sense and someone can help.</p>
    <p>Cheers<br>
    Jason.</p>
