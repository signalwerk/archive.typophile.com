      <p>Here's what I'd do:<br>
      1. Set a <em>Left Indent</em> in the body style<br>
      2. Create a new bullet style with a tab equal to the length of the indent<br>
      3. Set the <em>Space After</em> for the bullets<br>
      4. Insert <em>Indent to Here</em> symbols before the first letter of each bulleted sentence<br>
      5. Apply the Bullet style to the text you wish to negatively indent.</p>
