      <p>An interesting development:<br>
      In a bit of fortunate timing, a competition and conference<br>
      have been launched to honor innovation, technology use<br>
      and good design among Armenian Websites.</p>
      <p>The first phase of the competition is a popular vote, so we<br>
      need your help to get to phase two! Please take a moment<br>
      to vote for Armenotype here: <a href="http://tinyurl.com/2dhzkdq">http://tinyurl.com/2dhzkdq</a></p>
      <p>And please tell others to do the same! With everybody's<br>
      help, and if phase two goes well, we'll convey the passion<br>
      for the Armenian script to as many people as possible.</p>
      <p>Thank you.</p>
      <p>hhp</p>
