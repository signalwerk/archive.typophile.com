      <p>An interesting article.</p>
      <p>When I look at the Republic of Ireland, and see how many - or, rather, how <em>few</em> - people there can speak Gaelic, I can't be optimistic.</p>
      <p>The <em>bar mitzvah</em> makes Hebrew, as an aspect of Jewish identity, something of an exception. (On the other hand, Yiddish is apparently dying out.)</p>
      <p>A fraction of the younger generation, at any given moment, will simply not see it worth the effort to maintain a language skill without immediate economic relevance.</p>
      <p>This is true even in a place like Canada, where assimilation is not as strongly encouraged as in the United States.</p>
      <p>Still, I suppose that's just a reason to redouble one's efforts, not to give up.</p>
