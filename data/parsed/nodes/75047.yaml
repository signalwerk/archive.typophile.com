      <p>A typeface based on the "Bolorgir" traditional pattern is noted as something you did before you knew any better... but typefaces that are heavily Latinized aren't right either.</p>
      <p>Many people <em>here</em> will understand what you're getting at, but naïve readers of that article will be perplexed - because if one doesn't imitate "world culture", what else is left but to stand solidly on authentic historical tradition?</p>
      <p>Of course, the answer is to draw on authentic historical roots - but not be chained to them. To be original. To look elsewhere - to Japan, to the Arab world, to Ethiopia, to Greece - for inspiration, not just to United States mass culture. But that has to be <em>said</em>, as it's not something everyone will guess or understand.</p>
