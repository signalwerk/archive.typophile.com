      <p>On a scale of 1 to 10, or however one wishes to put it, though, except for the fact of being a script with a small number of users (and hence a small number of type designers), I don't think Armenian faces severe problems.</p>
      <p>Of course, balancing "Armenian-ness" defined, however incorrectly, as a resemblance to Bolorgir (the weighted sans-serif type with the really small x-height and slanted lowercase, for those who don't want to look it up) with Latin typeface conventions is a challenge. But it's simply a stylistic void that invites designers to propose solutions.</p>
      <p>On the other hand, properly implementing the calligraphic rules of Arabic stretches the limits of current electronic font technology.</p>
      <p>Ethiopic doesn't have a fundamental technical problem, but the character set is large enough that the forms of some of the elements of its syllabary were compromised to allow the language to be typed on an ordinary typewriter. So while fonts for the language don't require sophisticated character to glyph mapping, keyboards may need work. (Think of Chinese or Korean input methods.)</p>
      <p>Even Greek - which has a larger (and more economically prosperous, at least until recently) community of users than Armenian - has, in my opinion, a more serious problem than Armenian. It, too, was under Turkish rule for a long time, leading to Greek typography being done chiefly by foreigners. And so we have the effects of Porson Greek on the script.</p>
      <p>Greek capital letters, like those of Cyrillic, fit the standard Latin paradigm just fine. But capitals and lower case were basically not integrated at all in Porson Greek. While most modern typefaces do better at this, this, in my opinion, is a very basic stylistic issue which, so far, does not seem to be addressed in a satisfactory manner outside of sans-serif faces.</p>
      <p>In the case of the Latin alphabet, Bembo, Caslon, Garamond, Bodoni, Baskerville, Century Expanded, Caledonia and Times Roman can be said to <em>all</em> resoundingly embody pretty well the same basic answer to the question "What should the Latin alphabet look like".</p>
      <p>So much so, that perhaps the Latin alphabet is <em>more</em> ossified than Armenian, at least at present, despite the effects of Bolorgir. It's a good thing we have a solution that makes everyone happy, though - and the Latin alphabet, being so widely used, does get lots of experimental designs being done for it.</p>
