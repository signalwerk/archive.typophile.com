      <p><em>Of course, the answer is to draw on authentic historical roots</em></p>
      <p>One way to do that is to look at pre-typographic text culture and, in effect, move forward from there along new lines. This is especially fruitful in the case of scripts that have been ill served by the technical limitations of previous font and typesetting technologies, or which have ossified in their typographic form as a result of having too few type designs available for too long (which seems to have been the case with the Armenian <em>bolorgir</em> style).</p>
      <p>We're very fortunate in the case of Armenian that there is such a good <a href="http://armenianstudies.csufresno.edu/books_for_sale/album_of_armenian_paleography.htm">palaeographic study</a> of the script. I wish every script I worked with had such a resource!</p>
