  html: |-
    <p><a href="http://armenotype.com/" title="http://armenotype.com/">http://armenotype.com/</a></p>
    <p>About 12 hours ago Nina Stössinger and I launched a new website about Armenian type (and related fields). She did an amazing job in less than three weeks, and we'd love to see anybody and everybody with even a remote curiosity about the Armenian script check it out, register for the mailing list, and post comments.</p>
    <p>BTW, the site was launched on the Armenian diaspora's premiere TV network, Horizon, live on Friday night! Nerve-wracking but very exciting.</p>
    <p>hhp</p>
  html_clean: |-
    <p><a href="http://armenotype.com/" title="http://armenotype.com/" class="link-external">http://armenotype.com/</a></p>
