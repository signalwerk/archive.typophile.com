    html: <p>The font uses Unicode Hebrew encoding, so you will need an environment that supports right-to-left Unicode layout, and some means to input Hebrew Unicode characters (e.g. an appropriate keyboard driver (i.e. software; not physical keyboard)). The font contains both Hebrew and Latin characters, which explains why it might preview as Latin.</p>
