  html: <p>I recently purchased an Adobe font – Myriad Hebrew Bold – to use on a client's job. I can't read or write Hebrew but I usually can just copy and paste letters into InDesign based on a sample sent by the client. On my Mac I can use Quick Look to see a preview of the font and Suitcase, my font management system, also has a preview. Myriad Hebrew Bold (which is definitely Hebrew on the Adobe site) appears as an English font on my system, in both previews and when used in any program. After hours being transferred around on Adobe Customer Service, the final verdict was that I needed a special non-English keyboard or something to use the font! I have dozens of other foreign language fonts that work perfectly. Does anyone have any idea what's going on? Could this really be a font that can only be used in a Hebrew language system environment? There's certainly no reference to that on the Adobe site. Any help would be appreciated.</p>
  html_clean: <p>I recently purchased an Adobe font – Myriad Hebrew Bold – to use on a client's job. I can't read or write Hebrew but I usually can just copy and paste letters into InDesign based on a sample sent by the client. On my Mac I can use Quick Look to see a preview of the font and Suitcase, my font management system, also has a preview. Myriad Hebrew Bold (which is definitely Hebrew on the Adobe site) appears as an English font on my system, in both previews and when used in any program. After hours being transferred around on Adobe Customer Service, the final verdict was that I needed a special non-English keyboard or something to use the font! I have dozens of other foreign language fonts that work perfectly. Does anyone have any idea what's going on? Could this really be a font that can only be used in a Hebrew language system environment? There's certainly no reference to that on the Adobe site. Any help would be appreciated.</p>
