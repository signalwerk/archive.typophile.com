      <blockquote><p>...but I didn't think you could do right-to-left paragraph, story and document layout in the regular version. </p></blockquote>
      <p>Good point, I don't know. We did force different linebreaks in the Hebrew sentences by adding junk Latin characters at the head of a test paragraph, and it rebroke the lines with Hebrew correctly, but that's not the same thing.</p>
      <p>For the original poster -- If it is two works, I'd just set the Hebrew any way you can. I've set 20 pages of it that way from manuscript -- with cantellation marks put in by hand to mirror the manuscript. I told the client what it would cost ahead of time, and held the charges to that (a very large amount).</p>
      <p>This was before OpenType, by the way. OpenType offers great time savings, but you then have to trust the software, as there often isn't a *manuscript* -- just a computer file in MS Word. And you know what that can be worth...</p>
      <p>Edit:</p>
      <p>BTW, I believe John Hudson did Adobe Hebrew (essentially a Minion-based font). Believe Myriad was done by Slimbach...</p>
