      <p>Hi, I am the designer of this typeface.<br>
      I am not very familiar with Gotham and its development, but I think if there are similarities it is because both are based on the same source: lettering in architecture.</p>
      <p>Soleil was initially designed for a signage and wayfinding system.<br>
      (For those of you who were at ATypI Mexico in 2009 or at the ICTVC conference 2010 in Cyprus and saw my lecture: sorry that I repeat here the same old stuff.) This signage and wayfinding system was developed in 2007 by Bohatsch and Partners in Vienna<br>
      <a class="freelinking external" href="http://www.bohatsch.at/" rel="nofollow">http://www.bohatsch.at/</a><br>
      I was part of the design team for this signage and wayfinding system (together with Walter Bohatsch, Andreas Soller and Julia Krauth), and I also designed the typeface for the signage system (which would later become Soleil).</p>
      <p>The brief for the signage and wayfinding system asked to integrate the original metal letters used in the building (a 1950ies modernist building) into the new signage and wayfinding system, and so we proposed to design a new typeface for it, because none of the then existing typefaces matched exactly the shapes of the original metal letters (which were upper case only) used in the staircase of building.</p>
      <p>When I did the usual test prints, I was surprised that it worked quite well also for longer texts, and so I decided to release it. So that's the story behind this typeface. For a more detailed account: There is also an article about this project and the design process that led to Soleil in TYPO magazine no 41, 2010, pp 52-57<br>
      <a class="freelinking external" href="http://www.typo.cz/en/" rel="nofollow">http://www.typo.cz/en/</a></p>
      <p>I tried to upload some pictures that illustrate what I wrote, but it seems there are some problems with uploading right now ...<br>
      However, here is a link where you can see these pictures:<br>
      <a class="freelinking external" href="http://www.flickr.com/photos/71254719@N02/sets/72157628249625095/detail/" rel="nofollow">http://www.flickr.com/photos/71254719@N02/sets/72157628249625095/detail/</a></p>
