    <p></p><div class="imageWrap"><img src="http://typophile.com/files/soleil_13_5100.gif"></div><p></p>
    <p><a class="freelinking external" href="http://www.type-together.com/Soleil" rel="nofollow">Soleil</a>, designed by Wolfgang Homola, is a geometric sans serif typeface. Unlike most existing geometric sans serif typefaces, it has asymmetrical counters, making it look fresher, more dynamic and more contemporary. Simple geometric forms – such as the circle or the square – played a certain role in the design of the letterforms, but in order to introduce more fluidity into the rather stiff and rigid concept of geometric sans serif typefaces, a lot of optical corrections were necessary.<br>
    <a class="freelinking external" href="http://www.type-together.com/Soleil" rel="nofollow">Soleil</a> is based on the modernist ideas of simplicity, clarity and reduction to essential forms. Yet its letter shapes are not the result of geometric construction, but of a design process that brings together simplicity and fluidity, clarity and rhythm.<br>
    <a class="freelinking external" href="http://www.type-together.com/Soleil" rel="nofollow">Soleil</a> has a rather large x-height, making it legible also in small sizes or from a bigger distance. The typeface family consists of six weights.<br>
    The Opentype version also allows for the implementation of typographic features such as Small Caps, lining and old-style figures, both tabular and proportional, ligatures, alternate characters, case-sensitive variants and fractions.<br>
    Soleil offers a wide range of potential applications: signage and wayfinding systems, book and magazine design, branding and corporate publications.</p>
    <p>more information at: <a class="freelinking external" href="http://www.type-together.com/Soleil" rel="nofollow">http://www.type-together.com/Soleil</a></p>
