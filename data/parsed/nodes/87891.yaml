    html: |-
      <p>That's interesting, I'm surprised it’s not mentioned by the foundry.</p>
      <p>I did a similar project with students at Humber College in Toronto.<br>
      I asked them to digitize the typeface used in the Toronto Transit System subway (underground), designed in the 1950s, modernist, all caps, and design a companion lower case. But we didn't get any further than the one weight, roman.</p>
      <p>Something similar that I had created earlier was my Figgins revival, which developed a sans family from a single-weight bold all caps font.</p>
      <p>I would almost call this genre (if such a thing it be) “historical fiction”, were it not for the fact that the original source material is followed quite closely and included in the much larger end product. Is “speculative revival” an appropriate term?</p>
