      <p><em>Unlike most existing geometric sans serif typefaces, it has asymmetrical counters, making it look fresher, more dynamic and more contemporary.</em></p>
      <p>Asymmetric counters in a geometric sans are a characteristic of Proxima Sans/Nova, published in 1995/2005.<br>
      In fact, they are primarily what distinguish it from the later Gotham (2002), which has symmetric counters.<br>
      Those are the two types which IMHO define the contemporary era, so I wouldn’t say that the symmetry of counters in a geometric face is an issue of freshness, dynamism, or contemporariness.</p>
