      <p>Given the success of Proxima and Brandon, it could be argued that a new geometric sans with asymmetric counters is not fresh and different, but following the leader. This is not to deny that Soleil is an excellent new face with a distinctive personality, but I don’t think that its asymmetric counters alone can be considered a marketing point-of-difference.</p>
      <p>At this stage of the game, with so many foundries publishing faces of subtle distinction, descriptive text beyond “it’s a geometric sans with a little bit of the rigidity taken off” doesn’t add much—although a certain amount of typespeak does give the impression that a type is important.</p>
      <p>I find the lower case “t” to be the signature glyph.</p>
