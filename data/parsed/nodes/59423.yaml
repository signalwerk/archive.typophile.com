    <p>Hey guys - </p>
    <p>I'm looking for a nice, big, bold kid friendly font that's got something interesting about. Something far more elegant and intriguing than say a Comic Sans or a fake Superman/Indiana Jones PC font.</p>
    <p>If I could give you some samples - I would :p Basicaly I'm working on a logo &amp; website for company that sells trampolines and want to specifically appear more kid and family friendly. </p>
    <p>Any help would be super appreciated!</p>
