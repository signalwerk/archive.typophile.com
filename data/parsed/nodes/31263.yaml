      <p>Definitely an improvement, but I think there's still room to do better.</p>
      <p>AVA is kerned too tight. Even AN could probably be loosened a bit (and should certainly be more consistent with NA spacing).</p>
      <p>I don't know Armenian letterforms well enough to comment expertly either, but there are a few things that bother me. For one, the cap U (s sound) has a very different weight distribution than the small-cap u-with tail (a sound). There are other color issues. For example, the last letter (n sound) is light, and the phi-letter (p sound) is dark.</p>
      <p>The thin black rule between the two language versions doesn't give me a warm, fuzzy feeling either. Since you now have a graphic, maybe you could integrate that in so that it separates the two text slugs.</p>
