    <p>This is a followup to an earlier post about selecting type for a city in Armenia that I am doing a logo/branding for.  The logo will be on a map, brochures, web site and signage.  It will also end up as the logo for the information center (with information center added).  Target audience is primarily tourists, and the brochure will be in English/French/Armenian.  </p>
    <p>Biggest challenge for me is that I don't know Armenian at all, and am just working with letterforms.  I originally did it in lower case, but that was rejected as apparently towns are written in all caps for ease of readability (see old version for a clear example of why!).</p>
    <p>This version is Trajan Pro, small caps with larger capital.  The Armenian letters are modified to fit in with Trajan from another face.  The graphic is an iconic mountain of the area with a sun, all in the colors of the Armenian flag.  The lettering is in green to help evoke an impression of naturalness (they have more trees than most of Armenia apparently).</p>
    <p>Any and all comments welcome!</p><div class="imageWrap"><img src="http://typophile.com/files/stepanavan_5759.png"></div><p></p>
    <p>The old version for reference</p><div class="imageWrap"><img src="http://typophile.com/files/stepanavan_old_3608.png"></div><p></p>
