    html: <p>Can't find a match so I'd say bespoke. Reminds me a lot of <a href="http://www.myfonts.com/fonts/mti/plantin" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Plantin</a> and Radim Peško's <a href="http://www.radimpesko.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Larish Neue (less Larish Alte)</a>. There are aslo in the same vein <a href="http://www.colophon-foundry.org" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Colophon</a> Fortescue, Value Serif, <a href="http://optimo.ch" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Optimo</a> Stanley, Markus John's <a href="http://tendollarfonts.com/products/rasmus" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Rasmus</a> and Philippe Hermann's <a href="http://fontseek.info" title="Click to visit an external URL." class="freelink freelink-external freelink-external">GZA</a>.</p>
