    <p>I couldn't get <a href="http://www.typophile.com/forums/messages/30/64169.html?1107377490">this thread</a> going again, so I'm posting new. This is for "The Typographer's Dream" at Encore Theater Company. If you've been waiting for your chance for your profession/avocation to be honored on stage, this is it. (You already had your shot on television with "The Twilight Zone" -- ask Jared 'n' Joe about that one if you haven't seen it already.) <br> <br>Anyway, my revised date for going to the show is this Friday, February 26. I have no idea how tickets are selling, but it's a good idea to reserve as early as possible. <br> <br>Who's in?</p>
