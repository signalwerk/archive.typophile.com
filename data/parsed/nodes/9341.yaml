    html: <p>Hey - I'm a lurker here on typophile, but I'm also the Company Manager for Encore Theatre, and as thanks for the self-promotion of the show that's going on here, I'd like to offer typophiles the chance to see The Typographer's Dream at a discount group rate (10 people or more).  It doesn't have to be all at one performance (i.e., 5 at a Saturday, 2 at a Sunday Matinee, 3 at a Sunday evening), but tickets would have to be paid in advance.  So if enough of you would like to see it, email me at <a href="mailto:reynaldi@encoretheatrecompany.org">reynaldi@encoretheatrecompany.org</a>, and let's make a deal! <br> <br>-Reynaldi</p>
