    html: <p>I recommend this production to type nerds and map geeks alike. I saw it a couple weeks ago and the writing is excellent, the characters are vivid, and the topic strays far from type, which is a reason to bring your long-suffering friends and family along. You won't be bored. You will probably laff. Looks like it's extended to April 3.</p>
