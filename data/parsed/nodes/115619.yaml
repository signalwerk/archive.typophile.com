      <p>Of course, the 1897 specimen contained many faces that ended up being revived during the phototypesetting era:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ArtGoth_5115.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Quaint_4832.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Rubens_6685.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Washington_5791.jpg"></div><p></p>
      <p>It could have been that the lettering from Art Deco era posters, not Quaint itself, was the basis of the later faces I'm thinking of, though.</p>
      <p>It was also interesting to me that Columbus, featured in the 1897 specimen, gave rise to American Italic which appeared in a later one.</p>
