    html: |-
      <p>I have seen the name DeVinne applied to faces other than the one most commonly given that appellation:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DeVinne_5290.jpg"></div><p></p>
      <p>Here are Columbus and American Italic, as I mentioned; the latter was in the 1906 specimen, while Columbus was in 1896 and 1897, but not later:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Colombus_6299.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/AmItal1906_6386.jpg"></div><p></p>
      <p>I noticed in the Keystone specimen a Caslon Old Style that looked a bit odd:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/COS2_key_5120.jpg"></div><p></p>
      <p>In the sixteen point size, it makes the descenders on Caslon 540 look long. In another size,</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/CaslonOld_5324.jpg"></div><p></p>
      <p>look closely at the lowercase "e". Oh, dear, using pied type for your specimen book.</p>
