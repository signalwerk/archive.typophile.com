  votes: null
  html: |-
    <p>I've got a desperate need for a script or plugin which will allow visitors to a website to generate custom previews of fonts the way they can on MyFonts or Fonts.com.  Was using Texter but it was too quirky and has stopped really working.  This ought to be something which can be implemented fairly simply with SWF fonts, but I just don't know how to do it.  Is there anything out there along the lines of a Java script or a Wordpress plugin which would let me offer this feature to visitors to my site?</p>
    <p>Dave</p>
