      <p>I happened to have tried out  Typeshow on your website earlier today. As a user, I certainly like its simple interface and clear results. I don't know the product at all, but I noticed that the font size is automatic - modified to try and fit the entered text into the available window. For short phrases, this results in text large enough for it to be clipped. For example, enter "Diomedes" for your new Diomedes font, and see the  'm' get its tail cut off.</p>
      <p> - Herb</p>
