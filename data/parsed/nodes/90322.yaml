      <p>Thanks for the replies; the guitar guys came through with the fact (from a/the Who site) that they are Letraset numbers (so I was right about a UK equivalent of Presstype, although one I used a lot in the '70s, but had forgotten- this probably explains the maddening familiarity of the font).<br>
      Letraset's closest current font is Charlotte Book Sans, which is close but no cigar, perhaps because the site says it was done in 1992 &amp; thus unlikely to have been very available in 1974.<br>
      eliason: yes, very close &amp; likely you are correct that the designer is "biting" (as we used to say when we did calligraphy on the MTA) what I'm looking for (as is the current Letraset font, which in any case doesn't come in the white 5" high numerals needed).<br>
      One of the guitar guys blew up a pic of one of Townsend's guitars to lifesize &amp; traced the number to make one for his guitar, so you can see I'm not [entirely] alone in my OCD-ness.,</p>
