    <p>This is a somewhat absurdly OCD question, but I figure I've come to the right place to ask about fonts; I initially posed this question in a guitar forum &amp; got nowhere:<br>
    Beginning in '74, Pete Townsend of The Who numbered his Les Pauls (guitars) 1-9 for different tunings etc. Between songs he would take them off &amp; literally throw the guitar to a roadie- I remember being very impressed by all this business with the numbered guitars when I saw them in the mid-'70s. What font was he (or his guitar tech) using?<br>
    See here as I can't seem to get the img tag to work:<br>
    <a class="freelinking external" href="http://www.feelnumb.com/wp-content/uploads/2009/10/76_ptbackstage-tuning1.jpg" rel="nofollow">http://www.feelnumb.com/wp-content/uploads/2009/10/76_ptbackstage-tuning1.jpg</a><br>
    I was thinking about putting a number on a Les Paul I just got, but can't find the right font among the bazillions on my Mac or with an online search.<br>
    It's very close to the London Underground font aka P22 Johnston in bold variants, but the "8" among others is off.<br>
    Can anyone tell me the right font?<br>
    One clue would be whatever fonts were available in Presstype rub-on lettering in 1974 (or, more likely, some UK equivalent I've never heard of), as I'd bet that was what was used to number the guitars.<br>
    Many thanx for any help.</p>
