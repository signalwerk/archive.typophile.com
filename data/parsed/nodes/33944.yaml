    <p>A week ago or so, i came up with a website of an author of typefaces called “closer” and “pick-up”. Rather than bookmark the website i wrote down names of typefaces in hope of later purchase; now in desperate search of that website since i can’t find this two typefaces anywhere on the web.</p>
    <p>Google is returning results regarding “picking up the right font” and “using the font wich is closer to ..” not paying attention to zilion of my keyword combinations and tricks.</p>
    <p>I’d be very grateful for any information regarding this two typefaces!</p>
