  html: |-
    <p>Does anyone know if there is a relatively easy way (a python script which someone has made available perhaps?) to rename glyphs in FLS5?</p>
    <p>Ideally, I'd like to find a way where I can rename glyph X and (i) have the glyph name changed in the code and classes, and (ii) have all glyphs named X.* changed as well. (i) is easy enough, but I don't know of any simple way to achieve (ii) that doesn't involve manually renaming all of the glyphs involved.</p>
    <p>Any suggestions?</p>
    <p>André</p>
