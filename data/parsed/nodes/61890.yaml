    html: |-
      <p>Try <a class="freelinking external" href="http://www.adhesiontext.com/typophile/GlyphRenamer.zip">GlyphRenamer</a>. All it requires is a text file with two columns of names separated by white space (can be one or more space characters or tabs). So something like,</p>
      <p><code>oldName1    newName1<br>
      oldName2    newName2<br>
      oldName3    newName3</code></p>
      <p>The script will only rename glyphs. It won't change the glyph names used in Classes or OT features.</p>
