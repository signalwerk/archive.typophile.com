    html: <p>&lt;font class="dontLookLikeCrap"&gt;I'm not entirely sure how to critique this, since I'm unsure of your final intent for this design. At the stroke width with which you've drawn these characters, you'd have to print them at at least 24pt or so, but most of the changes you've made to the lowercase so far have conventionalized the shapes. It seems to me that typefaces designed to be printed large have an extra flexibility in their shapes that should be taken advantage of. <br> <br>For instance, in type set small (9-12pt) I find that a nice even texture is pleasant to look at; your original g with its canted lower loop might stand out too much and wreck the texture. On the other hand, in type set large, I'd find the stranger lower loop of the g to be a nice detail to enliven the line of text. In the same vein, I prefer the longer tails on i l t if they're going to be used display size. <br> <br>At the same time, I'm curious about the approach of working from a thin skeleton of a character towards a thicker fuller shape. A large part of the challenge for me in drawing type is resolving the distribution of weight around the shape of the character. This problem doesn't exist in a very thin monoline font since you don't have to compensate for joining strokes or balance of the weight within the glyph. So it seems to me that you'll have to think through this for each thicker character shape that you make from these thinner shapes. <br> <br>The only glyph that bugs me outright is the f. The space on the right side of the f is too large. If you want to keep the crossbar on the left side short, I'd either shorten it on the right side of kern it very agressively on the right side. <br> <br>I'm looking forward to seeing how your project develops. Keep us posted!&lt;/font&gt;</p>
