    html: <p>Printed out the PDF. I'm getting a better sense of the design now and I'm liking it more, especially the italic. The rhythm in the shapes and spacing of the italic looks just right to my eyes. I prefer the italic g with the larger bottom bowl because the sizes of the two bowls feel more balanced, and I prefer the i l t with the feet that point up. This tight turn darkens and solidifies the baseline, making the lines of text easier to track, and it also adds texture at a smaller scale than the larger turns (bowl of abdpq, arc of hnmu, etc) which stands in pleasant contrast to them. <br> <br>The spacing in the roman still bothers me. The tightness of the fit works well at large sizes (~100pt). The spacing on i f l t though maybe place the vertical strokes of these letters too far to the left. The image below shows the spacing as is. <br> <br><a href="http://www.xtypa.com/ext/typophile/letterspace.gif"> letter orig spacing</a> <br> <br>The lines of matching color are the same length. You can see how in all measurements -- at x-height, mid-height, baseline -- the space on the left is smaller than on the right. Increasing the left sidebearing of the t and decreasing the right sidebearing balances the white spaces around the tt combination and, to my eyes, makes the word more balanced as well. <br> <br><a href="http://www.xtypa.com/ext/typophile/letterspaceadjust.gif"> letter spacing adjusted</a> <br> <br>I realize kerning isn't done yet, but I think this a problem that can be solved without kerning and should cut down on the number of kerning pairs you have to add later. <br> <br>(Sorry, no inline images. The forums software is choking)</p>
