    html: "<p>Hi Dan. <br> <br>These comments are directed at your black weight. My guess is that you're planning to do the light and black and interpolate the rest. This is an efficient plan, I'm doing the same on a fon't I'm working on. It does have it's difficulties though: <br> <br>1) You don't design the font by working directly on the weight that will be most often used (the regular), but instead have to constantly check that what you're doing at the extremes will produce a nice middle. <br> <br>2) Your light weight is monoline. Your black has pretty heavy modulation from thick and thin (it must to remain open) as Chris points out. In your MM setup this will mean the middle weights, regular &amp; even more so the bold, will be in this awkward middle ground where they just look goofy. In my case, I've decided to use three masters. One at the light, one at the bold, and one at the black, giving more control over the modulation. <br> <br>3) The x-height is looking way more cramped in the black version. This is because the counters are not as open. So consider giving the black a larger x-height and focus on opening up the counters. <br> <br>4) Your a needs more weight in the bowl. You may not get it quite as thick as the right side, but it's too thin now. The right side of your e suffers the same problem. <br> <br>5) Consider making the i l t sit harder on the baseline. I know this removes a unique feature, but for testing purposes try it in text settings and see if a more conventional approach is better. <br> <br>6) I agree with Chris on the vwxyz. <br> <br>7) Consider putting more weight in the spine of your s and less in the top and bottom. Also note that it's top heavy. I bet it you flip it, it will still look top heavy :-) <br> <br>Cheers, <br>Randy</p>"
