    html: "<p>I'll resist the temptation to present my underqualified opinions on <br>specific glyphs in the Cyrillic, but I'd like to point out the following: <br>1) Considering the Latin, I think you should go with the more cursive italic. <br>2) If you're indeed applying my flavor of balance in a multi-script system, and if darker weights of this bring it close enough to potential [short] text usage*, then you should consider: making the vertical proportions more generous in the \"x-height\" region for the Cyrillic (important); intentionally diverging what John calls \"cognate\" glyphs, like the \"a\" (possibly too unorthodox for you). <br> <br>* In the display realm those two issues (especially the 2nd) can be counter-productive. <br> <br>&gt; How do alphabetic styles tend to differentiate <br>&gt; themselves between Bulgaria and Russia. <br> <br>This is a great question, and it would be great <br>for somebody to write something decent about <br>ethnic preferences in Cyrillic. <br> <br>Ivan, could you do this for Bulgarian versus Russian? <br> <br>hhp</p>"
    html_clean: "<p>I'll resist the temptation to present my underqualified opinions on <br>specific glyphs in the Cyrillic, but I'd like to point out the following: <br>1) Considering the Latin, I think you should go with the more cursive italic. <br>2) If you're indeed applying my flavor of balance in a multi-script system, and if darker weights of this bring it close enough to potential [short] text usage*, then you should consider: making the vertical proportions more generous in the \"x-height\" region for the Cyrillic (important); intentionally diverging what John calls \"cognate\" glyphs, like the \"a\" (possibly too unorthodox for you). <br> <br>* In the display realm those two issues (especially the 2nd) can be counter-productive. <br> <br>&gt; How do alphabetic styles tend to differentiate <br>&gt; themselves between Bulgaria and Russia. <br> <br>This is a great question, and it would be great <br>for somebody to write something decent about <br>ethnic preferences in Cyrillic. <br> <br>Ivan, could you do this for Bulgarian versus Russian? <br> <br>hhp</p>"
