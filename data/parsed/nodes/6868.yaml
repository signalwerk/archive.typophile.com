    html: "<p>Dan, okay I know somethings about cyrillics, but by no means am i an expert. Just some things that popped out at me: <br>Overall i think you did a ver good job, bravo! <br>I prefer the alternate EL, DE, el and de (the triangular ones) and i personally think that they harmonize better with your design. <br>I don't like the EF, try an oval on your vertical for that one. <br>The ZHE seems a bit strange to me. I know it matches your KA, but maybe you could make the ZHE (or maybe both) a bit more decorative with some curvature in the upper arms (just a suggestion). <br>The Che and che seem a bit narrow to me and the SHA and SHCHA seem a bit wide. <br>that's all that jumped out at me, hopefully you can get some expert feedback from a native. keep up the good work!</p>"
