    html: <p>Dan, <br>I think you have to decide what kind of proportions you intend to settle on.  In your light weight, the proportions are more traditional.  In your bold weight, your f v w x y z look much too extended to match the light.  This is the typical dilemma we all face when adding weight to a font.  The angled glyphs get closed and plugged quickly when they get very bold.  The tough part is narrowing the angle yet avoiding filling.  Look at the pinch on your join of the b and d.  Notice how much thinner the horizontal is there than it is on the v and w?  You might want to think about pulling the apex of the angle join on the v and w down to what you did with the joiin of the b.  This way you can make the letters narrower and in keeping with your light version.  The bolder you go, the more you are working with the negative space.  The lighter you go in weight, the more you are working with line.  Your light weight is clearly monoline but your Black is a mixed bag.  Look at the black version of Gill.  He did a masterful job of resolving the conflict of stem weight and counter.  The opposite approach is Futura.  This too was done very well but here, the emphasis is on monoline while floating the proportions of rounds to straights more and causing more extremes in the counters.  Your s works in the Futura manner but your e is more Gill like.  The neat trick is to find the Dan Reynolds solution and apply it to all the letters (far easier said then done).  Keep battling with it Dan--the struggle will be worth it. <br> <br>ChrisL</p>
