    date: 2004-12-17T02:47:00
    date_raw: 17 Dec 2004 — 2:47am
    votes: null
    html: "<p>Well, I guess it depends on the designer himself. Unfortunately, many of the Bulgarian designers I know don't care whether the alphabet style is Russian or Bulgarian (which is sad, by the way). Many designers use fonts, that come with Adobe CS software, eg Minion &amp; Myriad, or even worse - Arial or Georgia, which are clearly Russian style. As for me personally - I preffer the style you saw in Helen Light example. HermesSOFT is the only Bulgarian company producing cyrillic typefaces, and they're popular among Bulgarian designers only.  <br> <br>As for Farewell, I suggest you to use latin \"n\" for cyrrilic \"p\" and for the others: <br> <br>m - for \"t\" <br>u - for \"i\" <br>something like double \"u\" - for \"sh\" and \"sht\" <br> <br>And you definitely have to rework your cyrlillic capital \"F\" and \"CH\" <br> <br>Unfortunately, I don't have much time to draw example of what I mean. It will be easier to show you what I think if I've had some vector outlines of Farewell, but I think this is impossible, because you haven't released the font yet. <br> <br>I'm not sure whether my English is good enough to be understood. Keep up the good work.</p>"
    html_clean: "<p>Well, I guess it depends on the designer himself. Unfortunately, many of the Bulgarian designers I know don't care whether the alphabet style is Russian or Bulgarian (which is sad, by the way). Many designers use fonts, that come with Adobe CS software, eg Minion &amp; Myriad, or even worse - Arial or Georgia, which are clearly Russian style. As for me personally - I preffer the style you saw in Helen Light example. HermesSOFT is the only Bulgarian company producing cyrillic typefaces, and they're popular among Bulgarian designers only.  <br> <br>As for Farewell, I suggest you to use latin \"n\" for cyrrilic \"p\" and for the others: <br> <br>m - for \"t\" <br>u - for \"i\" <br>something like double \"u\" - for \"sh\" and \"sht\" <br> <br>And you definitely have to rework your cyrlillic capital \"F\" and \"CH\" <br> <br>Unfortunately, I don't have much time to draw example of what I mean. It will be easier to show you what I think if I've had some vector outlines of Farewell, but I think this is impossible, because you haven't released the font yet. <br> <br>I'm not sure whether my English is good enough to be understood. Keep up the good work.</p>"
