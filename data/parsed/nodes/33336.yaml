      <p>There is a lot of inconsistency between the character widths and serifs. Without knowing if that is intentional or not it is hard to comment on.</p>
      <p>The spacing is inconsistant too, which I doubt is intentional.</p>
      <p>I think it's also difficult to give feedback on something with such a relatively limited number of options. Just keep pushing those pixels until you get something you're happy with.</p>
      <p>Here are a few quick suggestions...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DrammenTemp_6626.gif"></div><p></p>
      <p>I'm not sure if making pixel fonts is the best starting point for a typographic self-education :)</p>
