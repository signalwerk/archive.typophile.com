  html: |-
    <p>This is a logo I'm working on for a speaker / preacher. He tours quite a bit, speaking at different churches. The idea of the name 'Front &amp; Center' comes from the verse Colossians 1:18 where it speaks of giving Christ preeminence.</p>
    <p>Some verbs that the client came up with to characterize the ministry are: teaching; refreshing; liberating; gracious; clear; thought provoking; insightful; practical; reforming; inclusive</p>
    <p>I would appreciate crits.</p>
    <p>[Please note, this isn't 5 different options, they are 5 different applications of the same design. Please give feedback on the overall design, not which one you like best. Thanks ! ]</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FCM_LOGO_COMP_5803.jpg"></div><p></p>
