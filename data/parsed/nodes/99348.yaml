    <p>Hello guys<br>
    Very Happy New Year :) </p>
    <p>Tell me please, is there any special name for such typography style? Is there a typeface that looks like that, or all these are<br>
    hand made ? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/332cf582886d8d910c355e62c8e22a68_4067.jpg"></div><p></p>
    <p>Also, there is one more style i'm curious about. Often appear along the above style. Like an edge of the top typeface, slightly offset. I have seen it many times, but now that I want to find out more, can't seem to find sample.<br>
    Also, I'm sorry, my limited English vocabulary making it hard to express. That's best I could find for now.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_6167.jpg"></div><p></p>
    <p>Thank you for taking the time to read, and once again, you have a very good and happy new year :)</p>
    <p>regards<br>
    Seba</p>
