    <p>Hello everyone!</p>
    <p>I'm currently working on a university assignment which tasks us to design a series of crime fiction book covers (based on Ian Rankin's rebus series). The main objective is to be able to create a unified visual and/or theme which identifies the books as a series and as part of the genre.</p>
    <p>My concept is essentially taking photos as though from a first person perspective, reflecting Rebus' harsh, violent view of the world. This does not specifically mean Rebus himself, since the job of a police officer is to see through the eyes of criminals or victims.</p>
    <p>I want the type to reinforce this idea. I'm trying to figure out a way I can prevent the text from obscuring the image without drawing too much attention away from it or making it unreadable. These are the two best solutions I've come up with...</p>
    <p>This first option involves trying  to integrate the text in to the scenery (hopefully exectuted more effectively than this):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/First Person 1_3507.3 (S2).jpg"></div><p></p>
    <p>The second option is to overlay the text:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/First Person 5-1 (S3)_4160.jpg"></div><p></p>
    <p>The title for this second one will be laid out similarly to this:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Type Test 2_6549.jpg"></div><p></p>
    <p>Is there any advice anyone can offer? Are EITHER of these working well?</p>
