      <p>The way the rectangle intersects the type is a bit awkward to me. I would also move the titling over to the left and better center it ( if you want it to be off-center, it may be a good idea to scale it down some )</p>
      <p>I would also advise against using the newspaper shot - insofar as it makes me wonder whether I should read it as part of the titling – but it does give me an idea, especially since you mention integrating the type inside the image. Why not have your author and title be inside the newspaper? ( but you'd have to use another photo : ) You can extend this idea to include neon signs ( fairly easy to create in photoshop, and overlay onto a seedy-looking urban photo ) auto decals / license plates / graffiti / whatever. In any case, the best, most flat &amp; graphic, most genre-appropriate images are #2 and #4 above - good job.</p>
      <p>If you don't wish to take this route - or don't have time - perhaps you can at least supplant the newspaper with a nicer-looking, non-color newspaper, turned to a page with miniscule type. </p>
      <p>Good effort so far.</p>
