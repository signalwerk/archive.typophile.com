      <p>Here are some nearly final versions. I couldn't seem to get the type to integrate well consistently, and shooting the pictures from a more correct first person POV didn't look quite right either, so I ended up defaulting to the second layout.  The changes I made to the curves makes the pictures give off that sort of amateur vibe much more effectively than they were before, and gives them a sort of retro look (a good thing, since Rebus is always reminiscing to the past).</p>
      <p>I'm actually quite happy with these.</p>
