      <p>I like the idea of a pov photo as a unifying element.<br>
      The idea of an intergrated type could also be quite interesting; maybe actually have the cigarette on the pub photo.<br>
      The photos, however, don't quite fit with a pov; with the pub shot the angle is too low whilst the playground shot is too close to the paper - from personal experience the best way of getting a pov is to place the camera slightly behind where the head would be rather than actually in front of you.</p>
      <p>You may also like to look at the penquin books as an inspiration on creating a diverse yet unified aesthetic.<br>
      Try <a class="freelinking external" href="http://www.penguinsciencefiction.org/" rel="nofollow">http://www.penguinsciencefiction.org/</a></p>
      <p>Will</p>
