    html: |-
      <p>Cheers Ben!</p>
      <p>The thing reads: <em>Neuro-Aesthetics. Art, [the] brain, [and] science.</em> (Does that ever sound stupid in English; it works better in German.)<br>
      First I had it with a comma and an ampersand, but the client said they want hyphens. Then I had middots, and they did look nice – but, the client said they want hyphens. But of course hyphens are grammatically wrong, so now they get dashes. I'm hoping they can't tell the difference, so at least I won't have to get into that argument.</p>
      <p>"K": There's less optical correction in this cut, so the arm isn't as thin. I admit it looks a lot nicer up close; it's just that at text sizes, the correction seems necessary to my printer. Dunno…</p>
      <p><cite>"Perhaps it looks tighter at the start of the word."</cite><br>
      Dang, you're right. "NE" is a lot tighter than "IK".<br>
      Somehow I always get really hard headlines to space. But I guess spacing just *is* hard. Better get used to it :-)</p>
