    <p>Hey all,</p>
    <p>I'd love some micro/type-level feedback on this title/subtitle for a book cover. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/covertype-tp_3656.gif"></div><p></p>
    <p>The overall design (which has colors, and a photo, and stuff) has already been approved;* so this is just the type I'm now working on, which is all custom to varying degrees.</p>
    <p>* Actually, I'll have to submit a "prefinal" version of this tomorrow, for inclusion in the publisher's catalog. I'm expecting to be tweaking micro stuff between then and whenever I have to submit the final print files.</p>
    <p>The headline was customized from Miso (Miso on top, my headline below):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/miso-neuro-tp_4899.gif"></div><p></p>
    <p>Anything that strikes you as odd/wrong?<br>
    (I'm particularly wondering if the "S" is too wonky and/or wide, the "K" too wide, and the "N" too heavy?)</p>
    <p>The font in the subline and author's name is my own work-in-progress, <a href="http://typophile.com/node/53395" rel="nofollow">Ernestine</a>, in a special cut (slightly heavier, and more display-ish, than the base cut, and the "ft" lig is new).<br>
    This is going to be its first public appearance, so I'd be extra grateful for any opinions and comments!</p>
    <p>-Nina</p>
