    html: <p>I ONLY USE LINING FIGURES IF ALL THE TEXT IS CAPITALIZED. Otherwise, I go for old style figures.</p>
    html_clean: <p>I ONLY USE LINING FIGURES IF ALL THE TEXT IS CAPITALIZED. Otherwise, I go for old style figures.</p>
