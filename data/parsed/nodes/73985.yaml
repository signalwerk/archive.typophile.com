    html: <p>If it is a book, my choice would depend upon how important the numbers were. If the numbers were critical for navigation or referral, I might make them full height rather than oldstyle for numbers that were just incidental</p>
    html_clean: <p>If it is a book, my choice would depend upon how important the numbers were. If the numbers were critical for navigation or referral, I might make them full height rather than oldstyle for numbers that were just incidental</p>
  - id: 428916
    user: 108
    date: 2010-09-09T09:09:00
    date_raw: 9 Sep 2010 — 9:09am
    votes: null
    html: <p>I tend to prefer lining in large titles. The reason being that figures, IMHO, usually bounce too much when they are ranging. A group of figures at text sizes with a little up and down is less noticeable than at title sizes. Your average title won't have as many descenders in the words and I am usually trying for a strong baseline. But not all 100% of the time. Typography is not a set of hard &amp; fast rules. The typeface choice has as much to do with how it is set as the words written. Some designers undersize the lining figures just enough that they don't overpower the caps in lining, and others design the ranging figures with short descenders in the old style.</p>
