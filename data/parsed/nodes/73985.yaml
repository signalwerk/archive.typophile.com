  html: <p>Any thoughts on which type of figure is more appropriate to use in text set in title case (headings where the first letter of most words is capitalized)?</p>
  html_clean: <p>Any thoughts on which type of figure is more appropriate to use in text set in title case (headings where the first letter of most words is capitalized)?</p>
