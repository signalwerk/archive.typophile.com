    date_raw: 1 May 2002 — 10:52pm
    votes: null
    html: "<p> The font can be found in the Dover book titled: <br> <br>\"Old-Time Advertising Cuts And Typography: <br>184 Plates from the Boston Type and <br>Stereotype Foundry Catalog (1832)\" <br>(Edited by Stephen O. Saxe, Dover Publications, Inc., New York, 1989) <br> <br>The type is listed as \"Fat Face\" under various different weights (each named by the old system, \"English, No. 1\", \"English, No. 2\", \"Great Primer, No. 1\", \"Great Primer No. 2\", \"Double Pica\", \"Real Double Pica\", \"Double English, No. 1\", \"Double English, No. 2\", \"\"Double Great Primer\", \"Double Paragon\", \"Canon, No. 1\", \"Canon, No. 2\", \"Five Lines Pica\", \"Fourteen Lines Pica\", \"Twenty Lines Pica\" etc. <br> <br>The specimens are printed on pages 8 through 33. <br> <br>I don't know of any digital version of this face, but I'd love to see it (and several others in the book) made into digital form. <br> <br>I hope this helps. <br>David </p>"
    html_clean: "<p> The font can be found in the Dover book titled: <br> <br>\"Old-Time Advertising Cuts And Typography: <br>184 Plates from the Boston Type and <br>Stereotype Foundry Catalog (1832)\" <br>(Edited by Stephen O. Saxe, Dover Publications, Inc., New York, 1989) <br> <br>The type is listed as \"Fat Face\" under various different weights (each named by the old system, \"English, No. 1\", \"English, No. 2\", \"Great Primer, No. 1\", \"Great Primer No. 2\", \"Double Pica\", \"Real Double Pica\", \"Double English, No. 1\", \"Double English, No. 2\", \"\"Double Great Primer\", \"Double Paragon\", \"Canon, No. 1\", \"Canon, No. 2\", \"Five Lines Pica\", \"Fourteen Lines Pica\", \"Twenty Lines Pica\" etc. <br> <br>The specimens are printed on pages 8 through 33. <br> <br>I don't know of any digital version of this face, but I'd love to see it (and several others in the book) made into digital form. <br> <br>I hope this helps. <br>David </p>"
