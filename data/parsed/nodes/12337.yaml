    <p>I'm going to <a href="/wiki/Typo-Berlin" class="freelinking" rel="nofollow">Typo-Berlin</a> next week, the large <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> typography conference.</p>
    <p>I have been planning to stay at Hotel Unter den Linden, quite nearby the conference location (and cheap), where I had a single room reserved.</p>
    <p>The German design magazine <a href="/wiki/form" class="freelinking" rel="nofollow">form</a> gives away free admission tickets to people who can answer specific trivia questions every year. This year, my girlfriend knew that that the logo of the <a href="/wiki/Haus%20der%20Kulturen%20der%20Welt" class="freelinking" rel="nofollow">Haus der Kulturen der Welt</a>, where the conference is held, was designed by <a href="/wiki/Cornell%20Windlin" class="freelinking" rel="nofollow">Cornell Windlin</a>. A few days ago, she won one of the free tickets!</p>
    <p>The Hotel Unter den Linden though is booked-out: no double rooms available. Paying a fee for her to stay in my single room is not permitted. &nbsp; <em>Schade…</em> So, a week before the conference. I'm not sure where I'll stay. Anyone know a good hotel with a vacancy?</p>
