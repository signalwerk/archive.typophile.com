    html: |-
      <p>There is something still a bit frankenstein-like about the serif treatment. It seems arbitrary &amp; theory-based rather than optical and observed. It does make me wonder about what I think though; which is a pleasant challenge. So far I am not sure. </p>
      <p>The main thing I would encourage you to do is to think in terms of what the space between letters needs. The serif treatments need not be literally consistent to work. There are old &amp; new fonts where this is so. Look at the a s and l (el) in<br>
      <a href="http://www.ourtype.be" rel="nofollow">Amalia </a>. There are 5 different approaches to the serifs. And yet to my eye each is working optically. You can tell this is true better from a print out than in the flash preview. </p>
      <p>I would also watch out for details that may sparkle and catch the eye a bit too much. It might be that the bases of those serifs do that. Or not. But I wonder.</p>
      <p>In any event I will have a proper look soon.</p>
