    html: |-
      <p>Hm, that smaller-size image actually gives a lot of insights. E.g. that the serifs on the minuscles are not as distracting as I thought they would be (they definitely were on the "display" sizes to me; on display sizes on the other hand such decoration, standing-out is desirable). They work really well!<br>
      As I said, it's the serifs I like about the font very much, and I see how they are the core of your experiment/development. On the other hand, while one could notice the discrepancy of the V,W,Us compared to the other capitals in the first version published, I'd give it a try the other way round: Would it be bold to suggest a trial of having the top serifs of the first vertical stem (or the only one) of any capital to be more symmetric (i.e. slightly more protruding to the right), transferring the minuscle-like characteristics only to the second vertical stem? (This came to my mind as two letters felt "wrong" to me: I and H; interestingly not so much L).</p>
      <p>I've got two-three more observations, but they are in the detail, and so I will shut up: it's a "first peek not ready for crit yet" after all :-)</p>
