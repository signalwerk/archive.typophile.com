  html: |-
    <p>Making a logo around the word "good"<br>
    Client has specified an all-caps San serif, pointing to an example using Gotham as something she likes. Problem is, the letters in "GOOD"  are all very similar looking.<br>
    So any suggestions from the typophiles? Your advice is usually bang on :)<br>
    I think if I could find a nice "G" I'm most of the way there.</p>
    <p>Cheers</p>
