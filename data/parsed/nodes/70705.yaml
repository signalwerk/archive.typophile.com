      <p>Fontgrube, you're right! It looks like I vertically squished the "o" and the "r" so that the M R S would top align with the P and K. Don't judge, this was long ago :) literally the second logo I ever did.</p>
      <p>The "M R S" is Baskerville bold. </p>
      <p>Oh, to revisit old student logos. It could have been worse. This is still in use, which I can't say for many others I've done.</p>
