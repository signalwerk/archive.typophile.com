      <p>Your original link was to DaFont, and it was broken, and it looked like it used to work. Do you think DaFont removed Blippo because it was an illegal offering? That would be nice of them. If so, do you think it's a good idea to follow suit?</p>
      <p>What's interesting is, where did you get that broken DaFont link? The only way I can think of is if you have a database of all your fonts that shows where to get each one, and you passed along the source that's currently acceptable to Typophile moderators, except you didn't realize that it no longer worked. Once you realized, you edited your post to point to MyFonts (which you could have actually done from the beginning).</p>
      <p>BTW I would certainly believe that you get many of your fonts from places other than DaFont.</p>
      <blockquote><p>Wonder who gets the money $25 on this 1970 font ...</p></blockquote>
      <p>Are you saying that fonts older than 40 years should be free?</p>
      <p>Could you point to a font that you feel is worth purchasing?</p>
      <p>hhp</p>
