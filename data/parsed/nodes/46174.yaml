  html: |-
    <p>hi!<br>
    The use of hand-rendered type has risen dramatically over the past few years.<br>
    Although many dismiss it as trendy and unprofessional, the hand lettering does have its own unique character.<br>
    Be it the rough edges, uneven width of the strokes or even a slight variety of x-height between characters, but there is something about it that I personally find very appealing. </p>
    <p>I am looking to examine some fonts that have been inspired by the hand lettering and was hoping you could provide me with some links and also express your views on the subject. I am not looking for script fonts, or fonts inspired by peoples hand-writing, but rather fonts inspired by signage etc.</p>
    <p>your input is appreciated as always!</p>
