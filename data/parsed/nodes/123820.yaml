    html: |-
      <p>Well I definitely prefer the condensed titling face. Maybe close up the ES, NT &amp; ET slightly? Regarding some other typographic observations (and please take these with a grain of salt as I'm not familiar with Spanish typographic rules).</p>
      <p>I would raise the En dashes so the're closer to the midline of capitals.</p>
      <p>I would personally replace full spaces with thin spaces in Tel. No's.</p>
      <p>Not sure about the period after E-Mail ? (I understand it's a contraction but it's so endemic as too almost be a new &amp; complete word in it's own right).</p>
      <p>My 2 cents   :)</p>
