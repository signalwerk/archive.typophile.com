    html: |-
      <p>I have to agree with Thylacine here, the kerning is still uneven. It's a difficult thing to advise on because doing one thing has a flow on affect for the rest of the 'word picture'. What you're trying to achieve is optically balanced white space around each letter whilst maintaining whole word cohesion (if that makes sense! I think it's more difficult to describe. than do)   :)</p>
      <p>Take D E S E O, I see it more as D ESE O. Kerning is not a science but IS all about the EYE (of which you appear to have a very good one, as this design as a whole attests)</p>
      <p>Regarding the skull's shadow, I'm not sure what program you're using so again it's difficult to advise, but I'm pretty sure you need to split the skull from it's shadow somehow, so you have 2 separate objects.</p>
      <p>Hope this helps</p>
