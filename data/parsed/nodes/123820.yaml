    html: |-
      <p>Just regarding the kerning, it's a bit uneven. For example, look at the tightness of ESE in the first line, as opposed to the looseness of PRET in the second line.</p>
      <p>As for a book on kerning, I'm not so sure a book would help. Good kerning is mostly a matter of seeing, then making those adjustments and compromises necessary to achieve the best possible distribution and balance of positive and negative spaces.</p>
      <p>Have you seen the following online kerning game: <a href="http://type.method.ac" title="http://type.method.ac">http://type.method.ac</a>. I don't always agree with some of the designer's solutions, but it's good practice.</p>
      <p>For what it's worth, I like the poster.</p>
