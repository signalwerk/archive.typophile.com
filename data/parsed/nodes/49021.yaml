  html: |-
    <p>Dear typophiles, maybe someone knows which ones these are below? And can tell me their names or availability? I don't even know which script got used in the middle... or which modified sans serif is going over the top, or even the decorative antique serif at the bottom in brackets, let alone the highlighted wedge serif in the middle...</p>
    <p>Any ideas would be helpful.</p>
    <p>Thanks in advance, B</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bottle-ref_5177.jpg"></div><p></p>
