    html: |-
      <p>I guess masthead is a custom work. May be you could start with a condensed sans which shares a similar global design, like <a class="freelinking external" href="http://new.myfonts.com/search/DIN/fonts/" rel="nofollow">DIN</a> (condensed) or <a class="freelinking external" href="http://www.dafont.com/bebas.font" rel="nofollow">Bebas</a> and tweak it. "Only" need to move up or down some crossbars and redraw /R bottom left part (extra work on /M for Bebas and probably longer work on /R for DIN Condensed).</p>
      <p>Edit: having a look to your new sample, the slightly tweaked /S (middle transition moved up) could confirm they've started with <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/engschrift/" rel="nofollow">DIN Engschrift</a> (<a class="freelinking external" href="http://new.myfonts.com/fonts/ef/din-1451/" rel="nofollow">1451</a>).</p>
