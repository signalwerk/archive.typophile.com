  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Fiona&nbsp;Ross</strong> </p>
    <p>Fiona Ross specializes in non-Latin <a href="/node/12387" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type Design</a> and <a href="/node/12026" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typography</a>. From 1978 to 1989 she worked for <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a> Limited (<span class="caps">UK</span>) and was responsible for the design of Linotype’s non-Latin fonts and typesetting schemes. Since 1989 she has worked as a consultant, type designer and visiting lecturer, and in 2003 joined the <a href="http://www.rdg.ac.uk/Typography/home.html">Department of Typography <span class="amp">&amp;</span> Graphic Communication</a> at the <a href="/node/12257" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">University of Reading</a>, teaching non-Latin typeface design on the <a href="/node/add/wiki?edit%5Btitle%5D=MA%20in%20Typeface%20Design" title="Create node &quot;MA in Typeface Design&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">MA</span> in Typeface Design</a> programme, and academic writing skills for all postgraduates in the Department.<br>
    Fiona Ross holds a <span class="caps">BA</span> in German, a PgDip in Sanskrit and Pali, and a PhD in Indian Palaeography from <a href="http://www.soas.ac.uk/"><span class="caps">SOAS</span></a> (School of Oriental and African Studies: University of London). She is a member of the <a href="/node/13403" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">AT</span>ypI</a> (Association Typographique International) and a Fellow of the Royal Society of&nbsp;Arts.</p>
    <p><strong>Additional Articles:</strong><br><a href="http://www.itcfonts.com/Ulc/2611/BookRevBengaliChar.htm">U&amp;lc: The Printed Bengali Character and its Evolution, by John Hudson</a><br><a href="http://store1.adobe.com/cfusion/store/html/index.cfm?event=displayDesignerInfo&amp;code=FROS&amp;store=OLS-US">Adobe: Fiona Ross (dossier)</a><br><a href="http://www.tiro.com/contact.html">Tiro Typeworks: Associates: Fiona Ross&nbsp;(dossier)</a></p>
