    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Fiona Ross</strong> </p>
    <p>Fiona Ross specializes in non-Latin <a href="/wiki/type%20design" class="freelinking" rel="nofollow">type design</a> and <a href="/wiki/typography" class="freelinking" rel="nofollow">typography</a>. From 1978 to 1989 she worked for <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> Limited (UK) and was responsible for the design of Linotype’s non-Latin fonts and typesetting schemes. Since 1989 she has worked as a consultant, type designer and visiting lecturer, and in 2003 joined the <a href="http://www.rdg.ac.uk/Typography/home.html" rel="nofollow">Department of Typography &amp; Graphic Communication</a> at the <a href="/wiki/University%20of%20Reading" class="freelinking" rel="nofollow">University of Reading</a>, teaching non-Latin typeface design on the <a href="/wiki/MA%20in%20Typeface%20Design" class="freelinking" rel="nofollow">MA in Typeface Design</a> programme, and academic writing skills for all postgraduates in the Department.<br>
    Fiona Ross holds a BA in German, a PgDip in Sanskrit and Pali, and a PhD in Indian Palaeography from <a href="http://www.soas.ac.uk/" rel="nofollow">SOAS</a> (School of Oriental and African Studies: University of London). She is a member of the <a href="/wiki/ATypI" class="freelinking" rel="nofollow">ATypI</a> (Association Typographique International) and a Fellow of the Royal Society of Arts.</p>
