    <p>Hi,</p>
    <p>This is my first post as I just found this website.  :-)</p>
    <p>I'm working on redesigning a magazine that's about helicopters.  I think the current set of fonts looks a bit dated (most body text in Dutch 801, headlines in Futura).  I'm looking at a lot of helicopter trade magazines and noticing most of them use sans-serif for the body text.</p>
    <p>Could anyone make any font suggestions?  I'm looking at Gotham Narrow (don't own that one but might invest).  I like News Gothic, but there aren't enough variations in the family.  I probably use Helvetica a little too often.  I'm looking for something that's easy to read but with a little bit of style to it.  Does the helicopter subject suggest anything to anyone?</p>
    <p>I could also just change to a different serif for the body text but just noticed most of the trade mags are in a sans.</p>
    <p>I'll be the first to admit I'm not great at picking out fonts.  That's why I'm posting.  :-)  I have the Adobe folio (so could use any of those) though I'd also consider investing in something new.</p>
    <p>Any thoughts?</p>
    <p>Thanks, phyllis</p>
