      <p>I personally suggest my own fonts only when the match is exceptionally good; anything beyond that I find too opportunistic and ungracious.</p>
      <p>But guess what - this is such a case!  :-&gt;<br>
      Phyllis, I think you want something serious, sharp, rigid but dynamic. These are things Nina Stössinger was looking for when choosing fonts for two recent projects - a novel, and INFOsperber:</p>
      <p><a href="http://www.flickr.com/photos/ninastoessinger/5558904732/" title="http://www.flickr.com/photos/ninastoessinger/5558904732/">http://www.flickr.com/photos/ninastoessinger/5558904732/</a><br>
      The body text is set in the Roman component of the family (see below).<br>
      Sample from another book: <a href="http://www.flickr.com/photos/48413419@N00/4177918056" title="http://www.flickr.com/photos/48413419@N00/4177918056">http://www.flickr.com/photos/48413419@N00/4177918056</a></p>
      <p><a href="http://www.flickr.com/photos/ninastoessinger/5571195204/" title="http://www.flickr.com/photos/ninastoessinger/5571195204/">http://www.flickr.com/photos/ninastoessinger/5571195204/</a><br>
      <a href="http://infosperber.ch/" title="http://infosperber.ch/">http://infosperber.ch/</a></p>
      <p>The font is called (actually, code-named) Harrier, and it's part of a system that includes a Roman and an Italic (Harrier is better termed a slanted-Roman.) However there's no sans in the family yet, so it might have limited versatility for your project. Anyway, let me know if your curiosity is piqued: hpapazian at gmail dotcom.</p>
      <p>hhp</p>
