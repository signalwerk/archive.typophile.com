    html: |-
      <p>In the absence of a visible decimal point, align the ones place. In most situations this will allow you to align the solidus as well, but you can't count on that if you get a big numerator like 15/16.</p>
      <p>It is all about organizing information so that it can be quickly understood. If someone is looking through a big list for parts that are 10" long or longer, numbers that have been pushed a whole figure width to the left will be unwelcome distractions.</p>
