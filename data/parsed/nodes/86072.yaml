  html: <p>I'm currently designing a product catalog that contains a lot of tables. I'm curious if anyone has any thoughts on how fractions should be vertically aligned within a table. I've always tended to gravitate towards right-justification for numerals, but I'm wondering if it might be more effective/look better to align fractions to the slash.</p>
