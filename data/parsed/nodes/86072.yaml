    html: |-
      <p>Depending on the typeface you're using, there may be specifically-designed fractions, which may solve the alignment issue - if you're using an OpenType, it may be worth a hunt through the glyphs.</p>
      <p>As far as I know, there's nothing in Bringhurst or Hart's about aligning fractions against the solidus, however Hart's does have a useful section on tables that discusses when to align numerals against the column heading or also with the final digit or decimal point (when the data is related or not). Using that rule of aligning decimal points, it could be reasoned that the same would apply with aligning against the solidus in large numbers (no pun intended) of fractions, preserving the vertical flow.</p>
      <p>Hope that helps.</p>
