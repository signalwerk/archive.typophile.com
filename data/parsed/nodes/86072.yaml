    html: |-
      <p>I worked in a small agency in the 1980s and designed a few product catalogs for tools companies, which contained tables like this with fractions and inch marks. That gave me an appreciation for this kind of "technical" typography.</p>
      <p>It's not the sort of thing that gets much respect in the design community, but it's the real deal.</p>
      <p>Based on that experience as a typographer, I've been putting a Fractions feature in all my fonts since OpenType, but have only put proper inch marks in the Modern Suite fonts. Frankly, it doesn't seem worth the effort—primarily because they're so hard to locate in the glyph palette that I doubt people would use them. For serifed fonts, it's easier to get them from the Symbol font. </p>
      <p>I did briefly entertain the idea of rendering all my dumb quotes (quotedbl) angled, so they would perform both as inch marks, and as an admonition to typographers to set proper curly quotes—but realized that wouldn't be very user-friendly.</p>
