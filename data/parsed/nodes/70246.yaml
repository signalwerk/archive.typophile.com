    html: |-
      <p>This probably belongs in the "Design" forum, but to respond to this, count your blessings; Calibri is a nice design. It's not like they're asking for Comic Sans. Calibri has exceptional glyph coverage including many ligatures, alternates and true small caps. If you utilize these features you might end up with something less awful than you're imagining.</p>
      <p>If there is heavier reading in the book I would opt for a serifed book typeface and pair it with Calibri as the display and/or caption typeface.</p>
