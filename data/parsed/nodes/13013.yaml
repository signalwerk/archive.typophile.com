    <p><strong> <a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Museums" class="freelinking" rel="nofollow">Museums</a> : Gutenberg Museum</strong></p>
    <p>The Gutenberg Museum is located in Mainz (near Frankfurt), Germany. The museum featuers a working replica of a Gutenberg press with demonstrations made regularly. I also houses a two-volume 42 line Gutenberg Bible and has a collection of historical handwritings, prints, presses and typesetting equipment.</p>
    <p>The museum also is home to the "Druckladen", a letterpress workshop open to everyone interested. The muesum closely cooperates with the "Mainzer Minnipressen Archiv (MMPA), a collection of books from micro-publishers and -presses. The MMPA is organiser of the bi-annual "Minnipressen-Messe", a trade fair for micro-publishers and -presses.</p>
    <p>Contact:<br>
    Gutenberg-Museum<br>
    Liebfrauenplatz 5<br>
    55116 Mainz<br>
    Germany</p>
    <p>Phone: +49 (0) 6131 - 122640 - 42<br>
    <a href="http://www.gutenberg.de/museum.htm" title="http://www.gutenberg.de/museum.htm">http://www.gutenberg.de/museum.htm</a></p>
