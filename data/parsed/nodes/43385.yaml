    html: |-
      <p>Hi there:</p>
      <p>This is a new one from SIL- to me anyways.</p>
      <p>I would pass on that one. Andika, tho well intentioned, is not ready for the production environment. </p>
      <p>And besides its a sans which might not be the best choice for a book. Century School is my all time favorite for this... it’s old, I know.</p>
      <p>There are fonts just for younger readers... I don’t very much about this genre tho. Hopefully someone else will chime in.</p>
      <p>If you like the mood of Andika, Miramonte from Ascender has a similar feel but it does not have Andika’s special features. Miramonte does have a two-story a which increases cognition.</p>
      <p>You can get it here:</p>
      <p><a href="http://www.fontmarketplace.com/font/miramonte-pro-family.aspx/292" title="http://www.fontmarketplace.com/font/miramonte-pro-family.aspx/292">http://www.fontmarketplace.com/font/miramonte-pro-family.aspx/292</a></p>
      <p>Mikey :-)</p>
