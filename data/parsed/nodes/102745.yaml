    html: <p>Everything works perfect in Fontlab, and in TextEdit it looks as if it also works fine at smaller sizes, though that's hard to judge. The problem is not only in smallcaps, but also in T in combination with lowercase, or V in combination with lowercase. Sadly, I can't edit the original post, and I can't upload any picts here. Damn you typophile.</p>
