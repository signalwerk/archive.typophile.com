    html: <p>In combination with lowercase (TaTbTcTd...), TextEdit simply ignores all 'grey' kerning values (the ones I didn't actually type in but are present because they are in a kerningclass). That still doesn't explain why it goes all crazy with smallcaps, though... This is serious headache stuff.</p>
