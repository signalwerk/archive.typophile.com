  html: |-
    <p>Hi,</p>
    <p>I made a fontfamily, and I finished kerning, so I started making a font specimen. I noticed that indesign didn't kern T/h.smcp, and all other glyphs in the kerning class of h.smcp (b.smcp, d.smcp, e.smcp, etc) when placed after T. The problem was only in the light, and after some checks, seemed to be only in this specific part of the font. Then inDesign crashed. I opened it again, and now the problem had spread to LightItalic as well. And it crashed. I let inDesign be since it crashed again, and started doing checks in Textedit. By then, the problem had spread to all styles, and many different glyphs. Not sure how many. I attached some pics, of what it looks like in TextEdit.</p>
    <p>I used FontFinagler to clean my cache, rebooted multiple times, and reinstalled the fonts multiple times. Does anyone know what the problem might be? Many thanks in advance.</p>
    <p>Cheers,<br>
    Jasper de Waard</p>
