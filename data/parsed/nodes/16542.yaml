  html: |-
    <p>Inspired by Alan Fletcher’s <em>The Art of Looking Sideways</em>,<br>
    I decided to put up my random little typographic thoughts<br>
    into a visual journal. Please let me know what you think.<br>
    <a href="https://web.archive.org/web/20080906163323/http://www.salsen.com/">http://www.salsen.com</a><br>
    Also, I recently decided to combine my love of type with<br>
    optical illusions to create some interesting effects, so<br>
    expect more of that in the future!</p>
