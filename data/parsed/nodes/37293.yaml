      <p>I’m currently into my eighteenth week in placement, so I’ve had some experience in obtaining the position.</p>
      <p>My advice is to include everything you’ve ever done to show advancement, and having your own URL (not university-provided space) is good to have onsite.</p>
      <p>I have a blog of my time so far <a href="http://www.paulwilsdon.com">here</a> if you want a heads up of what to expect(ish).</p>
      <p>Every piece of freelance is good stock, but University work is also good to have (especially if your personal work is lacking in amount).</p>
      <p>Above all, wear a suit to every interview - it’ll help make that essential first impression, and show how serious &amp; dedicated you are to your craft.</p>
      <p>Best of luck!</p>
      <p>Paul</p>
