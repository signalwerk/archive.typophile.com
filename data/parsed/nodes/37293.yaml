      <p>&gt; Above all, wear a suit to every interview </p>
      <p>My rule is to always go a step above what the office is. If it is t-s and torn jeans, then a tie is overkill. But if it is dress shirts and slacks, then throw on a tie. And if they have on a tie, go up to a full suit. (The rule breaks down here ... if they are in suits, a tux is a bit too much).</p>
      <p>Just don’t scope out the place on a Friday to see what the normal dress is ... many places dress down that day.</p>
