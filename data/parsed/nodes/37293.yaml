      <p>If you have just finished your university degree, most employers are not going to be expecting a long list of fabulous jobs. I’d advise summarizing your work experience briefly, as it’s not design-related. You do want to show you’ve had some work experience but you don’t need to go into overkill explaining how skillfully you stocked those grocery shelves. In general I think descriptions of your jobs should be brief and to the point.</p>
      <p>Yes, show both your school work and your completed jobs. Again, nobody is expecting you to have designed the iPhone interface.</p>
      <p>But please please avoid the common student mistake of too many words on the CV. I can’t stand lengthy “objectives” (your objective is to get a f**king job, innit?). Someone on this site posted a 6 page CV for critique where we had to page thru 5 pages of words words words before we even got to the actual resume. Something elegant and concise is vastly preferable. It should fit on a page. I have 20+ years work experience and my resume fits on a page.</p>
      <p>As to wearing a suit? Seems a little much to me, but don’t show up in jeans either. Black or grey pants, a simple button down (no tie) and a jacket should do the trick.</p>
