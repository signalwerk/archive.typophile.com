      <p>“Should I display my past employment if its not design relevant?”</p>
      <p>I wouldn’t list “flipped burgers for a semester at BK” but if the job is interesting, absolutely. Work experience is work experience. And definitely list your freelance works/talents.</p>
      <p>“Above all, wear a suit to every interview”</p>
      <p>I don’t know if I’d agree with that. Scout out the firm first. If the principals are wearing t-shirts and flip-flops, a suit might be a bit overkill. Design firm dress code can run the gamut.</p>
