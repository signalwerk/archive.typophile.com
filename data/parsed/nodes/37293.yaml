      <p>If you have past employment that is not directly design-related, but you learned or demonstrated transferable skills, I would include it: No need to detail your job duties, but do talk about the skills you used to perform the duties. </p>
      <p>So, for example, I worked for a few years as a sales person in a dressmaking supply shop. It was far from the work I do producing publications, but I was using and developing problem solving skills in a way which does relate to design — finding a solution within the customer’s budget and which would complement the look of whatever they were making/repairing/sewing. </p>
      <p>Skills are transferable. For example, timeliness, attention to detail, accuracy... You can list the skills a particular position required of you. </p>
      <p>Also, any accomplishments — like improving a work process or signage or reorganizing something, increasing sales, developing a loyal clientele ... in other words, a contribution other than your basic duties.</p>
      <p>Good luck!</p>
