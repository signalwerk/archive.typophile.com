      <p>Miguel, I second what Kristina has said.</p>
      <p>As for the portfolio, show only your best work — do not put anything in there that you will be apologizing for. It’s better to have 3 or 4 very good samples than 8 or 10 that vary in quality or execution.</p>
      <p>Also, do your homework about the firms you will be applying to, and if possible, tailor the contents of your portfolio to a particular studio’s work.</p>
      <p>(And if you can get it, I recommend the book <a href="http://www.amazon.com/Graphic-Designer-Without-Losing-Your/dp/1568985592/ref=pd_lpo_k2_dp_k2a_2_txt/102-9738191-2107322?pf_rd_m=ATVPDKIKX0DER&amp;pf_rd_s=lpo-top-stripe-2&amp;pf_rd_r=1RR799MZJ7X2QNPPYXVZ&amp;pf_rd_t=201&amp;pf_rd_p=304485601&amp;pf_rd_i=B000SKUI6S"><em>How to be a graphic designer without losing your soul</em></a> — it has plenty of good pointers for job hunters.</p>
      <p>Good luck!</p>
