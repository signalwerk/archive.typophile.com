    <p>Hey Guys &amp; Girls, at the end of this year I will have finished my Bachelor of Design and will be looking for placement within an agency as an entry level designer.</p>
    <p>CV questions</p>
    <p>I have no previous full-time/part-time employment in the design industry should I put down freelance works I have done?</p>
    <p>Should I display my past employment if its not design relevant? </p>
    <p>Portfolio questions</p>
    <p>My best work has always been done at university, so should I only use my university work or is it best to show some freelance work I’ve done so that they can see what I do for actual clients? </p>
    <p>Should I display a variety of work, or try and limit it to the scope of the agency I am applying for?</p>
    <p>Any advice would be really appreciated</p>
    <p>Cheers</p>
