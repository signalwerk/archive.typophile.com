      <p>In Germany we speak about the Black and the White Art:<br>
      “Von der Schwarzen und der Weißen Kunst”.<br>
      The Black Art is printing, the White Art is paper production.</p>
      <p><a href="https://web.archive.org/web/20080709010645/http://cgi.zvab.com/SESSz133977815711177842305/cgi-bin/n_xsearch.cgi?uc=de&amp;shp=0&amp;dcurr=EUR&amp;noimg=0&amp;lang=de&amp;term=von+der+schwarzen+und+der+wei%DFen+kunst&amp;days=--" title="http://cgi.zvab.com/SESSz133977815711177842305/cgi-bin/n_xsearch.cgi?uc=de&amp;shp=0&amp;dcurr=EUR&amp;noimg=0&amp;lang=de&amp;term=von+der+schwarzen+und+der+wei%DFen+kunst&amp;days=--">http://cgi.zvab.com/SESSz133977815711177842305/cgi-bin/n_xsearch.cgi?uc=...</a></p>
      <p>Georg</p>
