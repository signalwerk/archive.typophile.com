      <p>My Prof pal says:</p>
      <p>“The OED’s first example is from Christopher Marlowe’s Faust in 1591: “I have heard strange report of thy knowledge in the black art”.  Obsolete usage from the same time period:  lock-picking.  “I can set downe the subtiltie of the blacke Art, which is picking of lockes”.”</p>
