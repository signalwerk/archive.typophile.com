    <p>About <strong><a href="http://www.myfonts.com/fonts/sudtipos/heráldica-script/" rel="nofollow">Heráldica Script</a></strong></p>
    <p>We are proud to add a very complex and new font to our collection.</p>
    <p><img src="/sites/default/files/old-images/typophileheraldica_4167.png"></p>
    <p>Ornamented scripts are a Koziupa/Paul specialty, and Heraldica is one of their most expressive. It attains the very definition of deluxe by conjoining the classic thin-and-thick script treatment with thin-only counterpart strokes, then it goes the extra mile with a varied complement of overlaid flourishes. The usual assortment of multiple alternates and ending forms pushes it even further in class and versatility.</p>
    <p>Monograms, logos, jewelry packaging and book covers are only a few of the possibilities with such a high-end script.</p>
    <p>Visit our gallery called "The Art Room"  at <a href="http://bit.ly/11hRyvx">http://bit.ly/11hRyvx</a></p>
    <p><img src="/sites/default/files/old-images/400_4253.png"></p>
    <p>Typeface design: Angel Koziupa &amp; Ale Paul for <strong><a href="http://www.sudtipos.com" rel="nofollow">Sudtipos</a></strong>.<br>
    License the typeface with a Lted. Time 30% exclusive discount <strong><a href="http://www.myfonts.com/fonts/sudtipos/heráldica-script/" rel="nofollow">here</a></strong>.</p>
