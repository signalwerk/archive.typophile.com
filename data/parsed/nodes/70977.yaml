    html: |-
      <p>Ugh, it looks like they tried to imitate the NYT with the masthead, but they gave up with the rest of the layout and wound up with That Thing. Why is it that filmmakers who otherwise have such attention to detail think it's okay to just throw together a newspaper like that, especially if the newspaper plays some sort of role in advancing the plot (which it usually does if they bother to make their own newspaper)? It always takes me out of the film when there's a poorly designed newspaper with an important plot-point headline.</p>
      <p>Edit: It's <a class="freelinking external" href="http://www.dafont.com/germanica-family.font?text=The+Gotham+Times" rel="nofollow">Germanica</a>.</p>
