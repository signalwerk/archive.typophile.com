  html: |-
    <p>Couldn’t find what I was looking for, my question is about uploading images…</p>
    <p>When exporting a png file from Adobe Illustrator (CS5), you got the option »Type Optimized (Hinting)«. To me type in these pngs looks as crisp as in a pdf file with the font embedded. I’m not sure if this was possible in older versions. The only difference I see is that in a pdf, you can zoom in. Is there another advantage of pdfs? (For posting on typophile)</p>
    <p>Although I read the threads about pdfs and font piracy, and I think that the people who steal fonts from pdfs would simply take it from somewhere else, I would feel better anyway if I don’t have to upload a pdf with the (unfinished) font, just to minimize the possibilitys for pirates.</p>
    <p>Instead of a pdf, one could upload the same picture as »type optimized« pngs in different sizes. What do you think about that?</p>
  html_clean: |-
