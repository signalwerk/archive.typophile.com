    html: |-
      <p>PDFs are better since you can zoom pretty much infinitely, and print at a high quality. If you're making the font in Illustrator, and it's just outlines, anyone who wants to steal it will have to go through a lot of work to actually steal it—like copy the glyphs into a font editor, space it properly, fill in any needed (but missing from specimen) glyphs. Basically, the only people who not only want the font, but have the know-how to actually turn it into a font, will be the ones who wont just steal it, I think.</p>
      <p>Anyway, a PDF probably isn't a big deal. If they reaally want the font, they'll probably ask you about it.</p>
