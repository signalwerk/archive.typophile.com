    <p><strong>ABOUT THE COLLECTION.</strong></p>
    <p><em>illume</em> is an elegant, modern collection of typography table lamps for anyone who enjoys lighting with class and personality. Each sleek, frosted white acrylic lamp celebrates a classic typeface while gracing a room with soft light and sophistication. Brighten your room with illume.</p>
    <p><strong>CURRENT EDITION 1 COLLECTION FOR PURCHASE:</strong></p>
    <p>Didot<br>
    Bodoni <strong><em>sold</em></strong><br>
    Baskerville<br>
    Clarendon<br>
    Caslon <strong><em>sold</em></strong><br>
    Garamond</p>
    <p><em>*lamps are each $158 US dollars</em></p>
    <p><strong>WANT AN ILLUME LAMP?</strong><br>
    Purchase one of the current collection or put in a request for a specific classic typeface and/or letterform by contacting Whitney Wright. For more images, please visit  <a class="freelinking external" href="http://fashiongraphics.net/works/wrightw/img509/" rel="nofollow">illume</a>.</p>
    <p><strong>ABOUT THE DESIGNER.</strong></p>
    <p>Growing up, while others drew pet portraits, Whitney designed letters. This childhood love of letters transformed into her burgeoning career as a graphic designer and status of typography nerd. Her favorite typeface is currently Univers. She is a Junior design major at MICA (Maryland Institute College of Art). </p>
    <p>contact info:<br>
    <a href="mailto:wright.whit@gmail.com">wright.whit@gmail.com</a><br>
    twitter: @_whitneywright</p>
