      <p>Dear Amado, have you considered Times’s own size-optimised varieties designed for body text composition? They are a few, e.g.,
      </p><ul>
      <li>Times Ten LT</li>
      <li>Times Seven MT</li>
      <li>Times New Roman MT Medium</li>
      <li>Times LT Std Semibold</li>
      <li>Times Small Text MT</li>
      </ul>
      <p></p><p>Their stroke width contrast and their stroke weights vary considerably…</p>
      <p>What about Monotype Plantin whose kinship to TNR was so strikingly evinced by Walter Tracy in his <em><a href="http://books.google.com/books?id=y8NssjbqNcsC&amp;pg=PA198&amp;img=1&amp;zoom=3&amp;hl=en&amp;sig=ACfU3U3rjfkLOg835QEiLrJSA_O3jjCyRg&amp;w=1349" rel="nofollow">Letters of Credit: A View of Type Design</a></em> (London and Bedford: Gordon Fraser Gallery Ltd., 1986)?</p>
      <p><img src="http://ic.pics.livejournal.com/m_zhukov/967599/45204/45204_600.gif"></p>
