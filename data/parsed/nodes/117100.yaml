    <p>Dunno if this is a General Discussion question or more Design, but here goes. I'd love to lay my eyes on a typeface that's quite close to Times New Roman in its skeletal structure, but with the following differences: (1) optically monolinear; failing that, then having a very low stroke contrast, (2) serifs more slab-like than standard TNR.</p>
    <p>Metric equivalence to TNR not relevant.</p>
    <p>Is there such a face? What, to your eye, comes close? And are there any like this that are any <em>good</em>?</p>
