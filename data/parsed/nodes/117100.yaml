      <p>Lovely!</p>
      <p>Many productive directions for me to look here.</p>
      <p>George, I've looked at Life from both sides now, from win and lose, and still somehow it's life's illusions I recall.</p>
      <p>GFS Elpis looks amazing and, for my purposes, will just need a bit of a closer look.</p>
      <p>Times Europa Office was easy to check out on myfonts.com and see that it might work very well indeed as a "screen Times."</p>
      <p>hrant, I love that you take long shots.</p>
      <p>I'm glad you showed me Beaufort, Nick. One thought was the tiny little almost-serifs such as you made. This too will need a closer look.</p>
      <p>Both Concorde and Plantin are also great directions for me to look. I'll include them in my close-looks.</p>
      <p>None of these are quite the "monolinear slab Times-variant" I imagined, but most are just what I was hoping to see. So, fantastic suggestions as always, folks. Thanks again.</p>
      <p>I really don't know Life at all.</p>
