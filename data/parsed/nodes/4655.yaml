    html: <p>WGL4 should be seen as a kind of transitional character subset, somewhere between the fixed sets of 8-bit codepages and free ranging in Unicode. It represents Microsofts attempt, at a particular time, to define an internal character set that would reliably support a specific set of languages (official, major and other well-documented European languages in the Latin, Greek and Cyrillic scripts), which could be specified as a procurement set by different groups within MS and which would be reliably covered in MS core fonts. <br> <br>WGL4 is now a bit out of date, and I'm cautious about recommending it as a base for new font development. It is missing four Cyrillic characters that were added to Unicode at the request of the Macedonian government after WGL4 was defined; it contains at least a couple of obsolete characters that are no longer in use (e.g. the Greenlandic <i>kra</i> which has not been part of the Greenlandic alphabet since the 1970s). The obsolete characters are not a big problem, since it does not harm to include them and historical documents containing them might need to be encoded, but the missing characters are a problem. <br> <br>Also note that there is a core set of WGL4 which consists of specific codepage support, as noted by Thomas above, and it may be possible to talk your customer into supporting this without needing to add all the IBM linedraw characters which fill out the larger WGL4 set.</p>
    html_clean: <p>WGL4 should be seen as a kind of transitional character subset, somewhere between the fixed sets of 8-bit codepages and free ranging in Unicode. It represents Microsofts attempt, at a particular time, to define an internal character set that would reliably support a specific set of languages (official, major and other well-documented European languages in the Latin, Greek and Cyrillic scripts), which could be specified as a procurement set by different groups within MS and which would be reliably covered in MS core fonts. <br> <br>WGL4 is now a bit out of date, and I'm cautious about recommending it as a base for new font development. It is missing four Cyrillic characters that were added to Unicode at the request of the Macedonian government after WGL4 was defined; it contains at least a couple of obsolete characters that are no longer in use (e.g. the Greenlandic <i>kra</i> which has not been part of the Greenlandic alphabet since the 1970s). The obsolete characters are not a big problem, since it does not harm to include them and historical documents containing them might need to be encoded, but the missing characters are a problem. <br> <br>Also note that there is a core set of WGL4 which consists of specific codepage support, as noted by Thomas above, and it may be possible to talk your customer into supporting this without needing to add all the IBM linedraw characters which fill out the larger WGL4 set.</p>
