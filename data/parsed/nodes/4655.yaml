    html: "<p>WGL4 is a Microsoft character set specification. It's not an encoding, and it's not specific to OpenType. It is however specific to Unicode (a Type 1 font with WGL4 character set would be possible, but pretty useless). <br> <br>Essentially, WGL4 includes the following Windows codepages: <br>- Western (WinANSI) <br>- Eastern Europe <br>- Turkish <br>- Baltic <br>- Greek <br>- Cyrillic <br> <br>It also includes some additional extended Latin characters not present in the Latin codepages above, and a whole section of IBM linedraw characters. <br> <br>So to build a WGL4 font, you can use the MS spec you cite, build it in either TTF or OTF (OpenType CFF) format, and mark the font as supporting those 4 codepages (plus whatever additional DOS or Mac codepages are appropriate). <br> <br>T</p>"
