    <p>hey guys<br>
    whenever i am trying to generate a font, fontlab opens a dialog box saying it's exporting and then stops at 98% and fontlab crashes.this has happended many times now and i dont know what to do and i am getting a HTTP 0 error if i am trying to export an image. </p>
    <p>Cheers<br>
    M</p>
