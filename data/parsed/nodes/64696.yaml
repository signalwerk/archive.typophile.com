    <p>Hi fellow typophiles,</p>
    <p>I was wondering what legacies will the U&amp;lc magazine be for future typographer and graphic design generations?<br>
    Will I am not a fan of ITC typefaces, I thought the U&amp;lc magazine design will be remembered in type and graphic design history.<br>
    What was you favorite and least favorite U&amp;lc design contributions?</p><div class="imageWrap"><img src="http://typophile.com/files/2722157519_90836ff2fd_5552.jpg"></div><p></p>
