    html: <p>Personally it will be remembered that i found almost the complete issues in a big paper bin when i was just throwing away old newspapers. Of course, i saved this treasure. The design is a creative playground, not necessarily a mirror of its era. But a nice showcase of Ed Benguiat’s work, especially in the early issues.</p>
