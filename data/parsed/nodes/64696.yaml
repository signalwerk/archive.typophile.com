    html: |-
      <p>I subscribed to <em>U&amp;lc</em> in the 1980s. What vestige of memory I retain is not so much of any particular feature's design, illustration or content (although they were indispensable to the magazine's glamour), but the experience of receiving a very large foundry specimen of new typefaces, regularly, with paragraph showings of multiple weights in various sizes. That was the essence of the publication. (It was backed up by specimen booklets for each typeface, which I, as an agency art director, was given by my type house sales rep on his weekly visits.)</p>
      <p>As a legacy, <em>U&amp;lc</em> is a convenient typographic archive that cements and enhances the importance of ITC and its faces during the foundry's heyday, despite their spotty reputation subsequently. However, the design work featured is not representative of typical design work of the era, or any other era--it is exceptional, "creative" work (see above) that appeals to the professional metaculture. So with regards to its content, the magazine's role in history will be myth-making. </p>
      <p>Adobe's <em>Font &amp; Function</em> and Emigre's <em>Emigre</em>, in the 1990s, could be compared.</p>
