    html: |-
      <p>I think "I/O switch" is the technical name for the on/off switch, which I believe predaties computers, going back to the early days of electronics. Either the switch is on or off, directing or stopping the flow of current. (This doesn't address the fact that if the thing is unplugged, its state is actually mu, being neither.) </p>
      <p>This is indeed related to the binary concept. I think elliot100  is right about the 'binary 1 for “on” and “0” [zero] for off'</p>
      <p>Pretty much all the Macs I've used have the circle halfway intersected by the vertical bar on the on/off button.</p>
