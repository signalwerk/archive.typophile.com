  html: |-
    <p>Maybe OT, but ... am I right in assuming:</p>
    <p>- a vertical line sometimes means 'on'<br>
    - a circle sometimes means 'off'<br>
    - a vertical line contained in a circle sometimes means 'on/off'<br>
    - a circle intersected by a vertical line sometimes means 'stand-by', sometimes 'on/off'</p>
    <p>1<br>
    Is this a system you can recognize?</p>
    <p>2<br>
    What do you think when you see the symbol [circle intersected by a vertical line]?</p>
    <p>Thanks</p>
    <p>sorenolsen</p>
