    date: 2003-05-21T06:07:00
    date_raw: 21 May 2003 — 6:07am
    votes: null
    html: <p>Okay, I've got an actual sample of a <i>WSJ</i> page in front of me now. Now I see the Scotch elements of the text. It's not so much Century-based -- the 'g' is clearly not a Century g. <br> <br>This text face bears some family resemblence to the WSJ Scotch headlines that Font Bureau designed, but it has distinctive differences in some letterforms -- aside from the obvious difference in proportions imposed by the demands of narrow-column news-text requirements. For instance, the treatment of the top of the 't', the curl and bulb of the 'r', and the neck transition of the 'g'. <br> <br>These design differences could be concessions to the needs of text, but they could indicate that the text design was not necessarily part of the WSJ Scotch commission. I've got a message out to Cyrus to try to confirm this. <br> <br>A front-page PDF of the <i>WSJ</i> downloaded from the <a href="http://www.newseum.org" target="_blank"> Newseum</a> indicates that the text is called "DJ4DowText". But this same PDF indicates that a headline clearly set in FB's WSJ Scotch is in "DJ4ScotchCd", so I don't know what that might indicate. <br> <br>I'll keep you posted if I learn anything else. <br> <br>-- K. <br></p>
  - id: 909
    user: 1215
    date: 2003-05-21T11:02:00
    date_raw: 21 May 2003 — 11:02am
    votes: null
    html: "<p>Cyrus Highsmith says that all he drew for Font Bureau's WSJ Scotch were a headline series and caption fonts. Apparently last year's redesign didn't change the text face. <br> <br>So, getting back to the original question: as near as I can tell, the body text of the <i>Wall Street Journal</i> is a proprietary typeface, possibly called Dow Text. It's not clear who designed it. <br> <br>-- Kent. <br></p>"
