cotch  <br>Compressed. <br><br><b>The redesign of the <span class="caps">WSJ</span> typeface Scotch.</b> <br>Multiple line headlines of Scotch Compressed were  <br>kept and two-line headlines were added on the  <br>front page, allowing for more information in the  <br>headlines. <br><br>Franklin Gothic was preserved and redrawn to  <br>refresh its look, and used for charts, graphs,  <br>inside boxes and other visual elements like  <br>interior labels, providing good contrast to the  <br>elegant Scotch. The bold weight that Franklin  <br>Gothic provides is the kind of weight that draws  <br>the eye and provides a strong navigational device  <br>for the reader. <br><br>Because stock listings were so important to the  <br>paper, research was done to ﬁnd the most readable  <br>face. Retina was chosen. This is the ﬁrst time  <br>Retina has been used in a newspaper. It was  <br>redrawn by Tobias Frere Jones of the Hoeﬂer Type  <br>Foundry. <br><br>The nameplate was an important recognizable  <br>element that had to stay. But it looked ‘funereal’,  <br>according to Dizney. So it was cleaned up and  <br>made to look more contemporary by California-based  <br>type designer <a href="http://www.typedesign.com/" target="_blank" class="link-external"> Jim Parkinson</a>. The change was <a href="http://www.typedesign.com/logos/wsj.html" target="_blank" class="link-external"> subtle</a>.</p>'
