    html: <p>The <i>Wall Street Journal</i> uses <span class="caps">WSJ</span> Scotch for headlines. But that’s not the text face, as far as I know. <span class="caps">HTF</span>’s Retina is used for stock listings. Franklin Gothic is used for some sans. But none of these is used in the sample originally posted. <br><br>I can’t tell for sure from the online sample and I don’t have the paper close at hand, but it seems to be based on Century. Various members of the Century family have been used for news before. This is not New Century Schoolbook, though. Century has also been the basis for custom news faces. But I’m not sure what this one is.  <br><br>It could possibly be <span class="caps">FB</span>’s Bureau Roman, which David Berlow based on Century Oldstyle. But the ‘g’ doesn’t look quite right in the scan above. <br><br>Sorry, Yves, I think you need to keep looking before you claim victory on this one. <br><br>— K. <br><br></p>
    html_clean: <p>The <i>Wall Street Journal</i> uses <span class="caps">WSJ</span> Scotch for headlines. But that’s not the text face, as far as I know. <span class="caps">HTF</span>’s Retina is used for stock listings. Franklin Gothic is used for some sans. But none of these is used in the sample originally posted. <br><br>I can’t tell for sure from the online sample and I don’t have the paper close at hand, but it seems to be based on Century. Various members of the Century family have been used for news before. This is not New Century Schoolbook, though. Century has also been the basis for custom news faces. But I’m not sure what this one is.  <br><br>It could possibly be <span class="caps">FB</span>’s Bureau Roman, which David Berlow based on Century Oldstyle. But the ‘g’ doesn’t look quite right in the scan above. <br><br>Sorry, Yves, I think you need to keep looking before you claim victory on this one. <br><br>— K. <br><br></p>
