    html: <p>Okay, I’ve got an actual sample of a <i><span class="caps">WSJ</span></i> page in front of me now. Now I see the Scotch elements of the text. It’s not so much Century-based — the ‘g’ is clearly not a Century g. <br><br>This text face bears some family resemblence to the <span class="caps">WSJ</span> Scotch headlines that Font Bureau designed, but it has distinctive diﬀerences in some letterforms — aside from the obvious diﬀerence in proportions imposed by the demands of narrow-column news-text requirements. For instance, the treatment of the top of the ‘t’, the curl and bulb of the ‘r’, and the neck transition of the ‘g’. <br><br>These design diﬀerences could be concessions to the needs of text, but they could indicate that the text design was not necessarily part of the <span class="caps">WSJ</span> Scotch commission. I’ve got a message out to Cyrus to try to conﬁrm this. <br><br>A front-page <span class="caps">PDF</span> of the <i><span class="caps">WSJ</span></i> downloaded from the <a href="http://www.newseum.org" target="_blank"> Newseum</a> indicates that the text is called “<span class="caps">DJ4D</span>owText”. But this same <span class="caps">PDF</span> indicates that a headline clearly set in <span class="caps">FB</span>’s <span class="caps">WSJ</span> Scotch is in “<span class="caps">DJ4S</span>cotchCd”, so I don’t know what that might indicate. <br><br>I’ll keep you posted if I learn anything else. <br><br>— K. <br></p>
