    date: 2003-05-20T05:23:00
    date_raw: 20 May 2003 — 5:23am
    votes: null
    html: "<p>Note to self: check <i>thoroughly</i>, then post. <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\"> <br> <br><a href=\"http://www.garcia-media.com/in_the_press/wsj_reflections.html\" target=\"_blank\"> Mario R. Garcia</a> used the now called WSJ Scotch  <br>Compressed, redrawn and enhanced by The Font  <br>Bureau, for their <a href=\"http://www.poynter.org/content/content_view.asp?id=3638\" target=\"_blank\"> redesign</a> of WSJ last year. <br> <br><b>STARTING THE PROCESS BY EXAMINING THE PAST</b> <br> <br>Garcia and Joe Dizney, the paper's design  <br>director, the launched a 'visual archeology' of  <br>the paper. This involved going back into the files  <br>and studying typefaces that had been used with  <br>a view to seeing what could be kept or restored,  <br>what could be added without disturbing the  <br>identity of the paper, and reflecting on what  <br>could be improved. <br> <br>They excavated an assortment of typefaces,  <br>including Caslon, Scotch Roman and several  <br>different sans serif faces. They found that over  <br>the years as various typefaces were added to the  <br>typographic system, the paper had become jumbled  <br>and inconsistent. To solve that problem, they  <br>streamlined the typographic structure by deciding  <br>on three main faces. <br> <br>Scotch was the original typeface for headlines,  <br>used from the beginning. It was an important face  <br>and people identified it as The Wall Street Journal. <br> <br>For that reason, it was retained for headlines,  <br>but redrawn to make it look less Victorian and  <br>more contemporary. It was redrawn and enhanced  <br>by The Font Bureau. It is now called WSJ Scotch  <br>Compressed. <br> <br><b>The redesign of the WSJ typeface Scotch.</b> <br>Multiple line headlines of Scotch Compressed were  <br>kept and two-line headlines were added on the  <br>front page, allowing for more information in the  <br>headlines. <br> <br>Franklin Gothic was preserved and redrawn to  <br>refresh its look, and used for charts, graphs,  <br>inside boxes and other visual elements like  <br>interior labels, providing good contrast to the  <br>elegant Scotch. The bold weight that Franklin  <br>Gothic provides is the kind of weight that draws  <br>the eye and provides a strong navigational device  <br>for the reader. <br> <br>Because stock listings were so important to the  <br>paper, research was done to find the most readable  <br>face. Retina was chosen. This is the first time  <br>Retina has been used in a newspaper. It was  <br>redrawn by Tobias Frere Jones of the Hoefler Type  <br>Foundry. <br> <br>The nameplate was an important recognizable  <br>element that had to stay. But it looked 'funereal',  <br>according to Dizney. So it was cleaned up and  <br>made to look more contemporary by California-based  <br>type designer <a href=\"http://www.typedesign.com/\" target=\"_blank\"> Jim Parkinson</a>. The change was <a href=\"http://www.typedesign.com/logos/wsj.html\" target=\"_blank\"> subtle</a>.</p>"
