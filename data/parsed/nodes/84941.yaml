    <p>Aratypo, 27.08.2011. For immediate release. We are glad to present Tachkili, a family of 2 fonts, designed by Jadli Zein Alabedeen (Algeria) and programmed by Zakaria Saleh (Palestine).</p>
    <p>Tachkil means format and set-up in Arabic, and this family reflects that meaning by its dynamism and clear-cut force!</p>
    <p>Please do not hesitate to put a comment if you find an error or you would like to add some other aspects to it.</p>
    <p>This family is free for the non-commercial use. If you would like to license it, please contact the designer @: aratypo[@at]gmail.com</p>
    <p>Preview: <a href="http://farm7.static.flickr.com/6205/6086425741_d849833654_b.jpg" title="http://farm7.static.flickr.com/6205/6086425741_d849833654_b.jpg">http://farm7.static.flickr.com/6205/6086425741_d849833654_b.jpg</a></p>
    <p>Download link: <a href="http://www.mediafire.com/file/eo0fgarvagfqnab/djadli_Tachkili.rar" title="http://www.mediafire.com/file/eo0fgarvagfqnab/djadli_Tachkili.rar">http://www.mediafire.com/file/eo0fgarvagfqnab/djadli_Tachkili.rar</a></p>
