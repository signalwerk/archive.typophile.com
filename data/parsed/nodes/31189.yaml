    <p>I'm desperately looking for an alternative to this (f)ugly face. The idea was something that could work with Meta (body copy), yet in a completely human, quirky, silly way. I dont want it to be overdone to the point where it starts conflicting with other elements on the page. Please help anyone. Thanks in advance</p>
