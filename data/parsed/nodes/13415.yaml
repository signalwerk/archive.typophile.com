    html: <p>Looks like an "X" sorry I can't offer more. It <em>may</em> be a little too wide on top and you <em>may</em> be overcompensating for that illusion where one line passing through another looks unaligned (I forget what it's called right now but its the reason the left leg and the right arm aren't really a straight line) <strong>but</strong> it is very hard to be certain of a lot of this stuff without seeing it in context and at it's optimal point size. There are more educated, experienced voices than mine who frequent these forums and I hope one of them will comment (hrant?).</p>
