    html: |-
      <p>Very nice. I have a few general suggestions. Don't worry <em>too</em> much about geometric perfection with pen and paper, you can easily correct it as you draw the glyph in fontlab. There is no need to finish the font on paper (unless that is how you prefer it) you have enough of the uppercase to draw the rest directly in fontlab with the pen tool. At least, that's how I do it, if you're more comfortable sketching it all on paper first than go for it. I really like what you did with the "P" at the base of the bowl where it joins the stem. It will be interesting to see if the digital version has any bracketing or if you intend to make is sharply squared off. The "L" seems a tad to wide for my tastes, but its hard to tell without seeing it in a setting. The "F" is great, it seems energized. You'll need to straighten it, of course, but don't touch those curves and corners! The "K" looks top heavy and a little wide. The "J" is fine, maybe take the left serif in a hair?</p>
      <p>I'm eager to see the lowercase.</p>
      <p>I hope someone with more experience than me chimes in, too. </p>
      <p>It's looking very, very nice, keep it up!</p>
