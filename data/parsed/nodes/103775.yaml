    <p>I like Didot and was hoping to have my web designer use it on my website.  My one hesitation is because it is such a high contrast font that it doesn't look as nice small as it does large.  I came across H&amp;FJ Didot which has "Optical Sizes' which is a concept I really like, but since I am not a graphic designer I don't know how big of a difference the "Optical Sizes" will really make on a website.  I really only will need at max maybe 8 styles of Didot, but the H&amp;FJ Didot only sells theirs in a package of 42 styles (because of the optimized fonts) so it is quite a bit pricier than other Didot fonts I have looked at (like Linotype Didot on myfonts.com)<br>
    I really like Didot, but I know enough about graphic design to know I don't know graphic design and that is why I am asking to get a consensus of whether it is really worth it to invest the extra couple hundred of dollars to get the H&amp;FJ Didot vs Linotype Didot?</p>
    <p>Thank you for reading my question :)</p>
