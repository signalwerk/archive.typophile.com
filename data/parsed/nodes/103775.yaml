    html: |-
      <p>H&amp;FJ is clearly one of the best Didot designs available and I think it is worth the extra investment, for print.</p>
      <p>The whole class is rather difficult for web because Didot is intended to be used with the thin horizontal strokes remaining for the most part consistent independent of size. This is to say, if one tunes their printing to the proper appearance of text as they like it, whatever the crossbar of the 10 point H looks like, from there to 100 point and beyond, the crossbar of the Didot H, (along with all the serifs, hairlines and etc.) are to maintain that apparent thickness. </p>
      <p>There is a good reason why sans, and low contrast fonts in general, are so successful on the web. Despite its pixel-based nervous system, and even with the most elaborate size mastering, hinting, media queries and voodoo, it'd be hard to supply such an appearance consistently for a Didot on the whole web, though maybe one part of the web at a time is enough? </p>
      <p>In the mean time, you might study the web type uses of notorious Didotphiles and see what they are doing instead.</p>
