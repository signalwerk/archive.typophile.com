      <p>Even with Retina resolution, didone faces don’t work at small sizes on screen.<br>
      Really, the horizontal serifs need a pixel of its own.<br>
      Therefore, you need a threshold of 28 pixels (according to WebInk’s Bodoni page) to even get those serifs to show ﬁrmly, and the effect is more like a slab serif than the delicate, high-contrast effect of H&amp;F-J’s Didot.</p>
