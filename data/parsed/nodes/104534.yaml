  html: |-
    <p>darling is a display font, with medium contrast, designed to be used in the composition of titles, letterings, visual id’s and short texts such as illustrated books or magazines for children.<br>
    it has 738 characters and a lot of opentype features that allows the composition of titles and/or words in a very different ways. otherwise, when applied with no features, it produces a homogeneous amount of text.</p>
