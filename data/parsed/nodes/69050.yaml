    <p>Hi everyone,</p>
    <p>I’ve taken to using Dwiggins’ ‘Electra’ rather extensively. For the past few months I’ve been trying to find a sans pairing for it, without much luck. I think my problem is that I’m going about it the wrong way. </p>
    <p>I’m looking for something like Futura Bold. The problem with Futura Bold/Electra is that the x-heights are really different, and next to the restrained elegance of Electra, Futura Bold looks a bit like an uncultured brute. Which isn’t necessarily bad. But it just doesn’t look good.</p>
    <p>I welcome suggestions for energetic sans-serifs, but more than that, I’m looking for a suggestion of a methodology. How do I go about finding a pairing that makes visual, historical, and ideological sense, while providing enough contrast?</p>
    <p>Thank you in advance.</p>
