    <p>I am wondering if anyone has managed to create an accessible pdf (tagged for a screen reader) which allows footnotes to function as they should – by that I imagine that a footnote would be reached, read out and then return to the main text, possibly with an option to ignore the footnote and continue with the main text.</p>
    <p>The document will have superscripted footnote number(s) in a single column of text with the footnote(s) at the base of the page.</p>
    <p>The only vaguely pertinent piece I can find on the internet is Joe Clark’s article here<br>
    <a href="http://www.alistapart.com/articles/pdf_accessibility/" title="http://www.alistapart.com/articles/pdf_accessibility/">http://www.alistapart.com/articles/pdf_accessibility/</a></p>
    <p>I am hoping that there might have been more recent developments.</p>
    <p>I would appreciate any information/workarounds/ideas</p>
    <p>Tim</p>
