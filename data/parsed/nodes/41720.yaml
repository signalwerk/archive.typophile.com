    html: |-
      <p>It's a lot of manual work, but what about using links (the tool is on the Advanced Editing Toolbar)? For each body text superscript and corresponding footnote, you'd create a pair of links that point to each other. That is, when the user clicks on the superscript in the body text, they'll be taken to the footnote text. Then, by clicking somewhere in the footnote text, they'll be taken back to the body text superscript. Kind of a kludge, but it works. The only thing to watch out for is that if a link points to something too close to the bottom of a page, Acrobat sets the link to the top of the next page. Unfortunately, it's not easy to tell when something is "too close;" you have to set the link and then switch back to the hand tool to try out the link.</p>
      <p>Also, since the body text superscript might be a little small, you can select one or more words in the text and create the link on them.</p>
