    html: |-
      <p>"I think he means that his government customer wants both HTML and PDF."</p>
      <p>Which I'd toss back at the customer as 'why?'</p>
      <p>Regardless, if they do want both, then there's not a whole lot of reason to worry too much about the PDF in terms of accessibility if the HTML one is accessible. IMHO, of course.</p>
      <p>Just seems redundant to have both. HTML is so much more universal in terms of disseminating information in an as accessible manner as possible.</p>
      <p>"Given the choice I would prefer to avoid it altogether it takes an age to do"</p>
      <p>Exactly! ;o)</p>
      <p>That goes back to my 'inane' statement. PDFs are great for a few base things, but Adobe has been piling on feature after feature that a) can usually be handled better by another technology/format and b) aren't easily created in any easy/intuitive fashion via Acrobat's odd UI.</p>
      <p>Ultimately, HTML is often more adept and handling most of the 'other' features found in a PDF, so it becomes a 'why reinvent the wheel' kind of thing.</p>
      <p>That said, as a dot-gover myself, I certainly understand the odd request, as I deal with it all the time myself.</p>
