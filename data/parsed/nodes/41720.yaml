      <p>Apologies, I didn't make myself clear – the problem is that when a pdf is tagged so that the computer converts text to speech for visually impaired readers, there doesn't seem to be a satisfactory way to allow for footnotes. So far the only option seems to be to make it into a  and have the footnote read out as though it part of the text by changing the reading order, which isn't ideal.</p>
      <p>An HTML version of the document will also be available, this is a Government document and they like to cover all the bases, so I have to create a tagged pdf. The links option doesn't seem viable as I am not sure that a speech converter allows for this (and I should consider the most basic equipment might be used), I do appreciate the advice though.</p>
      <p>It would help if I actually knew, from a visually impaired reader, the limitations of the technology and how they liked to read (hear) documents but so far I haven't had any feedback from other tagged documents that I have done.</p>
      <p>Linda, thanks for the welcome back, I have been reading a few threads but haven't had much time to usefully contribute (and I have been diving in the Maldives – it's not all work, work, work).</p>
      <p>Tim</p>
