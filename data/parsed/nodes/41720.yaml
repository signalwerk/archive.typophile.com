    html: |-
      <p>"An HTML version of the document will also be available"</p>
      <p>Then why bother with the PDF?</p>
      <p>If the issue is screen reading, most folks will NOT choose the PDF. They'll take HTML or Word DOCs first, as both are easier to make accessible and both are easier for the major screen readers to parse. (to be fair, maybe Adobe and the Screen Reader developers have both made massive improvements in their respective technologies and that's not as true anymore, but as of a few years ago, in talking with a blind web developer who taught accessibility classes I was in, the demos they showed convinced me that PDFs are pretty much useless for that type of accessibility requirement.)</p>
      <p>IMHO, PDFs are great as snapshops of a print document and for prepress. All of the other uses are just inane wishful thinking on Adobe's part to make it more relevant than it actually is.</p>
      <p>FYI, to get more specifics on this, this is a great mailing list for accessibility issues:</p>
      <p><a href="http://www.webaim.org/community/" title="http://www.webaim.org/community/">http://www.webaim.org/community/</a></p>
