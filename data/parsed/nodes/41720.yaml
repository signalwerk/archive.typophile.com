      <p>&gt; Then why bother with the PDF?</p>
      <p>I think he means that his government customer wants both HTML and PDF.</p>
      <p>Tim, some thoughts:</p>
      <p>1. Are you using the Read Out Loud feature of Acrobat? If so, maybe you could put the footnotes in as comment boxes or alternate text descriptions.</p>
      <p>2. Have you tried reordering the tags (View &gt; Navigation Tabs&gt; Tags &gt; Order)? The tags determine the reading order.</p>
      <p>3. Do articles work with text-to-speech?</p>
