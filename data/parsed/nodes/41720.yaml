      <p><em>It would help if I actually knew, from a visually impaired reader, the limitations of the technology and how they liked to read (hear) documents but so far I haven’t had any feedback from other tagged documents that I have done.</em></p>
      <p>My vision's not so poor that I need to have things read, but I did tinker around with the technology for PDFs a bit when I was working on my thesis, as well as working on some governmental documentation. The footnote situation was a minor issue for me (and the linking did well in letting me choose to listen or not), and virtually non-existent for most of the folks who did use the technology that I questioned.  </p>
      <p>The general consensus was that if you simply wanted to include a bibliographic reference, that it was probably better handled by endnotes (one needed to keep track of what the number of the note was, which was pretty minor), but that extensive footnoting was better dealt with by simply including it in the main text -- frankly, not a bad suggestion for constructing documents for readers in general. :-)</p>
      <p><em> All of the other uses are just inane wishful thinking on Adobe’s part to make it more relevant than it actually is.</em></p>
      <p>The concept is a good one, and if that's the eventual goal, so much the better.</p>
      <p>But "inane" it isn't.</p>
