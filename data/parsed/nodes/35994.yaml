    <p>I'm going to open a can-o-worms here. I think the letter 'g' is one of the few characters that really stand out in a type face. There are a multitude of ways it can be crafted. With so many fonts out there, I look at a few letters -- the lowercase g in particular.</p>
    <p>This is how I propose the thread will work. I'm not here to militarize things... just some friend standardization.<br>
    1. Go to a font site (I prefer <a href="http://www.fontshop.com/">http://www.fontshop.com/</a> because you can link to samples)<br>
    2. Find your font<br>
    3. Post a link to it (if possible to the sample) along with the font name.</p>
    <p>For example:</p>
    <p>Natalie Script OT<br><a href="http://www.fontshop.com/fonts/downloads/paratype/natali_script_ot/?sample_text=Gg&amp;sample_size=36">http://www.fontshop.com/fonts/downloads/paratype/natali_script_ot/?sampl...</a></p>
    <p>You can also post an image. Let's see your G-sus.</p>
