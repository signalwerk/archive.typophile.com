      <p>I should have been visiting my thread more. This is actually the first thread I've ever started here. Definitely bend the rules... can't have the good without the bad.</p>
      <p>@Nick: I like Digitalis - it's got character. Nubian is something I would use daily if I had license to it. ;)</p>
      <p>@Grant: I'm not sure if the font in "Meet the g-friends" is Opentype... if it is that's hot. I have a set of Zapfino and keep going through the alternates when typesetting.</p>
      <p>@Bald: I agree, the Trebuchet g is quite basic. I think the more a font is used, the more it gets abused. The more it gets abused, the more you want it disposed. Comic Sans anyone?</p>
      <p>Here's something I came across today:<br><a href="http://www.fontshop.com/search/?q=Deviata&amp;sample_text=g&amp;sample_size=388">http://www.fontshop.com/search/?q=Deviata&amp;sample_text=g&amp;sample_size=388</a></p>
      <p>I don't like how it flattens out at the bottom of the character. It's not noticeable at lower sizes.</p>
