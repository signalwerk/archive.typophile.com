      <p>I also don't see the point in a Showcase forum. That seems counter to the purpose of this site, which is typographic collaboration. I think if you post a design in the Design forum you should be prepared for comments/suggestions. Defending your work before a bunch of professionals is good preparation for defending it to the client.</p>
      <p>That said, I too have been dismayed by some of the nastiness and personal sniping at times here, and also once posted a thread suggesting comments be constructive and considerate rather than just derogatory. I think it's better recently but this forum should not be a place for blood feuds.</p>
      <p>There have been episodes of sexism and homophobia here as well, which is really unfortunate. Those sorts of comment do NOT belong here and the moderators are very good at deleting them when they cross a line.</p>
      <p>I also suggest posting your work BEFORE you spend the money getting it printed.</p>
