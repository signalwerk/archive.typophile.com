      <p>In addendum: I really just hope people would consider there words more carefully. I'd like to think all of us are here to learn and grow and share and ... collaborate. Collaboration implies more than one person working together for a common goal. This doesn't include being off-handed or rude. You can joke, but make sure you use smilies, some of us has thinner skin that others.</p>
