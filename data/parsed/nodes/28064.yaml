    <p>I don't know what happened to a topic that was posted by Paul Petch aka 'iostmypassword'. But in it he was sharing a buiseness card he designed for his wife, I belived it was titled "Buiseness Card" or something. Anyway, when i posted a comment it said "Page not found" so perhaps the topic was removed. But I just want to repost my comment because i feel it's important that others hear what I have to say.</p>
    <p>Now I love Typophile, it has been a tremendous help to me as a designer and continues to be. I know others feel the same way. But lately I found this forum to be leaning toward harsh, petty criticism of people's work. Now I have always believed that criticism equals refinement, especially in our line of work, but we must not forget that this blog also serves to edify, to encourage to bolster our confidence. I mean come on people it's just a buiseness card and in my opinion a beautifully designed one at that. But all I can read is comment's like "It looks like another card you designed before", "why do you need the letter 'e' before the email address", "the name Amy shows through on the other side". In the end Mr Petch commented on how it's just a card and defended his work. BRAVO. But it was upsetting to me because lately I've been thinking twice about posting anything. I mean Mr. Petch obviously worked hard on the design and proofed it multiple times to insure that it was just right and all others can do is, in my opinion, be petty. Comments like that can really undermind a person's confidence and with time render them useless with selfdoubt.  Oh and another thing, This kind of behavior also discourages others from posting great examples of their work, like Mr Petch's. When he posted the topic he clearly stated that he wanted to <em>share</em> his work with us. He never asked us directly what we thought or how we could improve it. So please, let us not give answers to questions no one asked. </p>
    <p>I don't pretend to be this great designer who is better than everyone else. But I do believe their is truth in what I say. And we All (myself included) must be careful of not to fall into this trap.</p>
    <p>Mr Petch, love your work. Please dont stop sharing it with us.</p>
