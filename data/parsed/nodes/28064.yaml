      <p>Thing is ratbaggy, at no time did i ask for feedback.. i just wanted to share. I mean if i was to visit your folio and post up modified (copyrighted by the way)  versions of it…. make sexist comments and then tell you that your “personal” likes and preferences are “incorrect” …. is that appropriate behaviour &amp; classed as critique?</p>
      <p>You have your website linked as part of your signature, so does this mean i can critique your work without an invite? </p>
      <p>Infact, what actually constitutes an appropriate critique? Are personal likes/ dislikes really valid? Call me old fashioned, but it’s just poor manners to comment on ones work unless invited.</p>
      <p>But let’s be a little realistic here. It’s a public forum, not a client briefing or meeting room. And I've now learnt that posting artwork will provoke a response (not necessarily a critique) of all shapes and sizes!... Even if i want to hear it or not ;)</p>
      <p>So in the future I’ll keep my work private unless I want a critique. </p>
      <p>Seriously, problem solved and no harm done :D</p>
      <p>_________________ </p>
      <p>Paul</p>
