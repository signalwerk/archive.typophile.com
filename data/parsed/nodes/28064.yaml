      <p>I cannot find the thread either, or rather, I found the thread on Google, but the link is dead. Perhaps its author asked for it to be removed, and it was. I do not know.</p>
      <p>However, I would encourage anyone (and everyone) to post their work on Typophile… both for show AND for critique. We have several forums here on Typophile. In the critique section, posted work should be critiqued; that is why it is posted there in the first place, right? I have gotten great feedback over the years in that forum, and I recommend it to anyone.</p>
      <p>Work posted in General Discussions or in the Design forums (I don't know where the thread in question was posted), is not for outright critique per se. However—and this is only my personal opinion—I think that some critique of others' work should be allowed, if other posters find such helpful or necessary. Anytime anyone puts their work in the public forum, they should be open not only to constructive feedback, but negative feedback as well… I'm not saying that anyone's work should be trashed here… not at all! But, when you post your work to the public, you should keep in mind that not every one in the public is necessarily nice.</p>
      <p>Also, the line between constructive criticism and negative feedback is subjective. Everyone has different degrees of personal sensitivity to these matters. As a poster posting on someone else's thread, it can be difficult to sense out someone's boundaries if you do not know them personally. Heck, it can be difficult sometimes even if you DO know them personally.</p>
      <p>I hope that this has not scared you off, Ivan. Please do post your work here on Typophile. Depending on the project and its level of completion, place your posts in the relevant section… put please don't go away… Typophile is a lovely place.</p>
      <p>P.S.: The best thing to do about negative posts is to ignore them.</p>
