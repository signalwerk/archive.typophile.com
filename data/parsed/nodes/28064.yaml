      <p>I think it's great that this topic generated so much attention. Thanks guys!</p>
      <p><em>Critique is not an attack, it’s a contribution</em></p>
      <p>Well said, but-in my opinion-not 100% accurate. Because critique can and has become an attack as it did in the deleted post.</p>
      <p><em>if you don’t want feedback (good AND/OR bad) … don’t post?</em></p>
      <p>I also agree with this but how bad does it have to get before we cross the line. I don't believe measures should be taken by this forum to filter out what we deem offensive. My comment was to elicit personal analysis. When I give a critique I always think if what I'm saying really that important, that significant. Has it already been said? (though i must admit sometimes different posters will submitt the same comment simultaniously) Do my comments disrespect the prefrences, likes/dislikes, personal beliefs of the poster? Yes there are rules in design and typography, but have we not been taught to learn them so that way we may bend, break or even ignore the rules to aid us in our creative process? Has enough good things been said about it? And i don't care how bad it is, even the time put into posting the design is a good thing.</p>
      <p><em>I also suggest posting your work BEFORE you spend the money getting it printed</em></p>
      <p>Why? Doesn't experience thru out the years entitle us to follow our gut instincts. Besides this project was personal, for his wife. What we say really doesn't matter. If his wife loved it, which I'm sure she did, then mission accomplished.</p>
