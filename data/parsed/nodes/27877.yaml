    html: <p>I use PopChar Pro to find "hidden" glyphs, but in Windows there's a "special character box" that can be opened from any application (it's somewhere in the "Start"-button I think, but I'm not sure). Don't know if there's any better solution (unless you'd know of a character with an easy shortcut that nobody actually ever types so you could change glyphs with it).</p>
