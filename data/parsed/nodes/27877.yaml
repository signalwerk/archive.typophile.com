  html: <p>Looking for any info on an easy way to insert Service Mark - (℠)- glyph into documents - It is unicode 2120 but how can you tell average corporate users how to insert it or even what fonts contain it? This is an actual problem in a large business and any suggestions would be great. I do it in the Glyph table in InDesign but that not a solution for people using word processors - copyright, trademark are easy with keystrokes - but service mark?</p>
