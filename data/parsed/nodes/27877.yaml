    html: |-
      <p>If you're using Windows XP, you can enable direct Unicode keypad entry by doing the following:</p>
      <ol>
      <li>Start the Registry Editor (<code>regedit.exe</code>) and navigate to the following key:<br>
      <code>HKEY_Current_User/Control Panel/Input Method</code>.
      </li><li>Set the <code>EnableHexNumpad</code> value to <code>1</code>.<br>
      If the <code>EnableHexNumpad</code> value doesn't already exist, create it as a string value (<code>REG_SZ</code>).
      </li><li>Restart the computer.</li></ol>
      <p>(This process can be automated by creating a simple <code>.reg</code> file and importing it on each of your computers. Let me know if you need help doing that.)</p>
      <p>Once you've got that set up, you should be able to enter the "℠" character by holding down the ALT key and typing the following on the numeric keypad:</p>
      <p><code>+&nbsp;8&nbsp;4&nbsp;8&nbsp;0</code></p>
      <p>(That's five keys: You have to press the actual "+" key on the keypad before entering the four digits -- all while holding the ALT key down. In case you're wondering where the 8480 value comes from, it's the "℠" code point, U+2120, in decimal.)</p>
      <p>Note that the "℠" character will appear only if that glyph is defined in the the currently selected font. One way to check if a given font contains the glyph is to use Character Map (<code>charmap.exe</code>).</p>
