      <p>I forgot to mention this: If you don't mind a solution that's specific to Microsoft Word, you can enter an “℠” by simply typing 2120 into your document and then pressing ALT+X (hold down ALT and press the "X" key). If the current font doesn't contain the glyph, Word will automatically find one that does, and switch to it.</p>
      <p>This should work on all Windows versions of Word starting with Word 2002. Don't know if there's an equivalent for Mac versions of Word.</p>
