    <p>Hi,<br>
    I would really appreciate it if someone could please identify the type used in the current Wendy’s campaigns. The query got emailed around the office, but no one knew what it was although a few people took an early lunch that day... </p>
    <p>It caught my eye because it has a really pointy W but a slope and slightly calligraphic feel to some of the characters. </p>
    <p>Thanks!<br>
    FG</p>
