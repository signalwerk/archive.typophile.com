    <p>Hello, this is my first post here. I am looking for a typeface that looks stitched, or sewn. I thought I found one but when we contacted the designer he said he had not finished the face. His name is <a href="http://tbad.ca/">Tom Brown</a> and we saw his work in an old issue of Communication Arts. The attached is a screen shot from his site. I would have just linked to it but since it is Flash based thought this was safer.</p>
    <p>We don’t need an exact duplicate so any suggestions of nice faces with a similar feel would be appreciated.</p>
