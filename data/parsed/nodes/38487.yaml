      <p>Agreed. Selecting a book font is pointless unless the intended audience, book design, and subject matter are addressed first. For example, I love Utopia and ITC Garamond for a junior high school social studies text; for a scholarly article in a science journal though, not a chance.</p>
      <p>If you don't care about such things, you could set your book in Fraktur and Caxton, that would be interesting....</p>
