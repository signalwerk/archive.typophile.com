    html: |-
      <p>A question: What is the intended purpose of this poster series?  You say that it's a series of tips, but your example isn't a tip - it's a 'what you should be thinking about'/</p>
      <p>If it were the opening slide of an extended power-point presentation, fine. But if it's a stand-alone reminder, I don't think that your example really says very much. </p>
      <p>It's as if your topic were 'getting ready to face the day' and a  poster said:<br>
       Choose your clothing appropriate to your day</p>
      <p>The content  is dull, and neither gives any hint of why or  how, and has little educational or entertainment value. For this topic in particular, why is the typeface you chose appropriate for the poster? Maybe the same phrase in two different typefaces, one next to or over the other, might bring the point across. Possibly an almost illegible display font as a contrast.</p>
