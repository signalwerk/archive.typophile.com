    <p>Hey everyone, I'm new to this awesome forum. I was wondering if I could get some of you experts in typography to help give some input on my poster series. I'm creating posters that deal with typography and some basic tips for beginners. Right now I have 8 posters and will maybe make a ninth if I need it. I was hoping that everyone could give me some input on the topics I chose to write about.</p>
    <p>1. Choose the right typeface for the job.<br>
    2. Serif or Sans Serif?<br>
    3. Kern correctly.<br>
    4. Use two fonts on average in a design.<br>
    5. The grid.<br>
    6. Weights.<br>
    7. Hierarchy.<br>
    8. Use fonts that have complete sets of glyphs.</p>
    <p>So those were the topics I chose to put. I'm going for a real minimalist poster and  I already have some examples if you would want to see them.</p>
    <p>Thanks everyone.</p>
