    <p>Hello everybody!<br>
    I need a little help, please.<br>
    I need a tip, don't you know whether exists some tool which I can use to see diferences in subfamilies of my font? I mean something like covering outlines of each subfamily, each on other. I hope you understood that description in my bone breaking English, thanks for every reply.</p>
