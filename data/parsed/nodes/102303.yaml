      <p>If you search for a type designer always look at first at the Klingspor Museum. Hans Reichardt has made a pdf from most of them. See the link.<br>
      <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Schroeder/GustavFSchroeder.pdf" title="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Schroeder/GustavFSchroeder.pdf">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Schroe...</a></p>
      <p>On the last page of the pdf also some references are listed you can probably find at a library like Columbia.<br>
      -Joep Pohlen</p>
