    <p>Hello!<br>
    I'm trying to find out some information about the type designer Gustav F. Schroeder. All I am able to stir up so far is very cursory.<br>
    I figured if anyone could help me, it would be the great minds at Typophile.<br>
    Can anyone here point me in a good direction to find useful information about Schroeder?</p>
    <p>Thanks in advance!</p>
    <p>-Chuck</p>
