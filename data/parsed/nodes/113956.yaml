  html: <p>I have some indesign files (created on a Mac) that I'm trying to edit on a PC. I have trade gothic ST installed, but not the medium weight. Is it possible to buy anywhere? I can't find any mention of trade gothic medium on adobe or linotype.</p>
  html_clean: <p>I have some indesign files (created on a Mac) that I'm trying to edit on a PC. I have trade gothic ST installed, but not the medium weight. Is it possible to buy anywhere? I can't find any mention of trade gothic medium on adobe or linotype.</p>
