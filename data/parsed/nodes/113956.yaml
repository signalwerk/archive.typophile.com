    html: |-
      <p>Unless it is a modified weight of the family, what you are most likely looking for is the Regular weight of Trade Gothic. Some older Postscript versions of the Regular weight use Medium as the weight specification for the Regular weight. The screen shots below show the differing name information in the Adobe Mac PS Type 1 and OpenType PS versions of Trade Gothic:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Trade Gothic (PS)_5635.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Trade Gothic LT Std (OT)_5343.jpg"></div><p></p>
