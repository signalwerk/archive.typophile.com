  html: |-
    <p>I had posted about this in general discussions, but it probably really belongs here.</p>
    <p>An obvious countermeasure to the spam problem we're having would be to require new users' posts to be passed by a moderator before showing up. But this may create an excessive workload, and cause other problems.</p>
    <p>Upon reflection, I think that this wouldn't be too onerous either to prospective posters or to the moderators if we made one exception to the rule: new users' posts would be queued for moderation before appearing, <em>except if they were directed to one of the Type ID forums</em>.</p>
    <p>Because a Type ID request is the one general type of posting for which the poster might be in a hurry for an answer.</p>
    <p>And this would have the side benefit of addressing the issue of Type ID requests turning up in the wrong place!</p>
