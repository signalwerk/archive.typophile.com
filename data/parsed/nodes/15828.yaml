    <p>I’m researching font design/typography of El Salvador. Any help with the following would be much appreciated: </p>
    <p>- Foundries from El Salvador<br>
    - Fonts with characteristics unique to El Salvador<br>
    - Fonts designed for use in El Salvador<br>
    - Packaging and signage from El Salvador<br>
    - Calligraphy, inscriptions and other lettering from El Salvador<br>
    - Basically any type that is connected with El Salvador</p>
    <p>Thanks in advance.</p>
