    html: |-
      <p>These are indeed not "fonts" in the sense that they would be available in digital format to use on your computer. These characters are made specifically for the plate-making machines that produce them.</p>
      <p>There are a number of typefaces available that either were modeled after or resemble various types of license plates. In this instance I would look into <a href="/wiki/Tobias%20Frere-Jones" class="freelinking" rel="nofollow">Tobias Frere-Jones</a>'s <a href="http://www.fontshop.com/fonts/downloads/font_bureau/garage_gothic/?sample_text=ABTP%20357&amp;sample_size=74" rel="nofollow">Garage Gothic</a> or <a href="/wiki/Christian%20Schwartz" class="freelinking" rel="nofollow">Christian Schwartz</a>'s <a href="http://www.fontshop.com/fonts/downloads/font_bureau/pennsylvania/?sample_text=ABTP%20357&amp;sample_size=74" rel="nofollow">Pennsylvania</a>. Also check out the collection of license plate fonts from <a href="http://www.lineto.com/" rel="nofollow">Lineto</a>.</p>
    html_clean: |-
