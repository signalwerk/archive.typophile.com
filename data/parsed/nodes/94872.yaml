      <p>You should probably tighten the "Re" slightly, but the "t" still needs to be nudged left. In fact I just looked at the string "ntnoto" in MyFonts, and it seems that in all the cuts of Avenir the "t" sits too far to the right.</p>
      <p>hhp</p>
