      <p>Hrant - Thanks for giving me the benefit of the doubt, but I think the loosening Bert suggested will help legibility in this instance; and reverting to the original metrics accomplished just that. But, to my strictly "graphic designer's" eye, the "Re" seems just a hair too loose, and the rhythm seems to break at the "io." Should I loosen the "ti" in this case? Or is there a better solution?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Reception-metrics_3493.png"></div><p></p>
