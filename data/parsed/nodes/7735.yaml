  html: <p>I'm trying to find the perfect face for an art dealer who handles American artists, many from the earliest years of America...Also some contemporary stuff. <br> <br>My client wants an identity that creates a relationship with its customers, who are 50+ years old men who buy the art as a sign of wealth and achievement associated with hard work. Additionally, client is interested in how banks, brokerage firms, and other high-class businesses portray themselves and what they emphasize in design. <br> <br>With all that said, I've gotten a few ideas from "world wide webbing" and Bringhursting. <br> <br><a href="http://tiro.com/Plantagenet/plantagenet_index3.html"> Plantagenet Novus</a> by Tiro <br> <br><a href="http://www.myfonts.com/fonts/adobe/caslon-3-caslon-540/"> Caslon</a> Not perfect, but hey. I like it <br> <br><a href="http://www.myfonts.com/fonts/linotype/electra/"> Electra</a> Dwiggins is American, style is neoclassical <br> <br>I like Bringhurst's mention of Ben Franklin and Baskerville, in that Ben and John were buds and Ben used Baskerville to correspond to the federal style of American architecture. Anybody got details on this?</p>
  html_clean: <p>I'm trying to find the perfect face for an art dealer who handles American artists, many from the earliest years of America...Also some contemporary stuff. <br> <br>My client wants an identity that creates a relationship with its customers, who are 50+ years old men who buy the art as a sign of wealth and achievement associated with hard work. Additionally, client is interested in how banks, brokerage firms, and other high-class businesses portray themselves and what they emphasize in design. <br> <br>With all that said, I've gotten a few ideas from "world wide webbing" and Bringhursting. <br> <br><a href="http://tiro.com/Plantagenet/plantagenet_index3.html" class="link-external"> Plantagenet Novus</a> by Tiro <br> <br><a href="http://www.myfonts.com/fonts/adobe/caslon-3-caslon-540/" class="link-external"> Caslon</a> Not perfect, but hey. I like it <br> <br><a href="http://www.myfonts.com/fonts/linotype/electra/" class="link-external"> Electra</a> Dwiggins is American, style is neoclassical <br> <br>I like Bringhurst's mention of Ben Franklin and Baskerville, in that Ben and John were buds and Ben used Baskerville to correspond to the federal style of American architecture. Anybody got details on this?</p>
