    html: "<p>Historical fidelity is one thing, good design is another. <br> <br>The story about Franklin doing a switcharoo is true (if one of his letters to Baskerville is to be believed), but it was done in the States, and only one way: he took a Caslon specimen sheet, tore off the top, and showed it to a Baskerville-hater saying it was Baskerville, getting the predictable layman-in-expert's-clothing response. <br> <br>hhp</p>"
