    html: "<p>Walbaum is too late, maybe. He was working in the 1800s. And his work isn't \"American\" at all, at least from what little details I know. <br> <br>Of course, maybe you could determine when Walbaum's type was introduced to the US. If that era correspond to the type of furniture that the shop is selling, it could be a go� <br> <br>I don't have any details about Ben and John, Dan, but I have also heard repeatedly that Ben was a big fan of John. In fact, Ben I've even heard rumors that Ben didn't even like William, or maybe he liked William but left him after he met John. William was the man, though, and might still be in England for all I know. <br> <br>My favorite hearsay story is this: When Ben was in England, many of his printer friends were dissing John, talking the normal ••••� you know \"this type is too light an illegible. It hurts my eyes; I can't read it!\" Ben printed up two sheets of paper, one printed in Caslon, and the other in Baskerville. Then, he gave the trash-talkers the Baskerville, and said that it was Caslon, and vice-versa. The John-haters lauded over the page they thought was in Caslon, and denounced the actual Caslon print, enforcing the idea in Ben's mind that they had no idea. Dogma�</p>"
