  html: |-
    <p>Rather disappointed to see that this</p><div class="imageWrap"><img src="http://typophile.com/files/web013_5348.jpg"></div> was the only piece of <a href="/wiki/Kinneir" class="freelinking" rel="nofollow">Kinneir</a> and <a href="/wiki/Calvert" class="freelinking" rel="nofollow">Calvert</a>'s work on display in the <a href="http://www.designmuseum.org/exhibitions/current-exhibitions/designing-modern-britain" target="new" rel="nofollow">Designing Modern Britain</a> exhibitiom, and I think that changed on Sunday.<p></p>
    <p>There was also a London Underground display with some some posters, an upholstery swatch and a repro  platform seat with integral enamelled roundel. And a small case with some <a href="/wiki/Gill" class="freelinking" rel="nofollow">Gill</a> and <a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a> material.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/web009_4720.jpg"></div><p></p>
    <p>The <a href="http://www.designmuseum.org/exhibitions/current-exhibitions/alanfletcher" target="new" rel="nofollow">Alan Fletcher</a> exhibition downstairs was (to my mind, and my  wife agrees with me)  much  better.  Some pictures later.</p>
