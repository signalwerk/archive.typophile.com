    html: |-
      <p>I've had funnies with revisiting a font in FontLab 5.0.2 on a PC as well, but thought it was just me. Instead of losing pairs, I usually gain them -- but the new ones are unwanted &amp; wrong. May just be something I do &amp; not a bug.</p>
      <p>Anyway, my solution is to always save the features file, and put any new kerning in that file, read it back in &amp; recompile. I put my classes in the feature file as well, so my starting point in a "revisit" situation is always a .vfb with no classes.</p>
      <p>If I add kerning by using the FL metrics window (when revisiting), I write off an .AFM for pairs kerning, search &amp; replace to get it into the proper syntax, &amp; paste into the features file. For new classes or expanding existing classes, I just use the metrics window to determine the values. Then write these values into the features file "kern" feature in the appropriate places, read the features back into the .vfb, &amp; recompile. Takes time, but seems to work. Just remember to say "NO" when the program tells you the "features file &amp; metrics window kerning don't agree, do you want to rebuild?"</p>
    html_clean: |-
