      <p>Great to hear that I’m not dreaming Peter ;-)</p>
      <p>Easiest way of discovering the bug is to open an old font with classes and full kerning.</p>
      <p>Then make the kern feature visible and again do "generate "kern" feature.</p>
      <p>It takes away all kern pairs that are not class VS class.<br>
      OSX 10.4.9</p>
