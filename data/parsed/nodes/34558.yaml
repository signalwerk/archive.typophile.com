    <p>This happens in FL 5.0.3 for Mac:</p>
    <p>About half of the kerning is lost (mostly the pairs that are not classes) when having OT-classes also in the font.</p>
    <p>The kerning looks OK in the metrics panel, but when generated or updating the kern feature it shows that all kerning is not present anymore.</p>
    <p>If I take away the OT-classes, the whole kerning is back again when I generate "kern" feature.</p>
    <p>In this case it was smcp1 + smcp2.</p>
    <p>Could anyone try and see if they have the same bug?</p>
