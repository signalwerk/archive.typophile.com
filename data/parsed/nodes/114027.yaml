    html: <p>Same or similar; I'm not sure. Remains a fact, though, that if the document header says "charset=utf-8" but the HTTP header says "charset=iso-8859-1", the browser will render the document as iso-8859-1 (aka Latin-1) unless somehow spiked to do otherwise. Caused me quite some scratching of head to find out why so many things looked wrong all of sudden coming from the bedroom LAN server.</p>
