    html: |-
      <p>The thing with UTF-8 is that:<br>
      a) While editing your webpage file in your text editor of choice, it must be configured to save the file as utf-8.<br>
      b) Some web-hosting (in particular cheap shared webhosting) can fail to deliver your page as utf-8 to the browser, so you must force them to do it by including a PHP header function.<br>
      c) You must specify UTF-8 in the HEAD Content Type of your Html</p>
      <p>As long as you do all those 3 things, the browser will get it right, and you will have no problem.</p>
