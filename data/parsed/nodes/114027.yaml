    html: |-
      <p>&gt;Just use UTF8 :)</p>
      <p>Absolutely. No page complete without specifying charset UTF-8 in the head.<br>
      But....<br>
      My understanding is that regardless of the charset specified, if it just doesn't seem to fit the content, the browser will take a guess at the codepage to use based on that content. I've seen it happen with my own eyes.<br>
      (I've actually seen an alternate code page triggered by a web font - don't ask me how but I've got the screen shots to prove it.<br>
      A Google font titled Atomic Age (which was recently re-done so the problem is gone.)</p>
      <p>The only way I know to prevent either human error or an unwanted intervention by the browser, is to use Unicode.</p>
      <p>But hey, that's just me. I'm picky that way.</p>
      <p>Thanks for the additional links.  Nice.</p>
      <p>rich</p>
