    html: |-
      <p>Pablo's test page is excellent and I'm planning on contributing to <a href="https://github.com/impallari/font-testing-page" rel="nofollow">the code for it</a> on Github shortly.</p>
      <p>(Among other things - adding a single-symbol fallback font implemented as a Data URI internal to the page, that will make it easy to see characters that are specified in the test page's source but missing in the font that's currently displayed by the browser. A "notdef" fallback font I guess you could call it. Similar to the one built into this <a href="http://readableweb.com/latest-version-8-2-of-drag-n-drop-pangram-font-tester/" rel="nofollow">pangram testing page</a>. (The font's name is declared as "backdrop" in the @font-face rule. It has too limited a character set and I'm not fond of the symbol it's using to indicate a notdef character. Soon to be upgraded.)</p>
      <p>But I'm digressing before I even begin....</p>
      <p>What I wanted to say was that, in my experience, the sample text for webfonts in HTML test pages should ideally use Unicode points, not keyed-in characters.</p>
      <p>Why? Well, here is what happens when  the browser tries to interpret the page with the Central European character set:</p>
      <p>Menu selection:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CentralEur-inFFmenu_4705.png"></div><p></p>
      <p>Messed up output:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CentralEur-messup_4272.png"></div><p></p>
      <p>Just flagging a potential problem. </p>
      <p>And also - talkin' 'bout Diacritics - take into account the special handling required for the S/s commaaccent/cedilla, T/t commaaccent/cedilla. Uni points: 015E, 015F, 0218, 0219, 0162, 0163, 021A, 021B<br>
      There's a thread about that here on Typophile I believe. </p>
      <p>rich</p>
