    date: 2014-02-15T10:09:00
    date_raw: 15 Feb 2014 — 10:09am
    votes: null
    html: |-
      <p>From Pablo:</p>
      <p>&gt;a) While editing your webpage file in your text editor of choice,<br>
      &gt;it must be configured to save the file as utf-8.<br>
       &gt;b) Some web-hosting (in particular cheap shared webhosting)<br>
      &gt;can fail to deliver your page as utf-8 to the browser, so you must<br>
      &gt;force them to do it by including a PHP header function.<br>
       &gt;c) You must specify UTF-8 in the HEAD<br>
      &gt;Content Type of your Html</p>
      <p>and from Té:</p>
      <p>&gt;One more trap: The server must not claim contrary in the<br>
      &gt;header. Due to a massive bout of perversion, the HTTP header<br>
      &gt;charset overrides the document charset.</p>
      <p>All great tips. (Although Té, isn't what you are describing the same problem as Pablo's 'b' listing, or no?)</p>
      <p>One downside I see with taking this approach - what if you are distributing the page to others who don't have that kind of control over their servers and/or the technical expertise?  </p>
      <p>Anyway, to sum up:</p>
      <p>you can take, if possible,  all the steps listed above,</p>
      <p>or.......</p>
      <p>you can write the test text as HTML Unicode points using either the decimal or hex syntax. (Example: &amp;#21512; versus &amp;#x5408;)</p>
      <p>For test pages where all browsers need to process exactly the same characters and testers all need to see exactly the same text, I think, in this instance, the principle of "defensive coding" favors the Unicode points. You only have to remember one thing - convert the test text to Uni.  Take that one simple precaution and after that, it can't go wrong - the browser can be set to use any old codepage and the test text will still render predictably.</p>
      <p>I rest my case.</p>
      <p>(BTW - I've had this kind of argument before and it's really rare that I change anybody's mind.* It seems to be very much philosophical. Everybody's got their own inner sense of what's important and even if they acknowledge the logic behind what you say, they still do what they've always done. Perhaps that's out of a feeling of "the way I usually do it is good enough", I don't know. Not an end of the world event,  )</p>
      <p>* However, I did convince web designer and author <a href="http://zomigi.com/publications/" rel="nofollow">Zoe Mickley Gillenwater</a> - with words written right here on Typophile - that using the "local" descriptor in a @font-face declaration is poor practice!</p>
      <p>I take solace in the little things.....</p>
