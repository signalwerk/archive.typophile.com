    html: |-
      <p>thanks for all the answers. </p>
      <p>gill sans schoolbook looks very much like it to me. only differences seem to be the "l" which is a straight line, the "4" (doesn't show in the sample) which is closed and the "y" as mentioned, all pointing to the regular gill sans. </p>
      <p>the "M" has slanted vertical lines and the center touches the baseline, which doesn't happen in any gill sans version i managed to find.</p>
      <p>linotype's gill sans infant looks pretty much identical to the gill sans schoolbook...? both versions appear to have a thicker stroke than in this printed sample.</p>
      <p>is there a digital version of gill sans with a light cut with alternates for "a" and "g" as in schoolbook/infant? :)</p>
      <p>vista sans looks too condensed. fiendstar is pretty nice, the light version has the weight right. don't like the "y" though.</p>
