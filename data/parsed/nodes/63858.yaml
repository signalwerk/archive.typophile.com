    <p>Does any one know where I’ll find some contemporary geometric fonts which have flourishes or ligatures? I really like Brant Pro 2 but wish it had a bit more personality.</p>
    <p><a href="http://www.processtypefoundry.com/typefaces/bryant2/b02.html" title="http://www.processtypefoundry.com/typefaces/bryant2/b02.html">http://www.processtypefoundry.com/typefaces/bryant2/b02.html</a></p>
