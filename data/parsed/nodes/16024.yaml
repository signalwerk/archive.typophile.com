    <p>Hi Guys,</p>
    <p>I'm just after a little advice. Been talking to my lecturer today and he thinks I've got a realistic chance of getting on the MA at RCA "MA Communication Art and Design" course.</p>
    <p>What I want to know is, what is the real 'benefit' of continuing my education at an institute such as this? I realize that many many talented designers come from places such as this, I’m just not so sure if I need an extra, 2 years of education to refine myself as a designer.</p>
    <p>I'm not from a 'wealthy' background and I realise the implications of taking on such a course. It will cost a lot of money. Again, is it worth it?</p>
    <p>I'm just weighing up the pro's and con's. I have to submit a proposal pretty soon on why I would like to continue my education at the RCA. I reckon I’ll have a go, and see what happens. It’s pretty competitive I think so I’d be lucky to get in, if I don't then its not the end of the world.</p>
    <p>Any advice is really welcome.</p>
    <p>Cheers,</p>
    <p>Rob.</p>
