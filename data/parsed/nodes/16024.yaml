    html: <p>I recently elected to get a real design job instead of going to grad school. I made decision because I felt there was more for me to learn in the real world than in more school. I would really like to get a masters in the future but, at the time, I felt like I needed to balance all of the theory and idealism of school with some experience and reality. It's been a great decision so far, I managed to get a really good job where I feel constantly challenged and have been learned a ton. Anyway, thats my story. I hope you come to a decision that is best for you. If you can't make up your mind, apply anyway and decide later. Good luck.</p>
