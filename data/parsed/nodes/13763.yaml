    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Bouma</strong></p>
    <p>Bouma: a hypothesized visual-syntactic atom of immersive reading; almost always the blurry notan of a string of letters; usually the blurry outline of a single word in the parafovea. The term is a simplification of "Bouma-shape" as used by <a href="/wiki/Insup%20Taylor" class="freelinking" rel="nofollow">Insup Taylor</a> and/or <a href="/wiki/Paul%20Saenger" class="freelinking" rel="nofollow">Paul Saenger</a>, derived from <a href="/wiki/Herman%20Bouma" class="freelinking" rel="nofollow">Herman Bouma</a>, a [retired] Dutch scientist.</p>
    <p>Most cognitive psychologists reject this hypothesized importance of the bouma in reading, immersive or otherwise. The dominant reading model in cognitive psychology is the parallel letterwise recognition model. Research experiments which would have different predicted outcomes for the two different theories have supported parallel letterwise recognition over the bouma theory.</p>
    <p>See also: <a href="/wiki/Notan" class="freelinking" rel="nofollow">Notan</a>, <a href="/wiki/Word%20Shape" class="freelinking" rel="nofollow">word shape</a></p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/15432" rel="nofollow">Bouma as Bounded Map</a></p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://en.wikipedia.org/wiki/Bouma" rel="nofollow">Wikipedia: Bouma</a></p>
