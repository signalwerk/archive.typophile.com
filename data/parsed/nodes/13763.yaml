    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Bouma</strong></p>
    <p>Bouma: a hypothesized visual-syntactic atom of immersive reading; almost always the blurry notan of a string of letters; usually the blurry outline of a single word in the parafovea. The term is a simplification of “Bouma-shape” as used by <a href="/node/add/wiki?edit%5Btitle%5D=Insup%20Taylor" title="Create node &quot;Insup Taylor&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Insup Taylor</a> and/or <a href="/node/add/wiki?edit%5Btitle%5D=Paul%20Saenger" title="Create node &quot;Paul Saenger&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Paul Saenger</a>, derived from <a href="/node/add/wiki?edit%5Btitle%5D=Herman%20Bouma" title="Create node &quot;Herman Bouma&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Herman Bouma</a>, a [retired] Dutch&nbsp;scientist.</p>
    <p>Most cognitive psychologists reject this hypothesized importance of the bouma in reading, immersive or otherwise. The dominant reading model in cognitive psychology is the parallel letterwise recognition model. Research experiments which would have different predicted outcomes for the two different theories have supported parallel letterwise recognition over the bouma&nbsp;theory.</p>
    <p>See also: <a href="/node/14819" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Notan</a>, <a href="/node/13764" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">word&nbsp;shape</a></p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/15432">Bouma as Bounded&nbsp;Map</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://en.wikipedia.org/wiki/Bouma">Wikipedia:&nbsp;Bouma</a></p>
