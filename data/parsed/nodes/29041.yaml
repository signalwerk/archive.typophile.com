    <p>Just passing this along for one of my friends:</p>
    <p>Learn about the unique letterforms of Armenian.<br>
    As part of a panel, along with paleographer Dr. Abraham Terrian, I<br>
    will be introducing typographic design with Armenian examples. The<br>
    featured lecturer will be Carolyn Puzzovio, an English graphic<br>
    designer who has made Armenian her specialty. She will be exhibiting<br>
    her work and speaking about “The Remarkable Legacy of Mashtots”.</p>
    <p>7:30 p.m., Wednesday, November 1<br>
    Guild Hall of the Diocese of the Armenian Church<br>
    630 Second Avenue and 35th St. in Manhattan<br>
    Free Admission<br>
    For more info, email: <a href="https://web.archive.org/web/20080830000331/mailto:zicres@armeniandiocese.org">zicres@armeniandiocese.org</a></p>
    <p>Hope you can make it,</p>
    <p>-Peter Bain</p>
