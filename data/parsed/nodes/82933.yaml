      <p>It sounds like a wonderful organization, and a very worthwhile cause.  Have you considered hiring a professional designer?  Many will give discounts for causes that are worth supporting, and in the end the cause will benefit greatly by having a well designed logo - the first point of identity for your organization.  I would strongly suggest looking into the option at the very least.</p>
      <p>About your design:<br>
      It definitely reads as SDe.  Also, I think you have too many things going on here in too many different styles.  Simplify.</p>
      <p>On another note, I often steer people away from acronym logos because acronyms create barriers between those who know what they stand for and those who can't figure out what those seemingly random strings of letters mean.  </p>
      <p>Hope that helps!</p>
