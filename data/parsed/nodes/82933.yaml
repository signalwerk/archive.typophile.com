    <p>Here is a logo designed for a school for children with disabilities called SDC School.</p>
    <p>Our foundation is known as the SDC Blue Ribbon Foundation and in this logo, we are trying to represent things like happiness, trust, and friendship</p>
    <p>We are just looking for some critique on how we can improve our logo.</p>
    <p>Thank you for your help.</p>
