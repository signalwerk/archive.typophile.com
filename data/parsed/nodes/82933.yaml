      <p>Yichen,<br>
      This literalist take on 'happiness, trust, and friendship' is too complicated. You've also introduced a major legibility problem. I think a much better starting place would consist of picking up a pencil and drawing letters that are happy, friendly, and/or trustworthy.</p>
