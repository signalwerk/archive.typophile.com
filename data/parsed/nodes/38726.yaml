      <p>First I just want to say how much I like the mark. Very clever use of an old trick.</p>
      <p>Second, removing the traps is fine, I can see how it might be a good thing. However, shifting the T to align with the E makes me want to tell you the kerning is too loose in the NT pair.</p>
