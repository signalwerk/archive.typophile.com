    html: |-
      <p>Well, the ink traps are from the original face, because I went with Text instead of Display; I didn’t build them into it.  I think that for the sizes this will likely be reproduced at that House’s original traps are way too extreme in this setting, although the ones on the A and M seem all right.</p>
      <p>As for prior art, I didn’t find anything similar during the research phase, but that kind of bums me out because I knew it was too good (IMHO) not to have been done before.</p>
