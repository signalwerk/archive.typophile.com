    <p>I’m finishing up identity work for a print services company, and while I love love love House Industries and their amazing Neutraface family, Display Titling was too fat and Display Bold too thin.  So I used Neutra Text Bold and wanted your opinions on ink traps (which I removed from the N on two samples) and balance, and the kerning, which admittedly is still not one of my strong points.</p>
    <p>Finally, the T in “PRINT” is not mechanically aligned to the “E” in “MAGNATE” – real alignment makes the top look rather unbalanced.  Does the bottom one (c) look better or worse than the middle one (b)?</p>
