    html: |-
      <p>The IN pair feels a touch too tight to me.  </p>
      <p>Regarding the ink traps, that’s fine to build in for a smallish size print logo.  Just make sure the traps don’t become too obvious so they become part of the actual design (i.e. like the Amplitude typeface).  If this is ever going to be used to make a 3D sign, though, those traps have to come out.</p>
      <p>I’ve seen this symbol before, but I can’t place it.  It’s probably not so unique that you should abandon it, but I thought it worth mentioning.</p>
