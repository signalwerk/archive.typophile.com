    <p>Hi all</p>
    <p>I’m sketching a logo for my own identity, I work has a graphic designer. Honestly, I didn’t spend enough time on this. On a couple of hours this is what I have.</p>
    <p></p><div class="imageWrap"><img src="/files/logo_5817.jpg"></div><p></p>
    <p>.<br>
    It comes from a simplified combination of an “H” and a “V” (my name and surname first letters), with a minimalist look, the dot tries to balance things. I’m aware it’s not clear and legible, but i think this could work only has a mark. What do you guys think? ...Start again? :)</p>
    <p>Feel free to comment.<br>
    Thanks in advance</p>
    <p>Regards</p>
