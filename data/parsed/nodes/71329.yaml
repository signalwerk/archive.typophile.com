    votes: null
    html: |-
      <p>If your grid units are a factor of the original UPM (which is usually 1000) you can do the following:</p>
      <p>Change the UPM to UPM/x where x=the distance between grid points. Et voilà, all minor errors are gone, as long as the adjusted UPM is an integer. Once you've done this, you can scale back up to the original UPM value without any rounding errors.</p>
      <p>So if your grid units are 5 apart, shrink the UPM to 200, and then grow back to 1000 and all your points end up being on multiples of 5.</p>
