    <p>(Excuse the cross-post with the OpenType mailing list)</p>
    <p>We are compiling a list of fonts for simple writing systems (e.g. Latin, Greek, Cyrillic, etc.) which make at least some use of GPOS contextual positioning. For example, you might be using the relatively new ability of the AFDKO to do contextual kerning, or be doing an equivalent sort of thing using VOLT.</p>
    <p>“Contextual kerning” would be kern triplets and the like. For example, You might kern “V.” one way but “V.V” differently so the period is neatly between the two V’s and the two V’s don’t collide with each other.</p>
    <p>Can anyone who has made such fonts let me know, either here or by email? Note that I’m only interested in fonts that have shipped or will actually ship, that we might encounter in the field.</p>
    <p>Thanks,</p>
    <p>T</p>
