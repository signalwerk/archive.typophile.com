    html: <p>Well, I guess these are obvious from high fashion, but there's always Louis Vuitton's LV emblem (used in e.g. patterns), Versace's medusa head (in clasps, belt buckles, etc.), Emporio Armani's fairly hideous bird thing (patterns, belt buckles), Ralph Lauren's polo player, Fred Perry's laurel wreath and Lacoste's crocodile (ebroidered on shirts)... Chanel may not use the CC on their website but it certainly appears on e.g. sunglasses.</p>
