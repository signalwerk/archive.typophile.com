  html: |-
    <p>I´m in search of examples where a logotype and a brandmark are used separately. Preferable fashion or luxury brands (but not a must).</p>
    <p>To be more specific I´m looking for examples where the standalone brandmark is used rather consistently. A lot of fashion brands uses their logotype as the main logo and the standalone brandmark for special occasions – not as a part of their main branding elements. </p>
    <p>The best example I have so far is Strellson. On strellson.com its rather evident that: 1. the two things are used apart and 2. the brandmark is used actively and rather consistently as part of the branding. On chanel.com for example the brandmark isn´t really used – only the logotype.</p>
    <p>It can be debated whether Chanel´s CC mark is actually a brandmark or an emblem (or whatever) but in this context it does´nt really matter.</p>
    <p>Anybody have some good examples to share?</p>
    <p>Help would be very appreciated, thanks :)</p>
