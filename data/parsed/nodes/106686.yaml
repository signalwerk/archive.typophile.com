      <p>I think it often depends on how well known the logo is. For a company like Apple, for example, the symbol is so well known that in signage, on web pages, etc, they typically just have the apple logo and don't include the company name.</p>
      <p>In the case you mention of Chanel, the brandmark is indeed used on some pages, such as <a href="http://chanel-news.chanel.com/en/home.html" title="http://chanel-news.chanel.com/en/home.html">http://chanel-news.chanel.com/en/home.html</a> (at the bottom). But my guess is that they thought the CC mark by itself may not be recognizable enough by folks who don't currently use their products, so they decided to spell it out on the main pages.</p>
