    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Point</strong></p>
    <p>A standard typographic unit of measure equal to exactly 1/72nd of an inch (1/12 <a href="/wiki/pica" class="freelinking" rel="nofollow">pica</a>). </p>
    <p>Prior to the advent of <a href="/wiki/postscript" class="freelinking" rel="nofollow">postscript</a> the typographic point (Anglo-American) was only roughly 1/72 of an inch. Prior attempts to standardize the typographic point were put forth by <a href="/wiki/Pierre%20Simon%20Fournier" class="freelinking" rel="nofollow">Pierre Simon Fournier</a>, <a href="/wiki/Francoise-Ambroise%20Didot" class="freelinking" rel="nofollow">Francoise-Ambroise Didot</a> and <a href="/wiki/Morris%20Fuller%20Benton" class="freelinking" rel="nofollow">Morris Fuller Benton</a> which resulted in a split standard between the European Didot point and the Anglo-American point.</p>
