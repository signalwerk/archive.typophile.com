  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Point</strong></p>
    <p>A standard typographic unit of measure equal to exactly 1/72nd of an inch (1/12 <a href="/node/20272" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Pica</a>). </p>
    <p>Prior to the advent of <a href="/node/14482" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">PostScript</a> the typographic point (Anglo-American) was only roughly 1/72 of an inch. Prior attempts to standardize the typographic point were put forth by <a href="/node/add/wiki?edit%5Btitle%5D=Pierre%20Simon%20Fournier" title="Create node &quot;Pierre Simon Fournier&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Pierre Simon Fournier</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Francoise-Ambroise%20Didot" title="Create node &quot;Francoise-Ambroise Didot&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Francoise-Ambroise Didot</a> and <a href="/node/13617" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Morris Fuller Benton</a> which resulted in a split standard between the European Didot point and the Anglo-American&nbsp;point.</p>
  html_clean: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Indices</a>&nbsp;: <a href="/node/12038/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Terminology</a>&nbsp;:&nbsp;Point</strong></p>
    <p>A standard typographic unit of measure equal to exactly 1/72nd of an inch (1/12 <a href="/node/20272/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Pica</a>). </p>
    <p>Prior to the advent of <a href="/node/14482/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">PostScript</a> the typographic point (Anglo-American) was only roughly 1/72 of an inch. Prior attempts to standardize the typographic point were put forth by <a href="/node/add/wiki?edit%5Btitle%5D=Pierre%20Simon%20Fournier" title="Create node &quot;Pierre Simon Fournier&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Pierre Simon Fournier</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Francoise-Ambroise%20Didot" title="Create node &quot;Francoise-Ambroise Didot&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Francoise-Ambroise Didot</a> and <a href="/node/13617/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Morris Fuller Benton</a> which resulted in a split standard between the European Didot point and the Anglo-American&nbsp;point.</p>
