    html: |-
      <p>An interesting and no doubt useful site, but a massive source of misinformation.<br>
      Most fonts appear to be renamed revivals that don’t credit the original designer.<br>
      And many were revivals already during the 1970s, e.g. those in the Art Deco style.<br>
      Please, take some time to do the thing right, and take it to the next level.</p>
