      <p>There was a PhotoLettering font called Benguiat Charisma Shaded that was identical to this. There was an Expresiv PhotoLettering font set from 1994 (which I have) that includes this font, and an unshaded Script version as well. This suggests that Candice may have been another digitization of Charisma.</p>
      <p>- Mike Yanega</p>
