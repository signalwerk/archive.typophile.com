  html: |-
    <p>I am looking at <a href="http://www.myfonts.com/fonts/linotype/cronos/" rel="nofollow">Cronos</a> and in particular at the different contextual (not sure if that's the right term, but it makes sense in my mind) weights - i.e. Display, Caption Subhead...</p>
    <p>Now, I appreciate Display and Caption variances from the regular design, but the Subh version looks identical to the Display variation, apart from maybe very slightly looser tracking.</p>
    <p>It's hard to see any subtle differences as I am just looking at the rasterised samples on myfonts... can anyone explain why the Subh context of this typeface is worth the extra investment?</p>
    <p>Thanks</p>
    <p>Steve</p>
