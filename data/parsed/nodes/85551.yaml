  html: |-
    <p>The Bronzetti family has just launched on <a class="freelinking external" href="http://www.fontspring.com/fonts/gatf/bronzetti " rel="nofollow"> Fontspring</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/bronzetti/ " rel="nofollow"> Myfonts.com</a>.</p>
    <p>Bronzetti has been a long term project for Greater Albion Typefounders, aimed at filling a large gap in the range of typefaces available today. The Bronzetti family of 22 text typefaces combines modern requirements for legibility and readability with the charm of traditional Roman faces in the spirit of those carefully constructed by small scale quality foundries such as the Kelmscott and Vale presses.  In short, Bronzetti is traditional letterpress meets modern publishing, offering a real opportunity to make your material stand out from today's 'run of the mill' crowd.  The range of typefaces on offer includes five widths of type, as well as small capitals and italic forms and regular and bold weights.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bronzetti_Poster1_5438.png"></div><p></p>
    <p>A further sampling of Bronzetti in use can be viewed <a class="freelinking external" href="http://greater-albion.com/2011/09/16/bronzetti-now-launched-on-myfonts-com/ " rel="nofollow"> here</a>.</p>
