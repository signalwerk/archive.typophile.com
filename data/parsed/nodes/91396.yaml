    <p></p><div class="imageWrap"><img src="http://typophile.com/files/astrup_5937.png"></div><p></p>
    <p>I’d interested to hear your opinions on this. I’ve been sketching on an off for a while, but I’m not sure if it’s worth the effort to finish it. There are plenty of geometric sans serifs out there,  particulary the grotesque-ed geometrics. </p>
    <p>(PS: You might notice the vertical proportions—enitrely nicked from Helvetica! I’m not posting this as something I intend to release in its present form anyway, so I figured it might make for an interesting conversation. Is it OK to reuse vertical metrics?)</p>
    <p><a href="http://www.frodehelland.com/vm.pdf" rel="nofollow">PDF link</a></p>
