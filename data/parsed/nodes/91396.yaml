      <p>Those circle-based caps /C/G/O/Q/ look very wide, especially /C/. I guess the commitment to geometry is a constraint there.<br>
      Speaking of which, does the hard geometry of a structure like /Q/ argue for a single-story, round /a/?<br>
      Stroke width seems uneven in spots (northeast to east of /D/, southwest of /C/c/, south of /U/, south to southeast of /g/...)<br>
      /s/ looks a bit wide.<br>
      I quite like the figures! That form of /6/9/, with its straight-to-curve transition, can be hard to draw well but you have here. Look to achieve that same success with caps like /J/.</p>
