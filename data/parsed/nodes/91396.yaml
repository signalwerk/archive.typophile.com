  - id: 502697
    user: 1250
    date: 2012-03-30T21:27:00
    date_raw: 30 Mar 2012 — 9:27pm
    votes: null
    html: |-
      <p>OK. We can do this.  :-)</p>
      <p>I think I had an epiphany, and it's that in the past a font<br>
      like this would aim to be highly versatile, but in this day and<br>
      age it can't survive and certainly not thrive using that ideal.<br>
      So it needs to have, not a gimmick, but a certain brashness.<br>
      Sort of like what Swagg does in its domain:<br>
      <a href="http://typographica.org/typeface-reviews/swagg/" title="http://typographica.org/typeface-reviews/swagg/">http://typographica.org/typeface-reviews/swagg/</a></p>
      <p>Looking at what you already have, one thing I agree with<br>
      you on is that the width divergence has some merit... but<br>
      only in the lc; in the UC it's just looking ugly - but getting<br>
      rid of it would make the UC deathly boring. So here's what<br>
      I think you should try: unusually short capitals, which is<br>
      a good avenue for making certain letters very wide. This<br>
      could be a main way to give this thing a raison d'être.</p>
      <p>Another thing that struck me is how nice the "a" is. And I<br>
      think the hook must be playing a big role in that. So try to<br>
      make that hook a central theme: see how it looks on some<br>
      or all of: f, j, l, q, r, t and y. Concerning the "y", I would say<br>
      go out on a limb and try the Fleischmann form, with a full<br>
      curling hook, coming out of the lefthand diagonal! THAT<br>
      would get people talking...</p>
      <p>More:<br>
      - Definitely dump Helvetica's proportions. What do you get<br>
      out of that beyond dysfunction? Make the ascenders taller.<br>
      - Try making the tittles square.<br>
      - I can't see that "Q" working at all.<br>
      - Numerals: I agree with Craig - they have a lot going for<br>
      them. If you do end up making the caps short &amp; wide you<br>
      will need another numeral set to match though.</p>
      <p>hhp</p>
