      <p>You are off course right. The main issue is reconciling geometry and grotesqueness. Graphik, Neuzeit etc sacrifices the former to make room for the two story a, but my vision was different. I guess I gotta make that work first of all. And dare to go all the way. A two headed frankenmonster, eh? I know this corner is crowded :)<br>
      I do think the roundness and the proportions, in both directions, has something interesting to it though.</p>
