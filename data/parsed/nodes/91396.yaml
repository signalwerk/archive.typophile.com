      <p>OK, I finally found the time to take a good look at this.</p>
      <p>This puppy has identity issues! In fact it feels like some<br>
      sort of test font in a way - as if it has intentional mistakes.<br>
      Or maybe it's trying to push some boundaries? Peculiar...<br>
      Plus this genre is so crowded, the only I way it could make<br>
      any business sense is if it were released by a font house with<br>
      loyal customers who have been waiting for a geo-grot from<br>
      them. Otherwise you need some distinguishing feature(s),<br>
      without going into the realm of gimmickry however.</p>
      <p>BTW, to me worrying about copying the vertical proportions<br>
      from an existing font is a bit too... Calvinistic. :-)  You might<br>
      have noticed the recent thread* about copying a font's entire<br>
      spacing values - even there people don't seem too concerned.<br>
      Also, you might not be gaining what you think you are, since<br>
      that characteristic doesn't bestow practical usefulness; it might<br>
      seem to be inheriting the original's apparent size, but there's<br>
      more to that than vertical proportions. And really, a font that<br>
      has descenders longer than ascenders is bad news...</p>
      <p>* <a href="http://typophile.com/node/90341" title="http://typophile.com/node/90341">http://typophile.com/node/90341</a></p>
      <p>I like them big tittles!* But those belong in a text font; this thing<br>
      is way too large on the body and geometric to serve as a text font.<br>
      There are other strangenesses, but let me first see what you think<br>
      of the above... And oh, don't forget to take a close look at Unica,<br>
      which is the best design that sits between Univers and Helvetica.</p>
      <p>* Sorry.</p>
      <p>hhp</p>
