    html: |-
      <p><cite>Did Leslie write a new ‘Learn FL5 fast’?</cite></p>
      <p>Just for the record: yes, he did. Well, at least he started. “This book is in print and it’s only available <a class="freelinking external" href="http://logofontandlettering.com/bookorder.html" rel="nofollow"> here,</a> direct from the author/publisher! When you order, you will receive my most current edition for Studio 5.”</p>
      <p>Now with a blue cover (not shown in the site), actually this is an “in-progress edition” started by Cabarga in 2007, but “some other commitments” forced him “to stop one-third of the way into the task. I realize now that I cannot complete the project myself and I am inviting anyone qualified and interested to contact me about picking up where I left off”. </p>
      <p>But I don’t know if someone has contacted Cabarga.</p>
