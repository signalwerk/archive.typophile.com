  - id: 441451
    user: 2438
    date: 2010-11-26T09:55:00
    date_raw: 26 Nov 2010 — 9:55am
    votes: null
    html: <p>If you keep Names mode active and don't get the warning dialog seen on p86 of LFF, you're probably OK. Judging from the Preferences in FL5, codepages are automatically exported with OpenType fonts unless "Ignore Unicode indexes" is checked. It's only Type 1 fonts that require Codepages mode to be active when generating (assuming that's the option selected in the "Generating Type 1" preferences).</p>
    html_clean: <p>If you keep Names mode active and don't get the warning dialog seen on p86 of LFF, you're probably OK. Judging from the Preferences in FL5, codepages are automatically exported with OpenType fonts unless "Ignore Unicode indexes" is checked. It's only Type 1 fonts that require Codepages mode to be active when generating (assuming that's the option selected in the "Generating Type 1" preferences).</p>
