    html: <p>All I know is that using WordPad, I occasionally find that some fonts don't work properly because it refuses to allow me to change text from one font to another if they don't share a common codepage that includes the selected characters. So if a font has the wrong codepage data, or codepage data that is too limited, with it, some applications won't be able to use it.</p>
