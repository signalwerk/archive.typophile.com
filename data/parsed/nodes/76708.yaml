    html: <p>If you begrudge Octomom's prolificacy and wish to spawn an entire family (or just a bunch of bastards) all in one go-- open Fontlab's Action Set tool, keep the set empty (or add desired "genetic enhancements"), apply to "Fonts in the Fonts list", add your baby batter (ahem, source files), set the format, and let em drop. Should take considerably less than nine months, unless the the stork gets distracted by a spinning beachball, in which case you'll need to kill the stork and start over.</p>
