    <p>Hi there,</p>
    <p>I've always set all my fonts to 'Codepages' view when generating OT fonts. At least this is what is recommended in 'Learn FL fast'.</p>
    <p>My question is: is it really necessary? What happen if the OT font is generated while in 'Name mode'?</p>
    <p>Thanks in advance.</p>
    <p>Ramiro.</p>
