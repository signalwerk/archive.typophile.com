    html: <p>It has been my experience that scripts and hands are generally better selling typefaces (measured by unit sales, rather than dollar value) regardless of the foundry, designer, or distributor. What T-26 is <i>about</i> has slowly changed (...perhaps even grown up?) over the years.</p>
