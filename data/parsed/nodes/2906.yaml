    html: <p>It's dispiriting that big retail sites are getting a market-driven look that is increasingly "non typographic".  <br> <br>(This is not meant as a diss of script typefaces, but they ARE the least typographic of type genres, in that they don't offer the sophisticated "palette" that a traditional serif family does.) </p>
