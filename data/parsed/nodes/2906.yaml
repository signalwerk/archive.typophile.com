  html: <p>One aspect of the new T26 website is a bestsellers page, and there is some wierd stuff on there. OK so I understand the 'spiderman' font must be popular, but I never really thought of script typefaces being what T26 is all about. <br> <br><a href="http://www.t26.com/fonts/bestsellers.php" target="_blank">http://www.t26.com/fonts/bestsellers.php</a></p>
