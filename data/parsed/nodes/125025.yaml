    <p>To some, color fonts may feel like the next typocalipse. To others, this is a new golden age.<br>
    Personally, I feel more like this is a big thing: <a href="https://www.youtube.com/watch?v=uWGXkJy6whU">https://www.youtube.com/watch?v=uWGXkJy6whU</a></p>
    <p>And actually fell posted about my love for color fonts on this very website about 10 years ago: <a href="http://www.typophile.com/node/33610">http://www.typophile.com/node/33610</a><br>
    Wow, time flies!!! (For those wondering, here is an article from way back in 2007: <a href="http://www.aiga.org/the-peoples-font-an-interview-with-franz-hoffman">http://www.aiga.org/the-peoples-font-an-interview-with-franz-hoffman</a> )</p>
    <p>So what is your take on this color font thing? What got you into a believer / naysayer?</p>
    <p>PS: here's the French version, much, much more, well, ... <a href="https://www.youtube.com/watch?v=_cabEkOqgFY">https://www.youtube.com/watch?v=_cabEkOqgFY</a><br>
    (can you feel the excitement in the room? ;)</p>
