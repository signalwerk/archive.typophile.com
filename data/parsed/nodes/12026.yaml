  html: <p>The art of using type. Colloquially used to describe the range of activities incorporating <a href="/wiki/graphic%20design" class="freelinking" rel="nofollow">graphic design</a>, <a href="/wiki/typesetting" class="freelinking" rel="nofollow">typesetting</a>, and <a href="/wiki/type%20design" class="freelinking" rel="nofollow">type design</a>. Font nerding, the favorite activity of Typophiles, is something else entirely.</p>
