    <p><a href="http://www.guardian.co.uk/books/gallery/2010/jul/06/1" title="http://www.guardian.co.uk/books/gallery/2010/jul/06/1">http://www.guardian.co.uk/books/gallery/2010/jul/06/1</a></p>
    <p>'In 1926 the Czech dancer Milca Mayerová choreographed the alphabet as a photo-ballet. Each move in the dance is made to the visual counterpoint of Karel Teige's typographic music. Teige was a constructivist and a surrealist, a poet, collagist, photographer, typographer and architectural theorist, and his 1926 photomontage designs for the alphabet are a uniquely elegant and witty invention, and one of the enduring masterpieces of Czech modernism'. </p>
    <p>From the Guardian, 7.vii.2010</p>
