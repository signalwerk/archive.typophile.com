      <div class="comment-spam-body"><blockquote><p>IMHO, the new design is no better and no worse than the old design.</p></blockquote>
      <p>I don't think you believe that yourself. The new design isn't good, but certainly less cluttered than the old design. Regardless of opinions, the new design is objectively better.</p>
      <p>The use of the hyphen instead of the en-dash in the new design really frustrates me though. I tend to forgive the city's sign shop on such practices (though even then I get frustrated by street signs every day), though Pentagram should know better. Actually I think this is unforgivable for any sign maker.</p>
      <p>This is going off-topic, but look at what I recently observed in a Vodafone store:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/IMAG3673_4667.jpg"></div><p></p>
      <p>I informed one of the workers about the mistake and she giggled and responded "I didn't do that". Obviously not, but could you at least report it to your manager? I don't necessarily need to get it fixed, but I can't stand the fact that no one reports these mistakes so they often go largely unnoticed by most people. With the upside-down apostrophe though, I'm sure most people will feel there is something off about it. Certainly if they compare it to the apostrophe on the left wall of the store, which is the right side up.</p>
      </div>
