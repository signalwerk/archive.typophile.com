  - id: 595964
    user: 52182
    date: 2014-12-19T17:58:00
    date_raw: 19 Dec 2014 — 5:58pm
    votes: null
    html: |-
      <div class="comment-spam-body"><p>I don't understand how people can do a serious job and not care at all about the quality. I have higher expectations of people who work with type every day. I don't know how long the guy who put the apostrophe upside-down in the Vodafone store has been applying lettering, but if you can't get this right, perhaps it's not the job for you. I know I'm a perfectionist, which tends to frustrate a lot of people, but it infuriates me when people just don't care.</p>
      <p>A while ago I was following a lecture and I noticed the guy in front of me was designing some kind of advertisement on his laptop and I saw he used hyphens where he should be using dashes. I told him he was using the wrong glyphs and told him how to type the en-dash. He gave me 5 seconds to communicate that information and when he still didn't get it to work within those 5 seconds, he told me "Never mind that". What the hell? I'm really suppressing an urge to type in all-caps here! He wants to be a graphic designer; he should care! If someone points out a mistake to me, I make sure to acknowledge it and learn from it. I don't give up after seconds and tell myself it's not important. If I didn't know about the correct use, I probably don't have any insight on how important it is anyway. But either way, importance shouldn't be a consideration. You should do it right, even if you're the only one in the world who will notice. At least respect yourself as a designer. If you don't care, don't expect me to take you seriously.</p>
      </div>
