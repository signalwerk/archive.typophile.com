  html: |-
    <p>Hello everyone, Just joined this wonderful site because I really am becoming a Typophile...<br>
    Literally spent mostly every waking moment this weekend downloading, buying, trying, discovering, making, testing, and learning about font. I am starting to dream in type! Gotta space out my passions.. Losing time for Graphic Design, and Web Design.. </p>
    <p>But anyway, I am curious. Is it just me? or does Typophile only use Helvetica as its Typeface? </p>
    <p>I know Helvetica is an amazing font, and perfect for easy reading and easy on the eyes, but you would think there would be more implementation of other typefaces in a sleek show of how typography can make any design amazing. </p>
    <p>eh, I guess thats enough of my discussion for now. I could go on about much more, but its totally unrelated to the topic at hand, so I will save those thoughts for another time. </p>
    <p>Take care everyone. Glad I could have become part of this wonderful site.</p>
