    html: |-
      <p>@ frode frank</p>
      <blockquote><p>Remember neither Linux nor Mac OSX use font hints to render type.</p></blockquote>
      <p>From wikipedia:</p>
      <blockquote><p>The open-source FreeType 2 font rendering engine uses an auto-hinter when such hinting data is not present or its use is restricted by a software patent.[2] As of 2011, the FreeType website states that the relevant font hinting patents have now all expired, and TrueType is now enabled in FreeType by default.[2]</p></blockquote>
      <p>So it seems that FreeType under Linux supports TrueType hinting. Most Linux distributions, however, ships with OpenType(CFF) fonts, and enable autohint by default.</p>
      <p>It is also worth noting that the Ubuntu font family, the branding font of Ubuntu Linux, is a TTF font, and is hinted manually.</p>
