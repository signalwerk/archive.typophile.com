    html: |-
      <p>@Té Rowan<br>
      cool, Thanks for showing me that. That's a pretty cool way. Maybe there is something there that I dont already have in my collection.<br>
      But what I did that was even easier for me personally, I Triple Boot Windows 7, Fedora 16, and my pride and Joy, Red Hat Enterprise Linux. For various reasons of coarse.  Now I have a 32bg USB flash drive that basically holds ALL my work, my designs, my Photoshop files, FontLab files, Fonts, Web Designs, templates, Javascript frameworks, stock images, vectors, brushes, etc. Literally everything I could need in the designing world. And I always am expanding it daily.<br>
      So I just went into my Windows Directory from Linux, and went to the font folder and copied all the font files onto my USB drive. Giving me the ability to install any of my windows 7 fonts on any of my linux boxes, at will. That being said, I only really installed a couple. because personally I like Linux's fonts much better. The anti-aliasing is so much better, a really nice selection of Sans, slabs, and surprisingly for my taste, a couple serifs.<br>
      I didn't install all of them, because I really dont need them all. my Windows partition is 350gb, my Fedora partition is a mere 10gb. And I do EVERYTHING on fedora, so I can get away with that small space. So I just prefer not to clog it all up with semi-decent win fonts.</p>
      <p>Plus I am a big open source contributor, supporter, and believer. So I really like open fonts, mainly SIL's Open Font Licensing. Like FontSquirrel.com for example. Wonderful collection of all FREE for Commercial use fonts. </p>
      <p>@frode frank, &amp; hrant<br>
      Yeah Georgia is pretty nice, but Idk, I think Helvetica has to be one of the nicest Serifs for body text. Georgia seems idk... so... playful? Un-serious? something along those lines? Like something that would be used for "guitar-tabs" if it was monospaced.<br>
      While Helvetica, seems so smooth, to the point, and down to business. </p>
      <p>But Frode frank,<br>
      What makes you say that Typographic designers are proud of only Print/Desktop fonts, and could care less about web font standards?<br>
      There are TONS of Type Foundries, and Designers that are all about web fonts.<br>
      Plus its a rising field, in the industry, so eventually its going to be pretty standard right along side Print and Desktop standards. Try to think 5-10 years ahead. Even Now 60%+ are on the internet these days, with the website domains growing in Epic proportions in a mere 25+ years.<br>
      I really think web-fonts are going to be a big industry in the type design field. Its nearly fully implemented as W3C Web Standards, with a whole new font format "Web Open Font Format (.woff)" being born from it. Finally web designers can finally show a creative typographic side instead of being stuck with a mere 12-15 basic fonts to choose from. Now the possibilities will be endless. And who knows, maybe a whole new style of type will spawn from it.</p>
      <p>I dont know, maybe when its fully implemented using .woff, we will see Typophile's true siding on using web fonts. </p>
      <p>OH I guess what may add to my liking of Helvetica, may be because of the SUPERIOR font smoothing I get on Linux. The smoothing is SOOO Nice..<br>
      I literally cant stand being on my windows system for the harshness of the font alone... Not to mention Internet Explorer! Even worse!!! Literally no font smoothing occures in it at all.. Its a bit pathetic on microsofts part. Apple, and Linux are beyond belief with their font-smoothing/anti-aliasing, and microsoft even with their "cleartype option" is nearly useless.<br>
      So I guess that my atributte to my liking for Helvetica.<br>
      Since I checked out Erik Spiekers blog seeing the first post saying "Why Helvetica Sucks!!" and seeing his image of Helvetica rendered at small sizes, and yeah it looks pretty bad, but on linux right now, its being rendered at the same pixel size as his image, and it looks fantastic. so it must be because of the font smoothing of linux in general.. So yeah if I was on windows or reading this in print, I guess I would also side with Georgia..</p>
