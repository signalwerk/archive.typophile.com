      <p>There's certainly been an increase in quality among free/open fonts, but the best ones are still not free - not even cheap; so you could sometimes get decent results with free fonts, but you can almost never get great results without spending the necessary money. BTW your darling Helvetica (which to me only looks acceptable when set very large in the lightest weights) is certainly not free. Also, you should know better than to evaluate an outline font mostly by its rendering at small sizes onscreen.</p>
