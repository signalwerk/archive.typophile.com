      <p><em>How come the biggest Typographic Forum on the Net is using such basic font styles?</em></p>
      <p>A rats nest, but the (sad) truth is web fonts are here because of popular demand from customers.  Sad, because we are proud of the high standards of our print/desktop fonts and couldn’t care less about the standard of our web fonts. Same thing happened with desktop publishing: type went digital by the path of least resistance. It’s not a conspiracy, but I’ll glady applaud those who dare to go the extra mile. </p>
      <p>For now, text <em>all</em> user are supposed to <em>read</em>, even if they use older Windows machines, needs more attention than the type industry cares (or affords) to give it. Georgia is still miles ahead.</p>
