      <p>Font rendering, including anti-aliasing, has nothing to do with the fonts themselves, but is strictly a function of the operating environment: Operating system, font rendering agent, printer drivers, and monitor. I was also under the impression that there is nothing unique about fonts that can be used in Linux - don't they use the same Truetype fonts available for Windows or MacOSX and conversely, can't any font used in Linux be used in Windows?</p>
