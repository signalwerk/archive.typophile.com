      <p>Its kind of a curious thing though, Considering Helvetica isnt free, I wonder why it is shipped with Fedora, a free and open distribution.  It wouldn't surprise me though, considering its a Red Hat Project, they are top of the paid linux industry, so I dont see why they wouldn't through a 29$ font in, I guess.. ? Just strange its kind of against the whole "Open/Free" Aspect.</p>
