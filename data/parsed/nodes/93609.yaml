    html: |-
      <p>aha, okay. I gotcha now. didnt even realize that image you uploaded. Just thought it was some random output of my first post, as if that is how this forum works.. lol. First post, so I just assumed. </p>
      <p>I definitely appreciate the Helvetica WAY more than the Georgia though.. Thats cool though.</p>
      <p>But even then, that still follows my main point.. How come the biggest Typographic Forum on the Net is using such basic font styles?<br>
      Could always use @font-face, and make it beautiful. It works in all modern browsers if using the multiple font formats, and soon .woff will be the standard format for all browsers in not too long.<br>
      but there is always Cufon, Google Web Fonts, sRIF, tons of Image embedding, tons of other Jquery/JS libraries and tools for embedding actual fonts no matter what is on the default system. AND even better yet, all the AWESOME typography Jquery/JS framework/CSS3 effects, to optimize even more on already awesome embedded fonts. Like iKern.js, Lettering.js, kerning.js, fittext.js, fontdetect.js, slabtext.js, typeface.js, textualizer.js, and on and on and on! ;)</p>
      <p>I was just curious if there was a reason for Typophile to be using the old skool basic CSS1/2 font-family rule, and nothing more. </p>
      <p>Maybe because Typophile doesnt want to "pick favorites" with designers? or maybe simply for simple rendering to focus on content more than image, as image being over-rated? or something along those lines.. ? </p>
      <p>Just wanted feedback on peoples thoughts here. Anyone else think they should customize and beautify? or do you guys think it should stay the same? </p>
      <p>Dont get me wrong, lol, I am in NO way trying to suggest this idea or anything, its just something that sprung up in my mind as soon as I joined. Ive been checking out other sites fonts all day, so as soon as I saw typophile is still system default style, I was curious as to why?<br>
      But like I said I am definitely not trying to suggest this idea, not like I just joined and trying to get this forum to change because I suggested it... ha, trust me I dont mean it that way.. So dont get me wrong fellas. </p>
      <p>Share your thoughts folks. </p>
      <p>PS: gonna change my thread title from "Is Typophile only using Helvetica" to "Why is Typophile still using the basic Font-Family CSS rule" (unless I can think of better I guess..)</p>
      <p>Peace and Love</p>
