      <p><em>What makes you say that Typographic designers are proud of only Print/Desktop fonts, and could care less about web font standards?</em></p>
      <p>Almost no-one are designing for the medium. And by that I don’t mean hinting exclusively. (Remember neither Linux nor Mac OSX use font hints to render type.) Most just auto-convert their print stuff, waiting for hi-res displays. I too believe web fonts is going to be big — in fact I think it already is. </p>
      <p><em>Yeah Georgia is pretty nice, but Idk, I think Helvetica has to be one of the nicest Serifs for body text. Georgia seems idk... so... playful? Un-serious? something along those lines? Like something that would be used for "guitar-tabs" if it was monospaced.<br>
      While Helvetica, seems so smooth, to the point, and down to business. </em></p>
      <p>One can’t argue with personal taste :) Just make sure you steer by more than just taste if you want to be a graphic designer.</p>
