      <p>This is a unique thread. Were burning through 4-5 different topics. Its just branching and branching. ;D</p>
      <p>@mikemai2awesome<br>
      Thanks man. Good point! Exactly the type of answers I was looking for.<br>
      As for the @font-face exposing problem. There are ways to prevent this. You can make the file only accessible when rendered server-side. You can always prevent downloading of any file. And you could always edit your .htaccess file and prevent that file from ever being used except for its exact purpose. Say someone put the font name after the address, for example: "typophile.com/kabel.ttf "  "typophile.com/kabel.woff" etc. You could have your .htaccess file automatically redirect that person to a 404 or 501 error page.<br>
      Also another way I have seen people prevent downloading their paid font files is by naming it a random hash that is too long for a browser URL search.  Using random numbers, letters, etc. Ive seen sites name their font using over 200 characters (may be overkill of coarse) and if you try to tack that name on the end of the site address URL, you will get an error saying that the URL string is too long.<br>
      And their is always server-side encrypted gzip-ing. among other things of coarse. I am sure their are many. Those are just the simple ones I know of. </p>
      <p>BUT, just like Frank mentioned, "not talking about fancier fonts".<br>
      I know I did kind of word it that way latter in the thread, that using CSS techniques you could "spice" this place up a bit.  I was just curious as to why the site is using such basic old school standards, these days. </p>
      <p>And yeah that makes sense, like you said, It isnt a showcase, its a forum. and yeah thats true, that fits with what I said earlier, about "content being more important than image".</p>
      <p>So good point sir. </p>
      <p>By the way, a bit off topic, but almost everything is in this thread.<br>
      Can anyone tell that my profile picture is a Vector image made in illustrator? or does it just look like a picture that was distorted by scaling? I guess I should change it, cuz it looks kind of funny. It would be cooler if the profile images were near 150x150 or something.  Sorry for the OTD, it was bugging me.</p>
