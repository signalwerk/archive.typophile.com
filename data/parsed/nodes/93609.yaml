      <p>I think fancy display fonts could be considered for the headings, there are many alternatives to using @font-face such as Fonts.com Webfonts, Typekit, and Google Webfonts. The downside of using @font-face is that you are exposing the source font files in the CSS, you might be unintentionally breaking the font licensing agreements. So it's much more safe and hassle-free to use a hosted service for custom fonts.</p>
      <p>Back to the topic of "should Typophile use fancier custom fonts?", for the purpose of the forum, I don't see the necessity of doing so. Keep in mind, any fonts you use other than the basic web safe fonts are gonna require more scripts running which directly affects the performance of the site. I understand this is a typography site but it is also a forum, not a showcase. While it would be nice to use custom fonts but I don't see it being necessary.</p>
