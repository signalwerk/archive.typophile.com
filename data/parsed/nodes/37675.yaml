    <p>Hi folks,</p>
    <p>I’m a student at the designschool in Copenhagen and I’m doing a assignment on types.</p>
    <p>What I want to do is draw a typeface build from element as you see in the img. The idea is based on different elements like corners which I can copy/paiste and hereby quickly create a new type-expression. The basic idea is inspired by things created in the Bauhaus periods and other who work systematic and so on...</p>
    <p>I’m curious to hear what other typedesigners have of comments and if there is anything I should look into - while doing this type, that could help me in skipping steps (due to I’m new in typedesigning).</p>
    <p>Hope to from all of you designere.</p>
    <p>Have great day.</p><div class="imageWrap"><img src="http://typophile.com/files/O_5268.jpg"></div><p></p>
