    html: |-
      <p>Drawing a path and applying a stroke is the way to make flourishes in a drawing program, whether Illustrator or FontLab; apply contrast by dragging extrema points.</p>
      <p>To figure out the shape of the swirls, it may help to study old calligraphy specimens and practice drawing the shapes with an ink pen; this is because soon after you've started a flourish, you have to start leaving gaps for later passes of its one long stroke, which requires enough "muscle memory" familiarity with the flourishes to think ahead.</p>
    html_clean: |-
