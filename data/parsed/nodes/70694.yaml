    <p>Hello everyone!<br>
    I'm really in love with all  <a class="freelinking external" href="http://jessicahische.com" rel="nofollow">Jessica Hische</a>  lettering works!<br>
    Are they all custom made/handmade vector type?<br>
    Is there any specific technique or Illustrator tool that help us to make something like this?<br>
    Any tips for the "swirly" and "curly" decorations?</p>
    <p>Thank you so much in advance!</p>
    <p>Bye :)</p>
