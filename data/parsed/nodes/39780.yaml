    <p>Apparently I am not going to use some manage software for my font.</p>
    <p>Now I am weighing cons and pros.</p>
    <p>Each way has its advantages, and I have to choose one, but one thing is clear that not every font has a foundry. Those free fonts are hard to trace its origins I guess.</p>
    <p>Any idea?</p>
