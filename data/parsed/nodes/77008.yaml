    html: <p>At the print shops I've worked for, "digital printing" refers to what is a glorified laser printer. Powdered plastic toner (in CMYK) goes on the paper, and gets fused down, no worrying about set-off. I've never seen a digital that can do spot colors (and orange, by the way, it pretty much impossible to get right. It's always muddy.) As mentioned above, there are inkjets that can do certain spot colors, though I don't know if there's any high quantity producing inkjets out there. (The places I've worked only used them for proofing or very limited, wide-format runs. I suspect it would be awfully expensive.</p>
