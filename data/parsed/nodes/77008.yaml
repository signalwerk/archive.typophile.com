      <p>&gt; with the right offset press and operator<br>
      &gt; you should never see any offset</p>
      <p>I agree, I've had many jobs printed via offset printing on glossy stock with no varnish and have never had a problem with set-off (unwanted ink transfer).  </p>
      <p>As Nick said, the conversion to 4-color process may cause shifting of some colors, and printing in individual flat colors will always give superior results in that respect, but with 16 separate colors that would be prohibitively expensive.  Years ago cards were seldom printed via 4-color process, but today we're seeing many more logos with multiple colors, gradations, etc and 4-color cards are much more common. </p>
      <p>Just pick a good-quality print shop.</p>
