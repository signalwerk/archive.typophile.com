    html: |-
      <p>Offsetting if the process of printing (offsetting) from a plate onto a rubber blanket and then printing from the ink on that blanket rather than directly from the plate. It increases plate life and makes for a crisper print.</p>
      <p>You can offset any kind of printing plate, it doesn't need to be litho, but 99.9% of the time in 2010 people talking about offset printing will be referring to offset litho.</p>
      <p>Printing on <em>coated</em> stock without an additional coating makes for problems offsetting, but an experienced pressman should be able to avoid these. Printing uncoated stock should yield no problems with offsetting between cards. I would perhaps try another shop.</p>
      <p>Do you know if there are any large, solid areas of any of the process colours (black, cyan, magenta or yellow) on the cards?</p>
