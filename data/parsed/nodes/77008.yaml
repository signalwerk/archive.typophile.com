    html: |-
      <p>Hi Bendy,<br>
      without seeing the actual design all I can offer is broad advice.<br>
      First digital vs offest vs letterpress is almost  perfect in terms of quality low to high and price low to high.</p>
      <p>Digital is great for low numbers (use a Indigo press if you can find one locally). Offset litho is best value  when your talking sensible print numbers by this I mean 1000 - 2000 business cards. Letterpress while having the highest setup cost gives the most gorgeous finish and print quality but you pay for it, not only can you get great flat solid colour but you also get an amazing tactile finish (personal recommendation for letterpress in the UK is  Glasgow Press).</p>
      <p>Your problems with colour rubbing off is pretty common when you print solids in offset, especially when you use blues, the only real solution we have come across is to have them matt or gloss laminated, this solves the problem but doesn't always give the the finish your after. We've had this problems even with just a pure C covering at 100%. </p>
      <p>16 separate colours pose no problem for offest or digital, these can even be printed via letterpress with a little preparation.<br>
      For best quality you need to get a colour chart from your printer on the stock that your going to use, setting this up with gradations and colour wheels will give you the most accurate way of picking each colour.</p>
      <p>For letterpress take time to speak to the printer, be prepared to amend your design based on their recommendations  for best results.</p>
      <p>For most vibrant colours look to specify spot pantones/hexachromes, you can even specify  4 colour process using pantones (bit pricey though).  As far as I am aware digital print, even the HP indigos, use 4 colour process + additional colours, you can't specify pantones rather they simulate them.</p>
      <p>The single best bit of advice is to speak to your printer and let him know what you want to do, they have the knowledge. Speak to local design studios, they will let you know the best local printers, bear in mind good printers are never the cheapest and you will have to book your work in possibly weeks in advance.</p>
      <p>If your after quality you need to move away from digital and on to litho, screen printing and letterpress.<br>
      Digital while fantastically versatile is not quite there yet in terms of quality.</p>
      <p>cheers<br>
      Martin</p>
