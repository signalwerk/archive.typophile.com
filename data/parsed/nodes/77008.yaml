      <p>I do not think digital printers are outfitted to print spot inks, but many of them are designed to print with processes that extend past four colour process, i.e. they would have 6 or 8 inks to simulate a full range of colours instead of four. Many incorporate secondary ink colours like orange, purple and green so that the screening that is done is less apparent, only when trying to achieve tertiary colours.</p>
      <p>I could be wrong about the spot colour thing, though. There are lots of different kinds of digital printers/presses nowadays. Especially when it comes to digital, I would call around everywhere you can to get samples.</p>
