    html: |-
      <p>We run two HP Indigo digital presses at the company I work for.</p>
      <p>Contrary to the comments above, they can run Pantone spot colours.  Our presses run CMYK wet ink plus up to two additional Pantone spot colours.  Alternatively they can be set to run 'Indichrome' as 6-colours CMYK plus Orange and Violet.  They can even be configured to run up to seven colours.</p>
      <p>We have a really bright green (Pantone 368C) installed on the press as one of our clients uses it extensively and by running the spot colour we can achieve a very bright clean colour and also run 2-colour (Black and Green) jobs as well.</p>
      <p>The only drawback is the Pantone colours have to be ordered in pre-mixed and installed into the press, which isn't cheap.  So wouldn't be cost effective for just one run of business cards.</p>
