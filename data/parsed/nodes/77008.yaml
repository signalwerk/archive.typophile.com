    <p>I've been disappointed with various ways we've had business cards printed, but I'm not well versed in printing techniques...</p>
    <p>The high street print shops have only standard options, which all look a bit cheap...and also they're not usually very environmentally minded. </p>
    <p>Local print houses have generally done a better job but we have always had digital print. One problem here has been 'set-off' — where the ink on one card transfers onto the back of the one on top. This is a particular problem because our business cards have block colour on the reverse. I don't especially want to put a coating/laminate on the card.</p>
    <p>I'm wondering about going offset (following Nina's super example <a href="http://www.typophile.com/node/70275" rel="nofollow">here</a>) but we have a 16-colour logo so I'm not sure if that's going to work! I really want to get the best results...price is not really so much of an issue.</p>
    <p>I'm based in the UK's Southeast in case anyone knows a good local press.</p>
    <p>Thanks :)</p>
