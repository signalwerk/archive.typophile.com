      <p><em>They said "the ink never really dries actually".</em></p>
      <p>That really depends on the total coverage: anything more than 240% (e.g., 60%C 60%M 60%Y 60%K) WILL take forever to dry, even if you're on a large press that has uses anti-offset spray powder. If your printer is having offset problems with 100% coverage (C90_M10), you need to find a new printer.</p>
