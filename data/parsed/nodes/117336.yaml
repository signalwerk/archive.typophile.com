    html: <p>Can't find a perfect match. That's something close to <a class="freelinking external" href="http://www.myfonts.com/search/din+condensed" rel="nofollow">DIN Condensed</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/urw/engschrift" rel="nofollow">DIN Engschrift</a>, the main differences for these letters being on /R leg, /2 design and some angled cut finials. For what it's worth, I'd probably start with <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/garage-gothic" rel="nofollow">Garage Gothic</a>, possibly the less work to get close of this lettering.</p>
