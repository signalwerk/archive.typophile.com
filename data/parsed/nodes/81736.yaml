    <p>Good afternoon fellow Typophiles,<br>
    I'm slated to design a multi-page PDF for our new venture in Singapore. This is going to be printed by various individuals so I need to know what the standard paper-size is. I'd image it is A4 but I'd like to confirm. Does anyone have some insight?</p>
