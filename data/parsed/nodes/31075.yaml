    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 1.Feb.2007 11.54am </div>
      <p>ANNOUNCING BURBANK, WHERE TYPOGRAPHY MEETS ANIMATION</p>
    <p>Back in the prehistoric period before 2007, animated typefaces<br>
    tended to be drawn as single stand-alone fonts. They rarely had<br>
    relatives and scarcely had a supporting cast, causing<br>
    short-sighted typesetters to seldom use them for much more than<br>
    featherbrained frivolity. Enter Burbank, a coordinated collection<br>
    of 20 fonts, hand hewn to handle tasks from big to small, wide to<br>
    condensed, light to black and countless styles in between. Burbank<br>
    is ready for anything from hyperbolic headlines on outdoor<br>
    billboards and in major magazines to miniscule matters in tiny<br>
    classified advertisements. Buy it now!</p>
    <p><a href="http://www.houseind.com/" title="http://www.houseind.com/">http://www.houseind.com/</a></p>
    <p>______________________________________________________________</p>
    <p>ALEXANDER GIRARD ALPHABLOCK COLLECTION AVAILABLE NOW</p>
    <p>Check out our new Alexander Girard Alphablock Collection, a set of<br>
    28 wood blocks featuring alphabets and graphics that pay tribute<br>
    to the renowned mid-century designer.</p>
    <p><a href="http://www.houseind.com/girard" title="http://www.houseind.com/girard">http://www.houseind.com/girard</a></p>
    <p>Inspired by Girard’s work and its lasting influence, we’re<br>
    developing a collection of typestyles and graphics that will be<br>
    released in Spring 2007 as the Alexander Girard Font Collection.</p>
