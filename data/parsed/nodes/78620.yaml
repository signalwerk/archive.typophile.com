      <p>I think the logo in the example is, however, a hybrid three-dimensional effect. First, the letters away from the center are stretched to compensate for foreshortening, and then they're placed on a curved surface with perspective.</p>
      <p>That may require the use of a program with 3D modeling capabilities.</p>
