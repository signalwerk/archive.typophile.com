    <p>Anyone have any tips for creating a logotype in a similar vein to the attached?</p>
    <p>I know that it will take a lot of extra tweaking, question is will it take so much tweaking that I'd be better off starting lettering from scratch and not from a font?</p>
    <p>Not sure it is something that quick Adobe Illustrator techniques will provide a work around for and I'd like to do a thorough job, informed by some kind of strategy. I considered using some kind of 3d program, bending the text on a curved wall and flattening the image to aid my imagination on how the letters are deformed.</p>
    <p>I'd like to know what steps are involved so that I can inform the client.</p>
    <p>(Is this something that Cabagra covers in his Lettering, Logo, and Font Bible? If someone can point to a specific entry in the book I'll gladly buy it).</p>
    <p>Thanks team. Go Knicks!</p>
