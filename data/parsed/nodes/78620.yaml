    html: |-
      <p>I have CS3. AFIK, the Effects &gt; Warp is the way Illustrator handles Envelopes, and the options are limited, whereas CorelDraw's Envelope function allows complete user control over the finished product, rather than trying to force you to choose among preset options.</p>
      <p>As far as Cabarga's book is concerned, go for cheap (used copies may be available at alibris.com or abebooks.com). Some of the information is useful, but a lot of it is out of date, ca. 2011.</p>
