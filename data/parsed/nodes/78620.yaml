    html: |-
      <p>This would be my approach - 100% Illustrator, no 3D software required.</p>
      <p>First, let's agree that the arch distortion below and above the text are equal.</p>
      <p><a href="http://i.imgur.com/defxo.png" title="http://i.imgur.com/defxo.png">http://i.imgur.com/defxo.png</a></p>
      <p>I approximated Clarendon Bold off the top of my head as a close visual match. Curving the type will squeeze the x-height (as I will demonstrate in the next few steps), but we can remedy that with a slight tweak.</p>
      <p><a href="http://i.imgur.com/0qNy1.png" title="http://i.imgur.com/0qNy1.png">http://i.imgur.com/0qNy1.png</a></p>
      <p>Extending the height of our type to match the min. and max. height of the logotype helps compensate for the size reduction in the middle characters after we apply our bulge. </p>
      <p><a href="http://i.imgur.com/Bd8k5.png" title="http://i.imgur.com/Bd8k5.png">http://i.imgur.com/Bd8k5.png</a></p>
      <p>So now that we have our nice, tall text...</p>
      <p><a href="http://i.imgur.com/rBHuj.png" title="http://i.imgur.com/rBHuj.png">http://i.imgur.com/rBHuj.png</a></p>
      <p>let's jump into  Illustrator Effects&gt;Warp&gt;Bulge.</p>
      <p><a href="http://i.imgur.com/ESvIO.png" title="http://i.imgur.com/ESvIO.png">http://i.imgur.com/ESvIO.png</a></p>
      <p>Tweak your settings. I like to overlay my text so I can get visual confirmation that I did it right.</p>
      <p><a href="http://i.imgur.com/01Da4.png" title="http://i.imgur.com/01Da4.png">http://i.imgur.com/01Da4.png</a></p>
      <p>And with that, voila!</p>
      <p><a href="http://i.imgur.com/Ds7w8.png" title="http://i.imgur.com/Ds7w8.png">http://i.imgur.com/Ds7w8.png</a></p>
      <p>100% Illustrator.</p>
    html_clean: |-
