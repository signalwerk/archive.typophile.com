    html: <p>'Gothic' was used as early as 1863 by the Miller &amp; Richard foundry (British) to describe sanserif types. Why the American founders adopted 'gothic' over the more dominant 'grotesque' is not too clear. You can find out more about this topic in Appendix II of James Mosley's book <i>The Nymph and The Grot</i>. </p>
