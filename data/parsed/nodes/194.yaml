  html: <p>I posted the following question as an aside to another thread. But now I want to bring it to the fore and see if I can get an accurate explanation - <br> <br><i>I've been bouncing the word gothic around in my mind lately and have never been able to reconcile 'gothic' fonts with what my idea of gothic should be. I always want to say gothic when I'm thinking of fonts that look goth-ish(?). Why is that?</i> <br> <br>Why is it that whenver I hear the word Gothic in relation to fonts I think of something that's more like a Tuscan? <br> <br>Anyone?</p>
