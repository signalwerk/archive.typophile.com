    html: "<p>Synopsis: <br> <br>The word 'Gothic' in typographic terms has evolved to have a different meaning from architectural terms. (This is what led to my initial confusion.) <br> <br>Furthermore, the statement 'gothic typeface = sans-serif typeface' is not accurate. Gothic is one type of sans - sans that are more architectonic in form and have a more vertical thrust(more condensed feel) than grotesk. The word gothic fell to these letterforms because they had their origin in Gothic (German) Europe. <br> <br>Is that about right? Thanks. <br>Tom</p>"
