    html: '<p>I think the "gothic" tag was also commonly given in the U.S. to what were called "grotesk," "grotesque," or "antique" in Europe. Hence: Franklin Gothic, News Gothic, Trade Gothic, Tourist Gothic, Avant Garde Gothic, etc. Not sure why this was, though.</p>'
