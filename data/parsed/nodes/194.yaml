    html: <p>In the early 19th century, what we now call sans-serif typefaces were introduced.  They were considered by some to be crude and ugly, compared to traditional serif faces, and so were labeled "gothic."  This meaning of gothic is no longer current, of course, but it survives (if memories from my college art history class are correct) in the term "gothic architecture"--so called by people in the Renaissance who disliked the older style.  Neither has anything in particular to do with the Goths, except that they were considered barbaric by the "civilized" Romans whose empire they invaded.</p>
    html_clean: <p>In the early 19th century, what we now call sans-serif typefaces were introduced.  They were considered by some to be crude and ugly, compared to traditional serif faces, and so were labeled "gothic."  This meaning of gothic is no longer current, of course, but it survives (if memories from my college art history class are correct) in the term "gothic architecture"--so called by people in the Renaissance who disliked the older style.  Neither has anything in particular to do with the Goths, except that they were considered barbaric by the "civilized" Romans whose empire they invaded.</p>
