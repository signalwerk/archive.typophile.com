    html: <p>Actually, I was under the impression that "Grotesk" was the label given to the first sans-serif typefaces, the category that includes faces like Akzidenz Grotesk and Helvetica. Grotesks were basically just Egyptian faces with the serifs lobbed off, and people thought this looked odd (grotesque). <br> <br>Gothic faces, on the other hand, derive their appelation from Gothic hand script, which first developed in German (Gothic) Europe. Gothic script diverged from other rounded letterforms, making the sides of all letters (even round letters) straight. Modern Gothic sans serif fonts keep much of the structure of the Gothic hand script, including straight-sided letters. DIN is a good example of a Gothic sans.  <br> <br>Because many sans are Gothic, the term has sometimes been misunderstood to designate all sans typefaces, but this is incorrect. <br> <br>This is how I understand it.  I could be wrong. <br> <br>Paul</p>
    html_clean: <p>Actually, I was under the impression that "Grotesk" was the label given to the first sans-serif typefaces, the category that includes faces like Akzidenz Grotesk and Helvetica. Grotesks were basically just Egyptian faces with the serifs lobbed off, and people thought this looked odd (grotesque). <br> <br>Gothic faces, on the other hand, derive their appelation from Gothic hand script, which first developed in German (Gothic) Europe. Gothic script diverged from other rounded letterforms, making the sides of all letters (even round letters) straight. Modern Gothic sans serif fonts keep much of the structure of the Gothic hand script, including straight-sided letters. DIN is a good example of a Gothic sans.  <br> <br>Because many sans are Gothic, the term has sometimes been misunderstood to designate all sans typefaces, but this is incorrect. <br> <br>This is how I understand it.  I could be wrong. <br> <br>Paul</p>
