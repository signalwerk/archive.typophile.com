      <p>Hey Nick,</p>
      <p>Just checking Pacella Black Italic, very nice, although I’m definately fond of the spacing I’ve “achieved” with the Century. I would’ve been happier had I actually set these on a press / phototypositor and achieved the effect, notching up a slider bar in Illustrator doesn’t really constitute getting my hands even remotely dirty! For someone who doesn’t really like current trends in using random abstract arbitrary ’clutter’ as an illustrative tool (paint splats and composites of scratchy lines), I should steer clear of the above effect - I’d like to understand why I like it first, what it’s doing to the letters and why it works for me...Ideally.</p>
      <p>Forgive me if I’ve misunderstood - In this arena I’m amateurish at best.</p>
      <p>Intresting stuff Nick. Thanks...</p>
