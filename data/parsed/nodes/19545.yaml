    <p>Good morning or evening, depending on your orientation (It’s morning for me, in an overcast region of East London...)</p>
    <p>I’ve started playing with a type logo for a very painty portfolio. I’m going with type to offset the hand-drawn-ness of the rest of the site. However, I’m worried that I’m commiting some horrid typographic faux pas. Basically...</p>
    <p>...Is it “ok” to massively distort text by ramping up the stroke weights until you’ve made a monster of what was a simple and elegant character, is it looked down on? It seems like such an easy thing to do, and some of the results, having messed with other faces looked pretty nice. I don’t like the idea of it though, it’s such an out-of-the-box conclusion...</p>
    <p>I rather like the results, but it feels wierd to have mutated the text so much. The main text is Century Old Style (5pt) &amp; the numeral ’1’ is Letter Gothic (20pt).</p>
    <p>Your thoughts would be interesting (forgive me if the real faux pas is having very little experience with type and asking a silly question ;)    </p>
    <p>Kind regards,</p>
    <p>P </p>
    <p>LOGO&gt;&gt;&gt;<br>
