      <p>Peter, this broad effect has already been done in typefaces, eg ITC Pacella, with a polished typographic finish.<br>
      It was an effect that could be achieved photographically (a “mod”) with the phototypositor machine c.1970, and that is probably what gave the inspiration to Mr Pacella.<br>
      So in sense, you have committed a faux pas, because back in the day they would have cleaned up their artwork, and set it looser to begin with, so that the overlapping didn’t occur.</p>
      <p>However, there is a lot of typographic progress that has resulted when one generation’s artefacts become the next’s rasion d’etre. That kind of thing was a large part of David Carson’s working method. </p>
      <p>And we’ve had the de-skilling of art in recent years, which has happened in design too, so that work which is TOO slick is the faux pas.</p>
      <p>I would say, if you got your hands dirty (so to speak) and did the work yourself and experimented till you got a result that clicks for you (not to mention the client...), no worries.</p>
