      <p>This title is misleading...I was hoping for something more interesting. The problem probably somehow relates to the company using both versions of the same fonts. You can always use features like File &gt; Package... to see what fonts the document is using as well as collecting them out. </p>
      <p>More importantly, do Britons think that Tobias Frere-Jones' Interstate should be called Dual Carriageway? Come to think of it, what font do UK highway signs use...? Gill Sans? I suppose I could look it up...</p>
