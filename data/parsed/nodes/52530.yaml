    <p>Hi there,</p>
    <p>Newbie on here and after some pretty specific advice as I'm pretty baffled.</p>
    <p>Long story short, I work for an American company in the UK. I get and back-up work to a US based server. All of my fonts are owned by the company in the US and emailed over / downloaded from the States, so are the same fonts used by my American colleagues.</p>
    <p>We're all running CS4 on OS 10.4 or later.</p>
    <p>Now, here's the catch: when I open a document in InDesign from the American server, the fonts (normally Helvetica Neue or Gotham, both OTF) are appearing as the same font but as a T1 version, which means that I have to convert all the fonts back to OTF even though technically they should already be the same. We've had this issue in all of the Creative Suite as well as opening them up on PC here in the UK as well, and it seems to happen in any document, no matter what version of CS it was created in.</p>
    <p>I'm running out of ideas now and although it's not a major problem converting the fonts, it is a little annoying and certainly adds to potential for a cock-up somewhere down the line.</p>
    <p>All advice or ideas welcome, many thanks!</p>
