      <p>Thanks for the link Grrrben. As John Hudson stated at the end of that thread, negative tracking values have more tolerance before breaking the ligatures. So my workaround now is to increase the spacing within the font. This way it is possible to use negative values up to -44 (InDesign). It's a crutch, but at the moment I can live with that. It's a rather scrawly handdrawn font with capital letters only, so the wider standard spacing is not an issue.</p>
      <p>Thanks to you as well, Nick. Though, I tend to use the all caps feature in Indesign to get alternative combinations more quickly.<br>
      Speaking of quick access and convenience, does anyone know, whether there is easier access to Opentype features, especially stylistic sets, implemented in InDesign CS5? I have to muddle through three flyout menus to switch them on or off in my CS3 version.</p>
    html_clean: |-
