    html: <p>Most page layout programs allow for exceptions in their H&amp;J settings, but I doubt that you can program a font to write those exceptions to the dictionary. Also, it's doubtful that a font could be programmed to switch H&amp;J on and off at will. If the letter combinations are really that important, make them ligatures and be done with it. It may not be your ideal solution, but it's one that will work.</p>
