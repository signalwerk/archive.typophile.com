    html: |-
      <p>I'd like to revive this threat for I've experimented with position values in stylistic sets. For InDesign users, it would be possible to have a wider spacing by choosing stylistic set 17, which simply has the following code:</p>
      <p><code>feature ss17 {<br>
      position @ALL &lt;0 0 50 0&gt;;<br>
      } ss17;</code></p>
      <p>By further experiments with y values I came to some interesting results with dancing glyphs or uneven lines. Funny stuff to play with.<br>
      One irritating issue, though: when it comes to hyphenation, some stylistic sets with positional programmings cause a missing glyph right after a discretionary hyphen. “.notdef” is displayed then. I thought, I could at least leave out the visible shape in the .notdef slot and actually it hides (while still marked as missing glyph) in InDesign. But when printed to PDF, a quoteleft (‘) shows up after the hyphen. Could somebody figure out, what's wrong here. Maybe I'm missing an important modifier letter in my font or the like?</p>
