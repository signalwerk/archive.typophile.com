      <p>You could crank up "cpsp" to provide a generously letterspaced effect.<br>
      This feature is implemented by the "all caps" command, command-shift-k on Mac.<br>
      (If the user doesn't want it, the shift key and caps lock do not activate it.)<br>
      And of course, nobody ever letterspaces lower case...</p>
      <p>I haven't been able to test whether that would work, as I don't put "cpsp" in my fonts.</p>
