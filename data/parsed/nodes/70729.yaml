    html: |-
      <p>AFAIK, the ligature feature ceases to work when tracked out.</p>
      <p>This kind of behaviour in a layout application makes sense for Ligature features such as the traditional "fi", and for the original exegesis of Contextual Alternates as something for cursive scripts (IIRC Caflisch, released in 2001, was instrumental in establishing this concept).</p>
      <p>Now it's been grandfathered, and we're stuck with it, even if we want to use "calt" for pseudo-randomisation, where it would be appropriate to keep the effect operative whatever the tracking.</p>
      <p>There has been a "rand" feature defined for several years, but it is no use unless supported by Quark and InDesign, which it isn't.</p>
      <p>Shame, I've designed a couple of "pseudo-random" faces, and it's something that really interests me.</p>
      <p>Actually, not really "pseudo-random", but "pseudo-natural", or "non-repetitive".<br>
      That's because if the goal is to make digital type have the natural irregularities of letterpress printing or ink writing, randomly selecting the iteration of a character from a group of variant glyphs won't do that, as statistically there will be quite a few adjacent doublings.</p>
