    <p>Hello,</p>
    <p>I'm wondering, if there's any chance to prevent Indesign and other applications from breaking letter combinations when the tracking threshold is exceeded.<br>
    I've some kind of (faked) random opentype feature programming in the contextual alternates feature of my font. For it's not a script font and the letter combinations are not meant as ligatures, I'd like to deactivate this behavior in type setting applications, preferably by Opentype programming. I guess it's not possible, but maybe... Any suggestions?</p>
    <p>Alex</p>
