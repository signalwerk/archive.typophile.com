  html: |-
    <p>Hello everyone,</p>
    <p>In typography class, our teacher gave us the following assignment: use one of Bruce Mau's statements written down in his Incomplete Manifesto for Growth (<a href="http://www.brucemaudesign.com/manifesto.html" title="http://www.brucemaudesign.com/manifesto.html">http://www.brucemaudesign.com/manifesto.html</a>) into a poster.<br>
    It should be all based on typography, so no use of images.</p>
    <p>After some sketchwork (scissors&amp;paper), I tried to work things out in Illustrator.</p>
    <p>Does it work, do you think? And if so, what about position of the shapes, colour, size? Is there anything I could improve?</p>
