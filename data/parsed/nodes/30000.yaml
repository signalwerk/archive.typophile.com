      <p>just two quick things:<br>
      The space between the 3rd and the 4th seems to be smaller than the first few. The same goes for the space above the red text.<br>
      Also, you might want to move the "cut" a bit up/down for the first/last line so the "e" gets cut over right under/over the horizontal line.<br>
      Otherwise I think it looks good!</p>
