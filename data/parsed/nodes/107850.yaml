      <p><a class="freelinking external" href="http://www.linotype.com/158360/salut-family.html " rel="nofollow"> Salut</a> from Linotype is very similar to the image but there are some differences. If not lettering, then it may have been another foundry's version, name unknown. Linotype's version is true to the original metal from Klingspor, 1931; designed by H. Maehler. Source: Jaspert.</p>
      <p>Steffman's version appears to be the same as the Linotype version.</p>
