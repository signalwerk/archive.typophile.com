    html: |-
      <p>As noted in my edited post, thanks George for getting the correct reference.<br>
      On looking closely at the Der Spiegel cover I am almost certain it is lettering. Jaspert's _Type Encyclopaedia (1970)_ gives very little information, but this is sufficient to suggest it is probable that H. Maeher adapted the pre Great War lettering, either from the  cover or another source. As you say, the Linotype designer did a faithful digitization and Steffmann did a renamed pirated version.<br>
      Don</p>
