      <p>I'm not certain if the 1908 Spiegel cover is lettering or a typeface, and I do not have a name or designer.<br>
      There is a digital font that seems to be derived from the same source. It is Louisianne by Dieter Steffmann<br>
      [I deleted the rest of my post. Thanks George for spotting the digital source of Steffmann's font, i.e. Klingspors's Salut of 1931, as digitized by Linotype. I do not link to known pirated fonts.]<br>
      Don</p>
