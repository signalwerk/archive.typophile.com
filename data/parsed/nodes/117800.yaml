    html: |-
      <p>Space the apostrophe in a way that (i) without any kerning wouldn’t cause any ugly collisions and (ii) save you the most kerning work. In this case you space it relative to the ascenders (left and right) and kern the rest of the pairs. You will spend much less time kerning punctuation that sits on the baseline, as there is more symmetry at that height.</p>
      <p>I like what you did with the /y/ shape-wise. The terminal (not the diagonal) could be thicker. You’re almost done :•)</p>
    html_clean: |-
