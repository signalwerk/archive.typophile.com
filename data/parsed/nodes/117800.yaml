  - id: 582359
    user: 52182
    date: 2014-07-09T08:15:00
    date_raw: 9 Jul 2014 — 8:15am
    votes: null
    html: |-
      <p>All good points. I do want to give the open /g another try later.</p>
      <p>As for /t, I stumbled upon a small issue I didn't encounter before. I'm pretty happy with the combination of rounded and sharp lines in the bar of /f and I like how pronounced it is (as the serifs in this typeface are quite long as well) and I noticed how the bar in /f and /t are usually the same so I repeated that element. However, what worked for /f didn't quite work for /t. I shortened the left side of the bar and extended the right and tried to balance the apex of /t with the horizontal. At first I designed the apex to be long and squarish such as in Ruse but it didn't work. I think I just felt forced by the shape and length of the bar to make the apex less pronounced, more or less like Calluna.</p>
      <p>After your feedback I can see I overdid downplaying the apex, but the reason for this back story is to ask if you have encountered this "issue" where the bar on /f doesn't quite work for /t. I've looked at a few typefaces and I notice the bar is always the same. I personally feel type should be fluid and optical adjustments need to be made (just like I would never rotate a geometric /b to be a /q without making optical adjustments), but since Baran is a lot more rigid (equating to being less fluid) than Garamond for example, I don't quite know to which extent I should repeat elements or make them unique.</p>
      <p>I suppose this should be my own decision, but I can't really decide what will work better for Baran. Fluidity or rigidity? I think Baran feels a bit too rigid now. The alternate /e is an overcompensation but I feel like an ascending ear for /g is going to make the typeface less rigid already, which is good I think. I think it needs to be more dynamic. Romanée is a fairly good example of this combination of rigidity and fluidity.</p>
