      <p>Thanks a lot for the feedback. I will respond to each statement individually.</p>
      <p>e — I actually added more weight to the left side and a tiny bit to the bottom and top right side of /e already but I forgot to update it in the font.<br>
      f — Okay, this is one of those areas where I'm probably not quite as confident as a type designer yet as I should be. I consciously made the top thinner to have a bit more of excitement going on in the typeface. Now and then I see a typeface with a few letters which are a bit off and thus demand attention; some might say it's obtrusive but I often think it demands just enough attention in a good way. I wish I could remember the names of a few of these typefaces. I can't find it in my collection either. I recently stumbled upon a geometric sans here on Typophile for a big fashion brand but I can't remember which. It featured a lowercase /a with a very thin horizontal at the top of the bowl. I think it did something strange with the /e as well but the rest of the typeface was quite conservative.</p>
      <p>Anyway, I guess my question is how do you guys know if you're taking things too far? In my older typefaces I was always going for high consistency but it tends to look dull. I want to spice things up a bit but I don't yet have the experience and confidence to know what works and what doesn't. I guess it's quite subjective as well, though I trust your judgement so I usually take your feedback into consideration.</p>
      <p>Anyway, looking at the /f in context again I can see it's just too light. It's not a charming feature but an obtrusive one which looks like a mistake. Perhaps that's really the issue. If I want to add a certain feature it should more obviously be a feature.</p>
      <p>r — I guess you're right. Looking at the text sample last night I actually wondered if the /r, /t and /y shouldn't be a bit rounder anyway. I'm considering making the beak of /r a bit more like the terminal of /f (essentially curving the bottom of the beak inwards a bit more) which should make it less dark as well. I'm also considering removing the angle at the left side of the apex of /t and make that a curve.</p>
      <p>n/m/h — The shoulders don't look too dark to me. There is more diagonal stress in /d though, so perhaps I should move the weight of the shoulders a bit more to the right so the left side has more space to breath in. What do you think? I will test it out today.</p>
      <p>y — I'm uncertain about this one in general. I really like the horizontal cut (though I agree it should be lowered) but I don't think it's for this typeface. I think I may need more roundness in the letter, so I might make a normal joint or a bit of a curved one like some italic variants of /y. If I were to keep the horizontal cut I should probably add more straight lines in the other letters, such as the leg of /k.</p>
      <p>t — I don't think the terminal should be shorter so I will probably have to extend the crossbar. I already extended it compared to the crossbar of /f as they're the same size in other typefaces I looked at, but I guess it's fine to deviate from whatever other people are doing. In fact, this is probably the way to innovate and gradually change type.</p>
      <p>o — I always have trouble designing the /o so it's good to know I did well here.</p>
