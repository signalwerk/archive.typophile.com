      <p>You retouched the bowl of the /a/ nicely. It now looks more fluid. You also did a good job with the /f/. </p>
      <p>I would modify /y/’s terminal to resemble the terminals of /r/, /f/ and /g/’s ear somewhat more. I like the overall shape, though.</p>
      <p>Isn’t the ear of /g/ too light?</p>
      <p>About giving some letters some extra quirkiness, I believe I share your opinion. I think it is totally sane and even necessary to break the rules now and then. It’s good to see that you are giving those “louder” details a chance. Truth is that in typeface design you will find yourself throwing out most of your original ideas because either they look as mistakes or they convey a trying-to-hard impression :-/ Talking about high-contrast spots as design features I immediately had to think about Lexikon, which to me can be called a successful design without hesitation (...although I’ve always thought the /z/ looks off).</p>
      <p>As to the spacing, stick to the rule of thumb of spacing glyphs that are closer to a vertical line looser and glyphs that are pointier tighter. Give vertical letters a side-bearing about half as wide as the average counter width. Of course, be consistent for the sake of it and to save precious time; otherwise your class based kerning is useless. These are all things you probably already know, but perhaps they confirm your own ideas about spacing.</p>
