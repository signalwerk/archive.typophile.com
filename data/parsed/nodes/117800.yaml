      <p>I modified b/c/e/f/r and added g and t.</p>
      <p>Last week I stumbled upon <a class="freelinking external" href="http://typophile.com/node/54942" rel="nofollow">this post</a> and noticed Hrant's criticism on the classical shape of /g. I figured I would try to design a /g with an open loop but couldn't get it to work so I eventually closed the loop again. I noticed the link in the /g of Romulus is centered rather than at the left and this seems to result in a less obtrusive loop. I also downplayed the link of the bottom loop and put it more to the center. I quite like the result of v9 but I thought I would post the whole evolution of /g so you get more insight into what I'm exploring so you may be able to offer more specific criticism.</p>
