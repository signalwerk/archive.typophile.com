      <div class="comment-spam-body"><blockquote><p>The colon and semicolon have perhaps too much space in-between.</p></blockquote>
      <p>I thought so too, but how do I fix this? I can imagine it will look good if I bring the two dots of the colon closer together (thus taking them away from the baseline and the mean line), but raising the comma of the semicolon may be odd. To me it doesn't look wrong necessarily, but I don't think a floating comma is an elegant solution. How are the colon and semicolon usually balanced in typefaces with a high x-height? Also, how is this fixed in very light typefaces where the dots of the colon drift further apart? Am I wrong in thinking they should align with the baseline and mean line?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Baran v18 semicolon test_4336.jpg"></div><p></p>
      <blockquote><p>Ask yourself in which spot you want that transition to happen.</p></blockquote>
      <p>Thanks for the tip, though I have been asking myself this continually. The problem I think is the join; I want to take a longer distance for the curve on the inside of the terminal, but it still needs to go straight after the join. The fact that the area above and below the join needs to align is rather restricting. It's a bit hard to explain, but essentially there are too many diagonals and curves to consider which makes it difficult to have a nice transition without bumps in the curves. I feel very restricted. Perhaps I should have cut the left side off temporarily so there are a fewer diagonals to consider. Anyway, I reworked the /y again and it's looking much better. I will upload a new version later once I've added more letters and made more revisions.</p>
      </div>
