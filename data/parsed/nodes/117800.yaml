    html: |-
      <p>A few comments (any of which, as always, you may choose to disagree with and forget):</p>
      <ul>
      <li>I think the /e/ needs more weight in the top left area, perhaps just the left side of the bowl. (I would shift the inner curve a bit to the right).</li>
      <li>/f/, on the other hand, is definitely too thin at the upper taper. Wasn’t the last version thicker. I thought its color already looked OK.</li>
      <li>/r/’s terminal is too dark (<em>delay</em> its thickening a bit more, perhaps).</li>
      <li>The shoulders of /n/, /m/ and /h/ are also a bit too dark to my impression. Independently they look great, though. That doesn’t help, does it?...</li>
