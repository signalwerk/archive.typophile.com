      <p>A disconnected bar doesn't seem like a good idea for this typeface. I might try it out later, but I don't think this is what should make or break the /e anyway. There was something improper about its structure compared to the other letters.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Baran v7_5807.jpg"></div><p></p>
      <p>Here's an update. I changed c/e. I think they have a much better flow now. The /e is a lot more rounded like the /a. For now I'm fine with it but I might change it later. I haven't really decided on how quirky this typeface should be, either.</p>
      <p>I also sharpened the beak of /r though I might have overdone it. I also made the /o wider but I'm still not happy with it. I would have thought the /o is one of the easiest letters but I actually find it one of the hardest characters to get right – in all of my typefaces.</p>
      <p>And I made several variants of /f and decided on this one for now. I'm not sure if the terminal is sexy or just too small.</p>
