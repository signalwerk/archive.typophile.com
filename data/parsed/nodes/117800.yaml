      <div class="comment-spam-body"><p>Thanks for the feedback. I think you're right on all points. The /A is a little off to me, but I'm actually thinking of shortening the left serif even more to remove that "bump". I personally like the /A in Trinité and Lexicon a lot and think it might work well for this typeface. It's also for functional reasons; this probably isn't going to matter too much for the left side of /A, but considering its shape there will always be a lot of space around the letter so I want to compensate for that.</p>
      <p>The apostrophe could be a bit lighter. I noticed Lexicon's is really big (but Lexicon is darker anyway) so I guess I leaned a bit too much to Lexicon's apostrophe.</p>
      <p>Can you make a suggestion for c_u? Do you think I should make a contextual alternate to make the point where the terminal and serif meet less obtrusive?</p>
      <p>I noticed I forgot to include /q in this sample. I made sure the bowls of b/d/p/q are all unique.</p>
      <p>What do you think of /y now?<br>
      Should /e be a bit darker on the left, and should /s be a bit wider? I'm not entirely sure how much to differentiate in letter widths. I like the Venetian model regarding widths but it's probably not a good idea to use that for this typeface, though I don't want all characters to be equal in width and provide the exact same rhythm either because I feel it would make the typeface more dull.</p>
      <p>I'm also thinking of moving the terminal of /t a bit to the left. I almost feel the /t has a tendency to lean backwards so I might have to compensate for that. Moving the lower part a bit to the left might create more tension as well, which could be good.</p>
      <p>I also shortened the serifs on the ascenders a bit so they will work better in combination with capital letters. With the long serifs there was just too much space between I_l and similar letter combinations.</p>
      </div>
