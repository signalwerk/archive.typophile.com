      <p>I like how the variations of the bowls of /b/d/p/q/ still look very related. Interesting counter shape; I didn’t notice it earlier.</p>
      <p>The colon and semicolon have perhaps too much space in-between.</p>
      <p>I don’t think the /ry/ pair needs anything more than just kerning.</p>
      <p>/y/ is maybe a tad too light at the thin part of the terminal, but it looks OK. I also tend to take longer drawing the /y/. It’s the long diagonal that starts with a serif and ends in a terminal, with a thick-thin-thick transition. Ask yourself in which spot you want that transition to happen. Hope it helps.</p>
      <p>The area around the left serif of /A/ is too light indeed. I still think the serifs (both) could be longer towards the center, as if pushed together. At least longer than the serifs of the lowercase. But it’s your call ;-)</p>
