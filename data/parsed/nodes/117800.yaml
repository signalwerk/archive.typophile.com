  html: |-
    <p>I just wanted to show you a new typeface I started as a little break on a different typeface I'm doing for a client.</p>
    <p>It started with an idea on a certain flow of lines within the /a but quickly thereafter I removed the terminal and created this sort of naked serif typeface.</p>
    <p>I like the a, b, d and r in particular (which is not to say no more adjustments will be made though) but I'm rather uncertain about the /c and and /e as they're perhaps too classical. I suppose with this typeface I essentially want to bring a few classical/chirographic aspects and think it through to a logical, modern conclusion. I feel the /o could be wider but I will have a closer look at that when doing more elaborate text samples.</p>
    <p>Any criticism is welcome.</p>
