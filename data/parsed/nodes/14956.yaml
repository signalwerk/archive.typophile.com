      <p>——————————————-<br>
    For Immediate Release:<br>
    Buffalo, NY September 1st, 2005<br>
    ——————————————-</p>
    <p>Monumental Titling: Michael Clark (USA)<br>
    P22 Monumental Titling is based on classic Roman proportions and drawn from<br>
    a calligraphic hand. This tasteful and well crafted Humanist display face<br>
    exudes an air of dignity along with subtle playfulness. Alternate<br>
    letterforms and ligatures give this capitals-only font expanded<br>
    possibilities for any given text. </p>
    <p><a href="https://web.archive.org/web/20080906160924/http://www.p22.com/ihof/monumental.html" title="http://www.p22.com/ihof/monumental.html">http://www.p22.com/ihof/monumental.html</a></p>
    <p>Komusubi: Hajime Kawakame (JAPAN)<br>
    P22 Komusubi is a new font family from Hajime Kawakami. It features Latin<br>
    as well as Katakana and Hiragana. This lively display font comes in regular<br>
    and bold for all three alphabets. In Japanese, Komusubi means to tie a<br>
    string or ribbon lightly. The Nipponian lyrical atmosphere of the word<br>
    “Komusubi” reflects the casual tone of the font itself. </p>
    <p> <a href="https://web.archive.org/web/20080906160924/http://www.p22.com/ihof/komusubi.html" title="http://www.p22.com/ihof/komusubi.html">http://www.p22.com/ihof/komusubi.html</a></p>
    <p>Driade: Gabor Kothay (HUNGARY)<br>
