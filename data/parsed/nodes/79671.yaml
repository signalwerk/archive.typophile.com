  html: |-
    <p>A rare opportunity to dip your toe (and your pen) into the vast ocean that is Arabic calligraphy. </p>
    <p>Society of Scribes in NYC is offering a 5 week course in the study of Thuluth<br>
    on March 20, 27, April 3, 10, 17<br>
    9:30 am - 3:30 pm. </p>
    <p>for more info and to enroll:<br>
    <a href="http://societyofscribes.org/workshops.htm" title="http://societyofscribes.org/workshops.htm">http://societyofscribes.org/workshops.htm</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/QBurda375_6180.jpg"></div><p></p>
