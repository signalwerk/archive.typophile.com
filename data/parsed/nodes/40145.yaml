    <p>A Holiday gift for you</p>
    <p>—-The P22 Music Text Composition Generator—-</p>
    <p>It is somewhat hard to explain exactly what this is, but it will convert any text that you enter into musical notation. You can play and print out your text...now your parking ticket can serenade you...or that Nigerian bank email can lull you to sleep. Give it a try, have fun! <a href="https://web.archive.org/web/20080905135814/http://p22.com/musicfont/" title="http://p22.com/musicfont/">http://p22.com/musicfont/</a></p>
