      <p>First off, thanks for noting the variable overshoots...I just looked at it all in fontlab again and there is definitely a substantial difference in a variety of the characters mentioned.</p>
      <p>Finials-I agree with both of you in a way. I still haven't fully committed to how I want to work these out. I do really like the way the c is starting to feel, and I feel that that attribute can be carried throughout. It's just going to take some experimenting to see what works.</p>
      <p>And omashuisje I will definitely be checking out your work as soon as I get some rest...its 4am in LA...and this site and my font have kept me up!</p>
      <p>I did take a glance and the /q/ and the /P/ are immediately appealing to me. I'm liking the open counter idea. Any notion that brings in more negative space is lovely in my book.</p>
      <p>Thanks for all the astute observations you two.</p>
      <p>-Paul</p>
