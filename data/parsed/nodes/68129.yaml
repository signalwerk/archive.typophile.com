      <p>Hi Paul,<br>
      All right! Not bad after just a few months!</p>
      <p>It's hard to tell from the jpg (there's no PDF), but it seems that /m/ and /x/ are too wide (compare /w/), /r/ needs a braver flag, /s/ and /z/ look out of balance, /t/ is too narrow. Colour of /g/ is too heavy.</p>
      <p>A word of advice: don't wait too long to make a start with designing the capitals. Sometimes it helpes designing the lc having a sort of guide in caps, and vice versa.</p>
      <p>As for looking at other fonts, don't limit yourself. I'm a amateur type designer myself and I get my technical inspiration from looking at all possible fonts I encounter. Some fonts are beautifully made but stylistic I don't like'm. Other fonts look fantastic but are constructed awfully. Nevertheless I study them all just to see how they're designed.</p>
      <p>Keep going! Nevermind you're getting your inspiration from the great names, it's just like how I started.</p>
