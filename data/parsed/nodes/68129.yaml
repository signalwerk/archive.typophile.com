      <p>Oh The PDF is up now...sorry, I must have forgot to upload it!</p>
      <p>Thanks for the keen insight. I definitely agree with all your comments. The /g/ is simply a beast. Your notes on the /m/ and /x/ are spot on. The /s/ is proving to be a very difficult letterform...but I'm up for the challenge.</p>
      <p>Regarding design of the caps, I definitely do want to get started soon, as the main reason I wanted to design a font like this was because I love many of the characteristics of Gill and Futura's capitals...but I feel the lowercase just don't quite work for me personally. So I agree with looking at all types of fonts, even ones I'm not "into to" per se.</p>
      <p>Thanks for all your input! I'm glad to see such a lively community here!</p>
