    html: |-
      <p>Hi Paul<br>
      This has a nice weight to it. I love the c and the stick and bowl shapes. I actually don't mind the mix of horizontal/vertical terminals between c and e but I'd recommend s has vertical ones and a horizontal I think. I think your overshoot is quite variable and a bit large overall (noticeably on b, m, n and u).<br>
      g is really nice already, but have you tried lifting the bowl slightly above the baseline? Sometimes that's a trick that works to balance the counters better, but not too much of course.<br>
      The bowl of a looks quite rough, perhaps there are too many nodes in there?<br>
      e looks wide and I'd shave a tiny bit of weight off the crossbar.<br>
      Hood of f could be wider.<br>
      i and k are great.<br>
      s, again, looks like too many nodes, or needs smoothing. It's also too large. I'm sure you'll get there!<br>
      I think I'd make the top of t a bit taller.<br>
      v looks clotty in the middle, pull down the centre node of the counter. Also perhaps the whole shape could be narrower.<br>
      Uphill stroke of x could do with some offset.<br>
      y is neat.<br>
      z is falling left.</p>
      <p>I'd agree with starting caps and numerals before trying to get all the lowercase working perfectly. Good luck :)</p>
