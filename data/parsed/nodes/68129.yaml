      <p>Judging from your PDF /s/ is too big (you're absolutly right, /s/ is a b***h). It seems that /m/ and /n/'s bowls are higher than /p/'s en /q/'s? I think you've got the contrast (thick-thin) in /v/ and /y/ mixed up. /c/ has vertical finials, whereas /e/ has a horizontal finial, and /s/ diagonal. I understand that you're making a mix of all great typefaces, but I think that when you make all finials more or less the same, either vertical OR horizontal OR diagonal, you'll get a more coherent design.</p>
      <p>Try setting a longer text like 'the quick brown...' so I can judge it better.</p>
      <p>If you're interested, I've got a design up for crits myself, check it <a class="freelinking external" href="http://typophile.com/node/67608" rel="nofollow">here</a></p>
