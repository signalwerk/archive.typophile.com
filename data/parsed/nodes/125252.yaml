    html: <p>I ran across several documents dated in the late 1980's that appear to be drafted using the Tahoma font which was not officially released until 1994. Several older attorneys have told me that they purchased a software package for their Mac SE and early PC's that contained templates using Tahoma or its identical twin. I'm trying to solve this mystery for a client.</p>
