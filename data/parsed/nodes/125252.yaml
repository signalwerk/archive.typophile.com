    html: <p>If it is the same documents you've requested help on prior to this in other forums, please post something more than the word "Quinn". People who are trying to identify a font would love to see, for instance, lowercase letters such as a, e, g, k, r, y -- the more they have to work with the more likely it can be positively identified. Having a good amount of capital letters is also a big help. It also would be nice if it is a high-res scan (300 dpi) rather than a 72 dpi jpeg or smartphone camera shot -- small details can make a critical difference especially when dealing with sans serif faces. Last, but certainly not least, post it in the Type ID section -- not here.</p>
