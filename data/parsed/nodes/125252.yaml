  html: <p>I'm trying to solve a mystery regarding the origin of the bitmap font that later became Tahoma. Does anyone know how to reach Matthew Carter, the man who designed Tahoma, Bell Centennial, Verdana and many other fonts? If so, please forward him my email address or send me his contact information. Thank you. Sincerely, Tom Quinn</p>
