    <p>Hi!<br>
    I am not sure if You guys are aware enough of Unicode typefaces, but I would like to hear Your sugggestions in this topic.</p>
    <p>I am in a process to redesign a lifestyle/fashion magazine in Arabic language, which is supposed to be very stylish and classy. I would like to hear some Arabic typefaces suggestions. I need 2 typefaces one for titles/display purposes, and one for reading (and this one is the pretty hard to find). Do I hear any suggestions?</p>
    <p>A.</p>
