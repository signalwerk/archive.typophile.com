      <p>hey,</p>
      <p>well from my old notes here, arabic types are 2 types&gt;&gt; koufic (geometric) or Cursive.</p>
      <p>in Cursive we have the following kinds (which have under it many fonts):<br>
      Riqaa: narrow short letter (newspapers - adertizing and headlines)<br>
      Farisi: elegant impression<br>
      thuluth: complicated for decorative and announcement caligraphic compositions<br>
      naqsh: daily writings</p>
      <p>for body type check AXT Gihan AXT marwan<br>
      Axt manal </p>
      <p>and Rhotes Sans</p>
      <p>im sure by now there are many new fonts out there, Boutros is one type foundary that are professional check their website! provides links. yaqout, and grapheast are other places that have professional fonts as well ....</p>
