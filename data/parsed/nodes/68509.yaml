      <p>In InDesign, the Book feature solves this.</p>
      <p>Firstly, make a backup of all files (as they will be changed).</p>
      <p><strong>01</strong>. Edit the paragraph styles in one of the documents.<br>
      <strong>02</strong>. Create a book (File &gt; New &gt; Book). The Book panel will appear.<br>
      <strong>03</strong>. Include all files you need to change in this book (plus sign).<br>
      <strong>04</strong>. Set the changed document as origin of styles (icon at left).<br>
      <strong>05</strong>. Use the synchronize command from panel menu.</p>
      <p>Sync will apply the same styles for all documents in the Book. The styles applied are those from the origin document. You can change sync option from the panel menu.</p>
      <p>Be aware that Book would change page numeration of files you include in it. You can disable this option from the panel menu. You can also change page numeration back with a double-click in the page numbers shown in Book panel.</p>
