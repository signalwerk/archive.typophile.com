    html: |-
      <p>Are the final fonts absolutely identical to the betas except for the names? </p>
      <p>If not, it would be a good idea to review each document after the change to make sure that there weren't any unintended consequences. For example, in InDesign the tiniest change to kerning, etc. might cause a line break somewhere to change, which might make a whole paragraph reflow, which might make a page break change, and suddenly one or more pages look screwy or have a text overflow.</p>
