      <p>Yes, there might be a solution to your problem, at least as far as the InDesign documents are concerned:<br>
      Hans Haesler offers some terrific javascripts. You want his ‘SchriftenTausch’. The scripts can be downloaded free of charge from <a href="http://www.fachhefte.ch/java_scripts/" rel="nofollow">www.fachhefte.ch</a>: choose your platform (OSX or Windows; D is the German version, F is French), and then your InDesign version. You’ll find SchriftenTausch.sit and SchriftenTauschDatei.sit. The files come with a Read-Me file that has instructions in German – I guess that’s just fine for you.</p>
      <p>Cheers,<br>
      Florian</p>
