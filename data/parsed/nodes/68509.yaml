    <p>"What is the quickest way to replace paragraph styles in a large number of InDesign documents?"</p>
    <p>i've designed a large typeface family for a large client. they've had the beta version for a while, and already used it extensively.</p>
    <p>we just installed the final version, which has its new final name, and partially renamed weight names too.  opening their many files now, they get "missing fonts" alerts.</p>
    <p>since it is their first custom font, they are understandably surprised, and frustrated that they might have to re-spec so many docs one by one.  isn't there any way this process could be reduced / simplified / expedited, via macros, scripts, actions or such?</p>
    <p>the team uses mostly mac OSX, but the rest of the corporation mainly windows XP (seems the only common platform for all international offices).  their main softwares are InDesign, Keynote, PowerPoint.</p>
    <p>thanks much for any help!</p>
