    <p>The projecting parts of letters extending from letter bodies. Most commonly, the <a href="/node/12043" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">ascenders</a> and <a href="/node/12051" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">descenders</a> of the <a href="/node/add/wiki?edit%5Btitle%5D=Bowl%20pairs" title="Create node &quot;Bowl pairs&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">bowl pairs</a> <strong>b-q</strong> and <strong>d-p</strong>, <strong>g</strong>, the descender of <strong>y</strong>, and also the <a href="/node/12052" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ear</a> of <a href="/node/add/wiki?edit%5Btitle%5D=Binocular" title="Create node &quot;Binocular&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">binocular</a> form lower case <strong>g</strong>.</p>
