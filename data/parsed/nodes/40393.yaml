    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Extender</strong></p>
    <p>The projecting parts of letters extending from letter bodies. Most commonly, the <a href="/wiki/ascender" class="freelinking" rel="nofollow">ascenders</a> and <a href="/wiki/descender" class="freelinking" rel="nofollow">descenders</a> of the <a href="/wiki/Bowl%20pairs" class="freelinking" rel="nofollow">bowl pairs</a> <strong>b-q</strong> and <strong>d-p</strong>, <strong>g</strong>, the descender of <strong>y</strong>, and also the <a href="/wiki/ear" class="freelinking" rel="nofollow">ear</a> of <a href="/wiki/Binocular" class="freelinking" rel="nofollow">binocular</a> form lower case <strong>g</strong>.</p>
