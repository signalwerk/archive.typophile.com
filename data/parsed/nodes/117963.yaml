    html: |-
      <p>The main thing that is distinctive is the _R_, which is found in a few fonts like Arboria Bold -- already suggested by Kevin -- GT Walsheim -- already suggested by Riccardo -- and Neutra Display <a href="http://www.identifont.com/find?font=Neutra+Display&amp;q=Go" title="http://www.identifont.com/find?font=Neutra+Display&amp;q=Go">http://www.identifont.com/find?font=Neutra+Display&amp;q=Go</a> The other letters are pretty common, including _S_ which is similar to Helvetica, Chalet, Newhouse, Nimbus, Pragmatica, Arial etc.<br>
      perhaps the closest out of the box is GT Walsheim which hs both a similar _R_ and a somewhat  similar _S_.<br>
      Don</p>
