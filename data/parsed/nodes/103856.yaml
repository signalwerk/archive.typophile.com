      <p>It's a variation on the famous &amp; by Caslon, so it looks very familiar:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/CaslonClassicoBoldItalic_4429.jpg"></div><br>
      Ampersands are the place for creative play by font makers, so it could well be from a font -- if so, probably a high contrast thick &amp; thin.<br>
      It would take some time to go through the candidates to check for a precise match.<br>
      The &amp; symbol is also a popular art project.<br>
      Perhaps one of the cognoscenti with a good memory could pronounce on this one.<br>
      BTW, ampersands have been discussed before in typophile forums. You might enjoy browsing through:<br>
      <a href="http://typophile.com/search/node/ampersand" title="http://typophile.com/search/node/ampersand">http://typophile.com/search/node/ampersand</a><br>
      Don<p></p>
