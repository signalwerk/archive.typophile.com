    <p><a href="http://images.amazon.com/images/P/0743287150.01._SCLZZZZZZZ_.jpg" rel="nofollow">Here is the image.</a></p>
    <p>I was walking through Target and saw this yesterday. I recognized the type on the jacket, and thought I was seeing Carter's Mantinia, but when I cracked open the cover to see the title page, the display and text face looked very similar and played very well with it. I was curious if anyone could confirm Mantinia or if someone who has picked it up could confirm the text face. (As Mantinia is impossible.)</p>
    <p>Thanks</p>
