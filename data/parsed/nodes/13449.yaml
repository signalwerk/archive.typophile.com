    html: |-
      <p>Check out the B's in Galliard and Mantinia. The B on the book cover, the cross bar where the 2 bowls of the b meet. Galliards closes both bowls, Mantinia leaves the bowls connected and open.</p>
      <p>Also check out the 'foot' of the R's. Galliards is rather plain, whilst Mantinia's has a rather pronounced brush flair.</p>
      <p>I vote Mantinia.</p>
