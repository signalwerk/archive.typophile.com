  html: <p>Why do the names of religious texts not receive a treatment—italics, underlines, etc—to make them stand out among other text in the same manner that is done with other written works?</p>
  html_clean: <p>Why do the names of religious texts not receive a treatment—italics, underlines, etc—to make them stand out among other text in the same manner that is done with other written works?</p>
