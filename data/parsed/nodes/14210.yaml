    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : Johannes Gutenberg</strong></p>
    <p><strong>Johannes Gutenberg</strong></p>
    <p>(circa 1398 - Feb 3, 1468) Inventor of the <a href="/wiki/letterpress" class="freelinking" rel="nofollow">letterpress</a> printing technique using metal alloy <a href="/wiki/movable%20type" class="freelinking" rel="nofollow">movable type</a> and a press. He is accredited with producing the first western book using this technique, the "42-Line" (aka "Mainz" or "Gutenberg") <a href="/wiki/Bible" class="freelinking" rel="nofollow">Bible</a>. His letterpress printing technique was an amalgam of different technologies available at the time including wine presses and metal alloys.</p>
    <p>See also <a href="/wiki/Johann%20Gutenberg" class="freelinking" rel="nofollow">Johann Gutenberg</a></p>
    <p>for more info:<br>
    <a href="http://www.gutenbergdigital.de/gudi/start.htm" title="http://www.gutenbergdigital.de/gudi/start.htm">http://www.gutenbergdigital.de/gudi/start.htm</a></p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/21133" title="http://typophile.com/node/21133">http://typophile.com/node/21133</a></p>
