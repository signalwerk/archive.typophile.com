    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a>: Jukebox</strong></p>
    <p>Jukebox is a vibrant collection of script and display faces inspired by the designs of the 20th century, particularly the '50s and '60s. Drawing from the artistic and cinematic influences of his native Hollywood and the golden age of sign painting, designer <a href="/wiki/Jason%20Walcott" class="freelinking" rel="nofollow">Jason Walcott</a> tries to capture the glamour and spirit of this era in his type designs. This library maintains an arguably American feel.</p>
    <p>The Jukebox foundry (formerly known as JAW Fonts) was acquired by <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a> in 2003 - <a href="http://www.veer.com/about/pressroom/releases/veer_pr_jbaquis_release.aspx" rel="nofollow">Press Release</a>. The Jukebox library is distributed exclusively by Veer in North America.</p>
