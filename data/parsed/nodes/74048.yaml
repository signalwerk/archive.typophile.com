  html: <p>Do you know any good sans fonts where the all the caps accents are connected with the "base glyph"? Like in many fonts, the Å is A and ° joined together (Interstate for example). Are joined accents as a design feature considered as a generally bad idea? Why so?</p>
  html_clean: <p>Do you know any good sans fonts where the all the caps accents are connected with the "base glyph"? Like in many fonts, the Å is A and ° joined together (Interstate for example). Are joined accents as a design feature considered as a generally bad idea? Why so?</p>
