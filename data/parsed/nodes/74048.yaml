    html: |-
      <p>well, it's considered "bad idea", cause  joing the accents to the letter might suggest a special glyph/character on it's own. Many headline faces had the accents tightly close to the letters but still not jointed (if i'm not mistaken).</p>
      <p>In the case of the uppercase A with a ring (Å) - it IS actually a character on it's own, so is considered acceptable to be jointed.</p>
