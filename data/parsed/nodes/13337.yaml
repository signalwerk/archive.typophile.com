    <p>Hi, I'm looking for a good asian-looking font, to be more specific. So, not a font in Cantonese or Manderin but one in English that has that character, brush stroke look. I've seen some cheasy ones out there like Bamboo, but if anyone has any good suggestions I'd appreciate it.</p>
    <p>Thanks!</p>
