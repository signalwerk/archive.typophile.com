    <p>I recall seeing a font that looks like a bunch of straight-line scratches into metal or plastic like people do on subway windows. Each stroke is made up of a bunch of uneven, irregular hand-made scratch strokes. Does this sound familiar to anyone?<br>
    Thanks.</p>
