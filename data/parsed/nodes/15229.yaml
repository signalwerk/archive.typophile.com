      <p>You can try the same sort of search at T-26, which used to have a font by Greg Samata by that name. Now you get some other 'scratchy' fonts that are still in their collection, but the Samata one is gone. You can also search through Part 14 of the <a href="http://bowfinprintworks.com/Script14Pg1.html" target="new"> Script Font ID Guide </a> to see other scratchy varieties, many of which may be available around the web as free downloads.</p>
      <p>- Mike Yanega</p>
