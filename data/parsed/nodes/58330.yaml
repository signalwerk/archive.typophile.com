    <p>Dear Typophiles,<br>
    One of the most frequently asked Questions by non-Arabs is how to configure Windows Operating system for Arabic. Here is how and more...<br>
    _________________Windows VISTA_________________<br>
    Start&gt;Control Panel &gt; Regional+Language Options&gt; Keyboard+languages &gt; Change keyboards.<br>
    In the Text Services and Input Languages&gt;General tab&gt;Add.<br>
    In the Input Language menu choose Arabic.<br>
    In the Keyboard layout menu choose the keyboard you want to add, click the plus sign.<br>
    _________________Windows XP_________________<br>
    Start&gt; Control Panel &gt; Regional+Language Options &gt; Languages tab.<br>
    o Check Install files for complex script and right-to-left languages &gt; Apply<br>
    After the files are installed, you must restart your computer. Then,<br>
    Start &gt; Control Panel &gt; Regional and Languages Options&gt; Add other languages &gt; Details.<br>
    o Click on the Settings tab and then click Add.<br>
    o In the Input Language menu choose Arabic<br>
    o In the Keyboard layout menu choose the keyboard you want to add.<br>
    Click OK and then Apply.<br>
    _________________In Either Windows_________________<br>
    o You can change the language toolbar settings by right-clicking on the EN button in the system tray at the bottom right of your desktop &gt; Settings...<br>
    o You can change languages by left-clicking on the EN and choosing Arabic.</p>
    <p>_________________Personally_________________<br>
    I press Shift+Alt to toggle between Arabic + Latin, and<br>
    Press Left (Ctrl+Shift) to type English from Left to right.<br>
    Press Right(Ctrl+Shift) to type Arabic from Right to left.<br>
    ===========================================================<br>
    ____________Virtual Arabic On-Screen Keyboard____________<br>
    In XP, Start &gt; All Programs&gt; Accessories&gt; Accessibility&gt; On-Screen Keyboard.<br>
    In Vista, Start &gt; All Programs&gt;Accessories &gt; Ease of Access &gt; On-Screen Keyboard.<br>
    You can click the on-screen keys to type text.<br>
    Use Standard keyboard (Enhanced keyboard - Number Keys).<br>
    Use Always on Top to keep your keyboard displayed when you switch programs or windows.<br>
    The program in which you want to type characters must be active while you are using On-Screen Keyboard. </p>
    <p>For Single Arabic Marks:<br>
    press Shift + Q to get Fatha<br>
    press Shift + W to get Tanween fath<br>
    press Shift + E to get Zamma (9)<br>
    press Shift + R to get Tanween Zam (69)<br>
    press Shift + A to get Kasra<br>
    press Shift + S to get Tanween Kasr<br>
    press Shift + X to get Sukoon<br>
    press Shift + ~ to get Shadda</p>
    <p>For Double Arabic Marks:<br>
    press Shift + ~ then Q to get Shadda + Fatha<br>
    press Shift + ~ then W to get Shadda + Tanween fath<br>
    press Shift + ~ then E to get Shadda + Zamma (9)<br>
    press Shift + ~ then R to get Shadda + Tanween Zam (69)<br>
    press Shift + ~ then A to get Shadda + Kasra<br>
    press Shift + ~ then S to get Shadda + Tanween Kasr<br>
    ===========================================================<br>
    In M$ word, short-cut keys can be added to insert symbols as follows:<br>
    Shift + Alt + Q to get Dagger-like Fatha<br>
    Shift + Alt + A to get Dagger-like Kasra<br>
    And,<br>
    Shift + Alt + any Arabic letter to get the corresponding Farsi/Jawi letter.<br>
    Example = Shit + Alt + kaf to get the Jawi dotted Kaf or the Persian Gaf.<br>
    ===========================================================<br>
    Happy Toggling with Flowers</p>
