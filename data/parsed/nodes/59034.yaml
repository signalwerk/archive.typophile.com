  html: |-
    <p>Hello everyone,</p>
    <p>A client has sent me a packaging task that was previously created in Illustrator by another designer.<br>
    Said designer has converted all type to shapes, and I can therefore not edit or ID this specific font.</p>
    <p>It *looks* to me like FuturaBT. What do you say?</p>
    <p>If anyone knows where I may be able to obtain FuturaBT fonts (preferably for free), can you kindly point me in the right direction?</p>
    <p>Many thanks in advance.</p>
