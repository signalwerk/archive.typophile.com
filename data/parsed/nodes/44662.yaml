    <p>Hi,<br>
    we have some nasty version of two fonts called Veran Est and Veran Turc. I'm on a mac and when I 'get info' on the fonts it says copyright Quartet Systems. I would like to buy some nice new versions of these fonts as they are proving very troublesome, the problem is that I cannot track down the foundry or the font from elsewhere. I was wondering if all you experts out there may be able to help out.</p>
    <p>Much appreciated.<br>
    Sean</p>
