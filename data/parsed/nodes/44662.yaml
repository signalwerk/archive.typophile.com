    html: |-
      <p>Thanks Pieter,</p>
      <p>that was indeed the foundry. I did find that site in an earlier search but my schoolboy french was not helping me make sense of the site and I could not see any references to fonts. Anyway I contacted them and unfortunately they no longer make the fonts and the last versions they made are not compatible with CS apps so that explains the problems we've been having. They suggested that the Veran fonts were, for all intents and purposes, Futura WGL so now I am hunting for Futura WGL but so far there do not seem to be any WGL versions of Futura. If anybody has come across foundries making Futura WGL I would appreciate a heads-up.</p>
      <p>Sometimes I wonder if we should all just use Times and Helvetica, my life would be so much simpler.</p>
      <p>Thanks<br>
      Sean</p>
