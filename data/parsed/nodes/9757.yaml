    html: "<p>Not to prolong everyone's agony needlessly, but the horribly designed, questionably edited, and erratically proofread portmanteau volume that is Steven Heller's <i><a href=\"http://www.powells.com/cgi-bin/biblio?inkey=17-1581150822-0\">Texts on Type</a></i> has two excellent essays on the classification of type as a theoretical discipline: one of Beatrice Warde's tart, concise essays from <i>The Crystal Goblet</i>, \"On the Choice of Typeface\", and Jonathan Hoefler's \"On Classifying Type\". Hoefler covers most of the same ground we've hit in this thread, including a discussion of Cynthia Dixon's work, and Warde's just plain fun to read.</p>"
