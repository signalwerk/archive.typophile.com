    html: <p>Raph, I think you're muddying the waters a bit in your analysis.  <br> <br>Copying popular fonts and giving them a different name is a practice that was common in the days when fonts were tied to a particular manufacturer's equipment. Bitstream was a pioneer in creating a digital type library at a time when this was still the norm. Bitstream was formed by former Linotype people (including Matthew Carter) who were well aware of what they were doing. They licensed the name when they could, and when they couldn't, they used a generic name. The name was really the only thing that could be protected at the time. They also worked with the original designers in many cases, even when they couldn't use the name. You make it sound like they copied existing digital fonts and simply renamed them. <br> <br>Now that fonts are distributed in (more or less) universal formats, not tied to any particular manufacturer's equipment, the need for this behavior has disappeared and the practice is much less acceptable. You'll notice that when Agfa Monotype yanked the license to distribute ITC fonts from Bitstream, Bitstream removed them from their library, even though they could conceivably have just renamed them. <br> <br>Creating a new font based either closely or loosely on some other font is a different thing. Sometimes the similarity of two fonts is intentional, sometimes not. If you design a font in the Humanist style, you may well end up with something that looks like Gill or Frutiger. This can come from following the "rules" that constitute a Humanist type design as easily as consciously imitating an existing face. <br> <br>When I designed Proxima Sans in the early nineties, my intention was to create a hybrid between grotesques like Helvetica and Franklin Gothic and geometric sans faces like Futura. At the time I worked out the basic design, I was not familiar with Avenir, even though it had been released a few years earlier. I nearly stopped working on Proxima Sans when I became aware of Avenir and noticed the similarities. In the end, I decided that the differences were substantial enough and finished the fonts. <br> <br>In the same vein, I was surprised when Gotham was released at its similarities with Proxima Sans. However, I <b>would not</b> accuse them of copying Proxima Sans (or Avenir). I think it's simply a matter of having design goals which result in a similar solution.  <br> <br>This is not to say that type designers do not look at how other type designers have solved the same or similar problems. They do. But to say that Font A is just Font B with a different x-height (or whatever) oversimplifies the practice of type design to the point of being offensive. (Apologies if I've read more into your point than you intended.)</p>
