    html: "<p>It's gonna be tough to get a straight answer out of people about this one. Categorizing fonts is one of those things that seems to attract an inordinate amount of attention, for results of questionable utility, and everyone seems to think everyone else's scheme is bogus. <br> <br>I think creating any kind of taxonomic tree for type is a heroic and ultimately futile task. Likewise, categorizing type strictly according to a timeline loses a lot of nuance as well. The back end of Routledge's Classic International Typefinder talks about some British type classification standard that has lots of descriptors that look like 1.4.23.18.4.87: a scheme only an old-style reference librarian could love. <br> <br>Categorizing type reminds me a lot of the problems I face in categorizing my music collection: a lot of stuff just doesn't fit well into a single category. I like the way MyFonts does it, although they could probably stand to be a little more comprehensive, rigorous, and otherwise more ontologically coherent: every font has one or more keywords and categories to describe it. Deciding upon the set of potential keywords is the next hard problem, but that's an exercise for the reader. <br> <br>As far as how many categories there are: how many typefaces are there?</p>"
