    html: <p>OK, for a straight answer. <br> <br>1. By designer <br>2. By typeface name <br>3. By foundry <br>4. By date <br>5, By medium (eg digital/photo/metal/etc.) <br>6. By geographic origin (usually home of designer/foundry) <br>7. By usage (where did I see that?) <br> <br>This is not a "phylogenetic" system (ie based on morphological features of the design), but it IS how I categorize type systematically. You will note that there is a precise answer to all these categories (although attribution is often up for scholarly debate). With any morphological system, there are so many grey areas, that, beyond "Sans, serif, &amp; script" the whole thing becomes quite subjective. <br> <br>It's not to say that I don't mentally consider and sort typefaces according to morphological principles. Of course I do. But I don't rationalize and reify this process, because that would be impossible. That doesn't mean it's intuitive, in the sense of being a simple unstructured gut reaction. It's a highly informed, refined form of mental processing, beyond words. Known as design.</p>
