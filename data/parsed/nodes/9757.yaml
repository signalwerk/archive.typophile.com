    html: <p>&gt;they're all copied from other fonts. <br> <br>Not so. It is also possible to design fonts from scratch. I've designed a number of original faces which are based on the interaction of design principles, not on specific typefaces. Of course, it's always possible to say "looks like so-and-so", but that would be inadequate. <br> <br>For instance Morphica and Panoptica. These could be described as "Post-modern", which is rather like the "Others" in the Borges-Hudson mode, a lazy catch-all.</p>
