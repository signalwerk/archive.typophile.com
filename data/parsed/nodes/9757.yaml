    votes: null
    html: <p>Marc, think of type like colors. <br> <br>"The public" has no names for colors other than a basic few. Yet most people can see the difference when two similar colors are put side by side.  <br> <br>As a designer, you use type as part of your design palette. You may even derive ideas from the formal or cultural properties of a typeface which can stimulate and inform the unique personality of you work as a whole. <br> <br>"The public" is not your only audience. Any public work is seen by others who are not in the target market. There are also your peers, associates, and yourself, who derive value from the work.  And the work has an integrity of its own. These are all responsibilites, contributing to the wealth of culture by making it rich, complex, and dynamic.</p>
