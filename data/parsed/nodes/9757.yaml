    html: <p>How would one categorize Hans Meier's 'Barbedor'? It's humanist  with very subtle modulations, but also tall and chaste (like the fonts of Eric Gill). It's a hybrid, a sort of serifed sans. The serifs are vestigial, more like flicks of the pen at the stroke ends. To my eyes it's one of the most elegant typefaces of the twentieth century, though apparently neglected. <img src="http://www.typophile.com/forums/messages/30/67557.jpg" alt="barbedorsamp"></p>
