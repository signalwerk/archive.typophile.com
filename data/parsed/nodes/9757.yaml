  - id: 62231
    user: 1551
    date: 2005-03-17T06:36:00
    date_raw: 17 Mar 2005 — 6:36am
    votes: null
    html: <p>The difference in typefaces is helpful partly for practical and partly for aesthetic reasons.  <br> <br>For example,one designer, Matthew Carter, has designed Bell Centennial, for phone books, Verdana, for computer screens and 'Postoni', a headline face for the Washington Post Newspaper. Use any one of these for the other purpose, and the result will be much inferior.  <br> <br>Aesthetically, such faces as Caslon and Zapfino will give very different impressions.  <br> <br>No doubt it is valuable to learn to use a few typefaces well. But the availablity of a variety for different puposes and moods represents an opportunity. Knowing a broader pallette and how to use it must be an advantage. However, typefaces are only one ingredient in graphic design, so obviously you have to budget how much time you want to put in on this one ingredient.</p>
