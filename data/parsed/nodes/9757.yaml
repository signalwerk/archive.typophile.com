    html: "<p><i>&gt;More seriously, the assertion that all fonts are copies of other fonts is an overstatement. But I think it is important to acknowledge the strong influences from fonts that have gone before. I did not mean to trivialize the process of designing fonts. </i> <br> <br>Thanks for the clarification. I was overreacting a bit.  <br> <br>Regarding the abundance of typefaces... <br> <br>It depends on how you think about type. <br> <br>On one hand, it has a very utilitarian aspect: To convey information. If this were its only use, we could probably get by with a handful of fonts and be done with it forever. <br> <br>On the other hand, typography can be expressive, conveying mood, context, voice, attitude, etc. and for that there are never enough typefaces. <br> <br>(The designers who use only eight typefaces their whole career are rare and probably only eat eight different things, too.)</p>"
