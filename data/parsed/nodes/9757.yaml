    html: "<p>The only problem I have with systems is when they become ends rather than means. I'm interested by attempts to systematically classify type because those attempts provide me with prepackaged perspectives on what type is, how it is to be used, and how it ought to be designed. There is no system for categorizing knowledge that is ultimately successful in all situations, or else the Library of Congress would be using the Dewey Decimal System. We all have to take in these systems, evaluate them, and make what use of them we can. <br> <br>I think one of the most important uses of classification schemes is communication. I know very little about type next to a lot of the people on these boards, but I know enough to notice that whenever we try to discuss or compare type designs, we're forced to grasp for terms, to haltingly try to synchronize our differing vocabularies. It would be nice if there were a common jargon we could use that was both precise and ambiguous enough to encompass the rule-based but essentially amorphous creative enterprise of type design. I don't want to be stuck with prescriptive gobbledygook, but it seems to me we can do better than we have. And if we can discuss things with each other more intelligibly, the odds are good we'll be able to think about them more clearly too. <br> <br>It would be neat to see a wiki built up around Cynthia Dixon's type classification scheme; I think the inhabitants of Typophile could collectively populate one with enough information to be useful relatively quickly. At the same time, any categorization scheme that tries to finally and ultimately nail down the category or type of a typeface (in other words, to completely remove ambiguity) is doomed to failure: again, type design is a field of tiny changes to very familiar forms, and attempting to objectively nail things down is likely to shed more heat than light. We spend too much time worrying about provenance as it is.</p>"
