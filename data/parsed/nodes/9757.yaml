    html: "<p>If you want a system of classification to help you think about type, then you need to figure out <i>how</i> you want to think about type. Classification systems, as Borges' classification of animals taught us, are arbitrary categorisations that reflect the priorities of the people who make them. Which is not to say that they are useless, but that they are useful only to people with a shared set of priorities or the same way of thinking about the classified subject. In some scientific fields, there are practical benefits to practitioners adopting the same system of classification, so that they can understand each others' work. But when a system of classification ceases to be an aid to thinking about a subject and becomes, instead, a means of forcing people to think in a particular way or, as in the case of some type classification systems, an esoteric means of excluding outsiders, then I think you have a problem. <br> <br>I don't think there is anything critical enough in typography that compels us to all use the same classification system: if there were, we would have come to an agreement a long time ago, just as biologists (largely) have. I tend to avoid classifying type, on the basis that every design is its own category: what makes us interested in a particular typeface is the way in which it differs from all other typefaces, not the way in which it belongs to a class of similar typefaces. If I classify type at all, I tend to employ (western) art historical classifications -- e.g. renaissance, mannerist, baroque, rococo, neo-classical, romantic, Victorian, neo-gothic, early modernist, international modernist, etc. -- because I like to think about type design in the larger cultural context in which it happens and of which it is a part. The specialised terminology of many typeface classification systems -- transitional, Didone, Garald, neo grotesk, etc. -- cut type design off from its cultural context, and present type as an esoteric field of specialised knowledge to which outsiders can only gain access with difficulty. A reasonably educated person has some notion of what romantic music sounds like, what romantic poetry entails, what a romantic painting looks like, and in what period these things were made. Why shouldn't he also know what a romantic typeface, of the same period and cultural milieu, looks like and be able to identify such? [Indeed, I think our whole understanding of what constitutes e.g. romanticism is subtlty altered depending on whether we include or exclude type design, just as it would be if we arbitrarily excluded choral music or landscape painting. By including type design in our consideration of the cultural context in which it is produced, we not only make sense of type design, but also change our understanding of that context.] <br> <br>Of course, I fully admit that the art historical classification of type breaks down as the 20th century progresses, and the catch-all 'post-modernist' category is very inadequate to talk meaningfully about a large body of recent work. This probably says as much about post-modernism as a cultural phenomenon as it does about the value of the classification system. But all classification systems fail eventually: the key is to understand their limits and make use of them insofar as they are useful, and no further. As our culture fragments further, classification systems based on cultural criteria will be less and less useful to the discussion of new works, but as a means of understanding the cultural artifacts of the past, including type design, they will remain useful. <br> <br>But maybe you don't want to think about type in terms of cultural context. So the first question must always be 'How do you want to think about type?', and then you either look around for an existing classification system that assists your thinking, or you invent your own. <br> <br>David Mundie's wonderful <a href=\"http://www.anthus.com/Typography/Faces.html\">Field Guide to the Faces</a> is worth taking a look at, by the way. It isn't really a classification system, per se,, although it results in one. It combines the principles of botanical taxonomy with dewey decimal cataloguing, as a means of identifying typefaces in the wild.</p>"
