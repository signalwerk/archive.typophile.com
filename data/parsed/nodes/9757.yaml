    html: "<p>I agree with everything John says, and I want to emphasize that systems of classification are also systems of thought. <br> <br>Most of us inherit our basic notions of taxonomy or classification from our high school biology classes, where species slot neatly into the gigantic Linnaean tree of species, genera, phyla, families, and kingdoms, and you can unambiguously differentiate and classify individual organisms based on morphological characteristics via field guides or binomial keys. <br> <br>The thing is, in certain areas of biology, this system causes more problems than it solves. My mother's a mycologist, and it turns out that genetic analysis is a much more reliable indicator of what constitutes a species than looking at characteristics visible to the naked eye. The vast majority of mushrooms are small, brown and slimy, and telling them apart without a microscope is often impossible. The problem is that identification via genetic markers takes the painstakingly-built, orderly \"traditional\" species tree, and replaces it with a messy network of organisms, where the size, color, and shape of a fungus is not necessarily a reliable indicator of its relationship to other fungi. As a result, amateur mycologists (who are generally observant, fussy, and in possession of a ton of hands-on field experience) get into passionate and sometimes vitriolic arguments with professional mycologists over what species something is all the time. Their classification systems are colliding, and the amateurs get frustrated that their common-sense notions of how to identify mushrooms are being refuted by something that doesn't make a lot of sense to them. That doesn't mean professional mycologists are condescending eggheads (well, it doesn't mean they're *necessarily* condescending eggheads), they're just facing the problem at a different level. <br> <br>The problem for typographers is the same one facing any other technical practitioner: we need some way of talking to each other about what we're doing. All classification systems are essentially arbitrary at their roots; typography has a 500+-year history in the West, and is a history of tiny tweaks to familiar forms. Classification is a form of shorthand. It's what allows a working designer or typographer to say, \"I'm redesigning a newsletter and I need a good humanist sans for captions\". <br> <br>The existing system of type classification (i.e. the one we all use here from day to day) is a mess, but it does have the advantage of being shared. John, there's a lot of value in tying type to its cultural context, but historical schemes get increasingly sketchy the closer you get to the present day. Also, at that point you're off-loading the problem of categorization and classification to the art / culture critics who name artistic movements, often long after the fact. Basically everything that happened after about 1940 is either \"modernist\" or \"postmodernist\", and that covers a huge range of innovation in type. Not to mention that the only working definition of post-modernist type I've ever been able to come up with is, \"stuff that appeared in Fuse or Emigre\". <br> <br>That said, it seems like most of the time we work mostly by analogy: \"I want a sans that goes well with Trajan. I already looked at Optima, TheSans, and Officina Sans and they're all too plain.\"</p>"
