    html: "<p>Thanks for the the feedback by the way. This thread has exceeded the informaton which I wanted, but has led to other questions that I need to be asking myself about type. <br> <br>I am studying graphic design and I have become interested in typography and type design. I started this thread because I wanted to understand  font classification that exists. After stumbling on this site I have been introduced to an emourmous number of new typefaces and I would like to ask you another question: <br> <br>I respect the fact that many of you are type designers who make a living from creating new typefaces. But is creating \"Font B with a different x-height\" of any use to me as someone solving visual communication problems? <br> <br>I've heard of designers using only 8 typefaces throughout their entire career. Personaly I believe that each job requires the right font for it to communicate propperly and this requires a much wider range of typefaces.  <br> <br>However, the more I am exploring type design the more I am finding very similar designs which I believe I will never use. You could argue that such an overwealming number of typefaces is overcomplicating the design process.  <br> <br>I don't mean to offend anyone here but I am trying establish whether I (as a graphic designer not a type designer) I should be spending time looking at typefaces which are identicle in the eyes of our target audience, the public.</p>"
