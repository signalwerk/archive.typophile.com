    html: "<p>&gt;Jonathan Hoefler's \"On Classifying Type\". <br> <br>He makes the point that type designers are always trying to create new typefaces to \"fill in the gaps\". They are also trying to invent new gaps to fill in. <br> <br>So part of the reason for classification systems to exist (in whatever form, even without words, inside typographer's heads) is to stimulate new type designs, and then to help understand how they fit in with what's gone before. <br> <br>Regarding the \"over\" abundance: you can't have a few good new successful designs without a lot that fall by the wayside. (some of which, undeservedly so). The strange thing about digital media is that the warehouse and the museum are the same thing: the stuff that never sells is not melted down and the materials recycled, it remains on the catalog -- hence the gazillions of fonts to confound the neophyte. I once took a face of mine that didn't sell much (and that i didn't particularly like) off the market, and of course, a distributor soon emailed me that a cutomer wanted it.  <br> <br>And you never know what the market will do. One of my earlier faces that has hardly sold for 7 years has recently started to sell regularly. Beaufort, a sans serif with small serifs, one of those \"fill in the gaps\" ideas, or, as Allan Haley once said (of another typeface) \"the answer to a question that no-one asked\". <br> <br>In that case, does the answer provoke the question? <br>Or was the question coming anyway, but the answer just arrived first?</p>"
