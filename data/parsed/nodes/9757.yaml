      2. las que ya no estan disponibles<br>
      3. aquellas que son buenas para 'la letra chica'<br>
      4. las que has usado la semana pasada<br>
      5. aquellas que te recuerdan a tus ex amantes<br>
      6. las fabulosas<br>
      7. las de formato desconocido<br>
      8. aquellas incluidas en la presente clasificación<br>
      9. aquellas que has olvidado<br>
      10. innumerables<br>
      11. aquellas que son demasiado livianas para usar en este trabajo<br>
      12. etcétera<br>
      13. aquellas en las que la 'g' simplemente se ve mal<br>
      14. aquellas que serán usadas para componer esta lista</p>
