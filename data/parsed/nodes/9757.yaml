      <p>John: I like the Borgesian stuff.  But this calls for the Andrades.</p>
      <p><cite>Quando se diz que um rio corre para noresto, não se que evidentemente indicar que o curso do rio seja invariavelmente êsse, nem que o rio não tenha outras coisas ineressantes senão a direção de seu curso. Nem que não possa e deva ser encarado sob outros aspectos. Nem que baste saber a sua direção para o conhecermos. Nada disso. Mas a orientação geral é essa, e indicando-a já damos do rio uma noção vaga mas exata.</cite> (Os Andrades, I, O Jornal, 29.I.1928)</p>
      <p>Rough translation:<br>
      When it's said that a river runs to the northeast, it's not said to indicate that the course of the river be invariable so, nor that the river doesn't have other interesting things, but rather that the direction of its course is that. Nor that it's not possible nor should be seen by other means.  Nor that it suffices to know its direction to be familiar about it.  Not at all.  Rather the general orientation is that, and by indicating it we get a vague yet exact notion of the river.</p>
      <p>Classification obligates generalization, which is a necessary evil at times I think.  Sometimes saying "I want a Didone" is far more effective and conjures up a clearer picture then "I want a font that has vertical stress, extremely high contrast, with slab serifs that doesn't have motifs or flourishes and decidedly modern" (which of course just generalized modern ha).</p>
