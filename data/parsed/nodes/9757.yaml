    html: "<p>The problem, Marc, is that most of the terms we use with great confidence when discussing type are actually pretty woolly in their definitions. They're based on things we know when we see, like Nick was saying. <br> <br>All of my reference books are at my studio, so I can't give you an exact history or definition of \"humanist\". I will say that when it's applied to contemporary sans serif typefaces (as in, \"Oh great, another humanist sans\"), it refers to typefaces devised with an emphasis on legibility and gently modulated stroke widths derived from calligraphy. I think the archetypal humanist sans is Optima, but these days its contrast seems somewhat extreme. <br> <br>\"Neo-Grotesque\" is easier: neo-grotesques are the line of sans serif typefaces that owe their ultimate derivation from Akzidenz Grotesk and the other \"commercial\" sans serif typefaces from the turn of the 20th Century: rational, legible forms, low contrast, consistent stroke widths (although neo-grotesques aren't generally monoline), a strong vertical emphasis. Helvetica and Univers are the definitive neo-grotesques.</p>"
