  - id: 62234
    user: 5605
    date: 2005-03-17T11:32:00
    date_raw: 17 Mar 2005 — 11:32am
    votes: null
    html: "<p>Barbedor doesn't really look that much like Lydian (or Stahl, Rudolf Koch's also unjustly-neglected take on calligraphic, humanist sans, which is currently only available via <a href=\"http://www.romana-hamburg.de/\">Gerhard Helzel</a>). It looks more like a vertical take on cursive or italic forms, a chancery-influenced semi-serifed script. I agree, it's beautiful. <br> <br>After reading <a href=\"http://www.stbride.org/conference2002/TypefaceClassification.html\">Catherine Dixon's essay</a> on typeface classification, I'd say the classification scheme she proposes is a concrete implementation of my own  more inchoate ramblings. It combines sources (i.e. history) with formal attributes, and explicitly includes the notion of an unbounded list of type \"patterns\" (e.g. \"textura\" or \"garalde\") that are themselves combinations of sources and formal attributes. I personally like this as it reminds me of one of my favorite patterns of object-oriented software development: creation of new objects through the cloning of prototypes. <br> <br>Raph, to return to mycology for a moment, the problem with DNA-based identification is that genetic analysis is still (and probably always be) an inexact way to discuss the origins and derivation of species. While we can learn a lot about where mushrooms come from by analyzing their genes, things like parallel and convergent evolution make it very difficult to build a comprehensive picture of the history of fungi from their genes alone. DNA will reliably give us the identity of an individual organism, but each step you take way from establishing identity gets you into ever-more-dubious waters. <br> <br>The analogy to type is clear: especially in this, the High Era of the Humanist Sans, design constraints are going to result in the persistent reinvention and reuse of seemingly distinctive design features, and the intersection of craft and commerce means that people are still going to have to defend themselves from claims of plagiarism and uncredited influence (which are often properly made, but also often not: I honestly think the Today / Cronos kerfuffle of a few years ago is a good example of where this may be undecidable to outside observers). <br> <br>So yes, most fonts are small, brown, and slimy, and a classification system like Catherine Dixon's is never going to definitively affix a typeface in its proper place in history. It might, however, allow all of us to have a more meaningful conversation about our tools and our craft, which has a lot of value. I'd love to see her scheme adopted as a standard. <br> <br>Marc, it's entirely possible for a designer to build their career upon a very short list of typefaces. Jan Tschichold managed to reduce his list to one item near the end of his career, believing there was no problem in book design his own typeface Sabon couldn't solve. Derek Birdsall has gotten a lot of mileage out of Gill Sans, Van Dijck, Poliphilus, and Blado. For a long time Neville Brody used his own display typefaces almost exclusively. <br> <br>However, if you start browsing the Web for designers' lists of \"essential typefaces\", you'll quickly realize there's a disturbing lack of consistency among them. Typefaces, as products of premeditated acts of creation, inescapably have their own personalities, and different people will respond to different personalities. I personally think Gill Sans, Clarendon, American Uncial, and Wilhelm Klingspor Gotisch are typefaces all designers should have available to them (among others), but I don't expect many other designers to share this conviction. Obsessively prowling through specimen books or font websites can be a distraction and cloud designers' minds when they should be working on other things, but it can also be its own reward. The best way to learn about type is to play with it and work with it, and if you just take somebody else's recommendations on faith, you'll miss a lot of opportunities for creative design.</p>"
    html_clean: "<p>Barbedor doesn't really look that much like Lydian (or Stahl, Rudolf Koch's also unjustly-neglected take on calligraphic, humanist sans, which is currently only available via <a href=\"http://www.romana-hamburg.de/\" class=\"link-external\">Gerhard Helzel</a>). It looks more like a vertical take on cursive or italic forms, a chancery-influenced semi-serifed script. I agree, it's beautiful. <br> <br>After reading <a href=\"http://www.stbride.org/conference2002/TypefaceClassification.html\" class=\"link-external\">Catherine Dixon's essay</a> on typeface classification, I'd say the classification scheme she proposes is a concrete implementation of my own  more inchoate ramblings. It combines sources (i.e. history) with formal attributes, and explicitly includes the notion of an unbounded list of type \"patterns\" (e.g. \"textura\" or \"garalde\") that are themselves combinations of sources and formal attributes. I personally like this as it reminds me of one of my favorite patterns of object-oriented software development: creation of new objects through the cloning of prototypes. <br> <br>Raph, to return to mycology for a moment, the problem with DNA-based identification is that genetic analysis is still (and probably always be) an inexact way to discuss the origins and derivation of species. While we can learn a lot about where mushrooms come from by analyzing their genes, things like parallel and convergent evolution make it very difficult to build a comprehensive picture of the history of fungi from their genes alone. DNA will reliably give us the identity of an individual organism, but each step you take way from establishing identity gets you into ever-more-dubious waters. <br> <br>The analogy to type is clear: especially in this, the High Era of the Humanist Sans, design constraints are going to result in the persistent reinvention and reuse of seemingly distinctive design features, and the intersection of craft and commerce means that people are still going to have to defend themselves from claims of plagiarism and uncredited influence (which are often properly made, but also often not: I honestly think the Today / Cronos kerfuffle of a few years ago is a good example of where this may be undecidable to outside observers). <br> <br>So yes, most fonts are small, brown, and slimy, and a classification system like Catherine Dixon's is never going to definitively affix a typeface in its proper place in history. It might, however, allow all of us to have a more meaningful conversation about our tools and our craft, which has a lot of value. I'd love to see her scheme adopted as a standard. <br> <br>Marc, it's entirely possible for a designer to build their career upon a very short list of typefaces. Jan Tschichold managed to reduce his list to one item near the end of his career, believing there was no problem in book design his own typeface Sabon couldn't solve. Derek Birdsall has gotten a lot of mileage out of Gill Sans, Van Dijck, Poliphilus, and Blado. For a long time Neville Brody used his own display typefaces almost exclusively. <br> <br>However, if you start browsing the Web for designers' lists of \"essential typefaces\", you'll quickly realize there's a disturbing lack of consistency among them. Typefaces, as products of premeditated acts of creation, inescapably have their own personalities, and different people will respond to different personalities. I personally think Gill Sans, Clarendon, American Uncial, and Wilhelm Klingspor Gotisch are typefaces all designers should have available to them (among others), but I don't expect many other designers to share this conviction. Obsessively prowling through specimen books or font websites can be a distraction and cloud designers' minds when they should be working on other things, but it can also be its own reward. The best way to learn about type is to play with it and work with it, and if you just take somebody else's recommendations on faith, you'll miss a lot of opportunities for creative design.</p>"
