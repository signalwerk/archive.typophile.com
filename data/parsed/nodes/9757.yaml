      <p>Matthew: <em>Classification obligates generalization, which is a necessary evil at times I think. Sometimes saying "I want a Didone" is far more effective and conjures up a clearer picture then "I want a font that has vertical stress, extremely high contrast, with slab serifs that doesn't have motifs or flourishes and decidedly modern" (which of course just generalized modern ha).</em></p>
      <p>I have no objection to generalisation nor to labelling, but I do object to an inconsistent and overlapping set of labels being touted as a classification system. It isn't a system, it's just a set of names applied to variously defined categories. I can detect at least five different ways of defining categories in the ‘classifications’ that Jared (blkkkkk) posted.</p>
