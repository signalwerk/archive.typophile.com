    html: "<p>Forrest: I found your mushroom analogy interesting. Would it also be fair to say that the vast majority of fonts are small, brown, and slimy? <br> <br>To continue your analogy, the concept of species makes <i>sense</i> for organisms. In most cases, analyzing the DNA gives you a definitive answer. Perhaps a different answer than an amateur mycologist would get get by looking at the color and shape, but an answer nonetheless. <br> <br>I think fonts want to be grouped into classifications because they're all copied from other fonts. I like terms such as \"garalde\" (meaning copied from Garamond and Aldus) because they capture this truth. <br> <br>The problem is that you choose a dozen or so seminal fonts, from which a plurality or even majority of other fonts are copied, but that inevitably leaves out a significant minority. I don't think there's any good hierarchical solution to this problem. <br> <br>I suggest naming the fonts that served as inspiration. To me, <a href=\"http://www.lucasfonts.com/cgi-bin/loadframe/lucasfnt/thesans/sans-.html\">TheSans</a> is Frutiger with Eras-y curves and a two-story 'g'. <a href=\"http://www.lucasfonts.com/cgi-bin/loadframe/lucasfnt/spiegel/spiegel-.html\">Spiegel</a> is clearly Franklin Gothic with the trademark Luc(as) curve treatment. The curves and the underlying letter architecture contribute equally to the distinctive character of the font, but in any classification scheme you'd be forced to choose one as the primary defining characteristic. <br> <br>I get the feeling that the tendency to find generic classification terms comes largely from a reluctance to acknowledge the sources for a font design, and a general touchiness about trademarks. Consider, for example, the fact that almost all of <a href=\"http://www.myfonts.com/browse/foundry/bitstream/\">Bitstream</a>'s early catalog was copies of popular typefaces, with the name filed off and replaced by a generic classification term such as \"Swiss\" or \"Aldine\", with a 3 digit number added to make it all sound much more systematic. Even so, there are plenty of questionably categorized fonts: would you call <a href=\"http://www.myfonts.com/fonts/bitstream/geometric-415/\">Metro</a> a Geometric? <br> <br>Gotham is a larger x-height Avenir, which is Futura by the hand of Frutiger. Calling it a \"Geometric Sans\" loses specificity, but on the other hand avoids the possibility of running into trademark problems.</p>"
