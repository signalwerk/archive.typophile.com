      <p>Read most of the comments in this forum. Interesting stuff.</p>
      <p>But I am a user of fonts, and a would be designer. I designed the font for my business, and had my wife render it for me when it was all done in pen &amp; ink (the 1980's, in this case).</p>
      <p>I sell promotional products, and am often trying to find the font someone used for their logo so I can either quickly remake their logo (if it is simple enough, I can often do it quicker than asking them and getting a good/better/acceptable version of it (and, actually, most of the time, they cannot provide me with one).</p>
      <p>Also, my attempts are at getting business with many new clients, over the internet. And showing them a virtual sample of a product I would like to sell them with their logo (or at least a font used in the headline on their website) is what I am working to try to do VERY QUICKLY! (for not all will buy).</p>
      <p>But I am becoming ever more proficient at my task (at hand).</p>
      <p>When I am trying to find what font is what, I don't care about the history of it. I simply want to find the font! (Pragmatic).</p>
      <p>If you want on another forum and at another time sit down with me and discuss Judeo-Christian religion (or any/all religion, for that matter), I believe I could give anyone here or anywhere a pretty interesting viewpoint on what came from where, and why, and how.</p>
      <p>Or, if you want to discuss where people come from, taking into account both the great and minor migrations of tribes, ethnicities, etc, why they moved, and the ultimate purpose/s of them, I would love to both learn from you and convey to you some of my ideas on the topic.</p>
      <p>And of major interest to me and perhaps many of you, I can tell you (IMO) major things that have and are contributing to the growing economic depression, without hardly even talking about money, I think I could make more than a few of you sit up and listen, though you may tire of me quickly in this vein, because we all have to look in the mirror hard when considering some issues.</p>
      <p>BUT WHEN I WANT TO FIND WHAT FONT IS WHAT - I am more interested in knowing which serif font has a thingy on top of the 'g' that bends this way or that; or which fonts have capital 'C's' that have a top serif that goes straight up and down, and whether that serif ascends at all, or only descends; and if the bottom end of that same 'C' has a serif or not. Which serif fonts do have certain attributes for a given upper or lower case character, and which do not.</p>
      <p>I think that some kind of a format whereby individual characters within a font could be compared to each other quickly and easily, that would help a lot!</p>
      <p>If we knew, for example, the x-height proportions of any given font, that would help a lot!</p>
      <p>Don't get me wrong, I am really interested about the history, evolution, contributions, stealings, borrowings, etc of given attributes of one font to another, of one designer from another, etc. IT IS JUST THAT WHEN I AM ON THE CLOCK (for myself), AND HAVE TO TURN A LOT OF DOLLARS FOR MYSELF - I MORE OFTEN THAN NOT COULD REALLY USE SOMETHING SUPER EFFECTIVE &amp; EFFICIENT in finding that very elusive FONT - so I can USE that Fabulously Ontologically Nifty Thing (or F.O.N.T.)!</p>
      <p>Thanks!</p>
