    html: <p>I would say it's a high-contrast Lydian copy, though no doubt some would find that offensive :<a href="http://just.kidding/dude"></a>) <br> <br>More seriously, the assertion that <i>all</i> fonts are copies of other fonts is an overstatement. But I think it is important to acknowledge the strong influences from fonts that have gone before. I did <i>not</i> mean to trivialize the process of designing fonts. Doing something <i>well,</i> no matter how much invention is involved, always commands admiration. <br> <br>I also think that truly original fonts are also the ones least likely to benefit from being pigeonholed by any classification scheme, except to the extent of acknowledging the fact that they're "postmodern" or "exotic".</p>
