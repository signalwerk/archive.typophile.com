      <p>That is reprehensible, and I don't doubt that things like this are prevalent.  It is no different than copying any other copyrighted material, which I am unfortunately also familiar with.  For example, my partner is a photographer, and shot a gig for a magazine at a restaurant.  Said magazine signed a contract for these images for editorial use.  The next month, the restaurant "borrowed" one of the images from the magazine for an ad it was running in that magazine. And when contacted, couldnt understand the problem! </p>
      <p>It's absolutely maddening.  Because although there is technically recourse, for someone on their own, it's next to impossible.  Unless the guilty parties are suddenly overcome with a conscience,  of course.</p>
      <p>So, what im trying to say is: That is terrible, and I understand!</p>
