      <p>Here is a prime example</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Pouty_4276.jpg"></div><p></p>
      <p>I originally called this Jennifer after my first daughter. It ended up being called Pouty (Fontbureau 1999), my daughter's choice! Conflict with Jennifer Lopez. Long story. Anyway I was on <a href="http://www.fonts101.com" title="www.fonts101.com">www.fonts101.com</a> and lo, and behold, there is Bolero... my font Pouty. And there had been 90 some free downloads. Worse yet, Alexandra whatever from Russia had copyrighted Pouty as Bolero and was giving it away. It's now up to 170 downloads and the people on the site are calling me an asshole because I protested. Go figure. Wanna guess what my royalty losses are?</p>
      <p>So I am a bit sensitive to the name changes etc.</p>
      <p>P.s. These are the original drawings with notes.</p>
