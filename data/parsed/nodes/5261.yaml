  html: <p>I have to design letterhead and business cards for someone and they have two address's that they want to show on each thing, so it is a bit awkward compared to a standard letterhead and card.  <br> <br>I was wondering if anyone has had to do this before or knew of any examples online that may give me some ideas on how I could layout this much information on these pieces. Any advice would be much appretiated. <br> <br>Thanks!</p>
