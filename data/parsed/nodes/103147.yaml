      <p>Can't find a match and doubt there'll be one. This kind of woodmark is most of time hand-drawn or heavily customization of an existing typeface. It loosely reminds me of <a class="freelinking external" href="http://www.myfonts.com/search/clearface" rel="nofollow">Clearface</a> and <a class="freelinking external" href="http://www.myfonts.com/search/cheltenham" rel="nofollow">Cheltenham</a> but that's far from being even close.<br>
      If you need as vector, you'll find it <a class="freelinking external" href="http://www.brandsoftheworld.com/search/logo?search_api_views_fulltext=cruzcampo" rel="nofollow">here</a>, freely available to download.</p>
