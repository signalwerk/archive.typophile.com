  html: |-
    <p>Hi all,</p>
    <p>I've created a typeface that has a swash on the uppercase. I want to create alternate uppercase glyphs without the swash that will be used as a default after an initial cap. Problem is, I'm not sure how to create them so that they're interpreted by a design program in the correct way.</p>
    <p>I'm still learning Fontlab but have created three weights, set the metrics, kerned and included ligatures – this is my last stumbling block so I'd really appreciate the help.</p>
    <p>Thanks everyone</p>
    <p>Stew</p>
