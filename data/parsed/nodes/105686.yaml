    html: |-
      <p>From your description it sounds like you have swashes on the default form of the caps? If so, the following would work.</p>
      <p>feature calt {<br>
      sub [@Swash @NoSwash] @Swash' by @NoSwash;<br>
      } calt;</p>
      <p>Where @Swash and @NoSwash have been defined to to include your default caps and your swashless caps, respectively.</p>
      <p>I'd suggest, though, that it would be better to use your swashless forms as the default and then include</p>
      <p>feature swsh {<br>
      ignore sub [@Letters] @NoSwash';<br>
      sub @NoSwash' by @Swash;<br>
      } swsh;</p>
      <p>Where @Letters is the set of all upper and lowercase letters defined in your font. This would provide a (IMO) more intuitive interface where swashes are turned on by activating them rather than turned off by deactivating contextual alternates.</p>
      <p>André</p>
