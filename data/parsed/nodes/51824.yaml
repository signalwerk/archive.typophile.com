    <p>I've looked through script and handwritten fonts until I'm seeing them in my sleep -- Veer, MyFonts, Fontshop, etc.</p>
    <p>Any leads on what font this might be? Or where I might search for a font like this.</p>
    <p>It's just so appropriate for a logo I'm working on -- friendly and retro, but strong, clean and legible.</p>
    <p>Do you think it was hand rendered?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/arnolds_logo_4152.jpg"></div><p></p>
