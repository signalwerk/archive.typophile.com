      <p>Design Guy</p>
      <p>I would say custom. There are variations in the exit strokes of the letters that lead me to that conclusion. Plus the weights and x-heights are all over the place. But with open type I could end up with egg on my face as opposed to bread.</p>
      <p>Michael</p>
