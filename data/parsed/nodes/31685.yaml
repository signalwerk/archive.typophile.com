    html: |-
      <p>BUSINESS CARD:<br>
      The rule,T,E,W are added elements. If you removed them, would the viewer still know what the information was? The titling-characters are useful when there are several items of similar nature. I bet someone knows what sequence of numbers containing the @ means much more easily than a stand-alone (E). They would know what a sequence ending with (.com) means. If you had only one sequence numbers seperated with (.) and in the 3.3.4 combination, someone has been exposed to this enough to deduct that it is most-likely not your fascimile. I say this, because the mark is so beautifully simple everything else should follow suit or deviate for a reason.</p>
      <p>MONOGRAM:<br>
      Very interesting. Looks great reversed and normal. Did you try to create it out of pixels(squares).</p>
      <p>TYPE:<br>
      The numerals are too large. They do not flow. I would suggest reducing them a 1/4 point. It looks like you spent much more time on your mark than you did on type-setting and any other graphic elements.</p>
      <p>COLOR:<br>
      Colour is such an important element in user-interaction within electronic medium. Why was it ruled out? </p>
      <p>TAGLINE:<br>
      I know what you are trying to say. It is true, but it worries me. Some will see it as craftsmanship. Others will see it as "She's so crafty". You're at the mercy of the left-brainer's employ and the word craft may mean "artsy, creative, tinkering". Probably not your intent. This very word may prove to have a negative impact on trying to convince someone the worth of your consultation, knowledge, etc.. You may lump yourself into the category (kid-nextdoor), regardless of your age. </p>
      <p>You must consider the visualization of each individual word. What will your audience see when they read "crafting"? Crafting works well in this forum, but how would it be perceived by someone reading the Harvard Business Journal. That person may have 150k allocated for their corporate site. Wouldn't you want to be on their short-list?</p>
    html_clean: |-
      <p>BUSINESS CARD:<br>
      The rule,T,E,W are added elements. If you removed them, would the viewer still know what the information was? The titling-characters are useful when there are several items of similar nature. I bet someone knows what sequence of numbers containing the @ means much more easily than a stand-alone (E). They would know what a sequence ending with (.com) means. If you had only one sequence numbers seperated with (.) and in the 3.3.4 combination, someone has been exposed to this enough to deduct that it is most-likely not your fascimile. I say this, because the mark is so beautifully simple everything else should follow suit or deviate for a reason.</p>
      <p>MONOGRAM:<br>
      Very interesting. Looks great reversed and normal. Did you try to create it out of pixels(squares).</p>
      <p>TYPE:<br>
      The numerals are too large. They do not flow. I would suggest reducing them a 1/4 point. It looks like you spent much more time on your mark than you did on type-setting and any other graphic elements.</p>
      <p>COLOR:<br>
      Colour is such an important element in user-interaction within electronic medium. Why was it ruled out? </p>
      <p>TAGLINE:<br>
      I know what you are trying to say. It is true, but it worries me. Some will see it as craftsmanship. Others will see it as "She's so crafty". You're at the mercy of the left-brainer's employ and the word craft may mean "artsy, creative, tinkering". Probably not your intent. This very word may prove to have a negative impact on trying to convince someone the worth of your consultation, knowledge, etc.. You may lump yourself into the category (kid-nextdoor), regardless of your age. </p>
