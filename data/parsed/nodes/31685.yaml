      <p>Addison, using a blow up of a type-based design to determine whether the type needs adjusting is very hard. The way I go about is by using a magnifying glass upside-down, effectively reducing the image.</p>
      <p>Don't laugh, consider that you this way you multiply the resolution of the print AND can see what the design looks like in RL.</p>
      <p>Another good trick is holding your print upside down and looking thru your lashes. Inner spaces and letterspacing become cleare that way.</p>
      <p>Just my 2 bits.</p>
