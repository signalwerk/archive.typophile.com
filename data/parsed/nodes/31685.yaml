    <p>This is something I've been driving myself insane over for the past few months -- I'm simply looking for guidance and advice, or whether or not I should even pursue this direction...</p>
    <p>I started my freelance business close to two years ago. At the time I wasn't too concerned with my identity (big mistake) so I quickly created something that I've had trouble living with lately. I've already <a href="http://typophile.com/node/15365" rel="nofollow">questioned it once here on typophile</a>. Since then, I've constantly tinkered and doodled trying to come up with something new, and I've finally come up with a mark that I'm happy with -- at least I think so.</p>
    <p>My business has migrated almost entirely into website design and development, and I'm one of those standards-based nuts. I want to give a feeling of pride and craftsmanship about my work -- you know, the little guy who sits in his shop and creates handmade goodness -- but I want to avoid the web 2.0 look.</p>
    <p>Any and all comments are most appreciated.</p>
    <p>Thanks,<br>
    Addison</p>
