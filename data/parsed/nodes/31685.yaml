      <p>I've posted my final art before going to press (see the attachments in the first post: final_bcards_labels.gif), but I have one last question...</p>
      <p>I always like to get my wife's opinion on work -- mainly to see how things look to a non-designer. Her only remark was that the address and city, as well as the phone and website, needed some sort of separator. I tried to find some other examples and ultimately referred to Bringhurst's Elements. If I understand correctly, he seems to recommend a middot or a virgule (forward slash) as a "sign of separation". In my last attachment, you'll see that I've tried both of these approaches. I'd love to hear some other thoughts on this before I shoot this off to the printer.</p>
      <p>Whatever treatment I use on the business card will carry over to the label.</p>
      <p>I've also managed to get <a href="http://addisonhalldesign.com" rel="nofollow">my website redesigned</a> with the new look. I redrew the logo in pixels and am fairly pleased with the results.</p>
      <p>Thanks,<br>
      Addison</p>
      <p>BTW, those bread tins are awesome!</p>
