  html: <p>In honor of the Red Sox' world series glory <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">, I've been searching frantically for their logotype.  I understand it was made way back in the day before typefaces were used for jerseys, but I came across an <a href="http://www.typophile.com/forums/messages/83/6817.html#POST13126">old thread</a> that mentioned Dennis Ortiz-Lopez's <a href="http://ortiz-lopez.com/OLP06.html">Red Sox</a> font.  It's beautiful and exactly what I'm looking for, but I can't find it anywhere except for that thread, and it's just making me want it more.  Do you guys have any info on this font or anything else really close to it?</p>
  html_clean: <p>In honor of the Red Sox' world series glory <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">, I've been searching frantically for their logotype.  I understand it was made way back in the day before typefaces were used for jerseys, but I came across an <a href="http://www.typophile.com/forums/messages/83/6817.html#POST13126">old thread</a> that mentioned Dennis Ortiz-Lopez's <a href="http://ortiz-lopez.com/OLP06.html">Red Sox</a> font.  It's beautiful and exactly what I'm looking for, but I can't find it anywhere except for that thread, and it's just making me want it more.  Do you guys have any info on this font or anything else really close to it?</p>
