    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Foundry-Gridnik_edit_6397.png"></div><p></p>
    <p>Monotype is now the exclusive provider of more than 100 typefaces from The Foundry, a U.K.-based typeface design studio owned and operated by typeface designers, David Quay and Freda Sack. The Foundry is known for premium-quality typefaces, with designs that have been sought and used by ad agencies, businesses and design professionals across the globe. </p>
    <p>The Foundry collection features a range of serif, sans serif and display typefaces. Examples of typefaces in the collection include the <a class="freelinking external" href="http://www.fonts.com/font/the-foundry/foundry-sans " rel="nofollow"> Foundry Sans™</a> family, inspired by the humanistic aspects of the Stempel Garamond™ serif typeface, and the <a class="freelinking external" href="http://www.fonts.com/font/the-foundry/foundry-gridnik " rel="nofollow"> Foundry Gridnik™</a> design, created in conjunction with renowned Dutch graphic designer, Wim Crouwel, based on his 1960s sketches for typewriter use.  </p>
    <p>View and Download The Foundry typefaces on Fonts.com – <a href="http://bit.ly/1f9Hrz7" title="http://bit.ly/1f9Hrz7">http://bit.ly/1f9Hrz7</a><br>
    Read more about The Foundry typefaces – <a href="http://bit.ly/1gnNo0I" title="http://bit.ly/1gnNo0I">http://bit.ly/1gnNo0I</a></p>
