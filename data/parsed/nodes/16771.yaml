      <p>Thanks for the correction, Adam, but I actually understand the concept (although I may not have explained myself very well!)</p>
      <p>Let me try again.</p>
      <p>This kind of "pronounciation" emphasis is no different than the emphasis that writers and editors use when they "highlight" a word or phrase in bold, Italic, or caps. It is a text decision, made by the writer, which he/she executes by formatting. The only difference is that it is a single character or syllable that is being emphasized.</p>
      <p>A "stress font" should contain every character with an acute accent over it.</p>
      <p>Therefore, text set in a stress font would behave ordinarily when reset in an ordinary font.</p>
      <p>The text would be searchable and hyphenatable, but you'd have to apply Optical Kerning over the "cross-font" pairs.</p>
      <p>Also, it would be easier for writers to select e.g. the "Minion Stress" font to stress a glyph, rather than to drill down to an OT stylistic set, which is the more likely behaviour of typographers.</p>
