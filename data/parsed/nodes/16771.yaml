      <p><cite>In Spanish and Dutch, the acute accent is used to disambiguate certain words which would otherwise be homographs. In Spanish, this covers various question word / relative pronoun pairs, such as cómo (interrogative how) &amp; como (non-interrogative how), dónde &amp; donde (where), and some other words such as tú (you) &amp; tu (your), él (he/him) &amp; el (the); in Dutch, this is mainly één (one) &amp; een (a/an).<cite></cite></cite></p>
      <p><cite><strong>In Dutch, the acute accent can also be used to emphasize an individual word within a sentence.</strong> For example, "Het is ónze auto, niet die van jullie." ("This is our car, not yours.") In this example, "ónze" is merely an emphasized form of "onze".<cite></cite></cite></p>
      <p>Interestingly it isn't letters being changed in the example but rather one.</p>
      <p><cite>In Danish, the usage of the acute accent is very similar to the Dutch usage, for example én (one) vs. en (a/an) and fór (went) and for (for). It can also be used for emphasis, especially on the word der (there), ex. "Der kan ikke være mange mennesker dér," meaning "There can't be many people there" or "Dér skal vi hen" meaning "That's where we're going".<cite></cite></cite></p>
      <p><cite>In Norwegian, the acute accent is similar to Danish. In Norwegian bokmål, it is also used for the imperative form of verbs ending in -ere, which lose their final e and might look like plurals (most often ending in -er) of some noun: kontrollér is the imperative form of "to control", kontroller is the noun "controls". The simple past of the (disused) verb å fare, "to travel", is fór, to distinguish it from for ("for" as in English).<cite> </cite></cite></p>
      <p><cite>Many words of French origin retain an acute accent, such as allé, kafé, idé, komité, diskré. Popular usage can be sketchy and often neglects the accent, and there exists a certain degree of interchangeability with the grave accent.<cite></cite></cite></p>
      <p><cite>In Swedish, the acute accent used only for the letter e, mostly in words of French origin and in some names. It is used both to indicate a change in vowel quantity as well as quality and that the stress should be on this, normally unstressed, syllable. Examples include café ("café") and resumé ("resumé", noun). There are two pairs of homographs that are differentiated only by the accent: armé ("army") versus arme ("poor; pitiful", masculine declination) and idé ("idea") versus ide ("winter quarters").<cite></cite></cite></p>
