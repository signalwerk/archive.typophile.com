      <p>Some things I know about the usage of accents in the Dutch language.</p>
      <p>The accents are mainly used to emphasize the sound of words. Example: Dit is ónze website / This is oúr website.<br>
      We usually don't use acutes with caps. You will not see words like 'Één (meaning '1'), but 'Eén'.<br>
      We don't use acute on numbers. But because we write the numbers 1-10 as words, we write (1) as één. This because we have a word 'een' (meaning 'a').<br>
      Most accents we use are on french words. Damn them. :D  All french words that are beeing taken over in the dutch language loose their accents. Only in case of pronounciation the accents might be kept.</p>
      <p>Because of technical limitations the second accent in the word 'jij' can't be used. Write this word as 'jíj'. </p>
      <p>What we dó use more often is the dieresis for words like 'officiële' (meaning 'official'), or 'skiën' (meaning 'skiing'). We do this in two cases:<br>
      1  to read the vowels seperate from eachother. We write 'reünie' because we read and pronounce 're-unie'<br>
      2  to verbalise the connection of multiple words (sorry, don't know the english word for this). Single verb 'olie' becomes 'oliën'. 'Financie' becomes 'financiën'.</p>
      <p>Perhaps these pages might help you out. I tried to look for english pages, but didn't find any. Perhaps you can decypher it when you read it:<br>
      <a href="http://www.mijnwoordenboek.nl/spelling-accent.php" title="http://www.mijnwoordenboek.nl/spelling-accent.php">http://www.mijnwoordenboek.nl/spelling-accent.php</a><br>
      <a href="http://woordenlijst.org/leidraad/4/1/" title="http://woordenlijst.org/leidraad/4/1/">http://woordenlijst.org/leidraad/4/1/</a><br>
      <a href="http://woordenlijst.org/leidraad/5/1/" title="http://woordenlijst.org/leidraad/5/1/">http://woordenlijst.org/leidraad/5/1/</a><br>
      <a href="http://home.hccnet.nl/c.phielix/" title="http://home.hccnet.nl/c.phielix/">http://home.hccnet.nl/c.phielix/</a><br>
      <a href="http://home.hccnet.nl/c.phielix/#accenttekens" title="http://home.hccnet.nl/c.phielix/#accenttekens">http://home.hccnet.nl/c.phielix/#accenttekens</a></p>
      <p>And yes Adam, Dutch stress ís about the fear of our dams breaking. We díd have that some years ago. You are só right. ;-)</p>
      <p>I hope this helps.</p>
      <p>Best regards,<br>
      ®ené</p>
      <p>*** <a href="http://www.characters.nl" title="www.characters.nl">www.characters.nl</a>  { Typography to express yourself } ***</p>
