    html: "<p>Accents are occasionally used even in English to specify pronunciation, e.g. in traditional poetical works to assist metre by clearly indicating that a typically silent vowel should be pronounced: belovéd. In this case, I would say that the accented <em>character</em> is very much part of the text and it should not be considered a layout issue. Linguistic stress is an aspect of language, not of typographic design, and if it belongs in a text it should not be something that can be lost through a change in formatting, e.g. switching to a different font.</p>"
