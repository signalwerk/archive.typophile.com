      <p>There appears to be a difference between prosody, involving a range of marks, and simple stress emphasis, where only one kind of mark is required (although some languages use the acute, others the dieresis).</p>
      <p>For simple stress emphasis, I wonder why the underscore is not used: it is a device which is supported at the word-processing level of the typographic production flow, font-independent. The only downside is that it's a bit messy with descenders, but that perception is probably a residual metal-type aesthetic, and not relevant with digital type.</p>
    html_clean: |-
