      <p>I *think* prosody is what is under discussion . . .</p>
      <p>The mark referred to as “Dutch Stress” is, I suspect, the ictus, used to denote stress in Latin languages. I don’t believe there is any such Unicode character. If you are going to do prosody, you minimally need an ictus, a longum (sort of a macron), and a breve. The breve is not the same as the accent, and does not look the same. I’ve always felt that they go over syllables, but practically speaking, you find a letter in the middle of the syllable &amp; put them there.</p>
      <p>Modern practice has generated all sorts of *symbols* to be used in the display and analysis of poetry (for example, in the journal POETICS TODAY). We now have a *reverse ictus* and hard &amp; soft syllable marks. None of these is in Unicode, and using a different character (acute, grave, macron etc.) seems to me equivalent of using the LATIN CAPITAL A for the Greek CAPITAL LETTER ALPHA – worse really, because they don’t even look quite right.</p>
      <p>But what to do . . .</p>
