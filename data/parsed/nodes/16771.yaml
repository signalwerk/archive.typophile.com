      <p>I really didn't master learning the language while I was there so my Dutch reading diet consisted mostly of newspaper headlines, billboards, posters, TV commercials, advertisments/marketing speak -- all of which are the kinds of places that I got the feeling it would be normal to throw a couple extra acutes above the vowels when necessary.</p>
