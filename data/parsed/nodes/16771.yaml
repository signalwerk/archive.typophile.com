      <p>If it's used for emphasis, it should be formatting.<br>
      After all, if one considers standard practice, the text is the same in Roman, Italic, and Bold.<br>
      Therefore, "dutch stress" should be a separate font.</p>
      <p>In fact, I think we're trying to cram too much into OpenType fonts. If a font has interesting, unique features, the foundry/type designer is quite literally burying them anonymously (down in the hierarchy of interface palettes) if they're put into a stylistic set (which BTW, a lot of end users still on Quark or CS1 don't have access to). It would be better to make a separate font, with an on-point, memorable name, and charge for this benefit accordingly.</p>
