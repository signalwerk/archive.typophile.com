    <p>Does anybody think it would be a good idea to deleop a 'locl' or 'ssxx' feature for 'dutch stress' the practice of putting acutes over letters &amp; numbers. From what I have read on typophile this practice is a bit like using an italic. </p>
    <p>Actually I have a bunch of questions about this:</p>
    <p>Is it done in these countties too? Denmark, Sweden, Norway, Finnland. Anywhere else? </p>
    <p>Do you know when the practice began?</p>
    <p>What impact if any do you think it should have on the design/coding of Opentype fonts? </p>
    <p>I think with TT &amp; PS a typographer had to manually kern them into place. Is that right? Or how did/does it work?</p>
    <p>Do you think Unicode should be expanded to allow these glyphs? From what I have read most people think this kind of thing should be done in Open type by using the 'ccmp' feature. </p>
    <p>Can anybody expand on my very limited understanding of use?  For instance, would a good dutch typgrapher choose italics in one case over what I am calling dutch stress in another? When &amp; Why? What would the choice mean - if anything? Could he use both italics &amp; dutch stress? If so, what would that mean? </p>
    <p>I have gotten the impression from texts that dutch advertising uses acutes that point all over the place. But I haven't seen it. I also imagine that for a text face dutch stress acutes should create a more unified feeling even if the angles shift to accomodate differences in glyph width. But without looking at examples it's all just speculation! So -Are there any images on the web?</p>
    <p>Thanks!</p>
