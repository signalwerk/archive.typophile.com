      <p>So Adam you are saying it is used only to distinguish words rather than as a way of setting off or emphasize a whole phrase. So the Whole Phrase or Whole sentance or Whole Paragraph model is mythic then? It doesn't exist? If so that would really change the way you would approach things technically. I got the idea that it could be a whole phrase from somewhere - I'll dig it up &amp; post it here. Ahhh here it is....</p>
      <p><cite><strong>peter bilak</strong> : Not only vowels, but also some consonants: jacute for example. It indeed is used for stressing the word, same like italics. Most often it is used in Advertising and in expressive text, not in handwriting, as far as I know. In words like JIJ (you), one could put an acute on all characters.<cite></cite></cite></p>
      <p><a href="http://www.typophile.com/node/2764" title="http://www.typophile.com/node/2764">http://www.typophile.com/node/2764</a></p>
      <p>So he is saying word not phrase or sentance. But that is where I got the idea it might be like italics. Okay, so I wasn't going completely mad. </p>
