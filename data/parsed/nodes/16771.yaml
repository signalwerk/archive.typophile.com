      <p>Eben, this topic greatly interests me (partly because I dislike italics) but to be honest I've had trouble finding good examples of actual use. And that makes me suspect that some -too many- people would simply not know what's going on when they encounter it. For example, is it taught in school in the Netherlands?</p>
      <p>&gt; If it’s used for emphasis, it should be formatting.</p>
      <p>Not if it's part of the language - like it is with Armenian. And as has been pointed out, some languages like Spanish actually require it to be fully intelligible. Here's a passage from Jorge de Buen: "Véase el caso de estas tres palabras: cántara, cantara, cantará. Significan cosas diferentes y la tilde es la distinción."</p>
      <p>BTW, the case with English seems different, since it's about pronouncing a letter that would otherwise be silent, not emphasis.</p>
      <p>hhp</p>
