      <p>Eben --</p>
      <p>I'm not Dutch (so I'm not an expert on this) but I lived in The Netherlands for a year and observed/enjoyed this "Dutch stress" as you call it. As far as I've seen the extra acute marks will almost always be applied to only the vowels of the syllable being stressed (example: néé, géén). The only consonant exception that I've seen is the lowercase j in the word jij ("you") where all three letters might be able to be emphasized, though I don't believe there's a unicode value for "small letter j with acute" so I'm not sure how it would have been applied in text unless if it was done manually. </p>
      <p>-- Andy</p>
