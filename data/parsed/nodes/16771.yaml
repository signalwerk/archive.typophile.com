    html: |-
      <p>Eben, </p>
      <p>this is indeed a good question which nobody yet solved convincingly. The practice of using acute as a stress mark is popular in many languages -- for eyample Russian uses it. The most intuitive way of encoding these characters might be using the combining acute mark (U+0301), and then using the "ccmp" OpenType Layout feature to display the glyph properly. However, I don't think it can work so well. Putting U+0301 into the text usually confuses text processing application. The letter "a" with acute is usually treated differently from the plain "a", because most ortographies threat them as separate letters. But if the acute is used to denote stress, the text processing application should "know" that for the purposes of searching and hyphenation, the marks should be ignored. Unfortunately, most text processing applications can't do that. </p>
      <p>However, if you design an alterate set of glyphs with acutes, name the appropriately (e.g. "a.ss01", "b.ss01" etc.) and map them to the ss01 and salt features, the underlying text would not include the acutes, but instead, the user would have to apply formatting to the appropriate glyphs (through markup or some menu selections). I believe that this would perhaps be a better idea. At least, it would present less problems in making the text searchable and hyphenable. </p>
      <p>You could still add a ccmp feature:<br>
      a uni0301 -&gt; a.ss01<br>
      etc. </p>
      <p>This way, you would ensure that the stressed letters would appear through both ss01 (without the acutes being encoded in the text) and through ccmp (with the acutes in the text). Perhaps this solution would be the most universal. </p>
      <p>In the end, the user will need to make the decision: does he want to treat the stress denotation as part of text (then the acutes would be keyed in and encoded, and the ccmp would be applied) or as formatting (then the user would apply the ss01 feature on a per-glyph basis). </p>
      <p>Best,<br>
      Adam</p>
