    html: <p>Well, I finally got an email back from corporate... they told me there is no "official" font, and they directed me to an area of the dealer interface website where they have some logos.  I don't believe that these people are passing some vector image back and forth whenever they do Toyota design... there must be a set of characters somewhere.    <br> <br>Thanks for the font suggestions... those are both pretty damn close... I think i'd give the edge to Gotham Bold... now if I can just get the brass to order it for me... <br> <br> <br>Thanks for the help folks</p>
