    date_raw: 23.May.2008 7.23am
    votes: null
    html: |-
      <p>tools may not be the limiting factor to creativity, but to a professional logo tools do make the difference.  Vector is needed, no matter what vector, but that’s how logos need to be constructed.  Logos must be scalable.  Pixel-designs don’t allow for lossless scaling.</p>
      <p>Before you say tools don’t matter, I think you would have a hard time typesetting a PDF magazine of all you had to work with a a ziploc bag of cut-out construction paper fonts from the foundry.  I think you’d be singing a different tune.</p>
