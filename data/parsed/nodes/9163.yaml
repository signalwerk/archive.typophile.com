    <!--/attachment--><!--/attachment--><p> <br> <br>This font has a limited number of uses - as you can see from the sample, text is not one of them. <br> <br>I used only quarter-circle arcs and L-shaped brackets in a rigid grid to create this face. <br> <br>The dingbats symbolise "A Clockwork Orange" (where the text comes from). The gear is inspired by a cover from one of the editions of this book. <br> <br> - Lex</p>
