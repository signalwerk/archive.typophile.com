      <p>What kind of heavy metal are we talking about? (believe me, it matters)</p>
      <p>I think something simple is better. If youre doing something heavy, dark, or aggressive I’d go with FRAKTUR. If it’s something more epic, I’d calling ARRIGHI - the first concept album could be called La Operina.</p>
      <p>And just to sound like a total nerd…<br>
      There was already a band named umlaut back in the 90’s. They were part of that crust punk crimethinc crowd and, if I remember correctly, were a joke started to make fun of other crusty metal bands. I believe they only made a 7” that was distributed with the old crimethinc magazine. I also think they parodied the motorhead logo a few times.</p>
