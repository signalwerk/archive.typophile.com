      <p>Perhaps someone else will have unfettered access to it, but I do have access to Expresso through the Yale University Library’s newspaper room. I could almost certainly make some scans of an issue if that would be helpful, and I could see about whether I could acquire an old issue. I wouldn’t be able to do that for at least a week, though, but let me know if nothing else materializes.</p>
      <p>EDIT: And, yes, the Frankfurter Allgemeine Sonntagszeitung is the Sunday edition AFAIK, looking significantly different (less conservative) from the other days.</p>
