    <p>Of the four newspapers that won this year’s Society for News Design award, I’ve only managed to find a copy of one (The Guardian) and I’m hoping for help from the kind font freaks of the world. The three in question are:</p>
    <p>Akzia (Moscow)<br>
    Expresso (Paco de Arcos, Portugal)<br>
    Frankfurter Allgemeine Sonntagszeitung</p>
    <p>The last one isn’t very exotic (unless “Sonntagszeitung” means something strange - perhaps just “Sunday edition”?) but Newseum.org hasn’t shown front pages from any of them since I started looking (and they’re also very lousy at returning emails and phone calls).</p>
    <p>Of course I would be more than happy to barter something of -supposed- value with anybody willing/able to mail me an issue of one of those three.</p>
    <p>hhp</p>
