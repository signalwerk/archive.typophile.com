      <p>I just checked the US Census site to see if maybe "type designer" was listed under the  index of occupations. It wasn't. Even in the detailed <a href="http://www.census.gov/hhes/www/ioindex/cens_260_296.html" rel="nofollow">breakdown</a> of "Arts, Design, Entertainment", where Millinery Designers and Sign Designers are referenced, it goes without mention. A look at the alphabetical <a href="http://www.census.gov/hhes/www/ioindex/occ_t.html" rel="nofollow">breakdown</a> yielded some interesting type-related professions that managed to get listed: hand compositor, type cutter (they lump this in with a host of other machine operators), and typographer. I would guess that type designers would likely fall into one of these classifications: 27-021 (Commercial and industrial Designers), 27-024 (Graphic Designers), or 27-029(all other Designers).</p>
