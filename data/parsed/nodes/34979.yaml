      <p>He he. Another venerable maxim: don't try to read between the lines of a forum post. Appologies Nick. I agree, about division of labor all falling under the label type design. My point was: even if worker bees at the larger shops don't get their names on the final font, they are certainly capable of taking a design from concept to delivery and are type designers in their own right.</p>
      <p>Hrant: </p>
      <p>I think I am following his criteria :-) I'd be curious if you'd call me a typeface designer? Or yourself? </p>
      <p>Junkiness is indeed personal and probably not the best criteria. I was just looking at the homepage at FontShop and saw this face I'd never seen before by a guy I'd never heard of: FF Speak designed by Jan Maack. Is it standout? I'd say probably not. Is it junk? I don't think so. Is it well done? Absolutely. To me, I'd have no trouble calling Jan Maack a Typeface Designer even though the world probably wont remember his typeface 50 years from now. It's less about the label, and more about the capability. Plus I think there's still more than enough junk left over after you make room for the Jan Maack's of the world to to warrant your 90% maxim.</p>
      <p>- - - - - -</p>
      <p>Ultimately who cares? It's a good question for the breaks between sessions at typecon, but good for little else. Everything I've said, boils down to this:</p>
      <p>I'm constantly surprised by the number of quality typefaces that I would be happy to use, designed by people I've never heard of. I'd like to think that type design is a craft practiced by a fraternity of a few hundred, all of whom I've heard of, but then I discover somebody jumped the velvet rope when I wasn't looking.</p>
