      <p>The participants in Indie Fonts 3 give some idea of the diversity of backgrounds and intent against which any claim of 'serious" must be judged. Given that there are different markets for fonts, there are different kinds of "serious"; and it does seem that "serious" means making the majority, or a significant amount, of one's income off type design -- although people who are headed in that direction may be quite dedicated.</p>
      <p>The number of foundries represented by Myfonts ("Welcomes 13 new foundries" -- summer 07 newsletter) gives some idea of how many are doing business.</p>
      <p>And then there is the question of what constitutes "type design".<br>
      The way it stands at the moment, that term casts a broad net, including everything from one-person outfits creating original fonts, to technical production work for software companies.</p>
      <p>If as I agree there are thousands of us, perhaps we should have our own organization, as our interests are not fully served by trade organizations that lump individual designers together with software giants.</p>
