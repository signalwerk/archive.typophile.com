      <p>Nick: to suggest that Miguel is not a typeface designer simply because he works for Adobe is unfair. It seems to me the size and nature your employer has little to do with whether or not you are a type designer. I agree that seriousness can be measured many ways. Earning a significant portion of your income from type design could be a useful distinction in some cases. I purposely cast a wide net, because I consider myself a typeface designer. I make the majority of my living as a graphic designer, but more than 10% is typeface design. Still, I humbly submit that my ability to draw and sell orginial typefaces from scratch, should justify the title regardless of income precentages.</p>
