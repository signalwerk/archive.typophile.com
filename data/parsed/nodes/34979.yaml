    <p>Hi,<br>
    I am working on my thesis project right now. So I came upon this question: How many serious type designers are there in the world right now? I know its kind of hard to say because there is so many people out there that make fonts for fun. But I kind of mean those that not necessarily live from creating type, but are very much devoted to type design. Those that have the knowledge to create typefaces that can stand out among all the junk. I am looking for the number of those people that would be able to develop a complex and satisfactory fontsystem. Not only from the technical and programming perspective but more important from the design side of things. I hope I have narrowed it down a bit. I am not expecting exact numbers (even though they would be nice), but if someone has researched this before I would be glad for some inside.<br>
    Thanks<br>
    Henning</p>
