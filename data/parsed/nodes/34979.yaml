      <p>Among type designers listed at MyFonts who are known or are presumed to be alive, there approx. 680 people who have designed at least three typeface families, and among these, approx. 470 who have designed at least five families. </p>
      <p>Note that this only counts people whose fonts are listed at MyFonts (i.e. either on sale or listed for reference). Most notable font foundries are included, though some are not. The database is very incomplete. For example, John Hudson is only credited as having designed two families, which is obviously wrong, since only the old Tiro Typeworks-exclusive fonts are counted.  </p>
      <p>MyFonts sells very few non-European fonts. There are probably at least as many people who design Chinese, Japanese, Arabic, Indic, Thai etc. fonts that are only distributed in local markets, or people who do European-language typefaces but are not included in the MyFonts count. </p>
      <p>I think it would be fair to say that there around 1,000 active type designers in the world. </p>
      <p>Adam</p>
