      <p>Based on the definition of "serious" provided, I think the total is much larger than people are suggesting. Certainly, I'd say 300 is the wrong order of magnitude entirely. Especially since one of the criteria offered is that the person may not make their living designing type.</p>
      <p>I think the number is measured in thousands. If you look beyond the "A-level" names Carter, Hoefler, Berlow, Kobayashi, Schwartz,  (etc) you find a whole bastion of incredibly capable type designers. Chester, Crossgrove, Simonson, Darden, Ragan, Downer. Oops don't forget about the Thierry Puyfoulhoux's hiding out in the alps designing fonts to fuel their whitewater adventures. Duprés cranking out types. Pingerras. Porchez. Hughes. Tankards. The Meaves from Mexico, and the Alejandro Lo Celsos from Argentina. Looking through something like the FontShop catalogue, I find myself looking at many of the names attached to very polished, and extensive families and say to myself: "where do all these people come from?" Beyond that there is yet a deeper layer of excellent typophiles who labor in relative anonymity. I can think of many here on Typophile who would fit the criteria proposed, but would probably not make most people's list. Miguel Hernandez? Eduardo Omine? Christian Robertson? Chris Lozos? Kris Sowersby? How many Keith Tams are there who are capable of making great type, but are busy doing other things? Or working behind the scenes like Miguel Sousa, Paul Hunt, Andy Clymer, Jean-Baptiste Levée etc.</p>
      <p>Not to mention, non-latin type designers as Thomas mentions.</p>
      <p>Of course the trickiest criterion you propose is this: <em>Those that have the knowledge to create typefaces that can stand out among all the junk.</em> The quality of the type is only part of that equation.</p>
      <p>My stratification of type names is mostly nonsense, but you get my point. I got past thirty without even thinking to include Slimbaugh, Speikerman, Stone, or Frutiger. This is a long list indeed, so I won't be accepting any challenges, but what kind of list wouldn't include Peter "Mustardo" Bruhn. Oh wait, he's not very serious.</p>
