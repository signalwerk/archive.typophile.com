      <p>Agreed. Which is why I suggest presenting foundries with a brief "to develop a complex and satisfactory fontsystem".<br>
      It would presumably list production criteria such as styles, weights, encodings, features, as well as usage specifications -- a hypothetical publication might be a good "client".<br>
      The researcher would assess whether the foundry is adequate to the task or just b*llsh*tting, as a client would have to.<br>
      However, that's not always easy, as many suppliers offer services they don't have in-house -- which is quite legitimate; so some kind of "first person judgement" would be required at some point, to assess the junkiness factor.</p>
      <p>Rather than presenting the brief as a hypothetical exercise, it might be better to ask if the foundry/designer has done such a project in the past -- either as a commission, or as a retail product -- and what the resulting typeface is.</p>
