      <p>In my way of using the term, a typeface designer does some things that are significantly different than the production work that occupies most of Christopher Slye or Miguel Sousa's time, designing glyph shapes and setting the overall "feel" of the typeface.</p>
      <p>Now, I consider both Miguel and Christopher to be typeface designers, but that's because they've each designed a typeface (Calouste, Elmhurst) in addition to doing extensive production work. There are lots of other people who have done font production work at Adobe at one time or another who I don't think of as type designers. Invaluable members of the team, but not type designers.</p>
      <p>I also have what some would consider a high bar for quality in my head. So by my understanding of the original request:</p>
      <p><cite>Those that have the knowledge to create typefaces that can stand out among all the junk. I am looking for the number of those people that would be able to develop a complex and satisfactory fontsystem. Not only from the technical and programming perspective but more important from the design side of things.</cite></p>
      <p>... I don't think there's any way in heck that there are a thousand type designers in the world, even across all languages. I'd be surprised if there were more than 500 globally.</p>
      <p>I'm assuming "complex and satisfactory fontsystem" implies a range of weights and perhaps other variables (width, style) in a comprehensive system, including typographic goodies whether in separate fonts in "old formats" or in the same font in OpenType.</p>
      <p>Cheers,</p>
      <p>T</p>
