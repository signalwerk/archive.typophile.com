      <p><em>What might be a more manageable figure is “How many people are earning a full time living in type design.” This will take the number to to low double digits, I would think.</em></p>
      <p>By this criteria many historical designers would not qualify starting with Garamond who died deeply in debt. Bodoni wouldn't qualify either, nor Baskerville, nor even Gutenberg himself who made his money as a printer. Excoffon made his living as an advertising art director, as did Dwiggins for many years. There are a great many serious designers who didn't make their living designing type, but still produced important typefaces. Let's see, Tschichold, Cassandre, Eicher, Abrams, et al. Victor Gualtney doesn't make his living through type design, but there's no way he could not be considered serious.</p>
      <p>I think any measure of who's a type designer has to be based on intent. In fact those who are <em>not</em> making money at it might be considered to be more serious. Why else are they doing it?</p>
      <p>It might be better to consider how many people in the world are serious about typography and the work back from there. Between memberships in various organizations there have to be several thousand with a large percentage of them type designers. </p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
