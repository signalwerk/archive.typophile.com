    <p>I just discovered Tomáš Brousil's Nudista, Kulturista, and Idealista Trilogy.</p>
    <p>Has anyone used these extensively?</p>
    <p>How versatile are they?</p>
    <p>I am considering fonts for a school print publication project. I am looking for a font family (or pairing of sans/serif/display) that is somewhat unique and contemporary, but still practical for a wide range of purposes. My subject matter is popular music, although I'm not going to be pandering to fads.</p>
