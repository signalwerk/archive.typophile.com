    html: <p>This is awesome! The <em>R</em> is fantastic. I'd love to see the tail of the <em>R</em> reach just <em>a little</em> past the baseline (subtly - only the way a bowl would overshoot). Right now it just feels a touch higher than it should be, like it's trying to balance on the stem. Regardless, I think it's the best of the bunch. Other favorites are the <em>U</em>, <em>J</em>, and <em>K</em>. Looking forward to the release.</p>
