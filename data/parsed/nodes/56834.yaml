    <p>A couple of years ago, some interesting found lettering in a headline was posted <a class="freelinking external" href="http://typophile.com/cms/node/31959 " rel="nofollow"> here</a> in the type identification forum.  The general consensus reached was that the lettering was hand lettered, though a couple of faces (including one of mine) were suggested as the basis of approximating the 'look and feel' of the lettering.</p>
    <p>This is the specimen that was posted in 2007:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Svengalis_3729_3937.jpg"></div><p></p>
    <p>Here is my progress to date at trying to recreate it as a font.  So far I've worked on the lower case, or 'small capitals':</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Svengali_5482.png"></div><p></p>
    <p>I'd be pleased to hear suggestions and feedback on this project so far,</p>
    <p>Paul.</p>
