      <p>Theoretically you can do what you want with OpenType naming <em>if</em> all fonts have the same OpenType Family Name and you make the weights part of the style name. That doesn’t mean software is going to play well with your OCD font naming system because it’s not how sane people do it and software tends to expect naming to be rather conventional.</p>
      <p>I recommend that you just do not do this. Font naming can get really ugly when it doesn’t work well, and there are good reasons for font designers breaking the widths up into their own families. It’s also going to be a real problem if you ever need to do work with outside designers as almost no font license allows you to distribute modified fonts to users outside of your organization.</p>
