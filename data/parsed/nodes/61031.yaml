    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Thesis</strong></p>
    <p>From <a href="http://www.lucasfonts.com/fonts/thesans/about/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">LucasFonts</a></p>
    <p>Thesis is a large font superfamily, deisgned in the late 90s by <a href="http://www.lucasfonts.com/fonts/thesans/about/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Luc(as) de Groot</a> of LucasFonts. Thesis fonts have become popular and can be seen in various publications or logotypes. The range of weights are designed using de Groot’s “interpolation&nbsp;theory”.</p>
    <p>The fonts include TheSans, a humanist sans-serif similar to Frutiger and Segoe; TheSerif, a slab-serif; TheMix, a slab-serif font lacking some serifs; and just recently, TheAntiqua, a serif&nbsp;font.</p>
    <p>Each of the family are categorized in following family collections: Classic, Basic,&nbsp;Office.</p>
    <p>Classic family includes all 8 font weights, with roman, italic, small caps roman, small caps italic, expert, expert italic in each weight. It includes hanging proportional, hanging monospaced, lining proportional, lining monospaced figures; and additional f-ligatures. Expert fonts include arrows, swashes, fraction figures, alternate styles, mathematic symbols,&nbsp;ornaments.</p>
    <p>Basic family includes all 8 font weights, but without small caps and expert fonts. It includes lining proportional figures (smaller than in&nbsp;classic).</p>
    <p>Office family only includes Regular and Bold weights, with only roman and italic in each weight. It includes hanging monospaced&nbsp;figures.</p>
    <p>The fonts have been increasingly popular in recent years, especially in Europe. Germany has seen it being used in the signage of the <span class="caps">SPD</span> party, and in their television screens in Das Erste, the main television channel of state-owned <span class="caps">ARD</span>. Belgians have seen it police cars strolling around the&nbsp;city.</p>
    <p>In America, people see it in Sprint branding, Citizens bank, and some services of <span class="caps">AOL</span>.</p>
