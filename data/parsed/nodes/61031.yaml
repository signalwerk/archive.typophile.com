    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Thesis</strong></p>
    <p><img src="http://www.lucasfonts.com/fileadmin/user_upload/fonts-articles/thesans/thesis_thesans.gif" img=""></p>
    <p>From <a class="freelinking external" href="http://www.lucasfonts.com/fonts/thesans/about/" rel="nofollow">LucasFonts</a></p>
    <p>Thesis is a large font superfamily, deisgned in the late 90s by <a class="freelinking external" href="http://www.lucasfonts.com/fonts/thesans/about/" rel="nofollow">Luc(as) de Groot</a> of LucasFonts. Thesis fonts have become popular and can be seen in various publications or logotypes. The range of weights are designed using de Groot's "interpolation theory".</p>
    <p>The fonts include TheSans, a humanist sans-serif similar to Frutiger and Segoe; TheSerif, a slab-serif; TheMix, a slab-serif font lacking some serifs; and just recently, TheAntiqua, a serif font.</p>
    <p>Each of the family are categorized in following family collections: Classic, Basic, Office.</p>
    <p>Classic family includes all 8 font weights, with roman, italic, small caps roman, small caps italic, expert, expert italic in each weight. It includes hanging proportional, hanging monospaced, lining proportional, lining monospaced figures; and additional f-ligatures. Expert fonts include arrows, swashes, fraction figures, alternate styles, mathematic symbols, ornaments.</p>
    <p>Basic family includes all 8 font weights, but without small caps and expert fonts. It includes lining proportional figures (smaller than in classic).</p>
    <p>Office family only includes Regular and Bold weights, with only roman and italic in each weight. It includes hanging monospaced figures.</p>
    <p>The fonts have been increasingly popular in recent years, especially in Europe. Germany has seen it being used in the signage of the SPD party, and in their television screens in Das Erste, the main television channel of state-owned ARD. Belgians have seen it police cars strolling around the city.</p>
    <p>In America, people see it in Sprint branding, Citizens bank, and some services of AOL.</p>
    <p><img src="http://www.designtagebuch.de/wp-content/uploads/2009/04/spd-wahlplakat.jpg" img=""><br>
    <img src="http://www.fontblog.de/wp-content/tagesschau_wide_2.jpg" img=""><br>
