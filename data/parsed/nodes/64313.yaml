    <div class="info">Submitted by <a href="/user/3095" title="View user profile.">billdavis</a> : 16.Nov.2009 2.59pm </div>
      <p>Ascender Corp is pleased to announce that the <strong>Parkinson Type Design</strong> collection is now available at <a class="freelinking-external" href="http://www.AscenderFonts.com">AscenderFonts.com</a>. Jim Parkinson is noted for his lettering expertise found in a wide range of custom logos and nameplates for magazines &amp; newspapers and also for his wonderful assortment of text and display fonts.</p>
    <p></p><div class="imageWrap"><img src="/files/jim-parkinson-02_4423.jpg"></div><p></p>
    <p>The Parkinson Type Design font collection is available in TrueType and OpenType formats for purchase and immediate download from the <a class="freelinking-external" href="http://www.AscenderFonts.com">AscenderFonts.com</a> website. Ascender also offers the Parkinson fonts for license to software developers, hardware manufacturers and digital content developers from the <a class="freelinking-external" href="http://www.AscenderCorp.com">AscenderCorp.com</a> website.</p>
    <p><em>About Ascender</em><br>
    Ascender Corporation is a leading provider of advanced font products. Ascender’s founders are font industry experts and have been involved in developing many of the most important and influential fonts used in computers, mobile devices, consumer electronics and software products. Ascender provides multilingual, custom font development for a wide range of customers including creative professionals, enterprises, software developers and hardware manufacturers. Ascender also provides an extensive collection of TrueType &amp; OpenType fonts for download to graphic designers and consumers through its font websites, including <a href="http://www.AscenderFonts.com" title="www.AscenderFonts.com">www.AscenderFonts.com</a>.</p>
    <p>Contact: Bill Davis, Vice President<br>
    <strong>Ascender Corporation</strong><br>
    25 Northwest Point Blvd, Suite 225 Elk Grove Village, IL 60007 USA<br>
    Phone: (847) 357 0730<br>
    Fax: (847) 357 0731<br>
    <a class="freelinking-external" href="http://www.ascendercorp.com">AscenderCorp.com</a><br>
    <a class="freelinking-external" href="http://www.AscenderFonts.com">AscenderFonts.com</a></p>
