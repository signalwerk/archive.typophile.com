  html: |-
    <p>[Vlad has already mentioned this in numerous existing threads on webfonts, but I think it is an important development and one that deserves its more general attention, especially from those who may wish to contribute to or monitor the webfont standardisation effort.]</p>
    <p>Today the World Wide Web Consortium announced the creation of a webfonts working group, following their usual lengthy approval process. Details of this working group, including the approved charter, were posted to the W3C font discussion list today by Chris Lilley:</p>
    <p><a href="http://lists.w3.org/Archives/Public/www-font/2010JanMar/0044.html" title="http://lists.w3.org/Archives/Public/www-font/2010JanMar/0044.html">http://lists.w3.org/Archives/Public/www-font/2010JanMar/0044.html</a></p>
    <p>As my dog would say: Woff! Woff!</p>
