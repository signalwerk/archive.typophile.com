  - id: 69901
    user: 1262
    date: 2003-04-23T19:04:00
    date_raw: 23 Apr 2003 — 7:04pm
    votes: null
    html: "<p><i>I think John Hudson would still argue the commission vs. license issue</i>  <br>  <br>I'm not sure that I understand this comment, but basically I agree with Hrant's summary of the legal and ethical requirement: you need to ensure that a) the original font license permits such modification and b) that the client has a legitimate license that covers <i>every installation</i> of your modified font.  <br>  <br>Regarding asking permission, this should be clearly granted or not in the original license. Personally, if someone were to come to me and ask me to make a modification of a typeface from another small foundry, I would probably contact the original designer and see if they were interested in being involved. There are lots of ways this could work, from co-design to consulting. I don't think this is an ethical requirement, just something that I would do in the spirit of fraternal farce that Hrant mocks.</p>"
    html_clean: "<p><i>I think John Hudson would still argue the commission vs. license issue</i>  <br>  <br>I'm not sure that I understand this comment, but basically I agree with Hrant's summary of the legal and ethical requirement: you need to ensure that a) the original font license permits such modification and b) that the client has a legitimate license that covers <i>every installation</i> of your modified font.  <br>  <br>Regarding asking permission, this should be clearly granted or not in the original license. Personally, if someone were to come to me and ask me to make a modification of a typeface from another small foundry, I would probably contact the original designer and see if they were interested in being involved. There are lots of ways this could work, from co-design to consulting. I don't think this is an ethical requirement, just something that I would do in the spirit of fraternal farce that Hrant mocks.</p>"
