    html: '<p>Wow. Near consensus. What do you know. <br> <br>Oops sorry John <i>Hudson</i> I meant John <i>Butler</i>. I posted after re-reading the thread that Joe linked to (thanks). I was referring to what Mr. Hudson said in a post there: <br> <br><i>&gt;There is no pillaging if the thing is paid for.  <br> <br>Exactly. And fonts are not "paid for" generally. They are licensed. You can license a font package for generally between $0 and $150 a weight. Actually paying for a font, also called a commission or a work for hire, generally will cost you several orders of magnitude more... [elswhere]  If you want to draw your own Jenson, no one is stopping you. If you want to make something derived from the digital outline data in Adobe Jenson or FB Hightower, you damn well better contact Adobe or Font Bureau and talk to their staff. </i> <br> <br>So much for consensus. :-) Valid points all around. At a bare minimum it seem everyone <i>must</i> own a lisense for the orginal, and that lisense <i>must</i> allow modification. <br> <br>Thanks all. <br>Randy</p>'
