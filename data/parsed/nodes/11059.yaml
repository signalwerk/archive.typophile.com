    html: "<p>Well, I've noticed at least one area of strong disagreement, especially with Johns: <br>I happen to think there is such a thing as an unreasonable EULA, because: <br>1) No type design is wholly original anyway. <br>2) The necessities of human society. The French Revolution was \"illegal\" too. <br> <br>The line that the creator of a font must have absolute legal control of it -even if it's considered capricious by any <i>reasonable</i> person- holds no water for me. Violating a law must be an <i>individual</i> decision - society is made of individuals, not parts of a machine. Unreasonable idiots must suffer the consequences, although those who stand up to them should be ready for the battle as well. <br> <br>For example, the MS EULA prohibits any modification whatsoever, even if it's for internal pleasure. I heartily encourage people to violate that clause - I don't think saving MS money in potential support costs due to the existence of \"nonstandard\" versions of their fonts is more important than the acquisition of technical font expertise through experimentation, and the hacking of fonts to improve internal functionality. On the other hand, I don't condone the <i>distribution</i> of such modified fonts. <br> <br>hhp <br></p>"
