    html: <p>Legally (at least in [most of] the civilized world) they need to own the original's license to the extent that the derivative will be used. Ethically, I would add that public credit must be given to the original. Some would add to that the requirement that you ask the owner of the original for permission, but that's too much of a "fraternity" farce for me to take seriously. <br> <br>On the other hand, some EULAs are stricter (like Emigre's and MS's), but I wonder about the validity of all their clauses outside the US. <br> <br>hhp <br></p>
