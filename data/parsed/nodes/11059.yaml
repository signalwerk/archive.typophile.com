    html: <p>I think it's a very good idea if you already know the original designer in question, and it's also fine if you want to use the project as an opportunity to get to know him. But the pressure of an Unwritten Fraternal Ritual where the results of not following The Dictates of the Holy Order are that you will be shunned by The Brothers of Leadhead is too medieval even for my tastes. Don't laugh - I know designers who think like that. <br> <br>hhp <br></p>
