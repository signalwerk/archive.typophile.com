    html: <p>Hrant's position seems reasonable. I think John Hudson would still argue the commission vs. liscense issue... I dunno. Since I'm not trying to sell/distribute this font to the world at large, and they have a VAG liscense, what are the creators loosing out on? Did they put in the work to make a semi- serif version?  <br> <br>Ah...... Did I put in the work to make a semi serif version? There is the issue eh? Yes, and no. But, I believe I've paid for the step ahead I've received, in the licensing process. (maybe) <br> <br>Gotta go. <br>Randy</p>
