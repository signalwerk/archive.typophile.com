    html: <p><i>The necessities of human society. The French Revolution was "illegal" too.</i> <br> <br>I'm not sure this is a good example Hrant.  <br> <br>Had it failed, it would have been an extremely "illegal" rising/rebellion and the leaders would have been done away with and things would have probably continued on much as before.  <br> <br>The fact that it was a successful revolution meant that the revolutionaries could rewrite the rules (and the history books) themselves and justify everything and do away with whoever they wanted.  <br> <br>I reckon distribution of hacked fonts would be far more revolutionary than the hacking itself. If it was done on a large enough scale the rules would have to change. Not that I condone that sort of thing. Nor do I agree with cutting people's heads off. <br> <br>Matha</p>
