  html: <p>Hi all. <br> <br>I'm doing an identity for a children's clothing line. As part of the package, I've done a semi-serif version of VAG Rounded for headline usage (it was just itching for serifs). I imagine there are restrictions on selling it to the world at large, but are there any restrictions on selling this modified font to them? Do they need a liscense for VAG Rounded? <br> <br>Thanks, <br>Randy </p>
