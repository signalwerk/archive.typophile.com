  html: "<p>Hello all, <br> <br>I realize that logotypes can be a bit challenging since many are modified or even custom drawn. I was wondering, however, if you guys can come up with Id's on these.  <br> <br>Time: I have no idea what this is <br> <br>Gucci: Americana is close but not it exactly, is there something obvious I'm missing? <br> <br>Le Coq Sportif: This looks like modified Franklin Gothic but I don't think that's it since the e and  'c' have horizontal lines at the end of the stroke whereas in FG they are slanted. Any ideas? <br> <br>Johnston &amp; Murphy-I've come across fonts that look similar but none has the distinctive ampersand.  <br> <br>I'm doing this for a spoof poster where I'lll need to modify the logos to read something different but similar as in Johnston and Murphy -&gt; Jason and Murrray. It's non commercial project for a student organization. Any help would be greatly appreciated as always.   <br> <br>Logos: <br><img src=\"http://www.typophile.com/forums/messages/83/18338.jpg\" alt=\"\"></p>"
