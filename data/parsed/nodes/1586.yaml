    html: <p>I can't help you with the Time logo, but try TF Arrow for Gucci, one of the Grotesques (Monotype or Bureau) for Le Coq, and Goudy Old Style for J&amp;M. <br> <br>(These are all just faces that will get you close, not the definitive sources of the logos in question.)</p>
