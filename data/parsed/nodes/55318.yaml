      <p>A couple of quick photos. I'll make better ones in the next few days.</p>
      <ul>
      <li><a class="freelinking external" href="http://precisionetworking.com/img/ap-card-1.jpg" rel="nofollow">one</a>
      </li><li><a class="freelinking external" href="http://precisionetworking.com/img/ap-card-2.jpg" rel="nofollow">two</a>
      </li></ul>
      <p>Engraved in white ink on black Plike (<a class="freelinking external" href="http://www.westernengraving.ca" rel="nofollow">these guys</a>), laminated to Touche, and then die cut with 1mm round corners. </p>
      <p>Unfortunately die cutters did a sub par job. The corners are not as sharp and defined as I wanted them to be, there's lots of glue smudges and jagged edges. Some registration problems too.</p>
      <p>But even these things considered cards came out pretty awesome. Having two textures and the engraving really adds a tactile wow factor.</p>
