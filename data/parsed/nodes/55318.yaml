    <p>Trying to round up options for printing <a class="freelinking external" href="http://swapped.cc/stuff/tmp/card.pdf" rel="nofollow">this business card</a>. I am quite new to this, so I would appreciate some guidance.</p>
    <p>First, the paper is <a class="freelinking external" href="http://www.fibermark.com/details.php?productID=189" rel="nofollow">Touche</a> from Fibermark. Amazing, suede-like texture. Somewhat similar to Plike, but bolder.</p>
    <p>I want to preserve the texture of course, so the inverted printing is not an option. So white needs to be printed on black. </p>
    <p>The four options I have arrived at are:</p>
    <ul>
    <li> Metallic foil pressing. Non-metallic foil allegedly flakes and doesn't look sharp enough when finer details are present. An example is <a class="freelinking external" href="http://www.flickr.com/photos/fusedesign/3024737502/" rel="nofollow">here</a>.
    </li><li> Letterpress in metallic ink. An example is <a class="freelinking external" href="http://www.flickr.com/photos/themandatepress/3021655187/in/pool-artofthebusinesscard/" rel="nofollow">here</a>.
    </li><li> Engraving. An example is <a class="freelinking external" href="http://www.beastpieces.com/2009/02/art-of-the-business-card-black-paper/" rel="nofollow">here</a>.
    </li><li> Silkscreening. An absolutely amazing example is <a class="freelinking external" href="http://www.flickr.com/photos/zwoelf/2900054462/sizes/l/" rel="nofollow">here</a>.
    </li></ul>
    <p>I would rather not do the metallic ink if possible as I need to get flat white for the type. No shimmer and such.</p>
    <p>I would rather not do pressing or engraving as these leave the imprint on the back. Though I guess this can be remedied by duplexing or using thicker stock.</p>
    <p>Engraving guys said the white is not a problem, but opaque yellow ink is a special order, which takes a while and costs a lot (yellow is used for the middle stroke between two E's).</p>
    <p>I am inclining towards the silk-screened version, but I absolutely cannot find anyone who can do it. Leave alone with very tight registration in two colors. Tried emailing the owner of Flickr photo, got no response. Does anyone know if there are any printers that could do this ? </p>
    <p>Also the sharpness of small type on that Flickr photo looks very impressive, but I suspect it is very hard to achieve. Am I right ?</p>
    <p>Thermography is another option, but local guys are saying that their white inks are not opaque enough to work on black. So I was wondering if doing termography <em>over a foil</em> would work - any thoughts on this ?</p>
    <p>Thanks for any pointers and/or comments. I could really use some :-)</p>
