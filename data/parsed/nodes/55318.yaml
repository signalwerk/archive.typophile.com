    html: <p>There's an aqueous coat that creates the same suede-like finish as Fibermark Touche, but it can be printed on any coated stock. You can use conventional offset to print black (and the yellow rule) on white stock, with the type reversed out, and the suede-finish aqueous on top. We use this process at <a class="freelinking external" href="http://www.weandrews.com/wwwWEAndrews/home.asp" rel="nofollow">W.E. Andrews</a>, where I work.</p>
