      <p>It is unlikely that your <em>thermography over foil</em> idea could be done. Thermography works by dusting a powder over wet ink, and then heating the paper so that the power fuses to the ink and swells. It would be difficult, if not impossible, to print an ink onto foil, not to mention that the heat from the process would probably damage the foil. </p>
      <p>Also, thermography is generally looked down on as a poor imitation of engraving.</p>
      <p>Unless you can find a silk screener who can do the fine detail and the close registration your yellow ink requires, your best, and most expensive, option is with engraving.</p>
      <p>P.S. Thanks for taking the time to provide all the links in your original posting. It really saves time for the rest of us, and allows for better, more informed opinions.<br>
