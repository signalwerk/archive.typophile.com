    html: "<p> Ruben, I agree with Stephen: I think you're lying.  ;-) <br> <br>Seriously, pardon my language, but this is one goddam good design. I do happen to have a fetish for designs that combine the mechanical and the organic, but Oban (great name, btw) really is class. <br> <br>Stephen's suggestion for the numeral \"4\" is right on, but for the UC \"M\" I think it needs more than just a lower middle: it needs a curvier middle. Also: the \"K\" is imbalanced, the \"Q\" is amazing, the \"X\" too wide. <br> <br>In the lc, \"k\" and \"x\" have the same problems as above, but overall I'm salivating to see some text. <br> <br>Non-alphanumerics: The exclamation/question color needs help, the dollar sign is the only one with a double bar that I've ever liked, the ampersand rocks, the BP is too stiff, the Pilcrow is great, the Euro looks forced. <br> <br>More, please!! <br> <br>hhp </p>"
