    votes: null
    html: "<p>ruben!  <br>  <br>First font, my foot! It's hard to believe you're  <br>just starting out in type design when you have  <br>such a great grasp of form and consistency.  <br>  <br>I like the base shape, the rounded corners and   <br>the angled terminals. I'm sure this face will   <br>lend itself well to a bold weight too.  <br>  <br>Two small concerns:  <br>  <br>- The 'M' distracted me immediately. I'd like to  <br>see the middle come down a bit to match the   <br>other caps.  <br>  <br>- The '4's counter is much smaller than any other  <br>glyph. Maybe an open topped '4' is in order.  <br>  <br>It's very cool overall and there is certainly  <br>a market for this look. Peter Bruhn of Fountain   <br>might be watching this critique closely. See his  <br><a href=\"http://www.fountain.nu/catalogue/mayo.asp\" target=\"_blank\">latest</a>.  <br>  <br>Stephen</p>"
