    html: <p> Let me add my praise for this specimen. I love the squarish forms and gentle tapers. The whole alphabet is very exciting and has enormous potential. <br><br>The lower leg of the K seems a bit thin, and the round corners of the Z seem inconsistent with the way you’ve handled similar junctions.  <br><br>As for the punctuation, the letterforms seem close — I think I’d need to see the punctuation in context to judge their&nbsp;compatibility. </p>
