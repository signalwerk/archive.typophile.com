    html: <p> thanks a lot, for each comment, I'll take in consideration each of them, for soure. <br> <br>i'm finishing some other works these next days, but as soon as i can i will post some corrections and also a text preview. by the  way i tried to use the font in flash to post it here but the same curves that work perfectly in freehand sometimes doesn't look good on flash  but other times do. i dont understand wy, but i don't really use flash usualy so maybe i'm doing something wrong. <br> <br>by the way, it realy is my first font but i'm working on it for some time ago, and in the last few years i had read a lot about type design, even before i started to draw these one and i had talked with some friens and done some research. <br>so maybe that's the reasons, <br>thanks a lot for the compliments, <br>i gave my best to it. <br> <br>thanks, again, and see you as soon as i can, bring you more news. </p>
