  html: <p>Any thoughts on what I call, for lack of a better term, a "European" figure 1 (the one with a more obvious top arm)?  How appropriate is it?  Should it become the standard, as opposed to this -&gt; 1?  Any advice, technical or otherwise, on the design of this version?</p>
