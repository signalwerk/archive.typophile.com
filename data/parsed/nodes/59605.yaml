    <p></p><div class="imageWrap"><img src="/files/abc3d_web_big_4652.jpg"></div><br>
    <a href="/wiki/%252Bhttp%25253A%25252F%25252Fwww.abc3dbook.com%25252F" class="wiki-create"> ABC3D pop-up book</a> <a href="#foot_1" name="foot_src_1">[1]</a> is an amazing little gem, produced by Marion Bataille. It’s a game of letters, the whole alphabet will pop up whilst flicking through the pages and some of transform into other letters. The I becomes a K, the K an I depending on which strap you draw. I t plays with sweet little effects. like mirror and transparent paper to get different letters from the same “base”. Check out the <a class="freelinking-external" href="http://www.metacafe.com/watch/1186973/abc3d/">video</a>, a loveley presentation of the book with very fun music <a href="#foot_2" name="foot_src_2">[2]</a>, which surely describes it better than my words...<br>
    Funny story behind the commercialisation is, the apparently unwanted marketing campaign. A <a class="freelinking-external" href="http://www.abc3dbook.com/">youtube video</a> showing the book has been circulating. More on this story at <a class="freelinking-external" href="http://www.publishersweekly.com/article/CA6545534.html?nid=2788">publishers weekly.</a><p></p>
    <p>buyable <a class="freelinking-external" href="http://www.amazon.com/exec/obidos/ASIN/1596434252/comingupforai-20"> for .00</a></p>
    <p><a name="foot_1">1. Written &amp; illustrated by Marion Bataille |5.75 x 7.5 | 36 pages | Ages All | Roaring Brook Press | Published in 2008 | ISBN 9781596434257 </a></p><a name="foot_1">
    </a><p><a name="foot_1"></a><a name="foot_2">2.</a><a class="freelinking-external" href="http://www.deezer.com/track/roll-on-mississippi-T621083"> Roll On Mississipi</a> by the 1930s trio <a class="freelinking-external" href="http://www.hdtracks.com/index.php?file=catalogdetail&amp;valbum_code=743625547122 "> The Boswell Sisters</a></p><div class="imageWrap"><img src="/files/abc3d_web_thumb_03_3994.jpg"></div><div class="imageWrap"><img src="/files/abc3d_web_thumb_01_5264.jpg"></div><p></p>
