  html: |-
    <p>While scrolling inside metrics windows with wheel, bar or gesture, FL eats up all the CPU. And it's choppy.<br>
    Happened to anyone?</p>
    <p>P.S. It's not only scrolling, but scrolling everywhere, changing views in font window, selecting glyphs. Any action forces maximum CPU usage for a moment.</p>
