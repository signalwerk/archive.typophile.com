    html: <p>The way I see it, there are transferable and particular skills. Handwriting is a particular skill, and it is one that isn't culturally useful where we are at the moment, hence fewer people develop the skill. The interesting questions, I think, are a) whether there are transferable skills (fine manual motor skills) involved in handwriting that can also be developed in other ways and, b) whether those skills are transferable to something that is culturally useful. I don't know the answer to those questions, but I would be glad of suggestions. It may be the case that the skills involved in handwriting are highly specialised, and not significantly transferable.</p>
