      <p>&gt; going out and stirring up conflict.</p>
      <p>I didn't go out. I've been here ~12 years. It came to me.</p>
      <p>&gt; Well, if (b), then you would say (a).</p>
      <p>Not to be even more (b), but: not necessarily.  :-)<br>
      I can think of things that are worth fighting for,<br>
      but I won't be the one doing the fighting; and there<br>
      are things not worth fighting for, but I'm still (b).</p>
      <p>The mother of all things: it doesn't feel right for it to be the<br>
      exact opposite of Conflict. Maybe the mother is Comfort.</p>
      <p>--</p>
      <p>There's certainly too much macho "appreciation" of killing,<br>
      at least where I live. But my reason for somebody like Dina<br>
      to watch the video isn't that she should enjoy it - quite the<br>
      contrary; my point is that avoidance of content (i.e. reality)<br>
      that makes one uncomfortable constitutes weakness.</p>
      <p>Have you been in a room where a baby is being delivered?<br>
      Some people find it quite unpleasant. But it's important to<br>
      overcome the desire for Comfort and embrace the Conflict,<br>
      whether you believe the end-result will be horrid or wondrous.</p>
      <p>--</p>
      <p>BTW, in case it's unclear: the reason I pointed out that video<br>
      is that I was trying to show that even herbivores kill animals,<br>
      sometimes even one of the their own family members. There<br>
      is in fact a species of monkey where members gang up on one<br>
      of their own and kill it out of nothing more than boredom.<br>
      And humans are nothing more than animals.</p>
      <p>hhp</p>
