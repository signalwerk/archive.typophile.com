      <p>Nick, that's a fair point about personal epistolary style, but I think that is another product of the situations I describe: rising literacy rates, the spread of systematic education including the teaching of handwriting, and the introduction of new writing tools at a time when the dominance of secretarial models was waning due to increased use of the typewriter. As the choice of writing implement became a matter of personal preference, greater individuality becomes evident in writing. The fact that so much of the writing remained of such high quality, even as it departed from the taught models, indicates that the manual skills developed in learning to write 'a fair hand' are transferable.</p>
      <p>This is where I do think the loss of handwriting as a taught skill is problematic -- has been problematic in my own life --: not in the disappearance of handwriting per se, but the disappearance of the transferable fine motor skills.</p>
