      <p><em>Several type designers have a consistent "feel" to their typefaces which suggests that they had done this. Frederic W. Goudy comes to mind as a possible example.</em></p>
      <p>Goudy's types are among the most truly free of chirographic influence: they're pure drawing, and the frequent 'wandering lumpiness' of the outlines produce relationships between inner and outer forms that are alien to anything informed by the stroke of the pen. At their best, Goudy's types demonstrate how stable forms can be derived independently of written models; more often -- let's remember just how many types he designed -- they demonstrate the difficulty of achieving such stability and the arbitrariness of the drawn outline.</p>
