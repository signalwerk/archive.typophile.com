      <p>In my case, it is a combination of lack of will and lack of time: if I had more time, likely I wouldn't mind the prospect of tedious practice. Improving my handwriting isn't something I can prioritise, which takes me back to the point I made above about <em>need.</em> I would like to have better handwriting, but I don't need better handwriting, and hence there isn't a lot of impetus to devote time and effort to improving it. There are other things that I want to be better at too -- singing, cooking, woodworking --, and all of those have more practical application in my life than having nice handwriting, so they get priority in my leisure time.</p>
