      <p>Dina: <em>...but one's own contemporary culture or just a few decades past, and still in use?</em></p>
      <p>The parallel I suggested, though, is in ways of writing ceasing to belong to contemporary culture, falling out of use, and then how we have to relate to them. Sutterlin script was the dominant model of cursive handwriting taught in German schools in the first half of the 20th Century, and disappeared within 'a few decades', between two generations, such that very few people can now read it, let along write it with any competence. Should it surprise us that in a culture of rapid change, this process might occur more quickly?</p>
