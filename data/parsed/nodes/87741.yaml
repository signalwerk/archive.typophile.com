      <p>Hrant: <em>clearly both</em></p>
      <p>Well, if (b), then you would say (a).</p>
      <p>Somehow, I don't think Heraclitus, in developing his primitive dialectics, was advocating going out and stirring up conflict.</p>
      <p>The mother of all things? If conflict is the father, then it stands to reason that conflict resolution -- or maybe <a href="http://libcom.org/library/mutual-aid-peter-kropotkin" rel="nofollow">mutual aid</a> -- is the mother, since otherwise there would only be conflict, and no creation of mutually beneficial and enriching peace, however fragile and conditional.</p>
      <p><em>There was no gore in the video. [Dina was] not honest about how much of<br>
      it [she] watched. There was the specter of death in the video, but death<br>
      is part of life, and I don't like weaklings who look away.</em></p>
      <p>I'm not going to speak for Dina, who could best represent her reasons should she choose to. But I want to take issue with the notion that choosing to look away from depictions of killing -- even if no visceral gore is involved -- constitutes weakness. It speaks to me rather of the comparative ease -- especially in our society, where so few people provide for their own nutrition -- to empathise with the panicked terror of the prey animal, contra the more complex sympathy required to identify with the need of the wolves. To celebrate the kill, because of what it means for the life of the predator, is more a more distant emotional response for most people than pity and horror at what the prey goes through as it is hunted down. I don't think that has anything to do with being a 'weakling', any more than being able to appreciate the deadly beauty of the wolves makes us strongmen.</p>
