      <p><em>And in a few decades they'll all be illegible to the younger half of the population?</em></p>
      <p>It is already the case that very few people can actually write in the manner of these script types, and most bear no relationship to lettering taught in schools at any period, but writing and reading are different abilities. So called 'wedding script' types are endlessly popular, but represent styles of writing that have not been systematically taught for almost two hundred years. They persist in use because they are fashionably associated with certain cultural phenomena (wedding invitations, wine labels, some book or music packaging), and bear systematic relationships to other more common styles of typographic letters (italics), and hence they remain readable despite the fact that no one is taught how to write them.</p>
