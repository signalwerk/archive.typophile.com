      <p>I think you are mistaken about the dominance of the secretarial model.<br>
      For instance, in the early 20th century my grandmother, age 20, kept an “autograph” book, in which her friends and relatives each entered a piece, usually a sentimental poem, in their own hand. There is a great variety of styles, and all of superb technique and fine-detailed precision.<br>
      From this, I conclude that  writing was approached as a sophisticated skill and means of self-expression.<br>
      Although certain styles were standardized for business, people wrote a lot of personal letters to one another.<br>
      These letters ranged from those to lovers and close family, to formal invitations to social events.<br>
      If one knew the correct form to address a potential employer, why would one use the same style to address one’s sweetheart?</p>
      <p>But I like your long-termism—it seems to me that cheap long-distance phone calls have diminished letter-writing, and hence handwriting. Why write a letter to someone when you can call them up? </p>
      <p>I don’t think the absence of a professional epistolatory culture means that handwriting has atrophied.<br>
      Just because common handwriting today is casual and often crude doesn’t mean that it isn't a distinct cultural style.</p>
