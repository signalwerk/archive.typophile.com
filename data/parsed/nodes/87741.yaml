      <p>Hrant: <em>A lack of respect for content is one other characteristic of delusional handwriting-junkies.</em></p>
      <p>Hrant, this doesn't strike me as either fair or helpful comment. If someone who is a vegetarian, who is disgusted by the thought of raw meat, doesn't want to watch a video of an animal being killed -- even by other animals --, I don't think that constitutes 'lack of respect for content'. I might as easily and as unfairly suggest that your individual interpretation of that content re. the actions of the bull bison -- contra David Attenborough's commentary -- constitutes a lack of respect for content. [Personally, I think it would have been better if the commentary made explicit what is in fact the case: that we don't <em>know</em> whether the bull taking down the calf was accidental or deliberate.]</p>
      <p>And I say this as someone who thinks having nice handwriting will not, in fact, be a useful skill to possess if the various apocalyptic options listed by Dina pile on. If she is genuinely concerned about these things, she should start learning how to forage, learn what vegetables grow natively in her local environment, learn how to distinguish edible and poisonous mushrooms, etc.. While she's about it, she might want to read Lierre Kieth's <em>The Vegetarian Myth</em> and make a reckoning of just how many billions of animals are killed every year to support non-meat diets.</p>
