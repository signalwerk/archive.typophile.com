      <p>Dina: <em>I never asserted that "nice handwriting" would be a useful skill in the dystopian future. I thought it was clear I meant ANY handwriting. No electronic keyboards working, y'know.</em></p>
      <p>Fair enough. But so far as I know, no one is suggesting that people cease to be taught to write by hand, such that they will be incapable in the absence of electronic keyboards. What is being phased out is the teaching of cursive writing based on historical models.</p>
      <p>Now, if people in the future rediscover a need to write a lot of stuff for other people to read and to write it quickly, then they will reinvent cursive writing, because that's what epistolary societies do. Today, if we want to generate a lot of text in a hurry, we type it. If at some point we can no longer use this technology, we'll start writing fluidly again. In the meantime, anything we need to write by hand is typically short and either doesn't require speed or doesn't require care.</p>
