      <p>I too am disturbed that cursive may no longer be taught to schoolchildren. Apparently we can assume all have access to computer keyboards and that is the standard method. </p>
      <p>I just read a blog post by a father who heard his high school son complain of difficulty reading italic text. Italic! Cause of course - the letterforms are based on classic hand lettering.</p>
      <p>Where is this going? I can imagine:</p>
      <p>a detective finding a handwritten note at a crime scene...is it a suicide note or a grocery list? He can't read it, so has to pass it on to a cursive writing specialist for analysis (maybe this already happens). </p>
      <p>He can't read a letter from 1976 in a police file, or one received from his grandmother (who has beautiful handwriting). </p>
      <p>Can't write a love note to his darling unless he has access to a suitable font and printer, before slipping it under her pillow. If they are out at a romantic lakeside cabin with no computer equipment, he tries to laboriously print the note but decides to just text it to her cellphone. Figures she can't read or write cursive either.</p>
      <p>I'm prejudiced I guess because I love beautiful hand scripts and other forms of handlettering. But I agree crappy handwriting is irritating to look at. </p>
      <p>An analogy can be made to singing. A lot of people are very bad at singing or even tone deaf. Does that mean kids shouldn't be taught singing or playing instruments, because obviously recorded music sounds better (yeah, I know), so why not rely on a collection of that and not try to do it yourself half-assed?</p>
