    html: "<p>It seems to me that one can trace changes in the teaching of handwriting relative to what secretaries are doing at any given time. In societies with low levels of literacy, in which even rulers may be illiterate, professional scribes emerge as record keepers, amanuenses, letter writers: the birth of the secretarial profession. This profession exists parallel to that of the scribe who is a copier of books, and it requires a different kind of script: something faster to write than formal book hand. And so demotic, cursive scripts evolve, displaying the characteristics of speed: abbreviation of forms, joining of letters, horizontal compression, and slant. Because these are professional scripts, they are refined as a means of controlling entry to the profession, and hence another new profession emerges, especially as literacy increases: the writing master. The writing masters teach secretarial hands, and mercantile capitalism and the development of international trade produce a large market for the skills they advertise, and this market drives the development of a new kind of publication: the writing manual. Meanwhile, the secretaries are busy and, between Arrighi et al publishing italic writing manuals and Barbedor his <em>les écritures financière,</em> they abandon the broad nib quill and reed, and start writing with pointed, split nib steel pens. This new tool drives the development of new scripts, based on pressure rather than nib angle, and the steel pen and its associated scripts remain in professional use through to the early 20th Century. Meanwhile, with the spread of school-based education and further increases in literacy, the teaching of writing has moved from the domain of private writing masters into something resembling our own education system. But it is still contemporary secretarial hands that provide the models. In the second half of the 19th Century, standardised and in some respects simplified models are proposed to aid the teaching of writing -- a subtle change: the goal is no longer competence in the secretarial hands per se, but pedagogical efficiency --, and hence Palmer and others. Meanwhile the secretaries, although still writing a lot by hand, have started to use typewriters, and that is going to have a profound effect on the teaching of handwriting in the 20th Century, long before it was suggested that the computer makes the teaching of handwriting unnecessary. Gradually, the secretarial profession ceases to provide a stable model for writing. Alongside the typewriter, new kinds of pens are being invented: fountain pens with built-in reservoirs, round nibs producing monoline strokes, the first rolling ball nibs, etc.. Writing implements become a matter of personal choice rather than professional determination. Since the secretaries, whose professional prestige -- so long founded on fine handwriting -- has been completely demolished by the speed of the typist, are no longer committed to a particular tool or, indeed, to particular styles of writing, the schools too start accepting new kinds of pens, eventually making decisions on budgetary grounds, whence cheap ballpoints. But they continue to teach, long past their sell-by date, the last models -- however degraded -- that they received from the secretarial hands in the late 19th Century, because no one has come along with a new secretarial hand in the meantime. In Britain, and among some educators elsewhere, the gradual degradation of the various 'copperplate' models and their patent unsuitability to the new pens prompts a crisis, which is met by fleeing to the past and rediscovering the typical script of long, long dead Italian secretaries. Hence, a depressing amount of the debate about the teaching of handwriting -- even as the personal computer took hold in the workplace, the home and the classroom --, has been about whether it should be based on 15th or 18th century models. A few individuals have sought to provide new models, better suited to modern writing implements, but despite their virtues these tend not to be widely adopted. Why not? Because secretaries don't need them, and when it comes to writing, what secretaries don't need, no one else needs. Handwriting is on the way out because there is no professional epistolary culture either driving the development of new styles nor providing a milieu within which to employ such styles. And this has been the case for about a century. What we're seeing isn't something that has been brought about by the computer, but the tail end of a long process.</p>"
