    html: <p>I had very good handwriting in grammar school.  By the time I had finished college (and written 100 exam essays in blue books in 2 hours or less), my handwriting turned to speed writing scrawl.  I am of the age when boys were not taught to type so I can't type the proper way either!  I started "typing at age 40, when I got my first computer.  I type badly and slowly.  It has nothing to do with laziness.  My hands can't keep up with my brain so I just would rather not loose a train of thought just to make my handwriting better.  When I send written things to others, I either type it or occasionally use Calligraphy.  The message and audience chooses the medium.  I am the only one who has to read my handwriting so it does not matter.</p>
