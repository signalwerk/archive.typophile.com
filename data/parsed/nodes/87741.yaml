      <p>I've recently heard that some schools in the USA have eliminated or are going to drop penmanship, or cursive writing, from the school curriculum.</p>
      <p>Cursive handwriting is on its way out in our computer-focused society.</p>
      <p>It's not needed anymore. Young students do not write anymore.</p>
      <p>I find this disturbing. Add to this, that all these young people have their own language (LOL, etc.) and no one writes out complete words or sentences anymore. No one knows when to use "I" or "me" properly. No one reads books anymore and I could go on-and-on.</p>
      <p>WHAT THE HELL IS GOING ON??? Are we all going to get stupider?</p>
      <p>I guess that the only solution is to keep making more new fonts.</p>
      <p>More beautiful fonts will make the world communicate better. A better place.</p>
      <p>I'm being sarcastic.</p>
      <p>But, I do see that since no one will write anymore. They can just choose a font as their personal penmanship style.</p>
      <p>Certainly almost enough fonts to do that, or soon will be  ;-)</p>
      <p>I'm going to start working on improving my penmanship again.</p>
      <p>When I was a student I got A+ in cursive writing. I don't know what happened. Now, I can hardly even read my own handwriting.</p>
      <p>New Years Resolution (Improve my writing skills)... I'm a type designer for Christ's sake!</p>
