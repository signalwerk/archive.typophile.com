    html: |-
      <p>The rounded sans for display, with Arial for other text, are all the typefaces you need.</p>
      <p>You could perhaps use @fontface to choose a replacement for Arial, e.g. a sans which has a lighter weight.</p>
      <p>You like to work with type by colouring and over-laying -- nothing wrong with that (and your site has great colour and movement) -- but don't overdo it: try to make the content of your site the star, not over-elaborate typography and design.</p>
