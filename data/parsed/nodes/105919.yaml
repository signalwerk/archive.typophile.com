      <p>Perhaps the most widely used system is the Vox-ATypI classification. For listing and defining characteristics there is a wiki at:<br>
      <a href="http://en.wikipedia.org/wiki/Vox-ATypI_classification" title="http://en.wikipedia.org/wiki/Vox-ATypI_classification">http://en.wikipedia.org/wiki/Vox-ATypI_classification</a><br>
      Note two different uses of "realist" from the wiki:<br>
      1. "'Realist sans-serif' is a commonly encountered synonym for neo-grotesque."<br>
      2.  "The transitional, realist or réales are the typical typefaces of the traditional period, particularly embodying the rational spirit of the Enlightenment"</p>
      <p>---start extended quote--<br>
      Neo-grotesque typefaces are derived from the earlier grotesque faces, but generally have less stroke contrast and a more regular design. Unlike the grotesque, they generally do not have a spurred "G", and the terminals of curves are usually slanted. Many neo-grotesque faces have a large degree of subtlety and variation of widths and weights to accommodate different means of production (Hot type, foundry type, phototypesetting, see History of typography, 20th century).  "Realist sans-serif" is a commonly encountered synonym for neo-grotesque. Examples of neo-grotesque lineal typeface include Helvetica and Univers.<br>
      ---end extended quote---</p>
      <p>Don</p>
