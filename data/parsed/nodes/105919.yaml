    <p>Recently I came upon a typeface class called, Realist(you guys have probably heard about it). Is it the same as Grostesque, because I saw it used for typefaces such as Akzidenz and Franklin Gothic. If not, can you please tell me about some of its characteristics.</p>
    <p>I basically know(I think) all the general classes but can someone list them and their defining characteristics.</p>
    <p>Thanks</p>
