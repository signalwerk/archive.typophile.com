  html: |-
    <p>For several corporate identity projects, i'v been trying out fontshop fonts.<br>
    more sepcifically, i've looked at some corporate families,</p>
    <p>- officina<br>
    - fago<br>
    - zine<br>
    - unit</p>
    <p>and so on.</p>
    <p>I really like these fonts, but with their narrow letters and loose kerning, and just can't figure out how to make body copy look good with them. </p>
    <p>any tips or comments?</p>
    <p>alex</p>
