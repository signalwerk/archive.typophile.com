      <p>Not the same thing. Aldine 721 is Bitstream's clone (some would say blatant copy) of Monotype Plantin. I have compared these two closely--for all intents and purposes, they are identical. If you want authenticity, buy Plantin. Though if you have one of the Bitstream monster CDs already, then you have Aldine 721 on the cheap, so just use it and be happy.</p>
      <p>As far as I know, "Linotype Plantin" is the same as MT, they simply cross-licensed years ago, back when Plantin was a popular typeface in the newspaper industry.</p>
      <p>"News Plantin" is a condensed version of Plantin, approximately 20% condensed, with tighter letterform tracking as well. It is very close in look and feel to good-old Times Roman and Times New Roman, as well as Dwiggins' New Caledonia. The Bitstream clones of Times and News Plantin are the Dutch faces, I forget the specific numbers.</p>
