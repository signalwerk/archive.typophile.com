      <p>Ryan, </p>
      <p>even my mother can tell that Aldine 721 and Plantin MT look different, though she is not able to be as precise as to say that the Aldine vertical strokes are even in rhythm, whereas Plantin has more of an oldstyle beat. </p>
      <p>I myself prefer Bitstream's version -- it has a more solid color, better spacing and is overall a better text typeface. In fact, it is one of my favorite text faces of all times. </p>
      <p>I used to think that the Bitstream versions are "blatant copies" and pitiful clones, obviously inferior in quality, until I came to realize that when the digital versions of many classic typefaces were made,  Linotype, Monotype and Bitstream all digitized the faces in a certain hurry, using somehow primitive equipment. The difference was that Linotype and Monotype owned the trademarks but they also had constraints resulting from the fact that those faces have undergone multiple adaptations for photo composition so often the latest drawings had little to do with the metal originals -- and you were never sure what was the basis of the digitization. </p>
      <p>Bitstream did not have the trademarks but they did not have the said limitations either. Also, keep in mind that in that time, Bitstream operated under the typographic supervision of Matthew Carter, and that some designers such as Hermann Zapf consulted on the Bitstream versions of their Linotype designs. Others such as Adrian Frutiger did not approve of the Bitstream digitizations but in 2003, Linotype officially approved the Bitstream versions of Frutiger's faces such as Frutiger (Humanist 777) and Univers (Zurich) along with other designs including Helvetica (Swiss 721), Times (Dutch 801), and many others. </p>
      <p>So from the licensing point of view, Swiss 721 by Bitstream, Helvetica LT by Linotype, Helvetica by Adobe or Helvetica by Apple are just four different *licensed* versions of the same design. </p>
      <p>In case of Aldine 721, I don't think that Bitstream ever signed a similar agreement with Monotype, but as Florian pointed out, both Plantin and Aldine 721 are revivals of Christophe Plantin's punches. As I said, in this particular case I prefer the Bitstream face over the Monotype face, but there are cases where my typographic preferences are the other way around. </p>
      <p>But one thing is for sure: many text faces in the Bitstream font collection are of solid typographic and technical quality -- just like many among Linotype's and Monotype's offerings. And, there are some poor faces in all these libraries as well. </p>
      <p>Regards,<br>
      Adam</p>
