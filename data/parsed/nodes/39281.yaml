      <p>Also something to take in account: the MT-versions of Plantin (and there are a LOT of these floating around) are pests to work with. Suitcases with family links that don't work, trouble with previews in fontmanagers, RIPs choking on them and so on. MT messed up a lot of fonts in the early days, softwarewise.</p>
      <p>And I prefer the solid look of the BT, anyway.</p>
