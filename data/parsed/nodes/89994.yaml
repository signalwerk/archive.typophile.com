    <p>Hi everyone,</p>
    <p>Does someone have some examples of good font pairing with <a href="http://processtypefoundry.com/fonts/klavika/" rel="nofollow">Klavika</a> on the web ?<br>
    I'm looking for a webfont for body copy which could be matching with Klavika (on headings).<br>
    Some things I'm focusing on : modernism / creativity / legibility / Good rendering (on multiple OS/browsers) / Special char (like french accent : é - è - è etc.)</p>
    <p>Any suggestions ?</p>
    <p>Thanks for your help !</p>
    <p>ps : I'm using Typekit for webfonts</p>
