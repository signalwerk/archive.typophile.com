    <p>Jim Wasco was a long-time type production staffer at <a href="/wiki/Adobe%20Systems" class="freelinking link-lost" rel="nofollow">Adobe Systems</a>. Following a round of layoffs in 2002, he landed at <a href="/wiki/Monotype%20Imaging%20Inc." class="freelinking link-lost" rel="nofollow">Monotype Imaging Inc.</a>, for whom he soon headed up their <a href="/wiki/Redwood%20City" class="freelinking link-lost" rel="nofollow">Redwood City</a>, CA development office. He is the designer of Harmonia Sans, ITC Elegy, and co-designer with <a href="/wiki/Min%20Wang" class="freelinking link-lost" rel="nofollow">Min Wang</a> of the Adobe Original typeface "Mythos," a fanciful all-caps design featuring monsters and creatures shaped into letters.</p>
