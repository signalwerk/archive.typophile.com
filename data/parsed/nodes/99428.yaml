      <p>I guess you already knew this is not quite custom but a font named <a class="freelinking external" href="http://www.jhische.com/blog/valentinescript.jpg" rel="nofollow">Valentine Script</a> by Jessica Hische. So why not switching for one her creation <a class="freelinking external" href="http://www.myfonts.com/fonts/jhische/buttermilk/" rel="nofollow">Buttermilk</a>, this one available to purchase.<br>
      Anyway, some suggestions I like for this sample, clearly not similars: <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/pauline-didone/" rel="nofollow">Pauline Didone</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/chikita/" rel="nofollow">Chikita</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/dorchester-script/" rel="nofollow">Dorchester Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/kimmy/madeleine/" rel="nofollow">Madeleine</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/4thfebruary/ola-script-4f/" rel="nofollow">Ola Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/sweet/upright-script/" rel="nofollow">Sweet Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/fling/" rel="nofollow">Fling</a> ("<a class="freelinking external" href="http://www.myfonts.com/morelike/736/#return_to_item_9" rel="nofollow">More Fonts Like Fling</a>" at MyFonts), <a class="freelinking external" href="http://www.myfonts.com/fonts/wearecolt/giddelham/" rel="nofollow">Giddelham</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/laura-worthington/samantha-upright-script/" rel="nofollow">Samantha Script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fenotype/mishka/" rel="nofollow">Mischka</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/little-cecily/" rel="nofollow">Little Cecily</a>, <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/sofia" rel="nofollow">Sofia</a>, <a class="freelinking external" href="http://www.dafont.com/sachiko.font" rel="nofollow">Sachiko</a>, <a class="freelinking external" href="http://www.haroldsfonts.com/roselyn.html" rel="nofollow">Roselyn</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/artlebedev/dulsinea/" rel="nofollow">Dulsinea<