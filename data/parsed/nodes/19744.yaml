    html: |-
      <p>Wow, very nice. That "e" is da bomb.</p>
      <p>- I would shorten the descenders.<br>
      - The right side of the foot serifs in "f" and "r" should be longer.<br>
      - I might tilt the head serifs in "i" and "j" (and maybe "u") downward.<br>
      - k: needs more presence.<br>
      - o: might actually work!<br>
      - r: beak join crappy.<br>
      - s: super.<br>
      - t: too wide.<br>
      - v, w: not enough character. Try bending stuff.<br>
      - y: tail too clunky.</p>
      <p>BTW, if you make lighter weights, apply high stroke weight contrast.</p>
      <p>hhp</p>
