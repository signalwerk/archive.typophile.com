    html: |-
      <p>Looks good.<br>
      Some of the characters don't seem wide enough like the a, e, h, k, s, m, n and u. I'd probably redesign the w. </p>
      <p>I think stylistically the clamp-like shapes your using give the font a very utilitarian/ strong look which really works with the b, d, g, p, q and r. They don't work as well with the h, m and the n. The point on the top of the p seems to work but i think with these letters it's too distracting. </p>
      <p>The lowercase o also could be redone so it has a more consistent weight with the rest of the font. </p>
      <p>Is there an uppercase? How does it look in text?</p>
