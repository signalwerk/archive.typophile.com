      <blockquote><p>they need to acquire their own licences</p></blockquote>
      <p>Yup, pretty much.  :-/</p>
      <p>Many font houses don't even allow the print bureau borrow-then-delete scenario you mention. You can probably understand why (that last "delete" bit won't actually happen). Heck, some of them don't even allow PDF embedding! I myself believe this last one is too much.</p>
      <p>Work-around? Here's the only one I can think of, although it's a massive gray area: transfer ownership of the font to the contractor; once they're done they transfer it back. Which means you're supposed to delete the fonts until they transfer them back to you (and they're supposed to delete them at the end). Of course even if this process is legal the results are likely to be unethical.</p>
      <p>hhp</p>
