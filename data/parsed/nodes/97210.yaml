    <p>Hi all, im new hear, so please be gentle. Ive done a bit of a search, ok extensive, and cant find any definitive answer, maybe there isnt one... Or maybe someone here can shed some light/wisdom.</p>
    <p>I, as the studio manager endeavour to keep our licensing completely legal and avoid any infringements. We are a production department within an agency, and generally we do all our work in-house. Our licences cover this in excess (approximately 30 machines) but I always purchase 40-50 to cover growth etc.</p>
    <p>Recently due to increased workload we have come into the situation where we have had to commission external parties (freelance suppliers) to build our designs (albeit webpages and micro sites) based off our photoshop designs supplied to them. The fonts in these designs are completely static, however we need to supply them the fonts to create/build the work. These freelance suppliers generally work from home or their studio. Is such work covered under the majority of EULA?</p>
    <p>My concern is, if it is not, and they need to acquire their own licences, it could potentially blow out budgets significantly, where a $200 piece of work could potentially end up in the thousands after purchasing additional licences for their site/location.</p>
    <p>Or would this be covered similarly to a print bureau, where fonts are supplied to output/print the work then deleted after the completion of the job.</p>
    <p>Alternatively can you suggest any other ways around this?</p>
