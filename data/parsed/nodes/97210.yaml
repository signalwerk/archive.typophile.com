      <p>Neil, in the case of most foundries, licensing is based on a requirement for each computer or device hosting the fonts to have a license. Additionally, licenses are usually (though not always) arranged on the basis of a specific user or company, regardless of whether the license is for a single user or 10,000. Sometimes that restriction is geographical as well. A freelancer, third party or other entity not named on the license would therefore require their own license if the font(s) are going to be resident on their computer or device.</p>
      <p>In the case above I was specifically responding to Justin's question about distribution through a remote server tool or third party access to a font management database. This scenario implies that the remote user is accessing the font(s) on their computer, which is not part of the licensed entity. What you are describing is a scenario in which a user is remotely accessing and using fonts on a licensed computer, which means (to my mind, in this context) that the fonts remain resident on the licensed computer and are not moved to the third party computer.</p>
      <p>To your other point: if you have a scenario in which a computer has a licensed copy of the font software on it, why should it matter who uses that computer? As long as they are not modifying the font software, duplicating it for re-distribution, producing work or embedding the font file in ways expressly prohibited by the EULA or for an individual, group or entity other than that licensed to use the font(s), it does not matter who uses the computer.</p>
