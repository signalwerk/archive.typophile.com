    <p>I’ve designed a logo for a company and I’m using HTF’s Bodoni. Do you think it’s overkill if I’m creating logo configurations using the correct sizes of Didot? … requiring the designer to choose the correct file for the required final size. I just finished setting all these files up and now I’m wondering if I’ve made using the logo more complicated than it’s worth.</p>
    <p>In retrospect my typeface choice feels questionable. Think this is at odds with an important function of a good logo, working at all sizes. But maybe that’s all ok … just got some particular usage requirements which aid the goal of looking good at all sizes. <a href="http://www.thekyostudio.com/vallani/Vallani_logo_cd.pdf">This is a pdf</a> I was going to include with the files on a CD. Then attached that CD inside of a spiral bound booklet with <a href="http://www.thekyostudio.com/vallani/Vallani_logoBooklet.pdf">these pages</a>. I’ve got some kind of weird design remorse from looking at the dang thing too much.</p>
