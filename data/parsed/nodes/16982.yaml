      <p>It might be easier to encourage proper use if you showed examples which demonstrated why you have chosen to do this, perhaps overlaying the logos at a large size so the differences are obvious. </p>
      <p>It might also be an idea to provide templates in Quark or InDesign for some basic page/ad sizes with the correct logos in place. </p>
      <p>In your booklet provide the file name and the minimum size it can be used, I have included that information in the file name in the past, e.g. bloggs_cmyk_55mm.eps. I would also include a pdf of the booklet on the CD with a .zip folder(s) of logos so the brand guardian/printbuyer can e-mail the information with any design brief.</p>
      <p>Tim</p>
