      <p>It’s not overkill.</p>
      <p>Pre-digital, design firms would supply repro-quality logo sheets with the logo at different sizes, to be used pasted-up size-as in things like pub-set newspaper advertisements, brochures prepared by third parties, eg direct-mail specialists or retail store flyers.</p>
      <p>Top designers, working for blue-chip companies, provide standards manuals for logo usage, which are implemented in-house by “logo police”. If something like color can be a big issue for conformity, why not optical size?</p>
      <p>An engineer would be inclined to create a “multiple master” file that displays the correct optical size of the logo, depending on its scaling in the layout/rasterizing application. </p>
      <p>But why should such things be automated? Automation lessens the appreciation for such subtleties, because it removes the necessity for production artists to know and care about such things.</p>
