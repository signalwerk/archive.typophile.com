      <p>The problem might be the capacity of your client to manage this brand system, if they have their own designer this should not be a problem, but if they don’t either you or some other respectable designer will be doing all of their stuff or you will have problems with people using the wrong optical size all the time.</p>
      <p>Also you have to do a clear guide for this thing, I can´t see where you are telling which size is for which usages or size ranges. It has to be clear and simple.</p>
      <p>I find the multiple logo configurations to be more problematic than the size ranges, if you choose a wrong size it may not hurt as much as if you have a disjointed logo whose parts will be randomly used. It is very suceptible to an asistematicity.</p>
      <p>I would only go for logo configurations A-3 and C-3 and would reserve the symbol for special usages (page 9, second pdf).</p>
      <p>Héctor</p>
