      <p>Oh, another thing: if you digitize it, don't say the following when you sell it (on MyFonts.com or whereever): This is my NEW FONT, by Eric West. Better for everyone's karma would be wording like: Gotika (or, insert other name here), originally by Imre Reiner, 1933. Revived and Updated* by Eric West, 2005.</p>
      <p>*Updated, because you clearly must update it. Old metal types almost always cannot/should not be redone just 1:1 digitally. Some things must invariably change to suit contemporary usage. Not to mention that today's standard character set is quite different than one from 1933. The Euro, for instance! But subtle things, too, e.g., Small Caps, different figure options, etc.</p>
