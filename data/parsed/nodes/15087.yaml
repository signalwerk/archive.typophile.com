    <p>Attached is a sample of the right leg where stem meets serif. I was noticing that the stem, if using a purely geometric rectangle for the serif, visually makes the serif look like it bows. The sample on the left side, I raised the serifs a bit at the base of the stem, seems to work better, doesn't bow anymore, at smaller sizes,at least, If you make it too big, the mod's become apparent. Any suggestions, diff was to bracket or maybe just a more subtle angle, or even maybe an extremely shallow curve?  AA.jpg</p>
