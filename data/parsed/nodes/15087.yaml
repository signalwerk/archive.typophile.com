      <p>This is tricky. Everyone seems to have a different answer here.</p>
      <p>For a font this old, there are no legal problems (probably) with digitizing the design. The designer is dead, but he may have relatives who are involved in design. This happens sometimes, that they would like to have their permission asked.</p>
      <p>I don't think you can call it Gotika though, although that would take some research. Bauer released the font, and the Neufville Foundation in Spain is Bauer now. They hold the old copyrights, and distribute fonts (digitizations of old ones and new fonts, too… for instance the best digital version of Futura available is theirs… Bauer Germany released Futura in metal in 1927). It is within the realm of possibility that they are working on their own revival, in which case they may have already applied for a design patent in the European Union. A typeface's design may be registered and protected within the EU for 25 years. Older designs cannot in general be patented, but you never know.</p>
      <p>Some people will tell you to ignore all of this, and they would call it all "unreasonable." I think that it would just be polite. If we were talking about a type foundry which had NO connection with the present, or a type from the 1800s, it might be a little different. Its best to go case-by-case on this.</p>
      <p>Honestly, in my opinion, the best thing to do would be to digitize it, and then submit it to Neufville. If they would take it and distribute it for you, then you could call it Gotika for sure, and there wouldn't be any problems at all ever, because they would back it, etc.</p>
    html_clean: |-
