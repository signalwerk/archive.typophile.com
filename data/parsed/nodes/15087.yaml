      <p>Oh my, that isn't Gotika at all. That may be based on a Fraktur that Reiner drew at some point. Some resources are better to rely on than others. Just because a designer, or someone else, dubs something a revival, that doesn't necessarily make it so. And some fonts that don't call themselves revivals are…</p>
      <p>A good reference is the Klingspor Museum in Offenbach, which has lists for most major 20th Century German type designers (and then some…) on its site. <a href="http://klingspor-museum.de/Kuenstler.html" rel="nofollow">Here is the list</a>, and here is the PDF for Reiner: <a href="http://klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Reiner/ImreReiner.pdf" title="http://klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Reiner/ImreReiner.pdf">http://klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Reiner/Imr...</a></p>
