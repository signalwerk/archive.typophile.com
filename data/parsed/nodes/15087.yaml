      <p>Sorry not to get back to this sooner, Eric, I was away most of the week at the ATypI conference in Helsinki.</p>
      <p>1. Whether display or text, conventions change over time. We use type in 2005 differently than we did in 1933. Also, the original Gotika was made primarily for German-language use. But I can almost guarantee you that any revival of Gotika that you make will primarily be used anywhere else but Germany (but this isn't the place for another Blackletter debate).</p>
      <p>Lots of glyphs we use today (even in display faces, like the Euro and the @ symbols, just to name a few, were probably never cast in metal for the original Gotika. And don't forget the need for accents, even CE, Baltic, and/or Turkish accents, because German accents alone just won't be enough (see above paragraph).</p>
      <p>And, in the past, mistakes were sometimes made. Sadly, you probably can't get your hands on Reimer's notes (if such things exist) to see when and how he made which decisions, and why.</p>
      <p>2. I think that literal revivals are far less interesting than adaptations. Some change is good. Just make sure that your customers know which changes, if any, you make, and why. They'll thank you for your honesty and clarity.</p>
      <p>3, I don't know where you can get better images of Gotika. Paul Shaw and Peter Bain wrote a series of books for a Blackletter exhibition at Cooper Union in 1998. These have Gotika images inside them. Also, some public libraries in the US may have some copies of specimen books with Gotika. Any 1930s or 1940s Bauer book would do, I guess. If you ever come to Germany, I could show you some resources in the Frankfurt area. If I were you, I would e-mail Neufville in Barcelona (?) and ask them if they have and/or know of any other resources.</p>
      <p>How's that?</p>
