    html: |-
      <p>I've been looking for such a software too.</p>
      <p>I have tested Inkscape and CorelDraw and there are some things that differentiate them.<br>
      While in Inkscape, using the Wacom Intuos tablet, is getting closer to the traditional way of writing calligraphic texts, in CorelDraw things can be more precisely controlled but less of a gesture.</p>
      <p>In CorelDraw there is an "export to TTF" option.<br>
      In Inkscape (the latest build, not yet 0.47) there is the possibility of saving brush settings. And spiro.</p>
      <p>Here are some of the tests I did in Inkscape.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/800 inkscape_6450.jpg"></div><p></p>
      <p>One advantage of digital calligraphy is that kerning can be adjusted. One disadvantage is the lack of texture like in epixs works from behance gallery.</p>
      <p>I haven't tested Illustrator yet.</p>
      <p>I think working with traditional tools and then scanning, tracing and adjusting is much easier and better for now.</p>
