      <p>Jordan, et al</p>
      <p>Very interesting and fun programs. I came away with two thoughts.</p>
      <p>1)By the time that the demos finished several letters most calligraphers would have been finished with "the piece." 2) As an origination program it definitely has its pluses, but would fall short when it came to the subtle nuances that can be achieved with pen manipulation. In the "n" example below (FB Pouty) the black dots represent attitudinal (angle) shifts and in most cases an addition of pressure on the pen to create waisting. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/italic_3431.png"></div><p></p>
      <p>I guess what I am trying to say is that they are wonderfully basic tools (or just a starting point), so why not do it with ink and pen and get the whole enchilada at one time. Don't get me wrong... I embrace technology, I just prefer the human touch.<br>
      Michael</p>
