    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: Bezier&nbsp;Curves</strong></p>
    <p>Bezier curves are mathematical expressions used to describe curves in two or three dimensions. All fonts, excluding <a href="/node/13939" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bitmap</a> fonts, use bezier curves to describe the character shapes. Because the curves are mathematical they have the advantage of being infinitely scaleable. Therefore, a character described in bezier curves can be resized to any size without losing quality. Bezier curves are sometimes referred to a “vector graphics”, contrasting with bitmaps which are called “raster graphics”. Some software that authors vector graphics are the following: <a href="/node/15404" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe Illustrator</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Macromedia%20Freehand" title="Create node &quot;Macromedia Freehand&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Macromedia Freehand</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Macromedia%20Flash" title="Create node &quot;Macromedia Flash&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Macromedia Flash</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Deneba%20Canvas" title="Create node &quot;Deneba Canvas&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Deneba Canvas</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Corel%20Draw" title="Create node &quot;Corel Draw&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Corel Draw</a>, <a href="/node/12024" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fontographer</a> and <a href="/node/12240" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontLab</a>.</p>
    <p>Bezier curves consist of two anchor points and any number of control points. Curves with one control point are called quadratic curves because the forumla used to calculate them is based on a quadratic equation. Curves with two control points are referred to as cubic curves. <a href="/node/13679" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TrueType</a> fonts use quadratic curves, while <a href="/node/add/wiki?edit%5Btitle%5D=Type%201" title="Create node &quot;Type 1&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Type 1</a> fonts use cubic curves. While curves may use more control points, they are not used commonly in type rendering technology. Because quadratic curves are more difficult to work with (mostly because it’s harder to make circles), most vector authoring software uses cubic curves with two control points. What’s more, it is a simple operation to convert cubic curves to quadratic. However, it is not possible to convert quadratic curves to cubic without some&nbsp;approximation.</p>
