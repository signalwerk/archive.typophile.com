    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Bezier Curves</strong></p>
    <p>Bezier curves are mathematical expressions used to describe curves in two or three dimensions. All fonts, excluding <a href="/wiki/bitmap" class="freelinking" rel="nofollow">bitmap</a> fonts, use bezier curves to describe the character shapes. Because the curves are mathematical they have the advantage of being infinitely scaleable. Therefore, a character described in bezier curves can be resized to any size without losing quality. Bezier curves are sometimes referred to a "vector graphics", contrasting with bitmaps which are called "raster graphics". Some software that authors vector graphics are the following: <a href="/wiki/Adobe%20Illustrator" class="freelinking" rel="nofollow">Adobe Illustrator</a>, <a href="/wiki/Macromedia%20Freehand" class="freelinking" rel="nofollow">Macromedia Freehand</a>, <a href="/wiki/Macromedia%20Flash" class="freelinking" rel="nofollow">Macromedia Flash</a>, <a href="/wiki/Deneba%20Canvas" class="freelinking" rel="nofollow">Deneba Canvas</a>, <a href="/wiki/Corel%20Draw" class="freelinking" rel="nofollow">Corel Draw</a>, <a href="/wiki/Fontographer" class="freelinking" rel="nofollow">Fontographer</a> and <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a>.</p>
    <p>Bezier curves consist of two anchor points and any number of control points. Curves with one control point are called quadratic curves because the forumla used to calculate them is based on a quadratic equation. Curves with two control points are referred to as cubic curves. <a href="/wiki/TrueType" class="freelinking" rel="nofollow">TrueType</a> fonts use quadratic curves, while <a href="/wiki/Type%201" class="freelinking" rel="nofollow">Type 1</a> fonts use cubic curves. While curves may use more control points, they are not used commonly in type rendering technology. Because quadratic curves are more difficult to work with (mostly because it's harder to make circles), most vector authoring software uses cubic curves with two control points. What's more, it is a simple operation to convert cubic curves to quadratic. However, it is not possible to convert quadratic curves to cubic without some approximation.</p>
