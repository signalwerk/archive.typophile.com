      <p>Hm.</p>
      <p>&gt;My first approach was I redesigned the script based on Thai modern grid. However, one of my supervisor suggested that I should use the ancient proportion to create the typefaces. </p>
      <p>What sort of 'grid' do you mean, and why are you using a grid? Converting a handwritten script to a typographic script is not really about using a grid; it's about enforcing regularity and evenness that handwriting cannot achieve.</p>
      <p> These letterforms look very much like modern-day Khmer, so if any grid is suitable, I'd use a Khmer grid. BUT: isn't that disrespecting the Khom heritage? I'd personally want to look at as many example of Khom script as possible, to understand the behaviour and proportions intrinsic to the script. </p>
      <p>Be very cautious about 'modernising' a script. Giving modern typographers the tools they need for complex typographic environments is not necessarily at all about making changes to letterforms.</p>
