    html: <p>Both ways are certainly possible, it depends on what sort of typeface you're designing. My feeling is that pen-informed constructions give a sufficient set of parameters for text typeface design (the tool confers regularity and a human warmth to the design), whilst I haven't seen many successful non-pen-informed (chirographic) text designs. What that means is that alternative models using non-chirographic forms are ripe for exploration, probably better in subtle ways to avoid upsetting comfortable readability.</p>
