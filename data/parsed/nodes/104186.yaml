      <p>William: <em>You judge the outcome by what works for the eye (and brain). What works for the eye […]</em></p>
      <p>What the eye (and brain) perceives is mostly the result of conditioning (which, when it comes to type and typography, differs per script). In <em>Art and Illusion</em> Gombrich notes on this phenomenon: ‘<em>The stimulus patterns on the retina are not alone in determining our picture of the visual world. Its messages are modiﬁed by what we know about the “real” shape of objects.</em>’ David Kindersley deﬁned the matter in <em>Optical letter spacing</em> simpler as: ‘<em>It is a commonplace that we see only what we know […].</em>’</p>
