      <p>Thank you all very much for your valuable opinions on the subject.  This discussion has shed some light on my own curiosity, which is very useful for the project I am  working on. In my personal point a view, I think it is better to understand the root of alphabets, especially on how they were constructed to build better typefaces. However, I had a long discuss on this matter with my supervisors. Both of them have different opinions on this debate.</p>
      <p>To explain more about my thesis, I am working on redesign an ancient script in Thailand called Khom Thai to make it's more accessible for modern audiences. My first approach was I redesigned the script based on Thai modern grid. However, one of my supervisor suggested that I should use the ancient proportion to create the typefaces. On the other hand, the other one suggested that I should stick with the modern grid since my objective in this project is about modernising this type of script. For this reason, I thought it is better to ask for professional designers' opinions so thank you all again for your valuable opinions. </p>
      <p>I have put the link of a rough sketch I made for my project with this post. These alphabets are Khom script used in both Thailand and Cambodia. As you can see, the structure is quite complex and this script has very long ascendent and descendent, which I need to find the way to balance the proposition of the body and the cap height,etc. So I must decide whether I should design it based on its original script or use different approach. </p>
