      <p><em>…the process in developing calligraphy or original script into digital typeface.</em></p>
      <p><em>Would it be necessary to preserve the original strokes of the letters or would it be possible to eliminate the influence of the pen stroke out of the typeface design in order to create something new?</em></p>
      <p>Yes to both, as is apparent from precedent.</p>
      <p>Interestingly, the formal “joining rules” of calligraphy (most evident in the cancellescara style) have a logic which translates into OpenType feature code in a very direct manner.</p>
      <p>This is not the primary issue of “the stroke” as normally discussed in type design, which is more concerned with the stress of various nibs, but it seems to me that the ﬂow of connected letters in writing is equally, if not more, fundamental.</p>
      <p>**</p>
      <p>As it is possible to either preserve or eliminate pen-ishness, the question you must ask yourself is: how do write the script in the first place, to be amenable to a particular interpretation process?</p>
      <p>If, on the other hand, the script you choose to interpret was not created with fontworthiness in mind, then you must recognize in it something attractive (to you—intellectually and/or aesthetically) which you can leverage to a greater or lesser degree according to the typographic effect it produces, and hence make your own. Recognizing your own abilities in drawing and designing, as well as being aware of what is or is not technically possible, are major considerations.</p>
      <p>You will not be able to create Medusa, for instance, without being adept at roundhand with a pen, vector drawing with a mouse/stylus, and OpenType feature coding with a keyboard.</p>
