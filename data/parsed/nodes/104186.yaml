      <p>"If there are no rules, how does one judge the outcome?"</p>
      <p>You judge the outcome by what works for the eye (and brain). What works for the eye is a matter partly of ease of reading, meaning low fatigue and ease of comprehension, and partly a matter of aesthetics. There are no doubt complex rules involved, not fully understood, in people's brains. Though particularly for aesthetics, tastes vary from one individual to the next.  </p>
      <p>The important point for the question here is that the rules of good type—such as evenness of color—are not simply pen rules, the path that a pen would take in forming a letter. The rules of the broad pen were taken up as general guidelines in latin typefaces, and have deeply influenced expectations of readers. Thus conforming to these expectations helps readability to some extent. However, departing from them also can help, or be neutral. </p>
      <p>For example, most z's (including in this typeface, Georgia) depart from pen rules by having the diagonal of the z heavy, rather than light, which would be dictated by a broad pen doing a down stroke at 30-45 degrees. But in general, beginning with Jenson, letters are founded in pen rules, but also regularly modify and depart from them. Both the pen rules and the modifications are important. In particular there is a lot of modification of strokes for evenness of color. These may not change what is thick and thin on a letter, but they do violate what the pen would do in how thick or how thin a join or part of a stroke is. </p>
      <p>Further, as type history developed, there is more and more departure. For example, if I remember correctly Griffo had more symmetrical serifs than Jenson, and the asymmetrical serifs are more natural to the pen. For that matter, slanted letters are also more natural, but vertical ones more readable.</p>
