      <p>Frank: "What the eye (and brain) perceives is mostly the result of conditioning."</p>
      <p>"Mostly" is not accurate, if by 'conditioning' you mean what one learns from being habituated to reading a particular script. </p>
      <p>While habituation to a particular script does have an important impact, there is a much larger mechanism of pattern recognition that the eye and brain use, and this has still bigger impact on how we process and see words and letters. </p>
      <p>For example optical illusions—which incidentally Gombrich makes much of—affect practically every letter, and they operate outside the realm of letters as well. For example, dividing a space vertically, to make the division look equal the top half needs to be a little smaller. This rule applies whether you are designing the E or a chair or a building. It is not specific to scripts. </p>
      <p>Most significantly, issues of crowding, rhythm and color in type all are affected by eye-brain functioning in ways that are not script specific. Also non-linear features of optical scaling are not script specific. </p>
      <p>Being aware of 'pen rules' is essential in type design. Focusing *only* on pen rules is a narrow and misleading way of thinking about type, because you can violate pen rules in ways that have good results, so long as they work with the human perceptual system in a congenial way. </p>
      <p>Doesn't making pen rules dominant mean you can only create traditional looking serif types, and of a specific style? I *love* traditional type, but there are a lot of wonderful other designs.</p>
