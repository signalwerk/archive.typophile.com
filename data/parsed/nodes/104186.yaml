      <p>Dear Bendy,</p>
      <p>Sorry that I explained it's unclear. In Thailand the people also used the script,which came from Cambodia before 13th Century and we adapted the script to be able to read/pronounce Thai language since the Thai and Khmer phonetics are not the same. For this reason, some alphabets are different although the overall appearance is quite similar. Thai people call this script "Khom Thai script" refer to Khom script (or sometimes called Khmer script) which use in Thai language before we developed our own script or "Lai Su Thai" in 13th Century.</p>
      <p>This Khom Thai script was used for recording important events in our history. In Thai national archive, there have more than 100,000 ancient documents written in this script. However, in the present very few people are able to read the script and the public pay little attention to those documents so they are abandoned there without proper care. For this reason, The Thai national archive has urgent need for young staffs who are able to read the script to work with them.</p>
      <p>My project focuses on redesigning this script to teach Thai new generation so the main focus is on Khom Thai script which are used in Thailand. Khom script in Cambodia is not the centre in the scope of my study. However, I have reviewed the history of Khom script used in both Cambodia and Thailand in my literature. </p>
      <p>These typefaces I am working on are designed for Thai audiences that's why I have attempted to use Thai grid to design them. When I mentioned to Thai modern grid system, I didn't give details on the subject so I would like to explain more. Since the era of digital typefaces Thailand didn't have the standard proportion for font design so The Royal Institute of Thailand, a government organisation which has main responsibility in Thai language usage, appointed a committee to do a research on Thai type form  in order to create the national standard proportion for digital typefaces. They launched a manual in 1997 to give specification about the structure of standard proportion of alphabets by using Thai modern grid system, which became the regulation for designing typefaces.</p>
      <p>The reason why I attempted to use this specification for the Khom Thai script is because my hypothesis involves in testing the familiarity effect whether it could help people to read it better. Since modern Thai type form,especially typefaces used the Thai modern grid system to design, is familiar for Thai audiences, I am trying to make the script more understandable for those who have no prior knowledge in Khom script.</p>
      <p>However, I intend to use this modern typeface to test against another typeface I am designing based on the original handwriting of ancient people to observe whether which one help people to read better.</p>
      <p> The latter typeface will not use the Thai modern grid system to design, but the system in design will based on the analysis of handwriting I compiled from ancient documents. </p>
      <p>Anyway, Thank you so much for your comments. When you warn me to be very cautious about modernising a script, I think you made the right point which I might overlook at first. I should take this advice under my consideration before moving forward. Thanks again.</p>
