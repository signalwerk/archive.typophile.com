      <p>Frank, in your opinion are there perceptual processing reasons — reasons having to do with the structure and functioning of the reading system — why the things we learn from writing are important. The things we learn from writing (and what looking at writing that survived the test of time teaches us to see) are: rhythmic spacing, a consistent contrast scheme, and strategic construction. I don’t believe producing and adjusting to rhythmic spacing and a consistent contrast scheme are circumstantial niceties and primarily matters of habituation, like getting used to the formal grammar. The formal grammar has to do with the language of shapes the script uses, and the the structure of the space it occupies. For example the roman lower case occupies a space with three vertical zones. Strategic construction is construction that maximizes between-letter differences while staying within the stroke-grammar the script uses. So, do you think there might be perceptual processing reasons why the things we learn from writing are important.</p>
      <p>Do your students find these reasons in Dehaene? (I assume you mean his 2009 book <em>Reading in the Brain<em>.) </em></em></p>
      <p>What do your students take away from the writings of Stanislas Dehaene? Is what they take away an obstacle to what you try to inculcate?</p>
      <p>Farida, my description above of things we learn from writing might address some of your questions about creating something new. On the question of violations of the scriptorial norms, I agree with Bill.</p>
