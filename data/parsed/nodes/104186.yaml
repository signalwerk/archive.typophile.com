      <p>Frank: "nor is it likely that legibility researches took place prior to the cutting of punches in the early days of typography"</p>
      <p>They don't have to have done scientific research; they just would have had to use their eyes sensitively to see what works for good readability and aesthetics. Scientific research is intended to explain why what works, works. But all people who do a lot of trial and error on writing (scribes) or type design learn by their eyes what works and not. </p>
      <p>What I am saying is that these larger issues of how the mind and brain function are a bigger part of the story than the specific conventions of a script. And these larger, common features of perception and word recognition allow for variation from pen rules. So departure from pen rules—or, say, brush rules for Chinese—is much more possible than if the whole story were rules imposed by a particular writing tool. </p>
      <p>I don't think 'writing tool dictatorship' is a correct way to understand either readability or aesthetics in type.</p>
