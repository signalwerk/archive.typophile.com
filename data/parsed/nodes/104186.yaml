    <p>Hi, everyone</p>
    <p>I am a research student and right now I am designing typefaces as a part of my thesis.<br>
    Since the debate between the group that support and against using type forms based on pen strokes is still continuing in the present as Sofie Beier wrote in the book, Reading Letters, that:</p>
    <p>"The discussion of whether typefaces exist on their own merit – separate from any possible influence of the pen – or whether the pen is a leading force in the shaping of all typographical styles continues to be a matter for discussion among designers and scholars to this day"</p>
    <p>I would like to ask about everybody's opinion on the process in developing calligraphy or original script into digital typeface. </p>
    <p>Would it be necessary to preserve the original strokes of the letters or would it be possible to eliminate the influence of the pen stroke out of the typeface design in order to create something new? </p>
    <p>Thank you all for any comment!! Have a nice day!</p>
