      <p>William: <em>While habituation to a particular script does have an important impact, there is a much larger mechanism of pattern recognition that the eye and brain use, and this has still bigger impact on how we process and see words and letters.</em></p>
      <p>The presence of physical conditions for pattern recognition seems to me a prerequisite for pattern recognition. It’s interesting that in the past one could read about these things in publications like <em>Visible Language</em> and now you ﬁnd references to how the brain works on <em>Typophile</em>. Even my students talk about researchers like Stanislas Dehaene.</p>
      <p>If we <em>focus</em> for a moment on the Latin script, there is no proof in any form at all, nor is it likely that legibility researches took place prior to the cutting of punches in the early days of typography. Jenson, Griffo, nor any of their Renaissance prototypers seem to have investigated the physiological structure of the human visual system in relation to type. The fact that light falling on the retina excites photoreceptors was most probably completely unknown to the early punchcutters. </p>
      <p>Later in the Renaissance more became known about the real functioning of the eye. Leonardo Da Vinci researched the subject and his idea that vision ‘<em>is a result of the eye receiving rays of light</em>’ was different from the generally accepted idea ‘<em>that humans had vision because of tiny particles projected from the eye</em>’[1]. In 1604 Johannes Kepler ‘<em>demonstrated the physics behind the optical workings of the eye as an aside of his astronomical work […] </em>Supplements to Witelo, On the Optical part of Astronomy<em> […]. For the ﬁrst time, oculists had begun to accept the retina – and not the lens as it had been assumed since antiquity – as the organ of vision</em>’[2]. </p>
      <p>But even after these researches, there is no evidence that the outcomes were taken into account by the punchcutters. Nor that they had any knowledge of ‘the larger mechanism of pattern recognition’.</p>
      <p>1. Barbara O’Connor, <em>Leonardo da Vinci</em> (Minneapolis, 2003) p.51.<br>
      2. Saad Shaikh, <em>Eyes On Ice &amp; No Blind Mice</em> (Bloomington / Central Milton Keynes, 2007) p.254.</p>
    html_clean: |-
      <p>William: <em>While habituation to a particular script does have an important impact, there is a much larger mechanism of pattern recognition that the eye and brain use, and this has still bigger impact on how we process and see words and letters.</em></p>
      <p>The presence of physical conditions for pattern recognition seems to me a prerequisite for pattern recognition. It’s interesting that in the past one could read about these things in publications like <em>Visible Language</em> and now you ﬁnd references to how the brain works on <em>Typophile</em>. Even my students talk about researchers like Stanislas Dehaene.</p>
      <p>If we <em>focus</em> for a moment on the Latin script, there is no proof in any form at all, nor is it likely that legibility researches took place prior to the cutting of punches in the early days of typography. Jenson, Griffo, nor any of their Renaissance prototypers seem to have investigated the physiological structure of the human visual system in relation to type. The fact that light falling on the retina excites photoreceptors was most probably completely unknown to the early punchcutters. </p>
      <p>Later in the Renaissance more became known about the real functioning of the eye. Leonardo Da Vinci researched the subject and his idea that vision ‘<em>is a result of the eye receiving rays of light</em>’ was different from the generally accepted idea ‘<em>that humans had vision because of tiny particles projected from the eye</em>’[1]. In 1604 Johannes Kepler ‘<em>demonstrated the physics behind the optical workings of the eye as an aside of his astronomical work […] </em>Supplements to Witelo, On the Optical part of Astronomy<em> […]. For the ﬁrst time, oculists had begun to accept the retina – and not the lens as it had been assumed since antiquity – as the organ of vision</em>’[2]. </p>
      <p>But even after these researches, there is no evidence that the outcomes were taken into account by the punchcutters. Nor that they had any knowledge of ‘the larger mechanism of pattern recognition’.</p>
      <p>1. Barbara O’Connor, <em>Leonardo da Vinci</em> (Minneapolis, 2003) p.51.<br>
      2. Saad Shaikh, <em>Eyes On Ice &amp; No Blind Mice</em> (Bloomington / Central Milton Keynes, 2007) p.254.</p>
