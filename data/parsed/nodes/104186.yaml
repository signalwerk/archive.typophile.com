      <p>Bob: <em>[…] design really has no rules as such - if it works it works.</em></p>
      <p>Basically you are supplying a license for ignorance here. If type designers don’t know the fundamentals of their profession, who else should know? And if there are no rules, how does one judge the outcome? I would for instance certainly distrust a plumber who would state ‘if it works, it works’.</p>
      <p>Of course, you can get away with this, like many punch cutters in the past, who by ‘tracing’ their predecessor’s letterforms automatically copied Jenson’s underlying structures and patterns. It is therefore not very difﬁcult to imagine that letterforms could evolve into pictures of things this way. But Gill was absolutely right when he stated in his <em>Autobiography</em> (1940): ‘<em>Letters are things, not pictures of things</em>’.</p>
      <p>FEB</p>
