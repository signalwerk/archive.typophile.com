      <p>Thanks Frank, I will work my way through your links.</p>
      <p>The point I was tring to make though, is that: if the rules of the model (I'm assuming you mean: script) as they apply to the shape of the stroke and how strokes combine, as well as the spacing, "harmony," and "rhythm" protocols intrinsic to the model, aren't implemented consistently across the script or in it’s use in type-setting contexts, there are perceptual processing consequences. These I would argue are in the realm of word-level gestalt-busting effects that disturb the passage of the visual information through the visual cortex. They disturb the passage of the visual information through the visual cortex, because they disturb the cohesive equilibrium of the shapes and shape-primitives in the whole gestalt.</p>
