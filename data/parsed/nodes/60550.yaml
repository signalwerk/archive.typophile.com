    <p>Hi--</p>
    <p>I am in the beginning phases of putting together an exhibition of Unbuilt Architecture in Oregon, or just Portland.  I was a stylish simple, like masthead, to put on the top of my grant proposals, informational materials and eventually to serve as the logo of the exhibit.  I was thinking of setting the two works off in different faces for instance something like Tekton for the word unbuilt, since it suggests drawings and then something either classic or dynamic for "Oregon" or Portland.</p>
    <p>The exhibit will be geared toward the general public but it is located in a trendy, very modern part of town.  I am debating whether or not I should try and reflect this in the type that makes up the title or if I should instead focus on Portland and Oregon's pioneer heritage or identity as a nature loving "green" place.</p>
    <p>I would like to use this in screen displayed materials (for emails) and in the tangible world for the exhibit materials etc.  Also if you want to give me a bonus you could suggest a good font for the information placards next to the drawing and models in the exhibit.  i was thinking the title of the unbuilt work could be in some kind of snazzy display font, or maybe something like Tekton (to suggest architecture) and then who knows for the text information beneath it.</p>
    <p>I know very little about design and though I would maybe ask some experts like y'all to help.  Anything is appreciated.</p>
