    html: <p>It is good that you are thinking of how things look, aesthetics. But for branding/identity work, what is really important is what it communicates. A basic brief would describe the key messages the brand should communicate, and who the audience is that the brand is targeting. These are fairly objective and concrete ideas compared to the aesthetic opinions of a bunch of online type designers. There really is no design studio that does general graphic design. They all have strengths and weaknesses, particular types of clients they attract and work well with, projects that really fit their skills, etc. To attract clients your brand should communicate the strengths and not be general. Your potential clients will find someone who is great at what they are looking for and choose them over a general solution. I hope that is helpful to you!</p>
