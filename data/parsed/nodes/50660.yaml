      <p>Sketching and drawing are good! But type design isn't a linear process that goes: step one – draw on paper, step two – draw on screen, step three – space, step four – finish.</p>
      <p>Rather, you can sketch on paper, make a digital test of your ideas, test in text, make print outs, draw on the print outs, take some letters in another direction via sketching on paper, correct outlines and spacing, etc. Repeat for a long time, and then you'll get there ;-)</p>
      <p>A lot of the questions that are being asked here are going to be answered best via trial and error. The best way to test a text face is in text.</p>
