      <p>Like in your "N", the "outside" serifs (which can also be seen as double-sided serifs) in slab designs are in a way vestigial: it took time for people to get over the traditional serif scheme. As such, fonts with outside serifs are more old-fashioned or quaint - at least I think so.</p>
      <p>In terms of readability, that's an interesting question - I haven't thought about it. I would say that the impact is small (which is not to say it should be totally ignored - this is after all Detail Land) and it comes down to the balance of distraction (outsides are more distracting) versus differentiation (outsides are more distinctive).</p>
      <p>One thing that might come into play here is what I mentioned in your "N" thread too: scanning versus reading smoothly. For the former, quaint caps are better, while for the latter you want the caps to blend in more.</p>
      <p>&gt; I am also somewhat wary of violating all kinds of unwritten laws</p>
      <p>Few of those can be seen as Laws - most of them are conventions.<br>
      So in this minefield, the mines move around.  :-&gt;</p>
      <p>hhp</p>
