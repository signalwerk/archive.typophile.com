      <p>Right Dan, that's exactly my point.<br>
      The feedback loop that involves Quark/InDesign is what puts digital type design a quantum level beyond the 20th century process. Although interestingly, I suspect it's more akin to earlier methods involving punchcutting.</p>
      <p>Scale changes everything, and -- especially for a beginner -- you can't know how a design will work until you read it.<br>
      And then you have to ask yourself, on observing a bit of spottiness, is that caused by the character shape, the stroke weights, the joint treatment, the font weight, or the sidebearings? Does it effect only certain character combinations? These polyvariant relationships are fundamental, and must be held in the head as what constitutes the general essence of the face, against which all detail decisions are made. They are only apparent in text. Now of course, you can examine other faces and deduce what works in them, and those with experience can tell you what principles they use (the conventions), but then you don't fully apprehend technique with your own visual intelligence, or develop the quality of personal style, unless you discover it yourself through trial and error.</p>
