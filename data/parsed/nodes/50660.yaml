      <p>Wow. Leave the computer for a couple hours and this is what happens :)</p>
      <p><em>I don’t mean to criticize your working pattern</em></p>
      <p>No worries, Dan! I had a rather bad day at work so forgive me if I came across grumpy or something. It's highly interesting to read about this kind of "workflow" input (plus thanks for your "voice" in this, as I really didn't quite understand what Nick was saying).</p>
      <p><em>Frustration is your friend! Embrace it, joust with it, toy with it. The battles you have within yourself to learn to “see” so that you can trust your eyes are the most rewarding teachers you will ever have!</em></p>
      <p>:-) Thanks, Chris. I'm already feeling progress in questioning vs. trusting my eyes. Even my hand, actually; I haven't been doing any sketching for years prior to this and my stroke had gotten very rusty. Now very slowly, the feeling for curves is starting to creep back in, which is great.</p>
      <p><em>Type design is a combination of both sides of your brain—intellect and intuition interacting sometimes as one and sometimes in opposition. Don’t rush into “the rules” before you take the opportunity to look at the design problem unarmed and without prejudice.</em></p>
      <p>Spot on :-). I know I tend to be a bit on the brainy side of things. I mean <em>that</em> side. On the other hand, this combination has always been one of the major features of type design I've supposed to be quite enticing. So I'm definitely trying to be open. :)</p>
      <p><em>Scale changes everything, and — especially for a beginner — you can’t know how a design will work until you read it.</em></p>
      <p>:-) A couple of weeks ago in the course, one of the students rushed into the room, very excited, and exclaimed that everybody should run out and scale their stuff down on the photocopying machine; indeed it was quite illuminating just how different the letters looked at a small size, and how totally different features came into focus, and different problems and questions could be observed. So, yes, I am beginning to see what scale does, and I'm sure that actually seeing the letters in combination and in a text would reveal a lot more. On the other hand, I now have something like ten letters, at least five of which I'm very sure don't work at all yet, so I don't see this as a moment where I'd need to see it in text just yet – there'd probably be too many distracting errors in it anyway for me to judge the shapes themselves (what you said, Nick).<br>
      Besides, I'm not exactly a FontLab pro yet, so the quick back-and-forth between analog &amp; digital won't exactly be quick for me ;-).</p>
      <p>On the other hand, in the process of trying to decide just what this face is going to be, it would certainly be illuminating to just try and set it as text, &amp; see if I can judge if that <em>could</em> work. I just think that needs a tad more time.<br>
      <em><br>
      &gt;She hasn’t decided that it’s a text face.<br>
      This is part of her graduate coursework in Zürich. I’m assuming that they don’t have the option to do display faces there (?)</em></p>
      <p>Actually, there is no restriction on what kinds of faces we do. There are folks doing geometric / conceptual stuff, modernized blackletters, somewhat modernized Jugendstil stuff … in short, I see lots of designs there that look even less likely than mine to become text faces.</p>
      <p>The only thing they told us was that at the end of the course, they expect us to present a font (not even necessarily multiple weights) with all letters, numbers, and punctuation (I assume they also want Latin-1 Extended type special characters, although I can't remember they explicitly mentioned that). We don't even have to hand in the font files themselves, but just do a poster presentation &amp; hand in a documentation. </p>
      <p>Bear in mind this is a part time course and we're all working 40 to about 120 percent on the side, so the requirements must be quite a bit lower than in Reading or Den Haag.</p>
