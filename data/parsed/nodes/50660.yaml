      <p>An intermediate approach to evaluating initial design directions -- intermediate between drawings and beziers, with respect to the valid advice about seeing letters in context and at different sizes -- is to simply scan your sketches, duplicate letters and compose multiple test words in Photoshop, and make copies reduced to various sizes.</p>
      <p>This is akin to "old-skool" techniques used in the 20th century (by such as Gill and Dwiggins, for instance), but much easier now with scanners and PShop. It bypasses the FontLab learning curve for now, if that is an issue. You can easily sketch out alternative approaches to your s-serif question and put the alternates side-by-side in the context of your other characters in real words. </p>
      <p>I used this approach for a while before I became completely comfortable in the digital realm. Evaluating ideas in this way led me to ditch several early designs that lacked real promise ;-)</p>
      <p>-- K.</p>
