      <p><em>"If you are starting out, why rush to work in established grooves?"</em></p>
      <p>Well, where do I draw the line? (Sorry, no bad pun intended.) Conventions are not just boring, they are also what people out there are used to, &amp; what they can read. I am not particularly interested in making wacky display fonts that nobody can read, or that do not seem to make sense; so I do have an interest in first getting an idea of what the different ways to go are, &amp; then make up my mind which one I choose, and why, and how I modify it for my needs.<br>
      Come to think of it, I am, in general, not somebody to "just do" &amp; think later. My colleague is a bit like that. We're very different. I need to thoroughly wrap my brain around the problem at hand &amp; possible solutions first before I can get visual.<br>
      But I am actually drawing "s"s right now. :)</p>
