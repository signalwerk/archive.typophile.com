      <p>Frustration is your friend! Embrace it, joust with it, toy with it. The battles you have within yourself to learn to "see" so that you can trust your eyes are the most rewarding teachers you will ever have! That is not to say that you should approach your design like a Jackson Pollack painting. Type design is a combination of both sides of your brain--intellect  and intuition interacting sometimes as one and sometimes in opposition. Don't rush into "the rules" before you take the opportunity to look at the design problem unarmed and without prejudice. There is plenty of time to be confined in the box of tradition and to be held by the welcoming arms of historic authority. Crawl, then take your baby steps and cruise along holding on as best you can. This period will teach you more than any pile of rules. After you muddle about a bit, learning rules  of the past will have greater meaning without thwarting you. You only have one chance to be naive, don't throw it away. You will have a lifetime afterwards to learn and debate the value of rules.</p>
      <p>ChrisL</p>
