      <p><em>Yes. Posting to a forum means that you expect an answer.  :)</em></p>
      <p>Well regarding the post with the sketches – I expected there'd be more of a perceived difference between a <em>forum post</em> and a <em>blog entry</em> here. I wrote that the way I'd write it on my other blog (except that one is in German), and wouldn't have if it felt like "posting to a forum". So if forum and blog posts, respectively, are pretty much regarded as interchangeable I'll have to change my posting form.</p>
      <p>If anything, I was really just quite excited about the new direction this project is taking, happy about having a few crooked letters on my sheet of paper, &amp; wanting to get back and show I'm actually doing something apart from asking about N joins and S serifs and such. ;-)</p>
      <p><em>The problem is that it is not clear how exact your sketches right in the first post here were supposed to be, especially “Ernestine” and “Ernostige”. If you had tried digitizing it, i.e. translating from one medium into another, you would have been forced to be more precise about some details.</em></p>
      <p>Like I said in the blog entry, they're raw sketches. They're actually the first sketches I have with serifs. The need to get more clear on the details is obvious to me, but at this point in time, I'd still prefer to work on it on paper; a process in which I'm still very much at the beginning.<br>
      I find it's easier for me to keep a feeling for the overall shape on paper, whereas on the computer, I tend to fizzle around with details &amp; lose touch with the overall scope. Also, I feel working on paper actually forces me to think more &amp; work more carefully.</p>
      <p><em>Just one example: In the “n”, the shoulder touches the left stem at a relatively high point, and the top extremum of the shoulder is too much to the left.</em></p>
      <p>Thanks for pointing that out; I did think the join was too high, which is actually a feature of the sansserif I left in there for now to see how it works. I then kind of felt it didn't, and making the join lower was on my list for things to try next. I'm still very much at the beginning of the process, and I'm quite happy when I actually see one of the things that don't work. (Also, figuring that it wouldn't be possible to just "stick serifs on the sans" is exactly what makes this interesting to me from a type design studying perspective.)</p>
      <p>Oh, and about the S: I actually tried those two variants. I think I even made (or at least, I wanted to make) the curves even flatter than they were in the sans, to make the serifs fit better. I tried the other variant too, with the outward serifs, but didn't like the curvy shapes it demanded.</p>
