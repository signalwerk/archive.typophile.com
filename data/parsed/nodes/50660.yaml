      <p><cite>I thought of it more in terms of a blog entry showing the progress of the project [...] Maybe I should do it on my own blog instead</cite></p>
      <p>Yes. Posting to a forum means that you expect an answer.&nbsp;&nbsp;:)</p>
      <p>Regarding Nick's and Dan's remarks about analog vs digital, the medium per se is not the issue. The problem is that it is not clear how exact your sketches right in the first post <a href="http://typophile.com/node/50670" target="_blank" rel="nofollow">here</a> were supposed to be, especially "Ernestine" and "Ernostige". If you had tried digitizing it, i.e. translating from one medium into another, you would have been forced to be more precise about some details. And as said, you could have printed and looked at at different sizes. So you might have found out by yourself that something went wrong, and what went wrong.<br>
      Just one example: In the "n", the shoulder touches the left stem at a relatively high point, and the top extremum of the shoulder is too much to the left.* It looks like you tried to treat the shoulder as symmetric as possible. But the result is that for one, the top left serif and the high touch point create a pretty dark spot, moreover, the entire letter seems to lean toward the left side, counter to reading direction. To "look right" however, this would require some adjustment. [* This peculiarity is present in the sanserif too, yet there are no serifs to emphasize it.]<br>
      Now the situation is not that different with the "s". The top and bottom curves are pretty flat. There's simply no space left for outward serifs. If you add them, you get the same strange black spots as in the "n". Just make another sketch and try. To be able to add outward serifs, you would need to turn the curve ends inwards, make them thinner, so that there is some more space which serifs could fill. Actually, the two top samples you present in your first post above show pretty well what is going on, and what needs to be done to make outward serifs possible. The issue is not one of geometrical, constructed, neoclassical, dynamic, etc but simply: How did the designer dealt with details.<br>
      So even in your few sketches it is pretty obvious that -- which seems to be your experiment (combining both this thread and your blog entry) -- you cannot simply add some serifs here and there but need to alter lettershapes too to accomodate for the serifs. Not only with "s" but also with more "trivial" letters like the "n".</p>
