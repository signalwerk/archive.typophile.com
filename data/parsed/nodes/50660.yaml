    html: <p>I think that what Nick means is that you need to work a bit quicker, more digitally. Your sketches look nice, but you are showing us your output too early. Quickly make vector outlines of a few of your letters in FontLab, generate the incomplete font, and start setting pages of dummy text in InDesign (or whatever text-setting applications you prefer). InDesign is just as important a tool to text typeface design as FontLab. Once you see your letters in text, your eye will tell you what is right and what is not. If you still have questions—and you will—post PDFs of these test sheets here.</p>
