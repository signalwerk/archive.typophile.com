      <p>What matters to me, as a moderator, is that anyone can point back to Typophile as the location at which they found the information to begin with .... that is what matters. I might be pretty hardcore about this stuff, but there is just no other way to be. If anyone here finds something they deem questionable email me. I have contact with many foundries and can get the information to the right people. </p>
      <p>But please don't post it here. Typophile has managed to stay pretty clean and if I have anything to say about it it will remain clean.</p>
