      <p><em>...there is no need to share pirating tips on typophile, dennis.</em></p>
      <p>With all respect to you Paul---aww give Dennis a break. Chiding him for his contribution is like making excuses for not putting your foot down when it counts. If typophile's moderators have any real guts at dealing with piracy, threads like this that link to pirated font sources would be simply be deleted without discussion.</p>
