    <p>Back in the early 90’s there was a free display face called Margaline. I used it extensive in high school then the disk I had of it became corrupt. Bummer! </p>
    <p>It had a puffy sans inside of a tear drop. (exciting I know)</p>
    <p>Do you know if it still exists somewhere.</p>
    <p>There was another face that probably came from a 1000 fonts for $5.00 collection. Rattascat Swash- or something like that.</p>
    <p>I’m feeling nostalgic for my formative years working with type.</p>
    <p>Mikey :-)</p>
