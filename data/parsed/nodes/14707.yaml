      <p>You’re right George. I was pretty chuffed when I first saw Chevin used for a Royal Mail advert. I was stunned when I realised the entire family had been adopted as the RM corporate typeface, and is used for absolutely everything.</p>
      <p>James, I know what you mean about Post Office queues - don’t you just love slowly snaking your way to the counter. Position number 5 please!</p>
      <p>I’m glad you like Chevin. It’s available in the UK from Fontworks. - <a href="http://www.type.co.uk" title="www.type.co.uk">www.type.co.uk</a></p>
      <p>Nick Cooke</p>
