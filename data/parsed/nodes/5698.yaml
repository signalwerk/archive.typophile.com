  html: <p>I don't know if this is going to be a big yawn for you, but we did have a problem years ago in the days of poor letterpress on newsprint. I picked up this technique by observing what was being done in CH and adapted it to some clunky Polaroid cameras. The trick is, it seems to me, to try to develop tension between the blacks and whites. Anyway, there's more at the blog -- <br> <br><a href="http://giam.typepad.com/the_branding_of_polaroid_/" target="_blank">http://giam.typepad.com/the_branding_of_polaroid_/</a> <br> <br><img src="http://www.typophile.com/forums/messages/4100/41064.jpg" alt="ad"><img src="http://www.typophile.com/forums/messages/4100/41065.jpg" alt="trade show"></p>
  html_clean: <p>I don't know if this is going to be a big yawn for you, but we did have a problem years ago in the days of poor letterpress on newsprint. I picked up this technique by observing what was being done in CH and adapted it to some clunky Polaroid cameras. The trick is, it seems to me, to try to develop tension between the blacks and whites. Anyway, there's more at the blog -- <br> <br><a href="http://giam.typepad.com/the_branding_of_polaroid_/" target="_blank" class="link-external">http://giam.typepad.com/the_branding_of_polaroid_/</a> <br> <br><img src="http://www.typophile.com/forums/messages/4100/41064.jpg" alt="ad"><img src="http://www.typophile.com/forums/messages/4100/41065.jpg" alt="trade show"></p>
