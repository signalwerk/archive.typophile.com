  html: |-
    <p>I am proud to finally announce the release of Otari. It can be purchased at <a href="http://www.tktype.com" rel="nofollow">TK Type</a> or <a href="http://new.myfonts.com/fonts/tk-type/otari/" rel="nofollow">myfonts</a>. A version of the bold weight, with a limited character set, is also available for free on either site.</p>
    <p>Otari is vibrant and contemporary, but serious and built to last.</p>
    <p>Its character shines in display type, but doesn’t interfere at text sizes. Otari aims to capture the essence of Wellington, New Zealand in a single typeface. The contrast of a colorful art scene and the conservative colonial British aesthetic, which is still evident in the capital city, laid the groundwork for this design.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/otari1_5110.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/otari3_4765.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/otari2_6380.png"></div><p></p>
    <p><a href="http://www.tktype.com" rel="nofollow">TK Type</a><br>
    <a href="http://new.myfonts.com/fonts/tk-type/otari/" rel="nofollow">myfonts</a></p>
