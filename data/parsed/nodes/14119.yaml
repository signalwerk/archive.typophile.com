    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : John Baskerville</strong></p>
    <p>John Baskerville (1706-1775)</p>
    <p>John Baskerville was born in Worcestershire, <a href="/wiki/England" class="freelinking" rel="nofollow">England</a> in <a href="/wiki/1706" class="freelinking" rel="nofollow">1706</a>. As a young man he was introduced to the art of letters while working as a master writing teacher and stone engraver. He later began a career in manufacturing, making japanned ware (a type of lacquered metalware popular at the time). He soon amassed great wealth and purchased an estate near Birmingham.</p>
    <p>Around <a href="/wiki/1751" class="freelinking" rel="nofollow">1751</a>, Baskerville began experimenting with <a href="/wiki/printing" class="freelinking" rel="nofollow">printing</a>. Baskerville was a perfectionist, and as such he demanded complete control over the entire printing process. He designed and created <a href="/wiki/type" class="freelinking" rel="nofollow">type</a> and layouts; improved the presses and inks; and developed new paper making techniques enabling the creation of smooth bright papers. </p>
    <p>Baskerville's type was influenced by the works of Italian renaissance printers, like his English contemporary, <a href="/wiki/William%20Caslon" class="freelinking" rel="nofollow">William Caslon</a>. But Baskerville refined their forms--creating type with more extreme contrast of thick and thin strokes. This gave his text great lightness and color. His letterforms were also wider and his <a href="/wiki/italic" class="freelinking" rel="nofollow">italics</a> showed his calligraphic mastery. Baskerville's page layouts were spartan (especially compared to the ornate designs of French and Italian renaissance printers). Generally, they were completely typographic, allowing his letterforms to stand on their own. His designs stand as a pinnacle of <a href="/wiki/transitional" class="freelinking" rel="nofollow">transitional</a> typography and as a prelude to the modern <a href="/wiki/Didone" class="freelinking" rel="nofollow">Didone</a> design of later years.</p>
    <p>Baskerville's work was widely dismissed during his time by British contemporaries as the work of an <em>amateur</em>. However, his influence on type and printing spread to Italy and France where <a href="/wiki/Giovanni%20Battista%20Bodoni" class="freelinking" rel="nofollow">Giovanni Battista Bodoni</a> and <a href="/wiki/the%20Didots" class="freelinking" rel="nofollow">the Didots</a> furthered his ideas.</p>
    <p>Baskerville's types have been the source of many revivals, some of which include:<br>
    <a href="http://www.stormtype.com/jbasker.html" rel="nofollow">John Baskerville</a> by <a href="/wiki/Storm%20Type%20Foundry" class="freelinking" rel="nofollow">Storm Type Foundry</a><br>
    <a href="/wiki/Mrs%20Eaves" class="freelinking" rel="nofollow">Mrs Eaves</a> by <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a></p>
    <p>Other designs inspired by Baskerville's work:<br>
    <a href="http://www.stormtype.com/typefaces-fonts-shop/families-23-john-sans" rel="nofollow">John Sans</a> also by Storm</p>
