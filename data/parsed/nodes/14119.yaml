    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: John&nbsp;Baskerville</strong></p>
    <p>John Baskerville&nbsp;(1706-1775)</p>
    <p>John Baskerville was born in Worcestershire, <a href="/node/add/wiki?edit%5Btitle%5D=England" title="Create node &quot;England&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">England</a> in <a href="/node/add/wiki?edit%5Btitle%5D=1706" title="Create node &quot;1706&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1706</a>. As a young man he was introduced to the art of letters while working as a master writing teacher and stone engraver. He later began a career in manufacturing, making japanned ware (a type of lacquered metalware popular at the time). He soon amassed great wealth and purchased an estate near&nbsp;Birmingham.</p>
    <p>Around <a href="/node/add/wiki?edit%5Btitle%5D=1751" title="Create node &quot;1751&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1751</a>, Baskerville began experimenting with <a href="/node/add/wiki?edit%5Btitle%5D=printing" title="Create node &quot;printing&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">printing</a>. Baskerville was a perfectionist, and as such he demanded complete control over the entire printing process. He designed and created <a href="/node/add/wiki?edit%5Btitle%5D=type" title="Create node &quot;type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">type</a> and layouts; improved the presses and inks; and developed new paper making techniques enabling the creation of smooth bright&nbsp;papers. </p>
    <p>Baskerville’s type was influenced by the works of Italian renaissance printers, like his English contemporary, <a href="/node/add/wiki?edit%5Btitle%5D=William%20Caslon" title="Create node &quot;William Caslon&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">William Caslon</a>. But Baskerville refined their forms–creating type with more extreme contrast of thick and thin strokes. This gave his text great lightness and color. His letterforms were also wider and his <a href="/node/12463" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">italics</a> showed his calligraphic mastery. Baskerville’s page layouts were spartan (especially compared to the ornate designs of French and Italian renaissance printers). Generally, they were completely typographic, allowing his letterforms to stand on their own. His designs stand as a pinnacle of <a href="/node/add/wiki?edit%5Btitle%5D=transitional" title="Create node &quot;transitional&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">transitional</a> typography and as a prelude to the modern <a href="/node/30993" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Didone</a> design of later&nbsp;years.</p>
    <p>Baskerville’s work was widely dismissed during his time by British contemporaries as the work of an <em>amateur</em>. However, his influence on type and printing spread to Italy and France where <a href="/node/73181" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Giovanni Battista Bodoni</a> and <a href="/node/add/wiki?edit%5Btitle%5D=the%20Didots" title="Create node &quot;the Didots&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">the Didots</a> furthered his&nbsp;ideas.</p>
    <p>Baskerville’s types have been the source of many revivals, some of which include:<br><a href="http://www.stormtype.com/jbasker.html">John Baskerville</a> by <a href="/node/12193" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Storm Type Foundry</a><br><a href="/node/12210" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mrs Eaves</a> by <a href="/node/12208" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Emigre</a></p>
    <p>Other designs inspired by Baskerville’s work:<br><a href="http://www.stormtype.com/typefaces-fonts-shop/families-23-john-sans">John Sans</a> also by&nbsp;Storm</p>
    <p><strong>Books <span class="amp">&amp;</span> Materials&nbsp;about:</strong></p>
    <p>(John Baskerville). Letters of the famous 18th century printer, John Baskerville of Birmingham, together with a bibliography of works printed by him at Birmingham; collected, compiled and printed under the direction of Leonard Jay, Birmingham School of Printing, Birmingham,&nbsp;1932.</p>
    <p>(John Baskerville). Some correspondence concerning the making of printing type / by John Baskerville of Birmingham, Zurich&nbsp;: The Hand Press,&nbsp;1991.</p>
    <p>Bennett, William. John Baskerville, City of Birmingham School of Printing, Birmingham,&nbsp;1937.</p>
    <p>Dreyfus, John. The Survival of Baskerville’s Punches. Cambridge, Privately printed by the University Printer for Friends in Printing and Publishing 1949 Limited edition of 250 copies. Includes folding specimen sheet of Baskerville types in rear&nbsp;sleeve.</p>
    <p>Gaskell, Philip. John Baskerville: A Bibliography, Cambridge University Press.&nbsp;1959</p>
    <p>Harvey, Edward Hooker. Notes on the life of John Baskerville, an eighteenth century printer, Cleveland, 190.  “Read at the Rowfant club, February twenty-four, <span class="caps">MDCCCXCIX</span>.</p>
    <p>Jennett, Sean. Pioneers in Printing: Johann Gutenberg, William Caxton, William Caslon, John Baskerfille, Alois Senefelder, Frederick Koenig, Ottmar Merganthaler <span class="amp">&amp;</span> Tolbert Lanston. Routledge <span class="amp">&amp;</span> Kegan Paul,&nbsp;1958.</p>
    <p>Morgan Paul. John Baskerville. Printer, Birmingham, Albright <span class="amp">&amp;</span> Wilson Ltd.,&nbsp;1955.</p>
    <p>Pardoe, <span class="caps">F. E.</span> John Baskerville of Birmingham Letter-Founder <span class="amp">&amp;</span> Printer. Frederick Muller, London,&nbsp;1975.</p>
    <p>Pardoe, <span class="caps">F. E.</span> John Baskerville, 1705-1775. An address to the Wynkyn de Worde Society … to mark the 200th anniversary of Baskerville’s&nbsp;death.</p>
    <p>Strauss, Ralph and Dent, Robert K. John Baskerville, A Memoir. Cambridge, Printed at the University Press for Chatto <span class="amp">&amp;</span> Windus,&nbsp;1907.</p>
    <p>Walker, Benjamin. The Resting Places of the Remains of John Baskerville. The Thrice-Buried Printer, Birmingham, City of Birmingham School of Printing&nbsp;1944.</p>
