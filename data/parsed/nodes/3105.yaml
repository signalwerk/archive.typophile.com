    html: <p>Ah, the good old days, the depilatory effects of waxing machines, minor operations carried out with scalpels, making scalpel "blades" out of tracing paper and tossing them to colleagues, studio juniors being sent for a long weight while the experienced types carried out their black arts. You never forget the first time a scalpel slid off the drawing board and landed in your thigh. But the old timers would tell you how easy you had it compared to the molten metal splashes from Ludlow machines. So much physical pain was replaced by crashing computers and waiting half an hour for a colour laser print only to discover that it had pixellated the type. Still like to get the scalpel and the rotring pen out though.</p>
