    html: <p>One of my first gigs was helping out on a liberal weekly paper back in Anchorage in the 70s, at which my mother was a contributing editor. I mostly pasted in corrections. They operated on a shoestring and we hated to send out for corrections, so I spent a lot of time cutting out words, rearranging them, and rejustifying lines by hand. I also got good at making n's out of h's, or h's out of n's and l's -- that sort of thing. <br> <br>I was an X-acto man, myself. Still am. And James, I used to stash mine behind my ear while I was working -- hey, what can I say? I was young, brash, and reckless. <br> <br>I still have my handy pica pole over on my cutting board and I still enjoy using my 00 rapidograph. <br> <br>I do miss those days, sometimes. But I don't miss spec'ing type and casting off with c/p tables and a calculator. <br> <br>-- K. <br></p>
