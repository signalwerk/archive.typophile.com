    html: <p>My first NYC job was as a bullpen production artist in a type shop. A pile of boards to work on with the studio manager giving you deadlines like "I need this by 10, the next one by 10:20, after that make sure this one is done by 11:15". Pretty much like that all day long. <br> <br>As to knives, I was a single edge razor blade man myself. After I "caught " by my Xacto knife as it rolled off my desk.  Single edge blades were the best, you could put them in your mouth while you adjusted something on the board, and you always knew where they were. <br> <br>As to Rapidograph pens. They were actually high-tech if you started out using a ruling pen.</p>
