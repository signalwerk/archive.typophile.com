    html: "<p>I spent the first ten years or so of my career in the paste up era. One of my early jobs was doing paste-up (also known in the midwest at the time as keylining) at a weekly newspaper in Minneapolis. Even later as an art director I did it quite a bit, but often worked with someone else who did most of it.  <br> <br>Even though I was pretty good at it, I don't miss it at all. I would never go back. Think about it: You were mainly trying to get things to be straight and square. With computers, it requires a deliberate, conscious decision to make things crooked. Straight and square is automatic. Overnight, T-squares and triangles became obsolete. Good riddance.</p>"
