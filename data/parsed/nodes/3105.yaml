    html: <p>I too remember using a waxer and rubber cement to affix galleys of type to boards, cutting Amberlith overlays, litho tape, and using Rapidograph pens to ink on Mylar. Stat cameras were also a big part of production, and you had to be aware of the reduction in line weight as you reduced an image. Don�t forget light tables, my hamstrings were quite limber after a few years of bending over doing paste-up. <br> <br>I do agree with Kristen, some things were far easier with the old tools, but the majority of what I do now is easier on the computer. There�s no �undo� function with most traditional media. Pencils and drafting vellum still beat the hell out of trying to noodle on a computer though. I also share Tiffany�s memory of slicing the end of my finger off with an x-acto knife, and spending quite a while in the local neurosurgery unit while they sewed it back on. One of my first jobs was at Stanford University, where we put together student newspapers. I share many similar memories with all of you.</p>
