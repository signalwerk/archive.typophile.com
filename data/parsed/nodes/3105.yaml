    html: "<p>\"Do any of you hand-production vets miss it?\" <br> <br>Oy vey! <br> <br>How many times have I torn my hair out trying to make a computer do what I could have done with a typositor and an Xacto knife in no time at all? <br> <br>How many times have I screamed in agony when trying to force a Scitex to do a trap I could have done with a sharp knife and one hand tied behind my back? <br> <br>I passed this article around to the print production team at work today and nearly everyone over 40 stopped by to regale me with their own memories -- Bestine fires, waxer jams, processor eruptions. <br> <br>That article reminded me of that movie made when The New York Times switched from hot metal to cold type: \"Etaoin Shrdlu\" by Dave W-somebody? I gotta get me a copy of that one of these days. <br> <br>Sigh. Yup. I'm old. <br> <br> <br></p>"
