    html: <p>I'm spoiled. <br> <br>I played with a miniscule amount of Rubylith in HS and we used a process camera to photograph laser prints so we could image plates...that's as close as I've gotten to old school graphics. <br> <br>Everything else has been directly on computer. <br> <br>I wouldn't be a graphic artist if it weren't for computer.  I found out when doing rubylith, I don't have the patience nor the ability to do it correctly.  Pasteups, mechanicals, all that ••••...I'd ruin them and be fired. <br> <br>Yay computer! <br> <br>/me sacrifices a virgin in the memory of ENIAC.</p>
