    html: <p>the specimen of the Weber release in <em>Encyclopædia of Type Faces</em>—which reads <strong>Das Bauhaus De</strong>—shows a slightly flatter top on the /a/, and a more pronounced trap at the bottom where the bowl meets the stem. But—again—if the stencil was hand-cut, the artist may have taken a few other liberties besides making the /D/ less boxy.</p>
