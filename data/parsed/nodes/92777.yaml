    html: |-
      <p>The bolder letters may not <strong>be</strong> Aurora Grotesk Bold, but they certainly appear to be <strong>based</strong> on it—or, at least, the 1928 C. E. Weber release of same.</p>
      <p>This sign was most likely silk-screened, so whoever cut or burned the stencil for the sign may have made a few amendments to an existing design—most notably, rounding the D a bit.</p>
