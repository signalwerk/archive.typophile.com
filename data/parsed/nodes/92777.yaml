  html: |-
    <p>I came across this sign in Zurich, Switzerland. It's not one of the official signage typefaces used in the past. The sign is for the real estate administration of the city, but is not using Helvetica, the official typeface used by the city.</p>
    <p>I'm looking for the typeface in the middle, although the title seems to be the same. It's not Aurora Grotesk, by the way.</p>
    <p><img src="http://thierryblancpain.com/files/grabup/9p/nx4vkj75s0sg4.png"></p>
    <p>Thanks!</p>
