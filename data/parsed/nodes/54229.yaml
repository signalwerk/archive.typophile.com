  html: |-
    <p>Can anyone help me find a good font for a music studio logo? The studio mainly does mixing and mastering, but mostly mastering. People give us songs that were mixed. Sometimes we just really make them sound great. Other times, we actually have to fix a number of things with them that are actually mixing problems (if we didn't mix it).</p>
    <p>I'm not really sure about the name yet either, which I suppose might direct the font that is used. This has just been a side business up until this point, but now our network is getting bigger, so actually putting some effort into a brand/logo will help us out a little ;)</p>
    <p>Any ideas or types of fonts I should be looking into?</p>
