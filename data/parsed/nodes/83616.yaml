    html: <p>Frode Frank is right. This is Futura. Period. The complete font came with four different versions of M. One was the classic splayed m, two had the central V glyph come down to the baseline (one with a point at the bottom, the other flat), and the fourth was the M shown on this post. All the other characters in the titles are standard Futura.</p>
