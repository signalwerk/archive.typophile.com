      <p>The typeface certainly has the "feel" of Gill Sans, in a lighter version, even if the shapes of some specific letters indicate otherwise.</p>
      <p>So I would look at the various sans-serif typefaces that were in use in Britain at the time.</p>
      <p>Apparently, though, what happened was that the titles were done in the U.S., and thus, Gill Sans wasn't handy... and for a typeface with a similar feel to that (or maybe to Futura) it looks like they used Intertype's Vogue. At least, <a class="freelinking external" href="http://www.abstractfonts.com/font/12605" rel="nofollow">Am Sans</a>, said to resemble Vogue, looks like these titles.</p>
