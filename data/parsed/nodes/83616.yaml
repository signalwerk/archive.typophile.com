    html: |-
      <p>The more I look at this, the more I think this is just Futura with some custom Gill Sans-like characters (A, N, M, V, W). The custom letters don't quite match Gill Sans, but the others are exact matches for Futura. There is a slight unevenness in the spacing that suggests to me that it was film setting (or maybe process lettering), and not metal type. The presence of custom letters also points to this.</p>
      <p>If this was the case, you're not likely to find an exact match (or even a close match) in an existing digital font. Although you could try combining Futura and Gill Sans, assuming you could match the size and weights.</p>
