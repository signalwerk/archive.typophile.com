      <p>In the pre-digital age (and <em>2001</em> was pre-digital by some 15 years), movie titles had to be photographed from a hard-copy original. To use type for this was needlessly difficult, as it would have required having a printer set up your titles in metal type (the largest sizes they had) and printing a one-off reproduction proof to be photographed. It was much easier to hire an artist to handletter titles, and most movie titles were handlettered until the 1960s.<br>
      By the late 1960s, Photolettering was around, and might have been used for the <em>2001</em> titles. Changing fonts in the middle of a word would have been a pain in the a55, but nevertheless possible, and it's the sort of fussy detail I could easily imagine Kubrick insisting on.</p>
    html_clean: |-
