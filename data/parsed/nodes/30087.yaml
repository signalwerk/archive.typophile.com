    <p>This is a bit off-topic, but since so many here use Adobe’s Creative Suite, I think it’s germane enough. Adobe today announced that sometime tomorrow, the Photoshop CS3 beta will be available from labs.adobe.com for owners with license keys of Photoshop CS2, the Creative Suite, and various Video and Web bundles.</p>
    <p>For a quick taste of some new features, head to <a href="http://layersmagazine.com/adobe-photoshop-cs3-public-beta-preview.html">Layers Magazine</a>, which has a free series of video tutorials from Terry White. For subscribers, NAPP has a <a href="http://www.photoshopuser.com/cs3/index.html">CS3 learning center</a>.</p>
    <p>Gleaned quickly from NAPP’s info, here are some of the biggest new features in PS CS3:</p>
    <ol>
    <li>a new user interface (now it’s more similar to that of the updated Adobe video products and Lightroom)</li>
    <li>a big evolution of Camera RAW</li>
    <li>the “quick select” tool</li>
    <li>improvements to Curves and the Print dialog</li>
    <li>a black-and-white conversion tool</li>
    <li>Auto Align and Auto Blend, which takes some of Photomerge’s tools and makes them available to single photos</li>
    <li>many changes to Adobe Bridge</li>
    <li>Smart Filters (similar to non-destructive effects in Illustrator)</li>
    <li>improvements to cloning and healing (there’s now a Clone Source palette)</li>
    </ol>
    <p>This is just a cursory list. The single feature I’m most excited about is Smart Filters, as I’m all for a completely non-destructive workflow. I may chime in sometime tomorrow with my actual impressions of it, if I’m able to download it. I am incredibly excited by this news; I wasn’t thinking that I would find out about PS CS3’s new features until Spring next year!</p>
    <p>P.S. <a href="http://indesignsecrets.com/photoshop-cs3-beta-to-be-posted.php">InDesign Secrets</a> has some info on the beta release (but no features). The interesting thing is why they say that an InDesign CS3 beta in unlikely.</p>
