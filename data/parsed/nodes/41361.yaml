    html: <p>24 pt. could be right for the fine print on a parking lot towing sign, but even then that sounds pretty small. I can't think of a lot of places where 24 pt. type would be considered "body copy", but that's one. I remember doing a large copy-heavy park rules sign, but I think that got no smaller than 64 pt.</p>
