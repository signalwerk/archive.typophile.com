      <p>24 pt on a letter-sized page, AND headlines? That doesn't leave you with much space to work with. </p>
      <p><cite>i’m looking for this part of the piece to have a certain amount of tension</cite></p>
      <p>I would think that Interstate would make the perfect body text to add tension, precisely because it is NOT designed for text. But at 24 pt, you could use Hobo for body copy and it would still be workable.</p>
