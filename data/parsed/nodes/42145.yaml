    <p>Or, how I learned to stop worrying and love insane, excessive Avant Garde ligatures.</p>
    <p>Yesterday, for Valentine's day, the boyfriend and I decided to each buy 1/2 of that video game 'Rock Band' for each other. Meaning we just bought it and split the cost. We brought it home, took all the instruments out of the huge box, put them together, and started the game.</p>
    <p>As we progressed through the first few screens, I began to notice things. </p>
    <p>First, Avant Garde in all caps with VERY liberal usage of ligatures. Everywhere. Everywhere. Ack. And they were obviously inserted fairly randomly. So slanty.</p>
    <p>Second, and not so frighteningly, someone finally found a fairly appropriate use for Fakir. I've been waiting for a chance to use it myself, so I'm glad I have a place to reliably enjoy it now.  And wow. I think they managed to use all but the very lightest weights. How thorough...</p>
    <p>But then it keeps going. They use Chalet. And not the dignified, unassuming Chalet Text. Oh no. They use one of the 1980's Display versions of it. With the really distracting miniscule t. Little t boats, everywhere, interrupting words left and right. Their one opportunity to use a normal body text face, and they failed with flying colors.</p>
    <p>Oh, but that's not all! On the quick little gamesave screens, there is Bodoni Poster. I think that's what it is anyway. Why did they choose something dignified here? Why not just go ahead and throw in a chunky Rat Fink face? That's rock and roll, right?</p>
    <p>Whew. I think that's it. It wouldn't suprise me if they snuck another in there somewhere. My point in all of this being, it's affecting my enjoyment of the game. I'm constantly thinking "Oh, I don't think there are enough typefaces on this particular screen! I wonder why they limited themselves to 3 here. They really could have fit another in," and I frequently find myself pondering how the designers could have possibly come to the conclusion that they were all necessary. Or if perhaps the game company just gave a couple highschool hipsters cart blanche to make the type look "hip" and "edgy."</p>
