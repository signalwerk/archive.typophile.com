    votes: null
    html: |-
      <p>I agree with epsilicon, the lighter weight is better. </p>
      <p>The color looks fine; the skin of a pomegranate and it's seeds (anardana) inside are both dark red, so I'm not sure what "marcdavid" is talking about? I'd also disagree with his kerning advice -- the “ate” and “meg” look fine, but the "r" could use a little air on either side...but that would depend on which weight you settle on, of course.</p>
      <p>Overall, I think it's finally working. I looked over all your drafts, and this last concept is by far the best. I'd be careful with the pillow embossing, however; you don't want to veer into the chain-restaurant/Chili's look. </p>
      <p>Nice work - obsessing pays off!</p>
