    html: |-
      <p>The color looks accurate if you are trying to match the skin, but it's the inside that's edible and more about the fruit.</p>
      <p>I prefer the weight in the previous posting. The counter in the letters, especially in the "a" are too narrow. Also there's some letter spacing problems; "ate" and "meg" areas.</p>
      <p>I really like both directions.<br>
      Looking back at your first posting, i wonder how it would look if you made the "a" and "e" large lowercase letterforms, (matching the x height of the capitals) so that it keeps the roundness within the logotype—without having to make the logotype conform to the shape.<br>
      MD</p>
