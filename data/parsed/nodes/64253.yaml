    <p>hey all.</p>
    <p>What do you think of the M?<br>
    Background: this is a logo for a bistro. Should have a clean line, more of a serious tone but still got to have some warm feeling. The food is served in an elegant way but is not too pricy.<br>
    If it’s that not clear - M should remind lightly the pomegranate flower (...)</p>
    <p>Thanks!<br>
    Elsi<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/pomegranate_01_3830.jpg"></div><p></p>
