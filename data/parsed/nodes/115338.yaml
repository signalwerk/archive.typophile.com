      <p>No luck at Veer. Either their keywords are not helpful, or they just don't have it.  </p>
      <p>If you just need something similar it seemed that <a class="freelinking external" href="http://www.myfonts.com/search/corradine+fonts/fonts/?refby=bowfin" rel="nofollow">Corradine Fonts</a> had a few with a similar 'untrained' script look. Especially Prissa, Rapidda, Helga and Corradine Handwriting.</p>
      <p>- Mike Yanega</p>
