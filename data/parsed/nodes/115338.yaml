      <p>Well, it's a font... but I haven't been able to find it. The double-s ligature suggests more than an amateur design effort. I have searched MyFonts, Dafont and AbstractFonts. The only other likely source is Veer, which I will check next.</p>
      <p>Any information about what this is from, and how old it is? If it's commercial, I suppose it could be a custom font design.</p>
      <p>- Mike Yanega</p>
