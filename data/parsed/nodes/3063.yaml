    html: <p>I have a  three-ring binder that I picked <br>up in a used bookstore. The cover says Graphis Type, although inside it's all <br>Compugraphics stuff. The date is 1985. <br> <br>Erbar was indeed digitized by Compugraphics. <br> <br>In the credits, it says <br>ERBAR (CG, Merg) <br>Belmont (AL) <br> <br>AL = Autologic Incorporated. <br>Merg=Mergentahler Linotype Corp. <br> <br><img src="http://www.typophile.com/forums/messages/83/26357.gif" alt=""> <br> <br> <br> <br>A google of Cg Erbar leads to the page below. <br> <br> <br><a href="http://www.nagtype.com/fonts.html" target="_blank">http://www.nagtype.com/fonts.html</a> <br> <br> <br>bj</p>
