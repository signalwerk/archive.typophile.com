  html: |-
    <p>"Since 1981 <a href="http://www.johnnealbooks.com/" target="_blank" rel="nofollow"><strong>John Neal, Bookseller</strong></a> has supplied calligraphers, lettering artists, illuminators, bookbinders, type and papercraft enthusiasts worldwide with books, tools, and materials. We also publish <a href="http://www.johnnealbooks.com/prod_detail_list/14" target="_blank" rel="nofollow"><em>Letter Arts Review</em></a>, a full color journal on the lettering arts, and <a href="http://www.johnnealbooks.com/prod_detail_list/63" target="_blank" rel="nofollow"><em>Bound &amp; Lettered</em></a>, a quarterly magazine on making books and making letters."</p>
    <p>(Via <a href="http://www.underconsideration.com/quipsologies/" rel="nofollow">Quipsologies</a>.)</p>
