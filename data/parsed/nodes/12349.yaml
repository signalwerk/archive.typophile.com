    <p>I'm working on refining my personal brand. In my attempt to make my identity as strong as possible, I have created a tag-line for myself. <em>Reliable creative</em>.</p>
    <p>I will use the logo with the tag-line on my website and promotional material, where as the MK logo is already in place on my business cards and letterhead, so that can not be modified at this point, although a critique on that would be great as well.</p>
    <p>Does the logo look proportional? Does it reflect <em>reliable creative</em>?</p>
    <p>Your critique is appreciated.<br>
    [logo attached]</p>
