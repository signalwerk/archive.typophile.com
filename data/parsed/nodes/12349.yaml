      <p>Reliable creative is a little small right now, in my opinion.</p>
      <p>Try to make it (a little) bigger, so the it shows you're proud of being reliable and creative.</p>
      <p>And the logo looks reliable, because it's got a bit of  seriousness to it. But I guess it could be more "creative".</p>
      <p>Also, the image you posted was small and the logo was kind of cut off, try leaving some space next time (like a white border).</p>
