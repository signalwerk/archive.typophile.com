  - id: 71729
    user: 2172
    date: 2005-05-11T09:36:00
    date_raw: 11 May 2005 — 9:36am
    votes: null
    html: |-
      <p>While I disagree with some of what Dan is saying, I do agree that specifically stating "reliable" seems odd.</p>
      <p>As for the visual aspects, the 'Reliable Creative' is a bit small, and I'm not a fan of how the 'M' makes the upper left side of the box feel a bit askew. It's not a reason to not use the logo, it's just something that bugs me. Consider aligning the top of your name with the top of the 'K', as well.</p>
      <p>It's a clean, fairly attractive logo, but it doesn't shout 'creative' to me and isn't very memorable. However, it does have a calmer feel that could be interpreted as experienced/reliable. I'm not your target audience though, and they may respond to this with more interest than I do.</p>
  - id: 71735
    user: 7190
    date: 2005-05-11T11:35:00
    date_raw: 11 May 2005 — 11:35am
    votes: null
    html: |-
      <p>First off, thanks for the feedback thus far.</p>
      <p>I've reworked the size and placement of my name and Reliable Creative. The increase in size of the latter was much needed. <a href="http://www.designbymk.com/MK_logo_with_tag.gif" rel="nofollow">Link to updated logo</a>. (Is there a better way to actually show an image on this forum?)</p>
      <p>Kyle: I had not seen the teetering until you pointed it out. That's something I will definitely keep in mind and might start playing with some modified concepts.</p>
      <p>Daniel and Chris: The idea behind Reliable Creative is that I'm an art director that consistently meets deadlines and produces professional work that will fulfill the project goals. Unfortunately not everyone in the graphic arts is reliable, but it's something I take pride in and is a personal selling point.</p>
      <p>I don't mean to say that I am the only reliable creative in the industry, because you know that's not the case. I would just like to harness that as my unique selling point. </p>
      <p>Just a note on my target audience, I'm specifically targeting creative directors, creative department heads, and similar positions in ad/graphic design agencies.</p>
