    html: |-
      <p>If you want to get all conceptual, the 'M' teetering on the stem of the 'K' suggests instability, imbalance, etc. If they were vertically stacked (with care), that would help to communicate 'reliability'.</p>
      <p>To make the overall logo more creative, you could use a script (or your handwriting/signature) for one of the letters (probably the 'm').</p>
      <p>I like the shade of red you've picked as well as the font.</p>
      <p>.[.kyle.].</p>
