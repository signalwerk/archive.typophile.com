      <p>Mike, </p>
      <p>"I don’t mean to say that I am the only reliable creative in the industry, because you know that’s not the case. I would just like to harness that as my unique selling point."</p>
      <p>I don't think anyone is accusing you of this, although calling it your 'unique selling point' does seem to say that. The concern is not how we percieve you, but rather how your intended audience percieves you as a result of this approach.</p>
      <p>I have to throw my vote in with Dan and Chris; calling yourself a "Reliable Creative" is sort of like a used car dealer calling himself a "Trustworthy Salesman"--e.g, it only means you were in some doubt to begin with. :)</p>
      <p><em>"In Bean's experience, anyone who used the phrase 'I'm not stupid' was only prodiving evidence to the contrary."</em></p>
