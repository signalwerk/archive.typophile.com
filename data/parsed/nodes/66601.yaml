    html: <p>The major type foundries in China, meaning Mainland China, include Changzhou SinoType Technology, Founder Group, and Hanyi Keyin. There are Taiwan-based type foundries that also design and market Simplified Chinese fonts, such as Arphic Technology and DynaComware. I hope this helps.</p>
