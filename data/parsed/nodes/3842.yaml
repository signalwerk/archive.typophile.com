  html: "<p>Hello fontworld, <br> <br>i'm glad to present you the 2nd Regles:Zero issue. <br> <br>you can download it at <a href=\"http://www.regleszero.com\" target=\"_top\">http://www.regleszero.com</a> <br> <br>After a long time of inactivity, let's do it again ! Featuring : P22 with a nice script type and the IndieFont Book, Carlos Segura (T-26), Leslie Cabarga (FlashFonts), Eduardo Recife (Misprintedtype), Oded Ezer, Miles Newlyn (X-and-Y) and Catherine McIntyre. The other contributions i received will be used on the next issue. Don't be affraid, it's programed for January 2003. not so long ... =) <br> <br>This files is lighter than the 1st issue, only 2,5Mb. <br> <br> <br>Take care !  <br> <br>---Stephane</p>"
