  html: |-
    <p>Hello,<br>
    I'm a french graphic designer and I'm going to London in one week. I'd like to know what are the best bookstores in town where I can find books on Typography, graphic design, essay ... even about contemporary art.</p>
    <p>If you could give me the location as well it will be perfect.</p>
    <p>Thank you in advance.</p>
