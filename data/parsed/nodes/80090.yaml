  html: |-
    <p>The <a class="freelinking external" href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a> (SOTA) is thrilled to be bringing <strong>TypeCon2011: Surge</strong> to New Orleans, Louisiana — July 5th - 10th, 2011 — and is now accepting <a class="freelinking external" href="http://www.typecon.com/archives/61" rel="nofollow">programming proposals</a> for its thirteenth annual conference.</p>
    <p>We are currently reviewing proposals for contemporary and historical presentations and panel discussions, focused hands-on workshops in both the digital and non-digital realms, and a variety of programming for the <a class="freelinking external" href="http://www.typecon.com/archives/62" rel="nofollow">Type &amp; Design Education Forum</a> and other special events.</p>
    <p>Please visit the TypeCon site for <a class="freelinking external" href="http://www.typecon.com/archives/61" rel="nofollow">program details and submission criteria</a>.</p>
    <p>The deadline for submitting proposals is <strong>March 31st, 2011</strong>.</p>
