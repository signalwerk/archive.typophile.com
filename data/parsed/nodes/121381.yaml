      <p>Alright, I made a slender /s and a serifed /z to better fit into the Garamond flavor. I agree they look more appropriate. Thanks!</p>
      <p>I've also made the /r shorter again to fit the tiny /r's of the typical Garamonds.</p>
      <p>I try to avoid comparisons as much as I can, and when I do, I look at a large number of Garamonds on MyFonts to get a general impression rather than trying to emulate a certain specific solution. I don't like the Amsterdamer Garamont at all (that droopy Jannon /a!), but Oneleigh is brilliant (especially that /g!).</p><div class="imageWrap"><img src="http://typophile.com/files/zs_3962.jpg"></div><p></p>
