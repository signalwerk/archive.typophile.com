  html: |-
    <p>Here's an idea that jumped me today when I wasn't paying attention, and now I can't shake it:</p>
    <p>An exaggerated light, contrasted, space-taking Garalde with impossibly tiny counters, long extenders and no respect for long amounts of text or small sizes. Where other fonts may be touted as workhorses, this one would be the unicorn.</p>
    <p><img src="/sites/default/files/old-images/paramont_4924.JPG"></p>
    <p>I'm toying with the name "Paramond", hinting to its Garalde genome and its delusions of grandeur.</p>
    <p>Now, has this been done to death, or should is it worth pursuing...?</p>
