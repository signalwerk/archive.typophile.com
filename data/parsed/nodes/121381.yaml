      <p>Christian, I really like them both, but I can't decide which version I like best.  </p>
      <p>I have a feeling the serif version might work better when in close proximity to letters with x-height details and vice versa.</p>
      <p>Take '<em>assistance</em>' for example.  In terms of rhythm, the serif plays well with the /a/ terminal, the top serif in the /i/, the bar of the /t/, etc.  I suspect the serifless version of the /ſ/ might not flow as well in words like this.  However, I think the serfiless version is likely to work better in words like '<em>psychosomatisch</em>'.</p>
      <p>Is it possible to see both words with alternate versions in one image for comparison?</p>
