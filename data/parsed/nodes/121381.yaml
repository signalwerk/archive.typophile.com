      <p>Well, for z you could add a top serif, as per a lot of garamonds. But even if you don't do that, the ductal flavour of the other characters gets lost a little with the rather constructed z – those serifs are unlike any other in the font, very circle-segmenty.</p>
      <p>I don't know if you do comparisons (because of possible undue influence, etc.), but perhaps take a quick look at <a class="freelinking external" href="http://www.myfonts.com/fonts/efscangraphic/garamont-amsterdam-sh/" rel="nofollow">Amsterdamer Garamont</a>, another rather extreme version of the form. Or even Nick Shinn's <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-oneleigh/" rel="nofollow">Oneleigh</a>.</p>
