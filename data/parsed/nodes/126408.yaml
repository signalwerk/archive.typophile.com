    <p>I'm looking for a very modern looking, but still easily readable serif body font.  It will be for a story about a very left brained individual who ends up going on a killing spree.  Some adjectives: cold, hard edged, inhumane, machine made,  unfriendly, robotic, angular, reductionist, geometric.</p>
    <p>Any ideas?</p>
