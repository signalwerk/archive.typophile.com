      <p>Perhaps the name is more metaphorical, in a plastic sense: making the equation between cabel as wire/cord, and a monolinear typeform of similar appearance, strength and integrity.</p>
      <p>But now take it a step further than cable-like form, and consider the typeface’s cable-like function (font as a medium of communication, suitably high-tech).</p>
      <p>It is a typeface that looks like a cable, and self-referentially refers to itself as a means of communication. The name is a pun.</p>
      <p>The references to speciﬁc communications cables may not be literal, but they set the tone.</p>
