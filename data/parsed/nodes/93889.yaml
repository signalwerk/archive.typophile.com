      <p>Wikipedia claimed that it was named after the first trans-Atlantic telephone cable. However, a quick Google shows that that cable was laid in 1956, so you are indeed far more likely to be correct than they.</p>
      <p>EDIT: And it becomes curiouser.</p>
      <p>I thought I should Google some more, in case there was a trans-Atlantic telephone cable laid in 1927 that failed after a short period, so that the 1956 one was the first one that was practical.</p>
      <p>What I found instead was that trans-Atlantic telephone <em>service</em> began in 1927, that service was based on radio links, and the first trans-Atlantic telephone <em>cable</em> indeed was laid in 1956.</p>
      <p>So the coincidence of dates seems to have led to the misconception about Kabel which you have cleared up.</p>
      <p>EDIT: I have found some further evidence, however, which suggests that Kabel <em>could</em> have been named after a trans-Atlantic telephone cable, albeit one that was never successfully completed.</p>
      <p>The discovery of inductive loading of cables, known then as "Pupinization", led to discussions of building a trans-Atlantic telephone cable in the 1920s, since this reduced signal distortion to a point which seemed to make such a cable possible, given sufficient amplification at both ends.</p>
      <p>An attempt was made to lay such a cable, but it ended in failure in the early 1930s, due to the Great Depression - according to Wikipedia, but I have not been able to find, at least on the Web, other references, by means of which I could determine who made the attempt, and whether it failed while attempting to raise capital, or if any actual cable was set down on the sea floor.</p>
      <p>EDIT: I finally did locate <a class="freelinking external" href="http://www.iscpc.org/information/Timeline_History.htm" rel="nofollow">a reference</a>, which notes that design of a trans-Atlantic telephone cable which was continuously loaded using Permavar tape began in 1928, with the cable being manufactured in Germany. The cable would have run between New York and Ireland, as a joint project of AT&amp;T and the British Post Office, and the project did fail due to the Depression.</p>
      <p>This unsuccessful attempt, however, would then have begun one year too late to have formed the inspiration for the name of Kabel.</p>
