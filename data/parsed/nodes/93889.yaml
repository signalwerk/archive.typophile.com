    <p>It is generally said that Kabel was named after the ﬁrst transatlantic telecommunications cable; however, that was laid in 1858. And the ﬁrst Transatlantic telephone cable was laid in the 1950s. So which cable was laid in ’27? From the Siemens web site:</p>
    <blockquote><p>Facsimile telegraphy was introduced in the nineteen twenties. Photographs were scanned by a photocell and copied onto photosensitive paper by means of a controlled light source at the receiving end. In 1927, the Berlin-Vienna route went into operation using the Siemens-Karolus-Telefunken system. This new way of transmitting photographs was used in particular by the press.</p></blockquote>
