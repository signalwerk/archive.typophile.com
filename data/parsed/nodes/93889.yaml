      <p>Telecommunications is an interest of designers, of course, as we are communicators, and technological change  has a constant impact on our work.</p>
      <p>Round about the time of Kabel, technophile Moholy-Nagy exhibited his telephone paintings, which he had ordered by phone, describing the size and position of abstraqct shapes, and their colors by the pantone system of the day.</p>
      <p>It has always impressed me how <em>au fait</em> Koch was with modernism, given his deep grasp of traditional media. However, during the ’twenties many artists who had been heavily into historicism when it was the thing changed horses and became modernists. It’s not such a big deal for designers (if we don’t become trapped in our brand), as force of necessity makes us familiar with working in different styles and methods, for different clients.</p>
