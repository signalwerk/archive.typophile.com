      <p>I don’t think communication cables as such were the inspiration for the name ‘Cable / Kabel’ — but the technological marvel of the period: the cable car, eg the one that made the highest point of Germany accessible: the Zugspitze (<a href="http://en.wikipedia.org/wiki/Zugspitze" title="http://en.wikipedia.org/wiki/Zugspitze">http://en.wikipedia.org/wiki/Zugspitze</a>). The first one was built in 1926.</p>
      <p>Choosing Kabel as a name during that period is equivalent to using ‘Techno’ or ‘LCD’ in the eighties…</p>
