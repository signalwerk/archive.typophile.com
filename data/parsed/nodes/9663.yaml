    html: <p>FontFlasher uses the font’s bitmaps as delivered by the <span class="caps">OS</span>. So on Windows, for TrueType fonts it uses the Microsoft TrueType rasterizer with hinted or embedded bitmaps, for Type 1 fonts it uses <span class="caps">ATM</span> in b/w rendering. On Mac <span class="caps">OS</span> 9, it uses the Apple TrueType rasterizer and <span class="caps">ATM</span>, respectively. On Mac <span class="caps">OS</span> X, it uses the the Apple <span class="caps">ATSUI</span> rasterizer for all types of outline.  <br><br>Regards,  <br>Adam</p>
