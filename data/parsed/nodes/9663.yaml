    html: <p>FontFlasher principally works ﬁne with any Unicode font and should also work on very large fonts. I’m currently travelling so I cannot verify if there are any limitations. FontFlasher doesn’t preserve the glyph naming, if you generate the font in Unicode mode then all glyphs (even those in <span class="caps">AGL</span>) get the names uniXXXX, so most likely, you’d need to do Generate Names in FontLab. And note that FontFlasher requires one of Fontlab Ltd.’s editors (TypeTool, FontLab, Asia FontStudio) to produce a working font.  <br><br>FontFlasher exists on Mac and Windows. BitFonter only exists on Mac.  <br><br>It should be also noted that it might be actually a good idea to produce a Chinese pixelfont, but not in TrueType format but in OpenType <span class="caps">PS</span> format. The subroutinization performed when an OpenType <span class="caps">PS</span> font is generated can greatly reduce the size of a Chinese pixelfont in that format. Note however, that generating such fonts with subroutinization enabled make take a <span class="caps">LOT</span> of time so for development processes, it’s good to turn subroutinization oﬀ — can be done in FontLab’s options.  <br><br>Regards, <br>Adam</p>
