    html: <p><i>If the font has no/lousy hinting resulting in bad bitmaps, does the resultant pixelfont exhibit those defects too?</i> <br> <br>FontFlasher makes size specific pixelfonts, which means that it is wrapping 'blocks' to pixels in a device-dependent way, i.e. to bitmap output at specific ppms. You can't wrap to pixels without rasterising.</p>
    html_clean: <p><i>If the font has no/lousy hinting resulting in bad bitmaps, does the resultant pixelfont exhibit those defects too?</i> <br> <br>FontFlasher makes size specific pixelfonts, which means that it is wrapping 'blocks' to pixels in a device-dependent way, i.e. to bitmap output at specific ppms. You can't wrap to pixels without rasterising.</p>
