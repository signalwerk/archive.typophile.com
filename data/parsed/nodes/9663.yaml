  html: <p>Dear font experts, <br><br>I’m newbie in font design. <br>Pixel font looks cool to me and seems easy to make, so i want to try create a Chinese pixel font (that’s my mother language).  It seems no one has ever made something like this?… <br><br>And so, i design my characters by dotting pixel-by-pixel, using Windows “Paint” program, and save into bitmap ﬁles. <br>What i want is just 11x11 pixels ﬁxed size, like “Fixedsys”. <br><br><img src="http://www.typophile.com/forums/messages/4101/66938.gif" alt="sample bitmap"><br><br>Is there any tool that can create font pixel-by-pixel, or convert bitmap to font? (have to support Unicode)  I found Kgroup’s PixFont and BitFontMaker (<a href="http://www.pentacom.jp/soft/ex/font/edit.html" target="_blank">http://www.pentacom.jp/soft/ex/font/edit.html</a>), they can do the stuﬀ, but only support English characters… <br><br>Thanks, <br>Azul</p>
  html_clean: <p>Dear font experts, <br><br>I’m newbie in font design. <br>Pixel font looks cool to me and seems easy to make, so i want to try create a Chinese pixel font (that’s my mother language).  It seems no one has ever made something like this?… <br><br>And so, i design my characters by dotting pixel-by-pixel, using Windows “Paint” program, and save into bitmap ﬁles. <br>What i want is just 11x11 pixels ﬁxed size, like “Fixedsys”. <br><br><img src="http://www.typophile.com/forums/messages/4101/66938.gif" alt="sample bitmap"><br><br>Is there any tool that can create font pixel-by-pixel, or convert bitmap to font? (have to support Unicode)  I found Kgroup’s PixFont and BitFontMaker (<a href="http://www.pentacom.jp/soft/ex/font/edit.html" target="_blank" class="link-external">http://www.pentacom.jp/soft/ex/font/edit.html</a>), they can do the stuﬀ, but only support English characters… <br><br>Thanks, <br>Azul</p>
