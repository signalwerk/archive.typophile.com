    html: <p>You can use BitFonter 2.0 from Fontlab Ltd. (<a href="http://www.fontlab.com" target="_blank">http://www.fontlab.com</a> ) to design bitmap fonts. It is fully Unicode-compatible. With Fontlab’s TypeTool 2 or AsiaFont Studio 4, you can create (outline-based) pixelfonts from these bitmap fonts. They all support up to 65,535 glyphs and the <span class="caps">BMP</span> portion of Unicode (unicodes &lt;0xFFFF).  <br><br>Regards,  <br>Adam Twardoch <br>Fontlab&nbsp;Ltd.</p>
