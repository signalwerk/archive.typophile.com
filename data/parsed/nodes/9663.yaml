    html: '<p>Oh yes, it is FontFlasher now. When Yuri ﬁrst demo’d it at <span class="caps">AT</span>ypI in Vancouver it was FlashFonter. I guess they decided that might impinge on Macromedia’s Flash trademark. <br><br><i>it might actually work ﬁne from a blocky autotrace of a bitmap font background</i> <br><br>It might, yes, but my questions to Adam were not directly related to Azul’s project. I just wondered whether one could make a pixelfont from a large Chinese <span class="caps">TTF</span> — e.g. one of the Windows system Chinese fonts — using FontFlasher. <br><br>Such pixelfonts raise interesting issues: one would be hard pressed to mount an intellectual property challenge to them because they are derived from bitmap output of the original font, not from data or code in the font. But at the same time they leverage the value of that font and the work that has gone into it to make it produce those speciﬁc bitmaps. In the past, we’ve had a number of discussions on this forum about things that are legally prohibited (e.g. decompiling fonts in contravention of some license agreements) but which some participants ﬁnd ethically acceptable. With pixelfonts derived from (someone else’s) original <span class="caps">TT</span> font, we have an example of something that is seemingly perfectly legal, but which seems to me ethically questionable if one were to market such pixelfonts as commercial&nbsp;products.</p>'
