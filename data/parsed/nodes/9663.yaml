    html: <p>Ah. From Azul’s description (‘i design my characters by dotting pixel-by-pixel, using Windows “Paint” program, and save into bitmap ﬁles’), I’d presumed he was wanting to make a bitmap font. In any case, if he is designing bitmaps and wants to produce a pixelfont as you describe it, he’s probably going to want to trace his bitmaps. In the upcoming FontLab Studio 5.0, he’ll be able to import his bitmaps into the background layer and trace them (ScanFont’s trace tool is incorporated into <span class="caps">FL5</span>).</p>
