    html: <p>FontFlasher uses the font's bitmaps as delivered by the OS. So on Windows, for TrueType fonts it uses the Microsoft TrueType rasterizer with hinted or embedded bitmaps, for Type 1 fonts it uses ATM in b/w rendering. On Mac OS 9, it uses the Apple TrueType rasterizer and ATM, respectively. On Mac OS X, it uses the the Apple ATSUI rasterizer for all types of outline.  <br> <br>Regards,  <br>Adam</p>
