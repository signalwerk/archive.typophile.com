    html: "<p><i>But what if instead of \"wrapping to pixels\" it's taking the original outlines and adding/moving points as needed to render out the \"correct\" pixels at a certain size?</i> <br> <br>But how would it know what constitutes 'correct' pixels? This is the whole crux of hinting: someone -- a human being -- needs to determine what a correct bitmap looks like at a given size. If an application could correctly guess what the bitmap should look like at all sizes, there would be no need for manual hinting at all and we could automate the whole process. But the smaller the ppem size, the more we (still) rely on human decision making.</p>"
    html_clean: "<p><i>But what if instead of \"wrapping to pixels\" it's taking the original outlines and adding/moving points as needed to render out the \"correct\" pixels at a certain size?</i> <br> <br>But how would it know what constitutes 'correct' pixels? This is the whole crux of hinting: someone -- a human being -- needs to determine what a correct bitmap looks like at a given size. If an application could correctly guess what the bitmap should look like at all sizes, there would be no need for manual hinting at all and we could automate the whole process. But the smaller the ppem size, the more we (still) rely on human decision making.</p>"
  - id: 61662
    user: 1133
    date: 2005-03-14T14:40:00
    date_raw: 14 Mar 2005 — 2:40pm
