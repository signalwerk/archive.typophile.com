    date: 2005-03-10T17:48:00
    date_raw: 10 Mar 2005 — 5:48pm
    votes: null
    html: "<p>Oh yes, it is FontFlasher now. When Yuri first demo'd it at ATypI in Vancouver it was FlashFonter. I guess they decided that might impinge on Macromedia's Flash trademark. <br> <br><i>it might actually work fine from a blocky autotrace of a bitmap font background</i> <br> <br>It might, yes, but my questions to Adam were not directly related to Azul's project. I just wondered whether one could make a pixelfont from a large Chinese TTF -- e.g. one of the Windows system Chinese fonts -- using FontFlasher. <br> <br>Such pixelfonts raise interesting issues: one would be hard pressed to mount an intellectual property challenge to them because they are derived from bitmap output of the original font, not from data or code in the font. But at the same time they leverage the value of that font and the work that has gone into it to make it produce those specific bitmaps. In the past, we've had a number of discussions on this forum about things that are legally prohibited (e.g. decompiling fonts in contravention of some license agreements) but which some participants find ethically acceptable. With pixelfonts derived from (someone else's) original TT font, we have an example of something that is seemingly perfectly legal, but which seems to me ethically questionable if one were to market such pixelfonts as commercial products.</p>"
