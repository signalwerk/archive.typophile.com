    html: <p><i>It seems no one has ever made something like this?…</i> <br><br>Until very recently, almost all East Asian fonts used embedded bitmaps for text sizes. There are ‘bitmap factories’ in China and Japan where dozens of people work on single fonts, creating bitmaps for key sizes. Because of the complexity of the forms and the diﬃculty of their interpretation at small sizes, making bitmaps has until recently been more eﬃcient than the kind of hinting models used for most other scripts. Microsoft’s new Japanese face Meiryo (to be released with Longhorn), is one of the ﬁrst East Asign <span class="caps">TTF</span>s to use hinting exclusively and include no embedded bitmaps. <br><br>Have you looked at FontLab’s BitFonter? I don’t know whether it handles <span class="caps">CJKV</span> encoding, but it is generally regarded as the best bitmap font editor, and supports more bitmap font formats than any other&nbsp;tools.</p>
