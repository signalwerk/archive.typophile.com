    <p>This is the wall calendar for the year 2010. It's made of two thousand and ten keyboard keys. This design offers a new visual experience of time, differently than your average wall calendar. It looks beautiful on the wall, and makes finding dates and marking events a creative process.</p>
    <p>The size of the print is B0 (70cm x 100cm / 27.56” x 39.37”).</p>
    <p><img src="/sites/default/files/old-images/70100_300dpi_6349.jpg"></p>
    <p>The printing is done with a standard 4c offset printing machine on 135g/m2 glossy paper, finished with a UV coating to protect the colors from bleaching. The UV coating also provides protection against water and dust.</p>
    <p>Shipping:</p>
    <p>Worldwide shipping (folded in a protected envelope) is included in the price of $20.10. </p>
    <p>For $9.90 extra the wall calendar will be sent rolled in a reusable plastic tube.</p>
    <p>If you decide to order two or more wall calendars, world wide shipping (rolled in reusable tubes) is FREE!</p>
    <p>Orders:</p>
    <p>Orders can be made through Etsy <a href="http://www.etsy.com/view_listing.php?listing_id=37601980">http://www.etsy.com/view_listing.php?listing_id=37601980</a> or my <a href="http://haraldgeisler.com">(beta-) Website</a>.</p>
    <p>Critique:<br>
    Is welcome!</p>
    <p>Happy New Year!</p>
    <p>PS: Yes, worldwide includes Alaska … Albany … Greece … Italy … Japan … New Zealand … Zimbabwe etc.</p>
    <p><img src="/sites/default/files/old-images/70100Thumbnail_4914.jpg"></p>
    <p><img src="/sites/default/files/old-images/70100-holding_6365.jpg"></p>
