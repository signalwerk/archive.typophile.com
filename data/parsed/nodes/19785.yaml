    <p>Hi everybody!<br>
    i’m working on my graduation thesis and i had to start from the book that me and other guys redesigned and illustrated.<br>
    we worked on “Flatland” by Edwin Abbott.<br>
    Starting from here i’d like to work on layered type and i’d like to create a font family that could be readable only by overlapping the different types with different colours.<br>
    Now i’m searching information about something similar but i found only the Layered type created by some students of an underware workshop (<a href="http://www.typeworkshop.com/index.php?id1=Helsinki_Lahti_10_2002&amp;id2=01&amp;id3=basic">http://www.typeworkshop.com/index.php?id1=Helsinki_Lahti_10_2002&amp;id2=01&amp;id3=basic</a>) and the YMC type bythe Dainippon Type Organization (they are owner of a website but it’s all in Japanese…)<br>
    Do you know something else that could be useful?<br>
    Thanks a lot!!<br>
    Tommaso</p>
