      <p>Well, my <a href="http://typophile.com/node/19348">Uncompromising Arabic Font</a> is 6-layered, so to speak.<br>
      Layering is good for security and demonstration purposes. More, I do not know.<br>
      If the 6 fonts are given different colors,  overlaps, swashes and ligatures could be fantastically demonstrated. If one or more fonts is whitened, the writing could be secured. The more the whites, the higher the security?!<br>
      Happy Layering with <a href="http://www.crAUSwords.com/flowers/WFlowers.htm">Flowers</a></p>
