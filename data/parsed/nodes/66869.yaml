    html: |-
      <p>The spacing in "MATTHEW" is messy... and hard to fix!<br>
      1) Modify the "T" by making it narrower, and ideally slanting the right serif in the same direction as the left one. These tricks will give you more room to tighten up the "TT".<br>
      2) Loosen the "HE", and maybe the rest a bit too.</p>
      <p>hhp</p>
