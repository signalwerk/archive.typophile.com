    <p>Hi all</p>
    <p>I'd like to get some feedback on these proposed cover designs for a set of the four gospels of Matthew, Mark, Luke, and John.</p>
    <p>The format is 165x230mm, and the covers would be printed on an uncoated (maybe recycled) stock.</p>
    <p>Thanks in advance</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bible_5861.jpg"></div><p></p>
