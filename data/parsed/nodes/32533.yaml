    <p>hi all,</p>
    <p>i'm a book designer who is at present undertaking an ma in graphic design. for my final project, duration of 1 academic year, i shall attempt to expose the significance of the space in typographic design, starting from exploring form &amp; counterform, then moving on to figure &amp; ground, foreground &amp; background and finally object &amp; environment. </p>
    <p>seeing as there are many of you who are absolutely fanatical about type and design i would greatly appreciate if you could put your views across about the importance of space when using type. Also if you have done any experimental work on this subject I would be very interested in seeing it. or if you have any other information (exhibitions, articles, books etc) that you might think it would be useful.</p>
    <p>at present I have done an extensive amount research and have read many books. if anyone is keen on this subject i'll be happy to give you reading references an other materials i've come across.</p>
    <p>i look forward to hearing from you all.</p>
