    html: |-
      <p>Bookman and New Century Schoolbook--both being members of the original Laserwriter 35 typefaces, they are widely distributed and well-known. Both are legible, but few would ever choose either as the first typeface that comes to mind for ANY job. Yet, if used, it's a perfectly AVERAGE and adequate choice.</p>
      <p>Because Bookman has a bit too much individual flair, I'll vote for the latter.</p>
