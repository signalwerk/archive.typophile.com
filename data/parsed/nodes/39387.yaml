    date: 2007-11-24T12:23:00
    date_raw: 24 Nov 2007 — 12:23pm
    votes: null
    html: <p>Arial might be totally "average" or "invisible" on office documents, but in a context like a wedding invitation, 36 pt. Arial Bold would look pretty odd. The idea of what's invisible to type people and what's invisible to the average reader are two very different things -- Zapf Chancery would probably look great on a wedding invitation to the non-designer.</p>
