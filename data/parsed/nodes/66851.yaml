  html: |-
    <p>Hello There!</p>
    <p>I'm making my first font, and releasing betas as I make any little bit of progress (in the same way as open source projects do, since my background is PHP programming).</p>
    <p>Is a nice bold condensed script with plenty of ligatures and final forms alternates.<br>
    For me is a learning experience, so <strong>any feedback is highly appreciated</strong>.</p>
    <p>You can download it for free from the lobster font mini-site.<br><a href="http://www.impallari.com/lobster/">http://www.impallari.com/lobster/</a></p>
    <p>Thanks!!!<br>
    Pablo</p>
    <p><img src="/sites/default/files/old-images/specimen1-beta12-570.jpg"></p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/specimen1-beta12-570.jpg" width="570" height="437" alt="">
