    html: <p>As far as I remember, the specifications advise to use the PostScript name as file name (Type1 or OT specification). (Because of old programs / PostScript interpreters.) I would not put the version number in the file name. Alternatively I would put the version number also in the internal font names. (The dot is allowed there, isn’t it?) If an application has problems with that, it is the fault of the application, but not the fault of the font.</p>
