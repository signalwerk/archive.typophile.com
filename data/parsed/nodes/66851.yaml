    html: |-
      <p>I’m not to familiar with the œ, but it’s considered a single glyph (diagraph) — not a ligature. Maybe some frenchmen can chime in on that one. Also the Œ might be to heavy where the shapes meet.</p>
      <p>Other things I noticed:<br>
      • Bumpy ring in “å”.<br>
      • Bumpy a shape in “@”.<br>
      • I’d consider drawing © in style with the typeface. If you keep it as is, you need to fix the top node in the c part.<br>
      • The “n” and it’s derivates have some problems with the northwestern part of the curve. The same bumpyness seems to repeat in a lot of the connecting tails.<br>
      • I spotted some collisions: “ft”, “nx”, “fj”, “gj”, “fï”<br>
      • “ð</p>
