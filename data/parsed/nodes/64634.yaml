    <p>dear Typophiles!</p>
    <p>I am happy to tell about new release.<br>
    It is Oksana Sans Narrow and Condensed, new faces in Oksana big family in six weights each, with european latin &amp; cyrillic codepages. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ok_narrow_cond_01_6533.png"></div><p></p>
    <p>In this faces i try to experiment with cyrillic ligatures: after very usual ukrainian «ії» and «її» i add also «сл», «єл», «ељ» etc. I plan to expand list of cyrillic ligatures in my fonts and interesting to know your opinion about.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/narrow_cond00_4324.png"></div><p></p>
    <p>Oksana Sans Narrow:<br>
    <a href="http://http://new.myfonts.com/fonts/andrijtype/oksana-sans-narrow/" title="http://http://new.myfonts.com/fonts/andrijtype/oksana-sans-narrow/">http://http://new.myfonts.com/fonts/andrijtype/oksana-sans-narrow/</a></p>
    <p>Oksana Sans Condensed:<br>
    <a href="http://new.myfonts.com/fonts/andrijtype/oksana-sans-condensed/" title="http://new.myfonts.com/fonts/andrijtype/oksana-sans-condensed/">http://new.myfonts.com/fonts/andrijtype/oksana-sans-condensed/</a></p>
    <p>and few pictures here:<br>
    <a href="http://type.org.ua/oksana-sans-narrow-cond/" title="http://type.org.ua/oksana-sans-narrow-cond/">http://type.org.ua/oksana-sans-narrow-cond/</a></p>
