      <p>Most EULAs allow you to sell your font licence (e.g. if you sell your business) and, presumably, also give it away, provided certain conditions are met, such as deleting the files from your own system. So if a EULA forbids sending fonts to a printer, or embedding them in a pdf for printing*, I suppose you could technically transfer ownership of the font to the printer for the time they require it, then have them transfer it back. That's the rationale I use for violating EULAs in this regard, though I don't actually go through these transfer steps.</p>
      <p>*One major book manufacturer I deal with prefers jobs submitted as pdfs and actually offers a small discount if they are. I know they have the Adobe Library, but very much doubt if they have licences for the collections of the many small foundries whose fonts I tend to use.</p>
