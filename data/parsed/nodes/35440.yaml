      <p>" I really wish the foundries would make their licenses more in line with how fonts are actually used (embedded in PDFs, sent to printers with the files) then we wouldn’t <em><strong>all be criminals."</strong></em></p>
      <p>Book publishing is different, criminalality-wise. The:<em>"Most of the printers and publishers [you] know [who] won’t accept pdfs for the final job, [because] they need the raw files either for last minute in-house changes or for back up," </em> — are using the fonts to make final touches to the composition, and they should  pay. The fonts that need be best meet the clients who need be cheapest, and I don't have a standard licensing answer for you beyond our 2-5 cpu.</p>
      <p>The fonts are "actually used" in most instances when they are specified and fit to the spatial requirements of the composition. It was a long struggle to make it work, for both graphic and type designers. The decision for myself and other type designers, and we all agreed against most current practice, was that our license would be for a cpu, not a printer as is was most other places for a long time before, but not long after.</p>
      <p>PDF embedding was introduced later, with what we considered a violation of the millennium copyright act, being that it treated legacy fonts with no embedding bit, our copyrighted font software, as editable embeddable. So we had <strong>no </strong>choice from the beginning but to control the embedding abilities of our fonts. We offer, in our basic license, basic, practical embedding rights and I've just requested a link to more rights when needed in our online eula. </p>
      <p><em>...working to decriminalize type users, one type use at a time.</em></p>
      <p>Cheers!</p>
    html_clean: |-
