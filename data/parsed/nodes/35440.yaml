      <p>Paul Cutler -- <cite>Foundries make EULAs that we cannot follow no matter what our intentions.</cite></p>
      <p>It is hard to formulate such that it is understandable and at the same time covers possibilities not anticipated by the author. Unfortunately, reading is a very creative process too.  :)<br>
      Proof of this:</p>
      <p>Gary Long -- <cite>I suppose you could technically transfer ownership of the font to the printer for the time they require it, then have them transfer it back. That’s the rationale I use for violating EULAs in this regard, though I don’t actually go through these transfer steps.</cite></p>
      <p>Transferring of <cite>usage rights</cite> (not <cite>ownership</cite>) most of the time requires that you let the foundry know.<br>
      By your rationale you could as well 'share' fonts with family and friends, claiming that you do not use the fonts at exactly the same time ...</p>
      <p>My impression is that more and more foundries allow giving font files to the printer without need for an extra license (assuming fonts will be deleted if the job is done). I allow it, Village allows it, and the first foundry where I found this years ago was TEFF who had an agreement PDF to be printed out by the designer and signed by the printer -- a very nice way to remind the printer that it is not mere words but meant seriously.</p>
