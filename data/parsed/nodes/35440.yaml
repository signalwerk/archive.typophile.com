    <p>Hi. </p>
    <p>Sorry for the double question. Could amount to a jumbled thread.</p>
    <p>First: How are most of you handling a situation where you need to use a particular if you're following a client's design standards). Do most of you consider that a business expense or do you bill your client back but then you keep the font for your own use? Just a biz practice question.</p>
    <p>The other is about license agreements. I do know they exist but I started reading some threads and was disturbed to find people questioning whether posting a pdf to a website is a violation of an agreement. I know it depends on the license but let's talk generalities.</p>
    <p>For starters, back in the day when we didn't make pdfs for printing (I still don't unless asked) and we didn't have the option of NOT sending the font with the job to be printed, weren't we all violating license agreements? How does one get around it?<br>
    Expect the printer to purchase the font for every designer's job?</p>
    <p>Is the question about pds, either posted to a website or given to a client for approval, a problem because someone could extract the font (I don't see how) or is the issue that they could edit and therefore "use" the font?</p>
    <p>If the latter, they can't really create anything new with it so what's the big deal? Are people really having a workflow process where the constantly password protect pdf files?</p>
    <p>I have a client who is requiring me to send my print-ready files to their client and they won't take print-ready pdfs that I know of. How do I get around this? Only use fonts that we both already have on our systems?</p>
    <p>Any input would be much appreciated.</p>
