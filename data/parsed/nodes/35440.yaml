      <p>"I know they have the Adobe Library, but very much doubt if they have licenses for the collections of the many small foundries whose fonts I tend to use."</p>
      <p>This is part of the problem. There was a time when the Adobe collection was a pretty big chunk of the PostScript fonts out there. Today, many more players are in the game. A printer who had spent the bucks for the Adobe collection figured he had made his type investment. He figured there would be plenty of repeat uses of most of those faces. Now, with many thousands more possible font choices, a printer isn't so sure he will get repeats from small foundry fonts so he is less likely to purchase them and depend on the customer to supply them for his print job. Embedded pdf files seem like the solution to the printer's dilemma. The trouble comes when clients require native files.</p>
      <p>ChrisL</p>
