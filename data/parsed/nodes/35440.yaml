      <p>Three cheers for FontFont and terminal design.</p>
      <p>We've all been breaking laws left and right and that's because the EULAs are for the most part unnecessarily restrictive. It seems crazy to ask the printer to license the font for a job, and at whose expense? Just try getting a publisher to purchase multiple licenses for one job. </p>
      <p>If there's an honor system, the printer will delete their copy of the font after the job is done, as will the client unless they have their own license. To expect everyone who handles a file to purchase a license seems excessive and impractical. If the client plans to continue to use the font after you deliver the file they should by law purchase their own license, and so should you if you plan to go on using a font given you by a client. </p>
      <p>I didn't know the first thing about EULAs until I started hanging out at this forum and I still don't bother to read them line for line when I buy a font. I really wish the foundries would make their licenses more in line with how fonts are actually used (embedded in PDFs, sent to printers with the files) then we wouldn't all be criminals.</p>
      <p>I have one publishing client who gives me a list of fonts they already have licensed. I can only use those - fair enough since it's a good list. If I don't already have the font they'll give it to me if I sign a document promising to delete it from my hard drive when the job is completed, but I still preserve a copy of the font in the archive for the job just in case. I betcha they aren't buying additional licenses for the printer.</p>
