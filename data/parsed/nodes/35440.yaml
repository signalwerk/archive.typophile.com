      <p>Stock photography is an interesting comparison. If a photo is purchased for a job, it "travels" with the job, from designer to client to printer. You don't need three separate licenses. HOWEVER, the difference is the photo is only used once, and you need to pay again if you want to use it again, while theoretically everyone who comes into contact with the font could potentially put it on their server and continue to use it. I'd like to see arrangements for font licensing that allow the font to travel with the stipulation that it be removed from servers and font management software upon completion of the job. I realize this is hard to enforce, but so are the current EULAs which is why we all violate them.</p>
      <p>Anyway it seems more and more foundries are allowing both PDF embedding and giving the fonts to the printer so maybe this is moot.</p>
    html_clean: |-
