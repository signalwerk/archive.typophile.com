      <p>In the past fonts were generally sent to the printer along with Quark files.</p>
      <p>Printers would be hesitant to use any fonts they already owned to print your document, in case they were different versions - they might be for example slightly different widths and thus cause text reflow.</p>
      <p>If asked the printer would generally claim they deleted your fonts immediately after outputting the job...</p>
      <p>Was surprised to note that FontFont/Fontshop's licence actually allows for a copy of the font to be given to the printer for output, as long as the document is not modified.</p>
