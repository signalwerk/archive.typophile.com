      <p>I consider all fonts licensed a business expense.</p>
      <p>I only send PDFs to printers. It solves the problem of having to send fonts to printers. </p>
      <p>I also only give clients PDFs as proofs. I never give the client the raw materials.</p>
      <p>And, unfortunately, yes. We were all violating the EULAS to which we had agreed when licensing the fonts. O:^o</p>
      <p>That is the rub. If you have to give the printer the files they must have a license to the fonts. The only other work-a-round is to only license fonts from foundries that allow this. There are very, very few of these foundries.</p>
      <p>If you have to give the client the raw files then anyone who gets the file needs to have a license for the fonts. You can always build this into your estimate on the job and then license for them.</p>
