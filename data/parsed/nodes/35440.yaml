      <p>Most of the printers and publishers I know won't accept pdfs for the final job, they need the raw files either for last minute in-house changes or for back up. I think it's absurd that some foundries won't let you embed their fonts in pdfs and knowingly and willfully violate those EULAs.</p>
      <p>I don't bill clients for fonts if I plan to keep them for my own use, that isn't right. If it's a font I need to use for a specific job (requested by the client) then I require them to license the font for me and I don't keep it except in the backup file for the job.</p>
