      <p>Patty/Aluminum: I don't think it's wrong to bill the client for job related expenses, including font licenses. I see it less like the design software used to create a design, and more like royalty-free stock photography. If I license a photo for a job, and then find use for it again later, fine (assuming it's not rights managed). This is different than a PMS swatchbook. I won't bill (directly) for a swatchbook since it is a tool, like a printer, or a desk, or pencils. Those things you need to be in business. Fonts, you need for a particular job, so bill to that job.</p>
      <p>Actually, I think this approach violates most EULA's less than having the client license, you use, then give to them at the end of the job (effectively a license transfer -- usually a no no).  If the client also needs to use a font, we will each purchase a license.</p>
      <p>JaneP: I think that if a client requires you to use a typeface for their branding program, they either need to have a license that allows them to distribute the font to contractors, or you should bill them for the license. Attn all New Yorkers (others, google): consider if Dr. Jonathan Zizmore (board certified dermatologist) was your client. You'd be on the hook for at least 50 fonts just to modify one ad. Dr. and Mrs. Z would then, of course, salute graphic designers for their courage! I digress.</p>
      <p>Randy</p>
