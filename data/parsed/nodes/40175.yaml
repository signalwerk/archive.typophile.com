    <p>Hi All,</p>
    <p>In my quest to research so-called <a href="https://web.archive.org/web/20081011041318/http://www.typophile.com/node/35550">Computer-style fonts like Data 70</a>, I came across this interesting interview between <a href="https://web.archive.org/web/20081011041318/http://www.elupton.com/index.php?id=22">Ellen Lupton and Jonathan Hoefler</a>. In it, Hoefler mentions a typeface Barry Deck created for Nickelodeon called “Fontoid.” </p>
    <p>Try as I might, I haven’t been able to find a sample of this anywhere, and I’d very much like to compare it with the other faces I’m looking at.</p>
    <p>Does anyone have a sample or know where I can find one?</p>
    <p>Thanks.</p>
