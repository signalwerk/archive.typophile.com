    <p>Who knows more about this hacking methods via Internet browsers, which was reported today by the German Spiegel magazine:</p>
    <p><a href="http://www.spiegel.de/netzwelt/web/0,1518,672103,00.html" title="www.spiegel.de/netzwelt/web/0,1518,672103,00.html">www.spiegel.de/netzwelt/web/0,1518,672103,00.html</a></p>
    <p>"Angestellte hätten E-Mails erhalten, die sie dazu bringen sollten, mit dem Internet-Explorer eine präparierte Webseite zu besuchen. Das bloße Aufrufen dieser Seite, die "gewürzte" OpenType-Schriften enthielt, hätte dann für die Infiltration des Rechners genügt".</p>
    <p>Translation: Employees of major companies received emails linking to hacker website virus-infected by special OpenType fonts.</p>
    <p>"Angriffspunkt der Schadsoftware ist die für die Dekodierung der Schriften eingesetzte Rendering-Engine, die nicht nur im Explorer zum Einsatz kommt - die Lücke betrifft auch Office und Powerpoint."</p>
    <p>Translation: The hacker attack was made via the font rendering engine of the operating system and of Office programs.</p>
    <p>"OpenType-Schriften enthalten Metadaten, die erweiterte typographische Möglichkeiten für diese Fonts ermöglichen. Offenbar ist es gelungen, in diesen Zusatzdaten zum Font Schadcode zu verstecken."</p>
    <p>Translation: Embedded OpenType fonts contain meta data which lend themselves to embedding of computer viruses.</p>
    <p>see also <a href="http://www.microsoft.com/technet/security/bulletin/ms10-001.mspx" title="http://www.microsoft.com/technet/security/bulletin/ms10-001.mspx">http://www.microsoft.com/technet/security/bulletin/ms10-001.mspx</a></p>
    <p>see also <a href="http://www.typophile.com/node/66228" title="http://www.typophile.com/node/66228">http://www.typophile.com/node/66228</a></p>
