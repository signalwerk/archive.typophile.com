      <p><cite> based on those typefaces working well with the letter frequency characteristics of their respective languages, as well as their having a long history of association with them.</cite></p>
      <p>I think the first point (type design from a certain country goes well with language of that country) is mostly a myth. It is of course true that a type designer knows his own language best and probably pays more a attention to the local diacritical characters, certain letter combinations and so on. But in general: In scripts like Latin you can put any character beside any other character. There is nothing French, or Italian, or German about that. A good type design should work well in any language and I wouldn’t know that there is anything inherent in the general look of Garamond, Bodoni or Walbaum which make them especially suitable for one language, but not others. And saying the designs inherit certain virtues of a type designer of a certain area in the world where people are said to have certain virtues sounds even more far fetched. </p>
      <p>The second point (association) is all that matters in my opinion. It’s not about the typeface design itself, but about the context in which they are used. These connotations make typefaces British, French and so on.</p>
