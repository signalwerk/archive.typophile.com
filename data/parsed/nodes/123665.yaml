      <div class="comment-spam-body"><p>As for France, my strongest impressions are Pays de Didot and the prevalance of thick and thin sans fonts compared to the Anglosphere. Also, the loose free-form designs Art Nouveau had perhaps wider adoption for French fonts than in most countries. The somewhat similar, but not quite as loose,  Jugendstil had influence in Germany and Austria, but my impression is that it was not as strong as Art Nouveau in France. Anyway, it's difficult to see how much credibility can be given to on the fly comments like this.<br>
      Don</p>
      </div>
