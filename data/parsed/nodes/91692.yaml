    <p>Dear Typophiles,</p>
    <p>although I've been enthousiastic about design and type for ages, I have no education whatsoever in those fields...  nevertheless, my interest often ends up making me the "expert" on such things. Seeing that my workplace (Astronomical Institute "Anton Pannekoek") only had an inofficial logo that someone had hand-drawn in Paint, I set out to design a better one.  It ended up garnering a lot of approval by my colleagues, and has recently been pronounced the "official" logo of the institute.</p>
    <p>However, personally, I'm not quite happy with the logo as it stands now.  I'm having this nagging feeling that there are some glaring typographic crimes in there that could be fixed easily (and probably without most people noticing), and I'd like to do so before the current logo entrenches itself too much. Hiring a pro is not an option — the institute is not going to pay money for something they think they already got for free...  ;o)  So:</p>
    <p><strong>Please help me "fix" this logo!</strong> </p>
    <p>I'm showing two version of it here: A text-heavy one and a graphics-heavy one.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/api1_3857.png"></div><div class="imageWrap"><img src="http://typophile.com/files/api2_6167.png"></div><p></p>
    <p><em>Here's the rationale behind my design:</em></p>
    <p>At first sight, the graphic is supposed to depict the dome of an astronomical telescope facility.  On second sight, it is resolvable into the letters "API", which are the acronym commonly used for our institute.  The positioning of the dome on top of the text block's "roof" mirrors the location of our actual telescope domes on the roof of the university building.</p>
    <p>The colors black, red, white are from Amsterdam's coat of arms.</p>
    <p>I picked the font (EB Garamond) to match the one in the official logo of the University of Amsterdam, though I suspect they're using a different (and expensive) form of Garamond.</p>
    <p><em>Here are my grievances with the current design (and I'm sure you can come up with more):</em></p>
    <p>The text is fragile and becomes unreadable on, say, a PowerPoint slide, unless one were to make the logo rather big. That may not always be an option.</p>
    <p>The graphic feels somewhat unbalanced.  The dome is not a perfect half-circle; rather, it is made out of two perfect quarter-circles with an offset in between...  as a result, I'm not happy with the not-quite-square overall proportions of the graphic.  I haven't figured out how to do it better, though.</p>
    <p>Taken by itself, the graphic feels ungrounded, like one of those Pac Man ghosts.  It needs the straight line below to give it some foundation.  However, I haven't found a good way to include such a line while preserving that unified, closed-in-itself "badge" feeling that good logos have.</p>
    <p>Any ideas? </p>
    <p>Kind regards, </p>
    <p><em>Catharsis</em></p>
