      <p>Alright, here are some new developments.</p>
      <p>First, I tried out varying increasing the <strong>weight</strong> of the mark:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/weights_4251.png"></div><p></p>
      <p>In both rows, the left version is the original, the right has thickened stems, and the middle one has thickened stems plus some rearrangement to keep the spaces free (rotating the dome to face the viewer more, basically). The upper row is "extrabold" and the lower one "bold".</p>
      <p>Overall, I do prefer the original version for its sheer elegance, but I can certainly see the use of the adjusted bold version (lower middle) for small sizes.</p>
      <p>As for <strong>thinning the outline</strong>:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/thin_outlines_3810.png"></div><p></p>
      <p>Here I changed the thickness of the outer arcs (middle version) and of the stems, too (right version). I don't like the outcome. It emphasizes the cleft down the middle of the dome, which is actually the most inaccurate part of the image. Actual telescope housings have a vertical slice-shaped window in the round dome but not in the straight tower part, since the dome and its window rotate with respect to the tower. Apart from that, I also simply prefer the visual impression of constant line strengths throughout the parallel parts of the image.</p>
      <p>Finally, I took Luma's suggestions of <strong>wide tracking</strong> and bringing back the <strong>horizontal rule</strong> for a ride:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rules_centered_5304.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/rules_right_4283.png"></div><p></p>
      <p>I do like the ordering effect of the rule, especially when it's on top, but I also like the succinctness of the simple form without rule. In any case, I wanted to get the logo to a point where it can comfortably exist without a rule to support it, and I think that's been achieved.</p>
      <p>I also tried it on the side, but that doesn't quite work out:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rules_side_4328.png"></div><p></p>
      <p>So I guess these are my new favorite arrangements...  note the use of the "bold" symbol in the third arrangement.  I think it meshes fairly well with the other ones.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/arrangements_5910.png"></div><p></p>
