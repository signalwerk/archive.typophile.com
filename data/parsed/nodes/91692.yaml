      <p>Thanks for your feedback!</p>
      <p>I know hiring a pro is the way to go if the result should look professional.  But frankly, the level of typographic interest in the institute is very low, and it survived just fine without a logo at all for decades upon decades. When someone needed a logo for a poster a few years back, she painted one by hand in PowerPoint... and other people were happy to use that one as well; apparently no-one felt the need to improve on it. The effort and money spent on a <em>great</em> logo would just go to waste. So if you can help me come up with a <em>decent</em> logo, I believe that will be more than sufficient.  (And I'll admit that I have a certain ambition to reach that level by my own hand...)</p>
      <p>So, first of all, I redesigned the overall shape of the mark. I think it looks a lot tidier now:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/cleanup_4136.png"></div><br>
      I find the regular spacing of the stems on the left side pleasing, and the compression of the lines on that side lend the mark some much-needed "beef". I gave the stems flat bottoms so they would suggest a flat foundation, which helps to solve my earlier "Pac Man ghost" problem.  I think the mark works fine now even without a line below to carry it.<p></p>
      <p>Brian suggested adding serifs to the mark; that concept threw me for a loop at first. But it turned out pretty easy to implement. First I added some Modern-style contrast, and then some actual serifs... and finally an i-dot, though frankly I'm not sure whether that's an improvement.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/sans_4986.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/serif_3692.png"></div><br>
      Overall, I probably like the Modern-style but sans-serif mark (second from above). The serifs are interesting, but they come with a certain expensive-watchmaker feel. Well, maybe that's not the worst association for astronomy.<p></p>
      <p>I also tried the suggestion of grouping the text flush-left with a condensed font.  I suppose it works, though I prefer the previous designs.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/condensed_5837.png"></div><p></p>
      <p>Oh, and I'm afraid there's nothing I can do about the name...  My initial designs also read <em>Anton Pannekoek Astronomical Institute</em>, but they corrected me...  the official name is Astronomical Institute "Anton Pannekoek".  The acronym API is for Anton Pannekoek Institute. I know, I know...</p>
