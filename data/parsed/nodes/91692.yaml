    html: |-
      <p>I do realize the <em>A</em> is uncomfortably narrow...  but I'm mainly aiming at creating a pleasing telescope dome than a pleasing lettering (let's face it, those letters are pretty ugly taken by themselves). If the compressed nature of the <em>A</em> renders the acronym harder to read, that actually plays in my favor. I want people to see the dome first, and then have the coin drop on the letters.</p>
      <p>But I did try out the suggested remedies:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/3d_6512.png"></div><p></p>
      <p>First, rotating the dome to face the viewer more directly didn't produce a very appealing result in my opinion. The overall morphology regressed to the state I started out with: Haphazard spacing between all stems, less volume, more line-art feeling. I also had to abandon the serifs, since the stems no longer formed regular groups that could be bundled together.</p>
      <p>However, curving the dividing line between the dome and the tower upwards to suggest perspective is very effective. Again, I have to go sans-serif, but the three-dimensionality of the mark now speaks for itself quite well.</p>
      <p>I like it a lot, but I'm still not quite 100% sure this is preferable over the dense serifed version. That older version had an "expensive Swiss watchmaker" feel to it, whereas the 3D version feels more like "Woo! Check out this video of me snowboarding!"</p>
      <p>Here are some shots of the 3D mark combined with the type. Again, I made a "bold" version of the logo for the smallest size.</p>
      <p>EDIT: It just occurred to me that the 3D version might have some undesirable phallic interpretations... is that a problem...?  /:P</p>
