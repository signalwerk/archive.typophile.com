      <p>Are the serifs in the logo the same structure as the ones in the font? They should be.</p>
      <p>I would make the horizontal (bowed) line not vary in thickness. In fact if anything it should be (slightly) thicker towards the center.</p>
      <p>The way color is usually handled in logos is either having two versions (which means people have to be careful to use the right one) or having one color version that degrades gracefully to monochrome.</p>
      <p>The top of the "A" needs what's called modulation (thickness variance) to avoid looking too heavy. You might even trap it:<br>
      <a href="http://www.themicrofoundry.com/ss_trapping1.html" title="http://www.themicrofoundry.com/ss_trapping1.html">http://www.themicrofoundry.com/ss_trapping1.html</a></p>
      <p>BTW, make sure to give Typophile credit when talking to your colleagues!</p>
      <p>hhp</p>
