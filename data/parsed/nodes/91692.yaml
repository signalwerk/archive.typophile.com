      <p>The institute director looked a bit distressed when I showed him the new designs, since he already presented the initial version to the dean as the "official logo". I personally don't think it's a problem; it <em>is</em> the same concept after all, just better executed. Most people probably won't notice the change...  ;o)  And it's not like it has been printed onto something expensive yet.</p>
      <p>The director's main concern was the removal of the red color, so I reintroduced that. I'm not quite decided yet where to put it, though. I could either color some text or the rule:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/red_3568.png"></div><p></p>
      <p>I also implemented hrant's latest tweaks. I picked the 3D + serif version because it is the most pictorial, and as I've mentioned one of my main goals is to make people see the dome at first glance.  I also gave the finer print a bit of stroke since I don't have access to a heavier weight; I think it works fine.</p>
      <p>I don't intend to make the color a mandatory part of the logo, though.  I like it this way:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/shaded_3918.png"></div><p></p>
      <p><strong>@hrant:</strong> I don't think a downward curve would work, since that would imply that the dome is viewed from above, which then clashes with the straight-cut foundation. As it is now, the flat foundation and the curve paint a consistent 3D picture as seen from someone standing on the ground, eyes level with the foundation.</p>
