      <p>Working with a professional designer would be your best solution.</p>
      <p>However if you want to do it yourself, here are a few suggestions. I think your basic API design is clever, but I'd suggest making it using a heavier line weight. The "unbalance" you refer to doesn't bother me in the symbol itself, but I don't like the way it relates to the centered words below. I also don't like having the words in all caps, centered; it's rather dull.</p>
      <p>I'd suggest trying the logo on the left, and on the right have the type in 2 lines (perhaps even in 4 lines), upper and lower case, aligned left (rather than centered). And perhaps in a more condensed font. </p>
      <p>These are just offhand suggestions; you'd have to experiment to see if they make things better or worse.  :)</p>
      <p>And maybe there's nothing you can do about this, but it bugs me a bit that the word order doesn't match the symbol. The symbol says API, but the first letters of the words below it are AIAP. Would it be possible to change the word order to "Anton Pannekoek Astronomical Institute"?</p>
