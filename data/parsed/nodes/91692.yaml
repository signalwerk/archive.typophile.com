      <p>Carved some weight off the A's apex (which helped), returned the arched crossbar to uniform strength (which also helped), and remodeled the serifs after the ones from the Garamond (which I'm not sure I like). The problem being that Garamond has cupped stem ends, which look a bit weird when applied one-sided The resulting serifs look rather clumpy and draw more attention than they should have... </p>
      <p>Top is old, bottom is new.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/serifs_4481.png"></div><p></p>
      <p>However, Riccardo's suggestion works fabulously well:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rule_4361.png"></div><p></p>
      <p>I do believe this is my new favorite design. I'll have to make the text red now if I want color, but that's a small sacrifice.  :)  </p>
      <p>This will restrict the number of arrangements of text and mark I can make, but perhaps that's for the better anyway. I can easily merge the mark with the rule in the centered, graphics-dominated arrangement, and I guess I can use the serifs when the mark stands alone by itself.</p>
