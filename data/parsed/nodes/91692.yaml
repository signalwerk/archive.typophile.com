      <p>I suppose it could be viable to use the logo in such an environment. I've actually used the crude version of my logo in white on a darkish photographic background before, for a presentation. However, I would prefer if it could stand on its own without a painted background. A black-on-white mark would certainly work better on letterheads and the like. I'd want that to be the primary version of the logo, with perhaps a starry night "badge" version for specialized applications.</p>
