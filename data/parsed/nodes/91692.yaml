      <p>I like your "nighttime" variation. The background gradation is a nice, subtle touch.</p>
      <p>And you'll probably need a reversed-colors version (white letters) anyway, for those situations where the logo needs to be printed on a dark background, or reversed out of a dark portion of a photo. </p>
