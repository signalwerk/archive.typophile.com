    <p>I can’t think of a group that would appreciate this more, so I had to share. </p>
    <p><cite>(Blah Blah) Printing Inc. is seeking a Graphic Designer to design and build ads for newspapers. Must be proficient in EnDesign, Quark, PhotoShop, and Illustrator. Medical and Dental + 401K ...</cite></p>
    <p>It brought to mind this funny mistake I saw a few weeks ago:</p>
    <p><cite>(Blah Blah) Grill is now hiring for summer/fall season 2008. Bintliff’s is a fast paste restaurant supported by our resort ...</cite></p>
    <p>Anyone ever eaten fast paste? I suspect it may be brutal on the digestive system. </p>
    <p>Just for laughs,<br>
    Eileen</p>
