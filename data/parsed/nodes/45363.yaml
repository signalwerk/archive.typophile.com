      <p>I applied for, and got, a job in 1987 that required 5 years experience on a Macintosh computer. At that time only the original seven (I think) guys who invented the Mac would have qualified. </p>
      <p>What they really wanted was more than 5 years experience on a computer, with some Mac experience. I qualified.</p>
      <p>As for the first posting, don’t blame the advertisers. Newspapers paying $6 an hour for classified ad takers (no spelling skills required if you work for cheap) and no more proofreaders mean that errors like this are common.</p>
