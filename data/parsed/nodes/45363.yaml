      <p>Point taken, Don, but these ads weren’t in a newspaper. They were online, on websites with no “classified ad taker” to be a creative speller. Sadly, it’s ignorant (or illiterate) employers.</p>
      <p>Macintosh wasn’t released by Apple until 1984, so technically that requirement was impossible. But, had I not been 17 years old, I may have qualified for that job! My dad was a salesman and worked for Apple when I was a kid - in 1980, dad brought home an Apple II Plus for his study. I learned to write a little program that drew a happy face on the monitor. When I was 13, Dad got an Apple IIe, but I think I fell in love with Rick Springfield that year and the computer lost it’s appeal.</p>
