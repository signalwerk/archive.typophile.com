  html: |-
    <p>I’m a student attempting to develop a font, and I’ve — perhaps naively — included some contextual alternates as part of my design. It seems like what I’m doing is by the book, but maybe you can tell me what I’m doing wrong or point me to a thread I haven’t seen before that addresses this topic. </p>
    <p>The code I’ve been trying to use is this:</p>
    <p>feature liga { # Standard Ligatures<br>
     # Latin<br>
        sub c h by C_H;<br>
    } liga;</p>
    <p>I created a new glyph named C_H, but when I go the preview button in the OpenType panel, nothing happens when i type in ch.</p>
    <p>Also, one more question: how do I add more glyphs if there aren’t enough for my purposes? I know in OpenType, you can add more than you would ever need for most purposes, but how do i go about doing this? thanks for your help.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/19536" class="topic-previous" title="Go to previous forum topic">‹ Quark 7 Beta 2</a> <a href="/node/18896" class="topic-next" title="Go to next forum topic">Dominant Opentype ligatures? ›</a></div>
  html_clean: |-
    <p>I’m a student attempting to develop a font, and I’ve — perhaps naively — included some contextual alternates as part of my design. It seems like what I’m doing is by the book, but maybe you can tell me what I’m doing wrong or point me to a thread I haven’t seen before that addresses this topic. </p>
    <p>The code I’ve been trying to use is this:</p>
    <p>feature liga { # Standard Ligatures<br>
     # Latin<br>
        sub c h by C_H;<br>
    } liga;</p>
    <p>I created a new glyph named C_H, but when I go the preview button in the OpenType panel, nothing happens when i type in ch.</p>
    <p>Also, one more question: how do I add more glyphs if there aren’t enough for my purposes? I know in OpenType, you can add more than you would ever need for most purposes, but how do i go about doing this? thanks for your help.</p>
