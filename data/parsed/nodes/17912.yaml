    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/aqua.gif"></div><p></p>
      <p>As you can see, the Garamond fits with the text under the logo, too. The loose spacing indicates that it was artificially boldened like on the website.</p>
      <p>Regarding the Galliard oddities, not all cuts of Galliard are identical. The Bitstream version has a slightly more slanted A than the Linotype/Adobe version, not as slanted as this though. FYI, the Bitstream version is more "true" since Carter supervised its digitization. The spacing in the italics in the Linotype/Adobe version is not so good.</p>
