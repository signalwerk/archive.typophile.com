    html: <p>When I lived in Chicago I answered an ad for a graphic designer that turned out to be for Vivid Video, which was/is a major porn company. They were looking for someone to design slipcases for VHS tapes and the like. I interviewed with the office manager, and she said "after a while it's like auto parts." I didn't take the job, partly because I wouldn't know what to tell my mother, and partly because I didn't want to get as jaded and burned out as that office manager seemed to be.</p>
