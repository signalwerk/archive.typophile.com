      <p>I see a lot of ads for porn jobs here in DC. I think they’re up front about it because they usually want someone to do really low-class art for really freaky porn. Craiglist makes me very happy to be an in-house designer at a nice professional organization. </p>
      <p>The problem with porn is that it’s a context where tasteful design is usually bad design. It would be like doing design for Wal-Mart. That and I’m pretty sure it would be hard to get used to coked-up porno girls running around topless.</p>
