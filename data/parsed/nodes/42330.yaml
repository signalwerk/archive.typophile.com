    <p>Responded to a Craigslist ad this week for a graphic designer. Man on the phone sounded a little distracted and there were voices in the background, but he eventually said that he had a lot of projects on hand that I could work on, and I should come downtown and talk to him.</p>
    <p>So yesterday afternoon I went downtown to his office.</p>
    <p>The man I'd spoken to wasn't there and nobody knew where he was, but I talked to someone else.</p>
    <p>It came out in the course of our rather casual brief chat (he was typing on the computer and talking to other folks the whole time) that they were building porn sites, and wanted someone to help work on the front end for a database of "girls" available for various roles and purposes.</p>
    <p>I did wish I'd been told before going that it was a question of adult entertainment. I have no moral imperative against the existence of porn, but I've found that the atmosphere around this world is not good, tending towards a lack of respect and reliability (viz. making an appointment with me then forgetting it the next day).</p>
    <p>More CVs out today.</p>
