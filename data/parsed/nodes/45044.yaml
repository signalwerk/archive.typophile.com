    <p>I’m having to build a few “ccmp” glyphs for setting Kiowa. I seem to remember that the order of specifying diacriticals in Unicode is “inside out”, starting with the top.</p>
    <p>OK, no problem, the name for an “oh” with a macron &amp; and acute above is, for example,</p>
    <p>uni006F03040301 (or shorter, uni01010301)</p>
    <p>But when you add the macron below as well, is it preferable to work “inside out” regardless of position, so the glyph name would be</p>
    <p>uni010103310301 (omacron, macronbelow combining, acute combining),</p>
    <p>or take care of the top first, e.g.</p>
    <p>uni010103010331 (omacron, acute combining, macronbelow combining)</p>
    <p>I suppose at some level it doesn’t mater, but if there is a convention I’d like to follow it, because for all I know, either the text file or the PDf may be repurposed.</p>
    <p>TIA</p>
    <p>Charles</p>
