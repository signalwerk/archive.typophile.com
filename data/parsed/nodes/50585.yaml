    <p>Typerepublic font foundry proudly announces the releasing of its new website and invites you to visit it at: <a href="http://www.typerepublic.com" title="http://www.typerepublic.com">http://www.typerepublic.com</a></p>
    <p></p><div class="imageWrap"><img src="/files/typerepublicPicture-2_5857.jpg"></div><p></p>
    <p><a href="/wiki/Typerepublic" class="wiki">Typerepublic</a> is a small independent type <a href="/wiki/foundry" class="wiki">foundry</a> based in Barcelona, Spain. It offers custom and retail typefaces with a local flavour (as far as the global world allows it) and high quality standards (according to technology).</p>
