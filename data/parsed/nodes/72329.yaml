      <p>This seems like a few familiar things mixed together, but it could be a single font I just can't think of at the moment. It's close to <a href="http://www.fonts.com/FindFonts/Detail.htm?pid=204170&amp;/cgi-bin/MsmGo.exe?grab_id=0&amp;page_id=8236&amp;query=ELROY&amp;SCOPE=Fonts" rel="nofollow">Elroy</a> and there is also some resemblance to <a href="http://www.fonts.com/FindFonts/Detail.htm?pid=418117&amp;/cgi-bin/MsmGo.exe?grab_id=0&amp;page_id=35933&amp;query=PIKE&amp;SCOPE=Fonts" rel="nofollow">Pike</a> (for the 's' maybe).</p>
      <p>Possibly some outline manipulation to make the 'm' and 'n' uneven, but something about those letters seems familiar too...</p>
      <p>- Mike Yanega</p>
