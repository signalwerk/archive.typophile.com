    html: <p> I don't like the Roman very much, but the Italic is truly delish. BTW, if it's true that MSL uses something called "gravure" for printing (where the text is rendered like pictures, not text), then if I ever had the good fortune of making a font for them, I wouldn't spend too much time on that last bit of quality... <br> <br>hhp </p>
