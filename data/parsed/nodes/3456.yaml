    html: "<p>The slab serif is interesting, but I can't say that I like it any better than the Joanna. But the all-caps made me think of PMN Caecilia, at first, which I do like a lot. I agree, the italic is nicely realized for the style -- resembles FB's Berlizio Italic. <br> <br>Hrant, it's not quite true that gravure renders text like pictures -- at least, it's not like what you might think in reference to offset litho halftones.  I don't know for sure, but I'd bet that the rasterization is just as high-res as rendering for offset. But the gravure process is intaglio: the ink is held in small depressions on the metal plate. Intaglio printing does not handle flat solids well. Solids are created through closely clustered depressions, sort of like very dense stippling. This is what causes the \"fuzzy\" edges.  <br> <br>But, the magazine is printed in a combination of offset for some sigs and gravure for others. So, if you ever design a face for them (<i>yeah, right</i> -- maybe the Armenian edition? ;-) then you'd better go ahead and polish it off. <br> <br>-- K.</p>"
