    <p>Last week I downloaded a copy of the Iraq Report from this Web site: <a href="http://www.usip.org" title="http://www.usip.org">http://www.usip.org</a></p>
    <p>Upon opening the document, I noticed right away that the text was set in a sans serif face. I opened the doc in Acrobat Professional, highlighted some text, and checked the properties. Sure enough, the typeface was supposed to be Times New Roman MS. Since the fonts were substituted, all bold and other shifts in weight were ignored. I contacted the Web site's webmaster about 5 days ago, making a case for embedding the fonts and reposting the document. </p>
    <p>I just got an email back with the report attached and a thanks for my concern.</p>
    <p>Well, the same problem exists in this file as well. </p>
    <p>Please forgive my naivete on the matter, but is this a problem involving their lack of embedding, or is it a font file format issues? I really don't know what format TNR-MS is, but I am on a Mac, so i'm wondering if the issue really is about compatability.</p>
    <p>If anyone has any thoughts on this that would clear things up for me I would really appreciate the help.</p>
