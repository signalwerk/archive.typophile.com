    html: |-
      <p>The typeface Genath reminded me of something better-known, and I suspect the person posting the query had thought it was one of the common standby typefaces listed in the normal references like Perpetua, Garamond, Lutetia, and so on.</p>
      <p>In looking for more information, I came across <a class="freelinking external" href="http://new.myfonts.com/fonts/nonpareille/stockmar/ Stockmar" rel="nofollow">http://new.myfonts.com/fonts/nonpareille/stockmar/ Stockmar</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/type-together/maiola/ Maiola" rel="nofollow">http://new.myfonts.com/fonts/type-together/maiola/ Maiola</a>... so many beautiful typefaces go unnoticed.</p>
      <p>However, I've found <em>another</em> typeface that has the same kind of unusual italic "r" as this one. Starling. (Obviously this isn't Starling; the lowercase "a", for example, is much too much an oldstyle one.)</p>
