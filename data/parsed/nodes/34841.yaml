  html: |-
    <p>This is a logo which I am currently developing, for small “boutique” graphic design studio. It is intended to be very regular (common) looking -  at first glance, which with careful observation will reveal it’s complexity and beauty. It must look really “tricky” (if I may express myself that way:), because the people working there are professionals, hidden behind a firm name, generally meaning – unprofessional (something like anti-hero design agency).<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/diletant_prev_5476.jpg"></div><p></p>
    <p>I’m posting it for critique and suggestions, which may add little perfection – it must look really twisted, tricky and in the same time amazing. </p>
    <p>I’am currently having a very hard time constructing the latin version… so any comments and suggestions….<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/diletant_prev2_4434.jpg"></div><p></p>
