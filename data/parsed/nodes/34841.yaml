    html: <p>The lettering of the word Dilettante is very nice, but then the next line seems wrong. The typeface, the word spacing (too much), the line spacing (too little). I'd try adjusting those things and even pushing the secondary line farther to the right, don't have it cling to the same guide as the main line.</p>
