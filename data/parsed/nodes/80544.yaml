    votes: null
    html: <p>Thanks for the info, I only need  to create 10 uppercase letters so I was hoping I could do this in Illustrator – I've never used Font Lab before.</p>
  - id: 457467
    user: 13099
    date: 2011-03-28T09:01:00
    date_raw: 28 Mar 2011 — 9:01am
    votes: null
    html: <p>Your best option is probably to redraw the letters as single strokes &amp; then either apply a dotted line to them or put dots at the end of your strokes &amp; use the blend tool (replacing the spine with your strokes). I'd opt for the latter option 'cause it tends to give better results &amp; you can still play around with the specified number of steps used.</p>
  - id: 457501
    user: 33610
    date: 2011-03-28T11:37:00
    date_raw: 28 Mar 2011 — 11:37am
    votes: null
    html: |-
      <p>If your only doing ten glyphs, I'd recommend just biting the bullet and doing it by hand.<br>
      I can't see you getting happy results from a brush.</p>
      <p>Intersections like the bar on the A, and curves like the S will require some optical adjustment to feel even.<br>
      Try to use maths to your advantage too, pick a good cap height that will divide neatly into the dimensions of your circles.</p>
  - id: 457524
    user: 13099
    date: 2011-03-28T13:59:00
    date_raw: 28 Mar 2011 — 1:59pm
    votes: null
    html: <p>The intersections are the main reason I suggested using the blend tool. You can put dots at all intersections &amp; fill the strokes with the best amount of steps.</p>
  - id: 457602
    user: 33610
    date: 2011-03-29T05:52:00
    date_raw: 29 Mar 2011 — 5:52am
    votes: null
    html: <p>I don't disagree - I just think the sake of 10 glyphs, doing it by hand and knowing you have a consistent pattern of distribution is probably the most efficient method.</p>
