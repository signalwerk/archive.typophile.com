      <p>They seem to be related. I'm not sure of the exact font, but two names from Flat It Type Foundry-Ryoichi Tsunekawa:</p>
      <p>HTOsteria -- has the M, k and r designs with different strokes. </p><div class="imageWrap"><img src="http://typophile.com/files/vik3_4416.jpg"></div><br>
      HTPasticceria -- the M comes from this one(?) and the r a i c. <div class="imageWrap"><img src="http://typophile.com/files/vik4_3971.jpg"></div><p></p>
      <p>There are likely "Pro" versions which will match.</p>
