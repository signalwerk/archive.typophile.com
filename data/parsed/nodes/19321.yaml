      <p>Hrant, are you familiar with Fernand Baudin's idea that one can't be truly literate in this age without some understanding of how to use typography? It's a little much to hope that typographic education will ever become general. </p>
      <p>An aside: My wife's an English teacher. I wonder sometimes if her students who have limited interest in reading or slight learning disabilities might be harmed by poor typography - can bad type and arrangement make an already difficult task almost impossible for them?</p>
