    <p>My 12-year-old won his middle school science fair with a font <a href="/wiki/legibility" class="freelinking" rel="nofollow">legibility</a> project. He evaluated viewers’ responses to eight fonts – four <a href="/wiki/sans%2520serif" class="freelinking" rel="nofollow">sans</a> and four <a href="/wiki/serif" class="freelinking" rel="nofollow">serifs</a> – at simulated road sign distances. The font size was chosen to be just legible for the average person at ten feet, the test distance.</p>
    <p>The results – from most to least legible: <a href="/wiki/Highway%2520Gothic" class="freelinking" rel="nofollow">Highway Gothic</a>, <a href="/wiki/P22%2520Underground" class="freelinking" rel="nofollow">P22 Underground</a>, <a href="/wiki/Verdana" class="freelinking" rel="nofollow">Verdana</a>, then <a href="/wiki/Arial" class="freelinking" rel="nofollow">Arial</a>, <a href="/wiki/Times%2520New%2520Roman" class="freelinking" rel="nofollow">Times New Roman</a>,  and <a href="/wiki/Georgia" class="freelinking" rel="nofollow">Georgia</a>  - all roughly equal, then <a href="/wiki/Palatino" class="freelinking" rel="nofollow">Palatino</a>, and last was <a href="/wiki/Goudy%2520Oldstyle" class="freelinking" rel="nofollow">Goudy Oldstyle</a>.</p>
    <p><a href="/wiki/point%2520size" class="freelinking" rel="nofollow">Point sizes</a> were adjusted so that <a href="/wiki/cap%2520height" class="freelinking" rel="nofollow">cap heights</a> of the different faces were equal. Test text (half all caps, half sentence case) was a shortened version of the “Jaded zombies” <a href="/wiki/pangram" class="freelinking" rel="nofollow">pangram</a> with some numbers added.</p>
    <p>His conclusions – sign makers know what they are doing, sans is best for signage, <a href="/wiki/x-height" class="freelinking" rel="nofollow">x-height</a> is important. Hardly groundbreaking, but his methods apparently were sound. Yeah, I helped.</p>
