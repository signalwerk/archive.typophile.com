      &gt; difficult task almost impossible for them?</p>
      <p>I think that -as with "normal" readers- it's a matter of thresholds<br>
      being crossed over long periods of time. Sub-optimal design might not<br>
      present an obvious and immediate impediment to reading, but it slowly<br>
      wears away at a reader's stamina and patience; and once in a while,<br>
      there will be a <cite>snap</cite> - and then yes, you lose the reader, even though<br>
      it might not be obvious why.</p>
