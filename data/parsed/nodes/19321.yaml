      <p>The familiarity question is interesting and one we had thought of.  I'm sure Hrant has a well-informed opinion on that. Terminal Design has some really interesting legibility sfuff at <a href="http://clearviewhwy.com" title="http://clearviewhwy.com">http://clearviewhwy.com</a>. Their new signage font Clearview is purported to be one of the most legible ever.</p>
      <p>Next year we're looking at hooking subjects up to a lie detector-type machine to see if there are measurable stress differences when the subjects read extended text passages in different fonts, spacings, or sizes - good vs. bad typography.</p>
