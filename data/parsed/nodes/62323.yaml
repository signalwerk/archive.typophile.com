      <p>Hey, Bez!</p>
      <p>My two cents:</p>
      <p>I would shorten the final stroke on the tail of the y just a hair. As it is, it forces the eye back to the left into the white-space too much, and makes the letter seem bottom heavy.</p>
      <p>Also, you might want to move the star a tiny bit to the left sof that the visual center of the i aligns with the axis of the star.</p>
      <p>Very good!</p>
      <p>Ciao!<br>
