    votes: null
    html: |-
      <p></p><div class="imageWrap"><img src="/files/yllilogo3_6709.png"></div><br>
      Yes the slanted star is better!<br>
      I wanted the ball terminal to 1) compensate the weight of the star (but it just creates confusion) and 2) give that “exclusive” and elegant feel i was looking for: this logo is for a chauffeur agency, i wanted to give a hint about cars and limos (being the type modular, “edgy” and slanted, with very long ascenders and descenders) without any aggressive feel.<p></p>
      <p>As you can see, I have modified the terminal: this way, it looks much more coherent and armonious.<br>
      There are two different weights because I felt like a stronger baseline was needed.</p>
      <p>By the way, Ylli means star in Albanian.<br>
      And thanks for your time!</p>
    html_clean: |-
      <p></p><div class="imageWrap"><img src="/files/yllilogo3_6709.png"></div><br>
