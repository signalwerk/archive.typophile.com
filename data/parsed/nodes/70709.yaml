    <p>This is a logo for a personal project that i hope encourages friends/colleagues and students to draw more.<br>
    At the moment its a small group of us that use to draw regularly but have lost touch with the art form because of our careers. Even as  designer its very hard to find time to draw simply for pleasure and for sharing.</p>
    <p>The logo began as Calgary from Veer but has been tweaked based on how I've tried to recreate it by hand organically.<br>
    I hope you like it and can give me some feedback. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sktchy_5944.png"></div><p></p>
