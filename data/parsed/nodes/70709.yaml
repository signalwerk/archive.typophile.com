      <p>I very much enjoyed the playoff between the "straight" parts of the descender of the Y and the loopy curviness of the rest of it. Since I just arrived here (via a Tweet, no less), I've got to say that the version in the original didn't bother me at all ... but if it had to evolve, this last evolution is really working for me. The nature of the line is organic enough that its straightness is a pleasant contrast rather than a discordant visual note.</p>
      <p>With the new thickened tail on the end of the loop of the Y, I think its right where it needs to be. I enjoy looking at it.</p>
      <p>WRT to the rest, as Tomi says, you're not making a font. The unnevenness in the bottom of the miniscule "h" harmonizes very nicely with the rest of the design; I enjoy its quirkiness. It also seems to echo the design of the miniscule k, though, because of the way everything connects, it's not obvious.</p>
      <p>I think it nifty!</p>
