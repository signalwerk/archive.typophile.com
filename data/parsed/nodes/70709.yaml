      <p>I am sure there are Alex. Photoshop has a brush tool, as does Fontographer and I am sure many others. But, do you know the reason after 29 years I still start with ink on paper, it is not forced, it is prone to happy accidents and it is truer! I think that the digital age, people drawing on screen, has produced ill informed letters and, well, to be honest, sub par forms. The true nature of the calligraphic stroke is being lost to people who "draw" and/or digitize. </p>
      <p>Years ago when I produced Pouty, the final nerd in the process changed a couple of the forms. I called and asked why... her response was a pen could not do that. I asked her if she had ever even held a pen and she said no. At that point I told her if she changed one little thing I would come up there and rip the font from the foundry and... and enough said.</p>
      <p>But keep experimenting with the digital process and I will with ink.</p>
      <p>Sorry<br>
      Michael</p>
