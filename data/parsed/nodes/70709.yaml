    html: |-
      <p>Jonathan (because you seem thoughtful) and Pentapus (who posed the inquiry)</p>
      <p>I spend my days with brush and pen... not a "drawing pen." The vectorized form is the final stage for me... but as a result of honing the forms beforehand it is simply a digital process.</p>
      <p>I stayed out of this as I can sometimes become overbearing when those who haven't a clue chime in and impose their ill informed opinions.</p>
      <p>You have to understand the characteristics of what the individual tools "lay down" as a result of their very architecture. This piece is most definitely brush inspired so why not start with a brush, then you can chisel away at the unwanted. Your weights are all over the place, but the first "y" was fine. Turn it upside down and paste it to the wall and live with it for a couple of days... then you will see what is right or what is irking you. Look for holes, light spots, black masses etc.</p>
      <p>All handwriiten fonts are not terrible... you just have to be judicious with what you buy (because there is a lot of junk out there) and how you use it. I once encountered a font that I absolutely abhored but then saw it used in a careful way. It was stunning and I was surprised. Hell I would have bought it as a result of the creative directors careful use of it in a project.</p>
      <p>Anyway, since it is your project, take your time.</p>
