      <p>Sorry, that was a horrible explanation. Let me try again:</p>
      <p>When I first read the post, I thought pK touched on a really interesting idea, the importance of occasionally removing yourself from professional constraints to relax, draw something, and remember why you enjoy what you do. I read the "Sktchy" layout as an encouraging example, "this is what I did, now you try." I hadn't intended to comment, but I happened to scroll down and saw some of the previous responses. I expected to see people posting their own experiments, maybe discussing the possibilities of hand rendered letterforms, but I just felt like I was in a Creative Department meeting, and it was disappointing. I have been working with psychedelic typography a lot recently, and, in the process, I have spent a lot of time analyzing every aspect of creating hand-rendered compositions that are interesting and retain structure and visual continuity without being repetitious (which is where the graffiti and handwritten font comments came from). I guess I took issue with the idea that, with the comments I read, it seemed like no one took the time to draw anything, they just vectored alterations to the Y form. Having discussed hand-rendering with pK in the past, I felt like there was more substance to the idea, especially when applied to web graphics, because no one really does hand-rendering for web and it seems to have become a neglected resource. I agree that it is not always appropriate, but, in the event that it is, it can be extremely tedious if you're out of practice (which I was going into this project), thus the importance of trying to remain in the habit of drawing, even without a specific purpose. That is what I was trying to say before; my apologies for the way it came out the first time.</p>
    html_clean: |-
