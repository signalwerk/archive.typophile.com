    html: <p>Basically the effect he is trying to achieve is "waisting." It is very evident in many of the advanced lettering artists' forms. It is rather difficult to control without the complete understanding of the tool and much practice. Most of the time it is best used with restraint (calligraphers work)  but it is very evident, and effective, in many sign painters work. Latitude with the technique is dependent on many factors,  but most often, in my opinion, it is size. Without being preachy that is what I was trying to say above.</p>
