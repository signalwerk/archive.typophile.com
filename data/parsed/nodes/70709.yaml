      <p>Not to hijack the thread, but -</p>
      <p>Michael, I wonder if you know of any software that emulates brush/pen movement for the purpose of type design? What I mean is something like this - I draw a skeleton of a letter, which is an approximation of a path of a tip of a brush. The software then would trace the brush along the path <em>modifying its shape depending on various parameters</em> such as the curvature and inclination of the path. So, for example, sharper bends would be constructed with a brush shape than is different from that of long straight segments. </p>
      <p>I had an idea of writing a tool like this just to play and experiment with, but I'd rather not to if it already exists. TiA.</p>
