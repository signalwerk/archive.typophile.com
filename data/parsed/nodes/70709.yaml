    html: "<p>All of this feedback is great: insightful comments, re-worked samples, an educated critique. But I feel like everyone is missing the point. We all know that most handwritten fonts are terrible; the second you realize that all your Es look exactly the same (and so on), it is very easy to abandon said fonts and, by extension, hand rendered letterforms. But, in the end, it doesn't matter how the Y looks; if you were ever to use it, you would surely alter it to fit the vibe of your design. You could render the font in Illustrator, add a finely tuned vector to make that Y just right, but you would still be neglecting the other 5 letters. On the other side, if you were to use the \"Sktchy\" lettering as a reference, a hand rendering would be cognizant of structure as well as a client's preferences while maintaining the fluidity and seemingly inconsistent nature of handwriting. The resulting piece is technically and visually sound. By definition, graffiti is without intended structure, but if you were to apply a structure to it, you bridge the gap and open yourself up to a very marketable style. Thus, we should spend more time drawing and less time being robots...</p>"
    html_clean: "<p>All of this feedback is great: insightful comments, re-worked samples, an educated critique. But I feel like everyone is missing the point. We all know that most handwritten fonts are terrible; the second you realize that all your Es look exactly the same (and so on), it is very easy to abandon said fonts and, by extension, hand rendered letterforms. But, in the end, it doesn't matter how the Y looks; if you were ever to use it, you would surely alter it to fit the vibe of your design. You could render the font in Illustrator, add a finely tuned vector to make that Y just right, but you would still be neglecting the other 5 letters. On the other side, if you were to use the \"Sktchy\" lettering as a reference, a hand rendering would be cognizant of structure as well as a client's preferences while maintaining the fluidity and seemingly inconsistent nature of handwriting. The resulting piece is technically and visually sound. By definition, graffiti is without intended structure, but if you were to apply a structure to it, you bridge the gap and open yourself up to a very marketable style. Thus, we should spend more time drawing and less time being robots...</p>"
