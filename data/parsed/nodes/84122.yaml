    <p>Good morning, everyone! </p>
    <p>I'm a freelance graphic designer. I currently work with a small publisher, doing all of their typesetting for their romance titles. I have been using Adobe Garamond Pro, and have been pleased with the results. It is readable and relatively neutral looking.</p>
    <p>I'm now working with a second publishing house, also romance novels. They are currently using Book Antiqua for the body of the novel. I personally think this is an awful choice. I want recommend some alternatives, but I don't want the books to end up looking identical to the ones I design for the other publisher. Some font choices I have been considering are Kepler, Berling, and Caslon. I'm looking for a Pro font that is very readable and relatively neutral in appearance, particularly for the quotation marks (one of the things I hate about Book Antiqua). I also don't want anything that stands out as very modern, because many of the books are historical romance (which possibly explains the Book Antiqua choice...)</p>
    <p>So, are there any recommendations? What is your favorite font for setting long pieces of text?</p>
