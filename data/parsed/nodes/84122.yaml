    html: <p>If you are considering a Caslon, check out my <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" rel="nofollow">Williams Caslon Text</a>. It will look classic, but have warmth. The swash caps might work to add a note of romance to headings. For titles you can pair it with Big Caslon, which a number of people have done.</p>
