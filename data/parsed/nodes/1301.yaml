    date_raw: 30 Nov 2003 — 1:22am
    votes: null
    html: <p>What you need is a one-pixel sep between characters to make your 3-value clumps evident. Nice as the wavy line is, it becomes WinAmp-irrelevant in quantity, even the (extra-clever) bold version. Do you have a version including letter AND graph in one glyph? cause that would be crazy valuable, white coats be darned. <br> <br>also, to paraphrase TW, Unibody is dopetastic. <br>I do NOT recommend an italic because for pixel characters this requires an overlap of approx. 1 px which would further wipe out the graph fidelity. But hey, it's your brain. <br> <br>'spect, <br>-chris</p>
