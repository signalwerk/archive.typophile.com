    html: <p>Caslon 540 is closest, with less contrast than Big Caslon. Adobe Caslon has less than 540. My Williams Caslon Text <a href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" title="http://www.fontbureau.com/fonts/WilliamsCaslonText/">http://www.fontbureau.com/fonts/WilliamsCaslonText/</a> has still less. The bold on mine, which has higher contrast than the regular, will work at bigger than text sizes.</p>
