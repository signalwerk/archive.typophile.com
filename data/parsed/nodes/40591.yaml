    <p>Hey everyone! I know this is almost certainly hand-drawn lettering, but if anyone knows of  a font version of this or has any other information, I would be extremely grateful!</p>
    <p></p><div class="imageWrap"><img src="/files/identifont_4949.gif"></div><p></p>
    <p>It’s a left-leaning modern script from the cover of an old theater playbill from the 1930s.</p>
    <p>Thanks for looking, and have a beautiful day.</p>
    <p>Howard</p>
