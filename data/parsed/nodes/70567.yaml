      <p>I go into this a little bit in the PDF for Changeling Neo: </p>
      <p><a href="http://www.marksimonson.com/fontspecimens/ChangelingNeoSpecimen.pdf" title="http://www.marksimonson.com/fontspecimens/ChangelingNeoSpecimen.pdf">http://www.marksimonson.com/fontspecimens/ChangelingNeoSpecimen.pdf</a></p>
      <p>Basically, the Terminator logo appears to have been based on a VGC font called China (the same font that my Changeling was based on). I've been able to find out nothing about the designer of China except for the name "M. Mitchell". The Terminator logo has a different "A" and "R" from China. I included a similar "A" in Changeling and Changeling Neo. I have no idea who designed the Terminator logo.</p>
