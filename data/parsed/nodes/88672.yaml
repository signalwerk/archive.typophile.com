  html: |-
    <p>What's the name of the body matter font of the 1941 Dover publ. print of D'Arcy Wentworth Thompsons "On Growth and Form"?</p>
    <p>In combination with the strict page cramming layout of the book this font adds an airiness that makes this dense text look and be fluently readable.</p>
    <p>I guess it's a classic, but what is the name of this font?</p>
