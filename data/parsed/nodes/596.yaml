  html: "<p> The new book honoring Hermann and Gudrun Zapf is <br>wonderful. (sidenote:  And it supports my theory of <br>husband and wife being lovers of the shapes of letters.) <br>   Anyway, as some of the people on this list know me <br>from school I thought it would be fun to admit that as I <br>was looking at the samples of Optima within the book I <br>found myself actually liking the face. What happened to <br>it when it became digital? The samples in the book are <br>much less harsh and the contrast between thick and thin <br>is less obvious. I'm assuming that Hermann was involved <br>with the digitization, is this incorrect? </p>"
