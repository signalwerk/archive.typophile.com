    html: <p> The digital age discounts the relevance of *lack* of definition. Science unfortunately lends itself to naïveté, but the fact that humans "fill in" missing information in a uniquely rewarding way is no magic. <br> <br>Practical consequence of this? <br>I believe that if loosen the laser's focus on a imagesetter by just a smidgen, readability will increase. <br> <br>hhp </p>
