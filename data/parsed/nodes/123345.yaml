    <p>Hi everybody,</p>
    <p>I am looking for the name of the font below. It’s for a research on dynamic sans-serif fonts, sth like Brezel Grotesk, Founders Grotesk Condensed, etc.</p>
    <p>Even if you can’t knock off this one, I am glad for any input for my ongoing research. So if you have other references like the ones already mentioned above, please, don’t hesitate!</p>
    <p>Btw: grafik.net is using the font I am looking for in their newsletter!</p>
    <p>Many thanks to all of you!</p>
    <p>Best, Tobias.</p>
