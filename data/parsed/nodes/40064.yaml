  html: |-
    <p>No, seriously. Microsoft Word version 11.3.5 under OS X (Leopard) 10.5.1, is displaying and printing common ligatures (fi, fl, ffl, etc) for OpenType -- not AAT -- fonts. Not entirely consistently, but like 90% of the time. But it's not spacing for them. So you get the ligature and then a large gap before the next letter.</p>
    <p>I can post screenshots if you don't believe me, but try it for yourself.</p>
    <p>Does anyone (a) have any idea what's going on; or (b) know who I should be filing a bug report with?</p>
