    html: |-
      <p>Yes, MS Word uses ATSUI but they cache metrics and alter the glyph advances via the ATSUI low level callbacks.  I believe there's a MS bug already but I'll search the DB.  Looks like TextMate has the same issues.  Bottom line is, I don't think this is a problem with the OT layout engine in Leopard but I'll double check nevertheless.</p>
      <p>Dan</p>
