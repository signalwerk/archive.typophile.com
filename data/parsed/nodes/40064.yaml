    html: "<p>I have some similar problem with Textmate (texteditor), I use my own monospace font (OT font with ligature feature: fi, fl, ff) and the systems text engine substitutes the glyphs but the Program is not aware of the change in glyph count and places the cursor at the wrong position. This behavior started with 10.5</p>"
