    html: |-
      <p>The OpenType specification does not permit the "kern" table in PostScript-flavored OpenType fonts, though the Apple specification does. But this obviously is not the problem since FontBook permits some OTF fonts with a "kern" table but chokes on others. </p>
      <p>FontBook has been known for false-flagging many situations, and this seems like one of them. </p>
      <p>I believe this is an Apple problem, not a problem with your font. You might want to install the Apple FontTools from<br>
      <a href="http://developer.apple.com/textfonts/Fonttools/" title="http://developer.apple.com/textfonts/Fonttools/">http://developer.apple.com/textfonts/Fonttools/</a><br>
      and check your font with ftxvalidator, and see what it reports. </p>
      <p>Regards,<br>
      Adam</p>
