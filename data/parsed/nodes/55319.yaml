    html: <p>OT-CFF fonts should not have a 'kern' table. The kerning in OT-CFF fonts is handled by the 'kern' feature found in the 'GPOS' table.</p>
    html_clean: <p>OT-CFF fonts should not have a 'kern' table. The kerning in OT-CFF fonts is handled by the 'kern' feature found in the 'GPOS' table.</p>
