    <p>FontBook in Mac OS 10.5 is reporting an improperly structured kern table upon installation of Aviano. I recently overhauled the entire family, including the kerning, and it is now based off of a Multiple Master. All font generated from the master are affected. Class based kerning is used extensively, and I expand kerning upon export. The export expands the kerning to about 1000 pairs. Microsoft Font Validator reports no issues, and Fontlab reports no issues with the structure upon export, and the Kerning Assistance dialog reports no problems. I have filed reports with Fontlab.</p>
    <p>Is anyone familiar with this issue? What additional information can I provide to help solve the issue?</p>
    <p>Thank you for the help,</p>
    <p>JDooley<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Picture 8_3633.png"></div><p></p>
