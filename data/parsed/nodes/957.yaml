    date: 2003-08-19T09:39:00
    date_raw: 19 August 2003 - 9:39am
    votes: 0
    html: '<p>Kathrin: Your font looks interesting, but it’s diﬃcult to tell what’s going on at the size you posted. I see a number of inconsistencies, but perhaps they are intentional. Are you presenting alternate characters in “Sprue Regular”? My initial suggestions would be to a) do some caps, b) give the characters some air (they are way too tight), c) settle on a basic character set for “Regular”, then expand from there. <br><br>Another thought would be to concentrate on the basic letter forms in “Sprue Less”, then adapt it later to “Regular”. <br><br>My ﬁrst thoughts are that you are too scattered. Try to simplify your processes. It will take a lot of eﬀort, but keep at it and you may be surprised at how fast it starts taking shape. <br><br><span class="caps">PS</span>. I am especially fond of the lc&nbsp;“q”.</p>'
    html_clean: '<p>Kathrin: Your font looks interesting, but it’s diﬃcult to tell what’s going on at the size you posted. I see a number of inconsistencies, but perhaps they are intentional. Are you presenting alternate characters in “Sprue Regular”? My initial suggestions would be to a) do some caps, b) give the characters some air (they are way too tight), c) settle on a basic character set for “Regular”, then expand from there. <br><br>Another thought would be to concentrate on the basic letter forms in “Sprue Less”, then adapt it later to “Regular”. <br><br>My ﬁrst thoughts are that you are too scattered. Try to simplify your processes. It will take a lot of eﬀort, but keep at it and you may be surprised at how fast it starts taking shape. <br><br><span class="caps">PS</span>. I am especially fond of the lc&nbsp;“q”.</p>'
