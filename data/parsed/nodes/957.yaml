    date_raw: 19 Aug 2003 — 7:39am
    date: 2003-08-19T07:39:00
    votes: null
    html: "<p>Kathrin: Your font looks interesting, but it's difficult to tell what's going on at the size you posted. I see a number of inconsistencies, but perhaps they are intentional. Are you presenting alternate characters in \"Sprue Regular\"? My initial suggestions would be to a) do some caps, b) give the characters some air (they are way too tight), c) settle on a basic character set for \"Regular\", then expand from there. <br> <br>Another thought would be to concentrate on the basic letter forms in \"Sprue Less\", then adapt it later to \"Regular\". <br> <br>My first thoughts are that you are too scattered. Try to simplify your processes. It will take a lot of effort, but keep at it and you may be surprised at how fast it starts taking shape. <br> <br>PS. I am especially fond of the lc \"q\".</p>"
