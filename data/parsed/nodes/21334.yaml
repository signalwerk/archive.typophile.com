      <p>Nothing wrong with loving LG. It's a lovely, warmer alternative to Courier. There are many cuts of <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=Letter%20Gothic" rel="nofollow">Letter Gothic</a>, and most differ slightly.</p>
