    <p>I’m getting rid of some things that were once thriving contributors to my studio but are now just dead weight. One thing that will never go away is my Precision Type Reference Guide. I only hope I don’t completely wear it out. However I have two of the Precision Type Fontlink CDs in Macintosh version. Is there any use for those at all?</p>
