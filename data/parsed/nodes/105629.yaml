      <p>No, the <em>real</em> root of the problem is that Helvetica is a de facto standard typeface, yet (56 years after its design!) it is proprietary.</p>
      <p>Can one design a font to seriously compete with Helvetica without being taken to court for "copying" Helvetica? In other words, you want it to be enough like Helvetica to work in the same sort of places people use Helvetica, but not be too much like Helvetica, because then that would be stealing.</p>
      <p>Anyway, if you're going to steal a font, at least steal one in which capital I and lowercase l don't collide. (Who was Kim Jong the Second?) And while you're at it, check that the digit 6 is not a wannabe 8.</p>
