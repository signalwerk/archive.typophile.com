    <p>Why are type foundries more intent on catching people who use pirated fonts rather than catching those make them available in the first place. There is a website dedicated to providing free Helvetica and Gotham fonts, why dont they do something about that rather than catching some lone, broke designer. Yeah it is illegal but doing something about it is ineffective and inefficient. Why not just try stopping the websites that distribute these fonts for free. Maybe you will scare some people who use these fonts but that is it about it. You just wasted a whole lot of time pursuing one offender and what are you gonna get out of it ? Pretty much nothing. So why not try to cut off the root of this problem. </p>
    <p>And just so it is known, I appreciate the time and hard work type designers  put into typefaces but why not try better ways to protect your rights. What do you guys think? Any suggestions on how to stop this.</p>
