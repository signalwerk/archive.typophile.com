      <p>&gt;Why are type foundries more intent on catching people who use pirated fonts rather than catching those make them available in the first place.</p>
      <p>It's purely economics. Graphic designers and their clients are infinitely more likely to cough up some fees compared to the operators of the off-shore warez site, especially if the alternative is damage to their reputation or the threat of a law-suit.</p>
