    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Books" class="freelinking" rel="nofollow">Books</a> : Thinking with Type</strong></p>
    <p>By <a href="/wiki/Ellen%20Lupton" class="freelinking" rel="nofollow">Ellen Lupton</a>, published by <a href="/wiki/Princeton%20Architectural%20Press" class="freelinking" rel="nofollow">Princeton Architectural Press</a> in 2004.</p>
    <p><cite>Theory + practice, how + why: a new approach to typographic education.</cite></p>
    <p>Part of <a href="/wiki/Princeton%20Architectural%20Press" class="freelinking" rel="nofollow">Princeton Architectural Press</a>' <a href="http://www.papress.com/listpage.tpl?cart=1096071391336982&amp;ref=[ref]&amp;action=seriessearch&amp;__searchfield=Design%20Briefs" rel="nofollow">Design Briefs</a> series of books, <a href="/wiki/Thinking%20with%20Type" class="freelinking" rel="nofollow">Thinking with Type</a> also has a comprehensive <a href="http://www.thinkingwithtype.com" rel="nofollow">companion website</a> that contains essays, examples and practical information about type and typography as well as <a href="http://www.papress.com/thinkingwithtype/teachers/teacher_home.htm" rel="nofollow">an example syllabus</a> for teaching typography to students.</p>
    <p>Reviews: <a href="http://typographi.com/000917.php" rel="nofollow">Typographica</a></p>
