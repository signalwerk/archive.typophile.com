      <p>Faux-alphabet faces are visual puns -- the worse they are, the better they are. Step right up Ladies and Gentleman and see the Latin typeface that looks like Inuit/Hebrew/Chinese! Harmless stuff, really, because never more than a novelty, display faces of limited application. </p>
      <p>The problem is in providing a serious rationale, which is a necesssary part of the commission here; any PR rationalizing a groaner is inherently pretentious (a hazard for typeface rationales in any case), and unless handled with extreme tact will run into PC difficulty, which is what's happened. chester is spot on. </p>
      <p>Not the same situation as JT's Shaker, also inspired by cultural simplicity, because no alphabet "mockery" was involved in that.</p>
