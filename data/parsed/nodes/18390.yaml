      <p>Re the x-height problem: there are two kinds of bilingual document.<br>
      One is where the same content is repeated in side by side columns, translated.<br>
      The other is where a word or two of a foreign script is inserted into the text.</p>
      <p>A common x-height is not required for the first, and as Hrant argues, may give undue weight to one language over the other.</p>
      <p>The requirement for the latter is most definitely to have a common x-height across scripts, if the typographer is going to the trouble of using one typeface.</p>
      <p>How can this situation be resolved?</p>
      <p>There is sufficient variety of x-height types in Latin script that the Latin glyphs can be tailored to the requirements of the other script.</p>
      <p>So a multi-script typeface should probably have x-height options for Latin script. Big x-height for use with Cyrillic, small for use with Armenian.</p>
      <p>However, in general perhaps bilingual typography is not an important reason for multi-script typefaces, which exist to make a typeface available to different alphabet users, and will rarely be used in bilingual documents where different scripts will be thrust up against one another?</p>
