      <p>&gt; I try to maintain stylistic independence between the two scripts</p>
      <p>Which is what I've tried to do with the pair of masters; although only as much as is needed within the confines of authenticity for each script - which really isn't huge in the case of Armenian &amp; Latin: mostly slant and serifness (especially the latter) need to be different.</p>
      <p>&gt; clients who want to pay for a multiscript typeface don’t want<br>
      &gt; to pay for a separate multiscript typeface for each script</p>
      <p>While some clients don't want to pay for typefaces, period.  :-/<br>
      This is really just another case of education, and you win<br>
      some you lose some. But anyway I sell the various components<br>
      of N&amp;P individually: one client might want just the two masters,<br>
      another might want the Latinocentric half (for some good ol'<br>
      chauvinistic setting :-) and I can even envision somebody only<br>
      buying the Latin subordinate part of the Armenocentric set!<br>
      It's my personal favorite actually, and I wouldn't mind seeing<br>
      an entire book set in it. It would be unique in style and highly<br>
      readable. I promise.</p>
      <p>&gt; I try to treat neither script as stylistically dominant</p>
      <p>Again that's something I've tried to do (or actually, incorporate into the system) with N&amp;P, although some people (including the CR jury) might see a strong Armenian flavor throughout. I'm not sure that isn't more hindsight than insight though. If you show Patria to somebody, will he say "oh, it looks Armenian"? No way. But maybe he'll say "it looks foreign"? That's not impossible, but I think it's unlikely, mostly because people are now used to seeing all kinds of strange fonts; Patria is pretty mainstream in comparison.</p>
      <p>hhp</p>
