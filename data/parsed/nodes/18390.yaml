      <p>&gt; Harmless stuff, really, because never more than<br>
      &gt; a novelty, display faces of limited application.</p>
      <p>Well, I agree that reverse-Latinized designs are harmless*, but<br>
      certainly not because they're "display only"**; they're harmless<br>
      simply because Latin is too estaliblished as the dominant script.***<br>
      But by the same token, <cite>Latinization</cite> can be very harmful indeed,<br>
      when it's done to a struggling script.</p>
      <p>* Something I point out in my Spatium/Hyphen article.<br>
      In fact reverse-Latinization serves a positive purpose:<br>
      it demostrates to Latinizers how nuts what they're<br>
      doing looks like.</p>
      <p>** In fact display usage, being in the deliberative realm,<br>
      has more of an effect on cultural/conscious conceptions.</p>
      <p>*** At least until Chinese <cite>really</cite> kicks in.  :-)</p>
      <p>hhp</p>
