      <p>Having spent a little time in the arctic, in what is now Nunavut, I'm a little taken aback by this. I suppose it's no different from Mohawk Paper, or Shiite Paper, or Maori Paper, but it seems either completely un-PC, or just flat-out culturally-ignorant to name one's company Inuit Paper. (I'm guessing the company isn't based in Iqaluit.)</p>
      <p>And it's sad to see the Inuktitut syllabics writing system used by the Inuit - although designed in the 1870s by a kablunak, Edmund Peck - repurposed as the latin alphabet. Maybe I'm a genuine party-pooping stick-in-the-mud, but I find this kind of appropriation of another writing system for kicks and kitsch to be disrespectful. Other examples are provided by FSI, who published <a href="https://web.archive.org/web/20150123141705/http://www.fontfont.com/shop/view_singles_main.ep?id=127652" rel="nofollow">FF Bagel</a> and <a href="https://web.archive.org/web/20150123141705/http://www.fontfont.com/shop/view_singles_main.ep?id=127654" rel="nofollow">FF Falafel</a> which are meant to look, respectively, like Hebrew and Arabic scripts. (Nor am I crazy about mock-Gaelic, mock-Cyrillic, or mock-Greek fonts, or any other fonts aping the look of other fonts.)</p>
      <p>I'm sure that I'm going to catch a hot pile for saying this, but in my opinion Inuit Paper and its faux-Inuit alphabet isn't clever; it's disrespectful. I'm a fan of Jeremy's, which makes my disappointment doubly keen.</p>
