      <p>&gt; you’re on to something</p>
      <p>Thank you.<br>
      But yes, there's a lot more to do/add/fix.<br>
      Not least the serifs on the Latin caps.</p>
      <p>&gt; the lightest weight of Patria Armenian is very classic</p>
      <p>Actually, it's classic Latinization.  :-/<br>
      But that's OK here because it's a subordinate.</p>
      <p>&gt; it’s noticeably lower than the Latin x-height.</p>
      <p>1) Even though the Latin has no strong x-line horizonals?...<br>
      2) It's noticeable when you zoom in (and you're a type designer), but not when you're immersed (and you're a layman).</p>
      <p>&gt; The Armenian looks smaller</p>
      <p>1) Don't base it all on a couple of samples - that's too deterministic; for one thing "dearest" contains fully 5 (out of 7) instances of glyphs that are unusually wide in Patria. But even in that case you might find that if you focus beyond the plane of the text, the apparent sizes come sufficiently* close (not least because Latin's paucity of extenders*). I couldn't say how many man-months of squinting and de-focusing I did before arriving at these relative proportions.  :-)<br>
      2) Again, there's a perceptual and cognitive difference between deliberation and immersion.</p>
      <p>* See below.</p>
      <p>&gt; You’ve not met your “apparent size” requirement.</p>
      <p>Of course not absolutely.<br>
      It's a balance, a dance of gentle gives and takes.<br>
      And the same with the other factors I mentioned.</p>
      <p>&gt; It’s a misconception that book faces require small x-height.</p>
      <p>I don't know what you mean by "small", but it's<br>
      certainly no misconception that the extenders<br>
      are more than just pretty appendages.</p>
      <p>The more you're shooting for immersive reading, and the larger<br>
      the point size, the smaller the x-height should be (up to a point).</p>
      <p>&gt; a type’s apparent size is determined almost completely by it’s x-height!</p>
      <p>Nope. Especially in something like Armenian, with its rich extender space (or even Polish, with its rich diacritics) the x-height is certainly the most important, but you can't simply ignore the rest. Even in English the ascenders with their frequency and the descenders with their heft do make a difference. And this is where the notably subtle x-height changes in N&amp;P come from.</p>
      <p>&gt; although perhaps not in Georgian — but that’s the exception</p>
      <p>Exception? No such thing. It's just a pushier case. Armenian is just like Georgian in that way, simply less extreme. So any anti-Regularity decisions that apply to Georgian also apply -to a lesser extent- to Armenian (and everything else). Like I said, more important than where the threshold might be is that there is a threshold at all.</p>
      <p>&gt; No loss.</p>
      <p>(I think you missed my point.)<br>
      If there's no loss, then there's no reason to blindly align things.</p>
      <p>hhp</p>
