      <p>Adam: <em>your Ethopic typeface can also be called “matched bi-alphabet face”?</em></p>
      <p>Yes, but I thought Nick was asking specifically about matching with Canadian aboriginal syllabics.</p>
      <p>In Nyala, the Ethiopic typeface, the Latin exists in a supporting role to the Ethiopic. So it might be seen as one half of what Hrant advocates: a typeface in which one script is clearly dominant in determining the style and the other subservient to it. The Nyala Latin was designed for the specific purpose of setting some Latin words within Ethiopic text, based on examples of such documents I had examined which typically used e.g. Times or similarly ill-matched design for the Latin. If I were intending to set just a few words of an Ethiopic language in the midst of Latin text, I would not use Nyala for the Latin because I don't think it is an appropriate Latin text face (Gary Munch remarks that it has some merit as a Latin display face independent of the Ethiopic). So it isn't really a bi-matched system in the same way that Ross' Euphemia is, but the Canadian syllabics lend themselves very easily to matching a Latin sans serif.</p>
      <p>Nyala is something of an unusual approach for me, because the Ethiopic script so obviously has dominance over the Latin. More often, I try to maintain stylistic independence between the two scripts, and address harmony in terms of weight and proportion, aiming for matching typographic colour as far as possible without compromising either script. The reason for this is pragmatic: clients who want to pay for a multiscript typeface don't want to pay for a separate multiscript typeface for each script, as required by Hrant's Nour/Patria system. So I try to treat neither script as stylistically dominant (except, sometimes, where this decision has been taken independently of my design, e.g. 300 years ago by Peter the Great).</p>
    html_clean: |-
      <p>Adam: <em>your Ethopic typeface can also be called “matched bi-alphabet face”?</em></p>
      <p>Yes, but I thought Nick was asking specifically about matching with Canadian aboriginal syllabics.</p>
      <p>In Nyala, the Ethiopic typeface, the Latin exists in a supporting role to the Ethiopic. So it might be seen as one half of what Hrant advocates: a typeface in which one script is clearly dominant in determining the style and the other subservient to it. The Nyala Latin was designed for the specific purpose of setting some Latin words within Ethiopic text, based on examples of such documents I had examined which typically used e.g. Times or similarly ill-matched design for the Latin. If I were intending to set just a few words of an Ethiopic language in the midst of Latin text, I would not use Nyala for the Latin because I don't think it is an appropriate Latin text face (Gary Munch remarks that it has some merit as a Latin display face independent of the Ethiopic). So it isn't really a bi-matched system in the same way that Ross' Euphemia is, but the Canadian syllabics lend themselves very easily to matching a Latin sans serif.</p>
      <p>Nyala is something of an unusual approach for me, because the Ethiopic script so obviously has dominance over the Latin. More often, I try to maintain stylistic independence between the two scripts, and address harmony in terms of weight and proportion, aiming for matching typographic colour as far as possible without compromising either script. The reason for this is pragmatic: clients who want to pay for a multiscript typeface don't want to pay for a separate multiscript typeface for each script, as required by Hrant's Nour/Patria system. So I try to treat neither script as stylistically dominant (except, sometimes, where this decision has been taken independently of my design, e.g. 300 years ago by Peter the Great).</p>
