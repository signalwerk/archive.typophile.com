      <p>hpp: "...the particular usage of the non-x-height space varies greatly, affecting apparent size. So for example for the former the Latin will look unusually large (which it does) while in the latter it will look too small (since the Armenia extenders are much stronger). Talk about disrupting immersive reading (not to mention unwittingly conveying to the reader that one script is more “important” than the other)"</p>
