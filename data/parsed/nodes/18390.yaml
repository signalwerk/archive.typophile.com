      <p>Amy, thanks for linking to the Flash animation about the develoment of the font. I was so appalled by the condescending tone and purple prose - almost certainly nothing to do with Jeremy - that I had to transcribe it:</p>
      <p>///</p>
      <p>This is where it all began - the Inuktitut alphabet. These strangely alien shapes and squiggles provided the raw material for our new typeface.</p>
      <p>It's a surprisingly modern collection of characters, as the Inuit people only developed a written language in 1890s, in an effort to preserve their history and identity.</p>
      <p>Examples of work in progress - these early sketches by typographer Jeremy Tankard drew heavily on the character and composition of the Inuktitut alphabet.</p>
      <p>Ideas and variations were explored before a set of guiding principles for the Inuit typeface emerged.</p>
      <p>While some letters took their shape directly from the Inuktitut alphabet, others are based on more familiar Roman letterforms.</p>
      <p>This helped create an overall sense of balance, harmony and legibility.</p>
      <p>Inuit is a highly versatile typeface. It was originally designed as a display font for headlines and big text.</p>
      <p>But, because of the way the traditional and ethnic shapes work together, it's just as legible and engaging in smaller sizes.</p>
      <p>Ultimately, Inuit's eye-catching appearance is redolent of its origins.</p>
      <p>Jagged edges counterpoint sleek curves, suggesting the Arctic landscape and indigenous way of life.</p>
      <p>Some of the original Inuit shapes seemed a little too extreme, so we developed various alternative characters.</p>
      <p>This means you can always add a bit of variety to your text setting, or choose the version that best suits a particular design.</p>
      <p>Also included are several pairs of letters which flow together - technically known as 'ligatures' - to add texture and rhythm to typeset text.</p>
      <p>Generally fonts only include fl and fi, but Inuit has several more, emphasising its fluency and organic form.</p>
      <p>///</p>
      <p>There is plenty of fodder there for my upset. The text is condescending AND inaccurate, which is a heady mix. Any copywriter with an internet connection could have dialed up <a href="https://web.archive.org/web/20150123141705/http://en.wikipedia.org/wiki/Canadian_aboriginal_syllabic_writing" rel="nofollow">this WIKIpedia entry</a> to get some background on the Inutitut Syllabics writing system, which was developed not by Inuit "to preserve their history and identity", but by missionaries to spread the word of their god to the animist peoples of the arctic.</p>
      <p>If Arjo Wiggins means to say that their new range of paper is snow-white, they don't need to do so in such a culturally-insensitive and imperialist way. The name is bad enough, and the appropriation of Inuktitut syllabary and its "strangely alien shapes and squiggles" is adding insult to injury.</p>
