      <p>Hrant, you're on to something with your "doubly bi-lateral" approach, and the component parts are fine (the lightest weight of Patria Armenian is very classic), but you haven't delivered everything you claim and there are still some family design issues to resolve.</p>
      <p>The Armenian "x"-height of Nour/Patria is clearly indicated by serifs (more so than its baseline), and it's noticeably lower than the Latin x-height. The Armenian looks smaller and more condensed (compare the rhythm of vertical strokes), while the Latin is larger and rounder. You've not met your "apparent size" requirement. Rather than dethroning Formal Regularity, what you have is two out-of-sync regularities.<br>
      </p><div class="imageWrap"><img src="https://web.archive.org/web/20150123141705im_/http://typophile.com/files/NourNS.png"></div><p></p>
      <p><em> the particular usage of the non-x-height space varies greatly </em></p>
      <p>It's not about the non-x-height. It's an axiom of typography that a type's apparent size is determined almost completely by it's x-height! In Latin, Greek, Cyrillic, Armenian, etc., (although perhaps not in Georgian -- but that's the exception).</p>
      <p><em> sure, use Quadraat Headliner for a book </em></p>
      <p>It's a misconception that book faces require small x-height. Dante, for instance, or Cartier Book, have ample x-height, while Bernhard Modern, with a tiny x-height, is more of a display face. Small text fonts (eg ITC Bodoni Six) have exaggerated x-heights.</p>
      <p><em> Even when a multi-script font is used to set single scripts at a time, what’s the loss if it happens to also be suitable for proper multi-script setting? </em></p>
      <p>No loss. When Western foundries publish a typeface with Latin and Cyrillic scripts, they're making the design available for use in Russia, Ukraine, etc., in situations which will usually not involve bilingualism with Latin script.</p>
