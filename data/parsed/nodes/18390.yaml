      <p><em> there’s only one such system on the planet, for any pair of scripts: Nour&amp;Patria.</em></p>
      <p>It is a unique approach, but it's kind of "cutting off one's nose to spite one's face".<br>
      With the premise that a single Latin style and a matched single Armenian style is not possible (a political statement, if not a defeatist design philosophy), what this typeface system does is offer stylistic alternates of the "other" script. </p>
      <p>So, in OpenType terms, Nour = A (Armenian) + L.salt (Latin stylistic alternate)<br>
      Patria = L + A.salt (Armenian stylisitic alternate).</p>
      <p>It may be politically sensitive, but the result is a complex system, a variation of the "Roman + Italic + Caption" style categories in Fairmont, that doesn't offer Armenian typographers as much to work with as their Latin counterparts, by not having enough "design-space" to provide a clearly-contrasted Roman + Italic. Armenian is conceived of as the "Caption" element in the triumvirate. The type designer's message seems to be that the notion of Roman/Italic contrast is un-Armenian, unacceptable Latinization.</p>
      <p>Do Armenian typographers not use the layout convention of contrasting "Roman" against "Italic"? A face like Asmik would suggest otherwise.</p>
      <p>I would imagine that typographers setting Armenian would be inclined to use the B weight of Patria as "Roman", and the A weight of Nour as "Italic".</p>
      <p>For a text face, the serifed Cleartype font Constantia (John Hudson) does a good job of being "doubly bi-lateral" in the relationship between Latin and Cyrillic. What makes the difference is, surely, starting both scripts at the same time, with a single, comprehensive design space. Not fragmentation.</p>
      <p>As a bilingual system, Nour or Patria has a puzzling inconsistency between scripts: different x-heights. What happens when a word or phrase of one script is inserted into a paragraph of the other? Surely the abrupt change of x-height will disrupt immersive reading?</p>
