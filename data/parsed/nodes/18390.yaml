      <p>OK, OK, you can tack on "as far as I know". But really that's about it. N&amp;P is the only "known system" shall we say that has a double pair of masters and subordinates that makes it a balanced, versatile system. Without such multilateralism a multiscipt font system is one-dimensional, allowing for authentic, functional setting in all its scripts only in very narrow applications. Not that I'm not trying to spread the word: my article spills all and has been published in two journals (so far); I've given a talk about it at two conferences; and I preach one-to-one as well, like when Michail Semoglu showed me his beautiful reverse-Latinized design, and I suggested he do it both ways, not just one.</p>
      <p>And perhaps it's not even a very big claim, for the simple reason that many people think it's not worth the trouble, or even that it's a bad idea. Modernism is the dominant ideology and it tells people that a solution like mine is "too complex"; the most Modernism can apparently be happy with is the one-font-per-script concept (and really, it would much rather have everybody just use the Latin script). While the reason I think it's just complex enough is simply that multiculturalism is itself highly complex!</p>
      <p>&gt; Has Matthew Carter done anything that could<br>
      &gt; be called a “matched bi-alphabet face”?</p>
      <p>As far as I know the most Carter has done is the Cadmus/Skia<br>
      pair, which is however a superb example of reverse-Latinization.</p>
      <p><a href="https://web.archive.org/web/20150123141705/http://www.themicrofoundry.com/other/cadmuskia.gif" title="http://www.themicrofoundry.com/other/cadmuskia.gif">http://www.themicrofoundry.com/other/cadmuskia.gif</a></p>
      <p>&gt; Even if Hrant wasn’t the first to suggest this</p>
      <p>I would of course really love to hear of any conceptual<br>
      predecessor, especially since I value raw ideas so much.</p>
      <p>hhp</p>
