      <p>Hrant, fair enough. I guess I'm just not up on your Patria/Nour project, or the ideas behind it. I'm just such a pragmatist - and you have to be as a type publisher, even if being a type designer is more "romantic" - that I wonder how users work with the fonts. </p>
      <p>I gather that there are four fonts in the grid: Pure Latin / Pure Armenian / Latin with an Armenian accent / Armenian with a Latin accent. I understand the concept, and I appreciate it; I just wonder whether the users of the system are using it as is intended.</p>
      <p>And again, perhaps I'm a dirty modernist, but it seems to me that a type system or multiple scripts — or a single big-ass OT font conatining multiple scripts — should all be designed to hold together æsthetically. Often, additional scripts are just that: additional. They have been designed after the Latin script, and so are beholden to the Latin. When a project has been conceived as an integrated, cross-referenced, cohesive multi-script face, that seems like the ideal approach. And I believe that this was the approach in developing the new typefaces for Microsoft's Longhorn/Vista OS.</p>
      <p>Hrant, from my brief perusal of CR's type contest issue, it seems that the Patria/Nour system is very handsome and very cohesive, and I compliment you on it. I'd love to see a PDF, if you have one posted on your site somewhere.</p>
      <p>So, excuse my earlier dig. I couldn't help myself...</p>
      <p>PS; what were we talking about? Oh yeah: Inuktitut syllabics...</p>
