      <p>Actually, there are many more than two, but I agree that those<br>
      two cases (which I call "parallel" and "hierarchic" in my article)<br>
      are the main ones.</p>
      <p>Just FYI though, a third type of bilingual document, which is<br>
      actually quite prevalent, is the dictionary, and that tends to be<br>
      much more complex than the "main" two. Even a system like<br>
      N&amp;P's might have trouble keeping up, but of course it will<br>
      manage much better than the one-dimensional stuff.</p>
      <p>&gt; The requirement for the latter is most definitely<br>
      &gt; to have a common x-height across scripts</p>
      <p>Absolutely not. Why not? Because if you do that the<br>
      other-script snippet can look unusually small or large.</p>
      <p>The fact that guidelines like the x-height are not in fact<br>
      populated by straight horizontal lines means that there's<br>
      actually a lot less strict alignment necessary, and instead<br>
      things like apparent size need to be weighted heavily.</p>
      <p>The five main factors that need to be balanced against<br>
      each other very carefully in a multi-script typeface are:<br>
      authenticity, readability, even color, apparent size, and<br>
      regularity (like alignment, but also stylistic consistency).</p>
      <p>&gt; the Latin glyphs can be tailored to the requirements of the other script.</p>
      <p>If you ignore that a font's vertical proportions affect its<br>
      readability (at a given point size), sure, use Quadraat<br>
      Headliner for a book...  :-/</p>
      <p>Precedent of expectation is only a small factor in actual functionality.</p>
      <p>&gt; Big x-height for use with Cyrillic, small for use with Armenian.</p>
      <p>Which however totally doesn't work, because the particular<br>
      usage of the non-x-height space varies greatly, affecting<br>
      apparent size. So for example for the former the Latin will<br>
      look unusually large (which it does) while in the latter it<br>
      will look too small (since the Armenia extenders are much<br>
      stronger). Talk about disrupting immersive reading (not to<br>
      mention unwittingly conveying to the reader that one script<br>
      is more "important" than the other).</p>
      <p>&gt; perhaps bilingual typography is not an important reason for multi-script typefaces</p>
      <p>1) Of course it is. Everywhere from the -expanding- European<br>
      Union to cultures with "secondary" scripts trying to keep up.<br>
      2) Even when a multi-script font is used to set single scripts at a time,<br>
      what's the loss if it happens to also be suitable for proper multi-script<br>
      setting? The answer I guess is the Modernist-coziness of the designer.</p>
      <p>--</p>
      <p>What's the solution?<br>
      Formal Regularity needs to be brought down from its position on the throne.</p>
      <p>hhp</p>
