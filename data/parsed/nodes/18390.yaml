      <p>&gt; I just wonder whether the users of the system are using it as is intended.</p>
      <p>Ah, the ever-elusive Intent. :-)  You probably know even better than me that the original intent of a type designer is the first thing to go when the font hits the road. Which is OK, really - I'm a pragmatist too, and I simply can't angry over things I can't affect.</p>
      <p>That said, I certainly do have an intent for the thing. But it's also way too early to know if most users will "get it", since Nour has only really been used once so far (in Emily Artinian's book that I mentioned in the CR awards thread). One thing that helps though is that for somebody (especially an Armenian person) to go looking for something like this, to find it, and pay good money for it, it's quite likely that the intent will not only get through, but resonate strongly with the customer. N&amp;P isn't something most people would buy just for its looks (it doesn't even look that impressive formally I don't think - although Patria customers have in fact told me that they like its somewhat rigid but sensitive forms - which is actually the intent). This is fortunately exactly what happened with Emily: she looked for 2-3 months, paid the relatively high price pronto, and her tesimonials are the juiciest things a type designer could ever want!  :-)</p>
      <p>&gt; should all be designed to hold together æsthetically.</p>
      <p>Agreed. But of course, and as you probably agree, there are other<br>
      factors besides aethetics that needs to be balanced in as well.</p>
      <p>What's encouraging to me is that you seem to think that N&amp;P does<br>
      in fact enjoy this stylistic cohesiveness. I'm very grateful for<br>
      that because that half of the coin is difficult for me to gauge,<br>
      and the other half (functional authenticity) I already think is<br>
      working to satisfaction. So thanks!</p>
      <p>&gt; I believe that this was the approach in developing the<br>
      &gt; new typefaces for Microsoft’s Longhorn/Vista OS.</p>
      <p>And this sort of sensitivity is indeed highly welcome, and a recent phenomenon (thankfully gradually overpowering the heady cultural chauvinism of "70s-style" non-Latin design). Nonetheless, the one-font-per-script approach is a damaging over-simplification.</p>
      <p>Nick, the bulk of your questions are in fact addressed fully in my article. Which is not to say you're likely to appreciate the answers! :-)  Just FYI though: Spatium #4 is sold out; but Hyphen there's plenty of, and your interest in Greek type might provide extra motivation. Basically, if you're asking these questions because you're interested in the answers (or at least some answers) then my article should help.</p>
      <p>But since the article is not (yet) available publicly,<br>
      I will try to briefly address some of your points here.</p>
      <p>&gt; what this typeface system does is offer stylistic alternates of the “other” script.</p>
      <p>Style is exacly what I've tried too look beyond,<br>
      not to ignore it certainly, but to balance it in<br>
      a way that users need.</p>
      <p>&gt; doesn’t offer Armenian typographers as much<br>
      &gt; to work with as their Latin counterparts</p>
      <p>Certainly there's room for expansion (there always is). But pointing to the lack of an italic for Nour ignores a basic fact of Armenian typesetting: thanks to our floating emphasis mark, we don't need italics at all the same way that Latin users do. So sure, it would be nice to have (and I don't think it's Latinization) but sort of like smallcaps is to Latin. Before I make italics for Nour, I would make different optical sizes.</p>
      <p>Asmik? The inclusion of an italic doesn't make up for its hopelessly Latinized vertical proportions. I know, because that's exactly the type of Armenian fonts I used to make.  :-/</p>
      <p>&gt; Constantia (John Hudson) does a good job of being “doubly bi-lateral”</p>
      <p>No, that's not what it means.</p>
      <p>&gt; a puzzling inconsistency between scripts: different x-heights. </p>
      <p>That is, of course, exactly a feature, not a bug. Imposing strictly uniform vertical proportions across scripts is nothing short of cultural and functional suicide. The variation of vertical proportions certainly can't go unchecked; but neither should it be shunned. And it is in fact partly for reasons of immersive readability than vertical proportions usually cannot be imposed across scripts.</p>
      <p>Take for example Georgian. Would you make its vertical proportions match Latin, even though only 4 out of its 33 letters are confined to the x-height? And if you don't impose vertical proportions in a Georgian/Latin system, where's the threshold? Do you impose it for Armenian/Latin or not? Or what about the big two: Cyrillic (with is extender-starved lc) and Greek? Actually, the determintion of a threshold is moot; the important thing is that a threshold does exist.</p>
      <p>In fact I would suggest (and actually already have) that even within the Latin script different languages ideally need different proportions - at least in terms of the Em space: Polish for example, with its heavy dose of diacritics, is probably better served set at a slightly smaller point size (but with the same line-to-line leading) when set parallel to English text.</p>
      <p>hhp</p>
