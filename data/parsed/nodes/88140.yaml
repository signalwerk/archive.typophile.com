    <p>For Immediate Release<br>
    <em>  De Pinte, Belgium - December 7, 2011</em></p>
    <p> &nbsp;<br>
    <a href="https://ourtype.com/#/try/meret" rel="nofollow">Meret</a> is the work of Nils Thomsen, a young type designer, whose undogmatic attitude to design and straight-on working methods are powered by research, perseverance, and the latest font development technologies. Meret is the fruit of this approach, formed during Nils's time on the <a href="http://new.typemedia.org/" rel="nofollow">Type]Media</a> course at The Royal Academy of Art in The Hague. </p>
    <p>The design of OurType Meret carefully balances pointed-nib and broad-nib stroke contrast. It is styled to contemporary typographic requirements and fine-tuned throughout its range of weights. These perform faultlessly in text, while the Thin and Black weights are great for headlines. Meret's italics, mild in manner, are the perfect foil for its vivid romans. And the serifless figures stand out beautifully – among them are lining, old style, and small cap designs, and an intermediate variant whose height is well suited to newspaper texts of all kinds. Meret's uppercase height, slightly reduced, is similarly optimized for typesetting in languages that are capitals-intensive, such as German. </p>
    <p>Apart from newspaper work, OurType Meret serves any kind of design involving extended texts, from books to dictionaries to magazines. It is hardly coincidental that Florian Bachleda &amp; Christian Schwartz chose Meret for the recent re-design of <a href="http://www.fastcompany.com/" rel="nofollow">Fast Company</a>, the magazine of entrepreneurial innovation.</p>
    <p>The Meret family consists of roman and italic designs in seven weights: Thin, Light, Normal, Medium, SemiBold, Bold, and Black. Its PRO character set includes small caps; lining, old style, small cap, and an intermediate height set of figures (each in tabular and proportional widths); fractions; comprehensive superiors, inferiors, nominators and denominators; case sensitive punctuation sets; mathematical and monetary symbols; arrows; standard and discretionary ligatures; and a complete range of accents covering all (Latin script based) Western, Central and East European languages.</p>
    <p>Produced and released by OurType in 2011, Meret fonts are available in OpenType PRO character set only.</p>
    <p>Meret is a winner of the <a href="http://letter2.org/" rel="nofollow">Letter.2 type design competition</a>, organized by the <a href="www.atypi.org" rel="nofollow">Association Typographique Internationale</a> in 2011. </p>
    <p><strong>About Nils Thomsen</strong></p>
    <p>  Nils Thomsen was born in Eckernförde, northern Germany. Captivated by graffiti since his childhood, Nils has later developed a sense of fascination for lettershapes. It was this that brought Nils to Muthesius Art School in Kiel to study Graphic Design. During his undergraduate studies, type and typography became Nils' primary interest. The school's type design classes led by Albert-Jan Pool had played a crucial role in defining Nils' next step – the Royal Academy of Art (KABK) in The Hague. He successfully completed his Master Degree at postgraduate course Type]Media in 2010.<br>
    Nils lives and works in Hamburg.</p>
    <p><strong>About OurType</strong></p>
    <p>Founded in 2002, <a href="https://ourtype.com/#/about/company-profile/" rel="nofollow">OurType</a> is an independent type foundry led by Fred Smeijers, Corina Cotorobai and Rudy Geeraerts. Its signature collection consists of fine typeface designs that respect traditional values and yet are tailored to contemporary needs.&nbsp;In addition to its renowned designers – <a href="https://ourtype.com/#/our-designers/fred-smeijers/" rel="nofollow">Smeijers</a> and <a href="https://ourtype.com/#/our-designers/peter-verheul/" rel="nofollow">Verheul</a> – OurType also publishes fonts from some of the best young talents: <a href="https://ourtype.com/#/our-designers/nikola-djurek/" rel="nofollow">Nikola Djurek</a>, <a href="https://ourtype.com/#/our-designers/andre-leonardt/" rel="nofollow">André Leonardt</a>, <a href="https://ourtype.com/#/our-designers/merel-matzinger/" rel="nofollow">Merel Matzinger</a>, <a href="https://ourtype.com/#/our-designers/artur-schmal/" rel="nofollow">Artur Schmal</a>, <a href="https://ourtype.com/#/our-designers/thomas-thiemich/" rel="nofollow">Thomas Thiemich</a>, <a href="https://ourtype.com/#/our-designers/hendrik-weber/" rel="nofollow">Hendrik Weber</a>, <a href="https://ourtype.com/#/our-designers/maurice-goeldner/" rel="nofollow">Maurice Göldner</a>, <a href="https://ourtype.com/#/our-designers/peter-mohr/" rel="nofollow">Peter Mohr</a>, <a href="https://ourtype.com/#/our-designers/frederik-berlaen/" rel="nofollow">Frederik Berlaen</a>, and <a href="https://ourtype.com/#/our-designers/valentin-brustaux/" rel="nofollow">Valentin Brustaux</a>, now joined by <a href="https://ourtype.com/#/our-designers/valentin-brustaux/" rel="nofollow">Nils Thomsen</a>.</p>
    <p>OurType collection is available at <a href="https://ourtype.com/" rel="nofollow">www.ourtype.com</a></p>
    <p>OurType web fonts exclusive to <a href="http://www.extensis.com/en/WebINK/" rel="nofollow">webINK </a></p>
