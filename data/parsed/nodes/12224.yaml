    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Tools" class="freelinking" rel="nofollow">Tools</a>: <a href="/wiki/Type%20Design%20Tools" class="freelinking" rel="nofollow">Type Design Tools</a> : ATF Type Designer</strong></p>
    <p>ATF Type Designer is a font editing program now only of historical interest. A special feature was an attempt to implement <a href="/wiki/Optical%20Scaling" class="freelinking" rel="nofollow">Optical Scaling</a> in software, but it certainly did not catch on.</p>
    <p>More information can be found in this <a href="http://www.seyboldreports.com/SRDP/dp6/dp06-06a.htm" rel="nofollow">Seybold review</a>.</p>
