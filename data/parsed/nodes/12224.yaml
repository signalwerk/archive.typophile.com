    <p><span class="caps">ATF</span> Type Designer is a font editing program now only of historical interest. A special feature was an attempt to implement <a href="/node/13895/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Optical Scaling</a> in software, but it certainly did not catch&nbsp;on.</p>
