    <p>I'm currently in the process of using Microsoft VOLT to programme a Malayalam typeface and I have run into a few problems that I just don't understand how to fix. I'm currently testing my file in Microsoft Word 2010.</p>
    <p>1, Malayalam has glyphs known as chillaksaram which, as I understand it, are formed through inputting a string like this:<br>
    na (ന) + virama ( ്) + ZWJ [Control+Shift+1]= ൻ. </p>
    <p>Within VOLT, I have included the relevant strings into a post-base substitution  lookup and feature. This lookup sits below Akhand  and Below-base form  lookups that I have created.</p>
    <p>2, Malayalam uses a rakar glyph that substitutes ra (ര) + virama ( ്). The substitution itself works but it doesn't repositioning to precede it's base consonant. I assume this is the job of the shaping engine and so I do not understand what action I'm either not doing or preventing from happening?</p>
    <p>3, Finally, and more generally, I'm unsure which script I should be using; Malayalam  or Malayalam v.2 , or both? I need support for both Windows and Mac OSX systems. I often find problems that vary between them. I have been trying to follow closely the specifications laid out in Microsoft's Opentype Specification manual: <a href="http://www.microsoft.com/typography/OpenTypeDev/malayalam/intro.htm" title="http://www.microsoft.com/typography/OpenTypeDev/malayalam/intro.htm">http://www.microsoft.com/typography/OpenTypeDev/malayalam/intro.htm</a></p>
    <p>Hopefully someone can point me in the right direction.</p>
    <p>Thanks in advance</p>
    <p>Jonny Pinhorn</p>
