    html: |-
      <p>John,</p>
      <p>On closer inspection, I have found that my Malayalam font has some strange errors that don't make sense to me. Having made the alterations you suggested above my chillu forms substitute correctly and my rakar form now correctly jumps to it's correct pre-base position but now two new issues have occurred.</p>
      <p>All but one of my below-base marks substitute correctly on Windows but not within Indesign CS6. Why only the one consonant (mLa) substitutes and not the others is puzzling. I'd have thought it was all or nothing?</p>
      <p>The other issue is that I cannot make rakar ligatures in Windows or CS6. For example:<br>
      mPa mVirama mRa -&gt; mPra</p>
      <p>I've also tinkered with the strings in these ways without success:<br>
      'mPa mRakar -&gt; mPra' or 'mRakar mPa -&gt; mPra</p>
      <p>I assumed they have to be held within the AKHN lookup because you stated above that's where all conjunct ligatures should be located?</p>
      <p>The Malayalam example within the 'CS6IndicTagTest.pdf' document you kindly shared on Typophile shows neither below-base conjuncts or rakar ligatures where there is the potential for them; this suggests it's not yet possible to implement these within CS6 as we have previously discussed?</p>
      <p>Thanks.</p>
