      <p>Sorry not to have responded sooner; I just noticed this.</p>
      <p>The current OT Malayalam spec is somewhat misleading with regard to what the shaping engine actually does. My guess is that eventually the shaping engine behaviour will need to be revised, because it's sort of broken; in the meantime, though, it is possible to make a Malayalam font that works reasonably well, but you have to put all conjunct ligature lookups in the {akhn} feature and not use the {cjct} and {pres} features as you would for other Indic scripts.</p>
      <p>In response to your particular questions (using my conventional development glyph names):</p>
      <p>1. Chillu substitutions should be the first lookup in the {akhn} feature, processed before any others. The sequence you have is correct: letter + virama + ZWJ. Note that you might also want a ligature for<br>
      <code>mNa mVirama ZWJ mRra -&gt; mChilluNRra</code><br>
      which should precede the shorter chillu strings in the lookup.</p>
      <p>2. For v.2 shaping, the input for the prescript rakar is<br>
      <code>mVirama mRa -&gt; mRakar</code><br>
      and this lookup must be associated with the {pref} feature. The layout engine knows to reorder the output of the {pref} feature to the beginning of the cluster.</p>
      <p>3. You should only need to implement the Malayalam v.2 shaping and can ignore the older spec. The v.2 shaping is used in all versions of Windows from Vista on, and Malayalam is also one of the scripts for which Adobe's World Ready Composer implements the v.2 shaping, albeit with some bugs. [See <a href="http://www.typophile.com/node/94543" title="http://www.typophile.com/node/94543">http://www.typophile.com/node/94543</a> ]</p>
      <p>Malayalam is the most difficult Indic script for which I've had to program in VOLT, not just because of the issues with the shaping engine and spec, but because the orthographic conventions of how Malayalam is written represent a subset of capabilities of the writing system. In modern Malayalam, conventional preference dictates that some conjuncts must be written with ligatures, some with subscripts, and some with explicit virama, while other are acceptable in more than one form. This means your VOLT programming needs to handle prioritisation of particular conjunct formation using contextual rules. So, for instance, when three letters occur in a conjunct, you need to know which two-letter portion of the conjunct takes preference as a ligature or subscript form and where an explicit virama should be.</p>
      <p>I'm afraid I don't have this information in a form that I can publicly share yet.</p>
