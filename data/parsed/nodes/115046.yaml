    html: |-
      <p>I've not done very much testing of Malayalam in InDesign, so it is entirely possible that there are problems beyond those I noted in my earlier documentation. All my Malayalam work to date has been targeting Microsoft's implementation, and that too with the caveat that the shaping may need to change in future.</p>
      <p>You are handling the below-base substitutions for consonants in the {blwf} feature, yes?</p>
      <p>I have to admit that subscript -La is an oddity: something I can make work without really understanding why it is done this way. It has its own {blwf} lookup (which isn't unusual, given that most of the subscripts have context exceptions), but then the conjunct ligatures involving subscript -La are handled subsequently in {blws}, rather than in the {akhn} feature with the other ligatures. I first noticed this in Microsoft's Kartika font, but no one at MS nor my Malayalam contact have been able to suggest why this might be so. I'm hoping I might get this cleared up when I look at the Malayalam shaping engine issues in more detail later this month.</p>
      <p>When you refer to rakar ligatures, I presume you mean traditional lipi forms. I've not had occasion to try to implement these, as all my Malayalam fonts have been for the reformed orthography. But my assumption would be that these substitutions would need to be performed in the {akhn} feature, before the {pref} feature substitutes the prescript -Ra, because the latter would trigger reordering by the layout engine. So I would expect (using my glyph naming conventions)</p>
      <p><code>mPa  mVirama mRa -&gt; mPRa</code></p>
      <p>in the {akhn} feature to work. If it doesn't then </p>
      <p>I can probably spare half an hour or so to look at your VOLT source, if that might help.</p>
      <p>john[at]tiro[dot]ca</p>
