      <p>I don't know what you mean by putting emphasis on the 'AYA' instead of the 'E'. To me "merayachts" looks like one German or maybe Dutch word. I suppose if there are photos of yachts below I'll eventually figure it out, but otherwise there's no way I'm reading it as "MERA YACHTS".</p>
      <p>You haven't "gotten the effect" of SAVOY, which is thin as opposed to regular weight, and half the number of characters. I think yours might prove to be too long in practical applications. In any event, it's rather bland and undistinguished.</p>
