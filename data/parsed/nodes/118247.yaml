      <p>Captain Howdy, I'm not quite sure whether wealthy clients really notice about a logo being just acceptable or remarkable or brilliant. The more complex the product or service, in a market that is already niche, the less brand ID seems relevant. But things are slowly changing. Look, in charter companies the most memorable logo's are <a href="/node/add/wiki?edit%5Btitle%5D=%20http%3A//bit.ly/1ozgqwz" title="//bit.ly/1ozgqwz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"> http://bit.ly/1ozgqwz</a> and <a href="http://y.co/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://y.co/</a>, Y.CO being the most consistent and contemporary. The rest is a bit like this <a href="http://bit.ly/1nOW8hL" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://bit.ly/1nOW8hL</a>, corporate rather than desirable. </p>
      <p>It seems like people think: to catch the attention of a billionaire client we have to look corporate and expensive. But what does "expensive" actually look like? Twitter is worth more the best law firms. Besides, isn't a yacht about enjoying good times? Shouldn't it be a memorable experience for a client to order a yacht, instead of just meeting corporate looking brokers in corporate looking offices with corporate looking logos?</p>
