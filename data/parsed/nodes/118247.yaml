    <p>Hi,</p>
    <p>I am new to this forum and would like to ask your opinion on the readability and possible webfont combinations for this logo.</p>
    <p>My client is a yacht charter company, aiming for a contemporary yet timeless and elegant brand ID. The name is rather long and unusual, but they insist it has to be one word, not "xxxx Yachts". There's a story behind that. </p>
    <p>I've selected Brandon Grotesque with enough kerning, aiming for a clean effect without feeling "clinical".  In a small enough size, the logo gets the effect of Savoy hotels (<a class="freelinking external" href="http://bit.ly/1AglwCH" rel="nofollow">http://bit.ly/1AglwCH</a>), clean and refined. But, since we'd like to avoid lower case and different font weights, first readers may wrongly put emphasis on the "AYA", instead of on the "E". Is that how you perceive it?</p>
    <p>Regarding the website fonts, I was somehow hoping to use Univers, which I love particularly on this website: <a class="freelinking external" href="http://bit.ly/1pklIZd" rel="nofollow">http://bit.ly/1pklIZd</a>. However, if proceeding with Brandon Grotesque, I'd possibly use the same font for the main menu and headings, and keep the body text neutral with Univers or Arial.</p>
