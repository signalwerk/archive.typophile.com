    html: <p>I think maybe neither of us fully understands what the other is saying, or thinks more is being said than was actually intended. I wasn't suggesting that you ought to make the mark look "corporate" or "expensive" or anything else. I was merely suggesting that you figure out how to make it appealing to your client's particular target market, whoever they are, and try to impress upon your client that the goal is to please that market, not himself. For example, your client insists on a one-word name despite the fact that it will be illegible to his target market.</p>
