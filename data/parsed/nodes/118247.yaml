      <p>I have to say Merayachts is one of the most confusing brand names I've seen in a while. Before reading it's a yachts charter company I had no idea how to interpret the logo. The problem I think is that the Y wants to belong to both Meray and Yachts and thus I didn't even think to pronounce Mera Yachts instead. I second what Captain Howdy said. At times I find it almost miraculous how clients tend to think their brand is for themselves rather than for their target market. At times I've even used a typeface I didn't like personally but it worked for the target market so I put my personal taste aside.</p>
      <p>I think Brandon Grotesque has a bit of that quality of late 19th century engraving typefaces. I think something a bit more squared and industrial might work well for a nautical company. You might want to do something with the M, such as in this unicase branding I see every day when I go to school: <a href="http://www.erasmusjournalisten.nl/wp-content/uploads/2013/02/Koen-Suyk-_ANP.jpg">http://www.erasmusjournalisten.nl/wp-content/uploads/2013/02/Koen-Suyk-_...</a></p>
      <p>By the way, why the hell is Y.CO playing Tech House on their website? I guess that's what the target market wants...</p>
