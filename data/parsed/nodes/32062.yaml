      <p>I should suggest having a look at how Guimard dealt with the M of Métropolitain: the entrances to the Paris metro he designed are shaped as an M.<br>
      <a href="http://www.parisinconnu.com/guimard/l12p1.php" title="http://www.parisinconnu.com/guimard/l12p1.php">http://www.parisinconnu.com/guimard/l12p1.php</a></p>
      <p>He also used different lettering to write Metropholitain<br>
      <a href="http://www.parisinconnu.com/guimard/l6p3.php" title="http://www.parisinconnu.com/guimard/l6p3.php">http://www.parisinconnu.com/guimard/l6p3.php</a></p>
      <p>The Guimard escutcheons also bear an M<br>
      <a href="http://fr.wikipedia.org/wiki/Image:Guimard_subway_escutcheons.jpg" title="http://fr.wikipedia.org/wiki/Image:Guimard_subway_escutcheons.jpg">http://fr.wikipedia.org/wiki/Image:Guimard_subway_escutcheons.jpg</a></p>
      <p>(if you saw the entrance from a bird's view, you'd see it is also shaped as an M!)</p>
      <p>Later letterings (white on red) by Dervaux may be less inspiring to some but I think they are great<br>
      both models actually</p>
      <p><a href="http://fr.wikipedia.org/wiki/Image:Paris_Metro_Sign.jpg" title="http://fr.wikipedia.org/wiki/Image:Paris_Metro_Sign.jpg">http://fr.wikipedia.org/wiki/Image:Paris_Metro_Sign.jpg</a></p>
      <p><a href="http://accel10.mettre-put-idata.over-blog.com/0/11/74/18/metro/enseigne.jpg" title="http://accel10.mettre-put-idata.over-blog.com/0/11/74/18/metro/enseigne.jpg">http://accel10.mettre-put-idata.over-blog.com/0/11/74/18/metro/enseigne.jpg</a></p>
      <p>THe yellow 'radio mast' is rather good too:<br>
      <a href="http://img.franceguide.com/ebm/2006/03/BM_20060307091705740.npf" title="http://img.franceguide.com/ebm/2006/03/BM_20060307091705740.npf">http://img.franceguide.com/ebm/2006/03/BM_20060307091705740.npf</a></p>
      <p>If you are a comic buff, Edgar P Jacobs is the way forward:<br>
      <a href="http://images.google.com/imgres?imgurl=http://www.dimensionedelta.net/jones/mortimer/_covers/_bigs/bm_05_d.jpg&amp;imgrefurl=http://www.dimensionedelta.net/jones/mortimer/_covers/mortcovers_03.html&amp;h=300&amp;w=227&amp;sz=25&amp;hl=en&amp;start=9&amp;tbnid=YrKazyjXX_KMWM:&amp;tbnh=116&amp;tbnw=88&amp;prev=/images%3Fq%3Dmarque%2Bjaune%26svnum%3D10%26hl%3Den%26sa%3DG" title="http://images.google.com/imgres?imgurl=http://www.dimensionedelta.net/jones/mortimer/_covers/_bigs/bm_05_d.jpg&amp;imgrefurl=http://www.dimensionedelta.net/jones/mortimer/_covers/mortcovers_03.html&amp;h=300&amp;w=227&amp;sz=25&amp;hl=en&amp;start=9&amp;tbnid=YrKazyjXX_KMWM:&amp;tbnh=116&amp;tbnw=88&amp;prev=/images%3Fq%3Dmarque%2Bjaune%26svnum%3D10%26hl%3Den%26sa%3DG">http://images.google.com/imgres?imgurl=http://www.dimensionedelta.net/jo...</a></p>
