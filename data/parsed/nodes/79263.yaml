  html: |-
    <p>Hello, I am currently doing a typography project at Uni, and hoping to do it about money. Was just wondering, if anyone has any idea what typefaces are used on a British banknotes, like on a £5 note... not sure if it's even possible to find out as I've tried looking everywhere! Also wondered if maybe it's not public knowledge, due to fraud or anything..?<br>
    In which case, I would need to find typefaces that resembled those on the banknote, as best as possible...</p>
    <p>Any help would be much appreciated!<br>
    Thanks, Sarah.</p>
