    html: <p>Well, to begin with there are a whole bunch of different £5 notes from different banks in the different countries, I assume you mean the Bank of England one? There are at least eleven or twelve different types of lettering on one of those (just counting off <a class="freelinking external" href="http://3.bp.blogspot.com/_x4DOEF5pP2w/TNfdVwnpLoI/AAAAAAAAAXI/mz51z6lc1uA/s1600/small-5-pound-note.jpg" rel="nofollow">this</a>, which doesn't even show the obverse side that might have more!) and almost all of them (bar the serial numbers) are of course hand-engraved as is usual with currency - but some still might well have been based on typefaces. Any particular one you're after or just as many as possible?</p>
