  html: "<p>Matthew Carter and Charles Creesy to present on Monticello at The Grolier Club in New York. <br> <br>BUFFALO, NY, JANUARY 11, 2003 - In an event of interest to type lovers and history buffs alike, <a href=\"http://www.myfonts.com/person/carter/matthew/\">Matthew Carter</a> and Charles Creesy will present \"The New Digital Monticello Type: History and Inspirations.\" Co-sponsored by the <a href=\"http://www.printinghistory.org\">American Printing History Association</a> (APHA), <a href=\"http://www.typesociety.org\">The Society of Typographic Aficionados</a> (SOTA), and the <a href=\"http://www.tdc.org\">Type Directors Club</a> (TDC), this presentation will be held Tuesday, February 25, 2003, 6 p.m., at New York's <a href=\"http://www.grolierclub.org\">Grolier Club</a>. <br> <br>The Monticello typeface claims a lineage reaching back to Thomas Jefferson and America's first type foundry, Binny &amp; Ronaldson. Because the former American president admired the types of Binny &amp; Ronaldson, Monticello was named in honor of Jefferson's home. Originally commissioned by <a href=\"http://pup.princeton.edu\">Princeton University Press</a> for the Papers of Thomas Jefferson, Monticello represented the desire of editor Julian Boyd and the Press to present modern documentary editing in historically allusive typography. <br> <br>The Press's Creesy will talk about Binny &amp; Ronaldson, their relations with Thomas Jefferson, and how their 1797 type inspired the 1950 Linotype face Monticello. Carter will expound on this history, discussing his twenty-first century digital version of this quintessentially American typeface.  <br> <br>Carter, a type designer with more than forty years' experience with typographic technologies ranging from hand-cut punches to computer fonts, has designed a number of significant typefaces, including ITC Galliard, Bell Centennial (for U.S. telephone directories), Mantinia, Big Caslon, Miller, and the screen fonts Verdana and Georgia. Carter is a principal of Carter &amp; Cone Type, Inc. in Cambridge, Massachusetts. <br> <br>Creesy, Director of Computing and Publishing Technologies at the Press, was honored by the Association of American University Presses in 1996 for his efforts to help publishers adopt digital technologies. His article about the creation of the original Linotype Monticello and the new revival by Carter will appear in the Princeton University Library Chronicle. <br> <br>This presentation is part of the APHA \"On the Road\" series of events held across the United States in 2002-2003. The event is free and open to the public. Reservations are not required, but seating in the intimate facility is available on a first-come, first-served basis. Event attendees will receive a keepsake, the first showing of Carter's Monticello, courtesy of the Press. <br> <br>Further details are available in a <a href=\"http://www.typesociety.org/events/SOTA_APHA_Monticello.pdf\">PDF downloadable</a> from the SOTA website, or by contacting Mark Samuels Lasner, Vice-President for Programs, APHA, P.O. Box 4922, Grand Central Station, New York, N.Y. 10163, tel. (302) 831-3250, email <a href=\"mailto:programs@printinghistory.org\">programs@printinghistory.org</a>. For more information about SOTA, please visit the website at <a href=\"http://www.typesociety.org\" target=\"_blank\">http://www.typesociety.org</a>, or email <a href=\"mailto:info@typesociety.org\">info@typesociety.org</a>. <br></p>"
