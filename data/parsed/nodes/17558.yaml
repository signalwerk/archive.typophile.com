    html: <p>Hrant, do you have anything wider than Mana? I find it to condensed for easy reading. It looks good in the navigation example contra antialiased Tahoma, but in the text comparison with Verdana I find the latter easier to read, even though the actual rendering of many of the individual letters in Mana is better than the b/w Verdana bitmaps. I’m sure this is due almost entirely to the narrowness of Mana.</p>
