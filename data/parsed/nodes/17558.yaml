    date_raw: 2.Feb.2006 10.22am
    votes: null
    html: |-
      <p>I agree that it’s a bit too narrow for optimal reading.<br>
      Although the difference between this and one more bit<br>
      of width isn’t minor! In fact one more bit might make it<br>
      non-optimal on the other side - at least at those PPEMs.<br>
      For example a 14 PPEM bitmap font at the widths of the<br>
      Mana-16 might be right on the mark.</p>
      <p>My reasons for making Mana like this are that:<br>
      1) It’s a sans, so non-optimal for reading anyway. I have a serif in the works that’s wider. But, as above, part of the reason it looks wider is that the x-height is one bit shorter (and so are the descenders).<br>
      2) Since it’s a screen font, being able to fit in narrow spaces is a big plus, and this makes Mana more versatile.<br>
      3) It helps it stand out from the crowd, including Verdana.<br>
      4) Making it wider would cause the interal white to start overpowering the interletter spacing, especially in the lighter weights, which also have smaller x-heights (and especially for a sans). The “integerness” of everything in a bitmap font (including here the interletter spacing) tends to propagate issues throughout the design. It’s like the various “integernesses” :-) are in a multi-way tug-of-war, and you have to make sure nothing falls in the mud.</p>
      <p>But really, I actually find Mana more readable than Verdana on that page, probably because: the grays hold the letters (and boumas?) together better; and it’s one bit taller, making it of comparable apparent size, something even more important onscreen than in print.</p>
      <p>But if there’s enough demand (read: $) for a wider sans,<br>
      then I’d love to make it - in bitmap font design that sort<br>
      of change isn’t too hard. The hard part is sizing.  :-)</p>
      <p>hhp</p>
