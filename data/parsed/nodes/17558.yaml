      <p>If by “web fonts” you mean fonts that are installed in OSes<br>
      and can be called up in plain HTML, that’s sort of a limiting<br>
      discussion (as well as very imprecise these days, considering<br>
      rendering differences between Windows and MacOS).</p>
      <p>But if you mean screen fonts (which can actually be deployed<br>
      without necessarily being present on the host system) then for<br>
      sans I would alert you to my Mana fonts, which come in 16, 13<br>
      and 11 PPEM (each in regular and bold). Here’s a sample setting<br>
      of the two smaller sizes:<br>
      (149Kb) <a href="http://www.themicrofoundry.com/other/Mana13&amp;11.gif" title="http://www.themicrofoundry.com/other/Mana13&amp;11.gif">http://www.themicrofoundry.com/other/Mana13&amp;11.gif</a></p>
      <p>And here’s a head-to-head comparison:<br>
      (197Kb) <a href="http://www.themicrofoundry.com/other/ManaCompar.jpg" title="http://www.themicrofoundry.com/other/ManaCompar.jpg">http://www.themicrofoundry.com/other/ManaCompar.jpg</a></p>
      <p>For a serif face, to me Georgia is unmatched... for now.  :-)</p>
      <p>hhp</p>
