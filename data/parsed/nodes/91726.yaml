    <p>Hello<br>
    I am looking for the name of this font (I attached an image in JPG). How can you see is an adaptation of existing typography. I thought it was a Futura, but the capital S does not correspond to that family and that's where I started to doubt ...<br>
    It can be a Futura, but somehow type foundry  I unknown?</p>
    <p>If someone in the photo can help me, thank you very much!</p>
    <p>Marc Salinas</p>
