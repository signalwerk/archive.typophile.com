    html: |-
      <p>Economy notwithstanding, linebreaks should indeed ideally follow the content, even for prose.</p>
      <p>In the late 80s I typeset a children's book my father had written (it was the first time one of my fonts was going to be used for a book) and I'm still proud of how I made the linebreaks support the pace of reading.</p>
      <p>My father was skeptical at first, but a couple of Armenian-language teachers pointed out how helpful the custom linebreaks were.</p>
      <p>hhp</p>
