      <p>This is an old Western style. Baseline Fonts has revived it as <a class="freelinking external" href="http://www.myfonts.com/fonts/baselinefonts/57-rodeo/" rel="nofollow">Rodeo 57</a>. I have it by the name of Rodding in an old font collection from Tiger Direct.</p>
      <p>- Mike Yanega</p>
  - id: 534812
    user: 3368
    date: 2012-12-21T10:24:00
    date_raw: 21 Dec 2012 — 10:24am
    votes: null
    html: |-
      <p>Originally 'Helvin Black', William H. Page, 1870's. Also out there as Helene Hiss Black by (defunct) Soft Horizons and Helvin Black by Type Revivals.</p>
      <p>Edit: Note that none of these is a true match. I think Rodding (thanks, Mike) would be the closest if you simply flatten off the top of the A.</p>
