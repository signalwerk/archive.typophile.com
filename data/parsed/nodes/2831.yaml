  - id: 22607
    user: 1560
    date: 2004-01-25T11:01:00
    date_raw: 25 Jan 2004 — 11:01am
    votes: null
    html: <p>Thanks for the comments.  Personally, I think only the capital R and G have a slight asian feel.  My intent was not to make it overtly japanese/asian, but to give it just that little touch to reflect the name as well as to represent my personal tastes (being a fan of asian aesthetics, both traditional and modern).  <br> <br>As far as the concept going over people's heads...it wasn't that important to me that people be immediately familiar with the term "ronin", however, I plan to incorporate the definition and its relation to me, in things such as the mission statement/website/etc.  I like the name because it gets people asking about its meaning. <br> <br>Also, how do people feel about using variations on a logo...or is it a strict policy of choosing one and sticking with it?</p>
    html_clean: <p>Thanks for the comments.  Personally, I think only the capital R and G have a slight asian feel.  My intent was not to make it overtly japanese/asian, but to give it just that little touch to reflect the name as well as to represent my personal tastes (being a fan of asian aesthetics, both traditional and modern).  <br> <br>As far as the concept going over people's heads...it wasn't that important to me that people be immediately familiar with the term "ronin", however, I plan to incorporate the definition and its relation to me, in things such as the mission statement/website/etc.  I like the name because it gets people asking about its meaning. <br> <br>Also, how do people feel about using variations on a logo...or is it a strict policy of choosing one and sticking with it?</p>
