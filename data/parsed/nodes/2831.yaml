    html: <p>I prefer the top and the lower-right ones, although I agree with Aleph about your technique. This was a huge trend that came and went, so you may be creating associations you don't want. It's a bit more subtle than <a href="http://www.myfonts.com/fonts/urw/cs-takahashi/">CS Takahashi</a>, but that's the first association my mind makes, along with the Playstation game series <a href="http://www.kleber.net/wipeout3/history/2097/">Wipeout</a>. <br> <br>Although, looking at <a href="http://www.ronin-graphics.com/">your work</a>, I see that you tend towards lush, fast, young graphics anyway, so these associations could work in your favor. I recommend being more consistent with your use of the one-line logotype on your site. Personally, I'd replace the Ronin Graphics header that follows the splash page, which looks bland next to your personalized version. <br> <br>By they way, <i>Hellboy</i> rules.  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
