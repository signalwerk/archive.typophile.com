    html: <p>The most important thing to communicate with your identity the attitude that you take with your design. If you have many methods of working through a design or work with many styles several logos might suit you better than one.  <br> <br>Overall I would say that is is more important that the attitude you convey be consistent than the particular logo you use.  <br> <br>This is especially true if you market yourself in a personalised, direct fashion than if you just pepper the local papers with adverts.</p>
