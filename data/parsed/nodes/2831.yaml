  html: <p>This is a logo I've designed for my own freelance graphic design/illustration work. My concept is that I'm comparing myself to a Ronin, Japanese for a samurai without a master, working for hire, in that I work for myself, for hire. I wanted to convey a clean, stylish, modern look with a bit of a Japanese/Asian feel.  <br> <br>I'm mainly using the top version, however I made the bottom two in case I wanted to use a more compact, less horizontal version of the logo. How do you feel about multiple versions of logos? Is this ok, or is it something that's frowned upon? I'd appreciate your feedback.  Thanks. <br> <br><img src="http://www.typophile.com/forums/messages/4100/24821.gif" alt="Ronin Graphics Logo"></p>
  html_clean: <p>This is a logo I've designed for my own freelance graphic design/illustration work. My concept is that I'm comparing myself to a Ronin, Japanese for a samurai without a master, working for hire, in that I work for myself, for hire. I wanted to convey a clean, stylish, modern look with a bit of a Japanese/Asian feel.  <br> <br>I'm mainly using the top version, however I made the bottom two in case I wanted to use a more compact, less horizontal version of the logo. How do you feel about multiple versions of logos? Is this ok, or is it something that's frowned upon? I'd appreciate your feedback.  Thanks. <br> <br><img src="http://www.typophile.com/forums/messages/4100/24821.gif" alt="Ronin Graphics Logo"></p>
