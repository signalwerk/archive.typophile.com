    <p></p><div class="imageWrap"><img src="http://typophile.com/files/WFA-Logo small_6086.JPG"></div><p></p>
    <p>&nbsp;<br>
    <strong>Monotype Imaging Announces the Second Annual Web Font Awards</strong></p>
    <p><strong>International Competition Recognizes Designers and Websites that Effectively Integrate Web Fonts in Design</strong></p>
    <p>Monotype Imaging Holdings Inc., a leading global provider of text imaging solutions, has launched the <a class="freelinking external" href="http://www.webfontawards.com/2011" rel="nofollow">Web Font Awards website</a> to kick off the second annual competition. Co-presented by U.K.-based Carsonified, an event producer for the Web design and development community, the Web Font Awards is an international contest that recognizes exceptional use of Web fonts in website design. The 2011 call for entries is expected to be announced next month. </p>
    <p>"It's time once again to focus on fantastic Web design that takes advantage of the benefits of Web fonts, such as enhanced creativity and improved brand consistency," said Allan Haley, director of words and letters at Monotype Imaging. "Our inaugural contest attracted an impressive response — a significant achievement for a competition based on technology that's still in its infancy. With the tremendous adoption of Web fonts in just the past year, we anticipate showcasing an even a broader range of exceptional work in 2011." </p>
    <p>In 2010, nearly 200 entries were submitted, which collectively received thousands of votes and comments. Top honors went to "Design Made in Germany," the fifth issue of a German design magazine website, submitted by Martin Rack. His design won both the Community Choice and Judges' Choice awards. "After 11 years as a Web designer, I've finally embraced typography," said Rack. Armit Vit, who placed second for his "Quipsologies/Under Construction" entry, said, "Most of the sites I plan now are by default using Web fonts. I've seen the future and I cannot look to the past!" Third place was awarded to "Markert Immobilien" from David Grasekamp of the mowaii creative agency. </p>
    <p>Qualifying designs for the 2011 Web Font Awards can be built with Web font technology from any provider, including self-hosted solutions, as long as the site or Web page uses actual fonts that are served to Internet-connected machines through the @font-face declaration. There is no limit to the number of entries that an individual can submit. </p>
    <p>All accepted designs will be displayed in a gallery at <a href="http://www.webfontawards.com" title="www.webfontawards.com">www.webfontawards.com</a>, where site visitors can rate each entry one time based on the quality of typography, creativity and usability. The entry with the highest score at the conclusion of the viewing period will receive the Community Choice award. A panel of judges will determine the Judge's Choice winner at the live Web Font Awards ceremony to be held at Carsonified's Future of Web Design conference in New York City this November. </p>
    <p>Further information, including submission guidelines, eligibility requirements, judging criteria and procedures, award ceremony and prize details will be included in the upcoming call-for-entries announcement and published on <a href="http://www.webfontawards.com" title="www.webfontawards.com">www.webfontawards.com</a>. Designers and agencies can sign up now at <a href="http://www.webfontawards.com" title="www.webfontawards.com">www.webfontawards.com</a> to receive notification when the 2011 call for entries is open and contest rules are posted. In addition, the website contains information and contacts for organizations interested in various sponsorship opportunities. </p>
    <p><strong>About Monotype Imaging</strong><br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Inc. All rights reserved.</p>
