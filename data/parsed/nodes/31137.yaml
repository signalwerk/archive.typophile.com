    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: <span class="caps">FF</span>&nbsp;Clifford</strong></p>
    <p><a href="/node/12234" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Akira Kobayashi</a>,&nbsp;1994-1999</p>
    <p>The first drawings of Clifford date back to 1994 and were inspired by Alexander Wilson’s Long Primer Roman type, which was used to typeset an edition of Pliny the Younger’s “Opera”, printed by the Foulis brothers in 1751. The italic is roughly based on Joseph Fry and Sons’ Pica Italic No. 3 in their type specimen dated 1785. The Roman and Italic were combined to create <span class="caps">FF</span> Clifford Nine. Though based on hot-metal type, the face was not intended to be a faithful reproduction; in fact, designer Akira Kobayashi designed the font specifically for digital use. At the same time he wanted to maintain the optically corrected size variations commonly used for lead type so that the design would function as a text face in a variety of sizes. So he added two more versions, called Clifford Eighteen and Clifford Six. The former has more contrast in stroke, narrower letter forms and a tighter fit; while the latter is bolder and wider with sturdier hairlines and serifs and a looser fit. The three Clifford variations were drawn separately (rather than scaled) and some characters were changed to function better in the intended size. Overall the characters of Clifford Eighteen are more lyrical, and the characters of Clifford Six simpler than those of Clifford Nine. But the size indication is merely a recommendation; <span class="caps">FF</span> Clifford can and should be used as the user wishes, or as printing techniques&nbsp;dictate.</p>
    <p><span class="caps">FF</span> Clifford’s extensive character sets are sure to appeal to the typographically intrepid. The normal Roman and Italic weights, for example, include oldstyle figures. The Caps weights contain uppercase letters and small caps. The numerals align with the small caps as do the ampersand, monetary symbols, parentheses, brackets and some of the punctuation signs. The <span class="caps">FF</span> Clifford Experts include a wide variety of ligatures such as: ct, st, ff, fj, ft, ffi, ffl, gy (italic only), and a “publish” character. <span class="caps">FF</span> Clifford <span class="caps">LF</span> contains lining figures. <span class="caps">FF</span> Clifford Italic Alternates <span class="caps">LF</span> includes full character sets with plain J, Q, T, Y and h, replacing the swash letters; as well as lining figures. <span class="caps">FF</span> Clifford Borders is a collection of 18th century borders and ornaments that complement the&nbsp;typeface.</p>
    <p>In the spring of 1998 the Clifford family won first prize in the text font category as well as Best of Show at the First U&amp;lc Type Design Competition in New&nbsp;York.</p>
