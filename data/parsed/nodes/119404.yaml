      <p>Hi<br>
      Defining the features and lookups is a very technical and time-consuming job.<br>
      As far as I know the only free example for VOLT was made by SIL for Sheherazade font - but it did not work for me, and I had to ask an Arab professional.<br>
      There is an excellent booklet pdf that may be helpful to you:<br><a href="http://www.khtt.net/page/31753/en">http://www.khtt.net/page/31753/en</a><br>
      I think you have to join <a href="http://www.khtt.net/">http://www.khtt.net/</a> to access this.<br>
      Good luck<br>
      Vladimir</p>
