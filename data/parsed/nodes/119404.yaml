    <p>Hi everyone.</p>
    <p>I am new in the typography world, so I'm still learning new stuff.</p>
    <p>I started creating Arabic font and I need all knowledge you are willing to share :)</p>
    <p>I created design for each letter in every form and imported them in Fontlab Studio 5.1.<br>
    I still need to define final, initial and medial form through OpenType features (and ofcourse mark positioning).<br>
    I don't know what to type, what code, so if you know some good 'instructions' for this please let me know :)</p>
    <p>Aleksandra</p>
