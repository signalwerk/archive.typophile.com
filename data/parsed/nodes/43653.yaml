    <p>Hello typophiles,</p>
    <p>I’m completely blank on this area, so I thought i would seek advice here. I would greatly appreaciate any feedback.</p>
    <p>I’m looking for suitable type for beer-house, that recently changed it’s name after an old brewery that used to be on the same street (apparently more than 200 years ago – from what I can udnerstand of their PR-material)</p>
    <p>A secondary element of my type choice is the home-like and unpretentious spirit of the beer-house, with their friendly service (e.g. the spirits on the first floor are self serviced, so you just take your glass of whiskey and pay on the way out). But for now, I’d like to just get a hint for tracking up relevant type/fonts for old style breweries.</p>
    <p>My thought is, that I’d rather stay clear of too stereotypical german style blackletters, but still have some of it in it (I’m not even sure if blackletter is a relevant guess in any way, but again, I’m completely blank here!). </p>
    <p>Thank you,<br>
    Malte</p>
