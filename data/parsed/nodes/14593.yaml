      <p>Dan,</p>
      <p>I understand your point about giving students lead time. For some, this an issue, for some, it is not.</p>
      <p>Just to clarify: the first meeting is on <strong>Saturday</strong>, not Wednesday. The second - and last - meeting is in Decemeber. This is an <strong>online</strong> class. Both meetings are optional.</p>
      <p>To answer your question, I didn’t think I’d <strong>have</strong> to advertise! I am a little low on students. But actually, I have advertised earlier, just not here.</p>
      <p>And to answer the second point, we will have a complete InDesign class very soon. Currently, we have an “InDesign for QuarkXPress Users” class (which is face-to-face).</p>
      <p>Thanks for your interest,</p>
      <p>Amy</p>
