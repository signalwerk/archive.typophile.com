    <p>This is not strictly typophiliac but I would like to promote this class of mine:</p>
    <p>Need to learn QuarkXPress for your job? Need to update your page layout skills?</p>
    <p>If you enjoy online communities, this online class maybe just the thing for you! Under the guidance of a caring instructor with over ten years of experience with QuarkXPress, you will work on individual and group projects, on your own time! </p>
    <p>There is no less expensive or more thorough instruction in QuarkXPress available in the Bay Area.</p>
    <p>For more informaion about the class, please read <a href="http://fog.ccsf.edu/~aconger/99aonline.html">this page</a>.</p>
    <p>To apply at CCSF (free!), go <a href="http://www.ccsf.edu/Offices/Matriculation/step1.htm">here</a>.</p>
    <p>(Face-to-face classes are also available. See the full schedule of graphics classes <a href="http://www.ccsf.edu/Schedule/Fall/graphic_communications.html">here</a>. Classes start 8/17/05)</p>
