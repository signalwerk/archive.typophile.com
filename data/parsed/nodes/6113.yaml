  html: "<p>Regarding this old thread: <br><a href=\"http://www.typophile.com/forums/messages/83/42156.html?1091741054\" target=\"_blank\">http://www.typophile.com/forums/messages/83/42156.html?1091741054</a> <br> <br>I wonder if soemone could elucidate? The consensus seems to be that Glaser used American Typewriter Bold - a \"no-brainer.\" But the version on Milton Glaser's web site: <br><a href=\"http://www.miltonglaser.com/projects/logos.html\" target=\"_blank\">http://www.miltonglaser.com/projects/logos.html</a> <br>as well as every version I have ever seen, is slightly different. ITC American Typewriter has a lot more color than Glaser's version.  <br> <br>Any ideas?</p>"
  html_clean: "<p>Regarding this old thread: <br><a href=\"http://www.typophile.com/forums/messages/83/42156.html?1091741054\" target=\"_blank\">http://www.typophile.com/forums/messages/83/42156.html?1091741054</a> <br> <br>I wonder if soemone could elucidate? The consensus seems to be that Glaser used American Typewriter Bold - a \"no-brainer.\" But the version on Milton Glaser's web site: <br><a href=\"http://www.miltonglaser.com/projects/logos.html\" target=\"_blank\">http://www.miltonglaser.com/projects/logos.html</a> <br>as well as every version I have ever seen, is slightly different. ITC American Typewriter has a lot more color than Glaser's version.  <br> <br>Any ideas?</p>"
