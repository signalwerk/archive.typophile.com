    <p>Hello,</p>
    <p>I have a question about the legal issues of typefaces. I understand that each type foundry may have different guidelines but I thought I'd ask here as well since everyone here is so knowledgeable.</p>
    <p>I am looking to purchase a typeface and then go into the typeface files and edit some of the letters as is needed. Would this be a violation of rights or illegal in anyway? It is obviously discouraged but will I run into any copyright issues if I use it for business purposes? I'm thinking "no" but I'd like to know just in case.</p>
    <p>Thanks.</p>
