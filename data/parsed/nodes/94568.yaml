      <p>There is also the old (2007) TypoWiki <a href="http://typophile.com/node/33667" rel="nofollow">EULA Chart</a> that probably still allows you to cross out many foundries that did not allow modifications even for in house use. You look at the "Mods." column. Once only a handful are left, you check the EULA.</p>
      <p>The <a href="http://canadatype.net/eula" rel="nofollow">Canada Type EULA</a> also allows modifications.</p>
