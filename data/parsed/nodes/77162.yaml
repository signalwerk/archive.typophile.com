      <p>That "UX Bookmark" site is interesting. </p>
      <p>Most corporations don't make them publically available because they are viewed as internal documents. In the old days they were often printed manuals in 3-ring binder format with pages of camera-ready logos that could be cut out. These days they're often distributed as PDFs and logos &amp; templates can be downloaded from a password-protected site.</p>
