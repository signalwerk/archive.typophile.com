    <p>Hi there,</p>
    <p>I can't find anywhere on the net of corporate guidelines (downloadable PDF) of companies such as Apple, Adobe, Ikea, Microsoft etc. I want to learn more of how they present guidelines in terms of logo usage, color, templates for products, retail display etc.</p>
    <p>I am looking for corporate guidelines to help me figure out how to present to a company where they products from a retail standpoint as well have a very good corporate design system. </p>
    <p>Or if there are any exceptional books I can buy that would be also ideal.</p>
    <p>Thanks in advance!</p>
