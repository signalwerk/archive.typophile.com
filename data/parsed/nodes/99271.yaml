    html: |-
      <p>This is probably a custom font/lettering of the clock manufacturer.<br>
      You could try to use a similar font like <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-1&amp;ffam=3x5%20-%20Regular&amp;fid=9b9ed06776df35e7dfcb1508f471bc68&amp;fsize=60&amp;text=1234567890&amp;fit=1" rel="nofollow">3x5</a></strong> by K-Type (free for personal use).<br>
      If you make it a bit bold (to hide the intermediate lines) and modify |1| &amp; |2| I think it will be close enough.</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
