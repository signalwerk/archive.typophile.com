    html: |-
      <p>This is probably a custom font/lettering of the clock manufacturer.<br>
      You could try to use a similar font like <strong><a href="http://3x5" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://3x5</a></strong> by K-Type (free for personal use).<br>
      If you make it a bit bold (to hide the intermediate lines) and modify |1| &amp; |2| I think it will be close enough.</p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
