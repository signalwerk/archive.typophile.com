      <p>Matthew Carter has designed another “Big” in the vein of Big Caslon. This one is based on the larger styles cut by Isaac Moore, in the generation after Caslon and modelled after Baskerville’s types. It is called therefore Big Moore. </p>
      <p>I’m not sure exactly when it is scheduled for official release, but the fonts themselves are done. There are, at present, only two styles — Roman and Italic. The hairlines may not be fine enough for your requirement. But if you’re interested, you might contact Harry Parker at the Font Bureau about reviewing/licensing in advance of the release.</p>
