      <p>Funny oldnick, "cheap, cheap, cheap" is not my objective at all but rather quality, quality, quality that fits the intended concept perfectly. Just as gourmet chefs hand select each ingredient and preaper everything from scratch rather then use pre processed and/or canned ingredients nether should a designers use pre processed ingredients like, layout templates, stock art and yes mass consumer fonts (no snobbery meant whatsoever.) A notable portion of the value that comes from design is the uniqueness of what is created but when you use elements that the public can get there hands on they mistakenly get the notion that there is nothing special about design and that, they themselves can "find a better template" and add "several filter effects" to "really" make the design "sparkle." I have never met a wold class photographer, who at one time or another, did not have someone from the public - that is not a professional photographer - comment on how, if they (the non photographer) had that "special, expensive" cameral they  (the non photographer) would take even better photographs then the pro.</p>
      <p>I will be considering your suggestion with all the rest.</p>
      <p>Thanks for the input.</p>
