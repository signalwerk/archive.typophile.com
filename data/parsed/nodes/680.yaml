    date_raw: 11 Jan 2003 — 8:39am
    votes: null
    html: <p>Hello, Brode, I've always been a fan of your work with Sacred Nipple! <br>To be honest I never liked so muck Slick69 but it seems you've reworked it in a really remarkable way in this new version. <br>Honestly, it works great. My only observation (coming also from Slick69) is that the lower legs/stems of R, K, r, k, j, y et al shoud be better reserved as alternates to me. <br>If you put non-swashed versions in the set you will probably get a stronger harmony, while the Swashed ones could be useful for beginnings and endings or for a more economic use (the ones pointing right clashes with the ones pointing left, that's the "problem" I see). <br> <br>Keep up your fantastic work. Sooner or later I'll have to purchase that issue of i-Jusi devoted to type. <br> <br>BTW, iAlfabhethi, iZulu and Rural, among the most recent Nipple types, are strokes of genius (also the names). Holier used to be one of my favorites and Birthriot is a really beautiful different take on P. Scott Makela's Dead History. Shoe Repairs is one of the most beautiful "naif" lettering samples turned into type.</p>
