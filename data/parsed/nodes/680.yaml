  html: <p> Hi all, <br> <br>This is Slicka, (name still be decided),  I've been working on it for a short while now. It's basically a complete overhaul of my brothers font, Slick 69, which I always seemed to use quite a bit of when I was designing any surf related stuff. I always swore I was gonna redesign it the first chance I had cos' I really think it's got some interesting characters. Anyway, I just really liked it and I like my bro' too! <br> <br>I need your help tho' cos' I can't see the wood from the trees anymore. I'm just not sure on a lot of the characters and I don't know whether everything needs to be toned down a bit or cranked up a notch! I guess I just need some motivation and some advice from the wise 'jedi counsel'. <br> <br>Anyway, here are my initial sketches...go mad! </p>
