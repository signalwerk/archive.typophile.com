    html: <p>Here's 'Sackers Engravers Gothic Heavy'. I used an extra outline and used the lower case to simulate the heavier look of the sample. (Either method would have worked, so this could be overkill, but the point was to show how a heavier weight could be achieved with a font. I apologize to the purists.) The cedilla is still wrong, but if metal type was used that part might have been added.<img src="http://www.typophile.com/forums/messages/83/20656.gif" alt="Sackers Engravers Gothic"></p>
