    html: |-
      <p>Hey Nathaniel</p>
      <p>Go take a look at Tour de Ink and then think about have a California lettering artist do what needs to be done.</p>
      <p>There is John Burns, Georgia Deaver, Carl Crossgrove, Carl Rohrs, Sherry Bringham, Lisa Englebrecht (sp), Charle Borges (WA), etc! Go to <a href="http://www.cynscribe.com" title="www.cynscribe.com">www.cynscribe.com</a> and search California calligraphers.</p>
      <p>I have always maintained that the time wasted by art directors going through catalogues or the internet they could have had somebody letter it for the same price that you billed for time spent searching.</p>
      <p>Michael</p>
