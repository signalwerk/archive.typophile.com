    <p>I watched a DVD  on Jim RIMMER, Type design in the 21 Century, put out by P22, and got intrigued by the Ikarus system he used, looks like OS 8 or such.</p>
    <p>I cast on Ludlow, have a decent collection, but also have the equipment to cut mats and have cut mats for Ludlow to suit my needs.</p>
    <p>Anybody has an idea if a system is out there?</p>
    <p>Ludwig</p>
    <p><a href="http://www.krauseintaglio.com" title="www.krauseintaglio.com">www.krauseintaglio.com</a></p>
