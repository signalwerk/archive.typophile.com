  - id: 12903
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 2 Aug 2002 — 2:59pm
    date: 2002-08-02T14:59:00
    votes: null
    html: "<p> Pablo, your text setting confirms a suspicion I originally had: your curved stems do work, but occasionally they come together to form distracting patterns. You wouldn't want to abandon them for that reason (especially since this is no book face), but if you have the energy consider doing what Excoffon did (in his Mistral, and elsewhere): account for the realities of linguistics, like what letter patterns (pairs and triplets, at least) are common, and hence need special attention, in terms of causing you to tilt a given stem one way or the other. <br> <br>I can see that you have two lc \"els\", and you're choosing different ones in your text - that's great! But since a normal font can only have one, which one you choose should depend most on linguistics. And you should ideally do this for all the letters. <br> <br>BTW, if you have even more energy, make an OpenType font that automatically chooses the version of the letter that looks best in the context of what's close to it...  :-&gt; <br> <br>---- <br> <br>In fact, I think I just had a revelation: <br>The more a font uses irregularity (whether it's an  imbalance in color, or elements that don't align - like the stems in Leonor), the more it has to consider real language in managing the proper placement of its irregularities. The more regular a font is, the easier it is to avoid linguistics without affecting the results - but I would argue that regularity (at least in the sense of formal aesthetics) is essentially counter to readability (and legibility too). <br> <br>hhp </p>"
  - id: 12904
    user_id: 527
    user_name: pairth
    user_path: null
    date_raw: 5 Aug 2002 — 9:55pm
    date: 2002-08-05T21:55:00
    votes: null
    html: <p> Hrant <br>It's very cool to see that you're interested in linguistics. I too have studied a little linguistics in school. Mostly just reading on my own. I didn't know about Excoffon and his use of linguistics in his typedesigns. How much time, would I need to do that? And energy? <br>I think your on to something with your theory. In fact I wrote a note the other day in which I dubbed your theory the Theory of Regularity (my computer froze when I submitted it). I think it has a nice ring to it like an important theory that's sweeping the design and scientific community. First the Ivy Leagues then the art schools. Then when you're old Hollywood will make  a movie about you.  <br> <br>Of course, legibility depends on other factors (context, repeated usage, etc) but I think the regularity theory might contribute to a certain degree in the legibility of a font. The thing I find interesting about your theory is that it seems counterintuitive to all that I've been taught about good typedesign. That's a good thing because maybe it creates a basis for challenging the standard notions of readable fonts. Maybe designers should consider language as a way to create interesting letter combinations that read well but when seen on their own are a little desparate. Then when set in text it uses your theory (which you will publish on Typophile.com) to create a highly legible font. <br>I know it's late. <br>Pablo </p>
  - id: 12905
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 6 Aug 2002 — 8:19am
    date: 2002-08-06T08:19:00
    votes: null
    html: "<p> &gt; How much time, would I need to do that? And energy? <br> <br>Energy: I don't know - it depends on what kind of person you are. <br> <br>Time: Basic linguistic awareness doesn't drain much time, it's mostly just an \"attitude\". You might spend maybe 20% more time than you would without it, but your results will be much better. It includes small things like using certain test texts for setting your font, but also subtle changes to a letterform based on what other letters it might be next to, etc. But if you want to go to high level (like write special software to show you what's *really* going on in language), then that's a lifetime. <br> <br>&gt; Then when you're old Hollywood will make a movie about you. <br> <br>Can I get Uma Thurman as the love-interest?  ;-) <br> <br>I don't think the \"Theory of Regularity\" :-) is very important - I think it might serve mostly to make designers aware that letterforms are not paintings. <br> <br>&gt; it seems counterintuitive to all that I've been taught about good typedesign. <br> <br>Yes, for some reason a lot of what I do seems disruptive to the status quo. :-/  You know, so many people declare that it's good to \"think outside the box\", but usually it's just to serve their ends - they dislike change just like most other people. There's so many wrong things in typography, but I don't mind that - what I mind is people denying it - it kills the soul - it results in people wasting too much time trying to satisfy The Customer, at the expense of culture. <br> <br>&gt; Maybe designers should consider language as a way to create interesting letter combinations that read well but when seen on their own are a little desparate. <br> <br>Good thought! It's pretty simple, really: people read words, so we need to design not letters, but words! Duh. <br> <br>hhp </p>"
  - id: 12906
    user_id: 1215
    user_name: kentlew
    user_path: null
    date_raw: 6 Aug 2002 — 4:06pm
    date: 2002-08-06T16:06:00
    votes: null
    html: "<p> Hrant, come on! If you want to design words, then turn your attention to logos or lettering . . . or Chinese! The marvel of an alphabetic system like ours lies in the fact that it is a discrete combinatorial system: a relative few elements are combined in innumerable ways to create near infinite variety.  <br> <br>The price we pay for that flexibility is a certain compromise -- each element should combine equally with every other. That's the theoretical goal, anyway. Naturally, it breaks down in reality. That's why we're all still out here dreaming up new typefaces.  <br> <br>But the more specific you make the design to a particular set of combinations, the more limited the design becomes. And when taken too far, you completely defeat the purpose of moveable type. </p>"
  - id: 12907
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 6 Aug 2002 — 4:49pm
    date: 2002-08-06T16:49:00
    votes: null
    html: <p> &gt; The marvel of an alphabetic system like ours lies in the fact that it is a discrete combinatorial system. <br> <br>Of course you're right - and that's the best thing about an alphabet. Its versatility is why the Phoenicians (international merchants) needed it badly enough to invent and use it. <br> <br>So you still need the individual letters, sure. <br> <br>&gt; completely defeat the purpose of moveable type. <br> <br>I think that purpose is reading. And we read words. <br> <br>hhp </p>
