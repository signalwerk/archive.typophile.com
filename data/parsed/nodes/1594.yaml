  html: "<p><!---Attachment: leonor.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">leonor.swf<br><a href=\"http://www.typophile.com/forums/messages/29/leonor.swf\"><b>leonor.swf</b></a> (5 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br> <br>I have been following the critiques for sometime and I have learned a lot from them. This is a design that I did for an independent study in school. I have really tried to finesse the forms to make them as ledgeable as possible given the quirkiness of the crooked stem. I'm not sure if it fits within this category of type or the sans serif. I decided its more of a serif face than a sans. Anyways, I just wanted see what the typophiles thought. Weather good or bad I can handle it.<!--!-/attachment-!--><!--!-attachment:--><p></p>"
