  - id: 12909
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 7 Aug 2002 — 12:03am
    date: 2002-08-07T00:03:00
    votes: null
    html: <p>Yes, Excoffon was French (and how!), and because he focused on the French language Mistral has some problems with certain common English letter combinations. <br> <br><a href="http://www.typophile.com/forums/messages/30/1405.html" target="_top">http://www.typophile.com/forums/messages/30/1405.html</a> <br> <br>&gt; all his linguistical adjustments for French (or whatever language) didn't help when people started using Mistral in other languages. <br> <br>Well, considering that French and English as well as the other "big" languages that use the Latin alphabet are all Indo-European, I think there's enough overlap that any linguistic awareness particular to one language will generally have some positive effect overall in another language. But I totally agree that it's best to optimize. Maybe have the basic font with its spacing constant, but have kerning files (which can be external, at least in the PostScript format) for different languages, and let the user choose. <br> <br>Also note that OpenType can do this sort of thing very elegantly. <br> <br>&gt; Are we supposed to begin designing typefaces with words in mind before anything else? <br> <br>I don't know - it really depends a lot on what personally turns you on. But it remains true that -during immersive reading- we decipher words most of the time, and resort to recognizing/compiling individual letters mainly when we encounter an unfamiliar word (which is rare). <br> <br>hhp</p>
  - id: 12910
    user_id: 1215
    user_name: kentlew
    user_path: null
    date_raw: 7 Aug 2002 — 5:32am
    date: 2002-08-07T05:32:00
    votes: null
    html: "<p><i>&gt;&gt; completely defeat the purpose of moveable type.</i>  <br>&gt;I think that purpose is reading. And we read words. <br> <br>No, the purpose of the <i>alphabet</i> is words and the purpose of words is reading. But the purpose of <i>moveable type</i> is so that we don't have to keep writing letters afresh each time -- i.e., printing. <br> <br>Again: you want to design words? Switch to lettering or calligraphy. (For those who don't know, these are buzzwords carefully chosen just to needle Hrant.)  ;-&gt; <br> <br>-- K.</p>"
