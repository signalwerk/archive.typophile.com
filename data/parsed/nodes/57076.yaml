    <p><strong>Fountain and PSY/OPS in a joint release</strong></p>
    <p><strong>Catacumba Pro</strong> - inspired by tomb inscriptions</p>
    <p>Fountain and PSY/OPS come together in a special joint release of a<br>
    new typeface from Portuguese type designer Rui Abreu.</p>
    <p>Catacumba Pro is a six-weight typeface inspired by the painted<br>
    inscriptions of the <em>Igreja de São Francisco</em> church's catacombs in<br>
    Porto, Portugal. The forms are clearly influenced by Victorian<br>
    style, with an unmistakable French heritage, and yet they somehow<br>
    convey a decidedly Portuguese sensibility.</p>
    <p>Catacumba's centerpieces are its two titling styles: the exuberant<br>
    <strong>Excelsa</strong>, and the Didonesque <strong>Moderata</strong>.<br>
    From these two decoratives, four new cuts are derived. These,<br>
    the <strong>Text</strong> fonts, are tamer and more understated, but maintain<br>
    the same artisanal grounding and DNA as the display fonts.<br>
    Each Catacumba font includes a wide selection of OpenType ranges<br>
    and features, allowing for extensive use within the Latin range.</p>
    <p>Designed by Rui Abreu and mastered by PSY/OPS</p>
    <p><strong>Catacumba Pro can be found at:</strong><br>
    <a href="http://www.fountaintype.com/typefaces/catacumba" title="http://www.fountaintype.com/typefaces/catacumba">http://www.fountaintype.com/typefaces/catacumba</a><br>
    <a href="http://psyops.com/catacumba" title="http://psyops.com/catacumba">http://psyops.com/catacumba</a></p>
    <p><strong>Video for Catacumba can be found at:</strong><br>
    <a href="http://www.youtube.com/watch?v=1dzrc5ARH3k" title="http://www.youtube.com/watch?v=1dzrc5ARH3k">http://www.youtube.com/watch?v=1dzrc5ARH3k</a><br>
    <a href="http://www.fountaintype.com/typefaces/catacumba/about" title="http://www.fountaintype.com/typefaces/catacumba/about">http://www.fountaintype.com/typefaces/catacumba/about</a></p>
    <p><strong>For a limited time (until May 16) we are offering<br>
    a special price of 89 Euro / 124 USD for the complete family.</strong></p>
    <p>Thank you for your time<br>
    and have a nice day</p>
    <p>Peter W. Bruhn [Fountain] &amp;<br>
    Rodrigo Xavier Cavazos [PSY/OPS]</p>
    <p>About:<br>
    Fountain is an independent and friendly digital type<br>
    foundry based in Malmö, Sweden. We’ve been<br>
    sending out nice typefaces to the world since 1993.<br>
    (<a href="http://www.fountaintype.com" title="www.fountaintype.com">www.fountaintype.com</a>)</p>
    <p>PSY/OPS is a type design studio in sunny/foggy San Francisco.<br>
    (<a href="http://www.psyops.com" title="www.psyops.com">www.psyops.com</a>)</p>
