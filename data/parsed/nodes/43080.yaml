    html: <p>My personal opinion (which obviously doesn't match the official Microsoft position) is that if and when we ever legitimately need those domains (for example if there's an OpenType Consortium set up at some point) we won't have any problem getting them back. In the meantime I personally don't have a problem with MTI or Ralf looking after those domains, especially if they're using them to promote OpenType and type design in general.</p>
