    <p>I have just notice FontBolaget have a new website:<br><a href="http://www.opentype.se">http://www.opentype.se</a></p>
    <p>Using OpenType in the domain name goes against the Microsoft trademark guidelines for OpenType.<br><a href="http://www.microsoft.com/about/legal/intellectualproperty/trademarks/usage/opentype.mspx">http://www.microsoft.com/about/legal/intellectualproperty/trademarks/usa...</a></p>
    <p>I wonder how long they will be able to keep that website going for.</p>
