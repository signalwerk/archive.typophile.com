      <p>This one was easy to me, I worked on DocVadis project some years ago and I remember headlines and main logo were set in Sansumi.<br>
      For the rest, I don't use WTF anymore but still post on WTF forum. WTF is not accurate at all to me. The tools I'm using now are <a class="freelinking external" href="http://www.whatfontis.com/" rel="nofollow">WhatFontiS</a>, <a class="freelinking external" href="http://bowfinprintworks.com/TheLists.html" rel="nofollow">Bowfin Printworks' lists and fonts identification guides</a>, <a class="freelinking external" href="http://www.identifont.com" rel="nofollow">Identifont</a>, Chrome's code inspector and <a class="freelinking external" href="http://chengyinliu.com/whatfont.html" rel="nofollow">Chengyin Liu Chrome App WhatFont</a>.</p>
