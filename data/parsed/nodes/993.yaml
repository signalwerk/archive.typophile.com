    html: <p>Not much to say from me. <br> <br>Personally I think I have wasted my life in typography and recommend against participating in it. <br> <br>It is highly contagious, and I think for some, incurable. I don't think they have yet clearly defined it's specific cause but apparently it inflicts people with laughter, wild romantic dreams, imaginary travel and the desire to spend money they do not have.  <br> <br>Some have come to pretend to be great prophets of both knowledge and wisdom. They are noted for preaching incredible thoughts simultaneously wearing heavy round "glass contraptions on their noses which are wired to their ears". Some, are shockingly serious! Worse, others influence innocent young children in schools causing them to become taxpayers. You just know the trouble that causes. <br> <br>And that's just the people that look at it! <br> <br> <br>Gerald Giampa</p>
