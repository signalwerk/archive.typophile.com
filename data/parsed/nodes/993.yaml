    html: <p>Hello fans, good morning from Finland! <br> <br>Jacques &amp; Hrant, <br> <br>Typography started for me when innocently drinking in my youth with this man who spouted the doctrines of the "black arts". <br><a href="http://www.lanstontype.com/WilHudson.html" target="_blank">http://www.lanstontype.com/WilHudson.html</a> <br> <br>So this could happen to your child? <br><a href="http://www.lanstontype.com/GiampaPipePress.html" target="_blank">http://www.lanstontype.com/GiampaPipePress.html</a> <br> <br>Oh, just think, I started off as one sweet lovable little baby born in a tent only to become a dastardly run-away-printer when I was at the tender age of 13. What an unlucky number. <br><a href="http://www.lanstontype.com/GiampaIntroduction.html" target="_blank">http://www.lanstontype.com/GiampaIntroduction.html</a> <br> <br>That's exactly what happened to me. That "evil alcohol" led me straight down the path to typography. <br> <br>And just look at me now. <br><a href="http://www.lanstontype.com/GiampaSummerFinland.html" target="_blank">http://www.lanstontype.com/GiampaSummerFinland.html</a> <br> <br>Gerald Giampa <br>Lanston Type Company</p>
