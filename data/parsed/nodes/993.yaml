    date_raw: null
    votes: null
    html: <p>Hi emma, pretty risky, to ask such a question on a forum like this. <br> <br>To start simple, let us first scale the design disciplines to graphic design.  <br> <br>You will not come around the fact that text will have to be used in graphic design. Even if its one drawn character at 8 pt. on a big poster. <br> <br>I think typography can be seen as one of the graphic design tools. Like for example color is one. Every decision you take, that has to do with text, even if you decide to use all the possible default settings, or even the decision not to use text, is typography. <br> <br>Design is the resulting balance of all the decisions you took of how to use and into what effect, of all the design tools. Such as color, size, paper, typography, psycology, language, target public, marketing theories and so on... <br> <br>---Jacques</p>
