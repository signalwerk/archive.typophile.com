      <p>The problem is not Cleartype per se. The problem is more complex: Different operating systems and browsers use different rendering engines, different fonts have different amounts of hinting (a coding language that helps the rendering engines interpret curves as pixels at low resolutions) and different font smoothing settings and there’s also different font formats.</p>
      <p>Rendering on Windows is, by now, roughly 30% Greyscale – 70% Cleartype. Greyscale is declining rapidly, and some time in the future we’ll probably get DirectWrite which does a better job in some cases.<br>
      The pixellated look you see is a font displayed with Greyscale rendering that have the font smoothing settings turned off at some sizes (some think this helps readability). Too look good with those settings, you need A LOT of hinting. With Verdana, which is one of the best at this, the hinters spent years to get it right and the actual design of the letters also sort of confine to the pixel grid. (It’s advanced.)<br>
      At Typekit the best fonts probably have more like a couple of days or weeks worth of hinting, which will make it look so-so with Greyscale rendering and fairly good with Cleartype rendering. The worst fonts are terrible, with no hinting or perhaps some autohinting, like Titillium (and it’s also not a very good typeface in the first place, some people even felt it was a ripoff of another typeface called Klavika). This is the downside of typography being such a trendy thing nowadays: lot’s of flash, not so much substance.</p>
      <p>Mac OSX (the other large operating system) use something called Quartz rendering that makes everything smooth. People differ in opinions on whether it’s good or not. (The idea is that letterforms are more important than fitting everything to the pixel grid.)</p>
      <p>Some Linux systems use Freetype rendering, which last time I checked look quite good indeed. This is a very low number, though.</p>
      <p>As for your request for a squarish font that you can use with @font-face: Although it’s not squarish, I think <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_nuvo_web/" rel="nofollow">FF Nuvo Web</a> give a similar techy feel. It is also available via <a class="freelinking external" href="http://typekit.com/fonts/ff-nuvo-web-pro" rel="nofollow">Typekit</a>. Neither of these options are free, and it’s up to you to decide between subcribtion and a one-time fee.</p>
