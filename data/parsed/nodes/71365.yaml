      <p>@Kevin<br>
      This is what I was talking about (and indeed what I actually thought about, but forgot to mention in the heat of writing :P) when I wrote of technicalities. You might not be aware of this, but I've expressed my dislike of Cleartype in this forum (in fact, of all anti-aliasing at small sizes) and I never use it, always turn it off. With Cleartype on, you <em>can</em> use any typeface with some degree of safeness that the outlines will be maintained and that the typeface will be recognizable, but then you'll see that not only you still need a good typeface, with good hinting (which gives you a typeface which plays nice with anti-aliasing but also should with aliasing), but also you get this halo around letters which, to me, not only makes everything look blurry, but almost denies the fundamental idea of text which is that it is black ink on white paper. But that's just me, I always rub my eyes when I look at Cleartype text because I think I might have blurry vision. So you have to take into consideration that different people will see your sites differently because they'll have different computers, operating systems and overall definitions and setups.</p>
      <p>@Dezcom<br>
      I know that. I understand that. And so do you. And that's why I expect better from regular and older users of Typophile. We are aware of all that and we should also be aware that some are not.<br>
      We always get caught up comparing type with other items, but we have to understand it's <em>not</em> the same as a car. It will never be. People feel entitled to letters; letters appear everywhere. They're free. You buy a computer, there they are. You can write stuff, print stuff. Type is comparable to not many things. And we should be aware of this. We can't act as if everybody who comes here should know what they won't. Type is not your ordinary product. It's mainly ideas in a digital bag, it's not a physical object, made with iron and rubber and what not. I mean, we know this, it's even silly for me to mention it, but we do have to understand that type is not a common product and can't really be compared with one; unless you're trying to make a point to explain this to someone, in which case it should be noted that you're just making a point.</p>
      <p>And I thought about what you said after posting and understood that it was probably a typical Yiddish joke, and I'm not one of those people who discriminate their humour (you know, call it “dark humour”): I'll make a joke about 9/11 or deformities as easily as a scatological joke, and hyperbole is one of my favourite types of humour, I don't care about the morality of humour. But still, we went from someone asking for something not <em>that</em> irrational to suggesting, even if it's under the guise of humour, that he should get cancer. That's a bit of a stretch. Besides, I think you're not even like me in that respect; you do always display a great sense of humour and an enjoyment in building and sharing jokes, but I believe you do impose some limits on it, so it seemed out of place that you'd not only make such a joke, but use it as a throwing weapon. (I'm sorry for writing as if I know you, but, you know… I hang around here, I read what you write; so I kind of <em>do</em> know you.)</p>
      <p>I didn't say we should apologize for people like Kevin, and you know that. The truth is, he wasn't acting as if type designers should work for free, because that would imply that he was fully informed on what he was saying. He was just asking for something that, to him, sounded reasonable. We shouldn't apologize for them, but we do have a lead role in presenting them with the data and in raising awareness of these things.</p>
      <p>Music had (and still has) this same problem that type has, but some steps have been taken in order to protect the industry. With iTunes, for example, they made buying music cool, so people developed a notion that it should be payed for.<br>
      … but maybe it really shouldn't! Can't you see it both ways? Don't you understand it both ways? I mean, it's just soundwaves. If I walk around on the street, I'll eventually hear it. Type is in a somewhat similar position (although it's a tool and music is mostly entertainment), and people don't understand that. There's MyFonts or Fontshop, but they're not iTunes for fonts because they're not famous or popular enough.</p>
      <p>Anyway, I just think we should always display some fairplay in these situations and it makes me sad that we don't. It makes me sad to see intolerant reactions from people whom I consider to be grown-up, smart, cultivated and thus indeed tolerant.<br>
      And there I go writing a lot again. I'm sorry for that.</p>
