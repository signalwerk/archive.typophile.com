      <p>kevinthepeople&gt; Be alert about ClearType. </p>
      <p>Yes, we understand this and many of us are working hard to help solve this problem. We have been working to expand the best web text families, and to create a new suite of text-only font families in a variety of styles, and to add meta data to fonts. To get around the combination Quartz/Standard-Cleartype-None solution to the 20-year transition/non-transition of users from aliased to antialiased text type on a broadening variety of screens is hard work. </p>
      <p>Many people here are working on and supporting readers in developing simple- and inexpensive-to-use products, but they will not soon be offered by foundries alone, as many have pointed out <em>it's expensive.</em> Until more OS/Foundation/Web-Based Enterprise awaken to this issue, free fonts like your not entirely unreasonable specification, are somewhere in the future. </p>
      <p>In the mean time, I suggest kevinthepeople evaluate how important the early adoption of an @fontface-based visual text identity is to you? You must please excuse some of the truly hysterical responses here. I've already been hysterical, others are still working it out.</p>
      <p>Dex&gt; I am working on a similar font, it is called "The Emperors New Clothes"</p>
      <p>We've already been through this, The Emperors New Clothes is what got k.t.people here.:)</p>
      <p>Ethan&gt; I'd like to hear how Berlow would respond.</p>
      <p>And, it reminds me of Rosalind Russell's line, hand on hip I think, in <em>His Girl Friday</em>:<br>
      "<strong>Gentlemen</strong> of the press!?", except that the badgered girl is not going to jump out the window, and she's not alone by a few billion. </p>
      <p>Cheers!</p>
