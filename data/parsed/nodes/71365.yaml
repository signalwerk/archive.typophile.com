      <p>Woo, let's all get together and have a bashing party! Let's get all smart on him! We'll show him! We'll use our cleverness in sarcastic speeches that he might not even understand! Let's unite around our hatred for those who do not get it! Yes! That always works nicely!</p>
      <p>:(<br>
      These threads always make me want less to be on Typophile… I really, honestly, hold you all up to a higher standard than this.</p>
      <p>Kevintheophile, this might not have been made clear in a nice way, but maybe you got it already: what you're asking for isn't really fair. And maybe it even exists (and if it does, someone's bound to eventually come here and give you what you asked for), but it probably doesn't.</p>
      <p>Also, there are some other things you might be overlooking:</p>
      <p>What do you want this typeface for? To use it on websites, you'll have to either have it on Flash or an image of some kind or use some kind of @font-face thing (I'm not too familiar with those), because nobody will have this font on their systems and it won't show up on regular html text. Why not just use Verdana, Georgia, Tahoma, Arial, Trebuchet? (I guess, from reading your other threads, you've been over this.)</p>
      <p>Typefaces are hard to produce and design, you need expertise, time, the right tools; all good type-designers (those who will, logically, produce the best fonts) are fully aware of this and feel/know they deserve compensation for their hard work. I'd love to produce quality typefaces and give them out, but the day I finally get the expertise and the tools and come up with the first one, it's possible that I'll think twice about that. After all, the tools cost money, the expertise might, too, and my time should probably have some value.</p>
      <p>You should also know it's common for people to come here asking for free fonts (whatever for), and the very first ones might not have had this treatment, but by now this is the regular treatment; it's just become such a common thing that people here don't want to take the time to explain all of this and whatever else, because, for them, it's a repeating event. We easily forget that other people might not be aware of all this, regardless of how long they've been a member on this site.</p>
      <p>Also, there's a lot of technical things you don't seem to be up-to-speed about, judging from your posts, and this forum is very specific; so much so that we usually prefer to discuss the technicalities over explaining little, now-to-us-seemingly-obvious things like how to increase letters in Fontlab or any other software. You might need to study more, read more, and search for answers before you ask. You know, browse the web, search help-files, search Typophile on Google (try the following on Google: site:typophile.com free fonts), etc.; many of the things we want to know are explained somewhere. Also, you might need to be more specific with what you're asking for and why so that people can really help you.</p>
      <p>Isn't there a page where the gist of this is explained? Can't we just direct people like Kevin to that instead of resorting to this…? If not, why not just not answering them…? Sure, ignoring people is wrong too, but blatantly alienating is worse…</p>
      <p>And cancer? Really? Exaggerate much…? You all might not care, but I want you to know I like you all and respect you and expect more than this.</p>
