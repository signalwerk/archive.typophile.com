      <p>Rubens and people, I want to tell the problem that I found and discovered. It wasn't Titillium, it was ClearType.</p>
      <p>At house I tested the Windows Xp Professional and Windows Seven. At Windows Seven, I got surprised when I saw Titillium is totally legible and beautiful in the small sizes at my blogs. At Windows Xp Professional, I tested the Titillium font, it wasn't legible in the small sizes. Verdana, Veggieburger, Yanone Kaffeesastz, etc aren't legible in small sizes in this system either. But not because of the systems. I discovered it was ClearType. While Windows Seven has optimized and activated ClearType, Windows Xp profession hadn't optimized or activated the ClearType. I went to my friend's house who uses the Windows Xp Professional, I test the Titillium, it wasn't totally legible in the small sizes, when I changed to Arial, Helvetica and Verdana, I got frightened when I saw that Arial, Helvetica and Verdana aren't legible at all, became terrible, were distorted to pixels or bittamped. I also tested the high quality paid fonts at MyFonts.com in his computer, they weren't legible at all, were terrible! I understood that it was ClearType, it wasn't optimized or activated. I went to cyber cafe, I tested three computers which Windows XP Professionl, only in two computers they have optimized and activated ClearType, Titillium is totally legible and in another one computer happened the same thing that my friend's computer. </p>
      <p>Be alert about ClearType. </p>
      <p>I have to write a warning to the visiters and readers when they visit mu blog or site that they must correct or download the ClearType when the fonts aren't legible in their comouters.</p>
      <p>If you don't know what ClearType, there's the links for you to learn:<br>
      <a href="http://www.microsoft.com/typography/cleartype/tuner/step1.aspx" title="http://www.microsoft.com/typography/cleartype/tuner/step1.aspx">http://www.microsoft.com/typography/cleartype/tuner/step1.aspx</a><br>
      <a href="http://en.wikipedia.org/wiki/ClearType" title="http://en.wikipedia.org/wiki/ClearType">http://en.wikipedia.org/wiki/ClearType</a></p>
