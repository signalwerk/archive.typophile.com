    <p>Hello people!</p>
    <p>I'm tired of Titillium and TitilliumText22L! It's not legible in small sizes or in 11, 13, 14px in the sites or blogs! Titillium isn't like Arial, Helvetica and Verdana. Titillium is totally legible only in Word 2007 with optimized ClearType, Paint, Photoshop, Illustrator, Inkscape and Gimp. </p>
    <p>I need a free and ORIGINAL font which...<br>
    — sans-serif<br>
    — totally legible in small sizes (10 to 14px)<br>
    — contemporary<br>
    — corporate<br>
    — fashionable<br>
    — modern<br>
    — squarish<br>
    — techno<br>
    — text. </p>
    <p>Thanx u all!</p>
    <p>Kevin</p>
