    <p>I have a simple fontlab question - While finishing my kern font I realize that the values I used are a bit tight for my taste, so I want to add (+) all my kerning values +30 for example so they still well kerned but more space in equal proportions. Is there any easy way to do this? :S Hopefully yes!</p>
    <p>Thanks!</p>
