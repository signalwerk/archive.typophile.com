      <p>I'm not sure how you would do it in FL - I'm sure there must be a way.</p>
      <p>This little script will add a value to all kerning pairs - be careful it will alter all your pairs.</p>
      <p><code><br>
      from robofab.world import CurrentGlyph, CurrentFont<br>
      from robofab.interface.all.dialogs import AskString</code></p>
      <p>f = CurrentFont()</p>
      <p>kerning = f.kerning</p>
      <p>kern = int(AskString('Increase/Decrease Kerning'))</p>
      <p>kerning.add(kern)</p>
      <p>if kern &gt; 0:<br>
      	print "kerning Decreased by"<br>
      	print kern<br>
      elif kern &lt; 0:<br>
      	print "kerning Increased by"<br>
      	print kern</p>
      <p>f.update()<br>
      </p>
