    date: 2003-09-26T00:29:00
    date_raw: 26.Sep.2003 12.29am
    votes: null
    html: "<p>Hi Hernan. I'm extremely busy these days, but I really  <br>need new stationary and business cards, and a personal  <br>website would be nice too. Would you want to design  <br>those for me? For free? <br><img src=\"http://www.typophile.com/forums/clipart/wink.gif\" border=\"0\"> <br> <br>Behind every beautiful typeface there is a person.  <br>Mark van Bronkhurst, who designed ITC Conduit in 1997,  <br>depends on the sales of his work (the types he designs)  <br>for an income. I don't think he'd appreciate it if the  <br>fruit of his labour (and believe me: it takes a <i>LOT</i> of  <br>time, work and dedication to design a succesful typeface)  <br>was given away for free, just as you wouldn't like  <br>it if the logos you design were not paid for. <br> <br>I don't want to sound preachy, but this is the third  <br>request for font piracy in a week on \"our\" board,  <br>and I don't think I really like this evolution. It's  <br>like going to a jewelers' convention and ask where  <br>you could steal some jewelry. Get the picture? <br><img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
    html_clean: "<p>Hi Hernan. I'm extremely busy these days, but I really  <br>need new stationary and business cards, and a personal  <br>website would be nice too. Would you want to design  <br>those for me? For free? <br><img src=\"http://www.typophile.com/forums/clipart/wink.gif\" border=\"0\"> <br> <br>Behind every beautiful typeface there is a person.  <br>Mark van Bronkhurst, who designed ITC Conduit in 1997,  <br>depends on the sales of his work (the types he designs)  <br>for an income. I don't think he'd appreciate it if the  <br>fruit of his labour (and believe me: it takes a <i>LOT</i> of  <br>time, work and dedication to design a succesful typeface)  <br>was given away for free, just as you wouldn't like  <br>it if the logos you design were not paid for. <br> <br>I don't want to sound preachy, but this is the third  <br>request for font piracy in a week on \"our\" board,  <br>and I don't think I really like this evolution. It's  <br>like going to a jewelers' convention and ask where  <br>you could steal some jewelry. Get the picture? <br><img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
