    html: "<p>At least he asked politely! I am totally with Yves  - good post. There are folks posting these same questions to MyFonts.com all the time. I work at a place that sells typefaces and we often get that response: \"HOW much!!??\" like it's a big shock when you tell them the cost. I think people (especially those of a certain age brought up on the wonders of the internet) expect a free ride too often. The trouble is, they will probably find Conduit for free on some dodgy freeware site. <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\"></p>"
