    <p>Hello everybody</p>
    <p>I am new to this forum and need some help with one of my clients who would like to me to design a book and some art prints for him. </p>
    <p>The brief is to find: "one of those classic 1930's Dutch sans serif faces that can be related to Piet Zwart's work.<br>
    It does not need to be Dutch — but should convey a sober, direct quality with the friendly but mildly Calvinist overtones of Dutch modernism." </p>
    <p>Does anyone have any thoughts on that??</p>
    <p>So far I presented him DTL Nobel, Akzidenz Grotesk, Gill Sans, Grotesk MT. I am aware that they don't 100 % match the brief, but couldn't really find anything closer... </p>
    <p>I'd be very grateful for some further suggestions!</p>
    <p>Thanks heaps!</p>
