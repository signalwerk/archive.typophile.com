    html: <p>Not me, unfortunately. <br> <br>It's not even a budget problem, just a timing issue. I have several key work projects that will be at a critical juncture around this time, and I can't be out for a week (which is what it would be what with preparing a talk, and travel time). <br> <br>Anyway, I think David Lemon, Christopher Slye and Harold Grey will be there from Adobe. Christopher only has one key-deadline project on his plate, luck guy.  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>T</p>
