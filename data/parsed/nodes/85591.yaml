    html: <p>Oh, I'm curious if anyone knows more. I've had this happen too, with commercially available fonts, in CS4 (only the squooshed justified line, where the red arrow is, though; not the other blobs); I've been able to fix it locally by changing the hyphenation somewhere before or after the line in question. But I wonder why it happens – I've been thinking it's probably InDesign getting confused about H&amp;Js (I've only had it happen in longer documents / books).</p>
