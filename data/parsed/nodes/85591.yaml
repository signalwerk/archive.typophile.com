    html: |-
      <p><cite> &gt; I've been able to fix it locally by changing the hyphenation somewhere before or after the line in question. </cite></p>
      <p>I’ve had this sort of thing occur if I limit the number of hyphens in a row too severely. A line that obviously begs for hyphenation doesn’t have any — <em>and</em> I can’t seem to force it to — until I realize that it has reached its limit and that’s why it’s squooshing or spacing in an extreme fashion.</p>
      <p>Another example of why it’s not necessarily good to tie the hands of InD’s H&amp;J engine too tightly.</p>
      <p>I don’t think that’s what’s going on in the OP’s example. And it might not be what’s going on in your case.</p>
      <p>But I thought I’d mention it, since it’s easy to overlook.</p>
