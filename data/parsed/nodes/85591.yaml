      <p><cite> &gt; Could it be that the code for these is still in the .otf file and corrupting it?</cite></p>
      <p>Good question. Crack the .otf open and see if it is.</p>
      <p>It seems like the issue could be related to a feature gone awry, especially if turning off a feature solves the problem. But I think we’d need to see what characters are in those lines that got collapsed in order to troubleshoot along those lines.</p>
      <p>Also, it would helpful to see what H&amp;J setting you’re using on that setting.</p>
