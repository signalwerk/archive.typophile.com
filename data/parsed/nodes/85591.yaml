    <p>I'm not sure in what forum to post this, so here goes.</p>
    <p>In InDesign CS5 my new font (.otf) comes out really strange. It seems as if all characters on one line have all been compressed to te left. See the image below.</p>
    <p>Is this something I did wrong in FL? Or has it to do with InDesign? I use XPress and haven't seen this problem at all.</p>
    <p>Any help is appreciated!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/strangetype_6024.gif"></div><p></p>
