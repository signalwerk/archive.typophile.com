    <p>Ayo,</p>
    <p>I have a conscript (constructed script) I have been working on for over a decade. Recently been trying to build a "vector generation" system. The best I can come up with so far is a "symbol per word font generator".. basically every word has to be entered (one glyph for sit, one for sat, one for sitting)</p>
    <p>I have exhausted most avenues, and the best idea, besides a "per-word-font" is a custom generation system, but this is a huge project. is there any typography software, or anything at all, that could help "jump start me" or even do this. I have search extensively and found nothing.</p>
    <p>Here are a couple example of how it works, i realize the flexibility is way beyond standard font software. but is there maybe something that could work, even if it doesn't use the full abilities of Dscript, and half way there would be good enough at this point.</p>
    <p>or is there something opensource that might be a good starting point to build such a system?</p>
    <p><img src="http://dscript.org/sites/default/files/styles/large/public/field/image/all_human_beings_are_born_free.gif"><br>
    <img src="http://dscript.org/sites/default/files/styles/large/public/field/image/totally_enormous_extinct_dinosaures.gif"><br>
    <img src="http://dscript.org/sites/default/files/styles/large/public/field/image/doctor_who_dscript.gif"><br>
    <a class="freelinking external" href="http://dscript.org/dscript.pdf" rel="nofollow">more example and explanation</a></p>
    <p>Here is an example of what the "per word font" system generates now<br>
    <img src="http://dscript.org/sites/default/files/styles/large/public/field/image/crow_pitcher_story.gif"><br>
    <a class="freelinking external" href="http://dscript.org/story/crow_pitcher_story_big.gif" rel="nofollow">full size pic</a></p>
    <p>The other option is to restrict the "flexibility" out and revert back to a "single straight string" like it was back in the beginning of the scripts evolution, (like the free online <a class="freelinking external" href="http://dscript.ca/genpage.php" rel="nofollow">Dscript generator</a>) Here is an example of what it generates.<br>
    <img src="http://dscript.org/sites/default/files/styles/large/public/field/image/dscript_generator.gif"></p>
    <p>But I really want to find something that will allow for more flexible connection and 2d placement. any suggestions?</p>
