    html: |-
      <p>This smacks of custom type design.</p>
      <p>This logo replaced an earlier version that was set in Lubalin Graph Bold:<br>
      <a href="http://www.myfonts.com/fonts/itc/lubalin-graph/" title="http://www.myfonts.com/fonts/itc/lubalin-graph/">http://www.myfonts.com/fonts/itc/lubalin-graph/</a></p>
      <p>The type in the new logo may be a heavily customized adaptation of Lubalin Graph Bold Italic:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/LubalinGraph_4495.png"></div><p></p>
      <p>Plume Ad Italic, by Dalton Maag, comes close for the |F| (and it’s not bad as a starting point for the |X|):<br>
      <a href="http://www.myfonts.com/fonts/daltonmaag/plume/" title="http://www.myfonts.com/fonts/daltonmaag/plume/">http://www.myfonts.com/fonts/daltonmaag/plume/</a></p>
      <p>New York to Las Vegas might work for the |O| (and it’s also not a bad starting point for the |X|):<br>
      <a href="http://www.fontbros.com/families/new-york-to-las-vegas/styles/regular" title="http://www.fontbros.com/families/new-york-to-las-vegas/styles/regular">http://www.fontbros.com/families/new-york-to-las-vegas/styles/regular</a></p>
