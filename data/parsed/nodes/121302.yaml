      <p>I understand the reasoning behind it, and I think that, given the right treatment, it will not look too corporate (think Fendi). One gripe, though, is that it reminds me a bit of a buckle, so, again, to me, it says more purse or belt than gloves.<br>
      Anyway, I think the first thing to do should be refining the wordmark: it looks pretty rough for an high end brand.</p>
