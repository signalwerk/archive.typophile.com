    html: <p>A couple of additional thoughts. Rotating the icon 45 degrees within the background square might make it more interesting. You also might try eliminating the background square, or trying other shapes for the background, or maybe even a color gradient (although you'd still need a black-and-white version for xeroxes, etc).</p>
