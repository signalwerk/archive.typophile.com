  html: |-
    <p>hi, I'm trying to find a similar font to the one attached...</p>
    <p>it's more sans serif looking than this and doesn't have a lot of 'air' in the letters  - very dense</p>
    <p>it has a very subtle antique/organic edge to the strokes and reminds me a little of germanic woodcut letters</p>
    <p>i think there's a couple of weights</p>
    <p>it's definitely not new, probably been around since the 70s</p>
    <p>any help appreciated!</p>
