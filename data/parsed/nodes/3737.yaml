    votes: null
    html: <p>I too am a student, and the way I see it, a logo for myself is not a great idea. If you are going to have a firm or something of your own, then I would name it, and give it a mark of some kind. Since I see this as something for your portfolio, and you may be trying to show your portfolio for the purpose of getting a job, I would stick to a type system. Create a hierarchy of typeface, weight, size, etc., and carry it throughout your materials. This shows you as an individual, and someone who knows what is goin on. If you have a mark, it looks like you're a firm. <br> <br>whichever you are going for is fine, but I think a clear distinction needs to be made. <br> <br>And yeah, I agree that you should push it. You mention Swiss somethingorother, maybe look for an expressive USE of a typeface, rather than script. <br> <br>Aaron</p>
    html_clean: <p>I too am a student, and the way I see it, a logo for myself is not a great idea. If you are going to have a firm or something of your own, then I would name it, and give it a mark of some kind. Since I see this as something for your portfolio, and you may be trying to show your portfolio for the purpose of getting a job, I would stick to a type system. Create a hierarchy of typeface, weight, size, etc., and carry it throughout your materials. This shows you as an individual, and someone who knows what is goin on. If you have a mark, it looks like you're a firm. <br> <br>whichever you are going for is fine, but I think a clear distinction needs to be made. <br> <br>And yeah, I agree that you should push it. You mention Swiss somethingorother, maybe look for an expressive USE of a typeface, rather than script. <br> <br>Aaron</p>
