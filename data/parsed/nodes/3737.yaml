      <p>Hey guys I just wanted to say thankyou for the critique over a year ago it actually lead me to find the TYPOGRAPHIC solution I needed. Harsh critiques spawn restrategizing. JII is my simple logo now, </p><div class="imageWrap"><img src="http://typophile.com/files/selfid_5599.jpg"></div><p></p>
      <p>The reasoning for the logo.. Joseph Thomas Maguire III  JTM III  JII...<br>
      I have a strong family line 20th most noble last name from Ireland. I am the the third, My last name begins with an M and first letter starts with a J. It's all of me, its encompassing and its simple. I found it through alot of sketching, and playing. and I am very happy with how it came out. You can see it in action along with my family coat of arms on my website at <a href="http://www.sisudesigns.com" title="www.sisudesigns.com">www.sisudesigns.com</a></p>
      <p>Thanks to all who critiqued!</p>
      <p>Joseph Maguire III<br>
      Communications Designer</p>
