    <p>I'm looking for something similar (square or extended, technical looking, but still very readable) and I remember being on a website that had loads of good ones like this a while ago, but I can't find it again (probably directed there the first time round from Pixelsurgeon if that helps). Any font and/or website suggestions?</p>
    <p>Thanks in advance.</p>
