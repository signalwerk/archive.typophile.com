  - id: 418545
    user: 2021
    date: 2010-07-02T13:25:00
    date_raw: 2 July 2010 - 1:25pm
    votes: 0
    html: |-
      <p>Optima can certainly complement Palatino, in a rather obvious manner, as you infer.<br>
      They have similar letter forms, and a similar degree of gloss representing the trace of process: the flaring and concave terminals in Optima, and the flexed serifs of Palatino. </p>
      <p>If you are prepared to focus more on that surface element of style, rather than the letter proportions, you might consider faces such as <a href="http://new.myfonts.com/fonts/berthold/laudatio-bq/">Laudatio</a> or my <a href="http://www.shinntype.com/brown.html">Brown Gothic</a>.</p>
    html_clean: |-
      <p>Optima can certainly complement Palatino, in a rather obvious manner, as you infer.<br>
