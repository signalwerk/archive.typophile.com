  - id: 418545
    user: 2021
    date: 2010-07-02T11:25:00
    date_raw: 2 Jul 2010 — 11:25am
    votes: null
    html: |-
      <p>Optima can certainly complement Palatino, in a rather obvious manner, as you infer.<br>
      They have similar letter forms, and a similar degree of gloss representing the trace of process: the flaring and concave terminals in Optima, and the flexed serifs of Palatino. </p>
      <p>If you are prepared to focus more on that surface element of style, rather than the letter proportions, you might consider faces such as <a href="http://new.myfonts.com/fonts/berthold/laudatio-bq/" rel="nofollow">Laudatio</a> or my <a href="http://www.shinntype.com/brown.html" rel="nofollow">Brown Gothic</a>.</p>
    html_clean: |-
