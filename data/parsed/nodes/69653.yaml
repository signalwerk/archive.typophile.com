  html: |-
    <p>Here is a Python script that dumps to the output a utf-8 input file. The script works fine on Linux but if the input contains characters above U+FFFF it does not behave as expected on the Mac with whatever version of Python I use (I tried with Python 2.5, and 2.6 on OS X 10.5, and with Python 2.5, 2.6 and 3.1 on OS X 10.6).</p>
    <p>Here is the <code>dumpchars</code> script:<br>
    <code>---<br>
    import sys, codecs, unicodedata<br>
    infile=codecs.open(sys.argv[1],"r","utf-8")<br>
    text=infile.read(); infile.close()<br>
    &nbsp;<br>
    def dump(char):<br>
    &nbsp;&nbsp; try:<br>
    &nbsp; &nbsp; &nbsp; print('%04X %s' % (ord(char), unicodedata.name(char)))<br>
    &nbsp;&nbsp; except:<br>
    &nbsp; &nbsp; &nbsp; print('%04X' % (ord(char)))<br>
    &nbsp;&nbsp;<br>
    for char in text:<br>
    &nbsp;&nbsp; dump(char)<br>
    ---</code><br>
    If, on Linux, (even on the <a href="http://laptop.org/en/laptop/index.shtml" rel="nofollow">OPLC</a>) I run <code>python dumpchars in.txt</code> on the file <code>in.txt</code> containing a line with the characters a, b and a CJK unified ideograph (that makes Typophile's editor crash, so I had to remove the following line)</p>
    <p>I get<br>
    <code><br>
    0061 LATIN SMALL LETTER A<br>
    0062 LATIN SMALL LETTER B<br>
    230B7 CJK UNIFIED IDEOGRAPH-230B7<br>
    000A<br>
    </code><br>
    as expected. If I do the same on a Mac with any version of Python, from 2.5 to 3.1, I get this:<br>
    <code><br>
    0061 LATIN SMALL LETTER A<br>
    0062 LATIN SMALL LETTER B<br>
    D84C<br>
    DCB7<br>
    000A<br>
    </code><br>
    Characters above FFFF are not handled properly. I get that same output on a PC (I tried with python2.6)</p>
    <p>Does anyone know of a solution to this problem aside from always having to rely on a "Linux box" ? </p>
    <p>Michel</p>
