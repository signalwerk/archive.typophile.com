    html: |-
      <p>Michel, </p>
      <p>unfortunately, by default Python is compiled in the UCS-2 version so it only supports Unicode BMP. It's possible to install Python from sources in the UCS-4 mode, but it means you need to do some compilation. It's also possible to install the UCS-4 version of Python from MacPorts (using Porticus). </p>
      <p>Adam</p>
