    html: <p>I don't think this is a font issue. I think it is an application and layout engine issue, and I suspect Microsoft are making decisions about colouring marks with bases on the basis of <em>character</em> level analysis in their Arabic shaping engine, so nothing you do at the glyph level is likely to have any impact.</p>
