    html: |-
      <p>In Word, display/colouring of Arabic marks is controlled at the application options level based on the OpenType GDEF table 'mark' category, i.e. glyphs designated in the GDEF table as marks will be separately coloured from base letters. This is a pretty crude mechanism, and one that I hope to see replaced or accompanied by a more sophisticated approach that will enable font developers to specific exactly which glyphs should be coloured separately. The present mechanism cannot distinguish between diacritic marks and e.g. decomposed dots, which makes it break for nastaliq and other styles in which dot decomposition and dynamic positioning is the most efficient way to shape the script.</p>
      <p>Note also that to take full advantage of the current Word mechanism you need to decompose some precomposed Unicode Arabic characters such as أ and إ using the OpenType 'ccmp' feature, and then position the hamza signs as marks. Otherwise they will not be separately coloured.</p>
      <p>VOLT writes the GDEF table, so as long as your mark glyphs are categorised as such in the VOLT glyph info, this should work. You need to categorise them as marks in order to use them in anchor attachment GPOS lookups anyway.</p>
      <p>In Word, open the Options and look for the diacritic display options. I can't remember exactly where these are in Word 2003.</p>
