    html: <p>This isn't really an Arabic question per se; it's more of a Build question if anything. And an interestingly difficult one. I don't think Word or any major layout program allows different elements of a single glyph to have different colors (without converting to outlines), so it would require a solution where the diacritic is a separate glyph from the base character, but contextually positioned relative to that character. And then the color would have to be applied by the end user (perhaps aided by scripting). Or am I missing some easier way to do it?</p>
