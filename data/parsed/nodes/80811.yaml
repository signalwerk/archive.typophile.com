      <p>I believe the problem here is particular to the way in which Microsoft handles letter+mark combinations in Word and in at least some other applications (I've tested Wordpad, but not yet any of the browsers). There is no way to select and colour individual combining mark characters independently of the letter base to which they are applied. I've confirmed that this is still the case in Word 2010.</p>
      <p>So I'm afraid the only help I can offer is to suggest that you try InDesign ME.</p>
