    html: |-
      <p>Open the regular font in Font Lab. Under “Font Info,” change the name to New Sans, and select Normal as the weight/style. Then use the “Build Names” buttons (both of them), and generate a new font IN A DIFFERENT FOLDER.</p>
      <p>Open the bold version, name it New Sans, select Bold as the weight/style, build the names, then generate a new font.</p>
      <p>MOVE the old fonts out of your fonts folder and install the new ones…oughta work.</p>
