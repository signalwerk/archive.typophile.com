    html: |-
      <p>Totally agree with Renko, most probably a custom job. Plus, really don't know any Latin Tuscan Condensed such like this. As a sidenote, "Lionel" custom type and main woodmark differ also a bit: x-height, latin serif position (/L, /E, /N...). They surely share the same design backbone though, one derived from the other. They may have started creating main woodmark (possibly as described below) then extend this 5-letters job to an alphabet.<br>
      If I have to reproduce it, I'd probably start from one of these following condensed sans, adding latin (triangular) serifs and median spurs: <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/dharma-gothic" rel="nofollow">Dharma Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/revolution-gothic" rel="nofollow">Revolution Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/house-of-cards" rel="nofollow">House of Cards</a> (serifs need to be tweaked), <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/sheepman" rel="nofollow">Sheepman</a></strong> (possibly lacking a bit of height but latin serifs are already here, just needs to add median spurs), <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/teniers" rel="nofollow">Teniers</a> (same work as House of Cards), <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/prince.php" rel="nofollow">Prince</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/bootcamp.php" rel="nofollow">Boot Camp</a> Spurs, <a class="freelinking external" href="http://www.dafont.com/face-off-m54.font" rel="nofollow">Face Off M54</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/tempus-gothic" rel="nofollow">Tempus Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/coniglio/nomad" rel="nofollow">Nomad</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/unionthug.php" rel="nofollow">Union Thug</a>, <a class="freelinking external" href="http://www.typography.com/fonts/tungsten/overview" rel="nofollow">Tungsten</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/gatf/alfrere-sans" rel="nofollow">Alfrere Sans</a>, <a class="freelinking external" href="http://www.antreposhop.com/product/public-gothic-square" rel="nofollow">Public Gothic Square</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/a2/beckett" rel="nofollow">Beckett A2</a></p>
