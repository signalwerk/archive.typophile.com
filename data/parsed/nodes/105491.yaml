    <p>I'm looking to identify this font.  I've scoured the internet, but have not had any luck.  It was found here:  <a href="http://www.mr-cup.com/blog/3.html" title="http://www.mr-cup.com/blog/3.html">http://www.mr-cup.com/blog/3.html</a> , but I haven't been able to find a font that is similar to this one.  I'm wondering if the branding company did a one-off for this client?  If not, what are some similar fonts that you know of?  Thanks for your help!!!</p>
