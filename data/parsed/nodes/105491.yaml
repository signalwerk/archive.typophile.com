      <p>Totally agree with Renko, most probably a custom job. Plus, really don't know any Latin Tuscan Condensed such like this. As a sidenote, "Lionel" custom type and main woodmark differ also a bit: x-height, latin serif position (/L, /E, /N...). They surely share the same design backbone though, one derived from the other. They may have started creating main woodmark (possibly as described below) then extend this 5-letters job to an alphabet.<br>
      If I have to reproduce it, I'd probably start from one of these following condensed sans, adding latin (triangular) serifs and median spurs: <a href="http://www.myfonts.com/fonts/flat-it/dharma-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Dharma Gothic</a>, <a href="http://www.myfonts.com/fonts/flat-it/revolution-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Revolution Gothic</a>, <a href="http://www.myfonts.com/fonts/flat-it/house-of-cards" title="Click to visit an external URL." class="freelink freelink-external freelink-external">House of Cards</a> (serifs need to be tweaked), <strong><a href="http://www.myfonts.com/fonts/flat-it/sheepman" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Sheepman</a></strong> (possibly lacking a bit of height but latin serifs are already here, just needs to add median spurs), <a href="http://www.myfonts.com/fonts/woodentypefonts/teniers" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Teniers</a> (same work as House of Cards), <a href="http://www.letterheadfonts.com/fonts/prince.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Prince</a>, <a href="http://www.letterheadfonts.com/fonts/bootcamp.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Boot Camp</a> Spurs, <a href="http://www.dafont.com/face-off-m54.font" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Face Off M54</a>, <a href="http://www.myfonts.com/fonts/t26/tempus-gothic" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Tempus Gothic</a>, <a href="http://www.myfonts.com/fonts/coniglio/nomad" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Nomad</a>, <a href="http://www.letterheadfonts.com/fonts/unionthug.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Union Thug</a>, <a href="http://www.typography.com/fonts/tungsten/overview" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Tungsten</a>, <a href="http://www.myfonts.com/fonts/gatf/alfrere-sans" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Alfrere Sans</a>, <a href="http://www.antreposhop.com/product/public-gothic-square" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Public Gothic Square</a>, <a href="http://www.myfonts.com/fonts/a2/beckett" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Beckett A2</a></p>
