      <p>Side spurs were a popular 19th century way to ornament a font.<br>
      "Latin" fonts -- where the serifs are triangular -- were also popular.<br>
      This particular combination of Latin serifs and spurs is unusual.<br>
      To duplicate, I would follow the same procedure as Ryuk; choose a squared sans of similar weight and add Latin serifs and spurs.<br>
      The closest squared serif that I was able to dig out is <a href="http://www.myfonts.com/fonts/emtype/geogrotesque/bold/ "> Geogrotesque Bold </a> by Emtype.<br>
      Don</p>
