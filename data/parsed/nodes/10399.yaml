    html: "<p>Linotype licenses several fonts from Monotype. Monotype could have a newer version on their site. I do not know. <br> <br>Since the initial distribution of Times (New Roman) in the 1930s, there has been collaboration between Monotype and Linotype regarding design and distribution. Monotype's drawing office made the original design for the London Times, but most newspapers at the time were set by Linotype machines, so a (slightly different ?) version had to be produced for those. <br> <br>The Linotype versions, called simply Times (as opposed to Monotype's Times New Roman) can be found via the following links: <br><a href=\"http://www.linotype.com/86030/timesten-family.html\" target=\"_blank\">http://www.linotype.com/86030/timesten-family.html</a> <br><a href=\"http://www.linotype.com/1537/times-family.html\" target=\"_blank\">http://www.linotype.com/1537/times-family.html</a> <br><a href=\"http://www.linotype.com/86584/timeseighteen-family.html\" target=\"_blank\">http://www.linotype.com/86584/timeseighteen-family.html</a></p>"
