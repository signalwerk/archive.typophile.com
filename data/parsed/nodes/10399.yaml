  html: <p>Linotype sells a version of Times New Roman. At the bottom of the pdf sample pages, it says "Times New Roman is a trademark of Monotype Typography". <br> <br>Does this mean that the version Monotype sells, and Linotype sells, is exactly the same?</p>
