    date_raw: null
    votes: null
    html: <p>I have fond (or not so fond) memories of working with a Typositor at my first job in a NYC type shop. You had to be quick and consistent with your setting otherwise the individual characters would develop to different levels of black. <br> <br>The problem with using these now is the supplies. Process photo devleoper is easy to come by, but those two inch rolls of photo-sensitive paper are hard to find.  <br> <br>Peter Bain has done a lot of research into Typositor. He has one, with a large library of film fonts. He has popped in here from time-to-time. He is the one to ask.</p>
