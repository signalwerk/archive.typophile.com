    votes: null
    html: <p>No, you're thinking of the kind of phototypesetting machine that was primarily used for setting text.  <br> <br>A Typositor was designed for setting display type (from 18- to 144-point). There was no keyboard or display. It had a 2"-wide strip of negative film with 72-point character images and worked sort of like a photographic enlarger, so you would crank it up or down to get the desired point size. To set type on it, you had to peer into a narrow slot where the characters would be projected in red light onto a strip of photographic paper. When the character was positioned properly, the red filter would be removed briefly to expose the paper. Since the paper was actually sitting in the developing solution, the exposed character would immediately turn black. You then moved the strip to the left to get ready for the next character. Characters were selected by cranking the film font reel back and forth.  <br> <br>Spacing was entirely dependent on the skill of the operator. Typositor film fonts had no spacing indications at all, although baseline alignment was very acurate. A skilled operator could produce very high quality results with the machine, especially compared to other techniques available at the time. Digital type is the only thing that has surpassed it in terms of image quality for display type.</p>
