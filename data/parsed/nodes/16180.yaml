      <p>Hello Highlander</p>
      <p>&gt;Is there somewhere at Adobe that will do the work?</p>
      <p>I think you answer your own question there - most foundries invite custom work and glyph modifications to their products, as long as they are the ones who are doing such work and getting paid for it, and the customer has provided some kind of rationale in their commission to have the product modified. Adobe is not likely to be an exception to this.</p>
      <p>Have you tried posting your question directly to their <a href="http://www.adobeforums.com/cgi/webx?13@@.eea5b3a" rel="nofollow">forum?</a></p>
