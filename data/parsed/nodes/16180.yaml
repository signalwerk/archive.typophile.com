    <p>I just read the Adobe EULA, and it pretty much nixs doing any glyph modification to the font. Is there somewhere at Adobe that will do the work? Is there a way to get permission to make modifications? Does anyone have any insight to this? I've pasted the applicable parts of the EULA below.</p>
    <p>4.2  No Modifications. Except as permitted in Section 14.7, you may not modify, adapt or translate the Software. You may not reverse engineer, decompile, disassemble or otherwise attempt to discover the source code of the Software except to the extent you may be expressly permitted under applicable law to decompile only in order to achieve interoperability with the Software.</p>
    <p>14.7. Font Software. If the Software includes font software --</p>
    <p>14.7.1 You may use the font software with the Software on Computers as described in Section 2 and output the font software to any output device(s) connected to such Computer(s).</p>
    <p>14.7.2 If the Permitted Number of Computers is five or fewer, you may download the font software to the memory (hard disk or RAM) of one output device connected to at least one of such Computers for the purpose of having the font software remain resident in such output device, and of one additional such output device for every multiple of five represented by the Permitted Number of Computers.</p>
    <p>14.7.3 You may take a copy of the font(s) you have used for a particular file to a commercial printer or other service bureau, and such service bureau may use the font(s) to process your file, provided such service bureau has a valid license to use that particular font software.</p>
    <p>14.7.4 You may convert and install the font software into another format for use in other environments, subject to the following conditions: A computer on which the converted font software is used or installed will be considered as one of your Permitted Number of Computers. Use of the font software you have converted will be pursuant to all the terms and conditions of this agreement. Such converted font software may be used only for your own customary internal business or personal use and may not be distributed or transferred for any purpose, except in accordance with Section 4.4 of this agreement.</p>
    <p>14.7.5 You may embed copies of the font software into your electronic documents for the purpose of printing and viewing the document. If the font software you are embedding is identified as "licensed for editable embedding" on Adobe’s website at <a href="http://www.adobe.com/type/browser/legal/embeddingeula.html" title="http://www.adobe.com/type/browser/legal/embeddingeula.html">http://www.adobe.com/type/browser/legal/embeddingeula.html</a>, you may also embed copies of that font software for the additional purpose of editing your electronic documents. No other embedding rights are implied or permitted under this license.</p>
