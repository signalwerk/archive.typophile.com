    <p><strong><a href="http://www.typetanicfonts.com/#TransatText" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Transat Text</a></strong> is a new geometric sans serif type family, and is the more rational sibling to the unabashedly Art Deco "<a href="http://www.typetanicfonts.com/#Transat" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Transat</a>". Transat Text has a slightly taller x-height than its counterpart, as well as more rationalized character widths, shorter descenders and fewer design eccentricities, making it easier to read in text settings. While designed to shine in paragraphs, it also performs admirably in larger display settings.</p>
    <p>Transat Text includes many OpenType features, such as ligatures, small capitals, case sensitive forms, stylistic alternates, arbitrary fractions, and a full complement of proportional, tabular, and oldstyle figures. With nearly 700 glyphs, it provides support for most European languages. The Transat Text family includes 5 weights plus optically-corrected obliques.</p>
    <p><strong>Transat Text</strong> is currently available at <a href="http://MyFonts" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://MyFonts</a>, <a href="http://YouWorkForThem" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://YouWorkForThem</a>, and <a href="http://crtv.mk/dLKX" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Creative Market</a>. For a limited time, you can get the full family of 10 fonts for just <strong>$30</strong>.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/transat_text_slide01.png" width="1440" height="720" alt="">
