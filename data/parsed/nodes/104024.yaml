    html: |-
      <p>Thanks for all the kind words, everyone!</p>
      <p>Sim, my decision to oblique the hyphen was just my aesthetic opinion — I've seen other fonts do it (most notably in my mind FontBureau's "Whitman") but not many sans serifs. I like the slight quirk that it gives the finished face and it also seems to add some motion to hyphenated words.</p>
      <p>I don't have any alternates for the hyphen, though all the dashes are the standard horizontal style.</p>
