    <p><strong><a class="freelinking external" href="http://www.typetanicfonts.com/#TransatText" rel="nofollow">Transat Text</a></strong> is a new geometric sans serif type family, and is the more rational sibling to the unabashedly Art Deco "<a class="freelinking external" href="http://www.typetanicfonts.com/#Transat" rel="nofollow">Transat</a>". Transat Text has a slightly taller x-height than its counterpart, as well as more rationalized character widths, shorter descenders and fewer design eccentricities, making it easier to read in text settings. While designed to shine in paragraphs, it also performs admirably in larger display settings.</p>
    <p>Transat Text includes many OpenType features, such as ligatures, small capitals, case sensitive forms, stylistic alternates, arbitrary fractions, and a full complement of proportional, tabular, and oldstyle figures. With nearly 700 glyphs, it provides support for most European languages. The Transat Text family includes 5 weights plus optically-corrected obliques.</p>
    <p><strong>Transat Text</strong> is currently available at <a class="freelinking external" href="http://www.myfonts.com/fonts/typetanic-fonts/transat-text/?refby=typetanic" rel="nofollow">MyFonts</a>, <a class="freelinking external" href="http://www.youworkforthem.com/font/T4497/transat-text?affId=160188" rel="nofollow">YouWorkForThem</a>, and <a class="freelinking external" href="http://crtv.mk/dLKX" rel="nofollow">Creative Market</a>. For a limited time, you can get the full family of 10 fonts for just <strong>$30</strong>.</p>
