      <p>The inclined hyphen isn't something unique to Whitman, similar hyphens are used in many other typefaces, particularly Venetian-style serifs like Adobe Jenson, Goudy Old Style and William Morris' Golden Type (Whitman just happened to be the first font that came to mind).</p>
      <p><strong>EDIT:</strong> Charles, sorry — I now understand what your comment was re: Whitman. I only said FontBureau because Kent's name escaped me for the moment and I only remembered the publisher. Generally if I know their name I do credit the designer when mentioning other typefaces.</p>
