  html: <p>Hello, my name is David from PLANET� Magazine, a global culture and lifestyle magazine out of San Francisco, CA. We are currently looking for a contributor for an upcoming digital diary section of the magazine. If you are an avid photographer, and would love to document your life, not to mention see it published in a nationally published magazine, this would be the perfect opportunity for you. The project is deadline critical as we are going to press in a couple of weeks. If you have any questions, please email me at <a href="mailto:david@planet-mag.com">david@planet-mag.com</a> <br> <br>Thanks again. <br> <br>Best, <br> <br>David Fung</p>
