      <p>Thanks for your comment André. I do use a mac and I have read somewhere that Helvetica Neue is an OSX systems' font on most if not all versions (mine is Snow Leopard). When I've got a moment I'll check in my Library Fonts. I guess that still doesn't help with having to change 55 and roman (and the other weights) backwards and forwards if other people one works with don't realise the difference.</p>
      <p>So it seems that there are at least 3 foundries (Adobe, Linotype AND Monotype) for this font then! I will check back with the client as suggested.</p>
      <p>Thanks again<br>
      Jade</p>
