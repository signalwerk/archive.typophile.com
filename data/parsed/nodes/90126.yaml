  html: |-
    <p>Hello everyone</p>
    <p>I'm doing a job using Helvetica Neue for a client who has specified that it should be from the Monotype foundry. On checking my fonts (in Quark's utilities) it says what I have used is an Adobe Systems Type 1 Postscript font. When I looked online to research about purchasing the Monotype version I keep finding it mostly available as either Linotype or Adobe but Monotype is really rare, other than from 1 US font site. Certain sites imply that Linotype and Monotype are the same so I'm rather confused!!! Are they all different from the 3 foundries?</p>
    <p>In addition I find it very puzzling that there is a Helvetica Neue Roman AND a Helvetica Neue 55 (or light and 45 etc) in my drop down font menu as the pairs are each of the same or similar weight. Is this because they are from 2 different foundries that has mixed up in my system (I use Suitcase Fusion)? Sometimes when I get work returned from colleagues having originally used the '55', I find that it's been changed to the 'roman' version or vice versa and I need to change it back again. I am concerned that if I include the Monotype version it'll add another layer of 'concern' to this existing one.</p>
    <p>Another thing is, why do one sometimes see the font listed as Neue Helvetica, and Helvetica Neue (reversed order). Other times it's spelt as HelveticaNeue with no space between the 2 words and other times there's a space. Again is this because they are from different foundries?</p>
    <p>I do love this font and would like to clear up these points.</p>
    <p>Any help and advice would be thankfully appreciated.</p>
    <p>Jade</p>
