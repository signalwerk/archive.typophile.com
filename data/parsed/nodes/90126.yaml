    html: |-
      <p>Are you on a Mac? If so, the 'Helvetica Neue Roman' is likely the version installed in /System/Library/Fonts whereas the Helvetica Neue Roman 55 is the one you've installed via Suitcase.</p>
      <p>AFAIK, the Adobe, Linotype, and Monotype versions all use the same outline data. I'd double check with the client, though.</p>
      <p>André</p>
