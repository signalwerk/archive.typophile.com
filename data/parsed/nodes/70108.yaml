    <p>I've recently taken over as the IT director for a student organisation at the university I attend. As part of my duties, I'm in charge of all the organisation's graphic design. Because my uni is in southern Louisiana, someone years ago decided that the logo has to incorporate a prawn, but the old logo was in my opinion not really recognisable as anything. This is old logo:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/avant_3984.png"></div><br>
    And this is one I am working on:<br>
    <div class="imageWrap"><img src="http://typophile.com/files/apres_5807.png"></div><br>
    I tried to make it more apparent what it was supposed to be and also make it look less Looney-Tunes-esque. Any criticism anyone could give would be appreciated. I'm not a graphic designer, but the responsiblity falls to me, so I'm doing my best.<p></p>
