    html: |-
      <p>Can you tell us a little about the student organisation in question? What's it's purpose? This really helps define the insignia as well as the typeface you use.</p>
      <p>My main concern with your revised version is that it's, errr, wiggly. The image certainly says "prawn" to me far more than the previous version. However, by nature prawns aren't good at being self-contained.</p>
      <p>I keep seeing possibilities with circles on this one. You may try bounding the prawn via curling it up in a more circular shape, or creating a boundary (i.e. thin-lined circle) that the prawn's feelers break.</p>
      <p>Challenging assignment, good luck!</p>
