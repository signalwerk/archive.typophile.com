    html: |-
      <p>Legibility used to mean the ability to decifer symbols as in identify glyphs or alphanumeric characters. Readability was initially intended to distinguish the comfort level in reading running text. It was assumed that you could identify the glyphs but all the other reading factors also came into play including line length and leading, etc..<br>
      Today, there is confusion among the masses and it seems only scientists and typophiles differentiate any more :-)</p>
      <p>ChrisL</p>
