    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 25.Jun.2009 12.07pm </div>
      <p>* An illustrated talk at St Bride Library<br>
    * Tuesday 30 June 2009 at 7pm<br>
    * In the Bridewell Hall, St Bride Foundation<br>
    * Admission £7; concessions £5; Friends of St Bride £3<br>
    * Pay on the door</p>
    <p>Many examples of student work from the Visual Communications Program at<br>
    the University of Delaware are intended to insight a lively conversation<br>
    about the value of letterpress in contemporary design education. Ashley<br>
    John Pigford and William Deering will speak about the Raven Press at the<br>
    University of Delaware as a place of unbridled experimentation and<br>
    phenomenological education.</p>
    <p>Professor Ashley John Pigford is an artist, designer, musician and<br>
    educator who works across a wide range of art and design media including<br>
    video, sound, installation, performance, sculpture, micro-electronics<br>
    and letterpress. His current employment as Assistant Professor of Visual<br>
    Communications and Co-director of Raven Press at the University of<br>
    Delaware is paired with an active art/design studio practice. Ashley<br>
    received his MFA in Graphic Design from the Rhode Island School of<br>
    Design in 2006 after a successful career as a proprietor of graphic<br>
    design in Los Angeles, CA.</p>
    <p>Professor William Deering is the coordinator of the Visual<br>
    Communications program, teaches photographic design, Co-directs the<br>
    letter press facility Raven Press and the London Study abroad program in<br>
    the Department of Art, University of Delaware. His many awards over the<br>
    past 30 years have included: The American Institute of Graphic Arts, The<br>
    Art Directors Club of New York, Communication Arts, Print, The One Club,<br>
    and the Society of Publication Designers.</p>
    <p><a href="http://stbride.org/events/analogsource" title="http://stbride.org/events/analogsource">http://stbride.org/events/analogsource</a></p>
