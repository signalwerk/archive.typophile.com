    <p>I love Cezanne and it suits my purposes perfectly. However, I'm worried it's been used too much (please, please, don't let it become another Papyrus!).</p>
    <p>Can anyone suggest a substitute?</p>
    <p>I'd like the same qualities of Cezanne, with the same or better legibility. Thanks!</p>
