  html: |-
    <p>EDIT<br>
    The Word file is a mess, I Think it's more easy to apply the styles by hand.<br>
    How do you guys handle crappy Word files? (It's lots of text 200 pages A4 [Times 12pt] with lots of superscripts, headers sub headers etc.)</p>
    <p>Hi There,</p>
    <p>My first post here, hope someone can help me!</p>
    <p>I'm trying to find the right workflow to import a Word document with it's paragraph styles still intact and then modifying them.<br>
    I want to do this so I can use the headers, quoted texta and plane text paragraphs and change them. In that way I don't have to select text and apply the styles by hand.</p>
    <p>I can get the text to import with the paragraph styles but then when I go and change the styles it goes wrong.</p>
    <p>This is what I did:<br>
    I placed the text, checked the "show import option". Made sure the "Preserve Styles and Formatting from Text and Tables " was checked. Let the text Auto Flow holding down Shift.</p>
    <p>All goes well up to this point. Al the paragraph styles are imported.<br>
    When I select some text the paragraph style for this text is highlighted in panel so all whent well.</p>
    <p>Problem is, having the text selected: the highlighted paragraph style is also showing the + symbol. Meaning there's local formatting done. The selected text is 10 pt, but when I bring up the corresponding paragraph style I see it should be 12.</p>
    <p>So now I have to remove the + (local formatting) without having to select the text.<br>
    I tried to use the "find and change" function, there I selected the paragraph style and replaced it with a new one. But it didn;t find all the right text.</p>
    <p>If someone had a similar problem or knows a better workflow to all of this, please let me know!<br>
    Cheers Heyman</p>
