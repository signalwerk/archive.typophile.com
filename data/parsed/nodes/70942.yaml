    html: <p>The thin cuts don’t work there, because they are slayed by the bold ones. And in example A JAMES looks still slightly higher than Timothy. From the three examples C looks the best, but I would try a heavier weight. And while the sans serif, that you used, did not necessarily need a bit more spacing, the serif does, if you set the word in capital letters only. In case of C I don’t feel uncomfortable with the different point sizes. In example A James is already spaced too wide. (When I wrote about the letter spacing, I did not mean, that it is needed, but should be tried only.)</p>
