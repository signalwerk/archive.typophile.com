    <p>I am working on a monogram style logo for a musician, and would like some comments to help me refine the lockup.  The musician plays trumpet and also some other instruments, and is classically trained.  He performs and teaches in classical and jazz improvisation styles.  I wanted the mark to capture the elegance and sophistication of the music, and also fit in with something like a University setting.  I am happy with the concept but the typography seems to be where I am having the most questions, but feel free to comment on any of it.  Here is where I am with it so far:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TimJames3_5144.png"></div><p></p>
