      <p>@frode frank: The note head could come level a bit more I suppose.  It was important to maintain authenticity in the note shape because the audience and client are sensitive to what often comes off as cartoonish or caricatures of music symbols in a lot of music related graphics.  But there is some room for rotating it a bit.  It does impact the curve of the J but perhaps that could be a benefit.  I will try it, thanks.</p>
      <p>I can see collaborating with another designer as an alternative to online feedback, thats a good option.  I agree that there is a danger of design by committee via message board.  But I feel this thread has been productive, and I am happy with how the mark has progressed as a result of some of the feedback I have received.  That's reason enough for me!</p>
      <p>@evanbrog: I think I see what you mean.  I will play around with that.  The J in the original font is very narrow with a tiny hook, and so I modified it as well as some of the other letters (A and T especially).  I was trying for a J a bit like Frutiger black but with a taper to match the weight variation of the other letters.  But I can see trying some other options, thanks for the visual!</p>
