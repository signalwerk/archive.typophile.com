    html: |-
      <p>Thanks for the comments!  I did have the T symmetrical, but I started to look for something in the negative space on the left.  Maybe that's just me.  I will play around with making it more similar but slightly different.  I thought maybe the note is not obvious enough, and having the odd T helps you see the note.  But then again, I kind of like how the note is not obvious at first, but easily seen after looking.  I wonder how obvious it needs to be and how quickly others see it.  Or did others miss it entirely?</p>
      <p>I am wondering if Bodoni would work for everything or if anyone has any other suggestions.  I kind of wanted to bring is a juxtaposition or slight contrast between the type faces to suggest more variety to the music (from classical orchestra to pub jazz), and bring in a slight institutional (University) feel with the sans-serif, but maybe thats not working.  I thought it would play off of the different letter shapes in the mark too.  I was trying to match the weight of the heavy lines in the sans and serif fonts, but matching letter height is a good idea.  I wanted to slightly emphasize the last name since that is often the defining identity in this profession (think <em>prof. _____ </em>or <em>composed by ____ </em>).  But I do think matching the letter height is a good direction.  I will also play around with a single font to see if I can find something that works a little better.  Maybe I was too worried about the space between the lines of text with a lowercase last name.  </p>
      <p>Thanks again for all the help!  It really gives me a lot to think about.</p>
      <p>p.s. how do you embed the image instead of just link or attach?</p>
