      <p>It took me far too long to find that musical note within the TJ--and I only looked for something there thinking, well why have they made that silly curve on the bottom of the T when the face they're using has a flat bottom? I don't think non-designers think that way. There needs to be some sort of refinement, probably in the bottom of the J.</p>
      <p>I will say what bothers me is a lack of consistency in the details--pointy ends on the T's crossbar, rounded (but not tapered) bottom, then the hook on the J tapers awkwardly.</p>
