    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Books" class="freelinking" rel="nofollow">Books</a> : The Stroke Theory of Writing</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile_Stroke_4127.gif"></div><p></p>
    <p>Originally published in Dutch in 1985, this small volume by <a href="/wiki/Gerrit%20Noordzij" class="freelinking" rel="nofollow">Gerrit Noordzij</a> expounds an entirely new theory of the design of writing. At its core are three concepts:</p>
    <ul>The <a href="/wiki/Heartline" class="freelinking" rel="nofollow">Heartline</a></ul>
    <ul>The <a href="/wiki/Counterpoint" class="freelinking" rel="nofollow">Counterpoint</a></ul>
    <ul>A function <a href="/wiki/%CE%B1" class="freelinking" rel="nofollow">α</a>, which describes the transition from one counterpoint to the next</ul>
    <p>The heartline is the skeleton of a stroke. It is a zero-width description of the path of a pen. The counterpoint is the width and angle of the writing instrument, which can change independently from the direction of the stroke. Between any two counterpoints is a transition, gradual or abrupt, which describes the taper of the line (or lack thereof).</p>
    <p>Using these concepts together, Noordzij posits two primary types of <a href="/wiki/contrast" class="freelinking" rel="nofollow">contrast</a>: <a href="/wiki/Translation" class="freelinking" rel="nofollow">Translation</a> and <a href="/wiki/Expansion" class="freelinking" rel="nofollow">Expansion</a>:</p>
    <p>Translation is contrast that arises due to the changing angle of the heartline relative to the counterpoint. Contrast in <a href="/wiki/calligraphy" class="freelinking" rel="nofollow">calligraphy</a> is one example: the stroke is thickest when the angle of the pen is perpendicular to the motion of the stroke, and thinnest when the angle of the pen matches stroke direction.</p>
    <p>Expansion is contrast that arises due to a change in the width of the counterpoint. Contrast in brush painting is one example: the stroke is thickest when pressure is applied to the brush and the brush expands.</p>
    <p>Translation can be combined with expansion, as when pressure is applied to the stroke of a broad-nib pen, or by using an angled brush.</p>
    <p>Noordzij applies these concepts to <a href="/wiki/typography" class="freelinking" rel="nofollow">typography</a>, which he refers to as "dehydraded writing". He suggests that although typographical strokes are drawn rather than written, their <a href="/wiki/modulation" class="freelinking" rel="nofollow">modulation</a> can be described using these terms.</p>
