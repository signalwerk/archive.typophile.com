    <p>Hi,</p>
    <p>As well as working in education as a designer, I’m an MA Design Studies student at Central St Martins and am conducting research into typography. I’m posting today to see if anyone here might be able to help out with my MA research.</p>
    <p>The title of my project is “Life according to type” and is an exploration into how designers can use art as a vehicle for typography to interpret the world around them.</p>
    <p>To explain a little more, the project first took form as a way of gaining insight into how legibility and accessibility were affecting typography, how say increased restrictions from certain groups force the designers hand in typographical choices (sight disorders, learning disabilities, etc.) and moved into how to keep the variation in typography alive.</p>
    <p>The research aims to look into using typography as a means for expressing the surrounding world, collaboration amongst the design community and for myself curating design/art exhibitions online and in galleries.</p>
    <p>I’m hoping to find designers to take part in my research, ideally people who possibly may be able/willing to create a piece of tyopgraphical art which would then be used as as a demonstration/example of my research aims.</p>
    <p>I’m also conducting research into how guideline restrictions from groups forces design choices when it comes to typography, as well as personal views of designers on this subject.</p>
    <p>If you know of anyone else that may be able/want to help then please do either let me know or pass my details on.</p>
    <p>For more information or expressions of interest I can be contacted at either <a href="mailto:contact@christophernallen.com">contact@christophernallen.com</a> or <a href="mailto:cnallen@hotmail.co.uk">cnallen@hotmail.co.uk</a> as well as via Typophile.</p>
    <p>Again, thank you for your time in reading this and I look forward to hopefully hearing from some of you soon.</p>
    <p>Chris Allen.</p>
