      <p>I had considered lettering, but decided to concentrate on digital type. Whether the designer creating the piece then translates that type into a physical (drawn, sculpted, etc.) form is entirely up to them as long as they reference the original digital typeface as it is more about keeping the variation in typography alive and I feel that this affects digital more so. I welcome your thoughts on the subject however.</p>
      <p>Thanks</p>
      <p>Chris.</p>
