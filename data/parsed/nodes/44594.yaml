    html: |-
      <p>One of the main reasons to create original, from scratch, custom fonts is to offer the client a licensing program that they can implement without running afoul of any derivative works clauses in existing fonts. Since you say they want to include it as a downloadable font for their media kit, you are proposing an worldwide enterprise license.</p>
      <p>A place to start in pricing something like this is to look at what foundries charge for this level of  licensing for their existing fonts. You will find a wide range of prices, depending on the desired font(s). It would be common to pay anywhere from $6000 to $10,000 to $15,000 per font for this type of enterprise license. If these are the prices your client will have to pay for an enterprise license for existing font then what is an original font for their world-wide use going to cost them?</p>
      <p>James</p>
