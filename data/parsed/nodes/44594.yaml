    html: |-
      <p>Well, I'm not a pro type designer, of course, but I'll toss this suggestion out there for others to tear apart:</p>
      <p>Go with your baseline hourly rate * estimated hours as your starting figure (estimated hours adjusted as needed based on your assumption that it'll take you a bit longer as it's the first time you've done it). You can't/don't want to make less than that I'm guessing (ie, you don't want to lose money on the deal). In return, they'd get the absolute minimum out of that deal...say one non-exclusive license for the final font files.</p>
      <p>Then the negotiating begins...</p>
      <p> - site license vs. individual licenses<br>
       - exclusivity (only they can use it) vs. non exclusivity (you can license it to others) vs. something in between<br>
       - breadth of family provided<br>
       - etc</p>
      <p>But if you're just trying to feel them out, maybe ask them if they realize that at the very least, this will cost a lot more than them just purchasing and using Myriad.</p>
