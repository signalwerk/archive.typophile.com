    html: |-
      <p>As to time frame, One an approach is decided upon, I can create a alphabet in a day or two. How fast do you work? </p>
      <p>How confident are your clients in their idea? Do they diddle around, or do they make decisive decisions?</p>
      <p>The general rule of thumb is it takes 100 hours to create a complete 256 character set font. Do you feel comfortable with that or, since you say this is your first time doing this, will it take more time?</p>
      <p>James</p>
