      <p><cite>Then the negotiating begins...- site license vs. individual licenses<br>
      - exclusivity (only they can use it) vs. non exclusivity (you can license it to others) vs. something in between<br>
      - breadth of family provided</cite></p>
      <p>I don't see how these items are negotiated after the price of the work is calculated. These items must be agreed upon before the price is calculated. One can offer a rundown of different pricing options and let the client determine what they can afford. Most clients balk at total exclusivity when the find out how much it usually costs.</p>
      <p>I go back to my first post. Large-scale licensing of existing fonts is very expensive. Since the client is going to have to pay a lot for an off-the-shelf font anyway, the fact that you can give them a custom solution for a comparable price is the hammer that you have to hit them with. (over and over and over)</p>
      <p>Can you make a custom font for the $6000, $8000. $10,000 + fee they are going to have to spend for an enterprise license for an already existing font? And can you deliver as high a quality font as the professional font makers?</p>
