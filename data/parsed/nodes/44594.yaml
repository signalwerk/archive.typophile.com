    html: |-
      <p>Do not look at custom font pricing the same way as general graphic design. (Or hanging drywall for that matter)</p>
      <p>Always look at the licensing issue instead of just  how much time it takes times the hourly rate. You could almost argue (almost!) that you can do the design for free if the licensing fees are respectable enough. And make no mistake, in the end what you are doing is not selling your client a custom font. What you are doing is licensing your client a custom solution based on their needs, and your intellectual property. A custom solution that you own and manage, and that you could reuse providing your legal counsel writes the license in the proper way.</p>
      <p>James</p>
