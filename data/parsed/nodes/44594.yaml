    date: 2008-04-25T11:58:00
    votes: null
    html: |-
      <p>And add to that the fact that they want a worldwide license ( as opposed to just their in house design shop ).</p>
      <p>The fact that you are talking Myriad has me worried for you. Myriad was made to be robust on screen and in print. It could be hard to match the level of fine tweaks and adjustments and hinting* they poured into Myriad.</p>
      <p>Also “a neutral sans feeling to it” is a category that's hard to get right I think because you have to be quite subtle.</p>
      <p>On the other hand you can get critiques here on typophile. : -) So you do have paddle as it were.</p>
      <p>I agree that you should not sell yourself short. Making a typeface that is a good fit to a client is large undertaking. It's best to prepare them &amp; yourself for that. Or else be prepared to pitch for several extensions to the project and a client who isn't sure why they are paying "so much" for a design that is taking much longer than they thought it would. Agreeing to unfair or slanted terms for time, payment or deliverables will lead to you being unhappy stressed etc and a client not trusting you. On the other hand if you can paint a realistic picture and they agree; then you won't be driven mad, and they will be happier and more respectful of you as well.</p>
      <p>* Hinting is to help it display cleanly on screen.</p>
