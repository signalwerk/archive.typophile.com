    html: |-
      <p>While mentioning actual prices is frowned upon, discussing formulas to help others arrive at their own sum is not. Suggesting things to consider and what price you think they are personally worth as far as your time goes is always useful. For design it sometimes gets broken down like so: </p>
      <p>Design, meetings, production, emailing, price of printouts, cost of media used (CD's/DVD's), cost for purchased materials (fonts, or images), kill fee, late fees, outside of project scope fees, releasing materials, the use of said materials (Logo design and branding or just a business card), and you don't really want the work, the PITA tax. </p>
      <p>Once you have a dollar figure assigned to those, you can then look at the project, reasonably estimate your time, for each time consuming item, and work out a price accordingly. For this I'd imagine you'd want to know how many people will access it, wether you can resell it later, etc… which will all change the cost of releasing your work to the client.</p>
