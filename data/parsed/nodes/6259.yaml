    html: <p>Charlie <br> <br>Looking at a very early transitional gothic here, very close to the carolingian. Amazing double storied g there. <br> <br>Best bet if you want caps is Clairvaux from Linotype or else FF Carolus Magnus but I think that only comes with lowercase. <br> <br>Might be worth worming your way into the anti-commercial (free) font groups that specialize in pre-fraktur/fraktur. Some amazing stuff going on about there. Dieter Speffmann etc. <br> <br>Find your way at Luc Devroye's blackletter page. <br> <br>Start here <br> <br><a href="http://cgm.cs.mcgill.ca/~luc/fonts.html" target="_blank">http://cgm.cs.mcgill.ca/~luc/fonts.html</a> </p>
    html_clean: <p>Charlie <br> <br>Looking at a very early transitional gothic here, very close to the carolingian. Amazing double storied g there. <br> <br>Best bet if you want caps is Clairvaux from Linotype or else FF Carolus Magnus but I think that only comes with lowercase. <br> <br>Might be worth worming your way into the anti-commercial (free) font groups that specialize in pre-fraktur/fraktur. Some amazing stuff going on about there. Dieter Speffmann etc. <br> <br>Find your way at Luc Devroye's blackletter page. <br> <br>Start here <br> <br><a href="http://cgm.cs.mcgill.ca/~luc/fonts.html" target="_blank" class="link-external">http://cgm.cs.mcgill.ca/~luc/fonts.html</a> </p>
