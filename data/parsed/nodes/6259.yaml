    date_raw: 28 Jan 2003 — 12:54am
    votes: null
    html: <p>John <br> <br>Hate to say it but if you tramp around enough you will find a digital copy of just about every face that ever existed. There are a lot of foundries (commercial/anti-commercial) concentrating on historical faces. The problem is that a lot of these are copies without any attending technical qualities. I have at least three versions of Rhapsodie and they all suck. Fraktur.com has one I'd like to buy though, one of these days. Anybody have information on their fonts, other than what they have to offer in selection? That I've got memorized. I actually had a few fonts of Rhapsodie in metal once upon a time. Quite a gorgeous thing.</p>
