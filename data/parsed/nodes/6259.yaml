    html: <p>Clairvaux and Carolus Magnus are good commercial-grade choices. Depending on how many accents you need, you should also check out <a href="http://www.fontcraft.com">Scriptorium</a> and <a href="http://www.flaxart.com/f/shopping/prod_detail/main.asp?productID=66&amp;MainCatID=480&amp;catID=1975&amp;AID=5685192&amp;PID=673632">Callifonts</a>. <br> <br>Years ago I received a Callifonts <a href="http://www.flaxart.com/f/images/products/cmore/callifonts.pdf">brochure</a> in the mail. I don't know how complete the character sets are, but all of the designs appear to be original, although one reminds me of Ilse Schule's Rhapsodie. Callifonts probably has the largest available selection of uncials. <br> <br>Also check out the unique work at <a href="http://www.crazydiamond.co.uk/">Crazy Diamond Design</a>.</p>
