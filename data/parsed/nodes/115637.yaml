    <p>Just wondering what this (or the closest) font is? On the logo for Lucy's Fried Chicken by Pentagram.</p>
    <p><a class="freelinking external" href="http://www.pentagram.com/work/#/all/all/newest/2660/" rel="nofollow">Lucy's Fried Chicken</a>.</p>
    <p>Clearly may well be a custom job, or at least a customised version of an existing typeface, but I have been looking for something similar as a starting point to my own hand-lettered logo job. For inspiration purposes really!</p>
    <p>Thank you.</p>
