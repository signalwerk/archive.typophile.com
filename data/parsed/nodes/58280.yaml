    html: |-
      <p>Very close to <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/agenda/?testdrive=dock%3Dfalse%26size%3D34%26w%3D600%26src%3Dcustom%26text%3DGUTEN%2520TAG%26fg%3D000000%26bg%3Dffffff%26goodies%3Dot.liga%26seed%3D25" rel="nofollow">Agenda Thin</a> from Font Bureau. The short middle arm of the E is the hardest part to match and Agenda's is a bit shorter, at least. The G chin is the only other noteworthy detail in these letters, and it is relatively low. Unfortunately this G shape is probably the most common, so it's all about the amount of closure and the proportions of the chin relative to the rest of the letter. </p>
      <p>- Mike Yanega</p>
