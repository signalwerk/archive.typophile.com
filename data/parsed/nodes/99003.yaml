    <p>Hi guys!!</p>
    <p>So I'm a graphic design student and a huge fan of type, and for some time, I've been wanting to splurge and buy FontLab. I'm doing a directed study course on type design next semester, so I felt it was time. Thus, I went on the website to find the student pricing.... and found that the only option was for a year license. Honestly, I can't justify paying $119 for what basically amounts to a rental!!</p>
    <p>So, I thought I'd ask you guys- do you know anywhere that offers the full FontLab academic pricing for STUDENTS? All the websites I've looked at, only offer the academic pricing for colleges and faculty.</p>
    <p>I have a personal policy of never pirating software- however, I can't help but feel, if there isn't a student pricing option out there, that FontLab is encouraging it! Honestly- what student can afford FontLab at full price?!</p>
