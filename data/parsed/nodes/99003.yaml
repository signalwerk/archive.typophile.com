    html: |-
      <p>Kailene, </p>
      <p>you say "Honestly, I can't justify paying $119 for what basically amounts to a rental!". Most educational licenses are like that (not just FontLab's). A "student license" typically means that you can use the software as long as you're a student. When you graduate, you should upgrade to a full commercial license. </p>
      <p>All, </p>
      <p>At Fontlab Ltd., we changed our student pricing policy for several reasons. There are many more font editing and type design applications on the market today than there were a few years ago. If you're studying to become a type designer, you may likely need several applications, e.g. FontLab Studio, RoboFont, Metrics Machine and Glyphs. Therefore, we felt that a much lower entry price for students for our applications would allow them to use their budget more reasonably. On the other hand, if you don't study a full type design course but rather need a font editor for a type design class within a graphic design course, you'll most likely need the application for less than a year. Also, we found that quite a few students purchased a student license and continued to use it after they finished studying without upgrading to the full license. </p>
      <p>That's we switched to a model for annual licensing. So Fontlab Ltd. currently offers one-year student licenses at US$119 for FontLab Studio 5, US$79 for Fontographer 5 and US$23 for TypeTool 3. </p>
      <p>After your one year licensing period expires, you can renew your license for another year. Also, at any time you can upgrade to the full license by *just paying the difference*. If you keep paying for the annual licenses, after 5.5 years your license will be converted into a full license anyway. Therefore, you'll *never pay more than the full price*. (I now realize that this is not really clearly stated in the information on our web page, so we'll add this clarification.)</p>
      <p>Previously, a student license for FontLab Studio used to cost US$357. Now the same price gets you a three-year license. So the new model certainly has advantages and disadvantages: if you study shorter than for three years, the new model clearly is better; if you study longer than for three years, then indeed the older model was better. However, we felt that the advantages of the new model outweighs the disadvantages, especially since it offers a very attractive "entry pricing". If you just want some simple font-related work done for a semester project, then $23 for a one-year TypeTool license really is very affordable. </p>
      <p>Hope this helps! </p>
      <p>Best regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
