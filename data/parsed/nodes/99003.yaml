      <p>Not <em>quite</em> 'anything' else... no hinting/instructions either (other than auto-hinting, and some minor control over per-character Type 1 stem hints), no optical sizing or scaling transformations, no other OT features like stylistic alternates.  But it is excellent value for money, and you can upgrade to the full FontLab later for a roughly equivalent discount. </p>
      <p>I still use TT for almost everything.  I've decided it's about time to get FL but I, too, wanted to wait and see if there was some kind of academic pricing (I'm planning on going in for grad school soon).  </p>
      <p>I admit I don't understand this 'rental' concept.  Shouldn't paying installments at least get you a discount on the eventual purchase?  But I can't find any indication of that on FL's website.  I mean, if I pay over $200 to use FontLab for two years as a student, and then decide to buy the whole thing later, does that previously-paid amount count for nothing?  Because otherwise I'll end up paying a lot <em>more</em> than I would if I'd just bought it at the start...</p>
