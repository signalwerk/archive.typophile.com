      <p>"neakers" &amp; "sports bar" must be <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=URW&amp;ffam=Candice%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=9c7bc61ece0a61a85b6e8a59bebef3d2&amp;wrap=2&amp;text=Sneakers%20sports%20bar" rel="nofollow">Candice</a></strong> available from URW, E&amp;F, Linotype &amp; ITC<br>
      while the initial /S/ could be taken from <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Monotype&amp;ffam=Coronet%20MT%20Bold%20-%20Regular&amp;fid=0eb52c37febd4750ab0145ce51a0a475&amp;fstyle=b&amp;fsize=60&amp;text=S&amp;fit=1" rel="nofollow">Coronet MT Bold</a></strong> artificially emboldened and probably modified.</p>
      <p>-----------------------------------------------<br>
      I found them using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
