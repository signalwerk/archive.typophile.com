      <p>My intention was to give it a simple and clean look and I thought that futura (especially because of the a) would work for me. Actually I think it does. But since simplicity is not everything, I wanted it to look more like Helvetica or Univers. That's why I changed the s. This was intented to make it look more organic and I think that this is the core issue. In my opinion Renner's a works perfectly for Futura (as well as the 's' does. Especially because of what he wanted to achieve. It wasn't the main target to make it look perfectly but to create it from simple geometrical shapes.) But regarding to what I want to achieve I have to agree to your comment.</p>
      <p>Thank you a lot for you input as well as for the link you've provided to me. I will take a closer look at it as soon as I find the time.</p>
