      <p>Regarding to what Frode Frank has suggested and what I've read in the linked forum topic I made some changes to my 'a'.</p>
      <p>The increased x-height gives me the possibilty to have a more oval bowl which decreases the slight awkwardness of the overall shape like in Futura BQ Bold. In my opinion it doesn't look as forced to geometry as in the original typeface tough it still communicates simplicity. Unlike the original stem of the 'a' mine is slightly floating to the right and the bowl doesn't visually cut it anymore.<br>
      <em></em><br>
