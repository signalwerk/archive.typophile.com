      <p>Actually it is supposed to be pronounced as "sim-please" though it contains of "simple" and "please" and the "ease" is just a bonus for those who know that this is part of "ease of use" which perfectly suits usability and user experience. The most important message is "simple please" which can be seen as what the customers demand. They want simple products. The please also indicates that the products are actually services. All those deliberations are more or less subliminal and we want "simplease" to be read as one unique word that's easy to write, read and pronouce and of course easy to remember.</p>
      <p>btw. what do you think of the concept? The renaming was the first step of our rebranding and we decided to go this way because both words "simple" and "please" are basic english and people here in Austria are quite familiar with them. We've tested it and all the probands were able to spot "simple" and "please". The previous name was "simplicious" which isn't only hard to spell (for non native-speakers) but also not understandable for those who don't know words like delicious or precious (...and there are a lot of them in Austria :) ). Though I think that phonetically "simplicious" sounds more like a typical company-name the sound of "simplease" is more unique and as a result more recognizeable.</p>
    html_clean: |-
