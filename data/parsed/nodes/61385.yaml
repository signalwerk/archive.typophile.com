    user: 44610
    date: 2009-09-03T03:05:00
    date_raw: 3 Sep 2009 — 3:05am
    votes: null
    html: |-
      <p>I will split the next posting into two separate parts. The <strong>first</strong> one is regarding the <strong>logotype-evolution</strong> and the <strong>second</strong> one is regarding the <strong>company-name</strong>. In case you are not interested in one of them it might be easier for you to only grab the information you want.<br>
      <em></em><br>
      <strong>(1) LOGOTYPE-EVOLUTION</strong></p>
      <p>Due to your previous comments and some observations I've made on my own I decided to put more effort into the details.<br>
      <em></em><br>
      <strong><cite>a) Letter-Tweaking</cite></strong><br>
      <em></em><br>
      <em></em></p>
      <ul><div class="imageWrap"><img src="http://typophile.com/files/new_cap_S_5144.jpg"></div></ul>
      <ul><cite>Making the "S" a bit thinner</cite></ul>
      <p><em></em><br>
      <em></em></p>
      <ul><div class="imageWrap"><img src="http://typophile.com/files/new_a_6350.jpg"></div></ul>
      <ul><cite>The "a" is now perfectly oval-shaped and has a slightly bigger bowl</cite></ul>
      <p><em></em><br>
      <em></em></p>
      <ul><div class="imageWrap"><img src="http://typophile.com/files/new_s02_4011.jpg"></div></ul>
      <ul><cite>Clearer distinction between the bowls and "nicer" roundings</cite></ul>
      <p><em></em><br>
      <em></em><br>
      <strong><cite>b) Gray scale value</cite></strong><br>
      <em></em><br>
      <em></em></p>
      <ul><div class="imageWrap"><img src="http://typophile.com/files/greyscale_value_6375.jpg"></div></ul>
      <ul><cite>In the previous version "simp" was slighlty darker than "ease"</cite></ul>
      <p><em></em><br>
      <em></em></p>
      <ul><div class="imageWrap"><img src="http://typophile.com/files/compare_grey_4094.jpg"></div></ul>
      <ul><cite>A less bold "S" and an oval-shaped "a" combined with some kerning helped</cite></ul>
      <p><em></em><br>
      Basically I slightly put more space in between the "S-i-m-p" plus the tiniest little space between "p-l-e" to balance it with the cirtical letter-combination "e-a". I think it is an improvement though I'm not sure it's already perfect.<br>
      <em></em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/simplease_20_5709.jpg"></div><br>
      <em></em><p></p>
      <p>What do you think about it? Any kind of feedback is appreciated.<br>
      <em></em><br>
      ----<br>
      <em></em><br>
      <strong>(2) COMPANY-NAME</strong></p>
      <p><strong><cite>Simplicious:</cite></strong> Simply good, simply delectable, simply delicious. Like salt, use it sparingly to add a twinge of spice and sophistication to any conversation. (Urban Dictonary)<br>
      <em></em><br>
      At first we were boosted by this definition and thought that it will perfectly suit our needs. But after a few months I realized that it has a strong connotation to cooking. This was the start of a renaming process that last for about 3 months and funnily ended with "Simplease" which is very close to the old name though we came up with about 6-8 potential candidates which did not include the "simple".</p>
      <p><strong>@marcdavid:</strong> I totally agree on what you said about the sounding of "simplicious" but we decided that "Simplease" beats it in any other competition.</p>
      <p>The biggest problem with "simplicious" is that it becomes kind of an oximoron when people don't understand the "icious". They will read "simple and something complicated". The different versions of how probands have pronounced it were really funny (german-speakers can imagine what I mean). Furthermore "simplicious" contains two words with two absolutely different meanings and we wanted to send <cite>only one</cite> message. Though we know it's only superstition that "simplifying" is a proper tool for designing the user experience we know that it's exactly what our customers are asking for. They want simple products delivered in a simple (comfortable) way. We also decided that when anyone googles "Usability" or "User Experience companies" the one which contains simplicity will easily be recognized as such a company.</p>
      <p>For everyone who's interested -&gt; We have about 60 pages of documentation about the whole process containing all the reasons and all the attributes on which we judged some of the candidates. Unfortunately it's all in german.</p>
      <p><strong>@epsilicon:</strong> Thank you for your comment about it's reference to "delicious" -&gt; you're right, that's not something desireable :). As a result of this "simplicious" is too "in your face" and to strongly connected to a Web-Company which we defintiley don't want to be.</p>
      <p><strong>To summarize the process:</strong> "Simplease" has a clear message which is understandable for the main target group. By designing a typographic logo we want to communicate this message. Do you think it works?<br>
      <em></em><br>
      I would like to thank all of you for everything you've mentioned so far. It was a big help and the current version is the result of all your observations. Thank you for sharing your knowledge :)</p>
