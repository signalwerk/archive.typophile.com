      <p><cite>"the longer I stare at that “s”, the less I know if it’s good. Now I’m worried about giving bad advice, so I’ll be watching from behind my rock.<br>
      :)"</cite></p>
      <p>It took some time but now I totally agree on what you've said <strong>altaira</strong>. The "s" was too wide especially when you compare it to the "s" of other fonts. That's why I've changed it (again) and also adjusted the capital "S" to suit it -&gt; I hope it fits now.</p>
      <p>This time I've also experimented with color. I decided on <cite><strong>C</strong>=100 <strong>M</strong>=50 <strong>Y</strong>=20 <strong>K</strong>=0</cite> which gives me a very intensive greenish blue. Now let me explain why I've choosen this color.</p>
      <p>For a User Experience Company there are two big components. On the one hand we have humans and on the other hand we have science. The black version doesn't communicate science at all and so I thought it might be a good idea to communicate this via color. The little touch of green makes it more organic than typical corporate blues and supports the human vibe of the bold and friendly looking letters. That's at least what I hope it does :).</p>
      <p>I've also attached a screenshot of how it might be perceived by color blind persons (Protanopia and Deuteranopia) regarding to this <a href="http://www.etre.com/tools/colourblindsimulator/" rel="nofollow">colour blindness simulator</a>.<br>
      <em></em><em></em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/simplease_34_6713.jpg"></div><br>
      <em></em><em></em><br>
      <div class="imageWrap"><img src="http://typophile.com/files/color_blindness_5991.png"></div><p></p>
      <ul><cite>Protanopia looks the same (Tritanopia looks like in the original version)</cite></ul>
