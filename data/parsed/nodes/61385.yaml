    html: |-
      <p>What do you think of the customized 's'? I've worked on it for hours now and can't tell anymore either it fits or it does not fit into the overall appearance. As you can see It's the child of Univers 55, Helvetica Bold and Futura Bold. Since I'm not digging the Futura-'s'at all I decided to stay with more organic Grotesques which should on one side not destroy the geometry built by the rest of the word and on the other side not look like it's a byproduct of the other letters. That's very important because since the word starts with a capital 'S' this letter becomes the most important one and should not look like the gestalt of it is forced to the restrictions of the other letters. What do you think of it?</p>
      <p>btw: I think the capital 'S' needs some refinement but I'll go for that later on.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/custom_s_6193.jpg"></div><p></p>
