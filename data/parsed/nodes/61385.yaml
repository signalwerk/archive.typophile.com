      <p>Regarding to what I've read in <a href="http://typophile.com/node/61679" rel="nofollow">another thread</a> I decided to take a closer look at "p" and "a".</p>
      <p><cite>"One of the things I note about single-storey a is that the counter and bowl always appear slightly larger than that of d if actually the same size."</cite></p>
      <p>So I studied the different versions of Futura Bold and noticed that there is a slight difference between "a" and "p" and where the bowls meet the stem. I've tried to adopt this to my logotype. Furthermore I've tried some different kernings and decided to present you this last one in which I'm not sure if the "ease" looks horrible or perfectly alright. I've also opened the "p-l-e" kerning as recommended by epsilicon.</p>
      <p>I hope you can spot the difference and tell me whether it's an improvement or not (or if it got worse).</p>
