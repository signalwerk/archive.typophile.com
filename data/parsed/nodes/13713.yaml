    <p>The Bauhaus was a German college of architecture, art, and design, which existed in three forms from 1919–1933.</p>
    <p>The Bauhaus was founded in 1919 by <a href="/wiki/Walter%20Gropius" class="freelinking" rel="nofollow">Walter Gropius</a> in Weimar, joining to previous art and handcraft schools together. Named <em>Das staatliche Bauhaus in Weimar</em>, the school's political direction was radically socialist and revolutionary communist. This so angered the nationalist city government (see <a href="/wiki/German%20Nationalism" class="freelinking" rel="nofollow">German Nationalism</a>) that they cut the school's budget in 1923, ironically just after the school had mounted a successful exhibition of international renown.</p>
    <p>Invited by the major of Dessau, Gropius moved the school to that city. Renamed the <em>Bauhaus Dessau: Hochschule für Gestaltung</em>, the school entered its second phase. Housed inside the famous Bauhaus building, which was designed by Gropius and is still visible today, the school became decidedly "modern," as opposed to expressionist. Gropius still had political trouble in Dessau, however. Despite hiding his own socialist sentiments, he was neither able to cool his own student's radical attitudes nor convince the city government that these were harmless. To save the school, Gropius resigned under pressure in 1928.</p>
    <p><a href="/wiki/Hannes%20Meyer" class="freelinking" rel="nofollow">Hannes Meyer</a> replaced him. Meyer was a real communist, from Switzerland. He did not improve the situation for the school. Now faced to be doomed by history, as the city governments officers became increasing National Socialist (Nazi party members), the school tried another switch, bringing in the apolitical <a href="/wiki/Ludwig%20Mies%20van%20der%20Rohe" class="freelinking" rel="nofollow">Ludwig Mies van der Rohe</a> from Berlin.</p>
    <p>Mies van der Rohe (hereafter "Mies"), from 1930 onward the head of the school, was piloting a sinking ship. He had to convince the city government that his school was not political (political meant, in this case, socialist/communist). He had a difficult time. Aside from the high number of socialist activities, the school's population was between 10 and 50 percent foreign. In these days, the word "foreign" was virtually synonymous with "communist."</p>
    <p>In a last ditch effort, Mies expelled the entire student body, and readmitted select students after a personal political interview. This only drove the political organization underground, and couldn't help the situation anyway, as the now ascendent Nazis were bent on closing the school.</p>
    <p>The city government dissolved the college in 1932. Mies transfered his camp to Berlin, opening up a private school for architecture in Berlin, 1933, named the <em>Bauhaus Berlin</em>. The school entered its third and last phase.</p>
    <p>On January 31, Adolf Hitler was named chancellor of Germany by President Hindenberg. In March, the Gestapo raided the school's Berlin campus, causing it to be shut down permanently.</p>
    <p>The Bauhaus had collected an astounding collection of professors (called Masters in an effort to be more egalitarian), which included: Johannes Itten, Paul Klee, Wassily Kandinsky, MArianne Brant, Marcel Breuer, Lyonel Feininger, Oskar Schlemmer, <a href="/wiki/Lazlo%20Moholy-Nagy" class="freelinking" rel="nofollow">Lazlo Moholy-Nagy</a>, <a href="/wiki/Theo%20van%20Doesburg" class="freelinking" rel="nofollow">Theo van Doesburg</a>, <a href="/wiki/Joost%20Schmidt" class="freelinking" rel="nofollow">Joost Schmidt</a>, <a href="/wiki/Herbert%20Bayer" class="freelinking" rel="nofollow">Herbert Bayer</a>, and <a href="/wiki/Josef%20Albers" class="freelinking" rel="nofollow">Josef Albers</a>. About 10 percent of the Bauhaus student body had come from the United States or Great Britain.</p>
    <p><strong>Despite having created a myriad of avant garde typography, typography, type design, advertising, and printing were not key elements of the Bauhaus curriculum. The greatest typographic innovations of Weimar Republic Germany were all created at other schools, i.e., those in Leipzig, Offenbach, Stuttgart, and Munich.</strong></p>
    <p>Many tried afterward to claim a piece of the Bauhaus legacy. A great number of masters emigrated to the US (some under enormous duress, some not). Moholy-Nagy founded <em>The New Bauhaus</em> in 1937 in Chicago. This was viewed as a usurpation by Mies, who came to IIT in Chicago around the same time. In the 1940s, IIT absorbed the school.</p>
    <p>In the 1950s, the <a href="/wiki/Hochschule%20fuer%20Gestaltung%20Ulm" class="freelinking" rel="nofollow">Hochschule fuer Gestaltung Ulm</a> was founded in Ulm by Max Bill. Many former Bauhaus students and teachers were involved. The state closed the hfg down in 1968, in part because—like the Bauhaus before it—it was too foreign (almost 50% foreign enrollment).</p>
    <p>Today there is a <a href="/wiki/Bauhaus%20Universitaet%20Weimar" class="freelinking" rel="nofollow">Bauhaus Universitaet Weimar</a> in the old school buildings in Weimar. In Dessau, the state design school (the <a href="/wiki/Hochschule%20Anhalt" class="freelinking" rel="nofollow">Hochschule Anhalt</a>) uses part of the famous Gropius building. The rest is a museum and private graduate school for urban planning. Lastly, there is a Bauhaus Museum in Berlin, built in the 1970s based on plans drawn by Gropius.</p>
