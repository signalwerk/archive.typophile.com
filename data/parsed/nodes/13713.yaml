    <p>The Bauhaus was a German college of architecture, art, and design, which existed in three forms from&nbsp;1919–1933.</p>
    <p>The Bauhaus was founded in 1919 by <a href="/node/add/wiki?edit%5Btitle%5D=Walter%20Gropius" title="Create node &quot;Walter Gropius&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Walter Gropius</a> in Weimar, joining to previous art and handcraft schools together. Named <em>Das staatliche Bauhaus in Weimar</em>, the school’s political direction was radically socialist and revolutionary communist. This so angered the nationalist city government (see <a href="/node/12205" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">German nationalism</a>) that they cut the school’s budget in 1923, ironically just after the school had mounted a successful exhibition of international&nbsp;renown.</p>
    <p>Invited by the major of Dessau, Gropius moved the school to that city. Renamed the <em>Bauhaus Dessau: Hochschule für Gestaltung</em>, the school entered its second phase. Housed inside the famous Bauhaus building, which was designed by Gropius and is still visible today, the school became decidedly “modern,” as opposed to expressionist. Gropius still had political trouble in Dessau, however. Despite hiding his own socialist sentiments, he was neither able to cool his own student’s radical attitudes nor convince the city government that these were harmless. To save the school, Gropius resigned under pressure in&nbsp;1928.</p>
    <p><a href="/node/add/wiki?edit%5Btitle%5D=Hannes%20Meyer" title="Create node &quot;Hannes Meyer&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hannes Meyer</a> replaced him. Meyer was a real communist, from Switzerland. He did not improve the situation for the school. Now faced to be doomed by history, as the city governments officers became increasing National Socialist (Nazi party members), the school tried another switch, bringing in the apolitical <a href="/node/add/wiki?edit%5Btitle%5D=Ludwig%20Mies%20van%20der%20Rohe" title="Create node &quot;Ludwig Mies van der Rohe&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ludwig Mies van der Rohe</a> from&nbsp;Berlin.</p>
    <p>Mies van der Rohe (hereafter “Mies”), from 1930 onward the head of the school, was piloting a sinking ship. He had to convince the city government that his school was not political (political meant, in this case, socialist/communist). He had a difficult time. Aside from the high number of socialist activities, the school’s population was between 10 and 50 percent foreign. In these days, the word “foreign” was virtually synonymous with&nbsp;“communist.”</p>
    <p>In a last ditch effort, Mies expelled the entire student body, and readmitted select students after a personal political interview. This only drove the political organization underground, and couldn’t help the situation anyway, as the now ascendent Nazis were bent on closing the&nbsp;school.</p>
    <p>The city government dissolved the college in 1932. Mies transfered his camp to Berlin, opening up a private school for architecture in Berlin, 1933, named the <em>Bauhaus Berlin</em>. The school entered its third and last&nbsp;phase.</p>
    <p>On January 31, Adolf Hitler was named chancellor of Germany by President Hindenberg. In March, the Gestapo raided the school’s Berlin campus, causing it to be shut down&nbsp;permanently.</p>
    <p>The Bauhaus had collected an astounding collection of professors (called Masters in an effort to be more egalitarian), which included: Johannes Itten, Paul Klee, Wassily Kandinsky, <span class="caps">MA</span>rianne Brant, Marcel Breuer, Lyonel Feininger, Oskar Schlemmer, <a href="/node/add/wiki?edit%5Btitle%5D=Lazlo%20Moholy-Nagy" title="Create node &quot;Lazlo Moholy-Nagy&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Lazlo Moholy-Nagy</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Theo%20van%20Doesburg" title="Create node &quot;Theo van Doesburg&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Theo van Doesburg</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Joost%20Schmidt" title="Create node &quot;Joost Schmidt&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Joost Schmidt</a>, <a href="/node/13714" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Herbert Bayer</a>, and <a href="/node/add/wiki?edit%5Btitle%5D=Josef%20Albers" title="Create node &quot;Josef Albers&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Josef Albers</a>. About 10 percent of the Bauhaus student body had come from the United States or Great&nbsp;Britain.</p>
    <p><strong>Despite having created a myriad of avant garde typography, typography, type design, advertising, and printing were not key elements of the Bauhaus curriculum. The greatest typographic innovations of Weimar Republic Germany were all created at other schools, i.e., those in Leipzig, Offenbach, Stuttgart, and&nbsp;Munich.</strong></p>
    <p>Many tried afterward to claim a piece of the Bauhaus legacy. A great number of masters emigrated to the <span class="caps">US</span> (some under enormous duress, some not). Moholy-Nagy founded <em>The New Bauhaus</em> in 1937 in Chicago. This was viewed as a usurpation by Mies, who came to <span class="caps">IIT</span> in Chicago around the same time. In the 1940s, <span class="caps">IIT</span> absorbed the&nbsp;school.</p>
    <p>In the 1950s, the <a href="/node/add/wiki?edit%5Btitle%5D=Hochschule%20fuer%20Gestaltung%20Ulm" title="Create node &quot;Hochschule fuer Gestaltung Ulm&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hochschule fuer Gestaltung Ulm</a> was founded in Ulm by Max Bill. Many former Bauhaus students and teachers were involved. The state closed the hfg down in 1968, in part because—like the Bauhaus before it—it was too foreign (almost 50% foreign&nbsp;enrollment).</p>
    <p>Today there is a <a href="/node/add/wiki?edit%5Btitle%5D=Bauhaus%20Universitaet%20Weimar" title="Create node &quot;Bauhaus Universitaet Weimar&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bauhaus Universitaet Weimar</a> in the old school buildings in Weimar. In Dessau, the state design school (the <a href="/node/add/wiki?edit%5Btitle%5D=Hochschule%20Anhalt" title="Create node &quot;Hochschule Anhalt&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hochschule Anhalt</a>) uses part of the famous Gropius building. The rest is a museum and private graduate school for urban planning. Lastly, there is a Bauhaus Museum in Berlin, built in the 1970s based on plans drawn by&nbsp;Gropius.</p>
