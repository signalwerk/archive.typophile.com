    <p>Hello Typophilers, please help if you can or if you love books,</p>
    <p>I’m doing a book jacket for Finnegan’s Wake by James Joyce. Here’s what I’ve gathered from ’the wake’ Half of the language is completely made up. As if the book is supposed to be somewhere between drunken gibberish, poetry, and literature. Some have compared the reading experience to being in a flood, where you see poles start to move one way, so you think you know where you’re going, then you see poles move in the complete opposite direction. Quite hopeless in many ways. Also the title is believed to be a play off of words. Wake as in a funeral’s wake, and also ’waking up.’ There are strong irish mythologies in the book too. The book might also be the first in history to start the first sentence in mid sentence and on the last page, end on the sentence you were missing - so you could probably start anywhere in the book and it wouldn’t matter.</p>
    <p>This is still fun right? :)</p>
    <p>I am trying for a type-only solution.</p>
    <p>Does anyone have suggestions on this?<br>
    </p><div class="imageWrap"><img src="/web/20081007145215im_/http://typophile.com/files/2.gif"></div><p></p>
    <p>thanks in advance everyone.</p>
