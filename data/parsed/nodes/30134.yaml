      <p>Sorry for being so late to respond to this thread. I've been kerning...</p>
      <p><cite><strong>It’s simply an error in the PR copywriter’s judgement.</strong></cite></p>
      <p>The error is mine. House has been using the "animated" term for years to describe bouncy typefaces. And, the term has historical precedent. For example, pages 38-40 of the Photo Lettering Inc. <cite>Alphabet Thesaurus Volume I</cite> (1960) are referred to as the "Animated Gothics" section. Thus, I thought I'd be safe with the term. The confusion probably comes from the fact that we're not hiding that my love for classic <a href="http://en.wikipedia.org/wiki/Character_animation" rel="nofollow">character animation</a> was a huge source of inspiration for this family. Animated fonts. Animated movies. <em>Animatedly animated animation.</em> I simply ran out of terms to describe it all. Oh well. Hopefully people will like the fonts.</p>
      <p>As for the questions about the OpenType features and bounce, here's what is going on in the fonts:</p>
      <p>Burbank has been meticulously drawn to ensure that all settings have an evenly distributed bounce without resorting to any fancy OpenType features. This works 97% of the time, but occasionally it needs a helping hand. For example, here's a setting showing only the base (non-alternate) letterforms:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/burbank_alt_off_5806.png"></div><p></p>
      <p>I think it looks pretty good, but the duplicate T letterforms bother me. Being the perfectionist that I am, I had to do something about this. So I drew subtly different alternates for (nearly) the whole range of alphanumeric characters for every member of Burbank Big. The fonts contain OpenType code that inserts these alternates only when needed to alleviate Repetitive Structure Syndrome. The result looks like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/burbank_alt_on_4644.png"></div><p></p>
      <p>Overlaying the examples shows this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/burbank_alt_overlay_5586.png"></div><p></p>
      <p>The alternate <strong>E</strong> is inserted because the <strong>L</strong> has a similar structure to the <strong>E</strong>, the alternate <strong>T</strong> is inserted to eliminate the duplicate form and the rest of the letterforms are the base forms. The OpenType code is used <em>only</em> as a fallback for times when the base forms don't do enough work on their own. This isn't as flashy as <a href="http://talleming.com/pages/work/programming/openType/edInterlock/index.html" rel="nofollow">Ed-Interlock</a>, <a href="http://talleming.com/pages/work/programming/openType/randomization/index.html" rel="nofollow">Local Gothic</a> or <a href="http://houseind.com/index.php?page=showfont&amp;id=536&amp;subpage=lux_features" rel="nofollow">Luxury Text-Italic</a>, but it gets the job done.</p>
    html_clean: |-
