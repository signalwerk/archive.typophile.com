    <p>just got this via email:</p>
    <p><a href="http://www.houseind.com/index.php?page=press&amp;section=burbank" title="http://www.houseind.com/index.php?page=press&amp;section=burbank">http://www.houseind.com/index.php?page=press&amp;section=burbank</a></p>
    <p>The press release I received used the phrase "animated fonts" over a half-dozen times, yet from what I can see these fonts are not actually animated (and how would that work, anyway? Multiple faces with slight differences, or a built-in randomizer ala Kosmik?).</p>
    <p>Can anyone shed light? They seem to be simply some nicely-drawn faces based on animation lettering, but are certainly not "animated" by any stretch of the imagination, at least not given any definition I've ever heard. Does that industry call their lettering "animated fonts" even when the lettering is not actually animated?</p>
    <p>Here's the actual press release:</p>
    <p>HOUSE INDUSTRIES INTRODUCES "BURBANK" COLLECTION OF ANIMATED FONTS</p>
    <p>(YORKLYN, DE) December 18, 2006 — In a tribute to the golden age of animation, House Industries is introducing Burbank, a versatile new collection of 20 animated fonts. The collection will be available January 1, 2007.</p>
    <p>The collection features Burbank Big, in three widths and four weights, and Burbank Small, in four weights of both Roman and italic. Designed for mixing and matching, Burbank offers a nearly endless array of combinations. </p>
    <p>“Until now, animated typefaces were drawn as single, stand-alone display fonts. They rarely had relatives or a supporting cast,” says Burbank designer Tal Leming, who was inspired by the versatility of his favorite cartoon characters and the hand-lettered titles of classic animation. </p>
    <p>Often stymied by the lack of typographic options for his own graphic design projects that called for animated fonts in display and text weights, Leming set to work nearly a decade ago to create the Burbank “super family” of typefaces. The collection features hand hewn fonts from big to small, wide to condensed, light to black and nearly everything in between. </p>
    <p>“Designers need a coordinated, animated font family like this. I know that I sure did,” Leming says.</p>
    <p>House Industries is offering the entire Burbank collection of 20 fonts for $299, including a free T-shirt. Or you can purchase the display and text sets separately, for $199 each. Burbank Big features the 12 display fonts (condensed, regular and wide in light, medium, bold and black weights). Burbank Small includes eight fonts total, four Roman and four italic, for use in text sizes.</p>
    <p>Order online at <a href="http://www.houseindustries.com" title="www.houseindustries.com">www.houseindustries.com</a> or call 1-800-888-4390.</p>
