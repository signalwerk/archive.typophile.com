      <p>Tal gives us a little more information:</p>
      <ol>"Uh oh. Looks like the 'animated' term is confusing people. It just means, like you said, that the fonts are bouncy. The display fonts do have two versions of almost every alphanumeric character and some OpenType code that inserts them as needed to prevent similar forms from occurring in a specified range. But, most of the bounce is controlled by the structure of the letterforms themselves. The baselines are systematically shifted to ensure proper bounce. The OpenType feature is insurance so to speak."</ol>
