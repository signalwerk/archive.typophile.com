    html: |-
      <p>Probably not what you want, but:</p>
      <p>In symbolic logic, an open square character usually means "It's necessary that", i.e. that what follows it is true no matter what--there is no possible situation in which it would be false.  An open diamond (often just a rotated square) means "It's possible that" (in other words, that what follows it is something that is not <em>necessarily</em> false).</p>
      <p>In addition, one uses the turnstile (a vertical line with a short horizontal line coming out of the middle of its right side) and double-turnstile (same thing, but with two horizontal lines very close to each other).  Turnstile and double-turnstile both mean, roughly, "It is provable that" as long as there is nothing immediately to their left.  So the turnstiles mean almost the same thing as "It's necessary that" in many contexts.  Sometimes they have slightly different meanings, but I doubt the distinction would matter for your purpose.  (If there's something to the left of the turnstile, it means, roughly,that what follows is provable from or is justified by what precedes the turnstile.)</p>
      <p>You can probably find examples of these in any font designed for typesetting math, e.g. in a default LaTeX setup.</p>
    html_clean: |-
