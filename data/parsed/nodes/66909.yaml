    html: |-
      <p>The contrast on this N, for example, is backwards from all the contrasted sans I have been finding. However, it's just like the narrow serif fonts, like <a class="freelinking external" href="http://new.myfonts.com/fonts/redrooster/keyboard-rr/" rel="nofollow">Keyboard</a>. It's not exact (the G chin is too high, and the S spine is not the same), but it would be a better approximation of what appears to be a custom font, if you removed the serifs from such a font.</p>
      <p>- Mike Yanega</p>
