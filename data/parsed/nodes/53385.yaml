    html: |-
      <p>Elegant, flourished script has been a part of the visual language of selling to the male animal since day one. I wouldn't rule it out.</p>
      <p>Script by its very nature does not necessarily imply feminine.  Look at the logos of Brooks Brothers and other high end menswear advertising over the years.  Stock certificates, brokerage houses.  Script was everywhere. And it was manly.</p>
      <p>If this were 50 years ago every one on this board would be capable of producing a hundred styles of script in seconds with a brush. (Of course there'd be no internet and I wouldn't be typing this.)  </p>
      <p>Fortunately their work is pilferable.  Go buy a stack of magazines from the 50's or some art directors annuals from the day. Find the letters you need.  Scan away.</p>
