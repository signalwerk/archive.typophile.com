    <p>Ello all,<br>
    I'm after a little help.<br>
    I have been asked to redesign a logotype for a small local menswear shop.<br>
    After much discussion the style of font to be used has been agreed that of a script/handwriting font.<br>
    I've been looking at faces such as;<br><a href="http://Montague" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Montague</a><br><a href="http://Affair" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Affair</a><br><a href="http://Feel" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Feel</a><br><a href="http://new.myfonts.com/fonts/fontgarden/fg-bethany/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Bethany</a><br>
    What I'm really after is the flair of these faces but sometng more masculine. Usually I would hand draw it but due to time contstraints and budget I need to buy a face.<br>
    An one got any suggestions?<br>
    cheers in advance<br>
    Martin</p>
