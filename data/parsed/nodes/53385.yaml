    <p>Ello all,<br>
    I'm after a little help.<br>
    I have been asked to redesign a logotype for a small local menswear shop.<br>
    After much discussion the style of font to be used has been agreed that of a script/handwriting font.<br>
    I've been looking at faces such as;<br>
     <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000367" rel="nofollow">Montague</a><br>
     <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000181#specimen" rel="nofollow">Affair</a><br>
     <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000300#specimen" rel="nofollow">Feel</a><br>
     <a class="freelinking external" href="http://new.myfonts.com/fonts/fontgarden/fg-bethany/" rel="nofollow">Bethany</a><br>
    What I'm really after is the flair of these faces but sometng more masculine. Usually I would hand draw it but due to time contstraints and budget I need to buy a face.<br>
    An one got any suggestions?<br>
    cheers in advance<br>
    Martin</p>
