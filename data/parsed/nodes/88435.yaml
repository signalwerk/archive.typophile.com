    <p>I just find this old (1999) but still interesting essay about designing noteheads.<br>
    I will comment below when i will finish to read it.<br>
    <a href="http://faculty.washington.edu/garmar/notehead_specs.pdf" target="_blank" rel="nofollow">link</a></p>
    <p>I was thinking about a parametrical solution for noteheads, as it's one of the musical glyphs that fits the variables of stroke, direction and orientation. There's a little bit of math inside, hope to handle it....</p>
