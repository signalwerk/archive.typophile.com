  html: <p>How does hinting work in Open Type Fonts? <br>If I have a Postscript font hinted through T1 hinting, when I generate an Open Type font the hinting goes together? <br> <br>Thank you.</p>
  html_clean: <p>How does hinting work in Open Type Fonts? <br>If I have a Postscript font hinted through T1 hinting, when I generate an Open Type font the hinting goes together? <br> <br>Thank you.</p>
