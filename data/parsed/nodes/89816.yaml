      <p>Frode (citing Tim Brown) – <cite>I suspect that it could be related to "retracted" BCPs</cite></p>
      <p>hhp – <cite>Having BCPs on both ends of a curve is indeed good practice</cite></p>
      <p>Jens – <cite>We advise to avoid them because they will lead to distortions and extra points being inserted when the curves are converted to TTF</cite></p>
      <p>While you are not saying this explicitly, your comments can be read as "it's a font quality issue that needs to be address on font level" which would be the wrong message. Type designers and font producers cannot, and should not, offer workaround for all other parties' faults.<br>
      If certain point constellations cause rasterization issues, it is a rasterizer bug which needs to be fixed. (Hello Apple.)<br>
      If they cause issues with cubic to quadratic bezier conversion in one or another font editor, then the conversion mechanism needs to – and can – be fixed. (Hello FontLab.)</p>
