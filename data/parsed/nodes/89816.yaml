    html: |-
      <p>The adobe curveto command requires two off-curve points between two on-curve points.  </p>
      <p>‘’This operator draws a curve from the current point to the point (x3, y3) using points (x1, y1) and (x2, y2) as control points. The curve is a Bézier cubic curve. In such a curve, the tangent of the curve at the current point will be a line segment running from the current point to (x1, y1) and the tangent at (x3, y3) is the line running from (x3, y3) to (x2, y2).’’</p>
      <p>If you can read at least as well as me, There are No Exceptions, It is Deeply Baked into PS interpreters and the cff format. </p>
      <p>Deeply, means there is as much chance of changing to “half-deadness” as there is of one being hit by lightning while being attacked by a shark in the middle of a hailstorm in the desert.</p>
      <p>If you read better than me, let us know.</p>
