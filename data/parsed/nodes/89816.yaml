      Does TT even explicitly prohibit half-dead curves?<br>
      What I'm wondering is, if we know that a given font will<br>
      only ever be in PS, is it <em>safe</em> to leave in half-dead curves?</p>
      <p>BTW, Adobe does break some PS rules though - like<br>
      Slimbach doesn't bother with explicit extrema for<br>
      very small curves, like at the tips of bulgy serifs.</p>
      <p>hhp</p>
