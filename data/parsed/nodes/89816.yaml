      <p>»Half-dead curves«, I love that term :) We call them in-point bezier control points, quite prosaicly.</p>
      <p>We advise to avoid them because they will lead to distortions and extra points being inserted when the curves are converted to TTF:</p>
      <p><img src="/sites/default/files/old-images/half-dead-ttf_3424.png"></p>
      <p>The PS curve is in the mask.</p>
      <p>FontAudit isn't very reliable. Some of the things it does find are more design hints than technical errors, and it doesn't find more severe errors like half-dead curves or self-intersecting outlines.</p>
