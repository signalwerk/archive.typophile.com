      <p>I guess it'd be these:<br>
      <code>33296_Width 809<br>
      33296_Height 429<br>
      </code></p>
      <p>There's also <code>33296_State 0</code> which probably controls if the window is visible (1) or hidden (0).</p>
      <p>You can also try to reset the workspace by doing this:<br>
      1. Launch FontLab and press the 'ctrl' key.<br>
      2. Keep holding until the "Reset Workspace" window appears.<br>
      3. Select "Reset UI to default state" and press the "Reset UI" button.</p>
      <p>Hope it helps.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ResetWorkspace_4460.png"></div><p></p>
