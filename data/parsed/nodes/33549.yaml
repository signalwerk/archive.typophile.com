    html: |-
      <p>Try this:</p>
      <p>Choose Window&gt;Workspace&gt;Export Workspace...</p>
      <p>FontLab will suggest the name "UserWorkspace.rc". If you're already using this name, you might want to use a different name.</p>
      <p>Quit FontLab.</p>
      <p>In the Finder, navigate to [your home folder]/Library/Application Support/FontLab/Studio 5/Workspaces/ and find the file you just created. Open the file in a plain text editor such as TextEdit.</p>
      <p>Search for "33296_Left" and "33296_Top". The numbers to the right of these entries are the left and top coordinates of the Preview panel (relative to the top left corner of the menu bar). Change both of these coordinates to 100. Save the file.</p>
      <p>Open FontLab. Select the file you saved from the list of workspaces in Window&gt;Workspace&gt;. If it isn't already open, open the Preview panel. It should now be positioned near the top of your screen.</p>
    html_clean: |-
