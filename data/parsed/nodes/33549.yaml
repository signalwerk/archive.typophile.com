    html: |-
      <p>It's not really program code. FontLab's workspace files are just lists of things in FontLab's interface, sometimes with numbers for coordinates or dimensions. It's "human readable" xml, so a lot of it is self-explanatory. The panels, however, were not so simple. They are listed with meaningless number codes in a section called "@DOCKING_PANELS". I was able to figure out what a few of them were by saving the current workspace, moving a panel, saving another workspace, and then comparing the two in a text editor.</p>
      <p>There's normally no reason to edit these files directly--most of it can be changed from within FontLab--but it's nice to know you can.</p>
    html_clean: |-
