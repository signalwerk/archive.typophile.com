  html: <p>thought I would just post my inprogress results for a font I'm working on. <br> <br>So far, the capitals are drawn, but still need a bit of work. I'm not sure about the S and the Q. <br> <br>I wanted to create a sans that had a bit more character than most geometric sans; included thick/thin strokes; and to have a 'fun' and 'friendly' feel. I took some inspiration (esp the Q) from Bookman. <br> <br>Let me know what you think! <br> <br><img src="http://www.typophile.com/forums/messages/29/56661.jpg" alt=""></p>
