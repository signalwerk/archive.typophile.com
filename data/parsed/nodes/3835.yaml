  html: |-
    <p>There's an interesting discussion about <a href="/wiki/Greek" class="freelinking" rel="nofollow">Greek</a> fonts on Jon Coltz's hidden gem of a type site:</p>
    <p><a href="http://www.daidala.com" title="http://www.daidala.com">http://www.daidala.com</a></p>
    <p>It's always nice to see non-Latin coverage, but I have to strongly disagree with Coltz's assessment that Romulus Greek is a good design; on a formal Latin level it's great, but in terms of actual use (you know, like a font is made to be used...) it's like a transvestite shackled to Jabba the Hutt - ask any Greek (who is a Star Wars fan).</p>
    <p>But if Romulus Greek was the abyss, the fonts from the 70s he mentions were the sides of the cliff. <a href="/wiki/Matthew%20Carter" class="freelinking" rel="nofollow">Matthew Carter</a> -who was paid to make them like that by his Greek clients- himself had an allergic reaction to their inauthenticity, and made his <a href="/wiki/Cadmus" class="freelinking" rel="nofollow">Cadmus</a> font.</p>
    <p>Fortunately, Greek type design has become its own person in the last decade or so. Hopefully other non-Latin scripts can learn from its mistakes and successes.</p>
    <p>Anyway, I don't mean to sound so negative; Coltz's piece is otherwise very timely and informative.</p>
    <p>hhp</p>
