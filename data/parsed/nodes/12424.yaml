      <p>I think we're all getting closer to consensus, but I'd like to make a couple more points.</p>
      <p>The first, and more important, is that I don't want Typowiki turning into a haven for ranting any more than anyone else. Its use to all of us goes down as the amount of iconoclastic opinion stated as fact goes up. I should have stated this more clearly earlier, but a good portion of the reason why I've been defending the ability to editorialize in wiki entries -- aside for it simply making for a more refreshing, entertaining read -- is that when people are denied the ability to editorialize, there is a tendency to masquerade opinion as fact.</p>
      <p>If I make a statement like, <cite>"These two fonts are beloved by graphic designers but regarded with mild suspicion by typographers"</cite>, it's obvious that somebody's making a generalization, and anyone past a freshman English class should know that generalizations never hold true for all cases. In other words, it's obviously a statement of opinion. If I say, <cite>"It is recommended that you not use Mrs Eaves in text settings because some typographers argue that it has inappropriately wide spacing for that use,"</cite>, that has more of an air of objectivity to it, but</p>
      <ol>
      <li>it uses the passive voice, which is never a good sign and</li>
      <li>it's even more a subjective piece of writing than my first statement</li>
      </ol>
      <p>What we're really discussing here is how much subjectivity is appropriate, I think. We're all in agreement (I think) that stating our unsupported personal opinions is bad, and that at least an attempt should be made to represent the spectrum of opinion on controversial topics (unless some of you prefer avoiding controversy altogether, which does not appeal to me -- there's a lot to be learned from seeing what topics in a field are controversial). Whether we do this by pointing to forum threads or by directly embedding the opinions in the entries themselves, we should always use our own discretion and judgment and keep in mind that the wiki isn't a place to air our opinions so much as it is to provide a useful and entertaining (and both pieces are important, I think) for a broad typographic community.</p>
      <p>The <a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking" rel="nofollow">Elements of Typographic Style</a> is a useful and entertaining resource, and is, along with some of the other books I've mentioned in this thread, my guide in choosing an auctorial voice in the wiki. Do you seriously think there's any decent typographer, student or professional, who treats the Elements as inviolable law? That's an honest question -- compared to many of you here, I'm a rank newbie, but even I see that Bringhurst has his quirks and don't treat his word as law. And even plain textbooks contain much that is subjective, but they present everything so dully they bore you into accepting it much less critically. I don't know; fundamentally I treat even reference literature as a discourse, and it's useful to me to see the breadth of the discussion as well as being offered the facts.</p>
    html_clean: |-
      <p>I think we're all getting closer to consensus, but I'd like to make a couple more points.</p>
      <p>The first, and more important, is that I don't want Typowiki turning into a haven for ranting any more than anyone else. Its use to all of us goes down as the amount of iconoclastic opinion stated as fact goes up. I should have stated this more clearly earlier, but a good portion of the reason why I've been defending the ability to editorialize in wiki entries -- aside for it simply making for a more refreshing, entertaining read -- is that when people are denied the ability to editorialize, there is a tendency to masquerade opinion as fact.</p>
      <p>If I make a statement like, <cite>"These two fonts are beloved by graphic designers but regarded with mild suspicion by typographers"</cite>, it's obvious that somebody's making a generalization, and anyone past a freshman English class should know that generalizations never hold true for all cases. In other words, it's obviously a statement of opinion. If I say, <cite>"It is recommended that you not use Mrs Eaves in text settings because some typographers argue that it has inappropriately wide spacing for that use,"</cite>, that has more of an air of objectivity to it, but</p>
      <ol>
      <li>it uses the passive voice, which is never a good sign and</li>
      <li>it's even more a subjective piece of writing than my first statement</li>
      </ol>
      <p>What we're really discussing here is how much subjectivity is appropriate, I think. We're all in agreement (I think) that stating our unsupported personal opinions is bad, and that at least an attempt should be made to represent the spectrum of opinion on controversial topics (unless some of you prefer avoiding controversy altogether, which does not appeal to me -- there's a lot to be learned from seeing what topics in a field are controversial). Whether we do this by pointing to forum threads or by directly embedding the opinions in the entries themselves, we should always use our own discretion and judgment and keep in mind that the wiki isn't a place to air our opinions so much as it is to provide a useful and entertaining (and both pieces are important, I think) for a broad typographic community.</p>
      <p>The <a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking link-lost" rel="nofollow">Elements of Typographic Style</a> is a useful and entertaining resource, and is, along with some of the other books I've mentioned in this thread, my guide in choosing an auctorial voice in the wiki. Do you seriously think there's any decent typographer, student or professional, who treats the Elements as inviolable law? That's an honest question -- compared to many of you here, I'm a rank newbie, but even I see that Bringhurst has his quirks and don't treat his word as law. And even plain textbooks contain much that is subjective, but they present everything so dully they bore you into accepting it much less critically. I don't know; fundamentally I treat even reference literature as a discourse, and it's useful to me to see the breadth of the discussion as well as being offered the facts.</p>
