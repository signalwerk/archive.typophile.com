      <p>That someone would be me, and it was also me pilfering from my own entry on Ms. Licko. I'll try to clarify the wording at the end there.</p>
      <p>I like Hrant's quote, which is why I left it when I originally expanded the entry to include my text from Zuzana's entry (prior to that, the entry on Mrs Eaves consisted of <em>only</em> the quote). In its crusty way, it sums up one of the most notable opinions of the face stated on Typophile. It would be best if that linked back to the original discussion, so that people can see the context (and also see that's not the only opinion on the face on Typophile), but it presents a Typophilic point of view, which as I've said, is one of my favorite things about a Typophile wiki. If we're not going to have something different about our content, then why have it at all? Why not just have another boring link list, or go and add our content to Wikipedia?</p>
      <p>That said, if you want to move it again, I think my main objection wasn't so much that it got pulled down from the beginning as that it didn't really fit jammed into a parenthesis at the end of a paragraph. I'm pretty anal about how I use language, and I felt like that marred the flow of the entry. But I did also like the way it framed the rest of the entry. Mrs Eaves is a quirky typeface. I think it deserves a quirky description.</p>
