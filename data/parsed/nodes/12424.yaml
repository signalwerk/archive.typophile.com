      <p>Dan, I think sticking strictly to the facts would be boring. If we're going to do that, we might as well just restrict ourselves to pointing browsers at the web page for the font on Emigre's web site or on MyFonts (or FontShop, or Linotype, or whatever). You're never more than a quick Google hop away from more information on something like that. The wiki is -- or I should say I think it should be -- a repository of Typophile's wisdom on  these subjects, to help the members of our community orient themselves and look for further information on their own. I think it'll be a much more fun resource if we allow ourselves to include some of the value judgments that have come out of our conversations elsewhere in the wiki. Obviously errors of fact can't be allowed to stand, and we're restricted by the rules of commonsense netiquette and libel law, but we're trying to inform rather than sell.</p>
      <p>I think people should be able to write whatever the hell they want about themselves, whether it's straight-up self promotion, wacky (and fake) bios, or detailed information about their histories and their work. I also think that it's inevitable that people are going to go in and make tweaks to the bios for more eccentric / beloved / argumentative Typophiles' bios, and it really comes down to the members in question how they deal with that. Wikipedia has mechanisms to prevent situations in which people go back and forth editing each others' entries, and it may turn out we'll need some of that, but I think over time we'll get this stuff figured out on our own.</p>
