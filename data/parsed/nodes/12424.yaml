      <p>More important to me than the value of the quote is its provenance; Hrant acknowledges the quote as one of his, but I can't find an original source for it, so it's gotta go.</p>
      <p>Generally speaking, there seems to be some confusion about what the wiki is for. Is it a purely informational resource? Is it a usage guide? Is it a sales tool? My guess is that it's all of these things at once, in which case there are going to be lots of different styles to the entries in the wiki, which is fine.</p>
      <p>Does the current entry (edited to remove the Hrant quote) say, <cite>“man, these Typophile kids sure hate Mrs Eaves”</cite>? I don't think it does. In fact, as the author of what remains there, I know I didn't write it out of malice or disrespect. I have no beef with Emigre or Zuzana, and have nothing but respect and admiration for what I believe is the Bay Area's most successful and cutting edge type foundry. If I had to choose a side, I'd be on the side of the graphic designers I know who make excellent, and restrained, use of Mrs Eaves on a frequent basis.</p>
      <p>The entry does, however, have a mildly mocking tone, which is really more an insular thing, intended for Typophiles more than the general public. I find it simultaneously charming and annoying that typophiles are so elitist and extreme in their evaluations; in that regard my entries on <a href="/wiki/Comic%20Sans" class="freelinking" rel="nofollow">Comic Sans</a> and <a href="/wiki/Mrs%20Eaves" class="freelinking" rel="nofollow">Mrs Eaves</a> are two sides of the same coin. You know, most people really can't see the difference between Helvetica and Arial, but one is grudgingly accepted and the other is vilified. What's coming through here is that if people find my writing critical of Ms. Licko's work, I was being too subtle or just a poor writer.</p>
      <p>I'm going to stand by my assertion that pure information is not what the wiki ought to be about. We can argue about what it <em>is</em> about, but a lot of the joy I get from Typophile derives from its squirelly and insular take on typography, and really all I'm trying to do when I write the way I do is reflect some of that culture in distilled form. If there's value to maintaining the Typophile wiki as something independent from Wikipedia (which I'm sure would welcome our input), that's what I think it is.</p>
