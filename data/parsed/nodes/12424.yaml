      <p>I don't disagree and have hope that most students will realize that what is being stated is most likely more opinion and less fact. However, does that mean we can't try to <em>not</em> be claptrap? We shouldn't strive to give people a <em>real</em> resource? I suppose my situation is different from yours. I'll admit that I'm more interested in a resource that gives me the opportunity to form my own opinion. But, I don't think of the wiki as being something comparable to Bringhurst's book. For the reason that Bringhurst's book is his opinion and nobody else's. It is easy for the reader to realize that as he reads it is all one man's opinion. The wiki is going to be filled with more than one person's opinion and therefore more likely to confuse the reader/researcher/student.</p>
      <p>I suppose I don't entirely disagree with you. But, Bringhurst isn't my only source for information about typography as I probably would also read the dry generic typography textbook as comparison.</p>
      <p>This has nothing to do with showing off. I'm simply of the opinion that the wiki should be clear of as much "claptrap" as possible. For instance, going back to Mrs. Eaves. I think a discussion thread is the more appropriate place to talk about how some people find it completely useless as a text face thus allowing others to respond with how they have used it and how they used it. Perhaps teaching listeners how to set up their H&amp;Js to accomodate it as a text face. If we allow opinion not backed up by fact in the wiki it will become nothing more than another form of discussion area.</p>
