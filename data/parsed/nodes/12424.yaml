      <p>Also, I'd like to politely suggest that people who would like to make radical alterations to existing wiki entries might want to send a short note to the author or last modifier(s) of the entry notifying them that they're about to do so. We all think hard about what we write to the wiki, and especially in the longer entries, if we come back to something on which we've spent a lot of time, we're likely to be surprised and dismayed if it no longer reflects the spirit of what we wrote.</p>
      <p>It would be better, towards that end, if the revision history and authorship status of wiki entries was exposed sooner rather than later. Wikipedia's UI presents this information well, and since it's open source, there's no reason we can't coopt their interface design for our own purposes.</p>
