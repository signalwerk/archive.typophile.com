      <p>"I’m an avid reader of reference books like encyclopedias or grammars. From the best of those I’ve learned that the best writing in such resources is concise, complete, and unafraid to pass judgment"</p>
      <p>Forrest is actually right on.  Despite their pedantic qualities, reference works are literature, and literature contains opinions.  If anyone were to read my Zapotec dictionary straight through, you'd have no doubt that I lean strongly toward anarchy as a political belief.</p>
      <p>Now, if you want to do this Wiki right, we should all be leaving an author code after writing an entry, as well as after editing or commenting on an entry.  A history is then established, and a particular author must take responsibility for his/her opinion.  It's really the only way to do a reference work where multiple individuals are producing the material.  It's just professional.</p>
      <p>A.</p>
