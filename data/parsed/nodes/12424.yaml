      <p><em>…a repository of Typophile’s wisdom on these subjects…</em></p>
      <p>The comment on the Mrs. Eaves wiki entry isn't wisdom, its entertainment.</p>
      <p>I certainly don't have a problem with personal expression on the wiki. I just pulled out <a href="/wiki/Stephen%20Coles" class="freelinking" rel="nofollow">Stephen Coles</a>' entry because I thought it was pretty funny. That shouldn't go away. But no one is going to be misled about Stephen's character by that. I didn't even mind the entertaing Hrant quote in the Mrs. Eaves article. I didn't delete it, I just moved it. I don't see what is so bad about that. The wiki would still cool that way…</p>
      <p>But we do need some sort etiquette. We have an entry of <a href="/wiki/German%20nationalism" class="freelinking" rel="nofollow">German nationalism</a>. This is touchy (I was surprised that you "wikified" it at all in your Koch entry). If someone were to edit that in a negative light, it would make the wiki look bad and less reliable. I think that it is just a matter of time, too, before someone edits someone's personal wiki entry with something slanderous in it ("so and so is the Javert of type…"). And nobody wants to see that happen.</p>
      <p>Certainly saying that Mrs. Eaves has a speech impediemnt isn't comparable, but I still think that we should respect the typeface enough to put that anywhere else in an entry instead of the biginning.</p>
      <p>I'm ranting too much about this, sorry…</p>
