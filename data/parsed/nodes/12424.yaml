      <p>I am torn about this. On the one hand, there's no point having a Wiki which is just a free-for-all, with people endlessly scrubbing and rewriting each other's views, so I write "Wilbur Poodlesmith was a genius who designed some of the most beautiful but under-rated typefaces of the mid-19th century" and you come in and change it to "Wilbur Poodlesmith was an alcoholic monster who designed some of the most misbegotten letters ever to see the light of day", and I scrub out yours and you scrub out mine ... and so on.</p>
      <p>On the other hand, if all we have is "Wilbur Poodlesmith, typeface designer, mid 19th-Century" it's going to get pretty dull. Without some opinions expressed it's going to get pretty dull.</p>
      <p>Can I suggest the following. (1) People should try to include more than <em>just</em> opinions, and should try to make it clear what is fact and what is opinion. So "Wilbur Poodlesmith, 19th century type designer. Some of his type is pretty awful." is just about OK, but "Wilbur Poodlesmith. Guy whose type sucks." is not. (2) Where you know opinions differ, it would be best to make that clear. (3) If you come across an opinion that you disagree with, try not just to change it but to modify it so that it becomes balanced. So if someone has written "Wilbur Poodlesmith, horrible romantic type" but you happen to think it's great, try "Wilbur Poodlesmith. His reputation is controversial: opponents dislike his "horrible romantic type", but others see greatness in the romanticisim." (4) In extreme cases, remove the opinion topic to a thread on the forum and link to that, so that readers can see the "raw debate". (5) Where there is a known "majority opinion", people who are in the minority should be especially careful not to present their own known-to-be-minority views as simply true. Conversely, where there is a known minority view, majoritarians should not suppress that.</p>
      <p>In other words, we should try to be objective enough to strive to produce not facts-without-opinion or facts-with-our-opinion, but facts-with-balanced-opinion. It will take time to shake down, but I should have thought it is possible.</p>
