      <p>I have to say, Tiffany, that I disagree. Dan hasn't even talked me around to his comparatively more moderate way of seeing things. I think a curious student is going to learn very quickly that much of typographical "history" and "practical advice" is a sea of subjective claptrap masquerading as fact (see the Design Observer's <a href="http://www.designobserver.com/archives/002559.html" rel="nofollow">discussion of BS</a>). I think we all go through a phase where we show off to our friends and families our mastery of some body of knowledge by parroting some "facts" we got out of our reading, rather than articulating beliefs we've arrived at after research and deliberation. In fact, some (many? most?) designers never get beyond that point.</p>
      <p>I am, always have been, and always will be a student. Learning is what I do. I <em>never</em> assume that anything anybody tells me is the straight truth. I believe everyone writes even the driest of factual writing from their own point of view, and never rest any important judgment on a single source, even if it's one I generally trust. That's just good scholarship to me. Much of American pedagogical and journalistic discourse is based on the idea of "objective" and "balanced" truth, which means in practice that everyone hides their ax-grinding behind a façade of dry, disinterested "facts".</p>
      <p>Meanwhile, I get my news from the Economist, which is opinionated to the point of pugnaciousness (and represents a worldview <em>very</em> different from my own). It's very clear where their editors and writers are coming from. The New York Times may have a public ombudsman and struggle to maintain balance, but the Economist does a much better job of informing me, because they lay their prejudices out where I can see them, and therefore allow me to set my error bars accordingly.</p>
      <p>Stripped of all the fancy rhetoric, here's what I'm saying: I don't think we have any obligation to pitch the Typowiki to the lowest common denominator. It's our collective vision of the typographic world. 9 times out of 10, that means that what we're going to have is going to be no more subversive or radical than any other reference someone has on their shelves. But that 10th time, somebody might end up provoked, amused, or even educated in a way they wouldn't have otherwise. We have an obligation to be fair, but being fair doesn't always mean being balanced, and balance isn't always useful.</p>
      <p>Let me put it another way: which would you rather read, the <cite><a href="/wiki/Elements%20of%20Typographic%20Style" class="freelinking" rel="nofollow">Elements of Typographic Style</a></cite> or a bland, generic typography textbook?</p>
      <p>I do think that in a collaborative environment such as the Typowiki attributions are probably necessary. The Economist doesn't attribute their articles, but they also have an editorial board that's ultimately responsible for the content of the magazine, a luxury we don't have (or even want, right?).</p>
