      <p>Yes, let's discuss this!</p>
      <p>As the author of some of the contentious bits of that article, let me explain my rationale. I'm an avid reader of reference books like <a href="http://www.amazon.com/exec/obidos/tg/detail/-/031213486X" rel="nofollow">encyclopedias</a> or <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0198602634" rel="nofollow">grammars</a>. From the best of those I've learned that the best writing in such resources is concise, complete, and unafraid to pass judgment. People come to reference works for context, so they don't want to get bogged down in details (although, uh, I sure like to provide them) and they do want to know where certain things fit in. A little bit of opinion isn't going to hurt.</p>
      <p>Let's look at your revisions to <a href="/wiki/Mrs%20Eaves" class="freelinking" rel="nofollow">Mrs Eaves</a>. To my eye, <em>[Its] popularity can be attributed to Licko’s fresh take on a classic -- with an infusion of delicate features and a robust set of ligatures</em> reads less like a "fair evaluation" and more like marketing copy, and <em>These designers believe its readability as a text face suffers due to it’s relatively tall ascenders</em> doesn't really capture the Typophile sentiments I've seen expressed by Hrant and others (although his punchy quote that I placed at the beginning of the entry captures this sentiment wonderfully). I personally love Mrs Eaves, but I thought the sentence I wrote did an accurate, and concise, job of summing up the divide in opinion I've seen on the face on place like Typophile and in the real world. I've run into lots of folks online who don't like Mrs Eaves, but almost all of my designer friends in real life count it as one of their favorite typefaces.</p>
      <p>Like I said <a href="http://typophile.com/node/12418" rel="nofollow">elsewhere</a>, the nice thing about wikis is that the tendency is for entries on them to gradually evolve towards equilibrium. With wikis like <a href="http://en.wikipedia.org" rel="nofollow">Wikipedia</a>, this is helped by the fact that all visitors who care can see the page's revision history, and restore things that they feel have been cut unfairly. I've read that Typophile's wiki tracks revisions, although the UI has not yet been exposed. I'd prefer to write opinionated things and allow folks to tweak them as they see fit, and to come back and tweak them later myself, than to try to pretend to a dispassion I don't feel when I first write entries. I get enough "he said / she said" journalism from the media, where "balance" has replaced accuracy (to say nothing of facts or the truth). Typophile is a crusty, opinionated community. I think our resources will be more entertaining -- and more useful -- if we allow them to reflect that fact.</p>
