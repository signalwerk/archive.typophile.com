    date_raw: 17 May 2005 — 1:43pm
    votes: null
    html: <p>Also, wikis tend to evolve towards some sort of factual homeostasis over time, as people correct and change each others' work. It's possible for moderation wars to erupt, as die-hards squabble over the wording of some controversial topic, but in my experience this happens less often than I feared, and the real risk is that a wiki is left untended, so people's sneaky attempts to subvert the content are allowed to go unchallenged because nobody else who cares ever sees them. I'd be more worried about that in the case of the Typowiki than, say, two of our more opinionated members getting in an argument over the wiki entry on readability. We are, for the most part, grownups here.</p>
