      <p>Typowiki boundaries:<br>
      Some things are better left for other wikis. If there are entries on Typophile for <a href="/wiki/German%20nationalism" class="freelinking" rel="nofollow">German nationalism</a> or <a href="/wiki/Christianity" class="freelinking" rel="nofollow">Christianity</a> for examples they should center around the typography related aspects of these topics. It is not in the scope of the typowiki to encompass every conceivable topic.</p>
      <p>I'm not saying these entries shouldn't exist here - not at all. Type history is as much a product of its circumstances as anything else. I'm just suggesting that we know where to prune and know when it's better to link to Wikipedia's entry.</p>
