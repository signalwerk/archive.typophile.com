      <p>An aside: I think that the wording of the last sentence of the Mrs. Eaves entry is a bit confusing "See also: Licko, Zuzanna (from which this description of the typeface was taken), Emigre"</p>
      <p>The first time I read that, I thought, "oh, someone just copied the text from the Emigre website, or it is something that Zuzana said." Then I realized that the Emigre website wouldn't publish a text like that, and I realized that it was just referencing the the Licko wiki entry.</p>
      <p>Since we don't have a modification log displayed, and no one knows who really wrote which text in a wiki entry, I don't think that it is necessary to credit text taken from another entry. If someone wrote an "article" on typophile, I think it would be approriate to write "this text is taken from Forrest's article on Mrs. Eaves." But the wiki doesn't work that way…</p>
      <p>Does that make any sense? Its getting late over here…</p>
