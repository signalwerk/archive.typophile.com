    <p><a href="http://typophile.com/node/12415" rel="nofollow">This thread</a> prompted me to write the following. Discuss. =)</p>
    <p>I'm not a Wiki expert, but in order for it to work and be a valuable, unbiased resource, protocol (call it culture or etiquette or whatever) demands that you not let your own biases show, but that you couch biases in terms of general camps of thought without acknowledging the rightness or wrongness of the position. This is where it would be inappropriate to treat yourself as an authority and write with an authoritative air.</p>
    <p>For example the current wiki post for <a href="/wiki/Mrs%20Eaves" class="freelinking" rel="nofollow">Mrs Eaves</a> could use a scrubbing. Here's the phrase there now:</p>
    <p><em>"Mrs Eaves is beloved by graphic designers and regarded with mild suspicion by typographers, who question its legibility and fitness for use in body text."</em></p>
    <p>This has a connotation that designers like it and typographers don't and that somehow one is more authoritative. Here's my suggested edit (that someone else will surely edit after me):</p>
    <p><em>Mrs Eaves is a highly popular typeface among graphic designers as evidenced by it's wide use. It's popularity can be attributed to Licko's fresh take on a classic - with an infusion of delicate features and a robust set of ligatures. Some of its wide adoption can also be attributed to <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre's</a> popularity and visibility among graphic designers as a foundry willing to push the boundaries of conventional typography. </em></p>
    <p>Some designers question Mrs Eaves fitness for use in body text. These designers believe its readability as a text face suffers due to it's relatively tall <a href="/wiki/ascender" class="freelinking" rel="nofollow">ascenders</a>.</p>
    <p>(And this is where I'd fully expect someone to elaborate on this, suggesting alternate reasons why it's legibility is in question. Others might write their piece suggesting why the  legibility of Mrs Eaves is just fine. But this wiki post for Mrs Eaves should not become a wiki entry on readability.</p>
    <p>See how both positions are put forward. There may be some of my own biases showing, but its presented in terms of both sides of the argument. It would be uncool if someone now edited the post and said, "it rocks" or "it sucks."</p>
    <p>Now, too bad there's nothing under <a href="/wiki/Comic%20Sans" class="freelinking" rel="nofollow">Comic Sans</a> yet. =)</p>
