      <p>I'm going to post from my gut first, to get it off of my chest, and then come back later after I've had a chance to articulate my thoughts on this topic of debate.</p>
      <p>First, I don't think the wiki should be used to voice our opinions about any given topic. For a wiki to be useful, from an academic point of view, it needs to stay clear of opinion and focus on what is known and true. However, I think Dan's idea of separating the wheat from the chaff is good. If someone must post opinion it needs this is a good way to do it.</p>
      <p>Second, the wiki could become a very useful tool for students most of whom are still very malleable and perhaps too receptive to the opinion of others. The forums are a good place for them to read what others think, but I think the wiki should be a place where they can go to find information. Perhaps even using it in their own essays. The wiki will not be able to be used academically if it is full of opinion. Well, ok, that isn't entirely true. But, by posting opinion you are muddying the academic water. </p>
      <p>Students read these forums and some of them just assume what we say is true and stop looking. Now we all know that this isn't right and perhaps they need to think a little more. But, I've seen it happen in other forms. Just think before you type, consider appropriateness and consider Dan's method.</p>
      <p>In regards to the <a href="/wiki/Mrs.%20Eaves" class="freelinking" rel="nofollow">Mrs. Eaves</a> wiki entry. The more useful think to do, if you do think your thoughts are true: "Both type families are beloved by graphic designers and regarded with mild suspicion by typographers." Please explain why. Start a thread, link to a thread. Students will follow the links. They will want to know why so when they go to class the next day and someone is using Mrs. Eaves in what might be perceived as erroneous they will be able to contribute to the critique in a more articulate fashion.</p>
