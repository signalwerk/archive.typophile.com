      <p>I don't think you're ranting, I think this is something important to get right, and to get right earlier rather than later. I think the wiki has a lot of potential to be both useful <em>and</em> entertaining, and I'm trying to get in on the ground floor and make sure it works out that way. I read the entire <cite>Encyclopedia of Science Fiction</cite> from cover to cover not so much because I wanted to know everything in it but because it's as useful as a critical resource as it is an informative one. Reading the <cite>Encyclopedia of Science Fiction</cite> teaches you what the science fiction community thinks of itself, and without its occasionally opinionated judgments, it wouldn't do nearly as good a job of that.</p>
      <p>Obviously we have to use discretion, and obviously we all have to keep an eye on the content. I created a cross-reference to German nationalism in my Koch entry because I think it's key both to forming an accurate understanding of pre-WWII German typefounding and to people who seek to conflate German type with Nazism. The Blackletter special interest group wouldn't exist on Typophile if this weren't a topic that had come up several times in the past (viz. all the discussions on Steven Heller and his frequent borderline implications that blackletter is somehow inherently Nazi). It's possible that neofascists could come in and hijack that entry and it would turn into some sort of gigantic fandango. At the same time, I feel like it's important to include Koch's nationalism as well as his Christianity, because it had a huge impact on how he thought about type. And to fully discuss the nationalism of people like Rudolf Koch and the other German type crafters of the era, it's important to place into context that German nationalism at that time and place could have more to do with Goethe than <a href="http://en.wikipedia.org/wiki/Goering" rel="nofollow">Goering</a> (the Wikipedia entry is worth reading in light of this discussion). You know?</p>
