      <p>Revision history:<br>
      Yes, the wiki has revision history built in - we are still ironing out the implementation of it. Rest assured it can be rolled back if someone is vandalizing an entry.</p>
      <p>Copyrighted text:<br>
      It's not cool to paste copyrighted text form people's sites. Don't do it. If the company or organization said it better themselves consider linking to the text or excerpting small portions of it.</p>
      <p>Forrest, the <a href="/wiki/Comic%20Sans" class="freelinking" rel="nofollow">Comic Sans</a> entry is better than the <a href="/wiki/Mrs%20Eaves" class="freelinking" rel="nofollow">Mrs Eaves</a> entry (I'm not implying you wrote the whole of either of these). Some bias is showing, but it successfully presents both sides of the story. </p>
      <p>I have to concur with Dan that the reference to Mrs. Eaves, the person belongs at the bottom as a reference to how the font got named, and not as it describes the font. It is certainly not the main point of the entry.</p>
      <p>If that entry helps someone make an informed decision about using or not using Mrs Eaves then it's working. If the entry makes someone think, "man, these Typophile kids sure hate Mrs Eaves" then it's not succeeding at credibility or usefulness. </p>
      <p>In other words, if someone have a beef with Mrs Eaves or with Emigre or any other topic, it doesn't belong in the wiki. What belongs there is intelligent facts and commentary that presents both sides of a topic.</p>
      <p>Regarding <a href="/wiki/Stephen%20Coles" class="freelinking" rel="nofollow">Stephen Coles'</a> entry: he originally wrote that to be funny, while we were in testing. I went back and added the bit about "Stephen Coles describes himself as..." so that the entry was not in the first person.</p>
