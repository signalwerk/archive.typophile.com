  html: |-
    <p><a href="http://www.fontshop.com/fontlist/genres/stemless_sans_serif/?&amp;sample_text=intava&amp;sample_size=144" rel="nofollow">Spurless sans fonts</a> seem to be (or have been) rather plentiful and/or marketable in the last couple of decades. In the nineties when Dax became popular the style felt fresh but these days for me the genre has been done to death, so the new Adobe Clean (as a current example) feels a bit faddish. </p>
    <p>I'm wondering whether the style is still useful. Do people still need spurless sanses? More precisely, I'm considering putting a set of alternate spurless variants in my font <a href="http://www.typophile.com/node/65841" rel="nofollow">Gecko</a>. My reservation is that it could look contrived — since the base font has spurs, the last thing I'd want to do is pay lip service to a wholly different (incompatible?) genre. On the other hand it could add value to the font as the typographer would have two fonts in one.</p>
    <p>Here's a screen capture to better judge. Any thoughts very welcome.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Gecko-Spurless_4164.gif"></div><br>
    (And there's an alternate g and e in the second one too)<p></p>
