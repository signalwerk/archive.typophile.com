    votes: null
    html: "<p>Before debating on the iniquities of South America further please read Hudson's post on Gross National Income. Note that Poland and the Czech Republic are a long way behind Argentina - are we seeing such problemswith Polish and Czech members whining about fees? <br> <br>Please also note the comparative wealth between Argentina and India - now whine some more about your situation? <br> <br>The figures point towards ATypI fees being something like half a days income in most Western European and North American states, and around two days income in Central Europe and South American states. <br> <br>This comparison is not worth arguing over, they eithr want to be members or they don't. <br> <br>A more problematic figure is the comparitive cost of attending the conference: a couple of weeks income in the better off places, versus a couple of months income in the less well off. <br> <br>There's no solution to this. But ATypI seems to have gone out of its way to put as much information as possible on the web in recent years, particularly in relation to the conference - this is superb access to those who cannot get to the conference itself (as I might add is this forum). <br> <br>In addition there is no reason at all why members anywhere in the world canot organise their own local events. <br> <br>While I'm here I might just note that there is comparitively low conference attendence and mmbership in Australia and New Zealand - again this is due to low local membership and the rigours of travelling - not the relative incomes.</p>"
