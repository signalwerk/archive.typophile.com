    html: <p><i>Note that Poland and the Czech Republic are a long way behind Argentina - are we seeing such problems with Polish and Czech members whining about fees?</i> <br> <br>Membership drops off sharply below GNI per capita of 19,000 (with the exception of Spain). Argentina, Poland and the Czech Republic are all in the same economic range in the spreadsheet I am building. We currently have four Argentinian members, four Polish members and two Czech members. <br> <br>Perhaps the reason that our Argentinian colleagues are being so vocal is that, while the Poles and Czechs are gradually seeing their economies improve and are to be welcomed into the European Union in two years, the Argentinian economy is still very unstable, may collapse further, and Argentinians might justifiably fear that the world is turning away from them.</p>
