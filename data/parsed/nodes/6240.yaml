    html: "<p>&lt;i&gt;I think this ignores the basic fact that it costs as much, if not more, to \"service\" these discounted memberships as it does any other membership.&lt;i&gt; <br> <br>I've been very careful to take this into account while thinking about this. I mentioned earlier that ATypI needs to find more efficient solutions, and this includes more efficient membership management and service. The association needs to do this anyway, regardless of whether fees are adjusted, because we need to free up resources for other things. <br> <br>There is also an economy of scale at work here: servicing two members does not cost double what it costs to service one. I suspect we are probably already near the point at which, for example, doubling the number of members to be serviced would not have a significant impact on resources, presuming an efficient management system. If you can service 500 members, you can probably service a thousand at not much more cost. <br> <br>I disagree with your assessment. I think there are grounds for discounted membership <i>and</i> a practical model for implementing it without risking a decrease in overall revenues. Of course there are further issues to consider, but these should be looked at by the ATypI board. I'm encouraged by the figures I have run, and think the possibility is worth the board's attention. I certainly don't think it is the place of an anonymous poster to a discussion forum to tell anyone 'no you can't have discounted membership'.</p>"
