    html: "<p>Tanya writes: <i>If the only pass to membership in ATypI is a cheque for base fees, then its not much more valuable then my Blockbuster card...</i> <br> <br>ATypI membership used to require recommendation of existing members, review, etc., because the association was basically a private club for type manufacturers and type designers. Over the past decade, ability to pay has indeed become pretty much the sole criterion for membership. Remarkably, this has not generally lowered the prestige of the association, such as it is: the quality of membership remains high. The risk of devaluation of membership is there, but it hasn't hit in any significant way. Indeed, I think the increased diversity of membership has been very positive, offsetting the risk. <br> <br>The GDC is a professional association in much the same way that doctors and lawyers have such associations. It provides an organisation framework for defining ethical business practices, pricing norms, etc. There are very tangible benefits to membership and also tangible benefits to clients in knowing that the designers they hire belong to such an association. ATypI doesn't really function this way: it is a social and business association in which type designers, type vendors and font technology meet to exchange information, discuss common concerns, and celebrate a common love of typography. The latter aspect also attracts graphic designers, printers and other people with an interest in type. That is a very different constitution than a professional association like the GDC, in which all the members are basically involved in the same kind of work. One of the peculiarities of ATypI is that most of my clients are also members, which would certainly not be true of most professional associations.</p>"
    html_clean: "<p>Tanya writes: <i>If the only pass to membership in ATypI is a cheque for base fees, then its not much more valuable then my Blockbuster card...</i> <br> <br>ATypI membership used to require recommendation of existing members, review, etc., because the association was basically a private club for type manufacturers and type designers. Over the past decade, ability to pay has indeed become pretty much the sole criterion for membership. Remarkably, this has not generally lowered the prestige of the association, such as it is: the quality of membership remains high. The risk of devaluation of membership is there, but it hasn't hit in any significant way. Indeed, I think the increased diversity of membership has been very positive, offsetting the risk. <br> <br>The GDC is a professional association in much the same way that doctors and lawyers have such associations. It provides an organisation framework for defining ethical business practices, pricing norms, etc. There are very tangible benefits to membership and also tangible benefits to clients in knowing that the designers they hire belong to such an association. ATypI doesn't really function this way: it is a social and business association in which type designers, type vendors and font technology meet to exchange information, discuss common concerns, and celebrate a common love of typography. The latter aspect also attracts graphic designers, printers and other people with an interest in type. That is a very different constitution than a professional association like the GDC, in which all the members are basically involved in the same kind of work. One of the peculiarities of ATypI is that most of my clients are also members, which would certainly not be true of most professional associations.</p>"
