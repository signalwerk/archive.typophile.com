  html: "<p>Someone writes: <i>The barrier is not monetary. The barrier is that the org is fairly script-centric - there's pretty much no interest in it for other than Roman scripts and vice versa.</i> <br> <br>I think that ATypI is already less focused exclusively on the Latin script than it was when I first attended a conference in 1994. A long term change in the membership demographic would further diversify the focus of the association's interest. I would consider this a good thing. <br> <br>It is also worth noting that the Latin script is the sole or major major writing system of an incredibly large number of countries around the globe, so being Latin-centric does not necessarily mean being Euro-centric or Anglo-centric.</p>"
