    html: "<p>Hudson wrote: <br>&gt;The point is that while there are plenty of people in the USA who cannot afford to pay $100 to join ATypI there are many other people who can, but there are other countries in which almost no one could afford such a sum. Adjusting this general  balance is a good idea. <br> <br>-------- <br> <br>I think this ignores the basic fact that it costs as much, if not more, to \"service\" these discounted memberships as it does any other membership. <br> <br>You can't apply local economic conditions to a \"global\" org. Espcially when the economics of that org are based around the economies of the more expensive countries in your list. <br> <br>The answer is simple: no you can't have discounted membership. Yes you can set up your own local organisation, with local economics in mind, and be somehow affiliated with ATypI. <br> <br>Hudson also wrote: <br>I think that ATypI is already less focused exclusively on the Latin script than it was when I <br>first attended a conference in 1994. <br> <br>------ <br> <br>I think most typophiles have a general interest in other script systems, you probably moreso than many. But the fact is that those more interested in Indic, Arabic or CJK for example are not really going to be that interested in ATypI as an org because there are other setups that reprsent their needs more accurately. <br> <br>If ATypI were to try to organise a conference in Tokyo it would fail miserably - you know this as well as I. <br> <br>As my previous post, look to Australia and New Zealand for some comparison too.</p>"
