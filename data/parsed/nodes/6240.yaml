    html: "<p>John Hudson wrote: While Tanya's idea is interesting and creative, I think it would distract the already over-extended volunteers who keep the association ticking. We need to find more efficient solutions, not more complex ones. <br> <br>John et al., <br>My suggestion is not anything new. Here in Canada Graphic Designers must belong to the provincial associations where they live if they want membership to the Society of Graphic Designer's of Canada. The accreditation here is close to becoming law for all practicing designers, offers benefit packages, mediates, runs conferences, describes our By-Laws and Standards.  <br> <br>So to get that membership...well take my situation for instance: I have 4 years combined education and practice specifically in Graphic Design (not including previous related feilds, illustration, the Arts, management ect.) but I still must wait another 3 years and study their massive reading list until I can take the test, and interview in front of the their Evaluation Board, pray I pass, and only then am I a member. For now I'm simply a \"Provisional Member\" regardless of any success or future certificates. 7 years total. <br> <br>The only creative and perhaps complex part of my suggestion is determining the fee/score ratio. While I don't suggest that the testing be as extreme as it is in Canada with all the time, and educational requirements; I strongly suggest you consider the approach before you write it off as complex. Many Associations run tests or review applicants before granting membership.  <br> <br>If the only pass to membership in ATypI is a cheque for base fees, then its not much more valuable then my Blockbuster card...and you run the risk of defending your Org in these situations where money becomes an issue (of which its clearly not) <br> <br>Reform isin't that hard. The proper volunteers and dedication its bound to propel itself smoothly and garner plenty of appreciation.</p>"
