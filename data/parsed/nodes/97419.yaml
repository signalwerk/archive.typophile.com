      <p>Try to avoid Dafont - it's 99% crap (and that's a conservative estimate). The few dollars you save will cost you later, not least in terms of conveying an inferior image of your company. You can easily find an affordable font that does the job right; you might even find something you can also use for setting text, not just the logo.</p>
      <p>I personally think the "A" as a beaker works. But nice beakers aren't all straight lines - they're straight lines joined by soft curves.<br>
      <a href="http://eventcamptwincities.files.wordpress.com/2010/06/beaker_icon-007.png" title="http://eventcamptwincities.files.wordpress.com/2010/06/beaker_icon-007.png">http://eventcamptwincities.files.wordpress.com/2010/06/beaker_icon-007.png</a><br>
      Find a font like that, and when you replace the "A" with a nice beaker it'll click just right.</p>
      <p>Having liquid in the beaker: if you can make the water line express the horizontal bar of an "A" that would be great.</p>
      <p>hhp</p>
