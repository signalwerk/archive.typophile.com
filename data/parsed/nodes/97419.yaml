      <p>&gt; Do you really think a highly detailed beaker for an "A" is a good idea?</p>
      <p>Generally I prefer simplicity in a logo, but the beaker area looked dull and it was a suggestion off the top of my head. It's more visually interesting now, although it now has details that won't hold up in small sizes. </p>
