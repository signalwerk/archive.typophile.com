      <p>What I was trying to get at was that you need a better concept, even if you can execute this one perfectly. Replacing a letter with a similarly shaped object is often too obvious and not a compelling solution. Try some brainstorming strategies and get inspired and creative. It is worth it.  One thing that pops out to me is the similarity between the graduations on a beaker and many media related things (sprocket holes, timelines, music score, pixel grid, etc.) Here are some possible sources of inspiration:</p>
