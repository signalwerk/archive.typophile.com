    html: "<p>OK, so maybe you need to really embrace the beaker idea with this project. Go back to your basic ingredients, experiment, mix it up. Big thinkers and go-getters should be great at this. Ideas are your lab kit. It is your opportunity to show off how creative and great your process can be. I still don't know why it is not Beaker 2 or Beaker 42, or why not just beaker. Really define what you want people to think when they experience your branding: fun or serious, youthful or experienced, edgy or reliable, flashy or subtle, emotional or rational, etc. Get in the lab with those carefully considered ingredients and start experimenting with keywords, imagery, type styles, word mapping, free association, doodles, photos, mood boards, and any other strategy that you can come up with to generate some material to manipulate and evaluate. This is the ideation phase of the experiment. The goal is to get as many different ideas as you can, and not care if they are refined or look good at all. It will take a good amount of work and lots of unusable ideas, but you will end up with some good ideas, and a strong basis for execution. Then you can turn on the computer.</p>"
