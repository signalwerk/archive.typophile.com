      <p>Ashley some details in the beakers (especially the bubble reflections) are way too small. Reduce the logo to postage-stamp size and see what happens. Elements need to be bold enough that they'll still be visible when the logo is small (like on a business card, small web ad, etc.).</p>
      <p>Regarding the font, I'm glad that you're trying alternatives, but I almost feel like you're shooting in the dark. You might want to consider bringing in an outside graphic designer to help out. If you find a local one maybe you can barter a trade of services or something if the budget is tight.</p>
