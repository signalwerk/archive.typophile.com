    html: |-
      <p>Most book type around that time was still set by hand using foundry type. There were numerous foundries, often catering to a limited geographical area, and type styles that were popular elsewhere were often copied or imitated. ATF, which manufactured the Century types, mainly supplied type in North America, so the type in your example is not likely to be Century, even if the dates fit. </p>
      <p>Century was not an entirely original design, but one instance of a style of type (modern) that had been around for a while. So, looking at old books like this you'd think it was Century, but that's only because it's one of the few of in style that is still in use.</p>
