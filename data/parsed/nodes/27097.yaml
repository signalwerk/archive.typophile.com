  html: <p>In case you haven't already heard, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fonts&amp;searchID=2&amp;searchby=manufacturer" target="_blank">FontFont</a> and <a href="http://www.fontshop.com/index.cfm?fuseaction=virtual.content&amp;area=sf_products&amp;content=/virtual/fssf/products/fuse.htm" target="_blank">FUSE</a> are turning 15. That's quite the milestone for an institution of digital typography, an industry that isn't much older. FontShop has been organizing a big fat exhibition to celebrate the anniversary. The traveling show is curated by FontShop founder Erik Spiekermann, with Dutch writer-designer Jan Middendorp, author of Dutch Type. It will feature dozens of the best examples of FontFonts in use. <br> <br>There is still time to submit your own work for possible inclusion in the show. Anything that makes use of typefaces or pictograms from the FontFont library or the FUSE collection will be considered - books, magazines, posters, and newspapers, as well as examples of packaging, signage, gadgets. <a href="mailto:ff15@fontshop.com">Send an email</a> with previews (keep images under 1MB, please) of your work to FontShop and they'll tell you if there's a place for it in the exhibition. Questions can also be directed to that address.</p>
