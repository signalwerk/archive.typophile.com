    <p>There is a peculiar new humanist sans used on the screens of the local Fortis ATM machines, and it is also featured once on the BNP Paribas website. I know the sample is rather small, but I think there are enough trademark characters to recognise the typeface.</p>
    <p>Thanks.</p>
