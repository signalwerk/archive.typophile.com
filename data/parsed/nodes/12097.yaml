    <p>Born: 1961</p>
    <p>Bob Aufuldish is a partner in Aufuldish &amp; Warinner and an Associate Professor at the <a href="/wiki/California%20College%20of%20the%20Arts" class="freelinking" rel="nofollow">California College of the Arts</a>, where he has taught graphic design, typography, and new media. Currently, he is Design Director of Sputnik <a href="/wiki/California%20College%20of%20the%20Arts" class="freelinking" rel="nofollow">CCAC</a>, a student-staffed design office producing work for the College.</p>
    <p><a href="/wiki/fontBoy" class="freelinking" rel="nofollow">fontBoy</a>, a digital type foundry, was launched in 1995 to manufacture and distribute fonts designed by Mr Aufuldish and his partner <a href="/wiki/Kathy%20Warinner" class="freelinking" rel="nofollow">Kathy Warinner</a>.</p>
    <p>His work has been included in competitions, exhibitions and publications sponsored by The American Center for Design, The American Institute of Graphic Arts, Communication Arts Magazine, Critique Magazine, Design Net Magazine (Korea), Graphis Magazine, How Magazine, ID Magazine, Mediamatic Magazine, The New York Type Directors' Club, Print Magazine, See: a Journal of Visual Culture, University and College Designers Association, and Zed, the journal of the Center for Design Studies, among others.</p>
    <p>Bob has a BFA and MFA in graphic design from Kent State University, Ohio, is skinny and well-liked.</p>
