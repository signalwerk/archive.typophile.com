      <p>Actually, I can easily see how to do this in OpenType. You don't need any dictionaries of words or anything, just a backwards chaining contextual substitution. Same techniques I used to produce some of the fancy effects in the sample contextual code I posted a couple of years ago.</p>
      <p>Part of the trick is to use individual letter substitutions rather than any ligature stuff.</p>
      <p>One way of doing it would be with some code that in FontLab or the Adobe FDK looks like this:<br>
      <code><br>
      feature calt { # Contextual Alternates<br>
         sub @reg_let' @reg_let @reg_let @reg_let space by @spec_let<br>
         sub @reg_let' @reg_let @reg_let space by @spec_let<br>
         sub @reg_let' @reg_let space by @spec_let<br>
         sub @reg_let' space by @spec_let<br>
      } calt;<br>
      </code></p>
      <p>Mind you, that's a simplified version which will only work with words up to four letters long, but I'm sure you get the idea. You just need to define each of those glyph classes to include the same number of glyphs, and create an entire set of extra "special" glyphs in the font, where each one has the "regular" glyph struck through, plus the same glyph without the strike-through raised above it.</p>
      <p>Somebody with a bit of Python experience could doubtless automate the creation of those added glyphs, btw.</p>
      <p>Cheers,</p>
      <p>T</p>
      <p>Thomas Phinney @ Adobe</p>
