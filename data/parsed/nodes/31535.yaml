      <p>I am not sure if I understand what you are asking for. I waited, and no one else has jumped in, so perhaps a clearer explanation would help?</p>
      <p>Unfortunately, if I get what you are describing, the answer is probably, "no." That sort of event is beyond the intentions of OpenType, as far as I have heard or imagined. However, even as I say that, there <em>might</em> be some way to hack it to do so....</p>
      <p><strong>If it is even possible</strong> you would likely need some sort of generationg script to create a bruteforst word-string set. Start with a substitution for each character with a struck alternate. Add a condition to apply it when a space appears after 1,2,3,4,5,6... characters. That would require a contextual rule that can allow wildcards between the character to be subbed, or a script to generate all possible combinations. I think the former is a no-go. The latter is probably the only possible way, and would result in a set of tasks that would likley bog down any OT rendering engine beyond usablity.</p>
      <p>When then leads to, what application would you be trying to present this in, that supports OT in the way you want?</p>
      <p>You might be best off creating some sort of flash demo with actionscript or a similar lightweight language and presentation app.</p>
      <p>Sorry I can't be more definite here. OpenType is a dark and nebulous  art, like immortality or understanding women. ;)</p>
