    <p>i was working on creating a logotype for 'school of applied communication'<br>
    having tried a few dozens of typefaces i got fed up and decided to try and develop my own lettering for it.</p>
    <p>to cut the long story short, the client chosen a futura logotype over my design.</p>
    <p>here's my rough logo done with a brush and indian ink.<br>
    i haven't digitised it yet, but since its been rejected i probably won't.</p>
    <p>any feedback is welcome as this is my 1st jab at type design.</p>
