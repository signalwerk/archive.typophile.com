    html: <p>I received <a href="http://www.amazon.com/gp/product/0810949652" rel="nofollow">this book</a> for Christmas, and it is set in <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=scala%20sans" rel="nofollow">Scala Sans</a>. The spacing of this typeface has always been a bit problematical, but I'm impressed once again by how well it works for continuous text of this sort, i.e. interrupted by frequent illustrations that readers will typically pause to enjoy. This is the sort of context in which a sans serif can work quite well.</p>
