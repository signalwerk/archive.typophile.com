    html: |-
      <p>I have many, but these are my current favorites:</p>
      <ul>
      <li><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=balance" rel="nofollow">FF Balance</a> - This has so much character merely because the stress is horizontal rather than vertical. Looks great every time I see it (which is sadly too rare).</li>
      <li><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=strada" rel="nofollow">FF Strada</a> - Simple forms mixed with some organic terminals and a thoughtful italic. Mmm. <a href="http://static.flickr.com/14/20098053_1f82de0bbc_o.jpg" rel="nofollow">Another sample of FF Strada.</a></li>
      <li><a href="http://www.fontshop.com/showfont.cfm?fid=FF.10989.0.0" rel="nofollow">FF Quadraat Sans</a> - There is experienced method behind the lack of uniformity.</li>
      <li><a href="http://www.fontshop.com/showfont.cfm?fid=FF.11100.0.0" rel="nofollow">FF Profile</a> - Has a friendly air for less serious texts.</li>
      <li><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=legato" rel="nofollow">FF Legato</a> - This groundbreaking design requires some reading to fully appreciate. <a href="http://typographi.com/000969.php" rel="nofollow">Start&nbsp;here.</a></li>
      <li><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=versa%20sans" rel="nofollow">Versa Sans</a> - More brilliance from a Dutch master.</li>
      <li><a href="http://www.fontshop.com/showfont.cfm?fid=GF.118889.0.0" rel="nofollow">Freight Sans</a> - Excellent <a href="http://www.joshuadarden.com" rel="nofollow">complimentary styles</a> available too. I recommend loosening the spacing a tad.</li>
      <li><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=amplitude" rel="nofollow">Amplitude</a> - The Normal and Wide are really great for small print.</li>
      <li><a href="http://www.veer.com/partner/link.aspx?i=1048&amp;c=4&amp;p=products/typedetail.aspx?image=FOT0000081" rel="nofollow">Lisboa Sans</a> - Veer mailed a sans poster a few weeks ago and this new release was the most impressive on the sheet.</li>
      </ul>
    html_clean: |-
