      <p>In your original logo the little rings are purely decorative, but in the Amharic I think they may be confusing to readers, since Amharic readers are used to treating most end-of-stroke details as meaningful. So my suggestion is to utilise this feature of the script and in the Amharic version use the rings systematically as 'flag' replacements. I believe you can simplify the mid-stroke arms as you have done, but that you should maintain the top and bottom flag patterns, using the rings. I would revise the first syllable form to maintain the connection between the left and right sides. I think you could safely double the crossbar of the middle syllable to echo your treatment of the original logo. So, I suggest something like this:</p>
      <p><img src="/sites/default/files/old-images/JH-Tezeta-Amharic_3682_4163.png"></p>
