    html: |-
      <p>Hi Harnt , Hope all is well. As John has pointed rightly, In Amharic  end of strokes are meaningful .<br>
      Whenever you think of Amharic script you have to think of writing sequences(or stroke). It is because<br>
      We have  34 basic characters and they are modified in to six variations. In your case the word comes from two basic characters which looks like t and H the red and the blue are diacritical marks which change the basic sounds . I have also circled the 3 characters you used in your logo. That is why it is important following the structure of each letter not to confuse them.<br>
      When you write each character you have to follow a rule. The rule is to finish from left to the right . Traditionally going back is not allowed (Please see the image below ). For example the letter a has to be written only in this order.(Finishing from left )<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tt_Har_1_4914.png"></div><br>
      When you want to modify a script like you are trying to do, You have to think of the skeleton of each characters. John’s suggestions maintaining the flag patterns is important, however in this case putting the rings above, below or at the center of the Joints(Like I did)  it will increase legibility. This is Where thinking of the skeleton of the characters comes handy, for example on the 3rd character . The bottom is not horizontal it is diagonal.<br>
      To answer your questions:<br>
      How specific those strokes and symbols need to be? As long as you maintain the skeleton of each glyph it does not have to be specific. What you started is good and looks different from what we have seen.<br>
      Doubling the cross bar or making it wider or narrower will make it only beautiful.<br>
      Is there any guide somewhere? So far I don’t know any guide. I am working on a book. God knows when I am going to finish it. Whatever questions you have you can e-mail me.<br>
      To demonstrate what I am talking about here is a quick example  ..<br>
      <div class="imageWrap"><img src="http://typophile.com/files/tt_Har_2_5793.png"></div><br>
      @ John I have not talked to you for so long how are ? Will e-mail<br>
      Aleme<p></p>
