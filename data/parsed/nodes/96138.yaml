    <p>I was wondering how one goes about modifying glyphs of the Amharic script to a specific distressed/display style, so it's still understandable to people reading it? I need to make an Ethiopian version of a custom designed latin logotype and would like the Amharic letterforms to retain the look.</p>
    <p>Original latin logo:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Tezeta-Latin_3690.png"></div><p></p>
    <p>A quick Amharic version:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Tezeta-Amharic_3682.png"></div><p></p>
    <p>Original Amharic script font:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Tezeta-Amharic-Script_6070.png"></div><p></p>
    <p>I've found some information on the Amharic alphabet in <a class="freelinking external" href="http://books.google.co.uk/books?id=fCQjQkaZBEwC&amp;lpg=PP1&amp;ots=jOHXkYIRMq&amp;dq=subject%3A%22amharic%20language%22&amp;pg=PA14#v=onepage&amp;q&amp;f=false" rel="nofollow">this book</a>. It says that there are 33 basic characters and there are combinations with additional strokes or symbols to create new characters for different sounds. </p>
    <p>My questions:<br>
    How specific those strokes and symbols need to be?<br>
    Is there any guide somewhere?<br>
    How far can you go with simplification of such a script (Amharic, Arabic etc) in general?<br>
    Is the above example acceptable/readable or should the characteristics/serifs be put back?</p>
