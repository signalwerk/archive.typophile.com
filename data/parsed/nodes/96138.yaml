    <p>I was wondering how one goes about modifying glyphs of the Amharic script to a specific distressed/display style, so it's still understandable to people reading it? I need to make an Ethiopian version of a custom designed latin logotype and would like the Amharic letterforms to retain the look.</p>
    <p>Original latin logo:<br><img src="/sites/default/files/old-images/Tezeta-Latin_3690.png"></p>
    <p>A quick Amharic version:<br><img src="/sites/default/files/old-images/Tezeta-Amharic_3682.png"></p>
    <p>Original Amharic script font:<br><img src="/sites/default/files/old-images/Tezeta-Amharic-Script_6070.png"></p>
    <p>I've found some information on the Amharic alphabet in <a href="http://this book" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://this book</a>. It says that there are 33 basic characters and there are combinations with additional strokes or symbols to create new characters for different sounds. </p>
    <p>My questions:<br>
    How specific those strokes and symbols need to be?<br>
    Is there any guide somewhere?<br>
    How far can you go with simplification of such a script (Amharic, Arabic etc) in general?<br>
    Is the above example acceptable/readable or should the characteristics/serifs be put back?</p>
