    <div class="info">Submitted by <a href="/user/7006" title="View user profile.">paul d hunt</a> : 12.Jun.2006 7.59am </div>
      <p>A sale:<br>
    Perhaps not so random - we will be moving in a few months and storage is already at capacity here, so here are a few things we thought you might be interested in...</p>
    <p>For one week only, June 12-19, a few sales... at somewhat insane prices.</p>
    <p>-Indie Fonts 2 book only $10 plus shipping<br>
    <a href="http://www.p22.com/indiefonts/indie2.html">http://www.p22.com/indiefonts/indie2.html</a><br>
    We have more of this second volume than we thought, so that’s good for you. Makes a great gift!</p>
    <p>-Futurismo Soundtrack with Dada font - only $5 plus shipping<br>
    <a href="http://www.p22.com/records/futurismo.html">http://www.p22.com/records/futurismo.html</a><br>
    Our groundbreaking, first ever soundtrack to a font.<br>
    (no download at this price)</p>
    <p>-Download LTC Caslon Bold Long Italic font for only $5<br>
    <a href="http://www.p22.com/Lanston/products/caslon.html">http://www.p22.com/Lanston/products/caslon.html</a><br>
    A nice font on its own, but perhaps if you like this one, you can always get the rest.</p>
    <p>Sale ends June 19 at Midnight Eastern Standard Time</p>
    <p>Best Wishes<br>
    P22 Inventory Reduction Division</p>
