    html: <p>I would recomend reading Muller-Brockmann's book "Grid Systems Raster Systems" for info on the highly structured end of grids.  Then I would just move some block shapes around on a blank piece of paper to try to learn visual relationships with no grid at all.  The two experiences together will give you a basis for getting something to use in comparison. <br> <br>ChrisL</p>
