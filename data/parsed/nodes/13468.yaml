  html: <p>Spike is showing Dr. No tonight. I stopped everything just to watch the titles. Why oh why can't we have more inspiration like that today? The Dr. No titles were designed by <a href="http://www.artofjamesbond.com/binder.htm" rel="nofollow">Maurice Binder</a> and they make me smile. Down with shadows and blends and all that is 3D ... go back to analog and 2D design!</p>
