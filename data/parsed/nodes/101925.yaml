    <p>The April edition of the Metal Type newsletter is now out. Click this link to take a look at the video: <a href="http://j.mp/k5KA95" title="http://j.mp/k5KA95">http://j.mp/k5KA95</a></p>
    <p>As well as the usual site news, you can see a slightly disappointing Intertype pin badge that I recently bought off Ebay!</p>
    <p>If you don't already get newsletters from Metal Type, you can subscribe here: <a href="http://bit.ly/n3wkjc" title="http://bit.ly/n3wkjc">http://bit.ly/n3wkjc</a></p>
    <p>The paperback version of "First Steps in Letterpress" - a book for absolute beginners - is now out: <a href="http://j.mp/10f3UmO" title="http://j.mp/10f3UmO">http://j.mp/10f3UmO</a> If you would like to sell this book, online or offline, please get in touch for a generous bulk discount.</p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
