    <p>I could use your knowledge &amp; wisdom! </p>
    <p>I'm a designer for a company that was re-branded just before I was hired, and the font chosen for the logotype was <a href="https://www.fontfont.com/fonts/olsen/bold" rel="nofollow">FF Olsen Bold</a>, set with tight tracking (it's kerned, naturally, but it's in the -25/-50 zone), with Sentence Capitalization.</p>
    <p>My problem is that I'm not sure of the best way to treat this typeface as a part of our visual identity, since I've rarely used a chopped wedge serif in the past. Do you have any insights into the best uses for this kind of face?</p>
    <p>I'm looking for anything from type specimens that you think work particularly well for this type to "always" or "never" rules to general insights.</p>
    <p>Any opinions, suggestions, rants, or suggestions welcome!</p>
    <p>Thanks,<br>
    David Somerville</p>
