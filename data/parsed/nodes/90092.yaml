      <p>I like over-thinking.  :-)</p>
      <p>That's one cool thing about sheared-wedge serifs (or<br>
      slanted-slab serifs, depending on how you look at it),<br>
      it's hard to mess up.</p>
      <p>Ernestine for example has been tested down to 4 point and<br>
      it's shockingly readable (although the large x-height is a<br>
      major player in this). Olsen looks like it would be a solid<br>
      performer as well.</p>
      <p>In terms of character however it's certainly possible<br>
      to misuse <em>any</em> font. Olsen conveys a no-nonsense<br>
      warmth, a let-me-tell-you-how-it-really-is honesty.<br>
      Don't use it for wedding invitations.  :-)</p>
      <p>hhp</p>
