      <p>Brilliant! Thank you, Nick!</p>
      <p>Hrant, the only reason for the worry is that I'm trying to put together a style guide for other designers, based on this redesign, and so I need to get my head around what the face is best used for ... that way I can encourage designers to use it for the proper purpose, and not try and -- say -- set minutia in it when that should be put in a face optimized for small display.</p>
      <p>But you're right, I'm probably over-thinking it. :) Just wanting to draw from the collected wisdom of the amazing Typophiles gathered here.</p>
