      <p>Rats, wedding invitations are a major part of our business plan!</p>
      <p>No, just kidding. Ha.</p>
      <p>I like your analysis of Olsen, and wholly agree ... which is lovely, because that's exactly the tone I think we'd like to hit. I think I can build my recommendations off the personality of the font, actually, now that I think about it. Maybe it's better to suggest to designers to, "Use this font for no-nonsense warmth," rather than "only use this for headers." That might allow more flexibility and interest in the designs.</p>
      <p>This is great stuff. Thank you so much for your input!</p>
