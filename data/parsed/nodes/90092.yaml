      <p>Take a look at the Saturday <em>Globe and Mail</em> (“Canada’s National Newspaper”), if you can pick up a copy at your local international newsagent.</p>
      <p>A chopped-wedge serif typeface, bold and extra bold, is used throughout, with a super-tight treatment in the <em>Style</em> section.</p>
