      <p>I dont think I would set the menu itself in such a thin italic, especially white on a dark background. Maybe it would be better in print than on screen, although there could possibly be some minor ink bleed (or an optical effect with the same result). That would probably be bad for such thin type. Maybe a slightly heavier weight would be safer. </p>
      <p>And why not just regular with italics to emphasize certain things? Or the names in regular and the description in italics, or vice versa?</p>
      <p>But I dont think you need a serif for it to look elegant or 'posh'. This looks elegant and modern at the same time, while a serif might quickly look cliché-elegant.</p>
