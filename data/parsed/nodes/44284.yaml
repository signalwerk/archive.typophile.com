    votes: null
    html: |-
      <p>The idea behind the typeface choice was probably to avoid being too old fashioned, right? And I have to say, I like it. I'd be there. I'm hungry already.<br>
      But using an oblique… that's just a shame (as you probably know). On the front page, with the uppercase, that's okay. It's chic, but it isn't classical chic, which you got from the thin sans. But using an oblique (for so much text) should be avoided. Although hey, I know it's a type-sin, but I don't hate it. (OMG, what am I saying!?)<br>
      That said, I think I'd lose the oblique altogether and get a thin sans with a real italic, though. And probably let the type and the ornaments breathe a little on the front page. I have no problem with the inexistence of serifs on this.</p>
      <p>I agree with adding a 3rd column for prices (and with dropping them! €7 for a burger?!), which will make all the descriptions fit two lines (to get some cadence, which I think is nice on a list), but I wouldn't think justifying the first paragraphs is really necessary. And I think it's possible that you'll have a hard time printing (and then reading) that thin sans in white with such a dark background, but that all depends.<br>
      Not that I know anything, mind you!</p>
      <p>Oh, and typerror: that's "complementary". You'll get hell with that mistake around here! :P</p>
