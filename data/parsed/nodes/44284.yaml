    html: |-
      <p>Once again I'm reminded how lucky I am to have found such a fantastic design community.</p>
      <p>Thanks Typophiles, your input is always greatly appreciated, and I'll definately be taking on board your considerations - the chosen typeface is currently Gotham, which pairs famously with Didot - I'll experiment with that.</p>
      <p>Also, considering I'm a mere mortal student, how much would you recommend I charge for menu "case" (i.e folder) and the menu design itself? The chef wants to be able to change the menu on a whim considering the content, so he's requested an A3 setup which will be folded, and A4 insets with the actual menu.</p>
      <p>I've always been taught "get what you can" - "scale your price with the client's abiity to pay" by both my internship employers and my self-employed bricklayer father, but I'm finding the pricing process difficult for 'our thing' </p>
      <p>Regards,</p>
      <p>Paul</p>
