    <p>Can anyone help me ID this typewriter-looking font from the 1956 French film Et Dieu… Créa La Femme (And God created woman) starring Brigitte Bardot?</p>
    <p>I've attached some screen caps from the online video (low res) or view the video here:<br>
    <a href="http://www.dailymotion.com/video/x9ectx_et-dieuy-crea-la-femme-le-film-part_shortfilms" title="http://www.dailymotion.com/video/x9ectx_et-dieuy-crea-la-femme-le-film-part_shortfilms">http://www.dailymotion.com/video/x9ectx_et-dieuy-crea-la-femme-le-film-p...</a></p>
    <p>Follow up question: is there a digital version available anywhere?</p>
    <p>cheers</p>
