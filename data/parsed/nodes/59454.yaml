    html: <p>And (to take it even further) if you have a letter with a printed part between counters (say, an H), you might even make a counter-counterpunch. Carve an H crossbar on the counter-counterpunch, strike it into the counterpunch, carve the outside contours of the H counters on the counterpunch, strike it into the punch, carve the outside contours of the H, strike it into the matrix...</p>
