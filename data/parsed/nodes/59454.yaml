      <p>Huh. I always assumed it was short for “counter form” or “counter shape”, which refers to the negative space in or around any form, whether it’s a letter or a shape. I further assumed that the word “counterpunch” was derived from that word.</p>
      <p>I claim no authority on the topic, of course. I bet my art background influenced my thinking when considering etymologies in type.</p>
