    html: |-
      <p>With metal type (working backwards), the type sort was made by pouring molten metal into a mold affixed to a matrix, which was the piece that had a hollowed out letter shape, let’s say a D.<br>
      That matrix with the hollowed out D was made by the craftsperson carving a D onto the end of a long piece of metal called the punch, and then striking that hardened metal punch into the softer metal. So the carving that the cutter does is a positive version of the D. (punch is positive, matrix is negative, type is positive again).<br>
      Now imagine trying to cut a tiny D onto the end of a metal piece. With some skill it wouldn’t be so difficult to carve the letter in from the sides, but how do you create a hold in the middle?<br>
      The solution is to create another punch for the punch - a “counterpunch.” That would be a long piece of metal carved with the shape of the hole in the D. It is then hardened and struck into the punch to create the negative shape, and then the rest of the carving from the outside can proceed.<br>
      The holes  and closed spaces are called counters because in metal type they were achieved by the punchcutter with a counterpunch.<br>
      If I’m remembering right, I learned this all from <a class="freelinking-external" href="http://www.hyphenpress.co.uk/books/978-0-907259-06-0">Fred Smeijers’ <em>Counterpunch</em></a>.</p>
