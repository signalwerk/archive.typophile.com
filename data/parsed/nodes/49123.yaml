    <p>I'm designing a brochure which will be printed in both English and Russian. The client (an architect) is adamant that the text should be fully justified. It's not my preference, but I am willing to concede on some things to promote a happy working relationship.</p>
    <p>However, my extremely limited knowledge of setting Russian means I have no idea if – or where – one should break words with hyphens. I don't want a soggy lump of text full of rivers.</p>
    <p>Does anyone have any experience of this? Should I stick to my guns and insist on ragged right? I'd be interested to hear people's views.</p>
