    votes: null
    html: <p>I'm using InDesign CS3, so I'm assuming that will do the job okay?</p>
  - id: 299872
    user: 29994
    date: 2008-09-05T13:46:00
    date_raw: 5 Sep 2008 — 1:46pm
    votes: null
    html: |-
      <p>IDCS3 has no more problems with Russian as it has with, say, English. There may be the occasional mishap :-) But nothing dramatic a typesetter should or an editor shouldn't take care of.<br>
      Just remember to set the language of that text to Russian.</p>
  - id: 300205
    user: 15900
    date: 2008-09-08T05:16:00
    date_raw: 8 Sep 2008 — 5:16am
    votes: null
    html: <p>Just to be crystal clear – I don't want to look an idiot in front of the client – Russian's hyphenate?</p>
  - id: 300466
    user: 18017
    date: 2008-09-09T12:38:00
    date_raw: 9 Sep 2008 — 12:38pm
    votes: null
    html: |-
      <p>Yes, Russian body text should be hyphenated. Compared to English, an average word is relatively long, so the absence of hyphenation is more likely to create readability problems.</p>
      <p>Mikhail Leonov,<br>
      Senior Software Design Engineer, Microsoft Corporation</p>
