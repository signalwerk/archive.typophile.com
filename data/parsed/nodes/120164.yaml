    html: '<p>Agree with all previous comments. I tried to gather some fonts that could mimic this lettering and focus my search on "DIN-like with Helvetica-ish /S". Here are the ones I ended up with: <a class="freelinking external" href="http://www.myfonts.com/fonts/indian-type-foundry/pilcrow" rel="nofollow">Pilcrow</a> ITF, Brownfox <a class="freelinking external" href="http://www.myfonts.com/fonts/brownfox/brutal-type" rel="nofollow">Brutal</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/brownfox/institut" rel="nofollow">Institut</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typedynamic/predige" rel="nofollow">Predige</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/northernblock/neusa" rel="nofollow">Neusa</a>, 4F <a class="freelinking external" href="http://www.myfonts.com/fonts/4thfebruary/bond-4f" rel="nofollow">Bond</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/4thfebruary/meeneralca-4f" rel="nofollow">Meeneralca</a>, <a href="/wiki/https%3A/%252Fplaytype.com/index.php%3Fq%3Dfont/hill" class="freelinking" rel="nofollow">Hill</a>, <a class="freelinking external" href="http://www.fontsmith.com/fonts/fs-dillon" rel="nofollow">Dillon</a> FS, <a class="freelinking external" href="http://www.myfonts.com/fonts/tipo/palestina" rel="nofollow">Palestina</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/carnoky/technik" rel="nofollow">Technik</a></p>'
