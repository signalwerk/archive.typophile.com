    html: |-
      <p>Q: "why it's NOT Helvetica."<br>
      A: At least five letters, _G_ with no spur, _R_ with straight leg, and  _C_, _D_ and _O_ with a vertical section in the curved strokes. The letter _S_ could pass for Helvetica, Arial etc.<br>
      The letters have some similarities to DIN, except for the _S_.<br>
      Might not be a standard font.<br>
      Don</p>
