    html: |-
      <p>I could conceive of a list of the 20 or 50 greatest type designers of all time.</p>
      <p>After all, if one writes a book on the history of typography, one is exercising a process of selection.</p>
      <p>But a list of the <strong>most important</strong> type designers of all time as distinct from a list of the greatest type designers of all time... that raises a new question.</p>
      <p>Does it mean a list of the <em>most influential</em> type designers of all time? If so, clearly Jenson and Aldus get to be on the list, as well as Caslon. Paul Renner would make the list as well.</p>
      <p>But if one actually wants to draw a distinction between most important and most influential...</p>
      <p>The BAMS codebook used by British merchant ships in World War II was set in the roman designed by Alexander Phemister. Did this result in a saving of eyestrain that helped win the war, making him one of the most important type designers of all time?</p>
      <p>That is a facetious example, but I think you can see what I'm getting at. If one is defining "importance" in an open-ended way, to include impact on the outside world, one is venturing into very uncharted territory.</p>
