    <p>I'm trying to compile a list of the 20 most important <a href="/wiki/designers" class="freelinking" rel="nofollow">type designers</a> of all time. Which one would they be? I know this is personal, so I just wrote down what came to my mind, odered by living and dead. I know this is by no means complete or correct yet. Please feel free to add / edit!</p>
