    html: |-
      <p>Questions:</p>
      <p>Why 20? Why not 64? It's a big world. Why are we obsessed with lists which deify? It's an unrealistic/idealistic act. What is the standard by which we may deem one more important than another? What is the determining process by which I may conclude that one person is a type designer and another is not? </p>
      <p>More importantly, do we have the authority/perspective to forge such doctrine? </p>
      <p>Apologies for the angst-like deconstructive criticism. But damn if I don't feel like "Top-10 syndrome" is the heartbeat of the internet.<br>
      This thread is very troll-able. Hope I'm not doing so. :)</p>
