      <p><em>his type has a brilliant mixture of originality, fun and legibility</em></p>
      <p>While i agree with that assessment of Rian’s work (and we published his first faces over 15 years ago), the list would be more than 200 names long if we only used these criteria (the FontFont library alone has 150 contributors). You do not design a classic; time, talent and economics need to come together to do that. Helvetica was a fairly mediocre cleaning-up of Scheltersche Grotesk via Haasche Grotesk, and Miedinger was a salesman, not a designer. His drawings were pretty basic, but the face hit a nerve: in 1957, postwar Europe was ready for something clean, without a past and without obvious ancestry, coming out of neutral Switzerland. The same applied to most faces that represent a period now; Garamond, Baskerville, Caslon, Bodoni, Akzidenz Grotesk, Futura, Gill, Helvetica.<br>
       Some of Roger Excoffon's typefaces are amazing, but they always looked too French to really be a world-wide success. AvantGarde Gothic was a sensation when it came out, but nobody would call it a good typeface. Neither would we regard most ITC designs from the 70s, but they were seminal in their influence. Zuzana Licko’s first Emigre bitmap fonts more than 20 years ago hardly qualify as type design by most standards, but they are now true classics.</p>
      <p>And these days? We have more talented type-designers than ever before. They know both their history and their tools, and they make better type than any of the famous names mentioned above. But their chance to make history is minimal. I think that is great, because I do not consider us to be artists, but visual engineers who serve those people who use our typefaces: readers and designers.</p>
