      <p>Maybe it's just late and I'm being curmudgeonly BUT: Bembo isn't a type designer by any measure. Poor Mr. Griffo always gets ignored when he invented a whole genre of typefaces. Where I come from not mentioning him is a hanging offense. And Johnston wasn't really a type designer--disagree all you want, he was a calligrapher who designed some signage. How on earth could you compile such a list and not mention Goudy, Dwiggins, and Cooper! And how could you make such a list and not mention any WOMEN designers?</p>
      <p>Renner belongs even if he only designed Futura since it was one of the most popular and influential faces of the 20th C. and he has the distinction of having been persecuted by the Nazi's for having designed it in the first place. How many other type designers can say that?</p>
      <p>And did anyone mention Menhart? The list isn't merely for western europeans is it? How many type designers have been commissioned to design a face for their country's constitution? </p>
      <p>And where's Baskerville and Caslon? And if you mention Bodoni (my favorite) you must mention Didot, and not just Firmin, but all of the type designers in the bunch. And where's Fournier??? Vincent Figgins??? Doesn't inventing slab serif types mean anything?  William Caslon IV maybe? And where did all those 19th C. advertising faces come from if not for Mr. Thorne? Doesn't that rate? Darius Wells who invented wood type??? Shouldn't he be one of the top guys on the list? And I have to mention Augereau even if he isn't one of the top 20 since he is the only type designer executed for heresy. </p>
      <p>Of course there's Jenson, and one could make a case for Sweynheim and Pannartz. But the most glaring omission is of course the most important type designer of all time: Johan Genzfleisch zum Gutenberg who invented it in the first place.  </p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
