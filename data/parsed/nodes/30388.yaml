      <p>I was defining 'important' as simply designers whose work -either individual designs, or as a body of work- I felt was relevant during the time it was created (or is now relevant today).</p>
      <p>Hermann Zapf: Palatino, Optima, Zapfino... those are good reasons, I don't see a need to go any further.</p>
      <p>Carol Twombly: because of Trajan, Charlemagne, contributions to Myriad, etc. Carol's name and work was one of the first I became associated with when I began with digital type (My first college text on type design was "Stop Stealing Sheep &amp; Find Out How Type Works", and Carol was one of several featured within, IIRC). Also her Association Typographique Internationale award- it's always stuck in my mind she was the first woman to win it. I'm not sure if she is still designing today, but her work with type certainly lives on.</p>
      <p>Ray Larabie: I would bet some would be surprised to see my mention of Mr. Larabie, largely because his past work was not quite so "original" (considering the freeware fonts he created based from existing corporate logos). Love it or not, I think quite a bit of that became an underground movement in itself, spurred "non-designers" to experiment with type a little more, and indirectly drew more serious attention towards reproducing typefaces not yet digitized.</p>
      <p>Since going commercial &amp; focusing on more original work, some of it's become quite popular- I see Neuropol X in the media quite a bit these days, and quite frankly, I think it's a good face for the times.</p>
      <p>Does this explain the reasoning behind my choices a little better? I will admit my choices are a little more biased towards my personal taste rather than leaning towards what some may deem more historically significant. I really think this post's question is impossible to answer, but fun nonetheless.</p>
    html_clean: |-
      <p>I was defining 'important' as simply designers whose work -either individual designs, or as a body of work- I felt was relevant during the time it was created (or is now relevant today).</p>
      <p>Hermann Zapf: Palatino, Optima, Zapfino... those are good reasons, I don't see a need to go any further.</p>
      <p>Carol Twombly: because of Trajan, Charlemagne, contributions to Myriad, etc. Carol's name and work was one of the first I became associated with when I began with digital type (My first college text on type design was "Stop Stealing Sheep &amp; Find Out How Type Works", and Carol was one of several featured within, IIRC). Also her Association Typographique Internationale award- it's always stuck in my mind she was the first woman to win it. I'm not sure if she is still designing today, but her work with type certainly lives on.</p>
      <p>Ray Larabie: I would bet some would be surprised to see my mention of Mr. Larabie, largely because his past work was not quite so "original" (considering the freeware fonts he created based from existing corporate logos). Love it or not, I think quite a bit of that became an underground movement in itself, spurred "non-designers" to experiment with type a little more, and indirectly drew more serious attention towards reproducing typefaces not yet digitized.</p>
