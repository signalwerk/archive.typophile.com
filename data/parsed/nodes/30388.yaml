      <p><em>Miedinger shd wrestle Günter Gerhard Lange (Akzidenz Grotesk, 1896)</em></p>
      <p>As GGL was born in 1921, he could hardly have designed AG on his own. His involvement started in 1957, when he added a new series of weights and sizes, called – surprise! – Akzidenz Grotesk Serie 57. The light, regular and some bolder weights started appearing between the 1890s and the 1920s. All of them apocryphal designs, what Berthold called “Hausschnitt”, i.e. cut in house. Lange’s main contribution, apart from the AG development over 20 years and three technologies, was Concorde, the better Times. And his Bodoni Old Face from the late 70s was the first <em>real</em> Bodoni, not a sanitized version like all the others before.</p>
