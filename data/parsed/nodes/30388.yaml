      <p>"I’m trying to compile a list of the 20 most important type designers of all time."</p>
      <p>In Germany since around two years the TV guys offer more and more 'Best of..' shows. 'Best commercials of the last 10 years', 'Best 100 comedy shows of the century' up to 'Worst celebraties of the world' (No. 1 was Paris Hilton by the way).</p>
      <p>I always try to see a font in close connection with the epoche it was designed. Otherwise you see all these old fonts with only 'modern' eyes. What today is 'old-fashioned' in the past was 'Moderne Fraktur':<br>
      <a href="http://www.bleisetzer.de/index.php?target=shop/shop_details&amp;artikel_id=355&amp;b=0004&amp;pic=a" title="http://www.bleisetzer.de/index.php?target=shop/shop_details&amp;artikel_id=355&amp;b=0004&amp;pic=a">http://www.bleisetzer.de/index.php?target=shop/shop_details&amp;artikel_id=3...</a></p>
      <p>And the marketing guys who created this name for the font, brought it to the point.. of 1886. Of course they did not want to design an old-fashioned font.</p>
      <p>Its the same with the font artists of today. The answers they give are answers for questions of today. Do we know what a GG Lange or Paul Renner would say about one of the fonts of today? May be they'ld say its not possible to use it (in 1936), because the market would'nt accept it.</p>
      <p>So: 'If you want to know who you are, you have to know where you're coming from.' And so a best-of-list may be is a funny thing, but not realy important, isn't it?</p>
      <p>Georg</p>
