    html: <p>I believe that there's a problem in the criteria of selection. If you think of work of a life time, names like Frutiger, Zapf or Fuller Benton may appear, but if you're thinking about contributions that may have influenced largely in the history of typography and typeface design and innovation, then names like Jenson (first "roman"), Griffo(first italic), Garamond (First slanted caps), Eric Gill and Hans Meyer(humanist sans) Sumner Stone (family), Benton(again)(gothic style and family), Otl Aicher (family), Frutiger (again)(grid and family), Miedinger/Hoffmann (most popular) would make sense. Stablish the criteria first, otherwise you'll have preference and speculation. Some may agree with with quite a few, but the number 20 will become a problem...</p>
