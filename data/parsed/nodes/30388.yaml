      <p>It feels like this is two lists fighting. One, the top 20 designers of important typefaces, the other, the top 20 most important people in type design culture. I am by no means equipped to suggest 20 people for either, but I think that some simple statement of what "important" means here might help the list read as more than ...famousness?</p>
      <p>Helvetica is an important font, by ubiquity alone, so Miedinger surely makes the first list. Because of that face's influence on other fonts and type proportions and perceptions in general, he perhaps should be on both. Larabie would be an example of someone I find "list-level" important for all the reasons NJPatrick is probably thinking of. His merit is not necessarily one insanely popular singular face, but his style, prolific work and influence on the masses and fledgling designers.</p>
