    html: |-
      <p>Unfortunately we have so many names and limited criteria for selection. Legacy may not be the issue. Johann Friedrich Unger, who applied the neo-classical style and engraving expertise of Firmin Didot to fraktur, is certainly an important type designer and one of the first to try to resolve the differences between German and Latin type design and typographic practice. However, black letter seems to hold little sway in the list. </p>
      <p>Another important designer was Adolph Rusch who holds the historical priority for a roman type face—he was printing a roman as early as 1464. The face isn't very pretty, so he is an important type designer, but not a very good one when compared with those, like Griffo, who follow him.</p>
      <p>William Morris/Edward Prince falls into a similar category. The Golden Type was one of the most influential of the 19th century, but doesn't hold a candle to the Venetian revival faces that quickly followed. Morris' disciple, Edward Johnston, is certainly an important figure in the history of type design, but much more for the effect his revival of the art of the letter had on other designers than in the direct contributions he made as a designer of types.</p>
      <p>The relationship of Linn Boyd Benton to his son provides an example that might guide selection. Without Linn Boyd's invention of the pantographic/engraving process, which Matthew Carter has called the most important invention in the history of typographic design since the 15th century, most of the type designs and type design processes that occur after c. 1880 would have much different. Benton's work on Century with De Vinne certainly qualifies him as a designer, but the greater breadth of his son's work qualifies Morris Fuller Benton as the more important designer.</p>
    html_clean: |-
      <p>Unfortunately we have so many names and limited criteria for selection. Legacy may not be the issue. Johann Friedrich Unger, who applied the neo-classical style and engraving expertise of Firmin Didot to fraktur, is certainly an important type designer and one of the first to try to resolve the differences between German and Latin type design and typographic practice. However, black letter seems to hold little sway in the list. </p>
      <p>Another important designer was Adolph Rusch who holds the historical priority for a roman type face—he was printing a roman as early as 1464. The face isn't very pretty, so he is an important type designer, but not a very good one when compared with those, like Griffo, who follow him.</p>
      <p>William Morris/Edward Prince falls into a similar category. The Golden Type was one of the most influential of the 19th century, but doesn't hold a candle to the Venetian revival faces that quickly followed. Morris' disciple, Edward Johnston, is certainly an important figure in the history of type design, but much more for the effect his revival of the art of the letter had on other designers than in the direct contributions he made as a designer of types.</p>
      <p>The relationship of Linn Boyd Benton to his son provides an example that might guide selection. Without Linn Boyd's invention of the pantographic/engraving process, which Matthew Carter has called the most important invention in the history of typographic design since the 15th century, most of the type designs and type design processes that occur after c. 1880 would have much different. Benton's work on Century with De Vinne certainly qualifies him as a designer, but the greater breadth of his son's work qualifies Morris Fuller Benton as the more important designer.</p>
