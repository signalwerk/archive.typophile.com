  html: |-
    <p>Hello!</p>
    <p>It's my first time here, so I'll quickly introduce myself: I'm Carel Fransen, graphic designer from the Netherlands, and currently working on my graduation projects.</p>
    <p>For my project, I'm looking for a quality condensed font with a large x-height that does great at small corps-sizes (approx. 6-7 pt).</p>
    <p>I have got one font that works very well: <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/bureau-grot/light/" rel="nofollow">Bureau Grot Light</a>. However, I'd like to have some options. Unfortunately, due to the "advanced search"-mechanisms on big font-sites not being that advanced, it's nearly impossible to search for something this specific.</p>
    <p>I hope that some of you might be able to give me some recommendations. Preferably, I'd like a font with some Opentype-features like different kinds of figures, but most importantly it should be a bit condensed, readable at small sizes, and kerned nicely.</p>
    <p>Thank you in advance!</p>
    <p>Kind regards,</p>
    <p>Carel</p>
