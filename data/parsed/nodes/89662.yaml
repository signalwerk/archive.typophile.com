    html: <p>No designer uses the fonts supplied by an author or editor. They just want the text with as little formatting s possible.  My guess would be that they were eyeball copyfitting.  At a quick glance, they could judge how much space the text would occupy.  They could have chosen any easy to get font.  This kind of a thing is a holdover from the old University days of standardized thesis and dissertation writing.  Some folks never change ;-)  When I was in Grad school in the early 70s, the only way you could get the Dean's approval was if you hired one of the 3 approved typists to match all the specifications to a T.  Thank god for the digital era!</p>
