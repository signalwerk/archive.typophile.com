      <p>Are they really asking to submit papers in Swis721 or are they just providing Word templates using Swis721?</p>
      <p>I searched and found this conference, the <a href="http://www.fau.usp.br/15-iphs-conference-sao-paulo-2012/abstracts-and-papers.html" rel="nofollow">15th IPHS Conference</a> in São Paulo. What I found is Word templates so that all submitted papers look about the same when they open them. They expect those submitting papers to replace the existing text and match the style. And indeed,  when I open the file 15IHPS-example.doc (for instance)  I see  that the font used is Swis721 Lt BT. That is misleading because I don't have that font on my computer, probably nobody else than the organizers does, and word will just apply some standard substitution for display; you can't rely on what you see on the screen to deduce what your text will look like in the proceedings. If I  save their file in pdf format on my Macintosh, the font that is embedded is Trebuchet.</p>
    html_clean: |-
      <p>Are they really asking to submit papers in Swis721 or are they just providing Word templates using Swis721?</p>
      <p>I searched and found this conference, the <a href="http://www.fau.usp.br/15-iphs-conference-sao-paulo-2012/abstracts-and-papers.html" rel="nofollow" class="link-external">15th IPHS Conference</a> in São Paulo. What I found is Word templates so that all submitted papers look about the same when they open them. They expect those submitting papers to replace the existing text and match the style. And indeed,  when I open the file 15IHPS-example.doc (for instance)  I see  that the font used is Swis721 Lt BT. That is misleading because I don't have that font on my computer, probably nobody else than the organizers does, and word will just apply some standard substitution for display; you can't rely on what you see on the screen to deduce what your text will look like in the proceedings. If I  save their file in pdf format on my Macintosh, the font that is embedded is Trebuchet.</p>
