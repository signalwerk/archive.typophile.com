      <p>Could be wrong but, even if many fonts and vector letterings have shown up recently (a trend actually), this one could have been based on <a href="http://www.myfonts.com/search/Futura/fonts/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Futura</a> (/O, pointy /N or /W)<br>
      Some in the same trend: <a href="http://www.myfonts.com/fonts/hvdfonts/diamonds/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Diamonds</a>, <a href="http://26plus-zeichen.de/en/fonts/tj-evolette-a/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Evolette A</a>, many ones at <a href="http://www.tendollarfonts.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">TenDollarFonts</a> (TWOFACED, Echelon, Rathe, Parqa, Fonecian, Finding 57, Harf 77, Labieno, Positano, Marina, Alumia...)</p>
      <p>EDIT: after further inspection, I guess I was actually wrong, could be Evolette.</p>
