      <p>Could be wrong but, even if many fonts and vector letterings have shown up recently (a trend actually), this one could have been based on <a class="freelinking external" href="http://www.myfonts.com/search/Futura/fonts/" rel="nofollow">Futura</a> (/O, pointy /N or /W)<br>
      Some in the same trend: <a class="freelinking external" href="http://www.myfonts.com/fonts/hvdfonts/diamonds/" rel="nofollow">Diamonds</a>, <a class="freelinking external" href="http://26plus-zeichen.de/en/fonts/tj-evolette-a/" rel="nofollow">Evolette A</a>, many ones at <a class="freelinking external" href="http://www.tendollarfonts.com/" rel="nofollow">TenDollarFonts</a> (TWOFACED, Echelon, Rathe, Parqa, Fonecian, Finding 57, Harf 77, Labieno, Positano, Marina, Alumia...)</p>
      <p>EDIT: after further inspection, I guess I was actually wrong, could be Evolette.</p>
