  html: |-
    <p>Bohemian Coding are working on a killer font library software, it looks really sexy.</p>
    <p>Been beta testing for a while and it starting to get very useable.</p>
    <p>I'm sure they need feedback from typophiles and not just mac users in general, so do sign up for the newsletter and they'll send you the url for the beta.</p>
    <p><a href="http://www.bohemiancoding.com/fontcase/" title="http://www.bohemiancoding.com/fontcase/">http://www.bohemiancoding.com/fontcase/</a></p>
    <p>Loving the previewing of fonts!</p>
    <p>Screenshot here:</p>
    <p><a href="http://pieteromvlee.net/blog/?p=34" title="http://pieteromvlee.net/blog/?p=34">http://pieteromvlee.net/blog/?p=34</a></p>
