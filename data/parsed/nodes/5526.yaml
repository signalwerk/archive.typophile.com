    html: "<p>Gerald, I think you are missing my point. I'm not trying to convince you that OpenType is a good thing for <i>you</i> -- although I certainly don't think it is a bad thing, see below --, I'm trying to explain to you why the change in font formats is inevitable, because of the short-comings of the Type 1 format in terms of supporting the scripts and languages and media that are important to the people who specify digital font formats. It is irrelevant whether you like OpenType or not. <br> <br>But some practical information about OpenType for you: <br> <br>1. OpenType is primarily a font file format -- all the bells and whistles of automatic ligature substitution etc. are optional. The font file format is a) a single binary file, b) cross-platform compatible, c) Unicode encoded, d) in the case of a PS font much smaller than a Type 1 font with the same glyph set. So even a straight conversion of existing Type 1 fonts, without adding any smart layout features, is an improvement for both font developer and customer. The developer only has to manage a single source and a single binary, instead of having to make multiple, different Type 1 font binaries for Mac and Windows. The customer gets a single, easy to install and manage binary that can be used on both Mac and Windows. <br> <br>2. <i>How many applications support OpenType?</i> <br>Every application on my system supports the OpenType file format; it is, in fact, the most widely supported font format ever. In terms of supporting fancy layout features, Adobe and Microsoft are coming at the question from two different directions: Adobe apps support layout for rich typographic features and Japanese; Microsoft apps support language layout features for complex scripts such as Devanagari, Arabic, etc. The two seem set to meet each other and pass in the middle, with Adobe adding support for complex scripts (already in the Middle East version of InDesign from WinSoft) and Microsoft adding support for typographic features. Last year, Microsoft announced system-level support for OpenType typographic features for the next version of Windows: this means any application will get OpenType Layout support by making standard system text output calls. Quark have made semi-public acknowledgement that they are working on making Xpress Unicode-savvy as a first step to supporting OpenType; they have a long way to go but that's their own fault not OpenType's. <br> <br>3. <i>How long does it take to make an OpenType font fully featured?</i> <br>If you have all the glyphs already -- which you do -- it can be done fairly quickly. A small family with standard ligatures, smallcaps, etc. can be done manually in a day. Obviously if you have a sizeable library of fonts, you want to automate the conversion as much as possible. If I had such a library, I would likely hire someone like Adam Twardoch to develop FontLab scripts to merge glyph sets from existing Type 1 fonts and build automatic OT Layout feature lookups based on glyph names. Fonts with non-standard glyph sets, e.g. something like Goudy Text with its alternate caps, would need to be handled manually, but this is still a pretty minor job that shouldn't take more than a few hours. <br> <br>4. <i>How much more can one fairly charge for an OpenType font as opposed to a Type 1 font? </i> <br>Um, whatever the market can handle? Personally, I charge money for designs not font formats. If you significantly expand the glyph set of a font, e.g. by adding extra ligatures or other alternate forms that were not in the Type 1 fonts, then I think you are justified in charging more. My principal reasons for preferring OT fonts are those discussed in No.1 (above): they are easier to manage than Type 1. I have not made a Type 1 font for several years now, and I hope never to make one again. <br> <br>['Direct, end user font sales' in any format will not be paying for my swimming pool. Making custom fonts for complex scripts might just. But I spend most of my income on books.] <br> <br>5. <i>If OpenType offered nothing but ugly fonts and Type 1 offered the fonts you liked. Which would you buy for your poetry magazine? </i> <br>I would buy the Type 1 fonts and I would spend an afternoon converting them to OpenType to make them easier to use. Considering how powerful my computer is, I shouldn't have to think about ligatures: they should just happen. I certainly shouldn't have to butcher the text in order to typeset it, changing every occurence of the word 'office' to 'oWce', for example, in order to get at the ligature in some expert set. Of course, Lanston puts their ligatures in the basic character set, but still associated with characters that requires changes to the text. I don't think typesetting should be a process of breaking text. <br> <br>6. <i>As for the rest of all the 8 bit nonsense I know nothing about and could care a less about as long as I can make beautiful and useful things.</i> <br>The key word in that statement, as it relates to this discussion, is 'useful'. In order to be useful, a thing has to be useable. People made beautiful things for the Bobst photosetter (Bram de Does' Trinit� typeface, for example), but that technology is no longer useable. That is going to happen to Type 1 fonts. It is the destiny of font formats to become obsolete. The beauty survives in reincarnation in new formats. This is what you signed up for when you started making fonts. Did you really think the <i>first generation</i> device independent PC font format was going to stand still? Personally, I'm amazed Type 1 lasted so long as it did. <br> <br> <br> <br>Guy, I thoroughly encourage you to check out InDesign Middle East edition. This is what I use for Hebrew, and it is far advanced over anything Quark has to offer.</p>"
