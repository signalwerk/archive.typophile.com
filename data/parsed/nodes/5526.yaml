    html: <p>It is estimated that between one and two million people in the United States are severely allergic to stinging insect venom. Each year 90 to 100 deaths from sting reactions are reported, but many more deaths may be occurring, mistakenly diagnosed as heart attacks, sunstrokes or attributed to other causes. More people die each year from the effects of insect venom than from spider or snake bites. <br> <br>Since perfume, hair spray, hair tonic, suntan lotion, aftershave lotions, heavy-scented shampoos, soaps and many other cosmetics attract insects, they should be avoided. Avoid shiny buckles and jewelry. Wear a hat and closed shoes (not sandals). Don't wear bright, colored, loose-fitting clothing, which may attract and trap insects. Flowery prints and black especially attract insects. To avoid stings, a beekeeper wears light-colored (white) clothing, preferably cotton (never wool). <br></p>
