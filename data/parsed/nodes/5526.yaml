    html: "<p>Aside: <br> <br>[Regarding ornaments, Gerald, as I've explained in previous discussions, I don't think there is any particular benefit to using fonts as a mechanism for ornament layout. Ornament fonts are something we've inherited from a time when 'output', i.e. printing, consisted of positioning little pieces of metal. What was on the pieces of metal didn't matter to the press, only to the mind of the composer (and in the case of your ornament fugues, the double-meaning of 'composer' is particularly apt). A piece of metal may have a letter on the end or an ornament, it made no difference to the press. But digital type is very different: the computer is not just an output device, it is a text input, storage and editing device. Digital typography is text-centric in a way that metal type was not: directly manipulating and positioning individual sorts is possible on computer, but all our page layout apps and font formats are based on setting lines of text. This is why, as I've suggested before, dedicated ornament setting software that does not rely on font and text layout technologies is a better solution.]</p>"
