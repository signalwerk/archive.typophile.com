    html: <p>Gerald L, I notice that on the site you link, it says  <br> <br>"With the release of the PageMaker plugin pack, we can finally recommend InDesign for general purpose DTP work!" <br> <br>The CS version seems to include the superior PageMaker features, and this pack helps the user switch.  <br> <br>I didn't find it a big deal to switch to earlier versions, though importing a design-heavy book from PageMaker to InDesign was not automatic, and did require a lot of new formatting labor. Then again, maybe the CS version is better. Has anyone tried the switch from PageMaker to InDesign CS?  <br> <br>  <br></p>
    html_clean: <p>Gerald L, I notice that on the site you link, it says  <br> <br>"With the release of the PageMaker plugin pack, we can finally recommend InDesign for general purpose DTP work!" <br> <br>The CS version seems to include the superior PageMaker features, and this pack helps the user switch.  <br> <br>I didn't find it a big deal to switch to earlier versions, though importing a design-heavy book from PageMaker to InDesign was not automatic, and did require a lot of new formatting labor. Then again, maybe the CS version is better. Has anyone tried the switch from PageMaker to InDesign CS?  <br> <br>  <br></p>
