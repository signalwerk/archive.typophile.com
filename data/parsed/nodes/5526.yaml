    html: <p>Gerald G.,  <br> <br>InDesign's Find/Change function offers most, if not all, of the text editing functions you're after. It isn't limited to finding word A and replacing it with word B; it can find all instances of Typeface Bold and replace them with Typeface Bold Italic, for example. Or find any combination of characteristics, including color, size, tracking, alignment, and a host of others, and replace them with any other set of characteristics.  <br> <br>Very powerful, and especially useful when one hasn't had the foresight to set up paragraph and character styles for frequently used settings. <br> <br>As a Pagemaker user, you'll find much that is familiar in InDesign. If you're comfortable in Illustrator, even better. And Quark users (like me) usually make the switch without too much pain, and often (like me) with great enthusiasm.</p>
