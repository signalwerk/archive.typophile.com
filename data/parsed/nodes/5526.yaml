    html: "<p>John, <br> <br>I am going to look at these links. Also I am thinking about this OpenType business once again.  <br> <br>Still, I must ask myself what I can do for the Chinese, Indian and Arabic computer users? But I am not going to think about it long because the answer is obvious. So I am just going along with you because you are an old friend and I know you are trying to be helpful.  <br> <br>For you, OpenType is part of your business. Type making tools, exotic language issues is, or so it seems is, part of your business. <br> <br>For me it is not, maybe Finnish. <br> <br>I would have to ask myself how I could be of help to these people, what designs can I offer them? What do they know or wish to know about Goudy, Bruce Rogers, Caslon. Also I must ask how I am able to make a living from them? <br> <br>You want to subsidize Lanston John? <br> <br>With all the free fonts out there, fonts getting spam bundled. Downloads from the net with absolutely no business model. Why would people from a foreign exotic language speaking company want to buy a font from us, or for that matter you? <br> <br>One would presume firstly they were going to set something, perhaps in French, English? The usual. For the English or French Type 1 fonts are just fine. The exotic speaking language countries unless set by some roaming intellectual would not even know what a \"ligature\" was. But if they did, we already have them. Swash, small caps, oldstyle figures, etc. Strictly academic folk would need those and those folk are smart enough to use Type 1 fonts and have already been using them for years. But most likely if those people found a ligature automatically stuck into their text they would have to make a service call to find out what was wrong with the font. Who needs the agro? <br> <br>I am speaking of our alphabet. 99.99% would be unable to distinguish between a good European type design from a bad one. For that matter they would not be able to distinguish the different sounds of a \"b\" from an \"h\". 99.99% of them can not speak a word of English. I am sure the literacy rate is at least as bad as Prince Edward Island Canada where only one in four can read a single word of English or French. I am sure the situation is probably much the same in those countries. <br> <br>So you say I should design foreign \"exotic\" languages, I must say \"no\" to that suggestion. Firstly I would find it far too arrogant for me to presume to do a better job than their best and my interest is in the best. Naturally I am open minded and if William came to me and said he designed a Hebrew Alphabet that he thought was good. I would certainly jump at the opportunity to address such a matter. I have a great deal of respect for his sound observations. <br> <br>Mega Corporations, Chinese, Japanese, Indian companies that are selling big ticket items hire a good American, English or Canadian Advertising companies for print promotional materials in the English speaking world. That is how I can help them. That is how I can make a meagre living. That market exist for us today. Type 1 fonts I must emphasize. <br> <br>Eastern European Languages I could be helpful with, once again, there is no logical business model. First our designers are unknown. Our promotional materials would have to be translated. Our fonts would have to be worked over, new characters and accents added. Then some way of getting found on the web would have to be examined. Not to mention currency and banking concerns, fraud, piracy but let us not forget the obvious. E-mail correspondence. How many different telemarketers, or e-mail personal would I require. <br> <br>Heeeeelp, I am already drowning.  <br> <br>Sorry John this does not look like it is going in your favour. <br> <br>This is a big world. You need, and you sound, like you have resources that I don't. I predict if you removed those resources and competed on  a one on one level with Lanston and followed your own advise predictably the next time I visited you we would be meeting in Oppenhiemer Park within several months. <br> <br>So make sure you get yourself a pigeon gun before you do anything so foolish. After all you might not like the line ups at the food bank. <br> <br>Not to mention, if by some insane fluke profits were to be found that were substantial you would be cheated out of your due rewards by some bully mega corp that bundles a \"copy product\" for free with their applications.  <br> <br>I am curious. What type face do you strongly recommend to the typophiles, or the advertising world that was designed by someone in Bombay, Iraq or some other place with an exotic language by a designer that \"could not speak or read a single word of English\"? Or any common European Language? Please don't tell me Baskerville was designed by Halima Abdule from Somalia. Besides she is still alive and teaches in Roxhill Elementary School in America. <br> <br>The trick to this question is that the recommendation has to be for a book of English literature, such as Shakespeare, or high end advertising print promotional material. Such as Rolls Royce. <br> <br>Next question: How many fonts do you commonly use that has been designed by someone that does not speak any European language or any language that uses the Latin alphabet? By someone that only speaks their own exotic language and nothing else? Remember William speaks English. <br> <br>Now I hope your answers to those two questions are similar because the questions are. <br> <br>But it is possible if the moon can be flat. But not likely to win \"top TDC awards.  <br> <br>Now I am not saying it can't be done, I am just saying I am not going to risk what little I already make in this business on plain foolishness. Call me Mr. Conservative. <br> <br>Anyway let me help you with the answer, Probably not many. How many do you use daily? Probably none. How many have you purchased? Well you are a strange one, and you have those quirky but interesting typographical pursuits. If anybody does I would think it would be you. <br> <br>But for the rest of us I am afraid we know names like Bodoni, Caslon, Goudy. Not much chow mein shows up in my fonts menu. Although I would like to have some soon, I am rather hungry. <br> <br>Can I come for dinner John? Alright, alright. <br> <br>But I will tell you what. If it is that big an issue someday I might upgrade my TypeLab software if it has an auto generate OpenType format and maybe play around with positioning the ligatures etc.  <br> <br>Now we have come to some amicably agreement, I have made all the movement, I would now ask that you push towards a rational optical scaling for type. I do not mean optical sizes. Also to build tools so this is not a lifetime project. <br> <br>But before you gloat you should know what my reason for considering OpenType. As you know I love ornaments, <a href=\"http://lanstontype.com/DreyfusKeyboardLoft.html\" target=\"_blank\">http://lanstontype.com/DreyfusKeyboardLoft.html</a> and in my fine press days I worked for many Jewish, and Iranians customers that came to me because of my work. So that is where I believe Lanston has the most to offer these people. Ornaments seem to be part of their culture.  <br> <br>OpenType maybe a good place to put these ornaments to work. Computers are patently inferior in ornament handling to hand set type. In fact inferior to setting them on a Monotype. Maybe I can find something in that format that would make my time worth the while. <br> <br>As for the rest of all the 8 bit nonsense I know nothing about and could care a less about as long as I can make beautiful and useful things.  <br> <br>My final complaint about both aeroplanes and computers is the are just too dam slow, and I can't stand waiting for them to \"crash\". <br> <br>So when you speak of bits, you are really scaring me John. When I hear bits, I hear screams, I see blood lots of blood and get this sinking feeling. It makes me want to upchuck. <br> <br>Now finally.  <br> <br>How many applications support OpenType? <br>What is the statistics from a minor font company that can indicate the following. <br> <br>How long does it take to make an OpenType font fully featured? <br> <br>How much more can one fairly charge for an OpenType font as opposed to a Type 1 font? <br> <br>In otherwords when I visit should I expect to bring my swimming trunks for your swimming pool which was earned by that difference in \"direct, end user font sales\"? <br> <br>Or will that not be necessary? <br> <br>If OpenType offered nothing but ugly fonts and Type 1 offered the fonts you liked. Which would you buy for your poetry magazine? <br> <br>None of these questions are unreasonable. <br> <br> <br></p>"
    html_clean: "<p>John, <br> <br>I am going to look at these links. Also I am thinking about this OpenType business once again.  <br> <br>Still, I must ask myself what I can do for the Chinese, Indian and Arabic computer users? But I am not going to think about it long because the answer is obvious. So I am just going along with you because you are an old friend and I know you are trying to be helpful.  <br> <br>For you, OpenType is part of your business. Type making tools, exotic language issues is, or so it seems is, part of your business. <br> <br>For me it is not, maybe Finnish. <br> <br>I would have to ask myself how I could be of help to these people, what designs can I offer them? What do they know or wish to know about Goudy, Bruce Rogers, Caslon. Also I must ask how I am able to make a living from them? <br> <br>You want to subsidize Lanston John? <br> <br>With all the free fonts out there, fonts getting spam bundled. Downloads from the net with absolutely no business model. Why would people from a foreign exotic language speaking company want to buy a font from us, or for that matter you? <br> <br>One would presume firstly they were going to set something, perhaps in French, English? The usual. For the English or French Type 1 fonts are just fine. The exotic speaking language countries unless set by some roaming intellectual would not even know what a \"ligature\" was. But if they did, we already have them. Swash, small caps, oldstyle figures, etc. Strictly academic folk would need those and those folk are smart enough to use Type 1 fonts and have already been using them for years. But most likely if those people found a ligature automatically stuck into their text they would have to make a service call to find out what was wrong with the font. Who needs the agro? <br> <br>I am speaking of our alphabet. 99.99% would be unable to distinguish between a good European type design from a bad one. For that matter they would not be able to distinguish the different sounds of a \"b\" from an \"h\". 99.99% of them can not speak a word of English. I am sure the literacy rate is at least as bad as Prince Edward Island Canada where only one in four can read a single word of English or French. I am sure the situation is probably much the same in those countries. <br> <br>So you say I should design foreign \"exotic\" languages, I must say \"no\" to that suggestion. Firstly I would find it far too arrogant for me to presume to do a better job than their best and my interest is in the best. Naturally I am open minded and if William came to me and said he designed a Hebrew Alphabet that he thought was good. I would certainly jump at the opportunity to address such a matter. I have a great deal of respect for his sound observations. <br> <br>Mega Corporations, Chinese, Japanese, Indian companies that are selling big ticket items hire a good American, English or Canadian Advertising companies for print promotional materials in the English speaking world. That is how I can help them. That is how I can make a meagre living. That market exist for us today. Type 1 fonts I must emphasize. <br> <br>Eastern European Languages I could be helpful with, once again, there is no logical business model. First our designers are unknown. Our promotional materials would have to be translated. Our fonts would have to be worked over, new characters and accents added. Then some way of getting found on the web would have to be examined. Not to mention currency and banking concerns, fraud, piracy but let us not forget the obvious. E-mail correspondence. How many different telemarketers, or e-mail personal would I require. <br> <br>Heeeeelp, I am already drowning.  <br> <br>Sorry John this does not look like it is going in your favour. <br> <br>This is a big world. You need, and you sound, like you have resources that I don't. I predict if you removed those resources and competed on  a one on one level with Lanston and followed your own advise predictably the next time I visited you we would be meeting in Oppenhiemer Park within several months. <br> <br>So make sure you get yourself a pigeon gun before you do anything so foolish. After all you might not like the line ups at the food bank. <br> <br>Not to mention, if by some insane fluke profits were to be found that were substantial you would be cheated out of your due rewards by some bully mega corp that bundles a \"copy product\" for free with their applications.  <br> <br>I am curious. What type face do you strongly recommend to the typophiles, or the advertising world that was designed by someone in Bombay, Iraq or some other place with an exotic language by a designer that \"could not speak or read a single word of English\"? Or any common European Language? Please don't tell me Baskerville was designed by Halima Abdule from Somalia. Besides she is still alive and teaches in Roxhill Elementary School in America. <br> <br>The trick to this question is that the recommendation has to be for a book of English literature, such as Shakespeare, or high end advertising print promotional material. Such as Rolls Royce. <br> <br>Next question: How many fonts do you commonly use that has been designed by someone that does not speak any European language or any language that uses the Latin alphabet? By someone that only speaks their own exotic language and nothing else? Remember William speaks English. <br> <br>Now I hope your answers to those two questions are similar because the questions are. <br> <br>But it is possible if the moon can be flat. But not likely to win \"top TDC awards.  <br> <br>Now I am not saying it can't be done, I am just saying I am not going to risk what little I already make in this business on plain foolishness. Call me Mr. Conservative. <br> <br>Anyway let me help you with the answer, Probably not many. How many do you use daily? Probably none. How many have you purchased? Well you are a strange one, and you have those quirky but interesting typographical pursuits. If anybody does I would think it would be you. <br> <br>But for the rest of us I am afraid we know names like Bodoni, Caslon, Goudy. Not much chow mein shows up in my fonts menu. Although I would like to have some soon, I am rather hungry. <br> <br>Can I come for dinner John? Alright, alright. <br> <br>But I will tell you what. If it is that big an issue someday I might upgrade my TypeLab software if it has an auto generate OpenType format and maybe play around with positioning the ligatures etc.  <br> <br>Now we have come to some amicably agreement, I have made all the movement, I would now ask that you push towards a rational optical scaling for type. I do not mean optical sizes. Also to build tools so this is not a lifetime project. <br> <br>But before you gloat you should know what my reason for considering OpenType. As you know I love ornaments, <a href=\"http://lanstontype.com/DreyfusKeyboardLoft.html\" target=\"_blank\" class=\"link-external\">http://lanstontype.com/DreyfusKeyboardLoft.html</a> and in my fine press days I worked for many Jewish, and Iranians customers that came to me because of my work. So that is where I believe Lanston has the most to offer these people. Ornaments seem to be part of their culture.  <br> <br>OpenType maybe a good place to put these ornaments to work. Computers are patently inferior in ornament handling to hand set type. In fact inferior to setting them on a Monotype. Maybe I can find something in that format that would make my time worth the while. <br> <br>As for the rest of all the 8 bit nonsense I know nothing about and could care a less about as long as I can make beautiful and useful things.  <br> <br>My final complaint about both aeroplanes and computers is the are just too dam slow, and I can't stand waiting for them to \"crash\". <br> <br>So when you speak of bits, you are really scaring me John. When I hear bits, I hear screams, I see blood lots of blood and get this sinking feeling. It makes me want to upchuck. <br> <br>Now finally.  <br> <br>How many applications support OpenType? <br>What is the statistics from a minor font company that can indicate the following. <br> <br>How long does it take to make an OpenType font fully featured? <br> <br>How much more can one fairly charge for an OpenType font as opposed to a Type 1 font? <br> <br>In otherwords when I visit should I expect to bring my swimming trunks for your swimming pool which was earned by that difference in \"direct, end user font sales\"? <br> <br>Or will that not be necessary? <br> <br>If OpenType offered nothing but ugly fonts and Type 1 offered the fonts you liked. Which would you buy for your poetry magazine? <br> <br>None of these questions are unreasonable. <br> <br> <br></p>"
