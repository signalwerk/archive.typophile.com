    html: <p>PageMaker is a bit of a dead end. Adobe are only marketing it to business/secretarial users. It is no longer being developed as a serious page layout app for professional use. In terms of existing apps that are current and in active development, InDesign and Illustrator are your best choices for further investigation.</p>
