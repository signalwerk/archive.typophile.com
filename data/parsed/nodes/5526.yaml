    html: "<p>Gerald, on your website you show some images of pattern development using cut out pieces of paper. You might consider that a paradigm for any dedicated ornament software. What made that approach useful? How can it be modelled on a computer? I'm guessing that the freedom to very quickly manipulate shapes -- to flip them, rotate them, move them -- is what makes this approach useful. But text layout is all about putting glyphs in lines, and what if you decide that you pattern should have one unit rotated 45 degrees <i>in the middle of the line</i>? With paper you get out your scissors. With metal you get out your file or your furniture. With digital type you have to make a separate story element, and then you have to rotate that and try to accurately position it relative to another story element. This seems to me very awkward. I'm not surprised that you had a hard time using current graphics tools, because they are not ornament-dedicated; they have not been designed with pattern-making in mind. <br> <br>You say the trick is to understand the problems. This is partly true, but one should be aware of which problems are particular to technology -- i.e. problems of accurate alignment in existing apps, inability to take a virtual file to an ornament -- and which problems are fundamental to design with ornaments. I wouldn't start from the problems; I would start from the possibilities. The best, most innovative software begins from determining what you would like to be able to do if you had total freedom, not from trying to solve problems inherited from other technologies. <br> <br>What comes to my mind when I think about ornaments -- and I must admit to not thinking about them very often -- includes something <i>like</i> a font file, i.e. a kind of holder for a collection of ornaments. This could, in fact, be a font. But the input and editing mechanisms would be totally divorced from the <i>text</i> model of digital typesetting. Actually, it would be much more like setting metal ornaments by hand: you would have the digital equivalent of a tray of ornaments -- containing one or more collections, which could be purchased as sets and also user-defined, making it easy to mix and match from different collections -- and you would be able to select elements, drag them into position, rotate them, slant or shear them, edit directly to remove or change portions of individual elements, and so on. You could set up a grid in the work area, and there would also be snap to alignment commands. Parametric pattern making would be easy also: you could specify the number of elements, the kinds of rotation permitted, etc. and let the software build the pattern. You could assign colour to individual elements or discreet sub-elements, or globally assign colour to every instance of a particular element in the design. Actually, this suggests to me a further refinement, the ability to define classes of elements, so that you can control attributes (rotation, colour, etc.) for groups of elements. The same element could belong to more than one class, and could be globally adjusted in the design in different ways depending on from which class it was selected. <br> <br>All this is just of the top of my head while sitting here typing. If we were in a restaurant, I could draw it on the tablecloth for you.</p>"
