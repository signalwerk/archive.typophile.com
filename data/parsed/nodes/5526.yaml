    html: <p>John, <br> <br>Regarding your last post.  We wrote about that earlier. A forum member who is extremely technically adept wrote me privately and told me your idea would never work as well as a font format. My instincts told me the same. <br> <br>I put my instincts aside. At that time I had little to no experience with graphic files. In fact my experiments with your suggestion is the most graphics experience I have. <br> <br>All of my work is almost one hundred percent type. Always has been. One notable exception was the Mante book. <br><a href="http://lanstontype.com/GirlNaturalSetting.html" target="_blank">http://lanstontype.com/GirlNaturalSetting.html</a> <br>Which had to have pictures, it was about early photography. <br> <br>Other than that I can't remember any book that included pictures. <br> <br>Non book occasions such as my work for the University of Denver. The Drulow? Drewlo? can't remember the spelling. An important Denver artist. This was called her "One Hand Period" She had been in Japan in the very early 20's broken her arm and had to cut her wood blocks by standing on the block with her foot and cutting the artwork with her good hand. Her work, by the way, was outstanding. These blocks had never seen ink. The wood looked like it was cut yesterday and they wanted perfectly printed proofs of these on hand made paper without any damage other than ink. They chose Northland Letterpress <a href="http://lanstontype.com/BuickIvy.html" target="_blank">http://lanstontype.com/BuickIvy.html</a> for this project. So that single job had no type and was strictly woodcuts. They sent the famous Errol Ettiene up from Denver who insisted on sleeping in the plant to protect the artwork and any copies that may go astray by the local dumpster divers. Of which, by the way, your old employer, William Hoffer, Bookseller was amongst them. <br> <br>Another would be wood cuts by the Famous Canadian Artist Bill Reid when he was well into his Parkinson�s Disease Period. <a href="http://lanstontype.com/BillReid.html" target="_blank">http://lanstontype.com/BillReid.html</a> <br> <br>And another exception. A large well designed book form proposal which included line drawings of various species of third world cows. A semi-commercial text about the science proposal of having third world cows give birth to Heffers. <br> <br>I called it the "rent a womb" project. <br> <br>Then the dreaded $89,000.00 Vanderbuilt project. <br> <br>What I am hinting at is that my true talents are typographical. Graphics for me is merely like instant printing. The art work is supplied and I was putting ink on paper very carefully. <br> <br>After you made your suggestion  I did experiment. Back and forth between programs, too little control over positioning. Endless layering problems and certainly stubborn to even the slightest change, which hampers greatly, the creative process. Every change went back to a different program. I would prefer a plug in to an existing page layout program such as PageMaker. Colour was a real bother, I found myself painting little pictures. And one thing I recall is "naming the files". Cleaning up after myself was like doing diapers.  <br> <br>One of my web pages was built in your suggested fashion. I was thinking about how easy it would work, if it would work, if this was in fact a good way to go. Well it does work. Not very well. My skills aside. <br> <br>I was thinking of solutions to the very problems I was having. Some of the problems I was having, the most irritating problems I was having, do not exist in "font format". <br> <br>Size is a biggy, scaling a graphics can cause visible damage in quality. File storage is not altogether compact. For every point size you would have to generate a gazillion different sizes when in a font format only one. It just looks to me like a no go solution. <br> <br>Furthermore the other problems remained the same, but the solutions led to font format solutions and not graphics. In other words I saw no obvious solution working in graphics format where I could see multiple solutions in "font format". <br> <br>In other words I was busy making clip-art fonts without any of the benefits of genuine fonts. <br> <br>You may say to yourself, but you could make a program? <br> <br>To come up with a solution you have to know what the problems are. In other words no problem no solution. So I worked within existing programs, and experimented. Thinking about the problems, thinking about how to improve them. I can tell you quickly there was no good answers available unless you could cut everything back put them into grids make them into fonts and work them in that fashion. In other words all roads went home to typography. From that point, "as fonts" I see many opportunities to make improvements and always have. The advantage is that you don't have to make fonts into graphics and then make them back into fonts so you can work with them. Doesn't sound good. <br> <br>Not to mention scaling is a major factor and I just detest how PDF's rasterize graphics, particularly if you use the magnifying glass. Type on the other hand, I am sure everyone has noticed, is wonderful. The bigger it gets the better job it raterizes. With graphics the reverse in true. <br> <br>However I have an answer that would put ornaments back into big time visibility. If Adobe made a slight change allowing you to hold down the "Shift Key", "Wake Up" a character, then "Wake Up" another character, and another if need be. Then a colour change or font change would be all it would take.  <br> <br>When PageMaker was still Aldus PageMaker, rather than the more stubborn Adobe PageMaker, they were doing this very thing at my suggestion. They had programmers back and forth several times. In fact there were working prototypes. This feature would be useful not only with ornaments. To be honest they indicated the code was very simple.  <br> <br>By the way this same feature would make other things much easier as well. <br> <br>Take a look at this, <a href="http://lanstontype.com/Pabst-Goudy.pdf" target="_blank">http://lanstontype.com/Pabst-Goudy.pdf</a>  <br>I am not finished with this page yet. Second line, look at the "leaves" bookending the word "Pabst". Think about changing the colour of those leaves and the process required. First you must pick one leaf, change its colour. Pick the next leaf, then change the colour. <br> <br>Well think about this you pick one leaf holding down the shift key, then pick the other leaf and then change the colour. Which is quicker? <br> <br>If you are not yet convinced take a look at the colour paragraph marks on the right hand column imagine having to change those colours, or even make, for some reason a font change. Well it is easier to work by copying on and pasting into each position sometimes disturbing such things a word spacing. However it would be easier and more flexible in the fashion I have indicated. Next, and to make a killer ornament program all you need is one additional feature. A more robust "seek and change" routine. So why should I write a program when it would be best for everyone if Adobe wrote a few simple lines of code making their application far more powerful. Allowing a very traditional aspect of typography some breathing room in the modern stage. <br> <br>I hope I have described this fairly well. The Aldus gang could see the advantages very quickly but the Adobe people for reasons unknown to me can not see it at all. <br> <br>Maybe I am talking to the wrong people at Adobe. Unfortunately for me Sumner Stone is gone. <br> <br>But it would work for me entirely, no further programming would be required. I am not in the application business. I am in the font business. What do they have to worry about. Nothing.  <br> <br>I would simply include this manual with my ornament fonts. If they wished they could include the same manual in their fonts or their application programs. <br> <br>And John, you of all people know very well I have nothing but good intentions in this industry. I love this industry and I am just trying to make things better, not worse. <br> <br>I am sorry I can not run this through a spell checker and I am in my dyslexia part of my day. So I hope you find this partially understandable <br> <br> <br> <br> </p>
    html_clean: <p>John, <br> <br>Regarding your last post.  We wrote about that earlier. A forum member who is extremely technically adept wrote me privately and told me your idea would never work as well as a font format. My instincts told me the same. <br> <br>I put my instincts aside. At that time I had little to no experience with graphic files. In fact my experiments with your suggestion is the most graphics experience I have. <br> <br>All of my work is almost one hundred percent type. Always has been. One notable exception was the Mante book. <br><a href="http://lanstontype.com/GirlNaturalSetting.html" target="_blank" class="link-external">http://lanstontype.com/GirlNaturalSetting.html</a> <br>Which had to have pictures, it was about early photography. <br> <br>Other than that I can't remember any book that included pictures. <br> <br>Non book occasions such as my work for the University of Denver. The Drulow? Drewlo? can't remember the spelling. An important Denver artist. This was called her "One Hand Period" She had been in Japan in the very early 20's broken her arm and had to cut her wood blocks by standing on the block with her foot and cutting the artwork with her good hand. Her work, by the way, was outstanding. These blocks had never seen ink. The wood looked like it was cut yesterday and they wanted perfectly printed proofs of these on hand made paper without any damage other than ink. They chose Northland Letterpress <a href="http://lanstontype.com/BuickIvy.html" target="_blank" class="link-external">http://lanstontype.com/BuickIvy.html</a> for this project. So that single job had no type and was strictly woodcuts. They sent the famous Errol Ettiene up from Denver who insisted on sleeping in the plant to protect the artwork and any copies that may go astray by the local dumpster divers. Of which, by the way, your old employer, William Hoffer, Bookseller was amongst them. <br> <br>Another would be wood cuts by the Famous Canadian Artist Bill Reid wh