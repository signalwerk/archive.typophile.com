    html: <p>John, <br> <br>I appreciate your offer to take me to Greece for lunch but I must decline. Soon I should get back to Finland. I just thought since I was in the neighbourhood we could get together. <br> <br>What I was showing earlier is that some of the features lacking in PageMaker would share strong use in more typical typesetting. Not just ornaments. I would like to sell (for free) Adobe on the idea of some incremental improvements. <br> <br>The edit  feature, for instance "change". That feature would be best improved. For instance it would be nice to be able to change fonts in  a text such as the italics within without selecting each individual word or group. If you want to change "just" the italics. It would change "just" but all the "italics", or "just the italics in just one size" and if need be, change the colour at the same time, or if a word is repeated and needs kerning, your could kern once, change all. In otherwords it should have more text editing abilities. Granted it does have some word processing stuff going on, but it is not supposed to be just for legal secretaries. Also the colour component would have many uses.  <br> <br>Then a few macros inside the macros and we are about home free. So some independent scripts would be nice. In fact rather than have Adobe write the scripts I would be just as happy to include recordings with my fonts. If Adobe included a script managing tool that allowed independent scripts to be written that would work for me, and many others. I know there is some kind of built in scripts but I don't know what they are for, or if you can add to them. It so it certainly is not obvious to us old folk. That, and an inspiring little book/manual designed by yours truly <a href="http://lanstontype.com/GiampaJugendsali.html" target="_blank">http://lanstontype.com/GiampaJugendsali.html</a> and the typographical world will sparkle like the Taz Mahal. <a href="http://www.flex.com/~jai/satyamevajayate/tejo.html" target="_blank">http://www.flex.com/~jai/satyamevajayate/tejo.html</a> <br> <br>What's wrong with that? Nothing. <br> <br>What I am suggesting is that PageMaker would well serve its (my) customers by having a robust macro recorder built into its text editing capabilities. Not to mention my "ulterior motive" with ornaments. <br> <br>Anyway, were you speaking of this series? <br> <br><a href="http://lanstontype.com/BoquetOfFlowers.html" target="_blank">http://lanstontype.com/BoquetOfFlowers.html</a> <br><a href="http://lanstontype.com/DreyfusProofs.html" target="_blank">http://lanstontype.com/DreyfusProofs.html</a> <br><a href="http://lanstontype.com/DreyfusTwo.htmlhttp://lanstontype.com/DreyfusBinding.html" target="_blank">http://lanstontype.com/DreyfusTwo.htmlhttp://lanstontype.com/DreyfusBinding.html</a> <br> <br>Or this series. <br> <br><a href="http://lanstontype.com/EndPapers.html" target="_blank">http://lanstontype.com/EndPapers.html</a> <br> <br><a href="http://lanstontype.com/ArabesqueGalley.html" target="_blank">http://lanstontype.com/ArabesqueGalley.html</a> <br><a href="http://lanstontype.com/ArabesqueProof.html" target="_blank">http://lanstontype.com/ArabesqueProof.html</a> <br><a href="http://lanstontype.com/ArabesquePencil.html" target="_blank">http://lanstontype.com/ArabesquePencil.html</a> <br><a href="http://lanstontype.com/ATFCover.html" target="_blank">http://lanstontype.com/ATFCover.html</a> <br> <br>I have written a manual. Sumner Stone and I had discussed the best way of doing handling this. We concluded that was the best way to proceed. <br> <br>An ornament handling program is an interface question first, technical second. But I have defined what I would like to see. I emphasize the word "see". <br> <br> <br> <br></p>
