    html: <p>John, Marc, Thomas, <br> <br>Thank you all for your input. I have some problems switching to InDesign, old problems revisited. <br> <br>"PageMaker is a little dead." Maybe you are right John. I found little reason to move upwards. Besides it works just fine. I am not sure PageMaker is "professional or not" but I have worked with some large book publishing companies that seem happy with my "amateurish work". <br> <br>In any event I have some questions which are "Real Problems Switching to InDesign." <br> <br>I am running PageMaker 6.5. I did "not" want PageMaker 6.5 because "I had purchased InDesign 1.5". The reason I have PageMaker 6.5 is because my yet even older version of PageMaker files were unable to be ported over to InDesign. <br> <br>So I am not stuck with PageMaker because I don't want to switch. I am stuck with PageMaker because "I have no other choice". <br> <br>A bad business decision in someone else�s "Marketing Plan". <br> <br>Adobe told me that if I imported my older files into PageMaker 6.5, I could import those files into InDesign 1.5. Sounded simple, but expensive to me. But what the heck�"go for it" I said. <br> <br>My files were transferred into PageMaker 6.5. No small task believe me. <br> <br>So I did the right thing, or so I thought. <br> <br>After doing what I was advised by Adobe� "the files did not port over to InDesign 1.5 correctly", they are "frozen" with no apparent method of editing them. And a mess. <br> <br>I agree, some of the files are complex. Perhaps black and white, Times New Roman, no graphics may port over and work. I would not know? I don't make those kinds of files. <br> <br>So I went back to PageMaker and there I stay. <br> <br>Perhaps a "new InDesign for purposes of testing OpenType fonts. Lot of money for that. <br> <br>I have spoken to someone that seems to know a lot more about this than I. <br> <br>Here is the problem. <br> <br>Maybe there is a way to move the files into InDesign 1.5 "correctly" although I have yet to find one. <br> <br>But I have heard that InDesign 2.0 will not import files correctly, or even at all from InDesign 1.5. <br> <br>So where does that leave me? In a land of the somewhat peeved.  <br> <br>Is this all hopeless? I have accumulated a lot of files over the years. What should I do with them? By the way�other people�are still running PageMaker for the same reason. <br> <br>This is the kind "forced upgrade path" that I would advise against. What I see here is this� if a corporation develops "new software" that leaves "LOYAL CUSTOMER'S FILES DEAD". It is time to rethink the business model. You don't see this customer moving forward�too quickly. <br> <br>To put it simply, that is a failed business model.  <br> <br>������������������������������ <br>The customer should� "not be forced�not to upgrade". <br>������������������������������ <br>Is that too hard to understand? <br> <br>I will get around to the "long term solution" to this particular customer complaint real soon. <br> <br>Corporation thinks sales should be "good" when the old dies because they have the "new to replace it" they should remember the purpose for software. Software is a tool, the same as a hammer. Just because there is a new hammer invented does not mean you have to "tear down the half finished house". TOOL MAKES HOUSE. What is the purpose for the tool? I hate to go Ronald Reagan on your folk. <br> <br>"But there is all these files", all this work "orphaned by YOUR NEW HAMMER". Guess what, I like the old hammer! The word "new" begins to lose its magic when years of a man's work is about to be lost. "New to that man is "BAD". <br> <br>So instead of following the "incremental path which is profitable". It seems we have returned to the planned obsolescence model which is truly outdated. <br> <br>In other words why would anyone buy "new software" that can not run the "old files"? When you design a new car, do you dig up the roads? <br> <br>Think of it this way. If you buy a "new fridge" don't you want to move your food over? This "business model" is doomed to failure. I can't believe anyone would be so foolish. <br> <br>To me this is corporate madness. <br> <br>We are going through a period, at least for a segment of the population of �wait-&amp;-see-ware� rather than "buy-new-software". <br> <br>I do appreciate the problems of software development, however, planned obsolescence is bad practice. Too much junk in land fill sites. <br>(Make note to self, I remember something about patents &amp; tacit abandonments.) <br> <br>The results of "orphaning loyal customers" the software market is now baby based, "no baby-boom, no market-boom". <br>������������������������������ <br>Lanston makes fonts so Mr. Giampa keeps his ear to the ground. This is how Giampa envisions the future. <br>������������������������������ <br> <br>I would "freeze" with the PageMaker 6. I would bottom feed on machinery that would keep it all alive. At that point there would be no future for any software or hardware company to make another nickel from me. <br> <br>Jim Rimmer I suspect feels the same way. But you think we are just "old guys". <br> <br>But I can tell you that there are people in this forum that feel the same way and are resisting the methods of the present day business model. <br> <br>There is nothing wrong with  a G4, and neither PageMaker or InDesign will make me a better or worse "designer" because of it. Designing is the "human factor". <br> <br>But, I am in the font business. I have no choice than to pay attention to the drums of the future, as faint as they are. <br> <br>I guess I was wrong, "I am ranting and raving".  <br> <br>New computers, new software, well no, that's not what I think will happen. PC's are going to be replaced by dumb boxes. Some here will not know what dumb boxes are. Best put, a TV screen with a keyboard. In the old days computers were big, really big boxes. You didn't need a desk, you needed a concrete floor. However you could log through the phone lines and get all the power as if a full main frame was sitting on your desktop. All applications ran on sever based software and could be at "your disposal". <br> <br>Think about it, think about the "web". <br> <br>You young uns just aren't keeping up. <br> <br>This is how I see the future. "My crystal ball has finger prints on it. OK, there it is "crystal clear". Omar says, "End User desktop applications, fonts and computer hardware will free fall with out a parachute. <br> <br>Sounds like a terrorist attack folks. <br> <br>Oh, I see now what Omar is saying. "The writing is on the wall�web based applications will replace all future software, PC hardware and font formats".  <br> <br>"Web-direct-to-press." <br> <br>Omar, what's happening in the font business? <br> <br>"Buy IBM Stock".  <br> <br>Omar used to be a stock broker, time to put a lid on Omar.  But on the serious side, web based applications are a thing of the very "near future". Think of the advantages, seamless upgrades in both software and hardware. Hardware will sell in the low hundreds of dollars. There will be a keyboard and a screen. Small chip, something, not much. Think cheap, no software to speak of. Access to anything, always up to date.  <br> <br>So what my thoughts are is this, �new age� has had its day, �it was a good run�, but now the mine is running out of ore. "Utilities industries, such a phones services, electricity etc. is clearly where this industry is headed. This is the only way to expand the market, to allow the third world to catch up, certainly you have to admit. If I am unable to keep up with the expenses, how do you expect them too. Web is the answer. <br> <br>Think of it this way. If you had money you would pay for the "applications time". If you did not have the money, such as the third world, you could have "station break advertising pay for the time" such as on TV. Free, great way to bring those people up to speed. Even the odd cheap skate. <br> <br>A very different business model. <br> <br>In fact my guess is that the push to OpenType is because it may be, just may be, Unix based. <a href="http://www.computerhope.com/history/unix.htm" target="_blank">http://www.computerhope.com/history/unix.htm</a> <br> <br>And back to Finland. <a href="http://www.computerhope.com/unix/linux.htm" target="_blank">http://www.computerhope.com/unix/linux.htm</a> <br> <br>Unix, Linux, server, server, server I hear the whistles blowing. <br> <br>Do I get my "pointy hat &amp; wand" now? <br> <br>Sorry to cut this short but I have a ferry to catch. <br></p>
