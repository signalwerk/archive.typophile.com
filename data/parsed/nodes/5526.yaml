    html: <p>On the scripting/macro side, InDesign is more scriptable than any competing application; scripts can be added by anybody who wants to (in Java on either platform, AppleScript on the Mac and Visual Basic on Windows), though you have to actually write or modify them --you can't record scripts. Additionally, the plug-in architecture exposes more than any competitor, and IIRC the plug-in developers' kit (SDK) is free. <br></p>
