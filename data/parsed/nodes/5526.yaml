  html: <p>Radio and Television are one-way media. You receive what someone else decides is important, usually someone with a lot more money that you will ever have. Personally, I think they rot your brain and won't have a television and seldom listen to the radio. Text is where people record and share what is important to themselves, their families and their communities. When radio and then television arrived on the scene, pundits predicted the death of the written word. It hasn't happened and it won't happen. <i>Verba volant, littera scripta manet.</i> Despite the promise/threat of Web TV, the Internet is the most text-intensive medium since Gutenberg lined up his pieces of metal and challenged the scribes to keep up.</p>
