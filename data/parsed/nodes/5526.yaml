    html: "<p>I'm not comparing myself to anyone, I'm pointing out that what you characterised as an age of radio and television has given birth to something incredibly text oriented -- the Internet --, not to mention more book, magazine and newspaper publishing than at any previous time in history. <br> <br>If you find Type 1 fine, go ahead and use it for as long as you can. When the operating systems and eventually Adobe themselves stop supporting the format, I'm sure someone will provide a third-party or open source rasteriser to keep the technology alive, although straight conversion of the 8-bit fonts to the OpenType file format would be as easy or easier. But take a look at these web pages that test encoding and layout for different scripts and languages, and understand that only a handful of the scripts and languages they show can be correctly rendered with Type 1 fonts: <br> <br><a href=\"http://www.eleves.ens.fr:8080/home/madore/misc/unitest/\" target=\"_blank\">http://www.eleves.ens.fr:8080/home/madore/misc/unitest/</a> <br><a href=\"http://www.unics.uni-hannover.de/nhtcapri/multilingual1.html\" target=\"_blank\">http://www.unics.uni-hannover.de/nhtcapri/multilingual1.html</a> <br><a href=\"http://www.alanwood.net/unicode/#links\" target=\"_blank\">http://www.alanwood.net/unicode/#links</a> <br> <br>You may be satisfied with Type 1 fonts, but most of the world will not. Developments in font technology are not driven by North American fine printers, they are driven by millions of Chinese, Indian and Arabic computer users. This is why the Type 1 format is doomed: it simply isn't up to the job. The fact that you think it's fine is completely irrelevant to it's prospects.</p>"
    html_clean: "<p>I'm not comparing myself to anyone, I'm pointing out that what you characterised as an age of radio and television has given birth to something incredibly text oriented -- the Internet --, not to mention more book, magazine and newspaper publishing than at any previous time in history. <br> <br>If you find Type 1 fine, go ahead and use it for as long as you can. When the operating systems and eventually Adobe themselves stop supporting the format, I'm sure someone will provide a third-party or open source rasteriser to keep the technology alive, although straight conversion of the 8-bit fonts to the OpenType file format would be as easy or easier. But take a look at these web pages that test encoding and layout for different scripts and languages, and understand that only a handful of the scripts and languages they show can be correctly rendered with Type 1 fonts: <br> <br><a href=\"http://www.eleves.ens.fr:8080/home/madore/misc/unitest/\" target=\"_blank\" class=\"link-external\">http://www.eleves.ens.fr:8080/home/madore/misc/unitest/</a> <br><a href=\"http://www.unics.uni-hannover.de/nhtcapri/multilingual1.html\" target=\"_blank\" class=\"link-external\">http://www.unics.uni-hannover.de/nhtcapri/multilingual1.html</a> <br><a href=\"http://www.alanwood.net/unicode/#links\" target=\"_blank\" class=\"link-external\">http://www.alanwood.net/unicode/#links</a> <br> <br>You may be satisfied with Type 1 fonts, but most of the world will not. Developments in font technology are not driven by North American fine printers, they are driven by millions of Chinese, Indian and Arabic computer users. This is why the Type 1 format is doomed: it simply isn't up to the job. The fact that you think it's fine is completely irrelevant to it's prospects.</p>"
  - id: 39636
