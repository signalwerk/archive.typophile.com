    html: <p>Chris, <br> <br><i>Gerald, keep making the beautiful type you are making and let the young tech. jockeys of today ready it for the next "new" thing. It is like turning your drawings over to a punch cutter, you get to challenge them and speak your mind but they have to do the dirty work of cutting steel.</i> <br> <br>Actually Chris, not all is lost. I was thinking about this yesterday, meaning to ask you what your thoughts are. Remember when we were young and it was the philosophy of the day.  <br> <br>"Don't trust anyone over thirty". <br> <br>It has taken me many years to find truth to that wisdom. We were right. <br> <br>Some of these young kids are great, they actually listen and care about what you have to say. They are not as much interested in the Bells &amp; Whistles of the Radio Tube Generation that keeps creeping up our butts. But they care about the arts. <br> <br>Or lets call it beauty and the traditional values, there is that young fellow in New Zealand for instance. His logo with the "K". Good kid, and that fine "a" fellow from Italy, absolute gold. For me they are everything, a chance to pass down values. Chris you should remember that most of my life Lithography and Photocomp were well established. I did not participate in any of that. I never produced a single job in my entire life by either method. I am not a techno-junkie, I leave that to the "Buck Rogers" of the world. Especially when it is so clearly inferior, clearly misdirected.  I was not involved in hot metal because it was just the technology of the day. I was involved because of its clear superiority which is well acknowledged by, for instance, fellow forum member, Gerald Lange. He does beautiful work, sent me something, an earlier customer. I kept it on my walls for years until it was lost in the tidal wave. <br> <br>So I am not much interested in the nonsense of technology. I was involved in hot metal because I was interested in the book arts. The books arts are going to come to pass and some people are going to pretend that new technology is better. Yes they will be making plastic women next. They have got to be better. At least for those guys. <br> <br>They are simply fooling themselves. <br> <br>You have probably noticed that I have my little fights in this forum. People thinking they know more than I. Some of which, by the way, would not even be in this industry had it not been for my inspiration. John Hudson for instance. <br> <br>I am proud of him. Cheeky but "who am I to complain". <br> <br>But if I have any qualities I would like to pass down it is by virtue of the arts. That and my forever insightful personality quirks. I suspect you haven't noticed them. <br> <br>What do boats have to do with typography? I thought your would never ask. For me everything, adventure and freedom. To stay in touch with the planets. <br> <br>But ask what kind of boats do I like?  <br> <br>"Wooden boats."  <br> <br>You know why, because they are made of wood by human hands with traditions that have gone back to early man. I learned something about building wooden boats and it is a soul searching experience to learn things that were actually discovered and used by forefathers of forefathers that go back thousands of years ago that are just as valuable today as they were then. Wooden nails for instance. Trunnels they are called. I could tell you a lot about trunnel making itself, about the woods, but I want to keep this as a short little note. Wooden boats have evolved from simple floating logs to shells, the opposite of cups that keep liquids in, boats keep liquid out. Well hopefully�they do spring the odd leak, but then again, who doesn't? <br> <br>Wooden boats are mankind's first attempts to make animals, early cloning, test tube animals if you will. Wooden boats are given a soul because without one, what would they be�plastic?  Wooden boats have a backbone, ribs and skin, they move, bend, groan, and complain if you don't give them attention. They can be playful like children. Boats like to roam and be free, they are not happy tethered to a dock. They are not domesticated. They are the stallions of the sea. <br> <br>But stallions do not wear underwear. <br> <br>Wooden boats speak of the people that built them. Far more localized distinctions than most would think. They vary in the Finnish Archipelago from Island to island. But to the untrained eye you would never know the difference. But they can. <br> <br>Some day I will tell you about the ingenious method they charted the islands. <br> <br>There is something to navigating by the stars, the winds in the sails, and far away places to go. Something to the solitudes that inspire man to realize he is merely a small part of some incomprehensible vast act not part of our own making.  <br> <br>Also I like marble, you have a Greek background. One of the most amazing experiences in my life was this Greek shipmate his name was Frank, at least that is what he was called. He was a sculpture working on a naked lady, life size in his cabin. He loved what he was doing, he worked away for hours on that rock in his cabin while others went a-whoring. I found in this man's work something exhilarating and I had this wonderful vision I would like to share with you. Frank decided when Greece was taken over by that Popadopolous dictator dude, (Names, I suffer from a condition called anomia, which means I am a man without nouns, incurable I might add, Thomas picks on me about that, I don't think picking on old impaired people is a nice feature of his.) I think that was his name, that he was not going to return to his homeland. Of me he requested a boat to be arranged so he could escape this dictator, a request a good friend could not deny. The peculiarity of his predicament was this huge hunk of marble in his cabin, it was not finished. I got this old lapstrake row boat, of substantial proportions I might add, also it had a little putt putt Briggs &amp; Stratton engine in her belly. I ran her down from horseshoe bay, a tormented journey. We didn't call it stealing when we were young, we never stole cars or nothing like that, we just borrowed them, more often than not we forgot to mention it to the owner. Besides when we did they always said no. <br> <br>But it was a dark night, I came along side this old ship owned by Onasis of all things, a steam donkey on deck was a huffing and puffing away as he lowered his naked marble lady into this borrowed boat. The moon shone through the marble exposing the soul of the woman, she came to life for me that very moment. She cast upon me a message about the arts of great enlightenment. I call it the "dead spirits amongst men". Those that have yet to find the spirits in the arts are just marble without a soul. <br> <br>Call me a simple man. I have just tried to make this world a prettier place for our children to read in. Hopefully I have not wasted my life. <br> <br>Nice chatting with you Chris, hope you have a nice day. Oh, by the way, do you know why boats are female? <a href="http://lanstontype.com/GiampaGoesToSea.html" target="_blank">http://lanstontype.com/GiampaGoesToSea.html</a> <br>Lower left hand column. <br> <br> <br></p>
