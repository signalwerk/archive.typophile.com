    html: <p>Gerald, <br> <br>Sorry to hear that you had import problems with your old PageMaker files on InDesign 1.5. This has not been a common problem as far as I've ever heard. I'd be curious to hear more about what Adobe source told you that your files were simply uneditable. <br> <br>But in any case, that was years ago. InDesign is now several versions later, and the PM import stuff has been improved more than once. InDesign CS PageMaker edition has further improved PM import capabilities (including PM 6.0 files), and offers the familiar PM control bar, among other features. <br> <br>Nobody's forcing you to change, of course. But InDesign is the successor to PageMaker, and offers massive improvements in typography. OpenType goodies aside, the paragraph composer, optical margin alignment (including hanging punctuation) and other refinements make it far and away the best option for fine typography on the computer. <br> <br>I'll tell you what. If you send me one of your problem files, perhaps along with a PDF so I know what it's supposed to look like, I'll try converting it to ID CS and see if there are any troubles. One time offer, not available in stores. <br> <br>Oh, and whoever told you that newer versions of InDesign don't open files from older versions was full of hooey. It is, however, the case that older versions can't open the newer files. <br> <br>Of course, nobody is forcing you to upgrade. You can keep on using PageMaker on whatever OS you're running, and Type 1 fonts. Or use OpenType fonts, you just won't be able to use the extra bells and whistles. <br> <br>Cheers, <br> <br>T</p>
    html_clean: <p>Gerald, <br> <br>Sorry to hear that you had import problems with your old PageMaker files on InDesign 1.5. This has not been a common problem as far as I've ever heard. I'd be curious to hear more about what Adobe source told you that your files were simply uneditable. <br> <br>But in any case, that was years ago. InDesign is now several versions later, and the PM import stuff has been improved more than once. InDesign CS PageMaker edition has further improved PM import capabilities (including PM 6.0 files), and offers the familiar PM control bar, among other features. <br> <br>Nobody's forcing you to change, of course. But InDesign is the successor to PageMaker, and offers massive improvements in typography. OpenType goodies aside, the paragraph composer, optical margin alignment (including hanging punctuation) and other refinements make it far and away the best option for fine typography on the computer. <br> <br>I'll tell you what. If you send me one of your problem files, perhaps along with a PDF so I know what it's supposed to look like, I'll try converting it to ID CS and see if there are any troubles. One time offer, not available in stores. <br> <br>Oh, and whoever told you that newer versions of InDesign don't open files from older versions was full of hooey. It is, however, the case that older versions can't open the newer files. <br> <br>Of course, nobody is forcing you to upgrade. You can keep on using PageMaker on whatever OS you're running, and Type 1 fonts. Or use OpenType fonts, you just won't be able to use the extra bells and whistles. <br> <br>Cheers, <br> <br>T</p>
