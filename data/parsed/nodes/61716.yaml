      <p>I can touch-type all the diacritics that have come standard with Mac keyboards since ’84, but that doesn’t mean I don’t resort to brute-force methods from time to time. For “very unusual” diacritics, including ć, I just looking up the Unicode character and copy and paste it. This method will not work for truly arbitrary combinations (like circumflex on ç or that sort of thing). There are now huge numbers of utilities for locating Unicode characters online.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
