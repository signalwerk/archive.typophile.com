      <p>Michael -- and others -- Below a link to the organizations that are members of the Unicode consortium,</p>
      <p><a href="http://www.unicode.org/consortium/memblogo.html" title="http://www.unicode.org/consortium/memblogo.html">http://www.unicode.org/consortium/memblogo.html</a></p>
      <p>You will notice Apple, Microsoft, Adobe, IBM, Sun, and others.</p>
      <p>Isn't it sad that support of accented characters, a part of the Unicode Standard, isn't (yet) much supported?</p>
      <p>All James wants to do is enter one character with an accent. It looks like the occurrence of this character is one time. He shouldn't need a special keyboard. (There are numerous languages where the isn't a special keyboard available.) If the fonts (from Adobe, from Microsoft) have combining diacritics, he should be able to directly enter the base character and the accent, if the applications program (Microsoft) &amp; operating system (Microsoft, Apple, Sun,) allow/help/don't get in the way.</p>
