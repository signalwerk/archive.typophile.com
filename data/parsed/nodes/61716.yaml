      <p>On the macintosh, I use the IPA-SIL keyboard that can be downloaded from SIL <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=UniIPAKeyboard" rel="nofollow"><strong>IPA Unicode Keyboards</strong></a> (IPA = <a href="http://en.wikipedia.org/wiki/IPA" rel="nofollow">International Phonetic Alphabet</a>). The keyboard is also available for Windows and Linux but I have never tried it on those platforms.</p>
      <p>To type c with a grave accent with the IPA-SIL keyboard, just type c and then SHIFT 4 (c with acute is c SHIFT 2). You can switch fast between the American keyboard and the IPA keyboard by just typing "apple space". </p>
      <p>With Word 2008 for the macintosh, what I just described works fine with the Microsoft Calibri and Cambria fonts but not with Times New Roman; <a href="http://www.sil.org/computing/catalog/show_software_catalog.asp?by=cat&amp;name=Font" rel="nofollow"><strong>SIL fonts</strong></a> Charis and Gentium also have those accents (and others) and what is necessary to position them above the previous character (that always needs to be in the same font).</p>
      <p>Michel</p>
