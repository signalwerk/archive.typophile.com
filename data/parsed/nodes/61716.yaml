    html: |-
      <p>It seems that it will take some time for all the capabilities of Unicode to make it into common use. What's needed involves (a) operating systems, (b) applications program, (c) and fonts.</p>
      <p>I do know that what you want to do is easy enough with Windows Vista, running either Wordpad, Notepad, Open Office 3.01 (free) or MS Word in the newer releases.</p>
      <p>I do not know about Macs, nor have I tested Windows XP -- at least, not lately.</p>
      <p>OK, that's operating systems and applications programs.  The font people have dragged their feet. Fortunately, SIL Charis (free &amp; a pretty good typeface for writing manuscripts) has all the combining diacritics encoded. The combining diacritics really are needed with the Unicode system.</p>
      <p>So, I know the following will work, with Windows Vista, Open Office (&amp; Wordpad &amp; Notepad &amp; some releases of Word), and the font Charis:</p>
      <p>Type a "c." (Make sure the "num lock" is "on.") Now, hold down the "Alt" key, and with it held down, using the number keypad, enter the string 0300 (Unicode for combining grave accent). release the "Alt key."</p>
      <p>The above paragraph is simply one way of directly entering a Unicode character from the keyboard with a Windows program. Likely there is a corresponding way to do so with a Mac. If you're using a Mac, you can test things out as well. It is easier if you can eliminate one of the potential problem areas, so start with a font that has the combining accents completed, and maybe even good *mark* and *mkmk* features, such as Charis.</p>
      <p>In sum, the font Charis is free (search for "download Charis") The Open Office products are free, and can even write off a .doc format. (Search for Open Office). For operating system support &amp; upgrade, you're on your own.</p>
      <p>Good Luck,</p>
      <p>Charles</p>
