      <p>To return to the young fellow mentioned in the first post: Croatian names typically end in <em>-ć</em> (e.g. <em>Jagić</em>, <em>Maretić</em>, <em>Ivšić</em>), i.e. <em>c</em> with an acute (not a grave). There is no such letter as c+grave in Croatian.<br>
      Thomas</p>
