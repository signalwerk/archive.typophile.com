    <p>Fellow typophiles—</p>
    <p>This issue confounds me. I am attempting to type a "c" in Word with a grave accent and the character simply isn't recognized. The type is Times New Roman (and I tried Helvetica Neue for kicks) and to no avail.</p>
    <p>Is this even a recognized character typically? It is the final letter of a last name belonging to a Croatian young man, to whom I am attributing an essay, hence my need.</p>
