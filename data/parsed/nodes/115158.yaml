      <p>ITC Tiffany and <a href="http://www.myfonts.com/fonts/itc/tiffany/" title="http://www.myfonts.com/fonts/itc/tiffany/">http://www.myfonts.com/fonts/itc/tiffany/</a> and <a href="http://www.myfonts.com/fonts/adobe/itc-tiffany/" title="http://www.myfonts.com/fonts/adobe/itc-tiffany/">http://www.myfonts.com/fonts/adobe/itc-tiffany/</a> are about as close a digital fonts go to matching this old metal type. You could expand demi-bold to get a passable match.<br>
      Don</p>
