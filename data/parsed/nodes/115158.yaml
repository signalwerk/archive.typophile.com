    html: |-
      <p>AFAIK metal Ronaldson did not have a black weight. But its dramatic swooping serifs were a big influence on type design. ITC Tiffany is only a recent example. Since this is a US headline, there might be something in Matt McGrew's book.<br>
      Don</p>
