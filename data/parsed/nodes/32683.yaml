    html: <p>Photoshop is a graphics tool, at this stage of web design. I use Photoshop more to make web graphics than anything else. Sometimes those are just photographic images, but a lot of it is also type-based. Photoshop offers several rasterizing methods for type; so it doesn't make sense to me to not include the other type tools there. Since I can't choose those rasterization options on imported EPS files, It's no help to be able to set any glyph in Illustrator. Sometimes I choose a different rasterizing method for different lines of type in the same image. I find it an inappropriate limitation, given the typographic support in the other programs, to not have all the glyphs in OpenType fonts available. Adobe offers some of the most robust OpenType font families, and glyph selection, as part of the other CS apps, seems like a baseline tool.</p>
