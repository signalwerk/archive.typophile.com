    <p>Those of you who have tried the <a href="http://labs.adobe.com/technologies/photoshopcs3/">Adobe Photoshop CS3 Beta</a> have probably noticed that, unlike InDesign and Illustrator, Photoshop does not have a Glyph palette. And it will probably be of no surprise if I say that you won't find such feature in the released version as well.</p>
    <p>As the Photoshop team is planning the future version (the one after CS3), <a href="/node/16062" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Thomas Phinney</a> and I are trying to convince <a href="http://blogs.adobe.com/jnack/">John Nack</a> (Senior Product Manager, Adobe Photoshop), how important a Glyph palette is to Photoshop users. And this is where you all come in: we need your examples and arguments to show John that you need such feature in Photoshop.</p>
    <p>John says that his inbox is already bloated with feature requests, so I believe that what we should do is post our reasons in this thread. Helpful things are testimonies like:</p>
    <p>-- If Photoshop had a Glyph palette, I wouldn't have to open Illustrator just to insert that alternate Z from Zapfino that I need for the visual I'm doing. I haven't updated my old (2 years) computer, so having one more app opened really slows down the whole system;</p>
    <p>-- With a Glyph palette I can easily browse the glyph set of the font(s) I'm using, and insert other glyphs that are not accessible via the OpenType submenu, neither via the operating system's Character Palette (Mac)/Character Map (Windows);</p>
    <p>-- Being able to see the complete glyph set of a feature-rich typeface like Bickham Script or Poetica right there in Photoshop, helps me to be more creative and saves me time;</p>
    <p>-- Without a Glyph palette in Photoshop, I don't have the ability to pre-visualize how a particular glyph will change into when I apply OpenType features, so I have to resort to Illustrator, like in this video, <a href="http://av.adobe.com/russellbrown/OpenTypeSM.mov">http://av.adobe.com/russellbrown/OpenTypeSM.mov</a>  The problem is I don't work seamlessly in Illustrator as I do in Photoshop, so I avoid it as much as possible. I feel that my work would benefit from the retouches in Illustrator, but with the projects' tight deadlines I can't really afford that time.</p>
    <p>Arguments like, "Having a Glyph palette in Photoshop would make all the apps in the suite more consistent" are also valid, however they don't really justify the need for implementing such feature.</p>
    <p>Remember, your input is really invaluable, so please try to give as much as you can. Thanks!</p>
