      <p>I tried offering John a <em>dozen</em> type IDs plus naming my next kid after him (hi, this is my daughter, her name is John), but that was no go.</p>
      <p>Seriously though, it's not that John doesn't think a glyph palette would be useful in Photoshop. But all new features go through the same process: they rank the features and look at how much work they'd take to implement and test, and compare that to how many people they have in the given time frame.</p>
      <p>Now, I'm not intimately familiar with every new feature in Photoshop CS3  - nor, even if I did know all the new features, do I know the user base well enough to judge their importance or demand. But I actually know the InDesign CS3 feature list pretty well. There are tons of things that have been common user requests and are otherwise clearly badly needed. Sure, there are a bunch of things I'd like to see that aren't there yet. But looking at the new features it's very clear indeed that they are paying attention to what users need and ask for. It's just that the number of exciting potential new features always exceeds the available resources by a multiple of several times.</p>
      <p>I'm quite certain it's the same for Photoshop, and I know how hard John works. So comments like <cite>"I hope he knows what is accountability — send him home"</cite> are neither called for nor helpful.</p>
      <p>Cheers,</p>
      <p>T</p>
