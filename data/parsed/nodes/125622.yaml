  html: |-
    <p>Hi typophiles!</p>
    <p>Hoping to post it in the right forum. Unfortunately, I&nbsp;guess, at least some of you can share the pain of proofing the copy for typographical errors.</p>
    <p>That’s why I’m building Typopo, an online tool that wipes out frequent typos in English, Slovak, Czech and Rusyn language.</p>
    <p>Feeling that this tool might be helpful to you, let me share the link where you can try it → <a href="http://typopo.tota.sk/">http://typopo.tota.sk/</a><br>
    (Alternatively, take a&nbsp;look at the feature list at my GitHub account → <a href="https://github.com/surfinzap/typopo">https://github.com/surfinzap/typopo</a>)</p>
    <p>Your feedback on how to make this tool more useful would be much appreciated.</p>
