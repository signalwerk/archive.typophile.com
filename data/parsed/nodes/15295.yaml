    <p>Multi-talented Ukrainian designer and calligrapher. His font <a href="http://typophile.com/node/3823" rel="nofollow">AndrijHand</a> seems to be one of the first posted to <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a>'s <a href="http://typophile.com/forum/1" rel="nofollow">Critique Forums</a>. He has gone on to develop many more fonts based on his own luxurious calligraphic style.<br>
    He founded <a href="http://andrij.com.ua/eng/" rel="nofollow">AndrijType</a></p>
