    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 4.Mar.2008 8.27am </div>
      <p>Germany has a strong heritage of industrial typefaces constructed by engineers utilizing square and circles. DIN Mittelschrift is one very famous example. </p>
    <p></p><div class="imageWrap"><img src="/files/gConstruct_5211.jpg"></div><p></p>
    <p>Since the »Romain du Roi« we know that it is tricky to draw a geometrical typeface. For optical reasons you have to go away from circles and lines with exactly one weight. Therefore the aim was not to construct a typeface but to draw it in a way that appears constructed. As you can see in the picture, the final typeface is very different. </p>
    <p></p><div class="imageWrap"><img src="/files/WasserKonsens_5229.jpg"></div><p></p>
    <p>The design of a typeface is like stage production. Like strongly made up actors, the characters of a typeface must be super-elevated, to be very clear in there role. Particularly in small sizes.</p>
    <p></p><div class="imageWrap"><img src="/files/KonFetten_3867.jpg"></div><p></p>
    <p>Konsens has 9 weights from Light to Ultrabold with italics like most of my other families. In addition to that there a Stencil headline companion. It also has got 9 weights but no italics.</p>
    <p></p><div class="imageWrap"><img src="/files/WasserKonsensSten2_5661.jpg"></div><p></p>
    <p><a href="http://www.hubertjocham.de/item.php/type/sans/Konsens/" title="www.hubertjocham.de/item.php/type/sans/Konsens/">www.hubertjocham.de/item.php/type/sans/Konsens/</a><br>
    <a href="http://www.hubertjocham.de/item.php/type/sans/KonsensSten/" title="www.hubertjocham.de/item.php/type/sans/KonsensSten/">www.hubertjocham.de/item.php/type/sans/KonsensSten/</a></p>
