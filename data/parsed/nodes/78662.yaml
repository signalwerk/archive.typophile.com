    <p>Monotype Imaging Announces Winning Submissions from the Type Directors Club TDC2 2011 and TDC57 Competitions</p>
    <p>Elegy and Palatino Sans Arabic Typefaces and the Fonts in Focus 7 Magazine Among Honorees </p>
    <p>Submissions from Monotype Imaging Inc. (Nasdaq: TYPE) were recognized at the annual TDC2 2011 and TDC57 design competitions held by the Type Directors Club of New York City. Awards of design excellence went to the Elegy™ typeface from Monotype Imaging's ITC® collection, and the Palatino® Sans Arabic design, from the company's Linotype® collection. The newest issue of Monotype Imaging's Fonts in Focus magazine, Fonts in Focus 7, was honored for typographic excellence. </p>
    <p>Monotype Imaging's winning entries will be exhibited worldwide along with others beginning this summer as part of the TDC's traveling exhibitions. The submissions will also be published in "Typography 32, the Annual of the Type Directors Club." </p>
    <p>"The TDC2 competition attracted the most impressive array of type designs to date. The jurors painstakingly analyzed dozens of entries — occasionally aided by the Non-Latin advisory board, coordinated by Maxim Zhukov and including non-Latin script experts from Russia, British Columbia, UK, Japan and the U.S.," said Charles Nix, chairman of the board of the Type Directors Club. </p>
    <p>"It's a great honor to be recognized by one of the world's most prestigious and longstanding series of typographic design competitions," said Doug Shaw, president and chief executive officer at Monotype Imaging. "Our passion for type is strong throughout our company, in addition to typeface design talent. The TDC awards help to endorse these key strengths." </p>
    <p>Elegy<br>
    A Spencerian script, Elegy is a new typeface design by Jim Wasco, who researched the Spencerian form of ornamental penmanship, popular in America between 1850 and 1925. Elegy is also based on the original International Typeface Corporation logo, drawn by the legendary typeface designer, Ed Benguiat. Wasco, senior type designer at Monotype Imaging, undertook the Elegy design project with Benguiat's nod. "I felt strongly that Ed's handlettering of the ITC logo deserved to be captured as a complete typeface," Wasco said. </p>
    <p>As he set out to create an elegant typeface based on Spencerian script models, Wasco maintained some of the spontaneity and flowing attributes of the original logo by Benguiat, which gave Elegy a new, contemporary look. </p>
    <p>Palatino Sans Arabic<br>
    Lebanese typeface designer Nadine Chahine collaborated on Palatino Sans Arabic with German typeface designer Hermann Zapf, who created the Palatino family more than a half century ago. In 2008, Chahine and Zapf received a TDC2 award for Palatino Arabic, a project that first brought the pair together collaboratively. </p>
    <p>"To have the guidance of a type legend is simply beyond words," said Chahine, who designs Arabic typefaces at Monotype Imaging's Linotype subsidiary. "Professor Zapf is still active and passionate about type, and working with him is a great honor." Among Zapf's credits are some of the most widely used and timeless designs in the world, including the Optima® and Zapfino® typefaces, as well as the ITC Zapf Chancery® and Zapf Dingbats® designs. </p>
    <p>Palatino Sans Arabic is a companion to both the Palatino Arabic and the Latin-based Palatino Sans designs. Palatino Sans Arabic has the same metrics and structure as Palatino Arabic but with softer curves and less contrast. Like Palatino Sans, the Arabic version can be used for both text and headlines. "It's a friendly, soft-spoken typeface," Chahine said. </p>
    <p>Fonts in Focus<br>
    Published in German and English, Fonts in Focus is designed to provide informative and eye-catching articles and contributions on typography. The award-winning seventh edition adopts a new and contemporary layout to showcase recently released typefaces, in addition to illustrations and editorial write-ups. Magma Brand Design, a design studio based in Germany, shares in the TDC award for design excellence. "We're committed to producing informative and typographically rich publications such as Fonts in Focus that creative professionals and type lovers will treasure," said Frank Wildenberg, managing director at Linotype GmbH. </p>
    <p>Availability<br>
    The Elegy and Palatino Sans Arabic fonts are available in the cross-platform OpenType® format. Elegy may be licensed and downloaded from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, itcfonts.com and <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>. Palatino Sans Arabic is available from <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>. The print version of Fonts in Focus 7 may be ordered from <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a> or downloaded for free as a PDF. Customers may also contact Monotype Imaging in the U.S. toll-free at 800-424-8973, or in Europe or other parts of the world by calling Linotype at +49 (0) 6172 484-418. Customers may also contact Monotype Imaging at 001 781 970-6020 (U.S.). </p>
    <p>Type Directors Club<br>
    Based in New York City, the Type Directors Club is an international organization founded in 1946 with members that include design professionals, typographic designers and type enthusiasts. This year's TDC2 competition featured 20 typeface design winners from six countries. Nearly 200 typeface design submissions were received from 28 countries. The TDC57 competition, which honored typography in use in various works, including posters, corporate identity, books, media and stationery, awarded 208 selections from 17 countries. Nearly 1,500 submissions were received for TDC57 from 30 countries. </p>
    <p>About Monotype Imaging<br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, digital televisions, set-top boxes, navigation devices, digital cameras, e-book readers and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 13,000 typefaces from the Monotype®, Linotype and ITC typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. ITC, ITC Zapf Chancery and Zapf Dingbats are trademarks of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Elegy and ITC Franklin Gothic are trademarks of International Typeface Corp. and may be registered in certain jurisdictions. Linotype and Zapfino are trademarks of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Palatino, Optima and Helvetica are trademarks of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. OpenType is either a registered trademark or trademark of Microsoft Corp. in the U.S. and/or other countries. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Inc. All rights reserved.</p>
