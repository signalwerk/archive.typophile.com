    html: <p> Tricky question, my guess is you can't. We're mostly quite trustable persons though <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>One solution might be to show it to a smaller number of persons (by email or whatever), minimizing the risk of it getting out. </p>
