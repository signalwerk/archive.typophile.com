    html: <p> I'd like to think that these boards are fairly  <br>widely read. If someone stole your design from  <br>these forums, you'd have a few thousand witnesses  <br>and dates of postings to back you up. (That's not  <br>to say we have resources beyond our sheer good  <br>will to help anyone litigate.) <br> <br>Consider the critique as a way to stake your  <br>claim. </p>
