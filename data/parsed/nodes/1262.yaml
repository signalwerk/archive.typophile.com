  html: <p> Hi, <br> <br>I'm actually working on a new typeface, my design is quite unusual and fresh and I would like to protect it from being stolen before official release. Initially I wanted to get some feedback from you guys during it creation but I am afraid to publish the sketch on the net. <br> <br>How can I protect my design? </p>
