      <p>I assume they were drafted by the architect in his elevation, and executed by stone masons along with the rest of the details.<br>
      Architects were familiar with drafting letters for the descriptive text in their plans, and fitted the style of lettering to the style of the building, so were practised and knowledgeable letterers. If lettering was required to appear on the buildings, they were up to the task. Although the L and M here are a tad wide, and the R too narrow.</p>
      <p>The use of a period is interesting.<br>
      The Wall Street Journal still uses a period in its nameplate.</p>
