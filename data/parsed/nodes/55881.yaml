      <p>Thanks, Nick, it didn’t occur to me that the letters would have been drawn by the architect. This would make a lot of sense—I’ve noticed that similar buildings from one neighborhood and one time period have matching letters. I assumed that the letters were cast or metal, but it probably is because the architect was drawing them all. </p>
      <p>I’ll still talk about it with James Mosely and Paul Shaw, tho.</p>
