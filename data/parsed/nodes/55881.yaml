    <p>I’m interested in architectural letters found on the American (and possibly other) apartment buildings from the 1890s and 1900s. I got used to seeing some really well-formed letters like these down in DC, but in New York I’m finding more variety. Does anybody know where these letters came from?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/viclettrs_4681.jpg"></div><p></p>
