    <p>Hi guys (and girls).</p>
    <p>I'm currently working on the interior graphics of a museum in Belgium that opens September 27. On a window I've set an "In Memoriam" in Plantin MT Pro, which is the font that is used troughout the entire museum.</p>
    <p>Now, this "in memoriam" will be placed in lettering. My printer says that the serifs are to small and the letters might peel off. Can you recommend me a certain font style of Plantin with thicker serifs or a alternative sans serif that fits well with the look of Plantin? I'd rather not use an extra font, but if it's the only way... :)</p>
    <p>Thanks in advance!</p>
    <p>Jeroen Migneaux</p>
