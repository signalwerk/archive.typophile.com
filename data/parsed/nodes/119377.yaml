    html: |-
      <p>Plantin already has pretty chunky serifs--will the text be cut in vinyl and applied to the window, or are you silk screening onto the glass?</p>
      <p>Plantin SemiBold may be a solution.</p>
      <p>As for a sans serif to pair with Plantin, Monocle magazine uses Plantin and Helvetica together:<br>
      <a href="http://fontfeed.com/archives/in-use-plantin-for-monocle/" title="http://fontfeed.com/archives/in-use-plantin-for-monocle/">http://fontfeed.com/archives/in-use-plantin-for-monocle/</a></p>
      <p>But if Helvetica is just too overdone for you, I'd choose something with a tall x-height and a bit narrow (like Plantin), say Avenir or Telefon. I've even seen it paired nicely with Tempo, Frutiger, and Neutraface.</p>
