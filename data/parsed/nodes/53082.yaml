      <p>@John: <em>Sure, and there are people who chain smoke for six decades who don’t get cancer. That doesn’t mean that smoking doesn’t cause cancer, it means that some people are genetically less susceptible to cancer than others.</em></p>
      <p>Ah yes, we're getting into some useful logic here. I want to agree with your argument John, but I can't. I don't think medical science knows enuff about what really causes cancer for the "susceptability" syndrome to be a reliable or knowable factor. More and more evidence has surfaced that numerous kinds of virus are involved in numerous types of cancer, as both generators and pathogens. Probably you are right, but we will find out more as we look further into the nature and mechanisms behind cancer.</p>
      <p><em>It is a red herring to say that second-hand smoke is not proven to cause cancer, as if this implies that second-hand smoke is harmless.</em></p>
      <p>Red herring, yes, I'll pay that one. You make a good point about my line of reasoning. To clarify, I don't mean to imply second hand smoke is harmless. I'm more of the belief it's something we've yet to to fully understand the effects of.</p>
      <p>@Ricky he's so fine: <em>Like John, I don’t buy that either, James. And it doesn’t make much difference, because if you don’t get it from second-hand smoke, you’ll get it from all of the cars and chimneys that surround you.</em></p>
      <p>Yepp. So, why does the mainstream demonize cigarettes and tobacco but not other sources of environmental carcinogens? Doesn't anybody think that's a double standard? Furthermore (instead of saying "that said"), are double standards, an aspect of the dictatorship of reason we live with, really as bad as we make them out to be?</p>
      <p>Q. What happened to Voltaire's secular humanism and freedom of thought?<br>
      A. It got swallowed up by the dictatorship of reason in the West.</p>
      <p>@James Deux: <em>” *Americans* must change America.”</em></p>
      <p>This should have been the realization from the very beginning.</p>
      <p>But your insight is spot on.</p>
      <p>When the world outside the U.S watches your federal elections we're amazed by all the hoopla and ceremonial banners and bunting and carrying on of the campain and national conventions. Political messages and policy seem to get lost in all that. Obama had to have a message to ride on and for supporters to climb aboard.</p>
      <p>That Americans must change for the U.S to change should have been the realization at the start, but employing that as a slogan at the outset would have been letting the cat out of the bag to soon. I believe it is possible tho, that Americans themselves can change their ways and change their wider culture for the better, and I am with you all on that one. I'm supportive, not antagonistic.</p>
      <p>American foreign policy is the area of U.S. politics driven and controlled by the U.S industrial-military machine that must change. Northrop, North American Aviation, Boeing, Lockheed, McDonald Douglas, Colt Arms, the Springfield armory, Ratheon, IBM and other electronics manufactureres, Haliburton etcetera. Too many jobs tied up in munitions, warplane and firearms manufacture, too much investment in the implements used to make war. These are the industries and companies that buy senators and buy political influence to virtually set U.S foreign policy agenda.</p>
      <p>That's just for openers, and of course there is much else in America that could benefit from change.</p>
      <p>@Sii: <em>Well I guess we’ll never know - a few hundred years ago a bunch of Europeans turned up and their brand of “change” kind of messed things up for folks living here.</em></p>
      <p>It's never too late to try something else. Put the mistakes of the colonial era behind you and design a way forward. I think the biggest thing holding back change is the general fear of trying new things. Change isn't a hard thing to do to start off. Living with the changed circumstances is the challenging part</p>
      <p><em>Does anyone know the timing? Maybe Obama stole the idea from Camel, perhaps on a midnight undercover cig run to his local convenience store?</em></p>
