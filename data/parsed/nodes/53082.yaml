      <p><em>There is still no solid proof second hand smoke causes cancer. Personally I know about thirty non-smokers who grew up or lived their entire lives in houses with full time smokers. Not one of them ever contracted cancer. There must be something in that.</em></p>
      <p>Sure, and there are people who chain smoke for six decades who don't get cancer. That doesn't mean that smoking doesn't cause cancer, it means that some people are genetically less susceptible to cancer than others.</p>
      <p>It is a red herring to say that second-hand smoke is not proven to cause cancer, as if this implies that second-hand smoke is harmless. It has been linked fairly conclusively to asthma, bronchitis, pneumonia, otitis media and other diseases in children. It doesn't necessarily 'cause' the disease, but it contributes to susceptibility and is statistically linked to increased occurence. Likewise, it has been linked to increase risk of heart attack. I recommend a search through the Lancet papers related to second-hand smoke.</p>
