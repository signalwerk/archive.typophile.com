      <p><em>Is it shameless capitalization to use a popular typeface in a stereotypical manner?</em></p>
      <p>That's a loaded question. Using a popular typeface in a stereotypical fashion typifies things other than just shameless capitalization. For a moment there I read that as "capitalism". The best answer I can think of is, Top marks are given for mimicry in the ad biz now days, with ads for one brand imitating those of another brand. Looking back at advertising design over the 20th century evidently the principle of mimicry is not new, but there was a time, not so long ago, when better ethics interceded to limit the degree of mimicry.</p>
      <p><em>So product managers and creative directors made sure that each brand had its own creative treatment—and its own typeface, set in a distinctive manner. Am I correct in the observation that this practice is still followed, but to a lesser degree?</em></p>
      <p>Yes, correct. Yes sir. Visible Point of Difference began to take a beating starting in  the early 1990's at the ham-fisted hands of salad boys.<br>
      Joke—What's the opposite of ham-fisted? A. Cheese-fisted. If only the salad boys I'm talking about understood they don't have to use ham in every sandwhich.</p>
      <p>j a m e s</p>
