      <p>I don't know if "Iconic" has become a buzzword for the typophiles of the world so much as it has become a buzzword in general usage in the business and media worlds over the last few years. Having been trained as a painter as well as a designer, the word has a dual meaning for me.</p>
      <p>We're all unfortunate victims of the lexicon of the moment.  Why else would otherwise intelligent people be so enamored of the word "AWESOME?"  For more than half my life the word was reserved for such things as the Grand Canyon or Niagara Falls.  Maybe an apparition of the Virgin Mary or an earthquake.  But never, thankfully, was it used to describe French Fries or haircuts.</p>
      <p>I'm happy to see that this community uses the word sparingly.  And when it comes to our love of type, there are certain faces and talents for whom that "a" word would indeed be used appropriately.</p>
