      <p>uh, wait a sec… Obama and Camel aren't competing brands, are they? </p>
      <p>Personally, I think corporations and advertisers have always seen advantages in both branding to stand out from their competitors and riding competitors' coat tails, if there seemed to be an advantage in doing so. There is certainly a long tradition of referencing current events in one way or another to create a connection beteen a particular zeitgeist and their products. Some people may call that a scandalous co-opting of the positive image and goodwill built up by another brand, and others may call it exploiting an opportunity. It's really not news when it happens. </p>
      <p>Without discussing the health concerns that go with smoking or the promises of hope that go with Mr. Obama, which are not pertinent to a discussion about typographic branding, what get's peoples' ire here is that cigarettes and smoking  is a widely despised practice these days, and with the (quite obvious) co-opting of a piece of Mr. Obama's branding, the owners of the Camel brand are in essence saying that "Camel ciggies, now include hope"*, which is obviously a provocative thing to say to an anti-smoker. However, I don't think it is any more dishonest than other vague &amp; unsupported aspirational promises made by thousands upon thousands of other products, including  politicians.</p>
      <p>*I dunno about you, but suggesting that "Camels now include hope." is less offensive than the cartoon camel of a few years ago that seemed to say, "Hey kids, smoking is FUN." By tyhe way… The illustration looks like some kind of bong diagram. What up wid dat? </p>
      <p>To make a discussion of firearms relevant on this forum, I think you'd 'ave to start off with... "If modern life were a typeface, would guns be exclamation points?" or… Like that. </p>
      <p>-=®=-</p>
