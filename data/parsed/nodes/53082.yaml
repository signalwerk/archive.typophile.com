      <p>Reading this thread reminds me of the Adobe book <a class="freelinking external" href="http://www.alibris.com/search/books/qwork/790950/used/Branding%20with%20Type" rel="nofollow">"Branding with Type,"</a> which among other things contained extensive survey results on the usage of specific typefaces identified with certain industries.  </p>
      <p>At the time Apple was using their custom ITC Garamond condensed (eccch, I know) as were dozens of other computer companies.  Volkswagen's use of their custom Futura (of which I own a copy-Mmm-Tasty) caused many in the auto industry to use it immediately as well.  And Optima and its many humanist cousins appear to be the only typeface you're allowed to use if you're selling cosmetics.</p>
      <p>It's up to designers to decide whether to be sheep and make Gotham so ubiquitous as to lose all its power through improper usage. I've lived through enough trends, watching colleagues hop on the latest faces that I see them coming a mile away and vow never to use them.  I'm pretty sure I know who did this ad, they're here in Philadelphia.  And they've never exactly been known for their originality.</p>
      <p>Gotham's a beautiful face, no doubt about it.  And versatile as hell in the right hands.  It's been around since 2000, but its first exposure to the public at large as well as designers who weren't paying attention occurred with Obama. The word "CHANGE" set in that face has become as iconic as identifying Neo Contact forever with the word "Marlboro." </p>
      <p>Patrick </p>
