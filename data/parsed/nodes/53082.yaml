      <p>Ah yes, we're getting into some useful logic here. I want to agree with your argument John, but I can't. I don't think medical science knows enuff about what really causes cancer for the "susceptability" syndrome to be a reliable or knowable factor. More and more evidence has surfaced that numerous kinds of virus are involved in numerous types of cancer, as both generators and pathogens. Probably you are right, but we will find out more as we look further into the nature and mechanisms behind cancer.</p>
