    html: |-
      <p>In answer to your question about how the lettering was done, the simple answer is yes, each title card was done as a one off piece of art. That's the way all display lettering was done when it was done by hand. The point is that there were people who did this for a living -- they were lettering artists, and they were very good at it. Many of today's font designers also got started doing lettering by hand, but the computer gave them a new tool for doing this job, and exactly duplicating each letter. Before computers, film types were made by photographing hand-drawn letters. Before that engravers made the masters for metal type from the hand-drawn lettering of the designer. Before that artists drew all the letters by hand.</p>
      <p>There are others here who can probably speak from experience, but I would expect that each artist made himself a set of lettering master alphabets for each lettering style they used. Probably many were copied from existing metal typefaces, or at least influenced by them, but I think it's fair to presume that some of these alphabets were essentially original designs by these artists.</p>
      <p>You can see the sample of Munder Venzian I have scanned <a href="http://bowfinprintworks.com/ID_Sample_Pages/MunderVenezian.html" rel="nofollow">here</a>.</p>
      <p>- Mike Yanega</p>
