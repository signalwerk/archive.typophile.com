      <p>Are you under the impression that these are all showing the same typeface?  Each one of your samples has something different in it, although the same lettering appears as one of the typefaces in the last two samples. Including the first sample, which was 'Irvin', you have about 8 different typefaces in your samples. Is there a particular one you want to try to identify a similar font for? </p>
      <p>The assumption that you are making that these all must be based on a 'font' is not necessarily valid. As Tiffany said, those are all hand-lettered. Some of the hand-lettering could be original styles, and not copied from a metal typeface. The one with the strongly curved lower case 'y' is an example of something that may have been a style of that artist, and not a 'real' (existing) typeface at all. Even if there were a metal type that some of these were based on, they may not all have been digitized, so there might be no (digital) font like it at all.</p>
      <p>Just something to think about.</p>
      <p>- Mike Yanega</p>
