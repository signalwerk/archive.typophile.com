      <p>Just to show that I can be at least as obsessed about these 'quests' as the next person, I went through Mac McGrew's book 'American Metal Typefaces of the Twentieth Century' page by page looking for something that might resemble the last sample in your series, which I will call 'Myrna' thanks to it's distinctive 'y'. </p>
      <p>There was only one 'y' that was very close, and that was in the 'ty' ligature for 'Announcement Roman', done in 1916 by Morris Fuller Benton. That was almost its only resemblance to 'Myrna'. It seems the sweepingly curved 'y' was not very common in Twentieth Century metal type.</p>
      <p>Secondarily I looked for the odd 'a', which has no serif on the arch, and looks like it is going to tip over to the left. I couldn't find anything very close, although Pencraft and Packard had a little of that feeling, with a sort of blob serif that curls back into the letter. One other somewhat similar 'a' I will mention in a moment.</p>
      <p>While I was looking for these other specific letters I also was looking for typefaces that gave a similar 'feel' to 'Myrna', and here is where Goudy comes into it. For one thing Goudy's types often look like hand-lettering that has been cast in metal. For another, he often favors the stepped W, although I'm not sure we have this in the 'Myrna' lettering (it shows up in your other samples over and over though). In particular <a href="http://www.myfonts.com/fonts/lanston/ltc-kennerley/regular/charmap.html" rel="nofollow">'Kennerly Oldstyle'</a> (I've linked to the Lanston version of Kennerley) has the Venetian 'e' and an 'a' that looks like it's tipping over, although it has a straight serif on the arch. Certainly it was around well before this movie was made in 1931. However, it's 'y' is barely curved. <a href="http://www.myfonts.com/fonts/redrooster/goudy-38-rr/" rel="nofollow">'Goudy 38'</a>, done in 1908, also has many of these features and has a more curved 'y'. The R and K are less similar, though.</p>
      <p>The typeface that might have been the closest overall also has a Goudy connection. Robert Wiebking was an engraver of Goudy's designs since 1911, and in 1922 he released a design of his own called 'Munder Venezian'. It has the Venetian 'e', a stepped W, a K with the arms meeting below the midpoint on the stem (barely), an 'a' with no serif that leans ever-so-slightly leftward, and a somewhat sweepingly curved 'y', though not nearly as much as in 'Myrna'. (I can post a scan on a web page in a few minutes, but my old Mac cannot post into the thread. Grrrr!)</p>
      <p>As far as I know, 'Munder Venezian' has never been digitized.</p>
      <p>  - Mike Yanega</p>
