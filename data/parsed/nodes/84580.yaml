      <p>Did someone say spunk?<br>
      You could try my <a href="http://new.myfonts.com/fonts/shinn/sense/light/">Sense</a>. It's tightly fitted with a big x-height, so will set a strong text block to hold its own against Turnpike.<br>
      Being slightly condensed, it will contrast in that respect with the wide Turnpike. And the reductive Futura-plan l.c. letter shapes are somewhat in harmony with Turnpike. Sorry, no small caps, but there are alternate figure styles.</p>
