      <p>Here is some more Mercator.</p>
      <p><a href="http://flickr.com/photos/42972432@N00/431495932" title="http://flickr.com/photos/42972432@N00/431495932">http://flickr.com/photos/42972432@N00/431495932</a></p>
      <p>This is a good thread, this typeface seems quite rare so I am pleased to see high quality images/work here.</p>
      <p>I think Nick is correct in saying that there has been a steady development of the grotesque, almost by the decade.<br>
      I also agree with his idea that if you are interested in a specific genre, you become very attuned to it's presence which might alter your perception of it's popularity. I probably 'sense' the same trend you are talking about, though I am wary that I am simply looking for evidence of it because that is what interests me - finding this thread for example. Maybe it is very hard to assert any kind of trend in a pluralistic environment.</p>
      <p>That said, I am always pleased to see work in this genre, revivals and interpretations - I think it is important to distinguish. There probably is some room in this genre more so than humanist sans-serifs for example which most people (I assume) would agree have seen a lot of recent interest - maybe this does explain a small trend.</p>
      <p>I'm not sure that economics offers a complete explanation of said trend. A lot of revival work is motivated by academics!</p>
