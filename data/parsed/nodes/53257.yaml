      <p>I found a 24 page specimen refering the Mercator:<br>
      <a href="http://www.bleisetzer.de/cms/front_content.php?idcat=69&amp;rubrik=&amp;unterrubrik=&amp;maxday_in=20091103&amp;article_id=2101" title="http://www.bleisetzer.de/cms/front_content.php?idcat=69&amp;rubrik=&amp;unterrubrik=&amp;maxday_in=20091103&amp;article_id=2101">http://www.bleisetzer.de/cms/front_content.php?idcat=69&amp;rubrik=&amp;unterrub...</a></p>
      <p>It shows Mercator:<br>
      normal, fett, kursiv, kursiv fett, kursiv schmalfett, mager, schmalmager</p>
      <p>Regular, bold, italic, bold italic, condensed bold italic, light, condensed regular.</p>
      <p>Mercator was Netherland's answer to the new and modern Grotesk in West Europe between 1957 and 1965, do you think, its correct? </p>
      <p>Before 1957 there was Akzidenz-Grotesk - okay, and Futura, but this was was an old-fashioned Grotesk. 1957 Bauersche started with Folio-Grotesk. 1958 Mercator came up. But after Helvetica was established in the market after 1961-1963, the figt was over. </p>
      <p>Do you agree?</p>
      <p>Georg<br>
