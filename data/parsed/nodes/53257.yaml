      <p>Unica is nice, of which I have so far reworked a lowercase. I have always liked Mercator and Forma (1968) which is a very rare beast indeed.</p>
      <p>My desire to work on a variant of an original font is that I am unsatisfied with the original. If I like a font, I would expect the original design to be close to what I would consider correct, but can never quite be there 100 percent. There is always something that bugs me or that doesn't sit quite right. And once you start working on a design and it comes under more scrutiny, the process itself will throw up more things to try and problems to be solved.</p>
      <p>It seems to me that many of the classic grotesks talked about here have a broad usage capability so having a specific purpose like the identity for the Gerrit Rietveld Academy seems a very valid reason to re-look at some of these masters and hone them.</p>
      <p>_________________________________<br>
      Michael Hernan</p>
