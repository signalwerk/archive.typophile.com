      <p>Of all the classic grotesques and neo-grotesques shown in Jaspert/Berry/Johnson's Encyclopaedia and Rookledge's Typefinder, I think Mercator is my favorite.  The forms of the C, R and S are much more attractive than in either Helvetica or Univers, in my opinion, as are the numerals, and I like the proportions and spacing.  As the icing on the cake, Mercator has a wonderful Q design unlike that of any other typeface I have seen.  I find it very simple and beautiful, and am surprised nobody has copied this Q idea in any newer sans (though Puyfoulhoux's Q in Alinea Sans is similar).  The Univers Q always looks like a mistake to me, and most sans Q's are boring, but Mercator's is lovely.</p>
      <p>Is a revived offering, as mentioned by folks above, likely to make commercial headway anytime soon?  People keep trying to create alternatives to Helvetica, to solve its quirky problems and to coax users away from its domination; it seems to me that a great choice might be right there in the books, that other late-50's design, Mercator.</p><div class="imageWrap"><img src="http://typophile.com/files/QRS_4053.JPG"></div><p></p>
