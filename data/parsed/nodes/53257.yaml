      <p>Laurenz Brunner (whose previous Akkurat is like a modern reimagining of Mercator anyway) has recently made a very nice proper Mercator revival, too; in the book it was used it was credited as <em>Mercator, Dick Dooijes, Lettergieterij Amsterdam, 1959 / Laurenz Brunner, Lineto.com, 2008</em> or somesuch. It is not available from the Lineto.com website, though, potentially because Linotype has once acquired the rights of the Lettergieterij Amsterdam from the Tetterode company.</p>
      <p>With colleagues I also took a stab at it once. We made a modern Grotesk that shares some of the nice characteristics of Mercator.During that process I've come to see that Mercator <em>isn't actually that good a typeface</em>, and its many flaws get in the way of the text. All "real" revivals look a bit amateurish in my opinion, and that's because Mercator itself is a bit amateurish. And thoroughly adorable.</p>
      <p>--K</p>
