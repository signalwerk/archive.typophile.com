      <p>It is true that the font is known as a sort of "Dutch Helvetica".<br>
      Supervised by S.H. De Roos, Dooijes had to make in 1929 the working drawings of Nobel, a revision of Berthold Grotesk to bring it more in line with Futura.</p>
      <p>Dick Dooijes, wrote his autobiography titled " Mijn leven met letters" ("My life with letters", Amsterdam 1991) which is not yet translated in english.</p>
