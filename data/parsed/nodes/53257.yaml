      <p>Thank you -- Atlas is interesting, and key letters such as the C and Q are close, but not quite the same.  I still find the original Mercator more attractive.  I just love love love that Mercator Q -- it's like driving a track around and around, and then at some point you make a smooth, elegant exit.</p>
      <p>To Stephen's comment above, I must say I do like NHG better in bold (and the bolder Helvetica weights also), but lighter weights are more disappointing.  The regular S is beaten by Mercator's in my opinion, and so is the regular C, which I always thought ugly in Helvetica (barely less so in NHG).</p>
