      <p>Dear latierrasemueve</p>
      <p>I am studying at the Type]Media course in Den Haag, where I am currently doing a revival of the Mercator.<br>
      Because the archives of Typefoundry Amsterdam (Lettergieterij 'Amsterdam' voorheen N. Tetterode, 1851-1988) are now kept at the Library of the University in Amsterdam (<a href="http://www.uba.uva.nl/special_collections/overview.cfm" title="http://www.uba.uva.nl/special_collections/overview.cfm">http://www.uba.uva.nl/special_collections/overview.cfm</a>), I was lucky to have access to the original material let by Dick Dooijes. I attach some pictures of two of the first type specimens and the final sketch of the "a"</p>
