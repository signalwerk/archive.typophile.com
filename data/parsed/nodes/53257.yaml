    <p>Hi.<br>
    I’m looking for information about <a href="/wiki/Mercator" class="freelinking" rel="nofollow">Mercator</a>, a sanserif typeface by <a href="/wiki/Dick%20Dooijes" class="freelinking" rel="nofollow">Dick Dooijes</a> and <a href="/wiki/G.%20W.%20Ovink" class="freelinking" rel="nofollow">G. W. Ovink</a> designed in <a href="/wiki/1959" class="freelinking" rel="nofollow">1959</a> at the <a href="/wiki/Amsterdam%20Type%20Foundry" class="freelinking" rel="nofollow">Amsterdam Type Foundry</a> .Its considered a version of <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a>/<a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a>, a rational holland response to the model of german/swiss modernity. I just found a reference in"<a href="/wiki/Dutch%20Type" class="freelinking" rel="nofollow">Dutch Type</a>"by <a href="/wiki/Jan%20Middendorp" class="freelinking" rel="nofollow">Jan Middendorp</a>, but I suspect that no exists a digital version.</p>
    <p>Does anyone have information about this typeface? images? typespecimen?</p>
    <p>thanks ¡¡</p>
