      <p>Thank you Hubert. What a big surprise¡¡<br>
      My name is Marcos, I am a professor of graphic<br>
      design in the University of Vigo in Spain, and I am working on my<br>
      doctoral thesis. I am researching the revival of neo-grotesque<br>
      typefaces in the last decade. I found several typefaces in the last<br>
      decade like Akkurat by Laurenz Brunner, FF Bau and Graphik by<br>
      Christian Swchartz inspired by revivals of German typefaces in the<br>
      19th century. In other cases the alternatives to Helvetica and Univers<br>
      like Recta by Aldo Novarese and Mercator by Dooijes created in the<br>
      Mid-Century, inspired several revivals as well as your Mercator.<br>
      Unfortunatelly there is not much information available on the original<br>
      Mercator, and it surprised me a lot to find a digital version. So I was wondering if you can<br>
      send me information (images, texts, sketches, typespecimen…) on the<br>
      process that  has followed in the revival of Mercator. If you<br>
      help me I'll always be gratefull to her. Of course I promise to<br>
      mention your work in my research. Can you send me your email?</p>
      <p>I just found other revival of Mercator. The designer Daniella Spinat <a href="http://www.daniellaspinat.com" title="www.daniellaspinat.com">www.daniellaspinat.com</a> creates Mercator Roman.</p>
      <p>Finally, I would like to know your opinion about the revivals in<br>
      typography. Why do you think a lot of typographers are re-designing<br>
      old sanserif typefaces?</p>
      <p>Thank you¡¡¡</p>
