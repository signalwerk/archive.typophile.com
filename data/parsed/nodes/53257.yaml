      <p>This is a very interesting discussion, with some very fine insights—mostly based on some very fine distinctions between and among some very thoughtful type designs. But, who is right and who is wrong about those fine distinctions boils down to which oenophile is right about which fruit precisely describes the top note in a fine wine. It all boils down to a matter of opinion. So what: pay attention and you'll learn something.</p>
      <p>However, one aspect of the discussion does not make sense. If you're looking for something truly unique—which is kinda OTT, since “unique” is like “pregnant" in its all-or-nothingness—it will be so for only so long. Which is to say, it will be unique up the time that until other folks looking for something unique learn from your discovery. In which case, more and more people who are convinced that “unique” means buying all the same stuff the cool people buy—in other words, Apple’s whoel marketing strategy—the net result is, what was once unique is no longer so, and you have to start out on your Grail quest all over again. Still: it's the journey, not the destination, right? Unless you actually have to be somewhere at a specific time on a specific date. THEN, it's the destination.</p>
      <p>If, perchance, you have a hard time making sense out of what I just said, join the club.</p>
