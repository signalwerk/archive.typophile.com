      <p><em>Why do you think a lot of typographers </em>[sic]<em> are re-designing old sanserif typefaces?</em></p>
      <p>For the same reasons that we (type designers) are always re-hashing every cliché in the book.<br>
      Specifically, typographers continue to use them.<br>
      That provides the economic incentive.<br>
      Also, there is technological change, a constant in the graphics industry.<br>
      Adapting older forms to new media presents creative challenges and opportunities.<br>
      That provides the aesthetic imperatives.</p>
      <p>While it's true that there have been many typefaces in the grotesque genre designed recently (a sans-centric era), I don't think this is historically significant. The grotesque genre has been constantly available since the 1830s, with old staples being refitted, and new additions. Recently the genres of geometric and humanist sans have also been well populated--more so, I would say, than the grotesque, where the old staples seem most entrenched. </p>
      <p>Have the type designers responsible for recent grotesques also reworked old serif types? I would think so, I know I have.</p>
      <p>If you want to prove this is a significant phenomenon, you will need statistics to convince me, because otherwise, the field is so large that's it's very easy to pick and choose examples to corroborate one's subjective preconceptions about what's fashionable--which are always subject to recency. In other words, if you are interested in modernist design and the grotesque, you will see it everywhere.</p>
      <p>My preconception is that genre specialists (like Ale Paul) are the minority in the type design business.<br>
      In the digital era, now that so many independent foundries are established, most type designers have "their" old-style serif face, their didone, their geometric sans, their grotesque, their script. Every foundry a department store, not a boutique!</p>
      <p>Of course, this varies by market, but in as much as the commissioned market in newspaper and magazine types requires all genres (but few scripts), so does the retail font market (but heavy on the scripts).</p>
