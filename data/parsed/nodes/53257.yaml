      <p>FF Schulbuch by Just Van Rosum (1996) is a revival of AG Schoolbook y Günter Gerhard Lange.<br>
      Effra by Jonas Shudel (Dalton Maag) is a revival of Caslon, the first sanserif (1816), included lowercases.<br>
      Another one: ARS Maquette by Agnus Shammal, National Grotesk by Kris Sowersby, Number two by Martha Stutteregger.</p>
