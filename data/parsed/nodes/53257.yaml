      <p>Yes, it's correct – I have a digital version of Mercator. I discovered the typeface when I first moved to Amsterdam in 2004, in the letter-press workshop of the Gerrit Rietveld Academy. The designer Dick Dooijes, in fact was a former director of the Rietveld Academy and is responsible for the Lettering on the facade of the iconic building. </p>
      <p>The typeface Akkurat was already completed when I first encountered Mercator but I must admit it I was surprised myself to see that it shares some attributes. I've digitised Mercator during my time at the Rietveld and have used it since for the publication "Adviezen 2009 – 2012" by the Amsterdamse Kunstraad and occasionally for Rietveld related communication. (See for example <a href="http://www.rietveldforrietveld.org" title="www.rietveldforrietveld.org">www.rietveldforrietveld.org</a>). Alex Shoukas, a former student of mine, has done a great job with his design for the Rietveld school identity and has used the typeface in a sensible way (along with an clever colour-scheme, sampling Gerrit Rietveld's interior colour palette). Big up's again Alex!</p>
      <p>I've always believed that the typeface should somehow remain close to the academy and it's source, which is why I've hesitated to publish the font, but we're currently considering different options for Lineto.com.</p>
      <p>Drop me a line if anymore questions,<br>
      Laurenz Brunner</p>
