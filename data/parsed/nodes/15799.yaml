    <p>Hello all,</p>
    <p>I have been a lurker on these forums for a while now. Its a great ressource for everybody involved in type. My name is David Pache, Im a multimedia designer in Switzerland. Its time I get my company, Dache, off the ground. I do identities, newmedia, illustrations and webdesign. After months and months of research (finding your own logo is one of the hardest things to do) I beleave I have found it.</p>
    <p>I created the name that goes with my logo using the same shapes and dimensions. I would really like some crits and comments from you if you would be so kind. Id appreciate it.</p>
    <p>Thanks.</p>
    <p>Regards,<br>
    David Pache</p>
    <p><a href="http://www.dache.ch" title="www.dache.ch">www.dache.ch</a></p>
