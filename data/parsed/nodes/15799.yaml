    html: <p>David, here are my comments... I think the icon is appealing, but people will inevitably ask "what does it mean". This is a problem, because logos shouldn't explain, but identify. With generic shapes like this the more likely it is to remind someone of something they've seen before. The icon will have different meanings to different people, and some may have a negative reaction to it, sperm, egg, etc. Personally I don't think it is strong enough or distinctive enough to stand alone and your application of it, and use of type, will make all the difference. This is a piece of your overall identity, and once you have some of the other "pieces" in place you'll be better able to judge whether this is working or not. Best of luck, it is always hardest to do your own identity. Mine has been "coming soon" for 5 years!</p>
