    html: |-
      <p>The mark is probably doing what you want: it looks contemporary and kind of technology-ish, it's dynamic, it's familiar but not completely so, etc. However, if you want to really make an impact in people's minds, this isn't the mark for you. No one's going to say: "Remember the guy with the grey and orange logo? The one that looks kind of like Quark's?" Your mark reminds me of other things, rather than sparking something unique in my mind. However, having a site of content up for people to associate with your logo will help overcome that. </p>
      <p>Again, the logo isn't necessarily wrong or bad (it fits some of your goals, is pretty well crafted, and has a consistent visual theme), but I just don't think it's giving you the mileage you deserve from a personal logo. It feels too 'already seen it' to me. If you're going to take the time and effort to design a mark, and not just a nice logotype, then you should probably push it past this into something even more unique.</p>
      <p>As for the type forms, I'd like to see some larger examples of the characters. The 'e' and the curve-to-straight transitions on the 'd' don't look smooth enough to me, but that may just be the anti-aliasing at that size. Also, I agree with bj's assessment. The type feels too thin next to the mark. Perhaps its stroke weight should match the outer rule, rather than the inner one.</p>
    html_clean: |-
