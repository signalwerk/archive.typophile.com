    html: |-
      <p>I really like your new design... I'm a sucker for the Swiss look. Naturally, I'd say Helvetica (but I know I'm going to take flack for that) it would just sit so nicely; the graphic mark is interesting, so I'd look for a typeface that doesn't compete for attention with it - hence I'm not too keen on the custom typeface. I know you might think that Helvetica would be a cliché... but I think it's made for your project.</p>
      <p>I think that the type and the logo need to balance up more; the logo is solid and compact, I think a typeface that reflects that characteristic would work really well, if you decide against Helvetica. I'm unsure about Frutiger because the logo is very geometric, to me the curves of the Frutiger typeface stand out.</p>
      <p>That's my 2 pence!</p>
      <p>Si</p>
