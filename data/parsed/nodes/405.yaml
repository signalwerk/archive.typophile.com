    html: <p>&gt; what functional effects, if any did they have in mind? <br> <br>First of all, there's no "they". It's just Fleischman. And nobody before him or since has had the balls to do what he did (that I've seen). <br> <br>Second, I'm no Fleischman expert - in fact the font in that sample (#65 in the Enschede inventory, and the most focused expression of his particular "style") was brought to my attention by Andy Crewdson. A number of people have made Fleischman revivals, but none of them have dared to incorporate his <i>structural</i> innovations. Even the most daring interpretations have restricted themselves to superficial aesthetic funkiness - that misses the whole point (except as yet another source to milk) in my mind. <br> <br>Now, Fleischman was too far in the past to have benefited from the findings of Javal concerning how we read (and certainly not those of Bouma), so he couldn't have known any of the empirical things we know today. On the other hand, he could very well have been smart enough to figure things out -at least on a qualitative level- on his own. It really doesn't take much brains to realize that information arises from contrast, and the part of the lc "d" for example that conveys the most information is the ascender - for that reason you would make the body smaller (as he has). And you might give the "o" a different stress. And you might make your head serifs larger than the foot serifs. Things like that. <br> <br>But of course I can't be too sure about what's in the head of a man who worked three centuries ago... <br> <br>hhp <br></p>
