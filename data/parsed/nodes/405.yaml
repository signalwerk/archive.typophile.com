    date_raw: 2 Jun 2003 — 3:08pm
    date: 2003-06-02T15:08:00
    votes: null
    html: <p>Make sure you bring at least one guy from the remaining 90% of reading researchers who would disagree heartily. BTW, this would include MS's own Bill Hill, who [re]invented ClearType based on the bouma model. Note how small Berling's x-height is, for example. But really, if you want a [non-retired] guy who really knows his stuff, try to get O'Reagan. I have to say that giving only the minority view to ATypI attendees does a deep disservice to the craft. The last thing we need now is a return to obese x-heights! <br> <br>If Larson is basing his conclusions on measurements concerning reading on-screen, then I would simply point out that speeds are much lower there, exactly because it's a lot less immersive! It's like that joke where the researcher concludes that when you cut off somebody's legs, he loses his sense of hearing, because he no longer obeys the "walk" command... But maybe Larson's view is currently convenient for MS...  :-/ <br> <br>Although I've done no emprical research myself, the truck-load of research that I've read over the past five years leaves no real credibility for the "letter-compiling" model. Sorry. <br> <br>hhp <br></p>
  - id: 2528
