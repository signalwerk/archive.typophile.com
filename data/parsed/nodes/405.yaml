    date: 2003-06-07T12:23:00
    votes: null
    html: "<p>gn <br> <br>Significant changes in technology tend to allow for different \"creative\" approaches. If the Linotype technology restricted the ability to set characters tightly and the photofilm technology of the 60s, 70s, and 80s allowed one to set extremely tight; these approaches need to be understood as historical developments and not taken out of context. Digital technology follows a different path and yields a different aesthetic. If work from the 70s appears \"fresh and exciting today\" that is simply because digital technology allows us to mine the past. This is less a retro thing than the result of technological change; we've seen these before: with the introduction of wood type and the changing of the way type foundries marketed their wares in the nineteenth century, with the introduction of machine composition and the revival movement in the early twentieth century, with photofilm at mid-century.... typefaces from different times and different places proffered up together. Part of the confusion here about Caslon is that the various permutations of it are being taken out of historical context. You really can't qualitatively compare a letterpress designed typeface and a digitally designed typeface, for instance, without a consideration of how they were to be used or are to be used. </p>"
