    html: <p>&gt; 'close but not touching'  <br> <br>&gt;Which was the second worse thing about the 70s <br> <br>You must be joking Hrant! <br> <br>There was some great  work done by Herb Lubalin, Seymour Chwast and others in the 70s employing 'close but not touching'  that still looks fresh and exciting today. <br>Many times they touched and overlapped just for good measure. <br> <br>I feel there was a more creative approach taken to headlines in the 70s, than what is being composed on computers today. <br> <br>gn</p>
