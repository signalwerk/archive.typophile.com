    date: 2003-06-16T06:10:00
    votes: null
    html: <p>&gt;Every character has a bit of slight alteration to it. No cut and paste technique available then I guess.  <br> <br>I also observed this in my scan of metal Linotype Caslon Oldface. I think this is unquestionably one of the factors in the different look of metal and digital.  <br> <br>I think there is some valid analogy here to a tune in music. I read or heard somewhere that music has to be something like 50% repetition and 50% variation. (I may have the percentages wrong.) The idea is that without the repetition, there is just a string of notes, and no tune. With too much repetition, it becomes boring like a TV jingle.  <br> <br>I think that digital type - and you interestingly identify an source in 'cut and paste' - may have become too repetitive. <br> <br>The challenge will be to have the greater variation and still keep the unity and balance of the design. </p>
