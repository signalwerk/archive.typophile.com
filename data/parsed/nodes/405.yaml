    date: 2003-06-08T16:01:00
    votes: null
    html: <p>William <br> <br>To some extent you are encountering both. Each time you pull a print you are taking ink off the form but not all of it. Increased impression beyond what is adequate for the inking of the form, incorrect roller height adjustment, natural variability in ink charging, accumulation of ink deposit on rollers and type, all contribute to the problem. Differring paper surfaces will contribute widely to the problem as well. <br> <br>Fine printers might clean the type form of accumulated ink fairly regularly during an edition run but this would be a rare occurrence in commercial work. Unattended, the problem will increase during the run. Since the ink is quite viscous it will draw other ink to it, so any ink that begins to accumulate outside the definition (outline) of the letterform will increase. Sometimes this ink is being pushed there by roller action, other times by the incorrect application of ink by the operator (too much ink for the form) or a combination of both.  The ink is clinging not only to the edge of letterform but also is drooping somewhat down the bevel. Once this happens there is little recourse except to clean it off. Though metal typefaces often have ink drains built into the bevel, this would not really help that much with sloppy presswork. <br> <br>Specifically, if the rollers are incorrectly low they will push down too hard on the type and add ink to the outline but this might not be uniform as it would have to do with the relative weight of the letterform (serifs might take the brunt of it), the actual configuration of the form (the lone edges of longer lines or isolated words might be hit harder), as well as the rolling direction of the rollers (vertical vs horizontal movement causing a distorted accumulation). <br> <br>Did this address your question? <br></p>
