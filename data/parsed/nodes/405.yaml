    date: 2003-06-02T15:25:00
    votes: null
    html: <p>Kevin Larson was hired by Bill Hill, so I would be very surprised to find their views so at odds as you suggest. <br> <br>I think you are, typically, reacting too quickly to a <i>blurb</i> for Larson's presentation. Why not wait until you actually know and understand what he is going to present and have seen the evidence on which he is basing his conclusions? I suspect, even in reading his blurb, you are probably missing the subtlety implied in what he says. It seems to me that he is looking at the question 'How do we recognise words?' Which is not the same thing as questioning <i>whether</i> we recognise words and groups of letters as the primary units of reading. He is investigating how we recognise those primary units and his evidence suggests that it is not by the <i>outline</i> of those units but by their components. I don't know any more than you do what the details of this presentation will be, so why don't we wait and see? I simply brought the presentation to your attention because it is relevant to the discussion that has evolved in this thread. I'll be perfectly happy to discuss it in detail <i>after I've heard it</i>. One thing I'm pretty sure of though is that Larson is not advocating a return to massive x-heights.</p>
