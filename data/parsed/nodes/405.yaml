    html: "<p>&gt; do you think that in text size, 10-12 point, the ideal change in spacing is sufficiently non-linear <br> <br>I think there's a difference in optimal letterspacing between 10 and 12, but you could fudge an average in that range any few would mind. <br> <br>BTW, InDesign's optical spacing algorithm is bi-linear: no change below 4 point, a straight line between 4 and 12, a separate straight line between 12 and 72, and then no change above that.  <br> <br>hhp <br></p>"
  - id: 2540
