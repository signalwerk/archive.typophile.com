    html: <p>Just as it makes the manufacture of fonts much easier on the whole, digital design is a particular facilitator of copy-paste modularity. But whether in metal or bezier, this is a Bad Thing, at least in the realm of text faces. Literal modularity is anathema to readability. <br> <br>hhp <br></p>
