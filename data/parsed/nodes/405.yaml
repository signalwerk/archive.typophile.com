    html: "<p>Hrant writes, 'In the 1970s and 80s, Bouma clarified the ways in which we generally read word-shapes (or actually, letter-clusters), as opposed to complining words from recognized letters.' <br> <br>In light of which, this session at the upcoming <a href=\"http://www.atypi.org/\">ATypI</a> conference will likely be of interest: <br> <br><i>Kevin Larson. </i>The psychology of word recognition.<i> <br>There is a misperception by some in the typographic community that words are recognized by the outline that a word makes.  Kevin Larson presents evidence, much of it from detailed measurements of eye movements while reading, demonstrating that we don</i></p>"
