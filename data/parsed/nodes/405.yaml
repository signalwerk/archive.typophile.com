    html: <p>&gt;lack the character of metal type. <br>Thanks, that confirms my suspicion that there is a design issue here, not just different printing methods. I agree that ACaslon is excellent, but it just doesn't have the spirit of the metal. <br> <br>&gt;variation on the x height due to sizing changes or baseline shifts <br>There seem to be both mechanical and design issues going on. When I get it figured out, I might try to do a trial face with it.  <br> <br>Looking at laser printouts of the PDFs of Founders Caslon 12 from Fontexplorer.com, it (at 12/14)does capture the 'softness' of the metal, but I don't think gets the same overall effect.  <br> <br>&gt;most digital type seems a bit tight <br>Ah ha! My unease with something in Minion (pre-open type version) was what brought me to post a question at this site. Now I'm thinking that the problem might be slightly too-tight spacing. But I'm wondering about this in general with digital type. I remember that when photo type came in, my late Uncle J. Ben Lieberman, author of 'Types of Typefaces' (mentioned above) hated the 'close but not touching' fashion that had become possible, and which almost all ads used. He thought that excessive tightness was messing up the shapes of the words and readability. <br> <br>Thank you Gerald for your very helpful comments!  <br>    <br></p>
