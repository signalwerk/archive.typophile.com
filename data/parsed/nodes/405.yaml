    votes: null
    html: <p>William <br> <br>Adobe would have attempted more harmony, less contrast due to the many variabilities in digital output devices. Linotype only had to be concerned with their own linecasting machine. I've used Adobe Caslon letterpress and it worked out well, but it just seemed to lack the character of metal type. <br> <br>Is the Linotype variation on the x height due to sizing changes or baseline shifts? The latter were quite characteristic of smaller text sizes in machine composition, both Linotype and Monotype. Never did find out the rationale for this, whether it is a concern for readability or a technical situation. <br> <br>There would have been a natural restriction as to how tight a Linotype could space due to the natural boundary of the metal matrix. Adobe didn't have this restriction; most digital type seems a bit tight. Problematic when you go to letterpress with it as you risk "ink bridges" (between very close characters) developing during the editioning.</p>
