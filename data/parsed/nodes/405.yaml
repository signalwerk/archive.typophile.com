    html: <p>William <br> <br>If you are looking at the same Linotype Caslon I am it is a great cutting. However, have you viewed the italic? <br> <br>No so great! <br> <br>I seem to have missed much while I was moving and not online. Don't want to change the subject but have you seen our new page. <br> <br>If you don't like ornaments don't bother! <br><a href="http://www.lanstontype.com/LanstonPriceList.html" target="_blank">http://www.lanstontype.com/LanstonPriceList.html</a> <br> <br>Gerald speaks of many ink aspects of type. There are, as he says, many conditions ready to alter a  type face. The ink on the first impressions will not be the same in the middle of the run, the ink on the end of a run once again much different. Worn type, battered type, unclean type, linty papers, faulty make readys, soft packing etc. <br> <br>Lets not forget work ups. Not only spaces did that! <br> <br>Roller syndrome, sheeps foot, winter and summer gelatin rollers. <br> <br>But no mention yet of "type stretch". I hate to toss this into the equation. Did you know on a cylinders press you can measure the type form and then the printed text. The text may be a pica bigger??? Plays hell on close registration! <br> <br>A properly imposed hand set or monotyped page will tend to be slighty taller in proportions. Linotype properly imposed slightly wider? <br> <br>I do not agree that printers did not care about how a type face looked. A good craftsman, and there were many, cared a great deal how a typeface looked. <br> <br>I hired many printers and found them to be an extra-ordinary learned lot. <br> <br>Even in the work horse environment. <br> <br> <br> <br>Gerald</p>
