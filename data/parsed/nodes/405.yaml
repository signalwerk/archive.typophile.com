    html: "<p>I have studied a bit more the Adobe Caslon vs metal Linotype Caslon Old Face, composing in in 11/13 Adobe Caslon an identical paragraph as in the book I have. What is more noticable than any difference in letter forms is: a. greater thick-thin contrast; b. more apparent irregularity in x height; and c., the most noticeable, there is less space between letters and words in Adobe Caslon than the Linotype version.  <br> <br>Has spacing tightened up in digital type generally? Is this affecting readability? If the shapes of individual letters are perceived, as the announced talk seems to suggest, then having looser spacing might help ease of reading. </p>"
