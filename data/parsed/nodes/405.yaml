    date: 2003-06-02T08:06:00
    votes: null
    html: "<p>Well, all I've seen of Emile Javal is indirect, referenced by pretty much anybody interested in reading. As for Herman Bouma, his research is readily available through books and papers, if you have access to a good library (especially one with ILL capability). Unfortunately though, Bouma is now retired, and he never distilled his findings into one neat package. For a superb single work, check out Taylor &amp; Taylor's \"The Psychology of Reading\", 1983. <br> <br>Mainly: <br>- Towards the end of the 19th century, Javal established that reading proceeds in saccades (jumps), not a flow. <br>- In the 1970s and 80s, Bouma clarified the ways in which we generally read word-shapes (or actually, letter-clusters), as opposed to complining words from recognized letters. <br> <br>What this means for instance is that an x-height can indeed be too large for optimal readability (even though it might be great for seeing an individual letter). <br> <br>Also: <a href=\"http://www.themicrofoundry.com/ss_read1.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_read1.html</a> <br> <br>hhp <br></p>"
