    html: "<p>Good point(s), but: <br> <br>&gt; these approaches need to be understood as historical developments and not taken out of context. <br> <br>That's only half the story, the \"Art\" side. <br>Since typography and type design have an essentially functionalist foundation (to me), there's also the issue of how people read, and deep down that only changes when the species mutates! So very very slowly... <br> <br>One can only hope that when somebody is setting [text] type, he's more minding the subvisible, functional stuff, and less trying to express some ephemeral personal cultural preference. Specifically, too-tight spacing destroys the balance of black and white space essential to making out boumas. <br> <br>hhp <br></p>"
