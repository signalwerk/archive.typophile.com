    html: <p>William <br> <br>One last point to this perhpas. I recently scanned an obscure metal typeface with the intent of digitizing it and in the process I have noticed something that might not have been dealt with.  <br> <br>Chank or someone has a tutorial on typeface design that essentially reveals that pieces of letterform constructs are used over and over again to form the composites of the various letterforms. A time saving device that I assume, as I get into this now, must be a fairly standard practice in digital typeface design. <br> <br>Problem is, this metal typeface, which has some pedigree, doesn't follow that technique. Every character has a bit of slight alteration to it. No cut and paste technique available then I guess. <br> <br>So, maybe that is another reason why you see a nice variability to older metal based typefaces that you do not in digital revivals??? <br> <br>Gerald</p>
