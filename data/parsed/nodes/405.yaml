    html: <p>&gt;actual point size used has  <br>great bearing on optimal letterspacing <br>Hrant,do you think that in text size, 10-12 point, the ideal change in spacing is sufficiently non-linear that this should be taken into account? <br> <br>Gerald, one more question about ink spead in letter press. Is this primarily due to the roller getting ink slightly on the sides of the face, and then getting picked up when pressed into the paper, or is ink actually squeezed out from the face? The reason I ask is that if it is only the first, then I would expect the spread to be even around the face, whereas if the second, then the thick strokes would have more ink spread than the thins. </p>
