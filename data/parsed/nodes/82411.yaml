    <p>Hi,<br>
    I don't know much about typography and I'd like to id that font. </p>
    <p>I tried a few automated tools but no luck. The fact that the text is slanted probably doesn't help. But you can clearly see that many letters are 'uneven', like for the W and the X, the stems (if that's the correct term) are not the same length. I like that.</p>
    <p>Your help is really appreciated. Thanks!</p>
