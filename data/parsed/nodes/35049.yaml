      <p>&gt;too many cuts in each form</p>
      <p>My feeling is the same as Stephen's. The O with four cuts is distinctive, but for me it just attacks the eye. Maybe it will work at huge sizes, but otherwise it is just too dazzling. With the rounded/ decayed look you've done, something interesting could come out of this. I don't know what other rounded stencil faces are out there....</p>
