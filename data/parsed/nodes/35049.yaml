      <p>I, too, have gazed at that cautionary text on flights to and fro. Great source. The soft contour is appealing.</p>
      <p>I think the problem with most stencil typefaces is that there are too many cuts in each form. I think this one would benefit from more judicious breaking. This is why the 'X' works so well. Think about dropping the NW and SE cuts in the O for instance. If you want to keep these guys, the less-slashed forms can live in the lowercase slots.</p>
