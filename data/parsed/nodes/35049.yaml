    html: |-
      <p>Thanks Stephen!</p>
      <p>I am glad you like the softer approach. That was one area where I broke with the source.</p>
      <p>I will have to think about what your saying about the breaks because on the one hand I really like the four breaks on the O. To me that is the point of difference with the existing stencil faces and also the source of the personality of it. On the other hand maybe I am being to slavish. There is a 3rd possibility which is that I just haven't caught the feeling I need to in the cuts. I will mull this over. </p>
      <p>If you have anything else to add I will be most interested!</p>
