    <p>Hello people at Typophile,</p>
    <p>I just received two pictures of the new road sigining in South Korea, using Hangil E-Type for the English/Latin names.</p>
    <p><img src="/sites/default/files/old-images/Korean_Traffic_Signs_1_4457.jpg"></p>
    <p><img src="/sites/default/files/old-images/Korean_Traffic_Signs_2_5483.jpg"></p>
    <p>The pictures were taken in Seoul. I’m happy to see the typeface in use.<br>
    Do you live in South Korea and like to make some pictures of the new signage for me it would be great! :)</p>
    <p>Pieter</p>
