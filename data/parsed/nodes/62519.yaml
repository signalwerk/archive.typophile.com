    html: |-
      <p>I came back to Paris from Seoul three weeks ago after spending a couple of months there. Unfortunately, I have to report that I failed to find any road sign using the new typeface. I did pay attention to the road signs everywhere I went (mostly around Seoul and to the south and south-east of Seoul), but I had no luck. I even thought about going out to look for the sign in the pictures above, but decided it would be too much trouble without a car.</p>
      <p>Understandably, they are not going to replace existing road signs overnight. In fact, one thing I noticed was that you still find lots and lots of road signs that pre-date the introduction of the typefaces that the new ones are replacing. But I also hope to see more examples of the new typefaces, of both the Korean and Latin alphabets. So please show us pictures, if you find any.</p>
