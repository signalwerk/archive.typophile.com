      <p>Are you sure the pictures were taken in Seoul? Wondang-daero only goes through Incheon and Goyang to the west of Seoul, as far as I can tell. I've been looking for the new road signs but haven't seen any yet here in Seoul, to my disappointment.</p>
      <p>Wondang-daero seems to have opened fairly recently, so it makes sense that it has the new signs, but I guess they're not exactly in a hurry to replace all the signs on existing roads, which is understandable.</p>
