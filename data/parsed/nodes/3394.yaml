  html: |-
    <p>Hello Kids -  <br> <br>A few months ago I discovered ambigrams, and soon after that fell in love with the magic that are symbiotograms. I was asked to design a skateboard graphic, and finally! I had a good chance to apply a symbiotogram to a commercial project. The ambidextrous nature of a board leant itself perfectly to such a design, and under the theme of anti-violence, I designed the below graphic. <br> <br><a href="http://stereotypography.com/other/?src=deck_type.jpg" target="_blank">http://stereotypography.com/other/?src=deck_type.jpg</a> <br> <br>It can be a little tricky to read on one rotation, but I think it just about works. I'm interested to hear what you think and whether you've played around with similar things.</p>
