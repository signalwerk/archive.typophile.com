    html: <p>Now that I have looked at the site &amp; read what you said I am starting to guess that you wanted something heavy &amp; pro instead of the more 'girly' starlux. I may be off base here but that's my guess. I can see that - however I think that folks are right here in suggesting that you may not want to abondon statlux. There is equity in your existing name because you have done work under that name already. Also 'starlux' is more memorable than 'level D'. People forget they parked at level D alll the time. What is to stop them from forgetting you? Starlux is memorable. I would suggest redesigning starlux to carry the new feeling you want to evoke. To do that you have to figure out what you want people to think about you. Even if it isn't true - yet.</p>
