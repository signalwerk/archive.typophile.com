    html: |-
      <p>Hi.<br>
      I personally like/love the last four in the 2nd column—the box/D combo (not the rounded corners version.<br>
      It is more simple, coherent and a stronger, more ownable quality than the rest. I like the various colors that you've applied to the logo. You could actually choose a palette of colors and use them all depending on what section of your portfolio one is reviewing. There are a great number of ways in which you could apply the logo to various touch points.</p>
      <p>Criticism:<br>
      If it were mine, I would work on the kerning of the word a little more... There is a spacing issue particularity between the v and the first e. I suggest tightening it up a bit. Try squiniting your eyes when looking at the word and keep tightening up the space until it looks coherent to the other letter spacing in the word. </p>
      <p>Hope that helps.</p>
