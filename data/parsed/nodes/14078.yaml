    html: |-
      <p>How did I arrive at Starlux? That's a good question. I'm now forced to go back and recall my original intentions.<br>
      I wanted a short word that had an impact. I was particularly interested in words that mean "light" or "illuminate", most of which are taken. I thought at the time a tagline that read Illuminating Design would work well (although something about it sounds familiar. I think there was an Illuminating Television tagline for something). And illuminate is a good word because it means to enlighten, clarify, reveal...all of which are important in design. </p>
      <p>So...I arrived at lux...which was the favorite of all the words I came up with. Another design company in the bay area has it so I didn't take it on. But I did combine lux with other words. One day I wrote luxstar. Took a look at it and thought Starlux!</p>
      <p>As you can see (I can too) now, the retro/futuristic vibe I was going for was more a stylistic choice. It doesn't really have any bearing on the meaning. I think starlux sounds flowly and it also sounds techno. Perhaps I was trying have the logo match the way it sounds in my head.</p>
      <p>Something to think about...</p>
