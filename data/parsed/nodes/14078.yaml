      <p>starlux,</p>
      <p>I've just read through this critique thread for the first time and I agree with the main themes of this discussion:</p>
      <p>- The original is best but would benefit from refinement<br>
      - Define the problem further to give focus to the process</p>
      <p>Honestly, you're straddling a couple of definitions of 'retro' and you should probably pin those down more firmly before moving ahead. Don't design, research (I have to go back to the research all the time).</p>
      <p>Are you generally going for 50s retro with chrome lettering and pastel colors, 60s retro with a psychedelic twist? Perhaps late 70s/early 80s neon rock lettering with some glitz and shimmer? Your site seems to drift towards the latter, but the 'Starlux' pushes towards the 50s in my mind's eye. And if you want to blend them, what aspects are you blending and why? Again, immerse yourself in visual research. Get excited and inspired by the rich visual cultures you're referencing and don't worry about websites and logos for a little bit.</p>
      <p>By the way, there's a film called <a href="http://www.apple.com/trailers/independent/lipstick_and_dynamite.html" rel="nofollow">Lipstick &amp; Dynamite</a> that hits the retro-but-contemporary nail squarely on the head with its titles. Check out <a href="http://www.lipstickanddynamite.com/" rel="nofollow">the movie site</a>. While I think it gets a bit too hip-contemporary for its own good, it's not afraid of some <em>real</em> retro design, incorporating some of the kink, funk, and naiveté of the design from that era. I'm a fan of that <a href="http://www.ruthlessfilms.com/images/index_08.jpg" rel="nofollow">script</a> they use. That's what separates a retro design from a thin retro-rehash.</p>
      <p>This is all probably more helpful for your general design, since it looks like you're focusing on the original script, which I like. I'm eager to see where it all goes. Hope this helps.</p>
    html_clean: |-
