    html: |-
      <p>Hi again,</p>
      <p>Thanks for the responses. The meaning of level d? To be honest I looked for words that I like the sound of first. The meaning came after. The D is design. And it doesn't hurt that my last name starts with a D. So...combos like Terminal D and Area D came up. I liked the sound of Terminal D but it means the end and although most would associate it with a section of an airport some might think death. In the end I settled on Level D and decided that I liked the various definitions of the word. For example, (adj) Rational and balanced; sensible, or (n) A relative degree, as of achievement, intensity, or concentration and (n) A natural or proper position, place, or stage...</p>
      <p>Where do I want to go with design? I'm currently in a place where I want to explore other arenas of design...work with my hands more. Most of my experience has been with corporate design...newsletters, brochures, books, magazines, identities, etc. So this is a space for me to explore.</p>
      <p>About solving the problems in black in white first...you're right. I'll work on that and repost with gifs next time. So regarding the comment that I should tell people who I am...are you saying that the word design should be a part of the logo? </p>
      <p>I used Din because it looked like it might be used for a parking or street sign. Perhaps I should move away from that aesthetic. I'll definitely explore other options.</p>
      <p>Thanks again for your help. I'm moving today so I won't be able to show you anything new until the end of the week.</p>
