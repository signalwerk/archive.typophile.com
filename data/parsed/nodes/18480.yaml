    date: 2006-03-12T15:26:00
    date_raw: 12 Mar 2006 — 3:26pm
    votes: null
    html: |-
      <p>It's not an "underline" font.  Watch carefully as the animation finishes - the text as animated and finished has no underline.  When the text has finished moving, the Flash animation just goes back and draws a line underneath the text they want, probably in XOR transfer mode so that white pixels turn black and black pixels turn white.</p>
      <p>It only looks this way because none of the descenders ("y", "g") ever curve back up from their lowest point.  If they did, you'd see those little curls above the line, which is why real glyph-rendering systems don't draw undelines that way.</p>
