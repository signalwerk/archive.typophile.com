    html: <p>An sfnt font (TTF, OTF) can have an em square of any size. There is a gain in performance speed if the em square is a power of 2, hence 2048 being the most common standard, but this is not a requirement of the specification. Note, however, that some customers, e.g. Microsoft, make a power of 2 a procurement requirement because of the performance gain. From what I understand, this performance gain is pretty small, but MS consider it significant enough to be desirable.</p>
