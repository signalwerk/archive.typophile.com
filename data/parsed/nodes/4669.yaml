  html: <p>I'm currently designing a typeface using an EM square of 2048 points (the standard used in TT-fonts). Will my typeface suffer any problems if I were to change this to an EM square of 2000 points, as this fits better with my requirements.</p>
  html_clean: <p>I'm currently designing a typeface using an EM square of 2048 points (the standard used in TT-fonts). Will my typeface suffer any problems if I were to change this to an EM square of 2000 points, as this fits better with my requirements.</p>
