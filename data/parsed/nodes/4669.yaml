    html: <p>&lt;font class="dontLookLikeCrap"&gt;This is one of those cases where an ancient issue has become almost religious belief. <br> <br>Adobe's testing has never shown any performance difference based on an em square being a power of 2. I've never seen Microsoft point to any testing that demonstrated it such a performance difference, despite being asked. <br> <br>The original expectation (and likely reality) of a performance difference for TrueType outlines was specific to the 68K Motorola series of processors, and byte-shifting operation optimization within those processors. This rationale does not transfer to PowerPC or Intel processors. <br> <br>Also, I've never seen a claimed performance difference for PostScript outlines, though it would seem to be just as probable (or improbable today). <br> <br>Regards, <br> <br>T&lt;/font&gt;</p>
