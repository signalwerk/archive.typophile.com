      <p>PS hinting can be done as you go along. If you convert hints to links in FontLab, you can even leave them intact while you make most kinds of adjustments to outlines, although I usually remove them if I’m doing additional work on a glyph, as it is tidier.</p>
      <p>I try to set blue zones (vertical alignment zones) early on, once I have established normal x-height and overshoots etc., but I don’t usually set standard stem values until all the hints are in place.</p>
      <p>TT hinting is a different kind of beast, and I wouldn’t start this until after both outline and spacing design are complete. TT hinting is a kind of additional design phase in which you are effectively modifying the design for specific device dependencies.</p>
