      <p><em>I’m confused: if hinting changes everything, what’s the point of tests for dedicated screenfonts before they are hinted?</em></p>
      <p>I didn’t suggest testing before hinting. I recommended early testing <em>including hints.</em> But also bear in mind that hinting might not change ’everything’ in the target rendering environment. Early testing in ClearType is pretty essential, if that is your primary target environment, because you can’t rely on x-direction deltas to tweak things later: you need to know that your letterforms actually work well in that environment.</p>
