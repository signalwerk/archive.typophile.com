      <p><em>...maybe design some letters &amp; test them with TT hinting at the begining so that the reality of rendering can inform your design process.</em></p>
      <p>Absolutely. When making dedicated screen fonts, you want to test in the target rendering environment as early as possible in the design process to review stem weights and other details. When I started work on Constantia for MS, I began by making a Multiple Master font with a weight axis for a few key letterforms — H O i n o, if I recall correctly — and then generated a pile of different instances at different weights. Mike Duggan at MS hinted these, and together we reviewed the rendering of the different weights.</p>
