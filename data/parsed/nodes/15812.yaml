      <p>I am guessing you are talking about Postscript hinting. True type hinting is another and far more difficult matter.</p>
      <p>I believe the postscript hinting should be apart of the typeface from the beginning. It is all about the way you place the anchor points. </p>
      <p>I don’t know what software you are using, but if you are working in Fontlab, the software calculates the hinting from the anchor points placed in the extreme points of the characters. The extreme points are the parts of the curve that for a short while are either parallel with the x-axis or with the y-axis. This is often the point on the curve that is highest, lowest or most to the left or to the right side.<br>
      Every extreme point should have an anchor point.</p>
      <p>From these, the software measures the stem-width and the overshoot, and then decides on the most representative dimensions in the hinting.</p>
      <p>You can also do much more, but this is the easiest.</p>
      <p>Hope it helps</p>
      <p>Sofie</p>
