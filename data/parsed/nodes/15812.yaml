      <p>Of course I write this at the risk of teaching your G-mas to suck eggs.</p>
      <p>But maybe it will be useful to someone...</p>
      <p>David when you say ’dedicated screen fonts’ do you mean bitmaps? Because that is different. Or do you mean an outline font which is meant for &amp; designed for screen use?  I think that John is referring to the latter; and so he is talking about the way your outlines render to screen in the first place. I think he is saying that you want to know that your  basic shapes behave well enough before you spend alot of time working on either hinting or even other glyphs. Is that correct John?</p>
      <p>My experience is that hinting can change a surprising amount. But it is not the way you want to start solving problems - just a way - and often not the best way - of smoothing out rendering problems. This is because hinting that is marvelous on Windows in B/W and/or in the old antialiased mode may not give such good results on OSX and it’s rendering engine - or for that matter in ClearType. </p>
      <p>The take I have on this - and I would love to hear if anybody agrees or disagrees - is that you really do want to start with good shapes that behave as well as possible in one target OS/rendering format. And that while you can have good results in a variety of environments, in some ways you have to choose a rendering environment to focus on &amp; then hope to mitigate the damage in the others. I have a font I am developing that is attempting to bridge the gaps and it’s frustrating. I will have to choose an environment to make primary soon. Still, it’s been a great learning experience.</p>
      <p>Or in John’s case - maybe they didn’t worry about the other rendering environments much. After all they were making fonts to establish the value of a particular approach to rendering type in the context of LCD screens! Having a contrast in results might even have been appealing to them. John, did you test Constantia in other rendering environments? If so did you let it impact the design? My guess is that the answer is ’No’. Why make the job trickier?</p>
      <p>I think that screen rendering environments can be compared to paper or repro technologies, metal vs. CRT vs. Postscript etc. A type design that is optimal in one of these may perform well in others but really <strong>ideal results</strong> can only occur in the niche/context that the face was designed for. </p>
      <p>When the apple &amp; microsoft environemnts were more similar (OS9 &amp; Win95/8) this was somewhat less true because OS9’s interpretation of hinting was more similar to that of Windows. But now we have the old model TT/PS + Cleartype + OSX’s rendering. And they all differ in pretty big ways. Plus there is screen rez/density which could change over time and is starting to change already.</p>
      <p>Andre, what is the purpose of the font? If it’s really for print then you could hint at any time since screen use isn’t central to your purpose. And you can probably get away with auto hint anyway. Anybody agree/disagree?</p>
