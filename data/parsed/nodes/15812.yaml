      <p>&gt;Yes, my goal is to produce a typface for print.</p>
      <p>Never mind. If you’re making printer fonts you don’t really need hints.</p>
      <p>As far as making outlines suitable for use as screen fonts,<br>
      &gt;you need to know that your letterforms actually work well in that environment.</p>
      <p>Yes thanks. Since “that environment” is every size from 9-27 or so, regarless of x-ht. stem, counter or serif decisions you make (within the reason brought on by experince), there are good nodes and bad nodes into which the letterforms are gonna fall (sizes that work well, and sizes that don’t. You can test that, but any changes you make just shifts the problem. Really the testing of letterforms that actually work well in “that environment” should be going on in your mind before a letter’s drawn. I.E. is the contrast dumbed down enough? are the shapes dumbed down enough? Is the spacing dumbed down enough? Dumbing being ness. to compensate for the “smartening” of the CT rasterizer.</p>
      <p>Another thing that’d help hinters, would be if applications developers understood the importance of a finer granularity in the selection of sizes available to screen font users. But that’s such a good topic it’s blog bound.</p>
