      <p>I agree with John with this proviso - ( if thats the word I want )</p>
      <p>If you are really designing for screen use in particular ( which you are probably not ) but if you are - maybe design some letters &amp; test them with TT hinting at the begining so that the reality of rendering can inform your design process. Nailing down some essentials in the begining can save you alot of work later on. Thats what I wish I had known to do when I started work on my screen-centric font project.</p>
