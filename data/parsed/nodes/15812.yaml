    <p>I would like to know when is the better time to start the hinting of a typeface. I almost finish the first weight. I did the spacing and the kearning even if I think I have to work again on that part of my own typeface. I wonder which way to choose? Do other weight. Do the hinting or something else?</p>
    <p>I’m stock at this moment.</p>
    <p>Thanks</p>
