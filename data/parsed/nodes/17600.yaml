    <p>running Win XP SP2. i downloaded and installed TTX, but i can’t get it to work. i drag my otf onto the icon and i just get a back “not” symbol and no resulting xml file. i know it’s worked for me in the past... is there a setting somewhere i need to toggle? please help.<br>
    actually... it looks like none of my drag and drop behaviors are working. i just tried doing the same thing with a .jpg to my photoshop icon and got the same “not” symbol. what to do?</p>
