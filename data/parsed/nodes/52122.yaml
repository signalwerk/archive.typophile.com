    html: |-
      <p>hi</p>
      <p>"I would like to be able to apply different settings to specific corners, ......"<br>
      That's not really possible, but you set different parameters for each glyph just by double clicking a glyph. Then you are able to store local parameters for that glyph instead of using the local ones. see the <a class="freelinking external" href="http://roundingufo.typemytype.com/documentation.html" rel="nofollow">documentation</a> :)</p>
      <p>"Except for the slider for the “Ignore Short Segment” feature......"<br>
      This is "deleting" short segments which are shorter then the slider value. It only apply on really small segments otherwise your contour would be distorted too much.</p>
      <p>on the <a class="freelinking external" href="http://roundingufo.typemytype.com/download.html" rel="nofollow">downloadpage</a> the second line links to the <a class="freelinking external" href="http://roundingufo.typemytype.com/order.html" rel="nofollow">order</a></p>
      <p>"....But feature-disabled demonstrations must be clearly marked as such."<br>
      You are right, I'm adding this now</p>
      <p>enjoy Frederik</p>
