      <p>After playing around with it a bit, I really like what's going on. I'm afraid it might be a little oversimplified, but it does what it says it will do, and where I've found unexpected results it seems the fault lies in my design. </p>
      <p>If I could suggest improvements:</p>
      <p>Sliders are nice and simple, but it would be useful to be able to input numerical values too. Plus, it would be interesting (though probably not terribly useful) to see what happens when negative values are entered.</p>
      <p>Except for the slider for the "Ignore Short Segment" feature. Unless I'm mistaken it seems to do nothing but turn the feature on and off, and the slider is not marked for which end is which, so it's hard to tell if it's on unless there is an affected corner in the design. That would be better served with a check box, unless the slider is doing something I'm not seeing.</p>
      <p>I would like to be able to apply different settings to specific corners, rather than the same ones to the whole font or glyph. Global settings have their place to make the effect consistent and quick, but massaging glyph by glyph, corner by corner is necessary after that.</p>
      <p>There could be more ink trap shapes. As it is they come to a box end, but they could come to a point, a wedge, a rounded end, or a bulb, or possibly other options I haven't thought of. </p>
      <p>But even as it stands, this is a great and useful accessory that I and I'm sure many others have been waiting for for a long time, and I am grateful it's being offered for free. </p>
      <p>Thank you Frederik!</p>
