    <p>Hi</p>
    <p>roundingUFO is available !!!</p>
    <p>RoundingUFO is a mac only application that converts the corners of the glyphs in your fonts according to user-defined parameters.</p>
    <p>It automates the process yet lets you keep complete control as a designer. You determine the parameters: the black and the white corners. RoundingUFO doesn't mess around with your contours; the necessary points are added.</p>
    <p>With RoundingUFO considerably speeds up the production process, without loss of quality. All UFO's generated with roundingUFO can be interpolated.</p>
    <p>Additional features include: adding ink traps or simply cutting off the corners instead of adding rounding them.</p>
    <p>go check it out <a class="freelinking external" href="http://roundingufo.typemytype.com/" rel="nofollow">http://roundingufo.typemytype.com/</a></p>
    <p>yours sincerely <a class="freelinking external" href="http://www.typemytype.com/" rel="nofollow">Frederik</a></p>
