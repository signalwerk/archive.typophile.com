    <p>Hi everybody,</p>
    <p>I am presently reading a book call Le langage de la typographie (The complete typographer), I really like this book !</p>
    <p>But there's something I dont understand about the em, they said you take the caps M and the width (la chasse) is suppose to be the same as the height. I maked the test with Myriad, Garamond etc and there's nothing liked that. Did I misunderstanding someting ?</p>
    <p>Thanks</p>
    <p>M</p>
