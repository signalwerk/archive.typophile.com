    html: |-
      <p>The cap M is only 1 em width in a very few fonts. Even fewer will have the cap N exactly 1 en in width.</p>
      <p>The em is a horizontal dimension that varies with typesize. It is defined as being the same size as the pointsize of the face. Thus a em is 12 points wide in a 12 point font, but 24 points wide in a 24 point font. This makes it especially good for specifying paragraph indents, among other things.</p>
      <p>(Also, when you are measuring a font, remember that you must measure the ascender, body, and descender space, and even then there might be a small additional amount of "side-bearing" white space around the characters.)</p>
