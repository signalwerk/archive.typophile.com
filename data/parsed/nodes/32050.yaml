      <p>Marc, with 1000 units per em, Adobe Garamond's M is 912 units wide, and Adobe Caslon's M is 981 wide. </p>
      <p>Traditional seriffed M's did have approximately square bodies, hence the name for a body width space, which is square, is an 'em quad', and we continue to talk about the 'em' in digital type. For more than you ever wanted to know, see this thread: <a href="http://typophile.com/node/27742" title="http://typophile.com/node/27742">http://typophile.com/node/27742</a></p>
