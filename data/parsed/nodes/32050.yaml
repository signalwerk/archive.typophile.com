      <p>Perhaps History. I remember asking the owner of a shop that used Linotype Linecaster's -- which don't use an em system -- how wide an em-space was. "Why," he said, "the width of a capital 'M'".</p>
      <p>Personally, I just don't remember just what got put in the magazines . . . We've all been working with em-based systems for so long.</p>
