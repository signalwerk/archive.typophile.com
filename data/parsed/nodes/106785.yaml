    html: |-
      <p>You're welcome Vargas.<br>
      Yes Fontlab.  Make certain that you have opened the two fonts you want to blend. If you want to blend the upper case make certain that the capital height is comparable in the two fonts. I usually re-size the fonts based on setting the letter O at a height of 700. If you want to change the appearance of one of the fonts before blending, e.g. narrowing the width, do this. Then use the pull down tab for Tools and choose Blend Fonts. For significantly dis-similar fonts like Neuland Black and El Grande it's probably best to uncheck the box for "Do not change type or add nodes in compatible outlines." For significantly dis-similar fonts you can expect to do some cleanup after blending to get rid of unwanted bulges etc. Somewhat of a learning curve to get the results you want. Best to try 50-50 blend amount before experimenting. It should not be too difficult to more or less replicate the results I posted.<br>
      Don<br>
      Revised</p>
