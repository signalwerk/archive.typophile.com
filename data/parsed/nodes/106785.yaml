    <p>I am looking for know further info about this font. I remember to have seen it printed in old Mecanorma or Letraset catalogs when I was studying at university in 1993.</p>
    <p>About 14 Cañonazos, is a Colombian tropical music compiled series that every year on December publishes a selection of 14 successful songs of tropical genre for parties or fiestas of finish year.</p>
    <p>More info, <a href="http://www.discosfuentesedimusica.com/index.php?option=com_content&amp;view=article&amp;id=146&amp;Itemid=126" title="http://www.discosfuentesedimusica.com/index.php?option=com_content&amp;view=article&amp;id=146&amp;Itemid=126">http://www.discosfuentesedimusica.com/index.php?option=com_content&amp;view=...</a></p>
    <p>Thank you</p>
