      <p><em>&gt; FSI has not made ANY statements about this case.</em></p>
      <p>Indeed -- in my communications with FSI they have NEVER commented on this case, and they sent me the press release as is (probably because they know I have a keen interest in piracy in corporate fonts, as this was the subject of my TypeCon and ATypI presentations). I have contacted FutureBrand for more information, but they are playing possum.</p>
      <p><em>&gt; Type dorks are really good detectives.</em></p>
      <p>As you can see when you follow my link, several people on the Type Identification Board came to the same conclusion independently of each other, and some additional investigations confirmed our suspicions. That's why I love this outfit -- thanks to the number of people involved and the unique combination of specific areas of interest, we must be the most efficient type identification tool in the known universe.</p>
      <p>I was taught by my parents that if I did something wrong I should always confess, apologise and try to make things right, NOT make it any worse by lying even more. I'm particularly offended by FutureBrand's stuborness as they <em>"[have] denied and vigorously defended the allegation that the typeface infringed FSI’s copyrights or that the typeface was an otherwise unauthorized derivative version of FSI’s FF DAX and FF META typefonts."</em></p>
      <p>You don't want to tick off the dorks...</p>
