    <p>PRESS RELEASE</p>
    <p>FOR IMMEDIATE RELEASE<br>
    January 17, 2006</p>
    <p>FSI Fonts und Software GmbH, (FontShop International) announced today that it had reached a settlement with an internationally recognized strategic brand development firm related to a dispute involving the design, creation and licensing of a typefont developed as part of that firm’s work for one of its clients.</p>
    <p>The firm has denied and vigorously defended the allegation that the typeface infringed FSI’s copyrights or that the typeface was an otherwise unauthorized derivative version of FSI’s FF DAX and FF META typefonts. FSI first raised its claims in the beginning of February, 2005.</p>
    <p>Without any admission of liability, the parties have agreed to resolve this matter pursuant to the terms of a confidential settlement agreement in order to eliminate the uncertainties, burden and expense of potential, protracted litigation. As part of that settlement, the firm has agreed to pay FSI $17,500.</p>
    <p><em>About FSI Font Shop International<br>
    FSI FontShop International is a German-based international developer and licensor of electronic type fonts under its FontFont Library brand (<a href="http://www.fontfont.com" title="www.fontfont.com">www.fontfont.com</a>). Comprising more than 3,500 electronic type fonts created by more than 150 font designers, FSI distributes the FontFont Library around the world through direct Internet sales. As well as its FontFont Library, FSI also distributes fonts from more than 30 other font foundries at www.fontshop.com.</em></p>
