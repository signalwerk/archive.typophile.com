  html: |-
    <p>I'm surprised no-one has asked this before on Typophile (my search at least yielded no results). When generating fonts in FontLab I often get the message:</p>
    <p><code>[WARNING] The feature file OS/2 overrides TypoAscender and TypoDescender do not sum to the font bbox size!</code></p>
    <p>I assume this has to do with the metrics settings somehow, but no matter how I play around with the metrics this message won't go away.</p>
    <p>O ye wise, what is wrong, how did I cause it, and how do I make it go away?</p>
