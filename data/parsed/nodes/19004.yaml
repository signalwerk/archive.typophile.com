    <p>Hi, just a quick one.</p>
    <p>I am using small caps to write ACC. A sentence within a paragaph begins "ACC is aware of the...".<br>
    Now, do I use a normal capital A, then two lc 'c's?. This looks like 'Acc' becuase the small caps 'C' looks very similar to a lc 'c'.</p>
    <p>Cheers.</p>
    <p>- Chris</p>
