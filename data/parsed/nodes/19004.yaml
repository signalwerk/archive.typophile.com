    html: |-
      <p>Another approach is to use all caps for ACC but at a slightly smaller size than the full caps. This is the New Yorker's style for acronyms when there are no periods.</p>
      <p>I'm assuming by the way you wrote your post that ACC should be all caps to begin with.</p>
