    html: |-
      <p>Is ACC referenced anywhere in the body of text before that sentence? Standard writing practices would be, if it's appearing for the first time, to write it as, "A Common Cold (ACC) is aware that there is no real cure.…". Then after that it is acceptable to refer to the acronym. </p>
      <p>Also, if you follow the "never start a sentence with a #" rule, spelling it out would be a perfectly acceptable alternative. Or stick a filler word like 'the' in front.</p>
