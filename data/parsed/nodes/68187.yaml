    <p>Finally I have decided to publish the fruit of my labour on MyFonts. The result for now is yet another version of Baskerville Old Face but with the added suffixes ”KTKM” and ”Display” (Baskerville Old Face KTKM-Display). </p>
    <p>I wanted to improve the contrast between thick and thin, reduce some ink-traps and give stems, serifs and links a smoother overall feel. I have also added some alternative letters, ligatures and old style numerals.</p>
    <p>Feedback is highly appreciated.</p>
    <p>Best regards,<br>
    Kristian Möller</p>
