    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile_Humanist_6269.gif"></div><p></p>
    <p>Generally speaking, a <a href="/wiki/Typeface" class="freelinking" rel="nofollow">typeface</a> with a left-leaning <a href="/wiki/Axis" class="freelinking" rel="nofollow">axis</a>. More specifically, a <a href="/wiki/Calligraphy" class="freelinking" rel="nofollow">calligraphic</a> or <a href="/wiki/Venetian" class="freelinking" rel="nofollow">Venetian</a> font. </p>
    <p><a href="/wiki/Optima" class="freelinking" rel="nofollow">Optima</a> represents one of the less-common humanist <a href="/wiki/Sans-Serif" class="freelinking" rel="nofollow">sans-serifs</a>.</p>
