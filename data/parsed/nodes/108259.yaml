      <p>Lithographed label, not typefaces.<br>
      WILLIAM'S SOAP is in a lettering style called "concave." Here are a couple of digital fonts in the concave style -- not including concave Tuscan, which has spiked outlines:<br>
      Concave Extended<br>
      <a href="http://www.myfonts.com/fonts/solotype/concave-extended/" title="http://www.myfonts.com/fonts/solotype/concave-extended/">http://www.myfonts.com/fonts/solotype/concave-extended/</a><br>
      Fredericksburg NF<br>
      <a href="http://www.myfonts.com/fonts/nicksfonts/fredericksburg-wbw/" title="http://www.myfonts.com/fonts/nicksfonts/fredericksburg-wbw/">http://www.myfonts.com/fonts/nicksfonts/fredericksburg-wbw/</a><br>
      Don</p>
