  html: |-
    <p>I made this font in December of 2013. It is not truly handwritten but has an artificial handwritten style (originally designed in Inkscape with the pen tool). I do release my fonts for free on such sites as Dafont...so I am aware they are not super professional looking. However, I would like to update my fonts -one at a time- and make them better.</p>
    <p>I want to keep the font true to its original style/personality, but I'd like to tweak it a bit and make it even better. I will definitely be improving the kerning.</p>
    <p>I would appreciate any constructive feedback. Thanks!</p>
    <p><img src="/sites/default/files/old-images/Mf Hey Pretty Girl_5918.png"></p>
    <p>(I am not sure if I can attached or link to the font file itself for further analyzing?)</p>
