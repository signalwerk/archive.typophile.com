      <p>It would be helpful, if you provided some text examples. I find your font interesting, here some advice:</p>
      <p>- The dots should be a bit bigger<br>
      - make every lowercase distinct to its corresponding uppercase, this could be achieved by applying the x-height of the letter k to every other lowercase. The ascenders may be left at the current height</p>
