      <p>@ Frode</p>
      <p>(√(1680p² + 1050p²)) ÷ 21 = 94,339811320566038113206603776226</p>
      <p>The real diagonal is 21,1 inch. So it is 93,892703210042028453902307075865.</p>
      <p>However, you have a screen resolution of 94 ppi.</p>
      <p>Here someone has a list of resolutions for the different sizes and formats: <a href="http://www.robert-gcm.de/deutsch/display-aufloesungen.shtm" rel="nofollow">http://www.robert-gcm.de/deutsch/display-aufloesungen.shtm</a>. Although the relative resolution is really important, there don’t seem to be many people interested in that information.</p>
      <p>But isn’t it odd, that it is relatively hard to find information about the relative screen resolutions?</p>
