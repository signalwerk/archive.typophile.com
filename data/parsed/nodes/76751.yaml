    html: |-
      <p>I don't expressly dislike the bigger type in the initial post visually, but logically I think it's problematic. This sort of thing would make sense in say a blog, where the original post is where the core content lies, and everything that follows are «just» comments.<br>
      By contrast, in the Typophile forums the bulk of the [valuable] content tends to lie in the complete discussion that unfolds, not just in the initial post (which might just be a question, etc.). So in our case I'd argue that all posts in a given thread should bear the same (visual) weight.<br>
      This might be a nice idea for the Blogs though? Maybe. It might make them feel more «blog-like», and would also add an additional visual difference between them and the Forums – which may or may not be desired.</p>
