      <p>“It’s about time. If Apple ditched their screwball DRM system “</p>
      <p>The point of Jobs article is that this is NOT Apple’s decision. It’s the RIAA’s decision. It’s out of his hands to a large extent.</p>
      <p>And he’s getting pinched…by countries like Norway which is trying to ban Fairplay, and up-and-coming DRM-free options like eMusic.</p>
      <p>He’s in a bind, and (rightfully so, IMHO) pointing the spotlight at the RIAAs rather illogical hang-up on DRM.</p>
      <p>“I might start buying music online again—right now I’ve given up on the iTunes store because the DRM is bugger.”</p>
      <p>Check out eMusic!</p>
      <p>“The only thing that will stop someone from downloading illegally is that old-fashioned thing called a conscience.”</p>
      <p>I completely disagree on numerous counts. First of all, I don’t think sharing music you like is necessarily ‘immoral’. It’s something kids have been doing for decades. Mix tapes are a staple of our pop culture. Burning more than a handful of CDs and selling them at $5 a pop? That’s crossing the line.</p>
      <p>Secondly, not everyone downloads ‘illegally’ because they just want it for free…it’s often because it’s the more convenient option. </p>
      <p>The reason iTunes (IMHO) succeeded early on is that it is a VERY easy system to use. They had a large library, and a single double-click gets it to your HD in a few minutes. At the time, this was actually a LOT easier than hitting bitTorrent or Napster.</p>
      <p>Finally, if we do want to shine a light on consumer ‘immorality’ then we need to shine a brighter light on corporate ‘immorality’. The RIAA hasn’t exactly been an innocent ‘victim’ in all of this despite what their PR machine has told us.</p>
      <p>My recent rant on a fight with DRM:</p>
      <p><a href="http://mnteractive.com/archive/fischer-price-fp3-player-headaches-for-dad/">http://mnteractive.com/archive/fischer-price-fp3-player-headaches-for-dad/</a></p>
