      <p>&gt;First of all, I don’t think sharing music you like is necessarily ‘immoral’. It’s something kids have been doing for decades.</p>
      <p>It was pretty hard to copy LPs until cassetes came along. So don’t act like this has always been the case. And just because people have been doing it for a long time doesn’t make it right.</p>
      <p>I get royalty checks every quarter and know that I have missed out on a lot of money due to copying.</p>
      <p>But - I am also against DRMs. It is not stopping anyone so what’s the point?</p>
      <p>peace</p>
