      <p>I just wrote an <a href="http://dangayle.com/blog/2007/02/07/everyone-is-entitled-to-my-opinion/">article</a> for my school’s newspaper concerning file sharing. Jobs is absolutely correct. DRM has failed, and will continue to fail as long as it exists.</p>
      <p>It basically boils down to this: If I want the latest CD, font, program, etc., DRM is not going to stop me from having it. Everything and everything that can be put into a computer can/will be/has been on a file sharing network, and there’s nothing that Jobs or iTunes can do to stop it.</p>
      <p>The only thing that will stop someone from downloading illegally is that old-fashioned thing called a conscience. And unfortunately, a conscience requires morals, which our society has basically done away with.</p>
