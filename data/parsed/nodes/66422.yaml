      <p>Hi Carlos,</p>
      <p>a search on Typophile brought up these threads:<br>
      <a href="http://typophile.com/node/44520" rel="nofollow">Big Caslon italic</a><br>
      <a href="http://www.typophile.com/node/1874" rel="nofollow">Swashy italic in Wallpaper - Big Caslon Italic</a><br>
      <a href="http://www.typophile.com/node/29167" rel="nofollow">Big Caslon-like serif face on Penguin Books cover</a></p>
      <p>What John Nolan said: See <a href="http://www.carterandcone.com/" title="http://www.carterandcone.com/">http://www.carterandcone.com/</a> for contact info.</p>
      <p>Another option is <a href="http://new.myfonts.com/fonts/letraset/caslon-italic-with-swashes/?testdrive=dock%3Dfalse%26size%3D76%26w%3D720%26src%3Dcustom%26text%3DDie%2520%252Behn%2520Gebote%2520eines%2520Schri%25C2%25AEtstellers%26fg%3D000000%26bg%3Dffffff%26goodies%3Dfit%26seed%3D43" rel="nofollow">Caslon 540 Italic with Swahes</a>. You can access the swash z with the ‘+’ key, the f with long descender is hidden behind the ‘®’ (Gosh, do I love OpenType!). </p>
      <p>F</p>
