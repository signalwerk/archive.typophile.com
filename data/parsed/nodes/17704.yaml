  html: |-
    <p>This site doesn’t remember my login all the time so sometimes I’ll be reading a discussion and want to comment, only to realize I’m not logged in. If I then click the LOGIN button and login, I’m taken to my profile. That’s not terribly useful. Could we set it up so that after login I’m redirected back to the page I came from so I can then comment?</p>
