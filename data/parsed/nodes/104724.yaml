      <p>Christopher, </p>
      <p>Regarding lighting and setup I say follow the example of the TYPO conferences where video production has been successful for the past two years. In fact, this last year I purchased a ticket specifically to have access to the videos because the cost of attending was due more to the travel, accommodations, and time off from work expense than the conference itself. Again, these are the same limitations that keep me from attending TypeCon. </p>
      <p>As far as the cost for video production, I point to Creative Mornings and what that team has been able to do. The ability to view past meetings also addresses another issue mentioned here which is how to keep these conferences feeling neighborly. If people are able to watch the processions without attending and paying the cost associated with travel, then they would be encouraged people to do so. In addition, if you charge people for only video access, then you should be able to keep that cost from impacting the regular attendee cost, though this assumes a high enough demand for such a product.</p>
