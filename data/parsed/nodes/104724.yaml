      <p>An organization I've belonged to and attended many of their conferences kept prices down by doing them on college campuses, during the summer break, usually in August. Colleges and universities (and even private secondary schools) will rent out the facilities for conferences, and people stay in the dorms, use the classrooms and lecture theaters; the cafeterias supply the food etc. Those who don't want to go back to living in a dorm for a few days can get outside hotels. </p>
      <p>You definitely know it's not deluxe, but it's really quite pleasant, as campuses have a lot of greenery, and it creates a sense of unity among participants, as you are usually almost the only ones on campus.</p>
