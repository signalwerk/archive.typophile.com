      <p>Organizations that put on type conferences are not get-rich operations. So -unless there's some serious financial mismanagement- I think there's only one good way to make them more affordable: forget being pampered; no fancy hotels in expensive areas, and no gorging on fancy food. Roughing it is totally my own style, but I know I'm not normal, so...</p>
      <p>The original TypeCon in '98 remains the high water mark for me in terms of complete subservience to content.</p>
