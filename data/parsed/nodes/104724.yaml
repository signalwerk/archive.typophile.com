      <p>I could not agree more. I used to love attending these meetings – I went to TypeCon and ATypI regularly. They were professionally very useful, and academically interesting. I made a lot of friends this way - in fact, I met many of you folks this way.</p>
      <p>However, that was back when my employer could foot the bill. There is no way an independent designer, unless they are very wealthy, can afford to attend these meetings as they now exist. As long as these organizations insist on having the meetings in very expensive hotels in very expensive cities, it's going to remain impossible.</p>
      <p>I haven't gone in years. I just can't afford it. I could justify it, sure - but I can't afford thousands of dollars, even with a shared room, to take time off work.</p>
      <p>As someone who has co-planned one of the largest annual regional academic meetings in the United States for more than 15 years, I know it's very easy to get swept up by big hotels and great locations and think that people won't come if you don't have it in those place. I know it's easy to let hotels woo you into having a meeting at a place with a $150 room, and spending $10-$15,000 on catering. I know!</p>
      <p>But you can say NO, organizers. My client does every year - their (volunteer) staff puts together a larger meeting than Typecon or ATypI combined, with more than 200 sessions, for a registration cost between $55 and $75, and an annual membership cost of $35 to $55 (students vs. faculty, sliding scale in between for low-paid instructors, grad students, etc.). They don't sign a contract with a hotel unless they can keep the price down about $100 a room, and yet they still have meetings at Hiltons and nice Marriotts. You just have to play hardball. You can't charge sponsors buckets of cash AND charge attendees as well; one or the other.</p>
      <p>If you encourage a culture of participation, then you end up with a much bigger group of volunteers to put these things together. It does work if it's part of the culture. I think that's why it hasn't so far in our trade: that culture just doesn't really exist yet. Maybe someday it will, and these meetings will again be affordable to everyone, and we can bring in the students and the rest of us without deep pockets again.</p>
