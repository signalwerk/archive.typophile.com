      <p>As JLT mentions the nicer hotels provide free or reduced cost meeting space if the organization can fill a certain number of hotel rooms and buy a certain amount of catering. So the nicer the hotel the better the deal. This relies on a certain number of attendees staying at the conference hotel, but there's nothing to stop cost-conscious attendees from sharing rooms or staying at the Green Turtle youth hostel / couch surfing down the road. </p>
      <p> &gt; My client does every year - their (volunteer) staff puts together a larger meeting than Typecon or ATypI combined, </p>
