      <p>Although I have never had the ability to join in on any type conferences (except one-day ones arranged by my academy), the moment I saw the AtypI fees I wondered where all the cash goes.</p>
      <p>As a recent graduate (of one year) the student rule seems quite strict and doesn't give any leeway to those starting up in the field. Knowing this will be only one of the few conferences I'd be able to hop in (with transport costs of only a €4,- train ticket and only my current living expenses) I'm sure it's all out of my ballfield now, which is a pity.</p>
