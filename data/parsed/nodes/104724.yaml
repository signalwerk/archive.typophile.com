      <p>BTW, the big academic organizations that have meetings whose registration fee doesn't cover the meeting cost have a hidden weapon, one groups like SoTA could emulate: an academic journal. Libraries spend tens of thousands of dollars on subscriptions to the university press that publishes it, more than 60% of which goes back to the organization. Instead of making a journal or magazine part of a giveaway for attendees, make it instead a tool to make money.</p>
      <p>We have a lot of smart people, good writers, historians and others in our trade. A real academic journal, published by a university press, could be a huge moneymaker for a group like SoTA et. al.</p>
