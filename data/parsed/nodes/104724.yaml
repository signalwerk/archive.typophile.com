      <p>Carina, as much as we'd love to have video for TypeCon, that is something that would add <em>even more</em> expense. Not only is paying for the equipment, its operators, and post-production substantial, but we've learned that proper lighting is also crucial to producing reasonable-quality video. There's an interesting balance to strike between what the live attendees see and what is adequate for video.</p>
      <p>Of course it's done all the time with other conferences... but it certainly wouldn't help lower the registration fees, and it would limit our choices of venue (because lighting for video requires the right kind of space). I'm not saying it will never happen, but it's tricky.</p>
