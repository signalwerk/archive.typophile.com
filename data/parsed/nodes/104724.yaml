    <p>With type conference season in high gear, designers everywhere are uttering sighs of disbelief at the prohibitive costs of getting one’s geek on.</p>
    <p>The <a class="freelinking external" href="http://twitter.com/letterror/status/356711169236541442" rel="nofollow">discussions</a> over <a class="freelinking external" href="http://twitter.com/typographica/status/356562011242512385" rel="nofollow">conference fees</a>, travel and hotel expenses are understandable. And given the variety of international type conference options available these days (ATypI, TypeCon, TYPO, Ampersand, TypeTalks, ICTVC, Typography Day, Granshan, Kerning, oh and <a class="freelinking external" href="http://www.youtube.com/watch?v=i3k5oY9AHHM" rel="nofollow">this</a>), how does one even chose what is worth attending?</p>
    <p>New Yorkers may be familiar with The Rent is Too Damn High Party, a political party that has, since 2005, nominated Jimmy McMillan for mayor of New York City and governor of New York state. As its name implies, the party’s continued focus is on the impossibly high rental prices that fail to meet the demands of the city’s population.</p>
    <p>Are type conference fees too damn high? Despite the variety of events, price points and locations, like New York City’s rents, are there still enough affordable and accessible options to meet the demands of the ever-growing typophile population? </p>
    <p>Currently petitioning to include McMillan on the 2013 mayoral ballot,  <a class="freelinking external" href="http://www.rentistoodamnhigh.org/" rel="nofollow">the Party’s website</a> makes its position pretty clear: <em>**Rent Is Too Damn High There Is Nothing Else To Talk About. Absolutely "NOTHING".**</em> </p>
    <p>Perhaps we could talk about some webfonts for its site but hey, I’m just a type nerd.</p>
