  html: |-
    <p>How do all —</p>
    <p>I read recently in Mathew Carter’s interview in the New Yorker, that once he has a character set scratched out, he does about 40 pages of print-outs for observation and to adjust any discrepencies he finds (whilst also feeling like hanging himself, apparently!?).</p>
    <p>I’m designing a headline font and am doing the usual kind of prints — pangrams of uc/lc — mixed sets — mixed with numerals — the various sizes I see it being used at — and a cobbled mix of the special characters used in context. Basically I’ve no idea how anyone else makes their test pages and am just curious as to whether there could be a better way. And I print no-where near 40 pages, but again this is just display. I did some searches and couldnt find any literature on this. Would be nice to put together a master indesign doc I could use.</p>
    <div class="forum-topic-navigation clear-block"><a href="/web/20080908103140/http://typophile.com/node/19024" class="topic-previous" title="Go to previous forum topic">‹ Fonts that typify a decade</a> <a href="/web/20080908103140/http://typophile.com/node/19155" class="topic-next" title="Go to next forum topic">Get a Euri the Euro t-shirt ›</a></div>
