    html: <p>"Rider Back" is <a href="http://www.myfonts.com/fonts/linotype/futura/condensed/testdrive.html?s=RIDER%20BACK&amp;p=48"> Futura Condensed</a>, "Playing Cards" is a manually condensed <a href="http://www.myfonts.com/fonts/agfa/gill-sans/book/testdrive.html?s=PLAYING%20CARDS&amp;p=48"> Gill Sans Book</a> (or Regular?), and you'll need to ask Stephen Coles about that "Bicycle". It looks like some stuff Richard Beatty might have revived. </p>
