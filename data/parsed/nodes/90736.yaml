    html: |-
      <p>Frutiger “s” is quite narrow, its “w” very wide, especially in the heavier weights.</p>
      <p>Futura capital L and T are very narrow.</p>
      <p>When designing monowidth faces, obviously “m” and “w” are problematic, but in my experience stretching letters, apart from “i” and “l”, is more of an issue.</p>
