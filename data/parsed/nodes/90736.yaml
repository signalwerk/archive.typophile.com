    html: |-
      <p>I think the important thing to keep in mind is that there's<br>
      more to "compression" than economy (which might seem<br>
      like the main goal here). Making certain letters narrower<br>
      while leaving others "wide" increases divergence, which is<br>
      a help to readability. And when you decide to make an "s"<br>
      for example wider than it "needs" to be, for example to<br>
      give the font a certain character*, at least you're aware of<br>
      the little bit of functional damage you're doing.</p>
      <p>* This is what I did in Patria.</p>
      <p>hhp</p>
