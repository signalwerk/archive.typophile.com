    html: |-
      <p>Ah! it was from "Balancing typeface legibility and economy" by Victor Gaultney, speaking of Dwiggins' Eldorado:<br>
      <cite>"The greatest danger in condensed design is to compress everything. Dwiggins, on the other hand, carefully chose which letters to compress. Those letters which naturally respond well to compression — a f r s t — are thinned to the extreme, without diminishing critical features. Note the strong form of a and the sharp shoulder on f. Letters with counters, however, such as b d g o p q are given generous space. The diagonal strokes on v w x y are steep, making them narrower. He is also careful not to let the internal space of m and n get too small. All of these features work together to create a pleasant, readable face with no strong sense of compression."</cite></p>
