  html: "<p>Using the document grid, some rectangles and the Pathfinder function, I roughed out a few letters in InDesign. Then I wanted to see what they'd look like with rounded corners, so I used Object&gt;Corner Effects to apply a 3pt rounded corner. <br> <br>Although pleased with the effect, I was disappointed that some of the corners remained sharp (see below). Moving the original sharp-angled shapes into Illustrator and applying Effect&gt;Stylize&gt;Round Corners yielded the same uneven results. <br> <br>A couple of questions: <br> <br>1) Does anyone know a way to get consistent round corners on non-primitive shapes in InD/Illy? Could it have anything to do with the order in which I used Pathfinder to hack off corners and counters? <br> <br>2) Is there a command/effect/filter that rounds the corners by actually moving/creating Bezier points, rather than just changing the way the shape is displayed? In other words, I'd like my shapes to look rounded in both the Preview and Outline views in Illustrator. <br> <br>Thanks! <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/69333.jpg\" alt=\"propel.jpg\"></p>"
  html_clean: "<p>Using the document grid, some rectangles and the Pathfinder function, I roughed out a few letters in InDesign. Then I wanted to see what they'd look like with rounded corners, so I used Object&gt;Corner Effects to apply a 3pt rounded corner. <br> <br>Although pleased with the effect, I was disappointed that some of the corners remained sharp (see below). Moving the original sharp-angled shapes into Illustrator and applying Effect&gt;Stylize&gt;Round Corners yielded the same uneven results. <br> <br>A couple of questions: <br> <br>1) Does anyone know a way to get consistent round corners on non-primitive shapes in InD/Illy? Could it have anything to do with the order in which I used Pathfinder to hack off corners and counters? <br> <br>2) Is there a command/effect/filter that rounds the corners by actually moving/creating Bezier points, rather than just changing the way the shape is displayed? In other words, I'd like my shapes to look rounded in both the Preview and Outline views in Illustrator. <br> <br>Thanks! <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/69333.jpg\" alt=\"propel.jpg\"></p>"
