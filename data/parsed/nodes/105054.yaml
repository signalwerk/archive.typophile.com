      <div class="comment-spam-body"><p>@design-invader: The 'corner' is there due to the reasons that you and Nick Shinn have already mentioned.<br>
      Due to the superellipse-inspired design and the spurless lowercase letters, the characters of Francker generally look quite big compared to those of other more tradionally designed typefaces. To match the overall look of the typeface I wanted to keep all the angled strokes of letters such as A, K, R, V, X and Y of an almost equal thickness, with only a small taper for optical reasons. An extreme taper of the two angled strokes of Y and no 'corner' would lead to too much white space  in both sides of the character.<br>
      Especially in the heavy weights the characters become very wide compared to their height and therefore it was not a good solution just to extend the strokes of the Y as shown in your example - the letter would look to much like a V and have a big dark spot in the middle.<br>
      The inspiration to the 'notched' design of Y comes from the small letter y where the left stroke, in some typefaces (including Francker), is connected to the right one so that there becomes a 'corner'.</p>
      <p>Annoying or not - I personally think I have come to the best solution for the Francker Y!</p>
      <p>Regards,<br>
      Anders Francker<br>
      Designer</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Y_4050.jpg"></div><p></p>
      </div>
