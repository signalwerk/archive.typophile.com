      <p><em> …why…</em></p>
      <p>When stems cross, they create a dense, thicker area.<br>
      This is especially apparent when they cross at an angle, because the acute joint “ﬁlls in” one way or another.<br>
      Type designers have traditionally addressed this issue in letters such as Y by tapering the angled strokes (check out Frutiger Black to see this method vigorously applied).<br>
      However, in Francker it appears that the designer would prefer to keep the stems of an even thickness, so has devised other means to alleviate the heavy spots.<br>
      One of these is to offset the “chevrons” in X (Frutiger does that too), and, interestingly, another is the “notched” technique in the Y.</p>
