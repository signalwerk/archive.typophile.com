    <p>...that is my first post here so; Hello to all of you!</p>
    <p>I am working on a logo which make use of font <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/francker/" rel="nofollow">Francker</a><br>
    I need your advice and knowledge about the solution used to construct a capital "Y" letter in this font. Maybe its my ignorance but i found a corner circled in red a bit annoying. </p><div class="imageWrap"><img src="http://typophile.com/files/francker-typophile_6496.png"></div><br>
    Please take a closer look and tell me why this letter is constructed that way? Is there any other solution which will help to get rid of the "corner"? <p></p>
    <p>Thanks in advanced for all your comments.</p>
