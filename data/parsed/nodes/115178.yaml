    html: |-
      <p>Stamped tags? If so probably not made from a conventional font.<br>
      Good matches for appearance are two fonts based on engraving systems. Lineto's Gravur Condensed <a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Condensed/" title="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Condensed/">http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Gravur+Condensed/</a> and Optimo's Gravostyle Basic <a href="http://optimo.ch/typefaces_Gravostyle-Basic_all_CharacterMap.html" title="http://optimo.ch/typefaces_Gravostyle-Basic_all_CharacterMap.html">http://optimo.ch/typefaces_Gravostyle-Basic_all_CharacterMap.html</a> Only major difference that I spotted is the open top 4 and the tails on 6 &amp; 9. There are other engraving/machine plotting fonts, but they are generally wider than the letters on the tags, particularly for O, C etc. which usually are rounded without the parallel stroke section on the sides.<br>
      Don</p>
