    html: |-
      <p>Agree twice with Kevin. Most probably exclusive and proprietary of Rolex and definitely very close to '<a class="freelinking external" href="http://www.myfonts.com/search/eurostile" rel="nofollow">Eurostile</a> Extended/<a class="freelinking external" href="http://www.myfonts.com/fonts/urw/microgramma" rel="nofollow">Microgramma</a>'. From what I can see, 2 main differences but easily redoable:<br>
      - /1: top-bar-less<br>
      - /4: top with extended flat section<br>
      Some more "Eurostile-Extended-like" clients for customization: <a class="freelinking external" href="http://www.houseind.com/fonts/housegothic23" rel="nofollow">House Gothic 23</a> Extended, <a class="freelinking external" href="http://www.typography.com/fonts/forza/overview" rel="nofollow">Forza</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/t26/myers-sans" rel="nofollow">Myers Sans</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/from-the-stars" rel="nofollow">From The Stars</a>, Latin counterpart of <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/arian" rel="nofollow">Arian</a> (variation on Eurostile Extended), <a class="freelinking external" href="http://www.myfonts.com/fonts/cheapprofonts/bitsumishi-pro-v2" rel="nofollow">Bitsumishi</a>, <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/miedinger" rel="nofollow">Miedinger</a></strong> (probably my choice here), <a class="freelinking external" href="http://haroldsfonts.com/portfolio/metro-df" rel="nofollow">Metro DF</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/geom-graphic" rel="nofollow">Geom Graphic</a> (nice too)</p>
