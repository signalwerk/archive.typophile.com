      <p>That’s because it appears to be custom.</p>
      <p>Closest commercial typeface is Eurostile (Extended or Extended Semibold should do the trick):<br>
      <a href="http://www.myfonts.com/fonts/linotype/eurostile-next/" title="http://www.myfonts.com/fonts/linotype/eurostile-next/">http://www.myfonts.com/fonts/linotype/eurostile-next/</a></p>
      <p>You’ll have to customize the |4| to match, or pick it up from this typeface:<br>
      <a href="http://www.myfonts.com/fonts/typodermic/rexlia/" title="http://www.myfonts.com/fonts/typodermic/rexlia/">http://www.myfonts.com/fonts/typodermic/rexlia/</a></p>
