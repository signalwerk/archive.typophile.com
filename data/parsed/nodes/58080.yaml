  html: <p>Every so often I find I can't seem to control the editing layers palette. I keep "auto select layers"unchecked so that I don't accidentally grab a metrics line. Today even though I had this unchecked it would still allow my cursor to select metrics. I expanded the panel and hit the lock on horizontal metrics and that stopped auto selecting. Then I tried the same with vertical metrics, but it still allows auto selecting even when locked. Is there a fix for this or am I dealing with a bug in the program?</p>
  html_clean: <p>Every so often I find I can't seem to control the editing layers palette. I keep "auto select layers"unchecked so that I don't accidentally grab a metrics line. Today even though I had this unchecked it would still allow my cursor to select metrics. I expanded the panel and hit the lock on horizontal metrics and that stopped auto selecting. Then I tried the same with vertical metrics, but it still allows auto selecting even when locked. Is there a fix for this or am I dealing with a bug in the program?</p>
