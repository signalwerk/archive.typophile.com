    html: |-
      <p>&gt;Is there a fix for this or am I dealing with a bug in the program?</p>
      <p>You are dealing with unusually executed/maintained layers architecture.<br>
      The Outline layer does not behave correctly, not e.g. responding to a user's desire for it's disappearance.<br>
      The Background layer editing is controlled from a menu pick in the tools window.<br>
      The Glyph metrics are not easily locked and unlocked, causing sometimes disaster-like unwanted movement of the origin line, something I've have never ever wanted to move, But in order to have the right side bearing free to move at any time...<br>
      And this all happens in an environment where the cmmd key is so over-dedicated, one seldom has the proper tool at the end of the cursor without extra effort, and without the right cursor the arrow keys and mouse do not react properly when working on any layer. </p>
      <p>Cheers!</p>
