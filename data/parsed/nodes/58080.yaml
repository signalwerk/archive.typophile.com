      <p>Just thought to go back and see if any answers appeared. Thanks David and James. </p>
      <p>I ended up using a combination of the expanded layers menu and above menus. It was helpful in some ways because I had never made so that it required a key command to select the background before. That makes my work much easier not having to double click it back off all the time. I'm so used to using a wacom tablet which is way over-sensitive for FontLab.</p>
      <p>Stephen</p>
