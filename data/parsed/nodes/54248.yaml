      <p>I would miss it as well. Found this informative, if not sadly designed site (apparently, punctuation is patriotic):</p>
      <p><a href="http://www.nationalpunctuationday.com/" title="http://www.nationalpunctuationday.com/">http://www.nationalpunctuationday.com/</a></p>
      <p>They list at least one example of how important a comma can be:</p>
      <p><em>It’s also a day to remind business people that poor punctuation can cost your business millions of dollars.</em></p>
      <p><em>Rogers Communications, for example, one of Canada’s largest telecommunications companies, learned the hard way just how important proper punctuation could be, when an attorney misplaced a comma in a contract with a company that agreed to lay Rogers’s cables across the Maritimes. A Canadian court said ignorance of correct punctuation was no excuse and invalidated what was believed to be an ironclad five-year contract. That errant squiggle alone cost Rogers $2.13 million. There’s a link to the newspaper article about this case below.</em></p>
      <p>The power of punctuation!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/prod-tshirt-apostrophe-lg_6114.jpg"></div><p></p>
