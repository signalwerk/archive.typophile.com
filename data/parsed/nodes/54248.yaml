    <p>I read in (my dad's) Telegraph this morning that some bright sparks want to eliminate the apostrophe. Particularly the possessive. It all started, apparently, with Birmingham city council in the UK deciding to drop it from all road signage in the city.</p>
    <p>Thoughts?</p>
    <p>I'll miss it!</p>
