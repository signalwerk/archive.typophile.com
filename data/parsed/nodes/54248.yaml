    html: |-
      <p>Plenty of people have lamented the disappearing possessive apostrophe. Nothing new there.</p>
      <p>BUT . . . let's keep in mind that this lack may be offset by the far too frequent addition of an apostrophe where none is needed. Many folks think one is needed to make a noun plural. This sentence just came around in an internal e-mail:</p>
      <p>"The Parking Booth will continue to be staffed on Monday’s."</p>
      <p>So perhaps the world supply of apostrophes will remain stable thanks to both correct and incorrect use.</p>
      <p>powers</p>
