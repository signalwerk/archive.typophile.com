    html: <p>Speaking of oddities -- and correct me if I'm wrong -- but those of us who use English are accustomed to words of Greek origin with an "f" sound being spelled with a "ph". As in 'philosophy'. Now the Germanic languages allow an "f" in these words. But why a mix, as in <cite>filosophy</cite>?</p>
