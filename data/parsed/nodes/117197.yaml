      <div class="comment-spam-body"><p>Two good finds Ryuk. _ANNE &amp; GLEN_ and _NAVARRO_ are really close to Military Document -- almost a handwritten transcription modified to fit the logo format. Or a transcription of the original typewriter typeface that was used as the basis for Miltary Document. Geeoh as _Far Web_ is spot on. Note the edited _a_ and _b_.<br>
      Don</p>
      </div>
