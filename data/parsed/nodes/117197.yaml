      <p>Hard to say... Each time I had to deal with Jørgen Grotdal work, almost everything was hand-drawn. This time, assuming Trend Hand Made Ltt is for 'QUALITY' and 'GOODS', that let us:<br>
      - 'ANNE &amp; GLEN'/'NAVARRO': 3 /E, 4 /N, 2 /A and 2 /R, all different so most probably hand-drawn<br>
      - 'Far web': as usual close to <a class="freelinking external" href="http://www.dafont.com/thats-font-folks.font" rel="nofollow">That's Font Folks</a></p>
    html_clean: |-
