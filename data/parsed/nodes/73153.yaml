      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Uniform_Capitals_5211.png"></div><p></p>
      <p>Above: Uniform – Medium with unadjusted Capital U<br>
      Below: Uniform – Medium with adjusted Capital U to compliment the lowercase.</p>
      <p><strong>Opentype Implementation</strong></p>
      <p>Yes, I think what I am suggesting would be implemented by 'case' feature.</p>
      <p>From the user perspective this is best done with the 'case' feature accessed [InDesign] by 'Character' palette chosing 'All Caps' from the drop-down menu.</p>
      <p>The result would change all the capitals to a slightly darker design where all the capitals work well together OR if the weight of the caps is fine just swapping out Capitals that were modified to get the harmonious result with the lowercase.</p>
      <p><strong>In more detail the mechanics of the relationship of Capitals to lowercase and why I think Capitals become darker in the design process:</strong></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/In_On_Sentance_Case_4602.png"></div><p></p>
      <p>Above: Uniform – Light with unadjusted Capital I and O.<br>
      Below: Uniform – Light with adjusted Capital I and O to compliment the lowercase.</p>
      <p>From my study and experimentation - I see that the 'capital O' has a different relationship to a string of lowercase letters than a 'Capital I'. If after adjusting (independently) the the weights of the O and I in relation to a lowercase string of letters I then  comparing them side by side again - it is seen that the I is lighter than the O. (See below)</p>
      <p>[Note for illustration below: I actually see that the I is lighter (more than I would expect) than the O in the original so I will have to repeat this with another font design to confirm my idea.]</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/UIO-Caps_6386.png"></div><p></p>
      <p>Above: Uniform – Light with unadjusted Capital U, I and O.<br>
      Below: Uniform – Light with adjusted Capital U, I and O to compliment the lowercase. Brought back together I expect to see irregularities in weighting across the Capital set of Glyphs.</p>
      <p>As a designer - this doesn't seem logical and so the natural tendency is to darken up the I and then even perhaps further darken all the capitals so that they all look darker (and not just the straight ones). This is certainly a trap if your original intention is to have an even look to your set text.</p>
      <p>This therefore suggests that a set of capitals exist within the font file that are presented when the user selects 'All Caps'.  The point being that if the user sets a title using the Shift key - the Title wont be either be optimised typographically (as is the normal use for 'All Caps'/'case' feature - as Nick mentioned) or aesthetically correct (my theory), as the letters presented by a Shift key action are in fact an extension of the lowercase and not true capitals...  but <strong>Sentence Capitals</strong>.</p>
