      <p>As I understand it, the history is somewhat different. The Roman caps came first, but the usual written caps for Latin don't seem to have been the Roman Imperial caps that we know from inscriptions, which are now held to have been first painted with a brush, then incised. They are broad and upright, whereas the Rustica hand is more slanted, with a different stress. The various Roman hands evolved through scribal use into something like our lower case, known as the Carolingian Minuscule. The Carolingian Minuscule was only married to the Imperial caps in the 15th century, at the time type came into being. Then the Carolingian Minuscule was made more upright and retrofitted with more symmetrical serifs, to match the Imperial caps more. </p>
      <p>It is a perennial question how bold to make Caps. Historically, Jenson had taller caps and Griffo (as in Bembo) made them shorter to harmonize better with the lower case. But still remaining bolder. To maintain even color (apparent same density of black) with their larger size and different structure, the caps need to be bolder. So contrary to Michael, I don't think that there is a decisive argument for lighter caps to match the lower case. </p>
      <p>But you can do it however you want, and if it works visually with a given design, it works. </p>
      <p>For myself, I think that you never really overcome the fact that the Caps and lower case were originally different hands, and have quite different structures, except for a few letters. And the difference is used to mark the beginning of sentences and also proper names. In German also nouns. So my philosophy is not to try to minimize the differences between lower and upper case, but to use the contrast for the different purpose of the caps in relation to lower case. </p>
      <p>However, I recognize that there are lots of legitimate ways to deal with the issue. </p>
      <p>As far as the design of the Caps, I think I remember reading Jonathan Hoefler arguing that more evenly wide caps work best to match the lower case, whereas varied width—eg. Trajan works best in all caps. So that would argue for different designs for all caps. But this again seems to be more of a choice than a decisive argument. </p>
      <p>The thing that does seem to be a stronger argument, in my view anyway, is that tighter spacing of Caps works best for harmony with lower case, and in all caps wider spacing looks best as a rule. This was traditionally taken care of in metal by spacing out all caps, and now by tracking out all caps in digital. It can also be done automatically through the "cpsp" feature in open type. However, it seems that in titles custom kerning is generally needed. There maybe you could do more to make the default better, but it seems that even size variation affects kerning, and that custom kerning is needed anyway for best looking titles.</p>
