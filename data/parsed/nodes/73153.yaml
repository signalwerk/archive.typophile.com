      <p>All caps: that would be in the OpenType "titling" feature. It's the original definition of the feature, and Adobe Garamond was the first digital face to implement it, c.1990. I don't know of any other faces that have separate titling capitals, offhand.</p>
      <p>BTW, Goudy's Kennerley (1911) was designed because he found the text colour of Caslon (IIRC) too spotty, due to its prominent capitals, or so he says in his book.</p>
      <p>I don't think it would be a good idea for the letter glyphs to change from normal caps when "all caps" is applied, that's not what people expect to happen.<br>
      I mainly use that feature for changing to a set of figures that harmonizes with capitals, and raised punctuation.</p>
