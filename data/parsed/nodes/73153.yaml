      <p>Actually, all caps would be the OpenType "case" feature. InDesign and others support it, and invoke it automatically when text is formatted as all caps. But I agree with Nick that a huge change would be disturbing.</p>
      <p>Titling may or may not be all caps, but is always intended for larger sizes. It's more of an optical size feature than an uppercase feature.</p>
