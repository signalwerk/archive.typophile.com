      <p>Continuing down the Rabbit Hole...</p>
      <p>Interestingly Williamson in 'Methods of book design' alludes to the light weight nature of the capitals of Juliana (1958). Knowing that Juliana is firstly a book face I think that Sem Hartz had the sensitivity to look at the capitals as an extension of the lowercase and not a bolt-on necessity which so easily is the case when getting a typeface to market. </p>
      <p>Also, the capitals in Juliana adopt appropriate width. Each letter seems to have a sense of them-selves. This is clearly seen with the capital letters E, F L and P.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Juliana_5691.png"></div><p></p>
      <p>Linotype Juliana, 1958 by Sem Hartz</p>
