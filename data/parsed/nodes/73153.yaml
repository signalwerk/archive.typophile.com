      <p><em>I think that Sem Hartz had the sensitivity to look at the capitals as an extension of the lowercase and not a bolt-on necessity which so easily is the case when getting a typeface to market</em></p>
      <p>This is clearly a case of putting the Descartes before the horse ("I think, therefore I tend to over-think."). With the Roman alphabet, the uppercase letters came first, and the lowercase letters became a bolt-on <em>convenience</em>. You have developed an elegant theory which solves a problem which doesn't seem to exist anywhere else but in <em>your</em> mind, and—as Nick Shinn suggested with his question "Have you researched user behavior?"—probably isn't terribly practical to apply.</p>
