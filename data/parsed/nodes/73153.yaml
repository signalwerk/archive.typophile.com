      <p>This won't work, because people will use the keyboard shortcut/All Caps command to capitalize a phrase in running U&amp;lc text.<br>
      That's what I do, and I assume that many others do as well.<br>
      With that scenario, your "Sentence Capitals" would really stand out, against the normal capitals elsewhere.<br>
      You can't expect people to use small caps, and some will want to use All Caps for a couple of words after a drop cap, &amp;c.&amp;c.</p>
      <p>Have you researched user behavior?</p>
