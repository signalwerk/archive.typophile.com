    html: |-
      <p>We can assume user behaviour (at this point)  to be to get approximate results using the minimum of effort.</p>
      <p>We can also assume that OpenType features are not used very much - but the features are there for those who want to take advantage of them.</p>
      <p>We would all be interested in seeing figures or a breakdown in OpenType usage in sectors of publishing output. This is not something I personally see any benefit in doing and would be happy to work on my two assumptions above.</p>
      <p>Regarding an obscure feature not instantly understood even by OpenType guidelines - there maybe some users who would perhaps want to achieve such a typographic effect, but this as you allude to would at the cost of knowing to do something beyond what is usual practice and actually understanding the benefit of doing it.</p>
      <p>I am fully aware there might only be a user group of one that might demand such sensitivity, but that is all I would need to continue considering this. Though I am concerning myself with what is a very small avenue of innovation - it is an innovation nonetheless, and I see this along with other small innovations or ideas as the reason for my working on any font. I find it unnatural to accept the status quo over working though a concept or innovation.</p>
      <p>Perhaps after working out though investigation as to if there *is* any benefit of Sentance Capitals (as a concept) would I then work on the practicality (from a user perspective) if it generally might be accepted or used. Perhaps even to devising a strategy by which the user is rewarded by their extra effort?</p>
      <p>I really don't want to get bogged down in OpenType functionality or user scenarios though discussion so far has been enlightening and shown me what I was originally considering (Titling Alternatives) to be incorrect. [Thanks]</p>
      <p>In this case, as you can see, the font itself does not lend itself to drop caps or All Caps anyhow. I see the default being Caps that work with  the lowercase. Another design/model - Different story.</p>
