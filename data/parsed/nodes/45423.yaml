      <p>as a design student here in Ontario, I'm saddened that although I'm taught typography, the font design element is totally missing.</p>
      <p>I would love to have had a course that would teach me these things as a 1 year add-on to my 3-year design program, but once you start adding silly requirements of design experience and all that I just can't make it.</p>
      <p>Look, when I'm done, I'm shipping off - once I go out into the design world I'm not going for 4 years and then going back, I'm gone.</p>
      <p>I think you need to set the standard high and if they meet the standard, they make it, if they don't they don't, but making silly arbitrary prerequisites like years of design experience and a 2-year diploma go a long way to alienate potential students, but still don't solve the problem of students who have those requirements but still aren't up to snuff.</p>
      <p>I say have an entrance portfolio and interview and use that instead.</p>
