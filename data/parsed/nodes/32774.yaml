    html: |-
      <p>David, I find myself stuck between two poles. L feels very much in the mold of Jenson's 1470 pages, serene, calm, and even in color. But the letters feel just a squeak too letterspaced and open. R feels very bunchy, blobby, hiccupy. I do not feel as drawn to it for its darkness as others have been. While there have been some comments about individual letter structures and side-bearings -- things that might concern us technically -- I am concentrating on the experience of the reader, who (if I understand this correctly) reads in gestalt clumps and does not perceive individual letters. </p>
      <p>I think I end up reading R more quickly, taking in the gestalts with more sureness, but it is fatiguing underneath because of the clashes of light and dark, the bunching of things.</p>
      <p>L feels a lot calmer, but sometimes in the sameness of color (goose-stepping as Nick said above . . . or I thought of a picket fence) I cannot find my way as quickly in processing the words; I see the individual letters one after another and that reduces my ability to take them aboard in clumps.</p>
      <p>What if I said I would not like either one as a "forever" companion, but something in between?</p>
      <p>Also, are these meant to be read only on screen? (which I have done at 100%.) </p>
      <p>If I had to pick one to read forever I would pick L.</p>
      <p>Was this helpful? Hope so.</p>
