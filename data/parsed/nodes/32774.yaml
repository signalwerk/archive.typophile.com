    html: |-
      <p>Thank you all. I lied as in "This is simple."© ;)</p>
      <p>The most surprising thing to me: blur never came up, in word or root. Whew!</p>
      <p>The x-hts are identical. Both samples use the same rendering, are from the same page in the same application on the same OS at the same time... only the font software has changed...and then, only TT instructions within the glyph data table. </p>
      <p>If you like the sample on the right, you are all set. Many of the CT rendered fonts in Windows Vista will appeal to you as will type on the Mac and TV. Unless you return to print, or upgrade to a higher resolution LCD screen (or sample one), you will not know the difference. </p>
      <p>IF CRT: This is not a good test for CRT-users, apparently. Sorry, when are your birthdays and how wide is your CRT's desk space?</p>
      <p>If you like the one on the left, you might soon be able to get up to the same speed and comprehension as you read in print. </p>
      <p>The primary difference between the two samples is that one is prioritized for the rhythm and reading on screen, and the other to match the widths when printed. </p>
      <p>If you are not sure, I will work to improve both sides, and I hope you read again without thinking any more about this. Now watch the roving center period...you are getting sleeeeeppy...your eyelids are heavy...you hear a yawn...</p>
      <p>Insomniatic Typophiles: An "abundance" of pixels are used in rendering digital outline fonts on the Mac (and in Cool type) because those mechanisms don't "really" use hints and anti-aliasing simultaneously for screen font rendering. Both designs in this study were made just light enough to avoid being too dark on the Mac. In Vista, (where hints and anti-aliasing are encouraged to work together), rendering is very light. So, some of the hairlines of the Mac version "burnt out" in Vista rendering. When I first saw this I thought "I scanned some overused metal by accident?", and I liked reading it very much. Though I still do, so much for personal opinion.</p>
      <p>Thank you all again, I've learned so much. </p>
      <p>Cheers!</p>
