      <p>When I taught at design schools, as my students became overly concerned with grades, I would tell them that, "no one is going to ask you what grade you got in Typography 3 all they care about is your ability to demonstrate to them that you can do the work." I also told my students that I had never gone to design school, and was pretty much self taught, with the occasional night school class at SVA.</p>
      <p>I know there are firms in NYC that only consider graduates from certain programs (or at least heavily favor them). But I wonder if the era of the self-taught designer is still with us, or is it over?</p>
      <p>I stopped teaching at design schools, because I came to realize that I could no longer be apart of a factory system that takes in students, charges them extraordinary tuition, and essentially gives them vocational training, rather than an education. A small fraction of these students will go on and get work, the rest will do something else, but they will be ill prepared to do that something else since they have received a sub-standard education. Some of those ill-prepared students, who couldn't land a design job will go on to graduate school, rather than give up on their dream of a design career.</p>
      <p>At approximately $40,000 a year for a top design school, how can you justify $160,000 to $250,000 in loans for a career that will start you out in the high $20K low $30K and will take years to advance to a modest 6 figure income?</p>
      <p>I don't have any real answers to my complaint. I have said before that design is the new acting, and every year students invest heavily to enter schools for both fields. The acting students go in with their eyes open, being told from the very beginning how difficult it is to make a living as an actor. New design students have not been given the same good advice.</p>
      <p>James</p>
