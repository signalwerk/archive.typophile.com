    html: <p>There are many kinds of success. Louis Kahn is one. But think of the standard american paperclip. That is one seriously successful design! If by success you mean ubiquity and such deep penetration into the culture that the design itself ceases to even invite question - almost like air. Agreeing to a kill fee and walking can be a huge success too. I am of course not advocating for any of the above per se. Just saying that inevitably you place your own goal posts and in so doing keep your own score.</p>
