      <p>It is easy to say look at this one, he/she made a difference or was important etc; and he/she didn't get a degree and so on. There is no shortage of examples of amazing self starting folk. But they are exceptional. </p>
      <p>If you are going to decide that university or other training doesn't matter you had better be ready to throw 110%+ at getting where you want to go on your own.  That is a rare sort of person and you had better be honest with yourself about if that's the kind you are.</p>
      <p>The converse is also true. Good grades at school don't always translate into success afterwards - but they don't hurt one bit. Not because the work itself is necessarily a key to or identical to what real jobs are like, but because learning how to hit the task hard and keep pushing until you get the result you want is not something everybody knows how to do. Getting good grades shows know how. That you have the will to get things done and are probably not going to be a prima dona about it.</p>
      <p><cite> PS isn’t it the attitude, the personality, the way one thinks and the passion for design that REALLY matters or all of the above and more so? </cite></p>
      <p>No. They matter but they are far far far from being enough. If that were so then everybody who was a laugh at a party would be hugely successful. They are not. It takes hard work.</p>
