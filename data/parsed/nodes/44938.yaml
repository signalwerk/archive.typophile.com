      <p>I don't think it's necessary to have them pass fail.  Well, maybe at a school that doesn't nothing but design, but with an art department there's no reason to keep up the standard system:</p>
      <p>F: You didn't do the assignment<br>
      D: You tossed it together the night before<br>
      C: You did the assignment as instructed<br>
      B: You <em>really</em> did the assignment, good job.<br>
      A: You went above and beyond all expectations and produced something above the expected level.</p>
      <p>At my university, you could still eek out a good grade in a failed* project (I'm thinking about my senior new media project...) if you documented the creative process and then turned that documentation into a project in and of itself since part of the idea is to learn through your projects.  If you showed you had learned and how you might have done things differently to have gotten a  successful project, you might not get top marks but still good ones.</p>
      <p>Also, if you're planning on working in the public sector (not the best place for design jobs, though they exist, but I'm sure I'm not the only one who isn't a designer by day on here), the degree is absolutely necessary.  And while grades might not matter hugely, though I have been asked for transcripts (again, not a design job), if you plan on working in another country and need to convalidate your degree which you must do for all public and some private jobs, course selection can be more important than grades.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
      <p>*failed here meaning one realized it was impossible to complete the objects one had set out for oneself at the beginning, as opposite to turning in crap work or non-existent work.  In my case, I couldn't secure the equipment I needed, though it didn't matter since I got tripped up on my networking code)</p>
