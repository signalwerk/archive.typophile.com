      <p>I was a student that had to be reduced to tears before I really grasped what it was I was attempting to do. Yeah, I think the teacher was a little over the top, but his kind of teaching put me on the right track. When I became a teacher I consciously avoided doing what he did, but never forgot the lesson he taught me. In school the teacher was the client, so I always worked to please the teacher. I was lucky. I had teachers that I could trust in that I knew if they approved of my work it meant it was good. In life I work to please the client. Underlying all of this "pleasing of others" is me making sure I think I'm still doing good work.</p>
      <p>It isn't about becoming tough. It is about understanding. Understanding the clients needs in terms of how you can solve them with what you have to offer.</p>
