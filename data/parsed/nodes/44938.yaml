      <p><cite>It isn’t about becoming tough. It is about understanding. Understanding the clients needs in terms of how you can solve them with what you have to offer.</cite></p>
      <p>And about recognizing that if your client is not ultimately satisfied with the work, then your design was not successful, regardless of whether or not you agree with him. It can be extremely frustrating when a client asks you to do something you don't want to (I'm dealing with this right now on a book cover) but you need to pick your battles and if you alienate the client you lose the client. Some are worth losing, but in this economy... that's not a luxury I want to take. It can also be hard to avoid "design fatigue" which is that point in the design process where you are willing to do almost whatever they ask in order to get the job DONE and your invoice paid. It happens, and the more experience you have (and the more extensive portfolio) the easier it is to accept that some jobs are just not going to end up in your portfolio.</p>
