      <p>James,</p>
      <p>To say a design was not successful is not the same thing as saying it was not good. Clients reject excellent designs all the time often for very misguided reasons. But as Ken points out we are in the business of servicing said clients and if the client doesn't get what they want we have not done our job. Sometimes the best thing to do is agree on a kill fee and walk away.</p>
