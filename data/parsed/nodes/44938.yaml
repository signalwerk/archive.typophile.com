      <p>"a tough cookie could turn so hard, so nasty...it might start hurting others."</p>
      <p>But tough nasty cookies don't get return work. The trick is, the client gets to be nasty but the designer has to remain calm and positive. This is the thick skin part and why good people skills are important for success. Designers provide a service to a client. Clients can choose to use you for that service or hire someone else. Very few very sought after designers have the luxury of choosing clients. Those lucky few did not find themselves in that position by being nasty to clients. Designers have to learn how to be skillful communicators and collaborators. Would you hire someone who was nasty to you? There is a big difference between a designer who has done their homework and speaks effectively and can get their point across without negative behavior and an egocentric bully who is so demanding that nobody will work with them.</p>
      <p>ChrisL</p>
