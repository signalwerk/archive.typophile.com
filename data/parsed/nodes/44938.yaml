      <p>In my opinion, everyone should get to university and if it's a good one, better. Now... there's good and bad university's , some School's as James said can pass you a wrong idea of whats the industry or how it works leading many people to abandon design later on. And there's the good ones that will make you grow both professionally and as a person. On top of all that...there's the school as an Business so of course it's of they're best interest to appear on the charts.</p>
      <p>Basically for me where you studied or your grades are important at a first/superficial look/evaluation only to know something about you and your path. But what really matters for me is the works you did, your personality, your will and how you work.</p>
      <p>So if you wanna do something risky and different, do it at school, and learn from it, explore yourself. See the other's reaction and take advantage that there's no client or money involved :) Just evolve as a person and learn something more then just designing, that's what's University is for.</p>
