    <p>Does it matter what degree classification you have? I mean a 1st or 2:1 or do you think too many people think too much about it, as they never get asked what classification they get in employment. Do they? At the 4 designers conference in London, they mentioned the fact that no one asks about it. Is this a good attitude to give out to students or erm...bad? WOuld just liek your views on it. Thanks.<br>
    PS isn't it the attitude, the personality, the way one thinks and the passion for design that REALLY matters or all of the above and more so? Please enlighten me.</p>
    <p>PPS Would you rather be daring when it comes to design and fail or would you be safe and get a good grade?</p>
