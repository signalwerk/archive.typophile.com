      <p><cite>…if your client is not ultimately satisfied with the work, then your design was not successful, regardless of whether or not you agree with him.</cite></p>
      <p>Rubbish. A design can be quite successful and never satisfy the client, because clients  may simply be stupid and desire random changes that undermine the requirements they set forth in the first place. Sometimes the designer has failed to communicate why the design works in a way the client can understand, but sometimes the client is just plain stupid.</p>
      <p>I once worked for a client who requested an advertisement on a very short timeline, designed to fit into an existing campaign. Several successful ads were produced, the client chose one…and requested a minor aesthetic change. The change was made, and then the client requested another, and another and so on. Fourteen color shifts, shadow angles, weight changes, etc. later the window of opportunity was past and the ad died. Every version was a successful design, but the client could not be satisfied because the client was stupid and refused to be satisfied.</p>
