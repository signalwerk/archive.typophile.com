    <p>Mark Simonson (b. 1955) is an independent type designer living and working in <a href="/node/add/wiki?edit%5Btitle%5D=Saint%20Paul" title="Create node &quot;Saint Paul&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Saint Paul</a>, <a href="/node/20058" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Minnesota</a>, <span class="caps">USA</span>. His fonts and other work can be seen at his website, <a href="http://www.ms-studio.com/">www.ms-studio.com</a>. He also maintains a blog called Notebook at <a href="http://www.marksimonson.com.">www.marksimonson.com</a>.</p>
