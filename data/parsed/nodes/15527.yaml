    <p>Mark Simonson (b. 1955) is an independent type designer living and working in <a href="/wiki/Saint%20Paul" class="freelinking" rel="nofollow">Saint Paul</a>, <a href="/wiki/Minnesota" class="freelinking" rel="nofollow">Minnesota</a>, USA. His fonts and other work can be seen at his website, <a href="http://www.ms-studio.com/" rel="nofollow">www.ms-studio.com</a>. He also maintains a blog called Notebook at <a href="http://www.marksimonson.com." rel="nofollow">www.marksimonson.com</a>.</p>
