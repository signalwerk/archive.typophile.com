      <p>The typeface seems to be pre-digital, as it shows up in the 'Homage to the Alphabet' book from Phil's Photo from 1985. This looks like the Heavy weight. Treacyfaces <a href="http://www.treacyfaces.com/050806_TFWembley_2c5a.html" rel="nofollow">Wembley</a> is based on this, but he has only the light weight of it. </p>
      <p>- Mike Yanega</p>
