      <p>In InDesign CS3 we added some functionality to improve the placement of dropcaps. In the dropcap &amp; nested style panel there are 2 new checkboxes:<br>
      <strong>Align Left Edge</strong> which adjusts the left edge of the dropcap based on the ink instead of the pen position. So, characters with positive or negative left side bearings are affected. There is a subjective element, I know, but our algorithm places the dropcap's left-most ink at the same position horizontally as that character's ink would be at the body text size. So the cap-J would hang outside the box slightly and the sans-serif H would be indented a tiny amount, but nothing like the original just-scaled version.<br>
      <strong>Scale for Descenders</strong> if the dropcap extends below the baseline (cap-J sometimes, dropped words) then we can scale the dropcap smaller to place the bottom of the ink at the position the same text would be below the baseline in body size.  Some designers would prefer to drop more lines to keep the dropcap the same size, and some designers wanted the number of lines to remain constant -- we only implemented the latter.<br>
      In the Japanese version we added some additional controls to control the dropcap's relationship to an underlying character grid.<br>
      Hopefully, less manual work would be required.</p>
