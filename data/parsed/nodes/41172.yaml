      <p>Kent:</p>
      <p>That's great. I am curious about how you discovered that trick. I came across the same kludge maybe around 1990, and have relied on it ever since [I'm still a Quark guy]. I always set an en space in front of the drop.</p>
      <p>It should be pointed out, though, that the part of the sort that falls outside the text box will not show on screen. It prints correctly, but it scares the bejabbers out of others who might look at your Quark file. At least that's always been my experience.</p>
      <p>I also use this to hang open quotes when I'm designing a jacket or cover and have to set the blurbs. This way you need not make any other calculations about your text box width and hanging indents, etc.</p>
      <p>I have gotten so used to doing this that it is second nature, and no longer seems awkward.</p>
      <p>A few years ago I showed this to my typography class, and I called it the "$50 type trick." One student, a career changer about my age, somehow managed to win 50 bucks off his graphic designer son and a bunch of his designer pals, all of whom thought they were hot shots with the fancy type stuff. None of them could follow it.</p>
      <p>I'm glad you know this, and I'd be curious to know if others use this.</p>
      <p>powers</p>
