      <p>&gt;&gt;&gt;  (Is there a term for the third option, where the type hangs into the left margin — Hanging Initial?)</p>
      <p>Yes. There is indeed a term for a drop cap or a stick-up initial that hangs into the left margin. </p>
      <p>This is called GOOD TYPOGRAPHY.</p>
      <p>And it is not done as often as it should be. When that large cap is C G J O T V W or Y, you will want to hang it into the margin. How much depends on your overall design, and the types you are using, and your own eye. Even such seriffed caps as E and others with  strong vertical strokes may want to be hung out so the edge of the left side of the type block continues up with the vertical, and the serifs are hanging.</p>
      <p>As for those "contoured drop caps", that also is not done as often as it should be. Too many large initial cap L or A are too far from the following sorts. Snug 'em up; make some nice-looking type.</p>
      <p>I do not know why these things are not done more. Laziness? Not knowing how to do it? Or, hell, maybe it just an aesthetic different than mine.</p>
      <p>powers</p>
