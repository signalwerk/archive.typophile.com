      <p>Hanging initial sounds good to me. I call the example posted "drop caps" and that is how InDesign refers to it. I would use the term "raised cap" for a large initial letter that is on the baseline (e.g. <cite>Harper's Magazine</cite>).<br>
      We also start talking about "contoured drop cap" to refer to a more fitted look that you might get on the right with some dropped characters (A, V, W).  There is also the dropcap that has the first line snug, but the rest knocked out as a block. Don't have a good name for that one.  <cite>National Geographic Magazine</cite> has many interesting examples of all of these.</p>
    html_clean: |-
