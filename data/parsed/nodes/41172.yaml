      <p>We use the same trick to optically align Drop Caps or hang quotes using InDesign, but rather than a using a justifying word space or an en space to kern against, we use a 0-width space (U+200B). I admit I don't know if the zero width space is in InDesign as a default; I always add 2002 through 200B to a font. You have to go to the General Punctuation region anyway, to make up 2032 (prime/minute/foot), so why not add the extra spacing? The things the foundries forget . . .</p>
      <p>As I remember, you can't easily kern more than 1,000 with InDesign, why give up whatever the amount for some other space?</p>
