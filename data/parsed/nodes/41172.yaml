      <p>Using the Type &gt; Story &gt; Optical Margin Alignment will do it, but only if you want optical margin alignment for the entire text. And even then, it doesn't really hang much (depending upon the character), but it'll pull back to zero in most cases.</p>
      <p>When optically adjusting the left alignment of a drop cap, I rely on a trick I developed way back in my early days working in Quark:</p>
      <p>Instead of setting the Drop Cap parameters on your paragraph to 1 char, set it to 2 char. Then insert a space as the first character of the paragraph. Now you've got something you can kern against. Place the cursor in-between the space and the first letter (your drop cap) and negative-kern away until it hangs out into the left margin just the way you want.</p>
      <p>It's a bit of a kludgy, manual operation; but it allows you to get nice, optically aligned drop caps that travel within the text box with your paragraph and will continue to adjust with leading changes, etc. Better than a separate text box with runaround on it for the drop cap and manually sizing and aligning. I also found this trick easier to implement than an anchored box. </p>
      <p>Maybe someone knows a better way these days.</p>
      <p>-- K.</p>
