      <p>Will -- I suppose I adopted this technique about the same time as you. I think I started working in Quark around 1989 (Ready Set Go before that). I imagine I would have developed this trick within about a year or so.</p>
      <p>How? I don't know; I had a problem to solve and I just worked out as elegant a solution as I could muster.</p>
      <p>BTW, in InDesign, text rasterizes completely even when it extends beyond the text frame. That makes this trick easier to manage in InD than Quark. I'm not sure why you set an en space. Shouldn't matter one way or another, except that an en is usually wider than most word spaces, so you just have to kern back further.</p>
      <p>Chris -- For a while I was thinking you could go one step further and automate most of this trick with InD's nested styles. You could define one char style for the drop cap and define a secondary char style ("drop space") for the initial space, building in a large negative tracking value to accomplish the kerning (a work-around, since you can't define kerning values in a stylesheet). A single average value would allow you to get all straight-sided caps just right; others would need additional hand-tuning.</p>
      <p>Unfortunately, it turns out that InD only lets you assign a single char style to the whole drop cap definition. Any nested styles read past the drop cap and pick up after. You can't get the nested style definitions to affect part of the drop cap. I guess drop cap definitions supercede the nested styles. </p>
      <p>Oh well. It was a good idea and a valiant attempt.</p>
      <p>-- K.</p>
