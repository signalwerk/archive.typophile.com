      <p>Just after I made that post about the $50 type trick, I started working on a new book design, using Quark 7. I wanted to hang opening quotes in the first line in the book, so I dropped in the en space and kerned the quotes back to the left.</p>
      <p>LO &amp; BEHOLD! I could see the quote marks floating there outside the text box! Finally.</p>
      <p>This shows what happens when a book designer becomes a production manager. He or she has less opportunity to do the really pleasurable part of the job: book design. I now "manage" design more than I do it, and this may be the first time I had the opportunity to apply that trick in Quark 7.</p>
      <p>As for the en space: It just seemed better to me to apply a fixed-width space than a justifying word space. It may have made no difference, but it is a habit I got into.</p>
      <p>powers</p>
