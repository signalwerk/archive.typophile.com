    <p>Hi there,</p>
    <p>Ive decided to delete the previous thread because it was just too cluttered and the images were H U G E !</p>
    <p>So starting afresh:</p>
    <p>ive spoken to the client who insists on having an ‘edgy’ invite. Title was also chosen by her so i cant do much about it.</p>
    <p>She also specified she wanted a black invite so i thought this was a great opportunity to play around with spot UV varnish.</p>
    <p>I was thinking of using Didot Elder for the title as it has devilish arrows on some of the letters which could look quite cool ( yet to purchase it), also a nice italic would be an option ( didnt nail it with my choice so far). Any suggestions would be much appreciated. something elegant and almost hand written might look cool.</p>
    <p>I was also thnking of incorporating a graphic on the front ( that will be spot uved) which references the venue in which the show will take place.</p>
    <p>What do u all think of the composition or the 2 options? The text in dark grey is meant to represent the type when spot UVed.</p>
    <p>with regards to spot uv are there any rules i should be aware of in terms of the weight of the typeface ( eg. will didot work? thin strokes)</p>
