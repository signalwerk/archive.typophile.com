    html: |-
      <p><cite>rest of the area meaning the white text?</cite></p>
      <p>No, I was referring to the other black area.</p>
      <p>Basically, you would use a 'spot UV varnish' on the text as indicated and a 'spot dull varnish' on the rest of the black to insure you could see the effect. I uploaded some images I took of the press sheet and I can't express enough how subtle the gloss varnish turned out over dark brown without the dull varnish. The printer told me they even used some new 'ultra gloss' varnish.</p>
      <p>TECHNICAL NOTE: The areas you UV varnish won't appear 'dark gray' as in your sample. The UV varnish will actually make the 'black' ink appear more rich and shiny... almost like it's wet. If you changed the dark gray text to pure black it would be more true to the final piece.</p>
      <p>Something like this...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Gloss-UV-BLK_3662.jpg"></div><p></p>
