      <p>Check your kerning on "MIS CHIEF".</p>
      <p>You could try <a href="http://www.veer.com/products/typedetail.aspx?image=JBT0001003" rel="nofollow">Cabernet</a> and <a href="http://www.veer.com/products/typedetail.aspx?image=JBT0000118" rel="nofollow">Eloquent</a> from Jukebox. They come with a little female attitude.</p>
      <p>Also, I believe the term is 'boy toy'. :)</p>
      <p>TECHNICAL NOTE: If you use a 'gloss' varnish over the black on a coated stock for the text you're going to have a hell of a time reading it unless you also apply a 'dull' varnish to the rest of the area. Also, regardless of a varnish being apply or not, those thin serifs may give you big trouble with that heavy of a ink coverage. I'd almost guarantee they will start to fill in... even on coated stock.</p>
      <p>One option you may want to ask the printer about would be to print white ink on a black stock.</p>
