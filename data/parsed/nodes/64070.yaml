      <p>Are you doing a 'dull' or 'gloss' varnish and how noticeable do you want it to appear in the end? Also, what kind of stock?</p>
      <p>The reason I ask is because some of the soy based inks have a semi-gloss appearance in heavier coverage. I did a 'gloss' varnish on a very dark brown on an uncoated card stock and afterward you could barely see it until you turned the card and it caught the light. I didn't discover this until the press check which made adding a 'dull' varnish to the other area very costly.</p>
      <p>You'll want to talk with your printer regarding your desire to use Didot at a smaller size. It may produce a less then desirable result. If you're unfamiliar with using varnish I'd ask if they have any samples so you can get a framework for appearance.</p>
