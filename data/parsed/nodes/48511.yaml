    html: <p>If either of those are fonts - and I would agree that they are surely hand drawn - then they would be found amongst the freebies (try DaFont.com). I see nothing to suggest that both use the same "font". They only have the pointed tops/bottoms in common and that is simply a style -- ala Fette Fraktur, Bradley, Becker and others.</p>
