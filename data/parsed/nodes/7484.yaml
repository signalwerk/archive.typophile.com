    html: <p>Look at Bringhurst's discussion of musical proportion. Choose a page size and text block size that proportionally work the way you want�harmony, dissonance, or drone. Then use the two proportions to develop a grid that accommodates both. <br> <br>This should allow you to work out a grid solution for a single page. Also consider splitting your page size into two pages, or four, or work it out using a two page spread and discard the recto or verso layout. <br> <br>Not sure if this is what you are looking for.</p>
