    html: <p>Are you wanting a math equation? If so I am not the right person to answer this question. However, I can say that there is an optical center of the page. This <a href="http://photography.cicada.com/pdf/opticalcentre.pdf" target="_blank">link</a> shows you how to mount a print on a matteboard in the optical center. Perhaps you can find someway of translating it for your needs?</p>
