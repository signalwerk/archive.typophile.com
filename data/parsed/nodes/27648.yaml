      <p>Hi Thomas</p>
      <p>Odeon Condensed comes pretty close. I think it was produced by Hoefler &amp; Frere Jones, but seemingly no longer available (<a href="http://typophile.com/node/13735" title="http://typophile.com/node/13735">http://typophile.com/node/13735</a>).</p>
      <p>Also the old Grotesque Condensed No.77 (Monotype, Stephenson Blake) which, like the Agency Gothic, has a high square bowl on the ’R’ and a stepped (almost horizontal) spine on the ’S’. Also (like Agency) it has an ’M’ in which the centre strokes descend to the baseline – which is unlike your example from Prague. However it may not be available as a digital face.</p>
      <p>I think Neville Brody’s <a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=LH.108002.0.0">Industria </a> does the same thing with the stepped midsection of the ’S’ and it does have a high centrepoint in the ’M’.</p>
      <p>Stephen - while you’re mentioning Bee, do you know what is the relation between URW Bee and Binder Style (which might have been by Joseph Binder 1959 for D Stempel AG)? </p>
      <p>I thought they were the same face... but I could be wrooong : 0</p>
