      <p>General structure I suppose is the same. As far as similarity to the street signage goes, Binderstile would be closer and is available digitally in two weights both from <a href="http://www.castcraft-software.com/homepage.html" target="_blank">Castcraft/Opti</a> (I’m told) and from QBF as the old Brendel fonts Report Light and <a href="http://www.qbf.de/cart/cart.exe?gif=dc.gif/Sdc02529.gif" target="_blank">Report Bold</a>. As you can sort of make out from the crappy showing, Binderstile still has lots of differences, including that R and an M that is, like all the other fonts mentioned, nowhere close.</p>
      <p>The only thing I find in predigital catalogs that was quite close to the signage (based though on a very limited showing - but that R is there) is something called Enge Wotan - and I know of no digital version. Anyone have a decent showing?</p>
