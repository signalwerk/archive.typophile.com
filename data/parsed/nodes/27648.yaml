    html: |-
      <p>Ben - I can tell you, thanks to Philippe on the MyFonts Forum, the derivation of the Bee naming. This came from the old VGC aphanumeric naming. The URW Bee fonts correspond to VGC’s B-1, B-2, B-3 and B-4. There were heavier weights up through, I think, B-11. I know of no digital version of the heavier weights.</p>
      <p>These VGC types were themselves copies of someone else’s type (I wish I knew what foundry) - which had ’G’ names like, respectively, Galaxy, Gable, Garfield, and Gamma (and so on for heavier weights).</p>
      <p>Note that these are NOT the same as Binder Style/Binderstile. Just take a look at the “corners” of any rounded character and you’ll see that Binderstile is considerably more squared off.</p>
