      <p>Hey Mike. Ah yes - it’s that wacky lowered crossbar on the ’t’ and the ’f’ that is the distinguishing feature for the Binderstile. Thanks for the reference. In that the street signs are all caps, this might work for Thomas.</p>
      <p>My reference (Jaspert’s Encyclopedia of Typefaces 1958) for Wotan Bold Condensed (and perhaps <em> not </em> the same as Enge Wotan) shows a face that is similar to the ’R’ only; the ’A’ and the ’M’ are quite different to the Prague street signage.</p>
