    html: <p>As an art director, I can tell you that my job is more concept-oriented than that of a designer. As pointed out above, the same core competencies are needed for both jobs. Do you enjoy more developing concepts and picking the right elements (fonts, illustrations, photography) and the people to pull them off, or doing the hands-on design work yourself? It's not that designers never come up with concepts or ADs never do design, but it comes down to how much time you invest in those two areas. Once you've been an AD for 3-5 years, you should be able to come up with headlines and copy points (not necessarily finished copy) and a CW should be able to come up with visuals (though not necessarily be able to art direct a photo shoot). If that is something you want to do, go the AD route. But really, school only begins your education -- you'll be learning for the rest of your life. So if the "designer" courses appeal to you more right now, take 'em.</p>
