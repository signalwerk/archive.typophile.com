      <p>I think you should reconsider the copywriting vs the packaging course. One course in package design is not going to give you much, but a copywriting course can really give you some insight and skill. Most designers are lousy writers, and writing is what you need to separate your self from the rest. If you ever get into the advertising world, it is the copy and account people who throw the most weight. Those art directors are rarely thought about past their last layout. Even if you never do the ad agency thing, good writing is a skill you should have.</p>
