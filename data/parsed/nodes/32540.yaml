      <p>Some people are more cerebral, others are natural wellsprings of unbridled creativity bristling at the seams. For instance, I'm personally not that good at randomly coming up with cool art. I have to really focus and come up with a concept. Others can point their magic finger at a pile of trash, proclaim "Art!" with a capital A, and it becomes just so.</p>
      <p>The point is, each of us has our own talents, and being able to recognize talent in others and being able to organize them together is in itself a talent. </p>
      <p>As to the Art Direction/Graphic Design degree, since they'e almost exactly the same, why not get both? Dual major. Remember though, even if you have a degree that says "Art Director" doesn't mean that you will get that specific job. You will always have to pay your dues and start out as a Jr.</p>
