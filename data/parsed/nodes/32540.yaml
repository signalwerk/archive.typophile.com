      <p>It's unfortunate that you'd have to choose between learning package design or copywriting. It also seems odd that Art Direction and Graphic Design are two different majors. </p>
      <p>I'd say you'll use the copywriting skills in almost every aspect of design, whereas package design is more specialized. Honestly, anyone with a strong core knowledge of design could probably apply it to packaging and learn it quite easily (I hope I'm not offfending any lifelong package designers by saying that). </p>
      <p>Too many designers are dependent on other people (some with very little experience) to provide them with copy. Copy can make or break a concept. To be able to skillfully craft a simple headline or a good tagline is essential to the design process, and not an innate ability of everyone claiming to be designers. Also, it will make you all the more appealing to your prospective client/employer.</p>
