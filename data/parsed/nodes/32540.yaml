    html: |-
      <p>As Ken rightly says, Art Direction would be geared towards advertising, marketing and sales promotion. Culturally and conceptually there is a big difference between these activities and the rest of graphic design. </p>
      <p>'Art Direction' is quite a misnomer because while ADs are typically paired with copywiters in ad agencies as creative two-person teams – no ad agency team I've spoken to has ever defined their work as an exact split between words and images; both parties are 'creatives' who are employed to come up with vast quantities of fresh ideas to shift product. </p>
      <p>For this reason, the advertising/art direction educational programmes that I've seen firsthand tend to put students through large amounts of ideas generation – which doesn't sound like your strongest suite. Although the visible effects of advertising art direction may appear disparate, the conceptual toolkit required is really quite small and very sharply honed.</p>
      <p>Conversely, your abilities with <em>recognizing problems and putting things together </em> make you sound like a natural for general graphic design, including packaging.</p>
