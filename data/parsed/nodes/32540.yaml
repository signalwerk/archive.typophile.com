    <p>Does anyone know exactly the difference between studying Graphic Design and studying Art Direction?</p>
    <p>I recently found out that my school offers Art Direction.  Personally, I've always been better at recognizing problems and putting things together than coming up with the ideas myself.  But then I looked at the course lists, and its basically the same classes.  The only difference is basically a class on copywriting vs. a class on package design.</p>
    <p>What do you know about the two majors?  I could follow either one at this point with no losses, but does it really matter?</p>
    <p>I radther take this package design course than the copywriting course, but thats the only thing.</p>
  html_clean: |-
