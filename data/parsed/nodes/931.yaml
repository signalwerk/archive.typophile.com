  html: <p>I'm working on desiging (or starting to design) a signage system for a college, specifically for a particular building which used to be an office building, and so has lots of hallways and suites, and now classrooms. I don't really know where to begin. Can anyone recommend resources to refer to when developing a signage system of this sort? Anything I should keep in mind besides the basic legibility and such, particularly when choosing a typeface? Thanks!</p>
