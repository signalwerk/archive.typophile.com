    html: <p>Although it is the 'corporate' face for the college, I don't think Baskerville would be an appropriate choice for a signage system. The contrast is too high and the type too feeble to function well as a signage type. <br> <br>The 'corporate' face for the Vancouver Public Library system is Didot, and, believe it or not, that's what they use for all their architectural lettering and signage across the system! It's bloody hard to read! The hairlines almost disappear! <br> <br>It sure would be nice to use something that subtly convey 'ancient sacred dignity' in one way or another, but I feel that it need not be a serif type. Have you seen the new Anglican service books? They use Gill Sans in black and red they they look very diginified and religious. Yet modern. It's a great design, IMHO. <br> <br>I have a semi-sans that might work well for this project, but unfortunitely it hasn't been produced yet :-P</p>
