    html: "<p>To answer Hrant's questions: <br> <br>No, I don't need to respect any previous signage, because until now it's all been very inconsistent and not very good. There is, however, a new trademark: <img src=\"http://www.typophile.com/forums/messages/30/14202.gif\" alt=\"\"> which uses ITC New Baskerville and a bit of another face. The signage may or may not incorporate this logo. This is a Bible college, and so all the majors at this point are Biblical studies and training for pastors and that sort of thing. Therefore I'd like a look which conveys an idea of ancient sacred dignity or something like that.</p>"
