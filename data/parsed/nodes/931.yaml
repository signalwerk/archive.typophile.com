    html: "<p>I really don't have much experience designing sign systems themselves. I've only done one signage project ever, and it was only temporary. <br> <br>As far as typefaces go, the requirements for internal signage for an academic environment would be quite different form say an airport or a highway. For room labels, I dare say, would not be that much different than designing for print, say a poster. But for larger signs, those that would be read from a fair distance, as a rule, would need more space between letters than for print. What looks perfectly alright close up would appear much tighter when seen from a distance, hampering legibility greatly. Counters generally have to be large and open, again for legibility reasons. I'm afraid I don't have figures to support my arguments, or any hard and fast rules in terms of scale and how much the spacing should be. The best bit of advice I could give would be: always test at actual size. Do test prints, hang them up in the hallways, step back and see how well they read. That's essential. <br> <br>For a much more empricial approach, you should contact James Montalbano, who designed Clearview for US highways. He would be a much more appropriate person to ask for advice. He gave the most fascinating presentation at TypeCon. Are you around, James? <br> <br>Johnathan, maybe you would be interested in looking at Paul Mijksenaar's work? <a href=\"http://www.mijksenaar.com/index2.html\" target=\"_blank\">http://www.mijksenaar.com/index2.html</a> <br> <br></p>"
