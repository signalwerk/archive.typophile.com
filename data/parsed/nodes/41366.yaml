    html: <p>If this were a research project (ie you weren’t planning on making a Bembo knock-off, but were, say, writing a dissertation on Bembo) you’d get in contact with Robin Nicholas, and request an appointment to visit the Monotype UK office in Salfords. Robin, might then let you examine the original engineering drawings which would include the special sorts.</p>
