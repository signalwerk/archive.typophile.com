      <p>Eben —</p>
      <p>Have I mentioned the Spiral/Emerson contextual r to you before? It was part of Blumenthal’s original foundry type, but didn’t make it into the Monotype cutting of the face — probably because they couldn’t really accommodate it in the matrix case and there wasn’t likely to be much interest in such a specialized sort as an extra.</p>
      <p>If you can get your hands on a copy of the APHA’s <cite>American Proprietary Typefaces,</cite> Jerry Kelly discusses this on page 115 in his article on Emerson.</p>
      <p>— K.</p>
