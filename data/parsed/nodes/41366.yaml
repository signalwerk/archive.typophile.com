      <p>&gt; <em>That’s how Linotype did it too I think.</em></p>
      <p>I can’t resist quoting the comment by Beatrice Warde aka Paul Beaujon on the extra characters made by Linotype for Granjon in her piece on the ‘Garamond’ types in <em>Fleuron</em> 5:</p>
      <p>‘To offset the unfortunate inability of the Linotype to cast a kerned f, no fewer than twenty-six ligatures are provided. After such a sacrifice of practicality to beauty, it would be ungenerous of an author to mention Afghanistan, and so call out the ‘button-hook’ f that is the family spectre of Linotype designers.’</p>
