    <p>Reading about Bembo just now I came across a reference to the long R &amp; short R in Metal Bembo from Monotype. Which got me wondering what other alternative glyphs or alternative glyph combinations there might have been. </p>
    <p>I know that Linotype had quite a few “logotypes” which were a mix of Kering solutions and ligatures (mainly f related but sometimes including much more ) and sometimes there were even contextual alteration of non ligature kerned logotypes. I found the contextual stuff at the Printing History Museum in North Andover. Here is some more info on that:</p>
    <p><a href="http://www.typophile.com/node/36157" title="http://www.typophile.com/node/36157">http://www.typophile.com/node/36157</a> </p>
    <p>My questions are, if I wanted to see if similar things had been done with Monotype Metal fonts where would I look? Did Monotype use the Term “logotype”? What alternative characters do you know and or love?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/41376" class="topic-previous" title="Go to previous forum topic">‹ InDesign Question</a> <a href="/node/40286" class="topic-next" title="Go to next forum topic">Wil Hudson during the 1970s: photos ›</a></div>
