    html: <p>The later the better for any given form of the typeface (that is, the latest specimen of either the metal or the film version you can find), since any specials that were custom ordered by any customers would be added to the next round of updates. I’m not sure when the major sets of specimens were released, but I’ve mostly seen binders of specimens that allowed customers to insert the updated sheets as they were produced.</p>
