      <p>There’s no need to go all the way back to the engineering drawings to see what special characters were available. If you can track down any copies of the specimen sheets or books that Monotype prepared for their customers, they’ll usually show the special characters along with the part numbers that were used to order the correct matrices for any given typeface. For instance, here’s a note from a specimen for Bembo Bold 428 (unfortunately I don’t have the corresponding sheet for Series 270, the regular weight):</p>
      <p></p><div class="imageWrap"><img src="/files/bembo_bold_alts_8pt_3673.gif"></div><p></p>
      <p>You can see the alternate versions of R available, as well as a few additional ligatures. Granted, the drawings would make it easier to see what’s been adjusted to make those ligatures, but the printed specimens I’ve seen have always had really clear printing.</p>
      <p>(That’s 8 pt. type shown at 300%, in case you’re wondering.)</p>
