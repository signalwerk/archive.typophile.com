  html: |-
    <p>Hello all,</p>
    <p>I’m getting inked this evening but I have yet to decide which font to use! I wanted to use Old English but I didn’t like the “y” because of the tail. My friend also commented that Old English is like the Times New Roman of Blackletter, not something that I’d want.</p>
    <p>I’m not good with fonts so perhaps you guys can give me a few suggestions?</p>
    <p>Thanks in advance!</p>
    <p>p/s: I’m getting the quote “Glory comes from daring to begin”.</p>
