      <p>Fivos, I think Kashiwa Sato designed the typeface for Uniqlo, while Morisawa developed it as a font.<br>
      Anyway, the font is a custom font. It would not be good for you to use the font on your site, even if you use the font for font identification.<br>
      Did Kashiwa Sato, Morisawa or Uniqlo allow you to do it?</p>
