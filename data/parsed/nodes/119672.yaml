      <p>Looks like the sort of W you'd see on a license plate or airplane number. Closest commercial match I could find is Azbuka:</p>
      <p><a href="http://www.myfonts.com/fonts/mti/azbuka/" title="http://www.myfonts.com/fonts/mti/azbuka/">http://www.myfonts.com/fonts/mti/azbuka/</a></p>
      <p>Sequencia comes close, save for the spur on the G:<br>
      <a href="http://www.fontshop.com/search/?q=Sequencia&amp;sample_text=DAIPXGWTLF" title="http://www.fontshop.com/search/?q=Sequencia&amp;sample_text=DAIPXGWTLF">http://www.fontshop.com/search/?q=Sequencia&amp;sample_text=DAIPXGWTLF</a></p>
