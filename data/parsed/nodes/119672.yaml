    <p>Hi!</p>
    <p>I have discovered the following which reminds me a lot of DIN but there are quite a few differences when you look closely at it.<br>
    I have performed a search using an image font identify tool but I didn't came up with a suiting result.</p>
    <p>Does anyone else have an idea which font this might be? I have a feeling it's pretty custom.</p>
    <p>Thanks for any help in advance.</p>
    <p>C.</p>
