      <p>Mike, this shows that some effort was put into making a new font from the original Haenel Fraktur model.<br>
      As you know the photo-lettering companies had very creative designers who completely redrew classic designs. Then the photo part came in to create the variations. But I still have no idea whether this redesign was done in that era or many years earlier. Also I would love to see a complete alphabet.<br>
      Don</p>
