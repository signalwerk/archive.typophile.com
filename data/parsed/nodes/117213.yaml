      <p>1979, the photo-lettering era. I'm not certain if this one is digitized.<br>
      I'ts a variation of Fette Fraktur first cut by Weber in 1875 <a href="http://www.myfonts.com/search/fette+fraktur/fonts/" title="http://www.myfonts.com/search/fette+fraktur/fonts/">http://www.myfonts.com/search/fette+fraktur/fonts/</a><br>
      There are significant differences in some capitals, less so in the lower case.<br>
      The _S_ might be an enlarged _s_.<br>
      If this was not a photo-lettering era redesign, a match might be found Gerhard Helzel's collection <a href="http://www.fraktur.biz/" title="http://www.fraktur.biz/">http://www.fraktur.biz/</a><br>
      And it's interesting to explore the Blackletter Revival at Moorstation at <a href="http://moorstation.org/typoasis/blackletter/" title="http://moorstation.org/typoasis/blackletter/">http://moorstation.org/typoasis/blackletter/</a><br>
      I would be interested in what our fraktur experts have to say.<br>
      Don</p>
