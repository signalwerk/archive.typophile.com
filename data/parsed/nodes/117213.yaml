      <div class="comment-spam-body"><p>Mike, this is a fascinating book showing a huge variety of typefaces from  around 1840 to 1850. I recognize a few as being digitized. As was the practice of the era almost none have names. Only stock numbers. Even different sizes of the same typeface have different numbers. Not certain if this is the one you are referring to, but I selected it because of the elaborate encrusted ornamentation </p><div class="imageWrap"><img src="http://typophile.com/files/MusirteFrakturen3@HaenelEnhanced_5905.jpg"></div> BTW, This was one of the clearest images in the book. I tinkered with it to enhance it's clarity. I wish Google had paid some attention to the quality of its scans. They are appalling, particularly when compared to the ones done by University of California &amp; University of Toronto and shown at Archive.org.<br>
      Don<p></p>
      </div>
