      <div class="comment-spam-body"><p>Good find Mike. If you widen Haenel Fraktur most of the letters match. _S_ is indeed an enlarged _s_. _A_ is reworked to make it more readable as a Latinate form and _H_ is also a reworked _A_.  I expect that other capital letters not in the label were also reworked to make them more readable as Latinate forms.<br>
      Don</p>
      </div>
