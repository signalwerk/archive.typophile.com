      <p>Google Books offers a viewing of <a href="http://books.google.com/books?id=OkU-AAAAcAAJ&amp;pg=PT4&amp;dq=Original+Englische+Schriften+aus+der+Schriftgiesserei&amp;hl=en&amp;sa=X&amp;ei=rmuaU765OoX3oATItYKICA&amp;ved=0CCIQ6wEwAA#v=onepage&amp;q=Original%20Englische%20Schriften%20aus%20der%20Schriftgiesserei&amp;f=true" target="_blank" rel="nofollow">an old book</a> that shows the typefaces (and decorative elements) of the Haenel Foundry. I went through the whole long thing and the only place I spotted Fette Haenel Fraktur (not with that name) was roughly 3/5 of the way down (no page #s) - and that was an outlined/shaded showing of a few words only.</p>
      <p>Interesting viewing, nevertheless.</p>
