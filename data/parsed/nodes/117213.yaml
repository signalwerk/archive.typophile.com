      <p>See Ralph Unger's version of <a href="http://www.myfonts.com/fonts/rmu/haenel-fraktur/" target="_blank" rel="nofollow">Haenel Fraktur</a>. Your lowercase 's' is in the number sign position and the 'k' is a tz ligature offered in the character set.</p>
      <p>Note that if this was done with photolettering, they had all sorts of tricks to optically alter film fonts (wider, bolder).</p>
