    html: <p>I have a copy of the original 1979 album, but presently not to hand as it's in storage. I remember the sleeve was with-drawn or banned fairly soon after it's release as it was considered Fascist imagery (and replaced with an alternative design). It won't be Photo-Lettering  Inc. as it was designed in the UK but it is probably photo-set by one of headline setters that were around in London at that time.</p>
