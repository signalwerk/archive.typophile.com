    <p>Some of my installed fonts show up as separate typefaces on the type menu in InDesign, Photoshop etc. Others show just the typeface name then list each font separately.</p>
    <p>I'd prefer that as many as possible showed as Typefacename then all the weights were on the next menu.</p>
    <p>I can't even search this forum for answers because I simply don't even know what it's called when the files are formatted into proper families.</p>
    <p>My more recent purchases seem to have this feature but faces from my old Adobe CD don't group in this way.</p>
    <p>Is there a program that I can buy which will allow me to round-up a family and convert it so they stick together.</p>
    <p>Sorry in advance for the poor explanation, I just don't know the correct words. I hope you guys understand what I mean.</p>
