    <p>Hi<br>
    Not sure if the build forum is the correct place for this or not, but here goes...<br>
    It seems that certain customers (well, one customer) is having problems with one of my fonts in MS Word on a Mac. Whenever they try to use the font in Word, they get a 'Bad Font Detected' error message which goes on to say that the system will try to disable the font.<br>
    In my own testing, I can't get the same error message, and MyFonts checked it on a few different Macs in Word and it was ok. Since then they have been able to get the same error message using Mac OSX 10.7.3 with MS Word 2011. I can only test it using Mac OSX 10.6.8 with Word 2008, where it works fine. It also works without any problems in all other programs on Mac and all programs on Windows.<br>
    I can't find anything in the font file itself that would cause the error message, and out of more than a thousand licenses there has been only this one complaint. It seems to me it is a problem with Word (certain versions) on Macs (certain versions!) rather than with my font, but it's still going to mean refunding the customer for a font that is otherwise fine.<br>
    Has anyone had similar issues, and if so, could you find anything in your fonts that was causing them?<br>
    Many thanks for any help in this matter,<br>
    Dave</p>
