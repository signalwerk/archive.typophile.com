      <p><em>It'll be a bit strange if it was the postscript format causing problems on a Mac!</em></p>
      <p>Not any more. Expanding what Ralf said, the original Macs made a big splash because of their native Postscript support; Windows required ATM for PS Type 1 fonts until Windows 2000/NT4. However, Apple’s implementation was less than elegant, with its screen-fonts-and-printer-fonts approach.</p>
      <p> Apple and Microsoft developed TrueType more or less together in order to bust the Adobe monopoly. Adobe responded by actively dissing the TrueType format, which—in my experience—a lot of Mac users thought was a Windoze-only product.</p>
      <p>Now, Apple appears to content to sever entirely its relationship with the company that helped build Apple. Not only is Flash not supported on Mac portable devices, but also I have read that the latest release of OS X doesn't support PS Type 1 fonts any more. I suppose that, if you’re going to burn bridges, you should do a thorough job…</p>
