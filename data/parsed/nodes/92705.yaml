    html: |-
      <p><cite> It'll be a bit strange if it was the postscript format causing problems on a Mac!</cite> </p>
      <p>Why do you think that?<br>
      Both PCs and Macs have always been shipped with TrueType-flavoured fonts in the last 20 years and especially Office app are mainly targeted to the use of TrueType-flavoured fonts. I have seen much more bugs and problems in operating systems and Office apps related to PostScript-flavoured fonts. Which is not surprising, since TrueType/OpenType TT is just the common format here.<br>
      It's only in design apps (like those from Adobe) where PostScript-flavored fonts are much more common and therefore better tested.</p>
