      <p>To be on the safe side, what little I do conforms to what Nick mentions - no more than a Regular, Bold, Italic, and Bold Italic styles for a single Family Name, and therefore different Family Names for all other styles.</p>
      <p>However, it appears that multiple styles CAN be within a family, even in a Windows and/or MS Office environment:</p>
      <p>Adam Twardoch (FontLab) describes a comprehensive font naming convention here:</p>
      <p><a class="freelinking external" href="http://forum.fontlab.com/fontlab-studio-tips-and-tricks/font-family-naming-in-fontlab-studio-5-t313.0.html" rel="nofollow">http://forum.fontlab.com/fontlab-studio-tips-and-tricks/font-family-naming-in-fontlab-studio-5-t313.0.html</a></p>
      <p>Karsten Lücke's approach is in this pdf:  <a class="freelinking external" href="http://www.kltf.de/downloads/FontNaming-kltf.pdf" rel="nofollow">http://www.kltf.de/downloads/FontNaming-kltf.pdf</a></p>
      <p>I'm sure that Tom Phinney produced a similar exposition, but I can't seem to find it.</p>
      <p> - Herb VB</p>
