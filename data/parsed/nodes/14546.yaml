    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>:&nbsp;Contrast</strong></p>
    <p><img src="/sites/default/files/old-images/Typophile_Contrast_3674.gif"></p>
    <p>Relative measure between thick and thin strokes of a&nbsp;letterform. </p>
    <p>Originally produced by the angle of the brush or pen nib, contrast was retained through the advent of mechanical type design and greatly exaggerated in the work of Didot and Bodoni. It was later almost completely eradicated in sans serif designs of the early twentieth&nbsp;century.</p>
