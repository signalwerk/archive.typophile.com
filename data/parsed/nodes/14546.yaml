    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a>: Contrast</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile_Contrast_3674.gif"></div><p></p>
    <p>Relative measure between thick and thin strokes of a letterform. </p>
    <p>Originally produced by the angle of the brush or pen nib, contrast was retained through the advent of mechanical type design and greatly exaggerated in the work of Didot and Bodoni. It was later almost completely eradicated in sans serif designs of the early twentieth century.</p>
