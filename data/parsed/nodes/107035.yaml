      <p>I believe the trial version of Glyphs has full functionality.</p>
      <p>However,</p>
      <p>I wouldn't recommend scaling a font this way, there are likely to be rounding errors, and spacing, kerning and hinting implications. Choosing different ratios for x- and y-scaling will also mess up the stroke modulation. There may also be legal restrictions on editing Caecilia, you need to check the EULA.</p>
