  html: |-
    <p>Being unsatisfied with all of the default fonts on my Kindle, I've decided to edit the "Caecilia" to my size requirements.<br>
    I just want to slightly increase in height and width the character. I've tried to do so with the trial edition of High-Logic FontCreator, and with Birdfont and FontForge, but in all of them I couldn't find the way to do it.</p>
    <p>Again- just changing the width and height of the character (not in the same ratio!). not spacing, not position. In any free software. Please help. </p>
    <p>Thanks.</p>
