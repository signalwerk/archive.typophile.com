    html: <p>On a second thought, I will use Bitstream Dutch 809 (Concorde) instead. It is similar enough to Times New Roman for the layman. The reduced capital height and large x-heigt makes the caps and numbers stand out less, which gives the text a more even appearance and SC and OSF are not that much needed.</p>
