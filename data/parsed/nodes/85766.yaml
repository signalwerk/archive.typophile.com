    <p>Dear Experts!</p>
    <p>[EDIT: The initial post is not relevant any more (for me at least), the second question is of interest to me personally]</p>
    <p>I would be glad to get your feedback on a typographic solution I came up with. </p>
    <p>The objective was to find a way to get some decent typography elements into my writing with no or limited budget for fonts. The Bitstream font collection that comes with Corel Draw is available to me. As educational institutions can be conservative I was looking for a very Times-like solution to replace Times New Roman. My critique on TNR is simple: too compressed and too much contrast.<br>
    Times Ten / Bitstream version Dutch 801 would be a perfect replacement. OSF and SC are substituted by TeX Gyre Termes, another TNR clone. I would like to know if this look like a semi acceptable solution. </p>
    <p>Dutch 801 (body text) &amp; Termes (for OSF and SC): </p>
    <p>Times New Roman:</p>
    <p>Please have a look at the attached PDF with a complete paragraph set in both variations.</p>
    <p><strong>A second question</strong>:<br>
    Which typeface out of the following would be a good choice for headlines to pair with Times in the body text:<br>
    Bitstream versions of: Fairfield, Electra, Kis, Bodoni (BT, Bauer), Gill Sans, Futura, Univers, Avenir<br>
    Originals: Helvetica/Neue, Gill Sans, Futura, Frutiger Linotype, Corbel, Franklin Gothic, News Gothic, Optima, Sero Office Medium</p>
    <p>The pairing should not be too conservative, but should not grab too much attention either. It should feel somehow natural. How would the serifs pair for headlines, especially Fairfield and Kis?</p>
    <p>Thank you very much for your help!</p>
