  html: |-
    <p>Oops.In 1997 I released a revival of the Watts face used in a 19th-century bible, under the name "Acaill". I'm about to release a new version of this, but I'm thinking about changing the name. </p>
    <p>Why? Because "Acaill" is a rather quirky Gaelic font and since its name is at the beginning of the alphabet, it loads before other more standard fonts, and I often get an Acaill glyph (say in a Wikipedia article) when I'd rather something more mainstream. </p>
    <p>Is it kosher to re-name a released font, and to retire the old name?</p>
