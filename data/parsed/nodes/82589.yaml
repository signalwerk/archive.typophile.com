      <p>I renamed Walbaum News to Walburn (a made-up name), for several reasons.<br>
      Firstly, the name field was getting a bit crowded when "Display Bold italic" was added.<br>
      Secondly, I wasn't comfortable that it was a genuine Walbaum, considering the liberties I'd taken with it.<br>
      Thirdly, there were quite a few other Walbaums out there.</p>
      <p>The original Beaufort was renamed Beaufort Old Style when I released the new, improved version.<br>
      Then I withdrew it.</p>
