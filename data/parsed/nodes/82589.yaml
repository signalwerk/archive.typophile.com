    html: |-
      <p>Mac OS, various browsers. The characters in question are rare, and recently encoded, and are not part of any shipping core fonts. So the OS has to find a glyph to display them with, and it polls the installed fonts in alphabetical order until it finds one.</p>
      <p>How else should the OS find a glyph that's not in the core or fallback fonts?</p>
