    <p>So, I'm working on an identity that <a href="http://typography.com/fonts/font_styles.php?productLineID=100013" rel="nofollow">Knockout</a> would be perfect for, except that the client will need to display the titles of plays and musicals quite often. As Knockout has no italics or obliques, this takes it out of the running. This pains me deeply, as Knockout's range of styles and the historical design references its making are all perfect otherwise.</p>
    <p>If you had to replace Knockout with a type family that sports obliques/italics, what would you choose?</p>
    <p>I've looked at a number of Grots and Gothics and haven't hit anything I like. I think its wood type pedigree makes it unique, and I'm having difficulty finding another sans with that characteristic and range. I want to the bullet and try to make it work anyway (specing single quotes rather than italics for titles), but I don't think the client will go for this restriction.</p>
