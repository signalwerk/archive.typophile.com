      <p>Thanks for the recommendations, everyone. These are great.</p>
      <p>I admit I'm a timid designer who blanches at the thought of pushing and pulling type like that, but now you've got me interested in going a few rounds with Knockout (last boxing pun, I promise). The usage is primarily display work, but not exclusively. We did consider other methods of pulling out the titles, but the client was not excited about that prospect, and the battle was ultimately not worth waging.</p>
      <p>I like Balboa, but  Knockout has a quality to it that Balboa doesn't quite hit for me (Not a pun! I swear!). It's also possible that I've simply become so enamored with Knockout that I'm blinded a bit.</p>
      <p>I remember Maple now, from seeing it in <a href="http://typographica.org/001045.php" rel="nofollow">Typographica's Favorites list of 2005</a>. What a fantastic family. Now I have to find a place to use this family as well. Its character is great, but that same character moves it away from the specific sort of visual references we were looking for.</p>
      <p>Part of the reason I was so remiss in responding to your recommendations is that the project's visual direction took on a different emphasis after my post and the work began to pile up, keeping me away from Typophile. In the end, I went with everyone's favorite ubiqui-sans of the early 21st century, <a href="http://typography.com/fonts/font_overview.php?productLineID=100008" rel="nofollow">Gotham</a>. It works ideally in this case, particularly with its wide range of weights. It turns out that the late 19th/early 20th century grot look of Knockout ended up being a bit too far back in the history books. We began looking for something that was a bit less forceful in its tone without losing its ability to proclaim its message boldly, as well as being more at home around the geometric influences of the 30's and Deco architecture, without going as far into the style as <a href="http://www.houseind.com/index.php?page=showfont&amp;id=615" rel="nofollow">Neutraface</a> does.</p>
      <p>Thank you all for the suggestions. They've given me some great options to have at the ready for work needing distinct gothics.</p>
