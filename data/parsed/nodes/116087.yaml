      <div class="comment-spam-body"><p>I like the third version from the left, although I don't like the black background -- that's too limiting for variable use. As for a "bee", or by inference a "hive" concept, it fails totally for me; I just don't make any connection. </p>
      <p>When I first saw it my immediate reaction was "citizen's band", which I think is still around. So perhaps you should approach this more from the standpoint of news communication which is what it is. CB could fit comfortably within that category, I think. It's just a more personalized method of information and/or news dissemination.</p>
      <p>My own personal hive of information is the internet. Everything you might need to know can be found there, somewhere.</p>
