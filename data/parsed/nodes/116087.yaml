    <p>Hey Typophiles,</p>
    <p>I'm working on a logo for a news website. I've attached a few examples of the current direction it's heading in. The 'B' stands for buzz, eg: ' a hive of information and up-to-date news. The original concept was that the 'B' could represent a literal Bee and the form of the letter 'C' would represent it's wing from a side-on perspective. I wanted this reference to be extremely subtle and as far from illustrative as possible so as to avoid it being over the top, in your face, or cliche. Whilst the client really likes t, unfortunately the select few I've shared this with don't think it works even subtly (the bee concept), but they quite like it regardless.</p>
    <p>I'm asking because I want some genuinely expert feedback regarding ways I could improve or different directions I could take it. Most importantly I want it to be typographically strong and not look amateurish. For thirds interested the letters are a heavily edited (bastardised?) Museo.</p>
    <p>All criticism and comments welcome!</p>
    <p>[img]http://i.imgur.com/2qFSpoT.png[/img]</p>
