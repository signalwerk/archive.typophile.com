  - id: 577969
    user: 72132
    date: 2014-05-09T14:20:00
    date_raw: 9 May 2014 — 2:20pm
    votes: null
    html: |-
      <p>Thanks all for your feedback! I agree the third from the left was the most successful - I also agree the 'Bee' concept was a bit of a stretch. I would (and did, for experimentation) change the colour from deep reddy orange to a more conventional 'Bee yellow' but the client is pretty set on what we have so far. </p>
      <p>He requested the whole word 'CoinBuzz' in the same bastardised Museo (yay) so I quickly knocked off the curvaceous serifs and was left with the below images. I suggested he could use both the full logo and the reduced 'CB' at his leisure depending on any size or dimensional constraints.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/a1_5039.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/a2_5365.png"></div><p></p>
      <p>I quite like it but lack the veteran eye of a type designer and not sure if my taste is failing me. Issues i'm aware of being:</p>
      <p>-The curvature of the 'C' is more horseshoe than rounded, almost  awkward (not sure if anyone agrees?)<br>
      -The square tittle from the 'i' was replaced with a friendlier round one. I made sure it didn't ascend too high but matched the width of the i's vertical stroke; not sure if it sits nicely or looks 'off'.<br>
      -Most importantly, removing the serifs from the 'n' and 'u' has reduced their character width somewhat and consequently might need to expand them and give them a bit more room to breath. Note the 'o' in comparison to the 'n'.<br>
      -Kerning needs work?</p>
      <p>Would love to hear others' thoughts on my (above) notes - or any other further comments or criticisms. I want this to be as polished as possible and ideally to learn from you guys in the process. Thanks :)</p>
