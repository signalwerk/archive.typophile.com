      <p>Chester, there is no significant difference between having precomposed diacritics in Unicode and having sequences of bases and combining marks. Many hundreds of languages rely on combining mark sequences, and these languages are fully supported by Unicode and by Unicode-savvy systems and applications. Keyboard layouts frequently make the encoding model invisible to the user: he presses a key and gets Ẹ́ and that gets rendered using one of several possible character-&gt;glyph options. He may neither know nor care whether that diacritic is encoded as one, two or three characters.</p>
      <p>The only reason there are <em>any</em> precomposed diacritic characters in Unicode is for one-to-one backwards compatibility with pre-existing character set standards which, unsurprisingly, happen to be mainly for majority writing systems of industrialised nations. But if you take into account some of the Unicode normalisation forms, even these writing systems may end up being largely encoded using combining mark sequences in future. The W3C consortium, for example, recommends a normalisation form that involves canonical decomposition, so it is quite likely that future browsers and XML document handlers will break down even common European diacritics like é into e plus combining acute.</p>
      <p>Normalisation is the process of determining a standard encoding for character clusters that could be encoded in multiple ways. That Ẹ́ diacritic, for instance, could be encoded in three different ways: ‹0045, 0323›, ‹00C9, 0301, 0323› or ‹00C9, 0323, 0301›, all of which should be rendered identically and all of which have totally equivalent semantics for the reader. But if you want to search, sort or compare text strings, it is essential that a single canonically correct, normalised order is used to encode Ẹ́, and for this purpose fully decomposed combining mark sequences are highly desirable. From a text processing perspective, combining mark sequences are actually preferable to precomposed diacritic characters, since the latter need to be decomposed for the most efficient normalisation.</p>
  - id: 96870
    user: 1133
    date: 2005-11-23T06:12:00
    date_raw: 23 Nov 2005 — 6:12am
    votes: null
    html: |-
      <p>In addition to what Tom and John wrote, I should mention that adding new precomposed characters has one more disadvantage: if you add a single codepoint, say for the Yoruba E with acute and dot below, then for all existing applications and systems that use older versions of the Unicode Standard, the codepoint is just an opaque codepoint with no meaning. At best, they will recognize that it's a letter at all but will no nothing about a resonable sorting order or the mapping between a lowercase and the uppercase variant. If you encode the character in the normal (decomposed) way, then even older applications will know that we are talking about a Latin E with a bunch of diacritics. Even if they won't necessarily know it's Yoruba, they'll be able to infer many more properties that from a new precomposed codepoint. For example, an application will most likely sort the word starting with such character somewhere after the plain "E", it will figure out that the lowercase counterpart is "e" followed by the respective diacritics etc. </p>
      <p>Typesetting applications should take care of the correct presentation and of the fact that the character should be treated as one character and not three when moving cursor, selecting text, counting letters etc. This has nothing to do with the way the text is encoded. </p>
      <p>Adding more codepoints to Unicode will not help Yoruba -- on the contrary, it will marginalize it more!  </p>
      <p>Regards,<br>
      Adam</p>
