    html: |-
      <p>Eben,<br>
      you should definitely spend some time with the Unicode table PDFs, as well as checking out the sites devoted to The World of Diacritics. I spend a lot of time on these sites:<br>
      <a href="http://www.unicode.org/charts/" title="http://www.unicode.org/charts/">http://www.unicode.org/charts/</a><br>
      <a href="http://www.eki.ee/letter/" title="http://www.eki.ee/letter/">http://www.eki.ee/letter/</a><br>
      <a href="http://diacritics.typo.cz/index.php?id=1" title="http://diacritics.typo.cz/index.php?id=1">http://diacritics.typo.cz/index.php?id=1</a></p>
      <p>There are Unicode indices for hundreds of accented glyphs, and different keyboard layouts map to accents differently, but the usual way things work is request accent, then request letter, which triggers the single glyph "letteraccent". </p>
      <p>Which is why you can't just ask for a di(a)eresis + n to get the ndieresis accent needed for Spinal Tap: that glyph isn't mapped to a Unicode index, and system sotware doesn't recognise this as a valid combination. Hell, even with REAL accents, like lacute (uni013A), you can't use your U.S. keyboard layout and ask for an acute with an l under it. (This glyph is used in Slovak, and is supported by the 8859-2 character map.)</p>
      <p>Another reason not to try to make accented glyphs using liga is that some accents come in a few different forms. Adam very kindly showed me how one should make ogoneks, and the "standard" ogonek one uses in a sans font is usually too wide for the I and i, so you have to tweak.</p>
      <p>Yet another reason: Tracking. When you track text in InDesign - by request or as a function of justified setting - at a certain point the ligas will "split" back into their component parts. Otherwise it would look silly. (I'm sure we've all seen loosely tracked text with fi and fl ligatures, which look like little siamese twins...) One exception to this rule is the Dutch "ij", which is actually a descendent of ydieresis, and is always a single character, even when tracked. Here's the sign for the local butcher:<br>
      S  L  A  G  E  R  IJ</p>
      <p>As always when developing type, you have to follow certain conventions, and you have to follow the standards. Not because slavishness is good, but because software and wetware (aka "users") know how to do things one way, and you shouldn't ask them to learn a new way of doing things just for your font. Build your types to be out-of-the-box usable by anyone, and if you have "special" functionality, make it available for expert users.</p>
  - id: 96235
    user: 1262
    date: 2005-11-19T11:43:00
    date_raw: 19 Nov 2005 — 11:43am
    votes: null
    html: |-
      <p>Eben, no you would not use the 'liga' feature to access precomposed diacritic glyphs from base + combining mark sequences, you would use the 'ccmp' feature, which is designed for this purpose. I would include 'ccmp' feature lookups for all precomposed diacritic glyphs in the font, despite the fact that some applications may use character level composition for diacritics with their own Unicode values. This provides fallback for an application that supported 'ccmp' but did not do such character level processing. Of course, 'ccmp' must be used for any diacritic glyph that does not have its own Unicode value.</p>
      <p>'liga' is a bad idea for diacritic composition because the user can turn it off. 'rlig' would be better in that regard, but 'ccmp' is expressly designed for this purpose (and can also be used for glyph decomposition).</p>
