    <p>This may be pretty obvious but I am not sure...</p>
    <p>Are some glyphs rendered useless in Open type?</p>
    <p>For instance, the standard 'macintosh roman' glyph set has 'macron' or '00AF' in unicode.</p>
    <p>This glyph would be combined with another glyph (perhaps a 'U') to create a combined letter in the pre-Unicode world.</p>
    <p>However, in Unicode you can actually incude all the glyphs as fully formed or complete single glyphs. </p>
    <p>So does this mean that 'macron' is not needed anymore - at least in an Open type font that includes all the instances of macron use you want to support?</p>
    <p>Or are there any arguements for keeping 'macron'? </p>
    <p>Do you for instance, need it on some keyboards and/or OSs to invoke the new complete Unicode glyph?</p>
    <p>For bonus points, how do you safely add glyphs from additional code areas in fontlab? Having re-read the documentation I am still feeling oddly sqeamish.</p>
