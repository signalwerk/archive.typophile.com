      <p><em>Indeed, all accents should be available to users to roll their own - with some kerning...</em></p>
      <p>Ack! This is how we used to do it, but mark positioning really should be independent of kerning. If you kern a mark over a base, then you need to positively kern the mark to the next base to restore the spacing between the bases. It's a mess, and if the user applies tracking you are screwed.</p>
      <p>For this was GPOS mark positioning invented, and you should hammer on your favourite app developers until the lazy buggers support it.</p>
