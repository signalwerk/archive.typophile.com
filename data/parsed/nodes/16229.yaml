      &gt; autuomatically mapped on Windows in<br>
      &gt; applications using the Unscribe text<br>
      &gt; processor.<br>
      &gt; This is a buffered character level mapping,<br>
      &gt; which is faster than glyph level mapping<br>
      &gt; in the layout feature or GPOS mark positioning,</p>
      <p>...but which will only work on one particular operating system that supports OpenType layout features. Cocoa in Mac OS X needs the "ccmp" feature to correctly render canonically decomposed text. Adobe applications currently don't do anything (neither apply ccmp nor character-level composition) but this may change in future. </p>
      <p>Adam</p>
