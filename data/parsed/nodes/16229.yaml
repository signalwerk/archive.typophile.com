      <p>Since some OS's will automatically build some combinations of of roman letters and diacritics some of the time  ( if you use the fontlab anchor technique ) ; but not all OSs do it ...</p>
      <p>Is there any point in making ligature features ( liga ) for combinations to make things a bit easier for typists? I don't mean inventing new custom glyphs - just using 'liga' to point to the correct &amp; intended Unicode glyph.</p>
      <p>It would be pretty easy to do in the font itself - but would it help? </p>
      <p>It could be complicated.</p>
      <p>For instance, do Polish keyboards offer all the ogonek combinations as single characters? Or is there an one ogonek to combine with the other letters? Or some mixture? If there is an just the one ogonek then 'ligatures' or rather using the liga feature might make sense. Unless you could rely on the OS to do it. Which it sounds like you can't really do - yet.</p>
      <p>What about other languages and other diacritics? What's true for one diacritic in one case may not be for the next. Or for that same diacritic may be treated differently in another language's keyboard.</p>
      <p>When an OS handels this do you type the letters first &amp; then the diacritic/accent? Or the other way round? And is that true in all languages &amp; in all OSs?</p>
      <p>And when an OS does automatically combine a given set of letters &amp; diacritics for you; would a liga feature conflict with that OS's type handeling feature? Could reversing the order of input ( diacritic &amp; then letter or the reverse) allow both to co-exist?</p>
