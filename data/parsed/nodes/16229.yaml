    html: |-
      <p>The macron and other accent characters in the Mac Roman and other 8-bit codepages are spacing characters. In other words, they are not meant to be combined with base letters, and have advanced widths greater than zero. Proper combining mark characters are in the Unicode 0300 block, and are zero-width characters that can be combined on base letters or in mark stacks. A non-combining mark is canonically equivalent in Unicode to the space character plus a combining mark, so either method is accepted to display the mark without a visible base.</p>
      <p>Not all combinations of base + mark are separately encoded in Unicode; indeed, most are not. The expectation is that combining marks will be used with base characters to form additional diacritic combinations, using OpenType GPOS  and  features to correctly position the marks.</p>
      <p>In the interests of processing efficiency, if text contains e.g. A plus a combining acute character, and the font used includes the precompose Aacute character, this will be autuomatically mapped on Windows in applications using the Unscribe text processor. This is a buffered character level mapping, which is faster than glyph level mapping in the  layout feature or GPOS mark positioning,</p>
