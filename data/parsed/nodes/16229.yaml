      <p><cite>Which raises a point: the E with acute and dotbelow which is needed for Yoruba should get a Unicode index ASAP, as should n with dieresis. As should every accented glyph used in every language.</cite></p>
      <p>Actually, that would go against one of the principles of Unicode. Unicode explicitly says that they only encode precomposed accented glyphs for purposes of compatibility with existing standard encodings. For all such combinations outside of common/standard encodings, they expect dynamic composition of accented characters.</p>
      <p>Regards,</p>
      <p>T</p>
