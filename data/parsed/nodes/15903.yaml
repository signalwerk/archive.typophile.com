  html: |-
    <p>Some time between Mac OS7 and OS9, Type 3 fonts stopped working, or rather Type 3 FF Beowolf stopped working! I have a need to use it again after briefly played with it in 1994. Would anyone have any info as to how to make it work? I can select the fonts in OS9, but the print out from a postscript printer get substituted with some other fonts. I have also printed to PS but Distiller refuses to process it...</p>
    <p>Thanks in advance</p>
