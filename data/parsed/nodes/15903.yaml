    html: |-
      <p>I think the point when Type 3 fonts stopped working was when ATM was added to the mix. ATM only supports Type 1 fonts. Perhaps if you disabled or uninstalled ATM and put the fonts directly in the Fonts folder (in the System Folder), they might work. You do have to print to a PostScript printer, of course. Whether it needs to be a true PostScript printer as opposed to a clone, I don’t know. And it is not possible to see the results on screen (it never was).</p>
      <p>You might also try contacting <a href="http://www.letterror.com/">Letterror</a> and ask for advice.</p>
