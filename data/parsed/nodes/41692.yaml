      <p>Fontana, what you are asking then is that you are looking for a font whose Devanagari glyphs you can take and then map these onto a Latin keyboard in a new font, right? So you want to create your own Devanagari font with non-standard encoding?</p>
      <p>Some of the fonts that Paul has linked to may allow you to do this, but I don't know. You should track down the producers of the fonts (the URLs of the fonts' producers are often inside the Font Info section of the font files… at least for the fonts that Paul has linked to, I think) and check with them first.</p>
