      <p>Many of the buttons you saw were made by Nick Sherman of MyFonts:</p>
      <p><a href="http://myfonts.wordpress.com/2006/08/16/typecon-2006/" title="http://myfonts.wordpress.com/2006/08/16/typecon-2006/">http://myfonts.wordpress.com/2006/08/16/typecon-2006/</a></p>
      <p>I believe that they were distributed specifically for TypeCon, so I'm not sure they'll be available otherwise. Bother him a little, offer him some money perhaps :)</p>
      <p>In addition, Typophile had a nice selection of buttons floating around and you may have seen the black and white "I love helvetica" and "I hate helvetica," provided by Gary Huswit of the <a href="http://www.helveticafilm.com/" rel="nofollow">Helvetica</a> documentary.</p>
