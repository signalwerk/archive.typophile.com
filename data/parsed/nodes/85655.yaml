    html: |-
      <p>Hi Henri,</p>
      <p>I'm not a font designer but I'm Greek and although I don't know which is this typeface, I wonder why one should have to use one of the ugliest Greek Polytonic (=multi-accent) typefaces I have ever seen!</p>
      <p>Especially the accents are awfully designed:<br>
      2nd letter: The Vareia accent should point to the horizontal center of the eta (η) letter, not to the next letter!<br>
      5th letter: The Perispomeni accent should be much lower and more close to the eta (η) letter<br>
      15th &amp; 27th letter: The Psili accent should be centered above ypsilon (υ) and epsilon (ε) letter.</p>
      <p>If the specific font is not a absolute requirement I will highly recommend to replace it with another.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GreekPoly02_5852.jpg"></div><p></p>
      <p>Look at the image I have attached, to see how different is the same text if you use a well designed Greek Polytonic Text (GFS Didot).</p>
      <p>Fivos</p>
