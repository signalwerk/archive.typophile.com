    html: |-
      <p>I think that the whole artwork is a bit cliché-like concerning to what customers are expecting from ’creative people’. It is screaming, there are details over details, you put icons after every statement on the backside you change from uppercase to lowercase on the frontside, you’ve used orange to attract attention, you choose a very constructed font, you feature various illustrations, you inserted a photograph, you are using rows of stars, the pencils are burning, (...).</p>
      <p>It’s very in-your-face and I’m not sure if this is the best way to go if you’re doing self-promotion. Maybe try a more subtle way and try to focus on one or two (maybe three) prominent ’graphics’ instead of pushing everything to the limit with intent to show what you can.</p>
      <p>Problems concerning legibilty have already been mentioned before.</p>
      <p>Maybe it was your intention to create a persiflage of overdesigned artworks but then you’d need to spend more time on the details.</p>
