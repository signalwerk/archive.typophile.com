    html: <p>That’s exactly what I mean. You want to show your abilities (which is a fine thing) but I think that prioritizing is key because than you could pick let’s say 3 really good illustrations and making them stand out as what the are -&gt; Fine artwork. For example I’m really digging the icons on the backside and I think they would even look better next to ’normal’ typography. In this combination they are fighting for recognition against type. It’s too ’blurry’ to me -&gt; maybe overdesigned. But of course it’s also important to have a certain style which will be recognized by customers.</p>
