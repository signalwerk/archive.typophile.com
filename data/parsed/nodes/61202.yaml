      <p>Jonathan -</p>
      <p>You are correct, on both accounts somewhat. I used Emigre’s Lunatix Bold (black text) and Emigre’s Platelet Heavy (font that is giving fits) and I like the font a lot except for the lower case “i”. I did some kerning and tweaking and ran into this problem. I also don’t like the default lower case “b”, but there is an alt character. None for the “i”.</p>
      <p>I think I might run a request into Emigre and ask them to have the designer reconsider this character or at least put an alt character in the set. </p>
      <p>I had some non-designer eyes look at this over the past two nights and I got a few “hard to read” comments. So I need to play around with this layout more.</p>
      <p>Todd Schultz Wolff<br>
