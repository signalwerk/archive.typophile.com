      <p>Simplicious -</p>
      <p>Since I am not yet able to purchase a letter press I was going for a modern, digitized version of a letter press layout. Was kinda going for a modern spin on Hatch Show Print or Yee-Haw Industries look or an a modern version of an old 60’s Boxing poster. I could screen print - and try for a faux letter press look - but was kinda limited by finances. Trying to do for less than $500. This might be first of a number of post cards. So yes - the look is supposed to be in your face or loud. I’m not looking for a clean simple look - nothing against it - just not in my wheel house. I also wanted to show my illustration abilities.</p>
      <p>Thanks for the input - I am looking at this from a fresh perspective and will definitely utilize your comments!</p>
