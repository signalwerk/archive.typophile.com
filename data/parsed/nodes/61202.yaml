      <p>Grammatical error: death-defying should be hyphenated. If the first word in a compound modifier is a noun, it’s hyphenated. If it’s an adjective, it’s not hyphenated. </p>
      <p>small green house = correct<br>
      pea-green house = correct</p>
      <p>.......................</p>
      <p>death-defying design = correct<br>
      amazing sleek design = correct</p>
      <p>/end grammatical OCD attack</p>
