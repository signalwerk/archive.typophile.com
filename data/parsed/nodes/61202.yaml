      <p>On the front, the kerning between the i and s in “visual voodoo” looks a bit much, and the spacing between the two words could be tightened up.</p>
      <p>On screen, the green type in “amazing performance” (mainly “performance”) is hard to read over the grey.</p>
      <p>And I’m sure some 3D nerd (not me, of course) will point out the highlight on the ball doesn’t match up with where the shadow is falling.</p>
      <p>There are two hyphens on the back that should be em dashes, and you should use a coma instead of a period after “good as our next project”</p>
      <p>I would spell out “okay” and put a comma after it.</p>
