  html: <p>I'm a Ross MBA student an mobile app entrepreneur.  I am creating a wedding app that will cater to the high end of the market.  I am looking for something that straddles the line between high/end elegant and fun/hip.  My target customer is mid to late twenties.  Any recommendations would be greatly appreciated! (and possibly purchased)</p>
