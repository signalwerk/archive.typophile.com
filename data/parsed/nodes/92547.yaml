      <p>It always seemed to me that certain compressed, early twentieth century typefaces had a bit of skyscraper in them, e.g. <a href="http://www.identifont.com/show?4BP" rel="nofollow">Raleigh Gothic</a> and <a href="http://www.identifont.com/show?403" rel="nofollow">Corvinus Skyline</a>.</p>
      <p>Of course, such styles initially date from the early nineteenth century, when they were developed for use in all-type fly-posters, providing a good way for a long name to make a sizeable impression in a limited width.</p>
      <p>Rather than direct <em>inspiration</em>, types are <em>informed</em> (perhaps subconsciously) by multiple factors. In fact, it’s the nature of design that it <em>addresses</em> multiple issues in an economic manner, killing many birds with one stone, as it were. With type, I would say that there are <em>inﬂuences</em> that stem from non-typographic design disciplines—such as architecture—and those that stem from fashions/trends in layout, and the design space opened up by new font production and printing/display technology.</p>
      <p>Presently, there is a vogue for all-cap sans headlines (often multi-line), and more recently, those all-cap settings are being made with compressed type styles. Architecture? Go ﬁgure.</p>
