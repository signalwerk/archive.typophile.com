    <p>I'm writing a short article on fonts inspired by architechture or that have significant influence on architechture. </p>
    <p>I start off with fonts inspired by the Trajan column in Rome, I will cover Bauhaus and probably Jugend fonts. I'm considering including Johnston (the London Tube font), and also Futura (Ikea used it, so at least there's a link to furniture if not architechture).</p>
    <p>Being Norwegian, I will also include Sindre Bremnes's beautiful Telefon font (based on lettering on the classic Norwegian telephone kiosks), which <a class="freelinking external" href="http://typophile.com/node/66441" rel="nofollow">has been discussed on Typhofile</a>.</p>
    <p>What other fonts should I include? Thanks a lot for any help!</p>
