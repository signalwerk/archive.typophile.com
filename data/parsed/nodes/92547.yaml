      <p>Richard Keijzer (Netherlands) has been creating fonts based on signage used to identify buildings; primarily art deco-ish, they all have 'mokum' as the leading part of their names.</p>
      <p>Here's his site; the fonts (which are free) are currently off-line:</p>
      <p><a href="http://fontenwerkplaats.blogspot.com/" title="http://fontenwerkplaats.blogspot.com/">http://fontenwerkplaats.blogspot.com/</a></p>
      <p>Somewhere buried in his blogs are photos of the buildings that inspired him.</p>
      <p>Some of his fonts can be found on free font sites. Their names are:</p>
      <p>Mokum Betendorp<br>
      Mokum Cohen<br>
      Mokum Cohen Top<br>
      Mokum Expo<br>
      Mokum Giro<br>
      Mokum Oorkonde<br>
      Mokum Stad<br>
      Mokum_Tooneel</p>
      <p>Luc De Vroye has some more information here - he includes some fonts that I was unaware of:</p>
      <p>   <a class="freelinking external" href="http://luc.devroye.org/fonts-45405.html" rel="nofollow">http://luc.devroye.org/fonts-45405.html</a></p>
