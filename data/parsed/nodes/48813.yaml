      <p>I can see the subtle differences between the Helveticas - but cannot see the new one to be better or vice versa. Neue narrows more in parts, has a higher dot on the 'i' and a fatter apostrophe. Why would that make it better? Excuse me if I sound ignorant - but I guess I am.</p>
      <p>As for the treatment - be careful of immediate</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_crateandbarrel_4010.gif"></div><p></p>
      <p>comparisons. That was the first thing I thought of.</p>
      <p>And the stove reference is vague.</p>
      <p>That said the neutralness of a typeface such as Helvetica may convey the modern feel you want - then it would all come down to the application. I would research the alternates first though.</p>
