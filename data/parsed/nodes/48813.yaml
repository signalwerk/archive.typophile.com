    <p>Hey guys, I'm currently working up some mock-ups for a "higher end" kitchen store. They currently have a logo but are seeking to become more modernized as the area around them picked up and is starting to get "hip". I've tried all kinds of things and cant really come up with anything I like. I do think the words themselves are more important than any mark. The name just doesn't feel like it requires a mark. Please take a look and give me some feedback!</p>
