      <p>@Jan: Amazing - how can you tell the difference between Helveticas?</p>
      <p>As for the treatment: I think American Apparel already took your intellectual space with this one.</p>
      <p>Also, I remember the old packaging design from the Pathmark supermarkets from growing up in New Jersey. The store brand items were in white boxes, and the name of the product was in black Helvetica. At the bottom of the box were the trademark red and blue stripes of the Pathmark brand, and then in black Helvetica the phrase "no frills."</p>
      <p>Unfortunately, there's nothing very epicurean about that.</p>
      <p>People who like to cook are passionate about sensory experience. I should know; I like to cook. Helvetica doesn't exactly communicate gustatory passion.</p>
      <p>That said, the oven is cute. Overall, I'm not feeling this direction, though.</p>
      <p>--<br>
      Nick Hladek</p>
