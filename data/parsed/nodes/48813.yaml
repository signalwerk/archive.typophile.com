    html: |-
      <p>i dont get the love your thing, i mean the 2nd mark.</p>
      <p>type-wise it really depends on what you're going.<br>
      underware have "bello" and "sauna" which i think are very friendly/playful.</p>
      <p>if thats not what you're after, then finding a good substitute for helvetica shouldn't be too hard. there's so much great type happening all over the world at the moment, your biggest challenge would be trying to chose the one you like the best.</p>
      <p>also custom type as suggested by Ratbaggy is a great idea but thats if you know what you're doing and what you want to achieve.</p>
      <p>And yes, Ratbaggy's absolutely right, the best way to start is by sketching your ideas on paper without the computer. It hurts me to see a lot of designers avoiding that stage and going directly to the machine.</p>
      <p>Best of luck,</p>
      <p>Victor</p>
