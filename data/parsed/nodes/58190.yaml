  html: <p>I'm adding some fairly elaborate swash characters to the font I'm working on. These work contextually. One version of the ll combination overhangs the character before and after. Not a problem for "jello" but it is for "millipede." What I've done is to sub i before and after with dotlessi, and the terminals of the swashes indicate the dots. But now I'm wondering what to do with îllém and so forth. It seems a bit culturally insensitive and possibly confusing meaning to convert these to "dotlessi" and "e". Obviously I can ignore sub these, but the swashitude of the font would be severely reduced in say czech. Any advice, or examples of how this has been handled well?</p>
  html_clean: <p>I'm adding some fairly elaborate swash characters to the font I'm working on. These work contextually. One version of the ll combination overhangs the character before and after. Not a problem for "jello" but it is for "millipede." What I've done is to sub i before and after with dotlessi, and the terminals of the swashes indicate the dots. But now I'm wondering what to do with îllém and so forth. It seems a bit culturally insensitive and possibly confusing meaning to convert these to "dotlessi" and "e". Obviously I can ignore sub these, but the swashitude of the font would be severely reduced in say czech. Any advice, or examples of how this has been handled well?</p>
