    html: |-
      <p><em>Obviously I can ignore sub these, but the swashitude of the font would be severely reduced in say Czech.</em></p>
      <p>Yes, there are languages within which heavy use of swash letters is impeded by heavy use of diacritic marks. The diacritic marks take precedence over the swashes, because they are linguistically significant.</p>
