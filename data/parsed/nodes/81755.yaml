    html: |-
      <p>Normally it shouldn't (as I implied by "normally a good thing" above) since most obviously the relationship between the ascenders and descenders goes out of whack (since the baseline has to stay put).</p>
      <p>However I can think of two cases where such a setup would be a good design compromise, in effect a lesser evil than varying <em>all</em> the proportions:<br>
      1) Using a larger-looking cut of a typeface for emphasis, instead of Italics. You don't want to do this by increasing the point size; and since it's an embedded snippet you want to maintain as much of the horizontal alignment as possible.<br>
      2) If you're mixing writing systems (or even languages*) <em>inline</em> and you want to respect each script's apparent size and Cartesian-space-usage needs without making a mess of horizontal alignment. For example Armenian has the same vertical "bands" as Latin, but -for text- the "x-height" needs to be much smaller. Ideally I would do what I've done in Nour&amp;Patria: vary everything (only maintaining the "style" and as much of the mood as possible). But it gets complicated. So I'm trying to think of a simpler method that can work 90% most of the time and can be applied more efficiently. What I'm thinking is two cuts per typeface, one with a normal x-height/"x-height" and one with an x-height/"x-height" that's too small/big. Everything else would align. What you'd be sacrificing a bit is the descenders (not a huge deal in Latin), but you'd be gaining alignment.</p>
      <p>* Think of the differences in density/size among<br>
      Latinate languages, like Latin versus Polish.</p>
      <p>hhp</p>
