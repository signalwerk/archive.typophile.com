      <p>HrantI &gt;1) Using a larger-looking cut of a typeface for emphasis, instead of Italics. </p>
      <p>but...if the l.c. xht alone grows, and the ascenders do not absorb this growth and grow as well... if there's uppercase in this scheme, despite the possible overshoot of ascenders above caps in some designs, just changing the xht is impossible without raising the caps. Either way, (overshooting ascenders alone, or caps growing with ascenders), you'd need to have a style that originates with lots of extra vertical space.</p>
      <p>Hrant II&gt; 2) If you're mixing writing systems (or even languages*) inline and you want to respect each script's apparent size and Cartesian-space-usage needs without making a mess of horizontal alignment.</p>
      <p>Nobel effort. One of the truly divisive underlying issues in all of font tech, is the distinct differences in the way scripts address the em. Listening to much older hands than myself, I learned that the least evil solution is always to favor the script of the "client". </p>
      <p>The web, of course, 'hopelessly' complicates modern use of the term "client". (So please support the OFF mvar and uvar tables if they ever come up ;)</p>
