      <p>First of all, call me the crazy lone wolf deeper in the woods than anyone in the history of type since the hund o de Baskervilles, but if— “As its name implies, Big Vesta is designed specifically for larger text sizes" is not A.H. getting it reversed I'm bamboozled. Mr. Unger is a genius and "Big" is I hope attached to a design that looks quite clearly designed for smaller text sizes than not big Vesta!?</p>
      <p>Second, I entered this thread under two spells: spell one is that what you asked for in the founding post is impossible according to the physics of the em. Spell two, was that the solution to your desires lies in tooling that allows the em of a font family  to be significantly less rigid than most ems today. This is required for size mastering, reconciliation of interscript em proportioning, and the vast intersection of the two.</p>
      <p>Since this thread started to go Nile delta on us,  i've lost the relationship to italicisity/obliqueness.</p>
