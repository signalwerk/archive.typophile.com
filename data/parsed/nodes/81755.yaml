      <p>I for one don't ignore aesthetics (and I'm having trouble thinking of anybody who does). "Branding" is better termed "identity" here, and one might say it's the raison d'être of my type work (which is frankly why I don't make enough money in it). As for uniformity, it's exactly what I'm fighting; my disdain of Modernism is no secret. The difference is my view of subtlety is much more... subtle :-) than expecting people to simply use different fonts for different scripts (or languages), which I find highly exhibitionist and anti-reading. Breaking "vertical proportions imperialism" is the sort of subtlety I'm promulgating (and implementing); this is part of the subtleties of text typography (as opposed to the subtleties of display typography).</p>
      <p>&gt; Having local type producers is a start, and we have<br>
      &gt; certainly seen that in the last two or three years</p>
      <p>Which is great, but notable is the paradox that John Hudson once made me painfully aware of: historically "natives" have often been the ones doing the most damage to the authenticity of their script, because they try to emulate too closely the admittedly more refined world of Latin type. It's difficult to filter the formalities of Latin type to extract only what really works for a given non-Latin script.</p>
      <p>hhp</p>
