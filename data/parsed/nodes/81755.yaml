      <p>To address Hrant's issue:</p>
      <p>I don't see this as primarily a font problem, but one for typographers and graphic designers; ultimately a question of aesthetics and branding.</p>
      <p>There is a school of thought that would like to have uniformity in type spec between different languages, alphabets, and scripts (in designs ranging from page layouts to corporate identities) — but this desire for economy of means and simplicity of appearance may not be entirely virtuous, it could also be seen as a reluctance to allow typography to cater to the complexity of what it represents.</p>
      <p>If typographers are able to manage the intricacies of mixing sans and serif type, of mixing bold and light weights, of mixing lower case and small caps, oldstyle and lining figures, of applying optically adjusted sizes, then why can't they mix different fonts for different languages and scripts?</p>
      <p>But perhaps type designers can help by providing more typefaces with x-height alternates, which would seem to be an opportunity in the marketplace.</p>
    html_clean: |-
