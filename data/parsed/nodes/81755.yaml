      <p>I think it's an interesting idea. If I remember correctly, Erik van Blokland briefly showed a mouseover effect like that at Webfontday in Munich last year – the idea being to have a website navigation rendered in a given webfont where on mouseover, as a way of highlighting (!) the selected item, instead of boldening or something the x-height would be raised. I don't quite remember how he proposed to do this technically (I think it wasn't about swapping fonts, more like some sort of MM-type OT/CSS magic) but I did find it a striking effect. BTW, in that case the widths stayed the same (which I think is good for this purpose, since having stuff wiggle around in width on mouseover can be distracting).</p>
