      <p>&gt; ultimately a question of aesthetics and branding.</p>
      <p>There's more to typography than that.</p>
      <p>&gt; why can't they mix different fonts for different languages and scripts?</p>
      <p>They can, and sometimes it makes great sense. But if they <em>don't</em> want to produce stuff that's too decorative, if they worry about visual distractions taking away from the <em>content</em>, then their options are extremely limited, because most multi-script type systems are very poorly balanced, exactly because they ignore what I've described. They're basically a lot like forced marriages.</p>
      <p>It's not a matter of making one thing that will cover all styles. It's a matter of making tools that are good enough for typographers who care about functionality. Such tools remain too rare in the non-Latin world.</p>
      <p>hhp</p>
