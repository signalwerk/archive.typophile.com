      <p>David: <em>Well, what do you need in fonts to offer a solution to the issue(s)?</em></p>
      <p>Not speaking for Hrant, but as someone who has to deal regularly with the issue of different scripts within a single set of vertical metrics:</p>
      <p>What I think is needed is script- and language-specific vertical metrics, i.e. applying the OpenType Layout script and language system tagging system to vertical metrics sets. So, for instance, a font that contains both Latin and Arabic designs would have deeper descender metrics for the Arabic script tag, and if its Latin support includes Vietnamese this might have taller ascender metrics for the appropriate language system tag. Applications using vertical metrics for linespacing would then apply the tallest ascender and deepest descender of languages/scripts present in the text, either at the line, paragraph, story or document level depending on user preference.</p>
    html_clean: |-
