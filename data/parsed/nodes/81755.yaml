      <p>The way I see it a font for "normal" text sizes (9-12) has a relatively narrow range of what x-height works. Below text sizes the x-height <em>has</em> to be bigger. But above text sizes it can go either way since readability is moot, and style takes over; smaller x-heights are elegant and dainty, bigger x-heights are loud and hearty.</p>
      <p>Big Vesta could be a font for small sizes if the spacing were loose. But it isn't - it's tighter than the normal cut, so it <em>must</em> be for larger sizes. It's sort of how people say ITC Garamond could actually be a decent font -for small sizes- if the spacing were much looser.</p>
      <p>BTW, who's "A.H."?</p>
      <p>&gt; impossible according to the physics of the em. </p>
      <p>Impossible? The worst thing it would be is non-ideal, because if one cut is balanced in terms of vertical proportions, the other cut cannot be; however as I said this would be a compromise with a benefit: the ability to use apparent size for emphasis while maintaining line height.</p>
      <p>Since I'm talking to one of the sharpest tools in the shed :-) I must have done a lousy job explaining this - but Vesta can actually help. Look at those two cuts, and imagine the Big with slightly longer descenders* - there you have it. So it's not impossible.</p>
      <p>* And I guess spacing loose like the regular cut.</p>
      <p>&gt; tooling that allows the em of a font family to<br>
      &gt; be significantly less rigid than most ems today.</p>
      <p>Well, in terms of between scripts, yes.<br>
      But within Latin we've long seen optical cuts with varying x-heights. The novelty I've introduced here is that a cut with a larger x-height (but all else the same) can be used for emphasis (inline, so at the same point size).</p>
      <p>I do have a feeling that I'm missing part of your argument though.</p>
      <p>&gt; i've lost the relationship to italicisity/obliqueness.</p>
      <p>I might have too.</p>
      <p>But the delta <em>is</em> the most arable!</p>
      <p>hhp</p>
