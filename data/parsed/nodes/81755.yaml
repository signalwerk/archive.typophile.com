      <p>I'd been meaning to come back to this...</p>
      <p>First: David, maybe my request for definitions seemed evasive, or even disingenuous; but I do think there are some things to iron out in the way we collectively look at all this, and in fact I think William's reply does indicate this.</p>
      <p>For a sans, mechanical skewing isn't horrible, although it does really require tweaking (in proportion to the amount skewed). For a serif, it's hard to imagine mechanical skewing being acceptable. But there's no reason to define "slanted-Roman" so dryly. I've seen -and designed- slanted companions to upright serif fonts that are in no way mechanically made, but are in fact closer in flavor and spirit to the upright than to a traditional Italic. This tells me that the definition of "slanted-Roman" isn't so straight-forward. For example to me even going semi-serif on the "Italic" does not preclude it being called a slanted-Roman.</p>
      <p>Success: there are numerous designs I would call slanted-Roman (including some that were actually mechanical, like many of ATFs designs in the beginning of the 20th century) that were at least <em>not disliked</em> enough to be used a good deal. Some of those were made because they were cheaper to make - and people like that! :-)  But some of the non-mechanical ones are quite attractive to many people. Think of Trump Mediaeval's Italic (which is really quite close to the Roman). And Deberny's #16, which to me is highly beautiful. Maybe if you had attended my talk at TypeCon-LA, I could've convinced you then! :-)  I think it's high time for people to reconsider.</p>
      <p>Being a part of culture: if it exists, it is.</p>
      <p>Cultural progress: to me by definition is has to upset most people at first! But it ends up catching on if its merits are indeed strong. And if it's lucky.</p>
      <p>hhp</p>
