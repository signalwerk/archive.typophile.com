      <p>Slanted roman is the same as the roman, but verticals slanted, with some optical correction, serifs flat. Success is that people actually like to use it and read it. If people don't want to use something practical like text type, it's not part of the culture, so I don't know how it can be cultural progress. </p>
      <p>It seems that the typical hooked serifs help to give enough differentiation to a companion made for emphasis. For sans serifs, which are somewhat simpler shapes to start with, it seems like slanting is enough, but not for serifs—you have to mess with the serifs also.</p>
