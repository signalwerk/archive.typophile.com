      <p>As we say in Armenian, I "forgot the big donkey":</p>
      <p>&gt; One of the truly divisive underlying issues in all of font tech,<br>
      &gt; is the distinct differences in the way scripts address the em.</p>
      <p>Indeed this is something I've been campaigning on for over a decade,<br>
      writing articles, giving talks, etc. Some scripts (like Arabic) suffer<br>
      very obviously when their proportions are imposed from Latin so most<br>
      people oppose it; some other scripts, like Armenian, don't suffer overtly<br>
      so everything is made to align with Latin - but it does suffer when it<br>
      comes to readability. And I think this sensibility should be applied even<br>
      to combinations of Latin-using languages that use space very differently.<br>
      And certainly Cyrillic -when its "x-height" is simply taken from a Latin<br>
      master- has suffered too much for too long - it's time for Cyrillic type<br>
      design to make such alignment the exception, not the rule.</p>
      <p>There <em>is</em> merit to alignment - it does have a place in any design<br>
      compromise (which to me is a redundant phrase actually) but<br>
      it's certainly given too much weight almost all the time.</p>
      <p>&gt; the least evil solution is always to favor the script of the "client". </p>
