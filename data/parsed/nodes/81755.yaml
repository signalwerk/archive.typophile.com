      <p>I think Strong (The Style Formerly Known As Bold) can be applied in parallel to... what to call it?... Large? So no problem there as far as I can see.</p>
      <p>But yes, there's <em>is</em> the problem of sometimes having no way to exhibit an increase in size, for example for a character that already fills the Em (mentioned in my second post of May 4). In fact some writing systems (those that don't have extenders) probably can't use the idea at all (at least not without ruining [their version of] leading).</p>
      <p>I guess what I'd say is that no solution works well for everything; you use what works best, and even if by some strange cosmic shift the idea of Large ends up becoming the Standard, there will be times when Italics will work better.</p>
