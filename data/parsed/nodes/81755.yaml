      <p>&gt; if the l.c. xht alone grows, and the ascenders<br>
      &gt; do not absorb this growth and grow as well</p>
      <p>I actually mean that they <em>do</em> "absorb" it - so the overall height of the ascenders does not change. The point is to keep as much of the alignment as possible - not least for reasons of consistent line-height (although I do realize that a larger x-height ideally requires more leading).</p>
      <p>&gt; just changing the xht is impossible without raising the caps.</p>
      <p>Why?<br>
      Certainly if the x-height gets too big the caps (especially the ones that are structurally similar to their lc-s) can get drowned out; but the good news is the caps can actually be allowed to get wider along with the x-height increase (since that doesn't ruin any alignment). There's a bigger problem though*: you can't emphasize something in all-caps (like "I"). Not sure what to do about that.</p>
      <p>* Similar to the case of so-called upright-Italics.</p>
      <p>&gt; you'd need to have a style that originates with lots of extra vertical space.</p>
      <p>Sure. Text fonts. :-)  I'm assuming you mean extra space within the vertical span (as opposed to extra talus - AKA "internal leading").</p>
      <p>&gt; Find somebody with Ares FontChameleon and ...</p>
      <p>Or this exquisitely-timed contribution...<br>
      <a href="http://typophile.com/node/73827" title="http://typophile.com/node/73827">http://typophile.com/node/73827</a></p>
      <p>&gt; Oh dear.</p>
      <p>I just took a closer look at Aldus Nova to figure out Nick's complaint, and I'm not sure this is what he meant, but: what's with the Bold looking just like Palatino Nova Bold? (Also, I can't see any difference between the two Bolds.)</p>
      <p>hhp</p>
