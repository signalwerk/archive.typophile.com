      <p>At the top end is what I call a "multilateral" system where each script* has a master design (that fully respects the script's needs, Cartesian and otherwise) and subordinate designs in each of the other scripts in the system (where each subordinate adapts -although not to the point of "slavery"- to the master design). And the master designs try to belong together stylistically, as equals. This gets very hairy very fast, and AFAIK has only been done once, yours truly's Nour&amp;Patria system.  :-)<br>
      <a href="http://themicrofoundry.com/image/s_rome2-1.gif" title="http://themicrofoundry.com/image/s_rome2-1.gif">http://themicrofoundry.com/image/s_rome2-1.gif</a> **</p>
      <p>* Or technically each <em>language</em> even...</p>
      <p>In the Ernestine&amp;Vem system (the Dublin thing) Nina actually led the way and figured out a valid simplification of the system: since Armenian prefers to be slanted -at least when serifs are involved- she thought to use the Latin's Italic as a "pivot". This worked great, but is pretty limited in versatility; the full multilateral system can accommodate pretty much any typesetting task, with any combination of hierarchic and parallel settings. This thread is basically a search for another valid simplification.</p>
      <p>--</p>
      <p>In terms of breaking the vertical proportions across scripts, one has to decide where to end up! To this end I've used a quasi-numerical method. I render a line for each script where each letter's width comes from its frequency in text:<br>
      <a href="http://themicrofoundry.com/image/s_rome1-4.gif" title="http://themicrofoundry.com/image/s_rome1-4.gif">http://themicrofoundry.com/image/s_rome1-4.gif</a> **<br>
      In this way I can quickly visualize how a given script uses the Cartesian space, in particular in comparison to another script. In the above example one can see: how little variety there is in the Armenian "x-height"; how much more Armenian relies on extenders. Based on this I arrived at ballparks of how to vary the proportions between the scripts, but then had to do some iteration/tweaks to make things just right. It would be nice to have a more robustly numerical system that can spit out the "final answer" based on: letter frequency; and the vertical "weight distribution" of each letter.</p>
      <p>The results have so far been applied to Nour&amp;Patria and Ernestine&amp;Vem; the former system has been used in a handful of projects, and we have high hopes that the latter will see glory once it's finished and FF releases it.</p>
      <p>--</p>
      <p>I think the first thing to do, after accepting that vertical proportion imperialism :-) is a bad thing, is to get Cyrillic and Greek to break free.</p>
      <p>--</p>
      <p>** Images from: <a href="http://themicrofoundry.com/ss_rome1.html" title="http://themicrofoundry.com/ss_rome1.html">http://themicrofoundry.com/ss_rome1.html</a></p>
      <p>hhp</p>
