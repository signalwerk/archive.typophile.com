  html: |-
    <p>Hi! Does anyone know this font? It's called Tanagra, designed by Natale Varetti for a typographical contest in 1910 and later published by Nebbiolo in 1924. It's an interesting font, but I can not find pictures or catalogs: I found only this picture of the italics on the internet. None of you happen to have some more pictures?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tanagra Italic_5147.jpg"></div><p></p>
