  html: |-
    <p>Hi! Does anyone know this font? It's called Tanagra, designed by Natale Varetti for a typographical contest in 1910 and later published by Nebiolo in 1924. It's an interesting font, but I can not find pictures or catalogs: I found only this picture of the italics on the internet. None of you happen to have some more pictures?</p>
    <p><img src="/sites/default/files/old-images/Tanagra Italic_5147.jpg"></p>
