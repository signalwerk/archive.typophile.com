      <p>Hm, very interesting. I haven't seen anything like this before and I wonder where the caligraphy evolved from?</p>
      <p>I especially like the A and L. I think your K and S work really well. I'm not sure the tight curves on N fit with the rather lemon-shaped curves of the other glyphs and I think it could be wider. Z seems to need more weight. I wonder if Y could have a tail like on the L? Would O and Q work with a dot in the middle (like your full-stop)? I'm not sure about the tail on Q. U looks like a non-Latin glyph.</p>
