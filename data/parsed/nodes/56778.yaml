    <p>Hello everybody,</p>
    <p>I have found a typeface used in a book title that I liked. The book was printed around 1930. I thought I would create a font for those Archaic Romanian letters. Below is the source.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sursa_6277.jpg"></div><p></p>
    <p>For the letters tat were missing I had to create them myself. I would like to know your oppinion.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/plansa arhaic cali 2_5599.jpg"></div><p></p>
    <p>The red letters are my creation.</p>
    <p>Please tell me what you think.</p>
    <p>I also have another font preview and requesting critique here:<br>
    <a class="freelinking external" href="http://typophile.com/node/55517" rel="nofollow">http://typophile.com/node/55517</a></p>
