      <p>That's one hell of a font :) Looks like a folk dance!</p>
      <p>I think it looks really interesting, and pretty weird too. Good job! Some characters that still need a little work imo are the M, N and H: I think they might still be a bit too stiff and straight to fit with the others. The curve on the N is nice, but I the heavy vertical lines and the slab serifs may be a bit too ordinary. You might want to experiment a little more with that.</p>
      <p>A problem of a different order are the U and V. They look really nice, but it's hard to recognise them, especially the U. Maybe there is another solution to distinguish these characters be keep them readable.</p>
      <p>Do you want to use this font for anything in particular? It would be interesting to see this font in use! </p>
      <p>cheerio Queneau</p>
