      <p>Hello Queneau,</p>
      <p>Thank you for your comments.<br>
      I forgot to mention this is work in progress and only a first draft so I agree there are thinks to improve. That's why I need your oppinion.<br>
      I will adjust them and get back with the results.</p>
      <p>If you like these kind of Archaic Romanian typefaces you can see more on my blog at:<a class="freelinking external" href="http://florinf.wordpress.com/2009/01/31/arhaic-romanesc/" rel="nofollow">http://florinf.wordpress.com/2009/01/31/arhaic-romanesc/</a>. Those were already created as fonts and are available for free on some free fonts sites.</p>
      <p>These fonts are hard to use because of their connection to a specific time in Romanian history but still they are currently used on books related to Orthodox church, Romanian history and tradition, Romanian greeting cards and so on. They are all just a narrow niche. I don't know if they could be useful for something else.</p>
      <p>Thank you very much for your comment.</p>
