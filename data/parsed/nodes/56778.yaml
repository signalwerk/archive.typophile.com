      <p>Wow, MNO look great! I'm especially pleased with M. Looks like it a lowercase m in disguise.<br>
      I think CEGOQ need to be taller: even though you have based them on the existing ones, they seem to be much shorter because of the shapes.<br>
      U is still a difficult shape. On your blog, the second picture has an interesting U shape but it's still recognisable; perhaps you could do something similar? (But I really like the point on the bottom of your existing one)<br>
      I think the dots work well in O and Q. But I think the Q needs a much fancier tail. Q doesn't appear in any of the alphabets on your blog, I assume there was no need for Q in those days. So you have a lot of freedom to invent something new.<br>
      X troubles me slightly. The curved crossbar seems quite heavy but then narrows into the terminals when normally the opposite would be true. I think it's worth playing with the contrast of both strokes and even perhaps making both of them curves instead of one straight?<br>
      I wonder what a lowercase would feel like for this. It would be very exciting to invent one I think :)</p>
      <p>There are some lovely images on your blog btw. I really like the photoshop-calligraphy images.</p>
