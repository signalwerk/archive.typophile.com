      <p>Hi,</p>
      <p>I think the N, M &amp; H are certainly better. I like the quirky serifs! The new open U is also better, though it still is a difficult character to recognise. The O with dot looks nice too, but I would try to differentiate a bit more between the O and the Q. Maybe you could try to remove the bottom serif of the Q, or build the foot (or whatever you call the little thingy on the Q) from the serif. It's a bit too subtle now, IMO. The new Y with tail is also very nice, it's a keeper! </p>
      <p>The one thing I would now try is to implement the new serifs in all letters (also in the black originals), I think it's okay if you deviate a bit from your example, if it makes a better font.</p>
      <p>Good luck!</p>
      <p>cheerio Queneau</p>
