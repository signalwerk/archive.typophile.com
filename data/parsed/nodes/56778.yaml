      <p>This is really interesting and something I haven't seen before, and I find your blog fascinating as well.</p>
      <p>I actually would recognize your first U better than your second U, familiar as I am with the form as the Greek ou ligature, also used in early Cyrillic. Consider your audience; if this design is intended for those who are already familiar with early Romanian letterforms, then don't be afraid to use shapes that they would expect. You can offer more familiar forms as alternates for the sake of outsiders, but I hope you don't abandon traditional shapes entirely because those not versed in the tradition have trouble recognizing them.</p>
