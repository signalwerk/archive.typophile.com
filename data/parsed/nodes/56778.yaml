      <p>First of all I want to thank you all.<br>
      Very usefull comments.</p>
      <p>I think I will post the Slavonic alphabet that was used in Romania so you can see the letter shapes. They used to write in slavonic and used these letters and later wrote in romanian with some adapted letters (like the latin alphabet, romanian language is using latin letters). After 1860 only latin letters were used. These old letter shapes were scarcely used, mostly in orthodox / religious books.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/01-arhaic-romanesc-gri_5167.jpg"></div><p></p>
      <p>This is a sample of a manuscript.<br>
      The printed books have similar lettershapes.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/12_3644.jpg"></div><p></p>
      <p>Then I will show you the adjustments I did in a separate post.</p>
