    date: 2012-04-07T05:32:00
    votes: null
    html: <p>FontLab's "right class" means that a class represents the right (second) partner of a kern pair. That means you should make this a left class. As it is now, fi will follow the kerning of i when it appears on the right hand side of a kern pair.</p>
