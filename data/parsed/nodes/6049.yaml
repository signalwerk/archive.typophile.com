    html: <p>Fredrik, it certainly is "dangerous". And if I try to nail down why Signa looks Northern European, I would probably have to resort to formal descriptions, and maybe that goes against the "atmospheric" point of all this? Dunno. <br> <br>Feelings are subjective, unreliable, etc. but they're also <i>real</i>. And it makes sense to me that groups of people who share things (like a country) would often express themselves in certain patterns. <br> <br>hhp <br></p>
