    html: <p>Mea culpa. I can't keep up with you youngsters and the zillion computer faces you refer to. When I was setting type on Berthold equipment, I thought that their Concorde was a very classy face with a European flavor. Any of the Gill family say the London Tube stations and markings. Akzidenz Grotesk and Microgramma are other sans serifs. Clarendon and C. Bold were very common in Switzerland, though it's American in style. Hope this helps. <br>PG <br><a href="http://giam.typepad.com/the_branding_of_polaroid_/" target="_blank">http://giam.typepad.com/the_branding_of_polaroid_/</a></p>
