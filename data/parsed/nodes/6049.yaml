    votes: null
    html: "<p>Don't be such Modernists, guys. Lynn's question is... <i>real</i>. It doesn't have a answer like \"1 + 1 = 2\" but there's a fuzzy reality there, and if we think objectively and pragmatically, we can help. She's probably looking for trends, not The Answer. <br> <br>Look at the fonts in tipoGrafica #60. As a group, they're turn-of-the-century (I mean this last one) South American. Look at the stuff in FontFont: as a group, they're very European. Look at Emigre: they're highly Californian. <br> <br>It's somewhat hard to imagine FF Signa for example being designed outside of Northern Europe. Yes, it's not impossible, but the <i>trend</i> is there. Otherwise we wouldn't have differences in culture around the globe. And it would be hard to imagine some of Martinez Meave's fonts being designed outside even <i>Mexico</i>, not even the broader Latin America. And then look at Franklin Gothic, then look at Univers. <br> <br>Don't be afraid of tangible -if hazy- variance. To paraphrase Jerome Peignot: let's celebrate our differences. <br> <br>hhp <br></p>"
    html_clean: "<p>Don't be such Modernists, guys. Lynn's question is... <i>real</i>. It doesn't have a answer like \"1 + 1 = 2\" but there's a fuzzy reality there, and if we think objectively and pragmatically, we can help. She's probably looking for trends, not The Answer. <br> <br>Look at the fonts in tipoGrafica #60. As a group, they're turn-of-the-century (I mean this last one) South American. Look at the stuff in FontFont: as a group, they're very European. Look at Emigre: they're highly Californian. <br> <br>It's somewhat hard to imagine FF Signa for example being designed outside of Northern Europe. Yes, it's not impossible, but the <i>trend</i> is there. Otherwise we wouldn't have differences in culture around the globe. And it would be hard to imagine some of Martinez Meave's fonts being designed outside even <i>Mexico</i>, not even the broader Latin America. And then look at Franklin Gothic, then look at Univers. <br> <br>Don't be afraid of tangible -if hazy- variance. To paraphrase Jerome Peignot: let's celebrate our differences. <br> <br>hhp <br></p>"
