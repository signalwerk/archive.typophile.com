    html: <p> My take on contests is that you submit your best work. If you don't have time to do your best work, don't submit it. Contests are non-revenue projects, so I don't think they should be regarded as "spec work". And having printed a few t-shirts myself, I'm sure Jared &amp; co. are not going to suddenly be the recipients of a financial windfall on the sales of the new typophile t-shirt. Anything they do make, they certainly deserve for creating this great forum.  <br> <br>If some of the folks commenting in this discussion are creating entries for this contest, maybe you spend more time creating a good design rather than thinking of excuses and rationalizations for a bad one. </p>
