    html: "<p> Concerning what Rich Roat wrote (!) concerning his well-placed preoccupation with craft, in the context of this good-samaritan-style contest allow me to make the following suggestion: <br> <br>Maybe the submissions should be regarded as only nearly-finished, and the winner should be: <br>1. Judged based on the assumption (or rather the hope) that -once chosen- the designer will refine it before production. <br>2. Provided with (entirely voluntary) recommendations by the judges as to how to improve the craft (but no recommendations concerning the concept). These recommendations can be taken up by the designer, or not. <br> <br>I think it should be a balance between concept and craft (not letting the latter take absolute precedence) - and I suspect many or all of the judges might agree. A shirt with horrible craft shouldn't be chosen, but one with a great concept that just needs polish shouldn't be discarded as-is, for the simple reason that it takes too long to make it user-ready to justify the largely intagible gain from the weak possiblity of winning - this thing has turned out to be pretty competitive. When you know you've won, you're much more motivated to finish it up for real. <br> <br>Also, a question: is it possible to revise a submission, or should people simply submit a new version alongside? <br> <br>hhp </p>"
    html_clean: "<p> Concerning what Rich Roat wrote (!) concerning his well-placed preoccupation with craft, in the context of this good-samaritan-style contest allow me to make the following suggestion: <br> <br>Maybe the submissions should be regarded as only nearly-finished, and the winner should be: <br>1. Judged based on the assumption (or rather the hope) that -once chosen- the designer will refine it before production. <br>2. Provided with (entirely voluntary) recommendations by the judges as to how to improve the craft (but no recommendations concerning the concept). These recommendations can be taken up by the designer, or not. <br> <br>I think it should be a balance between concept and craft (not letting the latter take absolute precedence) - and I suspect many or all of the judges might agree. A shirt with horrible craft shouldn't be chosen, but one with a great concept that just needs polish shouldn't be discarded as-is, for the simple reason that it takes too long to make it user-ready to justify the largely intagible gain from the weak possiblity of winning - this thing has turned out to be pretty competitive. When you know you've won, you're much more motivated to finish it up for real. <br> <br>Also, a question: is it possible to revise a submission, or should people simply submit a new version alongside? <br> <br>hhp </p>"
