    html: "<p> On the other hand, it's probably safe to say that the better a graphic designer, the less time he has to design a shirt with no reward and minimal prospects of success. My point is that if you make the \"polishing\" provisional (to be applied to the winner only), and you make that fact clear, you then open to door to greater and higher-quality submissions, even if they're of an \"exploratory\" nature. Look at it this way: the designer is submitting nearly-finished work-in-progress to the client. This is important because this client is a mute until the moment of truth. <br> <br>Free work is to be encouraged. But choosing the judging parameters carefully helps improve the eventual results. In fact, the official judging guidelines say nothing about highly exacting craftsmanship. Maybe that was an -unwitting- good \"feature\" of this contest? <br> <br>Anyway, I don't mean to whine. I think one great side-benefit of this contest is that it serves as a tool to learn how to do this better next time. This type of thing is a novelty, with a lot of potential, and it can only improve with critical real-world testing. <br> <br>hhp </p>"
