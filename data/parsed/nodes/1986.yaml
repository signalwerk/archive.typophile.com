  html: <p> Rich sent this today, I'm just passing it along --jared <br> <br>Folks, <br> <br>Been looking at the shirts in anticipation of the end of the contest, and a coupla things come to mind. These are my thoughts and in no way reflect the opinions of the other judges. <br> <br>My initial reaction the designs to date is that there is a heavy emphasis on clever ideas and concepts but not much attention to detail or craft. I will definitely be looking for the latter when I make my choices. Ideas are the easy part...execution is 99% of the battle. <br> <br>-Rich </p>
