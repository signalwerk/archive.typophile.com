  html: |-
    <p>What’s the common practice and the logic for naming the different possible shapes of a and g in the English language?<br>
    From what I could gather, the common practices seems to be to have two groups: the single-story shapes and the double-story shapes. But until now, I fail to see the formal logic behind that.<br>
    If I take the double-story a and turn it upside down, I then get, what is referred to as single-story shape of the g – even though this is exactly the same shape. So what actually are then the “stories” of that character? </p>
    <p>Therefore my personal logic would be to name the different possibilities:<br>
    single-story a<br>
    double-story a<br>
    double-story g (because it is basically an upside down double-story a)<br>
    and three(!)-story g</p>
    <p>But maybe I am missing something …</p>
