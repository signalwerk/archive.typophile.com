    html: |-
      <p>Ralf's original question can be explained away by extending the metaphor. Think of the baseline as ground level. A two-story building has two floors above ground level; you don't count the basement if it has one.</p>
      <p>I think I've identified the best clear way to describe the two main types of g without running into exceptions. The verticals of letters such as b, d, p, q are stems. Any g whose tail drops down from the right side is a <em>stemmed g</em>, and others such as the typical binocular g are <em>unstemmed</em>.</p>
    html_clean: |-
