    html: <p>henriko <br> <br>The last thing I would do if I were making a logotype would be to keep it as a typeface and kern it. The sizes at which your logotype will be reproduced drastically affect the kerning. You need to do something else Henrik. Convert it to outlines, then kern it until you like it. Try making three versions; very small, medium and very large. Use those sizes as needed.</p>
