    html: "<p>Yes it is doing-by-the-eye. However, here is a tip: <br> <br>When spacing letters it is impossible to space 2 letter incorrectly. It is the 3rd letter that will determine good spacing. Work through your word in 3 letter increments covering up the other letters. Once done, check the complete word and fine tune. <br> <br>eg. for the word Aquatoad check Aqu, then qua, uat, ato and so on. <br> <br>Oh, and pray the word you're spacing isn't LJIIWLA <br>Some words are bound to have problems. Time to get creative, make ligatures, shave letters etc. <br> <br>Randy</p>"
    html_clean: "<p>Yes it is doing-by-the-eye. However, here is a tip: <br> <br>When spacing letters it is impossible to space 2 letter incorrectly. It is the 3rd letter that will determine good spacing. Work through your word in 3 letter increments covering up the other letters. Once done, check the complete word and fine tune. <br> <br>eg. for the word Aquatoad check Aqu, then qua, uat, ato and so on. <br> <br>Oh, and pray the word you're spacing isn't LJIIWLA <br>Some words are bound to have problems. Time to get creative, make ligatures, shave letters etc. <br> <br>Randy</p>"
