      <p><i>I also heard that you could "cheat" by using Indesign's optical text-feature</i> <br>Don't listen to that nonsense. <br>For a logo you shouldn't use optical kerning. It's good, but not  <br>good enough. Space it one letter at a time in groups of three. <br> <br>Don't know if you wanted homework :-) <br>Try spacing the word ATLANTA <br> <br></p>
