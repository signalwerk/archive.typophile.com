  html: <p>Mjellow people, <br> <br>Could somebody link me to some information about kerning letters when designing a typographic logo? - I need to know the basics! <br> <br>Or is it simply a doing-by-the-eye-issue? <br> <br>TIA <br> <br>/Henriko</p>
  html_clean: <p>Mjellow people, <br> <br>Could somebody link me to some information about kerning letters when designing a typographic logo? - I need to know the basics! <br> <br>Or is it simply a doing-by-the-eye-issue? <br> <br>TIA <br> <br>/Henriko</p>
