    html: <p>He he. <br> <br>Frank, agreed. <br>Henrik. Off to a nice start. (No grades handed out here :-) I picked the word ATLANTA because it has combinations that need obvious kerning, one real headache, and I was just in Atlanta yesterday. <br> <br>I might make minor adjustments to things. <br>1. AT ------TA should have the same spacing <br>2. ATL looks good <br>3. LA this is the headache. There will be a hole here. You can minimize it as you did by shortening the L. I might shave a bit more off. It also might suggest a little looser word spacing overall so the hole won't stand out as much. <br>4. TL vs NT, NT maybe want a bit more space than TL because the N is more dense than the L. What you're trying to do is set up a good rythm between light and dark. <br> <br>If this was going to be a logo, you might look into an LA ligature, maybe a TL ligature, maybe an NT ligature. If not you might angle the right ends of the T's to mirror the new L. In other words, make this custom not a stock font. This is Frank's point, and a good one. (That and smaller sizes wants looser spacing). <br> <br>I say maybe and might because your eyes and my eyes see differently. You're eyes might want to narrow the arms on the T. That might help. <br> <br>Have fun! <br>Randy <br></p>
    html_clean: <p>He he. <br> <br>Frank, agreed. <br>Henrik. Off to a nice start. (No grades handed out here :-) I picked the word ATLANTA because it has combinations that need obvious kerning, one real headache, and I was just in Atlanta yesterday. <br> <br>I might make minor adjustments to things. <br>1. AT ------TA should have the same spacing <br>2. ATL looks good <br>3. LA this is the headache. There will be a hole here. You can minimize it as you did by shortening the L. I might shave a bit more off. It also might suggest a little looser word spacing overall so the hole won't stand out as much. <br>4. TL vs NT, NT maybe want a bit more space than TL because the N is more dense than the L. What you're trying to do is set up a good rythm between light and dark. <br> <br>If this was going to be a logo, you might look into an LA ligature, maybe a TL ligature, maybe an NT ligature. If not you might angle the right ends of the T's to mirror the new L. In other words, make this custom not a stock font. This is Frank's point, and a good one. (That and smaller sizes wants looser spacing). <br> <br>I say maybe and might because your eyes and my eyes see differently. You're eyes might want to narrow the arms on the T. That might help. <br> <br>Have fun! <br>Randy <br></p>
