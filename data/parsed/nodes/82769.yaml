    <p>Monotype Imaging, a leading global provider of text imaging solutions, has added a self-hosting feature to its Fonts.com Web Fonts solution, enabling enterprises to host Web fonts using their existing servers or content delivery network.</p>
    <p>“We’ve spoken to a number of companies who prefer the ability to control and deploy Web fonts themselves, just as they do with other Web assets,” said Chris Roberts, vice president of marketing at Monotype Imaging. “We listened, and today our professional-tier subscribers have the flexibility to work with fonts either in a self-hosted environment or through our existing hosted service. We’re firmly committed to providing the world’s most comprehensive, convenient and easy-to-use Web font solution.”</p>
    <p>Monotype Imaging’s self-hosting feature is available for Fonts.com Web Fonts subscribers at the professional level. Customers download a kit that steps them through the hosting process. Customers select the fonts they need, and CSS (Cascading Style Sheets) code is provided for rendering in all major browsers. In the future, as browser companies release new browsers or enhanced versions, customers will be able to download updated CSS code to ensure compatibility. Any enhancements that Monotype Imaging applies to its fonts, such optimizing a font to improve legibility, will also be available. “We’ve made it easy for self-hosting customers to use our service with full confidence, knowing they’ll always have access to the most up-to-date font data, and knowing they’ll always comply with the latest browsers. These are the same benefits that our hosted solution provides,” said Roberts.</p>
    <p>While the self-hosting option gives enterprises control over deployment, Monotype Imaging’s hosted approach serves fonts from the company’s worldwide content delivery network, deploying fonts quickly to the user’s screen, anywhere in the world. Monotype Imaging continually updates its Web font service to address changes in browsers or Web font specifications, which are automatically applied as subscribers use the service. “Our hosted solution provides a powerful way for most customers to take advantage of Web fonts,” said Roberts. “By adding a self-hosting option, we’re simply strengthening the breadth and flexibility of our service – while also making professional-tier customers who’ve requested this feature very happy.”</p>
