      <p>The Stag Family is a beautiful font... Looking into buying it when I can spare the cash!... Out of interest... Would anyone have any other recommendations regarding Egyptian fonts? Possibly ones that work well in body copy? I haven't used them much in my design work... although they seem to be increasingly popular in current publications... GQ's use of Soho to name but one... so any advice/tips would be greatly welcomed (i.e font combinations)<br>
      Thanks v. much for the feedback so far.</p>
      <p>P.S Love your Whitman font Kent... Will be def keeping it in mind for future work.</p>
