    <p>Hey,<br>
    I'm a big admirer of the layout/typography of the Guardian newspaper. Since 2005 the publication has used a bespoke Egyptian typeface called 'Guardian', designed by Christian Schwartz - <a href="http://www.christianschwartz.com/guardian.shtml" title="http://www.christianschwartz.com/guardian.shtml">http://www.christianschwartz.com/guardian.shtml</a>. The entire family is made up of Guardian Egyptian, Guardian Sans, Guardian Text Egyptian, Guardian Text Sans and Guardian Agate.</p>
    <p>Unfortunately the font is not available for licensing yet (though it states on his site that it will be available in 2009)... I was wondering though, would anyone would be aware of a similar font family available already?... preferably that had a comparable family size - at least an Egyptian and Sans version anyway.</p>
    <p>Thanks</p>
