      <p>Hi, jarbinson,</p>
      <p>I think you might give a second thought to PF Centro (aka PF Agora). It has three families: <a href="http://www.parachute.gr/fonts.aspx?Sample=1&amp;FontStyleID=&amp;FontFamilyID=7&amp;CharacterSetID=12" rel="nofollow">Sans Pro</a>, <a href="http://www.parachute.gr/fonts.aspx?Sample=1&amp;FontStyleID=&amp;FontFamilyID=18&amp;CharacterSetID=38" rel="nofollow">Serif Pro</a> and <a href="http://www.parachute.gr/fonts.aspx?Sample=1&amp;FontStyleID=&amp;FontFamilyID=19&amp;CharacterSetID=39" rel="nofollow">Slab Pro</a>. But what doesn't make it an optimal choice is its price: the total price of the 3 families is 1615EURO=625 EURO(Sans Pro)+365 EURO(Serif Pro)+625EURO(Slab Pro)</p>
      <p>Compared to PF Centro, A complete Stag family is only priced at 750USD (at Village's online store)</p>
      <p>I hope PF Centro can be a good alternative for you, depsite its high price.:-)</p>
      <p>JZ</p>
