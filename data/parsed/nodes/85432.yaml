  html: |-
    <p>hey,</p>
    <p>i created a magazine as a semesterproject, all german, but i'd appreciate any feedback. bound in 120 g/m2 finelinen paper, 54 pages of content. memphis as logotype, interstate for most titling and footnotes, neutra for articles/essays. it deals with anecdotes, how people relate to them, how it changed with social media, how to get to know a person through objects and soem other stuff. </p>
    <p>full issue:</p>
    <p><a href="http://issuu.com/jessebenjamin/docs/adinterim_1" title="http://issuu.com/jessebenjamin/docs/adinterim_1">http://issuu.com/jessebenjamin/docs/adinterim_1</a></p>
    <p>accompanying blog w/ production images:</p>
    <p><a href="http://dntrm.tumblr.com/" title="http://dntrm.tumblr.com/">http://dntrm.tumblr.com/</a></p>
    <p>probably gonna do a second issue for next semester. strong criticism is highly welcome, also if you think continuing is a good idea.</p>
    <p>thanks!<br>
    jesse</p>
