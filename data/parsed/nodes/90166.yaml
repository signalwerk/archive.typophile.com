    <p>I was walking around Southwark in London, looking at the incredible amount of building development (even though we are going through an economic crisis). I was surprised to see how many large and expensive towers are going up, so close to each other and in almost all of the building sites, the hoardings are branded using Gotham... No real competition here, everyone copying each other, depressing!</p>
    <p> Some samples here, sorry for the dark grainy images.</p>
