    html: |-
      <p>Perhaps they all use the same design/PR/marketing. They are not the same developer though and 3 of them are in competition with each other, they are luxury residential buildings.<br>
      The architecture of the four projects is also quite different. </p>
      <p>Two of the identities are also similar in that they take some inspiration from the architecture. The Harlequin tower fills the Gotham strokes with a pattern of trusses, a motif taken from the architecture. And the Neo Bankside project apart from using Gotham uses another typeface with chamfered corners which also alludes to the structural elements of the building, designed by Richard Roger's office.</p>
