    html: '<p>I think this is almost certainly a hand-lettered custom job rather than a font. <br> <br>There are a handful of script fonts that are reasonably close. Try going to: <br> <br><a href="http://www.myfonts.com/Search?what=fonts&amp;searchtext=script" target="_top">http://www.myfonts.com/Search?what=fonts&amp;searchtext=script</a> <br> <br>and browse through the script options. You may find a suitable substitute. Good luck! <br> <br>David</p>'
