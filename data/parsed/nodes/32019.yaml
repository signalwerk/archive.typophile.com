    html: |-
      <p>Regarding the type, right-align it and set the page numbers in regular characters. </p>
      <p>I’d lose the entire headline unless the brochure is huge and there’s something going on that makes the contents page easy to miss. Every literate adult in Western Civilization can look at that page and know what it is without needing it spelled out. But if you do decide to leave it there, Futura and that serif are worlds apart and the effect they have on each other is cacophonous. Futura comes in enough weights that you can break things up just fine without needing to throw another font into the mix.</p>
