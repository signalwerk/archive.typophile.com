    html: |-
      <p>As Richard suggested, I prefer to mix styles when setting TOCs; that is, if the chapter titles are in italic, folios are not, etc. It helps to clearly define that the folios are not part of the chapter titles, especially if you’re going to set the two close together.</p>
      <p>On the other hand, contrary to Richard’s suggestion about setting the folios flush-right under the “s” from “Contents,” no, no, no. I’ll never understand why people insist on stretching this relationship and thus straining the reader’s eye to connect titles to folios; just because that’s how it was done for a very long time does not make it a good idea.</p>
      <p>One possible and simple solution is to throw the folios on the other side of the titles. Create 2 tab stops, one to set the folios flush-right, and another to set the titles flush-left, like this:</p>
      <p></p><div class="imageWrap"><img src="files/Contents_6505.gif"></div><br>
      &nbsp;<br>
      However, this option would screw with the right-thrust of the overall design, so it may not be appropriate in this case.<p></p>
