    html: |-
      <p>Hi Kris. Plantin &amp; Foco have a very similar line colour which was the primary reason for the pairing. As this is primarily an academic text (although by nature of the subject it will no doubt become a coffee table book), I need to pair two fonts that would occupy the same negative space so the change in type face doesn't interupt the reader.</p>
      <p>Plantin is favourite of mine, it was a selfish choice. </p>
      <p>Foco possess some very nice subtlities in the tails and feet. To me, and that is not to say this is fact, it seemed sympathetic to Maori line. It's a bit of a stretch but it just seem to work. </p>
      <p>To be fair post-rationalising is for clients. There's something to be said when things 'just work' together. So I apologise if you were after a deeper meaning.</p>
      <p>B.</p>
