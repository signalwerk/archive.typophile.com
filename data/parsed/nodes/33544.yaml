    <p>Hi all. This is a message mostly directed to 'Haag' but also to anyone else who might help. About a month ago I purchased 'Foco' for a corporate job but unfortunately it was never used. </p>
    <p>Now I'm doing a book on New Zealand Maori facial tatoos, called Moko's. The book explores both traditional and modern interpretations of Moko design. It's both an academic text as well as a book of beautiful modern portraits (like the one attached).</p>
    <p>Foco is perfect as an alternate text font, for the purposes of this job it complements the subject but also works well paired with Plantin. Unfortunately it has no Italic forms (or none that I can find anywhere online). I desperately want to use this font but need an Italic for us to proceed as the book 272 pages.</p>
    <p>Can anyone help? Unfortunately this is an urgent request as we are presenting a blad in the next week. </p>
    <p>If there isn't an italic version then can someone suggest an appropriate alternative that posesses the same character and tone.</p>
    <p>Regards</p>
    <p>Bevan.</p><div class="imageWrap"><img src="http://typophile.com/files/MauMoko_4445.jpg"></div><p></p>
