      <p>Behrens Antiqua was a Klngspor type.<br>
      So it might be possible, that Schriften-Service Gerstenberg, the follow-up of D. Stempel in Frankfurt, Germany, still holds the matrizes. Its not in the current program. This means, officially its only possible to order 6 times 1/2 minimum. So if you would order a, lets say, 28 p (best choice to produce clean prints from) 1/2 minimum’s weight is at about 8 kg. 1 kg = 65 Euro. 8 x 520 Euro. 6 times 1/2 kg ... lot of money. :( - may be, its possible to order just 3 times 1/2 minimum... I don’t know yet.</p>
      <p>If you are interested you can go directly into contact:<br>
      <a href="http://www.schriftenservice-d-stempel.de/kontakt.htm" title="http://www.schriftenservice-d-stempel.de/kontakt.htm">http://www.schriftenservice-d-stempel.de/kontakt.htm</a></p>
      <p>Or, easier,discuss it with me by email. I’m representative of the company:<br>
      <a href="http://www.bleisetzer.de" title="www.bleisetzer.de">www.bleisetzer.de</a></p>
      <p>Regards,<br>
      Georg<br>
      _______________________________________________<br>
      „Ich bin ein Preuße, kennt Ihr meine Farben...“</p>
