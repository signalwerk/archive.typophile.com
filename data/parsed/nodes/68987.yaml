      <p>"Frankensteined" is about right. The F serif says Caslon to me too. That C serif looks grotesquely squared off. I'm not impressed with this work, and I think someone with marginal skills mangled a font that was handy to create a fairly ugly logo. If it's to be your job to re-do it, I'm sure you can improve it.</p>
      <p>- Mike Yanega</p>
