    <p>I've uploaded a couple of pictures and words on my latest type design workshop over at my website. <a href="http://www.kennmunk.com" title="http://www.kennmunk.com">http://www.kennmunk.com</a> click "workshops"<br>
    The pictures aren't that good, sorry about that.<br>
    Forcing the students to make the Greek alphabet was a succes, I think. It's close to the latin one, but still had some surprising characters for them to work on.<br>
    My only regret is that I didn't get a Greek to show up for evaluation.</p>
