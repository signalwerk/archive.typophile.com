    <p>Hi. I'm looking for fabric samples or a good catalog of same (or other good examples of ethnic decoration) for swirling patterns similar to what Kris Sowersby uses in his <a href="https://web.archive.org/web/20081121051313/http://www.klim.co.nz/content/type_reader.html">Klim </a> logo. Any suggestions?</p>
