      <p>Generally speaking, although I know there are some real doozers out there and plenty of them to be sure, a lot of crappy work is the result of companies with lots of doe and little taste hiring some one on the cheap to shill their crap. Generally, cheap means little talent, and the results are predictable... They are crap. No argument there, but the fact that the person who does the work has no talent isn't their fault. We all do what we can and there is no shortage of "AAA Towing" companies and "Crazy Joe's Discount Carpets" joints they can work for, but if a bigger company that should know better comes calling, they'd be stupid not to take the job. Their work naturally becomes a laughing stock, but really, who's to blame? I don't like to see the poor benighted schlubs who accept the job take the heat for the stingy corporation that hired them. </p>
      <p>And then, there is <a href="http://www.davidairey.com/london-2012-olympic-logo-disaster" rel="nofollow">the London 2012 Olympics. </a></p>
