    html: |-
      <p>Actually, the more I look at the Shakers ad, the more I think that it does send particular messages to the target demographic--white people over 50. First, the typography is downright archaic, so you don't expect young people to be there. The seeming incompetence of the design is a signal that the place is unpretentious. People who dine here don't know the names of typefaces, and if they could name one, it would probably be whatever the default is on their 10 year old PC. Its a place where 'regular people' can go and get a meal. Its not going to be too expensive. They'll have lots of choices. You don't have to worry about someone putting arugula on your salad or trying to convince to try vegan tapas or some other nonsense. If that is what they're trying to communicate, they did so very effectively. Its like Texas governors saying "nucular"--it means something to people who are looking for it.</p>
      <p>In all the print-related jobs I've had, I can only recall typesetting a menu on one occasion. It was for a Chinese restaurant that wanted to cram 200 menu options onto a single take out flier. I tried to explain to them that if they are catering to non-Chinese diners, a more streamlined approach could allow them to potentially charge more. To a point, as restaurants move upscale they often have fewer items on the menu. They would have none of that, and I ended up committing some kind of atrocity with the leading. Who's to say though, maybe they knew their business better than I did.</p>
    html_clean: |-
