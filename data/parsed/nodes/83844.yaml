    html: |-
      <p>Ok, that I can perfectly see; the letters are standing tall, almost proud, separate to each other in the previous version.</p>
      <p>When we talk about balancing the inner space of the letters with the space between letters, we're talking about total area, really, and not about just the optical width of the spaces, right? So that, for instance, if we take the “u” in the previous version: if we measured both the area of the spaces before and after it and the area of its inner space, we'd find out that there’s (a lot?) more space around the letter than inside it; whereas if we do the same thing with the new version, the numbers are probably a lot closer, even though optically it seems to have much more space inside it than outside.</p>
      <p>Is this correct? It seems obvious and I've known this for quite a while, but I still can't “see it”, intuitively look at it and know it’s not balanced.</p>
