    <p>I was going through <a class="freelinking external" href="http://www.underconsideration.com/brandnew/" rel="nofollow">Brand New</a>’s <a class="freelinking external" href="http://www.underconsideration.com/brandnew/archives/the-b-side/" rel="nofollow">B Side</a> and I saw this new identity for Blurb, a company that allows people to self produce books.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/blurb_4001.jpg"></div><p></p>
    <p>Now, I'm still not that confident about distinguishing good kerning from bad kerning; and everybody seems to be commenting, there, on how the kerning of the new logo is much improved over the kerning on the old logo, but I don't really see that.</p>
    <p>Is this true? Do you agree with that? Which version has better kerning?</p>
  html_clean: |-
    <p>I was going through <a class="freelinking external" href="http://www.underconsideration.com/brandnew/" rel="nofollow">Brand New</a>’s <a class="freelinking external" href="http://www.underconsideration.com/brandnew/archives/the-b-side/" rel="nofollow">B Side</a> and I saw this new identity for Blurb, a company that allows people to self produce books.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/blurb_4001.jpg"></div><p></p>
    <p>Now, I'm still not that confident about distinguishing good kerning from bad kerning; and everybody seems to be commenting, there, on how the kerning of the new logo is much improved over the kerning on the old logo, but I don't really see that.</p>
    <p>Is this true? Do you agree with that? Which version has better kerning?</p>
