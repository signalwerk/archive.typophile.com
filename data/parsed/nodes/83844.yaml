    html: <p>Do you see how the old version is spaced so that it looks almost like a monospaced typeface? The letters all feel stilted and separate as if they don't like each other very much. The new letters by comparison flow into one another and feel more united as a word. The kerning isn't perfect on the new one, but it is better.</p>
