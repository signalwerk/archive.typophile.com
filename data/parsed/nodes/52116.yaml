    html: |-
      <p>What about a reverse P flush against a N?</p>
      <p>I have to force myself to see a N, which sort of defeats the point. What is their focus, Precision, Networking, or Precision Networking? Their mark should be a reenforcing. If you want to use the N as the focal point, then you may want to look at a Serif font with bit more curvature that allows you to incorporate at the P shape hinting. San-serif offer that precision of 90 degree lines, but really that's a big stretch.</p>
      <p>As for why Penguin Books' logo is successful is because the Penguin is usually printed on a book, thus you don't really need to reiterate the book aspect of the book. When you see them as a sponsor of an event, I believe they have the Penguin logo with their name spelled out as well.</p>
    html_clean: |-
