    <p>This is for the company called Precision Networking. The mark is clearly very simple, so there's a chance it duplicates some existing work. Proper due diligence is to come.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/n-symbol-on-white_5183.png"></div><p></p>
    <p>Any thoughts on the mark ? Specifically if it is sufficiently unique and recognizable or it it's too generic.</p>
    <p>I have a set of related sketches , I will try and upload a bit later on.</p>
    <p>Thanks,<br>
    Alex</p>
