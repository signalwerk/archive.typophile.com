      <p>It is light, simple, symmetrical and it also implies a ruler, which captures the 'precision' part of the name. </p>
      <p>While I am quite proud of it, it is kind of hard to work with because of the unbound negative space on both sides of it. So I have ultimately decided against using it and go with a wordmark instead. I'll post it separately in a bit.</p>
      <p>@litera: P+n <em>is</em> a deliciously simple mark, I agree with you :-) It'd be a shame not to recycle it for some other project.</p>
