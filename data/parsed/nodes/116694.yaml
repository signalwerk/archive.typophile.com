      <p>Thanks, the Graphik/Graphite Shadow look like a good compromise. Although they are missing the slight rounding on the characters (specifically noticeable on the "A") that makes the original look that much softer.</p>
      <p>I'd still like to find out what the original is without the shadow</p><div class="imageWrap"><img src="http://typophile.com/files/font_5360.jpg"></div><p></p>
      <p>Whatthefont suggests:<br>
      <a href="http://www.myfonts.com/fonts/urw/snv/d-extra-condensed/" title="http://www.myfonts.com/fonts/urw/snv/d-extra-condensed/">http://www.myfonts.com/fonts/urw/snv/d-extra-condensed/</a><br>
      <a href="http://www.myfonts.com/fonts/suomi/ticketbook/light/" title="http://www.myfonts.com/fonts/suomi/ticketbook/light/">http://www.myfonts.com/fonts/suomi/ticketbook/light/</a><br>
      <a href="http://www.myfonts.com/fonts/jnlevine/coldfield/regular/" title="http://www.myfonts.com/fonts/jnlevine/coldfield/regular/">http://www.myfonts.com/fonts/jnlevine/coldfield/regular/</a></p>
      <p>but none have either the rounded edges or squared bowls</p>
