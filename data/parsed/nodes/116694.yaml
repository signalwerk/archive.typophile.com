      <p>There was an older font called <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Image-Club-Graphics&amp;ffam=Graphik%20Shadow%20-%20Regular&amp;fid=22b55e4e9110deb9f5f6f268944982b2&amp;fsize=60&amp;text=BODY%20HEAT&amp;fit=1" rel="nofollow">Graphik Shadow</a></strong> by Image Club Graphics [1992] but I don't think it's available now.<br>
      There is also <strong>GraphiteShadow</strong> by SoftMaker Software [1995] but the name and the date suggest this is a plagiarism (SoftMaker is famous for that).<br>
      If you expand a little one of the above you will be very close (they have the shadow).</p>
      <p>You can also start with <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Typodermic&amp;ffam=Nesobrite%20-%20Condensed&amp;fid=1caab99605ba05c4ee27b6fd3a906b57&amp;fsize=60&amp;text=BODYHEAT&amp;fit=1" rel="nofollow">Nesobrite (Condensed)</a></strong> by  Ray Larabie [Typodermic, 2007]  and add the shadow-  I think you will be close enough.</p>
