    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TG_release_Obliques-kopia_5444.gif"></div><p></p>
    <p>Our largest type family just got bigger! Originally designed by Veronika Burian and José Scaglione as a titling typeface, <a class="freelinking external" href="http://www.type-together.com/Tablet%20Gothic" rel="nofollow">Tablet Gothic</a> is quickly becoming a news designer's favourite. The font delivers the sturdy, straightforward and clean appearance expected from a grotesque combined with a good measure of personality. Now with the obliques making it a total of 84 fonts with six grades of condensation, <a class="freelinking external" href="http://www.type-together.com/Tablet%20Gothic" rel="nofollow">Tablet Gothic</a> can deliver consistent impact even better, whatever the publication format. </p>
    <p><strong>Please <a class="freelinking external" href="http://www.typetogether-news.com/lists/lt.php?id=LBgDUA8IUQpSSAcGXBgCAgQC" rel="nofollow">contact us</a> if you wish to upgrade your copy of Tablet Gothic to include obliques.</strong></p>
    <p>more information at: <a class="freelinking external" href="http://www.type-together.com/Tablet%20Gothic" rel="nofollow">http://www.type-together.com/Tablet Gothic</a></p>
