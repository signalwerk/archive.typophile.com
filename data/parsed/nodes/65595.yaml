    html: '<p>This was probably engraved by hand, not based on a typeface. There are a few digital fonts that come close: <a href="http://www.fontshop.com/fonts/downloads/shinntype/handsome_pro_ot/" rel="nofollow">Handsome</a>, <a href="http://www.fontshop.com/fonts/singles/monotype/monoline_script_std_regular/" rel="nofollow">Monoline Script</a>, <a href="http://www.fontshop.com/fonts/downloads/comicraft/matinee_idol/" rel="nofollow">Matinee Idol</a>, <a href="http://www.fontshop.com/fonts/singles/monotype/swing_std_regular/" rel="nofollow">Swing</a></p>'
