    and the weather is sizzling hot<br>
    Mister GOB for his squab,<br>
    a marine for his queen<br>
    a G.I. for his cutie-pie is not<br>
    Cause it's too too too darn hot<br>
    It's too darn hot<br>
    It's too darn hot</p>
