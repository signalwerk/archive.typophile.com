    <p>TOO DARN HOT<br>
    From the show "Kiss Me Kate" (1948)<br>
    (Cole Porter)</p>
    <p>It's too darn hot<br>
    It's too darn hot</p>
    <p>I'd like to sup with my baby tonight<br>
    and play the pup with my baby tonight<br>
    I'd like to sup with my baby tonight<br>
    and play the pup with my baby tonight<br>
    but I ain't up to my baby tonight<br>
    cause it's too darn hot<br>
    It's too darn hot<br>
    It's too darn hot</p>
    <p>I'd like to stop for my baby tonight<br>
    and blow my top with my baby tonight<br>
    I'd like to stop with my baby tonight<br>
    and blow my top with my baby tonight<br>
    but I'd be a flop with my baby tonight<br>
    cause it's too darn hot,<br>
    it's too darn hot<br>
    it's too darn hot</p>
    <p>I'd like to fool with my baby tonight<br>
    break ev'ry rule with my baby tonight<br>
    I'd like to fool with my baby tonight<br>
    break ev'ry rule with my baby tonight<br>
    but pillow you'll be my baby tonight<br>
    cause it's too darn hot<br>
    it's too darn hot</p>
    <p>*BRIDGE*<br>
    According to the Kinsey report<br>
    ev'ry average man you know<br>
    much prefers to play his favorite sport<br>
    when the temperature is low<br>
    but when the thermometer goes way up<br>
    and the weather is sizzling hot<br>
    Mister Adam for his madam is not<br>
    cause it's too too<br>
    it's too darn hot, it's too darn hot<br>
    It's too too too too darn hot</p>
    <p>I'd like to call on my baby tongiht<br>
    and give my all to my baby tonight<br>
    I'd like to call on my baby tongiht<br>
    and give my all to my baby tonight<br>
    but I can't play ball with my baby tonight<br>
    cause it's too darn hot<br>
    it's too darn hot</p>
    <p>I'd like to meet with my baby tonight<br>
    get off my feet with my baby tonight<br>
    I'd like to meet with my baby tonight<br>
    get off my feet with my baby tonight<br>
    but no repeat with my baby tonight<br>
    cause it's too darn hot<br>
    it's too darn hot </p>
    <p>I'd like to coo with my baby tonight<br>
    and pitch some woo with my baby tonight<br>
    I'd like to coo with my baby tonight<br>
    and pitch some woo with my baby tonight<br>
    but sister you fight my baby tonight<br>
    cause it's too darn hot<br>
    it's too darn hot</p>
    <p>According to the Kinsey report<br>
    ev'ry average man you know<br>
    much prefers to play his favorite sport<br>
    when the temperature is low<br>
