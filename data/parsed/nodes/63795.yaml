      <p>In a page layout application, when you want to use smallcaps, you select a smallcap function from the UI, you don't input an OTL four-letter feature tag. The application then applies smallcaps according to what the font supports and how it supports it: it might be the OTL ‘smcp’ feature or it might be outline scaling or it might be via some other smart font format (e.g. AAT) that the application recognises and knows how to process. The CSS discussion is about the same higher-level function approach, so instead of using a font format-specific tagging system, it will use its own syntax which can then be interpreted according to the feature systems of any smart font format supported by the browser. [And in a web authoring tool or environment the function may be presented as a UI option, hiding the CSS syntax, as exists for e.g. bold and italics in such tools.]</p>
      <p>Also note that application layout functions call more than one OTL feature, e.g. an allcaps function might call both the OTL ‘case’ feature and the ‘cpsp’ feature. Same with CSS.</p>
