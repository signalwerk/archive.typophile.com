      <p>David,</p>
      <p>I guess you misinterpreted this particular part of the discussion. It was exactly about avoiding use of 4-letter tags (as coming from underlying font technology) and use "well-known" features (aka common names).</p>
      <p>I am not sure why you call it renaming. There is nothing to rename in the first place, set of CSS properties and names is in process of being defined. Names and set of features+values are not fixed, there are at least two proposals. If you have problems with particular property definition, name, or available values, tell us and we can look at it.</p>
      <p>Disclaimer: I realize that OpenType being de facto standard had inspired people to start working on CSS typographic features and, therefore, there is a certain bias in including features that are available only in OpenType. But it does not mean that we are targeting OpenType specifically. I am looking at OpenType feature registry just as organized set of possibilities available to define and implement.</p>
      <p>Thanks,<br>
      Sergey</p>
