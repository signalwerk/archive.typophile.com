      <p>&gt; If you have problems with particular property definition, name, or available values, tell us and we can look at it.</p>
      <p>Yes I do. The syntax "invented" for CSS, as I read it, is that a typeface family is called a "font" and a typeface style is called a "face". So, within this syntax, a "font-variant" is a poor description for a glyph variant. The user has already, (presumably) selected a script and language, and (definitely) a font and a face. So why, if the user is already down to glyphs, are CSS calling a glyph-variant a font-variant?</p>
      <p>Later in the <a href="http://dev.w3.org/csswg/css3-fonts/">same page</a>, you see:<br>
      "Appendix A: Mapping <em>font features</em> to CSS properties", (my italics)</p>
      <p>I read this hoping it would describe how the mis-named font-variant(s) would be mapped to OT features.<br>
      Surprise! this section is almost exclusively discussing "font face" mapping issues.</p>
      <p>Cheers!</p>
