      <p>@dberlow</p>
      <p>DB&gt;<em>"The syntax “invented” for CSS, as I read it, is that a typeface family is called a “font” and a typeface style is called a “face”.</em></p>
      <p>A typeface family is called a "font-family". "face" to my knowledge, appears only in the @font-face declaration. It has no special meaning, just a label with a vague connection to "typeface".<br>
      In CSS, a declaration with an @ in front of it works like a wrapper containing yet more declarations that are applied only under certain or under all conditons. For example, to apply a set of rules only for when the web page is printed:<br>
      @media print{<br>
      ... put the print-only rules here. For example, this next declaration:<br>
      body{font-family:constantia, georgia, serif;}<br>
      }</p>
      <p>Basic CSS properties like word-spacing, letter-spacing, line-height, etc... probably don't map in the ways you might expect if you come from a print design background.<br>
      For example, there is no property that corresponds exactly to leading in CSS.<br>
      The space between lines is the value of the line-height property minus the bounding box created by the choice of font-family and font-size.</p>
      <p>CSS is up and working on a billion desktops. You might find the nomenclature silly, or stupid - and it may be - but you're hopelessly outnumbered. Mohammed <strong>must</strong> go to the mountain because this mountain is really friggin' huge and there's no going back and changing any of it. There is only adding to it. And that's what's being worked out with the font features discussions.</p>
      <p>@anyone at all:</p>
      <p>I don't know if there's a tutorial along the order of, "CSS for Print Designers" which maps the various properties to their equivalents in print and desktop publishing terminology but if not, well, quite a worthwhile project if ever there was one.<br>
      If I can't find anything, if someone gives me the list of print/desktop publishing terms I'll map 'em to the CSS equivs.<br>
      Any takers?</p>
