    <p>I put features in quotes, because that's our word for them. I'm trying hard to follow a discussion on <a href="http://lists.w3.org/Archives/Public/www-font/" title="http://lists.w3.org/Archives/Public/www-font/">http://lists.w3.org/Archives/Public/www-font/</a>,<br>
    ...where the discussion, not to mention the specification,  seems to be veering in an odd direction. </p>
    <p>Right now, the specification says "small caps" is "font-variant", and as far as I can tell, the pattern is being set, it seems, to rename all of the font features. As far as I can tell, according to JK:</p>
    <p>"One of the reasons to propose specific properties (font-variant-* or  whatever) for "well-known" features is that it allows the CSS to be less closely tied to the underlying font technology."</p>
    <p>But these names do not come from an underlying font technology, or any font technology. These names come from years of education.</p>
    <p>So, while I'm busy trying to figure out how to save size, scale and render, can someone else explain either to me, or to them what the hell is going on?</p>
    <p>Cheers!</p>
