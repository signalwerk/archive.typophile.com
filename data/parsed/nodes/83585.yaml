    html: |-
      <p>They're actually using <a class="freelinking external" href="http://vikingcycles.com/" rel="nofollow">a typeface as webfont</a> which is simply called "Viking". So I guess they're using the same corporate typeface for woodmark.<br>
      It makes me also thinking about Darden Studio main woodmark, which could be seen <a class="freelinking external" href="http://payload.cargocollective.com/1/0/6840/116678/DardenStudioLogo_01_1.jpg" rel="nofollow">here</a> and <a class="freelinking external" href="http://payload.cargocollective.com/1/0/6840/116678/DardenStudioCards_Group_02_1.jpg" rel="nofollow">here</a>. Looks pretty close to me. Unfortunately, part of <a class="freelinking external" href="http://www.houseind.com/fonts/unitedcollection" rel="nofollow">United Sans</a> (hardly tweaked), don't any commercial font that looks like this.</p>
