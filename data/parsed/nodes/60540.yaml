    <p>Seeing a lot of threads about ambigram lately makes me feel itch to show mine as well. So here they are, some oldies but goodies.</p>
    <p>MAM, short for Merdeka Ataoe Mati:<br><a href="http://merdekaataoemati.com/works/dec08/entry02/01.swf">http://merdekaataoemati.com/works/dec08/entry02/01.swf</a><br><a href="http://merdekaataoemati.com/works/dec08/entry02/08.swf">http://merdekaataoemati.com/works/dec08/entry02/08.swf</a><br><a href="http://merdekaataoemati.com/works/dec08/entry02/10.swf">http://merdekaataoemati.com/works/dec08/entry02/10.swf</a></p>
    <p>jimmy AND/OR minim:<br><a href="http://merdekaataoemati.com/works/dec08/entry03/01.swf">http://merdekaataoemati.com/works/dec08/entry03/01.swf</a></p>
    <p>DIK, short for Design Is Kinky (a contest submission):<br><a href="http://merdekaataoemati.com/works/dec08/entry12/02.swf">http://merdekaataoemati.com/works/dec08/entry12/02.swf</a></p>
    <p>MEW:<br><a href="http://merdekaataoemati.com/works/jan09/entry04/01.swf">http://merdekaataoemati.com/works/jan09/entry04/01.swf</a></p>
    <p>PS: You can zoom, rotate or mirror them if you view them on <a href="http://merdekaataoemati.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">my site</a>.</p>
