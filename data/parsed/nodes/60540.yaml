      <p>Yes, indeed. MEW was easy. :D</p>
      <p>And, yes, I'm affraid you are wrong. because actually there are many types of <a class="freelinking external" href="http://en.wikipedia.org/wiki/Ambigram" rel="nofollow">ambigrams</a>:<br>
      - MAM is a 'mirror-image' ambigram.<br>
      - jimmy/minim is a 'mirror-image', 'rotational', 'symbiotogram' and 'natural' ambigram.</p>
