      <p>Well, I don't want to be harsh but the only ambigrams here are the DIK and MEW.<br>
      Ambigrams are words that after rotating them 180 degrees look the same... None of MAM symbols does that, neither jimmy (even though I like it most).<br>
      And besides - it probably wasn't very hard to make a MEW ambigram, huh? ;)</p>
      <p>If I'm wrong - let me know. I'm not 100% sure...<br>
      - Filip Łysyszyn</p>
