    <p>Seeing a lot of threads about ambigram lately makes me feel itch to show mine as well. So here they are, some oldies but goodies.</p>
    <p>MAM, short for Merdeka Ataoe Mati:<br>
    <a href="http://merdekaataoemati.com/works/dec08/entry02/01.swf" title="http://merdekaataoemati.com/works/dec08/entry02/01.swf">http://merdekaataoemati.com/works/dec08/entry02/01.swf</a><br>
    <a href="http://merdekaataoemati.com/works/dec08/entry02/08.swf" title="http://merdekaataoemati.com/works/dec08/entry02/08.swf">http://merdekaataoemati.com/works/dec08/entry02/08.swf</a><br>
    <a href="http://merdekaataoemati.com/works/dec08/entry02/10.swf" title="http://merdekaataoemati.com/works/dec08/entry02/10.swf">http://merdekaataoemati.com/works/dec08/entry02/10.swf</a></p>
    <p>jimmy AND/OR minim:<br>
    <a href="http://merdekaataoemati.com/works/dec08/entry03/01.swf" title="http://merdekaataoemati.com/works/dec08/entry03/01.swf">http://merdekaataoemati.com/works/dec08/entry03/01.swf</a></p>
    <p>DIK, short for Design Is Kinky (a contest submission):<br>
    <a href="http://merdekaataoemati.com/works/dec08/entry12/02.swf" title="http://merdekaataoemati.com/works/dec08/entry12/02.swf">http://merdekaataoemati.com/works/dec08/entry12/02.swf</a></p>
    <p>MEW:<br>
    <a href="http://merdekaataoemati.com/works/jan09/entry04/01.swf" title="http://merdekaataoemati.com/works/jan09/entry04/01.swf">http://merdekaataoemati.com/works/jan09/entry04/01.swf</a></p>
    <p>PS: You can zoom, rotate or mirror them if you view them on <a class="freelinking external" href="http://merdekaataoemati.com" rel="nofollow">my site</a>.</p>
