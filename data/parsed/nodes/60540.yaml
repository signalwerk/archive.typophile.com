      <p>If you're going to talk ambigrams you have to reference the master 'John Langdon' who is credited with inventing them. His site is a great resource of great examples.</p>
      <p>----- snip ------<br>
      "In the early 70s, trying to do with words what Dali and Escher did with images, I invented (or discovered) what came to be known as "ambigrams." In 1980, I discovered that Scott Kim had invented them, too, almost at the same time."<br>
      ----- snip ------</p>
      <p><a href="http://www.johnlangdon.net/background" rel="nofollow">John Langdon Website</a></p>
