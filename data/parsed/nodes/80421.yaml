    <p>Hi,</p>
    <p>I would like to ask you what's the font they use for the their identity logo ?</p>
    <p><a href="http://www.designworklife.com/" title="http://www.designworklife.com/">http://www.designworklife.com/</a> (quite similar...)</p>
    <p>Thanks for your help.</p>
    <p>I'm trying to do my logo with a font base that is similar to the Marshall logo, so I'm looking for fonts (similar) that could help building my logo.</p>
    <p>Or maybe for a good begining base this font could be great, but I don't know what is this font ?</p>
    <p>Words: secretarial and ribbon</p>
    <p><a href="http://media2.smashingmagazine.com/images/retro-vintage-typography/curt.jpg" title="http://media2.smashingmagazine.com/images/retro-vintage-typography/curt.jpg">http://media2.smashingmagazine.com/images/retro-vintage-typography/curt.jpg</a></p>
