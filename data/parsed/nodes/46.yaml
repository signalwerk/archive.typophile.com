    html: "<p> I don't/can't know when Spiekermann had the idea, but I've been saying it on-and-off here-and-there for about 2 years now. <br> <br>The impediments: <br>1. The main ground in bitmap font design is already saturated - innovations like Jens's NNF cannot have great penetration in the mainstream. <br>2. The next leap in bitmap design seems to still be unimplementable, technically - even BitFonter falters there. <br> <br>&gt; only a font's outlines are propietary <br> <br>I'm not sure what you mean. Are bitmaps not legally protected, maybe because they're not \"software\", and for some strange reason outline fonts are? Not that our legal systems (especially the one in the US) make any sense, but I think at best this is a gray area, especially when you consider that increasingly just plain data (like in a database) is starting to be seen as Intellectual Property. <br> <br>In any case, since the bitmaps in a font cannot be easily extracted (certainly not if it's done through delta-hinting), this is a moot point. There has to be a multiple-version scheme - and naming gets tricky there, btw. <br> <br>hhp </p>"
    html_clean: "<p> I don't/can't know when Spiekermann had the idea, but I've been saying it on-and-off here-and-there for about 2 years now. <br> <br>The impediments: <br>1. The main ground in bitmap font design is already saturated - innovations like Jens's NNF cannot have great penetration in the mainstream. <br>2. The next leap in bitmap design seems to still be unimplementable, technically - even BitFonter falters there. <br> <br>&gt; only a font's outlines are propietary <br> <br>I'm not sure what you mean. Are bitmaps not legally protected, maybe because they're not \"software\", and for some strange reason outline fonts are? Not that our legal systems (especially the one in the US) make any sense, but I think at best this is a gray area, especially when you consider that increasingly just plain data (like in a database) is starting to be seen as Intellectual Property. <br> <br>In any case, since the bitmaps in a font cannot be easily extracted (certainly not if it's done through delta-hinting), this is a moot point. There has to be a multiple-version scheme - and naming gets tricky there, btw. <br> <br>hhp </p>"
