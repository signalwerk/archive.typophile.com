  html: "<p> When setting type on the web today, you have two basic sans-serif choices, based on what most platforms will support: Arial and Verdana.  <br> <br>Verdana quickly proliferated throughout the computer world thanks to the company who commissioned its design from Matthew Carter: Microsoft. <br> <br>Is it possible to get that type of exposure without giving the typeface away for free? </p>"
