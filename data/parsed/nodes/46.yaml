    html: "<p> To embellish Jared's point: <br> <br>Erik mentioned the purpose of this was intended  <br>to allow multiple people to work on a project  <br>(e.g. editing or copy-fitting) without having to  <br>procure additional licenses. <br> <br>I hadn't thought of the potential application for  <br>Web use. <br> <br>I do think, however, that in order for mass  <br>adoption (to the level of Verdana, Arial, Times  <br>and Georgia) the font needs to come pre-installed  <br>on an OS or bundled with a browser. </p>"
