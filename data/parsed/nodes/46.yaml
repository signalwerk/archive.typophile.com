    html: "<p> A tangent: <br> <br>If you make a font with outlines and bitmaps, you can give away the bitmap-only version, get people hooked, and charge for the version that has outlines with the bitmaps embedded. <br> <br>This is yet another way that bitmaps are superior to [delta-]hinting. <br> <br>hhp </p>"
