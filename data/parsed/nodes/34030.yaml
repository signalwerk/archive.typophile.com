      <p>Hrant, the version currently offered at myfonts.com is 4.0801. <a href="http://www.myfonts.com/fonts/emigre/filosofia/regular/win-t1/246667/">They indicate</a> that the regular weight (Windows PostScript) contains 2777 kerning pairs. The version I licensed for a project a few years back contains 194 kern pairs! And that is consistent with a thorough analysis that Kent Lew provided in this thread: <a href="http://typophile.com/node/459#comment-2948" title="http://typophile.com/node/459#comment-2948">http://typophile.com/node/459#comment-2948</a>.</p>
      <p>Clearly, there have been updates. </p>
      <p>It strikes me as a little odd that the earlier release had the raised “3.” I can only speculate that it was recognized as a mistake and therefore corrected in a subsequent version.</p>
