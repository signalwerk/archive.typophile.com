    <p>The Typographic Circle was formed about thirty years ago by a group of advertising typographers as the Type Directors Club (UK), to bring together anyone with an interest in type.</p>
    <p>The Circle depends on membership revenue to be able to continue with its programme of high calibre speakers, studio visits and organizing social events. Membership to the Typographic Circle is open to anyone with an interest in typography and there are certainly no admittance tests.</p>
    <p>Previous events have included <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a>, <a href="/wiki/Gerard%20Unger" class="freelinking" rel="nofollow">Gerard Unger</a>, <a href="/wiki/Brian%20Webb" class="freelinking" rel="nofollow">Brian Webb</a>, Andy Altman, NB Studio.</p>
    <p>To be a member of the Typo Circle has some tangible benefits. You will receive priority booking and reduced entry to events and lectures by the Typo Circle, and receive our publication, <a href="/wiki/Circular" class="freelinking" rel="nofollow">Circular</a>, for free. Furthermore, we have arranged a discount scheme on books published by Rotovision. You will also receive free membership to Fontzone and be able to purchase <a href="/wiki/Dalton%20Maag" class="freelinking" rel="nofollow">Dalton Maag</a> Exclusive fonts at a discount of 20%.</p>
    <p><a href="http://www.typocircle.co.uk/" title="http://www.typocircle.co.uk/">http://www.typocircle.co.uk/</a></p>
