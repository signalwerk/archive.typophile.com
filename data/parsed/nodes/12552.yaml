    <p>Hello.  I’ve found this sample of a script that I really like, however it has proven difficult to identify.  Someone suggested that it is not a font at all, but rather hand drawn.  I have been directed to P22Corinthia and Annabelle-JF as similar fonts.  Am wondering if anyone here may have any other possibilities as to either the identity, if it is actually a font, or other similiar ones.  Thank you in advance for any help.</p>
