    html: <p>Yes, thank you, I did try Mike’s Script ID first.  He’s the one that sent me here =), also the one that suggested P22Corinthia which is quite similar.  I actually found the sample on the DaFont forum as a question to them (so I don’t know where the original came from).  No answer there tho, and I really liked the font, so thot I’d do some research myself. No success, so asked Mike... and here I am!  Thanks to you all for trying to find something for me.  I really appreciate it. Someone at MyFonts forum said they thought it was hand drawn.  Probably correct as it seems to not exist anywhere.  So I guess now I’m just looking for other similar fonts.  The two mentioned above are good ones, just wondering if there are others.  Thanks again for all your help.</p>
