    html: |-
      <p>My impulse was originally (and still) that this may have been the work of Rob Leuschke. Several of his fonts, besides “Corinthia” have somewhat similar letterforms, and it seems consistent with ’calmer’ examples of his style. I checked his web sites for Alphabytes and TypeSetit, but he never used ’Gallery’ there. </p>
      <p>The other calligrapher-font designer whose style might cover this is Hermann Zapf, but this seems very unlikely to me. (I was thinking about some of the variations in Zapfino, but the “Gallery’ lettering is less flamboyant than the Zapfino style, in my way of looking at it.)</p>
      <p>I’m afraid this one remains a mystery, at least for now.</p>
      <p>- Mike Yanega</p>
