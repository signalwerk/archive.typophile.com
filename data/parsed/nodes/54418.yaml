      <p>Thanks Chris, you are, of course, a gentleman and a scholar.</p>
      <p>I won't waste my time (or anyone else's) on formulae believe me, nevertheless I want to know why some fonts go for OSF that are lc x-ht and some that are sc X-ht. There must be some rationale behind both. They can't both 'look right' (can they?) Does a rationally good reason ever supercede (or at least subdue) the eye as the "final arbiter"?</p>
      <p>No prizes for guessing that I view type design as a science more so that some who view it as an art. Maybe (I hope) my fonts will function better than someone else's which may  look nicer (although looking nice is a very subjective criterion - functionality is less subjective). Though for me function and aesthetics are very closely related.</p>
