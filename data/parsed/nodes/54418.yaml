      <p>&gt; why is it that the OSF look small against lowercase?</p>
      <p>Probably because their extenders are more modest - they curl and taper.</p>
      <p>Although not "related" to smallcaps, the reason I think it can make sense to have the numeral ascenders* line up with the smallcaps is that, all else being equal, it's useful to line things up. Think of something like "MI6" for example. If they're coming close, snap them together (unless you're making a grunge font I guess).</p>
      <p>* Or, in a lining system, the top of the numerals.</p>
      <p>hhp</p>
