      <p>The eye is critical, but some knowledge can serve as a great springboard.<br>
      Like knowledge about extender distribution in typical text.</p>
      <p>I've concluded that for running text the best system is usually where the "x-height" of the numerals is quite high; these are typically called "hybrid" numerals, and they were used on occasion as far back as the 18th century IIRC; and some designers (like De Groot) do it regularly today. I also firmly believe that the 3 and 5 (and maybe even the 2) should ascend, but that's a harder sell.</p>
      <p>hhp</p>
