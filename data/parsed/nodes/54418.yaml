    votes: 0
    html: |-
      <p>Nick,<br>
      Think of it like overshoot. The human eye/mind percieves the "O" as being off the baseline compared to an "L" for example. You can delve into what it is about human sight which makes this true but nevertheless, it is. You may even spend months figuring out a complex formula to tell you how much overshoot is correct--if you like that sort of thing. The trouble is, you can do it by eye much quicker so why bother? As I've said for years, the eye is the final arbitor.<br>
      I am not saying that "how it looks is all there is" but if you are looking for some absolute measure to define perfect placement or proportion, you are about to spend a lot longer looking for a formula than you would just designing type. You have to ask yourself which interests you the most, the pursuit of a definitive infallible answer, or designing a library of type. </p>
      <p>"how something looks is very subjective"<br>
      To some degree but not really as mystical as you might think--there is a range of acceptable tolerance that most people fall within (again, think overshoot). There is optical correction involved in all joins and stem widths vs horizontals. You can create a statistical measure of "how much" is right and use the mean. Then create a ratio based on this for every weight, slant, degree of width, contrast and style or you can train your eye to see. It is up to you. You must realize that your audience does not use your formula, they just quickly use their eyes. You can jump up and down and stamp your feet if a user disagrees with your measure and point to your formula as proof. This will not change the users impression one bit. Renners drawings for Futura were originally quite geometric but had to be optically corrected quite a bit (some by him and some by the foundry) to look correct to humans.</p>
      <p>ChrisL</p>
      <p>PS: "why, i.e. what were they small against?"</p>
      <p>the lowercase letters.</p>
