      <p>I think you may misunderstand what working by eye does. It is not all about what looks better aesthetically. It is also about what works better to a reader. The use of science or human senses to create type are both attempting to produce functional type. They are not mutually exclusive. Think of the eye as a measuring device loaded with an algorithm that seeks to measure form in the most functional way for other human eyes. </p>
      <p>ChrisL</p>
