    html: <p>I prefer my small caps and old style figures to be a bit taller than the x-height mainly because it makes them easier to distinguish from the lowercase letters in text. The idea for using small caps and old style figures in text is so that numbers and acronyms don't disrupt the flow and even color of the text, but I think they do still need to be somewhat distinct from the lowercase.</p>
