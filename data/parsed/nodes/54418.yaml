    html: "<p>Chris, I know you said they looked too small but do you know why, i.e. what were they small against? Was it because you're used to the small caps being very slightly bigger? I am trying to get to a good reason rather than your being conditioned over time by being exposed to common usage. \"They just looked wrong\" somehow doesn't cut it for me:  I'm way too inquisitive. Plus how something looks is very subjective. This is a bigger discussion - Is the way something looks all there is to type design?</p>"
