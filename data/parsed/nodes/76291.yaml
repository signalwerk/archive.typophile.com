  html: |-
    <p>Once upon a time, I came across a brilliant dingbat "alphabet"--all images of what I'd describe as creatures, critters, or monsters. </p>
    <p>Examples of vaguely similar monsters:</p>
    <ul>
    <li>Nibbler on <em>Futurama</em></li>
    <li>The vermicious knids from <em>Charlie and the Great Glass Elevator</em>.</li>
    <li>The "Infiltration" monsters shown on this <a href="http://zim-dez.deviantart.com/art/Infiltration-115274291" rel="nofollow">deviantART</a> page.</li>
    </ul>
    <p>Most notably I remember a cute one-eyed squid that I incorporated into my sigblock. But that was 10 years and 3 companies ago and any details beyond that are lost.</p>
    <p>I torqued myself buggy from 2-4 a.m. tonight trying to find this set. Every search tactic from monkey-fried click frenzy to advanced googling failed. But even so, I feel like the dingbats were charming and memorable enough that a pro or aficionado might be able to name the artist without too much sweat.</p>
    <p>Much gratitude in advance for any efforts, successful or otherwise.</p>
    <p>Sleepily yours,</p>
    <p>Anna</p>
