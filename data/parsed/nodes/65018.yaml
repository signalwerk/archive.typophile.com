    html: |-
      <p>Frankly they all seem like legitimate separate members of a family. Could you just call C "extended" and move along from there?</p>
      <p>Another thought is to mix the one-story letters of C (o,b,d,D,O) with the two-story letters of B (a,e,s,E,S). Horizontal counters in the two-story letters are the main flaw of C to my eyes.</p>
      <p>You could also probably find a good compromise by interpolating them.</p>
