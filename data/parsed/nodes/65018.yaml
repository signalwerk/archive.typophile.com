    <p>Here's the deal. I'm pretty happy with <strong>A</strong>. I'm trying to design a weight lighter and I'd like some guidance on which approach works better. The main difference between <strong>B</strong> and <strong>C</strong> is that  <strong>C</strong>'s counterspaces are wider. Proportionally, which one of these is better? Right now, these heavy designs are for display, but I might progress to designing lighter weights with a more text-friendly approach. Backward huh? </p>
    <p>Also, comments on specific glyphs would be greatly appreciated.</p>
