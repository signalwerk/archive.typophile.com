      <p>Watch out for light/dark balance onscreen; it's not the same as on paper. Light-emitting, low-res monitors give a very different impression, halation is actually an issue. But you certainly can use photoshop, or your eyes, to approximate a blurred view of type, and that is useful for finding light or dark spots in the overall texture. Older techniques: print a sample large, then walk all the way across the room to look at it. Or, get a reducing glass and look through that. </p>
      <p>I think what's crucial about the idea of letting the eye be final arbiter, is that so many people prefer to rely on logical rules and formulas of one kind or another, and the more you rely on some kind of logic, the less you are seeing the actual fit of a typeface. The eye is what will be using the type in the end. It's like designing a chair. Coming up with an elaborate rationalization and concept for why a chair will be comfortable is no substitute for sitting in the damn thing to test it out. We use these tools with our bodies. The smoother, more comfortable they are, the easier it is to use them subconsciously and do our work (or reading or dining).</p>
