      <p>&gt;I am not sure how blurring a hole (squinting would cause some blurring) would ‘accentuate’ the hole.</p>
      <p>Blurring is indeed what you want, although the eye can discern black and white in low-light, mostly you see shades of grey, while losing the sharp edges where characters meet spacing. With a black on white headline by squinting you should be able to compare the lighter inter-letter grey patches and easily pick up areas whether they are dark or light. Depending on size and use, you would normally close up the large light areas and open up the dark areas so that the areas are equal(ish), bearing in mind that you don’t want to reduce (or increase) the inter-letter space to such an extent that it hinders reading. 90pt at arms length might be too close/big to get the effect.<br>
      It doesn’t work for all, an alternative might be to look at it upsidedown.</p>
      <p>&gt;“90” looks ugly in this case?<br>
      Or does it clearly differentiate between the numerals? Which is more important, harmony between characters or the message they carry?</p>
      <p>Tim</p>
