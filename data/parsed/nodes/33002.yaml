      <p><cite>Somebody’s saying “this I like.”’</cite></p>
      <p>There is a lot of truth to this, but as with most things aesthetic, you need to consider the audience. What "I" like can matter to an artist, what "the audience" likes should matter to a designer.</p>
      <p>As to letterspacing &amp; kerning, Bill is right, fashion changes. But I would say that you cannot get good spacing (kerning or letterspacing) mathematically. Worse, I believe you can't use the same values for all sizes --  what works for a 10-point setting will not look right at a 36-point setting. Notice the word "look." Best I can do; it is why you have to kern by eye (with the other eye on the audience).</p>
