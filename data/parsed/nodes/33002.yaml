      <p>I use the squinting method, by squinting you lose the ability to see colours and the eye uses rods which discern black, white and grey. The aim is that you don’t see dark or light groups but a generally even grey.<br>
      Since you cannot (well you can, but not easily in running text) alter the shapes of the letters you have to accept the counters and work on the spaces between them, all the while bearing in mind that you don’t want to affect the readability of your piece (so, for example, you have to accept that an rn combination is going to have an open space and by closing it you will raise the chances of it being read as an m).<br>
      Optically even does not equal mathematically even, so your Av sample wouldn’t hold true, for example, Av might need loosening while ve might need closing.<br>
      I suspect that practical experiment, as in so many things, is better than reading about it.</p>
      <p>Tim</p>
