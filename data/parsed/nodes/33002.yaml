    <p>What is letterspacing?</p>
    <p>How do you kern letters 'by eye'?<br>
    Jim Krause in  'Type Index' on page 90 says to 'try focusing on sets of three (adjacent) letters at a time;'<br>
    'squinting helps accentuate "dark spots" and "holes" within the word-'</p>
    <p>'Thinking in Type' by Alex White on page 365 says to flip a headline upside down so it's shapes become noticeable or by imagining equal amounts of water poured between characters.<br>
    In the example he gives he has the spaces between letters as grey on the x height of the letters. So you are supposed to compare unequal/strange shapes.<br>
    He uses 'Avelas' as an example.  I am not sure why he doesn't include the ascender or rather the parts of the letter that extends past the x height in the equal spacing calculation. Why does he not include the bowls and the negative space of the letters in the calculation (e.g. the 'A' has a space - the 'counter')? He provides a chart of most significant kerning pairs on page 364.</p>
    <p>'Av'<br>
    Would equal spacing be optically okay spacing? If you measured from the 'A' to the lowercase 'v' would that be the same for all letters?</p>
