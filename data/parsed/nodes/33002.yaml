      <p>Well, Charles, I have a feeling we agree on this. I don't think that the tight spacing of caps is a good idea, when they are set as all caps. I think Briem feels the same way--which is what I gather from the tone of his comment. </p>
      <p>The type designer has the problem that if the caps are spaced well for matching the lower case they are probably too tight ideally for the uppercase only setting. On the other hand, if they are set larger, in headings, and then they should be tighter than if smaller. So the usual decision is to design the spacing to match the lower case, and leave it to the type setter to adjust all caps. I don't know of a better solution.</p>
