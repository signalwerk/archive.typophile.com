      <p>@chuchu: “<em>i had many ideas for logo and all had rejected i made 150 sketches of logo. :(</em>”</p>
      <p>Are you doing these on paper, or on a computer? </p>
      <p>When I started studying design, we were asked to produce 100 sketches in an afternoon. Spend 1-2 mins on an idea, then stop, do a 180˚, and move onto a totally different idea. Use big 2' × 3' pad of newsprint. It will help you make free-associations between different ideas.</p>
      <p>If you are capable of doing 150, I’m confidant you can do another 150. Keep trying. You learn to do by doing.</p>
    html_clean: |-
