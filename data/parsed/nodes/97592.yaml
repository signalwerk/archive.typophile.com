      <p>Why use the letter <strong>R</strong> as the basis for the logo? The real branding challenge here is that the name of the product says nothing about shoes, fashion, or status. The word <em>reel</em> could refer to film, fishing, or the unsteady gait of a drunk.<br>
      Why not work on a logo that gives the consumer a clue to what the product is?</p>
