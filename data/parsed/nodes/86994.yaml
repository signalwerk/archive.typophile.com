    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Dynascript_Pushbutton_5420.png"></div><br>
    Alphabet Soup Type Founders and Michael Doret are proud to announce the World Premiere of “Dynascript” on <a class="freelinking external" href="http://new.myfonts.com/fonts/alphabetsoup/dynascript/" rel="nofollow">MyFonts</a>.<p></p>
    <p>Dynascript brings the ease of “Pushbutton Automatic” to your typesetting experience. Dynascript is actually 2 fonts in 1-without switching fonts you can instantly change from Dynascript’s connecting font to the non-connecting italic with the simple push of a button...</p><div class="imageWrap"><img src="http://typophile.com/files/2-In-1_3456.png"></div><br>
    ...just press the “Stylistic Alternates” button in the OpenType palette<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Global_6022.png"></div><br>
    Typesetters across the planet will also be able to set copy in their language of choice.<p></p>
    <p>Dynascript’s 694 glyphs can be used to set copy in: Albanian, Basque, Catalan, Cornish, Croatian, Czech, Danish, Dutch, Esperanto, Estonian, Faroese, Finnish, French, Galician, German, Hungarian, Icelandic, Indonesian, Irish, Italian, Kalaallisut, Latvian, Lithuanian, Malay, Maltese, Manx, Norwegian Bokmål, Norwegian Nynorsk, Oromo, Polish, Portuguese, Slovak, Slovenian, Somali, Spanish, Swahili, Swedish, Turkish, and Welsh—and of course English. Sorry! Off-world languages not yet supported.</p><div class="imageWrap"><img src="http://typophile.com/files/DynaChSet_4485.png"></div><br>
    What is Dynascript? It’s is a completely original, never before seen, bold script font—but to some it may be reminiscent of various mid-century neon signage, and of sign writing, Speedball alphabets and even baseball scripts. The design of Dynascript also takes some cues from a historical typographic curiosity that began in Germany in the ‘20s and which lasted into the ‘60s—when Photo-Lettering gave it the name "Zip-Top". Basically it was believed to be the wave of the future—that by weighting an alphabet heavier in its top half, one could increase legibility and reading speed.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DynaCopy1_4920.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/DynaCopy2_4299.png"></div><br>
    For more detailed information please download <a class="freelinking external" href="http://www.michaeldoret.com/AlphabetSoup/Dynascript_Manual.pdf" rel="nofollow">“The Dynascript Manual”</a> pdf (800 kb).<br>
    Dynascript on <a class="freelinking external" href="http://new.myfonts.com/fonts/alphabetsoup/dynascript/" rel="nofollow">MyFonts</a>.<br>
    Coincidental to the release of Dynascript on MyFonts, Alphabet Soup is running a Special Promotion: 25% off this font for a limited time.<br>
    Dynascript Design and Art: Michael Doret<br>
    Dynascript OpenType Programming: Patrick Griffin/<a class="freelinking external" href="http://canadatype.com" rel="nofollow">CanadaType</a><p></p>
