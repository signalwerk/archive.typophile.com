    html: |-
      <p>When I listen to Elvin Jones play around the beat I think about the point you are making. There is always something unheard or unseen there if it is only your mind trying to impose order.</p>
      <p>With design, something more free-form creates a tension where the viewer is compelled to try and understand an order. If you don't want this tension/distraction you can nail everything down in a predictable way. Even in a New York School painting you may find a dash of color placed in a position that tips the hat to formal geometric composition.</p>
