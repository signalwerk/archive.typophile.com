  html: <p>From what I have read about breaking the rules/ abandoning the grid, Im not sure it is completely possible to escape. Discussions of the designer being, well you could say, unleashed from the grid to result in a more creative and unconstrained piece of design. Though I have noticed, if not a grid then a form of structure/control is needed and used , to produce a functional piece of design. So is the grid really being broken or just recreated into another form?</p>
