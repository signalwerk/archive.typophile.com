    <p>The purpose of this card is to:<br>
    1.) call attention to passerbys. i want someone passing by to<br>
    notice the card and know its for graphic design right away.<br>
    2.) something i can give to someone to remember me by and<br>
    referr to when they need to contact me.</p>
    <p>how have I tried to do this? I made the words "graphic design" the biggest element<br>
    rather than my name. And i've made the card a bright color to stand out.</p>
    <p>Why the type bleeding off the page? It was to give a sense of "graphic design".<br>
    I first tried just putting it big in the center, but it came off as too normal looking.<br>
    The jpg i've attached is the front and back of the card.<br>
    What do you guys think? Any suggestions on a better way to achieve this?<br>
    Thank you!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/over_3779.jpg"></div><p></p>
