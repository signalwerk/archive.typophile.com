      <p>etahchen, I am not a designer, graphic or otherwise.  I think you need to see this from your customer's viewpoint.  "i'm probably gonna get clients that don't know anything about design i plan on leaving them at coffee shops..."  Many (perhaps most) of your potential customers do not know what a graphic designer is or does. Your card needs to indicate very fast to someone that YOU can resolve their problem, give them a logo or flyer or whatever.  This card may not do that. Talk to a few potential customers about your card. Show them the card, and then ask them what services you (the graphic designer) provide and what customer problems you fix. Find out if the customers are understanding your card.</p>
      <p>I like very much the left (right side up) part of the green card. But I think you should delete the right side of the card (the upside down part) and provide a more prosaic listing of your services: flyers, reasonably priced logos etc. I don't know if the right side of the card should be slanted or level.</p>
      <p>I did not understand, from the card, that you are a person named Etah Chen. I thought etahchen was a company name or something. Maybe an additional line indicating you are "Etah Chen, Graphic Designer" should be added, to make 4, instead of 3, lines of smaller type.</p>
