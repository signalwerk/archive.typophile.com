    <p>Just wondering if anyone knows any other fonts that have similar uppercase characters to Penumbra, Odense and Friz Quadrata. The main feature I'm looking for is the half serif or flared serif.</p>
    <p>Penumbra:<br>
    <a href="http://www.myfonts.com/fonts/linotype/penumbra-half-serif/" title="http://www.myfonts.com/fonts/linotype/penumbra-half-serif/">http://www.myfonts.com/fonts/linotype/penumbra-half-serif/</a><br>
    <a href="http://www.myfonts.com/fonts/linotype/penumbra-flare/" title="http://www.myfonts.com/fonts/linotype/penumbra-flare/">http://www.myfonts.com/fonts/linotype/penumbra-flare/</a></p>
    <p>Odense:<br>
    <a href="http://www.myfonts.com/fonts/linotype/odense/semi-bold/" title="http://www.myfonts.com/fonts/linotype/odense/semi-bold/">http://www.myfonts.com/fonts/linotype/odense/semi-bold/</a></p>
    <p>Friz Quadrata:<br>
    <a href="http://www.myfonts.com/fonts/linotype/friz-quadrata/" title="http://www.myfonts.com/fonts/linotype/friz-quadrata/">http://www.myfonts.com/fonts/linotype/friz-quadrata/</a></p>
    <p>Thanks.</p>
