    html: "<p>I second William's suggestion of ITC Elan; ignore the sometimes weird lowercase and set a line of caps in one of the type testers. Very elegant caps. Albert Boton has actually designed 3 different typefaces in this category: Elan, Agora from Berthold, and Memo. Also check out his recent FF Page Serif, which has low contrast and chisel serifs. For that matter, his Pompei has more contrast, but also tiny flare serifs. It reminds me a little of Perpetua.</p>"
