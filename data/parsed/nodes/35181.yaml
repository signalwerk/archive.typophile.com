      <p>I can’t listen to anything while I work on type or design. It is okay if I am doing home maintenance stuff but I get too distracted for even things like kerning.  When I listen to music, I really listen or watch. My favorite music is opera so it is not so repetitive as pop music. I also like blues and R&amp;B when I am driving a distance.</p>
      <p>ChrisL</p>
