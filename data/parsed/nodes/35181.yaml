  html: |-
    <p>I am in the midst of an extended kerning session (4 typefaces, 31 fonts) and listening to a lot of electronic-ish music, namely Two Lone Swordsmen, Junior Boys, Black Devil Disco Club, Chris Clark, Boards of Canada, Battles etc. I find the repetitious nature an excellent fit for kerning, it gets me into a rhythm, almost a trance. </p>
    <p>So the question is, what do you all find good to listen to while kerning?</p>
    <p>—K</p>
