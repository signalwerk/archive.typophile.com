      <p>There are a couple of odd features to these letters, but the one that struck me most is that the foot serifs are off-center. I searched with 'tammi' as the sample, using 'slabserif' at MyFonts, and went through all 340+ fonts, and the only one I noticed there with off-center foot-serifs was <a href="http://www.myfonts.com/fonts/typodermic/corzinair/" rel="nofollow">Corzinair</a> from Typodermic. As you can see, it's close, but not exact.</p>
      <p>This says it's not a foundry that MyFonts sells, or it's a custom font.</p>
      <p>- Mike Yanega</p>
