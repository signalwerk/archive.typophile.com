    <p>Dear typophiles,</p>
    <p>Anyone know the face used in the word “tammi” at <a href="http://www.tammi.fi/" title="http://www.tammi.fi/">http://www.tammi.fi/</a>? It’s an interesting-looking slab serif, which at first reminded me of Joshua Darden’s Freight Micro.</p>
    <p>The site belongs to a Finnish book publisher.</p>
    <p>Olli</p>
