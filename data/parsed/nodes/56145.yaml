  html: |-
    <p>hello,</p>
    <p>when i was testing my new font, i discovered a funny phenomenon:<br>
    the printing shows some of the glyphs more bold than others, but in fontlab they are all equal.<br>
    also at certain sizes it’s certain letters (image: E, M, Q etc), at other sizes it’s other letters that look bold.</p>
    <p>i thought maybe the printers just can't handle the amount of curves.</p>
    <p>what do you think?</p>
    <p>best,<br>
    marcus</p><div class="imageWrap"><img src="http://typophile.com/files/trouble_5054.gif"></div><p></p>
