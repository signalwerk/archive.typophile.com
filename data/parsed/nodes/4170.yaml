    html: <p>It's Koch Antiqua Bold. Linotype has the <a href="http://www.myfonts.com/fonts/linotype/koch-antiqua/koch-antiqua/testdrive.html?s=Awards&amp;p=48" target="_blank">regular</a>, but not the bold. There are other versions with the bold such as <a href="http://www.myfonts.com/fonts/spiecegraphics/eva-sg/eva-antiqua-hv-sg/testdrive.html?s=Awards&amp;p=48" target="_blank">Eva Antiqua Heavy SG</a> and <a href="http://www.myfonts.com/fonts/bitstream/kuenstler-165/kuenstler165-bt-bold/testdrive.html?s=Awards&amp;p=48" target="_blank">Kuenstler 165 BT Bold</a>.</p>
    html_clean: <p>It's Koch Antiqua Bold. Linotype has the <a href="http://www.myfonts.com/fonts/linotype/koch-antiqua/koch-antiqua/testdrive.html?s=Awards&amp;p=48" target="_blank" class="link-external">regular</a>, but not the bold. There are other versions with the bold such as <a href="http://www.myfonts.com/fonts/spiecegraphics/eva-sg/eva-antiqua-hv-sg/testdrive.html?s=Awards&amp;p=48" target="_blank" class="link-external">Eva Antiqua Heavy SG</a> and <a href="http://www.myfonts.com/fonts/bitstream/kuenstler-165/kuenstler165-bt-bold/testdrive.html?s=Awards&amp;p=48" target="_blank" class="link-external">Kuenstler 165 BT Bold</a>.</p>
