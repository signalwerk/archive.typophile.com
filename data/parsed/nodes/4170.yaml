    html: <p>And if font quality is not a big issue (like for a personal project), David <br>Rakowski digitized this for the Mac as <a href="http://www.erik.co.uk/font/serif.html" target="_blank"> Lilith</a> years ago. It's only saving <br>grace is that it's free. <br> <br>The PC conversion is all over the Web ... like <a href="http://www.moorstation.org/typoasis/designers/rakowski/dr4/davy_f4.htm" target="_blank"> here</a>.</p>
