  html: |-
    <p>Disclaimer: I am not a graphic designer<br>
    I wish to use the avantgarde font with all its beautiful kerns and ligatures on a poster.  It is the perfect font for the theme.  Only one problem, I can not figure out a way for an "s" to precede an "a".  I have not seen that combination in any of the alternatives created nor seen an S before an a in print.  Any thoughts?</p>
