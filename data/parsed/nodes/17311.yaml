      <p>The problem isn’t new, but a condition of hi-res, digital typography, which uses single master fonts optimized for mid-size text (hence weak for smaller text), and production processes that have little or no “gain”.<br>
      Some of the first faces to address it were Adobe Garamond, Charter, Scala, and yes, Quadraat.<br>
      I think you will find that’s it’s an issue addressed by a large percentage of digital text face designs, it’s certainly something I consider for all my serifed designs.</p>
