    <p>I have noticed that there is a quiet war being waged by designers, typographers and enthusiasts alike, against the thin, wispy text faces that characterize most of today’s digital type. </p>
    <p>The weapons in our arsenal? Robust, dark faces such as Dolly, Quadraat, Bembo Book, Absara. Dark, meaty faces all. </p>
    <p>So what are your favourites for text? What of all these light, anemic faces that litter the typescape? Opinions? Comments?</p>
