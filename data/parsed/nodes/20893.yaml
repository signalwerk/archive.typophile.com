      <p>Typequake:</p>
      <p>I like Hoefler text. Quite versatile. For sheer legibility (but without overly-soft serifs a la Gentium), TheAntiqua by DeGroot works beautifully. DeGroot's TheAntiqua series is quite a gem. You don't hear much about it, either. </p>
      <p>DTL Elzevir looks especially good. And DTL Dorian has lower-case and small-caps "Y"'s that are delicious. But Dorian has a bit too much character for legal matter. It'll shine elsewhere, though. Time to save my pennies.</p>
      <p>I've also used Underware's Dolly quite a bit for other projects. It seems to be an ideal blend of liegibility and charm.</p>
