      <p>Ah, yes, the short stubbed f. How about ATF's Caslon 540 then? The face should already be in your Adobe OpenType Collection. It has higher contrast than Twombly's, and therefore, would shine out more character. I also particularly fancy its capital Q because it's 'English' in design, much like Baskerville.</p>
      <p>But then again, Caslon Classico is not a bad choice either.</p>
      <p>In regards to Twombly's Caslon, I always found it to be set rather solidly, never with too much contrast. It is, in my opinion, one of the more stoic workhorse among its fellow brothers and sisters. Maybe your <em>Don Quixote</em> was printed in a heavier, more solid stock?</p>
