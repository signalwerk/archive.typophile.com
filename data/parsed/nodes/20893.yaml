      <p>Quite a learning experience, thank you all! Yes, maybe I need to take a different perspective on Caslon. And of all the one's I've seen, I'll have to grant that Adobe's is the most complete and useful set. I'll have a look at Founder's Caslon, to be sure, but I'll try a few more experiments with setting Twombly's Caslon. I don't think I've made full use of the set.</p>
      <p>I think I've become so accustomed (and unfairly partial to) thick, meaty fonts that are somehow reminiscent of metal, that it's coloured my views of other, equally useful faces that might not otherwise have the kind of sparkle and flourishes I've come to expect. </p>
      <p>So, my apologies to Carol Twombly et al! This young apprentice is off to learn all he can about Caslon, and particularly why he should be using Adobe's version, if nothing else.</p>
