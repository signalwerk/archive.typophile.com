      <p>William gave a presentation showing how he developed his soon-to-be-released "William's Caslon" on Sundays afternoon at TypeCon 2006.</p>
      <p>He compared several digital Caslons to what is available of the original Caslon from several sources. It is obviously an interesting struggle to make a good revival which is both faithful to the original yet very functional in today's publishing environment.  From what I saw, William is well on his way and none the worse for wear from all his tribulations in the struggle for completion. Here is hoping he produces a New Years present for the type-loving world.</p>
      <p>ChrisL</p>
