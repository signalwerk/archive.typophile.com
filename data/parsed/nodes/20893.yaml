      <p>Palatine, TypeCon is definitely not only for master type designers. Most people there are graphic designers who love type, not type designers. And most events will be of great interest to graphic designers, judging by last year.  </p>
      <p>As to the master-apprentice question, if I remember rightly, I heard Matthew Carter say that all type designers have been largely self-taught, from the 15th century till now. This may be changing with the programs at Reading and KABK, though my impression is that these are a way for people to develop themselves who have already educated themselves quite a bit in type design, or the related subjects they are studying.   </p>
      <p>In any case I would highly recommend TypeCon to you, given what you say is the state of your interest.You will meet and be able to talk with some of the best designers in the world there, and start to see if it is for you or not. I was delighted to find last year how accessible and helpful people were. Also the workshops will help you to start on the technical side, if you want.</p>
