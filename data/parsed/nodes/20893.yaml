    html: |-
      <p>Typequake: </p>
      <p>I work with alot of extended text. Long essays, reports and the like, mostly to do with the classics (Roman), English literature, etc. But really, everything I do has to be "designed" correctly - at least typopgraphically, from correspondence to a simple memo. Even legal reports are given a bit of typographic loving. I've talked a few of my law profs into accepting work that is typeset in something other than Times, for instance, and spaced in a manner conducive to reading comfort. They've taken quite well to the whole scheme.</p>
      <p>brampitoyo:</p>
      <p>ITC Caslon 224 is part of my Adobe OpenType Collection, actually. The lower case "f" isn't to my liking. It looks like it doesn't belong, much like the infamous lower case "c" in Rotis, if Im not mistaken. The captial "Q" however, is a nice touch - a classic Caslonesque style. But I still prefer the beautiful capital "Q" in Twombly's version. I have an edition of Don Quixote that is set in "Adobe Caslon", and although beautiful, the text came out rather light on the page. Perhaps that's the way it should look.</p>
    html_clean: |-
