    <p>I'm not sure what to make of the Caslons I've seen so far. Carol Twombly's Caslon Pro (Adobe) looks good and is versatile, but it doesn't really sing on the page like Augereau would (as Garamonds go), or perhaps FF Scala or Eureka, if we're talking slab serifs. </p>
    <p>Perhaps my inexperience has gotten the better of me and I can't appreciate Caslon for what it is. I don't mind spending money on something nice, lord knows I've already spent a small fortune on fonts, but I like beautiful things that are made by dedicated designers. I'm looking for a Caslon that is thick, robust, has a full set of ligatures and obviously, osf/sc faces.</p>
