    html: |-
      <p>I design primarily cookbooks and art books therefore I use fractions a LOT. I get annoyed when a font only has 1/4, 1/2, 3/4 (FF Scala, for example) without superscript and subscript to build alternate fractions (I need the eighths and thirds too!). I'm also a stickler for ligatures. I also don't tend to use small caps unless they are native to the font (i.e. not from the Quark menu) but with the various types of heads I need for cookbooks they can be very useful. I've used Adobe Caslon (and Garamond) for a lot of cookbooks. Thesis fonts and some of the Fontfont like Meta have good fraction sets too.</p>
      <p>The swashes and ornaments less so, but I did use swash characters from Adobe Caslon on my web site <a href="http://www.patriciafabricant.com">http://www.patriciafabricant.com</a>.</p>
    html_clean: |-
