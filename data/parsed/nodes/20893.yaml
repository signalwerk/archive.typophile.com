      <p>It's not really Caslon's nature to be "thick", or, for that matter, overtly beautiful, but:</p>
      <p>Adobe's Caslon works very well when paired with CC's Big Caslon. (The roman is available with Mac OS X, or from various vendors, while the italic is available from Carter and Cone themselves, but their swash is still not released.)</p>
      <p><a href="http://www.p22.com/lanston/products/caslon.html">LTC Caslon</a> is a very nice authentic cut with all the bells and whistles, although I, for one, still dream of the display cut first promised many years ago in Gerald's <a href="http://www.p22.com/Lanston/Giampa/CaslonATF.html">"The Fount", Vol. 1, No. 1.</a>  Any news, Gerald or Paul?</p>
      <p>And you shouldn't dismiss <a href="http://www.hwcaslon.com/index.htm">Founder’s Caslon.</a> At first glance it might seem like an antiquarian curiosity, but used at the recommended sizes it's really a marvellous collection, and very useable.</p>
