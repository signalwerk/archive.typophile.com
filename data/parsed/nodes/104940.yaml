    html: |-
      <div class="comment-spam-body"><p>Carmelle has bulb serifs like Cooper Black but othersise is a long way from Oswald Cooper’s type designs of 1920. It has about the width of Cooper's Cooper Black Condensed, a “condensed but not squeezed” variation on the Cooper Black theme released in 1925.<br>
      <a href="http://www.fontspring.com/fonts/wordshape/cooper-black-condensed" rel="nofollow">Cooper Black Condensed</a> available from Wordshape is similar in width to Carmelle.<br>
      But Cooper Black, regular or condensed, is too heavy for Carmelle.<br>
      Bitstream includes a bold weight in its <a href="http://www.myfonts.com/fonts/bitstream/cooper/" rel="nofollow">CooperBT</a>, but the width is wrong for Carmelle.<br>
      The photo-compostion era produced some alternatives to Cooper, such as Photo-Lettering Inc.'s Cavanagh Hamilton, but the ones I have seen are not much closer than Cooper.<br>
      Does your friend have any idea where Carmelle came from?<br>
      Logo? Advertisement? When?<br>
      If it's a modern logo it would be feasible to compress Cooper Black to the width of Carmelle, which would more or less match Carmelle's bold weight, and edit letters to match this design. Extensive editing would be required.<br>
      Don</p>
      </div>
