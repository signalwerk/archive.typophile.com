      <div class="comment-spam-body"><p>A logo for Columbia records from 1923 in somewhat similar lettering to Carmelle, but without the bulge below the baseline. An interesting design 3 years after Cooper Black and 2 years before Goudy Heavyface.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/UnknownColumbia1923_6257.jpg"></div><br>
      Don<p></p>
