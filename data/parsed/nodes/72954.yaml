      <p>@thomas, that's what I meant by #1. For me it involves scaling down by my fonts are usually squeezed into the OpenType vertical limits.</p>
      <p>From an examination of Windows core fonts I get the feeling that the original fonts were designed without Vietnamese accents in mind. To retain the original vertical metrics, they had to squeeze the high Vietnamese accents. I put the red line at the Winascent so you can compare the Aring height as well.</p>
      <p>Courier Bold</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Courier1_6562.PNG"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Courier2_4543.PNG"></div><p></p>
      <p>Arial Bold<br>
      The Aring was lower than some other accents.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/arial_4205.PNG"></div><p></p>
      <p>Corbel Bold<br>
      This was probably designed with high accents in mind. I guess that's why it looks smaller compares to the earlier Windows core fonts. If I change my browser default to Corbel, I have to go up a point size or two.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/corbel1_4820.PNG"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/corbel2_4743.PNG"></div><p></p>
      <p>Canadara Bold<br>
      Similar to Corbel</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/candara1_4262.PNG"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/candara2_5361.PNG"></div><p></p>
      <p>Not related to Vietnamese, but in lots of Core fonts, the Aringacute pops over . . . but nobody uses them anyway so it who'd notice?</p>
      <p>So it seems like allowing for the high accents is the proper way to go unless you're adding to a font where backwards compatibility is a high priority. Has anyone seen Vietnamese accents that pop over the vertical limit? How about other OS core fonts?</p>
