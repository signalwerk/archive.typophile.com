    <p>When dealing with high Vietnamese accents such as:<br>
    uni1EA4<br>
    uni1EA6<br>
    uni1EA8<br>
    uni1EAA<br>
    uni1EAE<br>
    uni1EB0<br>
    uni1EB2<br>
    uni1EB4<br>
    uni1EBE<br>
    uni1EC0<br>
    uni1EC2<br>
    uni1EC4<br>
    uni1ED0<br>
    uni1ED2<br>
    uni1ED4<br>
    uni1ED6</p>
    <p>There's a problem to deal with because the accents are vertically stacked. Usually when figuring out font metrics, I assume Aring is as tall as it gets and scale accordingly. But sometimes I later need to add Vietnamese accents. When I refer to Bbox limit I mean the highest point. In my case, it's usually the same as the Winascent and hhea Ascender.</p>
    <p>As far as I know, there are 3 solutions:</p>
    <p>1: Reduce the size of the entire font to allow for the high accents which will make the font look tiny compared to other fonts and in some apps it will affect line spacing. Not a great option when adding to existing fonts.</p>
    <p>2: Squashed accents which don't exceed the Aring height. This can be acceptable for display fonts but not so good for text.</p>
    <p>3: Go beyond the upper Bbox limits (usually the Aring height).</p>
    <p>Some OS core fonts have Vietnamese upper accents which go beyond the Bbox limit. What happens to Vietnamese core fonts in various browsers? I assume the accents wouldn't get clipped. Do browsers pad the line spacing with Vietnamese the same way they pad superiors &amp; ordinals? What are the negative consequences to exceeding the Bbox limit this way?</p>
