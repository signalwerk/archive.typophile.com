      <p>Thomas: <em>But you're going to tell me it was 2006-07.</em></p>
      <p>I remember presenting my analysis of the problems of Windows linespacing at ATypI in Prague in 2004. I remember it well because I was running late to get to the session, and thoughtlessly hopped into a taxi that turned out to be unlicensed, with a meter that counted up at an incredible rate and a driver who tried to give me Hungarian currency as change. At the hotel, everyone crammed into one of the small rooms being used for tech workshops, and many of us ended up sitting on the floor.</p>
      <p>The 2004 context of the sudden urgency around the long practice of apps using OS/2 usWin values to determine default linespacing, although I couldn't say so at the time, was the MS Cambria Math font. We needed a way to get Word to scale to the Typo values in the font menu, because otherwise the Cambria Math font looked like it was about 3pt. Fortunately, Greg and Si and others at MS agreed that a general mechanism within the OT spec was a good idea, the other option being a font-specific hack in Word.</p>
      <p>The other table version 4 changes to the OS/2 fSelection bit came later.</p>
    html_clean: |-
