      <p>Don't forget (4): Increase the BBox size, along with os_2.usWinAscent and hhea.Ascender</p>
      <p>Of course, (4) would result in increased line spacing in many less savvy apps.</p>
      <p>But (3) will result in clipping in many less savvy Windows apps. Of course, you wouldn't "go beyond the BBox limits" exactly: you'd increase the BBox but not the os_2.usWinAscent and hhea.Ascender.</p>
      <p>Cheers,</p>
      <p>T</p>
