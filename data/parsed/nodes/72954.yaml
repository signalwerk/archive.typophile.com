      <p>Khaled, this is how Cambria and Cambria Math appear in the Windows Word 2007 font menu:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cambmenu_5619.png"></div><p></p>
      <p>This is with the fsSelection bit set. They are scaled the same despite the fact that their OS/2 usWin metrics are very different:</p>
      <p>Cambria Regular<br>
      usWinAscent = 2075<br>
      usWinDescent = -455</p>
      <p>Cambria Math<br>
      usWinAscent = 6383<br>
      usWinDescent = -5045</p>
      <p>If the fsSelection bit is not set, the Cambria Math is scaled smaller.</p>
