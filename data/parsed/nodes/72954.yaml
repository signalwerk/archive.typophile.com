      <p>But my font has set fsSelection bit set, proper typo ascent/descent values, yet win values are used in the menus, I'd be really grateful if some one can enlighten me what is wrong in my font.</p>
      <p>Here is the relevant bit of OS/2 table as extracted by ttx:<br>
      <code><br>
          &lt;fsSelection value="00000000 11000000"/&gt;<br>
          &lt;sTypoAscender value="750"/&gt;<br>
          &lt;sTypoDescender value="-250"/&gt;<br>
          &lt;sTypoLineGap value="510"/&gt;<br>
          &lt;usWinAscent value="2598"/&gt;<br>
          &lt;usWinDescent value="536"/&gt;<br>
      </code></p>
