    html: <p>&gt;&gt;...our republic was founded when the US Constitution was ratified in 1789. England...did not even have universal white protestant male sufferage until at least 1848... <br> <br>But just as England had a parliamentary system many years before it even came close to being a democracy, the US was still way off being a democracy for many years after the constitution was ratified in 1789. In 1789 only <i>rich</i>, white adult males got the vote. Women had to wait until 1920. African Americans had to wait until 1870, American citizens of Chinese ancestry had to wait until 1943 - even Native Americans had to wait until 1924. And in practice, for most non-white Americans, the Voting Rights Act of 1965 marked the advent of a near-democratic electoral system.  <br> <br>&gt;&gt;Well, in the US, we get to vote for both our local representatives in Congress AND for President (even if we elect him indirectly).  <br> <br>This happens in the UK too, but both things are combined into one election process. <br> <br> <br>&gt;In whatway does the electoral college promote democracy? <br>&gt;I never said it did. <br> <br>OK, sorry. I misunderstood - when you said 'I'm for the electoral college' I couldn't think why anyone would be for the electoral college, and assumed there must be some argument that it promotes democracy. If it doesn't promote democracy what does it do? <br> <br>================================== <br>================================== <br> <br>One thing that I keep hearing here at the moment is 'Why does the US make elections so complicated?' Not so much in terms of the electoral college, but more in terms of the voting arrangements, voting machines etc. No US state has a population more than half the size of Britain, yet here with turnout usually well over 70%, many areas having more than the usual 5 or 6 candidates, and a voting system that uses nothing more than paper and pencils, we get a fairly accurate count, returned by about 7am the morning after the election.</p>
