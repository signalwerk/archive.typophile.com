    html: <p>A republic, run on democratic principles, doesn't necessarially preclude that its citizens won't live in in freedom. Like most American schoolchildren, I grew up thinking that America was the only "free country" in the whole world. Now, living in Europe, I realize how not true that is. Granted, the United States is older than every European democracy, except maybe Holland's, but the continent is now filled with free, "democratic" societies, which are all Republics too. <br> <br>Hurray for Republics! <br> <br>Of course, in many ways, the United States is more of a "democratic" republic than most European examples. At least in the United States, we have a much more direct method of electing our chief executive. Compare Tuesday's election with how the UK and Germany (and even Canada) choose their Prime Ministers.</p>
