    html: "<p>Verdana is far more readable on screen, both in terms of letter shapes and spacing. Arial was a print font that was adapted for screen use. Verdana was designed for screen use from the ground up. <br> <br>With regards to letter shapes, Arial's relatively closed counters for shapes like a, c, and e make those letters less distinctive than they could be at typical on-screen text sizes. <br> <br>Try typing a sentence. Set it in 9 pt Arial and again right below in 9 pt Verdana. Copy those two lines, and do them in 10, 11 and 12 pt. View them on-screen at regular 100% zoom. Which text looks more readable to you across the range of sizes. <br> <br>Note: If you have a Mac, also use 14 and 16 pt. If you have Windows, also use 7 and 8 pt. This will help compensate for the different ppem ratios of the two OSes in normal applications. <br> <br>Cheers, <br> <br>T</p>"
    html_clean: "<p>Verdana is far more readable on screen, both in terms of letter shapes and spacing. Arial was a print font that was adapted for screen use. Verdana was designed for screen use from the ground up. <br> <br>With regards to letter shapes, Arial's relatively closed counters for shapes like a, c, and e make those letters less distinctive than they could be at typical on-screen text sizes. <br> <br>Try typing a sentence. Set it in 9 pt Arial and again right below in 9 pt Verdana. Copy those two lines, and do them in 10, 11 and 12 pt. View them on-screen at regular 100% zoom. Which text looks more readable to you across the range of sizes. <br> <br>Note: If you have a Mac, also use 14 and 16 pt. If you have Windows, also use 7 and 8 pt. This will help compensate for the different ppem ratios of the two OSes in normal applications. <br> <br>Cheers, <br> <br>T</p>"
