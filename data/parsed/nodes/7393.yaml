    html: "<p>I suppose there are only three you can use anyway, because you have to go by what is on the user's system. My choice: Verdana before Helvetica/Arial. <br> <br>Next Problem: If you really want to control the output use pixels, they come almost same size on most of the systems.  <br>(There's is an ever ongoing discussion wether to us \"em\" as a measure.You might consider this, too, since it's relative and you leave choice of type-size at the user's side.) <br> <br>The Body Copy of this forum is arround 12 I suppose. (It's done by font-tags, so the measure is the HTML classes for text size: 1, 2, 3,...) <br>Here's what's in the font tag:  <br>\"size=1 face=\"arial,helvetica,sans-serif\" <br> <br>Your last question should also be answered with this. <br> <br>Servus <br> <br>Dominik</p>"
    html_clean: "<p>I suppose there are only three you can use anyway, because you have to go by what is on the user's system. My choice: Verdana before Helvetica/Arial. <br> <br>Next Problem: If you really want to control the output use pixels, they come almost same size on most of the systems.  <br>(There's is an ever ongoing discussion wether to us \"em\" as a measure.You might consider this, too, since it's relative and you leave choice of type-size at the user's side.) <br> <br>The Body Copy of this forum is arround 12 I suppose. (It's done by font-tags, so the measure is the HTML classes for text size: 1, 2, 3,...) <br>Here's what's in the font tag:  <br>\"size=1 face=\"arial,helvetica,sans-serif\" <br> <br>Your last question should also be answered with this. <br> <br>Servus <br> <br>Dominik</p>"
