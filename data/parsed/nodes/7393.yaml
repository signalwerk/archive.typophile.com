    html: "<p>There seems to be some misinformation in this thread. Online, typography can't be set at any size. That's the nice thing about online type...the end-user gets to control it. Without going into all of the arguments for/against certain type sizing online, I'll just say this: <br> <br> - points are for print...not screen measurements <br> - pixels do not mean it will render the same in all browsers or will be non-resizable in any browser  <br> - ideally, if everyone knew how to adjust their browser settings, you'd set body type at 100% (and this is the point of debate). <br> <br>As for the electoral collage, it is an outdated method that serves no purpose in today's world. It made sense in the 1800s--not in the 2000s.</p>"
