    html: "<p>Yes Joe, <br>i agree i have just been trying different combinations and i funny enough arrived at almost the same 2 combos. <br> <br>For body copy i used Verdana at 11 point looks nice and clean with a bit of line spacing. <br>I even took the colouring back to 70% black and it opened the page up very nicley and was still nice to and easy to read. <br> <br>Small Headlines and Captions I actually do prefer Arial at around 12 point bold.  <br> <br>I find thats a nice clean combination. <br>Although i wouldnt use the same 2 together in my graphic design for printed materials for example. <br> <br>To you all, thank you very much for the time you have invested in giving the feedback you did, its beens a big help especially now that i have a final workable solution. <br>Thanks and Cheers <br>Kev <br> <br>PS: 1 last question, as you mentioned Verdana can get a bit wide sometimes, can we apply tracking to the body copy with HTML or CSS sheets and close the letter spacing up a bit to combat this problem for the web?? <br> <br>Cheers Kev</p>"
