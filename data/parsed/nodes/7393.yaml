    html: "<p>&lt; avoiding the bush-kerry debate... &gt; <br> <br>Ummm <br> <br>I' don't know how many of you have experience with CSS, but we try to avoid the \"point/pixel-problem\"( as Thomas described) by defining the font-size &amp; lineheight in Ems.  <br> <br>like:  <br> <br>.bodycopy { <br>\tfont-family: Verdana, Arial, sans-serif; <br>\tfont-size: 1em; <br>\tline-height: 0.2em; <br>} <br> <br> <br>that way, the font-size depends on the configuration of the user. If I'm not mistaken, an Em in Web-typography is the size predefined in the control panel of the browser or the size defined in the parent object. For better info see: <a href=\"http://www.meyerweb.com/eric/articles/webrev/199910.html\"> More fun with font-sizes by Eric Meyer</a> <br> <br>Anyway, to answer your question: yes you can define (negative) letter-spacing (css-property: letter-spacing) with CSS, but alas, is a little bit flaky. Especially in IE. It's a bit of trial &amp; error really... <br> <br>letter&lt;/font&gt;</p>"
    html_clean: "<p>&lt; avoiding the bush-kerry debate... &gt; <br> <br>Ummm <br> <br>I' don't know how many of you have experience with CSS, but we try to avoid the \"point/pixel-problem\"( as Thomas described) by defining the font-size &amp; lineheight in Ems.  <br> <br>like:  <br> <br>.bodycopy { <br>\tfont-family: Verdana, Arial, sans-serif; <br>\tfont-size: 1em; <br>\tline-height: 0.2em; <br>} <br> <br> <br>that way, the font-size depends on the configuration of the user. If I'm not mistaken, an Em in Web-typography is the size predefined in the control panel of the browser or the size defined in the parent object. For better info see: <a href=\"http://www.meyerweb.com/eric/articles/webrev/199910.html\"> More fun with font-sizes by Eric Meyer</a> <br> <br>Anyway, to answer your question: yes you can define (negative) letter-spacing (css-property: letter-spacing) with CSS, but alas, is a little bit flaky. Especially in IE. It's a bit of trial &amp; error really... <br> <br>letter&lt;/font&gt;</p>"
