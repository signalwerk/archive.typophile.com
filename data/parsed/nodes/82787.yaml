    html: |-
      <p>Well, here's an update. I got another reply from Typekit support, this time it was sensible and more technical and it did point at the ClearType being a culprit. Apparently their screenshot is made with greyscale anti-aliasing, not ClearType, and this what makes Adelle look pretty on XP.</p>
      <p>I managed to confirm that on one of two XP laptops I have at my disposal, however on the other laptop I am still seeing jagged Adelle regardless of the OS anti-aliasing settings. (edit) Latter is running Firefox 5.0 though, will need to double check if this is relevant or not.</p>
      <p>--</p>
      <p>As far as conspiracy theories go - I do believe that they bend the reality their way by showing the best of two possible screenshots for XP, and not even mentioning that enabled ClearType creates rather serious rendering issues.</p>
      <p>I had one of my websites serving a small JavaScript that tests for the anti-aliasing type used on the client side. Just pulled the stats off the database and <strong>from 498 Firefox/XP visitors, 486 had ClearType enabled</strong>. So that's the "XP would typically have ClearType off" myth going down the drain. All these people would've looked at a crappy version of Adelle if I were to use it naively trusting the Typekit's browser samples.</p>
