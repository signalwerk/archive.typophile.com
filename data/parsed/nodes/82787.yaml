      <p>Hello all,</p>
      <p>Thank you @apankrat for directing me here. As the author of the original JavaScript that you based your work on, I'd like to share the reason why I created the script and how it is relavent to this discussion.</p>
      <p>When I wrote the font-smoothing detection script, it was because I noticed that some embedded fonts looked horrible under XP, which was (and still is) the standard platform of the telecom I used to work for. A standard XP SP3 image at that shop always had font-smoothing off. They still use Office 2003 as their standard Office suite and IE6 due to legacy apps that require it, whuch may be the reason why their XP image has not font-smoothing enabled at all. This company will be off this platform by the end of this year (I believe ... I no longer work for them, but it seems like this is still true). Most telecoms and banks that I have IT friends working at in Canada still run this antiquated combination. I hope not for long, but I don't call the shots there ... these are institutions that are not known for their up-to-date IT infrastructure (keep in mind that these dudes still have COBOL code from the 1980s kicking around on their systems).</p>
      <p>The primary reason why I wrote the script was so that I could serve a different font to this audience ... it just so happened that there were other web surfers that were still using IE6 without font-smoothing on. While that latter audience has dwindled quite a bit, I don't think the former has, and this audience may not have been picked up in the user sample in the experiment above.</p>
      <p>So, my gut feel (i.e. non-scientific) is that if, in the next year, your audience *may* contain old conserative companies that has a lot of legacy intranet web apps that they are still migrating over to a modern browser like a telecom or a bank, you may want to ensure that you use something like my or @apankrat's font-smoothing script to serve alternative fonts to that audience (for those interested, <a class="freelinking external" href="http://www.useragentman.com/blog/2009/11/29/how-to-detect-font-smoothing-using-javascript/" rel="nofollow">my version of the script is located here</a>).</p>
      <p>My $0.02, for what it's worth.</p>
      <p>Z.</p>
