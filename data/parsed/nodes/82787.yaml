      <p>Hi everyone,</p>
      <p>Tim Brown here, Type Manager for Typekit.</p>
      <p>Alex, I'm sorry our support team didn't immediately pinpoint the nature of your question. We receive frequent inquiries about web type rendering, and the issue you have noticed is very similar to Windows rendering support requests we can often solve by explaining (in general) how type rendering technology works.</p>
      <p>Our screenshots are taken by real browsers with default OS/browser settings.</p>
      <p>As Si mentioned, Windows XP does use Standard antialiasing by default. However, if you're using IE7 on XP, or any browser on a machine where IE8 happens to be installed, ClearType will be enabled (Typekit's series of blog posts on type rendering, to which our support team initially pointed you, <a class="freelinking external" href="http://blog.typekit.com/2010/10/21/type-rendering-web-browsers/" rel="nofollow">explains this</a> and more). For these reasons, the percentage of XP users seeing ClearType-rendered fonts is indeed greater than default browser/OS settings would make things seem. That percentage varies by audience, though, so it's excellent that you are paying such attention to your own visitors via your detection script.</p>
      <p>Regarding one other point:</p>
      <blockquote><p>As far as conspiracy theories go - I do believe that they bend the reality their way by showing the best of two possible screenshots for XP</p></blockquote>
      <p>We do not bend reality. We do our best to explain, and show, what's going on in each of many possible font/browser/OS mixes, and we're learning more every day. You used the phrase, "the best of two possible screenshots." While we're on the subject of multiple possibilities, I'd like to share some of our latest R&amp;D.</p>
      <p>Many fonts, even well-instructed ones, do not look good at large sizes on Windows with GDI ClearType enabled; some of the same things that help small text look crisp make large text look choppy. On the other hand, large text rendered with GDI Standard antialiasing looks smooth. Wouldn't it be great if ClearType were active when type is used small, and Standard were active when type is used large?</p>
      <p>The answer might lie in serving files with PostScript outlines when type is meant to be used large and serving files with instructed TrueType outlines when type is meant to be used small. In many Windows browsers, PostScript outlines trigger Standard antialiasing even when ClearType is enabled.</p>
      <p>Already this year, our developers have restructured the way Typekit fonts are stored, processed, and previewed so that we can test theories like this. We'll continue to do our best to explain each improvement that happens as a result of such work.</p>
      <p>Tim</p>
