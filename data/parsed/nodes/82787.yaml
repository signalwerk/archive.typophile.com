      <p>Tim: <em>Wouldn't it be great if ClearType were active when type is used small, and Standard were active when type is used large?</em></p>
      <p>That's what MS Word does on Windows. Unfortunately, they implemented it at the application level at a default point size (20-something, as I recall), regardless of either individual typeface design relative to em or resolution. Ideally, this sort of behaviour -- and several others affecting aspects of font smoothing, subpixel spacing, etc. -- would be set at the font level, in extensions to the gasp table. This would enable font makers to optimise these behaviours relative to specific design characteristics.</p>
      <p><em>In many Windows browsers, PostScript outlines trigger Standard antialiasing even when ClearType is enabled.</em></p>
      <p>Yeeeees, but... Windows PS greyscale antialiasing is not the same 'Standard' antialiasing as applied to TrueType. If you are able to control which format you send on the basis of font size, then the PS fonts will look better at larger sizes under GDI, but may look much worse than even auto-hinted TrueType at text sizes.<br>
      _____</p>
      <p>PS. I see that you mentioned GDI ClearType specifically in part of your response; thanks for that. Given that GDI and DWrite ClearType are so different, in both the x- and y-direction, I think we should consistently identify which we are discussing when making statements about ClearType.</p>
