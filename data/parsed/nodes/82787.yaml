      <p>&gt; <em>Is your js distinguishing between the two kinds of aa on xp? I.e. does your survey show 486/498 use CT and the other 12 are split tween aliased and standard?</em></p>
      <p>Yeah, I can tell apart CT and GS (greyscale). Here is the script, have a look - <a href="http://bvckup.com/js/font-smoothing.js" title="http://bvckup.com/js/font-smoothing.js">http://bvckup.com/js/font-smoothing.js</a>. There is a single function and it returns 0 for failed detection, 10 for no smooting, 20 for greyscale, 25 for IE with smoothing (see below) and 30 for ClearType.</p>
      <p>498 is a number of Firefox visitors on XP, 486 using ClearType and for the remaining 12 the detection failed. In other words not a single <em>detected</em> one used standard or aliased.</p>
      <p>--</p>
      <p>Hrant, the script is linked above. Note though that in the IE it is <em>not</em> possible to tell CT and GS apart <em>at all</em>. I have wrecked my head over different options for over a month and gave up. See, for example, <a href="http://typophile.com/node/78360" rel="nofollow">this thread</a> for one of the attempts. There is a way to detect CT/GS by making a Flash applet render a glyph, but that would detect an OS level setting, which may (and most likely will be) overridden by the IE.</p>
      <p>--</p>
      <p>miha, with regards to the CT number being that high I think there is a very simple explanation. IE7 was a part of Windows Update at some point if I am not mistaken. That would've forced it on a very large number of XP users enabling CT. That's it. CT is the new default for fully patched XP.</p>
