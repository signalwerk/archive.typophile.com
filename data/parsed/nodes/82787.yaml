      <p>Alex: The stats of your anti-aliasing type detection seemed very high for the ClearType, so I made a quick search and found that the javascript you are using (<a href="http://www.useragentman.com/blog/2009/11/29/how-to-detect-font-smoothing-using-javascript" rel="nofollow">link</a>) unfortunately doesn’t recognize the difference between ClearType and Standard anti-aliasing – it only tells whether the font is aliased or not.<br>
      However, it would be interesting to know the true results, only the script has to be modified to detect if there are any pixels which have different values of subpixels for a black type on white – if so, they are rendered in CT.<br>
      The second screenshot you posted is strange, it features both Standard and ClearType. Sometimes I have to refresh/restart the browser to see that I enabled CT.</p>
