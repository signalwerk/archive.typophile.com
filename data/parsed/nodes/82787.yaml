    <p>I am trying to get down to the reason for a discrepancy between what I am seeing on Typekit's "Browser Sample" page and what I am seeing in the real life. </p>
    <p>Here is what they promise for Firefox 3.6 on XP:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typekit-adelle-sample_4857.png"></div><br>
    <code></code><p></p>
    <p>And here is what I am seeing in Firefox 3.6 on XP, ClearType is on, Firefox is at its defaults:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typekit-adelle-real_5748.png"></div><br>
    <code></code><p></p>
    <p>To put it mildly - these do not look the same.</p>
    <p>Tried talking to their support, but so far it yielded some quasi-marketing gibberish about them "working closely with type designers to improve screen rendering" and some such, basically ignoring my question and answering something that I did not ask.</p>
    <p>Anyone here from Typekit who can shed the light on this? Are these not actual, but "synthetic" screenshots, done with some sort of a ClearType emulator and not a real browser?</p>
