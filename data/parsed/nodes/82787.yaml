      <p>As per some earlier comments, I've put together a page to try and quantify the use of ClearType on the Web - <a href="http://swapped.cc/font-smoothing" title="http://swapped.cc/font-smoothing">http://swapped.cc/font-smoothing</a></p>
      <p>The page hosts and includes tiny JavaScript that tests browser's rasterization method and then posts the result back to the server. So far I have about 6500 samples (fewer if uniques are considered), but they came mostly from my own traffic and it won't hurt to diversify them.</p>
      <p>Additionally, there is a HTML one-liner that can be dropping into any existing web page and it will run the same test and record the result when the page is loaded. If you can embed the script in some sites under your control, it would mean better diversity and quicker sample accumulation. I am working on the <a href="http://swapped.cc/font-smoothing/stats" rel="nofollow">Statistics</a> page, and it should be up and running in few days.</p>
      <p>Any thoughts or comments - I am all ears. And don't forget to click that link to let my script to look at your rasterizer.</p>
      <p>--</p>
      <p>@Tim, regarding bending of the reality - there was <a href="http://typophile.com/node/69902#comment-409046" rel="nofollow">another thread</a> on a similar subject and it too revolved around rendering issues and TypeKit not providing an easy way to filter out Windows-unfriendly fonts. This was over a year ago, and I don't think anything changed. Not simple flag saying "this font is not recommended for use on Windows (in small/large sizes)". No community-driven font rating as per sii's suggestion. Nothing to help me decide <em>against</em> using Adelle if I have a large Windows audience. Add to that XP sample that actually acts the opposite way and then do tell me that this whole situation does not look a bit strange.</p>
