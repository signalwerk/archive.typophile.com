    html: |-
      <p>I'm no big city typographer but I'd align the lettering to a grid, even keeping the spacing the same but reduce each letter slightly.</p>
      <p>Visually, the 'V's look like they hang slightly below the baseline which creates a slight wave to the lettering, when you hit 'uve' it throws it off symmetrically. It might be a case of staring at it too long.</p>
