    <p>Kind Regards to my fellow Typophiles -</p>
    <p>I’d like to ask for your collectively keen eyes to identify this typeface -<br>
    which is being used by electronic music artist Matthew Dear - for his new album.</p>
    <p>Please view the image and let me know what this wonderfully light display face might be .</p>
    <p>My Thanks and Praise in advance . . . </p>
    <p>kind regards,</p>
    <p>Aerosyn-Lex Mestrovic</p>
