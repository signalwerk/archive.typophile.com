      <p>Szabolcs: You’re right, of course, if we’re talking about Standard Russian. I lazily glossed over what I meant, thinking [v] and [w] were similar enough for non-specialist purposes, but of course English speakers distinguish them very clearly.</p>
      <p>What I had in mind is the fact that some Russian dialects used the pronunciation [w] for в in certain positions instead of the more standard [v]. Refer to <a href="http://www.gramota.ru/book/village/map15.html">this page</a> if you’re interested. It’s only in Russian, though.</p>
      <p>I was also trying to find if there was any justification at all for using the spelling ЕУРО, but it seems to have been dreamt up by Eurocrats.</p>
