      <p>&gt; “should additional spellings be used too?”<br>
      &gt;<br>
      &gt; Surely the language of a document determines its spelling.<br>
      &gt; So if you’re writing about the Euro in Bulgarian, or printing a Bulgarian banknote, you &gt; would use the Bulgarian spelling.</p>
      <p>I’m playing the grave-digger here with this old thread. (I came across it google investigating a matter).</p>
      <p>But Banknotes are uniform, and in the Latin script a unification of spelling has been adopted on the banknotes as well. While in documents the Euro is referred to as euro, euras, euró depending on language (and some others), on the banknotes it only appears in the “euro” spelling.</p>
      <p>So a unification within the cyrillic has a precedent. What should not happen, however, is, if all cyrillic countries were to use ЕВРО, ЕУРО (a mere transliteration of EURO) should not be considered.</p>
