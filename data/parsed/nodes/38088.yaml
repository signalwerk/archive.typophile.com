      <p>The names used for the euro in various European languages using cyrillic, at least according to <a href="http://en.wikipedia.org/wiki/Linguistic_issues_concerning_the_euro">Wikipedia</a>:</p>
      <p>Belarusian: ЕЎРА<br>
      Bulgarian: ЕВРО<br>
      Macedonian: ЕВРО<br>
      Russian: ЕВРО<br>
      Serbian: ЕВРО<br>
      Ukrainian: ЄВРО, ЕВРО</p>
      <p>From the article: “In standard literary Ukrainian ’euro’ is spelt евро (’evro’), although Russian-influenced євро (pronounced ’yevro’) is also possible and more common in large cities across the country, South-Eastern areas, and among Russophones.”</p>
      <p>Belarusian is the odd one out, it seems. I think the Belarusian pronunciation is basically the same as the pronunciation used by at least some Russian speakers, but the difference is that Belarusian uses phonetic spelling. It’s as if some hypothetical quasi-anglophone language with phonetic spelling used “yooro” for euro.</p>
