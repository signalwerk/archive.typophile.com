      <p><cite>I’ve seen earlier ones that were printed by country.<br>
      I didn’t realize they had gone international.</cite></p>
      <p>Nick, I guess you’re mixing up notes and coins. The coins share a <a href="http://www.ecb.int/bc/euro/coins/common/html/index.en.html">common front (or ‘obverse’)</a>, but have <a href="http://www.ecb.int/bc/euro/coins/2euro/html/index.en.html">different designs</a> for the back (or ‘reverse’).<br>
      There haven’t been national Euro notes ever.</p>
      <p><cite>Where is the Euro symbol on the banknote?</cite></p>
      <p>It’s in the <a href="http://www.ecb.int/bc/euro/banknotes/look/html/index.en.html">security features</a>. There are no coins showing the €, afaik.</p>
