      <p>Your “quasi-anglophone” analogy about Belarusian is not quite correct.<br>
      Russian pronunciation is ca. yévro/yévra, sometimes (seldom) yivró.<br>
      Belarusian is yewra.</p>
      <p>Note the difference V vs. W. Also that’s the one which is reflected in Belarusian orthography.</p>
