  html: <p>Bulgaria recently claimed that the proper Cyrillic spelling EBPO is to be adopted by the European Union. The argument is about the European Central Bank’s preference for EYPO in Cyrillic, which does not match the Cyrillic spelling of “Europe” in Bulgarian and Russian either. – Bulgaria is the only state within the EU which uses Cyrillic. (See more about <a class="freelinking-external" href="http://www.signographie.de/cms/front_content.php?idcat=1&amp;idart=135">in this article</a> )</p>
