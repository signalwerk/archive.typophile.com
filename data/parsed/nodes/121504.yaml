      <div class="comment-spam-body"><p>It might just have to do with the flow of the cursive script. I agree van Krimpen's italics contrast more with the roman. I don't know if that's a bad thing. I definitely don't see it working by default though and so I think the cursive form is indeed the preferred choice. In some typefaces I like quite a high contrast between roman and italic though. I haven't seen all of his types in context but I like how the italic and roman work together in Haarlemmer.</p>
      <p>I believe Sjoerd Hendrik De Roos also had a tendency to use the chancery model. It probably fits better with his designs though.</p>
      <p>But I wonder, is this merely a coincidence that two Dutch type designers who were born around the same time seem to have had a preference for chancery italics or is there more going on?</p>
      </div>
