      <p>Beautifully said, Vladimir. </p>
      <p>I often wonder if the people who read those letters on screens large and small understand or appreciate the great effort, the enormous skill it took to create them so many centuries ago. Will books continue to be precious objects if they only exist in two dimensions?</p>
