    <p>Hi, I’m new here. I actually came upon this site in looking up something for my advertising class. I’m an advertising major and I was wondering if anyone here works in advertising. I have an assignment for my mass media class to interview someone from the field of advertising. I am an aspiring copywriter and while I know this site is for typography, I was wondering if anyone here holds that title and if so would you be willing to give me your name, the company you work for and answer the following questions. The questions are not limited to those in copywriting; any position in advertising will be useful.</p>
    <p>What is/was your job position/title in advertising?</p>
    <p>What are the duties for this position?</p>
    <p>What company do/did you work for?</p>
    <p>What was your major in college? Did this help you in your career? If so, in what way?</p>
    <p>How many hours a week would you say you put in for this job?</p>
    <p>Average salary for your position? (not necessarily the amount you make, unless you feel comfortable giving that information)</p>
    <p>Describe the job atmosphere and interactions with clients/co workers/superiors </p>
    <p>Have you worked in other countries or cities with the same title? If so what was the difference between the them in respects to the job?</p>
    <p>Why did you get into advertising?</p>
    <p>If you feel other info might be helpful please include. If you have any questions feel free to IM me or post here.  I actually need this by 2pm tomorrow. I’d hate to put anybody in that situation so my apologies, but my original interviewee did not get back to me in time so this is a last minute substitution. Thank you so much. Have a blessed night!</p>
