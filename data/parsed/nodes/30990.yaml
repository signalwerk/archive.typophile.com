    <p></p><div class="imageWrap"><img src="http://typophile.com/files/olive-green-mono_3718.gif"></div><br>
    At <a href="http://www.schriftgestaltung.de" rel="nofollow">Schriftgestaltung.de</a> the new font by <a href="http://www.reets.de" rel="nofollow">Georg Seifert</a> was just released. The font family <a href="http://www.schriftgestaltung.de/index.php?inhalt=Schriften&amp;seite=OlivegreenMono" rel="nofollow">Olivegreen Mono</a> is available immediately from <a href="http://www.myfonts.com/fonts/schriftgestaltung/olive-green-mono" rel="nofollow">MyFont.com</a>. The rather upright geometric design of the monospace font is contrasted with the very vibrant, playful italic that contains the interesting element of the as of yet unpublished favorite “Grayblue Sans” and that is anything else but a “waste product”. This becomes most obvious when considering the fact that OliveGreen Mono™ is available in eight different weights [Light, Regular, Medium, Bold and the corresponding Italics]. In addition, numerous open type functions are integrated, also containing all common language regions [Western, Baltic, Turkish, Central European]. The font is particularly well suited as a screen font.<p></p>
    <p>All fonts by Georg Seifert are going to be named after colors.</p>
    <p>Schriftgetaltung.de [germ, Typedesign] is a small foundry that published fonts by Georg Seifert and offers a platform for friends to present their own fonts.</p>
    <ul>
    <li>Specimen: <a href="http://www.Schriftgestaltung.de/seite/Schriften/OliveGreenMonoSpezimen.pdf" rel="nofollow">Schriftgestaltung.de/seite/Schriften/OliveGreenMonoSpezimen.pdf</a></li>
    <li>Purchase: <a href="http://www.myfonts.com/fonts/schriftgestaltung/olive-green-mono" rel="nofollow">MyFonts.com/fonts/schriftgestaltung/olive-green-mono</a></li>
    <li>Georg Seifert’s Website: <a href="http://www.reets.de" rel="nofollow">reets.de</a></li>
    </ul>
