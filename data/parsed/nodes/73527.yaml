  html: |-
    <p>I'm trying to create a bouncy and cartoony feel while tying into a fantasy aesthetic (albeit lightly). The use is on playing cards (landscape orientation) where the title is set in a large size <a class="freelinking external" href="http://new.myfonts.com/fonts/filmotype/modern/" rel="nofollow">Filmotype Modern</a> and the captions and play instructions are set in a rugged Serif (after a wide search <a class="freelinking external" href="http://new.myfonts.com/fonts/066font/kulfonus-no-2/" rel="nofollow">Kulfonus No 2</a> is my best candidate). My question is: what do people think about these two fonts, particularly using them together? Thanks.</p>
