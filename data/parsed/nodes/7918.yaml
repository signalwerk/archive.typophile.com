    html: |-
      <p>Thank you very much for all your comments and advice (particularly the interesting info about the printing Tim/Scott), I've made a few changes to the card: <br> <br>* Increased the width of the red strip (and it's corresponding negative on the rear) to 5mm. It looks a lot more substantial now I think. <br> <br>* reduced the type size of my contact info and switched from the font metrics to Optical kerning (in Adobe InDesign), which seems to be doing a <i>much</i> better job! <br> <br>* moved the descriptor the rear of the card, with the website url, more space for it here, and I think it gives the rear some substance. <br> <br>* added my pseudo tagline 'design &amp; consultancy' to the front. <br> <br>How am I doing? Thanks in advance, <br> <br>Jordan <br> <br></p>
