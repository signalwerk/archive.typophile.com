    html: "<p><b>Tim</b> : I thought that about the strip too, it's 3mm at the moment, maybe I'll give it an extra mm or two. You're probably right about the length of the descriptor, but seeing as I lack a snappy tagline I don't think I can lose it. Maybe just 'design and consultancy' will suffice. <br> <br><b>darrel</b> You know, even though I love faces with that kind of 'n' (DTL Prokyon being one of my favourites), I never for a second thought of doing that. I don't know why, I spent ages designing an entire alphabet and <a href=\"http://www.typophile.com/forums/messages/29/53086.html?1100006231\"> posting it up for critique</a> ;-) -- you'd have thought it would have crossed my mind at some point! <br> <br>Three different cards is a nice idea but a luxury I can't afford <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Phone number -- in England we rarely (in fact, I can't think of a single case) put any punctuation in phone numbers, so that's a cultural thing I guess! <br> <br>You're absolutely right about the e-mail thing. I was too carried away with the 'style' of it to properly consider practical things like that. It looks as though I'll have to make the type smaller to fit it on though. <br> <br>Thanks guys, your input is much appreciated! <br> <br>Jordan</p>"
