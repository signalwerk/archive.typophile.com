    date_raw: 1 Dec 2004 — 7:53am
    votes: null
    html: <p>I like it. I want to try and use the upside-down 'v' as the 'n' as well, but I assume you probably already tried that. <br> <br>I agree the descriptor is a bit long, but if that's the things you want to focus on, so be it. (One option would be to make 3 different cards...'design and branding', 'accessibility consutancy', 'online application development'. <br> <br>As someone that is slowly getting into accessibility consulting myself, I find it sometimes worthy of its own focus. <br> <br>I'm not a big fan of punctuation-less phone numbers, but that's pretty minor.  <br> <br>I'd definitely put your email address on the front with the rest. That's a basic usability issue...being able to put your card in a rolodex, photocopying it, putting it in a card sleeve, etc. <br> <br>As for the bleed, I'm not sure of Steve's comment either. Looks like a pretty basic bleed that any printer could handle.</p>
