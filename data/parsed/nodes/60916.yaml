    html: |-
      <p>It's definitely something to do with path direction. </p>
      <p>What fixed it was by setting the path direction of the glyphs that weren't showing up to TrueType. But all the others are set to PostScript.</p>
      <p>The manual isn't all that clear on the whole path direction issue.</p>
      <p>Will it cause problems if some paths are set to TT while the others are PS?</p>
