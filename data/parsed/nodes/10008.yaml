    html: "<p>Much better. I prefer the top one now, as well. Tap the 'S' on each just a hair closer to the 'T', or loosen the space in the 'TAM' just a tad to compensate (this may be the best way). The rule when kerning is to find the most difficult spacing pair and match the rest to that. This is a minor thing, but will get exaggerated on signage. <br> <br>The rule you're using is a bit heavy (1pt, right?) Maybe try a .5pt rule. But it may just be too much. See what happens. I agree with Daniel on font in the all caps version, too. The 'S' and 'T' are odd, which is why I prefer the top one now. The 'T' seems to stand too tall with its vertical serifs. <br> <br>Another suggestion, which may or may not pan out: try using the small caps for the 'attorneys at law' with no full caps. Right now, I'm guessing that you're using the full caps version of the regular weight, and the forms are getting very thin. This isn't necessarily bad, but you might be able to get a sturdier logo with the SC and still preserve hierarchical contrast (you should track it slightly to compensate for the additional color from the heavier strokes). But, it could end up being too similar and look bad, or lose the fine, austere feeling.</p>"
    html_clean: "<p>Much better. I prefer the top one now, as well. Tap the 'S' on each just a hair closer to the 'T', or loosen the space in the 'TAM' just a tad to compensate (this may be the best way). The rule when kerning is to find the most difficult spacing pair and match the rest to that. This is a minor thing, but will get exaggerated on signage. <br> <br>The rule you're using is a bit heavy (1pt, right?) Maybe try a .5pt rule. But it may just be too much. See what happens. I agree with Daniel on font in the all caps version, too. The 'S' and 'T' are odd, which is why I prefer the top one now. The 'T' seems to stand too tall with its vertical serifs. <br> <br>Another suggestion, which may or may not pan out: try using the small caps for the 'attorneys at law' with no full caps. Right now, I'm guessing that you're using the full caps version of the regular weight, and the forms are getting very thin. This isn't necessarily bad, but you might be able to get a sturdier logo with the SC and still preserve hierarchical contrast (you should track it slightly to compensate for the additional color from the heavier strokes). But, it could end up being too similar and look bad, or lose the fine, austere feeling.</p>"
