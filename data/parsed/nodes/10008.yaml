    html: <p>Watch the &amp;. It's getting too close to the 2nd 'Stamps'. Also, I'd track the 2nd line just a bit, since the size, weight and caps make it seem cramped (to me). Also, it'll reinject the nice visual contrast from the first set. (in this one it's too high in the first and not high enough in the second) <br> <br>To be honest, I prefer the regular weight, mainly because the ampersand just seems to play better with the 'Stamps's. But it also seems more austere to me. <br> <br>I like the rule, but it's really just a judgement call.</p>
