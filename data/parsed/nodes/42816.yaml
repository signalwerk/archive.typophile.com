    html: <p>Gill Sans Extra bold (<a href="http://www.myfonts.com/fonts/linotype/gill-sans/extra-bold/" title="http://www.myfonts.com/fonts/linotype/gill-sans/extra-bold/">http://www.myfonts.com/fonts/linotype/gill-sans/extra-bold/</a>) is similar... at least, it feels similar. The Hard points remind me of Bureau Eagle Bold (<a href="http://www.myfonts.com/fonts/fontbureau/eagle/bold/" title="http://www.myfonts.com/fonts/fontbureau/eagle/bold/">http://www.myfonts.com/fonts/fontbureau/eagle/bold/</a>), but it's not that clunky. The "E" just gives me a headache. Ick.</p>
