    html: <p>We have so many scripts because we have so many cultures. Writing and reading are cultural activities, not simply functional ones. Also, the IPA symbols were never intended for immersive reading of continuous text, and many are ill-suited to both writing and reading. IPA is useful for accurately transcribing precise phonetic notation of human speech, which is a very different activity from producing and consuming literature.</p>
