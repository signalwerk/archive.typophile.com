    html: "<p>&gt; letter frequency has nothing to do with linguistics. <br> <br>? <br>Maybe we're not on the same terminological wavelength... <br> <br>I think letter-sequence frequency has a lot more to do with the linguistics of the \"written\" word than does pronunciation, which is in fact tangential to readability: the fact that \"ough\" can be pronounced seven different ways doesn't preclude the benefit of having a ligature for it. The benefit of having ligatures that are based on frequency is simply that a typesetter is given more opportunities to apply ligatures! <br> <br>Now, if you mean that the typographic rendering of parts of a word should ideally depend on what the whole word is, then I most certainly agree - but yes, that would take some very heavy pre-processing and OT work to implement - and it doesn't mean Lingua's ligatures are NOT linguistically aware (just less than the ideal). <br> <br>hhp <br></p>"
