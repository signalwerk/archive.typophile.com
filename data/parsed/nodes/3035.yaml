    html: <p><i>I think letter-sequence frequency has a lot more to do with the linguistics of the "written" word than does pronunciation, which is in fact tangential to readability...</i> <br> <br>We are indeed on different 'terminological wavelengths'. I'm using terminology correctly and you are not. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Many linguists -- probably the majority -- don't consider writing to be linguistic at all. Writing systems have a conventional, learned relationship to language(s), that is in no way dependent upon features of language. This is why most linguists simply ignore writing. There is a small number of linguists who have developed an interest in writing, but they generally consider writing systems as independent subjects of study, not as part of linguistics. [The name for this area of study is grammatology (although that term has also be co-opted by Derrida for a different purpose).] In short, there is no 'linguistics of the written word'.</p>
    html_clean: <p><i>I think letter-sequence frequency has a lot more to do with the linguistics of the "written" word than does pronunciation, which is in fact tangential to readability...</i> <br> <br>We are indeed on different 'terminological wavelengths'. I'm using terminology correctly and you are not. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Many linguists -- probably the majority -- don't consider writing to be linguistic at all. Writing systems have a conventional, learned relationship to language(s), that is in no way dependent upon features of language. This is why most linguists simply ignore writing. There is a small number of linguists who have developed an interest in writing, but they generally consider writing systems as independent subjects of study, not as part of linguistics. [The name for this area of study is grammatology (although that term has also be co-opted by Derrida for a different purpose).] In short, there is no 'linguistics of the written word'.</p>
