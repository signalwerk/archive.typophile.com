    html: "<p><i>Probably the font with the most ligatures is Process's new Lingua:  <br><a href=\"http://www.myfonts.com/fonts/processtype/lingua/\" target=\"_blank\">http://www.myfonts.com/fonts/processtype/lingua/</a>  <br>And the great thing is they're linguistically aware. </i> <br> <br>Excuse me for taking this thread on a tangent, but I don't believe the ligatures in Lingua actually are linguistically aware. They are ligatures of the most commonly occuring letter sequences in a particular language, but letter frequency has nothing to do with linguistics. This is especially true for a language like English that employs etymological spelling and in which the same sequence of letters can represent multiple pronunciations. In order to make the claim that a font is linguistically aware, I think you would need to do a lot more than count letter pair frequency. For example, you would need to vary the form of ligatures for the same sequence of letters according to pronunciation, such that, for example, you would get different ligatures for the sequence &lt;g,h&gt; in 'ghetto' and 'enough'. Of course, this is not something that a font can do by itself without intervention either by a user or by a dictionary engine. <br> <br>In order for a font to be linguistically aware, it helps if the <i>writing system</i> is linguistically aware. The Latin script applied to the English language is almost entirely conventional, and largely blind to all aspects of linguistics except historical orthographics.</p>"
