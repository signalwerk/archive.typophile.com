    html: "<p><i>english isn't written very well in cyrillic</i> <br> <br>No, English isn't written very well in the <i>Russian orthography,</i> i.e. using the conventional relationship of letters to phonemes as employed for the Russian language when written in the Cyrillic script. This is another example of the confusion of script, language and orthography. English is written perfectly well in the Cyrillic script if you adjust the conventional relationship of letters so that they correspond to English phonemes: then you would have a Cyrillic orthography for English, just as you have Cyrillic orthographies for many non-Russian, non-Slavic languages.</p>"
