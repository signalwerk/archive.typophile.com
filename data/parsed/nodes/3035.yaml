  html: <p>Greetings. <br> <br>I have $100 budget and am looking to buy a font with as many ligatures as possible, old style figures, small caps, preferably with two or more ampersands. <br> <br>I have used Hoefler text (available with some limitations on Macs) and like it but find it a tad intense. I also can't afford its complete set. I am looking for something similar but less expensive. <br> <br>I have investigated Jannon Moderne at stormtype.com, but since it doesn't display a complete character set how can I tell if it has all the ligatures and other odds and ends that I want? <br> <br>I would also value tips on a good Greek font that would go well with this style of Latin font. <br> <br>Any help would be much appreciated. Thanks. <br> <br>Philip</p>
