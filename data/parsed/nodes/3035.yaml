    html: "<p><i>The ligatures in Lingua are useful largely because Olson based them on language.</i> <br> <br>No, he based them on <i>orthography</i>, i.e. the conventional spelling of a language in a particular script. Since all scripts are essentially language-independent -- English can be written in Hangul without much difficulty --, the determination of things like letter frequency must be understood as a function of orthography, not of language itself. <br> <br>This isn't a case of esoteric academic terminology: this is a sincere attempt to accurately describe the relationship of spoken and written language so that the latter can be meaningfully discussed. I agree with Coulmas that most linguists neglect writing too much, but neither he nor other grammatologists such as Daniels and Bright, would advocate the kind of careless terminology that you want to employ. I've corresponded with Daniels, and he is <i>very</i> picky about terminology.</p>"
    html_clean: "<p><i>The ligatures in Lingua are useful largely because Olson based them on language.</i> <br> <br>No, he based them on <i>orthography</i>, i.e. the conventional spelling of a language in a particular script. Since all scripts are essentially language-independent -- English can be written in Hangul without much difficulty --, the determination of things like letter frequency must be understood as a function of orthography, not of language itself. <br> <br>This isn't a case of esoteric academic terminology: this is a sincere attempt to accurately describe the relationship of spoken and written language so that the latter can be meaningfully discussed. I agree with Coulmas that most linguists neglect writing too much, but neither he nor other grammatologists such as Daniels and Bright, would advocate the kind of careless terminology that you want to employ. I've corresponded with Daniels, and he is <i>very</i> picky about terminology.</p>"
