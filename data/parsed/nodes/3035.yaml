    html: "<p>Some questions: <br>1) I'm curious, why do you need \"as many ligatures as possible\"? <br>2) How is Hoefler Text \"intense\"? <br>3) What's the \"style\" that the Greek font has to match? <br> <br>Mrs Eaves, Mantinia (all-caps) and Sophia (also all-caps) have a lot of ligatures. <br> <br>Probably the font with the most ligatures is Process's new Lingua: <br><a href=\"http://www.myfonts.com/fonts/processtype/lingua/\" target=\"_blank\">http://www.myfonts.com/fonts/processtype/lingua/</a> <br>And the great thing is they're linguistically aware. <br> <br>There's also another font with many (and I think somewhat linguistic) ligatures - I don't remember what it was called, but I do remember it won a \"Carter prize\" either and the TDC or the Morisawa type design competition like 2-3 years ago. The designer was French, I think. <br> <br>Storm: just email him. <br> <br>hhp <br></p>"
