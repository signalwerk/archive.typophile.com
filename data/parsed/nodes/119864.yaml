      <p>These typefaces have glyph sets that support Cyrillic:<br>
      <a href="http://www.myfonts.com/fonts/paratype/peter-skoropis/" title="http://www.myfonts.com/fonts/paratype/peter-skoropis/">http://www.myfonts.com/fonts/paratype/peter-skoropis/</a><br>
      <a href="http://www.myfonts.com/fonts/nikolai-sirotkin/taumfel/" title="http://www.myfonts.com/fonts/nikolai-sirotkin/taumfel/">http://www.myfonts.com/fonts/nikolai-sirotkin/taumfel/</a><br>
      <a href="http://www.myfonts.com/fonts/paratype/federico/" title="http://www.myfonts.com/fonts/paratype/federico/">http://www.myfonts.com/fonts/paratype/federico/</a><br>
      <a href="http://www.myfonts.com/fonts/ihof/p22-dearest/" title="http://www.myfonts.com/fonts/ihof/p22-dearest/">http://www.myfonts.com/fonts/ihof/p22-dearest/</a> [Also supports Greek]<br>
      <a href="http://www.myfonts.com/fonts/glc/1695-captain-flint/" title="http://www.myfonts.com/fonts/glc/1695-captain-flint/">http://www.myfonts.com/fonts/glc/1695-captain-flint/</a><br>
      <a href="http://www.myfonts.com/fonts/paratype/pushkin/" title="http://www.myfonts.com/fonts/paratype/pushkin/">http://www.myfonts.com/fonts/paratype/pushkin/</a></p>
      <p>Only found one other handwriting typeface that could pass for 18th century that supports Greek:<br>
      <a href="http://www.myfonts.com/fonts/ihof/p22-operina/" title="http://www.myfonts.com/fonts/ihof/p22-operina/">http://www.myfonts.com/fonts/ihof/p22-operina/</a> [Greek only supported in Operina Pro; also supports Cyrillic]</p>
      <p>Other forum members will likely be able to suggest others....</p>
