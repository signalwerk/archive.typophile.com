    <p>Hi!</p>
    <p>I need 2 fonts, both of which must look like handwriting: one for the Greek alphabet, and one for Russian (Cyrillic). </p>
    <p>Text is meant to be set in 1730, in an old book.</p>
    <p>This is a time-sensitive request -- thanks for any help you can provide!</p>
    <p>Thanks!</p>
    <p>Mary</p>
