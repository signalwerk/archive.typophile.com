      <p>Thanks so much, you all. VERY much appreciated. I'm dialect coach for the NBC TV show GRIMM, and also provide all written language requirements for the show, which are plentiful! When doing so, ordinarily I'm seeking written translations that the art dept then "handwrites," fundamentally copying the typed text. This works for Latin and many other foreign languages, but the dept hasn't got the skillset to effectively navigate the Cyrillic accurately. </p>
      <p>This will hopefully provide a solution. In the meantime I'm hoping my original translators take on handwriting it for us, if need be.</p>
      <p>Thanks again!</p>
      <p>Mary McDonald-Lewis</p>
