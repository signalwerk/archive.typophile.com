  html: <p>Hey all, I'm working on a website layout for a client and have to use the existing logo. I can't seem to find anything that remotely looks decent with it and was wondering if anyone had any suggestions? Any help or criticism on any part of it would be great. Thanks, and remember, the logo/tag-line must stay untouched.</p><div class="imageWrap"><img src="http://typophile.com/files/hei_3962.jpg"></div><p></p>
