      <p>If they're set on it, don't pull your hair out over it. That's my best advice.<br>
      If you can convince them to let you simplify it, a one color version (ex: white on red), perhaps without the tagline might work.</p>
      <p>H(E)I</p>
      <p>Human Engineering International — <em>Multiply your success with the right people</em></p>
