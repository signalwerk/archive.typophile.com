      <p>Hey Jeremiah,</p>
      <p>If you could loose the white border which contains the logo, that would help or extend the white as a header, like the red gradient which it is in now. Maybe extend the red (ribbon) which holds human international over the width of your page together with the white container. I like your lay-out, but classical feel of the logo does conflicts with sans serif from your design I think, post your result when your finished.</p>
      <p>good luck.</p>
