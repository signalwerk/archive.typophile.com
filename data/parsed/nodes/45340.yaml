    <p>Hello All,</p>
    <p>I’ve tried this on Adobe’s InDesign discussion group but to no avail. We’re in InDesign CS3, in Windows XP.</p>
    <p>We have a font that InDesign CS3 is seeing as a different name on just one of four computers. In other words, 3 computers see the name as “My TNTFont” but that one computer is seeing it as “My TNT Font” (an extra space btween “TNT” and “Font”).</p>
    <p>This is a font we created (in an older version of Fontographer) and I’m nearly sure the name was changed recently, likely since it was used on the troublesome computer (still no other computers have the problem). I tried deleting all those silly .lst files that Adobe puts all over the place but to no avail. All the computers are pointing at the same font files on a network drive.</p>
    <p>Does any one know of any other places where a list of fonts might be kept or some other thing that InD is reading? We are using ATM to load fonts and there are other .lst files in the fonts folder but I’m leary of deleting those.</p>
    <p>Thanks a bunch in advance for any help offered, </p>
    <p>Yours in the font quagmire,<br>
    Ken</p>
