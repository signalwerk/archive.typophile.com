      <p><cite>By the way is there a way to attach an image in another post than the first one?</cite></p>
      <p>There should be an insert image link below the comment box  that would allow you to attach / directly insert an image into your comment box. There also are tips on how to insert links and other formatting details below the comment box (as your links above don't lead to where you want them to). </p>
      <p>These latest sketches are good, but I prefer the ampersand from the bottom left (with the closed top) as opposed to the ones you've been playing around with in these later sketches. The lettering is looking a little futuristic to me in these newer sketches because of the pieces taken out of the "R" and the "D". I do like the airyness of these later iterations (due both to the increased spacing and also the outlining of the characters. Lot's of good ideas to experiment with here.</p>
      <p>penn</p>
