      <p>Does it actually matter that it has to read R&amp;D, because I think to me it's the same either RD or R&amp;D.</p>
      <p>the serif style of the plane is now more appropriate since you introduced stroke variation to the letters thus complementing them to the plane.</p>
      <p>I think that plane in the middle is also a very nice solution. Did you also try to add a mid line before R to symbolise plane trail? Just an idea. Try if it works. It may unballance R since it's more wide on top than bottom (missing stem)...</p>
      <p>You could remove tapered wing ends. It's the only one thing that feels distracting on the plane to me... And try moving the plane a bit more to the left because it looks like it's closer to D at the top than bottom or is it just me...</p>
      <p>___________<br><em>Robert Koritnik</em></p>
