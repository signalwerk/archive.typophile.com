      <p>I like the one on the bottom left. Nice ampersand. The right leg of the "R" is a bit funky — looks stretched to me. Although I like the idea of the ampersand leading into the "flight streak" of the plane, I don't really like how it tapers down towards the plane. Try making the plane bigger so that it matches up better with the thickness of the ampersand (and you wouldn't need to taper the trail). Also try it without the trail through the "D".</p>
      <p>Good start here.</p>
      <p>penn</p>
