    <p>Hi friends,</p>
    <p>I've been asked to design a logo for our R&amp;D department.<br>
    We are in the aerospace business, more precisely business aircrafts.</p>
    <p>The logo should express leadership, state of the art product and facility, high tech, discrete luxury and be comtemporary.</p>
    <p>The logo will be used mainly on lanyards, coffee mugs and internal communications.</p>
    <p>Could you guide me with fonts / layout?<br>
    Please help to bring it to the next level! </p>
    <p>Thanks!</p>
