    html: |-
      <p>The plane is almost certainly too detailed compared to the rest of the logo. So simplify it a bit. Ampersand adds quite a substantial amount of detail into the logo but it's too sans serif to complement the details of the plane.</p>
      <p>To me the most promising logo was #4 in the first batch of logos. It connects both letters and the plane and doesn't leave R outside of the mark.</p>
      <p>Logos with only half the plane don't work with me.</p>
      <p>One more thing. If you'll combine outlines with flats (as in logos in the second batch), be very careful about it because it usually tends to complicate application if not done properly.</p>
      <p>But other wise type choice is very good for R&amp;D lab.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
