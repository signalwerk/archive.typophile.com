  html: |-
    <p>What a site! I will be forever indebted to my Lecturer at Uni for directing me this way.</p>
    <p>OK down to the fun stuff: I need some help identifying a couple of fonts that were utilised for service insignia and apparel marking.  I am currently putting together a one-off book for a project in my final year at University, the content is directly linked with Trench Art my great grandfather made during his time at The Somme in WW1.  I really love the two fonts stamped on his old service wallet and would like to use them, unfortunately I'm a fontard and can't identify them.</p>
    <p>If anyone out there knows....please don't keep it to yourself :-)</p>
    <p>Thanks everyone,<br>
    David.</p><div class="imageWrap"><img src="http://typophile.com/files/service_font_6738.jpg"></div><p></p>
