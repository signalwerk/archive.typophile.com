      <p>The serif font is a generic Modern Italic, it would have just been named a "roman" at the time.<br>
      <a href="http://www.fontsquirrel.com/fonts/Old-Standard-TT" title="http://www.fontsquirrel.com/fonts/Old-Standard-TT">http://www.fontsquirrel.com/fonts/Old-Standard-TT</a></p>
      <p>The other is a beaut, but I don't recognize it. Thing is, these would have been bookbinding punches, not from the same kind of supplier as for foundry type.<br>
      <a href="http://www.volcanoarts.com/cart/bookbinding/mps.jpg" title="http://www.volcanoarts.com/cart/bookbinding/mps.jpg">http://www.volcanoarts.com/cart/bookbinding/mps.jpg</a></p>
