    <p>I’m the editor-in-chief of my high school newspaper, The Riverdale Review. I’m pursuing a redesign of the paper of the summer, and I’ve been looking for a typeface to be the centerpiece. I’ve ended up wanting to use <a href="http://www.myfonts.com/fonts/rsantos/atlantica/">Atlantica</a> by Ricardo Santos as the main display and body face. I was wondering if anyone has had any experience using Atlantica, especially in newspaper or magazine settings or could recommend similar faces. Any help would be greatly appreciated.</p>
    <p>Maybe to help you hone in on what I’m looking for: My goal was to replace our use of Times with a face that would be somewhat reminiscent of it (transitional, a certain smoothness) but more fun and distinctive. I like that Atlantica has strong stroke contrast, but not quite like Bodoni or another modern font, and that the lc gives me a mildly similar feeling to Times, but the uc feels fresh (it reminds me a bit of cuneiform, actually). Also, it’s important to me that the face I settle on has a lot of flexibility in having small caps, oldstyle figures, and preferably text and display cuts.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/20496" class="topic-previous" title="Go to previous forum topic">‹ Nat Vignette</a> <a href="/node/20379" class="topic-next" title="Go to next forum topic">50 pence ›</a></div>
