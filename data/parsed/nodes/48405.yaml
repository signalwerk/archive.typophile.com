    <p>I've been working with Fontographer on and off for the last six years - first on PC and now on Mac. The handwriting font I've been working on recently needs to be output in both Mac and PC ttf versions. I've managed a good output for the Mac, but the hyphen (and occasionally other characters) won't code, leaving nasty holes in text or Times substitutions in the PC version. I have managed to avoid kerning pairs by careful design and spacing - and I haven't left any duff vectors crossing over.</p>
    <p>Heeeeelp! What am I doing wrong?</p>
    <p>Any serious suggestions gratefully received.</p>
comments:
  - id: 295653
