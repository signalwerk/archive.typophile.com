    html: |-
      <p>That's kind of familiar - I had the same initial problem with apostrophes. My problem is that on generating the font, the cell for the hyphen is not generating at all so that the system (be it mac of pc) substitutes a times character (in Word) or simply leaves a gap (in Adobe apps). Does this ring any bells?</p>
      <p>Thanks for the suggestions</p>
