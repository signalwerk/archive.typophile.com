      <p>This is the second thread I'm resurrecting here, but I love this font, and I really hope to see a full version of Museum (or at least as full as is possible).</p>
      <p>In the meantime, I've made a FrankenCentaur of my own using the letters from Museum Foundry, as much punctuation as I could get out of Museum Fourteen, the figures from Museum Bible, and everything else from a combination of Museum Bible and Centaur MT (with glyphs from the latter increased 10 em points in FontForge).  It's my first time messing with the innards of a font, but I'm pretty happy with the results.</p>
      <p>Here's a sample that I typed up from the only book I own in Centaur (that I'm aware of anyway), Shambhala Centaur Editions' <em>Wild Ways - Zen Poems of Ikkyuu</em>:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fisherman_3749.png"></div><br>
      The top image is using the custom Centaur, the middle image is with Centaur MT, and the bottom image is a detail of the first image, chosen because the fi lig is from Bible Centaur, while the ff lig is from the increased-weight Centaur MT.<p></p>
    html_clean: |-
