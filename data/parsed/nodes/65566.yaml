      <p>Christopher, expecting people to zoom is an obstacle best avoided. Plus the type might get too big to read comfortably if the chars/line is made low enough (not that most users even have any that a line can be too long, much less what length to make it).</p>
      <p>&gt; Forcing line-breaks sometimes interferes<br>
      &gt; settings for the visually impaired. </p>
      <p>How?</p>
      <p>&gt; I look at typophile at this size: ....</p>
      <p>That's huge. What's your monitor's ppi?</p>
      <p>BTW, when I try to make what I write more readable, I don't worry about iPhones and such. Frankly readability is so poor on most hand-held devices* that there's no point.</p>
      <p>* The Motorola Droid and some HTC models are notable exceptions.</p>
      <p>&gt; I had no idea you were so interested in issues of legibility/readability. </p>
      <p>Interested, yes (for over a decade now). But I can't compete with Kevin's formal background in the field (I'm entirely self-taught, and have zero research funding). Mostly I see my potential usefulness in this area as an instigator.</p>
      <p>&gt; Actually dark and light, not black and white. Which is<br>
      &gt; surely a relevant distinction in the context of antialiasing.</p>
      <p>And beyond. I've dreamed of a font format that defines not only outlines, but vectors perpendicular to the outlines that define the black-white gradation around the limen.</p>
      <p>&gt; scrolling interferes with a smooth reading experience</p>
      <p>Indeed. That's because reading isn't smooth.</p>
      <p>hhp</p>
