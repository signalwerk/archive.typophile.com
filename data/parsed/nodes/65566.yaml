      <p><cite>That makes sense for Japanese - just as it does for Chinese. But there is no standardized stroke order for the Latin alphabet.</cite></p>
      <p>I've told this story before, but my Japanese and Chinese friends laugh when they see me write Chinese characters, because the order of the strokes is all wrong. Koreans of my generation generally have varying reading knowledge of basic Chinese characters, and unless we study Chinese or Japanese as a foreign language we have very few occasions ever to write in Chinese characters.</p>
      <p>Interestingly, there are differences between the Chinese and Japanese norms in the stroke order for some characters. The Japanese order tends to follow character etymology while the Chinese order tends to follow the geometry of the character construction with less regard for the original etymology, if I recall correctly.</p>
      <p>It would be great to have an international survey of stroke orders so we can see the variety in which pupils in different countries are taught to write the same letters..</p>
