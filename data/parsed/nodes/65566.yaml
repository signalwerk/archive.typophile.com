    html: |-
      <p>@christopher dean</p>
      <p>&gt;This, for the most part, then reduces the character-count.</p>
      <p>As you say "for the most part" this is what happens. That's because, typically, a web page gets laid out in pixel-sized boxes without explicit heights and without regard to font metrics and text just gets poured into it. When the text re-wraps, the bottom of the box moves upwards or downwards, depending. This can also happen at different Zoom levels, as well.<br>
      This kind of design is made possible only because the page can scroll endlessly downward to accomodate however much text you throw into the box or boxes. An escape hatch of sorts.</p>
      <p>Christopher, (or anybody, please), do you know of any studies about the effect of scrolling on reading? </p>
      <p>BTW - The effect you've described on Zoom can be mitigated greatly by sizing the containing HTML element not in pixels, but in em units. If done precisely, yes, the character count will change a bit but the number of lines can remain unchanged so the height of the "golden rectangle" remains the same.<br>
      You rarely see pages designed this way for at least two reasons:</p>
      <p>1) Until recently, support for the em unit was uneven from browser to browser.</p>
      <p>2) It's so much less work to just let the text flow downward.</p>
      <p>Now that fonts can be linked to web pages, and almost all new browsers support the soft hyphen, maybe there will be a bit more attention paid to onscreen typesetting. We shall see. Certainly with static content of importance it makes some sense to take the time.</p>
      <p>Also, as of Firefox 3.6, Firefox has followed the lead of IE8 and given web developers a JavaScript property with which to measure the Zoom level. So at least on the initial loading of the page, there does not necessarily have to be a change in character count at all - it can be rigged programmatically to be the same at every Zoom level.<br>
      However, the text actually looks better if you let it reflow a bit and settle in.<br>
      I'll be trying to talk browser makers into giving web developers an <strong>onzoom</strong> and (in IE) an <strong>ontextsizechange</strong> <em>event</em> so that user-changes to Zoom and Text Size can be detected programmatically. With those tools the issue of line length and column width at any Zoom can be solved completely and permanently. </p>
      <p>@hrant</p>
      <p>&gt;I will even change the words and/or the line measure to<br>
      &gt;get a good rag.</p>
      <p>Yeah, so will I. But few people bother. (I assume you're talking onscreen?)<br>
      And did you ever wonder why most printed text (in English, at least) is justified and hyphenated and almost nothing on the web is?<br>
      Doesn't have to be that way anymore. All new browsers support the soft-hyphen and the means to massage and tweak the text to avoid widows, orphans, rivers, etc... exist.</p>
      <p>IMHO - scrolling interferes with a smooth reading experience much more than most people realize. We've just had to accept it.</p>
      <p>(Sorry for going on about this. An area of special interest to me.)</p>
      <p><a href="http://readableweb.com" rel="nofollow">rich</a></p>
