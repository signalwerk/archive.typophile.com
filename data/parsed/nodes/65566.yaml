    html: |-
      <p>Notan (a Japanese term) is the unity and relationship of Black &amp; White. It is what we see and read. However it's understandably extremely difficult to overcome the day-one indoctrination* and the quotidian practicality of making letters via skeletons.</p>
      <p>* We even try to enforce the <em>order</em> of the strokes. There's a Leapfrog device my younger son has been using. I'd really like to burn it at the stake.</p>
      <p>I often write in narrow columns, because it helps reading.<br>
      (I will even change the words and/or the line measure to get a good rag.)</p>
      <p>hhp</p>
