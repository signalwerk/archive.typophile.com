      <p>Any web user can simply increase the size of the type on the fly. It's even build into apple's multi-touch trackpads and mice now. Forcing line-breaks sometimes interferes settings for the visually impaired. But I do agree with the ~65 character/line convention employed by everyone from Tschichold–Bringhurst. I often find web type too small (and as a result, the line-length too long) so the first thing I do is increase it's size. This, for the most part, then reduces the character-count. For example, I look at typophile at this size:</p><div class="imageWrap"><img src="http://typophile.com/files/mytypesize_6589.jpg"></div><p></p>
      <p>I did some interesting reading on your site hrant. I had no idea you were so interested in issues of legibility/readability. Where did you study this? Do you have any published works? I am always on the lookout for people such as Larson and yourself.</p>
