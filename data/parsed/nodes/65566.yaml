    html: <p>In my normal writing speed, I would cross the "t" first in "tree" or any other word starting with "t", but last in "get", since I usually connect the "e" and the "t". But I don't usually connect the "t" if it comes after "r", so the crossbar comes first in words such as "art". Words like "fast" go either way depending on my writing speed and my mood.</p>
