      <p>@ hrant: 150ppi, but again, my eyesight is poor so I tend to make things bigger than most (a side effect of my anticonvulsant medication sometimes give me blurry vision. A typographer with poor eyesight. How ironic). Even my supervisor who is 30 years my seniour thinks it's funny how big I like my screen type. I tend to increase the size of type as big as I can without inducing a horizontal scroll or to ~65 cpl. Whichever comes first. </p>
      <p>Re: forcing line-breaks and accessibility software, an old friend of mine who was seriously visually impaired used accessibility software (I do not remember the name and this was some time ago) which increased the size of the type of whatever he looked at to letters that were literally over one inch in x-height which auto-reflowed everything to fit on his screen so he didn't need to scroll horizontally. If there were forced line breaks in the text, as I once saw, they created big unnatural gaps in the text as they didn't allow for a clean re-flowing. He commented on this very fact. Years later this may  be moot.</p>
      <p>Thanks for the tip to the <a class="freelinking external" href="http://phones.verizonwireless.com/motorola/droid/#/home" rel="nofollow">Droid</a> and <a class="freelinking external" href="http://www.htcpda.co.uk/product_category_page.htm" rel="nofollow">HTC devices</a>. New to me. Do you recommend any one in particular (referably something bullet-proof)? I have a soft-spot for small screen devices. I have had my eyes on an iPhone for some time but simply can't afford the monthly packages. That, and I <em>still</em> find texting on them to be a nightmare.</p>
