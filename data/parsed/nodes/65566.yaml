    html: |-
      <p>&gt; In some scripts the ordering might actually contain information that helps reinforce meaning - but in Latin it’s just fascist.</p>
      <p>I'm sorry, I had misunderstood you. I thought you were trying to get your son to use the right stroke order, and the Leapfrog device was the opposite.</p>
      <p>I remember the old Palm Pilot Graffiti input method, although I didn't use it myself, so I understand why something like stroke order is used there. It is not stroke order for writing; instead, letters are entered with a gestural code, and the correspondence between the gestures and letter shapes is... a mnemonic device.</p>
      <p>So this is cybercrud, not fascism: since handwriting recognition is not accurate enough, or requires too many CPU cycles, text is entered in a sub-writing fashion. The intent is not to promote "better" handwriting.</p>
