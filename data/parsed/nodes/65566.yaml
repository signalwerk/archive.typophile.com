      <p>Come to think of it, <em>I</em> do in most cases, except when it is joined to the letter before it in cursive. I'm a Korean native writer, and we have a similar horizontal-before-the-vertical habit to the Chinese. Good observation! It didn't occur to me before that drawing the crossbar first would be atypical for Latin native writers.</p>
