  html: |-
    <p>Hi guys, I’m working on a historic timeline kind of thing, and I need some recommendations for fonts with pretty numerals. The rest of the book has kinda a old / vintage / grungey / handmade feel, but I don’t need these numerals to have this feel. I might or might not distress them.</p>
    <p>I kinda like the exploding numerals on the <a href="https://web.archive.org/web/20081014000206/http://www.blowers-jewellers.co.uk/watches_franck_muller.htm" target="blank">Franck Muller watches</a> too.</p>
    <p>Hope you can help. Thanks!</p>
