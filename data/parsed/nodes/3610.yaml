    html: <p>Stuart! I can't believe you would think this is anything but Helvetica. To be precise, it's not the version that we know and love/hate today, but the pre-digital display version from the metal/phototype days. If you've got an old Letraset catalog you can see it in detail. <br> <br>There was a thread last year where I illustrated the differences <a href="http://www.typophile.com/forums/messages/30/7772.html" target="_blank">here</a>. Scroll to about halfway down.</p>
    html_clean: <p>Stuart! I can't believe you would think this is anything but Helvetica. To be precise, it's not the version that we know and love/hate today, but the pre-digital display version from the metal/phototype days. If you've got an old Letraset catalog you can see it in detail. <br> <br>There was a thread last year where I illustrated the differences <a href="http://www.typophile.com/forums/messages/30/7772.html" target="_blank" class="link-lost">here</a>. Scroll to about halfway down.</p>
