    html: "<p>A couple of recent designs with both Cyrillic and Latin characters, shown in the <i>Language Culture Type</i> book from ATypI/Graphis: <br> <br>Rouble by Andrey Belonogov <br> <br>Serp'n'Molot by Tagir Safayev (based on letterforms designed by Sergey Chekhonin in the early 20th century: not strictly Constructivist, but very wonderful). <br> <br>I'm not sure where you could get either, but the good people at <a href=\"http://www.paratype.com\" target=\"_blank\">www.paratype.com</a> should be able to help you.</p>"
