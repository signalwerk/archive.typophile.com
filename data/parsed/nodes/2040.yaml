  html: '<p>I am looking for fonts that have a Russian Constructivist look and feel to them. Something that would perhaps have cyrillic alphabet characters, but it would also need to be well adapted to english. I am creating a CD packaging project of Russian composers.  Here are some sketches of what I am sort of thinking about but am at a lack to find a good font to use. <br><img src="http://www.typophile.com/forums/messages/83/20321.jpg" alt="Picture of Type usage idea #1"> <br><img src="http://www.typophile.com/forums/messages/83/20322.gif" alt="Type idea #2"> <br>Thanks for your help.</p>'
  html_clean: '<p>I am looking for fonts that have a Russian Constructivist look and feel to them. Something that would perhaps have cyrillic alphabet characters, but it would also need to be well adapted to english. I am creating a CD packaging project of Russian composers.  Here are some sketches of what I am sort of thinking about but am at a lack to find a good font to use. <br><img src="http://www.typophile.com/forums/messages/83/20321.jpg" alt="Picture of Type usage idea #1"> <br><img src="http://www.typophile.com/forums/messages/83/20322.gif" alt="Type idea #2"> <br>Thanks for your help.</p>'
