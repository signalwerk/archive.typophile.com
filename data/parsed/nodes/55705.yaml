    html: |-
      <p>Body text –I suppose you think of printing purposes– has some usual guidelines you should go through, especially about metrics, strokes contrast and weight, counters, serifs and figure proportions.<br>
      I agree with you that the initial result has nothing to do with the original sketch –BTW, it seems more interesting, and it would be the most if it was even rougher.<br>
      One more thing: <strong>trust your eyes</strong> better than geometry and math measurements; they can find here and there where strength and weakness are; type design seems to be a matter of modelling and shaping –in the sense of sculpting– more than of building.</p>
      <p><strong>MarS</strong></p>
    html_clean: |-
