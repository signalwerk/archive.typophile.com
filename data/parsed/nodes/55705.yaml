    <p>Hey guys, my name is Adam Jones, I'm a second year student and I'm working on a typeface design project for school. So this is the typeface I'm working on for school, currently these are all the letters I have finished in vectors and am moderately happy with. </p>
    <p>The sketch at the bottom is what I've based the lower case off of. </p>
    <p>Any criticism would be a appreciated. Be ruthless. </p>
    <p><a class="freelinking external" href="http://img.photobucket.com/albums/v642/AdamJones0405/letters.jpg" rel="nofollow">sample image</a></p>
