    html: |-
      <p>Yes, very nice, salable typefaces. Kudos to them - that's no mean feat. But they are also very <em>safe</em> typefaces*, and not the way forward culturally. Something like Legato is.</p>
      <p>* Except for Klimax - that's awesome.</p>
      <p>The reason I dislike so-called "ductal logic" isn't because of anything emotional*; it stems from my understandings surrounding reading. They may be wrong, but at least I have some and I use them as a basis, instead of the other way around (if that).</p>
      <p>* I can't say the same for GN.</p>
      <p>hhp</p>
