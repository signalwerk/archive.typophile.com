      <p>2. Type ‘which ttx’, Return:<br>
      <code>/usr/local/bin/ttx<br>
      adrians-imac:Dsig fldr adrianshome$</code></p>
      <p>3. Drag TTX app to Terminal  (since it accepted your Dsig fldr snippet):<br>
      <code>/Users/adrianshome/Downloads/fonttools-2.4/Tools/ttx</code></p>
