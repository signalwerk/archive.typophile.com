    html: |-
      <p>The very first thing to do is to get a terminal window. Click on the Launchpad icon and then type term; you should see this appear. Then you click on terminal<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/term_5850.png"></div><br>
      In the terminal window, after the "prompt" (probably %)  you type "which ttx" as follows<p></p>
      <pre>% which ttx
      /Users/boyer/bin/FDK/Tools/osx/ttx
      % 
      </pre><p>Here I got that ttx is installed in my FDK tools folder. If you get no answer, ttx is not installed and the first thing to do is to install ttx. You should have it if you properly installed <a href="http://www.adobe.com/devnet/opentype/afdko.html" rel="nofollow">AFDKO</a>.</p>
      <p>You can then copy the lines between the cut lines and paste them in the terminal window</p>
      <pre>------------- cut line
      FLDR="${HOME}/Desktop/Dsig fldr"
      mkdir -p "$FLDR"
      cd "$FLDR"
      cat &gt; dsig.ttx&lt;&lt;EOF
      &lt;?xml version="1.0" encoding="ISO-8859-1"?&gt;
      &lt;ttFont sfntVersion="\x00\x01\x00\x00" ttLibVersion="2.3"&gt;

        &lt;DSIG&gt;
          &lt;hexdata&gt;
            00000001 00000000  
          &lt;/hexdata&gt;
        &lt;/DSIG&gt;

      &lt;/ttFont&gt;
      EOF

      open .
      ------------- cut line
      </pre><p>After the paste, you may need to type a carriage return. That will create a folder on your desktop containing the file dsig.ttx and open the folder so that you can select and drop the file dsig.ttx as described above. </p>
      <p>Note: I had to use &amp;lt; and &amp;gt; for &lt; and &gt; lines to show above else the corresponding lines were blank; now the <code>dsig.ttx</code> file produced by the copy paste works fine, I tested.</p>
      <p>You can then do as explained by Té Rowan.</p>
      <p>You can also do as follows. </p>
      <p>First you copy the file <code>dsig.ttx</code> in the font folder containing the fonts you want to process.</p>
      <p>After that, in the terminal window,  you type "<code>cd </code>" (with a space after cd but no carriage return) and then do as if you wanted to drag into that terminal window the folder containing the ttf files to process and then type carriage return.</p>
      <p>Now if you type "<code>ls</code>" (with a carriage return) in the terminal window, you should get a listing of your font files.</p>
      <p>To add DSIG to all of the ttf files you can now paste in the terminal window the following lines (between the cut lines)</p>
      <pre>------------- cut line
      for i in *.ttf
      do 
        newname="${i%.ttf}win"
        cp dsig.ttx "${newname}".ttx
        ttx -m "$i" "${newname}".ttx
        rm -f "${newname}".ttx
      done 
      ------------- cut line
      </pre><p>That will create a ...win.ttf file for each ttf font you have there. The win.ttf file contains the DSIG stub.</p>
