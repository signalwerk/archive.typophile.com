      <p>But I then instead of deleting just dsig.ttf files, I deleted the 'Dsig fldr' from the Desktop and tried again but no joy. Now I cannot get the Dsig fldr back again. Reinstating it does not work either. How do I create the Dsig fldr again? I'm guessing that's why the same routine won't work again?</p>
