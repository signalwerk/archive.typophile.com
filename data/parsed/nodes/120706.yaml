      <p>Or, if you are willing to venture into the scary-scary place known by names like "Command Prompt" and "Terminal", you could do the typing yourself with the same result.</p>
      <p>Trying to condense the 'magic' into a simple incantation:</p>
      <p>1. Type that bit of XML you got into a text editor and save it as ASCII text to "dsig.ttx". You can use a word processor if it can save ASCII files, but it's too much like making a fifty-metre trip in a sport-ute.</p>
      <p>2. Open the Terminal or Command Prompt window and type in "ttx -m ". Drag and drop the font file onto the terminal. Make sure there is a space after the just-appeared filename. Drag and drop dsig.ttx onto the terminal. Now Press Return.</p>
      <p>3. Now the computer will either tell you ttx doesn't exist (meaning it just can't find it) or it'll go on to do the typotechnical jiggery-pokery needed to add the dummy DSIG to the font. If you know ttx exists, make it the first file to drag and drop onto the terminal.</p>
      <p>4. If no text appears when you drag and drop stuff onto the terminal, you are in for a whole lot more typing. Ouch.</p>
