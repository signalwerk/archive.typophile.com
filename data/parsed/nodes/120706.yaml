      <p>You shouldn't need to type "which ttx" and drag ttx onto the terminal every time you use ttx. If ttx is installed properly, you should be able to just type "ttx" at the prompt, followed by whatever stuff you want to do with it.</p>
      <p>You can test whether you have it installed properly by typing "ttx -h" at the command prompt. If you get "command not found", then it's not installed properly. If you get the ttx help text, then it should work to just type "ttx" at the prompt, etc.</p>
