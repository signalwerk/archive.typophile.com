      <code>/Users/adrianshome/Desktop/Dsig\ fldr/SassoBooIta.ttf /Users/adrianshome/Desktop/Dsig\ fldr/dsig.ttx</code></p>
      <p>First remove all of the dsig#.ttf files in the Dsig fldr if there are any.<br>
      Then for each font file:<br>
       5. Drag the ttf font file to Terminal (say SassoBoo.ttf)<br>
       6. Drag dsig.ttx to terminal<br>
       7. Return</p>
      <p>That will compile only dsig.ttx, merge the DSIG into SassoBoo.ttf and produce a file named dsig.ttf in the Dsig fldr, so now…</p>
      <p>8. Rename dsig.ttf as SassoBoo something.ttf (original TrueType filename something)</p>
      <p>Don't switch steps 3 and 4. You need to put the .ttf file before the .ttx file.</p>
