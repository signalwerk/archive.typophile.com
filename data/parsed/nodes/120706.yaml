  - id: 591413
    user: 18942
    date: 2014-10-24T13:12:00
    date_raw: 24 Oct 2014 — 1:12pm
    votes: null
    html: |-
      <p>Another way is to define a variable TTX that contains the full path of the application. For instance, to handle 70 fonts in some folder with Adrian's current configuration, what can be done is this (make sure there is no dsig.ttf font in those 70 fonts).</p>
      <p>1. type cd with a space in the terminal window<br>
      2. drag the folder (not the fonts) containing the ttf fonts in the terminal window<br>
      3. return</p>
      <p>4. paste the following lines in the terminal window</p>
      <pre>FLDR="$HOME/Desktop/Dsig fldr"
      TTX=$HOME/Downloads/fonttools-2.4/Tools/ttx 
      for i in *.ttf 
      do 
        DSIG="$FLDR/${i%.ttf}.ttx"
        cp "$FLDR"/dsig.ttx "$DSIG"
        $TTX -m $i "$DSIG"
        rm -f "$DSIG"
      done
      </pre><p>5. return</p>
      <p>The 70 font files should now be in Dsig fldr with the name they previously had but with a DSIG thing. </p>
      <p>The dsig.ttx snippet you have on typedrawers is however different from the one I got after decompiling the dummy DSIG produced by (an old version of) fontforge  using ttx 2.4. I have no clue what the "right" snippet should be but what I got seems to be working for Adrian.*</p>
      <p>To be complete, I should add that it is assumed that the Dsig folder already exists on the desktop and contains dsig.ttx for ttx 2.4. Such a folder had previously been created by pasting in a terminal window the following lines</p>
      <pre>FLDR="${HOME}/Desktop/Dsig fldr"
      mkdir -p "$FLDR"
      cd "$FLDR"
      cat &gt; dsig.ttx&lt;&lt;EOF
      &lt;?xml version="1.0" encoding="utf-8"?&gt;
      &lt;ttFont sfntVersion="\x00\x01\x00\x00" ttLibVersion="2.4"&gt;
        &lt;DSIG&gt;
          &lt;tableHeader flag="0x0" numSigs="0" version="1"/&gt;
        &lt;/DSIG&gt;
      &lt;/ttFont&gt;
      EOF
      </pre><p>
      *That is also the ttx file I get when I decompile with ttx 2.4 the dummy signature generated by ttx 2.3 using the previous dsig.ttx file.</p>
