    html: |-
      <p>Mark, there is a ttx that is installed but there are at least two versions of ttx on his system. There is ttx 2.4 in ~/Downloads/fonttools-2.4/Tools and there is some other ttx in /usr/local/bin. If ttx is typed directly in the terminal window it is /usr/local/bin/ttx that will be executed and if that ttx is not ttx 2.4  then the dsig.ttx file will be incompatible. Executing </p>
      <p>ttx -h | head -4</p>
      <p>should however give the version.</p>
      <p>To be sure that the ttx 2.4 in Downloads is executed when ttx is called from a terminal window, ${HOME}/Downloads/fonttools-2.4/Tools need to be put before /usr/local/bin in his PATH and such things are tricky for newbies.</p>
