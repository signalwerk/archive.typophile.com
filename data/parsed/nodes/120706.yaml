    <p>I need to add a Digital Signature to OpenType-TT fonts. I found some instructions but need to know how it gets into the font which I am making with FontLab on Mac (font is intended Windows)...<br>
    ~~~~~~~~~~~~~~~~~~~~~~~~~~<br>
    Create a ttx file with a dummy DSIG table, like so: </p>
    <p>&lt;?xml version="1.0" encoding="ISO-8859-1"?&gt;</p>
    <p>     00000001 00000000  </p>
    <p>Then you can merge this into your OT/TTF like this:</p>
    <p>ttx -m font.ttf dsig.ttx</p>
    <p>This will decompile the ttf, add the DSIG table, and recompile in one step. Then the font will work as intended in MS Office (or so I have found in my testing thus far.) This is also easy to incorporate into other scripts.</p>
    <p>~~~~~~~~~~~~~~~~~~~~~~~~<br>
    As a newbie to Python, XML and all that, can someone please just explain the process - without the coding. A step-by-step list of what happens, when. For example, do this, copy that, paste it there. Run this, build that. Otherwise all this coding talk is useless to me until I understand how the code gets into the font.</p>
    <p>I'm using a Mac and FontLab and I'm guessing FontLab has to run this ttx script in order to get the dummy DSIG into the TT font? So it should mean I can do that on the Mac and the resulting TTF will work on Windows? </p>
    <p>Thanks,<br>
    Adrian</p>
