    html: |-
      <p>The ttx you dragged is not the ttx returned by which ttx so I don't know if your /usr/local/bin/ttx is 2.3 or 2.4. Anyway here are the steps to get "ttx -m font.ttf dsig.ttx" with that kind of recipe. First remove all of the dsig.ttf files you got. Then for each font file</p>
      <p>1. drag ttx app to terminal (since it appears to have accepted your snippet)<br>
      2. type -m<br>
      3. drag the ttf font file to terminal (say SassoBoo.ttf)<br>
      4. drag dsig.ttx to terminal<br>
      5. return</p>
      <p>That will compile only dsig.ttx, merge the DSIG into SassoBoo.ttf  and produce a file named dsig.ttf; so here is point 6</p>
      <p>6. rename dsig.ttf as SassoBoo something.ttf </p>
      <p>There are much better ways to proceed using scripts.</p>
      <p>PS Don't switch steps 3 and 4. You need to put the .ttf file before the .ttx file.</p>
