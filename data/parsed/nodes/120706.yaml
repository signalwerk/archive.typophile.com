      adrians-imac:Dsig fldr adrianshome$<br>
      </code></p>
      <p>After this, renaming the dsig.ttf file makes the font work in Windows. Thank you so much. Just to be able to get 'features' working in TT fonts , no-matter how its done is a great relief. There may be more elegant ways to do this, like a batch process as I have 70 fonts to do, but I'm a happy. So here's my final routine:</p>
