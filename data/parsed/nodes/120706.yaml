      <p>Think it works now. I did not have a space after "-m" and a trigger-happy Return key messed things up.</p>
      <p><code><br>
      adrians-imac:Dsig fldr adrianshome$ /Users/adrianshome/Downloads/fonttools-2.4/Tools/ttx -m /Users/adrianshome/Desktop/Dsig\ fldr/SassoBooIta.ttf /Users/adrianshome/Desktop/Dsig\ fldr/dsig.ttx<br>
