      <p>No hope of finding it by Googling the names, just tons of pix of Angelina Jolie &amp; Parfumerie Script.<br>
      If you would be satisfied with a similar font with "a custom hand lettered/flourished look" that was "created with Brides and Invitation Designers in mind" by "a calligrapher [who] has worked with brides for many years [who] loved the look of hand lettered calligraphy, [but whose] budgets limited their use of it," you might try <a href="http://www.myfonts.com/fonts/correspondence-ink/belluccia/" rel="nofollow">Belluccia</a>.</p>
