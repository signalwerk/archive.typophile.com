      <p>P.S. If you have a lot of special characters to type and you don't want to use PopChar or the character palette you may try tools like Typinator: <a href="http://www.ergonis.com/products/typinator/" title="http://www.ergonis.com/products/typinator/">http://www.ergonis.com/products/typinator/</a><br>
      With such tools you can define your own Unicode text replacements, like every time you type "#-" it woud become am real minus sign, "#tm" would become ™ and so on. Even faster than PopChar.</p>
