      <p>personally, i like the traditional way. if i were to read alice for example in (exaggerate just to emphasise) a face like helvetica or futura, with a book that's designed using clean and modern design, i would lose something of that old feeling. old design goes through a process: first it's welcomed. then it's obsolete. then it's appreciated by those who can appreciate. i would give my boy in the future a book that preserves that feeling. i would five him a book that looks sort of 19th century, with the original illustrations.</p>
      <p>if they could sell something lik, err, harry potter (with a reasonable price) in a leather-bound book with all sorts of designs that link to the book design of the 19th century, they would do that. i gave this example for something that tries to look "old".</p>
