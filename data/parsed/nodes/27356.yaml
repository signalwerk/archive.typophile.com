  html: |-
    <p>A question for book designers:</p>
    <p>How do you feel about setting a classic text in a modern (as in contemporary, not as in Romantic) face? Would you see this as an unforgivable act of heresy?</p>
    <p>For instance, suppose someone commissioned you to design a "modern-looking" edition of <em>Alice's Adventures in Wonderland</em>. Some would argue that this text, originally published in 1865, should be set in an English (or at least British) face of about the same time. Among the more familiar faces, you would have Bell, Baskerville and Bulmer -- even though I believe they're all from the 1700s, not the 1800s.</p>
    <p>Would you consider "modernizing" Carroll's classic -- or any other classic -- through design a ludicrous proposition? If not, what would be your approach?</p>
