    html: |-
      <p>I first mentioned <em>Alice's Adventures in Wonderland</em> just as an example -- the first classic that crossed my mind -- but have since been intrigued by the idea of doing it as an exercise. Both the text and Tenniel's illustrations are in the public domain, so the financial investment would be minimal.</p>
      <p>Since I don't want to invest in new faces for this experimental project, I've been considering either Quadraat (pretty "whimsical", I would say) or Esprit, but wonder if the latter would be really suitable for a book -- or at least most of it, if I use a face for the real world and another for wonderland. Also, perhaps Esprit is too rococo for the text. (I tried asking about the use of Esprit for extended text in another topic but didn't get any replies, so I'm removing it.)</p>
      <p>Re. Tenniel's illustrations, as a child I used to find them rather spooky. Granted, AIW is hardly a book for modern children -- too long, for one thing. Still, in order to make the illustrations slightly less scary, I was thinking of perhaps "illustratoring" them a little to make them look more like paintings. Would that be an unforgivable desecration of Tenniel's work?</p>
