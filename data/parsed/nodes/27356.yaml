      <p>Thanks for your input, Nolan. Much appreciated.</p>
      <p>And I think I know what you mean, Yaronimus. What I originally meant is that publishers sometimes want designers to "modernize" a classic text and, silly as the idea may sound to a typographer imbued with the spirit of honouring text first and foremost, it may be necessary to try and accommodate the client's wishes. In this context, I wanted to explore the possibilities available to the typographer who wants to try and please the client but is reluctant to sell their soul to the devil outright.</p>
