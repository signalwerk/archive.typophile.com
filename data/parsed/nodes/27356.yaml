      <p><code>I know it might be a sore point but beyond typographers and designers who are typophiles using period type would probably be lost on the reading audience.</code></p>
      <p>Ah... We were discussing something very similar over in <a href="http://typophile.com/node/27323" target="_blank" rel="nofollow"><em>About Minion</em></a>.</p>
      <p>I would go one step further and say, at the risk of being stoned to death right here, that most signs of typographic refinement are completely lost on the reading audience.</p>
      <p>I'm not suggesting we all just give up and start using nothing but Times New Roman. However, if we're going to be realistic, I think the cold truth is that the overwhelming majority of readers won't see anything wrong with The Hound of the Baskervilles set in a 17th-century French face.</p>
      <p>Anyway, my point is that there would be little or no room for typographic refinement if our only concern were those things that actually affect the majority of readers. (Determining what does affect readers would in turn require extensive research, which is even further off topic.)</p>
      <p>I quite like the idea of two different faces for AIW, with a wacky one for Wonderland.</p>
      <p><code>I think the most important consideration is that the typeface "honors" the text.</code></p>
      <p>I completely agree, Paul. But I suspect that a typographer's concern with honouring content isn't always compatible with a publisher's idea of how a book should be "packaged" so that it cost as little as possible to produce and sell as much as possible.</p>
