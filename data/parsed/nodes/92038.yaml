  html: |-
    <p>Having become somewhat disillusioned with my book font project, I dug up an old attempt at fontmaking, "Catharsis Requiem", and started remaking it with the new knowledge on typography I had gathered in the meantime.  While the original was supposed to look serious and ceremonial, I moved from a humanist to a modern stroke to make a flashier and more glamourous font... <strong>Catharsis Glamour</strong>.  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/glamor_4964.png"></div><p></p>
    <p>I intend to make a companion font, <strong>Catharsis Glory</strong>, with less contrast and possibly adnate serifs, for smaller text sizes and "tougher" environment. Also, it should be fairly easy to make different <strong>weights</strong> for these fonts, given their modular nature.  I will probably skip on the <strong>italic</strong> because the machine-created slanted version looks already quite usable to me.</p>
    <p>Of course, I won't start with any of that until I've polished the base font a bit more.  What are your opinions and suggestions?</p>
    <p>And in case you were wondering, this is the old precursor font, <strong>Catharsis Requiem</strong>:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/requiem_6311.png"></div><p></p>
    <p>Oof! My eyes! It hurts!  ;o)</p>
