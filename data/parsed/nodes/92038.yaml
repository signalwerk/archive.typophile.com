    html: |-
      <p>First thing I notice about the |n|s of Didot and Bodoni is the diagonal-ness of the shoulder. The right stem extends vertically up to almost the x-height, and the arch then drops down rather far on its way to the left stem.</p>
      <p>For Glamour, I would prefer to keep more even-sided arches; domes rather than slanted roofs.  I realize this might make it harder to read, since it makes the tops of |n| and |o| look more similar than they need to be. On the other hand, that same similarity could also be seen as a consistent style. Is that a viable course of action?</p>
      <p>I took some other pointers from Didone, though: keeping the outer edge of the right stem vertical to a greater height than the inner edge, "cheating" by shaving a bit off the serifed stem, and just generally tweaking the curves until they seemed to flow into each other better.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nn_3887.png"></div><p></p>
      <p>What do you think?  I do like it better now, but obviously I'd like to finalize this particular curve design before I propagate it through the whole font by hand.</p>
