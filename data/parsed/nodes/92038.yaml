    html: |-
      <p>It's not that I don't like the "e".</p>
      <p>When I critique somebody else's work it's important for me to try to not impose my own stylistic preferences; I can be most helpful when I help others better express their own style; and really, if I cause others to express <em>my</em> style I reduce the value of my own work! I have to be able to put myself in their shoes, which requires a certain "design empathy". With the right mindset I can help somebody improve a font that I personally can't stand! This "psychological leap" is a failing typical of most people who provide critiques, and probably the reason some people just don't like doing critiques (although sometimes it's because they're too vain to entertain the notion that others can actually help improve <em>their</em> work).</p>
      <p>However one way a third-party can clearly help is to see imbalances, inconsistencies that the original designer is unable to see for various reasons (often due to being too close to the work).</p>
      <p>So: If you like a peculiar "e" (the most common letter no less) you can't really mind a quote/apostrophe simply because it's peculiar.</p>
      <p>hhp</p>
