      <p>One thing that might still be a problem is that I use two different strengths for the thin parts of the font. Serifs and the thin halves of arcs usually are 10 units (blue) while crossbars are 15 units (red). The ansae of |o|-like letters (red) also end up rather heavy-looking, although the thickness there was supposed to be 10 by design...  hm.</p>
      <p>The main reason I did this was that the crossbars felt too flimsy to me.  Should I just man up and make them thin and uniform, or is it viable to keep it like this?</p>
