      <p>So the quote is really that peculiar...?  Huh. I wouldn't have guessed.</p>
      <p>Incidentally, I'm rather liking that new <strong>e</strong>. I checked with Didot and found I get the same lack of weight balance between <em>feeler</em> and <em>foolor</em> as I do with my new <strong>e</strong>, so it can't be that bad a flaw. </p>
      <p>Then again, if I were to go through the font and de-peculiarize all the peculiar letters, I'd get a rather different font.  Maybe that's how I could use my original idea of building a matched pair of “Glamor” and “Glory” fonts: The current version, with its dense vertical pillar structure, could be “Glory”, and I could make “Glamor” a more traditionally-shaped font with diagonals in <strong>k v w x y</strong> to go with it.</p>
      <p>Food for thought...</p>
