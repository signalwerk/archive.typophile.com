      <p>After some experimentation, I've returned to the relatively conservative circle-and-tail construction, as well as inverted rather than mirrored quotes. Just looks the least weird to me.</p>
      <p>I've also had some fun with ligatures. Currently, only the <strong>f—</strong> ones are in LIGA, with all the others in DLIG. I'm not quite happy with that arrangement, though, since most casual users of the font might never actually get to see them. Therefore, I'm tempted to move most ligatures into LIGA. I'd keep just a few of the most unusual-looking ones in DLIG (such as the old-fashioned <strong>tz</strong>) so as not to alienate “regular” users.</p>
