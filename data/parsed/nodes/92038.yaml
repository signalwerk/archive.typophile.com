      <p>Alright, made some more tweaks and corrections. The main change is that Glory now has rectangular tittles and periods. The new PDF file is at the URL in the post above.</p>
      <p>I could really use a quality check by a pro, so let's up the ante a bit. I'm offering a <strong>free licence</strong> for these two fonts as recompense for whoever gives the PDF above a careful inspection and reports the major flaws. (<strong>EDIT:</strong> That offer only stands until the first 1–2 reviews...)</p>
      <p>I'm also interested in contracting out the kerning. I'll use iKern if it comes down to it, but I suspect these fonts need rather little kerning due to their vertical nature (especially Glory, which eschews diagonals), so it might be a quick-and-easy (-and-affordable) manual job for a skilled typophile.</p>
