      <p><a href="http://kb2.adobe.com/cps/322/322050.html" title="http://kb2.adobe.com/cps/322/322050.html">http://kb2.adobe.com/cps/322/322050.html</a> lists 12 different ways of "repairing" fonts that cause problems.<br>
      Try deleting all AdobeFnt*.lst files you can find -- it's possible an earlier test-run of your font got cached somewhere. Deleting these files (the * can be any number) is of no consequence to your system, they are just Adobe's own personal brand of font cache data and will be rebuilt next time you start one of Adobe's applications.</p>
