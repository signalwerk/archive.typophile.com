      <p>If you install a regular weight that has naming problems it can cause Indesign to handle all other fonts in the family incorrectly <em>until you install a correctly named regular weight</em>. Don’t trust the green diamond; when setting up your font naming base them on a working family (just open up some Adobe fonts and see how they do it). Start with a regular weight and then add fonts one at a time fixing problems with each one as you go.</p>
      <p>Most importantly, generate the fonts from FontLab directly into the “/Library/Application Support/Adobe/Fonts” directory. Never install your test fonts using any other utilities or by putting them into the system fonts directory or you’ll get into a cycle of cache cleaning and rebooting that can go on for hours. Only install fonts to test your final retail fonts and your life will be much easier. I don’t install a font on a Mac until I’ve already cleared it with FontQA, Microsoft’s font testing tool, and the entire family works in Adobe apps and on my Windows machine.</p>
