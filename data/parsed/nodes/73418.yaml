    <p>Cheers,<br>
    I'm doing a small font family in Fontlab 5, now containing a Regular, Light, Bold and Heavy weight. I did the Regular and used the vfb as a template for the Light, Bold and Heavy. I filled the Font Info on all four vfbs with the help of the green Diamond.</p>
    <p>My four generated otf files are all recognised in my font management software MainType. But when I load any or all of them, Adobe InDesign CS4 only shows the Regular in the font menu. In addition, it doesn't really seem to be the Regular at all, because if you e.g. just load the Heavy in MainType, InDesign uses the Heavy with the name Regular displayed.</p>
    <p>I googled around but I just couldn't find a solution. I just want to cry, why doesn't it work? Please help me out!</p>
    <p>Thanks a lot!</p>
