    <p>Jan van Krimpen (1892–1958)</p>
    <p>Dutch typographer. His type-designs Lutetia, Romanée, Romulus, Cancelleresca Bastarda, Romulus Sans, Sheldon, Spectrum, Haarlemmer, Antigone Greek (not a complete list). His punch-cutter at Joh. Enschedé en Zonen was Rädisch. The relation between Van Krimpen and Rädisch was difficult. DTL is currently digitalising a few of Van Krimpens designs.</p>
    <p>His stamps (designs for the Dutch PTT post published in 1946) where well known and liked throughout the Netherlands. </p>
    <p>Articles and books by Van Krimpen:</p>
    <p>'On Designing and Devising Type' (1957)</p>
    <p>Articles and books about Van Krimpen:</p>
    <p>Dreyfus, John – The Work of Jan van Krimpen (1952)</p>
