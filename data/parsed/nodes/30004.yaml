    <p>Jan van Krimpen&nbsp;(1892–1958)</p>
    <p>Dutch typographer. His type-designs Lutetia, Romanée, Romulus, Cancelleresca Bastarda, Romulus Sans, Sheldon, Spectrum, Haarlemmer, Antigone Greek (not a complete list). His punch-cutter at Joh. Enschedé en Zonen was Rädisch. The relation between Van Krimpen and Rädisch was difficult. <span class="caps">DTL</span> is currently digitalising a few of Van Krimpens&nbsp;designs.</p>
    <p>His stamps (designs for the Dutch <span class="caps">PTT</span> post published in 1946) where well known and liked throughout the&nbsp;Netherlands. </p>
    <p>Articles and books by Van&nbsp;Krimpen:</p>
    <p>‘On Designing and Devising Type’&nbsp;(1957)</p>
    <p>Articles and books about Van&nbsp;Krimpen:</p>
    <p>Dreyfus, John – The Work of Jan van Krimpen&nbsp;(1952)</p>
