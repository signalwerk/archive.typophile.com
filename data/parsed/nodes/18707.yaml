      <p>—<br>
    <strong>Call for Presentations for the TypeTech Forum at ATypI Lisbon 2006</strong></p>
    <p>—<br>
    Association Typographique Internationale (ATypI) Annual Conference<br>
    Lisbon, Portugal, 27 Sep - 1 Oct, 2006</p>
    <p>March 21, 2006 - Announcing the opening of the Call for Presentation Proposals for the TypeTech Forum of the ATypI Lisbon 2006 conference.</p>
    <p>The Board of Directors of ATypI is proud to note that the ATypI Conference is sponsored by many of the leading companies in the graphic arts and computing. Early sponsorship for Lisbon comes from the Microsoft Corporation.</p>
    <p>The ATypI 2006 TypeTech Forum committee invites submissions of abstracts for presentations on any theme related to technology in type design and typesetting. Based on previous feedback, there will be no separate introductory section this year; potential presenters should assume that their audience is versed in the basics of type technology, such as Unicode and OpenType.</p>
    <p>Appropriate topics include, but are not limited to: new methods in typeface design and production; approaches to testing fonts; issues and solutions for font development; and new technologies in typesetting. Proposals are welcome for practical demonstrations as well as lectures and panel sessions. Preference will be given to talks which have not been done before at TypeTech Forum or ATypI.</p>
    <p>Abstracts should include the title of the proposed presentation, the requested time length, the presenter’s name(s) and a short biographical note (50-100 words), and a short summary (100-200 words) suitable for publication in the conference programme. (Note: Biographies and presentation descriptions may be edited for length and/or clarity.) Presentation lengths in the TypeTech Forum are variable, but generally run <!--
