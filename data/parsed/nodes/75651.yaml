    <p>This logo is for a school project. The logo is for a play called Trying.<br>
    By Joanna McClelland Glass<br>
    Directed By Richard Seer<br>
    The play is about a 80 year old Judge who hires a new 25 year old secretary. They are really different from one another and argue a lot, but end up influencing each other in a way that lasts a lifetime.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/one_5861.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/g2_6132.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/T_5023.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/trying_4730.jpg"></div><br>
    So, that was pretty much my design process.<br>
    The tree and leaf is supposed to represent this 'old and young' theme that's in the play.<br>
    Thanks guys.<p></p>
