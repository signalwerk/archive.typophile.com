      <p>The standard typographic conventions are more or less the same in France and Quebec, but the word processing conventions are different: as I understand it, in France, the convention is to type a normal space in each case; in Quebec, the convention is generally to leave out the space, except in conjunction with the colon.  For both locales, MS Word is configured by default to convert the appropriate spaces into (full-width) non-breaking spaces.</p>
      <p>The recommendation that spaces be omitted in Quebec is set forth <a href="http://here" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://here</a> by the Office québécois de la langue française; a small note at the bottom makes it clear that the recommendation takes into account the shortcomings of common word processors (as of 2002), and that if you have a way to insert a thin space, you should use it before semicolons, exclamation points, and question marks.</p>
      <p>None of the "official" lists of rules that I've seen seem to include percentage signs or currency signs (dollar, euro, pound), but looking through some French language materials it's clear that these are also offset by space (in both France and Quebec), and there are probably signs that fall into this category as well.  An ellipsis is not offset by space, however.  Apparently the rule of thumb ("signe double, espace double") has to be qualified a bit.</p>
      <p>I'm not aware of any language other than French where extra space is conventionally inserted around punctuation.</p>
