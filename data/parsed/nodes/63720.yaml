      <p>The best book and probably the official book from the Imprimerie National , is :</p>
      <p>Lexique des règles typographiques. Imprimerie nationale (France: Imprimerie nationale. 1990) ISBN: 2-11-081075-0 (pbk.) <a href="http://www.amazon.fr/Lexique-r%C3%A8gles-typographiques-lImprimerie-Nationale/dp/2743304820/ref=pd_sim_b_12">http://www.amazon.fr/Lexique-r%C3%A8gles-typographiques-lImprimerie-Nati...</a></p>
      <p>Applications like Microsoft Word (French version '98) use to add a word space before or after many puncuation marks like the guillemets. </p>
      <p>I had added most of these rules to the Microsoft Character Standards descriptions for 'punctuation' found here:<br><a href="http://www.microsoft.com/typography/developers/fdsspec/punc.aspx">http://www.microsoft.com/typography/developers/fdsspec/punc.aspx</a></p>
      <p><img src="/sites/default/files/old-images/ouais_5132.gif"></p>
      <p>there are also other French rules in other sections such as 'lowercase' for the alignment and use of ordinals 'premier, première' and 'deuxième' showing common use and typographically correct uses. </p>
      <p>Found at the bottom of this page:<br><a href="http://www.microsoft.com/typography/developers/fdsspec/lowercase.aspx">http://www.microsoft.com/typography/developers/fdsspec/lowercase.aspx</a></p>
      <p><img src="/sites/default/files/old-images/deuxieme_6340.gif"></p>
