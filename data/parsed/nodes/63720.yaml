    html: |-
      <p>From a French point of view:<br>
      - punctuation signs with both a lower and an upper part which take a space before and after (hence the ellipsis does not);<br>
      - the best practice is to have a non-breaking thin space before and one normal space after, although this may cause problems in justified texts (some word processors, some versions of XPress and Indesign shorten the normal spaces so much that they become smaller than the justified 'normal' breaking space);<br>
      - whether there is a space between numbers on the one hand and monetary signs or percentage on the other hand seems to be left to the typesetter - however since these signs all stand for words, it would make sense to space them like a word (space before and after).</p>
      <p>Also, look at 19C books in English (and many other languages), they are often spaces like French is nowadays. My understanding was that the practice of taking away that extra space was established by commercial publishers (notably of newspapers) who wanted to save space, thus money. I may be wrong!</p>
      <p>Last: the book quoted from the Imprimerie Nationale is very good, but as the title says, it is only the rules this printing press used internally and has no pretense of being the norm.</p>
