    html: '<p><a href="http://unicode.org/udhr/n/notes_fra.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">This web page</a> lists the rather specific spacing conventions used by the Government Printing Office of France.  Basically, punctuation marks that consist of two elements (: ; ? ! etc.) should be separated from the closest word to which they "belong" (for example, the last word of a sentence for a question mark, or the first word of a quotation for an opening guillemet) by a non-breaking space.  Whether that space should be full-width or thin depends on the punctuation mark.</p>'
