    html: <p>I thought, the distance of the punctuation marks to the previous word should be controlled by the plain metrics and the kerning, but not by any space character. The distance is often to small, because the left side bearing of the punctuation mark, stored in the font, is often to small. And I don’t understand, why there should be a difference between punctuation marks, that consist of two or one element, except from the fact, that one element punctuation marks cannot collide with the arm of a T for example. A comma can also be to close to a letter. (A week ago I bought a book, in which I was irritated by the small left side bearing of the comma more than one time, because it simply was not visible enough.) If a punctuation mark is exactly between two terms, I am irritated. The distance to the following word should be clearly bigger (but in most cases it should not consist of two spaces). But note, that I am not a professional.</p>
