    html: |-
      <p>Due to the optical illusion which always occurs with white type on a black background it makes the letters look more tightly kerned on the black than the white. However each version looks correct to me, so unless you want to be a perfectionist and loosen the kerning slightly on the black background so the eye sees them the same, I think you have done a very nice job :)<br>
      In fact I prefer the white on black as the kerning looks slightly tighter, yet the word still covers the same length.</p>
