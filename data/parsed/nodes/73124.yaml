    <p>Hello all</p>
    <p>I have recently created a logotype that is spaced quite generously for various reasons, however because of the characters involved and the slightly unorthodox forms that I have created it's taking me a while to decide whether I have got the kerning right here.<br>
    I've already consulted a very good typographer on this already and it was given a thumbs up, but Im interested to see if anyone else agrees.</p>
    <p>Thanks!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/w_808_4384.jpg"></div><p></p>
