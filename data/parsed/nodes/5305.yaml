  - id: 38260
    user: 1288
    date: 2004-06-22T09:24:00
    date_raw: 22 Jun 2004 — 9:24am
    votes: null
    html: <p>I'm not surprised to see fonts like Souvenir showing up in design today, nor am I surprised to find it here. Souvenir's increased use reflects a break from the ubiquitous technology inspired design that so proliferated during the last five or seven years. I find the homeliness of Souvenir slightly charming when compared against the sea of techno-industrial Lineto, Test Pilot Collective, and T26 fonts. <br> <br>Had I lived through the 70s, I imagine I might feel differently about the issue. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>My 2</p>
    html_clean: <p>I'm not surprised to see fonts like Souvenir showing up in design today, nor am I surprised to find it here. Souvenir's increased use reflects a break from the ubiquitous technology inspired design that so proliferated during the last five or seven years. I find the homeliness of Souvenir slightly charming when compared against the sea of techno-industrial Lineto, Test Pilot Collective, and T26 fonts. <br> <br>Had I lived through the 70s, I imagine I might feel differently about the issue. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>My 2</p>
  - id: 38261
    user: 1043
    date: 2004-06-22T10:54:00
    date_raw: 22 Jun 2004 — 10:54am
    votes: null
    html: <p>I think Souvenir was a well-designed font with a strong flavor. But it got so popular for a while that designers just got tired of looking at it. Now that you don't see it so much anymore, I can see it making a comeback, but it will probably never be as big as it once was (at least as long as boomers are around). <br> <br>It's funny that you mention "technology inspired design." Souvenir, which was originally released as a foundry face in the 1920s but never caught on, was revived in the 1970s because it held up well on phototypesetting equipment, which tended to soften corners and such.</p>
    html_clean: <p>I think Souvenir was a well-designed font with a strong flavor. But it got so popular for a while that designers just got tired of looking at it. Now that you don't see it so much anymore, I can see it making a comeback, but it will probably never be as big as it once was (at least as long as boomers are around). <br> <br>It's funny that you mention "technology inspired design." Souvenir, which was originally released as a foundry face in the 1920s but never caught on, was revived in the 1970s because it held up well on phototypesetting equipment, which tended to soften corners and such.</p>
  - id: 38262
    user: 1112
    date: 2004-06-22T11:19:00
    date_raw: 22 Jun 2004 — 11:19am
    votes: null
    html: <p>After being so familiar with Souvenir for so many years, I was surprised to hear about Souvenir Gothic, which was forced on me by a client (I will forever be sorry I showed her MyFonts). Though Souvenir Gothic -- not designed by Benton/Benguiat, by the way -- has the debatable advantage of not currently being in use by anyone else (as far as I know), I think I would have preferred plain old Souvenir. <br> <br>And hey, if Souvenir is making a comeback, can we make some room also for Serif Gothic? That was my favorite as a 12-year-old, so it still has a special place in my heart.</p>
