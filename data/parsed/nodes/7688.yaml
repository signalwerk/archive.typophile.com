    date: 2004-11-25T18:29:00
    date_raw: 25.Nov.2004 6.29pm
    votes: null
    html: <p>Maybe people didn't respond because they didn't think anything useful could be determined by the exercise, or because they thought you had pre-determined that designers would regularise the shape. I also suspect that most designers associate fixing something or making something correct relative to a brief, so presenting them with a shape without any context of what it is for isn't likely to garner a response. The trick would be to come up with a context that would not overly determine how the designer would respond, but that seems to me very difficult.</p>
