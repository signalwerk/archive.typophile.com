    <p>This is an experiment to see how your brain works. <br> <br>-- <br> <br>Please fix the shape below: <br> <br><img src="http://www.typophile.com/forums/messages/30/53550.gif" alt="shape"> <br> <br>To forestall the power of suggestion, please prepare your corrected shape before Saturday, November the 20th, and submit it to this thread after Sunday, November the 21st. Your time zone. <br> <br>Note: <br>This is not a test - you cannot fail. On the other hand, incriminating aspects of your psyche might very well be revealed.  :-&gt; <br> <br>Repeat: <br>Do not show any work before the end of your 21st (not even if it's just a joke). Thank you. <br> <br>hhp</p>
