      <p>You are welcome Joe. You may forward my comments but be sure your client understands that this is a single individual and may not be indicative of Autistic children as a whole. There is a broad range of differences among people in the Autism spectrum.<br>
      Although my son prefers to write in sans serif faces, he reads seriffed faces now with no problem and without comment.</p>
      <p> ChrisL</p>
