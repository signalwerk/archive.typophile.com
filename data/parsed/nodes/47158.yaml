  html: |-
    <p>I am working on a logo project for a sports league, initially basketball but later will expand to softball. He wanted the logo to be more on the conservative/traditional feel versus a more current x-treme sports look.</p>
    <p>So one of the directions I wanted to explore was using a classic baseball-inspired script. Yeah, I know I'm doing basketball, but don't get hung up on that.</p>
    <p>I've come up with Metroscript, Fenway Park (nice but no swash characters), Casey (too much contrast), LHF Ballpark, Philly Sports.</p>
    <p>Metroscript feels the most unique, but some letters feel to erratic. I like the swashes.</p>
    <p>I especially need an attractive "y" and "g". I can't reveal the full name of the client, but it includes the word "League"</p>
    <p>Any suggestions would be appreciated.</p>
    <p>David</p>
