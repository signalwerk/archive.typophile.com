      <p>Ok, I'll try to retype what got lost the last time, so I will be short. It might sound harsh because of that, I don't mean it to be. :)</p>
      <p>A - The weight is on the wrong leg, it should be on the right one.<br>
      B/D - Bowls are a bit too light compared to the stem.<br>
      F - If you lower the crossbar on the F, it will optically fill up the large negative space. Don't apply this to the E.<br>
      J - Looks a bit weird, lower part too light.<br>
      K - Weight reversed, upper arm should be the lightest, lower arm heaviest.<br>
      P - I would slightly increase the bowl. See B/D.<br>
      S - Place the weight more on the spine. Said spine is also too horizontal I think.<br>
      T - Might be a bit too wide.<br>
      V/W - Apex too far to the right. Shift the apex more to the left.<br>
      7 - Same as V/W, the stem is too 'straight', the bottom of it should be shifted more to the left.<br>
      8/9 - Are rolling over optically (both to the right).</p>
      <p>As for the rolling, that is because the level of slant is not consistent throughout the  design. Maybe it is, but optically it isn't. :)</p>
