      <p>The serifs don't match the serifs on Clarendon — they're not slabbed enough, and the brackets are too big. Also, Clarendon has greater thick/thin contrast, which I think is one of its defining characteristics. Take a look at <a class="freelinking external" href="http://typography.com/fonts/font_overview.php?productLineID=100028" rel="nofollow">Ziggurat</a> for some cues. It's a slab serif with a nice italic, but without the brackets connecting the stems to the serifs like Clarendon has. You should try modulating the strokes a bit. </p>
      <p>I think this can be a very interesting project, just hang in there. There's a lot of potential for a very interesting and useful typeface here.</p>
