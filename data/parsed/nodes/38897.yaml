    <p>Hello everyone, </p>
    <p>I am a final year student studying in the UK. Last month I attended the Plus Type Conference in Birmingham. I listened to a fascinating lecture about the Grotesque Italian by an American lecturer David Sheilds, from the University of Texas. </p>
    <p>A few days later I read up on American wood type generally, and was really inspired, in particular by some of the Antique Clarendon's shown within. I decided to try and recreate my own version digitally, as an italic.</p>
    <p>Here is my work so far. I have only created uppercase and numerals so far and would much appreciate any form of critique. </p>
    <p>Thanks a lot</p>
    <p>Jonny</p>
