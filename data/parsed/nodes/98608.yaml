  html: |-
    <p>A) Can ligatures be included in Class Kerning</p>
    <p>B) If so, how is it done?</p>
    <p>It appears to work in the metrics window but in Photoshop it will not.  All my classes work properly except where a ligature is involved, when the ligature will not kern at all .  I do have the ligatures included in my kerning classes. I fear I am doing something similar to my previous problem regarding the ordering and /or syntax of my OT script, but this was generated by FL and not manually.<br>
    Also, strangely, the Class Names I specified were changed after generating the OTF from the VFB,<br>
    Can anyone shed some light on this for me please?</p>
