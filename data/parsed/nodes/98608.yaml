    html: |-
      <blockquote><p>Also, strangely, the Class Names I specified were changed after generating the OTF from the VFB</p></blockquote>
      <p>This is normal— class names don't get carried over into compiled OTFs, so FontLab assigns generic names to any classes when re-importing.</p>
      <p>You say class kerning works properly in FontLab's Metrics window, does it also work in the OpenType Features Preview panel (with the <code>kern</code> feature checked)?</p>
