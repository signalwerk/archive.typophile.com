      <p>It’s difficult to match a graffiti style and it’s likely that it was drawn (at least the paint drips).</p>
      <p>There are a lot of graffiti fonts at <a href="http://www.graffitifonts.com/fonts.shtml" target="new"><strong>Graffitifonts.com</strong></a></p>
      <p>Try looking at Grand Stylus and Fatboy Slim.<br>
      Here’s the word <a href="http://www.acmedigital.net/JianSabu/images/Saturdays.gif" target="new"><strong>“Saturdays”</strong></a> in Fatboy Slim.</p>
      <p>————————————————————-<br>
      Yes, I’m old, but I’m back in style!</p>
