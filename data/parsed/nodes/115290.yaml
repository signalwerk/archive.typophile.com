  html: |-
    <p>I'm looking for a slab serif with open shapes and contrasting italics. I really love Salvo Serif, with its round O and in general very open round counters: <a href="http://www.fontbureau.com/fonts/salvoserif/" title="http://www.fontbureau.com/fonts/salvoserif/">http://www.fontbureau.com/fonts/salvoserif/</a></p>
    <p>However, its italics are really just oblique:</p>
    <p><img src="http://i.imgur.com/l0jaoIB.png"></p>
    <p>Does anyone know of a similar font with true italics?</p>
