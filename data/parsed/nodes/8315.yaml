    html: <p>The cap widths look a bit weird because you are not following either tradition. One is the classical which makes some within a square and some in half a square (roughly). For this see Trajan and Futura. There the T E F is narrow and the H wide. In the 19th century they went for more similar width, so the E and H would be more similar width. Here you have a narrow T and a wide E, which looks strange.  <br> <br>There are no rules, just what you can make work. I like the idea for the serifs, but you might look at different caps that you like for inspiration on how to adjust their widths.</p>
