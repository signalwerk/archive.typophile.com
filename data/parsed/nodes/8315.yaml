    date: 2004-12-22T14:45:00
    date_raw: 22 Dec 2004 — 2:45pm
    votes: null
    html: "<p>Goals: well, I've always wanted to make a font. One that is atypical, functional, and not ugly. <br>Niche: I haven't a clue. <br>Inspiration: The doodle I posted above, drawn in my notebook during a discussion of Rudolph Fisher's <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0472064924/\">The Conjure-Man Dies</a> in a seminar on literature of the Harlem Renaissance. Frimbo is the conjure-man's name. <br>Basically, I feel a strange attraction to the forms of the alphabet and want to create. This font is a learning experiment but I'd like the finished product to be worth the effort of learning. I am a bit discouraged, wondering if the characters I've created so far look like they belong together and are well formed. If I can manage it I want to build a font with at least display, light, book, and black weights. And a full character set. But if it is mediocre (or just plain bad) then I don't want to spend the time creating a full range for a bad font.</p>"
    html_clean: "<p>Goals: well, I've always wanted to make a font. One that is atypical, functional, and not ugly. <br>Niche: I haven't a clue. <br>Inspiration: The doodle I posted above, drawn in my notebook during a discussion of Rudolph Fisher's <a href=\"http://www.amazon.com/exec/obidos/tg/detail/-/0472064924/\" class=\"link-external\">The Conjure-Man Dies</a> in a seminar on literature of the Harlem Renaissance. Frimbo is the conjure-man's name. <br>Basically, I feel a strange attraction to the forms of the alphabet and want to create. This font is a learning experiment but I'd like the finished product to be worth the effort of learning. I am a bit discouraged, wondering if the characters I've created so far look like they belong together and are well formed. If I can manage it I want to build a font with at least display, light, book, and black weights. And a full character set. But if it is mediocre (or just plain bad) then I don't want to spend the time creating a full range for a bad font.</p>"
