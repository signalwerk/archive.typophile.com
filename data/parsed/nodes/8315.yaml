    html: <p>Noah, one first thing you could try is to give the letters a similar finish. See how odd it looks when you have the H next to the E. You have at least three different styles of serif there. The serifs shouldn't be exactly the same in all letters, but they should harmonize. <br> <br>After that, you can work on the structures of the letters. I see that you've made all letters the same width, but that leaves you with a excessively wide I, and a narrow H.</p>
