    html: |-
      <p>Since InDesign CS2, Russian, Polish and Greek dictionaries are included in the regular U.S. edition of InDesign. The language-localized Central European versions of InDesign made by Winsoft include some extra features for those languages (extra dictionaries, better sorting of indexes etc.). The Middle Eastern version of InDesign includes ALL those extra features for Central European languages as well. </p>
      <p>Before InDesign CS2, there was a separate Central European version of InDesign because the U.S. edition only had dictionaries for Western languages. </p>
      <p>A.</p>
