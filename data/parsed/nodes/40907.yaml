  html: |-
    <p>The help/support PDFs I found at winsoft.eu indicated that it was possible to work in Roman/left-to-right languages by changing a few preferences in InDesign CS3 ME (Middle Eastern edition). The question I have is if this is advisable for someone who is currently working primarily in the standard version of Indesign CS3 for English and other Western European documents, who only occasionally needs to edit text in Arabic (this user is currently sending out the files for translation and text placement, and receiving outlined glyphs for placement as EPS files...kind of a mess). Also, this user is operating a Mac, if that is important (the translating company indictated that it might be).</p>
    <p>Also, would it be a practical solution to install InDesign CS3 ME under an alternate user account, and just switch accounts as needed? Would this fubar the preferences for one or both of the editions of InDesign?</p>
    <p>Thanks in advance, I realize this is sort of a complicated mess.<br>
    Enrico</p>
