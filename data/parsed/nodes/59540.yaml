    html: |-
      <p>The boldest weight works best. A lot more could be done to harmonize the shapes of the letters. Perhaps take a look at how <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_sanuk_1_ot/" rel="nofollow">FF Sanuk</a> balances verticals with subtle near-horizontal curves. The diagonals can be somewhat jarring in this scheme. W calls too much attention to itself, and I think M should be tamed as well.</p>
      <p>As for the Cyrillic letters, у needs to descend, the 'legs' of д need to descend more, and the bowl of ь needs to be a touch taller and narrower and given a treatment similar to d. The side of б probably should be more vertical. The м stands out even more in the Cyrillic, and should really be given vertical sides.</p>
    html_clean: |-
