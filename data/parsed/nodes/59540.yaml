    html: |-
      <p>Jongseong,</p>
      <p>Thank you for your time and feedback.</p>
      <p>I'm studying FF Sanuk per your suggestion. I was wondering about the W, and your comment pushed me to rework it, but I kept the old as an alternate. I prefer the spread M form, but I created an alternate and used the vertical sided M and м for the Cyrillic.</p>
      <p>Per your comment, I've extended the д legs. Let me know if I need to go further. I changed the y to the English lowercase form as the other references agreed with you. I had already reworked the б prior to your comment. </p>
      <p>I've increased the counter size of the ь on the bolder weights and made it a bit taller. Could you clarify "given a similar treatment to d?" My refs all agree that is it appears like an upside down P smallcap.</p>
      <p>Thank you,</p>
      <p>Jeremy Dooley<br>
      <a href="http://www.insignedesign.com" title="www.insignedesign.com">www.insignedesign.com</a></p>
