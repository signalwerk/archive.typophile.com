  - id: 355846
    user: 12009
    date: 2009-07-10T01:48:00
    date_raw: 10 Jul 2009 — 1:48am
    votes: null
    html: |-
      <p>I like the improvements!</p>
      <p>The д should still descend a bit more. Usually it descends as much as the ц.</p>
      <p>The ascender of the б looks a bit cramped against the bowl. I would nudge the part that connects to the bowl up and to the left, so that the curve is a bit squarer.</p>
      <p>The counter size and shape for the ь looks right. What I meant about the treatment similar to the d (I should have said b) is that the bottom of the bowl could be curved and skewed, which is a defining feature of this design for letters such as a, b, and d. You can refer to [http://new.myfonts.com/fonts/andrijtype/oksana-text/|Oksana Text] to see how this letter can be treated in an informal Cyrillic design.</p>
      <p>Maybe the M doesn't have to be vertical. I thought a vertical M would be in keeping with your design where the vertical lines are the constant shared between many letters, but in the case of the M (and for м), I now think having the sides a touch inclined would flow better with the rest of the design. The original spread M is too much for the Cyrillic, I think, but maybe something in between would work.</p>
      <p>Good luck!</p>
