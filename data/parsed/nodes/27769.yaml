    html: <p>I love it...to my eye, it's quite original and fresh...love the H and K, both caps and lc, esp how the top crossbar offsets the inventive action down below for the lower case k. I'm not a type designer, just a bigtime consumer, so I can't give more detailed by-the-letter critiques, but this one has real promise and I hope you carry it on.</p>
