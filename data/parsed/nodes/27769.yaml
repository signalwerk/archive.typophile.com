  html: |-
    <p>Hey, I am currently a student in my second typography class.  We have been working on a font for the past 6 weeks, and I am to the point where I am ready to input it into a font software.  However, I wanted to put it out there first for a critique </p>
    <p>This is my first font, so any and all feedback is very much appreciated.</p>
    <p>My inspiration for this font is from a Celtic writing style mixed with a Modern typestyle (Didot being my primary reference.)  While most of the Celtic touches have disappeared during revisions, a few touches still remain.</p>
    <p>I am mostly looking for consistency between the letterforms, however all comments and suggestions will be helpful.</p>
    <p>Anyways, I am looking forward to some outside opinion.  I have been staring at these letters for so long that I tend to not see the flaws until someone points them out to me.</p>
    <p>Because I have not put it into the font software yet, I am not including entire paragraphs of text.  However, I did hand set a quote in three different sizes, so I am including that as well as the upper and lowercase.  I have the numbers and most of the punctuation and special characters drawn and inside the computer, but they are not cleaned up yet, so I am not including them.</p>
    <p>For the time being, this font is called Taurine, named after the main ingredient consumed while creating it, hope you enjoy.</p>
