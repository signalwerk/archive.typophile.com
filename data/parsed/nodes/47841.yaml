  html: |-
    <p>I know that Gill Sans and Gill Sans MT are similar to Bliss and installed on PC's and Mac, but I wanted to know if there was another font that would be similar to Bliss which was web and operating system safe. </p>
    <p>I have seen suggestions for Tahoma, Verdana and Arial, but was not really sure if these would be suitable replacements.</p>
