      <p>I've spent all day trying to figure this thing out. Trying some faux cyrillic typefaces etc. I'm moving more toward a Cold War Modern/Swiss style. I'm trying to incorporate more of a propaganda feel to it as well. Right now it says, "better dead than red" and there is a spaceman falling from a moon shape.</p>
      <p>I'll have to keep researching and pushing it.</p>
