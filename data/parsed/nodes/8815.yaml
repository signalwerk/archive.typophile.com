  html: '<p>============================================================ <br>Linotype Press Release - Get on top of what�s hot in <br>                         typography! <br>============================================================ <br>Let loose with Linotype in London at TypoTechnica 2005 <br> <br>Bad Homburg, January 21 2005. This February, Linotype  <br>Library is inviting typography professionals from around the  <br>world to convene for two days (and nights) of discussions on  <br>the trade�s top technological developments. To be held this  <br>year at the St Bride Printing Library in London, this third  <br>official TypoTechnica Conference promises participants more  <br>than simply an inspiring setting. From speakers like Matthew  <br>Carter, John Hudson and Rich Roat to topics like upcoming  <br>features in QuarkXPress 7, latest font related technology  <br>issues in Avalon�, the new Microsoft� graphic device interface,  <br>and how to maximize use of OpenType and Unicode. The two days  <br>are guaranteed to fly by with more highlights than we could  <br>fit on a single page. Whether you want to just listen, get  <br>hands on experience or actively participate in discussions,  <br>the modular set up the conference offers something for  <br>everyone and lets you make the most of each day according to  <br>your interests. And to wind down, as a special extra on  <br>Saturday, Linotype will offer a stimulating tour through the  <br>St Bride Printing Library. <br> <br>There is only space for a limited number of participants.  <br>So don�t wait. Register now! And see you in London from  <br>the 17th-19th of February, 2005. For anyone already in town  <br>on Wednesday the 16th, a nearby tavern is especially reserved  <br>for all typography friends who want to get started with a  <br>splash. <br> <br>Click here to see the conference schedule and registration  <br>info: <br>- <a href="http://www.linotype.com/8-2358-8/typotechnica2005.html" target="_blank">http:/