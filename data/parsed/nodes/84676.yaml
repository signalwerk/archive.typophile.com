  html: |-
    <p>Hi Everyone,</p>
    <p>I'm working in a new typeface that is taking all my waking hours away!</p>
    <p>Inspiration comes from nixin tubes,<br>
    <a class="freelinking external" href="http://scherle.com/wp-content/uploads/2009/03/nixie_blue.jpg" rel="nofollow">http://scherle.com/wp-content/uploads/2009/03/nixie_blue.jpg</a><br>
    The basic shapes are very simple, so I wonder if there's already another typeface like it around?</p>
    <p>Is it a go? Critics and ideas are always welcome =)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nixin-for-typofilia_4695.jpg"></div><p></p>
