      <p>Well, the field of geometric typefaces like this is quite ‘grazed’.</p>
      <p>‘The Northern Block’ offers several similar typefaces (of rather poor quality as far as I can tell from the samples):<br>
      <a href="http://new.myfonts.com/foundry/The_Northern_Block/" title="http://new.myfonts.com/foundry/The_Northern_Block/">http://new.myfonts.com/foundry/The_Northern_Block/</a></p>
      <p>A professional take on this ‘naïve’ style is Helsinki by Ludwig Übele:<br>
      <a href="http://new.myfonts.com/fonts/ludwiguebele/helsinki/" title="http://new.myfonts.com/fonts/ludwiguebele/helsinki/">http://new.myfonts.com/fonts/ludwiguebele/helsinki/</a></p>
