  html: |-
    <p>I am creating a poster brochure aimed at teenagers but still appealing to adults - parents and teachers. I want a body font stylish, modern, with an edge. I've used Univers for one of the headings and the company's logo is in prosper-book.<br>
    I want something nice and readible and breezy. I was looking at Optima but it's a bit too old fashioned and I was looking at using univers for the body but I'm sure if its as readible and I'm not sure which weight to use. </p>
    <p>Any suggestions appreciated, thanks!</p>
    <p>Andy</p>
