    html: |-
      <p>Of we go high in the sky into the deep blue yonder with these wide speedy air force letters: </p><div class="imageWrap"><img src="http://typophile.com/files/PompeiEditedslant15DegL80PctH_4828.jpg"></div> You won't get this out of a box because, in my opinion, a font probably does not exist in this form. It's probably a manually sloped and squooshed Frankenfont. I started with Albert Boton's 1996 design called Pompei  <a href="http://www.myfonts.com/fonts/mti/pompei/" title="http://www.myfonts.com/fonts/mti/pompei/">http://www.myfonts.com/fonts/mti/pompei/</a> -- partly because of the similarity in _a_ --  sloped the letters 15 degrees right, cut a gap in _R_ and substituted the _Q_ tail from Baker Signet. Further editing could pretty well duplicate your image. BTW if this looks heavy, there is also a light weight version of Pompei.<br>
      Don<p></p>
