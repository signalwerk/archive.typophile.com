  html: |-
    <p>SUDTIPOS //// NEWS</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/stweb_6011.jpg"></div><p></p>
    <p>We are pleased to announce the launch of a new, fully redesigned <a href="http://www.sudtipos.com" rel="nofollow">Sudtipos web site</a>, with many features and new additions.</p>
    <p>The new site was built to accommodate the showing and interactivity with the many fonts we have developed over the past three years. The reconfigured interface now includes a rollover list that quickly previews each font in the Sudtipos collection.</p>
    <p>Another important addition to the site is the Sudtipos Probador™, our fully interactive type tester that allows users of the site to try any Sudtipos font on screen before licensing.</p>
    <p>Two new sections were added, one to showcase the use of Sudtipos fonts by the general public, and one to preview upcoming fonts and projects in development.</p>
    <p>We hope you enjoy the new Sudtipos web experience. Please direct any feedback to <a href="mailto:sudtipos@sudtipos.com">sudtipos@sudtipos.com</a></p>
