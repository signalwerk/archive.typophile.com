    html: <p>The Times has been using Stymie.  It must be an Ultra Light version, as I only have up to a Light weight, but it seems like the same characters. Bitstream's version appears to be the closest - the lower-case 'r' seems to vary with different foundries, with the previously mentioned hook. <br> <br><a href="https://web.archive.org/web/20141114185328/http://www.myfonts.com/fonts/bitstream/stymie/light/testdrive.html?s=High-rise&amp;p=72" target="_blank">http://www.myfonts.com/fonts/bitstream/stymie/light/testdrive.html?s=High-rise&amp;p=72</a> <br> <br>I've been besotted with those self-same slab serif fonts since last Fall's special issue of the Times' T magazine, and I called and asked the art directors ..er... directly, and they were very helpful.  The irony is that I've had the font in my company's library all this time...</p>
