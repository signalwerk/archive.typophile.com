      <p>I've only seen this variant beta for New Hellenic in Yannis' version. I think the top loop is too small.</p>
      <p>For most of the history of Greek typography, both forms of beta are used side-by-side. Here are Granjon's, as shown in the Egenolff-Berner brevier specimen:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/granbeta.jpg"></div><br>
      .<p></p>
      <p>Some printers seem to have employed a rule that what we think of as the normal form should be used at the beginning of words, and the double-loop variant in mid-word, but for the most part I've seen them used interchangeably, presumably at the discretion of the compositor. The variant forms of theta and psi are also used interchangeably.</p>
      <p>Most of this typographic history is, of course, in the Byzantine cursive style popularised by Aldus. So in addition to these variant letter there was a lot of variation of form provided by ligatures.</p>
      <p>When the variant beta appears in more recent fonts, it may have a slightly different form, in which the two loops meet. These are the forms in the MS ClearType collection fonts.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/msctbeta.gif"></div><br>
      .<p></p>
      <p>Although I followed this form in Constantia (second from right) because it worked with the Latinate ductus, I prefer the separate loop form, which certainly works better with the traditional Byzantine ductus.</p>
