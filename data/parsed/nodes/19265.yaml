      <p><em>Especially with regard to the person that counts (the layman reader, who has no idea of what’s historically valid and what’s not) Latinization doesn’t have to be literal</em></p>
      <p>The layman reader doesn't know whether a typeface is simplified (relative to what?), Latinised or within a distinct cultural tradition, novel or revival. His opinion about whether he finds something easy or difficult to read is important, but in what other regard does that person 'count'? Should valid and authentic cultural forms be discarded or avoided because an uninformed person might not recognise them as such? That can only lead to homogenisation and loss of diversity within a culture.</p>
      <p>Really, I think this is madness. What is the point of taking the time to educate ourselves, if we abdicate that knowledge when making judgements, preferring to adopt the imagined knowledge level of some ignorant everyman? To call Scholderer's New Hellenic type Latinised is simply to be ignorant of its origins. To suggest that you are using Latinised in some non-literal, presumably metaphorical sense, not only does nothing to counter that ignorance, it also weakens the whole notion of Latinisation. Latinisation is a very specific and observable phenomenon afflicting a wide range of writing systems, alongside a phenomenon of westernisation afflicting cultural diversity in general. It need to be accurately described so that it can be effectively countered. There are plenty of examples of literal Latinisation of the Greek script to criticise without charging the New Hellenic type with some kind of non-literal Latinisation. Take the time to understand the thing itself, and don't make hasty analogic judgements.</p>
