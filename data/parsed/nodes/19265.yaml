      <p>First, a clarification on the Canadian thing: basically what I was saying is that you'd have to be quite an exceptional Canadian (like maybe a prominent Black Bloc member) to be able to instruct people how to successfully maintain one's cultural identity.* It's like a Dutchman lecturing a Portuguese or Côte d'Azurian about butifarra negra. He'd have trouble simply knowing what that is.</p>
      <p>* I mean, if it weren't for the Inuit...</p>
      <p>--</p>
      <p>&gt; the JvK ksi is simply the normal lowercase<br>
      &gt; letterform compressed down to the x-height</p>
      <p>No. The lowercase xi in question (the one in Romulus, obviously - the one in Antigone is pretty conventional*) is a full ascending letter.** It looks just like Scholderer's capital form, except it's narrower (and has a shorter middle bar). See figure 27 on page 18 of "Greek Letters: From Tablets to Pixels"; or see "Letters of Credit". Is there a historic precedent for that lowercase form? (Although I will shortly explain why that's largely moot anyway.)</p>
      <p>* And also not compressed to the x-height.</p>
      <p>** In fact it's higher than the caps!</p>
      <p>&gt; You can’t just look at a thing, relate it to some other thing that<br>
      &gt; you think you understand, and pronounce a judgement, especially not<br>
      &gt; a judgement about it’s spirit. That is a very dodgy analogic process.</p>
      <p>What in blazes are you talking about? I see things, I form opinions, and I present them. Of course I could be wrong, but that should go without saying. What's dodgy is your definition of latinization. As is your persistent valuation of history over reality. You always make that mistake - probably because you simply enjoy history too much. John, we're not historians, we're designers. It's great that you enjoy history, and that you know so much of it, but don't let it cloud your craft. To me, the important, the useful definition of something is always in the practical sphere. In the context of historical precedent Scholderer's design might be totally, or at least sufficiently, authentic; but in the context of the user, of what the user knows, of what the user has seen and will continue to see, it is clearly latinization.</p>
      <p>You can't base good design decisions more on history than the reality on the ground. Would you set a history of the Holocaust in a blackletter? And if you did, what publisher would go for it? The historic fact is that the Nazis disowned blackletter (for whatever stupid reason). But that's largely moot. Sure, we can try to rectify things (as I do with blackletter) but it's at the fringes of craft - it's not going to please any paying client on the planet; and most of all there's no use putting a spin on terminology to hide the sad truth.</p>
      <p>&gt; The layman reader doesn’t know whether a typeface is simplified<br>
      &gt; (relative to what?), Latinised or within a distinct cultural<br>
      &gt; tradition, novel or revival.</p>
      <p>But he <cite>feels</cite> it, just fine.<br>
      That's fully half of type design right there.</p>
      <p>&gt; What is the point of taking the time to educate ourselves</p>
      <p>Education is great, but choose what you educate yourself with<br>
      more carefully I guess. :-/  Maybe you allocate too much time<br>
      to learning history? But you clearly enjoy it, and humans<br>
      have to enjoy their lives. Just don't bet your career on it.</p>
      <p>&gt; Should valid and authentic cultural forms be discarded or avoided<br>
      &gt; because an uninformed person might not recognise them as such?</p>
      <p>Discard, never. But use with caution. Call things what they are, in a useful realm (not insular history). Who was it that wrote: "I would like to see Scholderer’s more eccentric forms made available, as stylistic alternates, in OpenType fonts. One wouldn’t necessarily want them as default forms, but they would be good to have nonetheless." With that I agree completely! Especially if there's a caution against latinization in the readme.  :-)</p>
      <p>Also, of course I'm not talking about catering to the ignorance of some isolated individuals. I'm talking about judiciously taking into account the perceptions of the crushing masses.</p>
      <p>&gt; Latinisation is a very specific and observable phenomenon</p>
      <p>You don't get to decide what it means. Your definition is empoverished; in its inability to address the really relevant aspects of latinization (like certain types of simplification) it is a crippled definition.</p>
      <p>hhp</p>
