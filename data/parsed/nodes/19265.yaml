      <p>Especially with regard to the person that counts (the layman reader, who has no idea of what's historically valid and what's not) Latinization doesn't have to be literal: all it has to do is impose an alien (practically, if not historically, speaking) skew on a script, and one that comes from Latin (in letter or spirit). In this case the uppercase form is structurally identical to the JvK lowercase xi that we both deride; while the lowercase form is essentially a simplification, specifically in the spirit of Latin. So to me these <cite>results</cite> (if not their lineage) fall under Latinization.</p>
