      <p><em>In this case the uppercase form is structurally identical to the JvK lowercase xi that we both deride</em></p>
      <p>Not really, the JvK ksi is simply the normal lowercase letterform compressed down to the x-height, and hence proportionally squarer. The uppercase zigzag form is a different oddity. It is eccentric, but I believe it exists in the tradition that Scholderer was reviving. I'll need to dig out more of my books before I can confirm that with examples. [I'll mention this thread to Gerry Leonidas, in case he can contribute some thoughts on the zigzag Ksi.]</p>
      <p><em>while the lowercase form is essentially a simplification, specifically in the spirit of Latin.</em></p>
      <p>You can't just look at a thing, relate it to some other thing that you think you understand, and pronounce a judgement, especially not a judgement about it's spirit. That is a very dodgy analogic process.</p>
      <p>Scholderer's New Hellenic is a close revival of letterforms that appear in an edition of Macrobius printed in 1492, probably by Giovanni Rosso in Venice. Now we might look at it as you seem to be, and <em>mistakenly</em> view it in the context of very much later Latin types such as 19th and 20th century sans serifs with their simplification of form. But that is completely ahistorical. If you look at these Greek types of the pre-Aldine model in their original context, beside Italian incunabula Latin types, you see the radical difference and their distinctly <em>un</em>Latin character. Then you have to look for their origin, and you find it in the formal Greek bookhand of the Middle Ages. I have not unpacked all my Greek books yet, but below is the best example that I could find in the books I have on hand. [Unfortunately, I can't figure out which box contains my copy of Scholderer's own <em>Greek Printing Types,</em> which I believe includes a collotype facsimile of the 1492 Macrobius type.]</p>
      <p>At the advent of printing in Greek, the script had evolved, from the uncial writing of the late classical period, a formal and a cursive hand. In this it was no different from the Latin script or the Hebrew script. These were all mature writing systems with strong literary traditions, a professional scribal class, and extensive manuscript book publishing. The two script styles are understandable in terms of speed, as I have written elsewhere on Typophile in discussion of the origins of the roman/italic distinction. The formal book hand is written slowly, the letters are upright and have broad proportions. The cursive hand is written quickly, the letters are slanted and compressed; the slant and the compression are both aspects of the speed. As with Latin and Hebrew, the formal hand tended to be reserved for larger scale and prestige volumes; the cursive style was used in the manuscript equivalent of pocket books. [Again this is exactly the same distinction that exists in Latin books of the same period, and as Aldus adopted the cursive, italic style for his popular small format Latin and Italian books, so he adopted the Greek cursive style for comparable volumes in that language. Many commentators on Aldus' type and books completely overlook the manuscript publishing context, and make ludicrous claims about Aldus' invention of the small format book and the use of italic types for space-saving efficiency. This is all nonsense: he was producing books to an existing popular format and using types modelled on the cursive hands employed in those books.]</p>
      <p>Anyway, getting back to the Greek formal book hand...</p>
      <p>Here is an earlier (10th century) example showing the upright, broadly proportioned letters of this style, which pre-Aldine printers adopted and to which Robert Proctor returned not very succesfully in the 19th century, and which Scholderer revived with much more success in the 1920s.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FormGrekBkHnd.jpg"></div><p></p>
      <p>-<br>
      The simplification that is found in the early printed versions of this hand, such as the Macrobius or Complutensian types, is in the abandonment of the connecting strokes. But the broadly proportioned, largely monoline letters can be directly traced back to such manuscripts and forward to Scholderer's New Hellenic. This is where it comes from: from the heart of Byzantine literary culture of the Middle Ages, transplanted to Italy after the fall of Constantinople, and cut into types and printed there (with the direct involvement of Greek immigrants, as superbly documented in Konstantinos Staikos' excellent <em>Charta of Greek Printing.</em>)</p>
      <p>By the way, the GFS commentary on their Neohellenic fonts confirms the origin of the 'bland' Ksi and Omega about which Petri began this discussion: 'The type, since to 1930’s, was also well received in Greece, albeit with a different design for Ξ and Ω.' As I suspected, Monotype changed the form of these letters to market the typeface more successfully in Greece.</p>
