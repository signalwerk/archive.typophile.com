      <p>&gt; Scholderer’s New Hellenic looks anything but Latinised in comparison.</p>
      <p>First of all, I've been talking about a single letter (or two).<br>
      The stuff Monotype had the sense to change. But anyway,<br>
      I never said the font as a whole was a flagship of latinization.</p>
      <p>&gt; I have heard people mistakenly identify it as being<br>
      &gt; based on early Attic inscriptional lettering.</p>
      <p>What kind of <cite>people</cite>, exactly?</p>
      <p>&gt; you are the only person I have ever heard try to<br>
      &gt; impose a metaphorical meaning on the term Latinisation</p>
      <p>Metaphorical? It's nothing that fancy. I'm simply talking about things just beyond the literal, such as making Hangul "in-line" (decomposing the syllables and putting the alphabetic component letters in sequential order on the baseline), which is not a glyph-level instance of latinization, but certainly a massively significant case of it (file it under "alphabet envy" :-). A more mainstream example is the increase in x-height in Armenian, Georgian, etc. While you can't put your finger on specific shapes that have become latinized (unlike something like the imposition of full double serifs to Greek, the sort of thing you seem to want to restrict the definition of latinization too) the vertical proportions certain have become latinized, in fact quite consciously (and this is a sledgehammer blow to readability, so quite significant).</p>
      <p>&gt; I am interested in trying to discern what is true</p>
      <p>Well, to me the present is truer than the past.</p>
      <p>Romulus Greek: now THAT was a flagship, in the imperial navy!  :-/</p>
      <p>BTW, a good example of how historicism for its own sake can be used to give false assurance (when it's not being used simply to confuse) is something about Win Crouwel in "Dutch Type". Concerning his famous alphabet, Middendorp quotes him as saying: "So I began researching the past, looking for alternative signs with which I could replace the conventional forms. One could have made them up, but I wanted them to have some kind of footing in the history of type."* Why is it false assurance? Because the result is <cite>still</cite> illegible!  :-/</p>
      <p>* Although in the next paragraph he's quoted as saying about his alphabet: "I think I have always inclined not to bother too much about things that have been developed through tradition". WhatEVER.</p>
      <p>hhp</p>
