    html: <p>For what it's worth, the zig-zag Xi and cursive Omega are, along with lunate Sigma, the standard shapes in later ancient inscriptions (from about the second or first century BC until the making of inscriptions pretty much died out around the end of the sixth century AD). These shapes might appear odd to a modern Greek, who would be accustomed to the earlier letter forms, but perhaps Scholderer thought they fit better with the Byzantine lower-case.</p>
