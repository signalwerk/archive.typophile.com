      <p><em>To me, the important, the useful definition of something is always in the practical sphere. In the context of historical precedent Scholderer’s design might be totally, or at least sufficiently, authentic; but in the context of the user, of what the user knows, of what the user has seen and will continue to see, it is clearly latinization.</em></p>
      <p>In the first place, I simply don't believe that anyone except you looks at Scholderer's New Hellenic type that way. Given the massive amount of actual Latinisation of the Greek script evident all over Greece on every street, Scholderer's New Hellenic looks anything but Latinised in comparison. I have heard people mistakenly identify it as being based on early Attic inscriptional lettering. If anything, it probably looks kind of old fashioned to a modern Greek reader. In the second place, you are the only person I have ever heard try to impose a metaphorical meaning on the term Latinisation, and I'm afraid you don't get to decide what it means either.</p>
      <p>What <em>is</em> a 'non-literal' meaning of Latinisation? If you mean simplification, or 'certain kinds of simplification', then say simplification, because you can't equate Latinisation with simplification because Latinisation can, and often does, involve formal complication e.g. through the application of serifs or the imposition of a broad-nib translation ductus to historically monolinear forms. It seems to me, based on previous discussions, that you probably want to form an equivalance of modernism = westernisation = simplification = latinisation. Sorry, but I think <em>that</em> is itself a gross simplification, and I simply refuse to use the term in that way.</p>
      <p>This is what I mean by Latinisation: the application of characteristics of Latin typographic design to other scripts. It is a real problem, and I don't see any benefit to muddying and weakening the identification of that problem through invention of non-literal meanings.</p>
      <p>Yes, I am interested in history, because I am interested in trying to discern what is true, rather than relying on perceptions born of ignorance and analogy. I have explained why Scholderer's New Hellenic is the way it is, and the role of the history of Greek manuscript and early printed forms in its development. I don't see any value in supposing a general perception of the design as Latinised, when actual Latinisation of the Greek script is so blatant and unmistakeable and clearly of a different class from anything in Scholderer's design.</p>
