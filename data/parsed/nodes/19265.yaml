      <p><em>Unfortunately Victor Scholderer’s authentic lowercase zeta and uppercase xi were substituted with somewhat blander designs.</em></p>
      <p>Scholderer's forms are eccentric, so I can quite understand why Monotype chose to employ something more in keeping with the normative form of the Greek letters (although I think the lowercase zeta has a bit too much modulation and the top is very weak, out of keeping with the rest of the design). Scholderer's original design also had an eccentric uppercase Omega based on an enlarged version of the lowercase form. I have little doubt that the more normal/bland replacement forms make the digital version more successful in the Greek market. Note also that Monotype are not alone: the Greek Font Society also replaced the lowercase zeta and uppercase Omega forms in their Neohellenic type, although they kept the zigzag Ksi.</p>
      <p>I would like to see Scholderer's more eccentric forms made available, as stylistic alternates, in OpenType fonts. One wouldn't necessarily want them as default forms, but they would be good to have nonetheless.</p>
