      <p>There is a brief type review concerning the ‘New Hellenic’ in the sixth volume of ‘The Fleuron’ (p. 231). The fount receives high praise from the critic who in the end of the article maintains: “It remains to be said, however, that our general printing still has need of a greek which shall sort agreeably with the romans and italics we are bound to use. We require an upright Caslonised fount which, in use as citations or extract matter, shall be no more conspicuous in the page than is the italic.”<br>
      I suppose one could safely interpret ‘Caslonised’ as ‘Latinised’...</p>
      <p>*   *   *</p>
      <p>Robert Proctor’s ceremonial ‘Otter’ (1903) has the zigzag uppercase xi as well as the hanging lowercase zeta. Mr Scholderer was reportedly an admirer of ‘Otter’ and the fount must have been an important precursor of the ‘New Hellenic’.</p>
      <p>*   *   *</p>
      <p>Hrant: The Heraclitus quote on my profile page can be translated as follows: “The hidden attunement is better than the obvious one.”</p>
