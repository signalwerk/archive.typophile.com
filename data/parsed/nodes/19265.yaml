      <p>I did some digging in the boxes, and although I have not located my copy of Scholderer's <em>Greek Printing Types</em> I did find my copy of Robert Proctor's <em>The Printing of Greek in the 15th Century,</em> the study that inspired both Proctor's own Otter type and Scholderer's New Hellenic. The zigzag uppercase Ξ is hard to trace because it is a relatively uncommon letter (which reminds me that I've been meaning to compile some letter frequency data for Greek). Also, many Greek texts of the period were printed largely without uppercase letters. But below are some images that display the early printed forms of Ξ ζ ξ and other letters that have taken variant forms.</p>
      <p>First, though, what is probably the first instance of obvious Latinisation in the history of Greek type. Note the p-like rho.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GR1.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GR2.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GR3.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GR4.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GR5.jpg"></div><br>
      Above, note hilarious composition error in last work of first line: upsidedown mu as pi and upsidedown pi as mu. Classic!<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GR6.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GR7.jpg"></div><br>
      Above, deeply weird typeface. The earliest use of zigzag form of (lowercase) ksi I have been able to locate so far.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GR8.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GR9.jpg"></div><p></p>
      <p>.</p>
      <p>And finally Proctor's Otter type, in which these historical forms first find modern expression (1903, cut by Miller &amp; Richard):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/GR10.jpg"></div><p></p>
      <p>Scholderer maintained a few of the oddities of the Otter type, but replaced most of them with more 'normal' Greek letters. Monotype carried this process further when manufacturing the New Hellenic design for the Greek market.</p>
