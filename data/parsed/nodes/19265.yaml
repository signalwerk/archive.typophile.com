      <p><cite>Hey, maybe it’s a Canadian thing? You are, after all, exceptionally good at being assimilated by a larger culture while pretending the opposite (at least collectively - exceptions do exist, and are commendable). Really, your license plates should say: “Canada - The Hockey State”. I’m sorry if that hurts your feelings, but as we say in Armenian, “let’s sit crooked but talk straight”.</cite></p>
      <p>You have nothing intelligent to say so you insult my country? An "American thing", to be sure.</p>
      <p>We don't pretend to be protecting our culture. There's no such thing. It may be difficult for an ethno-centric American such as yourself to understand, but in Canada, immigrants are encouraged to keep their culture and language alive. "Canadian" culture is just a bunch of English, French, Scottish, Italian, Jewish, Greek, and other nationalities and their kids and grandkids. I don't understand exactly what you mean by protecting "Canadian culture" (or "American culture", for that matter). Does it mean we should make Iroquois and Inuktitut the official languages? Anyone in North America who is not a Native American is nothing more than an immigrant, and as such has no real right to protect "their" culture.</p>
      <p>My grandfather left the Soviet Union during the Holocaust, fleeing persecution. Since you <strong>insist</strong> on playing Genocide like a poker card, 10 million dead beats 1 million. My grandparents left Italy because they were so poor they lived in a hut and came here to make something of <strong>themselves</strong>; not their "culture". And they did. The language of Dante, sculpture of Michelangelo, countless operas, poems, paintings, and scholarship never did them any good. Their working blue-collar for the city and sewing in a hot factory on St. Lawrence and St. Viater for 70 hours a week is what allows me the privilege of sitting in my nice house and of having this delightful conversation right now, and it affords them the same right. Dante had nothing to do with it.</p>
      <p>Furthermore, beavers, stars and stripes, Mount Ararat, roses, thistle, and leek.. lovely symbols, but what have they done for you? President Kennedy said "Ask not what your country can do for you, but what you can do for your country". Was he high? You don't exist to be subservient to your "nation", it exists to protect and serve <cite>you</cite>.</p>
      <p>Pierre Trudeau, <cite>our</cite> greatest leader, held to an ideal of individual rights (which is why he left the Quebec separatist movement - he found its limitations on freedom of education and freedom of speech in the name of the "nation" unjust). So you see, our lack of any specific culture is in fact quintessentially "Canadian", and it is the amaranthine Canadian quality that is the reason why we will never be "assimilated", as you say.</p>
      <p>Finally, as we say in Larinese, the dialect of my town in Italy (population 7.000 and one of the last places in Italy to fall to Latin Rome):</p>
      <p>"Larino, Larino, la bella citta’; si mangia, si beve, l’amore, si fa."<br>
      <cite>“Larino, Larino, the beautiful town; one eats, one drinks, one makes love”</cite></p>
      <p>And if that isn’t culture, then I don’t know what is.</p>
      <p>In summation, stick to fonts.</p>
      <p>P.S.: As far as your idea that "I don't vote, so I'm not responsible", I offer you another proverb: "Chi tace acconsente" - <cite>"Silence is consent"</cite>. Grow up.</p>
