      <p><em>the excuse for this kind of tampering</em></p>
      <p>By the same token, one could lament the "travesty" of replacing the long "s" in the designs of Caslon, Garamond, Jenson, etc., with the orthodox, later alphabetic form.</p>
      <p>The evolution of the character could also be compared to that of the Cyrillic De, going from triangular to trapezoid.</p>
      <p>As an "early learning" face, there is an argument for orthodoxy/simplicity -- just compare to Gill Sans Schoolbook, with its single-storey "a" and "g".</p>
      <p>But now, there is no reason not to provide "Historical" alternates -- and I understand that this is a feature of OpenType that will soon be supported by Microsoft Word.</p>
      <p>On a related topic, I'm planning to add Greek to Fontesque, which is kind of a challenge, in that your typical Greek serif face already has plenty of irregularity -- so character forms such as Scholderer's that you show here are quite inspirational in pushing things even further.</p>
