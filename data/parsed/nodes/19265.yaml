    html: <p>Hrant, while some of Scholderer's forms are eccentric, I certainly wouldn't classify them as Latinised, in the way that Van Krimpen's Greeks or Gill's Perpetua Greek are. Scholderer was a codicologist, historian of early printing, and curator of the incunabula collection of the British Library, with a solid historical knowledge of Greek letterforms. Van Krimpen and Gill were complete dilettantes by comparison. The New Hellenic type is the most serious and successful modern attempt to create a new design in the style of the pre-Aldine Greek types such as the Greek of the famous Complutensian Bible. Other, more direct attempts at revivals of the Complutensian type have been made (Procter's Otter Greek in the 19th century, and recently <a href="http://www.greekfontsociety.org/pages/en_publications2004_SP.html" rel="nofollow">GFS Complutensian</a> by George Matthiopoulos), but these replicate the unusual characteristics of the original that are, in a modern context, even more eccentric than Scholderer's Ksi, Omega and zeta. None of it is Latinised.</p>
