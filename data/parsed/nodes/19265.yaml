      <p>I'd guess that Sholderer, despite his knowledge of Greek, was uncomfortable with Xi as three disconnected horizontal bars just levitating, which is why he sought a precedent for a more grounded form. Is that a Latinization instinct, to want to ground and regularize shapes? Or is it just moderization? Or is it just him? At any rate, as Gerry Leonidas said in the MSN thread, we should take the work at face value, not "authenticity value", if the designer is making a serious, considered attempt to create a new face.</p>
