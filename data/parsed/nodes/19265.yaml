      <p>I agree with you that Haralambous' New Hellenic beta is not quite right, but in general I'm taken with his advocacy of the double-loop form. And as an alternate of bona fide status in a number of typefaces (unlike Scholderer's oddities), surely it would be acceptable as default in a new design -- as a signature glyph. Also, as CT is promoting the double-loop form to default status in its slanteds, where the vast majority of characters have the same form as the upright, wouldn't this also indicate that the double-loop form has something of a cachet?</p>
