    <p>Dear typophiles,</p>
    <p>Monotype issued a digital version of the ‘New Hellenic’ Greek type in the early 1990s.<br>
    Unfortunately Victor Scholderer’s authentic lowercase zeta and uppercase xi were<br>
    substituted with somewhat blander designs.<br>
    Does anyone know what might have been the excuse for this kind of tampering?<br>
    It seems to me that the original glyphs would be worth digitizing.</p>
    <p>Sincerely,<br>
    P. L.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Xi_zeta.jpg"></div><p></p>
