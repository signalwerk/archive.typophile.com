      <p>Did anyone catch the comment by "Character" [Herbert F. Van Brink] on the Dafont site that Retro Stereo Wide is a "reproduction of the rub-on font 'Circuit Double' produced in the 1980's by Formatt."  Bob Trogman, the original designer of the font,  said in <a href="http://typophile.com/node/76158#comment-438985" title="http://typophile.com/node/76158#comment-438985">http://typophile.com/node/76158#comment-438985</a> that "his original release film font [in 1968 of] Yagi fonts [was] in the Facsimile Font program.  So the original California map could have been produced from rub-on letters by FotoStar, [or perhaps  Letraset]. Which may explain the differences in the 1976 image from Retro Stereo Wide, which may have been based a the 1980's Formatt version.<br>
      Don</p>
    html_clean: |-
