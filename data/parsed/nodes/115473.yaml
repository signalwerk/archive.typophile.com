      <p>Hi Ruyk, stealing type designs goes back at least as far as the invention of electrotyping in the 19th century. About all that is protected in a type design, at least under US and similar laws, is the the computer generated font outlines. Making a new font by recreating from a printed source seems to escape the wrath of copyright infringement. There is an exception for fonts that have design patents. But these expire in a few years. Lots of grey areas and potential for lawyers to get rich -- font designers rarely do :)<br>
      BTW Myfonts is definitely the elephant in the room. If a font is not sold via Myfonts, it generally has very poor market prospects. Only a few large independents -- House, H&amp;FJ etc. -- have been able to succeed as profitable ventures.<br>
      Don</p>
