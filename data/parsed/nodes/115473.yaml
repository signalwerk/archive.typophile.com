    <p>Hello everyone, </p>
    <p>I accidentally found 1976 "Official Caliornia visitor map" scan on Flickr, and would like to know what exactly the main font is (the tri-color upper)? I checked 1977 Letraset font brochure, Linotype website and some retro design websites, but with no results as yet. There's even NO image o that font anywhere else. Kinda strange.</p>
    <p>I'd like to try to find and use this font for my design work, so any help would be appreciated.</p>
    <p>Thank you and best regards.</p><div class="imageWrap"><img src="http://typophile.com/files/3750750324_07c661bd86_o_4867.jpg"></div><p></p>
