      <p>Ryuk - in the Typophile thread you linked to, Robert Trogman said, "I'm glad that it has been revived." I would think that confers legitimacy as much as anything, no?</p>
      <p>In fact, nowhere in Victory Type's font description do they credit Mr. Trogman. You would think if they sought and got permission they would say so. And if they didn't, that almost makes Retro Stereo Wide <em>more</em> legitimate than Asteroid.</p>
      <p>My point is that simply being for sale on MyFonts doesn't always confer that legitimacy (although, as one of the original MyFonts moderators, I can say we have caught and reported more than a few offenders and those fonts were dropped).</p>
