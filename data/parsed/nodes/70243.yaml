      <p><cite>Superpolator looks amazing but seems pretty complex… is it easier to use than it looks?</cite></p>
      <p>Superpolator is incredibly easy. To Fontlab's credit their Multiple Master interface is also very simple. But it has some irritating bugs that can impact your workflow and the nature of multiple master technology limits one's ability to do some cool multi-axis extrapolations that Superpolator does really well.</p>
