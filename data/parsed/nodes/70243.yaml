    html: <p>In FontLab, you can only have beginning and ending masters on any particular axis. You can extrapolate, but that's difficult to control. If you want more than two masters along an axis, you need something like Superpolator.</p>
    html_clean: <p>In FontLab, you can only have beginning and ending masters on any particular axis. You can extrapolate, but that's difficult to control. If you want more than two masters along an axis, you need something like Superpolator.</p>
