    <p>I have a regular-weight font design that I'd like to expand into multiple weights, and I have just dipped my toes into setting up MM axes in FontLab.</p>
    <p>I have successfully figured out how to add a new, bolder master, and I get how generating instances work. I'd also like to experiment with a lighter weight. </p>
    <p>What are best practices for building out multiple masters in both directions like this? Would I set up a different .vfb starting from my regular and do all of my lighter-than-regular work in that second file? Am I right in concluding that I can't set up three masters for one axis in one Fontlab file (where it would interpolate between Wt0 and Wt1 until past Wt1, and then it would switch to interpolating between Wt1 and Wt2)?</p>
