    html: |-
      <p>MetricsMachine is very good. I find it makes me more thorough and systematic than when I do kerning in FontLab. If you do use it, it's pretty much an all or nothing deal. You can't very easily do some of your kerning in FontLab and some in MetricsMachine. </p>
      <p>From MetricsMachine, you can export either to a feature file or an afm file. In the latter case, the kerning is expanded to simple pairs, rather than classes, and the number of pairs can be quite large. If you export a feature file (which makes more sense usually), you just copy and paste this into the OT editor in FontLab. There's no kern table and you completely bypass FontLab's class definition system, etc. There is also no need to worry about "key" glyphs (which are a FontLab thing, not an OT thing). Once you have the kern feature in FontLab, the only way you can see the kerning in FontLab is in the OpenType Features Preview panel.</p>
      <p>It's a very powerful app designed to do one thing really well--manual kerning. Some features I haven't even tried yet (like "transformations").</p>
