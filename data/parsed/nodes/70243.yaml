    html: <p>Although, there is sort of a workaround for FontLab. If you add a second axis, you can go from, say, light to regular along one axis and from bold to regular in the other. In order for this to work, you need to duplicate the "regular" master in both axes, which means you will "waste" a master and also have to make sure to repeat any changes you make in the duplicated master. It really gets to be impractical if you want to add, say, a width axis on top of this. Superpolator is much more flexible for working with interpolation.</p>
