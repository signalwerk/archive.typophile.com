    html: |-
      <p>Workflow with Superpolator is based on .ufo, which is an xml-based exchange format for font development. You get the fonts in and out of FontLab using Python scripts (which are included with RoboFab tools and/or Prepolator). </p>
      <p>If you have both FontLab and Superpolator running at the same time, when you update the .ufo from FontLab, it automatically is reflected in Superpolator. (This is also true of Prepolator.) You can also update, from within FontLab, glyphs that have been changed in the .ufo or import .ufo's generated by Superpolator or whatever.</p>
      <p>The only major problem is that reading and writing fonts to .ufo can be a bit slow, especially when you need to do a whole font with hundreds of glyphs, since it's done with interpreted Python within FontLab.</p>
      <p>My understanding is that the new version of FontLab (coming soon, I hope) will natively support .ufo, which should make working with external .ufo-based tools much smoother.</p>
