    <p>Friends of mine, one of whom is of Sri Lankan ancestry, have asked me to help them design their wedding materials. They'd like to use the Sinhalese word for "love" as part of their imagery. This is an image of the word she sent me:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/love.jpg"></div><p></p>
    <p>I'm basically wondering how much leeway I have in redoing this lettering, which I feel is kind of cold. I searched and found links to many different Sinhala fonts, so it appears I have as much freedom as I would with Western lettering, but not knowing anything about Sri Lankan culture, I just want to make sure I'm not being disrespectful by going too far one way or another.</p>
    <p>So...anyone know any Sinhala lettering pitfalls I should avoid?</p>
    <p>Below: a sampling of Sinhala fonts I found on one site, for reference:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sinhalafonts.jpg"></div><p></p>
