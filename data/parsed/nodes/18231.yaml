      <p>The first trick will be to identify the appropriate style of lettering to use in the context of a wedding invitation, typically a classy but conservative genre. In the example you show, the style used in the Green text probably has most promise.</p>
      <p>The second trick, if you plan to draw the lettering yourself, is knowing what form each letter takes within the particular style, and avoiding ignorantly mixing characteristics of different styles. Your best bet is to follow a model quite precisely, only making proportional adjustments to weight or height/width.</p>
