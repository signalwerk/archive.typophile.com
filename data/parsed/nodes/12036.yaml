    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/31465" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Writers</a>&nbsp;: Stephen&nbsp;Coles</strong></p>
    <p>Stephen Coles is co-editor of <a href="/node/12035" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typographica</a> and works for <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a> out of their San Francisco&nbsp;office.</p>
    <p>He was the State of Utah’s junior birdcall champion in 1987, and remains the Guinness Book of World Records’ recordholder for longest uninterrupted beatbox: 4 hours and 12&nbsp;minutes.</p>
    <p>He enjoys monkeybread, camping and&nbsp;kittens.</p>
    <p>He once ate 22 hard-boiled eggs in a single&nbsp;sitting.</p>
