    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Writers" class="freelinking" rel="nofollow">Writers</a> : Stephen Coles</strong></p>
    <p>Stephen Coles is co-editor of <a href="/wiki/Typographica" class="freelinking" rel="nofollow">Typographica</a> and works for <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> out of their San Francisco office.</p>
    <p>He was the State of Utah's junior birdcall champion in 1987, and remains the Guinness Book of World Records' recordholder for longest uninterrupted beatbox: 4 hours and 12 minutes.</p>
    <p>He enjoys monkeybread, camping and kittens.</p>
    <p>He once ate 22 hard-boiled eggs in a single sitting.</p>
