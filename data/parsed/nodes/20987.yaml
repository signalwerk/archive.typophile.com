      <p>jacopo,<br>
      "Now of course the more I look at them and the more my eyes get used so that feeling might just be something to do not take in consideration."</p>
      <p>All of these things we see in type are "illusions" but that is the visual world we live in as designers. Some illusions are transient or are only affected in some rare glyph combinations and perhaps are not an issue.  Others may come into play often and need a correction--sometimes this is just a kern and sometimes a redraw is required.  The difficulty with a new typeface is that it has not settled yet in the viewers eyes and subsequent viewings may erase the problematic vision. I don't know if this is the case so we will let it percolate a bit longer :-)</p>
      <p>This may well turn out to be a viable text face at the lighter weights. First I have to battle this weight through and hope you will help with comments on progress of all coming weights.</p>
      <p>ChrisL</p>
