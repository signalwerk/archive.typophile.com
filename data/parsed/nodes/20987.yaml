    votes: null
    html: |-
      <p>Hi Chris. I like the new 'y' better. But the 'v' and 'w' are still problems. To me because of the bent right diagonals they look like italic characters mistakenly dropped into a roman font. If you compare Souvenir, where he has bent diagonals, he bends both sides in the roman and carries it throughout the face, caps and lc alike, except for the z. </p>
      <p>Here I think the v and w might work with just straight right sides like the y, or with your rounded corner serifs, this time turned outward to the right. Even with this the face will have lots of soft features, and will keep its overall look I think. </p>
      <p>On the caps, my feeling is that there are too many serifs. The most successful semi-serif caps I think are Rotis Semi-Serif's and he just put one top left serif on everything. Somehow it works in combination with other caps or lc. It seems to be quite widely used. The only problem is the M. To me the top right vertex looks painfully chopped  off in Rotis semi-serif, and even more so here. So I would try adding a serif there--against what I am saying otherwise. Or if you don't, in any case the right stem of the M can be lightened with benefit I suspect.  </p>
      <p>The unique look of this face is that it manages to be soft but clean looking. Cooper Black is soft but not as clean. Sauna has something of it, but is more soft, with a lot of italic details. Here you have more sharpness. </p>
      <p>Anyway, this I think is a unique look that still can be very usable--something not easy to achieve, but you're almost there, I think. Very impressive!</p>
      <p>But I think it needs more consistency and a little more restraint to really become itself. Dr. Berkson's prescription: take two MFB (Morris Fuller Benton) pills and they will do wonders for you :)</p>
