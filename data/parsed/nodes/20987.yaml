      <p>&gt;&gt;asymmetrical treatment</p>
      <p>I think you can do asymmetrical, like the y you did. My problem is not so much with asymmetrical as with consistency. You don't have the bent right diagonal in the kxyz, nor any of the caps (though you can follow somewhat different rules there). That's why it sticks out to my eyes. (by the way, I think the x with the two squiggles is too fussy and needs to be simplified.)</p>
      <p>I pointed to MF Benton, because he took totally different styles like Broadway and Franklin Gothic and identified and carried through their logic with beautiful consistency and even color.</p>
      <p>On the caps, like everything else, you can of course do anything you can pull off. Rotis semi-serif (not the semi-sans) is not geometric though not as modulated as much as Froggy. I was just pointing to it as one of the few successful semi-serifs to ponder. </p>
      <p>Thinking about it further, I think the problem for my eyes with a lot of semi-serifs is that going half way, like on the current Froggy H, makes characters look mutilated to me. </p>
      <p>I think you could also go the other way on the caps: eg put small serifs on everything in the Caps except the thin strokes--you are almost there in your current version anyway. Or some variation, but with just leaving a few serifs discretely off, so the absence of them does not shout at you.  </p>
      <p>Overall, I think there is a danger in trying to do too many things in one typeface. You have achieved a really nice distinctive look with your lower case, and I think the 'Benton pills' would make you just create good caps that work with it, and not try to be too innovative on the caps. After all, Benton was going to do over 100 faces--and you are so full of interesting ideas, you just might as well!</p>
