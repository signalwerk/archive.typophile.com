      <p>&gt;I don’t want it to be just the typical treatment</p>
      <p>Christian Schwartz said something very thought provoking to me at Typecon last year: "You have to resist the temptation to put too much of yourself into a typeface." By that I think he meant that the face has to  become itself, with its own nature. Like a child, it needs to be respected as having its own character, and the designer needs to work to realize that nature to the maximum. Once you have some basic ideas, it starts to have its own rules and nature, and resists you doing what *you* want. </p>
      <p>So I am not against wanting to make any particular bit innovative. But I think that past a certain point making innovation a top priority can get in the way. Here you already have a concept that is really strong, which is an achievment. From my point of view, your challenge now is just to realize the concept most fully and effectively. I think if you *at this point* forget about being innovative and just be a servant of the typeface, it will end up with a very distinctive look anyway, and may be more effectively realized. </p>
      <p>Interestingly, a typeface becomes *you* even when you consciously avoid it. Goudy argued against being personal in type, and throught we was not being personal. But of course almost everything of his came out shouting 'Goudy'.</p>
    html_clean: |-
