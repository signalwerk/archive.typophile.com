    html: <p>Chris, sorry i haven't been able to get to this sooner, but you've come a long way!!! I looked at an earlier PDF, but i didn't have time to give it full attention till now. I like the new caps, the lower serif on the L bothers me most -- it feels like a mistake to me. The tail of the Q feels like it was broken -- like the O portion fell on it and it got squooshed. Do i see a rubby slipper on that foot sticking out from underneath? &gt;^p i also think the top of the c and the arm on the r should have the same treatment. i prefer the r with the smooth inner counter. smoothing out the c would also allow you to smooth out the e, which looks funny to me with that crick the way it is now. the s and e feel too wide, as does the v. i liked the old w construction better, it was just a bit wobbly before. the new w construction jumps out at me as you try to read text. is the tail on the eszett shorter than on the f? if so, why? the cedilla looks a bit alien to this face to me. your best characters imo are the g and r. the caps are very solid too. the lc just needs some quirks worked out to bring it all into harmony. keep up the good work!</p>
