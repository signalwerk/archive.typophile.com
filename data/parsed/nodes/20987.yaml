      <p>I have to tell you, Chris, the "f" and "r" characters are just so beautiful - they really sing. There is something about the shapes of the counters that make the counterspace just as interesting as the actual glyphs.</p>
      <p>Although I love the slant of the "y", it doesn't seem to be playing nicely with the other letters. As William mentioned, it sticks out far too much. The "f" seems to have a bit of a funny slant to it as well - ever so slight, but noticeable in the smaller size. </p>
      <p>This is a font on my "Must Have" list, Chris - elegant and different - inspirational!</p>
