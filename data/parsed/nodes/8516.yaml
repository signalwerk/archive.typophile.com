    html: '<p>Andrew Leman has a digital version of Typo Script that he made for the H.P. Lovecraft Historical Society. Here is the sample I have in the Script Guide: <br><img src="http://www.typophile.com/forums/messages/83/57408.gif" alt="Typo Script sample"> <br> <br>He has a nice package of antique fonts that he created as props. You can locate them by searching for HPLHS or using this link to his <a href="http://www.cthulhulives.org/toybox/PROPDOCS/PropFonts.html" target="_blank">font page</a> for them.</p>'
