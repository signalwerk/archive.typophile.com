    html: <p>I think the script is probably a small size of the ATF metal face Typo Script which doesn't seem to be available in digital format. A close alternative would be <a href="http://www.myfonts.com/fonts/linotype/palace-script/mt-semi-bold/testdrive.html?s=Given+at+Livon+This&amp;p=72" target="_blank">Palace Script</a>. <br> <br>For the typewriter font, check out the <a href="http://www.vintagetype.com/vintagetypewriter/" target="_blank">Vintage Typewriter</a> collection.</p>
