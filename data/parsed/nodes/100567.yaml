      <p>My thought is that it would not make for a smooth reading experience because people haven't been trained to read that way so it would take quite a bit of exposure -- and retraining -- to get them used to it. That shouldn't be taken to mean I think it would not work or that it shouldn't be done. </p>
      <p>A good way to find out would be to actually make such a font or a small family, then perhaps have a study done by researchers or scientists to validate the merits of such an approach.</p>
