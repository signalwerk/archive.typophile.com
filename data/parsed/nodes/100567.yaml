    html: <p>Many fonts have contextual alternates, mostly to avoid unsightly collisions. A recent success is Ernestine, which makes pairs like rv, rw, ry look better by trimming the left serif of the latter glyph so that the bodies can be moved closer together. But you need to keep in mind that the different spaces between letters can be a big part of what facilitates reading. Quickly differentiating letter shapes is important to reading, and just like ascenders and descenders help the reader recognize word shapes, so do things like the space in the lower right of the r.</p>
