    <p>I want to know what people think about contextual variants, as seen in arabic, in latin scripts. I am trying to design a typeface that consists of different letterforms according to their context. In otherwords, an a would look different depending if it was interacting with an a straight edge letterform, a curved letterform etc... My hypothesis is that if we can eliminate some of the unnecessary positive and negative space between letters, we can facilitate a more comfortable reading experience. I was wondering if people had any insight? resources that I might consider looking into? Or any examples where this has already been done. </p>
    <p>thanks!</p>
