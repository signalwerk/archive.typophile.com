      <p>This is an idea I have played around with, aiming to regularise the shape of smaller white areas between terminals and adjacent shapes.  I sometimes find the angularity of triangular shapes that occur when oblique terminals are adjacent to vertical stems, or vertical terminals are adjacent to curves, visually distracting. I've no idea whether his has any impact on readability, and am not claiming this design approach as aiding reading. I just wanted to explore the potential for producing a more even pattern of white space between the letters. Obviously, this approach is primarily relevent for sans serif types, and perhaps more so for display settings than for text (where the particular white space areas may be too small to have significant impact).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cochin_3732.png"></div><p></p>
