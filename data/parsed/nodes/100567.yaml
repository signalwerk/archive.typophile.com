      <p><cite>an a would look different depending if it was interacting with an a straight edge letterform</cite></p>
      <p>But an a is read, because it looks like an a. How would different a shapes be an improvement? Connected scripts have different letter shapes to facilitate the connections itself, not to improve the legibility of the single letter (I think). I am not convinced that structurally different shapes as contextual alternatives or forced ligatures (people have tried this before) can be an improvement for Latin.<br>
      At least this is how I understand your approach. Small corrections for certain letter combinations are already getting more and more common in modern OpenType fonts. </p>
      <p>But maybe you can create some sketches of that approach first? Would probably be easier to talk about it, if we can actually see and read it ourselves.</p>
