      <p>I agree with Ralf.<br>
      About Vesper, from my essay <a href="http://ilovetypography.com/2011/04/01/engaging-contextuality/" rel="nofollow">Engaging contextuality</a> at I Love Typography:</p>
      <blockquote><p>Rob Keller’s Vesper (2009) has pushed the envelope furthest in using a large set of alternates to improve the fit of text type. By retracting or extending serifs, clashes and gaps are smoothed away. This is extremely practical in many character combinations, but as with kerning one wonders at what point the effect becomes counterproductive, and where the threshold is between smooth and bland. The question arises of whether such a process might dilute the personality of a typeface—or disguise its faults—and more profoundly, to what extent does the physiological process of reading type depend on consistency of letterform? Vesper raises these questions, but one theoretical typeface cannot provide the answer. Don’t ever expect a categoric decision, the best one can hope for is a consensus derived from practical experience with this and other types, yet to be designed, which implement contextuality as a readability strategy.</p></blockquote>
      <p>Being even more discriminating, I would say that if the principle of improved readability through profuse contextuality is to be proven useful, it’s not enough just to implement it and say problem solved (which has been the case with all those godawful-looking types for dyslexics), it has to actually be a type design, and designed brilliantly enough to be a game changer, a genre spawner. Like Jenson, Baskerville, Futura and Frutiger. That’s a tall order. Go for it.</p>
