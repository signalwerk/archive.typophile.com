      <p>@Nick Shinn:<br>
      <cite>That’s a tall order. Go for it.</cite></p>
      <p>Oh, indeed. But to simply design a typeface in which this feature is present, and where it turns out to be unobtrusive, and at least not impair readability, is a first step that should not be dismissed as worthless.</p>
      <p>The example shown of changing the shape of the letter "c" shows that the benefit to be expected from this is the same as that from good kerning - a more even color of the text.</p>
      <p>People have lived with typographical methods that permitted essentially no kerning, from which we can conclude the effect of good kerning is subtle. Sometimes, <em>doing it right</em> is its own reward, and designing types as they should be designed won't have enough of an impact to bring one fame and fortune - or even significant recognition from one's peers.</p>
