      <p>I don't mean to offend, but it's pretty illegible.  The O looks like a G; the L looks like a K; the K looks like an arrow, and the floating part made me wonder if it was a lower-case i.  Only the D is easily recognizable as a D, although you might get away with the S if everything else were more clear.  As it is, when I first looked at it, I thought it said GKdSiKGGK.  It took a bit of effort to decipher.</p>
      <p>If I didn't have to read it, though, I'd say it looks nice.</p>
      <p>Hope that helps.</p>
    html_clean: |-
