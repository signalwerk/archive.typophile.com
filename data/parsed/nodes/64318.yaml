      <p>I got about 20 different pages of surprise me. You really gotta keep on clicking, because it's not really random. They hide pages in there. Literally, click like 50+ times to see all of them.</p>
      <p>If you want conventional grids, start with Making and Breaking the Grid or Grid Systems by Muller-Brockmann.</p>
      <p>The Elam books are more about showing the wide range of possibilities (applicable to publishing, as well as fine art).</p>
      <p>If you need to find specific advice for a specific project, you should look to contemporary, real-world examples.</p>
      <p>Is there a specific project you need a grid for?</p>
