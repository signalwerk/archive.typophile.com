      <p>I would break the URL and NOT use a dash or hyphen, then surround it in some sort of bracket. I believe WIRED used to use &lt;&gt;. So, you'd have:</p>
      <p>visit the long crazy URL company at &lt; <a href="http://www.thisisourcrazylongurl.com/keep/" title="www.thisisourcrazylongurl.com/keep/">www.thisisourcrazylongurl.com/keep/</a><br>
      going/this/is/really/long.php?crazyQuerystring=939283849392837474&amp;923930<br>
      3939498382930949483 &gt;</p>
      <p>All that said, you may want to suggest they don't bother with this. A few arguments:</p>
      <p> - Long URLs in print will never be typed in by hand. People are lazy<br>
       - they are ugly and hard to typeset<br>
       - the longer the URL, the more likely it's going to a very specific<br>
         page/bit of data on the site and the more likely it's going to<br>
         rot than a shorter url.</p>
      <p>For instance, this URL:</p>
      <p><a href="http://www.ourcompany.com/products/fancy-yellow-hammer" title="www.ourcompany.com/products/fancy-yellow-hammer">www.ourcompany.com/products/fancy-yellow-hammer</a> </p>
      <p>is more likely to rot faster than:</p>
      <p><a href="http://www.ourcompany.com/products/" title="www.ourcompany.com/products/">www.ourcompany.com/products/</a></p>
      <p>which is more likely to rot faster than:</p>
      <p><a href="http://www.ourcompany.com" title="www.ourcompany.com">www.ourcompany.com</a></p>
      <p>So, if linking to fancy yellow hammers, in print, I'd suggest they use:</p>
      <p>visit the products section of our web site at &lt; <a href="http://www.ourcompany.com" title="www.ourcompany.com">www.ourcompany.com</a> &gt; to find our selection of hammers.</p>
