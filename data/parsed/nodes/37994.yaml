      <p>A lot of this advice really isn’t correct.</p>
      <ul>
      <li>Do not attempt to use delimiters, especially less-than or greater-than, except in the easily avoided circumstance where readers cannot tell if ending or surrounding punctuation is part of the URL. A subtle font change (does not have to be monospaced; I don't see how italic really works) is adequate in most cases. People do not understand that delimiters are for <em>E-mail programs</em> so that URLs are not broken and become clickable. Even if you had to use delimiters, they wouldn’t be actual less-than/greater-than characters but set delimiters from math (easily available in the Symbol font).</li>
      <li>Test every URL without www. If it works (some servers are misconfigured and it won’t), then do not use <a href="http://www" title="http://www">http://www</a> in the printed URL.</li>
      <li>Do not use a TinyURL-like service. Do <em>not</em>. You are entrusting the validity of the URL to a third-party service. When TinyURL (or equivalent) goes tits-up, there will never be a way for the reader to locate the original URL.</li>
      <li>Experience has shown – ask <a href="http://adactio.com" rel="nofollow">Jeremy Keith</a> about this – that the right way to go is to either maintain a list of URLs on your site or maintain a list of URL <em>aliases</em> on your site that you can update if the destination URL changes. Of course the destination is not your responsibility, but for the presumed lifetime of the book you might want to make that effort. For example, <a href="http://typophile.com/node/37994" title="http://typophile.com/node/37994">http://typophile.com/node/37994</a> could be listed as mybook.org/howtolink which, when typed into a browser, sends you straight to <a href="http://typophile.com/node/37994" title="http://typophile.com/node/37994">http://typophile.com/node/37994</a> by a Redirect 301 command.</li>
      <li>Break <em>before</em> a dot, not after. Yes, this puts a dot at the beginning of a line. It also eliminates ambiguity. Certainly break after slashes. Those locations are perfect for optional-return characters, available since WordPerfect 5.1, present in DTP programs, and almost completely unused.</li>
      <li>Use a character style for URLs. I would do an onscreen check of every paragraph containing that style before going to press. You never know what kind of linebreaks are gonna happen, and the wrong kind are always gonna happen at the last minute.</li>
      <li> Try to avoid hyphens at all; if you look around you’ll find they're rare. A bigger issue, undiscussed here, is shitty Microsoft or CMS URLs that are a mile long and contain a dozen parameters and arguments separated by ampersands. Do you really think those URLs are going to last? If so, should you even publish them?</li>
      </ul>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
