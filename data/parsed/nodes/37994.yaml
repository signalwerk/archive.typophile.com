  html: <p>I'm typesetting a book that contains urls - some of them are really long. Both Quark and InDesign default not to break the names, which results in some mighty bad word spacing. Does anybody know the protocol with this? It would look much better to break them but would that confuse people - make them think there's a hyphen in the url? I just ran into this problem while reading the NYTimes - they don't break the url, but they also are not known for their typesetting finesse either (lots of widows &amp; orphans). The problem is particularly glaring in justified type.</p>
