      <p>Where I work we are also very fond of using long URLs and usually smack in the middle of a paragraph. </p>
      <p>I break them after a slash, and work with the paragraph rag and hyphenation to make it as painless as possible. I'm also in the position to lightly re-word on occasion, which helps. I sometimes also italicize the URL, which I find helps distinguish it from the rest of the text.</p>
      <p>I feel your pain. If it were up to me all of the URLs would be at the end of the paragraph with no introduction. (Who really needs to read "Please visit our web site at:" to figure out what they're supposed to do?)</p>
      <p>Just my 2 cents.</p>
