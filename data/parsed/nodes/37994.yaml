      <p><cite>Does anybody know the protocol with this?</cite></p>
      <p>Hypertext transport, usually -- but not always. Do not omit the <cite>http://</cite> prefix; it is an indispensable part of the URL, and not at all superfluous.</p>
      <p>(Yes, I know you meant something else by "protocol", but this is relevant anyway.)</p>
