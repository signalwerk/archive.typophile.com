      <p>The rules I think make sense (and I believe this is close to CMS) for breaking long URLs:</p>
      <p>1. Never use a hyphen to indicate a break<br>
      2. Never break directly after a hyphen as it creates ambiguity<br>
      3. Send anything that could be construed as terminal punctuation to the next line (. ! ?)<br>
      4. Break directly after all other analphabetics</p>
