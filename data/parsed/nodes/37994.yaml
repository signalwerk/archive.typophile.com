      <p>^ ugh. The forum automatically puts URLs on their own lines, but I think the point comes across.</p>
      <p>Perhaps a better option/best compromise would be to footnote all of the URLs.</p>
      <p>The nice thing about it is that the first link in the footnotes could go to a page that the author maintains:</p>
      <p><a href="http://www.publisher.com/thebook/links" title="www.publisher.com/thebook/links">www.publisher.com/thebook/links</a></p>
      <p>That way a reader of the book can go right to that page and access all the URLs referenced in the publication. A bonus to the reader, if the author is willing, is that those links can be updated as needed.</p>
