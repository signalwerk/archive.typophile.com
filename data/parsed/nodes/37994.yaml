    html: |-
      <p>"People do not understand that delimiters are for E-mail programs so that URLs are not broken and become clickable."</p>
      <p>I understood that...merely pointing out that WIRED, IIRC, started that technique in print eons ago. Not that that makes it right, but WIRED is one of the first publications to have web savvy style guides.</p>
      <p>The main reason to have a delimiter in print is to avoid the punctuation at the end of a sentence. The alternative would be to never end a sentence with a URL.</p>
      <p>Personally, though, the more I think about this, the more I think I'd prefer footnoting the URLs if at all possible.</p>
      <p>"Try to avoid hyphens at all; if you look around you’ll find they’re rare."</p>
      <p>They're increasingly common in URLs as people jump on the SEO bandwagon. Wordpress, for instance, uses hyphens in most of its URLs.</p>
      <p>"Hypertext transport, usually — but not always. Do not omit the http:// prefix; it is an indispensable part of the URL, and not at all superfluous."</p>
      <p>while true, I'm not aware of any web browser that doesn't, by default, assume an HTTP protocol.</p>
