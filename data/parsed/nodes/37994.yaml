      <p>I think that one of the problems with breaking URLs is when it's done in a digital document. I've noticed some in browsers, if you cut and paste a URL that's broken, sometimes you get garbage inserted into the ULR, like a space character reference: %20, inserted in the middle of the URL.</p>
      <p>If the document is only for printing, you don't have to worry about this, so it's less of an issue.</p>
      <p>jason C</p>
