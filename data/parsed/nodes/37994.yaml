      <p>Patty - I ran into this problem in the magazine. I came up with some different ways of handling it. One was to stick them all in a "sidebar," with an explanation of each of them being long make sure you get all the right characters. Another time, when they appeared in the article - I broke the paragraph and gave each one it's own line. </p>
      <p>When they are written into the text, I do edit the lines so they are not at the end of the sentence (I don't like giving a period after .com.) and hopefully edit it carefully enough that the long site address is on a line by itself.</p>
      <p>If I am working on a manuscript for a client, I grab their editor and say "EDIT." It does work when everyone's goal is to have a nice piece.</p>
      <p>Good luck. Let us know how it worked out.</p>
