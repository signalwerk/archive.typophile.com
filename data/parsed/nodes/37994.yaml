      <p>I totally agree with Darrel and Eric. Break up a long url but do not use dashes. You may want to enclose the url or set the url in <em>italics.</em></p>
      <p>Two other ideas:<br>
      * Leave off the http:// to save yourself 7 characters, or even the www. as in Google.com.<br>
      * Try using SnipUrl.com, NotLong.com, or TinyUrl.com to shorten monsterously long addresses. SnipUrl also gives registered users the option of selecting their own keyword instead of the default alpha-numeric value. E.g., these two take you to the same place:<br>
      <a href="http://snurl.com/parsi" title="http://snurl.com/parsi">http://snurl.com/parsi</a><br>
      <a href="http://www.tomdispatch.com/post/174838/peter_galbraith_the_iranian_conundrum" title="http://www.tomdispatch.com/post/174838/peter_galbraith_the_iranian_conundrum">http://www.tomdispatch.com/post/174838/peter_galbraith_the_iranian_conun...</a></p>
      <p>I do a newsletter and run into this all the time. I prefer to break after logical groupings or split words where they would normally be hyphenated. I also think it's best not to split after periods, hyphens, or underscores (as Eric said) so readers don't think that's the end of a sentence or part of the URL.</p>
