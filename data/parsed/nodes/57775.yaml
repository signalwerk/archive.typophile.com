    html: "<p>Are you sure you want a shorter x-height for body? I assume you mean larger. In that case: <a href=\"http://www.fontshop.com/fonts/downloads/mark_simonson/proxima_nova/\" rel=\"nofollow\">Proxima Nova</a>. Note that there is a <a href=\"http://www.fontshop.com/fonts/singles/mark_simonson/proxima_nova_regular/?&amp;sample_text=See%20alternate%20%E2%80%98a%E2%80%99%20below.&amp;acs_pt=36&amp;acs_ss=15\" rel=\"nofollow\">single-story Futura style 'a'</a>.</p>"
