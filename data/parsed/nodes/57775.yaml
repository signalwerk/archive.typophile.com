  html: <p>our company has been using futura for their branding. so far it's been used in some pieces as the display AND the body font. i'm putting together some new materials with heavy text and am looking into using futura as only the display font. i need some good suggestions on body fonts that will work well - or perhaps even mimic futura but with a shorter x-height? open to any input or inspiration!</p>
