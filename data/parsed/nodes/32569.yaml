    html: |-
      <p>Weight:</p>
      <p>3… = Thin weight<br>
      4… = Light weight<br>
      5… = Normal weight<br>
      6… = Bold weight<br>
      7… = Black weight<br>
      8… = Extra Black weight</p>
      <p>Width:</p>
      <p>…3 = Expanded width<br>
      …5 = Normal width<br>
      …6 = Normal Oblique width<br>
      …7 = Condensed width<br>
      …8 = Condensed Oblique width<br>
      …9 = Ultra Condensed width</p>
