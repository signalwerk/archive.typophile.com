      <p>&gt;You don’t have to be Swiss or German to understand it, but it helps.</p>
      <p>I should note that Adrian Frutiger, although Swiss himself, designed Univers for a French type foundry. They released it, and must have though the numbering system pretty hot. If I recall correctly, it was only in England were the numbering system met with stiff resistance.</p>
      <p>&gt;Dan, I liked the old Univers. Am I going to burn for saying that out loud? ;^)</p>
      <p>Of course not! The "old" version is available for licensing, too. Just like Helvetica vs. Neue Helvetica, there is Univers and Linotype Univers to choose from. Just remember that Linotype Univers was made at Frutiger's own behest (and he participated in its development), as he wasn't happy with Univers' transition to digital ;-)</p>
