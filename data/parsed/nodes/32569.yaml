    <p>Hello<br>
    I am trying to use and employer's collection of Univers. There are about 30 different individual files, varying by weight and width. Unfortunately they have numbers instead of names ("Univers 57") and I can't really tell which goes with what in regard to the width. There seems to be at least 4 widths of fairly subtle differences (although I'm sure people on here could tell the difference without much problem.)<br>
    Why would these be numbered instead of named? Is there some logic to the numbering system I'm not getting? The numbers start at 39 and go up to 86, but there are many missing numbers along the way. Does anyone know of a chart I could look at that sorts these out by number into categories?</p>
    <p>Sorry if my long rambling nessage is boring, but I would appreciate any help you can give me.</p>
    <p>Thanks!</p>
  html_clean: |-
