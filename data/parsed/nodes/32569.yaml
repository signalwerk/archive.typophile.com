    Why would these be numbered instead of named? Is there some logic to the numbering system I'm not getting? The numbers start at 39 and go up to 86, but there are many missing numbers along the way. Does anyone know of a chart I could look at that sorts these out by number into categories?</p>
    <p>Sorry if my long rambling nessage is boring, but I would appreciate any help you can give me.</p>
    <p>Thanks!</p>
