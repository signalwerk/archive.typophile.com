    <p></p><div class="imageWrap"><img src="http://typophile.com/files/a_type_5910.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/a_type_numbers_3939.jpg"></div><p></p>
    <p>My new go-to print shop (Watermark Graphics) were so kind to give me the ampersand character from an old drawer of their wood type.</p>
    <p>Thanks to Don over in our type ID forum he confirmed my guess that this face is Futura Bold ... <a href="http://typophile.com/node/114087" title="http://typophile.com/node/114087">http://typophile.com/node/114087</a> ...coolio! It is the very first type I have ever been fortunate enough to hold in my hands ... and own, even if it is just one character lol.</p>
    <p>I have a few questions...  Is there a way to tell the date when these characters were cut? And how were they so precisely routered? And what type of wood was generally used? And, which foundry produced this particular set? Are there foundry marking stamped on a particular character's base?</p>
    <p>Much thanks in advance!</p>
