    html: <p>impo,the logo could be siplified and abstrated more. Right know it communicates the name just fine however it dosn't tell me anything more.(on an abstract level). Also right know it feels more like an illustration than a logo. My gut also tells me the logo should be more sharp and severe. All the way down to the typography. I tend to think of where this logo might be used. I don't feel like it would hold up on the spine of book at a very small size. The PP ligature looks like dp. The typeface is actually pretty nice come to think of it.</p>
