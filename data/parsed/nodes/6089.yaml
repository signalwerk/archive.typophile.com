  html: <p>I flat with a chap who writes some  <br>things every now and then. He would  <br>quite like to see it in print, so I decided <br>to 'publish' him. To do this, I have invented <br>the Papercut Press. (Inspired while using <br>the guillotine at work). Naturally, Papercut <br>has to have a logo, so I have made a few <br>variations. What do you all think?  <br> <br>kris. <br> <br><img src="http://www.typophile.com/forums/messages/29/42849.gif" alt=""></p>
