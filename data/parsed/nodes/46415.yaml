    <p>New to the Board.  Hi All.  I have no background in design, other than that big fat D I recieved in high school art class in the 60's. Just playing around with and old version of CorelDraw someone gave me. I have no aspirations to be a font designer, just create passable characters I use in spoofs on NFL team logos. I have a hard enough time faking your discipline as it is.</p>
    <p> I need help with complimentry font pairing. All I had to go on was the 5 letters from the Kansas City CHIEFS. I was guessing that the CHIEFS logo font was derived from Futura XBlkIt BT, with some mods to the C and S, with a slight widening of the first vertical component, and and tweak to the slant.   I tried to use this for KANSAS CITY, and other variations, but it looks like squat.</p>
    <p><a href="http://www.flickr.com/photos/nationalparodyleague/sets/72157605543312769/show/" title="http://www.flickr.com/photos/nationalparodyleague/sets/72157605543312769/show/">http://www.flickr.com/photos/nationalparodyleague/sets/72157605543312769...</a></p>
    <p>Same is true for the Lions</p>
    <p><a href="http://www.flickr.com/photos/nationalparodyleague/sets/72157605543245409/show/" title="http://www.flickr.com/photos/nationalparodyleague/sets/72157605543245409/show/">http://www.flickr.com/photos/nationalparodyleague/sets/72157605543245409...</a></p>
    <p>Please bear in mind I do not have a massive font library.</p>
    <p>Thanks</p>
