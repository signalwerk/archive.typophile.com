      <p>· · · · · · · · · · · · · · · · · · · ·<br>
    Lindsey™ Pro is a new casual script font with advanced OpenType features</p>
    <p>ELK GROVE VILLAGE, IL - Feb 1, 2006 - Ascender Corporation, a leading provider of advanced font products today announced the release of its second original OpenType Pro typeface. Lindsey™ Pro is a new font created by Steve Matteson, Ascender’s Type Director, based on a teenager’s handwriting. Lindsey Pro is available now for $30.00 with immediate software download from the Ascender Font Store (<a href="http://www.ascenderfonts.com" title="http://www.ascenderfonts.com">http://www.ascenderfonts.com</a>).</p>
    <p>· · · · · · · · · · · · · · · · · · · ·<br>
    Lindsey Pro is a casual script typeface design with irregular alignments and occasional connections. It was designed with a variety of alternative letter shapes and ligatures that add randomness to text using advance typographic OpenType features making this a convincing hand-lettered design. This requires an application that supports advanced OpenType features, such as InDesign CS, QuarkXPress7 and Microsoft Expression.</p>
    <p>“Lindsey Pro is a fun font to use in greeting cards, invitations, memos, signs and correspondence” said Steve Kuhlman, Vice President of Ascender. “It’s also a perfect font to express yourself on Valentine’s Day” he added.</p>
    <p>Lindsey Pro is available in both PostScript (OTF) and TrueType (TTF) flavors of OpenType for Macintosh OS X and Windows 2000, ME or XP. It retails for $30.00 and can be purchased and downloaded from the Ascender Font Store (<a href="http://www.ascenderfonts.com" title="http://www.ascenderfonts.com">http://www.ascenderfonts.com</a>).</p>
    <p>A PDF brochure of Lindsey Pro can be viewed here: <a href="http://www.ascendercorp.com/pdf/lindsey.pdf" title="http://www.ascendercorp.com/pdf/lindsey.pdf">http://www.ascendercorp.com/pdf/lindsey.pdf</a></p>
    <p>· · · · · · · · · · · · · · · · · · · ·<br>
    About Ascender Corporation<br>
    Ascender Corporation is a leading provider of advanced font products specializing in font design, development and licensing. Ascender’s founders are font industry experts, and have been involved in developing some of the most important and influential fonts used in computers, phones and printers. Ascender provides multilingual, custom font development for enterprises and hardware &amp; software developers. Ascender also provides high quality fonts for immediate download from the Ascender Font Store website.</p>
