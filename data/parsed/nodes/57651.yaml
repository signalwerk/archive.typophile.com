    html: |-
      <p>ppedit's functions are very limited. It's a demonstration of the Euler/Cornu spiral drawing concept, not much more. It can be used for font production in a roundabout way. Raph Levien has done this himself, but he wrote the thing and knows stuff about its inner workings I can't tell you. </p>
      <p>If you're trying to use it for font drawing, it's much easier to use Spiro mode in FontForge instead. ppedit's rendering is prettier, though.</p>
