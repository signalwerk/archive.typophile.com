    date_raw: 5 May 2009 — 10:04pm
    votes: null
    html: |-
      <p>It is possible to use ppedit (it's how I did Inconsolata), but it's not for the faint of heart. You use ctrl-S to save (to a file called "plate"), and ctrl-P to convert to PostScript outlines (to a file called "/tmp/foo.ps"). I used additional commandline tools to import the PostScript outlines into FontForge, as well as to optimize them to minimal Beziers. Some of those utilities also ship in the spiro distribution.</p>
      <p>These days, I'm more inclined to use FontForge's spiro drawing mode. I am frustrated by the UI clunkiness, and by the lack of rendering quality, but having the curves right there in the font instead of having to do conversions is a pretty major win.</p>
      <p>At some point, I want to get a good, usable, and pretty editing environment out there, but I don't have much time for it right now, juggling too many other things as it is. I'm most inclined to do it in in-browser Javascript, as browsers have finally gotten good enough to pull that off, and it's truly cross-platform. I'm not inclined to do much further development on ppedit, unfortunately - it would take a <em>lot</em> of work to make it into a real tool.</p>
      <p>I'm glad you guys are enjoying experimenting with Spiro.</p>
