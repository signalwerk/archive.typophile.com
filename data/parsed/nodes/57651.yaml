    html: |-
      <p>Yes. With <a class="freelinking external" href="http://fontforge.sf.net" rel="nofollow">FontForge</a>, not FontLab, as stated. You need to have X11 installed. If it's not on your Mac already, you can install X11 from your MacOS X install disk. libSpiro is a separate library that needs to be installed in addition to FontForge to make Spiro drawing mode work.</p>
      <p>See the <a class="freelinking external" href="http://fontforge.sourceforge.net/mac-install.html" rel="nofollow">FF Mac installation notes</a> for details and also install <a class="freelinking external" href="http://sourceforge.net/project/showfiles.php?group_id=103338&amp;package_id=302003&amp;release_id=645772" rel="nofollow">these dependencies</a></p>
