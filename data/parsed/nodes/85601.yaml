    <p>Hey people,</p>
    <p>It's common for a Black weight (or a bold) to have a higher x-height than the regular as an optical correction, while the ascender/descender height are usually kept the same to create visiual harmony in a typefamily. However, by increasing the x-height, the ascenders will look shorter, making the descenders look too long (or the ascenders too short). Is there any solution for this, or is it just something I'll have to live with? Would it be a problem if the descender height differs between Regular and Black?</p>
    <p>Thanks in advance,<br>
    Jasper de Waard</p>
