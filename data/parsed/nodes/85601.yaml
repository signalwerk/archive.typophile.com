    html: <p>If a black is intended for display, as it is in most cases, shorter descenders would come in handy for setting lines tighter.</p>
    html_clean: <p>If a black is intended for display, as it is in most cases, shorter descenders would come in handy for setting lines tighter.</p>
  - id: 477829
    user: 20652
    date: 2011-09-19T09:31:00
    date_raw: 19 Sep 2011 — 9:31am
    votes: null
    html: |-
      <p>I'd certainly recommend rebalancing the ascenders and descenders as you don't want them to look different lengths. Normally in text fonts ascenders are slightly longer than descenders. At the end of the day, type families need to look as though they have the same proportions (which isn't purely a matter of linear dimensions but also of relative areas and overall colour). This means that my answer would be to compare the regular weight with the black weight, using example words with descenders and ascenders, and shorten/lengthen the extenders until they click across weights. </p>
      <p>In my font Mint, that I'm currently working on, the Fat ascenders are slightly taller than the Medium, but the descenders are the same length.</p>
