    <img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/header.gif" alt="House Call April 2008" height="283" width="487">




    <img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/showcard_head.gif" alt="Showcard Stunt!" height="84" width="487">


    <a rel="nofollow" target="_blank" href="http://houseindustries.cmail3.com/l/382728/ztrlydy6/www.houseind.com/index.php?page=showfont&amp;id=658&amp;utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=april"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/showcard_image.jpg" alt="John Downer goodness" height="177" width="220"></a>
    <a rel="nofollow" target="_blank" href="http://houseindustries.cmail3.com/l/382728/ztrlydy6/www.houseind.com/index.php?page=showfont&amp;id=658&amp;utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=april"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/showcard_subhead.gif" alt="New single font release" height="28" width="202"></a>
    <p style="padding: 0pt;">House Showcard Stunt is the result of a customer request for a full lowercase for House Showcard from the Sign Painter collection. Sounds simple, but when we crack something open that we released nearly a decade ago, ten years of experience kicks in and makes us look at things in a different light. Think about it: In 1998 there was no European Monetary Union, typography systems did not have Unicode support, one page-layout software package had a stranglehold on the publishing industry and instant messaging meant picking up the phone and calling someone. And, more simply, we know a heckuva lot more about typography now than we did back then.</p>
    <p>Showcard Stunt includes “smart” OpenType programming that gives it a warmer hand-lettered feel in a wide range of display applications as well as full Eastern and Central European language support. The font is available now for immediate download at <a rel="nofollow" target="_blank" href="http://houseindustries.cmail3.com/l/382728/ztrlydy6/www.houseind.com?utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=april">www.houseindustries.com</a>.</p>
    <p><a rel="nofollow" target="_blank" href="http://houseindustries.cmail3.com/l/382728/ztrlydy6/www.houseind.com/index.php?page=showfont&amp;id=658&amp;utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=april">Click here to preview and purchase the new Showcard Stunt.</a></p>



    <a rel="nofollow" target="_blank" href="http://houseindustries.cmail3.com/l/382728/ztrlydy6/www.houseind.com/index.php?page=showfont&amp;id=658&amp;utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=april"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/showcard_specimen.gif" alt="Showcard Stunt characters" height="245" width="220"></a>







    <table border="0" cellpadding="0" cellspacing="0" width="487">
    <tbody>
    <tr>
    <td colspan="2" align="left" height="96" valign="bottom"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/neutra_head.gif" alt="Neutraface No.2" height="60" width="478"></td>
    </tr>
    <tr>
    <td align="left" valign="top" width="243"><a rel="nofollow" target="_blank" href="http://houseindustries.cmail3.com/l/382728/ztrlydy6/www.houseind.com/index.php?page=showfont&amp;id=615&amp;utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=april"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/neutra_image.gif" alt="2" height="255" width="220"></a></td>
    <td align="left" valign="top" width="244">
    <p>In case you missed it, we’ve further expanded our Neutraface suite to make it even more versatile. Both Neutraface collections include four text weights with true italics, five display weights, seven different figure styles, and integrated language support for Central and Eastern Europe. Neutraface No. 2 is defined by its higher crossbars and several more subtle design tweaks. All of the collections are available separately or can be purchased together with a savings of over $100. Check out our new consolidated Neutraface page.</p>
    <p><a rel="nofollow" target="_blank" href="http://houseindustries.cmail3.com/l/382728/ztrlydy6/www.houseind.com/index.php?page=showfont&amp;id=615&amp;utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=april">Click here to preview and purchase the entire Neutraface Collection.</a></p>
    </td>
    </tr>
    </tbody>
    </table>




    <table border="0" cellpadding="0" cellspacing="0" width="487">
    <tbody>
    <tr>
    <td colspan="2" align="left" height="123" valign="bottom"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/tdc_head.gif" alt="TDC Big Winners" height="78" width="487"></td>
    </tr>
    <tr>
    <td align="left" valign="top" width="243"><a rel="nofollow" target="_blank" href="http://houseindustries.cmail3.com/l/382728/ztrlydy6/www.houseind.com/index.php?page=showfont&amp;id=581&amp;utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=april"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/tdc_image.jpg" alt="Major award!" height="234" width="220"></a></td>
    <td align="left" valign="top" width="244"><a rel="nofollow" target="_blank" href="http://houseindustries.cmail3.com/l/382728/ztrlydy6/www.houseind.com/index.php?page=showfont&amp;id=581&amp;utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=april"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/tdc_subhead.gif" alt="Studio Lettering and Blaktur" height="27" width="242"></a>
    <p style="padding: 0pt;">Ken’s Blaktur font and forthcoming Studio Lettering collection were honored by the Type Directors Club as part of the organization’s 2008 type design competition. Studio Lettering will be available on May 1, 2008, so be sure that your House Industries mailing address is up to date. Email any address changes to <a rel="nofollow" ymailto="mailto:changes@houseind.com" target="_blank" href="mailto:changes@houseind.com">changes@houseind.com</a>.</p>
    <p><a rel="nofollow" target="_blank" href="http://houseindustries.cmail3.com/l/382728/ztrlydy6/www.houseind.com/index.php?page=showfont&amp;id=581&amp;utm_source=newsletter&amp;utm_medium=email&amp;utm_campaign=april">Click here to preview and purchase Blaktur</a></p>
    </td>
    </tr>
    </tbody>
    </table>




    <table border="0" cellpadding="0" cellspacing="0" width="487">
    <tbody>
    <tr>
    <td colspan="2" align="left" height="108" valign="bottom"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/lectures_head.gif" alt="Spring Lectures" height="77" width="478"></td>
    </tr>
    <tr>
    <td align="left" valign="top" width="244"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/lectures_ken_image.jpg" alt="KB" height="175" width="220"></td>
    <td align="left" valign="top" width="243"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/lectures_ken_subhead.gif" alt="Ken releases the Kraken" height="28" width="212">
    <p style="padding: 0pt;">Ken was itching to see first hand one of the few reasons for an “fj” ligature, so he traveled to Oslo early this month to make a presentation and give a workshop sponsored by Grafill, the Norwegian Organisation for Visual Communication. He was also invited to lecture at the Institute of Industrial Design, part of The Oslo School of Architecture and Design.</p>
    </td>
    </tr>
    </tbody>
    </table>




    <table border="0" cellpadding="0" cellspacing="0" width="487">
    <tbody>
    <tr>
    <td width="243"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/lectures_ben_image.gif" alt="Ben at AIGA Oklahoma" height="198" width="220"></td>
    <td align="left" valign="top" width="243"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/lectures_ben_subhead.gif" alt="Ben goes to Oklahoma" height="27" width="192">
    <p style="padding: 0pt;">Sooners wishing to experience the House Industries oeuvre need only travel to the state’s eponymous city as native Midwesterner Ben Kiel makes his triumphant return to the center of the country. April 24, 2008, The Oklahoman Auditorium.</p>
    <p><a rel="nofollow" target="_blank" href="http://houseindustries.cmail3.com/l/382728/ztrlydy6/www.aigaoklahoma.com">www.aigaoklahoma.com</a></p>
    </td>
    </tr>
    </tbody>
    </table>




    <table border="0" cellpadding="0" cellspacing="0" width="487">
    <tbody>
    <tr>
    <td width="244"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/lectures_rich_image.gif" alt="Cuckoo for TypoBerlin" height="278" width="220"></td>
    <td align="left" valign="top" width="243"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/lectures_rich_subhead.gif" alt="Rich at Typo Berlin" height="28" width="163">
    <p style="padding: 0pt;">From the beautiful rolling farmland of the Allgäu to the blistering speed of the A-9 from Munich, House partner Rich Roat can’t get enough German culture. He’ll be traveling to perhaps the world’s best design conference in Berlin for the fifth year, this time without the House Industries band so you can actually hear what he’s talking about. May 31, 2008, Typo Berlin.</p>
    <p><a rel="nofollow" target="_blank" href="http://houseindustries.cmail3.com/l/382728/ztrlydy6/www.typoberlin.de">www.typoberlin.de</a></p>
    </td>
    </tr>
    </tbody>
    </table>




    <table border="0" cellpadding="0" cellspacing="0" width="487">
    <tbody>
    <tr>
    <td colspan="3" align="left" height="117" valign="bottom"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/kern_head.gif" alt="Kern at Daytona" height="74" width="465"></td>
    </tr>
    <tr>
    <td width="220"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/kern_image_top.jpg" alt="Vanson x House for Kern" height="191" width="220"></td>
    <td width="23">&nbsp;</td>
    <td align="left" valign="top" width="244">
    				<img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/kern_image_subhead.gif" alt="House 'Factory' Rider" height="28" width="188">
    <p style="padding: 0pt;">Fonts don’t have much to do with motorcycle racing, but our buddy Nate Kern keeps his BMW R1200S in the winners circle with the help of his House factory powered Vanson and Kushitani suits. We’re not sure how many spectators at the March 2nd Daytona Moto ST race were subliminally influenced to make their type selections at House Industries, but it sure is fun watching our logo riding on Nate’s suit as he turns fast laps and stands on the podium.</p>
    </td>
    </tr>
    <tr>
    <td><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/kern_image_bottomleft.jpg" height="151" width="220"></td>
    <td colspan="2" align="left" valign="top" width="267"><img src="http://houseindustries.cmail3.com/email/382728/wwwhouseindcom/announce/housecall/april/kern_image_bottomright.jpg" height="151" width="84"></td>
    </tr>
    </tbody>
    </table>
