    <p>Hey guys I've been working on this custom lettering project. What do you guys think? Is the composition balanced? Is this too busy? Your suggestions &amp; constructive criticism would be much appreciated!</p>
    <p>It's inspired by this quote... "Wealth is of the heart and mind, not the pocket" by Pharrell.</p>
    <p>Thanks,<br>
