    <p>Hi all, I've seen several posts saying how much people love/hate ITC Avante Garde... Whether you love it or hate it, I need the alternative characters for it!</p>
    <p>Specifically the slanted versions of characters like the 'A' and 'W' etc.</p>
    <p>I have a selection of the normal type weights just not the alternative characters.</p>
    <p>If anyone can shed some light on how to find them, I would really appreciate it!</p>
    <p>Thanks</p>
