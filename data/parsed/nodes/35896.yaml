      <p>Unfortunately it’s compressed and what you’re after is condensed. Glad that was helpful, though. There’s also Dax Condensed Medium from FontShop with a similar ‘r’ and ‘e’ but it doesn’t have the same retro look.</p>
      <p>"i guess the biggest difference that i can see is just the rounded/smooth corners of the original logo, that organic quality it has".</p>
      <p>Had a quick look at <a href="http://www.robertocavalli.com" title="www.robertocavalli.com">www.robertocavalli.com</a> and think the type has hard geometric edges – those might just be pixels.</p>
      <p>"what is that called btw? when the edges and corners are soft and worn in, like old, real type, vs. the hard geometric edges of vector-drawn fonts — like that organic font used a lot now in new york magazine)"</p>
      <p>Don’t know, unfortunately. I’ve seen a few of those with ‘Antique’ after the name<br>
      <a href="http://moorstation.org/typoasis/designers/steffmann/samples/p/packard.htm" title="http://moorstation.org/typoasis/designers/steffmann/samples/p/packard.htm">http://moorstation.org/typoasis/designers/steffmann/samples/p/packard.htm</a><br>
      <a href="http://www.fonts.com/FindFonts/Detail.htm?pid=204383" title="http://www.fonts.com/FindFonts/Detail.htm?pid=204383">http://www.fonts.com/FindFonts/Detail.htm?pid=204383</a><br>
      <a href="http://moorstation.org/typoasis/designers/steffmann/samples/r/romanant.htm" title="http://moorstation.org/typoasis/designers/steffmann/samples/r/romanant.htm">http://moorstation.org/typoasis/designers/steffmann/samples/r/romanant.htm</a></p>
      <p>Have also heard ‘distressed’ used but think this refers to mid-1990s CalArts/Cranbrook font-mangling rather than just including irregularities from letterpress or a typewriter. You should post the question and get a proper answer from someone who designs typefaces. </p>
      <p>Best wishes</p>
