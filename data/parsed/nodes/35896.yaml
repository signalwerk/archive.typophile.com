    <p>hi everybody,</p>
    <p>i have a client that is asking that i create a logo using the same font as the "roberto cavalli" logo. i am doing my own research now (and did a search on here to see if this already came up), but i know we have some real geniuses on this board, so i would appreciate any help or tips!</p>
    <p>thanks in advance, you guys are the best!</p>
    <p>sincerely,<br>
    c</p>
    <p>p.s. i imagine it is most likely a custom-drawn logo, but it is probably based on an existing font, right? or how could i approximate it as best as possible? that cool lower-case narrow, rounded r, for example,or the e, with the diagonal bar. i am looking through compressed, gothic fonts, maybe with a slight art-deco styling to them? </p>
    <p><img src="/sites/default/files/old-images/cavalli_logo_5958.jpg"></p>
