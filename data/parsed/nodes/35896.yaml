      <p>“how could i approximate it as best as possible? that cool lower-case narrow, rounded r, for example,or the e, with the diagonal bar”.</p>
      <p>You’d get the rounded ‘r’ and the diagonal ‘e’ with “roberto” in ChaletComprimé CologneSixty or MilanSixty  and and “cavalli” CologneSeventy or MilanSeventy from House Industries.<br><a href="http://www.houseind.com/index.php?page=showfont&amp;id=11&amp;subpage=viewfonts">http://www.houseind.com/index.php?page=showfont&amp;id=11&amp;subpage=viewfonts</a><br>
      Still a long way away, though.<br><img src="/sites/default/files/old-images/roberto_4012.jpg"></p>
