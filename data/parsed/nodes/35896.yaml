      <p>hey thanks sihep this is excellent!!!</p>
      <p>i think this is very very close, at least for my purposes.</p>
      <p>i guess the biggest difference that i can see is just the rounded/smooth corners of the original logo, that organic quality it has.</p>
      <p>(what is that called btw? when the edges and corners are soft and worn in, like old, real type, vs. the hard geometric edges of vector-drawn fonts --  like that organic font used a lot now in new york magazine)</p>
      <p>also, the "t" is a bit different, the terminal and the crossbar, and the cavalli logo is more oval/oblong, whereas this one is taller and sharper, but it is FANTASTIC!</p>
      <p>i can also work with the ascenders and make the shorter, and that will help the x-height look more similar.</p>
      <p>and you know what, i actually like that thin version much better than the real logo!</p>
      <p>and, just to show you how great it is, let me show you where i was -- i was way back with bodega sans light! yikes!</p>
      <p>thanks again!!!</p><div class="imageWrap"><img src="http://typophile.com/files/cavalli_bodega_5748.jpg"></div><p></p>
