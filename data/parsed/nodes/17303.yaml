      <p>I guess my skepticism of design school is that since design is essentially an applied art, those 2-3 years of “freedom of exploration” tend to produce both a portfolio full of absurdly impractical designs and a bunch of graduates who don’t want to be told no you can’t use 6 colors plus die cuts plus 3 different kinds of paper. Plus they expect to be handed the keys to the castle rather than starting at the bottom designing flaps for a book jacket like the rest of us. </p>
      <p>It is not the same as going to school for, say, painting where I think students should be encouraged to push their minds as far as they can without commercial constraints (altho that said, MFA programs have become trade schools for the chelsea gallery system nowadays anyway). </p>
      <p>I confess I don’t know much about the type programs (Reading, the Hague) they may be much more valuable than Pratt or Parsons.</p>
