      <p>Actually, I’ve always considered getting a degree in graphic design the most worthwhile thing I’ve ever done. It certainly wasn’t a waste of money.</p>
      <p>Also, unless one devotes years to teaching type design to oneself—and even here, one needs input, feedback, and interaction with one’s peers and mentors (conferences and the internet are the best ways now to accomplish this)—several academic courses are necessary. A single, one semester class isn’t going to cut it, and I doubt that it ever has.</p>
      <p>A one-year master’s degree isn’t the only way, but it is one of the fastest. The most positive things that one might learn at Reading or the Hague are quick production methods. And how to use Python. People hiring young type designers are often looking for this skill more than any other. You can teach this to yourself as well, but it’ll take more time that way.</p>
      <p>A degree—like it or not—also acts as a badge of authority (depending on where one got it, of course).</p>
