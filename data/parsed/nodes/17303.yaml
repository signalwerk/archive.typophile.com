    <p>At one point I was interested in applying to the Reading type design MA, and received mixed opinions on the value of taking a year out to learn about type, in classroom conditions. Some type designers thought it something you could teach yourself, and others thought it highly worthwhile. Now my question isn’t with regards to the virtues of this particular course, but as to how many of you now practising received any kind of formal training. I myself have been plodding along now for a couple of years, improving in babysteps, following a type apprenticeship with dalton maag. I have no other formal training in the arts whatsoever.</p>
