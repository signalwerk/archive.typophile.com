      <p>I’ve met a lot of graphic designers and there are great divisions of opinion on how worthwhile people found the actual degree. I am living proof that it’s not impossible to miss out on a piece of paper and to learn your craft so my opinion is biased. Three of four years without commercial pressure to experiment within though, aren’t something to be sniffed at. </p>
      <p>The difference between type design and graphics are that there are significant fewer places in which this craft can be learnt on the job, and therefore you have to teach yourself. Perhaps at the end of the day, drive is the only thing that matters. If you want something badly enough, one way or another you will achieve the things you want to.</p>
