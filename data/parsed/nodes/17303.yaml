    html: "<p>I did not have any formal training in type design, but I have a huge amount of respect for what Gerry does at Reading (the only programme with which I am personally familiar) and rather wish that I had spent such a year at the beginning of my career. I think the principle value of such a course is that it packages the information that one needs and compresses the experience of designing a typeface family in a structured timeframe, while at the same time allowing for much more freedom of exploration than working to a commercial deadline. I’m very much aware, as someone who is largely self-taught and who learned on the job, that it has taken a long time to fill various holes in my knowledge, and some still exist: learning on the job, you learn only what you need to get the particular job done. In a programme with a structured curriculum, you are more likely to learn more things in a short period of time.</p>"
