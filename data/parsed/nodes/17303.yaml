      <p>A year-long masters program sounds like overkill to me - I would think one class would be enough to learn what you need to know about type history/design.</p>
      <p>For myself I have no formal training in typography, but was lucky enough (I think) to learn design just before the advent of the computer. You really had to know your type in those days, because mistakes were very expensive to correct. Also the number of fonts to choose from was far far fewer. I was also lucky to have a boss when I started out who took a real interest in making sure I understood type. But, I’m a graphic designer, not a type designer.</p>
      <p>I have always thought that a graphic design degree is basically a waste of money.</p>
