      <p>Do you need to go to the fine art school to be a painter? you can, and you can not. I don’t believe you can go to a school and end up as an artist. However, typography, for some, is a conservative artform supposed to have rules and conditions. So, why are they not formalised that much. Why are there few schools to teach you this discipline? I don’t know. it’s a craft, it’s a skill, you can teach yourself, you can learn it from others. Why bothering. Learning is a big time process.<br>
      Is there a uni for poetry?<br>
      are there poets with Nobel prices coming from big poetry courses?<br>
      However, I have no answer but a similar questions.</p>
