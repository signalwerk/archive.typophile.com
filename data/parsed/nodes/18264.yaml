      <p>Was this taken from one of the Solo or Dover books? The monograms which I have seen from these books are all hand-lettered. However, a quick look on MyFonts could probably help you find something similar.</p>
      <p>Such as <a href="http://www.myfonts.com/fonts/typeart/prints-charming/" title="http://www.myfonts.com/fonts/typeart/prints-charming/">http://www.myfonts.com/fonts/typeart/prints-charming/</a> or perhaps a little more wildly swashed <a href="http://www.myfonts.com/fonts/canadatype/treasury/" title="http://www.myfonts.com/fonts/canadatype/treasury/">http://www.myfonts.com/fonts/canadatype/treasury/</a> or maybe more elegant like <a href="http://www.myfonts.com/fonts/fontbureau/sloop/" title="http://www.myfonts.com/fonts/fontbureau/sloop/">http://www.myfonts.com/fonts/fontbureau/sloop/</a> whatever you use you will probably need to skew it to be upright unless you like the more simple <a href="http://www.myfonts.com/fonts/bitstream/typo-upright/" title="http://www.myfonts.com/fonts/bitstream/typo-upright/">http://www.myfonts.com/fonts/bitstream/typo-upright/</a></p>
