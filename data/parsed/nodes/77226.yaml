  html: |-
    <p>So far this is only useful with the current limited range of Graphite-enabled fonts such as SIL Charis, Gentium Plus, UniFraktur-Maguntia, UniFraktur-Cook and the Linux Libertine fonts, but Libertine now includes a Python script that supposedly auto-derives and builds Graphite tables from Opentype tables in Fontforge.</p>
    <p><a href="http://extensions.services.openoffice.org/en/project/typo" title="http://extensions.services.openoffice.org/en/project/typo">http://extensions.services.openoffice.org/en/project/typo</a></p>
    <p>There is a apparently 2011 Google Summer of Code project to add Opentype feature access to OpenOffice.org, so adding Graphite to your fonts might ultimately prove unnecessary, but if you want advanced features in Linux or in OpenOffice now, this is one way to get them.</p>
    <p>❧J</p>
