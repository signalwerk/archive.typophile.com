      <p>I think you really need to do the lower case to see if it would work as a font because it could never really be used with just the caps. Unless you're one of those type terrorists who sets script fonts all uppercase.</p>
      <p>I think it is too inconsistent as well.</p>
      <p>My favourite glyphs so far are the H, P, Q, V, X and the S if it lost some weight in places and was a bit narrower.</p>
