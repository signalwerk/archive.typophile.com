    <p>Hi everyone,</p>
    <p>this is the first font I designed and got into fontlab. I wanted a flowy, script-like face with no straight lines. Please post your thoughts. I actually already see a lot of inconsistencies in color, but I just wanted to put it out there to see what direction to take this project. Suggestions on possible lowercase forms would be appreciated too. thanks!</p>
    <p>Dante</p><div class="imageWrap"><img src="http://typophile.com/files/mesanthic_4645.gif"></div><p></p>
