    <p>Hi all,</p>
    <p>I'm designing a logo for a client who has requested two different fonts. I'm not a fan of either, but I don't think they go well together either. But i'm not sure. What do you guys think? What should I recommend? Any other font you'd recommend instead?</p>
    <p>He's requested two options:</p>
    <p>Mongolian Baiti with Copperplate Gothic Bold</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/A_6469.png"></div><p></p>
    <p>or</p>
    <p>Felix Titling with Copperplate Gothic Bold</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/B_4954.png"></div><p></p>
