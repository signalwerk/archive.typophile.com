    html: |-
      <p>&gt; "S"s are so hard for me to draw! They take me forever and I never get them quite right. <br> <br>In 1979, Don Knuth wrote an article in the Bulletin of the American Mathematical Society in which he described the computer typesetting system that he was in the process of developing: <br><br>
      </p><blockquote>
      <hr size="0"><!---quote-!--><b>quote:</b>
      <p>The most difficult symbol by far, at least for me, was the letter S; in fact I spent three days and nights without sleep, trying to make the S look right, before I got it. At one point I even felt it would be easier to rewrite all my books without using any S's! After the first day of discouraging trials, I showed the meager results I had to my wife, and she said "Why don't you make it S-shaped?".<!---/quote-!--><br>
      </p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote>
      <p></p>
