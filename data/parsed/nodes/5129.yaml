    html: <p>Looks great, almost like a magazine masthead. <br> <br>Something that has helped me with drawing an S is (this may be really obvious) starting with facing bezier handles being the same length. Does that make sense? This makes for a smooth starting curve--then I noodle with the node positions and fine-tune the handle lengths. <br> <br>This helped me, but someone more experienced may have better advice. <br> <br>-Addison</p>
