    <p>Just checking before I upgrade my system: anyone know for sure about Fontlab and OS X 10.8 Mountain Lion? </p>
    <p>I found nothing either way in online searches or on Fontlab's site. With the FL update needed for Lion (10.7), I don't want to cause myself problems, if there are any.</p>
    <p>Thanks,</p>
    <p>Mcs</p>
