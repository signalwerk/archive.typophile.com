    html: <p>If you already have FontLab Studio 5.1.x installed, you should be good to go. If you don't, make sure it is installed before you do the upgrade to Mountain Lion, otherwise it won't let you install it under Apple's new code signing rules. FontLab Studio works just fine under Lion and Mountain Lion.</p>
  - id: 517135
    user_id: 2438
    user_name: gargoyle
    user_path: null
    user_image: /files/pictures/picture-2438.png
    date_raw: 27 Jul 2012 — 12:17pm
    date: 2012-07-27T12:17:00
    votes: null
    html: <p>AFAIK you can still run unsigned installers and apps in 10.8 by going into System Preferences and changing the Security setting "Allow applications downloaded from" to "Anywhere".</p>
