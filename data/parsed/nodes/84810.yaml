    <p>My plan to photograph as many printing museums as possible is still moving along. This time I had the opportunity to take pictures in the tiny print shop of the <a class="freelinking external" href="http://www.prepressure.com/printing/museum/imprimerie-du-fourneau-saint-michel" rel="nofollow">Fourneau Saint-Michel</a> open air museum in Saint-Hubert, Belgium.</p>
    <p><a href="http://www.prepressure.com/images/museum-fourneau-saint-michel-imprimerie-presse.jpg" rel="nofollow"><img title="museum Fourneau Saint-Michel - The printing press" src="http://www.prepressure.com/images/museum-fourneau-saint-michel-imprimerie-presse.jpg" alt="The press in the 'Imprimerie'" width="450" height="300"></a></p>
    <p>Pictures from other museums can be found <a class="freelinking external" href="http://www.prepressure.com/printing/museum" rel="nofollow">here</a>.</p>
