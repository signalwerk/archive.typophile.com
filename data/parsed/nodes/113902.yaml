      <p>I wrote a series of artspeak blurbs for most of my types, best accessed at FontSpring:<br>
      <a href="http://www.fontspring.com/foundry/shinntype" title="http://www.fontspring.com/foundry/shinntype">http://www.fontspring.com/foundry/shinntype</a></p>
      <p>A critical (“meaningful”) description of any typeface may be written.<br>
      I addressed the issue of how it is possible to decribe a typeface from different perspectives, in the post for the release of Sense and Sensibility, at Typophile: <a href="http://typophile.com/node/74877" title="http://typophile.com/node/74877">http://typophile.com/node/74877</a> </p>
      <p>The designer’s influences, intentions and understanding, and what the foundry has to say about a typeface, are only part of the picture.</p>
