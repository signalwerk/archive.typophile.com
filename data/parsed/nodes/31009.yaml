    html: <p>There isn't an easy way to do this gradient in illustrator, but it's possible. You'll have to use the gradient mesh tool and create several small gradients that track around a circle.</p>
    html_clean: <p>There isn't an easy way to do this gradient in illustrator, but it's possible. You'll have to use the gradient mesh tool and create several small gradients that track around a circle.</p>
