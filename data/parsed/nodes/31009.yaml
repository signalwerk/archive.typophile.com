  - id: 181348
    user: 7730
    date: 2007-01-30T14:42:00
    date_raw: 30 Jan 2007 — 2:42pm
    votes: null
    html: |-
      <p>Create two rectangles (one black one white). Create a blend between the two. Set the blend to smooth color and to align to path. Create an art brush out of the blend. apply the brush to a circle. Increase the stroke weight until a point is created at the center.<br>
      Let me know if any of this doesn't make sense. I was able to recreate your example perfectly.</p>
      <p>Josh</p>
    html_clean: |-
      <p>Create two rectangles (one black one white). Create a blend between the two. Set the blend to smooth color and to align to path. Create an art brush out of the blend. apply the brush to a circle. Increase the stroke weight until a point is created at the center.<br>
      Let me know if any of this doesn't make sense. I was able to recreate your example perfectly.</p>
      <p>Josh</p>
