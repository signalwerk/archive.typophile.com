    html: "<p>&gt; I love to look at letter forms. <br> <br>Then you're halfway there! Well, at least a quarter. <br> <br>&gt; Are there any prominent African-American type designers <br> <br>You know, that's a question *nobody* dares to ask... I think the fact that there are virtually *none* in the field (go to an ATypI conference, and you'll see) means nobody wants to face the issue. <br> <br>The only one I've seen in a picture (I've never had the pleasure of meeting him in person, so I'm not 100% sure) is Joshua Darden*, and I think he might be half (if that matters). <br> <br>* <a href=\"http://www.typography.com/profile/index.html\" target=\"_top\">http://www.typography.com/profile/index.html</a> <br> <br>&gt; What is the difference between the following terms; gothic, grotesque, grotesk, and sans <br> <br>Depends who you ask. My advice is: don't ask.  :-/ <br> <br>&gt; Who is considered the best in this field as far as individuals and foundries <br> <br>Terry, it takes somebody fresh like you to ask such a brazen question. Thank you. Some people would call that a simple-minded question, but at its heart is the desire for insight - and that's a great thing. <br> <br>Dead people, I'd would cite two: Robert Granjon, Eric Gill. <br>Living people: If I were *forced* to choose one person, I would have to say Matthew Carter. But I would quickly add some of my favorites, like Gerard Unger and Lee Schulz and Evert Bloemsma and .... <br> <br>The thing is, you don't have to look for *the* best - there's so much to learn from so many designers, almost any of them, in fact - as long as you know what to look for. For example, a designer could be very good at making pretty letterforms, without the ability to space the font properly. Or a designer could be very good at making text fonts, but couldn't make a hip display font if you held a gun to his head. <br> <br>To elaborate further, different people are good at different things, so if you can focus on individual aspects of the craft and ask again (like right here), then you might get some very specific recommendations of whose fonts to peruse. Just one thing, in case it needs saying: if/when you open the fonts of others, don't re-use the actual curves! Also, whenever you draw substantial inspiration from a specific design or designer, try to give credit, in public. <br> <br>BTW, Terry: thank you so much for being here!! <br> <br>hhp</p>"
    html_clean: "<p>&gt; I love to look at letter forms. <br> <br>Then you're halfway there! Well, at least a quarter. <br> <br>&gt; Are there any prominent African-American type designers <br> <br>You know, that's a question *nobody* dares to ask... I think the fact that there are virtually *none* in the field (go to an ATypI conference, and you'll see) means nobody wants to face the issue. <br> <br>The only one I've seen in a picture (I've never had the pleasure of meeting him in person, so I'm not 100% sure) is Joshua Darden*, and I think he might be half (if that matters). <br> <br>* <a href=\"http://www.typography.com/profile/index.html\" target=\"_top\" class=\"link-external\">http://www.typography.com/profile/index.html</a> <br> <br>&gt; What is the difference between the following terms; gothic, grotesque, grotesk, and sans <br> <br>Depends who you ask. My advice is: don't ask.  :-/ <br> <br>&gt; Who is considered the best in this field as far as individuals and foundries <br> <br>Terry, it takes somebody fresh like you to ask such a brazen question. Thank you. Some people would call that a simple-minded question, but at its heart is the desire for insight - and that's a great thing. <br> <br>Dead people, I'd would cite two: Robert Granjon, Eric Gill. <br>Living people: If I were *forced* to choose one person, I would have to say Matthew Carter. But I would quickly add some of my favorites, like Gerard Unger and Lee Schulz and Evert Bloemsma and .... <br> <br>The thing is, you don't have to look for *the* best - there's so much to learn from so many designers, almost any of them, in fact - as long as you know what to look for. For example, a designer could be very good at making pretty letterforms, without the ability to space the font properly. Or a designer could be very good at making text fonts, but couldn't make a hip display font if you held a gun to his head. <br> <br>To elaborate further, different people are good at different things, so if you can focus on individual aspects of the craft and ask again (like right here), then you might get some very specific recommendations of whose fonts to peruse. Just one thing, in case it needs saying: if/when you open the fonts of others, don't re-use the actual curves! Also, whenever you draw substantial inspiration from a specific design or designer, try to give credit, in public. <br> <br>BTW, Terry: thank you so much for being here!! <br> <br>hhp</p>"
