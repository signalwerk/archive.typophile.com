    html: <p> Thank you for your responses. Were there any others.  <br> <br>Two more questions. Are there more forums like this on the internet. Maybe a graphic design forum would be cool. <br> <br>Also how can I find out who made the first computer font. <br> <br>As far as being an African American woman, there are a lotof other fields that are under-represented. I'd like to pick one and be somewhat of a pioneer. Though I have gone through this site and I'm not sure that type design is for me I'll definitely keep it in mind. I also know that there are alot of great type designers who are women. I would like to use my painting background but be more than just a painter. I'll figure it out. <br> <br>Sincerely, <br> <br>Terry </p>
