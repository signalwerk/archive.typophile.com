    html: "<p>&gt; Maybe a graphic design forum would be cool.  <br> <br>There's almost too many forums, actually. <br>What I would recommend is becoming a member of Typo-L* first, and then asking there for more leads. <br> <br>* Somewhere in here: <a href=\"http://listserv.heanet.ie/\" target=\"_top\">http://listserv.heanet.ie/</a> <br> <br>&gt; I'd like to pick one and be somewhat of a pioneer. <br> <br>Now that's called planning ahead! And a killer plan it is. Don't be afraid to leverage your minoritiness - as long as you don't let that on... <br> <br>Anyway, I hope you choose the craft of type design, but wherever you go, good luck! BTW, although this list is representative of type design as a whole in *some* ways (like the obsessivity, and the bickering), it's not really a reliable way to gauge what it *really* is. Not that it's the same thing to each of us anyway, especially these days of so called \"democratized\" type design. <br> <br>&gt; I also know that there are alot of great type designers who are women. <br> <br>There are? I've always felt there aren't enough, and some of the ones we have (and have had) tend to get \"celebrity\" syndrome - like Warde, who wasn't even a designer. I would point to Jill Bell as a very good type designer who doesn't get enough attention. <br> <br>hhp</p>"
    html_clean: "<p>&gt; Maybe a graphic design forum would be cool.  <br> <br>There's almost too many forums, actually. <br>What I would recommend is becoming a member of Typo-L* first, and then asking there for more leads. <br> <br>* Somewhere in here: <a href=\"http://listserv.heanet.ie/\" target=\"_top\" class=\"link-external\">http://listserv.heanet.ie/</a> <br> <br>&gt; I'd like to pick one and be somewhat of a pioneer. <br> <br>Now that's called planning ahead! And a killer plan it is. Don't be afraid to leverage your minoritiness - as long as you don't let that on... <br> <br>Anyway, I hope you choose the craft of type design, but wherever you go, good luck! BTW, although this list is representative of type design as a whole in *some* ways (like the obsessivity, and the bickering), it's not really a reliable way to gauge what it *really* is. Not that it's the same thing to each of us anyway, especially these days of so called \"democratized\" type design. <br> <br>&gt; I also know that there are alot of great type designers who are women. <br> <br>There are? I've always felt there aren't enough, and some of the ones we have (and have had) tend to get \"celebrity\" syndrome - like Warde, who wasn't even a designer. I would point to Jill Bell as a very good type designer who doesn't get enough attention. <br> <br>hhp</p>"
