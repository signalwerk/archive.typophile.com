  html: <p> I just recently was exposed to type design via the Fontographer program. I love to look at letter forms. This site is pretty good for new people like me. <br> <br>I have searched the Internet for more information on some questions that I need answering but I was not able to get the answers. <br> <br>I will post them here for discussion. <br> <br>8 Are there any prominent African-American type designers. <br> <br>8 What is the difference between the following terms; gothic, grotesque, grotesk, and sans. <br> <br>8 Who made the first computer or digital font. <br> <br>8 Who is considered the best in this field as far as individuals and foundries. Is there a font considered the best font. These examples I could study and use their accomplishments as models. <br> <br>Thank you in advance. <br> <br>Terry Wilson </p>
  html_clean: <p> I just recently was exposed to type design via the Fontographer program. I love to look at letter forms. This site is pretty good for new people like me. <br> <br>I have searched the Internet for more information on some questions that I need answering but I was not able to get the answers. <br> <br>I will post them here for discussion. <br> <br>8 Are there any prominent African-American type designers. <br> <br>8 What is the difference between the following terms; gothic, grotesque, grotesk, and sans. <br> <br>8 Who made the first computer or digital font. <br> <br>8 Who is considered the best in this field as far as individuals and foundries. Is there a font considered the best font. These examples I could study and use their accomplishments as models. <br> <br>Thank you in advance. <br> <br>Terry Wilson </p>
