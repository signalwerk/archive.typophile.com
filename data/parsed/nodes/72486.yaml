      <p><em>If someone were to write about type design and typography to the masses, what would you want them to write about?</em></p>
      <p>I would just like him to write well.<br>
      That means not biting off more than he can chew.<br>
      If you are going to write about the kind of issues that are discussed in specialist forums or trade journals, then you have to really narrow your focus.<br>
      This article would have been better if the writer had stuck to Papyrus in <em>Avatar</em>, which he discusses prominently, (although that's a bit tardy by now.)<br>
      Perhaps Bruno's new font is the most current news here in this NEWS magazine, but Helvetica too is old hat (the movie came out several years ago), and a font press release isn't really news. So that might explain the random ballooning of content. I'm surprised Comic Sans wasn't mentioned.</p>
      <p>This is typical -- a little bit of news is stitched together with unconnected intersections between type and popular culture (e.g. Barnbrook namedrops Bowie), with a primer thrown in for good measure. And a manufactured controversy for balance and sensationalism. I mean, if your biggest naysayer source is a "Canadian blogger"...<br>
      It's just bad writing and editing.</p>
