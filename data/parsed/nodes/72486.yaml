      <p>When I taught a course in book design, I told my students that typography is like music.<br>
      You don't have to know music theory to be moved by music. You may not know one note from another, or what syncopation means, but the music still makes you react: One tune makes you want to cry, another makes you want to dance.<br>
      Typography works the same way. You may not know Bodoni from baloney, but the choices a designer made cause you to see a page of text as easy or rigorous, old-fashioned or modern.<br>
      That's why typography matters. Readers may not respond to type the same way professional designers do, but they <em>do</em> respond.</p>
