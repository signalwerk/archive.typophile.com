      <p>That's like asking: Do books really matter. If not for the invention of the printing press and the artisans who followed how many books would be around today. The English statesman and philosopher Francis Bacon wrote that typographical printing has "changed the whole face and state of things throughout the world".</p>
      <p>Unfortunately, even though innovation and mass production has improved all of our lives, it has also created the impression of uniformity. We live in a constantly changing and more complex world. As a result, we use the technology but few of us really understand it. Unless you are 'in the business', so to speak, it's difficult for many to appreciate the work that goes into creating a 'beautiful piece of furniture', a 'fine painting', an 'emotional piece of music', or for that matter, a 'typeface'. </p>
      <p>That's why only type designers and graphic artists get excited about this wonderful craft of ours. Good typography is a labor of love. Just like a musician fine tunes his music, we love to deal with the intricacies of our craft.</p>
      <p>I remember trying to explain to my wife what I did for a living. I remember her saying, "but, all '26 letters' of the alphabet are already made. They exist. What does a type designer do"?</p>
      <p>And, that my friends, is what we all initially have to deal with. Oh, after I explained to her the whole picture, she finally got it. She now is my biggest fan.</p>
      <p>And, that's what we have to do with the rest of the world. It's our job to educate them. With time, I'm sure that many will come to understand and appreciate what we do, and how we all have contributed to this wonderful medium we play in.</p>
      <p>So, keep those great new fonts coming. I'm already working on the next one :)</p>
