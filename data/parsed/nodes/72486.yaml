      <p>The word ‘subconscious’ is prejudicial.</p>
      <p>Simpler to say that there are aspects of design that involve experiential associations that do not need to be formulated as thoughts and generally are not. This is what we mean when we say that a design evokes a sense of something. If we bothered, we could probably formulate that sense as a thought, which effectively means giving it linguistic expression. That we generally don't bother doesn't require a concept of the subliminal or the subconscious, it just means that it isn't necessary to the experience.</p>
