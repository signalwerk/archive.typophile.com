      <p>The word "subliminal" is prejudicial.<br>
      Too many connotations of subliminal advertising, tricking people into buying stuff.</p>
      <p>But really, the "subliminality" of type is no different than, say, the music in a movie soundtrack, which is a far more manipulative way to work on people's emotions.</p>
      <p>How about hair styling? That's designed to send subconscious messages too.<br>
      But no one calls it subliminal.</p>
      <p>All areas of design involve subconscious communication.</p>
      <p>And if the advertising in a publication targets readers with clever manipulation of graphic imagery, how is that different than the editorial (bastion of democracy and civilization), the typography of which targets its demographic in exactly the same manner?</p>
