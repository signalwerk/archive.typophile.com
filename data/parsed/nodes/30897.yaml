  html: |-
    <p>Hello </p>
    <p>I am looking for a book specialised in printing production.<br>
    It is important to be updated with the latest printing techniques<br>
    explaining in simple language (english is not my mother tongue)<br>
    a wide variety of printing issues. </p>
    <p>For the moment I am thinking for the “PRODUCTION FOR THE GRAPHIC DESIGNER”<br>
    by Craig James. </p>
    <p>I am looking forward for any recommendations. </p>
    <p>Thanks in advance</p>
