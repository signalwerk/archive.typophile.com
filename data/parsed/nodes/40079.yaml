    html: |-
      <p>i always notice the font, too. but it really annoys everyone around me.</p>
      <p><em>I might be thinking of the font, not the words I was reading.</em><br>
      patty’s right — although we may always think of the type (because, jeez, it’s what we do), the only time it’s a problem or interuptive is when the type has been used inappropriately or poorly. i would guess a horticulturist would look at a landscape, mentally noting the plants but appreciating the <em>garden.</em> but if something’s wrong, it might stick out leaving him distracted and wondering. “why are the ferns next to the cacti?”</p>
