    <p>I was reading a book last night when it occurred to me that I didn’t know what font was used. Probably something basic like Times or Garamond. But I didn’t *know*.</p>
    <p>It also occurred to me that I was glad I didn’t know, because if I did it might drive me to distraction. I might be thinking of the font, not the words I was reading.</p>
    <p>Anyone else find some truth in that?</p>
    <p>-Lindsay</p>
