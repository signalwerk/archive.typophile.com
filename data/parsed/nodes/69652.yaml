      <p>I'm a preacher's kid and have made many bulletins over the years, so I hope you don't mind my comment... </p>
      <p>I did a quick Google for your church, and, if I found the right website, it appears that this bulletin is for short, outdoor services for homeless people.</p>
      <p>With that in mind, your entire bulletin looks a tad formal to me. Yes, I know it's a worship service, but it's an outdoor service which probably has a fairly casual atmosphere, and perhaps the worshipers themselves (who apparently are primarily homeless folks) are folks who prefer a more casual atmosphere. </p>
      <p>In fact I've been to many casual and/or outdoor services which were structured so that no bulletin was needed at all.</p>
      <p>But anyway, you might want to consider experimenting with a slightly more informal design. You might try avoiding all caps, have larger type, shorter line lengths, maybe even trying breaking it into 2 columns instead of 1, etc.  </p>
      <p>Just a thought.</p>
