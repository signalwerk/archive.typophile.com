      <p>Thanks for all the comments!</p>
      <p>@ Tomi - Thanks for the suggestion. What did you think of the italics on the "the" and the "of Cambridge"? I thought it set of the "Outdoor Church" a bit but did you find it messy or distracting?</p>
      <p>@ JamesM - You indeed found the right website. I considered going the informal route but decided against for a few reasons:<br>
      1) although it is outdoors the liturgy we use is relatively formal (it's lifted almost word for word out of the Book of Common Prayer)<br>
      2) in line with what John Hudson suggested, this is one of the few opportunities that many of our congregants have to participate in a community where their views, and to a large extent their personhood, are respected so I wanted that respect to carry over even into our bulletins.<br>
      - I like the the two column idea. I'll give it a go.</p>
