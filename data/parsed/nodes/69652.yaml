    <p>Greetings everyone!</p>
    <p>I am presently interning at a church and have been assigned the task of updating our order of service bulletin. I am not at all a design professional and so was wondering if anyone could suggest a more elegant way of defining the header than I have done (<a class="freelinking external" href="http://docs.google.com/viewer?a=v&amp;pid=sites&amp;srcid=ZGVmYXVsdGRvbWFpbnxzZXJtb25zZGV0b211fGd4OjViNGQ0OTg3ZWUxNDQwZWM" rel="nofollow">here is the pdf</a>).</p>
    <p>Thanks in advance!</p>
    <p>- Tomas</p>
