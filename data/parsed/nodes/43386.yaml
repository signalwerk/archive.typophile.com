      <p>&gt;bang for your buck with United Sans</p>
      <p>Yeah, Tal Leming is one of the awesome double-talents in type design, being a programming maven and a very good designer. See also <a class="freelinking-external" href="http://www.houseind.com/index.php?page=showfont&amp;id=565">Burbank</a>, where he makes a well crafted animated-cartoon style font and then multiplies it with a dizzying variety of styles. Being able to multiply styles is where being a techno-wizard gives you an edge.  </p>
      <p>&gt;thanks</p>
      <p>You’re most welcome!</p>
