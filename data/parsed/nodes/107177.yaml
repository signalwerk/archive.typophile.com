    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Figure 1_Typecast_edit_3566.png"></div><p></p>
    <p>Try Typecast now - <a href="http://typecast.com/google-fonts" title="http://typecast.com/google-fonts">http://typecast.com/google-fonts</a><br>
    Read the press release - <a href="http://bit.ly/19eufZk" title="http://bit.ly/19eufZk">http://bit.ly/19eufZk</a></p>
    <p>We are delighted to introduce a new a free version of Monotype’s Typecast application, now available through Google Fonts and Monotype: <a href="http://typecast.com/google-fonts" title="http://typecast.com/google-fonts">http://typecast.com/google-fonts</a> </p>
    <p>Our premium version of the Typecast application enables typographic experimentation without the need to hand code or use expensive design software. In this new public version, users are able to select any font on the Google Fonts website and then follow the link to the Typecast application. </p>
    <p>Google’s service is incredibly popular, and many designers’ first experience with Web fonts is made possible through their free library. And so in our drive to encourage more use of Web fonts online and offer a new way to access the Typecast application, Google Fonts is the ideal partner. Those who currently rely on Google’s library of free typefaces to bring more varied typography to the Web will now be able to work with those typefaces more easily and create stunning, readable compositions in a fraction of the time.</p>
    <p>Specifically, designers can now work with Google Fonts complete library on text of any length and use a wide range of type controls to build clear, readable type systems through adjustments such as font size, weight and line spacing. Designers can also work with Web fonts side-by-side to quickly see at a glance what’s working and what’s not. Users are able to create more realistic compositions with floats, clears, margins, and padding controls, and a number of effects are available such as background colors, borders and text shadows. In our free version of the Typecast application, a user’s work can be exported as production-ready HTML and CSS, or PNG files, to share with others or merge with comps. </p>
    <p>If Google users want to upgrade at any time to take full advantage of the thousands of other typefaces available in the app, including Fonts.com Web fonts (fonts.com/web-fonts); Typekit; Webtype and Fontdeck, or to share, test, or publish their designs with one click, the premium version starts at $29 and is available at typecast.com.</p>
    <p>We hope that our free public version will foster more type lovers and over time cultivate more typography advocates.  We think that’s good for the Web, clients, readers and designers everywhere.</p>
