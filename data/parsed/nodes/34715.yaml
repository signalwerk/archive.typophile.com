    html: <p>Handling solid lead isn’t dangerous for adults, even over decades, but you should still  wash your hands when you finish and not eat while you handle the stuff. Lead is only a health hazard if inhaled or ingested—which is why wallpapers with lead pigments killed so many people, and why children who grow up around peeling lead paint suffer problems with brain development.</p>
