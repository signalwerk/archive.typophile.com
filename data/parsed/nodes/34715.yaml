    <p>I was checking out some lead type at an antique store over the weekend, when another customer struck up a conversation with me about type. Turns out he used to be a linotype operator, and among other things, stressed the importance of washing your hands after handling lead type. </p>
    <p>Knowing nothing about lead (or whatever else is in metal type) poisoning, I was wondering how assiduous I should be about this. I know I shouldn't be putting it in my mouth or anything, but should I be wearing gloves, or would that even mitigate the potentially harmful effects? Thanks.</p>
