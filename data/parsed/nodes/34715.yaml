      <p>I would look at the OSHA (Occupational Safety and Health Administration) site <a href="http://www.osha.gov/SLTC/lead/index.html">here</a> I have handled lead type many times over the years and know at least one Linotype operator who is ok but OSHA is strict and the Shelburne Museum in Vermont where I work has a Linotype machine which OSHA insisted be rendered inoperable. Of course it could be a fire hazard too as it is in a wooden building. But of course I think the person you met offered a good tip which most would follow.<br>
      Jordan</p>
