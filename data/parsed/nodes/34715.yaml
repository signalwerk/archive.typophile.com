      <p>I worked as a hand compositor for twenty years, day in, day out. At 61 I've been away from  daily exposure to lead for nearly twenty years. I'm pretty healthy, and no doc has suggested any ailments I ever had may have come from lead. Back in those days I admit to holding a lot of Monotype sorts between my teeth. I also had pretty bad habits as far as hand-washing at lunch time. The first ten years or so that I worked in the trade it was also common for comps and pressmen to wash their hands with gasoline and other harsh solvents pretty regularly.</p>
      <p>I know one man in well into his 70s who's been dealing with lead type (and inhaling its fumes) for probably 50 years. He's the picture of health. Another man I know collapsed after only a few years working as a comp. His doc told him it was lead. The doc said my pal's bouts of impotence were also related to lead poisoning.</p>
      <p>Among many variables we have to consider innate factors in any individual's makeup and health. I may develop something nasty in years to come that can be traced to lead. Or I may get carpal tunnel syndrome from 18 years at a computer. Or I could fall off my bike on the way home tonight.</p>
      <p>At the SHARP conference in 05 a scholar presented a paper about the health of Baltimore printers in the late 19th century; he was specifically interested in lead. I'll see if I can find a www ref and post it.</p>
      <p>Tonight I will drink several toasts in prayer for the continued good health of all of you.</p>
      <p>powers</p>
