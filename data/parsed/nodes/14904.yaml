      <p>I am really sad to say that the BIGGEST type specimen book that I ever threw away was the humongous PDR/WTC Type Catalog... I simply needed the room.</p>
      <p>Bert was one of the principals of PDR (Pastore, Di Pamphilis and Rampone) a large type house. He worked hard trying to get WTC into mainstream type markets. I've met with Bert and Tom Carnase several times at the PDR/WTC office in NYC and had a good working relationship with Bert.</p>
      <p>Yes, I'm old, but I'm back in style!</p>
