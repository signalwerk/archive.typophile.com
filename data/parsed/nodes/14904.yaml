    html: <p>The original type spec for the Unigrid was Helvetica and Century. In the examples I reviewed the Century never seemed to worked right. Too much contrast and it looked too fragile for text, which is why, I believe that the typographic identy of the NPS deteriorated over the years (too many font substitutions in text applications). Thee was also a problem with exactly which Century was to be used. Different contractors around the country used different cuts of the design. The NPS had some customized Century fonts that I believe were based on ITC Century and had their spacing adjusted for 24pt and 36 pt use. (which sould have been text size for the wayside exhibits). I agree with William that the new fonts work better, but I am a bit biased.</p>
