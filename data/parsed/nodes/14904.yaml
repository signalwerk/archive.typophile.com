      <p>Like with anyone, you have to take the bits and pieces and formulate your own opinion. While Vignelli certainly has his points, he is also inherently flawed as are all humans. </p>
      <p>I looked at a lot of Vignelli's work recently, his plan for the New York Subway (considering what it once was) was actually brilliant. In some instances a firm grid structure is necessary. Where the flaw ultimately arose as I saw it, was the lack of flexibility on the plan. A plan too rigid will eventually have holes. Life is always in a state of flux, and city planning also needs to reflect that reality.</p>
