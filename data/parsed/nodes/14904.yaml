      <p>The Unigrid system was designed by Vignelli in the '70s as a system that could be used by other designers to implement his initial design for material handed out at National Parks.  Admittedly the better designs were done early on by Massimo himself as pilots.  The system in actual use by the Park Service done by internal designers and contractors is a vast improvement over previous Park Service all-over-the-place designs but individual usages vary with the ability of the designer.  You can see examples at any National Park.  I will look through my old stuff and see if I an find one Massimo actually did.</p>
      <p>ChrisL</p>
