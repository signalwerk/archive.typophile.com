    html: <p>I've always had a lot of respect for Vignelli -- I don't necessarily agree with all of his views, but he's good at what he does. There's an issue of Print that has a great interview in which he states something about American designers always desiring something new as opposed to perfecting what you know is good design. He believes that he is continually refining his style through the use of grids and a select few typefaces. When asked about the similar look that permeates his work, he replied by saying his clients all "receive the fruits of his garden" or something like that. The Garamond he prefers is actually Monotype's, I believe, and he also likes Century (as seen in the architectural publication "Oppositions"). He and Kit Hinrichs have a lot in common in my opinion.</p>
