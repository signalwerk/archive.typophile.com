      <p>"The problem is that his philosophy, in fact<br>
      his entire being, seems to be anti-Design."</p>
      <p>Perhaps anti Hrant's philosophy on design?<br>
      Massimo's design philosophy differs greatly from mine but I don't feel my take on design is "the one and only true path," I feel Design is defined by the totality of all differing methods and philosophies.  To limit it to one way of thinking would reduce greatly the possibility of innovation. We all benefit from the diverse thinking possible with an open and unbiased mind. There is plenty of room on this Earth for Massimo, Hrant, James, Norbert, Joe, Tom, Dick, and Harry, Paula, April, Zusana, Tiffany, Jose, Alessandro, Otl, Costa, Hiroshi, Zoltan, Hassan, Mustafa, Reggie, Dmitri, Yolanda, Mitko, Olga, . . . </p>
      <p>ChrisL</p>
