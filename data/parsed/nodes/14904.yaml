      <p>I met Massimo a number of years ago (1976?) when he was working on design projects for the U.S. Government. I found him to be open, bright, and helpful--certainly NOT aristocratic or snobby. It is easy to be a Monday Morning Quarterback and dump on work done in previous times.  I guess some people feel that by dumping on someone, you can raise your own sense of worth. It is fine to disagree with his philosophy but you can't take away his right to have his own philosophy. Massimo chose to work with a small set of tools and he used those tools quite well in my un-reknowned opinion. I have seen plenty of designers out there over the years who have used every typeface known to man and poorly. There is no one way to work. How many types did most people use who were trained in the '50s? Yes, he was a modernist--I know that is a dirty word to some people around here and I don't want to start that battle again (if you do, just do a search and you will find it).<br>
      Back to answering the question:<br>
      The work of Massimo's of which I am familiar, was clean, well thought out, and highly structured (in a good way). Besides the expected use of Helvetica and Bodoni, flush left on a grid, he also did a very nice redesign of Federal documents in a traditional style using Century.  If we ever get posting graphic files back, I will scan and post a sample.</p>
      <p>ChrisL</p>
