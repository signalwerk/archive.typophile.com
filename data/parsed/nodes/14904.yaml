      <p>I am of the school of exploration, experimentation and "breaking the rules." Being brought up in Manhattan from birth through college, you might have an insight to my irreverant humor.</p>
      <p>I easily related to Lubalin's style of work, as well as being completely comfortable having beers and laughs with Ed Benguiat. As a student of design, I stood in awe of Bradbury Thompson, Paul Rand and yes, for a short while, Massimo Vignelli.</p>
      <p>There are designers that approach each project with a clean slate and open mind, and there are designers that impose solutions with a kind of righteousness. I feel Vignelli and Aicher can be considered the later.</p>
      <p>The sessions I had spent with Otl Aicher were enlightening. I came to view Aicher as an old Samurai, highly trained and skilled, a veteran of many battles on the design front, and faithful to a rigid sense of order. I may not have agreed with all of his solutions, but I respected his approach and his need to explore within himself.</p>
      <p>I have not met Mr. Vignelli, so I have no real basis for my impression, but I sense a sort of aristocratic arrogance in his posture. That being said, I rather spend my life in pubs with friends after hard battles than to live in a manor with fat royalty.</p>
      <p>------------------------------<br>
      Yes, I'm old, but I'm game!</p>
