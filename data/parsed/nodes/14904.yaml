      <p>"...I’ve got to think using Frutiger and NPS Rawinson is better than the Helvetica that I assume Vignelli used!"</p>
      <p>The Unigrid predated Frutiger by about 10 years. There are any number of typefaces I prefer to use over Helvetica.  The point of the system was consistent look and feel. The only prayer of getting consistency in Government design is by speccing a type that is universally available. Government contracting procedures make design very difficult.  There are numerous clauses like "or similar" to open contracts to as many vendors as possible. Sadly, low-bidder rules.</p>
      <p>ChrisL</p>
