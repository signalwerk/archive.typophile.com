      <p><strong>MASSIMO VIGNELLI</strong><br>
      Quote transcribed from<br>
      <strong><em>Graphis Typography 1</em>, 1994</strong></p>
      <p>"In the new computer age, the proliferation of typefaces and type manipulations represents a new level of visual pollution threatening our culture. Out of thousands of typefaces, all we need are a few basic ones, and trash the rest."<br>
       --Massimo Vignelli<br>
      --------------------------------------------------------------------</p>
      <p><strong>From <em>Our Bodoni</em>, World Typeface Corporation.</strong> 1989.<br>
      Type release specimen brochure</p>
      <p>Over the past 25 years we have wanted compatible serif and sans-serif typefaces. When Bert Di Pamphilis of the World Typeface Corporation, New York, asked us to design a new typeface, we told him that we do not believe in "new" typefaces, but that there was room for improvement on existing, classic typeface designs. We consider the ratio between upper- and lower-case Helvetica letters to be the best there is. We wanted to redesign Bodoni using a similar ratio between the cases, with short ascenders and descenders; and articulate the type in four weights: light, regular, medium, bold. We worked on this project with Tom Carnase, undoubtably one of the very best type designers in the world. We were quite pleased with the results of our efforts, and we plan to apply the same concept to a few other classic typefaces, such as Futura, Century and Garamond.</p>
      <p>--------------------------------------------------------------------</p>
      <p>Yes, I'm old, and I used more typefaces than Massimo!</p>
