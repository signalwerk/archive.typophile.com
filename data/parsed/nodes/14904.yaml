      <p>&gt;modernist—I know that is a dirty word to some people</p>
      <p>I am not doctrinaire about this. I don't believe in modernism as a philosophy, but I do think there has been excellent type design (eg. Futura) and typography (eg. early Tschichold) influenced by modernism. Generally, I think the modernist influence in type has been much more benign than in architecture. </p>
      <p>The Vignelli teapot and plates are quite nice--did he or his wife design them? I'd like to see examples some of Vignelli's typography that people admire, such as the 'Unigrid solution' James speaks of.</p>
