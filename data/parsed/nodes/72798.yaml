    <p>A friend and I are designing a website to be used for a software development company. The font chosen is in the attached image. My knowledge regarding fonts is pretty subpar but the font doesn't really strike me as suitable for a software development company.</p>
    <p>If you guys have any ideas for fonts that could work here, it'll be great. I'm not looking for something overly techy persay (although I'm up for suggestions), just something that'll will work for a software firm.</p>
    <p>I'm not averse to paying for a font, however I would prefer something free or not too expensive (I'm happy to pay $30 but not much more at this point in time).</p>
    <p>Sorry if I've been a bit vague. Any ideas will be much appreciated.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_6423.png"></div><p></p>
