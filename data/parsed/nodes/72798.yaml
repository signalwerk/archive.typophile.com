      <p>It’s hard to give good advice unless you tell us more about the firm and how they want to come across to their potential customers, but I think this one might be just a little too techy (as in y2k) for a software developement company.</p>
      <p>Here are some other squarish fonts from <a class="freelinking external" href="http://www.typodermic.com/" rel="nofollow">Ray’s</a> massive catalog:</p>
