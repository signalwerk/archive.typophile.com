      <p>Zainer's imperfect impressions: fifteenth century printing methods<br>
    ==================================================================</p>
    <p>The fifth annual Justin Howes memorial lecture</p>
    <p>   * Tuesday 23 February 2010 at 7pm<br>
       * In the Bridewell Hall, St Bride Foundation<br>
       * Admission is free but by pre-booked ticket only</p>
    <p>How did the first printers achieve the (almost impossible) task of getting crisp impressions of inked type onto paper, evenly, clearly and repeatedly? Well, quite often they did not manage it - this lecture will illustrate how some of the various faults and imperfections found in early printed books provide clues to fifteenth-century printing methods.</p>
    <p>Claire Bolton has worked for over 35 years as a letterpress printer - researching, writing, designing, hand setting the type, printing pages on a hand press, and binding books in limited editions at her Alembic Press. Running the Press fostered a lifelong interest in the history of printing, paper and bookbinding, which formed the subject matter of many of the Press's 100 editions.</p>
    <p>A few years ago she decided to put her practice into theory and began to research fifteenth-century printing practices. This gave her the excuse to spend many happy hours looking at incunables; her resulting PhD thesis will be published by the Oxford Bibliographical Society in 2010.</p>
    <p>- * -</p>
    <p>There are still tickets available for this talk. The tickets, which are free, are booked at EventBrite:<br>
    <a href="http://zainersimperfectimpressions.eventbrite.com/" title="http://zainersimperfectimpressions.eventbrite.com/">http://zainersimperfectimpressions.eventbrite.com/</a></p>
    <p>Refreshments will be available before the talk and the Library's shop will be selling books (payment by cash or cheque only).<br>
    . . . . . . . .</p>
