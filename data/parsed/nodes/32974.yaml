  html: |-
    <p>I'm having a problem with the modifiers that one can apply to characters within Generate Glyhps. They all seem to work except for the one I really need - the '~" symbol. (^&lt;&gt;| all work). Has anyone noticed this? Am I crazy? I even pasted the exact string of text from the PDF (page 522) and it didn't work. This is OSX 10.4.9 and FLS5 5.0.2<br>
    Thanks</p>
