  html: <p> I still love using that “old” software Pixar Typestry 2.1.2b3 to do some whacky 3D typestuﬀ. Some time ago i got myself a dual processor <span class="caps">G4</span> running on Mac <span class="caps">OS</span> 9.1 and now i can’t load any looks, textures, lights etc. anymore. It’s not the system because the software is running just ﬁne with <span class="caps">OS</span> 9.1 on my old PowerPC. Anyone know how to ﬁx this problem? Pixar unfortunately does not oﬀer any kind of support for Typestry&nbsp;anymore. </p>
  html_clean: <p> I still love using that “old” software Pixar Typestry 2.1.2b3 to do some whacky 3D typestuﬀ. Some time ago i got myself a dual processor <span class="caps">G4</span> running on Mac <span class="caps">OS</span> 9.1 and now i can’t load any looks, textures, lights etc. anymore. It’s not the system because the software is running just ﬁne with <span class="caps">OS</span> 9.1 on my old PowerPC. Anyone know how to ﬁx this problem? Pixar unfortunately does not oﬀer any kind of support for Typestry&nbsp;anymore. </p>
