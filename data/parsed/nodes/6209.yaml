    html: '<p> duuuuh, it’s sometimes the simple things that solve a complicated problem, i guess. i thought i did copy everything, but after your post, Rodi, i thought i should maybe do it again … and now it works perfect again! thanks for … whatever. <br><br>for all of you reading this thread, interested in pixar typestry, i’ll post a mail i got from pixar’s customer support: <br><br>&gt; No, Pixar never did sell the rights to Typestry to anyone. <br>&gt; It was simply discontined, and suppport stopped one year <br>&gt; later. <br>&gt;  <br>&gt; I will agree with you that it was a fabulous product, but <br>&gt; Pixar restructured at that time, and moved out of <span class="caps">PC</span> and Mac <br>&gt; products to concentrate on movies, and high end rendering  <br>&gt; software. <br>&gt;  <br>&gt; We’re glad that you enjoyed the product.  Most reviews, and <br>&gt; responses from customers was overwhelmingly positive. <br>&gt;  <br>&gt;  <br>&gt; Thanks, <br>&gt; Pixar Customer&nbsp;Support </p>'
