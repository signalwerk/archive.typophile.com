      <p><em>The 1948 date in that Wiki article refers specifically to network broadcasting. The same article gives the 1941 date for the first US commercials, albeit without the WNBT reference.</em></p>
      <p>True enough, but a trivial distinction: a mass medium does not become a mass medium until it is accessible to the masses. As opposed to the ubiquity of print, television required the purchase of a receiver, in order to mesmerize with its Dancing Scan Lines—a different kind of cool, if you dig McLuhan. Today, it is pixels which do the dancing, constantly seducing us to part with our money to assert our precious individuality: Lord, what fools these mortals be.</p>
      <p>From 1981 to 1984, I worked as an Art Director for KXAS-TV, the NBC affiliate in Fort Worth-Dallas. The station came on the air as WBAP (We Broadcast a Program) in 1948 as the first TV station west of the Mississippi, the love-child of Amon Carter, publisher of <em>The Fort Worth Star-Telegram</em>. A few years before I arrived, the station was purchased by Lin Broadcasting as a cash cow: the station routinely generated a 55% profit margin. BTW, Lin was one of the pioneers in developing cellular phone technology.</p>
      <p>At the station, I had the privilege of working with professionals who had been there since the beginning—people like Dick Smith, who was Chief Engineer. I became a Grasshopper, and learned well at his feet. State-of-the-art technology at the time also occasioned my first foray into font-making—creating bitmap fonts for the station’ Chyron IV character generator.</p>
    html_clean: |-
