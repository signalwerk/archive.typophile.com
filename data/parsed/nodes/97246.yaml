      <p>The thing is though, that book, Alfa Beta, was actually written by the man who created Microgramma.  Could he be lying about it's construction, throwing out a red herring if you will, in an attempt to confuse and slow down his competition?  Sure, but it seems a bit much, considering no one was forcing him to write that book, and that writing that book probably took a good deal of his time, and that when it was published, Novarese might only have had a handful of real competitors.  I believe he really was explaining how he drew and constructed faces.</p>
