      <p>I know that a book about fractals used the question "How long is the coastline of Britain" to introduce the idea to the reader.</p>
      <p>Some fractals existed before Mandelbrot, such as the "dragon curve"; but Mandelbrot can be credited with the investigations that led to fractals being recognized under a unifying concept. This led to the conceptual framework that let mathematicians come up with such things as Hausdorff-Bescovitch dimension, for example.</p>
      <p>Fractals are relevant to such things as painting trees and leaves; fonts tend not to need to be natural and wild. But mathematics did touch on some fonts - such as Piet Hein's superellipses giving rise to Melior.</p>
