      <p>The question was once famously asked, “How long is the coastline of Britain?”—the answer being that it depends on the amount of detail in the measurement method. (This was the primary consideration that led to the invention of fractals.)</p>
      <p>A similar principle applies to type outlines; any glyph shape can be rendered with straight lines and look sufficiently smooth if the curves are divided into enough straight segments, and rendered at an appropriate resolution (Licko’s <em> Journal</em> springs to mind). The idea is that a complex line may be broken down into an appoximation by using shorter components of a less complex type. There are four or more levels of line complexity (according to the sophistication of one’s maths): straight, circular, oval, quadratic…</p>
      <p>Certainly, if one restricts a type design to the simpler lines, there is the danger of banality.<br>
      It helps a designer working in a simple mode to be familiar with complex curves, because this facilitates a subtlety of expression (by hand and eye) which mitigates the potential for crudeness and banality; two examples—for instance, firstly, how much should be “shaved off” the transition point between straight and curved? (See my post of Oct. 16) And secondly, what is the relationship between the radius size of the curves used in /m, /n and /o?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Karelia_mno_4641.png"></div><br>
      Thirdly, how big should the overshoot alignment zone be?<br>
      And so on.<br>
      There is arguably less leeway in determining these subtle parameters of a type design in types based on simple modular forms, than there is in more complex types.<p></p>
