      <p>@Nick Shin - "Commercial TV programming started in 1948 in the USA."</p>
      <p>Not sure what that had to do with the topic, other  than the CRT, but ...</p>
      <p>We got our first TV set, a 7 inch RCA, in 1947. By then there were three broadcasting networks, NBC, (WNBT), CBS, and ABC (WJZ-TV), each carrying one of the New York City baseball teams. Licensing for commercial TV started on July 1, 1941; the first US advertising was on WNBT as part of its test pattern (Bulova Watch Time) that same day. I first saw TV in 1940 at the 1939 NY Worlds fair, but not again until early 1947.</p>
      <p> - Herb</p>
