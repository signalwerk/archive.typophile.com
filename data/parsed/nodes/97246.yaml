      <p>Hmmmm, I think I may have gone about asking this question wrong.  </p>
      <p>The point was not what that face looks like or if anybody uses perfect circles or straight lines, what I was trying to ask is if any of you start out with a bunch of circles, some of the circles divided into halves and quadrants; and then once they have drawn those how they like, then drawing the outlines on top of them.</p>
      <p>So in the example above, the designer would start with all the shapes that are dotted lines, and then only after he had arranged those shapes how he wanted, would he draw the outlines by connecting the shapes.</p>
      <p>I know I've seen a bunch of diagrams like this in books about type design, the idea is hundreds of years old.</p>
