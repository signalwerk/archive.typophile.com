      <p>A bit later (c.1960), I was  at an aerospace company doing Fortran programming, creating graphs for aperture cards (IBM cards with space for inserting a 35mm film frame), using an IBM 740 CRT recorder to make the film inserts. The 740's built-in alphabet existed in only one size and had no lower case. I programmed a set of machine language subroutines, including very simple point-to-point vector-defined characters  that could be called from a Fortran program. The user could call the text subroutine, passing it information defining a text string,  its location, direction, and size (in mm, if I remember correctly, but it might have been in hundredths of inches).</p>
      <p><a class="freelinking external" href="http://www-03.ibm.com/ibm/history/exhibits/701/701_1415bx40.html" rel="nofollow">The IBM 740 CRT Recorder</a></p>
      <p> - Herb</p>
