      <p>Hrant: <em>And we might have never had Baskerville (and then Bodoni, who was an admirer of Baskerville) without [the Romain du Roi].</em></p>
      <p>The Romain du Roi was commissioned in 1692, and not actually in use until 1702. By that date, John Ayres and George Shelley had already perfected the style of the English Roman on which Baskerville's types are based. The earliest expression of that style that I have so far found is John Seddon's of 1690, i.e. two years before the commissioning of the Romain du Roi. The line of Baskerville's development is so obviously in this English tradition, that I don't think any connection can be made between his types and the RdR.<br>
      ______</p>
      <p>And then there's this, which I came across in a recent Oak Knoll catalogue. This is the title page of a  prayer book written by Louis Senault and dedicated to Marie Anne Christine Victoire of Bavaria, who in 1680 married the French Dauphin.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/prieres_3888.jpg"></div><p></p>
      <p>The book is undated, but indications are that it was produced in the 1680s. That lowercase in 'Sainte Ecriture' shows clear indications of being written with a split nib, resulting in the pattern of stroke modulation and vertical stress that characterises the letters of the Romain du Roi (and which are not determined by the construction method of the RdR; as Durer, Tory and numerous others had long since demonstrated, geometric approaches can just as easily produce diagonal stress).</p>
      <p>James Mosley, in his essay on 'Les caractères de l'imprimerie royale', has already drawn his attention to the influence of the written romans of Nicolas Jarry and Louis Senault on the design of the RdR, some of the former's dating from as early as 1668. I'd go so far as to say that Grandjean's actual RdR types owe more to Jarry and Senault than they do to the committee's constructivist experiments.</p>
      <p>So in terms of the development of neo-classical typography of the mid-18th Century, I posit two lines of development:<br>
      French : Jarry/Senault -&gt; Grandjean -&gt; Fournier<br>
      England : Seddon -&gt; Shelley -&gt; everyone else* -&gt; Baskerville</p>
      <p>* By the 1730s, the 'English roman' shows up in the standard repertoire of every writing master whose work I have examined. No exceptions.</p>
      <p>The interesting question, then, is whether these French and English developments were independent pursuit of the same goal -- development of a style of type-like lettering better suited to neo-classical layout and ornament than the actual types of the 17th and early 18th Centuries --, or if Seddon was aware of what was happening in France. I'm inclined to think that the developments were independent, at least in terms of the evidence of the actual writing that resulted. There are distinctive differences in the solutions for some letters that persist in the writing and types of the 18th Century that are identifiably French and English.</p>
    html_clean: |-
