      <p>Trade your freedom and creativity for circles and straight lines! Yep...</p>
      <p>It's a task which seems fairly easy, because of it's obvious constraints: one ‘just has to be systematical’. Choose your radii and draw a shape over different circle contours that resembles the character you're trying to draw somehow. But I think the easier a task, the more careful and precise you must be with details.</p>
      <p>Something I find very difficult about it is, for example, the transitions from curved to straight lines. The sample Nick shows does this pretty well, but Struktur shows a few flaws.</p>
