    <p></p><div class="imageWrap"><img src="http://typophile.com/files/delve_fonts_website_sm_4543.png"></div><p></p>
    <p>For Immediate Release:<br>
    Alameda, CA- February 3rd, 2010</p>
    <p>Delve Fonts announces its new website has been launched. <a class="freelinking external" href="http://www.delvefonts.com/" rel="nofollow">http://www.delvefonts.com/</a> To celebrate, the <a class="freelinking external" href="http://www.delvefonts.com/specials.html " rel="nofollow"> Delve Fonts Typeface Library is 50% off</a> during the month of February. Additionally, the site now features online ordering with instant downloads.</p>
    <p>Recent additions to the the collection include: <a class="freelinking external" href="http://www.delvefonts.com/rieven_uncial.html " rel="nofollow"> Rieven Uncial</a> by Steven Skaggs, recipient of a TDC² 2010 “Certificate of Excellence in Type Design” (available 4/10/10), <a class="freelinking external" href="http://www.delvefonts.com/quara.html " rel="nofollow"> Quara</a> by Delve Withrington, and <a class="freelinking external" href="http://www.delvefonts.com/cody.html " rel="nofollow"> Cody</a> by Cody Chancellor.</p>
    <p>Select Delve Fonts are also now available for use on the Web via <a class="freelinking external" href="http://typekit.com/foundries/delve-fonts/ " rel="nofollow"> Typekit</a>.</p>
    <p>Sign up to receive the Delve Fonts newsletter: <a href="http://www.delvefonts.com" title="http://www.delvefonts.com">http://www.delvefonts.com</a></p>
    <p>Follow Delve Fonts on Twitter: <a href="http://www.twitter.com/delvew" title="http://www.twitter.com/delvew">http://www.twitter.com/delvew</a></p>
    <p>Become a fan of Delve Fonts on Facebook: <a href="http://www.facebook.com/delvefonts" title="http://www.facebook.com/delvefonts">http://www.facebook.com/delvefonts</a></p>
    <p>Delve Fonts is a full-service type foundry in Alameda, CA offering designers exclusive new typefaces and Type Services including: Custom Type Design, Fonts for Mobile Devices, and Foreign Language Fonts.</p>
    <p>###</p>
