    <p>I don't even know how to form my question. So please excuse my inexperience in the area of Chinese typography.</p>
    <p>I am on Mac osx 10.4.10 using CS2.</p>
    <p>A client has provided a tiff of three Chinese characters they wish to use in a logo.<br>
    The logo will be comprised of both english and Chinese characters.</p>
    <p>The challenge is I don't know how to activate chinese fonts on my system.<br>
    They appear in my font menu but english characters appear when selected in Illustrator.</p>
    <p>How or what do I need to do to use Chinese characters? Thanks in advance for your insights.</p>
