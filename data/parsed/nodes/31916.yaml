  html: |-
    <p>Hello,</p>
    <p>I am wondering about the possibilities to modify the alias.dat file to match the encoding file I’m using. It seems rather obvious what to do, but it doesnt work.<br>
    For example:</p>
    <p>In the encoding file these exists:</p>
    <p>O<br>
    o.small<br>
    hungarumlaut<br>
    ohungarumlaut.small</p>
    <p>In the alias.dat, I added these values:</p>
    <p>o.small O<br>
    ohungarumlaut.small o.small+hungarumlaut</p>
    <p>Shouldnt it work? I’ve restarted FontLab 5.02, but not the computer but it does not work as I want to.</p>
    <p>Is there something else I need to “adjust”?</p>
    <p>Thanks in advance</p>
