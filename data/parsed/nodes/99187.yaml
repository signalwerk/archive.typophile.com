  html: |-
    <p>The printing company where I work has produced letterhead, envelopes, and business cards for this customer since 2004, and we inherited the dies from another company, so I don't really know how old they are.</p>
    <p>The upper line in the sample is from the letterhead, the second from an envelope, and the lower from the business card. At first glance (only) I thought they were the same, but the more you look, the more differences you find.</p>
    <p>The name is all we have; the address, etc. appears to be AT Sackers Gothic.</p>
    <p>The normal online automatic ID sites have come up blank. I'll check my books tonight, but I have more hope for the forum's collective knowledge.</p>
    <p>Even allowing for old, worn dies, these letters are so crude, with so many variations, that I wonder if they were hand-drawn. The other possibility that occurs to me is that they from pantograph engraving fonts that have never been digitized.</p>
    <p>Any suggestions will be much appreciated.</p>
    <p>Thanks, and Happy New Year!</p>
    <p>-Eric<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/img-Z27143637-0001_6371.jpg"></div><p></p>
