  html: |-
    <p>Greater Albion Typefounders is pleased to offer a selection of it's chief designer, Paul Lloyd's earlier free typefaces from it's <a class="freelinking external" href="http://gatf.wordpress.com "> blog</a>.</p>
    <p>Four families are being offered: Brassett, Chocolate Box, Imperator and Tinplate Titling.</p>
    <p>These fonts don’t have the extensive character sets that you expect to find in our commercial offerings, but they are fully licensed for any commercial, educational or commercial use.  They are offered in Truetype, Type 1 or both formats.  </p>
    <p>Remember there are also some free faces amongst our collection on <a class="freelinking external" href="http://new.myfonts.com/foundry/Greater_Albion_Typefounders/ "> Myfonts.com</a>.</p>
