  html: <p>I’m having issues with variations of a font within the same family not working. I have individual ttfs for all the different “versions” of the font, MrsEaves (MrsEavesRoman, MrsEavesItalic, MrsEavesAllSmallCaps, MrsEavesSmallCaps and MrsEavesPetiteCaps)  MrsEavesSmallCaps, MrsEavesPetiteCaps and MrsEavesRoman take on the identity of MrsEavesItalic when previewed. Any idea why the other 2 would work fine but those 3 do not? Any help would be greatly appreciated!</p>
