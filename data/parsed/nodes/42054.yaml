    <p>In a photograph of Obama with campaign signs in the background, I was surprised to have a "brand recognition" moment - I usually tune out advertisements.  Obama's campaign signs use the same type and sensibility as his markedly well-done website.  The branding of politicians is as old as politics itself, but this level of coherence between a campaign website and other marketing materials seems new. (Oh my goodness, <a class="freelinking external" href="http://jewsforobama.blogspot.com/2007/08/obama-08-yarmulkes-for-sale.html" rel="nofollow">Obama-kahs</a>!)  </p>
    <p>This <a class="freelinking external" href="http://www.underconsideration.com/speakup/archives/004262.html" rel="nofollow">article &amp; ensuing debate</a> are all about Obama's site design, with a focus on type, and I want to hear Typophiles' thoughts on all this.  </p>
    <p>What do you think of Obama's site?  Of the use of type?  Do you think voters will respond to coherent design negatively as well as positively, feeling too advertised to?</p>
    <p>Disclaimer: I am letting my political nerdiness and design nerdiness intersect, but I'm not trying to proselytize for anything but good design.</p>
