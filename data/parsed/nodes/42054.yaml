      <p>I must admit I've not read the article now as I read it and a couple of others like it a few weeks ago. The whole branding debate is definitely interesting and Obama's is certainly the most well thought through of all of them. Whether people are turned on or off by this is a good question. I looked at all the candidates' sites a while back and Obama's communications are certainly more mature than the rest of them.</p>
      <p>As an Englishman, looking over the pond – and hoping beyond all hope that American's can't do to the rest of the world what they did the last two times – it's interesting to note the use of two Gill typefaces, Perpetua and Gill Sans. I'm an ardent fan of Gill, who, born in my own home town, I find sums up a certain 'Englishness' despite his, erm, 'scandalous' family life. (Read on). Gill was a very political man, espousing a set of values based on a Catholic 'third way' called Distributism. I doubt any of the candidates, even Barack Obama, who I believe is dubbed an arch liberal in the States, will be ditching the markets and the trappings of capitalism too soon though.</p>
      <p>Perpetua is seen and spoken of less than Gill's Joanna, but it stands tall and elegant. A stonecutter's script. Gill Sans on the other hand is so ubiquitous I usually start yawning when I see it these days. Together they go quite well, despite not having been designed to do so. It works politically too: traditional Obama and modern Obama.</p>
      <p>I suppose one might take these literal comparisons too far. It depends whether the designer thought a bunch of type obsessives would retrospectively overanalyse things. Gill though is such a strong character, and so political that it's hard not to ask the questions. Amongst other things he was deeply religious (he converted to Catholicism), part of a movement that ran contrary to that of the times (arts &amp; crafts rather than Modernism) and was sex obsessed, in practice (he bedded mostly every woman he came across including his daughters) and in his output work (you should see his naughty sculptures).</p>
      <p>Does Obama or the rest of America care about this? Probably not. Interesting though, what a modern politician pins to himself isn't it?</p>
