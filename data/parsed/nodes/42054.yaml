      <p>I've recently become very interested in political branding. I think that most every designer would agree that Obama has far and away the best "brand" and to my knowledge it is a fairly new look for political campaigns. It would seem that Obama is the first to create a sophisticated brand to push with. (The Change ad, his logotype, website.) Of course, politicians are the kings and queens of sound bites, which I suppose could be verbal brands.</p>
      <p>To those that work on political campaigns, what considerations are important? Political branding seems mostly marked by blandness. (and of course the obligatory red white and blue.) Is mostly caused by an attempt to reach the most people possible? Do candidates shy away from pressing the envelope, or is there a tried and true Poly Sci formula for this?</p>
