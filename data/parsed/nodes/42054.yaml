      <p>I worked as the Creative/Web Director of a (winning) congressional campaign in the last US election cycle. Even at that level it was an interesting experience. Campaigns have a strong 'just get it done' mentality that leads to a lot of instances where consistency is not maintained. </p>
      <p><em>Mostly, it was me chasing down 24 y/o interns, lecturing them about branding and how "Broadway" will never be an appropriate substitution for "Interstate."</em></p>
      <p>It's common for all campaigns to outsource work to 'go to' guys for particular projects like bulk mailings, union printers or tv commercials and that's where things fall apart.</p>
      <p><em>Nothing like seeing your established logo, horizontally tracked 50%, flash at the end of a TV commercial every 20 minutes leading up to election day!</em></p>
      <p>Great thread!</p>
      <p>Eric Z Graphic Design (Print/Web/Interactive)<br>
      <a href="http://www.eric-z.com" title="www.eric-z.com">www.eric-z.com</a><br>
      <a href="http://www.typeissexy.com" title="www.typeissexy.com">www.typeissexy.com</a></p>
