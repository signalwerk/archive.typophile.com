    html: <p>The interesting thing about that other thread on this subject is that it was just over a year ago. We would have to say that the formal aspects of Obama's logo now carry more meaning with our experience of the campaign as well as our increased familiarity with the politician. I may still take issue with some aspects of the logo's construction (that babyish shade of blue still totally bugs) but over the last year the Obama marketing machine has been highly organized, deliberate and creative. Certainly more so than the other candidates. And now he is in a very good position. Nothing succeeds like success, and it's hard to not see that when appraising the logo today.</p>
