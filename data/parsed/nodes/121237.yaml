    <p>Hey everyone!</p>
    <p>I found this book called “PALETTE 01. Black &amp; White. New Monochrome Graphics” from viction:ary (<a href="http://victionary.com/product/p01-bw/" title="http://victionary.com/product/p01-bw/">http://victionary.com/product/p01-bw/</a>) and I loved this font they used on some quotes and all the paragraph texts which in my head looks a bit like Rockwell but an stencil version. </p>
    <p>I've seen online a few slab serif fonts but they are not as nice as this one. Does anyone know which font is this one? I took a very bad picture at the book store and found a few more online from the book.</p>
    <p>THANKS!</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Stag Stencil        </div>
            </div>
    </div>
