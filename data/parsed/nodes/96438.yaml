    <p>Hi,</p>
    <p>I've designed a logo with Sackers Gothic Heavy and I am looking for a complimentary font to use on the business card. </p>
    <p>I want an extremely clean, masculine, high design look for a tech company but I'm trying to steer clear of the 'tech company' look. I'm actually going for a mid-century engineering/aerospace look without getting at all 'themed' but it's a fine line.</p>
    <p>The fonts that are clean enough end up making the whole thing look drab and the fonts that seem to have some interest seem to be to much for the logo and take the whole thing away from clean. </p>
    <p>At this point I'm thinking a light sans serif that I can use in all caps on a tight grid with A LOT of white space. But I'm open.</p>
    <p>Everything I try looks ridiculous. Any thoughts would be appreciated.</p>
    <p>For an example of where I'm heading, I'm also working on a website design right now. It isn't finished, I still have a lot of design issues to work out and bugs to fix.  <a href="http://www.p-ns.com" title="www.p-ns.com">www.p-ns.com</a> </p>
    <p>Also, my client loves Helvetica but I think there must be something better for Sackers out there.</p>
    <p>Thanks in advance,<br>
    Cheryl</p>
