      <p>&gt;  5$ for logo design</p>
      <p>That is a very bad strategy.  What would you think if a plumber or accountant or electrician advertised that he worked for $5?  You'd assume that he wasn't any good. </p>
      <p>If you're a beginner trying to build your portfolio, a better approach is to do free work for local charities and non-profit groups to build your portfolio, and take a part-time job to pay the bills. Maybe do freelance design work for a more established designer. After you've gained some experience and built up your portfolio, you can start looking for paying clients who will pay realistic fees that reflects the time and effort you put into your designs.</p>
