      <p>How about a slab serif? It could have a retro feel but not outdated and work well at text sizes. Good contrast will be hard to achieve with sans + sans. Go with some contrast and good readability at text sizes.<br>
      Pragmatica Slab? Serifa? Or something along those lines?</p>
