    html: <p>Hi Klaus, <br> <br>My name is Jimmy from Indonesia and I am very new to Fontographer, in fact I was about to learn. I was searching for an online fontographer tutorial on Google.com and your site came up in the search result list. <br>Then I saw this thread on Typophile Forum and pretty surprised that you're the guy who made the tutorial site. <br>Thank you very much, Klaus ! Your tutorial is great especially for someone who's learning Fontographer from zero like me. <br>I you don't mind, could you add more tutorial into it because i need help understanding how to set the metrics, the kerning points,etc...cause, you know, i'm learning from zero. <br> <br>Sorry for asking too much rather than giving you a comment or compliments. Once again, thank you very much for your tutorial.</p>
