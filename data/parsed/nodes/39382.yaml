    <p>Hi, I've been browsing for a while trying to find the name of the font used on the sugar daddy/ sugar babies candy but have had no luck. If someone can please let me know what font they think it is I'd be very thankful. Here's a link to a pic of the font <a href="http://tootsie.com/img/sdSbLogo.gif" title="http://tootsie.com/img/sdSbLogo.gif">http://tootsie.com/img/sdSbLogo.gif</a> (I've also added it as an attachment).</p>
    <p>Thanks again</p>
