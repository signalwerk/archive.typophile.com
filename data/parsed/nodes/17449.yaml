      <p>Is "Weserve" what you were going for?</p>
      <p>I would tend to want to take this even closer to a pixel grid, and make all the counters the same optical width as the strokes. I might try to bring more diagonals in too, since the one in the V seems a little lonely.</p>
      <p>That said I think what you've got already functions admirably, and if the client likes it that's a strong argument to leave everything the way it is!</p>
