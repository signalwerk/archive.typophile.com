    <p>Hello everybody,</p>
    <p>First of all I would like to say that I love this site. I'm relatively new here, this is my second post, but checking Typophile several times a day is already a daily routine for me.</p>
    <p>I designed this logotype for a webhosting company called W3SERVE. The letters are designed by myself. I think they are appropriate for this type of company. They are robust, a thing you also want to expect from a server, and are easily associated with computers and the internet. </p>
    <p>The client already saw the design and liked it, but maybe you have some critique and/or suggestions. Everything is welcome.</p>
    <p>David</p>
