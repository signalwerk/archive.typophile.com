    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a>: Michael Allard</strong></p>
    <p>Co-designed the Paisley typeface family with <a href="/wiki/Noel%20Rubin" class="freelinking" rel="nofollow">Noel Rubin</a> for <a href="/wiki/Image%20Club" class="freelinking" rel="nofollow">Image Club</a> in 1994. Michael is a freelance illustrator and cartoonist currently teaching animation at <a href="http://www.artsumbrella.com/" rel="nofollow">Arts Umbrella</a> in Vancouver, British Columbia.</p>
