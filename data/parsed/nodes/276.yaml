    html: <p> The Alphabet and Elements of Lettering isn't too bad, but it's not really about type design. I only paid $3 for it new (Dover edition) about twenty years ago. Of his books, Typologia is better. It gives some insight on his methods of designing and producing a font in metal. It's interesting reading even if you don't care for his designs. </p>
