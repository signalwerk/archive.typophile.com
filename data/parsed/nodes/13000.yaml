      <p>Rick Tharp’s Body Found<br>
      Positive identification was made last night July 18th after the Contra Costa Coroner’s office finished dental DNA testing.<br>
      Ricks body was found July 7th. Family members were not contacted until the news article came out in the Contra Costa times on July 15th and was spotted by a friend, who kindly called. Rick Tharp’s request to be cremated can now be carried out.<br>
      The Article in the Contra Costa News reads:<br>
      Coroner’s deputies are asking for the public’s help in identifying a body found floating in the San Francisco Bay.<br>
      The Yerba Buena Coast Guard recovered the body of a man south of the Richmond-San Rafael Bridge, west of the Richmond Shoreline near Red Rock on July 7, according to a press release.<br>
      The remains were turned over to the Contra Costa Coroner’s Office at the Richmond Marina.<br>
      An autopsy determined the man died of multiple blunt force trauma consistent with a fall from a bridge or other high structure, the coroner’s office said.<br>
      The coroner believes the body was in the water for about a month, making fingerprint identification impossible. Dental and DNA results are pending.<br>
      The victim was described as white or Latino and approximately 5-feet-8-inches tall. He was wearing Calvin Klein briefs with white-trim and black-and-gray Nike gym shoes without socks.<br>
      Other Information:<br>
      Designated contributions to the Rick Tharp Scholarship Fund can be made to: “Western Art Directors Club Rick Tharp’s Scholarship Fund” P.O. Box 996<br>
      Palo Alto, CA 94302<br>
      Information provided by: Lourdes Pollard Founder/President <a href="http://www.phoenixdatacenter.org" title="www.phoenixdatacenter.org">www.phoenixdatacenter.org</a></p>
