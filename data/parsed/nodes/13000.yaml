      <p>jlt, sadly these reports are true, I knew Rick since I was barely able to walk. He was one of my dad’s best friends, and in the last few months my father (Thom Marchionna) had been helping Rick out in trying to help him with work and his personal issues. Rick was one of those guys who I looked up to as a kid and still do, he was and still is the funniest and smartest men I’ve ever had the honor of knowing.</p>
      <p>Rick had been fighting depression due to his health, and while I know the details of what happened I feel it inappropriate to mention them here.</p>
      <p>However please contact me at <a href="mailto:isaac@lawndartdesign.com">isaac@lawndartdesign.com</a>. I feel it important that his friends honor Rick as the amazingly talented, smart, and funny man he was, rather then what his illness had made him become. A great human being I hope wherever he his he’s at peace.</p>
