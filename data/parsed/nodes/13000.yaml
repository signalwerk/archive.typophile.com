    date_raw: 14.Jun.2005 4.31pm
    votes: null
    html: <p>Rick was a great friend.  I have known him since our 2nd year at Miami University in 1971.  We shared a house in our last year there.  When I went to Australia in 1975 his was one the hardest goodbyes I had to make.  He was smart, witty and extremely fun to be around.  I have spent most of the years inbetween in Australia so haven’t seen a lot of him since then.  We kept in touch and I followed his career in what ever way I could.  Those of you who know him will agree that he was a brilliant graphic designer.  Not just in an artistic sense, but also in the wit and fun he incorporated in all his work.  I miss him enormously.  Yes he was a great human being.  I too hope that he is at peace.</p>
