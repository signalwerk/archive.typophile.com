    html: <p>This is a good start. But for this to work well you’ll need to spring for some contemporary fonts. Gill Sans just doesn’t connect well to contemporary high fashion, and that script is too pudgy and the simple flourishes look dated. Museo Sans or Gotham Light would work better, combined with one of <a href="http://www.veer.com/search/results.aspx?keyword=alejandro%20paul&amp;producttype=TYP" rel="nofollow">Ale Paul’s sweet scripts</a> should do the trick. You also need to crank up the volume with the color—this is sedate!</p>
    html_clean: <p>This is a good start. But for this to work well you’ll need to spring for some contemporary fonts. Gill Sans just doesn’t connect well to contemporary high fashion, and that script is too pudgy and the simple flourishes look dated. Museo Sans or Gotham Light would work better, combined with one of <a href="http://www.veer.com/search/results.aspx?keyword=alejandro%20paul&amp;producttype=TYP" rel="nofollow" class="link-external">Ale Paul’s sweet scripts</a> should do the trick. You also need to crank up the volume with the color—this is sedate!</p>
