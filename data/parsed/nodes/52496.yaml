    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_final2_3942.jpg"></div><p></p>
      <p>@faraqat Your comments were helpful! I have altered the angle of 'Date' and I think it does improve the 'D'. After lighting 'Moss' I then tried less weight and it I'm digging it. Originally I took the 'D' out of the 'M' the design lost something, but now that it is more balanced it doesn't seem to need it anymore.</p>
      <p>@jdewtt I really like Museo Sans for 'Moss'. I had a look at Neutraface, it's super nice! I would like to use it for future projects. I didn't like *some* of House Industries other type faces - I appreciate that they are well executed and in the right situation they would work but they wouldn't get into my top 20!</p>
      <p>@trickynicky I really like the pun as well. I'm not a big pun fan; a magazine I used to work for had a pun jar so I have been conditioned not to like them but in this case I found it hilarious and sharp witted. </p>
      <p>Your comment about underlining the pun played a part in bringing the logo into more balance. I think the improved balance goes a long way to underlining the pun!</p>
