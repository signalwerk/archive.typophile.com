      <p>To my eye, the "o" needs to be moved slightly to the left. My initial impression is that I would prefer a little more space between the two lines, but I can see how the overlap of the caps might not then work as well. Sometimes you fix one problem only to create another, and then one has to choose the lesser of two evils (although it is so much better to be able to choose the better of two "goods" -- smile).<br>
      &nbsp;<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;~~~~~~~~~~~~~~~~~<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>When going from </em>A to Z,<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<em>I often end up </em>At Oz.</p>
