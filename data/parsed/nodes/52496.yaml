      <p>Hello Doors. I was reading these coments and i'd like to add some considerations, in hopes this might help you. a) the word date seems to fall down to the right because of its hard angle, maybe it needs some compensation upwords; b) i don't like the thickness of the word moss, but if it's something you enjoy, then maybe it would work better if you tried to have it smaller but with more space between the letters, or with a lighter color; c) my eye gets fixed on the detail of the left top of the M in the middle of the D curve, i think it woul be interesting to take it off... ?<br>
      i'm sorry for my rough english... hope you understood my ideas :P</p>
