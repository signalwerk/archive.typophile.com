      <p>Libby, if you are just decoding Hebrew to pronounce prayers without understanding it as a language, which is the case for most American Jews, then I think "reading" is a fundamentally different problem. Also in Hebrew you have the Nikud, the vowel pointing, which makes the decoding process still more difficult. If you have meaningful language to connect symbols to then I think the process is easier. The symbols to words to sound and meaning is much more motivating than just decoding to sounds. Do you know any Japanese as a spoken language? If not then you would be in a similar position relative to Japanese. </p>
      <p>An expert on learning a second language told me that at some point the brain sets up a separate center for the language; before that you will e.g. mix up different foreign languages. I think getting the whole process to function is a problem when you don't have any of the language as a spoken language.</p>
