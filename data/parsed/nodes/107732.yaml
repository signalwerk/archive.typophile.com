    html: <p>To answer your questions, William, I know the meaning of a lot of the words, but not all of them. I can recognize only a few words on sight, like "leolam va'ed" and "shalom"; the rest I have to "sound out" letter by letter. I took a course in Biblical Hebrew and was able to do the coursework, but looking at my notes months later I couldn't recognize anything. Similarly, I have a lot of workbooks and textbooks for Japanese, and before a trip I can read the hiragana and katakana pretty well. The last time I traveled there I was able to take along a furigana dictionary (which assumes knowledge of the two syllabic alphabets), but the learning never sticks for long. This is despite the fact that I can speak some Japanese (not enough!), and my listening comprehension clearly improves over my usually two-week stays there, even though everybody wants to practice their English with me. I do nothing to keep up my German, but I remember it anyway!</p>
