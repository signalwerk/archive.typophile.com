      <div class="comment-spam-body"><p>Having worked w/a dyslexic bat mitzvah student, I found, with patience he was able to get through a 2 book series by ARE Publishing (which I can't find right now, &amp; don't quite recall the name). It was, however, by a speech &amp; language specialist. I was much encouraged, but realizing he could only handle chatimot (which was fine by our Rabbi), still realized it would need to be enlarged. Still, we kept encountering problems. I had expected him to do better, but although he actually reads a lot for someone who is dyslexic, there really wasn't much progress. So, I went back to transliteration for him, but since I was typing it myself, decided to add a few extra spaces between words.  At some point I realized that that was why he managed the Hebrew readers—they were columns of centered words with plenty of space between the words. I added probably          eight          to         ten           spaces between the words, and later saw some research stating that it was the space between the words horizontally that made it easier for dyslexics to read, not the vertical space. Colour coding was also helpful. I would break the Hebrew into phrases in any such siddur, much as Mishkan Tefillah has done (except for central prayers like their V'Ahavta &amp; Tefillah—a big mistake for struggling readers).</p>
      </div>
