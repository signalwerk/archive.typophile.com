    html: <p>I am happy I found this interest group. I work as an editor. I read English, my native language, effortlessly. I still remember my high school German. But although I have been going to Japan for thirty years, and have been regularly attending synagogue for almost twenty, I cannot learn Japanese hiragana/katakana (not to mention kanji), and I am hopeless at Hebrew. I just realized a few weeks ago that I have been confusing the pey sofi and the kaf sofi for decades (in L'cha dodi, I have been reading "tof emunei" instead of "toch emunei")! I have been wondering if I am dyslexic in non-Western fonts. It would be interesting to see if there are fonts in the two languages designed for dyslexics.</p>
