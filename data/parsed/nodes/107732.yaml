      <div class="comment-spam-body"><p>Karl, simply using English, it would be something like this:<br>
      Blessed             are             you,             A-----            creator          of          lights.<br>
      Or, in transliteration, it might have evolved to:<br>
      Ba-ruch             a-tah            A-----             yo-tzeir             ha-m-o-rot.</p>
      <p>In terms of colour coding, since I usually take slower readers, I have found it helpful to use highlighters on their copies of the service. For example, purple for the brachah formula &amp; closing chatimah formula, which also seems to help them understand the structure a little better (as well as reducing the text to concentrate on). Names are in orange, penultimate accented syllables in pink, congregational responses in yellow, kamatz katan in yellow as a reminder of its sound. I might also use little red tick marks on words where they might need reminders of syllable divisions, as above. Colored sheets of paper visually divide different sections of the service, much like the kaddish does. From the responses of my students when they forget their books, it seems to help them focus and navigate easier.</p>
      <p>There is also a system of coloured overlays that seem to aid reading abilities of certain individuals who have distortions reading text on a white background. There is a rather interesting book about this syndrome, Reading By The Colors, by Helen Irlen, and further info at irlen.com.</p>
      </div>
