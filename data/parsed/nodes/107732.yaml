    <p>I was reading about this great open source project to develop a Latin font suitable for people with Dyslexia, <a href="http://opendyslexic.org" rel="nofollow">OpenDyslexic</a>. I began to wonder about the experience of Hebrew readers with Dyselxia. What is the best font? What is the worst font? </p>
    <p>If there are no good fonts yet designed for Hebrew readers, this would seem to me a great challenge whereby Hebrew typographers could collaborate with one another and with the larger community in designing a better font. The <a href="https://en.wikipedia.org/wiki/GPL_font_exception" rel="nofollow">GPL+Font Exception</a> seems like the right license to facilitate such collaboration.</p>
    <p>I'd love to learn what anyone knows about Dyslexia and Hebrew reading.</p>
    <p>Aharon Varady<br>
    the Open Siddur Project<br>
    <a href="http://opensiddur.org" title="http://opensiddur.org">http://opensiddur.org</a></p>
