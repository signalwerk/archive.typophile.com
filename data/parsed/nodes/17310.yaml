      <p>Thanks a bunch for your comments.</p>
      <p>The name is supposed to read as “Process Design”, but I am getting mixed interpretations. Any ideas on how I can imporove the readability, or should I just leave it alone, and explain it to those who miss it? </p>
      <p>I studied the USPS guide to designing mailed pieces, i’m not sure what the official name was, quite thouroughly to see if I could make it work. I found that the bottom 5/8”  of a mailed piece are reserved for a postal barcode, unless you print one on yourself. I am planning on using an applicaion called Addressix <a>http://www.a-sharp.com/addressix/</a>, which has the capability to generate them to work around this. Are the return addresses read by machine as well?</p>
      <p>Wow, facsimile, thanks a million, I would be kicking myself if I went to press with that. </p>
      <p>I agree with you on the periods Thomas, they really aren’t necessary.</p>
      <p>Thanks for the help with the color, I am so used to projects being printed in 4C process that I tend to keep my text as close to 100% values as possible. I’m doing a 2C spot on this so I should take advantage of the opportunity.</p>
      <p>Thanks,</p>
      <p>Travis</p>
