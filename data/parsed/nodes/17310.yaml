    <p>Here is what I have settled on for my personal identity. Designing for yourself is always the hardest, so I wanted to get an outside opinion. I’m not to attached to the magenta, but I wanted something that popped against the black. I also though the magenta helped to give it a “classic but modern” feel. Is the logotype readable enough? What do you interpret it as?</p>
    <p>I’m planning on using Neenah’s Environment paper in a smooth white finish, just so you get the whole picture.</p>
    <p>Let me know what you think.</p>
