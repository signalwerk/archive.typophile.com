      <p>I think it would read unambiguously as “process design” if you just turned it over.</p>
      <p>To the best of my recollection, the type nearest to the bottom edge of an envelope is interpreted as the destination address. The barcode will probably override all of this, but you may still have to put the barcode in the designated place.</p>
