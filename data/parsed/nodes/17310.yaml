      <p>hi travis,</p>
      <p>just came across your designs: very classic indeed, but i quite like it. yes, to me it’s perfectly readable. the notion of design as being something of a process comes to your mind first thing. and the overall impression is very professional.</p>
      <p>i’m wondering about a couple of minor things: don’t know about the periods between “telephone” and the actual number etc. - they’re not really needed since there’s a colour change. so they add some unnecessary disturbance. </p>
      <p>also the black seems a bit harsh: have you tried other colours like very dark greyish blues and so on, that just might make it a little more modern. and then there might be something else beside colour missing to make it really up-to-date / cutting edge - can’t tell yu what. (may individual letter turned upside down, something you notice at a second glance) but that might be the european look at serifs ;-)</p>
      <p>cheers,<br>
      thomas</p>
