      <p>The magenta works fine. It’s also appropriate because it’s a “process” color. I read the identity as “design process”; if, as I suspect from the url, you want people to see “is a,” maybe you should make the “1s” black also. Or maybe that’s complicating things too much.</p>
      <p>The post office won’t be happy with that envelope. The return address should never be below the recipient address. It screws with their automatic readers.</p>
      <p>The word is spelled “facsimile.”</p>
