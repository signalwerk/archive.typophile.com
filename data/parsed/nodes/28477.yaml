      <p>There is something about the relationship between the two words – Stefan is not quite short enough to match the x-height of architekt (I should say this image size makes it difficult to be sure). I would also say the FA of Stefan and the hi of architekt need to be kerned slightly tighter. The squares don't sit comfortably with the type, perhaps if the top of the bottom square was flush with the x-height/cap height and moved slightly to the left. Again this is affected by screen/image size but the lowercase seems to have quite a rambling baseline, where the rounded characters overshoot and the dot of the i seems too prominent.<br>
      When reversed out is it your intention to use that rectangular shape or is that just an example?<br>
      Tim</p>
