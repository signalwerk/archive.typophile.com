    <p>hi guys!</p>
    <p>I'm currently in the process of designing a logo for a local architect who's got about 20 years of experience but finally decided to start his own bureau.</p>
    <p>His area of activity reaches from building small hospitals to large casinos and it's currently a one-man business but he's NOT aiming to become a 50 people agency anyway..</p>
    <p>He wanted his logo to be mainly typography which should be clean, corporate looking and shouldn't be embarrassing. The only shape or form I'm allowed to use is a square due to his vision of a square being the ultimate form, undistorted and straightforward.</p>
    <p>the concept I came up with can be seen here<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/stefan_4698.jpg"></div><p></p>
    <p>STEFAN is placed in capitals to distuingish itself from "architect" and to make clear that the architect is called stefan...<br>
    the squares between the text are pretty small so that the don't stand out too much and they're seperated into 3 pieces to give the impression of something being built..<br>
    they also form an arrow pointing upwards to intensify the impression of something going on..</p>
    <p>what do you think so far?</p>
    <p>any c&amp;c appreciated<br>
    cheers mike</p>
