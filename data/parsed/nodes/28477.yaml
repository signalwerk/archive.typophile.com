      <p>I really like this, I saw this as a flatplan of a room, not the National Geographic at first glance. I also like the colourways, the brightness of the yellow is offset by the charcoal greys and works well. It looks contemporary and quite sophisticated and I think it suits the subject matter really well.</p>
