      <p>If you generate PS OpenType fonts then “Use PostScript FontName as FullName on Windows” is a <em>must</em> to make sure that your fonts will not conform to the specs. (If you generate TT OpenType fonts, then this is not required.)</p>
      <p>[a] <cite>I’ve followed the naming conventions suggested by Adam Twardoch except I have abandoned the short name usage (Instead replacing Reg with Regular, Lig with Light etc).</cite><br>
      [b] <cite>The reason I ask this question is that ...</cite></p>
      <p>I am not sure if I understand.<br>
      [a] What do you assign as ’Family Name’ and ’Style Name’, and as ’OT Family Name’ and ’OT Style Name’? You have read this in Adam Twardoch’s document but to emphasize it: For a family to work in Windows it is important that a family as defined by the ’Family Name’ does not have more, or other, styles (i.e. ’Style Name’) than Regular, Italic, Bold, Bold Italic.<br>
      [b] Windows applications usually show the ’Family Name’ only, and styles are accessed by Bold/Italic buttons. I cannot remember of any Windows application showing ’PS Font Name’ or ’Full Name’ in the font menu, so in <em>this</em> respect, it does not matter how ’PS Font Name’ and ’Full Name’ look like. (It is different with Adobe applications. These show ’OT Family Name’ and ’OT Style Name’ in the font menu, and only if not present, show ’Family Name’ and ’Style Name’.)<br>
      What is important for cross-platform compatibility of <em>Word</em> documents is that in the regular style, ’Font Name’ is identical with ’Mac Name’, or if you don’t provide the latter, ’Font Name’ is identical with ’Full Name’ (see <a href="http://typophile.com/node/17059" target="_blank"> here</a>).</p>
