    <p>I’m currently at the export stage on a few fonts and was looking for some insight on a few preferences in regards to generating OpenType PS files.</p>
    <p>I’ve followed the naming conventions suggested by Adam Twardoch except I have abandoned the short name usage (Instead replacing Reg with Regular, Lig with Light etc). I’m curious if it’s standard to keep the ’Use PostScript FontName as FullName on Windows’ option checked.</p>
    <p>The reason I ask this question is that ideally I’d like the name of the font, when accessed through an application menu to be similar to mac just for reasons of integrity such as ’Example’ as the font family and the sub menu of ’Regular’, ’Light’, and ’Bold’… keeping it simple… but on PC with this export button mentioned above checked I’m assuming the font will come up as ’ExampleRegular’, same as the Postscript Name field.</p>
    <p>I know there are previous topics on font naming but it all seems rather confusing with the cross-platform and cross-application differences.</p>
    <p>Does anyone have any thoughts on generating OpenType PS fonts on Mac that need to be cross platform compatible? Any tweaks or adjustments to create a real consistency in the majority of ’current’ applications and software utilized by creative professionals? (Meaning I’m not really worried about Mac OS 9, Windows 97’, Microsoft Word, ATM etc…)</p>
    <p>Thanks,</p>
    <p>Mike</p>
