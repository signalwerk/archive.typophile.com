      <p>Eric, products aren't just designed. The amount of marketing that goes into a product is almost silly. By the time the designer gets the project they are painted into a very small corner. </p>
      <p>If this is a students project then just take a package open it carefully and use it as a template for where to place graphic elements. Last point gradients don't make a product good or bad. Some of the best packages on the market today are toothpaste and they are using metalic based papers and printing on them. Its a process you'd be hard to copy using a computer.</p>
