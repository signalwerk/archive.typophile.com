    html: <p>Define the scope of the design needs. Find out about the printing to be used, everything including the shipping carton that the detergent is transported in will need art. Whatever is designed needs to translate well to these low end methods and work as a system. Also be sensitive to the costs over time. With large production runs special materials and methods can become expensive. Try to get an idea about every product to be included in the line. How will your detergent box art look when sized down to fit the small boxes at a coin laundry? And on small sample bottles? Or a coupon? Can it be rendered flexo, which can't produce a screen lighter than 10%.</p>
