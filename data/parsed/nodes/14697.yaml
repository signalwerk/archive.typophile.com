      <p><em>Why are we talking about products? I’m talking about packaging.</em></p>
      <p>Can't have the latter without the former, and the former is (for the most part) all about market research.</p>
      <p>You don't mean to imply that companies create items that people need and then wrap them in attractive packages, do you?</p>
      <p>It's pretty much always been more about grinding out enough research to best devise how to convince a bunch of people to buy something they don't want or need. You're not dressing up an object, nor selling what's inside, you're selling an idea, regardless of how asinine or useless the item or idea might be.</p>
      <p>So, you identify the market of people who think they need over-priced coffee products, then nail down their weaknesses, then determine the best visual attack to play on their insecurities, then smack them over the head with the right colours, shapes and fonts. Next thing you know, they're beating each other senseless to get to the check-out first.</p>
      <p>[Jeez, looks like I need some beautifully-packaged, over-priced coffee to take the edge off this afternoon. Phew.]</p>
