      <p>Eric,</p>
      <p>Cincinnati is indeed one of the most packaging centric design communities in the country. It is heartening to know that young designers are considering “package design” as a career choice. Unfortunately, there are no programs in the area that focus on the specifics of package design as it relates to the actual practice of packaging as an integral component of a MCG’s marketing budget. That said, it is important to realize that most portfolios new graduates interview with have “no” packaging examples in them.</p>
      <p>When I interview candidates, I look for strong type, color and composition skills. You need have competent software skills. Most PKG design firms in Cincinnati are going to require that you know Illustrator and Photoshop inside and out. Other software is a bonus. Package design is a unique practice in that “your style” is much less important than your ability to design to a particular target consumer set. Bold type and colors for laundry vs. sophisticated, quieter solutions for beauty care. Personality is a key component that is reviewed as well. Most firms have large teams that work on a range of projects over the course of a week. Deadlines are tight and demands put a lot of pressure on team members. I always look for some I think will work well within a team environment.</p>
      <p>Don’t worry about creating comps etc. Strong design skills, dedication to craft and a team oriented personality will be enough to land you an entry level job – regardless of where you went to school.</p>
      <p>Package design firms in town to consider are:<br>
      Fisher Design<br>
      Landor<br>
      LAGA<br>
      LPK<br>
      Deskey<br>
      Interbrand<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Analyzer.jpg"></div><p></p>
