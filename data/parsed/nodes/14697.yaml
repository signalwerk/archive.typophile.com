      <p>Eric, I doubt my post had any influence, but I do hope I didn't cause too much discouragement with my anti-consumer rant. I read last year (or so) about the designer's manifesto (I can't remember the specifics, I'm sure someone here can point us in the right direciton) and the debate around it. To me, anyway, it was basically an attempt to reconcile the creative and technical side of what we do with the rather ugly and hucksteristic side of the game. The problem is, there is no reconciling it, really. In order to do what we love to do, and to pay the bills, we pretty much have to sell garbage for billionaires and billionaire-wanna-be's. And, occassionally, good folks wanting to do something decent; the bug here is that the latter are usually pro-bono clients, and that's fine, great even, but it doesn't pay the bills.</p>
      <p>I think what the folks here have been stressing is that it's hard to present a mock-up packaging sample because clients like P&amp;G don't care if you're a good designer, only if you can sell what they're shucking out, and it would be really hard to present an impressive example of this sort of work without all the research to begin with.</p>
      <p>That said, if you CAN come up with such an example, you'll make a big impression.</p>
