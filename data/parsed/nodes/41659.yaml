    <p>Hi,</p>
    <p>i'm searching for a casual script that could work well with a The Sans/PMN Caecilia combination. <em>Casual</em> is the keyword; nothing "too appealing", "too distinctive". Don't think "display", think more in the "handwritten" direction. </p>
    <p>I'm far from being a "script guy" … ideas?</p>
    <p>T.</p>
