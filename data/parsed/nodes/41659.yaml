      <p>Thanks for replying, </p>
      <p>Fresco Script is "too Fresco"<br>
      Brisa is too "wellness hotel"<br>
      Erik Righthand is too "Poster, too black"</p>
      <p>I know script is a highly subjective thing, that's why it might be so difficult to find s.th. right –</p>
      <p>Ok it's time for a new expanding definition;<br>
      A handwriting dutch thing with a more informal character.<br>
      Something like Lucida Casual in a handwritten style :)</p>
