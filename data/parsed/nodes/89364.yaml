      <p>Thank you for you reply, hrant!</p>
      <p>Headlines and other large copy is set in Univers 45, body text in Lucida Sans. It doesn't necessarily need to harmonize with these fonts, but just generally fit in with the thin line and light gray elegance.</p>
      <p>Font Aid II looks interesting based on a character map I found in an old news article... however most of these are probably too ornate and complex to fit into a minimally minute icon.</p>
