    <p>Everyone loves the ampersand. But what I failed to find in a search was examples of some of the best question marks.</p>
    <p>I'm currently working on the visual design of a help system, and I'm looking for a clean question mark that looks good on its own as an icon (even at 12x12 pixels).</p>
    <p>The rest of the design uses the classic Univers at the 45 weight (which is my preferred non-Helvetica Helvetica), but I don't really like the shape of its question mark when it stands on its own.</p>
    <p>Tw Cen MT Bold looks otherwise good, but with the rest of the design being light grays, hairlines and Light Univers, it's a bit too fat. And the Regular Tw Cen MT has an entirely different shape for its question mark.</p>
    <p>What would you use for such a circumstance?</p>
