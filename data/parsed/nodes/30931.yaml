  html: |-
    <p>hello</p>
    <p>the objective is to put as many text as possible in a little space<br>
    it must be ofcourse, quite readable by the human eye ofcourse</p>
    <p>what do you suggest?</p>
    <p>any specific font?<br>
    which size of font?</p>
    <p>which paper type?<br>
    which printer settings?</p>
    <p>any specific method of writing the text?<br>
    for example:<br>
    replacing spaces with fullstops<br>
    removing spaces at all and capitalizing the first letter of each word<br>
    removing letters or word parts, but still the text be comprehensible?<br>
    any specific way to compress text? any algorith, cryptographic method etc?</p>
    <p>any other idea?</p>
    <p>thanks</p>
