    <p>Does anyone have experience trouble shooting this less than stellar program?<br>
    I've found that large PostScript T1 families (in this case 12 fonts or more) will cause<br>
    some styles to show up and others disappear. And sometimes the reverse,<br>
    or sometimes somewhere in between the two.</p>
    <p>This is OS9.<br>
    Maybe both FR and OS9 will quietly vanish from the earth...</p>
