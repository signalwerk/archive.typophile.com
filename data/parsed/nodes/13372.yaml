      <p>To me, a well tuned OS 9 box is a lot like an air-cooled Volkswagen beetle. Sure it's underpowered and a little dodgy on hills, but you can keep 'er running because the thing is so darned *simple*. </p>
      <p>Many software vendors can't support OS 9 simply because there are now few clients running said OS. However, if stuff was working at the point when the main user base left the building, there's no reason why it wouldn't continue to chug along.  FR 3.1.3 ran on OS 9.  However, it sounds like it f'd up the WYSIWYG menu add-on software. Unfortunately, you're sort of stuck between using the ancient installer and the updated (and probably last OS 9) version, which was probably only tested on stock systems. </p>
      <p>Aldus SuperPaint Forever!!</p>
