    <p>Hello,<br>
    I'm trying to identify this font, with no success. I'm sure it's an easy one, but I can only find similar matches, like Chalet Comprime, Knockout, Akzidenz Grotesk etc.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-2_5991.jpg"></div><p></p>
    <p>The picture is taken from <a class="freelinking external" href="http://www.behance.net/gallery/A-Grotesk-Love-Affair/1339317" rel="nofollow">this project</a> on the Behance Network, you can find more samples there. I tried to message the creator but no reply so far.<br>
    Any help really appreciated.</p>
    <p>Thanks in advance,<br>
    Federico</p>
