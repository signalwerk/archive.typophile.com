    html: |-
      <p>If you use Warnock as the body and are looking for a header, here are some working options:</p>
      <p>Univers<br>
      Trade Gothic<br>
      News Gothic<br>
      Myriad<br>
      Frutiger<br>
      Franklin Gothic<br>
      Avenir<br>
      Akzidenz Grotesk</p>
      <p>I wrote an app for the iPhone to help speed up the generation of font combination ideas so you can see the typefaces in context:</p>
      <p><a href="http://bonfx.com/font-combinations-app/" title="http://bonfx.com/font-combinations-app/">http://bonfx.com/font-combinations-app/</a></p>
      <p>There is a book coming out too, with hundreds of working examples:</p>
      <p><a href="http://bonfx.com/the-big-book-of-font-combinations/" title="http://bonfx.com/the-big-book-of-font-combinations/">http://bonfx.com/the-big-book-of-font-combinations/</a></p>
