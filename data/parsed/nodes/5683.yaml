    html: <p>The A &amp; Y in your sample are not monotone, and that makes it look like the ATF version of Franklin Gothic, which has that style of R. News Gothic has that style of R, but it is monotone. Your Q description made me think of Folio, but it doesn't have that kind of R, and it is not monotone either. I think foundries had types they just called Gothics, with numbers (like Gothic No.18), but at least the ones in my old Linotype book, looked mostly like Franklin Gothic with the right-of-center Q tail, and the majority of them were condensed. <br> <br>If you could show the Q, M and G (if all you have is upper case) it would make IDing it easier.</p>
