    votes: null
    html: <p>Except for the Q it looks like an extra heavy weight of Franklin Gothic. I looked (quickly) through Mac McGrew's book on American Metal Typefaces, and didn't see a Franklin Gothic this heavy. Often at extreme weights some of the letterforms are changed. Maybe that's why this Q is different from the usual Franklin Gothic? Another explanation is that sometimes when there is a very popular typeface, as this was for many decades, other foundries develop alternative versions with new names, and one or two slight differences to avoid the appearance of copying the type. This could be from such a face. <br> <br>Do you know whose specimen book it's from? Is it American? How old is it? <br> <br>I'll keep looking, but I'm running out of showings of old typefaces.</p>
