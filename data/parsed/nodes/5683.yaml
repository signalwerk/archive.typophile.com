  - id: 40499
    user: 2088
    date: 2004-07-19T07:24:00
    date_raw: 19.Jul.2004 7.24am
    votes: null
    html: <p>I think that's a fair question. What we don't appreciate is 'can you tell me where I can get something like it for free?' <br> <br>My suggestion is to go over to <a href="http://www.fontpool.com/categories/index.html" target="_blank"> The Font Pool</a> and pick the style category you are interested in. Then type in a word or two that you want to use. They will show you hundreds, if not thousands of fonts using those words (or letters), and you can pick one that way. <br> <br>The reason I suggest that, instead of suggesting a font, is that 'clean and strong', 'interest', 'finish' and 'contemporary' are all very subjective terms. You know what you mean by them. <br> <br>You can also do something similar at MyFonts.com if you register. You can set up your own sample phrase for the font showings. <br> <br>Now, having said all that, I will say that what seems 'contemporary' these days is geometric fonts, because we are in a retro stage where Art Deco and Bauhaus looks are apparently 'in' again. Hoefler &amp; Frere-Jones Gotham is used a lot, and Futura is timeless and has lots of weights. I'd start with one of those.</p>
