    html: <p>Some of the Grotesques have similar Q's, but in almost every case I saw, the R was unlike this one, and usually the letters were monotone (even weight strokes). <br> <br>Record Gothic, designed by R. H. Middleton has a Q like this and the right sort of R, but it is also monotone. <br> <br>I think I've used up my resources. My best guess is that this is a heavy weight variation of Franklin Gothic from some relatively obscure foundry (whose types didn't make any of the books I looked through).</p>
