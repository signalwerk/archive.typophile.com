    date_raw: 19.Jul.2004 7.09am
    votes: null
    html: <p>Absolutely ask for suggestions on alternative fonts if the original is not available.  <br> <br>One alternative -- especially if your associate wants a number of different weights, is <a href="http://www.typography.com/catalog/knockout/index.html">Knockout</a> by H&amp;FJ. The letterforms are different, but on the whole it's a very powerful face with many weights.</p>
