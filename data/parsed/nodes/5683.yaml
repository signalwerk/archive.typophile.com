    html: <p>As a first-time user, I'm not sure of the etiquette. Since the exact font may not be available for purchase, is it OK to ask for suggestions? <br> <br>My business associate will want something with a similar "feel" - clean and strong. I'd like something that also has a little more interest, a little more "finish," a little more contemporary. <br> <br>TIA if it's a fair question; sorry if it belongs elsewhere.   </p>
