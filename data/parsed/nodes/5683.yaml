    <p>From a specimen book turning yellow with age, a new business associate has come up with a font I need to identify. Please see attachment - part of a prototype he did the way we used to do it 25 years ago - cardboard, glue, cover sheet. The font is not unlike the Franklin Gothic family - but the tail of the Q comes off the middle of the bottom and curls right. Assistance appreciated.    UnklChuk    <img src="http://www.typophile.com/forums/messages/83/40959.gif" alt="the mystery font"></p>
