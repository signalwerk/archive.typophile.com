    <p><strong>Monotype Imaging Announces Winning Entries for the Second Annual Web Font Awards</strong></p>
    <p><em>International Competition Honors Exceptional Use of Web Fonts in Web Design</em></p>
    <p>Monotype Imaging Holdings Inc., a leading global provider of text imaging solutions, has announced the winners of its second annual Web Font Awards, the international competition that recognizes websites that incorporate exceptional use of Web fonts. First place in the Judges’ Choice category went to “DAS FORK” from Fork Unstable Media GmbH, and the Community Choice winner was “Baltimore Fishbowl” from Fastspot. </p>
    <p>“The Web Font Awards celebrates and recognizes great design using Web fonts. Designers are increasingly using Web fonts, as awareness builds in how they can enrich visual experiences, while also making sites more searchable and easier to use.”<br>
    .Second place in the Judges’ Choice category went to “Debbie Millman” from UnderConsideration and third place was awarded to “SAM,” submitted by MAMUS. </p>
    <p>An image gallery of this year’s <a class="freelinking external" href="http://tinyurl.com/7srljqx " rel="nofollow"> Web Font Awards winners</a>is available at <a href="http://tinyurl.com/7srljqx" title="http://tinyurl.com/7srljqx">http://tinyurl.com/7srljqx</a>. </p>
    <p>“This year’s contest showcased amazing talent from all over the world,” said Allan Haley director of words and letters at Monotype Imaging. “The Web Font Awards celebrates and recognizes great design using Web fonts. Designers are increasingly using Web fonts, as awareness builds in how they can enrich visual experiences, while also making sites more searchable and easier to use.” </p>
    <p>The four winning websites incorporate typefaces served through a variety of methods. DAS FORK uses a self-hosted implementation to deploy the <a class="freelinking external" href="http://www.fonts.com/family/521506/malabar " rel="nofollow"> Malabar™</a> family, a Linotype® face that won a certificate of excellence in typeface design in 2009 from the Type Directors Club of New York City at its TDC2 competition. Karim Kreuder, designer at Fork, said, “Malabar has a unique character that we think is a perfect fit for the design of the Fork website.” </p>
    <p>Baltimore Fishbowl uses the service from Typekit to display the <a class="freelinking external" href="http://www.fonts.com/family/305670/proxima " rel="nofollow"> Proxima™ Nova</a> and <a class="freelinking external" href="http://www.fonts.com/family/44236/chaparral " rel="nofollow"> Chaparral™ families</a>. The Debbie Millman and SAM sites feature <a class="freelinking external" href="http://www.fonts.com/family/808330/neue-haas-grotesk Monotype Imaging’s " rel="nofollow"> Neue Haas Grotesk™</a> and <a class="freelinking external" href="http://www.fonts.com/font/linotype/neue-helvetica " rel="nofollow"> Neue Helvetica®</a> families, respectively. The winning designs are on display on the homepage of <a href="http://www.webfontawards.com" title="www.webfontawards.com">www.webfontawards.com</a>. All submissions are exhibited on the site’s <a class="freelinking external" href="http://www.webfontawards.com/gallery " rel="nofollow"> gallery</a>. </p>
    <p>This year’s grand prize for both the first place Judges’ Choice and Community Choice winners is a trip to London with a VIP pass to the Future of Web Design London Conference in the spring of 2012. All three Judges’ Choice honorees and the Community Choice winner receive an Apple® iPad® 2 device, a subscription to Monotype Imaging’s Fonts.com Web Fonts service and a license for the FontExplorer® X Pro font management software. In addition, the Community Choice and Judges’ Choice first and second place winners receive licenses for the Monotype®, Linotype® and ITC® font library collections. </p>
    <p>The second annual Web Font Awards was sponsored by Monotype Imaging with support from Carsonified, a UK-based company that produces events for Web professionals, including the Future of Web Design conferences. Monotype Imaging also worked with the WebINK® Web font service from Extensis and media partners to select the entrants to be judged, in addition to announcing the Web Font Awards winners at the Future of Web Design conference on Nov. 7, 2011. Media partners included Cincinnati-based HOW magazine, which serves graphic design professionals; Creative Review, a UK-based publication focused on the communication arts; Slanted, a Germany-based typography magazine; and Novum, a graphic design magazine, also headquartered in Germany. </p>
    <p><strong>About Monotype Imaging</strong></p>
    <p>Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, automotive devices, tablets, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers, page description language interpreters, printer user interface technology and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype, Linotype and ITC typeface libraries – home to some of the world's most widely used designs, including the Times New Roman®, Helvetica®, Frutiger® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype and FontExplorer are trademarks of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Malabar is a trademark of Linotype GmbH and may be registered in certain jurisdictions. Helvetica and Frutiger are trademarks of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. Neue Haas Grotesk is a trademark of Linotype Corp. and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Proxima is a trademark of Mark Simonson Studio LLC and may be registered in certain jurisdictions. Chaparral is a trademark of Adobe Systems Inc. in the U.S. and/or other countries. Apple and iPad are registered trademarks of Apple Inc. WebINK is a trademark of Extensis, a division of Celartem, Inc. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Inc. All rights reserved.</p>
