  html: "<p>Maybe some of you have the same problem: <br>since I'm working with CS I can't insert the <b>curly bracket</b> and the <b>vertical line</b> anymore with my keyboard. I have to use the glyph palette, which is a bit cumbersome... <br> <br>these are the shortcuts on an azerty-keyboard: <br> <br><b>{</b> Unicode U+007b <i>Shortcut: alt- )</i> <br><b>|</b> Unicode U+007c <i>Shortcut: alt-shift L</i> <br><b>}</b> Unicode U+007d <i>Shortcut: alt- (</i> <br> <br> <br>other alt shortcuts seem to work fine... <br> <br>Does anybody has a clue of what's causing this problem? <br></p>"
