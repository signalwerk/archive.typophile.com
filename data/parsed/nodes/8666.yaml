  html: <p>I'm just curious as to everyone's favorite type web sites out there, based on design. I'm currently trying to rework my homepage and am looking for some ideas. I know that my site should be based on my own design, but I like to learn from the masters. One site in particiular I like is Ramiro Espinoza's. It has a nice colorful attitude. <a href="http://www.jazz.futurezone.com" target="_blank">http://www.jazz.futurezone.com</a>. I even like Beast Magazine's web site <a href="http://www.ths.nu/beast" target="_blank">www.ths.nu/beast</a>. Let the thread begin!</p>
