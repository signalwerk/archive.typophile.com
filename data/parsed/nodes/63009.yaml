    html: <p>I’ve stopped using the interpolation tool and work with Christian Robertson’s Interpolated Nudge script and Göran Söderström’s macro tool script to let me drag points into place. This allows me to just sculpt cuves into place without worrying about the limitations of the interpolation tool.</p>
