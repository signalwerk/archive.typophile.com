    html: |-
      <p>Seems to me that the Dempster's wordmark, U.S. trademarked in 1992, is very close to Goudy Heavyface Condensed:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/GoudyHeavyFaceCondensed_Dempsters_5276.jpg"></div><br>
      I used the Berthold version for the comparison but was unable to find a current seller. So here is a link to the <a href="http://www.fonts.com/font/bitstream/goudy-heavyface/condensed" rel="nofollow">Bitsteam version</a>.<br>
      If  Goudy Heavyface Condensed was used as the basis for the wordmark, some further horizontal squeeze was done and some relatively minor modifications were made to the letters, except for s, which grew a long tail, and p which now has an old-style bottom terminal. The comma is clipped into a stubby tear shape.<br>
      Don<p></p>
    html_clean: |-
      <p>Seems to me that the Dempster's wordmark, U.S. trademarked in 1992, is very close to Goudy Heavyface Condensed:<br>
      </p><div class="imageWrap"><img src="/files/goudyheavyfacecondensed_dempsters_5276.jpg"></div><br>
      I used the Berthold version for the comparison but was unable to find a current seller. So here is a link to the <a href="http://www.fonts.com/font/bitstream/goudy-heavyface/condensed" rel="nofollow" class="link-external">Bitsteam version</a>.<br>
      If  Goudy Heavyface Condensed was used as the basis for the wordmark, some further horizontal squeeze was done and some relatively minor modifications were made to the letters, except for s, which grew a long tail, and p which now has an old-style bottom terminal. The comma is clipped into a stubby tear shape.<br>
      Don<p></p>
