    I'm looking for fonts that will look like Chris ware's sans serif lettering work.<br>
    like here:</p>
    <p><a href="http://drawn.ca/wordpress/wp-content/images/comicspanel.jpg" title="http://drawn.ca/wordpress/wp-content/images/comicspanel.jpg">http://drawn.ca/wordpress/wp-content/images/comicspanel.jpg</a><br>
