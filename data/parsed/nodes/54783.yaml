      <p>Look for features that interest you.<br>
      Many faces these days have all kinds of OpenType feature sets.<br>
      Alternate figure styles, various heights of small caps, unicase, optical sizes, alternate extenders, alternate "a" and "g" forms, swash characters, &amp;c.<br>
      These kind of typographic niceties give you options to play around with when setting work as mundane and complex as business cards.<br>
      You can check out OpenType features visually on the new MyFonts interface.</p>
      <p>Get some printed specimens from type foundries, or the Indie Fonts books and the FontBook, and see what you like the look of.<br>
      Download PDF specimens and print them out.</p>
