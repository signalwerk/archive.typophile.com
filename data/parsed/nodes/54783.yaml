    html: |-
      <p>A note on ITC Stone &amp; Sumner Stone's fonts generally:</p>
      <p>If you're going to get ITC Stone, get it from the Stone Foundry. Be a bit thoughtful though. The sans is just a touch larger than the serif -- or maybe its the other way. The informal doesn't usually blend too well if you're using both the sans &amp; serif. My wife designed a book using all three which worked. It had three voices, a narrative track, an expert track, and an advice to families track. Using all three successfully was uncommon enough that Sumner included it in his exhibit at the SF library.</p>
      <p>ITC Stone works best at slightly larger sizes, say 11-point, and as Bill says, can be a bit spikey. It was designed when we still ran repro, shot negatives, and burned plates, so the contrast in the letterforms is fairly great.</p>
      <p>For general text use, I like Cycles much more, again from the Stone foundry. Sumner recently lowered his prices; there are some tremendous values there. I also like Magma and SFPL. Stone print is also useful when you have to pack text into a narrow measure.</p>
      <p>* * *</p>
      <p>Not to get into a pissing match with Nick, but how much you interject yourself into a design -- esp. with type choice -- depends on the text you are setting. If  there is an author, their ideas and audience are paramount. If *you* want to challenge a reader, write your own book.</p>
      <p>If it is unattributed text as in a brochure, there is likely more room for innovation in type choice.</p>
