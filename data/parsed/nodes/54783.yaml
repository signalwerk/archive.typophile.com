      <p>For all the denigration of Helvetica and Times, they are (were?) good fonts. Times particularly worked better in metal though, and in certain sizes. The many "computer" versions muddy the water.</p>
      <p>The contemporary "Times" is, as Celeste says, Minion. It is common enough for text settings that designers mutter, "I'm so tired of Minion." There is a reason they're tired of it; it works so well for so many things.</p>
      <p>* * *</p>
      <p>BTW, I've been setting books for 30 years, and have never heard of Kievit or Milo. They may well be fine typefaces, but aren't desert island fonts yet.</p>
