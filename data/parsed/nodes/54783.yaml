      <p>Ben:</p>
      <p>Absolutely, add Sala and Scala Sans to the list. Perhaps Seria as well. </p>
      <p>The kicker is that most lists will be partial because there are so many great serif faces out there. I think the goal is to build up a core set of "workhorse" faces and then build around those. </p>
      <p>Nick Shinn compiled a list a while ago, and it's quite an inspiration. It's as good a starting point as any. </p>
      <p>Here:</p>
      <p><a href="http://www.shinntype.com/Writing/PerfcSet.pdf" title="http://www.shinntype.com/Writing/PerfcSet.pdf">http://www.shinntype.com/Writing/PerfcSet.pdf</a></p>
      <p><a href="http://www.gxo.com/archive/ARCHIVESPDF/General/60430PerfectSet.pdf" title="http://www.gxo.com/archive/ARCHIVESPDF/General/60430PerfectSet.pdf">http://www.gxo.com/archive/ARCHIVESPDF/General/60430PerfectSet.pdf</a></p>
      <p>Very useful (good for beginners):</p>
      <p><a href="http://www.shinntype.com/Writing/DigginIt.pdf" title="http://www.shinntype.com/Writing/DigginIt.pdf">http://www.shinntype.com/Writing/DigginIt.pdf</a></p>
      <p>There are other informative articles on his site, certainly worth reading.</p>
