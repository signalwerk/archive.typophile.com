      <p>Since most people still choose a serif for text composition, the closest thing to a "Helvetica of text faces" is Times Roman. Times is a good, useful face that, like Helvetica, is now so ubiquitous in our visual environment it's practically invisible, and that's why you shouldn't make it your house text font.<br>
      How about <a class="freelinking external" href="http://www.linotype.com/112295/itcstone-clan.html?gclid=CKiM462_25gCFQG7GgodwX8tcw" rel="nofollow">ITC Stone</a>? The serif is dignified but not boring, and is available with small caps, old style figures, etc. There's a handsome italic, and it comes in Semibold and Bold weights.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/stoneserif_4382.JPG"></div><br>
      There's also a companion sans serif, which I like for text composition because it's not as rigidly geometric as many sans serifs.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/stonesans_5704.JPG"></div><br>
      And if you want to get extra-friendly, there's Stone Informal, distinguished by blunted serifs, less contrast between thick and thin strokes, and a cursive-style lowercase <strong>a</strong> and <strong>g</strong>, even in the Roman.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/stoneinformal_5967.JPG"></div><p></p>
