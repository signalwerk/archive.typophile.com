    <p>I'm looking to invest in a good friendly text face to have in my aresonal for when I jump in to my professional career but I'm not privy to much general discussion about text faces.. so I have some questions.</p>
    <p>1. good friendly text face</p>
    <p>2. what's the 'helvetica' of text faces? is there any single text face that you see everywhere??</p>
    <p>3. what about a sans??</p>
    <p>4. what's Jost Hochuli's 'Detail in Typography' set in?</p>
    <p>thanks!</p>
