    <p>Sorry to post something as trivial as this, but I have been racking my brain and searching google for 1.5 hrs and I'm not coming up with anything.</p>
    <p>Im trying to remember a website that showcased fonts. I can describe it like this:</p>
    <p>• I think it is a personal blog, so it will be <a href="http://www.Name-Of-Person.com/finefonts" title="www.Name-Of-Person.com/finefonts">www.Name-Of-Person.com/finefonts</a></p>
    <p>• I think the name of that section of his site is something like "fine fonts" or something with alliteration. At least I think it was 2 words. Maybe "Nice Type" or something like that.</p>
    <p>• each "post" of his "blog" featured one font only and there was a giant character in that typeface somewhere in the background.</p>
    <p>• each "post" used a different color combination, vary nice combinations if I remember.</p>
    <p>• I can't be sure, but I think all the fonts featured were free ones</p>
    <p>• the pages linked out to the foundries or the respective download pages.</p>
    <p>I'm sorry I can't offer more, but I'm hoping someone in this community can point me in the right direction. Thanks!</p>
