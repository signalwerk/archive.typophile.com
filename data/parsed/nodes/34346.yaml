      <p>Per <a href="http://www.myfonts.com/WhatTheFont/forum/viewthread.php?threadid=24420" target="_blank">this MyFonts forum post</a> by Takeshi (a regular who is almost never wrong), it might be “Fashion Thin” by Alex Wiederin. Where he got the name from, I don’t know - but the typeface appears all over in the portfolio of <a href="http://www.buero-newyork.com" target="_blank">Buero New York</a>. This includes several entries from Another Magazine.</p>
      <p>I find the website very irritating to navigate.</p>
