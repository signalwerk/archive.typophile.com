      <p>I agree. Franklin is pretty common in magazines, and is certainly a safe choice, but I’m trying to keep at least ONE typeface consistent for a little familiarity to our readers.</p>
      <p>The Alinea Serif that was recommended is just beautiful. I love the lower case g! It’s just a little too pretty for our audience. I have to strike a fine line between readers who subscribe to Audubon and Nature Conservancey versus our sportsmen readers that pick up Field &amp; Stream and Outdoor Life. </p>
      <p>I’ll have to pick up Alinea for some freelance projects. It’s just too nice to overlook...</p>
