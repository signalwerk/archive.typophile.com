    <p>Greetings friends,<br>
    I’m in the beginning stages of a magazine re-design for Montana Outdoors, a small circulation (about 45,000, mostly U.S. and Canada) bimonthly magazine that focuses on Montana conservation and wildlife issues: <a href="http://fwp.mt.gov/mtoutdoors" title="http://fwp.mt.gov/mtoutdoors">http://fwp.mt.gov/mtoutdoors</a></p>
    <p>We’re a small outfit, just an editor and myself, and I’d like to launch a new look next year, with better grids and a more effective and readable typeface for our body copy. We currently use Adobe Garamond 10/13, which I think is a little light, and perhaps a bit challenging for our older readers to read comfortably. </p>
    <p>I’ve only been in the magazine design business for five years, so I have much to learn. I’d like to transition to a more square typeface with a taller x-height. Utopia is pretty high on my list right now... I’ll be pairing the body font with ITC Franklin Gothic condensed for our sans-serif / subhead choice.</p>
    <p>My editor has asked me to survey the body text typestyles used by some of our peer magazines, who we view as the “gold standard” for us to strive for. Specifically, does anyone know at-a-glance what typefaces the following magazines use for body text:</p>
    <p>Arizona Highways<br>
    Field and Stream<br>
    Audubon<br>
    (see attached samples)</p>
    <p>Thanks in advance for any help. If I can’t find the answers, I’ll do it the old-fashioned way and call their art departments!</p>
    <p></p><div class="imageWrap"><img src="/files/arizonahighways_5839.jpg"></div><br>
    <div class="imageWrap"><img src="/files/audubon_3775.jpg"></div><br>
    <div class="imageWrap"><img src="/files/fieldandstream_6501.jpg"></div><p></p>
