      <p>Can’t go wrong with Utopia. It is one of the most readable fonts out there. Plus, I think its more casual tone would work perfectly with a publication targeted towards seniors.</p>
      <p>For your accompanying sans, Franklin Gothic works well with Utopia, I’ve used that exact combination before. Not surprisingly, Helvetica Neue is also a safe choice with Utopia.</p>
