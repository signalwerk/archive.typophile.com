    html: |-
      <p>Is that a standing corporation? As in stationary? It should be <cite>stationery</cite>, as in:<br>
      Middle English staciouner, a bookseller, from Medieval Latin statinrius, shopkeeper (as against a peddler), probably from Latin stati, statin-, place of business. (<a href="http://www.bartleby.com/61/92/S0719200.html">http://www.bartleby.com/61/92/S0719200.html</a>)</p>
      <p>A frequent mistake, almost as frequent as spelling <cite>seperate</cite>, rather than <cite>separate</cite>. Latin <cite>separare</cite>, to divide (no source, just my memory).</p>
      <p>Sometimes it is easier to look in from the outside. My native language is German.</p>
