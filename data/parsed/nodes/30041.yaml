    html: <p>Verlag is a great typeface. I have had the opportunity to work with it and found it works very well at small sizes. However, because it is a geometric it will have moments of feeling stiff. The italic, for instance, isn't a soft as you might find in something else. But, on the other hand, your color palette, visuals, and other tactile elements will go a long way into imparting friendliness across the brand.</p>
