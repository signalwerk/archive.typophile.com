    <p>I am updating an identity for my branding, design firm and I have recommended a switch in our corporate typeface. I am looking for a few suggestions which fit our criteria:</p>
    <ul>
    <li>capture the openness and friendliness of our current face (Century Gothic)</li>
    <li>with a more credible font that sets well and is part of a larger system (similar to Helvetica Neue, which some designers would like to see used)</li>
    <li>this larger system should include different weights, a nice italic, an expanded character set and solid numerals (distinct or non-lining figures would be a nice plus)</li>
    <li>we are also probably setting our name as a word-mark or initialed in this face, so it must have enough personality (or brand) to sit on its own</li>
    </ul>
    <p>Some designs that came to mind were: Verlag, Scala (both families), Dax, Neo Sans, Gotham, Whitney, or even Apex Sans and Galaxie Polaris.</p>
    <p>I know I've seen excellent suggestions on these boards. What do you guys think?</p>
    <p>Thanks in advance for any help,</p>
    <p>Sam</p>
