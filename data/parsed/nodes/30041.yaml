      <p>Great picks Miss Tiffany.</p>
      <p>I like Klavika (go Facebook!) and Locator (nice italics).</p>
      <p>Bryant 2 is beautiful, but I'm not sure if we're ready to go 'all rounded' yet. The numbers really are wonderful, though.</p>
      <p>Overall, are there any picks that are a little safer, more friendly?</p>
      <p>To me, Verlag was just nice, with a little character. The x-height makes it a little conspicuous and I think that keeps it from being perfect for our goals. The personality and sophistication, though, are right on.</p>
