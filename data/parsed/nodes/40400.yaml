  html: |-
    <p>In <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sans serif</a> and <a href="/wiki/linear" class="freelinking" rel="nofollow">linear</a> types, a <a href="/wiki/stroke" class="freelinking" rel="nofollow">stroke</a> and <a href="/wiki/stem" class="freelinking" rel="nofollow">stem</a> of constant width. Strict monolinear fonts have identical horizontal and vertical stroke width. Practical monolinear fonts have a vertical stroke slightly wider than their horizontal stroke width.</p>
    <p>The best-known example of a monolinear type is <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a> designed by <a href="/wiki/Paul%20Renner" class="freelinking" rel="nofollow">Paul Renner</a>. Also <a href="/wiki/Century" class="freelinking" rel="nofollow">Century</a> and <a href="/wiki/Avenir" class="freelinking" rel="nofollow">Avenir</a>.</p>
