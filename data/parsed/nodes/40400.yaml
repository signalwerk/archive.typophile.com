  html: |-
    <p>In <a href="/node/12132" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">sans serif</a> and <a href="/node/add/wiki?edit%5Btitle%5D=linear" title="Create node &quot;linear&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">linear</a> types, a <a href="/node/add/wiki?edit%5Btitle%5D=stroke" title="Create node &quot;stroke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stroke</a> and <a href="/node/add/wiki?edit%5Btitle%5D=stem" title="Create node &quot;stem&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stem</a> of constant width. Strict monolinear fonts have identical horizontal and vertical stroke width. Practical monolinear fonts have a vertical stroke slightly wider than their horizontal stroke&nbsp;width.</p>
    <p>The best-known example of a monolinear type is <a href="/node/12494" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Futura</a> designed by <a href="/node/12191" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Paul Renner</a>. Also <a href="/node/13820" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Century</a> and <a href="/node/12462" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Avenir</a>.</p>
