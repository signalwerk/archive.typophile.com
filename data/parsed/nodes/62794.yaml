      <p>Hey guys,</p>
      <p>Thanks! I have Adobe Caslon on my computer and just took a look. The swashes are nice, as is the Italic.</p>
      <p>Will that go well with Arno, you think?</p>
      <p>Also, what do you think about "stylistic alternates" like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stylealternatives_5008.png"></div><p></p>
      <p>This is Arno Pro SmText.</p>
      <p>Ok, so clearly I wouldn't use the alternates for every letter, as seen here...but how are these generally used? I found them when I was playing around with the Open Type option in Adobe Illustrator. I kind of like them because they seem to provide an antiquated feel and also tie back to the idea of Sanskrit - but as applied to a font founded in Western book art (and old style font). And you can get a little bit of a more pronounced caligraphic feel without going italic.</p>
      <p>What do you guys think? Do you have any advice about these? Like I said, I just stumbled upon them.</p>
