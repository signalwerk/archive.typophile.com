    <p>Hi everybody,<br>
    I'm a student  of master in graphic design and I'm building a new typeface. It's a remake of a hand lettering. The original draw was made by a Oporto's seller.</p>
    <p>Here is <a href="http://typophile.com/files/hamburg.jpg" title="http://typophile.com/files/hamburg.jpg">http://typophile.com/files/hamburg.jpg</a></p>
    <p>I'm showing here for ask your contribution and opinion. I have many doubts about how I can adapt the original design for new caracters. Can anyone help me?<br>
    Please, say what do you think about. Sugestions and critics are welcome.<br>
    Thanks.</p>
