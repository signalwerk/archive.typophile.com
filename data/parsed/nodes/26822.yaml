    <div class="info">Submitted by <a href="/user/3" title="View user profile.">Jared Benson</a> : 26.Aug.2003 12.41pm </div>
      <p>We welcome your participation in a new Typophile board - this one is called "Collaborative Design" and can be accessed via the front Topics page of the Forums.  <br> <br>Collaborative Design is your playground - an ideal spot to refine ideas and work on fun, freebie, or pro-bono projects with your fellow Typophiles. <br> <br><b>This is not a place for spec work or contests.</b> If you need feedback on a commercial project, post into the Critique or Design forums. <br> <br>I've kicked off the board with "Typogenealogy," a collaborative font project idea that I hope you'll get involved with - or start a project of your own! <br> <br><a href="http://www.typophile.com/forums/messages/14800/14800.html">Click here to check it out &gt;</a></p>
