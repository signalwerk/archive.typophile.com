      <p>There's a rather obvious one that I won't mention as you probably don't want to use it.</p>
      <p>If this is for titles and captions, I'd suggest that you look at old videos. If this is for things in the video, I suggest that you look at old advertisements and other documents.</p>
      <p>While you shouldn't use a more recent font, you're quite likely to find older fonts that were frequently used in a certain way in the 50s and 60s.</p>
      <p>I unfortunately don't really know anything about Grease, so I won't give any more specific suggestions.</p>
