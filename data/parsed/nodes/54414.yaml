    <p>Hey everyone just a quick question here that I'm sure will be easy for all the typophiles...</p>
    <p>im currently working on a DVD for a production of Grease (which is set during the late 50s early 60s depending on who you ask) and being the nerd that I am I want to ensure that all the typography is Period sensitive. </p>
    <p>I know that Futura was around and Was planning on setting stuff in this but its a bit plain/boring/just plain not wild about the font. I was just curious as to what other fonts were around at the time?</p>
    <p>The current design uses Futura for the chapter text (which is somewhat hard to read at such small sizes) and I was using the Tiki Script font from House Industries (I know its a recent font but it looked "of the period"). </p>
    <p>Any other suggestions for fonts FROM the era (or at least that look of the period).</p>
    <p>Thanks very much.</p>
