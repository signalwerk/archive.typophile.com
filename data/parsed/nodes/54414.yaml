    html: "<p>I found these in a big book of ads (only listing those that I can recognise easily): 1950–59: Rockwell, Franklin Gothic, Century Schoolbook. 1960–69: Futura, Gill Sans, Goudy, and lots of other serif fonts. And, of course, the good old H., especially the bold condensed.</p>"
