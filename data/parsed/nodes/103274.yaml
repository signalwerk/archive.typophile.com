    <p>We are proud to announce the release of <strong><a href="http://www.myfonts.com/fonts/sudtipos/esmeralda-pro/" rel="nofollow">Esmeralda Pro</a></strong>. We hope you like it as much as we do.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/typophileesmeralda_6485.png"></div><p></p>
    <p>About <strong><a href="http://www.myfonts.com/fonts/sudtipos/esmeralda-pro/" rel="nofollow">Esmeralda Pro</a></strong></p>
    <p>From the beginning “<strong><a href="http://www.myfonts.com/fonts/sudtipos/esmeralda-pro/" rel="nofollow">Esmeralda Pro</a></strong>” was born with a strong influence of the classical “capitalis monumentalis”, carved in stone. In the same way, the origin of this majuscule writing emerged from the brush, from a way of writing made merely by hand. For this reason, these two universes were intended to lie beneath the shape of each letter, redefining them. And this combination of styles should also be reflected in a lowercase set that also allows to open up the spectrum of usage possibilities. Foundational calligraphy represented a solid base for the development of lower case glyphs, ensuring proper interaction with the uppercase letters.<br>
    “<strong><a href="http://www.myfonts.com/fonts/sudtipos/esmeralda-pro/" rel="nofollow">Esmeralda Pro</a></strong>” features a great amount of ligatures that mix classic structures with a more contemporary impression. With more than eleven hundred glyphs, it provides a multiplicity of uses across a wide combinatory of ligatures, alternative signs, initial caps, miscellaneous and connectors; each one of them accessible through Opentype.</p>
    <p>“<strong><a href="http://www.myfonts.com/fonts/sudtipos/esmeralda-pro/" rel="nofollow">Esmeralda Pro</a></strong>” is perfect to speak with a classical yet fresh, modern, –and a little bit bold– tone of voice.</p>
    <p>Designed by Guille Vizzari, together with the tough and remarkable work of Ale Paul, “<strong><a href="http://www.myfonts.com/fonts/sudtipos/esmeralda-pro/" rel="nofollow">Esmeralda Pro</a></strong>” –when in use– stands out in a subtle and unexpected way, almost unnoticeable. It’s delicate yet solid curves, serifs and endings give each composition a fine, elegant and exquisite feeling, along with a firm and sturdy look.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ST_ESMERALDA_PANTALLAS-typo_A13_30_5501.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/ST_ESMERALDA_PANTALLAS-typo_A13_18_6001.jpg"></div><br>
    The “<strong><a href="http://www.myfonts.com/fonts/sudtipos/esmeralda-pro/" rel="nofollow">Esmeralda Pro</a></strong>” project was initially born as a typographic project developed by Guillermo Vizzari –tutored by Ale Paul and Ana Sanfelippo– under completion of the Specialization in Typography Design at University of Buenos Aires, Argentina, during the years 2011 and 2012.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ST_ESMERALDA_PANTALLAS-typo_A13_04_3929.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/ST_ESMERALDA_PANTALLAS-typo_A13_36_4316.jpg"></div><p></p>
    <p>License “<strong><a href="http://www.myfonts.com/fonts/sudtipos/esmeralda-pro/" rel="nofollow">Esmeralda Pro</a></strong>” until end of June with a 30% Off<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/descuento_5408.jpg"></div><p></p>
    <p>Visit <strong><a href="http://www.sudtipos.com" rel="nofollow">Sudtipos</a></strong></p>
