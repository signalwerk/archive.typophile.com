      <p>@john<br>
      The fonts I have seen in which the medial heh takes the shape of the initial tend to be fairly recent designs, and it seems to be a stylistic decision rather than a technical solution à la Simplified Arabic.</p>
      <p>I think this decision also relates to that fact that making simplified arabic is much less time consuming and more convenient for the designer,  not because number of designed glyphs are reduced, also in this style the designer doesn't have to match connecting parts of every glyphs with each other, baseline becomes straight and you don't have to worry about "oh I don't know if the connection between "gaf" and  "jim" would be good but   "jim" wouldn't match with other glyphs like "ra" and so on". cursive baseline needs a lot of effort. I saw new designs of cursive baseline that the baseline is not harmonized through the glyphs so when you are reading a text it's like you are surfing on a stormy ocean, moving up and down.</p>
