      <p>@Marcin<br>
      Last question: what causes that some type designs repeat the initial form in the medial glyph? Is it a search for regularity?</p>
      <p>No, it's called simplified arabic, in the past typewriters couldn't handle all of arabic forms in a single keyboard, so linotype AFAIK created yakout to reduce number of glyphs. so initial and medial forms in most cases are same, this also happens in most of final and isolated form. this tradition is continuing until now but I don't know the reason, because there is no such limitations in opentype.</p>
      <p>Bahman</p>
