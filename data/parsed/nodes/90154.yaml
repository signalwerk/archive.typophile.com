    html: "<p>I don't think this works, Marcin -- your modified Scheherazade on the right -- because the effect seems to be of a letter sloppily written rather than a new form. In the traditional open form (centre in your original image) the construction is clearly different from the closed form: the pen moves downwards from the horizontal instead of making a reversal. Your form looks like someone has tried to make the closed form but hasn't quite carried the stroke far enough.</p>"
