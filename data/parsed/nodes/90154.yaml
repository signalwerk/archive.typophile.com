    html: |-
      <p>I think I should give explanations. I am not a fan of opening counters and loops. I find very often the black knot of Ain much more legible than the opened one. That's the flavour of Arabic script. But some designs demand more regular gray pattern.</p>
      <p>As I am not a native speaker, I am framed by things I have seen and learned. So in some cases, to go forward, there is no other way but formulate hypothesis. So I put here that the initial/incoming and the second strokes of Heh are of the same origin:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_4755.jpg"></div><br>
      Because there are numerous open variants of the Letter, I supposed it was possible to shorten the incoming stroke, removing the black area while still having two ears of Heh. Now I am sure, that changing the shape was a wrong way. But what do you think of this approach as shown below?<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-2_4361.jpg"></div><br>
      (Scherezade; the initial form unchanged)<p></p>
