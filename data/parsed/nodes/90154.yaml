    html: |-
      <p>Bahman, while it is true that most letters in the Simplified Arabic scheme shared initial/medial and isolated/final forms, this was not the case with <em>heh,</em> which was an exception to that practice in Yakout. You can confirm this if you enter  ه ههه in the <a href="http://www.myfonts.com/fonts/linotype/yakout-2/" rel="nofollow">Yakout text sample on Myfonts</a>.</p>
      <p>The fonts I have seen in which the medial <em>heh</em> takes the shape of the initial tend to be fairly recent designs, and it seems to be a stylistic decision rather than a technical solution à la Simplified Arabic. Some examples:</p>
      <p><a href="http://www.myfonts.com/fonts/hibastudio/hasan-hiba/" title="http://www.myfonts.com/fonts/hibastudio/hasan-hiba/">http://www.myfonts.com/fonts/hibastudio/hasan-hiba/</a><br>
      <a href="http://www.myfonts.com/fonts/linotype/hakim-ghazali/" title="http://www.myfonts.com/fonts/linotype/hakim-ghazali/">http://www.myfonts.com/fonts/linotype/hakim-ghazali/</a><br>
      <a href="http://www.myfonts.com/fonts/linotype/isra/" title="http://www.myfonts.com/fonts/linotype/isra/">http://www.myfonts.com/fonts/linotype/isra/</a><br>
      <a href="http://www.myfonts.com/fonts/linotype/sultan-nahia/" title="http://www.myfonts.com/fonts/linotype/sultan-nahia/">http://www.myfonts.com/fonts/linotype/sultan-nahia/</a><br>
      <a href="http://www.myfonts.com/fonts/linotype/firas/" title="http://www.myfonts.com/fonts/linotype/firas/">http://www.myfonts.com/fonts/linotype/firas/</a><br>
      <a href="http://www.myfonts.com/fonts/linotype/insan/" title="http://www.myfonts.com/fonts/linotype/insan/">http://www.myfonts.com/fonts/linotype/insan/</a></p>
      <p>Interestingly, several of these were winners in the Linotype Arabic type design competition, and produced around the same time but by different people.</p>
