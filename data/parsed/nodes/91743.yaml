    date: 2012-04-04T09:40:00
    date_raw: 4 Apr 2012 — 9:40am
    votes: null
    html: |-
      <blockquote><p>Is there a trick to balancing out the weights of different characters?</p></blockquote>
      <p>I'm not sure there are any "tricks", but to do everything optically. I had a lot of trouble with that originally—I always wanted to make the stems exactly the same thickness (mathematically), and optically it doesn't tend to work. Your stems all seem to thin right now compared to other parts of the letters. The diagonals don't actually work—in the case of the 'v', the left side should be your thick side and be about the same thickness as the stems. Note you need to measure at the angle of incline, if you're measuring. I use some old calipers for measuring (stole the idea from Dunwich Type), and that works really good because I hate fiddling with digital measuring tools, but you can use the ruler in Inkscape or Fontforge and that'll work fine. Or you can copy a straight-stemmed letter like 'i' and rotate it over top of your 'v' at the angle the stroke goes. That would be a good starting point for the thick side. The thin side wants to probably be as thin as the bar of the 'e' or crossbar of the 't'.</p>
      <blockquote><p>I'm currently working in Inkscape, and intend to move to FontForge. So I should be doing the rest of the characters inside FontForge?</p></blockquote>
      <p>I highly recommend it. That will get you thinking about things like body size and sidebearings much more early on, and allow you to quickly make tests for print. It's hard to get used to at first, but you'll need to learn Fontforge anyway if you plan to use it. I'd recommend opening up other fonts and seeing how they're put together. It's probably a good idea to look at Fontforge files too, since they will be the most "human understandable", because it will be in source form, and some of the background layers and other things will probably still be in there. My <a href="http://impallari.com/projects/overview/neuton-serif-family" rel="nofollow">Neuton</a> has the .sfd files available in the download Raph Levian also has <a href="http://levien.com/type/myfonts/" rel="nofollow">some fonts</a> on his website with download of the .sfd files, although many of them are not at all finished.</p>
