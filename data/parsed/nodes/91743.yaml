      <p>Ideally, you should post a pdf with dummy text, in multiples sizes, although what Bert recommended would probably work well. This can be zoomed for a closer look, or printed. An example of something similar would be: <a href="http://typophile.com/files/20120401-text.pdf" title="http://typophile.com/files/20120401-text.pdf">http://typophile.com/files/20120401-text.pdf</a> If you're designing this in Illustrator, that might be difficult to do, but required if you're doing a text font. If you're not already using a font program, you should move into that as soon as possible. A great program for beginners is Glyphs. Fontographer is also good. Most pros use Fontlab, although some have moved to Robofont, or use in-house development tools. I mainly use Fontforge.</p>
      <p>I have a few recommendations. Take what I say with a grain of salt—there are a lot of different schools of thought among Typophiles. I think this is probably worth pursuing, and there are a number of interesting things going on. However, you need to work on optically unifying the weights of all your strokes. The x-height also bounces up and an awful lot. In fact, letters like 'u' extend even above the round shapes. That's a no-no. There also seems to be varying levels of finish on your letters. Try an think about them all as members of a family, and not individual letters by themselves.</p>
      <p>If most serif fonts look identical to your eyes, you might consider learning about the differences and classification, and studying the forms more. Another thing that might help you is to read other critique threads here on Typophile. You can learn a ton from them. The thread on Ernestine is really great.</p>
