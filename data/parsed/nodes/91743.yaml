    html: "<p>Hrant: Mine are just old small friction outside calipers. (Like <a href=\"http://www.amazon.com/Starrett-26-12-Firm-Joint-Outside-Caliper/dp/B0002FUNCI/ref=sr_1_4?ie=UTF8&amp;qid=1333561800&amp;sr=8-4\" rel=\"nofollow\">this</a>, but smaller.) I hold 'em up to the screen and adjust them to the width of whatever I am measuring. I always measure to compare, so I then move to the other part or glyph I want to compare it to and hold it up. Works like a charm—better than a ruler for comparison. I think straight \"pointers\" or something to that effect, used in drafting, is more appropriate, but I don't have any of those. Anyway this saves time for me.</p>"
