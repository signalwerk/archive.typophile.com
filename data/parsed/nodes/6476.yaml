    html: <p>I think it's pretty obviously hand-lettered -- no two instances of the same letter (E, A, C and R, for example) are the same.  <br> <br>That said, the '70s vibe and tiny serifs remind me of ITC Serif Gothic. <br><a href="http://www.myfonts.com/fonts/linotype/itc-serif-gothic/" target="_blank">http://www.myfonts.com/fonts/linotype/itc-serif-gothic/</a></p>
