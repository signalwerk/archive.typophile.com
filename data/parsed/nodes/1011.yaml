    html: <p>Sorry guys, <br>I started this thread, but I couldn't react myself sooner. <br> <br>I was just wondering this question myself. Because as you commented right, when a face is made bold, it starts becoming a caricature. Several people have tried different theories to make type more bold. But most of them didn't loose the caricature factor. Why is this? <br> <br>Couldn't there be a way to make type bold, whitout this effect?  <br> <br>And I have a second question. Now we take bold type for granted, but it is a 'modern' feature of faces.  <br></p>
