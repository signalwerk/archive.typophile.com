    html: "<p>RE: Political messages. <br> <br>Sorry. I did not realize that it was invited by the moderators. I am happy to abide by the rules ...etc. <br> <br>I made the comment because for me type and books are a way to relax and find some small enjoyment in a difficult world. It is a minor irritation to be reading along with a smile and then encounter a slogan that slams 'my president'. I just do not want to deal with that while I am here. <br> <br>Please do not make the assumption that I am not active, engaged or that I am somehow creating a lifestyle of avoidance, as that would not be correct. <br> <br>I have invested a great deal of time researching this who Iraq situation, talking about it and staying abreast of it. I read a number of publications that deal with word issues, events, politics, policy and so on. <br> <br>Typophile and type related pursuits are a break for me. That is all. <br> <br>Thank you for the polite and helpful responses and I am glad my question did not derail the topic of this tread! <br> <br>;) <br> <br></p>"
