    date_raw: 20 Apr 2011 — 11:43am
    votes: null
    html: |-
      <p>Fontographer is a very solid tool. Even if you want to make high-end complex font, you can add Microsoft VTT for hinting and Microsoft VOLT for OpenType Layout features, and use Fontographer to produce a very solid font that is then processed with those Microsoft tools. </p>
      <p>Perhaps somebody may confuse "simple" with "simplistic". To me, "simple" is a great virtue. Basically, you cannot build a "bad" font with FOG 5 (except for the few bugs, of course, which blur the picture). The user interface is solid, the drawing tools are solid, the underlying technology (thanks to the FontLab engine under the hood) is also very solid. </p>
      <p>I think this kind of reflects the current trend in other areas. A micro-four-thirds Lumix GH2 camera may be some considered a "children's toy", but some professionals actually use it to shoot films and music videos. Apple's GarageBand or iMovie aren't really "children's toys" either. Sure, there is the final 2% of finesse for which you may end other tools (conveniently, the free Microsoft come in handy as a complement for FOG). But with Fontographer, it's certainly very easy to start with just your drawing skills, and get a professional result. It's, essentially, only the skills that make the difference. A tool like Fontographer, is almost "transparent". It exposes the designer's skills, bare-bones. </p>
      <p>(Matthew Carter still uses Fontgrapher to design his fonts, as an example.)</p>
