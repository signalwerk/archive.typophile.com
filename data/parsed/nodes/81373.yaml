    html: |-
      <p>We're sorry for this bug. Since in .otf fonts kerning is an OpenType Layout feature, and the support for adding OpenType Layout features was completely new in Fontographer, we made some mistakes in implementing in in Fontographer 5.0. </p>
      <p>FOG 5.1 is pretty much done and is in the last phase of beta testing. It'll be a free update for all FOG 5.0 users.</p>
