      <p><em>I read one comment here on Typophile which described Fontographer as a 'children's toy', I can't believe how some people totally miss the point about creating a tool for the graphic and type designer who doesn't aspire to become a font engineer.</em></p>
      <p>IMHO, this "children's toy" is, bar none, the best tool for BUILDING a font, while FontLab excels at FINISHING a font...which is not to say that both products couldn't be improved, but FOG5 is a valuable tool in the hands of a person who knows how to use it.</p>
