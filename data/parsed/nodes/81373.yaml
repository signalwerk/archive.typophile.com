      <p>Yes, I think you're right Nick, in the event of such a major faux pas I think owners should have received an urgent email.<br>
      The fixed version is on the way, Fontlab Sales emailed me yesterday, "we expect Fontographer 5.1 in early May", I trust this will be a free update.</p>
      <p>I don't want to be too negative because I still feel grateful to FontLab for breathing life back into Fontographer, especially in the face of criticism that their engineers would have been better employed updating FontLab. I read one comment here on Typophile which described Fontographer as a 'children's toy', I can't believe how some people totally miss the point about creating a tool for the graphic and type designer who doesn't aspire to become a font engineer.</p>
