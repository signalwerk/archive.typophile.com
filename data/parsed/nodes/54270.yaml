    <p>I have a client who has asked me to figure out which countries in a list use "plain" <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a> and which use an extended alphabet/encoding. I told the client I need help to do that reliably, so here I am. Below is the list, with what I know or think (the latter marked with a question mark) shown. (Note that some of these countries have a completely non-Cyrillic primary alphabet, but still use some flavor of Cyrillic as a secondary system).</p>
    <p>Armenia: P</p>
    <p>Azerbaijan: E?</p>
    <p>Belorussia: P</p>
    <p>Georgia: P</p>
    <p>Kazakhstan: E</p>
    <p>Kirghizistan: E</p>
    <p>Moldova: P?</p>
    <p>Russia: P</p>
    <p>Tajikistan: E?</p>
    <p>Turkmenistan: E?</p>
    <p>Ukraine: P</p>
    <p>Uzbekistan: E?</p>
    <p><em>Many thanks for any confirmations/corrections.</em></p>
    <p>hhp</p>
