    html: <p>I usually make a distinction between Slavic Cyrillic ('plain') and non-Slavic Cyrillic ('extended'). This seems to work quite nicely because, so far as I recall, all the non-Slavic orthographies require at least one letter that is not found in any Slavic orthographies. This, in turn, allows you to quickly identify the two sets based on linguistic group.</p>
