      <p>This depends on what is meant by "plain Cyrillic", which is a nebulous concept considering the history of the script and various reforms that took place for different languages. (Trying to define "plain Latin" runs into similar problems, believe it or not.)</p>
      <p>For simplicity's sake I'll consider the letters encoded in <a href="http://en.wikipedia.org/wiki/ISO_8859-5" rel="nofollow">ISO 8859-5</a>, which never caught on but whose Cyrillic letters form the basic Cyrillic block of Unicode, to be "plain Cyrillic". Then Bulgarian, Belarusian, and Russian are covered by plain Cyrillic.</p>
      <p>Here are the rest, and the letters not supported by ISO 8859-5.</p>
      <p>Azerbaijani: ғ, ә, ҝ, ө, ү, һ, ҹ<br>
      Kazakh: ә, қ, ғ, ҳ, ө, ұ, һ<br>
      Kyrgyz: ң, ө, ү<br>
      Moldovan: ӂ<br>
      Tajik: ғ, ӣ, қ, ӯ, ҳ, ҷ<br>
      Turkmen: ә, җ, ң, ө, ү<br>
      Ukrainian: ґ<br>
      Uzbek: қ, ғ, ҳ</p>
      <p>I haven't been able to find much data on Cyrillic as used for Armenian and Georgian.</p>
      <p>Caveats: I've listed the above in terms of languages, but of course in reality Russian dominates Belarus and some parts of Ukraine, Russia also hosts a lot of minority languages that use their own extended versions of Cyrillic, etc. Also, pre-reform Russian or Bulgarian had letters that wouldn't be considered "plain Cyrillic".</p>
      <p>ETA: It's interesting how Unicode organizes Cyrillic characters. There is a block called "Basic Russian alphabet" and another called "Cyrillic extensions"; these together make up what I've called "plain Cyrillic" above. If we restrict ourselves to the "Basic Russian alphabet", then even Russian has a letter that is not supported, ё, which, to be fair, can be replaced with е in most circumstances. Belarusian ў is also not supported. Bulgarian ѝ, while not considered part of the alphabet, is used in the orthography, and also is not supported in the "Basic Russian alphabet".</p>
