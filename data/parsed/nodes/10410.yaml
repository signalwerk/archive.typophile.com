    html: "<p> A quick reflection on numeral extenderness: <br> <br>Now that we're in the 21st century I think there's an extra reason to make the \"2\" ascending: under the conventional scheme the first three digits of a year will all be x-height until the year 2030. Furthermore, any references to 2002, 2001 and 2000 are *entirely* x-height. Down with blandness! <br> <br>hhp </p>"
