    html: "<p> I was never sure about any hierarchy between Miller and Georgia - all I knew was that they were  designed in the same year (right?), which might make one think that the influence went both ways (especially considering how long a good type design takes). On the other hand, since Georgia can be considered a \"lower-grade\" font (in its outlines if not its on-screen rendering), maybe it's safer to see Miller as the father. Is there any documentation about this? <br> <br>Austin: <br>As I mentioned, I thought/suspected that somebody had done hybrid numerals before Carter. But would Austin -as a punchcutter- take such innovative liberties? Maybe he just cut numerals somebody else designed (who)? Also, wasn't Austin -among other things- Bell's punchcutter? Bell innovated the 3/4-height numerals (which I adore, and which are actually an [indirect] feature in Fenway too - more later); did he also innovate the hybrids? <br> <br>hhp </p>"
    html_clean: "<p> I was never sure about any hierarchy between Miller and Georgia - all I knew was that they were  designed in the same year (right?), which might make one think that the influence went both ways (especially considering how long a good type design takes). On the other hand, since Georgia can be considered a \"lower-grade\" font (in its outlines if not its on-screen rendering), maybe it's safer to see Miller as the father. Is there any documentation about this? <br> <br>Austin: <br>As I mentioned, I thought/suspected that somebody had done hybrid numerals before Carter. But would Austin -as a punchcutter- take such innovative liberties? Maybe he just cut numerals somebody else designed (who)? Also, wasn't Austin -among other things- Bell's punchcutter? Bell innovated the 3/4-height numerals (which I adore, and which are actually an [indirect] feature in Fenway too - more later); did he also innovate the hybrids? <br> <br>hhp </p>"
  - id: 65805
    user: 1250
    date: 2002-01-30T11:45:00
    date_raw: 30 Jan 2002 — 11:45am
    votes: null
    html: "<p> So I went to check out those hybrid numerals in Sports Illustrated, and they were even nicer than I expected. For those wondering: they're basically 3/4 height numerals of wide set, but with a very modest oldstyle up&amp;down: the effect is one of friendly sophistication - and it's more readable (and to a lesser extent more legibile too) than any lining scheme. So I think I'm going hybrid next time! <br> <br>BTW, another interesting thing was the smallcaps. I'm calling them midcaps: they're taller and not so wide, and seem to have been designed to set acronyms in running text, as opposed to mixing with \"normal\" caps. And to be honest, very few people use smallcaps - acronyms are so much more common, so maybe we should be making midcaps instead (or at least first/primarily)? <br> <br>In toto, in the context of American sports, both the numerals and the midcaps seem to be very intelligent solutions. <br> <br>I also found the font as a whole to be very nice, even though I really don't like Moderns; it sort of reminded me of Olympian, the way Carter took a dated model and deftly made it much better (like the lc \"k\", in both Fenway and Olympian). <br> <br>BTW, speaking of numerals, Jonathan, if I may ask: <br>What do you think of using other distributions of the up&amp;down? For example, what about making the \"3\" and \"5\" ascend instead of descend? Some old French foundries (like D&amp;P) used to do this, and I like it better myself - but virtually everybody does the oldstyle figures the same way. Is there a reason besides conformity? <br> <br>hhp </p>"
    html_clean: "<p> So I went to check out those hybrid numerals in Sports Illustrated, and they were even nicer than I expected. For those wondering: they're basically 3/4 height numerals of wide set, but with a very modest oldstyle up&amp;down: the effect is one of friendly sophistication - and it's more readable (and to a lesser extent more legibile too) than any lining scheme. So I think I'm going hybrid next time! <br> <br>BTW, another interesting thing was the smallcaps. I'm calling them midcaps: they're taller and not so wide, and seem to have been designed to set acronyms in running text, as opposed to mixing with \"normal\" caps. And to be honest, very few people use smallcaps - acronyms are so much more common, so maybe we should be making midcaps instead (or at least first/primarily)? <br> <br>In toto, in the context of American sports, both the numerals and the midcaps seem to be very intelligent solutions. <br> <br>I also found the font as a whole to be very nice, even though I really don't like Moderns; it sort of reminded me of Olympian, the way Carter took a dated model and deftly made it much better (like the lc \"k\", in both Fenway and Olympian). <br> <br>BTW, speaking of numerals, Jonathan, if I may ask: <br>What do you think of using other distributions of the up&amp;down? For example, what about making the \"3\" and \"5\" ascend instead of descend? Some old French foundries (like D&amp;P) used to do this, and I like it better myself - but virtually everybody does the oldstyle figures the same way. Is there a reason besides conformity? <br> <br>hhp </p>"
