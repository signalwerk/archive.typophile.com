    html: "<p> I forgot something about Fenway: <br>Because of their nature, the numerals often look like their *spanning* the lowercase, as opposed to sitting on the baseline or hanging from the x-line. For example in something like \"Porsche 955\". What's most fascinating is that Carter has previously expressed interest in the Ancient Greek method of putting glyphs on a centerline, as opposed to making them fit between multiple lines - and \"Skia\" comes to mind as one [partial] implementation of this. I like it. <br> <br>hhp </p>"
