    html: "<p>Correction/Elaboration: <br>I guess it was about 4 years earlier, sorry: <br><a href=\"http://www.microsoft.com/typography/fonts/fonttest.asp?FID=4&amp;FNAME=Georgia&amp;FVER=2.05\" target=\"_top\">http://www.microsoft.com/typography/fonts/fonttest.asp?FID=4&amp;FNAME=Georgia&amp;FVER=2.05</a> <br>Note that -possibly contrary to Carter's preferences- the MS guys decided to replace the hybrid figures with \"proper old-style figures\", in 1998. Although I like the hybrid approach, I suspect that MS might have done some -possibly informal- focus group sessions where enough people complained that the figures \"seem somewhat misaligned or something\" that they decided to play it safe and make them *really* \"misaligned\" (traditional old-style), so as to \"snap away\" from the bothersome \"somewhat misaligned\" stigma and go into the open waters of \"just not aligned\"... :-)  This might be especially true in the low-res screen world, Georgia's primary target. As for Solex, considering it's essentially a display face, I'd prefer lining figures, at least as the primary form (although alternates -especially coupled to OpenType technology- are always welcome). <br> <br>hhp</p>"
    html_clean: "<p>Correction/Elaboration: <br>I guess it was about 4 years earlier, sorry: <br><a href=\"http://www.microsoft.com/typography/fonts/fonttest.asp?FID=4&amp;FNAME=Georgia&amp;FVER=2.05\" target=\"_top\" class=\"link-external\">http://www.microsoft.com/typography/fonts/fonttest.asp?FID=4&amp;FNAME=Georgia&amp;FVER=2.05</a> <br>Note that -possibly contrary to Carter's preferences- the MS guys decided to replace the hybrid figures with \"proper old-style figures\", in 1998. Although I like the hybrid approach, I suspect that MS might have done some -possibly informal- focus group sessions where enough people complained that the figures \"seem somewhat misaligned or something\" that they decided to play it safe and make them *really* \"misaligned\" (traditional old-style), so as to \"snap away\" from the bothersome \"somewhat misaligned\" stigma and go into the open waters of \"just not aligned\"... :-)  This might be especially true in the low-res screen world, Georgia's primary target. As for Solex, considering it's essentially a display face, I'd prefer lining figures, at least as the primary form (although alternates -especially coupled to OpenType technology- are always welcome). <br> <br>hhp</p>"
