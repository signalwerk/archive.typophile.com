    html: "<p> Joe, that’s interesting! <br>Here’s my explanation: The light weight is intended for text, that’s why the numerals are shorter (less obtrusive). But the darker weights are intended for display (although I myself wonder about the middle one), so the numerals align with the caps. I wonder what the caps-ascender relationship is. <br><br>hhp </p>"
