    html: <p> This reminds me how increasingly designers are providing diﬀerent types of numerals for a given font (Enschede for example provides 4 or 5 kinds!), which in turn makes me realize that the same should be done with the <span class="caps">UC</span> set — and I’d say that it’s even more important there. You’d need a set for optimal readability (incuding a special set for German), a set for optimal scannability (where proper names are central), another set for acronyms, one for smallcaps, etc. But for some reason numerals get the lion’s share of this “alternate” attention. <br><br>hhp </p>
