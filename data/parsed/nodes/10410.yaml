    html: "<p> &gt; Are you suggesting random ascenders and descenders where words currently have none too!? <br> <br>Not random, but you've touched on something huge: the Latin alphabet needs more extenders (because it helps bouma divergence, hence recognition, hence reading). It's a major project to figure out how to carry out such changes (it's essentially a more ambitious flavor of my Alphabet Reform work), but some letters are better candidates than others, and I can for example cite the \"e\" as definitely needing a descender. <br> <br>And you want more blasphemy?  :-) <br>Here ya go: We should abandon the baseline. <br> <br>&gt; longest word with no ascenders <br> <br>That's a great little question! <br>Just to check: when you say no \"i\" or \"t\", you mean that those count as extending, right? That's probably fair, although some fonts have very shy \"t\"s. If you decide to allow the \"t\", then \"tobacco\" is a favorite of mine, not only because it doesn't have extenders, but because set in something like Futura or AG, it clearly shows the functional weaknesses of such typefaces. <br> <br>hhp </p>"
    html_clean: "<p> &gt; Are you suggesting random ascenders and descenders where words currently have none too!? <br> <br>Not random, but you've touched on something huge: the Latin alphabet needs more extenders (because it helps bouma divergence, hence recognition, hence reading). It's a major project to figure out how to carry out such changes (it's essentially a more ambitious flavor of my Alphabet Reform work), but some letters are better candidates than others, and I can for example cite the \"e\" as definitely needing a descender. <br> <br>And you want more blasphemy?  :-) <br>Here ya go: We should abandon the baseline. <br> <br>&gt; longest word with no ascenders <br> <br>That's a great little question! <br>Just to check: when you say no \"i\" or \"t\", you mean that those count as extending, right? That's probably fair, although some fonts have very shy \"t\"s. If you decide to allow the \"t\", then \"tobacco\" is a favorite of mine, not only because it doesn't have extenders, but because set in something like Futura or AG, it clearly shows the functional weaknesses of such typefaces. <br> <br>hhp </p>"
