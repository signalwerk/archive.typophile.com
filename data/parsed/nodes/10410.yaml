  html: <p>A friend pointed out some cool figures on the  <br>menu at Buzz 9 (in San Francisco) recently.  <br> <br><img src="http://www.typophile.com/forums/messages/4100/702.gif" alt="Solex Courtesy Emigre Typetease"> <br>Solex, Courtesy of Emigre's Typetease <br> <br>They are neither lining nor fully old style. The  <br>result is something that isn't so plain as lining  <br>figures without the jumpiness of the old style. <br> <br>Once again, Zuzana innovates with a knowing  <br>nod to the past. <br> <br>// joe</p>
