    html: '<p>Aquiline was originally offered by T-26 and was a Jim Marcus digitization/design. For some reason T-26 removed it from their collection a few years back. <br>Here is the Script Font ID Guide sample: <br><img src="http://www.typophile.com/forums/messages/83/64006.gif" alt="Aquiline One sample"> <br> <br>You might be interested to know that <a href="http://www.moorstation.org/typoasis/pirates/index.htm" target="_blank">typOasis</a> has a revision of Aquiline made by Manfred Klein and CybaPee (the site owner), called Aquiline Two.  You can see it has lost some of the flair of the original, and is actually based on the Expert Software version. <br><img src="http://www.typophile.com/forums/messages/83/64007.gif" alt="AquilineTwo sample"></p>'
    html_clean: '<p>Aquiline was originally offered by T-26 and was a Jim Marcus digitization/design. For some reason T-26 removed it from their collection a few years back. <br>Here is the Script Font ID Guide sample: <br><img src="http://www.typophile.com/forums/messages/83/64006.gif" alt="Aquiline One sample"> <br> <br>You might be interested to know that <a href="http://www.moorstation.org/typoasis/pirates/index.htm" target="_blank">typOasis</a> has a revision of Aquiline made by Manfred Klein and CybaPee (the site owner), called Aquiline Two.  You can see it has lost some of the flair of the original, and is actually based on the Expert Software version. <br><img src="http://www.typophile.com/forums/messages/83/64007.gif" alt="AquilineTwo sample"></p>'
