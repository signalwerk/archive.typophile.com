  - id: 58343
    user: 2088
    date: 2005-01-28T08:08:00
    date_raw: 28.Jan.2005 8.08am
    votes: null
    html: <p>Dave Nalle's <a href="http://www.myfonts.com/fonts/scriptorium/allegheny/allegheny/charmap.html" target="_blank">Allegheny</a> includes the original A among some alternate initials, showing it was probably based on the same source as the T-26 font, as you can see in the character map. <br> <br>I think the typOasis version may have mostly made changes to the kerning, which was always pretty horrible, even in Dave Nalle's version. Since Expert Software doesn't 'design' anything, as far as I know, I wonder who they ripped their version from? <br> <br>I think the funny T-26 Help section shows how often that font was asked about. I know I've ID'd it many times for people. This goes back to Mark's dissertation about people liking typefaces that 'stand out' (to paraphrase him). This explains the overblown popularity of Lys Calligraph that we have talked about several times, and, near the other end of the spectrum, of Bickham Script (and Zapfino). If it (Bickham) didn't have all those gorgeous swooping swashes, which many people can't even access in the OpenType font, no one would be as excited about it. <br> <br>That's one reason why Aquiline Two might be a let-down for some users. The more flamboyant original is more 'exciting' to play around with.</p>
    html_clean: <p>Dave Nalle's <a href="http://www.myfonts.com/fonts/scriptorium/allegheny/allegheny/charmap.html" target="_blank">Allegheny</a> includes the original A among some alternate initials, showing it was probably based on the same source as the T-26 font, as you can see in the character map. <br> <br>I think the typOasis version may have mostly made changes to the kerning, which was always pretty horrible, even in Dave Nalle's version. Since Expert Software doesn't 'design' anything, as far as I know, I wonder who they ripped their version from? <br> <br>I think the funny T-26 Help section shows how often that font was asked about. I know I've ID'd it many times for people. This goes back to Mark's dissertation about people liking typefaces that 'stand out' (to paraphrase him). This explains the overblown popularity of Lys Calligraph that we have talked about several times, and, near the other end of the spectrum, of Bickham Script (and Zapfino). If it (Bickham) didn't have all those gorgeous swooping swashes, which many people can't even access in the OpenType font, no one would be as excited about it. <br> <br>That's one reason why Aquiline Two might be a let-down for some users. The more flamboyant original is more 'exciting' to play around with.</p>
