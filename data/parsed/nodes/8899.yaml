    html: "<p>Since BJ mentioned Ludovico degli Arrighi as the possible inspiration for this face, here are Philip Bouwsma's (Ludovico Woodcut) and  P-22's James Grieshaber's (Operina Fiore) interpretations of his writing  from the Script Guide, Part 13: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/64143.gif\" alt=\"Ludovico Woodcut sample\"> <br><img src=\"http://www.typophile.com/forums/messages/83/64144.gif\" alt=\"Operina sample\"> <br> <br>There are plainer versions of both, but these show the over-the-top flourishes that seem to be the turn-on.</p>"
