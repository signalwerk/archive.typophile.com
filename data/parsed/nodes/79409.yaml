  html: |-
    <p>Not sure if this is the right place to post this request. I aim to create replica period maps. One that I have hanging on my wall is an 1857 Map by a cartographer called John Blair. The map is labelled by hand and I am trying to find a commercial typeface which approximates to the style used by Blair. Note the very long serifs on the capital letters.</p>
    <p>I've looked and looked for a typeface which might be similar but with no luck. </p>
    <p>Can anyone help? </p>
    <p>Many thanks in advance!</p>
