    html: |-
      <p>This reminds me of stuff by <a href="http://fonts.tom7.com/" target="_blank" rel="nofollow">Divide By Zero</a>. It's kind of quirky and fun. I agree with Eron about the 'S' and 's'. I don't mind the 'm' and 'n' - I think they fit the character of the font well.</p>
      <p>Overall, there's a lot of problems with contrast. Some glyphs ('7', '0', 'O') have a lot of contrast, while some ('X', 'x', 'M') have little to no contrast. Some glyphs have weight issues as well - the '2' and 'Z' seem kind of fat.</p>
      <p>I think your best shape is the 'g'. Try to get the other characters to be more consistent with it and each other.</p>
      <p> - Lex</p>
