    date: 2006-09-21T20:14:00
    date_raw: 21 Sep 2006 — 8:14pm
    votes: null
    html: |-
      <p>Well, the S has the weight in the wrong place--should usually thicken in the center. Check out other s's for <a href="http://www.typedesign.com/fonts/benmed.html" rel="nofollow">examples</a>. Also, the top right curves on the m and n taper oddly. Curves should be thickest at the sides and thinnest at top, if you are going for a vertical stress--your zero has it right. In general the letters need to be more consistent with each other.</p>
      <p><a href="http://www.typeworkshop.com/index.php?id1=type-basics" rel="nofollow">Underware has a good tutorial on letter design</a></p>
      <p>Also the wiki has some good links<br>
      <a href="http://typophile.com/wiki/Drawing_How-To" rel="nofollow">http://typophile.com/wiki/Drawing_How-To</a><br>
      <a href="http://typophile.com/wiki/How-To" rel="nofollow">http://typophile.com/wiki/How-To</a></p>
      <p>Eron</p>
  - id: 159222
