      <p>I've finally come back to look at this too, and I see a total load of crap! I don't think it can be saved.</p>
      <p>In the two years since I started this I have learned a lot, much at the guidance of all you good folks on this forum, and I have a much better eye for knowing something wrong when I see it, but I still have something to be desired when it comes to setting things right. To get what I set out to do here, a simple light serifed text face, I think I'll have to start from scratch.</p>
