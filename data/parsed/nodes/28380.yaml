      <p>The top terminal of the 's' and also that of the 'r' get a bit thin, maybe. The dot of the 'i' could be placed a bit more upward, I think. The 'j' as well of course.<br>
      I think the 'n' in itself is ok, but maybe a bit wide, when compared to the other glyphs. It has a very large space between the two strokes. I like the 'q' and the 'x' a lot. The capitals might be a bit too geometric? They lack the.. freedom of the lc, if you know what I mean. They are much more 'serious'.</p>
  - id: 175180
