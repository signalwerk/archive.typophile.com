    html: |-
      <p>A pet peeve I have with many fonts is the tendency of the "r" and "n", with tight kerning, slight over-inking, or even a modestly blurry monitor display, to combine to form what looks like an "m". I try to design those three letters with enough mutual distinction so that will not happen. </p>
      <p>You may be right that I went a bit overboard with the "n" in this case, though.</p>
