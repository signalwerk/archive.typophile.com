    html: |-
      <p>In those days such lettering was almost always hand-drawn.However, you should be able to find some close enough sans serifs to create a reasonable imitation of this look. Clearface Gothic and some other Gothic fonts would be the proper age to have been available then, even though neither of these would be identical to them.</p>
      <p>- Mike Yanega</p>
