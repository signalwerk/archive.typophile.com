    <p>Stage magician Howard Thurston (July 20, 1869 – April 13, 1936) used this logo on many of his beautiful show posters. He had the largest traveling Vaudeville magic show for the time.</p>
    <p>Can you id the two fonts used?</p>
    <p>Thanks.</p>
    <p>-Dale</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ThurstonLogo_6660.jpg"></div><p></p>
