    html: <p>S Allan - You'd be on shaky ground using Exmouth - or any Primafont font - commercially. They were a (now defunct) German company that sold ripoff clones of existing fonts. Exmouth was their clone of <a href="http://old.myfonts.com/fonts/linotype/kuenstler-script/" target="_blank" rel="nofollow">Kuenstler Schrift</a>.</p>
