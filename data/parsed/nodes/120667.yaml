    html: |-
      <div class="comment-spam-body"><p>For the script, consider a Spencerian script. For example the one   released by MacKellar, Smiths, &amp; Jordan around the 1880s. Ryoichi Tsunekawa has digitized it as Antique Spencerian  <a href="http://www.myfonts.com/fonts/flat-it/antique-spenserian/" title="http://www.myfonts.com/fonts/flat-it/antique-spenserian/">http://www.myfonts.com/fonts/flat-it/antique-spenserian/</a><br>
      A Spencerian script is an elegant, flowing style of cursive penmanship that was developed in the middle of the 19th century by Platt Rogers Spencer. Spencerian script handwriting became the dominant form of penmanship in the United States for the rest of the century. As you can see, strokes are graceful and rhythmic, and letterforms are characterized by flowing loops and flourishes.<br>
      A search for Spencerian script produces other similar fonts.<br>
      Don</p>
      </div>
