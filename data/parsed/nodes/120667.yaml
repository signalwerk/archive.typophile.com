      <p>"CINCINATI - PORTLAND": With the exception of |C| &amp; |T| it looks close to <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=CastleType%20%2F%20%28Commercial%29&amp;ffam=Goudy%20Trajan%20-%20Bold&amp;fid=caea74bab52abe86ab7747d842ebe62b&amp;fsize=60&amp;text=CINCINATI%20PORTLAND&amp;wrap=2" rel="nofollow">Goudy Trajan (Bold)</a></strong> (or medium) by  Frederic W. Goudy, Jason Castle [CastleType, 1994]</p>
      <p>The closer I can find for the script - though far from being a match - is a further slanted <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=FontDiner%20%2F%20%28Commercial%29&amp;ffam=Nelly%20Script%20-%20Regular&amp;fid=362b5f26ac95bc22483b748caaae03ad&amp;fstyle=i&amp;fsize=48&amp;text=The%20Public%20Landing%20%20by%20Moonlight%20c.%201875&amp;wrap=2" rel="nofollow">Nelly Script</a></strong> by  Crystal Kluge, Stuart Sandler [2009]<br>
      It may also worth checking the stylistic alternates of <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=FontDiner%20%2F%20%28Commercial%29&amp;ffam=Nelly%20Script%20Flourish%20-%20Regular&amp;fid=8d6c66aa779ec3afea3321119ece030a&amp;fstyle=i&amp;fsize=48&amp;text=The%20Public%20Landing%20%20by%20Moonlight%20c.%201875&amp;wrap=2" rel="nofollow">Nelly Script Flourish</a></strong> by the same designers</p>
      <p>"BY JOHN STOBART": you can go close by  emboldening an <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=DTPTypes%20%2F%20%28Commercial%29&amp;ffam=Engravers%20DT%20-%20Profile&amp;fid=de7eb42d1e0615cfd99962a428317c9c&amp;fstyle=b&amp;fsize=48&amp;text=BY%20JOHN%20STOBART&amp;fit=1" rel="nofollow">Engravers DT (Profile)</a></strong> [DTP Types, 1990]<br>
      The most noticeable differences are in |R|, |O|,  |A|, |S|</p>
