      <p>Still researching on my end, but I think the suggestions for Trajan are both close and may be what I'll end up going with. </p>
      <p>For the script, I found Shelley Script and Gracia Solo AS No. 44, but think the best match is one of the first I'd looked at, which is Exmouth.</p>
      <p>So far the Engravers DT Profile is the closest match, not sure if I'll find anything closer.</p>
      <p>I've a feeling the CAD plotter might have been how these were originally done, so I think you are all very clever!</p>
      <p>Thanks so much for the input! I'll let you know if I find an exact match.</p>
