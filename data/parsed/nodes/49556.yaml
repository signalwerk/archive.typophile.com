      <p>I have to say, still have a soft spot for good ol’ Rockwell and Memphis, although they lend a definite historical note. Lubalin Graph is so much like a slab-serif version of Avant Garde I can only use it in a similar way, and it’ll be a few years before I want to go that route! For a more modern feel I quite like Enclave.</p>
      <p>Don't have it but as I saw it just recently am currently in lust with Archer.</p>
      <p>Since it was mentioned: Guardian Egyptian I've been seeing a lot of lately (partner’s newspaper) and I don’t like the light, but the italics I loathe. Overall I really don’t like the way they use it.</p>
      <p>Personally I don’t really feel that bracketed serifs really belong in the same class as what I think of when I hear <em>slab serif</em> so definitely no Clarendon for me.</p>
