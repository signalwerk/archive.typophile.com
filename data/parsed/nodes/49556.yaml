    html: |-
      <p>I've been waiting for a thread like this! :P<br>
      I've been thinking about slabs; I think there's a shortage of nice slabs… most of them look a bit off, to me, like those old ones, <a class="freelinking external" href="http://www.linotype.com/1409/rockwell-family.html" rel="nofollow">Rockwell</a> and <a class="freelinking external" href="http://www.linotype.com/90275/stymie-family.html" rel="nofollow">Stymie</a>. <a class="freelinking external" href="http://www.linotype.com/1463/serifa-family.html" rel="nofollow">Serifa</a> is kind of nice, but I think those three work best when setting all caps. Not to mention the fact that they lack cursive italics. Anyway, I for one love <a class="freelinking external" href="http://www.linotype.com/1313/pmncaecilia-family.html" rel="nofollow">Caecilia</a>. And what about <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/lucasfonts/theserif_classic/" rel="nofollow">TheSerif</a>? And <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/elsner_flake/itc_officina_serif/" rel="nofollow">Officina Serif</a>?<br>
      I didn't know some of these you all mentioned, but none of them really won me over… Vista was almost begging to become a slab, that's a great one (I love Vista, so I love <a class="freelinking external" href="http://www.fontshop.com/search/?q=vista+slab&amp;x=0&amp;y=0" rel="nofollow">Vista Slab</a>), and <a class="freelinking external" href="http://www.youworkforthem.com/product.php?sku=t0133" rel="nofollow">Black Sabbath</a> is great in that quirky glitchy way. Should make some sweet posters!<br>
      But I see a possibility, here… I really need to start working on a slab. :P</p>
