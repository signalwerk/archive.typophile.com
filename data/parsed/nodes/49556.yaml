      <p><a class="freelinking external" href="http://www.dstype.com/prelo_slab.html " rel="nofollow"> Prelo Slab</a></p>
      <p><a class="freelinking external" href="http://christianschwartz.com/gdnegyp.shtml " rel="nofollow"> Guardian Egyptian</a> Unfortunately not for sale</p>
      <p><a class="freelinking external" href="http://christianschwartz.com/popular.shtml " rel="nofollow"> Polular</a> Unfortunately not for sale</p>
      <p>And FF ZIne and Lubalin Graph, which I have used for many projects.</p>
      <p>I really think Archer can't be a great and new alternative to the very used Serifa, Rockwell, Stymie etc. but I wish they would make a black/heavy weight of the font. Has anyone heard of plans of this? With Gotham they released a black version some time after the initial release.</p>
      <p>Oh, and speaking of Black Slabbath have you seen <a class="freelinking external" href="http://www.typetrust.com/fonts/font.php?id=NzQ3 " rel="nofollow"> Facebuster</a>?</p>
