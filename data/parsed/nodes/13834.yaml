  html: |-
    <p>Unger Fraktur was not designed by <a href="/node/14086" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gerard Unger</a>, but rather by <a href="/node/add/wiki?edit%5Btitle%5D=Johann%20Friedrich%20Unger" title="Create node &quot;Johann Friedrich Unger&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Johann Friedrich Unger</a> in 1793. Unger Fraktur is an attempt at a Didone-style Fraktur. It is a quite successful attempt, too. Many of the “superfluous” decorative elements of <a href="/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a> letters have been removed, without sacrificing feel or&nbsp;legibility.</p>
    <p>A digital version of the design is available from&nbsp;Berthold.</p>
  html_clean: |-
    <p>Unger Fraktur was not designed by <a href="/node/14086/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Gerard Unger</a>, but rather by <a href="/node/add/wiki?edit%5Btitle%5D=Johann%20Friedrich%20Unger" title="Create node &quot;Johann Friedrich Unger&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Johann Friedrich Unger</a> in 1793. Unger Fraktur is an attempt at a Didone-style Fraktur. It is a quite successful attempt, too. Many of the “superfluous” decorative elements of <a href="/node/13772/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">fraktur</a> letters have been removed, without sacrificing feel or&nbsp;legibility.</p>
    <p>A digital version of the design is available from&nbsp;Berthold.</p>
