      <p>Yes, I must clarify I was talking about the pronunciation in English. Different languages have different conventions for pronouncing Latinate names. In English, there's a broad agreement on pronouncing these. It's more complicated for French names (e.g. Garamond, Sabon) because there is tradition of both anglicizing the pronunciation (think Napoleon) and trying to imitate the French pronunciation to varying degrees, often with several pronunciations co-existing.</p>
      <p>William, as you can tell I'm a bit of a phonetics enthusiast. After re-reading what I wrote, I'm not sure I'm entirely making sense to those not familiar with the jargon!</p>
      <p>Writing the pronunciation as 'few-TURE-uh' works because TURE will be interpreted as starting with a historical /tj/. Many (including most Americans) will pronounce it as TOUR, others as TYOOR or CHOOR, so this one spelling covers all the possibilities. My own English mostly follows the features of Northeast American pronunciation, but I have no yod-dropping after 't', i.e., I distinguish 'tune' and 'toon'. So I personally say few-TYOOR-uh.</p>
