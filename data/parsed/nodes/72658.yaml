      <p>Jongseong:</p>
      <p>I should like to express my admiration for your high-class linguistic contributions to this thread.</p>
      <p>Arno Enslin:</p>
      <p>&gt; The e in the Latin word Venus is short.</p>
      <p>This is also a high-class linguistic observation.</p>
      <p>("venus" is derived from the Sanskrit root "van", with the short vowel "a", although this does not prove the short vowel "e" of "venus". For details to "van" and "venus", see Mayrhofer, Etymologisches Wörterbuch des Altindoarischen, Heidelberg 1996, Band 2, Seite 501).</p>
      <p>If we want to define the "proper" pronunciation of a given word, we cannot do this without defining the period of time, when the word was used. As Jongseong stated correctly, Shakespeare would not have understood today's pronunciation of English.</p>
      <p>If we want to define the "original" pronunciation of "Futura" as a font name, the proper period of time would be the lifetime of Paul Renner. The way, Paul Renner pronounced "Futura", is the proper original pronunciation of this font name.</p>
      <p>If we want to define the "proper" pronunciation of "futura" as a Latin adjective, we must define the period of time, to which our definition refers (e.g. the pronunciation of the adjective "futurus/a/um" during the lifetime of Caesar, as apposed to, e.g., the pronunciation of this adjective by medieval scribes in monasteries).</p>
      <p>For ancient languages such as Latin, Sanskrit etc., the "original" pronunciation cannot be defined with certainty. See for example <a href="http://www.sanskritweb.net/deutsch/ipa_sans.pdf" title="www.sanskritweb.net/deutsch/ipa_sans.pdf">www.sanskritweb.net/deutsch/ipa_sans.pdf</a></p>
    html_clean: |-
