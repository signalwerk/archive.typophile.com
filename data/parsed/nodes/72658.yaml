      <p><cite>Do you say “Paree” for the largest city in France, too?</cite></p>
      <p>Joe, you've misunderstood my whole point. I treated Futura like a normal English word from Latin. I wasn't suggesting that we apply a Classical Latin pronunciation, though others in this thread have.</p>
      <p>English has lots of words from Latin, and there's a pattern to how they are pronounced. There are complex alternations to the vowels according to which syllables receive stress, but native speakers have mostly internalized these rules. So we can read a word like 'sesquicentennial' which we have never heard pronounced, but can reasonably guess that it would be pronounced sesk-wee-sen-TEN-ee-uhl, while 'sesquicentenary' would be sesk-wee-SENT-uh-nare-ee. I'm just applying these rules to derive that Futura would be pronounced few-TURE-uh in English, and at least based on this thread this is what many other native speakers have come up with.</p>
      <p>English pronunciation being the complicated beast it is, your reasoning for your pronunciation (appealing to the pronunciation of a similar word) doesn't hold in general. 'Misery' isn't pronounced like 'miser' with an 'ee' at the end. Just out of curiosity, how do you pronounce 'century' and 'centurion'? Many North American speakers will have SEN-cher-ee for the former but sen-TOUR-ee-uhn for the latter. It is by a similar process that one would expect 'future' and 'Futura' to be pronounced FEW-cher and few-TOUR-uh for these speakers.</p>
