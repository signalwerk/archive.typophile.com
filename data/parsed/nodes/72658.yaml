      <p>My basic premis is to say it to communicate to your audience.  Years ago, I regularly went to a typesetter called Harvey. Harvey was from the old printing background--trade school, apprentice, journeyman. He was a printer by trade. He spoke the down to earth way. If i were asking him to set a job for me, I would say "Fuewturra" because that was the way he knew it and everyone else in the shop knew it. I once asked him to use "Unayvare" and he said, "What?", looking at me like I was from Neptune. I had slipped and used the pronunciation I had learned in a fine upstanding University from European born professor named Gui. It can be tough switching back and forth between talking to Harvey and Gui. Being oh so precise and insisting on correcting Harvey would have been rude and pretentious.  Besides, he would have just spit a chaw of tobacco in a can and ignored me. Harvey was a good typesetter. He was accurate, fast, and knew his H&amp;J. Gui was a very nice, very educated man who would have just smiled and said, "Zat iss vut you might call "Universe" here in America, no?  No need to be impolite to either one of them.</p>
      <p>I am always in great admiration of the many European, South American, and Asian visitors I have met here in the United States. Even though I might have to strain just a bit to understand their pronunciation of English, I am thrilled that they can do it. I would never dream of scolding them for their way of pronouncing words. I never correct them unless they ask me to. If I don't understand, I ask for further explanation.  I have met many wonderful people who struggle with English. If I were such an arrogant jerk as to only talk to people who speak perfect English, I would have missed out on meeting so many friends.  I just wish I could speak their languages half as well as they speak English.</p>
      <p>ChrisL</p>
