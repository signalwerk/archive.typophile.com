      <p>Joe, not all English native speakers will pronounce Futura like you do, and your analogy with 'future' doesn't necessarily hold.</p>
      <p>In 'future', the historical cluster /tj/ ('t' followed by the 'y' sound) is changed to /tʃ/ (the 'ch' sound) because it occurs in an unstressed syllable. This much is common to most dialects of English.</p>
      <p>However, when a historical /tj/ comes in a stressed syllable as it does in Futura, it is treated differently depending on dialect. In many American pronunciations, in fact, it is likely to turn into a plain /t/ (i.e. 'tune' is pronounced identically to 'toon'), a phenomenon called yod-dropping. Others preserve the /tj/, and still others will turn it into /tʃ/ (yod-coalescence).</p>
      <p>The last alternative is not something really associated with North American English. Do you also pronounce 'Turing' and 'enduring' as 'CHOOR-ing' and 'in-JURE-ing'? If not, your pronunciation can only be explained as a back-formation from 'future'. If Futura followed the normal course of English phonological development, we would expect it to be pronounced 'few-TOOR-uh' by those who have yod-dropping after 't'. I would expect 'few-CHOOR-uh' from someone who orders CHOO-na sandwiches, but it sounds jarring to me from a North American speaker.</p>
      <p>Nick's suggestion of 'few-TURE-uh' is the best since it works for any speaker, whether they preserve, drop, or coalesce the yod.</p>
    html_clean: |-
