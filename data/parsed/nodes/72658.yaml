      <p>I just found out while reading a description of North American English pronunciation that there were those who systematically pronounce 'TURE' as 'CHOOR' in a stressed syllable even if they pronounce a long 'TU' as 'TOO' when followed by consonants other than 'r'. So these people will say 'TOOB' and 'TOON-uh' for 'tube' and 'tuna', but 'muh-CHOOR' and 'CHOOR-ing' for 'mature' and 'Turing'. This explains why Joe and presumably John (quadibloc) pronounce it 'few-CHOOR-uh'. I wasn't familiar with this variation, which was why I was stumped at hearing it coming from North Americans.</p>
      <p>Joe, you do realize that 'few-TURE-uh' is a perfectly valid description of your own pronunciation if you regularly pronounce 'TURE' as 'CHOOR'? The point is that we're all talking about the same underlying pronunciation, even if there is some variation in how it comes out from the mouths of different people.</p>
