      <p>Arno, long ago when I was taught Latin, if I remember rightly "ad hoc" in the system I was taught should be pronounced ahd hoak. But the pesky Oxford Concise English Dictionary tells me what is correct is "ad (as ADvertising) hahk." <a class="freelinking external" href="http://www.merriam-webster.com/dictionary/ad+hoc" rel="nofollow">The (American) on-line Miriam Webster dictionary</a> gives "ad" as in "advertising" (the nasalized a, not existing in Latin, or German), and then "hahk" as the first pronunciation for "hoc" and the alternative as "hoak". You can listen to it on the site. </p>
      <p>Et cetera should, in the system I was taught, be pronounced "et ketera." But for all English speakers it is "Et Setera." And Julius Caesar is always with a J as in juice, not as I was taught is correct Latin, "yul-ee-us", and we always say "sieze-er", not the more Latin "kai-sar".</p>
      <p>The way foreign words, whether loan words like "et cetera" or proper names like "Julius Caesar" are pronounced is somewhat arbitrary in English—and any language—as they range from close to native to to totally Anglicised. But what happens is that one version gradually becomes established, and is certified in a dictionary. </p>
      <p>About 60% of English vocabulary comes from Latin words, either via French or directly from Latin. Probably none of them are pronounced in a strictly French or Latin way--under anybody's system of Latin. </p>
      <p>Tell me, why should I ignore hundreds of millions of native English speakers and all English dictionaries?</p>
