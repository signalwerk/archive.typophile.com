      <p>&gt; How to pronounce the typeface "FUTURA"</p>
      <p>Since "futura" is a Latin feminine adjective (futurus, futura, futurum, e.g. futura scriptura), it is pronounced in this way.</p>
      <p>see 25th line from top in this book:</p>
