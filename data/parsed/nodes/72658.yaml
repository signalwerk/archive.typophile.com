      <p>People take their cue for how to pronounce a word from how they've heard their peers say it, up to a point.<br>
      When I was a young ad agency art director in the 1980s and Jerry Schoolenberg of Techni-Process used to call on me every week with specimens of the latest ITC faces or whatever, it was his implicit responsibility to fill me in on how to say new type names like Benguiat, or, for that matter, old ones like Univers, because he'd heard them already. The trades had been bull pens for centuries, so there was nothing remotely "gay" in the way they pronounced words; they said them like they were written in their own language,-- rather like an English football commentator at the World Cup.</p>
      <p>So, for all you hardcore butch type geeks out there, say it like its wrote, damn it!<br>
      However, if you are more the <em>aficionado</em>, some kind of foreign accent will glamorize your persona, along with an expressive hand gesture.</p>
