      <p>&gt; what does ‘true to original’ mean</p>
      <p>For better or worse, it's pretty common for pronounciations to change when words cross language borders. Heck, even within a country you can find significant differences from region to region due to regional accents.</p>
      <p>And I suspect that when U.S. words spread to other countries, the same thing happens and they pronounce them using their local accents. (An exception might be words that they constantly hear pronounced the original way in commercials or in news reports. For example, I suspect that "McDonalds" is pronounced the same everywhere.)</p>
    html_clean: |-
