    html: |-
      <p>Proper pronunciation is affected by the "who" is speaking as well as the "who" is spoken to, not just the point of origin of the word.<br>
      If Eric Spiekermann were speaking German to Willi Kunz, who would be correct? Would this be different if they were both in Germany? both in Switzerland? both in Austria? Does even someone from Berlin speak the same as someone from Bavaria? What about Mr Spiekermann saying a French word to JFP? I have heard many people from different countries speaking a second language to a third person who is native to yet another country. People have accents or dialects or colloquialisms and they cannot extract them easily. This is not because they intend it to be so, it is just a reality. What if we had a Swiss from Lausanne, a Canadian from Quebec, an American from Louisiana, an Italian from Torino, and a Frenchman from Marseillie  all speaking French? Would they ever be able to have a conversation without correct each other's pronunciation? What if the same people were speaking English together? If we were to allow that language was a means of communications for people who care to converse, we would see that expecting and accepting exact pronunciation would make conversation impossible. We are better off just accepting that foreigners to us are just doing the best they can with their individual backgrounds.<br>
      We are all likely to have heard  the speaking voice of former U.S. Presidents Kennedy, Johnson, Nixon, Ford, Reagan, Carter, W Bush, and Clinton. There is a broad spectrum of ways of pronunciation of just American English.  </p>
      <p>Good thing the theme for this years TypeCon is "Babel". ;-)</p>
