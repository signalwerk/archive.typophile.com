      <p>"I miss a bit the respect for other languages there, because the name of the typeface is relatively young and it is a every day word for printers and typographers only."</p>
      <p>I doubt very much that my old typesetter Harvey ever heard Futura pronounced any other way than his way in his lifetime. I am sure he meant no disrespect to other languages, he was just using a word in the only way he knew and he was clearly being understood by everyone he worked with. Clear communication is the main reason for language.<br>
      My last name is never pronounced properly by anyone who does not speak Greek. This is not because people are disrespecting Greek, it is just that the differences between Greek and whatever their native language is is so foreign to them that it is not in their memory of sounds and speech patterns. I do not fault them for this. As long as I know what they mean, I am fine hearing "Lazose" "Lawzis" "Lowzis" "Lewzis" or what ever else.  The only time I will ever address someone about my name is if it seems they completely misunderstood it the the point of confusion. That is if they pronounce it like another name, "Lewis". I even had it pronounced "Lozotto" by my Junior High gym teacher. He wrongly assumed  that I was of Italian ancestry and tried to say it as his vision of how it might be in Italian. :-)<br>
      The worst case of pronunciation of my name was when I was 45 years ago while I was in boot camp. My drill instructor called me "Lozoa" as in Low-Zoe-Ah. When I told him the correct way, he insisted that I was wrong! He even had my name written LOZOA on my paychecks :-) It took me months to get it corrected in my service records. This was truly a case of "military intelligence" at its best.</p>
      <p>ChrisL</p>
