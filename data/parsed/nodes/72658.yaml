      <p><cite>“Footoora” is as incorrectly hypercorrect as white people pronouncing Nicaragua.</cite></p>
      <p>I had Latin for six years in school (a long time ago). I am in the same opinion as Riccardo and Uli. Footoorah! I think it is the nominalization of the adjective futura (femininum). I just don’t know, how I should translate “typeface” into Latin – probably as construction of the plural of nota (notae). I assume, Paul Renner had the German word “Schrift” (which is femininum) in mind, when he used the feminine form of the adjective futurus. So Futura probably has to translate to the “future (typeface)” or, in German, to “die Zukünftige” (“die zukünftige Schrift”).</p>
      <p><cite>Do you say “Paree” for the largest city in France, too?</cite></p>
      <p>That isn’t comparable. “Paree” is already the wrong pronunciation of Paris (the character from Greek mythology). As far as I remember the a in Paris (Πάρις) is long, when the character is meant. In German the name of the character from Greek mythology is differently pronounced than the name of the French main town.</p>
