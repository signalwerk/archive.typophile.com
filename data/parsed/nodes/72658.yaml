      <p>William, great post. I agree 100%.</p>
      <p>Joe implicitly suggested his own pronunciation was the only correct one for English native speakers, and it is this statement that I'm disagreeing with as someone quite interested in the topic of English pronunciation. Since the original poster wanted to know, I've explained how I think most native speakers would pronounce the name.</p>
      <p>But I recognize that Futura is not an everyday English word and that many pronunciations are possible. Joe's pronunciation of Futura, atypical as it may be for a speaker of his background (although I'm assuming a lot here just based on his being from Toronto), is not 'wrong'. In fact, there is a certain sense and logic to each of the pronunciations suggested here.</p>
      <p>I've used wrong pronunciations for 'awry', 'sword', even 'shepherd' at various points in my life, and am currently butchering French words every day while living in Paris. I make the effort to get my pronunciations right, and at the same time am understanding when others make mistakes. And as an English speaker still not quite used to the French pronunciations of English names, I can see why the traditional English pronunciation of Latin names sounds wrong to many non-English speakers here. We just have to recognize that we all have different traditions of pronouncing such names.</p>
      <p>By the way, McDonald's is often just pronounced 'mahg-doh' (McDo) here in France.</p>
