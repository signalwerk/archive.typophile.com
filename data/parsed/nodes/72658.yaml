      <p>&gt;Respect, knowledge.</p>
      <p>I am all in favor of both. </p>
      <p>Knowledge tells me that most native Germans and Italians and Japanese, etc, etc, who learn English after childhood will never pronounce most English words as a native Englishman—or American—does.</p>
      <p>Respect tells me I shouldn't be lecturing you when you use an English word when speaking your own language and pronounce it more closely to the way the word would be read using the rules and phonemes of your own language. These pronunciations become standard in the language, and those who affect a foreign accent for them sound odd or pretentious, and may not even be understood by other native speakers.  </p>
      <p>It shows a lack of knowledge and respect to chastise or ridicule those who, when speaking their native language, pronounce foreign words more closely to their own native language.</p>
      <p>I know a fellow who is truly bilingual in Cantonese and "Proper" English English. When he uses Chinese words in English he completely butchers them in exactly the same way that the English do--a way that a Chinese speaker probably wouldn't even understand. When he speaks Chinese, his pronunciation is completely native. Why? Because he wants to be understood, and knows what he's doing. Knowledge and respect.  </p>
      <p>By the way, when speaking German or French I would always say "footoora", and I'm told my accent is not too bad. --Unfortunately my knowledge of both of those languages is a lot worse than my accent! When speaking English I use my "few-ture-a". Why? Knowledge and respect.</p>
