    html: |-
      <p>IMO, fonts look fine for the Mac if the stem widths are consistent, and if glyph shapes (especially vertical extrema on curves) are consistent with regards to the alignment zones. Then, auto-hint in FontLab.</p>
      <p>I also suggest that you experiment with the Blue Scale value (Type 1 hinting: global hinting parameters): I usually set it to 8 pts.</p>
