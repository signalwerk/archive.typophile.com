    html: |-
      <p>fd2&gt; Only truetype hinting will make the font look good at small sizes.</p>
      <p>This is true, but don't forget that only a little bit of TT hints are interpreted by most anti-aliasing windows machines and no mac anti-aliasing machines. </p>
      <p>So, only truetype hinting can make <em>some of the font</em> look good at small sizes, and the rest of making a font look good is left up to Microsoft and Apple at the rasterizing end.</p>
