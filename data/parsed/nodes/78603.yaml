  html: |-
    <p>I'm trying to optimize my font for small, set sizes on-screen (9pt, 11pt, 13pt) specifically for osx. i don't know very much about font-exporting and the rasterization process, but i'm told that i font-hinting doesn't work on osx because quartz doesn't listen to the hints. is there any other method of optimizing fonts for small sizes on macs? the only other solution i can think of is to make separate font files for each size… and that just seems downright sloppy.</p>
    <p>sorry this is a bit of a novice question, but my usual solution of scouring the internet for an answer hasn't been pointing me in any helpful directions.</p>
    <p>thanks in advance!</p>
