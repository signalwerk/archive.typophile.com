    html: <p>A short description of this is that the font's parameters to be fed to a rasterizer without hints are simplified in their diversity, and optical sizing is used to exaggerate the important features. That helps both Mac and Win, then the Win version needs hints to assure hairline appearance and alignment. There is a discussion of this <a href="http://typophile.com/node/80015" rel="nofollow">here</a>, in the context of Beat Stamm's expanded 1997 paper on hinting.</p>
