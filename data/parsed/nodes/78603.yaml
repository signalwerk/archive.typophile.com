    html: <p>Nick, none of the hinting effects Mac rendering as you know, and the stem widths are only consistent if you add up the colors used to represnt each stem, which most people do, it seems. Vertical alignment and precise stem weight from a single outline font are out of the designers or type engineer's scope of influence on the Mac, except in the choices made in the design of the single outline's contours themselves. No tricks, no hints. As for the dotting of the i  and crossing of the t, these things are trade secrets, ;)</p>
