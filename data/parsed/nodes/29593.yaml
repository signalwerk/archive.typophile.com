    html: |-
      <p>Rooster has a <a href="http://www.roostertypes.com/prod_display_single.asp?catalog_id=19836">Khayyam</a> revival that sounds like what you're looking for. On the same spread in the Solo book is also <a href="http://www.myfonts.com/fonts/urw/civilite-urw/">Civilite</a>, which is of course based on a French rather than Arabic model, but has the curvaceous scriptiness without the cheesy stereotype.</p>
      <p>In a similar vein is <a href="http://www.myfonts.com/fonts/urw/legende/">Legende</a> and its derivatives, including Caliph. There are a couple others on the Solo page, like "Timbuctu" and "Persian," but they're even cheesier than Falafel, so I wouldn't bother trying to track down digital versions.</p>
    html_clean: |-
