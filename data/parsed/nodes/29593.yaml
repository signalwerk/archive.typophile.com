    html: |-
      <p><strong>Papyrus.</strong></p>
      <p>Ha! Just kidding. </p>
      <p>No, seriously.</p>
      <p>Anyway, most typefaces that "mimic" foreign characters end up looking really cheesy and many times are a condescending stereotype. Your closest bet is to go with a decent script face, since most handwriting even across cultures tends to certain similarities, yet can get as wild and foreign as you want.</p>
      <p>Myfonts.com has a sale on a script typeface called Majidah that sounds like it might fit your bill.</p>
