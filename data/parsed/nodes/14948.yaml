    <p>i just read chapter 28 of <a href="/wiki/Anatomy%252Bof%252Ba%252BTypeface" class="wiki">Anatomy of a Typeface</a> last night...the chapter dealing with <a href="/wiki/Optima" class="wiki">Optima</a> and the Humanist san serif faces....it was really sad. at least the end of the chapter was very sad where they cite H. Zapf’s response to seeing Dwiggins’ attempt at an idea of a humanist san serif nearly like Zapf’s Optima. what hit home was the little picture of him sitting in a chair outside drawing. smoking a pipe.</p>
