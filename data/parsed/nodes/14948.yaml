      <p>Stellar (1929) is not a well-known face, and as a result Optima (1958), which follows in its footsteps, gets a certain amount of credit for innovative design which perhaps belongs to Stellar.</p>
      <p>Hermann Zapf was, as the publicity says, inspired by Renaissance stone-carved lettering, but I assume that he, August Rosenberger, and others at Linotype would have been aware of Stellar, learned from it, and positioned the design of Optima accordingly. </p>
      <p>The classical, humanist quality of Stellar’s regular weight is not so well conveyed in its bold, and it lacks an italic. (This lack of range may well have accounted for its obscure status.) So Optima, with its clever sloped roman “italic”, and full, well matched family, has proved a far more useful typeface in a wide variety of situations.</p>
