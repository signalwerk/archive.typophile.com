      <p>&gt;poor readability, even for a sans; too wide, too gray</p>
      <p>Optima is great, but a bit of a ’diva’. As the thread on matching serifs with it brought out, it is difficult to match, except with Zapf’s own faces. In smaller text the regular weight is too grey, but ’Optima Nova’ seems to have corrected that. My feeling is that its circular bowls in the lower case militate against it working well in smaller text, or large amounts of text. But among sans it is more readable than grotesques, though less so than the newer humanist sans. </p>
      <p>Its limitations are real, but so is its greatness.</p>
