      <p>&gt;curved stems</p>
      <p>I have seen somewhere in a longer account of the development of Optima a photo of the models that Zapf says inspired Optima, and they do have tapered stems. The inspiration for the idea of tapers was not technical but aesthetic, based on ancient models. Zapf means in that quote, I think, that the drawing of the taper was constrained by the demands of production of metal type. Some of the curves in Optima Nova have been changed—perhaps he wanted to do this in the first place, but couldn’t because of the demands of metal type.</p>
