      <p>Will, </p>
      <p>You might also find interesting a test or experiment Matthew Carter did in the 60’s in which he started with a nice renaissance roman and removed the serifs, to see what could be done. He was not at all happy with the immediate result, but continued redrawing it until an interesting, and more modern alphabet resulted. I saw this project mentioned in The monograph for the show “Typographically Speaking: The Art of Matthew Carter”, from Princeton Architectural Press. </p>
      <p>I saw Mr. Carter at TypeCon and mentioned this project, and he surprisingly didn’t remember it. It seems to be an interesting idea that can be approached many ways, and has been approached by several designers. Gudrun Zapf von Hesse made a similar type (Christiana) with more angled stress than Optima. It might be interesting to thoroughly trace the interest in this kind of modulated sans, or serifless roman. How to classify them is another endless thread.</p>
      <p>I’m working on a design for a serifless roman for text, which I hope to be able to preview here in the next few months.</p>
    html_clean: |-
