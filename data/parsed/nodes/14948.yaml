      <p>&gt;more correct than William</p>
      <p>Anatomy’s quote of Zapf is accurate, I believe. What is incorrect is your interpretation of it. </p>
      <p><a href="http://www.linotype.com/6-1808-6/optimanova.html">Here</a> is a  photocopy of the bank notes on which Zapf first drew the letters he saw in the Santa Croce church. He had no other paper and was so excited that he drew on the bank notes! You will see that the tapers are there. This was obviously before he drew his own version, Optima, and before he discussed manufacturing problems with the punchcutter and then with Linotype. </p>
      <p>This is consistent with my reading of the quote, above, and refutes your view that the tapers in Optima—and more generally its beauty—is a result of technical limitations.</p>
      <p>By the way, I noticed in looking at the Linotype site that the ’condensed’ version of Optima Nova just kills the beauty of Optima—so the wide lower case is an essential part of the look of the original. </p>
      <p>Addition: here in the attached PDF article on the linked site is more on the technical limitations and their role:</p>
      <p>“One distinctive design feature that gives Optima much of its elegance is the slight curve of the character strokes. While shaping this subtlety in fonts for hot metal and photocomposition was somewhat problematic, other characteristics Zapf intended for the original display design had to be dramatically compromised because of the technical limitations of text typesetting equipment. In Optima nova all of the letterforms have been reshaped as Zapf initially intended.”</p>
      <p>The article goes on to talk about the problem of the 18 unit system and spacing problems.</p>
