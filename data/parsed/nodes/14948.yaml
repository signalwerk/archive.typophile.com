      <p>&gt;nearly like Zapf’s Optima</p>
      <p>To my eyes, Dwiggens’s interesting effort at a humanist sans bears little resemblance to Optima, other than the fact that it uses greater thick-thin contrast than in the past with sans serifs—and in the manner of seriffed fonts. That is the only ’anticipation’. Dwiggens’s caps are not shown in ’Anatomy’, so there may be more resemblance with them. The caps of Stellar light, which ’Anatomy’ reproduces, have classical proportions and look more like Optima’s caps (without the tapered waist); Zapf was probably familiar with these.</p>
      <p>The lower case of Dwiggens, which is shown in ’Anatomy’ is narrow, whereas Optima is wide; the thick-thin contrast of the joins of the bowls and branches to the stems is much greater than the gentle modulation of Optima. And there are little suggestions of serifs on some of the strokes, but not the tapered waist that is characteristic of Optima, and whose sources in the 16th century and antiquity Zapf acknowledges. </p>
      <p>The way the tapered waist, gentle modulation and wide lower case goes together has an unforgettable unity and harmony of form that marks a great typeface and a unique creation.    </p>
      <p>Hrant, I don’t see anything in ’Anatomy’ about technical limitations being responsible for the tapered-waist sans; the inspiration was from the classical and antiquity sources. The brilliant handling of the idea and the creation of the lower case is Zapf’s genius at work.</p>
