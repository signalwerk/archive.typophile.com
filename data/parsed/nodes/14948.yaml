      <p>Bert,</p>
      <p>We released versions of four of the original weights of Albertus plus added two weights during the mid 1980s while I was at Agfa-Compugraphic (now Monotype Imaging).</p>
      <p>Here is part of the copy I pulled together for the specimen release:</p>
      <p><em>The early 1930s commemorative plaques of calligrapher and type designer Berthold Wolpe were highly regarded. These bronze inscriptions with their hard-angled, chiseled type were noticed with interest by the publishing world. As a result, Wolpe was soon commissioned</em> [by Stanley Morison, Monotype] <em>to produce an all capital letter typeface for book titling based upon his bronze works. By 1940, the family was expanded to include four complete faces.</em></p>
      <p>Here is a link to <a>Wolpe’s own description</a> of the development of Albertus.</p>
