      <p>Thomas: <cite>Why not just format it with “no break”? Or is this a feature not present in your DTP software?</cite></p>
      <p>If you mean the *nobreak* space character, it is usually 500 units -- an en-space. Too big. </p>
      <p>Back when we were using TeX, we had a new customer who used Quark, and wanted an ellipsis with fixed space between the periods, rather than the justifying word space (my preference). But they had trouble specifying that fixed space. With TeX, we could define \ellip{} to be anything (e.g., .\hskip.02em{}.\hskip.02em{}.). We set ellipses with about 30 different values for the horizontal skip, so they could pick a value. Faced with that level of choice, they just gave up &amp; said "set what you think looks good."</p>
      <p>Varying house style s not something the type designer should address. From my point of view, the ellipsis character is there only for those who don't really have an opinion.</p>
      <p>As to Chicago Style, I've sat in too many meeting where the Chicago editors had to field complaints about "Chicago style." Their answer, which seems perfectly appropriate to me, is that Chicago Style is the house style of the University of Chicago Press. Anyone who doesn't want to follow a particular part of it is free to do what they want. And while rare in practice, the University of Chicago Press does, on occasion, vary from their house style when it makes sense to do so. Formatting tables is one obvious place where the overall design of a book may require varying from the standard template &amp; style. That some other editors take Chicago Style as revealed truth rather than a way to proceed when all other things are equal is not Chicago's problem.</p>
      <p>The best answer is to think about what an ellipsis signals, and how this is best done within the rhythm of the text. It would be a copout to only look at what Bringhurst says, or Chicago says. Whatever you come up with will be a compromise, so pay attention to what you are willing to live with.</p>
