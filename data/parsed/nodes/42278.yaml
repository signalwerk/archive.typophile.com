      <p>You're right that it makes the parsing more difficult, so that's a pretty good point. But the space between the last word and the first dot should give it away: no space means the first dot's a period, space means it's the beginning of an ellipsis. As in jupiterboy's "Granpa" examples above, which also show different spacing after.</p>
