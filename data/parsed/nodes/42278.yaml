      <p>black current:</p>
      <p>Be aware that there are multiple styles -- Associated Press has one style, Chicago another, Modern Language Association another . . .</p>
      <p>Consider this, too. If you use a fixed space between the points in (and perhaps around) an ellipsis, you have a character that takes up an em's worth of space or more, conjoined to a word that probably takes up several ems worth of space. You also remove those spaces within the ellipsis as "justifying" spaces in a line. Finally, many editors also don't want to have an ellipsis begin or end a line. All right, now if you follow all these purities (fixed spaces, no line breaks, etc.,) there are going to be times when, in setting justified copy, the few remaining justifying word spaces in a line are either have to be huge (loose line) or tiny (tight line), in order to set the line. I suppose if you are only setting 60 lines -- a brochure -- that can be worked around. If you are setting a book, 7,000 lines, that's a PITA with any author favoring ellipses . . .</p>
      <p>BTW, PattyFab, my old Chicago says to use a 3-to-the-em fixed space between the points. (13th ed, section 10.36). That's a honking big space -- bigger than a nominal justifying word space. We tried to make them see the error of that spec when we wrote the glossary; dunno if they made a change in later editions.</p>
      <p>Charles' favorite dictum: "All editors, and all designers, would be better at their jobs if they had set type for a while."</p>
