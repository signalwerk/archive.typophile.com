      <p>This is, I think, another typewriterism that plagues typesetters. On a typewriter, there is no ellipsis character, so you have the choice of three periods, or three periods separated by spaces. The former is too tight, the latter is better, but too wide. Because it is better, it becomes the standard.</p>
      <p>Fifty years pass. Typewriters become extinct. Computer fonts do have ellipsis characters, but people who grew up with the typewriter spaced versions think they look too tight. It is like the second space after a period, which we are just now beginning to train typewriter-indocrinated people to omit.</p>
      <p>The solution is simple. Use the character that a professional typeface designer created to look perfect with his or her font. If that character is wrong, then you probably have a poorly designed font.</p>
