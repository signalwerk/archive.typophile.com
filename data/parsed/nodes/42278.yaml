    <p>Hello All,<br>
    I work at a magazine and we're discussing our use of the <a href="/wiki/ellipsis" class="freelinking" rel="nofollow">ellipsis</a>. Currently, we use period, full space, period, etc. and I find it makes me crazy. There's just way too much space. I suggested using period, thin space, period, etc. but a friend told me I should just use the glyph since that's what it's there for.</p>
    <p>What type of ellipsis are people using these days?</p>
    <p>Thanks!</p>
