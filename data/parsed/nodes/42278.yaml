    html: |-
      <p>Most editors are traditionalists and will prefer spaced periods. Most typographers consider this to be usually too much space. </p>
      <p>Periods set tight are too tight. Looks miserly.</p>
      <p>I think that using the ellipsis character can have it's own problems. For one thing, the design (spacing) of the ellipsis character can vary greatly among designers/foundries. Some are too tight, some are too loose. Usually the spacing between ellipsis and period has not been taken into consideration.</p>
      <p>Charles mentioned the problems with justifying, and Patty mentioned the problem with line breaks. (Patty, I can't remember how I used to do it in Quark, but you can search out the sequence period-space-period-space-period and substitute non-breaking spaces. I think you might have to export the text as tagged text and use the code for the non-breaking space, then re-import. It's been a while.)</p>
      <p>After some consideration, the practice I've arrived at in my own type designs is to space the ellipsis periods with an interval equal to the space character -- this yields an ellipsis which is a little tighter than spaced periods because is leaves out the sidebearings from the period character, but is looser than unspaced periods. </p>
      <p>I then set the sidebearings on the ellipsis so that when set alongside a period, the space between the two is consistent with the internal spacing of the ellipsis (this yields sidebearings on the ellipsis that are wider than the period). </p>
      <p>While I do some pair-kerning with the period, I don't apply the kerning values to the ellipsis. So there's a subtle distinction between period-ellipsis and ellipsis-period sequences, which shows up in the spacing relationship with the surrounding characters. I feel these differences support the subtle distinctions in how/why an author might sequence the two in either fashion.</p>
      <p>-- K.</p>
