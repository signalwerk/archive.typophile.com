      <p>I'm looking at a page on unicode space characters and still pondering:</p>
      <p><a class="freelinking external" href="http://en.wikipedia.org/wiki/Space_(punctuation)#Table_of_spaces" rel="nofollow">http://en.wikipedia.org/wiki/Space_(punctuation)#Table_of_spaces</a></p>
      <p>Especially the "thin space," "hair space," and "narrow no-break space." However, in Word, none of these break. </p>
      <p>In TNR, "thin-space" is the same width as "narrow no-break space," and using combinations of these and periods may be a viable solution.</p>
      <p>Part of the problem is that there are so many ways to create the ellipses. </p>
      <p>InDesign has a character format setting that can specify "do not break." </p>
      <p>Looking at eliason's post above, for PERIOD THEN ELLIPSIS it would seem allowable to allow a linebreak after the period/before the ellipsis, but for ELLIPSIS THEN PERIOD, to my eye, any line break at all doesn't work, including before the ellipsis.  </p>
      <p>Also there is a discrepancy (in response to Charles_E): in newer fonts, the non-breaking space is exactly the same width as the regular space, but in many "older" (in Internet years) fonts it is an en-space. The unicode definition calls for the nb space to be the same width as regular space.</p>
      <p>The advantage of using some type of space rather than a precomposed glyph is that your paragraph composer (human or programmed) could squeeze or stretch the ellipsis along with the rest of the line. </p>
      <p>But of course if there is no ellipsis in the font many will complain ...</p>
