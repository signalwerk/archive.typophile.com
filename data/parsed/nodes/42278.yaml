      <p>I hope you guys don't mind me reviving this interesting oldie, but I have to add that it seems quite US-centric. To add an international perspective: Putting spaces of any kind into the 3 dot sequence is not commonly done over here – I would say not in continental Europe, but at least not in Switzerland. Perhaps as a consequence, the unspaced "..." sequence does not usually seem too tight to me.<br>
