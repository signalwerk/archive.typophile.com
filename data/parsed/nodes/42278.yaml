      <p>My 2 cents:</p>
      <p>**  If you use the ellipsis character with justifying spaces flanking, you will at times end up with huge word spaces throughout the line, and then those tiny spaces between the ellipsis points. Looks really stupid. In fact, it says to me "the person who designed this layout or set this type . . . doesn't know how to make a line look good."</p>
      <p>**  I am not a strong believer that an ellipsis should not start a line. As a reader I find it no impediment to moving through the text. As a typographer, that little bit of open space does not look bad. Allowing a line to start with an ellipsis may also be a way to solve some other spacing problems.</p>
      <p>**  My preferred method is to use thin spaces within and flanking the ellipsis. If you have designed your text well, and used H&amp;Js that will give you nice, tight word spaces, the thins won't be that much different from the justifying spaces. This is what Al Johnson at Phoenix Type here in Minnesota does when he sets type for me.</p>
      <p>**  If all typeface designers took the care with the ellipsis (and with other sorts) that Kent does we'd all be better off and be able to go home earlier. Few do, though.</p>
      <p>**  Don't let editors badger you about type . . . or ellipses. Teach them what looks good.</p>
      <p>**  I was going to use the ellipsis character in this post, to make a point (so to speak), but I don't know where it is. I guess I don't really care since I'll never use it.</p>
      <p>powers</p>
