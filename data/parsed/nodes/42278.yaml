      <p>Patty: <em>Well James thanks for YOUR take on things but I work in book publishing where editors don’t take too kindly to “my way or the highway”. Chicago and Bringhurst are designed to set up common styles and conventions in typesetting that make it clear TO THE READER what is going on. If you want to reinvent punctuation, be my guest, but don’t expect your readers to thank you.</em> </p>
      <p>I have never sought to reinvent punctuation, only to keep it simple. Why do you assume bad faith regarding my methods (why else would you type in capitals)? The way I handle ellipsis is aimed at making it clear to the reader what is going on in a text.</p>
      <p><em>...if you’re typesetting a novel for folks to read, creating your own punctuation styles will only confuse, distract, and annoy your readers.</em></p>
      <p>I've not done novels or story anthologies, but for jobs where I've set prose fiction including dialog with ellipses and emdashes I quizz readers about the clarity of the typesetting. It turns out very few readers are even aware of any difference between ellipsis and emdash. For dialog the two marks have much the same effect and meaning as far as readers can tell.</p>
      <p><em>An ellipsis has a VERY different function editorially than an em-dash. The function of an ellipsis is to indicate omission in cited text. Yes, it is used as well to indicate a pause or hesitation in thought or trailing off, but those are not its primary function. In those latter cases it could perhaps be replaced with another character. But in its primary function it must be used as is.</em></p>
      <p>Why is ellipsis only supposed to be used to indicate omission in cited text? What about omission in other kinds of text? And if that's the editorial function of an ellipse, please define the editorial function of an emdash.</p>
      <p>charles_e: <em>I’m sure many of you don’t like all the characters in the Latin alphabet. They make kerning hard, and some of them are downright ugly. Plus, the Latin alphabet is archaic. Why don’t we just make a new one, with characters better suited to our tastes?</em></p>
      <p>I love all of the characters in the Latin alphabet. It could be improved a great deal however, if only the world would allow type designers to do so.</p>
      <p>j a m e s</p>
