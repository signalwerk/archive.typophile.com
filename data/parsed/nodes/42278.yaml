    html: |-
      <p>I haven't read every scrap of text on this thread but will offer my take on ellipsis for what it's worth.</p>
      <p>(1) To a type designer, ellipsis is a single, self-contained character, consisting of three dots <strong>and no more than three dots</strong>. For example, there is no such thing as an ellipsis made up of four dots. What are the bars like on a Euro? They're slashed from top right to bottom left. That's the standard for a Euro. What's the definition of an ellipsis? Three dots. That's all there is to it. Anything more and it's not an ellipsis.</p>
      <p>(2) The idea of breaking up the dots of an ellipsis over two lines is preposterous and inconcievable. </p>
      <p>(3) When I use ellipsis in typeset material (rarely) it goes at the end of a line or as close to the end of a line as possible. Usually I use an emdash instead of an ellipsis because ellipsis has become a typographic cliché thanks to the internet and message boards.</p>
      <p>(4) If my editor or other seniors question the way I use ellipsis, or the fact I've replaced it with an emdash I tell them emphatically "It's just common sense. If you don't agree, sack me." Nobody has ever sacked me for it. I always get my way becaws it's very easy to demonstrate why breaking the thing up or putting it on the next line when it clearly belongs at the end of the previous line is the most utterly senseless thing you can do with an ellipsis.</p>
      <p>(5) This thread and most of its participants are firmly in the grip of Bringhurst and the Chicago Manual of Style. The rest of the world is not slave to such unimaginative and stifling typesetting manuals.</p>
      <p>(4) You don't put a period or a comma or any other form of dot-like punctuation after an ellipsis. What are you guys, nuts? An ellipsis is equivelant to a period. At the end of a sentence it indicates that the sentence continues. It's common sense that if the sentence continues, there is no need for a period, no earthly reason for putting one there. Replace the ellipsis with an emdash---now put a period after the emdash. No-no-no! Common sense. It doesn't belong there because the dash indicates the sentence continues. So why would you do that to an ellipsis? Doesn't make sense.</p>
