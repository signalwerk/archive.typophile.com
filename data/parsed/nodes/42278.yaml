      <p><cite> &gt; This is, I think, another typewriterism that plagues typesetters. On a typewriter, there is no ellipsis character, </cite></p>
      <p>I'm sorry, but I don't buy this "typewriterism" theory. There was no ellipsis character in the foundry case or on the Linotype/Monotype keyboard either, back when the typewriter was commonplace. The ellipsis was always formed from periods and spaces. The difference was that the typesetter had a variety of spaces at his command. The "typewriter-er" did not.</p>
      <p>I don't think there existed a pre-composed ellipsis prior to digital type. </p>
      <p><cite> &gt; Use the character that a professional typeface designer created to look perfect with his or her font. If that character is wrong, then you probably have a poorly designed font. </cite></p>
      <p>I actually don't think most typeface designers create the ellipsis to look perfect with their fonts, since perfect (in the case of the ellipsis) is a function of the setting, not the typeface design.</p>
      <p>Personally, I don't advocate the use of the pre-composed ellipsis for the reasons cited by Will and Charles. Given that it exists as part of the standard character set, I try to design it with care. But I don't use it myself. </p>
      <p><cite> &gt; Isn’t the traditional method for foundries to make the ellipsis em-width?<br>
      Does that still have any merit? </cite></p>
      <p>For all the reasons cited here, I think the em-width approach has no merit. I think this was another "standard" developed by early digital pioneers who weren't actually typesetters.</p>
      <p>-- K.</p>
