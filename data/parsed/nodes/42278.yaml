      <p>Well James thanks for YOUR take on things but I work in book publishing where editors don't take too kindly to "my way or the highway". Chicago and Bringhurst are designed to set up common styles and conventions in typesetting that make it clear TO THE READER what is going on. If you want to reinvent punctuation, be my guest, but don't expect your readers to thank you. If you're designing a poster for a rock festival or a contemporary art exhibition, then sure, play around with punctuation, but if you're typesetting a novel for folks to read, creating your own punctuation styles will only confuse, distract, and annoy your readers (yeah, I used the serial comma there. That's in Chicago too; I don't like it but my editors insist on it). </p>
      <p>An ellipsis has a VERY different function editorially than an em-dash. The function of an ellipsis is to indicate omission in cited text. Yes, it is used as well to indicate a pause or hesitation in thought or trailing off, but those are not its primary function. In those latter cases it could perhaps be replaced with another character. But in its primary function it must be used as is. It should NEVER be broken over two lines as you've said. And you are right that the punctuation (period, comma) should precede not follow it.</p>
