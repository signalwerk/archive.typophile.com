      <p>Now that we have teams we can clarify a few points. </p>
      <p>1.) Chicago does have a simple three dot only ellipsis method, which is appropriate for many projects.</p>
      <p>2.) Quoted interviews and legal language often require a level of parsing that a simple style can't cover. I suspect some people may not have ever set text like this.</p>
      <p>3.) Chicago may have not set their own book with the best examples of spacing, which clouds and confuses the ideas.</p>
      <p>4.) Fonts built with an ellipsis character that works in harmony (equal interior spaces) with ending punctuation offer those without the software and those in search of an automated approach a good option. (See "Granpa" lol example above.)</p>
      <p>5.) Variance in spacing could potentially add clarity, but this is specifically not the rule and editors won't tolerate looking like dunces to indulge a designer's personal sense of aesthetics.</p>
