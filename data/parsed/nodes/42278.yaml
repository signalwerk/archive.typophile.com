    html: |-
      <p>Speaking of two-dot ellipses, that is not a completely new idea.<br>
      German poet <a href="http://en.wikipedia.org/wiki/Stefan_George" rel="nofollow">Stefan George</a> used that at the turn to the 20th century to distinguish his way of keeping his verse open in a more “closed” way, famously mocked by Theodor W. Adorno in his essay “Satzzeichen”.<br>
      A digitised version of the font George had made in order to keep his poetry in line with his stylized “handwriting”, and including a two-dot ellipsis, is available <a href="http://www.textkritik.de/technik/stefan_george_schrift_engl.htm" rel="nofollow">from the Institut für Textkritik, Heidelberg</a> (and another one, with serious flaws, from <a href="http://www.p22.com/ihof/stgschrift.html" rel="nofollow">IHOF/P22</a>, for a discussion of said flaws, see <a href="http://www.textkritik.de/schriftundcharakter/sundc020george.htm" rel="nofollow">my critique [German]</a>) .</p>
