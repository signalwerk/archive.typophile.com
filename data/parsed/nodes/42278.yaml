      <p>If well designed, I prefer the precomposed ellipsis personally.</p>
      <p>For editorial style, it's still not uncommon to see the ellipsis placed in brackets for quotes, especially when the source text might include ellipses (and often times italicised):</p>
      <p>Original text: So… I went down to the big blue store.<br>
      Quoted: “So… I went down to the […] store”.</p>
      <p>This often comes up in quoting poetry.</p>
      <p>If the distinction between period-ellipsis, and ellipsis-period is critical to the discussion of a text, I think most article authors would prefer to split the quotation even if it's as simple as “and later states”:</p>
      <p>Original text: Alabama is in the Deep South.  Long ago, the North invaded the South because the South broke away desiring stronger state’s rights.<br>
      Article text: Matthew notes that “Alabama is in the Deep South”, and adds that the Northern Invasion, where “the North invaded the South” happened in 1861.</p>
      <p>Note that even in this case the punctuation is ambiguous, because I would still quote it as “Alabama is in the Deep South” + comma even if the original sentence were “Alabama is in the Deep South of the United States of America.”</p>
      <p>So, I don't think it’s a huge issue being able to distinguish the order in a period-ellipsis or ellipsis-period combination.  I do feel it’s important that they can be connected with no visual break between the four dots.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
