      <p>If you're familiar with <a href="http://www.latex-project.org/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">LaTeX</a> then that's a good point to start setting your thesis with. With LaTeX you can specify a few parameters like margins and then your layout class will compute the rest for you. Perhaps take a look <a href="http://www.sharelatex.com/blog/2013/08/02/thesis-series-pt1.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>. (I used the <a href="http://www.ctan.org/pkg/koma-script" title="Click to visit an external URL." class="freelink freelink-external freelink-external">KOMA book</a> LaTeX package to set my thesis.)</p>
      <p>Other than that, if you want to use inDesign (why?) then what parameters do you have? Paper size? How many levels of heading? Illustrations, tables?</p>
