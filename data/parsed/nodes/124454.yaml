    html: |-
      <p>If you already have enough text to fill two facing pages, I suggest to play around with different settings. From past experience, seeing the print will give you a much better idea than going by numbers. The line spacing will also determine the text block size: tighter spacing, smaller block; and then the text block size can be placed differently depending on header and footer and folios. </p>
      <p>If 12pt is not negotiable, then this already decides the line measure (characters per line) which should be about 2 alphabets.</p>
      <p>Bottom line, there are many different factors and personal taste at play here. Print them out and let your personal feel and taste guide you :-) When you found something, perhaps post it here and then people can discuss tweaks and improvements.</p>
