    <p>Hello.</p>
    <p>I'm writing my master's thesis in geology and I need some tips for formatting.<br>
    There are no restrictions at my university for style only that it must be printed one sided pages.<br>
    (I learn using InDesign and I already read many articles about thesis style on the web.)</p>
    <p>I decided to use Palatino Linotype for the Text Body and FF DIN Pro Bold and Light italic for the headings.</p>
    <p>I don't know what margins and line spacing should I use for the text to look proportional and be easily readable. On the left side there should be a gutter of 1 cm, and there won't be any footnotes just a page number.</p>
    <p>Thanks for the help!</p>
    <p>P.S.: Maybe it's not the most important thing to design a thesis I just like doing it. I feel that the work of my last 2 years should look professional in every way.</p>
