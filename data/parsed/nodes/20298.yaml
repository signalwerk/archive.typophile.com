      <p>What I’m concerned with is that kerning is still disabled by default in Word 2007. That’s absurd. </p>
      <p>I definitely agree that improvement in text handling should have been the main focus of Word. Since the file format is changing and many other things are happening, it would have been a good chance to revamp the typographic support. With all those changes, issues of document reflow would have been acceptable, I think. Of course, Word does support OpenType Layout in principle. The Arabic/Indic stuff, composition/decomposition and the math stuff all works using OpenType Layout. But we’d appreciate support at least for contextual alternates, standard ligatures, small caps, superscripts/subscripts and perhaps alternate figure styles. </p>
      <p>A.</p>
