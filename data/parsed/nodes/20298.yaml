      <p>Hi Nick! I think the decision of acceptance or non-acceptance of OpenType is made by systems and applications, not by fonts. As long as only a handful of special interest apps (Creative Suite, XPress, Mellel)* give access to typographic features, a font tester could be helpful but would have the taste of a test tube. However, if applications would show these options in their interfaces, one could try them in documents one creates anyway, and maybe find them be USEFUL. And finally ask how it comes that some fonts DON'T have these features.<br>
      So, I appreciate a lot that Microsoft added typographic features to ClearType fonts, and find it the more disappointing that they "hide" them in their own applications.</p>
      <p>* Yesterday I wanted to add Apple's OSX 10.4 apps to the list but then recognized some serious shortcomings. One would have to explain for every single feature: this works, this doesn't. Then better not mention them at all ...</p>
