      <p>from Adam's email to the OpenType list: "Unfortunately, neither Word nor PowerPoint 2007 seem to be actually using any of the user-controlled OpenType features included in these fonts (such as smcp, onum, ss01, hist , dlig, swsh etc.). For example, "small caps" in Word 2007 still produces fake small caps. I guess this means that we won't see support for user-controlled OpenType Layout features in Office within the next four-five years or so, which is a pity."</p>
      <p>More than a pity, but what can you do? I guess Microsoft thinks they can do whatever they want when they want. It'd be great if one of the freesource office packages would implement OT layout feature support before they got it into Word and then caught on with the public. Ah well, i can dream, can't i?</p>
