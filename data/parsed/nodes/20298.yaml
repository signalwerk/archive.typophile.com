      <p>&gt; Seriously, is it really much improved and user<br>
      &gt; friendly than earlier versions, even with the<br>
      &gt; obvious shortcomings?</p>
      <p>I think it's at least interesting. I had to do some looking around in the new UI of Word to find what I wanted but once that is done, I believe the new UI is more productive. They have done good work, especially the live preview stuff is very impressive (you hover the mouse over the font size or name and the entire layout of the page changes to show you what it will look like, same for table styles etc.). Excel's new charting features and table auto-formatting is also very pleasant. They have actually hired designers to do it this time. I'm not entirely fond of the new graphic treatment of the UI but I think I'll get used to it. It's better than the cheesy Windows XP user interface. </p>
      <p>On the other hand, I've seen where the Windows Vista UI is heading and it's a nightmare. Not only it's completely different from Office 2007, it's also an overcomplicated mess. </p>
      <p>A.</p>
