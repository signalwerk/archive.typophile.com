      <p>Hi Karsten.<br>
      The distinction is between a dominant corporation, Microsoft, not pushing the use of OpenType's "typographic" features, and the market, using OT-supporting Adobe applications (and now Quark), pulling it.<br>
      Even though Adobe doesn't mention type on its home page, its applications which support OT features are used by millions of people -- many of whom are not professional designers.</p>
      <p>The way I understand it (from a MS video documantary), Bill Gates' support of funding for the ClearType project was predicated on the type making a difference (or some such words), ie something that could be measured. Hence the readability claims of 5% faster for CT. The multi-language support of CT is a no-brainer for a multi-national corporation. The 'typographic" features of CT -- now how would they be justified to engineering and marketing criteria? It seems they were snuck in. Perhaps the rationale was keeping pace with Adobe.</p>
