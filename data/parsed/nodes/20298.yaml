      <p>Sometimes good typography is good business. Sometimes it's still good business, but it is hard to prove that it is so.</p>
      <p>Although there is a focus on profits at a large corporation, this may also be described as "giving the customers what they want." Despite any occasional barriers here, I am sometimes surprised and gratified by the strength of internal support for good typography at Adobe.</p>
