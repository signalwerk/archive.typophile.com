  html: |-
    <p>Microsoft published a public beta version of their new Office 2007 suite for Windows.</p>
    <p>One interesting point is that Office 2007 includes all the OpenType fonts from the Microsoft ClearType collection (<a href="http://www.microsoft.com/resources/design/ClearType.html" title="http://www.microsoft.com/resources/design/ClearType.html">http://www.microsoft.com/resources/design/ClearType.html</a> ):  Calibri, Cambria, Candara, Consolas, Constantia, Corbel, as well as Segoe UI, Microsoft's new user interface font that was disputed to be a Frutiger rip-off. All the fonts include Latin, Cyrillic and Greek characters with advanced typographic OpenType features, some include characters from additional scripts.</p>
    <p>One highlight of Office 2007 is the new math typesetting engine in Word. It consists of the Cambria font that has a large mathematical character set, and a fully new "equation editor" which is seamlessly integrated into new Office applications and allows mathematical input using various text encoding schemes, including a syntax very similar to TeX as well as MathML.</p>
    <p>The current beta version of Office 2007 will run until February 2007 and is available free of charge to anyone interested:<br>
    <a href="http://www.microsoft.com/office/preview/default.mspx" title="http://www.microsoft.com/office/preview/default.mspx">http://www.microsoft.com/office/preview/default.mspx</a></p>
    <p>(The download is rather large though, at least 450 MB).</p>
    <p>Regards,<br>
    Adam</p>
