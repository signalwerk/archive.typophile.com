    html: |-
      <p>I suppose Word will always pander to the lowest common denominator in this way simply because practically everybody has/uses it. And if everybody has/uses it, it's perfect for files that lots of people work on and then send around amongst each other. To do a document in Quark or InDesign it's assumed you care about design (to do a document in TeX it's assumed you care about technical accuracy); but the greater the number of people working on a Word file, the greater the likelihood that some of them don't care about design and/or know how best to use Word's features to achieve good design.</p>
      <p>The 'Small caps' control has been around for ages, even if it does apply faux small caps and is not smart enough to know when real ones are installed (either as OT features or in a separate font file), but like many other potentially useful features it's not on the default formatting toolbar so a lot of non-expert users know nothing about it. It would also help if the default formats of the styles "Heading 1", "Heading 2", "Heading 3" etc were a little less ghastly.</p>
      <p>Perhaps the installation routine should include a dialog box saying "Do you give a rat's nipple about typographical design?" and if you say "Yes" it switches on kerning, and visibility of non-printing characters, and 'do-full-justification-like-wordperfect-6.x-for-Windows' and only gives you bold/italic/smallcaps options if there are appropriate variants available (and, when used, the buttons automatically apply an 'emphasis' or 'strong' character style or whatever), and switches OFF all autoformatting options and... well you get the idea. And if you say "No" it says "Are you sure?" and links you to a copy of Bringhurst on Amazon.</p>
      <p>_______________________<br>
      Ever since I chose to block pop-ups, my toaster's stopped working.</p>
