      <p><em>OpenType will have its breakthrough not before Windows &amp; Office applications make it available to literally everybody.</em></p>
      <p>Microsoft isn't the only game in town.<br>
      Myfonts reaches a broader market than the design industry (such clear-cut disctinctions are becoming obsolete, anyway), and its marketing sophistication is growing. Now indie foundries can launch new fonts there, advertise them on "posters", with time-limited special offers, and hype OpenType features as product benefits, and it's already worked for at least one typeface. The missing link here is an adequate interactive online "type tester" which shows the different OT features that a font may have; once that is in place at online font distributors, then we will see a real breakthrough.</p>
