    <p>On the weekend report of UK Channel 4’s ’This is a Knife’ Rachna the presenter said to send in an email if you want a Euri the Euro t-shirt:</p>
    <p>View the video and then select ’suggest a story’ to get the email address then provide:<br>
    </p><li>subject: Euri t-shirt<br>
    </li><li>Where you are from<br>
    </li><li>Why you want one<p></p>
    <p>UK only it seems </p>
    <p>Check the site <a href="http://www.channel4.com/knife" title="www.channel4.com/knife">www.channel4.com/knife</a></p>
    <p></p><div class="imageWrap"><img src="/files/EuriT.jpg"></div><p></p>
