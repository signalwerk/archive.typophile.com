    <p>Hello, I'm  trying to make a poster for a friend who's a fan of Top Gear.</p>
    <p>This picture is located in the middle of the The Big Book of Top Gear 2009.</p>
    <p>You can see there is no serif, the 'G' does not have a tail, and the font is relatively condensed.</p>
    <p>Does anyone know what font is being used? Much appreciated!</p>
