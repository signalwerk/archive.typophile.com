    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Em</strong></p>
    <p>Pronounced like it is spelled, an em is a measurement equal to the current point size. An <a href="/node/40384" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">em dash</a> is a dash the width of the given em. Because “em” and “en” sound so much alike, the em is sometimes referred to as the&nbsp;“mutton.” </p>
    <p>See the related <a href="/node/13900" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">en</a>.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/27742">The&nbsp;Em</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://type101.fontbureau.com/archives/36">The Em</a>, by Cyrus&nbsp;Highsmith.</p>
    <p><img src="/sites/default/files/old-images/em_square_4594.gif"></p>
