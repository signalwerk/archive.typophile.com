    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Em</strong></p>
    <p>Pronounced like it is spelled, an em is a measurement equal to the current point size. An <a href="/wiki/Em%20Dash" class="freelinking" rel="nofollow">em dash</a> is a dash the width of the given em. Because “em” and “en” sound so much alike, the em is sometimes referred to as the “mutton.” </p>
    <p>See the related <a href="/wiki/En" class="freelinking" rel="nofollow">en</a>.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/27742" rel="nofollow">The Em</a></p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://type101.fontbureau.com/archives/36" rel="nofollow">The Em</a>, by Cyrus Highsmith.</p>
