    html: <p>Typophile voting buttons? They were supposed to be Turkish. Some say they were German. Nobody believed they were real. Nobody ever saw them or knew anybody that ever used them, but to hear Kobayashi tell it, anybody could have used the buttons. You never knew. That was their power. The greatest trick the Devil ever pulled was convincing the world he didn't exist. And like that, poof. they're gone</p>
