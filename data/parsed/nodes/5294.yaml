    votes: null
    html: <p>Emillie, without looking into it too deeply, I would set the tagline in sentence case if the tagline is a sentence (e.g. It's the real thing.) If it's a fragment of a sentence or a clever combination of words that makes a phrase, I would set it both ways and see which looks more appropriate (though truthfully I can't think of a single instance of this right now).</p>
