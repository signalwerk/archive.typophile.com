    <p>You know your collection of fonts is too  large when you think you have a font, but have no idea where to look for it. This sample is from a font ID request I received, and I am almost positive I have this font, and I think it’s an old design. I am sure I have at least seen it somewhere, but none of my Guides or font searches have found it. this may have been a freebie from the web, but I just can’t remember any details, and it’s driving me crazy.</p>
    <p>Does anyone recognize this?</p>
    <p>Thanks for your help,<br>
    - Mike</p><div class="imageWrap"><img src="/web/20080905130616im_/http://www.typophile.com/files/OSantoDaime_3434.png"></div><p></p>
