  html: "<p>Hello everyone. I would appreciate any critique you have regarding the following logo. <br>The background: <a href=\"http://www.ontosoft.de\" target=\"_blank\">www.ontosoft.de</a> <br>I did the site and the logo last year. The logo had to represent a lot of concepts for one sign, I believe. The stars are \"beginning\" and \"end\", the swooshes are \"ontology\" and \"software\". Finally this year, the guy is going global and I managed to persuade him, that the old logo is not really *that* nice, though it was my job to do it. :-/ The focus is IT and new technologies; the audience ranges from managers to state institutions to students; ages from 20 to 60; different nationalities, different cultures. We've already had a lot of variants discussed and tried out, but neither seems to work. He is still into swooshes, I am more into typo play. Here is what I have right now. The variant with O-matrix is just there to show you, what I've tried and what was already declined. I thank you for your constructive critisism. <br><img src=\"http://www.typophile.com/forums/messages/29/11168.gif\" alt=\"\"> <br>Also, before you start - the variant 1 was not presented yet. Variant 2 was presented yesterday and was marked as \"hmm... nice, I like it\", the variants 3 and 4 are just my personal favourites, though the client hates both of them. <br>I thank you.</p>"
  html_clean: "<p>Hello everyone. I would appreciate any critique you have regarding the following logo. <br>The background: <a href=\"http://www.ontosoft.de\" target=\"_blank\">www.ontosoft.de</a> <br>I did the site and the logo last year. The logo had to represent a lot of concepts for one sign, I believe. The stars are \"beginning\" and \"end\", the swooshes are \"ontology\" and \"software\". Finally this year, the guy is going global and I managed to persuade him, that the old logo is not really *that* nice, though it was my job to do it. :-/ The focus is IT and new technologies; the audience ranges from managers to state institutions to students; ages from 20 to 60; different nationalities, different cultures. We've already had a lot of variants discussed and tried out, but neither seems to work. He is still into swooshes, I am more into typo play. Here is what I have right now. The variant with O-matrix is just there to show you, what I've tried and what was already declined. I thank you for your constructive critisism. <br><img src=\"http://www.typophile.com/forums/messages/29/11168.gif\" alt=\"\"> <br>Also, before you start - the variant 1 was not presented yet. Variant 2 was presented yesterday and was marked as \"hmm... nice, I like it\", the variants 3 and 4 are just my personal favourites, though the client hates both of them. <br>I thank you.</p>"
