    html: <p>It's Avenir. It's the same type on every variant I've posted here. Maybe just rendered a bit strangely. :-/ <br>Yeah, I did like the earlier variant more, but "hey, what can you do". exactly. I mean, I am struggling with this for, like, a month. Okay, not 8 hours a day every day, but still. I am fed up with trillion variants I had tried and billions the client has seen. Normally, I present between 3 and 5. At max. This time it was very different. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br>Younger people (till 30) tend to like the earlier variant. Somewhat older people (30 to 40) tend to like this very variant. <br>Proportions are still bothering me a bit. Maybe not really the proportions, but the alignment and/or distance between type and symbol...</p>
