    html: |-
      <p>I am still working on the scripts. <strong>Two questions:</strong></p>
      <p>After the dialog, where you want to save the file, has closed, the focus is not anymore on FontLab. You first have to click on the title bar of FontLab or on another point in FontLab. The user may be unsure then and click on another font window than the window of the active font. How can I give the focus to FontLab again in the end of the script?</p>
      <p>And in the script the root directory is indicated by a slash (initialdir="/"). Does this also work on the Mac? Probably not. So I had to check first, if you are on Mac on PC and set a variable for the root directory. But which character(s) indicate the root directory?</p>
