  html: |-
    <p>I sometimes need GlyphOrderAndAliasDB files for the AFDKO in the same order as the index in FontLab. But I am not competent in Python scripting (although I have coded this script today). If you want to optimize the code, you are welcome.</p>
    <p>------</p>
    <p>Now I have added a script, that generates a nam file. This is useful for example, if you want to have the same Unicode points in different fonts, that are partly in the PUA. (The script does not generate Unicode points, but it reads the Unicode points of an encoded font.)</p>
    <p>------</p>
    <p><strong>Updated on 09.11.10.</strong> Save <strong><a href="http://typophile.com/files/Macros[Arno Enslin 09.11.10].zip_.txt" rel="nofollow">me </a><a></a></strong> (context menu) as zip file.</p>
