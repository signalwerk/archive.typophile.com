      <p>My favorite is the plain old original, or Monotype's revival of it. My first-year Physics textbook (Halliday and Resnick) was set in Baskerville, and so I think it is a good text typeface.</p>
      <p>It is a bit wide, just as Century Expanded is a bit condensed. But that just affects how one uses it - which size, what leading.</p>
