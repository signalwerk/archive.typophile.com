      <p>Something else to worry about:<br>
      There are two strains of Baskerville: the original and what's termed the "Fry's" style, which was a competitor's interpretation of the original. The Fry's tends to lean more heavily towards display usage, although some (like ATF) have made it in proper text sizes/cuts.</p>
      <p>And, FWIW my favorite is Fountain's:<br>
      <a href="http://www.fountaintype.com/typefaces/baskerville-1757" title="http://www.fountaintype.com/typefaces/baskerville-1757">http://www.fountaintype.com/typefaces/baskerville-1757</a></p>
      <p>hhp</p>
