    html: |-
      <p>Yes, Baskerville's design was for books. </p>
      <p>In Baskerville's day, punches for metal type were cut at different sizes, and the designs of the letterforms were altered to make them suitable for those different sizes (lower contrast for smaller point-sizes, for example). </p>
      <p>Baskerville 10 as a digital font, thus, is not a <em>correction</em> to Baskerville's design, but rather somewhat of a <em>restoration</em> of the size-specific sensitivity that was standard in metal type and jettisoned in most digital type.</p>
