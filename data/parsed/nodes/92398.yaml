  html: <p>Unsure of what the truest Baskerville face is, I've only known of the various digital Baskervilles that I happen to come across in advertising and such. It seems that the common characteristics are wide set letters, high contrast (thicks strokes with almost hairline thin strokes). Knowing what I know about book type (that's not much!), doesn't that make it unfit for long passages of reading? If I never knew of the face before, and saw it for the first time, I would assume it was designed for display sizes, and that doesn't sound right.</p>
