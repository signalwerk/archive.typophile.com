  html: <p>Here's a font I designed a loooong time ago (July 1995, according to my records, though it may have actually been earlier) for a DOS-based audio visualization application.  It was similar to one of those multi-effect Winamp plugins that everyone's so fond of, except that it predated Winamp by quite some time (not to mention mp3s as a viable format).   (It worked using a quirk of the Pro Audio Spectrum 16 soundcard which let one program monitor the output of another, though the real trick was getting two programs to run at the same time back then...) <br> <br>Someday I'll get around to porting the program to a more modern operating system, but in the meantime, here's the font. <br> <br><img src="http://www.typophile.com/forums/messages/29/2776.gif" alt="futura96.gif"></p>
