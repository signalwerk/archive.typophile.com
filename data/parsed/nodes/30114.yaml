      <p>Thanks for your input, guys! I have some other, older font projects that are in various states of incompletion,  :-D  but this is the first one I've posted here to be critiqued.</p>
      <p>Ill Sans, thanks for your flattering comparison. I think that <strong><a href="http://www.neubauberlin.com/" target="_blank">Neubau</a></strong> and <strong><a href="http://www.non-format.com/" target="_blank">Non-Format</a></strong> have done a lot of great work in that regard already.</p>
      <p>And Eben, I think that the drawing with the red shading is a whole different font. I like the idea of leaving the hand-drawn feeling in. And Ill, I agree that the slits should be wider for smaller sizes, although this typeface is meant for display, after all.  ;-)</p>
      <p>I'll try to post some more later on in the week, if I ever get a chance to sit down and draw some more, that is! It's end-of-year madness time at work.</p>
