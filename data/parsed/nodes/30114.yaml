    html: "<p>Yes the pentrations on the s should be shorter. How do you think this will be used? Tell us why you are making it. That will help a lot when it comes to advice. With any font it's not about being 'better' in some general way - it's about achieving something specific. Ideally there would be a well thought out use that you have in mind. When a face like this shows up on Typophile it kinda tough to know what to say because the style is not in fashion right now. And because there are alot of typefaces which are similar. I was told the same thing more or less with my first typeface. But they had a point. You may well have the seed of something. But the way to get it to grow is to ask these questions: What's it for? Who would use it? Why would they pick it over other fonts like it? You can get there but this was just the 1st step. Keep going.</p>"
