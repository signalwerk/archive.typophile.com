    <p>Hi, everybody. A few weeks ago I started working on this new typeface, inspired by the <strong>H</strong> in an album cover designed by Non-Format (see the first image I've posted here, <strong>barrio_inspiration</strong>). </p>
    <p>My font started out with open counters, which soon became slits. At that point, a friend of mine saw it (<strong>barrio_sample_02</strong>) and said, "You ought to call it Barrio!" I liked the name. Then I tried elongating the slits, thinking that they would make the characters easier to read, but another friend says the opposite has happened (<strong>barrio_sample_03</strong>). I can see that the long horizontal openings in <strong>s</strong> and <strong>c</strong>, for example, are not helping.</p>
    <p>What do you think? And do you have any other comments? I've added some sketches, so that you can see some of my process.</p>
    <p>Thanks in advance,<br>
    Ricardo</p>
