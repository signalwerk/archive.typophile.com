      <p>I like the term just because it’s japanese ;-)<br>
      And what I’m trying to say is:</p>
      <ul>
      <li>For a text face, the optimal relationship between black and white is of an equal rhythm, both horizontally <em>and</em> vertically (every line of text relating to the preceding and following ones).</li>
      <li>For a display face, that relationship is more akin of that of graphics. And its vertical relationship is with other graphical elements on the page (the whitespace, paragraphs as a whole, etc.).</li>
      </ul>
      <p>Black and white relationship doesn’t need to be equal, it needs to be complementary. And a “display” line of text could need a tighter spacing in order to not “falling apart”, because it lacks the support of a whole paragraph. But that doesn’t mean it need to be darker too: a single black dot on an otherwise white page is equally distinguishable, regardless of its size.</p>
