    html: <p>&gt; Metrics sets it quite a bit tighter. <br> <br>Strange - unless you're using a pretty small point size. <br>This, because optical spacing depends on point size (the smaller the looser). <br> <br>The problem with Mrs Eaves isn't that it's too loose or tight (although it is a bit the former to my eyes), it's that the spacing is sloppy. This is what InDesign is supposed to fix, and usually -but not always- does. <br> <br>hhp</p>
