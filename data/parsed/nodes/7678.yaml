  html: <p>Hi, <br> <br>I'm working on a book design and layout and am using --surprise, surprise-- Mrs. Eaves. But I am finding it really loosely set. I'm second-guessing my choice of type, but I've already started setting it. Is it totally wrong to track the entire text to make it a bit tighter. Or am I just used to tight type? I would appreciate any help! <br> <br>Thanks!</p>
  html_clean: <p>Hi, <br> <br>I'm working on a book design and layout and am using --surprise, surprise-- Mrs. Eaves. But I am finding it really loosely set. I'm second-guessing my choice of type, but I've already started setting it. Is it totally wrong to track the entire text to make it a bit tighter. Or am I just used to tight type? I would appreciate any help! <br> <br>Thanks!</p>
