    html: "<p>You've run into Mrs Eaves's achilles heel: the spacing is de la merde. <br>If you must use Mrs Eaves, your choices are to either respace by hand yourself (not easy) or use InDesign, which has an \"optical spacing\" feature that helps badly-spaced fonts tremendously. <br> <br>Or you could use another font, like The Foundry's Wilson. <br> <br>hhp</p>"
    html_clean: "<p>You've run into Mrs Eaves's achilles heel: the spacing is de la merde. <br>If you must use Mrs Eaves, your choices are to either respace by hand yourself (not easy) or use InDesign, which has an \"optical spacing\" feature that helps badly-spaced fonts tremendously. <br> <br>Or you could use another font, like The Foundry's Wilson. <br> <br>hhp</p>"
