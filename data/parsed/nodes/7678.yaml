    html: <p>Thanks for the validation! I am using InDesign and had it set on Optical, but noticed that Metrics sets it quite a bit tighter. I've usually stood by the optical feature, but do you think it could be better to go metrics on this one. <br> <br>Thanks again! <br>Sona</p>
