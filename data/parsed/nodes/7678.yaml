    html: "<p>&gt; Why is the spacing sloppy? <br> <br>You mean why do I say it's sloppy? <br>For one thing take a look at the \"the\"... <br>Robin Kinross has described Mrs Eaves as a \"loose bicycle\".  :-/ <br> <br>Paul: There's nothing in the design that makes it particularly hard to space well. <br> <br>So I guess the answer to the question \"why\" is simply bad craft. Fortunately it's a charming lady of a font otherwise, and luckily we have InDesign to get rid of its speech impediment. But it still does have to be set on the large side, because of its vertical proportions. <br> <br>hhp</p>"
