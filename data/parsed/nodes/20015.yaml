    <p><em>For those who haven't seen this</em> --</p>
    <p>COOPER UNION ANNOUNCES<br>
    <strong>“DRIVING FORWARD”</strong></p>
    <p>AN INNOVATIVE DESIGN COMPETITION TO RE-ENVISION TRANSPORTATION SIGNANGE </p>
    <p>The Maurice Kanbar Program in Environmental and Transportation Graphics at The Cooper Union for the Advancement of Science and Art recently announced “Driving Forward,” an open international juried competition that is seeking proposals to re-envision and improve traffic signage. </p>
    <p>The competition, to be followed by an exhibition and symposium in Fall 2006 at Cooper Union, invites candidates to use graphic design elements and submit traffic signage concepts that promote efficiency, uniformity and safety. The registration deadline for “Moving Forward” is June 1, 2006. The Maurice Kanbar Program in Environmental and Transportation Graphics was launched by inventor and entrepreneur Maurice Kanbar and The Cooper Union to explore the impact of the past 20 years of technological advancements in automobile performance and road construction on transportation signage. </p>
    <p>Projects will be reviewed by a diverse panel of judges ranging from architects and designers ! to civil engineers and transportation research associates. The first place winner will receive $5,000, second place $3,000 and $1,000 for the two third place winners. </p>
    <p>For more information about deadlines, prizes and obtaining entry forms, visit: <a href="http://www.cooper.edu/drivingforward" rel="nofollow">www.cooper.edu/drivingforward</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/drivingforwardlogosmall_5479.gif"></div><p></p>
