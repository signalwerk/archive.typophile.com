      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Hs_4497.jpg"></div><br>
      What causes this behaviour in TextEdit?<br>
      The font format is Mac Type 1, generated as a suitcase, with Fontlab.<p></p>
      <p>Metric values are identical for roman and italic -- including "BBox" y-axis values, alignment zones, etc., and yet italic characters position lower than roman.</p>
      <p>It doesn't happen in other applications such as CS and Word.</p>
