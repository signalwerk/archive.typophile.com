    html: |-
      <p>While working on a photofont plugin for AID, QXP and web we have this problem with vertical (and also horizontal) layout of text in a text block. Since from the block that has to be served by plugin we have absolutely no access to any pixel outside it, we have to fit everything inside to avoid any kind of glyph cutting. </p>
      <p>Unfortunately it makes impossible typographically correct layout of the text (lsb on the left, ascender or ascender+linegap on the top): what should we do with script-like fonts which extend outside the left margin line? The same problem happens with top layout: in fonts similar to Zapfino Ink many glyphs extend vertically beyound ascender and even UPM line. </p>
      <p>So far we found no other solution for the "top-left" problem then using font bounding box - this is the only way to make sure that no part of a glyph will disappear. Unfortunately it makes difficult to align text blocks on the page, requiring some manual control. </p>
      <p>Another problem would be to define "typographically correct" font bounding box: some glyphs will never appear as leftmost on a text line (take accents made "old" way with negative left sidebearing) but may have big impact on calculating font bbox. We have no good solution for this right now, but we continue research. </p>
      <p>In photofonts detecting glyph (and font) bounding box has additional level of complexity: since glyph image has "smooth" transparency, it is not easy to draw a line of where it actually ends.</p>
    html_clean: |-
