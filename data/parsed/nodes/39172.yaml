    html: |-
      <p>"Track"<br>
      Track to the widest bounds of each character proportionally and Lead to the widest the bound of all characters, you mean? </p>
      <p>A glyph shape not needing to be a subset of the glyphs 'compose-me-here-without-leading-or-tracking' box, is in the top 10 highlights of digital type composition, somewhere ;-) So, when one wants to export typography without a good definition of the em, or a format to hold the 'true' extremes, that is tough.</p>
      <p>Nick's issue, since he's got one style working, should be solvable by one combination or another of type number monkeying.</p>
      <p>But now that this bounding issue is just a stable of variables, I'll be cool to have a type design app so if the type designer knows the answers, the app knows the questions and can display, (as guidelines), 'the bounds', when that's important in a design(er). I don't think anything does that now, does it?</p>
      <p>Cheers!</p>
