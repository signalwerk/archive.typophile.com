      <p>Thanks!<br>
      So far it's not (yet) available for licensing. As I mentioned, I already have some very keen publishers, but couldn't get my head around the writing angle of 30 degrees. (They want me to sort it out...) To my knowledge, all fontdesign programs are adding the characters on a horizontal line. This font was initially made to write from top to bottom but playing with it, I found more and  more interesting ways of displaying it.<br>
      I thought about writing a webapplication for it, but lack in skills. I would appreciate any ideas and/or technical hints that would help making the font available to the public.</p>
