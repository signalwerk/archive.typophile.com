    html: |-
      <p>Hi Ophello,</p>
      <p>I agree - readability is an issue as they obscure each other. This happens if choosing the direction to write in a 30 degree angle upward direction meaning I have to set one letter behind each other, thus making it hard to follow. My intention was to provide a sort of a starting point to lead the viewer in in order to let him 'see' the font later. (unfortunately sacrificing readability)<br>
      However - if I start setting the font in a 30 degree downward direction it is way easier to recognise as such and readability increases. The characters still obscure each other but the mind seems to fill in the gaps. I'll post a sample if I find the time… </p>
      <p>Cheers, Klaus</p>
    html_clean: |-
