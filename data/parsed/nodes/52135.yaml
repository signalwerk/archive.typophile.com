    <p>Hi there, </p>
    <p>I've been designing a font for a while and it seems to be an on/off project. Mainly because I find more and more (wacky) ways of writing it, use it as a graphic element, etc. I'm a fan of optical illusions so I tried to get this font working as a hommage to Reutersvärd and Escher. Well, I managed to get quite a bit of impossible figures into it (it's most obvious in the B), though not in all of them. My focus was the outline of the characters, I tried to still make them legible even when not filled with the 'shading'.<br>
    I'm happy with it now and actually a bit proud to have managed to squeeze a font in the most restricting three dimensional grid possible.<br>
    Enjoy!<br>
     </p><div class="imageWrap"><img src="http://typophile.com/files/stakk4web_4176.jpg"></div><p></p>
