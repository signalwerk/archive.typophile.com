      <p>Yes, I've seen some of his work, although I'm not too familiar with it (Love the Univers Revolved!).<br>
      Currently I'm planning a couple of lasercutting and -etches, but due to the optical illusions I guess it will never see the third dimension  ; )<br>
      Mark, your suggestion was actually the first I stumbled upon and while you've got a point, some of the characters make the kerning too difficult. It needs to be done on a case-by case basis to make it legible. Another point is that any charakter is underneath the overlapping part of its predecessor. I don't know if fontdesign programs support layers (and are smart enough for the kerning).<br>
      At the end of the day: Is it worth to go through all this pain? I guess noone would ever use it as copytext...</p>
      <p>It's still good to design some mastheads or other products with it. Here are some skis I designed recently:<br>
