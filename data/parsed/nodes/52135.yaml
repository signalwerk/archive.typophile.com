      <p>Hmmm—I designed an experimental typeface a little like this for my MA a few years back.</p>
      <p>In fact I did a metal plate version, which starts life as a net, and folds into a character multi-dimensional character<br>
      —it looks like a multi-dimensional textura! I also did a 'negative space' version of this akin to using the x-y-z axis—<br>
      a little like yours. I made the forms out of wood and made it into a flick book, the characters rotate when flicked<br>
      (you can only read the letterform at a certain angle).</p>
      <p>I haven't had it published as yet, but I would like to!</p>
