      <p>I don't think overflowing a poem to the next page is a big problem, although I usually discuss that with the editor, publisher or the poet. Because I found that poets especially have a strong opinion on where exactly their poem gets cut to the next page. If the poet in question isn't alive anymore, I talk to the editor/publisher, obviously.</p>
      <p>With the prose on the last page... I do think the right margin is getting a bit narrow there. But I guess the only way to change that is to make the left margins slightly less wide...</p>
      <p>The page numbers, I think this could work, definitely keep it in mind if you experiment further with them. :)</p>
