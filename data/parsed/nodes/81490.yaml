    <p>Hi all,</p>
    <p>I've been given a project to design a poetry anthology. I've got a suitable typeface, and was planning on using an asymmetrical layout with wide left-hand columns (35mm on A5 paper).  The paper size was dictated by the client.</p>
    <p>My problem is that all the poems are VERY different from one another and how I should best lay this out.</p>
    <p>Line lengths are as follows (all in verse)</p>
    <p>1 x 6 lines<br>
    1 x 8 lines<br>
    2 x 11 lines<br>
    2 x 13 lines<br>
    3 x 14 lines<br>
    3 x 15 lines<br>
    5 x 16 lines<br>
    2 x 17 lines<br>
    3 x 18 lines<br>
    3 x 19 lines<br>
    1 x 20 lines<br>
    2 x 21 lines<br>
    2 x 22 lines<br>
    4 x 24 lines<br>
    2 x 27 lines<br>
    3 x 28 lines<br>
    2 x 29 lines</p>
    <p>Then there are also a few longer poems:</p>
    <p>2 x 36 lines (both prose)<br>
    1 x 37 lines (verse)<br>
    1 x 46 lines (verse)<br>
    1 x 48 lines (verse)<br>
    1 x 99 lines (verse)</p>
    <p>We are trying to give particular emphasis for each author (of which there are 38 in total), which means in reality they each need to start on a fresh page, rather than overflowing the poetry. I have been supplied with just 7 images. </p>
    <p>Here's a few pages of the layout (I think it needs a lot of improvement still, I've never designed a poetry book before)</p>
    <p>My main problem is with the number of lines however... I don't want the short poems to look lonely, while the longer ones overflow uncomfortably onto the next page (which with fixed margins might result in just one or two lines flowing over which would look horrible). The solution of extending the page to include 29 lines also doesn't work very well aesthetically (see attached 40-41).</p>
    <p>Help?? And thanks.</p>
