    html: |-
      <p>Looks like the Sans Bold choice for poem titles isn't that popular here, Katy. :-)</p>
      <p>Here are some alternatives:</p>
      <p>1. If titles *must* be set in all caps, try to set them in the serif used in the poems as well, as others suggested, perhaps a bit spaced.</p>
      <p>2. Or you could try to set them in all small caps insted of all caps; they should look much less invasive on the page - perhaps increasing a bit the size (say, texts are set in 10, titles in small caps are set in 10,5 or 11, but do some prints of the page and have a look yourself).</p>
      <p>3. Finally, the most obviuos choice: set the titles exactly as the texts, uppercase and lowercase, again trying to increase them a bit (half or a point more than the poems).</p>
