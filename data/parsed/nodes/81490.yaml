      <p>The layout looks pretty good to me; and I don't see a specific conflict between short and long text lines poems (this being a collective work, it is nearly unavoidable I guess).</p>
      <p>A couple of suggestion:</p>
      <p>1. I would increase a little the word spacing;<br>
      2. On page 41, what does the last line "Robyn Bolam" stand for? Was it a sort of signature left there for mistake? If it is a line in the poem, instead, it is too close to the page number, which should have more white space above.</p>
      <p>Also, I'm not enthusiast about featuring to different typefaces - but if it's your choice, then it's ok. Melville looks very nice, anyway - I haven't seen it before.</p>
