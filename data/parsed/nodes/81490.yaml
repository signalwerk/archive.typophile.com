    html: |-
      <p>I design quite a lot of poetry books, and your layout looks fine to me.</p>
      <p>However, the longer poems running into the page numbers is problematic in my eyes. Perhaps you could choose for the more conventional location of the numbers; in the bottom left and right corners? Maybe it won't look as harmonic, but at least you will have some breathing room for those poems that run a few lines longer than the rest. Another option is placing them in the middle on the side edges of the pages (i.e. in the left margin of the left page, and the right margin of the right page).</p>
      <p>I'm not a big fan of setting poem titles in all caps. A lot of poets I design books for use all caps as well, apparently they like it, but I nearly always advise them against it. I do often set them in bold or medium, but usually at the same size as the poems. If you want to differentiate them more, you could try indenting the titles. But I guess using a sans serif can also work.</p>
      <p>On a side note, in your pdf v10, hyphens are being used instead of en- or em-dashes.</p>
