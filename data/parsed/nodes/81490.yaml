    html: <p>Letting poems run onto a second page looks fine. I like your body type a lot. For titles, how about a bolder version of the style you use for author's names, instead of all caps? Or if all caps, letterspace a little? Also, the subtitles or alternate titles should probably be in the same face as the actual titles, though the italic text face is very nice. On page 5 of your PDF, you probably want to use dashes — instead of hyphens -. I do think it;s far better to let a poem run onto a second page than let it run so close to the page number. For structured verse, break poems at stanza breaks, if you can.</p>
