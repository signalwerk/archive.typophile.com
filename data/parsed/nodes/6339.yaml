  html: <p>This is my first typeface, previously displayed in the sans-category here. Back then I had no idea what a display typeface was nor that I was actually designing one. I have worked alot on Magma since then and have come to a result I'm fairly happy about. All the Latin1 characters are made (I hope..) and lots and lots of kerning have been done, not like you guys would be unfamiliar with that, hehe <br> <br>Anyway, I'd like to present Magma, revision 2, a display font completley made from scratch. I'd love some comments and critique. <br> <br><img src="http://www.typophile.com/forums/messages/29/47421.gif" alt="Magma2"> <br> <br>The reason for Magma being display and simply not a sans is that it just looks way better in largescale. If i'm wrong on this point and Magma still is not a display face, please point me in the right direction as I'm still relativley new to typography. <br> <br>I haven't checked if Magma is some trademark violation yet, so there is a possibility that the typeface will change name.  <br> <br>I hope no one minds that I post a new thread, this just feel so different from the original subject. If a moderator should prefer so, please merge this thread with the old one or delete on of them.  <br> <br>Best regards, <br>Andreas Climent <br><a href="http://www.karmacube.com" target="_blank">Karmacube.com</a></p>
  html_clean: <p>This is my first typeface, previously displayed in the sans-category here. Back then I had no idea what a display typeface was nor that I was actually designing one. I have worked alot on Magma since then and have come to a result I'm fairly happy about. All the Latin1 characters are made (I hope..) and lots and lots of kerning have been done, not like you guys would be unfamiliar with that, hehe <br> <br>Anyway, I'd like to present Magma, revision 2, a display font completley made from scratch. I'd love some comments and critique. <br> <br><img src="http://www.typophile.com/forums/messages/29/47421.gif" alt="Magma2"> <br> <br>The reason for Magma being display and simply not a sans is that it just looks way better in largescale. If i'm wrong on this point and Magma still is not a display face, please point me in the right direction as I'm still relativley new to typography. <br> <br>I haven't checked if Magma is some trademark violation yet, so there is a possibility that the typeface will change name.  <br> <br>I hope no one minds that I post a new thread, this just feel so different from the original subject. If a moderator should prefer so, please merge this thread with the old one or delete on of them.  <br> <br>Best regards, <br>Andreas Climent <br><a href="http://www.karmacube.com" target="_blank">Karmacube.com</a></p>
