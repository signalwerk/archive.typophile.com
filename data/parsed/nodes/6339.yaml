    html: <p>Its simple and sweet, I like this Display-Face. <br> <br> Maybe you can try to find a softener solution on "w", i think it seems harder than the other characters. maybe just "cut off" the cross, the above part in the middle. <br> <br>A couple of years ago I developed a display-typeface called Heaventica, but after a Hard-disc accident i haven't been able to finished it. <br>You can check that out anyway in the typophile-forum. <br> <br></p>
