    <p>alright, i need to vent.</p>
    <p>awful advertisements are not new to new york. but i just can’t imagine the a-hole exec that said “yeah, it’s fine and everything, but we really want those special g’s, you know, the ones with the two circles? yeah, make them like that.”</p>
    <p>here’s an example of one (someone else’s flickr): <a href="http://www.flickr.com/photos/rhcooper/1342938354/" title="http://www.flickr.com/photos/rhcooper/1342938354/">http://www.flickr.com/photos/rhcooper/1342938354/</a> </p>
    <p>if i’m not mistaken, that’s a Trebuchet two-storey g f-ing pasted right into Conduit. </p>
    <p>IT’S TWO DIFFERENT oh my god. you don’t need to know anything about weight and proportion to see that this is a monstrously awful idea. what self-respecting typographer could allow this to happen.... not to mention that it’s AWFULLY similar to Interstate, which cbs has been using for quite some time now....</p>
    <p>this brings me to my point: i’m new to the field, and haven’t had much experience. i’m sure abc has different tiers of in-house designers who assign effort based on the importance of the work... i guess. but this is their branding typeface, we’re supposed to understand it as abc’s voice when we see it, no?</p>
    <p>my question: has this kind of crap ever happened to you? what kind of people are responsible for saying “No, I want THIS” and completely farting everything up in this fashion? </p>
    <p>i have to prepare myself to meet this head-on, because this isn’t the FIRST time i’ve thought to myself “um, what were they thinking...” when I looked at a corporate ad....</p>
