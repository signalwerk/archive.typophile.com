    html: <p>There's not much connection to Eurostile in this except that it is squarish. I don't have much time for hunting right now, but <a href="http://www.t26.com" target="_blank">T-26</a> has about the largest 'Techno" collection of any regular foundry, and it might be worth a look through that selection. 'Luggage' and 'Phuture' are two fonts I seem to recall might resemble this better than Eurostile.</p>
