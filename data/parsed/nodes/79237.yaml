    html: <p>I was wondering the same thing. It looks like a modified version of <a class="freelinking external" href="http://new.myfonts.com/fonts/redrooster/block-gothic-rr/bold-extra-condensed/" rel="nofollow">RR Block Gothic Bold Extra-Condensed</a> (or <a class="freelinking external" href="http://new.myfonts.com/fonts/redrooster/block-gothic-rr/extra-bold-extra-condensed/" rel="nofollow">Extra-Bold Extra-Condensed</a>) with the M’s crotch truncated, the G’s bar chopped, and terminals cut to slant. That’s the closest thing I can think of, anyway.</p>
