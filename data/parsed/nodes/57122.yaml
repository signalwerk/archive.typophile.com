      <p>Metallophile is a very good suggestion. I wish it was more like News Gothic and not Futura, but it's definitely a choice.</p>
      <p>Beo Sans doesn't quit seem to fit the period (?)</p>
      <p>Telephoto is a bit too clean, the effect will wanish in smaller point sizes.</p>
      <p>Cubanica Marquee is a nice alternative too.</p>
      <p>Christian, yes I have thought about similiar methods too, but I need lots of text and that method would be too slow and painful.</p>
