    html: |-
      <p>_ Set text with News Gothic in Photoshop.<br>
      _ Turn off kerning<br>
      _ Overlay with subtle texture or noise filter<br>
      _ Flatten layers<br>
      _ Gaussian blur (more blur for rounder corners)<br>
      _ Increase contrast until type edges are sharp<br>
      _ Adjust brightness to increase or decrease the weight</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/PoorlyPrinted_5382.png"></div><p></p>
