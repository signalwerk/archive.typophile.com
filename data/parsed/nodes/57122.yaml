    html: <p>One of my all-time favourites, <a class="freelinking external" href="http://new.myfonts.com/fonts/cubanica/marquee/" rel="nofollow">Cubanica Marquee</a> might be a fine choice. It not only gives you a certain roundness, but also some funny kerning issues, that give it more naive vernacular look. But it looks like a Latin-American sign, not early 20th century European type...</p>
