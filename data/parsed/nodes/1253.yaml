  html: <p> I'd like to solicit a few opinions about our name, Apollo 26. I thought it was rather inocuous...to me, apollo = exploration, 26 = alphabet... but a fellow type designer who works with T26 today said in an email that Apollo 26 was kinda uncool, in his opinion. I wrote to CS at T26 and he expressed his thoughts in a very direct pleasant manner. <br> <br> <br>So...Anyone have any thoughts about the number 26? <br> <br>would apollo 26 create confusion in the marketplace among type buyers? <br> <br>then there's the Apollo Program, elliott earls. <br> <br>Arggh! Anyone have any lucid thoughts? <br> <br> <br>bj </p>
