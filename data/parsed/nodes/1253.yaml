    html: <p> A &amp; B - don't know about C . . . <br> <br>To further illustrate the pont of industry saturation, it'd be like calling yourself 'Test Pilot Bureau' . . . <br> <br>- They are two names already belonging to two distinct foundries being blended into one like a Reese Peanutbutter Cup and yet having no unique flavor of its own. . . <br> <br>It's not that I don't appreciate the name 'Apollo 26' it's a fine name, it unforunatly lends itself to other rather well known companies within this industry and could easily force comparisons if not animosity from one of the owners who may see it as 'borrowing' their identity. <br> <br>If there are names out there that you would be just as happy with, pick one you really like and could enjoy for years and years. The more unique the name, the more pride you will have in knowing it's like nothing else in the industry. <br> <br>Stuart :D </p>
