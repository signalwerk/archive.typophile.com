    html: <p> Of all the Greek gods, I'd have to say Apollo would be my last choice as a representative for the creative process in general and the typographic arts in particular (even though he's oft depicted as the God of Arts). Sure, he's more than qualified to act as poster god for the Art of Hinting, along with his sister Artemis, but this is only one aspect of the process. (In a similar vein, the 26 letters are only a small sampling of the typographic realm.) <br> <br>Imo, as far as greek gods are concerned, some kind of partnership between Hephaistos, Dionysus and Hermes would be a good team. From a practical matter, as far as the general public is concerned anyway, you may as well name your foundry Three Stooges, Inc. If you had to pick just one, the Roman analogue to Dionysus, *Bacchus*, might make for a cool logohead... Just a thought. <br> <br>- Sean </p>
