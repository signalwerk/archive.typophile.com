    html: <p> At the risk of opening a can of worms, I have to admit that I always found T26 and P22 just a teensy bit samey in the name department, but they seem to co-exist just fine and dandy. They seem far closer in my opinion than T26 and Apollo26. <br> <br>Far more of a worry is Apollo26 vs the Apollo Program - did you try and get in touch with the other Mr Earls for his opinion? <br> <br>All that said, I am sort of with Stuart on this one; if there are similarities with other brands out there, you risk (without wanting to sound like some prat in a suit at Wolff Olins) diluting your brand. That does no-one any favours. </p>
