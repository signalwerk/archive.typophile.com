    html: "<p> BJ, you've hit the nail on the head - both of those names have \"industry saturation\" in that they both have associations with other foundries. <br> <br>To that end, going with that name will decrease your \"uniqueness\" to the marketplace, especially if you're trying to build your own unique brand. <br> <br>Focus on what it is you want to accomplish with your foundry, print out one line showings of all the fonts you've created for commercial sale and look at what you've got. <br> <br>In short order, it should become obvious what it is you're really going as a foundry. From there, it's a matter of finding a name that compliments that vision and brings it to another level. <br> <br>Also, make the name memorable and easy to remember because one day a few years from today, when somebody mentions your foundry by its contacted name, everybody who reads about it will know exactly what foundry is being referred to. <br> <br>(eg: House, Emigre, Font Diner, you get the pocture) <br> <br>Whereas if somebody posts, check out the new Apollo fonts, or the new 26 fonts, chances are they won't know it was referring to you. . . <br> <br>Just my thoughts . . . <br> <br>Stuart :D </p>"
