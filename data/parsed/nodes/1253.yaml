    html: "<p> Thanks again Stuart and Mart, Sean John and Andy?. I know this is kind of a silly discussion, blah, blah, pixels for words. But instead of regretting a hasty post, I'll try to embrace it. So... <br>We have our first retail release coming later this month, DEFCON, a preview of which will be available late Wednesday. Certainly, I'd like to do the *right* thing, but...I have a partner who has an opinion, CS has an opinion, probably EE has an opinion, and what is *right*? And how does *that* differ from what is pragmatic? <br> <br>Looking back at my computer files, the first record of Apollo 26 is from last November. So it's almost been Nine Months. Hmmm. In nine months, my partner and I have taken on the identity of the name and our work reflects it. We *are* the name and the name *is* us. To us it means exploration, creative freedom, no mo status quo. It's difficult to quantify or qualify, but to us, it's *deep* and *real*. Also, last November, EE was pretty much dormant in the industry. So when the name popped into my head, it wasn't a synthesis of EE or CS or any of that. <br> <br>Initially, Apollo 26 was going to be an online magazine to fan my burning passions for type and letterforms, with 26 handy issues, one every two weeks, a mix of design and journalism. I had the themes plotted out, the interview lists ready...hey Stuart, you were going to be featured in the RETRO-themed issue. The '26' worked three different ways -- the alphabet, the bi-weekly issues, and Apollo 13X2. <br> <br>The Apollo 13 mission has personal significance to me, besides being a great moment in *thinking*, it coincided with an important event in my life without which I wouldn't be here: birth. <br> <br>On general principle, to me, the number 26 is fair game but A26 is too close. '26' as a number to describe the alphabet (Alphabet 26) or type or fonts is not 'wholly original' to T26, not like Test Pilot Collective is wholly original. And Sean gave us a concise history of Apollo. I can see how people 'in' the industry would get flustered by the name, irritated, or just plain roll their eyes. True, as a 'practical business matter', the name should be changed but sometimes principle is stronger than practical. <br> <br>Thanks for the input, <br> <br>Get ready for a sneak peek at DEFCON, the first retail release from... <br> <br> <br>bj </p>"
