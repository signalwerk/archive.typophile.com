    html: "<p> BJ: I concur totally with what Stuart said, and I think you should wipe the slate clean and rename.  <br>In naming a font - which I think is a discussion we had here already - it is preferable if the name is evocative. But naming a font/design company I think all bets are off. You don't have to be literal and you might get away with anything. Look at Yahoo!, eBay, Frog, etc. etc. Printing out the one line examples could help, but the stuff between the lines - the business plan inside your head might be the clarifying factor in gelling/choosing a name. </p>"
