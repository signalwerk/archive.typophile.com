    <p>While researching the German calligrapher Conrad Scherzer, and a book which he illustrated in the late 1930s, I ran across a website selling Nazi era objects and ephemera. While scanning the listings looking for the item the search had flagged, I ran across what would probably prove to be a rare bit of printed ephemera. If it were genuine.</p>
    <p>The item is purported to be Heinrich Himmler's calling card, and as the description describes, </p>
    <p>"It was found in Himmler's apartment by a US Soldier, and brought back home. then he forgot about it. After he died, his widow found them, and the Hitler cards, and sold them to the guy I bought them from. These cards are larger than US business cards - approx. 6.3 cm x 10.5 cm."</p>
    <p>Intrigued by what typeface the card might be set in (some Antiqua by Koch, Tiemann, Renner, Erbar, et al.) I clicked the thumbnail to see an enlargement.</p>
    <p>As you can see, it's MF Benton's "Wedding Text".</p>
    <p>Seriously. The amazing typographic (and historic) naiveté. Not even using the alternate, less Anglicized H either.<br>
    And then there's that SS. . .</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HH-card_4914.jpg"></div><p></p>
    <p>I should note that I found nothing on-line on Scherzer in English. Gerry Cinamon's very comprehensive <a class="freelinking external" href="http://www.germandesigners.net " rel="nofollow"> site</a> makes no mention.</p>
