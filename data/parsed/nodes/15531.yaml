    <p>Did anyone see <a href="http://static.flickr.com/31/50517058_efa825986d_b.jpg" rel="nofollow">this</a> on the op-ed page of yesterday's New York Times?</p>
    <p>There's a really nice sans-serif with ranging numerals and small caps. (<a href="http://static.flickr.com/25/50520116_530fc26814_o.gif" rel="nofollow">Detail here.</a>) Anyone know what it is?</p>
    <p>(This was an "op-chart", so I don't think it has to follow standard NYT style.)</p>
