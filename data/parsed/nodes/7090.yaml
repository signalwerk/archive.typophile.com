  html: '<p>Classic Typo Assignment (Typography) : You are required to design a typeface based on three classical typefaces, one sans serif, one serif and one script.  <br> <br>I have chosen : Sans serif = Gill Sans ITC Bold Serif = Garamond ITC Bold | Script = Snell ITC <br> <br>Using Gill as my base font, and inverting the serif to incorporate Garamond (see attachment). <br>I have yet to use Snell (or any other script face to enhance or ad to my developments). <br> <br>As research and development I would be grateful for users advice and guidance on this. <br> <br>I look forward to your comments.<img src="http://www.typophile.com/forums/messages/4100/50915.jpg" alt="My Classic Typo Development"></p>'
