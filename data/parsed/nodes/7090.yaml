    html: <p>Are you supposed to design a whole <i>typeface,</i> i.e., a design for a font? This looks more like a collection of three graphic forms, or icons of some sort� they look good indivdually, but putting them together to creat lines of text would not be successful with these forms. <br> <br>These forms do look good as stand alone objects, but I don't see any of the Snell Roundhand. The Gill Sans and the Garamond are clear. <br> <br>Some people may give you a hard time for choosing ITC Garamond, instead of another Garamond, because ITC Garamond is a <b>very</b> unpopular typefaces. It is unpopular because it is not a real Garamond revival at all. But, if you are just using it as a typeface, and not as a Garamond, I don't see any problem with it� you aren't designing a text face here anyway. <br> <br>Where are you studying?</p>
