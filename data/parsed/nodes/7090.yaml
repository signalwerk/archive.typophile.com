    html: <p>I am studying a a degree in Contemporary Graphic Design, the brief also stipulates that although the use of classic typefaces will be the foundation of the font and must include elements used from each font, the fonts must not be initially indentifiable. We are only created 26 Uppercase characters. I chose Garamond ITC as I was after a rounded serif rather than a slab or calligraphic serif. (any other suggestions would be grateful).</p>
