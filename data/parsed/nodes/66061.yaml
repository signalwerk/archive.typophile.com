      <p>I'll cite Nick Shinn, from another thread (<a href="http://typophile.com/node/55727" title="http://typophile.com/node/55727">http://typophile.com/node/55727</a>):<br>
      <cite>it is the nature of design to solve problems.<br>
      In saying that all my faces solve problems, I should admit that mostly they are problems I've created, such as "What would a slab serif designed by Bodoni look like?" Most type designs could be described like that, e.g. "What would my version of a squarish sans serif look like?"</cite></p>
      <p>(Type) designers (professional or amateur) like challenges. A modular typeface is a classic challenge in the field.</p>
