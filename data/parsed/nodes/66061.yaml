      <p>My two cent, as non type designer:<br>
      - Type design has become more "democratic" lately, in the sense that more people have access to the tools, so it's easier that someone will try to make a font, either for fun or for the need of some graphic project. All these new, untrained, and inexperienced "type designers" will reinvent the wheel all over again every time, thus repeating experiments already done and working with modules both because it's (apparently) easier and because, in general, design loves constraints.<br>
      - There's a growing need for extensive glyph coverage. Either in the form of Extended Latin or other scripts altogether. Here too using modules will speed up work (and possibly hinder quality).</p>
    html_clean: |-
