      <p>Hi, Alexey-</p>
      <p>To me modular typeface is a question of design rather than economy. When I make a modular font, I'm using basic shapes to make a distingt design, rather than making my work easier. In most cases modular design in fact makes it harder to build a full font, with so many different forms I have to compliment with just one module.</p>
      <p>A pixel is rather too small to be considered a module to me. But in a sense you are right: Type 1 glyphs are drawn into a 1000 x 1000 grid, so if you want stretch the idea that far, all typefaces are modular.</p>
