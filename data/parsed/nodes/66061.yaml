      <p>I could see how certain types of modularity could facilitate the learning of an unfamiliar <em>writing system</em>, but I don't see how it could help in reading text set in any font in the case of a familiar alphabet. In my view modularity appeals only to our conscious sense of order, which is only superficially related to actual reading.</p>
      <p>However readability is admittedly not what Alexey is looking towards here, I don't think.</p>
