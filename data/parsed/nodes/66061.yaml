    <p>Hi everyone,<br>
    I need some information/sources on modular typefaces today. I have enough material on historical modular type. I mean reasons for creating and using one.<br>
    Now there is a real problem with understanding modular type in today's context. What we can see now is the use of module based system as a stylization. These typefaces neither utilizing some kind of idea/movement nor using modularity for economical reasons ( comparing to 20s and 30s typefaces).<br>
    Actually I think every digital font is somehow modular. Module is pixel. LCD screens also utilize module based type.<br>
    However different variations of modular typefaces are still created ( even easier now with ”font struct“).<br>
    What do you think of modular type in today's context? How can it be used to reflect new technology or new thoughts/ philosophies/movements?</p>
