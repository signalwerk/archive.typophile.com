    html: <p>@foxyripper, I think a big reason for FontStruct's popularity is that it is a very quick way of creating new fonts. Much quicker than drawing each letter by hand, giving thought to contrast, proportion and interplay of every line. I really can't think of any other tool historically that compares with the ease and power of FontStruct -- it would probably have been popular in any time period. But FontStruct also has big limitations. Not only concerning design, but also with regard to metrics and kerning. As FontStruct itself is keen on reminding us, "Some fonts you just can't FontStruct".</p>
