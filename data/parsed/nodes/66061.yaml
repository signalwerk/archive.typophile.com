    html: <p>@riccard0, I believe you are right in so far as learning to read is in part learning to recognize the "modules" permitted in a writing system, and the way these modules are combined to form specific letters. But then we are IMO dealing with "scriptology", not typography. A typographer would want to adjust the shape of each letter to ease legibility, even out the colour, etc. This normally requires adjustments on a smaller scale than replacing one module with another.</p>
