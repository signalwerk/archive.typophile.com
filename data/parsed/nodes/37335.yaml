    <p>In the beginning of the latest iteration of this website, the edit feature was screwed up, in that an edit resulted in an updated time stamp which resorted the postings out of original order. I thought that was fixed. I was mistaken.</p>
    <p>How hard is this to fix? Do we need to vote on whether this bug should be fixed?</p>
    <p>If I missed prior discussion on this topic, please point me to the thread.</p>
