    <p><a href="http://www.macromedia.com/software/flashplayer/public_beta/" rel="nofollow">Flash 8 Beta</a> has been announced with an "advanced" text anti-aliasing mode. <a href="http://www.onebyonedesign.com/flash/f8/test1/" rel="nofollow">Try it here</a> once you've installed the new version.</p>
    <p>It does seem to make a significant difference.</p>
    <p>(via the <a href="http://www.sitepoint.com" rel="nofollow">Sitepoint.com</a> newsletter.)</p>
    <p>Ed.</p>
