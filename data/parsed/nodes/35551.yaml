      <p>In my opinion, the most readable serif in displaying on screen with MS Word on Windows XP and Smooth font setting on would be Century Schoolbook because of its clear contrast and nice shape. The second rank goes to Georgia, though in print it is a little bold. Third is Times New Roman, I have to admit that it may not be the most beautiful but it is readable at small size on screen even with anti-alaising mode off. Cambria and Segoe Print, which are pre-loaded in Vista are also great.</p>
      <p>For Mac OSX, I'd say Adobe Garamond, Hoefler Text and Century Schoolbook are my choice. Baskerville and Caslon as some mentioned earlier that the digital versions may not fully be appreciated as the original but they are still of good quality.</p>
      <p>Maybe you might need to compare different typefaces of choice on screen and do some survey on your colleagues to finally decide the winner.</p>
      <p>--- pinky winky kinky ---</p>
