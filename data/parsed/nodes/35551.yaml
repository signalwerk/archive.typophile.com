      <p>Has there been a study on which fonts tend to be more legible and or readable for dyslexics. I am dyslexic and read blocks of text at a painfully slow rate. It is impossible for me to simply recognizes words and groups of words without actually reading each one letter by letter. I do find clearview to be far easier for me read than other fonts. I guess the aspects that it was designed to address maybe similar to those that inflict me. Most words in our environment don't register with me, for unless I read them they have no meaning. I believe most people walk through life reading everything that passes though their field of vision, whether they want to or not, but if I were to try and read every passing word It would be crippling. I wonder if a font that could help dyslexia would also provide a normal reader with greater speed and comprehension as well? Especially if it were used in text book.</p>
      <p>p.s.- I had to look up the spelling of dyslexia for the spell checker had no suggestions for the word I originally spelled. If you are naming a disability that effects a person ability to read and write words, why pick a word that is a terror to spell.  Why not "It", "At", "Cat", "Dog", or "Tim". All of these were needled into my toddler brain a million times over and they were the only ones I didn't have trouble with. Yes, I have Tim, thank you very much. Don't ask ME to spell that word, I am Timic, look it up.</p>
