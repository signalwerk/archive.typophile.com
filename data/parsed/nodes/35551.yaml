    html: |-
      <p>First of all, I see confusion between "legibility" and "readability". Not to oversimplify, legibility is the ability to decipher in adverse conditions, such as poor lighting, fog, visual impairment, etc. The gold standard for legibility ought to be ClearView, which was designed for road signage, and has some impressive research backing it up. Of course, other contenders such as Frutiger are perfectly viable alternatives.</p>
      <p>I assume "readability" to mean performance in an immersive reading environment, meaning in a nice long passage of text, in a comfortable chair, with good lighting etc. It's harder to quantify what "performance" even means (unlike a road sign, where you have a good decipher / no decipher test), but I take it to mean the combination of reading speed and comprehension.</p>
      <p>The science on readability is sparse in the extreme, but for print, I think it's hard to beat any of the classic metal Monotype (and Lino) faces: Baskerville, Bembo, Sabon, Caledonia. As William points out, Caslon is also very nice, but there are many different cuts, and not all are especially nice, especially the digital ones. Similarly for Garamond. The Harry Potter books are set in the Adobe version, which is pretty good, but I did not like the spacing. Oh, and by the way, for both legibility and readability, spacing is even more important than the shape of the letterforms themselves.</p>
      <p>On screen, it starts depending a lot on the rendering technology. Georgia is a pretty good bet, though. On Vista, I think Constantia is likely to be a pleasant and readable font, but I haven't spent enough time with it to say for sure.</p>
      <p>Best of luck!</p>
