      <p>Within the new group of OpenType typefaces released just recently with Vista and Office2007, I really like Cambria. A _lot_! In some ways, it reminds me of Cheltenham, which I love and have always thought was a great onscreen typeface.</p>
      <p>These new fonts were specifically designed for reading onscreen. They have larger, more open counters and less difference between the thinner and thicker strokes (more like Old Style, in this regard). </p>
      <p>Nonetheless, I do find the "3 Ls" -- letterspacing, leading, and line length -- to have AS MUCH to do with readability onscreen as font choice. </p>
      <p>Point size is an issue too, if you are reading onscreen, because your monitor/display is much lower res than the clarity obtainable in print. I would _hate_ bodycopy larger than 10 point in print, but sometimes even 13 point is easier to read on the computer. Somewhere between 11 and 13 point is often where the thickness of the strokes onscreen "jump" from one-pixel-thick to two-pixels-thick. This threshold has a lot to do with clarity and type color within each paragraph.</p>
      <p>And, as was mentioned above, depending on your monitor, ClearType may be a help. Same goes for the font smoothing options in Acrobat Reader. But this is an interaction between the technology and personal taste. I always turn them OFF for small type sizes. YMMV.</p>
