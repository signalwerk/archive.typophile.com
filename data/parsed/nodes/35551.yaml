      <p><cite> “legibility is not an intrinsic quality of type but something acquired through use” </cite></p>
      <p>This is demonstrably false. Which is not to say that there is no role of familiarity, but the idea that there is no such thing as intrinsic legibility is just silly.</p>
      <p>Last week at the TypeTech section of the ATypI conference in St Petersburg, Karin von Ompteda gave a really good presentation about legibility research that specifically tries to ferret out what exact qualities of type contribute to legibility, focusing on the work of Arditi. His stuff is significantly flawed, but still gives inspiration for more useful work... such as what Karin is planning.</p>
      <p>Cheers,</p>
      <p>T</p>
