    html: <p>It's just the S glyph from Trajan that ships with CS3. It has been rotated ever so slightly, and obviously modified to blend into the C. I found that without the rotation, once I had shaved the top off it, it seems to be visually leaning over. It's only a few degrees, so hopefully it hasn't changed the character of the remaining glyph.</p>
