      <p>I too would suggest opening up the letterspacing for the company name, this would allow you adjust the kerning for more even-looking letterspacing.</p>
      <p>Also, it the lack of alignment between the break in the bottom of the logo (between the two letters) and the center of the ornament below bothers me. Perhaps if you were to remove the center diamond from the ornament the lack of alignment would be less noticable.</p>
      <p>Overall though, a good solution for the logo.<br>
