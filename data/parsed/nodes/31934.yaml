  html: |-
    <p>Any recommendations? I’m interested in finding a high quality letterpress printer for short-run projects (social stationery, invitations, etc.). Digi-offset capabilities as well would be terrific, but I’m really looking for a solid letterpress shop. Well, in my dream world I’d be seeking a letterpress to purchase for my own use, but for now a printshop will have to do.</p>
    <p>Any suggestions would be appreciated.</p>
    <p>erin<br>
    paperina inc.</p>
