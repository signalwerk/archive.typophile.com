      <p>Thank you all very much for your helpful responses. </p>
      <p>I am particularly inclined towards using Skolar as the font for body text. In terms of capital letters, likely I will use full caps for abbreviations (rather than small caps), as this is standard in most science publications and people in the field are used to it. Personally, I would however prefer small caps.</p>
      <p>Do you have any recommendations (or can refer me to a related post) on which heading fonts would work well with Skolar?</p>
