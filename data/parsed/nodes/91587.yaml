      <p>The University regulations recommend (but do not require) the use of a 12 pt font, with a "spacing between the lines" of approx. 8 mm.<br>
      In practice, however, most students are using 12 pt with 1.5-fold line spacing, i.e. 12/18. I guess that depending on the font choice, it would be okay to use a different spacing, as long as the visual appearance of the spacing is similar to Times New Roman set in 12/18.</p>
