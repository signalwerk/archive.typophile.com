    html: |-
      <p>Times is small on the body, so 12 makes sense. It's good<br>
      to know though that you can choose a smaller size if the<br>
      font warrants that (meaning you're far less restricted in<br>
      terms of font choice).</p>
      <p>Concerning linespacing, 1.5 is generally a bit much, unless<br>
      your lines have to span the width of a letter-size/A4 page,<br>
      which is not advisable. Also note that the ideal linespacing<br>
      does depend on the font (mostly its x-height).</p>
      <p>hhp</p>
