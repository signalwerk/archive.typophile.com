    <p>Dear all,</p>
    <p>I am writing a PhD thesis in the natural sciences (chemistry, biochemistry). After completing the scientific part, I wish to create a professionally-looking layout in InDesign. This question exclusively relates to the layout part.</p>
    <p><strong>What are suitable combinations of body and heading fonts for a modern, research-based thesis in the Sciences?</strong></p>
    <p>My plan is purchase a limited set of fonts specifically for this purpose - I do not wish to use Arial/Times New Roman.</p>
    <p>I have the following constraints:</p>
    <p>(1) The body font should be a serifs font, the heading font a sans-serif font.<br>
    (2) Both fonts must contain a full set of Greek characters<br>
    (3) The body font should read well when printed at 12/18.<br>
    (4) Preferentially, the heading font should have separate styles suitable for the different sizes that it will be used at, such as for captions (8-10 pt), headings (12-14 pt) and larger title pages (20+ pt).</p>
    <p>My initial thoughts were Myriad Pro/Minion Pro or Frutiger/Garamond Premier Pro, but I would prefer a more modern/contemporary body font.</p>
    <p>Any thoughts or comments would be much appreciated!</p>
