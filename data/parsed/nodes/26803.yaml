    <div class="info">Submitted by <a href="/user/1160" title="View user profile.">Joe Pemberton</a> : 9.Jul.2003 4.01pm </div>
      <p>The Fountain catalogue has been updated with the 3 new type families: <br> <br>Alita - a text face placed somewhere between renaissance and transitional Antiqua, designed by Peter Hoffmann. [ <a href="http://www.fountain.nu/catalogue/alita.asp" target="_blank">http://www.fountain.nu/catalogue/alita.asp</a> <br><img src="http://www.typophile.com/forums/messages/72/12734.gif" alt=""> <br> <br>Paracelsus - a modern take on the old gothic type form called Schwabach, designed by Lars Bergquist. [ <a href="http://www.fountain.nu/catalogue/paracelsus.asp" target="_blank">http://www.fountain.nu/catalogue/paracelsus.asp</a> ] <br><img src="http://www.typophile.com/forums/messages/72/12735.gif" alt=""> <br> <br>Waldstein - a Scotch typeface named after young Beethoven's mecenat, this is also designed by Lars Bergquist. [ <a href="http://www.fountain.nu/catalogue/waldstein.asp" target="_blank">http://www.fountain.nu/catalogue/waldstein.asp</a> <br><img src="http://www.typophile.com/forums/messages/72/12736.gif" alt=""> <br> <br>We have added a new section to the site called - "Visual Overview" - where you can take a fast peek on our whole collection of typefaces. <br> <br>The second release will be next week when we release 2 new fonts by Martin Fredrikson, plus an update of some of his earlier typefaces. <br> <br>Peter Bruhn, principal designer &amp; owner <br> <br><a href="http://www.fountain.nu/" target="_blank">http://www.fountain.nu/</a></p>
