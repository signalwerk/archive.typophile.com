    html: "<p>Related anecdote: <br>A friend of mine was emailed to not use his band name by someone who claimed that they got it first and used it in recordings, etc. The guy worked/ works at BMG, and felt the need to draft a threatening legal letter. <br> <br>As a result, my friend, feeling unduly threatened, responded in a harsh, unappreciative tone and it turned into a (verbal) fight. Ultimately, it wasn't even an issue, as the band had already parted ways, but the whole thing could have been resolved nicely had the guy just said, \"You know, I have a band with the same name. Are you guys still together? Because we are, and we want to use the name we've recorded under since 19XX.\" He presumed that there would be a fight, rather than presuming that they could talk like adults and come to an understanding. <br> <br>I'm interested to see if she'll respond, and if so, how she'll respond.</p>"
