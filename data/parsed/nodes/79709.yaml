    html: |-
      <p>This is known as Kinetic Typography and that video is very poor. You can find a large collection of Kinetic type videos in the Vimeo group <a class="freelinking external" href="http://vimeo.com/channels/kinetictypography" rel="nofollow">here</a></p>
      <p>Kinetic typography is motion design so I doubt there are any websites specifically about it. The best examples will be found in film title sequences (<a class="freelinking external" href="http://www.watchthetitles.com/" rel="nofollow">Forget The Film, Watch The Titles</a> and <a class="freelinking external" href="http://www.artofthetitle.com/" rel="nofollow">Art Of The Title Sequence</a>)</p>
      <p>Robert BrownJohn created a brilliant video for Midland Bank in the 60's demonstrating kinetic typography. It's the best example that I've seen. <a class="freelinking external" href="http://video.yandex.ru/users/videoblog/view/1504/" rel="nofollow">Watch the video here</a></p>
      <p>Enjoy!</p>
