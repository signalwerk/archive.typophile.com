  html: <p>I saw <a href="http://news.yahoo.com/s/yblog_thelookout/20110303/us_yblog_thelookout/the-most-typical-face-on-the-planet" rel="nofollow">The Most Typical Face on the Planet</a> video by the National Geographic yesterday, which is really well done, and it got me wondering if you guys know some websites dedicated to motion typography -- either collections of exemplary works, or tutorials for people who want to get into the field.</p>
  html_clean: <p>I saw <a href="http://news.yahoo.com/s/yblog_thelookout/20110303/us_yblog_thelookout/the-most-typical-face-on-the-planet" rel="nofollow" class="link-external">The Most Typical Face on the Planet</a> video by the National Geographic yesterday, which is really well done, and it got me wondering if you guys know some websites dedicated to motion typography -- either collections of exemplary works, or tutorials for people who want to get into the field.</p>
