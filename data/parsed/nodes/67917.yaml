      <p>Thanks to everyone who's responded already. It looks like there are some good typefaces here. I guess it is a little naive of me to look for the one true matching font for my library. I think I'll aim to get a decent sans-serif with similar proportions, then I can learn for myself when the typefaces work well together and at the end of the day I'll still have a good sans-serif whatever happens.</p>
      <p>Thanks again for everyone's help (more suggestions and advice are always welcome).</p>
      <p>Chris</p>
