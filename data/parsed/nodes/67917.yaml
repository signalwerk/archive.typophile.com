      <p>I don't think you can have a "matching font" in the abstract, without any idea of context.</p>
      <p>Although I do agree with Juergen that vertical proportions are important, especially for the situation where you have a subheading or more critically a sideheading in bold sans, to go with serifed text. In that situation, the two faces should look "the same size" at the same point size. </p>
      <p>And again, if you are mixing two faces in text, you should have the extenders similar in length, or else the leading will look too open or too tight, depending on which of the two faces is being looked at.</p>
    html_clean: |-
