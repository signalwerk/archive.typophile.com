    <p>Hi everyone. As someone who aspires to go into book design I've been planning to buy a few good fonts and getting to know them really well. At the moment I was thinking of buying <a href="http://www.type-together.com/Athelas" rel="nofollow">Athelas</a> simply because I think the letters look very elegant, but I was wondering if I might ask for your opinions about matching fonts? It would be good to have a sans-serif that goes well with Athelas (maybe something like <a href="http://typography.com/fonts/font_overview.php?productLineID=100026" rel="nofollow">Whitney</a> or <a href="http://www.linotype.com/54897/linotypesyntax-family.html" rel="nofollow">Syntax</a>?), but does anyone have any suggestions about that? As well as this does anyone have any thoughts about titling fonts?</p>
    <p>Thanks in advance for all your help,</p>
    <p>Chris</p>
