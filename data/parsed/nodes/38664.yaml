    html: <p>The logo was hand-drawn by Arnaud Mercier. In the pages we use Vista, Benton, Trade Gothic Bold Condensed, Sabon, and not Adsans but <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/doric/bold/" rel="nofollow">Doric Bold</a>--one of my favorite beautifully ugly typefaces--for bold ledes.</p>
