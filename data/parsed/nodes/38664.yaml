    html: <p>Logo is custom, but <em>GOOD</em> uses <a href="http://www.fontshop.com/search/?q=Vista%20Sans">Vista Sans</a> and <a href="http://www.fontshop.com/fonts/singles/linotype/trade_gothic_no_20_condensed_bold/">Trade Gothic No. 20 Condensed Bold</a> throughout each issue. The look was directed by <a href="http://www.notclosed.com/pages/wemake/work_good.html">Scott Stowell of Open</a>.</p>
