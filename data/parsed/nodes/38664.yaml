    html: <p>The logo was hand-drawn by Arnaud Mercier. In the pages we use Vista, Benton, Trade Gothic Bold Condensed, Sabon, and not Adsans but <a href="http://www.myfonts.com/fonts/linotype/doric/bold/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Doric Bold</a>--one of my favorite beautifully ugly typefaces--for bold ledes.</p>
