    html: <p>Logo is custom, but <em>GOOD</em> uses <a href="http://www.fontshop.com/search/?q=Vista%20Sans" rel="nofollow">Vista Sans</a> and <a href="http://www.fontshop.com/fonts/singles/linotype/trade_gothic_no_20_condensed_bold/" rel="nofollow">Trade Gothic No. 20 Condensed Bold</a> throughout each issue. The look was directed by <a href="http://www.notclosed.com/pages/wemake/work_good.html" rel="nofollow">Scott Stowell of Open</a>.</p>
    html_clean: <p>Logo is custom, but <em>GOOD</em> uses <a href="http://www.fontshop.com/search/?q=Vista%20Sans" rel="nofollow" class="link-external">Vista Sans</a> and <a href="http://www.fontshop.com/fonts/singles/linotype/trade_gothic_no_20_condensed_bold/" rel="nofollow" class="link-external">Trade Gothic No. 20 Condensed Bold</a> throughout each issue. The look was directed by <a href="http://www.notclosed.com/pages/wemake/work_good.html" rel="nofollow" class="link-external">Scott Stowell of Open</a>.</p>
