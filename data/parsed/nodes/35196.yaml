      <p>This might be too light for small usage (business card etc), the weight of the C looks about right as a minimum (although the distribution needs work), the crossbar of the T is too wide for my taste and taking Satya’s line as the overshoot it should fall short, probably to the height of the top left serif of the N. Is this going to be a font or just used as a logo? Either way kerning should be considered now.</p>
