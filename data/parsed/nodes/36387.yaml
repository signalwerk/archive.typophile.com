      <p>Helvetica (in all its forms) provides a lot of variety for character. So, I think it's doable. But I certainly wouldn't go to it first for something like this. Trajan is another typeface that gets beat up because it offers what it does so well, but is usually completely inappropriate for what it's used (or over-used) for.</p>
      <p>I think their original sample is generic as all hell and will numb the minds of consumers, but it's also not offensive. Their use of all lowercase letters helps to soften the Helvetica, whereas your sample uses neither the same cut of Helvetica, nor the same typographic treatment. It seems designed to fail.</p>
      <p>Knowing nothing else, it's hard to recommend anything, but if I had to <a href="http://www.yankeecandle.com/cgi-bin/ycbvp/retail.jsp" rel="nofollow">guess who the client is</a>, I'd say go with what works best for the project and don't get hung up on using the same cut of Helvetica as they do on their site. They obviously don't cling to it too tightly.</p>
