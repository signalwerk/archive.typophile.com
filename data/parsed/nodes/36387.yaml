      <p><em>&gt;It’s lack of character (at least relating to the company’s aesthetic look)</em></p>
      <p>Contrast can be a good reason for choosing a typeface – especially if it is intended to sit on an image – and Helvetica offers a broad choice of weights and widths, Sackers Gothic doesn’t. Linking choice with size, colour and placement (including ranging) is the job of the designer (typographer) – in your samples I am not convinced that either reach an optimum position, size or colour (in that order). If anything I would say that Trajan is the obvious (too obvious) choice.</p>
      <p>Tim</p>
