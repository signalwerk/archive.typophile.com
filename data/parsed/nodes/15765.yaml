      <p>Well, there's <a href="http://www.typotheque.com/site/fonts.php?id=9" rel="nofollow"> Fedra Serif A Phonetic.</a></p>
      <p>Or, you might contact Chris Burke. His Parable FF was used for the new Concise OED. I don't know, but it looks like  IPA characters were made for it.  </p>
      <p>I don't see any sign of the an "IPA Parable" on sale at Fontshop, but perhaps you could arrange something. Of course, it might be that the OED has exclusivity.</p>
