      <p>In addition to your Gentium, Times, and Stone, I know of Lucida, <a href="http://www.ctan.org/tex-archive/fonts/tipa/tipa-1.3/" rel="nofollow">Computer Modern</a>, <a href="http://www.typofonderie.com/alphabets/view/LeMondeJournalIpa" rel="nofollow">Le Monde Journal</a>, and Garamond (such as that from the <a href="http://www.rrz.uni-hamburg.de/EAE/" rel="nofollow">Encyclopaedia Aethiopica</a>).  I would go with Le Monde if the budget allows.</p>
      <p>IPA as such isn't set in italic, although such beasts do exist.</p>
