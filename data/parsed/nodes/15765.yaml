    <p>That said, we have to design and set a book that uses a significant number of the <a href="/wiki/International%20Phonetic%20Alphabet" class="freelinking link-lost" rel="nofollow">IPA</a> phonetic characters. There are a few instance of italic; I can fudge these if I have to. The book is in French, by the way.</p>
    <p>I know of three serif font families with phonetic characters, Gentium, Times, and Stone. I would prefer not to use any of these – the “sample book” the publisher sent was set in Minion.</p>
    <p>So, does anybody know of a serif font family (roman, italic and bold), suitable for book work, with phonetic characters, at least in the roman font?</p>
    <p>TIA</p>
