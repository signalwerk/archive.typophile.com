    html: <p>I understand how you're working and it appears to be a good solution, it's a shame it doesn't works... <br>What I wanted to say is you can also define your layers in illustrator, keep only the desired shapes on each layer as you already do, and after draw a fixed-size square (only outline) around each letter and import all that in fontographer, one layer after one. You have then to delete this square in the .fog. <br>Give it a try if you want... (If you can understand my frenchspoken english J )</p>
    html_clean: <p>I understand how you're working and it appears to be a good solution, it's a shame it doesn't works... <br>What I wanted to say is you can also define your layers in illustrator, keep only the desired shapes on each layer as you already do, and after draw a fixed-size square (only outline) around each letter and import all that in fontographer, one layer after one. You have then to delete this square in the .fog. <br>Give it a try if you want... (If you can understand my frenchspoken english J )</p>
