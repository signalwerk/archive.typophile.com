      <p>I feel like all the people (not specifically you, but possibly) who say HTML5 is better than Flash and that it's a good thing that they're moving away from flash don't really realize the capabilities of what Flash can actually do. It excels in so many categories that HTML5 can't even begin to touch right now. Hulu put it well:</p>
      <p><em>We continue to monitor developments on HTML5, but as of now it doesn't yet meet all of our customers' needs. Our player doesn't just simply stream video, it must also secure the content, handle reporting for our advertisers, render the video using a high performance codec to ensure premium visual quality, communicate back with the server to determine how long to buffer and what bitrate to stream, and dozens of other things that aren't necessarily visible to the end user.</em></p>
      <p>And Apple knows that 90% of MacOS users don't know all this, and they so easily brainwash tons of people to think that HTML5 is the savior (again, not specifically you... just a lot of people I've talked to on the subject.) Granted, it will be an excellent addition to web standards, but there's no reason to say it's completely better than Flash.</p>
      <p>And as for paying $40 for Norton... nobody I know who owns a PC has anything like that on their computer. Only moms who don't know what they're doing pay for that useless, memory-hogging program :)</p>
