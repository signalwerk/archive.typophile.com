      <p>I read that last article but just can't agree with the conclusion. The claim that Safari is going to become a proprietary walled garden for Apple is counter to what they are actually doing with Safari...using an open source rendering engine that is adhering to more and more modern web standards.</p>
      <p>Apple has always had control over their user experience in a way that others haven't. They've decided that's a distinguishing selling point and seem to have done OK with it. There are things I like about it and things I don't like about it but the arguments that the iOS should be more like Android is rather silly, as we already have Android that is like Android. And if we're lucky WebOS will survive, Windows7 Mobile won't suck and maybe even one of the linux attempts like Bada will gain some traction too.</p>
      <p>I'm just thrilled that so many of these devices are supporting relatively modern and open web technologies.</p>
