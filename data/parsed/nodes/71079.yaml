      <p><em>Adobe wants the web to remain heavily Flash based.</em></p>
      <p>As someone who works at Adobe (but is not an official representative) I don't really see it that way. It just so happens that for a long time Flash was a better way to do certain things that were not possible with HTML. HTML5 will likely do a great many of those same things and some of them it will do better. But some of them it will do worse. And it is likely that there are some things that HTML5 + CSS3 will not do that Flash can do without loads of additional work. (hyphenation anyone?) It's Apple's choice what to support with their products, but I am of the opinion that their customers would be better served if they had the option of running Flash content if they choose. My only regret is that Android is not as mature and fully intuitive as iOS or I would fully be on that bandwagon. *sigh*</p>
