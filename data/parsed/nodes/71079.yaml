      <p>By the way, they also stopped LiveMotion, which I had purchased (2nd hand) and which was much more intuitive than Flash. (I purchased it, when I already did know, that they were going to stop the development. But I directly felt home in LiveMotion.) Discontinuing the development of their own software is more in the responsibility of Adobe. I don’t know, if you are right with the price. It’s not only dependent from the costs of the development, but also from the number of sold licenses. And with regard to the protection of the software, Adobe is generous. I assume, that Photoshop is illegally used on 90% of all computers, on which it is installed. Maybe that’s Adobe’s way, to make people addicted and to get their monopoly position. (Microsoft follows the same politics: Let the Chinese use Windows illegally and in ten years they have no alternative anymore.) But at least Adobe does not tell dishonest shit about moral values.</p>
      <p>ImageReady also was great. Adobe should not have stopped the development.</p>
