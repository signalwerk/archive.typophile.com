      <p>But this is a tired, old, silly debate.</p>
      <p>If and when the day comes that a magic hole is found in OSX requiring us all to fork over $40 to Mr. Norton, so be it, but it's hardly a valid point to be dwelling on while writing one's anti-apple manifesto. </p>
      <p>To get the discussion back on track, I like where Apple is going in shying away from Flash. I'm not going to miss it.</p>
      <p>However, I'd like them to also realize that as they push for open web standards, they really shouldn't be doing silly things like requiring Safari. Granted, I'm sure they know what they're doing and it's that their main demographic really just doesn't care. They are mainly focusing on the iOS these days and I can sort of concede that WebKit and Safari will be the primary presentation layer technologies being used.  </p>
