      <p>Don’t give in to Neutraface. although it’s a beautiful face, nothing beats hand lettered type. Keep working it until you have something unique. I would try adding the slightest bit of stress to your strokes. that will move it away from the pure geometry of Futura and Neutra  and give it a bit more handcrafted feel. But keep it subtle you don’t want to end up with Optima. </p>
      <p>Lance Kagey, Beautiful Angle.</p>
