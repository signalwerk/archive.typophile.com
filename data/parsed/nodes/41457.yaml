    <p>Here is a logotype for my graphic design identity I have been working on. It is hand lettered and I wanted something simple, geometric and sans-serif with art deco undertones. It is shown in basic black and white, large and small to allow for examination of the letterforms.</p>
    <p>Please let me know what you think.</p>
    <p>Thanks,<br>
    Jay</p>
