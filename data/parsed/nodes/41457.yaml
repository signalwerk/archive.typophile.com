    html: |-
      <p>Really excellent advice all around. I need some objective and fresh eyes. I have looked at it for too long.</p>
      <p>The ’S’ was bothering me a bit but I was not sure if it was just me. Arlo: what do you mean by ’open up the spine’?<br>
      The terminals on the ’S’ I really like being at 30’s - especially since it feeds into the ’E’ on the lower terminal. </p>
      <p>James: I was afraid that raising the middle stroke on the ’E’ would look like it was almost centered, but not quite. It also has to work with the ’P’ which I would not want to raise the top any more (sorry for the lack of type terminology). You are spot on about the loop in the ’P’ though.<br>
      The ’N’ is a bit narrow I agree.</p>
      <p>Any more crit welcome.</p>
