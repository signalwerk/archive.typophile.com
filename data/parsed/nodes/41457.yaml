    html: |-
      <p>Neutraface is awesome and obviously was the starting point for this. I do not own Neutra though so this is all hand drawn. Because of this it is even more geometric with less minor modifications than Neutra which has to work as a complete typeface and not just a logotype. I needed higher crossbars - but not centered. I needed a perfectly circular ’O’ and a bigger ’P’ that looks more like the ’O’. The ’S’ is also a little too closed in Nuetra AND - I got no cash to buy expensive type :)</p>
      <p>Futura was never a consideration - but the first face I thought of when I thought of this.</p>
      <p>I really want this to work and not because I will not buy Neutraface - it’s not quite right for what I want. I have given it a lot of consideration.</p>
      <p>My biggest worry is that like what you say Hofe and Kris - I have in some way drawn a ’bad’ logotype. I don’t want to spend endless time working on a logotype which people will look at and say “why didn’t you just buy Neutraface?”</p>
