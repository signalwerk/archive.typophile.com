      <p>Well, the Finnish design companies seem to agree on sans, Futura or Avant Garde especially. Marimekko with their typewriter style is an exception. The clean lines suit the usually simple design of their products. It is possible, though, that I'm so used to seeing these logos, that I can't imagine anything more decorative in their place.</p>
      <p>The Fiskars logo has changed a bit over the years, but it's still recognisable.</p>
