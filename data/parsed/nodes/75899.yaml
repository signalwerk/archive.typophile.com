      <p>This danish design agency epitomizes contemporary danish graphic design <a class="freelinking external" href="http://www.kontrapunkt.com/en/our-clients/" rel="nofollow">http://www.kontrapunkt.com/en/our-clients/</a><br>
      I hold their work for DSB (Danish Rail) to be their best and most 'Danish', especially because of their contemporary interpretation of the letterforms historically used by DSB (the open 'danish g') and the works of danish early 20th century architects, the so called 'humanist modernist' <a class="freelinking external" href="http://www.kontrapunkt.com/en/cases/dsb/" rel="nofollow">http://www.kontrapunkt.com/en/cases/dsb/</a></p>
