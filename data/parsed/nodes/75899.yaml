    <p>I'm discussing with a colleague about Scandinavian design style and if the identities of the companies behind the scandinavian design also feels scandinavian.<br>
    We are having a hard time finding logotypes that feels like they represent the products and would like to know what logotypes that you think feels scandinavian?</p>
    <p>//Petter</p>
