      <p>I think action words are awesome. In graphic design, a.k.a. typography, action words are given life by playful letter shapes. And since this book is an illustrated Children's book I would expect more lively rendered action words throughout the book.</p>
      <p>Fascinating stuff comparing the original cover with your example.  </p>
      <p>You seemed to have assigned the typography and the illustration onto a two column grid ...to me that is very interesting indeed. Even within the lower text block you have center aligned the text, whereas in the original lower text block the words THE and WITH are offset vertically.  </p>
      <p>The interaction between typography and illustration in the original cover is worth noting ...they are of each other. Having the eyebrow of the dog horizontally aligned with the illustrators name and having the whole text block placed in a position so as to have a relationship between both the dog and the chickens, in other words the entire illustration, is very interesting indeed. And having a feather rest on the N is reenforces the direct relationship of typography and illustration for a Children's book. </p>
      <p>In your rendering the action word is gone, the text blocks are placed in rank and file, and white space floods the overall effort.</p>
      <p>For me, as a graphic designer, comparing these two examples is totally interesting ...</p>
