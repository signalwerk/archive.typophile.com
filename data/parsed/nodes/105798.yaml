      <p>For the cover of a children's book there is a definite conflict of target audiences. Do you go for legibility for the child or do you add some pizzazz to look good on the bookstore shelf to the adult who is the actual buyer? I have no trouble with some compromise on the cover.</p>
      <p>William Berkson, the target audience of readers mentioned by the original poster is ages 2 to 7. This is a group, at the lower end, that is just starting to become aware of the significance of letters. Thus, the need for legibility, which is most important for those who have not quite figured it out yet. Have you done much typographic testing with the three year olds? It's very tough.</p>
