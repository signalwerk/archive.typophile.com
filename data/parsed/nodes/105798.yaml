      <p>According to <a class="freelinking external" href="http://www.arbookfind.com/bookdetail.aspx?q=143328&amp;l=EN&amp;slid=404857521" rel="nofollow">Renaissance Learning</a>, this book is likely to be appropriate for kids in kindergarten through third grade. In kindergarten and first grade, it's probable that it would be an adult reading to the child, so your point about legibility for children may not apply. Children can, however, be attracted to fun type treatments. Children's interest in writing their names different ways, for instance, attests to this.</p>
      <p>"I'm coming to the conclusion that most children's book authors don't ever consult with a designer or typographer." I don't know what the author has to do with this. Children's books are not designed by their authors, any more than other books are.</p>
      <p>About your redesign — putting the title in all caps would likely make it <em>less</em> legible than the original design. And changing a fairly straightforward, if bumpy, typeface for the author into an elaborate swash italic definitely doesn't help.</p>
      <p>Besides which, the aesthetic is all wrong. Your typefaces don't go with the style of the illustrations. There's nothing playful or "troubling" about the faces you chose.</p>
