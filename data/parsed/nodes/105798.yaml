      <p>typography should be granted plenty of room for expression.  I really can't support the elimination of expression in favour of  'legibility'. The expression of the form of written words here is equally a part of the message. Communication is more that the efficient transfer of information. Or rather, the efficint transfer of "information", because we communicate on a lot of levels besides written language. </p>
      <p>Quite frankly, at the end to the day it is quite difficult to design something  like a book cover that is actually illegible - without specifically intending to do so. Go ahead. design an aesthetically pleasing version of this cover that cannot be read. A children's book isn't a highway sign or a medicine bottle meant to be read by demented old people with stinkingly bad eyesight. (I can say the because I'm "that far" from being one myself.)</p>
      <p>Such a design as this is meant to be absorbed over some time, lingering luxuriantly under the covers with a flashlight - and experienced as an adventure. F**k legibility in this case. Let's make reading more fun for young people than efficient. </p>
      <p>An aspect of good typography in my considered opinion has to be the installation of occasional speed-bumps to control the dissemination of information.  </p>
      <p>:o) Just thought that up.</p>
    html_clean: |-
      <p>typography should be granted plenty of room for expression.  I really can't support the elimination of expression in favour of  'legibility'. The expression of the form of written words here is equally a part of the message. Communication is more that the efficient transfer of information. Or rather, the efficint transfer of "information", because we communicate on a lot of levels besides written language. </p>
      <p>Quite frankly, at the end to the day it is quite difficult to design something  like a book cover that is actually illegible - without specifically intending to do so. Go ahead. design an aesthetically pleasing version of this cover that cannot be read. A children's book isn't a highway sign or a medicine bottle meant to be read by demented old people with stinkingly bad eyesight. (I can say the because I'm "that far" from being one myself.)</p>
      <p>Such a design as this is meant to be absorbed over some time, lingering luxuriantly under the covers with a flashlight - and experienced as an adventure. F**k legibility in this case. Let's make reading more fun for young people than efficient. </p>
      <p>An aspect of good typography in my considered opinion has to be the installation of occasional speed-bumps to control the dissemination of information.  </p>
      <p>:o) Just thought that up.</p>
