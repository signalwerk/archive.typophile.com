      <p>I overlooked that, sorry. In that case, the typography is mainly for the adults who read the book to the child. But at the upper end, I still don't think the 'trouble' would present any significant extra difficulty for the child. We decipher letters by their structure, and the irregularities of baseline our brains, including children's brains, are easily able to filter out. It is only in extended text that uniformity becomes an important advantage. In display type—and a children's book may be display type even on the inside, if it has few words—the extra effort of filtering out irregularities is so minimal that it doesn't matter.</p>
