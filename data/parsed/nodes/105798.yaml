      <p><cite>If a young kid—... can't read the title of the book fairly easily, I think that's a big problem.</cite></p>
      <p>It could be a fun problem to solve.</p>
      <p>Generally, I think that adults' estimation of how children learn is far too linear and that we under-estimate their abilities. The fact that <cite>we</cite> are able to read this cover isn't due to superior intellect, higher reasoning powers or years of experience. It is due to a very simple trick of finding cues to visual hierarchies that a three year old is able to appreciate.</p>
      <p>I think it is important to take cues from the audience and not assume that we - as grown-ups and as designers, need to spoon-feed learning in carefully measured doses. Children love puzzles.  Children love challenges. Learning... Learning to read especially, should be fun. It should be rewarding, and it should be interesting. If they can't figure it out today, they get it tomorrow, and feel pretty clever for having done so.</p>
