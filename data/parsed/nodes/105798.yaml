      <p>Matt, I was thinking about your topic a lot lately. It is a difficult one, because while the books are meant for children, they are bought and read by older persons, usually.<br>
      I am very annoyed by the typefaces I meet in the books I read to my toddler. The kids usually look at the illustration, while the person who reads - at the text. I really have difficulties with the readability of the body text. Kids do not care about letters so much at this age, but they may be attracted by them. So, in the original cover of your posted image, the text is more close to the theme then in your redesigned cover, which is toooo serious for a 2 to 7 years old child. I agree with previous comments. The whole point is to look at the typeface from many points of view. I understand your desire for a clean typeface, but the playful note from the kid's world shouldn't disappear.<br>
      I had a chance to discuss with some publishers and asked them how they choose  the typeface (in my case the Greek one). They answered that the final goal is to find a similar Greek typeface with the original English or French... I had in mind to talk to some of them about it. So if you want, I could ask who is choosing the typeface in the first place and based on what criteria.<br>
      Are you interested in the legibility of the cover's typeface or the readability of the body text?</p>
