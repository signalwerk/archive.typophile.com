      <p>I've spent a LOT of time looking at typography in children's picture books, including a detailed analysis of 20 years of Caldecott award winners and nominees (results published in Children &amp; Libraries, a journal of the American Library Association).</p>
      <p>I have also read an awful lot of what has been written about legibility research.</p>
      <p>I am frustrated by children's books with hard-to-read body text.</p>
      <p>But calling out the cover of this particular book for special censure seems... odd. On the spectrum of books for kids, that's pretty average. At a practical level, I don't see kids having any great difficulty deciphering those letters in small quantities. It's not as if it is the body text of the book!</p>
