      <p>I think you are all correct about the cover art typography but I struggle to work with highly stylized typefaces. They just all look terrible to me. Perhaps the styling of the word itself will appeal more to a small child than how the word reads. It's an important part of the book because if the child picks it up they will most likely ask their parents to buy it based on the cover. I don't think the cover art would influence the parents decision one way or the other quite frankly. </p>
      <p>On the subject of the parents, I don't believe the typography is specifically for parents though. I'm leaning towards Gotham for the body copy typography. Although there's no chance a great typeface will win over a great illustration from a child's point of view, a children's book for me is still about learning to read and write through an entertaining story. I want to choose something very clear and geometric. I feel that it's important for a child to recognize the shapes of letters, when learning to read and write. The body copy typeface is slightly off topic, sorry.</p>
      <p>Thanks again for everyone's input.</p>
