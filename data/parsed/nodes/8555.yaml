    html: <p> Jacques, <br> <br>I guess the point I was trying to make is...when  you use 'traditional' letterforms, then there are going to be people who say 'That looks a lot like ________" But often duplication of form is unintentional and difficult to avoid, more difficult perhaps when you have a ultrabold humanist face. <br> <br>I would guess that M. Fredrickson didn't seek out to replicate Gill Kayo's letterforms and that any 'duplication' happened unintentionally. Nevertheless, it is a nice face, but that's only my perspective. I bought the face and have already used it. (You get a lot more appreciation for a face if you 'test drive' it and see how it performs.) <br> <br>One thing that this does point out. When you make a traditional face, there are going to be echoes -- rare is the 'traditional' face that cannot be traced to an antecedent.  <br> <br>One of the 'charms' of this forum is that you will find out if there is an antecedent, very soon after you post something. <br> <br>bj <br> <br> <br>2002 HNY <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> </p>
