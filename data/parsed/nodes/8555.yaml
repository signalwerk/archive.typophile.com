  html: "<p>Hi, <br>Hrant asked to put another font of mine on the discussion board: Ballpoint <br> <br>With Ballpoint, I tried to combine the 'accidents' which happen by writting with a pen and the cleanness of a welldesigned sanserif. I tried to create forms which might give less problems when for example, text is set extremly narrow. (see images) <br> <br>Ballpoint should become different wheights (Light, Reg, Bold; Roman, Caps and Italics) <br> <br>Jacques <br> <br><!---Attachment: ballpoint_beta.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">Ballpoint_Beta.swf<br><a href=\"http://www.typophile.com/forums/messages/29/ballpoint_beta.swf\"><b>ballpoint_beta.swf</b></a> (3 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
