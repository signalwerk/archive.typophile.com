    html: <p> Like the rest of your work, this is superb.  <br> <br>I wouldn't use the name Ballpoint, personally, as it no longer bears much resemblance to handwriting. It's a friendly-looking font, so I'd suggest some sort of casual, friendly name.  <br> <br>I assume this would be the bold version, as it is already quite heavy. The ink traps (I think that's what they're called) in characters like the V, W, m and n could be made more of a feature of the font in general, maybe. The capitals, for example look far less interesting than the lc because they are more uniform and you don't employ those stroke junctions that give the lc its hand-drawn style.  <br> <br>The lc w and maybe also the v don't work for me. In the w, how about trying a italicesque double "u" shape (wide outer strokes and narrow center)?  <br> <br>I'm very interested to see how you tackle the finer versions and the italics.  <br> <br>This could end up being a really popular font. It's friendly, as I say, but not so cute as to seem childish or ironic. I'd work on this before you finish those other fonts as it could be your "breakout" design. It is clearly more marketable than the other fonts at baronvonfonthausen.de. </p>
