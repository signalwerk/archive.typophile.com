    html: <p> This face has a lot of character, though it's Miss Congeniality in comparison to the TyPress Beauty.  <br> <br>You've created the look of a wide-nibbed 'steel pen'. 'Nibbler' is a playful name, though it's very Image Clubby. <br> <br>Like Martin said, the uppercase loses distinctiveness. One suggestion is to eschew the uppercase in favor of a mix of uppper and lower with alternates. See 'Flit', one of the new faces @ Fountain. Martin Fredrickson nailed another great face, mixing upper and lower cases wonderfully. <br> <br>good luck <br> <br>bj </p>
