      <p>Awesome. I think the Goudy one is right. I took a better picture of one of the other posters yesterday:</p><div class="imageWrap"><img src="http://typophile.com/files/jdposter2_3816.jpg"></div><p></p>
      <p>The c terminal is more rounded in the Goudy face, which seems to match the poster better. Those two faces are very similar though ... Maybe the Goudy is a slightly more consistent colour in blocks of text.</p>
