    html: |-
      <p>I think you're on the right track with Goudy as the type designer, but Kennerley is not what this ad uses. I think this is a version of his Italian Old Style. The Lanston version sold by P22/LTC, called <a class="freelinking external" href="http://new.myfonts.com/fonts/lanston/ltc-italian-old-style/" rel="nofollow">LTC Italian Oldstyle</a> seems very close, unlike the Monotype version of this typeface (W wrong for starters). Judith Sutcliffe did one called Italian Electric, based on this Goudy typeface, and hers is also a better match than the Monotype version. Richard Beatty has also done some Goudy revivals, and he may have done this one too.</p>
      <p>- Mike Yanega</p>
