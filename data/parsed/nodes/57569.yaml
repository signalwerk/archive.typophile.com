  html: |-
    <p>I know the Jack Daniels label has been done to death on here but the poster adverts have quite a nice antique-looking body text on, which I can't ID.</p><div class="imageWrap"><img src="http://typophile.com/files/jdposter_5949.png"></div><p></p>
    <p>Sorry the size is so small. I've looked at LTC Kennerley as I heard JD uses that elsewhere in their design but the A doesn't match: serif on the top of the A in the poster but not in Kennerley. Also the serifs look bigger in Kennerley in general.</p>
    <p>Other features which stick out are the diagonal bar of the e, a straight tail on the y and the 3 terminal W.</p>
