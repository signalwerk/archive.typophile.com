    <p>Hello everyone,</p>
    <p>I'm working on rather experimental font - each glyph consists of many horizontal stripes (individual paths/contours) </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile_5887.png"></div><p></p>
    <p>Is there any way to re-arrange thier hierarchy/order?</p>
    <p>For exmple the top contour would be #1 and the last one #23 ? (or otherwise)</p>
    <p>I've figured out  how to display their numbers (ctrl + F7) but how to change their order?</p>
    <p>Thumby and time consuming solution would be probably "cut and paste" in the right order but I'm looking for something more effective.</p>
    <p>Any help appreciated,<br>
    (v)</p>
