    html: |-
      <p>In the mode you’ve probably been already, the one you set the starting points from, right-clicking on each contour should give you a contextual menu with some very basic contour-ordering commands. But it won’t be very effective either. I haven’t done much FontLab scripting in particular, but looking at your contours, just finding the lowest <em>y</em> coordinate in each contour and sorting the contours by this value should do, algorithmically.</p>
      <p>Is there a reason why do you want them sorted? Because the only reason I myself can think of is the file size, as the bigger the distances between points, the bigger the numbers that need to be stored. In case of a TrueType binary, for example, the threshold is at 256 font units, above which storage requirements for a particular distance double, but that’s still mere two bytes. Machine movement of some kind?</p>
