    html: |-
      <p>"Ink trap" : <a href="http://en.wikipedia.org/wiki/Ink_trap" rel="nofollow">ink trap</a>.</p>
      <p>It's to prevent the ink <em>inside</em> a sharp edge running in. As your image shows, the outside joints are regular (or rather, if the outside joints were blunt as well that would be by design only, not as a practical precaution).</p>
  - id: 513208
    user: 2462
    date: 2012-06-18T06:34:00
    date_raw: 18 Jun 2012 — 6:34am
    votes: null
    html: <p>Inside and outside, it can be a good idea to truncate very sharp angles to mitigate the exaggerated effect that results when users apply a stroke (I know, but it's not like we can stop them doing it).</p>
  - id: 513211
    user: 19417
    date: 2012-06-18T06:56:00
    date_raw: 18 Jun 2012 — 6:56am
    votes: null
    html: |-
      <p>Inktraps of course, but they're used in display fonts as well. This got me to suspect that there may be also other reasons.</p>
      <p>Strokes - hmm, interesting point. But in my case I certainly wouldn't compromise the design of the contours for preventing stroke inconsistencies.</p>
  - id: 513216
    user: 103753
    date: 2012-06-18T07:37:00
    date_raw: 18 Jun 2012 — 7:37am
    votes: null
    html: |-
      <p>I’ve sometimes blunted outside very acute angles to avoid ugly on-screen rasterizing effects (where the displayed glyphs will display unwanted spurs, particularly at smaller sizes), although it’s seemed to me an inelegant solution to the problem.</p>
      <p>David</p>
  - id: 513220
    user: 2021
    date: 2012-06-18T08:03:00
    date_raw: 18 Jun 2012 — 8:03am
    votes: null
    html: |-
      <p>It provides a more decisive letter shape.<br>
      A sharp point is unﬁnished, in the sense that its exact position is determined by the output device (or size), not the type designer, and this will happen differently depending on relative sharpness, whereas as a designer one wants a more consistent shape.</p>
  - id: 513250
    user: 2969
    date: 2012-06-18T12:16:00
    date_raw: 18 Jun 2012 — 12:16pm
    votes: null
    html: <p>From me, this comes from the old practice of leaving room for the router bit.</p>
  - id: 513269
    user: 909
    date: 2012-06-18T16:57:00
    date_raw: 18 Jun 2012 — 4:57pm
    votes: null
    html: <p>For *extremely* sharp corners, under some rasterizers, sometimes very bad things would happen. Leastways, that's what I got taught at Adobe, and I remember seeing the effects a few times, though that was Long Ago.</p>
