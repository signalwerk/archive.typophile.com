    date: 2013-05-13T01:25:00
    date_raw: 13 May 2013 — 1:25am
    votes: null
    html: <p>I'm looking man. It was one of the first things I saw. I appreciate it because I find it interesting when someone like Pesko decides to put some ugly/character into his work, especially in todays context where 'perfect' curves and proportions are achievable. It kind've draws some parallels with old specimens, where 'imperfections' were often due to technological issues i.e paper quality. Pesko's moves these into a stylistic area. Which I'm not opposed to. But it's ok if you are! :)</p>
