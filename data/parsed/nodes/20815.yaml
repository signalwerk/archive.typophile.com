    date_raw: 20 Jun 2006 — 8:20pm
    votes: null
    html: <p>On a personal note, when I became seriously interested in type during high school in the early '70s, it was this super-tight style that got my attention, and I enthusiastically imitated it on things like the school paper and yearbook. By the time I was employed as a designer in 1976, my tastes in spacing had become a bit more sophisticated. Part of me still likes the look, while the rest of me wonders what they were smoking.</p>
