    date: 2006-06-20T18:51:00
    date_raw: 20 Jun 2006 — 6:51pm
    votes: null
    html: <p>Super-tight was a '70s thing. Still relatively tight in the '80s, but on its way out. Designers setting things super-tight now are making a reference to the '70s. I don't think anyone thinks it's a better way to set type the way they did back then (and they did!).</p>
