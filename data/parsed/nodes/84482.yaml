      <p>Not sure it was a really typeface.<br>
      But Kai Bernau from Atelier Carvalho Bernau created a JeanLuc Typeface in hommage to Jean Luc Godard movie's credits for his 80 birthday last december.<br>
      You can download and use the font for free at<br>
      <a href="http://www.carvalho-bernau.com/jlg/" title="http://www.carvalho-bernau.com/jlg/">http://www.carvalho-bernau.com/jlg/</a></p>
