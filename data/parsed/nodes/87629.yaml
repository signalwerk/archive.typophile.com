      <p>No, I don't mean as an historic form. I mean that I think e with a slanted crossbar always looks more informal than one with a horizontal bar, and unless the rest of the typeface design is similarly informal the e ends up looking out of place. I also think it subtly undermines the stability of word rhythm by introducing divergent counter shapes and inter-letter white space. I think this is a problem common to all the contemporary text types I have seen that have this affectation.</p>
      <p><em>I do admit that in book faces, the opening of the lower half of the "e" is helped by a reduction in the eye of the e.</em></p>
      <p>This is the opposite of what I am saying. In many types, and all that have the slanted crossbar, the lower counter is too open. You get better spacing and stronger internal rhythms if the crossbar is lower and the eye not too small. This is one of the improvements that the Dutch punchcutters made to the French models that they inherited.</p>
