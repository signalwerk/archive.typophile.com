      <p>That's true John, and I do it all the time.<br>
      For instance today I have just been emailing a customer who wants some CE versions of an older Shinntype face for a Polish newspaper. The retail versions don't have CE, but I am able to supply them, as I developed them for a previous customer, but have not yet got around to releasing them.</p>
      <p>However, customer contact only occurs for a small percentage of Shinntype sales.</p>
      <p>This is the Shinntype perspective that I'm describing: our main business is from publishing retail fonts through third party distributors.</p>
      <p>Sure, I retail types that have been custom developed, after a period of exclusivity has expired, this is a good model financially.<br>
      But it is not a model I would like to be beholden too, as the tendency is for clients to want "something like so-and-so" and there are other less conservative, less derivative ideas I would prefer to pursue.</p>
      <p>I believe this foundry-driven approach is just as client-benefiting as commissioned work.<br>
      It's Jobs-style leadership.</p>
