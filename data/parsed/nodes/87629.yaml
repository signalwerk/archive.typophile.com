    <p>As a type designer, I tend to have my nose so close to my personal grindstone that I'm not always aware what my colleagues have been up to, which is a problem when I'm actually looking for a typeface to use and don't have anything appropriate in my own knife block. So I'm looking for suggestions for possible types to use for a publishing project. The brief is as follows:</p>
    <p>Family must consist of a minimum of roman and italic serif types in in a regular or book weight. Bold and other weight variants appreciated, and may become necessary. Must support at minimum western European Latin character set, and should include appropriate ligatures, smallcaps, numeral variant styles, etc.</p>
    <p>The design should be of medium stroke contrast, i.e. not extreme à la Didot but not too heavily low contrast. The types will eventually need to harmonise on the page with some non-Latin scripts, some of which involve complex forms that must not get too dense.</p>
    <p>The type should be clear and readable in the range of 9pt to 11pt.</p>
    <p>The scripts with which the types will need to harmonise include both strong verticals and very round forms, as well as terminals and stroke reversals creating ball or hook forms. If similar forms are details of the Latin types, this can assist the harmony on the page. Some amount of roundness of forms is probably going to be most helpful in overall harmony; sharp, incised forms are probably not going to help.</p>
    <p>Some of the scripts involved in the publishing project have, conventionally, a diagonal stroke weight axis, and others have a vertical axis. The Latin type could go either way, or be a hybrid (à la Kepler and Brill).</p>
    <p>I'd like to use a recent design and see some money go to a living designer. A contemporary feel, as opposed to a 'classic' one, is acceptable, but not if it might date too quickly or be considered too-2011.</p>
    <p>It will be important that the EULA permits modifications to the font (not for distribution), or willingness on the part of the designer/foundry to work with me on making some modifications.</p>
    <p>So, suggestions?</p>
