      <p>Bruce Kennett did a beautiful job with it, and used a wonderful matte paper that shows both the type and illustrations beautifully. The links don't have close up photos, but if you are interested I can take some. </p>
      <p>A more modest book, a Penguin style paperback, with Williams Caslon Text used at 10 point, was done by Dan Haskett, an English illustrator. You can see some photos of it in the link. Boston Magazine also used it at 10 point for a few years. You can see some photos of it on the FontBureau site.  </p>
      <p><a href="http://www.danhaskett.co.uk/new-work/bonobo-press/" title="http://www.danhaskett.co.uk/new-work/bonobo-press/">http://www.danhaskett.co.uk/new-work/bonobo-press/</a></p>
      <p>I don't know how it works at 9 point in a book, but I've done a small size also, not finished, but I used it in my own book Pirke Avot: Timeless Wisdom for Modern Life (Jewish Publication Society) for appendices. I'm working on the small italic for another designer who wants to use it.</p>
