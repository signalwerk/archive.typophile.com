    html: |-
      <p>Chris, I think it has something to do with the perception of informality, contrary to the evolved typographic form of the formal book hand. I think this is what Griffo understood, and why Jenson had it wrong: he regularised many aspects of the humanist book hand when he reduced it to type, but left the slanted crossbar which then looks out of place in the greater regularity of the typographic page. Griffo fixes this, and establishes the normative form of the typographic e. I've yet to see a serif text face with an e with the slanted crossbar that I didn't think would be improved on the page with a less casual shape.</p>
      <p>Further on this subject, Plantin's types are interesting because the crossbar actually slants down to the right: a feature that I do not recall reproduced in any revivals. I don't think the impression this gives of the e being rotated clockwise is helpful, but the tightening of the lower counter seems to help the visual rhythm by creating a stronger right side to the letter. Recently I've experimented with flaring the crossbar, running the underside in a subtle downward to achieve the same effect.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/SBL BibLit e_4489.png"></div><p></p>
      <p>[SBL BibLit]</p>
    html_clean: |-
      <p>Chris, I think it has something to do with the perception of informality, contrary to the evolved typographic form of the formal book hand. I think this is what Griffo understood, and why Jenson had it wrong: he regularised many aspects of the humanist book hand when he reduced it to type, but left the slanted crossbar which then looks out of place in the greater regularity of the typographic page. Griffo fixes this, and establishes the normative form of the typographic e. I've yet to see a serif text face with an e with the slanted crossbar that I didn't think would be improved on the page with a less casual shape.</p>
      <p>Further on this subject, Plantin's types are interesting because the crossbar actually slants down to the right: a feature that I do not recall reproduced in any revivals. I don't think the impression this gives of the e being rotated clockwise is helpful, but the tightening of the lower counter seems to help the visual rhythm by creating a stronger right side to the letter. Recently I've experimented with flaring the crossbar, running the underside in a subtle downward to achieve the same effect.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/SBL BibLit e_4489.png"></div><p></p>
      <p>[SBL BibLit]</p>
