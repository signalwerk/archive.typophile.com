      <p>Matthew: <em>So we do need to encourage customers to support independent type designers. But we also need to encourage independent type designers not to push so much risk onto the customer.</em></p>
      <p>I agree. This is one of the reasons why I think it is important for independent type designers to establish direct relationships with customers, rather than relying on third party distributors or resellers. This engenders the kind of trust that makes it possible for book designers to request and receive copies of fonts under trial license.</p>
      <p>The other option, of course, is to link licensing fees to commercial use of a font, rather than to its installation. I have several clients who have taken this approach with their custom fonts, making them available at no cost for non-commercial use, which would include test settings for possible commercial use. [But not, I would say, use in specimens that are intended to try to obtain paid work, e.g. mock-ups in a portfolio: the commercial use is defined by the intent to generate income, not the success in doing so.]</p>
