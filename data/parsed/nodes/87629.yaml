      <p>Bill: <em>If you have a smaller eye, it goes with a narrower letter, which also changes the rhythm...</em></p>
      <p>Seldom for the better, I think. The Latin script has inherited a fairly sloppy approach to relative letter width when it comes to the exceptional letters (those that are not directly referenced by other letters in the way that <em>b d p q</em> are). I reckon any type designer who really wants to develop a feel for relative widths should spend time working on Cyrillic text faces. When you have to optically coordinate the proportions of 'а в е ѕ' so as not to disrupt those long Slavic words, a lot more care is needed than in the generally <em>laissez-faire</em> Latin approach driven more by stylistic decisions.</p>
