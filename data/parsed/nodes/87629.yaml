      <p>A more modest book, a Penguin style paperback, with Williams Caslon Text used at 10 point, was done by Dan Haskett, an English illustrator. You can see some photos of it in the link. Boston Magazine also used it at 10 point for a few years. You can see some photos of it on the FontBureau site.  </p>
