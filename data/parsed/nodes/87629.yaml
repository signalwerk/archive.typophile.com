      <p>I recently very much enjoyed reading a publication set in Cycles by Sumner Stone. <a href="http://www.stonetypefoundry.com/cyclesoverview.html" title="http://www.stonetypefoundry.com/cyclesoverview.html">http://www.stonetypefoundry.com/cyclesoverview.html</a></p>
