      <p>To be fair, designers of text faces should be doing more to make their wares easier to test and buy. For instance: </p>
      <p>John Hudson now has an excellent (and growing) list of nominees. How does someone in his position choose from these faces? </p>
      <p>If he visits the websites, he will see cruddy GIFs. Those don't help. </p>
      <p>There might be an online type tester. I guess these things are useful to find out what shape the Q tail is, but they're completely useless for measuring nuance, and text faces thrive on nuance. (Why do type designers even want customers making buying decisions with a type tester? Don't kid yourself—if it's there, they will)</p>
      <p>If he's lucky, there will be a PDF specimen. But most PDF specimens are, frankly, not very good—usually they only present the face in a clinical manner ("Here are the OpenType features..."), and omit realistic texts in realistic contexts. They are boring when they should be inspiring. Never in the history of typography has someone been persuaded to buy a font through sheer boredom.</p>
      <p>For John, probably the best test would be to have the actual fonts in hand and take them for a test drive himself. He could buy the fonts and do some test seettings, but fonts are typically nonreturnable. And they're not licensed on a per-project basis, only per-workstation. And they're not cheap enough that he can just buy several purely on an exploratory basis.</p>
      <p>So here lies the conundrum. How is someone supposed to commit to a new text face when they can't even see what it will look like in a real-world context? </p>
      <p>I know John Hudson himself is not going to throw up his hands and say "I guess I'll just use Minion." But you can start to see why other book designers might. One of the reasons entrenched faces like Minion continue to dominate is because any designer can picture exactly what the result will look like. When you use Minion, there won't be any negative surprises. There won't be any positive surprises either, but hey, you don't get a bonus for positive surprises. But you will get fired for negative surprises.</p>
      <p>So we do need to encourage customers to support independent type designers. But we also need to encourage independent type designers not to push so much risk onto the customer.</p>
