      <p>Hrant: <em>Actually I believe that a dense top is what makes an "e" itself</em></p>
      <p><a href="http://www.mapageweb.umontreal.ca/gosselif/FISET_PSYCHSCIENCE_2008.pdf" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.mapageweb.umontreal.ca/gosselif/FISET_PSYCHSCIENCE_2008.pdf" rel="nofollow"><img src="http://typophile.com/files/e_5799.png"></a></div><p></p>
      <p>Across all tested spatial frequencies in which the letter was identifiable, the crossbar, with or without adjacent areas, was the key feature enabling recognition. Now, one may make the case that this was due to the choice of letterform tested, that a Garamond <em>e</em> with its higher crossbar and tighter, denser top would produce different results, but a) I wouldn't bet either way on that, and b) that still wouldn't imply that a dense top makes every <em>e</em> itself. I suppose you may also makes the case that what makes an <em>e</em> itself within a bouma is somehow different from what makes an <em>e</em> itself in itself. But I think Mr Occam would like to sell you a razor.</p>
    html_clean: |-
