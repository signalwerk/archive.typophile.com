      <p>&gt; The types will eventually need to harmonise on the page with some non-Latin scripts</p>
      <p>In my view this will become the root of the problem/solution.<br>
      First: what do the relationships between the various scripts need to be?<br>
      Second: since there are so many good Latin text faces and so few good<br>
      non-Latin ones, unless the project will entail the designing of non-Latin<br>
      scripts to match a Latin "benchmark", the non-Latin fonts need to be<br>
      chosen first. And if the chosen Latin face will be given new non-Latin<br>
      designs, the scripts to be supported will help choose a good Latin basis.</p>
      <p>hhp</p>
