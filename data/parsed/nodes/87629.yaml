      <p>Some books I know about who have used it are: Foliomania! referred to in these two links: </p>
      <p><a href="http://www.finebooksmagazine.com/fine_books_blog/2011/06/foliomania.phtml" title="http://www.finebooksmagazine.com/fine_books_blog/2011/06/foliomania.phtml">http://www.finebooksmagazine.com/fine_books_blog/2011/06/foliomania.phtml</a></p>
