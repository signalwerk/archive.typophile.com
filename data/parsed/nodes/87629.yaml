      <p><em>When you said “both strong verticals and very round forms, as well as terminals and stroke reversals creating ball or hook forms” it made me think of the typefaces by Dwiggins, Cyrus Highsmith and John Downer. Maybe Zocalo, Iowan Old Style or yes, Paperback?</em></p>
