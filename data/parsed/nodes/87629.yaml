      <p>Nick, I think there are several different kinds of markets for fonts, and in some of those markets I think it is in type designers' interests to establish personal relationships with customers. So, art directors, newspaper designers and book designers strike me as the sort of customers with whom one wants personal relationships that can be mutually beneficial. For the type designer these relationships can lead to custom commissions, nice portfolio specimens, etc., and for the customers they can facilitate test licensing agreements, rapid response for special needs (e.g. the diacritic they need added in order to typeset an African politician's name), etc.</p>
      <p>I never suggested that anyone needs a complicated order fulfillment system in order to enforce a relationship with all customers. That would be stupid. My point was that if one relies completely on systems that sit between and isolate you from customers, that decreases the possibility of developing relationships that can be mutually beneficial.</p>
