    html: |-
      <p><cite>Quite a few of the suggested typefaces were designed for newspaper or magazine use. I like them, but their proportions are probably wrong for the kind of book work I have in mind (x-height too large, extenders too stubby. It would be nice if more foundries took the time to produce book variants of such types, although I suppose more and more the book design market is a shrinking one.</cite></p>
      <p>John, one of the things we do with fonts for text -- given a useful EULA or with permission -- is to examine the extenders. It's not unusual for me to lengthen them. The "g" is the toughest, and then there are all those f-ligatures in the italic.</p>
      <p>Having said that, there are fonts where lengthening the extenders is just the wrong thing to do -- determined experimentally, of course, meaning you do the work, then put back the originals. Charis/Charter is one such. I find it useful, and the shortness of the extenders not an aesthetic problem for the texts it's appropriate for. Arnhem Blond, on the other hand, would greatly benefit from a set of longer descenders for book work.</p>
      <p>I also find the weight of fonts an issue for bookwork. I was stunned once to hear someone from Adobe mention that they made the medium weights esp. for books. Then I realized they may only think of coated papers for books. Sometime take a look at Merlo on an uncoated sheet versus a coated sheet. I use to think it too heavy for text, until I saw it used in a book printed on a matte coated stock. Quite nice.</p>
      <p>I have read this thread somewhat, and as someone who sets type and designs books, haven't found the things that interest you guys of interest to me. Perhaps some marketing issues lie here?</p>
      <p>* * *<br>
      Hrant, you're right of course, but that ignores the fact than many, many fonts have descenders that can be lengthened and still keep that balance. It is not trivially easy to lengthen descenders, or for that matter, to lengthen both. The font will tell you when you go too far, if you pay attention to it.</p>
      <p>I'll offer this thought: A good text font, once you get past the letterforms themselves, offers several size/leading combinations where the font works. That is, not only can you set several sizes, but you can use a 10-point on 12, 13, or 14-points of lead, and it works quite well. You'd be amazed at the number of fonts that cannot do that. All spatial relations are important, and interact.</p>
