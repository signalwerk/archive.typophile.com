      <p><cite>I'd like to use a recent design and see some money go to a living designer</cite></p>
      <p>This is a good principle that deserves wider currency. </p>
      <p>Last year, I picked Lyon over Sabon for my book in part because I wanted to support a independent type designer. But I've come to think there will be a more acute need to support independent type designers as a matter of principle.</p>
      <p>(BTW I'll define "independent type designer" as the opposite of "type designer who is employed full-time at a major corporation," of which there are a dwindling number.)</p>
      <p>During most other periods in printing history, fonts would go obsolete or just wear out every few decades, creating an opportunity for new ones. But that's not the case in the digital era. Digital fonts can live forever. This is convenient in some ways (which I don't think I have to enumerate) but potentially harmful in others. </p>
      <p>I'm not someone who thinks "we don't need any more fonts." Yes, we certainly do. But I also think that the "more is better" strategy that has guided digital foundries over the last 20 years is not sustainable indefinitely. </p>
      <p>Text faces are a good example. Based on how often I see them in use, Minion and Adobe Garamond seem as popular as ever, even though they're both nearly 20 years old. What's to stop them from another 20 years of popularity? 35? 50? The only thing I can think of is someone buys the Adobe library and just takes it off the market. But no one would rationally do that (because the fonts are popular!) So how do you compete with an entrenched face like Minion or Adobe Garamond that will never go extinct naturally?</p>
      <p>First, there's an economic problem. Type design can't make progress unless type designers are designing type. (Duh.) And we only get new type designers if there's some reasonable economic incentive to design type. (Duh.) Every dollar that goes to Minion, for instance, is a dollar that can't go to Lyon. And if dollars don't go to Lyon, a guy like Kai Bernau will find something else to do with his time. (I made a similar point with respect to <a class="freelinking external" href="http://typophile.com/node/85575#comment-477843" rel="nofollow">Robofont</a>.)</p>
      <p>Then there's a second problem: the risk of typographic stagnation. We think of Minion and Adobe Garamond as "classic workhorse" faces of the digital world, but that's largely because they came on the scene early and were able to establish themselves without having to contend with a lot of competition. Where are the workhorses of the future going to come from if they're not getting a platform now? If book designers who can afford to give new fonts a push are just using Minion and Adobe Garamond instead of Ingeborg, or Lyon, or Kingfisher, or Verdigris, or Paperback, or Elena, or Freight, or Quiosco, et al.—how are those designers investing in the future of typography? (I trust I need not explain why people who make a living off typography should be interested in helping sustain it.)</p>
      <p>So while I don't advocate the formation of an OPEC-style font cartel, I think anyone who cares about the progress of typography should care enough to vote with their wallet. And that means whenever you can buy a font from an independent type designer for your own project, or influence someone else to buy one for their project: <strong>DO IT</strong>.</p>
      <p>BTW, I'm not exempt from criticism under this principle. In the last few years, I know a lot of people have bought fonts like Sabon and Stempel Garamond based on my recommendation. I hereby repent. Because as a type designer, my royalty reports are a source of encouragement. And one of the ways I can reinvest in typography is by helping other type designers get the same kind of encouragement. </p>
      <p>Which I do — but I could do more. Sure, Stempel Garamond is a great face. But it's had a good long run. Now it's time for another text face to get a chance. If I'm going to give a push to anything, that new face, and its designer, need it more than Stempel Garamond does.</p>
