    <p>Where would you go if you were given fours days and a bag of money? What would you like to see, what would you visit?</p>
    <p>The reason I'm asking is because that's just happened to me (and some co-workers)! We have been given some money and time to go on a study trip. Preferably Europe, but New York could be an option. The catch is, that it has to be relevant for our work (we're all teaching graphic design, typography, photography) :-)<br>
    So, any ideas?<br>
    Thanks!</p>
