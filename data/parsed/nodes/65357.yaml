      <p>Lucky!</p>
      <p>See if you can convince them to let you go somewhere not too exotic, but still on the fringe of Europe: Yerevan, Armenia. You'll see a lot of it in four days (on foot), and it's a place very into "visible language"*, with Latin, Armenian, Cyrillic and Arabic (Farsi) all over the place**. You'll see how fonts, logos and visuals in general can get distorted***, or improved upon. Plus it has good food and cool architecture, it's inexpensive, and most of all very hospitable and safe.</p>
      <p>* <a href="http://www.flickr.com/photos/ninastoessinger/sets/72157621930145718/" title="http://www.flickr.com/photos/ninastoessinger/sets/72157621930145718/">http://www.flickr.com/photos/ninastoessinger/sets/72157621930145718/</a></p>
      <p>** <a href="http://www.flickr.com/photos/48413419@N00/4130151382/" title="http://www.flickr.com/photos/48413419@N00/4130151382/">http://www.flickr.com/photos/48413419@N00/4130151382/</a></p>
      <p>*** <a href="http://www.flickr.com/photos/ninastoessinger/3798351518" title="http://www.flickr.com/photos/ninastoessinger/3798351518">http://www.flickr.com/photos/ninastoessinger/3798351518</a></p>
      <p>Perhaps most interestingly, the Armenian script seems to stride a very<br>
      fruitful border between the familiar and the alien to a Latin-scripter:<br>
      <a href="http://www.flickr.com/photos/48413419@N00/4130109730/" title="http://www.flickr.com/photos/48413419@N00/4130109730/">http://www.flickr.com/photos/48413419@N00/4130109730/</a><br>
      It's exactly the sort of thing that can inspire and liberate a designer.</p>
      <p>But: what time of year?</p>
      <p>hhp</p>
