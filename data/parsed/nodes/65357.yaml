      <p>There are of course very many places you could visit and not regret it. New York is of course tons of input and crazy, but 4 days might really be too short (mind the jet lag).<br>
      But given that you're open to discovering something a bit off the proverbial beaten path, I actually (whole-heartedly) recommend Armenia too! I traveled there last summer, and found it very stimulating in terms of visual input: indeed, familiar (and hospitable) enough to not make one feel out of place, yet foreign enough to be surprising and inspiring. It's an amazing, rich culture to discover; and seriously obsessed with letters too. (Plus your bag of money will definitely last longer than if you come to Switzerland…)</p>
