    <p>What are the best examples of text typesetting you've seen?</p>
    <p>Who makes them?</p>
    <p>I guess I'm asking because I consider myself a typesetter more than a designer. It seems as though I'm willing to put more faith (and time) into math than my designer friends, and more scrutiny into subtle, compound measurements that change the feel of a text. I think about texts from the textblock outward, rather than from the layout inward. I start a project by choosing a typeface, because most other decisions grow from that.</p>
    <p>And I am looking for some role models.</p>
