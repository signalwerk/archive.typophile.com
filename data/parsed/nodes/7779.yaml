    html: <p>Cheryl, I'm from Manhattan a city known for its sounds from the Bronx to Chinatown. The bridges and subways to bustling midtown. The sounds of Rockefeller Center at Christmas and Coney Island during the summer.  <br> <br>I'd suggest exploring some of these sounds to give your typographic pallet some depth. Mermers in a museum seems rather tame and what is the type for  a cell phone conversation anyway.</p>
