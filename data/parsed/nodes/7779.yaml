  html: <p>Hello,  <br>I have a project where I have to choose a real-time event such as an object (eating popcorn etc) or event (such as going to a place) or anything I am interested in, and convey the sound(s) of it using only type. <br> <br>I am thinking about doing mine about a visit to an art gallery, and conveying the levels of sound eg. background noise, people's discussions etc maybe. <br> <br>Does anyone know any examples on the net, books about this sort of thing or inspiration that may help me? <br>Or let me know what you think would be an interesting sound to convey.</p>
