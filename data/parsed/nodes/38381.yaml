    <p>I'm working on a project pertaining to type that was designed specifically for a particular use/material.<br>
    Verdana was designed for the screen, Bell Gothic/Centennial was designed for use at small sizes and still be legible after dot gain, etc.</p>
    <p>Are there others that have similar properties or features?</p>
