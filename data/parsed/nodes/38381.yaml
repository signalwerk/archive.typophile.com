      <p>Hi there:</p>
      <p>In addition to the above mentioned, Matthew Carter's Bitstream/ITC Charter was created for low resolution laser printers.</p>
      <p><a href="http://en.wikipedia.org/wiki/Bitstream_Charter" title="http://en.wikipedia.org/wiki/Bitstream_Charter">http://en.wikipedia.org/wiki/Bitstream_Charter</a><br>
      <a href="http://www.graphic-design.com/Type/opentype/index.html" title="http://www.graphic-design.com/Type/opentype/index.html">http://www.graphic-design.com/Type/opentype/index.html</a></p>
      <p>For a similar purpose- Amerigo by Gerard Unger:<br>
      <a href="http://www.gerardunger.com/allmytypedesigns/allmytypedesigns09.html" title="http://www.gerardunger.com/allmytypedesigns/allmytypedesigns09.html">http://www.gerardunger.com/allmytypedesigns/allmytypedesigns09.html</a></p>
      <p>Erik Spiekermann designed a special version of Meta suitable for metalic machine routing.<br>
      <a href="http://www.spiekermann.com/mten/type_schriften/" title="http://www.spiekermann.com/mten/type_schriften/">http://www.spiekermann.com/mten/type_schriften/</a></p>
      <p>Also CP Company by Fabrizio Schiavi is specially designed and hinted for on screen use. There is also a special pixel font for Flash.</p>
      <p><a href="http://www.myfonts.com/search?search%5Btext%5D=cp+company" title="http://www.myfonts.com/search?search%5Btext%5D=cp+company">http://www.myfonts.com/search?search%5Btext%5D=cp+company</a></p>
      <p>Mike Diaz :-)</p>
