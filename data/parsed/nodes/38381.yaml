      <p>Read through the font descriptions over at Hoefler and Frere-Jones or The Font Bureau web sites. Both foundries sell typefaces with pretty specific uses—just keep in mind that in some cases they will be fonts issued as part of a larger family. </p>
      <p>And don’t forget about newspaper fonts. There’s a ton of great material out there about newspaper fonts.</p>
