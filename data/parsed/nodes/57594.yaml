    <p>Had to share....maybe this is on typophile somewhere, but couldn't find in search...</p>
    <p>This old web page <a class="freelinking external" href="http://lmnop.blogs.com/lauren/2006/10/americas_most_f.html" rel="nofollow">(America's Most Fonted: The 7 Worst Fonts)</a> is someone's personal rant on 'worst fonts', but the descriptions and thumbnail images are pretty damn funny.</p>
    <p>My personal favorites:</p>
    <p>1. CURLZ MT: "Curlz MT is not a font; it's a cry for help." + "Common abusers: Middle-aged ex-cheerleaders trying to hold on to the magic" + "Probable famous user: Britney Spears."</p>
    <p>2. VIVALDI: "Look!  It's like I really signed it!  Even though it's on a computer!"</p>
    <p>3. KRISTIN ITC: "ITC = I Teach Children" + "Don't you see how playful these letters look? You are talking to someone who is young inside!"</p>
