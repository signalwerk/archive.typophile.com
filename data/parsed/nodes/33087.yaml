      <p>Strictly speaking, they are language-specific substitutions, which are activated by the language tag. Here's how I'm doing it.</p>
      <p>language SRB exclude_dflt; # Serbian<br>
      sub afii10066 by be.serb;</p>
    html_clean: |-
