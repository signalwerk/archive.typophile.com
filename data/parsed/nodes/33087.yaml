      <p>There was a bug in CS2 that made adding the exception dictionary to a document unworkable -- we did send in a bug report, but Adobe doesn't acknowledge them as policy, so we have no way of knowing what the final disposition was. Has this been fixed in CS3? If not, then you can only have an "application" exception dictionary. This means if there are variables for a particular job, you have to change the dictionary, write it off, save it with the job, &amp; reinstall it in the system for each job when proof comes back.</p>
      <p>Since the bug occurred with differences in word endings following an apostrophe (OK with one letter following the apostrophe, not OK with more than one letter), this may or may not affect some of these languages.</p>
