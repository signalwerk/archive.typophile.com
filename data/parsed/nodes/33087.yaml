  html: |-
    <p>When creating dialect-specific alternates in an opentype font, is the locl feature the only one that needs to be addressed? I have 5 serbian alternates to Cyrillic glyphs. I thought they might also be part of aalt or salt as well. I made a couple of small classes and made subs by class. Is there a “better” way to do this?</p>
    <p>ChrisL</p>
