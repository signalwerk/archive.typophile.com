    html: |-
      <p>Thanks Nick!<br>
      It seems not much different than what I did:</p>
      <p>feature locl { # Localized Forms<br>
       # Latin<br>
       language MOL  exclude_dflt; # Moldavian<br>
          sub [Scedilla scedilla Scedilla.smcp] by [Scommaaccent scommaaccent Scommaaccent.smcp];<br>
       language ROM  exclude_dflt; # Romanian<br>
          sub [Scedilla scedilla Scedilla.smcp] by [Scommaaccent scommaaccent Scommaaccent.smcp];<br>
       language SER  exclude_dflt; # Serbian<br>
      	sub @ru2serb by @serbalt;<br>
      } locl;</p>
