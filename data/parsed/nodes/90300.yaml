    html: |-
      <p>An obvious and pretty conservative choice for titles would be Gill Sans (or, if you're feeling fancier, this: <a href="http://www.myfonts.com/fonts/k-type/gill-new-antique/" title="http://www.myfonts.com/fonts/k-type/gill-new-antique/">http://www.myfonts.com/fonts/k-type/gill-new-antique/</a>).<br>
      In the same vein, maybe also Cabin could work.</p>
      <p>As for monospaced fonts, there are several that could fit the bill (Anonymous, Droid Mono, Inconsolata, Consolas...) you should start with the one you're using for actual programming and see how well it prints out.</p>
