    <p>Hello everybody!</p>
    <p>For my thesis (Computer science) I need three typefaces:</p>
    <p>1. One for titles (Serif or Sans-Serif)<br>
    2. A Serif for the body (I've chosen Joanna by E. Gill)<br>
    3. A monospaced typeface for the portions of code</p>
    <p>I need suggestions for the first and for the third typeface.</p>
    <p>Thank you in advance</p>
