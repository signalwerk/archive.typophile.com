      <p>1) What's the thesis about, specifically?<br>
      2) How long is the text?<br>
      3) What are the nature and frequency of the illustrations?<br>
      4) Why did you choose Joanna?</p>
      <p>For a monospaced font, you might choose a design by<br>
      somebody who is both a programmer and a type designer:<br>
      <a href="http://levien.com/type/myfonts/inconsolata.html" title="http://levien.com/type/myfonts/inconsolata.html">http://levien.com/type/myfonts/inconsolata.html</a><br>
      But the questions above come first.</p>
      <p>hhp</p>
