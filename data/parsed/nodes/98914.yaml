    html: |-
      <p>Bill,</p>
      <p>Where can I see examples of Fred Smeijers' work?</p>
      <p>hrant,</p>
      <p>Arabic as a calligraphic or handwriting script is prone to this. For this reason, there are initial, medial, and final, forms to each letter. </p>
      <p>If you look at Isamar David's fine book on Hebrew Letters, only a few of the typefaces presented contain "block" letters (each font is amazing), while the over-whelming majority of typefaces contain calligraphic forms. David was primarily a calligrapher first, and a master type designer second.</p>
      <p>Sol Malkoff I believe worked with Lilly Wonker, who worked with Isamar David for years. Hence, we see David's influence upon Sol Malkoff.</p>
      <p>Interestingly, we don't see this calligraphic influence by the works of Henri Friedlander, Eliyahu Koren, and Tzvi Narkis, the masters of modern Hebrew type design.</p>
