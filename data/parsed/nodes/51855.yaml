      <p>Sorry you couldn't make it to the lecture, Vincent. I was looking forward to seeing you there.</p>
      <p>As it turns out I seem to have made my case over on the Wikipedia, and Gaelic type is now being treated as a top-level</p>
      <p>I have to say, I disagree with 'Irish type' as a translation of <em>cló Gaelach</em>. While it is true that in Scottish Gaelic only standard Roman types were used I think "Irish" is ambiguous. Antiqua or Blackletter types made in Ireland or by Irish designers could be called "Irish". </p>
      <p>Ó Dónaill gives <strong>cló gaelach, gotach, iodálach, rómhánach</strong> 'gaelic, gothic, italic, roman, type'. </p>
      <p>I appreciate your argument, but I think "Gaelic type" is the better term, with due respect to Lynam and McGuinne, who as I noted were not trying to classify our types in the context of a top-level distinction with other Latin types. So it seems to me that Blackletter/Roman/Gaelic is a better fit than Blackletter/Roman/Irish. </p>
      <p>Nothwithstanding "Irish coffee" = <em>caife Gaelach</em>....</p>
      <p>Michael Everson<br>
      evertype.com</p>
