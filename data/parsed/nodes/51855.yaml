      <p>You're right Michael - I haven't come across wynn in an Irish text before. Thinking about it, its use is quite logical, although it must have caused a few heads to be scratched when that map appeared (around 1900 would be my guess).</p>
      <p>I'm afraid I can't follow your argument that Anglo-Saxon typefaces were 'a minority variety of Gaelic Types'. While the use of 'Gaelic' instead of 'Irish' is merely imprecise, its application to the Anglo-Saxon types is simply wrong: they were cast to print Old English, they lacked characters essential for printing Irish, and they contained characters not used in Irish (with the interesting exception of your map). Also, if you apply the term 'Gaelic' to both the Irish and the Anglo-Saxon typefaces, what will you call the Irish typefaces (given that you've already ruled out 'Irish')?</p>
      <p>It seems to me that Irish and Anglo-Saxon type are two independent expressions of the same script. The fact that the latter was used  only for antiquarian purposes proved to be an obstacle to its further development, but in principle it should be given equal status with Irish type in any system of categorisation.</p>
      <p>It's interesting that both Nick and the Wikipedia article (did you write it?) use the term 'insular' when referring to particular letter forms, so I still think that is the obvious umbrella term for all the metal typefaces inspired by the insular scripts. </p>
      <p>Yes, I agree that it would desirable to give some thought to agreeing a minimum character set for Irish/Gaelic fonts. You'll be familiar with Ciarán Ó Duibhín's arguments against a separate encoding for the tall 's' and 'r'. I always felt that he was right at the level of pure logic but the practical utility of having those letters in the same font as the short forms has weighed more heavily with me.  However, the assignment of new code points to those letters, as well as to insular 'd', 'f', 'g' and 't', has greatly increased the scope for confusion. Ideally, one should be able to set an Irish text in Duibhlinn or Seanchló or Gadelica, and then change to Times New Roman, Courier, Helvetica or any Unicode-compliant font. I can't see that happening if these insular code points are used and I'm drifting toward's Ciarán's view that every 's', irrespective of the shape of the glyph, should be coded to 00A2. Open Type features may provide a practical way of including alternative glyphs in the same font in due course. I'll need to think it over some more, but that's the way I'm leaning at present.</p>
    html_clean: |-
      <p>You're right Michael - I haven't come across wynn in an Irish text before. Thinking about it, its use is quite logical, although it must have caused a few heads to be scratched when that map appeared (around 1900 would be my guess).</p>
      <p>I'm afraid I can't follow your argument that Anglo-Saxon typefaces were 'a minority variety of Gaelic Types'. While the use of 'Gaelic' instead of 'Irish' is merely imprecise, its application to the Anglo-Saxon types is simply wrong: they were cast to print Old English, they lacked characters essential for printing Irish, and they contained characters not used in Irish (with the interesting exception of your map). Also, if you apply the term 'Gaelic' to both the Irish and the Anglo-Saxon typefaces, what will you call the Irish typefaces (given that you've already ruled out 'Irish')?</p>
      <p>It seems to me that Irish and Anglo-Saxon type are two independent expressions of the same script. The fact that the latter was used  only for antiquarian purposes proved to be an obstacle to its further development, but in principle it should be given equal status with Irish type in any system of categorisation.</p>
      <p>It's interesting that both Nick and the Wikipedia article (did you write it?) use the term 'insular' when referring to particular letter forms, so I still think that is the obvious umbrella term for all the metal typefaces inspired by the insular scripts. </p>
      <p>Yes, I agree that it would desirable to give some thought to agreeing a minimum character set for Irish/Gaelic fonts. You'll be familiar with Ciarán Ó Duibhín's arguments against a separate encoding for the tall 's' and 'r'. I always felt that he was right at the level of pure logic but the practical utility of having those letters in the same font as the short forms has weighed more heavily with me.  However, the assignment of new code points to those letters, as well as to insular 'd', 'f', 'g' and 't', has greatly increased the scope for confusion. Ideally, one should be able to set an Irish text in Duibhlinn or Seanchló or Gadelica, and then change to Times New Roman, Courier, Helvetica or any Unicode-compliant font. I can't see that happening if these insular code points are used and I'm drifting toward's Ciarán's view that every 's', irrespective of the shape of the glyph, should be coded to 00A2. Open Type features may provide a practical way of including alternative glyphs in the same font in due course. I'll need to think it over some more, but that's the way I'm leaning at present.</p>
