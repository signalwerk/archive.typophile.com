      <p>Vincent,</p>
      <p>Yes, I remember Ciarán Ó Duibhín's arguments against a separate encoding for the insular-r and insular-s in a given Irish font. Once again we come to the question of characters and glyphs. From a practical standpoint, back in the early 1990s when there was no OpenType fanciness available, we took the decision to map insular-r to "ɼ" U+027C (an IPA character formerly used for Czech "ř") and insular-s to "ſ" U+017F. In fact, insular s-with-dot was encoded at "ẛ" U+1E9B to support our legacy character sets.</p>
      <p>Ciarán also argued that the Tironian et sign "⁊" U+204A should be encoded on the ampersand "&amp;" U+0026 but I successfully made the case to the encoding committees, since in origin the former was an ancient Roman symbol and the latter a ligature of e+t. On the Mac OS, the shipping Irish Extended keyboard layout places ⁊ on shift-option-7 (shift-7 is &amp; and option-7 is ¶).</p>
      <p>At the end of the day it really is a matter of the use to which data is put as well as the shapes the user wants. If you want to be able to change a font from Duibhlinn to Times, you <em>certainly</em> want a correspondence between the glyphs set in one and the glyph set in another. These days there are character considerations as well—and it's muddy, and there's no "right" answer. The 1964 Dolmen press edition of <em>An Béal Bocht</em> was typeset in a version of Times which used insular-t and insular-f. Actually, nowadays it's possible to represent that text in Times right alongside text with ordinary t and f—because those insular letters were encoded. On page 51 in italics we have <em>áilneaċꞇ</em> (for <em>áilneacht</em>) in Irish and afactaiv in "English" with insular-t on the first  and carolingian-t on the second. (Chances are you may not see the insular-t as it is new to Unicode and there is not likely to be too much support for it yet.)</p>
      <p>Why were the insular letters encoded? Not for the Béal Bocht. And not for Gaelic type either: these were encoded for use in Roman type. Edward Lhuyd's <em>Archaeologia Britannica</em> uses them as phonetic characters in his orthography for Late Cornish. Turned insular g ("ꝿ" U+A77F) is used for [ŋ]; insular-t ("ꞇ" U+A787) is used for [θ]; insular-d is used for [ð]. The others were also encoded to support lexicographical practice, such as in Johnson's Dictionary where he writes Old English with insular letters. <a class="freelinking external" href="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n3122.pdf" rel="nofollow">My proposal</a> gives the evidence for these. (I waffled about insular-e because I could not really find any contrast.)</p>
      <p>You said: "I can’t see that happening if these insular code points are used and I’m drifting toward’s Ciarán’s view that every ’s’, irrespective of the shape of the glyph, should be coded to 00A2." As I say, it depends on what the intent of your document is. If you're typesetting something for print, it sure is handy to be able to distinguish these letters without having to worry whether or not the application you're using is smart enough to recognize the OpenType tables in your font. Most aren't and will never be. If you're putting something on the web, you need to take searching into account if you want people to find your text. (I don't know how Google treats insular-s. I know that if you search <em>congreſs</em> you get 200 million hits including <em>congress</em>; you have to do an advanced search "congreſs -congress" to get 200 hits with the long s. </p>
      <p>As you know my own Gaelic faces had not been updated to Unicode for many years. I've been rectifying this recently and in general have been supporting a larger character set, iIncluding the insular letters, simply because you can't trust users not to want to use them.</p>
      <p>One of the really interesting things we need to do is ensure that old Gaelic fonts that support the manuscript abbreviations are encoded appropriately. We ought to do that after settling some things about general character set recommendations though.</p>
      <p>Michael Everson<br>
      evertype.com</p>
