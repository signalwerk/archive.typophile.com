      <p>Hello Michael,</p>
      <p>I missed the Bolger lecture because the first I knew of it was when I saw an item in 'The Irish Times' at around 9:00 p.m. on the same evening. Obviously, I should come here more often ...</p>
      <p>On the subject of type classification, it is self-evident that Irish type cannot be classified as a variety of either Roman or Blackletter type. Neither can it be promoted to the status of a distinct alphabet alongside Greek or Cyrillic. Neither can it be consigned to the 'rubbish bin of history' given that new designs are still being produced and used - albeit more for decorative purposes than for continuous text these days.</p>
      <p>In reality, Irish type represents a third distinct variety of the Latin alphabet alongside Roman and Blackletter, having come into existence as the expression in metal of the insular minuscule hand just as the others were originally the expressions in metal of the humanist and textura hands respectively. </p>
      <p>It is true that some of the more recently designed Irish typefaces show other influences - ranging in period from insular majuscule in your 'Ceanannas' to art deco in my 'Slimchló' - but they still fall within the broad classification of Irish type. This is defined less by stylistic considerations such as weight, contrast or x-height, and more by the basic structure of the letters: 'a', 'd', 'f', 'g', 'i' (always dotless), 'r', 's' (long variant) and 't' are particularly distinctive. </p>
      <p>If Irish type has previously been overlooked by type classifiers, this is hardly surprising: whereas Roman and Blackletter type came to dominate western/southern and northern Europe respectively (with the contest for dominance in England not being decided in favour of the former until around 1700), the use of Irish type was always restricted to an unofficial language spoken on a small island on the western edge of the continent - and even in this role it faced strong competition from Roman type before finally losing the battle in the mid-20th century.</p>
      <p>By the way, given that the type has never been used in Highland Scotland (although the insular minuscule hand remained in use there until around 1700), I feel that it is more accurate to speak of 'Irish type' than of 'Gaelic type'. This also reflects the established usage in Lynam's 'Irish Character in Print' and McGuinne's 'Irish Type Design'.</p>
      <p>VM</p>
