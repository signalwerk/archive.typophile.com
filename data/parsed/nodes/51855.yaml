      <p>I ought to have put this in my previous note... You say: </p>
      <p><cite>"It seems to me that Irish and Anglo-Saxon type are two independent expressions of the same script."</cite></p>
      <p>and I have no quarrel with that.</p>
      <p>But then you say </p>
      <p><cite>"The fact that the latter was used only for antiquarian purposes proved to be an obstacle to its further development, but in principle it should be given equal status with Irish type in any system of categorisation."</cite></p>
      <p>But categorization isn't based on intended usage, but rather the design of specific shapes. Even individual insular letterforms (litirchruthanna inseacha) themselves can be rendered in Roman or Blackletter or even Slavonic type styles. The bottom part of a double-bowl g is actualy quite insular in effect if not in origin (must check that). But I do think that "Gaelic Type" is the best translation for "Cló Gaelach", and I can hardly imagine "Cló Éireannach" or "Cló Inseach" being candidates.</p>
      <p>I think that Day's Anglo-Saxon font and Kearney's Queen Elizabeth font are of equal status as Gaelic-Roman hybrids within the class of Gaelic Types.</p>
      <p>I find this discussion quite stimulating.</p>
