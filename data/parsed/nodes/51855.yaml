      <p>I'm no historian, but I know that the Insular scripts and uncials predate the carolingian script which evolved into the blackletters. </p>
      <p>One reason I've been told that uncials and Lombardic versals are tossed in with blackletter is that they were seen on the same page— as in the hierarchy of scripts. Personally I think they should be classified separately even if the number of typographic samples is a short list. Although type is a product of scribal manuscripts, its history in the western world began with blackletter. Even so, if someone creates a type design based on Gaelic script or uncial, the history if these forms remains.</p>
