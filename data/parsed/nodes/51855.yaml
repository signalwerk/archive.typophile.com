      <p>Hello Michael,</p>
      <p>Thinking about this matter since, it struck me that there is (or was) another expression in metal of the insular minuscule hand - namely the Anglo-Saxon types that were used to print editions of Old English texts. See for example:<br>
      <a href="http://www.lib.umich.edu/tcp/docs/dox/asax.html" title="http://www.lib.umich.edu/tcp/docs/dox/asax.html">http://www.lib.umich.edu/tcp/docs/dox/asax.html</a></p>
      <p>I'm no expert in this area, but it appears that no complete font was ever produced in the Anglo-Saxon style. Instead, it seems that Anglo-Saxon and Roman sorts were mixed, giving the resulting texts a rather schizophrenic appearance to the modern eye. Of course, the first Irish font took the same approach.</p>
      <p>In any event, the Anglo-Saxon face is clearly a first cousin of the fonts we have been discussing (whether they are called 'Irish' or 'Gaelic') so there would appear to be a need for an umbrella term that would cover them both. 'Insular' perhaps?</p>
      <p>V.</p>
