      <p>Yes, indeed the Anglo-Saxon faces are interesting. I mention two of them alongside the 1571 Queen Elizabeth type at my  <a class="freelinking external" href="http://www.evertype.com/celtscript/fonthist.html" rel="nofollow">Gaelic Typefaces: History and Classification</a> page. The 1567 Anglo-Saxon type seems to have preceded Kearney's type, and in 1667 another Saxon face was made for Old English. I wonder how many there were in all. I have an early copy of Johnson's dictionary which uses it in the Old English etymologies.</p>
      <p>It would take some study to find out whether a complete font was ever made for Old English; that page you pointed to is quite interesting.</p>
      <p>Regarding classification, however, I would not go for the term "Insular Type" as a substitute for "Gaelic Type". The reason is that while both the Kearney's Queen Elizabeth type and Day's Anglo-Saxon type were what I call <em>Hybrid</em> Gaelic Types, the ones for Old English were a dead-end, and did not develop past hybridism into a full class of types as the Gaelic types did. I'd class the Anglo-Saxon types as a minority variety of Gaelic Types, regardless of what language they were used for. </p>
      <p>Now <em>here's</em> something I bet you haven't seen. I've got an old 9" x 12" map of Ireland, undated but clearly very old. In two places it writes the word <strong>Greenwich</strong> in Gaelic script, but as <strong>Greenƿich</strong>, with a proper insular <em>wynn</em>!</p>
      <p><a class="freelinking external" href="http://www.evertype.com/celtscript/images/learsgail.jpg" rel="nofollow">Mid-day in Greenwich</a> from the legend of the map.</p>
      <p><a class="freelinking external" href="http://www.evertype.com/celtscript/images/greenwich.gif" rel="nofollow">Latitude West of Greenwich</a> from the bottom of the map.</p>
      <p>Michael Everson<br>
      evertype.com</p>
