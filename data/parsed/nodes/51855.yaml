      <p>Michael wrote:</p>
      <p><cite>But categorization isn’t based on intended usage, but rather the design of specific shapes. Even individual insular letterforms (litirchruthanna inseacha) themselves can be rendered in Roman or Blackletter or even Slavonic type styles.</cite></p>
      <p>Categorisation should not be based purely (or even primarily) on superficial appearances - if it were, dolphins would be fish and snakes would be worms. The categorisation of typefaces should be approached in the same way as the categorisation of organisms, or languages, or religions - or of any set of elements that have evolved over time. The categorisation, when complete, should take the form of a family tree showing, for example, how humanist script begat humanist type which begat old style type which begat transitional type which begat modern type - of which (say) Bodoni is an example.</p>
      <p>There may be exceptions in other parts of the world (Cherokee or similar), but in Europe all of our modern type styles can be traced back to a particular script, which in turn had about two thousand years of evolution behind it before it was adapted for use in movable metal type. While the insular minuscule hand arose in Ireland and was introduced to Britain from here, it didn't stop evolving when the English got hold of it. By the tenth century at the latest, Anglo-Saxon minuscule was easily (even I can do it) distinguishable from Irish minuscule - the lower case letters are wider and rounder but the most striking differences are in the capitals which developed forms rarely or never seen in Ireland and which resembled Roman rustic capitals rather than the insular-style capitals that were the norm here. Then look at the capitals in Anglo-Saxon typefaces and the same feature appears - this is a striking divergence from even the earliest Irish typefaces.</p>
      <p>So the reason why there should be two sub-categories for Irish and Anglo-Saxon typefaces isn't because one was used to print Irish and the other to print Old English, it is because they represent two lines of evolution. </p>
      <p><cite>But I do think that “Gaelic Type” is the best translation for “Cló Gaelach”, and I can hardly imagine “Cló Éireannach” or “Cló Inseach” being candidates.<cite></cite></cite></p>
      <p>Irish and English are very different languages and, as with any pair of languages, cognate terms often have different semantic ranges. In English, 'Gaelic' has linguistic and ethnic connotations, but in Irish 'Gaelach' is not often used in either of those senses: for example, 'Gaelic grammar' or the 'the Gaelic nobility' would typically be expressed as  'gramadach na Gaeilge' and 'uaisle na nGael' respectively. Instead, 'Gaelach' is commonly used for a spectrum of over-lapping ideas ranging from 'Irish' through 'native' to 'homely' and on to 'rustic'. It can have either positive ('unaffected') or negative ('unsophisticated') connotations, depending on the context.  Thus 'cnó Gaelach' ('Irish nut') means the indigenous hazel nut, whereas the imported walnut is 'cnó Francach' ('French nut'). </p>
      <p>In short, 'Gaelic' ≠ 'Gaelach'.</p>
      <p>The nomenclature I would suggest is:<br>
      Insular type ('cló inseach'), subdivided into Irish type ('cló Gaelach') and Anglo-Saxon type ('cló Angla-Shacsanach').</p>
      <p><cite>If you’re typesetting something for print, it sure is handy to be able to distinguish these letters without having to worry whether or not the application you’re using is smart enough to recognize the OpenType tables in your font. Most aren’t and will never be.</cite></p>
      <p>I agree that OpenType's day has not yet come - but I do believe it will come. When the applications in MS Office and OpenOffice are able to use its 'tricks', and then save the resulting document in PDF format, OpenType will have arrived and this debate will be largely redundant (except perhaps for some legacy issues). But until that great simplification occurs, I'd prefer not to make things more complex than they already are. You've explained why the insular letter forms were included in Unicode, and not being familiar with mediaeval Welsh manuscripts or obsolete phonetic systems, I am happy to accept that there were sufficient reasons for doing so. However, I would not like to encourage anyone to use those specialised characters when processing ordinary text in Irish. Lower case 'r' and 's' are arguable exceptions, but on balance I'm tending towards the view that it might be 'less bad' to stick with the existing encoding until the OpenType cavalry rides to the rescue.</p>
      <p>The Irish scribal contractions are another issue entirely. I had understood it was Unicode policy to ignore abbreviations, but the document you referenced above indicates that a great many have now been recognised - including some of the Tironian notes that were commonly used in both Irish manuscripts and type down to the mid-19th century. If some of these are admitted to Unicode, then why not all?  The set of contractions in my Bunchló na Nod is not fully comprehensive, but I think it includes all the common contractions, and I had been thinking of preparing a keyboard layout that would allow them to be keyed more easily - but if there is any likelihood of Unicode taking on this area I would definitely wait for the results of their work and recode the font before producing a keyboard ...</p>
