    html: |-
      <p>Yes, I can see that from the paleographer's perspective it may appear quite convenient to have character alternates separately encoded. It makes it easy to accurately transcribe, transport, and recreate, a manuscript document.<br>
      But what of the words?<br>
      For instance, consider medieval Latin abbreviations. If they are hard-coded in plain text, then the same writing, rendered by different scribes willy-nilly for purposes of squaring off the line, will suffer a diaspora. But perhaps I am mistaken, and search engines will track down "similar to" texts, enabling scholars to assess the significance, if any, of the abbreviations.</p>
      <p>Nonetheless, it does seem to me that the either/or nature of the character-glyph distinction is too uncompromising a map of subtle terrain, and that some form of triad would be better. </p>
      <p>Are the medievalists who support encoding medieval characters fully aware of the potential of OpenType fonts?</p>
      <p>Why not utilise an OpenType feature--Stylistic Sets--to represent Latin abbreviations in the form of "rich text" documents? Regarding polyvariance: even though "q with stroke through descender" may indicate quam, que, qui, etc., in any given document the underlying character string is specific, and decomposition will return to it. For the rare occasion where there is some doubt as to the underlying string, then perhaps a precomposed abbreviation may be set. However, even when the transcription of the underlying characters is incorrect, if the digital document is rich text, e.g. PDF made with Quark, InDesign or LaTeX, it will still be faithful to the appearance of the original manuscript.</p>
      <p>Here are three things which are getting muddled up, because the third is not factored in:</p>
      <p>1. Typeface: a style of letter design which may be applied to any character in any script<br>
      2. Font: a collection of Unicoded and non-Unicoded glyphs, in the same typeface style<br>
      3. Template: a set of culturally related basic letter forms--individual instances may or may not have distinct Unicode points. </p>
      <p>So, a typeface may be Gaelic, in the sense that the first (or possibly only) fonts produced in its style followed the Gaelic template.<br>
      But this doesn't preclude that the typeface may be applied, as Michael says, to other scripts and templates.<br>
      A font may be Gaelic, in the sense that its default glyphs follow the Gaelic template, even though it may have alternates which follow the main Latin template. But in a multi-template font, the default is unlikely to be Gaelic, and will probably follow the keypad glyphs of the dominant market.<br>
      A template may be Gaelic, in the sense that it is a set of letter forms associated with Gaelic culture, although its various letter forms and encodings may or may not be shared with other templates.</p>
      <p>The prime example of a template is italic.<br>
      Another is the "Bolgaritsa" version of the Cyrillic alphabet used in Bulgaria.<br>
      The alphabets used by languages are templates. </p>
      <p>A comprehensive medievalist font, as pointed to by the proposal of Mr Everson et al, would contain templates for many languages, and superceed single-language-specific fonts. Such a font could not be classified as Gaelic, Nordic, or whatever, and neither could the typeface it represented. This kind of font is not an anomaly, but the shape of system fonts to come, if not already. Not to mention Old Standard.</p>
      <p>As for "OpenType trickery", there is nothing to stop type designers from making fonts with stylistic sets (as per my "Bolgaritsa" for the Modern Suite) that render alternate templates. What we should do is make two sets of glyphs. So, for Gaelic "t", in the Stylistic Set, it should be "t.gael", with the basic t encoding uni0074. And quite isolated, another uniXXXX, accessible only though a glyph palette or typing in the code--a more laborious method. Is the essence of the insular t really that it is a quite distinct character from standard t?--surely in most circumstances it is a stylistic alternate, and best accessed through a single keypad and a font/layout modifier. Indeed, in the arguments for the legitimacy of encoding the Gaelic template, the Gaelic forms are said to have been used in stylistic opposition to Carolignian. Art direction, not writing.</p>
      <p>Doesn't the encoding of templates restrict the accessibility of texts? The more general reader, for instance, prefers not to read pre-1800 literature with long s's. For Gaelic typesetting of recent writing, it seems reasonable to assume that foundries will cover the template as a stylistic set within a megafont "Meta" or "Garamond", not with a separate Gaelic-only font, and that non academic users will "get" that. I create a few extra glyphs, assign their substitution to a stylistic set, et voilà.</p>
      <p>When I first created the "scripty" variants of the basic alphabet that are included in the Greek Unicode block, for the Modern Suite, I decided to make them accessible via a Stylistic Set; it was then that I realized I would have to duplicate the glyphs (a similar thing is necessary with superior figures) to maintain plain text. Then I ended up categorizing my Greek stylistic sets, as usage practice varies for the characters/glyphs. Interestingly, in InDesign, stylistic sets may be applied additively. There is an example of this on page 42 of the specimen PDF: <a href="http://www.shinntype.com/Figgins_Scotch.pdf" title="http://www.shinntype.com/Figgins_Scotch.pdf">http://www.shinntype.com/Figgins_Scotch.pdf</a></p>
