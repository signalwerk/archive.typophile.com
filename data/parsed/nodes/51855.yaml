      <p>Michael,</p>
      <p>Sorry, but I still think wynn is w.<br>
      Ignoring sound shift, The "w" sound was represented in Anglo Saxon originally by uu.<br>
      Then for a while scribes borrowed the rune glyph for this character, before returning to uu and thence w.<br>
      It has been standard practice during recent centuries to represent "wynn" by "w" in Anglo-saxon texts that otherwise employ eth and thorn, so isn't it creating unnecessary complication to introduce another code point?</p>
      <p>There is a separate Unicode point for the Runic wynn, so why does "Latin" wynn need its own point?<br>
      It's just the character "w" with a different shape (glyph) and non-English name.</p>
      <p>Long s is another alternate glyph that doesn't merit its own code point.<br>
      Consider older glyph-forms of other letters, that don't have their own code points, such as two-bowl g. (How does IPA have a bearing on this? Note that several new typefaces in OpenType format offer alternate forms of "g" with a single code point.)</p>
      <p>In your continuing program of Unicode proliferation, might I suggest you investigate Trissino's "omega"?<br>
      Certainly, one can point to Actual Printed Books in which the borrowed Greek "long o" shape indicates a phonetic distinction. :-)</p>
      <p><em>We don’t classify fonts, but faces. </em></p>
      <p>Exactly.<br>
      If I produce a font, with a consistent typographic style, which has both the standard Latin glyphs and "Gaelic" alternate glyphs, (with the same code points), as a Stylistic Set, why would this not be considered as part of a single typeface?  Although, as you imply, another version of the font could be made with "Gaelic" glyphs as the default. However, in that case, one would be classifying Gaelicness by font. Ergo, there is no such thing as a Gaelic typeface. </p>
      <p>If I were to produce a Gaelic Stylistic Set, within that set "insular g" would not have its own code point.</p>
      <p>I guess my point is, that if one wants to encourage more authentic digital reproduction of ancient texts--and facilitate the production of new works in the old/national styles, it would be more useful to do so via stylistic sets of exisiting characters, rather than with special encoding. </p>
      <p>The special character requirements of grammatical works that address pronunciation, shouldn't that meta-world of typography be kept separate from vernacular and literary usage? As science and math characters are?</p>
