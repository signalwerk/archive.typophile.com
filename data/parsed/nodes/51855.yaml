    <p>Over on the Wikipedia I'm involved in a rather frustrating <a class="freelinking external" href="http://en.wikipedia.org/wiki/Template_talk:Typography_terms" rel="nofollow">dispute about typographic classification</a>. It seems that most mainstream classifiers (from Vox on) have just ignored Gaelic types. Though some specialist literature describing them exists (incliuding a <a class="freelinking external" href="http://www.evertype.com/celtscript/fonthist.html" rel="nofollow">page of my own</a>, there doesn't seem to be anything generic that deals with classification or subclassification.</p>
    <p>I'm sort of wondering how this oversight can be corrected. I'll raise the issue with Mary Anne Bolger <a class="freelinking external" href="http://typophile.com/node/51766" rel="nofollow">tomorrow</a> but I wonder what people here think.</p>
    <p>Michael Everson<br>
    evertype.com</p>
