      <p>Nick,</p>
      <p>There is a difference between a face and a font. We don't classify fonts, but faces. That classification is done by shapes and features. (I'm not trying to lecture! But I think a lot of these words are used differently by many of us.)</p>
      <p>Wynn is not an archaic form of W. It is a borrowing into the Latin script from the Runic script. Wikipedia has an <a class="freelinking external" href="http://en.wikipedia.org/wiki/Wynn" rel="nofollow">article</a> about it.</p>
      <p>Insular g was encoded because of contrastive use in Irish phonetic publications where "ᵹ" [ɣ] the voiced velar fricative is contrasted with "g" [ɡ] the voiced velar stop. See <a class="freelinking external" href="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n2641.pdf" rel="nofollow">my proposal</a> which got the letter encoded at U+1D79. </p>
      <p>Note too that the IPA letter 'ɡ' <em>script g</em> is defined as not ever being a <em>double-bowl g</em>; that character has been encoded for a long time (U+0261).</p>
      <p>Michael Everson<br>
      evertype.com</p>
