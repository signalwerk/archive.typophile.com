      <p>Insular letters are now in Unicode, because of their use alongside Carolingian letters in some books on Irish phonetics and in Edward Lhuyd's 1707 <em>Archaeologia Britannica</em>. See this <a class="freelinking external" href="http://en.wikipedia.org/wiki/Gaelic_type#Gaelic_script_in_Unicode" rel="nofollow">list of codepoints</a>.</p>
      <p>Yogh can be a problem, true. </p>
      <p>While Cyrillic has long been adapted to Roman letterforms (<em>graždanskij šrift</em>) its first typographic expression was Slavonic type, which I would likewise distinguish from Roman and Blackletter and Gaelic. The difficulty in talking about these things is often a question of which level of abstraction one is using the words at. For instance, you say in your last line "a Greek Latin, or Cyrillic typeface". But these words are polysemous, and "Latin" is out of context here.</p>
      <p>Latin, Greek, and Cyrillic are scripts. Roman, Blackletter, Gaelic, and Slavonic are typeface classifications. </p>
      <p>Latin script was widely been written in Roman type and Blackletter type throughout Europe, with a minority development of with insular letterforms in Ireland's Gaelic type.</p>
      <p>Greek script was first set in script typefaces festooned with ligatures, mimicking the manuscript tradition. Greek lower-case certainly developed on its own, though its upper-case has pretty much always conformed to Roman type (not Latin script!) conventions, and in the last 50 years has certainly seen a lot of development (successful or unsuccessful) in Roman letterforms for its lower-case. </p>
      <p>Cyrillic script was first set in Slavonic typefaces (from 1574), but Peter I introduced Roman type to Cyrillic letterforms in 1708 and they've been used there ever since.</p>
      <p>There has always been a continuum (not least because Greek typefaces were made in Italy, for instance), but in terms of <em>classification</em> I think that Roman type, Blackletter type, Gaelic type, and Slavonic type are solid distinctions which can be described and applied fairly clearly, modulo hybridism.</p>
      <p>Michael Everson<br>
      evertype.com</p>
