      <p><cite>It is possible to produce Roman, Blackletter, Gaelic and Slavonic variants of the same typeface, as stylistic sets within the same font.</cite>.</p>
      <p>Any comprehensive system of typeface classification has to be diachronic rather than synchronic: i.e. it should be equally applicable to metal typefaces from the 18th century as it is to the latest Unicode-compliant digital font. It follows that it can't be based on current design practice but rather on the lines of development through the ages. Arguing that Greek should be merged with Roman because their appearances have converged is a bit like saying that dolphins should be reclassified as fish because their legs have turned into fins. </p>
      <p><cite>It seems to me that a lot of Unicode proliferation is just for the sake of it.</cite></p>
      <p>I have to agree that I don't see any merit in assigning code points to insular 'd', 'f', 'g' or 't' - if it is necessary to mix those glyphs with Roman it would be preferable to use a second font. The situation with tall insular 'r' and 's' is somewhat different in that there was a practice, in both manuscript and early printing, to use the smaller forms at the end of words. This practice was also followed in Roman type with 'ſ' and 's' and it is still found in Greek with 'σ' and 'ς'. I think it made good sense to use the code point for 'ſ' in Irish fonts, although the situation with respect to the insular 'r' was less satisfactory and a reasonable case could have been made for giving that character its own code point.</p>
