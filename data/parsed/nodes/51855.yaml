      <p>Vincent,</p>
      <p>I don't mean to say that the Anglo-Saxon typefaces <em>were</em> a minority variety of Gaelic Types; I mean to say that they <em>are</em> a minority variety of Gaelic Types. We're the ones who do classification. Back in the day, those were basically just Roman types to which they added some insular letters and letterforms. I call these "hybrids" since Roman types (properly speaking) really are Carolingian, not insular. The fact that they were devised for the Old English language is irrelevant. It would not be irrelevant had they continued to develop; if a rich variety of Anglo-Saxon faces had developed, it would be quite proper to classify both the ones used for English and the ones used for Irish as "Insular Types". They didn't, however, and the Anglo-Saxon types were a design dead-end. Both the Anglo-Saxon faces and the Queen Elizabeth face were incipient Gaelic Types, both hybrids in terms of their relation to the class of types which developed subsequently which have features which we (or I) call Gaelic. </p>
      <p>Your comment that "they lacked characters essential for printing Irish" is not relevant; we have Blackletter faces that have similar character-set restrictions. Traditional French <em>bastarda</em> Blackletter fonts are unlikely to have characters for Latvian or Icelandic, though Fraktur Blackletter faces used in Latvia and Iceland do. Again the fact that "they contained characters not used in Irish" doesn't matter either in terms of classification, because classification has to do with letterform, not character set. <a class="freelinking external" href="http://www.gaelchlo.org/unicode.html" rel="nofollow">Your own recommended character set</a> contains ß and Ðð and Þþ, after all. (Doubtless for modern computing reasons, but even so.)</p>
      <p>You ask "if you apply the term ’Gaelic’ to both the Irish and the Anglo-Saxon typefaces, what will you call the Irish typefaces (given that you’ve already ruled out ’Irish’)?" but I don't follow this. It may be a level-of-abstraction problem with vocabulary. Typefaces have names; Day's might be called "Anglo-Saxon" but De Walpurgus' is called "Saxon" and Peter Baker's is called "Junius". You and I have monospaced fonts called "Aonchló" and "Doire" respectively, which were developed with the Irish language in mind, but that doesn't, for me, mean that either "Anglo-Saxon" or "Irish" are sub-classifications within the class Gaelic type, because sub-classifications are based on the design shapes, not the intended use. Did I misunderstand you?</p>
      <p>I have comments too on the other interesting things you've said, but will get to them bit by bit.</p>
      <p>Michael Everson<br>
      evertype.com</p>
