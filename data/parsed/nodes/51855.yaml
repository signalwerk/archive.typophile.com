      <p>I said "We don’t classify fonts, but faces."</p>
      <p>Nick said: <cite>"Exactly. If I produce a font, with a consistent typographic style, which has both the standard Latin glyphs and “Gaelic” alternate glyphs, (with the same code points), as a Stylistic Set, why would this not be considered as part of a single typeface? Although, as you imply, another version of the font could be made with “Gaelic” glyphs as the default. However, in that case, one would be classifying Gaelicness by font. Ergo, there is no such thing as a Gaelic typeface."</cite></p>
      <p>Production of a font isn't typeface classification. You can put whatever you want into a font. And you can mix and match and hybridize fantastically. Typeface classification was devised long before digital type. You can do whatever you want with OpenType trickery. That's a whole different level of abstraction from typeface classification. And doing what you suggest would not obliterate the classification of some types as Gaelic; yours would just be an anomalous exception that proves the rule.</p>
      <p>You say: "I guess my point is, that if one wants to encourage more authentic digital reproduction of ancient texts—and facilitate the production of new works in the old/national styles, it would be more useful to do so via stylistic sets of exisiting characters, rather than with special encoding."</p>
      <p>The people who actually <em>do</em> need to do authentic digital reproduction of ancient texts do not agree with you. They insist—rightly—on plain text character distinction. <a class="freelinking external" href="http://std.dkuug.dk/jtc1/sc2/wg2/docs/n3027.pdf" rel="nofollow">A proposal to encode medievalist characters</a>—which was successful—begins with a short essay on why this is so. </p>
      <p>Michael Everson<br>
      evertype.com</p>
