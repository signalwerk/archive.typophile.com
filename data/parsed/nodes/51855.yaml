      <p>I've added wynn, yogh, and tironian "et" to some recent new types I've developed.<br>
      Those have Unicode points.<br>
      I was also rather taken with the shape of "insular g", but it doesn't have a separate code point, so I left that out.</p>
      <p><em>a rather schizophrenic appearance</em></p>
      <p>I had particular difficulty adapting yogh to the modern style, as all the precedents I found were old-style, and the design of the character seems to have never evolved as type has.</p>
      <p>IMO, typefaces are ideas that can be expressed in a variety of scripts, within the related Greek-Latin-Cyrillic continuum (and no doubt beyond), which includes Gaelic. So there is no such thing as a Gaelic typeface, or for that matter a Greek, Latin, or Cyrillic typeface.</p>
