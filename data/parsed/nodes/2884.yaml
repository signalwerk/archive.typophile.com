    html: <p>I did a face based on these sorts of weight relationships, called Cassandra. <br> <br><a href="http://www.scanjam.com/archive/catalog/images/cassandra.gif" target="_top">http://www.scanjam.com/archive/catalog/images/cassandra.gif</a> <br> <br>I took more than a few liberties with this face, but line four of this GIF is more or less a faithful reproduction of a 19th century face whose name and provenance escape me. <br> <br>I think it's safe to call the Cornershop type more 'Italian' than 'French Clarendon,' due to the lack of bracketing and the turned-in serifs of the S. <br> <br>j.</p>
