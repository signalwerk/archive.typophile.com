    html: <p> It seems like there's a whole off-spring style from Egyptiennes (slab serifs) called Italienne or French Antiques. There's a wide range of variation though &amp; sometimes they are called something eklse. <br> <br>There's one Italienne made by W. Caslon IV in 1821 which looks really weird. Deberney &amp; Peignot made one in 1820. <br> <br>I also forgot to mention Playbill (Stephenson Blake, 1938) which also is an Italienne. <br>Other Italiennes </p>
