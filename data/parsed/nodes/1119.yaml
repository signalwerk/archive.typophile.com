  html: <p>Well, here we go. Day one brings ﬁve designs from Portugal, Australia and Germany,  <br>and a sixth that had to go back for missing images. Please ensure that you <b>include all  <br>placed images</b> and that <b>all fonts are converted to outlines</b>. It’ll make our job much,  <br>much smoother and we won’t have to send your design back.  <br><br>This is a critique forum, so have at ‘em. <br><br>01.001 through 01.005 hailing from Australia, Germany and Portugal <br><br><br><img src="http://www.typophile.com/forums/messages/29/15194.gif" alt="01001"><br><br><img src="http://www.typophile.com/forums/messages/29/15195.gif" alt="01001detail"><br><br><img src="http://www.typophile.com/forums/messages/29/15196.gif" alt="01002"><br><br><img src="http://www.typophile.com/forums/messages/29/15197.gif" alt="01003"><br><br><img src="http://www.typophile.com/forums/messages/29/15198.gif" alt="01004"><br><br><img src="http://www.typophile.com/forums/messages/29/15199.gif" alt="01005"></p>
