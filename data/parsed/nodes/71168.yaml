      <p>Hi Chander, welcome. </p>
      <p>To me the graphic looks rather odd, with the square leaf and the faded tree. When reduced small it becomes a strange-looking smudge that vaguely reminds me of an animal's snout. And the font doesn't seem like a good match for the feel of the graphic. </p>
      <p>Not trying to sound overly critical; the logo is a good first step but it just needs more work.</p>
      <p>Could you tell us more about the group? What age group? What will they be doing? What ideas should the logo represent?</p>
