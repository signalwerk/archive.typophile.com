      <p>&gt; The Organization focuses on providing wildlife<br>
      &gt; and conservation education to school and<br>
      &gt; college students in India...</p>
      <p>Thanks for the additional info, Chander. My suggestion would be to see if you could incorporate the 2 concepts of education and conservation in the logo. For example, taking the tree image you already have (or something similar) and putting it inside the icon of an open book. Or combine somehow the image a leaf (preferably in its natural shape rather than square) and with the image of a teacher. Or any other combination that combines the 2 ideas of education and conservation.</p>
      <p>As for the type, the current font just looks a little gimmicky to me. I'd suggest trying a more traditional font, something with a friendly and approachable look.</p>
