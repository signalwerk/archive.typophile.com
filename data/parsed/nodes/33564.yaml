    <p>I was following some typography links that I had saved years before, when I ran into a dead-end at the long defunct but always spectacular <a href="http://linesandsplines.com" title="http://linesandsplines.com">http://linesandsplines.com</a>. Did anybody out there save an archive of the site?</p>
    <p>I'd be indebted forever to anyone who did. By that I mean I'll get you something nice at Veer or something.</p>
    <p>Enrico</p>
