  - id: 247652
    user: 14529
    date: 2007-12-19T19:59:00
    date_raw: 19.Dec.2007 7.59pm
    votes: null
    html: <p>For best legibility, stay with serif. The best legibility at 9pt, in my experience, is ITC Stone Serif with oldstyle figures (available from ITC, not Adobe). Also, Sabon, though its x-height is not as big. Stone Serif is a stupendous three-weight workhorse that is not over-exposed. Also, look at Freight Serif, Bitstream Arrus, Celeste, Haarlemmer, Stempel Garamond, and Warnock.</p>
