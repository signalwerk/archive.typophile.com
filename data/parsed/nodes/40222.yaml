    <p>Hi<br>
    I have a new project in hands with a huge amount of information and a limit number of pages...  so I’m looking for a economical  and contemporany font with a very good legibility in small sizes [8, 9 pts].... well ... can anyone help me with some suggestions??<br>
    Thanks!</p>
