      <p>If the text is for extended reading I don’t think a sans, even an excellent one like Whitney will be as readable as a good serif. Fedra Serif, for example, would be a good candidate for small sizes. </p>
      <p>If this is a reference like a dictionary or timetable, where one is looking up specific information, and only reading a short bit of it, then a sans may be OK.</p>
