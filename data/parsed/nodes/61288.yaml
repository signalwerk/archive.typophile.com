    <p>Hello!</p>
    <p>I'm looking for a little feedback on a font I recently designed; Elken - a black, solid, display face with a stencil-type structure. (I didn't set out to create a stencil font, it happened by itself?)</p>
    <p>Specifically, I know there are many problems with the spacing/kerning, and I have issues with c, g, s and t. I'd love to hear any comments or criticism... As it is my first font, I have much to learn.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/elken_3865.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/r_5444.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/elkend_6625.jpg"></div><p></p>
