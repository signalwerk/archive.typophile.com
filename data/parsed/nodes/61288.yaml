      <p>Could you share with us the concept, thinking behind this typeface?<br>
      I like the look of it. Look very industrial, like metal screw.</p>
      <p>a, c and u look similar, just different width. What if you eliminate the top right serif of letter a. what is wrong with g ? s might look like o, but the diagonal cut help define it, try to experience with other shape instead of circle. t is different because it is 1 shape, unlike the other have 2 shapes.</p>
      <p>I can't read the word elken, thought it was ellren. Maybe because the kerning and letterspacing is the same. </p>
      <p>Small l look like uppercase I.</p>
      <p>What do you think about r.</p>
      <p>x and z has the same shape, but different cut.</p>
