    html: |-
      <p>hi! thanks for your comments... I haven't had time to look back at my work since posting this, and now things seem to be a little clearer..</p>
      <p>the letter shapes grew out of some abstract-y sketching of mine based on the systematic/organic shapes of elk antlers - then I was looking at creating letters out of a modular sort of version of those shapes. but the final forms did turn out to be relatively.. hm.. cold, compared to the original scribbles.</p>
      <p>I had a look at jenson; thats quite an unusual feature... haven't seen that before?</p>
      <p>yes, the spacing is tricky - the letterforms themselves actually prevent the spacing from working out effectively. I'm thinking maybe a little bit of a redesign might be in order..</p>
