      <p>What Hrant said. Other considerations when using system and application fonts for any kind of commercial work include, whether the license covers you for everything you want to do, e.g., </p>
      <p><a href="http://www.microsoft.com/typography/RedistributionFAQ.mspx" title="http://www.microsoft.com/typography/RedistributionFAQ.mspx">http://www.microsoft.com/typography/RedistributionFAQ.mspx</a></p>
      <p>...and versioning. If you are running more than one operating system, more than one version of an operating system (Windows XP and Windows 8 for example) or have any other peculiarities in your computer set up then you may find that people have different versions of the same fonts installed which can cause problems when sharing documents, templates, etc...</p>
