      <p>A site license for hundreds of users is not ridiculous, but it can indeed get expensive; you have to contact the foundry and negotiate. However if you're picky about your visual identity you shouldn't go for a free solution (whether it's bundled in the OS or simply a font that's free to use*) mostly because everybody and their mother can do that too, but also because of quality issues (although OS fonts are rock solid).</p>
      <p>* Although some of those put limits in terms of commercial use.</p>
      <p>One interesting solution that some companies go for is the commissioning of a custom design. One drawback to that is that you have to wait for it to be completed, but the advantages are: it can actually cost less than a large site license for an existing prestigious typeface; and you own the results, so it's 100% exclusive to you (and you can even <em>sell</em> the font yourself).</p>
      <p>hhp</p>
