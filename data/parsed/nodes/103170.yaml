    html: <p>You can often use the foundry’s or reseller’s website to quickly find out how much a site licence would cost. For example, on MyFonts, add the fonts you want to your shopping cart, then change the number of users to the required number. You’ll get a revised price that you can use to help you make your decision.</p>
