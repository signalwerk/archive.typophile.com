    <p>I think our first-choice is Futura, which I know is not free. How would we go about getting a license to cover 400 people? (And is that ridiculous?) Are there site licenses for font? Alternatively, if we went with a font that seems to be installed on most of our standard-issue PCs (Gill Sans etc) would we need some kind of additional licensing or is that free to use? We are based in London if that makes any difference to the legalities.</p>
