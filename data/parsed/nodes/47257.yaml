      <p>It looks like the <a href="http://www.tdc.org/">Type Directors Club</a> will be closed during August.</p>
      <p>But there is also the New York <a href="http://www.centerforbookarts.org/">Center for Book Arts</a>.</p>
      <p>Both the <a href="http://www.aigany.org/">AIGA</a> and the <a href="http://www.adcglobal.org/">Art Directors Club</a> usually have some type of exhibit on their premises.</p>
      <p>Don’t miss this great exhibition of three (yes, three) Gutenberg bibles at the <a href="http://www.themorgan.org/exhibitions/exhibition.asp?id=7">The Morgan Library &amp; Museum</a>.</p>
      <p>There is also the <a href="/wiki/Herb%252BLubalin%252BStudy%252BCenter%252Bof%252BDesign%252Band%252BTypography" class="wiki">Herb Lubalin Study Center of Design and Typography</a>, located within Cooper Union. It’s by appointment only, and they have a limited schedule during the summer, but it is <a href="http://www.underconsideration.com/speakup/archives/004949.html">worth it</a>!</p>
