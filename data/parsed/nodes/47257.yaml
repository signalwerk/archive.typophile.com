    <p>Hello.</p>
    <p>My first of (hopefully) many posts here at Typophile.</p>
    <p>Now, I’m travelling to New York City in mid-August and I was wondering if any of you know any good/interesting/educational typographic-related museums/locations/companies etc around that time. 18-26 of August to be more precise.</p>
    <p>Thank you.</p>
