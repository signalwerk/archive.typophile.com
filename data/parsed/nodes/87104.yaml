  html: |-
    <p>We are proud to release a new Arabic Font “Maghrebi Djadid”, designed by our colleague Djadeli Zein Alabedeen (Algeria) in 2009.</p>
    <p>Maghrebi Djadid find its inspirations from the pure traditional heritage of the Arabic script in North Africa. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OTFmaghribiDjadid-Specimen_Page_1_3893.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OTFmaghribiDjadid-Specimen_Page_3_3723.jpg"></div><p></p>
    <p>Technical info:<br>
    Name: Djadli_MaghrebiDjadid<br>
    Format: ttf</p>
    <p>This font is free for the non-commercial use. If you would like to license it for any commercial use, please contact the designer: aratypo [@at] gmail . com</p>
    <p>Link: <a href="http://www.mediafire.com/?0bcztb2c9arzdso" title="http://www.mediafire.com/?0bcztb2c9arzdso">http://www.mediafire.com/?0bcztb2c9arzdso</a></p>
    <p>================================================<br>
    This release is to wish you a Happy Eid al-ADHA. </p>
    <p>May Allah bring you all the happiness and joy you wish for during these blessed times.</p>
