    <p>I have a new OpenType font I'm working on and when I try to load it into Word X, it shows it in the menu, BUT when you click on it it switches to the font next to it in the list instead and refuses to make it work.</p>
    <p>The font works perfectly in Adobe programs and in TextEdit (I'm using Mac OS X).</p>
    <p>I have heard many people have problems with Microsoft programs loading various fonts, but I would like to sell this font sometime soon and don't want to have to tell anyone that it doesn't work in some Microsoft programs. </p>
    <p>So far I have only heard people saying a font of theirs doesn't show up in the menu because they have the wrong printer drivers installed, but this is something different than that because it does show up in the menu - it just doesn't work!</p>
    <p>Anyone know something I could try?</p>
    <p>THANX</p>
