      <p>The probable causes are too numerous to mention. To get a baseline, uninstall your problem font, then generate and install a TTF version, and see if you have the same problem.</p>
      <p>Edit: I just read your previous post. What are you "trying" when you attempt to generate a TTF? Did you use the Tools &gt; Quick Test as &gt; TrueType font?</p>
