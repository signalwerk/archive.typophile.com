      <p>Sorry for getting back to this post so late. I forgot about it after I found a solution.</p>
      <p>I HAVE FOUND THE SOLUTION! I threw away the Microsoft Word Font Preferences file on my mac, and then it loaded into Word just fine! It was that corrupted font preferences file that was causing it. A very important lesson to all!</p>
      <p>Thanks Dunwich. I will use this advice if I ever have a similar problem in the future. I never heard of the FontQA macro before. I will definitely try that next time I have a problem. Never heard of Microsoft’s font validator either. Great advice! Thank you. I use Fontbook a lot but I almost forgot about it's validation abilities. Great idea. And I'll take what it says with a grain of salt if it's buggy.</p>
      <p>BTW:</p>
      <p>oldnick - I just updated that post. Basically, I have decided that I must not be converting the right thing to truetype first, before generating. I'm working in opentype right now, and when I'm ready I'll convert instructions, contours, and hints to truetype and try it again. Then I will report the results.</p>
      <p>I have never tried the Quick Test before.</p>
