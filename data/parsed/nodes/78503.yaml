    html: |-
      <p>Step 1: Open up your generated font, open the glyph window, enable FontAudit, and step through the glyphs one-by-one looking for any serious outline problems<br>
      Step 2: Download and run the FontQA macro. Run it and review the results. Fix the problems.<br>
      Step 3: Download and run Microsoft’s font validator. Run it and review the results. Fix the problems.'<br>
      Step 4: Validate the font with Apple’s FontBook tool. But be careful, FontBook is a buggy POS and problems it flags might not actually be problems.</p>
