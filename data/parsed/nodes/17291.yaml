      <p>Just a little design history.</p>
      <p>My source told me that John Downer did the last version the now defunct logo. </p>
      <p><cite>"My main objective, back in 1991-1992, when I was<br>
      working in SF, was to center the v in "Chevron" and<br>
      I nearly accomplished it to my own satisfaction. It<br>
      was just a tad off, due to the fact that C has to be<br>
      wider than r. In short, the h matches the width of<br>
      the n; and the e matches the width of the o. The<br>
      balancing act is definitely not a merit of the new<br>
      incarnation. Its symmetry is rather poor, in fact."<br>
      </cite></p>
      <p>It is nice to here such effort being put into something. He was their signage consultant for a while as well.</p>
      <p>I can see that the new Chevron logo is softer, but if the goal was to move away from military-like ribbons, I think they didn't quite make it. Anyway, it is the type that disturbs me the most I think.</p>
