      <p>Someone I went to school with told me this story: Every time she would tell her mother about her ideas for her (graphic design) thesis project her mother would say, "But that doesn't have anything to do with computers!"<br>
      All of this faux-3D rebranding makes me think that maybe it really is all about computers. It's depressing because it means we're that much closer to being replaced by monkies. Monkies who happen to be marginally trained in Photoshop, but monkies nonetheless. Maybe we lost some sort of vote and the computer kids won. So here's my personal rebrand slogan: graphic design = computers.<br>
      That type is pretty lame. Not just by itself, but in the context of being on every other street corner in North America. What are they afraid of? Why does it have to be so wimpy and non-descript? I mean, I know why it is (blasted focus groups!), but why does it HAVE to be?</p>
