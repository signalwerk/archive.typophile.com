      <p>It looks like a lame stab at trying to spruce up a well established branding. Why not just slap a leaf on it like all the other companies?</p>
      <p>The gradients are hurting my eyes, and keep sending my eyeballs off in a different direction.</p>
      <p>In fact, at first, I didn't even notice they used some lame stock font and altered it (ever so slightly).</p>
      <p>The C and h look ridiculous together and the r and n aren't my favorite either.</p>
      <p>I think I'm going to be sick.</p>
      <p>- Yokimato</p>
