      <p>The cap C in the new logo looks a bit too tall, but that's besides the point.</p>
      <p>I'm no great fan of either logo, but the rebrand ticks all the right boxes that oskerlin notes. Despite your dislike of trademark rebrands of today (swooshes, gradients, cuddly aesthetics), it is certainly a contemporary corporate badge. As designers at the point where this bullshit is spun, it is all very transparent to us. No doubt this was consumer-tested to the hilt, and I'm sure regular folk (not us higher people) would have given it their thumbs up. I think it's a clever, but nonetheless frighteningly successful rebrand.</p>
