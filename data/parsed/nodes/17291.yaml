      <p>From what Oskar wrote, (in the post linked in the original post here), I'd say that Chevron went with the simplest, safest design change. They're clearly trying to soften their image and that visual link with ribbons is a single-move way to turn the militaristic echelons into softer friendly forms. They're succumbing to every new trendy logo rework technique, which is a shame, but they're actually sticking very close to their original image, which is rare.</p>
      <p>I've seen some other companies ignore their brand's heritage in ways I believe hurt their image. However, in this case, I think Chevron would've benefitted from a BP-style (Oh, I'm sorry. 'bp-style') redesign/rebrand. I think they should break more of the fetters to their old look if their old image is so problematic and static. BP did this very boldly and very successfully. They really do seem much more committed to the shift of 'oil company to energy company' than most (they <em>seem</em> much more committed). Though, I have yet to see Chevron's new campaign, which may help reinforce the message of change.</p>
      <p>I don't really like the type Chevron chose, as it's kind of a say-nothing face in today's context, but I have no doubt it's what they wanted. All-in-all I'd say it's a safe and logical move, even if it's not a stellar logo. I don't think the logo is really going to be their biggest issue in trying to alter their image in the minds of their customers, but that's partially their own fault. Again, bp did a great job of designing a flagship logo to spearhead their philosophical image shift.</p>
