    <p>Hi,</p>
    <p>I am looking for a free font similar to www.letterheadfonts.com's Fire House font (or any kind of free firetruck font). I am making a sign for a coworker for a fundraising event for her volunteer work in San Carlos, Costa Rica. I don't have a budget for this. Otherwise, I'd buy Fire House. Thanks!</p>
    <p><a href="http://www.letterheadfonts.com/fonts/firehouse.shtml" title="http://www.letterheadfonts.com/fonts/firehouse.shtml">http://www.letterheadfonts.com/fonts/firehouse.shtml</a></p>
    <p>Josh</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/firehousecharacters_3542.gif"></div><p></p>
