    html: |-
      <p>Looks like you're after a Circus-style wood block type here, also (as has been said) called Western.  There are lots of shareware, free (0$) and commercial fonts in this genre. Adobe Wood Types are probably even cheaper than $30, it's the cost of a pair of socks.  My system seems to have several, probably that came with some software; it can be hard to keep track, sometimes.</p>
      <p>A couple of links:<br>
      <a href="http://simplythebest.net/fonts/western_fonts.html" rel="nofollow">http://simplythebest.net/fonts/western_fonts.html</a><br>
      <a href="http://www.1001fonts.com/fonts_overview.html?page=1&amp;category_id=28" title="http://www.1001fonts.com/fonts_overview.html?page=1&amp;category_id=28">http://www.1001fonts.com/fonts_overview.html?page=1&amp;category_id=28</a></p>
      <p>Liam</p>
