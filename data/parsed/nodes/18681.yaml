    <p>Hello there, I’m entering a competition to design<br>
    a logo for the hong kong design institute and<br>
    this is what i’ve come up with at the moment. </p>
    <p></p><div class="imageWrap"><img src="files/HKDI.png"></div><p></p>
    <p>Havin a bit of trouble with the ‘D’ &amp; ‘I’ cos they<br>
    don’t take up the same amount of space as the ‘H’&amp;’K’.</p>
    <p>Any suggestions would be appreciated, cheers.</p>
    <p>I probably shouldn’t be giving myself the added<br>
    competition but the website is http://www.hkdilogo.edu.hk/<br>
    should anyone wish to enter it themselves.</p>
    <p>Graham</p>
