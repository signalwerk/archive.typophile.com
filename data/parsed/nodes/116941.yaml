    html: <p>You might try greatly stretching <a href="http://www.myfonts.com/fonts/woodentypefonts/antique-tuscan-8/" target="_blank" rel="nofollow">Antique Tuscan 8</a> or <a href="http://www.myfonts.com/search/mesquite/fonts/" target="_blank" rel="nofollow">Mesquite or High Noon</a>. The latter has the advantage of an added lowercase. All are versions of an 1800's antique tuscan think the original was by William H. Page, 1859.</p>
