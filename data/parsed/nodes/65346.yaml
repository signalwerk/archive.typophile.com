      <p>Yes, I think that would often be found in the styles I suggested searching for. The way the terminals split is one characteristic of the Tuscan styles, which you might also find with the other search terms. Solotype, HiH and a few other foundries, seem to specialize in more antique styles from the late 19th century. That is the time period I think you want to look at.</p>
      <p>- Mike Yanega</p>
