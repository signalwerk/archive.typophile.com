      <p>The Bujardet Freres font is not the same as your sample. See the R -- it's not the same. [edit: neither is the N] I Looked in the Solotype Catalog since often these revivals can be found there, and the closest I saw was one called Tuscan Dotted (p. 36), but it was not identical. The R did have a similar leg, unlike the Bujardet font. I think if you searched on Tuscan, or Victorian, or 1800s, you would probably see what's available in styles of this vintage.</p>
      <p>- Mike Yanega</p>
