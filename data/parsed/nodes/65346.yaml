    <p>Hello, I'm looking for a font similar to the attached gif below. I found a free one, Bujardet Freres. Obviously it is an automatically traced font simply imported in any font software. I would like to find a consistently designed type which follows the same structure of the pictured one. Now you experts, can you help me? I'd be very grateful for it.</p>
    <p>Daniele</p>
    <p>[IMG]http://i47.tinypic.com/2je1jps.gif[/IMG]</p>
