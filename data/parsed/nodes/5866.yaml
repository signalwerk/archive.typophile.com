    html: <p>AG, started it perhaps unknowingly.  Univers and Helvetica were big parts of the typography of the Swiss/German philosophy of the "neautral" typeface which lends only its clarity to the communication.  The typgraphers USE of the face was the area that brought the NON-detached or purposive/active message building.  If you look at the works of Emil Ruder and his many students, you will see the same neutral face used again and again but the way it is used is as active to the message and playful as could have been for the time. In the USA, where a far greater variety of faces were used, the construction of the typography was much simpler--even boring.  The Face was asked to do much more so it could not be neutral. <br>One difference is that the neutral faces have to be strong enough to take a beating (see Weingart or April Greiman's work). The not-nuetral faces rely on their own forms for expression and cannot handle the abuse of partial oblitteration and superimposition.  Later, the Emigre people put the oblitteration right into the typeface making it less versatile and requiring many more font purchases.  You must remember that the time and cost of creating a new typeface in the 50s was orders of magnitude greater than it has become in recent years. In prior times type setters had only a few faces.  Choice was minimal. Neutral/versatile faces made great sense.  Today, choice is overwhelming.  What you can't find ready-made, you can have designed by any of the Typophiles here (or other places too). <br> <br>It remains to be seen what we do with all this choice.  We live in an era of a typeface CostCo or Walmarts.  (You can get anything you want at the Typophile resturant--excepting Berthold:-) ). <br>Hopefully the typographers who use our type will be as innovative as the generation before us. <br> <br>ChrisL</p>
