    html: "<p>Hi everyone, I am new on this forum. I noticed FF Legato was mentioned so I took a look. The discussion about Helvetica is interesting. Helvetica is not bad and it has some mystery. <br> <br>I understand many graphic designers using it and I think I understand why it is having a revival and probably will be used a lot in the future. It has little to do with the fact that it is on every computer. Helvetica embodies the concept of both our alphabet and our (current) culture very well: rational, simple, separate shapes (I mean more than Gill Sans for example)  to express an idea as a whole, with distance).  <br> <br>Helvetica is quite sophisticated but not too much, opposed to Univers being very sophisticated, for many purposes too much. Helvetica is �cool�, That�s how you anglo-saxons say it don�t you? �Cool� has a lot to do with �indifferent�. Univers is not indifferent, it is distinctive. Indifference is an attitude that belongs to our way of live, these days. Helvetica is �untouchable�, �inaccesible�. <br> <br>That must be why it is so hard to find a serifed type that fits with it because all serifed typefaces give so much expression to the human touch as the origin/basis of their shapes. <br> <br>Why do you anglo-saxons (and now the rest of the world too) use the word �cool� when you like something very much?</p>"
