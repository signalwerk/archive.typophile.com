    html: "<p>sorry to have posted my message 4 times; I got some error response from the server after having it posted. <br> <br>Hrants's remark that Helvetica is 'old' is just not true ottherwise it would never be used the way it is, for example in the Vodaphone*(see attached image) corporate id and campaign (targetted very much at young people). I do not believe such marketing/advertisement people make mistakes at this level. <br> <br>There is something else quite mysterious about Helvetica. It is \"neutral\" here is the definition I found at the internet dictionary: <br> <br>Not engaged on either side; not taking part with or assisting either of two or more contending parties; neuter (=neither the one thing nor the other; on neither side; impartial; neutral) ; indifferent. <br> <br>Very good descriptions!  These properties can, in certain circumstances, be 'good' for type because although type carries a message, it does not necessarily has to express this message by itself. Invisible typography. Even in a design like Vodaphone this is one of several aspects I think. <br> <br>A word that is not mentioned is \"detached\". McLuhan uses this term: \"Oral cultures act and react simultaneously, whereas the capacity to act without reacting, without involvement, is the special gift of �detached� literate man.\" [...] \"literate or visual man creates an environment that is strongly fragmented, individualistic, explicit, logical, specialized and detached.\" [...] <br>(You can download the McLuhan interview published in Playboy in the sixties on my website <a href=\"http://www.evertbloemsma.nl\" target=\"_blank\">www.evertbloemsma.nl</a>)</p>"
