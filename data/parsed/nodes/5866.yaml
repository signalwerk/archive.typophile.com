    html: "<p>Helvetica is neutral as a prostitute can be. <br>Helvetica is a wonderful typeface to my eyes, <br>but it is like the ritual of the tobacco-pipe, <br>I love that ritual but I don't think it fits <br>to me now. Maybe one day, on the rocking chair. <br>Mr. Evert Bloemsma, why the name \"Cocon\"? <br>\"Cool\" in Italian is not a common word: <br>to mean something \"cool\" we say \"figo\" <br>which is the male of \"figa\", from \"fico\", <br>the fig fruit; \"figa\" means \"pussy\", \"haar spel\". <br>Best, <br>AS</p>"
