    html: "<p>Personally, I do respect your \"design intent\", but not the actual choice of Helvetica for text. In the same way that tree bark does not make a good meal. Tree bark is great, and good for a lot of things, but not for human nutrition. <br> <br>Fonts (especially for text) have much more than relative merit depending on use. They can have a bad \"g\", they can be poorly spaced, they can have lousy vertical proportions, ad infinitum. It's not just a matter of fashion. <br> <br>As for the print/online duality: <br>1) Most Helvetica lovers hate Arial. I myself think the latter is less bad. <br>2) There's a limit to how \"real\" WYSIWYG is anyway. The only way to make Helvetica/Arial look remotely (and never totally) like Helvetica/Arial onscreen is to use full anti-aliasing, and that makes small text excruciatingly blurry. And if you go for 1-bit rendering of Arial (Helvetica's sucks) then it's really not at all the same font in practice anyway. In that case I might use Arial for the screen and Unica for print. <br> <br>-- <br> <br>If you're here for typographic advice, please keep an open mind - we debunk a lot of crap around here. <br>If you just want to hear other graphic designer chant \"Helvetica is cool\", try AIGA or something.  :-) <br> <br>hhp <br></p>"
    html_clean: "<p>Personally, I do respect your \"design intent\", but not the actual choice of Helvetica for text. In the same way that tree bark does not make a good meal. Tree bark is great, and good for a lot of things, but not for human nutrition. <br> <br>Fonts (especially for text) have much more than relative merit depending on use. They can have a bad \"g\", they can be poorly spaced, they can have lousy vertical proportions, ad infinitum. It's not just a matter of fashion. <br> <br>As for the print/online duality: <br>1) Most Helvetica lovers hate Arial. I myself think the latter is less bad. <br>2) There's a limit to how \"real\" WYSIWYG is anyway. The only way to make Helvetica/Arial look remotely (and never totally) like Helvetica/Arial onscreen is to use full anti-aliasing, and that makes small text excruciatingly blurry. And if you go for 1-bit rendering of Arial (Helvetica's sucks) then it's really not at all the same font in practice anyway. In that case I might use Arial for the screen and Unica for print. <br> <br>-- <br> <br>If you're here for typographic advice, please keep an open mind - we debunk a lot of crap around here. <br>If you just want to hear other graphic designer chant \"Helvetica is cool\", try AIGA or something.  :-) <br> <br>hhp <br></p>"
