    html: <p>Helvetica looks best by itself, preferably in a tidy modernist grid. That is how it was intended to be used, and when paired with a serif face it never looks quite right. Also, Helvetica and her clones/emulants are so ubiquitous on personal computers, that it runs the risk of looking like a default or generic option, unless it is clearly used with great deliberation. <br> <br>I used to dislike Helvetica, but having worked on the new Helvetica Linotype version I've developed a grudging respect for it.</p>
