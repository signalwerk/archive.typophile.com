    html: <p>Paul, I agree that sans text tends to slow you down, and is never suitable for long text. Still, short text can work quite well sometimes. <br> <br>But the more readable sans are generally humanist, based on the oval rather than the circle. I think there is a problem with spacing in the more geometrical ones - the space between letters is too small compared to the counters. So, for example, Meta is much more readable than Helvetica in text. I think Unger's Vesta is one of the more readable ones.  <br> <br>I'm not sure whether the the theory of Bloesma is really born out by FF Legato, but It is interesting. I'd like to look at it. Thanks for flagging it, Hrant.  <br> <br>Ok, this is one of my pet peeves, but I think Helvetica in printed text is not a mistake but a crime <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
