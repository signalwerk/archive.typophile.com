    html: <p>Vodafone actually use Helvetica Narrow* as their main corporate font. <br>*they keep swapping with Neue Helvetica 57. <br>Orange Telecom also use Neue Helvetica as their corporate font, although at the uncondensed width, and with 25 or 35 as a display. <br><a href="http://www.orange.com/english/default.asp?bhcp=1" target="_blank">http://www.orange.com/english/default.asp?bhcp=1</a> <br>Presumably/hopefully they were chosen not as a reaction to each other, but as a style-statement (excuse the marketingspeak).  Are they really considered hi-tech/modern looks or even cool by the target market? This is a subjective decision made by designers who are outside the target age range. Apart from the overuse of the font I do not have a particular aversion to well-used Helvetica. <br>Tim</p>
