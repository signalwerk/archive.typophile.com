    html: <p>Helvetica is no more an idea than Univers or AG.  If anything, Univers qualifies much more as an idea.  It is the first typeface to truly encompass the "idea" of family. Look at Fruiger's original display from the late 50s where he shows the joined family of weights and widths in a perfect progression with a logical numbering system to boot.   <br>Frutiger's "idea" was to create a typeface with the possibility of UNIVERSal use. <br>Helvetica came out at about the same time but IMHO failed miserably at making a better, more homogenous AG. <br>Don't confuse popularity with ideology.  If Univers or Franklin Gothic had been bundled with every computer on the planet instead of Helvetica, there would have been no "Helvidea" <br> <br>You might also read Bodoni's book. If there is a typeface which might be spawned from an idea, Bodoni is more it than any.  Another is Futura or any of the constructivist fonts. <br> <br>The truth is, Hrant is right, they are all just typefaces. <br> <br>ChrisL</p>
