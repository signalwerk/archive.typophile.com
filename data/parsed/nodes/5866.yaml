    html: <p>Evert, Hello! A warm welcome to Typophile. Where Type is Loved. <br> <br>-- <br> <br>I think Helvetica was "indifferent" for a while, but now it looks a little old, like a famous actor in his 50s. And Univers looks like Barbarella. <br> <br>&gt; Why do you anglo-saxons (and now the rest of the world too) use the word "cool" <br> <br>Maybe it's a reaction against "hot", which was popular right before "cool" became popular?  :-) <br> <br>BTW, I think the <i>really</i> young people use "ice" now... <br> <br>hhp <br></p>
