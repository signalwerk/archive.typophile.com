    votes: null
    html: <p>You may be right, Karen. Here's a quickie attempt to simulate the sign with Folio Bold Condensed.  <br> <br><img src="http://www.typophile.com/forums/messages/83/39387.jpg" alt="esplanade"> <br> <br>I think the perspective and a little "squooshing" might account for the differences in weight, but the S and R are little rounder in your sample. And the middle stroke of the N is too light in Folio. <br> <br>The S looks like it was borrowed from Franklin Gothic, Knockout or some other 19th-Century sans. </p>
    html_clean: <p>You may be right, Karen. Here's a quickie attempt to simulate the sign with Folio Bold Condensed.  <br> <br><img src="http://www.typophile.com/forums/messages/83/39387.jpg" alt="esplanade"> <br> <br>I think the perspective and a little "squooshing" might account for the differences in weight, but the S and R are little rounder in your sample. And the middle stroke of the N is too light in Folio. <br> <br>The S looks like it was borrowed from Franklin Gothic, Knockout or some other 19th-Century sans. </p>
