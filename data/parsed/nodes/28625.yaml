      <p>I'm guessing that humanity here means that the company isn't presenting itself as a monolithic giant corporation, even if it is, but as a friendly approachable group, wheras uppercase can present the opposite.<br>
      So, for example, Company A is a financial institution, although it was founded last year it needs to represent itself as trustworthy and established with good business behaviour so it might use a serif font like Trajan (if it is unimaginative:), however, Company B is a computer company and needs to represent itself as hip and 21st century and so might go for Neo Sans all lowercase.<br>
      Although none of the above is true, because, simply by opting for the sans doesn't lend a logo hipness and Trajan will not by itself make a company responsible or established, the choice of colour, image, icon or the simple act of kerning the type properly can all add to the impression.<br>
      (A truely established company or a sufficiently hip company will not use a specific font but have their logo lettered.)<br>
      Tim<br>
      PS you might think about asking a moderator to move this to the Design forum where more people will look at it and refute everything I have written.</p>
