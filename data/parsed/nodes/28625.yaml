    <p>what does a serif type face represent in a logo? is it the fact that the company is well established? if so, how many decades/yrs does it have to be around for u to use serif fonts to represent its establishment? thankyou<br>
    ps is there specifically any rules for uppercase and lowercase being used in logos, i.e. lowwercase gives a sense of .... and uppercase reflects a certain aesthetic in the company. is tehre anything like that i should know about?</p>
