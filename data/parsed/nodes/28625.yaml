      <p>Hi allgiggles1984!</p>
      <p>I don't think that serif typeface represents well establishment by itself. Sans serif can do it too. </p>
      <p>If you look around you'll see many big companies, very well established :), wich brands and logos are made with sans serif, even scripts or hand-made fonts.</p>
      <p>Nowadays, many companies are changing its serif logos to sans serif ones, to "modernize", I think, its "graphic speech".</p>
      <p>Lowercase means certain flexibility, certain "humanity", if you know wath I mean. Uppercase it's like an ancient Roman column, unremovable. :)</p>
