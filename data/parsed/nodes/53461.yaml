    html: |-
      <p>I think that you have the potential for a really nice font.<br>
      The serifs feel optically too heavy compaired to the other strokes within the forms.<br>
      Most of the joints especially where a bowl meets an ascender are too heavy.<br>
      The tight radius curve on the ascender of your lowercase letters are a little broken (see Karen Cheng's book Designing Type on "the bone effect" to solve these issues.<br>
      My last comment is that the extension stroke on commas, etc. are too long.</p>
      <p>Great structure and good luck, I would like to see the finished result.</p>
