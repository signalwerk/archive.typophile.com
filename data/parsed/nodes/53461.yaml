      <p>Nice work. This looks really promising. I do think you should change UC letters to incorporate that curvy serif transition. Righ now it's just K and L that have it. LC is more consistent with it.</p>
      <p>Otherwise UC letters remind too much of some other typography.</p>
      <p>The same thing's with LC from v on. No distinction and not really looking like a part of the same family.</p>
      <p>But it may just be me.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
