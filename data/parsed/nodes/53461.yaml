  - id: 323059
    user: 41485
    date: 2009-01-16T14:13:00
    date_raw: 16 Jan 2009 — 2:13pm
    votes: null
    html: |-
      <p>Hi,</p>
      <p>Thanks for your thoughts on this!<br>
      A lot of the small kinks, and the like occured when I brought all of the glyphs into fontlab. I initially drew it in illustrator, and then brought it in, and as it wasn't drew on a correct grid, nodes got pulled around creating odd thicknesses etc. I'm currently going through it all and trying to tidy it all up.</p>
      <p>The overall idea for the face is taken from old typewriter fonts where the bowls of characters sometimes don't connect, so this little feature was taken as a major inspiration for the face. In characters like the v, w etc, I couldn't replicate this feature, so got a bit stuck. I'll see what I can come up with though!</p>
      <p>Thankyou everyone for your thoughts! Its always nice to get another pair of eyes on something that I've been looking at for a while.</p>
