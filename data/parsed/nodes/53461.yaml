    <p>Hi everyone,</p>
    <p>Long time watcher, first time register/poster here.<br>
    I'm currently working on a typeface that I designed for a mens boutique in Brighton, UK.</p>
    <p>It started off as a bold variant, but i've carried on as a regular weight.<br>
    The actual typeface generation (everything except the characters 'Peggs &amp; son.') were created for a two week uni project.</p>
    <p>I'm now working on it in fontlab studio. A lot of the metrics still need to be tweaked as well.</p>
    <p>Any criticism, pointers, help etc would be hugely grateful!</p>
    <p>Thanks<br>
    Edd</p>
