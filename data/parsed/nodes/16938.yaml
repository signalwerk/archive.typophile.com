    html: |-
      <p>If anything, you should consider the Typowiki as a growing resource for all things typographic and type related, and as a resource it should be accessible and understandable to visitors.</p>
      <p>Personally, I see no need for many sub-classifications, since for the most part, people involved with type are often multi-disciplined. How many time would you enter Hermann Zapf? Type designer, type educator, typographer, calligrapher, graphic designer (he has done it), husband, etc.?</p>
      <p>What I do see lacking in our "Designers" section are people who have made significant contributions to the futherment of type in aesthetics, education, scholarly-research, marketing, etc., yet have never designed an actual typeface.</p>
      <p>The majority of individuals listed in the "Designers" category are actual type designers, a few punchcutters, and a scattering of "typophiles" such as <a href="http://www.fontbureau.com/people/RogerBlack" target="new" rel="nofollow">Roger Black</a>, who I don't recall ever actually designed a typeface despite his incredible contribution to the world of type.</p>
      <p>Likewise, a person like Aaron Burns (I "Typowikied" him but can't find it) should be listed, but not under "Designers."</p>
      <p>So if anything, I see two basic and clear catergories:</p>
      <p>- <strong>Type Designers</strong><br>
      Individuals who have a typeface(s) attributed to their design, along with any other of their type related activities.</p>
      <p>and</p>
      <p>- <strong>Typophiles</strong> (for lack of a better all inclusive definition)<br>
      Which is for individuals who have NOT actually designed a typeface, but have made significant contributions to the world of type.</p>
      <p>Just my humble opinion.</p>
