      <p>I guess the point to me is, what are we using the listing for? I was thinking, if I want to find out who designs type, I would go to one list. If I want to find out who in in the type foundry business, I go to another list.  With their "one size fits all" thing, I would have to read every bio in the list.  If it works like a database, you can sort by or search by a field and have just those come up. You can also have multiple listings in the case of Zapf and others.<br>
