      <p>I think the question should be how the subcategories are handled. Obviously there would be a tremendous amount of duplication if there are separate sub-lists. If there were a method of tagging each entry with appropriate subcategories that would be preferable. I'm assuming there is / would be a way of searching so the user could make their own list, and allow for overlap in the search. I've been putting things in and haven't really used it for that yet. </p>
      <p>And there's the issue of who is using it. I find my students use Wiki a lot, but my colleagues don't. So I'm not in favor of anything that makes it harder for students to find things, but in favor of anything that makes it more informative.</p>
      <p>I also think the list should include everyone involved in type including authors, scholars, librarians, and archivists: Nicolette Gray, Robin Kinross, H.D.L. Vervliet, etc.</p>
      <p>I think the "Books" category should be more bibliographic.</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
