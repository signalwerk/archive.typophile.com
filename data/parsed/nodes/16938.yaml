    html: |-
      <p>May I suggest the following categories:</p>
      <ul>
      <li><strong>Creationists</strong> (in deference to Nick Shinn)<br>
      Those who conjure up type designs out of nothing, citing no precedents and recognizing no influences;</li>
      <li><strong>Intelligent Designers</strong><br>
      Those who posit that typeface design is far too complex a process to have happened accidentally, so <em>somebody</em> must have been responsible for the design (although <em>precisely</em> who may remain a matter of theological, philosophical or epistemological debate); and</li>
      <li><strong>Evolutionists</strong><br>
      Those who acknowledge the design contributions of type designers who came before them, and <em>adapt</em> those designs so that they live on in a new (digital) format (Paul Hunt's Bezier Wranglers?)</li>
      </ul>
      <p><em>Then</em>, we could get the courts involved, and let them determine which approach is the superior one...</p>
