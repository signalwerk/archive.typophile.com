      <p>I don't really know why designers may have liked Apple systems traditionally, but there are currently some substantial differences between how say, Mac OS 10.4 (Tiger) and WindowsXP handles type, in terms of programming interfaces available to developers. </p>
      <p>If you have a stomach for details, you may want to follow this link and examine (google!?) related documentation. </p>
      <p><a href="http://developer.apple.com/documentation/Cocoa/Typography-date.html" title="http://developer.apple.com/documentation/Cocoa/Typography-date.html">http://developer.apple.com/documentation/Cocoa/Typography-date.html</a></p>
      <p>Apple has made some significant commitments to including advanced OTF layout support in their basic text layout APIs. This is very cool. I   expect, Microsoft will include these features in the APIs used by Vista developers. </p>
      <p>As always, "the devil is in the details." It may be, and it may have been in the past, that Apple has made it easier for developers to add new typographical features in their applications. This doesn't mean that one platform is inherently better than another...</p>
