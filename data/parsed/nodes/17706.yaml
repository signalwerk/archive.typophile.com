      <p>Superkhy,</p>
      <p>Mac's used to be the only game in town for design programs. In the past decade, PC's have caught up and they offer the same programs.</p>
      <p>If you are a designer and you want to be inspired, then Mac's are the way to go. It's the difference between a Chevy Cavalier and a Honda S2000. You want to get where you are going with style. </p>
      <p>It's a subculture thing- sticking it to THE MAN (Bill Gates and the corporate world).</p>
      <p>I was raised on a Mac, but when I graduated college I had to go with PC because I was poor. I learned all I could about the PC's and built the best  system possible (it cost me $650, not including monitor). A Mac with the same speed and power would have been 3-times the money. To get around the aesthetics I purchased a metallic-silver case for my computer. </p>
      <p>As Grayson said, PC's aren't as user-friendly, but once you get over the hump they are good systems and much cheaper to buy and upgrade. There is also more options in the market for specific parts (for example: AMD vs Intel processors drives the price down and the competition makes the product better). </p>
      <p>For the most part, if you build PC's correctly you dont have problems. I have never had a system crash. I have had Mac's crash on me.</p>
      <p>There are easy ways around the PC inconveniences. If you have a strong anti-virus program and a router, you don't have to put much thought into computer protection. If you use Firefox you don't worry about pop-ups. If you run Spybot you don't worry about spyware. I don't know why you would be missing a DLL, but if you are you go to Google and type in the name and download a new one from the Microsoft website.</p>
      <p>I can now use all of the extra money I would spend on a Mac and buy fonts!!!</p>
