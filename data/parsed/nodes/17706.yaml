      <p>As for the debate, I work by choice on PC but teach on the Mac; the latter simply because the university still adheres to the "convention" that Macs are the designers' tool. Pisch. Nonsense.</p>
      <p>That said, the war became meaningless for me as soon as the two platforms found enough common ground for me to work on my PC with CS and OT fonts and transfer files to my clients' Mac environment.</p>
      <p>And, seriously, are people still using the "Macs are more stylish" bit? Really? I mean, <a href="http://breakingnewsblog.com/laptop/wp-content/apple-powerbook-15inch.jpg" target="_blank" rel="nofollow">PowerBooks</a>, OK, I'll give you that. Sleek and smooth. But iMacs? Really? While the latest models are only moderately goofy, the last couple of models (<a href="http://www.analitica.com/bitblioteca/img/imac.jpg" target="_blank" rel="nofollow">1</a>,<a href="http://serbocroate.free.fr/Images/iMac.jpg" target="_blank" rel="nofollow">2</a>)were embarrassing.</p>
