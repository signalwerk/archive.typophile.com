      <p><em>why Apple?</em></p>
      <p>Generally, I think there are big 3 reasons:</p>
      <ol>
      <li>Inertia: it's been that way for so long (remember when Apple was a market leader?), so new designers follow suit.</li>
      <li>Total design: Apple's tight control over all aspects allows for more a integrated design and consistency, which appeals to our mindset.</li>
      <li>Industry: because of the above 2 reasons, I still encounter vendors, printers, publications that are Mac-only shops.</li>
      </ol>
      <p>For me personally, I have experience on both Windows (since Win 95) and vastly prefer Apple's OS. Particularly OS X. My wife, former Windows-only user and non-tech lover, now agrees completely since she was forced to use our old G4 for a web project for a month. I build my own PCs, and they're much better for gaming and cheaper to build, but that flexibility and backwards compatibility comes with much greater complexity. Apple's stuff certainly has faults and the hardware still crashes, but I find 95% of what I do on the Mac is easier to do than on a PC, without removing any of my ability to dig into the complexity if I choose to.</p>
      <p>Also, it's not hip to like Microsoft and Bill Gates, and Jobs wears black turtlenecks.</p>
