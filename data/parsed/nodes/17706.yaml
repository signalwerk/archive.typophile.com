      <p>My personal machine at home is a custom Windows box. I use both Macs and Windows machines, but prefer Windows for the technical flexibility and level of control it allows. Even so I don't find it neccessary to say bad things about the Mac, yet it amazes me the way certain kinds of Mac users still habitually poo-poo Windows*, and worse---Windows users. C'mon. Its unwise to judge a book by its cover.</p>
      <p>* this is due in part to the old, now-debunked myth that Microsoft copied Apple's interface. Not true. Both Windows and the Mac OS were designed by the researchers who developed all that stuff at Xerox Palo Alto Research Labs back in the early 19080's. Some of those people went to work for Apple and some went to Microsoft.</p>
      <p><em>My biggest problem with Macs though are their users.</em></p>
      <p>This is what I'm on about :^)</p>
      <p>Both Win and Mac crash. <em>All</em> computers crash, minis, palmtops, notebooks, mainframes, AS400's, you name it. Windows machines tend to have more compatability problems than Macs because the hardware components come from different manufacturers. I'm fortunate in being technical enuff to firgure out how to put my own PC hardware together, and that has allowed me to find the right combination that works perfectly with Windows 2000. With all the Win 2K service packs installed my Windows box rarely crashes---about once every 2 months. Seriously. It is possible, but you have to get the hadware exactly right. I've tried Win XP and found Win 2000 more stable and reliable, and less resource-hungry, so it runs faster on the same hardware.</p>
      <p>Macs are an easier choice because hardware compatibility and glitches generally are not an issue.</p>
      <p><em>Macs “just do what you want them to do and get out of the way”</em></p>
      <p>Some people want and need that, others are more technically-minded and want more involvement, and benefit from it.</p>
      <p><em>There is so much bullshit in Windows that is totally foreign to Mac users.</em></p>
      <p>Stop painting it black.  Windows offers more options and ways of making the same things happen, the same functionality served up six different ways. It isn't bullshit, just different. That stuff is only foreign to Mac users who aren't familiar with Windows.</p>
      <p><em>I don’t know how I put up with all the hardware problems, the virus problems, the crashes...</em></p>
      <p>You got saddled with a bad machine. I don't have virus problems, hardware problems or frequent crashes.</p>
      <p><em>...the horrible interfaces, the convoluted settings and preferences and the missing DLL’s. The spyware, the aliased-ugly-as-hell text, the horribly hideous and unpolished aesthetics. Windows XP is just no where near as good as OS 10.1, 10.2 , .3, and .4.</em></p>
      <p>Don't you think you're overstating it? I agree Windows is more complex, and the interface is geeky non-design, but I can live with that because the rest of it makes more sense to me than Mac OS's.</p>
      <p>Note: so far I haven't tried to denigrate the Mac OSX interface by saying, "That jelly stuff is a wank." I only mention that now because I do see it that way, but I make a point of not saying so publicly. That would be insulting to Mac users.</p>
      <p><em>Also, seriously - aliased text is so ------- horrible</em></p>
      <p>You mean text rendered without aliasing? Things have changed a lot since you last looked (guessing). Anti-aliased text rendering has been standard in Windows since 2000. You could get for Win 98 too with a free utility.</p>
      <p><em>Seriously though, PCs and Macs will preform about the same when similarly configured. Either would be fine for design.</em></p>
      <p>Exactly.</p>
      <p><em>Macs are so sexy though, and you know how designers are with their well thought out and sexy fashion, furnishings, and accessories.</em></p>
      <p>Definitely. A tradition for fine arts artists has always been The Art of Living. You make your life an ongoing work of art. The money I save by buying PCs instead of Macs I spend on antique furniture, which means more to me than a stupid computer. Computers are only tools, and they grow old so fast we replace them often, so spending top dollar on them seems pointless. </p>
      <p>No offense, and best reagards to all,<br>
      j a m e s</p>
