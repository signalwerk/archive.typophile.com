      <p><em>There is so much bullshit in Windows that is totally foreign to Mac users.</em></p>
      <p>And so much bullshit on a Mac that is totally foreign to Windows users. And don't get me started about that alien Linux stuff. :)</p>
      <p>But I'm a font developer, not a graphic designer, and I use Windows because it is simply a better platform for font development and testing: there are more tools available on this platform for doing my job. I've known a lot of graphic designers who are Windows users, often despite being trained on Macs in design school. Often, they switched to Windows when starting their own studios simply because the hardware was so much cheaper. Sometime in the mid-90s, Adobe's sales of Windows versions of their design software overtook their traditionally stronger Mac sales, and from the workflow perspective there seems to be very little to distinguish the two platforms for design work.</p>
      <p>Microsoft's commitment to internationalisation seems far more impressive than Apple's. Given that internationalisation is just about the only growth sector in the font market, this is very important to me. Apple, kind of bizarrely, was one of the first companies involved in the early years of Unicode, and yet they only recently got around to supporting Unicode in a reasonable way. And then there's that AAT font format, which is difficult to develop for -- sometimes prohibitively so -- and is only supported in a small number of applications on this platform with such a tiny share of the global computing market.</p>
      <p>Yes, the Apple hardware is good, but then it should be at that price. High-end Wintel hardware is good too. There's a lot of cheap and less good Wintel hardware around, though, built with lower quality components, so a lot of the bad reputation comes from this. If Apple had licensed clone manufacturing, as they nearly did just before Job's return, then you would have seen the same kind of quality divergence in machines running Mac OS.</p>
