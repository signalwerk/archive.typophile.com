      <p>In terms of getting your hands dirty on a Mac open the Terminal.app it's a BASH shell by default but other shells can be installed. With Automator you can easily build mini apps or enhancements using even the shell commands. That's how I attach PGP signatures to files, crunch PNG files and generally move my files around with my Automator based workflow app - one leg on my webserver, the other on my local machine.</p>
      <p>Nowadays I have a lot of applications running in the X11 environment working seamlessly together with Cocoa apps. </p>
      <p>Since I found a neat way to get screenshots from all the web browsers out there I don't have a need anymore for the Windows laptop I used to have on the side - so glad I could get rid of it.</p>
      <p>When there's an app that I need but can't find on VersionTracker in most cases I'm able to create it myself using Xcode and Interface Builder, in the tougher cases I'll hand it off to an external guy of-course.</p>
      <p>Reading a bit into bindings you can do most stuff without really coding much.</p>
      <p>The biggest down-point of Windows is visible when turning you brand new laptop on for the first time after the installation: Either 1bit bitmap font display or the rainbow bride method, no nice and smooth font rendering like on OS X. I really feel sorry for Windows users at that point.</p>
