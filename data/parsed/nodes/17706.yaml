      <p>Why? Tradition, mainly. They were the first to have a viable desktop publishing/design platform and people stuck with it. Graphic designers tend to go with the flow much more then venture out to new territory in the land of technology. ;o)</p>
      <p>These days, you can do pretty much anything on a Mac or a Windows box (and slowly, on linux, though that's defintely a few years off...)</p>
      <p>However, Apple is a design company first and foremost. They sell design, and, as such, there's an obvious appeal to anyone that works tangentally or in design fields.</p>
      <p>In terms of their laptops, personally, dollar for dollar, I haven't found a better product out there. So, from a purely hardware standpoint, that's where Apple can shine.</p>
      <p>In terms of web development, there are typically two general camps...MS folks (ASP, .net, etc.) and open source folks (PHP, MySQL, etc.)</p>
      <p>OSX appeals to the open source folks as it is *nix underneath so you can easily run apache, PHP, etc on it. Not that you can't do that on Windows, it's just not quite as nice (and not the typical Web host set up, either).</p>
      <p>Going into the future...now that Apple is producing intel machines, the hope for many is that Apple or another 3rd party will be able to run a windows emulation mode at the OS level. In otherwords, the eventual hope is that some day, we could install an EXE file on OSX, and run it in its own window along side all of our mac software. A developers dream. ;o)</p>
      <p>And, finally, have you seen Vista yet? There's seems to be a overwhelming agreement that Vista is severely UNDERwhelming.</p>
