      <p>The first Mac I ever saw in action sort of sold me on the product. After fifteen years of working with all sorts of computer systems and not really enjoying computers in any way... a graphical user's interface!!! Lordy.</p>
      <p>One of the reasons I prefer Macs is they are so well engineered they often outlive their usefullness. I ran a Centris Quadra for over nine years. In its later years it was consigned to some fairly druge type work but it always performed well and took forever to give up the ghost (and it never did, but the hardware and software had simply passed it by). </p>
      <p>I've got an old G3 on 9.2.2 that basically is used for publishing on demand operations. I don't think it's ever going to quit on me.</p>
      <p>Now I'm running 10.4.4 on a G4 and it is rock solid. Looking back at 9.2.2 I have to say it was quite rock solid as well and romantically simple and remarkably stable. Tiger, on the other hand, is an onion of increasing complexity, but never uninteresting. And if there is a word for it, it is dynamic (in the engineer's fluid sense of the word).</p>
      <p>The trick with saving money on a Mac is to watch how Apple is responding to the changing technology and buy used machines that were at their peak (and recognized as such) but still at the cusp of what is needed in the here and now. I buy my machines from an institution where they actually are well maintained. A few hundred bucks, maybe a grand to soup em up by upgrading the software and maximizing the hardware, and I'm set for a couple of years. I don't have a G5 (not yet) but I sure know what the hell is going on with my G3 and G4. And I am quite pleased with them both.</p>
      <p>Gerald</p>
