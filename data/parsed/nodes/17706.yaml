    votes: null
    html: |-
      <p><em>My G4 has never crashed</em></p>
      <p>After you're finished with it, I suggest you consider donating it to the Smithsonian: the G4 I use at work (commercial printing shop) is prone to total lockups (cold reboot) at least once a week. OS X is a lot more stable, but it's incredibly annoying when it refuses to carry out an operation and won't tell you why; even a cryptic error message is better than no error message at all.</p>
      <p>Apple was the first kid on the block; early adopters considered themselves pioneers, then prophets of the One True Way. Mac users have always been a minority, so early on they adopted a cult mentality and have stuck with it. Besides, Steve Jobs is incredibly good at hyping his stuff (well, maybe the next OS wasn't such a great idea), convincing his faithful followers that they are truly blessed to pay more (and more and more -- four updates to OS X in five years, none free) and get less (it only took Mr J twenty-five years to realize that Mac users could, in fact, actually handle a mouse with more than one button on it).</p>
      <p>Bottom line: the box and the OS which works best to suit <strong>your</strong> needs (cheap, reliable, idiot-proof, the latest thing, the Holy Grail, whatever) is the best system for you.</p>
