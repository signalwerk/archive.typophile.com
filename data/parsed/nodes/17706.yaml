      <p>Try using Windows, that'll give you the answer. I'm glad I left that odd space. I was a Windows user since Windows 2 (still have the discs), then got Window 3.11, Win95-98 but then worked with an ad agency and actually got to use one of these computers that every Windows user is raised to hate. Turned out it wasn't hate, it was envy.</p>
      <p>At that time it was OS 7 and I liked the way I could 'just work' all the hassle was taken off of my shoulder, I could just work - and get coffee when the bitch froze on me, mostly while doing "Layouts" in Freehand (yes I know) and comps in Photoshop.</p>
      <p>Also being a Mac only studio I found that Macs are a hell of a lot cheaper compared to what you get. My costs on virus protection, anti spyware protection and the necessary RAM additions almost went to zero.</p>
      <p>If you have an IT department at your service you can rather safely use Windows. If you're willing to become a security expert, you probably can too.</p>
      <p>Even with a "lesser powered" G5 you can bust the gigahertz myth quite quickly, run a rendering application or a depth correction on a 32Bit float image. Instant gratification.</p>
      <p>You need to work? You're serious about the quality of the output? You don't want to worry about the ins and outs of your system to fight and keep it running? No use for a bimonthly re-install? Get a Mac.</p>
      <p>It's not just about the style. It's what enables me to work. Apple is a creative company and thinks like creative people. Microsoft is a business company and thinks like business people.</p>
      <p>Oh and with a new Mac you get a lot of apps for free that are 1. actually useful and 2. they actually work.</p>
      <p>@<a href="http://typophile.com/user/7006" rel="nofollow">paul d hunt</a>: Are you on Mac OS 9? My Panther and Tiger machines run 24/7 almost every week when rendering large images or HD streams.</p>
      <p>At the end of the day it's all about what you need to spend AFTER the purchase. This can easily be twice the price of the purchase depending on the platform you go for.</p>
