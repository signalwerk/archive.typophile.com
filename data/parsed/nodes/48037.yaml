    html: <p>You can find some in <em>Made With FontFont</em> and in Christopher Burke’s biography of Paul Renner. Thomas is right that there are a few in <em>Anatomy…</em>, but they’re cropped and cleaned-up b&amp;w images of production drawings so they aren’t really good examples. Also, check with Jos Buivenga who might have hi-res versions of the images of his drawings that were used in a recent online profile. It would also be worth sifting through old images of ID, Baseline, etc. for drawings in their profiles of type designers.</p>
