    <p>Dear Fellow Typophiles,</p>
    <p>In the middle of November I was commissioned to design and execute<br>
    a fresh Finnish–Arabic–Finnish Dictionary for general readers.<br>
    Since my knowledge of non-Latin scripts is restricted to classical Greek<br>
    – and some Russian – there are major difficulties to surmount.</p>
    <p>(1) Technical issues<br>
    It is well known that the localized Adobe InDesign ME supports right-<br>
    to-left scripts, but are there any cunning methods of importing Arabic<br>
    to the standard version (i.e. Adobe InDesign CS2, English, Mac)?<br>
    (2) Aesthetical issues<br>
    The choosing of Arabic typeface seems somewhat outrageous. (e.g.<br>
    some kufic fonts seem appealing to me, but I doubt whether they<br>
    have any connection whatsoever with lexica...)<br>
    The Latin scripts of our book might be set with ‘Linotype Trajanus’ or<br>
    ‘Brioso Pro’, which do possess certain calligraphic flavour.<br>
    (3) The lack of Arabic skills<br>
    Indeed, shall I have the temerity to accept this captivating commission?</p>
    <p>Any suggestions or comments will be highly appriciated!</p>
    <p>Sincerely,<br>
    P. L.</p>
