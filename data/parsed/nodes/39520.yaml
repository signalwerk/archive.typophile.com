      <p>&gt;&gt;(1) Technical issues<br>
      It is well known that the localized Adobe InDesign ME supports right- to-left scripts, but are there any cunning methods of importing Arabic<br>
      to the standard version (i.e. Adobe InDesign CS2, English, Mac)?</p>
      <p>Not really since shaping is only possible in ME.</p>
      <p>&gt;&gt;(2) Aesthetical issues<br>
      The choosing of Arabic typeface seems somewhat outrageous. (e.g.<br>
      some kufic fonts seem appealing to me, but I doubt whether they<br>
      have any connection whatsoever with lexica...)<br>
      The Latin scripts of our book might be set with ‘Linotype Trajanus’ or<br>
      ‘Brioso Pro’, which do possess certain calligraphic flavour.</p>
      <p>Naskh is the typeface of choice for newspapers and textbook.  But even within that you have varieties. Of course, I would be happy if you decide to choose my Arabetics Mehdi font family :)</p>
      <p>&gt;&gt;(3) The lack of Arabic skills Indeed, shall I have the temerity to accept this captivating commission?</p>
      <p>With some help from a local college student, yes you should.</p>
      <p>Good luck.   -Saad</p>
