      <p>I would go with GMT +1, CET or UTC +1 and adjust the times when the clocks go back, that way viewers will not have to know when summer officially begins and ends. If your design uses aligning numerals you will not need small caps uppercase should work okay.</p>
      <p>So...<br>
      Business Hours<br>
      Monday–Friday<br>
      9 AM–5 PM (CET)</p>
      <p>or<br>
      Business Hours<br>
      Monday–Friday<br>
      8 AM–4 PM (UTC)</p>
      <p>and change them when summer time ends (nb en-dashes)<br>
      Tim</p>
    html_clean: |-
      <p>I would go with GMT +1, CET or UTC +1 and adjust the times when the clocks go back, that way viewers will not have to know when summer officially begins and ends. If your design uses aligning numerals you will not need small caps uppercase should work okay.</p>
      <p>So...<br>
