    html: |-
      <p>The conventions in England and the US are sometimes different, so you will need to decide which to follow. </p>
      <p>In the US the Chicago Manual of Style is the most widely used style book. It recommends either 10 a.m. to 6 p.m. (note the space after the numeral and the periods in the abbreviation) or 10 AM to 6 PM with AM and PM in small caps, no periods. </p>
      <p>The 24 hour notation is used even less in the US than in England, though it is used.  </p>
      <p>edit: also in the US it is 10:00 a.m. not 10.00 a.m. If you have to set English often the best thing is just to buy a style book for either England or the US, depending. These questions are endless, even for a native speaker.</p>
    html_clean: |-
      <p>The conventions in England and the US are sometimes different, so you will need to decide which to follow. </p>
      <p>In the US the Chicago Manual of Style is the most widely used style book. It recommends either 10 a.m. to 6 p.m. (note the space after the numeral and the periods in the abbreviation) or 10 AM to 6 PM with AM and PM in small caps, no periods. </p>
      <p>The 24 hour notation is used even less in the US than in England, though it is used.  </p>
      <p>edit: also in the US it is 10:00 a.m. not 10.00 a.m. If you have to set English often the best thing is just to buy a style book for either England or the US, depending. These questions are endless, even for a native speaker.</p>
