    html: |-
      <p>As usual in English there are several ways of putting this, but using your copy as a start</p>
      <p>Open (could be all uppercase)<br>
      Mon. to Fri.<br>
      10am to 6pm (24 hour clock means you can drop the am and pm so 10:00 to 18:00, although the 24 hour clock causes some problems, especially to people without a background in the military or organisations which use radio communications)</p>
      <p>Using an en-dash (for UK, em-dash for US)<br>
      Open (from is not really necessary)<br>
      Monday–Friday (or Mon–Fri) (or Mon.–Fri. although the full stop does make a space before the en-dash which you might want to compensate for with a thin space after the dash)<br>
      10:00–18:00 (or 10.00–18.00) (or 10am–6pm)</p>
      <p>Slightly edited copy and my preference<br>
      Opening Hours<br>
      Monday–Friday<br>
      10am–6pm</p>
      <p>Tim</p>
      <p><em>Edit: despite Typophile’s preferences for old style (non-aligning) numerals in this case aligning numerals would be easier to read</em></p>
    html_clean: |-
      <p>As usual in English there are several ways of putting this, but using your copy as a start</p>
      <p>Open (could be all uppercase)<br>
      Mon. to Fri.<br>
      10am to 6pm (24 hour clock means you can drop the am and pm so 10:00 to 18:00, although the 24 hour clock causes some problems, especially to people without a background in the military or organisations which use radio communications)</p>
      <p>Using an en-dash (for UK, em-dash for US)<br>
      Open (from is not really necessary)<br>
      Monday–Friday (or Mon–Fri) (or Mon.–Fri. although the full stop does make a space before the en-dash which you might want to compensate for with a thin space after the dash)<br>
      10:00–18:00 (or 10.00–18.00) (or 10am–6pm)</p>
      <p>Slightly edited copy and my preference<br>
      Opening Hours<br>
      Monday–Friday<br>
      10am–6pm</p>
      <p>Tim</p>
      <p><em>Edit: despite Typophile’s preferences for old style (non-aligning) numerals in this case aligning numerals would be easier to read</em></p>
