    <p><strong><a href="/wiki" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypoWiki</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;: Delve&nbsp;Fonts</strong></p>
    <p>Founded in 1996, <a href="http://www.delvefonts.com">Delve Fonts</a> is an independent type foundry based in <a href="/node/add/wiki?edit%5Btitle%5D=Alameda" title="Create node &quot;Alameda&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Alameda</a>, <a href="/node/20056" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">California</a>. Delve Fonts features an exclusive, acclaimed typeface library, which includes Helfa, Rieven Uncial, Uppercut Angle, Quara, Tilden Sans, and&nbsp;more.</p>
    <p>Delve Fonts specializes in the design and production of fonts for mobile devices, development of custom font production tools; Design and production of non-latin fonts; OpenType Pro fonts with advanced features; and Logo development for corporate identity and branding purposes. The sole proprietor, <a href="/node/15590" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Delve Withrington</a>, draws from fifteen years of experience in&nbsp;typography.</p>
    <p><strong>Typefaces&nbsp;include:</strong></p>
    <p><a href="/node/add/wiki?edit%5Btitle%5D=Blasphemy%20Initials" title="Create node &quot;Blasphemy Initials&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Blasphemy Initials</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Blot%20Test" title="Create node &quot;Blot Test&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Blot Test</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Cody" title="Create node &quot;Cody&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cody</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Continuo" title="Create node &quot;Continuo&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Continuo</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Cortina" title="Create node &quot;Cortina&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cortina</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Delve%20Hand" title="Create node &quot;Delve Hand&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Delve Hand</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Discourse" title="Create node &quot;Discourse&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Discourse</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Eulipia" title="Create node &quot;Eulipia&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Eulipia</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Fleisch" title="Create node &quot;Fleisch&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fleisch</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Helfa" title="Create node &quot;Helfa&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Helfa</a><br><a href="/node/add/wiki?edit%5Btitle%5D=Oktal%20Mono" title="Create node &quot;Oktal Mono&quot;" class="freelink freelink-freelinking_p