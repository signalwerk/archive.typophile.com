    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Delve Fonts</strong></p>
    <p>Founded in 1996, <a href="http://www.delvefonts.com" rel="nofollow">Delve Fonts</a> is an independent type foundry based in <a href="/wiki/Alameda" class="freelinking" rel="nofollow">Alameda</a>, <a href="/wiki/California" class="freelinking" rel="nofollow">California</a>. Delve Fonts features an exclusive, acclaimed typeface library, which includes Helfa, Rieven Uncial, Uppercut Angle, Quara, Tilden Sans, and more.</p>
    <p>Delve Fonts specializes in the design and production of fonts for mobile devices, development of custom font production tools; Design and production of non-latin fonts; OpenType Pro fonts with advanced features; and Logo development for corporate identity and branding purposes. The sole proprietor, <a href="/wiki/Delve%20Withrington" class="freelinking" rel="nofollow">Delve Withrington</a>, draws from fifteen years of experience in typography.</p>
