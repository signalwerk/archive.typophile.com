  html: |-
    <p>Hi!</p>
    <p>I have such a problem - I want firm typeface that would look good with a logotype that consist serif typeface (Adobe Jenson Pro). I want that alternative font to be sans-serif for showing that company is reliable and has long lasting experience but also is modern.<br>
    I don't want that modern typeface to have similar contrast and rhythm. For example if I'm trying to use Myriad Pro Semi Condensed it looks like I'm trying imitate Adobe Jenson Pro in a "modern way" and its cheaply straightforward. </p>
    <p>So are there any methods for finding a pair?</p>
    <p>Thanks!</p>
