    html: |-
      <p>The a in the ae ligature looks a bit slapped on, the forms dont really flow together.<br>
      The ß is a bit too wide, I think. And its lower bowl too small (don't use the s for that).<br>
      Re the florin: maybe you should line up the horizontal strike thru with the one in the sterling etc. And do elongate it and maybe give it a bit of a cursive slant (that's common usage in the Low Countries).<br>
      The ampersand is a bit unbalanced. Maybe the lower bowl a bit larger and the upper smaller?<br>
      The cedille needs to beef up.</p>
      <p>Sounds like a lot — but I do like this design. Makes me wish I could do something like it ; )</p>
