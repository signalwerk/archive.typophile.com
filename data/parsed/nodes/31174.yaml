    <p>Hello typofriends.</p>
    <p>Since the first days of 2007 i decide to come back to the field of type.<br>
    I like to share the first font from my re-starting new effort to become a typedesigner.<br>
    Picara is a sanserif organic font, with local vernacular references, a little condensed proportions, dark color, roman humanist model(Jenson)and open counterforms.</p>
    <p>I want to keep armonic rithm of vernacular letters, without distracting too much the attention of the reader. The propose for this font is to work from 7 to 12 pts, in magazines and books, with a family of the 4 classic weights: Roman, SmallCaps, Italic and Bold.</p>
    <p>The end strokes follow a strong left-right "italic rithm" in the lowercases; Do you see the same in the uppercases?</p>
    <p>There are some characteristics that i want to follow, for example, the monetary lowercase signs aligned to the x weight old style figure numbers.¿is this weird for commercial standard requirements?</p>
    <p>More details to look at in this first complete version of the roman, in the character set attached in the pdf.</p>
    <p>Best Regards,</p>
    <p>mh.</p>
