      <p>"Pícara" is a word that describes an attitude and a whole language present is the popular folckore warm humor, very rich on slangs, with a touch of erotism.</p>
      <p>Translation words: rascal/naughty/cunning</p>
      <p>My favorite newspaper use this language (lacuarta.cl), and off course, Picara is a metaphoric type interpretation of vernacular lettering and this chilean popular language.</p>
      <p>mh</p>
