      <p>Miguel - I've said it elsewhere already, but this is looking wonderful. This warm, organic finish will be a hit, especially in these days of soft'n'cozy, but Picara doesn't feel trendy. </p>
      <p>The bowl of the 'a' might be just a tad too small for text sizes. It's the only counter in danger of clogging.</p>
      <p>&gt; There are some characteristics that i want to follow, for example, the monetary lowercase signs aligned to the x weight old style figure numbers.</p>
      <p>No reason not to do both. Make a Lining Figures version of the font with punctuation and monetary symbols that match the uppercase.</p>
