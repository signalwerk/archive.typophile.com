      <dl>
      <dt>• <em>It took a bit of time, but Akzidenz Grotesk is here in Greek &amp; Cyrilic</em></dt>
      </dl>
      <dl>
      <dt> </dt>
      </dl>
      <dd>In fact, Akzidenz-Grotesk Cyrillic was there for quite a while. It is shown in the Berthold specimen of 1911.

      <dl>
      <dt><div class="imageWrap"><img src="http://typophile.com/files/Akz-Gr_Cyr_Sm_6095.png"></div></dt></dl></dd>


      <dl>
      <dt>
      </dt><dd>The above sample, from a catalogue of the Ivan Fedorov Printing Plant No. 3 (Leningrad, 1976), shows a badly worn font of <em>Rublenaya Garnitura demibold</em>, née Akzidenz-Grotesk, in 36 pt. (Didot). What was called <em>Rublenaya Garnitura regular</em> was actually the Russian version of Berthold’s (ealier Theinhardt’s) <a href="http://typophile.com/node/17643" rel="nofollow">Royal-Grotesk</a>. </dd>
      </dl>
