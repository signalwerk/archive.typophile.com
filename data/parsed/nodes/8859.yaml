    html: '<p>It’s a rather complex process to explain here. Sort of like asking “How do you play a ﬂute?”  <br><br>I would suggest reading Chapter 8 in the FontLab manual (Multiple Master Fonts) and then come back here if you still have questions. <br><br>Or, have you already designed a Multiple Master font in FontLab and are just having problems generating it? <br><br><span class="caps">FYI</span> #1, you can <i>only</i> make Multiple Master fonts in PostScript format. You generate it the same way you would a normal PostScript font, except that FontLab asks you whether you want to generate it with single or multiple masters. (“Single” meaning a “normal” PostScript font.) All of this assumes you have set up multiple axes in the font ﬁrst. And, of course, all of this is explained in great detail in that chapter in the FontLab manual. <br><br><span class="caps">FYI</span> #2, you can use Multiple Master fonts in MacOS X, but they only work in applications that support them (e.g., Illustrator, etc.). The old Adobe utility for generating instances should still work (in Classic) but I haven’t tried it. You can also generate instances from FontLab in any format you like, including&nbsp;OpenType.</p>'
    html_clean: '<p>It’s a rather complex process to explain here. Sort of like asking “How do you play a ﬂute?”  <br><br>I would suggest reading Chapter 8 in the FontLab manual (Multiple Master Fonts) and then come back here if you still have questions. <br><br>Or, have you already designed a Multiple Master font in FontLab and are just having problems generating it? <br><br><span class="caps">FYI</span> #1, you can <i>only</i> make Multiple Master fonts in PostScript format. You generate it the same way you would a normal PostScript font, except that FontLab asks you whether you want to generate it with single or multiple masters. (“Single” meaning a “normal” PostScript font.) All of this assumes you have set up multiple axes in the font ﬁrst. And, of course, all of this is explained in great detail in that chapter in the FontLab manual. <br><br><span class="caps">FYI</span> #2, you can use Multiple Master fonts in MacOS X, but they only work in applications that support them (e.g., Illustrator, etc.). The old Adobe utility for generating instances should still work (in Classic) but I haven’t tried it. You can also generate instances from FontLab in any format you like, including&nbsp;OpenType.</p>'
