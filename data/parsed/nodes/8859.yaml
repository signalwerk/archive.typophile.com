  html: <p>How do you generate a multiple master font in <span class="caps">FONTLAB</span>? (that is working in <span class="caps">MAC</span> <span class="caps">OS</span> X) In postscript and <span class="caps">MAC</span> format!! <br><br>Thanks!</p>
  html_clean: <p>How do you generate a multiple master font in <span class="caps">FONTLAB</span>? (that is working in <span class="caps">MAC</span> <span class="caps">OS</span> X) In postscript and <span class="caps">MAC</span> format!! <br><br>Thanks!</p>
