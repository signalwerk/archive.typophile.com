    html: '<p>Two more things:  <br><br>1. FontLab Studio 5 will internally support “multimaster” TrueType fonts. You will not be able to generated a “shipping” “<span class="caps">MM</span> <span class="caps">TT</span>” font but you can work with quadratic curves in <span class="caps">MM</span> mode, which can be very helpful for hinting.  <br><br>2. Mac <span class="caps">OS</span> X has native support for so-called TrueType <span class="caps">GX</span>/<span class="caps">AAT</span> Variation fonts. They are part of <span class="caps">GX</span>/<span class="caps">AAT</span>, the Apple-only advanced typographic layout system that is used in native Mac <span class="caps">OS</span> X applications, e.g. TextEdit, Pages, Keynote. Currently, there are practically no tools for building the <span class="caps">TT</span> variation fonts and there are very few fonts built that way. One of them is Skia that ships with Mac <span class="caps">OS</span> X.  <br><br>FontLab Studio 5 will support opening TrueType <span class="caps">GX</span>/<span class="caps">AAT</span> Variation fonts but will not generate them.  <br><br>Regards,  <br>Adam Twardoch <br>Fontlab&nbsp;Ltd.</p>'
    html_clean: '<p>Two more things:  <br><br>1. FontLab Studio 5 will internally support “multimaster” TrueType fonts. You will not be able to generated a “shipping” “<span class="caps">MM</span> <span class="caps">TT</span>” font but you can work with quadratic curves in <span class="caps">MM</span> mode, which can be very helpful for hinting.  <br><br>2. Mac <span class="caps">OS</span> X has native support for so-called TrueType <span class="caps">GX</span>/<span class="caps">AAT</span> Variation fonts. They are part of <span class="caps">GX</span>/<span class="caps">AAT</span>, the Apple-only advanced typographic layout system that is used in native Mac <span class="caps">OS</span> X applications, e.g. TextEdit, Pages, Keynote. Currently, there are practically no tools for building the <span class="caps">TT</span> variation fonts and there are very few fonts built that way. One of them is Skia that ships with Mac <span class="caps">OS</span> X.  <br><br>FontLab Studio 5 will support opening TrueType <span class="caps">GX</span>/<span class="caps">AAT</span> Variation fonts but will not generate them.  <br><br>Regards,  <br>Adam Twardoch <br>Fontlab&nbsp;Ltd.</p>'
