  html: <p>Dear all <br> <br>I wonder if someone can give us a hand trying to find out which are the fonts (or the font if it is only one) used on this titling for a book cover. So far we have only found Trajan and ITC Cerigo that ressemble the sample, but note the flat tip of the upper case A (unlike Trajan), and also the sans-serif middle bar of the E. The ampersand, being uncommon, should be relatively easy to track down, but we have not come across something like it within a font ressembling the other characters. Please disregard the long vowel marks and the underdots, unless you have some specific information. <br> <br>MANY THANKS IN ADVANCE! <br> <br>JA<img src="http://www.typophile.com/forums/messages/83/42430.jpg" alt="ghazali jpeg"></p>
  html_clean: <p>Dear all <br> <br>I wonder if someone can give us a hand trying to find out which are the fonts (or the font if it is only one) used on this titling for a book cover. So far we have only found Trajan and ITC Cerigo that ressemble the sample, but note the flat tip of the upper case A (unlike Trajan), and also the sans-serif middle bar of the E. The ampersand, being uncommon, should be relatively easy to track down, but we have not come across something like it within a font ressembling the other characters. Please disregard the long vowel marks and the underdots, unless you have some specific information. <br> <br>MANY THANKS IN ADVANCE! <br> <br>JA<img src="http://www.typophile.com/forums/messages/83/42430.jpg" alt="ghazali jpeg"></p>
