  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/outliner_5725.png"></div><p></p>
    <p>hello. this is Monoxil Outliner, one of three font from my diploma project (along with <a class="freelinking external" href="http://typophile.com/node/44668" rel="nofollow">Klimax</a> and Kakao). its design is based on the original <a class="freelinking external" href="http://typophile.com/node/33307" rel="nofollow">Monoxil</a>, which i made last year. i used that font only twice or so because it somehow didn't fit into anything :), but it worked quite <a class="freelinking external" href="http://www.urbanclash.sk/" rel="nofollow">nice</a> with various outlines applied to it. </p>
    <p>so i decided to design a new font, especialy for use with outlines.<br>
    1. i changed the proportions a bit (the white spaces in B, E, F, P, R and S are the same size, so they close at the same time when you increase the thickness of the outline)<br>
    2. the ends of strokes are rounded<br>
    3. all sharp connections have a very small rounded curve in the corner, so there don't appear any ugly triangles sticking out ot the shape when the letter has a thick outline. (because it is not possible to choose the type of the connections of the outline for text in indesign)</p>
    <p>thank you for your comments. ondrej</p>
