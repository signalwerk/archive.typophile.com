    html: <p>This reminds me of neon tubes, and i like the way you've included in the font a solution to the InDesign stroke corners. It's clever to make a font with considerations for stroke width, closing up the counters evenly across different letters. I like the gap in the R and the wide m, s and c. Your o is refreshing. Good stuff! :)</p>
