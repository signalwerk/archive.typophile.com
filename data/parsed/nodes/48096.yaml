      <p>Oke, it has done its job.<br>
      I have finetuned it here and there.</p>
      <p>I do feel that the orange/cyan version has the most psychodelic colors.<br>
      Blue and red are not that violent.</p>
      <p>I removed the second 'mind' and cleaned it up a bit.<br>
      I think it has improved.</p>
      <p>The dot on the 'i' was asking a lot of attention.<br>
      So I changed it – for fun - into a moon.<br>
      My wife reads the magazine in bed. (No remarks here, guys. ;-)</p>
