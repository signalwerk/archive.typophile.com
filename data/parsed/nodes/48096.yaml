  html: |-
    <p>Hi there,</p>
    <p>A personal item I wanted to share with you.</p>
    <p>My wife has her birthday today. ;-)</p>
    <p>Amongst others I'm giving her a subscription for a dutch psychological magazine (which she likes).<br>
    Because the first issue has still to come, I do have to come up with something. This item can not be handed over empty handed.</p>
    <p>So I made this little card.</p>
    <p>Idea was to let the mind work.<br>
    I used complementary colors so the brain will have to work hard.<br>
    Since I was late again, I had little time to come up with this.</p>
    <p>Also a small study concerning the colors.</p>
    <p>I used the negative areas of Egyptienne F LT Std.<br>
    And placed them at random making it more alive.</p>
    <p>Remarks are welcome!</p>
    <p>Ray</p>
    <p>PS: By the way, the byline is in dutch. Reading: annual supscription for mind magazine.</p>
