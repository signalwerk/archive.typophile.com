      <p>That lower form of /r/ works far better when the previous letter leads into it from below (Lower "Bright" looks like "Beight" and "Arrange" like "Aerange" to me.) Meanwhile the lower form of /z/ works far better when there isn't a lead-in.<br>
      I think the set-up of the cursive letters as alternates makes good sense.</p>
