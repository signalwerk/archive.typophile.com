      <p>Sure Pablo, I'll reveal my secrets to you. Writing at normal hand witing size with a Ball Pentel Fine Point R50, scanning at 300%, 300dpi. Place in Illustrator then LiveTrace on the 'Lettering' setting. I then scaled to about 1300%, copied, then pasted into the glyph window in FontLab then optimized, (clean up paths really).</p>
      <p>So, it's not an 'effect' in reality - that's just how it is.</p>
