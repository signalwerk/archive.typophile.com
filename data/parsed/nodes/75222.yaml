    html: |-
      <p>In Britain many people (who can't write properly) have a problem with the more cursive style of r and z. One of my previous script fonts Gizmo had cursive style r and z as default, and I get enraged every time I see a really bad botch 'alteration' of these two characters. So I have made a more 'standard' style as default.  </p>
      <p>I have now created a style set of an alternate cursive style r and z (and related diacritics, ligatures), for people who can write properly and recognize the characters for what they are. Is this a good idea?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Buzz_5569.jpg"></div><p></p>
