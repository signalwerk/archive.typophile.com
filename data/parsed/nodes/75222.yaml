      <p>Great Nick, it will be a very useful typeface. Which would have been very difficult to produce in lead. :)</p>
      <p><cite> It's strange how people perceive things differently Craig </cite><br>
      I think it’s mostly just a matter of models. The "British people (who can't write properly)" are accustomed to a form more related to the corsiva Cancelleresca, unconnected, while the two connected forms (especially the "descending" z) are common in calligraphic styles which are not constantly used. You are right, however, by saying that this is due to a lack of culture, and history of our alphabet.<br>
      I think the observation riccard0 made is more related to how [A] connects to the subsequent lowercase letters. The stroke makes a curve, and this looks strange. I think [A] does not need so much ligatures, which are otherwise neat with [B] or other capital letters.<br>
      About the [N]: keep both forms, one as alternate.</p>
