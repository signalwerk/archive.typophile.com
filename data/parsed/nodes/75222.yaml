    html: |-
      <p>Glad you're all liking it so far.</p>
      <p>Tomi - I had that problem with Olicana, but with this one I've used liga and calt combined to give more variety without doing so many ligs (even though there are still lots).</p>
      <p>Frode - here is your tutorial for the day:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Crossing_4881.gif"></div><p></p>
      <p>The crossings out were done by having crossings out in 8 lengths from short to long. Each of these is then placed to the left of the left side bearing in the glyph window, thus placing it over the previously typed characters. The width of the crossing glyph is set quite narrow - (198 in this case) so that it can be selected if need be. You can see in the picture how many spaces are needed to make the Crossing_7 glyph appear after the word. The Crossing_7 glyph is selected in the picture and you can see the width is narrow and the glyph itself is to the left.</p>
      <p>I hope that is clear enough - it may become clearer if you study the metrics.</p>
    html_clean: |-
      <p>Glad you're all liking it so far.</p>
      <p>Tomi - I had that problem with Olicana, but with this one I've used liga and calt combined to give more variety without doing so many ligs (even though there are still lots).</p>
      <p>Frode - here is your tutorial for the day:</p>
      <p></p><div class="imageWrap"><img src="/files/crossing_4881.gif"></div><p></p>
      <p>The crossings out were done by having crossings out in 8 lengths from short to long. Each of these is then placed to the left of the left side bearing in the glyph window, thus placing it over the previously typed characters. The width of the crossing glyph is set quite narrow - (198 in this case) so that it can be selected if need be. You can see in the picture how many spaces are needed to make the Crossing_7 glyph appear after the word. The Crossing_7 glyph is selected in the picture and you can see the width is narrow and the glyph itself is to the left.</p>
      <p>I hope that is clear enough - it may become clearer if you study the metrics.</p>
