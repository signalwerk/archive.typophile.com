  html: |-
    <p>This is something I am working on at the moment</p>
    <p>After my last script Olicana, written with a steel nib and ink, I thought I'd go more up-to-date with a Ball Pentel, but still with the mostly connected feel. I hope to achieve the authentic handwritten look of Olicana with this one, implementing lots of ligatures and some contextual alternates for certain characters. Or I might have individual characters as stylistic sets so that one or more characters may be substituted. I shall probably have Rough and Smooth styles also. </p>
    <p>I am not sure about keeping the 'lumpy' bits in the smooth style or smoothing them out.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Rollerscript2_5969.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Rollerscript3_6237.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Rollerscript1_5112.gif"></div><p></p>
