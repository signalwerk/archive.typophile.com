  html: |-
    <p>May I bring to your attention specialized motor racing fonts.<br>
    With them the design of your diagrams, documentation schemes and roadbooks will stand out and look more attractive. The set includes three fonts, one comes free.<br>
    Buy it at MyFonts.com <a href="http://new.myfonts.com/fonts/2d-typo/rally-symbols-2d/" title="http://new.myfonts.com/fonts/2d-typo/rally-symbols-2d/">http://new.myfonts.com/fonts/2d-typo/rally-symbols-2d/</a> </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/RallySymbols2D_720x360_01_5499.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/RallySymbols2D_720x360_03_6241.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/RallySymbols2D_720x360_06_6740.png"></div><p></p>
    <p>Detail describtion:<br>
    The Rally Symbols 2D font family has been developed for integrated graphical motor racing design.<br>
    First of all that includes rally, rally raid, cross-coutry rally and hillclimb.<br>
    With the Rally Symbols 2D - Signs font one can create quality road maps with rally routes and various symbol books. The font also<br>
    includes symbols that can serve as workpieces to create competition logos and other design solutions.<br>
    The Rally Symbols 2D - Arrow font has been specially developed for building tulip diagram roadbooks.<br>
    It includes various ready-made combination of traffic direction indicators and individual elements that can be combined together.<br>
    The Rally Symbols 2D - Picto font can be used for the same purposes but also contains a range of convention that can help to find one's<br>
    bearings on the ground.<br>
    This is a a wide range of icons or pictograms of various scenery, for example: different buildings, churches, cemetery, bridges, tunnels,<br>
    different types of trees, posts, etc.</p>
    <p>The fonts are unique of its kind and are periodically updated with custom request material.<br>
    New updates are available free of charge to previous version purchasers.</p>
