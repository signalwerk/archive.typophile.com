    html: |-
      <p>I like very much the way ITC Bailey works in magazine text, but it only has the normal and the bold weight.</p>
      <p>I saw Tschichold and I liked it, a very Garamondesque Gill Sans.</p>
      <p>Chianti BT is a humanist sans serif which works nicely in body text, has old style figures, caps, a nice set of italic swashes and alternates and three weights. </p>
      <p>Héctor</p>
