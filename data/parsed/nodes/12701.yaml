    <p>Thanks for the serif advice for my alumni magazine redesign. I think I’ll look into Miller or Sabon Next for the main text serif font.</p>
    <p>Now I’m persuading them to pick a new sans serif. Must work as a headline, subhead and sidebar text. Large family a plus. Any favorite sans? Any that would work well with Sabon/Miller? </p>
    <p>I’m drawn to Stalemate or Tschichold at the moment.</p>
