      <p>I know that I saw at least one book on typography that showed samples of text in German, Italian, French, and English in typefaces said to be especially suited to each one, and then in an "international" typeface that suited them all well.</p>
      <p>Sadly, while I'm sure I still have it, I can't put my hands on it right away at the moment. I think it had a white dustjacket, and a nice illustration of all the characters in the font used for the Gutenberg Bible, and was large in size. (Pages were roughly 8 1/2" by 11" size, but not exactly - the width of a page in proportion to its height was greater than for that size of page.)</p>
