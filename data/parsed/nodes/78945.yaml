      <p><em>Das Detail in der Typografie</em> by Jost Hochuli compares German text in two notations.</p>
      <p>There were some attempts in mid-war Poland and Czechoslovakia, to replace diagonals with curved strokes, but they were rather utopian. I think that Minion works great with Polish language, byt I cannot precise my opinion; Minion has lots of details running in all directions, so the main diagonals, responsible for the irregularity - disappear.</p>
