    <p>Certain font were designed to suit certain languages. For instance German needs smaller uppercase letters because of so many capitalized words. I imagine that Bodoni was designed for Italian. We also know international fonts.<br>
    Does anybody has a clue, hint or information about some serious literature about this problem.<br>
    I am interested in visual characteristics of all official European languages.<br>
    Thanks for any suggestion or help.</p>
