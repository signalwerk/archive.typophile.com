      <p>Been reading Typophile for ages now and it was a pleasant surprise to find a thread about Preen. Justin did a great job with the masthead – when I was burning the midnight oil laying out the magazine he swooped in and knocked out the logo. Huge life-saver. </p>
      <p>The rest of the magazine uses Serif Gothic, Caslon, and a healthy dose of Fedra Sans. I must say, Serif Gothic is one of those typefaces you don't necessarily take notice of immediately, but even after 3 issues I can't wait to keep using it.</p>
