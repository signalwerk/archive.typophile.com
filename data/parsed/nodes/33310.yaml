    <p>Dear Type Savants,</p>
    <p>I recently came across a fashion magazine that does *not* use Didot and/or Avant Garde. Instead, the designer(s) employs a kind of retro-cheesy-yet-appealing combination of typefaces. (At least they're trying something different.) I know the faces, but I can't identify them. It's making me crazy. </p>
    <p><em>Specifically:</em></p>
    <ol>
    <li><a href="http://www.preenmag.com/issue01/" rel="nofollow">The masthead</a>. Though I know the swash and spacing are likely custom. </li>
    <li>And <a href="http://www.preenmag.com/issue01/issue01c.html" rel="nofollow">this display face</a>, used in various weights throughout.</li>
    </ol>
    <p>I've ruled out Normandy or Poster Bodoni for the masthead, as well as Bernhard Gothic or Penumbra Flare for the display. Any ideas?</p>
