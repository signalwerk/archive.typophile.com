      <p>Thanks Andre.  I'm a little ambivalent about the TT ligature---I kind of like the cleanliness, but I'm also worried that it calls too much attention to itself.</p>
      <p>I also wonder about my use of small caps.  The <em>look</em> I have right now is good, I think.  But I'm not sure the usage is entirely consistent: "B.S." needs to be capitalized (though as I look at it now, should there be a space between the two letters) but GPA could be in small caps.  I tried that and it looked a bit weird so I left it with normal caps, is this acceptable?  The two-letter abbreviations for the states are in small caps, and I think that works. Thoughts?</p>
