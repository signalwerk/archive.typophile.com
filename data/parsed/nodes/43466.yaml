    <p>Hello everyone.  I'm still relatively new here so it feels a bit exploitative to request critique without providing any.  But if you're willing, I'd like to have your thoughts on the design of my resume.  I've changed most of the contact information because I'm not too hot on the idea of putting my phone number into the wild.</p>
    <p>I am interested in <em>any</em> form of comment, those regarding content, design, layout, font choice, etc. </p>
    <p>I guess I'd call myself a "design hobbyist".  It interests me, and I've taken some classes on it in high school, but nothing since then. I have very thick skin though, so please, don't hold any criticism back! Thanks!</p>
