    <p>A friend of mine, the sculptor Amy Kann <a href="http://www.amykann.com/" title="http://www.amykann.com/">http://www.amykann.com/</a> is known for her stunning bas relief work and as a result designs her share of coins, medals and plaques involving type as well as portraits in which the subject's name is a critical typographic element. She's asked me to collaborate with her on a project. </p>
    <p>The client requested Caslon as close to the 18th Century version as possible. The debates here and elsewhere about the "real" Caslon </p>
    <p>There's a great conversation here: <a href="http://typophile.com/node/30941" title="http://typophile.com/node/30941">http://typophile.com/node/30941</a>  but I can't seem to find a straight answer. Does anyone have a new take on this age old question? </p>
    <p>My second question is about typography and coin design, of which I've found scant little in googling "coin design numismatic typography" and similar phrases.  Surely a typophile out there has done a study on the subject. A straight search came up with little, but an image search <a href="http://bit.ly/eyBQHc" title="http://bit.ly/eyBQHc">http://bit.ly/eyBQHc</a> scored some beautiful results.</p>
    <p>Any typophiles have a special interest in the topic?  Thanks in advance.  And check out Amy's work. It's great stuff. </p>
    <p>Patrick</p>
    <p>TypographyShop</p>
