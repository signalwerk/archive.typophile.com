    <p>What was allowed?</p>
    <p>1) It was allowed to use the foundry type to typeset letterpress texts and to print the typeset text directly by letterpress (relief printing).</p>
    <p>2) It was allowed to make stereotypes and electrotypes of the typeset text and to print the stereotyped and electrotyped typeset text by letterpress.</p>
    <p>What was forbidden?</p>
    <p>1) It was forbidden to make photographs as such of the typeset text.</p>
    <p>2) It was forbidden to make rubber stamps on the basis of the foundry type.</p>
    <p>3) It was forbidden to lend or rent the foundry type to other typesetters and printers.</p>
    <p>4) It was forbidden to use the foundry type (or rather the photographs of typeset text) for making printing plates for lithography (offset printing).</p>
    <p>5) It was forbidden to use the foundry type (or rather the photographs of typeset text) for making printing plates for intaglio printing (rotogravure).</p>
    <p>The German text of these old EULAs is here:</p>
    <p>- <a href="http://www.sanskritweb.net/forgers/eula-seite1.jpg" title="www.sanskritweb.net/forgers/eula-seite1.jpg" class="link-external">www.sanskritweb.net/forgers/eula-seite1.jpg</a><br>
