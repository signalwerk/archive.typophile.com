    <p>The attached image is my own rough rendering of some text I am trying to match. I traced this as the source image was not good enough for ID purposes. I'd like to track down the name of the original typeface - after endless searching it appears there is no modern, digital version of this.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ob1_4821.png"></div><br>
    It shares properties with other Bauhaus-style geometric sans serif display faces, such as ITC Bauhaus, Blippo, Ronda etc. It comes closest to Harry from Red Rooster (but with ITC Bauhaus-style M and N) or Linotype Horatio (again with different M N R). Perhaps the original was one of the aforementioned, but using alternates not carried over into the digital version?<p></p>
    <p>Help with original name, designer or foundry welcome.</p>
