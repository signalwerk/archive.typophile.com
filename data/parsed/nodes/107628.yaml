      <p>Given the lack of responses I'm guessing those of you who took a stab at this ended up as confused as I was - but I think I've actually located it!</p>
      <p>This appears to be Blippo Bold, a somewhat rare weight of this iconic typeface, but take a look at the specimen over at the <a class="freelinking external" href="http://bowfinprintworks.com/BauhausFaces6.html" rel="nofollow">Bowfin Printworks Bauhaus pages</a>. As noted on that page, and in a <a class="freelinking external" href="http://typophile.com/node/33443" rel="nofollow">previous thread here</a> and <a class="freelinking external" href="http://typophile.com/node/97547" rel="nofollow">also here</a>, there is a modern digitization from FontBank called <a class="freelinking external" href="http://luc.devroye.org/FontBank--Brandish--1993.jpg" rel="nofollow">Brandish</a> (though I can't find a licensed, paid version of this for sale anywhere).</p>
      <p>Brandish does not include the regular S, only the alternate, which is disappointing. And regarding the difference in the R (my rendering had a rounded top corner on the stem) - that is probably my mistake in interpreting the low resolution, distorted sample I had.</p>
