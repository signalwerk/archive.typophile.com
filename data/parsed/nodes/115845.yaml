      <p>This a squeezed version of a typeface cut by Herman Ihlenburg in 1892 and sold by MacKellar Smiths and Jordan as Ferdinand. If you want a fairly good quality digital version it's included in the book by Dan X. Solo, _24 Victorian Display Fonts - CD-Rom and Book_ (Dover Electronic Display Fonts S.) Google didn't produce a link to the U.S. Amazon. Here is the U.K, Amazon <a href="http://www.amazon.co.uk/24-Victorian-Display-Fonts-Electronic/dp/0486999564">http://www.amazon.co.uk/24-Victorian-Display-Fonts-Electronic/dp/0486999564</a> Google also suggested some other U.S. sellers.<br>
      Don</p>
