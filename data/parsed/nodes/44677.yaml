  html: |-
    <p>Im pretty new at this site, but I believe the members of this site are very aware of the new fonts that come out. Although I haven’t found a topic about this particulair font. It’s the most powerful script ever made. It has 2 weights, 4280 glyps per font and 27 pro features.</p>
    <p>The font I am talking about is: PF Champion Script Pro!</p>
    <p></p><div class="imageWrap"><img src="/web/20080706084037im_/http://www.typophile.com/files/4878_PRO_sample_0_6059.jpg"></div><p></p>
    <p>and fror your information... I love this font!!!</p>
    <p>Actually, I love almost every script font that is made. This is just the best that I have ever seen and all the things you can do with it is amazing. Just look at the swashes.</p>
    <p></p><div class="imageWrap"><img src="/web/20080706084037im_/http://www.typophile.com/files/4878_PRO_sample_4_3_5176.gif"></div><p></p>
    <p>I’ve got just one word for it... PERFECTION.</p>
