      <p>Doesn't the Jim Rimmer video show that too? I forget.</p>
      <p>BTW I noticed that Guy Hutsebaut (the man in the Plantin-Moretus video, whom I had the pleasure of meeting at the second Thessaloniki conference) isn't flicking the mould up as he pours the type-metal, which is supposed to reduce air bubbles in the sort (by making the metal settle faster). Maybe that's actually a bit of romanticism, or maybe you only do that if you're making thousands of sorts a day...</p>
