      <blockquote><p>Also, it is described as a Kuenstler. What does this mean? I have seen this tag on Weiss and Schneidler too.</p></blockquote>
      <p>Bitstream developed a system to name typefaces systematically, based on their historic or visual traits, plus a numbering system for specific identification. They did this because the names of the typefaces that they were developing their own versions of were trademarked by other companies.</p>
      <p>Kuenstler (<em>Künstler</em>) is the German word for artist. <em>Künstlerschriften</em> (or artist typefaces) is a German term for typefaces designed by artists – including commercial artists – rather than having been developed by in-house a foundry’s technical staff.  Schneidler, Trump and Weiss were all <em>Schriftkünstler,</em> or what we might now call independent type designers, who sold or licensed designs-on-paper to type foundries.</p>
      <blockquote><p>Is this just the old Linotype outlines put into an opentype file, along with the smallcaps that was a separate file before opentype?</p></blockquote>
      <p>I don’t have the fonts myself, but it is very likely that this would be the case. I don’t think that there is a very of Trump Mediaeval on the market that is as featured as you would like.</p>
