      <p>That Paratype Kuenstler 480 looks like a very good and authentic interpretation, including the rare original swashes (although, they extended them to a few letters that did not have swash versions in the original). </p>
      <p>The Paratype italic f-ligatures are not quite the same as the original designs, but seem to be quite sensitively adjusted and re-imagined — for the better. (The Linotype fonts contain ligatures closer to the originals in design.)</p>
