      <p><em>Is this just the old Linotype outlines put into an opentype file, along with the smallcaps that was a separate file before opentype?</em></p>
      <p>That is exactly right. When Adobe converted its library to OpenType about ten years ago, it combined the regular fonts with Expert Sets (from Adobe and Monotype) and Small Caps and Oldstyle Figure Sets (from Linotype). A few symbols were added to every converted font, but they did not add new ligatures.</p>
