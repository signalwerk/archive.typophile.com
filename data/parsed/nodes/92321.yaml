    <p>I am looking for a more featured version of Trump Mediaeval, and the ones I see on myFonts that look like they might be right are the Linotype and Paratype sets.</p>
    <p>Trump Mediaeval Std (Linotype): The opentype one looks like it has smallcaps and old-style numbers, but doesn't have any more ligatures than my old one (only fi and fl). Is this just the old Linotype outlines put into an opentype file, along with the smallcaps that was a separate file before opentype?</p>
    <p>Trump Mediaeval Pro Cyrillic (Linotype): Has the smallcaps and more ligatures (the ffi one in particular), but the glyph dump seemed to indicate that there are no smallcaps or old-style figures in the file.</p>
    <p>Kuenstler 480 (Paratype / Bitstream): The opentype one offered by Paratype seems to have the old-style numbers, small-caps and ligatures (including fj, which isn't in the Pro Cyrillic Linotype one).</p>
    <p>The Paratype one seems like the best buy, but am I missing something about it, or the others? Does the preview not show some glyphs or are they missing from both Linotype versions?</p>
    <p>Also, it is described as a Kuenstler. What does this mean? I have seen this tag on Weiss and Schneidler too.</p>
