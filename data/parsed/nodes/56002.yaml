    <p>Hi guys,</p>
    <p>I've hit a bit of problem with some illustrator work I'm doing.</p>
    <p>I've a letter C, which I want to have all the anchor points and handles of this letter expanded to be actual paths, so the .eps file itself would contain a letter complete with its all anchor points and handles.</p>
    <p>Any idea if there's an elegant way to do this, beyond just screengrabbing and tracing!</p>
    <p>Cheers,</p>
    <p>David</p>
