      <p>hello david,</p>
      <p>we did a thing like that a few years back, as a complicated series of robofab scripts which Erik and Frederik helped me write, and that had a c. 98.375% chance of crashing fontlab:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/025lyon-poster_8_5131.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/026lyon-poster_7_5657.jpg"></div><p></p>
      <p>Thankfully, this is no longer necessary thanks to Mr. Lehni's Scriptographer tool for Illustrator, and specifically a script for it called "Anchorman". </p>
      <p>Our scripts were a tad more interesting for the type designer in that they would generate every layer of information (Oncurve points, BCPs, coordinates, hints, and something else I forget) for the entire typeface, and as a separate font, but as i said, muy crashy...</p>
      <p>(ah, yes, we decided to not show the actual outline, but of course that would merely be another layer of the same text block)</p>
      <p>HTH</p>
      <p>--K</p>
