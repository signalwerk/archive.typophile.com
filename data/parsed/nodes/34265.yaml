      <p>Paul, use the 2nd link to Ralfs flickr account and you will see the screen from an other direction. <a href="/wiki/Todor%20Vardjiev" class="freelinking" rel="nofollow">Todor Vardjiev</a> showed a lot of high quality type designs from his colleges and students, all in cyrilliza, latin and some times greek to. This style is not new, If I remeber it right, its teached since the late 60th at National Academy of Arts at Sofia. <a href="/wiki/CYRILLIZA" class="freelinking" rel="nofollow">CYRILLIZA</a> is not a special form of <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a>, as he mentioned it - its an own alphabet and now the third official alphabet of the the European union. Watch, he is wearing a blue t-shird wich yellow <a href="/wiki/Cyrilliza" class="freelinking" rel="nofollow">Cyrilliza</a> letters. :-)</p>
      <p>But no foundry is developing it! Only Hermes Soft, but he has no good experiences with this foundry. So most documents use Cyrillic letters, but for a Bulgarian patriot this is dishonoring.<br>
      <a href="http://www.flickr.com/photos/ralf_herrmann/561269913/" title="http://www.flickr.com/photos/ralf_herrmann/561269913/">http://www.flickr.com/photos/ralf_herrmann/561269913/</a> -<br>
