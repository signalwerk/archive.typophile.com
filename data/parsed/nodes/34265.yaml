      <p><em>Brian, if you're still reading this thread --any luck with the italic lower case little yus reference?</em></p>
      <p>I'm sorry I've kept you waiting. I went scouring all over the Internet for samples of early modern Bulgarian printed works that include italics—how I miss having access to a large university library!—and after some <a href="http://www.library.uiuc.edu/spx/class/Periodicals/Bulgaria/bulgperimages/russe.jpg" rel="nofollow">frustrating 'almost' finds</a>, Google Books bailed me out:</p>
      <p><a href="http://books.google.com/books?id=KX8CAAAAQAAJ&amp;pg=PA2" rel="nofollow">A grammar of the Bulgarian language with exercises and English and Bulgarian vocabularies (1859)</a> includes a table of the letters that include italic forms. Perhaps because it reflects a chaotic situation in terms of orthography at the time, it also includes a variety of iotified forms including the iotified yus. It includes some interesting information, such as that the fact that most of the books then in use were printed in Russia, where some of the letters not available were substituted, including yus with 'y' (p. 10).</p>
      <p>The italic yus, as far as I can tell from the low-resolution scan, simply looks like a slanted yus.</p>
      <p>That's all I could find so far, and I hope the Bulgarians here can provide more help on the italic forms of obsolete letters.</p>
