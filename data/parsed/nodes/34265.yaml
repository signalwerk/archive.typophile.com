      <p>Nick, I've got you <a href="http://upload.wikimedia.org/wikipedia/ru/4/4c/%D0%9F%D1%80%D0%B8%D0%BC%D0%B5%D1%80%D1%8B_%D0%95_%D0%B9%D0%BE%D1%82%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%BD%D0%BE%D0%B3%D0%BE_%D0%B2_%D0%B3%D1%80%D0%B0%D0%B6%D0%B4%D0%B0%D0%BD%D0%BA%D0%B5.gif" rel="nofollow">one</a>, although cursive, not italic. However, it's not a little yus, but a <a href="http://en.wikipedia.org/wiki/Big_Yus" rel="nofollow"><em>big</em> one</a> that was part of the Bulgarian alphabet until 1945. I believe, its <a href="http://en.wikipedia.org/wiki/Yus" rel="nofollow">iotated cousin</a> was also used in Bulgaria, until 1910s. There were attempts of using the <a href="http://en.wikipedia.org/wiki/E_iotified" rel="nofollow">iotated e</a> in Bulgarian writing in mid-19th century (those are highlighted in red in the picture I refer to). Also, there are some claims to the occasional use of the <a href="http://en.wikipedia.org/wiki/Ya_%28Cyrillic%29" rel="nofollow">iotated a</a> in the second half of 19th century. You're sure you want to go there?</p>
