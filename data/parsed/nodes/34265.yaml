      <p>You can’t write a substitution table, because some cases where ‘е’ is to be substituted by ‘ѣ’ results in multiple options, the choice amongst which is non-trivial and requires grammatical analysis of the sentence. The same can be said for other letters which appear in classical texts: ‘і’, ‘ѵ’, ‘ѳ’. Not only that, but the reforms of 1918 changed Russian grammar rules as well as spelling rules.</p>
      <p>That said, I've created an online services that inserts ‘ѣ’ and other letters, including Bulgarian ‘ѫ’, where they should be in Russian and Bulgarian texts using a combination of algorithmic substitutions and dictionary lookups. Where multiple options are available for one modern word, all choices are presented.</p>
      <p>You can access the Bulgarian interface at:  <a href="http://бъл.славеница.com/" rel="nofollow">бъл.славеница.com</a><br>
      Select Бъгларски - нови правопис and convert to Български - иванчевски правопис.</p>
      <p>ръкописна книга → рѫкописна книга</p>
      <p>For Russian, <a href="http://рус.славеница.com/" rel="nofollow">рус.славеница.com</a><br>
      Select Русский - новое правописание and convert to Русскій - петровское правописание.</p>
