      <p><em>it would be nice to have the additional Bulgarian letters appropriate for the period.</em><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Bulg2_6700.jpg"></div><p></p>
      <p>In this little section, there are a couple of iotified forms, so those, and possibly others, would have to be added too.<br>
      The accents could be done by the typographer.</p>
      <p>But who would use such a font?<br>
      For comparison, it would be like setting Shakespeare in English with long s's -- sure, it would be nice, and very authentic, but consider how little demand there would be for that -- despite the huge readership of Shakespeare -- and compare that with the number of readers of old Bulgarian! </p>
      <p>One would be better employed, as Adobe has recently done, extending Cyrillic support to cover further tens of millions of present-day readers/writers -- and is still criticized (on the Phinney blog) for its discretionary cut off-line that leaves out several languages.</p>
