      <p>Nick, I think Paul is referring to the Macedonian letters Gje (ѓ) and Kja (ќ), the Serbian/Macedonian letters Lje (љ), Nje (њ), and Dzhe (џ), and the Belarusian W (ў), none of which are used in Bulgarian.</p>
