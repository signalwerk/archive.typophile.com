      <p>What’s wrong with knowing spelling rules? Of your own, or a foreign language? Yes, in almost all languages there are many spelling conventions one could declare ‘a linguistic ballast‘… Say, why shouldn’t one spell <em>physics</em> as <em>fiziks</em>? That could work much better, right?</p>
      <p>Marcin, it looks like you know Russian. If you do, check that excellent <a href="http://www.elzabair.ru/cntnt/lmenu/biblioteka/lyubimye_s1/bajburin_a.html" rel="nofollow">essay on <em>yer</em></a> (the hard sign) written by Professor Albert Baiburin. It is very well written. I loved his quoting Leon Trotsky’s passionate rejection of <em>yat’</em>:</p>
      <ul>
      <li><em>The letter </em>yat’<em>, as well as </em>the hard sign<em>, the </em>fita<em> and the </em>izhitsa<em> belong to that nobility class in our alphabet which has been eliminated by the October Revolution. Those were unnecessary, redundant letters, of the parasitic-gentility kind. They’ve been done away with </em>[…]<em>. As to the other letters, which are truly necessary—they have no noble, parasitic lineage, but are indeed hard-toiling, working letters.’</em></li>
      </ul>
      <p>Ah! ça ira, ça ira, ça ira. Tous les signes durs on les pendra!</p>
