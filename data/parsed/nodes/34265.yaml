      <p>You are doing marvelous job…Most glyphs given as bulgarian alternates are in deed widely used with some remarks (as pointed by Jongseong). Additional notes may be pointed: all letterforms cyrillic  an “typical bulgarian” are used in hand writing, note the serbian small caps b which is also used as small caps d in hand writing. Note that the k and dj are still questionable, dough beautiful, because of latinisation issue…</p>
      <p>The open type question is little too hard for me – all the standart software, which we are using, is supporting it, but software produced in bulgaria doesn’t. But it could be implemented with proper support in the coming years, because the majority of pro oriented applications (bank software , accounting software, medicine and etc…) is still developed for DOS environments (yeah) and in the coming years they probably will shift platforms.  </p>
      <p>hrant</p>
