      <p>So HermesSoft are the only ones producing fonts in Bulgaria? That's rough... So what kind of Cyrillic types were produced in Bulgaria or used by Bulgarians historically, before digital fonts? How would those types be judged by today's Bulgarians?</p>
      <p>In your opinion, what constitutes good Cyrillic design on the Bulgarian model? Are there any good, thoughtful examples being produced--lettering, custom logos, calligraphy, etc.--that might point the way? Or any historical high marks--models from the past that epitomize good Bulgarian Cyrillic design--that could be a good springboard for a present renewal?</p>
      <p>Is there one model or a diverse range of models to follow for Bulgarian Cyrillic? Sorry to barrage you with questions, but I'm eager to learn about Bulgarian typographic traditions and the current scene.</p>
