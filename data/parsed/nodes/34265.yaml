      <p>The long s certainly did follow regular rules for its appearance. Essentially, the long s was used everywhere, with two exceptions: short s was used at the end of a word, and if s occurred twice in a row, the second one was a short s.</p>
      <p>However, since both the long and short s were forms of the letter S, and because the long/short s rules were regular, use of long and short s would be thought of, I would suspect, as part of "how you wrote" a word, not "how you spelled" a word, since how you spell a word is the sequence of letters of which it is composed. Thus, "princess" is spelled P - R - I - N - C - E - S - S even if when you write it in lowercase it looks like princefs.</p>
