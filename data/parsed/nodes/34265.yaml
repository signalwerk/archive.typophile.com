      <p>What’s wrong with knowing spelling rules? Of your own, or a foreign language? Yes, in almost all languages there are many spelling conventions one could declare ‘a linguistic ballast‘… Say, why shouldn’t one spell <em>physics</em> as <em>fiziks</em>? That could work much better, right?</p>
