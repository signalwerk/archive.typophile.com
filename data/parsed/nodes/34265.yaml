      <p>Sort of.<br>
      The general idea is to make the lower case less "capital-ish" than standard Cyrillic.<br>
      That applies at the alphabetic level to glyphs that acquire ascenders in the Bulgarian version, but also to the treatment of details.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/bulga_5512.jpg"></div><br>
      So the first changes shown here are alphabetic, but the second are typographic.<br>
      They don't effect sans fonts so much, or italic.<p></p>
      <p>BTW, this principle (as I deduced it) comes from fonts such as HermesSoft "Brilliant" (their Bodoni) -- although I have applied it in a conceptual manner (eg the flag on the "be"), as well as literal copying of their forms (the "en").</p>
