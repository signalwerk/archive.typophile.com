      <p>A million thanks for the beautiful examples, Nick! I remember being delighted to see wonderful books from the period in a number of exhibits in Ukraine, including the Taras Shevchenko Museum in Kiev. I don't speak Russian or Ukrainian, so it must have confused my Ukrainian friend why I was looking into them as if I were reading them, just admiring the forms of the letters...</p>
      <p>Returning to topic...</p>
      <p>By 'Old Bulgarian' letters, I meant Yat (ѣ) and Yus (ѫ), which were used in the pre-1945 orthography. You already have Yat, of course, so it turns out I was just thinking of Yus... I vaguely thought there might be more letters I was forgetting about, but I guess not. So just one more letter and you've got older Bulgarian texts covered. you can do it, Nick!</p>
      <p>p.s. I just found out that the pre-1945 Bulgarian orthography is due to one Marin Drinov, who studied and taught at Kharkiv University. He was living in Kharkiv around the time Adolf Darre was producing his types, and he died in Kharkiv as well. Just shows how important Kharkiv was as a cultural centre in that period.</p>
