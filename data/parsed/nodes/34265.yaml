      <p><em>I love the exercise phrases in that 1859 book.</em></p>
      <p>Charming, aren't they?</p>
      <p>What kind of needles has he brought from Hamburg? (p. 62)<br>
      When we were rich we also wore fine clothes. (p. 89)<br>
      From whom do you come? I come from the shoemakers. (p. 98)<br>
      Where are you going in this rain, in this bad weather, in this cold, in this dust? (p. 98)</p>
      <p>When I saw that you were doing a 19th-century revival, I thought it would be nice to have the additional Bulgarian letters appropriate for the period. After looking at the low-resolution samples online of Bulgarian printed texts from the period, I'm only more convinced that those letters would be excellent additions to your project.</p>
      <p>The typographic component of the Bulgarian revival seems to have owed a lot to the Cyrillic types produced in the Russian Empire, and the Adolf Darre typeface you chose is as good a representative as any. I confess I'm not really a fan of moderns for Latin type, but for Cyrillic this period style seems to work perfectly, with the vertical stress and prominent bulbs. I'm sure a quality digital revival will serve as a welcome source of inspiration for today's cyrillic type designers.</p>
