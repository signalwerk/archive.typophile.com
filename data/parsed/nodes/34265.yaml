      <ul>
      <li><em>Cyrilliza. So this is the correct name for this branch of the Cyrillic alphabet? Will people know what I'm talking about if I refer to my fonts as "supporting the Cyrilliza alphabet" ― or would it also be good to add</em> "(<em>Bulgarian</em>)"<em>?</em> </li>
      </ul>
      <p>Nick, in many Slavic languages, including Russian, <em>Кириллица</em> (reads ‘Kirillitsa’) stands for '<a href="http://ru.wikipedia.org/wiki/%D0%9A%D0%B8%D1%80%D0%B8%D0%BB%D0%BB%D0%B8%D1%86%D0%B0" target="_blank" rel="nofollow">Cyrillic alphabet</a>'. Likewise, <em>Глаголица</em> (‘Glagolitsa’) means 'Glagolitic', and <em>Латиница</em> (‘Latinitsa’) ― ‘Latin’ [alphabet, or script].</p>
      <p>Among non-Bulgarian designers the subject of this discussion is sometimes referred to, for lack of a better term, as <em>Болгарица</em> (‘Bolgaritsa’). However, by no means should it be mistaken for an official definition: it's a type designers' slang. There are a few nicknames of this kind, like <em>Armyanitsa</em>, <em>Gruzinitsa</em>, <em>Evreitsa</em>, <em>Arabitsa</em>, &amp;c.</p>
      <p>Sure enough, this is not a <em>branch of the Cyrillic alphabet</em>. It is a special pattern, an inflection of the l.c. glyph construction. The alphabet, or more correctly, the script, is still the same, Cyrillic. The character set is <a href="http://en.wikipedia.org/wiki/Bulgarian_alphabet#Bulgarian" target="_blank" rel="nofollow">Bulgarian</a>, of course.</p>
    html_clean: |-
      <ul>
      <li><em>Cyrilliza. So this is the correct name for this branch of the Cyrillic alphabet? Will people know what I'm talking about if I refer to my fonts as "supporting the Cyrilliza alphabet" ― or would it also be good to add</em> "(<em>Bulgarian</em>)"<em>?</em> </li>
      </ul>
      <p>Nick, in many Slavic languages, including Russian, <em>Кириллица</em> (reads ‘Kirillitsa’) stands for '<a href="http://ru.wikipedia.org/wiki/%D0%9A%D0%B8%D1%80%D0%B8%D0%BB%D0%BB%D0%B8%D1%86%D0%B0" target="_blank" rel="nofollow" class="link-external">Cyrillic alphabet</a>'. Likewise, <em>Глаголица</em> (‘Glagolitsa’) means 'Glagolitic', and <em>Латиница</em> (‘Latinitsa’) ― ‘Latin’ [alphabet, or script].</p>
      <p>Among non-Bulgarian designers the subject of this discussion is sometimes referred to, for lack of a better term, as <em>Болгарица</em> (‘Bolgaritsa’). However, by no means should it be mistaken for an official definition: it's a type designers' slang. There are a few nicknames of this kind, like <em>Armyanitsa</em>, <em>Gruzinitsa</em>, <em>Evreitsa</em>, <em>Arabitsa</em>, &amp;c.</p>
      <p>Sure enough, this is not a <em>branch of the Cyrillic alphabet</em>. It is a special pattern, an inflection of the l.c. glyph construction. The alphabet, or more correctly, the script, is still the same, Cyrillic. The character set is <a href="http://en.wikipedia.org/wiki/Bulgarian_alphabet#Bulgarian" target="_blank" rel="nofollow" class="link-external">Bulgarian</a>, of course.</p>
