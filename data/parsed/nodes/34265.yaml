      <p><em>the Macedonian letters Gje (ѓ) and Kja (ќ), the Serbian/Macedonian letters Lje (љ), Nje (њ), and Dzhe (џ), and the Belarusian W (ў), none of which are used in Bulgarian.</em></p>
      <p>They are not, in practical terms, redundant -- one context for the use of "loan characters" in a font being educational. If you are typesetting a Bulgarian language primer on foreign languages such as Serbian or Macedonian, you will need all of their alphabet, and the characters should be available in the same style as the main font.</p>
      <p>And in literary works, if the text is in Bulgarian, but quoting a Serbian author in his/her original language, the foreign characters are necessary. </p>
      <p>And surely Brian, in those contexts, the use of Bulgarian style--typographic as well as alphabetic-- is authentic.<br>
      For Russian, Serbian, etc. typesetting, people wouldn't be getting any of the Bulgarian alternates.</p>
