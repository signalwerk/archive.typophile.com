      <p><em>What about the “iotified” version — that would be very cool as it looks like a stick-figure animal, but is it necessary for the pre 1945 Bulgarian texts you’re alluding to?</em><br>
      Not as far as I know. Though I agree it looks like an animal shape composed of matchsticks, and would be fun to design just because.</p>
      <p>New question for Bulgarians (and other native Cyrillic users): I came across <a href="http://www.sbible.boom.ru/slavpdf.htm" rel="nofollow">this page with PDF files of the Bible in Church Slavonic</a>. Does the style of Cyrillic used there have specific connotations as being appropriate only for religious literature or recreations of mediaeval texts? Or does it have broader appeal?</p>
      <p>I'm thinking of a possible parallel example in Korean typography. The older Hangul (Korean alphabet) Bibles--the ones where the text is set vertically, not horizontally as Korean is written now--were set in a typeface designed by Seo Sangryun and Baek Hongjun in the late 19th Century and first used for printing in 1882. Because of the drab uniformity of Hangul book typefaces in contemporary use, the unique type style of old Korean Bibles is all the more distinctive.</p>
      <p>In 1998, the Sandoll foundry produced <a href="https://www.sandoll.co.kr/SandollWeb/shop/product_down_read.asp?idx=182&amp;listType=2" rel="nofollow">a digital revival</a> of this typeface under the direction of Lee Kyungbae, calling it Seonggyeongche (literally, 'Bible face'). Since then, I've seen it pop up on book covers, advertisements, and signs in uses that have nothing to do with the Bible. Although it was jarring at first, I've become accustomed to the type style being used in wider applications. Although the uses I've seen were all for display purposes, I even think a cleaned-up version would be good for contemporary book typography (as the Sandoll version is deliberately rough in imitation of the antique printing press outputs).</p>
      <p>With the type style used for Church Slavonic typography, you similarly have a slice of older typographic history preserved through the conservative medium of religious literature. Is there a similar situation in Bulgaria and elsewhere where that type style is used for display purposes outside of the church context? To what extent could the style serve as an inspiration for contemporary developments in Cyrillic typography?</p>
    html_clean: |-
