      <p>It is true that Church Slavonic is sometimes called Old Bulgarian, and that Russia and Bulgaria have had their own independent historical development of the Cyrillic letterforms.</p>
      <p>But to go from there to criticizing Russian influence on Bulgarian type design as somehow inauthentic seems to be lacking something. Do people complain when Optima is used to set English texts as well as German ones, or when Bodoni is used to set French texts as well as Italian ones? No; it is recognized that from Poland to Spain, people are all using the same Latin alphabet, even if with slightly different sets of accented letters, and so of course they have the same pool of typefaces to choose from - even if different letter frequencies might make some typefaces more aesthetic in conjunction with some languages.</p>
      <p>Bulgaria, Serbia, the Ukraine, Belarus, and so on share the Cyrillic alphabet with Russia. Here, some of the languages actually have additional letters, so the diversity is somewhat greater. But it is still not a question of trying to shoehorn one alphabet into the typefaces made for another - i.e., to take an Armenian typeface, and try to use those exact forms and styling for Amharic or Gujarati or Greek or Cyrillic or Latin.</p>
