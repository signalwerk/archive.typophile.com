      <p>Dear Marcin, </p>
      <p>I am not sure what you mean by ‘linguistic ballast’. In early 19th-century Russia using yat’—and also the decimal i, the fita, the izhitsa, the terminal yer, all abolished in 1918—was not an option. For sure, Pushkin did not use the yat’ ‘as a tool of poetry’; b.t.w., he also used it in his prose, his essays, his correspondence, his notes, his diaries, etc. He simply followed the standard spelling rules used in his times. </p>
      <p>F.y.i., the <a href="http://www.cms4site.ru/ru-joke-13-1917.html" rel="nofollow">pre-1918 spelling</a> is <em>still used</em>—in Russia and world-wide—in clerical literature, scholarly print, even <a href="http://lib.russportal.ru/index.php?id=index" rel="nofollow">general publishing</a>. This is why the letters whose use was officially discontinued in 1918 are often included in the digital Cyrillic fonts.</p>
