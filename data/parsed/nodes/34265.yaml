      <p>I introduced confusion. I know, that Lomonosov stated that the difference between sounds of Ѣ and e was barely unrecognisable. For me it looked like the evolving language started to throw the ballast away. But the rest of my post was overinterpretation. Old spelling rules were ubiquitous at the time (and they come back as we've seen), so yat' should be included in good Cyrillic font. </p>
      <p>Let me quote this photo as my self-ironic dedication to you, Mr. Maxim. Thank you.</p>
