      <p>In actuality those revolutionary sailors came and trashed <em>all</em> yers—both upper and lower case, from all compositors’ cases, and all matrices from all single-letter- and line-casting machines, from all composing rooms—nation-wide. When they recovered themselves it was too late: all yers were gone, and even if some have been left, no one would have dared using them. So they started using single or double apostrophe for the separating hard sign (e.g., <em>под’ем</em> instead of <em>подъем</em>); that felt both space-saving and politically correct. Here is a fragment of an old memorial plaque I photographed in downtown Moscow two years ago:<br>
