      <p>With OpenType, this is not so much an issue for the type designer, more for the type user.<br>
      That's because it's possible to put "country-specific" variants of the Cyrillic alphabet in the same font. What's specified as the default for a specific language may be an issue, however. </p>
      <p>I've been developing some new typefaces (to be released this Fall/Autumn) in Cyrillic and Greek, and following a seminar given by Maxim Zhukov, I became aware of the Bulgarian issue. So I've included a Bulgarian "language specific" option to the standard Cyrillic letterforms in the fonts. Serbian too.</p>
      <p>So while the basic Cyrillic typeface (below) is a fairly authentic 19th century revival (close to a type published by Adolf Darre in Harkov in 1888) the Bulgarian alternates are "historical fiction" based on a study of fonts published by HermesSoft. Given the logic of typographic style, and its relative portability across cultural (well, Latin-Greek-Cyrillic anyway) and temporal boundaries, that seems reasonable.</p>
      <p>Here is the upright style of the serifed face, which shows the most distinction between standard and Bulgarian Cyrillic forms:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bulg_3601.jpg"></div><p></p>
      <p>To clarify how this works: when the language used in the layout application is specified as Bulgarian ("BGR"), the Bulgarian alternates are substituted.</p>
