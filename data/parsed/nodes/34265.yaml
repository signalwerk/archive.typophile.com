      <p>One of his master students was <a href="/wiki/Ilia%20Gruev" class="freelinking" rel="nofollow">Ilia Gruev</a>. So far he have done some really good text typefaces: Graphit, Scribo and Memo. But to the western (internet) world, unkown. </p>
      <p><a href="http://www.moire.info/en_shrift_i_1.html" title="http://www.moire.info/en_shrift_i_1.html">http://www.moire.info/en_shrift_i_1.html</a></p>
