      <p>In his article on <a href="/wiki/civil%20type" class="freelinking link-lost" rel="nofollow">civil type</a> in <em><a href="/wiki/Language%20Culture%20Type" class="freelinking link-lost" rel="nofollow">Language Culture Type</a></em>, From <a href="/wiki/Vladamir%20Yefimov" class="freelinking link-lost" rel="nofollow">Vladamir Yefimov</a> states that "at the end of the 17th century, <em><a href="/wiki/poluustav" class="freelinking link-lost" rel="nofollow">poluustav</a></em> was the only style of Cyrillic printing type," and that after the alphabet reform by Tsar Peter I, "the old <em>poluustav</em> type was preserved only for religious literature." (pp. 128-129)</p>
      <p>I'm guessing that this means that the style you're referring to could either have church connotations or overtones of antiquity (not necessarily religious). I have several illustrated books of <em>skazki</em> (folktales), which use this style of lettering in illustrations, and there is definitely no religious connection there.</p>
