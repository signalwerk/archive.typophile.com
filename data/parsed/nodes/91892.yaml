    html: |-
      <p>It is true that the letters of the alphabet are abstractions. A particular impression of a letter on a particular piece of paper, whether through printing or writing, is something concrete.</p>
      <p>A typeface is also, to a limited extent, abstract, but it closely defines a particular physical realization. (And if one is picky about the "correct" meaning of font, a 20a pile of lead, or a computer file ending in .otf, is something concrete too, although not a written representation of a letter.)</p>
