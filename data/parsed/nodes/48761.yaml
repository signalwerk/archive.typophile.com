    <p>Alright, InDy is my b***h, but I can’t crack this one: the resize icons and other features are missing from the bottom of the Glyph palette. It disappeared about a week ago, and I can’t get it back. I’ve tried opening from the “Type” menu, from the “Window” menu; had it in the palette dock, ripped it out. Checked out the fly-out menu on the glyph palette. Nothting. App and OS restarts aplenty, too. </p>
    <p>I never considered it to be too important, but I really miss this feature! Any ideas?</p>
    <p>ID CS3 on Mac OS X.4.11 (Intel).</p>
    <p>Thanks in advance for any help.</p>
