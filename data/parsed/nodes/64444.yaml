      <p>Hello,</p>
      <p>Couple of years too late, but maybe can help someone.<br>
      It is possible to move component inside MM font. I made those based on typical fontlab scripts. Karsten Lucke have some nice MM helpers.</p>
      <p>Here comes code, dont forget indetation in the "for loop" and if/else.</p>
      <p>PS. Does someone have a good method how to "append" a component inside MM fglyph?<br>
      I've tried many methods, but so far no luck.<br>
      Anton<br>
      #--------------------------------------------------</p>
      <p>#FLM: Move MM compnt 1<br>
      # made by AK 2010<br>
      # to move component in single master</p>
      <p>from FL import *<br>
      from robofab.world import CurrentGlyph<br>
      rfg = CurrentGlyph()</p>
      <p>g = fl.glyph<br>
      m = fl.master</p>
      <p># here specify amount and what to move<br>
      xmov = -50<br>
      # first identify FL component index! Name wont work.<br>
      compnt = 14</p>
      <p>print "master:", m</p>
      <p>for n in g.components:<br>
         if n.index == compnt:<br>
             print "there is specific compnt to move"<br>
             n.deltas[m].x += xmov<br>
         else:<br>
             print "use compo tester to get to know:"</p>
      <p>fl.UpdateGlyph()<br>
      print "manipul in action"	</p>
      <p>'''<br>
      ##<br>
      '''</p>
