      <p>As far as I know, RoboFab is not able to deal with individual instances in a multiple master file. You might be able to achieve your goal by using FontLab’s native Python implementation instead.</p>
      <p>Otherwise, why not use anchors for placing accents? If done correctly it will save you the hassle of dealing with individual accented glyphs.</p>
      <p>-Paul van der Laan<br>
      <a href="http://www.type-invaders.com" title="www.type-invaders.com">www.type-invaders.com</a></p>
