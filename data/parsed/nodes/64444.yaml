  html: |-
    <p>I'm tying to make a small script with robafab far a multiple master Font.<br>
    Basically my script will move a component inside a diacritic glyph.</p>
    <p>For intance moving the "acute" accent inside "oacute".<br>
    This is the script:<br>
    ____________</p>
    <p>from robofab.world import CurrentFont<br>
    f = CurrentFont()</p>
    <p>g = f["oacute"]<br>
    g.components[1].move((-100,-100))<br>
    ____________</p>
    <p>The problem is:<br>
    Since my font is a multiple master with two weight masters, when I run this script, it moves the accent in the both masters.</p>
    <p>Is there any way to move the accent only in one of the masters?</p>
    <p>Thanks in advanced.</p>
