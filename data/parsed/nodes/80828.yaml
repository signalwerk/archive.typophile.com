    date: 2011-04-06T06:39:00
    votes: null
    html: <p>I think the horizontal chamfer of the /A/ is okay to keep (it actually has a sort of rhyme with the "eaves" of the roof), but I would experiment with making it align horizontally with the roof peak.</p>
  - id: 458996
    user_id: 65389
    user_name: Luma Vine
    user_path: null
    user_image: /files/pictures/picture-65389.gif
    date_raw: 6 Apr 2011 — 11:02am
    date: 2011-04-06T11:02:00
    votes: null
    html: <p>The edge of the path looks awfly sharp at the bottom right, maybe make it less accute?  Also, moving the A to the left a bit to align with the roof peak will make it feel more centered, and the 'center of gravity' of the letter will sit more centered on the house as well.  I would also still explore a complimentery sans serif for the subtitle.  Sorry if I am basically repeating what others said!</p>
