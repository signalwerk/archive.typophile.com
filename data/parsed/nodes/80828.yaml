    html: <p>Here is the logo reworked just a bit. I redrew the path so it wasn't as harshly cut off and I also did one version with a pointed apex. I am still working on a pairing for the sans serif, anyone have any recommendations? What do you guys think?</p><div class="imageWrap"><img src="http://typophile.com/files/veljovic-bold_3742.jpg"></div><p></p>
