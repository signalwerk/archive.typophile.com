    html: <p>Tim, the whole rason that the slab-blackletter challenge was so hard was because in most blackletter designs, the pen is held at a 45-degree angle (or somewhere around there), while slab serif typically have thick rectangular serifs at 90-degree angles, reinforcing baseline, x-height, etc. You're blackletter looks sweet, ahd has heavy serifs, but they aren't slab serifs. To make a blackletter a slab serif, you have to break it a little bit, so it isn't blackletter anymore.</p>
