    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/mynaruse/" rel="nofollow">Mynaruse</a> is an elegant and regal roman inscriptional titling family. It has sharp and elongated serifs that give the face extra punch. The face shines in settings that call for elegance and splendor. Mynaruse’s six weights range from a fine, delicate thin to a powerful and solid heavy weight.</p>
    <p>Mynaruse includes many useful OpenType features, including a set of swash alternates, alternate titling forms, ligatures and miscellaneous alternates.</p>
    <p>OpenType-capable applications such as Quark or the Adobe suite can take full advantage of the automatically replacing ligatures and alternates. This family also includes the glyphs to support a wide range of languages.</p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/mynaruse/" rel="nofollow">Mynaruse</a> is 1/3rd off for a limited time!</p>
