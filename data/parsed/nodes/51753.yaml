      <p>Honestly, I think it would probably be harder to find a serif that doesn’t look hot next to Trade Gothic. That just-on-the-edge-on-neogrotesqueness of Trade Gothic makes it like DIN; you can stick it next to anything and they’ll either sing together or create some quirky relationship that brings out all of the eye candy in both faces. Don’t worry about the details, just treat Trade like the streets of Vegas where the whores’ charms come out and they all look good.</p>
      <p>•Try using it with HTF Didot and constantly invert the hierarchy so that you get the best of both worlds by working the type at different faces.<br>
      •Work it against those sweet brush strokes in Dolly.<br>
      •Set all of the text in some really sweet Slimbach italic or Cataneo to build an extreme contrast into the hierarchy.</p>
