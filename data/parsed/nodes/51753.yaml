      <p>Chris, it's for a large body of text, somewhere between magazine and newspaper (newspaper articles reduced to magazine format - a bit like The Week magazine). And thanks for your suggestions James; I have a feeling you're a passionate Trade Goth ...<br>
      I like Didot, but find it a bit 'fussy' and ostentatious for text. I can see what you're saying about Dolly - but unfortunately money's a problem.  What do you folks reckon about Kepler or Utopia?</p>
      <p>Thanks heaps - this is awesome!</p>
