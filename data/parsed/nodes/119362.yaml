    html: |-
      <p>In 1935 a New York hospital would have most probably have used typewriters from US companies such as Underwood,  Remington, Smith Premier etc.<br>
      At the scale of your image I can't tell you the make or model used.</p>
      <p>Details of typefaces used by these and other companies changed over the years. Some key letters to check are _4_, whether open or closed -- your sample is closed and _3_ -- whether round top or flat top -- your sample is flat top. Also whether the _g_ is one story, i.e. with a tail like a hook  or two story, i.e.  with a closed bowl at the bottom, like a pair of glasses -- your sample is two story. There are other features of your sample that you could seek to duplicate, like the ball at the end of the tail at the top of _6_, but most people would not notice this.</p>
      <p>If you want to duplicate the feel of a typewriter you need a monospaced font. If the font does not say then check the sample text _NMW_ or _nmw_. The _M_ and _W_ should look squeezed so that the type key width is the same as _N_. All keys are the same width, so in a monospace typewriter font the _I_ and _i_ usually have very wide serifs to fill the space.</p>
      <p>Some monospace fonts that would work as substitutes:<br>
      LTC Remington Typewriter, [no obvious discrepancies, a fairly high probability that this was the make used, &amp; very cleanly engineered font] <a href="http://www.myfonts.com/fonts/lanston/ltc-remington-typewriter/" title="http://www.myfonts.com/fonts/lanston/ltc-remington-typewriter/">http://www.myfonts.com/fonts/lanston/ltc-remington-typewriter/</a> Includes an italic designed by Frederic Goudy in 1927.<br>
      Remington Elite [wrong _3_, but a fairly high probability that this was the make used, &amp; very cleanly engineered font]<br>
      <a href="http://www.myfonts.com/fonts/intellecta/remington-elite-typewriter/" title="http://www.myfonts.com/fonts/intellecta/remington-elite-typewriter/">http://www.myfonts.com/fonts/intellecta/remington-elite-typewriter/</a><br>
      Underwood Typewriter  [no obvious discrepancies, a fairly high probability that this was the make used, &amp; very cleanly engineered font]<br>
      <a href="http://www.myfonts.com/fonts/intellecta/underwood-typewriter/" title="http://www.myfonts.com/fonts/intellecta/underwood-typewriter/">http://www.myfonts.com/fonts/intellecta/underwood-typewriter/</a> also <a href="http://www.myfonts.com/fonts/t26/underwood-typewriter/" title="http://www.myfonts.com/fonts/t26/underwood-typewriter/">http://www.myfonts.com/fonts/t26/underwood-typewriter/</a><br>
      Smith Premier NF [no obvious discrepancies &amp; very cleanly engineered font]<br>
      Intellecta Typewriter [no obvious discrepancies]<br>
      <a href="http://www.myfonts.com/fonts/intellecta/intellecta-typewriter/" title="http://www.myfonts.com/fonts/intellecta/intellecta-typewriter/">http://www.myfonts.com/fonts/intellecta/intellecta-typewriter/</a><br>
      Bulletin Typewriter [no obvious discrepancies]<br>
      <a href="http://www.myfonts.com/fonts/itfmecanorma/bulletin-typewriter/" title="http://www.myfonts.com/fonts/itfmecanorma/bulletin-typewriter/">http://www.myfonts.com/fonts/itfmecanorma/bulletin-typewriter/</a></p>
      <p>If you do not need a monospace font a good generic substitute is ITC American Typewriter <a href="https://www.myfonts.com/fonts/adobe/itc-american-typewriter/" title="https://www.myfonts.com/fonts/adobe/itc-american-typewriter/">https://www.myfonts.com/fonts/adobe/itc-american-typewriter/</a> </p>
      <p>I did not include grunge or distressed faces. IMHO they are a waste of time for recreating documents.</p>
      <p>Update:<br>
      Deleted possibly controversial comment.</p>
      <p>Update:<br>
      I don't know if these otf fonts can be used on a Mac. If not there is always Courier,despite the  one story _g_.<br>
      Don</p>
