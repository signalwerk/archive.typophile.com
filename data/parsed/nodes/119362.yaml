      <div class="comment-spam-body"><p>So is Frank Spano a notorious gangster? His occupation -- hand written, not typed -- is "ice dealer." I've heard of "putting someone on ice" as an euphemism for killing them...<br>
      There is a role playing game, Speakeasy Dollhouse, that includes the comment "a speakeasy owner named Frank Spano, was shot."<br>
      ---game explanation quote---<br>
      The show is the brainchild of artist and author Cynthia von Buhler, whose Italian immigrant grandfather, a speakeasy owner named Frank Spano, was shot and killed on a Manhattan street in 1935. Though the shooter was caught, his case was inexplicably dismissed, leaving the question of motive forever unanswered.<br>
      ---end game quote---<br>
      source <a href="http://www.brownpapertickets.com/event/214593" title="http://www.brownpapertickets.com/event/214593">http://www.brownpapertickets.com/event/214593</a></p>
      <p>Perhaps this specimen is a prop?</p>
      <p>Don</p>
      </div>
