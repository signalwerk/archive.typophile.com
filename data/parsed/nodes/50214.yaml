      <p>I can think of 2 serif fonts with E’s like this: <a class="freelinking-external" href="http://www.myfonts.com/fonts/letraset/eplica/">Eplica</a> and <a class="freelinking-external" href="http://www.fontshop.com/fonts/downloads/psyops/aquamarine_smallercaps_roman_ligatures/">Aquamarine</a>. (I think Aquamarine has alternate letters that may match the A better.)</p>
      <p>Some other fonts, like <a class="freelinking-external" href="http://www.fontshop.com/fonts/downloads/creative_alliance/cg_hollandse_mediaeval_signature_virtual/">Hollandse Mediaeval</a>, might match the other letters better.</p>
      <p>- Mike Yanega</p>
