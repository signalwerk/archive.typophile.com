      <p>hmm Ive been trying to get hold of a variation of  otik used in this poster</p>
      <p><a href="http://www.deappel.nl/exhibitions/e/689/1/2/" title="http://www.deappel.nl/exhibitions/e/689/1/2/">http://www.deappel.nl/exhibitions/e/689/1/2/</a></p>
      <p>I emailed the designer, felix weigand, but had no reply.</p>
      <p>any suggestions?! have also emailed karl Nawrot to confirm the name of the font but I dont know if it is too much to ask if I can buy/download the font directly from him? feels like it might be overstepping the mark a bit! </p>
      <p>pavels and florian-maybe the werkplatz students/alumni only circulate the font between themselves? Nawrot has designed a few typefaces that I would love to get my hands on but get the feeling he only shares with his peers!</p>
