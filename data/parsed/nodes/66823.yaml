    html: |-
      <p>Have you tried contacting one of the Werkplaats students involved?<br>
      This is most likely custom. And there’s more than 1 style: ‘Deutschland im Herbst’ started out as Helvetica. The ‘M’ in ‘Dramlet’ looks DIN-ish. The ‘C’ is closer to Neuzeit Grotesk than Avant Garde Gothic. It’s a complete smörgåsbord.</p>
