      <p>If you have such a great desire for a great 'g', would you not be better off having the whole logo created anew from the get-go, as original art? That way you have control of the whole project. You can get versions that will work large, small, reversed, 4-colour, 2-colour, screen, billboard, etc.</p>
      <p>Then you can devote your energy to finding the corporate typeface that will pair best with your brand-new, original, unique logo.</p>
      <p>We have a lot of types to choose from, but that does not mean that the right 'g' for this logo exists among all the sorts for all those faces.</p>
      <p>So find a good letterer to create your logo. There's a strong heritage of working that way.</p>
      <p>powers</p>
