    <p>typeface advice request: sans serif for rebrand — I need a great 'g'!</p>
    <p>This is a request for help. I will appreciate your offers of advice. I am redesigning an existing logo, the concept will stay the same, but I am changing the typeface. Currently it is Trebuchet and it is weak and unbalanced. </p>
    <p>I cannot say what the actual letters are due to a confidentiality agreement, but there are two lowercase 'i's, an uppercase 'S', and a lowercase 'g' in the name. As the only descender in the word, the 'g' will garner the most attention. </p>
    <p>I would very much appreciate suggestions for a solid sans serif, strong and forward thinking. This company is creating cutting-edge communications technology, I aiming for strength, clarity, spaciousness, and professionalism. And a great lowercase 'g'. </p>
    <p>Ideally I would like a face that has a strong family that I can use as their corporate typeface, or perhaps a great pairing of a family with a face used only in the logo. </p>
    <p>I look forward to hearing some opinions!</p>
