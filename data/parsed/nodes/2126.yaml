    html: <p>I just thought of a potential loophole in your teacher's "rule". <br>If you could just get him to drop the 2-point leading requirement (try to think of a good excuse for that, like short lines), what you could do is use a font that's wide but small on the body, with zero (or maybe even negative) leading. That way you'll have a "12 point" font ("Just look, Quark says it's 12 point!"), but you could use width/size instead of narrowness to save space. <br> <br>hhp <br></p>
