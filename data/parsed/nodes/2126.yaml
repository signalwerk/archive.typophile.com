    html: "<p>It might seem counter-intuitive, but narrowness actually results in less economy than a wide face! <br>(Except in one-line settings.) <br> <br>The reasons are that: <br>1) A wide face can be used at a smaller point size while maintaining (and possibly even improving* on) apparent size. <br>2) Linebreaks in text will often negate the culmulative horizontal savings a narrow face accumulates over many lines. A wider face at a smaller point size always saves in vertical space. <br> <br>* This I still have to verify. <br> <br>So a narrow face will only be more economical than a wide face -at a smaller size- if your text has very few linebreaks. <br> <br>However, wide faces can convey less elegance/sophistication than a narrow face (like see the new LA Times body face), so a good reason to use a narrow font to save space would be if you want to convey a certain atmosphere. And note that a good narrowness/width depends on the point size (more like point size <i>range</i>) you're using. <br> <br>Anyway, if you do decide on a narrow font, try Stone Print. <br> <br>hhp <br></p>"
