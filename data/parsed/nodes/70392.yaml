      <p>&gt;I do know how to punctuate</p>
      <p>When folks come on Typophile with eccentric capitalization or punctuation, they are almost always recently out of school. And no successful pro that I have seen on Typophile does this kind of thing. Why? I think it's because they understand that not following the conventions puts a distraction or barrier in the way of the reader. To the writer it may look adventurous, but to many readers it is off-putting, and signals being wet behind the ears, or a crank. </p>
      <p>&gt;is he the only visible African American in this profession?</p>
      <p>Darden is certainly the most prominent in type design. I don't know him and don't know if his ethnicity had any affect on his career. You could ask him.</p>
