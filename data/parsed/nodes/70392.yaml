      <p>&gt; think your background could be an advantage<br>
      &gt; given the lack of minorities involved in type design. </p>
      <p>I don't know the statistics, but my impression is that there's a lack of minorities in the entire field of graphic design. This could work to your advantage, especially in corporate jobs. On several occasions over the years I've had people at corporations ask me if I could suggest minority candidates for design jobs, because they weren't getting minority applicants.</p>
      <p>As others have said, you may find it difficult finding a job doing just type design, so you might end up having a day job in a design department and then do type design evenings and weekends until you build up enough business that you can do it freelance full time.</p>
