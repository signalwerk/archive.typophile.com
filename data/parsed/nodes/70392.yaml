      <p>Nobody is going to give you a job doing type design, although there IS a demand for font production workers.<br>
      So to make a living at type design you will have to become an entrepreneur.<br>
      I suggest you leave the USA (see <a href="http://www.coldtype.net/Assets.10/Pdfs/0510.Reader46.pdf" rel="nofollow">this</a> article, page 17), for a place where people of colour suffer less discrimination, where there is universal healthcare, &amp;c., &amp;c, and live away from a big city, where there is a low overhead and a decent standard of living--as long as high speed internet is available! Then you will be able to make a living from selling fonts on MyFonts, as you build up your catalogue of type designs.<br>
      As for racial discrimination, you may find it looking for a job, but not when someone is licensing a font, because who designed it is not generally part of the business decision, so again, be an entrepreneur, don't look for a job.<br>
      Where would you like to live?</p>
