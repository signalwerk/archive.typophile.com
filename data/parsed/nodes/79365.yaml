    html: <p>It's a perfect example of a signwriter's "<a class="freelinking external" href="http://new.myfonts.com/search/gaspipe/fonts/" rel="nofollow">gaspipe"</a> or "stove pipe" lettering. Not based on a typeface but based on a simple, modular grid. I love the wonkiness here. That H is far too narrow.</p>
