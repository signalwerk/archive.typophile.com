      <p>Yep. They're using the <a href="http://webfonts.fonts.com/" rel="nofollow">web fonts service from fonts.com</a>. </p>
      <p>Here's a little geekier info from their <a href="http://webfonts.fonts.com/en-US/support/FAQ" rel="nofollow">web fonts FAQ</a></p>
      <blockquote><p>
      <strong>In what format is the font data transmitted for which browser?</strong><br>
      Font data may be transmitted in EOT, WOFF, SVG or TrueType® formats. The font format that is served is dependent upon the visitor’s browser. </p>
      <p><strong>How is the font data delivered?</strong><br>
      Font data is deployed globally across a Content Distribution Network (CDN). When someone visits your Web font enabled Web site, the font data that you’ve licensed and implemented (using the Fonts.com Web Fonts portal) on that page will be delivered to the visitor's temporary browser cache. It will remain there until the visitor's browser session has ended, at which time it will automatically be removed from their system.
      </p></blockquote>
