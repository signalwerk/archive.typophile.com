    <p>The FCC just relaunched their web presence with a <a class="freelinking external" href="http://beta.fcc.gov" rel="nofollow">new BETA site</a> yesterday.  Interestingly, there is a very nice general tightening up of the brand across the board, and they are utilizing Trade Gothic Extended quite prominently.</p>
    <p>I'm curious if any code ninjas could let us know how they are pulling this off ?</p>
