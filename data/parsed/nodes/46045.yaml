    html: <p>I would personally suggest tweaking a mix of <a href="http://www.myfonts.com/search?search%5Btext%5D=Rockwell">Rockwell</a> or <a href="http://www.myfonts.com/search?search%5Btext%5D=memphis">Memphis</a> (for the I, E) with <a href="http://www.myfonts.com/fonts/urw/heldustry/">Heldustry</a> for the rest.</p>
