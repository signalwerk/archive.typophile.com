  - id: 282095
    user: 32017
    date: 2008-06-04T06:09:00
    date_raw: 4.Jun.2008 6.09am
    votes: null
    html: <p>Great suggestions — one tricky thing though. As a student with no cash, I wonder if there are any fonts I could use that come standard with the Adobe CS3 suite. Rockwell is in that list, so the I &amp; the E should work there. Any suggestions on the other letters from the standard fonts?</p>
    html_clean: <p>Great suggestions — one tricky thing though. As a student with no cash, I wonder if there are any fonts I could use that come standard with the Adobe CS3 suite. Rockwell is in that list, so the I &amp; the E should work there. Any suggestions on the other letters from the standard fonts?</p>
  - id: 282113
    user: 26908
    date: 2008-06-04T06:51:00
    date_raw: 4.Jun.2008 6.51am
    votes: null
    html: <p>Although not CS3 package fonts, Eurostile or Helvetica (or Swiss 721) may be your closest bet for fonts you already have. I think Eurostile is closer (at least in the bowls of the D, R), but the terminus of the leg of the R looks like Helvetica’s.</p>
