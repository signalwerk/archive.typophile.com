  html: |-
    <p>I realize WIRED probably has their own custom font designed.  But I’m looking to come as close as possible to that font for a knockoff (spoof) project I have.  You probably already know what it looks like, but you can see the type here: <a href="http://www.wired.com/" title="http://www.wired.com/">http://www.wired.com/</a></p>
    <p>Not worried about colors/shading, just the font.</p>
    <p>Thanks so much!</p>
