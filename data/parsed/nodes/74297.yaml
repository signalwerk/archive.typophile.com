      <p>I agree, none of your options are very inspirational looking. They all feel super web "cheap &amp; chinsy".</p>
      <p>I feel it's more due to the fact that they have that plastic 3D logotype design, using the apple 'glassy' appearance. It doesn't translate well to your logo, and gives a real 2000's web 2.0 cachet, which puts me off to all of the options. I see what you were trying to go for, but I just don't think you should push the company's image in that direction, I think they'd probably want something flatter and more defined. </p>
      <p>Hope that helps-</p>
