      <p>First of all, you might really regret using double x's in the company name. It's likely to cause all kinds of search engine problems, not to mention give people pause before visiting your website. Overcoming the x-rated connotation of "xx" isn't something I'd want to deal with as a new company.</p>
      <p>That said, none of the logos stand out. Sorry, but they're all web 2.0 glassy cliches. Oh, and whatever you do - with the xx, don't use <a href="http://i1000.photobucket.com/albums/af123/europhreak/logo/www48hourslogocom2010-9-148-51e.png" rel="nofollow">this one.</a> It evokes....ah....well, the manparts of a smurf.</p>
