      <p>I think it is safe to say this is not resonating with us. :) But how many other ideas have you tried? These are all basically the same idea in slightly different arrangements.</p>
      <p>"Mad" and "box" give you quite a lot to work with. Why not give another couple ideas a go and post them here again! I for one would be interested to see what else you've got. </p>
      <p>I could get you started with the obvious idea of a red box, and he's maaaaddd... ;)</p>
      <p>You could also try for something simpler, and perhaps a reference to what you do? Code has all kinds of cool conventions that make good typographical ideas.</p>
