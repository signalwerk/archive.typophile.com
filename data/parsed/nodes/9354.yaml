  html: "<p>Buffalo, NY  - February 16, 2005 <br> <br>The \"Clifford Family\" of Script fonts. <br>- New additions to the Sherwood Collection from P22 type foundry. <br> <br> <br>The Clifford Bible, an historical novel by typographer Ted Staunton, traces seven generations of the Clifford family from entries on the flyleaves of an old family Bible. This collection of fonts, generated to augment the text, reflects some of the stylistic transitions that evolved over that period. <br> <br>The development of the Clifford Family paralleled typographer Ted Staunton�s authorship of a historical novel, The Clifford Bible. In the period between the English Civil War (1640s) and the Victorian Era (1839-1901), seven generations of the Clifford family recorded significant aspects of their lives on the flyleaves of their family Bible. Over that time, their handwriting made stylistic transitions from gothic to copperplate, reflecting cultural influences and the characteristics imparted by the writing instrument- from the quill to the steel nib. The personalities of the family members are glimpsed through their handwriting, providing graphological researchers with clues for the last survivor of the Clifford line to interpret an ancient prophecy and claim his rightful inheritance. <br> <br>Each distinctive writing style was reconstructed as a font for Mr. Staunton's Book Project, but the availability to the public is a welcome addition to designers in search of authentic historical handwriting fonts. The fonts will be available for sale on March 1, 2005 exclusively through P22 type foundry's Sherwood Type Collection division. Each font can be downloaded separately or in one set, prices start at $19.95.  <br> <br>Samples of each font can be found at:  <br><a href=\"http://www.p22.com/sherwoodtype/files/Virginian.pdf\" target=\"_blank\">http://www.p22.com/sherwoodtype/files/Virginian.pdf</a> <br><a href=\"http://www.p22.com/sherwoodtype/files/Royalist.pdf\" target=\"_blank\">http://www.p22.com/sherwoodtype/files/Royalist.pdf</a> <br><a href=\"http://www.p22.com/sherwoodtype/files/Grosvenor.pdf\" target=\"_blank\">http://www.p22.com/sherwoodtype/files/Grosvenor.pdf</a> <br><a href=\"http://www.p22.com/sherwoodtype/files/Grenville.pdf\" target=\"_blank\">http://www.p22.com/sherwoodtype/files/Grenville.pdf</a> <br><a href=\"http://www.p22.com/sherwoodtype/files/Elizabethan.pdf\" target=\"_blank\">http://www.p22.com/sherwoodtype/files/Elizabethan.pdf</a> <br><a href=\"http://www.p22.com/sherwoodtype/files/Broadwindsor.pdf\" target=\"_blank\">http://www.p22.com/sherwoodtype/files/Broadwindsor.pdf</a> <br><a href=\"http://www.p22.com/sherwoodtype/files/Chatham.pdf\" target=\"_blank\">http://www.p22.com/sherwoodtype/files/Chatham.pdf</a> <br> <br><img src=\"http://www.typophile.com/forums/messages/72/65506.gif\" alt=\"Clifford Family\"> <br> <br> <br>----------------------------- <br>P22 type foundry, Inc. <br>  International House of Fonts <br>  Lanston-P22 <br>  Sherwood Type <br>PO Box 770 <br>Buffalo, NY 14213 <br><a href=\"http://www.p22.com\" target=\"_blank\">http://www.p22.com</a> <br>Phone: 716-885-4490 <br>Fax: 716-885-4482 <br>-----------------------------</p>"
