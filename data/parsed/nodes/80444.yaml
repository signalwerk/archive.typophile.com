  html: |-
    <p>Friday 6 May 2011, 9.30am–6.30pm</p>
    <p>This one-day conference will investigate the status of graphic design history today, with an emphasis on the making and using of it. It will review the state of affairs, looking at where we are, and questioning where we could go next.</p>
    <p>With Christopher Burke, David Crowley, Rick Poynor, Sonia de Puineuf, Alston W. Purvis, David Reinfurt, Catherine de Smet and Teal Triggs</p>
    <p>Organised by Sara De Bondt and Catherine de Smet</p>
    <p>Tickets<br>
    -------</p>
    <p>£75 Standard<br>
    £60 Friends of St Bride Library<br>
    £30 concessions (full-time students and over-60s)<br>
    £25 concessions (Friends of St Bride Library)</p>
    <p>* Full details: <a href="http://stbride.org/events" title="http://stbride.org/events">http://stbride.org/events</a></p>
    <p>* Tickets: <a href="http://graphicdesignhistoryinthemaking.eventbrite.com/" title="http://graphicdesignhistoryinthemaking.eventbrite.com/">http://graphicdesignhistoryinthemaking.eventbrite.com/</a></p>
    <p>* Join the Friends: <a href="http://stbride.org/friends" title="http://stbride.org/friends">http://stbride.org/friends</a></p>
    <p>The conference is the first in a two-part series with the second taking place on 24–25 November 2011 at École des Beaux-Arts de Rennes. It is supported by the Royal College of Art, École des Beaux-Arts de Rennes, and the Design History Society.</p>
