    html: |-
      <p>It’s that |R| that is so unusual, with the bowed leg. Trivia Sans comes close (though it’s dotted capital |I| has a dot that isn’t as wide as the letter itself), but it’s not a match for other letters, such as the |G|:<br>
      <a href="http://www.myfonts.com/fonts/storm/trivia-sans/" title="http://www.myfonts.com/fonts/storm/trivia-sans/">http://www.myfonts.com/fonts/storm/trivia-sans/</a></p>
