    <blockquote><p>...when Faulkner was working on the book in the 1920s -- "The Sound and the Fury" was published in 1929 -- he imagined a way to make the section clearer to readers. "I wish publishing was advanced enough to use colored ink," Faulkner wrote to his editor, "as I argued with you and Hal in the Speakeasy that day." </p>
    <p>"I'll just have to save the idea until publishing grows up," he added, inadvertently launching a challenge to future publishers. Nine decades later, the Folio Society took it up.</p>
    <p>In a special edition, the Folio Society is publishing "The Sound and the Fury" in 14 colors. It's a fine press edition, quarter-bound in leather, with a slipcase and an additional volume of commentary. It also includes a color-coded bookmark that reveals which time period is designated by each color.</p></blockquote>
    <p><a class="freelinking external" href="http://latimesblogs.latimes.com/jacketcopy/2012/07/the-sound-and-the-fury-as-william-faulkner-imagined-in-color.html?utm_source=feedburner&amp;utm_medium=feed&amp;utm_campaign=Feed%3A+JacketCopy+%28Jacket+Copy%29&amp;utm_content=Google+Reader" rel="nofollow">link</a></p>
