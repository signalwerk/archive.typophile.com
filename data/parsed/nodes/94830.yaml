      <p>William Faulkner dabbled in typography—Google /William Faulkner Marionettes/ for some evidence thereof—but, quite frankly and IMHO, it was not his strong suit.</p>
      <p>However, writing some pretty compelling and innovative—for the time—fiction WAS his strong suit. Virtually every piece of his fiction has entertained, captivated and challenged me.</p>
      <p>So, your choice: focus on the insignificant details about something the guy did with mixed success, or learn a little something about life from what the guy did very, very well.</p>
      <p>IMHO...</p>
