    html: |-
      <p>John,</p>
      <p>Sorry: if it's not distortion, what is it? Based on the 35mm film format, a "normal" focal length of around 55mm is supposed to mimic what the human eye actually sees—although, typically, portrait lenses have focal lengths of 70-85mm. The referenced photo appears to have a focal length of 30-40mm, I am guessing, which means that objects in the periphery will be "misrepresented" to the eye, and actual photographs make this "misrepresentation" apparent.</p>
