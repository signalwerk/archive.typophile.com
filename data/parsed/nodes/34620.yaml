      <p>OK, I get it now, but I still think there's a difference: the letters are not really "stretched" the way we think of the term, and the way the HZ algorithm does it; it's more that the horizontal joins are stretched (closer to Arabic) or that the horizontal parts of letters are stretched (closer to Hebrew). This might seem like nitpicking, except when you look at the large quality difference in the actual results between Semitic scripts using the feature versus Latin, which doesn't really "stretch" at all well. Furthermore, the large structural difference between Arabic and Hebrew (in terms of joining or not) makes the label wobbly. I suspect he was just itching to call something "Semitic".  :-)</p>
      <p>BTW, what software was used to set "Language - Culture - Type"?<br>
      I ask because there's a lot of heavy stretching in it.</p>
      <p>hhp</p>
