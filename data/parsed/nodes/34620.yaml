      <p><cite>The missing concept from TeX's implementation is the continuous modification of typeface parameters to optimise setting (whether geometrically - horizontal scaling, tracking)</cite></p>
      <p>Actually, my business partner wrote a letterspacing feature for our implementation of TeX. Worked fine. But in general, to each their own. I'd say that the Adobe paragraph composer lacks the refinement of TeX, where you could program penalties and/or demerits for a large number of things. As far as <cite>setting text</cite> goes, and based on limited exposure, InDesign doesn't approach TeX. As far as a "layout engine" for modern graphic design goes -- where with each passing day 'text' seems to move farther down on the list of importance -- InDesign seems far better.</p>
      <p>I wonder if Adobe's not mentioning TeX isn't a corporate thing. These days corporate attorneys seem at the center of everything, and patent law makes sense to us laymen only when you consider how lawyers make money.</p>
