    html: <p>Hrant, I don't think 'semitic justification' is a strange term, but note that it applies specifically to one aspect of the hz algorithm, i.e. the intelligent stretching or condensing of letter widths. This aspect of the algorithm is not implemented in InDesign. Since this method of justification is precisely that used in the Arabic, Hebrew, Syriac and quite probably other semitic scripts, the name makes a lot of sense.</p>
