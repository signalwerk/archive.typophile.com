      <p>I suppose this is an aside, but <cite>Firstly, pairwise kerning is defeated if you add explicit space ("glue") between characters, either manually or with a macro;</cite> isn't quite right.</p>
      <p>I don't know how he wrote it, but Larry Tseng's macro did not disrupt pairs kerning -- though I believe there was an interaction with the spacing and the kern values. I do remember that if you put in an explicit \kern (in the text stream) within this command, you'd better take a look, because it might not measure what you thought it would. This letterspace command could be either positive or negative. It worked fine for, say, small caps, or for tightening up words on the title page, but we didn't use it for general text setting; you would have had to put it in each paragraph explicitly.</p>
      <p>Days gone by, when I was a compositor . . .</p>
