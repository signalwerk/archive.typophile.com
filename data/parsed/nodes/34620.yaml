      <p>Charles, I believe that to say, "<em>automatic</em> pairwise kerning is defeated," is fully correct. In this circumstance it is very difficult for a macro to restore pairwise kerns, but theoretically possible, I suppose. Of course, I'm talking about standard TeX - perhaps Larry made a supporting source code mod?</p>
      <p>I had a chance to talk over some of the differences between TeX and <em>hz</em> with Dr Karow this evening, but I am still unsure of many facts. I hope he won't mind if I pass on some fruits of that talk here, as I recall it.</p>
      <p>It seems that Adobe's implementation has diverged (less and/or more) from the original <em>hz</em> concept, but reasonably enough, he is not able to shed light on details. He did confirm that Professor Knuth's original code ("that he could write over a weekend") was the starting point, but was further "polished over months" by [URW's] software engineers.</p>
      <p>Dr Karow reminded me that URW had a firm grip on any relevant technology for interpolation (e.g. condensed/expanded), decades before Adobe's Multiple Master, and I suspect <em>hz</em> would have leveraged this.</p>
      <p>We might glean some of the original concept from what was written about <em>hz</em> before the IP passed to Adobe. As I speculate, it may have worked on two levels, firstly the parameters we are familiar with (condense/expand within about 2%, to be unnoticed) and secondly the stretch/join mechanism - for which opportunities seem rather sparse in Roman text (Hrant, any references for that capability in <em>hz</em>? For that matter, any references in the 42-line bible?) Dr Karow mentioned that more extensive use of ligatures (à la Gutenberg) was tested but was not received well by his typographic judges. I got the impression that simple tracking or scaling was considered too unsophisticated.</p>
