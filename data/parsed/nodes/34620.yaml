    <p>Keynoting the <a href="http://ictvc.org/3/125/" rel="nofollow">3rd International Conference on Typography &amp; Visual Communication</a> in Thessaloniki today, Dr Peter Karow - <em>wunderkind</em> founder of URW, father of IKARUS and behind much seminal digital type R&amp;D - asserted that InDesign incorporated the "<em>hz</em>-Program" which is familiar to typophiles as his collaboration with Hermann Zapf to add "artificial intelligence" to H&amp;J.</p>
    <p>As a TeX user and porter since the 1980s, and someone who always lamented the relative braindeadness of all Mac WYSIWYG engines until this innovation finally appeared in InDesign, I particularly noted Adobe's bragging in sales literature that they had finally noticed and incorporated TeX's engine - the source code of which has been freely available since around 1983. (It's understood that Adobe's formatter goes a little beyond TeX's, at least in convenience.)</p>
    <p>The <a href="http://www.tug.org/whatis.html" rel="nofollow">TeX history page</a> says that TeX's method is "the basis" of the <em>hz</em>-Program, but this is the first mention I've seen that the two pieces of software are connected in any way. Dr Karow did not mention TeX in his talk [Professor Knuth copped one mention re: METAFONT, but oddly, Dr Karow mentioned that weight interpolation from a single master remains unsolved, although MF surely is one solution]. I felt too awestruck by the great man - and confused by not being able to relate his assertion to Adobe's literature - to ask him myself; but can any typophile confirm what the connection actually is? Is Adobe too coy *cough*NIH*cough* to admit that their fancy new algorithm is actually Made In Germany?</p>
    <p>Btw, Hrant: You are sorely missed in Thessaloniki. They tell me you haven't registered (yet?) I hope no misfortune is keeping you from our company.</p>
