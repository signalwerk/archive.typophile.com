      <p><em>BTW, what software was used to set "Language - Culture - Type"?<br>
      I ask because there's a lot of heavy stretching in it.</em></p>
      <p>:(</p>
      <p>Yes, and I still don't know why. The book was set in the first version of InDesign, and some stretch got applied to random passages. Obviously I didn't do it manually, and I can't imagine what sequence of accidental keystrokes or cursor clicks might have produced similar errors in different parts of the book.</p>
      <p>Regarding 'semitic justification': the idea of the <em>hz</em> smart stretching (the <em>Ek</em>-program) is that it would not increase the weight of vertical stems, but would only increase the distance between them, stretching the horizontal strokes. This is explained and demonstrated in the original URW brochure: 'Only the white counters are actually expanded or condesnsed, not affecting stroke widths at all...'. The results in the brochure are impressive (as are the results of the <em>Kq</em>-program for optical scaling from a single master), and the amount of expansion or contraction required for justification would be very small. Obviously some type designs might be expected to fare better than others (the fact that examples of different <em>hz</em> programs are illustrated in the brochure with different typefaces makes me wonder to what degree types were selected for showing the software to advantage).</p>
      <p>The main difference between the <em>hz</em> approach and that used in justification of semitic scripts is that the latter are rule-based on the level of the word or the line, while the <em>hz</em> scaling is rule-based at the level of the individual letters.</p>
