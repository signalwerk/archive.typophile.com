      <p>Charles, yes, there are certainly ways to get tracking in TeX using macros, and this can work together with the smart composer, but with limitations. Firstly, pairwise kerning is defeated if you add explicit space ("glue") between characters, either manually or with a macro; horizontal scaling is not possible in standard TeX; and the traditional TeX paragraph composer can't access these features (or the more advanced idea of altering a parametric font) for its own purposes, e.g. line by line.</p>
      <p>[In other words, if you wanted to allow, for example, a small amount of negative tracking to assist in H&amp;J - as an XPress paragraph style can do - then you would need to give up pairwise kerning, and you'd have to ensure that entire paragraphs received the glue consistently throughout - unless you are doing manual line by line tweaking. The algorithm can make counter-intuitive changes to breaks in order to improve global optimality, so such fine tuning is neither as necessary nor as simple as it is with a dumb algorithm. As we know, XPress needs a lot of manual help to get anywhere close to ID's composer.]</p>
      <p>But these are minor details in a 25 year old program, which, as you say, remains essentially unparalleled in terms of setting quality. (Users of Berthold digital systems may have grounds to quibble.)</p>
      <p>Re: mentioning TeX - you must have misread what I wrote: Early Adobe literature credited TeX directly for its advanced composer, but did not mention <em>hz,</em> and it is now clear that mentioning <em>both</em> would set up a contradiction which remains unresolved. </p>
      <p>My initial question is, however, answered: URW's IP, and the personal attention of Dr Karow, were direct inputs to Adobe InDesign.</p>
