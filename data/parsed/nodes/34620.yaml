      <p>Story is that Adobe acquired a bunch of patents when URW went out of business. They also had Dr K work with them for a year in 1994. So what they have in Indy is HZ. The sales blurb would have talked about TeX because potential customers (such as TeX users) would not know what HZ was. </p>
