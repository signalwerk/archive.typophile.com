      <p>Sii, Nice to meet you at the conference. You and I caught David Lemon's extempore answer; thankyou for summarising.</p>
      <p>To be more specific on the TeX question, I think we can regard seriously the implication on the TUG "What is TeX" page that TeX's method (essentially complete and public by 1983, distributed on tape, in papers, and in book form as a literate program) is the basis for <em>hz</em>'s "optimal" paragraph composer, so Adobe's marketing literature crediting TeX isn't exactly wrong. Knuth's flawless implementation would have made an ideal (and legally possible, being early "open source") foundation. (The <a href="http://en.wikipedia.org/wiki/Hz-program" rel="nofollow">hz-Program</a> page on Wikipedia hints at a connection but does not claim direct descent from TeX.)</p>
      <p>The missing concept from TeX's implementation is the continuous modification of typeface parameters to optimise setting (whether geometrically - horizontal scaling, tracking) or through parametric fonts (Multiple Master, etc). I am not sure how much of this InDesign actually does today, though it seems that it was part of the <em>hz</em>-Program concept.</p>
      <p>As David reminds us, the association of Dr Karow, Professor Knuth, and Hermann Zapf is so close that it's rather difficult to say exactly who conceived what; we can assume that much wine and beer was consumed in smoke filled rooms while the concept evolved. :-)</p>
      <p>My curiosity was piqued because I'd never seen the programs publicly associated before. I do see that there is a sentence about the Adobe/<em>hz</em> link on <a href="http://en.wikipedia.org/wiki/Hermann_Zapf" rel="nofollow">Zapf's Wikipedia page.</a></p>
      <p>Hrant: All I can do is hope that we can both be at the next one. Also, will you help me persuade Grant H. to sample the pleasures of Thessaloniki with us. My efforts this year were in vain, but perhaps he knew you weren't coming. :-)</p>
