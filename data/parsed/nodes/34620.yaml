      <p>Yes. I've been reading Bringhurst's "bible" just when I first came across InDesign 1.0's multi-line composer. Bringhurst talks about the HZ Program in 9.3. (Scribal Justification; page 189..191). I immediately connected the two together. Because URW developed the algorithm in 1993 with Zapf. The reference was Gutenberg's 42-line bible.</p>
      <p>The method is also called (as Bringhurst says) <cite>Semitic justification</cite></p>
      <p>When I first used InDesign 1.0 I knew I'll never switch to anything else even though it lacked many features others had for years. And got them with newer versions. And more.</p>
      <p>To call it like that: I LOVE InDesign mainly because of HZ (or its derivative) implementation.</p>
