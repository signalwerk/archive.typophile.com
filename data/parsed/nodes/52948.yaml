    html: |-
      <p>Use multiples of your body text line height to achieve this.<br>
      E.g. if you have p set to 12/18pt you could use two imaginary 18pt baselines (36pt total) for h1 with 14/18pt with 36-14=22pt margin (distribute those 22pt to your liking between margin-top and margin-bottom). For a complete example see <a class="freelinking external" href="http://www.alistapart.com/articles/settingtypeontheweb" rel="nofollow">this article</a> (via <a class="freelinking external" href="http://daringfireball.net/linked/2007/04/10/baseline-grid" rel="nofollow">daringfireball.net</a>).</p>
