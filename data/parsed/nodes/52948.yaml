    html: <p>You can create a repeating background image with a line of color at the bottom, you'll have to figure out your spacing to the grid you want to use, and then adjust your em based padding/margins/line-height to achieve the correct spacing between elements. With the background used as your visual baseline of course. Just remember to remove the styled background when you're done, unless you like it...</p>
