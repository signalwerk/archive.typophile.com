    html: |-
      <p>On the matter, but not entirely a good answer:<br>
      Graphic design relates to rythm in the same way as music does. In the middle of a 4/4 beat there might be a break defying all rules, but it always returns to the rythm again.<br>
      In the type world, you might set the text 11/15 and the headlines in a completely different size/leading, but you make sure space above and below gets you back into rythm again.</p>
      <p>I, myself, practically solves this by aligning text to the baseline, and placing headlines manually. Sometimes the leading is a double baseline step, sometimes I use three baselines to cover two lines of display.</p>
