      <p>The |&amp;| is pretty carachteristic. There are many versions and alternates of University, few of which have been digitised (fortunately, one could say ;-). That |a|, for example, has the same construction of the alternate |a| in the Letraset version (minus the swash): <a href="http://www.myfonts.com/fonts/letraset/university-roman/regular/glyphs/156683/217" title="http://www.myfonts.com/fonts/letraset/university-roman/regular/glyphs/156683/217">http://www.myfonts.com/fonts/letraset/university-roman/regular/glyphs/15...</a> and the Tilde version has that |B| construction (but not the swash): <a href="http://www.myfonts.com/fonts/tilde/univrsty-roman/regular/glyphs.html#glyphs/398885/37" title="http://www.myfonts.com/fonts/tilde/univrsty-roman/regular/glyphs.html#glyphs/398885/37">http://www.myfonts.com/fonts/tilde/univrsty-roman/regular/glyphs.html#gl...</a></p>
      <p>There also is "Forum Flare", a swashed version of University: <a href="http://www.typophile.com/node/2833#comment-22664" title="http://www.typophile.com/node/2833#comment-22664">http://www.typophile.com/node/2833#comment-22664</a> (unfortunately, images are broken in that thread), which apparently had that |t|: <a href="http://typophile.com/node/65162" title="http://typophile.com/node/65162">http://typophile.com/node/65162</a><br>
      All that said, the thing is carved in wood (notice the difference in swash between the |B|s), so it could well be a custom job "inspired by".</p>
