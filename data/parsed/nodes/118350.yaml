    html: <p>My guess is that the signmaker set the type in University Roman, enlarged it, and traced it onto the plank of wood. Then he/she cut away the background with a router, leaving the raised letterforms. Both tracing and routing are freehand processes, giving the signmaker leeway to modify the University Roman letterforms wherever necessary to accommodate his/her taste or the grain of the wood. (Some wood signs are cut with a laser, with very smooth and regular results, but this one doesn't look like that.)</p>
