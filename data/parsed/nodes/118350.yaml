      <p>Lots of good points, Riccardo. I'd missed that Tilde 'B'.</p>
      <p>Akira - thanks for the link to those wonderful images.<br>
      "What about Stunt Roman?"  -- The speedball lettering inspiration for University Roman.</p>
      <p>I finally found where I'd seen those letters. It's in Phil's Photos "Homage To the Alphabet" - a catalog of the photolettering fonts offered by the precursor to today's Philsfonts.com. It's called Celtic Cursive and contains (with lots of alternates) the same 'a', ampersand and other letters. What's different is the swash under the B and, most troubling, that skewed bowl of the 'd' - which I've not seen in any variation of this design. I'd post an image, but that is frustratingly almost never successful for me.</p>
