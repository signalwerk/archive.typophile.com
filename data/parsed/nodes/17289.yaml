  html: <p>Do you ever come across graphic deisgn that is so sexy and sumptuous you just want to lick it? I came across the website for <a href="http://theheadsofstate.com" rel="nofollow">the heads of state</a> about a year ago when i was trying to teach myself some css. their wesite is so simple and beautiful, i just fell in love with its design. and then they have some beautifuly typographic rock posters for some of my favorite bands! i wish i could buy them all. i did buy one of those beauties and when it arrived i didn't want to lick it anymore. i wanted to enshrine it and hang it on the wall. it looks absolutely gorgeous in my small little apt above the p22 offices. now if you'll excuse me, i hafta go buy some candldles...</p>
