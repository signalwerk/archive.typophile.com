      <p>IPA small capitals are the symbols used by linguists to represent phonemes and such. They're encoded in their own Unicode block with other phonetic symbols. </p>
      <p>Barring general advice (which may have been too broad of a question anyway), I was curious about two things, mainly. First, for those that have designed them before, if the small/petite cap glyphs might be reused for the IPA, or if people design new distinct glyphs for these characters. Second, is there any trend about when petite vs small caps are used, like maybe it's a history of German vs British traditions, or something.</p>
    html_clean: |-
