    html: |-
      <p>I don’t know what IPA small capitals are. </p>
      <p>Petite capitals are optically aligned with the x-height. They are mostly good for display work, for example in a logotype. There aren’t that many typefaces with petite caps and small caps, but there are plenty of typefaces with small caps at “petite” height (confused?).</p>
      <p>Small caps are usually noticably taller than the x-height. In modern typography, they are mostly used for acronyms and words/names set in capitals in a line of otherwise mixed-case/lowercase words. Traditionally, small caps have been used to mark beginnings of chapters. The modern usage intends to blend in and not get noticed, the traditional usage is a stylistic one where being noticed is the whole point.</p>
      <p>Small caps and petite caps might also differ in weight, width, detailing, and structure. There is no clear recipe. It all depends on what task you want them to fulfill.</p>
