    html: |-
      <p>That’s true though strictly speaking when used for IPA even <em>abc</em> are not lower case, as it is a unicameral script — IPA has no distinction between lower and upper case letters. However the alphabet was designed on the basis of Latin lowercase letters, and I have never seen a typeface that departed from this usage. On the other hand IPA makes a clearcut distinction between pairs like ʀ–r ɴ–n ɑ–a ʒ–z etc.<br>
      What is important when designing an IPA font is the fact that there must be room enough for diacritics above and below the letters. Those may be used in unpredictable ways and even be stacked, thus: [ʀ̥ɪ̃̀ɴ̩́], which should display like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/IPA_accents_5121.png"></div><br>
      Technically the best IPA fonts currently available are certainly those produced by SIL International’s <a class="freelinking external" href="http://scripts.sil.org" rel="nofollow">Non-Roman Script Initiative</a>, especially Victor Gaultney’s <em>Gentium Plus</em>.<p></p>
      <p>I think the choice of small or petite caps depends to some extent on the language for which they are used. For German body text I have a strong tendency to use petite caps (x-height), as words are frequently distinguished on the basis of upper vs. lower case alone in that language. This seems to increase reading speed significantly.</p>
