    html: |-
      <p>There's no "purpose," it's just an aesthetic preference. I find the discontinuity between the established line of the x-height and things that are <em>almost</em> the same height to be distracting.</p>
      <p>But I've certainly used typefaces with small caps that are taller than x-height, and I've often left them that way, though sometimes I've shrunk them slightly to match.</p>
      <p>(Also, I could clarify that I'm usually typesetting literary fiction and not, say, trendy magazine copy.)</p>
