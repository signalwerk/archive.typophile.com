    html: |-
      <p>I found the original.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/OneMore_4762.png"></div><p></p>
      <p>The basic story is that a couple driving at night along the shore of White Rock Lake comes upon a young woman that is soaking wet. They stop and give her a ride. As they drive along toward the address she has given they turn to the back seat and notice that she is gone, but the seat of the car is damp.</p>
      <p>The next day they go to the address and inquire to find that there was a young woman that had lived there, but she had died in an auto accident years ago on the the same night when the car she was riding in drove into the lake.</p>
      <p>Here are some cool images.</p>
      <p><a href="http://www.whiterocklake.org/?page_id=564" title="http://www.whiterocklake.org/?page_id=564">http://www.whiterocklake.org/?page_id=564</a></p>
      <p>You can google and see what Aaron came up with. He does character design/visualization and was understandably set on rendering something himself. Although I suggested the type treatment what is on the page is not what I gave them to work with so no nasty comments.</p>
    html_clean: |-
