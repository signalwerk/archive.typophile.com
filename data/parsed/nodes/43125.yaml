    <p>I’m picking through the bone yard and looking at some rejected work. These concepts were for a film production company that focuses on horror. The name relates to a ghost story where a woman is picked up by a lake and dropped off. The driver later discovers that she was a ghost.</p>
    <p>Anyway, we went through several ideas and ended up going with a type treatment that was finally bastardized and combined with some animation.</p>
    <p>Please, if you have a moment, comment on which are the least appropriate. I’m looking for a kill list, but like the depth of development in general.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/concepts_3933.png"></div><p></p>
