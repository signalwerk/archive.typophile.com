      <p><cite>BTW, have you ever noticed how many movies roll the opening credits over water?</cite></p>
      <p>I had this idea; I envisioned the screen filling up with water, very clear water with a blue tinted back ground, the water sloshing back and forth until it fills completely to the top. then a small white pebble is dropped in, light enough that it slowly saunters back and forth as it falls. Landing lightly on the bottom of the screen, then next to it, the words, Whiterock Lake fade in.</p>
      <p>-Corny, but it sounds like something I'd see in the opening credits.</p>
