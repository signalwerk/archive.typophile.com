    html: |-
      <p>&gt;three screens </p>
      <p>You can have many FontLab windows open on one screen, and I think almost everybody works this way. </p>
      <p>For example right now for working on a bold I have four metrics windows open—regular and bold-in-progress of my font, a similar set from a font I like for comparison, all with the same string of characters that I am working on. </p>
      <p>Plus the preview window with the @ sign between control letters (the character you are working on substitutes for the @ sign). And then I open a window to work on the glyph, still seeing its effect between control characters in the preview window, even when it’s relatively full screen. </p>
      <p>And I have a second screen with some tool pallets open. </p>
      <p>I think that’s normal. I don’t think I am particularly efficient, and I’m sure others have more clever working methods. I think it would be good to gather info on working methods. Maybe I should start a thread...</p>
