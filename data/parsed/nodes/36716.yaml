    html: |-
      <p>There is no UI for it (so you will have to use some Python script every time you want to hide or show outlines), but that is bit 0x00000200 or the options.PaintStyleEx:</p>
      <p>to hide outline:<br>
      options.PaintStyleEx = options.PaintStyleEx | 0x00000200  </p>
      <p>to show outline:<br>
      options.PaintStyleEx = options.PaintStyleEx &amp; ~0x00000200  </p>
      <p>This is a full list of “constants” to control apperance in the GW (all changes should be made before GW is open, use on your own risk, no additional description, no support provided, no questions answered)</p>
      <p>#define psNODES			0x00000001<br>
      #define psCONTROLVECTORS	0x00000002<br>
      #define psALIGNMENT		0x00000004<br>
      #define psNOCLOSEPATHS		0x00000008<br>
      #define psSELECTION		0x00000010<br>
      #define psEMPTYVECTORS		0x00000020<br>
      #define psCLOSEPATHARROWS	0x00000040<br>
      #define psIMAGE			0x00000080<br>
      #define psPREVIEW			0x00000100<br>
      #define psNOBODY              0x00000200<br>
      #define psNOCOMPOSITES        0x00000400<br>
      #define psGLYPHMETRICS        0x00000800<br>
      #define psFONTMETRICS		0x00001000<br>
      #define psTEMPLATE		0x00002000<br>
      #define psGROUPS			0x00004000<br>
      #define psNEIGHBOURS		0x00008000<br>
      #define psHINTS			0x00010000<br>
      #define psREPLACE			0x00020000<br>
      #define psGUIDES			0x00040000<br>
      #define psGRID			0x00080000<br>
      #define psMASK			0x00100000<br>
      #define psBLUES			0x00200000<br>
      #define psFONTAUDIT		0x00400000<br>
      #define psOPENTYPE            0x00800000<br>
      #define psNOPAINT             0x01000000<br>
      #define psNOLINKS			0x02000000<br>
      #define psPOSITIONS           0x04000000<br>
      #define psNOCOLORCLOSEPATH	0x08000000<br>
      #define psOPENCONTOURS		0x10000000<br>
      #define psCONTOURDIRECTION	0x20000000<br>
      #define psNODIGITS		0x40000000<br>
      #define psNOCONTOUR		0x80000000</p>
      <p>:-)</p>
