    html: "<p>Just some nitpicking on the drop cap: I think it's hanging too much. I would also probably align the top of it with the top of the small caps if I were you. In Norwegian it's important that the first line is closer to the drop cap than the preceding lines. With a T your example is sort of acceptable, but it wouldn't have been so with an H. I would feel more comfortable with a clearly marked difference between the first and the preceding lines, but then again there might be other rules in English.</p>"
