      <p>I'm impressed by your use of ornament.</p>
      <p>The drop cap lacks finesse (relative to the other elements) and doesn't look like a T.</p>
      <p>I'm afraid I dislike the slick, tight fit of this text face and layout application, it strikes me as too bland for the genre of layout.<br>
      I like antiques, even if they are reproduction, to have a bit of patina and be somewhat dog-eared.</p>
      <p>Look at the sentence break in line 11: the period is kerned under "r", resulting in a word space that is smaller than the counter of the "G". Compare with the sentence break in the next line, which is just about OK.</p>
      <p>Would it look more classic with a larger word space in the h&amp;j's?</p>
      <p>And if you are going to be so tight and even, you have to solve every spacing issue, or else they really stick out like sore thumbs, which is the case with the long arm of "f" stretching across word spaces to interfere with following characters (see line 7).</p>
