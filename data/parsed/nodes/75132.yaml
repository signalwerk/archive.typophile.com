      <p>I wish I could use color, but that's not in the budget. Here's yet another variation on the theme, with the title border made into a rectangle, which hopefully makes it less obtrusive.</p>
      <p>Jacob, do you have any suggestions for a text face that would work better? </p>
      <p>I think I've been trying to tie together three elements to keep this book connected a bit to its roots (Victorian and post-Victorian children's fairy tales).</p>
      <p>1) Typography (heading in all caps of text font, wide margins with outside and top margins double the width of top and inside margins)<br>
      2) Blatant, if not ostentatious, use of ornamentation<br>
      3) Illustrations</p>
      <p>I've been trying to use these three things to connect the book back to the original time period of the book, while at the same time not wallowing overmuch in them. I don't particularly want it to look old, just reminiscent. Perhaps I'm doing this badly, or working towards a mishmash that simply won't work.</p>
      <p>"Arabian Nights" is the source credit. It only appears on the title page of each story. I'm throwing in an image of an all-text spread, so you have an idea of how that part works.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fairy_tales_5761.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fairy_tales2_4986.jpg"></div><p></p>
