    html: |-
      <p>I have to say that the only thing that truly bothers me about all of these otherwise perfectly fine layouts is the use of hanging punctuation.</p>
      <p>I know it’s touted as being a sign of sophisticated, fine typesetting, but in my opinion that’s a myth. And it completely disrupts the allusive character of this sort of setting, since it simply would not have been done in a piece of period printing such as this emulates. </p>
      <p>I’m surprised that Nick didn’t mention this; but perhaps he doesn’t share my disdain for this “feature.”</p>
      <p>The concept behind Adobe’s hanging punctuation sounds all well and good in theory. But every time I’ve seen it applied to large blocks of text, I find it has entirely the opposite effect — creating a distractingly irregular, rather than a visually even, edge.</p>
