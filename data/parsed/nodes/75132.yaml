      <p>heyfrito500,</p>
      <p>I think you're right about the 'A.' It's the result of a nested style which automatically small caps a certain number of words; nice catch.</p>
      <p>As for the grammatical comments, it's been my experience here in America that if "its" or "it's" is used by the average person, it will be used incorrectly. "It's" must look more refined, since that is the popular form for run-of-the-mill ads. I tend to immediately cringe when I come across any form out of habit, whether it has been used incorrectly or not. And I also think that the average person would avoid "I were" simply because he is not sure how to use it correctly. Another common error is using singular and plural for the same subject (e.g., "if everyone used correct grammar, they wouldn't make this mistake"). Or maybe my perspective is skewed because I've spent most of my life in the moderately rural South. (Although, in defense of the South, I still think "y'all" is an extremely useful and underrated word.)</p>
