      <p>After thinking about it for a bit, I really can't afford a new text face for the book. I have the standard adobe fonts (arno, minion, adobe garamond, adobe caslon, garamond premier pro, hoefler text (these last two with not the entire font set, but enough to set this book, I think). If a new display face would help, I could probably manage a somewhat cheap one.</p>
      <p>My question is more, Is the font really my problem? Maybe I should simply go back to the drawing board on this one.</p>
      <p>Anywho, here's one final lash to the carcass. Set entirely in Arno. With pretty standard layout for the running header, and the story source moved to the end of the story instead of the beginning page.</p>
      <p>Blessings from a battered beginner.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fairy_tales_3926.jpg"></div><p></p>
