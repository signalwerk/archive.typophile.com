  html: |-
    <p>It has been suggested, many times, that the letterpress hobby could do with a modern guide-book aimed at the absolute beginner.</p>
    <p>I have made an attempt to produce such a guide. Aimed at the beginner who would like to start printing from home “First Steps in Letterpress” runs through the purchase, setting up and running of a table-top platen press.</p>
    <p>It gives the beginner an idea of the range of products that can be produced using the letterpress process, and the various methods of producing them. Traditional typesetting, photo polymer and lino printing are covered.</p>
    <p>The book has a “Reference Section” listing suppliers of everything the beginner may need, both in the USA and UK.</p>
    <p>The book also lists places that the beginner can look for further help and advice to take the hobby further.</p>
    <p>Available now on Kindle at Amazon US: <a href="http://j.mp/RURW2H" title="http://j.mp/RURW2H">http://j.mp/RURW2H</a> and Amazon UK: <a href="http://j.mp/RkC9tY" title="http://j.mp/RkC9tY">http://j.mp/RkC9tY</a></p>
    <p>Dave Hughes</p>
