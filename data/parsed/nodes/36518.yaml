    <p>About <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000275" rel="nofollow">Galgo Script</a></strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilegalgo_3416.jpg"></div><p></p>
    <p>The Galgo is a Spanish greyhound, an ancient hybrid breed of dog. Just like the Galgo, the letters of this font are a mix of elegant brush calligraphy and the rough, weathered strokes of speedy scrawl. Galgo Script is quite suitable for logomarks, titles, short headlines and lengthy artistic passages. Drawn by Angel Koziupa and expanded and digitized by Alejandro Paul, Galgo Script was created due to the demand for this kind of “rushed brush”.</p>
    <p>Visit <strong><a href="http://www.sudtipos.com" rel="nofollow">Sudtipos</a></strong> to find our complete catalogue of fonts</p>
