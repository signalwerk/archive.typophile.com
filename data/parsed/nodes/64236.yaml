    <p>Hello, I’d greatly appreciate your help with this one. My client need her logo re-created and she keeps telling me to use the “Papyrus” font. But this is not papyrus and I can’t find a font with a similar name. I have not only searched all my fonts but also looked at Dafont etc... I have even tried out the Whatthefont tool - with no success...</p>
    <p>You can see the logo here: <a href="http://www.eyeinnovations.net/" title="http://www.eyeinnovations.net/">http://www.eyeinnovations.net/</a></p>
    <p>The font in question is the “Eye Innovations” logo.<br>
    Thank you so much for your help.</p>
    <p>Amalthea</p>
