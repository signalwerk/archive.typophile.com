      <p>I don’t think Arial should ever be used in a logo. Even Helvetica would work better than Arial.</p>
      <p>I like Jon’s suggestion of Kontrapunkt, but I like your original tree rings better than his - they’re more subtle with just the edge of bark around them.</p>
      <p>So, my advice: Keep the rings, but change the font.</p>
      <p> - Lex</p>
