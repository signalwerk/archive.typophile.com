  - id: 45059
    user: 2236
    date: 2004-08-26T09:03:00
    date_raw: 26 Aug 2004 — 9:03am
    votes: null
    html: "<p>Tom: <br> <br>I wouldn't worry about your \"O-Devil\" looking like the one Photo posted. Unless you create a detailed illustration of a devil, you can bet that there are going to be other devils out there that look similar to yours. Relative to the Bravo Devil that Photo posted, I think your goatee element is an improvement. If you do pursue this \"O-Devil\", I would recommend using a heavier type that would allow you to use the \"O-Devil\" as a stand alone mark. Also, I recommend avoiding the use of additional graphic elements (\"O-Devil\" plus the fiddle graphic). Although in your last concept, I do see the potential of a V-neck and a pitchfork (i-l) accompanying the \"O-Devil\" head. <br> <br>Most importantly, find another typeface. Considering the title, I would either look for something bold, very stylized, or both.</p>"
    html_clean: "<p>Tom: <br> <br>I wouldn't worry about your \"O-Devil\" looking like the one Photo posted. Unless you create a detailed illustration of a devil, you can bet that there are going to be other devils out there that look similar to yours. Relative to the Bravo Devil that Photo posted, I think your goatee element is an improvement. If you do pursue this \"O-Devil\", I would recommend using a heavier type that would allow you to use the \"O-Devil\" as a stand alone mark. Also, I recommend avoiding the use of additional graphic elements (\"O-Devil\" plus the fiddle graphic). Although in your last concept, I do see the potential of a V-neck and a pitchfork (i-l) accompanying the \"O-Devil\" head. <br> <br>Most importantly, find another typeface. Considering the title, I would either look for something bold, very stylized, or both.</p>"
