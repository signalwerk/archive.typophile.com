    html: |-
      <p><em>Can i get into trouble doing this? :-?</em></p>
      <p>You could. Starting with existing font data makes your version a derivative work. Some font licenses allow derivative works, some don’t. Those that do usually restrict what you can do with a derivative font. Check the license to find out.</p>
      <p>Keep in mind that when you buy a font, you buy a license to use the font as spelled out in the license, not the font itself.</p>
