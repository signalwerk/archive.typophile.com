    <p>Hi dudes, dudess’,;)</p>
    <p>I could use some advice.</p>
    <p><strong>I am looking for a more modern/trendier version of GOTHAM.</strong> </p>
    <p>I love the timeless purity of the typeface but it can be seen as unadventurous. I am designing a new corporate ID for our Design company need something pure but with an slight excentric edge. I looked at <a href="http://houseind.com/index.php?page=showfont&amp;id=4">CHALET</a>, and love the letter L but don’t like the S, hmmm…   I could  change it, might have to, but perhaps you guys, gals have an even better idea?</p>
    <p>Please let me know</p>
    <p>Regards</p>
    <p>Timid and friendly</p>
