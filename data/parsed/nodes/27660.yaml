      <p>The typeface is for the design company i work for The company name is “CLOWNFISH”. It will be used for the complete corporate ID. From Logo type to body copy.</p>
      <p>The background story is this:- in the past the company hasn’t been taken as seriously as i’d have liked, partly because of the name and partly because of the old logotype, <em>(a clowny fish), hmmmm</em>.<br>
      I have designed a NEW logo and am looking for a typeface to go with it. I knew which direction i wanted to go from the begining so the Logo emblem works fantasmic with Gotham.<br>
      I want something pure, serious, but with a modern twist. I am bisotted with Gotham, but i feel it needs something extra to make it stand out as unique, it’s SO pure you don’t see it. The logo type needs have the feel of, “I know you don’t i? but hey your different” LOL. Perhaps i’ll just design a logo type (the word “clownfish”), if it’s not possible to make a derivative.</p>
      <p>I am now seriously considering using the original glyph shapes of bryant and chalet in the gotham style.</p>
      <p>What does a private commission cost? (i know thats a vague question) but give me a ball park figure. But I dont think it’s in the buget.</p>
