      <p>What about Relay, by Cyrus Highsmith? It was inspired by similar source material, but is a little more stylized and zippy. I don’t know if that’s what you meant by more modern/trendy, but Relay bears more marks of the digital tools that created it than Gotham does, which looks as if it could have been created at any time with any tool.</p>
      <p><a href="http://www.fontbureau.com/fonts/Relay" title="http://www.fontbureau.com/fonts/Relay">http://www.fontbureau.com/fonts/Relay</a></p>
      <p>And if you’d prefer a rounded geometric sans, there’s Omnes, by Joshua Darden. The rounded terminals are very fancy, and there are many lovely alternate characters.</p>
