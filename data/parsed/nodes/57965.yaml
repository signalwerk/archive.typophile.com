    html: |-
      <p>Hi Eduardo,</p>
      <p>This is amazing, it's a great work. One of my favorite letter is "t", and "w" is lovely too. Well, I love almost everything.</p>
      <p>The crashing beak of the "s" is a little bit disturbing for me. I suggest also to release the gutter of the "r", it looks very condensed. The upper join of "d" is too wide comparing with "b" or "g".</p>
      <p>I think some straight terminals of the uppercase letters should be replaced by the "A" right terminal.</p>
      <p>Sergio</p>
