    votes: null
    html: |-
      <p>many, many beautiful glyphs<br>
      love the j, k, q, z, 9, B especially<br>
      q's a little hard to read but I find it so appealing that I don't mind!</p>
      <p>spine of S looks weak<br>
      agree about crashing on s; Y too<br>
      agree about r - appreciate that you don't want to open up too much space underneath, but the arm looks a bit like a squooshed ellipse.</p>
      <p>I wonder if the angles are a touch too sharp - the humps at x-height (bhmnp) and the flicks at the baseline (adhilmntu). Of course you don't want to make it too sloppy, but letters with those angles stand out a bit against letters without them to my eye.</p>
