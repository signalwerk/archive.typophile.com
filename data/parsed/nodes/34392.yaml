    html: |-
      <p>A fine can of worms here. Since you can use a telegraphic style in a resume, you could theoretically use either #2 or #3, with #3 being the most telegraphic. But then, what about an apostrophe for "years"? Some people say that the apostrophe isn't needed because the experience belongs to them and not the years, or that "years experience" is short for "years of experience" and not "years' worth of experience." Others say the apostrophe should be used because it's the genitive case (see the Chicago Manual of Style 15, paragraph 7.26).</p>
      <p>(Later edit: just to be clear, I'm talking about whether it should be "25 years experience" or "25 years' experience.)</p>
      <p>Since you don't know what the hiring manager's opinion will be, I think it's safer all around to use #1.</p>
      <p>"City code" doesn't need to hyphenated unless your client was inspecting the codes themselves. However, there are different kinds of city codes (administrative, business, building, traffic). I assume from the combination of "property manager" and "city codes inspector" that your client was a building inspector. If so, consider using that instead of city code inspector ("With over 25 years of experience as a building inspector...").</p>
      <p>If you can state which codes she was inspecting to (ICC, BOCA, SBCCI, ICBO, NFPA, ADA, ANSI, NEMA, UFAS), that would be good.</p>
