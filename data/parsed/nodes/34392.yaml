    date: 2007-06-12T10:34:00
    date_raw: 12 Jun 2007 — 10:34am
    votes: null
    html: <p>It's easy to get wrapped around the axle on this kind of stuff. Reasonable people often disagree, and it's not necessarily that there's a right way or a wrong way, just which way your audience expects to see it. Since that's hard to tell for a resume, I prefer to use the approach that's least likely to look like a typo or a grammatical error. In formal writing, I go with Chicago.</p>
