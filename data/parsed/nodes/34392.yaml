    <p>I'm designing a business card for a propety manager who worked as a city codes inspector for 28 years. She would like this fact to some-how be incorperated in the design. I agree with her 100%, but I'm having trouble with the phrasing.<br>
    What would sound better:</p>
    <p>1) With over 25 years of experience in city codes<br>
    2) With over 25 years experience in city codes<br>
    3) With over 25 years city codes experience</p>
    <p>That's all I can think of for now. But if there are any other ways of phrasing it I'm welcome to any and all suggestions. Also would like suggestion on how to type it. Is 'city codes' hyphenated?</p>
    <p>Many thanks<br>
    Ivan</p>
