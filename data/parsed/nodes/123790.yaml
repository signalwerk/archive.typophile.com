      <p>Most inkjet/dot matrix typefaces are specific to the equipment that produces them.</p>
      <p>Save for having a zero with a diagonal slash, Chunkfeeder mimics the look nicely:<br>
      <a href="http://www.myfonts.com/fonts/typeco/chunkfeeder/" title="http://www.myfonts.com/fonts/typeco/chunkfeeder/">http://www.myfonts.com/fonts/typeco/chunkfeeder/</a></p>
