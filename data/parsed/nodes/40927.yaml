      <p>Hi Gregorius,</p>
      <p>so you want to design a <a href="/wiki/typeface" class="wiki">typeface</a> and produce yourself a <a href="/wiki/font" class="wiki">font</a>.<br>
      And as you want to use it for type-setting your thesis, I assume it’s about a Latin text face – right?</p>
      <p>How many time do you have? You have to be aware of the fact that creating a font will take a <em>very long</em> time, at least if you’re doing it for the first time, and if you want the outcome to be reasonably good and usable.</p>
      <p>Given that setting an academic paper usually requires more than just one weight (e.g. Roman, Italic, Bold, maybe Small Caps, several sets of figures, …), I strongly recommend to rethink your plan. You’ll be better off with a little less ambitious aim. You could design a nice display face for titlings/headings, for example.</p>
      <p>To answer your question – have a look at these older threads:<br>
      <a href="http://www.typophile.com/node/36268">Advice for a beginner</a><br>
      <a href="http://www.typophile.com/node/35134">Type Design tutorial anywhere? – How to create fonts?</a><br>
      <a href="http://www.typophile.com/node/37860">What books are there on type design?</a><br>
      and of course the <a href="/wiki/How-To" class="wiki">How-To</a> section in the Typophile Wiki.<br>
      F</p>
