      <p>OK Now I opened the <em>Character</em> and <em>Paragraph</em> palettes and there was one totally insane number (something like --237658) in the following fields: <em>Leading, Baseline Shift, Left Indent, Right Indent, First Line Indent, Space Before Paragraph</em> and <em>Space After Paragraph.</em> When I started turning this number to 0 in all these fields at some point the text appeared; I think it was when I turned <em>Left Indent</em> to zero.</p>
