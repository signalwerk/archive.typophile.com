    html: <p>Are you running Photoshop CS2 on an intel Mac and/or are you running 10.4 with all the latest patches? There are some nasty number bugs like this when running CS2 apps on intel Mac as well as some funkiness with the 10.4.8 patches. I constantly see my 9 point fonts going to 8.xxxxxxxx... in indesign, it's extremely irritating. If you're on a intel mac, try switching to the Photoshop CS3 beta, it's a much better piece of software.</p>
