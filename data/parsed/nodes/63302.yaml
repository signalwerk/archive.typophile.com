    <p>Hi I'm looking for some suggestions.</p>
    <p>I've been searching for an appropriate serif to use for my personal identity / branding (graphic designer). As such I'm quite picky, especially when it comes to type faces.</p>
    <p>Much to my shame, I very much like the majority of Georgia's letterforms and its screen appearance (it was designed for screens after all). That said I wont allow my self to use a windows default font for my personal identity. Even if no one else notices, just for my personal satisfaction.</p>
    <p>Before I start rambling too much, I better provide an idea of what I'm looking for. The straight line ears, for example on the lower case 'g' and the cross-bar on the lower case 't' give me the shits, but other than a few niggles like that, Georgia I quite like.</p>
    <p>Other fonts I have been considering include:</p>
    <p>Mrs Eaves XL - <a href="http://www.emigre.com/EFfeature.php?di=212" title="http://www.emigre.com/EFfeature.php?di=212">http://www.emigre.com/EFfeature.php?di=212</a></p>
    <p>I like the verticle serifs on the 'T' and the vertical legs (correct term ? I forget) of the 'M' and it looks generally pleasing. The XL weight seems to fix most of my problems I had with the origional Mrs Eaves (x height etc). Still not quite convinced yet though.</p>
    <p>Bonesana Pro - <a href="http://www.gestalten.com/fonts/detail/?id=ceaea76523135ee601232d96478400bc" title="http://www.gestalten.com/fonts/detail/?id=ceaea76523135ee601232d96478400bc">http://www.gestalten.com/fonts/detail/?id=ceaea76523135ee601232d96478400bc</a></p>
    <p>I generally like the letter forms here but the angled serifs on the 'E' put me off a little.</p>
    <p>I'm also interested in a good range of open-type features. Partly why Mrs Eaves XL could be a good choice.</p>
    <p>Could anyone recommend some nice serifs (preferably with extensive familys etc) ?</p>
    <p>Thanks for any help!</p>
