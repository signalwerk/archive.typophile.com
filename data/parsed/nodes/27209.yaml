    html: <p>The Polish character set is comprised in all CE (Central European)  <br>fonts, so Linotype's <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;font_categories=1&amp;font_categories_search=font_name_search&amp;searchstr=helvetica+neue+ce" target="_blank"> Helvetica Neue CE</a> is what you need.</p>
