    html: "<p>Hi Nevine. <br> <br>Nothing wrong with straignt type. You've done a nice job picking caps and italic lowers that are close in weight. <br> <br>However, I'd choose something other than Trajan. Particularly since it is type only. There are so many great Classic Caps to choose from. Consider the following: <br> <br><a href=\"http://www.myfonts.com/fonts/redrooster/forum-titling-rr/\">Forum Titling</a> (Funky Trajan) <br><a href=\"http://www.myfonts.com/fonts/linotype/serlio/\">Serlio LH</a> (Has small caps) <br><a href=\"http://www.myfonts.com/fonts/tiro/aeneas/\">Aeneas Light</a> (My pick of the group. Check out the alternate R) <br> <br>Several other classics have alternates and swashes that could lend some interest: Centaur, Bembo Titling etc. <br> <br>Now, your italic is Berkley Oldstyle. Don't know if that swash p ending is stock or not. It's a good idea, but I'd make the loop open from the stem. Plus, I would use a more calligraphic in nature, like Centaur's arrighi italics. It offers a light weight, nice swash possibilites, and my instincts say it will work better. Consider other layouts (ie. not one long line </p>"
