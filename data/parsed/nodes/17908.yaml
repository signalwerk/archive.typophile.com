    <p>*** new from Hyphen Press ***</p>
    <p> *** edited and made at the Department of Typography &amp; Graphic Communication, University of Reading ***</p>
    <p>Typography papers 6: a landmark publication</p>
    <p>The sixth number of Typography papers is now published. This copiously illustrated book reconstructs the classical letter in the Italian renaissance and publishes some notable firsts.</p>
    <p>These include the first full showing (and at same size) of the Newberry alphabet, a constructed manuscript alphabet of 29 capital letters made in Italy in the late fifteenth century and now in the Newberry Library, Chicago.</p>
    <p>Also published for the first time is a posthumous essay by Nicolete Gray (d. 1997) introducing the Newberry alphabet and putting it in the context of a series of ‘antique’ alphabets constructed between 1464 and 1525.</p>
    <p>In 1959 Giovanni Mardersteig, scholar-printer and founder of the Officina Bodoni in Verona, published a pioneering essay on Leon Batista Alberti’s role in reviving the ancient Roman capitals. This much-cited work at last appears in English here in Typography papers, with its original illustrations, in James Mosley’s translation.</p>
    <p>James Mosley’s incisive summary of the work of Giovan Francesco Cresci resumes work begun in the early 1960s with the publication of his seminal essay ‘Trajan revived’. Here Cresci’s constitutional foundation of the baroque letter in Rome is illustrated, and – another first – is complemented by pictorial comparisons of the great inscriptional alphabets published in Rome in the late sixteenth and early seventeenth centuries.</p>
    <p>Paul Stiff’s survey of fifteenth-century Florentine inscriptional design starts with the epitaph to ‘the great and ingenious’ Brunelleschi, first architect of the renaissance, in the city’s cathedral. His survey is illustrated by 90 unpublished pictures from Reading’s Lettering Collection, built up over the last 40 years.</p>
    <p>160 pages, many b/w pictures, paperback (sewn sections)<br>
    ISBN: 0–907259–29–4</p>
    <p>* UK price: 20 pounds<br>
    via Central Books, London<br>
    <a href="http://www.centralbooks.co.uk" title="www.centralbooks.co.uk">www.centralbooks.co.uk</a></p>
    <p>* North American price: 40 dollars<br>
    via Princeton Architectural Press, New York<br>
    <a href="http://www.papress.com" title="www.papress.com">www.papress.com</a></p>
    <p>* Continental Europe:<br>
    via Coen Sligting, Amsterdam (<a href="mailto:sligting@xs4all.nl">sligting@xs4all.nl</a>)<br>
    or via Central Books, London</p>
    <p>* Australia:<br>
    via Books at Manic (<a href="mailto:manicex@manic.com.au">manicex@manic.com.au</a>)</p>
    <p>Hyphen Press<br>
    115 Bartholomew Road<br>
    London NW5 2BJ</p>
    <p><a href="http://www.hyphenpress.co.uk/titles/typo_papers6/index.html" title="www.hyphenpress.co.uk/titles/typo_papers6/index.html">www.hyphenpress.co.uk/titles/typo_papers6/index.html</a></p>
