      <p>I can confirm many oddities relating to Office's (Word's) font menu...missing items, and inconsistencies from machine to machine, etc. Also it seems these problems are not limited to Type 1 fonts. I've seen it with CFF (.otf) and TrueType (.ttf) families as well.</p>
      <p>Unfortunately I've not been able to locate any cause, other than some kind of bug in Word. The fonts we've seen it with adhere to naming conventions, etc.. Doesn't happen with every font/family, though I will say it *seems* to happen more often with families that have more than the usual 4 weights. I don't have any stats to back that up though I could review our records and see if there's a pattern...</p>
