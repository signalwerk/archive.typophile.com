      <p>In previous versions of Word, MS did not mess with the system's internal font calls much as far as I can tell, other than doing the WYSIWYG thing. Every font weight showed up as an individual listing, in all menus--albeit ungrouped. I conjecture that part of the problem might be the new feature where MS now groups the fonts into families with submenus for individual weights--but as the above shows, they seem to have coded it wrong. In the past, I used a 3rd party utility (Fontcard) to get this functionality and many years ago, the long-since gone Adobe Type Reunion.</p>
      <p>I agree, I've tried to reverse-engineer the logic behind instances when these font menu hiccups occur, and I can't do it. There is no immediately obvious pattern, but it is indeed pervasive.</p>
