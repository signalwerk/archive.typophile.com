    <p>October 23rd is the official Slap Your Irritating Co- workers Holiday:</p>
    <p>Do you have a co- worker who talks nonstop about nothing, working your last nerve with tedious and boring details that you don’t care about? Do you have a co-worker who ALWAYS screws up stuff creating MORE work for you?</p>
    <p>Do you have a co-worker who kisses so much booty; you can look in their mouth and see what your boss had for lunch? Do you have a co-worker who is so obnoxious, when he/she enters a room, everyone else clears it? Well, on behalf of Ike Turner, I am so very, very glad to officially announce SLAP YOUR IRRITATING CO-WORKER DAY!!!</p>
    <p>Here are the rules you must follow:</p>
    <p>* you can only slap one person per hour - no more.</p>
    <p>* You can slap the same person again if they irritate you again in the same day.</p>
    <p>* You are allowed to hold someone down as other co- workers take their turns slapping the irritant.</p>
    <p>* No weapons are allowed...other than going upside somebody’s head with a stapler or a hole-puncher.</p>
    <p>* If questioned by a supervisor [or police, if the supervisor is the irritant], you are allowed to LIE, LIE, LIE!</p>
    <p>Now, study the rules, break out your list of folks that you want to slap the living day lights out of and get to slapping on October 23rd..... And have a great slapping day!!!!</p>
