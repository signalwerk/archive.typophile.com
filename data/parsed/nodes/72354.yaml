      <p>Ok, my first bash at a critique - please bear with me.</p>
      <p>Firstly, I like the simplicity and concept of the emblem, but I feel that the extrusion applied to the R is a little inconsistent. The mixture of 0°, 45° and 90° terminals are quirky, but could be better resolved. Also, the concentric curves look like they need to be better spaced - especially where the middle curve meets the leg of the R.</p>
      <p>The font you've used for your name is fine, but the kerning needs looking at - in particular, the 'an' combinations in both words are too close together. I think you could increase the spacing of all the letters in 'Sloan', as the 'Rya' combination necessitates more generous negative space.</p>
      <p>As for the last line, and this is possibly a personal preference, I'm just not a fan of that particular font - I find it far too dated, especially given the nature of the commodity it's advertising, and it does nothing to enhance the rest of the design. I don't think there's any need to use a combination of fonts in this logo - you may find using Maven throught yields a better result.</p>
    html_clean: |-
