      <p>I love the mark. Although people may find it overused, it makes the purpose of your business clear. You did make it your own with the negative space of the reversed "R". A nice simple solve. Great job!</p>
      <p>I will have to agree with chr.s that the use of Bank Gothic is a bit jarring. Besides the personal aversion (which I share), the larger issue is that you've used 2 different sans serif fonts in the same context which breaks one of the fundamental rules of typography.</p>
      <p>Good luck. :)</p>
