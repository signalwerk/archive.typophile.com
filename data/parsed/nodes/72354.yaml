    html: |-
      <p>My English isn't all that good. I could show you a sketch of what I mean but then I would be the one designing and not you. </p>
      <p>On the shadow: consider how it would look in real life. The inside counter wouldn't have a shadow that was cut off midways unless the counter had a very wierd shape. </p>
      <p>On the sound waves: if they were the same weight as the shadow, I think they might look more like they belong (unless there's a reason why they have different weight). The waves are cut off by the leg in the bottom, and the same cut is mirrored in the top. That might work, but I would also try a vertical cut in the top just to see how it looks. It might help with the balance.</p>
      <p>Bank Goth can look great used correctly. The problem with your pairing is the shapes don't belong stylistically. They are two different "worlds" mixed together for no apparent reason. And yes, that kerning is horrible ;)</p>
