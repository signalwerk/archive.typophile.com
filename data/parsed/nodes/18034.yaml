      <p>In case someone is still interested in the original topic mentioned in the header:</p>
      <p>I've just seen that the final cut of Erbar was issued in 1960, decades after Erbar's death, by the original foundry Ludwig &amp; Mayer in Frankfurt which completed the font. The source for this info is Willi Mengel's German book "Druckschriften der Gegenwart", published in 1966. I have just made a documentation about this highly interesting statistics book, but it is in German language only (see <a href="http://www.sanskritweb.net/fontdocs" title="www.sanskritweb.net/fontdocs">www.sanskritweb.net/fontdocs</a>).</p>
