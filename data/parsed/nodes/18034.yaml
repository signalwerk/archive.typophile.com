    <p>How come there is no digital version of Erbar Grotesk in its regular width? </p>
    <p>I've been thinking about trying to create one, or at least something inspired by it - does anyone think it's worth the try? If nothing else I thought of doing it just to get the hang of FL...</p>
    <p>I understand the name Erbar is taken, so that would be a problem, but what about the design? Erbar died in 1935...</p>
    <p>Also, <a href="/wiki/Erbar" class="freelinking" rel="nofollow">Erbar</a> is defined in the wiki as a Grotesk. I suppose this is because in german <em>Grotesk</em> includes both Realist and Geometric sans?</p>
    <p>I know I could just change the Wiki to what I think, but I find that some discussion is always much more interesting and educational...</p>
    <p>J. Erbar's types: <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Erbar/JErbar.pdf" title="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Erbar/JErbar.pdf">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Erbar/...</a></p>
    <p>And <a href="/wiki/Letters%20of%20Credit" class="freelinking" rel="nofollow">Letters of Credit</a> has some samples, too.</p>
