      <p>Nick, what's your problem?<br>
      Why do you feel it necessary to imply that I am a hypocrite, by pointing out similarities between some of my original designs and older types? That's a cheap trick -- any typeface is always going to look a bit like some other face. Sure, I was aware that Radiant has some of the same formal properties as Eunoia, but I didn't look at it while I was working on Eunoia, because that wasn't where I was coming from -- my main concern during the design was orchestrating the "mix and match" between the Regular, Round, and Unicase versions, not back-checking some old face. </p>
      <p>And calling me a point pirate (for Worldwide) is pretty low.</p>
      <p>I said that doing revivals is unimaginative -- perhaps that smarts, but you can't deny it. </p>
      <p>Please note that I mentioned the exception: where the face revived is unusual and forgotten -- surely that would would apply to the bulk of your work?</p>
      <p>I took particular aim at genres that have been well mined, and Erbar Grotesk is in that category, which is why I suggested to Gabriel that if he is going to revive something by Erbar, then Feder would be more worthwhile. I will always encourage young designers to develop their own ideas, rather than plod clumsily (as the novice always does) along some well-worn path.</p>
      <p>If one wants to do a revival, the benefit of taking a crack at Feder Grotesk would be that nobody else has done it, so one's work would be somewhat fresh. </p>
      <p><em>the flaws which affect the vast majority of even the best digital types can never be repaired</em></p>
      <p>George, your perception of the "flaws" is subjective. Those types is what they is. You change one thing, you throw everything out of whack. They're type designs, not chronometers which can be made increasingly accurate. </p>
      <p>Actually, I don't see why it shouldn't be legal to sell a set of kern pairs for a font -- for use in Quark XPress, to be imported into "Kern pair edit".</p>
