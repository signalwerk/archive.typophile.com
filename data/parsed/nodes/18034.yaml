      <p>Thanks everyone for the comments and support. I didn't think this would lead to such a big discussion.</p>
      <p>Nick, Feder Grotesk is indeed interesting, but I have the feeling that it would turn into a "funny" face - as in "curious but without much practical use". However I suppose in better hands the concept behind it could be used to produce a working text face. </p>
      <p>Maybe I'm seeing too much in Erbar-Grotesk: my favorite version is from the 1922 drawing shown in Tracy's book. In this one, among other things, the uc <em>U</em> is "cursive" and the bars on <em>t</em> and <em>f</em> are also "broad nibbish"; to my eyes it's a lot less Futura-like, putting it somewhere between a 19th century and a true geometric sans, with a touch of calligraphy.</p>
      <p>I could always create a new typeface using that last sentence as a starting brief, but the idea isn't mine, it's Erbar's, so it seems more honest to admit the source. Who knows, in the process I may wander and turn it into a completely different face.</p>
      <p>I could scan the page from <a href="/wiki/Letters%20of%20Credit" class="freelinking" rel="nofollow">Letters of Credit</a> but... doesn't everyone here own the <a href="/wiki/triumvirate" class="freelinking" rel="nofollow">triumvirate</a>?</p>
      <p>On a side note, I was very surprised to find out from that Klingspor-Museum document that Erbar designed Candida. There's an Anthropology journal from Rio de Janeiro that uses it as their body face (<a href="http://www.scielo.br/scielo.php?script=sci_issuetoc&amp;pid=0104-931320050001&amp;lng=en&amp;nrm=iso" rel="nofollow">PDFs here</a>) on a cream-colored paper and it looks very good, though certainly too light for some typographer's tastes. I first saw one a few years ago, and since then I always wanted to use Candida but never had a good chance.<br>
      It may not be the best typographic design around, but compared to most scientific periodicals it's very good. I don't know about your countries but here many use combinations of Arial for headings and Times for body, and I've seen at least one with Avant-Garde(!?) for headings and Arial for text. Ugh.</p>
