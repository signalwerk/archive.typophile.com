      <p>Nick,</p>
      <p>First, let me clarify one misconception you have: when I said "interpolation," I did not intend to imply a purely mechanical process (point piracy), but merely to suggest that elements from the two examples could be cross-bred (maybe "pollination" would have been a less pejorative term?) to achieve a result similar to the one you obtained.</p>
      <p>My problem is that you seem compelled, from time to time, to make provocative pronouncements about revivalists—which I will not let go unchallenged—as well as patently absurd claims to operational superiority (hence my equally absurd claim of working by the Braille method). Anyone who designs type uses his or her eyes; simply because you choose not to use scanned images as templates doesn't make your method better. It's just different.</p>
      <p>And, despite your insistence that revivalist work is irrefutably unimaginative, I must once again point out that a revivalist NEVER has a complete character set from which to work. The percentage sign, cent sign, commercial at, brace, bracket, florin, dagger, double dagger, pound sign, yen sign and mu were traditionally treated as pi characters, so there are no design-sensitive examples to go by; likewise, German double-s, eth and thorn are not present. And only in very rare cases are there design-sensitive examples of section marks and pilcrows. Applying the design "rules" of the letters and numbers to these neglected orphans requires insight, discipline and...dare I say...at least some modicum of <em>imagination</em>.</p>
      <p>I have said before, and will gladly repeat, that I have a great deal of respect for your work. Yes, I took a few cheap shots, but I was only returning fire...</p>
