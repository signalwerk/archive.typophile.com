      <p><em>Wow…a little interpolation and a little extra heft are REALLY BIG…</em></p>
      <p>I work by eye Nick, not interpolation.<br>
      I've never denied that Worldwide is based on Century, and it clearly states that on my web site. It was comissioned as a Century kinda thing by Tony Sutton, for the newspaper World Woman. News text is a notoriously conservative genre. I prefer to get commissions to do original designs (eg Richler), but I'm not going to turn down revivals, and I'm certainly going to add them to my retail collection.</p>
      <p>However, when you look at my body of work as a whole, you will see that the designs I've produced for the retail market are all original, far outnumbering the commissioned newspaper revivals such as Walburn (from Walbaum) or Goodchild/Nicholas (from Jenson). When I've done something retail derived from a classic, such as Bodoni Egyptian or Beaufort (based on Times' proportions), I've mixed it up with another idea and moved it a considerable distance from the reference.</p>
