      <p>Wiliam, of course there is a (small) place for the classics. One should know the history of one's culture, and maintain continuity. But not at the expense of present day artists and designers.</p>
      <p>On the subject of classical music, there was a time when American composers got no respect. Aaron Copland, a great organizer and activist, was a key figure in changing that. As Oscar Levant wrote (A Smattering of Ignorance, 1940) "...a performance of <em>Andromache</em> in Wurttemberg had received more space in that day's New York papers than the domestic Yaddo festival. “Frankly," he [Copland] said "under such circumstances I consider daily newspaper criticism a menace, and we would be better off without it." </p>
      <p>Akzidenz Grotesk, Bembo, Avant Garde, Garamond, etc., -- they're a menace, the heavy hand of the past stifling the present.</p>
      <p>But as I said, if you're gonna exhume something by Erbar, Feder Grotesk would be cool.</p>
