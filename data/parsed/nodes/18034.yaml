      <p>The 1909 Feder Grotesk looks interesting.<br>
      Noted: cap double-S!</p>
      <p><em>does anyone think it’s worth the try?</em></p>
      <p>I'm not a big fan of revivals... they are by nature unimaginative and often barely distinguishable from many already available fonts (which would be the case if you redid Erbar's 1920s Grotesk). Worse still is when the revivalist chooses to tinker with the original and make "improvements", which is like pissing on the original designer's grave. </p>
      <p>I wasn't impressed by the Stones at the Superbowl either. Sure, Mick's in great shape, but who needs Satisfaction Next -- it ain't 1965 no more.</p>
      <p>However, the exception is if there is something special or unusual in an old face that has been forgotten by history, then I'm all for bringing it back to life, and that seems to be the case with the 1909 face.</p>
      <p>And of course, use old designs as inspiration, but please come up with the big idea, don't just fiddle with details.</p>
