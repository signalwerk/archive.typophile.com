      <p>&gt;they are by nature unimaginative<br>
      &gt; the exception is if there is something special or unusual in an old face that has been forgotten by history</p>
      <p>So Nick, there is no place for classics? We should ban anyone from playing Beethoven, or writing music in the classical style? Or you would have banned Glenn Gould from playing Bach on a piano rather than a klavicord? </p>
      <p>While a great new typeface like Goudy Old Style, Electra or Palatino are more impressive achievements than a great revival like the Monotype Bembo, they are not necessarily more desirable for every project. </p>
      <p>I am very happy that we have classical music and classic jazz on the radio, and classic typefaces to use. And if someone can do a better version of a classic in digital form, such as Slimbach's wonderful Adobe Garamond, more power to them. </p>
      <p>I would certainly concede that it is a greater achievement to create a great new typeface, but there is imagination and knowledge and skill needed for revivals too. We can see this in the fact that some are much better than others. And the best are rightly welcomed by graphic designers. </p>
      <p>Avant garde is passé, and I don't mean just the typeface.</p>
