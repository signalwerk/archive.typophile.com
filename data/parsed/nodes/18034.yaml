    html: <p>Also Nick (Shinn), doesn't quality, in craft or beauty, matter as well as originality? If one isn't allowed to revisit old ground, then the flaws which affect the vast majority of even the best digital types can never be repaired. I wish it were legal to make and sell, say, a Bembo Book with corrected kerning (the 'at' kerning, for instance, is very noticably wrong), so long as the full price set by the originating foundry was passed back to them; the foundries are never going to fix the problems themselves, except in the occasional Next or Nova or Pro. As things are, Monotype forbid modifications even for private use.</p>
