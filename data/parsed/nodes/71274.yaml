    <p>Hi!</p>
    <p>I have a problem: I am working with fontforge on a font for a very complex artificial language (with hundreds of glyphs) that needs a lot of complex ligatures (with for example sovraposition of two or more glyphs).<br>
    Something like tibetan, if you want.</p>
    <p>I am encoding these glyph in the the unicode private area, and therefore, for istance, I have the following ligature: uniE2C2 + uniE2C2 = uniE2C3</p>
    <p>To compose them i use the ccmp funtion.</p>
    <p>Now, on my Mac these ligatures work perfectly, but if i try to put two uniE2C2 in text editor on windows (like Word, or even openoffice) they don't make any ligature...</p>
    <p>My problems are:</p>
    <p>why?</p>
    <p>what have I to do?</p>
    <p>Is it possible that it is due to the Unicode Private Area?<br>
    And indeed, given that these ligatures are for an artificial language and for an artificial script (that therefore, obviously, doesn't appear in the fontforge lists), what have i to set in the language aoptions? Default? or Martian?</p>
    <p>Thank in advance</p>
