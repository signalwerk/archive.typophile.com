    html: <p>Windows OTL support is driven by the Uniscribe shaping engine, which makes decisions about what script is being used and what features to apply based on Unicode encoding and text analaysis. My guess is that Uniscribe simply doesn't make any assumptions about PUA codepoints, and applies no layout features to them. Your report of Mac behaviour suggests that Apple have chosen to apply some (which?) features to PUA codepoints. I can see an argument for either approach. Obviously it is more helpful for you if some generic layout features such as ccmp are applied to PUA codepoints; on the other hand, since a PUA character can be anything, who is to say which layout features are appropriate?</p>
