      <p>&gt; can I ask you where have you found the information about the<br>
      &gt; languagesystem used by windows 7 uniscribe?</p>
      <p>We wrote some simple code that called the new <em><a class="freelinking external" href="http://msdn.microsoft.com/en-us/library/dd368557(VS.85).aspx" rel="nofollow">ScriptItemizeOpenType()</a></em> Uniscribe function on one-character Unicode strings (each being one Unicode character from the Unicode Standard, version 5.2). This call returned an array of OpenType script tags, or basically , one OpenType script tag per character. For the PUA characters, Uniscribe returned <code>SCRIPT_TAG_UNKNOWN (0x00000000)</code>.</p>
      <p>Adam</p>
