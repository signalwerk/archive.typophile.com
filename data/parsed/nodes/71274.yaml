      <p>John, </p>
      <p>it's not even the question of which features to apply, but above all: in which OpenType Layout languagesystem the features should be registered. Uniscribe examines each Unicode codepoint of a string and assigns a known languagesystem to it, and then splits the Unicode string into "runs" that are of the same languagesystem. Then, for each run, it applies the OpenType Layout features registered in the font for the corresponding languagesystem. </p>
      <p>Interestingly, the Windows 7 Uniscribe assigns the "DFLT" languagesystem to U+E000 and to U+F8FF, but no languagesystem to any of the PUA codepoints in-between. So in essence, Uniscribe doesn't "know" *which* languagesystem to apply the features for, and therefore it applies none. </p>
      <p>I guess it might make sense to suggest to Microsoft that future versions of Uniscribe should assign the languagesystem "DFLT" to all PUA codepoints, rather than just to the first and the last. But perhaps Microsoft had a good reason to do it the way they have done. </p>
      <p>Adam</p>
