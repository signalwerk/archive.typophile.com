      <p>The beak is a question of interpretation.<br>
      The stud on the beak varies in presence in Jenson's printed image, but it seems reasonable that he was quite taken with the idea of making the fit of his letters look like they were a close-fitting puzzle that had been slightly "exploded", and the stud looks like it locks against the n in particular.<br>
      Redesigners have generally incorporated the stud, because it's a signature device, and people expect it.<br>
      So Benton's close revival (Cloister, 1913) makes it quite prominent.<br>
      Rogers' Centaur (1914) has it very subtly, as does Frere-Jones' Hightower (1994).<br>
      Slimbach makes it a feature of Adobe Jenson(1996), and I have it in Goodchild (2003) and Nicholas, but quite small.<br>
      The stud is definitely a Jenson thang -- other neo-Venetians, eg Benedictine (1915) and Slimbach's Giovanni (1989) don't have it.</p>
