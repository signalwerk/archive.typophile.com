      <p><em>...to determine whether you like a font or not.</em></p>
      <p>I try to leave my personal likes and dislikes out of the analysis and appreciation of type. Apreciation of a particular design is best left unbiased by personal taste.</p>
      <p><em>...I have to say that I cringe every time I see it [Kabel], I just don’t like it, as I don’t like Avant-garde or Souvenir</em></p>
      <p>Sad (regarding Kabel). Souvenir isn't exactly my slice of cake either, but I stenuously avoid letting that affect my view of Souvenir for clients when that face is appropriate and useful to material employing it. I take the same attitude towards Avant Garde.</p>
      <p><em>...there is no serious questionıng about the fact that he deliberately tried to put calligraphic features in Kabel.</em></p>
      <p>I don't claim that calligraphic features were not what Koch had in mind when designing Kabel. I only asked, in a separate paragraph making no reference to Koch or Kabel, that you and other typophiles forget the calligraphic origin of <strong>e</strong>'s with oblique crossbars for a moment. My view of this is not fixated with the origin of this glyph design, but focussed on <strong>what it can be</strong>, its potential. </p>
      <p>j a m e s</p>
