      <p></p><div class="imageWrap"><img src="http://typophile.com/files/efit_4941.jpg"></div><br>
      It's a question of fit.<br>
      When the Venetian e is followed by certain characters, it's top right beak gets quite close.<br>
      Lowering the bar is an improvement.<br>
      Fitting is both a practical issue (involving wear and tear on type knocking together, and printing evenly), and a readability issue (letters forming unwanted "ligatures" in the eye).<p></p>
      <p>Having said that, the Venetian e is not a dysfunctional form per se, and since the historical revival era of the early 20th century has always been available in various types--Jenson revivals of course, but also new types, several by Goudy (most notable Californian/Berkeley), Giovanni, and of course Kabel.</p>
      <p>(Above: Adobe Jenson; below, Monotype Bembo, two revivals of the before-and-after scenario c.1500)</p>
