      <p>David,<br>
      <em>It’s hard for me to think of a real typophile with a total lack of feelings for a typeface. If you love them for real, you can’t be that much analytic and distant. can you?</em></p>
      <p>I love typography and typeface design as unconditionally as I can, balancing my gut emotional response with a <em>sense</em> of objectivity. I have feelings like every typophile, but I also feel strongly about the matter of tolerance. When I see typophiles cringing at great designs it smacks of intolerance. Tolerance of things that grate on you leads gradually, by degress, to appreciation of that thing---if you allow it to happen. Cringing every time you see it is like painting it black, precluding the opportuinity to see it in its true colors.</p>
      <p>John,<br>
      <em>Isn’t appreciation subjective? Or do you mean that we should always strive to be more objective?</em></p>
      <p>Yes. Appreciation is always subjective and we can never be truly objective, but striving for a balanced view helps develop an open mind.</p>
      <p><em>I guess James (and it is not my intention to put words in his mouth) is just trying to maker a clearer distinction between appreciation and opinion.</em></p>
      <p>Yes, there is a difference. </p>
      <p><em>No doubt James goes weak at the knees when looking at his favourite faces; but perhaps he’s just trying to say that for our opinions to be of any real value outside of ourselves, they need to be tempered with some cold-hearted objectivity.</em></p>
      <p>For our opinions to be of value to others we need to maintain an objective view for balance so that we know just where our subjective view is taking us.</p>
      <p>j a m e s</p>
