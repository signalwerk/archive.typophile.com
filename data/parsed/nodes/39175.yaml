      <p>Hey, folks. Going back to something John said earlier in this thread,</p>
      <p><em>I guess we can observe a similar phenomenon in the nascent days of any new technology; at first, the technology is used simply as a labour-saving device, doing pretty much the same task, only faster, more efficiently; then as it begins to mature it finds new and unique ways of expressing itself.</em></p>
      <p>Not only is a new technology used simply as a labor-saving device. Also, a new technology often follows the forms of the technology that preceded it -- hence we have early printed books following the style of the books created by scribes, early cars looking like horseless carriages, etc.</p>
