      <p>I also try to get a bit of objectivity when I assess a design. </p>
      <p>One good way is to ask what the purpose of the design is. Then you can ask well it fulfills that purpose. That purpose might be practical, like a readable road sign, or emotional, like conveying a happy mood or conveying authority. </p>
      <p>Another way is to try to separate style from how well a design is realized. For example, some people's taste is for simple designs and some more ornate. But even if you don't prefer a style you can see better and worse executions of it. It is also helpful to compare with designs of the same style or stylistic idea--such as humanist slab serifs or something like that.</p>
      <p>Admittedly, even after this there is a big element of what moves you aesthetically. And this is very hard to get any objective measure of, though you can talk about qualities like unity diversity and balance, interest, etc. </p>
      <p>Even conceding a big subjective element, it is surprising how far you can go with the more objective assessment.</p>
