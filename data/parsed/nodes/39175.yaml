      <p><em>...kabel, which i tend to hate because of this very feature: halfway between calligraphy and geometry, very unstable and quite ugly font - according to me, of course, please don’t shoot me.</em></p>
      <p>I won't shoot you but I will say that's a narrow view of Kabel and of <strong>e</strong> topology. Kabel is one of the great underappreciated linear type designs. Unconventional yes, but that is precisely why Kabel is a good thing. Typography needs great designs to challenge what we might call the "tyranny of mainstream values".</p>
      <p>Forget about the calligraphic origin of <strong>e</strong>'s with oblique crossbars for a moment. Type designers can include the structure for other reasons having nothing to do with calligraphy. The angle of such a bar harmonizes nicely with the branching angle of strokes attached to the stems of h, n, m and u, and harmonizes with angled stem ends (if present).</p>
      <p>j a m e s</p>
