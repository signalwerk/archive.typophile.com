    html: <p>I think Nick's point about the relationship of the 'beak' to a following serif and how this is improved by lowering the beak and, in the process, making the bar horizontal, has a lot of merit. That sounds to me like the way a type designer thinks about these things. The notion that the bar was made horizontal to 'mark the transition between calligraphy and typesetting' doesn't make sense to me. One can say that the horizontal bar became a mark of the typographic letter, which is a straight observation, but I don't think Griffo was sitting there thinking 'How can I make my type more typographic?' What would that question even mean at that stage in the development of typography? I find it much more likely that, through looking closely at letters, particularly at the sizes at which he was beginning to cut type, he noted how certain relationships could be made less cluttered.</p>
