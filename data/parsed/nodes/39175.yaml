      <p>James:</p>
      <p>I - of course - agree with you on the fact that typography can only enrich itself from the unconventional types being designed here and there, if the designer has some basic typographic skills, and Rudolf Koch undoubtedly had some. </p>
      <p>This being said, it is up to each and every one's taste, at the end, to determine whether you like a font or not. Though I recognize and respect Kabel as an important font in type history, I have to say that I cringe every time I see it, I just don't like it, as I don't like Avant-garde or Souvenir. </p>
      <p>At last, you tell me that my explanation of the Kabel's venetian e is a 'narrow view'. well, take a closer look at Kabel: large ascenders to x-height ratio, traditional roman shape for the lower case a, tail to the t, this venetian e, oblique endings to many of the strokes... i can't find right now any quotes from koch himself, but there is no serious questionıng about the fact that he deliberately tried to put calligraphic features in Kabel. let me take a copy of 'anatomy of a typeface' by lawson: ''as koch was in every sense a traditional designer - who had cut many of the punches of his earlier types by hand - he evidently found it more difficult than did Renner to depart from the normal roman forms''.</p>
      <p>david r</p>
