      <p>James:</p>
      <p>I just wanted to say that every time I am trying to find a typeface for a logo, for a customer, I also try to get the perfect one, and in my list of challengers are some fonts that I would never put on my business card...</p>
      <p>... but here I just, simply, say that I don't like this font or this one. And I always put my personal likes and dislikes in my appreciation of a type. I tend to judge types on several criterias, and how I feel when i see or use them is a very important one to me. I tend to consider types as living entities, some of them are nice to me, some are mean; some bring nice memories, some not really. Garamond will always be this old man I like to listen. Futura is an efficient - though cold - advertiser. Bello is the funny guy, sure to make me smile. Bodoni impresses me. Avant-garde is this weird tall guy from the seventies. Helvetica is a nice guy, always ready to help you, but isn't very talkative. </p>
      <p>It's hard for me to think of a real typophile with a total lack of feelings for a typeface. If you love them for real, you can't be that much analytic and distant. can you?</p>
      <p>dr</p>
