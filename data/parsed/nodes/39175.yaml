      <p>Resil:</p>
      <p>As far as I know, in order to mark the transition between calligraphy and typesetting. The early types (Jenson et al) were exact adaptations of the Renaissance humanist calligraphy, and the oblique cross bar, which also extends out of the letter shape, looks exactly like what it is then: a pen / feather stroke, which naturally comes all the way up, following the movement of the hand. When Garamont and his fellows took over the engraving of following types, they kept the overall look of the letters but modified them in order to bring more harmony, structural strength and aesthetic improvements: they basically transformed a calligraphy into a typography. That transition was not as obvious as the one done by Grandjean, Caslon and Baskerville some years later, but it is what I think the correct answer to your question.</p>
      <p>David R</p>
    html_clean: |-
