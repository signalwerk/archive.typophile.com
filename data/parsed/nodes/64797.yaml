      <p>———————————————————————-<br>
    For Immediate Release:<br>
    Buffalo, NY- November 23rd, 2009</p>
    <p>P22 Type Foundry and the International House of Fonts proudly announce the P22 Stickley Text Pro Family, an Arts and Crafts-inspired type design with Pro OpenType features designed by Michael Stickley for IHOF.</p>
    <p></p><div class="imageWrap"><img src="/files/StickleyTextPosterC_6001.png"></div><p></p>
    <p>Stickley Text Pro is classic in its roots, pulling from Humanist and Oldstyle history, yet contemporary in its execution. It is quiet in its presentation and meant to allow clarity and legibility while adding its own character. It is intended to be used at text sizes in book settings, but is also suitable for a variety of design purposes.</p>
    <p>Pro Opentype features include ligatures, oldstyle and lining figures, alternates, Central European characters and Swash Caps for the Italics. Stickley Text Pro is a feature rich workhorse with international functionality.</p>
    <p>The Stickley Text Pro Family contains four 4 Pro and 8 basic OpenType styles- a total of over 3,000 glyphs. For more information and to download the Stickley Text Pro Specimen:</p>
    <p><a href="http://www.p22.com/ihof/stickley.html" title="http://www.p22.com/ihof/stickley.html">http://www.p22.com/ihof/stickley.html</a><br>
    Introductory offer through November 30th.</p>
    <p>———————————————————————-<br>
    You can now follow P22 on Twitter.com: <a href="http://www.twitter.com/P22TypeFoundry" title="http://www.twitter.com/P22TypeFoundry">http://www.twitter.com/P22TypeFoundry</a></p>
