    html: <p>Alex, maybe Yves likes to play your game, but I would rather help someone try to find something they don't already know than be 'tested' with two letters (one of which is almost useless) from a variety of fonts that could come from anywhere. That style G is about the most common one there is. <br> <br>You've got to be kidding if you think we are going to know 'Ribjoint' from CAKE Publications, based on the G, or even the whole alphabet. And I'll bet your clue about Bitstream is absolutely the only reason Yves picked their version of Gill Sans. There is no difference in those two characters. <br> <br>I know I don't have to 'play', but I have to say that such questions seem to me like a waste of time.  <br> <br>Where is that 'Bah Humbug' when I need it?</p>
