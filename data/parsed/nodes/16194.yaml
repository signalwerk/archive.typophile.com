      <p>Sorry for weighing into this thread late. I was in Japan when it was first posted, and not getting my regular Typophile fix.</p>
      <p>In any case, it looks like the samples John asked for are posted now. Originally, Flash 8 was to include <a href="http://www.merl.com/projects/ADF-Saffron/">Saffron</a> from Mitsubishi Electric Research Labs. I have no idea whether that's still true or not.</p>
      <p>To my eyes, the "optimized for readability" looks like pretty much yet another ClearType clone. It's obvious that there's some hinting going on (the x-height takes a big jump in some sizes, a clear sign of hinting), but I'm not sure whether the hints are somehow extracted from the font or are autogenerated. Regarding the subpixelling, in default settings, there's more color fringing than its direct competitors, but at least that's tunable.</p>
      <p>To be honest, I'm a little burned out on font rendering stuff. The market has pretty much decided that MS ClearType is the way to go, and everybody that needs to ship a font renderer had better either clone or license it. There doesn't seem to be that much room for alternatives.</p>
