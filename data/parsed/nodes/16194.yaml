      <p>Si, you're welcome, and thank you.</p>
      <p>I argue that font software embedded in other software - say a dynamic, interactive Flash module or a video game - isn't much different from other uses of type resulting in "hard" products.</p>
      <p>A timely example: The original Xbox logo was built from Rick Valicenti's Bronzo typeface, published by Thirstype. This does not mean that he gets a penny for every Xbox logo moulded in plastic or embroidered on a baseball cap.</p>
      <p>Another Thirstype font, Traitor by Barry Deck, is used for the logo and identity of Comedy Central, as well as for on-air credits for programs. We do not receive residuals cheques monthly for this screen time.</p>
      <p>It seems to me that having one's fonts used in high-profile or wide-profile applications can contribute to further sales by people who have seen those applications.</p>
