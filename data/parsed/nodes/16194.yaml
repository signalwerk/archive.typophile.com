      <p><em>As far as I know, Flash does not embed fonts themselves. Instead it creates a set of symbols based on the outlines. In other words, it converts fonts to an internal graphic format.</em></p>
      <p>I don't think that should matter. Converting a font to another format, proprietary or otherwise, doesn't absolve you of your responsibilities around the font creator's wishes. </p>
      <p>This demo (<a href="http://www.kaourantin.net/2005/08/some-text-features-in-flash-player-8.html">http://www.kaourantin.net/2005/08/some-text-features-in-flash-player-8.html</a>) seems to prove that they are storing enough outline and metric information for this to be considered a converted fully functional font. This is not a simple convert to outlines static image. </p>
      <p>Converting a font prior to embedding in a document is fine, and if that's what Macromedia/Adobe are doing and they're following the OpenType spec with respect to font embedding permissions then I don't see a problem.</p>
      <p>If however the claim is that this is not "font embedding" as defined in the OpenType spec then that changes everything. Then the font creators wishes around conversion and redistribution have to be respected, and as practically no-one allows this currently, someone wanting to use a font in Flash in this way would have to get permission from a font creator to convert and redistribute in this way.</p>
      <p>Cheers, Si</p>
