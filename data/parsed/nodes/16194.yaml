      <p>Simon, in the Village and Thirstype EULA, the relevant clause states:</p>
      <p>"You can make archival copies of the fonts for your own purposes. You will not distribute the fonts to people outside of your organization. A copy of the fonts may be sent as part of a file release to a prepress bureau, if absolutely necessary. The fonts can be embedded in other software files, such as Portable Document Format (PDF) or Flash files, but you will take all reasonable care to embed the fonts in such a way that they cannot be extracted from the files you create."</p>
      <p>Which would allow embedding in a game UI. If the font can't be de-embedded from the game UI, then I personally see no difference between a typeface appearing in a game UI or a print ad or movie titles or a billboard or a TV commercial.</p>
      <p>Please note that this applies to the Village and Thirstype EULAs, which I administer, and does not necessarily reflect the EULAs of the other members of vllg. As always, and in all cases, please read the EULA for each font, and address any questions or requests for clarification to the relevant party.</p>
