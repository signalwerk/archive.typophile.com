      <p>Emigre has always excluded Flash from their EULA, which is both unwarranted and short-sighted and even silly (paranoid?). Flash isn't going anywhere. In fact, you can expect to see Flash take the place of Windows Media, Real and Quicktime, since Flash is both ubiquitous across platforms and because Flash video (FLV) requires no additional plug-ins on the users' end.</p>
      <p>John wrote:<br><em>Also, the rendering options provided to Flash creators indicate that Macromedia see rendering very much as a part of swf creation rather than swf display. The maker of a swf has control over what kind of rendering he wants to use and how he wants to tune it. The viewer of the swf has no control. Effectively, this is the opposite of most display technology.</em></p>
      <p>John, Photoshop has allowed creators to tweak anti-aliasing for graphical text (where neither the browser or the OS can render it). To my understanding, the same applies to Flash, where Flash has to control the rendering, independent of the browser or the OS. The value of Photoshop's approach is that it gives very fine controls, something Flash has lacked until now, and something that Flash still must aspire to.</p>
      <p>I would love the Adobe Photoshop gang to educate the Flash crew on proper anti-aliasing, provided they don't try to turn SWF into PDF and bloat the usefulness out of the format.</p>
