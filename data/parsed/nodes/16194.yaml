      <p>Mark, is your Proxima font TT or PS?</p>
      <p>Si, I'm not surprised that the FlashType renderer is ignoring system display settings, particularly those related specifically to ClearType: it seems to be pretty stripped-down to make it as small as possible. A big part of the success of the Flash Player is the quick download and install time.</p>
      <p>Also, the rendering options provided to Flash creators indicate that Macromedia see rendering very much as a part of swf creation rather than swf display. The maker of a swf has control over what kind of rendering he wants to use and how he wants to tune it. The viewer of the swf has no control. Effectively, this is the opposite of most display technology.</p>
