      <p><em>Converting a font prior to embedding in a document is fine, and if that’s what Macromedia/Adobe are doing and they’re following the OpenType spec with respect to font embedding then I don’t see a problem.</em></p>
      <p>As a font developer, I don't really have a problem with whatever they are doing because the font, however it or some representation of it is embedded in the .swf, cannot be extracted as a font, cannot be used outside the .swf, in short, is not being distributed "as a font." However, I can imagine a situation that would bug me.</p>
      <p>Say someone created an online application that sets type and generates a GIF or JPEG image for the user and delivers this as a file. And, let's say, this application includes a selection of fonts embedded within it, including one of mine. Such an application would seem to cross the line between application of a font (generally what users are expected to do with fonts) and redistribution of a font (a right font developers normally reserve for themselves and their agents). I would expect the developer of such a Flash application to acquire special rights from the owners of the fonts just as anyone who wants to bundle fonts with a desktop application.</p>
      <p>Online font preview test drives made in Flash (or other methods) come very close to crossing this line, but usually include some method (e.g., background patterns) to make it difficult or complicated to swipe.</p>
    html_clean: |-
