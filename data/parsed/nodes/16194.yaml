    <p>I've been doing some background reading on the new FlashType renderer in Macromedia Flash 8. See this <a href="http://livedocs.macromedia.com/flash/8/main/wwhelp/wwhimpl/common/html/wwhelp.htm?context=LiveDocs_Parts&amp;file=00001434.html">basic overview</a> and this explanation of <a href="http://livedocs.macromedia.com/flash/8/main/00001435.html#223833">rendering options</a>.</p>
    <p>Ironically, the example of Flash rendering shown <a href="http://www.kaourantin.net/2005/08/some-text-features-in-flash-player-8.html">here</a> uses my Constantia, one of the MS ClearType fonts, looking rather the worse-for-wear in FlashType: very grey with lots of colour fringing. Unfortunately, there doesn't seem to be any way to determine which of the rendering options was used in this example.</p>
    <p>I'm wondering if any of our resident rendering fanatics (Raph?) might have access to Flash 8 and could prepare some comparison samples showing the same text and font specs with different FlashType options enabled?</p>
