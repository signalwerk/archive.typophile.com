      <p>I've just been playing around with some of the anti-aliasing settings in Flash 8. On the Properties Palette for text, there is a pop-up that lets you control anti-aliasing of text with the following choices:</p>
      <p>&nbsp;&nbsp;Use device fonts<br>
      &nbsp;&nbsp;Bitmap text (no anti-alias)<br>
      &nbsp;&nbsp;Anti-alias for animation<br>
      &nbsp;&nbsp;Anti-alias for readability<br>
      &nbsp;&nbsp;Custom anti-alias...</p>
      <p>"Use device fonts" means that the system anti-aliasing (with settings controlled at the system level) will be used, but also means that the font needs to be installed on the system running the animation.</p>
      <p>"Bitmap text" is just what it sounds like. It works just as it did in the previous version of Flash.</p>
      <p>"Anti-alias for animation" looks like ordinary grayscale anti-aliasing.</p>
      <p>"Anti-alias for readability" uses sub-pixel antialiasing (like ClearType). I'm seeing some color fringing on my LCD Apple Cinema Display with this setting which I don't see in other programs.</p>
      <p>"Custom anti-aliasing" lets you tweak the anti-aliasing settings by controlling "Thickness" and "Sharpness". It also shows two values which can only be accessed via ActionScript--"Inside Cutoff" and "Outside Cutoff". I don't know what those mean (yet).</p>
      <p>Here is a simple sample I created:</p>
      <p><img src="/sites/default/files/old-images/flash-aa1.gif"></p>
      <p>The first custom setting I did lowers the amount of color fringing, but looks fuzzier. The second custom setting shows what the maximum sharpness value does. Lots of color fringing. I don't know yet how the other two settings affect any of this.</p>
