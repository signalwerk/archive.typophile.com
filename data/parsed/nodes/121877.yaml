      <div class="comment-spam-body"><p>I don't disagree with what you're saying, Martin. It's most definitely unfortunate that most Americans only speak English. My main point, though, is that it's more difficult to adequately learn a second language in the U.S. since there's relatively little opportunity to use, practice or keep up with it without really going out of one's way to do so.</p>
      <p>You mentioned growing up in the Netherlands, so within an extended region the size of the U.S. state in which I live, you had native speakers of Dutch, German, Flemish, French, English and, maybe, Danish. It might not have been strictly necessary to learn multiple languages there, but with that kind of diversity packed into such a small area, it seems logical that so many do so — especially given the largely borderless nature of travel, business and residency within the EU.</p>
      <p>That kind of linguistic diversity doesn't exist in most of the U.S.. So unless one lives on the border with Mexico or Quebec, the most practical and immediate reasons for most Americans to learn a second language don't exist, and the most effective opportunities to do so are absent as well. Whether this is good, bad or a mixed bag is another matter, but it is what it is.</p>
      </div>
