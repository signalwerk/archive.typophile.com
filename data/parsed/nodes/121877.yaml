      <div class="comment-spam-body"><blockquote><p>This just doesn't happen in the U.S., where English is spoken throughout. It's becoming increasingly useful to know some Spanish, but not really necessary in day-to-day life for most.</p></blockquote>
      <p>Well, you said it yourself; it does happen, though only with Spanish. I don't see how learning Spanish not being necessary for day-to-day life is an argument though. Do you reckon I have to speak German every day? I never speak German generally, though every time something German is on TV I have to smile because although I probably would never have taken on German myself, the fact that it was forced on me has been really beneficial. I'm rather upset by the fact we weren't taught Spanish in school.</p>
      <p>I originally come from the south of the Netherlands, close to the border of Germany. For us it's beneficial to speak German, especially since many go to Germany for gas and groceries, but it becomes increasingly irrelevant as new generations of Germans speak English. Most of the Netherlands doesn't have a need for it though and in fact further away from the border of Germany people aren't fluent in German despite being taught in school. Despite that, I consider it to be absolutely beneficial to learn at least one extra language, despite not needing it for day-today life. It's probably a good thing for your linguistic capabilities in general.</p>
      <p>What I find particularly interesting is that people think their language gives them the ability to communicate anything and everything. I find using one language to be stifling. Even knowing all the languages in the world should feel one restricted when faced with deeper reality. We can discuss this in another topic if interested, but I've experienced things for which there are simply no words as these experiences came about by neurological pathways which are normally not accessed. I submit that with every language, there are certain minor neurological pathways you would normally never use. I often find both English and Dutch to be lacking, so at times it's good to know multiple languages so I at least have the insight of what the language is lacking. If I didn't have that insight, I suppose in some instances I may be under the impression that I'm communicating accurately while this is in fact not the case.</p>
      <p>Also, I'm sad I don't master mathematics as this language seems to give many insights which are very hard to get to with ordinary languages.</p>
      <p>I guess this has been a long winded way of saying "one language is never enough, regardless of where you live".</p>
      <p>As for the notion that Americans have a vocabulary of 1500 words, I feel stupid for just accepting the statement blindly. I just read that the average native 4 year old has a vocabulary of 5000 words. The most common vocabulary size for foreign test-takers is 4500 words (and a different source says foreigners commonly have a vocabulary of 4000–9000 words). I just did a test to see how large my English vocabulary is, and apparently it's 20.600. I'm rather disappointed with that number, though I guess it falls perfectly within the average vocabulary of native speakers. I just thought my vocabulary was higher. I can barely imagine many native speakers knew any of the last words of the test. <a class="freelinking external" href="http://testyourvocab.com/" rel="nofollow">testyourvocab.com</a></p>
      </div>
