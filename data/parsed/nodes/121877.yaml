      <blockquote><p>Bert Vanderveen wrote: <em>"As is commonly taught in our middle schools the average American has a vocabulary of just 1500 words…"</em></p></blockquote>
      <p>I'm unsure where you got your information on this, but it differs considerably from I was able to find.</p>
      <p><a href="http://econ.st/16fiqV3" title="http://econ.st/16fiqV3">http://econ.st/16fiqV3</a><br>
      <a href="http://bit.ly/SBhB2l" title="http://bit.ly/SBhB2l">http://bit.ly/SBhB2l</a><br>
      <a href="http://bit.ly/1wnxF6u" title="http://bit.ly/1wnxF6u">http://bit.ly/1wnxF6u</a></p>
      <p>I wouldn't be surprised if only about 1,500 words are needed for typical conversations, but according to the information in these links (and the studies they reference), most adults have a vocabulary in the neighborhood of 30,000 to 60,000 words.</p>
      <p>Unlike most Europeans, it's unfortunate, but true, that most Americans can only speak English. Still, it's understandable given the number of native languages spoken in Europe as opposed to the lack of linguistic diversity the U.S.. </p>
      <p>Despite being similar in land area, Europe has a couple dozen major languages and many more distinct regional dialects. A day's drive through Europe can easily cross several borders where entirely different languages are spoken. This just doesn't happen in the U.S., where English is spoken throughout. It's becoming increasingly useful to know some Spanish, but not really necessary in day-to-day life for most.</p>
      <p>Even those Americans who have learned new languages while living abroad often tend to forget, over time, most of what they learned upon returning home. Unlike Europe (or much of the world), only limited opportunities exist to, even, use another language.</p>
