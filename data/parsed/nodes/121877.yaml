      <div class="comment-spam-body"><blockquote><p>I don't disagree with what you're saying, Martin.</p></blockquote>
      <p>Haha I actually wasn't trying to make a big argument against you. I started with a slight disagreement and then got carried away with my own story and forgot I was responding to anyone in particular.</p>
      <blockquote><p>My main point, though, is that it's more difficult to adequately learn a second language in the U.S. since there's relatively little opportunity to use, practice or keep up with it without really going out of one's way to do so.</p></blockquote>
      <p>I get that, and I don't think the average American can do much about it, though I do think there will be plenty of opportunities to take Spanish at school. However, I believe some languages should become part of the standard subjects you take at school. It's probably not so much about practicality as it is about general insight and becoming well versed with languages. I started learning English at school at age 10 or 11, French at 13 and German at 14. For some reason French just didn't stick, though I can read some. I think it's a beautiful language but rather difficult, and I guess I didn't really see the practicality of it. I still don't. In the Netherlands you get to choose a profile at high school and each profile has specific classes. I chose "culture &amp; society" which included a particular focus on language, so I had to choose between advanced French or German and chose the one which I thought was easier.</p>
      <p>If I had the choice I honestly don't know if I would have chosen a language besides English at all, but I'm very glad it was forced on me. I think people should start learning languages very young. I consistently scored higher at English than I did at Dutch because I find English grammar to be easy and I basically grew up with the language, where everything on TV was subtitled in Dutch and all my games were in English. It got to the point where I install Windows and all other software in Dutch, because I hate having it all in Dutch.</p>
      <blockquote><p>It might not have been strictly necessary to learn multiple languages there, but with that kind of diversity packed into such a small area, it seems logical that so many do so — especially given the largely borderless nature of travel, business and residency within the EU.</p></blockquote>
      <p>Actually I don't think that's exactly the case. English is supposedly taught anywhere, but in the EU there are many countries where people just refuse to speak a foreign language. The Netherlands is quite an exception and in fact we get a lot of exchange students simply because we're well versed in languages and most of our schools teach in English. I'm supposed to be doing my study in Dutch, but half of it is in English because of exchange students. I love that, but a few people of my class have complained because they're not very well at talking English and didn't choose a Dutch study for nothing, because we also have official English studies at our school. I considered doing my degree in English. I didn't, so now I'm just glad I get to talk English half the time anyway.</p>
      <p>In the last years the Netherlands has been dubbing cartoons for kids, but I actually grew up with English cartoons with subtitles. I consider it to be a regression that we're dubbing now. It seems in every country where people refuse to speak foreign languages, they dub everything. So, I think part of the reason why people aren't great with languages in other countries is because they refuse to become intimate with it. They dub absolutely everything and I've heard many Germans actually don't know what the actors really sound like because they're used to the German dub. They do it in Spain, Portugal, France, Germany, Italy, Ukraine, Poland and probably a lot more countries. We still don't do that for movies unless they're for children. When I was in Paris 9 years ago, I saw posters for English lessons everywhere in the metros, but no one around me could talk English and if they did, they refused to. Things may have changed since then, but I find it a bit hard to believe. The new generations do obviously learn English though.</p>
      <p>Also, we Dutch learn English, German and French almost by default and some schools offer options for more unusual languages. If you study at a high level you also get to learn Latin and Greek, but I suppose that's the case in other countries as well. However, other countries certainly don't learn Dutch. I've never heard of Germans learning Dutch, French or Italian, of Italians learning German, of French learning Dutch (even though half of Belgium speaks Dutch and the Belgians certainly learn French) or Spanish. So it's really not like we're all learning extra languages because of our close proximity. English is the only language that is taught everywhere. Years ago I hung out with a Polish family in Italy and despite the fact that their teenage kids listened to Eminem non-stop (or perhaps because of it), they couldn't speak any English.</p>
      </div>
