      <p>Bert, I considered that, but I saw several articles based on the same source that stated men generally use 7000 words per day while women use 20.000 words per day. Would the 1500 words be unique words?</p>
      <p>As for the pronunciation of typefaces, I feel words like "neue" should be pronounced correctly. When it comes to the names I would actually encourage your own pronunciation. Also, I find it odd Americans get angry by the notion there is an alternate pronunciation and indeed it's arrogant to pretend the English pronunciation is the correct one, but I must say people often sound pretentious when they pronounce foreign words correctly. In my opinion that should be done when you speak the language, but I think in the Netherlands people would also look at me weird if I were to pronounce all Italian foods correctly. We're so used to the Dutch pronunciations of Italian names (who even says 'spaghetti' the way Italians do?), it's just too obtrusive to use a foreign pronunciation in a sentence in your own language. I feel the same way about the names of typefaces. Especially the German names sound odd when spoken by an English speaker.</p>
      <blockquote><p>Martin, Latin and Greek used be part of public education in the US, but by the time I entered high school (1980) it had been out of fashion for at least 20 years</p></blockquote>
      <p>Actually, when it comes to Latin and Greek I think it's justified that it's not part of standard education. In the Netherlands Latin and Greek are only taught to the people who do high school at the highest level, since I suppose these are the people who are more likely going to be doctors, biologists, historians, linguists etc. There's no need to learn Latin if you intend to become a barber, of course.</p>
      <blockquote><p>As for foreign languages, even the high school in my remote, Midwestern hometown offered Spanish, German, and French. Unfortunately, those elective classes were scheduled opposite the art, chemistry, physics, biology, and advanced English classes I also wanted to take. So, no foreign language for me in high school.</p></blockquote>
      <p>I was forced to do either advanced French or German as it was part of the profile I chose. I think if I would have had free choice, I might have chosen a scientific class instead. I'm not sure if that would have been better for me. Back then I wasn't particularly fond of school, but right now if I could re-do it I would have loved to do both. I feel guilty about every opportunity I miss to learn.</p>
      <blockquote><p>The experience improved my grasp of English grammar, allowed me to do primary source research in art history in the original language, and broadened my social world.</p></blockquote>
      <p>That's really what I encourage. I know there are many people who don't see the practical use of learning a secondary or tertiary language, but it opens up so many possibilities. Suddenly you have access to documents you didn't have access to before. I would love to be fluent in French, Spanish, Latin, Greek and Russian at least. I live in a house with Chinese people, so I guess Mandarin would also be handy, but just for fun. It would be great to be able to read any old book you might find in whatever language.</p>
      <blockquote><p>Sadly, because the rest of the world teaches English in its schools, we have the arrogance to think we don’t have to learn their languages. And we are poorer for it.</p></blockquote>
      <p>Exactly. In hindsight I find it hard to understand people don't learn several languages. I don't really know what Dutch is good for though.</p>
