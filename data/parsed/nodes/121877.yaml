      <p>Curiously enough, I am also used to call an error a "typo" but, quite surprising, the <a href="http://www.etymonline.com/index.php?term=typo" rel="nofollow">Online Etymology Dictionary</a> tells me</p>
      <blockquote><p>typo (n.)<br>
      1816, "compositor," short for typographer; 1892 as short for typographical error.</p></blockquote>
      <p>... so it's actually the <em>reverse</em>. So I am apparently a typo!</p>
