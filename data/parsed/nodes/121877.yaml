    <p>I’ve been seeing the curious use of “typo” to mean “font” or “typeface” with what seems increasing frequency, usually from folk who identify themselves as tyros. Where has this odd usage come from? From where is it being picked up? Are these people truly unaware that “typo” means an error in typesetting? It makes their posts both baffling and amusing.</p>
    <p>David</p>
