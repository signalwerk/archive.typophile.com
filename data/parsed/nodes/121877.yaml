      <p>Martin, Latin and Greek used be part of public education in the US, but by the time I entered high school (1980) it had been out of fashion for at least 20 years (not that I’m a particular fan, but as an example our former President, Bill Clinton, studied four years of Latin at Little Rock High School in Arkansas in the early 1960s). Classical languages held on longer—and are still taught—in private preparatory or “prep” schools and in Catholic elementary and high schools, but usually as electives these days, not as required parts of the curriculum.</p>
      <p>Thanks to a 9th-grade English teacher who used to be a Latin teacher, I learned the Greek and Latin etymology of English words and am grateful for the instruction. As for foreign languages, even the high school in my remote, Midwestern hometown offered Spanish, German, and French. Unfortunately, those elective classes were scheduled opposite the art, chemistry, physics, biology, and advanced English classes I also wanted to take. So, no foreign language for me in high school.</p>
      <p>Which is why I picked a private liberal arts college that required proficiency in a foreign language of all its graduates. While my choices were much broader than in high school (they included Japanese, Chinese, Russian, Hebrew, Latin, Greek, Portuguese, Italian, Marathi, and Arabic), I had the same scheduling problem—the language I wanted to study (Russian) was scheduled opposite all my required art classes. So I ended up studying four years of French, living in the French language interest house, and getting fluent enough to be asked to work as a grader for the French department. The experience improved my grasp of English grammar, allowed me to do primary source research in art history in the original language, and broadened my social world.</p>
      <p>But to your point, unless I make a concerted effort to practice the language, I don’t speak it often these days. And given my choice of language and where I live, I don’t encounter many other people who speak it, either. The last time I remember using it in public was at the Philadelphia Museum of Art, when a French couple was getting bad advice as to where to hail a taxi from one of the museum shop clerks. When I added my two cents in French, they seemed pleasantly surprised and grateful for the assistance. After the couple left, the clerk asked me if I were French, too, and was surprised when I said no.</p>
      <p>I still watch unsubtitled French films and read books in the language, but it’s not the same thing as speaking the language every day.</p>
      <p>The average American still adamantly hangs on to the notion that if you live in this country, English is the only language you should speak. Bilingual education for recent immigrants has fallen out of favor, foreign language instruction in public schools is often seen as an unnecessary luxury, and people look at you sideways for pronouncing foreign words correctly. Sadly, because the rest of the world teaches English in its schools, we have the arrogance to think we don’t have to learn their languages. And we are poorer for it.</p>
