    html: |-
      <p><cite> Are these people truly unaware that “typo” means an error in typesetting?</cite></p>
      <p>Well, a word means what people agree upon it means. Meanings change over time or change with context. So if enough people agree that typo is another word for typeface, than it can be a “correct” use.   </p>
      <p>I think it’s rather clear where this newer meaning comes from. When people talk about typography, the choice of typefaces is mostly the main aspect. In a corporate design manual for example, there is usually a section titled “typography” and then it shows the corporate fonts. Typo — short for typography&nbsp;—&nbsp;then becomes a synonym for typefaces. </p>
      <p>I discourage people from using that new meaning though. It’s useful to have a distinction between the use of typefaces and the typefaces itself. Blurring those meanings is not helpful. </p>
      <p>But I wouldn’t call it “baffling and amusing” when other people use different meanings of words. The way they learned those meaning through interacting with other people, is not different from how you might have learned the other, older meaning (typing error). Your meaning is not more “correct” because it is older. That’s not how language works.</p>
    html_clean: |-
