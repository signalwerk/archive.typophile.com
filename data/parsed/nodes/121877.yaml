      <div class="comment-spam-body"><p>I'm a bit skeptical of the high numbers given on those sites too. My best guess is an average American adult vocabulary (knowing the definition of words as opposed to simply recognizing them) consists of around 15,000 to 20,000 words, but, hey, I'm no expert.</p>
