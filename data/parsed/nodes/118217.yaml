    html: |-
      <p>A prolific 19th century type designer named  Hermann Ihlenburg may have been the originator of the style of using circular swirls to embellish a typeface, which was then sold as Houghton by ATF and later as Edison by Bauer and Berthold. See for example the revivals by Spiece Graphics as Edison Swirl <a href="http://www.myfonts.com/fonts/spiecegraphics/edison-swirl-sg/" title="http://www.myfonts.com/fonts/spiecegraphics/edison-swirl-sg/">http://www.myfonts.com/fonts/spiecegraphics/edison-swirl-sg/</a> and by HiH as Edison <a href="http://www.myfonts.com/fonts/hihretrofonts/edison/" title="http://www.myfonts.com/fonts/hihretrofonts/edison/">http://www.myfonts.com/fonts/hihretrofonts/edison/</a><br>
      The _P_ and _H_ in your image look like modified versions of the _P_ and _H_ in Houghton.<br>
      Don</p>
