      <p>You can probably lift the swirls from various parts of Edison and paste them on a simple set of lettering that matches the other letters.<br>
      BTW this is not the first swirl font. Earlier ones include John cummings Kismet from 1879 <a href="http://www.myfonts.com/fonts/linotype/kismet/" title="http://www.myfonts.com/fonts/linotype/kismet/">http://www.myfonts.com/fonts/linotype/kismet/</a><br>
      Don</p>
