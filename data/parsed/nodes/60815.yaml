    votes: null
    html: |-
      <p>In the Phil's Photo book "Homage to the Alphabet" from 1985, there is a script called Brandywine which seems to match every character. It has alternate glyphs for G, J, O, S, r, s and z.</p>
      <p>In one of the Expresiv font collections (Photolettering) from 1994 was a font called GonzalesJeanette which is a version of Brandy without both alternates of these characters. I will make a sample to post soon.</p>
      <p>- Mike Yanega</p>
