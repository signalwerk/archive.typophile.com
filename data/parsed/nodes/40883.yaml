      <p>On 27th February, 2008, Microsoft was fined again by the European Commission. In this new case, the sum of the fine was 899 million Euros, i.e. more than one billion Dollars, i.e. more than $ 1,000,000,000.</p>
      <p>(For this sum, instead of buying Arial, Segoe and other ripoffs, you could buy a lot of original fonts, couldn't you?)</p>
