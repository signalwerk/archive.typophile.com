    html: |-
      <p>Fonts are software.<br>
      Bundling fonts with an operating system is quite similar to bundling a browser.<br>
      In both cases the dominant company provides an ancillary, lesser-valued product for free as an added value, because it facilitates the use of its major product. Meanwhile, there are small, independent companies whose sole business is the lesser-valued product, whose potential customers now don't need to buy that kind of product.</p>
