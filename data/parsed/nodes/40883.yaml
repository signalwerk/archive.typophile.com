    <p>Brussels, 14th January 2008</p>
    <p><cite>"Antitrust: Commission initiates formal investigations against Microsoft in two cases of suspected abuse of dominant market position"</cite></p>
    <p>For details read:</p>
    <p><a href="http://europa.eu/rapid/pressReleasesAction.do?reference=MEMO/08/19&amp;format=HTML&amp;aged=0&amp;language=EN&amp;guiLanguage=en" title="http://europa.eu/rapid/pressReleasesAction.do?reference=MEMO/08/19&amp;format=HTML&amp;aged=0&amp;language=EN&amp;guiLanguage=en">http://europa.eu/rapid/pressReleasesAction.do?reference=MEMO/08/19&amp;forma...</a></p>
    <p><cite>"The European Commission has decided to initiate two formal antitrust investigations against Microsoft Corp concerning two separate categories of alleged infringements of EC Treaty rules on abuse of a dominant market position (Article 82). The first case where proceedings have been opened is in the field of interoperability in relation to a complaint by the European Committee for Interoperable Systems (ECIS). The second area where proceedings have been opened is in the field of tying of separate software products following inter alia a complaint by Opera."</cite> etc. etc.</p>
    <p>For previous investigations see <a href="http://typophile.com/node/37143" title="http://typophile.com/node/37143">http://typophile.com/node/37143</a></p>
