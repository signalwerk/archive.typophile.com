    html: |-
      <p>Given that it's only two lines of type and there are more variations than can be accounted for by stylistic alternates, I think Don is correct--this was most likely hand-lettered by a calligrapher.</p>
      <p>Alana achieves the same feel, and Laura Worthington has other fonts in the same style. Here's a link to a site that also lists similar fonts:</p>
      <p><a href="http://www.fontspring.com/similar/laura-worthington/alana" title="http://www.fontspring.com/similar/laura-worthington/alana">http://www.fontspring.com/similar/laura-worthington/alana</a></p>
