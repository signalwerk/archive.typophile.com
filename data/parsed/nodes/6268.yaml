  html: "<p>This is kind of awkward, but I feel it's necessary, and I <br>think the \"News\" section is the least worst place to do it. <br> <br>I was skimming through the transcripts of the SoTA chat (which might have been unfair to publish if people thought the \"recorder\" was off after the first hour - but candor is always of long-term benefit), and of course I already realized that some people (including some \"famous\" designers) avoid Typophile -and other fora- because I happen to be here*. The core reason is probably that I might violate their personal social rules and make them uncomfortable and/or waste time defending their stance. There are many reasons I see a problem with such a mindframe, but it's not for me to decide how people live their lives. The thing is, I'm not going to leave (partly because every other day somebody writes to say that my participation is appreciated - thanks guys). On the other hand, I also think the participation of some people who avoid me might be good for Typophile (in fact for me too), and I hate being an obstacle to that. <br> <br>* In fact I happen to know there's a private typographic discussion list where every so often somebody says \"Isn't it great that Hrant isn't here\"? I don't know how good the content on that list is - maybe it's more like a social club? But it does serve a purpose, otherwise it wouldn't exist. <br> <br>So here's what I propose: <br>If anybody wants me to avoid him/her, just tell me. Please believe me, chances are very slim that you'll hurt me, and I don't hold grudges either - just ask RVL. If you identify yourself as such a person, I promise not to reply to anything you post, and I won't participate at all in any thread you might start (as long as there's no direct reference to my person or my foundry). I will however read what you write - I hope that's OK - it will have to be. <br> <br>Please convey this to whoever might benefit from hearing it, and if they <i>still</i> refuse to participate, then at least we can have a better idea why. Typophile probably won't get a horde of famous participants all of a sudden (some people really don't like to discuss type, even if they love making it), but hopefully shelter from my overly incisive nature will make some people feel like it's worth it. <br> <br>This is as nice as I get - sorry. If it's not good enough, it's really mostly your loss. I hope you can see Typophile as a safe watering hole, or anything else that works for you. Please don't be afraid, I'm really never that hungry. <br> <br>-Hrant <br></p>"
