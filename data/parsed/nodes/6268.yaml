    html: "<p>Paul, thanks for your support - it's why I stay. <br> <br>But really I can't agree with: \"anyone whose fragile ego can't withstand your honesty probably isn't worth listening to anyway.\" <br> <br>In the same way that the ability of a person to make nice fonts is no indication that he's a reasonable person worth trusting, just because somebody is too weak to put up with me doesn't mean he can't make himself useful to others. They might be weak in that way, but they're often strong in others, which I hope will come out. <br> <br>What I'm hoping to do is: <br>1. Get certain people comfy enough to post on Typophile, since people (including me) can benefit from that. <br>2. Deflect the scapegoating that I'm the reason some people don't post. There's a bigger truth. <br> <br>The second one is admittedly mostly on a personal level, but the first is the main one. <br> <br>hhp <br></p>"
