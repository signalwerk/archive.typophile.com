    html: "<p>Hrant, I'm still a type design novice, and I've only been posting here recently (after a longer period of lurking). <br> <br>However, in addition to being an incredible help in the critique forum to young designers like myself, it is my impression that you are: knowledgeable; honest; moral; passionate about letters; culturally savvy; open-minded; and eloquent in expressing your thoughts.   <br> <br>People who \"get along\" with everyone are generally shallow people who don't stand for anything. <br> <br>On the other hand, your opinions seem to ruffle a lot of feathers (I've read the heated arguments on Typo-L and other lists), but I've never seen you intentially antagonistic or unwilling to immediately forgive any slight against you. <br> <br>I think the people here are fortunate to have your input, and anyone whose fragile ego can't withstand your honesty probably isn't worth listening to anyway. <br> <br>Paul</p>"
