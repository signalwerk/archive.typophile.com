  html: |-
    <p>Target audience: Men ages 25-40, active, hikers/backpackers, campers.<br>
    Colors: Black, bold orange, dark gray, sky blue.</p>
    <p>I have my heart set on using a flame somehow, but was advised that a plus sign would be more fitting. It was said to be 'too girly'.. </p>
    <p>I am aiming for a 'swiss' feel. </p>
    <p>The fonts used on the left: Intro<br>
    On right: Trade Gothic, Bebas, then two versions of Univers. </p>
    <p>HOW do I make it more manly with using orange.<br>
    Help!</p>
