    html: <p>Nice post from Adam. Just a couple of comments. <br> <br>3) Although it's good to use consistent suffixes, people should be aware that from a technical perspective the suffix is irrelevant. <br> <br>5) Some symbols have Unicode codepoints, and if so one should use the appropriate uniXXXX/uXXXXX name. Otherwise, as Adam says, one can name them whatever one likes (as long as it doesn't conflict with names that have defined meanings). <br> <br>Cheers, <br> <br>T</p>
