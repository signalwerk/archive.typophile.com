    date: 2004-03-24T09:31:00
    date_raw: 24 Mar 2004 — 9:31am
    votes: null
    html: "<p>Peter,  <br> <br>1. Instead of using arbitrary names for your glyphs (\"middot\"), I suggest that you use standardized names listed in the Adobe Glyph List For New Fonts 1.1 (in your case, \"periodcentered\").  <br> <br>You will find all the Adobe Glyph List For New Fonts 1.1 at <a href=\"http://partners.adobe.com/asn/tech/type/aglfn13.txt\" target=\"_blank\">http://partners.adobe.com/asn/tech/type/aglfn13.txt</a>  <br> <br>2. For glyph names that are not in the Adobe Glyph List For New Fonts, check whether the glyph is a basic (default) form of a character encoded in the Unicode Standard. If so, use the Unicode-based glyph name:  <br>a) for BMP Unicode codepoints, use the name \"uniXXXX\" where XXXX are the 4 hexadecimal digits representing the codepoint.  <br>b) for non-BMP Unicode codepoints, use the name \"uXXXXX\" where XXXXX are the 5 hexadecimal digits representing the codepoint.  <br> <br>3. If a glyph is an alternate form of a character that is encoded in the Unicode Standard or is listed in the Adobe Glyph List For New Fonts 1.1, use the glyph name of the basic form followed by a period, followed by a suffix. For the suffix, use the name of the OpenType Layout feature that you would most likely access that glyph through.  <br> <br>For example, for a small-caps A, use \"A.smcp\", for a styllistic alternate R use \"R.salt\", for a swash Q use \"Q.swsh\", for a superior m use \"m.sups\", for a tabular 5 use \"five.tnum\" etc. If there are multiple OpenType Layout features that can be used to access a glyph, pick one of your liking.  <br> <br>4. If a glyph is a ligature that is not found in the Adobe Glyph List For New Fonts, use the glyph names of the glyphs that form the ligature, concatenated using underscore. For example, for a ct ligature, use \"c_t\", for an ffi ligature use \"f_f_i\", for a ligature of long s and i use \"longs_i\".  <br> <br>5. If a glyph is an ornament, a non-textual symbol etc., use a glyph name of your liking.  <br> <br>6. Assign proper Unicode indexes to the glyphs discussed in (1) and (2). If the same glyph represents more than one Unicode character:  <br>a) create multiple glyphs with identical content but different names, and assign one Unicode codepoint per glyph; for example, create a \"periodcentered\" glyph and encode it as U+00B7, and create a \"uni2219\" glyph and encode it as U+2219.  <br>b) alternatively, either assign multiple Unicode codepoints to your glyph; for example, for \"periodcentered\", assign U+00B7 and U+2219.  <br> <br>7. For glyphs discussed in (3), (4), (5), you may but don't have to assign custom codepoints from the Unicode Private Use Area (PUA): from U+E000 to U+F8FF. I recommend against assigning these codepoints, but for some applications (e.g. Microsoft Word 2003 for Windows), assigning PUA codepoints may be the only way to display such glyphs in your font.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.  <br></p>"
