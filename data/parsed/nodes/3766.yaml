  - id: 28373
    user: 1262
    date: 2004-03-24T12:34:00
    date_raw: 24 Mar 2004 — 12:34pm
    votes: null
    html: "<p><i>I figured that it is safer to double/triple encode the periodcentred, but is there any particular reason why is it done? John, do you know of any application that needs different codepoint than the standard U+2219? I am just wondering why the standard Latin 1 encoding would include 'wrong' codepoint. Or is periodcentred used in also another language than Catalan?,</i> <br> <br>I'm not sure that the Latin 1 encoding claims support for Catalan. I've looked into this some more, and I think I may be mistaken in my identification of 2219 as the correct codepoint for the Catalan dot. I thought this was noted on the MST website somewhere, but I cannot find the reference now and instead note this, from the <a href=\"http://www.microsoft.com/typography/developers/fdsspec/diacritics.htm\">Diacritics Design Standards</a>: <br><i> <br><b>L or l Catalan (L with mid dot) </b> <br>This character is actually a compound character made from a base character and an additional punctuation character. The mid dot is used in the Catalan language to separte two lowercase l or two uppercase L characters that are not part of the same syllable in a word.  <br> <br>The mid dot is commonly made from the overdot diacritic U+02D9 or a character made specifically for this purpose. Often the period U+002E, period centered U+2219 or mid dot U+00B7 are not an appropriate size for this character. The dot in the L or l Catalan character should be positioned to center vertically on the uppercase height and center horizontally when followed by another L or l. </i> <br> <br>This seems to me very unsatisfactory, because although the U+02D9 <i>glyph,</i> is an appropriate size for the Catalan dot, it is not necessarily the appropriate character code to use. <br> <br>Peter, try this: In WordPad on Windows, enter the Catalan dot from your Catalan keyboard -- resulting in a .notdef glyph I presume -- and then enter alt+X this will convert the preceding character to a hexadecimal character code, so you can confirm exactly what Unicode value is input from the Catalan keyboard.</p>"
  - id: 28374
    user: 1262
    date: 2004-03-24T12:39:00
    date_raw: 24 Mar 2004 — 12:39pm
    votes: null
    html: <p>I just checked the Unicode standard, which includes a precomposed L=middot for Catalan (based on some old 7- or 8-bit Spanish standard), and the compatability decomposition for this indicates that the dot is, in fact, U+00B7. So please ignore my previous advice re. U+2219. <br> <br>What Catalan keyboard driver are you using? My Windows XP does not ship with a Catalan keyboard.</p>
