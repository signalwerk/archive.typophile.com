  html: <p>I've asked this already on FL list, but now think that this might be a more better platform fot my question. <br> <br>I have a question concerning Catalan middot in PC TTF. I generated fonts in FL with a standard Latin 1, <br>1252 encoding, and the middot (aka periodcentered) had 00B7 unicode value, yet it seems that it doesn't function properly on a PC. Now I am looking around and see that other values e.g., 22C5, 2219 are also used. Does anyone know where are these values coming from? Is it necessary to encode the middot to all three of them? <br> <br>Is there a know issue about using middot in various PC applications? Does anyone have experience with this? <br> <br>Thank you, Peter</p>
