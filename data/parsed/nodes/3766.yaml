    html: <p>Adam, John thanks for your answers. I figured how it could be solved, but I was wondering why there would be different codepoints for the same glyph, and whether it is the same glyph or it is also used in different languages or situations. Some foundries, for example, add U+2219 as a supplement for the space character when 'show invisibles' is turned on in some applications. <br> <br>I cannot answer in detail right now what didn't work about 00B7, because I can't test it myself, and rely on my Catalan contact. I will check and get back.</p>
  - id: 28376
    user: 909
    date: 2004-03-24T15:51:00
    date_raw: 24 Mar 2004 — 3:51pm
    votes: null
    html: <p>There are tons of cases in Unicode where you have what could be the same glyph at different codepoints. Some of these are purely for historical encoding reasons (capital letter A with ring above versus Angstrom symbol). Some of them have linguistic differences (English, Greek and Cyrillic have different characters, but in each case one of those language-specific characters might look an awful lot like an "A"). <br> <br>Cheers, <br> <br>T</p>
  - id: 28377
    user: 1817
    date: 2004-08-17T07:12:00
    date_raw: 17 Aug 2004 — 7:12am
    votes: null
    html: <p>I just found this.. <br> <br>The referrence to the catalan in the MS document  referring to x02C9 (overdot) is saying that the catalan dot should be a punctutation character similar to the way the over dot x02C9 was designed and NOT a MATHEMATICAL operator which is what both X00B7 and x2219 are.  <br> <br>x2219 is in 'Mathematical Operators' in unicode and xB7 is part of the ASCII set that comes from earliest technical keyboards and all the character in there are Math characters not pubishing characters, ie. ASCII Tilde (used in programming), ASCII circumflex (used in Pascal for pointers), middot (used as a mathematical operator for muliplication).  <br> <br>I did a test back then and just did now and xB7 is mapped in the catalan keyboard.  <br> <br><img src="http://www.typophile.com/forums/messages/4101/43049.gif" alt="catalan shift three"> <br> <br>I believed technically x2027 'Hyphenation point' in the x2000..x206F 'General Punctuation' section of Unicode is more correct as the Catalan dot than either the historical middot or math operator periodcentered... <br> <br>But they pull x00B7.  <br> <br>Back in the Ikarus days for lazer imagesetters we use to make a Capital Catalan dot and a small Catalan dot that were on different widths and spaced differently so when they were composed with the Capital L or small l they would center correctly. The Capital L dot would need to have a negative left sidebearing for it to center between L's.  <br> <br> <br></p>
  - id: 28378
    user: 1817
    date: 2004-08-17T07:39:00
    date_raw: 17 Aug 2004 — 7:39am
    votes: null
    html: <p>I should mention I tested this on Window 2000.  <br> <br>In 1999 I talked to the person who wrote the keyboard table that maps the character codes to unicode. I found it coming out as x2219. And told her that that is a 'math operator' and in that section of unicode and is probably wrong.  <br> <br>Back then I was testing it on Windows 95 and I have it recorded in the MS document that x2219 came up in Win95 and xB7 in Win2000.  <br> <br>xB7 is more correct so I hope that is what changed.  <br> <br>I'm sure this adds to the confusion but never trust a programmer so always test it against what they do...  <br> <br></p>
