    html: <p>I have Freight Text. My personal preferance is that a font (sans or otherwise) have an obviously true italic, which Freight Sans does not. Scala does. So does Parisine Plus and TheSans. The serif and sans have to be able to WORK together, not just LOOK like they're related.</p>
