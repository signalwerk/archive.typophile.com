    html: |-
      <p>I needed a combination of sans and serif that would work well together in a single word. After trying to pair various combinations I started to look for a not too expensive family with both. I liked Freight text's italic k and r and the clean shapes of the sans. In the end it's all subjective, I just liked the font. I might not have bought all varieties had that been an option, but now I'm happy it wasn't. Still looking for an project that would give me an excuse to buy the Micro.<br>
      I didn't realise it was such a popular one when I bought it.</p>
