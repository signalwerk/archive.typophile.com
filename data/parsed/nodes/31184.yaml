  html: |-
    <p>I'm looking to purchase an entire font family soon. But as you all know, it's an investment. I'm torn between Scala Sans and Freight Sans. Basically, I'm looking for a family that has a wide range of applications (from text to signage). Also, which one of these fonts do you think has the best companion serif design? (I'll purchase this family in the near future) Which one is the best value for the money? Your suggestions will be greatly appreciated.</p>
    <p>Thanks in advance<br>
    Ivan</p>
