    html: <p>There's nothing that isn't "true" about Freight Sans Italic. The forms may not be drastically different, but they are <a href="http://www.marksimonson.com/article/128/fake-vs-true-italics" rel="nofollow">optically corrected</a> italic lettershapes not obliques and work quite well for emphasis without distracting.</p>
