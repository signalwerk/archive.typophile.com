      <p>William - I think any family with <a href="http://www.fontshop.com/virtual/newsletters/jun2006_b/" rel="nofollow">serif and sans companions</a> is appealing simply due to its versatility. As for Freight's popularity, these all factor in:</p>
      <p>- The sans hits all the right notes for contemporary typography: large x-height, open forms, wide, nothing too quirky but more humanist than geometric.<br>
      - <a href="http://www.joshuadarden.com/shop" rel="nofollow">Darden's documentation and samples</a> lend it a lot of credibility.<br>
      - The Micro weight is intriguing.</p>
      <p>And here is Freight as featured in the <a href="http://www.flickr.com/photos/stewf/sets/72157594511485997/" rel="nofollow">QBN Typecase</a> and <a href="http://www.fontshop.com/features/fontmag/004/004_contents.cfm" rel="nofollow"><em>Font 004</em></a>:</p>
