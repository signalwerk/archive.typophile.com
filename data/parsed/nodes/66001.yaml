    <p></p><div class="imageWrap"><img src="http://typophile.com/files/vorschau_sintesi_01_4736.gif"></div><p></p>
    <p><a class="freelinking external" href="http://www.sintesi.ch" rel="nofollow">Sintesi. Sans meets serif.</a></p>
    <p>You would like to express tradition by using a contemporary font? Sintesi might be exactly what you are looking for.</p>
    <p>Sintesi stands for synthesis: the unification of serif and sans-serif into a contemporary font, which surprises with different facets depending on its application.<br>
    In copy size Sintesi performs like a sans-serif. It is a compact and well readable font that fulfills all requirements of modern digital media.</p>
    <p>In larger sizes, Sintesi unfolds its traditional character. Now, its strong contrast and the perceptible feather-ductus stand out clearly, as we appreciate it in a historical old style face.</p>
    <p>Sintesi is completed by a suitable italic. Its cursive character has more to do with writing-speed than to moderate inclination. Therefore Sintesi may be well-suited for many other purposes, not only for emphasis.</p>
    <p>The whole font family consists of 20 styles and offers a wide range of Western and Eastern European special characters, typographical ligatures, uppercase, oldstyle and fraction figures.</p>
    <p>Start combining antiquity with modernity!</p>
    <p>Download a free trial version of Sintesi with a reduced character set. <a class="freelinking external" href="http://www.sintesi.ch" rel="nofollow">Check it out!</a></p>
