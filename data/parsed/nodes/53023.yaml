    html: |-
      <p><cite> &gt; Kent, can you be more specific as to which sloppy work habits you’re referring to? </cite></p>
      <p>To clarify: It's the use of the Align to Baseline Grid feature (sometimes referred to as "sticky baseline" or "snap to baseline") that I think leads to sloppy work habits -- an inattentive designer can end up with several elements all specified with a mish-mash of leadings, paying no attention to relationships, and then all of them will magically snap to a grid: the results may look clean, but the work habits are sloppy.</p>
      <p>(Believe me, I've had to come in and revise documents done this way -- you can't trust the readout of leading values, because the program isn't using them if it's snapping to a grid; the stylesheets are usually a mess, because there's little consequence to overriding everything, or no motivation to update and clean them up, etc.)</p>
      <p>As you say, working with a baseline grid (but not necessarily "snapping" everything to it automatically) can encourage more attentive design, by highlighting alignments and relationships. To be clear: it's the "snapping" feature that I find problematic.</p>
      <p>With regard to my "lazy design thinking" comment, this goes along with what Charles was getting at. Over-reliance on a baseline grid (especially "snap to") promotes a cookie-cutter approach. </p>
      <p>Sometimes, you have to turn the grid off and use your eyes. Just because it's on the grid, doesn't make it right.</p>
      <p>As Charles so eloquently put it, "pleasing spatial arrangements are more complex." I like that.</p>
      <p>-- K.</p>
      <p>(Long enough for you ;-)</p>
