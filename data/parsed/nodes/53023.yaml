    html: |-
      <p>The truth of the matter lies somewhere between never snapping to the grid and using this feature without any thought. Like Kent, I never use it. However, I have received files from designers who do use the feature. But as I have worked with these files, I have seen the designers have also used what pica pusher has called "*good* design habits like carefully considering space between paragraphs and heads, or paying attention to horizontal alignments between columns."</p>
      <p>If one does pay this close attention to detail, there should be no need to use the snap to grid. Perhaps the designers used the snap as insurance.</p>
      <p>RE Charles' comment about the Blumenthal book: I'm the guy who did the page composition on that book. I know that if one examined Blumenthal's book as well as the books discussed therein, one would find plenty of divergence from the book's supposed grid. I had to do that to get things to fit and to look good. I did try to start all the shoulder heads on the baseline of the adjacent text. One of the most valuable tricks I learned as an apprentice comp was how and when to "cheat" certain spacings in order to achieve other pleasing spatial arrangements. This lesson came not from a design classroom nor from a textbook, but from a skilled journeyman.</p>
      <p>powers</p>
