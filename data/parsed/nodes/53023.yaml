    html: |-
      <p>You want an even longer answer from Kent? Perhaps he wishes he never started . . .</p>
      <p>Here is an experiment. Get a copy of <cite>Art of the Printed Book, 1455-1955</cite>, by Joseph Blumenthal (printed by Godine). Take whatever design manual you favor as having the best "design rules," and go through the books Blumanthal has selected. Likely, according to the set of design rules you followed, most of the books are poorly designed and set. Yet most <cite>are</cite> works of art, and belong. In fact, they are still fairly easy for a modern audience to read, assuming you know the language. Why is that?</p>
      <p>Long texts are to be read. That is the designer/compositor's primary job, facilitating reading. Snapping copy to a baseline grid doesn't much facilitate this, in spite of what some might tell you. Pleasing spatial arrangements are more complex.</p>
