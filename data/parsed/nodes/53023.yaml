      <p>Kent, can you be more specific as to which sloppy work habits you're referring to? I find that a baseline grid forces designers into *good* design habits like carefully considering space between paragraphs and heads, or paying attention to horizontal alignments between columns.</p>
      <p>In many-paged documents, if I can, I like to use a baseline grid that is 1/2 or even 1/3 of my body leading. I try not to baseline-shift except for special cases like heads. Then I make sure to set leading, space-before, space-after, etc. to multiples of the grid increment.</p>
