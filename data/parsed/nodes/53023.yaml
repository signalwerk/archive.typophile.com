    html: |-
      <p>I generally rely on a baseline grid that is equal to the basal text leading (or sometimes one-half) and feel that this is usually a very useful reference to aid the underlying harmony in a complex design. </p>
      <p>However, I *never* use the Align to Baseline feature. I feel this is far too Procrustean and makes it inconvenient to work with syncopated rhythms. When I'm designing a book with many elements and many levels of text, simple ratios like 1:2 are not always enough. </p>
      <p>I have other techniques that I've developed for maintaining absolute precision with a baseline grid, while still offering plenty of flexibility.</p>
      <p>I happen to think the Align to Baseline feature is superfluous, and in some cases enables sloppy work habits and lazy design thinking (not a personal criticism of anybody in particular, just my general opinion about the feature).</p>
      <p>-- Kent.</p>
