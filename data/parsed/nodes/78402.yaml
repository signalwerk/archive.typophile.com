      <p>I might be way off, but if I were to reproduce the Sportage logo from scratch, I would probably go with Bank Gothic as my source.</p>
      <p>When comes to logo itself (not font), you can find the very same logo in vector format and with minor modifications achieve the exact result, on brandsoftheworld.com/logo/sportage<br>
      and brandsoftheworld.com/search/logo/Cerato </p>
      <p>Perhaps someone else will be of more help.</p>
