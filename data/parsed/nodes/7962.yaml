    html: '<p>Cool! <br>I recently perused their book (thanks to Jim Rimmer) and it seems like a great place to be. <br> <br>Questions? I guess I have one - pretty specific too: <br>If I want to do what Koch did in metal with Neuland (ignoring for the sake of argument the vast difference in actual talent) but in wood (basically cutting forms "blindly", without any drawing) what do I need to know? What kind of wood should I use? I have some basswood in the garage. What about tools? And how smooth/clean does the surface have to be, like does it need to be treated in any way? Etc. <br> <br>BTW, that shower is too good. <br> <br>hhp</p>'
