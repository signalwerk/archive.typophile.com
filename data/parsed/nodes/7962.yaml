    <p>I'm working for a couple weeks at <a href="https://web.archive.org/web/20081011055417/http://hatchshowprint.com/"> Hatch Show Print</a> and will put together a little online documentary about the shop and my time spent working. <br> <br>Does anybody have any questions they'd like answered? Any ideas for me to try while I'm here? <br> <br>I'll have the documentary completed some time after the new year, and I might be talking *months*... <br> <br>It will be a bit more involved than my previous documentary endeavor, <a href="https://web.archive.org/web/20081011055417/http://whoisdan.com/halloween/"> My Karate Kid Shower</a>... <br> <br>Dan</p>
