      <p>Hrant <br> <br>As I mentioned, I have been toying with the idea of cutting some woodtype over the last year. Reading the Hatch Show Print book clinshed the decision for me. <br> <br>I am going to get a sample piece of 1/4" birch and/or poplar plywood and try it on that. <br> <br>I have had some correspondence over the last ten years sor so with Christopher Manson of Rockville Maryland (sold him some type for his bookwork). <br>  <br>He is in opinion, the premier woodcut (not wood engraving) artist today. His favorite subject is mediaevalsim, and he has done a great many wonderful, gutsy illustrations in that vein. <br> <br>He once mentioned to me that he uses the above mentioned types of wood, but I don't know if they are a special selection or straight from the lumber store. <br> <br>I am certain the wood needs very little if any preparation. Birch ply is a nice tight grain and very smooth. tiy should be able to print it without picking up any eyes from the grain. <br> <br>I am going to email you his phone number offline, becuase <br>I couldn't find an email address for him in the many mentions of his work on the web. <br> <br>As far as tools, Chris could tell you what he uses. I have a large selection of wood chisels from which to draw, but I have picked them up randomly over the past forty years; some of them I have made. A fair set of tools can be bought from any Lee Valley store across Canada. Look for Woodcut knives in their catalog. <br> <br>My paln is to pantograph the letters straight up to the finished line, and then go in and hand cut the tight pinches etc. This is the way the Hamilton Wood Type folks did and still do it. <br> <br>If starting out without any kind of pantograph, I would recommend using a router, and staying about a 1/16" away from the finished line. The rest you could finish with knives. I think you would find this a breeze. Just do some practice pieces sbefore gettiing serious.  <br> <br>Neuland is a great subject. In fact, Hamilton used to off<!--
