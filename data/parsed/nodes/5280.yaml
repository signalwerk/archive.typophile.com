    html: <p>I dont think the type community is elitist, anymore than I think the bongocero community is, its just not well understood or known about.  <br> <br>Spending your life explaining to people that yes, new typefaces do sometimes need to be created, or that no, I can't "just" send the font files for that job to you, or that there is a good reason why you chose Verdana over Helvetica for that website is often lonely and frustrating. <br> <br>Typophile reminds us that there are other like-minded nerds out there too. And thats cool.</p>
