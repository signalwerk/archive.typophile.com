    votes: null
    html: '<p>A while back, about a year ago I think, some Typophile members were complaining about how the Typophile forums looked in their browser of choice on their platform of choice. This lead to some attempts by Joe and Jared to control the code produced by  the engine which runs this discussion group. They were only partially successful (as I recall) and, apparently out of frustration over the difficulty of doing this, named one of the styles they created "dontLookLikeCrap". Unfortunately, the way they did it must have been something of a hack, since the style declaration shows up when you try to edit your post and then becomes part of the post when you save it (unless you know to remove it). It adds it in every time you edit a post, so you might end up with several littering the beginning of your message. <br> <br>Until Joe and Jared find a better solution, the only thing you can do is try to remember to remove the offending tags when and if you change your mind about something you post. <br> <br>In the mean time, I have a suggestion to Joe and Jared: Maybe you could rename the style "RemoveThisFontTagMarkUpIfYouEditYourPost" or something similar.</p>'
    html_clean: '<p>A while back, about a year ago I think, some Typophile members were complaining about how the Typophile forums looked in their browser of choice on their platform of choice. This lead to some attempts by Joe and Jared to control the code produced by  the engine which runs this discussion group. They were only partially successful (as I recall) and, apparently out of frustration over the difficulty of doing this, named one of the styles they created "dontLookLikeCrap". Unfortunately, the way they did it must have been something of a hack, since the style declaration shows up when you try to edit your post and then becomes part of the post when you save it (unless you know to remove it). It adds it in every time you edit a post, so you might end up with several littering the beginning of your message. <br> <br>Until Joe and Jared find a better solution, the only thing you can do is try to remember to remove the offending tags when and if you change your mind about something you post. <br> <br>In the mean time, I have a suggestion to Joe and Jared: Maybe you could rename the style "RemoveThisFontTagMarkUpIfYouEditYourPost" or something similar.</p>'
