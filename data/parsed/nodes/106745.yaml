    html: |-
      <p>Hi Damian,<br>
      Webfonts served by Google Fonts and most other webfonts services are usually sub-setted (that means its optimized, and some glyphs are removed to make the file smaller so it loads faster).</p>
      <p>To force Google to send you the entire full file (no subsetting) you have to specify "subsetting=all".<br>
      Here is an example on how to do that for the lobster font: <a href="http://www.impallari.com/lobster#subsetting">http://www.impallari.com/lobster#subsetting</a><br>
      You can do the same for Raleway or any other font.</p>
      <p>Once you are getting the full font, in your CSS you need to add this code to activate the lnum feature in all browsers:<br>
      font-feature-settings: "lnum"<br>
      -moz-font-feature-settings: "lnum"<br>
      -webkit-font-feature-settings: "lnum"<br>
      -ms-font-feature-settings: "lnum"<br>
      -o-font-feature-settings: "lnum"</p>
      <p>By the way, the latest Raleway release (v3) a few days ago, also include Italics and Cyrillics. Is available here: <a href="http://www.impallari.com/projects/update/100">http://www.impallari.com/projects/update/100</a> and will also be available in Google Fonts pretty soon.</p>
