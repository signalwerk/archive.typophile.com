    html: <p>Raleway has a full set of lining numbers (that is, numbers that line up) as well as the ranging numbers (that is, numbers that are designed to fit with running text and thus "bounce up and down", also known as oldstyle numerals). If you're mainly using it on the web, you should be able to specify that you want lining figures using the font-feature-settings attribute in your CSS, specifying that you want "lnum" as one of them.</p>
