    html: |-
      <p>Yep, is strange. But web-developers are very strict about optimization. They optimize everything: css, javascript, etc... even small 1kb gifs icons making sprites files to save http requests. They want the fonts to be compressed in the same way, even if that means removing some glyphs and OT features.</p>
      <p>Currently in Google Fonts there are more subsetting options:<br>
      - Latin,<br>
      - Latin Extended,<br>
      - Cyrillic,<br>
      - Cyrillic Extended,<br>
      - Greek,<br>
      - Greek Extended,<br>
      - Khmer,<br>
      - Vietnamese,<br>
      - All (disable subsetting and get the full font).<br>
      - Your can also roll your own custom subsets, using the "text=xxxx" parameter.</p>
      <p>But they are mostly intended for language support, and not yet for OT features.<br>
      As you might know, not all OT features are currently supported by all browsers, but hopefully in the near future they will, and I also hope for the subsetting options to improve in all the webfonts services.</p>
      <p>TypeKit only offers 2 options:<br>
      - Default (Latin)<br>
      - All Characters (subsetting off)</p>
      <p>H&amp;JF has done a great job in their service, in particular about the subsetting options. They have an "easy to use" and "easy to understand" interface for selecting which glyphs gets included and which ones gets removed, allowing the user to fine-tune the subsetting optimizations.<br><a href="http://www.typography.com/cloud/feature-tour/images/ft_characters_1x.png">http://www.typography.com/cloud/feature-tour/images/ft_characters_1x.png</a></p>
      <p>I don't know what are the subsetting options that the other services offer to their users. But still, all this webfonts thing is still in an early phase, and there is much to improve when looking at the future.</p>
