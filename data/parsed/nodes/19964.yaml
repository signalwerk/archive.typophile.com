      <p>at Track &amp; Kern: The thread-titles here are altered by the “cleaning staff” aka Moderators. First because “What font is this?” is no appropriate title for the archives. So the title is changed to something useful like “J-Crew headline”*. And then, when some member ID’d the requested font he gets the credits like “Joanna {Yves}” (Joanna is the fontname, Yves the IDer). So when the case is closed it gets an (x) at the beginning. </p>
      <p>Thank you dear cleaning staff, makes it so much easier here. </p>
      <p>EDIT: Sorry SuperUltraFabulous, wasn’t meant to insult, it was just meant as an example. Just to clear some things for Track &amp; Kern</p>
