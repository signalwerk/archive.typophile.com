  html: |-
    <p>I started this font a long time ago with some inspiration from the idea of the OCR fonts being able to be read by machines as well as humans. This idea placed several constraints on the design, such as being monospaced, and very simple. <br> <br>With time, I realized it was too constraining and that the font wanted to go somewhere else, so it was abandoned like so many other projects. Then, at the very beginning of this year I stumbled upon the Typophile forum, and became interested in finishing the font. <br> <br>This is what I have so far. It's changed from the original in having a larger x-height, but the imposition still remains that there be no curved lines and that the characters be as different from each other as possible. I'm having trouble deciding the shape of some characters, such as the uppercase Q. Start the critique!</p>
