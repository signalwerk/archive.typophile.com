    html: <p>You're right about them being kind of similar. But even though the OCR fonts were in a way the inital inspiration, Bucky is not intended to be like that, I basically just took the idea of imposing some limits on the way things could be, so as to achieve a certain unity. <br> <br>How do you think they could be made less similar without breaking their identity? <br> <br>In regard to the different versions, well they're alternatives between which I can't seem to decide what's best. You can see all the alternatives in the PDF above.</p>
