    html: "<p>I think your <b>e</b> and <b>z</b> - and one of your <b>a</b>'s too, now that I look closer - are a bit close for the  <br>as-different-as-possible constraint. I think one of the original goals of the OCR-A and OCR-B fonts  <br>(as well as a few others, such as most license plates) is that you can't subtract small parts from one  <br>character to get another, since scratched up, or badly photocopied, text may confuse the computer. I think that should be part of this design. <br> <br>For that matter, I notice that you have mulitple versions of some of the lower case letters: <b>a</b>, <b>o</b>, <b>g</b>,...  <br>probably more if I went over it very carefully. Why the duplication? (Not a critique, that. Just curious.)</p>"
    html_clean: "<p>I think your <b>e</b> and <b>z</b> - and one of your <b>a</b>'s too, now that I look closer - are a bit close for the  <br>as-different-as-possible constraint. I think one of the original goals of the OCR-A and OCR-B fonts  <br>(as well as a few others, such as most license plates) is that you can't subtract small parts from one  <br>character to get another, since scratched up, or badly photocopied, text may confuse the computer. I think that should be part of this design. <br> <br>For that matter, I notice that you have mulitple versions of some of the lower case letters: <b>a</b>, <b>o</b>, <b>g</b>,...  <br>probably more if I went over it very carefully. Why the duplication? (Not a critique, that. Just curious.)</p>"
