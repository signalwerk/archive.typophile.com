    html: |-
      <p>I wondered about the first one when I saw the movie. I don't think I've ever seen it before. It's not very well done. It might be a free font made by an amateur. I wouldn't be surprised if it was designed by Tarantino himself, or maybe at his direction...</p>
      <p>Tarantino, standing behind a guy with a font open in Fontographer: "The A isn't doing it for me. It looks good. I'm not saying it doesn't look good. It's just not doing it for me. Can you do something at the top here? I've seen fonts where they have this extra thing at the top of the A. What do you call it... Like a serif, but not a serif... Yeah! I see what you're doing. It's like the thick part keeps on going, right past the top. Don't stop there. Keep going. Ohmygod!--it looks like a f*ckin' katana! This is great! This is perfect! Okay. I was thinking about the N..."</p>
