    <p>Hi everyone,</p>
    <p>this has been discussed before (<a href="http://typophile.com/node/3342">http://typophile.com/node/3342</a> and <a href="http://typophile.com/node/4493">http://typophile.com/node/4493</a>), but it seems like the answer i'm looking for is hidden in attachments and links that i'm not able to access.</p>
    <p>I'm looking for 3 fonts used in the end credits of Kill Bill volume 2.</p>
    <p>My top priority is the one used at the very end for cast and crew credits.<br><a href="http://s212.photobucket.com/albums/cc269/dionisiadionisia/?action=view&amp;current=credits1.jpg" target="_blank"></a><br><a href="http://s212.photobucket.com/albums/cc269/dionisiadionisia/?action=view&amp;current=credits2.jpg" target="_blank"></a></p>
    <p>The second would be the one used for main characters credits.<br><a href="http://s212.photobucket.com/albums/cc269/dionisiadionisia/?action=view&amp;current=credits3.jpg" target="_blank"></a><br><a href="http://s212.photobucket.com/albums/cc269/dionisiadionisia/?action=view&amp;current=credits4.jpg" target="_blank"></a></p>
    <p>Then the Kill Bill logo as it appears here.<br><a href="http://s212.photobucket.com/albums/cc269/dionisiadionisia/?action=view&amp;current=credits5.jpg" target="_blank"></a></p>
    <p>All the fonts can be seen "in action" here:<br><a href="http://www.youtube.com/watch?v=teJwLb1Bh4k">http://www.youtube.com/watch?v=teJwLb1Bh4k</a><br>
    and<br><a href="http://www.youtube.com/watch?v=PhTAe-BjuXA">http://www.youtube.com/watch?v=PhTAe-BjuXA</a></p>
    <p>Thanks everyone in advance for your help!<br>
    Marco</p>
