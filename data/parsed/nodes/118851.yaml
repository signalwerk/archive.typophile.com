    html: |-
      <div class="comment-spam-body"><p>"Do you have a HD scan of this specimen?"<br>
      For this you would need to access a printed copy of the ATF 1923 book or order photocopies from a library that has it and is willing to do photocopies. You have the page numbers.<br>
      Please note that the old specimen books did not usually include a large scale character set. Rather they offered a presentation of phrases in various sizes.<br>
      The 1923 ATF book was one of the earliest to offer a character set, but only at a smaller scale. This is what is shown in the book:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/MottoSMorrisFullerBenton1915_6357.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/MottoSMorrisFullerBenton1915B_3556.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/MottoSMorrisFullerBenton1915C_5235.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/MottoSMorrisFullerBenton1915D_5458.jpg"></div><br>
      Don<p></p>
      </div>
