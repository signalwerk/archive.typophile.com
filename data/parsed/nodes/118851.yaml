      <p>Should be <strong>Motto</strong> by Morris Fuller Benton, 1915<br>
      Courtesy Mike F: <a href="http://typophile.com/node/31835#comment-188167" title="http://typophile.com/node/31835#comment-188167">http://typophile.com/node/31835#comment-188167</a></p>
      <blockquote><p>There are two versions of Motto that I'm aware of. One is Paul Lloyd's <a class="freelinking external" href="http://moorstation.org/typoasis/designers/lloyd/queen.htm" rel="nofollow">Queen Empress</a>. The other was digitized by Dan Solo and is available as Motto on the <a class="freelinking external" href="http://store.doverpublications.com/048699502x.html" rel="nofollow">Dover 24 Calligraphic Display</a> Fonts CD.</p></blockquote>
