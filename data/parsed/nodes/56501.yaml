    date_raw: 1 Apr 2009 — 2:42pm
    votes: null
    html: "<p>Sii: I do indeed care what happens to the collection after its sold. I'm going to try to avoid Ebay at all costs. I have a long email list of printers and collectors interested in individual fonts or small groups, and I will sell to them first. But if at all possible, I'd love to place it as a whole with a collector or museum that would really care for it, and keep it growing. It's unfortunate the entire global financial system is in meltdown at the moment. It makes it much more difficult. It may just not be in the cards, and I know that. If you have any interest at all, even in the individual fonts, send me an email and I'll send you the PDF of the inventory and prospectus, and put you on my email list in case I am forced to break it up. The prospectus is kind of interesting just on its own.</p>"
