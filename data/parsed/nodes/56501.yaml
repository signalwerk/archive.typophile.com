    html: <p>This looks like a stellar collection just from the few pictures posted above. It really needs to be with a collector or museum. I doubt these days most museums have the money to acquire a collection like this, though. I would also hate to see it go on ebay. You'd make a mint – probably $300-400/drawer at least, but it might take you a year to do it!  Any thoughts of donating it somewhere like the Hamilton Wood Type Museum? There are others probably as well that I'm not familiar with.</p>
