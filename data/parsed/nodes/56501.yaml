    <p>My large personal collection of classic and rare wood type fonts is now for sale: 373 fonts in eleven type cabinets, plus 129 related items. </p>
    <p>The collection is about one-third historic and fancy fonts, one-third modern 20th century fonts, and one-third gothics. Also included are two smaller collections, one of borders, catchwords &amp; ornaments and one of sorts, as well as several wood type catalogs and books and a 36-inch wood type composing stick from the old print shop at St. Meinrad's Abbey Press. </p>
    <p>For an inventory and prospectus with additional photos, please email me at <strong>   <a href="mailto:malcolmdean@mac.com">malcolmdean@mac.com</a> </strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ClarendonXXXCc_4307.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TuscanExtended72_6096.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/PaintersRoman72_6469.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ArcadianNo172_5521.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TuscanCd72_6059.jpg"></div><p></p>
    <p>"In closing, I'd like to recount an interesting incident which adds another dimension to the allure of wood type… a mother and child incident [at an antiques mall not long ago]. The boy, about 11 years old, was unhappy with the mall experience; but his eyes lit up on spotting [our] array of type cases holding type, cuts and other seductive what nots. After inspecting things for a while, he started on a second tour despite his mother's tuggings. The mother persisted, the boy resisted. My wife, who had been observing this with quiet amusement (having raised three sons) asked him why he found the type of such interest. He caressed the piece he had in hand - thought a bit and said, "It's real."</p>
    <p>- Stan Harris, writing in Greg Ruffa's <strong><a class="freelinking external" href="http://www.theartofwoodtype.com " rel="nofollow"> The Art of Wood Type</a></strong></p>
