      <p>This is a magnificent collection of wood type with a long list of high end type styles.<br>
      All the fonts are complete and in excellent condition. I have knowledge of them,<br>
      I can only report that they are breath taking. The collection is a once in a lifetime opportunity. This is not for the casual ebay collector. To sell this collection one at a  time will separate the font groups that required years to assemble and catalog, verifying the historical foundry, the type style's catalog name and date. A wood type collector's dream. Inquire about the sale, be ready to be amazed.</p>
