  html: |-
    <p>FF Quadraat is an original typeface by Dutch designer Fred Smeijers, published as part of FSI's FontFont type library. The typeface was named after the Quadraat design studio in Arnhem, the Netherlands, which Smeijers was part of  at  the time of its release.<br>
    Since its original release  in 1992 as a small family of serifed text typefaces, FF Quadraat has been expanded into a large family consisting of compatible sans and serif subfamilies, with Headline and Display versions, Condensed and Monospaced varieties.</p>
    <p><strong>Foundry:</strong><br>
    <a href="http://www.fontfont.com/find#family_dynasty=dynasty_46" rel="nofollow">FF Quadraat fonts at FontFont.com</a></p>
