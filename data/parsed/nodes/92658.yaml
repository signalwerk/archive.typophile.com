      <div class="comment-spam-body"><blockquote><p>Barring those things, as a rule it's possible to translate any "feeling" since humans anywhere all feel similar things.</p></blockquote>
      <p>Similar, but not the same. I find it hard to imagine that an Arabic script Gill Sans brings up the same feelings and associations as the Latin Gill Sans does. The scripts inherently bring up different feelings. You might as well say sans and serif bring up the same feelings because they both have stems. Even Latin will bring up different feelings depending on which language you use. I honestly think it's impossible to perfectly translate the feeling of a Latin script to an Arabic script or vice versa.</p>
      <p>But this is interesting though, because although the same feelings just don't translate, it does have to conjure up part of those feelings. Possibly we can't even speak of feelings here. Is it a more rational approach perhaps to bring the two in correlation with each other? I suppose it needs just a few key elements which help you connect the two scripts, rather than wanting to have them speak to you in the same way on an individual basis.</p>
      <blockquote><p>so for example its "A" should not be identical between those scripts.</p></blockquote>
      <p>And yet it is. What should be different?</p>
      </div>
