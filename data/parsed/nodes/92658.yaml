      <p>Deadlines and confused clients can certainly cause one to design something not to be proud of... Barring those things, as a rule it's possible to translate any "feeling" since humans anywhere all feel similar things.</p>
      <p>BTW there's actually a hidden risk when designing something close to Latin, like Cyrillic or Greek: you feel more justified doing a straight formal migration. But something like Trajan does not evoke in its forms the same things to a Russian or a Greek; so for example its "A" should not be identical between those scripts. The idea of "cognate shapes" (as put forth by John Hudson for examples) is a red herring. In contrast when you're doing a totally different script (like Arabic) the disjoin is so obvious that it forces you to think more deeply.</p>
      <p>hhp</p>
