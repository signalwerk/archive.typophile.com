      <p>Since Times Roman came in special versions for German and French, that capital "A" maybe should look different in Russian or Greek should not be too hard to accept.</p>
      <p>While only native readers of those languages could really decide what is appropriate, a guess, a glimmering, might be possible from looking at what is popular in those languages. In the case of Russian, it seems that typefaces in the Modern classification (akin to Bodoni and Scotch Roman) were popular to nearly the exclusion of Transitional or Oldstyle faces, whereas in the Latin alphabet world, Transitional (like Baskerville or Times Roman) and Oldstyle (Garamond, Bembo, Caslon) were much more popular.</p>
      <p>In the case of Hebrew, I've heard that the Frank - Ruhl face was so popular as to be Israel's equivalent to Times Roman - to me, that face looks, visually, like a Scotch Roman, while the "Siddur" type of face is more like Times Roman or some other comfortable Transitional or Oldstyle.</p>
      <p>For Greek, sans-serif faces seem to have a greater level of popularity for text use; this is not surprising to me, since it seems to me that they better avoid the tension between capitals that are like Roman capitals and lower-case that is like script or italics (even if it isn't sloped Porson-style).</p>
