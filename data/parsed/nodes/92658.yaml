    html: <p>I don't think that native users of a script can do no wrong. But if someone who was not a native user did something like that, without even a precedent to go by, for a script as different from Latin as the Arabic script is, that would be absolutely idiotic - thus, "the perfect example of what not to do". Done by a native script user, it is <em>merely</em> highly questionable.</p>
