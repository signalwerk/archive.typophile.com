      <p>It almost sounds easy. I suppose one would have to exaggerate certain strokes, but then I would worry it would change the meaning of the script or just look bad. Even when done by a native speaker, I imagine there would be severe limitations. But then this is largely speculation from my part. I'm curious how restricted we are, and if it could lead to innovation if we were to go beyond those restrictions. For example, the Arabic script is so alien to me that if I were to design a typeface for it, it would probably feature strange deviations one might argue make the typeface terrible, while others might say I've done something refreshing they haven't thought of yet. I would be curious about these kind of loose interpretations. It requires a lot of insight to get a script right, but that very insight is also what restricts you. Anyway, this is a bit of a different matter.</p>
