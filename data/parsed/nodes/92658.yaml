      <p>I remember that Eric Gill made a rather freaky Hebrew that was published... but this post reminded me of a Peanuts cartoon with the punchline "How can a hula hoop be hi-fi?" - in this case, the question is, how can an Arabic be Gill Sans?</p>
      <p>Of course, for most practical purposes, putting in a generic Arabic typeface as part of a Times Roman or Arial typeface works to allow the characters to be displayed - and, thus, there is no real need to truly capture the spirit of Gill Sans in the Arabic portion of the font. Although that might still be a thing for a type designer to attempt - but such a typeface would presumably be sold separately and cost extra, as it probably should.</p>
