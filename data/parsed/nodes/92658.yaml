      <p>To me the "secret" of translating a typeface's idiosyncrasies (better: characteristics) across scripts is to avoid the facile migration of formal shapes (which very rarely works, and often results in cultural damage) and focus instead on figuring out what those shapes evoke in the source culture and migrate those to shapes that evoke similar things in the target culture.</p>
      <p>hhp</p>
