      <p>Well, one can say that Arabic has 28 letters, just as one can say that Hebrew has 22 letters. Yes, they're all consonants. But the writing system isn't a full-fledged abugida, like Indic scripts or Ethiopic, since vowels are only an optional annotation.</p>
      <p><cite>Too often non-natives don't accept their limitations, sometimes resulting in actual cultural damage to vulnerable writing systems.</cite></p>
      <p>Indeed, that has happened. But not all non-Western writing systems qualify as vulnerable. Occupying powers, and missionaries giving people their first writing system have the power to cause trouble.</p>
      <p>And the appeal of the Western/U.S. media can lead to people doing it to themselves. But we also shouldn't underestimate the resilience of traditions.</p>
      <p>Thus, if Koreans want to do a Fraktur-ish version of their script for a heavy metal record jacket, it's not likely to stunt the growth of their writing system. They can be allowed to have fun.</p>
