      <div class="comment-spam-body"><blockquote><p>Too often non-natives don't accept their limitations, sometimes resulting in actual cultural damage to vulnerable writing systems.</p></blockquote>
      <p>I feel there's an even bigger sentiment at play, where one is skeptical and dismissive of figures of authority on a certain subject. I would always emphasize the importance of skepticism, but it's frustrating when you've done years of research on a subject and you get quickly dismissed just because the other person doesn't have a similar insight to verify the truth of what you say.</p>
      <p>For example, yesterday I was having dinner at my dad's place and there was a printed manual from some digital switch for my dad's model train tracks by digirail. I noticed that the digirail logo uses Helvetica, the copyright notice on the left of it is set in Univers and they're using Arial for titles and such. I turned over the page and they're using Calibri on the inside. How can you make sense of this at all? I shared my frustrations and my dad was the only one who engaged with my story at all, but he was very dismissive of its importance. "Who would even see that?" I don't think that's even the point, is it? There is just no rationale behind it at all. That's my main objection. I had to tell him how they would have to pay for several licenses to make use of all these fonts—which as he said, no one else would see—before he understood the importance at all. He often dismisses my knowledge as being important and ascribes it to my autistic obsessions. That might very well be, but that doesn't take away the fact that some people are doing crazy things without any rationale behind it. That's absolutely my biggest frustration in life; the lack of logic behind so many things in my direct environment.</p>
      </div>
