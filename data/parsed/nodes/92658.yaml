      <p>It <em>may</em> make it less excusable, assuming there is something to be excused.</p>
      <p>Certainly the most startling letter in it was the waaw, as it looks 'way too much like a (single-story) lower case "g" - but then, if one was not familiar with the Latin script, that wouldn't be obtrusive for <em>that</em> reason.</p>
      <p>In the case of stuff like heavy metal Korean, what's happening is that users of a non-Western script wish to quickly appropriate the wealth of display typeface options that the Latin alphabet has built up over years. Advertisers with products to introduce and ad campaigns to begin... can't wait for the natural and organic evolution of a script.</p>
      <p>The glitz and glamor of our wealthy Western lifestyles has beguiled the rest of the world in many respects, and to expect the rest of the world to live simple lives in poverty so they can remain quaint and picturesque for our sake is unreasonable. People want to survive, to thrive, to have fun. So they jump at things that advance their personal interests, with little thought of the long-term impact on values like cultural survival.</p>
