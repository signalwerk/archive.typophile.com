      <p>Sadly, and as John Hudson once made me come to terms with, more often than not Latinization is carried out by natives!* This is because many non-Westerners have an over-riding desire to become more Western, and they're too cavalier with their culture. Couple that to a shallow understanding of how visible language really works, and you get Frankerstein fonts like this one.</p>
      <p>* Especially those who have spent some time in the West, and have developed an emotional attachment. Note that Alkhawaja studied at Savannah Collage of Art and Design, and claims to be part of US culture as well as that of his native Jordan.</p>
      <p>I have nativity in Arabic myself, and harbor some healthy mistrust of Western influence on other cultures. In addition for many years now I've been looking deeply at formal relationships of writing systems. To me this is a clear case of inviting cultural colonialism.</p>
      <p>The best letter to look at there is the و (waaw) which has a spur at its top for absolutely no reason other than to look more Western at all costs.</p>
      <p>hhp</p>
