      <p>Maxim: that was pretty fast.  :-)<br>
      To me, since Latin users and Cyrillic users are necessarily different in terms of their "visual language background", any formal identicalness is a lost design opportunity.</p>
      <blockquote><p>I find it hard to imagine that an Arabic script Gill Sans brings up the same feelings and associations as the Latin Gill Sans does.</p></blockquote>
      <p>Well, if you do apply formal congruence between the two scripts, I certainly agree they bring up different feelings – and that's actually my point. What I'm advocating is making new shapes in the Arabic that evoke to Arabic readers what Gill Sans tends to evoke to Latin readers.</p>
      <blockquote><p>And yet it is.</p></blockquote>
      <p>Almost always, yes. But it doesn't have to be: look at the "Y" shapes in Adobe's Sava.</p>
      <blockquote><p>What should be different?</p></blockquote>
      <p>I don't have nativity in Cyrillic so it's hard for me to know offhand, but in the case of the "A" for example I would say the two main factors are width, and height of the bar. In the latter especially it should be possible to establish whether a higher bar or a lower bar evokes to Cyrillic users what Trajan evokes to Latin users.</p>
      <p>hhp</p>
