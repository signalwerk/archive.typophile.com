      <p>Arabic has 28 letters (not counting extended letters use by other languages, such as Farsi) most of which have four forms (some only two) depending on the position in the word. Some people think that Arabic is in fact even more complex than that – that it relies on complex ligation to be authentic.</p>
      <blockquote><p>if I were to design a typeface for it, it would probably feature strange deviations one might argue make the typeface terrible, while others might say I've done something refreshing they haven't thought of yet.</p></blockquote>
      <p>Indeed the non-native has an interesting and useful role to play: naïve invention. Like how vernacular lettering can end up informing formal typography. That's why when I'm hired as a consultant for Armenian type design by non-natives I prefer to let them first experiment, based on their instincts. Interesting things come out! On the other hand, when it comes time for me to apply my native expertise they have to be open to my confirmation or rejection of certain innovative features. Too often non-natives don't accept their limitations, sometimes resulting in actual cultural damage to vulnerable writing systems.</p>
      <p>hhp</p>
