    votes: null
    html: |-
      <p>It's starting to look pretty good! I like the curved spurs; you certainly don\t see that often in geometric typefaces like these.</p>
      <p>k - I would make the arm a bit longer. You can do this by either bringing the arm and leg down a bit or make the arm slightly more horizontal.<br>
      s - Quite small. I would make it a bit more wider.<br>
      i/l/t - I would bring the curve down a bit to the baseline. Right now these letters seem to be floating a bit.<br>
      h/n - These characters are a bit too condensed. I would make them a bit wider and leave /m/ the same width.<br>
      w - Should be more condensed<br>
      W - I quite like the design but I think it looks rather old-fashioned for a geometric typeface like this. Why don't you try a design more like the lowercase /w/?<br>
      M - Too wide<br>
      P - You could make the bowl a little higher to use more of the white space underneath.<br>
      g - The slight curve isn't working for me. It looks too much like a /q/ to me with that curve. I would give the /g/ a proper tail.</p>
      <p>I'm also not a fan of the long descenders. I would shorten them a little. The descender of /f/ actually seems to be at the right depth.</p>
      <p>Also, for a typeface like this it's common and in a sense certainly logical to design a one-story /a/ and /g/, but perhaps it's a nice idea to add the two-story /a/ and /g/ as alternates.</p>
