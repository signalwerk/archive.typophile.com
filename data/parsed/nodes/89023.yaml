    <p>Hi everyone, apologise for yet another first post/first typeface thread. </p>
    <p>I've been a long time lurker, and have enjoyed reading through the forums. I've been working on a couple of typefaces recently - drawing the characters in illustrator - and thought it was probably time to get some more experiences people to have a look, and hopefully get some honest feedback. </p>
    <p>Phylum is a mono-line geometric sans serif, and I'm trying to create something simple &amp; no-fuss that still has a bit of character.</p>
    <p>Anyway, any feedback that anyone can give would be great!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dalelacy_typeface01_6543.jpg"></div><p></p>
