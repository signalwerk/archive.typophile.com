  html: '<p>Thanks to everyone who gave such great suggestions in my "Looking for a Renaissance Font" thread earlier this year: <br><a href="http://www.typophile.com/forums/messages/30/12395.html" target="_blank">http://www.typophile.com/forums/messages/30/12395.html</a> <br>I was looking for a good, historical font to use in my <i>Machiavelli</i> graphic novel. I chose Adobe Jenson Pro, as you can see from the image below (page six of the prologue) <br><a href="http://www.donmacdonald.com/Machiavelli/mach_jenson.html" target="_blank">http://www.donmacdonald.com/Machiavelli/mach_jenson.html</a> <br>I just wanted to thank everyone for the help and ask if there are any glaring type-related issues that I missed. Thanks!</p>'
  html_clean: '<p>Thanks to everyone who gave such great suggestions in my "Looking for a Renaissance Font" thread earlier this year: <br><a href="http://www.typophile.com/forums/messages/30/12395.html" target="_blank">http://www.typophile.com/forums/messages/30/12395.html</a> <br>I was looking for a good, historical font to use in my <i>Machiavelli</i> graphic novel. I chose Adobe Jenson Pro, as you can see from the image below (page six of the prologue) <br><a href="http://www.donmacdonald.com/Machiavelli/mach_jenson.html" target="_blank">http://www.donmacdonald.com/Machiavelli/mach_jenson.html</a> <br>I just wanted to thank everyone for the help and ask if there are any glaring type-related issues that I missed. Thanks!</p>'
