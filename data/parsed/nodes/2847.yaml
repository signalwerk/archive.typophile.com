    html: <p>Looks very good.  <br> <br>I would just check the kerning where your regular caps meet the italic lower case. This is historically correct, but probably the typeface doesn't have kerning pairs for it. For example the T and r in 'Truly' look too far apart to me. So you need to use your software kerning, or if you are using InDesign you can also use the 'optical kerning' setting which might take care of the whole thing.  </p>
