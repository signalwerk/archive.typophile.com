      <p>Thank you all for your replies and comments,</p>
      <p>* I really should start a thread for Slorca. i’d be very interested to hear what people around here have to say about it. I think I need to find the time to give it a few more sessions, at least to have a full set of the alphabet, and then i’d post it. now the problem is finding the time for that...</p>
      <p>* about the chinese print - actually korean.<br>
      it was actually a technical study of the screenprinting process - i didnt design this piece, i just scanned an old korean balm or something and traced it, every line, ornament and letter is the way it was on the original tag. maybe i should write it next to the print.</p>
      <p>Thanks again for your comments, Feel free to contact me or post further replies</p>
