    html: |-
      <p>A lot of very nice work. I like the ’lechem eretz’, which retains its readability even with the elegant swashy design.</p>
      <p>The ’Chinese’ sign looks fake and awkward because the stuff in the center violates the rules of how Chinese characters have to be formed. </p>
      <p>Your effort at reversal of weight for Hebrew characters in Slorca doesn’t work for me. But my Hebrew is poor and I am not used to reading it, so I am probably not a good judge. To me the Hebrew font ’Erica’ does pull off such a reversal (but only a slight one) very well, if I remember rightly. If you were doing a cross of horizontal and vertical strokes in a Roman cap, you would if anything thin the horizontal near the intersection, as Albertus does. Here thickening the horizontal looks awkward to me. But as I say, I am not looking with eyes thoroughly accustomed to Hebrew, so I may be off in this comment.</p>
