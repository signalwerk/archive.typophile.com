    <p>I wasn't sure whether to post this in Type ID or General Discussions. I tried GD with no luck. Sorry about the cross posting.</p>
    <p>This font is Galahad. On a TV show I saw credits in a caps font that had an an A with a left bar like Galahad.</p>
    <p>Is there a name for the bar?</p>
    <p>What other fonts have an A with a bar on the left side of the A? (Or the right side?)</p>
