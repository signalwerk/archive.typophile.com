    html: <p>Thank you Adam for you quick answer. <br> <br>"That's a 5-seconds job." <br> <br>Usually I prepair these things in advance but it couldn't be done this time. The font is a bit special so usual kerning pairs doesn't apply. That's why I hoped to keep the kerning pairs I've made in FOG &amp; just apply the same settings to the diactritics - AccentKernMaker would've done the trick.  Making right classes will take a while (long time) in this case. Maybe I should just print the atm- file and go through which pairs need to be fixed? <br> <br>"add-in for FontLab Studio 5. " <br>Looking forward to it's release... many nice features. <br></p>
