    html: <p>Peter,  <br> <br>&gt; I was stupid enough to think that this  <br>&gt; would link them immediately, and that I  <br>&gt; didn't have to define the right and  <br>&gt; left classes in the kerning assistant.  <br> <br>You need to define the left and right classes in Kerning Assistance. The simplest case is to open Kerning Assistance, click on the left classes list, click on "Select All", click on the right classes list, click on "Select All". That's a 5-seconds job.  <br> <br>Then, you can go and manually deselect the appropriate side of the class for those that are noth both-side classes (if you have such classes).  <br> <br>&gt; Why isn't there a feature in FL that  <br>&gt; does connect the accent characters  <br>&gt; automatic ( with an option to turn it  <br>&gt; off)?  <br> <br>This can be done with a Python script. Such script is in development at Fontlab Ltd. and will be available as an add-in for FontLab Studio 5.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.  <br></p>
    html_clean: <p>Peter,  <br> <br>&gt; I was stupid enough to think that this  <br>&gt; would link them immediately, and that I  <br>&gt; didn't have to define the right and  <br>&gt; left classes in the kerning assistant.  <br> <br>You need to define the left and right classes in Kerning Assistance. The simplest case is to open Kerning Assistance, click on the left classes list, click on "Select All", click on the right classes list, click on "Select All". That's a 5-seconds job.  <br> <br>Then, you can go and manually deselect the appropriate side of the class for those that are noth both-side classes (if you have such classes).  <br> <br>&gt; Why isn't there a feature in FL that  <br>&gt; does connect the accent characters  <br>&gt; automatic ( with an option to turn it  <br>&gt; off)?  <br> <br>This can be done with a Python script. Such script is in development at Fontlab Ltd. and will be available as an add-in for FontLab Studio 5.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.  <br></p>
