    html: <p>Peter,  <br> <br>make up just a few classes, then save the classes into an .flc file from the Classes panel. Open the .flc file in a text editor. You will see that the font has a fairly simple structure. Of course the other classes still need to be added, but editing this text file should be fairly fast.  <br> <br>Note that in the Kernig Assistance dialog, you are also able to save a .flk file which has a similar structure but in addition contains information on left-side, right-side and both-side classes. So perhaps you may want to edit this one.  <br> <br>Best,  <br>Adam <br></p>
