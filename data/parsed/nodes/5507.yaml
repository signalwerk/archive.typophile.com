  html: <p>I've finished the kerning of the basic characters and I need to apply the same kerning to the accent characters. <br> <br>I would've used Peter Bilak's "AccentKernMaker" if it hadn't been discontinued. <br> <br>So the font has been generated  from Fog &amp; I've now imported it into FL and  I've also imported the kerning. <br>I've made classes of all the accent charaters (and the base character as the reference. <br> <br>I was stupid enough to think that this would link them 	immediately, and that I didn't have to define the right and left classes in the kerning assistant. But that was not the case. Or is it? <br> <br>Anyone with a solution? Why isn't there a feature in FL that does connect the accent characters automatic ( with an option to turn it off)?  <br> <br> <br> <br></p>
  html_clean: <p>I've finished the kerning of the basic characters and I need to apply the same kerning to the accent characters. <br> <br>I would've used Peter Bilak's "AccentKernMaker" if it hadn't been discontinued. <br> <br>So the font has been generated  from Fog &amp; I've now imported it into FL and  I've also imported the kerning. <br>I've made classes of all the accent charaters (and the base character as the reference. <br> <br>I was stupid enough to think that this would link them 	immediately, and that I didn't have to define the right and left classes in the kerning assistant. But that was not the case. Or is it? <br> <br>Anyone with a solution? Why isn't there a feature in FL that does connect the accent characters automatic ( with an option to turn it off)?  <br> <br> <br> <br></p>
