      <p>So nice to be so close to holding this thing in my hands... I was privileged to do the English translation - it was very challenging, and I worked very hard* to deliver a natural tone that would do justice to the fluid original, while not leaving any stone unturned in achieving faithfulness. Interestingly, the experience was quite similar to designing a text font!</p>
      <p>* Converted to an hourly rate it was probably illegal in California.  ;-)</p>
      <p>BTW, "gentilhomme" has connotations that conflict with the intended meaning.</p>
      <p>hhp</p>
