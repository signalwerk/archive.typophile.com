    html: <p>The Fontographer method is described here; <br><br><a href="http://www.macromedia.com/support/fontographer/ts/documents/pathmenu.htm" target="_blank">http://www.macromedia.com/support/fontographer/ts/documents/pathmenu.htm</a> <br><br>In brief, outer paths move clockwise and the inner paths (in letters such as A and O) move in an anti-clockwise direction. A small arrow in <span class="caps">FOG</span></p>
