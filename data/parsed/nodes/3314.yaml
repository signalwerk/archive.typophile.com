    html: <p>Paul — <br><br>I can never remember, and to an extent it doesn’t matter until… <br>You generate the ﬁle. <br><br>Before generating (in <span class="caps">FL</span>) go to Transform &gt; Contour &gt; Reverse All. <br>Then choose “set counterclockwise (Type 1) direction”. <br>Or TrueType etc.  <br>I hope this&nbsp;helps.</p>
    html_clean: <p>Paul — <br><br>I can never remember, and to an extent it doesn’t matter until… <br>You generate the ﬁle. <br><br>Before generating (in <span class="caps">FL</span>) go to Transform &gt; Contour &gt; Reverse All. <br>Then choose “set counterclockwise (Type 1) direction”. <br>Or TrueType etc.  <br>I hope this&nbsp;helps.</p>
