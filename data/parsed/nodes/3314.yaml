    html: '<p>It is easy to remember with rime: <br><br><br><br>Truetype, black on right. <br><br><br><br>If you follow the conture’s direction in <span class="caps">TT</span> font the black surface is allways on your right side. <br><br>It is the opposite with Postscript fonts. For more info see the Adobe’s free online book abouth the postscript language. <br><br><br>gg</p>'
