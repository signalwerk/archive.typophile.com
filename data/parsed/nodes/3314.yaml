    html: <p>To use your words. Black is counterclockwise. White is clockwise. <br>- or - <br>Outermost outline is counterclockwise. Alternate as you move in. <br>(same thing said differently) <br> <br>Eric, you mean I don't have to go through glyph by glyph and double check? No wonder computers were invented. :-) <br> <br>Randy</p>
