    html: <p>Paul - <br> <br>I can never remember, and to an extent it doesn't matter until... <br>You generate the file. <br> <br>Before generating (in FL) go to Transform &gt; Contour &gt; Reverse All. <br>Then choose "set counterclockwise (Type 1) direction". <br>Or TrueType etc.  <br>I hope this helps.</p>
    html_clean: <p>Paul - <br> <br>I can never remember, and to an extent it doesn't matter until... <br>You generate the file. <br> <br>Before generating (in FL) go to Transform &gt; Contour &gt; Reverse All. <br>Then choose "set counterclockwise (Type 1) direction". <br>Or TrueType etc.  <br>I hope this helps.</p>
