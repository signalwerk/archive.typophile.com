  html: '<p>I’m asking because i don’t know the answer (obviously), but does it matter which way your contours run? I have been under the impression that black contours should run clockwise while the white parts should run counterclockwise? does it really matter? i know the main thing is that the black and white contours run in opposite directions. anyhow part of my confusion comes from the diagram here:  <br><a href="http://babelfish.altavista.com/babelfish/urltrurl?url=http%3A%2F%2Fwww.sudtipos.com.ar%2Fsubmitions.htm&amp;lp=es_en&amp;tt=url" target="_blank">http://babelﬁsh.altavista.com/babelﬁsh/urltrurl?url=http%3A%2F%2Fwww.sudtipos.com.ar%2Fsubmitions.htm&amp;lp=es_en&amp;tt=url</a> <br>i had to give you the translated version because i think it adds humor to the text, and i’m all for humor! anyhow, anyone know a “deﬁnitive” answer to this&nbsp;question?</p>'
