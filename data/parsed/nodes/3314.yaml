    html: <p>One funny thing I've noticed in FontLab is that if you Merge Contours (Ctrl + F10), the direction of them has to be the same. If they run in opposite directions, the contours don't merge, they intersect, and there's a lot of tedious clean-up. <br> <br>It took me eight months, but I finally figured that out ;-)</p>
