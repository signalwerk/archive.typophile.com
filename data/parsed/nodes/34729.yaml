    <p>I’m looking for a variation on what I presume to be Optima, an example of which I’ve attached. </p>
    <p>Compared to the LinoType Optima example if found online, the differences I immediately pick out are:<br>
    a squatter, rounder ’S’, and wider, elongated horizontal strokes in the ’E’. </p>
    <p>Can anyone help me solve this one?</p>
    <p>Thanks.</p>
