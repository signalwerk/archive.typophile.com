    <div class="info">Submitted by <a href="/user/827" title="View user profile.">Ale Paul</a> : 3.Jun.2009 8.13am </div>
      <p>//////////////////////////////////////////////////////////////////////////<br>
    June.09 NEW RELEASE.<br>
    //////////////////////////////////////////////////////////////////////////</p>
    <p><strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000431">Adios Script</a></strong></p>
    <p></p><div class="imageWrap"><img src="/files/bannertypophile_6714.jpg"></div><p></p>
    <p>Romantic, decorative Adios Script is one of <a href="/wiki/Alejandro%252BPaul" class="wiki">Alejandro Paul</a>’s most elaborate and technically refined faces to date. Inspired by designs in “how-to” commercial lettering guides of the 1940s, it has been refined and brought into the 21st century through a huge variety of ornate swash letterforms. The lowercase “h” alone offers 43 variants. Hundreds of ornamental ascenders and descenders allow a beautiful interplay of strokes and combinations, while avoiding overlaps or conflicts. Adios Script features a mind-boggling 1,470 characters in total, in <a href="/wiki/OpenType" class="wiki">OpenType</a> format.</p>
    <p><strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000431">Adios Script</a></strong> received a Certificate of Excellence at the Type Directors Club and was selected at the Tipos Latinos biennial.</p>
    <p><strong><a href="http://www.sudtipos.com">Sudtipos</a></strong></p>
