    html: |-
      <p>The cool and the non-cool legal scholars use footnotes with arabic numerals; daggers and asterisks for introductory notes.<br>
      Some publications use superscript indented. Some use flush left followed by a period + "tab". </p>
      <p>None that I know use the margin like Bringhurst recommends:</p>
      <p>      Text Text<br>
            Text Text Text<br>
            ------<br>
         1  Note<br>
         2  Note   </p>
      <p>---- where the footnote markers are outdented, and the "Note" text is flush with the body text's left margin</p>
