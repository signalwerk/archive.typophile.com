    html: <p>I saw a really cool book once - or maybe it was an article - I wish I could remember what (forgive the Alzheimers), where the word or phrase that needed the footnote was in a different color and then there was a corresponding box, the same color that contained the footnote. Of course that wouldn't work for just any sort of text but it looked great and was very easy to follow.</p>
