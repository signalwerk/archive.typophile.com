  html: |-
    <p>Anyone know what the really cool kids are doing with respect to marking footnotes these days? The asterisk, dagger, doubledagger system of marks seems a bit antiquated, and I’m not sure if these are internationally understood outside of academic texts. Superscript numbers seem a bit boring, and I’m not sure if these would need to switch to local numeral forms in Hindi or Arabic text. Any other ideas?</p>
    <p>Cheers, Si</p>
