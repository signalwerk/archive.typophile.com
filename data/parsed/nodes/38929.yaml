    html: |-
      <p>I suggest to drag a pair of guidelines from the square where the two rulers meet. These guidelines will be horizontal and vertical respecitvely. Then, move them. Delete them. Subsequent guidelines you drag out of the rulers will be exactly horizontal or vertical, too.<br>
      Note that FL gives new guides the angle of the last guide you touched.</p>
