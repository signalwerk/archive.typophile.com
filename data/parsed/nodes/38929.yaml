    <p>Question: When using FontLab, I can be a true guideline freak. However, I cannot seem to shake one ongoing frustration: when I go to pull out a guideline, many times it is crooked at some odd angle and I am forced to go through the right-click, drag-down, hit align process. What causes this (I realize once you draw a crooked guideline, every subsequent one drawn will be the same angle), and is there a way I can eliminate even being able to draw anything BUT a perfectly straight guideline?</p>
    <p>And in translation for those fans of the utterly concise: </p>
    <p>Me. Love guidelines. Always crooked. Dammit. Need solution.</p>
