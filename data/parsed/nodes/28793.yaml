      <p>I buy fonts without knowing what I'm going to do with them all too frequently. I seldom buy large families since I find I don't use the full range.</p>
      <p>European, including Eastern Europe, support is important to me, and I have set a few phrases in Greek, so that's nice, but not really too important to me.</p>
      <p>I'm a sucker for Opentype features, and wouldn't buy a text face that didn't have smallcaps and osfs available.</p>
      <p>The EULA is <em>very</em> important to me. If embedding isn't allowed, I <em>won't</em> buy. I really want the right to make modifications for my own use.</p>
      <p>I'm not in the least interested in faces that have smallcaps and ligatures in separate fonts unless the EULA permits modifications, in which case I'll gladly make an OT version for myself.</p>
      <p>If there is an OT version, I <em>might</em> consider a face with a EULA that restricts modifications, but even then I'm leery.</p>
