      <p>These are interesting responses. I predicted a few quite wrongly. It sounds like internationalization is as important to  others as it to me, for a variety of reasons. A lot of the other features I asked about sound more important to someone formatting an entire book, than to a designer laying short work ion display text?</p>
      <p>I don't see the harm modifications could do in a purchased font. Presumably, releasing any modifications as a packaged font file is usually condemned by earlier terms of a license. Is this really a common problem? It seems like a worthless clause, since one could simply modify graphics in  front or behind the font output, anyhow, to achieve the same effect. Are small foundries commonly overly-restrictive?</p>
      <p>Would purchasers be interested in the same font (or family) with different licenses for different prices? Or is that confusing?</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
      <a href="http://www.exclamachine.com" title="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
