      <p>I only do occassional graphic design work at the moment, but I have worked for a few bigger firms, who each had purchasing and IT departments, who all had their say in fonts. Anyway, here are my answers.</p>
      <p><em>1) Do you ever purchase fonts before you know what (paying) project they will be applied to?</em></p>
      <p>Yes. I have almost only bought licenses for specific projects. It is a nice bonus that I get to use the fonts later on in the future. But when I think font licensing, I think short term use, i.e., the next project.</p>
      <p><em>2a) Are you more inclined to purchase where you see a large family of weights, styles and cuts available?</em></p>
      <p>Sort of. That depends what you mean by large! A family needs to have a few weights and variants for me. But 20? or 200? Not really, especially since I get fonts for specific projects, so I tend to know which weights I'll probably need.</p>
      <p><em>2b) If so, do you prefer to purchase them all in one?</em></p>
      <p>Yes.</p>
      <p><em>Are the following important when deciding between fonts:</em></p>
      <p>3) International accents &amp; alphabets (European, Greek, etc.)</p>
      <p>A few years a go, no. But now, it is paramont. Since I'm working in Central Europe, Eastern European accents are a requirement. Plus, staring Jan. 1, 2007, the EU will have three official writing systems in it (Latin, Greek, and Bulgarian Cyrillic).</p>
      <p><em>4) Alternate characters (swash ‘&amp;’, ornamented letters)<br>
      5) Additional glyphs (archaic letters, dash suites)<br>
      6) OpenType “typographics” (alt. punctuation for caps, smart fractions)<br>
      7) OpenType “neatos” (random alternates, automated ligatures)</em></p>
      <p>I love these, but they are never the deal maker or breaker for me.</p>
