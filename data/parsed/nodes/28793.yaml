      <ul>1) Do you ever purchase fonts before you know what (paying) project they will be applied to?</ul>
      <p>Yes.</p>
      <ul>2a) Are you more inclined to purchase where you see a large family of weights, styles and cuts available?</ul>
      <p>Variety is always a good thing. But depending upon the family and use it is sometimes unnecessary.</p>
      <ul>2b) If so, do you prefer to purchase them all in one?</ul>
      <p>If I can afford it at the time I will license the entire family as in the long run it would be more expensive to license them bits at a time.</p>
      <p>Are the following important when deciding between fonts:</p>
      <ul>3) International accents &amp; alphabets (European, Greek, etc.)</ul>
      <p>Greek and Cyrillic are a different issue, but I think the type designer is being lazy if they can't at least include all/most diacritical marks. (Is that mean?)</p>
      <ul>4) Alternate characters (swash ‘&amp;’, ornamented letters)</ul>
      <p>Depends upon the typeface. Sometimes the design is screaming for more, but I think this is a very subjective thing.</p>
      <ul>5) Additional glyphs (archaic letters, dash suites)</ul>
      <p>What do you mean by dash suites? Em and En dash? This again is a subjective thing and more of a specific need for a specific project. No?</p>
      <p>6) OpenType “typographics” (alt. punctuation for caps, smart fractions)</p>
      <p>More and more I want OpenType. Especially if the family has small caps and extended ligature features. </p>
      <ul>7) OpenType “neatos” (random alternates, automated ligatures)</ul>
      <p>This seems backwards somehow. </p>
      <ul>8) What other features strongly affect the decision? Price? Support? License choices? Anything else?</ul>
      <p>The license of course. But again, if I license from a foundry with a very restrictive EULA I can only use the font in certain instances.</p>
