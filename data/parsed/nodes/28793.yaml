    <p>This is a questionaire to all the graphic designers and layout artists that actually use and purchase display fonts:</p>
    <p>1) Do you ever purchase fonts before you know what (paying) project they will be applied to?</p>
    <p>2a) Are you more inclined to purchase where you see a large family of weights, styles and cuts available?</p>
    <p>2b) If so, do you prefer to purchase them all in one?</p>
    <p>Are the following important when deciding between fonts:</p>
    <p>3) International accents &amp; alphabets<em>  (European, Greek, etc.)</em><br>
    4) Alternate characters   <em>  (swash '&amp;', ornamented letters)</em><br>
    5) Additional glyphs   <em>  (archaic letters, dash suites)</em><br>
    6) OpenType "typographics"  <em>   (alt. punctuation for caps, smart fractions)</em><br>
    7) OpenType "neatos"  <em>   (random alternates, automated ligatures)</em></p>
    <p>8) What other features strongly affect the decision? Price? Support? License choices? Anything else?</p>
