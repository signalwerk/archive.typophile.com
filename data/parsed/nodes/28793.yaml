      <p><em>1) Do you ever purchase fonts before you know what (paying) project they will be applied to?</em></p>
      <p>Yes. I pay for quality type for personal projects as well.</p>
      <p><em>2a) Are you more inclined to purchase where you see a large family of weights, styles and cuts available?</em></p>
      <p>Not directly; most of my projects only need a couple of styles.  I suppose having a larger family makes it more likely that the styles I need will be there, so it helps indirectly.</p>
      <p><em>2b) If so, do you prefer to purchase them all in one?</em></p>
      <p>I'll buy a full family if it's one I expect to use a lot, or if I need enough that the full family is not significantly more expensive.  Otherwise, no.</p>
      <p><em>3) International accents &amp; alphabets (European, Greek, etc.)</em></p>
      <p>Accents are important, but the only non-Latin writing system I use much is Japanese, and I certainly don't expect Western type designers to support <em>that</em>.  :)</p>
      <p><em>4) Alternate characters (swash ‘&amp;’, ornamented letters)<br>
      5) Additional glyphs (archaic letters, dash suites)</em></p>
      <p>Usually unimportant.</p>
      <p><em>6) OpenType “typographics” (alt. punctuation for caps, smart fractions)</em></p>
      <p>Convenient, but not essential. With the lengths of text I work with, it's just as easy to tweak things by hand.</p>
      <p><em>7) OpenType “neatos” (random alternates, automated ligatures)</em></p>
      <p>Largely irrelevant to me.  (I'd include standard ligatures in "typographics" myself, so I assume you mean fancy ligatures here.)</p>
      <p><em>8) What other features strongly affect the decision? Price? Support? License choices? Anything else?</em></p>
      <p>The EULA.  Restricting embedding is a big minus, permitting modification is a big plus.</p>
