    html: |-
      <p>Optima for me has a very neutral appeal. Some might see this as a negative, some might see it as a plus in terms of universal acceptance. I closely relate it to a military sense since it is used on war memorials, and in some presidential campaigns. Although I think it works well on its own, I would rather evade these connotations.</p>
      <p>Does anyone know of unitype fonts that I can look at? I like the ones that Nick has listed, but I think I need one step bolder and lighter of the sans version.</p>
      <p>A wedge serif seams to be a good solution, I am just trying to find some good ones. I have a font called topaz (shown above) but it's all caps, and I don't know if I like that for such a suggestive typeface.</p>
      <p>In terms of the symbol, it's a hummingbird because a. it's a bird (flies) b. it hovers (like a helicopter) c. The body is meant to be Africa. </p>
      <p>I know it's not really fleshed out yet, but it's only a start.</p>
