      <p>What Craig said (and Frode). The cross makes the bird look dead, even if that's obviously not the intention.</p>
      <p>Type: It's certainly good not to make it too organic or brushy (and no Optima). It might seem over-the-top and potentially tacky (besides not matching the style of the bird). «Mercy» is a strong word and I'm thinking the type might have to be a bit reserved.<br>
      So reassuring is good, simple is good, but: don't make it cold, or slick/corporate.<br>
      A few of your options could work but maybe you're not entirely there yet… I could well imagine a friendly but serious wedge-serif (for the «reassuring» bit) but with a bit of modulation and some roughness, to make it less monolithic / more human. Something in the general direction of <a href="http://www.type-together.com/Skolar" rel="nofollow">Skolar</a> or <a href="http://emigre.com/EF.php?fid=207" rel="nofollow">Malaga</a>?</p>
      <p>And dunno, but I wouldn't put a font with holes on a plane.</p>
