      <p>I would suggest an eco font (one with holes) or something unicase (e.g. <a href="http://www.shinntype.com/panoptica.html" rel="nofollow">Panoptica</a>).<br>
      The omission of redundant material signifies a carefulness with resources.<br>
      Not "mercy", but you already said that in text, and IMO practicality is a more appropriate attitude than pride.</p>
