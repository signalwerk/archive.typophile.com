      <p><em>Were you serious about the eco font, Nick?</em></p>
      <p>Absolutely.<br>
      If you're serious about selling your work to the client (the "rationale"), ya gotta walk the talk, or eat your own dogfood, as it it sometimes phrased, or else you're just bullshitting.<br>
      Fine artists have been doing this for decades, to the extent that the concept becomes the main focus, and the actual "work" relatively inconsequential.<br>
      The eco font is a worthy successor to Chalet and Starling.</p>
