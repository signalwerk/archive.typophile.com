    <p>Hey yall, I was hoping to get some feedback or suggestions. I am currently in the process of creating a logo for a not for profit organization named Mercy Air, that provides helicopters and airplanes so that villages in remote areas of Africa can receive aid and resources, not just the easy to access places. The mark is still being edited, but the basic idea is there. My issue is with the font, I cannot seem to pick a font that says "mercy". I am trying to convey too much? Would it be better to keep it clean/contemporary and use a simple sans serif, or should I try to "fancy" it out? Any comments and suggestions are welcome.</p>
    <p>update: <a href="http://img11.imageshack.us/img11/1/picture9ue.png" title="http://img11.imageshack.us/img11/1/picture9ue.png">http://img11.imageshack.us/img11/1/picture9ue.png</a></p>
