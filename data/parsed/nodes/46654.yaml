    <p>I need help identifying some fonts on this website:</p>
    <p><a href="https://web.archive.org/web/20081013110028/http://gridplane.com/">Gridplane.com</a></p>
    <p>I’m especially interested in finding out what the “WORK” font is at the top, and also the body copy type. The dates along the left that are set in white/light grey all caps seem very close to Arial but are slightly different, better.</p>
    <p>Anyway, I really like the look of these and would appreciate any help identifying them. Or even if someone could direct me to some pixel fonts that are different and more attractive than the average Arial, Helvetica, Verdana pixel sans serif fonts seen on the web. What font foundry out there makes beautiful, high-quality pixel fonts that could be incorporated into flash-based websites?</p>
    <p>Thanks!</p>
