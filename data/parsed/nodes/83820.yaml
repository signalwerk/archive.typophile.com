  html: |-
    <p>Using python in Fontlab, I understand how to save a currently open VFB, or save a currently open VFB under a different name.</p>
    <p>What I don't understand is how to get the "save as" behavior: keep the current VFB &amp; its windows open, but give it a new filename.</p>
  html_clean: |-
    <p>Using python in Fontlab, I understand how to save a currently open VFB, or save a currently open VFB under a different name.</p>
    <p>What I don't understand is how to get the "save as" behavior: keep the current VFB &amp; its windows open, but give it a new filename.</p>
