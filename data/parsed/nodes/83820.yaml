    html: |-
      <p>How about:<br>
      <code>fl.font.file_name = "your new path"<br>
      fl.UpdateFont(-1)<br>
      fl.font.Save(fl.font.file_name)</code><br>
      ?</p>
    html_clean: |-
      <p>How about:<br>
      <code>fl.font.file_name = "your new path"<br>
      fl.UpdateFont(-1)<br>
      fl.font.Save(fl.font.file_name)</code><br>
      ?</p>
