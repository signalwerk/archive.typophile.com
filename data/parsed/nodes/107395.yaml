      <p>I suspect that your sample is most likely a PhotoLettering font from the 1960s or 1970s, but very little of their catalog is digitized. A competitor, Filmotype, has several digitized fonts that are somewhat similar, particularly Filmotype Hamlet and Filmotype Harmony:<br>
      <a href="http://www.myfonts.com/fonts/filmotype/hamlet/" title="http://www.myfonts.com/fonts/filmotype/hamlet/">http://www.myfonts.com/fonts/filmotype/hamlet/</a><br>
      <a href="http://www.myfonts.com/fonts/filmotype/harmony/" title="http://www.myfonts.com/fonts/filmotype/harmony/">http://www.myfonts.com/fonts/filmotype/harmony/</a><br>
      Also Filmotype Honey, as already mentioned.<br>
      Don</p>
