      <p>Hi osamu,</p>
      <p>I know what you mean about the style re: Murray Hill - it also put me in mind of Nevison Casual, Brody Script and Saginaw - they all have a similar vibe<br>
      Although, I note that you say you need to find an "exact match" for the example, well that could be difficult. I've been through a lot of my reference material and didn't find anything there (not yet anyhow). But, if close is OK - and you do mention the Filmotype library - then check out "Honey Script". That may work.</p>
      <p><a href="http://www.myfonts.com/fonts/filmotype/honey/" title="http://www.myfonts.com/fonts/filmotype/honey/">http://www.myfonts.com/fonts/filmotype/honey/</a></p>
      <p>Just an idea</p>
      <p>Regards<br>
      Doghouse</p>
