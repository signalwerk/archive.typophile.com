    <p>I am interested in this script face from a 1976 Moog pricelist. I have been unable to identify it from any current digital type foundry, so perhaps it was never digitized.</p>
    <p><a class="freelinking external" href="http://webidiot.net/pics/moogscript.png" rel="nofollow">http://webidiot.net/pics/moogscript.png</a></p>
    <p>It has stylistic cognates in Murray Hill, and some of the script fonts from the Filmotype library, but no exact match. Can anyone with any older type specimen books from the phototype days help me out?</p>
