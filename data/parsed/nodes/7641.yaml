    html: <p>That's Lys Calligraph, aka Lysandria aka Lorrene. You can see it on <a href="http://bowfinprintworks.com/Script13Pg2.html" target="_blank">Mike's script ID guide</a> (scroll down, it's on the bottom right of the page). It is not commercially available to my knowledge. It is available as freeware for PC only. This is funny, I was just looking for this font too. It's a beaut .</p>
