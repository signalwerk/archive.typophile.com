    html: <p>Lysandria was a Fontbank font. Other versions include David <br>Rakowski's <a href="http://www.faces.co.uk/products/fonts/view.cfm?productsku=IN10136" target="_blank"> Sisman</a>, Brendel Informatik's <a href="http://www.qbf.de/dceng.htm" target="_blank"> Windsor Sword</a> and <br>Castcraft's Opti Lord Swash.</p>
