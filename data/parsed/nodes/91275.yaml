      <p>Thanks for the thoughtful responses everyone. I think we're all in agreement here, aside from minor discrepancies, that currency symbols are important contributors to the completeness of the typeface. I can't wait until browsers catch up with the extraordinary potential of OT. For the time being, I will continue to spec more stringent typographic rules for print than I'm able in the browser.</p>
      <blockquote><p><cite>My practice is to have the Small Caps feature effect only lower case letters, and have All Small Caps also turn capitals and figures (whether old style or lining) and monetary symbols into small-cap-height lining glyphs.</cite></p></blockquote>
      <p>I completely agree, Nick. A complete set of figures should include lining, text, and small cap (all in tab and proportional). The currency sorts should be drawn to coordinate with those features.</p>
      <p>Whitman and Williams Caslon are favorites of mine. Unfortunately, not appropriate for this client. Someday I'll find the right project ;)</p>
