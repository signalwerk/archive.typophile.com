      <p>With InDesign:</p>
      <p>It is a little odd, but you can use the standard monetary signs and "shift the baseline down" with everything but a following  6 or 8. If you look at the older Monotype Type 1 *sterling* character, that's essentially what they did.</p>
      <p>When I make them up for os figs in a font editing program, I usually  make them a little smaller, but also lower them a little. Scaling only, either in InDesign or an editing program,  doesn't work too well, as the weight becomes too thin. You could maybe scale them to 95% vertical without a weight change. If you scale then in InDesign, you'll lose any kerning...</p>
