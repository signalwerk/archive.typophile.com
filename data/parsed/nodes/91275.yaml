      <p>To me it epitomises the limitations of typographic devices of the time too. Of course $ isn’t italic (I was joking), because it’s a generic sort, made to adapt to any setting. And look at those sub-x-height small caps.<br>
      Limitations and tradition are powerful design devices, the roots of it, I dare say, but we’re talking about a tool (a Opentype font) whose aim isn’t to reproduce historical artefacts, but to satisfy modern sensibilities and paradigms.</p>
