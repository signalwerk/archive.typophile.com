    html: "<p>You can get away with lining $ and old style numerals in an emergency if the value starts with a 6 or an 8: $87.99, $6.2 million. But with others it looks weird: $92.40, $3.2 million. If you hate yourself you can use the Unicode small cap s character (ᴜ+ᴀ731) and the combining short solidus overlay (ᴜ+0337) as a crude facsimile of a small cap dollar – ꜱ̷ – but this is only suitable for typographic masochists.</p>"
