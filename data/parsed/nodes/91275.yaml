      <p>That’s not the issue, but anyway, those aren’t italic. Is the “5” is italic, just because it leans?<br>
      The bars are slanted to fit them both in, and the fact that the top of the “S” part of the dollar is smaller than the bottom part contributes to the slant.</p>
      <p>What I hoped would happen, when people survey this ad, is that they would imagine a “small cap” (approx. x-height) dollar sign in this layout, and realize how pitiful it would look.</p>
      <p>This is after all the kind of historicist layout that epitomizes the typographic ethos of small caps and alternate figures, and the play that typographers can make with these devices.</p>
