  html: |-
    <p>Scouring the available options (this time limited to web font availability), I am surprised at the number of typefaces that omit a small cap variant of the dollar sign. This omission is particularly annoying as I'm trying to use all small caps in a promotional environment. </p>
    <p>Among the type design community, does this seem like an important glyph or is my need obscure? I'd be interested to hear perspectives on this exceedingly small concern. Any favorites that do have it? Legato is a favorite of mine that doesn't actually have it but is sized to work in either case.</p>
