    html: |-
      <p>I’ve put them in these types: Bodoni Egyptian Pro, Figgins Sans, Oneleigh Pro, Pratt Pro, Parity, Paradigm Pro, Scotch Modern.</p>
      <p>My practice is to have the Small Caps feature effect only lower case letters, and have All Small Caps also turn capitals and figures (whether old style or lining) and monetary symbols into small-cap-height lining glyphs.</p>
      <p>However, most browsers do not yet support OT features.</p>
      <p>Therefore you need to have a separate Small Caps web font, and the figure style for that would be oldstyle—SC+OSF—with default cap-lining monetary symbols. I’m afraid I don’t see the point of producing those extra fonts, as I’d rather wait for browsers to support OT features, which seems to be the trajectory the industry is taking.</p>
      <p>So, to get what you want now, you’d need a third “All Small Caps, Small Figures &amp; Small Monetary Symbols” font, with lining small-cap-height figures and monetary symbols.</p>
      <p>A small-cap-lining dollar with old style figures is wrong.</p>
    html_clean: |-
