    <p>I have just made my first font, woo hoo I have exported it as a otf. Works great on Macs but on Windows it looks terrible. I am using Fontlab Studio and I have tried so many things to get it working correctly, but nothing works.</p>
    <p>As you can see it looks ’clumpy’</p>
    <p>I am thinking this is a common problem but i have not seen anything about it... so maybe it is not common. Please help :)</p><div class="imageWrap"><img src="/web/20080828112840im_/http://www.typophile.com/files/picture_6740.jpg"></div><p></p>
