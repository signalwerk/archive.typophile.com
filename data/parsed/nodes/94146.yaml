  html: |-
    <p>Hey everybody,</p>
    <p>Fonts are single-color. Differently colored outlines or filled-in sections (the hole in the capitol 'P', for example) could be created via the use of two fonts, one or both being useless without the other.</p>
    <p>Are there any common such font pairs out there that I should know about, or is this something that I would have to request from someone/build myself?</p>
