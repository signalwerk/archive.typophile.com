    votes: null
    html: |-
      <p>I saw this in a recent mailing from MyFonts.com. The font is Brownstone Sans. </p>
      <p>I'm not sure how the effect is achieved, but my guess is that you set your headline using filled-in characters, then create a duplicate text box on top of it, and then in the upper box you change some of the filled-in characters for alternates that aren't filled in. And you make the upper text box a different color.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/font-example_3573.jpg"></div><p></p>
