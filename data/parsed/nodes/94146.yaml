    html: |-
      <p>Often it depends on the effect. Rosewood and the like, for example, often use the word “fill” for the “secondary” font. More complex effects call for more creative names.<br>
      You could look for “chromatic” as a keyword, but, as I said, it depends on the style you’re looking for.</p>
