      <p>&gt; <em>Also, would a Bulgarian keyboard map to these glyphs automatically?</em></p>
      <p>No. With the keyboard you insert character codepoints, not glyph IDs. So the underlying text data for Russian, Bulgarian and Serbian is the same, the only difference is the glyph form.</p>
      <p>To answer Nick, Chris is right; to implement these glyph-form differences in an OpenType font you'll have to use the 'locl' feature. Here's a code snippet that handles the lowercase 'be' (б U+0431 CYRILLIC SMALL LETTER BE):</p>
      <p><code>feature locl {</code></p>
      <p>	script cyrl;<br>
      		language SRB exclude_dflt; # Serbian<br>
      			sub be by be.serb;</p>
      <p>} locl;<br>
      </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/be_beserb_3714.png"></div><br>
      'be' and 'be.serb'<p></p>
      <p>The above assumes that the default form of 'be' is the one used for Russian (i.e. the default representation of the character U+0431 is the 6-like shape).<br>
      If, for example, the main market for your font was Serbia, then you could (hypothetically) revert the order and make the Serbian form the default one. But this would complicate the feature code, because you would then have to specify all the other languages that use Cyrillic and which prefer the 6-like shape. Here's what I mean:</p>
      <p><code>feature locl {</code></p>
      <p>	script cyrl;<br>
      		language RUS exclude_dflt; # Russian<br>
      			lookup BE_SIX_LIKE_SHAPE {<br>
      				sub be by be.russ;<br>
      				# Notice the difference in this substitution.<br>
      				# Also, glyph 'be.serb' was renamed to 'be', and 'be.russ' was 'be'.<br>
      			} BE_SIX_LIKE_SHAPE;</p>
      <p>		language UKR exclude_dflt; # Ukrainian<br>
      			lookup BE_SIX_LIKE_SHAPE;</p>
      <p>		language UZB exclude_dflt; # Uzbek<br>
      			lookup BE_SIX_LIKE_SHAPE;</p>
      <p>		language MKD exclude_dflt; # Macedonian<br>
      			lookup BE_SIX_LIKE_SHAPE;</p>
      <p>		language BEL exclude_dflt; # Belarussian<br>
      			lookup BE_SIX_LIKE_SHAPE;</p>
      <p>		# And so on...<br>
      } locl;<br>
      </p>
