      <p>“Is that a position or a screw-up?”</p>
      <p>Actually, it was "process or position", a political nuance by someone at the UN, which MZ took a step further, "no, it was a screw-up."</p>
      <p><em> Serbian Cyrillic and Bulgarian Cyrillic </em></p>
      <p>These are bizarre. The local alternate characters have the same Unicode values as "normal" Cyrillic. So it's like a Latin-using country saying all fonts must have a single-bowl a.</p>
