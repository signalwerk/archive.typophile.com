      <p>re: process, postion and screw-up. </p>
      <p>Nick, there are two quotations: </p>
      <p>1. Kofi Annan used to say about some political developments, "It’s not an event, it’s a process." Maxim referred to this quotation on several occasions. </p>
      <p>2. While Maxim Zhukov worked as typographic coordinator at the United Nations in New York, his immediate boss at the UN was also Russian. At one time, When Maxim prepared a publication, something has gone wrong. His boss looked at him and asked: "Maxim Georgevich, is this a screw-up, or is this a position?" Maxim admitted that it was a screw-up. </p>
      <p>When <a href="http://flickr.com/photos/adamt/410712188/in/set-72157594570229703/" rel="nofollow">Gary Munch</a> said "shnorkel", I interpreted that he meant the German "Schnörkel" (an embellishment, squiggle, flourish) rather than "Schnorchel"/snorkel. But I think it may have been just a merging of both terms. </p>
      <p>Gary has reasonable knowledge of German but his rendition of Schnörkel sounded more "New York jiddish" than actual German. James Montalbano instantly liked the term, so did I. I think it should find its way into general typographic terminology. </p>
      <p>Overall, I must compliment Maxim on his teaching skills. I was very impressed with the Cyrillic workshopm and thoroughly enjoyed it. Even though I do have good knowledge of Cyrillic, I did learn a lot. I found the formula very well chosen: </p>
      <p>* Friday afternoon was a visit to the Slavic division of the New York Public Library, where we could look at some old Cyrillic type specimens and prints (though some participants, including myself, wished that we could spend more time looking at the specimens). </p>
      <p>* Saturday was a full-day (9 to 5) lecture-style, when Maxim first talked about the development of the Cyrillic script (the pre-Petrine time, the reform by Peter the Great, the 19th century type founding, the Soviet period and the newest times), and then discussed the entire alphabet <a href="http://flickr.com/photos/adamt/410708645/in/set-72157594570229703/" rel="nofollow">letter-by-letter</a> (the Russian as well as some non-Russian letters): first uppercase, then upright lowercase, and finally italic lowercase. He also discussed the peculiarities of handwritten and script Cyrillic. </p>
      <p>* Sunday was another full day, during which Maxim critiqued the Cyrillic type designs that the participants sent him before the workshop, all produced according to a standardized layout. For the first 3 or so participants, he spent some 30-40 minutes talking about each project. All the time, he actively asked for comments from other participants, and it was a collaborative critique rather than a one-way monologue. We spent a bit less time for each of the designs discussed later, but it was not a problem because the discussion about the first three or so designs already covered many common problems that appeared in designs that appeared later, so we didn’t actually feel that we needed to talk in great detail about every single alphabet. So in the discussion on the later designs, Maxim concentrated on the specific issues not discussed previously. </p>
      <p>The visuals presented by Maxim were very good and comprehensive. He also presented a collection of books that people could find useful when studying Cyrillic (many of them were in Russian only). </p>
      <p>I found Maxim’s timing perfect: he finished 4:58 on Saturday, and 4:45 on Sunday, just on time. The balance between serious content and lightweight anecdotes was just right. It was both <a href="http://flickr.com/photos/adamt/410714979/in/set-72157594570229703/" rel="nofollow">informative</a> and <a href="http://flickr.com/photos/adamt/410716190/in/set-72157594570229703/" rel="nofollow">fun</a>. </p>
      <p>Even though the event was not the cheapest for me (flight from Berlin to New York, hotel and the participation fee), I felt that my money was extremely well spent. Even though I had known Maxim for seven or so years now, worked with him on several ATypI projects, and spoke to him during various conferences, it was the first time that I could enjoy his knowledge and experience for a longer period of time, several days. This was far better than the brief conversations we had previously. Thank you, Maxim! </p>
      <p>I’d also like to thank <a href="http://flickr.com/photos/adamt/410731168/in/set-72157594570229703/" rel="nofollow">the other participants</a>. I felt it was an excellent group, very active and responsive, and it was fun seeing some of my good friends again, and taking part in it. </p>
      <p>Adam</p>
    html_clean: |-
