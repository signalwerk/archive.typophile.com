      <p>"Cyrillic Week-End</p>
      <p>The increasing demand for multilingual typefaces has been boosted by the latest developments in the technologies of communications. The adoption of Unicode, and the industry-wide transition to OpenType font format has put the skills and the expertise of type designers to a new test. There is a growing expectation of their being able to develop typefaces with expanded glyph sets that cover not one but a number of scripts. Cyrillic is one of these scripts, used by large numbers of readers and writers and designers.</p>
      <p>Features of Cyrillic will include :</p>
      <p>    * Cyrillic, its origins, its history and evolution, its structure, its peculiarities, its traps and pitfalls<br>
          * Character-by-character overview, comments and tips (character set: Windows 1251, plus Old Cyrillic, plus Serbian alternates)<br>
          * Cyrillic and Latin<br>
          * Cyrillic and Greek<br>
          * Cyrillic caps, l.c., and yes, s.c.<br>
          * Cyrillic roman and Cyrillic italic (and Cyrillic cursive?)<br>
          * Serbian Cyrillic and Bulgarian Cyrillic<br>
          * Old (pre-1918) Cyrillic<br>
          * [more?!]"</p>
      <p>That link seems to work just fine.</p>
      <p>ChrisL</p>
