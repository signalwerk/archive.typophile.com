      <p><em>Greek has a tonos.</em></p>
      <p>Well it does and it doesn't. The Greek diacritic letters with tonos and oxia both decompose to letter plus U+0301, which is the combining acute accent character. This means that bi-script fonts supporting combining mark characters need to have a Greek-specific ( feature) glyph for U+0301 and other general diacritics.</p>
      <p>Similarly, in a combined Latin-Cyrillic font with combining mark support one would want a Cyrillic-specific 'breve' glyph.</p>
      <p>Although the form of these characters as used in different scripts may vary, they are clearly the same character performing the same orthographic functions. The Greek tonos performs the same stress mark role as the acute in most European orthographies; the Greek oxia and varia were tone marks and correspond to the use of acute and grave in the orthographies of huge numbers of tonal languages in Africa and elsewhere; the Cyrillic kratka, like the Latin (and Greek) breve, indicates a short vowel sound.</p>
    html_clean: |-
