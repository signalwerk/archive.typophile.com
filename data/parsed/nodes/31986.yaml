      <p><em>Or maybe they should. :)</em></p>
      <p>I don't know enough about the workings of the Unicode Consortium to be able to comment on the merit of its character-selection process, but from a typographic perspective the distinction between characters and glyphs, which is central to the OpenType premise, should be absolutely rigid. If not, the absurd situation arises - as with the Bulgarian and Serbian alternates - where the correct glyphs are only accessible via a Stylistic Set, or with a dedicated Bulgarian/Serbian font. The first is too obscure for genereral use, and the second makes a mockery of the one-font-for-all internationalist idealism of the enterprise.</p>
    html_clean: |-
