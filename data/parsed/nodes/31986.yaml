    <p>Cyrillic Weekend, with <a href="/wiki/Maxim%20Zhukov" class="freelinking" rel="nofollow">Maxim Zhukov</a> as the instructor-moderator</p>
    <p>For those of you with an interest in multi-script typeface design who could not attend the <a href="/wiki/Type%20Directors%20Club" class="freelinking" rel="nofollow">TDC</a> program last weekend, you missed a fantastic opportunity. Maxim was at his finest presenting the nuances of <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a> type and helping the 18 who attended improve their own works in progress. The event started with a trip to the New York Public Library special collection of rare early books printed in Cyrillic. I’ll bet it was tough having the Czar as your art director—we got to see handwritten notes of instruction and critiques in the Czar’s own hand and some spectacular books.<br>
    After a day of Maxim’s presentations on Cyrillic forms and styles, there were critiques of numerous impressive works in progress by the participants.<br>
    <a href="/wiki/James%20Montalbano" class="freelinking" rel="nofollow">James Montalbano</a>, <a href="/wiki/Gary%20Munch" class="freelinking" rel="nofollow">Gary Munch</a>, and <a href="/wiki/Carol%20Wahler" class="freelinking" rel="nofollow">Carol Wahler</a> put the event together helping Maxim bring it to life. Hats off to them all for making it a valuable learning experience and an enjoyable weekend as well!</p>
    <p>The TDC will also bring <a href="/wiki/Gerry%20Leonidas" class="freelinking" rel="nofollow">Gerry Leonidas</a> back in the Fall to present Greek Weekend, the second in the non-Latin the series.</p>
    <p><a href="http://www.tdc.org/events/education//non-latinweek-ends/2007nonlatleonidasgreek.html" title="http://www.tdc.org/events/education//non-latinweek-ends/2007nonlatleonidasgreek.html">http://www.tdc.org/events/education//non-latinweek-ends/2007nonlatleonid...</a></p>
    <p><a href="http://www.tdc.org/events/education/non-latinweek-ends/2007nonlatzhukovcyrillic.html" title="http://www.tdc.org/events/education/non-latinweek-ends/2007nonlatzhukovcyrillic.html">http://www.tdc.org/events/education/non-latinweek-ends/2007nonlatzhukovc...</a></p>
    <p><a href="http://www.tdc.org/" title="http://www.tdc.org/">http://www.tdc.org/</a></p>
    <p>ChrisL</p>
