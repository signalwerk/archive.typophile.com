    html: |-
      <p><em>the kratka is not considered a diacritic, but is actually part of the letter</em></p>
      <p>This is an intra-orthographic observation, i.e. in the writing of Russian the kratka is considered part of the letter and the most obvious evidence of this is that the long i vowel and the short i vowel (with kratka) are sorted separately in dictionaries. But one shouldn't presume that the kratka will always be considered 'part of the letter' in all orthographies. It is a mark that indicates a short vowel sound, and hence could easily be adapted as a combining diacritic in orthographies for other languages.</p>
      <p>As a parallel, think of the Latin á. In French, this is considered a letter plus diacritic mark, and is sorted in dictionaries amid the letter A words. In Northern Sami, á is considered a separate letter and is sorted after A.</p>
