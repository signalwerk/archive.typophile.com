      <p>الأستاذ رفيق</p>
      <p>أعتقد أنك وصلت للإجابة من الأخ خالد، لكن لو تبحث عموما عن برمجة الخطوط العربية فيمكنك متابعة الروابط التالية، وفيها طرق لا تعتمد على أدوات أدوبي، وفي الحقيقة فهذه الطرق أسهل بكثير.</p>
      <p>مجموعة التيبوغرافيين العرب<br>
      - برمجة الخطوط باستخدام برنامج فونت فورج:<br><a href="http://www.aratypo.net/forums/forumdisplay.php?f=31">http://www.aratypo.net/forums/forumdisplay.php?f=31</a> </p>
      <p>- برمجة الخطوط باستخدام برنامج فونت لاب:<br><a href="http://www.aratypo.net/forums/forumdisplay.php?f=32">http://www.aratypo.net/forums/forumdisplay.php?f=32</a></p>
      <p>- برمجة الخطوط العربية باستخدام برنامج مايكروسوفت فولت:<br><a href="http://www.aratypo.net/forums/forumdisplay.php?f=33">http://www.aratypo.net/forums/forumdisplay.php?f=33</a></p>
      <p>أعتقد أن هذه الروابط ستفيدك كثيرا في تعلم برمجة الخطوط، ومشروحة باللغة العربية.</p>
      <p>تقبل تحياتي</p>
      <p>بدر عرابي</p>
