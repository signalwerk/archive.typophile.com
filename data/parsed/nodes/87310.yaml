      <p>The profit part was <a href="http://en.wikipedia.org/wiki/Underpants_gnome#Plot" title="Click to visit an external URL." class="freelink freelink-external freelink-external">joke</a> :) any way I don't sell fonts, so I've no idea.</p>
      <p>There are generic <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">feature file syntax</a> documentation, but nothing Arabic specific. For understanding how Arabic is handled in OpenType, check the <a href="http://www.microsoft.com/typography/OpenType%20Dev/arabic/intro.mspx" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Microsoft documentation</a> (especially the shaping engine page), then you have to implement those features in feature files. Checking the layout code in existing fonts can be very helpful as well.</p>
