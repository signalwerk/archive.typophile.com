    html: |-
      <p>The profit part was <a class="freelinking external" href="http://en.wikipedia.org/wiki/Underpants_gnome#Plot" rel="nofollow">joke</a> :) any way I don't sell fonts, so I've no idea.</p>
      <p>There are generic <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" rel="nofollow">feature file syntax</a> documentation, but nothing Arabic specific. For understanding how Arabic is handled in OpenType, check the <a class="freelinking external" href="http://www.microsoft.com/typography/OpenType%20Dev/arabic/intro.mspx" rel="nofollow">Microsoft documentation</a> (especially the shaping engine page), then you have to implement those features in feature files. Checking the layout code in existing fonts can be very helpful as well.</p>
