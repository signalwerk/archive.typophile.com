      <p>I recently taught a course of type design to graphic design students.<br>
      The goal was to create the students' version of a contemporary generic sans, through consensus.</p>
      <p>One thing I will say: the taste that is expressed through the process of design is emergent, and dependent on the way in which the designer(s) use their tools, no matter how automated the process may be. </p>
      <p>The taste that may be appraised by choosing preferences amongst existing types that people have seen is somewhat different.<br>
      And the taste that may be appraised by choosing preferences amongst existing fonts that people have used is different again.</p>
      <p>So you are setting yourself an extremely tall order if you expect a generated font to be able to recreate the opinions and ideas of the massive.</p>
      <p>**</p>
      <p>There is another problem with averaging.<br>
      Say you're considering serifs.<br>
      If 40% prefer serifs and 60% sans, the average will be a semi-serif, which nobody prefers.<br>
      And it wouldn't be at all representative.</p>
