      <p>I like Averia as it's a nifty little mix of computer science mixed with art and the end result is rather interesting in its own way.</p>
      <p>It is what it is and it's interesting and looks nice. But it's not a treatise based on deep scientific analysis of the opinions and science of type searching for some profound revelation. </p>
      <p>I guess what I'm saying is that your intent may be noble, but it's really way out there. I'd step back a bit and first ask yourself what problem or question are you trying to solve by figuring out what your classmates thing about what defines 'average type'?</p>
      <p>My advice would be to ground it a bit. The reason things like Averia worked is *because* of a defined (if not arbitrary) subset of data was used. </p>
      <p>(Also, this feels a lot like "what happens when we design by committee". That question, sadly, has already been answered and tends to be answered daily in most corporate settings.)</p>
