    <p>Hi, I'm collecting feedback and help for my thesis project.</p>
    <p>The research part of the project is an analysis of the ongoing tendencies in design, such as generative design, conditional design, parametric design etc.<br>
    As a result of the research, I'd like to design and publish a complete typeface to be used as the official font for the Academy I'm studying at.</p>
    <p>I'd like to work with all the other students, researching their taste in typography, asking them what fonts do they think are more suitable to be officially used by the Academy, and then producing an average font based on the opinions.</p>
    <p>I've read about various parametric "average" typefaces, like the Averia:<br>
    <a href="http://iotic.com/averia/" title="http://iotic.com/averia/">http://iotic.com/averia/</a><br>
    and the Average typeface<br>
    <a href="http://www.letterlabor.de/typeface.php" title="http://www.letterlabor.de/typeface.php">http://www.letterlabor.de/typeface.php</a></p>
    <p>But I want my average font not to be based on my sole taste or on every font installed on my font library. I want it to be the true recreation of the opinions and ideas of all the students from the Academy (even those who don't give a sheewt about type design, yep).<br>
    But in order to do such a thing I still need of to teach any typedesign application to make an "average" type, whatever the sources of the process.</p>
    <p>Do you have advices/tips/etc.?</p>
    <p>Thanks in advance for the reply, this stuff is quite important to me as it would be my first outbreak into 'true' type design.</p>
    <p>a.</p>
