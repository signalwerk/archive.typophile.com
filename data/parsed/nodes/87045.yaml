      <p>Thanks for the feedback!</p>
      <p>My intent is to produce both an average serif and an average sans, so the research result would be splitted into the two categories.<br>
      I like the results of the averia, as the serifs and the sans have morphed into a very particular kind of shape (much like a gross version of the Optima corrections), but I'd prefer a more 'ordinary' and 'familiar' look.</p>
      <p>I know that actual representation of a typographic taste is almost utopic (and the wider the chosen subjects, the more utopic the representation gets), but that wasn't the real scope of the project.</p>
      <p>What I'd really like to realise is to let all the students participate by their feedbacks and opinions on my project, but since most of them do not have a specific education in type design, they'll naturally refer to existing typefaces in order to express their views and opinions.</p>
      <p>I'd like to create some sort of memetic and psychological link in between the resulting typeface and the final users of the typeface.</p>
      <p>Intermission/further explanation: the more I study modern design practices, the more I realise that in a complex system like nowadays society, the designer is just an operator among operators, while the old creators-to-users system is collapsing fast. This was the first spark that brought my attention to the fact that, in order to create a typeface that really works for the users-operators (i.e. academy students), I should give the highest priority to their feedbacks and needs. As a vast number of those students do not really care about type design, the first consideration would be to abandon the project, as the final users do not need a specific typeface for them. But this year my academy is also finally establishing a visual identity of his own, after fifty years of basically lying in a 'identity limbo', and in my opinion a typeface is a very important part of the visual identity of an academy where a good number of students do study type design, whether they care or not.</p>
