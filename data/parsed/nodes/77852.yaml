      <p>I'm not going to start a discussion on piracy here. I know this has been and will be a sensitive theme around here, but I think the issue is far too complicated to simply say they pirated or not. </p>
      <p>URW and Bitstream digitalized many fonts in the early digital era, often for other foundries without such expertise, like Berthold, Linotype, ITC etc. URW (which is not the same as URW++, read about this elsewhere) offered two price ranges, a cheaper one in which they acquired the right to resell, and a more expensive one, where this was not allowed or strongly limited (by name change for instance). This is how they acquired the rights to the fonts. This is not piracy, rather a smart business strategy. I've read a lot about these cases, and this is much different from the likes of SSi, who had no right to resell, copied outlines and redistributed under another name, to bypass US copyright law. URW developed top quality font software in the seventies, the first and at the time best of its kind and many designers and foundries have used their expertise and software. The early digital type revolution has created a very dodgy mess, with a lot of bankrupties and mergers(Berthold for instance went bankrupt, URW later also went into receivership) and a lot of sharks in the water to pick up the pieces cheap and resell or redistribute themselves. This and the dodgy copyright laws for fonts makes verdicts very difficult to make. I would say the URW was on the right side of the spectrum, also because they were deeply involved in the beginnings of digital type and making it all happen, assuring a high quality standard. They were not in it for a quick buck IMHO. </p>
      <p>@1996type<br>
      A lot of foundries offer the same fonts at the different prices, under different licenses and sometimes different names. But one cannot be called a pirate just for selling at a lower price...</p>
