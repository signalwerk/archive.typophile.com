    <p>Hi Typophiles,</p>
    <p>I thought I'd just point you to this incredible offer on <a class="freelinking external" href="http://cgi.ebay.co.uk/URW-TypeWorks-3000-fonts-with-reference-book_W0QQitemZ200561695551QQcategoryZ171QQcmdZViewItemQQ_trksidZp4340.m263QQ_trkparmsZalgo%3DDLSL%252BSIC%26its%3DI%26itu%3DUCI%252BIA%252BUA%252BFICS%252BUFI%252BDDSIC%26otn%3D8%26pmod%3D200537138905%252B200537138905%26po%3D%26ps%3D63%26clkid%3D6219504482821084856" rel="nofollow">Ebay</a> (great britain). URW Typeworks 1 and 2 are offered for just 30 GBP apiece, which is a real bargain. I guess you might become sceptic as these used to cost thousands in the early 90s, but I can only say that it's absolutely A OK. They are liquidated stock, are new and unopened, and the CDs are still sealed. Both PC and MAC, postscript and truetype are available. I work on MAC and it works with no problems whatsoever, and the fonts (500 fonts + modifications per set) are high quality, and they come with a useful 1000 page reference book with all fonts displayed.</p>
    <p>Highly recommended I would say! I wouldn't be trying to sell you something if it wasn't! </p>
    <p>enjoy! :-)</p>
