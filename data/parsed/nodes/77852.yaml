      <p>Incidentally, buying a CD-ROM may not always give you a valid license for what is on that CD-ROM, even though the CD-ROM is a genuine original one. For example, one might, from some places, purchase a CD-ROM for Corel Draw that was to be packaged with a new computer, separately from the computer - and which may not be resoled by the purchaser of the computer it came with.</p>
      <p>When a CD-ROM, although authentic, is being sold at a price far below the original price, the possibility that a license condition has been violated, resulting in one not having an actual valid license for the software or fonts on it must be taken into consideration.</p>
