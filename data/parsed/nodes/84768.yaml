      <p>@johnbutler: I believe the term is “<a href="http://en.wikipedia.org/wiki/Kinetic_typography" rel="nofollow">kinetic typography</a>.” And I agree, it is getting a little long in the tooth. Do a YouTube search on it and you’ll find more examples of “<em>look at me, I just learned how to use Adobe After Effects</em>” than you can shake a stick at. Type, rotate 90°, repeat.</p>
      <p>Personally, I think it most of it is all a pale imitation of <a href="http://www.youtube.com/watch?v=Gj13ugh5FYw" rel="nofollow">Marcellus Wallace</a>, which is ~5 years old and still one of the stronger examples of the genre.</p>
      <p>A partner showed me <a href="http://www.youtube.com/watch?v=oABYXASleQE&amp;playnext=1&amp;list=PL1C5F460E36E74D84" rel="nofollow">a video entitled “Remix”</a> which is an homage to the work of <a href="http://en.wikipedia.org/wiki/Josef_M%C3%BCller-Brockmann" rel="nofollow">Josef Müller-Brockmann</a> which I thought was very nice, but then again, I have a soft spot for Jo.</p>
      <p>If you are interested in browsing a few more videos, some time ago I started <a href="http://typophile.com/node/43707" rel="nofollow">a thread titled “Cool type videos”</a>. It’s suffering from a pretty bad case of link-rot, but some of it still works.</p>
      <p>It’s a shame most of the work is so cookie-cutter as there are some great pieces out there, and sifting through more than 5000 YouTube videos is like trying to find a needle in a stack of needles.</p>
