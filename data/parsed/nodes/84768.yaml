    <p>Unimportant question, but I’m intensely curious.</p>
    <p>Am I the only type nerd who finds “motion typography” sequences profoundly irritating? I think it started with those Dennis Leary voiceover commercials for Ford pickup trucks. I actually don’t usually mind Dennis Leary, and I tolerate Ford pickup trucks enough to own one. It became very popular very fast, and now it’s all over the place. But fading, thank God.</p>
