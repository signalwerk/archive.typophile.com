      <p>The real reason for using it in TV ads is to try to get their message past the mute button. It is a practical necessity in a struggling medium. And anyone watching who can't read is not likely to be in the market for a new truck. Illiteracy comes of being born into poverty and having insufficient help from a crippled education system to escape it.</p>
      <p>The whole "TV made everyone illiterate" idea is a few generations out of date anyway. Now people grow up with the internet, which for all its extra features is still composed almost entirely of the written word. Any young people who still watch TV now go to the internet to discuss the shows they watch and write fanfic about them. Reading and writing has begun to overtake speech as the main form of communication. If kids today, having portable telephones to carry with them everywhere they go, were illiterate, then you would think they'd all be <em>talking</em> on them, but increasingly they prefer to <em>text</em> each other on them instead.</p>
