    html: <p>Motion typography is another recent fad for fluffing up portfolios, just like snowboards, t-shirts, retro book covers, retro movie posters, and the current fluffing fad, information graphics that take longer to comprehend than a paragraph of good copy. These fads do become tiresome, but they seem to be a reflection of design's collective unconscious, if not design's living consciousness. And they give students a nice break from creating imaginary corporations to develop high-concept brand standards for. I focus on enjoying all the great things that churn up and try not to pay attention to the rest. Well, except for the pointless infographic fad, but that's because I would rather read an article than look at a conceptual infographic.</p>
