    html: <p>As an industry fad I generally like it because it's done by creative professionals. As a popular internet fad — which started with a wave of AfterEffects student assignments uploaded to YouTube, notably the famous Pulp Fiction scene — it is played out. Hundreds of "typography videos", none of which actually incorporate the practice of <em>typography,</em> dutifully pop each word onto the screen one at a time in a random rectilinear orientation, often in some uninspired choice of font like Arial or Impact, unkerned and riddled with spelling mistakes, and culminating in a rare reflection of the content at one or two key points. It only irritates me because I would love to watch them if they were any good.</p>
