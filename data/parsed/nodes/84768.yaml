      <p>@oldnick - And that's so different from the newspapers' old telegraphic code how? Yes, the SMS and IRC codes are quite often overdone as all get. But, like the newspaper code, they were intended to get as much out of an expensive medium as possible.</p>
      <p>You get one 160-character block per SMS. And, yes, text messages over a GSM mobile using the Small Message Service are called SMS's up here. A phone like my aging Nokia 3510 gives you ca. 20 characters per line. You type the message using the number keys. Believe me, this is not an environment to go all Shakespearean in.</p>
