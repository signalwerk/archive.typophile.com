      <p>It's evolution.<br>
      Type used to be juiced with ligatures, kerning, small caps, that sort of thing.<br>
      Then in the early days of DTP along came dimensionalization, gradients, dropshadows, textures.<br>
      Then animation, and now integration via composited space mimicking shot space.<br>
      It's all typography.</p>
      <p>There is a typographic tradition of motion graphics, primarily in film title sequences.<br>
      <a href="http://www.youtube.com/watch?v=jIlqatMQSgI" title="http://www.youtube.com/watch?v=jIlqatMQSgI">http://www.youtube.com/watch?v=jIlqatMQSgI</a></p>
      <p>But I know what you're talking about John, and I think the genre to which you refer is an unimaginative, literal interpretation of advertising copy, a heavy-handed attempt to drill the message into the viewers skull, power point on acid. But perhaps this approach is perfect for the product and the target market.</p>
      <p>**</p>
      <p>I was in a new F-150 recently, and when it started up, a message appeared on the screen, "Built Ford Tough".<br>
      Nasty.</p>
