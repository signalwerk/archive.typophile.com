    <p>i assume that freetype2 can do a decent job of rasterizing type. but using it through the GD extension in PHP i’m not satisfied. attached is an example with too much space around the numeral 1.</p>
    <p>i’m guessing that ft2 could do better but the interface (i.e. <a class="freelinking-external" href="http://us2.php.net/manual/en/function.imagefttext.php">imagefttext()</a>) provides minimal control.</p>
    <p>what other freetype front-ends should i consider? command-line tools, perl/ruby scripts, php extensions etc. are fine but i’m not going to program my own front-end in C.</p>
    <p>alternatively, are there other rasterizes i should consider?</p>
