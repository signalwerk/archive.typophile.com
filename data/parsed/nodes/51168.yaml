      <p>I think the vast space around the ’1’s indicates that Highlander’s figures are indeed tabular, as is the case with most fonts in the ITC range. Not sure what is happening in the ’2’ and ’5’ rows.</p>
      <p>Here are two alternatives to consider that have proportional figs:</p>
      <p><a href="http://www.fontshop.com/fonts/singles/itc/itc_legacy_sans_bold_italic_osf/?sample_text=Legacy%201234567890&amp;sample_size=48">ITC Legacy Sans</a><br>
      <a href="http://www.fontshop.com/fonts/singles/underware/sauna_bold_italic/?sample_text=Sauna%200123456789&amp;sample_size=48">Sauna</a></p>
      <p>You’ll note that these are <em>oldstyle</em> or text figures, which means they descend and ascend like lowercase letters. Your options of fonts with proportional <em>lining</em> figures (numerals of the same height) will increase substantially if Freetype can take advantage of the figure options in OpenType fonts. Can it?</p>
