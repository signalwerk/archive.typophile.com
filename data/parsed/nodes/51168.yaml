    html: <p>Are you sure that space around the numeral 1 isn’t due to the font metrics themselves? Fonts with <a href="/wiki/tabular%252Bfigures" class="wiki">tabular figures</a> always have more space around the 1 because the numerals are monospaced. To set text and headlines I would use a font with <a href="/wiki/proportional%252Bfigures" class="wiki">proportional figures</a>.</p>
