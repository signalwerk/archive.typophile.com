      <p>hi stephen,</p>
      <p>thanks. and again, i think you’re right. concerning the odd misalignments in the sample i posted above, i’d guess the linotype.com sample renderer left aligned bounding boxes rather than the glyph origins.</p>
      <p>one important application i have is radio station IDs as web page title in a banner box. surrounded by a 4-capital call sign and a 2-capital waveband, oldstyle figures for the frequency look rather odd — as though a beret or turtleneck-wearing designer might have been involved;-)</p>
      <p>i read the freetype documentation now. it loads font files, handles their info and renders glyphs. laying out a string is done by the library’s client so my original question was confused. <a class="freelinking-external" href="http://www.libgd.org/Font#char_.2AgdImageStringFT.28gdImagePtr_im.2C_int_.2Abrect.2C_int_fg.2C_char_.2Afontname.2C_double_ptsize.2C_double_angle.2C_int_x.2C_int_y.2C_char_.2Astring.29_.28FUNCTION.29">GD’s string renderer</a> accepts utf8 and html entities so i could use osf if i really wanted to.</p>
      <p>but i think basically GD/freetype are doing what they are supposed to do given the font’s design. my obvious choices seem to be: 1) choose another font; 2) find another text layout library that allows some kind of kern tagging of the string (i looked and didn’t find); or 3) keep the font, GD and freetype and use a hack in  my php script to effectively trim the bearing and advance of 1 numerals and perhaps decimal points.</p>
