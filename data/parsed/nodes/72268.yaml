      <p>Individual experiences can vary, but reviewers generally give Macs high marks for build quality.</p>
      <p>I've got a 15" MacBook Pro and love it. CS4 runs great (don't have CS5 yet). The standard 4 GBs of RAM is okay, but more would make it zippier, especially when you've got many apps open and are switching back and forth.</p>
      <p>The screen in the 13" model looks a tad small to me, especially if you've got a lot of palettes open in CS, but I realize that cost can be a factor. And you can always hook it up to a larger external monitor.</p>
      <p>I think you can choose between a gloss and matte screen. I prefer the matte myself, as I find reflections annoying, but most folks seem to prefer the blacker blacks on the glossy screen.</p>
