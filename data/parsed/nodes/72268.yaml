      <p>Apple has constant hardware failures, more than I care to deal with. As for the bizarre errors, in my computer-repair days, they've always been user-caused... I'm on Win7 and never get any bizarre errors.</p>
      <p><em>One of the many nice surprises of OSX: it handles application memory way, way better than Windows. Even Windows 7 on a brand new PC bogs down with only two CS applications open (only one if you also are using Word). Quitting apps as soon as you are done with them is something you'll soon get used not needing to.</em></p>
      <p>Not necessarily. Windows actually handles multitasking with multiple cores better. I currently have open: Illustrator, Dreamweaver, InDesign, Photoshop, Suitcase Fusion 2, MediaMonkey (audio program), Steam (video game launching program) and some other miscellaneous things, and I can switch between one and the other seamlessly. In Windows 7.</p>
      <p>To be honest, I would only buy Dell's high-end laptops. Sony and ASUS are better options, and don't cost a fortune to upgrade RAM as with Apple.</p>
      <p>Also, what James Puckett mentioned isn't quite true, either: <em>If you aren’t doing motion graphics or doing 3D stuff CPU options are effectively irrelevant to performance.</em></p>
      <p>His statement was too generic. If you aren't doing motion or 3d, then a superpowered video card isn't necessary. "CPU options" are everything in this matter. RAM doesn't do processing, it allows more memory for the CPU to work with. The key is to have a good amount of quality RAM <em>and</em> a powerful processor.</p>
      <p>Take this into consideration, as well:</p>
      <p>2.66 i7 CPU<br>
      8GB DDR3 RAM<br>
      500GB Hard Drive<br>
      17" Screen<br>
      Apple's Cost: $2900.00<br>
      ASUS: $1450.00</p>
      <p>That's double the price. ASUS's also comes with a better video card, 1yr accidental warranty, 2 year parts &amp; labor warranty, and an extendable warranty.</p>
      <p>But, overall, I do love Apple's design. That's where they have always trumped other brands.</p>
