      <p>James:<em>The only real advantage to Apple hardware is that you can pay extra for Applecare, which gives you three years to walk into the Apple store and get fast service for just about any of the defects in Apple’s cheap Asian hardware.</em></p>
      <p>On the other hand, there is Dell's on-site service option, which I've found to be excellent. Bear in mind that I live on a small island only accessible by ferry. The Dell contracted service guy came on over, spent a morning fixing one problem and diagnosing another. Then Dell couriered a brand new monitor to me that arrived the next morning, and arranged pick-up of the old one.</p>
