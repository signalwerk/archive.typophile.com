    <p>It's not even been a year, and my overpriced Dell Studio 15 is making funny noises. I'm tired of flimsy plastic, cheap keys, and bizarre errors, and seriously considering buying <a class="freelinking external" href="http://www.apple.com/mac/whichmacbook/compare.html" rel="nofollow">a 13-inch MacBook Pro</a>. </p>
    <p>Does anyone own one and can share a bit about what they about the computer? Specifically, is anyone running Adobe CS5 apps on it? Can it handle them well?</p>
    <p>Your input would be proverbially much appreciated.</p>
