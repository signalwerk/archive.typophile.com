      <p>One thing to note with Apple hardware is that their highest-end model of any of their lines tends to be disproportionately more expensive compared to the specs. And even then the gap between their lowest end option and their highest end option isn't all that large, so I'd usually recommend folks go with the lower or mid range option unless money is of no concern. </p>
