      <p>Generally when I made the switch I learned to love the OS. The Hardware is alright, usually. They had their batch of problematic products too, cracking top-board of the old white mac-book, heat issues due to wrongfully applied thermal-paste, display issues with the iMac, so they are not manufacturing miracle-machines. </p>
      <p>On the other hand their built quality recently increased again I think, with the new uni-body lineup. In general there were some issues after the intel-switch. Anyhow, you will definitely be at least on the same level as with a general Windows laptop (I am sure there are some outstanding Win laptops too). </p>
      <p>I had three macs, and only good experiences with the Apple service. The old white macbook was a bit problematic for me, because I needed to get the display (flickering) and the keyboard-unit/top-case (cracks) exchanged on warranty. But it still runs great actually, considering that I dropped the whole thing from a meter and a half on the floor (It was due to a wrongly zipped backpack)! The display was broken, but I was able to change the display myself following the instructions of ifixit (It is the third screen in the same laptop already). Generally the limited variety of products can be a plus too, because parts are easier available, same with instructions. Plus if a line of products has a series problem you hear quite fast about it. With Windows-laptop manufactures you normally have 50 different laptops in the line-up, so news travels slower I guess.</p>
      <p>I have the 13 inch MacBook Pro, mine is a year old already though. A friend of mine uses it for design work with Photoshop and an external monitor, she says CS5 performs better on a mac than CS4. She uses Photoshop. I am not sure if Video-Editing would be something advisable, other than that CS should be fine, if you use an external display. </p>
      <p>For the value of money a hackintosh would be the smartest thing. In some EU countries this probably would be legal even, if you were you have the OS DVD, if you did not download a modified OS, but just the drivers and kernel-extensions. I am not sure how feasible this is, but I just want to point out that in some countries the use of the OS is less restricted and it is more seen under the aspect of property than license, than in others. This has to do with the non-applicablitiy of EULAs, which are not accessible before the buy. It doesn't mean that you own the code, but on your version of what you bought you can modify for your own use whatever you want, depending on the country.</p>
