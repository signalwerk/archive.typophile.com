      <p><em>If you aren't doing motion or 3d, then a superpowered video card isn't necessary. "CPU options" are everything in this matter. RAM doesn't do processing, it allows more memory for the CPU to work with. The key is to have a good amount of quality RAM and a powerful processor.</em></p>
      <p>I completely agree. Even if you're doing motion or 3D, chances are you'll be working in a low quality/res or wireframe mode anyway. All of the fancy 3D stuff like raytracing, GI, SSS, volumetrics, motion blur, and whatnot come in when it's time to render...which happens on the CPU and in memory.</p>
      <p>Personally, I can vouch for my satisfaction with my MacBookPro, although it's one of the older ones (got it summer of '07). I have experienced some logic board issues and I had one of those creepy Sony (IIRC) batteries, but the service was excellent. The OS has only ever crashed maybe once or twice, and I only ever shut it down when I need to get on an airplane. Most of the time it just stays on, and if I need to move it I'll put it to sleep. As far as multitasking, as I said, I really think it depends on the app. I can run Nuke, Final Cut Pro, and ZBrush all at once with no issues. Open one too many tab in Safari, though, and it dies... *sigh*</p>
