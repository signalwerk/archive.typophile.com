      <p>Apple uses the same parts, and to some extent, the same internal hardware designs, as every other laptop vendor. There are really only four laptop makers in the world, all run out of Hong Kong and/or Taiwan. All of their designs are variations on each other, they all use the same suppliers and contractors, etc. Companies like Dell and Apple just pick a stock mainboard and have it slightly modified for whatever controls and ports their American designers want to wrap around it.</p>
      <p>So I’m not surprised that my luck with Powerbooks has been just as bad as my luck with PC laptops was. This laptop’s CD/DVD drive has never worked right, the first battery developed a defect, the replacement has since done the same. The only real advantage to Apple hardware is that you can pay extra for Applecare, which gives you three years to walk into the Apple store and get fast service for just about any of the defects in Apple’s cheap Asian hardware.</p>
      <p>I buy Apple computers because I like being able to run on a fairly solid UNIX OS and because Microsoft’s GUI designers are even worse than Apple’s. But I’m never buying another overpriced Powerbook. Next time I’m going to just build my own desktop and run Hackintosh on it.</p>
