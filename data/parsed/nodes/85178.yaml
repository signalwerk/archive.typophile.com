    <p>Hello all,</p>
    <p>I am looking for some suggestions that meet the following criteria:<br>
    - overall letter shapes similar to FB Stainless Extended Light<br>
    <a href="http://new.myfonts.com/fonts/fontbureau/stainless/ext-light/" title="http://new.myfonts.com/fonts/fontbureau/stainless/ext-light/">http://new.myfonts.com/fonts/fontbureau/stainless/ext-light/</a><br>
    - but and this is crucial have some contrast in stroke weight (think an extended Sweet Gothic)</p>
    <p>Thanks in advance,</p>
    <p>Seb</p>
