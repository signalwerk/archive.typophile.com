      <p>Take a look at David Jonathan Ross’s huge <a href="http://www.fontbureau.com/fonts/Condor/" rel="nofollow">Condor</a> family. It’s a high-contrast sans with some roots in early 20th century Art-Deco influenced gothic styles, so shares some small heritage perhaps with the Sweet family.</p>
      <p>DJR works a lot with Cyrus, so while Condor isn’t quite as quirky and angular as Stainless, some general Highsmith influence has undoubtedly rubbed off.</p>
      <p>And there are both Wide and Extended widths of Condor.</p>
      <p>Is this along the lines you’re thinking?</p>
