      <p>I like the version better where the beginning of the story is below the title and author. I would left justify the title/author sequence as you have with the footnote (don't justify that--it's too narrow). In this case I don't see the initial cap conflicting with the title. You might pull the title and the text up higher on the page, so that the footnote is below the text. This would set the text block off better.</p>
      <p>With the title in roman and the author in italics, I think you can dispense with the "by", as it's clear this is the title and the author. That would elimnate the awkward whitespace created by having "by" on its own line. Or you could put the "by" directly in front of the author's name.</p>
      <p>You could reduce the leading a couple of points in the footnote.</p>
