    <p>I have typeset Borges' wonderful short (and I mean <em>short</em>) story "Borges and I" as a supplement to an article in the online academic journal I'm working on. I was hoping the experts here could take a look at what I've done and give me any suggestions that come to mind. The single page must be 8 1/2 x 11. Other than that, I have no real restrictions.</p>
    <p>A couple of things to consider:</p>
    <p>1. I chose Baskerville MT due to the reference to 18th-century typography in the story. Any suggestions for something more appropriate? (I have a limited set of fonts to work with, but I might be able to purchase something new if it is not too expensive.)</p>
    <p>2. Is the initial capital too dark? Is the kerning of the characters around it OK?</p>
    <p>Thanks in advance for any comments and suggestions.</p>
    <p>Matty</p>
