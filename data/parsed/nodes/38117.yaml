      <p>Actually, my main quibble with what you've got there is, the text measure is too wide for optimum reading comfort, even with the generous leading you've given it. Aim for a maximum of around 60 characters per line. With the constraint of a single 8.5x 11 page, you might consider making the column narrower, pushed to the right, with the title and author top left in the resulting wide left margin, and the footnote bottom left. You can reduce the leading a bit if necessary to fit the text on.</p>
      <p>I like Baskerville and can't complain about that. I think the initial cap is fine.</p>
