      <p>I suspect it may be the long "s" and quaints (ct, st ligatures) which attracts that particular Borges to 18th century typography.<br>
      Therefore Adobe Caslon would be a good choice, as it has a full complement of long-s ligatures.<br>
      If you're going to be pretentious, don't be coy.<br>
      Or perhaps it is the patina of age that appeals, in which case the subtle distress of Founder's Caslon would fit the bill.<br>
      If it is the baroque quality of letterform,something from Storm, such as Serapion.</p>
