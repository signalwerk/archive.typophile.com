      <p>Thanks for the suggestion, Gary. I'll give something like that a try. The person for whom I'm working may balk at such a "radical" approach, but I'll see if I can convince him. (I tried narrowing the measure and keeping it centered on the page, but there was just too much white space on either side. Your proposal will at least solve that problem.)</p>
      <p>Normally, when I'm stuck working with 8.5 x 11 paper, I work with a landscape-oriented page and use two columns. But I didn't think I could make that work with such a small block of text.</p>
      <p>Nick, unfortunately I have no idea what aspect of 18th-century typography the narrator in Borges' story likes. I think that the long-s's and quaint ligatures would be a bit over the top for an academic journal, though. (And so I think I'll just continue to assume that he likes the neoclassical orderliness of Baskerville!)</p>
