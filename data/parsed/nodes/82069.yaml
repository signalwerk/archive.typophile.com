    <p>King Fahd Glorious Quran Printing Complex release Quran Font with complete Typed data in MS Word File Format. Authenticated by King Fahd Glorious Quran Printing Complex. The Font is free for use.<br>
    The Line &amp; Page Breaks are according to Mushaf AlMadinah, Printed by KFGQPC.</p>
    <p>The Website Link is;<br><a href="http://fonts.qurancomplex.gov.sa">http://fonts.qurancomplex.gov.sa</a></p>
