    html: |-
      <p>Ashfaq, the font is beautiful, thank you.</p>
      <p>But, I'm not sure how useful DOC file will be in real-world usage (except for displaying quranic text on Windows with MS Office installed). DOC format isn't reliable, especially if used on OSes other than Windows and within apps other than MS Word (e.g., OpenOffice.org or LibreOffice on Linux have problems with displaying text correctly; same applies to XeLaTeX). And if one is about to typeset parts of quranic text, then an application like Zekr (<a class="freelinking external" href="http://zekr.org" rel="nofollow">http://zekr.org</a>) is a must (I mentioned Zekr here because it's truly cross-platform). Unfortunately, this font doesn't play well with Zekr neither :( I'd like to hear comments from Mac OS users, but on Linux, usage of the font is quite limited. It's OK for typesetting common arabic, but not for quranic script, for which it's created in the first place.</p>
      <p><a class="freelinking external" href="http://dl.dropbox.com/u/171954/Fonts/Uthmanic%20Hafs/UthmanicHafs-LibreOffice.jpeg" rel="nofollow">LibreOffice screenshot</a><br>
      <a class="freelinking external" href="http://dl.dropbox.com/u/171954/Fonts/Uthmanic%20Hafs/UthmanicHafs-XeLaTeX.pdf" rel="nofollow">XeLaTeX example</a></p>
      <p>Thank you for your effort.</p>
