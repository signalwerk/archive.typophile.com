      <p>bahman - ycherem, Thanx for the comments;</p>
      <p>I hope this will be a good addition in existing Quranic Fonts. This is specially designed to view the Quranic Text according to Uthmanic Script and exactly as printed in Mushaf AlMadinah.</p>
      <p>We also tried our best to remove the clashes of Dots and Tashkeel with the text. i.e. the Tashkeel &amp; dots will not touch the base character.</p>
      <p>Also We are providing Authenticated data of Quraan from King Fahd Glorious Quran Printing Complex. The Line and Page breaks are exactly as they appear in Mushaf AlMadinah.</p>
      <p>We tried to place Tashkeel at their best possible place.</p>
