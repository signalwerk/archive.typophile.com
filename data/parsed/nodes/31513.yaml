  html: |-
    <p>I'm looking for the <a href="http://www.gotransit.com/publicroot/images/bottom_left_go2.gif" rel="nofollow"><br>
    (very '60's) typeface used in this logo</a>. What I know about it is that it was availble in Lettraset in the late sixties and that it is extremely geometric. All the letters are basically made up of  squares and arcs subdivided vertically and/or horizonatlly in the middle. </p>
    <p>I remember seeing this typeface in an old Lettraset catalogue - which incidentally was exactly how the logo was created. GO Transit was started in 1967 by the government of Ontario (Government of Ontario Transit - get it? :) ) with a few used trains and a few stations. During the planning &amp; start-up period the Ministry of Transportation's art department "donated" cabinets full of old lettraset - probably all the stuff they had no intention of ever using. A secretary was given the task of coming up with a logo and... voila. Not bad for a company that obviously placed so little value in design at the time. :o). </p>
    <p>any clues would be much appreciated.</p>
    <p>Thanks</p>
    <p>(link should be fixed - &amp; I added an attached image)</p>
    <p>(Edit, 02, 19. 07 - attached image - my attemt at reconstructing the font.)<br>
    Russ</p>
