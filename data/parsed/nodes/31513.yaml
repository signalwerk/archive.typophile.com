      <p>I added The word Transit to the attachments above. I had to redraw it. Essentially, it's an alphabet made from the minimum number of most geometrically basic possible shapes that will fit into a perfect square. It's easy to replicate, but I want to see how letters like Y, W, X, Z and numerals were handled within the rules the rest of the alphabet follow.</p>
      <p>Stock is very close in some letters, but not quite a cigar...</p>
