    html: |-
      <p>Similar in a lot of respects, but not all.</p>
      <p>The lowercase 'e' on this cover has a slanted middle line -- about 30 degrees up. Goldenbook's 'e' has a horizontal line.</p>
      <p>The capital G on this cover has a sort of spike serif pointing straight up from the top right tip -- Goldenbook has little or no serif there. (Hard to tell at the sample size in the linked page.)</p>
      <p>The capital G is flatter -- i.e. closer to square -- on the cover.</p>
      <p>The lower-right vertical section of the capital G is much thicker in Goldenbook.</p>
      <p>The place where the upper curve of the lower-case 'n' meets the left vertical section is lower on the cover than in Goldenbook. Same in the lowercase 'r'.</p>
      <p>The two curves of the capital B are almost equal in width on the cover, but in Goldenbook the upper curve is noticeably narrower than the lower.</p>
      <p>In general the serifs are larger on the cover than in Goldenbook.</p>
      <p>Like the capital G, the capital O is also closer to square on the cover than in Goldenbook.</p>
      <p>Thanks for the try, though. Anyone have other guesses?</p>
      <p>Thanks in advance,</p>
      <p>Wangden</p>
