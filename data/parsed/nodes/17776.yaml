    html: <p>It's an awful lot like <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=6&amp;displayfontid=MSF.118747.0.0&amp;fontRendererText=Greens+COOKBOOK" rel="nofollow">Goldenbook</a>. More idiosyncratic.</p>
  - id: 108836
