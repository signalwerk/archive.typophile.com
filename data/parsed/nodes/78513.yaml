    html: |-
      <p>Well, mixing and matching is about more than serif or sans-serif. Think about it like clothing - When you dress you want to create a balance between items of clothing that are similar and those that are very contrasted. The worst you can do is dress in, say, pink and red together - because they're almost close enough to match, yet not far enough apart to provide nice contrast.</p>
      <p>When pairing typefaces like this - if you even want to do that, one typeface is often enough - you want to think of each aspect of the types and see if they either move in the same direction/match or in very opposite directions/contrast nicely. The problem with Helvetica and Optima is that they're sort of moving in just slightly different directions: both are sans serifs with an idea of cleanness, yet they do it sufficiently differently to jar (like pink and red), at least to my eye.</p>
