      <p>I agree with Frode, and not just because I'm a starving designer. I used to be a starving photographer, too.</p>
      <p>Logos are not basic by any stretch of the imagination; it's not something you can learn in a weekend any more than you can master studio portrait lighting in a weekend. You might be able to make the strobes work properly, but as you know, it takes years to actually get beautiful results. And like great photography, a great logo looks effortless and natural, but these results are the product of serious study and practice and not just an eye for the beautiful.</p>
