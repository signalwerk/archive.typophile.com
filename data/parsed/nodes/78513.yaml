    <p>Thank you for your time to read my post and I am humbled before your expertise on typography. I would like to know what fonts are suitable for a name logo for website and business card. I like "skinny fonts," I don't know the proper family name for them. Ideally, I'd like them remain the same. Do you have any suggestions for a logo? My name "ronald NZ tan" is in Helveltica Neue 33 Extended and Optima nova was used in "PHOTOGRAPHER."</p>
    <p>I am novice when it comes to typography; however, I did my initial homework and I read on the internet that the suggested usage of fonts is a mix and match. Helvetica Neue is a sans serif and to make great design, it was suggested that I use a serif font in addition to the sans-serif.</p>
    <p>My previous branding logo was, ITC Bauhaus Light and my name appears in all lowercase, "ronald n. tan."</p>
