      <p>Ronald, I've been in your situation many times. A great solution for you would be a trade of services. The barter system is far too underrated these days but it's a great way for the arts in general to cross-pollinate.</p>
      <p>For example, when I was in school a graphic designer came to talk to one of my classes on several occasions. He said he was able to get a great long-term contract with a busy downtown restaurant by initially offering to trade services. It was a win-win for both of them-- he gave them great advertising and design solutions that brought more business to the restaurant; he got a long-term contract and free catering for his wedding.</p>
      <p>At any rate, what Frank and others have suggested may be your best bet. Get a designer to craft you a logo that will do the most for you. It's good that you are learning about typography and design and you should continue to do so. But for now utilize the skills of an expert in the field!</p>
