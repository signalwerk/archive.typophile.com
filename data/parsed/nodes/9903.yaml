    html: <p>For an overview of the number of languages spoken in India, see the <a href="http://www.ethnologue.com/show_country.asp?name=India">Ethnologue country report</a>. Note that linguists regularly disagree over what constitutes a language versus a dialect, so it is impossible to get an accurate count of languages per se. The most widely spoken language in India is Hindi, but in some provinces the majority language is likely to be something else. For instance, the Marathi language in Maharashtra, or Bengali in Bengal (and neighbouring Bangladesh). To my knowledge there are thirteen scripts used in India, including Latin and Arabic. Hindi and Marathi are written in the Devanagari script. Often, outside India, you will see packaging or local signage that reflects language and script of the dominant immigrant community or communities, and this may not be Hindi. In the east end of London, for example, you will see a lot of Bengali; in other places (including here in Vancouer) you will see a lot of Punjabi written in the Gurmukhi script.</p>
