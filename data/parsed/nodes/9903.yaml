    html: <p>It's for food packaging in Europe (flavour descriptor), so it's both for visual appeal and Native tongue. But primaraily the customers aren't going to be able to read it, but just in case they are Indian I want to make it say something sensible. Put it this way, you see people walking around with 'chinese' tatoos that mean nothing in reality, I don't want the embarrasment of this to happen especially on a mass produced product. I think i'll go with Hindu as it's the majority language in India and many indian peoples second language too.  Space is tight so this is a fair comprimise I feel.</p>
