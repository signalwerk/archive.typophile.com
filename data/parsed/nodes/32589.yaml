    <p>Hello,</p>
    <p>Due to the impending retirement of one of my colleages, Target Corporation in Minneapolis is looking for a full-time typesetter/typographer at corporate headquarters in Minneapolis, Minnesota.</p>
    <p>Our work is a combination of a significant amount of typography production for print advertising and the circular, as well as font purchasing, font management and font manipulation for the corporation and its vendors. </p>
    <p>Candidates should have a good eye for typesetting, a borderline OCD-like obsession with detail and the ability to work in a fast-paced environment with minimal supervision. </p>
    <p>If you or someone you know is interested in more information about this opening, feel free to contact me directly at kristin.dooley (add the little squiggle here) target.com.</p>
    <p>Feel free to pass the word!</p>
    <p>Thanks,</p>
    <p>Kristin</p>
