  html: |-
    <p>I'm trying to find examples of Logos that use simple shapes in place of one or more letters. Right now, all I've come up with is Esprit (the E is just three horizontal lines), and Avid (The A, V, and D, are triangles in the style of transport controls (play, rewind, etc.).</p>
    <p>Any other examples?</p>
    <p>thanks!</p>
