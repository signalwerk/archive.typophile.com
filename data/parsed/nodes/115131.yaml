      <p>That's their own font called Grotesk Alternate but <a class="freelinking external" href="http://t-wo.it/category/typography" rel="nofollow">not showcases</a>. It somehow mixes influences from <a class="freelinking external" href="http://typophile.com/node/53257" rel="nofollow">Mercator</a> and <a class="freelinking external" href="http://www.myfonts.com/search/Akzidenz+Grotesk" rel="nofollow">Akzidenz Grotesk</a>. Alternatives: <a class="freelinking external" href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Circular" rel="nofollow">Circular LL</a>, <a class="freelinking external" href="http://www.milieugrotesque.com/typeface-maisonneue" rel="nofollow">Maison Neue MG</a><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_3799.png"></div><p></p>
