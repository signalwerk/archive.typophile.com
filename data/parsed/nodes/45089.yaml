    <p>hi folks,</p>
    <p>it’s my first post here. i tried to use the search tool but as my questions are so general, it couldn’t return good answers.</p>
    <p>I am trying to create few fonts and see how it comes on a webpage. In this process, i have couple of questions... basic ones!!</p>
    <p>1. say I created fonts in a non-english language and used this font to develop a webpage. Now, when another person opens up this page, how will it be rendered on his machine? does he need to install this font?</p>
    <p>2. is there any association between a font and unicode characters? if yes, can you explain how are they related.</p>
    <p>3. Is my understanding correct here? Browsers don’t need any font installed on local machine to render unicode fonts? is it correct?</p>
    <p>By asking all these questions, i am trying to understand how this font gets rendered on local user’s machine if used in a webpage to increase the usability of fonts.</p>
    <p>please let me know. i may have asked wrong or a noob like questions but i hope it’d be fine.</p>
    <p>thanks in advance</p>
