      <p>The letterforms are <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/bickley-script/" rel="nofollow">Bickley Script</a>, but your sample appears to have been emboldened and stretched. You could perhaps produce the same by setting your text using Bickley Script in something like Adobe Illustrator, converting to outlines and applying a stroke to the path.</p>
      <p>Here is Bickley Script (manually stretched) in black layed over your sample (pink):</p>
