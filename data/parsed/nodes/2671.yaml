  html: <p>I am a design student working on my graduation thesis project. I plan to explore the development of a typeface that responds to variable factors of the user�s input. As a basic example, the weight or color of the face might change based on how fast it was entered by the user.  <br> <br>I am interested in researching existing typefaces that have unusual programming to see what precedents have been set. I�ve scoped out the experimental section here on Typophile and looked at �random� fonts such as Beowolf and Flipper. I would greatly appreciate any suggestions of other typefaces to look at, or books/articles/web sites that might be relevant to my project. <br> <br>Thanks, <br>Angela Wolak <br></p>
