    html: '<p>Angela, this is a great topic! And the links mentioned above already cover a lot of ground. <br> <br>The one caution I would state early on is this: be careful to keep functionality always in sight - avoid turning things into self-serving formal aesthetic exercises. <br> <br>BTW, the "g" in Analogue makes me think you should be designing type. <br> <br>hhp <br></p>'
