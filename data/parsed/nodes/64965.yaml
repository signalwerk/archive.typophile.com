      <p>Great suggestions (especially the windmill)! I wonder if you have a few more? I love them, but I am still looking for something that will go with the others a bit better. To me the bird house, flower, tree, rabbit, deer, butterfly all feel like an english countryside with a cottage on it (you know vintage, but fresh). I feel like it would be weird to add in something incongruous at this point. Like here are somethings that would work theme wise...but not with the letters I have:</p>
      <p>bicycle, frog, lilly pad (do you think I can get away with this as a water lilly for W???), bridge, picnic blanket...you see what I mean?</p>
      <p>thanks so much!</p>
