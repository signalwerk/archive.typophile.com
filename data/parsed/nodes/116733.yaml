      <p>This is Favorit/Teuton Text. German from 19th century. Wilhelm Woellmer foundry in Berlin. Specimen Peltzendorfer _Schriften Atlas (1898)_<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/FavoritAkaTeutonTextSM@pleltzendorfer1898_4009.jpg"></div><br>
      Nearly identical, Kirchengotische Schrift. Excellent quality digital version, Aeronaut by Georg Herold-Wildfellner for Face Type <a href="http://www.myfonts.com/fonts/facetype/aeronaut/" title="http://www.myfonts.com/fonts/facetype/aeronaut/">http://www.myfonts.com/fonts/facetype/aeronaut/</a><br>
      Don<p></p>
