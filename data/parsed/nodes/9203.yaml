    html: <p>The thing is, imvho, that I personally am not interested in paying for forum or for articles or news, even in this specialized field. This commercial approach works against what the net was originally about, back when it still was more BBS than WWW - global communication. I think a forum such as this or many others is something that CAN work for free... Serverspace is cheap and the PHP software is available as freewarem, after all. If I had to pay 20 $ for a bulletin board and a few articles, man... the stuff had better be DAMN good, seeing that there is so many brillant free stuff on design available on the net. I wouldn't mind paying if there was the option of regular downloads of exclusive font designs - like the critique fonts we see here, only as PS or TTF for download - and stuff like that, but other than that, I doubt that it'll work long-range. I have seen similar approaches in regard to comic book boards, and they all failed, because you can get similar or even the same kind of info for free elsewhere :-). </p>
