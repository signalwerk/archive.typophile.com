    html: "<p>Hrant, I think the quality is as it was when the site was free - you can remember that far back, right? <br> <br>So why now make a charge? Because we want to encourage fresh writing and publishing projects - and reward the contributors of that content. <br> <br>If you'll pay for industry insight - check out the article just posted from the type technology meeting in Heidelberg, you're not going to get more timely feedback. <br> <br>Objectivity? In the eye of the beholder I think. There are certainly some strong opinions expressed in many of the articles on the site - everyone's going to find something to disagree with, if that' what they want. <br> <br>If you visit the site check through the articles in the preview section, then you can make your own minds up. <br> <br>Three things are certain: <br> <br>As of today, I've never had a request yet for a refund on a subscription - but there's always a first time. Certainly many have used the free trial vouchers in circulation and then not takn out a full subscription. <br> <br>We're currently working on a project to sell content through micro-payment schemes - possibly selling articles for as little as 50p/75 cents a shot. If you can't bear to be parted from 20 quid. <br> <br>Fontzone is an ongoing project, it will get better as time goes on, the whole content of the site from the first day it was published back in 1996 is avaialble to all subscribers (as Neil alludes) - we have plans that are rapidly coming to fruition to add to the site from other archives - which are available no where else online. <br> <br>But there's no rush - watch and wait, when you're ready get your credit card out - I don't want anyone to be disappointed with what they've bought.</p>"
