    html: "<p>Hrant: <br><i>But we don't know who/how_many \"they\" are... So what must be your  <br>primary target -potential subscribers- has less motivation than otherwise.</i> <br> <br>I'm not goin to say who the users/customers are, if they want to do that, that's up to them. \"They\" have the same information you have right now on whether to subscribe or not. In fact, you went to Rome right? You had the opportunity to get a free trial 30 day subscription with a voucher that was in the goodie-bag. So you had the chance to see precisely what was there, given by me to you. <br> <br>You chose not to take that opportunity - not my problem. <br> <br>And Luc is not on any \"blacklist\" that I run or know of - why not ask him yourself? <br> <br>Tanya/Gerald - your call, I'm not trying to sell anything to you, if you want it, there it is, if you don't then don't. But one thing I can guarantee is that there's stuff at Fontzone that isn't available anywhere else on the web - likewise there's stuff at Luc's site, MS typography and Typophile that isn't available else where. <br> <br>As to seeing what you're going to get, as I pointed out before, go to the site, click on the \"previews\" link and there's something like 10-12 article - these are either the articles in full, or the first few hundred words. <br> <br>Additionally, as also pointed out, use the search functionality at the site, browse throught the listings (tip, anything with a \"folder\" icon next to it you can see view, anything in the previews section you can view). <br> <br>At the end of the day we charge for content - to pay the authors of that content. If you don't want to contribute to that scheme then that's your choice and I see no point in arguing against that. <br> <br>Right now on the web you've got a lot of content that's free one way or the other - I don't have a problem with that either, that's the choice of the authors. <br> <br>But one thing Fontzone certainly isn't is a \"links\" listing - the only simple link service you'll find is in the \"webfeed\" section, which is also \"free\" to use. Each and every article link on the site has a minimum 100 words behind it (the philosophy here is that if we can't write 100 words about it then it's just a \"link\" and we put it in the webfeed), the reality is that news articles are typically 3-400 words, and features are 500-5,000+ words. <br> <br>Essentially, I don't have a problem with any criticism in this thread because the answers to that criticism is on the site right now - and have been since January 2002. <br> <br>So, if I can help anyone see that better, I'm happy to do so, but I'm not going to ask people to endorse the site, nor give the names or numbers of subscribers. <br> <br>Perhaps Jared would let you know what his strategy is on the same subject - I'd be surprised if we disagreee by much.</p>"
