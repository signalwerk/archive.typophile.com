    html: "<p>&gt; Hrant has antagonized Clive for as long as I can remember. <br> <br>Actually, I make constant efforts to mend the relationship, but I suspect that doesn't serve his agenda. I just can't stand bullshit, especially in public. So I think it's the other way around, especially when you take into account all the anonymous attacks launched against me here. Are you looking the other way, perhaps? <br> <br>It all started maybe 4 years ago, on the OpenType list: I got tired of his rabid fanaticism, and stated that FontZone suffered from a lack of journalistic integrity. Instead of taking good advice, he promptly closed FontZone and dug a deeper trench. I just hope he's washing his hair every day. <br> <br>&gt; Clive has little patience for pirates <br> <br>There's a difference between having little patience and suffering from Downer Syndrome. Lumping me with people like Apostrophe can only come back to bite you. Please don't tell me you need treatment as well - I hope you simply don't know the real story. <br> <br>I fight piracy -not least in public- more than any of you. Just yesterday I alerted Emigre about a font way too close to one of theirs, from a major reputable font house. <br> <br>-- <br> <br>&gt; it's inappropriate. <br> <br>I fail to see how. I mean, at least *one* of them should be willing, right? Like what about one of the three Johns? This one here is willing to do it on Typophile, so he must be willing to put something on the FZ site as well. Come on, get to it! If I were a contributor* I would complain that you're not doing enough for my 25%. <br> <br>* Which even in an ideal world I would avoid: I don't like writing for an audience limited by affluence. BTW, you should also consider lowering your rate for poorer world citizens, like ATypI just did. <br> <br>hhp <br></p>"
