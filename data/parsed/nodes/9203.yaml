    html: <p>I am a subscriber to Fontzone, and it is easily worth the 20 pounds. There are a number of important articles there... especially some material about the more obscure CJK technologies and products. FontZone also gets news of certain font releases well before the public and the rest of the online type community. I will definitely continue my subscription (...which I believe may be running out soon... Clive?) <br> <br>Hrant has antagonized Clive for as long as I can remember. I'm not sure why, other than perhaps that Clive has little patience for pirates, which is fine by me. He's a good writer, he has lots of well-informed opinions, and I'm glad to know him.</p>
