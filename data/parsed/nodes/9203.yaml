    html: <p>OK, just to address a couple of issues. <br> <br>There are Fontzone subscribers that frequent Typophile - if they want to contribute to the thread I'll leave it up to them. As far as I'm concerned they are free to say what they want, positive or negative, I'm happy to see that discussion and won't feel badly about negative comments. My aim is to make the site better and better - I won't do that without getting feedback from the users. <br> <br>Endorsements? Well, I think they voted with their wallets - they're either subscribers or they aren't. Again it's up to them to say what they think rather than for me to put them on the spot. I think this is really what Stephen was looking for in the first place. <br> <br>On that aspect I can say that Johannes Gutenberg told me last night that he thought Fontzone was "Simply wicked". <br> <br>Private agendas. I think it's very important to remember that I'm not the only person who writes for Fontzone - off the top of my head there's something like 20 who have done so in the last year. <br> <br>I think it's also important to remember that none of us are omniscient or omnipresent (though obviously some will disagree). We can't cover every single type, book and software release - there are only so many hours in a day. <br> <br>I also think that agendas, whether you agreee with them or not, give strength to writing - otherwise what is written is merely sterile observation. <br> <br>On that point, I think that I could give good example of this at Fontzone... which even you might agree with. <br> <br>As far as Apple goes, I think this is the wrong forum, try <a href="http://forums.appleinsider.com" target="_blank">http://forums.appleinsider.com</a>. Blind faith!? Example? <br> <br>The micropayments thing isn't going to happen for a couple of months, at least, so don't hold your breath. <br> <br>Er, but I think we're getting way off topic as to what Stephen was asking, so I'll leave it up to subscribers to say what they want, if they want...</p>
