      <p>&gt; I don't think the 55+ demographic has that much<br>
      &gt; trouble with 9-10pt type. They've been reading that<br>
      &gt; (or smaller) their entire life.</p>
      <p>As we get older, changes in the eye make it more difficult to focus on objects that are very close (like a magazine). That's why many folks start using reading glasses or bifocals when they reach middle age. </p>
      <p>But even with proper glasses, reading for extended periods may be more tiring. And not all folks get proper glasses, due to vanity or cost or reluctance to see an eye doctor.</p>
      <p>And among folks a little older than that, you can get cataracts, macular degeneration, and other medical problems that can make reading even more difficult.</p>
      <p>If your magazine is aimed at 55+ folks, maybe around 11 point would be more comfortable. You might want to do some readability tests with folks in that age group.</p>
