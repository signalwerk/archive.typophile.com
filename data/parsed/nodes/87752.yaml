    html: |-
      <p>&gt; I'm thinking something with a narrow x width, to make up for lost real estate</p>
      <p>Narrowness doesn't necessarily result in economy, since paragraph<br>
      breaks waste much of the lateral savings; a wider font can be set<br>
      smaller and save space every line no matter the paragraph breaks.<br>
      So it depends on how "paragraphy" the writing is.</p>
      <p>That said, I believe that narrowness is feminine and classy, which<br>
      fits both your demographic sets. But it can also be harder to read,<br>
      especially for older people...</p>
      <p>To me it sounds like you need a somewhat narrow font that works<br>
      well around 12pt. And it might be good if it were a bit "expressive".</p>
      <p>hhp</p>
