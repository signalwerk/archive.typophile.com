  html: |-
    <p>My client is combing two magazines with 2 different sets of demographics. 20-40 women and 55+ They want to retain the lifestyle magazine look of the younger magazine, but bring in the older set. The font size was 9.5/13 Jansen which is obviously not going to work for the older set. </p>
    <p>To add another challenge the format is going down from letter size to 6"x9"...</p>
    <p>What text font would you recommend? I'm assuming I'll need to go with 11-12pt size. I'm thinking something with a narrow x width, to make up for lost real estate (maybe?)... but it needs to be readable.</p>
    <p>I'm using whitney sidebars etc.</p>
    <p>Thank you in advance for any advice you can offer!</p>
