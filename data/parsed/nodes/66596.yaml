  html: |-
    <p>Hi All,</p>
    <p>I'm rather new here and have to say that I an so thrilled to have found this community.  It's fabulous to have someone to talk to about type.  Most of my friends eyes glaze over if I even say the word :-b.</p>
    <p>I'm working on a logo for a client that supplies the jewelers trade.  I fell hard for Priori Acute and have them in love with it now as well.  I am now in the process of determining the font pairings and thought someone might have an opinion. </p>
    <p>I'll be setting a tagline as well as their name spelled out in full. Can't use Priori Acute for the full name as it will often appear small, for invoices and the like, and the sculptural beauty and playullness of it disappears at smaller point sizes.  </p>
    <p>The Eras Medium in the tagline is merely a style placeholder. I want something that  supports the type above, but does not compete with it.  something perhaps a bit approachable... any thoughts?</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/8_sfjs_logo_dev_3704.jpg"></div><p></p>
