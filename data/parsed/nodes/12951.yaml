    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a>: Ty Semaka</strong></p>
    <p>Calgary-based typeface designer and illustrator for <a href="/wiki/Image%20Club" class="freelinking" rel="nofollow">Image Club</a> in the early 1990s. Created the popular typefaces Lemonade and Mini Pics Art Jam for the Image Club Typeface Library. Currently tours with his band, <a href="http://www.thedevils.com/" rel="nofollow">The Plaid Tongued Devils</a> and gripes about how little he was paid way back when.</p>
    <p>Website:</p>
    <p><a href="http://www.tysemaka.com/" title="http://www.tysemaka.com/">http://www.tysemaka.com/</a></p>
