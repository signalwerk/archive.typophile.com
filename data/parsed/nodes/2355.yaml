    date: 2003-12-10T17:27:00
    date_raw: 10 Dec 2003 — 5:27pm
    votes: null
    html: "<p>Bj, I'm not sure whether we would be modern or not -  we are 14 singers who spend most of our time singing in the choir at St John's College, Cambridge. So there's a limit to how modern you can be. The previous logo (which uses ITC Tiffany) can be found <a href=\"http://www.joh.cam.ac.uk/gents/images/logo_trans.gif\">here</a>. <br>I was trying to get away from the staid image slightly, as it's not ideal for promotional material. <br> <br>The latter logo was an attempt at a more professional look, but it is not engaging. Anyone have any ideas for typefaces that would suit? <br> <br>Colour scheme: mostly red with 90% red, 10% white, black stripe through white. <br>In practice the logo would want to be either red or black. <br> <br>Matthew</p>"
    html_clean: "<p>Bj, I'm not sure whether we would be modern or not -  we are 14 singers who spend most of our time singing in the choir at St John's College, Cambridge. So there's a limit to how modern you can be. The previous logo (which uses ITC Tiffany) can be found <a href=\"http://www.joh.cam.ac.uk/gents/images/logo_trans.gif\" class=\"link-external\">here</a>. <br>I was trying to get away from the staid image slightly, as it's not ideal for promotional material. <br> <br>The latter logo was an attempt at a more professional look, but it is not engaging. Anyone have any ideas for typefaces that would suit? <br> <br>Colour scheme: mostly red with 90% red, 10% white, black stripe through white. <br>In practice the logo would want to be either red or black. <br> <br>Matthew</p>"
