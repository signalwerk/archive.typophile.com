    votes: null
    html: "<p>Mathew: <br> <br>I like the general concept of the first design, but the execution needs a lot of work. I'm not sure if that's an off-the-shelf unicase font or not, but most of those letters just aren't working together. Also, I agree with Daniel in regard to downplaying the \"the/of\" connectors. <br> <br>My initial thought with this type was to loosen it up and juxtaposition each of the letters so they look like dancing letters, but that doesn't really go to well with \"sacred music\". <br> <br>The strong, tight verticals in this type actually remind me of a line of chior singers. Maybe use musical notes to make the letters sing, or actually morph the letters (or some of them if it's a small group...i.e. John) into the chior singers. <br> <br>Keep working. I'm sure you'll come up with something that works.</p>"
    html_clean: "<p>Mathew: <br> <br>I like the general concept of the first design, but the execution needs a lot of work. I'm not sure if that's an off-the-shelf unicase font or not, but most of those letters just aren't working together. Also, I agree with Daniel in regard to downplaying the \"the/of\" connectors. <br> <br>My initial thought with this type was to loosen it up and juxtaposition each of the letters so they look like dancing letters, but that doesn't really go to well with \"sacred music\". <br> <br>The strong, tight verticals in this type actually remind me of a line of chior singers. Maybe use musical notes to make the letters sing, or actually morph the letters (or some of them if it's a small group...i.e. John) into the chior singers. <br> <br>Keep working. I'm sure you'll come up with something that works.</p>"
