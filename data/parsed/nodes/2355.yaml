    html: <p>Matthew, in the first version the J (in John's)looks so strange, its visually out of sinc with the other characters. I'm also not loving th Of combination. I do like making connectors like (the and of) less important than the group title. Overall the first version feels forced. The second version gives me no emotional feeling at all. Think about using a symbol with the title. Are they a part of a religious order? How many gentlemen are they? If its a few maybe show their faces? So far I think you could use the same type and say John Deere Tractors, I'm not getting music or singing.</p>
