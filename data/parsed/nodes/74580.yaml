    html: |-
      <p>If you tell us what you want to use it for, perhaps we can offer some suggestions. Most projects won’t require a full family either, so that might lower the cost for you. You can’t purchase single weights of Akzidenz Grotesk, but a lot of other foundries will let you with their fonts. </p>
      <p>When I hear people say “I am not willing to pay $$$ for fonts!” I suspect they’ve grown custom to the idea that fonts aren’t valuable. A typical font collection (among freeloaders) might consist of thousand of fonts. The thought of paying for all that seems daunting at first, but great designers don’t become great because they have a lot of fonts.</p>
  - id: 431149
    user_id: 16911
    user_name: Florian Hardwig
    user_path: null
    date_raw: 25 Sep 2010 — 5:57am
    date: 2010-09-25T05:57:00
    votes: null
    html: |-
      <p><cite>And fonts are extremely expensive. </cite></p>
      <p>No. Some might have a higher price tag than others, but they are almost always worth the expense.</p>
      <p><a href="http://new.myfonts.com/fonts/urw/grotesk/?refby=mfde" rel="nofollow">URW Grotesk</a> is an often overlooked alternative from the same genre. You can pick single weights for $19.95, or <a href="http://new.myfonts.com/fonts/urw/grotesk/urw-grotesk-t-regular/buy.html?refby=mfde" rel="nofollow">license the whole thing</a> (59 fonts!*) for as little as $99.</p>
      <p>*) That number is bloated, as small caps come as separate fonts. There are both italics and obliques for some weights (you don’t need the latter), and certain styles seem –&nbsp;apart from the spacing –&nbsp;identical to me (see Condensed Light vs. Condensed Extralight). Also, the characterset might not be up to par with recent OpenType releases. Still, you get a pretty decent and versatile Grotesk workhorse, for a small budget.</p>
