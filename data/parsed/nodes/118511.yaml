    html: <p>And, InDesign not applying true small caps using the Small caps button sadly is the way it's designed, so nothing your or any other font can change.</p>
  - id: 585047
    user_id: 82305
    user_name: Joshua Langman
    user_path: null
    user_image: /files/pictures/picture-82305.jpg
    date_raw: 6 Aug 2014 — 7:49am
    date: 2014-08-06T07:49:00
    votes: null
    html: <p>InDesign does apply true small caps when you push the small caps button if the font has them. If not, it makes fake ones. You can specify what size the fake small caps are generated at in preferences. If you set the preference to 100% (full size), the button will never fake the small caps if they aren't in the font.</p>
