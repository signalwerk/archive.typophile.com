    <p>Hello! Someone in here can help me with Glyphs?? I'm adding the small caps to my font, but actually it's the first time i do this so (this is also my first font), I'm having some troubles: InDesign doesn't make the change of letters when I use the Small Caps button, just from the OpenType window and it works only on the capital letters; and, I dont know neither how to set the case sensitive signs in open type  what suffix do I need to put on my glyphs and which Open Type function works for that?<br>
    I hope someone can help me with this problem  greetings from Mexico!</p>
