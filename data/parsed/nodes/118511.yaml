    date: 2014-08-06T08:28:00
    date_raw: 6 Aug 2014 — 8:28am
    votes: null
    html: <p>It looks like I use an outdated version of ID. Glad to hear it's been fixed.</p>
  - id: 585081
    user: 909
    date: 2014-08-06T14:48:00
    date_raw: 6 Aug 2014 — 2:48pm
    votes: null
    html: |-
      <p>InDesign has done this since version 1.0 back in the year 2000.</p>
      <p>However, the small caps button only invokes 'smcp' to turn lowercase into small caps. Caps to small caps ('c2sc') requires the sub-menu selection. The "all small caps" option does both.</p>
