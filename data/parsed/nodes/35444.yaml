      <p>Sam M,</p>
      <p>A buckle is perfect. That may actually be what it was used for. But the art director never told me.</p>
      <p>Joyce T.,</p>
      <p>Thanks for the comment. You are right about the T. Am sure I had experimented with closing the right base serif of the T with the E, but didn't do it. The logo was done on spec, so it was a rush to get the thing done. What a nightmare to balance feinschmecking detail with the overall look! You have a great eye. After twenty years, I wouldn't have made that observation. And even now I don't remember the type this hand lettering was based on.</p>
