      <p>Nice typeface, the only comment I would have is the "T" should NOT be seperated by a line, as all other text is clearly joined without any interruption. Other then that it is a unique engraved looking style of text. I most definitely could see that being used for a Texan Bar or restaurant, or as a branding iron. It is reminiscent of the old days.</p>
      <p>~Joyce.T.~</p>
