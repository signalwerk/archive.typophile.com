  html: |-
    <p>I’ve noticed that the letter C is employed in a rather redundant manner these days. With K doing such a nice job for the soft C sound, who really needs C? We already have S for that. </p>
    <p>Should I include a C in my fonts in the near future, or should I leave him out?</p>
    <p>I think, I think so.</p>
