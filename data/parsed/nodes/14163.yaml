      <p>Minuscule. It's still legible in 3pt size due to the designer's awareness on inkspread and legibility issues. I've seen printed samples, i.e. Thomas Huot-Marchand has put together all 30-something pages of "Physiologie de la lecture et de l'ecriture" by Emile Javal on one DIN A4 sheet.<br>
      Minuscule is still being fine tuned afaik. It will be available "at the end of summer" at <a href="http://www.256tm.com/" rel="nofollow">http://www.256tm.com/</a><br>
      A sample of the 2pt "Minuscule deux" (or was that the 3pt? correct me if I am wrong) can be found <a href="http://www.themicrofoundry.com/other/Javal_b.gif" rel="nofollow">here</a>.</p>
