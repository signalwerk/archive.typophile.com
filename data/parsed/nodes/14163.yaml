      <p>As far as i know, CD's are still printed using screen-printing processes, which in my past experience means relatively low resolution and lots of choking and bleeding. I would suggest<br>
      converting the final type to paths and make mods to compensate, ie. ink traps and opening the counters a bit.</p>
