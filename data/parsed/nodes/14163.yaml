    <p>neither having a typometer nor a printer with me at the moment,<br>
    i am wondering if anyone could tell me the minimal legible size for printed<br>
    serif fonts and sansserif fonts. i know that it really depends on the typeface,<br>
    and it is extremely relative, but i need to put copyright (all rights reserved ......)<br>
    info on a CD design (onto the actual CD - using AG Book Rounded, either Regular or Medium) and want<br>
    it to be tiny but still legible..... is 2 points too small? maybe 3 points?</p>
    <p>thx!!</p>
