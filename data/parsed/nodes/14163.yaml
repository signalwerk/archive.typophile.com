      <p>I have a cd on my desk that has 5pt Helvetica Roman reversed out of black which is just readable but it is not very reader-friendly and my copy of Illustrator 9 has what looks like 4pt in a condensed sans which is surprisingly good. I suppose the primary questions are how many colours you are printing, what print process you are using and what surface the cd has in the first place.<br>
      Tim</p>
