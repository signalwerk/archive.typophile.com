      <p>Is there no way to let "it" tell me which glyphs it's missing? It seems ridiculous that I have to check all glyphs while it very well knows where things are going wrong. FontLab and their vague error messages...</p>
      <p>I know that when you add glyphs to OT while they're not actually in the font, FontLab will ask if you want to create these extra glyphs. Why can't it do that now?</p>
      <p>Where can I get the feature file? I forgot.</p>
