    html: |-
      <p>In FontForge when you do "File -&gt; Merge Feature info" and font is missing some glyphs listed in .fea file these glyphs are automagically created. New created glyphs are - of course - empty and no warning is created.<br>
      "Where can I get the feature file? I forgot."<br>
      In "OpenType" window, OpenType menu, Save Features.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/OpenType_3594.jpg"></div><br>
      Edit:<br>
      And ( <a href="http://sourceforge.net/adobe/aglfn/wiki/AGL%20Specification/" title="http://sourceforge.net/adobe/aglfn/wiki/AGL%20Specification/">http://sourceforge.net/adobe/aglfn/wiki/AGL%20Specification/</a> ):<br>
      "All glyph names a subject to a length-limit of 31 characters in some current software implementations, and require that they be entirely composed of characters from the following set: A–Z, a–z, 0–9, . (period, U+002E; FULL STOP), and _ (underscore, U+005F; LOW LINE)."<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Glyph_4851.jpg"></div><p></p>
    html_clean: |-
