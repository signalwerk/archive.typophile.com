    html: <p>Thanks a lot. I found the mistake simply by compiling in the OpenType section and FontLab told me the iring (obviously) doesn't exist. I copied other strings of accented characters (in this case probably the u-accented characters) into the class for the i-accented characters and simply replaced the starting letter so I don't have to retype 'circumflex' and all that and forgot to remove the iring.</p>
