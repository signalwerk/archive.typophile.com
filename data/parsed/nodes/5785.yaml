    html: "<p>Nigel Hamilton wrote:  <br> <br><i>\"If you search the German Trademark online database you will discover that H. Berthold's trademark Akzidenz-Grotesk was assigned in 1998 to Berthold Types Limited so there was a successor to the type assets. \" </i> <br> <br>Nigel,  <br> <br>Your <i>pars-pro-toto</i>-style of concluding is inadequate and pre-mature. What you have written perhaps suggests that there was a successor to the <i>trademarks</i> in the type assets, but not to the type assets in its entirety. My understandins is that <i>type assets</i> include designs, digital data and trademarks. To my best knowledge, Berthold Types Limited never obtained the entirety of type assets of H Berthold AG, which was recently confirmed by [rot13]Uneirl Uhag[/rot13] on Typophile.  <br> <br><i>\"If you are correct that Linotype had a license agreement and if they used Berthold artwork for digitization then it should not sell Akzidenz-Grotesk under any name. \"</i> <br> <br>Linotype used old H Berthold AG's artwork for digitization of the typeface. However, note that there is currently no copyright owner on the design of Akzidenz-Grotesk even in Germany. The design was created more than 100 years ago for a now defunct company. The copyright has expired and there is no current owner. Berthold Types Limited did not \"inherit\" the copyright for the design.  <br> <br><i>\"One other important point that I neglected to mention. Linotype sold Akzidenz-Grotesk under one (Adobe) or two (H. Berthold AG) license agreements. One of the fundamental aspects of trademark law is that if you take a license for something you are prevented from challenging that which you licensed. \"</i> <br> <br>You seem to be ignoring the fact that trademarks are one thing and designs are another thing. While in the U.S. copyright does not generally apply to typeface designs, in the E.U. it does, or at least may. Speaking in European standards, and according to the Berne convention, the design of (the basic cuts of) Akzidenz Grotesk is public domain, the authors have been dead for a very long time and the company which marketed the designs is no more. The additional weights that have been created later by G.G. Lange may still be subject to copyright and they are not marketed by Linotype as \"Basic Commercial\".  <br> <br>Adam</p>"
