    html: '<p>This is my understanding of the situation: <br> <br>Linotype (D. Stempel AG) signed a license agreement with H. Berthold AG  <br>on Akzidenz Grotesk in 1977 and sells its versions of this typeface  <br>since then. No other existing type foundry has a longer, unbroken  <br>history on this typeface. <br> <br>H. Berthold AG reported insolvency in 1993 and ceased to exist. This  <br>company has no legal successor. <br> <br>There is no designer on Akzidenz Grotesk to be credited. The design  <br>goes back to 1896, It is now a classic just as Bodoni, Garamond and  <br>others are. Linotype digitized its own version. <br> <br>Berthold Type Ltd., Chicago, received US Trademark  <br>registration on "Akzidenz Grotesk" on February 1st, 2000. <br> <br>After this, Linotype was forced to stop using the name "Akzidenz  <br>Grotesk". Linotype decided to invest time and money on other projects rather <br>than on another legal battle with (name withheld). Consequently,  renamed the <br>fonts: "Basic Commercial".</p>'
