    html: <p>Book Antiqua looks almost exactly like Palatino, was made deliberately as a Palatino clone to avoid licensing restrictions, was made while the designer of Palatino was alive and working. <br> <br>Avenir does not look much like Futura (the bowl-stem connections follow the same model, but the proportions of the letters are very different), was not made as a deliberate clone, was made after the death of the designer of Futura.</p>
