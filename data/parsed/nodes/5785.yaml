    html: "<p>First of all, Linotype is well aware of its own rights and legal satanding, and does not need to officially respond to your statements on this forum, which as Yves pointed out, are deliberately troll-like. While they do not need to officially respond. I personally  feel differently. I cannot understand how you can possibly agree with the statements you have entered here. Linotype, as a company, is not the one posting derogatory comments on several different web sites. It was you who started this discussion by trying to paint Linotype's Avenir Next in a false light. As I have recently designed a few promotional pieces for Avenir Next, I feel that your comments are a deliberate questioning of my ethical allegiances. I responding out of my own accord. I would not design type samples for stolen designs. <br> <br>However, the post that I made earlier this morning WAS slightly influenced by Linotype. Your defending of Berthold is a reiteration of a tired argument over the nature of that company. Linotype did assist me in a preliminary search of German trademark records. This preliminary search proved no apparent results for a Trademark on Akzidenz. The new Berthold DOES have many trademarks registered in Germany, however, I could not see AG on the list. Therefore, I am asking you directly to back up your statement, which I think is perfectly logical. I would do the same. If AG is registered here, Linotype would like to know that. As far as it is concerned, AG is not registered here at all. I am not denying Berthold's right to sell Akzidenz Grotesk. I also did a bit of asking around about Basic Commercial, since its provenance was specifically asked about. Again, for the last time, I am not a lawyer or spokesperson for the Linotype Library. I was, however, hired because in part because I am a native speaker (of English). I wrote the last post beacause I can write better English than most of the employees in the company (although I personally think that my writing is terribly awful! If I could be more concise, this argument would be over). If you would like to continue this discussion in German, I'm sure that you would get some interesting responses. <br> <br>As far as I am aware, there will be no \"official statement\" from Linotype, because my above points are correct, and Linotype has nothing to hide. <br> <br>Besides, as far as I know, \"official statements\" are really something for the lawyers. None of us here are lawyers. Ideally, we would all friends talking about the things we love most. <br> <br>Eurostil: On our website, it states that Eurostile is a registered trademark of Nebiolo. I do not know anything further about its case, however, Linotype would not register anything with anyone if it were a violation of any of its standing contracts. <br> <br>First you brought up Avenir Next in an attempt to paint Linotype in a bad light. No one held your argument for valid that Avenir is a Futura rip-off. Then you brought up Basic Commercial, which is not illegally sold (or named) either. Now, you are offended by some sort of purported moral violation on behalf of Eurostil. You seem to be grasping for straws.I am finding it difficult to maintain an appropriate level of coordial dialogue under these circumstances.</p>"
