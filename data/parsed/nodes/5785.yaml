    html: "<p>Nigel, this quote that you keep referencing is not even Linotype's main marketing push behind Avenir. This line appears on the inside cover of the broschure. It is not the \"tagline\" of the font family, just a quote from the designer himslef that is quite liked. Put this into perspective: Adrian Frutiger is one of the world's most respected type designers, living or dead. To insinuate that he is a font pirate is unfair. <br> <br>Linotype does sell basic commercial in its webs shop. The font description clearly states that it is based on the design of AG. I do not know anything about its design, but Linotype is not trying to cover up, or deny the existence of AG, or Berthold's right to sell it. BC is not a copyright infringement of their work in any country or jurisdiction. <br> <br>I hope that my views and opinions do not sound excessive. Although I am an employee of Linotype, I am not expressing any sort of official sentiments in my posts. This is all personal. To further elaborate, I will cease being an employee of LL on Sunday, as my German work permit has temporially expired. However, I would have gladly responded to your mis-formed opionions in the same fashion before I worked here, or knew any of its employees. And I can guarantee you that I will be just as feisty on Monday, because your viewpoint on Avenir is too complexly silly for me to possibly understand.</p>"
