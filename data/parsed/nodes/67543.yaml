      <p>This caught my eye as I have struggled for my entire career in design with the stereotypically shy-designer personality. I've questioned why I am in this industry with so many people who are "shy" or reserved. I have rarely been friends with shy people in general and it has been a source of disappointment and loneliness in the industry. My wife was shy as a child and young-adult and made the transition from shy to "I don't care what people think of me anymore". Had I met her in her shy state - I never wouldv'e even pursued her.</p>
      <p>I have learned from shy people to give people their space but it's mostly aggravating to me to work with designers with this personality - or I would say mentality. Admittedly though, I have my fears that make me hesitant to confront mean people for example.</p>
      <p>SO...if you're looking for the opposing personality of "outgoing" - I'd be happy to contribute.</p>
