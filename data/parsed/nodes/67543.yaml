      <p>Interesting topic.</p>
      <p>I'm really interested in what was mentioned earlier about being shy around designers. I avoid contact with designers most of the time, because I think that among those of us who are younger, most people who are confident talking about design, their work, etc. are insufferably self-important. That seems to change as people make their way through their thirties, though.</p>
      <p>In Portland, anyone who calls himself an artist can open a show at a bar or coffeehouse, and anyone who calls himself a designer can find modest work with young people who call themselves entrepreneurs. There's a lot around here to offend the eyes, but I think some of these young, overinflated amateurs might have more potential for growth than those of us who submerge ourselves in our own hangups.</p>
