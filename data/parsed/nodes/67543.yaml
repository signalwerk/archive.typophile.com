      <p>shy + youth = cute. shy + older = odd/eccentric. i would agree with tell who said 'I'm extremely shy until I get to know people. Then I'm pretty much unbearable.' i guess it has to do with initially a fear of rejection - wanting to be accepted by strangers and not wanting to be rejected by 'friends.' i suppose a lot of it just boils down to perceptions of ourselves and others. i think we live in a much more openly critical society made even more so by the anonymity of the internets and the freedom it brings to criticize without being known. but i think it also helps shy people find kindred spirits and makes them more open in the process. but i think even shy people make themselves functionally socialable especially when having to interview for a job or otherwise deal with the challenges of life.</p>
      <p>the only place i really socialize with other designers is on the internet. even here i don't really post alot, so i guess that would equate to being shy i suppose. i don't make my living as a designer, but i have designed a few fonts and engaged in discussion about them with other designers (over at fontstruct.) perhaps, it's understood you mean professional designers vs. 'hobbyists' i suppose.</p>
