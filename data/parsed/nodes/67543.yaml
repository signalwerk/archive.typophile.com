      <p>This made me smile... you're showing up everywhere these days.</p>
      <p>I think being shy isn't especially conducive to the highly-social needs of the design practitioner... Especially for freelance people. If it is indeed '...who you know', and  your pool of design contacts is a shallow one, then you really have to create a different gauge for how you measure success.</p>
      <p>Polite is sometimes interpreted as timid or a self-confidence issue by a client, teacher or employer, and unfortunately, it can make every piece of concept work you produce, a hard sell.</p>
