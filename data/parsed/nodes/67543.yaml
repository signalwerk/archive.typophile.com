      <p>Jackson: <em>Shy people are boring.</em></p>
      <p>To name a few, the composers Robert Schumann, Anton Bruckner, Franz Schubert and Pyotr Illich Tchaikovsky were shy –but definitely not boring. About the last named you can find the following piece of text on <a href="http://www.pianosociety.com/cms/index.php?section=51" rel="nofollow">Piano Society</a>:</p>
      <p>[...] About this time Tchaikovsky started a relationship with a wealthy widow, Nadejda von Meck, who became his patron for the next fourteen years. She was forty-six and the mother of seven. She offered to subsidize Tchaikovsky with the proviso that they never meet. During their voluminous correspondence she wrote, "...I fear your acquaintanceship. I prefer to think of you from afar, to hear you speak in your music and share your feelings through it." This of course was a perfect situation for the morbidly shy composer who wrote back, "You are afraid you will fail to find in my personality all those qualities with which your idealizing imagination has endowed me. And in that you are quite right." When they once met face to face at a concert, not a word was spoken as they turned away in embarrassment. [...]</p>
