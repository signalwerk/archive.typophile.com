      <p>...this has got me thinking. Often, I tend to perceive shyness in people I meet as something very different from coyness or politeness or discomfort with crowds or awkward / unchoreographed social situations, etc. Initial "shyness" in, say, a social situation involving group conversation among or with unfamiliar people is a different order from a shyness that makes someone utterly unable to share and connect with friends / companions.</p>
