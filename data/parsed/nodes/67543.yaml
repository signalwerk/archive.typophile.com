      <p>Qualities such as shyness/boldness have no special relevance for design.<br>
      It's no different than for any other profession where individual practitioners may be required to participate in social situations.<br>
      Whatever one's comfort level is in dealing with other people, one tries to find it.</p>
      <p>Having said that, I must admit that I went into design, rather than art, because I didn't like the way that artists' privacy is compromised by their art. I believed that in design, one's work speaks for itself, not requiring other people to know anything about its maker's background or psychology in order for it to be effective, understood and appreciated.</p>
      <p>However, it didn't work out quite that way for me as a type designer, and self-promotion has become part of my business strategy, for various reasons. </p>
      <p>I have the greatest respect for those who manage to be successful while staying out of the limelight.</p>
