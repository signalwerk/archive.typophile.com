      <p>I'm shy and that certainly makes my job more difficult. I find myself preferring to work with out-of-town clients, since I communicate with them mostly by email and phone, rather than in person.</p>
      <p>Shy designers may be more likely to present "safe" ideas to clients, to avoid disagreements.</p>
      <p>I've read that Afred Hitchcock was quite shy and would go to great lengths to avoid one-on-one disagreements with anyone. You'd think that shyness would be a big disadvantage to a movie director, as that job requires interacting with many people, often in high-pressure situations, but he certainly pulled it off.</p>
      <p>I once heard actor Charlton Heston tell an interviewer that he was actually very shy. The interviewer said that Charton didn't seem shy.  Charlton's serious reply was that he handled shyness by doing interviews as if they were acting jobs -- he was acting like a non-shy version of himself.</p>
