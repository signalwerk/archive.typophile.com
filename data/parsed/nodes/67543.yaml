    html: <p>I don't think being shy is a problem for a designer when doing the work. I think it may become an issue when presenting the work or interacting with committees to sell or present the work. Too often a perceived sense of confidence in ones own work wins out over the actual work. The work SHOULD speak for itself but in an approval by committee situation, it is rarely enough. Committee members need to show their presence or even save the day for the bosses eyes so they may make comments for show rather than for real. It is harder for a shy person to redirect the group back to the logical path while allowing each viewer to "earn their keep". Good design should always triumph but sadly, good presentation is more often needed to show what is good about the design.</p>
