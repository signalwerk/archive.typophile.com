      <p>I'm shy about talking to anyone in the design profession. I'll email but I have trouble talking on the phone or meeting other designers. Kinda freaks me out. If you're a designer and you've spoken to me it's a rare thing. When I go to Typecon I generally hang out in the back and keep to myself. If you've spoken to me at a Typecon it was probably the only conversation I had with someone at Typecon that year.</p>
      <p>When I do have a shop-talk kind of conversation with a designer I generally don't know what they're talking about. I don't know the names of many people who make fonts or the politics. I'm really just into the fonts themselves; I'm not so much into the back-story.</p>
      <p>I'm not normally like o shy; I think with non designers I'm totally fine. I used to be in the videogames business and I never felt weird about meeting other people in the profession. I wouldn't call myself a generally shy person, just with other designers.</p>
    html_clean: |-
