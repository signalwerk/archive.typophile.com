    <p>I need to create a vector of this for color separations:</p>
    <p><a href="http://image.opencartguru.com/cache/data/gettrx_logo-702x702.png" title="http://image.opencartguru.com/cache/data/gettrx_logo-702x702.png">http://image.opencartguru.com/cache/data/gettrx_logo-702x702.png</a></p>
    <p>But I can't figure out the font that was the base for GLOBAL.</p>
    <p>I can redraw most of the characters by hand, the L and A definitely, the G and O moderately well, but I can't do the B...</p>
    <p>So does anyone have an idea of something close to work from, or what it most likely started as?</p>
    <p>Thank you!</p>
