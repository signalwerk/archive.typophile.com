    <p>newsletter: <a href="http://www.type-together.com/newsletters/2010-10.html" title="http://www.type-together.com/newsletters/2010-10.html">http://www.type-together.com/newsletters/2010-10.html</a></p>
    <p>NEW RELEASE<br>
    Crete Rounded... exclusively for web use</p>
    <p>Crete Rounded is a tailored version of Crete created specially to serve as corporate typeface for the upcoming type design competition Letter.2. Veronika Burian, the original designer of this award winning typeface, modified terminals and serifs to create two new fonts that deliver a more contemporary and functional appearance than the original Crete. Furthermore, the new styles proved to be surprisingly efficient for web use. For the time being, TypeTogether is making it available exclusively through our webfonts partners.</p>
    <p>GET CRETE ROUNDED AT FONTDECK: <a href="http://fontdeck.com/typeface/crete" title="http://fontdeck.com/typeface/crete">http://fontdeck.com/typeface/crete</a><br>
    GET CRETE ROUNDED AT TYPEKIT: <a href="http://typekit.com/fonts/crete-rounded-web" title="http://typekit.com/fonts/crete-rounded-web">http://typekit.com/fonts/crete-rounded-web</a><br>
    ALSO COMING SOON AT WEBINK (<a href="http://webink.com/" title="http://webink.com/">http://webink.com/</a>) AND FONTSLIVE (<a href="http://www.fontslive.com/" title="http://www.fontslive.com/">http://www.fontslive.com/</a>)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CreteRounded_3646.jpg"></div><p></p>
    <p>SPECIALS<br>
    Buy a font, get a free gift from pixmac</p>
    <p>With your font purchase you receive 5 credits at our partner pixmac.com. Pixmac is an extensive stock photography and vector illustrations bank that already carries over 11 million images.</p>
    <p>VISIT PIXMAC: <a href="http://pixmac.com/" title="http://pixmac.com/">http://pixmac.com/</a><br>
    BUY FONTS NOW: <a href="http://www.type-together.com/catalogue" title="http://www.type-together.com/catalogue">http://www.type-together.com/catalogue</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pixmac_4600.jpg"></div><p></p>
    <p>NEW RELEASE<br>
    LFT Etica Italics</p>
    <p>The beautifully crafted sans serif LFT Etica, designed by LeftLoft Studio in Milan, has now a full set of italics for all of its weights. Aesthetically resting somewhere between a grotesque and humanist sans serif LFT Etica successfully combines masculine force with female delicacy. At the same time it delivers a striking appearance without compromising legibility.</p>
    <p>SEE MORE: <a href="http://www.type-together.com/LFT%20Etica" title="http://www.type-together.com/LFT%20Etica">http://www.type-together.com/LFT%20Etica</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/EticaItalics_5510.jpg"></div><p></p>
    <p>WEBFONTS<br>
    TypeTogether for everyone</p>
    <p>We have received many queries about using our typefaces on websites and we want to make sure all of our customers have all the necessary tools to work on a wide range of media. Hence TypeTogether has partnered up with four trusted companies that are able to reliably serve our fonts for your websites and provide you with the necessary technical support. We invite you to check out their website and start enjoying TypeTogether's fonts on the web.</p>
    <p>FONTDECK: <a href="http://fontdeck.com/foundry/typetogether" title="http://fontdeck.com/foundry/typetogether">http://fontdeck.com/foundry/typetogether</a><br>
    FONTSLIVE: <a href="http://www.fontslive.com/catalog/?ff=59" title="http://www.fontslive.com/catalog/?ff=59">http://www.fontslive.com/catalog/?ff=59</a><br>
    TYPEKIT: <a href="http://typekit.com/foundries/typetogether" title="http://typekit.com/foundries/typetogether">http://typekit.com/foundries/typetogether</a><br>
    WEBINK: <a href="http://webink.com/" title="http://webink.com/">http://webink.com/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/webfonts2_4188.jpg"></div><p></p>
    <p>INTERVIEW<br>
    Veronika on Typeradio</p>
    <p>The TypeRadio crew interviewed Veronika Burian at the European Design Awards in Rotterdam earlier this year. They talked about TypeTogether, Veronika's beginnings in typography, and the position of the female type designer nowadays and many other interesting topics in this 18-minute podcast.</p>
    <p>LISTEN TO IT NOW: <a href="http://www.typeradio.org/loudblog/index.php?cat=Burian,Veronika" title="http://www.typeradio.org/loudblog/index.php?cat=Burian,Veronika">http://www.typeradio.org/loudblog/index.php?cat=Burian,Veronika</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typeradio_4486.jpg"></div><p></p>
    <p>COMPETITIONS<br>
    Student Type Design Competition</p>
    <p>Veronika was invited to be part of the jury, together with Pilar Cano, Barbara Kęsek-Bardel, Robert Oleś and Kuba Sowiński, in the international student type design competition. It is being organised by the Polish New Art Foundation ZNACZY SIE to commemorate the birth centennial of Czesław Miłosz - a poet, writer, translator and Nobel Laureate. All currently enrolled undergraduate and graduate students are invited to participate.</p>
    <p>VISIT THE WEBSITE: <a href="http://znaczysie.pl/pl/wydarzenia/aktualnosci/" title="http://znaczysie.pl/pl/wydarzenia/aktualnosci/">http://znaczysie.pl/pl/wydarzenia/aktualnosci/</a></p>
