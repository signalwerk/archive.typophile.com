      <p>Of the three I prefer the 1st one, although like Jonathan I'm not sure exactly how to read it. I think reversing it out, as apankrat suggested, has possibilities and may lead to a stronger graphic.</p>
      <p>The proportions of your logo — very wide relative to the height — may lead to legibility problems in situations where the logo needs to fit into a small space, as you'll end up with tiny type.</p>
