      <p>Definitely not B and not C. Too busy. The A option is Ok, but the (b) again looks a bit forced and unbalanced. At the very least I would try and match the curvature of the brackets ends' to the b's bottom curve, and add a bit more padding on b's sides.</p>
      <p>Alternatively, have you considered something simpler, like so:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/beemblematic_5811.png"></div><br>
      <code></code><br>
      Round the square too perhaps.<p></p>
      <p>(edit) Oh, may be even just stack b on top of first e of emblematic? I think your choice of typeface gives the logo plenty of character already, just need a little something extra to make it stand out a bit more.</p>
      <p>(another edit) - why not try option C but drop the brackets?</p>
