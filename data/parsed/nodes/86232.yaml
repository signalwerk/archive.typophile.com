      <p>If the original poster is trying to stay away from common typefaces, I'd suggest not using Helvetica Condensed. </p>
      <p>Try spending some time at Fontshop or Myfonts and test out different typefaces. It would break from the mold to use a serif face (or, for that matter, anything that isn't a geometric sans), for a museum identity. </p>
      <p>That's my 2¢</p>
