    html: <p>I wouldn’t be surprised if they used a Caslon italic and <br>replaced the ‘v’ with the italic from another serif feeling <br>that the Caslon ‘v’ is too ‘u’.  <br><br>Amd it needn’t be rough. Check out the Caslons at <a href="http://www.myfonts.com/Search?searchtext=caslon&amp;refby=typographica" target="_blank">MyFonts.com</a>.</p>
