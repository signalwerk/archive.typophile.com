    html: <p>Thanks Steven. I have checked out many (all?) of the Caslons over at Myfonts.com. The problem is that most Caslons don’t have that kind of gentle swoop on top of ascenders on the italic. Caslon Rough did, which was&nbsp;surprising! </p>
