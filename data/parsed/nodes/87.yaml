    html: <p>Thanks Tiﬀany. The problem though is not simply modifying Caslon Rough—though your observation of the ‘y’ is a good one and one I hadn’t thought of—but to ﬁnd the “smooth” (non processed) variant of the Italic. Elsner and Flake do not have a “regular” version of this Caslon to my knowlege. Their version of the rough was created in the 1980s from source materials that were non-digital, and likely of <span class="caps">ATF</span> origin (thanks to Ms. Elsner for this info). I am hoping someone here may know where to ﬁnd the digital version of this source typeface—the one that was used, and perhaps modiﬁed, for the De Beers&nbsp;Ads. </p>
