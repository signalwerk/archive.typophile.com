    <p>Trying to identify this font for some Samoa friends of mine.</p>
    <p>Looked through my library and the closest font i could find was ARB 67 Modern Roman.</p>
    <p>To me it looks like an oldschool hawaiian font.</p>
    <p>Any help would be greatly appreciated.</p>
