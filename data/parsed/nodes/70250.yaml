    <p>May I kindly ask for your help? I do some research in terminology and looked for the first occurence of the term »typographus« in the sense of »printer«. By an older dictionary I was advised to look into the introduction of an incunable:</p>
    <p>       Manilius, Marcus: Astronomicon. Hrsg. Stephanus Dulcinius. Mailand: Antonius Zarotus, 9.XI.1489</p>
    <p>but the word isn’t used there. Has anybody reading this forum other informations when the word »typographus« came into use and when it appeared first?</p>
    <p>Thanks,<br>
    Roland</p>
