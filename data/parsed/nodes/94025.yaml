      <p>Hi Queneau, sorry you've had a problem downloading a font you purchased, or getting a timely response from our customer service team. Both are unusual... anyway you should be able to sign in to your account and download any items you previously purchased (even though we are no longer doing commerce directly from FontMarketplace anymore). If you have any questions please feel free to email me directly: Bill (at) Fonts.com.</p>
      <p>Thanks,</p>
      <p>Bill Davis</p>
