    <p>Hi,</p>
    <p>I have been trying to contact people from fontmarketplace, which used to sell fonts on its website, but now is just another shopfront for fonts.com. I bought some fonts there in the past, which I want to re-download, but this does not work, somehow. I tried to get support, but I have not gotten any reaction. Do you know anything about this?</p>
    <p>thanks</p>
