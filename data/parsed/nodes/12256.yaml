    <p>Argentinean type designer.<br>
    Teaches at the <a href="/wiki/FADU" class="freelinking" rel="nofollow">FADU</a> in Buenos Aires.<br>
    Editor of the <a href="/wiki/tipoGrafica" class="freelinking" rel="nofollow">tipoGráfica</a> magazine.<br>
