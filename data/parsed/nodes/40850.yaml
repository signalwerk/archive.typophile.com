      <p>Version 2 is an improvement all-round except for the curved arms on x and X. It's okay to widen them as you have, but now you need to revise the point where they connect with the intersection for improved flow-on from the lower left stroke. Alternatively, return x and X to version 1 as the width affectation of those curved arms is not really a problem for them the way it was for v and w.</p>
      <p>New M and N go well with the rest of the font and help evoke the food-like organic theme, more so than the roman forms of version 1.</p>
      <p>Curved spines of z and Z look good. This structure is often drawn poorly and unpopular with font buyers for that reason, but you've done it subtly and I think they will survive on merit.</p>
      <p>g --- ear is improved but it could use more length. Keep working on the body to get the weight right. I think it's more a matter of uneven stroke density than the whole thing being too heavy. Experiment with making the lower bowl taller for a more balanced letter design.</p>
      <p>a --- improved, but could be refined further. I've taken the liberty of doing a drawing as it's the best way of demonstrating what to do. The changes are aimed at refinement but also to add rigor to the bowl. Note this is a rough drawing done with pixels and only intended to show the direction to go in.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/whisk_a_anim_6404.gif"></div><p></p>
      <p>Numerals --- yes 3 and 5 need work. I'm sure you'll figure them out. Try tapering the diagonal strokes of 4 and 7. Spine of 2 looks a bit heavy and the structure shows the corruption of the Arabic/Indian form seen in many well-established fonts. The lower left corner bulges up and left. For examples of uncorrupted 2 form, study Bitstream Vera Sans, Gill sans, Futura, Frutiger. </p>
      <p>Whisk is shaping up nicely! Keep a' going. </p>
      <p>j a m e s</p>
