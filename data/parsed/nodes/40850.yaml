      <p>This seems like a really great start, and I think that Whisk's overall communication is one of friendliness, creativity and approachability, which strikes me as just about perfect for use in cookbooks. I think the challenge for you will be to create really, really exquisite numeral characters, since in both menus and cookbooks, there is nothing more important or prominent.</p>
      <p>Couple thoughts on individual characters. I think the left portion of the 'f' crossbar could use some shortening. As it is, the crossbar makes overall character width feel too wide, and I think it seems to point backwards which will distrupt the overall flow of reading.</p>
      <p>I find the curved leg of the 'k' to be slightly problematic, as it seems to create a weak base and therefore a timid, off-balance letterform. Perhaps it would benefit from a more pronounced, traditional leg, and then bringing the curved stroke to the arm so it keeps the same attitude as the rest of the letterforms, similar to that of the "w."</p>
      <p>The 'x' aslo seems to stand out as having almost <em>too</em> much character. I think that if the curved strokes were a little more subtle, again like that of the "w," you'd be better off.</p>
      <p>Just suggestions, I think it's a quirky and beautiful start that will work well for its intended use.</p>
      <p>Cheers!</p>
