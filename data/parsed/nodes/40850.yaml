      <p>Thank you for the comments Joe, Beth, and James!</p>
      <p>James, I really appreciate the fantastic comments, and after running some print tests and incorporating the above suggestions, I've just put up the newest PDF file. I am also very grateful for your offer in helping me sell Whisk once it's completed, and your experience with Jellyfish is very inspirational!</p>
      <p>In addition to refining almost every letter, N, M, Z, and z have changed from the previous version. I also added a rough set of numbers (going with old style figures) and some punctuation. Once I upgrade to FontLab (from TypeTool), I'll implement OpenType features that allow titling figures and small caps.</p>
      <p>At the moment, I think I still need to work on g, as it appears too dark in colour, and I'm not entirely convinced with y or Y either. The numerals need to be more refined, especially for 3 and 5, and maybe it's just me, but 8 feels slightly darker in colour. Thanks again for all the comments, and I'm looking forward to hearing about what can be improved in this version.</p>
