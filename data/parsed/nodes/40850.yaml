      <p>James, thanks for the comments and suggestions! Hopefully the revision that I put up today is a bigger step up.</p>
      <p>Changes made: made minor revisions to virtually every lc characters and some uc characters. Made all of the horizontal thickness slightly thinner as it appears too thick at times. Opened up <em>g</em> more, and softened the curves for <em>f, j, t, and y</em>. The <em>X and x</em> branches out differently to appear more balanced. All of the numeral characters have been modified. I think I may have to continue working on 2, 3, and 5. The next revision will have more punctuation.</p>
      <p>Also, I attached a couple of samples of Whisk in use, on bubble gum packaging and on a menu.</p>
