      <p>Hi Joachim :^) I love the individuality you've engineered into this face. It needs refinement but not much. Too much refinement will spoil its effect.</p>
      <p>Lower case crits:<br>
      * bowl of a could be narrowed --- experiment with that and see how you like it. The bowl would also benefit from a more distinctive shape. Probably a downward droop will look okay, but subtle to avoid breaking out of the overall geometric form of this font. I can do a drawing if you want. Just say.</p>
      <p>* lower bowl of g could use more width. Ear of g is diminutive and non-descript. Make it larger and longer, and bring it up off the x-line to avoid collisions.</p>
      <p>* truncated tail of y may alarm some people</p>
      <p>* u appears to be same width as n. I usually make u narrower as a basic refinement</p>
      <p>* s is very nice but maybe a bit wide</p>
      <p>* k is excellent</p>
      <p>* v and w --- the curved parts are nicely drawn, but cause the characters to appear narrower than they really are. Solution is to make them a bit wider. Experiment until they look right in combination with other letters.</p>
      <p>Capitals crits:<br>
      * outer curve on lower bowl of B needs some adjustment</p>
      <p>* V and W --- same thing going on there as the loweer case siblings.</p>
      <p>* S maybe a little wide for some tastes. Narrow it if you want to for more refinement, or leave as is if you like it.</p>
      <p>* K is flipping excellent.</p>
      <p>* Y, same deal as lower case y</p>
      <p>* G bar level is in no man's land right now. It can be aligned with H bar, or left as is</p>
      <p>* Middle bar on E and F in old skool mode, being shorter than the main arms. You may want to bring the length out some for a more contemporary look.</p>
      <p>* A is sweet. One advantage of the gothic form is freedom in placement of the bar. This one can be aligned with the other bars if you want it to.</p>
      <p>Overall this is an excellent first effort and I am of course going to push you to develop it further and finish it, and most important of all, I'll help you sell it to designers.</p>
      <p><em>My intention is to make a “food” font, where the typeface will look good on food &amp; beverage products, restaurant menus, cookbooks, personalized recipes, etc. I used keywords such as homestyle, aroma, fresh, delicious, tender, sweet, and organic, and tried to incorporate those qualities into the letters. At the same time, legbility is very important where text is versatile enough to be read from caption sizes to headers. It might be difficult to say that a typeface could be made for a specific use, so maybe this shouldn’t be a “food” font as it is inevitable that the personality of the face could be applied to other projects and subjects?</em></p>
      <p>I set out to make an explicitly food-oriented font with <a href="http://www.myfonts.com/fonts/sentinel/jellybrush/" target="_new" rel="nofollow">Jellybrush</a>, and succeeded in every respect. It turned out to be very useful for food product branding and packaging, and the part I didn't plan --- it works very well for soft and rubbery things like pillows and manchester items, bathroom products and kitchen stuff as well.</p>
      <p>Beth, the fact is I'm in love with you. No, I'm kidding, I'm married. Just thought I'd mention you look very spunky ;^)</p>
      <p>I know how it feels tho, I've done food branding over and over. I beat the gourmet cliches by writing new material about food. It was the only way to preserve my sanity.</p>
      <p>j a m e s</p>
