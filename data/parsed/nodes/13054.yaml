    <p>Hello everyone,</p>
    <p>i need help on one issue concerning a layout made on a mac<br>
    that must be edited on a PC. First of all I need to use one single font file<br>
    (Opentype or Truetype) to build this layout.<br>
    Then, the document should stay editable on PC.</p>
    <p>Do to so i’ve made a Opentype and a TrueType test of my font.<br>
    The main problem concern the key map.<br>
    For example, the “é” character on Mac goes away on PC.<br>
    There are also problems with the kerning…</p>
    <p>My question is simple : how could I keep the integrity<br>
    of my font file and use it both on Mac OSX and on Windows XP.</p>
    <p>Thanks.</p>
    <p>Guillaume</p>
    <p>PS : Hope my english is understandable…</p>
