    html: |-
      <p>As you’re working on Mac OS X, I’d suggest just making a Windows flavor TTF, with no Mac-specific cmap - just include a regular Windows Unicode cmap. Run the resulting font through Microsoft’s font validator.</p>
      <p>With respect to the kerning, you need to turn kerning on in Word on Windows - it’s under format, font, character spacing.</p>
      <p>Finally I’d suggest that using InDesign on Windows and Mac might result in less reflow issues (possibly none) as the product shares it’s code-base cross platform - Word doesn’t.  </p>
      <p>Cheers, Si</p>
