      <p>A quick answer to my problem.</p>
      <p>Thank you sii, your advise solve it.<br>
      I made a Windows .ttf file of my font without Mac cmap and with a regular Unicode one.</p>
      <p>I did’nt use Microsoft’s font validator, but it seems to work quite well…</p>
      <p>The first test runs on both Macintosh and Windows Word and Openoffice.<br>
      Which is quite encouraging :)</p>
