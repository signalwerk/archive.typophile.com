  html: |-
    <p>The October edition of the Metal Type newsletter is now out.</p>
    <p>This month's video was filmed outdoors, as the UK seems to basking in a heatwave. The calendar is saying that it's October, but the temperatures have been in the 80s!</p>
    <p>I'm carrying on the trend of unusual vehicles at the end of the video. This month it's a car cruising up and down the River Ouse in York, here in the UK.</p>
    <p>Click here to take a look at this month's video:<br>
    <a href="http://j.mp/k5KA95" title="http://j.mp/k5KA95">http://j.mp/k5KA95</a></p>
    <p>On the Forum<br>
    It's always nice to see something new, and this month a picture of a round-based Linotype appeared on the forum. Don't forget, you don't have to register to make a comment on the forum now. Click the link below to take a look at the round-based Linotype:<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=12" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=12">http://www.metaltype.co.uk/rail/clicks/click.php?id=12</a></p>
    <p>All the Best<br>
    Dave Hughes<br>
    York, UK</p>
