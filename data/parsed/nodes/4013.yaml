    html: <p>Gracias a todos por los aportes.  <br>Sin referirme a mi tipografia en particular, creo que en ocasiones sucede que debido a lo monotona de las elecciones tipograficas en la mayoria de los libros en Latinoamerica (Garamonds, Times, etc.) tendemos a creer que solo un reducido numero de formas pueden funcionar en fuentes de texto. <br>Sin embargo en los ultimos tiempos he tenido la oportunidad de leer numerosos textos compuestos en muy diversas tipografias, algunas incluso muy ricas en detalles para nada "funcionales" (como DTL Fleischmann o la Jannon de F. Sorm). Las mismas funcionan perfectamente en cuerpos pequenios y sus particularidades le otorgan identidad y caracter, aspectos que tambien cuentan en fuentes de texto. <br>En mi opinion sostener en nuestro tiempo que la buena tipografia es "invisible" es un tonteria .</p>
