    date: 2004-05-01T05:29:00
    date_raw: 1 May 2004 — 5:29am
    votes: null
    html: '<p>Juan Pablo: sin animo de ofender, tus indicaciones en cuanto a como resolver las lineas bezier son harto obvias. Por otro lado es un TERRIBLE ERROR  hacer depender la estetica de una tipografia del ajuste tecnico -supuestamente ideal-  de las curvas bezier.  <br>Una fuente puede ser dibujada con diversos algoritmos que se comportan de manenra completamente diferente a las curvas Bezier (por ejemplo Lavigne estoy usando bastante IkarusMaster...). <br>Ya que te gusta tanto DTL Fleischmann te cuento que fue dibujada en IkarusMaster y por lo tanto muchas de sus curvas cuando son trasladadas a postcript no son 100 % "correctas" (existen puntos intermedios entre los extremos, por ejemplo). <br>No por tener una matematica mas ajustada en los splines una fuente tiene mas calidad. No hay nada mas facil que hacerlo. Lo importante es alcanzar la forma que uno desea y para eso se pueden violar algunas reglas (de segunda jerarquia) en el posicionamiento de puntos en las curvas Bezier. <br>Te recomiendo leer algunos articulos o libros de Peter Karow: ni siquiera una autoridad como el se muestra tan extricto y pontificador a la hora de trabajar con los outlines. <br> <br>Saludos a todos y gracias por los aportes. <br></p>'
