    html: "<p>Rodolfo: Off course Karow always defended his tools but in spite of the modern and most popular way of deal with type design I still think there are some advantages in the Ikarus splines. <br>Sadly that is something that I can't transfer to your brain. If you want to try, download the FontMaster Light and try to do some things with Ikarus Master. Once you are a little accustom to this new enviroment (not so easy... I do not like the FontMaster interface) you realice is possible to correct the outlines in a more easy way than in bezie curves. You can try also the sketch mode in FontLab, the splines are very very similar.</p>"
