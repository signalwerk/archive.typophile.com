    html: "<p>I certainly agree with Randy... your overshoots are not cutting the baseline and meanline enough, causing characters such as your: a, b, u, e, o, and s to feel small in comparison to the x-height of your other characters. Also, the tail of your g seems a bit heavy, as your counter forms are quite tight. Your s seems to be compressed compaired to the rest of your letterforms. Perhaps allow the bottom half of the character to extend in width? <br> <br>Otherwise it seems that you have a really strong start, and a very querky but usable face. Very nice... your vertical proportions from ascender to baseline/meanline relationship is quite refined and classic.</p>"
