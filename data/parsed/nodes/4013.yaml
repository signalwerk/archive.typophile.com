    date: 2004-05-06T03:41:00
    date_raw: 6 May 2004 — 3:41am
    votes: null
    html: "<p>Rodolfo: <br>P.Karow was right. In digitalization by hand Ikarus splines are technically far better than Bezier curves. <br>The problem is that most of the new type designer don't have experience in the other ways of digitalization. Bezier off-line points can not follow with real accuracy a real art work.   <br> <br>Miguel: <br>No creo que JP este dando catedra de dibujo postcript. Creo que su error reside en creer que el correcto ajuste matematico de las Bezier (no de la geometria basica) deriva en buenas formas tipograficas. No hay nada mas erroneo: Los algoritmos fueron hechos para lograr aquello que queremos dibujar y nunca debemos adaptar nuestras ideas a la logica de los mismos (y menos que menos de uno solo en particular). <br>Ademas, la vectorizacion que hace de la \"a\" de Lavigne es incorrecta y esta basada en la ampliacion de mi ejemplo en el foro, lo cual deriva en un original de baja calidad. <br> <br>Cambiando de tema, Jose, no se lo que es el \"pincel vernacular\"... Lavigne se deriva del ejercicios con la pluma flexible (pointed pen) al igual que la tipografia de \"Ruse\" GN. <a href=\"http://www.teff.nl/fonts/ruse/ruse.html\" target=\"_blank\">http://www.teff.nl/fonts/ruse/ruse.html</a> <br>Ese tipo de ejercicios son comunes en la KABK. <br> <br>Saludos y nuevamente gracias a todos. <br> <br> <br></p>"
