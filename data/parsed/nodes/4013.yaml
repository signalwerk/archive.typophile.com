    html: "<p>Hi Ramiro, <br> <br>This is lovely. Would be very nice in display. It definitely is a  <br>bodoni/didone (no getting around it), but you do have some  <br>unique things working here: the a bowl, the u tail, the g ear, the  <br>swash terminals. <br> <br>Here are some suggestions on the forms as you have them now. <br>h, m, n: are looking wide compared to the u. Consider narrowing  <br>a, r, g, f: add some more weight into your terminals <br>a, u: the tail (is giving/will give) you spacing problems. Try it curling <br>up more to make room for a foot serif next to it. <br>b,o: look a little flat-sided. <br>generally: consider a little more weight in the transitions from thin to thick. <br> <br>Here are some stylistic suggestions: <br>1. My first thought upon seeing the a form was <i>Hmm... this is  <br>kind of like a Pill Gothic Bodoni </i>(from the sans serif  <br>critique). Not a bad thing, but you may want to involve that hard  <br>corner in a few other choice spots. <br>2. The tail on the u (a more italic form) got me wondering if it might <br>be interesting to introduce more italic forms to this roman  <br>(maybe). For example a loop k, pothook/tail on the i and l, descending </p>"
