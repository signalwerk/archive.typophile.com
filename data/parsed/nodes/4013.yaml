    html: "<p>Yes!!!!!!!!!!! <br>Nice work Ramiro! <br> <br>This is a bodoni/didone with x-factor. Like (forgive the comparison) Mrs. Eaves is a baskerville with x-factor. Unusual beauty. <br> <br>Ok, on to things to consider: <br> <br>Overall: Keep and eye on your overshoots. Your xheight seems to wobble. I think there is not enough. See the burgef sequence. Bottom of the u a etc. Bottom of the b is very high. <br> <br>r: The terminal on the r looks off. maybe give it just a little more hook. Also, the arm should overshoot the stem. <br> <br>f: The hook may be a little too sharp. Consider a curve more like the top of the a. It will require a fi ligature, but even now you have spacing issues with the fi combo. <br> <br>s: I like it. Have you tried it without the straight segments in the spine? <br> <br>Show us more! <br>Randy</p>"
    html_clean: "<p>Yes!!!!!!!!!!! <br>Nice work Ramiro! <br> <br>This is a bodoni/didone with x-factor. Like (forgive the comparison) Mrs. Eaves is a baskerville with x-factor. Unusual beauty. <br> <br>Ok, on to things to consider: <br> <br>Overall: Keep and eye on your overshoots. Your xheight seems to wobble. I think there is not enough. See the burgef sequence. Bottom of the u a etc. Bottom of the b is very high. <br> <br>r: The terminal on the r looks off. maybe give it just a little more hook. Also, the arm should overshoot the stem. <br> <br>f: The hook may be a little too sharp. Consider a curve more like the top of the a. It will require a fi ligature, but even now you have spacing issues with the fi combo. <br> <br>s: I like it. Have you tried it without the straight segments in the spine? <br> <br>Show us more! <br>Randy</p>"
