    html: "<p>I understand the ambiguity about style-linking more than one heavier weight, although you'd think smaller foundries would follow the solutions of Adobe and Monotype, or at least style-link each weight of roman to its italic. No, it's when they just abandon the customer who buys a four-style \"nuclear\" family--especially without any consistency within the same foundry. Perfect example: FF Celeste, with all four fonts style-linked simply and reliably when used in Quark. Versus FF Scala, with NO style links for ANY of its same four fonts in Quark. Same foundry! And if my memory serves, my original version of Scala (since replaced for OSX) DID have those style links! This indifference to basic customer convenience can be a real burn--something that needs to be discussed industry-wide and remedied industry-wide, it seems to me.</p>"
