      <p>Consider: If every single type design came with Regular, Bold, Italic and Bold Italic, then no matter how many other weights there were, you could rely on those 4 being style-linked. But that's not the case. There isn't an industry standard in the <strong>names</strong> of the various styles of a font family, much less a mandate that type families include Bold or Italic. We already know from other discussions that different applications see font style names differently, and some of them want Regular, Book, Plain, and other names to mean the same thing. </p>
      <p>Built into that is the pitfall Karsten mentions: If you are accustomed to using the keyboard styles, you can get something bolder when you hit the "bold" command, but it might be fake, smeared bold. The italic command can give you electronically sloped roman. Many people don't notice this onscreen, and oftentimes don't even notice this in print. Is that desirable? </p>
      <p>To put a finer point on what Ralf said, graphic designers are trained not to use the keyboard shortcuts for the above reason and for others. It is a MS Word convention that has leaked into other areas, much like the 2-space convention of typewriting that no longer has a purpose. I hesitate to make the suggestion since you're so passionate about it, but because of the inconsistent way typefaces, applications, systems, and text engines behave, I recommend you change your habits: Refrain from using the keyboard shortcuts and either select styles from menus, or set up character styles. I think it's safe to say that the consistency you wish for will not happen any time soon.</p>
