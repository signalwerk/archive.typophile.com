    html: |-
      <p>mondoB -- <cite>Adobe, ITC, and Monotype never leave this aspect of their font engineering undone, so why do smaller foundries think they can ignore it?</cite></p>
      <p>Smaller foundries do not "think they can ignore it." Actually there are good reasons for avoiding style linking.</p>
      <p>First of all, style linking works <cite>really</cite> reliable only with 4-style families which Windows regards as the one-and-only way a family should be look like: Regular, Italic, Bold, Bold Italic. More than two weights, Regular and Bold, were not anticipated.<br>
      As soon as a family has more than these two weights, a foundry has a few options:<br>
      &nbsp;&nbsp;&nbsp;(1)&nbsp;&nbsp;avoid style linking altogether,<br>
      &nbsp;&nbsp;&nbsp;(2)&nbsp;&nbsp;only style link each weight to its according italic,<br>
      &nbsp;&nbsp;&nbsp;(3)&nbsp;&nbsp;style link both italic and bold; therefore split what is a big family in InDesign, into many 4-style families for Microsoft applications. This is what you seem to expect. But this does have nasty side effects too:<br>
      &nbsp;&nbsp;&nbsp;(3a)&nbsp;&nbsp;Take an Adobe font with five weights. It links Regular--Bold and Light--SemiBold. But -- no bold for the Black! In a way this is inconsistent too.**<br>
      &nbsp;&nbsp;&nbsp;(3b)&nbsp;&nbsp;Other foundries (you have one in your list of good examples) only link Regular--Bold, but leave all other weights, Light, SemiBold, Black unlinked. Which means that if you select the Light and click B you get a fake bold. I doubt this is what you want.</p>
      <p>And there are more factors involved which help make sure that, as soon as one wants to style link more than the 5 weights (which seem to be the maximum in Adobe families), things will break in certain contexts. Believe it or not, sometimes the "smaller foundries" who "think they can ignore it" are a step ahead of what Adobe does -- downside is that there are no footsteps to follow because we're discovering yet untouched territory.</p>
      <p>In so far, it is easiest and most reliable for a foundry to choose option (1) and just say: "Never hit the B or I buttons!"*</p>
      <p>You are right that foundries should make it clear if their fonts are style linked or not, and how (bold, italic, or both). Some do.</p>
      <p>*&nbsp;&nbsp;No misreading please. I am not saying that what Adobe does is bad, but just point out that <cite>all</cite> approaches to work around the 4-style family limitation have their disadvantages.<br>
      **&nbsp;&nbsp;Thinking of WPF and future Vista application that may use it, however, (2) may turn out to be a better option than (1). So I am with you. Halfway.&nbsp;&nbsp;:)</p>
      <p>Sorry, even without technical details this turned into a longer post ...</p>
