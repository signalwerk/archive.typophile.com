      <p>From a type designers point of view there are two kinds of customers: Office users and DTP users.<br>
      There are special packages for Office users where font families are limited to 4 styles and style linking works as expected.<br>
      <a href="http://www.myfonts.com/search?search%5Btext%5D=office" title="http://www.myfonts.com/search?search%5Btext%5D=office">http://www.myfonts.com/search?search%5Btext%5D=office</a></p>
      <p>In a DTP environment the use of Bold and Italic buttons or shortcuts is not considered as an appropriate workflow. So for a type designer there is no need to jump through hoops to allow such a workflow. Just because some foundries do it, doesn't make it right.<br>
      Define paragraph and character styles for your bold and italic texts and apply the styles instead.<br>
      (Not sure about Quark, but in InDesign you could define those globally, so they will appear automatically in EVERY new document.)</p>
