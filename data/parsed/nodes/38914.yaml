  html: <p>When I buy text families from Adobe or Monotype, I know that I will always be able to go from roman to italic (if not also to bold and bold italic) by means of keyboard shorthand commands. But when I buy from the more boutique foundries, like FontShop or FontFont, it's a real crap throw whether roman will link to italic or just turn up that fake cursive. And whenever I ask them beforehand, they never seem able to tell me, or won't. Why can't all foundries create reliable links, at least from roman to italic...and can anything be done to remedy this as a more consistent industry standard?</p>
