    html: <p>I remember getting this error a few times.  I don't recall the REAL reason but I do recall that the error message had nothing logical to do with the solution. It may have something to do with kerning classes but I can't be sure. Try rebuilding the kern feature from the "Kerning Assistance" window and then save quit, and restart FontLab.</p>
