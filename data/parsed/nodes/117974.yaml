    html: |-
      <p>Acquisitions and mergers are subject to regulatory approval when the firms involved control more than a certain percentage of a market, without any allegation of wrongdoing. That is one of the features of antitrust law, in the U.S. as well as in Canada.</p>
      <p>The current situation appears to be an oligopoly, divided between Monotype and Adobe. I suspect that the root cause of this is the changing nature of font piracy.</p>
      <p>Font piracy is not new. In the days of hot metal types, in order to survive, the smaller firms imitated the popular typefaces from the large firms that were in demand. In the days of phototypesetting, there were many new firms which all seemed to have their own imitations of the standard typefaces - Times Roman, Univers, Optima, Century Schoolbook, Caledonia, and so on. And of course Garamond and Caslon as well, but those didn't really belong to anyone.</p>
      <p>But this was piracy by competing firms; customers still had to pay for their matrix-cases or glass disks or golf-ball elements. Now, while design imitation is still also present, the actual .ttf and .otf files are being stolen by end-users, and for some reason, while places that distribute hacked copies of Windows get shut down quickly, blatant distribution of pirated fonts goes on unchecked. (This despite the fact that the actual files have the same legal protection as software, and so aren't affected by weak legal protections against design piracy in the U.S..)</p>
      <p>This creates a climate where it's very difficult to do a profitable business unless you're a very big company.</p>
      <p>In fact, though, the piracy <em>itself</em> is only a part of the problem. Notice <em>what gets pirated</em>. So the driving force behind piracy is <em>itself</em> a problem.</p>
      <p>The demand for fonts is mainly for <em>fonts of the standard typefaces that people see everyone else using</em>. That's not to say that there's <em>no</em> demand for anything else. But the people who want something original do so because they're willing to pay extra money for the highest quality, for a unique brand identity, something that leads fashion trends instead of following them.</p>
      <p>And while some of those people can trust their own taste and judgment to lead them to what they're looking for, most people with such lofty goals have to rely on the abilities of others to get there. So they will go to FontFont or similar firms with well-established reputations in the stratosphere of type design.</p>
      <p>Of course, there are niche markets that are an exception to this: Comicraft comes to mind.</p>
      <p>But in general, what I see in the market for type is one with immense barriers to entry if one is looking for significant financial success.</p>
