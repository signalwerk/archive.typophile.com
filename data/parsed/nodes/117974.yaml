      <p>If it is nonsense that typeface designers face large barriers to entry, that's good news.</p>
      <p>But my concern wasn't just due to piracy <em>itself</em>, but also to the forces that seem to drive what piracy is seen in the Latin script world - because these forces also affect which fonts people choose to purchase legally. It appears to me that there is very limited interest in new or original typefaces, except if they're coming from a source like FontFont with an excellent reputation and a proven track record. That limited interest comes from the few design houses that can, and will take the time to, find good typefaces without relying on filters to do the work for them.</p>
      <p>One way I could be wrong is that good original fonts by independents do get noticed because type designers can look at a few independents, at least, and then they might talk about what they find - through media from blogs to the trade press, and so there are ways for the professional typographer to have his ear to the ground, so to speak, and be an early adopter of hot new typefaces from many suppliers, not just a few famous ones.</p>
