      <p>@hrant:<br>
      <cite>Not piracy, money. There's a lot less in non-Latin,</cite></p>
      <p>And of course that does make a point about cause and effect. There's a lot less money in making typefaces for, say, Thai - so there are fewer typefaces available, and they cost more. That leads to a bigger problem with font piracy, but the root cause is that fewer and poorer people use the script system.</p>
      <p>Cyrillic, and, to a lesser extent (because of the lower case) Greek can just be 'thrown in' when designing a Latin face, of course. Greek and Hebrew are somewhat in demand in the Latin script world for scholarly publication and the like. But most of the rest of the world's non-Latin scripts don't offer the same motivations.</p>
      <p>Even so, of course, some free fonts are being designed out of philanthropic motives to cover as much of Unicode as possible. In the case of Burmese, there's a controversy over whether Unicode properly covers the script system, though, so there's another level of problem.</p>
