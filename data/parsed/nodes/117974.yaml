      <p>I think that as from now, typeface designers should be reading their license agreements with type foundries and distributors more carefully. Especially when they are updated or changed. Currently, it seems that there are cases in which designers get a fairly smaller share from OEM deals (down to 10%) made my Monotype than by FontShop (30%). Some of the designers that sell their fonts through MyFonts may have noticed that in case of ‘OEM-deals’, that business may (occasionally) be handled by Monotype instead of MyFonts. Instead of the usual 30 to 50% share at MyFonts, it seems that there may be OEM-deal-scenarios in which the typeface designer gets only 10%. Those who are in the font business a bit longer may know that with ‘OEM’, legal documents used to refer to so-called Original Equipment Manufacturers, i.e. manufacturers of laser printers or other devices which have typefaces ‘on board’. Current developments suggest that OEM deals may also be interpreted as ‘corporate licenses’ and the like. Unnecessary to say that the financial volume of a single OEM or corporate license deal is likely to be fairly larger than a single license. I clearly state that this comment is based on a few observations which may not be generalized. Also it seems that license agreements between typeface designers with FontShop are not affected by the recent changes. What I intend to say with this comment is that I think that we have to keep an eye on future developments though.</p>
