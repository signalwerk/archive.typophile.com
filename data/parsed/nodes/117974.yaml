      <p>I don't think this is a totally terrible development. The ideal way this shakes out is that the innovation happens in independent foundries, while Monotype exists as a sort of "preservationist society,"&nbsp;keeping their extensive library updated and available for use with contemporary technologies. Of course, that assumes that Monotype is able to get their act together enough to do that.</p>
      <p>I'm assuming that most Monotype sales in the future (and maybe currently) will happen in bundles, like the Linotype originals library. That still leaves room for the independent foundries to create high-quality faces that fill roles that Monotype's faces don't. The tricky part is just ensuring that independent foundries can get their faces seen and purchased.</p>
