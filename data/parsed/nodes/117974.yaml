      <p>Lol... Money isn't everything. FB represents exclusively Latin native designers. Even if all the money was in, say Armenoperisiatic styles,  Mongolian or emoji, we'd likely stick with Latin. Straying beyond ones roots, scripturally, is not generally successful even in simplified designs of mystery scripts.</p>
      <p>The amount of money in a script, is an interesting question I'd not address as if it were either simple black or white, good or bad, hairy or bald, apple, orange, chicken in the pot or egg on your face. Technologies of various kinds have been rolling around in different places at different times with different receptions, adaptation patterns and various educational and cultural diffusion speeds,   with type involved.</p>
      <p>But, at this moment, I'd say there is no way could guess whether there was either more or less piracy or money in Latin vs non Latin, and I just don't see any o it, as the prime motivating factors for any of the monotype acquisitions, 'cept 1.</p>
