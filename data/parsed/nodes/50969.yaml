    html: <p>The French Laundy logo is indeed a modified Copperplate. Wiescher has a <a>Copperplate with similar flourishes</a> but it's not very well drawn. Your client might be interested in <a href="http://www.fontshop.com/fonts/singles/dstype/estilo_regular/" rel="nofollow">Estilo</a> and <a href="http://www.fontshop.com/fonts/singles/dstype/estilo_script/" rel="nofollow">Estilo Script</a> or the spur seriffed <a href="http://www.fontshop.com/fonts/singles/itc/itc_friz_quadrata_by_adobe_std_bold/" rel="nofollow">Friz Quadrata</a> and <a href="http://www.fontshop.com/fonts/downloads/itc/itc_elan_std_virtual/" rel="nofollow">ITC Elan</a>. Finally, <a href="http://www.fontshop.com/fonts/downloads/presence_typo/classica_prestige/" rel="nofollow">Classica</a> offers a large set of inscriptional ligatures that make quench his thirst for "stately".</p>
