  html: <p>Hello, I'm writing because I'm starting a work which is set on chinese characters on MAC but I must make some experiments with some chinese fonts to see if the system really accept the uncoding. So I would like to know some links with freeware chinese fonts to install on computer. I made a search on some links but every thing that I found was not good to make download because they didn't work at the computer. Anyone can help me with this situation? Thanks</p>
