    html: "<p>If you use Jaguar or Panther you already have a few Chinese full families. <br>In any other (multiulingual) case, I'd stick for tests with Lucida Grande, which comes in all the main scipts (Latin, Arabic, Hebrew among others). Right-to-Left scripts require Indesign ME (may be bought from WinSoft, which produces the excellent Middle East version, just updated for OSX: <a href=\"http://www.winsoft.fr/whatsNew/whatsnew.html\" target=\"_blank\">http://www.winsoft.fr/whatsNew/whatsnew.html</a>)</p>"
