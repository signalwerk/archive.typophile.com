      <p>Andy, you need to be careful in case you want to use Arno Pro's glyph names as a guidance. As Paul said, we had to compress *some* of the glyph names from uniXXXX to uXXXX in order to avoid a bug in OS X 10.4.8 and earlier. Here's more about it <a href="http://www.typophile.com/node/36619" title="http://www.typophile.com/node/36619">http://www.typophile.com/node/36619</a><br>
      We also used uniXXXX/uXXXX names in some cases where the usual standard name was longer (e.g. estimated --&gt; uni212E)</p>
      <p>At first we considered using uXXXX throughout, instead of uniXXXX, for glyphs outside the Latin-1 block. This would make the glyph names more consistent and have the fonts further away from the limit that triggers the bug, as that would shorten each glyph name by 2 characters. But later we found out that not all apps can parse uXXXX-style names, so we had to go back to using the uniXXXX format on some of the glyphs. The logic behind it is that, the default form of the glyph (i.e. the one that has a Unicode mapping in the 'cmap' table) received the 'uni' format, whereas its alternates received the 'u' format (e.g. Idotaccent --&gt; uni0130, Idotaccent.swash --&gt; u0130.b). </p>
      <p>The glyph suffixes were also reduced to the bare minimum, again, to reduce the glyph name's length. That's why you'll find the suffix '.a' being used on small cap glyphs instead of the usual '.sc' (e.g. a.sc --&gt; a.a). (BTW, applications are not supposed or expected to interpret the suffix, so it's safe to do this). We wrote a script that analyzed the frequency of all the suffixes used on the font's glyph names, and then based on that we replaced the original suffixes by something shorter. 'a' through 'z' was not enough so we needed this frequency analysis for deciding which suffixes would be replaced by two character alternatives (e.g. 'aa', 'ab', 'ac').</p>
      <p>So, you should just keep using the usual and standard glyph names, unless you're working on a project with a large glyphset which is going to be generated into OT-CFF fonts, and you suspect that the fonts will be over the limit and therefore trigger the bug. But before you start compressing glyph names check -- manually or with the <a href="/wiki/AFDKO" class="freelinking" rel="nofollow">AFDKO</a> tools -- to see if you need to do so.</p>
      <p>Note: The uXXXX format is standard, but was devised some time after the uniXXXX format, so not all the apps have updated their ability to parse the shorter version. This might be also due to the fact that the 'u' format is used for specifying characters beyond the Basic Multilingual Plane, a.k.a. BMP, in which case the number of digits in a u-like name is bigger than 4.</p>
