    html: |-
      <p>Different parsers for glyphnames use different logic, and there is a chronology in those names. The AGLFN names are the oldest, so the largest number of applications will recognize them. The "uniXXXX" names are newer, and then the "uXXXX"/"uXXXXX" convention is newest. For non-BMP Unicodes "uXXXXX" is the only option but a BMP glyph named "u0391" might not be recognized in some older versions of Acrobat, for example. The other limitation is glyphname length, which should be less than 32 characters. </p>
      <p>The following is a list of glyphnames for the same glyph but given in order from "oldest" (which has the widest recognition) to "youngest": </p>
      <p>"c_k", "uni0063_uni006B", "uni0063006B", "u0063_u006B"</p>
      <p>A.</p>
