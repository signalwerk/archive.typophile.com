    <p>Hey Everyone,</p>
    <p>I'm following <a href="http://www.adobe.com/devnet/opentype/archives/glyph.html" rel="nofollow">Adobe's glyph naming convention</a> and I'm comparing a few things to the way glyphs are named in Adobe's Arno Pro and I have a few questions that I hope someone can assist with. I've also followed along with the "<a href="http://www.typophile.com/node/20508" rel="nofollow">Why not Cyrillic Glyph Names instead of afi00xx?</a>" thread but I'm still left with a few really specific questions.</p>
    <p>I understand that glyphs that aren't in the AGLFN are best suited to have a name that reflects their Unicode value with the "uni" prefix for glyphs that are in the Basic Multilingual Plane, and the "u" prefix for those that are in the Unicode supplemental planes. </p>
    <p>However, it also looks like this is interchangeable, as if I can pretty much use either "uni" or "u" for any glyph name that has a Unicode value no matter which plane it's in, but only "uni" for Unicode values are only four digits. Is this correct? For instance, I see in Arno Pro that the Tcedilla is named "uni0162", but the Tcedilla_h ligature is named "u0162_u0068" instead of "uni0162_uni0068".</p>
    <p>When using "uni" and "u" names for glyphs with components is there any difference between using "uni0162_uni0068" or "uni01620068"? It makes sense to use an underscore as a convention for ligatures and not using underscores for glyphs that use components for accents like in the example "LATIN CAPITAL LETTER EZH WITH CIRCUMFLEX AND GRAVE, which is not in Unicode, should be named 'uni01B703020300'" but would there be any problem with "uni01b7_uni0302_uni0300"?</p>
    <p>Are there any disadvantages to using "uni" or "u" names with glyphs that already have a valid name in the AGLFN, like using "uni0391" instead of "Alpha"? I see that it's advisable to use Unicode names for Delta, Omega and mu, so I wonder if there would be any problem doing this for the rest of the Greek alphabet.</p>
    <p>And also, while I was picking around in Arno Pro looking for answers I saw:<br>
    <code>sub uni0164 h by Tcaron_h;</code><br>
    ...I figure it might be a bug that a glyph name would use "Tcaron" when the Tcaron in that font is named uni0164, but is it still possible to use more readable glyph names in some situations, like this Tcaron_h ligature?</p>
    <p>Many thanks in advance, I appreciate it!<br>
    Andy</p>
