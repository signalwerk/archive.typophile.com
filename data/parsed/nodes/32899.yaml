      <p>Another very well done typeface Jas. This is a very nice display font.</p>
      <p>Now the nit-picky issues:</p>
      <p>The lowercase d’s bowl doesn’t seem right, as if it was pinched and stretched vertically. </p>
      <p>Your numerals are awesome, but the 8 seems incongruent, maybe the hairline should reappear before it goes back into the body?</p>
