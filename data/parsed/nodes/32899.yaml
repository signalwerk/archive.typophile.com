      <p>Don’t take me wrong, I really appreciate every suggestions otherwise I won’t be posting on this forum lol so thanks for your opinion!</p>
      <p>I’m not planning any other version right now. I just needed a nice headline font and I’ve digitalized two (Neil Bold and this one). I was especially interested to do a super black didone like some Herb Libalin’s fonts that he drew for Eros or Avant Garde magazines.<br>
      I’m not really into type design but I think that’s really interesting. For the moment I’m just studying without knowing exactly what I will do afterwards. So I don’t think I’m experimented enough to create italics and lighter weights for this font, but who knows, someday perhaps : )</p>
