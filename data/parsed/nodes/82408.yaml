  html: |-
    <p>In Preferences: Generating OpenType: Kerning, I have checked the option that says "Generate OpenType "kern" feature if it is undefined or outdated."</p>
    <p>Nevertheless, whenever I generate the font, at the end it pops a dialog saying that the kerning has changed and do I want to regenerate the OT kern feature. Yes Fontlab, of course I do.</p>
    <p>How can I keep this dialog from appearing?</p>
