    <p>I’ve been using Caxton (the newest OpenType version) for a book project, but I’m getting to the point where I’m frustrated by its lack of advanced typographic features (small caps, superscripts, etc) so I’m wondering if there’s a similar looking typeface that has more of a complete feature set. I really like the look of Caxton, but cannot for the life of me think of something similar enough to switch to.</p>
    <p>Thanks!</p>
