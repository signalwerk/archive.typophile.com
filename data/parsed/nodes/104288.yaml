      <p>If I were you, I'd go talk to an engraver. Nancy Sharon Collins comes to mind; she's written <em><a class="freelinking external" href="http://www.papress.com/html/book.details.page.tpl?isbn=9781616890674" rel="nofollow">The Complete Engraver</a>,</em> one of the few modern books on engraving. When I talked to her this past winter in New Orleans, she told me all about various techniques of using letter templates, drawing machines, etc., which might be clues to your quest. Nancy also has a couple of blogs, at <a class="freelinking external" href="http://engraving4nerds.com" rel="nofollow">http://engraving4nerds.com</a> and <a class="freelinking external" href="http://handengravedstationery.blogspot.com" rel="nofollow">http://handengravedstationery.blogspot.com</a>.</p>
      <p>—John</p>
