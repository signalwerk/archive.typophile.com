    html: <p>If you don't find the answers you seek from the sources mentioned above, why not go directly to the source, The US Bureau of Printing and Engraving? If you can visit Washington, DC, they also have guided tours of the plant where they print the currency. They are bound to have free information covering all of your questions.</p>
