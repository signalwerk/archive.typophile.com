      <p>This was hand-lettered by Sabine Dowek, the art director at MOMA. As far as I can tell, it has not been release as a typeface.</p>
      <p>Similar, though nowhere near as elegant:<br><a href="https://web.archive.org/web/20191006050941/https://fontbundles.net/incools/1644-cimochi">https://fontbundles.net/incools/1644-cimochi</a><br><a href="https://web.archive.org/web/20191006050941/http://www.dafont.com/jbcursive-v3.font?text=magritte&amp;psize=l">http://www.dafont.com/jbcursive-v3.font?text=magritte&amp;psize=l</a><br><a href="https://web.archive.org/web/20191006050941/https://fontbundles.net/laura-worthington-type/1901-samantha-family">https://fontbundles.net/laura-worthington-type/1901-samantha-family</a><br><a href="https://web.archive.org/web/20191006050941/http://www.dafont.com/ecolier.font?text=magritte&amp;psize=l">http://www.dafont.com/ecolier.font?text=magritte&amp;psize=l</a></p>
