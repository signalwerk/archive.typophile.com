    <p>There's some examples of a beautiful font, designed for the MOMA's exhibition of Magritte's work, at this URL:<br><a href="https://web.archive.org/web/20191006050941/https://www.moma.org/explore/inside_out/2013/11/01/lettering-magritte/">https://www.moma.org/explore/inside_out/2013/11/01/lettering-magritte/</a><br>
    I'm wondering if anyone knows if this has been released as a font, or something very similar to this?<br>
    Thanks</p>
    <img typeof="foaf:Image" class="img-responsive" src="https://web.archive.org/web/20191006050941im_/http://www.typophile.com/sites/default/files/font-id/magritte_0.png" width="768" height="312" alt="">
