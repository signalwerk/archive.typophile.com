    <p>Hello everyone, I just want to share a new release <strong><a href="http://sudtipos.com/fonts/142" rel="nofollow">Piel Script</a></strong>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pieltypo2_3700.jpg"></div><p></p>
    <p>After several years of receiving tattoo requests and images of them using my fonts, I decided to design and publish a tattoo-style typeface. You can see the specimen here. I hope you like it as much as I enjoyed designing it.</p>
    <p>If you want to <a href="http://www.behance.net/gallery/Piel-Script/784238" rel="nofollow">see</a> more images in use or to <a href="http://marketplace.veer.com/fonts/UMT0001066#" rel="nofollow">license</a> the font or just to <a href="http://www.sudtipos.com/downloads/Piel-Specimen.pdf" rel="nofollow">read</a> more about it.</p>
    <p>Best,<br>
    Ale Paul<br>
    <a href="http://www.sudtipos.com" title="www.sudtipos.com">www.sudtipos.com</a></p>
