      <p>You could, of course, use the square foot symbol, found at Unicode 23CD, if it's included in your font at all.</p>
      <p>EDIT: This is the single straight quote mark intersecting a square through the top. It is used more often in signage as a space-saving alternative to the abbreviation. It is not often used in running text.</p>
