  html: |-
    <p>I would appreciate some advice on proper typesetting for this phrase to be used in body text in a real estate brochure.  I have ad copywriters, sales people and designers all butting heads on this one.  Thank you.</p>
    <p><strong>4,000 square foot<br>
    4,000-square-foot<br>
    4,000 square-foot<br>
    4,000 sq. ft.<br>
    4,000 sq ft</strong></p>
    <p>If using <strong>sq ft</strong> should it be in small caps?<br>
    Is it correct to omit the comma and simply use <strong>4000</strong>?</p>
  html_clean: |-
