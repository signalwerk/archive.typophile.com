    html: <p>Chicago Manual of Style (15th edition) says to use "4,000 sq. ft." -- or you can use an exponent 2 on the foot, i.e. ft.2 (the 2 would have to be super-scripted). U.S.-style numbers use the comma to separate thousands, so "4,000" is appropriate, but European-style (except Great Britain) is "4 000" using a half-space instead of a comma (the comma is used instead of a decimal point, so "4 000,098" would be correct).</p>
    html_clean: <p>Chicago Manual of Style (15th edition) says to use "4,000 sq. ft." -- or you can use an exponent 2 on the foot, i.e. ft.2 (the 2 would have to be super-scripted). U.S.-style numbers use the comma to separate thousands, so "4,000" is appropriate, but European-style (except Great Britain) is "4 000" using a half-space instead of a comma (the comma is used instead of a decimal point, so "4 000,098" would be correct).</p>
