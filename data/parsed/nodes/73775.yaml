    <p><strong>Karandash</strong><br>
    Type &amp; Graphics Foundry</p>
    <p>Karandash is a small independent type design studio, based in Varna, Bulgaria. It was established in 2010 by designer <a href="/wiki/Vassil%20Kateliev" class="freelinking" rel="nofollow">Vassil Kateliev</a>, focused in designing high quality body and display typefaces for Eastern Europe, and is especially interested in developing Cyrillic typesets.</p>
    <p><strong>Web</strong><br>
    <a href="http://www.karandash.eu" title="www.karandash.eu">www.karandash.eu</a></p>
    <p><strong>Address</strong><br>
    12 Graf  Ignatiev St., ground floor<br>
    9000 Varna, Bulgaria</p>
    <p><strong>Requests and information</strong><br>
    <a href="mailto:hello@karandash.eu">hello@karandash.eu</a></p>
