    <p><strong>Karandash</strong><br>
    Type <span class="amp">&amp;</span> Graphics&nbsp;Foundry</p>
    <p>Karandash is a small independent type design studio, based in Varna, Bulgaria. It was established in 2010 by designer <a href="/node/88247" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Vassil Kateliev</a>, focused in designing high quality body and display typefaces for Eastern Europe, and is especially interested in developing Cyrillic&nbsp;typesets.</p>
    <p><strong>Web</strong><br><a href="http://www.karandash.eu">www.karandash.eu</a></p>
    <p><strong>Address</strong><br>
    12 Graf  Ignatiev St., ground floor<br>
    9000 Varna,&nbsp;Bulgaria</p>
