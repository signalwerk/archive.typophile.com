    html: |-
      <p>I'm a fan of minimalist design, black and white, and cropping words - all of which you have. But something about this makes me uneasy. Have you tried using a smoother script or something a little lighter? I feel like the cursive shouldn't take over the card as much as it does.</p>
      <p>On a different note: the cursive "ferrell" is lost when viewed as it is. I just thought they were squiggles. Maybe do the common-sense thing and put "erin" at the top and "ferrell" at the bottom both right-side up?</p>
