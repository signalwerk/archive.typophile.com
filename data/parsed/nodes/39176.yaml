    html: |-
      <p>If you're going to use a hand-written script face for "farrell", use one with a good set of alternates so the "rr" and "ll" combinations look a little less mechanical.</p>
      <p>When I tried to read the upside-down "ferrell", all I got was "ppiaaj".</p>
      <p> - Lex</p>
