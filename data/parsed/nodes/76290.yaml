    html: |-
      <p>It’s indeed irritating. If you open the font info panel and click OK, the asterisk also appears, although you have not changed anything. If you weant to exclude, that anything was changed, generate the font two times (before and after the operation) decompile it with TTX and compare the decompiled files with a program like UltraCompare.</p>
      <p>The asterisk also appears sometimes after you have generated a font. This is also irritating. It really should appear only, if anything was changed.</p>
