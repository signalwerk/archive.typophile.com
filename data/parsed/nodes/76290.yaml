  html: |-
    <p>Working in Fontlab 5 for Windows I have a vlb file with over 2300 glyphs, some of which I want to copy for use in the bold version. I’ve created a class for the sole purpose of selecting those glyphs and having a record of what was done for later debugging.</p>
    <p>However, when I select the class in the classes list and choose “Select Current Class” from the drop-down the glyphs get selected but Fontlab also changes the status of the opened font file to UNSAVED and the asterisk appears in the font window title bar, indicating that something has changed in the font. Yikes!</p>
    <p>I thought the drop-down simply selected the glyphs in the class. Am I mistaken? Does that do something in addition?</p>
    <p>Any help would be greatly appreciated as I'm down to the wire on getting this monster done.</p>
    <p>Many thanks,<br>
    Ken</p>
