      <p><em>...note that in removing URL-binding this format no longer conforms to the OpenType spec’s definition of document font embedding.</em></p>
      <p>You are saying that the OpenType spec's definition of font ‘embedding’ as it relates to web fonts requires URL binding, yes? So in effect you recognise two different kinds of font linking, one of which constitutes ‘document font embedding’ because the fonts are bound to a particular URL. Is that correct? Can you point me to the part of the OT spec that explains this? I've looked, and I don't see anything that would lead obviously to this interpretation of the word ‘embedding’.</p>
      <p>Since the non-IE browser makers have explicitly rejected URL binding -- hence why it is not included in the CWT format --, by your definition there are no embedded fonts in use with those browsers -- yes? -- even though the mechanism of linking may be identical to IE EOT linking excepting URL binding?</p>
      <p>This looks to me like a recipe for confusion; indeed, it is a recipe that we're already tasting.</p>
      <p><em>Secondly only allowing “installable embedding” fonts to be used. As we do not propose changing the OpenType font specification’s definition of “installable embedding” it would still be the responsibility of web site creators to confirm that the font license allows raw-font linking.</em></p>
      <p>Any free or open source font will have a license that permits format conversion, hence I don't see any reason at all for supporting raw font linking. You get the same mileage from supporting WOFF, with the added benefit of format-side compression.</p>
