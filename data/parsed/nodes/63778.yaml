      <p>&gt;&gt;Looks like a chicken and egg scenario.</p>
      <p>Having sped on by this issue and assumed we will support whatever-the-frig-formats our customers need, I assure this is not 'the' chicken and egg situation. So with all due support for all but EOT, thanks to Simon for this superb review and for his courage and vigor as an OS developer to show up and discuss these issues in real face time.</p>
      <p>We will be supporting all of these formats for the foreseeable future. I disagree with John that any burning occurred with GX (please cite examples), or will occur with web formats since support of them is no more than a simple translation. Further, I don't understand why John continues to cite IP as an issue with <em>any</em> font format on the web. </p>
      <p>Good luck, and please be sure, in the end, that EOT is distinguished from CWT in the demands put on the font for document embedding bits. As Simon says, they must be two different formats, and if the improvement is still demanding us to lie, (i.e. need to set embedding bits in order to enable linking), we will reject it, as strongly as imaginable. </p>
      <p>Cheers!</p>
