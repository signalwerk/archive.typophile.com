      <p>Si: <em>In a way, yes. But as noted “if you build it they will come” didn’t work out so well for EOT, even with IE having 90%+ market share.</em></p>
      <p>I think a lot of font makers lost interest in web fonts around the time that IE went with EOT and Netscape went with TrueDoc. It seemed clear at that point that there wasn't going to be a unified font format, and the fact that IE subsequently ended up with such a huge share of the browser market didn't seem to affect the perception, repeated by just about every Net analyst and journalist, that web typography was something that would have to wait. Also, EOT, contra TrueDoc, was seen as a salvo in the browser war, and once the war was effectively won Microsoft's own enthusiasm for EOT seemed to largely disappear until early this year. Partly this is doubtless Microsoft's perennial problem of poor evangelisation (of which WPF is the latest victim), but it also looked like a lack of interest in the weapons once the battle was won.</p>
      <p>EOT was also badly positioned in terms of providing or even suggesting to font vendors a viable business model. Microsoft rolled out a tool that enabled end users to make EOT fonts from existing TTFs, and I think a lot of font vendors were left scratching their heads wondering how to monetise this arrangement. It is telling that this time around a lot of the discussion among font vendors has been focused very much on how to monetise web fonts, and also telling that end user format conversion is very much not part of the emerging picture.</p>
      <p>Further, EOT was not a publicly specified format until earlier this year, leaving a lot of questions among font makers about how or whether it might be implemented in other non-IE browsers, as well as how to build EOT into foundries' creation, QA and delivery workflows. These are both key factors in the shaping of the WOFF format.</p>
      <p>Finally, as it turned out, Microsoft's own EOT implementation is buggy. It doesn't work with CFF OpenType fonts, and the IE @font-face implementation fails to support font family style linking correctly.</p>
      <p>I think there are a lot of reasons why font makers didn't rush to embrace EOT. Once again, I'll point out that the crucial difference that EOT was a technology that Microsoft wanted to give to font makers, while WOFF is a technology that font makers want to give to Microsoft.</p>
