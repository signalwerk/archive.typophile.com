      <p>If a font is not encapsulated within a document or tied to it (via a binding type mechanism) then it's not document font embedding. I do not believe there's any confusion here, as font EULAs typically say what's okay and what isn't, supplementing the permissions bits. </p>
      <p>In my opinion the additional hoop of format conversion would have been a good one, but we've moved beyond that now. I don't think the other browsers are considering dropping support for raw fonts.</p>
