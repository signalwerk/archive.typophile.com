      <p>CWT -- Compatibility Web Type -- is the new name for the format put forward by Ascender Corp. as EOTL (EOT Lite). A new name was recommended by participants on the W3C font list in order to remove confusion about what browsers supporting the new format should do when encountering ‘classic’ EOT fonts.</p>
      <p>The purpose of CWT is to provide a format that is compatible with existing EOT font support in Internet Explorer versions 6–8 (hence ‘compatibility’), while avoiding those aspects of EOT that were rejected by the non-IE browser makers. The CWT format does not use URL binding, which was the major objection to EOT from the browser makers, since this mechanism was viewed as a form of DRM.</p>
      <p>I believe a formal spec for CWT is in development, based on discussions on the W3C list.</p>
      <p>The obvious benefit of CWT is that it makes it possible to license and ship web fonts that work on the majority of browsers now in use, including the significant install base of IE6. However, due to bugs in the IE 6–8 EOT support on which CWT would rely in those browsers, there will likely be a distinction between the CWT format spec as it would be implemented by future browsers, and specific recommendations for making fonts that will work with IE 6–8 (e.g. TTF only). In other words, a CWT font built to be compatible with IE 6–8 would also work with new CWT implementations in future browsers, but a CWT font built to spec might not work in those older browsers. Make sense?</p>
