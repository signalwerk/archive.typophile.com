    html: |-
      <p><em>In addition given browser upgrade cycles it could be years before WOFF support reaches even half the browser install base.</em></p>
      <p>Which is a very good argument in favour of CWT (EOTL as was). Which I have been saying since June, despite my misgivings about the format and my preference for WOFF. CWT needs to be taken seriously, by font vendors, web authors and browsers, because it does provide a broadly compatible interim web font format.</p>
      <p>Raw font linking won't be taken seriously by most commercial font vendors, excepting insofar as some measures of server-side obfuscation are acceptable to some. Since an IE implementation of raw font linking limited to free and open source fonts with installable embedding is not practically compatible with the non-restricted implementations of the other browsers, i.e. web authors won't be able to use the same fonts reliably across browsers unless they are free or open source fonts, it does nothing to solve web font interoperability in a way that is meaningful to professionals. As MST demonstrated last year, with Ascender's help, most free fonts are not worth what one pays for them.</p>
