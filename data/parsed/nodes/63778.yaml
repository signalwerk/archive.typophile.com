    html: |-
      <p>The font makers to whom I have spoken who are making use of Typekit-like services are doing so because such services offer various kinds of server-side obfuscation as protections of the font. If these services were simply serving raw TTFs or OTFs direct from their servers to users' browser caches, then foundries would be no more interested in these services than they are in raw font linking. I've discussed this with a lot of colleagues, and very few people are open at all to raw font linking per se -- this is why <em>font makers</em> developed WOFF --; raw font linking with server side obfuscation seems acceptable to some people, but not to everyone. Further, the Typekit people are themselves in favour of a single interoperable format, so that they can move away from serving multiple formats, and seem to understand that they will attract more foundries if they are able to completely bypass raw fonts as a format (which they will be able to for Firefox 3.6).</p>
      <p><em>...other browsers don’t seem to be backing away from raw-font support.</em></p>
      <p>In the Spring of this year, raw font linking was being pushed by the non-IE browsers as the preferred interoperable web font format. Since then, they've pretty much stopped talking about it, in the case of Mozilla have worked with font makers to develop and implement WOFF, and have even tested CWT implementations. No one is expecting them to remove the raw font linking that they already have, but they have certainly backed away from it as a viable interoperable format, mainly because both font makers and Microsoft have said that they find it an unacceptable risk to font IP. The point I am making above is that even with the proposed limit to fonts with installable embedding bits, the active encouragement of raw font linking increases the risk to font IP. If you want to protect font IP on the web, the easiest way to do so is to avoid a mechanism that takes TTFs and OTFs and gives them away to every visitor to a webpage. Trying to limit that mechanism on one browser to fonts with a specific fsType bit setting doesn't seem to me worthwhile, because a) it encourages use of a format that other browsers will not limit and b) just makes your browser seem less capable than those other browsers to the average user.</p>
