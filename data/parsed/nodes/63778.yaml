      <p>Si, I think no one would disagree that a font ‘encapsulated within a document’ is embedded. What seems to me problematic is the assertion that ‘tied to a document’ also constitutes embedding. The former is common usage and understandable from non-specialist usage of the word embedded; the latter is a stretch, and to say that it is ‘the OpenType spec's definition of document font embedding’ is a really big stretch, because this is what the OT spec says re. the OS/2 fsType bits (the only part of the spec font embedding is discussed:</p>
      <p><em>Embeddable fonts may be stored in a document.</em></p>
      <p>Stored <strong><em>in</em></strong> a document. The spec doesn't say anything about ‘tied to a document’, nor any other wording that would lead obviously to such an interpretation. It simply isn't normal English usage to equate embedding with some kind of strong linking. Embedded reporters in Iraq operate within army units; they're not strapped to the outside of the humvee.</p>
      <p><em>In my opinion the additional hoop of format conversion would have been a good one, but we’ve moved beyond that now. I don’t think the other browsers are considering dropping support for raw fonts.</em></p>
      <p>For free and open source fonts, format conversion is barely a hoop. The same sites that make the TTF files available can make the WOFF files available. In neither commercial web font licensing nor in distribution of free and open source fonts is anyone anticipating end-user format conversion. That really is something we've moved beyond.</p>
      <p>But while we've moved beyond end-user format conversion, we've spent months -- successfully -- moving Mozilla and other browser makers toward a web-specific font format. Sure, those browsers that already support raw font linking are not going to remove such support, but that support is meaningless if an interoperable format acceptable to the majority of font vendors is implemented. And such a format works just as well and in exactly the same way for free and open source fonts.</p>
      <p>Meanwhile, I am concerned that if IE starts supporting raw font linking, even with the restriction that it only applies to fonts with the installable embedding bit set, then you will encourage an ‘ecosystem’ in which TTFs and OTFs are uploaded to web servers, an ecosystem in which all the other browsers will be ignoring the embedding bits. As I wrote to the W3C list in August, I think the argument that raw font linking for free and open source fonts is somehow magically separate from the issue of unlicensed use of commercial fonts is a naïve fantasy:<br>
      <a href="http://lists.w3.org/Archives/Public/www-font/2009JulSep/1316.html" title="http://lists.w3.org/Archives/Public/www-font/2009JulSep/1316.html">http://lists.w3.org/Archives/Public/www-font/2009JulSep/1316.html</a></p>
      <p>___</p>
      <p>You wrote above re. WOFF support: <em>EOT started with a long list of supporters too.</em></p>
      <p>Monotype and Adobe, if I recall. Who else?</p>
      <p>And why, for ten years, did EOT go nowhere? Primarily because it only worked on one browser. So that should tell you that the success of a web font format is dependent on browser interoperability, not on advanced sign-up from font vendors. You need the format to be agreeable to font vendors, but it is the implementation in the browsers that will make it successful.</p>
      <p>EOT was a format that the makers of IE wanted font vendors to support. WOFF is a format that makers of fonts want IE to support. That seems to me an important distinction.</p>
