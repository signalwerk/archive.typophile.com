      <p>Sorry, yes I meant early in 2008, not 2009. Still more than a decade after EOT was first rolled out. My point is that, between the demise of Netscape and Opera's introduction of raw font linking, Microsoft's own interest in EOT seemed lukewarm. The fact that the actual implementation in IE has been buggy for all that time seems to say something about how seriously EOT was taken both inside about outside MS.</p>
      <p><em>I would imagine IE is not alone in thinking about WOFF support...</em></p>
      <p>Mozilla are past the thinking about it stage and have already committed to supporting WOFF in Firefox 3.6.</p>
      <p>Let me state very clearly that I hope non-IE browsers will take the step of supporting CWT, and hence provide an at least partially backwards compatible interim solution to web fonts, as this will make things easier for web authors in the immediate future. But enthusiasm for this format among commercial font foundries is pretty limited: some of the bigger companies are interested, but most of the independents are not. So I think there is a genuine chicken and egg situation for CWT in that only increased browser support and a considerable user base will overcome the reluctance of many font makers to engage with that format.</p>
      <p>Enthusiasm for WOFF is already pretty high among font makers, but as the experience of EOT shows, no web font format is going to take off without multi-browser support. Looking to font vendors to start actively licensing and shipping for a format before it is supported in more than one browser is putting the cart before the horse. Some of these people got burned by GX, remember, and they're wary about touching anything that isn't supported by at least two major entities. A commitment from MS to support WOFF in IE 9 would go a long way toward turning today's enthusiasm into shipping fonts. Otherwise we're still in the late ’90s and IE is supporting one format and Netscape's children are supporting another and the font makers are going to sit it out again. The ball really is in the browser makers court: the uncertainty isn't being generated by the font makers. We'll support the format(s) that a) do not involve giving away our font IP to every visitor to a website, and b) are supported on two or more major browsers (and, frankly, there are only three major browsers: IE, Firefox and Safari, with the latter having an artificially high significance relative to market share).</p>
      <p>Ideally, I'd like to see MS and Mozilla mutually commit to support both CWT and WOFF, so that font makers and users know where we are going both now and in the years ahead.</p>
