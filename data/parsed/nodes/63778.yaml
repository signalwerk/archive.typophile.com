    <p>At ATypI last week at the request of the IE team I asked for font community input on the various Web font formats. I’m posting the details here and encourage feedback from the font community. </p>
    <p>WOFF: Microsoft continues to evaluate the format, and are encouraged that it was developed by people within the typeface and browser communities, and that it differentiates web fonts from desktop fonts. It is also encouraging to note that some type designers and vendors have voiced “support” for the format. EOT started with a long list of supporters too, so  we would like to see WOFF supporters and other foundries start licensing fonts in the format before we jump on board.</p>
    <p>EOT/CWT: Given browser upgrade cycles it will be vital for font foundries, as well as fonts-as-a-service providers to offer fonts in the EOT format alongside raw and WOFF. We are aware that some in the font community have proposed removing URL-binding (tying a font to a specific domain) and compression in a EOT-derived Web font format dubbed CWT. We support attempts to differentiate web fonts from document fonts, but note that in removing URL-binding this format no longer conforms to the OpenType spec’s definition of document font embedding.</p>
    <p>Raw fonts: Raw-fonts have a part to play in the Web font ecosystem, in particular around free and open source fonts. However to help prevent accidental posting and linking of unlicensed fonts we’re investigating two possible restrictions. Firstly requiring same-domain linking, meaning fonts must be located on the domain as the referring Web pages. Secondly only allowing “installable embedding” fonts to be used. As we do not propose changing the OpenType font specification’s definition of “installable embedding” it would still be the responsibility of web site creators to confirm that the font license allows raw-font linking. We are particularly interested in font community feedback on this approach.     </p>
    <p>Thanks, Si</p>
    <p>simonda@...</p>
