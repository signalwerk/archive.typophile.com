      <p>Yes. End-user of the font in the sense of the person making licensed use of the font (whether commercial or free license) to create something.</p>
      <p><em>A sizeable segment will insist on that freedom. If they don’t have it they’ll either take the liberty, or pass on buying the font if they think they will run any risk of a hassle by the vendor.</em></p>
      <p>Which is their prerogative. Professional designers needing specific fonts will obtain appropriate licenses with font vendors, either off-the-shelf licenses or, if they need something special, through negotiation. This is nothing very new to the professional font market. People who are not willing to purchase appropriate licenses at the market rate should use free fonts.</p>
      <p>____</p>
      <p>I am about to head off on a business trip, so I won't be contributing more to this thread. In any case, I'm at the point where I will probably start repeating myself. I have tried to express the perception of EOT and its gone-nowhere-ness from font makers, both myself and the colleagues with whom I've exchanged words on the subject of web fonts over the past ten years. I'm quite aware that there are other perceptions -- Microsoft's, or that of web developers -- and that we probably each consider the others' perspective to be flawed or, as you suggest ‘wrong, wrong’. David Berlow has a laser precise reason for rejecting EOT, and I suspect he is right that whatever the historical perceptions the equation of embedding with linking is an untenable one.</p>
      <p>____</p>
      <p>This made my day:</p>
      <p><a href="http://type101.fontbureau.com/archives/474" title="http://type101.fontbureau.com/archives/474">http://type101.fontbureau.com/archives/474</a></p>
      <p>And I don't think there is really anything else to say.</p>
