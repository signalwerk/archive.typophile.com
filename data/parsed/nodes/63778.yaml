      <p>I don’t want to editorialize too much as the point of this post is to solicit feedback. The “URL-binding = font embedding” discussion with the foundries took place ahead of this <a href="http://www.microsoft.com/typography/fontpack/pr.htm" rel="nofollow">press release</a> which also lists out the long list of “supporters”. People are free to argue this point, but it seems largely academic as foundries have moved on.</p>
      <p>With respect to raw fonts, the argument that IE is the only thing holding back the floodgates of abuse, seems a bit disingenuous. Foundries are lining up to license their fonts through Typekit and similar services, and the other browsers don’t seem to be backing away from raw-font support. In addition given browser upgrade cycles it could be years before WOFF support reaches even half the browser  install base.</p>
