  html: |-
    <p>Very much a work in progress, but as a designer who regularly has to purchase/license type and other resources, I just fired up a blog over at <a href="http://dlio.tumblr.com" title="http://dlio.tumblr.com">http://dlio.tumblr.com</a> to dig-up/share daily deals, discounts &amp; fresh releases of curated/quality type &amp; design resources. Check it out or follow @getdlio if interested, and of course... hit me with your thoughts/ideas!</p>
    <p>Cheers everyone.</p>
