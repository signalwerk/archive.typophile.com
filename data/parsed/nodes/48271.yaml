      <p>In one of the nodes you mention, 12226, Hrant posted two scans that have alternate letters for c, m, r and more.<br>
      Isn’t that what you’re looking for?<br>
      I have a small Dutch/Belgian Officina Bodoni catalogue that has a 16pt Zeno specimen text. Both versions of the r are used, not sure about the c and m. In the latter, the difference is pretty subtle. </p>
      <p>JM</p>
