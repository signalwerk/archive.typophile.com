    <p>According to Antonio Cavedoni, Giovanni Mardersteig’s Zeno has two shapes for c, m and r, long and short. Right now I plan to find images of this in “THE OFFICINA BODONI, AN ACCOUNT OF THE WORK OF A HAND PRESS, 1923-1977” which is in at least 2 libraries I will be visiting. But does anybody already have images of these? I only ask because I am excited to see them in context. A bit childish of me...</p>
