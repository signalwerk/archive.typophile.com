  html: |-
    <p>Interstate has been sold into the client as their new font, however, for consistancy I'd like to recommend the use of Interstate throughout the print applications rather than use a secondary font for body copy. This requires hard evidence to convince the client to move away from a serif typeface (currently Times New Roman)</p>
    <p>Your guidance please ...</p>
