    <p>Designed by <a href="/node/12323/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Richard Kegler</a> 2003 Published by <a href="/node/add/wiki?edit%5Btitle%5D=International%20House%20of%20Fonts" title="Create node &quot;International House of Fonts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">International House of&nbsp;Fonts</a></p>
    <p><span class="caps">P22</span> Platten is based on a lettering found in a German fountain pen practice book in the 1920s. (You may have seen the similar Speedball books in the <span class="caps">US</span>). This round tip pen lettering is comparable to the basic forms used grammar school teaching alphabets, but with a few original&nbsp;characteristics.</p>
