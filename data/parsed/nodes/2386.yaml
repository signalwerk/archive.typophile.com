  html: <p> This was a logo design I created back in 1995. I used rubylith to cut  hand shapes, then scanned and vectorized. It was personal work I created for the book "The new typographic logo" (ISBN 0-942604-55-5) Notice the i is a 1. Small text is set in Neo by Segura. <br>\image {Un1ty.jpg} </p>
