    html: <p> Tiffany, if you have fond memories of rubylith, you would probably enjoy listening to Dave Farey tell stories of cutting rubys for Letraset. That's how he cut his teeth, so to speak, in type. I think he used to give demonstrations at ATypI conferences. If I'm not mistaken, there was a plan to have him do a rubylith-cutting demo at this summer's TypeCon in Toronto, but at the last minute they couldn't get his scalpels  through airport security. (We use off-the-rack X-actos here in the States, but Dave uses his own custom, hand-crafted blades.) <br> <br>-- K. </p>
