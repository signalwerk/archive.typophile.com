    html: <p> I can appreciate the individual hands and spelling out the letters in sign language...but this doesn't hold together as a logo. I would suggest that "unity" implies the combination of site and sound and there are enough interesting charicatures to use them graphically. an example the dot over the eye could be and eye, the u or the y could be changed into sound type shapes. <br>but over all you want to have unity with site and sound. it goes hand in hand, eye to eye, and mouth to mouth. these are all important issues in comunication </p>
