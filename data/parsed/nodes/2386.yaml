    html: <p> Ole &amp; Kent -- Let's just say that I remember having to show my spot color with rubylith (and amberlith). I grew up around the business and so it is a very nostalgic thing. But, seriously, you really had to have, still have to have, total control over your knife when using rubylith, especially if you don't want to cut the shapes off the backing material. -- Dave Farey's demo would be a nice thing to see, similar I would imagine, to seeing someone doing the one-two jerk of throwing metal type. Let's here for the craftsmen! </p>
