    html: |-
      <p>André, you are right, those are too wide and too narrow. And you're right on italics as well. Will keep on going.</p>
      <p>Craig, my fonts are made mostly for display, and they are usually used in large point sizes. Therefore I make my fonts for use in 24+ size.</p>
      <p>It also makes better letter spacing in general: one can always track out the type, but many fonts can't handle the negative tracking. My fonts can.</p>
      <p>And Philips (1996type), you've just started type design, so perhaps you should take it easy with your comments for some time. I've seen your work.</p>
      <p>And here's a sample of my latest tight spacing with some 1 200 hand-made kerning pairs:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tart_5471.png"></div><br>
      (I changed the weight from Black to Heavy, to avoid any U.S. comments, and just now realized the irony.)<p></p>
