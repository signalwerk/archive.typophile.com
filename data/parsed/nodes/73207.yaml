    html: <p>I also agree that the o seems too wide or the a too condensed. It's seems there is two kind of typeface here, a condensed and a normal one. I think you should choose one of that two style. The italic is more interesting to me but the v, w are too extended. Take a look at you bdpq, at the join with the stem, I think it's too large. Keep going.</p>
