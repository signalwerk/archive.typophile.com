  html: |-
    <p>Hi Typophiles!</p>
    <p>My initials are d, l, and s, and they are really hard to put together into a personal logo. Believe me! This is my seventh official attempt at constructing a cool identity. I sort of want to convey professionalism and perhaps invoke a little mythology (a little hydra/lochness monster comes otu of it) while at the same time having my initials (a) evolve into each other and (b) come together as a what some might call a typographical swash or like something you might find in Adobe's Wood Ornaments type.</p>
    <p>I'd love your artistic opinions on it--I know it's not done yet, but I don't know what it needs exactly. It is coming off a little bit messy. I'd love to hear what you have to say so I can finally finish it! I'm attaching a larger version. Thanks again in advance!</p>
    <p><img src="http://typophile.com/files/7_3.jpg" width="400px" height="300px"></p>
