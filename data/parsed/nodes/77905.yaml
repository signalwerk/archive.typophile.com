    date: 2011-01-12T17:31:00
    date_raw: 12 Jan 2011 — 5:31pm
    votes: null
    html: <p>Perhaps you over-compensated the tilt in b .  To improve readability you could thicken the bowl of the d and perhaps close the gap of it's tip a bit more.  For the three top tips make the d's almost (but not quite) straight, the l's less so and keep the s's as is to have a progression of curvature.  And/or you can detatch the d from the set at the bottom making a small gap between it and the edge of a cursive capital L which remains joined to the s as it is now. That would need a flatter bottom curve of the L+s ligature.  I tried it it looks good that way.</p>
    html_clean: <p>Perhaps you over-compensated the tilt in b .  To improve readability you could thicken the bowl of the d and perhaps close the gap of it's tip a bit more.  For the three top tips make the d's almost (but not quite) straight, the l's less so and keep the s's as is to have a progression of curvature.  And/or you can detatch the d from the set at the bottom making a small gap between it and the edge of a cursive capital L which remains joined to the s as it is now. That would need a flatter bottom curve of the L+s ligature.  I tried it it looks good that way.</p>
