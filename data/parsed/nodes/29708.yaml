      <p>… this vision is also described by Dante in the <em>Divina Commedia</em>. Resonantor sympathetic nets formed interconnections through the whole system so that no event occurred alone. In this cosmos significant coincidences were naturals.</p>
      <p>Just pay attention, the intellect has little to do with the road to discovery, so innovation does not require starting from scratch. This is good, because you can’t start from scratch : the universe has been here for a while.</p>
      <p>In fact, successful innovation often happens simply because a curious person paid careful attention to how something in the world works. And once they really understood how people use that thing, they could see what was both good and bad about its value to those people.  With that understanding, a creator can apply their imagination towards new ideas that eliminate the bad and expand on, or leap-frog, the good. Technical brilliance may be the only way to realize that imagination, but it’s the ability to generate or recognize those meaningful ideas that drives the best kinds of innovation.</p>
      <p>Gerald Lange, it’s a pity you ignored the rest of the posts here, since you might have some good hints related to the hands-on nature of the creative typographic job for the book arts, I prefer to think you didn’t have got the time.</p>
      <p>Indeed time is fleeting, for the ambiguous, time is ambiguous ; for the hero the time is heroic ; for the whore, the time is just another game. If you are gentle, your time is gentle ; if you are in a hurry, time blows away ; time is a servant if you are his chief ; time is your god, if you are his dog. We are the creators of the time, the dupes of the time and the murderers of the time. Time is without time.</p>
