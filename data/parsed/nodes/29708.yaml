      <p><em>But as to promoting hatred of any form, reasonable people aren’t going to promote Nazism.</em></p>
      <p>Maybe not now, but in the 1920s and 1930s a lot of reasonable people jumped on to the Nazi bandwagon. That's why designers must be aware of  happenings past and present at local, national, and international levels. We must be able to spot the evil in the world, and at a minimum, not become a part of it.</p>
      <p>Personally I think that all accredited design education entities should be required to include instruction in ethical philosophy to ensure that students develop the mental faculties required make solid ethical decisions. Many business degrees now do so, and I feel that it's just as important for design professionals to understand ethics as it is for middle management to.</p>
