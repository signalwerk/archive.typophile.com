      <p><cite>but hey wait guys, what about NIKE? they use slave labour in 3rd world countries and what about that?</cite></p>
      <p>That's essentially the point of many previous posts: if a designer feels that a potential client's behavior is unethical, he or she should not take on the job. And when it comes to companies like Nike there are a lot of designers out there who don't take the work. There are design firms out there that do nothing but non-profit work for this reason.</p>
      <p><cite>I think, this is a very important point she made – a lot of designers, especially if they are just out of college simply do not have the choice.</cite></p>
      <p>That sounds more like an excuse than a well-reasoned maxim. In free nations, if a designer runs into ethical complications, he has the option to just not do the work. That might mean not working in a great design job, or even not getting paid to work in design, but a designer still has the option of not doing work he finds reprehensible.</p>
      <p><cite>Paul Renner was never a communist...</cite><br>
      In retrospect I should never have mentioned Renner. What I know of him is what's popped up in passing in survey texts, in which I have seen him painted as a socialist, communist, and other things.</p>
      <p><cite>I believe there’s a position open at the CIA for a graphic designer...</cite></p>
      <p>I've talked to people who had those jobs. The work is mostly internal document layout, although if you're really lucky, you get a job “designing” fake IDs.</p>
