      <p>Miss Giggles, No. As <em>human beings</em> we have a huge role to play in society. As designers, very few of us will possess an immense enough cultural impact to affect the world as designer. The beautiful advertising for the most vile corporations and causes shows that there is no shortage of capable designers willing to do dirty work. </p>
      <p>Some people are more bothered by working for and promoting Nikesque businesses than others are. Those of us most bothered will always try to find a way out. Unfortunately, its simply not easy. Even those who hold the most liberal beliefs in America are usually walking hypocritical nexuses, as they benefit from what they claim to despise, even indirectly. Want to free Tibet? Boycott China; good luck. Want organic foods? How do you think it arrived fresh at the Wal-mart that is bankrupting your home town?</p>
      <p>I am looking for the right charity to donate a portion of !Exclamachine sales to. To me, this is essential to the process of moving from just free toys to trying to make income from it. Interestingly, every person I've mentioned this to thinks it is a bad idea. I can't imagine it any other way. This is part of getting to be my own boss, no? It wont make a huge difference in big picture, but it will do something, I hope.</p>
      <p>These sort of struggles have nothing to do with being a designer, but with being alive.</p>
