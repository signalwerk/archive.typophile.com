      <p>Okay, okay... While topics like this bring up very good points, they can also border on being a bit too self-important.</p>
      <p>Do designers play a huge role in society? Sure. Let's back up a minute, because, so do custodial workers. Take a stroll through the streets of New York City on any given trash collection day to see just how big the role of custodial workers are on society as a whole.</p>
      <p><em>That might mean not working in a great design job, or even not getting paid to work in design, but a designer still has the option of not doing work he finds reprehensible.</em></p>
      <p>This comment can be made ONLY by a person who is not living in poverty. Too many people often forget that living in the United States, or even being a student affords you luxuries that other people around the world don't have the luxury of. Like eating daily for example.</p>
      <p>As a side note, on the Nike issue. Let me paint for you two pictures that I think are very similar, though they don't appear to be on the outside. Taking on Nike as a client is a lifestyle choice. Much like people in ghettos who choose to sell drugs. While one obviously appears to be more reprehensible on the surface, everyone has their own state of normal. Both households have mouths to feed. Both have a desire to attain material possessions.</p>
      <p>Different people from different financial brackets are presented with different options in life. So, before we all start pointing fingers about what is right and wrong— realize that many of us have a CHOICE in sitting down to eat our vegan meals. Most of us in this thread don't have to sell illegal drugs to feed our families. I challenge anyone here to spend two weeks in Afghanistan without a dollar in your pocket. Let's see what you do then.</p>
