      <p>Designers <em>can</em> play a huge role in society; most don't. Those designing for products that have a massive impact on the lives of people around the world, or those who get into the world of politics—which they often don't now, as the 24-hour news cycle has wiped out the time needed to work good design into politics—have to be careful about the ethical lines they might be crossing; I believe that most designers are doing quite well when it comes to ethical decision making. I think that this is in large part due to the glaring examples of what happens when designers go bad that we have left over from the twentieth century: all the great designers who worked tirelessly designing propaganda for the Nazi and Communist parties which then committed unconscionable acts against humanity that overshadow all other great evils of history. </p>
      <p>So as designers have to be vigilant, and be sure that none of us is designing the next <em>Mein Kampf</em> or <em>Little Red Book</em>. Designers need to be well aware of the world around them; the last thing western civilization needs is a new crop of great propagandists working for groups like ANSWER/The World Workers Party, Hamas, the Muslim Brotherhood, etc. We must also learn from the mistakes of the past, from artists like Paul Renner and El Lizzitsky whose work on behalf of communism helped condemn hundreds of millions of people to tyranny and  suffering, or worst of all, Leni Reifenstahl, whose Nazi propaganda work made her the the most influential filmmaker in history, in respect both to cinematic techniques and the millions her work condemned to gas chambers. By studying the ideologies of tyranny—fascism, communism, socialism, jihad, etc.—we can learn to recognize them and their methods, and ensure that we do not lend our efforts to their causes.</p>
