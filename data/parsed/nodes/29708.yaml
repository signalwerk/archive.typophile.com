      <p>Thanks for sharing that info about the National Design Awards. I couldn't have attended an awards ceremony at the White House either (not that I was invited lol) and that makes me respect those designers and their ethics.</p>
      <p>Part of Buddhism's eight-fold path is "right livelihood". I could beat myself up for not being a doctor or teaching inner city youth or volunteering to rebuild villages destroyed in awar. We can't fool ourselves that design makes that kind of difference in the world. One reason I've chosen to work in book publishing rather than, say, advertising or branding is that I find it easier to live with myself - I think the world needs more books.</p>
      <p>To quote Jimmy Ernst:<br>
