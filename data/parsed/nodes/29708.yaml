      <p>Hats off to Wolfgang and Alessandro for raising the level of this post! Thankyou gentlemen.</p>
      <p>As for MissG's original question – "what else should a designer keep in mind...", I'd say that the chief requirement is to keep that mind <em>open</em>.</p>
      <p>I worked for a couple of non-profits when I was a student; in hindsight it was an absolute luxury, and one that I could afford at the time. Lots of people simply don't have the choice. These days I occasionally use Papanek's blistering condemnation of the design and advertising industries (Design for The Real World, Paladin, 1972) as the raw text for typesetting exercises.</p>
      <p>Some long-held convictions of mine about design and ethical conduct got recently overturned by reading both the article and ensuing comments on Michael Bierut's designobserver blog about how five American 'star' designers boycotted a national design awards function at the White House in July of this year. It's at</p>
      <p><a href="http://www.designobserver.com/archives/015742.html" title="http://www.designobserver.com/archives/015742.html">http://www.designobserver.com/archives/015742.html</a></p>
      <p>and perhaps more importantly, James Victore's panelled discussion between Crye Associates and The 62, published by the AIGA, entitled <a ref="http://www.amazon.com/Fresh-Dialogue-Friendly-Voices-Graphic/dp/1568985827/sr=1-1/qid=1164600615/ref=pd_bbs_sr_1/104-0486363-1791103?ie=UTF8&amp;s=books" rel="nofollow">Fresh Dialogue 6: Friendly Fire</a> was a bold move to highlight some of these issues. It gave me the chance to reconsider what professionalism might really constitute in this context.</p>
      <p>If this kind of stuff genuinely interests you, MissG, keep reading and keep questioning (yourself as much as anyone else).</p>
      <p>James Puckett, you know I've told you before – on other threads here at typophile – to read the literature on Paul Renner before you go blackballing him as either a Nazi or a Communist. He wasn't either of those things. That other people on this thread are <em>still</em> telling you to read Christopher Burke's book shouldn't suprise me, but it does disapoint me. Likewise to shrug off your bias as originating in uncited texts that 'popped up in passing' does you no favours either. Doubtless you think you're 'reasonable people' too; after all you're on talking terms with CIA employees.</p>
