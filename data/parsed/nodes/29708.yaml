      <p>Renner was an interesting figure. One generation older than the modernists, he started as a traditionalist, but later he incorporated some of the views of the modernists into his work without sharing their political ideas. Nevertheless, the fact that he defended the ideas of the modernists against attacks from the Nazis made him loose his job as head of the Meisterschule in Munich. </p>
      <p>Christopher Burke: Paul Renner. The Art of Typography, published by Hyphen Press, is the best account of his life and work available in English.</p>
