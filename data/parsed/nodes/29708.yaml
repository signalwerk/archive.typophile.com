      <p><cite>One reason I’ve chosen to work in book publishing rather than, say, advertising or branding is that I find it easier to live with myself - I think the world needs more books.</cite></p>
      <p>I think that the world has too many books. At least, too many worthless piles of trash that pass themselves off as books. It's a shame that so many people can't tell the difference between something worthwile to read and something that atrophies their minds. </p>
      <p>Our real ethical challenge as Designers for Humanity™ is that there is so much STUFF bombarding people's eyes that it is hard to tell what is truly beautiful anymore. People hardly have any frames of reference to make sound judgements. Things are so muddy that there isn't a Yin or a Yang. There is only Gray chaos with a few bright spots here and there.</p>
      <p>The least we can do is try to be those bright spots by being dedicated to the traditions of our craft and continuously trying to make it even more useful and beautiful.</p>
