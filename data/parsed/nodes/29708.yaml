      <p>Last week there was an interesting forum about this topic in London:<br>
      eye magazine organised a panel discussion called ‘Burning Issues’.<br>
      <a href="http://eyeburningissues1.typepad.com/forum/" title="http://eyeburningissues1.typepad.com/forum/">http://eyeburningissues1.typepad.com/forum/</a></p>
      <p>One of the four participants in this panel, the designer Lucienne Roberts, said that of course she is thinking very carefully for which clients she is working for (and for which ones she certainly doesn’t), but she didn’t forget to add that she was in the fortunate position to choose.</p>
      <p>I think, this is a very important point she made – a lot of designers, especially if they are just out of college simply do not have the choice. They are lucky if they can get any work at all. But that doesn’t mean that it has to stay like this throughout one’s carrier. The more experience we gain, the more this enables us to make choices – some people choose to go with the stream, some don’t. It is a certain luxury to be able to make choices, and this doesn’t develop by chance – it is the result of a deliberate effort. Responsibility grows with the freedom of choice. </p>
      <p>Design is taking place not in a vacuum or in an ivory tower, but in a certain social and economic environment, largely determined by politics. </p>
      <p>Whereas it would be very naïve to think that design can ‘change things’ and it is quite safe to say that the notion of the designer as some sort of self-declared saviour is undoubtedly the result of delusion nourished by vanity, it is also quite irresponsible if we designers prefer to think not about what the effects of our daily work are.</p>
      <p>The designer has a responsibility – a professional one to one’s client (to deliver excellent, good or at least decent work in time and on the previously agreed terms) as well as an ethical one (do we think that the result of what we are doing is helping to promote ideas that we think are worth to be promoted or at least do not cause harm?) – in the same way as any other profession has. It is up to anyone of us to make decisions how we want to deal with this responsibility and how far we want to take this responsibility serious or not.</p>
      <p>The best way to increase the effect of what we are doing is to work on our qualification, the best way to increase our judgement on ethical questions is trying to be informed about the political and economic framework in which we are working (which is easier said than done, especially if we live in states that are quite actively engaged in conflicts).</p>
      <p>BTW:<br>
      Paul Renner was never a communist, he never promoted revolutionary ideals (and therefore was harshly denounced by Tschichold – behind his back, which was probably not very fair by Tschichold, since it was Renner who invited Tschichold to teach at the Meisterschule in Munich). In fact, he was a conservative liberal who just cared about social issues.</p>
