      <p>Hi guys, thanks for the feed back. As for the feeling it was a bit intended. I was trying to give it two levels of reading. The first is the literal one, the black blocks of proportion. But what I was really aiming for was a second level, the one where after you’ve been ’smashed’ by the simple and almost naked feel of the message you can go deeper and find out that even if the E block is so big, you couldn’t have the protocol if there weren’t any Z’s (35 only).</p>
      <p>So, if you want, for as much as the signature from the USA is needed on the protocol (the USA are obviously the E) you still need us mere mortals and Z’s to have the protocol.</p>
      <p>Eric, I agree with your point of view on the placement of the letters and has I didn’t want to use all caps (because it’s not in the feeling of a protocol text) it is really my own incapability to find a better way of dealing with it. And yes, it is a first of a series of work I want to do around this document but mostly because of being worried about global warming. I’ll be annoying you very soon.</p>
      <p>All the best</p>
      <p>Pedro Monteiro<br>
      <a href="http://whatype.wordpress.com/" title="http://whatype.wordpress.com/">http://whatype.wordpress.com/</a></p>
