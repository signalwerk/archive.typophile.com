      <p>Hi Pedro,</p>
      <p>Well, I could say I am both. My family immigrated to Brazil in the sixties. Then returned to Portugal after becoming a EU member (1986).  My great grand father, Cristovam Colombo da Silva, immigrated to Brazil in the beginning of the 20th century and worked forever in the railway (REFER EP). He too come back to Portugal when he retired. So, yes, I have the discoverer blood.</p>
      <p>As for the pumpkin, it is that the halloween pumpkin is suppose to inspire chills, but ends up in candy for the kids. I guess the pumpkin symbol in the Kyoto project of yours would add a subliminal ’chill’, that is maybe more universal then black boxes. The boxes are ok, I just wanted to add a thought to you idea.</p>
      <p>Salud! E viva ó Sporting!</p>
      <p>André</p>
