    <p>Hello again,</p>
    <p>I would like to have your opinion of this poster I’ve made to post on my blog. The idea was to show how every little thing can make a difference.For that I counted every word used on the Kyoto Protocol text and created a way of showing the different proportions between all the letters used. When I’ll post this on my blog I will explain all the design process. The type used is Helvetica.</p>
    <p>What do you think of it? How would you improve it? I’d really appreciate to ear from you.</p>
    <p>Thank you so much</p>
    <p>Pedro Monteiro<br>
    <a href="http://whatype.wordpress.com/" title="http://whatype.wordpress.com/">http://whatype.wordpress.com/</a></p>
