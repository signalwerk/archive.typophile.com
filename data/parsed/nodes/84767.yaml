    html: |-
      <p>Nik, before you get stuck in the typography, think about the message. You have one good thing going for you, a unique name. If you are starting out wearing more than one hat, build a generic brand that you can change or attach a generic tagline to e.g. webhead. You can explain on your business card or website more about what you do, the key here is to make your presence known and define the industry you work in - as you are obviously a jack of all trades.</p>
      <p>When starting out you want to get attention or at least be memorable. I agree with the others the big N is a waste of time and takes the focus off your name.</p>
