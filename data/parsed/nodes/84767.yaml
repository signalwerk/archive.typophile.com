    html: <p>Among the other things mentioned above, the condensed gothic style typeface doesn't really speak to me on behalf of someone who works in technology. It could probably work if you had an overall retro thing going on, like a modernized revival of an old 1940's radio repair company. But in this case I would try to go with a more refined looking typeface.</p>
