    html: |-
      <p>I definitely use a Turkish language system tag and appropriate special mappings in the  feature ( doesn't need special handling for Turkish). Adobe's view, I believe, is that the application should do buffered case conversion before applying the  feature, so it technically should not be necessary for fonts to handle this in lookups. The idea is that when the user applies , the application will perform character based conversion to uppercase, taking into account special casing rules for Turkish text, and then apply the  lookups.</p>
      <p>I'm not convinced, either by the idea or by the likelihood of it being implemented in this way outside of Adobe apps, so I continue to handle this directly in the  feature. The nice thing is that implementing it directly in the  feature for Turkish does not interfere with the buffered casing approach, so either implementation can be performed with the same font.</p>
