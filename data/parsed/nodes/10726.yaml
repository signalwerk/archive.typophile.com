    html: <p>Walter Tracey goes into this in depth in <i>Letters of Credit</i>. Basically, if I remember correctly, the proportions of Times New Roman were based off of an old (original ?) cut of Plantin. <br> <br>The bold, which was developed later by Monotype's drawing office (without Morison?) was designed so that each letter has the same width as the Regular. This is why the bold looks so terrible</p>
    html_clean: <p>Walter Tracey goes into this in depth in <i>Letters of Credit</i>. Basically, if I remember correctly, the proportions of Times New Roman were based off of an old (original ?) cut of Plantin. <br> <br>The bold, which was developed later by Monotype's drawing office (without Morison?) was designed so that each letter has the same width as the Regular. This is why the bold looks so terrible</p>
  - id: 67476
    user: 1250
    date: 2004-09-26T15:18:00
    date_raw: 26 Sep 2004 — 3:18pm
    votes: null
    html: "<p>Another thing about the Bold is that it has vertical stress while the Regular's is oblique (see the \"o\"). From what I understand this was a practical thing: the Bold was mainly intended for use for headings in The Times newspaper, and some people* think vertical stress is better for news. <br> <br>* Earlier this year JFP pointed out that many people report getting uncomfortable viewing fonts with oblique stress. I think this makes sense, although it's probably confined to deliberative reading; I think oblique stress probably improves immersive reading. Same thing with serif versus sans, btw. <br> <br>hhp</p>"
    html_clean: "<p>Another thing about the Bold is that it has vertical stress while the Regular's is oblique (see the \"o\"). From what I understand this was a practical thing: the Bold was mainly intended for use for headings in The Times newspaper, and some people* think vertical stress is better for news. <br> <br>* Earlier this year JFP pointed out that many people report getting uncomfortable viewing fonts with oblique stress. I think this makes sense, although it's probably confined to deliberative reading; I think oblique stress probably improves immersive reading. Same thing with serif versus sans, btw. <br> <br>hhp</p>"
  - id: 149804
    user: 1203
    date: 2004-04-10T01:47:00
    date_raw: 10 Apr 2004 — 1:47am
    votes: null
    html: <p>Times is actually one of my favourites. It is neutral, and lets the text content be in the focus.  And now I'm not talking about the 12 point Linotype Times version that comes with most printers. It is too condensed and has too much contrast to work well as a body text face in my book. Take a look at Times Ten, Linotype's 10-point version, which is thicker, wider and has less contrast. Very good for body text.</p>
    html_clean: <p>Times is actually one of my favourites. It is neutral, and lets the text content be in the focus.  And now I'm not talking about the 12 point Linotype Times version that comes with most printers. It is too condensed and has too much contrast to work well as a body text face in my book. Take a look at Times Ten, Linotype's 10-point version, which is thicker, wider and has less contrast. Very good for body text.</p>
  - id: 149805
    user: 1203
    date: 2004-04-11T05:04:00
    date_raw: 11 Apr 2004 — 5:04am
    votes: null
    html: <p>Morison never intended to create a stunning, beautiful typeface with Times New Roman. It was purposely made to be neutral and free from bells and whistles. There is a charm in that approach too, I think. I do like old classic typefaces like Jenson, though.  But it doesn't fit in every situation. Imagine a bill set in Adobe Jenson... <br>There's a reason that Times is "overused", not only the fact that it comes with printers. It is simply a good and versatile typeface (as long as one doesn't use the 12-point version for body text that is).</p>
