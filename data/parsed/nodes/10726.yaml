  - id: 67466
    user: 2172
    date: 2004-04-11T09:06:00
    date_raw: 11 Apr 2004 — 9:06am
    votes: null
    html: "<p>I have to use Helvetica Condensed and Times for our corporate typefaces. I'm sick of both. Times is flat, dead, unpleasant, and tricky to set in a manner that doesn't hark back to its intended use, which is (of course) not what we need it for. <br> <br>A close second for me is Gill Sans. There are a lot of unoriginal art directors out there working for big manufacturing companies, and they love their Gill. A lot of our work has to take on the look of our business partners, so we routinely work with a variety of 'identities'. I'd kill to work with faces like DIN or Minion on a regular professional basis, overused or not. <br> <br>I run into a lot of Adobe Garamond, but for some reason that doesn't bother me so much. ::shrug:: <br> <br>I think the reason that Times and TNR are so overused is a) default b) <i>free</i> c) the apocryphal story about how it's the 'most legible' typeface. <br> <br>TNR isn't terrible at face value, I just wish people would set type on long measures that was intended for long measures. Also, most people use 12 pt for the same reasons, it's the default. Plus, it makes their writing appear longer. I think the default should be set to Zapf Dingbats. Force people to make their own decisions and set up their own defaults. ::thumbs nose at Microsoft Office::</p>"
    html_clean: "<p>I have to use Helvetica Condensed and Times for our corporate typefaces. I'm sick of both. Times is flat, dead, unpleasant, and tricky to set in a manner that doesn't hark back to its intended use, which is (of course) not what we need it for. <br> <br>A close second for me is Gill Sans. There are a lot of unoriginal art directors out there working for big manufacturing companies, and they love their Gill. A lot of our work has to take on the look of our business partners, so we routinely work with a variety of 'identities'. I'd kill to work with faces like DIN or Minion on a regular professional basis, overused or not. <br> <br>I run into a lot of Adobe Garamond, but for some reason that doesn't bother me so much. ::shrug:: <br> <br>I think the reason that Times and TNR are so overused is a) default b) <i>free</i> c) the apocryphal story about how it's the 'most legible' typeface. <br> <br>TNR isn't terrible at face value, I just wish people would set type on long measures that was intended for long measures. Also, most people use 12 pt for the same reasons, it's the default. Plus, it makes their writing appear longer. I think the default should be set to Zapf Dingbats. Force people to make their own decisions and set up their own defaults. ::thumbs nose at Microsoft Office::</p>"
