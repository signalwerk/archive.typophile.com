      <p>October 1st is the launch date, so today is the last "7", and tomorrow the last weekend edition of the present format.</p>
      <p><em>I assume this has nothing to do with the new (/old) ownership.</em></p>
      <p>Right. It's been two years in the works.<br>
      The main factor is new presses, enabling full color throughout, which they don't have at the moment, and the option to print (some sections) on coated stock. And the size of the standard north American web press roll has been further reduced. </p>
      <p>Generally, the paper paper is becoming more magazine-y, as much of the traditional news function has gone to broadcast media and online. Redesigns also spike readership and generate buzz with advertisers, as well as addressing many content-driven issues.</p>
