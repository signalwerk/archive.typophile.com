      <p>David, no plans to write about process, at the moment, except in the next few minutes.<br>
      No Cartier influence.<br>
      It was David Pratt's idea in the 2007 redesign to adopt an ultra-modernist layout, and balance its austerity against old style/humanist faces, rather than the usual "moderns" used for newspapers in North America.<br>
      The Globe sees itself as a leader, although perhaps more willing to buck trends in the 2007 redesign than this year's.<br>
      The 2010 redesign, by Adrian Norris, adapted the Pratt faces to an all-serif look, with optical sizes.<br>
      So those fonts are just my idea of what the old style could look like in a newspaper.</p>
      <p>Of course, I think it would be nice if Canadian typographers used more Canadian fonts (instead of Helvetica and H&amp;FJ), but that's the way things are, and as the majority of my font sales are to the US, who am I to complain?! I do get the occasional Canadian commission -- although not as many as Canada Type, for some reason :-)</p>
