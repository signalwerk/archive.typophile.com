    html: |-
      <p>I subscribe to the Globe and look forward to it almost as much as my morning coffee. I'm trying not to be a stick in the mud, but I'm worried about this new development.</p>
      <p>Here are some drawbacks to the redesign:</p>
      <p>1. I am distressed to hear that "there's not going to be much sans serif from now on." The sans serif type on the pages of the Globe is one of the big reasons I like this newspaper;</p>
      <p>2. A recent call to customer service informed me that the delays in delivery that an open letter warned about will actually mean that the paper will arrive at about 10 a.m. That doesn't suit my needs for a daily morning paper, so I have arranged to put my subscription on hold until the delivery can be made early again (a week or two, from what I was told);</p>
      <p>3. What's wrong with black and white pages? There's nothing with more contrast that black on white. It's legible and most photojournalism worth its salt looks great in grayscale; and</p>
      <p>4. If the above sneak peek is a good indication of what's to come, there will be less news content on the front page. The trend of selling the inside of the paper on the cover is not so new, but it doesn't mean I have to like it either. The Globe's new look is not as extreme as what I get with my other daily newspaper subscription (The Winnipeg Free Press — image below from Wikipedia), but in my opinion, it's not as good a front page as what the Globe has been doing for the past few years.</p><div class="imageWrap"><img src="https://web.archive.org/web/20150123234532im_/http://typophile.com/files/freep_cover_6492.png"></div><p></p>
      <p>With that said, I am pleased to see that the Globe and Mail is "still a good client" of Shinntype, so I will try to be optimistic.</p>
    html_clean: |-
