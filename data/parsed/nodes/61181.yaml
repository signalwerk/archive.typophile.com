  html: |-
    <p>I copied a piece of text with numbers from a file since I wanted to use the font to create another set of numbers. The trouble is when I type the new numbers, they look different ("2") and the numbers fall below the baseline ("7").</p>
    <p>Bearing in mind it is the same font with exactly the same properties (baseline shift, character styles, paragraph settings, etc.) I cant seem to understand the problem. </p>
    <p>I can use the original text of numbers to create the new set of numbers but I want to understand what the problem is. Please help!!!</p>
    <p>In the image, the numbers above is the result and the numbers below is the source from where I copied the numbers</p>
    <p>Font: Prelo Sans Light 7pt</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Picture-1_4612.gif"></div><p></p>
