    <p>Hey folks,</p>
    <p>Really hoping you can help me out.  I've tried WhattheFont and a few others, without any luck.  Can someone take a look at this logo:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Team-new-color-print_4313.jpg"></div><p></p>
    <p>Any idea what font this is?  I work for the station and I'm working on some material for some handouts, but no one seems to know the name of the font we used back when we created the logo. </p>
    <p>Thanks in advance!</p>
    <p>Brock</p>
