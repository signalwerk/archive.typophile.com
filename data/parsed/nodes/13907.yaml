      <p>Jacob,</p>
      <p>I would say something like 1A.</p>
      <p>I totally agree that the modern logo clashes with the more traditional look of the website.  So in my opionon, the typeface in A would suit the site perfectly since it's more traditional looking than the site.</p>
      <p>For example, a script logo could go perfectly with some modern techno-ish layout, while you really can't have an ultra-modern logo with some really traditional serif fonts.  But that's just me.</p>
