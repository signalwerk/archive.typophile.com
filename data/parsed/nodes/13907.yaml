      <p>J.<br>
      First impressions are that the strap line is way too close to the logotype and that the initial caps are distracting, I realise that initial caps have been used in the website but it really isn't doing the company a favour to prolong that. The strap is also very small considering the uses it might be put to, I think for reproduction purposes you might need to go to the full measure of the logo.<br>
      The kerning, especially F, is too tight except in the area it needs tightening Wo. Seeing the tree at that scale the root system needs some attention, due to its jagged style it could appear that the tree is being pulled up from the ground. I find the serif face too organic, approaching a tree nursery or similar.<br>
      Tim</p>
