    <p>Hi,</p>
    <p>I'm working on a redesign of a website for a small business consulting group ( <a href="http://www.thewoodlandgrp.com" title="http://www.thewoodlandgrp.com">http://www.thewoodlandgrp.com</a> ). However, I feel like the firm's current typography used in the logo is working against the spirit of the organization. </p>
    <p>The current logo is set in Camellia and a bright yellow/green. This modern look conflicts with the organic nature of the firm's collaborative process, symbolized in the logo.</p>
    <p>The image of a tree connects to the tagline "Nothing changes until action is taken at the root level." The tree's leaves serve as a symbol for a company's products/productivity, which only can fully be achived with internal growth, embodied in the roots. </p>
    <p>Some options to ponder:</p>
    <p>• The logo to the left (1) or set among the text (2)<br>
    • Type options A, B, C, D<br>
    • Am I crazy and the original is fine</p>
    <p>Thanks for any guidance!<br>
    Jacob</p>
