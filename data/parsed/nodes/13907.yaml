      <p>Well, your certainly not crazy. The current logo leaves much to be desired. Why is "LLC" bigger than the company name? The choice and weight of the font speaks little of the company's services.</p>
      <p>The tree is too complex and detailed. It needs simplification. Of the choices you offer, I'm inclined towards A, BUT I would explore more typefaces.</p>
      <p>I echo the above suggestion about not setting the tagline in all caps and dropping the horizontal line. Take everything away, and work with the letterforms. Consider a vastly simplified tree, ala olympic iconograms.</p>
