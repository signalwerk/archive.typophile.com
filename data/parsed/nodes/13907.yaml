    html: |-
      <p>Hi Jacob,</p>
      <p>I think the logo's a bit much... I'm not sure about the choice of typeface, maybe using a more contemporary serif (Stone?) might pull it round a bit. I agree with the post about dropping the line. The current logo kind of looks like a bit like a  bar or club (with a bizarre tree theme!)</p>
      <p>I know the tagline might be part of the registered name of the company, but that doesn't necessarily mean that you can't drop it from the logo... as long as you state it on the letterhead itself (i.e. where the registered office etc., details go)... the previous logotype kept it simple. I suppose it depends on how the company is known. If a company is limited company (which would  technically be part of the  company's name), you don't necessarily have to put it on the logo, as long as it's stated somewhere on the letterhead.</p>
      <p>Also, the tagline has a typo in it - you've got a superfluous T on 'through'.</p>
      <p>Is there any way of getting the tree refined?... is there any way of making a more abstract representation of the roots - I know that there's a important underlying reason for displaying the roots, but they don't seem friendly to me at the moment. Maybe a pictogram approach would be a friendlier approach. What about symbolising internal growth through the rings of a tree instead? Just a thought...</p>
      <p>Hope this helps</p>
      <p>Si</p>
