      <p>That's strange, since it's listed as being installed by default on the matrix. Something to note is that Andale Mono is also available as part of the core web fonts released by Microsoft way back when, so it's even freely available to those running Linux (or any other computer that doesn't have it) if they choose to install it.</p>
