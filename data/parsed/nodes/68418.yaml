      <p>Looking at your criteria, I'm wondering if you've ruled out a monospaced font? It wouldn't be good for the web page as a whole, but would it be possible to use just for the formulas?  Andale Mono is as prevalent as Trebuchet and differentiates between I, 1, and l. It presumably matches well with Verdana or other Microsoft web fonts.  You could then include Bitstream Vera Mono/Sans (or a variant like Deja Vu) for Linux users. I've never tried to set chemical formulas, so I don't know how that would work.</p>
      <p>st</p>
