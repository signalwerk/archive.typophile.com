    <p>Hi,</p>
    <p>I'm working on the redesign of a web application used in the chemistry industry. Lots of screens display chemical formulas next to the name of the formula itself.</p>
    <p>The choice of a correct font stack is important to my opinion, especially when lots of these formulas are displayed in a table column. The wrong typeface could slow down the reading process dramatically, or worse make some character combinations completely unreadable.</p>
    <p>What I'm currently looking at is how readable subscripts are at certain sizes, and if the typeface contains troublesome characters (eg: lowercase-l compared to uppercase-i). Based on this <a class="freelinking external" href="http://media.24ways.org/2007/17/fontmatrix.html">font matrix</a>, I found that Trebuchet may be a good choice—it seems to be the only one where the lowercase-l having has a curved end.</p>
    <p>Trebuchet is widespread, which makes it a good candidate. What I don't like is all the other incongruities which I think make it look not very professional.</p>
    <p>My questions are:</p>
    <ol>
    <li> do you think I'm using the good approach?</li>
    <li> do you have better a recommendation than Trebuchet?</li>
    <li> or if not, what other typefaces would you suggest in the stack, should Trebuchet be missing on the user's platform?</li>
    <li> and finally, is there any typeface that would complement it well and be better suited for setting texts with a professional tone?</li>
    </ol>
    <p>I hope it all makes sense and I welcome any suggestion. Thanks in advance.</p>
