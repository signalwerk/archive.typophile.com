    html: |-
      <p>I suspect it is a custom piece of type, not an actual typeface.</p>
      <p>You could start with something like Agenda Condensed Black, convert it to outlines, and tweak the bezier curves on the Ds and T:<br>
      <a href="http://www.myfonts.com/fonts/fontbureau/agenda/" title="http://www.myfonts.com/fonts/fontbureau/agenda/">http://www.myfonts.com/fonts/fontbureau/agenda/</a></p>
      <p>Stumpy Black might also make a good starting point:<br>
      <a href="http://www.myfonts.com/fonts/jonahfonts/stumpy/" title="http://www.myfonts.com/fonts/jonahfonts/stumpy/">http://www.myfonts.com/fonts/jonahfonts/stumpy/</a></p>
