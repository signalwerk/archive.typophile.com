    html: |-
      <div class="comment-spam-body"><p>Good call Kevin. Agenda Condensed Black<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/AgendaCondBlackasDOT_4842.gif"></div><br>
      is really close to the letterforms. Convert the straight strokes to curves, add mid points, and shift the corners inward to produce the effect of thickening towards the middle, and the logo appears, complete with smiling counters :)<br>
      Here is _T_ with the original shown in red and the transformed letter in black <div class="imageWrap"><img src="http://typophile.com/files/AgendaCondBlack_T_Transformed_5755.jpg"></div><br>
      Same process for _D_.<br>
      Don<p></p>
      </div>
