    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Jürgen Weltin</strong></p>
    <p>Jürgen Weltin (born 1969) is a graphic designer specializing in type design, logos and logo lettering. He started his first typeface <a href="/wiki/Finnegan" class="freelinking" rel="nofollow">Finnegan</a> in 1995 as a student, which was later published by Linotype in 1997.</p>
    <p>He worked as an employed graphic designer in Germany and later as type designer for <a href="/wiki/The%20Foundry" class="freelinking" rel="nofollow">The Foundry</a> in London. After deciding to settle in Germany he began working in his own studio.</p>
    <p>In 1999 he was awarded the D&amp;AD award for the telephone book typeface <a href="/wiki/Yellow" class="freelinking" rel="nofollow">Yellow</a> for British Telecommunication plc. which he started in February 1998 for The Foundry and that needed to be finished in only three months. In 2001 he received Certificates of Excellence in Type Design both for Linotype Finnegan and Yellow by bukva:raz! international type design competition.</p>
    <p><a href="/wiki/Balega" class="freelinking" rel="nofollow">Balega</a>, a stencil-like display font, was designed in 2002. Balega's letters are very bold, and have a slight italic slant. While some of the uppercase forms appear somewhat sharp, the lowercase is definitively round and friendly. Text set in Balega has a very forward moving motion giving the typeface a very dynamic feel.</p>
    <p>In 2007 Linotype published his large humanist sans serif type family <a href="/wiki/Agilita" class="freelinking" rel="nofollow">Agilita</a>.<br>
    With his wonderful wife and two daughters he lives in a house south of Munich, Bavaria. He claims to be the fastest type designer on a bicycle.</p>
    <p>External link:<br>
    <a href="http://www.typematters.de" rel="nofollow">type matters</a></p>
