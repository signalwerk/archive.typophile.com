      <p>Hi Grendl</p>
      <p>It wasn't too long ago that I was in the Naples area. Pompeii has some lovely examples of ancient hand-tooled type.</p>
      <p>Depending on where you're planning on going, it may be a little out of the way, but the paper museum in Amalfi is a real insight - they only stopped making paper in the sixties, and the Vatican still source their paper from them (now produced in an off-site fanctory), due to cotton's longevity as opposed to paper derived from wood. If there's a guide they're quite happy to show you the old factory with the old equipment, including how the cotton pulp is gathered and pressed. The tradition for local paper making is also being kept alive by a workshop just down the road. Will actually be writing a blog post about it shortly.</p>
      <p>Enjoy your travels.</p>
      <p>James</p>
