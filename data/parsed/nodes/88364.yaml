    <p>Hello all:</p>
    <p>I'm headed to Naples for a week in January... does anyone have any recommendations? Of course I'm going to Pompeii and Herculaneum, and Naples' exquisite ossuaries. If you have any suggestions of manuscript, typography, printing museums, and/or cemeteries and restaurants for this calligrapher/typophile/gourmet/Goth, they would be much appreciated! </p>
    <p>Thank you so much,<br>
    Grendl.</p>
    <p><a href="mailto:grendl_lofkvist@yahoo.com">grendl_lofkvist@yahoo.com</a></p>
