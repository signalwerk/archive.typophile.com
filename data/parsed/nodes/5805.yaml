    html: <p>The closest I can think of that has only lines above the letters is <a href="http://www.myfonts.com/fonts/linotype/simran-itc/simran-itc/testdrive.html?s=ABCDEFGHIJKLMNOPQRSTUVWXYZ&amp;p=24" target="_blank">ITC Simran</a>. Most of the uppercase letters have 'overlines', as you called them, but some of those with ascenders do not. <br> <br>I know two fonts with lines over and under the letters, but that doesn't seem to be what you want. <br> <br>Offhand, I would say using a blank underline in the line above a character would be your easiest method to accomplish this. Depending on the application you are using (such as Word?), that might not be easy, because of the ways MS tries to 'help' you format everything.</p>
