    html: <p>Apparently, you can have overlining if you can use Unicode -aware software. See the <a href="http://www.myfonts.com/unicode/203e/" target="_blank">information from MyFonts.com</a>. <br> <br>I tried my suggestion about a blank underline above the letters, and it would only work in Word if you used a Tab.  Not likely to be useful that way. <br> <br>I also have the nagging impression that I saw a new font recently that had an overline for all the lower case characters, but I can't recall where I saw it. <br> <br>I think the Unicode approach sounds the most promising, if someone knows of applications that can use that protocol.</p>
