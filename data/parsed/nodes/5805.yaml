    html: <p>Hmm, got new info from dad - apparently, what he really wants (wish he'd told me earlier) is just the lowercase letters 'bcdnpqstu' be available "overlined", and, preferably, all the standard letters and numbers in the same style.  At least if I end up creating the font from scratch, I won't have a lot of work, heh... <br> <br>Out of curiosity, could you post the links to the two fonts you mentioned with lines over and under, Mike? <br> <br>Doubtful if blank underlines will work in Powerpoint. Any sensible program, yeah, but I doubt it as far as MS is concerned. <br> <br>As far as the Drawing thing is concerned, yes, I know about that, thank you, Bill.  The problem is that drawing these every few seconds is bound to get tiring, and the slideshow my father's preparing is gonna be full of them. <br> <br>Unicode-wise, I'll have to see if I can work that into Powerpoint - might be my best chance yet (though I still doubt MS products and their workability, so we'll see). <br> <br>Anyway, thanks!</p>
