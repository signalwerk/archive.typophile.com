    <p>Hi all,</p>
    <p>I've just read about James Joyce's Copenhagen Cats apparently being 'illegally published' in the UK. It's format is DOUBLE ELEPHANT SEXTOS. Amazing! </p>
    <p>Can anyone think of other whacky vintage (or otherwise) typotalk? </p>
    <p>Nut, mutton, etc don't seem to live up to DOUBLE ELEPHANT SEXTOS!</p>
