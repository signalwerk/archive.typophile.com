      <p><em>Sexto</em> here is short for Decimo-sexto, also abbreviated 16º or 16mo (and sometimes called “sixteenmo”). </p>
      <p>So this “illegal” publication of <cite>Copenhagen Cats</cite> was printed on double elephant–size paper (about 26.75 × 40 inches) and folded in sixteenths (which makes 32 pages per signature).</p>
      <p>So the trim size on this edition was around 6.6875 × 10 inches.</p>
