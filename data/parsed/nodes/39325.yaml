      <p>Mark -</p>
      <p>Triumvirate was produced digitally by Agfa Fonts for the Mac back (I think) in the early ’90s.<br>
      Alphatype’s Claro - was really, really weak as a Helvetica. Our shop loved getting in the Berthold one - and Len Leone Sr., the art director of Bantam Books at that time - really took notice to our Helvetica. I think I shared that story here before, so I won’t do it again.... but hey, it was a good, positive sign for my typeshop... </p>
      <p>Also, you may remember that the Helvetica on film for typositor was also very different from the digitized versions for Alphatype, Harris, Compugraphic, Linotype and forgive me for all the other typesetting equipment I didn’t name that bit the dust.</p>
      <p>One of my favorites was from Castcraft — Helvetica Advertising. It had lower case the same height as upper case - and it was wonderful for ad copy.</p>
