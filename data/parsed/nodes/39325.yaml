  - id: 241754
    user: 1043
    date: 2007-11-24T09:45:00
    date_raw: 24.Nov.2007 9.45am
    votes: null
    html: <p>The old clones were mainly a result of the fact that fonts from one manufacturer’s equipment could not be used in another’s. In effect, there is only one kind of typesetting machine now, and fonts are for the most part interchangeable. If you want to set type in Helvetica, you don’t need to by your “typesetting machine” from Linotype anymore. You just need to license the font.</p>
    html_clean: <p>The old clones were mainly a result of the fact that fonts from one manufacturer’s equipment could not be used in another’s. In effect, there is only one kind of typesetting machine now, and fonts are for the most part interchangeable. If you want to set type in Helvetica, you don’t need to by your “typesetting machine” from Linotype anymore. You just need to license the font.</p>
