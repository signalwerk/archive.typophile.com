    html: <p>I worked at some publications back in the Seventies that had Compugraphic or AM typesetting equipment in house. Their respective versions of Helvetica—Helios and Megaron—were noticeably different, but superficially similar to Helvetica. I remember wishing we could afford to send out for type from a shop that had Linotype equipment because the knock-offs didn’t look quite like the real thing. Another common off-brand Helvetica back then was Aphatype’s Claro. Compugraphic released an exact copy of Helvetica in the early Eighties called Triumvirate. (Now that I see the name again, “Megaron” sounds like the name of a Japanese movie monster.)</p>
