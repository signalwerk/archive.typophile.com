    date_raw: 24.Nov.2007 8.58am
    votes: null
    html: <p>I think it’s interesting how clones and metrically compatible fonts have been effectively “retired” as foundries have consolidated. From the “old days” what do we have in every-day use? Swiss (as seen in the recent Sony eReader) and Arial, and even Arial has been ‘retired’ as a default in Office. On the other hand in the past ten years we’ve seen several new fonts based on Arial’s metrics.</p>
