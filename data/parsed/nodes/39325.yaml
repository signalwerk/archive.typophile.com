      <p>Yes, I remember Triumvirate was released by Agfa (before it joined up with Monotype) when they first started selling PostScript Type 1 fonts in the early Nineties. It seemed like a strange idea to me at the time. Why would you buy it if you could get the real thing?</p>
      <p>The film headline fonts of Helvetica were based on the metal foundry type for display sizes. Most of the current digital versions are based on Linotype’s machine-set metal version, which were all designed for 18-point or smaller. The display sizes in metal were always more elegant and refined, no matter what typeface it was. Sadly, most of the digital versions of the old standbys are based on text sizes. URW has digital versions of both for some faces (designated with a T for text or a D for display), as does Bitstream (with the word “Headline” in the name). Check out URW’s Nimbus Sans D and you will see the Helvetica you remember.</p>
