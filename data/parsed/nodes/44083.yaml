    html: <p>I almost think it would be cheaper to buy a ream of paper from staples than to find 8 1/2 by 11 newsprint. Someone feel free to correct me if I’m wrong. However, I’ve run newsprint through a laser before (b&amp;w at least) with no problems.</p>
