    <p>hey, guys.</p>
    <p>i’m kinda new to printing en masse.  but i had a quick question.  i’m about to start a small Zine for my enjoyment.  I will probably use newsprint, and i dont need it super-high Rolling Stone quality AT ALL, but my question is this:  is it possible for a laser printer to print on newsprint?  or would i have to go elsewhere for that?  should i just use plain printing paper? or is there another medium like newsprint that i havent come across?  i want to keep it as simple as possible, and it just has to be readable.  maybe even enjoyable.  thanks for your help, guys.<br>
    J</p>
