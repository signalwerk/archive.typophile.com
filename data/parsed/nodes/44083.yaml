    html: <p>True newspaper paper can’t even go though an offset press, let alone a laserprinter. Alternatives are some heavier stock of recycled paper that can look like news stock. The only way to do small runs is to gently silkscreen on news stock, but ink will seep through the paper to the other side.</p>
