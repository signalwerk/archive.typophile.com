    <div class="imageWrap"><img src="http://typophile.com/files/IMG_0224_4484.JPG"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/IMG_0227_4634.JPG"></div><p></p>
    <p>You can see more here: <a href="http://printpattern.blogspot.com/2008/12/book-make-by-cath-kidston.html" title="http://printpattern.blogspot.com/2008/12/book-make-by-cath-kidston.html">http://printpattern.blogspot.com/2008/12/book-make-by-cath-kidston.html</a></p>
    <p>And purchase it here: <a href="http://www.cathkidston.co.uk/p-12531-cath-kidston-cath-kidston-make-book.aspx" title="http://www.cathkidston.co.uk/p-12531-cath-kidston-cath-kidston-make-book.aspx">http://www.cathkidston.co.uk/p-12531-cath-kidston-cath-kidston-make-book...</a></p>
    <p>Mikey :-)</p>
