    <p>Hello All:</p>
    <p>I’m all about the cute stuff man!</p>
    <p>And if someone can take a typeface that I think is big rig-industrial (such as Meta Serif) then make it jolly, then, well—that’s blogworthy!</p>
    <p>Here is a nifty little book set in FF Meta Serif... and it doesn’t it look trés lovely?!</p>
