    html: <p>The bottom two lines are Times or Times New Roman (hard to say for sure which). The "cec" is some form of Bodoni Bold, but it doesn't match any off-the-shelf version I know of. It's very Bodoni-like, but the crossbar on the "e" is lower than usual. Could be custom or an old film font.</p>
