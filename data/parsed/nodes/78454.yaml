    html: <p>If you want to make the "trek" down to Yokohama, the <a href="http://newspark.jp/newspark/english/index.html" title="Newsparl Museum" rel="nofollow">Newspark Museum</a> is there. It is dedicated to the growth of the Japanese newspaper industry from 1880 and probably has a great number of interesting artefacts. Haven't been there myself yet, but am planning to visit soon.</p>
