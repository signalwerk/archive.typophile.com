    html: |-
      <p>A few suggestions:</p>
      <p>Typographic Posters of the 20th century<br>
      <a href="http://www.teien-art-museum.ne.jp/exhibition/typograph/index.html" title="http://www.teien-art-museum.ne.jp/exhibition/typograph/index.html">http://www.teien-art-museum.ne.jp/exhibition/typograph/index.html</a></p>
      <p>Great exhibition! The venue is neat too, the museum is located in the former mansion of a Japanese prince.  Nice garden for strolling around after the exhibit.</p>
      <p>The Printing Museum near Iidabashi station is interesting and they offer printing workshops:<br>
      <a href="http://www.printing-museum.org/en/index.html" title="http://www.printing-museum.org/en/index.html">http://www.printing-museum.org/en/index.html</a></p>
      <p>The GGG gallery run by Dai-Nippon Printing in Ginza has good exhibits:<br>
      <a href="http://www.dnp.co.jp/gallery/ggg_e/index.html" title="http://www.dnp.co.jp/gallery/ggg_e/index.html">http://www.dnp.co.jp/gallery/ggg_e/index.html</a></p>
      <p>You can find lots of art listings here:<br>
      <a href="http://www.tokyoartbeat.com/" title="http://www.tokyoartbeat.com/">http://www.tokyoartbeat.com/</a></p>
