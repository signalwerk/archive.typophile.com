    html: |-
      <p>Actually, I think it's better to characterize the process in reverse. What you're seeing has more to do with how FontLab <em>de</em>compiles fonts than how it compiles them. When FL compiles a font, you should end up with something which contains the features and lookups which you described in your .vfb file, but there is no way to recover the actual code which your .vfb file contained simply by looking at the resultant .otf file. FontLab can't reconstruct things like class or lookup names from compiled fonts so it makes these up, and it also explicitly includes a lot of stuff which is often left implicit when writing code (such as lookup declarations).</p>
      <p>If you really want to know exactly what FontLab is generating, you're better off using a tool like DTL OTMaster (Lite) rather than reopening your fonts in FontLab.</p>
      <p>André</p>
