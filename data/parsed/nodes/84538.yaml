    html: |-
      <p>I can't be sure, but yes, it sounds like that's what you did.</p>
      <p>The message is asking you whether you want to preserve the original (imported binary) opentype feature definitions (the ones which were created by FontLab when you originally exported the font) or if you want to recompile the features using the source code created by FontLab's decompiler.</p>
      <p>While OpenType source code refers to glyphs by name, in the actual OpenType tables glyphs are referred to by glyph index. Therefore, you should only use the imported binary features if you haven't done anything which might have reordered the glyphs within the font.</p>
      <p>André</p>
    html_clean: |-
      <p>I can't be sure, but yes, it sounds like that's what you did.</p>
