    html: |-
      <p>Oh, good.</p>
      <p>Two suggestions:</p>
      <p>1. You can save yourself a lot of trouble with regard to font caches if you give your fonts provisional names while under development, changing them each time you generate a new version. For example, if your font is called "My Font", you might have development versions called "My Font A", "My Font B", "My Font C" and so on. This also has the advantage that you can compare different versions side by side in applications. But the best thing is that it completely avoids the font cache issues. (Note: I'm talking about the name you give the font in the Font Info dialogs, not the file name of the font file, which has no effect on the font name in the operating system or applications.)</p>
      <p>2. Your code could be a bit simpler. Since you already have a class called "@STARTSWASH", you could save yourself some typing by doing this:</p>
      <pre>feature salt { # Stylistic Alternates
      # Latin
      @STARTSWASH = [K R V W Q A];
      @STARTSWASH_ALT = [K.alt R.alt V.alt W.alt Q.alt A.alt];
      ignore sub @calt1 @STARTSWASH';
      sub @STARTSWASH' by @STARTSWASH_ALT;
      } salt;</pre><p>
      It's shorter and a bit clearer what's going on.</p>
    html_clean: |-
      <p>Oh, good.</p>
      <p>Two suggestions:</p>
      <p>1. You can save yourself a lot of trouble with regard to font caches if you give your fonts provisional names while under development, changing them each time you generate a new version. For example, if your font is called "My Font", you might have development versions called "My Font A", "My Font B", "My Font C" and so on. This also has the advantage that you can compare different versions side by side in applications. But the best thing is that it completely avoids the font cache issues. (Note: I'm talking about the name you give the font in the Font Info dialogs, not the file name of the font file, which has no effect on the font name in the operating system or applications.)</p>
      <p>2. Your code could be a bit simpler. Since you already have a class called "@STARTSWASH", you could save yourself some typing by doing this:</p>
      <pre>feature salt { # Stylistic Alternates
      # Latin
      @STARTSWASH = [K R V W Q A];
      @STARTSWASH_ALT = [K.alt R.alt V.alt W.alt Q.alt A.alt];
      ignore sub @calt1 @STARTSWASH';
      sub @STARTSWASH' by @STARTSWASH_ALT;
      } salt;</pre><p>
      It's shorter and a bit clearer what's going on.</p>
