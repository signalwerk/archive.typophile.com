    <p>I'm pretty new to all this and am working on my first typeface. I've been adding new weights and now have a family of 4 weights.</p>
    <p>I noticed something odd the other day: a lot of the OpenType scripts &amp; features seem to have changed a bit (im not even sure how i am supposed to call these, i mean the classes, salt, calt, dlig features, and so on).</p>
    <p>For example, there is suddenly an aalt feature:<br>
    feature aalt{<br>
      feature salt;<br>
    } aalt; </p>
    <p>In the liga feature there are suddenly comments such as<br>
    # Standard Ligatures<br>
     # Latin</p>
    <p>calt suddenly has 'lookup' in it:<br>
    lookup calt2 { </p>
    <p>and so on a number of other changes.</p>
    <p>I'm really not sure what happened. It seems a number of kerning details I did have been lost as well. </p>
    <p>On top of this (maybe this is the problem?) when I generate the font I get a pop-up window that says:</p>
    <p>"Current font contains both OpenType features definition and imported binary OpenType tables"</p>
    <p>Could it be that I have unknowingly opened the .otf files I generated and continued working on those, saving them again as .vfb files? Is that possible at all? I noticed that it is possible to open up .otf files and those do have that aalt feature that I didn't put in there myself.</p>
    <p>Suggestions more than welcome!</p>
    <p>PS: any tips on how to save older versions of your typeface in progress? Because if this went haywire I'll probably have to start over again since I continuously over-saved the files... ;(</p>
