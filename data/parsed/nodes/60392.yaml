    html: |-
      <p>The rule is to design the work to fit the text. Not the other way around, as seems to be happening here. If there are enough instances of this in your text then you are going down the wrong design road. Hell, if I had to design a book with even one such instance I'd ditch the drop cap and come up with a better idea.</p>
      <p>powers</p>
