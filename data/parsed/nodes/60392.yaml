  html: |-
    <p>I'm looking for advice on how to handle dropcaps in an instance where a single-line paragraph kicks off a chapter.  InDesign gives the new paragraph an extra indent on the dropcap's baseline, which I actually thought was a pretty fair fix, but the folks I'm doing it for aren't entirely sure about it.  One suggestion was to basically make the dropcap a raised one in this instance, but I really don't like that shift in continuity.  Was wondering if there's any preferred rule on this or any precedent from pre-desktop publishing days anyone knows off hand?</p>
    <p>Thanks and best,<br>
    Aaron</p>
