      <p>&gt;it doesn't need to be done at extremely high resolution</p>
      <p>Even if you don't anticipate needing it in a large size, a professional would almost certainly prepare the logo as vector art, which means it doesn't have a resolution like a photo, it's art that can be enlarged to any size without loss of quality. (Google "vector graphics" if you want details.) </p>
      <p>They will probably give you copies in several formats, but at least one of them should be a vector format.</p>
