    html: |-
      <p>WT: What usually gets lost in these discussions is this: Type is no longer a physical object -- you no longer buy type. What you've bought is a license to use some software. That license has restrictions about how you use the software.</p>
      <p>There are ways to modify the characters generated by font software without modifying that software. That's legal, at least, in the U.S.</p>
      <p>If someone can do the needed work in a layout program (e.g., InDesign), it is also relatively inexpensive. If not, then it is going to get costly, probably more than if the work was done in a font editing program.</p>
      <p>As people have said, check the EULA (font license) for the font. Or, if it is an Adobe Original, we can assure you it is permitted to modify the software (do the work with a font editor).</p>
      <p>Your best way out, if the font is from one of the smaller publishers, might be to have the font designer do the work. Some would, some wouldn't. Doesn't hurt to ask.</p>
