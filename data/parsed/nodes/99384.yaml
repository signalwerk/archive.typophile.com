    <p>Hi- </p>
    <p>I am updating my company's logo which was made from a script font straight out of the box.  I would like someone to change approximately 4 letters using computer manipulation to make it look more like a designed logo. I *do not* want this done "by hand"/pen and ink, etc.</p>
    <p>This is a logo (of letters only) used on the internet or very small on business cards, etc, so it doesn't need to be done at extremely high resolution.</p>
    <p>My company is small. I am committed to being fair but I don't have a big budget.</p>
    <p>I'd like to see samples of work you have done using font manipulation or lettering design and an idea of what you charged  on example projects so I can get an a idea of your pricing before answering the question, "What's your budget?" because 1) I don't know yet and 2) it will depend on the person I end up working with. </p>
    <p>I'm serious and not looking to waste anybody's time. If you are young, talented and working freelance, you're probably the sort of person who'd be compatible with this project.</p>
    <p>Please contact me at <a href="mailto:wt.billing@gmail.com">wt.billing@gmail.com</a> to discuss further.</p>
    <p>Thank you!</p>
