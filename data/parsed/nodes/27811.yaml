    html: <p>Have you contacted the designer, <a href="http://www.joshuadarden.com/" rel="nofollow">Joshua Darden</a>? That seems to me the obvious thing to do in this case. There is an apparent bug in the font, which he will surely want to know about and fix, and he will be able to provide you with an updated font file. He may, of course, want to confirm that you have a legitimate license, but it sounds like you do and it should be easy to confirm.</p>
