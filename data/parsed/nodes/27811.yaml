    <p>I just bought the Freight Sans and Freight Text packages after some serious decision making process.<br>
    I happen to need the text book italic k in a fairly large size, and noticed, that it seems to have a little problem with it. There seems to be a drawing mistake in the right leg of the k. All the other ks are ok, as you can see.</p>
    <p>What can I do about this? is this very common? I don't own FL, so I can't fix it permanently myself, only one-offs in Illustrator.</p>
