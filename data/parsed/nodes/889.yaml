  html: <p>With ﬁnally a weekend to myself away from Atlanta and all its distractions, I have just started delving into the documentation and tutorials for the <a href="http://developer.apple.com/fonts/OSXTools.html">Apple Font Tools</a>. I’m building <span class="caps">MIF</span> ﬁles for simple ligatures and elaborate contextual state tables, and choking on error after error. I’m losing my hair. I seem to be missing a <span class="caps">LOCA</span> table and have no idea how to build it. <br><br>Has anyone here used these new <span class="caps">XML</span>-based tools to build at least one functioning <span class="caps">AAT</span> font? If so, please do share your thoughts and&nbsp;experiences.</p>
  html_clean: <p>With ﬁnally a weekend to myself away from Atlanta and all its distractions, I have just started delving into the documentation and tutorials for the <a href="http://developer.apple.com/fonts/OSXTools.html" class="link-external">Apple Font Tools</a>. I’m building <span class="caps">MIF</span> ﬁles for simple ligatures and elaborate contextual state tables, and choking on error after error. I’m losing my hair. I seem to be missing a <span class="caps">LOCA</span> table and have no idea how to build it. <br><br>Has anyone here used these new <span class="caps">XML</span>-based tools to build at least one functioning <span class="caps">AAT</span> font? If so, please do share your thoughts and&nbsp;experiences.</p>
