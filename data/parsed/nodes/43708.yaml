  html: <p>Can Opentype be used to create special kerning for odd series of letters? I’m spacing a font with too much space on the right-hand side of a and noticed that it looks just fine when followed by a series like ro or rn. Could I set up a font so that when a is followed by ro or rn the a spreads a little farther from r to balance things out?</p>
