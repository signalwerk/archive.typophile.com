      <p>James, beware that doing contextual kerning can be quite tricky. For example, consider the combination <strong>L’A</strong>, which happens in French. If you want that sequence spaced well, but at the same time need the quote kerned correctly against <strong>L</strong> and <strong>A</strong> alone, the only way to do it is by using a kerning triplet.</p>
      <p>Below are some GPOS snippets and screenshots of their result. As you can see things can get complex pretty fast. (In case it's not clear, the desired result is the first example below.)</p>
      <p><strong>One</strong><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/contkern_1_6334.png"></div><code>pos L' -100 quoteright' -50 A;<br>
      pos L' -150 quoteright;<br>
      pos quoteright' -120 A;</code><p></p>
      <p>================================================<br>
      </p>
      <p><strong>Two</strong><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/contkern_2_4824.png"></div><code>pos L quoteright -150;<br>
      pos quoteright A -120;</code><p></p>
      <p>================================================<br>
      </p>
      <p><strong>Three</strong><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/contkern_3_6388.png"></div><code>pos L' -100 quoteright' -50 A;<br>
      pos L quoteright -150;<br>
      pos quoteright A -120;</code><p></p>
      <p>================================================<br>
      </p>
      <p><strong>Four</strong><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/contkern_4_5513.png"></div><code>pos L' -150 quoteright;<br>
      pos quoteright' -120 A;<br>
      pos L' -100 quoteright' -50 A;</code><p></p>
      <p>================================================<br>
      </p>
      <p><strong>Five</strong><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/contkern_5_5588.png"></div><code>pos L' -150 quoteright;</code><p></p>
