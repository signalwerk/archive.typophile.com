      <p>Hi Miguel,</p>
      <p>Contextual kerning is nice, but I don't much care for the example. I'll allow it is generally bad form to quarrel with the example, but I've always felt that too many people, including Adobe, kern the quote marks too tight. As evidence, I would say quote marks are not diacriticals, but characters in their own right &amp; deserve their space. That also happens to be the historical usage.</p>
      <p>But If you do use a -150 kern between cap L and quoteright, you're going to need triplets with more than capital A. For example:</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/Lquote_4778.gif"></div><p></p>
