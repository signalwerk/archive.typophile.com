    html: |-
      <p>Don't tell me I scared you away... :)</p>
      <p>BTW, the desired result can also be achieved using the code below. Yes, that's right, Six is equivalent to One. The reason is because <cite>contextual lookups used in a kern feature will be in a different lookup than the pair positioning rules, and hence the two sets of rules will be additive whenever they match the same glyph pair in the text stream.</cite><br>
      <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#6.h" title="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#6.h">http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.htm...</a></p>
      <p><strong>Six</strong><br>
      <code>pos L' 50 quoteright' 70 A;<br>
      pos L quoteright -150;<br>
      pos quoteright A -120;<br>
      </code></p>
      <p>If this is all Greek to you, forget about it.</p>
