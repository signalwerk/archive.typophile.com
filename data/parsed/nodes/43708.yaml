    html: |-
      <p>Yes, it can. This is achieved through "contextual kerning" - I just posted a thread the other day asking how many people were actually doing this.</p>
      <p>However:</p>
      <p>1) You can only do this in GPOS kerning; 'kern' table kerning does not support it. (Apple's AAT extensions to the 'kern' table do, but they're not part of OpenType.)</p>
      <p>2) Not all OT savvy tools support this. The AFDKO does, and I'm pretty sure VOLT does. I don't believe FontLab Studio does.</p>
      <p>3) Not all apps that handle GPOS kerning will recognize contextual kerning. I know the current version of InDesign does, however.</p>
      <p>Regards,</p>
      <p>T</p>
