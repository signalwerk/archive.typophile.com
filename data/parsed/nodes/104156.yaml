      <p>Your welcome.<br>
      This IS a standard Linotype font and was used in many 20th century books. It's tempting to digitize it, the LT specimen of 1905 includes the many special characters, accents, symbols etc. that were available as part of the font, but I can't see much in the way of commercial sales for it, particularly since I couldn't sell it as a book text font under it's original name. And sales of book fonts are abysmal unless they are sold by LT or other ultra established foundries such as Hoefler &amp; Frere Jones. Unlike old display fonts where there is no problem with anyone using a new name and promoting it in flashy context.  Anyway, the Bruce should work fine.<br>
      Don</p>
