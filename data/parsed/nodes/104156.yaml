      <p>Somewhat off topic for font ID. But for what it is worth, a few comments on your questions.<br>
      Options for a book reprint are yet another photo reprint, assuming the source copy is in good shape. Or OCR the book and choose a font. This will take longer than the first option because it requires proofreading the OCR results.<br>
      IMHO the font can be quite different than the original and legibility/readability factors dominate. Depends on the subject matter. If the book is very time &amp; place specific then its enjoyable to pick a font that is appropriate for the era. If you like the tone of the LT Old Style No. 1, then the Bruce version would work fine.  Most readers won't notice this substitution. Indeed, most readers only notice a book font if it is hard to read.<br>
      Don</p>
