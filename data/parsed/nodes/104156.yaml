      <p>Thanks akira1975 for the reference to the previous thread.<br>
      If mr_h's image is in fact Linotype Old Style No. 1, then Mark Simonson's comment seems spot on:<br>
      ---start quote---<br>
      Your sample is an old Linotype face called Old Style No. 1. I don't think it has been digitized (other than Andrew Leman's distressed version). Century Old Style is similar in details, but heavier (as Nick mentioned). Bruce Old Style is closer in terms of weight and feel, but differs in the details.<br>
      ---end quote---<br>
      I just want to footnote the reference to Andrew Leman's version. It not deliberately distressed. Rather it's the product of an apparently unedited auto-trace intended to produce a font good enough for use as a "prop font" in movies etc.<br>
      Perhaps Linotype Old Style No. 1 is not digitized because it does not seem particularly interesting for contemporary book publishing, particularly with the rise of e-books, which work best with fonts optimized for screen reading. It's a lot of work to make a proper book text font and very few are produced for this shrinking market, compared to the flood of new fonts for advertising, web, games etc.<br>
      IMHO most people would not notice much difference between the LT OS and the Bruce OS digitized by BT.<br>
      Don</p>
