      <p>Sorry if I wasn't clear. I wasn't expressing an opinion over which inset setting was preferable. Rather I was responding to someone who said -- if I understood correctly -- that an inset of zero resulted in inferior alignment of left-aligned text, which I don't believe is correct. </p>
      <p>In other words, I'm saying that an inset has no affect on the quality of text alignment within that frame.</p>
      <p>Personally, I always use an inset of zero (the default), unless there is some special reason not to. When would I use an inset? Mostly it's in situations where I want some text to be inside a visible box, so I apply a stroke to the text frame and inset the text to provide a margin between the stroke and the text.</p>
