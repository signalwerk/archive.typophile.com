      <p>To control the position of text within a text frame, select that frame by clicking on it and then go to...</p>
      <p>Object menu &gt; Text Frame Options</p>
      <p>&gt; does anyone know why I shouldn't want to do this?</p>
      <p>Hmmm... maybe if you want to snap the text box to the same guideline that's used by a different printing object (like a rule or photo box). If there's no text inset, the type will butt that object. Having a text inset allows you to align both objects to the same guideline and still maintain some white space between the printing elements. If you have to do that many times in a layout, might save a little time.</p>
