    html: <p>You can do it manually by shifting the baseline (for the vertical position), and adding a space before the first character and kerning the text against it (for the horizontal position). Depending on your motives, it might be quicker to just move/enlarge the text frame, so that it is the text that optically aligns with your guideline, and not the (optically irrelevant) text box edge.</p>
