      <p>InDesign does not have a control like this. And this align procedure is just plausible for display sizes, not for normal/small ones.</p>
      <p>Two workarounds:</p>
      <p>1. Type the first line of text in a text frame. Set format. Convert it to outlines (Crtl+Shift+O). You now have a group of vectors which may be placed exaclet besides your line/margin.</p>
      <p>2. Design a line. Choose text in path tool, click on the line and type text. Align this text anywhere.</p>
      <p>Both solutions are for one line at a time. Anyway, I think this is not an issue as text in display sizes are usually in small. For text is set in small sizes, don't try to force this alignment. As Andrew (1985) pointed, this leads to misaligned first letter in multiple lines.</p>
