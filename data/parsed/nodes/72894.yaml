      <p>It is not over controlled at all, it is absolutely proper for somebody to be able position text how they so wish, that is the nature of a layout program. I agree that when this level of precision is available and so readily available at that, it is lazy not to use it. This is Typophile - sorry to refute Mr Sipe so thoroughly but Typophile is largely concerned with taking a great deal of care with all these things, from layout, to even finer work like kerning. Worry no, care absolutely. Apologies in advance, I just find it frustrating that this attitude is prevalent in design in general. To encounter it here I find baffling.</p>
      <p>Aligning to the top of the frame is easy as explained before in First Baseline menu to  Cap-Height.<br>
      However regarding align left, there is a good reason not to, as Frode rightly pointed out, to accommodate the side bearings of the font. Whereas a line beginning with A will sit left of the frame, one beginning with j will generally peak out of the frame, creating an optical alignment from top to bottom.</p>
      <p>You can check Optical Margin Alignment (Window&gt;Type &amp; Tables&gt;Story) but I don't fully understand this function. Perhaps someone could explain?</p>
