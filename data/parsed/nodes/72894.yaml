    <p>I have thought about this for a while, does anyone know if there is a way to get type to snap to the top left edges (for left aligned type) of a text box in indesign. I have attached an example.</p>
    <p>Alternatively does anyone know why I shouldn't want to do this? typo techy reasons?</p>
    <p>Cheers<br>
    Steve</p>
