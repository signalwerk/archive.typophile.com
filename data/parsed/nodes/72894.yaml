      <p>Let me check again James as I'm confused by what you mean. Surely inset of zero is default and preferred for text? Sorry if I am misunderstanding your point. The initial problem in the thread that remains unsolved is to get the text to butt the frame to the left, but this is character and line specific, by default some letters won't butt it at all, some will and others will overshoot it to the left.</p>
      <p>The default left edge of a text block consisting of several lines at text size, placed in a grid beneath an image, ought to look correct as the number of characters overshooting will make up for those undershooting, so to speak, an average optical line will appear. </p>
      <p>I can see your problem at display sizes but it is not necessarily correct to align characters by their most extreme left protrusion. If your first letter was O then aligning the extrema of the curve to the extreme coordinate of the image above would still result in the O appearing indented. Continue this logic and all the initial characters might align to the above image but none will align to each other.</p>
      <p>So a line by line aligning to extrema solution seems ineffective. </p>
      <p>Alternatively align the content to the gutter by picking a straight sided letter and positioning the text frame so that this straight sided letter appears aligned to the gutter. This way the O will actually protrude into the gutter but might feel optically correct with the image above. However the protrusion of some characters into the gutter will affect the overall white value of the gutters themselves.</p>
      <p>So a complete text frame option is not really the answer either and does not have snappy functionality.</p>
      <p>Hope somebody else can offer more complete solution.</p>
      <p>@ Martin, glad to hear it.</p>
