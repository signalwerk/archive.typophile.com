  - id: 237360
    user_id: 14529
    user_name: mondoB
    user_path: null
    date_raw: 3 Nov 2007 — 8:56pm
    date: 2007-11-03T20:56:00
    votes: null
    html: <p>I think your question is really what sans-serif goes best with Galliard both as display and text...whenever I do a magazine I always use two families, serif supplemented by sans, with the sans for sidebars and highlighted material, especially if reversed. With Galliard, I would suggest Josh Darden's Freight Sans or ITC Franklin Gothic, whose letterforms are very similar to Galliard in their proportions. ITC now makes both Galliard and Franklin Gothic with oldstyle figures for all weights, never available before, in OpenType format. Freight Sans comes with oldstyle figures standard.</p>
