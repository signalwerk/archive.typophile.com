    html: |-
      <p>Traditionally, Galliard CC is used exclusively as the text face and Mantinia, also from Carter and Cone, is used as the display face. However, Galliard does have the sharpness needed to function at larger sizes. I would suggest mating Galliard to something spanish warm feeling like Bohemia or Eudald or Pradell. Ball terminals aid in legibility. Kis might look pretty too.</p>
      <p>Mikey :-)</p>
