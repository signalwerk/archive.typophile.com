    <p>Hi everyone on the information super highway</p>
    <p>Im working on an idea for a friends skateboard company. I would like to try and ID the typeface used on this vintage jewelry we found when doing some image research for an idea we have for a board - i know that it has had some treatment by giving it the swoosh underline, can anyone throw some light on which was the original typeface? Is it a set of characters with a swashes?</p>
    <p>Thanks again as always, typophile hasn’t let us down yet!</p>
