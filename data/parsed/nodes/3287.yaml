    html: "<p>&gt; The 'Q' does create some problems when it touches the following glyph. <br> <br>I created the 'Q' to fit perfectly snug with the 'U.' I figured it was worth the risk of it running into the 'R' or any other letter because, well, I speak and write english, and that usually doesn't happen anyway. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/2723.jpg\" alt=\"tucson3.jpg\"> <br> <br> <br>&gt; ...though I'm concerned the difference in stem bulk wouldn't make it work so well. <br> <br>I tried it, and I agree. This is simply how I conceived the emphasis working out when I designed it: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/2724.gif\" alt=\"tucson2.gif\"> <br> <br>&gt; </p>"
