      <p>The small scale of your image does not show how the letters are formed. This is clear in the following Pan American World Airways wall sign from the late 1950s and early 1960s:<img src="/sites/default/files/old-images/PanAmericanWorldAirwaysWallSignLate1950sEarly1960s_4463.jpg"><br>
      Note the very geometric triangular [Latin} serifs: <img src="/sites/default/files/old-images/PanAmericanWorldAirways1950sEarly1960sSM_4888.jpg"><br>
      The PanAm font is very inaccurate.<br>
      To recreate the lettering you would do better to start with a sans serif font which matches the letterforms and width.<br>
      Don</p>
