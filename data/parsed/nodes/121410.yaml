    html: |-
      <div class="comment-spam-body"><p>The secret behind the triangular Latin serifs.<br>
      The designer was at a loss how to update the old italic speed style logo.<br>
      As each idea failed he folded the sheet into a simple paper airplane, threw it across the room and had another shot of his favorite tipple. When he awoke he forced his eyes open and saw all these little white triangles scattered around.<br>
      Big idea! Paste triangular serifs on an old style thick and thin font and his job was done! He hoped it would fly with his boss just as well as his folded paper airplanes had done. An so it did. The little white triangles flew until PANAM went bankrupt in the 1990s.<br>
      Don</p>
      </div>
