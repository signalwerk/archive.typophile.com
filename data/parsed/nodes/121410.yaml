    html: "<p>Shortened version of their logo freely available to download as vector <a class=\"freelinking external\" href=\"http://www.brandsoftheworld.com/logo/pan-am-1\" rel=\"nofollow\">here</a>. As Kevin and Don's said, custom (and not a good one). I'd probably start with a contrasted wide sans like the ones suggested by Kevin simply adding those (ugly) latin/triangular serifs. Some more candidates for customization: <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/jnlevine/brenham\" rel=\"nofollow\">Brenham</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/fontbureau/condor\" rel=\"nofollow\">Condor</a> (less fat/vintage/wooden type but more work on /R leg and /C shape)</p>"
