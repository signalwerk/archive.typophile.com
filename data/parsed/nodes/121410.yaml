    html: "<p>Shortened version of their logo freely available to download as vector <a href=\"http://www.brandsoftheworld.com/logo/pan-am-1\" title=\"Click to visit an external URL.\" class=\"freelink freelink-external freelink-external\">here</a>. As Kevin and Don's said, custom (and not a good one). I'd probably start with a contrasted wide sans like the ones suggested by Kevin simply adding those (ugly) latin/triangular serifs. Some more candidates for customization: <a href=\"http://www.myfonts.com/fonts/jnlevine/brenham\" title=\"Click to visit an external URL.\" class=\"freelink freelink-external freelink-external\">Brenham</a>, <a href=\"http://www.myfonts.com/fonts/fontbureau/condor\" title=\"Click to visit an external URL.\" class=\"freelink freelink-external freelink-external\">Condor</a> (less fat/vintage/wooden type but more work on /R leg and /C shape)</p>"
