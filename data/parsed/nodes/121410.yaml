      <div class="comment-spam-body"><p>The small scale of your image does not show how the letters are formed. This is clear in the following Pan American World Airways wall sign from the late 1950s and early 1960s:</p><div class="imageWrap"><img src="http://typophile.com/files/PanAmericanWorldAirwaysWallSignLate1950sEarly1960s_4463.jpg"></div><br>
      Note the very geometric triangular [Latin} serifs: <div class="imageWrap"><img src="http://typophile.com/files/PanAmericanWorldAirways1950sEarly1960sSM_4888.jpg"></div><br>
      The PanAm font is very inaccurate.<br>
      To recreate the lettering you would do better to start with a sans serif font which matches the letterforms and width.<br>
      Don<p></p>
      </div>
