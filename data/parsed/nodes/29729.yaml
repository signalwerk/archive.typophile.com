    html: |-
      <p>I apologize if this isn't what you are soliciting, but I belive it is an issue that will have to be addressed eventually: Typophile has become a major information hub for type-related topics (Bravo!). In that role, it has to evolve to continue providing so much to so many. It's clear from other posts that some topics or threads are buried, and some are too prominent. It's also clear that some topics or headings are trafficked much more heavily than others. </p>
      <p>My suggestion is basically: re-organize the front page and "Forums" page to accomodate the changing uses we've discovered for Typophile. For example; I'd put Type ID, Free Fonts, Student Topics, Critiques, Designing Typefaces, and Using Type* at the top, most prominent, since they are the busiest areas that receive the most repeat questions. All critique areas should be handled the same, and it should be structurally clear that a critique posting should not go in any other area. Essentially I am saying: analyze how Typophile is used, and re-org it to make those pathways most intuitive, immediate, clear and distinguishable to everyone, not just lifer type nerds.</p>
      <p>"Hottest", "Wettest", "Meanest" "Handpicked" or whatever could be underneath those basic categories, since they represent digested versions of all the different areas. Right now, there's some opacity in those lists since the latest poster and time aren't shown, so I find them less crucial to show at the top. </p>
      <p>I wouldn't suggest this if I didn't think Typophile was worth the effort, and again, I think this kind of evolution is inescapable. </p>
      <p>*Notice my simpler, clearer laymens' terms. Though they aren't considered industry terms, they clarify distinctions that we've all noticed aren't intuitive to all users of Typophile. For additional clarity, the taglines under each section can be more informative, literal, specific:</p>
      <p>CRITIQUE<br>
      Submit in-progress designs for feedback</p>
      <p>A chopping block might not mean the same thing in Romania, Greece, Venezuela and France.  ;)</p>
      <p>The one thing I would add In a prominent place: "Type Selection Help", which could be everything from our lists of condensed sans, Garamond versions, Book types, Superfamilies, or whatever comparison tools people need to help them select type. There is a steady stream of posts asking for type recommendations, and it deserves its own area, complete with some methods of showing or linking to samples.</p>
    html_clean: |-
