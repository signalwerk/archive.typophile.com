    html: |-
      <p>There are a number of suggestions not yet implemented that were in the 'bug' thread when Typophile 5 was in Beta. </p>
      <p>Some that I remember, in two categories:</p>
      <p>NAVIGATION TO NEW POSTS</p>
      <p>1. Have the page navigation at the top as well as the bottom. Many suggested this earlier including me; it is renewed above. I would think this would be easy to implement. </p>
      <p>2. Mark Simonson suggested to include in the 'all recent' results the categorization of posts by menu area. Addicts like me frequently use this as a button on our browser bar, and that category information would be helpful. </p>
      <p>3. Someone recently pointed out that clicking on the 'new' highlight on the right brings one to new posts--almost. It brings you to the last new post if there is only one page. Otherwise it brings you to the first page. If this were fully functional--bringing you to the first new posting in a thread--it would be a big improvement for the frequent visitor.</p>
      <p>MENU IMPROVEMENT     </p>
      <p>1. Eliminate sub-menus, so the all menu items show updates. How to do this while keeping the same number of menu items: </p>
      <p>1A. Combine the Build and Release categories into one top-level. (Release is much less active than Build.)</p>
      <p>1B. Put all the Critiques into two categories: Type Design and Logo/Corporate ID. --The latter has many more postings than the other critique categories.<br>
      This would put everything on one menu level, and then show updates. </p>
      <p>2. (New suggestion) The 'special interest' area seems to have little activity. A possible better use is to make it one category: 'Typographic Education: Teachers and Students.'  </p>
      <p>2A This category could have a 'Frequently asked novice questions' with answers at the top. Eg: what are best books and web sites for beginners to learn about typography and type design. </p>
      <p>2B This category could also have at the top list of 'Resources for teachers' list, eg links to the sites of teacher Mark Jamra, James Craig, Ellen Lupton. </p>
      <p>Of course, it would be good to have a mechanism for updates of both the novice student and teacher lists. Edit: perhaps the Wiki would be  a good device for both lists, and keeping them updated.  </p>
      <p>I am not saying that all student questions should be shunted to this category, but those that are clearly asking for homework and term project help could be shifted to this category by moderators. They would still get help, but people could then choose whether they want to be involved in this--there have been complaints on this score before on a number of threads. </p>
      <p>CONTRAST</p>
      <p>Oh, and one more. My pet peeve: put white or at least a lighter grey behind the text on the postings. Contrast (short of dazzle) increases readability. </p>
      <p>PS</p>
      <p>If you have to prioritize to one or two improvements, in another week  you might put up a survey question what changes people most want. </p>
      <p>Oh, and Typophile is great. Yay hooray!</p>
    html_clean: |-
