    <p><strong>Monotype Imaging Introduces the Parkinson Electra Typeface Family</strong> </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ElectraHiRes v2 sm_3697.JPG"></div><p></p>
    <p>&nbsp;<br>
    Inspired by the 1930s Electra Typeface, Parkinson Electra Offers New Vitality in a New Design </p>
    <p>Monotype Imaging Holdings Inc., a leading global provider of text imaging solutions, has released the 6-font Parkinson Electra® typeface family, available from <a class="freelinking external" href="http://www.fonts.com" rel="nofollow">Fonts.com</a>. Designer Jim Parkinson based his design on the 1930s work of William Addison Dwiggins, whose Electra typeface created for the Linotype® collection has been widely considered a classic book face of the 20th century. </p>
    <p>"Jim's typeface exudes the vivacity of the Dwiggins original, which is noted for its high legibility, energetic disposition and evenness in design," said Allan Haley, director of words and letters at Monotype Imaging. "Jim immersed himself in early specimen books of Electra and various ephemera produced by Dwiggins. This led to Jim's interpretation that is softer yet slightly heavier than Electra, with serifs that appear more delicate." </p>
    <p>Linotype first released Electra as fonts for machine-set metal type beginning in 1935. Since then, the design has been re-engineered for use in phototype and digital technologies. Recently, Electra was released exclusively on Fonts.com Web Fonts as fonts for website design. </p>
    <p>In the early 1990s, Parkinson became familiar with Dwiggins' work while refurbishing digital versions of his Metro® design for the San Francisco Chronicle. Also during this period, Parkinson created an interpretation of Electra for reproduction using printing presses newly installed by the Chronicle as part of an upgrade process and newspaper redesign. "I essentially created an Electra that only looked like Dwiggins' design in one narrow environment," said Parkinson. "Now years later, I was excited to have the opportunity to recapture the essence of Electra in a brand new typeface. By studying Dwiggins' work, I feel as if I'd known the man, even though we never met." </p>
    <p>Parkinson Electra is available in three weights as OpenType® Pro fonts ranging from regular to heavy, each with an italic counterpart. OpenType Pro fonts provide for the ability to insert typographic features automatically such as small caps, ligatures and old style figures. Pro fonts also offer an extended character set supporting most Central European and many Eastern European languages. </p>
    <p><strong>Availability</strong><br>
    Parkinson Electra typefaces, available in TrueType® and OpenType formats, may be purchased and downloaded from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a> and <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a>. In addition, the new fonts are available for webpage design at Fonts.com Web Fonts. </p>
    <p>Customers may contact Monotype Imaging in the U.S. toll-free at 800-424-8973 or in Europe at 44-1737-765959 (U.K.). Linotype may be reached at 49-6172-484-418 (Germany). Customers from other parts of the world may dial 1-781-970-6020 (U.S.). </p>
    <p><strong>About the Linotype typeface library</strong><br>
    Established more than a century ago, Linotype is a Monotype Imaging brand that represents exceptional quality typefaces for brand managers, designers, publishers, IT administrators and product developers. Influenced by its German and Swiss roots, the Linotype collection is home to some of the most widely used and celebrated typefaces in the world, including the renowned Helvetica®, Frutiger® and Univers® families. Typefaces continue to be released on an ongoing basis into the Linotype collection from some of the world's most talented and accomplished type designers. </p>
    <p><strong>About Monotype Imaging</strong><br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype and ITC® typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. Linotype and Metro are trademarks of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Electra and Helvetica are trademarks of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. OpenType is either a registered trademark or trademark of Microsoft Corp. in the U.S. and/or other countries. All other trademarks are the property of their respective owners. ©2011 Monotype Imaging Holdings Inc. All rights reserved.</p>
