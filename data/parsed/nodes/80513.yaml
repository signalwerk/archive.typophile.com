      <p><cite>Not being able to share this font legitimately with my printer and web designer is ridiculous.</cite></p>
      <p>You should be able to send a font to a printer, but not a web designer. A web designer is a professional designer just as you are and needs to buy his own font licenses to use them in his work.</p>
