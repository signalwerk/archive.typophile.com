  html: <p>Can anyone suggest some fonts that are similar to the LHF Asylum font? I love this font but am put-off by the their privacy policies.I am also looking for an alternative to their LHF Chesham Sans. Not being able to share this font legitimately with my printer and web designer is ridiculous.</p>
