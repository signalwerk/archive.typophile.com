    <p>Hello,</p>
    <p>I am a young french student and I’m spending a month in New York City... Although I’ve already done a bit of research, I don’t know where to find good bookshops (new or second-hand books) specialized in type or graphic design.<br>
    Also, I have to research on Morris Fuller Benton, so I thought I might find some material here in college or public libraries, but I have no clue of where to look for that.</p>
    <p>So, if any New Yorker could help me with this, I’d be very grateful!</p>
    <p>If you can think of any event related to type/graphic design coming this month, please don’t hesitate to bring it up ...</p>
