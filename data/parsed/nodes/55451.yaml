    <p>I am giving my Intro to Typography students the opportunity to do a 1000 word extra credit paper. What would some of you suggest as being a good topic for such a paper?</p>
    <p>I have created only a few so far:</p>
    <p>Unique considerations of typography on the web<br>
    The process of typography design</p>
    <p>Any ideas? Thanks.</p>
