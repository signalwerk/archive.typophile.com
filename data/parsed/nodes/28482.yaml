  html: <p>Tipografia.cl o TCL, es el primer sitio sobre tipografía en Chile. El proyecto es desarrollado por Kote Soto Y Tono Rojas en sus inicios, pero actualmente cuenta con Francisco Galvez y Rodrigo Ramirez en su Equipo.</p>
