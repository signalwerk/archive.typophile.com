      <p>&gt; Congratulations for your decision on trying<br>
      &gt; out a Linux Distro.</p>
      <p>Seriously speaking, I personally see no reason why I should use Linux. Mac OS X is a solid Unix-based system that includes a X11 graphic environment as well as a very good Mac OS X Cocoa graphic environment. With Microsoft Virtual PC, you can run Windows on it. On my Mac OS X, I can run Mac Classic, Mac OS X, Unix and Windows applications side-by-side. See the screenshot that shows Fontographer 4.1 for Mac OS 9, FontLab 4.6 for Mac OS X, FontLab Studio 5 for Windows and Font Forge on X11 running at the same time:<br>
      <a href="http://www.twardoch.com/tmp/osxfonttools.png" title="http://www.twardoch.com/tmp/osxfonttools.png">http://www.twardoch.com/tmp/osxfonttools.png</a></p>
      <p>Regards,<br>
      Adam</p>
