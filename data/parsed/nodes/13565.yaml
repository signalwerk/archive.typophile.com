    <p><strong>LiveType Project</strong><br>
    Open Source Collaborative Type Design<br>
    <a href="http://livetype.sourceforge.net" rel="nofollow">http://livetype.sourceforge.net</a></p>
    <p>The <a href="/wiki/LiveType%20Project" class="freelinking" rel="nofollow">LiveType Project</a> focuses on the development of complete Fonts using <strong><a href="/wiki/Fontforge" class="freelinking" rel="nofollow">Fontforge</a></strong>.<br>
    This project aims that everyone involved can and will learn more about typography and type <strong>developing in a collaborative method</strong>. It will provide the fonts and the font files regularly to users, developers and anyone with an interest in type.</p>
    <p>What are you waiting for? <strong><a href="http://livetype.sourceforge.net/getinvolved.htm" rel="nofollow">Get involved!</a></strong></p>
