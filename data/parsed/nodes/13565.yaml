      <p><em>Most of the important aspects of type design are not dependant on the software tools used to create a typeface. It is quite possible to produce rubbish using the best tools, and to produce a good typeface with tools that are merely “good enough”.</em></p>
      <p>I agree wholeheartedly with Glyn on this point. The best tool for the job is one that works for you and the way <em>you</em> work, but the best tool in the world isn't going to save a bad design, and a good design won't be ruined by a humble tool.</p>
      <p>For the folks working on the FontForge project, here are a few suggestions of things <strong>not</strong> to emulate in the programs which are currently available...</p>
      <p><strong>Fontographer</strong>: work in whole em units only; develop a sensible interactive scaling tool (the Freehand model Fontographer uses is ridiculous, and FontLab's isn't much better); and, if you include an autokerning feature, make it a lot less promiscuous.</p>
      <p><strong>FontLab</strong>: if you include a Font Audit function, get a grip on what a flat curve really is; develop more flexible drawing tools than the Primitives panel; allow the user to specify more default options for repetitive information; and, if you include an autokerning feature, make it a little less timid.</p>
