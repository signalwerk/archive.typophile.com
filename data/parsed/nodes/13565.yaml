      <p>Let me all try to cut the edge.<br>
      Briefly, I am learning these days Linux, and I have installed in my computer Linux Fedora Core. I want to say the topic of free software comeing from Sourceforgue is great idea. But I want to point out some problems I have faced in Linux developement and promoting.</p>
      <p>1- The graphics softwares are not friendly users! I know for an example that GIMP software has more features than Photoshop. But let's face it the enterface of Photoshop is well designed and make me safe my time.</p>
      <p>2- The problem of Linux people that they think the MAC, and Windows users can easily go to LINUX and use its softwares in 2 days.. or more, while it is wrong. I spent alot of my time trying to learn LINUX it is more secure and more stable system I agree, but it is very hard one. Same for most graphics softwares there, they need time to learn, they need resources.. and Who has time to learn a new software after spending our money in Fontlab? You guys should think more from marketing point of view rather than thinking from the view of some programmers want to show that they are better than microsoft. You challange in graphics is not against microsoft, nor against MAC. You are against names like Adobe and Macromedia who don't make their softwares for free. And if you really can make a better software for free you need more than being just a clever programmer. </p>
      <p>3- I didn't find till now any software designed for our PRINT industry.. most graphics of Linux are for screens even SVG programs. I didn't find a software  that I can make my prepress on it. Nor a software like Adobe InDesign or Quark Xpress!</p>
      <p>4- When I look at the interface design, I found that it depend on Helvitica font, and others.. but there is no font designed for screens. There is no Trebuchet, nor Verdana. I understand you guys dislike Microsoft, but Helvitica looks really distorted in screen!</p>
      <p>Thank you for your time, NOTE that I am just new linux user, but may be my nots make sense for you.</p>
