      <p><em>(also don’t you find it strange that Macromedia controls the development of both major Font Editors?)</em></p>
      <p>Huh? Macromedia doesn't control any Font Editors. They never controlled FontLab. They did have Fontographer, but after the Adobe merger was announced they licensed it to FontLab. So <strong>FontLab, Inc.</strong> has both major editors.</p>
      <p>Like I said in the other thread, I think you would be better off supporting FontLab. FontLab* <strong>is</strong> the little guy. I get kind of annoyed by the idea that people who take money = bad, while OpenSource is always somehow more heroic. There is no better font development tool than FontLab. And I think that it will be at least a decade before there could be any significant competition.</p>
      <p>*Besides, like I also said in your other thread, FontLab supports the best OpenSource technologies. So, really, your students would be getting the best of both worlds if they used FontLab.</p>
