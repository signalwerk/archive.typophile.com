      <p>Pedro, I like your enthusiasm. I hope you continue with your efforts because I think the world could use more people like you seem to be. My only concern would be, and I feel this is particularly true in the design field, is if you can't use the standard programs, you can't get a job. No matter how many times you've used InDesign for example, if you don't know Quark as well, you don't get hired. Sometimes the tools are more important than the talent. This I think is unfortunate. I would be willing to give Fontforge a try once things get a little less hectic for me.</p>
      <p>Hrant, good or bad, having money (or the lack thereof) is a significant motivator. Also...here's an idea: instead of saying things like "utter rubbish" why not just say "I disagree". It comes off much less condescending that way. :)</p>
