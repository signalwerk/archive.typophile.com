      <p>Pedro, </p>
      <p>LiveType is a trademark of Apple used in context of fonts:<br>
      <a href="http://www.apple.com/legal/trademark/appletmlist.html" title="http://www.apple.com/legal/trademark/appletmlist.html">http://www.apple.com/legal/trademark/appletmlist.html</a><br>
      Therefore, you might want to come up with a different name for the project. </p>
      <p>Other than that, I think the project is interesting. I've tried using FontForge myself several times and in the end I have always given up and reverted to something else (FontLab, the Apple ftx tools, TTX) but I still am very impressed with George Williams' work. I've been using his little fondu utility (to convert between .dfont and .ttf) myself. Very useful. </p>
      <p>The more different tools are available the better. I wish George decides at some point to integrate FontForge with Python -- the ability to tie together FontLab, FontForge and TTX in different steps of a workflow could be really interesting. </p>
      <p>I don't think the availability of free fonts or free tools can harm. It drives competition, makes the tools available to people who couldn't afford commercial software etc. </p>
      <p>Most end-user open-source products I know are emulating existing commercial software: OpenOffice wouldn't exist without Microsoft Word, Firefox wouldn't exist without Netscape Navigator, Internet Explorer and Opera. Plus, one needs to remember that open source software often isn't really "free": a lot of open source software is being developed as research projects at universities and institutes, often state-funded. So it's all tax payers who pay for the development rather than the individual users. I believe that both methods of funding have their advantages and need to co-exist. </p>
      <p>As John Butler points out, we at Fontlab Ltd. have been using open source software in our software a lot, for example Python, FreeType and FontTools/TTX. I don't think that there necessarily has to be an either-or for FontLab and FontForge. Similarly, I'll gladly see free fonts to exist along with commercial fonts. </p>
      <p>Regards,<br>
      Adam</p>
