      <p>Congratulations for your decision on trying out a Linux Distro.<br>
      And yet no one said it would be easy. <strong>I've also been trying to adapt for several months to Linux OS</strong> (I've only tried Ubuntu, Knoppix and Fedora). JUST DON'T GIVE UP so soon.</p>
      <p>Yes. Linux is still far from being <em>user friendly...</em><br>
      Nevertheless it doesn't take you long to get used to well develop software like The Gimp. You have to keep an open mind to it. Hey, I remember the first time I used a Mac I got my floppy disk "stuck" inside the drive. It took me two days just to learn how to &lt; command +  e &gt; it. As a windows user, I also bitched about how <cite>Mac people thought windows users could learn how to use MacOS in two days...<cite></cite></cite></p>
      <p>Software takes time to learn. That's true. But, are you still using Quark 4.0? Or MacOS 8.6?</p>
      <p>What if you could learn the inside rules of your particular task and then adapt the methods used to accomplish it? This is what I'm saying. You CAN learn how to compose type, and then DO it different ways, like with Quark, InDesign, Pagemaker, MS Word, Windows MacOS,... Linux? The better you know how to compose (and the more practice you get) the easier it gets. And there's more - the more different methods you use, the easier it'll be to adapt to a new situation. Now just change the word "method" to "software" and the word "situation" to "job" or "operating system" and you'll see what I mean ;) </p>
      <p>I'm not saying "give me a stick and some glue and I'll build you a steamboat!" You have to have the proper tools to do good job, but you can also accomplish it with alternative tools. Nowadays you have to become more and more versatile. You never know what the future holds for you... (actually this is my mother's speech...)</p>
      <p>If you're really into self improvement you'll keep learning tools on your spare time (like I'm trying to do) so you can eventually adapt easier. Whattheheck, I've already had to do a commercial 40 page booklet on MS Word!!! Who the hell wants to use word to do this??? I'd rather do it on Open Source Software like Scribus.<br>
      Speaking of Scribus...</p>
      <p><cite>I didn’t find till now any software designed for our PRINT industry...</cite><br>
      <a href="http://www.scribus.org.uk/index.php" rel="nofollow">Scribus</a> - It seems you didn't look enough...</p>
      <p><cite>I didn’t find a software that I can make my prepress on it.</cite><br>
      Well some seems to have found a way to do it with Scribus. <a href="http://www.scribus.org.uk/modules.php?op=modload&amp;name=News&amp;file=article&amp;sid=75&amp;mode=thread&amp;order=0&amp;thold=0" rel="nofollow">Check these news.</a> Like this one there are plenty of cases (at least in the EUA). Just check their website.</p>
      <p>So far I've kind of agreed to Linux is not easy or user friendly, the transition is hard, it takes time, and lots of patience, but if there's one thing I really don't agree with you is <cite>You challange in graphics is not against microsoft, nor against MAC. You are against names like Adobe and Macromedia who don’t make their softwares for free.</cite></p>
      <p><strong>First</strong>, I believe on hard earned money. And believe me, specially those guys at Adobe deserve it.<br>
      <strong>Second</strong>, I'm writing these words on a Windows PC.<br>
      <strong>Third</strong>, who the hell is complaining about software not being for free? Just trying to find decent alternatives, trying to learn more.<br>
      <strong>Finally</strong> if Adobe were to create an OS... UAU! Is someone at Adobe reading this? Hello? Adobe OS? How cool would it be? I would buy it for sure!</p>
      <p><cite>I am just new linux user, but may be my nots make sense for you.</cite><br>
      Although it may not seem to, but <strong>I relate to what you're saying more than you can imagine</strong>. Here, now is currently 1:40 AM. I still have to check my e-mail on Windows MS Outlook go to bed, get up at 8:30 AM, go to work no Macromedia and Adobe based MacOSX machine, and, if I'm lucky, tomorrow night I'll boot Fedora Core to start sketching the Uppercase Diacritics for LiveType Project... I think the main thing is not giving up! That's life...</p>
      <p>Cheers, and cheer up! Maybe some day it'll be you giving advice not to give up on Open Source.</p>
      <p>———<br>
      <a href="http://livetype.sourceforge.net" rel="nofollow">LiveType Project</a></p>
