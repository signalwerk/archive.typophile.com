      <strong>Finally</strong> if Adobe were to create an OS... UAU! Is someone at Adobe reading this? Hello? Adobe OS? How cool would it be? I would buy it for sure!</p>
      <p><cite>I am just new linux user, but may be my nots make sense for you.</cite><br>
      Although it may not seem to, but <strong>I relate to what you're saying more than you can imagine</strong>. Here, now is currently 1:40 AM. I still have to check my e-mail on Windows MS Outlook go to bed, get up at 8:30 AM, go to work no Macromedia and Adobe based MacOSX machine, and, if I'm lucky, tomorrow night I'll boot Fedora Core to start sketching the Uppercase Diacritics for LiveType Project... I think the main thing is not giving up! That's life...</p>
      <p>Cheers, and cheer up! Maybe some day it'll be you giving advice not to give up on Open Source.</p>
      <p>———<br>
      <a href="http://livetype.sourceforge.net" rel="nofollow" class="link-external">LiveType Project</a></p>
