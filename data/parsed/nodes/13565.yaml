    html: <p>In my opinion, free software like Fontforge definitely has a place alongside commercial software like Fontlab. In my case, I would never have got started on type design if the only tools available cost hundreds of dollars. Fontforge is probably not as good as Fontlab for a professional type designer, but it is good enough, I think, to provide an introduction to type design for students and amateurs. Most of the important aspects of type design are not dependant on the software tools used to create a typeface. It is quite possible to produce rubbish using the best tools, and to produce a good typeface with tools that are merely "good enough".</p>
