    html: <p>Here are 2 images I just made in ScanFont's demo. They're from a crappy black and white image of the Sukothai Stone. Not a rubbing unfortunately. Both are from 300 dpi TIFFs, but the first (the spotty one) was bitmapped with a diffusion dither, and the second was bitmapped with a 50% threshold. They were output from FontLab as EPS files (which could be done in ScanFont, but not in the demo version). Maybe this helps. <br> <br><img src="http://www.typophile.com/forums/messages/4101/11413.jpg" alt=""><img src="http://www.typophile.com/forums/messages/4101/11414.jpg" alt=""></p>
