  - id: 1559
    user: 1262
    date: 2003-06-04T14:56:00
    date_raw: 4.Jun.2003 2.56pm
    votes: null
    html: <p>If you prep the images carefully, e.g. by adjusting curve contrast before converting to b/w, you can get pretty good results from ScanFont. Also, you can edit the position of glyphs on the bitmap within ScanFont, so you can align to and specify a common baseline. <br> <br>I don't use ScanFont very often, but when I do I usually select the tightest fit in the tracing options. This will result in hundreds of nodes, but will very closely wrap to the bitmap outline, including all bumps and nicks. I then put the resulting outline in the mask layer in FontLab and construct a clean outline on top of it. <br> <br>I have S.R. Rao's book on decipherment of the Indus Valley script. Fascinating stuff, although I have only skimmed it.</p>
