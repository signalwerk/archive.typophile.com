    html: <p>When you separate shapes in ScanFont, you can assign names to the shapes that correspond to glyph names in FontLab. You can assign names for individual shapes or to a sequence of shapes, which is particularly useful if you have a scan of a lot of letters. ScanFont should use these names to put the traced outlines in the appropriate glyph cells in FontLab.</p>
