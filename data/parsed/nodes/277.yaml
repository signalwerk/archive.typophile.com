    html: <p>Tom, SF-Mac version 4.0 and SF-Win version 3.x are very different. I think that John mean Win version which allows to name cells inside ScanFont. We decided to not include this feature to version 4 on the Mac because it will not add much value - it is so easier to just drag-drop a cell to the correct place in the font than to fill in all names. <br> <br>OCR seems to be a good idea for ScanFont but we yet not made good algorithm that is really shape-independent.</p>
