    html: <p>As far as I know, the only requirement for ScanFont is that the raster image you process has to be a bitmapped TIFF. So, I <i>think</i> that it'd possible to run those rubbings through it and get some good quality vector images. You'd probably have to put each one in a glyph cell and export the glyph as an EPS. </p>
