    html: |-
      <p>@ Jon &gt;We ended up with P22 Vincent</p>
      <p>I hope you will never need it for German text. The Eszett (germandbls, ß) of Vincent is crap: just a modified uppercase B. Many non-German type designers think the ß was an uppercase character, but it is strictly lower case*. </p>
      <p>Andreas<br>
      _________<br>
      * Unicode 5.X has an uppercase ß now, but the need for it is contested.</p>
