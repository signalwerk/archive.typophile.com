    html: |-
      <p>Hi Jon,</p>
      <p>brandnew and with lots of OpenType alternates (that help to evoke a truly handwritten feel): <a href="http://www.fontshop.com/fonts/singles/suomi_type_foundry/suomi_hand_script_ot/" rel="nofollow">Suomi Hand</a>.<br>
      Equally intelligent, with ‘print’ letters: <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_duper_ot/" rel="nofollow">FF Duper</a>.<br>
      If you are looking for a clever connected script: <a href="http://new.myfonts.com/fonts/shinn/handsome-pro/?refby=mfde" rel="nofollow">Handsome</a>.<br>
      Free with some Adobe applications: the beautiful hand of renowned Swiss typographer <a href="/wiki/Max%20Caflisch" class="freelinking" rel="nofollow">Max Caflisch</a>, <a href="http://new.myfonts.com/fonts/adobe/caflisch-script/?refby=mfde" rel="nofollow">Caflisch Script</a>.<br>
      A lot more casual script fonts in this <a href="http://www.fontshop.com/fontlist/subclasses/script_casual/" rel="nofollow">FontList</a>.<br>
      F</p>
