    <p>Perhaps this has been posted on before, but I'm not entirely sure.<br>
    I notice that often fonts get picked on for overuse (see Archer) yet somehow I notice that "Brothers" by Emigre gets used more and more and no one seems to notice. To quote the great Mugatu "I feel like I'm taking crazy pills over here!!!"</p>
    <p>I understand that it is a very nice looking font that has become immensely popular even though it is over 15 years old. What bothers me is that it seems to be taking advantage of the fact that a client might not notice that their Microbrew label looks EXACTLY LIKE that other microbrew label. I even read a piece in a well-regarded logo book where a design firm claimed to find the "Logotype" from researching old shipping crates, when it is clearly BROTHERS!!!</p>
    <p>Would love to get others thoughts on this....should I just give up and put Brothers on everything?</p>
