      <p>I'm the designer of the Fidelis Co. Brand. Of course the typeface used is Brothers! I simply wasn't asked which typeface it was in the interview. The spirit I used Brothers in was indeed <em>inspired</em> by typography on antique shipping crates.</p>
      <p>Brothers is a strong display typeface, especially when used to convey a specific visual language. It was perfect for this particular client and business, at the particular time that the mark was designed. I agree that this style of typography has recently exploded into ubiquity, and I love that Brothers is a 15+ year old typeface enjoying a newfound popularity.</p>
      <p>As the owner of an all women-run design studio, I'm highly enjoying the investigation into Brother's connotations of "socially constructed as tediously, single-mindedly masculine in contemporary society" etc. I don't disagree. Those connotations work perfectly with the business this mark represents.</p>
