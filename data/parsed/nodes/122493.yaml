      <p>Given that John Downer, the designer of Brothers, is a sign painter by trade (with undergraduate and graduate degrees in fine art), I’d guess that he brought that hand-made aesthetic to his design for Brothers. That doesn’t rule out the possibility that his references included type found on old shipping crates, and that your microbrew logo designers worked from similar sources. </p>
      <p>If you can provide the name of the brewery (or the logo book), I’d love to compare it to Brothers.</p>
      <p>But you are quite right about the ubiquity of the style. I see it everywhere these days. Much like the “hipster” logo style that involves some form of crossed line elements and “rustic” type, the steampunk/woodcut/hand-carved aesthetic of Brothers (and typefaces like it) has become shorthand for “authentic.”</p>
      <p>All to entice young professionals with too few frames of reference and too much disposable income to spend three times the going rate for a basic cast iron frying pan (a la Best Made Company). </p>
      <p>Resist the urge to resort to shorthand.....</p>
