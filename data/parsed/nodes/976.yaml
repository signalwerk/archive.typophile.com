ht, that's actually pretty small for an x-height! <br> <br>&gt; a tallish x-height does not (emphatically) impede readability due <br>&gt; to an inability to properly provide ascenders and descenders. <br> <br>The vertical em-space is taken up by: x-height, ascenders, descenders, and internal leading. Obviously, the larger the x-height the less room left for everything else. Duh. <br> <br>&gt; Quote a bibliography <br> <br>Read my essay in GD&amp;R - a good chunk of it is there. <br> <br>&gt; list the specific typefaces <br> <br>You're not reading what I'm writing. <br> <br>-- <br> <br>&gt; Where is the support without direct empirical research? <br> <br>Where is the support for the opinion that serif fonts read better in books? <br> <br>&gt; I suggest you get in the habit of included annotations <br> <br>In a discussion group like this?! For now, please read my essay! But eventually I'll get more formal, don't worry. I'm not ready yet. <br> <br>&gt; I don't see any emotion on my part of this at all. <br> <br>On Typo-L you recently wrote: <br>\"[My fonts] have that large x-height that I have become so attached to recently.\" <br> <br>&gt; now your having us believe that you have hundreds of years <br>&gt; of reliable scholarly research <br> <br>You're completely skewing what I said. I said one hundred years (starting from Javal), and I was saying that <i>these days</i> it's extremely unlikely to see funding for research that <i>specifically</i> measures optimal x-height. <br> <br>-- <br> <br>Dear huge x-height boys: just give it up! Your fonts are less readable. <br> <br>hhp <br></p>"
