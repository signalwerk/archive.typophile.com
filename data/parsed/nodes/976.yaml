    html: "<p>For the benefit of the group,  <br>Mr Ovink was, in Hrant's quoted... <br> <br>&gt;13. \"The factor of easy writing, which influenced the forms of the alphabet at the time of the scribes, can have no actual significance any more; we have to reckon with the technical requirements of typography nowadays.\" From G. W. Ovink, Legibility, Atmosphere-Value and Forms of Printing Types, p. 213. <br> <br> <br>...actually talking about (or perhaps around) the typeface 'Peignot' (1937, A. M. Cassandre, designer), and released through the foundry Deberny et Peignot. <br> <br>As many might recall from writings about it, the foundry Deberny which released it hailed its biform goodness as the second coming of the alphabet. <br> <br>Interestingly, Archie Provan and Alexander Lawson write of Peignot in their 1983 '100 Type Histories, Volume II', that Peignot \"actually returned to some of the 6th century uncials\". <br> <br>And that \"The type was so successful that two other weights were added latter [sic].\" <br> <br> <br>A sidebar word of warning: On page 204, Ovink describes the typeface 'Bell' as \"fresh, racy and tender; ...\". <br> <br>No, I'm not making it up. <br> <br> <br>Pretty obviously from his point of view of the type industry, and since Peignot was released probably 1/4 to midway through his writing his book, Mr Ovink was likely just as dazzled as the rest of the world at the time, by Cassandre's and Deberny's masterworks. <br> <br>(Say what you will about Peignot. Without it, there would be no 'Planet of the Apes' types.) <br> <br>;-) <br> <br>Mr Ovink was noticably roiled that Deberny was hailing it that way, without research to back up that it was the secong coming, saying even that Deberny was \"pretending\" that Peignot was indeed the only typeface ever to be used again. That all others should be vaporized (my words, to compress it). <br> <br> <br>And so we see that even then, there are those around who would squash type design creativity and its promotion. <br> <br>Now, where would we be today without the landmark promotion of typefaces that Deberny et Peignot heralded? The answer is: much less well off, creatively. <br> <br>Is Peignot a 'text face'?  <br> <br>No, of course not. Can it be used for text effectively? Long text? Sure, depending upon how the designer designs with it. <br> <br> <br> <br>Interestingly, reading on to page 214, Mr Ovink continues: <br> <br>\"The French are masters in black and white. Perhaps owing to financial reasons, compelling to get maximum profit out of a few types, they reached a high level in the art of \"mise-en-page\". <br> <br>(He then spends a paragraph reminding everyone that the pinnacle of printing perfection was only to be found in France.) <br> <br>And that the French, with so few types to choose from within their country, naturally turned to color and paper variety to pick up the slack of creative presentation. <br> <br>Ah, the French. And how Mr Ovink understood them. <br> <br>At least by the middle of p. 214, Ovink finally, no doubt grudgingly admits that Charles Peignot, and the firm Deberny &amp; Peignot, did do stellar work on the order (in his words) of Klingspor, Bauer and U.K. Monotype.... <br> <br>&gt;17. \"The abilities and the condition of  <br>&gt;the reader play an important part;  <br>&gt;these differences in reading-skill are  <br>&gt;not to be neglected.\" Ovink, p. 113. <br> <br>Well, duh. <br> <br>More significantly, on p. 113, he says, <br> <br>\"The rapid reader needs a small, thin, close and narrow type\" [giving the examples Baskerville and Fraktur (!)]\", <br> <br>the slow reader needs a large, thick, wide type\" [examples cited: Schoolbook Old Style, Bookman, Ionic]. <br> <br> <br>Oh, how to resolve it? How ever will we resolve it? <br> <br> <br> <br>On p. 112, he quotes that another research team he respected, Tinker and Paterson, had tested these faces: <br>Scotch Roman <br>Garamont     (yes, Garamont) <br>Antique <br>Bodoni <br>Old Style <br>Caslon Old Style <br>Kabel Lite <br>Cheltenham <br>American Typewriter (not ITC's; an older one) <br>Cloister Black <br> <br>Ovink states there that of all those faces, only the last two produced significant differences [in results]. <br> <br>(!) <br> <br>Anyway, I'd love to see the results of similar tests with more modern faces and (probably more importantly) more modern printing techniques brought to bear.  <br> <br>Can you even imagine what their proof cards used to test with must have looked like? Sure, probably crisp for the day, but we would pretty obviously do much better today. Well, as long as it's printed in France, I suppose. <br> <br>Hrant, maybe Matthew Lesko can direct you to a grant to study it. <br> <br>Joe <br> <br> <br> <br> <br></p>"
