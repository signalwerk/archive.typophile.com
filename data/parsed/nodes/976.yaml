ttached to recently.\" <br> <br> <br>Wasn't me. I haven't bothered with Typo-L in probably more than a year. <br> <br>And besides, if a type designer says that, so what? <br> <br> <br> <br>&gt;You're completely skewing what I said. ... <br> <br>Oh, ok. <br> <br> <br> <br>&gt;Dear huge x-height boys:  <br>&gt;just give it up! Your fonts  <br>&gt;are less readable. <br> <br> <br>Sorry. Not likely.  <br> <br>There are several kinds of fonts that are less readable: <br> <br>1) Fonts suffering from bad concept; <br>2) Fonts suffering from bad execution; <br>3) Fonts whose weight range is badly selected; <br>4) Fonts whose width doesn't suit the concept; <br>5) Fonts that are a bad selection for their reproduction environment (too light for newsprint); <br>6) Fonts whose point size, leading and weight are wrongly selected for the material and platform (book, ad, etc.) and reader (toddler, young, midage, elderly) where they are being expected to perform. <br> <br>Other than that, x-height itself doesn't injure fonts. <br> <br>Yes, there have been some bad designs out there over the years that also have tallish x-height.  <br> <br>Now, it might be possible for a later type designer to see that a different x-height might've better suited the original concept.  <br> <br>But the x-height itself would not have been what made it a bad design. <br> <br>By the way, I don't believe that either Jim or myself are \"huge x-height boys\". I, for one, don't like that pigeonholing. <br> <br>I, for one, design with an open mind. <br> <br>Joe <br> <br></p>"
