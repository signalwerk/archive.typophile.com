    html: <p>It's more than a "review", it's an attempt at extracting usable conclusions, and using them! I don't think the definition of "research" is limited to hooking up tachistoscopes to college students. <br> <br>My graphic is not Proof - I generally avoid using that word anyway. It's a way to convey/visualize what really happens during reading, and even though it's simplified, it helps. <br> <br>True, there is no direct empirical evidence of what's a good x-height - that's way too specific for there to be any money in it, and contemporary academia runs on money invested by corporations who make sure the results are useful to their bottom line. And it would be very difficult to quantify it anyway - instead it's a matter of grasping the bigger picture. <br> <br>There is in fact a lot of "adjacent" empirical evidence (like the fact that all-caps is harder to read even though it's bigger, and that about 2/3-rds of [immersive] reading happens in the parafovea) as well as a lot of anecdotal evidence, like the kind that says serif fonts are better for reading. That's certainly true - even some of the Bauhaus boys had to break down and admit it - but that hasn't been proven either! <br> <br>One telling indication that an x-height can be too large for good readability (just like it can also be too small) is that the optimal x-height varies with point size. But there are many other "clues", and once you have in your head a relatively clear model of how [immersive] reading actually works, almost all these little observations/opinions come together very nicely. <br> <br>-- <br> <br>Keith, I didn't write that stuff, Joe did. (Although "abomination" was mine.) <br> <br>And Sarah was half right.  :-) <br> <br>hhp <br></p>
