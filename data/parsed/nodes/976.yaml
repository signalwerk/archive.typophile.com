    html: "<p>&gt; I've been successfully designing typefaces <br> <br>Don't you realize by now that we have very different measures of success? <br> <br>&gt; I beg your pardon? <br> <br>What do you know about how humans read, and where did you learn it? <br> <br>&gt; Treating our business as a business has been a good thing <br> <br>For whom? <br> <br>&gt; Let's stop this casting 'business' as an evil ogre. It's merely a classification. <br> <br>Yeah, and child laborers in sweat shops are a classification of worker. <br> <br>&gt; things are often rushed <br> <br>My original font was not rushed. The magazine was begging me to finish it because the launch of the magazine was waiting for it - I told them they would get it when it was ready. <br> <br>And nobody understood why it wasn't working, certainly not the readers! The reason was \"subvisible\", not something a focus group could have pinpointed. You can't rely on readers for precise feedback on subconscious issues. <br> <br>&gt; There's no need to feel badly (not that you do) for having to tweak things over time. <br> <br>Considering it was my second-ever outline font (the first was a disaster) I don't feel bad at all. I'm just very happy I snapped out of large x-height lala-land. <br> <br>&gt; exactly why upfront, face-to-face meetings are a good thing <br> <br>No amount of face-to-face meeting would have prevented that problem. It was a matter of people reading a lot of text in it, and contacting the magazine/me (preferably via email these days) with their complaint. Sure, this could/should have been done in advance, but that has nothing to do with \"face-to-face\". <br> <br>&gt; a despising of all fonts whose x-heights transcend the lowercase mean line. <br> <br>Huh? <br>First of all, I don't \"despise\" large x-heights - they're useful for very small sizes and display purposes. But they reduce readability. Do you care? And secondly, what do you mean by \"mean line\"? If you mean 50% of the ascender height, that's actually pretty small for an x-height! <br> <br>&gt; a tallish x-height does not (emphatically) impede readability due <br>&gt; to an inability to properly provide ascenders and descenders. <br> <br>The vertical em-space is taken up by: x-height, ascenders, descenders, and internal leading. Obviously, the larger the x-height the less room left for everything else. Duh. <br> <br>&gt; Quote a bibliography <br> <br>Read my essay in GD&amp;R - a good chunk of it is there. <br> <br>&gt; list the specific typefaces <br> <br>You're not reading what I'm writing. <br> <br>-- <br> <br>&gt; Where is the support without direct empirical research? <br> <br>Where is the support for the opinion that serif fonts read better in books? <br> <br>&gt; I suggest you get in the habit of included annotations <br> <br>In a discussion group like this?! For now, please read my essay! But eventually I'll get more formal, don't worry. I'm not ready yet. <br> <br>&gt; I don't see any emotion on my part of this at all. <br> <br>On Typo-L you recently wrote: <br>\"[My fonts] have that large x-height that I have become so attached to recently.\" <br> <br>&gt; now your having us believe that you have hundreds of years <br>&gt; of reliable scholarly research <br> <br>You're completely skewing what I said. I said one hundred years (starting from Javal), and I was saying that <i>these days</i> it's extremely unlikely to see funding for research that <i>specifically</i> measures optimal x-height. <br> <br>-- <br> <br>Dear huge x-height boys: just give it up! Your fonts are less readable. <br> <br>hhp <br></p>"
