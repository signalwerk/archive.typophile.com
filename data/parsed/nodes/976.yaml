en so much of typography has moved on since the research. (As much as I respect it.) <br> <br>And especially as the research regards display type (of its day). Er, like Peignot! <br> <br> <br> <br>&gt;&gt; Peignot ... Long text? Sure  <br> <br>&gt;You're hallucinating.  <br>&gt;Make sure to stop anybody who might ask  <br>&gt;you set a book for them. <br> <br> <br>I think you really need to open your mind a little. <br> <br> <br> <br> <br>&gt;The argument is much more than over fonts,  <br>&gt;it's about how to mark cultural progress,  <br>&gt;as opposed to milking nostalgia and  <br>&gt;complacency for money. <br> <br> <br>Well, if you say so. <br> <br>It seems to me that from the body of research done, and how leading foundries and their most talented creative directors and artists, punchcutters, phototypesetting filmmakers, digitizers, etc., have learned from it over the 20th century, that quite a lot of 'cultural progress' has indeed been made in type design and manufacturing. <br> <br>And, as has been noted in type and design industry writings many times during the last century, type design developments have tended to well echo human cultural change. <br> <br>Who's milking complacency here? <br> <br>Joe <br> <br></p>"
