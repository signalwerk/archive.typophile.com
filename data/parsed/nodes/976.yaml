    html: "<p>[off-topic rant] <br>I have to disagree with some of the comments made about graphic design rates. <br> <br>Here in Canada, the standard shop rate is around $150/hour, with the really good places charging a lot more, and freelancers charging somewhat less. But the idea that any yahoo with an Internet connection in Podunk, Lebanon can charge $10/hour or something is ridiculous. It's awfully hard to make *any* profit if you're charging less than $100/hour when you have to pay for: <br> <br>1. Office space (even cheap office space) <br>2. Expensive computers and upgrades (no, bare-bones systems don't cut it in the design business) <br>3. A dozen expensive software packages, which need to be upgraded frequently <br>4. A decent library of fonts <br>5. Lots of unbillable time spent on administration, marketing, and accounting <br>6. Technical costs - broadband Internet, domain names, web development space, email addresses <br>7. Deadbeat clients who disappear or don't pay <br>8. Your own health, dental, and accident insurance <br> <br>On top of that, 95% of all clients with money live in medium-to-large cities, and 95% of them demand face-to-face contact with designers. If you're going to stay in a small town with low rent, you have to settle for the other 5%, and it's awfully hard to get business from someone you've never met. And you still need to courier lots of CD-ROMs and artwork proofs - ruling out a residence in countries remote from your market. <br> <br>So no, you can't charge peanuts and make money in design. Many firms claim to do so, but I guarantee they're using pirated software and fonts, like my old employers, who still went broke (they charged only $60/hour). Ditto for all cheap Bangalore design shops. It's killing the software and design industries in a single blow. <br> <br>[/off-topic rant] <br> <br>So there's not that much of a comparison between graphic designers and strictly type designers. <br> <br>Paul</p>"
    html_clean: "<p>[off-topic rant] <br>I have to disagree with some of the comments made about graphic design rates. <br> <br>Here in Canada, the standard shop rate is around $150/hour, with the really good places charging a lot more, and freelancers charging somewhat less. But the idea that any yahoo with an Internet connection in Podunk, Lebanon can charge $10/hour or something is ridiculous. It's awfully hard to make *any* profit if you're charging less than $100/hour when you have to pay for: <br> <br>1. Office space (even cheap office space) <br>2. Expensive computers and upgrades (no, bare-bones systems don't cut it in the design business) <br>3. A dozen expensive software packages, which need to be upgraded frequently <br>4. A decent library of fonts <br>5. Lots of unbillable time spent on administration, marketing, and accounting <br>6. Technical costs - broadband Internet, domain names, web development space, email addresses <br>7. Deadbeat clients who disappear or don't pay <br>8. Your own health, dental, and accident insurance <br> <br>On top of that, 95% of all clients with money live in medium-to-large cities, and 95% of them demand face-to-face contact with designers. If you're going to stay in a small town with low rent, you have to settle for the other 5%, and it's awfully hard to get business from someone you've never met. And you still need to courier lots of CD-ROMs and artwork proofs - ruling out a residence in countries remote from your market. <br> <br>So no, you can't charge peanuts and make money in design. Many firms claim to do so, but I guarantee they're using pirated software and fonts, like my old employers, who still went broke (they charged only $60/hour). Ditto for all cheap Bangalore design shops. It's killing the software and design industries in a single blow. <br> <br>[/off-topic rant] <br> <br>So there's not that much of a comparison between graphic designers and strictly type designers. <br> <br>Paul</p>"
