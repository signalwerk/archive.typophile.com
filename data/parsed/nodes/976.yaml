    html: "<p>Hrant wrote <br> <br>&gt;Did you even read what I wrote? <br> <br>Always. Thoroughly.  <br> <br>I understand, of course, that your views must work for you just fine. <br> <br>The only reason I'm bothering with debating this is for the benefit of recent graduates entering design, primarily. To counter disinformation that they might otherwise take to heart and derail their understanding process with, because they don't know any better yet. <br> <br> <br> <br> <br>&gt;The more you like the 70s or Old-Style  <br>&gt;or anything else, the less you can mark  <br>&gt;cultural progress. <br> <br> <br>Absolutely not so. <br> <br>For example, in my case, I enjoy the older stuff, then I set it aside and move ahead. From the very first typefaces I designed, for me, it was all about learning from the past, but starting fresh. <br> <br> <br> <br>&gt;x-Heights: anything close to to 70s x-height is indeed bad, for readability. <br> <br>(and, to my commenting about my TF Habitat) <br> <br>&gt;&gt; While not setting any wider.  <br> <br>&gt;This is dead false. <br> <br> <br><b>Oh, baloney.</b> <br> <br>I should know how my own typefaces were designed to work, and do work, should I not?  <br> <br>I don't mean to sound self-serving, but I've been successfully designing typefaces this way for nearly 30 years. (Although, I never wake up in the morning and say, \"Dang it all, I'm designin' me a tall x-height typeface to-day! Yessiree!\") <br> <br>And for us (as an example), for the most part, the kind of features/advantages I mentioned are what our customers respond to. Breathlessly. Because they so rarely get those features elsewhere (to quote them directly, often, before we get around to telling them). <br> <br> <br> <br> <br>&gt; Step back and study type for yourself.  <br>&gt;Study readability first, (...) <br> <br>(and later) <br> <br>&gt;...but if you're going to counter  <br>&gt;somebody's theories, you need to do some  <br>&gt;research of your own... <br> <br> <br>I beg your pardon? <br> <br> <br> <br>&gt;BTW, throughout your arguments is seems  <br>&gt;that everything is eventually brought  <br>&gt;around to the  <i>business</i>of type... <br> <br>Well, this is, after all, a business. Why apologize for that? Treating our business as a business has been a good thing, and continues to be. (And again, we all want the economy to get better, right? Businesses being run as businesses, responsibly, will go a long way toward economic recovery.) <br> <br>Let's stop this casting 'business' as an evil ogre. It's merely a classification. Like 'serif'. The type industry would not have survived over the centuries and be here today for all of us to enjoy and be a part of, if not for those who ran their typefounding and typesetting businesses as businesses. <br> <br>If you want to run a type design career as a hobby, well, have fun. <br>(Really. I think you should have fun going about what you do.) <br> <br>But the only thing that matters to me in the midst of a type concept is the proper fleshing out of the design.  <br> <br>Of course, unless you spend all your time cloning, or doing randomly selected, open ended 'research', and if you expect to have customers, it's important to create what customers might actually want at some point. Yes? <br> <br> <br> <br>&gt;Yeah, where would we be without ITC Garamond...  <br>&gt; :-/ One of the worse abominations in our craft. <br> <br>Too bad. Again, if you haven't seen the original Tony Stan workmanship.  <br> <br>Clue: What you see in the MacConnection catalog is an example of how some licensing foundry (or otherwise) got hold of it and screwed it up. Horrid digitizing. Horrid spacing. Not the original. It's not the normal width version, squeezed, either. No idea what it is. <br> <br> <br> <br>&gt;And the fact that users admittedly don't  <br>&gt;realize a large x-height is bad for them  <br>&gt;is the reason they need us designers in  <br>&gt;first place! In fact it has been empirically  <br>&gt;shown that users prefer font sizes somewhat  <br>&gt;too large for optimal reading. The reason is  <br>&gt;the difference between deliberative versus  <br>&gt;immersive reading. <br> <br> <br>Is that right??! Well, Shazaam! <br> <br>Now when you say 'users' above, do you mean 'art directors, publication designers, graphic designers'? Or, 'readers'?  <br> <br>Just curious. <br> <br> <br> <br>(and later, about one of your own earlier magazine typefaces) <br> <br> <br>&gt;...but after about 3 issues there were  <br>&gt;enough letters from readers complaining  <br>&gt;of reading strain that we had to change it... <br> <br> <br>Fine. That happens sometimes. Live and learn. As you know, especially in editorial environments, things are often rushed (including creative).  <br> <br>There's no need to feel badly (not that you do) for having to tweak things over time. And of course, the other thing worth saying is that, especially in an editorial environment, you're lucky you got feedback you could use to effect change that was right for that kind of publication, that culture, that history, that reader. <br> <br> <br>&gt;Back then I had no idea why Aramian  <br>&gt;worked better, but now I've come to  <br>&gt;understand how my original was fatally  <br>&gt;flawed: mostly it was simply the  <br>&gt;obese x-height. Armenian actually has  <br>&gt;a greater dependence on extenders than Latin,  <br>&gt;but Latin still relies on extenders heavily  <br>&gt;for readability. <br> <br>Ok; fine.  <br> <br>The project actually required more research at understanding the reader that simply wasn't done, and neither the publisher, editors or writers volunteered any opinions upfront. And so, it was launched into as 'art for art's sake' (I'll assume, from your description). And later, with feedback, you had your market research for free (except for the disgruntled readers). Great! <br> <br><b>By the way, that kind of outcome is exactly why upfront, face-to-face meetings are a good thing; often crucial. And cannot be replaced by virtual meetings.</b> Otherwise, designers and clients often learn the hard way, as you, unfortunately, did in that instance. <br> <br>I still don't see how that transplants to a despising of all fonts whose x-heights transcend the lowercase mean line. <br> <br>And what's with the use of 'obese'? Having an x-height above the mean line does not render a typeface 'obese'. <br> <br>Not to split hairlines, but as a vertical measurement, it doesn't seem an x-height can possibly be 'fat', which is what 'obese' means.  <br> <br>'Tallish' might be better description, if I may suggest it. (Granted, it lacks sensationalism.) <br> <br>Oh, and unless the design is just plain flawed, a tallish x-height does not (emphatically) impede readability due to an inability to properly provide ascenders and descenders. Ascenders and descenders themselves are a related but separate consideration and must be designed properly. <br> <br> <br>On legibility research: Quote a bibliography of what available empirical research that you're referring to, by date, location and sample size, if you're so inclined, please.  <br> <br>And most importantly, list the specific typefaces, by typeface weight and point size. <br> <br>I would think that doing so would be doing your readers a great service. <br> <br>Thanks! <br> <br>Joe <br> <br> <br></p>"
