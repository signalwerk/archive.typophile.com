ften crucial. And cannot be replaced by virtual meetings.</b> Otherwise, designers and clients often learn the hard way, as you, unfortunately, did in that instance. <br> <br>I still don't see how that transplants to a despising of all fonts whose x-heights transcend the lowercase mean line. <br> <br>And what's with the use of 'obese'? Having an x-height above the mean line does not render a typeface 'obese'. <br> <br>Not to split hairlines, but as a vertical measurement, it doesn't seem an x-height can possibly be 'fat', which is what 'obese' means.  <br> <br>'Tallish' might be better description, if I may suggest it. (Granted, it lacks sensationalism.) <br> <br>Oh, and unless the design is just plain flawed, a tallish x-height does not (emphatically) impede readability due to an inability to properly provide ascenders and descenders. Ascenders and descenders themselves are a related but separate consideration and must be designed properly. <br> <br> <br>On legibility research: Quote a bibliography of what available empirical research that you're referring to, by date, location and sample size, if you're so inclined, please.  <br> <br>And most importantly, list the specific typefaces, by typeface weight and point size. <br> <br>I would think that doing so would be doing your readers a great service. <br> <br>Thanks! <br> <br>Joe <br> <br> <br></p>"
