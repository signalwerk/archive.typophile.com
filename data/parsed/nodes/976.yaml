    html: "<p>Obviously, the graphic came out of the research, not my own imagination! About five years of research at this point, and still going strong, although with diminishing \"returns\". I admit I haven't done my own field research (too expensive), but by reading and analyzing probably a hundred empirical and anecdotal pieces of reputable research by now, I've managed to \"converge the model\" so to speak. BTW, a large part of this has been published in my \"Improving the Tool\" essay in Gunnar Swanson's \"Graphic Design &amp; Reading\". Feel free to have a rebuttal published! I always welcome any objective challenge. <br> <br>I have nothing to gain by promoting or striking down obese x-heights - in fact my early Armenian work suffered from such obesity! I did a font for a magazine, and everybody thought it was very legible and handsome, but after about 3 issues there were enough letters from readers complaining of reading strain that we had to change it, and they commissioned me to make a digital version of an old-standby, Aramian, an ugly font by all accounts but with a proven track record of good readability. Back then I had no idea why Aramian worked better, but now I've come to understand how my original was fatally flawed: mostly it was simply the obese x-height. Armenian actually has a greater dependence on extenders than Latin, but Latin still relies on extenders heavily for readability. <br> <br>BTW, I don't expect anybody to automatically take my word for it, but if you're going to counter somebody's theories, you need to do some research of your own! If you don't bother doing that, you just have to trust those who have. <br> <br>-- <br> <br>James, if you're thinking about your own extensive experience with signage, I'd point out a key difference: you don't use the parafovea in that type of reading. Two parallel clues are that: sans fonts work better for signage, but not for for books (I hope you agree); and that signage likes loose letterspacing while books like it tight. <br> <br>Another \"mainstream\" clue is that all-caps text is harder to read (which I hope everybody accepts). The only real reason for this is that all-UC boumas are far less distinctive. <br> <br>That said, any \"conclusion\" is always tentative, I admit. If one day I see enough evidence that I'm wrong, I'll have to change my stance. <br> <br>Here's another \"mushy conclusion\": <br><a href=\"http://www.themicrofoundry.com/other/read_rx.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/read_rx.gif</a> <br> <br>This is what might be called a \"qualitative graph\": the deeper the level of detail, the more tentative it is. For example, the point where the curve touches the maximum up top, and especially the way the curve changes concavity has to be seen in more abstract terms than for example the fact that it goes up and back down, which is a very reliable piece of theory. <br> <br>In contrast to Readability, here's a graph of Legibility: <br><a href=\"http://www.themicrofoundry.com/other/read_lx.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/read_lx.gif</a> <br>which is actually derived from combining Visibility (simply being able to see something is there) and Decipherability (the ability to map a shape to a meaning irrespective of perception): <br><a href=\"http://www.themicrofoundry.com/other/read_dvx.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/read_dvx.gif</a> <br> <br>hhp <br></p>"
