    html: <p>Paul, I think your view is seriously skewed. Graphic design isn't just done in places with high cost-of-living, it's done everywhere, and it's very fair to say most non-Western big cities are much cheaper to live in, and not just in terms of renting space, but daily expenses, like goddam pet insurance and other idiocities. I was in Armenia for 9 weeks in 2000, and I paid more per day for my dog's kennel back in the US!! Plus I was talking about type design, which has much lower overhead costs than graphic design in general. <br> <br>It's not impossible to nab clients that are used to paying a lot more to get the same results but would like to save money, either by traveling to the client once in a while, or through a nice website, etc. <br> <br>Clients will gradually require less-and-less physical contact, prepare yourself! <br> <br>hhp <br></p>
