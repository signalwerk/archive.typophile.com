    html: "<p>&gt; What I was saying was that it makes good business sense .... <br> <br>Did you even read what I wrote? <br> <br>&gt; .... certainly doesn't make them dinosaurs. <br> <br>Of course it does. You want them to have bad breath and tiny forearms to be dinosaurs? <br> <br>&gt; Why be closed-minded? <br> <br>How is having ideas about the requirements of cultural <br>progress (as opposed to making money, to buy crap) being closed-minded? <br> <br>&gt; While you might prefer working in an oldstyle derivation, not everybody does. <br> <br>The point is: <br>1) The more you like the 70s or Old-Style or anything else, the less you can mark cultural progress. <br>2) It's good to tame what you like personally - otherwise you're doing much more Art than Craft. <br> <br>&gt; And thank goodness for their efforts then. <br> <br>Yeah, where would we be without ITC Garamond...  :-/ <br>One of the worse abominations in our craft. <br> <br>To be fair, the technical/marketing stuff ITC did was great. But in terms of typographic culture, even if you think it was great 30 years ago, it's important to let it die in peace already. Move forward, irrespective of how much nostalgia you harbor. <br> <br>x-Heights: anything close to to 70s x-height is indeed bad, for readability. <br>The reason comes simply from the way humans read: <br><a href=\"http://www.themicrofoundry.com/ss_read1.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_read1.html</a> <br>Legibility (versus readability) is a mere shadow of the true functionality of text fonts. <br> <br>And the fact that users admittedly don't realize a large x-height is bad for them is the reason they need us designers in first place! In fact it has been empirically shown that users prefer font sizes somewhat too large for optimal reading. The reason is the difference between deliberative versus immersive reading. <br> <br>Also, it goes without saying that readability is totally unrelated to sales! BTW, throughout your arguments is seems that everything is eventually brought around to the <i>business</i> of type... <br> <br>&gt; While not setting any wider. <br> <br>This is dead false. <br> <br>&gt; Step back and study type for yourself. <br> <br>Study <i>readability</i> first, otherwise you're just playing in the dark. And you'll recede into the crevices of history. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; What I was saying was that it makes good business sense .... <br> <br>Did you even read what I wrote? <br> <br>&gt; .... certainly doesn't make them dinosaurs. <br> <br>Of course it does. You want them to have bad breath and tiny forearms to be dinosaurs? <br> <br>&gt; Why be closed-minded? <br> <br>How is having ideas about the requirements of cultural <br>progress (as opposed to making money, to buy crap) being closed-minded? <br> <br>&gt; While you might prefer working in an oldstyle derivation, not everybody does. <br> <br>The point is: <br>1) The more you like the 70s or Old-Style or anything else, the less you can mark cultural progress. <br>2) It's good to tame what you like personally - otherwise you're doing much more Art than Craft. <br> <br>&gt; And thank goodness for their efforts then. <br> <br>Yeah, where would we be without ITC Garamond...  :-/ <br>One of the worse abominations in our craft. <br> <br>To be fair, the technical/marketing stuff ITC did was great. But in terms of typographic culture, even if you think it was great 30 years ago, it's important to let it die in peace already. Move forward, irrespective of how much nostalgia you harbor. <br> <br>x-Heights: anything close to to 70s x-height is indeed bad, for readability. <br>The reason comes simply from the way humans read: <br><a href=\"http://www.themicrofoundry.com/ss_read1.html\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/ss_read1.html</a> <br>Legibility (versus readability) is a mere shadow of the true functionality of text fonts. <br> <br>And the fact that users admittedly don't realize a large x-height is bad for them is the reason they need us designers in first place! In fact it has been empirically shown that users prefer font sizes somewhat too large for optimal reading. The reason is the difference between deliberative versus immersive reading. <br> <br>Also, it goes without saying that readability is totally unrelated to sales! BTW, throughout your arguments is seems that everything is eventually brought around to the <i>business</i> of type... <br> <br>&gt; While not setting any wider. <br> <br>This is dead false. <br> <br>&gt; Step back and study type for yourself. <br> <br>Study <i>readability</i> first, otherwise you're just playing in the dark. And you'll recede into the crevices of history. <br> <br>hhp <br></p>"
