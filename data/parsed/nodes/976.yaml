    html: <p>Many Adobe fonts make their way into every designer's list of standbys simply by virtue of being bundled with Adobe apps. I remember Spiekermann's Officina really taking off in the US when Illustrator 6.0 came out. Both versions were bundled with it, and it started popping up everywhere. <br> <br>I would speculate that the Adobe Type Department has the financial and technical resources it has largely by virtue of other software revenues financing it. I don't know if technologies like OpenType and tools like the FDK could been built and supported by a type-only company. If Emigre or FontShop release their own operating system and design software, I'll be the first to buy them, but I'd guess they would rather focus on type. <br> <br>Adobe has invested heavily in their designs and as such should be allowed to market them however they choose. Blaming Adobe for this or that design school graduate's bad judgment or lack of interest in (or knowledge of) independent type strikes me as blame misplaced. And there is nothing to stop an independent designer from working out a bundling deal with some big software company.</p>
    html_clean: <p>Many Adobe fonts make their way into every designer's list of standbys simply by virtue of being bundled with Adobe apps. I remember Spiekermann's Officina really taking off in the US when Illustrator 6.0 came out. Both versions were bundled with it, and it started popping up everywhere. <br> <br>I would speculate that the Adobe Type Department has the financial and technical resources it has largely by virtue of other software revenues financing it. I don't know if technologies like OpenType and tools like the FDK could been built and supported by a type-only company. If Emigre or FontShop release their own operating system and design software, I'll be the first to buy them, but I'd guess they would rather focus on type. <br> <br>Adobe has invested heavily in their designs and as such should be allowed to market them however they choose. Blaming Adobe for this or that design school graduate's bad judgment or lack of interest in (or knowledge of) independent type strikes me as blame misplaced. And there is nothing to stop an independent designer from working out a bundling deal with some big software company.</p>
