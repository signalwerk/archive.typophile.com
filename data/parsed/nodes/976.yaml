  - id: 7195
    user: 1976
    date: 2003-08-02T08:41:00
    date_raw: 2 Aug 2003 — 8:41am
    votes: null
    html: "<p>Hrant said <br> <br>&gt;I have no reason to blame you for  <br>&gt;accepting work from dinosaurs,  <br>&gt;but if that makes you complacent about  <br>&gt;adapting to a changing employment  <br>&gt;dynamic, you might end up stuck in the cold. <br> <br> <br>Blame? <br> <br>Well, I personally love the virtual interaction-only customer world. And since 1988 especially (and 300/1200 kbaud modems, ouch!), we've had a lot of great clients in far flung places that I've never met during projects. Or that I only meet eventually at trade shows. <br> <br>What I was saying was that it makes good business sense to be ready to work with clients on their own terms, rather than starting by demanding that they adapt to your terms, or [you] won't work with them. <br> <br>Clients come in all kinds. A designer, or type/special type projects designer, must be ready to accommodate that. <br> <br>That clients are demanding of working with designers in an urban location, say NYC, certainly doesn't make them dinosaurs. <br> <br> <br> <br> <br>&gt;Too many type designers -and type users-  <br>&gt;are stuck in the past.  <br> <br> <br>Yes, too many designers and art directors are have pigeonholed themselves slavishly using bad choices from the past.  <br> <br>Mediocre choices.  <br> <br>Choices that whimper and squeak, instead of having a demonstrative tone of voice.  <br> <br>Choices that are just plain wrong for both subject matter and for the text itself that the copywriter has entrusted to them to breathe graphic life into. <br> <br>That's the biggest sin in graphic design today. <br> <br>I blame desktop publishing, to a degree, and the limited availability at the outset.  <br> <br>Plus, as noted elsewhere (appropriately) the simple dumping of certain fonts and families into the market along with bundling. <br> <br>Application font bundling = bungling. <br> <br>It means that the marketers have run out of competitive ideas. And that the application itself really also ought to be suspect. At least that release version. Bundled fonts are disguises on a bigger problem. <br> <br> <br> <br>&gt;Specifically, the 70s style might  <br>&gt;be described as having among other  <br>&gt;attributes: pulpy, flowing connections  <br>&gt;between stems and arches/horizontals;  <br>&gt;mannered terminals; and a goddam  <br>&gt;obese x-height. Think ITC.. then banish  <br>&gt;the sewage from you mind! :-) <br> <br> <br>Why be closed-minded?  <br> <br>We're working in the most creative medium in the world! <br> <br>Well, it's true that some type designers (me, for one) love many of the type attributes (such as those you cite) that were actually 'discovered' in the late 1800s and early 1900s, and then brought to bear again in some great designs of the '60s, '70s and '80s. <br> <br>While you might prefer working in an oldstyle derivation, not everybody does. <br> <br>And for good reason: Putting to work many of the technique lessons learned by not only earlier work like by designers working with Barnhart Brothers &amp; Spindler, American Type Founders, Lanston Monotype and others, can lead to some very powerful, very evocative, very exciting typefaces. <br> <br>Although International Typeface Corporation can be blamed, like any foundry releasing a very aggressive program over time, for putting out some faces of questionable value, they and their various stellar talented employees and licensed artists have to be commended for also doing some phenomenal work. <br> <br>Also, ITC's big claim to fame, though, was its original goal: standardizing availabilities of type families throughout all markets. With the idea being that finally, there would be ideal commonality of availability everywhere. <br> <br>But this wasn't solely about bald greed, or about creating a monopoly. This was about helping the typographer (the trade type shop) clean up its act and to provide better quality resources to designers on the local level. <br> <br>Before ITC, various (mostly metal-setting) shops in various markets basically bought only what the owner happened to like, with rare exception. ITC presented and made very attractive, the concept of buying typefaces on a subscription program, as they released them, to force the availability into each market. <br> <br>With the outstanding work outgrowing from Photo-Lettering, Inc., by Lubalin, Carnase, Stan, Benguiat and so many untold others behind the scenes, Ed Rondthaler and Ed Gottschall, and others there, got it to work. <br> <br>Their literature design and circulation also fueled a massive growth of interest in typography (whether today, one likes the particular styles, or not). <br> <br>And thank goodness for their efforts then. Because just as with the somewhat later development, sell-in (versus bigger pocketed rivals) and acceptance of PostScript itself by Adobe Systems, if that ITC font subscription program failed, I believe that none of us would have had the opportunity to be here today either designing fonts or contributing to this list. <br> <br>Others emulated them, but only after ITC led the charge. <br> <br>(Now, don't get me wrong here. I'm only so-so on ITC. But I think they did a lot for all of us that we should be grateful for. Much of what they did today is forgotten, and they're simply left with this amorphous noose hanging around their neck of dragging typography down with their typefaces. ITC Busorama, one of my favorites, notwithstanding.) <br> <br>Back to x-height and ITC's typefaces: <br> <br>A lot of designers seem to have gratefully, blindly, inherited the view from some know-little pundits in the press during the mid-1980s (yes, that far back, this snowball started rolling) that a 'large' x-height is just out and out bad. Bad concept. Bad design. ('Large' itself as a descriptor being kind of an amoeba. Hard to pin down.) <br> <br>That's just not true. <br> <br>But decision about ideal x-height for a design has to be carefully considered along with all other attributes, naturally. <br> <br>There are a lot of terrific large x-height typefaces, many of mine included. One of the reasons why my TF Habitat has been such a strong seller, consistently, since 1988, has been the intrinsic power provided in large part by its x-height. The balance versus traditional attributes such as the Venetian style traits provides added interest. <br> <br>In TF Habitat's case, the large x-height, and the way I design it on the body (within the em-square height) contribute to its looking large. <br> <br>This is a tremendous advantage that our users can immediately benefit from in their design work. <br> <br>Not only are shapes clear and highly legible due somewhat to the openness provided by the larger-looking x-height. But the faces hold open great legibility in tiny sizes. They usually look about one to two point sizes than they really are. While not setting any wider. <br> <br>Get it? x-height, if played correctly, can contribute to incredibly powerful design. But you just have to learn how to use it. Just as you have to learn how to avoid drawing type too coarsely. Or, how to properly construct a serif so that it doesn't overpower. <br> <br>I have to say, too, that ITC Garamond takes a lot of heat for no reason. True, it might not be a traditionalist's Garamond. That's all well and good. But I believe that Tony Stan really did a watershed body of work in ITC Garamond, and especially in the Condensed. <br> <br>Not because it has been synonymous with Apple Computer for so long. After all, ITC Garamond first came out in 1975-77, as ITC continued to add the Condensed series. <br> <br>Around late 1983, during its corporate identity revamping, I recall Tom Carnase's NYC studio and perhaps Apple's ad agency at the time (BBDO? Or ChiatDay?) chose it for its modernness and rubbery adaptability.  <br> <br>It was a great choice for Apple, in its original, photo-headline set form. Really splendid. Nothing in print at the time could touch it. (And at the time, there was a lot of other great print also being done.) <br> <br>It was only later (1986?), when Apple apparently commissioned Bitstream(?) to adapt ITC Garamond to some weird amalgam of normal, semi-condensed and condensed letters, that things started to go haywire, with an apparent in-house version then snaking its way into their print. <br> <br>Stem weights started to modulate out of control. Spacing was generally atrocious. I wondered a lot why no one seemed to care, judging from the typography in the ads. <br> <br>And looking back through a lot of reference regarding the origins of Hamburgefonts, for a different thread here, I was reminded again of the sheer number of very horrid implementations of ITC Garamond out there during the '70s and '80s. Despite, I'm sure, ITC's best efforts at continuity. <br> <br>Look at H. Berthold AG's no-bones-about-it, I'm-going-to-redraw-your-supplied-art-no-matter-what-you-say stance. But at least, they did it pretty well. Others, like Itek, Autologic, and many others, did horrible conversions of ITC font masters. <br> <br>(The baseline for overall comparison, ITC's own specimens, were for the most part typeset on the Alphatype text-setting system, by the way.) <br> <br>So, I, for one, want to say, thank you, Tony Stan. I think you've done a fantastic job. And I'm glad to know you, if only through your work. <br> <br>Whether considered as a poster child of '70s style or simply on its own merits, the original ITC Garamond and Condensed really is amazing. <br> <br> <br> <br>Some advice to newcomers to the type world, and to graphic designers trying to understand the nature of type and how it can relate to your work:  <br> <br>Don't blindly listen and parrot the blather about how bad x-heights are, how bad all modern design is, etc. that gets spouted. <br> <br>Step back and study type for yourself.  <br> <br>There are quite a few people who are given forums in print and online to speak about type as though they know what they're talking about. And they don't. At all.  <br> <br>More than half the time, the editors and writers and others who provide them forums have no real idea either, but have pages to fill on deadline. <br> <br>That creates a real witches' brew of generally very bad advice. <br> <br>And **that** is what really drags typography down. <br> <br>Joe <br> <br></p>"
    html_clean: "<p>Hrant said <br> <br>&gt;I have no reason to blame you for  <br>&gt;accepting work from dinosaurs,  <br>&gt;but if that makes you complacent about  <br>&gt;adapting to a changing employment  <br>&gt;dynamic, you might end up stuck in the cold. <br> <br> <br>Blame? <br> <br>Well, I personally love the virtual interaction-only customer world. And since 1988 especially (and 300/1200 kbaud modems, ouch!), we've had a lot of great clients in far flung places that I've never met during projects. Or that I only meet eventually at trade shows. <br> <br>What I was saying was that it makes good business sense to be ready to work with clients on their own terms, rather than starting by demanding that they adapt to your terms, or [you] won't work with them. <br> <br>Clients come in all kinds. A designer, or type/special type projects designer, must be ready to accommodate that. <br> <br>That clients are demanding of working with designers in an urban location, say NYC, certainly doesn't make them dinosaurs. <br> <br> <br> <br> <br>&gt;Too many type designers -and type users-  <br>&gt;are stuck in the past.  <br> <br> <br>Yes, too many designers and art directors are have pigeonholed themselves slavishly using bad choices from the past.  <br> <br>Mediocre choices.  <br> <br>Choices that whimper and squeak, instead of having a demonstrative tone of voice.  <br> <br>Choices that are just plain wrong for both subject matter and for the text itself that the copywriter has entrusted to them to breathe graphic life into. <br> <br>That's the biggest sin in graphic design today. <br> <br>I blame desktop publishing, to a degree, and the limited availability at the outset.  <br> <br>Plus, as noted elsewhere (appropriately) the simple dumping of certain fonts and families into the market along with bundling. <br> <br>Application font bundling = bungling. <br> <br>It means that the marketers have run out of competitive ideas. And that the application itself really also ought to be suspect. At least that release version. Bundled fonts are disguises on a bigger problem. <br> <br> <br> <br>&gt;Specifically, the 70s style might  <br>&gt;be described as having among other  <br>&gt;attributes: pulpy, flowing connections  <br>&gt;between stems and arches/horizontals;  <br>&gt;mannered terminals; and a goddam  <br>&gt;obese x-height. Think ITC.. then banish  <br>&gt;the sewage from you mind! :-) <br> <br> <br>Why be closed-minded?  <br> <br>We're working in the most creative medium in the world! <br> <br>Well, it's true that some type designers (me, for one) love many of the type attributes (such as those you cite) that were actually 'discovered' in the late 1800s and early 1900s, and then brought to bear again in some great designs of the '60s, '70s and '80s. <br> <br>While you might prefer working in an oldstyle derivation, not everybody does. <br> <br>And for good reason: Putting to work many of the technique lessons learned by not only earlier work like by designers working with Barnhart Brothers &amp; Spindler, American Type Founders, Lanston Monotype and others, can lead to some very powerful, very evocative, very exciting typefaces. <br> <br>Although International Typeface Corporation can be blamed, like any foundry releasing a very aggressive program over time, for putting out some faces of questionable value, they and their various stellar talented employees and licensed artists have to be commended for also doing some phenomenal work. <br> <br>Also, ITC's big claim to fame, though, was its original goal: standardizing availabilities of type families throughout all markets. With the idea being that finally, there would be ideal commonality of availability everywhere. <br> <br>But this wasn't solely about bald greed, or about creating a monopoly. This was about helping the typographer (the trade type shop) clean up its act and to provide better quality resources to designers on the local level. <br> <br>Before ITC, various (mostly metal-setting) shops in various markets basically bought only what the owner happened to like, with rare exception. ITC presented and made very attractive, the concept of buying typefaces on a subscription program, as they released them, to force the availability into each market. <br> <br>With the outstanding work outgrowing from Photo-Lettering, Inc., by Lubalin, Carnase, Stan, Benguiat and so many untold others behind the scenes, Ed Rondthaler and Ed Gottschall, and others there, got it to work. <br> <br>Their literature design and circulation also fueled a massive growth of interest in typography (whether today, one likes the particular styles, or not). <br> <br>And thank goodness for their efforts then. Because just as with the somewhat later development, sell-in (versus bigger pocketed rivals) and acceptance of PostScript itself by Adobe Systems, if that ITC font subscription program failed, I believe that none of us would have had the opportunity to be here today either designing fonts or contributing to this list. <br> <br>Others emulated them, but only after ITC led the charge. <br> <br>(Now, don't get me wrong here. I'm only so-so on ITC. But I think they did a lot for all of us that we should be grateful for. Much of what they did today is forgotten, and they're simply left with this amorphous noose hanging around their neck of dragging typography down with their typefaces. ITC Busorama, one of my favorites, notwithstanding.) <br> <br>Back to x-height and ITC's typefaces: <br> <br>A lot of designers seem to have gratefully, blindly, inherited the view from some know-little pundits in the press during the mid-1980s (yes, that far back, this snowball started rolling) that a 'large' x-height is just out and out bad. Bad concept. Bad design. ('Large' itself as a descriptor being kind of an amoeba. Hard to pin down.) <br> <br>That's just not true. <br> <br>But decision about ideal x-height for a design has to be carefully considered along with all other attributes, naturally. <br> <br>There are a lot of terrific large x-height typefaces, many of mine included. One of the reasons why my TF Habitat has been such a strong seller, consistently, since 1988, has been the intrinsic power provided in large part by its x-height. The balance versus traditional attributes such as the Venetian style traits provides added interest. <br> <br>In TF Habitat's case, the large x-height, and the way I design it on the body (within the em-square height) contribute to its looking large. <br> <br>This is a tremendous advantage that our users can immediately benefit from in their design work. <br> <br>Not only are shapes clear and highly legible due somewhat to the openness provided by the larger-looking x-height. But the faces hold open great legibility in tiny sizes. They usually look about one to two point sizes than they really are. While not setting any wider. <br> <br>Get it? x-height, if played correctly, can contribute to incredibly powerful design. But you just have to learn how to use it. Just as you have to learn how to avoid drawing type too coarsely. Or, how to properly construct a serif so that it doesn't overpower. <br> <br>I have to say, too, that ITC Garamond takes a lot of heat for no reason. True, it might not be a traditionalist's Garamond. That's all well and good. But I believe that Tony Stan really did a watershed body of work in ITC Garamond, and especially in the Condensed. <br> <br>Not because it has been synonymous with Apple Computer for so long. After all, ITC Garamond first came out in 1975-77, as ITC continued to add the Condensed series. <br> <br>Around late 1983, during its corporate identity revamping, I recall Tom Carnase's NYC studio and perhaps Apple's ad agency at the time (BBDO? Or ChiatDay?) chose it for its modernness and rubbery adaptability.  <br> <br>It was a great choice for Apple, in its original, photo-headline set form. Really splendid. Nothing in print at the time could touch it. (And at the time, there was a lot of other great print also being done.) <br> <br>It was only later (1986?), when Apple apparently commissioned Bitstream(?) to adapt ITC Garamond to some weird amalgam of normal, semi-condensed and condensed letters, that things started to go haywire, with an apparent in-house version then snaking its way into their print. <br> <br>Stem weights started to modulate out of control. Spacing was generally atrocious. I wondered a lot why no one seemed to care, judging from the typography in the ads. <br> <br>And looking back through a lot of reference regarding the origins of Hamburgefonts, for a different thread here, I was reminded again of the sheer number of very horrid implementations of ITC Garamond out there during the '70s and '80s. Despite, I'm sure, ITC's best efforts at continuity. <br> <br>Look at H. Berthold AG's no-bones-about-it, I'm-going-to-redraw-your-supplied-art-no-matter-what-you-say stance. But at least, they did it pretty well. Others, like Itek, Autologic, and many others, did horrible conversions of ITC font masters. <br> <br>(The baseline for overall comparison, ITC's own specimens, were for the most part typeset on the Alphatype text-setting system, by the way.) <br> <br>So, I, for one, want to say, thank you, Tony Stan. I think you've done a fantastic job. And I'm glad to know you, if only through your work. <br> <br>Whether considered as a poster child of '70s style or simply on its own merits, the original ITC Garamond and Condensed really is amazing. <br> <br> <br> <br>Some advice to newcomers to the type world, and to graphic designers trying to understand the nature of type and how it can relate to your work:  <br> <br>Don't blindly listen and parrot the blather about how bad x-heights are, how bad all modern design is, etc. that gets spouted. <br> <br>Step back and study type for yourself.  <br> <br>There are quite a few people who are given forums in print and online to speak about type as though they know what they're talking about. And they don't. At all.  <br> <br>More than half the time, the editors and writers and others who provide them forums have no real idea either, but have pages to fill on deadline. <br> <br>That creates a real witches' brew of generally very bad advice. <br> <br>And **that** is what really drags typography down. <br> <br>Joe <br> <br></p>"
