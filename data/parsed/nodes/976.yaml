    html: "<p>Hrant wrote  <br> <br>&gt;Yeah, and child laborers in sweat shops  <br>&gt;are a classification of worker. <br> <br> <br>I abhor child labor, too. But which typefounders, now or past, employ(ed) underage workers? <br> <br>And how does unfair child labor out there in the world apply to running a typefoundry as a business? <br> <br> <br> <br> <br>&gt;What do you know about how humans read,  <br>&gt;and where did you learn it? <br> <br>Um, apart from the documented research, about 30 years of drawing typefaces, and about 20 years of successfully selling fonts to hundreds of thousands of customers, nearly world wide. And continually engaging customers and learning from feedback. <br> <br> <br> <br>&gt;You can't rely on readers for precise feedback  <br>on subconscious issues. <br> <br>I'm sorry; I thought you had said that readers were (quite consciously) saying, (quote), <br> <br>&gt;&gt;...but after about 3 issues there were  <br>&gt;&gt;enough letters from readers complaining  <br>&gt;&gt;of reading strain that we had to change it... <br> <br> <br> <br> <br>&gt;The vertical em-space is taken up by:  <br>&gt;x-height, ascenders, descenders,  <br>&gt;and internal leading. Obviously,  <br>&gt;the larger the x-height the less room  <br>&gt;left for everything else. Duh. <br> <br> <br>Oh, yes, sorry, I forgot to mention: <b>Duh to infinity.</b> <br> <br> <br> <br>&gt;You're not reading what I'm writing. <br> <br>Yes, I think that I am. To the extent that it's readable. <br> <br> <br> <br>(re providing annotation) <br>&gt;In a discussion group like this?!  <br>&gt;For now, please read my essay!  <br>&gt;But eventually I'll get more formal,  <br>&gt;don't worry. I'm not ready yet. <br> <br> <br>Oh, ok. <br> <br>I guess I'd hoped that you had annotated material (such as your essay) on hand to quote from, with copy and paste. <br> <br> <br> <br>&gt;On Typo-L you recently wrote:  <br>&gt;\"[My fonts] have that large x-height  <br>&gt;that I have become so attached to recently.\" <br> <br> <br>Wasn't me. I haven't bothered with Typo-L in probably more than a year. <br> <br>And besides, if a type designer says that, so what? <br> <br> <br> <br>&gt;You're completely skewing what I said. ... <br> <br>Oh, ok. <br> <br> <br> <br>&gt;Dear huge x-height boys:  <br>&gt;just give it up! Your fonts  <br>&gt;are less readable. <br> <br> <br>Sorry. Not likely.  <br> <br>There are several kinds of fonts that are less readable: <br> <br>1) Fonts suffering from bad concept; <br>2) Fonts suffering from bad execution; <br>3) Fonts whose weight range is badly selected; <br>4) Fonts whose width doesn't suit the concept; <br>5) Fonts that are a bad selection for their reproduction environment (too light for newsprint); <br>6) Fonts whose point size, leading and weight are wrongly selected for the material and platform (book, ad, etc.) and reader (toddler, young, midage, elderly) where they are being expected to perform. <br> <br>Other than that, x-height itself doesn't injure fonts. <br> <br>Yes, there have been some bad designs out there over the years that also have tallish x-height.  <br> <br>Now, it might be possible for a later type designer to see that a different x-height might've better suited the original concept.  <br> <br>But the x-height itself would not have been what made it a bad design. <br> <br>By the way, I don't believe that either Jim or myself are \"huge x-height boys\". I, for one, don't like that pigeonholing. <br> <br>I, for one, design with an open mind. <br> <br>Joe <br> <br></p>"
