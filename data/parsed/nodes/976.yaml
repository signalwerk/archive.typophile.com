    html: "<p>Hrant said <br> <br>&gt;? What research is that, exactly? <br> <br>Sorry, I'm not the one widely quoting research here. <br> <br>Nor do I have the time. As I said, the only reason why I'm bothering with this at all is to dispel disinformation. <br> <br> <br> <br> <br> <br>&gt;The act of drawing typefaces  <br>&gt;teaches nothing about how they are read as text.  <br> <br>&gt;Sales are only slightly related to readability. <br> <br> <br>Is that so? <br> <br> <br> <br> <br>&gt;Readers can and do report general problems,  <br>&gt;like \"I get tired quickly when reading this <br>&gt;magazine.\" They can't and don't say things  <br>&gt;like \"The font's x-height is so large that  <br>&gt;it's inhibiting good bouma formation.\" <br> <br>And of course, one would never expect them to. <br> <br>But at that point, that's where more research is then needed, such as focus groups that would be probably more intrusive than usual. <br> <br>And even so, you might never get guidance that's adequate. <br> <br>As mentioned earlier, I believe (from seeing the phenomenon for thirty years) that research and meetings upfront, rather than in hindsight, are where more effective guidance will spring. <br> <br>It avoids art for art's sake, which can be counterproductive in the commercial world. And it will save a lot of expense in the long run if shooting-from-the-hit decisions without research prove to be incorrect. <br> <br> <br> <br> <br>&gt;&gt; Wasn't me.  <br> <br>&gt;The rest was James. Do you not really  <br>&gt;read his stuff either? <br> <br>What in the world are you referring to?  <br> <br>I not only read your 'stuff', I try probably more than necessary, to avoid using it out of context. <br> <br> <br> <br>&gt;When you're finished reading all the  <br>&gt;references in there, I'll give you  <br>&gt;another batch... and then another. <br> <br>&gt;By the time you catch up to me,  <br>&gt;your business will be broke. <br> <br> <br>Two things: <br> <br>Why in the world do you believe that I need to 'catch up' to you? <br> <br>and <br> <br>Why in the world would you say a hateful thing like 'By the time you catch up to me, your business will be broke.'? <br> <br>Oh, and thanks for the passing reference to the Ovink material. <br> <br>Excellent for its time. I especially enjoy the tables on pp. 144-153.  <br> <br>But it's from 1938. <br> <br> <br> <br>&gt;Please don't try designing a book face. <br> <br>Well, if I were trying to be nasty, I might suggest the same thing of you, sir. <br> <br>Sorry, I've designed plenty of faces perfectly appropriate for long text such as books. <br> <br>And faces that many, many publication designers around the world (and who, after all, are really the ones dangling above the flame) have used successfully, and repeatedly, for very large books. <br> <br>Too bad they apparently don't fit your narrow view of what constitutes a successful face usable in a so-called book environment. <br> <br> <br>&gt;...you'd get it. <br> <br>Hrant, believe me, I get your argument, already. <br> <br> <br> <br>&gt;Let others be the judge.  <br>&gt;And I'm not talking about people  <br>&gt;who you already know share your  <br>&gt;aesthetic (and anti-technical) <br>&gt;sensibilities. <br> <br> <br>Anti-technical?  <br> <br>Frankly, I find that knowing when to close the books and actually do some real work is important. <br> <br>You should try it. <br> <br>Joe <br> <br></p>"
