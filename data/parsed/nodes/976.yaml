    html: "<p>To my  <br> <br>&gt;&gt; Why in the world do you believe that  <br>&gt;&gt;I need to 'catch up' to you?  <br> <br> <br>Hrant wrote <br> <br>&gt;Because you don't understand readability  <br>&gt;even remotely - it's clear from your  <br>&gt;explanation of where you learned about it - <br>&gt;virtually nowhere. But don't worry too much, <br>&gt;you're not alone. On the other hand, <br>&gt;after 20-30 years of focusing on making money,  <br>&gt;one would hope for a little bit more  <br>&gt;intellectual curiosity. But reading all you  <br>&gt;have to write here, it's pretty safe to  <br>&gt;assume that it's simply too late for you. <br> <br> <br>Thanks so much for that. Sorry, but you're quite off base. <br> <br>How in the world could you possibly draw such a conclusion without knowing anything about what human interface and type design ergonomics research I've studied? <br> <br>Too late for what? As with all responsible designers (type designers or not), one's whole career is a living laboratory. <br> <br>But I didn't just stop there, and let projects and client politics and profitability lead me around by the nose.  <br> <br>My research started before I ever entered the field. And has continued - er - continually, throughout. <br> <br>And why do you keep repeating that you believe the most important thing to me about typography is making money?  <br> <br>Would you please stop that? <br> <br>If it was the most important thing, why then do you think that I would have started Treacyfaces with the concept of solely learning from the past's mistakes, and then seeking to do better? <br> <br>If I were most concerned with money, at the time we incorporated (1984), I could easily have taken an approach like (for example) The Font Company, knocking off everyone in sight in one way or another.  <br> <br>Ultimately so top-heavy with me-too faces that they had to close, selling off their so-called inventory in a fire sale. But before that fire sale, wow, wall to wall investor cash. <br> <br>Well, look where such an approach leads. They're long gone. <br> <br>(I've never even used outside investors....) <br> <br>I've always been quite happy eschewing financial gain to pursue furthering the craft first. <br> <br>First and foremost, I love type. <br> <br> <br> <br> <br>&gt;And don't go dissin' Ovink on me -  <br>&gt;has was a giant. <br> <br> <br>Why do you assume that I'm (ahem) dissin' Ovink? Because I both quote him verbatim, and then can draw my own conclusions from the presentations? <br> <br>I can't help it if, at that point in his career, he was down on Cassandre, Peignot...and...the French! <br> <br>;-) <br> <br>But seriously: I didn't say that he didn't do a lot of work to assemble his research. I respect him for the very laborious work, and certainly, for his very labored presentations. <br> <br>But really. It was from 1938. <br> <br> <br>Sorry, I don't talk like a statistician. Never have, never will. <br> <br>And you'll never, ever, ever see me citing research notes referencing cuddly beagles. <br> <br>I'm not going to fill my writing (as least as far as a setting like this is concerned) with needless typographic pseudo-laboratory psychobabble. <br> <br>But that doesn't mean, as a responsible designer, that I don't care about factual studies that are in fact meaningful to consider regarding a project. <br> <br>I simply think you're looking at it from too much a bean counter's view. And to get back to the beginning, I think that your pseudo-citing innuendo can be quite dangerous to graduates entering the field. <br> <br>And that is of course why this will most likely not end in agreeing to agree. <br> <br>I respect you for respecting the research and so taking it to heart. <br> <br>I choose instead to read the research, and then simply take the research with a grain of salt.  <br> <br>Especially when it comes to designing something new. Especially when much of the research done has been inconclusive. Especially when so much of typography has moved on since the research. (As much as I respect it.) <br> <br>And especially as the research regards display type (of its day). Er, like Peignot! <br> <br> <br> <br>&gt;&gt; Peignot ... Long text? Sure  <br> <br>&gt;You're hallucinating.  <br>&gt;Make sure to stop anybody who might ask  <br>&gt;you set a book for them. <br> <br> <br>I think you really need to open your mind a little. <br> <br> <br> <br> <br>&gt;The argument is much more than over fonts,  <br>&gt;it's about how to mark cultural progress,  <br>&gt;as opposed to milking nostalgia and  <br>&gt;complacency for money. <br> <br> <br>Well, if you say so. <br> <br>It seems to me that from the body of research done, and how leading foundries and their most talented creative directors and artists, punchcutters, phototypesetting filmmakers, digitizers, etc., have learned from it over the 20th century, that quite a lot of 'cultural progress' has indeed been made in type design and manufacturing. <br> <br>And, as has been noted in type and design industry writings many times during the last century, type design developments have tended to well echo human cultural change. <br> <br>Who's milking complacency here? <br> <br>Joe <br> <br></p>"
