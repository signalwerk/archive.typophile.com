    html: "<p>&gt; What business sense does it make to denigrate clients? <br> <br>The more you care about \"business sense\", the less likely you are to develop rewarding human partisanship among your peers, and the less likely you are to mark your place in culture. That's how humans work - but of course, to each his own. Personally, I think Capitalism is criminal. <br> <br>In the late 80s I used to work as a salesman at Creative Computers (long live the Amiga), and my best moment wasn't when I sold a $13,000 system through an honest laudation of its merits, but when I put a primadonna customer in his place: he was a bit too demanding about returning something, so I became a little rough with him. He challenged \"Are you the owner of this business?\" My reply was of course: \"I would never own a retail store.\" <br> <br>I have no reason to blame you for accepting work from dinosaurs, but if that makes you complacent about adapting to a changing employment dynamic, you might end up stuck in the cold. <br> <br>&gt; what are you referring to as far as typographic style <br> <br>Too many type designers -and type users- are stuck in the past. <br> <br>Specifically, the 70s style might be described as having among other attributes: pulpy, flowing connections between stems and arches/horizontals; mannered terminals; and a goddam obese x-height. Think ITC.. then banish the sewage from you mind!  :-) <br> <br>hhp <br></p>"
