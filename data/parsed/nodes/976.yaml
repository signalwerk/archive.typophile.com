rld do you believe that I need to 'catch up' to you? <br> <br>and <br> <br>Why in the world would you say a hateful thing like 'By the time you catch up to me, your business will be broke.'? <br> <br>Oh, and thanks for the passing reference to the Ovink material. <br> <br>Excellent for its time. I especially enjoy the tables on pp. 144-153.  <br> <br>But it's from 1938. <br> <br> <br> <br>&gt;Please don't try designing a book face. <br> <br>Well, if I were trying to be nasty, I might suggest the same thing of you, sir. <br> <br>Sorry, I've designed plenty of faces perfectly appropriate for long text such as books. <br> <br>And faces that many, many publication designers around the world (and who, after all, are really the ones dangling above the flame) have used successfully, and repeatedly, for very large books. <br> <br>Too bad they apparently don't fit your narrow view of what constitutes a successful face usable in a so-called book environment. <br> <br> <br>&gt;...you'd get it. <br> <br>Hrant, believe me, I get your argument, already. <br> <br> <br> <br>&gt;Let others be the judge.  <br>&gt;And I'm not talking about people  <br>&gt;who you already know share your  <br>&gt;aesthetic (and anti-technical) <br>&gt;sensibilities. <br> <br> <br>Anti-technical?  <br> <br>Frankly, I find that knowing when to close the books and actually do some real work is important. <br> <br>You should try it. <br> <br>Joe <br> <br></p>"
