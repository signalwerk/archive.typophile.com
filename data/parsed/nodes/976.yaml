    html: "<p>&gt; Why in the world do you believe that I need to 'catch up' to you? <br> <br>Because you don't understand readability even remotely - it's clear from your explanation of where you learned about it - virtually nowhere. But don't worry too much, you're not alone. On the other hand, after 20-30 years of focusing on making money, one would hope for a little bit more intellectual curiosity. But reading all you have to write here, it's pretty safe to assume that it's simply too late for you. <br> <br>&gt; real work <br> <br>You mean stuff none of your peers ever refer to? <br> <br>Peignot: I like it for the same reasons its creator liked it - it was an attempt at alphabet reform (even though it was a somewhat misguided one). That's not why the people who made it a financial success liked it - and that's one reason Cassandre committed suicide. <br> <br>And don't go dissin' Ovink on me - has was a giant. <br> <br>&gt; Peignot ... Long text? Sure <br> <br>You're hallucinating. <br>Make sure to stop anybody who might ask you set a book for them. <br> <br>&gt; Fraktur <br> <br><a href=\"http://www.themicrofoundry.com/ss_fraktur1.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_fraktur1.html</a> <br>Read and learn, my friend. What they've taught you -and you've taught yourself- is mostly convenient illusion. <br> <br>-- <br> <br>The argument is much more than over fonts, it's about how to mark cultural progress, as opposed to milking nostalgia and complacency for money. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; Why in the world do you believe that I need to 'catch up' to you? <br> <br>Because you don't understand readability even remotely - it's clear from your explanation of where you learned about it - virtually nowhere. But don't worry too much, you're not alone. On the other hand, after 20-30 years of focusing on making money, one would hope for a little bit more intellectual curiosity. But reading all you have to write here, it's pretty safe to assume that it's simply too late for you. <br> <br>&gt; real work <br> <br>You mean stuff none of your peers ever refer to? <br> <br>Peignot: I like it for the same reasons its creator liked it - it was an attempt at alphabet reform (even though it was a somewhat misguided one). That's not why the people who made it a financial success liked it - and that's one reason Cassandre committed suicide. <br> <br>And don't go dissin' Ovink on me - has was a giant. <br> <br>&gt; Peignot ... Long text? Sure <br> <br>You're hallucinating. <br>Make sure to stop anybody who might ask you set a book for them. <br> <br>&gt; Fraktur <br> <br><a href=\"http://www.themicrofoundry.com/ss_fraktur1.html\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/ss_fraktur1.html</a> <br>Read and learn, my friend. What they've taught you -and you've taught yourself- is mostly convenient illusion. <br> <br>-- <br> <br>The argument is much more than over fonts, it's about how to mark cultural progress, as opposed to milking nostalgia and complacency for money. <br> <br>hhp <br></p>"
