    html: "<p>Hrant wrote: <br><i>It was only later (1986?), when Apple apparently commissioned Bitstream(?) to adapt ITC Garamond to some weird amalgam of normal, semi-condensed and condensed letters, that things started to go haywire, with an apparent in-house version then snaking its way into their print.</i> <br> <br>I really don't agree with that. The Bitstream version is mush better than the ITC condensed version. Firstly, it was condensed by only 80% rather than ITC's 64%. The joints and details are much better drawn than the original ITC. I had already pointed this out in another thread: <a href=\"http://www.typophile.com/cgibin/show.pl?30/13191\" target=\"_blank\">http://www.typophile.com/cgibin/show.pl?30/13191</a> <br> <br>&lt;img&gt; <br> <br>Early on in my typography 'career' (i.e. high school) I really had an ITC Garamond 'phase'. We used it on our school magazine. It was my idea because I thought it was such a beautiful face. I actually thought that it was <i>the</i> original Garamond. While it could hardly be called a Garamond per se, it was nonetheless a significant player in our type history. I wouldn't call it an abomination. But that's just me. <br> <br>Dorling Kindersly still uses ITC Garamond for their eye-witness guides. And it works very well.</p>"
