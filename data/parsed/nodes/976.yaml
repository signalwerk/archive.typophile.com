    html: "<p>Somebody wrote: <br> <br>\"My point was simply that Adobe has probably long ago paid for the fonts it is including in the student pack.\" <br> <br>This is simply not true. Many of these are relatively recent designs. What *is* true is that few or none of them invoke per-unit royalty payments. This was necessary to get the price down to the level that the educational market would buy it. <br> <br>Nick Shinn made some comments about the \"ruthless\" nature of the pricing of the Type Classics for Learning package at $99/user. I found those comments actually bordering on offensive, but it's probably worth explaining why it exists. <br> <br>The pricing of Type Classics for Learning has little to do with ruthlessness or even direct competition, and a lot to do with the realities of the market: <br> <br>- schools aren't willing to pay much for fonts <br>- schools and their students will use (and pirate) fonts if they don't pay for them <br>- ergo, we are probably better off licensing some fonts cheaply to the schools. We get some money, which is better than none, and they get a legal license, and we promote legitimate licensing over piracy. <br> <br>Personally, Nick, I think it would be perfectly reasonable for you to license your whole set of fonts for $25/user to the education market. It's not like Adobe is magically shutting you out or something. Sure, we've got a bigger set of better-known fonts, but that's sort of the permanent reality for small, newer, independent foundries trying to compete, and not particular to the education market or our pricing of Type Classics. <br> <br>Regards, <br> <br>T</p>"
    html_clean: "<p>Somebody wrote: <br> <br>\"My point was simply that Adobe has probably long ago paid for the fonts it is including in the student pack.\" <br> <br>This is simply not true. Many of these are relatively recent designs. What *is* true is that few or none of them invoke per-unit royalty payments. This was necessary to get the price down to the level that the educational market would buy it. <br> <br>Nick Shinn made some comments about the \"ruthless\" nature of the pricing of the Type Classics for Learning package at $99/user. I found those comments actually bordering on offensive, but it's probably worth explaining why it exists. <br> <br>The pricing of Type Classics for Learning has little to do with ruthlessness or even direct competition, and a lot to do with the realities of the market: <br> <br>- schools aren't willing to pay much for fonts <br>- schools and their students will use (and pirate) fonts if they don't pay for them <br>- ergo, we are probably better off licensing some fonts cheaply to the schools. We get some money, which is better than none, and they get a legal license, and we promote legitimate licensing over piracy. <br> <br>Personally, Nick, I think it would be perfectly reasonable for you to license your whole set of fonts for $25/user to the education market. It's not like Adobe is magically shutting you out or something. Sure, we've got a bigger set of better-known fonts, but that's sort of the permanent reality for small, newer, independent foundries trying to compete, and not particular to the education market or our pricing of Type Classics. <br> <br>Regards, <br> <br>T</p>"
