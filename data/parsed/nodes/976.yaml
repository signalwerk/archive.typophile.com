    html: "<p>&gt; the documented research <br> <br>? <br>What research is that, exactly? <br> <br>&gt; 30 years of drawing typefaces <br> <br>The act of drawing typefaces teaches nothing about how they are read as text. <br> <br>&gt; 20 years of successfully selling fonts <br> <br>Sales are only slightly related to readability. <br> <br>&gt; feedback <br> <br>Feedback from designers is flawed in terms of readability because they mostly don't understand it [either]. <br> <br>Feedback from readers is flawed because they can't convey their subconscious (which is where immersive reading largely happens). <br> <br>&gt; I thought you had said that readers were (quite consciously) saying <br> <br>Readers can and do report general problems, like \"I get tired quickly when reading this magazine.\" They can't and don't say things like \"The font's x-height is so large that it's inhibiting good bouma formation.\" <br> <br>It's like when you take your car to the mechanic, you let him do his job - and hopefully he knows that there's such a thing as too much oil in the pan for example. <br> <br>&gt; copy and paste <br> <br>OK, sure, here are the Notes: <br> <br>\" <br>1.\tASCII is the standardized code that most computers use to assign numerical value to letters and other characters. <br>2.\tThe Korean Hangul writing system uses a hybrid scheme of alphabetic syllables that possesses the advantages of each while avoiding their drawbacks. For a description of this most admirable script refer to Taylor &amp; Taylor's The Psychology of Reading, chapter 5. <br>3.\t\"The most serious defect of the English alphabet is that only 23 letters are available to represent about 44 phonemes. (Of the 26 letters, 'c, q and x' are superfluous.)\" Taylor &amp; Taylor, p. 93. <br>4.\tBeagles also make wonderful companions, however. <br>5.\tFor a meticulous description of punchcutting consult La Gravure du Poin</p>"
    html_clean: "<p>&gt; the documented research <br> <br>? <br>What research is that, exactly? <br> <br>&gt; 30 years of drawing typefaces <br> <br>The act of drawing typefaces teaches nothing about how they are read as text. <br> <br>&gt; 20 years of successfully selling fonts <br> <br>Sales are only slightly related to readability. <br> <br>&gt; feedback <br> <br>Feedback from designers is flawed in terms of readability because they mostly don't understand it [either]. <br> <br>Feedback from readers is flawed because they can't convey their subconscious (which is where immersive reading largely happens). <br> <br>&gt; I thought you had said that readers were (quite consciously) saying <br> <br>Readers can and do report general problems, like \"I get tired quickly when reading this magazine.\" They can't and don't say things like \"The font's x-height is so large that it's inhibiting good bouma formation.\" <br> <br>It's like when you take your car to the mechanic, you let him do his job - and hopefully he knows that there's such a thing as too much oil in the pan for example. <br> <br>&gt; copy and paste <br> <br>OK, sure, here are the Notes: <br> <br>\" <br>1.\tASCII is the standardized code that most computers use to assign numerical value to letters and other characters. <br>2.\tThe Korean Hangul writing system uses a hybrid scheme of alphabetic syllables that possesses the advantages of each while avoiding their drawbacks. For a description of this most admirable script refer to Taylor &amp; Taylor's The Psychology of Reading, chapter 5. <br>3.\t\"The most serious defect of the English alphabet is that only 23 letters are available to represent about 44 phonemes. (Of the 26 letters, 'c, q and x' are superfluous.)\" Taylor &amp; Taylor, p. 93. <br>4.\tBeagles also make wonderful companions, however. <br>5.\tFor a meticulous description of punchcutting consult La Gravure du Poin</p>"
