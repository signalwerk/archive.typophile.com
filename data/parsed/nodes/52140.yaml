    html: <p>Hey, Paul has the skills to brag... His work IS hot. Plus, if you are on the search for good new typeface design, looking at the work of University of Reading graduates is a good place to start. I am proud to be part of the group. But you needn't limit yourself to the names of the three classes up on that site; all of the past decades worth of students are worth a look.</p>
