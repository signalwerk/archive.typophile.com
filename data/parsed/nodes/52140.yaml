    <p>Hello there</p>
    <p>I'm looking for a new font/fontdesigner to write an article about in a new magazine about design for the danish design community. The article will feature in dual language (danish-english)! The tricks is that the font might even be the main font for the whole magazine... </p>
    <p>So I like to hear from you guys. Who is the next star on the big sky of fonts!</p>
    <p>Love </p>
    <p>Mark</p>
