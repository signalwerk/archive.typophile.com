    <p>Hello,</p>
    <p>I am looking for a vintage looking typeface, similar to the one above. I am not worried about it being distressed, but want it to have an Victorian/early 20th century feel. Certainly serifed, and with similar line thicknesses (as seen on the A).</p>
    <p>It doesn't have to be shadowed either, as can add that if required...</p>
    <p>So far the closest I have found is: ITC Quorum BT, but am looking for more suitable options.</p>
    <p>I maybe that I end up hand drawing it, but would like a base font to alter.</p>
    <p>Any help, suggestions, or places to look(such as specific library's/books) would be great.</p>
    <p>Thanks in advance.</p>
    <p>David</p>
