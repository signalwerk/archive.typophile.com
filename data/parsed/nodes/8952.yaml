    html: <p>Mark is right, RoboFog can probably be scripted to do this (or FontLab?), but I wouldn't know how either. Even after spending a lot of time spacing, there's inevitably something wrong that reveals itself when you look at the AFM. It's always a back-and-forth situation for me. <br> <br>For what it's worth, I created a FileMaker database that imports an AFM file, and allows you to do all kinds of operations on specific kinds of kerning pairs. You could say "take all kern pairs where 'o' is the first letter and reduce them by 10. Also take all the pairs where 'v' is the second character, and change the 'v' to a 'w'. Then do a global adjust of -5% on the whole tamale." That sort of thing. <br> <br>Let me know if you are interested in having it (you have to have FileMaker to run it, I'm sorry to say). <br> <br>Alan</p>
