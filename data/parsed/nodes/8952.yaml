    html: <p>Maybe you're already doing this, but I think the thing to do is get into the habit of getting the spacing to work without kerning first and after it's just right, then tackle the problem pairs with kerning.  <br> <br>As to whether what you suggest is possible, it does seem like the sort of thing RoboFOG can do (although I don't use it).</p>
