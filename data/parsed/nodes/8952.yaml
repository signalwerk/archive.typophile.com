  html: "<p>I've often completed all the spacing and kerning on a typeface and when I get all done realize there are far too many kern pairs for a specific character in the font. <br> <br>That conclusion leads me to believe that I have poorly spaced the right sidebearing of the character and I often wish for some tool I could use to merge spacing and kerning data to yield the least amount of kerns. <br> <br>I call this concept \"Flatten Kerning\" similar to flattening an image in Photoshop. However I do not have the technical ability to create such an application but feel it could be very simple if I knew how to implement something that would work with a .met file from FOG. <br> <br>Here's my real life example to illustratrate the need for this tool: <br> <br>Let's say I've exported the spacing and kerning file from FOG and this is all the data it tells me about my 'o' character. <br> <br>o a -65 kern <br>o b -25 kern <br>o c -5 kern <br>o d -45 kern <br>o e -5 kern <br>o f -10 kern <br>o g -5 kern <br>o h -10 kern <br>o i -5 kern <br>o j -50 kern <br>o k -5 kern <br>o l -5 kern <br>o m -5 kern <br>o n -5 kern <br>o o -10 kern <br>o p -25 kern <br>o q -5 kern <br>o r -25 kern <br>o s -15 kern <br>o t -25 kern <br>o u -5 kern <br>o v -65 kern <br>o w -60 kern <br>o x -45 kern <br>o y -15 kern <br>o z -35 kern <br> <br>As you can see due to not getting the spacing right, I have a kern pair for almost every lowercase instance. <br> <br>If I look at my right sidebearing, it's 10 which tells me if I take it to 5 I can kill off 10 kern pairs from the font as well as reduce the kerning for the remaining pairs for my 'o' <br> <br>o a -60 kern <br>o b -20 kern <br>o d -40 kern <br>o f -5 kern <br>o h -5 kern <br>o j -45 kern <br>o o -5 kern <br>o p -20 kern <br>o r -20 kern <br>o s -10 kern <br>o t -20 kern <br>o v -60 kern <br>o w -55 kern <br>o x -40 kern <br>o y -10 kern <br>o z -30 kern <br> <br>I could do this process manually but I think it could be automated with some sort of program. <br> <br>Some problems come to mind . . . <br> <br>First, the metrics file only contains the width of the character which means it'd be difficult to determine the sidebearings of the character. <br> <br>Second, what to make of left sidebearings since the case may be such that the left sidebearing could be causing the creation of a ton of kerning pairs when all it needs to be is fixed. <br> <br>I am excited to hear your thoughts and comments about this and please don't tell me FL already does this, I'm looking for a solution that will work for FOG. <br> <br>Stuart :D</p>"
