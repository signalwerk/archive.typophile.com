h some sort of program. <br> <br>Some problems come to mind . . . <br> <br>First, the metrics file only contains the width of the character which means it'd be difficult to determine the sidebearings of the character. <br> <br>Second, what to make of left sidebearings since the case may be such that the left sidebearing could be causing the creation of a ton of kerning pairs when all it needs to be is fixed. <br> <br>I am excited to hear your thoughts and comments about this and please don't tell me FL already does this, I'm looking for a solution that will work for FOG. <br> <br>Stuart :D</p>"
