    html: <p>Stuart - <br> <br>As much as I'm interested in your proposal for merging the kerning, I'm not sure it's really the issue. The issue is over kerning. Many of the pairs you've listed in your message are not pairs that would traditionally need kerning (of course there are exceptions, especially with an irregular design). I would look at the spacing before altering the kerning in some way. Many times if the spacing isn't solid, the kerning pairs will snowball.</p>
