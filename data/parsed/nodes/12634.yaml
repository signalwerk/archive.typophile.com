      <p>I have the feeling that the classic American faces have a little more virtuoso "drawing" in them than comparable European faces. This would certainly be true of Goudy's faces, and you still see it in Berlow, Hoefler (especially his serifed), and of course Robert Slimbach.</p>
      <p>An appreciation for the beauty of line for its own sake, rather than as mere servant to the overbearing rigor of a design system. At the risk of generalizing, there is something of use to commercial showmanship in this, and American culture is very commercial.</p>
      <p>Having said that, in the digital revolution (despite the contributions of LettError and FontShop, a largely American-driven phenomenon), there has been a strain of hardcore experimentalism, where American typographers and type designers have been every bit as theoretical as the Europeans, and not afraid to produce conceptually driven work quite harsh in appearance. Many of Licko's designs, such as Matrix and Base, have this quality.</p>
      <p>So these two leading proponents, Slimbach and Licko, could be said to represent the dichotomy of American culture, the mainstream (corporate) and the anti-establishment.</p>
    html_clean: |-
