      <p>Centered Clarenden caps as display and justified Century Expanded as text was, for me, the “American Look” in the 50s. Later (early 60s) Cooper Black was all the rage. The 60s also brought the International style to the U.S. with AG, then Univers and Helvetica. Since then we have gone through many font flirtations. I don’t think I can come up with a single face that would mean “American” over all time. Maybe that is the point. America is always in a visual state of flux. We either borrow form from others or quickly invent our own and just as quickly abandon it in favor of some newer fad.</p>
      <p>ChrisL</p>
