      <p>I thought Adrian Frutiger was French? Anywho, this is an interesting discussion and one thing that a few others have commented on already is that its really hard to determine the quintessential American face primarily because America is so different in many ways. I'm from Cincinnati, Ohio and live in New York City and let me tell you they're almost completely different countries. New York has more in common with London and Paris than it does with Ohio (aside from language of course). If I were in Cincinnati I would answer Rotis (since there are far fewer designers there and much work is done by only a few firms), but here in New York there are so many different designers and design firms that there doesn't seem to be just one answer. </p>
