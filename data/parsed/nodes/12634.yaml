    html: <p>Upon reading the initial question, Morris Fuller Benton's Franklin Gothic family immediately jumped to the front of my mind. While I agree that Century Schoolbook and numerous classic woodtype faces have a quintessential Americana flavor to them, among others, I think one would be hard-pressed to find a typeface that has had such consistant and widespread usage since its creation than Franklin Gothic. Perhaps it's just my newspaper background shining through, but I think the typeface has an elegant simplicity to it, with a touch of flavor, as well. Its heavy variety, for example, has a way of being firm without the artlessness of Impact or any number of unfortunate slab serifs. Franklin Gothic is undoubtably "new" -- at least as of the machine age -- and I think its lack of pretense speaks to what I like to think of as one of the best aspects of the American character, assuming there is such a thing. In other words, I don't think the typeface is trying to pass itself off as something it's not. It's just a great, utilitarian sans serif family, and I feel its widespread popularity since its creation near the turn of the century (just as the US was beginning to assert itself as an international power) makes a compelling argument for it as the "most American" typeface.</p>
