      <p>The funny thing is that Americans (except for the Native American Indian) are from other countries. We are like conglomerate rock, bits of lots of other things melted together into an undefinable amalgam. I am second generation Greek American. My wife is a combination of Ukrainian, Romanian, Russian, and German.  My kids are then a fusion of all of this--notice no English speaking ancestors in the mix.  Both my wife and my families emigrated to the USA after 1918 so we are not DAR or Mayflower candidates.  All this said, my children are no more American than my Russian, El Salvadoran, or Pakistani 1st generation neighbors living on my street. We can try to picture an "American" typeface but whose America? A descendant of the Mayflower or my Salvadoran neighbor?<br>
      Perhaps this is like naive Americans who have never been to the Netherlands and picture the Dutch as all wearing wooden shoes.  Perhaps there may be some equally naive Europeans who think we in America all wear cowboy hats and carry guns?<br>
      The World has truly shrunk.  Many of the nationalistic boundaries that we have been so fond to depend on are just naive visions of a bygone era.</p>
      <p>ChrisL</p>
