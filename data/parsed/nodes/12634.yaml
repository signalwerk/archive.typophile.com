      <p>Geez, I really hate to be so politically incorrect here but you do realize where the word America comes from, hopefully? The European occupation doesn't provide aboriginal claims to Americanism. What the hell does prior soil got to do with it? Who was here before the northern transmigration? There is some evidence that other humans "existed" here prior to the occupation by what you refer to as "those Americans," and who were exterminated as a consequence. And, I should point out, in the typographical vein, the original point of this post would seem to be what is American as thought of in the here and now.</p>
