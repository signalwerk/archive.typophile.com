      <p>The Cherokee types (there are a few) are based on the <a href="http://www.cherokee.org/Extras/Downloads/Font/Keyboard.htm" rel="nofollow">85-character syllabary</a> and I have only, unfortunately, seen them typeset in specimens and not actual "real world" usage (although I know the historians among you will argue that specimens are just as much an authentic - or even more authentic - use as any other). It's similar to the LDS Deseret type in that it's based on a roman alphabet.</p>
