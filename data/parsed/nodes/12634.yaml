      <p>I think part of the difficulty is that it's hard to put a blanket stereotype on america because of its all the different ideas and influences it has absorbed. i've read a thread or two about typically dutch typography and type design. Is there less diversity of style in dutch design which therefore makes it easier to label? this isn't meant as a disparaging remark in any way, just observational</p>
      <p>for example it’s easy to say Helvetica and Univers embody swiss typography because they were designed by swiss designers and predominantly used in modernist design which became widely known as the swiss school. I'm sure there were some other styles in switzerland, but let's be honest, that was the predominant style and the one for which switzerland is best known.</p>
      <p>paul rand was a huge proponent of many of those same ideals and he is the father of graphic design in america. but I don't think that connection makes those swiss typefaces “american” in any way.</p>
      <p>so maybe there are american ideals that are embodied in certain typefaces?</p>
      <p>I agree with chris about century schoolbook. I always picture kids in a one room schoolhouse on the frontier somewhere.</p>
    html_clean: |-
