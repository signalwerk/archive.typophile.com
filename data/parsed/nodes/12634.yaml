      <p>Being an American studying type design in Europe, it's become a surprisingly often occurance for someone to tell me that I'm designing very "American" type. When I ask the person to elaborate it always seems to come down to "adding something a old into something new." Another explanation went along the lines of "in America you don't have anything old so you feel like you have to make something look older." I think that's true with a lot of things, especially architecture, but what do you think about it in regard to type?</p>
      <p>I also agree with ericgio about the Goudy reference, I think Goudyness is what a lot of people would consider to be Americanness in type.</p>
