      <p>The problem with the "most often used" angle is that these fonts were mostly not American designs.  Times Roman is perhaps the most often used text face.  For some reason, Century strikes me as having an American look.  Helvetica has more of a Swiss connotation to me.  Too often, the most popular fonts are those that come bundled free with either Windows, Office, Mac OS, or Adobe applications.<br>
      I guess in this Digital type Internet era, nationalistic fonts are melting into multinational fonts.  It is so easy to get fonts from anywhere in the world that being pinned to one country's fonts is unrealistic. I have many hundreds of fonts and have never chosen which to purchase because of its nation of origin.  I just by the fonts that work best for me.  The only reason I might not buy a font from a country is if I never have a need to set that language (meaning I don't understand it).  I am very tempted to by one of the Korean fonts because I am intrigued by the letterforms.  I would have no practical use for it other than just appreciating the form.</p>
      <p>ChrisL</p>
