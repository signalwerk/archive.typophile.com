    <p>¡Howdy!</p>
    <p>I was wondering if there are any fonts that scream "American" when you look at em. Fonts designed by Americans, used more by Americans - etc. </p>
    <p>A few thoughts I had: </p>
    <p>Obviously all the old west looking fonts like <a href="http://www.myfonts.com/fonts/linotype/wanted/" rel="nofollow"> Wanted </a> look American.</p>
    <p>Some others that have been kicking around for many decades like  <a href="http://www.myfonts.com/fonts/linotype/copperplate-gothic/" rel="nofollow">Copperplate </a> and <a href="http://www.myfonts.com/fonts/linotype/cooper-black/" rel="nofollow"> Cooper Black </a> came to mind.</p>
    <p>And maybe P22's <a href="http://www.myfonts.com/fonts/p22/hopper-edward/" rel="nofollow">Hopper, Edward </a>, since it's based on the handwriting of a big time American artist. </p>
    <p>I curious to know what you all think, </p>
    <p>Cheers!</p>
