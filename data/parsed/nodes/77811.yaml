    <p>Hello Typophiles,</p>
    <p>I'm a web designer/developer looking for some advice. I'm in the process of a personal website redesign that should look like it dates from the 16-18th centuries. While I have the graphics figured out, I'm a bit stumped regarding typefaces to use.</p>
    <p>I'm absolutely in love with the <a href="http://iginomarini.com/fell/the-revival-fonts/" rel="nofollow">Fell types</a> by Igino Marini, particularly <em>Great Primer and DW Pica</em>. They are a revival of 17th century typefaces, so they would fit my design nicely.</p>
    <p><img src="http://iginomarini.com/fell/wp-content/uploads/fell_dw.jpg" width="540" title="IM Fell DW Pica"></p>
    <p><img src="http://iginomarini.com/fell/wp-content/uploads/fell_gp.jpg" width="540" title="IM Fell Great Primer"></p>
    <p>Problem is, <em>I'm not too sure about on-screen readability</em>. They have been hinted and kerned extensively, it seems; but part of their appeal (irregular letterforms) is also the reason they may not be completely legible on screen.</p>
    <p>I have tried them in Firefox on Windows XP, and they seem okay. But I'm no typophile by any means! They would definitely make for lovely display faces, but what about body text? <em>Do they make you want to read the content, or are they hard to read?</em> I've encountered them in use at <a href="http://blog.hypsometry.com/" rel="nofollow">http://blog.hypsometry.com/</a>.</p>
    <p>If so, could anybody suggest alternatives for 16-18th century body typefaces? Preferably freely licensed for @font-face use. I'm currently looking at <a href="http://friedrichalthausen.de/?page_id=411" rel="nofollow">Vollkorn</a> and <a href="http://www.fontsquirrel.com/fonts/Cardo" rel="nofollow">Cardo</a>.</p>
    <p>Any help would be greatly appreciated!</p>
