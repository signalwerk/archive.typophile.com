      <p>Viewing with Firefox 3.6.12 on Mac OSX 10.5.8. </p>
      <p>Not sure what to say. I think the OP might have summed it up right at the start: <cite>“.&nbsp;.&nbsp;. but part of their appeal (irregular letterforms) is also the reason they may not be completely legible on screen.”</cite></p>
      <p>I’m an ink-on-paper kinda guy and I love classic settings. But I’m responding here, not as a designer or typographer, just as a casual observer. I mean, it <em>looks</em> all quaint and interesting at all. But my gut response to the site is: I’m just not inclined to try to read it. Too much work.</p>
      <p>But it seems like you’re targeting an audience that is prequalified and highly disposed to want to get at your content and thus more willing to do the work. Which is perfectly legitimate.</p>
      <p>—————</p>
      <p>I also glanced at it just now with Safari 4.0.4. </p>
      <p>Renders larger by default, for some reason, which is a little less off-putting. But then, for example, in the IX section, it’s randomly clipping entire lines as I scroll. Just FYI:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Hypsometry-SafariClipping_4673.png"></div><p></p>
