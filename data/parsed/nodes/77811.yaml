      <p>Hi all. The Hypsometry blog's mine, and I'm happy to hear a little feedback about how the Fell types look on it. Like Mesonprojekt, I think Marini's revivals are simply beautiful.</p>
      <p>Kentlew, I'm curious what browser and OS you're viewing my site on? The type as I see it, at the sizes I'm using it at, looks pretty good, and I've done a fair amount of browser testing. But as Mugford points out, there is a lot of variance amongst possible browser / OS combinations.</p>
      <p>The browsers use different justification techniques too - for instance, I think the justification looks reasonably good (not amazing, but definitely decent) in Safari, but Chrome (which, of course, uses Webkit, and thus should be identical) spaces the lines much worse.</p>
      <p>Ah, designing for the web. Always fun.</p>
      <p>Thanks for any specific comments or observations you might have.</p>
