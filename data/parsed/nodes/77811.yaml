      <p>Hi cboone,</p>
      <p>Your blog looks passable on my work computer, but has some issues with thins and thicks in the body text.</p>
      <p>Windows XP, default grayscale antialiasing, Firefox 3.6.13:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/hypsographyblog_winXP_FF3_6289.png"></div><br>
      -------------------------------------------------------<p></p>
      <p>Windows XP, default grayscale antialiasing, Internet Explorer 6 (the standard at the state agency where I work!):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/hypsographyblog_winXP_IE6_3442.png"></div><br>
      -------------------------------------------------------<p></p>
      <p>However, your blog is actually more legible than the I Love Typography website, so you have that going for you...</p>
      <p>Windows XP, default grayscale antialiasing, Firefox 3.6.13:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ilt_winXP_FF3_6443.png"></div><br>
      -------------------------------------------------------<p></p>
      <p>(IE6 is actually slightly better on that website). Nothing against ilovetypography.com, it's a great website.</p>
      <p>When browsing on Windows or any computer with a lo-res monitor, I personally still prefer websites that use Georgia and Verdana at small text sizes, simply because they just don't use antialiasing AT ALL (due to their built-in hinting) at small sizes. On my Macbook Air at home, it seems to be less of a problem because the pixel resolution is higher and OS X uses a different text engine - but most people don't use macs.</p>
      <p>I will probably continue to wince at sites that use webfonts until hinting/screen/rasterization technologies improve.</p>
