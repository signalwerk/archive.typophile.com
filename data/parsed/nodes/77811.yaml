      <p>Why not use Fell for headlines and one of the core fonts for text? That way you address both functionality (core fonts for readable text) and design (webfont in headlines to signal a certain mood, hinting at a certain time period, place, etc).</p>
      <p>IMO the possibility of using webfonts resulted in a somewhat irrational hype around them, an urge to use them even when they do not improve anything, neither in terms of functionality nor in terms of design. As to the former: Very few fonts get rasterized well enough on certain platforms that they really help the readers of a website – especially when compared with the core fonts. As to the latter: Given the low resolution of screens and thus small ppem sizes at which fonts get rasterized, there is not much of a chance for fonts to differ much from another at text sizes. So even from a design point of view, it does not necessarily make sense to use webfonts for everything.*</p>
      <p>You might make your decisions with two questions in mind: Does using a special (web)font make a noticeable difference? Can I achieve the intended visual effect by different means too?</p>
      <p>* One example. This morning I noticed that a design firm started using some sanserif webfont for headlines, at a rather small size. I thought: what's the point of it? what differences does it make? In this case a bold Helvetica or Arial would have done the job too ...</p>
