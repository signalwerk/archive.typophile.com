      <p>Don't know the first one.<br>
      Second one looks like Times New Roman's "e". The swirl should have been manually attached.<br>
      The slab serif should be ITC Lubalin Graph:<br>
      <a href="http://www.myfonts.com/fonts/itc/lubalin-graph/medium-bold/" title="http://www.myfonts.com/fonts/itc/lubalin-graph/medium-bold/">http://www.myfonts.com/fonts/itc/lubalin-graph/medium-bold/</a></p>
      <p>Cheers,<br>
      Martijn</p>
