  html: |-
    <p>Virtually on Christmas Eve, 2008, yet another commercial engraving house bites the dust.</p>
    <p>Sad for nostalgic reasons but (in reality) much better dead than in the red.  Although I have personally worked with these folks for more than thirty years (yes, 30) and with them made exquisite specimens of engraved types, what they did—how they conducted business—is a crime and shame.  No wonder manufacturing in this country is in such deep and ugly trouble.</p>
    <p>Business can be a sorry business, read it here:</p>
    <p><a href="http://www.newhavenindependent.org/archives/2008/12/new_havens_lehm.php" title="http://www.newhavenindependent.org/archives/2008/12/new_havens_lehm.php">http://www.newhavenindependent.org/archives/2008/12/new_havens_lehm.php</a></p>
    <p>and here.</p>
    <p><a href="http://newhavenindependent.org/archives/2009/01/displaced_worke.php" title="http://newhavenindependent.org/archives/2009/01/displaced_worke.php">http://newhavenindependent.org/archives/2009/01/displaced_worke.php</a></p>
