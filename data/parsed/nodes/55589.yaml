    <p>Hello,</p>
    <p>I have a (newbie) doubt about the typical 'abstract characters' you find as being part of some typefaces : what's the name of that kind of characters ?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sign_5952.png"></div><p></p>
    <p>There's also a most common variant, in horizontal sense, sometimes with a double line composing the figure.</p>
    <p>This one is from the Hoefler &amp; Frere-Jones's site.</p>
    <p>Thanks very much for any input.</p>
