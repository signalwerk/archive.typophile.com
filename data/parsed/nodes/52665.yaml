    date_raw: 14 Dec 2008 — 6:26pm
    votes: null
    html: |-
      <p>You can not embed Flash into an HTML email and have it work reliably everywhere - different email clients have different degrees of support even of HTML/CSS standards and few if any would support the Object/Embed tag needed for Flash. </p>
      <p>You can attach the Flash file like a normal document attachment to the email though.</p>
      <p>Another alternative would be to use Acrobat 9's new "embed Flash" feature but that still requires the PDF file to be attached like a normal document/attachment to the email.</p>
      <p>Finally be aware that different folks have different virus and spam filters that may interpret such emails and attachments as spam/viruses and your email may never reach the intended recipient.</p>
    html_clean: |-
      <p>You can not embed Flash into an HTML email and have it work reliably everywhere - different email clients have different degrees of support even of HTML/CSS standards and few if any would support the Object/Embed tag needed for Flash. </p>
