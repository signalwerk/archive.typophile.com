    html: |-
      <p>I know you can send HTML emails, but they aren't universally supported, and I've never run across an embedded SWF before.</p>
      <p>If you included the SWF it would likely show up as an attachment, which you can certainly do just fine.  Provided they have flash player they can launch your file without even being online (after they download it of course)</p>
      <p>What I personally would do, if it's imperative you display the SWF in the context of a document and not just a standalone file, is to create an HTML page in some dark corner of the internet and then yes, link them to that page (within which you have embedded the SWF)</p>
      <p>Hope this helps!</p>
