    html: |-
      <p>Don't sent attachments in your marketing emails.</p>
      <p>Don't assume the multitude of email clients will be able to, or even care that you have flash embedded.</p>
      <p>Do put a link near the top of your marketing email along the lines of 'want the pretty bells and whistles version? click here...' which will take you to a web page formatted as you wish.</p>
