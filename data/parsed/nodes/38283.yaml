      <p>A few months back I searched for the best set of type I could find for approximately $1000. I looked at a number of collections — the ones on <a href="http://www.veer.com/products/gallery.aspx?gallery=283">Veer</a> (with ShinnType and Fountain being my two favorites), Adobe’s (terrific, although many of the fonts within are widely used/overrused), Linotype’s, FontShop’s, <a href="http://www.psyops.com/html/home.html">PsyOps</a> (another favorite — they do have a library, just not a well-advertised one, so contact them to find out pricing). </p>
      <p>I wanted a collection that was very high quality, diverse, and had many typefaces that could be used for body text. The best option I found (which I am now the proud owner of) was StormType’s <a href="http://stormtype.com/typefaces-fonts-shop/libraries-10-storm-type-library-2-0-pro-single-licence">Type Library 2.0 Pro</a>, which is <em>every</em> typeface he makes and all in OpenType format. While it was quite expensive, the incredible quality of each of his types (Serapion, Sebastian, Jannon, John Baskerville, Splendid, Farao ... I could go on) made it totally worth it. As he says on the site, each font comes out to just two euros. While other collections were cheaper, this was an extraordinary number of fonts, nearly all of which I would have bought separately, so it was a no-brainer. The only small gap in the collection is the lack of currently popular sans-serifs: although he has several, all of his are quirky in his trademark fantastic way, which might be a slight problem when looking for something that blends into the background (an identity, for example). </p>
      <p>Storm’s other collections are cheaper (and not quite as good value, IMO), but I couldn’t see myself not getting his whole library. There is also a cheaper TTF_Single version of the entire library available, which may be fine since only some of his typefaces actually make use of OpenType’s features.</p>
      <p>I don’t know about licensing for more than one computer, since I got the single license, but it should be easy to find out by e-mailing. In an e-mail exchange with me, he indicated that a new version of the Type Library, 3.0, with all the typefaces he’s made recently (Anselm, etc.) should be out soon, so you may want to wait to get it. However, the current library is amazing as it stands.</p>
