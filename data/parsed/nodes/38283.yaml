      <p>Chris is on to something and I’m surprised it wasn’t mentioned earlier.</p>
      <p>Don’t just get a bunch of “classic” fonts that look the same, and don’t get a bunch of fonts d’jour either. Find a collection that represents all the common styles (Serif, Sans Serif, Script, etc...) and ones that represent the different sub styles of those families (Geometic, Grotesque, Humanistic, etc...) Teach the differences, so that when they need to choice a style, they’ll know what to look for regardless of how large or small that selection is. You don’t need a million fonts, you just need enough to teach these designers how to design with. </p>
      <p>Also make time to teach these new designers how to research and buy fonts. A lesson I had to learn on my own. Maybe set aside part of that budget and each year have the students as a class buy a family of fonts for the college. They’ll learn how to research and buy, and you’ll get a new font every semester  .</p>
      <p>“Give a student a font and he’ll design for a day, Teach a student how to buy and use fonts and he’ll design for a lifetime.” (I took some liberties, but you get what I’m saying.)</p>
