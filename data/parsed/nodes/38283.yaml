    <p>I have been given the opportunity to choose a new type collection for our two-year Graphic Design Program. Currently we only have about 40 typefaces to choose from (thanks to our IT department — none of which have a complete family), which we all know that isn’t NEARLY enough for a design program. Right now students have been encouraged to either buy their own, or download free fonts.</p>
    <p>Should I go with the Adobe Collection? Monotype? Linotype? I need some feedback.</p>
    <p>Students and Professionals— are/were you happy with your type collection from your program? What would you change if you could?</p>
    <p>Keep in mind that there is a budget. The new type library must be available in four Mac labs, plus instructor’s machines. Therefore, I need a versatile and affordable collection. </p>
    <p>Thanks! Any ammo I can get would be appreciated,</p>
    <p>~Michael</p>
