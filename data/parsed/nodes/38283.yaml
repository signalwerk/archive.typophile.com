    html: |-
      <p>Michael, speaking as a former student (6 years past), I recommend depth over breadth and a willingness to teach the fonts. Where I went to school, we had a pretty decent, but largely default type collection. Often, we’d be told “use Univers” or “use Sabon” but only occasionally would we get any explanation/history/context. I encourage you to choose types that are 1) practically useful, and 2) pedagogically useful. Type is so often the voice of a movement but a subtle one, and giving people Garamond, Minion, Sabon, Centaur, Jenson, Janson, Times, etc. is all well and good, but the full knowledge of a few typefaces is infinitely more valuable than access to many unknown choices...at least in my opinion. Those students who wish to exlore more contemporary and rarified choices will use that foundation you give them to make their decisions. Perhaps I presume too much in my recommendations, after all, you are clearly mindful as a teacher. However, I know that I ended up flailing around a bit more than was helpful in a field of misunderstood choices.</p>
      <p>As for whose collection? Not sure. Adobe offers huge collections, but there’s a fair amount of fluff in some of them (novelty fonts not as useful in an academic setting). I’d sift through the list for things that seem worthwhile. On the other hand, while collections like Storm’s are compact and superb, they may not give the ’fundamentals’ as well. Frankly, I’d mix and match for your ideal set, rather than bulk-buy for maximal font-to-finance ratios. And I’d avoid of-the-moment fonts or that’s all you’ll see in every project. Let the students get those on their own, if need be.</p>
      <p>If a one-stop library is what you want, then I agree with Jackie’s recommendation of one traditional, and one young &amp; fresh.</p>
      <p>Hope this ramble helps. Just one designer’s perspective.</p>
