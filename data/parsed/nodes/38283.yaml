      <p>I just thought of another suggestion. Have your students create a budget request for a new font. Walk them through the process so they know how to do it when they get their own design jobs. Another harsh lesson I had to learn after school. I still have friends who are afraid to ask for budget money to buy fonts or even software because they don’t know how to ask. These are things that designers need to learn, whether they work for a design firm, freelance or in-house.</p>
      <p>It’s sad, I have a 4 years bachelor of fine arts in design and I’m still learning “basic” skills that a designer should know. Makes me wonder what I spent $20 grand on?</p>
