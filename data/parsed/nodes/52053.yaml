      <p>I'm pretty sure I've never seen that.</p>
      <p>But here's a way to extract such data: take a list of word frequencies, and use a thesaurus (I mean a digital one) to eliminate all the entries that are not proper nouns. The first letters of the words you're left with coupled with the frequencies of the respective words should constitute a decent estimate.</p>
      <p>hhp</p>
