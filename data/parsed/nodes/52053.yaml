    html: |-
      <p>There's more than one way to skin this cat. A lot of it I think<br>
      depends on what the client <em>wants</em> to see in terms of analysis.</p>
      <p>For one thing, this is all deterministic; there can be no strict quantification in any case. Letter frequencies are always estimates, in some ways better but in other ways worse than simply setting a longish typical text supplied by the client to get an actual reading of comparative economy.</p>
      <p>What you might do instead is simply figure out what proportion of text is caps (I've heard it's ~5%*), calculate the average set width of each font's caps, and use those three numbers to arrive at the economic difference. A refinement of this would be to weight the averaging based on general (non-cap) letter frequencies; a further refinement would be to use frequencies of initial letters of words only (whereby for example "Y" would have a very low weight).</p>
      <p>* 15% for German?</p>
      <p>Another twist is that letter frequencies are not enough when it comes to figuring out the effect of letter widths on economy. The proportion of paragraph breaks is just as important if not more so. A font that saves a certain degree of horizontal space can have all its savings trashed by a paragraph break! The greater the proportion of paragraph breaks, the more moot narrowness of glyphs becomes.</p>
      <p>All this makes me think that using a sample text from the client to compare the fonts would make more sense than relying on frequency stats. But frankly in any case I think the savings will be so small (except maybe for German) that the awkwardness of very narrow caps will kill it.</p>
      <p>hhp</p>
