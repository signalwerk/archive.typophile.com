  html: <p>There are some good resources online for finding letter frequency data for English and other major languages, including both corpus and dictionary keyword derived data. But none of the corpus data I've looked at so far maintains a distinction between upper- and lowercase letters. Has anyone seen such data? I want to know what the average frequency of individual uppercase letters is.</p>
