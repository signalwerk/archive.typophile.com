    html: <p>I don't have a corpus, Paul, but could probably find one. For my purposes, a corpus of scholarly works in English would be best. In case you're wondering why I'm after this, I'm trying to quantify the amount of space saved by using one typeface instead of another; since the capitals in the new type are quite a lot narrower than in the old one, they may have a significant impact.</p>
