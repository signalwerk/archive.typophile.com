    html: <p>If you can get your hands on it, Shadow's <a href="http://www.tunes.co.uk/tunes/featured/6855.html"><i>Live in Austin</i></a> is an excellent album. There's more turntablism than in his studio albums, but some of the tracks are indicative of his recent touring, where he's been mixing his own stuff. It's incredible to hear. <br> <br>You'll get <i>Preemptive Strike</i> and <i>Endtroducing</i> with <i>U.N.K.L.E.</i> mixed together. There's also a lot of his earlier stuff, including the first record he ever made. It's pretty damn brilliant. <br> <br>In fact, he's releasing a DVD, <i>In Tune and On Time</i>,(you can see the trailer <a href="http://www.djshadow.com/landing.html">here</a>) that's got a lot of this stuff in it. <br> <br>I swear I don't get paid to shill Shadow's stuff. <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
