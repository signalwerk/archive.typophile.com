    html: <p>i'm no pro, so take my advice with a grain or two of salt... <br> <br>overall i think it's very nice. One feature i really like is that the diagonals in the A, M, V, W, v, w, and y seem to flex or bow just a bit. However the X, Y, Z, x and z seem a bit rigid in contrast, perhaps the k as well. <br> <br>the eye of the e seems a bit small, as do the eyes of the 6 and the 9. the r looks like an amputated n. <br> <br>keep up the good work!</p>
