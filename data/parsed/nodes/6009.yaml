  - id: 42487
    user: 1250
    date: 2004-08-10T10:20:00
    date_raw: 10 Aug 2004 — 10:20am
    votes: null
    html: "<p>This is actually a semi-serif... Good for you - we need those! <br> <br>It reminds me a little bit of Costa (my fav Porchez font, finally released for retail sale - yay!) but it's certainly original nonetheless. I'm actually liking it a lot - but it needs work. The even tone is nice - it's an honest, but sensitive design. And the stroke terminals are great. <br> <br>Lowercase: <br>- The \"a\" is obnoxious, sorry. It has the worst of Gill Sans, and that Jannon imbalance to boot. <br>- I don't think there's a good reason to give the \"f\" a descender. <br>- The \"g\" is nice - maybe give the head more size versus the tail - the glyph looks way too small compared to the rest. <br>- I think the \"k\" needs some of the bowing. <br>- I'm unsure about the \"w\". <br>- The \"x\" needs some of the bowing too, and maybe the \"z\" as well. <br> <br>The caps are really nice. <br>- The \"L\" and \"T\" seem too wide. <br>- Consider bowing in the \"K\", \"X\", \"Y\" and \"Z\". <br>- The \"S\" needs more balance and polish. <br> <br>Others: <br>- Interesting numerals. The \"3\" is too much though. <br>- I like the 3rd ampersand. A lot. <br>- Superb \"at\" sign. <br>- Flatten the UC accents. <br>- The acute and grave seem a hair too strong. <br> <br>Spacing: it needs work, but with some tightening I think the wordspace you have is good here. <br> <br>-- <br> <br>One thing about the pairing with the serif version though - I don't see them as compatible designs at all - certainly not sister types. <br> <br>hhp <br></p>"
    html_clean: "<p>This is actually a semi-serif... Good for you - we need those! <br> <br>It reminds me a little bit of Costa (my fav Porchez font, finally released for retail sale - yay!) but it's certainly original nonetheless. I'm actually liking it a lot - but it needs work. The even tone is nice - it's an honest, but sensitive design. And the stroke terminals are great. <br> <br>Lowercase: <br>- The \"a\" is obnoxious, sorry. It has the worst of Gill Sans, and that Jannon imbalance to boot. <br>- I don't think there's a good reason to give the \"f\" a descender. <br>- The \"g\" is nice - maybe give the head more size versus the tail - the glyph looks way too small compared to the rest. <br>- I think the \"k\" needs some of the bowing. <br>- I'm unsure about the \"w\". <br>- The \"x\" needs some of the bowing too, and maybe the \"z\" as well. <br> <br>The caps are really nice. <br>- The \"L\" and \"T\" seem too wide. <br>- Consider bowing in the \"K\", \"X\", \"Y\" and \"Z\". <br>- The \"S\" needs more balance and polish. <br> <br>Others: <br>- Interesting numerals. The \"3\" is too much though. <br>- I like the 3rd ampersand. A lot. <br>- Superb \"at\" sign. <br>- Flatten the UC accents. <br>- The acute and grave seem a hair too strong. <br> <br>Spacing: it needs work, but with some tightening I think the wordspace you have is good here. <br> <br>-- <br> <br>One thing about the pairing with the serif version though - I don't see them as compatible designs at all - certainly not sister types. <br> <br>hhp <br></p>"
