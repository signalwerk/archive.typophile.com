    html: |-
      <p><cite>For now try PNG.<br>
      </cite></p>
      <p>For print? No!<br>
      PNG is for the web, not for prepress.<br>
      PSD and TIFF are the best choice for prepress documents. </p>
      <p>Make sure to use a consistent color space. Is your PSD converted to CMYK? Is your InDesign workspace CMYK? Do you export the PDF in CMYK?</p>
      <p><cite><br>
      I’ve had trouble with transparency in Adobe software all the time. Well, actually it’s the transparency flattening that causes the strange boxes.<br>
      </cite></p>
      <p>The white lines in Acrobat are just a problem of screen resolution.<br>
      If you see color changes around a transparent image, you have most likely mixed different color spaces. </p>
      <p><cite> Also I think RIPs find it very difficult to handle transparency flattening properly.<br>
      </cite></p>
      <p>That's why you should flatten the PDF in InDesign by choosing PDF 1.3.</p>
      <p><cite><br>
      Somehow I remember reading somewhere that it might also be somewhat buggy handling of transparency of the Adobe Suite?<br>
      </cite></p>
      <p>No, if you know what you are doing it works just great with all the Adobe apps.</p>
      <p>Ralf</p>
