      <p>Well, on screen I don't really have any problems with transparency. I used to have some trouble when printing, but I have used some of the tips from the video I posted above your post, and that helps a lot. I've noticed that checking the Flattener Preview in InDesign and then use proper layering of your document eliminates a lot of the white-box problems.</p>
      <p>Jose could also try to make a clipping path in photoshop around the logo, instead of a transparent background, and then place it in InDesign and let it clip the image with the embedded clipping path.</p>
