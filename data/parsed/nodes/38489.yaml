    <p>Hi.</p>
    <p>Some years back before i knew anything about design software i had created a logo in photoshop. The logo is on a transparent background. I recently found this and wanted to use it in indesign. if i imported in to indesign the transperancy looks fine on scree.. but when i print it.. its a translucent white box.. ive gotten solid white boxes before due to transperancy but never a translucent white box.  </p>
    <p>any ideas and how to resolve this problem?</p>
