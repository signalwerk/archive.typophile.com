      <p>I've had trouble with transparency in Adobe software all the time. Well, actually it's the transparency flattening that causes the strange boxes. Always check the Transparency Flattener Preview in InDesign if you are working with transparency, to see any problems. Also I think RIPs find it very difficult to handle transparency flattening properly. </p>
      <p>Usually when I use transparency in a document, I tell the prepress/printers that I use it and where, and that they need to pay attention when outputting my file because of it.</p>
      <p>Somehow I remember reading somewhere that it might also be somewhat buggy handling of transparency of the Adobe Suite?</p>
