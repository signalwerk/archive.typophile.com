      <p>What Nina said. Dolly's Bold and Italic are not usable for text. You need a font system with a richer palette. That said, if you have a clever layout (see below) I don't think you really need to hit people over the head with huge visual differences between the languages; differences of serif structure for example might even be enough - subtle, yes, but sufficient, while remaining calm and tasteful. See the various styles of FF Seria (which additionally is a very bookish font); the problem with Seria is that it doesn't yet* have a proper Italic.</p>
