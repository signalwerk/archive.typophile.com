      <p>Museo is a good example of no serifs (Museo sans), half-serifs (Museo), and full serifs (Museo slab) in a no-contrast superfamily. As for incorporating all six variants on the serif-contrast axes in a single system, I think it comes down to just who can afford to do all the work. Is there that great a demand for a six-variant superfamily to justify the sheer number of hours spent on creating one?</p>
      <p>Maybe some type designers are already planning such ambitious superfamilies but have only got around to releasing a few variants, with more to come over the years. After all, these things take time.</p>
