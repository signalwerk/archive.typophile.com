      <p>Here in Europe we see plenty of instances of multilingual typography in product packaging and instruction manuals, with the different Latin-based languages getting the exact same typographical treatment 99% of the time. So using the same typefaces for the different languages is really the default solution, only it's natural for us to wonder whether that's the best solution for all possible uses.</p>
      <p>In the corner of the world where I'm originally from, multilingual typography means multi-script typography, as each language would use a different script. In an in-flight magazine with Korean, English, and Japanese text for example, you have no problem telling apart the languages at a glance. So I'm perhaps more receptive to the idea of some sort of visual differentiation between languages that use the same alphabet.</p>
      <p>I know Canadian law is sensitive to differences in type sizes between the two languages, but I can't imagine that the use of different typeface variants would be controversial.</p>
    html_clean: |-
