      <p>I think there are three ways of approaching the 'contrast + no serifs' problem:</p>
      <p>1. Like Sabon Sans. This means cutting off the serifs of a serifed typeface and leave the contrast (almost) like it is. It is very interesting to see this Sabon Sans, I didn't know about it (thanks for the thread), for me this supports my own believe of deriving the sans from the serif, and not the other way around.</p>
      <p>2. Like Pascal and Optima. The contrast of a serifed typeface is kept, but there are no serifs. However there is a hint of a serif by making the stems 'incised'. </p>
      <p>3. Like Eric Gill's approach from 1935 <a href="http://www.typophile.com/node/53266" title="http://www.typophile.com/node/53266">http://www.typophile.com/node/53266</a><br>
      He made sketches for an incised typeface that was probably based on Gill Sans. </p>
      <p>The Sabon Sans has a high contrast.<br>
      The Pascal/Optima faces have an average contrast.<br>
      The Gill face has a low contrast.</p>
      <p>I personally think that the typefaces of Mendoza and Zapf are visually the best. But Tschichold's approach is for me more interesting: he based his sketches for Sabon Sans on his Sabon with serifs. </p>
      <p>If I would make a 'contrast + no serifs' typeface, I would take the serifed version, cut off the serifs and make it slightly 'incised'. Eventually I could lower the contrast a little bit or a lot, depending on the feeling I would like to give it. This would then be the fourth (and maybe fifth) version for setting yet another language.</p>
      <p>By the way, I wrote a long article about Pascal that will be published this month in a book about Mendoza. I made some very interesting discoveries. <a href="http://ypsilonediteur.com/fiche.php?id=86" title="http://ypsilonediteur.com/fiche.php?id=86">http://ypsilonediteur.com/fiche.php?id=86</a></p>
    html_clean: |-
