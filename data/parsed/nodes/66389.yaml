      <p>You might be aware of this, but the brilliant <a href="http://www.typografie.de/Unsere-Buecher/Typografie/Hans-Peter-Willberg_Friedrich-Forssman/Lesetypografie::124.html" rel="nofollow">«Lesetypografie»</a> has a section on multilingual layouts that should be worth looking through.</p>
      <p>Regarding your type choice: I'd advise against setting long (book!) text in either the Bold or the Italic of Dolly – they're really not meant for that I'd say… and the Italic for emphasis in the Bold?  :-\  For such a deliciously complex typographic project, I think you'd really be better served with a family that comes with more than 3 styles! Maybe consider something that has three stylistic «family members», like sans/serif/semi, sans/serif/slab or sans/serif/upright italic. That way you also wouldn't [have to] have one language «speaking louder» than the others. And you could use a gently darker weight in all 3 variants for emphasis.</p>
