    html: "<p>Here's one example of trilingual (technically quadlingual) typography: the <a href=\"http://beinecke.library.yale.edu/dl_crosscollex/SetsSlideShowXC.asp?srchtype=ITEM\" rel=\"nofollow\">Cranach Press' 1930 <em>Hamlet</em></a>, of which Roderick Cave wrote, \"... of all private press works in the Kelmscott tradition, the Cranach <em>Hamlet</em> is the greatest.\" The main text here on each spread is the English copy of Shakespeare's play, while surrounding it on three sides are two literary sources for the plot. The left side is the Latin (and later, French) originals, while the right is always the English translation. This is nearly as complex a setting as it gets, with woodcuts incorporated into each text, but it works elegantly.</p>"
    html_clean: "<p>Here's one example of trilingual (technically quadlingual) typography: the <a href=\"http://beinecke.library.yale.edu/dl_crosscollex/SetsSlideShowXC.asp?srchtype=ITEM\" rel=\"nofollow\">Cranach Press' 1930 <em>Hamlet</em></a>, of which Roderick Cave wrote, \"... of all private press works in the Kelmscott tradition, the Cranach <em>Hamlet</em> is the greatest.\" The main text here on each spread is the English copy of Shakespeare's play, while surrounding it on three sides are two literary sources for the plot. The left side is the Latin (and later, French) originals, while the right is always the English translation. This is nearly as complex a setting as it gets, with woodcuts incorporated into each text, but it works elegantly.</p>"
