      <p>Christopher Adams: The order of the versions in my example (1. serif, 2. sans, 3. slab) has to do with the (logical) order of creation. For me the basis will always be the serif. From that you can derive the sans, and from the sans you can derive the slab serif (wich is basically a sans with serifs that have the same visual line thickness).</p>
      <p>Which version to use for which language is up to the designer, it can be any order. But the advantage of using the three versions is that you have the possibility to use italic, bold and bold italic within each version. </p>
      <p>I have seen three-language books set in roman (first language), italic (second language) and bold (third language), but what to do if there should be a word in italic, or in bold?</p>
      <p>I have also seen books in which all languages have the same typeface for all languages. There the position on the page is the guide line. The advantage is that you can have any amount of languages, but it can be quite confusing reading it.</p>
      <p>One book I have (Label Design by Claude Humbert) is set in Univers 55 (English), Univers 56 italic (French) and again Univers 55 (German). I think this is not correct, also from an editor's point of view. This may proof that we need other solutions.</p>
