    <p>dear type lovers,</p>
    <p>i need your help!<br>
    i've got a new project. it's a trilingual book. german, english, spanish.<br>
    the book is about 160 pages long and mostly text - a few small images.<br>
    it's about an art poject in mexico city.</p>
    <p>i was wondering if you can recomend any good trilingual book typograpy. if aou know any books that would be a good example.<br>
    what i have so far is that i will use dolly in reg, italic and bold - diverent style for different language and the highlightin in the test will be bold in the reg text, italic in the bold and reg in the italic text. the text links will be small caps.<br>
    what i dont know if it is more clever and usefull to have 3 colums on a spread for each language or to have one language after anoter - 3 pages engl than 3 pages german than 3 pages spaish... or maybe have a little more experimental solution.</p>
    <p>thanks for any respond<br>
    annette</p>
