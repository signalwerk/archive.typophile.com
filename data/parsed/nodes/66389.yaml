      <p>Depending on how clearly structured your layout is, you might even get away with using the same font for all languages, if you want that, although that might be a bit too bland/equalized. It all depends on each other; and I think the layout question is near impossible to answer without seeing it in context of the whole book: How many images are there, or is it pretty much all text? Will the layout be the same for every spread with text, or can/will you vary it? Is it more important, for this book, to have a cool layout that people enjoy and/or that makes an (aesthetic) statement in itself; or does it primarily have to quietly ensure that every reader immediately finds the language they want to read, and let the content do the «drama»? Ask yourself these sorts of questions. Since this is an art book it could really go either way, between a very subdued grid/column layout or a more exciting layout such as your «experimental» ones. You have to decide how loud your layout should talk, so to speak.<br>
      BTW, do consider that different languages will produce text of differing length, so your layout will presumably not «fill up» equally.</p>
      <p>As for fonts, Scala is a classic*, Seria should be very nice too… hmm, how about Nexus? And of course, Rotis is always there.<br>
      * When's the slab coming out? :-)</p>
