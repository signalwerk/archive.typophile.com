      <p>Now that I know what kind of book it is, it is more clear what to recommend.</p>
      <p>Usually, in books of this type, the same typeface is used for all the languages involved, in the same size and weight. So one turns the pages, and they're dominated by photographs, but each photograph has three captions, separated by some blank vertical space.</p>
      <p>Or there is running text; then one language is above the photograph on the page on the left, the other is below it on the same page, and the page on the right has text in the third language. I'm sure that it should be easy to find many examples of this sort of thing; many art books are done this way, and even more books of travel photographs.</p>
      <p>It would be different if what you were preparing was a book almost entirely of text, in one language with extensive quotations from other languages. Then a different face, with somewhat indented margins for the quotations, would make sense. But for this kind of work, the normal convention is to treat the multiple languages as equally as possible.</p>
