      <p>My only question is 'why a trilingual book at all'? It seems to me to be a major waste of paper, shipping costs, and resources to put the multiple languages into one book. About the only time I can see this being sensible is when there are more than 50% photos or illustrations in the book, in which case captions and text in three languages makes sense.</p>
