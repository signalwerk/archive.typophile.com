      <p>And another interesting thing is that the other «semi» component of Rotis<br>
      is not, as is popular today, a monoline slab, but a semiserif with contrast.<br>
      I'm with Hrant in wondering why there aren't more of those made; I wonder,<br>
      shouldn't it be possible to make a system that incorporates all six variants?<br>
      I mean no serifs, half-serifs, and full serifs, each with and without contrast.<br>
      (Basically, if you overlap the family concepts of Rotis and Thesis, this is the<br>
      «cloud» you get, with Rotis keeping mostly to the contrasty side, and Thesis<br>
      to the monoline side.)</p>
