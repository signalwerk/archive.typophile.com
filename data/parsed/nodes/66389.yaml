      <p>I'm strongly with Nina on this, Dolly's bold is <em>very</em> dark and not suitable for text setting at all. The italic would work for shorter passages, but it is quite tiring for longer stretches. </p>
      <p>I would look for a typeface where the italics and romans have an even colour, and use a matching sans for the third language. A much used solution is FF Scala and FF Scala Sans by Martin Majoor. </p>
      <p>I'm also highly skeptical to your emphasis scheme. Trust me, this will not work.</p>
