      <p>Thanks for all your respond. I was so busy that I didn't even get to read it all. Here you can see a sreenshot of my solution that I will be presenting the client this weekend. I choose to work with an experimental layout and contrast in the text. german and spanish are allways together on one spread, english is on a different colour paper at back of the book.<br>
      german is set in auto 2 light, spanish in dolly reg. I also use small caps in the text and italic for side information. the english part is a mix of dolly and auto. dolly for headline and side information and auto for text.<br>
      the layout works nicely with pictures too and when the if the text doesn't fill up the page there is an interesting play of white space.</p>
      <p>best annette</p>
