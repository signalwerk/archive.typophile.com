      <p>And, since he searched using English words, he was finding out information which, in fact, was well documented: the long s basically died out in English thanks to the work of one specific printer, John Bell.</p>
      <p>However, as <a class="freelinking external" href="http://typefoundry.blogspot.com/2008/01/long-s.html" rel="nofollow">this article</a> notes, John Bell had been inspired by Didot... so, except for Germany (and some other countries that also used Fraktur for some time) the demise of the long s apparently was an international phenomenon.</p>
