      <p>A pity that the idea behind the original search string is flawed. It only measures how often an ſ was <em>incorrectly</em> recognized as an f.</p>
      <p><a href="http://books.google.com/books?id=O21p1jSGgdMC&amp;pg=PA531&amp;dq=%22because%22&amp;hl=de&amp;ei=we4mTarBMcqfOoHKuYYD&amp;sa=X&amp;oi=book_result&amp;ct=result&amp;resnum=1&amp;ved=0CCcQ6AEwAA#v=onepage&amp;q=%22because%22&amp;f=false" rel="nofollow">This result</a> for example is returned after a search for »because«, and in this case the ſ has been »correctly« indexed/transliterated as an s.</p>
      <p>So 1800 may just as well be the date after which Google turned off the recognition of ſ in favour of more correct recognitions of the f.</p>
      <p>(Insert famous quote about statistics here)</p>
