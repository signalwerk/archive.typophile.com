    html: <p>I heard an interview with one of the Google folks who worked on the nGrams project, on (USA) National Public Radio, and he couldn't stress enough that English-language results before 1800 were unreliable, due to low sample size (not a lot of books) and data pollution from mis-dated books (later books that were mis-dated, often because they were ABOUT the earlier time period and someone screwed up). I'm not saying that this affects the cool long-s graph. When playing around with nGrams, you'll often see wacky values in the earlier centuries.</p>
