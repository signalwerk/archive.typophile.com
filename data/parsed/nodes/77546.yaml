      <p>I should perhaps have elaborated a bit in my posting... some of what I read about the disappearance of the long s in other parts of Europe noted that Didot's typeface, and other modern typefaces, were designed without a long s.</p>
      <p>Thus, when printers used a modern typeface, they were constrained to eschew the long s.</p>
      <p>Present-day readers, of course, find the long s very annoying because it's confusingly similar to the letter f. But, naturally enough, we hesitate to conclude that people in the 18th Century felt the same way; instead, if we prefer what we're used to, no doubt they preferred what they were used to.</p>
      <p>However, the fact that short s looks more like capital S and is more distinct from f (and can't be confused with any other lowercase letter instead) <em>is</em> an objective fact. Thus, I think it is not unreasonable or provincial to suspect that, even in the 18th Century when the long s was the rule, that a significant number of schoolchildren learning to read and write hated the long s and wished it would go away.</p>
      <p>And that many of them might even have carried that attitude into adulthood. (My mental picture has this being more likely to be the case in the lower socio-economic classes.)</p>
      <p>And so, suddenly, one has an explanation of <em>why</em> Scotch Roman conquered the typographic world (except for conservative Germany), sweeping beautiful Caslon and even beautiful Baskerville into the dust-bin. (Of course, it helped that the <em>early</em> Scotch Roman faces weren't too bad looking themselves.)</p>
      <p>It wasn't that modern roman faces were so much better looking as typefaces that they made Baskerville and Garamond look ridiculous and dated. (Caslon, well...)</p>
      <p>No. It was that whenever printers printed something in Caslon or even Garamond or Baskerville, they insisted (those were conservative and traditional times, after all) on putting that dang long s in all the time! So it was not a preference for modern letter forms so much as a <strong>distaste for the long s</strong>, I suspect, that drove the rapid adoption of Scotch Roman.</p>
      <p>And then, fifty to a hundred years later, when the Scotch Romans became anemic and condensed and hideous in form, Alexander Phemister designed his typeface, and Caslon got revived, and gradually the world emerged from the typographic wilderness and we got the Monotype revivals and Times Roman, and are now living happily ever after.</p>
      <p>Finally, a rational explanation for how the world got from the beautiful Romans of Jenson and Aldus to the horrid typography of the later 19th Century. Each step was rational at the time it was taken, and the main impetus was not any "mischievous" effect of Baskerville somehow inspiring Didot, it was Didot performing the invaluable service of getting rid of the long s along with the mischief he, rather than Baskerville, happened to be doing to his letter forms.</p>
