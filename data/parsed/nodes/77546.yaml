      <p>Modernization was a multi-dimensional affair, encompassing character shape (long s became obsolete, lining figures replaced oldstyle), type style, page layout, and document purpose  -- all of which are involved in the synergy of typography.</p>
      <p>At the time (1819), Richard Austin attributed the modern letter to changes in technology (harder steel, smoother paper, blacker ink):<br>
      “…it was judged expedient to re-model the alphabet to render … [letters] more agreeable to the improved state of printing…”</p>
