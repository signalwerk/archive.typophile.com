      <p>So you don't think I've made a sensational discovery that will revolutionize how we understand the history of typography?</p>
      <p>But you are quite right that improvements in printing technique stimulated innovation in type design. After all, this is very well known in the case of Baskerville: he designed his typeface to look its best under the conditions of the very high quality presswork he performed.</p>
      <p>And now that raises another question. Garamond and Bembo are in use today, and no one complains that they are unsuitable to offset printing or photocomposition. What was stopping the typefoundries of the day from making any subtle alterations to existing oldstyle types, therefore, that may have been needed to make them fit in to the new world of smoother paper, and "kiss" instead of "sock" impressions?</p>
      <p>One thing about the modern letterforms was that with their severe straight lines, their shapes were simpler than those of the oldstyle letter. And this mattered because...</p>
      <p>Linn Boyd Benton hadn't invented the <strong>pantograph</strong> yet!</p>
      <p>Smoother paper fed a demand for mechanical perfection in letterforms - and mechanical perfection was easier to achieve with the modern style of letter because the punches were simpler to cut.</p>
      <p>Yes, there were many complicated feedbacks going on. But I still suspect that the long s played a significant role in helping things along - and, because that was seemingly unrelated, it is something that historians would tend to miss... unless the relevant information is brought together, the way it was in the discussion in this thread.</p>
