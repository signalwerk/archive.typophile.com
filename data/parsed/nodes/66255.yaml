    <p>Sumner Stone is publishing some very interesting articles on type &amp; letterforms history and practice in his "Alphanet Journal" online. I have found the latter two of particular interest:</p>
    <p><a href="http://www.stonetypefoundry.com/warpwoof1.html" title="http://www.stonetypefoundry.com/warpwoof1.html">http://www.stonetypefoundry.com/warpwoof1.html</a></p>
    <p><a href="http://www.stonetypefoundry.com/letterslost1.html" title="http://www.stonetypefoundry.com/letterslost1.html">http://www.stonetypefoundry.com/letterslost1.html</a></p>
    <p>One of the most interesting facet in both writings is Stone's growing concern towards pre-Roman letter shapes, an unlikely approach in today's typography, I guess.</p>
