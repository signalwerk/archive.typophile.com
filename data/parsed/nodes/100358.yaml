    html: |-
      <p>English speakers like me will read <em>INFO</em>, a common abbreviation for <em>information</em>. Italian speakers may read this differently. Nuclear physicists might see the little circle as a subatomic particle instead of the letter <strong>O</strong>. </p>
      <p>What strikes me most about this logo is how playful it is. Maybe they're trying to say, "Hey, we're not just a bunch of science geeks. We like to have fun too!" But if I'm going to trust people to handle radioactive materials, I'd like to think they take their jobs very, very seriously.</p>
