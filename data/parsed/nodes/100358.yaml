    <p>This logo is not mine I just received it in an email from the PR office of the institute. I would like to know what real designers think about it, and what do you generally understand from that logo.<br>
    When I saw it the first time it looked to me a logo for a campaign against the INFN, with that "NO INFN" written on it.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/noname_3539.jpg"></div><p></p>
