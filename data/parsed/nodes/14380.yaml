    <p>I realize that this is a type ID forum, but I also know that there are many fonts that are actually made up of symbols (ornaments)</p>
    <p>Has anyone seen this ornament in a font. I looked at Caslon ornaments and a few others that I own, but cannot find this.</p>
    <p>I’m hoping someone recognizes it - or I guess I will need to redraw.</p>
