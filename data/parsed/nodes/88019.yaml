  html: |-
    <p>Dear all.</p>
    <p>I was wondering why some fonts work well on the paper and on the screen and some only on the paper?</p>
    <p>Are they re-designed for the screen?</p>
    <p>Concretely I compared <a class="freelinking external" href="http://new.myfonts.com/fonts/fontfont/ff-blur" rel="nofollow">Blur</a> font printed and on screen.</p>
    <p>The one on paper looked very good while on the screen looked good only at higher sizes.</p>
