    <p>Although I've seen them hundreds of times, a few weeks ago I saw a North Carolina license plate that made me think of something:  it appears that the typeface used on the words "North Carolina" on the plate is the same as the one used in the credits from "The Streets of San Francisco."  Whether they are the same or different, what is the typeface called?</p>
    <p>North Carolina plate:<br>
    <a href="http://www.ricksplates.com/images/archive/nc1984pass.jpg" title="http://www.ricksplates.com/images/archive/nc1984pass.jpg">http://www.ricksplates.com/images/archive/nc1984pass.jpg</a></p>
    <p>The Streets of San Francisco title card:<br>
    <a href="http://upload.wikimedia.org/wikipedia/en/a/ab/The_Streets_of_San_Francisco.jpg" title="http://upload.wikimedia.org/wikipedia/en/a/ab/The_Streets_of_San_Francisco.jpg">http://upload.wikimedia.org/wikipedia/en/a/ab/The_Streets_of_San_Francis...</a></p>
    <p>Thank you!</p>
