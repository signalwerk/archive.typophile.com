      <p>Not sure how that Paratype version differs, but you can get (perhaps) closer to the original Advertiser's Gothic, with the <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/advertisers-gothic-light/" rel="nofollow">Monotype version</a>, or the <a class="freelinking external" href="http://new.myfonts.com/fonts/hihretrofonts/advertisers-gothic/" rel="nofollow">one from HiH</a>, which is the heavier weight.</p>
      <p>- Mike Yanega</p>
