    <p>After noticing a similar font appear in several photos from the 20s-30s Bulgaria, I tried to find its equivalent. It's a font I have not seen used in Cyrillic outside old photos.</p>
    <p>You can see an example on this photo: <a href="http://www.finetuna.com/zdea7v" title="http://www.finetuna.com/zdea7v">http://www.finetuna.com/zdea7v</a></p>
    <p>Now, I am almost sure that whatever they used back then has not survived past the 40s (due to change of fashion or/and regime) but this typeface has been popular enough before that and I wonder if there is no current digital Latin equivalent? Anyone here have an idea?</p>
    <p>Thanks in advance.</p>
