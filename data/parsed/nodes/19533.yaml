    <p>First of all please excuse me if this is a repost of sorts, I’ve searched quite extensivley on the topic, but need some additional help...</p>
    <p>The design studio I work for had a freelancer design some cover art. She ended up using a font found in the user library (OSX) “Goudy Old Face” an <a href="/wiki/FFIL" class="wiki">FFIL</a> font. When we sent the layered art to the press, they called me up and said Goudy Old Face was only a screen font, thus no good.</p>
    <p>I searched through my fonts and could not find a Goudy Old Face <a href="/wiki/LWFN" class="wiki-create">LWFN</a> version? So I ended up having to purchase the post scripts for the font and just sent those off.</p>
    <p>So here is my question... </p>
    <p>If I only see a FFIL suitcase listed in my “User/Library”, how do I know it has a printer (LWFN) font?</p>
    <p>The reason I ask is, all of the FFIL fonts in my “User/Library” do not have any visible LWFNs? Which leads me to believe these FFIL files are worthless without their LWFN counterparts.</p>
    <p>I found this FFIL to DFONT converter, but I’m not sure making DFONT’s out of my FFIL’s is even going to do anything other than changing the wrapper?</p>
    <p>Should I just go into my “User/Library” and remove all of the FFIL fonts to prevent this in the future?</p>
    <p>Thanks for any help!<br>
    - e</p>
