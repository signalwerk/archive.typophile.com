      <p>That’s pretty odd considering that you would not be able to use the font at all if the LWFN file was missing. If all you have is the FFIL (a.k.a. the font suitcase), and you put this into one of your Font directories, OS X will not show the font in your font menus. </p>
      <p>It’s not likely to have a name like “Goudy Old Face”, more likely something like “GoudyOldFac”. PostScript font file names are usually shortened and must contain no spaces.</p>
