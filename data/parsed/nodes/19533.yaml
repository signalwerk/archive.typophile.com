    html: <p>The resource fork issue affects the FFIL file, not LWFNs. A FFIL file (font suitcase) has all its information in the resource fork. Only Macs can deal properly with this kind of file. The LWFN (the PostScript outline data) has all its information in the data fork, meaning it’s just a plain old binary file, like the kind used on other OS’s. If you are not careful when moving Mac font suitcases (FFILs) to and from foreign file systems (the internet, for example), the resource fork may be lost resulting in an empty (0kb) file.</p>
    html_clean: <p>The resource fork issue affects the FFIL file, not LWFNs. A FFIL file (font suitcase) has all its information in the resource fork. Only Macs can deal properly with this kind of file. The LWFN (the PostScript outline data) has all its information in the data fork, meaning it’s just a plain old binary file, like the kind used on other OS’s. If you are not careful when moving Mac font suitcases (FFILs) to and from foreign file systems (the internet, for example), the resource fork may be lost resulting in an empty (0kb) file.</p>
