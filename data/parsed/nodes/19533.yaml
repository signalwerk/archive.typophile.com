    html: <p>Incidentally, a dfont is simply a Mac TrueType font with all its data in the data fork instead of the resource fork. Apple uses this format for essential system fonts on OS X because OS X is UNIX-based and, without higher level stuff like Aqua, can’t deal with resource forks either. There is no need or advantage to converting normal (non-system-essential) fonts to the dfont format.</p>
