      <p><cite>and said Goudy Old Face was only a screen font, thus no good.</cite></p>
      <p>They meant it is originally MADE and optimized for the screen, not that it is a SCREEN FONT made out of pixels. So there’s no need to look for a PostScript version of it. Everything is in the FFIL file.<br>
      If you’re happy with the design just tell them to use it. It’s an old myth that TrueType fonts are not printable. Every recent RIP or printer will have no problems using this TrueType font in a font suitcase.</p>
