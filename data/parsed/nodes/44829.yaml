    date: 2008-04-30T01:13:00
    date_raw: 30.Apr.2008 1.13am
    votes: null
    html: <p>Hmm, it looks like Zekton is actually an improved version of the <a href="http://www.abstractfonts.com/font/8340">Zekton Deluxe Bold</a> which was used for the trailer. It’s too bad that a studio with a multi-million dollar budget is using sloppy free fonts for a trailer. I can see the title designer now, trawling through free font archives, completely unaware of the universe of quality type that lies beyond dafont.com.</p>
