      <p><cite>how do i combine them into one .otf?</cite></p>
      <p>You ... don't. An OTF file is not a font family, it's a single font.</p>
      <p>There is a small workaround for 'family-aware' fonts, with the 'size' feature, but that has been poorly constructed and has led to errors in the past. Besides, no application supports it (perhaps InDesign CS4 does). Besides #2, you cannot add it with FontLab, you would need ADFKO for that.</p>
      <p><cite>ps. what unicodes do i use for alternate characters?</cite></p>
      <p>You may think of anything. A rule of thumb I have seen in Adobe fonts is to let the user choose between selecting an alternate for a character (such as ornaments found under the bullet), and have it as alternate for 'regular' characters (i.e., 'A' is ornament #1, 'B' for ornament #2), but that option seems to be outdated already.</p>
      <p>Using Unicodes in the private area would be okay, I guess.</p>
    html_clean: |-
