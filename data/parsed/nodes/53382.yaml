    <p>follow-up question: in file menu, what's the difference between<br>
    – generate font<br>
    – generate all<br>
    – generate suitcase<br>
    ?</p>
    <p>ps. what unicodes do i use for alternate characters?</p>
    <p>thanks for your help</p>
