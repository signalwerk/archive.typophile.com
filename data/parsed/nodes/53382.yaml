      <p><cite>... if it’s un-coded ...</cite></p>
      <p>In addition to Jens, OpenType features are not Unicode dependent; they work with 'raw glyphs' instead. But assigning Unicodes to the alternates has the advantage they are visible and can be entered into non-OpenType aware applications. Also, you can use Unicode characters in the InDesign Search &amp; Replace fields, but non-encoded glyphs have to be searched and replaced with the Search For Glyphs (CS3+) function (which does that and nothing more).</p>
      <p><cite>Adobe and other recommend not encoding alternate characters, but there are some reasons for doing so.</cite></p>
      <p>Font switching is one, but it's hardly a valid point if you're talking about manually selected alternates. Any more? I remember the original Adobe specification of assigning 'regular' characters to ornaments using aalt (? memory) was removed somewhere in time.</p>
