      <p>Actually you can hav one font with sevral familiy weights.<br>
      but this would be an awkward way of implementing weights.</p>
      <p>1. With copy\append in FL make as meny as glyfs are needed for all weights.</p>
      <p>2. now in volt you would simply add sub lookups as<br>
      Light<br>
      Regular<br>
      Bold<br>
      Black</p>
      <p>and attach them to Stylistic set Features<br>
      (SS01-SS02 Ect' Ect')</p>
      <p>Sub Lookup [Light]<br>
      ARegular -&gt; Alight<br>
      ABold -&gt; ALight<br>
      ABlack -&gt; ALight</p>
      <p>Ect' Ect'</p>
      <p>    Light</p>
      <p>But this is not a way to do things :)</p>
      <p>Why not Do this????</p>
      <p>1. Single file very large<br>
      2. only last set will be activated - if enabled SS1+SS2+SS3<br>
      only 3 will be activated becaus they are applied by their sequence<br>
      3. not standart</p>
      <p>Why yes do  this?<br>
      SS features can be attached as styles<br>
      u cant sub or pos between 2 weights, but you can if they are all in one file.</p>
      <p>creazy thought but doable :)</p>
