      <p><em>how do you export a font with several families? at the moment i’ve got seperate fontlab files for regular/bold, but how do i combine them into one .otf?</em></p>
      <p>As Theunis points out, you can't make a single OTF file with several fonts in it, but, depending on the way you set up the name fields in your fonts, you can create associations between them so they show up in programs as one family. (See <a href="/wiki/Font%20Naming" class="freelinking" rel="nofollow">Font Naming</a> in the TypoWiki.)</p>
      <p><em>follow-up question: in file menu, what’s the difference between<br>
      – generate font<br>
      – generate all<br>
      – generate suitcase<br>
      ?</em></p>
      <p>Generate Font: Generates a single TTF or OTF font file. (Some other formats, too, but mainly it's used for those.)</p>
      <p>Generate All: Same as Generate Font, except for multiple fonts at one time. Can include all fonts that are open in FontLab or just some of them.</p>
      <p>Generate Suitcase: For making old style Mac PostScript and TrueType fonts. These only work on Macs.</p>
      <p><em>ps. what unicodes do i use for alternate characters?</em></p>
      <p>These should either be left unencoded (no Unicode number) or given Private Use Area (E000-F8FF) codes. There are no standards for this area by definition, so you can use them any way you want. They will be unlikely to match glyphs in other fonts that use the PUA, but that's the nature of PUA. Adobe and other recommend not encoding alternate characters, but there are some reasons for doing so.</p>
