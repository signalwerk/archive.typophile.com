      <p>The letters lif are too tight next to that e. It looks like they have formed a clique and are leaving poor e out. But this isn’t important.</p>
      <p>To me what is important is that even though it is getting better ( it is) I really think it won’t become really good until you can describe what you are after and why. Only then can your choices be deliberate. </p>
      <p>You can always make something that comes close to being a good design by following typographic “rules” or by emulating other designs you like but you can’t get past a 50% or 60% success without serious consideration of the context. Until that happens the design isn’t grounded in it’s purpose. And it will niggle you like a loose tooth or badly fitting clothing because it won’t be quite right.</p>
      <p>I don’t mean to brow beat you here. I hope it doesn’t feel that way. Quite the opposite. I hope this helps reduce frustration while you are designing.</p>
