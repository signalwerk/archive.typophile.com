      <p>1 - I definitely think you’re moving in a better direction, but why Century Gothic? Do you happen to have Avenir on your system, Century Gothic is a pale derivative of Frutiger’s genius face.</p>
      <p>2 - Have you thought about just ditching the circle around the jumping figure? Or creating a transparent gradient so that it is jumping “out” of something, but jumps into the more “ethereal”. The only problem with that approach is you have to keep the logo in Illustrator format, not generic EPS, however, you can retain spot colors doing a gradient like that in Illy. It could be worth looking into.</p>
      <p>3 - I agree with one of the earlier comments who said the bottom eyebrow “Christian Church” is probably a little too close, vertically, to the name. I assume this will have to go on a website and other placements where the render size could be as small as 100 px vertical, so that’s going to shrink down really fast. Maybe do two logos? One for print over a certain size and one for small print/web sizing? </p>
      <p>I do like the evolution, no pun intended =)</p>
