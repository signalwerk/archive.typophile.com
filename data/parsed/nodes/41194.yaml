      <p>For me Helvetica reads as “middle of the road” and Consumer oriented. The dots are weird to see in a church logo too - but they are doing a job - separating elements so I can’t ding them except maybe to question the tone they set which is a bit techy maybe. I think you might want to look at other Sans faces as well. What about something with a hint of humanism about it? Maybe something like this?</p>
