      <p>I agree that Helvetica Standard isn’t really working, but what about other variations? I’m a really big fan of Neue Helvetica 23 Ultra Light Extended ( <a href="http://www.linotype.com/13103/neuehelvetica23ultralightextended-font.html" title="http://www.linotype.com/13103/neuehelvetica23ultralightextended-font.html">http://www.linotype.com/13103/neuehelvetica23ultralightextended-font.htm...</a> ), or maybe Basic Commercial in Bold Extended, but the main thing is that I want to stick with a sans-serif font.</p>
      <p>The majority of serif fonts feel corporate and business like to me. And that’s one thing a church should not be associated with.</p>
      <p>I’m really trying to get a budget approval on purchasing maybe a few font packages from Linotype, but I’m the youngest person on staff by 17 years, and my font preference doesn’t seem to agree with the older people on staff :[[</p>
      <p>But in the meantime, I’m still looking for a font that fits the identity of our church.</p>
