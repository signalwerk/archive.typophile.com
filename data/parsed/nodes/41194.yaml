    html: |-
      <p>Thanks so much for the input!</p>
      <p>I see the most questions are regarding Helvetica...</p>
      <p>Well, if you guys have seen a typical church logo, it always seems to have crosses, rivers, mountains, etc., along with fancy serif’d fonts and such.</p>
      <p>The biggest issue for me was common stereotypes associated with ’church.’ I don’t believe that crosses, rivers, mountains and all fit any demographic at all anymore. And although real church’s don’t necessarily target any specific demographic, the identity should be simple and neutral.</p>
      <p>The reason I used Helvetica as just an initial idea was because of it’s legibility from distances. It is more fuller in my opinion, and is easier to read if it was to be on a sign. As opposed to the first logo I’ve shown that is News Gothic Standard.</p>
      <p>Also, about the design itself, the original logo before I made the ’old’ one was just the character logo that had ’Spring of Life’ adjacent to it in a horrible font called ’Rage Italic’ I’ve never been a fan of open logos (logos that have no distinct shape) and ’he’ the logo just kinda was standing alone.</p>
      <p>Anyways, thanks again for the advice! I’ll see what else I can do with it!</p>
      <p>Ty</p>
