    <p>Wondering if anybody can help with a few fonts featured on this site as they all go together quite nicely.</p>
    <p><a href="http://www.myspace.com/emarosaband" title="www.myspace.com/emarosaband">www.myspace.com/emarosaband</a></p>
    <p>1) the title: 'emarosa' and 'contact', 'pre order', 'store' etc.<br>
    2) the sub header: 'relativity' and 'send message', 'add to friends' etc<br>
    3) body: 'pre order at rise records online store now' and credtials i.e. 'will sowers', 'jonny craig' etc. (I believe this is just number 1 but in lowercase, but i put it in just to be sure.)</p>
    <p>Thanks all.</p>
