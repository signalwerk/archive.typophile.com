      <p>Numbers 1 (title) and 3 (body) are one and the same typeface.</p>
      <p>Originally it is called Fino, designed in the 1970’s by Maurice Schlesinger.</p>
      <p>Some digital recuts are:<br>
      Fina (Image Club Graphics), see PDF here:<br>
      <a href="http://www.tekntype.com/webs/tntfonts/pdf/02144.pdf" title="http://www.tekntype.com/webs/tntfonts/pdf/02144.pdf">http://www.tekntype.com/webs/tntfonts/pdf/02144.pdf</a><br>
      Fina Heavy (Image Club Graphics), see PDF here:<br>
      <a href="http://www.tekntype.com/webs/tntfonts/pdf/02145.pdf" title="http://www.tekntype.com/webs/tntfonts/pdf/02145.pdf">http://www.tekntype.com/webs/tntfonts/pdf/02145.pdf</a><br>
      Finale (CompuWorks)<br>
      Feena Casual (ZETAfonts)<br>
      <a href="http://www.1001fonts.com/font_details.html?font_id=548" title="http://www.1001fonts.com/font_details.html?font_id=548">http://www.1001fonts.com/font_details.html?font_id=548</a></p>
