    <p><strong>Typo.cz</strong> Your Guide to Central European Typography</p>
    <p>List of Central European sites related to typography. Links to both, free and commercial fonts for Hungarian, Czech, Polish and other Central European languages. Information on typesetting these languages. Keyboard drivers, Unicode indices etc.</p>
    <p>Site of the week, Font of the week, Photo of the week. Calendar of Central European typographic events.</p>
