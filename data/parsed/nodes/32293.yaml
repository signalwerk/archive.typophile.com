      <p>Uli, this is an issue of trademark, which is renewable every ten years forever. And an issue of copyright, which is good until seventy years after the creator's death. Otherwise Nike, Starbucks, Coca-Cola and every other protected brand in the US would be out of business. Just for fun I dare you to open a store in the USA and call it Wal-Mart to prove me wrong. They've been using that logo exclusively for decades now.</p>
      <p>The Top Gun logo used above is a stolen trademark. And the owners of that trademark will object.</p>
