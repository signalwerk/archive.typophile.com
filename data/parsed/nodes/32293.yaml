    <p>I am currently trying to convince the head of a company called Top Gun Sports Entertainment that their new corporate logo (which they supposedly have Trademarked with a Manhattan trademark attorney,) is a stolen design.</p>
    <p>I gain nothing either way.  I just want to know if I am ethically out of line.  As a designer, I would be mortified to try and sell this logo to a company as an original work.  As a corporation, I'd feel foolish using it, but the guy I'm arguing with seems to be without conscious.</p>
    <p>What do you all think?</p><div class="imageWrap"><img src="http://typophile.com/files/Logo Compare_3784.jpg"></div><p></p>
  html_clean: |-
