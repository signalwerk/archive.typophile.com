      <p>&gt; stolen design</p>
      <p>I do not like the expression "stolen design", as it is a legal misnomer.</p>
      <p>The movie "Top Gun" came out in 1986, i.e. 21 years ago, but design patents are only granted a period of protection of 14 years in the United States. Therefore the "Top Gun" design, provided it had been registered at all in 1986, is public domain since 7 years.</p>
      <p>See "35 U.S.C. 173 Term of design patent": "Patents for designs shall be granted for the term of fourteen years from the date of grant."</p>
    html_clean: |-
