    html: |-
      <p>Very attractive letters. I like the openness of the counters and how you terminate letters like the 'S' and 'C' with horizontal strokes—I'm attempting to bring similar elements into my own face. I think I came across another weight, or an earlier version of this, several months ago. I don't think I commented then because all I had to offer was unspecified praise. Now that I can put my finger on what strikes my fancy, I'll offer up my thoughts.</p>
      <p>My eye is drawn to the contrasting forms on the terminals—how the interior is flat while the exterior is curved. I think this works best on the 'a', 'e', and '1'. The question mark is particularly attractive, as are the guillemettes and ampersand. It really gets under my skin when typefaces have weak, awkward, or otherwise bothersome punctuation (See: the question mark on Futura Medium).</p>
      <p>There are a few places where the modulation of the stroke weight bothers me, particularly the 'r'. The fact that the arm of the 'r' is flat all the way across the bottom, which I absolutely love, makes the stroke noticeably thin where it joins the vertical stroke. Oddly enough, I first thought this was because the stroke of the arm was too heavy—making the joint look weak in comparison. It wasn't until I zoomed in closer that I realized that the joint was the problem and not the arm's weight. Also, the modulation on the Q feels a touch extreme. I could see tapering the tail more to give some room for the bowl to maintain a little more weight.</p>
      <p>Quite delicious all-in-all.</p>
    html_clean: |-
