    <p>Greetings forum members,<br>
    I've been working on the font for years, but it is the light weight that has suffered particularly from this stop/start process. I can't remember how many times I've wished I'd written concise notes so that I could pick up from where I left off.</p>
    <p>Anyhow, I would sincerely appreciate your comments, both on the forms and the spacing, since both require some work.</p>
    <p>thanks,</p>
    <p>Miles<br><a href="http://www.newlyn.com">www.newlyn.com</a></p>
