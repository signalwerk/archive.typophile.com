      <p>Miles, this seems like the long-awaited maturation of this highly<br>
      contemporary style that's been brewing for a few years - good going!</p>
      <p>I haven't read all of the feedback from others in this thread, so I might be repeating things (or ignoring changes already made) but here is some feedback:</p>
      <p>I like the narrowness of the font - it seems essential in making this style sing.</p>
      <p>I would make the descenders a bit shorter.</p>
      <p>The bowl of the "a" seems to need a little bit more modulation, to harmonize more with that funky characteristic thickening in this design (like at the top of the "a" itself).</p>
      <p>The lefthand side of the bar of the "f" is sticking out a bit too much I think.</p>
      <p>Try your hand at a bi "g"?</p>
      <p>As others seem to have opined, the tittle of the "i"/"j" isn't there yet. Often it's useful to align it with the top of the "t"; so in this case I might either raise the dot even higher* (aligning its bottom with the top of the "t", and its top with the full ascenders), or I might center the dot at the height of the "t" (in which case you could align its top with the caps, which is useful).</p>
      <p>* In fact such a -hopefully sufficiently gentle- idiosyncrasy might become the "signature" of this font.</p>
      <p>The "k" might be fine, but it might be a bit narrow, and it might also need a hair more flair, like making the arms uneven somehow. Like Tiffany I'm ambivalent about separation in a "k", but I actually think it's usually better in display than text!</p>
      <p>The "r" and "s" rule.</p>
      <p>The bottom terminal of the "y" is a bit unconvincing (although there might not be much room for change; note that shortening the descenders would give more room).</p>
      <p>I would stagger the arms of the "x", even if it doesn't really need it optically - it would give the glyph more flavor, instead of looking like a math symbol.</p>
      <p>The top join of the "ae" needs to be modulated lighter.</p>
      <p>The ampersand is very nice, except for the top-right arm, which seems too straight and/or long.</p>
      <p>The width and height of the caps is right on.</p>
      <p>I'd make the "D" slightly wider.</p>
      <p>Would the "E" look better with a shorter middle bar?</p>
      <p>The bar in the "G" is distracting close-but-not-aligned with the bars of the "E", "H" etc. Since raising it might be too much, I'd probably lower it.</p>
      <p>That wide "J" will give you trouble, especially in some parts of Eastern Europe...</p>
      <p>The cap "K" seems OK as it is, even the separation.</p>
      <p>The "M" is super.</p>
      <p>If you keep the slight trapping in the "N" some other glyphs will need it too of course.</p>
      <p>The "Q" is exceptional - although the tail is just a bit too heavy I think.</p>
      <p>The curve of the "U" seems a bit light.</p>
      <p>The "X" seems fine as is in the caps.</p>
      <p>The vertical of the "AE" seems unsually thin.</p>
      <p>I would put small nicks at the top and bottom joins of the "OE". I've always liked that, and it's becoming more acceptable lately (especially in a sans).</p>
      <p>Also: I like the cedilla; the tilde seems out of character; the eszet is too wide; the cap Thorn could have a larger bowl towards the bottom; the numerals are mostly nice, except the "5" is slightly narrow and the "2" need some sort of fix; the Pound could benefit from a shorter top; the Yen isn't happy - I'd lower the bar; can you make the Section not lean to the right?</p>
      <p>Is the Italic mechanical? If so that might be a good start, but the one thing that bothers me is the slant: way too much. I think contemporary fonts look much nicer with a gentle slant (although that does require the Italic to be pulled away from the Roman more in other ways).</p>
      <p>Spacing: since this a light font it will typically be used large, so the spacing probably needs to be a bit tighter.</p>
      <p>Overall very tantalizing - good luck finish it soon!</p>
      <p>hhp</p>
