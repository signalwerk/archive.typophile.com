      <p>It seems to me that there's a few people who see ligatures as stylistic novelties, rather than a solution spacing problems caused by the clashing of metal in times past, or the clashing of form in times present. </p>
      <p>Some forms clash: Garamonds, with their pronounced overhang, ball terminalled designs. ligatures solve these awkward situations.</p>
      <p>Some don't -  if they don't then there's no need to design a ligature, removing the dot or shortening the f terminal may suffice. In some cases the f, i, and l sit together without issue.</p>
