    html: |-
      <p>You’re right, he never did (alas, I might add). But there are some other variants of Roco (which is a redesign of Grock) I think are beautiful too. If you are interested, check P22 Art Deco (Carima Al Behairy, P22), GangueOuais (Darren Rigby, Starving 4 Entertainment) and Signum (a Grockified Broadway by Karl Nayeri, Prime Graphics).<br>
      The Belgian company Alfac had a font called Spats but it was never digitized.</p>
