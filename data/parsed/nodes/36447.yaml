  html: <p>Not v. exciting news for owners of Adobe's latest CS Suite, but for those of us without such weighty programs, it's worth knowing that if you install Acrobat 8 Standard for Windows (not the Reader), and then go to \Program Files\Adobe\Acrobat 8.0\Resource\Font\, lo and behold, there are Minion and Myriad Pro in their full OpenType glory!</p>
