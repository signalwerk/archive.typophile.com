    html: |-
      <p>Miguel, </p>
      <p>it would be really nice if Myriad Pro was given small caps. While setting some headlines in MyriadPro-Semibold I once used the size-reduced caps of MyriadPro-BoldEmiExt as small caps. This worked adequately, but the other weights of Myriad Pro aren't graded in the way that would allow such tricks. The old MyriadMM would have allowed such tricks back in the Multiple Master days, but it is no longer possible in the new OpenType era. </p>
      <p>Since my guess is that Myriad Pro is internally developed as a two-axis MM anyway, I trust it wouldn't pose so much of a problem to produce small caps through the appropriate interpolation. </p>
      <p>Best,<br>
      Adam</p>
