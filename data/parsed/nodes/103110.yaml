    html: |-
      <p>You don't need 20000+ glyphs to display the Quran text correctly, you just need a font with appropriate layout technology to handly dynamic letter joining and mark positioning. See, for example, Muhammad Zuhair's impressive <a href="http://typophile.com/node/93945" rel="nofollow">Albazi Naskh</a> font (Pakistan).</p>
      <p>Even if you do go the route of large numbers of word ligature glyphs, you do not need to encode these glyphs, and definitely should not hijack Unicode character codes from other languages and scripts to do so.</p>
      <p>I recommend that before you do any work on this project you properly research OpenType Layout and how it works.</p>
      <p>[You might also be interested to research DecoType's Arabic script layout technology, which although not as widely supported as OpenType is more powerful and better suited to Arabic script. DecoType are able to accurately display Quran text with fonts that contain only a few hundred glyphs.]</p>
