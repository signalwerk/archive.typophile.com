    html: |-
      <p>&gt; I have a font which has more than 65536 glyphs in it.</p>
      <p>The major font formats do not support more than 64K glyphs in a font. You have hit a hard limit.</p>
      <p>Rather than copy/paste, you could duplicate the SFD file, and then delete unneeded glyphs. That way you could be sure not to lose any metadata or interglyph info such as kerning....</p>
