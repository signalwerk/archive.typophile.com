      <p>Bodoni?! It's a wedding, not a funeral.</p>
      <p>Why not just use Ministry (a great match for those cards - which are nice btw) for everything? Everybody knows what a wedding invitation says anyway. As long as the numerals are unambiguous (for address &amp; date/time) you should be fine. Just maybe lighten the names manually, since you'll probably be setting them larger, but you don't want them to scream - unless it's that kind of wedding I guess.</p>
      <p>BTW, with all those kerning pairs I bet you're<br>
      seriously tempted to include a colophon eh?  ;-)</p>
      <p>hhp</p>
