  html: |-
    <p>Hello there, anyone can help me with this?</p>
    <p>I've been working on the wordmark for an apparel shop. Their consumers are mostly men. However they also sell women clothing. I presented some sketches and they liked them but they thought they were manly, so I was asked to make it more womanly. I can't figure out what they meant typographically thinking. </p>
    <p>What would you consider makes a typography in this vein more feminine?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/PUERTO33-3_4550.jpg"></div><p></p>
