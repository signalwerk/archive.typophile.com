    html: |-
      <p>Hi thank you for all your comments, I've been working on it. I tried to play with thick/thin contrast and made it a bit wider. I kind of like the results, though there are some thing I'm not quite happy with.</p>
      <p>I feel the “T” is not wide enough. Although I like the feel of the “U” and “O”, I'm not sure about the “O” shape. Finally, I haven't figured out the look of the "33" but I'll keep working.</p>
      <p>I'm very happy with the feedback provided by this community, I don't know why I hadn't signed in before. You're great guys.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Evernote Camera Roll 20130808 090221 p_6196.m..jpg"></div><p></p>
