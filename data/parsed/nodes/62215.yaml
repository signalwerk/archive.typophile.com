    <p>Hello Typophiles!</p>
    <p>Callimachos - not Kallimachos :) -is a title font for jobs that need a hand-drawn, bold feel. </p>
    <p>My main problem is that I can't speak Russian nor I am familiar with the Cyrillic alphabet.</p>
    <p>I'm trying to achieve the Cyrillic version looking at other font structures and apply the style of the others glyphs - bet it has many inconsistencies or/and bug.</p>
    <p>Would anyone help me, please, to correct the Cyrillic glyphs?</p>
    <p>Thank you in advance!</p><div class="imageWrap"><img src="http://typophile.com/files/callimachos_test_02_5_4145.jpg"></div><p></p>
