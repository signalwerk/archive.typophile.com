      <p><cite>3.1. the nominal quantity (nominal weight or nominal volume), expressed in kilogrammes, grammes, litres, centilitres or millilitres, and marked in figures at least 6 mm high if the nominal quantity exceeds 1 000 g or 100 cl ; 4 mm high if it is from 1 000 g or 100 cl inclusive down to but not including 200 g or 20 cl, and 3 mm high if it is not more than 200 g or 20 cl, followed by the symbol for the unit of measurement used or where appropriate by the name of the unit in accordance with Directive 71/354/EEC;</cite></p>
      <p>Looks as if it depends upon the bottle size.</p>
