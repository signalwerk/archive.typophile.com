  html: |-
    <p>Is there any prospect that the »CE marking« symbol (<a href="http://en.wikipedia.org/wiki/CE_marking">http://en.wikipedia.org/wiki/CE_marking</a>) will ever be part – at least – of standard body face character sets?<br>
    I need it very often, especially for corporate profiles, annual reports and brochures. I know that it hasn’t been encoded as a character. – However, this shouldn’t be an obstacle for type designers to add it.</p>
  html_clean: |-
