    html: <p>Thank you so much for this essential information, Karl! Nevertheless, the specified minimum vertical size is – as I learned now – 5mm, which means ca. 14 DTP points (hopefully I’m right). I think the set point size (as specified in vertical mm) should be user responsibility and not responsibility of the type designer, foundry or reseller. – Important is the availability of this character in the character set of a body face.</p>
