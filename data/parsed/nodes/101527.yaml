    html: <p>It should be encoded, and I'm surprised if it is not already in Unicode. Even though I don't think it is something that needs to be included in more than a handful of fonts, since the shape is standard, being able to include it as a text entitity rather than as an embedded graphic seems useful. The estimated symbol is also a standard shape, but is encoded in Unicode and hence included in at least some fonts.</p>
