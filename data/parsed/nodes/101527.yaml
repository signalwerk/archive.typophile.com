    html: |-
      <p>It doesn't look like it has a Unicode position, plus since it's so strictly defined that a font's style will have no bearing on it. So it's not very desirable as a character in a font. Why not just have/use it as a stand-alone EPS? It's not like you need to type a bunch of them at a time.</p>
      <p>Additionally, there's a risk concerning that minimum size, possibly leading to a textbook frivolous lawsuit, which is how people roll these days, at least here in the US. If a font publisher says something like "it must be 14 point to meeting the 5mm minimum requirement" some people will think the font has to be set at 14 point, but as George said that's not true, because type designers don't make their glyphs span the full height, so the mark will end up too small, and the lawsuit cascade might lead to the font designer... And for a type designer with a large library of fonts, unless he does decide to make the CE mark the whole height of the Em for all his fonts, he'll have to figure out the height proportion for each one of his fonts... Messy stuff.</p>
      <p>BTW is that thing spaced horribly, or what?! But if you try to make it look nicer by bringing the "C" and "E" closer, Interpol might come after you!<br><a href="http://www.electronicsweekly.com/blogs/test-and-measurement/2011/02/which-ce-badge-have-you-got.html">http://www.electronicsweekly.com/blogs/test-and-measurement/2011/02/whic...</a></p>
      <p>hhp</p>
