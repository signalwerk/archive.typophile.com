      <p>Due to the very precise requirements about how the characters should be drawn and scaled and how the use of the logo is approved as part of a greater process, including it in a font would likely not meet with the requirements of the standard, as shown and described below:</p>
      <p><img src="/sites/default/files/old-images/ce_marking_logo_3689.jpg"></p>
      <p><em>The various components of the CE marking must have substantially the same vertical dimension, which may not be less that 5 mm. If the CE marking is reduced or enlarged, the proportions given in the above graduated drawing must be respected.</em> (<a href="http://ec.europa.eu/enterprise/policies/single-market-goods/cemarking/professionals/manufacturers/affix-ce-marking/index_en.htm?filter=12">http://ec.europa.eu/enterprise/policies/single-market-goods/cemarking/pr...</a>)</p>
