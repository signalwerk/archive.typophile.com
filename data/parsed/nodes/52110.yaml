  - id: 315271
    user: 28142
    date: 2008-11-28T08:22:00
    date_raw: 28 Nov 2008 — 8:22am
    votes: null
    html: |-
      <p>to be totally frank here: I think you're over-working it.</p>
      <p>I think the whole 'dimensional and shiny' think really detracts from your mark, as does the tag-line.</p>
      <p>What about a slightly bigger logo (probably 1.5 the height of the text) and just like this:</p>
      <p>Black outline, solid blue fill, and the worm either as it is, or as a white silhouette</p>
      <p>and for the text, don't do the highlight because it's just detracting from legibility.  try a solid black, and a solid blue.</p>
      <p>Now, on a logical standpoint, I believe the <em>com</em> owns the period, not the <em>sworms</em>.  (black)sworms(blue begins).com</p>
      <p>Next, the first thing I noticed with your tagline was that it read like this to me: <em>Community of creaming</em>.  I'm not sure what kind of community this is, but softening the <em>s</em> and the <em>worms</em> made me just skip them entirely.</p>
      <p>I don't find that the font of the tagline matches the font of the signature, but when you do update it, what if the entire tagline was blue (to make it less dominant than the signature)</p>
      <p>I'd like to see an updated version with these changes at least, there's certainly a lot more than could be done with it and it <em>does</em> have potential, but you've gotta be open-minded and trust us here - this is what we're passionate about and we wouldn't misguide you.</p>
      <p>best of luck!</p>
    html_clean: |-
