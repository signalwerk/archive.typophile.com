    <h2><a href="/web/20081015194429/http://typophile.com/node/50505" title="Punchcut Seeks Design Intern">Punchcut Seeks Design Intern</a></h2>   <p>Hello. We’re looking for a second intern to join us in our San Francisco office. Rather than Typophile duties, we’re looking for a candidate to help with Punchcut marketing efforts. Please send a cover letter and PDF portfolio or portfolio URL to marketingposition [at] punchcut [dot] com.</p>
    <p><strong>DESCRIPTION</strong></p>
    <p>Punchcut is looking for a graphic design intern to aid with graphic design, event planning, publishing and public relations initiatives.</p>
    <p><strong>RESPONSIBILITIES</strong></p>
    <p>You will primarily:<br>
    • Coordinate design and production of online, print, mail, e-mail or other marketing campaigns: including web site updates, collateral and other items as requested</p>
    <p>You will also help:<br>
    • Maintain a marketing initiatives calendar, coordinate meetings with directors</p>
