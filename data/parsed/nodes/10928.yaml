  html: <p>Hello, everybody. Well, after many years just watching what goes on in the wonderworld of type, i'm finally here participating. I have tens of old and new sketches but as my commercial site is up and running now i guess i'm going to get my gears running and work on all of those! <br>I'm planning a may release of this font, which is fully sketched but i wanted an opinion on the look ¿is it atractive and/or useful? This is one of my favourites but i'm not sure about that name... <br><img src="http://www.typophile.com/forums/messages/29/855.gif" alt="probably elysee">  <br> <br>Greetings to you all from Mexico City and by the way you can check out my new site at <a href="http://www.roxyfonts.com" target="_top">www.roxyfonts.com</a></p>
