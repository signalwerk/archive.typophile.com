      <p>According to this:<br>
      <a href="http://www.fontbureau.com/fonts/CalifornianFB/" title="http://www.fontbureau.com/fonts/CalifornianFB/">http://www.fontbureau.com/fonts/CalifornianFB/</a><br>
      Californian FB (included in MS Office) is "compatible" with Benton Sans (first on the list). Both Benton Sans and Source Sans Pro are based on News Gothic + some claim Source Sans Pro and Benton Sans are "very similar when the font weight is at 300 or less".</p>
      <p>So I'll try with Californian FB and some slab serifs (thanks hrant) when I get home :)</p>
      <p>As for why the role-reversal of serif/sans... habbit. And yes, Word is to blame...</p>
