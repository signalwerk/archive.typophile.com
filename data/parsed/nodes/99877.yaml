      <p>How about Adobe's original open source font, <a href="http://ctan.cms.math.ca/tex-archive/fonts/utopia/" rel="nofollow">Utopia</a>?  I just tried combining that with Source Sans here and it looks quite good.</p>
      <p>(Actually, the version I use is an expanded TrueType derivative called <a href="http://code.google.com/p/evristika/" rel="nofollow">Heuristica</a>, but for Latin they're visually equivalent.)</p>
      <p>I was wondering about Californian or Berkeley myself, but the oblique humanist 'e' might not harmonize satisfactorily.  (I also experimented with Goudy Old Style; the combination looks OK-ish but didn't seem quite right to me.)</p>
