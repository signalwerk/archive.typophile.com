    <p>I am studying in a design school in Hong Kong and i have a project about typography.<br>
    i really hope you can help me<br>
    because i find that it was really difficult to search the info of ’Impact’<br>
    tomorrow is the deadline,so help me!!<br>
    i have some question now<br>
    (These questions are about the relationship between the fonts “Schmalfette/ Haettenschweiler” and “impact”)</p>
    <p>1. The font “Haettenschweiler” came out from another font “Schmalfette Grotesk”? So why desifners use “Schmalfette” with impact together?          </p>
    <p>2. What’s in the impact family?  ” Impact Wide” “,Impact Wide Italic” ,”impacta”and”Impact™ Roman”  are the members of the impact family?</p>
    <p>3. In the net, I saw “Impact has a high x-height”, what’s” x-height “means?   </p>
    <p>4. The last question, I found out that Impact is a trade mark of “Stephenson &amp; Blake.” but I also found out impact is a trade mark of “Ascender Corp”. Which one is True? (Besides, the impact wide came from Ascender Corp instead of Geoffrey Lee? )                    </p>
    <p>ofcourse~ if there are any other info of Impact tell me too</p>
    <p>Thanks for help!! I’d appreciate any of your answers</p>
