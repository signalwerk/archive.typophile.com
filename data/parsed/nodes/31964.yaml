    html: '<p>Well, the only one I can answer offhand is #3. <a href="/wiki/x-height" class="wiki">X-height</a> is a comparative measure of the height of the lowercase letters (e.g. a letter x) to the height of the capitals or ascenders. Impact has a high x-height because there is not a huge difference between the height of the lowercase and uppercase. Something like <a href="http://www.myfonts.com/fonts/urw/nicolas-cochin">Nicolas Cochin</a> has an unusually small x-height.</p>'
    html_clean: '<p>Well, the only one I can answer offhand is #3. <a href="/wiki/x-height" class="wiki link-lost">X-height</a> is a comparative measure of the height of the lowercase letters (e.g. a letter x) to the height of the capitals or ascenders. Impact has a high x-height because there is not a huge difference between the height of the lowercase and uppercase. Something like <a href="http://www.myfonts.com/fonts/urw/nicolas-cochin" class="link-external">Nicolas Cochin</a> has an unusually small x-height.</p>'
