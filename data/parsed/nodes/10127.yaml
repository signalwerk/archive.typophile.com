    html: <p>backslash <br>dagger, daggerdbl <br>copyright, registered, trademark <br>quotesinglbase, quotedblbase <br>elipsis <br>perthousand <br>guilsinglleft, guilsinglright, guillemotleft, guillemotright <br>quotedblleft, quotedblright, quoteleft, quoteright <br>bullet <br>endash, emdash <br>exclamdown, questiondown <br>cent, sterling, florin, Euro, yen, currency <br>section <br>ordfeminine, ordmasculine <br>logicalnot, plusminus, mu, divide <br>paragraph <br>periodcentered <br>acute, dieresis, cedilla <br>agrave, aacute, acircuflex, atilde, adieresis, aring, ae <br>ccedilla <br>egrave, eacute, ecircumflex, edieresis <br>igrave, iacute, icircumflex, idieresis <br>ntilde <br>ograve, oacute, ocircumflex, otilde, odieresis, oslash, oe <br>ugrave, uacute, ucircumflex, udieresis <br>ydieresis <br>Agrave, Aacute, Acircuflex, Atilde, Adieresis, Aring, AE <br>Ccedilla <br>Egrave, Eacute, Ecircumflex, Edieresis <br>Igrave, Iacute, Icircumflex, Idieresis <br>Ntilde <br>Ograve, Oacute, Ocircumflex, Otilde,Oodieresis, Oslash, OE <br>Ugrave, Uacute, Ucircumflex, Udieresis <br>Ydieresis <br>germandbls <br>degree <br> <br>That's 81 more. <br> <br>Depending on what you're after, some of these may not be useful. For instance, people using Central European keyboard layouts won't be able to access some of these characters, but they all exist in both MacRoman and Windows ANSI. Also, some people may not be able to figure out how to type a lot of these, even if they are accessible. <br> <br>In any case, it might be best to stick with characters that can be typed using only shifted and unshifted keys. That would rule out most of what I've listed above (except the backslash), at least on US keyboards.</p>
