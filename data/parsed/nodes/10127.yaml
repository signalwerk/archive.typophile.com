  html: "<p>Hey All, <br> <br>I'm working on a dingbat font and want to create it using only cross platform (Mac and PC) slots without any custom encodings . . . <br> <br>My question is, what is my max slots and what are they? <br> <br>By my count so far it's: <br> <br>A-Z - 26 <br>a-z - 26 <br>0-9 - 10 <br>shift 0-9 - 10 <br>-_=+[]{}|;':\",./&lt;&gt;? - 20 <br> <br>That would be 92 by my count . . . <br> <br>Am I missing any? Do I have some I shouldn't? BTW, I do not wish to include the space character slot in this count . . . <br> <br>Thanks All! <br>Stuart :D</p>"
