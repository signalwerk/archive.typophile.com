  html: |-
    <p>I need a type that will look good as a giant “2” for the cover of my school’s mag. The mag is mostly about architecture, though there is some art in it as well. </p>
    <p>The name of the mag is “studio” and this is the second issue, hence the need for a great type for the 2.</p>
    <p>I don’t have a preference between serifs and sans serifs. I want something bold, but not screaming; serious, but not boring and definitely not distressed/destroyed. </p>
    <p>Any thoughts? </p>
    <p>macgirl</p>
