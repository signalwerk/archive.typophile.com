    html: |-
      <p>Thanks for all the 2’s… :)</p>
      <p>I thought I’d receive notification when someone replied to my post, and since I didn’t get an e-mail I assumed that no one replied. But then, just out of curiosity, I checked the forum and there were lots of replies… this is Typophile after all. </p>
      <p>I like the Mercano Empire Regular, but for some reason I keep wishing the 2 to be “fatter” instead of “taller”, though only slightly. Maybe I can play around with it in Photoshop and see what I get. Or if you have another suggestion that is similar to that but “fatter”, please let me know. </p>
      <p>I considered the Roman numerals option, but I discarded it almost immediately as it would make the mag look unnecessarily “old” and kind of traditional. A giant “normal” 2 (in the tradition of Russian book cover designs) would deliver the message without being gimmicky. Castellar is gorgeous though. </p>
      <p>I really liked Tiffany Heavy, though I’m concerned that the little curvy parts might clash with the otherwise “regular” layout. I’ll try that one as well. </p>
      <p>The “hourglass” two is very cool, but I can’t use it… :( It reminds me too much of the Godfather font… I don’t know why, it just does. It looks really cool, though. </p>
      <p>thanks for your help,<br>
      macgirl.</p>
    html_clean: |-
