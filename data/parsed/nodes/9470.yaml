  html: <p>Hello, <br> <br>I am attempting to create a comics font in FontLab. I've been having some problems with how the font looks in FontLab, compared to how it looks in other programs once it's been created.  <br> <br>For example, in the image below, note how the "..." at the end of the sentance differs. The top one is how it looks in FontLab (and how i would like it to look).  The bottom one is how it looks in Illustrator once I create the font. The spacing between the dot dot dots is quite noticable.  <br> <br>I'm exporting the font as TTF.  <br> <br>Any thoughts on this would be most appreciated.  <br> <br>Thanks very much, <br>Colin White <br><img src="http://www.typophile.com/forums/messages/4101/66240.jpg" alt="FontLab_comics_font"></p>
  html_clean: <p>Hello, <br> <br>I am attempting to create a comics font in FontLab. I've been having some problems with how the font looks in FontLab, compared to how it looks in other programs once it's been created.  <br> <br>For example, in the image below, note how the "..." at the end of the sentance differs. The top one is how it looks in FontLab (and how i would like it to look).  The bottom one is how it looks in Illustrator once I create the font. The spacing between the dot dot dots is quite noticable.  <br> <br>I'm exporting the font as TTF.  <br> <br>Any thoughts on this would be most appreciated.  <br> <br>Thanks very much, <br>Colin White <br><img src="http://www.typophile.com/forums/messages/4101/66240.jpg" alt="FontLab_comics_font"></p>
