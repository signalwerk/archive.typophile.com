    html: <p>The difference between the two in generally erratic, and the font lab version is better (though I agree with stuart letterspacing is toooo tight, and the space between words toooo large). My guess is that the kerning is to blame. In font lab you have kerning turned off. In illustrator, I bet it is on (and brutalizing your nice work, see the qu for example). To see if that's what is happening click the K button in the FL metrics window and compare. <br> <br>Did you hit Autokern? A dangerous and sometimes useful game. <br>If that is what it is, get rid of all the kerning in the font, and just do a limited number of pairs by hand. Do a search for kerning pairs on typophile to get a list of recommended pairs. <br> <br>R</p>
