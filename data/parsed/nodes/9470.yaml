    html: <p>Are you using three dots "..." or a single ellipsis character "�"?  <br>I always kern .. tightly together (so that three dots is the same width as an ellipsis), but that's just a quick and easy solution - not necessesarily the right one <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
