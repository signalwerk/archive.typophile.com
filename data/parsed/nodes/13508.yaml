  html: |-
    <p>Born: Brazil, 1957</p>
    <p>Type designer and Brazilian delegate to the Association Typographique Internationale <a href="/wiki/ATypI" class="freelinking" rel="nofollow">ATypI</a>. He is publisher of <a href="/wiki/Tupigrafia" class="freelinking" rel="nofollow">Tupigrafia</a>, the first magazine dedicated to typography and calligraphy in Brazil.</p>
    <p>Claudio has designed the fonts ITC Gema, ITC Underscript.</p>
