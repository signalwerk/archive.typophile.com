      <p>Sorry for the late response. I have been travelling.</p>
      <p>I don't really understand what it is that you want to do with the 'Alef G' example. This looks like a re-ordering operation, which is not something that OTL is designed to do. Also, OTL is applied to glyph runs that are typically demarcated by script boundaries, so trying to affect substitutions involving Hebrew and Latin glyphs is unlikely to work.</p>
      <p>Similarly, with the number substitution you will run into the problem of glyph runs being demarcated by directionality, so the RTL Hebrew letters will be processed separately from the LTR numerals. If this worked in CS3, I'm not sure how.</p>
