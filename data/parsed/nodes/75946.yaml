      <p>Was the Hebrew font a non-Unicode .ttf?</p>
      <p>ID CS3 ME handled non-Unicode .ttf Hebrew differently than in CS5 or later.</p>
      <p>To get around the limitation John referred to, there must be a space on each side of the Hebrew string. As a type creator, make this space a zero width in order to place the non-Hebrew G besides the Hebrew.</p>
      <p>John, I made work-arounds back in the nineties when there was no ID CS/3 ME or higher, just Quark 2.x US edition. :)</p>
