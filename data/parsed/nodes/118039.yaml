    <p>Lichtspielhaus Handmade is an ultra condensed handwritten typeface based on Lichtspielhaus.<br>
     Influenced by the hand-painted signs on cinema facades of the early cinema days, Lichtspielhaus Handmade comes with 4 weights.</p>
    <p>“Lichtspielhaus Handmade” is the second part of a Type Noir Quadrilogy.</p>
