      <p>I think a lot of the above don’t fit the brief of “feeling contemporary.”</p>
      <p>Here are a couple of less “old style”&nbsp;feeling fonts, that still have the flares of Optima:<br>
      Chianti  <a href="http://www.myfonts.com/fonts/bitstream/chianti/" title="http://www.myfonts.com/fonts/bitstream/chianti/">http://www.myfonts.com/fonts/bitstream/chianti/</a><br>
      FF Legato  <a href="http://www.myfonts.com/fonts/fontfont/ff-legato/" title="http://www.myfonts.com/fonts/fontfont/ff-legato/">http://www.myfonts.com/fonts/fontfont/ff-legato/</a></p>
      <p>I would suggest Brown, but it is more grotesque than humanist. <a href="http://www.myfonts.com/fonts/shinn/brown/" title="http://www.myfonts.com/fonts/shinn/brown/">http://www.myfonts.com/fonts/shinn/brown/</a></p>
      <p>...and I will concur that my own Hypatia Sans would be a reasonable choice here:<br>
      <a href="http://www.myfonts.com/fonts/adobe/hypatia-sans-pro/" title="http://www.myfonts.com/fonts/adobe/hypatia-sans-pro/">http://www.myfonts.com/fonts/adobe/hypatia-sans-pro/</a></p>
