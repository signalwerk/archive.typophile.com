    html: <p>Joshua, you're truly an early bird. We haven't posted all the hotel details yet, but never fear, we did indeed negotiate a significant discount for TypeCon attendees. The attendee rate is $165 a night for a superior single or double room. Mention TypeCon and SOTA and you should receive that rate. If it doesn't work, please let me know, and I'll get in touch with the hotel right away so they start quoting the right rate. <br> <br>Our rate of $165 is really great for that time of year at a nice hotel in New York. You can add a 3rd person to a room for $20 a night, and even a fourth for an additional $20 if you enjoy that much togetherness ;) The hotel and service is excellent. Trust me, we checked out tons of hotels to find the one that would give a good rate and be able to house all our attendees. Not to mention that it's in a safe and convenient neighborhood (just a few steps away from Grand Central and a straight shot down to Parsons). I am sure that you'll be happy with the hotel. <br> <br>In addition to the awesome service and great historical feel, the Roosevelt has an amazing lobby and large bar area that's perfect to hang out in. Nice health club on premises, and high-speed internet access in the rooms. <br> <br>We'll have a roomie finder service going soon for TypeCon attendees looking to pair up with someone to share a room during the conference.</p>
