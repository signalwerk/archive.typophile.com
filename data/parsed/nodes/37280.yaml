      <p>I assume it’s too late to add any comments. But I read most of the comments and I find a Font chosen to be passé and cheap looking or if its custom its done in a style that will not last. Sorry for being blunt, but there are a large number of alternative Fonts available for a really professional word mark. Also, these day we sometimes get requests from clients that are pressing and may not pay enough. But with most clients we are building a relationship. This being said, relationship always needs both parties to give and receive, both ways. But you must never sell yourself short of your Professional Quality Work and craftsmanship, unless its for a Non-Profit Org. I've done very professional Word marks for many clients and if they don't understand the value, then you are journeying to the "Free" and cheap zone. Branding should never be approached in this manner, because its major implications and of its importance to any company.</p>
      <p>David Daigle, Canada</p>
