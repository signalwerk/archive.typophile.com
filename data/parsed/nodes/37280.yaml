      <p>It's very icy and sleek, but I think the letters are disconnected.  The z especially sticks out - I feel like the crossbar needs to match the bowl curve of the u. </p>
      <p>The A gets too much attention - perhaps  connect the crossbar all the way? It feels scaled down compared to the m, and therefore out of balance. </p>
      <p>Maybe you could play with some ligatures somewhere, too? (th comes to mind)</p>
      <p>Overall, I'm concerned the letters are so flat they won't scale down very well.</p>
