    html: |-
      <p>#1 is indeed lining. #4 is not oldstyle though; those are more like lining numerals for the small-capss/lowercase (the small-caps are x-height size; call them 'petit caps' if you will).</p>
      <p>As far as I'm aware it's common for the oldstyle numerals to fit within the x-height with ascending numerals at cap height and descending numerals at lowercase descender height, like I did in #2. They were too unstable for such a mechanical grotesque in my opinion so I designed these quasi-lining lc numerals (#3), hence 'hybrid'.</p>
      <p>Should I also design a set of hybrid numerals for the capitals? Initially I wanted to scrap a few sets of numerals but I actually don't mind having such diverse sets.</p>
    html_clean: |-
