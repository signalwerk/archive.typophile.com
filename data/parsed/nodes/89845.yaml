    <p>This is Celcius, a grotesque typeface which mixes a mechanical construction with humanist quirks. Celcius will consist of 7 weights plus italics and small-caps.</p>
    <p>Celcius preview v.9:<br>
    <img src="http://i1231.photobucket.com/albums/ee503/msilvertant/Typefaces/Celciusv9preview.jpg" width="590px"></p>
    <p>Celcius v.10:<br>
    <a href="http://www.fichier-pdf.fr/2012/02/12/celcius-v10/celcius-v10.pdf" title="http://www.fichier-pdf.fr/2012/02/12/celcius-v10/celcius-v10.pdf">http://www.fichier-pdf.fr/2012/02/12/celcius-v10/celcius-v10.pdf</a></p>
    <p>Celcius regular numerals &amp; small-caps v.10:<br>
    <a href="http://www.fichier-pdf.fr/2012/02/12/celcius-v10-regular-numerals/celcius-v10-regular-numerals.pdf" title="http://www.fichier-pdf.fr/2012/02/12/celcius-v10-regular-numerals/celcius-v10-regular-numerals.pdf">http://www.fichier-pdf.fr/2012/02/12/celcius-v10-regular-numerals/celciu...</a></p>
