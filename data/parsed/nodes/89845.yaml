    votes: null
    html: |-
      <p>I'm still not sure what you refer to as body height but that's fine.</p>
      <p>As far as I'm aware the default numeral sets for a typeface to be included are #1 (lining) and #2 (oldstyle). Oldstyle wasn't working for the small-caps and lowercase so I designed #3 (call it small oldstyle if you want) and #4 (lining numerals for the small-caps).</p>
      <p>So, #1 is designed to work with the capitals, #4 to work with the small-caps and #3 to use in longer texts. #2 (oldstyle) is there just because I consider oldstyle to be a standard numeral set, even though I honestly wouldn't use this one myself.</p>
      <p>Now there is room for one more numeral set which I think is what you were calling 'hybrid'. These will essentially be like #3 but at capital height; a cross between #1 and #2.</p>
    html_clean: |-
      <p>I'm still not sure what you refer to as body height but that's fine.</p>
