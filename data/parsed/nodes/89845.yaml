    html: |-
      <p>There's something "weird" about the "a" of the regular style.<br>
      When I look it on the thin style, it works well, the reading "flows".<br>
      But when I read the word of above "temperature" there's something that bothers.</p>
      <p>See that when you write "I'm a scientist", the "a" still works, because the reader can't see the loop of the eye, which the regular has.</p>
      <p>Why don't you try a more simple "a"? like <a href="http://www.myfonts.com/fonts/linotype/din-next/pro-regular/glyphs/536654/66" title="http://www.myfonts.com/fonts/linotype/din-next/pro-regular/glyphs/536654/66">http://www.myfonts.com/fonts/linotype/din-next/pro-regular/glyphs/536654/66</a></p>
      <p>Or maybe, if you want to keep it with that "oval eye", find another way. Right now I believe it's the letter which looks most informal. It needs to be just a little more geometric...<br>
      Maybe there's a little too much air above the "eye" of that "a".</p>
      <p>That's my opinion, hope it helps!<br>
      Best,<br>
      Lian.-</p>
