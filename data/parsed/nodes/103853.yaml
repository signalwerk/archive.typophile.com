      <p>Brings us back to the issue of whether the letters are direct from a font or are redesigned.<br>
      If the letters are an unmodified sample of a common digital font I would have expected that one of us would have run across something closer than Compacta by now.<br>
      Easy to modify Compacta per defiantone's observations, but that still begs the question of whether a 100% match exists.<br>
      Don</p>
