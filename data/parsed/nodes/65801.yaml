    html: <p>Okay, so I'm using Eurostile LT Demi and can't get the spacing to match. Is "Eurostile" different to "Eurostile LT" ?</p>
    html_clean: <p>Okay, so I'm using Eurostile LT Demi and can't get the spacing to match. Is "Eurostile" different to "Eurostile LT" ?</p>
  - id: 386587
    user: 110
    date: 2010-01-02T02:07:00
    date_raw: 2 Jan 2010 — 2:07am
    votes: null
    html: <p>There are several digitisations of Eurostile available from various foundries, and they are bound to all be slightly different in design and spacing. Finding the exact version starting from your sample is nigh impossible, so your best bet is to manually adjust the spacing and tracking until you get the desired results.</p>
    html_clean: <p>There are several digitisations of Eurostile available from various foundries, and they are bound to all be slightly different in design and spacing. Finding the exact version starting from your sample is nigh impossible, so your best bet is to manually adjust the spacing and tracking until you get the desired results.</p>
