    html: "<p>&gt;I bet you hated Richard Hamilton’s Beatles sleeve too. <br><br>Sgt. Pepper was the last Beatles album I bought, and I thought the Peter Blake sleeve was groovy. By the time of the White Album I was more into guitar psychedelia, and George didn’t cut it any more: Hendrix, Cream, Pink Floyd (Hipgnosis covers), and not yet a typophile. So I never noticed the White Album enough to hate it! <br><br>I’m not against minimalism, only when it’s an excuse for not having ideas.The Designer’s Republic sleeves for Warp, such as the Autechre Peel Sessions, with the track names in 5 pt Helvetica printed reverse out of clear varnish, are pretty sharp! Ooops, did I just endorse Helvetica?….  <br><br><br><br><br><br></p>"
