    date: 2003-10-21T17:40:00
    date_raw: 21 October 2003 - 5:40pm
    votes: 0
    html: '<p>&gt;<span class="caps">USE</span> <br><br>Let’s expand the context. <br><br>Certainly, in performing its immediate function in the job, type has meaning (in diﬀerent degrees) to the client, the end-user, and the designer. <br><br>However, in choosing a particular typeface, the designer impacts the culture at large not just by the appearance of the work, but by supporting the foundry which sells (licenses) that typeface. <br><br>Now, one little font usage is no big deal, but not shopping locally is the norm, and not just with type, but also for stock photography and illustration, software, hardware, and even paper. <br><br>The end result is that most places in the world do not produce the tools and materials of their graphic design culture locally. It is imported, usually bought from multi-nationals who have driven down the fee that (all but a few) creatives can charge.  <br><br>Walmart-ization. <br><br>Now you may say, even with generic materials, designers can create work of unique personality. Sometimes, but the trend towards homogenous global culture would suggest otherwise.  <br><br>This way of working with generic tools and materials commodiﬁes design. People (ie the Client) see that what we do is not very special: we choose pictures (they can do that too at gettyone.com), we set type on computers (they do that too), we use old familiar fonts. This kind of work isn’t worth much, and will soon be replaced by expensive software operated by low-paid drones. <br><br>Erik Spiekermann commented on the use of <span class="caps">DIN</span> for highway signage in South Africa. He found it disconcerting. Now you may say, if <span class="caps">DIN</span> and Highway Gothic are the best typefaces for the job, why not use them? But do we really want to live in a world where everywhere looks the same, for&nbsp;ever?</p>'
