    html: <p>Chris I couldn’t agree more, Eurostyle is a beautiful font and still very contemporary as can be witnessed in how often its used in for example dance/techno artists sleeves.  <br><br>One that springs to mind is the acclaimed English group, The Future Sound of London. They released two albums with just this type set alone against a black and white background respectively. <br><br><img src="https://web.archive.org/web/20170703135150im_/http://www.typophile.com/forums/messages/30/18902.jpg" alt="FSOL"><br><br>The idea that fonts cannot transcend the era they were designed, or somehow only retain characteristics of for use of a better phrase, ‘the zeitgeist’ of their period, is something I ﬁnd peculiar to say the least.  <br><br>Haven’t geometric sans serifs become synonymous with a sense of the here and now, no matter which decade the latest batch are deployed&nbsp;in. </p>
