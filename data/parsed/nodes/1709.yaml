    html: <p>On the subject of old faces (eurostile, heilvetica, univers <br>et al) being used in contemporary work, has anybody <br>read the emigre 65 q&amp;a with experimental jetset  <br>regarding their use of heilvetica? I have read it and I <br>can't quite get my swede around their extravagent  <br>philosophical justification for using it so much.  <br>Something about graphic design self referencing itself <br>in order to be relevant. It would be wonderful if <br>someone could clarify this for me.  <br> <br>I have to agree with Nick. To use an old face to present  <br>a modern feel is a little to ironic for my taste. It reeks of <br>complacency and a lack of knowledge as to what else <br>is 'out there'. This runs parallel with my opinion of  <br>music. A friend asked me whether I was going to see <br>metallica in concert. I said no, explaining that for every  <br>metallica there are plenty of musicians who are making <br>music that is just as good, if not better, but do not have <br>the luxury of mass exposure. When I discover a gem <br>'unknown' album it is far more rewarding. Metallica, <br>like the old typographic stalwarts, are indeed genre <br>defining. But I imagine they (band &amp; type) were much <br>more exciting and relevant in their heyday. Unlike wine, <br>they do not get better with age. <br> <br></p>
