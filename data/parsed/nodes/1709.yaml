    html: <p>&gt;producing a look reminiscent of the machinery, technology, and interior design of the 1950s <br> <br>No era is a monoculture, so while this is technically correct, it is only partly true. It's interesting the way our cultural memory of the 1950s is changing. Presently, I would say that most people ignore the modernism of the 1950s, and think of it as a very retro, scripty era, or perhaps wonky (that's for you, Tom) and beat-mod, as in the "Saul Bass" lettering style (done for him by lettering artists such as Art Goodman). Fontesque is usually described as "fifties style", which really pisses me off -- I guess I'll have to wait a while for it to be called "90s style". <br> <br>&gt;Eurostile looks modern <br> <br>There is definitely something very space-age and futuristic about the CRT-derived "supercurve" (Zapf's term?) that characterizes Novarese's Eurostile -- making it a favorite for data displays and signage in sci-fi movies. <br> <br>Sans serif typefaces have been described as "modern" since the 1840s, so it's a pretty meaningless term -- particularly when one considers that the Didone class of types is also called "modern"! <br> <br>However, Richard is right. We should encourage designers to not just fudge things by using typefaces that are merely "modern" in appearance, but to specify ones that are actually of the present day. <br> <br>If not something more hard-core techno, Foundry Monoline or Paralucent should certainly be preferred over Eurostile, which has been used as the corporate style of a gazillion engineering firms over the past 40 years.  <br> <br>If EDF wants to position itself as a conservative, run-of-the-mill engineering company, Eurostile may be a good choice, but this is not the rationale proferred in the style guide. <br> <br> <br> <br> <br> <br></p>
