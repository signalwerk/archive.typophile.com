    html: <p>I don't see using old typefaces as a problem at all, frankly. There are many new typefaces coming out all the time, and some of them are absolutely wonderful, but that doesn't mean that they made older designs obsolete. I think that this discussion boils down to the associative connotations a typeface might have. For example, to me, the use of Didot immediately takes me back to french class, reading Moliere. But that is a subjective judgement.  <br>Typefaces only have connotations if they have somehow entered the public consciousness. For example, Eurostile, despite what adobe might say or whoever else for that matter, to most people just means FCUK.  <br>In other words, if a typeface gives an appropriate look and is used properly, it'll work regardless of when it was produced.  <br> <br>H</p>
    html_clean: <p>I don't see using old typefaces as a problem at all, frankly. There are many new typefaces coming out all the time, and some of them are absolutely wonderful, but that doesn't mean that they made older designs obsolete. I think that this discussion boils down to the associative connotations a typeface might have. For example, to me, the use of Didot immediately takes me back to french class, reading Moliere. But that is a subjective judgement.  <br>Typefaces only have connotations if they have somehow entered the public consciousness. For example, Eurostile, despite what adobe might say or whoever else for that matter, to most people just means FCUK.  <br>In other words, if a typeface gives an appropriate look and is used properly, it'll work regardless of when it was produced.  <br> <br>H</p>
