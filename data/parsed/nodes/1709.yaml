    html: <p>Hey people...I didn't mean to start a war here. <br> <br>Microgamma/Eurostile is a fine font and certainly has its uses. I can't really explain, but it just doesn't do "modern" in this situation for me. <br> <br>Joseph, you're right, I'm suitably chastened. <br> <br>BTW for those wondering why the big "e" <br> <br>"When designing our new logo we deliberately moved away from the traditional energy industry colours like black, red and dark blue. Our new blue is fresher, more modern, and evokes a more natural kind of energy. <br> <br>Like 'o' for oxygen we want people to recognise that 'e' means energy, in all its forms. It's the international symbol for energy in science, and the first letter of the word energy in lots of languages. It'll tell the world that we're the energy experts. And it should grow to represent who we are - a successful company, achieving the right balance. We hope that soon it'll be known by people all over the country. They'll see the 'e' and think of us."</p>
