    votes: 0
    html: "<p>&gt;Why go out of your way to ﬁnd something that was made now, when you have a perfectly good face that was made in the 50s that does the same thing?  <br><br>Because it’s your job. A lazy, cheap designer (and by extension, design profession) ain’t worth . What are clients going to pay you for if you add no value to your work, if your typography could be done by anyone with generic software? <br><br>The old stuﬀ is not “perfectly good”. It doesn’t express the culture here and now. Or if it does, it’s all about a bland, generic, world dominated by corporations that have no use for local idiosyncracies. <br><br>As David Jury wrote in Eye, Summer 2001, “Total, independent control of typography has been dropped in the lap of every graphic designer, yet the same technology sits on desks in every business and commercial organisation. The question will be asked more and more: “Should I employ a graphic designer, or ‘design’ it myself?” Put another way; if the ﬁner points of typography are not addressed, then what will be the diﬀerence between a graphic designer and an administratvie assistant, paid perhaps ten times as less for doing the same job just as badly?” <br><br>I would say that carefully choosing a contemporary typeface, and working with it (learning how to “play” it), is one of those ﬁner points that needs to be addressed. <br><br>And if a <span class=\"caps\">UK</span> company accepts Eurostile (Italy, 1960s) for its typestyle, rather than the local, contemporary Paralucent or Foundry Monoline, that’s not representing for its own people, that’s an insult to the culture of its customers. <br><br>And with bland, generic design such as an <span class=\"caps\">ID</span> that’s a big oﬀ-the-shelf “e” + Eurostile, used by a major corporation, hey, the message is clear, Who needs a designer, anybody can do that&nbsp;crap.</p>"
    html_clean: "<p>&gt;Why go out of your way to ﬁnd something that was made now, when you have a perfectly good face that was made in the 50s that does the same thing?  <br><br>Because it’s your job. A lazy, cheap designer (and by extension, design profession) ain’t worth . What are clients going to pay you for if you add no value to your work, if your typography could be done by anyone with generic software? <br><br>The old stuﬀ is not “perfectly good”. It doesn’t express the culture here and now. Or if it does, it’s all about a bland, generic, world dominated by corporations that have no use for local idiosyncracies. <br><br>As David Jury wrote in Eye, Summer 2001, “Total, independent control of typography has been dropped in the lap of every graphic designer, yet the same technology sits on desks in every business and commercial organisation. The question will be asked more and more: “Should I employ a graphic designer, or ‘design’ it myself?” Put another way; if the ﬁner points of typography are not addressed, then what will be the diﬀerence between a graphic designer and an administratvie assistant, paid perhaps ten times as less for doing the same job just as badly?” <br><br>I would say that carefully choosing a contemporary typeface, and working with it (learning how to “play” it), is one of those ﬁner points that needs to be addressed. <br><br>And if a <span class=\"caps\">UK</span> company accepts Eurostile (Italy, 1960s) for its typestyle, rather than the local, contemporary Paralucent or Foundry Monoline, that’s not representing for its own people, that’s an insult to the culture of its customers. <br><br>And with bland, generic design such as an <span class=\"caps\">ID</span> that’s a big oﬀ-the-shelf “e” + Eurostile, used by a major corporation, hey, the message is clear, Who needs a designer, anybody can do that&nbsp;crap.</p>"
