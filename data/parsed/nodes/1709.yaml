    html: "<p>&gt;If that’s the case, I trust that you never use any fonts older than, oh, say 10 years?  <br><br>Once in a while I use older fonts: when working in an historical genre, or when the corporate/house style is already in place and I have no say in the matter. Occasionally I use Shinn Sans (1985), my oldest face. But starting from scratch on something contemporary, I always use contemporary typefaces. <br><br>Chris, are you convinced by your own argument? Accordingly, you should be using nothing but the old chestnuts! <br><br>&gt;it is impossible to make a font today that does not have a “feeling” of a font from yesterday <br><br>But I try. Which font from yesterday does Morphica “feel” like? <br><br><br></p>"
