    html: <p>If that's the case, I trust that you never use any fonts older than, oh, say 10 years? <br> <br>This particular usage of Eurostile is bland, I'll grant you that, but that does not change the fact that Eurostile has a unique feel to it.  One that would be far more appropriate in some instances than any other font, and one that, though it is getting on in years, is still quite relevant aesthetically. <br> <br>I look at Foundry Monoline and see a typeface that imitates what Eurostyle was designed for.  Paralucent has a unique look to it, but again, to me it looks like an imitation. <br> <br>If a 50 year old font works for a specific project, use it.  Just because it is getting on in years does not mean that it is not still useful.  Especially considering that it is impossible to make a font today that does not have a "feeling" of a font from yesterday.  Consider this Paralucent which says it was inspired by Univers Helvetica, fonts just as old as Monostyle. <br> <br>Eurostyle is still a completely valid font despite it's age.  Using it does not mean the person who does so is a lazy or cheap designer.  And when you consider that that logo is for a large corporation, you should take into account the fact that large corporations work through committee.  Chances are the "designer" had barely any say in the final decision anyway.</p>
    html_clean: <p>If that's the case, I trust that you never use any fonts older than, oh, say 10 years? <br> <br>This particular usage of Eurostile is bland, I'll grant you that, but that does not change the fact that Eurostile has a unique feel to it.  One that would be far more appropriate in some instances than any other font, and one that, though it is getting on in years, is still quite relevant aesthetically. <br> <br>I look at Foundry Monoline and see a typeface that imitates what Eurostyle was designed for.  Paralucent has a unique look to it, but again, to me it looks like an imitation. <br> <br>If a 50 year old font works for a specific project, use it.  Just because it is getting on in years does not mean that it is not still useful.  Especially considering that it is impossible to make a font today that does not have a "feeling" of a font from yesterday.  Consider this Paralucent which says it was inspired by Univers Helvetica, fonts just as old as Monostyle. <br> <br>Eurostyle is still a completely valid font despite it's age.  Using it does not mean the person who does so is a lazy or cheap designer.  And when you consider that that logo is for a large corporation, you should take into account the fact that large corporations work through committee.  Chances are the "designer" had barely any say in the final decision anyway.</p>
