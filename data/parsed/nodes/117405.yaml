      <p>This is a 19th century font patented by Herman Ihlenburg on October 6, 1891 and sold by MacKellar, Smiths Jordan, and other foundries as _Columbian_. Digital versions, compiled by the _Solopedia_,  include P22 Victorian Swash <a href="http://www.fonts.com/font/p22/p22-victorian/swash" title="http://www.fonts.com/font/p22/p22-victorian/swash">http://www.fonts.com/font/p22/p22-victorian/swash</a>  and <a href="http://www.myfonts.com/fonts/p22/victorian-gothic/" title="http://www.myfonts.com/fonts/p22/victorian-gothic/">http://www.myfonts.com/fonts/p22/victorian-gothic/</a> Glorietta (Solotype), Trinigan FG (Fontgrube), Goodfellow (Scriptorium), Bluegum Forest (Tris Nguyen, corrected by MEG). Burton'sNightmare (anon).<br>
      Don<br>
      NOTE: corrected post</p>
