      <p>I've often been asked as a prop designer to recreate actual newspaper pages with fictional stories added, so I've had to study newspaper typography quite a bit. Most of the major newspapers I've had to work with have their own customized set of fonts which are made exclusively for in-house use. Typesetters at the Washington Post were very kind to give me access to a set of their in-house fonts for one prop job. They have their own version of Bodoni which they call Postoni. They have Postroman, which looks very like a Cheltenham. They also use Franklin Gothic, Poynter Gothic, Filosofia, Weidemann, Giza, and Didot, plus Helvetica and their own logo font. <br></p>
