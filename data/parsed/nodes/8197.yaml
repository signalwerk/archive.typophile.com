      <p>A really well-designed paper I worked for used Madison for years and it's a gorgeous headline font for display at 100% and it was used for straight headlines at 73% width. I couldn't tell it wasn't a condensed face.</p>
      <p>It's a completely different look, but I designed a Spanish-language newspaper with Stymie and it worked great. Latin American newspapers are very bold and punchy and readers responded very positively to a strong, bold slab serif font.</p>
