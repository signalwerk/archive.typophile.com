  html: <p>I'm interested in font trends among major newspapers, but I'm terrible at identifying fonts. <br> <br>Now that most newspapers have been redesigned to accommodate the narrower paper that they are printed on, what are the most common fonts used for regular headlines as well as regular article text? Are most using a condensed typeface now for regular article text so they can print more on narrower paper?  <br> <br>I saw Ascender Corp recently released a study about this, but the study does not break them down as to which typfaces are most popular for headlines and which ones are most popular for regular article text. <br> <br>USA Today uses Gulliver for both headlines and article text, right? What about the LA Times? What does the Washington Post use?  <br> <br>If you have any insight as to what the most popular typefaces are now for major newspapers, particularly headlines and article text, please share.</p>
  html_clean: <p>I'm interested in font trends among major newspapers, but I'm terrible at identifying fonts. <br> <br>Now that most newspapers have been redesigned to accommodate the narrower paper that they are printed on, what are the most common fonts used for regular headlines as well as regular article text? Are most using a condensed typeface now for regular article text so they can print more on narrower paper?  <br> <br>I saw Ascender Corp recently released a study about this, but the study does not break them down as to which typfaces are most popular for headlines and which ones are most popular for regular article text. <br> <br>USA Today uses Gulliver for both headlines and article text, right? What about the LA Times? What does the Washington Post use?  <br> <br>If you have any insight as to what the most popular typefaces are now for major newspapers, particularly headlines and article text, please share.</p>
