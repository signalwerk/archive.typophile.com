      <p>I know my local paper <em><a class="freelinking external" href="http://www.newseum.org/media/dfp/pdf8/OR_TO.pdf" rel="nofollow">The Oregonian</a></em> uses three main fonts:<br>
      Expressway (Interstate), Minion, and Utopia.<br>
      Expressway Condensed Bold for headings. Bold for captions. Medium or Light for some body text.<br>
      Minion for other headings, sub-headings, and bylines.<br>
      And Utopia for almost all other body text.</p>
      <p>If I recall, I've seen other papers use similar fonts, but I can't name them off the top of my head.</p>
      <p>I hope this helps.</p>
