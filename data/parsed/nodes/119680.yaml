      <p>To me, it has more to do with maintaining the flow of the typeset line than with any historical tradition. </p>
      <p>"Old Style?" "Quaint?" Perhaps. But non-aligning numerals and yes, some ligatures, actually help maintain the visual flow and unity of a line of type, aiding readability. When they are badly or indifferently applied to sans serif typefaces, they can be downright distracting—even awful. But they don't have to be if well and thoughtfully done.</p>
      <p>As for "geometric rationality" being paramount in modern type design—hogwash. That may have been the impetus for people like Paul Renner, Edward Johnston and others creating early geometric sans faces, but we entered the post-modern era of type design long, long ago. </p>
      <p>The Bauhaus is dead, long live the Bauhaus—or any other bygone era these days. </p>
      <p>Given that the first sans serif typeface dates from the first half of the 19th century, not the 20th, what is "historically" appropriate as it pertains to them? If a typeface fulfills both form and function, I'm a fan.</p>
