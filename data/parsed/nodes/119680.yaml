      <p>EDITED:</p>
      <p>Jchthys, some type designers are a bit like some architects—sometimes they just can't help over-designing things. If they like those sorts of ligatures, unfortunately there is little we can do to stop them from including them in their glyph sets—if we don't like them, we don't have to use them.</p>
      <p>Mark, thanks for the link. Bringhurst's The Elements of Typographic Style is approaching the 25-year mark in a few years, and maybe it's time to revisit its "rules"—especially since they date from the early years of digital type design, and are heavily rooted in the conventions of the moveable type and phototypesetting eras.</p>
      <p>I still encounter clients who refuse to let me use non-aligning figures in running text ("What are those weird numbers?"), who balk at combining sans serif and serif faces in a design ("Isn't there a rule against that?"), and who think ligatures are a misprint.</p>
      <p>At least Bringurst gives me some backup on the major issues.</p>
