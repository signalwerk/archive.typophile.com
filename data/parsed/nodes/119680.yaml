    <p>I’m finally reading <em>The Elements of Typographic Style</em>. In §3.2.1, the author says that text figures should always be used outside of full-caps environments.</p>
    <p>To me, this makes complete sense for typeface styles in the eighteenth century and before, as well as for many modern revival typefaces. I was wondering if there is any disagreement with this piece of advice for particular styles of typefaces. I’m thinking of Modern faces (like Didot), some Transitional faces (Baskerville) and especially certain sans faces. It seems wrong to foist the typographic convention of non-lining figures, long-standing as it is, onto modern styles of type for which geometric rationality is paramount.</p>
    <p>(In a similar vein, type designers’ penchant for adding quaint ligatures to sans type seems, well, a bit odd.)</p>
    <p>Has anyone else thought about or discussed this issue?</p>
