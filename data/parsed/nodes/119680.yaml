      <p>I know that classic typewriter typefaces used semi-old style numbers (like Georgia, the numeral 1 was like lining numbers rather than like a small capital I) except that the degree to which the numbers went above or below the line was so small, they were treated like ranging numbers.</p>
      <p>A typeface like Futura, for example, probably would not look bad with oldstyle numerals, since Futura's width proportions, among other things, are similar to those of old style faces rather than modern faces.</p>
      <p>Personally, I'm not a fan of oldstyle numerals, but it's not a question of authenticity for me; they cause the same problems in Garamond, where they are the normal form associated with the typeface, as they would for Times Roman. So if someone prefers oldstyle numerals, I would concede that one the same freedom I want for myself.</p>
