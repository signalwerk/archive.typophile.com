      <blockquote><p>In §3.2.1, the author says that text figures should always be used outside of full-caps environments.</p></blockquote>
      <p>I question most anyone's pronouncements about what should and shouldn't be done when it comes to issues that are largely matters of aesthetics. Text figures have their place, as do lining figures. There might be a few rules of thumb, but hard and fast rules are made to be broken. For me, it's mostly a matter of what seems appropriate when considering the specifics of the situation at hand.</p>
