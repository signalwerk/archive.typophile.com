      <p>Jchthys, my point was that if a designer only adds non-aligning figures and ligatures to a contemporary sans serif typeface because he or she thinks they have to be there—and executes them poorly—the results can be jarring.</p>
      <p>If a designer doesn't want to add them, then he or she shouldn't. </p>
      <p>But unless the lining numerals are exquisitely designed and sized to flow with the rest of the alphabet I'd hesitate to use that particular typeface to set long stretches of body copy. Setting up and applying character styles to all the instances of numbers (to reduce their size slightly so they don't stick out like sore thumbs) in a long text is much more laborious than selecting non-aligning figures. And the results are less visually pleasing, in my opinion.</p>
      <p>And if the letter forms are designed in such a way that the curve of the f never abuts with the dot of the i or another f or an l (just to name one ligature pairing), then they aren't necessary. But if those and other character pairings do crowd one another, then ligatures should be offered—regardless of whether the typeface is a classical revival or Modern with a capital M.</p>
