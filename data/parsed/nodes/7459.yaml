  - id: 50760
    user: 4816
    date: 2004-11-02T00:24:00
    date_raw: 2 Nov 2004 — 12:24am
    votes: null
    html: <p>David, thanks, I was actually going to mention that I was referring to optima occasionally while designing this (though I suppose a traied eye such as your own would pick this at 20 paces). However, I'm not so keen on optima, except in all caps with generous spacing. The Q has been an interesting thing for me; it always takes such a short time for me to make it. Maybe the classical roman proportions with near-monoweight lines make for easy Q's. <br> <br>I've been designing this over quite a short time-period and had previously limited myself to only caps (it's a student project (me being the student (off topic, is it gramatically correct to use brackets within brackets?))). <br> <br>I don't think I have time to add numerals, but perhaps i can work the "It only needs roman numerals" angle. ;) <br> <br>I think I might shift the weighting of the P, B and R's bowls upward a little, they look a little "depressed".</p>
    html_clean: <p>David, thanks, I was actually going to mention that I was referring to optima occasionally while designing this (though I suppose a traied eye such as your own would pick this at 20 paces). However, I'm not so keen on optima, except in all caps with generous spacing. The Q has been an interesting thing for me; it always takes such a short time for me to make it. Maybe the classical roman proportions with near-monoweight lines make for easy Q's. <br> <br>I've been designing this over quite a short time-period and had previously limited myself to only caps (it's a student project (me being the student (off topic, is it gramatically correct to use brackets within brackets?))). <br> <br>I don't think I have time to add numerals, but perhaps i can work the "It only needs roman numerals" angle. ;) <br> <br>I think I might shift the weighting of the P, B and R's bowls upward a little, they look a little "depressed".</p>
