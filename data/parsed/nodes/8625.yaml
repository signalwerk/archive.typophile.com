  html: <p><a href="http://www.myfonts.com/info/millionth-font/">MyFonts Millionth Font Giveaway</a> <br> <br>You may have noticed MyFonts is running a countdown to its 1,000,000th font. This auspicious font is due to be sold in the next day or two! <br> <br>MyFonts originally put up a $500 prize - in the form of a Gift Certificate to spend on ANY FONTS YOU LIKE. <br> <br>Then, Red Rooster added another $500 to spend on their fonts. Canada Type stepped forward to add $200 to spend on any of their fonts. Finally, Ray Larabie decided to throw in the entire Typodermic collection (worth over $950). <br> <br>That's a total prize value of $2,150! Someone is going to win the giveaway soon - it's a matter of days! <br> <br>Please note that there is no time limit in which to redeem the Gift Certificates. <br> <br>The Fine Print <br>* Bitstream Inc. and MyFonts.com, Inc. employees and their family members are ineligible to receive the prize. <br>* Winning order is defined as the first order by an eligible user on or after the 1,000,000th font style sold. Multi-font packages and font CDs count once for each style in the package. <br>* Offer void where prohibited by law.</p>
  html_clean: <p><a href="http://www.myfonts.com/info/millionth-font/" class="link-external">MyFonts Millionth Font Giveaway</a> <br> <br>You may have noticed MyFonts is running a countdown to its 1,000,000th font. This auspicious font is due to be sold in the next day or two! <br> <br>MyFonts originally put up a $500 prize - in the form of a Gift Certificate to spend on ANY FONTS YOU LIKE. <br> <br>Then, Red Rooster added another $500 to spend on their fonts. Canada Type stepped forward to add $200 to spend on any of their fonts. Finally, Ray Larabie decided to throw in the entire Typodermic collection (worth over $950). <br> <br>That's a total prize value of $2,150! Someone is going to win the giveaway soon - it's a matter of days! <br> <br>Please note that there is no time limit in which to redeem the Gift Certificates. <br> <br>The Fine Print <br>* Bitstream Inc. and MyFonts.com, Inc. employees and their family members are ineligible to receive the prize. <br>* Winning order is defined as the first order by an eligible user on or after the 1,000,000th font style sold. Multi-font packages and font CDs count once for each style in the package. <br>* Offer void where prohibited by law.</p>
