      <p>5B would be my choice as it is most memorable and incorporates the house which I believe should be included based on what you said. Wine is a tough market and the orange color in this label with the bold type, I think is most memorable.</p>
      <p>My one big problem is I think you should use a small ’d’ as in ’CdV’ the way it would be written.</p>
      <p>Jay</p>
