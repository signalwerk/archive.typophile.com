    <p>Hi Everyone.</p>
    <p>I would really appreciate your comments on these wine label ideas the type CDV I am working on. This is my first time working on a wine label. It’s lots of fun - and challenging too!!! However, I am having a tough time with the CDV type. Needs help, but at this point I am not sure how to help it. Any ideas?</p>
    <p>Project: Chateau de Vie wine label</p>
    <p>This project I made up because I wanted to help this vineyard, and I thought it would be a good opportunity to get into the wine biz. These guys run a bed and breakfast in Napa, California USA, and they have a vineyard as well. Their BnB is very nice, sophisticated, warm and cozy (kind of like Pottery Barn farmhouse style).</p>
    <p>Here is a description of their CABERNET SAUVIGNON - ’Darkly fruity nose of brandied cherries, bouillon, vanilla and rich forest floor scents with peppery hints in the background. Somewhat fleshy on the palate, where it shows deeply ripe cherry fruit tied to lots of mocha, vanilla, baking spice and toasty flavors.’</p>
    <p>They do a very limited run each year, and are on a modest budget. They charge about $35/40 us dollars per bottle. So, it is not a budget wine or a premium high end wine either.</p>
    <p>I tried to play around with different label shapes, a natural paper label and a colored label. Some with an image of the Chateau (this actual image in layout is FPO) and some without. From one perspective I wanted to use the bottle as a marketing tool for their BnB as well. That is why on some I used an image of the Chateau. However, on some concepts I tried a label without an image of the Chateau.? Some styles lean more toward classic, and some a little more colorful. Currently they use the acronym CDV. This is why I kept some with CDV, but I am wondering if my treatment of CDV is too simple.</p>
    <p>Can you guys tell what you think in general? Label shapes? Type? Color? More?</p>
    <p>I appreciate your help. Thank you!!!! </p><div class="imageWrap"><img src="/files/ChateauDeVie_Label_5743.jpg"></div><p></p>
