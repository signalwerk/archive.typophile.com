    <p>Hi everyone,</p>
    <p>Just wanted recommendations for a body-titling pair for a Renaissance-themed website: they must be licensable as webfonts. Preferably something Venetian.</p>
    <p>I'm currently using Palatino + IM Fell English. Horrible choice, I know.</p>
    <p>For body text, I'm currently looking at Adobe Jenson Pro (Adobe), Requiem (H&amp;FJ; not yet a webfont, but I can wait) and Venetian 301 (Bitstream version of Centaur). Out of these only Jenson Pro renders as well as a system font (eg Palatino). I don't know how the rest will display, but this is very important as well.</p>
    <p>For headings I want something rough like IM Fell English, and it must also have an authentic italic like Fell English. I was thinking GLC Garamond.</p>
    <p>Also: is Garamond an actual Renaissance design?</p>
    <p>Any help would be greatly appreciated!</p>
