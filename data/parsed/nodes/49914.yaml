  html: |-
    <p>I’m finishing up an opentype script font that has many alternates. When I select from the ot palette in adobe illustrator, for instance /r.alt/r.alt/ and then select something different like r.alt02 then instead of getting: /r.alt/r.alt/r.alt02 I get: /r.alt02/r.alt02/r.alt02 so it changes all alts before it. Another way might be /p.end/p.end and the selecting q.swsh instead of /p.end/p.end/q.swsh I get /p.swsh/p.swsh/q.swsh </p>
    <p>I’m guessing that I set up the aalt feature wrong?</p>
    <p>sub r from [r r.alt r.alt02 r.start r.end r.startswsh r.endswsh];</p>
    <p>Is this not correct?  - Jess</p>
