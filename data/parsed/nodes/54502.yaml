    html: |-
      <p>M treatment does look nice, but I think it doesn't play well with this logo because lower case letters tend to be round. Because Ms have cut outs they are even more sharp than normal.</p>
      <p>It's also quite distracting that "al" are stronger/heavier compared to other letters. So the whole logo does look nice to some degree but it should be finished properly.</p>
      <p>Someone else's comment on having upper case letters to represent minimalism does hold water here. I guess.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
