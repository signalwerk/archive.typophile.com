    html: |-
      <p>I like the M treatment a lot. It is unique and relates well to the concept of minimalism.</p>
      <p>However mixing the uppercase M into lowercase text is visually disturbing. When the label is read, the eye first catches the leading M and the "minimal" is perceived as an uppercase text. Then there's a visual break after "L" and a lowercase part starts. Something like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/yadda_3626.png"></div><p></p>
      <p>.<br>
      So the resulting impression is that the text is set in two parts - uppercase and lowercase - which have the same vertical size. This looks strange and not exactly visually pleasing.</p>
