    html: <p>There was a package called the "Microsoft True Type Master Set" that I bought in 1994, with 102 fonts for the Macintosh. Desdemona outline was one of the fonts, with a writeup almost identical (no specific credits were given) to the one in Justin's post.  <br> <br>It is called Quaint Open in the Solotype Catalog (p. 184). The Solotype showing includes some ligatures that were not in the TrueType set, and I don't think they are in the Spiece Graphics version either. <br> <br>In the Dover book "Treasury of Authentic Art Nouveau Alphabets" by Ludwig Petzendorfer, it is shown as the open lettering under the name 'Desdemona' credited to the foundry of "Karl Brendler &amp; S�hne" of Vienna. <br> <br>It was the first typeface I adapted as a font for my Epson FX-80 printer, truly cementing my obsession with type back in 1984.</p>
    html_clean: <p>There was a package called the "Microsoft True Type Master Set" that I bought in 1994, with 102 fonts for the Macintosh. Desdemona outline was one of the fonts, with a writeup almost identical (no specific credits were given) to the one in Justin's post.  <br> <br>It is called Quaint Open in the Solotype Catalog (p. 184). The Solotype showing includes some ligatures that were not in the TrueType set, and I don't think they are in the Spiece Graphics version either. <br> <br>In the Dover book "Treasury of Authentic Art Nouveau Alphabets" by Ludwig Petzendorfer, it is shown as the open lettering under the name 'Desdemona' credited to the foundry of "Karl Brendler &amp; S�hne" of Vienna. <br> <br>It was the first typeface I adapted as a font for my Epson FX-80 printer, truly cementing my obsession with type back in 1984.</p>
