    <p>Hello Typophile,</p>
    <p>I am looking for a little help. I have just started in a new job leading the interface design for a digital publishers. They have asked me to take a look at the brand collateral with a view of updating it all in the near future.</p>
    <p>Currently their logo is lowercase bold Trebuchet, which I find ungainly and a bit ugly.</p>
    <p>I was hoping that I could get some suggestions for typefaces that are sans or humanist, so some character, not too formal, but also not too quirky.</p>
    <p>Any suggestions gratefully received! </p>
    <p>Frank.</p>
