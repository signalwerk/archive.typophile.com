    html: |-
      <p>If we are only speaking of a few letters for the logo - why not outline them in Illustrator and then by hand place them where you want them to be. Save the file, archive it and now you have a logo that will always be the same and that you know your other programs can not match the arrangement of the letters. BTW - If you don't have Illustrator, perhaps you have Photoshop? You can set each letter on an individual layer and move them/overlap them, whatever - till you get what you are looking for.</p>
      <p>Meanwhile, what programs are you working from? Most of us would be working in QuarkXPress or InDesign. But if you are on an IBM or IBM compatible working with some Microsoft program - I understand it is most cruel to the fonts out there... and kerning/letterspacing falls to the wayside.</p>
      <p>Good luck with your project. Hope it turns out well and is appreciated by all.</p>
