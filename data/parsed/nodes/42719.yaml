    <p>I am developing a logo for a project called virgo (lowercase). The font I have selected is Ronda EF regular. I have scowered the web for a logic to kerning and tracking for logo design. I am stuck at the point at which I have customized the logo from Ronda EF regular by thickening the stoke and modifying some letters. Now I need to properly space and kern the letters but I don't know how (not optical kerning). In my defense I have purchased a book on designing type, and have spent hours digging through google, but the results don't give me what I need.</p>
    <p>Can anyone recommend a professional kerning/tracking service provider? I am a novice when it comes to the above mentioned. </p>
    <p>Any logic or assistance would be greatly appreciated as well.</p>
    <p>Best Regards,<br>
    Marvin</p>
