      <p>Victoria, I'm pretty sure that the recent William Caslon Text by William Berkson is a nice contemporary rendition of Caslon:</p>
      <p><a href="http://www.fontbureau.com/fonts/williamscaslontext/" title="http://www.fontbureau.com/fonts/williamscaslontext/">http://www.fontbureau.com/fonts/williamscaslontext/</a></p>
      <p>Another functional choice - and a different interpretation - would be King's Caslon by Daltoon Maag:</p>
      <p><a href="http://www.daltonmaag.com/browse/fonts/dama/kingscaslon" title="http://www.daltonmaag.com/browse/fonts/dama/kingscaslon">http://www.daltonmaag.com/browse/fonts/dama/kingscaslon</a></p>
      <p>Speaking of Baskerville, I'm currently setting a book in Baskerville 1757 and I have to say that it is great:</p>
      <p><a href="http://www.fountaintype.com/typefaces/baskerville-1757/styles" title="http://www.fountaintype.com/typefaces/baskerville-1757/styles">http://www.fountaintype.com/typefaces/baskerville-1757/styles</a></p>
