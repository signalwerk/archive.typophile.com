      <p>I don't think Dutch ever has had distinct forms of K. This could well be embellishment.</p>
      <p>On this map you can find examples traditional long vs. short s, but to my surprise, there is at least one occurrence of a long s at the end of a name -- "Bourneus" near the top. I don't think that was usual.</p>
      <p>Also, it's a French map but the long s/short s in "Lußon" (above "Rochelle") suspiciously looks like a German eszet. It could be a sign of the times, but of course it also might simply be mapmakers' errors :-)</p>
