      <p>I have a much later (1864-1950) finnish map with ball-terminals on italic K's, and I have also thought of it as cyrillic influence. Most of the map is actually made during the years of Russian rule. Another feature that seems like cyrillic influence is the barred tops of A's. Both of these appear in italics and backward slants only, but not in all of them. All the all caps words have conventional forms.</p>
