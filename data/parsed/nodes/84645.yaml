    <p>I am trying to find some pictures to illustrate this, but I was wondering if Dutch (or 1700s Dutch) was like Cyrillic where there are two "capital K's." This seems unlikely, but one K has a serif at the top, where another has a ball terminal. It seems to follow a pattern of using the K ball terminal at the end of a word, but the middle forms have the K. I found several examples.</p>
    <p>These forms are found on maps from the 1500-1700's by Dutch map makers. They are not type, but engravings. Any thoughts? I found these at the Boston Public Library's private map collection. (which is awesome!)</p>
    <p>I am contemplating researching the subject and doing a brief presentation at TypeCon on 1500-1700 Dutch map making. Some history, methods, and the players involved. Any interest in that?</p>
    <p>Image: <a href="http://twitpic.com/677uzc#" title="http://twitpic.com/677uzc#">http://twitpic.com/677uzc#</a></p>
