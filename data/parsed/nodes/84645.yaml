    html: |-
      <p>@Theunis de Jong:<br>
      <cite>Also, it's a French map but the long s/short s in "Lußon" (above "Rochelle") suspiciously looks like a German eszet.</cite></p>
      <p>Nothing suspicious about that at all. That's the normal way doubled s was handled when long s was used, whether one was printing English or Latin. The German eszet today is just a vestige of the fact that German printing retained the long s longer than anyone else's printing, since the long s was part of Fraktur; so Germans were so used to the appearance of a double s that they retained the eszet even when they discarded the long s upon moving to Roman typefaces.</p>
