      <p>It's natural for hand lettering to show deviations from the norm.<br>
      These may be haphazard, or evolve into a personal style.<br>
      Such styles can become infectious, and at some point a typeface may succumb to the variant, either as default, or in some cases as an optional sort. That was very rare pre-digital, but now, if you're a type designer and can't make up your mind whether your typeface should have a one- or two-storey "a", no worries, just include both, thanks to OpenType stylistic sets.</p>
      <p>A different implementation, perhaps in the spirit of the old map: when I upgraded Fontesque with a pesudo random feature, the extra "K" was indeed Cyrillic-style.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/KICK_5371.png"></div><br>
      The capitals already have several ball-ish terminals, e.g. in "C" and "G", and I'm pretty sure the fact that I had recently designed a Cyrillic with balled K (Scotch Modern) led me to implement this form.<p></p>
      <p>As an aside, Archer's employment of balled terminals in C, G and S does not extend to the K.<br>
      I suspect there are some lesser-known types available that have balled terminals in the caps, including K.<br>
      Anyone?</p>
