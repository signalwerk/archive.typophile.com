      <p><em>There are plenty of NON-subjective aspects</em></p>
      <p>There are some, but I wouldn't include most of your list.<br>
      Take hinting for instance. Not every font needs hinting, and some fonts are impossible to hint. So at some point there are grey areas where certain fonts may or may not benefit from hinting, and subjectivity comes into play in appraising them. </p>
      <p>There are different philosophies of hinting. IMO, an alignment-zone hinted font makes a mockery of overshoots, because even at quite large screen sizes, you get the "v" and "w" stretched to the full height of the "o".</p>
      <p>Same issue with kerning. Too much can be worse than none.</p>
