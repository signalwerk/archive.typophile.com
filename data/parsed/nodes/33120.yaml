    <p>It wasn't too long ago that MyFonts announced its one millionth font sale (licence sales, really).<br>
    Now they just hit three million.<br>
    They've been a Shinntype distributor for six years, taking over when Makambo dropped out.</p>
    <p>So thanks, MyFonts, for making it financially viable for me to be a full-time* type designer, and also on behalf of the booming "indie" font business sector which you have, in large part, created.</p>
    <p>*by that I mean I no longer work as an art director/graphic designer -- I wish that I could spend more time on type, but running a small business, marketing, production, etc., takes up a fair amount of time.</p>
