      <p>"To Market, to Market..."</p>
      <p>If you go to a major grocery chain (Safeway, et al), you get their take on the food you can choose from. If you go to a farmers market, you get many more takes on food choices. The big guys advertise big and have the committees to make decisions. Committees can reduce the chances of bad stuff going out but reduce the chances of innovative stuff going out as well. Sometimes you feel like a nut, sometimes you don't.  When you want to play it safe, shop at safeway. When you are looking for something that pushes the envelope more, you might try farming the marketplace. MyFonts just gives the buyer options and the seller opportunities. When you buy a font, wherever, you look at it and decide one way or the other. It is your choice.</p>
      <p>If there are to be ratings, then they should be unbiased and across the board. I mean big foundries get their stuff rated too, not just the little guys. Who is going to pay for these ratings and manage the database, and insure unbiased ratings? We have Miss America Pageants, Best Dressed surveys, Academy Awards, People Magazine popularity contests. Is this really helping? The marketplace speaks. If people want to buy Wonderbread from Safeway or Mom's Organic 7 Grain Bread from a farmers market, that is their choice. Your results may vary but your choice should still be yours.</p>
      <p>ChrisL</p>
