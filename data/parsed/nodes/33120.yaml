    html: |-
      <p>Sometimes I find it very difficult to figure the average typophile here out. I'm not speaking of the professionals who have a broader understanding of where type use to be, where it is today and where we see it going in the future.</p>
      <p>I joined in again with Typophile due to a dafont.com thread. I knew that the majority of people had no understanding of the true inner working of dafont, and that was a shame.</p>
      <p>Today, some of you feel you must pick on What the Font? Give me a break. I've been with them for years. Yes, they sell fonts - yes of all sorts. I guess you all mean that foundries like Monotype, Emigre, Adobe, Berthold, etc. are rubbish?</p>
      <p>Yes, WTF has given breaks to type designers, so they have an outlet to "sell" their fonts - rather than place them out there somewhere on the web. Is that so terrible giving inspiration to the new kid on the block. Where will the future designers come from if they are not allowed a decent break. Type, some of you forget, is ART. And not all art is loved and apprecialed by the masses. </p>
      <p>As a professional typographer, I lived through grunge type and graffiti type - let's really talk rubbish. It is horrible to realize the training of clarity and easy readiblity for customers products and then be given a grunge type selection for -- body copy. I'm sorry, it's against every moral fibre I have.</p>
      <p>So, are you upset that there is a capitalist world out there? That someone is offering a site that you can buy, for immediate gratification, a font? Are you upset that before you buy that font you can 1) have people (like myself) identify a face you might like to own; 2) Test the font on line to see what it reallly looks like and 3) buy it for immediate use?</p>
      <p>One thing WTF does is help the type industry thrive. No one gives any fonts away. When someone wants a "freebie" they are told where to go -- and I don't mean online to get it.</p>
      <p>Many of the type IDs are impersonal -wham bang - here's the font. Some become very personal like a year ago when Graham Meade showed up. Here is a very talented person, who has away of putting letters together for fonts. He took his time to redesign Koster (because it wasn't available) -- Yes, WTF put it on line -- and for all his work - six separate fonts -- you can buy it ALL for $6. Graham was ecstatic but there is something here for you to truly understand. The fonts on WTF are not all priced the same. Many are exactly what the manufacturer has selected. Every Letraset font there is the 39.99 that Letraset wanted it to be.</p>
      <p>For those of you that praise WTF, I am sure they thank you. For those of you who have written negative things about WTF - well, you do have this site and others. Enjoy them.</p>
