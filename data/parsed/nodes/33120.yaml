      <p>I was going to voice my massive respect for the royalty arrangement that MyFonts has maintained.  It's a give and take situation to have your work adrift in a sea of what some may consider rubbish, but I think the self-promoters out there leverage the situation to their clear advantage.</p>
      <p>I'm also very happy to see the focused attention to the personality of the folks MyFonts is supporting.  I read the interviews in the eBlasts.  It's always encouraging to hear fellow type designers talk about their experience in the business.</p>
      <p>Set style bias aside and you'll see that MyFonts is a worthy model for a major percent of the font-buying public.  It works and is continuing to work!</p>
