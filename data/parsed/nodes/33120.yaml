      <p>But Paul, how are you going to describe the hinting in a family which has a mix of hints, for vertical, horizontal, and alignment zones, which vary with weight? Font by font, with three check-boxes?</p>
      <p>Just saying "this font has hinting" is not a measure of quality, because people will be more inclined to believe that's good, when in fact the opposite might be true.</p>
      <p>Here's what I mean about how hinting destroys overshoot, on my Mac monitor.<br>
      The top font is Lucida Grande -- the Apple system font -- the bottom is Myriad, both of which have alignment zone hinting. The middle is one of mine, where there is no alignment zone hinting, and I did that because I don't like the effect you get in the hinted faces where the "e" is dwarfed by the "v" and "r" on either side. </p>
      <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20141112054518im_/http://typophile.com/files/hint_6740.jpg"></div><p></p>
