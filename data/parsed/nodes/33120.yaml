      <p>Increasingly, now, you can also get Mom's Organic Bread at a Safeway or a Walmart. And often cheaper. And that's causing a problem for the smaller retailers when the big box stores go in.</p>
      <p>But maybe the question is, who is Myfonts hurting? Is it hurting the independent foundry the way Barnes and Noble has hurt the independent bookseller? Does it undercut their prices? If not, then I can't see who suffers by their having such a vast selection. Shopping online is - more or less - the same wherever you shop. Fonts don't strike me as something you buy in bulk, more likely one here, one there for a particular job, so the fact that they have such a large collection shouldn't matter.</p>
      <p>And it might help the independent foundries to have their fonts in Myfonts's catalog and thus in their keyword search or WhatTheFont, in order to draw the less-educated font buyers to the smaller foundries. As long as they get their royalty...</p>
