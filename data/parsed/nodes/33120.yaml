      <p>Myself living in Berlin, I greatly value and appreciate flea markets and generally open-sky markets. Sometimes, I do think that MyFonts is that kind of a market square rather than a professionally-sorted department store. On the market square, there is usually a load of people selling plastic pens that will break before the next refill and cheap sport shoes that will fall apart next month. The fruit or the fish there is not shrink-wrapped, but is often fresher than in the department store and is preservative-free. And you're actually able to buy authentic Chanel as well as the knockoff copy. </p>
      <p>The owner of the market square does provide security, and makes sure that the merchants don't cheat. He sorts out the black sheep but does not interfere with their product offerings in other ways. </p>
      <p>Among the buyers at a market square, you'll find the hobos, the seniors and the workers as well as the dandys and the intellectuals. At a department store, you'll more likely to only find the latter, who know how to dress up. </p>
      <p>In the weak moments of pathetic self-appreciation, I like thinking of myself as an intellectual. So I do my shopping both at department stores and at market squares. There are people who'll only pick the former and those who only choose the latter. And I think it is just fine the way it is. </p>
      <p>Best,<br>
      Adam</p>
