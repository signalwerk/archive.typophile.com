      <p>Thomas I tend to agree with you re type quality as a function of the mechanics of font creation, "incomplete character sets, bad hinting, inconsistent stem weights, inconsistent spacing, lack of kerning, not understanding overshoots, not understanding that verticals need to be heavier than horizontals to look the same thickness, not understanding strokes needing to thin where a curve attaches to a stem…. Getting all that stuff right doesn’t make a great font, but getting it all wrong certainly makes a bad one."<br>
      I do think however that most purchasers of fonts these days can discern those faults easily, although I try to include pdf files in my own stuff so customers can more closely examine the things you talk about. As for the specifics of the mechanical stuff, I think everyone in the type "craft" business is very much interested to a greater or lesser degree in creating work which meets or certainly exceeds the demands of quality. And yes it can and probably does take years to fully understand the importance of the many nuances of type design. I'm one of these older dudes and I've been learning for many years and will continue to do so until, you know, that day . . .</p>
