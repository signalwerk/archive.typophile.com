      <p>PattyFab wrote: <cite>Fonts are too subjective for a ratings system.</cite></p>
      <p>I only have several problems with that statement:</p>
      <p>1) Plenty of things that are much more subjective than fonts get rated in this world (think IMDB).</p>
      <p>2) Fonts are not art, they are a craft - and there *is* such a thing as better or worse craftsmanship. (In my mind, "craft" combines elements of art and science. Architecture is a craft, too.)</p>
      <p>There are plenty of NON-subjective aspects to what typically makes a font crud: incomplete character sets, bad hinting, inconsistent stem weights, inconsistent spacing, lack of kerning, not understanding overshoots, not understanding that verticals need to be heavier than horizontals to look the same thickness, not understanding strokes needing to thin where a curve attaches to a stem.... Getting all that stuff right doesn't make a great font, but getting it all wrong certainly makes a bad one.</p>
      <p>Personally, I'm glad MyFonts exists and that there are outlets for fonts of a wide range of both quality and pricing (which are not synonymous, of course).</p>
      <p>Cheers,</p>
      <p>T</p>
