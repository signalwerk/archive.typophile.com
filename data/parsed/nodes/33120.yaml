      <p>To Nick and everyone else: the thanks goes to you!</p>
      <p>About a year ago, I voiced some of my opinions on the downfalls and successes of MyFonts in the <a href="https://web.archive.org/web/20141112054518/http://www.nicksherman.com/degreeproject/" target="_blank" rel="nofollow">synopsis</a> of my senior degree project in Graphic Design from MassArt.</p>
      <p>Since then I have been hired by MyFonts to deal with some of these issues (as well as a whole bunch of other ones).</p>
      <p>With all that said, I must admit there are still plenty of aspects of the site which still have plenty of room for improvement, and I am excited to be working on these kinds of things.</p>
      <p>Muzzer, I have to agree with you that there are many fonts on MyFonts that I personally don't consider among my favorites. Ironically, the fact that these fonts get a chance to be seen is one of the things I love about MyFonts. As strongly as I may feel about a font, one way or the other, I would be uncomfortable if the choice to exclude bad fonts were left to a select few. As of now we've used font sales as a rating system of sorts, but I must admit that I like the idea of a dedicated, visible, public system.</p>
      <p>Indeed, this democratic approach to font sales often reveals many diamonds in the rough and enables amazing independent designers like Nick Shinn to do what they love. I can't express how happy I am to be able to help with something like that!!!</p>
      <p>Also, I must say that MyFonts is definitely not sucking up all the cash. In fact, as far as I know, we give a higher percentage (65%) of each sale to the foundry than any other site (anyone, please correct me if I'm wrong).</p>
      <p>Please don't consider this rebuttal a call to end any negative comments about MyFonts though! On the contrary, it is very helpful to hear what is not working as much as it is to hear what is. Many of the things mentioned above have already been considered by the MyFonts team, and might even be in the process of being worked on as we speak; but all the same, I'm sure there must be things we haven't thought of.</p>
      <p>With that in mind, please keep the comments coming, good or bad! Just know that it is much more helpful for us when criticism is accompanied by specifics or suggestions.</p>
      <p>Thank you all!</p>
    html_clean: |-
