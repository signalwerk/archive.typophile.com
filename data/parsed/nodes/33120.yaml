      <p>It's impossible to speak without bias, but I'll try to take off my <a href="/web/20141112054518/http://typophile.com/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> hat for a moment and don my <a href="/web/20141112054518/http://typophile.com/wiki/Typographica" class="freelinking" rel="nofollow">Typographica</a> visor.</p>
      <p>In his endearing Aussie way, muzzer speaks the untarnished truth about quality. Still, <a href="/web/20141112054518/http://typophile.com/wiki/MyFonts" class="freelinking" rel="nofollow">MyFonts</a> has a generally positive influence on the industry. It offers a reliable web shop for those who are new to type design and want to test the market. There was never an easier way to release a commercial typeface to the world than through MyFonts.com.</p>
      <p>Resellers like FontShop have a different role to play with their foundry selection process, worldwide print marketing, and telephone support. They appeal to a different kind of market as well.</p>
      <p>Then there is exclusive self-release, which has been successful for some. Or even releasing exclusively through one reseller who will offer additional promotion in return. <a href="/web/20141112054518/http://typophile.com/wiki/Veer" class="freelinking" rel="nofollow">Veer</a> has become famous for this and FontShop offers the option as well.</p>
      <p>There is room for all these approaches, and each foundry might benefit more from one strategy than others. So, in critiquing any reseller (well, these specifically), it's easy to lob insults and defenses (I've done it too), but it's more productive to consider what is best for each foundry/designer in question.</p>
    html_clean: |-
      <p>It's impossible to speak without bias, but I'll try to take off my <a href="/web/20141112054518/http://typophile.com/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a> hat for a moment and don my <a href="/web/20141112054518/http://typophile.com/wiki/Typographica" class="freelinking" rel="nofollow">Typographica</a> visor.</p>
      <p>In his endearing Aussie way, muzzer speaks the untarnished truth about quality. Still, <a href="/web/20141112054518/http://typophile.com/wiki/MyFonts" class="freelinking" rel="nofollow">MyFonts</a> has a generally positive influence on the industry. It offers a reliable web shop for those who are new to type design and want to test the market. There was never an easier way to release a commercial typeface to the world than through MyFonts.com.</p>
      <p>Resellers like FontShop have a different role to play with their foundry selection process, worldwide print marketing, and telephone support. They appeal to a different kind of market as well.</p>
      <p>Then there is exclusive self-release, which has been successful for some. Or even releasing exclusively through one reseller who will offer additional promotion in return. <a href="/web/20141112054518/http://typophile.com/wiki/Veer" class="freelinking" rel="nofollow">Veer</a> has become famous for this and FontShop offers the option as well.</p>
      <p>There is room for all these approaches, and each foundry might benefit more from one strategy than others. So, in critiquing any reseller (well, these specifically), it's easy to lob insults and defenses (I've done it too), but it's more productive to consider what is best for each foundry/designer in question.</p>
