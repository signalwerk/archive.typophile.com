    <p>Hi Team!</p>
    <p>I would really appreciate your advice. My client is looking for a body copy face that  that gives a sense of being 'carved' on the page. She's looking for a sense of ancient.</p>
    <p>Further, she described it as kind of industrial, elegant...not a warm, personal, intimate feeling,  but more industrial, with a sense of iron...but not too austere...</p>
    <p>For chapter headers she's liking Goudy Trajan, but personally, I think its tired so we're looking for a replacement for that as well. </p>
    <p>The book contains poetry, so for the most part, the text will not be dense on the page.</p>
    <p>Here's her current choice, of which I was no part. Any ideas?</p>
    <p>Thank you! </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/photo_3817.JPG"></div><p></p>
