      <p>Very subjective criteria for the body text. I hesitate make suggestions based on them and I trust you are familiar with the common candidates. A less known prospect might be Aragon by Canada Type <a href="http://www.myfonts.com/fonts/canadatype/aragon/" title="http://www.myfonts.com/fonts/canadatype/aragon/">http://www.myfonts.com/fonts/canadatype/aragon/</a> Or you might browse through some of the suggestions recently posted in the long running thread Best Serif Ever <a href="http://typophile.com/node/27736" title="http://typophile.com/node/27736">http://typophile.com/node/27736</a><br>
      As for the Trajan replacement, one possibility that I like is Centaur, an elegant font with a sculptural feeling<br>
      <a href="http://www.myfonts.com/fonts/mti/centaur/" title="http://www.myfonts.com/fonts/mti/centaur/">http://www.myfonts.com/fonts/mti/centaur/</a><br>
      Don</p>
