  html: |-
    <p>Hey Typophiles,</p>
    <p>I really love <a href="http://www.dardenstudio.com/typefaces/freight_text" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Freight Text and Display</a>, but for some reason (a competitor is using it) I would like to find an alternative. I'm looking for the same fresh angular feel, and same versatility (lots of different weights, small caps, etc.).</p>
    <p>I'm thinking Guardian Egyptian, Stag Serif, etc.<br>
    Any other suggestions?</p>
    <p>By the way, it'll be used in a new literary magazine.</p>
    <p>Thanks so much!</p>
