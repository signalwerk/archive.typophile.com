    html: "<p><i>But are you saying this was an accident? </i> <br> <br>No, I'm saying that it was a war crime, perpetrated by the Phalangist militia, which Ariel Sharon, as Israeli Defence Minister in command of IDF forces controlling West Beirut, had a duty to prevent. If you read the report of the <a href=\"http://www.us-israel.org/jsource/History/kahan.html\">Kahan Commission</a> on the massacres at Sabra and Shatila, I think you will get a good impression of that lack of care to which I referred above. Sharon allowed the massacres to happen because he did not care enough about the Palestinians in the camps to consider their safety in permitting the revenge-hungry Phalangists into the camps. As the commission wrote in its final report: <br> <br><i>It is our view that responsibility is to be imputed to the Minister of Defense for having disregarded the danger of acts of vengeance and bloodshed by the Phalangists against the population of the refugee camps, and having failed to take this danger into account when he decided to have the Phalangists enter the camps. In addition, responsibility is to be imputed to the Minister of Defense for not ordering appropriate measures for preventing or reducing the danger of massacre as a condition for the Phalangists' entry into the camps. These blunders constitute the non-fulfillment of a duty with which the Defense Minister was charged.</i> <br> <br>I certainly think the Phalangist militia had genocidal intent, and that as the competent controlling military force in West Beirut at the time, the Israelis had a responsibility to be aware of that intent and to prevent it from being acted on. Their failure does not imply that they shared that genocidal intent, only that they did not do their duty. The Kahan Commission, in insisting that 'indirect responsibility' be considered, makes the case based on the Jews' own experience as victims of massacres and atrocities: <br> <br><i>The Jewish public's stand has always been that the responsibility for such deeds falls not only on those who rioted and committed the atrocities, but also on those who were responsible for safety and public order, who could have prevented the disturbances and did not fulfill their obligations in this respect.</i></p>"
