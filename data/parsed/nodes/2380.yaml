    html: "<p>What I focus on in the UN definition is the phrase 'intent to destroy'. That really is a very powerful phrase, and it is the reason I do not (yet? hopefully never) accept the accusation of genocide against Israel. I am not convinced that the 'intent to destroy' is there, so while I am willing to acknowledge and condemn the very great crimes committed by the Israeli government, army and settlers against Palestinians, I don't think this term is appropriate. The sin of many members of the Israeli government is that they do not care about the Palestinians: they do not care whether they live or die and so hold their lives cheaply. This is a very bad thing. But genocide requires this 'intent to destroy': it is not lack of care, but an obsession. Apart from anything else, actual genocidal intent would seem to make any hope of peace or justice impossible. I really don't want to draw that conclusion. <br> <br>Regarding Sabra and Shatila, yes this is why I call Ariel Sharon a war criminal. He should be tried and punished for allowing the Phalangist militia into the camps to commit the massacre. But what happened at Sabra and Shatila was not Israeli government policy, was not sanctioned by the Israeli state, is not permitted by Israeli law, does not indicate systemic, institutional genocidal intent. It is worth noting that it was an Israeli commission that found Sharon responsible, and that forced him to resign as Defence Minister. I agree that they should have put him on trial, in the interests of seeing full justice done, and should certainly not have allowed him to run for office as Prime Minister. <br> <br>Addendum This is worth reading in full: http://www.us-israel.org/jsource/History/kahan.html</p>"
