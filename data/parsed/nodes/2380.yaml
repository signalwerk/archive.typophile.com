    html: <p>Israel never had West Beirut - altough they certainly rained down their bombs in what we call "'ashwaa'i" style*. They did have the major East-West crossings for a short while, as well as the southern suburbs near the airport. But they lasted about as long as the US... "We put the 'e' in Marine Corpse", as some Beirutis morbidly liked to point out. <br> <br>* Meaning "kicking randomly like an enraged donkey" in Arabic. <br> <br>However, Israel was physically at the gates of the Palestinian refugee camps on that day, and gave an explicit OK to the Chrisitians to go in and carry out the pogroms*. Israel wasn't merely "resposible to prevent it", it was complicit in it, somewhat similar to the way the US is complicit in the oppression of the Palestinians by donating military equipment to Israel. <br> <br>* To avenge the assasination of Basheer Jmayyel - although it was never clear who did that - it could have been Israel in fact, since Israel is probably responsible for about 50% of the ~250 car bombs that went off during those 17 years. The other 50% was divided among a dozen or so parties. <br> <br>hhp <br></p>
