    html: <p>Gerald, you quote an <i>interpretation</i> of the Zohar and <i>extrapolation</i> from that interpretation by some nut at Hamodia -- an interpretation that is completely at odds with mainstream Jewish thought -- and then point to the fact that this venerable text is available on Amazon as evidence that this wacky interpretation is somehow widespread. It is not. Cease your worry. <br> <br>Why don't you order the Zohar from Amazon, and read it? You won't find anything in it about gentiles being non-human. The Zohar is one of the kabbalistic texts, a mystical meditation on scripture derived from the numeric and combinatorial values of Hebrew letters. Even if you do find something in it that offends you, the Zohar is not a scriptural text (unlike the Torah), it is not central to Judaism (unlike the Mishnah and Talmud), and represents a sub-culture of diaspora Judaism. <br> <br> <br>I am not a 'constant apologist' or 'white washing' anything. I've left off this discussion several times, and only keep coming back because you say new things that are stupid and offensive. Yes, there is a thin edge of a wedge, which is why I object whenever you say things that seem to me <i>clearly</i> antisemitic. <br> <br>By the way, if you do a web search on a single sentence in that Hamodia quote, the <i>only</i> website that comes up is the antisemitic drivel at <a href="http://www.jewishtribalreview.org/thisweek.htm" target="_blank">http://www.jewishtribalreview.org/thisweek.htm</a>, so I think I can be forgiven for wondering where <i>you</i> got it from. Where did you get it from? <br> <br>And stop insulting me. You have not demonstrated enough comprehension skills to be guessing what I think about killing, racism or discrimination.</p>
