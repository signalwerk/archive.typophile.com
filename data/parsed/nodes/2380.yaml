ry to keep them as a thorn in Israel's side, and people spouting antisemitic hatred on the Internet to question the very basis for the existence of Israel. In all of this, only one thing is perfectly clear to me: the reasons for the existence of Israel are as valid today as they were when the concentration camps were liberated.</p>"
