    html: "<p><i>The ultra-orthodox are a very small minority, regarded by Israelis generally as nuts.</i> <br> <br>Indeed, not only that but some of them are regarded as far from orthodox in anything but name. Gerald's quote from Hamodia includes the sentence 'The sacred book Zohar has taught us that Israel is linked to rationalism.' I believe many Jews would question the application of the adjective 'sacred' to the Zohar, except insofar as it is a book that concerns itself with sacred things. The Zohar is certainly not scriptural: it is a Kabbalistic text, and Kabbalism is a post-diaspora adjunct to Judaism, culturally and intellectually important but not central or even necessary to the Jewish religion. And of course, you shouldn't assume that Hamodia's interpretation of the Zohar in any way reflects mainstream Jewish thought. <br> <br>By the way, Gerald, where did you find that quote? Perhaps it was at this <a href=\"http://www.jewishtribalreview.org/thisweek.htm\">flagrantly antisemitic website</a>? If that is the source of your opinions, then you are seriously lacking in discrimination. About the only thing missing from that catalogue of hatred is the accusation of ritual human sacrifice and the making of matza balls from the blood of gentile children, but perhaps I wasn't reading closely enough.</p>"
