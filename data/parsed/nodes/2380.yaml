    html: "<p><i>It shows that the Arabs are big hearted and wish to Kiss and Make Up. </i> <br> <br>Er, no, it shows that they're really spooked about the Fence, and with good reason. Attacks within Israel have been Arafat's biggest bargaining chip: they brought the weary Israelis to the negotiating table at Oslo to offer land in return for peace. Arafat promised peace, but never delivered, and the Israelis didn't deliver the land -- because neither side trusts the other --, so there has been a violent stalemate for the past two years. The Fence changes the whole equation, because if Palestinian militants can't launch attacks within Israel anymore, then Arafat has nothing left to negotiate with. The Palestinian Authority is justifiably worried, and the idea of 'pushing for a one-state solution' just shows how desperate they are. On what basis are they going to push? Blowing up civilians in Israel is the only card in their hand, the offer of peace their only negotiating tool. If Israel makes it impossible for Palestinian militants to operate within Israel, Arafat will be left sitting outside the fence with a lot of angry Hamas members on his hands, probably wishing that he'd cracked down on them like he promised to do at the Oslo peace talks. <br> <br>And I write this in full sympathy for the ordinary Palestinian people who, once again, will be the victims of both Israeli policy <i>and their own corrupt and strategically-blind leadership.</i></p>"
