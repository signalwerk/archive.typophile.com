    html: "<p>Gerald, are you trying to drown me in the quantity of your messages? Too much! <br> <br>My point about Gandhi is that pacifism and peaceful action do not automatically result in peace. Of course Gandhi is not to blame for what happened in India after independence, but his desire for peace didn't obtain peace. Peace doesn't proceed from wishful thinking. Peace requires a solid political and territorial settlement that protects both parties and within which trust can develop, differences can be realistically resolved by negotiation, and mutual dependence and prosperity build a new relationship. The post-WWII peace between France and Germany is a good example of how to build a solid, lasting peace. <br> <br>Is this even remotely possible in the Middle East? I don't know: it is all very depressing. There is so little trust -- and, frankly, little reason for trust -- on either side. Both the Israelis and the Palestinian Authority, not to mention the Arab states, grab for every advantage they can, each convinced that if they don't someone else will.</p>"
    html_clean: "<p>Gerald, are you trying to drown me in the quantity of your messages? Too much! <br> <br>My point about Gandhi is that pacifism and peaceful action do not automatically result in peace. Of course Gandhi is not to blame for what happened in India after independence, but his desire for peace didn't obtain peace. Peace doesn't proceed from wishful thinking. Peace requires a solid political and territorial settlement that protects both parties and within which trust can develop, differences can be realistically resolved by negotiation, and mutual dependence and prosperity build a new relationship. The post-WWII peace between France and Germany is a good example of how to build a solid, lasting peace. <br> <br>Is this even remotely possible in the Middle East? I don't know: it is all very depressing. There is so little trust -- and, frankly, little reason for trust -- on either side. Both the Israelis and the Palestinian Authority, not to mention the Arab states, grab for every advantage they can, each convinced that if they don't someone else will.</p>"
