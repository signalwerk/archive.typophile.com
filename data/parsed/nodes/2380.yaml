    html: "<p>Hrant, I'm not ignoring the other real or potential functions of the Fence: I was looking at the Fence in terms of its impact on the strategy of the Palestinian Authority. <br> <br> <br>Gerald, Arafat's authority is widely recognised as corrupt by Palestinian political commentators. New political organisations have formed specifically to challenge Arafat and his cronies on anti-corruption platforms. As for the Nobel Peace prize, Arafat was given the peace prize for saying that he would put an end to terrorist attacks and commit to a peaceful solution: but he has not actually done these things. <br> <br>I have nothing to say about Hamodia. As noted earlier in this discussion, there are fanatical extremists on both sides. What you quote from Hamodia to back up your comments about 'the profound Ethnoism and Religious Discrimination of the Jewish peoples' are not opinions held by any Jews who I know. <br> <br>The Jews are peoples (several ethnicities, multiple cultures, numerous languages) with a religion, and they look after each other because they've noted, over the centuries, that very few other people want to look after them. And now they have a country to which any Jew can go and be free from persecution by non-Jews. That was the whole idea behind the UN creation of Israel back in 1948, remember? And if the Arabs had accepted the UN partition then, the Palestinians would have had their own state for the past 55 years -- one very much larger than anything they can seriously hope to gain now --, and Jews and Arabs could have spent half a century building mutual prosperity instead of killing each other. Instead, we have Hamas militants dedicated to turning all of Israel into an Islamist theocracy, a corrupt secular Palestinian Authority that is either unwilling or incapable of implementing what it promises at the negotiating table, a self-professed war criminal running Israel, Arab states that maintain their Palestinian brothers and sisters in misery to keep them as a thorn in Israel's side, and people spouting antisemitic hatred on the Internet to question the very basis for the existence of Israel. In all of this, only one thing is perfectly clear to me: the reasons for the existence of Israel are as valid today as they were when the concentration camps were liberated.</p>"
