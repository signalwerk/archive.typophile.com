    html: "<p>John, <br> <br>You say the <i>Zohar</i> is <i>culturally and intellectually important</i>. If that is the case I have become even more worried. <br> <br>Contrary to your indications the <i>Zohar</i> enjoys much more respect than you deny. Or why would you find the <i>Zohar</i> here? <br><a href=\"http://www.amazon.com/exec/obidos/ASIN/0805210342/inktomi-bkasin-20/ref%3Dnosim/104-9237214-0994352\" target=\"_blank\">http://www.amazon.com/exec/obidos/ASIN/0805210342/inktomi-bkasin-20/ref%3Dnosim/104-9237214-0994352</a> <br> <br>More importantly, find the <i>Zohar</i> here. <br><a href=\"http://www.kabbalah.com/k/index.php/\" target=\"_blank\">http://www.kabbalah.com/k/index.php/</a> <br> <br>How could you compare the Kabbalah Centre to something as vile as this. <br><a href=\"http://www.jewishtribalreview.org/thisweek.htm\" target=\"_blank\">http://www.jewishtribalreview.org/thisweek.htm</a> <br> <br>Shame on you John. <br> <br>Your reading materials are clearly written by \"white sheet supremist\".  Maybe if you stayed away from sites like that you would not write material like this. <br> <br>John writes: <i>When much of the world's media was swallowing the lie that Israeli troops had deliberately massacered civilians in Jenin (a lie that still gets repeated, despite even the report of Palestinian doctors in Jenin that the massacre never took place), the Palestinian Authority was declaring a military victory in Jenin because 15 Israeli soldiers had been killed in the battle.</i> <br> <br>Johnnie want a cracker? You are parroting this critter. <br><a href=\"http://www.adl.org/Learn/Ext_US/zundel_up.asp\" target=\"_blank\">http://www.adl.org/Learn/Ext_US/zundel_up.asp</a> <br> <br>But in summary John, the <i>Zohar</i> is an important Jewish text. Especially by your excuse, <i>'culturally and intellectually important',</i> indicating the <i>Zohar</i>  is \"subliminally embodied in spirit.\" This has me gravely concerned. Perhaps William would be kind enough to put my mind to rest. I do not wish to believe this writing resembles anything in the <i>Zohar</i>. Because if it does, even vaguely, I must say that it is most disgusting. <br> <br>Be kind and assure my worried soul there is no truth, whatsoever, to what is indicated in the quote below. <br> <br><i>The sacred book Zohar has taught us that Israel is linked to rationalism.* Thus, the great distance between the Jew and the Gentile is such that it can only be compared to the distance between animals and humans. Rabbi Loew Yehuda of Prague has spoken at length of this fundamental difference in his Lord of Israel, in Chapter 14, where he indicates that the great difference between the Jew and the Gentile is such that it can only be compared to the distance between animals and humans. Our rabbis have also said, You are humans; Gentiles are not humans.</i>  <br> <br>And John, your constant <i>apologist positioning</i> makes me uncomfortable particularly with this issue. I get the feeling you are, pardon the pun, <i>\"white\" washing</i> and resorting to smear tactics in your defence of these disturbing findings. <br> <br>Disturbingly also that I find the two of us miles apart on the issue of <i>\"killing\"</i> which is clearly an infraction of the ten commandments. You do know that I assume. Now I find you on a similar \"thin edge of the wedge\" when it comes to racism, ethnoism, and religious discrimination. <br>-------------- <br> <br><b>THE SILENT ASSUMPTION</b> <br> <br></p>"
