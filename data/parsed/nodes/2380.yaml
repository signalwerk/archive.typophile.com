    html: <p>Gerald, the UN says that the inhabitants of illegally occupied territories have a right to defend themselves and to resist occupation. I don't have a problem with that. I do not think, however, that blowing up busloads of children, or civilians standing in line at nightclubs, going to the market or in eating restaurants constitutes either defence or legitimate resistance. These are acts of aggression, and we should also pay attention to the stated aims of the people carrying out these attacks. Hamas, for instance, is dedicated to the destruction of Israel, not to an independent, parallel Palestinian state or to resistance in the occupied territories. When Palestinian militants shoot at IDF troops in Nablus, Jenin, etc., that too is tragic -- not least for the Palestinian civilians in the middle --, but it may be legitimately described as resisting the occupation. Going into Israeli cities and murdering civilians is something else. This is a classic case of two wrongs not even remotely making a right. <br> <br>Your mention of Gandhi has me thinking... Gandhi and his followers ended 200 years of British rule in India with <i>non-violent</i> resistance.* After 55 years of alternating open warfare, guerilla warfare and terrorism, the Palestinians are in a worse situation than when they started. Maybe they should try non-violence for a change? <br> <br> <br>* Of course, Gandhi's campaign didn't result in <i>peace.</i> It resulted in partition, massive sectarian violence, the murder of hundreds of thousands of people on a scale that makes the West Bank and Gaza look pacific, the massacre of thousands in the Indian annexation of Hyderabad, half a century of intermittent wars between India and Pakistan, etc. But I suppose we can agree that his heart was in the right place.</p>
