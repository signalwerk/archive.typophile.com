      <p>I hadn't noticed any of these posts for so long, I had thought the individual behind this had gone away or given up or taken his quest to another forum.</p>
      <p>While I don't think we'll ever modify our alphabet in this way - because the rationale is simply unpersuasive to that great majority of Latin alphabet users who are not of the Hindu faith - I could see how the goal might be achieved through a more subtle approach.</p>
      <p>Perhaps the Armenian alphabet has no "suicidal" shapes of this type in it. And it has room - used in Eastern Armenian - for the extra consonant sounds found in Chinese (particularly in the Shanghai dialect, where English b, d, and g are also present)... and in Sanskrit. So this alphabet could be recommended on the more apparently rational grounds of promoting global unity and world peace.</p>
      <p>If we can't all speak the same language, at least we can share the same typewriters.</p>
