    html: |-
      <p>My favourite part of the whole thing is that one of the rivers creating this suicidal shape is <em>invisible.</em> We could perhaps ease Javascript's concerns by saying that the letter K is actually made up of four strokes, one of which is invisible, so its visible shape is not representative of its true shape, and hence its true (non-suicidal) meaning.</p>
      <p>Hrant, did you take money for that job?</p>
      <p>BTW, if you enjoy this, don't miss <a href="http://typophile.com/node/99378" rel="nofollow">this</a>.</p>
      <p>I find it alternatively delightfully imaginative and depressingly stupid that all this time after the development of philology, palaeography and systematic linguistics people are still inclined to assign <em>magical</em> significance to the mundane phenomena of of writing. Writing is wonderful, but because it is made by this animal called human, not because it reveals occult knowledge or works as sympathetic magic on the psyche.</p>
