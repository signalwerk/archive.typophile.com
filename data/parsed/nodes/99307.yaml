      <p>@pica pusher:<br>
      As I understand this, the OP broke away from the Hare Krishna movement as an individual because he lacked confidence in its new leadership after the death of His Divine Grace A. C. Bhaktivedanta Swami Prabhupada.</p>
      <p>The Hare Krishna movement, or ISKCON (International Society for Krishna Consciousness) is, basically, a denomination of Hinduism or a faith organization within that religion. (I had a binaural test record that referred to them as "Buddhists", so apparently some confusion about Eastern religions exists.)</p>
      <p>On his web page, he explains that an ancient battle between Gods and demons took place at the junction of several rivers; and that this event was so significant that the shape of that junction of rivers provokes suicidal thoughts in people. This involves an invisible river, called the Saraswati, but apparently the tradition of people in India committing suicide at a place of pilgrimage in Allahabad was real enough.</p>
