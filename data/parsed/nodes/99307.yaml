    <p>Enjoy non-suicidal letter shape on your mobile / cellphone.  Why use a<br>
    suicidal shape k/K on the 11th english language letter, see:<br>
    <a href="http://Kalphabet.googlepages.com" title="http://Kalphabet.googlepages.com">http://Kalphabet.googlepages.com</a>, when you could use a non-suicidal<br>
    letter shape alternative i.e. क/क in lower and upper cases?  [choose<br>
    UTF-8 on your internet browser’s character encoding if you are unable<br>
    to see the new shape] </p>
    <p>That is exactly what I did by using Symbian S60 v5 operating system<br>
    mobile / cellphone.  I had been searching for an easy font alteration<br>
    on the mobile / cellphone in Britain.  I had searched Android<br>
    operating system phones and there was either (1) rooting the phone<br>
    which required some technical ability and also involved some risकs or<br>
    (2) contracting or buying the expensive Samsung Galaxy S range or a<br>
    few other Samsung models which has the font alteration capability.<br>
    There was something also technical with option (2) as the Samsung<br>
    mobiles / cellphones used Google Play / Android marकet and this<br>
    involved certain technical abilities because I could not simply upload<br>
    a .ttf font from the PC. </p>
    <p>Thus I opted for a much easier solution and this was purchasing a<br>
    cheap Symbian S60 v5 operating system mobile / cellphone when I learnt<br>
    that alternating the font was easy and could be done by a newbie.  The<br>
    mobile / cellphone for font alteration mentioned were:  Noकia 5800,<br>
    5233, 5230 and 5235.  I only had to copy 4 times on the PC my chosen<br>
    font containing the non-suicidal letter, i.e. the BBT font ( download<br>
    it for example from here <a href="http://www.archive.org/details/BbtFont" title="http://www.archive.org/details/BbtFont">http://www.archive.org/details/BbtFont</a> -<br>
    choose Regular or Italic )  and then only change each file name to<br>
    (note lower case / upper case file name letters) s60snr.ttf,<br>
    s60ssb.ttf, s60tsb.ttf and S60ZDIGI.ttf. </p>
    <p>Then I either had to:<br>
    (1) on a Memory Card create 'Resource' named folder and in it the<br>
    'Fonts' named folder and put the s60snr.ttf, s60ssb.ttf, s60tsb.ttf<br>
    and S60ZDIGI.ttf files there - restart the phone. </p>
    <p>or </p>
    <p>(2)  connect the mobile / cellphone to the PC in Mass Storage Mode,<br>
    search for the 'Resource' named folder in the internal mobile /<br>
    cellphone file system and in it the 'Fonts' named folder and if there<br>
    was not one there - create the 'Fonts' folder.  Transfer the<br>
    s60snr.ttf, s60ssb.ttf, s60tsb.ttf and S60ZDIGI.ttf to the 'Fonts'<br>
    named folder.  Restart the mobile / cellphone. </p>
    <p>I chose this method (1).  I found the process easy and really prefer<br>
    the non-suicidal letter shape on the mobile / cellphone.  The only<br>
    thing that I as a newbie have not been able to do is alter the default<br>
    Noकia image at booting though I have put the non-suicidal letter<br>
    sticकer (see post mentioning sticकerbooक) on the Noकia name which is<br>
    on the phone case front and put blanक sticकers on the Noकia name which<br>
    is on the reverse and on the battery due to larger size sticकer<br>
    unavailability and also it was convenient. </p>
