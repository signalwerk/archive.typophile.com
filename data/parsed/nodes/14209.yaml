    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Concepts" class="freelinking" rel="nofollow">Concepts</a> : Readerability</strong></p>
    <p>A <a href="http://en.wikipedia.org/wiki/Portmanteau" rel="nofollow">portmanteau</a> referring to adaptive pattern recognition skills and cognitive processes applied to reading, which enable humans to read proficiently in a great variety of writing systems, type styles, media, reproduction qualities and environmental conditions.</p>
    <p><em>"The mass of everyday experiential evidence indicates that </em>readerability<em> matters much more to the reading process than the readability of what is read." -- John Hudson</em></p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/13926" rel="nofollow">Shinn vs. Papazian Challenge</a></p>
    <p>See also: <a href="/wiki/Readability" class="freelinking" rel="nofollow">Readability</a>.</p>
