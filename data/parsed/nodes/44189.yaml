    <p>Hello, I am currently in the process of applying for Information Design Graduate programs for the Fall of 2008. The main institute I am looking at right now is the University of Reading in England. Thoughts on this school? Any other suggestions?</p>
    <p>I'm also wondering what people's opinions on taking a Graduate program for a subject you're interested and fluent in vs taking a program you are interested in but not overly fluent.</p>
    <p>Thanks for all your help! I sincerely appreciate any input you have.</p>
