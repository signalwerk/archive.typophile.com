      <p>The London College of Communication runs a Graduate course specifically aimed at people who have a passion for info/graphic design but who have a degree which is not necessarily in a related feel.  They aim not only to train you in the requires skills and harness your passion but also to allow you to bring new thoughts and approaches from your old discipline.  LCC has an excellent reputation and my personal experience of it was very good.</p>
      <p>Will</p>
