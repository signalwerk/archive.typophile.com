      <p>&gt; I’m also wondering what people’s opinions on taking a Graduate program for a subject you’re interested and fluent in vs taking a program you are interested in but not overly fluent.</p>
      <p>I can't opine on the Reading program, but for your quoted question: I think that a graduate program is considered a master-y level, and this suggests a solid basis of knowledge in the field. Most masters programs require a considerable amount of prior knowledge, generally acquired through an undergraduate degree.</p>
