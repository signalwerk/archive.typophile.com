    <p>Designer and Punchcutter<br>
    1766 - 1844</p>
    <p>Vincent Figgins is primarily remembered for his work with display types. He introduced the first <a href="/wiki/egyptian" class="freelinking" rel="nofollow">egyptian</a> typeface in 1817.</p>
    <p>Fonts Designed:<br>
    <a href="/wiki/Gresham" class="freelinking" rel="nofollow">Gresham</a> (1792, re-issued 1925)<br>
    <a href="/wiki/Figgins%20Shaded" class="freelinking" rel="nofollow">Figgins Shaded</a> (1815, re-issued 1937)<br>
    <a href="/wiki/Egyptian" class="freelinking" rel="nofollow">Egyptian</a> (1817)</p>
