  html: <p>I'm collaborating with a colleague on a book regarding a recent showing of young chicago type designers. I was wondering if anyone could help me out with a list of type designers who have lived or worked in the Chicago area. Or used Chicago as inspiration (I'm sure someone will say the font, Chicago, so lemme have it). We're looking to stay authentic in the tone and message and would like to remain true to Chicago type roots. Old and new would be wonderful...</p>
