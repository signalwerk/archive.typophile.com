      <p>Thanks so much guys. This a great start. We're actually working with rick, who spoke at our event, to do a few spreads. (In case any were wondering, the event is here <a href="http://tinyurl.com/yj7csp9" title="http://tinyurl.com/yj7csp9">http://tinyurl.com/yj7csp9</a>) as well as Jeremiah Chiu from Plural. The newer community we definitely have covered, although some of those names are a surprise to me! It's the years farther back that is harder to figure out but this is a great start, and again, thank you. </p>
      <p>jackson, I was sad when Silas pulled out of here. His studio was right around the corner from my place and I never had the chance to bump into him. Although came close as I think he was invited to teach a type class at the same portfolio school I'm doing a class at.</p>
