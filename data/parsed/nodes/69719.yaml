    html: <p>I think both Fred Goudy and Oz Cooper lived and worked in Chicago for at least part of their careers. Cooper, if I recall correctly, was deeply connected to the sign writing tradition in Chicago. Sorry I'm so sketchy on details; maybe I'm remembering some about Cooper's biography from <a href="http://www.veer.com/ideas/btt" rel="nofollow">"Behind the Typeface"</a> :-)</p>
