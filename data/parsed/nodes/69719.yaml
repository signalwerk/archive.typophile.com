    html: |-
      <p>Some random ones off the top of my head:<br>
      Cooper<br>
      Goudy and Dwiggins spent some time there<br>
      Robert Hunter Middleton is a big, overlooked one<br>
      Rick Valicenti, Patric King, Chester (pre-vllg) and other Thirsttype people.<br>
      Andrew Byrom does rad sculptures<br>
      Barry Deck was there for a while<br>
      Silas Dilworth worked there until a few summers ago<br>
      I designed the first half of Alright Sans there and am moving back soon.</p>
