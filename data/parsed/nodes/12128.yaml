    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12443" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type and Lettering Styles</a>&nbsp;:&nbsp;Blackletter</strong></p>
    <p>Traditional style of type based on medieval scribal <a href="/node/13722" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Calligraphy</a>. The earliest books printed with <a href="/node/13771" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">movable type</a> were set in blackletter, including the famous bibles of <a href="/node/14210" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Johannes Gutenberg</a>. Blackletter type grew deep roots in the Germanic countries, developing its own vernacular form in <a href="/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a> type, a highly stylized script well-suited to economically setting German texts. It retained popularity as a decorative / ecumenical script in the English-speaking countries, predominantly as <a href="/node/13831" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Textura</a> types, a role that survives today mostly in its traditional use on diplomas and wedding&nbsp;invitations.</p>
    <p>Blackletter type is strongly connected to <a href="/node/12205" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">German nationalism</a>, with Otto von Bismarck famously proclaiming, “I do not read German books set in Latin letters.” Latin typefaces did exist in Germany as “<a href="/node/13832" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Antiqua</a>” type and were used, but through the beginning of the 20th century played a subservient role to <a href="/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a>. Germans saw <a href="/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a> as an inherent part of their national identity. (cf. ref. Bain <span class="amp">&amp;</span> Shaw’s <cite>Blackletter: Type and National Identity</cite>) </p>
    <p>Yet an even “greater” German, <span class="caps">J. W.</span> Goethe, is reported to have disliked Fraktur, and wished that all his works would be printed in Antiqua. His mother implored him for decades in her letters not to allow his books to be set in foreign antiqua. She believed that, if people stopped reading “German,” they would soon stop speaking it. She feared that, if his books were printed in antiqua, only professors and intellectuals would know the works of Goethe, and his friend Schiller. Goethe and Schiller are still two of Germany’s best-selling authors, almost 200 years past their&nbsp;deaths.</p>
    <p>During the rise of <a href="/node/12205" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">German nationalism</a> that led to the Third Reich and World War <span class="caps">II</span>, blackletter type’s totemic role as a token of national identity led to its adoption by the Nazis as part of their visual identity, particular in the form of the hybrid blackletter / latin forms known as <a href="/node/12130" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Schaftstiefelgrotesk</a>, or “jackboot Grotesques”. This has led some commentators to tie blackletter types inextricably to the Nazi party, arguing that this has made them somehow tainted, despite Hitler’s 1941 proclamation banning <a href="/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a> (Schwabacher Gotisch, actually) as “Judenlettern”, or “Jewish type”. “Grotesk/Grotesk” actually denotes sans serif, in the same confusing sense that “Gothic” was misused by American foundries at the turn of the century. Hence a “Schaftstiefelgrotesk” denotes an angular sans design rather than a Blackletter, though their ducti mimic that of blackletter–and usually the less distinctly German textura, not true&nbsp;Fraktur.</p>
    <p>Regardless, at the end of World War <span class="caps">II</span>, Germans were interested more in repairing their shattered nation than untangling their complicated and now-tainted cultural heritage, and adopted the clean, modern types sweeping across the rest of Europe, and blackletter faded from view (interestingly, some forms of blackletter are still widely used in the Spanish-speaking nations, where they connote tradition and are valued for their interesting letterforms). Blackletter type has retained its connotation of medievalism, most ironically in use by heavy metal bands who use it for logos and album&nbsp;titles.</p>
    <p>Over the last 20 years, American and English designers have rediscovered a fascination with blackletter forms and produced experimental new interpretations such as <a href="/node/add/wiki?edit%5Btitle%5D=Wexford%20Oakley" title="Create node &quot;Wexford Oakley&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Wexford Oakley</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Bastard" title="Create node &quot;Bastard&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bastard</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Sabbath%20Black" title="Create node &quot;Sabbath Black&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Sabbath Black</a>, <a href="/node/13543" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gothic Gothic</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Fakir" title="Create node &quot;Fakir&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fakir</a>. Meanwhile, a small number of German revivalists have started to go beyond the standard <a href="/node/12986" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fette Fraktur</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Wilhelm%20Klingspor%20Gotisch" title="Create node &quot;Wilhelm Klingspor Gotisch&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Wilhelm Klingspor Gotisch</a> to revive a large number of traditional blackletter designs. Two of the most prominent of these are <a href="/node/add/wiki?edit%5Btitle%5D=Dieter%20Steffmann" title="Create node &quot;Dieter Steffmann&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Dieter Steffmann</a>, a freeware designer, and <a href="/node/add/wiki?edit%5Btitle%5D=Gerhard%20Helzel" title="Create node &quot;Gerhard Helzel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Gerhard Helzel</a>, a German painter who is a sensitive and prolific revivalist of many of the early 20th century’s greatest achievements in blackletter design. Many of the free downloads on the internet have inferior outline quality; these fonts should always be inspected careful before using them for a job which will be professionally&nbsp;output.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/28919">What is the Connection between Blackletter and Violent/Extreme&nbsp;Subculture</a></p>
