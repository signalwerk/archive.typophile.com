    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Bookman</strong></p>
    <p>The history of Bookman, or Bookman Old Style, begins with the introduction of a typeface named Old Style Antique by the <a href="/wiki/Scottland" class="freelinking" rel="nofollow">Scottish</a> foundry <a href="/wiki/Miller%20and%20Richard" class="freelinking" rel="nofollow">Miller &amp; Richard</a>, designed by <a href="/wiki/A%20C%20Phemister" class="freelinking" rel="nofollow">A.C. Phemister</a> as a boldface pairing for that foundry's Oldstyle about 1858. The design became popular and was soon replicated by other foundries, with <a href="/wiki/MacKellar%20Smiths%20and%20Jordan" class="freelinking" rel="nofollow">MacKellar, Smiths &amp; Jordan</a> copying the design as early as 1869. When several smaller foundries combined to form <a href="/wiki/American%20Type%20Founders" class="freelinking" rel="nofollow">American Type Founders</a> in 1892, their libraries of typefaces had to be consolidated. ATF chose to issue the <a href="/wiki/Bruce%20Type%20Foundry" class="freelinking" rel="nofollow">Bruce Foundry</a> version of Oldstyle Antique, which they had called Bartlett Oldstyle. ATF added some special <a href="/wiki/swash" class="freelinking" rel="nofollow">swash characters</a> and <a href="/wiki/logotype" class="freelinking" rel="nofollow">logotypes</a> and rechristed the new design as "Bookman Oldstyle."<br>
    Besides the special characters, there are other features of the font, which have endeared it to typographers since its inception. These features include Bookman's large x-height, short ascenders, moderate stroke contrast, heavy serifs, and he inclusion of a <a href="/wiki/sloped%20roman" class="freelinking" rel="nofollow">sloped roman</a> as a part of the family instead of a true italic.<br>
     There have been several reinterpretations of the Bookman model. <a href="/wiki/Sol%20Hess" class="freelinking" rel="nofollow">Sol Hess</a> cut a version called New Bookman. Various phototype versions of the font added more and more swash variants of characters. <a href="/wiki/Jason%20Walcott" class="freelinking" rel="nofollow">Jason Walcott</a>'s Bookman is based on one of these phototype designs. <a href="/wiki/Ed%20Benguiat" class="freelinking" rel="nofollow">Ed Benguiat</a> redesigned the face, with the goal of making it more versitle for the <a href="/wiki/International%20Typeface%20Corporation" class="freelinking" rel="nofollow">International Typeface Corporation</a>. ITC's version differs from other versions particularly in the design of the italic, which is a true italic instead of the customary sloped roman usually provided with the Bookman typeface.</p>
