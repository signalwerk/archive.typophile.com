    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Bookman</strong></p>
    <p>The history of Bookman, or Bookman Old Style, begins with the introduction of a typeface named Old Style Antique by the <a href="/node/add/wiki?edit%5Btitle%5D=Scottland" title="Create node &quot;Scottland&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Scottish</a> foundry <a href="/node/add/wiki?edit%5Btitle%5D=Miller%20and%20Richard" title="Create node &quot;Miller and Richard&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Miller <span class="amp">&amp;</span> Richard</a>, designed by <a href="/node/add/wiki?edit%5Btitle%5D=A%20C%20Phemister" title="Create node &quot;A C Phemister&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">A.C.</span> Phemister</a> as a boldface pairing for that foundry’s Oldstyle about 1858. The design became popular and was soon replicated by other foundries, with <a href="/node/add/wiki?edit%5Btitle%5D=MacKellar%20Smiths%20and%20Jordan" title="Create node &quot;MacKellar Smiths and Jordan&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">MacKellar, Smiths <span class="amp">&amp;</span> Jordan</a> copying the design as early as 1869. When several smaller foundries combined to form <a href="/node/13552" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">American Type Founders</a> in 1892, their libraries of typefaces had to be consolidated. <span class="caps">ATF</span> chose to issue the <a href="/node/13553" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bruce Foundry</a> version of Oldstyle Antique, which they had called Bartlett Oldstyle. <span class="caps">ATF</span> added some special <a href="/node/17514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">swash characters</a> and <a href="/node/20271" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">logotypes</a> and rechristed the new design as “Bookman Oldstyle.”<br>
    Besides the special characters, there are other features of the font, which have endeared it to typographers since its inception. These features include Bookman’s large x-height, short ascenders, moderate stroke contrast, heavy serifs, and he inclusion of a <a href="/node/add/wiki?edit%5Btitle%5D=sloped%20roman" title="Create node &quot;sloped roman&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">sloped roman</a> as a part of the family instead of a true italic.<br>
     There have been several reinterpretations of the Bookman model. <a href="/node/29640" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Sol Hess</a> cut a version called New Bookman. Various phototype versions of the font added more and more swash variants of characters. <a href="/node/29812" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jason Walcott</a>’s Bookman is based on one of these phototype designs. <a href="/node/add/wiki?edit%5Btitle%5D=Ed%20Benguiat" title="Create node &quot;Ed Benguiat&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ed Benguiat</a> redesigned the face, with the goal of making it more versitle for the <a href="/node/13399" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">International Typeface Corporation</a>. <span class="caps">ITC</span>’s version differs from other versions particularly in the design of the italic, which is a true italic instead of the customary sloped roman usually provided with the Bookman&nbsp;typeface.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/17453">I ❤ Bookman</a><br><a href="http://typophile.com/node/29636">Info on the Bookman&nbsp;Typeface</a></p>
