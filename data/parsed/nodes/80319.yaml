    html: |-
      <p>John, thanks a lot. This looks like the kind of hassle I was suspecting.<br>
      It was obvious that this is an ID handling fault.<br>
      I already thought there might be only one option: to leave that part of the PUA.</p>
      <p>However, I still wonder: when Apple does use that area in that particular way, why do things run well in Apple’s own TextEdit but not in Adobe InDesign? (Not that I would wonder about such a coalition between A. and A., but its neither very fair nor very clever. And not *private* at least.)</p>
