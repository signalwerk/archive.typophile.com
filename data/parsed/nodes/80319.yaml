    <p>This is the kind of miserable behaviour I . H A T E .</p>
    <p>I am to insert various PUA characters in the text, either via a customized keyboard or the glyph palette. In the case of *some* characters they only appear when getting typed if a certain other character or a space precedes it. E.g., one particular char. doesn’t show up when I want to insert it just after a paranthesis. But ID seems then to insert some kind of dead character, which you notice when pressing the delete key. There is no OT fancies turned on. ID playes a game of cat-and-mouse with me and I don’t see why.</p>
    <p>I have no clue about what I am doing wrong this time.</p>
    <p>– it is not the font<br>
    – it is not the keyboard driver (which works fine generally)<br>
    – no dead keys or combining sequences involved<br>
    – all works perfectly well in TextEdit.</p>
    <p>Has anyone a clue to this?</p>
