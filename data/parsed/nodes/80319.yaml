    html: |-
      <p>This may not be the issue, but it is always worth checking for possible conflicts between PUA usage by major software developers. For example, I note that at least some of the problem codepoints you list are used by Apple:<br>
      <a href="http://www.unicode.org/Public/MAPPINGS/VENDORS/APPLE/CORPCHAR.TXT" title="http://www.unicode.org/Public/MAPPINGS/VENDORS/APPLE/CORPCHAR.TXT">http://www.unicode.org/Public/MAPPINGS/VENDORS/APPLE/CORPCHAR.TXT</a></p>
      <blockquote><p># The block of 32 characters 0xF860-0xF87F is for transcoding hints.<br>
      # These are used in combination with standard Unicode characters to force<br>
      # them to be treated in a special way for mapping to other encodings;<br>
      # they have no other effect.<br>
      #<br>
      # 0xF870-0xF87F are "variant tags" - they are like combining characters,<br>
      # and can follow a standard Unicode (or a sequence consisting of a base<br>
      # character and other combining characters) to tag it so that it will be<br>
      # unique, treated in a special way for transcoding. These always terminate<br>
      # a sequence of combining characters.<br>
      #<br>
      # 0xF860-0xF86B are "grouping hints" - they precede a group of two to<br>
      # four standard Unicode characters to indicate that they are treated as a<br>
      # group for transcoding. This grouping overrides any other combining<br>
      # behavior.
      </p></blockquote>
