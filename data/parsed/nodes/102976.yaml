      <p>Fishy, indeed. In any case, I am not recommending it. I just recognised it and wanted to let Jims know what font they used in the sample he provided. Also, what would be the right thing to do in this case if you like the look of Baar Sophia? Buy a license of Formata and use Sophia? The relationship between the two is not entirely clear to me anyway. I don’t have the time to compare glyphs, but that’s what I’d rather base any choices on than on the comment at dafont.</p>
      <p>By the way, I think ‘mensch’ simply means ‘human being, person’ in German without any implications of integrity, honorability or honesty.</p>
