      <p><cite>So what I would do here is buy Formata and do the modification myself (and of course not distribute my modified version).</cite></p>
      <p>Here is an overlay of unaltered Formata Roman (first one below) and articifially straightened Formata Italic (second one), both in green, with Baar Sophia in black. I’ve tried to match the x-heights and adjusted the spacing of Sophia:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/formataroman_3489.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/formataitalic_5775.png"></div><p></p>
      <p>Particularly in the second image, I see a lot of similarities. Still, modifying Formata to look like Sophia does not seem to be a five-minute job, even for an experienced type designer. And for regular end users, it’s not feasible at all to do this. Maybe the only thing they can do is stay away from Sophia if they are convinced that it has come into existence in an unethical way. Or because they realise that it’s quite ugly.</p>
