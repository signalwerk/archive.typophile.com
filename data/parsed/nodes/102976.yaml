    html: |-
      <p>If you conclude that a font is plagiarized, compensating the designer of the original is nice but perhaps not enough, because people will see your use of the plagiarized one and you're not there to tell them what's wrong with it. The only way to mitigate using a plagiarized font is if that creates an opportunity to correct the transgression and/or raise general awareness of font plagiarism. But that seems pretty far-fetched.</p>
      <p>Basically it's tainted goods, and liking it just doesn't make using it OK. So what I would do here is buy Formata and do the modification myself (and of course not distribute my modified version). But for some people even that would be unethical (assuming the EULA does forbid any modification).</p>
      <p>In any case I think it's worthwhile trying to get a straight answer from Lutz Baar. Especially considering it's free only for commercial use, and it does seem like the Madrid 2020 Summer Olympics bid logo uses it... What's interesting here is that the current owners of Berthold aren't at all shy about suing people... Maybe they're waiting to see whether Madrid wins the bid, which would greatly increase the value of lawsuit...</p>
      <p>hhp</p>
