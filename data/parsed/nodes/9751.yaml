  html: "<p>I've wondered for a long time what font what used <br>to set the body text of Gregory Maguire's novel, <br>\"Wicked: The Life and Times of the Wicked Witch <br>of the West\", designed by Joel Avirom and Jason Snyder. <br> <br>It almost looks like it could be something by Weiss, <br>Menhart or Post, but I haven't been able to pin <br>it down yet. <br> <br>Whatever it is, it's an unusual yet oddly readable <br>beauty. Note the distinctive upper-case C, G, S, E <br>and Q, and lower-case venetian e, and distinctive <br>c, g, and s, among other characters. <br> <br>Any ideas? Apologies for the large size <br>of the scan, but I wanted to post as good <br>a sample as possible, considering the only copy <br>of the book I have available is a trade paperback <br>printed on slightly glorified newsprint. :/ <br> <br><img src=\"http://www.typophile.com/forums/messages/83/67303.gif\" alt=\"WickedScan.gif\"></p>"
