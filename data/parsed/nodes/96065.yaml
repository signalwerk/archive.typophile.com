      <p>These are simply not very well spaced fonts. The reason why, in the first line, 'Pittsburgh' looks like it is coming apart while 'Presbyterian' doesn't is that the spacing between the b and u in the former is too tight relative to that between s and b, while the spacing between b and y in the latter is not. The tight spacing between b and u draws the b away from the s.</p>
      <p>I don't think any of this is down to kerning, per se: sb, bu and by in this style of blackletter would all normally be non-kerning sequences. The problem with these fonts is that the basic sidebearing spacing is bad.</p>
