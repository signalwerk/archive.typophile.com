      <p>I got a lot of ﬂak here for saying so.<br>
      Nobody likes to be told their work is second rate by someone who thinks they’re better.<br>
      It was also very hard to convince people that Myriad and Helvetica aren’t original designs!</p>
      <p>Of course, I don’t think there is anything wrong with reviving old designs, and there is a market for them, and they serve many useful purposes—my biggest beef was that I don’t think revivals are type design, they’re technical/styling work. Robin Nicholas made a similar point in the recent <em>Eye</em> special on Monotype—that he didn’t think of himself as a type designer, that was what Herman Zapf did (although I would disagree with him on that count, as he has done some quite original work, as well as things like Arial).</p>
      <p>Ultimately, there are some problems with criticizing those who work in the same industry, and, considering the shades of grey between original and knock-off, I now think it’s better to accentuate the positive (I’m writing something on Karloff for Typographica’s Best of 2012), and make any argument through my work. But I’ll still discuss this issue here, hopefully in a more nuanced manner than the past.</p>
