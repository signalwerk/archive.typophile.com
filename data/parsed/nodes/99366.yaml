      <p>How ethical it is also depends on what the 'printed source' is.  The ethics will be perceived differently depending on whether it's a previously undigitized specimen from an 1893 foundry catalog or a printed sample of a current Linotype or Adobe digitized font. And, since font NAMES can be copyrighted, and font designs can be patented, there are also other considerations.</p>
      <p> - Herb</p>
