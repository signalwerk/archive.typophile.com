    <p>Hello,</p>
    <p>I have seen a lot of revivals of old typefaces taken from printed sources to the digital realm. This kind of work really interests me and I have a question in this regard: is an ethical thing to do? I mean, copying a design from a printed source and making a digital font? What do copyright says in this regard?</p>
    <p>Thanks for clarifications</p>
