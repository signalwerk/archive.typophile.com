      <p>Speaking of Oz Cooper (which you were in another thread) — I found the fonts that were evolved from his sans hateful, despite the fact that Dave Farey is such a nice guy. If somehow I had been Oz and seen what Dave did I would have said, why did you change <em>that</em> and <em>that</em> and <em>that</em> — don’t you know I made them like that for a reason?!</p>
      <p>And it’s not really a fair evolutionary ﬁght if the original doesn’t exist.</p>
      <p>So I would say the ﬁrst duty of a revivalist is to make sure that the designer’s work is available authentically, not just the interpretation.<br>
      When I was working on the Modern Suite, I did that for the Scotch, but not for the Figgins Sans, and I now regret that. (I had changed the /G, for instance, adding a crossbar for the beneﬁt of today’s readers who might mistake the original for a /C.) The principle here is letting the market/typographer/user decide how to use the font, rather than assuming one knows what they want.</p>
