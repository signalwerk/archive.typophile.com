    html: <p>Different designers have different talents. I would much rather see a well-done version of a circa 1900 display font, done by a competent copyist, than a new typeface by someone who lacks artistic merit. And I'd certainly like to see some older display typefaces used for logos, advertising, and shopfronts instead of overused ubiquitous faces such as Papyrus and Vivaldi.  - Herb</p>
