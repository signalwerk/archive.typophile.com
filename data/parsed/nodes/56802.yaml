  html: |-
    <p>I was finishing my daily practice of lettering and knocked out the word "Letters" I was about to throw away the piece when I thought it would make a cool design. This is what I ended up with. It pretty much sums up how I feel. For those interested it was lettered with a 1/4" Langnickel 6076 Nocturna brush and showcard paint.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Letters-are-my-Life-type_5729.jpg"></div><p></p>
    <p>:)</p>
    <p>-Charles Borges de Oliveira<br>
    <a href="http://www.borgeslettering.com" title="www.borgeslettering.com">www.borgeslettering.com</a></p>
