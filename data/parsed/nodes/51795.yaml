    html: "<p>I like you typeface. Here some comments. In the thin version I think you will have to redraw your S, s at my point of view. Here my suggestion : your design as a kind of “square” look in their curves and I don't find that in the S. The outside of the s is too round, try to work with the curve of the c, g. I wonder if the problem come from the spin, it could be less oblique to leave more space to draw a higher curve on both side. Some letters in the extra bold are a bit out of your thin version. Look your k the two oblique join the vertical stem nor in the thin version. Also there are some bump in the cure (pqbdnm) and the horizontal line in the number  seems a bit to large. Hope this will help you.</p>"
