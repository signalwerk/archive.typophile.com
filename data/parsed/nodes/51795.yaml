      <p>Very nice - delicate but firm.</p>
      <p>I'm only looking at the base alphanumerics for now.</p>
      <p>First thing: spacing too tight (even though this be used mostly very large).</p>
      <p>I would shorten the descenders, and raise the tittles.</p>
      <p>6/9: I like them, but I wonder if they clash.<br>
      But maybe since they're not alphabetic it's OK.</p>
      <p>L: Too wide.</p>
      <p>M: Try splaying it.</p>
      <p>P: Bigger head.</p>
      <p>Q: Tail no good. Maybe try a detached one?</p>
      <p>W: Too narrow.</p>
      <p>X: Too wide.</p>
      <p>k: Unhappy. I'd put some curve in it.</p>
      <p>hhp</p>
