    <p>After a long (but very beautiful...)path I'm about to consider finished the first weight of Amarantino. But I want some feedback from the community of well in(formed) typeface and typography designers. </p>
    <p>Amarantino ExtraLight has been developed over a period of 10 months (January to October 2008) as a sans serif versatile family with clean visual presence. The family is still in development and it will be formed by 5 weights (ExtraLight, Light, Regular, Bold, ExtraBold) and italics designed to communicate confidence and authority. </p>
    <p>As always, existing designs have often been the source of inspiration for the creations of new ones. Amarantino is no exception and similarities can be found in the Sebastian Lester Soho™ typeface. My goal was not to copy but respect this source and turn my creation into something unique and with personal flavour.</p>
    <p>The name Amarantino comes from the natural born from the city of Amarante in Portugal. The author is an Amarantino.</p>
    <p>Amarantino is suitable for a variety of applications including medical, finance, transport, culture and high tech industries.</p>
    <p>Thanks in advanced<br>
    António Fonseca</p>
