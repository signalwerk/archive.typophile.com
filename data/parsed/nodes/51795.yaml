    html: |-
      <p>This looks very nice and as an aspiring type designer I admire anyone who has the courage to post their designs here. </p>
      <p>I was told a long time ago by a man called Bernd Möllenstadt that you should design the bold version of your face first or at least draw some bold characters early on in the design process.</p>
      <p>Your design – which looks very fresh and clean– seems completely monoline. What will happen when the weight increases and the counters get smaller? Will it remain monoline which I don't think it can in heavier weights or will it become more stressed?</p>
      <p>I am really looking forward to seeing the bolder cuts and the very best of luck with it.</p>
    html_clean: |-
