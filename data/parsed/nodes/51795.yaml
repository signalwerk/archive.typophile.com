    html: <p>Overall, I think this is great. The "s" is the one thing that really jumps out at me. The curves just don't feel quite right, maybe the bottom could be a bit heavier than the top and not be such a mirror. In the numbers, digits like 5, 6, 8, 9, felt a bit more geometrically forced than the alphabet, which feels really well resolved. Other than that, none of the other characters bothered me, and felt very natural to the typeface.</p>
