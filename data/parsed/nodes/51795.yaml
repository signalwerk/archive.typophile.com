      <p>The S and s seem to flat.<br>
      The stem that follows the point where the stem and curve join on the m, n, a, d, r, q, and g seem quite short (especially at the text sizes). I might suggest making those a bit deeper. Especially if you make bolder versions you'll find you'll have to compensate quite a lot more.<br>
      The P, R, M, N, and W seem a little wide.</p>
      <p>Go Portugal!</p>
