  html: <p>It looks to me like this is a modified version of Helvetica. Most of the characters (like the S) look just like Helvetica, but others (like the G and R) which have a different overall form are not as well-drawn and, in fact, look like crudely modified Helvetica characters. At least to my eye.</p>
