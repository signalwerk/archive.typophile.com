  - id: 69504
    user: 1262
    date: 2003-04-10T20:08:00
    date_raw: 10 Apr 2003 — 8:08pm
    votes: null
    html: <p>Oh! Oh! I know this one!  <br>  <br>In newspaper context, TTS stands for Teletypesetter. There were a few variants of this technology, but basically they all involved remote keyboarding and transmission by wire or cable (telegraph) direct to a linecaster, phototypesetter or, later, digital typesetting system. Although it would work with any font on the target typesetting system, TTS's efficiency contributed to the increase in content in daily newspapers, and so indirectly generated a large demand for condensed typefaces. I'm not sure if that's the impact on type design you were thinking of, Kent; I can't think of another, more direct impact.</p>
    html_clean: <p>Oh! Oh! I know this one!  <br>  <br>In newspaper context, TTS stands for Teletypesetter. There were a few variants of this technology, but basically they all involved remote keyboarding and transmission by wire or cable (telegraph) direct to a linecaster, phototypesetter or, later, digital typesetting system. Although it would work with any font on the target typesetting system, TTS's efficiency contributed to the increase in content in daily newspapers, and so indirectly generated a large demand for condensed typefaces. I'm not sure if that's the impact on type design you were thinking of, Kent; I can't think of another, more direct impact.</p>
  - id: 69505
    user: 1215
    date: 2003-04-11T05:10:00
    date_raw: 11 Apr 2003 — 5:10am
    votes: null
    html: <p>John -- <br> <br>I'm going to give this one to you, just to keep things moving along.  <br> <br>The third part of your answer, however, is not quite complete. The TTS system mandated a set of character widths, to which a font had to conform in order to perform properly. (I'm not sure why this was so, but I think it may have had to do with consistent line counts for the syndicated material.) These prescribed widths were fixed, *independent* of type size. As the tendency grew among newspapers to increase body size, the rigid widths meant progressively narrower letterforms and ever more condensed newspaper faces. That's the impact on type design I had in mind. <br> <br>Apparently, much of Jackson Burke's tenure at MLCo. was taken up (regrettably) with most of his staff redrawing and recutting Corona over and over for TTS systems. <br> <br>With Olympian, Carter and Parker took the lessons of the Legibility Series but applied an oldstyle stress. This allowed Carter to move the thickest point of a curve off the extreme horizontal positions, where space was at a premium, and thus achieve a more open counter on a narrower width. <br> <br>-- K.</p>
    html_clean: <p>John -- <br> <br>I'm going to give this one to you, just to keep things moving along.  <br> <br>The third part of your answer, however, is not quite complete. The TTS system mandated a set of character widths, to which a font had to conform in order to perform properly. (I'm not sure why this was so, but I think it may have had to do with consistent line counts for the syndicated material.) These prescribed widths were fixed, *independent* of type size. As the tendency grew among newspapers to increase body size, the rigid widths meant progressively narrower letterforms and ever more condensed newspaper faces. That's the impact on type design I had in mind. <br> <br>Apparently, much of Jackson Burke's tenure at MLCo. was taken up (regrettably) with most of his staff redrawing and recutting Corona over and over for TTS systems. <br> <br>With Olympian, Carter and Parker took the lessons of the Legibility Series but applied an oldstyle stress. This allowed Carter to move the thickest point of a curve off the extreme horizontal positions, where space was at a premium, and thus achieve a more open counter on a narrower width. <br> <br>-- K.</p>
