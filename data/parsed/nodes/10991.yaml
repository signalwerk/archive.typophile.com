    html: "<p>Peter -- <br> <br>It seemed like you were just guessing, and I was going to make you pick one. But you may have caught me up on this one. <br> <br>My answer was Olympian, designed for Mergenthaler Linotype Co. by Matthew Carter in 1970 for release in both metal matrices and photofilm. (The production drawings were done by the talented draughtsman George Ostrochulski.) My source for this was a conversation I had a month ago with Mike Parker, who was Director of Type Development. Olympian was the last new design to be cut in metal here in the States. It was designed, in part, to respond to the increasingly narrow restrictions of TTS standards. (Hey, there's another good trivia question: TTS -- what does it stand for and what was it? Oh well, next time.) <br> <br>When MLCo. closed down matrix manufacture here early in the 70s, they transferred all metal manufacture to Linotype &amp; Machinery Ltd. (English Linotype). Tracy was typographic director for L&amp;M, and it seems that Times Europa was cut by L&amp;M a little later than Olympian. The evidence I've found suggests that it was indeed made for metal. Mike obviously wasn't thinking about L&amp;M when we were talking. <br> <br> <br>Anyway, in either case, I declare Peter the winner. <br> <br>-- Kent.</p>"
    html_clean: "<p>Peter -- <br> <br>It seemed like you were just guessing, and I was going to make you pick one. But you may have caught me up on this one. <br> <br>My answer was Olympian, designed for Mergenthaler Linotype Co. by Matthew Carter in 1970 for release in both metal matrices and photofilm. (The production drawings were done by the talented draughtsman George Ostrochulski.) My source for this was a conversation I had a month ago with Mike Parker, who was Director of Type Development. Olympian was the last new design to be cut in metal here in the States. It was designed, in part, to respond to the increasingly narrow restrictions of TTS standards. (Hey, there's another good trivia question: TTS -- what does it stand for and what was it? Oh well, next time.) <br> <br>When MLCo. closed down matrix manufacture here early in the 70s, they transferred all metal manufacture to Linotype &amp; Machinery Ltd. (English Linotype). Tracy was typographic director for L&amp;M, and it seems that Times Europa was cut by L&amp;M a little later than Olympian. The evidence I've found suggests that it was indeed made for metal. Mike obviously wasn't thinking about L&amp;M when we were talking. <br> <br> <br>Anyway, in either case, I declare Peter the winner. <br> <br>-- Kent.</p>"
