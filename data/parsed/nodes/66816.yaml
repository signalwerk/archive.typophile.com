      <p>&gt; criminals who deserve criminal penalties</p>
      <p>The image to which you linked refers to copyright infringement. That is a tort, not a crime. Adobe and Linotype are permitted by law to sue people who infringe their copyrights, and that has to happen before enforcement takes place. Infringement for resale can indeed be a criminal act, and other crimes can be associated with copyright infringement in connection with obtaining access to the copyrighted work to copy it (i.e. in the case of movie piracy): but font designs are not copyrightable in the U.S., so this is not relevant to those acts of font copying.</p>
      <p>&gt; design patent protection</p>
      <p>True, I've seen some of these old design patents. My understanding was they failed to hold up in court as an effective way to protect font designs however, or, if they did work, they were limited to ornamental fonts and not basic text fonts.</p>
