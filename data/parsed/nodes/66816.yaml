      <p>Hi John,<br>
      welcome to Typophile.</p>
      <p>Adam Twardoch has explained the Bitstream story <a href="http://www.typophile.com/node/3003#comment-23904">in an older thread</a>:</p>
      <p><cite>[…] in the 1980s, […] [a] group of type designers including Matthew Carter left Linotype and started Bitstream, which was to become the first digital type foundry in the world. They digitized original Linotype typefaces, but Linotype refused to license the original trademarks to them. So they used names derived from their own classification (Humanist 777 being Frutiger, Swiss 721 being Helvetica, etc.). Bitstream licensed the names from some other foundries, so some of the fonts used original names (e.g. Futura), but those copied from Linotype, Monotype and Berthold designs usually did not. However, these still were very faithful and high-quality digitizations, not cheap knock-offs like many many other companies offered them. […]</cite></p>
      <p><cite>[In 2003], Linotype and Bitstream signed an agreement which finally ended their dispute over the designs. Linotype officially "licensed" the designs to Bitstream (but not the trademarks). This means, that prior to that, Swiss 721 was an unlicensed clone of Helvetica, and now it's a licensed version of Helvetica, but sold under a different name. […] This is handy to know as this sort of confirms that the Bitstream versions really are derived from the same original sources.</cite></p>
      <p>Later in this thread, others who (I believe) do know the ropes of digital type history, like John Hudson and Gerald Giampa, elaborate on this.</p>
      <p>For your second question: it depends. If the design in question really is in the public domain, you might be allowed to do your own version, provided that you don’t build upon someone else’s copyrighted data, or use a name that is trademarked. Better get professional legal advice.<br>
      However, the most important question remains: why ‘design’ something that already exists? Make sure to read <a href="/wiki/John%2520Downer" class="freelinking">John Downer</a>’s essay <a href="http://www.emigre.com/Editorial.php?sect=2">Call It What It Is</a>: <cite>“‘Me Too’ fonts, or ‘Copy Cat’ fonts, as they are called, tend to focus on opportunism rather than on originality. These don’t rate as revivals because they don’t revive.”</cite></p>
