    <p>Hi, I'm new to the forums and noticed a certain user pushing accusations of forgery on type foundries.. I do not really know the facts but could someone please provide an explanation?</p>
    <p>i.e.</p>
    <p><a href="http://www.sanskritweb.net/forgers/bitstream2.pdf" title="http://www.sanskritweb.net/forgers/bitstream2.pdf">http://www.sanskritweb.net/forgers/bitstream2.pdf</a><br>
    ..why DID bitstream rename all their fonts... i.e. Bulmer, was remade as Transitional 411.</p>
    <p>Excuse my ignorance on the topic, but I've seen these accusations and the general response is not to believe anything they says...?</p>
    <p>I guess this is a 2 part post:<br>
    also, what happens when a font design becomes public domain:<br>
    <a href="http://www.sanskritweb.net/forgers/publicdomain2.pdf" title="http://www.sanskritweb.net/forgers/publicdomain2.pdf">http://www.sanskritweb.net/forgers/publicdomain2.pdf</a></p>
    <p>can anyone them make a revival?</p>
    <p>i.e. <a href="http://www.theleagueofmoveabletype.com/fonts/7-league-gothic" title="http://www.theleagueofmoveabletype.com/fonts/7-league-gothic">http://www.theleagueofmoveabletype.com/fonts/7-league-gothic</a></p>
