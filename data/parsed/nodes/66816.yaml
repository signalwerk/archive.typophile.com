      <p>Today, there is not much excuse for copying fonts, since fonts are sold in TrueType or Adobe Type 1 format for use on all sorts of equipment.</p>
      <p>But the reason type designs were copied - by nearly every typographic equipment manufacturer - in the old days are simple enough.</p>
      <p>If you were going to purchase a Monotype caster and keyboard, or a Linotype machine, or an IBM Selectric Composer, or a Compugraphic phototypesetter... if you couldn't use it to set Times Roman or Optima or Caledonia or Futura or Kabel, or any of the other fonts that were, at one time or another, all the rage... its usability would be very limited. Since, on the one hand, companies were loath to license their highly popular type designs to competitors (and it's not as if Linotype manufactured Monotype matrix-cases, or font discs for Compugraphic phototypesetters, and so on) - and, on the other hand, at least in the United States, <em>type designs enjoyed neither patent nor copyright protection</em>, well, they got copied.</p>
      <p>The names of typefaces, though, <strong>did</strong> have trademark protection. So this is why so many alternative names for the same type design emerged.</p>
