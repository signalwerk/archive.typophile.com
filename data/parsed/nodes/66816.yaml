      <p><cite>type designs enjoyed neither patent nor copyright protection</cite></p>
      <p>Actually, type designs have enjoyed patent protection — specifically, design patent protection — in the United States for well over a century. In fact the very first design patent issued in the USA was for a typeface, in 1842.</p>
      <p>Now, design patents may be expensive, and offer a limited duration of protection, so most type designers might not bother... but they most certainly do apply to typefaces. They still apply today, or at least recently, as was demonstrated in the summary judgment of the Adobe vs SSi lawsuit.</p>
      <p>Cheers,</p>
      <p>T</p>
