    html: |-
      <p>Straight line to curve, quickest way:</p>
      <p>Option-click on the line.</p>
      <p>For more than one line to curves, select the lines, then control-click or right-click anywhere on the lines and use the popup menu and choose “Convert &gt; To Curves”.</p>
      <p>Curve to straight line, quickest way:</p>
      <p>Shift-click on the curve to select it, then control-click or right-click on the curve and use the popup menu and choose “Convert &gt; To Lines”.</p>
