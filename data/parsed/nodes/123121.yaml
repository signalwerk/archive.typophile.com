    html: <p>In your mock up you are using italic on the spine. But when a book stands upright on the shelf the eye does not easily read a downward sloping italic, although most publishers are blind to this. In France, for example, where the standard spine, unlike UK/US, reads bottom to top, italic is fine because the eye is reading upwards. Were I President of the Republic, spine text running top to bottom would be forbidden, along with such as instant coffee (insult to the coffee bean), white chocolate, cricket. Doubtless my head would soon be rolling. At least, in top to bottom running spine text, no italic. In addition, I also find loosely spaced italic, as on your front cover, undesirable. Loose spacing generally works best in caps and small caps.</p>
