    html: '<p>Thanks @GrubStreet for the observation. Indeed, the foundation of the book is to persistently make comparisons between the socio-economic paradigms existing in the 1800s versus the present. My first Ph.D. thesis (Hegelian Dialectics) was five years in the making. I took an unusual route. On the side, I studied Gestalt therapy. My oral argument, lasting 9 full hours, was "playing" in a Gestalt method: I as Adam Smith in one chair would have a dialogue with myself as Thomas Aquinas sitting in the facing chair. So yes, the title of Wealth Beyond Nations is an extremely specific choice.</p>'
