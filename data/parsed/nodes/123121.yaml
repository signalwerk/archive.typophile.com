      <p>I assume this is a self-published book. It looks like a debossed cover; be aware that this will raise printing costs. Also it looks like the bottom word ("Nations") has no color in it. I'd recommend putting at least a slight tint in it, otherwise it'll be difficult to read under some lighting conditions (particularly the first and last letters which don't have a background image behind them).</p>
      <p>If it will be sold in bookstores, you might consider adding some color to the cover; a black-and-white cover may look a little dull compared to colorful covers next to it (but you can keep it subtle).</p>
      <p>Also I'd try to pick a printer who'll allow you to be there during printing to inspect and sign off on the cover and at least some of the inside pages. You don't want to find out that you're unhappy with the printing after the job is all done. Also you'll want to inspect some of the books to make sure the pages are in the proper order; even a good printer can occasionally make mistakes.</p>
