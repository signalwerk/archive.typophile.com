      <p>J. Tillman, thanks very much for the input...</p>
      <p>... I've made some fundamental changes:</p>
      <p>1. Changing the "sidenotes" to conventional footnotes... this frees up the seemingly impossible task to cramming everything to a 6 x 9 format, (effective margins, body text, and sidenotes)...</p>
      <p>2. Thus, inside and outside margins are equal at 2 cm. BTW, this "abridged version" is probably going to be about 75 - 80 pages. The full version will be about double this... so the new margins of 2 cm should be workable.</p>
      <p>3. Reverted to Brioni for the body text... 10.5 / 13.8 / 10 pt tracking / optical kerning / ligatures are off / hyphenation is 3 characters (after first / before last)</p>
      <p>So, here are a couple sample pages of the changed format:<br>
