    <p>I'm getting to the final stages of writing a book on economic philosophy. The central thesis: human societies have experienced only three basic "fields" of socio-economic behavior: agriculture/mining, mass production, and services; mass human labor is no longer needed in these three fields; a new fourth economy is necessary.</p>
    <p>I am attempting to set the format and type in InDesign, and would appreciate a critique (knowing full well there will be a wide variety of opinions). My interest is to put out the best, most readable design possible.</p>
    <p>In InDesign, page dimensions: 22.86 cm (9 in) x 15.24 cm (6 in)... basically, a somewhat standard book size.<br>
    Margins are set to: 2.18 cm Top/Bottom and 1.12 cm Inside and 3.12 cm Outside (simple footnotes are in the outside margins, as well as page numbers).</p>
    <p>I've had a devil of a time choosing a typeface. I wanted to get away from the standard Garamond, Baskerville, etc. types, but still formal for a book subject as economic philosophy. I seem to be hovering over the new release of ITC New Veljovic... the spacing is very generous, making the complex subject of philosophy a bit easier on the eye. My second choice was Brioni (Typotheque), which has a larger x-height. Third and fourth choice was Malabar and Plantin. My technical safe fallback is Canada Type's Aragon ST (although I am a bit peeved at CT for other reasons). I really tried using Nick Shinn's wonderful Richler, but some folks thought it was just a little too colorful for the subject of philosophy. Using FF Clan for sans highlights and charts/graphs, etc.</p>
    <p>I attach 2 pdfs (a few selected pages), one with ITC New Veljovic Regular (11 pt / 13.8 pt leading, Metric kerning) and the other with Brioni Light (10.5 / 13.8... and with Brioni, I've committed the dual sins of using 10pt tracking with optical kerning due to Brioni being so tightly spaced)... footnote numbers use opentype features of sups, rather than InDesign manually adjusting the font... the public book version is really an abridged version of the larger book, (the larger book uses more complex mathematical and quantum physics equations, which I've edited out of the abridged version for easier reading by the masses). So I need a typeface with really sophisticated capabilities with alpha-numeric sups/subs, etc... (hence the typeface choices).</p>
    <p>The typeface used for the cover is Greta Display.</p>
    <p>Here a couple of mockups, and the 2 pdf files are below:</p>
    <p><a href="http://s7.postimg.org/6ktty6mwr/WBNcover_v4_Mockup_Closeup.png" title="http://s7.postimg.org/6ktty6mwr/WBNcover_v4_Mockup_Closeup.png">http://s7.postimg.org/6ktty6mwr/WBNcover_v4_Mockup_Closeup.png</a></p>
    <p><a href="http://s16.postimg.org/4z3pdxg51/WBNcover_v4_Mockup.png" title="http://s16.postimg.org/4z3pdxg51/WBNcover_v4_Mockup.png">http://s16.postimg.org/4z3pdxg51/WBNcover_v4_Mockup.png</a></p>
