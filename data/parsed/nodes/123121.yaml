      <p>How is this being printed? Paperback or hardcover? Print on demand or offset or other? I see the picture looks hardcover.</p>
      <p>MARGINS</p>
      <p>The thing that jumped out at me was your inner margin, less than half an inch. I do not have experience setting hardcover books, but this seems small. Look at similar books in the bookstore or library to be sure your text will not dip into the gutter. Have you consulted with the printer on this? Also, on my screen it seemed that your left and right pages have a different inner margin. If it's paperback, the inner margin is much too small.</p>
      <p>Re: the outer margin. How close is the text (footnotes) to the edge of the book? Is your printer okay with this?</p>
      <p>COVER</p>
      <p>If you are selling or marketing your book on the internet, the cover has to look good at internet sizes. Specifically this is postage stamp and a half size for Amazon. A similar size will be used by internet reviewers. Don't let this be a surprise. Check it out.</p>
      <p>I had difficulty telling that the graphic is a torch. Maybe this is because of the arty angled photo of the cover, but get some feedback on this.</p>
      <p>FONTS</p>
      <p>I much preferred the Brioni text. You called the spacing of the Veljovic "generous", but I just call it "loose". To my eyes and brain it is too loose.</p>
      <p>Since you have adjusted the spacing of the fonts, you should ask yourself whether it reads better without the ff and ffi ligatures. Remember, it's not an art contest; you just want to know if it reads better.</p>
      <p>Your title page looks great.</p>
      <p>It is all just my opinion.</p>
