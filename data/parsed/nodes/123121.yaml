      <p>This abridged version most likely to be printed paperback. Not sure, yet, about the full version of the book.</p>
      <p>Will focus more energy toward the cover (art) after I nail down the text... personally, I would like for the cover to be as simple as possible... will probably lose the torch... in its present design, I was initially envisioning a textured hardcover (hence, the textured tile look)... but a paperback format will probably force using simple flat colors...</p>
      <p>Again, thanks for your observations... hope this comes closer to being readable...</p>
      <p>Cheers,</p>
      <p>Michael</p>
