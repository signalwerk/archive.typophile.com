      <p>Hello, Michael.<br>
      I had a quick view on your files.<br>
      1. The inner margins are very small indeed. I would almost double them.<br>
      2. The pictures. You may try to set a rule. For example, all pictures will be at the bottom, or top of the page. Thus, you'll have a more uniform "image". If you think this is too difficult, or you don't like the idea, perhaps would help to divide the page into horizontal frames and try to set images within those frames/lines and you'll have the same height for most of images.<br>
      Also, fig. 1 seems like a neighbor who came without invitation. Since the place belongs to it, give it some more space from top.<br>
       Regarding the fonts, will write tomorrow.</p>
