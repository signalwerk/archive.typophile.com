    <p>TypeTool is a basic font editor for Mac <span class="caps">OS</span> and for Windows. For students, hobby typographers and creative professionals who occasionally need to create or customize&nbsp;fonts.</p>
    <p>TypeTool 3 released in March 2007 includes support for OpenType fonts with up to 65,000 glyphs, Unicode 5.0 support, new bitmap Background and outline Mask layers, improved Bézier drawing with open contours and tangent points, multi-line metrics and kerning editing, and  screen quality&nbsp;autohinting.</p>
    <p><a href="http://www.fontlab.com/Font-tools/TypeTool/">http://www.fontlab.com/Font-tools/TypeTool/</a></p>
