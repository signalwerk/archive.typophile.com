    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Tools" class="freelinking" rel="nofollow">Tools</a>: <a href="/wiki/Type%20Design%20Tools" class="freelinking" rel="nofollow">Type Design Tools</a> : TypeTool</strong></p>
    <p>TypeTool is a basic font editor for Mac OS and for Windows. For students, hobby typographers and creative professionals who occasionally need to create or customize fonts.</p>
    <p>TypeTool 3 released in March 2007 includes support for OpenType fonts with up to 65,000 glyphs, Unicode 5.0 support, new bitmap Background and outline Mask layers, improved Bézier drawing with open contours and tangent points, multi-line metrics and kerning editing, and  screen quality autohinting.</p>
    <p><a href="http://www.fontlab.com/Font-tools/TypeTool/" title="http://www.fontlab.com/Font-tools/TypeTool/">http://www.fontlab.com/Font-tools/TypeTool/</a></p>
