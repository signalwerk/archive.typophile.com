    html: |-
      <p>I don't think a command line tool has been created yet. You could make one easily using the <a class="freelinking external" href="http://code.typesupply.com/wiki/ufo2fdk" rel="nofollow">ufo2fdk</a> package that I released last week. In fact, the demo script from my presentation might be a good starting point for you. It is included below. (Replace the "...." with the appropriate white space.)</p>
      <p>Alternatively, you could use the batch generator in <a class="freelinking external" href="http://tools.typesupply.com/area51.html" rel="nofollow">Area51</a>.</p>
      <p><code><br>
      from robofab.world import OpenFont<br>
      import ufo2fdk<br>
      import glob<br>
      import os</code></p>
      <p># path to the fonts<br>
      directory = "/path/to/a/directory/containing/ufos"</p>
      <p># print a message if the FDK can't be found<br>
      if not ufo2fdk.haveFDK():<br>
      ....print "I couldn't find the FDK :-(!"<br>
      # if the FDK is available<br>
      else:<br>
      ....# start the compiler<br>
      ....compiler = ufo2fdk.OTFCompiler()</p>
      <p>....# for each UFO in the directory<br>
      ....for ufoPath in glob.glob(os.path.join(directory, "*.ufo")):<br>
      ........print "Compiling: %s..." % os.path.basename(ufoPath)<br>
      ........# put the OTF next to the UFO<br>
      ........otfPath = os.path.splitext(ufoPath)[0] + ".otf"<br>
      ........# open the UFO<br>
      ........font = OpenFont(ufoPath)<br>
      ........# compile<br>
      ........report = compiler.compile(font, otfPath)<br>
      ........# print the makeotf report<br>
      ........print report["makeotf"]</p>
      <p># done<br>
      print "Done!"<br>
      </p>
