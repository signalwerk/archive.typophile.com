    <p>I’m wondering which typefaces might typically have been used in science textbooks of the 1950s. My guess is that most British publishers would still have used a serif face (possibly even with oldstyle figures?), whereas American books might have something more modernist, maybe a slab serif or Franklin. But which ones?</p>
    <p>If anyone knows of scanned images of such things, so much the better.</p>
