      <p>Math textbooks of that era were generally set in Monotype Modern. A minority would have been in <a href="http://www.myfonts.com/fonts/agfa/old-style-mt/">Monotype Old Style</a>. You’ll probably also find some in Times, Baskerville, Caledonia, and the other massively popular book faces of the day.</p>
      <p>Hope this helps.</p>
