    votes: null
    html: "<p>Ramiro -- <br> <br>\"Bouma\" is a term that Hrant made up. He uses it to mean \"word gestalt\" or \"word shape.\" I believe he derived the word from the name of a pioneer in legibility/readability research. <br> <br>I'll take this opportunity to point out, and regular Typophiles should take note: There are a number of terms that Hrant uses that are unique to him and will not be recognized outside of the various Typo-lists where he holds court. (<i>Bicameral 'g'</i> is another Hrantism that comes quickly to mind.) It's a part of his iconoclastic -- how shall I say? -- charm?? <br> <br>And, hey, there's nothing really wrong with this; that's how new words get coined. (I personally happen to dislike / disagree with / find irritating his use of some words -- like <i>bicameral</i> -- but that's a different matter.) Perhaps through persistent use he will manage to get some of them to become generally accepted. <br> <br>But I think it's important to remember, every now and then, that for the time being these terms remain personalized jargon. <br> <br>-- Kent.</p>"
