    html: "<p> I think LettError missed the mark on this one. At least in the presentation - which is a surprise, for them. What are these? Tiny, tiny blobs? What do you do with them? Can we see these at handwriting size, please?  <br>Hrant: your bouma idea is way ahead of its' time. If you can really convincingly start to show people that this is really the way they are reading then you may start off some kind of offshoot revolution in type design. Perhaps it only means letters are kerned differently, or perhaps it means a font requires Xthousand ligatures. How do you think the bouma approach might affect type design?  <br>And by the way, I'm open to any discussion here, but I think the bouma movement got off on the wrong foot with yet another example of bad nomenclature. Boomer?? </p>"
