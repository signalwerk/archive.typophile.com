  date_raw: 17 Sep 2002 — 3:51pm
  votes: null
  html: "<p>LettError has released a couple of (ironic) free fonts: <br><a href=\"http://www.letterror.com/foundry/goodies/index.html\" target=\"_top\">http://www.letterror.com/foundry/goodies/index.html</a> <br> <br>What's interesting about the \"Printed\" one is that the <br>glyphs are boumas (or actually instances of boumas). <br> <br>(BTW, last month I started working on some simple animations of what happens to words as they're perceived at increasing distances from the point of fixation, and the results look just like those glyphs! They probably used GaussianBlur then Threshold, via an Action script, and probably some more automation to get it into a font.) <br> <br>hhp</p>"
  html_clean: "<p>LettError has released a couple of (ironic) free fonts: <br><a href=\"http://www.letterror.com/foundry/goodies/index.html\" target=\"_top\" class=\"link-external\">http://www.letterror.com/foundry/goodies/index.html</a> <br> <br>What's interesting about the \"Printed\" one is that the <br>glyphs are boumas (or actually instances of boumas). <br> <br>(BTW, last month I started working on some simple animations of what happens to words as they're perceived at increasing distances from the point of fixation, and the results look just like those glyphs! They probably used GaussianBlur then Threshold, via an Action script, and probably some more automation to get it into a font.) <br> <br>hhp</p>"
