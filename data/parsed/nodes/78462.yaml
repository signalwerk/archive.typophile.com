    html: <p>I had a similar situation once, and ended up going with one font (it was so long ago I don't remember which one.)  Two versions would mean more time spent proofing, and any subsequent revisions would have to be made to both versions to keep them in sync. Plus two versions in two different fonts could mean that a paragraph that's on page 65 in the screen version might be on page 66 in the print version, which could conceivably lead to confusion.</p>
