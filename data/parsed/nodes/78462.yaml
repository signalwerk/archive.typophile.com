    <p>I'm designing a 100+ page document that is intended to be read primarily on screen (as a downloadable PDF) but it must also look great when it's printed.</p>
    <p>I'm about 20 pages into laying out the type, and I'm starting to think that my body copy font choice, Helvetica Neue 55 Roman, may not have been the best choice. It looks a bit crude on screen. </p>
    <p>I've considered using a more screen friendly font (Verdana, Arial, etc), but then I'll be sacrificing the integrity of the print version. So, use 2 separate fonts? No dice, I refuse to set this document twice, it's far too long. </p>
    <p>Have any of you encountered a similar conundrum? If so I'd like to know what you ended up doing (ie did you use separate fonts for a print and a screen version, or did you find a font that handled both mediums fairly well?). </p>
    <p>Thanks eh.</p>
