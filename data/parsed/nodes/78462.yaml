    html: <p>Since the aspect ratio of the typical screen (even Kindle or iPad) is different than for the typical book, we've always felt you have to reset the text anyhow. That lets you pick a different font for the screen . . . Fonts that reproduce well on the screen aren't something I know much about, but they've been discussed heavily in several typophile forums.</p>
