  html: <p>After leaving my sans serif font for a while, I am back on the project formally known as Richmond Sans (also on this thread). <br> <br>I have been working on the lowercase 'e'  and I can't help but feel that the right of the letter doesn't seem to balance with the rest of the letter. I've tried aletring it in to a number of different positions over the past hour and can't seem to get it so I m happy with it. <br> <br>What do you think? <br> <br><img src="http://www.typophile.com/forums/messages/29/49509.gif" alt=""></p>
  html_clean: <p>After leaving my sans serif font for a while, I am back on the project formally known as Richmond Sans (also on this thread). <br> <br>I have been working on the lowercase 'e'  and I can't help but feel that the right of the letter doesn't seem to balance with the rest of the letter. I've tried aletring it in to a number of different positions over the past hour and can't seem to get it so I m happy with it. <br> <br>What do you think? <br> <br><img src="http://www.typophile.com/forums/messages/29/49509.gif" alt=""></p>
