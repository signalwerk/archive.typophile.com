    html: <p>You could shear it at the same angle as the lower finial (look at Palatino's "e"), but I'm not sure I even see a real problem - what you're feeling is probably just the inherent "divergence" in the [conventional] Latin alphabet. <br> <br>I do see problems in some of the curves however, like the join of the left curve to the straight finial being too thin, and the leftmost profile being wobbly. <br> <br>hhp</p>
