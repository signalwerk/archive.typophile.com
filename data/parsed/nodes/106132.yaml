    <p>Hi guys,</p>
    <p>glad to join this great place.</p>
    <p>I have a question: do you know any online tool (or any clever method) to display languages list which are supported by the font? I'm making one and it contains German, Polish &amp; Spanish glyphs, but I don't know which other languages are using the same glyphs as mentioned.</p>
    <p>How can I check it ?</p>
    <p>Cheers and thank you in advance.<br>
    Lucas</p>
