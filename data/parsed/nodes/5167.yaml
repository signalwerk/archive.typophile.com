  html: "<p>Friends, <br> <br>I'd like to make a *very* inexpensive font creation tool in my spare time. Does anyone know: <br> <br>1) Can a ttf be created from a XML?   <br>2) Can a ttf be generated from a parser of some sort?\" <br>3) Are their any instructions on the web for creating a font (from a back-end point of view?) <br> <br>Any ideas, references or collaborators would be very welcome! <br> <br>Thanks, <br>Brett Jackson <br><a href=\"mailto:brett@imbrettjackson.com\">brett@imbrettjackson.com</a></p>"
