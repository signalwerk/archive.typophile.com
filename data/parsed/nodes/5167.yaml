    html: <p>Wow, I'm surprised no one has mentioned JvR's <br>amazing TTX yet. <br> <br>&gt;1) Can a ttf be created from a XML?  <br>&gt;2) Can a ttf be generated from a parser of some sort?"  <br> <br>Yes and yes. See  <br> <br><a href="http://letterror.com/code/ttx/index.html" target="_top">http://letterror.com/code/ttx/index.html</a> <br> <br>&gt;3) Are their any instructions on the web for creating a font (from a back-end point of view?) <br> <br>I'm not quite sure what you mean by this, but <br>check out <a href="http://developer.apple.com/fonts/" target="_top">http://developer.apple.com/fonts/</a> . <br> <br>Good luck!</p>
