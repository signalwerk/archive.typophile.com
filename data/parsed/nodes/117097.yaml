      <p>Mephisto matches what Dan Solo shows as 'Washington Antique' in the Solotype Catalog. May or may not be the original name. Also available as 'Thuvia' by Michael Lee, who interestingly states in the ReadMe that he based the font on letters on the covers of some Edgar Rice Burroughs books.</p>
      <p>I'd have to agree with Ryuk that Mephisto (Thuvia) is closest. Thuvia is easily found on the Web, but I don't find it on any reputable site I want to link to.</p>
