      <p>Bauer's Gable is almost 100% identical to a font cut by Gustave F. Schroeder for the Central Type Foundry decades earlier, with three widths Lafayette, Jefferson and Washington. </p><div class="imageWrap"><img src="http://typophile.com/files/JeffersonBySchroeder@Central_3671.jpg"></div><br>
      The book title has the middle, i.e. Jefferson, width.<br>
      BTW Solo's Washington is the name used by another foundry for a clone of Jefferson.<br>
      Cloning was thriving in the era. Jefferson spawned Washington and Gable.<br>
      Clones also included Webster.<br>
      Don<p></p>
