      <p>Correcting an error in an earlier post:<br>
      Webster is not a clone as such. Rather, it is a light weight version of Washington width.<br>
      Boston/Central was proud of the design for the Jefferson fonts and used them as the top featured fonts for its 1892 specimen book.<br>
      Don</p>
