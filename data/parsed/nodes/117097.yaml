    html: |-
      <p>The name Thuvia is derived, of course from Burroughs' "Thuvia, Maid of Mars", one of the John Carter stories.  Do a google search for thuvia images, and you'll find the book cover that must have inspired Lee.</p>
      <p>But I think Ryuk nailed it with Bauer's Gable.  As I noted above, the only uses for this font are on the book spine, and none of the letters are identical to one another (e,g, all 3 O's and both E's are different) which I assume to be inconsistent with any kind of manufactured type.  My theory is that in 1894 someone at Tribune Printing designed a one-off plate for use on the spines and modeled it after the then-new Bauer Gable (which may have been available in an uncondensed version at that time).  I ultimately did the same thing--tracing the image and having a magnesium engraving made.</p>
