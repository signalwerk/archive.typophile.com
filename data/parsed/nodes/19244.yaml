    html: <p>I think that Bauhaus and Swiss design were in a way intended to be anti-nationalist, and to a certain extent they succeeded. The championing of sans for text—which was neither German nor the custom elsewhere—was an important part of this. And so was the effort at being ’neutral’. If you compare Futura and Goudy Sans you have a very striking difference in direction. So I think the anti-nationalism thing would be an interesting contrary note in the exhibition.</p>
