      <p>Thanks for the encouragement and the great tips already. Keep them coming!</p>
      <p>On Morison: do you have a citation for the “English” claim about TR? I’d be very interested to work that in.</p>
      <p>On Gaelic: a superbly relevant idea that hadn’t occurred to me. I would love leads on it. (I just browsed <a href="https://web.archive.org/web/20081120080114/http://www.spd.dcu.ie/library/LIBeng/Special%20Collections/spcoll4cent.htm">here</a> which hinted at the roller-coaster ride.) </p>
      <p>On non-Latin type: I am open to ideas beyond Latin type. That said, the research for the exhibition will be done by me and my graduate students, so language may prove an obstacle for some areas; moreover, to some extent the exhibition must be built around the objects that are accessible and available for display, which may prove limiting too. On the other other hand, the borders between Latin and other letterforms might be the very most important spots to investigate the role of nationalism. And I would certainly expect that with Russian nationalism and Communist internationalism at play, issues in Cyrillic type design of the period might be fascinating.</p>
      <p>Thanks again for your stimulating input!</p>
