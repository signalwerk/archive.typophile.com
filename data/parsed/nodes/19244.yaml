    <p>Hi all</p>
    <p>I am presently putting together a proposal for a museum exhibition on the intersections of type design and national identity. The era I have in mind spans from the end of the nineteenth century to the middle of the twentieth (essentially the era dominated by production for Monotype/Linotype machines). </p>
    <p>I am looking for two kinds of ideas: suggestions of appropriate “case studies” that fit the theme; and suggestions of what types of “objects” might make for an engaging exhibition of historical type design.</p>
    <p>For the case studies, I already have some ideas in mind, such as<br>
    - Norwegian identity and Gerhard Munthe’s revival of medieval lettering<br>
    - Koch and the modern German blackletter<br>
    - Gill’s Sans as against nationalism and internationalism<br>
    - modernization and standardization efforts in Weimar Germany (with an eye to international markets)<br>
    - the changing Nazi policy on blackletter<br>
    - Frutiger and Swiss design education<br>
    - Zapf’s Palatino and the meaning of Italian Renaissance at midcentury<br>
    - Goudy, Dwiggins, and the development of an American type design</p>
    <p>For the objects, any suggestions are welcome. I am sure I could display books that show some of the types at issue. I also think it’d be nice to show a linotype slug or the like, if I can get my hands on one. I’ll particularly be looking into local (Twin Cities, MN) special-collections libraries for exhibitable material. </p>
    <p>I appreciate all input you can offer on both of these questions. Thanks in advance.</p>
    <p>Craig.</p>
