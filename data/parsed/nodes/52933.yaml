    <p>This didn't go over very well the first time I posted it. But, my clan's motto is "Gang Forward" which I think means we're too stupid to give up. So here we are again.</p>
    <p>Copper Penny is a revisitation of Copperplate Gothic. It features some new character forms and a complete lower case set.</p>
