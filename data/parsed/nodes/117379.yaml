      <div class="comment-spam-body"><p>The inline effect on the curved portion of your _D_ seems to be like this </p><div class="imageWrap"><img src="http://typophile.com/files/ITCBodoni72InlineTestCurvedLetterD_3674.jpg"></div><br>
      I am not certain what tools you are trying to use to create these curves manually. If you can use Fontshop it's easy. Use the parallel line tool to make something that looks like this <div class="imageWrap"><img src="http://typophile.com/files/ITCBodoni72InlineTestCurvedLetterDinside_5713.jpg"></div><br>
      Merge the contours. <div class="imageWrap"><img src="http://typophile.com/files/ITCBodoni72InlineTestCurvedLetterDinsideMergedContours_4487.jpg"></div> Delete everything except the segment that will form one side of your inline curve.<div class="imageWrap"><img src="http://typophile.com/files/ITCBodoni72InlineTestCurvedLetterDinsideDeleteAll ButContour_5924.jpg"></div> Break this contour at the short side and convert to lines. <div class="imageWrap"><img src="http://typophile.com/files/ITCBodoni72InlineTestCurvedLetterDinsideBreakContour_6740.jpg"></div><br>
      Do the same thing to make the other side.<br>
      Join the two segments so as to make the correct length.<div class="imageWrap"><img src="http://typophile.com/files/ITCBodoni72InlineTestCurvedLetterDinsideJoinSegments_4138.jpg"></div> Merge contours and delete all but the final inline portion. <div class="imageWrap"><img src="http://typophile.com/files/ITCBodoni72InlineTestCurvedLetterDinsideFinalInline_4306.jpg"></div> Place into the letter. <div class="imageWrap"><img src="http://typophile.com/files/ITCBodoni72InlineTestCurvedLetterDinsideFinalLetter_5728.jpg"></div><br>
      Don<p></p>
      </div>
