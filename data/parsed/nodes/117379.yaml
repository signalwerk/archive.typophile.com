    html: |-
      <p>The process described by Don can also be done in Adobe Illustrator (or Corel Draw if you wish).<br>
      For Illustrator: Convert the letter to curves, make a copy of /D's external outline and instead of the "parallel line tool" you can use Object=&gt;Path=&gt;Offset Path and specify a negative value.<br>
      The rest of process is similar.</p>
      <p>You can't create a new font with Illustrator off-course, but you have the advantage to process each letter once and then use it on whatever image resolution you want without loosing any details.</p>
