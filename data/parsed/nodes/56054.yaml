      <p>Okay I chose two existing weights I had from a previously designed font 'Light' and 'Bold'  then I chose 'Blend Fonts' and created my MM file and in seconds created a 'Thin' version and generated the instance of it…</p>
      <p>So I guess using MM's is just a hyper efficient way of dealing with weights and widths… although like anything automated it still requires manual clean up and tweaks.</p>
