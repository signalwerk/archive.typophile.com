    html: |-
      <p>Why manually create an MM fonts instead of using the "Blend Fonts" command? Working in MM space ensures that your master fonts remain compatible. The number of ways things can get messed up is much more limited.</p>
      <p>No, interpolations are not particularly similar to using the bold effect command. They have different pluses and minuses, essentially. Generally better, but there are things to watch out for. Read Adobe tech note 5015 on MMs:<br>
      <a href="http://www.adobe.com/devnet/font/pdfs/5091.Design_MM_Fonts.pdf" title="http://www.adobe.com/devnet/font/pdfs/5091.Design_MM_Fonts.pdf">http://www.adobe.com/devnet/font/pdfs/5091.Design_MM_Fonts.pdf</a></p>
      <p>Cheers,</p>
      <p>T</p>
