    <p>I have a few questions regarding MM builds to create a range of typeface weights for the future…</p>
    <p>1. Is there any available multiple master Fontlab sample files anywhere? I learn better by seeing and doing and I'd like to look at the inner workings of one if possible.</p>
    <p>2. Are the interpolation results similar in their imperfection as using a bold effect feature? I assume their would be considering any type of automated process is by nature, imperfect. (I've already downloaded RMX 1.53 in anticipation assuming it will only help the process of manipulation and accuracy further)</p>
    <p>3. What is a good weight combination to start with, I vaguely remember reading posts that mention a certain combination… i.e. start with light and bold but nothing too extreme in range?</p>
    <p>Thanks,</p>
    <p>Mike</p>
    <p>PS: I just opened an existing font I have, I've defined a 'Weight' axis, I see the Axis palette, I've selected between the masters but do not see 'different masters appearing as outlines of different colors', nor does anything seem to happen when I select either 'master' and adjust the weight slider? Am I missing something here, what do I have to do to get things to happen here? lol</p>
