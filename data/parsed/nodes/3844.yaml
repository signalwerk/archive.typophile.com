    html: <p>According to John Bowman, "The most important Greek type ever was that designed for the Cambridge University Press by Richard Porson." (Greek Letters, p. 131) Although I wouldn't necessarily dispute that, I would certainly add that Porson's work was also in some ways a very important step <i>backwards</i> as well. In a textbook Modernist manner*, he banished ligatures from Greek, in the naive desire to make it easier to read. As if humans are computers. <br> <br>* If way before Modernism was an "official" movement. To me Modernism is actually the natural thought pattern of Western Civilization. <br> <br>hhp <br></p>
