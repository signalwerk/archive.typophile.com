    html: "<p>Scholderer's New Hellenic is definitely not Porsonic. New Hellenic refers back to the Complutensian Greek and other pre-Aldine styles, a development that began with Robert Proctor's Otter type. Proctor's <i>The printing of Greek in the fifteenth century</i> had a big influence on Scholderer. <br> <br>The Porsonic style is very distinct from the later developments of Proctor and Scholderer. Like the Aldine style, the Porsonic has upright caps and slanted lowercase. The most distinctive characteristic of the style are the lunate epsilon and the very round, full alpha. The Porsonic style is a kind of hybrid of the Aldine and Romantic styles but simplified and regularised. It looks like what it is: Richard Porson's meticulously neat Greek handwriting, which North Americans would call 'printing' because with few exceptions the letters do not join up.</p>"
    html_clean: "<p>Scholderer's New Hellenic is definitely not Porsonic. New Hellenic refers back to the Complutensian Greek and other pre-Aldine styles, a development that began with Robert Proctor's Otter type. Proctor's <i>The printing of Greek in the fifteenth century</i> had a big influence on Scholderer. <br> <br>The Porsonic style is very distinct from the later developments of Proctor and Scholderer. Like the Aldine style, the Porsonic has upright caps and slanted lowercase. The most distinctive characteristic of the style are the lunate epsilon and the very round, full alpha. The Porsonic style is a kind of hybrid of the Aldine and Romantic styles but simplified and regularised. It looks like what it is: Richard Porson's meticulously neat Greek handwriting, which North Americans would call 'printing' because with few exceptions the letters do not join up.</p>"
