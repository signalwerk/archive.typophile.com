    html: "<p>I used to go to Greece a lot as a kid; as an adult I was there in July*, and previous to that 7 years ago. Greek food is amazing. Mediterranean cuisine in general is the best. Fortunately LA has a lot of good restaurants from every culture. Greek fonts: I think non-Greeks did a lot of damage in the past (like Porson, and even Aldus), but in the computer age the Greeks themselves made things worse. But it looks like in the past decade there's been a lot of discontent (in a good way), so soon we might see a major renaissance. <br> <br>* <br>I gave a talk at a typography conference in Thessaloniki (a wonderful town). <br>It was an earlier (and longer) version of this: <a href=\"http://www.themicrofoundry.com/ss_rome1.html\" target=\"_top\">http://www.themicrofoundry.com/ss_rome1.html</a> <br> <br>hhp</p>"
