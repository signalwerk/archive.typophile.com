  - id: 28851
    user: 1250
    date: 2002-11-05T13:47:00
    date_raw: 5 Nov 2002 — 1:47pm
    votes: null
    html: "<p> (From pumpkins to Porson... Isn't the internet amazing?) <br> <br>I was only at the conference the day I was on. Your town simply had too much to offer! <br> <br>Romulus was indeed a monster, but even in this age of (supposed) cultural sensitivity it has admirers. And it's interesting to note that some of our best Latin designers made some of the worst non-Latin fonts. Why is this? I think the reason is pride, a dangerous two-edged sword: it motivates creativity in what's your own, but also causes you to look down on what isn't. <br> <br>The problem I see with Porson is one of my main contentions with the whole of western philosophy, and its love of simplification; humans are not simple things - ligatures are *useful*. Plus the one thing he should have \"simplified\" (removing the slant that Aldus so wrongly implemented), he didn't. <br> <br>There seems to be a lot of Greek type designers these days, but my acquaintance with them is as limited as my understanding of the script. That said, the person who has so far impressed me the most on the ground is Katsoulidis; there's also Gerry Leonidas, who has great depth of knowledge. <br> <br>As for most Greeks not caring, yes, it's a problem, since change comes quickest when people have awareness. But as long as there's less people who favor Latinized type than those who want to return to authenticity, that's not so bad. In the 70s, when Carter was making those Latinized fonts, he was following the direct wishes of his Greek clients. He really couldn't have said \"shame on you for betraying your culture\"... Who wants to become a martyr for somebody else's culture? (Well, I guess the idle bourgeoisie does, with their \"Free Tibet\" bumper stickers...) I think it's a very high reflection on Carter that he had enough of a reaction to the cultural bankruptcy of his Greek clients to make Cadmus (and then Skia). <br> <br>hhp </p>"
