    html: "<p>In Britain, Porson may be seen as the turning point in the sense that before his new type almost all Greek set in Britain used the Aldine style, with or without diacritics. On the continent, the Didot romantic style had already spread rapidly, and this too was generally set without ligatures. But I think the absence of ligatures in both these styles needs to be seen as a response to the decline in the use of ligatures that had preceded their development. <br> <br>It should be noted that the Porsonic style remained an almost purely British phenomenon: it was never takem up on the continent, nor in Greece.</p>"
