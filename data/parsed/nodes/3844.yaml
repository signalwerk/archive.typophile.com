    html: <p> So Hrant you were at the conference in Thessaloniki! I stay in Thessaloniki and I took part in the conference, so we may met.  <br> <br>I agree with you that the "latinized" of greek letters by various non-greeks made damage (to me the most horrible example was Van Krimpen's "Romulus", but I like Porson's types).  <br> <br>I guess, you propably know Yorgos Matthiopoulos and the Greek Fonts Society. People like Yorgos and Klimis Mastorides are our hopes for this  renaissance you mention...but to be honnest, maybe 1 in 10 graphic designers in Greece really care about the identity of the form of the greek letters, not to say that adjusting the forms of latin fonts seems ideal to them...and that's why I think Matthiew Carter is one of the great designers of our times, but he did make damage in the development of the greek design identity. </p>
