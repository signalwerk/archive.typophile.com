    html: "<p> greece's problem is its complex to highlight its relation to ancient greece and to insist that it has been the cradle for western culture to which we want to belong now, \"forgetting\" that for a long period greece belonged to the east... <br> <br>that's why we regard anything imported from the west as something divine and consider some eastern traditional achievemets as not so cool... <br> <br>there is a need for us to understand the evolution of greek fonts...  <br> <br>if you think of the fact that the design of greek fonts until the end of the 20th century was an import, you'll understand that there is no greek history at all... <br> <br>so we come to the dilemma for \"new\" greek font designers: to start again with the bycantine legacy (historically correct, but difficult to introduce) or to follow the achievements of the foreign teachers (also difficult, if you work with a criteria)?.. <br> <br>there is also a third solution, which is being followed by new greek font \"designers\" and which is the most common habit here:.. to take a latin font and use the latin lc \"n\" as an lc \"eta\", the latin lc \"s\" for the final lc \"sigma\", the latin lc \"z\" for the lc \"zeta\", et al...  <br> <br>this is happening, because there is no historical self-conscience and, as a bigger reason, it is faster to implement and faster to be sold (if sold, because the greeks seem to admire burt lancaster in \"the red corsar\")... <br> <br>and when you see that the need for new fonts in the greek market is concentrated mainly in the lifestyle magazine and advertising sector, then you'll understand the \"need for speed\" of a font design... globalization happens also here... <br> <br>and as long as greek designers will be profit-oriented followers (but kings in their village), there will be not much correct font development here in greece...  <br> <br>not to forget that in the only public eductional faculty in greece (tei of athens), where you can \"study\" for three semesters font design, you are taught by architects and painters... bright font designers, like katsoulidis and matthiopulos, teach graphic design and computer graphics in the same faculty... <br> <br>(so i guess from pumpkins to porson, we have got now to greece's problems in the sector of education) <br> <br>as far as for your excuse that dolmades are not suitable for the greek version of your bitmap font, i don't understand why you tried it on dolmades and not on pumpkins, which can also be found in greece... <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> </p>"
