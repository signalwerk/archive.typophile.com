  html: |-
    <p>The typeface is created by Berlin based typedesigner Melle Diete.<br>
    Fidelia is a dynamic, disconnected script-typeface.<br>
    It combines the hand-drawn aspects of classic scriptfonts with<br>
    disconnected modern display fonts of today.<br>
    Fidelia is available in 4 weights and has many alternate letters,<br>
    ligatures, ornaments and features for typographic variety:<br>
    choose between normal styles, the swash-letters-feature and extra-swashes.<br>
    The caps are available in three style versions as well.</p>
    <p>Have a look: <a href="http://www.mellediete.com/fidelia.html" title="http://www.mellediete.com/fidelia.html">http://www.mellediete.com/fidelia.html</a></p>
