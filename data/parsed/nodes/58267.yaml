      <p>The “original typeface” category page over at the <a href="http://www.ed-awards.com/index.php?option=com_easygallery&amp;Itemid=634">ED-Awards</a> website only lists the Gold and Silver winners. But the winners of Bronze prizes are as follows:</p>
      <p>Bree, from TypeTogether<br>
      FC Autobahn, from Autobahn<br>
      Planeta, from Dani Klauser Graphic Design<br>
      Nabil, from Emanuela Conidi<br>
      Kina, from Francesca Bolognini<br>
      Texteron, from Cape Arcona Type Foundry<br>
      Fedra Hindi, from Typotheque*</p>
      <p>The real props should go over to the folks at Suitcase Typefoundry, who won not only the typeface competition’s gold medal, but also won the Jury Prize for the whole ED-Awards 2009 competition! Maybe this shows that good type is more important than logos or posters or brochures or anything else ;-D</p>
      <p>*Again, the site doesn’t have details up for this, but Fedra Hindi is what Vinu is talking about. Go Satya!</p>
