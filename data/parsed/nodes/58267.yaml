    <p>Quote from Dan’s blog:<br>
    &gt;&gt;&gt;<br>
    “My typeface family Malabar received a silver award at ED2009, the European Design Awards 2009 competition. Malabar grew out of Martel, a multi-script design that I initially created in 2008 on the MA Typeface Design course at the University of Reading. The Latin component of the family is distributed by Linotype, and you can buy it here.</p>
    <p>The design’s success was announced on Sunday, 17 May 2009, at the ED-Festival in Zürich. Malabar received the silver award in the original typeface category. This isn’t Malabar’s first distinction; its six Latin fonts received a Certificate of Typographic Excellence in Type Design at the Type Directors Club of New York TDC² competition in January 2009. “</p>
    <p>&lt;&lt;&lt;</p>
    <p>It is available for sale through Linotype at:<br>
    <a href="http://www.linotype.com/5831/malabar.html" title="http://www.linotype.com/5831/malabar.html">http://www.linotype.com/5831/malabar.html</a></p>
    <p>Great Stuff, Dan! We are all proud!!!</p>
    <p>ChrisL</p>
