    date: 2007-12-17T15:20:00
    date_raw: 17 Dec 2007 — 3:20pm
    votes: null
    html: |-
      <p>A, V, v, w, y are really too wide.</p>
      <p>The b is aesthetically strange, but it probably helps legibility.<br>
      You might want to try to find a way to make the descender of the g not so big.</p>
      <p>The rest of the design is nice and solid, though I think one pixel is missing from the diagonal of the M, and the serif on the bottom of the h may be closing it too much.</p>
      <p>The numerals are my favorite. I like that they have their own height.</p>
  - id: 247239
