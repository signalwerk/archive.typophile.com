    html: <p>Sure. They're mostly in Latin American typefaces, as Spanish considers Ch to be one letter, but Porchez incorporated one into <a href="http://www.typofonderie.com/alphabets/view/CostaPTF" rel="nofollow">Costa PTF</a> (you can see it in the sample on the page). You can see one in <a href="http://www.tipo.net.ar/pdf/chaco_v1.0.pdf" rel="nofollow">Chaco</a>, and a really fascinating capital CH lig in <a href="http://www.tipo.net.ar/pdf/Lineare_Serif_v1.0.pdf" rel="nofollow">Lineare Serif</a>. And a Google search of Typophile (which next time you may want to do before posting :-) ) turns up <a href="http://www.typophile.com/node/20590" rel="nofollow">this thread</a> on the same subject.</p>
