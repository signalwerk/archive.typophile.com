    html: |-
      <p>Nicely put Tiff!</p>
      <p>My advice regarding ligation would be to think about the balance of the c as it is written and to think of it in 2 strokes not one. Think also about the heavy serif you sometimes see hanging on a Cap C. It's often there for a good reason - and seeing that reason may translate into a better ligation.</p>
      <p>But to echo Tiff further get the relationships of the letters right. Look at the white spaces. Look at what reads easily and feels natural vs what feel bullied into shape.</p>
