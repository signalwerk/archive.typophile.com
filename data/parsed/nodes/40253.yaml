      <p>You're welcome, Frode. I think we all enjoy helping each other. The beauty part happens when we disagree, create friction, and something completely new is born. :^)</p>
      <p>I have a slight aversion to the use of ligatures in display work as so many are overwrought. That isn't to say it shouldn't be done or can't be done or that I've not seen it and loved it. I'm just saying that it is something to do with caution and attention. Don't do it because you have a ligature, do it because it is the  natural and right thing to do.</p>
