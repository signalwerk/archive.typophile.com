  html: |-
    <p>I'm hand lettering a wine label and always seem to end up with to much air inside the "C" in "Château". (Probably cause I'm such a lousy typographer!) So, I'm wondering if you know any examples of a ligature combining the two letters.<br>
    Obviously, there is no need for a ligature to spell out the word, but I'm playing with it to achieve a decorative look.</p>
  html_clean: |-
