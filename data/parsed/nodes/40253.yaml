      <p>I was just gonna ask the same thing as Patty. :-)<br>
      What do you mean by litigate?</p>
      <p>Also... When I was a kid, back in the early 70s, there were a few two-letter combinations that had the same status as single letters -- in Spanish. <strong>Ch</strong> was one of them. <strong>Ll</strong> was another. In Spanish dictionaries, words beginning with "Ch" ("charco") or "Ll" ("lluvia") had their own section following "C" and "L," respectively... But in the late 90s, or maybe in 2000, the Real Academia Española demoted these double-letter characters, and they no longer enjoy the same status as the rest of the letters of the alphabet.</p>
      <p>Spanish link: <a href="http://www.elcastellano.org/consultas.php?Tag=alfabeto" title="http://www.elcastellano.org/consultas.php?Tag=alfabeto">http://www.elcastellano.org/consultas.php?Tag=alfabeto</a></p>
