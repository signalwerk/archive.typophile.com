      <p>John may have used "litigate" inadvertantly, or it may have been a typo Tiff, or a brain-typo.</p>
      <p>The SOE dictionary reckons:</p>
      <p><strong>Ligate</strong> past participle stem of Latin <em>ligare</em> tie, bind; Chiefly surgery---to bind with a ligatue or bandage.; specifically to tie up (a bleeding artery, etc).</p>
      <p><strong>Ligation</strong> late Latin <em>ligatio</em>. 1. The action or process of binding; the condition of being bound. 2. The action of binding with a ligature; especially in surgery.</p>
      <p>==============================================</p>
      <p>I think "ligation" and somehow it came back to you as "litigation"</p>
      <p>"mew"</p>
      <p>j a m e s<br>
      "the cat is <em>in</em>"</p>
