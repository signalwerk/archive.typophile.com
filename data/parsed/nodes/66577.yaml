    html: <p>While Typophile certainly does have admins, moderators are sometimes required to step in and *cautiously* arbitrate when things get out of hand. It doesn't happen often on Typophile (perhaps thanks in part to our admittedly easy to circumvent swears filter ;). Folks here are largely good people, but when this many passionate people get into it, sometimes things can get rough. If the moderation that happens is so light and behind the scenes that people don't notice it happening, I count that as a success.</p>
