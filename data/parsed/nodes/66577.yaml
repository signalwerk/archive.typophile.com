  html: |-
    <p>The administrators of this site are just that – administrators or admins. They are not “moderators.” A moderator prescreens content. Content is notoriously not prescreened on Typophile, resulting in spam post after spam post.</p>
    <p>The choice of terminology is important. (Times “New Roman” is not a “sansserif.”) “Moderator” connotes a degree of prior restraint that doesn’t exist. It also insinuates that immoderate comments will be censored. Whereas an admin merely administers a site and keeps it running.</p>
    <p>“Moderators” need to stop using that malapropism to refer to themselves. They’re admins, not moderators.</p>
