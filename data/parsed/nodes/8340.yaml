  html: "<p>Howdy, <br> <br>Any guesses as to the font used in Bjork's newest album? First off, its hard to read in the insert, and I've seen others kinda similar, but nothing like it - I don't think it has an uppercase (or isn't used anywhere) <br> <br>this is the best sample I could scrounge up from the net:  <br> <br><img src=\"http://www.typophile.com/forums/messages/83/56606.jpg\" alt=\"\"> <br> <br>You can also visit <a href=\"http://unit.bjork.com/specials/albums/medulla/\" target=\"_blank\">http://unit.bjork.com/specials/albums/medulla/</a> <br>for a few more samples. <br> <br>Cheers</p>"
