  html: |-
    <p>Dear Typophiles,</p>
    <p>I’m making a survey to determine which fonts are commonly installed on different operating systems.</p>
    <p>Please take a survey at:<br>
    <a class="freelinking-external" href="http://taat.pl/webfonts/">Web fonts survey</a><br>
    (it’s just one click)</p>
    <p>Please spread it.<br>
    Thank you for your help.</p>
    <p>As a reward:<br>
    1. If you want to see/print all your installed fonts,<br>
    use this JavaScript/CSS tool:<br>
    <a class="freelinking-external" href="http://taat.pl/fontlist">FontList</a></p>
    <p>2. CSS typographic attributes bookmarklet:<br>
    <a class="freelinking-external" href="http://taat.pl/firefox/#fontinfo">fontInfo bookmarklet</a></p>
    <p>regards,<br>
    Tom</p>
    <p>ps. We do not store any private information, file/license information.</p>
