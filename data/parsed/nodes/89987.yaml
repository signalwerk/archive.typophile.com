    <p>Hi,</p>
    <p>Bringhurst suggests in his 'Elements of Typographic Style' that you can choose a complimentary italic that doesn't necessarily have to be from the same family. I'm using ITC Fenice for the text face, can anyone suggest an italic to use instead of Fenice Italic? As much as I like it, I'd like something a bit more fancy and attractive.</p>
