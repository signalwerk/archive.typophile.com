  html: |-
    <p><strong>Dear fellow Typophiles,</strong><br>
    I thought  this would be the right place to share my latest work.<br>
    A calendar made of two thousand and fourteen keyboard keys.</p>
    <p>To upfront the production costs I did a Kickstarter campaign with an explanatory video that can be seen here:<br>
    <a href="http://www.kickstarter.com/projects/107717342/2014-typographic-wall-calendar" title="http://www.kickstarter.com/projects/107717342/2014-typographic-wall-calendar">http://www.kickstarter.com/projects/107717342/2014-typographic-wall-cale...</a></p>
    <p><iframe width="480" height="360" src="http://www.kickstarter.com/projects/107717342/2014-typographic-wall-calendar/widget/video.html" frameborder="0" scrolling="no"> </iframe><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/HOORAY-Harald-Geisler-Typographic-Wall-Calendar_5314.gif"></div><br>
    Horray! The campaign was funded successfully on 31. Dec 2013.<br>
    The print size is A0 (84cm x 118,8cm) and reproduces the composition in its original size.<br>
    Now it is available through my website:<br>
    <a href="http://haraldgeisler.com/order-prints" title="http://haraldgeisler.com/order-prints">http://haraldgeisler.com/order-prints</a><p></p>
    <p>Since you are all contributing to this <strong>wonderful</strong> forum that I find it often very <strong>helpful ( &amp; sometimes entertaining)</strong> to read in, I would like to make you a offer:</p>
    <p><strong>Order one signed Print (25€) and I will send you additional four prints for free (a total of five) - and 14 Typographic Postcards (see pictures below)! </strong></p>
    <p>Simply drop me a line after you have placed your order - I will then add the extra copies and postcards.</p>
    <p>Before you ask:  Yes the shipping is super expensive. The shipping is so expensive for a reason: the poster is rolled in placed in a poster tube(expensive) and simply very long (112cm) — to ship something that big is expensive.</p>
    <p>This is what the print looks like:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/2014-Montage---druckfertig-iso300-1200px-breit_5411.jpg"></div><p></p>
    <p>I hope you enjoy the work.<br>
    Typographic or non-typographic feedback either directly or through mail is welcome.<br>
    Spreading the word is appreciated.</p>
    <p><em>Yours Sincerely &amp; HAPPY NEW YEAR!,<br>
    Harald Geisler</em></p>
    <p>Here are the Postcards (in total there are 14 motives included in the set - all reproduce the keys in their original size):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Imissyou_5997.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/EmailMe_5677.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/HappyNewYear_6398.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/thankyou_4578.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/Hello_5349.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/YesNoMaybe_3973.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/writing_5954.jpg"></div><p></p>
