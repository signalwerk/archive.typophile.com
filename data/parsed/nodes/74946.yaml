      <p>Some stores in older parts of Valletta and Sliema have very nice crafted signage. Made of nice wooden frames and glass painted with hand lettering at the back. sometimes angel guild is imitated by putting wrinkled aluminum foil behind it. More and more these signs are replaced by ugly modern ones, but I am sure you can find some and/or posters with pictures of these old shops. I think it is based on English (and maybe Italian) tradition, sice Malta used to be a British colony.<br>
      Second best thing is diving.<br>
      Third best thing is the balcony of the restaurant of "Hotel British" 40 Battery Street - 267 St. Ursula Street, Valletta with a wonderful panorama view over the harbour.</p>
      <p>Sorry for my bad English, I'm Dutch. Have a very good vacation!<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Business-Shop-Front-Malta_5791.jpg"></div><p></p>
