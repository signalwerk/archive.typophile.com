      <p>The buses were pretty cool, I didn't think to check those properly. There's a bus station in Valletta where they all idle - that would be a good place to catch them I reckon.<br>
      I saw a few nice things, if your into manuscripts and such, the museum in Mdina (not the Natural History one, the Cathedral one) has a collection of letters and documents from the Knights. Your not meant to take photos, but i got a few off discreetly. Hopefull that won't vex anyone too much.</p>
      <p>The rest are <a class="freelinking external" href="http://lifu.co.uk/?pg=malta" rel="nofollow">here</a></p>
