    html: <p>There seem to exist two glyphic versions of the capital barred H. One with two equal horizontal strokes in the middle, one with a normal H crossed through by a bar in its upper half. – Can you explore this a little bit? I’d love to see some real-world snapshots which show the true local feeling for this.</p>
