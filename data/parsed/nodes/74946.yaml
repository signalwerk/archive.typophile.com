      <p>Maltese is an unusual-looking language, as far as those that use the Latin script go.<br>
      It has the idiosyncratic "he" (h-bar), and lots of hyphenated words, doubled consonants, u-less q's, and dot-accent characters.<br>
      Lots of high-scoring Scrabble words.<br>
      I would be interested to see what the indigenous script form of it looks like, from hand-lettered signage.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/eastern_europe_5423.1190214000.street-sign.jpg"></div><p></p>
