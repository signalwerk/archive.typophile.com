      <p>I am not prepared or willing to recommend any printer because of how “green” they are. I share Gerald’s skepticism about the current bandwagon everyone seems mad to jump on; I’m sure you’ve heard the term “greenwashing”.... I’m past the idealistic stage (my 20’s) where everything had to be ideologically pure. Give me real green solutions, like riding a bicycle, or not printing anything in the first place....  ;)</p>
      <p>However I have a local printer who has a fantastic range of processes he offers. From Intaglio etching to letterpress (large old cast-iron standing press), to offset, puff ink, screen print, vinyl plotting, he’s very interested and capable. Very pleasant to work with and his dogs are adorable to boot. But Eileen, you give absolutely no clue where you are, so I’m not sure if this printer is for you.... Why do you ask? In any case, it’s John Sullivan at Logos Graphics in San Francisco. To locals, I recommend him heartily; he likes working with artists and designers.</p>
