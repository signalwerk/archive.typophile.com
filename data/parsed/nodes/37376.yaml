      <p>max</p>
      <p>Interesting question. Paper has been fairly okay for quite some long time, ever since the paper mills discovered that acid-free papers were cheaper to produce in the long run. Acid ate the pipes. The ink manufacturers comply with federal guidelines and respond to consumer demand (not always so good, re: soy). Solvent manufacturers are really on top of it and have discontinued useful products and substituted green crap that actually destroys rollers and presses. So, basically, you get what you want and are willing to pay for, for better or worse. </p>
      <p>What about the printer? Hey, folks who claim they are green just to get your green, come on. What ever happened to folks who would guarantee you quality printing?</p>
      <p>Gerald</p>
      <p>The Bieler Press<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
