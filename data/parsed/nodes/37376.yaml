    <p>In light of these two recent threads: </p>
    <p><a href="http://typophile.com/node/36940" title="http://typophile.com/node/36940">http://typophile.com/node/36940</a><br>
    <a href="http://typophile.com/node/37356" title="http://typophile.com/node/37356">http://typophile.com/node/37356</a></p>
    <p>I think it would be enormously helpful to have an open thread where experienced typographers and graphic designers list their best printers. Personally, I need more environmentally friendly printing resources, but even more, I want to support small artisan printers, true craftsmen, that do great work (William Morris would be proud, huh?) I don’t have a big, slick printer I *love* in my virtual roledex, either.</p>
    <p>I, for one, would like to give a shout out to <a> Black Pearl Press.</a></p>
    <p>Anyone else have a printer they count on to do extraordinary work? Links would be great ... locations can be anywhere. </p>
    <p>Thanks,<br>
    Eileen<br>
    <a href="http://www.eileenburke.org">Eileen Burke Graphic Design</a></p>
