      <p>Realistically, green advertising/promotion is just hype. And converting to green is all about money. Corporations that have been raping the plantet for years are paying services to make them appear as if they are green. Seen a car commercial on TV lately? </p>
      <p>Printing is not green; it is one of the most wasteful industrial processes there is. Soy!!! They are cutting down the Amazon Rain Forest (the lungs of the planet) to grow soy. Soy inks are “aggressive” to ink rollers, resulting in their early replacement. Come on folks. Care about the Earth, not about what it is hip to care about. Do some research before jumping on the band wagon.</p>
      <p>Gerald</p>
