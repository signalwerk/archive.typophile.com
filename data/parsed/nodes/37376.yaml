      <p>I’ve done a great deal of research on the topic. While Gerald makes a valid point about many, many corporations, I know there are truly green options available for printing. </p>
      <p>UV Curable Inks are the most environmental option, soy clearly isn’t a sustainable choice. Water based UV curable inks produce no VOC’s (which about 99% of all other inks produce) which have been proven to accelerate climate change AND bring harm to human health.</p>
      <p>UV Curable inks are widely available in Europe, but harder to find in the US. (BTW, the link that Alaskan posted above is a printer that offers them.)</p>
      <p>The best paper option is TCF (Totally Chlorine Free) but it’s real hard to find in the US.  Dioxin is a by-product of chlorine bleaching, and it’s an evil toxin that kills  flora, fauna and humans.  (It’s the chemical that almost killed President Viktor Yushchenko during an assassination attempt.)  Chlorine bleaching also uses copious amounts of water.</p>
      <p>As far as other substrates, stay away from PVC. When PVC is discarded, burning it produces nasty chemicals into the environment. </p>
      <p>Eileen</p>
