    <p>Hi all,</p>
    <p>I need an organiser (agenda in dutch.. I believe that is an organiser in english, right?). I'v been looking everywhere to find a nice typographic one, but can't find any.<br>
    Well... I probably haven't looked everywhere. I've checked veer.com. Nice stuff.. but no organisers and they don't seem to ship to Europe... WHY NOT!??! I finally got a job and I can spend some money on cool typographic stuff... and they just don't ship it to Holland.. =(<br>
    I also checked fontshop and some other font foundries, but didn't get lucky. I did get the little notebook from fontshop in the mail the other day, but it's a notebook and it doesn't give me dates where I can write stuff down.</p>
    <p>If anyone knows a nice typographic organiser please let me know!</p>
    <p>cheers,<br>
    dav2.</p>
