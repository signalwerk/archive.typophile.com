      <p>I'm not sure if this counts as a "typographic" organizer, but I love my Ordning + Reda organizer. The company is Swiss and they have stores in Europe. The organizers are type only, no pictures. I absolutely love them, although they are no longer sold in the States (you have to ship it from the UK).</p>
      <p><a class="freelinking external" href="http://www.ordning-reda.com" rel="nofollow">http://www.ordning-reda.com</a></p>
      <p>regards<br>
      sarah</p>
