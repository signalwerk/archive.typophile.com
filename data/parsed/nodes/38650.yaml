    <p>Hello, I have some works stored in a <code>.smi</code> “self mounting image” disk created on MacOS 9.<br>
    I have the old Disk Copy 6.33 classic application, but I can’t open the file.<br>
    I don’t have access to a machine running MacOS 9.<br>
    Could you please hint me at one OSX utility that does this job ?<br>
    Thank you.</p>
