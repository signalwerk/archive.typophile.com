    <p>Hi folks.</p>
    <p>I'm working at a project to make OpenType(CFF) fonts in FontLabStudio5.<br>
    I made a Multiple Master font(1 axis) to make a weight family.<br>
    Each master needed to have a differense positioning value (ex. valt or palt),<br>
    but I didn't know how to input positioning value to each master.<br>
    How do I input these values to each master?<br>
    Even if I can input these values into it, how can I get medium positioning value of two masters?<br>
    I want to get these values automatically just like the kerning values.<br>
    Does anyone know the clue?</p>
    <p>Best regards.</p>
