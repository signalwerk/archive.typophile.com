      <p>I think the edge effect takes place at every size, though there may be some scale effect. I haven’t yet read the literature. It is also interesting that more is going on in the interaction of black and white than the edge effect alone—or at least the edge effect is complex. </p>
      <p>There is an illusion known as the Hermann grid illusion, which you can see here:</p>
      <p> </p><div class="imageWrap"><img src="/files/Hermann_grid_illusion_3451.svg.png"></div><p></p>
      <p>This was explained by the ’lateral inhibition’ and the edge effect, but that explanation as the whole story has been refuted by a <a class="freelinking-external" href="http://www.michaelbach.de/ot/lum_herGridCurved/index.html">version with wavy lines</a>, in which the phantom grays at the intersections disappear.</p>
      <p>Evidently, it makes a difference whether lines are straight, and whether they are horizontal and vertical etc. </p>
      <p>Though it works at text and display sizes, the question is where it is appropriate. In another discussion, I questioned whether the ’picket fence’ effect was something always to be avoided in type design. Nick Shinn rightly pointed out that in display type particularly you might want ’dazzle’. He designed <a class="freelinking-external" href="http://shinntype.com/">Eunoia</a> specifically to have that dazzle. </p>
      <p>I think in the lower case of text types it should really be avoided and counteracted.</p>
