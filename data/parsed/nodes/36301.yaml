      <p>I would have thought it was the other way round. I think that the edge effect only affects a narrow band around the edge; at display sizes, you mostly see what’s there, but at text sizes, the edge is relatively larger, and it’s small enough for your eyes (really your brain) to deceive you.</p>
      <p>I hope that makes sense.</p>
