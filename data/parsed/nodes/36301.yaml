      <p>Eben, after reading about the edge effect, I am thinking that it is more useful to think of specific aspects of the black-white relationship in type, rather than talking about ’notan’ generally. For it seems that they are different variables as far as perception. </p>
      <p>The stuff about ’activating the whites’ or ’designing the whites’ I am thinking is mainly about using the edge effect to make letters more vibrant, though Frutiger may have had more in mind. </p>
      <p>Yes, I think a periodicity is quite a different variable from the edge effect. It does concern the distribution of black and white, though, especially through spacing. I think that it is a major, not minor matter in text. This is reinforced by an illustration in Unger’s book, where he has excessively tight, loose, and irregular spacing. The irregular spacing is strikingly the most disruptive to reading. </p>
      <p>&gt;I prefer to think of Notanic balance </p>
      <p>As I said, I think using this one term is misleading because it puts these different phenomena—edge e</p>
