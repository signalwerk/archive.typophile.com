      <p>This is an interesting summation. Thanks for doing the work to build it up!</p>
      <p>1. I think that the ’edge effect’ is a hardwired optical illusion or that is of course part of the basic reality of whatever visual stimulus is being considered. In a way Notan is an acknowledgment that while we have ways of cutting up &amp; interpreting and labeling things especially in terms of light &amp; dark; there is ’a priori’ to any of that; a sensory reality which is a totality not a duality. So yes indeed; the edge effect can help to explain some phenomena within a person’s pre-analytic (Notanic) visual experience.</p>
      <p>So I agree that the ’edge effect’ can be considered syththeticly with Notan. One way of synthesizing the two might be to say that while a machine, let’s say a scanner may detect the actual or measurable values of - let’s say of a page of text - it’s the human sensing of that page including many factors/illusions such as the ’edge effect’ but before conceptualization occurs that is the Notan of that page.</p>
      <p>2. I think that while you can find rhythm or periodicity in some latin text forms, and the latin text may benefit from it to some minor degree I am having trouble making a meaningful connection of Notan or the ’edge effect’ to it. To my way of thinking the edge effect would of course be present it because edges are involved but that seems to be the end of it. Maybe I am missing something.</p>
      <p>3. <cite> This avoids distraction from the distinctive letter shape as the only different thing to be detected or read by the eye. </cite> You put this well. Of course I prefer to think of Notanic balance because ’evenness’ sounds a little too mechanical, programatic or even literal (50/50) to me. Nonetheless I agree that whatever you call it - the goal should be to support rapid accurate recognition/processing of the forms by minimizing tonal distractions. </p>
      <p>Would you expand on your ideas about the screen?</p>
      <p>I have been hearing about how low rez sound taxes the brain to fill-in the missing music which leaves the brain less receptive to emotional content in the music. Do you have something like that in mind?</p>
