      <p>I put ’even color’ also in the title of this thread also, so here are my ruminations after reading about the ’edge effect’.</p>
      <p>There are three different aspects of the relationship between black and white involved in a good roman text face. </p>
      <p>1. Use or avoidance of the edge effect to enhance ’activate’ the whites possibly even having ’dazzle’, as discussed above. </p>
      <p>2. A degree of regular rhythm or periodicity of the black verticals. This has been shown by Fourier transforms, and provides a regularity or grid against which the varying shapes of the letters are detected or ’read’ by the eye and brain. </p>
      <p>3. Evenness of color. The density of the blacks in each letter, within the x-height particularly, is similar, and distributed in as balanced as way as the letter permits. This avoids distraction from the distinctive letter shape as the only different thing to be detected or read by the eye. </p>
      <p>One more thought:</p>
      <p>Could the edge effect or ’lateral interference’ be a reason why screen type is hard to read? Does low resolution and lit-from-behind type cause the neural network to be taxed?</p>
