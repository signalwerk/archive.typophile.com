    html: |-
      <p>Finally!</p>
      <p>Marcelo, you’re correct. It’s Kigara designed by Elena Albertoni.</p>
      <p><em>Kigara was Elena’s first attempt at designing a text typeface. The result is not exactly a conventional book face.<br>
      Strongly influenced by handwriting, Kigara is best suited for short texts set at medium to large sizes. However, its open letter shapes and subtle serifs make it a very readable face in smaller sizes as well. Kigara will also make headlines as a modest, light-hearted display typeface.<br>
      Kigara is named after an African mushroom - hence the mushroom vignettes and African ornaments in the OpenType version and the ‘B’ set. Both the sets also include small caps, alternate figures, special ligatures and other expert glyphs.</em></p>
      <p>It’s your turn now! :)</p>
