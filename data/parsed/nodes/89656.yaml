  html: |-
    <p>The 2012 APHA (American Printing History Association) Conference has chosen "At the Crossroads: Living Letterform Traditions" as its subject. It will be based at Columbia College Chicago Center for Book and Paper Arts and held on October 12–13, 2012.</p>
    <p><a href="http://www.printinghistory.org/programs/conference.php" rel="nofollow"> General conference info</a></p>
    <p><a href="http://www.printinghistory.org/programs/conference/2012/call_for_papers.pdf" rel="nofollow"> PDF of call for papers. </a> Proposals are due March 15, 2012. The guidelines are very broad.</p>
