  html: |-
    <p>Hello,</p>
    <p>I am looking for a Medieval typeface that I can use for a poster that subtly hints at being Medieval and not one that is over   flamboyant and difficult to read.</p>
    <p>Any suggestions would be much appreciated!</p>
    <p>Free typefaces would be best but please suggest all - free is just a bonus.</p>
    <p>MrKerner</p>
