    html: |-
      <p>Rotunda is good, but maybe still a bit too medieval.</p>
      <p>I guess I am looking for Medieval with a bit of modern too.</p>
      <p>Cloister is quite nice - Medieval. I do like the 'e' and the 'k'.</p>
      <p>Jenson could be another possibility. </p>
      <p>A typeface with a bit more Medieval to it would be great.  Something in between Rutunda and Cloister.</p>
