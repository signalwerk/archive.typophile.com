    html: <p>How subtle a hint are you looking for? You may be thinking of something like <a class="freelinking external" href="http://www.myfonts.com/fonts/ef/cloister-old-style-b/" rel="nofollow">Cloister Lightface</a> (another version <a class="freelinking external" href="http://www.p22.com/lanston/cloister.html" rel="nofollow">here</a>) (and <a href="/wiki/https%3A/%252Fwww.fontshop.com/fonts/downloads/urw/urw_cloister_old_style_ot/" class="freelinking" rel="nofollow">still another</a>) or (less subtle) <a class="freelinking external" href="http://www.myfonts.com/fonts/woodentypefonts/jensen-old-style/" rel="nofollow">Jenson Oldstyle</a> instead of a rotunda, although rotundas are highly legible.</p>
