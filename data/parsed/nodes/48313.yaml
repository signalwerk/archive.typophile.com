    <p>I am running the CS3 suite on a Mac - US version (also tried this on Windows - US as well with the same results), and every time I try to use any of this set of Chinese fonts, Adobe apps crash. Interestingly, Fireworks, which was not originally made by Adobe handles the fonts fine. MS Word on Windows also has no problem. But Illustrator, InDesign, and I believe P-shop and Flash as well all bomb on startup if the font is activated. Can anyone take a look at one of the fonts and tell me why this happens, and how it can be rectified?</p>
    <p><a href="http://www.sino.uni-heidelberg.de/edv/fonts/HDZB_75.TTF" title="http://www.sino.uni-heidelberg.de/edv/fonts/HDZB_75.TTF">http://www.sino.uni-heidelberg.de/edv/fonts/HDZB_75.TTF</a><br>
