    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Štorm Type Foundry</strong></p>
    <p>The Storm Type Foundry was founded in 1993 in Prague, Czech Republic, by type designer <a href="/wiki/Frantisek%20Storm" class="freelinking" rel="nofollow">František Štorm</a>. It specialises in revivals of classic typefaces, and the library includes contributions by <a href="/wiki/Jan%20Solpera" class="freelinking" rel="nofollow">Jan Solpera</a> and <a href="/wiki/Josef%20Tyfa" class="freelinking" rel="nofollow">Josef Týfa</a>.</p>
