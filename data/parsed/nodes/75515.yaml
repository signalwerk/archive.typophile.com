    html: |-
      <p>When you say "slanted" are you referring to italic type, or to the type baseline being on a slant?</p>
      <p>Perhaps the old Federal Express' logo is the kind of thing you're thinking of. I did some design work for Federal Express back when they were using the old logo and one problem we often had was that the slant made the entire logo look crooked even when the bounding box was perfectly straight.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fedexlogos_5519.gif"></div><p></p>
