    html: <p>But, the latin characters might not be Wanpaku Gothic. Probably they are <a class="freelinking-external" href="http://www.fontworks.co.jp/typography/fontsample/classic/rodin_ub.html">Rodin</a>’s latin characters. Rodin is also a Japanese font from Fontworks. So, the two fonts are mixed. I don’t know its substitutes.</p>
