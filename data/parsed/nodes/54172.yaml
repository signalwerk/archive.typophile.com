      <p>Thanks Jan! Both the headline and body text are indeed TheAntiqua. I think it's the regular weight of TheAntiqua B used for both; the headline is of course tightly tracked and might be slightly condensed. I was pretty sure I'd seen the typeface before, but I started doubting when I couldn't come up with anything.</p>
      <p>In headlines, TheAntiqua comes across as more friendly to me than the somewhat austere Rocky, perhaps too informal. I guess it's the lack of sharp corners. Maybe I'm just used to headlines employing display cuts with greater stroke contrast and fine details.</p>
