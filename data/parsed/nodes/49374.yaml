    <p>In typographic circles, old-style figures (OSF) are generally preferred over lining figures (LF) for body text because they integrate better with lowercase letters. There seems to be a trend of returning to typographic elegance, so to speak, with many of the newly designed digital fonts having OSF as the default.</p>
    <p>However, there are certain fields where the use of OSF may not be appropriate. Zivatar, a lawyer, has asserted that OSF are not suitable for legal writing on a number of occasions, in the following threads:</p>
    <p><a href="http://typophile.com/node/49288">Typography for Lawyers</a><br>
    <a href="http://www.typophile.com/node/37541">Advice for legal pleadings</a><br>
    <a href="http://typophile.com/node/41921">Typefaces for use in legal practice</a></p>
    <p>I invite people to comment on whether there are certain fields where one should be using LF instead of OSF, and what the reasons are. While it certainly makes sense to me that LF is better for certain technical fields of writing, I would still like to hear the rationale.</p>
    <p>For mathematical writing, for instance, LF would be strongly preferred over OSF. One sees mathematical texts using LF not long after the introduction of LF to the typographic palette, such as 1822’s <em><a href="http://books.google.com/books?id=VeQGAAAAYAAJ&amp;printsec=toc&amp;source=gbs_summary_r&amp;cad=0">An Introduction to the Elements of Algebra</a></em>. I do not remember seeing any mathematical texts from the last century using OSF.</p>
    <p>I would venture there must be a few reasons beyond tradition and familiarity for this. For example, one frequently sees multiple levels of super- or subscripting in mathematical writing, and the alignment will be difficult to keep track of for OSF. Consider the following, where the expression on the left is meant to represent Exp(38). Because OSF are used, there is a chance it might be read as Exp(3^8), the expression on the right, especially by readers who are used to seeing LF in mathematical texts.</p>
    <p></p><div class="imageWrap"><img src="/files/exp38_5745.gif"></div><p></p>
    <p>Also, a LF zero is less likely to be confused with the letter o, which is used in the ’little o notation’, for example.</p>
    <p>What do people think about this issue? Are there other fields where LF may be preferred to OSF? What are the advantages and disadvantages each of these types of numerals provides for different fields of writing?</p>
