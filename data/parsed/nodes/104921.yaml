      <p>hi mike, here are the examples i was talking about:</p>
      <p>hadassah cursive (henri friedlaender): it wasn’t produced in the end because after the test that is shown in the picture below, henri friedlaender realized that there would need to be fundamental changes, such as a change of the whole rhythm. this would have been too much work and so, only the regular and the semibold were produced. (that’s roughly what he writes about it)<br>
      text and picture from Henri Friedlaender, Die Entstehung meiner Hadassah Hebräisch<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/HadassahVorprobe_DSC06213_5756.jpg"></div><br>
      david (ismar david):<br>
      picture from typo magazine 25<br>
      <div class="imageWrap"><img src="http://typophile.com/files/25_2007_TYPO-31_david_5369.jpg"></div><br>
      david hadash (linotype): <a href="http://www.linotype.com/en/6712/davidhadash.html" title="http://www.linotype.com/en/6712/davidhadash.html">http://www.linotype.com/en/6712/davidhadash.html</a><br>
      days and nights (ben nathan): <a href="http://www.hafontia.com/portfolio/" title="http://www.hafontia.com/portfolio/">http://www.hafontia.com/portfolio/</a><p></p>
      <p>william, thanks for mentioning masterfont, i will have another look at their catalogue ! (but it is right that the masterfont’s narkisim is masterfont’s interpretation and not zvi narkis’s narkisim?)<br>
      you were right that i am looking for more than oblique versions as i want to know how the inner structure of hebrew letters can change in a way that can be compared to the differences between a regular and a cursive style for the latin script (fluency, dynamic of strokes, change of terminals, etc.).</p>
      <p>thanks for your comments, nicole</p>
