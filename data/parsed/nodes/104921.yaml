    html: |-
      <p>The italic fonts for Latin seem to be designed in such a way that a single word, phrase or sentence in a page of regular may be instantly seen and stands out distinctly on the page.  This is not the same as 'emphasis' for which bold might do better.  Indeed the italic is often lighter on the page but is still very apparent.  </p>
      <p>The image above with ktav yad amidst regular Hebrew text doesn't acheive this.</p>
      <p>I just looked at a few Hebrew novels and found on pages of (I suppose) Frank Ruel, some sentences in the same typeface but inclined.  To my inexperienced eye, this did not look satisfactory.<br>
      Mike</p>
