      <div class="comment-spam-body"><p>william,<br>
      yes, i know about the hebrew cursive (what i didn’t know was that it’s called ktav yad – thanks ;-).<br>
      i actually designed a text typeface that consists of three styles – an upright (hebrew square script), a cursive (like david’s cursive) and a script (like the handwritten shapes) – for both latin and hebrew script.(<a href="http://www.typefacedesign.org/resources/A5specimen/2010/NicoleFally_MissInformed_specimen.pdf" title="http://www.typefacedesign.org/resources/A5specimen/2010/NicoleFally_MissInformed_specimen.pdf">http://www.typefacedesign.org/resources/A5specimen/2010/NicoleFally_Miss...</a>)<br>
      so i am particularly looking for text types. i know only one example where the hebrew cursive was designed as a secondary style. it is from another reading student and was designed a couple of years ago. unfortunately, i don’t know her name yet and only have this low quality photograph.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/DSC03461_typophile_5680.jpg"></div><p></p>
      <p>you write, the hebrew cursive has its own tradition. do you know where its shapes come from ? i could hardly find information about its origin. stephen lubell writes, ‘The cursive script has been in daily use for several centuries amongst various Jewish populations and continues to be used in modern Israel. In contemporary Israeli display typography and lettering for advertisements, the cursive script has come to be used as an element of graphic differentiation, due to its distinctive forms and calligraphic feel.’ (The Hebrew Typeface Designs of Zvi Narkis)<br>
      but that’s more or less all i could find about it.</p>
      <p>michel,<br>
      thanks for the link and the example !<br>
      i think, the rashi script is a possible variation. as far as i know, it was and is closely connected to religious usage and evokes religious associations. that’s why i didn’t consider it to be an option for the design of a style that is included in a text typeface that should be ‘neutral’. i might be wrong with that assumption !?</p>
      <p>mike,<br>
      thanks !<br>
      i like these ligatures too and hadn’t yet seen them.</p>
      </div>
