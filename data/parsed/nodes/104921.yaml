      <p>Even in Israel there is plenty of variation from the standard "Ashkenazi cursive". I quote "Ashkenazi" because plenty of these variations are among Ashkenazim! </p>
      <p>My own personal writing is a blend of the standard 'cursive' and printed one and I have never received a complaint. The most commonly modified ones are shin, mem, and ayin from what I have seen.</p>
      <p>I also really don't like the standard tzadi and peh sofit. I just make those as they normally look. It sets me apart as an oleh, but it looks much better to my eyes and feels smoother to write.</p>
