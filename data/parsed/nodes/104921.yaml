      <p>Nicole,<br>
       The script form in your post from 29 Jul 2013 is a variant of Ashkenazi cursive. The other form of importance would be Sephardi cursive; <a href="http://en.wikipedia.org/wiki/Cursive_Hebrew" title="http://en.wikipedia.org/wiki/Cursive_Hebrew">http://en.wikipedia.org/wiki/Cursive_Hebrew</a> has a decent chart (from the 1906 Jewish Encyclopedia). I don’t know how widely used actual Sephardi cursive is outside its (declining) use for Ladino, but “Rashi script” (A.K.A. Rabbinic cursive) is a variant in use.<br>
       See also <a href="http://onthemainline.blogspot.com/2009/04/rashi-script.html" title="http://onthemainline.blogspot.com/2009/04/rashi-script.html">http://onthemainline.blogspot.com/2009/04/rashi-script.html</a>.<br>
      —Joel</p>
