    html: <p>Nicole, when I look at the various font shapes of the <a href="http://culmus.sourceforge.net/" rel="nofollow">Culmus Project</a>, I see nothing indeed that resembles Rashi (that is not even available as a postscript font in the <a href="http://ctan.org/tex-archive/language/hebrew/makor/fonts/" rel="nofollow">CTAN makor fonts directory</a>; all you can get there is the metafont sources).  Those shapes date from the 12th century. More recent shapes were first considered by Ben Nathan and discarded. They nevertheless belong to the history of Hebrew complementary typefaces.</p>
    html_clean: <p>Nicole, when I look at the various font shapes of the <a href="http://culmus.sourceforge.net/" rel="nofollow" class="link-external">Culmus Project</a>, I see nothing indeed that resembles Rashi (that is not even available as a postscript font in the <a href="http://ctan.org/tex-archive/language/hebrew/makor/fonts/" rel="nofollow" class="link-external">CTAN makor fonts directory</a>; all you can get there is the metafont sources).  Those shapes date from the 12th century. More recent shapes were first considered by Ben Nathan and discarded. They nevertheless belong to the history of Hebrew complementary typefaces.</p>
