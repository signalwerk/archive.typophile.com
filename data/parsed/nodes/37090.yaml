    html: "<p>My thoughts: either something geometric (circular o's reflecting the bullseye) or something straight and sans-y. In that vein, try Hypatia Pro (available if you register for the new Adobe Creative Suite, but otherwise, I'm not sure), <a class=\"freelinking external\" href=\"http://processtypefoundry.com/typefaces/klavika/index.html\" rel=\"nofollow\">Klavika</a>, <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/jan-fromm/camingo/\" rel=\"nofollow\">Camingo</a>, <a class=\"freelinking external\" href=\"http://typography.com/fonts/font_overview.php?productLineID=100009\" rel=\"nofollow\">Verlag</a>, and <a class=\"freelinking external\" href=\"http://www.linotype.com/90672/avenirnext-family.html\" rel=\"nofollow\">Avenir Next</a>. I would think of more, but it's late where I am and sleep beckons.</p>"
