    <p>Hi Typophiles, </p>
    <p>Wondering if you could help me out with IDing the fonts used on this site: <a class="freelinking external" href="http://www.sousstyle.com" rel="nofollow">Sous Style</a>. I've also attached a screen shot.</p>
    <p>It looks like they're using a serif (in the CSS it specifies Baskerville, but I've not known Baskerville to look like that) and an unknown "Geometric Light" embedded typeface - but I'm having no luck identifying either.</p>
    <p>Thanks much!!<br>
    Michelle</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SousStyleSite_5854.jpg"></div><p></p>
