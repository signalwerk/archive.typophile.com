  html: <p>How cool is this? I've just found that the sister company to the design agency I work for started stocking <a href="http://www.icone.co.uk/clocks/font-clock-g270/established/sebastian-wrong/fontg270/" rel="nofollow">Font Clocks</a>, like the office clocks you'd get in banks here in the UK, but they've got 12 fonts that cycle through and mingle together rather than purely Helvetica. As far as I know, there's three sizes (I've got a mid-size one on order, the big one's too big for my house!)</p><div class="imageWrap"><img src="http://typophile.com/files/big_6575.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/medium_5386.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/titchy_6667.jpg"></div>As far as I know, I don't think <a href="http://www.icone.co.uk/clocks/font-clock-g270/established/sebastian-wrong/fontg270/" rel="nofollow">icône</a> can deliver to the US :( but I know they deliver Europe-wide...<p></p>
