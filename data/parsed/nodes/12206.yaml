    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Benjamin Krebs</strong></p>
    <p>the very short version:</p>
    <p>Formaly known as <em>Schriftgießerey der Andreäischen Buchhandlung</em>. The family name Andreä goes back to the punchcutter Hieronymus Andreä, who bought in 1666 shares of a press in Frankfurt am Main. In 1779 Benjamin Andreä adopted the young co-worker Johann Geaorg Augustin Krebs and passed all his property to him and his wife. In 1839 the name was changed into Benjamin Krebs. The foundry worked till its liquidation in 1933. The foundries <a href="/wiki/Ludwig%20und%20Mayer" class="freelinking" rel="nofollow">Ludwig und Mayer</a>, <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> and <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> take over the materials.</p>
