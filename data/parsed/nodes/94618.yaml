    <p>Ok these two are not exactly new, but have never been posted here. Comments are appreciated!</p>
    <p><a href="http://kateliev.com/images/TYPOCallista.png" title="http://kateliev.com/images/TYPOCallista.png">http://kateliev.com/images/TYPOCallista.png</a><br>
    <strong>Callista</strong><br>
    Short Description:<br>
    Callista (from the Greek for "most beautiful”) is a fat cursive typeface, inspired by the works of François Boltana in the early 1970s and </p>
    <p>those of Milka Peykova in late 1970s.</p>
    <p>Further reading and links:<br>
    Behance <a href="http://bit.ly/kabehance" title="http://bit.ly/kabehance">http://bit.ly/kabehance</a><br>
    MyFonts <a href="http://bit.ly/kacallista" title="http://bit.ly/kacallista">http://bit.ly/kacallista</a></p>
    <p><a href="http://www.kateliev.com/images/TYPOGaytan.png" title="http://www.kateliev.com/images/TYPOGaytan.png">http://www.kateliev.com/images/TYPOGaytan.png</a><br>
    <strong>Gaytan Sans &amp; Serif</strong><br>
    Short Description:<br>
    Gaytan (Bulgarian for braid) is a fresh new insight on archaic letter forms. A family of two unicase typefaces – a modern looking sans and </p>
    <p>more classic looking serif, equipped with many alternates, so they can suit any typographic taste.</p>
    <p>Further reading and links:<br>
    Behance <a href="http://bit.ly/GaytanBehance" title="http://bit.ly/GaytanBehance">http://bit.ly/GaytanBehance</a><br>
    MyFonts <a href="http://bit.ly/MFGaytan" title="http://bit.ly/MFGaytan">http://bit.ly/MFGaytan</a></p>
