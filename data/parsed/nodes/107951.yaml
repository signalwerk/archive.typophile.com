    html: |-
      <p>Hi Pablo, the menu gives an idea of how the font treats much of the alphabet, and even includes the ampersand and half the numbers.<br>
      If you do not see any suggestions from any of the other typophiles within the next few weeks, you might do best to consider this to be a "lost font."<br>
      If you really want to get the font you might have to invest in recreating something similar. If you don't make fonts yourself, an efficient approach would be to show the menu to someone with some ability to use a felt marker to replicate the lettering and add the missing letters. You could then have the alphabet scanned and edited by a "starving fontmaker" for a relatively small amount. The supply of fontmakers with sufficient skills far exceeds demand for their services.<br>
      Don</p>
