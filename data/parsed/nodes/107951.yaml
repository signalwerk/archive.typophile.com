    html: |-
      <p>Hi Pablo. Is it possible that the bar is still operating under the same management? If so perhaps you could ask them what font they used for their menu.<br>
      The tone is like a fusion of Mistral or Choc with Blackletter -- a welcome relief from the flood  of thick creamy food fonts. After at least seven years of obscurity, this font font deserves wider circulation.<br>
      I am surprised that none of our Typophiles -- most of whom who have played the font ID game for longer than me -- have no leads on this mystery marker.<br>
      BTW, do you have any more letters?<br>
      Don</p>
