      <p>Renko, your mention of Volkswagen made me look up VAG Rounded on Google... Until now, I had no idea that VW was <a href="http://en.wikipedia.org/wiki/VAG_Rounded">the origin of this typeface</a>, and I'd always wondered what <a href="http://en.wikipedia.org/wiki/Volkswagen_AG">"VAG" stood for</a>!</p>
      <p>Until now, I had always identified Futura with Volkswagen, because of Helmut Krone's famous ads for VW in the United States.</p>
