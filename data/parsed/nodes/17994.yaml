    html: <p>you actually can expand a automatically created dashed line into individual dots. its really a stupid thing that when you do it the normal way that it reverts back to a solid line though. anyways, here is how you do it. in your preferences setting in illustrator, change the transparency flattening setting temporarily to all vectors (on the slider bar, move it all the way to the right i think). then choose that line, and flatten it. This is the only way I have ever been able to figure out how to do this in illustrator.</p>
    html_clean: <p>you actually can expand a automatically created dashed line into individual dots. its really a stupid thing that when you do it the normal way that it reverts back to a solid line though. anyways, here is how you do it. in your preferences setting in illustrator, change the transparency flattening setting temporarily to all vectors (on the slider bar, move it all the way to the right i think). then choose that line, and flatten it. This is the only way I have ever been able to figure out how to do this in illustrator.</p>
