  html: |-
    <p>Couldn't find anything here about this.  But I am really annoyed with this.</p>
    <p>I am working on a business card design and the dotted line border isn't perfect.  The corners aren't the same, sometimes they have a dot at the exact corner, sometimes a space.  No matter how much I tweek the spacing of the dashes etc. I can't get it to be perfect.</p>
    <p>One thing that would work is if I could expand the object and just finesse the dots manually.  But it just turns into a solid line when expanded.</p>
    <p>Any help here would be appreciated.  That dotted line is going to be blind embossed so I really would like to get it right.</p>
    <p>Here's a pic:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/comp2.jpg"></div><p></p>
