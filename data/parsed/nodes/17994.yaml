    html: |-
      <p>To make a row of aligned shapes really fast, you could do this:<br>
      Create the first shape and put it at the extreme left position, then holding shift and alt, drag it to the right approximately the distance you want between each dot, and release everything - that'll make a copy of the first shape, in the new position. Then press CTRL+D several times. For each time you press, a new object will be created at the same distance from the former. Once you fill the whole width of the card, fine tune using distribute/align and you're done.<br>
      (Maybe you knew this already, but anyway...)</p>
    html_clean: |-
