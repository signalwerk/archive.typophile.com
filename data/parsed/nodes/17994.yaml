    html: |-
      <p>You can also use the type along a path feature, using bullet points and justification.</p>
      <p>I'd check with your print finisher to see if they are happy to attempt blind embossing those dots, I think it will be tremendously difficult to accurately emboss a large number of business cards, especially that close to the edge. Also the weight and type of the card will affect the final effect (too heavy and absorbent and the dots will start to join). Of course it is possible but it might stretch the budget.<br>
      Tim</p>
