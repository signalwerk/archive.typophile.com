    <p>Hi,</p>
    <p>I'm currently working on a logo for a friends wedding and am looking for some feedback. I'm going to have to draw this logo from scratch and so am looking for some tips on how to do that successfully (I'm normally used to editing existing fonts rather than drawing them freehand).</p>
    <p>This sketch shows how it currently looks. The letters will be filled (the second 'm' of Emma and the 'v' of Steve will be filled red). I'm generally happy with the look of 'Steve', but 'Emma' looks unbalanced due to the height of the 'E'. Any help at all is appreciated at this point.</p>
    <p>Thanks</p>
    <p>Dave</p>
