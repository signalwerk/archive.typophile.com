    html: |-
      <p>In this case "Emma" is dominated by "Steve", allthough she's sitting on his back.<br>
      :)</p>
      <p>I'd suggest to horizontally align "Steve" with the first "e" and take away the strong feet of "S", "t" and the second "e". In my opinion this would not only improve the balance between both names but also lead to a better overall Gestalt. I'd stay with the connection of "E" and "S" and would propably also combine "m" and "t". The seperation of the second "m" and the "v" feels too strict. Maybe getting the "v" combined to the first "e" and at the same time combining "m" and "v" on their right side will lead to a more subtle seperation and maybe make the heart a little less obvious, so it doesn't look so "planned".</p>
      <p>Would be great to see a final logo that says: "Emma and Steve form a heart in a magically surprising way!" Right now it looks like there's a heart with surrounding letters that read Emma and Steve, which is already very good but I think the message could be communicated in a more effective way.</p>
      <p>I really like your current approach and I'm looking forward to seeing more of it.</p>
