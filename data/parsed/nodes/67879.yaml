    html: <p>In my experience a good selling font sells around 1 or 2 items a week. But that can vary a lot. Some months sells are hot and some other colder. More expensive families sometimes sells one item a month but the amount can be higher that the monthly total of a good selling single font. I think it a good strategy  not to offer families in single weights but in small packages. If someone really want or need a font he will buy the pack.</p>
