    html: |-
      <p>I actually think the marketing aspect of a typeface is most crucial. Granted, I haven't sold a typeface yet myself because I haven't finished a professional one yet. However, I've purchased typefaces and I've realized I ignore many typefaces simply because of the bad way it's marketed. For example, on myfonts.com the section where you can try out the type is brilliant to get a clear picture of what you get, but it doesn't show what you can actually do with it in terms of design (composition, color etc.), and in case the typeface has OpenType features, it can only show the very basic ligatures and nothing more, not to mention the errors some typefaces present with certain letters with punctiation (rare case though). The gallery section of myfonts.com is therefor essential to sell the typeface. Jos Buivenga seems to understand the impact of proper marketing, from his indvidual typeface presentations to the exljbris website itself. I'm sorry to say, but most of the people who posted in this thread - regardless of how many licenses you've sold already - haven't mastered that aspect yet. I really think it's the essential part.</p>
      <p>The name of the typeface is secondary to the presentation, but still quite essential. I wouldn't recommend the use of double vowels (oo, aa etc.), but I do recommend the use of 2 or more different vowels whitout making the name unnecessarily long. Every vowel has a different psychological impact and association, so you might want to take that into consideration as well.</p>
      <p>As for the process of coming up with a name, I can imagine it's very different for everyone. I often search for obscure words and change them to my liking. I generally think words that have no obvious meaning work better. A typeface I'm working on is called "Célente" . The use of an acute accent isn't a smart thing, so I might remove it before releasing it, although I'm a bit afraid the pronunciation wouldn't be as intended then. In any case, it's a combination of "celeste"/"celestial" and "silentium" from one of my favorite aphorisms "silentium est aureum" (silence is golden). It's also smart to choose a name that contains one or more letters of your font that you would consider best, or characteristic for your typeface.</p>
    html_clean: |-
