      <p>After I had a laptop stolen and found out my backups weren’t working properly I had to recover a font in progress by extracting it from a PDF. It’s a pain in the ass. It takes less time to download a torrent of every commercial font released in the last twenty years. Anyone putting that much effort into stealing a font isn’t buying them to begin with.</p>
