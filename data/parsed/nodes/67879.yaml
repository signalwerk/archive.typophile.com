      <p>After making the stupid mistake of naming a font “Downturn” after the crap economy I’m trying to think more along Jonathan Hoefler’s advice and give fonts names that show off the better characters in the font and don’t contain any really ugly pairs. I’m also trying to stick with interesting words; Armitage was picked because it’s relevant to the name of my foundry, but also because it has some English bucolic charm (or at least it sounds like it does, I’ve never been to Armitage).</p>
