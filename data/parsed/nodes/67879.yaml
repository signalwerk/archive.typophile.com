    html: |-
      <p>Shinntype was founded 10 years ago, but I started 30 years ago, before digital.<br>
      I'm sure a "typical" career path would be different today, for many many reasons.<br>
      I started out as an art director with type design as a sideline, with fonts published by other "foundries" (FSI, Monotype) but that was before e-commerce, when direct mail was used to market fonts on floppies.<br>
      I think you'd have to make a greater commitment today, what with the technical and linguistic demands of OpenType, and the role of Reading and KABK in raising the bar, more players in the game, and the greater sophistication of web design and online marketing -- you can't pick it up as you go along so easily, and the culture is not so "Wild West" as it used to be.</p>
      <p>Everyone's market is slightly different.<br>
      I make a proportion of my income off commissioned work.<br>
      I have around 10 distributors.<br>
      My philosophy is Long Tail, incremental -- a lot of fonts, mostly large families, a lot of distributors, over a long time.<br>
      I don't follow trends, that way the fonts have durability. But it would be a slow way to get started now. Having a "hit" helps (mine was Fontesque), in fact that's what led me to believe that type design was a viable source of income.<br>
      So if you are starting out without a hit, it's a bigger commitment, a bigger leap of faith now.</p>
      <p>One advantage of e-commerce is that you don't have to live downtown in an expensive city to service clients.<br>
      I recently moved to a small town. People ask if I retired.<br>
      Actually, I read an article in Design Edge magazine that some hip young Toronto graphic designers are moving out anyway.</p>
