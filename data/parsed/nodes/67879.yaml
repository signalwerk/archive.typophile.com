      <p>Very few seem to make real money out of it, perhaps Tomi and surely Jos B. count among them. Gratulations. For all others, that means, 99% of the folks offering fonts (from rubbish to high quality) that busines is a mess. Because the market is hopelessly glutted with fonts. – You can hardly say what might push your sales, apart from placing obvious seasonal crowd ticklers (which is not everyone’s part). Even those: how long *will* they pay the rent? Nobody knows.<br>
      I have fonts to offer from under $10 up to $300 (package); all do sell but I’m far from earning a living from it. However, if you have spent about ten years on the development of a typeface, like I did, you won’t just drop it because of bad sales.</p>
      <p>If you think of earning money, don’t think of making fonts.<br>
      And vice versa.</p>
