      <p><em>I’m trying to think more along Jonathan Hoefler’s advice and give fonts names that show off the better characters in the font and don’t contain any really ugly pairs.</em></p>
      <p>That's something I <em>have</em> done. I've changed the name of a font I really liked because the <em>name</em> didn't show it off well enough.</p>
      <p>Having said that, I have a question about the ethical question of naming a font. I am presently working on a font that emulates a piece of Villu Toots' calligraphy. Since his work is the inspiration for the font, I'm considering naming it Villu, or Toots, or VilluToots. An Estonian calligrapher, Villu Toots passed away in the early nineties, so I don't have the opportunity to ask him if it's ok with him.</p>
      <p>I know other fonts are named after well known typographers... so my question is, would I be out of bounds naming this new font after Villu Toots? Would I be crossing any ethical boundries?</p>
      <p>P.S. I believe Jovica Veljovic may have known VIllu. Is there anyone here on Typophiles who knew him personally?</p>
