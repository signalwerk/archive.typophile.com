      <p>I'm a bit leery to put my two cents in here because I've been fortunate to make a living at it. </p>
      <p>I'm not sure why though. I know that some of my fonts are popular, but I'm not sure what makes a font popular. I tend to create things that interest me, but since this is my livelihood, I also create things that I think other people would like to have. When I design what becomes a popular font, it tends to have a snow ball effect. The more people see it used, the more they want it.</p>
      <p>And the popularity of one font can lead to the sales of other less known fonts. The question is, "What makes a font popular?"</p>
      <p>Look at this example... I have done some work that frankly, I think is mediocre, but does well... while there are other things I've done that I am so much more proud of, from a creative point of view, and they seem to fall through the cracks. </p>
      <p>The font that I've been updating lately (see the Polish ł thread) is called Corinthia, and it's sales have done quite well. While I'm grateful that it's popular, I know it isn't my best work. In fact, I'm a bit horrified with some of the decisions I made when I first created it many  years ago. That's why I decided to update it recently. </p>
      <p>On the other hand, one of my favorite fonts is called Babylonica, and it's not well known at all and thus hasn't sold well.</p>
      <p>Having said all of that... it's quite possible that the name of the font has a lot to do with its popularity, and so it sells. Another font that has done well for me is called "Inspiration." Could it be the name? </p>
      <p>I'd be interested to hear other people's thoughts on the naming of fonts. The process by which one comes up with a name.</p>
      <p>Rob<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/sale_font_5204.png"></div><p></p>
