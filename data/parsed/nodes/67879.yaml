      <p><cite>I'm curious at the possibility of being able to create fonts and somewhat make a living of them.</cite></p>
      <p>I don't know if you will be able to make a living making fonts. I have. Quite a good one actually. The type business is, well, a business, and a lot more complicated than most of you are aware of. When these threads came up in the past it always amused me that all the naysayers on earning a living in the type business were not in the type business. Thankfully this thread is taking a bit of a different track. </p>
      <p>What I find really interesting is that on Typophile the same dozen or so type designers names come up, as if they are the only ones whose work is of interest, but there are so many people in this business making a good go at it, whose names are hardly ever mentioned.</p>
      <p>As to worrying about your pdf samples. Password protect them against content extraction and stop worrying, as Mr Puckett points out, anyone putting that much effort into hacking a font out of a pdf is not a customer you want, need or will ever get.</p>
