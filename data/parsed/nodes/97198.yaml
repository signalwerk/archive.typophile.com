  html: |-
    <p>Hi, </p>
    <p>I was wondering if anyone recognized this type which appeared in a Russian book (Tango with Cows) in 1914. I think it is probably wood due to its size, but also I think that probably is based on a German design for roman (all the other types in the book have roman equivalents which were manufactured [if not originally designed by] german foundries.).</p>
    <p>Thanks!</p>
