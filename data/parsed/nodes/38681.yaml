    <p>I read through the posting guidelines, and do not think I’m going against the rules. If I am, I sincerely apologize.</p>
    <p>Basically, I was hoping one of you typophile gurus would be interested in taking on a business card design project. </p>
    <p>As stated, it is for a medical spa, so I need it to convey both professionalism and some refinement/luxury. I was thinking letterpress would add to the latter, but am open to discussions.</p>
    <p>I prefer something clean and relatively sparse, but again am open to ideas.</p>
    <p>More details can be provided as needed. I hope one of you has the time and the interest!</p>
    <p>we can also discuss payment options.</p>
    <p>I’m looking for this to be done sooner rather than later.</p>
    <p>hope to hear from you!</p>
    <p>pc</p>
