      <p>Adobe Jenson Italic, with the swashes, is great in itself, and you have the optical sizes to match the size you’re going to print. I’d try it first. </p>
      <p>By the way Poetica matches Minion. The structure of its italic is quite different from Adobe Jenson’s italic.</p>
