      <p>If LTC Metropolitan is not available in an opentype format, or if you don’t intend to use Metropolitan Roman to set the text, I would totally go for Poetica — simply because pairing two Venetian faces, one roman and one italic, is one tough act to pull.</p>
      <p>By the way, what was Poetica based on? It definitely have sharper hooks and more complicated (but rather conservative, in comparison to Arrighi’s) ligatures and swashes. Was it based on a more contemporary italic?</p>
