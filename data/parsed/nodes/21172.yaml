      <p>LTC Metropolitan Italic Alt was based on Beatrice Warde’s 1925 Arrighi design — you know, the one that was ’tamed’ and then paired with Roger’s Centaur? — and therefore, can be set alongside the likes of Adobe Jenson. You might, however, want to use the same roman for setting the main text.</p>
      <p>Or P22 Operina if you like to play rough. It was also based on Arrighi’s italic, by the way.</p>
