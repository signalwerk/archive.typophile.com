    html: |-
      <p>It's interesting that the sample has three P's and one doesn't match the other two. The only other repeated letters (I) are identical. So this is a font, but finding it is a problem, because it falls into the 'anyone could have made this' category of font design. You could scan through <a class="freelinking external" href="http://www.bowfinprintworks.com/Script14Pg1.html" rel="nofollow">Part 14 of the Script Font ID Guide</a> (Distressed Script), or look at Dafont (Brush) category.</p>
      <p>- Mike Yanega</p>
