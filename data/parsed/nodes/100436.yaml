      <p>Thanks, Nick. I'm very happy with how the entire group came out! I am most interested to see how Sliced gets used. It reminds me of a super-grainy woodcut style, and I hope offers an effect like no other face out there.</p>
      <p>I actually used hand edits, then some filters, then hand editing all over again on Slashed and Sliced and even on Carved. Went a little over the time I had planned, but hey, that's nothing new in my projects. :)</p>
