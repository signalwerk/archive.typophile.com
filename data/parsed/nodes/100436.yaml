  html: |-
    <p>I am happy to finally announce the release of "<strong>Lestatic</strong>", my largest typeface project to date, and one with a slightly more serious take than usual from !Exclamachine. It is available exclusively through <a class="freelinking external" href="http://www.myfonts.com/search/Lestatic/fonts/" rel="nofollow">myfonts.com</a>. The collection of 9 families and 27 styles includes a free mashup font to give a taste of the grungier sides of Lestatic. Also, for a limited time, Lestatic Lashed, a more stroked variant, is 75% off!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lestatic-preview-A_5234.png"></div> <div class="imageWrap"><img src="http://typophile.com/files/lestatic-preview-C_5981.png"></div><p></p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/cover-lestatic-brace_4250.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/cCSS_3601.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lashed-sale_4504.png"></div><p></p>
