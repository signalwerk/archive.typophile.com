  html: |-
    <p>what are your favourite fonts?<br>
    and why do you like them? which elements do you find particularly aesthetic? what is your typographic identity?</p>
    <p>some of my obsessions : </p>
    <p>ITC RONDA<br>
    BODEGA SANS (mcdonalds uses this)<br>
    BINARY (by mauricio reyes, used in sydney olympics!)<br>
    ROTIS SEMI SERIF<br>
    MYRIAD CONDENSED<br>
    typefaces designed by M/M<br>
    TORONTO SUBWAY<br>
    DIN<br>
    GILL SANS<br>
    APPLE GARAMOND<br>
    FUTURA<br>
    OPTIMA<br>
    VAG ROUNDED (innit the font that macs have on their keyboards?)<br>
    TRAJAN<br>
    SERPENTINE<br>
    ...</p>
    <p>overall i like fonts that have a systemic structure that combines both geometric / symmetric / prime and chaotic / asymmetric elements but look very proportionally balanced and geometrically, proportionally hierarchical.. so every chaotic looking element / ornament functions effectively in terms of geometry and proportion as a whole.. an abstract at once orderly superstructure! im still figuring out the means to pursue it further.. but i was wondering which typefaces do you like? and which particular elements keep you hooked?</p>
    <p>have a nice day<br>
    hun</p>
