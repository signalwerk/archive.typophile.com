      <p>I think you're kind of conflating typeface (the design) and font (the actual working specimen of a typeface). There's different takes of Garamond because different designers and entities interpreted a similar "family" of typefaces differently. Yes, different Garamond fonts are actually based on different typefaces! If you had access to some of the original printed material, you too could make your own version of Garamond. </p>
      <p>But you can't take Adobe's Garamond Pro and tweak it and sell it as your own (without some special agreement with Adobe) - even though Adobe's Garamond Pro is an interpretation of material that's out of copyright and in the public domain. In other words, if you draw it yourself - fine. If you just use somebody else's font file and just make a few tweaks here and there, try to sell it/pass it off as your own, all without having the appropriate okay's from the copyright holder of that font-file - heap o' big trouble and pretty unbecoming. </p>
      <p>To stir up the mud some more, some EULA's actually allow you to modify the font but only for personal use and never for resale/redistribution. Hope this helps.</p>
