  html: <p>I asked about modifying typefaces and the legal ramifications of doing so, but what about the different versions Garamond for example where there's ITC, Adobe.. etc. etc. different versions. Can you get special permission to modify and redistribute a typeface? is Garamond so old that copyright laws don't apply?</p>
