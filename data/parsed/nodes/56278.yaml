    html: <p>In the US where letter-shapes cannot be copyrighted, yes you could legally copy a particular typeface's letter-shapes and use them as your own. Ethically or morally though is a whole different question. This may mean you could "legally" copy a particular font's letter-shapes and "create" your own font (although some would argue that this is not really creating). Again, there is a moral/ethical side to the question that should be addressed. In the end, it would be best if you drew your shapes from source material that exists in the public domain and keep a good record of your process and work. If there is any question, you can always point to your documented trail and prove that you did the work and the interpretation is yours and thus the font you developed is your own creation. Again, not a lawyer, so don't take my ramblings as legal advice. Rather it's just an opinion of a fellow typophile.</p>
