    html: <p><img src="http://www.typophile.com/forums/messages/29/29127.jpg" alt="set type"> <br> <br>so this is some of the type "set".  i'm having trouble getting the kerning pairs i set in fontographer to work in illustrator or quark. they seem to reset themselves somewhat. does anyone know why this happens? any help would be most appreciated. <br> <br>the main idea as far as promotional material will go is as follows. the type is in a ficticious journal that was found and was written by mary shelley's frankenstein while he was exiled in the mountains. each promotional piece (posters, mailings, web banners,etc.) will contain some of the writings from the journal but will not disclose who the person writing it is until the  internet movie i create comes out and in it  we finally discover the true identity of the author. any thoughts on this concept?  <br>thanks, <br>austin</p>
