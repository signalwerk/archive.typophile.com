      <p>Si, you’re good!</p>
      <p>2003 - Hermann Zapf - awards ceremony in Chicago, May 2003<br>
      2004 - Ed Benguiat - awards ceremony in San Francisco, TypeCon2004, July<br>
      2005 - Matthew Carter - awards ceremony in New York, TypeCon2005, July<br>
      2006 - Adrian Frutiger - awards ceremony in Berne, Switzerland, August<br>
      2007 - David Berlow - awards ceremony in Seattle, TypeCon2007, August</p>
      <p>We’ll get more info on the SOTA site soon.</p>
