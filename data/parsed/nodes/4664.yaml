    html: <p>Hi Roh. I read your critique.My reply- The Lux work is supposed to look minimalist (or generic as you described it). Lux is located between upscale independent clothing stores and restaurants. It is not supposed to look expensive (nor inexpensive). The prices are a bit higher than most cafes ( as well as quality), but it was not owners desire to specifically express the aspect. This is Seattle and most people do not care if it costs a bit more. People wanting Starbucks or Tullys can walk a block in any direction and find either (again this is Seattle). Lux is different from both of these large Espresso mega chains. Lux venue is sometimes host to a variety of events from Dj music nights, poetry, art openings, etc. But none of these events are on regular schedules, nor part of Lux's core business.  <br>The identity has served the client well for the last few years. Besides, it's businesscard (which features logo) was recently published in a graphic design book " Best of Businesscards 6" from Rockport Publishing, so I guess at least some industry folks find it is attractive and functional sincve it was picked over 1000's of other entries.  Their older logo is shown below. At the time this logo was used, furniture was mostly handmade wrought iron, and place had more of a casual "artsy" feeling. This was partially changed because people would hang out all day and buy less. New identity and interior changes improved sales and brought profits up to help owner sell business which was her desire with the changes. <br> <br><img src="http://www.typophile.com/forums/messages/29/35521.jpg" alt="old lux"></p>
