    html: <p>I concur with Daniel. in addition I think your instructor must lack some passion, if everyone seems to be going in the wrong direction I suspect this instructor could not make a living in the real world and decided to teach instead. Unfortunate for his/her students, but regardless, the students can still do the quality work for themselves regardless of how low the standards the teacher places on passing or even good grades. <br> <br> <br>Here is am example of some work I did a few years ago. that I think is nice and well though out. Exterior circular logo was not designed by me . My task was to improve and build upon what was existing-at the lowest cost possible. <br> <br>I would expect you can tell a lot about this place (price point, atmosphere, services/products, etc...) without any written explanation.  <br> <br>It is a hip coffeebar, they show art, they serve great coffee,  <br>they offer crepes and waffles for breakfast. Neighbor hood is  <br>Belltown, just north of Seattles' downtown business district, urban, somewhat stylish clients. Simple. <br> <br><img src="http://www.typophile.com/forums/messages/29/35445.jpg" alt="lux"> <br> <br>boxed "X" is closed sign, Lux logo was re-created as interior identity/art with flourescent lights-simple, cheap post modern. <br>Food icons were placed on windows in vinyl by entrance.Top image was postcard. (mechanical shark may look familiar it was  <br>on MTV for a while after someone from thee saw it at the cafe and licensed artist for use on MTV) </p>
