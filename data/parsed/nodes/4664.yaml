    html: "<p>My apologies with the Lux post. I wanted to show something simple, and should have done something with subject at hand instead of dragging up my old work to illustrate my point. <br> <br>back on track... <br>With regard to Jive 89. Perhaps looking into to roots of the word Jive and the culture in started in may be a good direction to take. I looked up the word in dictionary and came up with <br> <br>1. Jazz or swing music. <br> <br>2.The jargon of jazz musicians and enthusiasts. <br> <br>3.Slang. Deceptive, nonsensical, or glib talk: �the sexist, locker-room jive of men boasting and bonding� (Trip Gabriel). <br> <br>As for the work you have shown, it is a bit cryptic for most, although I am personally a sucker for numeric looking type design. The numeric thing has been done a lot, especially in magazine design (David Carson/Raygun for example), but is it dead ?-not sure. On it's way out-properly. Maybe to be on the safe side try to stick with just the inverted 3, and drop the rest of the numeric characters. The inverted 3 is properly the least cryptic of the batch. You can style it a several ways to make it more or less \"3\" like. example. <br><img src=\"http://www.typophile.com/forums/messages/29/35536.jpg\" alt=\"3\"></p>"
    html_clean: "<p>My apologies with the Lux post. I wanted to show something simple, and should have done something with subject at hand instead of dragging up my old work to illustrate my point. <br> <br>back on track... <br>With regard to Jive 89. Perhaps looking into to roots of the word Jive and the culture in started in may be a good direction to take. I looked up the word in dictionary and came up with <br> <br>1. Jazz or swing music. <br> <br>2.The jargon of jazz musicians and enthusiasts. <br> <br>3.Slang. Deceptive, nonsensical, or glib talk: �the sexist, locker-room jive of men boasting and bonding� (Trip Gabriel). <br> <br>As for the work you have shown, it is a bit cryptic for most, although I am personally a sucker for numeric looking type design. The numeric thing has been done a lot, especially in magazine design (David Carson/Raygun for example), but is it dead ?-not sure. On it's way out-properly. Maybe to be on the safe side try to stick with just the inverted 3, and drop the rest of the numeric characters. The inverted 3 is properly the least cryptic of the batch. You can style it a several ways to make it more or less \"3\" like. example. <br><img src=\"http://www.typophile.com/forums/messages/29/35536.jpg\" alt=\"3\"></p>"
