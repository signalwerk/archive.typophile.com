    html: <p>Although im only a newbie to this forum, isnt it bad form to hijack someone else' s thread? and yet it has so far been a bit me me me with this lux business.... <br> <br>Im from seatle myself -- Starbucks and Tullys arn't the only coffee shops in town, it  would be a mistake to compare oneself to them, much like it would be to compare a restaurant to mcdonalds in a design sence. <br> <br>In the industry you see a lot of varying design work and i happen to agree with what Roh was saying about how the lux design style is very generic and to me does not speak what the cafe is all about but presents a sterile view of a design style that is used everywhere. <br>Does the coffee get served in a sealed plastic cup and rubber gloves? <br> <br>*              *                  *             *               * <br> <br>Getting back to what we should all be here for....Andy Campbells logo... <br> <br>Very nice andy, the typography is stylish and unified, and straight away it says new and up beat. <br>Perhaps a little color would pick it up a beat . <br> <br>I would say that the restaurant side of things would come out in its surrounding elements, and no more is needed in the primary logo to say this. <br>It is nice, simple and memerable too, everything a logo should be.</p>
