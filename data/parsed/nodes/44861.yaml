    html: |-
      <p>The true Trajan forms were first done with Brush and then chiseled, according to Fr. Catich's research and trials... the serif being the cleanup stroke. See The Origin of The Serif . I think the Requiem caps are in part, the bowls, a hybrid of Old Style and Transitional.</p>
      <p>Classica and Prestige owe a tremendous debt to the Zapf tradition.</p>
      <p>Michael</p>
