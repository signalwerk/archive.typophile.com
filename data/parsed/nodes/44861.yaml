      <p>There is the classical, transitional Roman, Schneider Antiqua, Werner Schneider (Berthold). Light to bold, with non-aligning figures. Lovely waisting forms but not in the Trajan column ethos. A contemporary interpretation of the forms without the perspective distortion of Trajan..</p>
      <p>Michael</p>
