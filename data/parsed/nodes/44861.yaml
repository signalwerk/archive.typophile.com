      <p>Just sort of hanging out on this one Miss Tiffany. Brioso Pro is phenomenal, too bad Adobe did not have their marketing team on top of this one, Robert did a phenomenal job on it. Under appreciated! By the way... Classica and Prestige owe more to the chisel edged pen than the brush. Palatino, Arrighi et. al.</p>
      <p>When I took this damn craft up the bible was Edmund Arnold, Ink on Paper... Modern, Old Style, and Transitional. Bringhurst, a true Canadian treasure, confuses me with all the subdivisions! But a better book on typography has never been written. Should be a required read for anybody getting into this field!</p>
      <p>Michael</p>
