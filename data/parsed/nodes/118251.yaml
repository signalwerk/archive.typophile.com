    <p>I'm perplexed. I'm building a font family of a script. There are four different font files (vfb). All are very similar and I plan to eventually 'merge' them into one Pro version of the font. All of them generate OTF files just fine except for one file. When I generate IT, I get the following message in the FontLab output panel:</p>
    <p><strong>[WARNING]  feature 'kern', referenced in aalt feature, either is not defined or had no rules which could be included in the aalt feature.</strong></p>
    <p>Can anyone tell me what I am missing? I've tried to research it, and can't figure it out. </p>
    <p>This particular font appears to work just as well as the others (which do not give any warning message), but I'm wondering what, if any problems this may cause in the future. </p>
    <p>Should I even be concerned, if the font works fine in applications like InDesign? Or will Microsoft Word regurgitate it?</p>
