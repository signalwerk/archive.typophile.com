    html: <p>Or you could just completely ignore {aalt}. It was a workaround devised by Adobe to drive early versions of their glyph palettes. Not only does it not have any practical use for font users, it isn't even needed to drive the font palette, which can derive the same information from parsing all the GSUB features for one-to-one substitution lookups.</p>
