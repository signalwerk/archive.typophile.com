      <p>Thomas, I will be adding the other OT features later. I have found that if I don't have the 'kern' feature, the font generates fine, but when I go into Indesign to test it, the kerning pairs are not loading. </p>
      <p>I assumed that if I had any features (like 'kern'), I would need to have the 'aalt' feature form them to be accessed. I have removed the 'aalt' feature, and now things seem to be generating fine without the warning message. So thanks for that. </p>
      <p>I'm wondering if I will need to add it back in when I created the other features (like 'salt' and 'liga' etc.)</p>
      <p>thanks again for the help</p>
