    html: |-
      <p>Well, the question is why the other fonts are not giving you conniptions, not why this one is.</p>
      <p>'aalt' is a substitution feature that acts as a catch-all for other substitution features. You can't stick 'kern' in it and expect anything good to happen.</p>
      <p>If you have no other, real, substitution features, then you don't need aalt.</p>
