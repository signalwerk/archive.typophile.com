    html: |-
      <p>Rob,<br>
      If you have just the regular standard character set filled out you could use the liga feature to add at least one feature.<br>
      Like:<br>
      feature liga {<br>
        sub f l by fl;<br>
      } liga;</p>
      <p>This type of substitution does not need to have the aalt feature either, but when you add features like calt where a specific character gets subbed by another then add that to aalt.</p>
