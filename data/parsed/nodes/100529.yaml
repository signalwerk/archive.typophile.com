    <p>Dear Typophiles, </p>
    <p>I'm in the middle of research about typography used on Wrocław's (Poland) trams and buses.<br>
    I'm looking for a clues about history of such typography use or just some background about history of such digit design.<br>
    Of course it can't be connected with transportation but we're close to thinking it has some functional matter.<br>
    I'll be very glad if you could help me a little with it. </p>
    <p>Thank you very much.</p>
    <p>Best,<br>
    Wojtek</p>
