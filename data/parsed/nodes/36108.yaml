  html: |-
    <p>I've been asked to redesign the logo for <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code> to make it a bit more elegant, refined, and "Martha Stewart-esque". Every icon I came up with came across as a little bit trite or cheesy (rings, flowers, birds, etc), so instead, I've tried to come up with a solution that just type based. </p>
    <p>The custom W is an attempt to portray togetherness, closeness, and maybe even a stylized knot. </p>
    <p>I'm not sure if Clarendon is the right typeface to be using, and was hoping for some suggestions on other fonts that already have a loop in the W. Or even other fonts that might work for this. </p>
    <p>So... does it work? If so, any ideas on how to refine it even more?</p>
    <p>Thanks!<br>
    Jesse</p>
