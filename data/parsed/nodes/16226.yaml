      <p>lherrou: thanks. the b isnt really beveled (rounded?) though, it just rounds off at one end.</p>
      <p>eben: you're right I guess I wasnt very clear, this is the final version of the font:</p>
      <p><img src="/sites/default/files/old-images/PaperCut (font).gif"></p>
      <p>I was trying to make a font that was big and bold that could be seen both as a somewhat childlike font, but also one that was bold and strong enough to be used as a display font for non-child-like uses. im not really sure if i'm explaining that well, basically I  wanted it to be somewhat childish, but not so much as to regulate it to hokey uses like sand and comic sands (fonts that I strongly dislike) are. Also, I was trying to learn how to use the curves tool since id never had to use it with such percision before (I've only done drawing in illustrator, which is far far easier than planning out the letter S for example, haha).<br>
      and the third goal of the font was to be able to create something where the letters had an overall theme that connected them all very clearly, so that they could be used as a somewhat-body-copy font if they needed to be, i say somewhat because while they would probably fail at normal copy sizes under 12, they might work out ok at around 15 or 20.</p>
