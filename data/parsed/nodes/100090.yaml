      <p>“<em>In which universe I've missed is Bodoni free?</em></p>
      <p>None that I (legally) know of. And a friendly word of advice. I would be <em><strong>very</strong></em> careful when enquiring about free fonts in the future, lest you attract a significant amount of negative attention.</p>
      <p>Quoting the <a href="http://typophile.com/readme" rel="nofollow">Typophile forum posting guidelines</a>:</p>
      <p><strong>About free fonts</strong>:<br>
      If you’re looking for free fonts, please see our article called <a href="http://typophile.com/FAQ_Free" rel="nofollow">FAQ: Where can I get free fonts?</a> Do not ask members to send you copies of retail fonts. Such behavior is not looked upon kindly by those of us who make a living designing type or those of us who support the work of talented type designers. By the same token, please do not post links to sites which offer unauthorized downloads of commercial fonts. If you do wish to report a site with this activity, please contact a moderator.</p>
