    <p>Hello,</p>
    <p>This is the first time I've posted on typophile!</p>
    <p>I am building my resume and my personal logo is written in Bodoni Std Roman. I'm looking for something clean and simple, yet stylish to go with it in the body. I was thinking Avenir Roman. </p>
    <p>Am I better off with something like Helvetica? I appreciate any help. Thanks!</p>
