    html: |-
      <p>Unless you're applying for graphic design jobs, "stylish" should not IMHO be one of the top adjectives on your mind.  "Clean and simple", though, yes.</p>
      <p>Last year I attended a lecture by a professional resume counselor.  His advice was to be as orthodox as possible in the use of resume fonts.  I believe he said something to the effect of, "when I see a resume done up in beautiful fonts, my first thought is: what is this person trying to distract me from?"</p>
      <p>By all means, choose something that looks crisp and professional (just not too <em>overtly</em> elegant).  If you're aiming for 9-10pt, use something that is highly readable at that size as well.  (My own current go-to fonts for that kind of work are Sabon and Janson Text, although I'm not sure they'd combine well with Bodoni.  Are you set on using a sans-serif?)</p>
    html_clean: |-
