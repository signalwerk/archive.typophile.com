      <p>Aaron, if you’re looking for some good examples of type specimen books (and cannot get your hands on the originals) I recommend these two books:</p>
      <p><a href="http://www.amazon.com/Type-Visual-History-Typefaces-Graphic/dp/3836511010/ref=sr_1_2?ie=UTF8&amp;qid=1288164374&amp;sr=8-2" title="http://www.amazon.com/Type-Visual-History-Typefaces-Graphic/dp/3836511010/ref=sr_1_2?ie=UTF8&amp;qid=1288164374&amp;sr=8-2">http://www.amazon.com/Type-Visual-History-Typefaces-Graphic/dp/383651101...</a><br>
      <a href="http://www.amazon.com/Visual-History-Typefaces-Graphic-1901-1938/dp/3836515148/ref=pd_bxgy_b_img_b" title="http://www.amazon.com/Visual-History-Typefaces-Graphic-1901-1938/dp/3836515148/ref=pd_bxgy_b_img_b">http://www.amazon.com/Visual-History-Typefaces-Graphic-1901-1938/dp/3836...</a></p>
      <p>Although I remember being slightly disappointed by the accompanying texts these are well-crafted books, lovingly presenting great turn-of-the-last-century typefaces, with a considerable proportion of German ones.<br>
      And inside of each book there’s a code which allows you to download hi-res and -quality scans of the original type specimen books.</p>
