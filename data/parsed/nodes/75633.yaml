      <p>Jörg, there is a typeface from around that time called Schmale Runde Grotesk, similar to the one Nick’s working on.<br>
      See <a href="http://www.typophile.com/node/29138" title="http://www.typophile.com/node/29138">http://www.typophile.com/node/29138</a> and <a href="http://typophile.com/files/runde_6377.jpg" title="http://typophile.com/files/runde_6377.jpg">http://typophile.com/files/runde_6377.jpg</a></p>
      <p>As noted in the linked thread there is a digital version by lineto:<br>
      <a href="http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Number+Two/" title="http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Number+Two/">http://www.lineto.com/The+Fonts/Font+Categories/Text+Fonts/Number+Two/</a><br>
      (The lineto versions seems different from the one from A.-G. für Schriftgießerei und Messinglinien Offenbach and it’s said that it was based on a ‘Berthold Schmale Runde Grotesk’.)</p>
      <p>I think it’s hard to tell which one was created earlier unless someone could point out the exact dates of release.</p>
      <p>For some interesting infos on rounded Grotesks see also:<br>
      <a href="http://issuu.com/fontfont/docs/ff_din_round" title="http://issuu.com/fontfont/docs/ff_din_round">http://issuu.com/fontfont/docs/ff_din_round</a></p>
