    html: |-
      <p>I love investigations like this ...</p>
      <p>Just now I see that aarhaus posted a link to a scan from the »Seemann« already.<br>
      Indeed, there's only the Schmale runde Grotesk included. But since we now find this typeface stated as being cast by Bauer &amp; Co, Aktiengesellschaft für Schriftgießerei und Maschinenbau Offenbach (both taken over by Berthold later) and J. John Söhne Hamburg, I guess that the matrices were purchased from the same manufacturer, likely Wagner &amp; Schmidt, Leipzig, and then cast almost identically by the different foundries.<br>
      Same can be the case with Breite runde, only that I don't find it in any specimen I have.</p>
      <p>The picture from the Naumann book shows Breite magere Grotesk by Schelter &amp; Giesecke, Leipzig on the opposite left side and also the strange Columbus some pages before was cast by them. So maybe Breite runde came from S&amp;G as well, or at least from another Leipzig foundry?<br>
      Well, I think I'll just contact Eckehart and cc you. Don't know how good he is at English correspondence.</p>
      <p>((Frode: thanks, still have to get accustomed to suddenly appear so colourful here. It's taken from my twitter but I'll likely get back to the standard placeholder T sooner or later.))</p>
