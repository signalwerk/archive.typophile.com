    html: |-
      <p>The company C.G. Naumann wasn't actually a typefoundry but a Leipzig printer and publisher at the turn of the century. So in this book they probably show typefaces they had on offer for printing and bought from other manufacturers.<br>
      Either the Deutsche Bibliothek in Leipzig or Klingspor Museum in Offenbach might have more material, the latter at least owns the best collection of specimen books I know of.<br>
      Maybe you want to contact somebody there or the best expert in German type history, especially Grotesk cases I know: Eckehart Schumacher-Gebler. If you want I can email or DM you contact information.</p>
      <p>What astonishes me is that I couldn't find the typeface in Seemann’s »Handbuch der Schriftarten«—the most important specimen of almost all typefaces and all foundries available at that time. But I only had a super brief look.</p>
