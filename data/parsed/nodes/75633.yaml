    <p>As part of my research for the revival project at Type@Cooper, I found <a href="http://www.flickr.com/photos/n1ke/2494521944/in/photostream/" rel="nofollow">this printed specimen</a> online (preview attached) with a great rounded sans titled Breite runde Grotesk.</p>
    <p>It is sourced as from "Schriftproben, C.G. Naumann, 1901". This is a printer's book and I'm looking for both more info (foundry/designer/context) and for a better specimen (full alpha at least). </p>
    <p>Thanks everyone,<br>
    Aaron.</p>
