      <p><cite>The threshold for turning off ligatures is reasonably high already. We tried to set it to a level where, for a typical text face, it would look bad to still have a ligature.</cite></p>
      <p>15 units seems to be the threshold as regards spacing as defined e.g. in the character palette.<br>
      Can it be that the glyph spacing %-value in the justification settings (with minimum, optimum, maximum) has its own threshold? By the way — % of what? With a typeface I tested, ligature substitution was switched off at 0.7% glyph spacing allowed in the justification settings.</p>
      <p>Karsten</p>
