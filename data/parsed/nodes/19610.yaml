  html: |-
    <p>I am setting text with an OpenType font, using ligatures in InDesign CS2.<br>
    To get a better justification I allow ca. 2% letter spacing, using the justification palette.<br>
    This results in a small consistency problem, if you are real picky about your text.<br>
    Some words are now using ligatures, others are not (when the words are letter spaced by the justification engine).<br>
    Can you think of a smart solution to allow letter spacing on all text except the ligatures?</p>
    <p>Thanks<br>
    Jonas</p>
