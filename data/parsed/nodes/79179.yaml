  html: |-
    <p>Rosetta is an independent foundry, created by <a href="/node/55322" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">David Březina</a>, <a href="/node/64741" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jose Scaglione</a> and <a href="/node/20645" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Veronika Burian</a>, with a <strong>strong focus on multi-script typography</strong>. It is a response to the increasing interest and need, within the global market, for multi-script typefaces that are both technically and aesthetically of the highest standard. Rosetta is committed to promoting research and knowledge in that area and to support excellence in world script type&nbsp;design. </p>
    <p>One of the main objectives of the foundry is to create a retail library of high-quality typefaces that are respectful of the traditions and cultural background behind each of the supported scripts. Rosetta actively promotes team-work and collaboration between designers, consultants and language specialists. To date we support pan-European Latin, Arabic, Greek and Cyrillic for Slavic languages as well as for many Asian languages. The addition of type families for Indian scripts is planned for early&nbsp;2011. </p>
    <p>Rosetta also caters tailored type design and font customization services for corporate use and <span class="caps">OEM</span>. Please contact us if you wish to discuss your particular&nbsp;project.</p>
    <p><strong>Official web:</strong> <a href="http://rosettatype.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://rosettatype.com</a></p>
