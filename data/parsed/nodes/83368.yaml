  html: |-
    <p>I'm working on a type-themed game and need to allow the user to choose a difficulty level. I thought it'd be fun to map the difficulty level to a print-related term.</p>
    <p>The first thought was some form of job title...apprentice being 'easy', for instance. Are there job titles that could work (typesetter? pressman?)</p>
    <p>Or...perhaps there's other printing terms that would map well to a difficulty level?</p>
