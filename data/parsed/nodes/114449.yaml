    <p><strong>Hi typophiles</strong></p>
    <p>I'm trying to figure out which is the best quick auto-hinting solution, right now I know 4 (quick) options:</p>
    <p>• No Hinting<br>
    • Fontlab Hinting (with proper stems/blue zones)<br>
    • FontSquirrel<br>
    • TTFautohint Program (thanks to Dave Crossland)</p>
    <p>(I've attached the results) The question is:<br>
    Do you know any other quick auto-hinting options that might be worth a try?</p>
    <p>Thanks!</p>
    <p><em>*I'm using Chrome on Windows 8.1, and the tests with Impallari testing tool</em></p>
