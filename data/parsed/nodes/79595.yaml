      <p>Thanks for the suggestions Nick and Trevor, I appreciate it. Sentinel steys a bit too close to Clarendon, IMHO. It's a nice face, but not quite what I'm looking for. </p>
      <p>Still looking... tried various options; not neccesarily because of a stilistic or historical link, but more to find a nice contrast. I tried Calluna, Droid Serif and Slimbach, which all have a decent x-height, and a certain calligraphic flair to them. I'm not too sure though if it works. I will try some more combos, also in the Century vain.</p>
      <p>If you have some more pointers I would be very grateful!</p>
