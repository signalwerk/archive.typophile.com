  html: |-
    <p>I intend to use MVB Embarcadero for a personal Atlas/Cartography-related project. It will be a kind of alternative mapping, but I want it to in style reference conventional atlases/maps, yet give it a new direction. Embarcadero is the base font but I would like to use a serif next to it, for contrast. I will probably use it both for labeling and some (short) text, so it should hold up well on a busier background. In common Atlases there often is a combination of Helvetica/Clarendon or Venus/Rhoemisch. I like this kind of modern/classical pairing but as I said I want to make my own new interpretation of it.</p>
    <p>I've been looking at fonts like Century (too conventional), Walbaum (too thin), Charter (nice, but does it combine well?) and URW Latino (too little contrast)...</p>
    <p>Any ideas?</p>
