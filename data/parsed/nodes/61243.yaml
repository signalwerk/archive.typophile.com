    html: |-
      <p>Hi James,</p>
      <p>Although I agree with you, the examples here are just a kind of attempt to systematizing some doubts that arouse when I was trying to learn to draw some real glyph.</p>
      <p>I believe I don't explain my doubts so well.</p>
      <p>So let me try explain better what are my doubts, I hope someone can help me to establish a good starting point, o good procedure to start.</p>
      <p>I was trying to read a lot and learn with that. Stephen Moye in Type by Design gives me 4 tips in the starting:</p>
      <p>1) The Bump rule<br>
      2) The Rule of one-third<br>
      3) The Conciseness rule<br>
      4) The Orthogonality rule</p>
      <p>He also consider them a just starting point, not something you will not break a lot. My doubts arouse when I was simplifying, merging points, and I start to think whether I was simplifying too much, too few points. When I find a portion of curves similar to the snake5.jpg my inclination was to choose the inflection point, as it will lead to less points, perhaps more easy to edit and to achieve what I would like, but I may be wrong.</p>
      <p>I was thinking when it is a good choice to put a point always in the inflection point.</p>
      <p>s1.jpg is just a glyph with points at extrema, as we are recommmended, no doubts.<br>
      s2, s3 and s5 are almost the same, the less points leads me to opt for s5 so I could try this approach as a starting point.</p>
      <p>But my doubts did not arise from a simple S, but from similar to the Snake form. If I opt to a approach similar to the s5, it will lead me to something like the option Snake5. Or, in order to establish a good starting point (I also does not think some rules will lead me to the "perfect" form, I am just asking what more experienced designers think it is the best starting point), I will almost naturally choose the inflection point.</p>
      <p>If I opt to have less points and choose the inflection point chances are I create a small "kink" or a small bump, although it can be visually avoided I know it cannot be mathematically avoided, as I will not certainly pick the inflection point but something close, I really would like to know if I must or not consider it.</p>
      <p>Second advise I would like to listen is if it is or not a very bad choice make options like the snake5. And if a line drawn from and extending one of the handles intersects the adjacent point?</p>
      <p>Sorry James I didn't make my doubts really clear, I believe now they are. And thanks for any help in my beginning naive doubts.</p>
