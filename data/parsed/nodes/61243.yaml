      <p>Hi hrant</p>
      <p>thanks for your help. I've asked this question before and some of the answers I heard it is that they stopped marking inflection points long ago, but maybe they can be convinced to change, and they told me to ask here in typophile, so that's why I am here.<br>
      Apple recommends to mark inflection points:<br>
      <a href="http://developer.apple.com/textfonts/ttrefman/RM01/Chap1.html#located" title="http://developer.apple.com/textfonts/ttrefman/RM01/Chap1.html#located">http://developer.apple.com/textfonts/ttrefman/RM01/Chap1.html#located</a><br>
      But as I've seen a lot a S like the s5 I start thinking if it is important or not.<br>
      I will follow your advise and mark the inflection points.<br>
      thanks hrant.</p>
