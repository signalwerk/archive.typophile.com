    html: |-
      <p>&gt; Joshua, how can they be adnate if they're not connected?<br>
      &gt; Adnate means "growing from"</p>
      <p>That's how. They "grow from" the previous stroke, in the way that they would if the stroke and serif were made in one stroke of the pen, whereas to produce "roman" style serifs with a pen requires drawing the serif as a separate stroke or doubling back. Thus, "roman" serifs do not "grow from" the attached stroke in a natural way.</p>
      <p>They are adnate with respect to the letterform they are attached to, not the following one, though they do suggest a link to the next letter.</p>
