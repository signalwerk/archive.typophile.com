    html: |-
      <p>Sloped roman vs. italic.</p>
      <p>The serifs on the sloped roman are bilateral, abrupt (emphasize the end of the stroke).<br>
      The serifs on the italic are unilateral, adnate (lead into the next stroke).</p>
