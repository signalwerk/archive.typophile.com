      <p>Another relevant concept: folded.<br>
      This term was used by Stanley Hess in <em>The Modification of Letterforms</em> to describe the way in which the curved stems of letters may be configured—for instance, the c and s in Frutiger are unfolded, but the grotesque c and s of Helvetica have folded forms.<br>
      These cursive terminals/serifs or entry/exit strokes are folded back against the letter.</p>
      <p>Joshua, how can they be adnate if they're not connected?<br>
      Adnate means "growing from", i.e. a bracketed serif or an old-style triangular terminal may be considered adnate, growing from the stem, as opposite to a slab-like didone serif or a ball terminal, which appear attached.</p>
