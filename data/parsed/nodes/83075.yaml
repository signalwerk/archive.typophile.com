    <p>Hello all! :D I wasn't quite sure where to post this, so I just decided I would put it in the general area. I'm not a type designer, but one who's getting involved in the Print/Web side of things. I adore type, and I feel it's the most important part of design, so I'm trying to get as educated as I can about it. </p>
    <p>My question is this: is there a specific term for the italics that seem to be more, I don't know, rounded or flowy? It's hard to explain, so I'll use pictures:</p>
    <p><img src="http://i392.photobucket.com/albums/pp6/CanwllCorfe/3424631d454f82949bf54344005e67.gif"></p>
    <p>As opposed to (hey it's Bodoni Egyptian Pro!):</p>
    <p><img src="http://i392.photobucket.com/albums/pp6/CanwllCorfe/3f6b2f956960ee038a231ca0395a22.gif"></p>
    <p>And here's a few other examples of what I'm attempting to explain:</p>
