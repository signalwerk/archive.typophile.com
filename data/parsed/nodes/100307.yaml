    <p>Hello,</p>
    <p>I'm new to this forum, so I'm not sure if this is the proper place to post this, or even if it's allowed, but I'm trying to identify a font. Does anyone know what font this is and/or where I could purchase it? I've looked at several Display and Bodoni fonts, but can't seem to match the "i". It's from the Ralph Lauren site: <a class="freelinking external" href="http://global.ralphlauren.com/en-us/rlmagazine/editorial/hol12/Pages/KiernanShipka.aspx?ab=int_010313_BABYLP_WIDGET_RLMAGAZINE_MEETKIERNANSHIPKA_EXPLORENOW" rel="nofollow">http://global.ralphlauren.com/en-us/rlmagazine/editorial/hol12/Pages/KiernanShipka.aspx?ab=int_010313_BABYLP_WIDGET_RLMAGAZINE_MEETKIERNANSHIPKA_EXPLORENOW</a></p>
    <p>Thanks very much for any help.</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/RLpic_5559.jpg"></div><p></p>
