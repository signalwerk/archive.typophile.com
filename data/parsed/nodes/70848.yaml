      <p>I'm all for people having lots of fonts, but I'm pretty sure loading 3,000 at once is going to cause problems no matter what font manager you use. You seem confident that "the system can handle it". I'm not so sure about that. Even if it is possible, I can't even imagine trying to scroll through a font menu with that many loaded.</p>
      <p>Extensis has a nice guide to managing fonts on Macs. It has useful information even if you don't use their product (Suitcase):</p>
