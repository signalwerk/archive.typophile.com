    <p>Even after a fresh install of snow leopard Font Book just gives me problems every time I open up. I have around 3,000 fonts.  Once the fonts load if I try to click, scroll or find a font it crashes in an instant.  What is the best or a great Font Book alternative?  Something that can handle all of these fonts.  I don't use all of the fonts, I know deleting would be nice, but the job sometimes calls for fonts that I may need so it's good to have them in there.  Eventually I would like to delete some that I know I won't use but for now I really need something that will allow me to browse all of my fonts (and their styles) and Font Book just isn't doing it.  Google searches turn up free alternatives that I have tried but still give me the same problems.  Thanks.</p>
    <p>btw, running on a Macbook Pro 17" with 6 gigs of Ram and 500gb HD, so the system can handle it, the software is my problem.</p>
