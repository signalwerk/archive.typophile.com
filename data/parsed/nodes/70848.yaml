    html: <p>Usually, if someone has 9000 fonts it means he’s downloaded a lot of free fonts or some torrent with commercial fonts. I’m not necessarily saying you’re in any of those categories, but I’m saying no one really needs that many. Choose wisely when you buy fonts! IMO, a handful of quality stuff is way better than thousands. You’ll get familiar with the few and learn how to use them best, and you’ll value them higher.</p>
