  html: |-
    <p>Hi folks,</p>
    <p>I'm getting ready to start working as a freelance graphic designer but before i do i still need to get a few things in order, one of them is setting up my own website. I was wondering if maybe you guys could point me to some of the websites you think are very well executed and give a good straight forward overall view of the work and the designer.</p>
    <p>I'm not a web designer so i'm hoping some of your suggestion might lead to a few ideas on which direction i'd like to go with the website.</p>
    <p>Thanks in advance !</p>
  html_clean: |-
