      <p>Hello, Evie. </p>
      <p>As Steve pointed out, go with something ready made. For example, Behance.com offers free usage of their website space to show off your portfolio. When you'll get more accustomed to web design, you can make your own from the very beginning.<br>
      Some samples:<br><a href="http://www.iliasmeletis.net/">http://www.iliasmeletis.net/</a><br><a href="http://www.hiromuradesign.com/#/vi/">http://www.hiromuradesign.com/#/vi/</a><br><a href="http://www.ferhatcelik.co.uk/">http://www.ferhatcelik.co.uk/</a><br><a href="http://www.redcreative.gr/en/work/">http://www.redcreative.gr/en/work/</a><br><a href="http://www.mousegraphics.gr/">http://www.mousegraphics.gr/</a><br><a href="http://www.clintonstringer.net/index.html">http://www.clintonstringer.net/index.html</a>.</p>
      <p>Good luck:)</p>
