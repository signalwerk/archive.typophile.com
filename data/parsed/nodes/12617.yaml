    <p>Hi, I´ve been browsing the forums for quite a while, but this is actually my first post. I´m willing to get some feedback and directions on two projects that I´m currently working on for a contest (the deadline is may 27 for both of them).</p>
    <p>Scenario 1:<br>
    Cristal fm - logo for a radio station, client guidelines as follows: modern, young (18-35 years old, middle-high socioeconomical class), prestige, frecuency number must be first in visual hierarchy, institutional color: green (no particular green, though), versatility of use (vertical banners, diverse merchandising, etc). Their current slogan translates to something like “Music for real”.<br>
     Well, with this briefing in mind (even though I found some of the guidelines contradictory) I came up with a rough sketch (the one with first-sketch in its filename). I showed it to the client on a preliminary meeting (again, the deadline is may 27) and he liked the versatility of use and posible articulation of its elements, but he wanted it to be more prestigious, so he “suggested” me to use a serif typeface. I don´t think that using serifs is the only way to imply prestige, but he´s the one that´s making the choices in the final selection :)<br>
     Please tell me what you think of it, suggestions, critiques, etc. Some pointers on how to solve the frecuency number typeface issue (I haven´t really worked on it yet, it´s getting on my nerves) will be really helpful.</p>
    <p>Scenario 2:<br>
    Hollywood - logo for another radio station (same owner), client guidelines: adult audience (35-40some years old, middle-high socioeconomical class), timeless plus 80´s &amp; 90´s soft music classics, chill out, relaxation, versatility of use (it´s one of those clients who wants his logos to do everything right). The client really liked the isotype (the relaxing guy icon) and the infinity double “o” ligature (related to the timeless &amp; bonding concept, kinda cheesy to me). I didn´t wanted to go retro on this logo because they´re looking for a fresh new image (plus ALL the previous requirements).<br>
    Again, let me know your thoughts about it and any critiques/comments you may have, they´re all welcome.</p>
    <p>Thanks in advance</p>
    <p>f</p>
    <p>PS: I´m sorry for my pathetic english</p>
