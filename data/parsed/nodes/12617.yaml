      <p>fedezz, these days who cares about am or fm. Most radio stations have a link to on-line streaming. My point being, in emphsis bury the fm all together make it tiny. </p>
      <p>The 107.9 cristal are static not dynamic. Make the 107.9 shape move or give it dimention. Maybe its exploding with sound, like how you would feel if you were stuck in front of a sub-woofer. That age group is a go-go group (think ipod, or ishuffle) media goes with them (cell phones with internet access). The type isn’t the problem.</p>
      <p>101.3 Hollywood is just boring. Try doing something with the traditional Hollywood hills lettering. Also explore something classy and classic like a Tragian movie title look. The mark on the first version leaves me cold, it means nothing to anyone.</p>
      <p>Now you’ve made a good start, keep going, and post some more. Think less about design and more about your target audience and you will have winners.</p>
