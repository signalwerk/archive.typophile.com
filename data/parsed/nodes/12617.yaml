      <p>First, there is no need to apologise for your English.<br>
      I don’t think unicase is the way to go to hint at prestige I would look at more “traditional” serif faces. Also I wonder if you could make the circle round the frequency into a crystal so that the frequency on its own could be used if required. I found your first sketch more in keeping with the demographic although an alternative to the existing typeface might be more elegant Bliss leaps to mind but there are many alternatives, and look at upper and lower case. The fm ligature works very well in the first sketch version.<br>
      For the second I would also look at upper and lower case, this might sort out the spacing issues of the LYW, instead of the infinity moebius loop you could look at an oo ligature in the vein of Mrs Eaves. The point for the frequency should move up to align with the centre of the 3. The illustration is charming, but maybe it should move down a bit and the weight of the bubble chair stroke could be a bit lighter.<br>
      Tim</p>
