      <p>I am not a fan of all uppercase setting, but you have ascenders (of a sort) with the C, i, and t. HOLLYWOOD set in uppercase gives you all kinds of problems with negative space around the centre of the word which, with application, you could reduce. I didn’t want to dictate the shape of the final logo (and I’m not certain it will work) so I left the suggestion of shape hanging but you could start with a simple lozenge and introduce 3d, just to see if you think it will work.<br>
      While you are looking at Bliss take a look at Aspect.<br>
      With re-reading my comments on the Hollywood illustration are not clear I meant the figure should move down to settle it into the chair.<br>
      Tim</p>
