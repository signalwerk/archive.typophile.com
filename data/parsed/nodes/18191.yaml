      <p>Jesse,</p>
      <p>This is just a quick idea. Maybe keep the chain lined up with the d. It seems too distracting with the chain not lined up. If you do have the broken-chain angled the way you currently have it, I suggest use it reversed out. I think your negative space mock-ups aren't bad. Maybe shorten the d and get rid of the small stem.</p>
      <p>I also think a dark orange would be a good color for the chain, since orange is a national color. Maybe a warm grey for the type.</p>
      <p>The space between the "i" and the "t" bothers me.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dal.gif"></div><p></p>
