    <p>Hello,<br>
    I've been struggling with ideas for a logo that I'm creating for the "Dalit Freedom Network". The "Dalit" are the untouchables from India that are below the caste system, and this organization is lobbying for their freedom. </p>
    <p>This is what I have been playing with... I'd appreciate your thoughts and feedback.</p>
    <p>Thanks,<br>
    Jesse</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/dalitnetwork.jpg"></div><p></p>
