    html: "<p>&gt; I don't even read any more <br> <br>Then you're in!  :-) <br> <br>But don't start from individual glyphs and try to form a font, go the other way: develop a feeling (or if you have to, Rules) for the whole* and then try to figure out what the individual glyphs need to be - because a font (especially a text font) is only its parts out of necessity, not as a goal. On the other hand, it's also very common (I do it a lot) to start with some actual glyphs out of the blue (since their tangibility makes them so attractive), and get the feeling/rules from there, but only if you leave open the possibility (even probability) of changing or even dumping those initial seeds. <br> <br>* And absobing history and existing designs like you're doing is a great catalyst. <br> <br>Handwriting (or \"chirography\", in the realm of type) is a good start only if you want a quick and easy way of producing something mainstream. The best source is what's inside you as a person, not any physical tool. <br> <br>One \"precedent\" you should definitely mind though is what readers expect. Don't let it be a straightjacket, but do factor it in, like when you decide what stems need to be thick and which ones thin - precedent will often dispell much of the arbitrariness in design. <br> <br>And don't push inspiration. When it comes naturally it will all just fall into place. <br> <br>&gt; homework <br> <br>You're in luck! <br><a href=\"http://typophile.com/articles/\" target=\"_blank\">http://typophile.com/articles/</a> <br>(Bottom-Right) <br> <br>hhp <br></p>"
