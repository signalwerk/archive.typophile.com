    html: <p>Brant, <br> <br>One big thing that helped me understand letterforms was simply copying from specimen books. I'd take a pencil and paper and draw a complete alphabet -- Caslon, for instance. This made me pay attention to details that I normally wouldn't see. If my "a" didn't look like the specimen "a", I would study it further to understand why. This also helps you understand relationships among letterforms when you draw them together, all the same size, on one page. <br> <br>Get as many specimens as you can, and not just old ones. Some foundries will mail a free specimen of their types and others have PDF specimens you can download. <br> <br><a href="http://www.typography.com/catalog/mailing_list.html">The Hoefler Foundry</a> <br> <br><a href="http://www.teff.nl/fonts/samplesheets.html">The Enchede Font Foundry</a> <br> <br><a href="http://www.stormtype.com/free.html">Storm Type Foundry</a> (PDFs on the left) <br> <br><a href="http://www.terminaldesign.com/retail_specimen.php?ID=1191&amp;viewFam=1">Terminal Design</a> (Each font has a PDF specimen) <br> <br><a href="http://www.fountain.nu/catalogue/catalogue_index.asp">Fountain Type</a> (Some have PDF specimens) <br> <br><a href="http://www.psyops.com/html/specimens.html">PsyOps</a> (The bottom of each showing has a PDF specimen) <br> <br>Anyway, I'm sure you're aware of all the online type foundries. <br> <br>Hrant and Chris offer good advice as well -- I decided to draw letters because my writing sucks. Drawing letters digitally is a whole new ballgame, and I'm still struggling with that. <br> <br>The Typophile courses Hrant pointed out are great, too. They're done by the great Mr. Hoefler. <br> <br>Good luck, <br>Addison</p>
