    html: <p>Brant, I've made one real attempt at designing a text face and I know <i>exactly</i> how you feel. I made it through the LC and UC alphabet and had some experiences that may help you go further. <br> <br>1) Get a chisel-tip pen and some ink and a 'basic calligraphy' book. Start to write the alphabet, but also play around with the line quality and curves. If you're holding the pen at the proper angle, using the recommended strokes, and controlling proportions, a lot of the characters will start to seem intuitive (this requires a lot of repition, but as a scrutinizer of type, you have a leg up on the rest of the world). Now, I realize that this is a stylistically limited exercise, but it really helped me to see the glyphs for what they are. Using a tool that can modulate stroke-width on the fly is very illuminating. <br> <br>2) Trace the skeletons of some fonts. Don't focus on stroke-width or fillets of serifs, just draw the monoline structure of the characters. You'll start to see the commonalities and differences in periods and styles. I'm sure there's a book that can give you the 'accepted method' for determining this underlying structure. I would print out big ol' 12 pica alphabets (UC &amp; LC) and lay tracing paper over them to do this. <br> <br>I'm not sure if either of these are Official Type Designing Methods, but they helped illuminate many of the subtlties of type and letters for me. I recommend avoiding beziers and the computer for learing to draw these forms. For me, I do my best bezier manipulating when it's over a strong drawing I've scanned in.</p>
