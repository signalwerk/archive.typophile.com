    <p>Erm...I don’t have much to contribute here and pop in occasionally to ask a question; I hope that’s okay...</p>
    <p>I have to reproduce a brochure in another language; the english brochure has been supplied, and I’m puzzled over the choice of point sizes throughout. Would be grateful to know if someone here can detect any logic to this:</p>
    <p>Type Point size/leading are as indicated across a six-panel brochure:</p>
    <p>Panel 1:<br>
    Subhead 9.65/11<br>
    Body: 9/11<br>
    Body: 7.5/10</p>
    <p>Panel 2:<br>
    Head: 23.152/15<br>
    Body: 9/10<br>
    Subhead: 13.891/15.569<br>
    Body: 8.489/10.804<br>
    Body: 8/9.5<br>
    Body: 7.5/9</p>
    <p>Panel 3:<br>
    Same as panel 2.</p>
    <p>Panel 4:<br>
    Same as panels 2 and 3, with a little 9.65/11 and 9/11 thrown in.</p>
    <p>Panel 5:<br>
    Head: 17 pt.<br>
    Subhead: 14/auto<br>
    Body: 9.25/auto</p>
    <p>Panel 6:<br>
    Head: 43.996/46.853</p>
    <p>Otherwise it’s a well-designed brochure; am I just looking at sloppy typesetting?</p>
