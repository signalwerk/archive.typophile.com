      <p>I remember Frank Romano bemoaning the flexibility of type sizes at a type conference in the 90s. He was thinking of spec’ing type from printed copies, and how difficult it would be to determine the size, if designers use tenths of a point sizes. And here you have 23.152 ... thousandths.</p>
      <p>I can just imagine trying to figure that one out with a type gauge.</p>
