      <p>It is true about sans and (esp. architectural and related) design books - they are all in sans. If they are not - they are likely historic or are about phenomenology and argue for the fundamental rightness of medieval-peasant life. Is the use of sans going to spread? I do not know. Nor am I in a position to judge. Where design is not supported by aggressive marketing, e.g., in architecture, non-designers prefer to like things of long ago. So, I am not surprised that people also prefer fonts of long ago. In this project, while it is necessary to make things readable, it is also important to make a statement on the value of the contemporary (or even technical)…</p>
      <p>The idea that book texts need to be perceptually transparent to give unobstructed access to underlying content seems to belong to an age of unchallenged rationalism now long-gone. If the act of reading is creative, challenging the reader to do work is OK. E.g, cf. Russian “futurist” designs.</p>
      <p>This all is diverging from the title of the thread now, of course…</p>
