      <p>Thanks all. Well, this is not a novel. This is a design book but with lots of text. It needs to look serious but also visually balanced. Designs in the images are contemporary avant-garde - so the classic/historic-looking fonts are out, especially serifs (e.g., Garamond). I am not so sure about humanist sans. Or maybe I am yet to see the one that is simple and nice and seems suitable. Maybe DIN...? E.g., Kievit seems somewhat loosely drawn, of course only onscreen and in great magnification (I do not have it to experiment with).</p>
      <p>I'd like to have a more techy look though. What do you think of PFIsotext? Is that possible in your opinion or too hard to read? Or PFHandbook (this seems nice but rather dense and with  wonkish g's).</p>
      <p>As an alternative, what about some minimalist slab serif in humanist proportions? Would that be OK?</p>
      <p>As you all are disapproving of my original intention, I’d like to hear of possible alternatives.</p>
