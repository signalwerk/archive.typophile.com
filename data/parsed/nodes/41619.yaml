      <p>Avenir (and the Next-update of that) runs fairly wide, eg you don’t get enough characters in a regular line. To do that you have to go to smaller sizes.<br>
      The strong horizontal bias of Avenir asks for more linespacing than regular.<br>
      Also to consider: it’s a typeface with very little contrast.</p>
      <p>Altogether not a very efficient text face.</p>
      <p>If you want to go the sans’ route and want to stick to a Frutiger typeface, his namesake typeface Frutiger may be a better choice. That also has more variants, esp. a very good condensed. (BTW Frutiger Next has better italics than the original Frutiger.)</p>
      <p>If you want that really old fashioned geometric look, try Akzidenz Grotesk. Or my latest favorite (and a very up-to-date take on that tradition): Kris Sowersby’s National.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
