      <p>It’s all about taste, of course.</p>
      <p>The thing to do is make a shortlist of typefaces you like and do some experimenting with it, eg typeset some material and print it. Weed the selection down. Put away. Look again. Fiddle some more with it. Discard what you don’t like. Etcetera. Until you have the ONE left.</p>
      <p>Sorry, this may be hard to do and somewhat timeconsuming, but it’s the way to go — because you will learn to discriminate and make choices (and that is what design is all about).</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
