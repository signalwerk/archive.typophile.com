      <p>bert_vanderveen</p>
      <p>Thanks. My page size is A4 and the font size should be 11pt or thereabout. Am not sure I understand what you mean by “efficient” and “contrast” here, sorry that I lack the lingo. I can decide on the line length and other parameters to make things look OK.</p>
      <p>Thanks for the alternatives. I am not wedded to a Frutiger typeface. In fact, I am not sure I like his preference for oblique-like Italics, even in the better “next” generation. Kris Sowersby’s National is a nice and fully-featured option it seems – I shall keep it in mind. I shall need old-style figures + sub- and superscript in the very least whatever I choose.</p>
      <p>I thought of Avenir because its look seemed to me compatible and unifying when set against the versatile architecture and design appearing in the images. If there are better sans alternatives out there, I’d be glad to hear of them too. I tried some serifs also but their shapes always seem to clash with what the images do. The images are quite eclectic and in my mind, the body text should not side with any of the styles appearing there. Hence, it seemed that the geometric, minimalist approach would be the best. Maybe people with experience can suggest something else. I am very interested…</p>
      <p>Sihep</p>
      <p>Thanks, I knew about Amsterdam and now had a look at the documents. Very helpful. But I see that they use Documenta for longer documents, perhaps confirming that Avenir is a bit too much on masse… I really was hoping to see it in a book somewhere.</p>
