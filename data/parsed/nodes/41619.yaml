    <p>Just wanted to ask the general opinion on the suitability of Avenir Next for body text. The text in question has lots of images with captions, footnotes and italics. The topic is design and the desire is to keep the appearance clean (images already have lots of text using various fonts in them), contemporary and “constructivist”. I thought I’d also use Avenir for all titles. The primary worries are readability (I am happy with lots of leading and short lines) and the appearance of Italics which are not very contrasty. The results on a high-end digital printing machine, in colour (if that matters).</p>
    <p>Let me know what you think. Also, if you can point to examples using Avenir in books or other long documents, I’d be happy to see them.</p>
    <p>If you can suggest better Sans alternatives for body text in books, please let me know too. Again, preferably with examples.</p>
    <p>Thank you.</p>
