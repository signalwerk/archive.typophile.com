    <p>Hi everyone!</p>
    <p>I need a wide typeface that give off that smart, black-horned rim glasses, gentleman of the 60s feeling.  I LOVE Lubalin Graph but it's not wide enough and Hellenic Wide is too 'country.'  Any alternate ideas?  Is there a super wide Futura or something equally mod/scifi/60s?</p>
    <p>thanks!</p>
  html_clean: |-
    <p>Hi everyone!</p>
    <p>I need a wide typeface that give off that smart, black-horned rim glasses, gentleman of the 60s feeling.  I LOVE Lubalin Graph but it's not wide enough and Hellenic Wide is too 'country.'  Any alternate ideas?  Is there a super wide Futura or something equally mod/scifi/60s?</p>
    <p>thanks!</p>
