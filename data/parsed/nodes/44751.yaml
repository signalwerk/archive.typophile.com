    html: |-
      <p>Keep in mind that much of Lubalin Graph's character comes from the fact that it's a geometric (the rounds are "perfect" circles). Once you go wide, you get ovals. You might want something more square like <a href="http://www.fontshop.com/fonts/downloads/font_bureau/dispatch_extended/" rel="nofollow">Dispatch Extended</a>, which is less country than Hellenic.</p>
      <p>As for sans serifs, there's nothing more mod/scifi/60s than <a href="http://www.fontshop.com/fonts/downloads/linotype/eurostile_std_ot_virtual/" rel="nofollow">Eurostile</a>. See also <a href="http://www.fontshop.com/fonts/downloads/itc/itc_blair/" rel="nofollow">ITC Blair</a>, <a href="http://www.fontshop.com/fonts/singles/itc/itc_flatiron/" rel="nofollow">ITC Flatiron</a>, and the newish <a href="http://www.fontshop.com/fonts/singles/fontpartners/fp_head/?sample_text=SCI-FI MOD 1960" rel="nofollow">FP Head</a>.</p>
