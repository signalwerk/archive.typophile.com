      <p>Thanks Tamye! </p>
      <p><cite>Is this fixed pitch font, isn’t it?</cite><br>
      It is. It's going to be fun to go proportional with it.</p>
      <p>These new family members are very cool. I am very amazed at your ability to infuse a new sensibility into glyphs that seem like they would be especially resistant to it - like the m. I especially enjoy the y of your serif Italic. </p>
      <p>It has been great reading your blog: <a href="http://www.shotype.com/" title="http://www.shotype.com/">http://www.shotype.com/</a></p>
      <p>I hope you will keep us all up to date as you make new types available.</p>
