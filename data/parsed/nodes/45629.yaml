    html: |-
      <p>Kunihiko Okano, it's great to see you Typophile!</p>
      <p>My font is still in progress but I did incorporate the changes they suggested. They were quite good.  Especially the idea of relenting, and letting the "r" have serifs. I may take up their idea of making a faux mono too. And finally, a proportionally spaced ( normal) font as well.</p>
      <p>Here is an example showing some easy letters ( fredo viola done) and a hard set (simply). The arc of the r is still to heavy. It is nearly done though. Next will be italic.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/koexp_3624.jpg"></div><p></p>
      <p> I was wondering if there is a new version of your font we might see too. Certainly all of the advice they gave seemed sound to me.  But you may have another idea in some cases. It would be very interesting to see it in a use or context. That would help me think about the design. It is very elegant.</p>
