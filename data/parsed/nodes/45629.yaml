    <p>Finally... the first TypeCon 2007 Typecrit video is posted to Youtube.  It showcases Kunihiko Okano's beautiful Italic font, Kunihino Okano ( Actually he provided the audio. Thanks Kunihiko-san! ), Matthew Carter, Akira Kobayashi, and John Downer. And a very packed room of avid typefolk.</p>
    <p>...and my mediocre ( at best) video making skills. The video is composed of an image of the font being critiqued and of still photos taken at the event. Still, I hope that what I lack, the subject matter more than makes up for. </p>
    <p>Viva TypeCon!!!</p>
    <p>Viva Typecrit!!!</p>
    <p><a href="http://www.youtube.com/watch?v=TfMxpxMpcTI" title="http://www.youtube.com/watch?v=TfMxpxMpcTI">http://www.youtube.com/watch?v=TfMxpxMpcTI</a></p>
    <p>This is part 1 of 4. I can't promise when parts 2-4 will show up. But I will do my best to make them ASAP.</p>
