    html: <p>We are grateful to Eben for putting this piece together, and to Apple for donating the software to accomplish the mission. We are so pleased the participants in the crits allowed us to document their efforts in this way. Thanks, as always, to Matthew, John, and Akira, for doing these critiques. They generously give of their time and experience to help other type designers grow and learn. The three wise men will be back in Buffalo to do it once more. Can't wait to see the new types that come out of it.</p>
