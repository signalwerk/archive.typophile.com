      <p>Go to VOLT Options (Tools menu) and turn on the option 'Use extension lookups'. When lookups exceed a certain size, you need to turn on extension lookups.</p>
      <p>If this doesn't solve the problem, that would indicate a problem within your lookups, but VOLT normally identifies most common problems.</p>
