    date_raw: 27 Nov 2010 — 9:48am
    votes: null
    html: |-
      <p>OpenType Arabic script layout engines will apply the init, medi and fina (and isol, if present in the font) before they apply the ligature features. This means that the input glyph sequences in your ligature lookups need to be the init, medi etc. forms. So e.g. (using the glyph name convention I use in my Arabic projects):</p>
      <p>aLam.init aAlif.fina -&gt; aLam_aAlif<br>
      aLam.medi aAlif.fina -&gt; aLam_aAlif.fina</p>
      <p>rather than</p>
      <p>aLam aAlif -&gt; aLam_aAlif</p>
      <p>aLam_aAlif -&gt; aLam_aAlif.fina</p>
