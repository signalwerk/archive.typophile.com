    html: |-
      <p>Regarding your other question, on the number of ligatures per lookup, I'm afraid I don't know the answer. There certainly would be a limit, but I'm not sure whether simply invoking the extension mechanism resolves this.</p>
      <p>Have you considered splitting your ligatures into a small set of contextual variant glyphs and strokes and combining them dynamically using the curs (cursive attachment) feature? This seems to me much more efficient and flexible than creating 25,000 ligatures.</p>
