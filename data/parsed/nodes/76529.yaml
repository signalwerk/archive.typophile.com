    user: 1262
    date: 2010-12-10T20:03:00
    date_raw: 10 Dec 2010 — 8:03pm
    votes: null
    html: |-
      <p>The input sequences for the ligature substitutions, that is the list of letter form glyphs that become the ligature, must be the init, medi and fina forms, because these are the forms that will exist in the glyph string after the processing of those features and before the processing of the ligature feature. Whatever you have called the init form of letters, the medi form of letters and the fina form of letters, these are the names that you need to use, in the appropriate order, as input for your ligature substitutions. So, for example, you might have called your init glyphs *.init, where * is the name of the default letter glyph, e.g. lam, so: lam.init, lam.medi and lam.fina. So the input sequence for an isolated lam+yeh ligature would be lam.init yeh.fina, while the sequence for a lam+yeh ligature in a final posision would be lam.medi yeh.fina. </p>
      <p>If you name your ligature glyphs so that they represent the input glyph sequence, e.g. calling a ligature glyph lam.init_yeh.fina, then it is very easy to create the lookups.</p>
