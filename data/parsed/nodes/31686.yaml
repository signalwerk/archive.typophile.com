    <p>Hello people,</p>
    <p>Haven't been here for a while, and certainly not since the start of the year, so to coincide with CNY, Happy New Year to you all. Anyway, I came for a reason, and that reason was to ask:</p>
    <p>Is <a href="/wiki/H.%20berthold%20AG" class="freelinking" rel="nofollow">Berthold</a> <a href="/wiki/Akzidenz%20Grotesk" class="freelinking" rel="nofollow">Akzidenz Grotesk</a> available to purchase as separate weights? A client has requested we use the regular and medium weights to set their product copy… but they appear to only be available to buy as a family. Is this right?</p>
    <p>Thanks for your help,<br>
    Higashi</p>
