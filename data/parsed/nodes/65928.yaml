    votes: null
    html: |-
      <p>We're tradesmen. We buy the tools we need for the job at hand. Over the years, we collect a large set of tools.</p>
      <p>It's nice to have a beginner set of tools, but unless you know exactly what you are fixing/building, you're just guessing at what you need.</p>
      <p>Keep in mind that a lot of the 'basic sets' are collected through indirect means...free faces, all the bundled fonts with Adobe products, system faces, etc.</p>
