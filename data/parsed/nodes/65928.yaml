      <p>Am I missing something here?</p>
      <p>So designers buy a basic set of fonts when they start (I assume you don't start with nothing and only acquire faces as you get initial jobs). Then they only buy fonts when needed for a job, and have the customer pay. Does that mean you are spec'ing fonts that you have never used before? What do you go on to spec the font then ... just the samples from the typehouse, or some other more detailed process?</p>
