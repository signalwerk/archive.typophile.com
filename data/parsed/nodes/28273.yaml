      <p>i think mine is similar 2 mackit's,</p>
      <p>Depending on what settings you have set for weight, line caps, and joins, you can create a stitched line, a skip line, or almost anything. You control the dash and gap (the space between each dash) by entering numbers into the Dash and Gap fields at the bottom of the stroke palette.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/stroke_5382_3467.jpg"></div><p></p>
      <p>If you're just using one sequence, you can enter just the first two fields. Or you can enter up to three different Dash and Gap settings to achieve complex dash patterns.</p>
      <p>examples below:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/06tyi91_3840.gif"></div><p></p>
      <p>with rounded caps the larger the weight the larger the gap number just play around n u'll get the effect u want.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tute_5795.gif"></div><p></p>
    html_clean: |-
      <p>i think mine is similar 2 mackit's,</p>
      <p>Depending on what settings you have set for weight, line caps, and joins, you can create a stitched line, a skip line, or almost anything. You control the dash and gap (the space between each dash) by entering numbers into the Dash and Gap fields at the bottom of the stroke palette.</p>
      <p></p><div class="imageWrap"><img src="/files/stroke_5382_3467.jpg"></div><p></p>
      <p>If you're just using one sequence, you can enter just the first two fields. Or you can enter up to three different Dash and Gap settings to achieve complex dash patterns.</p>
      <p>examples below:</p>
      <p></p><div class="imageWrap"><img src="/files/06tyi91_3840.gif"></div><p></p>
      <p>with rounded caps the larger the weight the larger the gap number just play around n u'll get the effect u want.</p>
      <p></p><div class="imageWrap"><img src="/files/tute_5795.gif"></div><p></p>
