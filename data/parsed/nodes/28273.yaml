    <p>I've been trying to make a perfect dotted line in <a href="/wiki/Adobe%20Illustrator" class="freelinking" rel="nofollow">Illustrator</a>, but nothing seems to work...<br>
    I've made my own dotted brush, but it keeps deforming in corners... I've tried using a dashed line with round corners &amp; short dashes, but the dots are not perfect circles... At the end I just used the line as a textpath, typed bullets &amp; shifted the baseline negatively to center the bullets on the line.<br>
    I've searched the internet on tutorials, but they only ever seem to be about expanding dashed lines (flatten transparency; for those interested). I refuse to believe Adobe still hasn't included some way to create a dotted line with perfect circles &amp; an even spacing inbetween them.<br>
    Can anyone help?</p>
  html_clean: |-
    <p>I've been trying to make a perfect dotted line in <a href="/wiki/Adobe%20Illustrator" class="freelinking link-lost" rel="nofollow">Illustrator</a>, but nothing seems to work...<br>
