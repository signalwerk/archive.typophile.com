    html: |-
      <p>I've been using Filip's method and it works great! However, I found that the circles/dots can become distorted if they are on an irregular path. This doesn't matter if your dots are only going to be a couple points wide, but it will matter if you want large dots.</p>
      <p>You can fix this by creating the original dot with a Stroke INSTEAD of a Fill. Things to remember:</p>
      <ol>
      <li>Make sure that the stroke fills the inside of the circle</li>
      <li>The Stroke options MUST be set to "Round Join" and "Round Cap" (these are in the Stroke Palette")<div class="imageWrap"><img src="http://typophile.com/files/stroke_5381.jpg"></div></li>
      <li>The wider the stroke is in comparison to the width of the circle, the less possibility there is for distortion. A 1pt circle with a 25pt should be more than sufficient to keep the dots circular. If you want to be more certain that they stay circular, just raise the stroke width.</li>
      </ol>
      <p>Enjoy!</p>
