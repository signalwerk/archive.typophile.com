      <p>Filip's method is probably the better option. To get the dots to 'outline', all you have to do is save your file in one of the old EPS formats. When you reload the file, the dots will only be there and not the lines.</p>
      <p>When you do that though, make sure it's your final draft -- otherwise you'll lose your editability of the lines.</p>
