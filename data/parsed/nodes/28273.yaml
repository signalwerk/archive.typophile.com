      <p>I just made a couple, and they worked out okay. You have to have the math correct to make circles meet in the corners. For instance. a 240 x 200 point box, with 6 point circles placed 10 points apart works perfectly. (using a stroke of 0, gap of 10, and round caps). Another one, same size box, with 3 point circles placed 8 points apart. (stroke 0, gap 8, round).</p>
      <p>The trick is to figure out the gap to fill the size of box you need.</p>
      <p>And I don't understand the inability to get round circles in a stroked border. How are they not round?</p>
