      <p>Alex, the T is similar, but that is almost the only part that matches. <a href="http://new.myfonts.com/fonts/suitcase/idealista/semi-bold/characters.html" rel="nofollow">Idealista</a> does not have E, S, G, etc. like the sample on the poster. </p>
      <p>I thought of the Shire Types by Jeremy Tankard, but it doesn't look like any of them overlap these details. Still a mystery to me.</p>
      <p>- Mike Yanega</p>
