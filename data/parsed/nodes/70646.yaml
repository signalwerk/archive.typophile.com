    <p>Does anyone have any idea of what might be the main typeface used in these beautiful Leftloft's posters for Teatro del Scienza?</p>
    <p>This "T" looks different! Maybe a unicase typeface?</p>
    <p><a href="http://www.leftloft.com/projects/teatro-scienza/" title="http://www.leftloft.com/projects/teatro-scienza/">http://www.leftloft.com/projects/teatro-scienza/</a></p>
    <p>Thank you!</p>
