    <p>Hey everybody,</p>
    <p>I have made three different g's for my expletus-sans typeface, but I can't choose. Making an alternative might casue the user to make a wrong decision and I still have to decide which g to make default. the last g will be quite hard to convert to bold, because the gap takes in quite some space. Any comments are welcome!<br>
