    html: |-
      <p>&gt; I simply can't vertically compress it any more without making it look ugly.</p>
      <p>Try this:</p>
      <p>1, make the upper part of the loop horizontal<br>
      2, make the upper part of the loop slightly thicker than the bottom bit of the loop<br>
      3, move the all bits up and tweak<br>
      you might need to make parts of the letter g thinner to achieve optical balance with the other glyphs<br>
      Also, that broken join, it may help to make it more vertical in this glyph.</p>
      <p>If that doesn't work, IMO you could use the middle as default, top as alt, or reverse - depending on what you want.</p>
    html_clean: |-
