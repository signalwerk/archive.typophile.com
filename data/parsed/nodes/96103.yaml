    <p></p><div class="imageWrap"><img src="http://typophile.com/files/iskra6_3966.gif"></div><p></p>
    <p>A practical sans serif need not appear dry, constructed, or derivative. It can excel in its sensible role and yet possess a distinct flair. <a class="freelinking external" href="http://www.type-together.com/Iskra" rel="nofollow">Iskra</a> (spark or flash) is a new sans serif designed by Tom Grace.</p>
    <p>It was conceived to challenge the limits between utilitarian and decorative. Sporting a low-contrast profile, it is a study of bridled energy in the Cyrillic and Latin scripts. Its eye-catching forms are an oblique tribute to the less-predictable style of brush lettering, and contain daring, elegant curves, economical proportions, and a slight top-heavy asymmetry. Its warmth comes from the subtle emphasis on the structures and details of individual letterforms, whereas its solidity is demonstrated through its balanced rhythm over long spans of text.</p>
    <p>Each font supports over 75 languages and is hand-tuned for a pleasing legibility and aesthetic both in print and on screen. This type family makes an excellent choice for presentations, articles, branding, and advertising. Available in 14 styles, Iskra represents a fresh, stimulating, forward-looking perspective on how we see both the vitality of the particular letter and the overall harmony of text. <a class="freelinking external" href="http://www.type-together.com/Iskra" rel="nofollow">Iskra</a> is available in three different character repertoires: Iskra, complete set — Iskra CYR, Cyrillic-based subset with a Latin supplement — Iskra LAT, Latin-based subset.<br>
    Both the LAT and CYR series conform to most standard codepages used by typical software covering their respective scripts. All three series have similar OpenType functionality.</p>
    <p><strong>more information:</strong> <a class="freelinking external" href="http://www.type-together.com/Iskra" rel="nofollow">http://www.type-together.com/Iskra</a></p>
