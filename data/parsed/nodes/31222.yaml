    html: |-
      <p>Most everything I’ve done that’s related to typography has been of the extremely amatuerish nature. That smallcaps font for Palladio is the only font I’ve ever tried to make.  It was a good learning experience, even though I was only trying to modify an existing typeface. Just after I made that font, small caps for Palladio were introduced into the standard LaTeX distribution by someone else who’d done a better job.</p>
      <p>Actually, the reason I wanted a little font management had to do with the fact that I was the newsletter editor for my church newsleter for several years. It was a nice excuse to learn about design and play with typefaces, but I didn’t want all of the one-use-only display faces installed all the time (the food-of-the-month always had its own typeface).  I had a folder for each month’s newsletter that I could enable or disable.</p>
      <p>I’m always interested in posts on typophile that mention Linux. Can I ask what motivated your initial question?</p>
