      <p>Nicolas Spalinger is the person for Debian and (I think) Ubuntu by extension. He has an email address at sil.org. Jim Gettys was one of the people responsible for getting the Bitstream Vera fonts into Gnome, and is now at OLPC. Between the two of them, I think they’d have a pretty good sense of who to go to next.</p>
      <p>You can tell them I sent you - they both know me, and I doubt my introduction would hurt your chances <em>too</em> badly.</p>
