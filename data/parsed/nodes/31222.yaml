      <p>I see now.</p>
      <p>My initail question is because I have a monospace for programmers. And I would like to talk to the folks who would be my the end user/customer. Also I am interested to know if they have different priorities/opinions than windows or other programmers. </p>
      <p>But I am not finding it easy to find the right person people to talk to or the right way to make contact. It could also be that fonts are just not a priority &amp; so I won’t be getting alot of info. </p>
