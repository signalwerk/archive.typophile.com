      <p>Don’t know if it’s helpful, but I’ve had brief communication with Craig Drummond, who has an email address with kde.org. He’s been working on the font installer/viewer in KDE. The only reason he might remember me, however, was that I was evidently one of the only person who wrote in to tell him that I missed the “font hiding” feature when it was removed from the font installer.</p>
      <p>Scott Thatcher</p>
