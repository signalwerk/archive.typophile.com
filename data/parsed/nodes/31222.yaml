      <p>Visual Studio was the first product to supply Consolas, and the CT team did some research that showed developers could spot more bugs (typos in code) with Consolas (CT enabled) vs Courier New (CT off). </p>
      <p>I don’t know how many internal folks use Consolas, but anecdotally initially many developers didn’t like ClearType, but also they were amongst the most vocal complainers when CT was broken in Windows XP builds.  </p>
      <p>Mike Duggan may have some more info.</p>
