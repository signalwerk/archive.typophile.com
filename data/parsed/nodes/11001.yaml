  html: <p>Here is my first typeface. It is a modular unicase system designed to combine aspects of upper and lowercase characters (when possible). The forms are inspired by a combination of japanese architecture and digital display. Any feedback is welcomed. <br><img src="http://www.typophile.com/forums/messages/29/8890.jpg" alt="Digidojo"></p>
