      <p>Choosing your tattoo artist is serious business that wants to be seriously considered and researched. There are a lot of hacks out there, but a few artists who truly deserve the name. </p>
      <p>Btw, this sad "create" tattoo looks like the ink is too deep in the skin, causing extra bleeding, apart from being crooked to begin with … </p>
      <p>What you said about kerning is certainly true. I have a very abstract tattoo, actually in the same spot as on this image (inside of left wrist), which is basically a line of dots in varying sizes. One dot is quite a bit too far on the left, which used to bug me a lot (now it's just 'the way it is'); the tattooist had it even further out of line first, &amp; when I complained, she protestingly got a ruler, measured it, &amp; then looked at me and said, "Why do you see this? Nobody sees this! It was like HALF A MILLIMETER off!" I'm not going there again.</p>
      <p>The Helvetica tat looks really nicely done, though. I mean, it IS Helvetica. :)</p>
