    html: <p>I was looking through a book in Foyles earlier this week on Helvetica, and noticed that someone had had the name tattooed along their forearms in the typeface. I remember thinking it looked “ok” but not much better. <br><br>Problem is that it is fairly unlikely that a tattooist will appreciate some of the subtly in your chosen typeface, and may have diﬃculty replicating its dimensions and spacing in ink under your skin. <br><br>Also bear in mind that the skin on your arm moves and distorts quite dramatically. I have a geometric design that runs from shoulder to wrist, and a twist of my wrist distorts the design greatly from wrist to elbow. I knew this would happen and designed it in such a way, with the help of my artist, to make it part <span class="caps">OF</span> the design itself. I think that typographic tattoo are inherently going to risk looking <i>wrong</i> due to distortion for large periods of time. That is not even taking into consideration how your body will age with time. Take this into account, and try transferring a design to your arm to see what happens in normal movement. <br><br>Another thing to take into consideration is trapping. Ink <i>can</i> spread slightly under your skin over time, and diﬀerent parts of your arm may be liable to spread at diﬀerent rates (this is especially true if you are going to have a multiple sitting with your artist — their mood and therefore the execution of their craft will vary between sittings). Be careful therefore when choosing serifed typeface with ﬁne detailing, and bear this in mind when deciding how large your tattoo will be overall. <br><br>Remember to take into account how your tattoo will fade too, especially if you are having shading or colour work. <br><br>Check out this site — you will ﬁnd loads of stories and photos, and I believe there galleries have a speciﬁc section on typographic tattoos. Those here of a nervous disposition may not want to follow the link, by the way. <br><br><a href="http://www.bmezine.com/" target="_blank">http://www.bmezine.com/</a> <br></p>
