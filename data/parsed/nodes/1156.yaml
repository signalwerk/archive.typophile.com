      <p>I realize this is a SUPER old post but hopefully the info here will be useful for others too.</p>
      <p>My number one suggestion would be to talk with your artist. (or better yet, several artists to see who has the best understanding of type-centric pieces) Take several printed examples of the type you're considering and explain to them what it is about each typeface that you especially like. This way they can tell you how it's not really going to be possible to keep the integrity of the very fine lines in Bodini at 12pt but that perhaps going larger or with a similar, slightly heftier face will give a similar outcome.</p>
      <p>Trust a good artist. They want you to be happy!</p>
