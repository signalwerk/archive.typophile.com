      <p>I know a lot of people that went to my college who had type tattoos, and they are collectively the reason I doubt I'd ever consider getting one.</p>
      <p>Can anybody guess what typeface this one's in?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/n502517205_4906_9150_3494.jpg"></div><p></p>
      <p>The answer is: it was originally Garamond, but it sure isn't anymore.</p>
      <p>I figured, although I'm not terribly anxious to go out and get a tattoo (I'm way too over-cautious and afraid I'd regret it at some point) I could not get a tattoo from anybody who had <em>less</em> typography sensitivity than me.</p>
      <p>If I got a tattoo with type, and there was a shape or kerning issue, it honestly <em>would</em> bother me literally every time I saw it.  I figured if I were ever to get a tattoo, because of my high standards I'd want to go to the best tattoo artist I could find, and I imagine it would be very very expensive and require me to travel some distance to get there.</p>
      <p>For my conscience's sake, do you know your artist has decent typographic sensitivity, enough to accurately reproduce your chosen piece?  It's a fact that 40% of a tattoo parlour's business is covering up another tattoo artist's mistake.  Those odds are just too high for me.</p>
    html_clean: |-
