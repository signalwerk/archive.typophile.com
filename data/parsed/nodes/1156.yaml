      <p>That's why I picked a Garamond for mine (specifically Garamond Premier Pro). I figure that if I'm going to have a typeface on my body for the rest of my life, it shouldn't be one that's going to go out of style any time soon. So why not use one that's 500 years old?</p>
      <p>Although in retrospect I should have used the regular weight instead of the semibold. I thought the regular wouldn't have been hearty enough to hold up, but the bleeding of the tattoo causes it to thicken out a bit. So I guess I should have used the regular weight of the caption cut. But retrospection does not equal regret. I probably would have more regretted not getting a tattoo because I was agonizing over the font.</p>
