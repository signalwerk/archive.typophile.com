    html: |-
      <p>I understand that it's taken from a passage in Cicero, but that doesn't mean that it makes any sort of sense. You gave me a translation of the entire passage, not of just that phrase. The phrase begins in the middle of a sentence, in the middle of a word (I'm not a Latin scholar, but I think that "em" is a suffix on "dolor"), and a conjunction is deleted. It's not a complete thought. It's like saying that "monds always reminded him fate of unrequited" makes sense because it's taken from a real passage of text (from <em>Love in the Time of Cholera</em> by Gabriel Garcia Marquez).</p>
      <p>As far as I can tell, the actual translation of "dolorem ipsum..." is "pain itself it is pain"; never mind eliminating the "do". Tell me that "lorem ipsum dolor sit amet" by itself makes any sense.</p>
