    <p></p><div class="imageWrap"><img src="http://typophile.com/files/img1_5327.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/img2_3709.jpg"></div><br>
    Here are more images showing composition sticks, type cast slugs, matrices, and press views showing the workings of the R.Hoe &amp; Co. handpress, rods and springs, toggle, bar and platen. The three composings ticks are a standard hand setting stick, a straight Ludlow roman stick and a centering stick. Views of the centering stick with matrices show casting side and top of Eusebius open 36 point brass mats.  More to come.<br>
