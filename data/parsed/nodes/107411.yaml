    html: |-
      <blockquote><p>I have just discovered that Audi uses the same font for their dials.</p></blockquote>
      <p>Sorry but they don't look the same to me. You could easily see the differences comparing /6 counter of Alfa Romeo 4C (your second sample) and Audi RS5 one. Audi RS5's is rounder than Alfa's. But you're kind of right because as you perfectly said form the beginning, they're all very close to Eurostile Extended without definitely being it. I'm also pretty convinced you'll get no "better" answer than "custom/proprietary typeface(s)" (in the same vein as Eurostile Extended/Microgramma to me).<br>
      More credit for the "Eurostile Extended" track: <a class="freelinking external" href="http://4c.alfaromeo.com" rel="nofollow">Alfa Romeo 4c</a> website is using it everywhere...</p>
