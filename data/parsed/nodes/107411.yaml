      <p>Alternatives: <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/miedinger" rel="nofollow">Miedinger</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/stereo-gothic" rel="nofollow">Stereo Gothic</a>, <a class="freelinking external" href="http://www.myfonts.com/search/kursk" rel="nofollow">Kursk 105/205</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/cheapprofonts/bitsumishi-pro-v2" rel="nofollow">Bitsumishi</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/psyops/armchair-modern-ot-agauge" rel="nofollow">Armchair Modern</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-qtype" rel="nofollow">QType FF</a>, some <a class="freelinking external" href="http://www.myfonts.com/foundry/Masterfont/" rel="nofollow">Masterfont</a> are using a slightly modified version of Eurostile Extended as latin counterpart (<a class="freelinking external" href="http://www.myfonts.com/fonts/masterfont/propaganda-mf" rel="nofollow">Propaganda</a>...), <a class="freelinking external" href="http://www.moorstation.org/typoasis/designers/casady_greene/j_p.htm" rel="nofollow">Micro Extend</a> (Casady &amp; Greene version of Eurostile Extended/Microgramma), <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/quadrat-grotesk-new" rel="nofollow">Quadrat Grotesk New</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontmesa/brew-master-modern" rel="nofollow">Brewmaster Modern</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/from-the-stars" rel="nofollow">From The Stars</a>, <a class="freelinking external" href="http://www.houseind.com/fonts/housegothic23/viewfonts" rel="nofollow">House Gothic 23 Extended</a>, <a class="freelinking external" href="http://haroldsfonts.com/portfolio/metro-df" rel="nofollow">Metro DF</a><br>
      Related discussions with more alternatives for these digits: <a class="freelinking external" href="http://typophile.com/node/95364" rel="nofollow">Max Bill clock face design for Junghans</a></p>
