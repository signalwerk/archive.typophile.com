      <p>Incidentally, <a class="freelinking external" href="http://www.um.u-tokyo.ac.jp/publish_db/1996Moji/05/5901.html" rel="nofollow">this page</a>, also in Japanese, turned out to be even more informative, finally giving me the exact sizes I sought.</p>
      <p>It did take some effort to distinguish the sizes for the Japanese version of this scale from those for the original Chinese version, but I think I managed it despite Google Translate being only of limited assistance. Perhaps the Korean scale is in one of the tables too, but for now I am defeated there.</p>
