  html: |-
    <p>Show off your new faces at TypeCon!</p>
    <p>Submissions are now being accepted for inclusion in <a href="http://www.typesociety.org/typegallery/" rel="nofollow">TypeGallery2012</a>, the annual unjuried showcase of new typeface design presented by the <a href="http://www.typesociety.org/" rel="nofollow">Society of Typographic Aficionados</a>.</p>
    <p>Typefaces that have been created, published, or significantly updated between June 2011 and July 2012 will be accepted. Both traditional type specimens and designs showcasing typefaces in use will be accepted. Please review the <a href="http://www.typesociety.org/typegallery/guidelines/" rel="nofollow">submission guidelines</a> for complete details.</p>
    <p>The submission deadline is <strong>July 27th, 2012</strong>.</p>
    <p>Works will be exhibited this summer during <a href="http://www.typecon.com/" rel="nofollow">TypeCon2012</a> in Milwaukee. They also have the potential of becoming part of an online exhibition. In past years, many of the the works have travelled internationally after TypeCon and have been selected to appear in print publications produced by SOTA.</p>
