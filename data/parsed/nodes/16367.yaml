    <p>HOUSE 33 TEMPORARY TYPE BOOKLET:</p>
    <p>Fontworks co-sponsored the highly successful St Brides conference last month which had a theme of "Temporary Type". A brilliant full colour booklet was designed by House Industries specially for the conference and features the first season of lettering for their House33 clothing collaboration with fashion impresario Barnzley. If you're a House Industries fan you'll definitely want one of these! </p>
    <p>Copies of the limited edition booklet, which also features 3 spreads by G-Type's Nick Cooke, are now available to buy (see link below) or are free of charge when ordering any House font pack (while stocks last).</p>
    <p>View images and read the mini Conference review:<br>
    <a href="http://www.fontworks2.type.co.uk/fw/doc?d=public/stbride/temptype" title="http://www.fontworks2.type.co.uk/fw/doc?d=public/stbride/temptype">http://www.fontworks2.type.co.uk/fw/doc?d=public/stbride/temptype</a><br>
    View sample spreads from House33 booklet and place an order:<br>
    <a href="http://www.fontworks2.type.co.uk/fw/doc?d=public/displaycase/house33" title="http://www.fontworks2.type.co.uk/fw/doc?d=public/displaycase/house33">http://www.fontworks2.type.co.uk/fw/doc?d=public/displaycase/house33</a></p>
