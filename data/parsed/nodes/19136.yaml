    <p>Hello all.</p>
    <p>I am a young snot nosed student<br>
    in pursuit of a degree in this<br>
    wide world of design.</p>
    <p>I was assigned to give an oral report<br>
    to the rest of my cohorts and would<br>
    appreciate any feedback from seasoned veterans.</p>
    <p>Round One.</p>
    <p>What’s the most important skill<br>
    you want in a junior designer?</p>
    <p>Round Two.</p>
    <p>What design skill did you learn<br>
    that was the most useful?</p>
    <p>Round Three.</p>
    <p>What was a waste of time?</p>
    <p>That’s all Folks!</p>
