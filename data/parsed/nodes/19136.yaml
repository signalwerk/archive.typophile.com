      <p>Conditional of  the kind of design you’re interested in, but if you plan to do print work for the most part I’d give the following:</p>
      <p>1.<br>
      The 3 P’s – Prepress, prepress, production. If you want to make it as a designer you have to start somewhere and one of the best ways to show that you deserve those creative projects and are worth hiring is file handling. It’s surprising how many recent grads do not know how to properly package a file for the printers or know the finer nuances of production work. Some may argue that there’s great people that only do this their entire career, and it’s true not every designer will be great and will find their niche doing one of these very important jobs. Knowing these skills well will at least get your foot in the door at a local print shop; up to a large studio or agency. It improves your speed on the computer, forces you into the habit of checking details and will help you immensely as you further your career.</p>
      <p>2.<br>
      Paper first. It’s the computer age and there is a strong urge to not to roughs/comps/ sketches on paper. It’s a skill I find that gets over looked. Learning to draw is a great skill that everyone should try to work on.</p>
      <p>3.<br>
      Learning isn’t really a waste of time, sure you’ll find things that are stupid or that you already knew, but overall there’s nothing that comes to mind that was a ’complete waste of time’.</p>
