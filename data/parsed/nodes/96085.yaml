  html: <p>Hi, I'm trying to photoshop a reply to this nametag invitation, and to edit what it says, I really need some help with the font. I know the seems like a really common font, but I'm really not sure what it is, even after looking it up online (the match wasn't the same).  I already figured out the handwritten part to be "Complete in Him." </p><div class="imageWrap"><img src="http://typophile.com/files/09-04-2012 05_5508.png"></div> That's the front part. On the back , there seems to be a different font for the text in black. I couldn't ID that either, and I'm not sure the orange font is the same as the font in the front. <div class="imageWrap"><img src="http://typophile.com/files/09-04-20122 05_5459.png"></div> Can you guys help me out? Thank you so much!<p></p>
