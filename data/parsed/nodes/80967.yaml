    html: |-
      <p>In the foundry type days of metal, fonts generally had no kerning, as we understand it.</p>
      <p>Therefore, combinations like df and gy were allowed to butt up to one another (not overlap, of course), and created odd holes in the flow of text, but this was not considered an issue, as there were many such holes, especially after cap T, V, W and Y followed by a lower case vowel. The concept of kerning for aesthetics/readability did not exist.</p>
      <p>Consequently, there was no onus on type designers to design italic g to avoid this problem.<br>
      Hence oldstyle revivals that are faithful to lettershape, but anachronistic because they add copious 21st century kern pairs to smooth text "color", should find some digital way to remediate the problem.</p>
      <p>With the change from oldstyle to modern in early 19th century, the single-bowl italic g solved the problem.<br>
      With the advent of historicism c.1900, and the re-introduction of many old style typefaces, the problem re-emerged.</p>
      <p>Linotype introduced "two letter logotypes" in the mid 20th century, for those problematic cap/lower case sequences.<br>
      Linotype also redesigned italic f to have a straight descender with no hook/ball, in several faces.<br>
      Monotype produced special ligatures for its large Garamond Italic, for character combinations such as gg, gf, etc.</p>
      <p>Today, the options are:</p>
      <p>- add positive kerning<br>
      - create an OpenType ligature<br>
      - create an OpenType alternate form of f, g, and y, for contextual substitution<br>
      - and of course, design the glyphs so that the problem doesn't occur even in plain text<br>
      - combinations of the above</p>
      <p>Both the OpenType features are on by default</p>
