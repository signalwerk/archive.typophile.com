      <p>For the record, Williams Caslon Text Italic does have positive values for these two kern pairs. One may disagree with how Bill chose to address the situation, but I don’t think it’s accurate to say that “someone didn’t pay attention” in this case.</p>
      <p>As Nick points out, these are historically problematic combinations, especially for designs which attempt a certain historical fidelity.</p>
      <p>John Downer has managed to design the Iowan Old Style italic <em>g, f,</em> and <em>y</em> glyphs so that no kerning values are needed in these combinations, while still retaining the essential characteristics of his historic models, relatively uncompromised — no mean feat.</p>
