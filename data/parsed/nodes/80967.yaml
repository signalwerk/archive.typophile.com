    html: <p>I didn’t mean to be rude by saying ›paying no attention‹. Nick took some more time to elaborate on this kerning issue. But reviving a classical type for digital use there would have been several options to get around this, as Nick pointed out. Unless it was on purpose to keep the historical fidelity. But as printing is much more perfect nowadays it is debatable to keep these ›flaws‹. One wouldn’t mind that as much in letterpress i guess.</p>
