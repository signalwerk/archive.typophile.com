    <p>Hello everybody,</p>
    <p>why are letter pairs like ›gy‹ and more often ›gf‹ in so many otherwise nice italic fonts so badly kerned? For example:</p>
    <p><a class="freelinking external" href="http://www.fontshop.com/fonts/singles/font_bureau/williams_caslon_text_italic_ot/?&amp;sample_text=meaningful%20Epistemology&amp;acs_pt=32" rel="nofollow">Williams Caslon Text Italic OT</a></p>
    <p>One of the rare exceptions:</p>
    <p><a class="freelinking external" href="http://www.fontshop.com/fonts/singles/bitstream/iowan_old_style_bt_pro_italic/?&amp;sample_text=meaningful%20Epistemology&amp;acs_pt=32" rel="nofollow">Iowan Old Style BT Pro Italic</a></p>
    <p>I’ve chosen the two examples, just because I like both typefaces very much.</p>
    <p>Some explanations for that fact?</p>
    <p>Thank you and kind regards</p>
    <p>Mario</p>
