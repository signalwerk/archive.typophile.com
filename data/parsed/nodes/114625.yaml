  html: |-
    <p>Hello,</p>
    <p>I'm having an issue with ExtraBold weight, which is the last one in row I kerned for an font family.<br>
    Beside it, there is Light, Regular, SemiBold, Bold and ExtraBold.<br>
    All weights have same UPM, same values for ascender, descender, Caps height, x-height... everything is same in all weights from field Font Info &gt; Metrics and Dimensions!</p>
    <p>For some reason unknown to me (this happens the first time), ExtraBold is displayed like it's done in ~1500 UPM, bigger, with top part of glyphs cut off. While other weights look normally, as it should!</p>
    <p>When I install ExtraBold and try it in Illustrator, Photoshop, Word... it matches with the rest of weights, so no any visual difference (in height, position or anything like that).</p>
    <p>Does anyone know what might be the reason for this?</p>
    <p>Thanks!</p>
    <p>Screenshot attached.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ScreenShot032_6447.png"></div><p></p>
