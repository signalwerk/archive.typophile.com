    html: <p>Benjie, <br> <br>Thanks for positive response on some of my typefaces. Well to judge from your first pick (Avenir), I think both Stalemate and Sophisto could do well and meet your requets. Stalemate was made to fit well, both in print and on the web. You might find some limitation in weights, it all depends on the size of this project and graphic profile? Sophisto on the other hand has many weights and addtionla features. Also a set of 5 dingbats and patterns which could be very useful is mastered with cleverness. Pdf-files are availabe for download at the MRF website. Please take a moment and let me know if you ahve further questions. <br> <br>Cheers/SH</p>
