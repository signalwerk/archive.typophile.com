  date_raw: 6 April, 2005 - 4:40am
  votes: null
  html: "<p>Hi, <br> <br>I'm looking for a type face for the company I work for. We are a press cuttings agency, which means we provide clients with information and summaries of the coverage they receive in the printed press (whether they're liked, who's writing about them etc.) Our product is naturally quite abstract and we tend to change image frequently. I would like to find a type face to use as a solid foundation to build a complete branding on. <br> <br>I suppose almost everyone wants to look professional and business-like, but in addition I want to convey a sense of honesty, simplicity and accuracy. <br> <br>The font will have to be comfortable on screen as that's where it will be seen most often (pdfs &amp; website), it will also have to stand up to being faxed (we send out 50-100 faxes a day). Occasionally it may be used in small scale advertising but far less frequently than our everyday use. <br> <br>I envisage use as body type with probably a variety of weights to allow one to be used for display. <br> <br>I like the look of avenir: <a href=\"http://www.veer.com/products/typedetail.aspx?image=ADT0003224\" target=\"_blank\">http://www.veer.com/products/typedetail.aspx?image=ADT0003224</a> but I'm a little unsure and wondered if anyone favoured an alternative. <br> <br>The budget doesn't exist yet as I want something to present when I ask my boss for money. If it's not too pricey, I may pay for it myself. <br> <br>I would greatly appreciate suggestions.</p>"
