    <p>Hi Guys,</p>
    <p>I don't actually use this forum like I should be because I'm not a typographer by any means but it's a brilliant resource for getting advice on type related design (lets admit it, 90% of it is type) and you guys are pros when it comes to whitespace and composition. I try to throw my opinion in when its suitable and helpful.</p>
    <p>Today I thought I'd post a completed job for it to be torn apart and learn me something.<br>
    Red Courgette is a client of mine headed by an over-qualified chef. She's done the rounds of restaurants and world travel and has decided to dig into the catering pie to deliver her delicious goods with credits in the right places.</p>
    <p>I already had a vision for this design based on a name the client had for many years since her travel of the deep US south, I needed utilise all the typical food industry keywords like fresh, wholesome, passionate, gourmet, delicious, then ignore them and keep a very honest, home-grown feel that accurately depicted who she is and what she's about.</p>
    <p>Here's the finished product. Semi-literal graphically with custom type to anchor it in.</p>
    <p><img src="http://i43.tinypic.com/17ssbs.jpg" border="0" alt="Red Courgette Logo"></p>
    <p>Any feedback is welcomed, composition and technicalities of the type would be most helpful.</p>
