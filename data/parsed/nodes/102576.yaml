      <p>@Penn - I smiled when I read this, you're right on the money. The tagline was very much an afterthought but a necessary one at that.<br>
      You're also on the mark with the description of the business which makes me a happy designer. The full stop and no caps was a choice to represent exactly that, honesty, you've got me thinking about it's importance when I've already got a wordmark and illustration to convey what I want. What are your thoughts on straightening the type out and modifying some of the characters to have a straighter form?</p>
      <p>@JamesM - I've deliberately stuck away from the 'put it in a shape' trend. Those elements will come in physical form when they're applicable i.e. packaging &amp; labels.<br>
      Customers need not know what it is specifically, to them it's colourful, unique, is related to food and signifies... dare I say it... gourmet whilst sticking well away from the word. Typically I've found those that don't know don't care for the service she provides in the first place but for those that are interested, it creates a perfect point of conversation.</p>
      <p>@KateB - I'm not sure what you mean about rotating and pointing.</p>
