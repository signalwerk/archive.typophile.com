    html: |-
      <p>The script type is interesting, and has a nice playful/quirky feel to it. It's not perfect, but it doesn't feel like it was trying to be in the first place, so I'm happy to go with it. Based on that, along with the warm colors and overall illustration style, I get the idea that the type of food she makes is more about quality, seasonal ingredients, and flavor rather than clean presentational flair.</p>
      <p>My only issue lies with the tagline. It feels like an afterthought — as if you pitched the idea of the logo without it, and she wanted the tagline in, so you shoved up the text and stuck it underneath. It makes the already left-heavy illustration feel even more unbalanced because of it needing to nest to the left of the 'g' descender. I also dislike the use of the period at the end, as it's something that's completely overdone when a company is trying to appear genuine. The lack of initial cap also adds to the faux 'cool' trendiness factor. Another concern is that the tagline is already quite small at this size, so I would be worried about legibility issues if the logo is ever used any smaller than it is here. </p>
      <p>One way to have solved the balance issues with the tagline would have been to sandwich the illustration and center the tagline underneath. That way, you would then also have an easy way to create a simplified version of the logo when the tagline isn't needed (you simply drop it off the bottom).</p>
      <p>Overall, though I find the style of the illustration, and main lettering to work very well together, and another custom wordmark in the world is always a good thing. </p>
      <p>Penn</p>
