      <p>Maybe this is coming too late, but...<br>
      Call me too literal, but I find it a little disjunctive that the illustration under Red Courgette is neither red nor a courgette (squash, anyway). This calls to mind the <a class="freelinking external" href="http://25.media.tumblr.com/tumblr_lmect8Dac41qb2uy7o1_400.jpg" rel="nofollow">Rene Magritte paintings with handwritten labels that don't describe the picture above</a>.<br>
      I also dislike the font pairing. The charming hand-done quality of the brand name makes the italic of the tagline seem clunky and false. That tagline font says "hand-crafted" but it doesn't *say* hand-crafted--know what I mean? I would either try the tagline in the same lettering style as the brand, or go with a typeface that contrasts more clearly (not an italic or script face).<br>
      The style of the wordmark and of the illustration are attractive and fitting for the message, I think.</p>
