      <p>I agree with much of what Penn said, especially regarding the tag line's size, the period, etc. I would eliminate it or put it below the illustration. You've got some good elements but it needs more tweaking. Have you considered putting it within a shape, such as a freehand oval?</p>
      <p>Do you think customers will understand the illustration? I assume it's a zucchini blossom, since courgette is another word for zucchini. I grow zucchinis in my garden, but I think many folks wouldn't know what the illustration represents.</p>
