    <p>Hi everybody,</p>
    <p>I was referred to this site from a "font fan".  I know this is a hand drawing, but maybe someone out there knows something! This vintage hand drawn RCA logo is the inspiration for our album cover.  if anyone knows a similar font i can use to get close, I'll add the lightning bolt with our graphic artist.  our name is<br>
    " ristband " so the "R" and "A" need to be pretty exact.</p>
