    <p><a class="freelinking external" href="http://typographyshop.com" rel="nofollow">TypographyShop</a> has just released three new themes on four shirts. We polled our buyers and a few friends, presenting 9 ideas for new shirts.  By an overwhelming majority they chose <a class="freelinking external" href="http://typographyshop.com/make-the-logo-smaller-large-mens-t-shirt.html" rel="nofollow">"Make the Logo Smaller</a>," followed by <a class="freelinking external" href="http://typographyshop.com/sans_m.html" rel="nofollow">"Sans"</a> and <a class="freelinking external" href="http://typographyshop.com/serif_m.html" rel="nofollow">"Serif</a>."</p>
    <p>Our respondents were split over whether the phrase "Make the Logo Smaller" should be quite small or very large, to drive home the point. So we decided to offer both.</p>
    <p>All who responded expressed a great deal of enthusiasm for the entire range of designs presented and we plan on releasing new themes on a much more regular basis. For the past year we had a grand total of two designs available.  The workload at my firm, <a class="freelinking external" href="http://kinggroupmedia.com" rel="nofollow">The King Group</a> was overwhelming, thankfully, and just keeping up with orders for TypographyShop was enough work without adding to it all with an extended line.</p>
    <p>Now that we've had a bit of a lull we've managed to jump back on the shop and are working on a proper redesign of the site complete with a merchant banking shopping cart  instead of the current PayPal system.</p>
    <p>We've also got some big news involving several well known practitioners from the fields of design, web and type design. Look for designs by or homages to your favorite folks soon.  Part of the business model of TypographyShop is the donation of a portion of each sale to design education programs, so each of our guest designers will be choosing the recipient of the donation from the sales of their products.</p>
    <p>Next month we'll be having our first buyer's design contest. We've got some very talented customers, many of you among them.  I'm very anxious to see what they come up.</p><div class="imageWrap"><img src="http://typophile.com/files/typophile509_4159.jpg"></div><p></p>
