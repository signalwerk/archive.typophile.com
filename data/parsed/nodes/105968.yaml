    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2013-08-31 at 5_4804.57.23 PM.png"></div><p></p>
    <p>This is the titling face from William Root’s 1986 book on bridge strategy, “Commonsense Bidding”. I've found a few similar faces, but nothing that matches the interesting construction of the lowercase 'a' – any ideas what this might be?</p>
