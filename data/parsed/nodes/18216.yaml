    html: |-
      <p>The trick is to outline the type with different stroke widths. The original type is plain white with no stroke. Copy and Paste in Back, then apply a 1 point black stroke. Copy and Paste in Back, then apply a 2 point white stroke. Copy and Paste in Back, then apply a 3 point black stroke. Copy and Paste in Back, then apply a 4 point white stroke.</p>
      <p>Try different stroke widths for finetuning the effect.</p>
