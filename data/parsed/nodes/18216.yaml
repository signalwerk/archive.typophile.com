      <p>metafourik - Right you are.  I noticed that too, but couldnt find anything with slabbier serifs (didnt see clarendon).  Cheers!</p>
      <p>BaldCondensed - Of course!  How easy is that.  See, i jibes me that Illustrator’s stroking can be messy - it strokes the centre of the path, there isnt control to stroke inside or outside like you can on a selection with PSD.  But what an easy solution: whack an unstroked layer of text over the top, which goes over the top of the messy interior stroking that always screws the form of glyphs up.  Problem solved.  Cheers!</p>
