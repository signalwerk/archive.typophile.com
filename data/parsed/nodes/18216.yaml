  html: |-
    <p>Heya,</p>
    <p>Check out this awesome typesetting on Okkervil River’s ‘Black Sheep Boy’</p>
    <p>I’m pretty sure the face is Century Expanded<br>
    <a href="http://www.linotype.com/12811/centuryexpandedroman-font.html#more">http://www.linotype.com/12811/centuryexpandedroman-font.html#more</a></p>
    <p>And it looks like it has a custom double keyline that i guess the designer drew by hand.<br>
    Anyone got any good ideas on how to do this?</p>
    <p>I had a crack at converting to outlines, expanding the path then adjusting beziers around the serifs and fine detail, but this was fairly time consuming, and not entirely accurate (really difficult to get uniform spacing between each keyline.  (i was using Adobe Illustrator btw.)</p>
    <p>Anyone got any ideas on how to do this?<br>
    And who can confirm it is in fact Century Expanded?</p>
    <p>Cheers - Jonny</p>
