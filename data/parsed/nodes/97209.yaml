    html: |-
      <p>Great suggestions. Thanks to all of you !!!</p>
      <p>1. John, I want to assure you that before posting the question I spent almost an hour trying to find the character ɑ U+0251 in the code charts, to no avail.<br>
      2. Bob, the trick with the Combining Grapheme Joiner worked beautifully in Calibri.<br>
      3. Ralf, unfortunately the characteres U+2420 and U+20DE (COMBINING ENCLOSING SQUARE) don't combine in Arial Unicode MS. In Lucida Sans Unicode, the glyph for the character U+2420 (␠) is even better, but the font doesn't have the code U+20DE.</p>
