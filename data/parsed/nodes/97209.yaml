    html: |-
      <p>You won't be able to display the boxed SP with a font, I think.</p>
      <p>These two are easy, and you should find quite a few fonts that support the simple Unicode characters:<br>
      ɑ U+0251<br>
      № U+2116</p>
      <p>The d with a hacek above is a bit trickier. This is best attempted using a lowercase d with a combining hacek mark (U+030C), but software may normalise this as U+010F -- ď --, which has a different form. This is because this is the conventional display of d+hacek in two European orthographies that use the diacritic, Czech and Slovak.</p>
