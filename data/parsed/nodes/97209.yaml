      <blockquote><p>The d with a hacek above is a bit trickier. This is best attempted using a lowercase d with a combining hacek mark (U+030C), but software may normalise this as U+010F -- ď --, which has a different form. This is because this is the conventional display of d+hacek in two European orthographies that use the diacritic, Czech and Slovak.</p></blockquote>
      <p>Try U+0064 U+034F U+030C -- works with some fonts (e.g., Calibri, Charis SIL, Doulos SIL).</p>
