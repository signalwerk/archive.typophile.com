    <div class="info">Submitted by <a href="/user/42614" title="View user profile.">Maura Keller</a> : 25.Feb.2009 2.22pm </div>
      <p>Call For Entries!<br>
    Design Matters: Portfolios 01</p>
    <p>How do you promote yourself as an individual or creative firm? Have you created a glossy leave-behind portfolio piece to ‘wow’ your prospective clients? Or perhaps you’ve garnered attention through memorable promotional tools? Whatever the case, Rockport Publishers would like to potentially feature your portfolio or promotional materials in the upcoming Design Matters: Portfolios. Slated for publication in the spring of 2010, this volume will feature selected designers and  firms who have created unique portfolio designs and promotional materials. </p>
    <p>The deadline for entries is April 3, 2009.<br>
    If you are interested in receiving a PDF of the Call For Entries materials, please send an email to <a href="mailto:designmattersportfolios@yahoo.com">designmattersportfolios@yahoo.com</a>.<br>
    or visit <a href="http://www.rockpub.com/entries.asp" title="http://www.rockpub.com/entries.asp">http://www.rockpub.com/entries.asp</a> for more information.</p>
