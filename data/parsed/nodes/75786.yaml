    html: |-
      <p>I think that Comic Sans works well for an advertisement for a nursery school, for example. It has the problem that it doesn't work well for a lot of the other purposes for which it is being used - it is used in place of Hobo, in place of Papyrus (!), in place of a comic book lettering face, in place of Dom Casual... and not working well in those cases.</p>
      <p>People who don't know much about typography... don't see the need to augment the meagre default typographic resources of the Windows platform even with those offered by, say, sites like Dafont, or CD-ROMs with 1000 Windows Fonts without hinting. This is neither news nor really the fault of Comic Sans.</p>
      <p>There will be bad typography - and Comic Sans will end up a part of it. But then, so will Arial and Times Roman, even though there isn't all that much wrong with those faces.</p>
    html_clean: |-
      <p>I think that Comic Sans works well for an advertisement for a nursery school, for example. It has the problem that it doesn't work well for a lot of the other purposes for which it is being used - it is used in place of Hobo, in place of Papyrus (!), in place of a comic book lettering face, in place of Dom Casual... and not working well in those cases.</p>
