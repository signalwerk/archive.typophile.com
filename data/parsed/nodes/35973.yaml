    html: |-
      <p>As was already mentioned,the <a href="http://www.fontshop.com/products/fontbook/" rel="nofollow">FontBook</a> is a great and current catalogue of type from many of the foremost foundries in the world.</p>
      <p>Other good catalogues to compliment may be:</p>
      <p><a href="http://www.linotype.com/2646/typefacecatalogaz.html" rel="nofollow">Linotype</a> has a new hardcover catalogue that contains their own as well as some Adobe and ITC faces.</p>
      <p><a href="http://www.fontbureau.com/books/" rel="nofollow">Font Bureau</a> has a nice hardcover of their fonts.</p>
      <p><a href="http://www.veer.com/products/type/" rel="nofollow">Veer</a> had some nice font only specimens published in '04 and '05 but those may not be available any longer. But, if you are not already, you should get on their mailing list to get any future type mailings.</p>
      <p>Adobe has their Adobe Type Library Reference Book, which contains all Adobe fonts.</p>
      <p>And of course the Indie Fonts series of books.</p>
