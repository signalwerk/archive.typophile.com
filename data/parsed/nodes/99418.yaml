    html: |-
      <p>Whether or not any particular code is copyrighted, without the source file you're gonna be looking at decompiled code, which can be tricky to decipher. Even the FreeFontPro VFB source file provided with FontLab has a dizzying array of class substitutions.</p>
      <p>Here's what a basic, bare-bones <code>sups</code> feature might look like in FL.</p>
      <p><img src="http://dl.dropbox.com/u/118821/sups-code.png" alt="OpenType panel screenshot"></p>
      <p>Note that the classes here are defined in the OpenType panel for clarity (with some extra line breaks), but they could just as well be made in the Classes panel.</p>
      <blockquote><p>any recommended tutorial for an absolute newbie in OpenType coding?</p></blockquote>
      <p><a class="freelinking external" href="http://ilovetypography.com/OpenType/opentype-features.html" rel="nofollow">This article on OpenType substitution features</a> at I Love Typography covers quite a bit while managing to stay newbie-friendly.</p>
