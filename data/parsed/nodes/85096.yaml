    html: |-
      <p>Word is an excellent tool for composing and printing office documents in an office environment, but was never intended as a professional graphics program—so don't expect it to act like one.</p>
      <p>Either or both of the suggestions above might solve the problem, with an additional proviso: in Photoshop (or equivalent), save to logo as a grayscale <em>TIFF</em> file; this file will be larger than your PNG file, but it should be recognized for what it is—i.e., grayscale—as opposed to PNG files, which use indexed palettes.</p>
