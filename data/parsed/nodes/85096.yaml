    html: |-
      <p>First thing I'd do is determine if it's a problem with the graphic or a problem with the printer. Have you tried printing other black-and-white artwork to see if it prints correctly?</p>
      <p>Also, when in Photoshop you might try changing the graphic to grayscale (image &gt; mode &gt; grayscale) before saving it, and see if that makes any difference.</p>
