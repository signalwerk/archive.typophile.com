  html: |-
    <p>Hi everyone,</p>
    <p>Managed to make a form/template in MS word, only problem is the company's logo should be in black...its not, when i print put the form the logo is all screwed up, some aliasing and the color is somewhere between black/gray/purple :-D</p>
    <p>I imported the vector logo in Photoshop, and saved as a PNG file, then i upload the font in MS Word and place it in the top header without rescaling it.</p>
    <p>what exactly am i doing wrong here, the logo is just in black but doesn't output in black when printed?</p>
  html_clean: |-
    <p>Hi everyone,</p>
    <p>Managed to make a form/template in MS word, only problem is the company's logo should be in black...its not, when i print put the form the logo is all screwed up, some aliasing and the color is somewhere between black/gray/purple :-D</p>
    <p>I imported the vector logo in Photoshop, and saved as a PNG file, then i upload the font in MS Word and place it in the top header without rescaling it.</p>
    <p>what exactly am i doing wrong here, the logo is just in black but doesn't output in black when printed?</p>
