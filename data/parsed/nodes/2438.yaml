    date: 2003-12-17T12:15:00
    votes: null
    html: "<p>Randy, Adobe Standard Encoding is for Type 1 PS fonts, and I don't recommend making Type 1 fonts at all. This is a dying technology. Either make CFF OpenType fonts if you want PS format outlines and hints, or make TrueType fonts. Type 1 fonts rely on external character mapping between 8-bit cells and Unicode codepoints, which is a very limited technology (and the principle reason that Adobe got involved OpenType: Type 1 was a dead end). TT and OT fonts contain a cmap table that map from glyphs to Unicode characters internally, which is much more reliable. <br> <br>Hrant, digital documents have a much longer lifespan than the software and fonts that you use to create them. If you encode a document to display, for example, ffi ligatures by using the increment math symbol character, you've created a document that can only be read in that font or the small number of fonts from Foundry A with the same hack. Meanwhile, Foundry B has put the ffi ligature in a different slot. Of course, your document cannot be spellchecked, cannot be searched, cannot be correctly sorted. And then the 8-bit font format you are using stops being supported by Microsoft (and it will happen to Type 1). So what have you 'invented', except a mess with no long-term usability?</p>"
