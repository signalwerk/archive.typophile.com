    html: <p><i>&gt;Unicode is already the standard. Please stop destroying text to get ligatures.</i> <br> <br>John, I must confess that in my day-to-day professional world, it is not. So, yes, I continue to destroy text to get ligatures. Guilty as charged. I agree with you completely -- in spirit, but not yet in practice. <br> <br>Regarding the Whitman fonts, it's up to FB to specify the formats they wish to offer and support. Within that constraint, I do what I can with what I have to work with. <br> <br>Randy, I believe that Eduardo is right. You must use the OT <i>liga</i> feature to specify the ligature substitution. (John will correct me if I'm wrong.) It is an elegant solution, but it requires software that supports OT layout features in order to implement.  <br> <br>-- K. <br></p>
  - id: 19648
    user_id: 1262
    user_name: John Hudson
