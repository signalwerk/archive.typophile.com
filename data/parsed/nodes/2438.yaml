    date: 2003-12-17T03:12:00
    votes: null
    html: <p>Randy -- <br> <br>If you generate fonts using Adobe Standard Encoding, there are about two dozen miscellaneous "math" characters which will be called from the Symbol font, regardless of whether you draw them or not -- i.e., what you draw in those positions will be ignored. <br> <br>These are the so-called "standard" math symbols you refer to. Your choice whether to use them or not will probably hinge on how important it is to have symbols that blend stylistically with your typeface design (and how much time you want to spend on them). <br> <br>-- K. <br></p>
