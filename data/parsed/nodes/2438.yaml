    html: "<p>Randy -- <br> <br>I drew all of the glyphs in Whitman from scratch. But the Font Bureau's standard character set does not call for all of those math characters; so I didn't draw an integral, for example. They use some of those character slots for other glyphs -- for instance, the ff-ligatures are included standard in FB fonts in the infinity (ffi), plusminus (ffl), and notequal (ff) positions. <br> <br>In addition, I used some of the other positions for other glyphs, not necessarily part of FB's set, like raised parentheses. <br> <br>Another example: I included the multiplication sign in the approxequal slot so that it would be accessible from the Mac keyboard (which it is ordinarily not). I got this idea from Matthew Carter, who did the same for Miller. It's useful for expressions like 2x4 or for botanical hybrid names like <i>Crinum x powellii</i>.  <br> <br>I discuss these unusual features in the  <a href=\"http://www.kentlew.com/Type/WhitmanSpecimen.pdf\" target=\"_blank\">PDF specimen</a> available from my site. The complete character sets can be seen on <a href=\"http://www.kentlew.com/WhitmanCharSet1.html\" target=\"_blank\"> this html page</a>. <br> <br>These sorts of unorthodox arrangements are frowned upon by purists and will be made obsolete and unnecessary as Unicode and OT become more the standard. <br> <br>-- K. <br></p>"
