    html: <p>Thanks Kent. Did you draw them for Whitman? :-) <br>I ask because I'm not sure how important it is that they blend in a font for long text. (I'm finishing up Saint Nicolaus which I posted in the critique section.) <br> <br>Thanks, <br>Randy</p>
