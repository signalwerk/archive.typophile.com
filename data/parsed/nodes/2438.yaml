    date_raw: 17 Dec 2003 — 5:41pm
    date: 2003-12-17T17:41:00
    votes: null
    html: <p><i>IIRC, the only f-ligatures 'unicoded' are fi and fl.</i> <br> <br>There are a few more encoded, but don't use them. They are 'presentation form' characters, only included in Unicode for bakcwards compatibility with existing 8-bit character sets. The whole point of the Unicode character/glyph distinction is that you do not need to encode every visual element, only the underlying text. The word 'office' is encoded as the characters o f f i c and e, regardless of whether the sequence ffi is <i>displayed</i> as a ligature or not. There is no need to encode ligatures. See the introductory part of my article on <a href="http://www.microsoft.com/typography/developers/opentype/default.htm">Windows Glyph Processing</a>. This has been the major development of all new text processing and font technology for almost ten years now.</p>
