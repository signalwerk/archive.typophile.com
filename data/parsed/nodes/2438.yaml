  html: <p>Hi Typophiles. <br> <br>I'm curious about the math symbols found in most fonts (pi, integral, delta, mu, square root etc). As I've taken a survey of fonts, some appear to have drawn font specific math symbols, but many seem to have <i>standard</i> math symbols. Is there a standard set? If so, should I use them? <br> <br>Thanks, <br>Randy</p>
