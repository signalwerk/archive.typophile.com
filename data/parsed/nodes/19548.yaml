    html: |-
      <p>The cut and paste idea could work if you highlighted part of the name, included a cursor and made use of the colour changes you sometimes get with software packages, in other words what you wanted to disguise, at the moment it looks a bit balanced on the J at the bottom of the box. As you note the roots are only sitting on the type, I think the root (sorry:) you should take is using the J and developing from there. In some ways combining the two might work with the box representing sky and breaking the J from the box to have roots stretching into the ground. Have a look at tightening your Pe and Ja kerning.<br>
      Tim</p>
