    <p>im required on my 2nd yr graphic design course to produce a logo for myself, for my portfolio of work, not a great idea i dont think but im doing it anyway.</p>
    <p>I had some quick ideas today that id like to show, to see if anyway could point me in the right direction, theyre quite shabby and by no means finished at all.</p>
    <p>...</p>
    <p>the top one is supposed to be ’highlighted’ as if i have highlighted the word in order to copy it. This idea stems from my work, in which  ’appropriation’ does feature, not plagiarism, obviously i wouldnt want to broadcast this, but i thought it oculd be a sort of ’in joke’ , i htought it could dictate the type treatment of headings etc, possibly</p>
    <p>the others are centered around the idea of ’roots’. Communicating strong foundations, growing talent, researching to the root of a theme etc........at the moment it looks like the roots have just been placed on, theyre only relatively quick versions, but maybe i need some idea of integrating the roots with my name...</p>
    <p>thanks for your help!</p>
    <p>pete</p>
    <p>link:</p>
    <p><a href="http://i21.photobucket.com/albums/b265/jarvisjarvis/logologo.gif" title="http://i21.photobucket.com/albums/b265/jarvisjarvis/logologo.gif">http://i21.photobucket.com/albums/b265/jarvisjarvis/logologo.gif</a></p>
