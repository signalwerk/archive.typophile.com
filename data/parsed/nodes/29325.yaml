    <p>With the olympic games to be held in London in the not so distant future...I have begun to develop an unhealthy obssession with olympic pictograms. As part of my degree research into pictograms I am looking at how the communicate on an international level...but my main fascination is with each olympic pictograms unique style or approach.  my question to you guys is...</p>
    <p>Can pictograms used for Olympic Games work on an international level, yet still retain national characteristics?</p>
    <p>I have lots of research on this area, but what I really want to enhance my research is the opinions of people in the design world and the general public.  Any comments or links to articles/journals/or sites would be greatly appreciated.</p>
    <p>Thanks</p>
