      <p>I did a whole lot of font “editing” with the submissions I processed at T26, from constructing missing glyphs to overhauling or hand-tuning metrics.  Many of the releases after 2001 were collaborative to some extent, whether I applied a hands-on effort or verbal feedback for improvements.  Some designs were submitted as single weights which were then fleshed out into usable families through a collaborative process.  Some submissions were a team-effort before they came in, but the majority were solo endeavors.</p>
      <p>Font Bureau puts some team effort into their releases, from what they express in their submission/publishing terms.  <a href="http://fontbureau.com/submissions/" title="http://fontbureau.com/submissions/">http://fontbureau.com/submissions/</a></p>
