      <p>Many production tasks are often done by individuals other than the designer. Hinting is very often done by others. Some large type family have even been kerned by others.</p>
      <p>OpenType feature programming is on other step which is often done by someone else.</p>
      <p>Of course, there are many designers who do all of these things on their own as well. It depends on the designer, if he works for someone, and who commissioned the fonts (if the fonts were commissioned in the first place). </p>
