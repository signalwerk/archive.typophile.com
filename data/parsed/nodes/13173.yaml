  html: <p>I was looking at a sample of Adobe Garamond Premier Pro and drooling a little when I began to wonder, as I have about faces like Minion Pro, whether the Pro fonts are a team effort? I find it hard to imagine one person sitting and drawing a the complete character set not just once for each weight but then adjusting each weight to achieve the finely balanced “optical” fonts. I suppose they could be using multiple master technology to do some of the work, but no matter how much they automate there is far too much for one person to do by hand. Or is there? And if I’m right, who are these people and what other team efforts exist, and if I’m wrong, what team efforts exist?</p>
  html_clean: <p>I was looking at a sample of Adobe Garamond Premier Pro and drooling a little when I began to wonder, as I have about faces like Minion Pro, whether the Pro fonts are a team effort? I find it hard to imagine one person sitting and drawing a the complete character set not just once for each weight but then adjusting each weight to achieve the finely balanced “optical” fonts. I suppose they could be using multiple master technology to do some of the work, but no matter how much they automate there is far too much for one person to do by hand. Or is there? And if I’m right, who are these people and what other team efforts exist, and if I’m wrong, what team efforts exist?</p>
