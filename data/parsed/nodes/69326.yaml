    <p>Hello, again.</p>
    <p>I'm curious about the new Doctor Who title credits typeface. It's been suggested to me that the font used could be:</p>
    <p>* FF Din Condensed + Alien League<br>
    * Univers Ultra Light Condensed<br>
    * SF Movie Poster Condensed (I believe this is a fanmade version of Univers above, no?)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2r6czep_3749.jpg"></div><p></p>
    <p>Anywho, if someone can tell me exactly which one it is (or if it's different), I'd really appreciate it. Thanks.</p>
