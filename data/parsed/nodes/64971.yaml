  html: |-
    <p>Hey Guys and Girls,</p>
    <p>I have an annoying problem. How do I import kerning from a text file into Fontlabs metric window?? I have tried various methods, but either I get only one line at a time, or I should up the arrow and select one line at a time!<br>
    There must be a way where I can see and test the full text?</p>
    <p>Thanks for any help!!<br>
    Morten</p>
