    html: <p>You may want to loosen up and try "!?$" again; they're rather rigid as compared to your alphanumerics. Actually, don't bother drawing a new dollar sign, just put a stroke through the big S you have and that would look great. Try to draw a question mark that looks appropriate next to your P.</p>
