      <p>I think you should take the sizes of the letters into consideration. Right now there are a lot of different sizes and this will cause certain letters to stand out more in text.<br>
      What if I want to spell zebra? z_____ebra.</p>
      <p>I really like the numbers but I feel they don't match the rest of the set very well. They feel more controlled.</p>
