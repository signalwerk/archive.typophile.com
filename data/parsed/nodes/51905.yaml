    html: <p>Unfortunately "LAY" and "TY" are tough letter combinations to get right. I think your best option may be to letterspace them out a bit, especially if you don't want the letters to touch. Or, you could try using a more condensed typeface, Trade Gothic Bold Condensed, or Univers Condensed.</p>
