    html: |-
      <p>Way better. The kerning with 'TYPE' is as good as it can get by itself. The only thing now would be to align the edges of the letters to each other...for instance, aligning the bottom left edge of the L with the right, inside part of the Y, this will 'lock' everything in place.<br>
      Also the line to the most right is kind of far away from the 'Y' creating a more visible part of the word. Since there are two lines in the beginning, that 'cuts' up the word more in the front then in the back. Don't be afraid to take away more of the E. I like the spacing of the last line as it is in picture 3.</p>
      <p>JonE.</p>
    html_clean: |-
