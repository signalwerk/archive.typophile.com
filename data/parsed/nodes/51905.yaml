      <p></p><div class="imageWrap"><img src="http://typophile.com/files/pic3_6011.png"></div><p></p>
      <p>Thanks very much for that suggestion - I've shifted TYPE so the Y and L lined up, and almost magically T lined up with P, and Y with E! Looks a lot better now, cheers.</p>
      <p>I see your point regarding the cropping, although I feel 'E' looks strange when cropped too much, and when the diagonal line is too close to the Y, it creates an awkward trapped space between them. Plus, with there being so much empty space at the bottom left, a little space between Y and the line provides a bit of balance (I think!).</p>
