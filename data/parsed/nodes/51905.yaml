      <p>Thanks for the tips folks. After a bit of tinkering, I think I'm getting there...</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/pic2_5056.png"></div><p></p>
      <p>I much prefer it reversed out, looks more interesting. </p>
      <p>Gerald - L has been extended - you confirmed my concerns about it. Was trying to reduce the negative space between L and A, but I think it's alright now. I've also extended the stem of the T a little.</p>
      <p>Chris - I've spaced them out a bit more, do you think it looks more balanced now? I had tried some condensed faces, but didn't like the results. I'm a huge fan of condensed faces, but on this occasion they didn't suit the sloping lines, and it looked rather squashed. </p>
      <p>Jeo - You're right about the bolder typeface working better. I didn't have a bold enough version of Akkurat, so I've fattened it up a bit. The angled lines are taken from the angle of the Y.</p>
