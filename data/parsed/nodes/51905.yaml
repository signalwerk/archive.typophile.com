    <p>Hi all,</p>
    <p>I'm creating a logo for an imaginary gallery/exhibition dealing with all aspects of typography, that I have named Display/Type.</p>
    <p>I can't seem to get the logo quite right - there are some issues with letterspacing, particularly TYP and LA. Any solutions to the letterspacing, or comments on the logo in general are much appreciated.</p>
    <p>The logo is set in Akzidenz Grotesk, but I'm sure most of you would identify it easily enough =)</p>
    <p>Cheers,</p>
    <p>Gary</p>
