    html: '<p>Try the Latin Modern Fonts LM package (may be the LMsans 9). Free.   <br> <br>Designer Boguslaw Jackowski, writes: "The Latin Modern fonts are based on the Computer Modern fonts released into public domain by AMS (copyright (C) 1997 AMS). They contain a lot of additional characters, mainly accented ones, but not only." This family is free and in type 1 format. Developed by B. Jackowski &amp; J. M. Nowacki thanks to Metatype  <br>Available at: <br><a href="http://dante.ctan.org/CTAN/fonts/ps-type1/lm/fonts/" target="_blank">http://dante.ctan.org/CTAN/fonts/ps-type1/lm/fonts/</a></p>'
