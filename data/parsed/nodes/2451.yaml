  html: <p>A colleague and I are directors for a small print-and-online publishing venture, and we're looking for a sans serif face that will complement our serif face of FF Scala. Scala Sans would be the obvious choice, but the package would exceed our budget (and we are watching our budget closely). <br> <br>We'd like a moderately-priced, distinctive (under-appreciated, not overused) typeface with at least a full family (in a perfect world, we might like some alternate characters, too). We looked at Parisine, but its differences from very familiar faces are more subtle than we might like; at Scala Sans, but we can't afford the whole package; at several other faces as well. Stephen Coles suggested that I raise the question here. <br> <br>We're wondering whether the community at typophile would offer some thought-provoking advice. (Actually, we *know* the community will -- we're hoping that we benefit from it.)</p>
