    html: <p>Thanks, PAtrick and Nick. I&amp;#8217;m looking into the Latin Modern collection. I&amp;#8217;ll run Lux past my colleague; it seems attractive, though the full package wouldn&amp;#8217;t run much less than Scala Sans (at which point we might as well just spend the extra twenty dollars or so). I note that Nick recommended the Scalas in his &amp;#8220;Perfect Set&amp;#8221; article (accessible through the &amp;#8220;Beginning a Font Collection&amp;#8221; thread here.  <br> <br>I wished that my colleague would go for John Sans from Storm, but he thought it too idiosyncratic.</p>
