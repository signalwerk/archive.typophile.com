    html: |-
      <p>I don't know if i should be ashamed or not to say that you're not off to a very good start. The type choices are fairly "system" based and don't give much character to the idea of the company nor play off the name in a figurative or metaphorical way.</p>
      <p>Why is it called Post Industrial? Is this a real company or a student project?</p>
      <p>I'm still very unclear as to what the company does? Provides small business solutions doesn't mean anything. What solutions does it provide? Accounting, design, manufacturing, rich media?</p>
      <p>The name is interesting in that the rise of micro economies is in full force or the D.I.Y. movement as some would call it. What i mean is that the name could infer "being past mass consumerism" and you are a middle man that is bridging the gap between them. Though since we don't know what services you're offering it's hard to tell.</p>
      <p>Steps-</p>
      <p>1. Restate the purpose of the business and what services it specifically provides.<br>
      2. Research the competition to avoid cliches and well know your enemies<br>
      3. Research visual elements, styles that could be used in service of creating variation on the identities.<br>
      4. Find a hybrid of the above, put them togther and bring them back to the forum for a better, insightful critique.</p>
