    <p>There should be a "History" forum here! </p>
    <p>Anyway, I need to cite the birth year or life span of the following type designers for a book I'm finishing up. The Typowiki as well as the Linotype Library and other online resources, and books have been very helpful on other names. Still, I can't find DOBs for: </p>
    <p>Victor Caruso  (ITC Bauhaus w/Benguiat)<br>
    Joel Kaden (American Typewriter w/Tony Stan)<br>
    Ned Bunnel (Avant Garde Monospaced)<br>
    W.A. Woolley (Braggadocio)</p>
    <p>Thank you for any help/leads.</p>
