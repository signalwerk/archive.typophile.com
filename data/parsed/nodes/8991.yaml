    html: <p>the process was taking the hair taping each seperately and then mixing the shapes i got. after i was happy with one of the form i scanned it and traced it. than i increased the contrast, so it will work even in a small size and different printers.  <br>i have tones of shapes, but at some point you understand (and i know it sounds awkward but that is just the way it is) that hair is some what like a snow falck i mean, all the shapes are different and exciting, and it is an endless resource.  <br>so i just stoped at some point to collect them,</p>
