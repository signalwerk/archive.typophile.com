    html: <p>that is a pretty briliant remark. honestly i didn't think of htat. i was striked by the idea of stroke=hair and the way the stroke weight is changing in hairs. meaning the width of the line of a hair is working different than a pen. but what you say opens up so many options. i think that would be the next step. exploring the split ends. ligatures seems interesting as well. i think i might cpme pu with set of shapes that will work as connecting shapes betweeb two existing shapes. but forgive my ignorance (english is my second language) what do you mean by "discretionary"?</p>
