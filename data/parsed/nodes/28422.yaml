  html: |-
    <p>!Exclamachine Type Foundry has released two new OpenType fonts for mass consumption; <em>!The Black Bloc</em> and <em>!MISQOT</em>. Both typefaces are free for personal or commercial use. Both fonts are previewable and downloadable over at <a href="http://www.exclamachine.com" title="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
    <p>The blackletter-inspired modern serifed titling font "!The Black Bloc" features over 200 glyphs, including full european support and plenty of symbols. Available in a single download with regular, bold, italic and bold italic.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/black-bloc-promo_4077.jpg"></div>"<p></p>
    <p>!MISQOT", A tangled, chunky decorative font with a 'slivered' look is also now available. This font features a full standard character set and extra symbols as well as a small accented character set. Available in regular, demibold and heavy styles.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/misqot_4309.jpg"></div><p></p>
