    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SkolarDevanagari_Slide1_3785.jpg"></div><p></p>
    <p><strong>Skolar Devanagari - A typeface for complex typography</strong></p>
    <p><a class="freelinking external" href="http://www.rosettatype.com/Skolar%20Devanagari" rel="nofollow">Skolar Devanagari</a>, the latest addition to the <a class="freelinking external" href="http://www.rosettatype.com/Skolar" rel="nofollow">Skolar</a> family, is a collaboratiion of David Březina and Vaibhav Singh. It has been designed as a companion to the Latin keeping the nuances and characteristics of the Devanagari script foremost while providing a complementary design for multi-script typography. Primarily intended as a robust, energetic text typeface, <a class="freelinking external" href="http://www.rosettatype.com/Skolar%20Devanagari" rel="nofollow">Skolar Devanagari</a> addresses the needs of serious typography. At the same time it furnishes the designer with the hallmark versatility of the family in display sizes.</p>
    <p>The fonts support Sanskrit, Hindi, Marathi, Nepali, along with a wide range of regional languages that use the Devanagari script (Awadhi, Bhili, Bhojpuri, Garhwali, Gujari, Konkani, Kumaoni, Magahi, Maithili, Marwari, Newari, …).</p>
    <p>The complementary designs (versions: Latin Pro, Cyrillic, Greek, Pan-European, including italics) can be found on the <a class="freelinking external" href="http://www.rosettatype.com/Skolar" rel="nofollow">Skolar page</a>.</p>
    <p>See the specimen at <a class="freelinking external" href="http://www.rosettatype.com/Skolar%20Devanagari" rel="nofollow">Rosetta Type Foundry</a></p>
    <p><strong>We offer 50 % introductory discount on any or all of the four weights (the sale ends on 18 July). </strong></p>
