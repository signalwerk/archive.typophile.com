      <p>"horrid excuse of a font." :) </p>
      <p>But the caps, when used with the alternates can work together. I forget who said that the only place Avant Garde ever looked good was in the nameplate on the magazine. The font was expanded from that. Jeremy Mickel did an impressive and clever job of creating Avant Garde style alternates in huge variety, so that every three letter monogram could be constructed with overlapping letters, like in the original name plate of the magazine.  It's called <a class="freelinking external" href="https://web.archive.org/web/20150317094516/http://www.photolettering.com/plog/2012/aug/21/monograms-titles-or-playtry-sobriquet/" rel="nofollow">Sobriquet</a> He actually improved the horrid C and G by having everything thin and carrying the strokes less far. It still only works with overlaps. </p>
      <p>I definitely disagree on Christian's latest o above. It's too wide. The o an n should have interior counters of about equal area. Otherwise you get uneven color. Christian, look at the *counters* in Garamond. It's those more than the exterior outline that give it its look. The problems with your earlier e didn't relate to its asymmetrical shape, which was good. It was the bumpy interior border of the arch at the top, and having the vertical arch thinner than the horizontal arch.    </p>
      <p>About thickening the vertical arch of the o compared to the horizontal arch. Classically, the vertical arch is fatter than the vertical on the n. But that's really a design decision. However, I think you're just wrong about it working only in a high-contrast font. Look at Myriad. I just checked the o. Vertical arch 89, horizontal arch 66. The vertical is 35% fatter, but it doesn't look high contrast!</p>
      <p>Also *always* look at your letters in context of other letters in your font, if you don't already.</p>
