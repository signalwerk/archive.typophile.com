    <p>I've recently developed the urge to doodle a monolinear sans-serif rendition of Garamond that tries to stay as faithful to the character of the serif source as possible. Now, that seems like a pretty obvious thing to do, and I expected to find a number of fonts online that had pursued exactly that design concept. However, with my very limited overview of the font world, I didn't find any. I suppose Gill Sans Light comes close to that to first order, but upon closer inspection it has a lot of quirks.</p>
    <p>Are there any obvious candidates for that kind of font that I'm not aware of, or is it a concept worth pursuing with a new font project?</p>
    <p>For a test drive, I made a few letters in stroked path mode in FontForge. I quite like the looks of it. I've added a shot of EB Garamond below it for direct comparison:</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150317094516im_/http://typophile.com/files/thalamond_6432.png"></div><br>
    <div class="imageWrap"><img src="https://web.archive.org/web/20150317094516im_/http://typophile.com/files/garamond_5204.png"></div><p></p>
    <p>What do you think? Is it worth pursuing?</p>
    <p>If so, I suppose it's unhealthy to stick with the stroked-path mode, and I should switch over to outline mode as soon as possible. However, I'm having trouble with the "Expand Path" functionality of FontForge; it invariably causes the application to crash. That would considerably increase the amount of work it would cost me to achieve a nice consistent stroke strength. Do you know of any easy solutions to that problem?</p>
    <p>Cheers</p>
