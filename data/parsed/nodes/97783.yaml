      <p>A couple weeks ago, Catharsis and I entered into discussion and came to an agreement regarding Eau (temporary working name).   I will now be handling the polishing and completing of the font, while continuing to incorporate Catharsis's opinions on the various proofs.</p>
      <p>When we both agree it is finished, we will be co-releasing it, and sharing all revenue 50/50%.  I imagine in the end I will have put in a lot more hours of work than Catharsis, but without the spark and initial work of Catharsis, Eau would simply never have existed. I count myself as very lucky to be part of this project, and will always view mine and Catharsis's contributions as equal.</p>
      <p>I hope this thread will continue to get the quality of suggestions it has previously.  While perhaps I am slightly more skilled than Catharis, I am certainly no master yet, and can use all the help I can get.</p>
      <p>The first thing I did was to thicken the weight slightly, and take ever so slightly away from the monolinearity of Eau, in order to give it a more (hopefully) elegant sense of "body."</p>
      <p>The spacing is not 100% where I would like it, but I want to get the UC, LC, and figure glyphs down before I attempt to perfect the spacing.  No kerning or ligatures have been created at all yet.</p>
      <p>As Hrant has suggested elsewhere, and as perhaps I have never fully understood until now, the lowercase g has been an ungodly pain, it has required vastly more work than any of the other glyphs, and it still has a ways to go.  I have included it at a large size at the bottom of this proof for closer inspection.</p>
      <p>I have also included at large size other glyphs that I feel need to have kind of "swashy tails."  The tails of the y, the Q, and the R are intended to be the points of highest contrast at the joins in this monolinear design.  They look OK to me but I would appreciate comments.</p>
      <p>I will not be posting any pdfs or otherwise vector-based samples here.  However, I hope by rendering out some large bitmaps it will provide enough to offer accurate opinion on.  Also, if anyone would like to see a particular glyph or word at extra large size, I would be quite happy to create a sample and post it.</p>
      <p>Thanks, all.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AramondTestSpec122012_4170.png"></div><p></p>
