      <p>Hmmm, do you mean it's not a perfect circle?  Because that is true, its more of a horizontally wide oval on the left side, and closer to a perfect circle on the right.  It's more "elongated," you could say, on the left hand side.  If that's what you mean then, yes, that was intentional. It matches the deformation of the Garamond O we are basing it on.</p>
      <p>I want to keep some of the imperfectness of the Garamond here.  I'm not looking to turn this into a perfect geometrical version, to me, that wouldn't be a garamond anymore.  IDK, perhaps I just misinterpreted the use of the world "wobbly?"  I mean, just as a quick example, <a href="http://www.myfonts.com/fonts/type-together/rue-display/regular/" rel="nofollow">this</a> is what I think of when I think of "wobbly."</p>
