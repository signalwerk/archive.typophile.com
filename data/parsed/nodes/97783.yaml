    html: |-
      <p>Alright, there was quite a bit of cleaning up to do. FontForge had a maddening propensity to screwing up one or two random curves in the character set when I tried to add extrema to the expanded paths. For now, I've just generated the fonts without 100% accurate extrema (the points as they come out of the expanding routine seem close enough) and without rounding to integer values (since that makes the lighter weights all wobbly).  They seem to work well in PowerPoint.</p>
      <p>I've settled on five weights so far: Hairline (5), Light (10), Regular (20), Medium (30), Bold (40). The numbers refer to stroke thickness, where 1000 is the font's total height.</p>
      <p>I'm thinking of calling the font <strong>Eau de Garamond</strong>, since it is the spirit of Garamond distilled down to its pure, unembellished, æthereal essence. What do you think?</p>
      <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150317094516im_/http://typophile.com/files/eau_4148.png"></div><p></p>
