      <p>I figured out the problem with FontForge: I wasn't using the latest version... that's what you get when you offer Mac users the choice between a pre-compiled old version and a newer version that you have to compile yourself.  ;o)</p>
      <p>I've finished the lowercase letters now, just to give myself an overview of where this would be going. In all cases, I've tweaked the curves of the sans such as to give me as close an optical match to EB Garamond as I could get, rather than just tracing the inner, outer, or median curves. </p>
      <p>I quite like the results for some letters (especially |t f a e g|), while others are downright ugly (e.g., |x|). The overall appearance is not very cohesive, though.</p>
