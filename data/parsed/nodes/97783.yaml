      <p>Yes, all of the illusions apply to sans serif fonts. When I first saw this section of Briem, I was skeptical. Now when I look it's all crashingly obvious that it's correct. That's what I mean by the eyes learning, which I experienced. What you will experience before your eyes are tuned to seeing the o as too small etc. is that when you do what he says the font will seem more polished and 'right'. </p>
      <p>As far as stress, yes if you want it to look monoline, and that means not actually being monoline, because of the illusions at joins, that verticals seem lighter than horizontals the same thickness, etc.  </p>
      <p>One of the things about type design that still blows me away is that everything has to be different by mathematical measurement than the way it looks to the eye. *Every* character is affected. For example, I couldn't believe I had to spend time 'tuning' the plus sign so that the horizontal and vertical look even, the same. </p>
      <p>Personally, I hate avant garde. The caps used with all the ligatures can work well, but the lower case is just ugly, with its too-wide c and e. But I know when it comes to 'ugly' it's a matter of taste.</p>
