    html: |-
      <p>The problems I have had with the strokes didn't relate primarily to curves of outlines, though these need improving. You can have smooth or bent curves if they make sense with the overall stroke. Lucas de Groot likes to draw his letters by hand first to get an organic feeling. Then to preserve that in the digital font he has those intermediate nodes (between extremes). </p>
      <p>Doing the stuff by hand first is certainly not the only way to do it, but it's one way to make the strokes look logical and organic to start with. </p>
      <p>My problem primary problem with your strokes was that they got thick and thin without any systematic visual logic. You can design stuff anyway you want but without a lot of consistency a design of an alphabet just doesn't hold together. As I wrote earlier in the thread, what the eye expects is pen rules, modified. Absolute consistency is not required, but when you depart from, say stems being the same width, you should have a good reason for it. For example the M strokes are often shrunk a little bit because it is so busy and compact compared to most upper case letters. And you can make the l fatter because it is all alone with space on both sides. If you like Calibri, study it, pasting characters over one another and see what I mean by consistency with exceptions. </p>
      <p>Generally, as I said you are working against expectations of pen logic, with modifications. As far as curves, you need to get to were your stroke is thick to where it's thin in a graceful way. And where the stress is—thicks and thins— has to have some consistency. This is true even when you have a low contrast sans.  </p>
      <p>As far as cuts on the ends of strokes, I don't see a problem with that. I also like the asymmetry in your g, but it still needs some work to iron out some awkwardness. Same with the top of the loop in the a—even though I think your a is already better than those in the Garamond "sans" efforts referenced above. </p>
      <p>You also have problems with widths. Your b looks too wide compared to your c, for example. You really need to put these into familiar words and play with them until they click as far as width and spacing, if they are going to end up being really good. Also usually the bottom left of the b and top right of the q are usually handled similarly, as the q is sort of a rotated b, so there being different here is a question. But there are a lot of problems of consistency, I think.</p>
