      <p>I'm not that impressed with the other attempts to get sans from Garamond, which Claudio posted. That tells me that it's quite a challenge, which is what I suspected. </p>
      <p>I commented here because I thought there was something in the letter shapes that was good. But I also felt that the proportions needed to be harmonized, and the strokes and curves needed some serious work. Christian, what merits this has so far came from you. And the weaknesses. If you have someone 'take it from here', it is sufficiently incomplete that my feeling is that it will will inevitably change and probably lose what good it has. If you had a polished a-z, or even hamburgerfonts, someone else could develop it, but at this point I think it's your baby. Unlike a real baby, you also put it aside and come back to it with fresh eyes later. —I think that's pretty common amongst designers.</p>
