      <p>Catharsis, I would tend to agree that the 'caps must be heavier than lowercase' ideal is a bit overstated, certainly when it comes to a pure monoline font.  Why go through all that trouble to make all the strokes in the lowercase 'appear' to be all the same weight, and then distract away from that effect with a thicker upper case?</p>
      <p>However, you definitely need overshoot in pretty much every font, regardless of if it's a sans or a serif.  The only exception I can think to this rule would be fonts based on old quartz displays.  Think of the <a href="https://web.archive.org/web/20150317094516/http://www.myfonts.com/fonts/linotype/lcd/" rel="nofollow">"fonts"</a> that were built into VCRs and digital watches.  However this is probably mostly a technological restraint, they would have had to use more crystals to do any kind of overshoot.</p>
