      <p>@ Ryan: The |e| and |o| were exactly the same size. I suppose they might look different due to their different proportions, but from what I can tell other fonts (like EB Garamond) also use the same overshoot for |e o| even if the letters have diverging proportions.</p>
      <p>@ William: I've made the |o|, along with |b d p q|, a bit narrower, and I agree it looks rather good. They're probably still a bit wider than the |n|, though.</p>
      <p>I've completed a first round of revising the lowercase letters. How does this look?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rev1_5325.png"></div><p></p>
      <p>I've had some trouble optically correcting |v w y| without making the strokes look wobbly. However, I've had some rather eye-opening aha! moments with |b d p q|, which look a <em>lot</em> better with tapered joins and smooth curves.</p>
      <p>PDF version for free scaling: <a href="ftp://ftp.mpia.de/pub/thalmann/eau/rev1.pdf" title="ftp://ftp.mpia.de/pub/thalmann/eau/rev1.pdf">ftp://ftp.mpia.de/pub/thalmann/eau/rev1.pdf</a></p>
