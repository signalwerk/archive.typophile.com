    html: |-
      <p>Well, in my opinion, and it's not only mine by any means, you can't separate spacing from design of the characters, particularly their widths. I think to get them right you have to put them into words and tune the width and spacing until they are as polished as yes, Myriad—or Frutiger. As Mario Feliciano said to me once: you want beautiful words, not beautiful letters. You can only do that by testing on words. The words need to knit into a unit, and then they need to be able to disappear when you read them in extended reading. </p>
      <p>Am I sure about the b and c? No you have to test and adjust, test and adjust. A way many do is to start with the n and o, and get on, no, noon to work, and then build from there.</p>
