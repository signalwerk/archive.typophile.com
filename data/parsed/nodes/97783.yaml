      <p>The category of 'humanist' sans generally go in this direction by basing their lower case on the oval, rather than the circle. One of the earlier ones, inspired by Jenson rather than Garamond, is Legacy sans. </p>
      <p>I think that one can't capture the whole look of Garamond in a sans. It's impossible first because chopping off serifs doesn't work—you have to change relative widths of characters to get a good rhythm. But the other thing is that most sans are more monoline, and old style serifs have a lot of thick-thin contrast. Particularly with old style, this means that the curves in the interior are different from the exterior.  Here you have followed mainly exterior curves, though not exactly. And that means that the whole has a different feel. For example, the o and d are quite different in Garamond and your sans. </p>
      <p>None of this is to say you can't come up with something great. It's just that you will have to decide what you want to capture of Garamond, and what you are willing to give up. And then you as you progress you will find that to have integrity and coherence in your design, it will start dictating its own rules, independently from Garamond. </p>
      <p>I think you already have a challenge along the line of coherence in that your o is rather geometric, and the circular part of the d is not. Also your a has inevitably changed the relationship of the spaces within the bottom and top parts of the letter, and now looks a bit awkward.</p>
