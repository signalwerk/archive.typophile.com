      <p>@ altsan: I'm not giving up at all. To the contrary, I think teaming up with a pro to do this idea justice is the opposite of giving up.</p>
      <p>As a matter of fact, the letters |a| and |e| that you criticize are the ones that carry the most "Garamond" spirit as I see it. The |a| is my favorite character of Garamond (at least of the prettier realizations of Garamond), and it is also my favorite character of Eau. Clipping its monkey-tail would undo a lot of the font's character and bring it closer to being "just another cutesy sans", as Hrant might put it. As for the |e|'s eye, I was following the Garamond shape more closely in an earlier version (with a soft corner on the bottom right of the eye), but didn't like the looks of it.</p>
      <p>I agree the |g| could stand a bit of rounding. I already smoothed out the shape of the connecting stem between the two stories, which had much more tension in Garamond. Let's see how much smoothing it will stand before it loses touch with the source. I'd rather break some sans conventions than give up the premise. </p>
      <p>As for evoking a hand-written feel, isn't that what humanist fonts are all about?  ;o) Some glyphs in my draft does give me a somewhat clumsy hand-written vibe, but they're different ones that the ones you mention. What I don't like is |v x y|. They look like they're built from toothpicks next to the more alive- and grounded-looking other glyphs. Don't know what to do about that, though. The teeny weeny tip the |y|'s tail is particularly oogly, I think I'll have to take some liberties there. Maybe treat the tip as a serif, as you suggested for |a|...</p>
