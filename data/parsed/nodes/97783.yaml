      <p>Don't give up, I think this has promise!</p>
      <p>Whatever the opinion of an amateur such as myself is worth, here are some of my immediate impressions...</p>
      <p>It looks quite 'casual' at a glance, as if it's meant to evoke neat-ish hand printing with a pencil.  If that's what you're going for then it's pretty nice.  On the other hand, that doesn't really mesh with 'faithful evocation of Garamond' in my mind.  On closer examination, I think it's only a few elements that create that casual effect.</p>
      <ul>
      <li>The tail of the /a: It extends too much for a 'serious' looking sans in my opinion.  It's reminiscent of the 'monkey tails' in <a href="http://en.wikipedia.org/wiki/File:D%27Nealian_Manusript.png" rel="nofollow">this type of</a> child's manuscript model.
      <p>I realize it's a faithful interpretation of the Garamond /a's tail, but I think you're being a bit too literal.  Surely it's the <em>spirit</em> of Garamond you want to capture more than the rigid shapes.  If it helps, imagine that the tapering end of Garamond-a's tail is a serif rather than a base stroke.  You dropped the serif from the top of the /a, the bottom should balance out in similar fashion.  (Or so it seems to me.)</p>
      </li><li>The upper-right curvature of /e seems to point a bit too much upward and to the right.  I think you've focused on matching the top curve of the Garamond /e at the expense of losing the characteristic shape of the eye's outside-right.
      </li><li>The tail of /g just doesn't seem harmonious with the rest of the font.  I think it comes across as too 'pointy' on the right, which feels slightly disruptive.
      </li></ul>
      <p>Otherwise, I think you've got something with definite potential here.  Besides the elements I mentioned, i quite like the overall shape and feel.</p>
    html_clean: |-
