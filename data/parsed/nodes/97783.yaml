      <blockquote><p>Now, that seems like a pretty obvious thing to do, and I expected to find a number of fonts online that had pursued exactly that design concept. However, with my very limited overview of the font world, I didn't find any.</p></blockquote>
      <p>There are at least three: <a href="https://web.archive.org/web/20150317094516/http://www.myfonts.com/fonts/itc/claude-sans/?refby=typographica" rel="nofollow">Claude Sans</a>, <a href="https://web.archive.org/web/20150317094516/http://commercialtype.com/typefaces/marian" rel="nofollow">Marian 1554</a>, and <a href="https://web.archive.org/web/20150317094516/http://www.myfonts.com/fonts/canadatype/aragon-sans/?refby=typographica" rel="nofollow">Aragon Sans</a>. That doesn’t mean there&nbsp;isn’t room for other interpretations, of course. You would also want to steer clear of <a href="https://web.archive.org/web/20150317094516/http://www.myfonts.com/fonts/ef/today-sans/?refby=typographica" rel="nofollow">Today Sans</a> and <a href="https://web.archive.org/web/20150317094516/http://www.myfonts.com/fonts/adobe/cronos/?refby=typographica" rel="nofollow">Cronos</a>, but if you haven’t seen those maybe it’s best not to look at all so you won’t be in danger of being subconsciously influenced. I think your concept of following the structure of Garamond is a good one. Just don’t trace the model too strictly — use your own ideas to make it work as a sans.</p>
