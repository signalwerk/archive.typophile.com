      <p>Caps being heavier than lower case is a complicated subject. Partly, you just need to make them a little heavier because they have bigger internal spaces. So to at least match the 'color' (grey density) of the lower case, they need to be a little heavier. Old style fonts had caps a lot heavier, and with more space between them and the lower case than between lower case characters. </p>
      <p>But whether to really overweight them is a design decision, not one of basic craft. The argument for that is that the caps are a different alphabet, and they are used as markers of beginning of sentences, etc., so having them heavy they serve more as markers. On the other hand, they disrupt the color and flow of the text more. In sans, the tendency these days seems to be to make the cap height relatively low, and keep the weight of them more matching. Personally I'm not crazy about this, but it's really arguable either way, and depends on the design.</p>
    html_clean: |-
