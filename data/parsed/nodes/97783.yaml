    html: <p>Your overall letter shapes have got some nice asymmetry into them, which is  working in mass, but you have some seriously wonky curves and weights that need fixing, in my opinion, before you get to kerning. For example (I am looking at regular only) the shoulder of your 'n' is thinner than the join, the opposite of normal, and I don't think looks good big. Your 'e' has some awkward flattening between 12 and 1:30, and the vertical stem is thinner than the top horizontal, which again I question. In general you are not following normal latin stress—thick vertical, thin horizontal—or old style, which is thinner in circular curves at 4:30 and 10:30, and thicker at 1:30 and 7:30. In a sans reducing these stresses is normal, but if you are going to reverse them it needs to be systematically and with a specific goal in mind,  which I'm not feeling here.</p>
