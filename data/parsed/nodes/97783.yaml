      <p>On polishing this. First, I would read the short monograph The Stroke, by Gerrit Noordzij, which is originally in Dutch (I see you are Dutch), about the history of scripts. And then try doing Garamond with a broad marker. It's impossible, because type departs from natural strokes, but trying will give you the idea of the basis of old style letters, and what the eye expects. It will give you an idea of how type typically departs also. When you design something, you are playing against that expectation of broad pen 'rules'. Eg if you don't follow the bolder down-stroke, lighter up-stroke rule, and make them all uniform parts of the W will look fat. You will see where the joins are automatically thinned and thick, etc. You can break the rules, but if you do it should be systematically, for a purpose.  </p>
      <p>A second thing is to familiarize yourself with the optical illusions that are always at play in type design. A good summary is <a class="freelinking external" href="https://web.archive.org/web/20150317094516/http://briem.net/" rel="nofollow">here</a>, but you need to nagivate to type design/basics/illusions. </p>
      <p>These two will only take a few hours, and will up your game very quickly. The second thing is, to get an idea of professional quality curves, compare your glyphs to those of say Frutiger's self-named face or his Avenir. He is a real master, and remember you are competing with him! When I say compare, I mean paste one over the other and visa versa in Fontlab. </p>
      <p>Hrant is right that different weights will inform one another. But if you are eager to get a first version out, then I would suggest just getting the regular very polished. You can always do a 2.0 version later...</p>
      <p>ps I don't know about Font Forge, but I suspect it is an obstacle. If you try one of the other font editors out there, it may help.</p>
