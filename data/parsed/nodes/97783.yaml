      <p>Thanks for the replies, everyone. I don't think I'll make this my main project at the moment, but I'll keep it around in case more inspiration (or boredom) strikes.</p>
      <p>@ Stephen: I had a look anyway, and I'm glad I did.  ;o)  Pretty much all of those fonts seem to take a notably different route. They generally have a certain "calligraphic" feel to me due to their modulated strokes (except for Marian, which is really more of a slab serif than a sans). Also, from what I can tell they make a lot of concessions to the common wisdom of sans design — large x-heights, for example. My impression is that a simple, truly monolinear (or at least optically so) sans that sticks to the proportions of the original Garamond is still an unfilled niche, though whether anyone has a use for that is another question entirely...</p>
      <p>@ William: Very good points, thanks. I'm aware that I can't fully reproduce Garamond in this medium, but I'd at least like to provoke a sense of recognition — "hey, that's Garamond!" — at first sight. As for the overall curve philosophy; true, I'd have to make a decision about that soon. My gut feeling is to go for a slightly diagonalized |o| rather than a circularized |d|. It's true that I've mostly followed outer curves so far; that came from the fact that I wanted the letters to retain their original "girth". The Garamond |G| looks quite wide, and tracing its spine resulted in a narrower look (I tried it). I'm not quite sure what you mean about the |a|; its bowl is also smaller than the space above it in the original... and I rather like its current shape.</p>
      <p>@ Hrant: The main use I envision would be for display in large sizes, or maybe for short passages at medium sizes. I think my monolinear and conservative approach would break down at heavy weights (perhaps even at Regular), so I might only produce Light and Hairline versions. Whether or not there's a market for that, I have no idea. Think there is?</p>
      <p>@ Eliason: Thanks for the link. I especially like the Nota font mentioned in that thread. I'll put in on my list of fonts to buy once I start to make money with my own (still waiting on MyFonts to get back to me!), but its tittles feel a bit misaligned to me, so it's probably not going to end up on the top.</p>
